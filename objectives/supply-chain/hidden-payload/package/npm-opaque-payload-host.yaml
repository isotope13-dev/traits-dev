# Encryption and platform restrictions alone do not establish a payload.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json, data, npm]
  attack: T1195.002,T1608.001,T1027.013

composite_rules:
  # The package's own code travels as password-encrypted `.sll` containers
  # that it decrypts and require()s at runtime, so none of the logic that runs
  # is reviewable in the published tarball. Encrypting shipped JavaScript has
  # no bearing on what the code does; it only keeps registry scanners and
  # reviewers from reading it. The loader dependency and the decrypt-and-load
  # helper are separate members, hence archive scope.
  - id: npm-package-runs-encrypted-bundled-modules
    desc: npm package runs code it ships encrypted
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [npm, package.json, javascript, typescript]
    attack: T1195.002,T1027.013
    all:
      - id: well-known/lib/crypto/secure-library-loader::npm-dependency
      - id: well-known/lib/crypto/secure-library-loader::bundled-encrypted-module-loader
