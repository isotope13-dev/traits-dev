# Runtime activation of encrypted modules requires loader evidence.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, package.json, javascript, typescript]

composite_rules:
  - id: npm-package-runs-encrypted-bundled-modules
    desc: npm package runs code it ships encrypted
    crit: suspicious
    conf: 0.9
    scope: archive
    attack: T1195.002,T1027.013
    all:
      - id: well-known/lib/crypto/secure-library-loader::npm-dependency
      - id: well-known/lib/crypto/secure-library-loader::bundled-encrypted-module-loader
