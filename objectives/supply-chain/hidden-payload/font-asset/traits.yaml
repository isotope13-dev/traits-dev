# Packages that ship a font as cover.
#
# Every registry ecosystem copies `public/fonts/`, `static/`, `assets/` and
# `share/fonts/` verbatim into the installed tree, and no reviewer, linter or
# diff tool looks inside a `.woff2`. That makes a font the cheapest durable
# hiding place in a package, and two shapes recur:
#
#   1. The font is not a font. The bytes are a script or a blob, and something
#      else in the same package names that path as an interpreter argument or
#      module specifier. The pieces are individually unremarkable and live in
#      different files — only package scope joins them.
#   2. The font is a real font that renders correctly, and carries bytes its
#      table directory does not claim.
#
# These are ecosystem-independent by construction: the legs are a file-format
# verdict and a code/config reference, neither of which is npm- or PyPI-
# specific, so the same rules cover npm, PyPI (wheel and sdist), crates.io,
# RubyGems, NuGet, Go module zips, and a bare source tarball.
defaults:
  platforms: [unix, windows]
  for: [npm, whl, python-sdist, crate, gem, nupkg, egg, conda, zip, tar, archives]
  attack: T1195.002,T1036.008
  mbc: B0030

composite_rules:
  # The payload and its loader, shipped together. The font-named file is not a
  # font, and another file in the package hands that path to an interpreter or
  # a module loader. Neither half is reachable from the other without package
  # scope, and no legitimate package has either.
  - id: package-executes-its-own-fake-font
    desc: Package runs a font-named file that is not a font
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1036.008,T1059
    scope: package
    all:
      # Not `font-no-signature`: a payload that types as a PE, a ZIP or a
      # script never reaches the font analyzer at all, so keying on the font
      # verdict alone missed exactly the cases with the most capable payloads.
      - id: objectives/evasion/masquerade/extension-mismatch::font-named-file-is-not-a-font
      - id: objectives/evasion/masquerade/extension-mismatch::font-path-executed-by-interpreter

  # A real, rendering font carrying bytes no table claims, in a package that
  # also runs code at install time. The font is the storage and the hook is the
  # retrieval opportunity; either alone is ordinary, and the pairing is the
  # staged-payload shape.
  - id: package-font-stowaway-with-install-hook
    desc: Package font hides data and runs on install
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1027.003,T1546.016
    scope: package
    all:
      - id: objectives/anti-static/obfuscation/payload/font::font-carries-unclaimed-payload
      - id: metadata/registry::registry-install-hook

  # Same stowaway, no install hook — the package still has to read those bytes
  # back somehow, and a font path reaching an interpreter or module loader is
  # how. Distinct from `package-executes-its-own-fake-font`: there the font was
  # never a font; here it renders correctly and hides the payload in its gaps,
  # which survives anyone who opens the file to check.
  - id: package-font-stowaway-with-loader
    desc: Package loads a font that hides data
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1027.003,T1059
    scope: package
    all:
      - id: objectives/anti-static/obfuscation/payload/font::font-carries-unclaimed-payload
      - id: objectives/evasion/masquerade/extension-mismatch::font-path-executed-by-interpreter
