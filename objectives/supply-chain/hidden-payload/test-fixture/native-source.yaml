# A payload hidden in a project's own unit-test source.
#
# The sendmail 8.12.6 trojan of 2002 added three things to `libsm/t-shm.c`, a
# file `make check` compiles and runs: a multi-kilobyte `unsigned char
# sm_base64_data[]` of uuencoded text, a hand-rolled 6-bit decoder writing it
# to a relative path, and `system("sh ./test")`. Nobody reads a test fixture,
# nobody diffs a byte array, and the payload never appears in the shipped
# binary -- it exists only while the maintainer builds.
#
# The xz backdoor is the same idea with the carrier moved into `tests/files/`.
# What is stated here is the C-source form: a large opaque literal array, a
# custom bit-twiddling codec, and an interpreter launched on a file the same
# translation unit just wrote.
defaults:
  platforms: [unix]
  for: [c, cpp, text]
  attack: T1195.002,T1027
  mbc: B0024

traits:
  - id: char-array-initialiser
    desc: Char array with an initialiser
    crit: component
    conf: 0.9
    # The declaration only. How large and how opaque the array is comes from
    # parsed literal facts below rather than from this pattern -- a regex
    # counting characters inside a quoted run is both slower and blind to the
    # common case where the literal begins on the line after the brace.
    if:
      type: text
      regex: '(unsigned\s+)?char\s+\w{1,24}\s*\[\s*\]\s*='

  - id: long-opaque-source-literal
    desc: Very long opaque string literal
    crit: notable
    conf: 0.9
    # Measured from the parsed literals, not matched. Sendmail's trojanized
    # t-shm.c carries a 3820-character literal; the pristine file's longest is
    # 82. No hand-written message in a unit test approaches this.
    if:
      type: metrics
      field: strings.max_length
      min: 400

  - id: long-source-literal-resembles-code
    desc: Long source literal resembles embedded code
    crit: notable
    conf: 0.88
    # The parser's own judgement that some literal in this translation unit
    # reads as program text rather than data. Independent of how the payload
    # is encoded, so a base64, hex, or gzip-armoured variant still lands here.
    if:
      type: metrics
      field: strings.embedded_code_candidates
      min: 1
    # The candidate heuristic can flag short error messages. Those cannot
    # carry the concealed program this trait describes.
    unless:
      - type: metrics
        field: strings.max_length
        max: 399

  - id: six-bit-codec-macro
    desc: Hand-rolled 6-bit encode or decode macro
    crit: suspicious
    conf: 0.93
    # `#define DEC(c) (((c) - ' ') & 077)` -- uuencode's alphabet, written out
    # by hand because linking a real codec would be conspicuous.
    if:
      type: text
      regex: '#\s*define\s+\w{1,16}\(c\)\s*\(*\(*\(c\)[^\n]{0,24}&\s*0?77'

  - id: interpreter-runs-relative-written-file
    desc: Runs an interpreter on a relative path
    crit: suspicious
    conf: 0.92
    # `system("sh ./test 2>/dev/null")` -- the argument is a shell and a path
    # in the build directory, not a system utility.
    if:
      type: text
      regex: '\b(system|popen|execl)\s*\(\s*"(/bin/)?(sh|bash|perl|python[23]?)\s+\.?/'

composite_rules:
  - id: source-fixture-decodes-and-runs-payload
    desc: Source decodes an embedded blob and runs it
    crit: hostile
    conf: 0.96
    all:
      - id: char-array-initialiser
      - id: long-opaque-source-literal
      - id: interpreter-runs-relative-written-file
    # Corroboration that the blob is a program rather than data: a hand-rolled
    # codec decodes it, the parser reads it as code, or the same translation
    # unit writes it out to a file before running it.
    any:
      - id: six-bit-codec-macro
      - id: long-source-literal-resembles-code
      - id: micro-behaviors/fs/file/write/direct::c-fopen-overwrite-mode
