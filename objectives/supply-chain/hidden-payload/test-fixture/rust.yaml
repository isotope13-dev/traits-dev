# A unit test can invoke a remote script or an encoded command that reads a
# local file slice. Keep the two evidence strengths separate: an image URL
# near the latter does not bind the response bytes to the evaluated range.
defaults:
  platforms: [linux, macos, windows]
  for: [rust]
  attack: T1195.001,T1059

composite_rules:
  - id: rust-test-runs-remote-payload
    desc: Rust unit test runs a remote payload
    crit: hostile
    conf: 0.95
    near_lines: 20
    all:
      - id: metadata/package/testing/harness/unit::rust-test-attr
      - id: micro-behaviors/process/create/shell/pipeline::spawned-curl-shell-pipeline
    unless:
      - id: micro-behaviors/process/create/shell/pipeline::illustrative-evil-host-pipe
      - id: well-known/tool/detection/

  - id: rust-test-runs-encoded-file-range
    desc: Rust unit test runs encoded file-range command
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/testing/harness/unit::rust-test-attr
      - id: objectives/execution/interpreter/script/embedded::rust-downloaded-image-range-script-loader
