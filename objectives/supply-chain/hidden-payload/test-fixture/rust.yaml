# A Rust unit test can invoke an encoded command that reads a local file slice.
# An image URL nearby does not bind response bytes to the evaluated range.
defaults:
  platforms: [linux, macos, windows]
  for: [rust]
  attack: T1195.001,T1059

composite_rules:
  - id: rust-encoded-file-range-test-cooccurrence
    desc: Encoded file-range launcher beside Rust tests
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/testing/harness/unit::rust-test-attr
      - id: objectives/execution/interpreter/script/embedded::rust-downloaded-image-range-script-loader
