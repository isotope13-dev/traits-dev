# A crate whose unit tests run its remote-payload launcher: `cargo test` in
# any checkout, CI job, or dependency audit executes the download. Tests are
# where maintainers and reviewers run code without reading it, and a test
# has no reason to pipe a fetched script into a shell or evaluate a slice of
# a downloaded image.
defaults:
  platforms: [linux, macos, windows]
  for: [rust]
  attack: T1195.001,T1059

composite_rules:
  - id: rust-test-runs-remote-payload
    desc: Rust unit test runs a remote payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/package/testing/harness/unit::rust-test-attr
    any:
      - id: objectives/command-and-control/dropper/execution/pipe::spawned-curl-pipe-shell-rce
      - id: objectives/command-and-control/dropper/execution/stego-loader::rust-downloaded-image-range-script-loader
