# A unit test can invoke a remote script or an encoded command that reads a
# local file slice. Keep the two evidence strengths separate: an image URL
# near the latter does not bind the response bytes to the evaluated range.
defaults:
  platforms: [linux, macos, windows]
  for: [rust]
  attack: T1195.001,T1059

traits:
  # Directional binding for the composites below: the hostile shape is a
  # payload smuggled into test code, so the pipe must FOLLOW a test
  # attribute (cargo test executes it in CI). A self-updater's pipeline
  # lives in production code before the test module and does not match.
  - id: rust-test-precedes-curl-pipe
    desc: Test attribute precedes a curl-to-shell pipe
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)#\[(cfg\(test\)|test)\][\s\S]{0,600}(curl|wget)[^|\n]{0,160}\|\s*(ba|z)?sh\b'

composite_rules:
  - id: rust-test-runs-remote-payload
    desc: Rust unit test runs a remote payload
    crit: hostile
    conf: 0.95
    all:
      - id: rust-test-precedes-curl-pipe
      - id: micro-behaviors/process/create/exec/
    unless:
      - id: micro-behaviors/process/create/shell/pipeline::illustrative-evil-host-pipe
      - id: metadata/package/testing/corpus::illustrative-placeholder-pipe-host
      - id: well-known/tool/detection/

  - id: rust-test-runs-encoded-file-range
    desc: Rust unit test runs encoded file-range command
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/testing/harness/unit::rust-test-attr
      - id: objectives/execution/interpreter/script/embedded::rust-downloaded-image-range-script-loader
