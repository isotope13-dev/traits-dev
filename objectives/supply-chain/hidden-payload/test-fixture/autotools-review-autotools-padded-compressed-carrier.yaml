defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: autotools-padded-compressed-carrier
    desc: Autotools loader uses padded compressed carrier
    crit: hostile
    conf: 0.995
    for: [tar, shell, text, data]
    scope: archive
    all:
      - id: metadata/package/testing/corpus/paths::test-fixture-binary-compressed
      - id: metadata/file/text-distribution::repeated-uppercase-padding-runs
    any:
      - id: objectives/execution/payload/script-eval/transformed/shell::autotools-source-tree-payload-loader
      - id: micro-behaviors/data/decode/command::autotools-encoded-carrier-decoding-clues
