# A Melange recipe whose own description calls the package malicious and whose
# pipeline installs an npm module is a packaging step for a malicious npm
# package. The recipe itself is the distribution vehicle: the apk carries the
# npm module that its description names as malicious.
defaults:
  platforms: [linux]
  for: [yaml]
  attack: T1195.002

composite_rules:
  - id: melange-recipe-packages-malicious-npm
    desc: Melange recipe packages a self-declared malicious npm package
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/package/description/disclosure::melange-description-malicious-claim
      - id: metadata/build/package/recipe/melange::melange-recipe-wolfi-keyring
      - id: metadata/build/package/recipe/melange::melange-pipeline-npm-install
