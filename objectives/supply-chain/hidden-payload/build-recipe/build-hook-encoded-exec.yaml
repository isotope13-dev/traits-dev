# Hidden shell execution in a recognized build entry point. Ordinary encoded
# data and background build tasks are insufficient to establish this abuse.
defaults:
  platforms: [unix]
  for: [build, groovy, kotlin, rust, python, shell]
  attack: T1195.002,T1027,T1059.004
composite_rules:
  - id: build-recipe-executes-encoded-shell-payload
    desc: Build recipe runs concealed shell payload
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/config::build-recipe-entry-filename
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
      - id: micro-behaviors/data/string/assembly::reconstructed-command-substitution
    any:
      - id: micro-behaviors/communications/http/download/encoded::encoded-remote-shell-fetch
      - id: micro-behaviors/communications/http/download/encoded::encoded-remote-substitution-fetch

  - id: build-recipe-detaches-encoded-payload
    desc: Build recipe detaches encoded shell payload
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/build/config::build-recipe-entry-filename
      - id: micro-behaviors/process/create/background::subshell-detached-output-discarded
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
