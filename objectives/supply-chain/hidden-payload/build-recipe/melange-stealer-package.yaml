# A Melange recipe whose package name and description both declare a stealer
# while configuring a Wolfi package build is a build recipe for a credential
# or data stealer package.
defaults:
  platforms: [linux]
  for: [yaml]
  attack: T1195.002

composite_rules:
  - id: melange-recipe-packages-stealer
    desc: Melange recipe packages a self-declared stealer package
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/package/name/security-term::melange-name-steal-keyword
      - id: metadata/package/description/disclosure::melange-description-steal-claim
      - id: metadata/build/package/recipe/melange::melange-recipe-wolfi-keyring
