# A `configure` script that reaches the network at build time.
#
# autoconf's contract with the builder is that it probes the local system and
# nothing else. A configure that fetches a helper over cleartext HTTP, writes
# it into the build tree, marks it executable, and runs it has turned the
# victim's build into a dropper -- and every downstream user of the tarball
# runs it before any review of the shipped code.
#
# Worked example: the trojanized libpcap configure, whose fetcher falls back
# through curl/wget/ftp to pull a helper that lands executable in the tree.
defaults:
  platforms: [unix]
  for: [shell, text]
  attack: T1195.002,T1105
  mbc: E1105

composite_rules:
  - id: configure-fetches-runs-remote-helper
    desc: Configure fetches and executes remote helper
    crit: hostile
    conf: 0.96
    # The fetch leg has to be a downloader *invocation*, not the presence of an
    # http:// URL. Every stock autoconf `configure` cites GNU and Austin Group
    # URLs in its comments, does `chmod +x "$as_me.lineno"` for its own
    # line-number script, redirects output to files constantly, and runs
    # `./config.status` -- so the four legs as written convicted the vendored
    # libuv and libev configures inside the passenger gem, and every other
    # autotools tarball. A stock configure never invokes curl or wget; the
    # trojanized libpcap configure this rule was written for does, which is
    # what the worked example above describes.
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/download/cli::fetch-command-position-script
      - id: micro-behaviors/fs/file/write/redirect::shell-file-write-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
