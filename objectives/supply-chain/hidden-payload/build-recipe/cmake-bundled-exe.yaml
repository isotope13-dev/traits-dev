# A CMakeLists.txt that, at configure time, runs a Windows executable
# committed to the source tree and throws away its output turns `cmake ..`
# into a binary launcher that no compiler or code review sees. The 2026
# TrojanPony takeover of Akagi201/learning-cmake added exactly this
# (`execute_process(COMMAND ${CMAKE_SOURCE_DIR}/tools/cmake_config_tool.exe
# ... OUTPUT_QUIET ERROR_QUIET)`) to start a renamed WinGup updater that
# side-loads a trojan libcurl.dll. The double-brace `${{...}}` spelling in that
# commit is a templating artefact, so the matcher tolerates repeated braces.
defaults:
  platforms: [windows]
  for: [cmake, text]
  attack: T1195.002,T1204.002

traits:
  - id: cmake-source-tree-exe-command
    desc: CMake command runs a source-tree .exe
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'COMMAND\s+"?\$\{+CMAKE_(CURRENT_)?SOURCE_DIR\}+/[^\s")]{1,120}\.exe\b'

composite_rules:
  - id: cmake-silent-bundled-exe-launch
    desc: CMake configure step silently runs an executable shipped in the source tree
    crit: suspicious
    conf: 0.9
    for: [cmake]
    near_lines: 10
    all:
      - id: micro-behaviors/process/create/subprocess/launch::cmake-external-process-command
      - id: cmake-source-tree-exe-command
      - id: micro-behaviors/process/stdio/configure::cmake-quiet-process-output

  - id: cmake-silent-launch-of-sideload-kit
    desc: CMake silently runs a bundled exe in a tree that ships a DLL side-load kit
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1574.002
    for: [tar, zip, cmake, pe]
    scope: archive
    all:
      - id: cmake-silent-bundled-exe-launch
    any:
      - id: objectives/evasion/masquerade/dll/proxy::renamed-wingup-updater
      - id: objectives/evasion/masquerade/dll/proxy::curl-export-dll-without-network-import
