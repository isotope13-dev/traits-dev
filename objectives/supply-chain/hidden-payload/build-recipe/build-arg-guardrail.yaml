# Package build recipes (`Rakefile`, `extconf.rb`, `mkrf_conf.rb`, `setup.py`)
# that skip payload execution when invoked with package-building arguments
# (`ARGV[0] != "build"`, `'sdist' not in sys.argv`) so the author can build the
# archive locally without firing or self-deleting the outbound exfiltration logic.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1480,T1041

composite_rules:
  - id: ruby-build-recipe-guarded-exfiltration
    for: [ruby]
    desc: Ruby build recipe skips build and exfiltrates
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: metadata/build/package/recipe/gemspec::ruby-extension-or-rake-recipe
      - id: micro-behaviors/data/control-flow/branch::ruby-build-arg-guard
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: micro-behaviors/process/identity/query/command::whoami-command-backtick
      - id: micro-behaviors/hardware/display/screenshot/unspecified::macos-screencapture-invocation
      - id: micro-behaviors/communications/http/request/encoded::ruby-form-post-base64-destination
      - id: micro-behaviors/data/decode/base64/unspecified::ruby-base64-decode64-call

  - id: python-build-recipe-guarded-exfiltration
    for: [python]
    desc: Python setup.py skips sdist and exfiltrates
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/data/control-flow/branch::python-argv-not-sdist
      - id: micro-behaviors/communications/http/post::python-http-post-request
    any:
      - id: micro-behaviors/process/identity/query/command::python-subprocess-identity-command
      - id: micro-behaviors/hardware/display/screenshot/unspecified::macos-screencapture-invocation
