# Hollow npm carrier whose entry point only re-exports a runtime dependency that
# npm fetches from a disposable serverless, tunnel, or capture host. The
# registry record supplies the name and the entry point; install-time bytes come
# from an operator-controlled endpoint that leaves no registry record. The
# payload is unseen, so the loader itself carries the claim.
#
# No repository-evidence exception: a placeholder or copied repository field
# does not make the remote origin a legitimate dependency source.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: hollow-reexport-ephemeral-host-dependency
    desc: Codeless entry re-exports ephemeral-host npm dependency
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/module-exec::sole-package-require-passthrough
      - id: metadata/package/dependencies/direct-url::npm-ephemeral-host-dependency
    unless:
      - id: micro-behaviors/data/control-flow/module-exec::esm-loader-entry
    downgrade:
      scope: archive
      any:
        - id: metadata/archive/layout::archive-at-least-120-members
        - id: metadata/package/files/included::archive-nested-package-json-entry
        - id: metadata/package/files/dependency::node-modules-path
