# A package's own __init__ fetches code that never shipped in the
# distribution: it clones a public-forge repository with output discarded into
# a dot-directory and puts that directory on the import path. What the package
# executes is whatever the remote repository holds at run time, so the
# published artifact is only a loader for unreviewed code.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1129

composite_rules:
  - id: python-package-init-silent-forge-clone-import
    desc: Package init imports a silently cloned forge repository
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/revision-control/git/transfer::public-forge-git-clone
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
      - id: micro-behaviors/fs/path/hidden::python-path-join-dot-prefix
      - id: micro-behaviors/os/module/search-path::sys-path-mutate
