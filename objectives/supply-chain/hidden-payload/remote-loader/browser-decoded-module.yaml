defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: concealed-browser-module-source
    desc: Imports module from decoded location
    crit: suspicious
    conf: 0.96
    attack: T1027,T1105
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (import)
          arguments: (arguments . (call_expression
            function: [(identifier) (member_expression)] @decoder
            arguments: (arguments . (string))))) @load
          (#match? @decoder "^((window|globalThis|self)\\.)?atob$"))
        ((statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @decoded
            value: (call_expression
              function: [(identifier) (member_expression)] @decoder
              arguments: (arguments . (string)))))
          . [(return_statement (call_expression function: (import)
               arguments: (arguments . (identifier) @source)) @load)
             (expression_statement (call_expression function: (import)
               arguments: (arguments . (identifier) @source)) @load)])
          (#match? @decoder "^((window|globalThis|self)\\.)?atob$")
          (#eq? @decoded @source))
