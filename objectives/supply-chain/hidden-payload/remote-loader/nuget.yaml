# NuGet package concealing a remote-loader executable dropper.
defaults:
  platforms: [windows]
  for: [nupkg, pe, dll]
  attack: T1195.002,T1105

composite_rules:
  - id: nuget-package-hidden-payload-dropper
    desc: NuGet package contains managed library with executable dropper
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: objectives/command-and-control/dropper/file-exec/spawn::dotnet-httpclient-temp-execute-dropper
