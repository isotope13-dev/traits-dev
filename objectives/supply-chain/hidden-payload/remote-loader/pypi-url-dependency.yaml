# PyPI sdist whose only runtime is a PEP 508 direct URL in install_requires:
# pip resolves the hollow top-level package, then fetches bytes from a host
# the registry never reviewed. Scored on the delivery chain (mutable off-registry
# tarball plus empty module), not on the fetched payload.
defaults:
  platforms: [unix, windows]
  for: [python-sdist, tar, zip, python, pkginfo]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: pypi-sole-off-registry-url-dependency-carrier
    desc: PyPI sdist sole off-registry URL dependency carrier
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/dependencies/direct-url::setup-install-requires-pep508-direct-url
      - id: metadata/package/dependencies/declaration::install-requires-assignment
      - id: metadata/package/dependencies/declaration::install-requires-list-open
      - id: metadata/package/placeholder::python-module-name-version-assignments
    unless:
      - id: metadata/package/dependencies/declaration::install-requires-comma
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component

  - id: pypi-sparse-sdist-off-registry-tarball-redirect
    desc: Sparse PyPI sdist redirects install to off-registry tarball
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/dependencies/direct-url::setup-install-requires-off-registry-tarball
      - id: metadata/package/dependencies/declaration::install-requires-assignment
      - id: metadata/package/dependencies/declaration::install-requires-list-open
      - id: metadata/file/profile/structured::python-core-metadata-sparse-fields
      - id: metadata/file/size::small-no-imports
    unless:
      - id: metadata/package/dependencies/declaration::install-requires-comma
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
