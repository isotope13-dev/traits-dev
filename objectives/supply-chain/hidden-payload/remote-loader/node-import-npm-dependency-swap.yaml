defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.007,T1195.002
  mbc: B0024
traits:
- id: node-import-triggers-clsx-js-package-swap
  desc: Library import replaces clsx-js package
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /execSync\s*\(\s*["']npm uninstall clsx-js\s*&&\s*npm install clsx-js["']/is
          $b0_1 = /stdio\s*:\s*["']ignore/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                true
              )
            )
          )
      }
composite_rules: []
