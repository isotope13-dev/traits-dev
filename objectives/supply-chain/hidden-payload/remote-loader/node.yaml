defaults:
  platforms: [unix, windows]
  attack: T1105,T1059.007,T1195.002
  mbc: B0009.016

traits:
  - id: node-http-response-module-compile
    desc: Compiles JavaScript obtained from an HTTP response
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)http\.request\s*\([\s\S]{0,1200}\.on\s*\(["'']end["''][\s\S]{0,500}new\s+Module\s*\([\s\S]{0,400}\._compile\s*\(\s*code'
  - id: node-remote-response-eval-with-environment
    desc: Sends process environment and evaluates an HTTP response
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:axios[\s\S]{0,25000}process\s*\.\s*env[\s\S]{0,25000}eval\s*\(\s*r\.data|String\.fromCharCode[\s\S]{0,25000}process\s*\.\s*env[\s\S]{0,25000}eval\s*\(\s*r\.data)'
  - id: node-remote-response-eval-with-host-profile
    desc: Posts host profile and evaluates an HTTP response
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)axios[\s\S]{0,5000}(?:os\.hostname\(\)|os\.userInfo\(\))[\s\S]{0,5000}eval\s*\(\s*r\.data'
  - id: node-obfuscated-axios-env-response-eval
    desc: Obfuscated Axios loader submits npm environment and evaluates response
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)require\s*\(\s*hl\[1\]\s*\)\s*\[\[hl\[2\]\]\]\s*\(\s*hl\[3\]\s*,\s*\{\s*\.\.\.process\.env\s*\}[\s\S]{0,600}eval\s*\(\s*r\.data'
  - id: node-axios-obfuscated-response-eval
    desc: Obfuscated Axios client evaluates executable server response
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)axios[\s\S]{0,15000}eval\s*(?:\(\s*\w+\s*\[\s*["'']data|,\s*\w+\s*\[\s*["'']data)'
  - id: node-axios-obfuscated-response-eval-indexed-field
    desc: Obfuscated Axios client evaluates indexed response field
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)axios[\s\S]{0,20000}eval\s*(?:,|\()\s*\w+\s*\['
  - id: node-axios-response-eval-model
    desc: Axios callback evaluates a remote model response
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)axios\s*\.\s*post\s*\([^;]{0,700}\)\s*\.then\s*\(\s*\(?r\)?\s*=>\s*\{?\s*eval\s*\(\s*r\.data\.model'
  - id: node-axios-response-new-function
    desc: Axios response is evaluated with the JavaScript Function constructor
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)axios\s*\.\s*get\s*(?:<[^>]{0,80}>\s*)?\([\s\S]{0,1500}new\s+Function\s*\(\s*["'']require["'']\s*,\s*\w+(?:\.response\.data\.\w+)?\s*\)[\s\S]{0,180}(?:\w+\s*\(\s*require\s*\)|\(\s*require\s*\))'
  - id: node-base64-http-response-function-loader
    desc: Base64 decodes a remote response and executes it with Node require
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:fetch\s*\(|\.fetch\s*\()[\s\S]{0,1800}(?:arrayBuffer\s*\(\)|\.text\s*\(\))[\s\S]{0,1000}Buffer\.from\s*\([^\n]{0,250}base64[\s\S]{0,600}new\s+Function\s*\(\s*["''](?:rqr|require)["'']\s*,\s*\w+\s*\)[\s\S]{0,200}\w+\s*\(\s*require\s*\)'
  - id: node-axios-xor-decoded-pe-download-exec
    desc: Downloads an executable, XOR-decodes it, writes it to disk and launches it
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)axios\.get\s*\([\s\S]{0,1200}responseType\s*:\s*["'']arraybuffer["''][\s\S]{0,1500}Buffer\.from\s*\(\s*\w+\.data\s*\)[\s\S]{0,1500}\^=\s*0x[0-9a-f]{4,}[\s\S]{0,1200}0x4d[\s\S]{0,100}0x5a[\s\S]{0,1800}writeFile\s*\([\s\S]{0,1000}exec\s*\('
  - id: node-postinstall-oast-profile-get
    desc: npm postinstall sends host or environment profile to OAST
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:Object\.keys\s*\(\s*process\.env\s*\)|os\.hostname\s*\(\))[\s\S]{0,6000}oastify\.com[\s\S]{0,1000}method\s*:\s*["'']GET'
  - id: node-oast-dns-hex-and-http-profile-beacon
    desc: Sends collected developer and CI profile data in DNS hex labels and HTTP POSTs to OAST
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)gh_user[\s\S]{0,3000}npm_user[\s\S]{0,3000}Buffer\.from\s*\(\s*body\s*\)\.toString\s*\(\s*["'']hex["'']\s*\)[\s\S]{0,2000}dns\.resolve\s*\([\s\S]{0,4500}method\s*:\s*["'']POST[\s\S]{0,1000}req\.write\s*\(\s*body'
  - id: npm-install-oast-ping-command
    desc: npm install hook pings an OAST callback domain
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: '(?is)"(?:preinstall|install|postinstall)"\s*:\s*"[^"\n]{0,300}ping\s+[^"\n]{1,120}(?:burp\.attack\.live|oastify\.com|oast\.fun)'

composite_rules:
  # An install hook that retrieves JavaScript and evaluates the response as a
  # new module. The downloaded code is an unpinned second stage.
  - id: npm-postinstall-http-response-module-loader
    desc: npm postinstall downloads and compiles remote JavaScript
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar]
    scope: archive
    near_bytes: 1400
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: node-http-response-module-compile
  - id: node-remote-response-eval-with-environment-exfil
    desc: Remote response evaluation receives npm environment variables
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-remote-response-eval-with-environment
  - id: node-remote-response-eval-with-host-profile-exfil
    desc: Remote response evaluation follows host profile disclosure
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-remote-response-eval-with-host-profile
  - id: node-obfuscated-axios-env-response-eval-exfil
    desc: Obfuscated remote module receives npm environment and executes response
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-obfuscated-axios-env-response-eval
  - id: node-axios-obfuscated-response-eval-loader
    desc: Axios client evaluates remote server response
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-axios-obfuscated-response-eval
  - id: node-axios-obfuscated-indexed-response-loader
    desc: Axios client evaluates an obfuscated indexed server response
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-axios-obfuscated-response-eval-indexed-field
  - id: node-axios-response-eval-model-loader
    desc: Axios callback executes a remote JavaScript model
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-axios-response-eval-model
  - id: node-axios-response-function-loader
    desc: Axios response is executed as a Node.js module
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-axios-response-new-function
  - id: node-base64-http-response-function-execution
    desc: Remote base64 JavaScript is executed with Node require
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-base64-http-response-function-loader
  - id: node-axios-xor-pe-dropper-execution
    desc: Axios-delivered XOR-obfuscated Windows executable is written and launched
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-axios-xor-decoded-pe-download-exec
  - id: npm-postinstall-oast-profile-disclosure
    desc: npm postinstall sends host and environment metadata to OAST
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: node-postinstall-oast-profile-get
  - id: npm-preinstall-oast-dns-http-profile-exfil
    desc: npm preinstall exfiltrates developer and CI identity through OAST DNS and HTTP
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: node-oast-dns-hex-and-http-profile-beacon
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: npm-install-oast-ping-beacon
    desc: npm install hook triggers an OAST ping callback
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: npm-install-oast-ping-command
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook

  # A package function that downloads code from a mutable branch, overwrites a
  # local module, and requires that module delegates execution to the branch.
  - id: node-mutable-branch-write-require-loader
    desc: Downloads mutable code, overwrites and requires module
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, package.json, javascript, typescript]
    scope: archive
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/url/path::mutable-branch-ref-path
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-host-reference
      - id: micro-behaviors/fs/write/file/content::js-file-write
      - id: micro-behaviors/fs/path/self::script-dirname-ref
      - id: micro-behaviors/os/module/load/path::cjs-local-require-call
      - id: metadata/import/npm/relative/1/index::relative/1/index
