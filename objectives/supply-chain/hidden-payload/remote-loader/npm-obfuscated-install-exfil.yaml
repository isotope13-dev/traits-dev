  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/supply-chain/hidden-payload/remote-loader::npm-postinstall-imports-known-malicious-rest-utils
