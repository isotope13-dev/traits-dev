defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1552.001,T1195.002
  mbc: E1041
traits:
- id: npm-postinstall-imports-known-malicious-rest-utils
  desc: Postinstall imports credential-stealer package
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: text
    regex: (?is)"webservices\.rest-utils"\s*:\s*"\^1\.0\.8"
- id: npm-entrypoint-requires-known-malicious-rest-utils
  desc: Entrypoint imports webservices.rest-utils
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: (?is)require\s*\(\s*["']webservices\.rest-utils["']\s*\)
- id: npm-cloud-metadata-profile-chunked-http-exfil
  desc: Sends cloud metadata in HTTP chunks
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(169\.254\.169\.254|metadata\.google\.internal)/is
          $b0_1 = /Buffer\.from\s*\(\s*_rawPayload\s*\)/is
          $b0_2 = /part-\$\{[^}]+\}[^\n]{0,120}\/\$\{chunkData\}/is
          $b1_0 = /(169\.254\.169\.254|metadata\.google\.internal)/is
          $b1_1 = /_rawPayload\s*\)/is
          $b1_2 = /base64/is
          $b1_3 = /part-\$\{[^}]+\}[^\n]{0,120}\/\$\{chunkData\}/is
          $b2_0 = /part-\$\{chunkIdx\}-of-\$\{totalCount\}\/\$\{chunkData\}/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 12000 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 12000 and
                  true
                )
              )
            )
          ) or
          (
            for any i0 in (1..#b1_0) : (
              for any i1 in (1..#b1_1) : (
                @b1_1[i1] >= (@b1_0[i0] + !b1_0[i0]) and
                @b1_1[i1] <= (@b1_0[i0] + !b1_0[i0]) + 12000 and
                for any i2 in (1..#b1_2) : (
                  @b1_2[i2] >= (@b1_1[i1] + !b1_1[i1]) and
                  @b1_2[i2] <= (@b1_1[i1] + !b1_1[i1]) + 400 and
                  for any i3 in (1..#b1_3) : (
                    @b1_3[i3] >= (@b1_2[i2] + !b1_2[i2]) and
                    @b1_3[i3] <= (@b1_2[i2] + !b1_2[i2]) + 12000 and
                    true
                  )
                )
              )
            )
          ) or
          (
            $b2_0
          )
      }
- id: npm-worldapp-base64-env-profile-post
  desc: Posts Base64 environment to Lambda endpoint
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(Object\.keys\s*\(\s*process\s*(\.env|\[\s*["']env["']\s*\])\s*\)|JSON\.stringify\s*\([^)]{0,100}process\s*(\.env|\[\s*["']env["']\s*\]))/is
          $b0_1 = /Buffer\.from\s*\([^\n]{0,250}base64/is
          $b0_2 = /lambda-url\.us-east-1\.on\.aws/is
          $b0_3 = /(req|request)\.write\s*\(/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1800 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 6000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 3000 and
                    true
                  )
                )
              )
            )
          )
      }
- id: npm-preinstall-shell-collects-process-and-host-files
  desc: Preinstall collects process and host files
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /"preinstall"/is
          $b0_1 = /(hooklistener\.com|oast(ify)?\.com|oast\.fun)/is
          $b0_2 = /(grep\s+-r|ps\s+aux)/is
          $b0_3 = /ps\s+aux/is
          $b0_4 = /env/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 700 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 700 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 400 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 400 and
                      true
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
