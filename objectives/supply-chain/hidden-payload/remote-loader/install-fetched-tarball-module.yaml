# An npm install hook runs a local script that downloads a package tarball at
# install time, unpacks it, runs npm install inside the unpacked tree, and then
# require()s code from it. The published package carries none of the code that
# actually runs; the real stage is fetched and executed on every install.
# Prebuilt-binary installers download and unpack an archive too, but they do
# not npm-install and require() a second, remotely supplied JavaScript package.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1105,T1059.007
  mbc: B0024

composite_rules:
  - id: install-hook-fetched-tarball-module-run
    desc: Install hook fetches, installs and runs a tarball
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/fs/write/file/unspecified::node-downloaded-tgz-write
      - id: micro-behaviors/os/package-manager/management::js-npm-invoke-with-args-array
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
    any:
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
      - id: micro-behaviors/data/archive/extract/tar::node-tar-strip-components-flag
      - id: micro-behaviors/data/decompress/gzip::gunzip-call-text
