defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  attack: T1195.002
  crit: suspicious
composite_rules:
- id: sole-mutable-url-dependency-reexport
  desc: Sole unpinned URL dep with require-based export
  conf: 0.93
  scope: archive
  all:
  - id: metadata/package/dependencies/source::npm-single-unpinned-url-runtime-dependency
  - id: metadata/lang/source/syntax/assignment/member::commonjs-export-require-expression
- id: hollow-entry-reexports-remote-url-dep
  desc: Hollow entry module re-exports remote URL dependency
  conf: 0.92
  scope: archive
  all:
  - id: micro-behaviors/data/control-flow/module-exec::sole-package-require-passthrough
  - id: metadata/package/dependencies/source::remote-url-dependency
  unless:
  - id: micro-behaviors/data/control-flow/module-exec::esm-loader-entry
  downgrade:
    scope: archive
    any:
    - id: metadata/archive/layout::archive-at-least-120-members
    - id: metadata/package/files/included::archive-nested-package-json-entry
    - id: metadata/package/files/dependency::node-modules-path
