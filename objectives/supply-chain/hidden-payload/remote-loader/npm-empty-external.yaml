defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1195.002
composite_rules:
  # Installing this public package obtains its only meaningful implementation
  # from a separate mutable origin. The entry advertises nothing beyond a
  # console message. Documented bundles, private packages, and security holding
  # packages are meaningful counterevidence; a dead stage URL is not.
  - id: noop-external-runtime-carrier-profile
    desc: No-op package delegates runtime to external URL
    crit: suspicious
    conf: 0.96
    scope: package
    all:
      - id: metadata/lang/source/syntax/statement::module-only-logs-literal
      - id: metadata/package/dependencies/source::npm-single-http-or-https-runtime-source
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/config::gobinary-download-declaration
      - id: metadata/package/description/disclosure::security-poc-placeholder-context
      - id: metadata/package/description/disclosure::description-declares-dependency-metapackage
      - id: metadata/package/workspace::has-workspaces
  - id: noop-public-package-external-payload-carrier
    desc: Public no-op package installs external payload
    crit: hostile
    conf: 0.96
    scope: package
    all:
      - id: noop-external-runtime-carrier-profile
      - id: metadata/package/scripts/develop::npm-init-default-test
  # The sibling of noop-external-runtime-carrier-profile for the variant that
  # ships no entry module at all: the manifest advertises a main entry, the
  # archive carries no runtime code, and the only implementation npm can obtain
  # comes from re-fetching an external URL on install. Same calibrated level:
  # delegating to an external origin is suspicious on its own; the hostile
  # upgrade needs the fetched payload's own behavior.
  - id: entryless-external-runtime-carrier-profile
    desc: Entry-less package installs its code from an external URL
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/files/missing-entrypoint::npm-main-entrypoint-not-shipped
      - id: metadata/package/dependencies/source::npm-single-http-or-https-runtime-source
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/config::gobinary-download-declaration
      - id: metadata/package/description/disclosure::security-poc-placeholder-context
      - id: metadata/package/description/disclosure::description-declares-dependency-metapackage
      - id: metadata/package/workspace::has-workspaces
      - id: metadata/package/freeform::npm-security-holder-package
