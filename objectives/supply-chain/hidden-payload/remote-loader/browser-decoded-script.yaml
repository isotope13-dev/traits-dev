defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: concealed-browser-script-source
    desc: Browser inserts script with decoded source
    crit: suspicious
    conf: 0.94
    near_bytes: 400
    all:
      - id: micro-behaviors/data/collection/dom::source-append-child-call
    any:
      - id: micro-behaviors/communications/http/client/script::dynamic-script-src-decode-assign
      - id: micro-behaviors/communications/http/client/script::script-src-from-decoded-variable
