# Install-time loaders whose runtime dependency is a tarball fetched over
# plaintext HTTP from a host that is not a public registry. The package carries
# no payload of its own; the tarball that npm installs is where the code runs.
# Evidence: a lifecycle script that starts an interactive shell (package.json),
# or a lockfile that pins the same unlisted tarball URL (shrinkwrap member).
defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: npm-plaintext-tarball-interactive-install-shell
    desc: Plaintext HTTP tarball dependency with interactive install shell
    crit: hostile
    conf: 0.95
    for: [npm, tar, package.json]
    all:
      - id: metadata/package/dependencies/direct-url::dep-plaintext-http
      - id: micro-behaviors/process/interpreter/shell::npm-script-interactive-shell
    unless:
      - id: metadata/package/publishing::is-private

  - id: npm-plaintext-tarball-lock-pinned
    desc: Plaintext HTTP tarball dependency pinned by lockfile
    crit: hostile
    conf: 0.95
    for: [npm, tar, package.json, package-lock.json]
    scope: package
    all:
      - id: metadata/package/dependencies/direct-url::dep-plaintext-http
      - id: metadata/package/dependencies/lockfile::resolved-tarball-url-outside-listed-forms
    unless:
      - id: metadata/package/publishing::is-private
