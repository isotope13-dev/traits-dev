# Hollow npm carrier: the published package holds no code of its own and its
# runtime dependency resolves to a tarball served from a GitHub repository's
# raw-content endpoint. The registry copy is a decoy that wins name resolution
# (dependency confusion, internal-name squats); `npm install` then fetches
# the real bytes from an attacker-editable repository that registry review,
# advisories and takedowns never see. Legitimate packages that vendor a
# GitHub tarball still ship their own code and declare their repository.
#
# Worked examples: dependencykfeg@25.1.3 and atlassian-wallboard-plugin@10.0.0
# (`module.exports = {}` or a manifest-only tarball, "Account utility library",
# dependency https://github.com/<user>/ping_test/raw/.../*.tgz).
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002
  mbc: E1195

composite_rules:
  - id: hollow-package-github-raw-tarball-carrier
    desc: Codeless npm package installs GitHub raw tarball
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/dependencies/source::dep-github-raw-tarball-url
    any:
      - id: metadata/lang/source/syntax/assignment/member::commonjs-empty-object-export
      - id: micro-behaviors/data/control-flow/module-exec::js-sole-empty-commonjs-export
      - id: metadata/package/entrypoint/module::npm-archive-ships-no-code-member
    unless:
      - id: metadata/package/repository::has-repository-evidence
