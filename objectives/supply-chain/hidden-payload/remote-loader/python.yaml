defaults:
  platforms: [unix, windows]
  for: [python]
  attack: "T1195.002, T1059.006"

composite_rules:
  # The fetched source is expected to define a named function that the library
  # then calls and returns from, so the remote server supplies the real
  # implementation of a public API function. Held at file scope: both legs sit
  # in the same module's one function.
  - id: python-api-delegates-to-remote-exec-entrypoint
    desc: Python API execs downloaded source entrypoint
    crit: hostile
    conf: 0.9
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/process/deploy/script-eval::python-urlopen-then-compiled-exec
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::python-exec-namespace-entrypoint-lookup
      - id: micro-behaviors/process/interpreter/eval/compile::python-delegates-to-loaded-module-run
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
