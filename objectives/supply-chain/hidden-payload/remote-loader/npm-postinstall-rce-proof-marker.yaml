defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.007,T1195.002
  mbc: B0030
traits:
- id: node-rce-proof-marker-file-and-confirmation
  desc: Writes RCE proof marker and confirmation
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /rce-proof-[^"']+\.txt/is
          $b0_1 = /(RCE-POC|Code execution confirmed)/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 700 and
                true
              )
            )
          )
      }
- id: node-script-prints-remote-rce-confirmation
  desc: Prints remote code execution confirmation
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?is)Remote Code Execution PoC[^\n]{0,120}Code has been executed remotely
composite_rules:
- id: npm-postinstall-rce-proof-marker
  desc: npm postinstall runs code that records an RCE proof marker
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/supply-chain/hidden-payload/remote-loader::node-rce-proof-marker-file-and-confirmation
- id: npm-install-rce-proof-marker
  desc: npm install hook explicitly reports remote code execution
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: objectives/supply-chain/hidden-payload/remote-loader::node-script-prints-remote-rce-confirmation
