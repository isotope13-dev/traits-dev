defaults:
  for: [javascript, typescript]
  platforms: [windows, unix]
  attack: T1105,T1547.001

traits:
  - id: register-startup-argument
    desc: Requests startup registration
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: '--register-startup'

composite_rules:
  - id: java-js-unverified-node-bootstrap
    desc: Node bootstrap disables TLS verification
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/socket/ssl::javascript-empty-java-server-trust
      - id: micro-behaviors/communications/url/host/domain-http::nodejs-distribution-url
      - id: register-startup-argument
