defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006
  mbc: E1105

composite_rules:
- id: python-import-time-remote-module-update-exec
  desc: Import-time updater executes code fetched from a Workers host
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
  - id: micro-behaviors/communications/url/host/domain-http::workers-dev-domain
  - id: micro-behaviors/os/api-resolution/dynamic::python-module-dict-exec
  - id: micro-behaviors/os/api-resolution/dynamic::python-types-moduletype-create
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
