---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002,T1105
traits:
- id: browser-kernel-module-loader-marker
  desc: Browser kernel remote loader
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: "(?i)(ModuleLoader\\s*\\.\\s*fetchModule|Orchestrator\\s*\\.\\s*run|kernel\\s*\\.\\s*ModuleLoader)"
  not:
  - substr: orchestrator.run
composite_rules:
  - id: browser-fetched-xor-script-loader
    desc: Fetches and XOR-decodes an inserted script payload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.007
    scope: file
    all:
    - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
    - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-byte-array-xor-modulo-key-loop
    - id: micro-behaviors/data/collection/dom::script-element-create
    - id: micro-behaviors/ui/window/dom-access::dom-script-text-body-assign
    - id: micro-behaviors/data/collection/dom::append-child-reference
    near_bytes: 512

  - id: jquery-encoded-code-loader
    desc: jQuery bundle contains an encoded dynamic-code stub
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1059.007,T1105
    all:
    - id: objectives/execution/payload/script-eval/transformed/constructed::js-base64-xor-function-construction
    - id: well-known/lib/web/client-side/jquery::ajax-settings-identifier
    - id: metadata/lang/source/naming/resource::jquery-global-api-call
  - id: jquery-atob-xor-remote-script-loader
    desc: jQuery bundle injects XOR-decoded remote script stage
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.007,T1105
    all:
    - id: jquery-encoded-code-loader
    - id: objectives/execution/interpreter/eval/dynamic::obfuscated-atob-xor-remote-script-injection
  - id: packed-targeted-remote-script-loader
    desc: Packed package script targets page for remote DOM loading
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059.007,T1105
    all:
    - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
    - id: metadata/package/files/runtime::javascript-dist-tree-artifact
    - id: micro-behaviors/data/collection/dom::element-creation-method-reference
    - id: micro-behaviors/data/property/access::appendchild-or-setattribute-member
    - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: compact-dist-remote-script-loader
    desc: Compact package dist file injects remote script
    crit: suspicious
    conf: 0.97
    all:
    - id: micro-behaviors/communications/http/client/script::js-remote-script-element
    - id: micro-behaviors/data/collection/dom::append-child-reference
    - id: metadata/file/line::file-one-liner
    - id: metadata/package/files/runtime::javascript-dist-tree-artifact
    unless:
    - id: well-known/lib/web/authoring/astro::vercel-insights-analytics-injector
    near_bytes: 512
  - id: npm-archive-browser-oob-script-loader
    desc: Minimal npm package loads xss.report collector
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1048
    for:
    - npm
    - tar
    - package.json
    - javascript
    scope: archive
    all:
    - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
    - id: metadata/package/scripts/develop::npm-init-default-test
    - id: metadata/package/empty::npm-empty-author
    - id: metadata/package/dependencies/presence::npm-no-runtime-dependencies
    - id: objectives/exfiltration/oob/endpoint::js-remote-script-oob-loader
    unless:
    - id: metadata/path/directory::test-directory-component
  - id: npm-html-entry-mutable-remote-bootstrap
    desc: npm HTML entrypoint bootstraps mutable remote code
    crit: hostile
    conf: 0.99
    for:
    - npm
    - tar
    - package.json
    - javascript
    scope: archive
    attack: T1195.002,T1105,T1059.007
    all:
    - id: metadata/package/entrypoint/page::main-html-entry
    - id: objectives/execution/payload/script-eval/network/script-element::mutable-branch-remote-html-execution
    - id: metadata/package/empty::npm-empty-author
  - id: archive-ios-gated-kernel-remote-loader
    desc: Published archive gates a kernel loader on iOS and remote code
    crit: hostile
    conf: 0.99
    for:
    - npm
    - tar
    - package.json
    - javascript
    scope: archive
    attack: T1195.002,T1105,T1059.007,T1614.001
    all:
    - id: metadata/package/publishing::npm-public-publish-access
    - id: browser-kernel-module-loader-marker
    - id: micro-behaviors/communications/http/client/script::js-remote-script-element
    - id: micro-behaviors/os/sysinfo/platform/browser::ios-device-capability-check
  - id: js-hidden-ios-iframe-remote-stage
    desc: Script hides a remote iframe behind iOS gating
    crit: hostile
    conf: 0.99
    for:
    - javascript
    near_bytes: 4096
    attack: T1195.002,T1105,T1614.001,T1027
    all:
    - id: micro-behaviors/os/sysinfo/platform/browser::ios-device-capability-check
    - id: micro-behaviors/ui/window/dom/create::browser-create-iframe-element
    - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
    - id: micro-behaviors/ui/window/style::zero-size-element-style
  - id: crypto-sdk-entry-is-remote-loader
    desc: Crypto SDK entry point is a remote loader
    crit: hostile
    conf: 0.97
    for:
    - npm
    - tar
    - zip
    - javascript
    - package.json
    scope: archive
    all:
    - id: compact-dist-remote-script-loader
    - id: metadata/package/name/identity::crypto-sdk-manifest-name-claim
    any:
    - id: well-known/app/infrastructure/content-delivery/jsdelivr::jsdelivr-hex-named-package
    - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
