# npm packages from the LeadStack campaign fetch an executable optional
# dependency directly from the campaign's infrastructure. The snapshot served
# during analysis was benign; the publisher controls the package bytes at that
# URL independently of the npm release.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1105
  mbc: E1195

composite_rules:
  - id: campaign-hosted-optional-tarball
    desc: References campaign-hosted optional tarball
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/command-and-control/infrastructure/endpoint::leadstack-payload-server
      - id: metadata/package/dependencies/direct-url::optional-dep-tarball-url
