defaults:
  platforms: [windows, unix]
  attack: T1195.002
traits:
  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-raw-refs-link
    desc: README links GitHub raw refs path
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: 'github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/raw/refs/heads/'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-zip-extension-link
    desc: README Markdown link to ZIP asset
    crit: component
    conf: 0.84
    for: [markdown]
    if:
      type: text
      regex: '(?i)\[[^\[\n]{1,160}\]\([^(\n]{1,240}\.zip([?#].{0,80})?\)'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-release-zip-link
    desc: README links a GitHub release ZIP
    # A release archive link is common documentation. It is only a component
    # until the README also treats the asset as a cloneable executable or
    # mislabels it as a license.
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?i)github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/.{1,80}\.zip\b'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-clones-release-asset-instructions
    desc: README clones release asset in instructions
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '(?is)clone\s+the\s+repository.{0,240}releases/download/'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset-verb
    desc: README launch wording after release ZIP
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '(?is)releases/download/.{1,160}\.zip\b.{0,240}\b(launch(ing)?|execute)\b'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-runs-release-zip-exe
    desc: README runs EXE after release ZIP
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      # Require an .exe target so `go run` / `npm run` in nearby source-build
      # docs do not count as launching the release asset.
      regex: '(?is)releases/download/.{1,120}\.zip\b.{0,200}\brun .{0,48}\.exe\b'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-embeds-release-asset-as-image
    desc: README uses release ZIP as image
    crit: notable
    conf: 0.96
    for: [markdown]
    if:
      type: text
      regex: '(?i)!\[.{0,120}\]\(.{0,240}/releases/download/.{0,160}\.zip\b'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-license-points-to-release-asset
    desc: README license link targets release asset
    crit: notable
    conf: 0.96
    for: [markdown]
    if:
      type: text
      regex: '(?i)\[[^\]]{0,30}(license|licence)[^\]]{0,30}\]\(.{0,120}/releases/download/'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-prose-embeds-release-zip
    desc: README splices a release ZIP into prose
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?i)(framework for|maintainer at|contact.{0,40}at)\s+https?://github\.com/'

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-extract-and-launch
    desc: README says extract the download and launch
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '(?i)extract.{0,48}\blaunch\b'

  # The raw-content host serves a committed file straight from the branch, so
  # the payload never goes through a release. Lure repositories park the ZIP
  # under a decoy directory (`favicons/`, `img/`) and link it this way.
  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-raw-githubusercontent-zip-link
    desc: README links a raw.githubusercontent ZIP
    crit: notable
    conf: 0.93
    for: [markdown]
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/[\w.-]+/[\w.-]+/[^\s)"]{1,200}\.zip\b'

  # A Markdown image whose source is an archive renders as a broken image; the
  # only reason to write one is a clickable "Download" badge that fetches the
  # archive instead of opening a page.
  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-image-source-is-zip
    desc: README image source is a ZIP archive
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '!\[[^\]\n]{0,120}\]\([^)\s]{1,240}\.zip\)'

  # Link text promises a page (the releases list, the repository) and the
  # target is an archive download.
  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-navigation-link-targets-zip
    desc: README page link downloads a ZIP
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?i)\[[^\]]{0,40}(releases? page|repository)[^\]]{0,20}\]\([^)]{1,240}\.zip\)'

  # Object is payload/executable — NOT a bare "download ... zip", which is
  # universal benign install-doc language and is already covered separately by
  # readme-zip-extension-link in every composite that uses this leg.
  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-download-lure-language
    desc: README payload/executable download lure language
    crit: notable
    conf: 0.86
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(download|install)\b[^b\n]{0,120}\b(payload|executable)\b'
    not:
      - regex: '(?i)\bapp\s+download\b'
      - regex: '(?i)\bsigned\s+payload\b'
      - regex: '(?i)\bdownload\s+transaction\b'

  # Any nested ZIP, not one under `examples/`. The directory the payload
  # archive is parked in is decoration the operator picks per build — observed
  # as `img/` and `uncomposable/` in the same campaign that the `examples/`
  # form was written from — so it cannot carry the detection. What matters is
  # that a *source* distribution ships a ZIP inside it at all; the composites
  # below supply the rest (README raw-link lure, Lua interpreter member, packed
  # Lua payload), and a nested ZIP alone is common enough to stay a component.
  - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-launcher-exe-member
    desc: Archive contains a renamed LuaJIT launcher EXE
    crit: notable
    conf: 0.94
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(compiler|cli|boot|run|loader|util)\.exe$'
    unless:
      - id: well-known/lib/runtime/scripted/setuptools::setuptools-official-wheel-context
      - id: well-known/lib/runtime/scripted/setuptools::setuptools-gui-launcher-path
  - id: objectives/supply-chain/hidden-payload/exec/archive::archive-c-source-member
    desc: Archive contains a C source member
    crit: component
    conf: 0.82
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]{1,120}\.c$'

  - id: objectives/supply-chain/hidden-payload/exec/archive::archive-loader-exe-member
    desc: Archive contains a standalone loader executable
    crit: notable
    conf: 0.88
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)loader\.exe$'

  - id: objectives/supply-chain/hidden-payload/exec/archive::batch-starts-loader-c-source
    desc: Batch starts loader with C source
    crit: suspicious
    conf: 0.96
    for: [batch]
    if:
      type: text
      regex: '(?i)\bstart\s+loader\.exe\s+\S{1,128}\.c\b'

composite_rules:
  - id: objectives/supply-chain/hidden-payload/exec/archive::archive-batch-starts-text-payload
    desc: Archive data-file launch with packed Lua code
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [zip, batch, lua, text, javascript, c]
    all:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::packed-lua-loader-obfuscation
    any:
      - id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script
      - id: micro-behaviors/process/create/shell/command-mode::batch-starts-data-argument

  - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-interpreter-member
    desc: Archive bundles a LuaJIT interpreter executable
    crit: notable
    conf: 0.96
    scope: archive
    for: [zip, pe]
    any:
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-launcher-exe-member
      - id: well-known/lib/runtime/scripted/luajit::version-banner

  # The launcher EXE is renamed per build (`boot.exe`, `run.exe`,
  # `minify.exe`), so a name list cannot carry the membership claim. What
  # stays constant is the content: some member ships the LuaJIT runtime and
  # some member is an EXE — the runtime's own banner identifies it wherever
  # it sits. The hostile composites below still require the batch entrypoint,
  # the text-like payload name and packed-Lua obfuscation on top.
  - id: objectives/supply-chain/hidden-payload/exec/archive::archive-exe-member-with-luajit-runtime
    desc: Archive EXE member alongside embedded LuaJIT runtime
    crit: notable
    conf: 0.95
    scope: archive
    for: [zip, pe]
    all:
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: well-known/lib/runtime/scripted/luajit::version-banner

  - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-launcher-member
    desc: Archive bundles a LuaJIT launcher by name or runtime content
    crit: notable
    conf: 0.95
    scope: archive
    for: [zip, pe]
    any:
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-launcher-exe-member
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-exe-member-with-luajit-runtime

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-binary-download-lure-language
    desc: README promotes an executable or application download
    crit: component
    conf: 0.9
    for: [markdown]
    any:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-download-lure-language
      - id: metadata/package/documentation/page::readme-run-application-instruction

  - id: objectives/supply-chain/hidden-payload/exec/archive::luajit-archive-launches-obfuscated-source
    desc: LuaJIT archive launches obfuscated source payload
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1027,T1195.002
    scope: archive
    for: [zip, batch, text]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-loader-exe-member
      - id: metadata/package/files/archive-member::archive-lua51-dll-name
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-c-source-member
      - id: objectives/supply-chain/hidden-payload/exec/archive::batch-starts-loader-c-source
      - id: objectives/anti-static/obfuscation/code-metrics/structure::packed-lua-loader-obfuscation
    unless:
      - id: metadata/package/testing/presence/harness/

      - id: "metadata/file/naming::test-directory-component"
  - id: objectives/supply-chain/hidden-payload/exec/archive::luajit-obfuscated-script-archive-launcher
    desc: Archive launches obfuscated Lua payload with LuaJIT
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [zip, batch, text, lua]
    all:
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-indexed-string-permutation-decoder

  - id: objectives/supply-chain/hidden-payload/exec/archive::luajit-archive-runs-packed-text-payload
    desc: LuaJIT runtime archive runs packed text payload
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1027,T1036.007,T1195.002
    scope: archive
    for: [zip, batch, text, pe, lua]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-interpreter-member
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-batch-starts-text-payload
      - id: objectives/anti-static/obfuscation/code-metrics/structure::packed-lua-loader-obfuscation
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/naming::test-directory-component

  - id: objectives/supply-chain/hidden-payload/exec/archive::luajit-archive-launches-escaped-string-dispatch
    desc: LuaJIT archive launches a decimal-escaped dispatch payload
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, batch, text, pe, lua]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-interpreter-member
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-batch-starts-text-payload
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-escaped-string-dispatch

  - id: objectives/supply-chain/hidden-payload/exec/archive::luajit-archive-full-runtime-packed-payload
    desc: Full LuaJIT runtime archive runs packed text payload
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1027,T1195.002
    scope: archive
    for: [zip, batch, text, pe, lua]
    all:
      - id: metadata/package/files/archive-member::archive-lua51-dll-name
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-luajit-launcher-member
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-batch-starts-text-payload
      - id: objectives/anti-static/obfuscation/code-metrics/structure::packed-lua-loader-obfuscation
    unless:
      - id: metadata/package/testing/presence/harness/

      - id: "metadata/file/naming::test-directory-component"
  - id: objectives/supply-chain/hidden-payload/exec/archive::lua-obfuscated-string-table-archive-launcher
    desc: Lua archive launcher uses an obfuscated string-table payload
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, batch, text, lua]
    all:
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-large-encoded-string-table
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-loader

  - id: objectives/supply-chain/hidden-payload/exec/archive::luajit-archive-launches-indexed-string-dispatch
    desc: LuaJIT archive launches a large indexed-string dispatch payload
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, batch, text, lua]
    all:
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-obfuscated-string-dispatch

  - id: objectives/supply-chain/hidden-payload/exec/archive::luajit-archive-embedded-obfuscated-module
    desc: LuaJIT archive carries obfuscated script module
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1027,T1195.002
    scope: archive
    for: [zip, javascript]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::archive-loader-exe-member
      - id: metadata/package/files/archive-member::archive-lua51-dll-name
      - id: objectives/anti-static/obfuscation/code-metrics/structure::js-obfuscated-lua-return-loader

  - id: objectives/supply-chain/hidden-payload/exec/archive::raw-zip-luajit-sidecar-lure
    desc: Source package promotes bundled LuaJIT payload ZIP
    crit: suspicious
    conf: 0.96
    scope: outer
    for: [zip, markdown, batch, text]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-raw-refs-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-zip-extension-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-binary-download-lure-language
      - id: metadata/package/files/archive-member::archive-nested-zip-member
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name

      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-indexed-string-permutation-decoder
    unless:
      - id: metadata/package/testing/presence/harness/

      - id: "metadata/file/naming::test-directory-component"
  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset
    desc: README tells users to launch asset
    crit: notable
    conf: 0.94
    for: [markdown]
    any:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset-verb
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-runs-release-zip-exe

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-release-asset-clone-launch-lure
    desc: README disguises executable release asset as source clone
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1195.002,T1204.002
    for: [markdown]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-release-zip-link
      - id: micro-behaviors/process/create/vcs/git::public-forge-git-clone
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset
    near_bytes: 512

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-release-asset-instruction-launch-lure
    desc: README disguises release asset as source download
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1195.002,T1204.002
    for: [markdown]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-release-zip-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-clones-release-asset-instructions
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset
    near_bytes: 512

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-release-asset-image-launch-lure
    desc: README disguises release ZIP as image
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1195.002,T1204.002
    for: [markdown]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-release-zip-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-embeds-release-asset-as-image
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-release-asset-license-lure
    desc: README disguises release asset as license document
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1195.002
    for: [markdown]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-release-zip-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-license-points-to-release-asset
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-release-asset-prose-lure
    desc: README splices a release ZIP into sentences
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1195.002
    for: [markdown]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-release-zip-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-prose-embeds-release-zip
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-launches-release-asset

  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-release-asset-extract-launch-lure
    desc: README tells users to extract and launch
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1204.002
    for: [markdown]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-release-zip-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-extract-and-launch
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-embeds-release-asset-as-image

  # Every link in the README -- the download badge, "Releases Page", "GitHub
  # repository" -- fetches the same archive committed to the branch. No
  # legitimate project documents its releases page as a raw ZIP behind an image.
  - id: objectives/supply-chain/hidden-payload/exec/archive::readme-raw-zip-disguised-download-lure
    desc: README disguises raw ZIP as badge and pages
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1195.002,T1204.002
    for: [markdown]
    all:
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-raw-githubusercontent-zip-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-image-source-is-zip
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-navigation-link-targets-zip

  - id: objectives/supply-chain/hidden-payload/exec/archive::go-module-raw-zip-luajit-sidecar-lure
    desc: Go module source package promotes bundled LuaJIT payload ZIP
    crit: hostile
    conf: 0.97
    scope: outer
    for: [zip, markdown, batch, text]
    all:
      - id: metadata/package/files/included::github-module-zip-basename
      - id: metadata/package/files/included::archive-go-mod-entry
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-github-raw-refs-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-zip-extension-link
      - id: objectives/supply-chain/hidden-payload/exec/archive::readme-binary-download-lure-language
      - id: metadata/package/files/archive-member::archive-nested-zip-member
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-indexed-string-permutation-decoder
