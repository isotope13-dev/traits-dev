# Python packages that overwrite a victim workspace from a remote GitHub tree
# and relaunch through import-time subprocess side effects.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1195.002

composite_rules:
  - id: init-py-github-remote-tree-sync
    desc: Import embeds GitHub tree sync that deletes local files
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: micro-behaviors/communications/http/services/github::github-git-trees-recursive-api
      - id: micro-behaviors/communications/http/url/forge::github-raw-url
      - id: micro-behaviors/fs/directory/delete::iterative-file-deletion
      - id: micro-behaviors/communications/http/request/client::request-python

  - id: init-py-subprocess-interpreter-relaunch
    desc: __init__.py relaunches the Python interpreter
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: micro-behaviors/process/create/subprocess::subprocess-run-sys-executable
