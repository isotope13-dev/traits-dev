defaults:
  platforms:
  - linux
  - windows
  - unix
  for:
  - alpine_apk
  - apk_alpine
  - tar
  - pkginfo
  - text
  - python
  - ruby
  - javascript
  - package.json
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: alpine-apk-python-pe-temp-dropper
    desc: Alpine apk ships a Python TEMP PE write-exec dropper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/supply-chain/hidden-payload/exec/runtime::python-escaped-pe-temp-exec-loader

