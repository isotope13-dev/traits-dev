defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: setup-pyc-filename-builder
  desc: Builds a .pyc name from encoded bytes
  crit: notable
  conf: 0.94
  attack: T1195.002
  for:
  - python
  unless:
  - id: well-known/tool/detection/proxy-sandbox
  if:
    type: text
    regex: bytes\.fromhex\s*\(\s*["']707963["']\s*\)
- id: obfuscated-httpx-socks-import
  desc: Obfuscated httpx_socks import
  crit: suspicious
  conf: 0.95
  attack: T1027
  for:
  - python
  if:
    type: text
    regex: __import__\s*\(\s*['"]httpx['"]\s*\+\s*['"]_socks['"]
- id: reversed-subprocess-import
  desc: Reversed subprocess dynamic import
  crit: suspicious
  conf: 0.96
  attack: T1027
  for:
  - python
  if:
    type: text
    regex: __import__\s*\(\s*['"]ssecorpbus['"]\s*\[::?-1\]
- id: obfuscated-shell-bool-spawn
  desc: Obfuscated subprocess shell spawn
  crit: suspicious
  conf: 0.92
  attack: T1059.006
  for:
  - python
  if:
    type: text
    regex: \bshell\s*=\s*bool\s*\(\s*["']?\d
- id: node-dbconnectify-reference
  desc: Node references dbconnectify module
  crit: notable
  conf: 0.95
  for:
  - javascript
  if:
    type: text
    regex: \brequire\s*\(\s*["']dbconnectify["']\s*\)
- id: node-db-connectivity-probe
  desc: Node invokes database connectivity probe
  crit: notable
  conf: 0.95
  for:
  - javascript
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]*\s*\.\s*queryDBConnect\s*\(\s*\)
- id: assert-connection-side-effect-call
  desc: Invokes assertConnection side-effect helper
  crit: notable
  conf: 0.92
  for:
  - javascript
  if:
    type: text
    regex: \bassertConnection\s*\(\s*\)\s*;
