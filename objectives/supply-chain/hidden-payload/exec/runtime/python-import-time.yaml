defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1027,T1059.006

composite_rules:
  # A package module whose entire body is a decoder that runs on import: the
  # packed blob is reversed, Base64-decoded, inflated and exec'd at module
  # scope, so the behavior (here a nine-layer repack that finally fetches and
  # launches a Windows executable) never appears in the published bytes and
  # runs the moment the package is imported. Wrapper-and-trojan releases of
  # tiny utility packages (a clean 0.1.0 followed by a packed 0.1.2) use this.
  - id: import-time-packed-payload-exec
    desc: Package module execs packed payload on import
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::module-scope-exec-builtin
      - id: micro-behaviors/os/module/load::python-dynamic-codec-imports
      - id: objectives/anti-static/obfuscation/string/reverse::reverse-slice-then-decode
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
      - id: well-known/tool/detection/oracle-macaron/
  # A package initializer that carries a complete reverse shell and starts it
  # as a module-scope daemon thread: importing the package silently hands the
  # host's shell I/O to a connect-back listener with no user-visible action.
  # The __init__.py name is format-mandated; every other leg is content
  # derived. The daemon-thread leg keeps this off libraries that merely define
  # an uncalled reverse-shell helper.
  - id: import-time-inline-reverse-shell
    desc: Package initializer launches reverse shell on import
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/file/size::init-py-file
      - id: objectives/command-and-control/reverse-shell/fd-redirect::inline-python-reverse-shell
      - id: micro-behaviors/process/create/thread::python-module-daemon-thread-start
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
  # Published-package claim: core-metadata member plus the initializer
  # behavior anywhere in the archive, covering purelib wheels that ship no
  # setup.py for the install-hook composite to gate on.
  - id: pypi-import-time-inline-reverse-shell
    desc: PyPI package initializer launches reverse shell
    crit: hostile
    conf: 0.99
    for: [python, pkginfo, zip, whl, python-sdist]
    scope: archive
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
      - id: objectives/supply-chain/hidden-payload/exec/runtime::import-time-inline-reverse-shell
