# An install hook that auto-executes a shell payload omitted from the
# manifest's files allowlist, inside a hollow module with no source
# repository, is a concealed install-time execution carrier. The hook runs
# with the installer's privileges on every install; omitting the executed
# file from `files` keeps it out of the published manifest while the
# constant-function filler gives reviewers nothing to read. A merely broken
# release lists its payload or ships real code. No behavior is attributed to
# the absent payload bytes here: the conviction is the concealed execution
# setup, not what a missing script does.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: hollow-npm-package-conceals-install-shell-payload
    desc: Hollow package conceals install shell payload
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/hook-install::tiny-hollow-missing-shell-hook
      - id: micro-behaviors/os/package-manager/hook-install::unpublished-shell-loader-without-source
