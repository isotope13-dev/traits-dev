defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, shell, whl, zip]
  attack: T1195.002

composite_rules:
  - id: package-generates-ai-review-curl-sh-workflow
    desc: Package generates curl-piped AI review workflow
    crit: suspicious
    conf: 0.96
    scope: archive
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    all:
      - id: metadata/build/github-actions::generated-ai-review-workflow
      - id: metadata/build/github-actions::workflow-secret-review-token
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text

  - id: agent-skill-auto-install-api-key-lure
    desc: Auto-triggered skill installs remote code and requests an API key
    crit: hostile
    conf: 0.98
    for: [archives]
    scope: archive
    all:
      - id: objectives/execution/automation/agent::agent-skill-auto-trigger
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text
      - id: objectives/command-and-control/remote-command/llm/action::llm-api-key-submission-prompt

  - id: scheduled-remote-agent-skill-replacement
    desc: Scheduled workflow replaces agent skills from remote content
    crit: hostile
    conf: 0.97
    for: [archives]
    scope: archive
    all:
      - id: metadata/build/github-actions::scheduled-workflow-trigger
      - id: metadata/build/github-actions::workflow-contents-write-text
      - id: metadata/build/github-actions::workflow-fetches-agent-skill-definitions
      - id: metadata/build/github-actions::workflow-removes-agent-skill-tree
      - id: metadata/build/github-actions::workflow-commits-agent-skill-tree

  - id: package-embeds-agent-skill-process-control
    desc: Package embeds agent process-control skill
    crit: suspicious
    conf: 0.94
    scope: archive
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    all:
      - id: metadata/package/config::agent-skill-entry-declaration
      - id: micro-behaviors/communications/ipc/agent-hook::packaged-agent-skill-body
      - id: micro-behaviors/process/create/shell/spawn::agent-skill-subprocess-pid-control
    any:
      - id: micro-behaviors/process/create/shell/spawn::agent-skill-shell-detection-guide
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text
