# Runtime plugin code can hide a second stage behind an apparently ordinary
# package-manager install from a source repository. The Git ref is not hostile
# by itself; the attack pattern is the combination with a detached child whose
# output and launch failures are deliberately discarded.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1059.007,T1195.002,T1564"
  mbc: B0024

composite_rules:
  - id: covert-vcs-package-bootstrap
    desc: Silently detaches a VCS package bootstrap
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/shell/build::js-package-manager-vcs-ref-install
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/communications/http/request/client::silent-error-handler

  - id: vscode-activation-vcs-package-stage
    desc: VS Code activation hides a VCS package stage
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: metadata/library/vscode::require-vscode
      - id: metadata/library/vscode::activate-export
      - id: micro-behaviors/process/create/shell/build::js-package-manager-vcs-ref-install
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-block
