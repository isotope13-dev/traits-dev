defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002
  mbc: B0024

traits:
- id: import-runtime-startpy-path
  desc: Package runtime start.py sidecar
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '("_runtime"|''_runtime'').{0,160}("start\.py"|''start\.py'')'
- id: python-popen-nul-redirect
  desc: Python Popen redirects through nul
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'subprocess\.Popen\([\s\S]{0,360}stdout\s*=\s*nul[\s\S]{0,120}stderr\s*=\s*nul'
- id: python-bun-router-sidecar
  desc: Python runs JS via Bun
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: 'subprocess\.(run|Popen|call)\([\s\S]{0,240}(bun|bun\.exe)[\s\S]{0,160}router_runtime\.js'
- id: python-runtime-js-sidecar-name
  desc: Python references router JS sidecar
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: router_runtime.js
- id: bun-hidden-github-token-field
  desc: Hidden Bun GitHub token field
  crit: component
  conf: 0.94
  for: [data]
  if:
    type: text
    substr: ghtoken
- id: bun-hidden-github-old-secret-field
  desc: Hidden Bun old GitHub secret field
  crit: notable
  conf: 0.94
  for: [data]
  if:
    type: text
    substr: ghs_old
- id: bun-hidden-github-jwt-secret-field
  desc: Hidden Bun GitHub JWT field
  crit: notable
  conf: 0.94
  for: [data]
  if:
    type: text
    substr: ghs_jwt
- id: bun-data-child-process-reference
  desc: Bun data payload references child_process
  crit: notable
  conf: 0.9
  for: [data]
  unless:
  - id: metadata/file/format/structured::sourcemap
  - id: metadata/file/format/structured::sourcemap-raw-signature
  if:
    type: text
    substr: child_process

- id: python-import-runtime-sidecar-fragment
  desc: Python fragment launches hidden runtime sidecar
  crit: suspicious
  conf: 0.97
  for: [python, text]
  if:
    type: text
    regex: '(?is)_runtime.{0,160}start\.py|start\.py.{0,160}_runtime'

composite_rules:
- id: import-time-hidden-runtime-fragment
  desc: Import fragment launches hidden runtime
  crit: hostile
  conf: 0.99
  all:
  - id: python-import-runtime-sidecar-fragment
  - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
  - id: micro-behaviors/process/create/subprocess::sys-executable-popen
  - id: micro-behaviors/process/create/thread::python-daemon-thread
- id: import-time-hidden-runtime-launch
  desc: Import silently launches runtime sidecar
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/thread::python-daemon-thread
  - id: import-runtime-startpy-path
  - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
  unless:
  - id: metadata/package/testing/
  - id: well-known/lib/stdlib/python-stdlib
- id: python-bun-js-sidecar-loader
  desc: Python downloads Bun for JS sidecar
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/github::bun-release-archive-url
  - id: python-bun-router-sidecar
  any:
  - id: python-runtime-js-sidecar-name
  - id: micro-behaviors/process/create/local-exec::devnull-redirect
- id: python-bun-opaque-sidecar-loader
  desc: Python downloads Bun for opaque sidecar
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/github::bun-release-archive-url
  - id: python-opaque-sidecar-extension
  - id: micro-behaviors/process/create/subprocess::popen-content
  any:
  - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
  - id: python-popen-nul-redirect
- id: bun-data-github-token-stealer
  desc: Hidden Bun payload targets GitHub tokens
  crit: hostile
  conf: 0.98
  for: [data]
  all:
  - id: bun-hidden-github-token-field
  - id: bun-hidden-github-old-secret-field
  - id: bun-hidden-github-jwt-secret-field
  - id: bun-data-child-process-reference
  - id: objectives/anti-static/obfuscation/payload/data-file::single-line-encoded-data-blob
- id: python-opaque-sidecar-extension
  desc: Python references opaque sidecar
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/extension::python-path-join-bin-dat-blob-file
  - id: micro-behaviors/fs/path/extension::python-path-join-cache-payload-pack-file
