# A published library silently launches a detached interpreter whose bundled
# implementation sends host/user profile data through a messaging service.
# Neither daemonization nor a messaging client alone establishes compromise.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript, package.json]
composite_rules:
- id: library-hidden-child-profile-exfil
  desc: Library method conceals detached host-profile exporter
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: micro-behaviors/process/daemonize/spawn::prototype-method-detached-spawn
  - id: micro-behaviors/process/daemonize/spawn::detached-node-interpreter-child
  - id: objectives/exfiltration/stealer/system-info/profile::telegram-system-profile-exfil
