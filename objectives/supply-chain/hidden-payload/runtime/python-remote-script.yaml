# A Python package module that downloads a remote script into a temporary file
# and launches it via a windowless interpreter is a supply-chain hidden payload.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006,T1564.003

composite_rules:
  - id: python-remote-script-silent-stage
    desc: Python package downloads and silently stages a remote script
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/fs/temp/mktemp::tempfile-mkstemp
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: "metadata/file/naming::test-directory-component"
