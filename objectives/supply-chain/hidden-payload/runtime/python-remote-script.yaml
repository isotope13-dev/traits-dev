# Windowless remote-script staging. The former ordinary HTTP/module/child
# co-occurrence composite added no operation beyond its three neutral atoms.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006,T1564.003

composite_rules:
  - id: python-base32-netcat-hidden-shell-stage
    desc: Python module decodes and launches a concealed Netcat FIFO reverse shell
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1095
    # Python source and its decoded shell layer supply different roles.
    scope: archive
    for: [whl, python, shell]
    all:
      - id: micro-behaviors/data/decode/base32::python-base32-decode
      - id: micro-behaviors/process/create/shell/variable-command::python-subprocess-sh-c-runtime-command
      - id: micro-behaviors/process/stdio/relay::shell-netcat-fifo-feedback

  - id: python-remote-script-silent-stage
    desc: Python downloads near windowless process staging
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/fs/temp/mktemp::tempfile-mkstemp
      - id: micro-behaviors/process/daemonize/spawn::pythonw-windowless-subprocess-code
