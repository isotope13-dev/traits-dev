# Windowless remote-script staging. The former ordinary HTTP/module/child
# co-occurrence composite added no operation beyond its three neutral atoms.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006,T1564.003

composite_rules:
  - id: python-base32-netcat-hidden-shell-stage
    desc: Python decodes a Base32 shell and stages it covertly
    crit: hostile
    conf: 0.98
    attack: T1027,T1105,T1059.004,T1071.001
    scope: archive
    for: [whl, python, shell]
    all:
      - id: micro-behaviors/data/decode/base32::python-base32-decode
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-sh-c-runtime-command
      - id: micro-behaviors/communications/socket/netcat::nc-connect-endpoint
      - id: micro-behaviors/fs/delete/file/command::hidden-tmp-rm-command
      - id: micro-behaviors/process/daemonize/detach::disown-command

  - id: python-remote-script-silent-stage
    desc: Python package downloads and silently stages a remote script
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/fs/temp/mktemp::tempfile-mkstemp
      - id: micro-behaviors/process/create/subprocess::pythonw-windowless-subprocess-code
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/path::test-directory-component
