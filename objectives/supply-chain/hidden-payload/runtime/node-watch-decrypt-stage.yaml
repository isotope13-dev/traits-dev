# Import-time watch-gated decrypt stagers in npm packages. The entry module
# runs on require, waits for an encrypted stage file to appear under a
# watched directory, decrypts it onto disk, and deletes the encrypted
# source. Ordinary file watchers (dev servers, test runners) rebuild on
# change; they never gate symmetric decryption and source removal on a
# staged file's arrival at import time.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1027,T1070.004
  mbc: B0024

composite_rules:
  - id: npm-import-time-watch-gated-decrypt-stage
    desc: Import-time watch gates decrypt-stage with source removal
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 60
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/fs/watch::node-fs-watch-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-close
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
