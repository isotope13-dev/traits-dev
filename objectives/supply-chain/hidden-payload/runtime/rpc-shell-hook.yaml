# A plugin receives an encrypted payload from an RPC, decrypts it, writes a
# local stage, then replaces an agent shell command with a command that runs it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: unseal-rpc-payload-reference
    desc: References an unseal RPC payload
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'unsealRpc\.unseal|UnsealRpc'

  - id: shell-hook-runs-written-stage
    desc: Shell hook runs a staged bash command
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'event\.command\s*=.{0,100}bash.{0,100}safe'

composite_rules:
  - id: rpc-unsealed-encrypted-shell-stage
    desc: RPC payload decrypted and run by shell hook
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, javascript, typescript]
    scope: archive
    attack: T1195.002,T1027.013,T1059.007
    mbc: B0024
    near_bytes: 4096
    all:
      - id: unseal-rpc-payload-reference
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc
      - id: micro-behaviors/fs/write/file/full::write-file-call-target
      - id: shell-hook-runs-written-stage
