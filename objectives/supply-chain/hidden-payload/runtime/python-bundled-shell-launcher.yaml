# Python module whose job is to arm and run a shell script shipped beside it:
# the script path is derived from the module's own directory, the same path
# variable is given an executable mode, and that variable is then the program
# of a subprocess call. The payload travels as non-executable package data,
# so the archive reads as inert, and the entry point turns it into code on
# first use. This is the launcher half of PyPI wrapper droppers.
#
# The variable identity is proven by the micro-behaviors tree-sitter atom; a
# test that chmods one temp script and runs another does not satisfy it.
defaults:
  crit: hostile
  platforms: [unix]
  for: [python]
  attack: T1195.002,T1059.004,T1222.002
  mbc: B0024
composite_rules:
  - id: python-arms-and-runs-bundled-shell-script
    desc: Python module chmods a shell script in its own package dir and runs it
    conf: 0.9
    scope: file
    near_lines: 30
    all:
      - id: micro-behaviors/fs/path/self::python-module-directory
      - id: micro-behaviors/fs/path/construct::python-variable-dir-shell-script
      - id: micro-behaviors/process/create/subprocess/launch::python-same-path-sh-chmod-exec
    unless:
      - id: metadata/package/testing/harness/unit::python-unittest-test-harness-context
      - id: metadata/package/testing/scripted::pytest
