# Python package code whose entire job is to arm and run a shell script that
# ships inside the package. The payload is distributed without an executable
# bit -- so the archive reads as inert data -- and the installed entry point
# chmods it and execs it with the caller's environment on first use. This is
# the launcher half of the PyPI wrapper droppers (miner and stager wrappers
# alike): the module itself contains no functionality, only the handoff.
#
# Per-file scope on purpose. The wheel/sdist composites under
# objectives/supply-chain/trojanized/package/ need the archive for their
# metadata legs, and a loose module extracted from one -- or committed to a
# repository -- never reaches them.
defaults:
  crit: hostile
  platforms: [unix]
  for: [python]
  attack: T1195.002,T1059.006,T1222.002
  mbc: B0024
composite_rules:
  - id: python-arms-and-runs-bundled-shell-script
    desc: Python module arms a bundled shell script and executes it
    conf: 0.95
    scope: file
    near_lines: 30
    all:
      - id: micro-behaviors/fs/path/self::python-module-directory
      - id: micro-behaviors/fs/path/construct::python-variable-dir-shell-script
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/process/create/subprocess::process-execution
