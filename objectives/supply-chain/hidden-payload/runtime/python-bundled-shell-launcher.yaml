defaults:
  crit: hostile
  platforms:
  - unix
  for:
  - python
  attack: T1195.002,T1059.006,T1222.002
  mbc: B0024
composite_rules:
- id: python-arms-and-runs-bundled-shell-script
  desc: Python module arms a bundled shell script and executes it
  conf: 0.95
  scope: file
  near_lines: 30
  all:
  - id: micro-behaviors/fs/path/self::python-module-directory
  - id: micro-behaviors/fs/path/construct::python-variable-dir-shell-script
  - id: micro-behaviors/fs/chmod/executable/mode::python-executable
  - id: micro-behaviors/process/create/subprocess::process-execution
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool
  - id: metadata/path::test-directory-component
  - id: metadata/lang/source/literal/array::egress-command-array-head
