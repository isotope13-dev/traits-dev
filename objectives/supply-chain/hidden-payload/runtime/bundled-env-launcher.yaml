# Plugin-lifecycle launchers that resolve a hidden platform-specific native
# binary and run it detached with the full inherited environment. No
# install hook is involved: the malicious path executes when the host
# application loads the plugin (gateway startup, memory recall, package
# import), passing process secrets and agent prompt text to the child.
# Seen in the sckit worm's MemTensor npm and MemoryOS PyPI payloads, which
# share the stage0 --config64 shape across JavaScript and Python launchers.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

composite_rules:
  - id: js-bundled-binary-detached-env-launch
    desc: JS launches hidden platform binary detached with env
    crit: hostile
    conf: 0.97
    for: [javascript]
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-member
      - id: micro-behaviors/os/sysinfo/platform/runtime::node-arch-remap-amd64
      - id: micro-behaviors/fs/path/construct::node-hidden-exec-dir-join
      - id: micro-behaviors/process/create/spawn::bare-spawn-call
    any:
      - id: micro-behaviors/os/env/package-manager::npm-token-env-read
      - id: micro-behaviors/os/env/package-manager::node-auth-token-env-read

  - id: py-bundled-binary-detached-env-launch
    desc: Python launches hidden platform binary detached with env
    crit: hostile
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/fs/path/location::python-package-dotdir-binary-path
      - id: micro-behaviors/fs/chmod/modify::python-path-chmod
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
      - id: micro-behaviors/os/env/read::python-environ-copy
