# Plugin-lifecycle launchers that resolve a hidden platform-specific native
# binary and run it detached with the full inherited environment. No
# install hook is involved: the malicious path executes when the host
# application loads the plugin (gateway startup, memory recall, package
# import), passing process secrets and agent prompt text to the child.
# Seen in the sckit worm's MemTensor npm and MemoryOS PyPI payloads, which
# share the stage0 --config64 shape across JavaScript and Python launchers.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  # The sckit stage protocol: every launcher variant -- npm dropper, PyPI
  # stub, bootstrap postinstall shim, and the push-triggered workflow the
  # worm writes -- invokes the staged binary with the task name `stage0`
  # and an inline base64 config via `--config64`. The tokens name a family
  # protocol, so the composites convict only when a real process launch
  # carries them both.
  - id: stage0-task-argument
    desc: stage0 task name argument
    crit: notable
    conf: 0.95
    for: [javascript, python]
    if:
      type: text
      regex: '["'']stage0["'']'
  - id: inline-config64-flag
    desc: Inline base64 config flag
    crit: notable
    conf: 0.95
    for: [javascript, python]
    if:
      type: text
      substr: --config64

composite_rules:
  - id: js-bundled-binary-detached-env-launch
    desc: JS launches hidden platform binary detached with env
    crit: hostile
    conf: 0.97
    for: [javascript]
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-member
      - id: micro-behaviors/os/sysinfo/platform/runtime::node-arch-remap-amd64
      - id: micro-behaviors/fs/path/construct::node-hidden-exec-dir-join
      - id: micro-behaviors/process/create/spawn::bare-spawn-call
    # The child gets registry secrets either named outright or inside a copy
    # of the whole environment; sckit 0.1.21 did the latter, 0.1.23 the former.
    any:
      - id: micro-behaviors/os/env/package-manager::npm-token-env-read
      - id: micro-behaviors/os/env/package-manager::node-auth-token-env-read
      - id: micro-behaviors/process/create/self-respawn::node-copied-process-env-option

  - id: py-bundled-binary-detached-env-launch
    desc: Python launches hidden platform binary detached with env
    crit: hostile
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/fs/path/location::python-package-dotdir-binary-path
      - id: micro-behaviors/fs/chmod/modify::python-path-chmod
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
      - id: micro-behaviors/os/env/read::python-environ-copy

  # Protocol twins of the composites above for launchers that carry no
  # family strings: the verbatim Aikido-quoted stubs pass no env var and no
  # schema marker, only the stage protocol. A real spawn plus both protocol
  # tokens is the execution shape every sckit variant keeps, because the
  # staged binary parses exactly this argv.
  - id: js-staged-config-launch
    desc: JS spawns staged binary with inline config
    crit: hostile
    conf: 0.96
    for: [javascript]
    near_bytes: 500
    all:
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: stage0-task-argument
      - id: inline-config64-flag
    # Embedded launcher templates inside a compiled implant are covered by
    # native-dual-ecosystem-launcher-writer; keep this composite on loose JS
    # source only so an ELF/PE match is not mislabeled as a JS file verdict.
    unless:
      - id: objectives/lateral-movement/worm/package-registry::native-dual-ecosystem-launcher-writer

  - id: py-staged-config-launch
    desc: Python runs staged binary with inline config
    crit: hostile
    conf: 0.96
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: stage0-task-argument
      - id: inline-config64-flag

  # Rename-resistant twins for launchers that drop the family protocol
  # entirely: a detached, silenced spawn of a binary resolved from a hidden
  # package directory or a composed <platform>-<arch> matrix segment, fed
  # with an inline base64 blob that decodes to a JSON config. Every leg is
  # structure (path layout, spawn shape, encoding), so renaming the binary,
  # the task argument, and the flag still lands here.
  - id: js-staged-binary-encoded-config-launch
    desc: JS launches hidden staged binary with encoded JSON config
    crit: hostile
    conf: 0.95
    for: [javascript, typescript]
    near_bytes: 4000
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/data/encode/base64::json-base64-config-literal
    any:
      - id: micro-behaviors/fs/path/construct::node-hidden-exec-dir-join
      - id: micro-behaviors/fs/path/construct::node-os-arch-dir-join
    unless:
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context

  - id: py-staged-binary-encoded-config-launch
    desc: Python launches hidden staged binary with encoded JSON config
    crit: hostile
    conf: 0.95
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/data/encode/base64::json-base64-config-literal
    any:
      - id: micro-behaviors/fs/path/location::python-package-dotdir-binary-path
      - id: micro-behaviors/os/sysinfo/platform/runtime::python-arch-alias-go-map
    unless:
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
