# Python launchers that inspect the original interpreter argv, suppress their
# output, and run a sibling shared-object-named file as a script conceal a
# payload behind ordinary interpreter startup.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1027

composite_rules:
  - id: python-suppressed-argv-gated-shared-object-loader
    desc: Startup runs disguised sibling with changed stdio
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/process/info/commandline::py-getargcargv
      - id: micro-behaviors/process/interpreter/python::runpy-run-path
      - id: metadata/file/profile/module-loading::python-so-path-runpy-profile
      - id: metadata/file/profile/operation-reference::python-argc-runpy-profile
      - id: micro-behaviors/process/fd/stdio::python-stdio-stream-replacement
