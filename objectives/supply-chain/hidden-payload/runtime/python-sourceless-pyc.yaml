# A package that executes sourceless bytecode through importlib's
# SourcelessFileLoader while swallowing errors conceals runtime behavior from
# source review. Type-stub declarations of the loader interface are excluded
# at the atomic leg, so vendored typeshed copies stay quiet. The legs may sit
# in different files of the same archive: typically a loader module plus an
# __init__ that imports it under try/except pass. This is suspicious rather
# than hostile by itself because legitimate closed-source packages can ship
# bytecode-only modules.
defaults:
  platforms: [unix, windows]
  attack: T1027,T1059.006

composite_rules:
  - id: import-sourceless-pyc-loader
    desc: Archive silently invokes sourceless bytecode loader
    crit: suspicious
    conf: 0.95
    for: [python, python-sdist, whl, zip, tar]
    scope: archive
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::python-sourceless-file-loader
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
