defaults:
  crit: hostile
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  attack: T1195.002,T1027.013,T1059.007
  mbc: B0024,B0032
composite_rules:
  - id: scrypt-aes-gcm-detached-hidden-spawn
    desc: Scrypt AES-GCM decrypt then detached hidden spawn
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/gcm::aes-256-gcm-dash
      - id: metadata/file/profile/command-options::detached-true
      - id: metadata/file/profile/command-options::node-windowshide-true-option
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
  - id: computed-require-aes-gcm-hidden-spawn
    desc: Computed require decrypts then spawns a hidden child
    conf: 0.96
    attack: T1195.002,T1027,T1059.007
    mbc: B0024
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/gcm::aes-256-gcm-dash
      - id: metadata/file/profile/command-options::detached-true
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
  - id: npm-postinstall-aes-gcm-detached-runtime
    desc: npm postinstall decrypts and detaches sharded runtime
    conf: 0.98
    for:
      - npm
      - package.json
      - javascript
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: objectives/anti-static/obfuscation/multi-layer::js-base64-shard-array
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/gcm::aes-256-gcm-dash
      - id: micro-behaviors/crypto/decrypt::set-auth-tag
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
