# npm library dropper: decrypt a sibling ciphertext with scrypt + AES-256-GCM,
# then spawn node on the plaintext in a detached/hidden child. Observed in
# matrixflow-js (ml-matrix typosquat) where solve() gates on a hardcoded digest
# before decrypting src/statMatrix.min.js and launching it.
#
# The crypto and spawn atoms are independently notable; together they have no
# legitimate place in a published linear-algebra helper.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1027.013,T1059.007
  mbc: B0024,B0032

composite_rules:
  - id: scrypt-aes-gcm-detached-hidden-spawn
    desc: Scrypt AES-GCM decrypt then detached hidden spawn
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/library/provider::node-memory-hard-kdf
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
      - id: micro-behaviors/process/create/minified-spawn::detached-bang-true
      - id: micro-behaviors/process/create/minified-spawn::windowshide-bang-true
    unless:
      - id: metadata/package/testing/

  - id: computed-require-aes-gcm-hidden-spawn
    desc: Computed require decrypts then spawns a hidden child
    conf: 0.96
    attack: T1195.002,T1027,T1059.007
    mbc: B0024
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
      - id: micro-behaviors/process/create/minified-spawn::detached-bang-true
    unless:
      - id: metadata/package/testing/
