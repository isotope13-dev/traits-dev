# Targeted-activation loaders: a Go package that only decrypts and runs its
# bundled archive when the caller supplies one precomputed value. Seen in
# the Graphalgo Terraform providers (SHA256 of concatenated resource
# attributes must equal a hardcoded digest before a sqlite3-disguised ZIP
# is AES-decrypted and launched with detached `go run .`) and in the
# gogets.dev/btreex Go module (a fixed price integer gates the same
# unzip-decrypt-run chain). The gate leg generalizes across both shapes;
# the decrypt-and-run legs are the established hostile chain.
defaults:
  platforms: [linux, macos, windows]
  for: [go]
  attack: T1195.002,T1059.007
  mbc: B0024

composite_rules:
  - id: go-gated-decrypt-and-run
    desc: Gated Go loader decrypts a bundled archive and runs it
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/archive/zip::zip-reader
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/process/create/direct::exec-command
    any:
      - id: micro-behaviors/crypto/hash/digest::go-fixed-sha256-comparison
      - id: micro-behaviors/data/control-flow/branch::go-fixed-int-activation-guard
