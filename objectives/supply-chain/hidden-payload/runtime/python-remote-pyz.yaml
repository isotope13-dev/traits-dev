# A package import that retrieves a Python zipapp into a temporary path and
# launches it detached is a portable hidden-payload shape.  The endpoint and
# package names vary between campaigns, so the rule keys on the delivery and
# execution chain instead of a fixed domain.
defaults:
  platforms: [unix, windows]
  for: [python, text]
  attack: T1195.002,T1105,T1059.006

traits:
  - id: python-remote-pyz-endpoint
    desc: Python source references a remote pyz payload
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'https?://[^\s"'']{1,240}\.pyz(\b|["''])'

  - id: python-temp-pyz-stage
    desc: Python stages a pyz in /tmp
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)(/tmp|tempfile\.gettempdir\(\))[^\n"'']{0,100}\.pyz'

composite_rules:
  - id: python-remote-pyz-detached-stage
    desc: Python package downloads and detaches a remote pyz payload
    crit: hostile
    conf: 0.99
    all:
      - id: python-remote-pyz-endpoint
      - id: python-temp-pyz-stage
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
    any:
      - id: micro-behaviors/communications/http/curl::python-curl-argv-list
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
