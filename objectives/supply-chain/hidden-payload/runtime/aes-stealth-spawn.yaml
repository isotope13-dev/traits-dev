# npm libraries that AES-GCM-decrypt a packaged sibling with a scrypt-derived
# key, then spawn node on the plaintext as a detached/hidden child. Seen in
# typosquatted math libraries (matrixflow-js / MAL-2026-14293) where solve()
# gates on a hardcoded SHA-256 of attacker-chosen input before decrypting
# src/statMatrix.min.js and launching it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1027.013,T1059.007
  mbc: B0024

composite_rules:
  - id: aes-gcm-scrypt-stealth-spawn
    desc: AES-GCM scrypt decrypt then detached hidden spawn
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/crypto/library/provider::node-memory-hard-kdf
      - id: micro-behaviors/process/create/spawn-minified::detached-bang-true
      - id: micro-behaviors/process/create/spawn-minified::windowshide-bang-true
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
