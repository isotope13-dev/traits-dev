defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1027,T1059.004

traits:
  # Predicates match decoded shell fragments at each Base64 byte alignment.
  # They are checked against the same literal that flows to Buffer.from.
  - id: node-base64-temp-bash-flow
    desc: Writes decoded miner script and runs Bash
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @source
              value: (string (string_fragment) @literal)))
          (lexical_declaration
            (variable_declarator name: (identifier) @decoded
              value: (call_expression
                function: (member_expression
                  object: (call_expression
                    function: (member_expression object: (identifier) @buffer
                      property: (property_identifier) @from)
                    arguments: (arguments (identifier) @source_used (string (string_fragment) @encoding)))
                  property: (property_identifier) @to_string))))
          (lexical_declaration
            (variable_declarator name: (identifier) @path
              value: (template_string
                (template_substitution
                  (call_expression function: (member_expression
                    object: (identifier) property: (property_identifier) @tmpdir))))))
          (expression_statement
            (await_expression
              (call_expression function: (member_expression
                  object: (identifier) property: (property_identifier) @write)
                arguments: (arguments (identifier) @path_write (identifier) @data_write))))
          (expression_statement
            (call_expression function: (identifier) @exec
              arguments: (arguments
                (template_string (string_fragment) @shell
                  (template_substitution (identifier) @path_exec)))))) @flow
          (#eq? @buffer "Buffer")
          (#eq? @source @source_used)
          (#match? @literal "^[A-Za-z0-9+/]{80,}={0,2}$")
          (#match? @literal "(PSdYTVJJJz|0nWE1SSSc7|9J1hNUkknO)")
          (#match? @literal "(PSdtcmlnJz|0nbXJpZyc7|9J21yaWcnO)")
          (#match? @literal "(PSdbU2VyJz|0nW1Nlcic7|9J1tTZXInO)")
          (#match? @literal "(PSdjdXJsJz|0nY3VybCc7|9J2N1cmwnO)")
          (#match? @literal "(PSd5c3RlJz|0neXN0ZSc7|9J3lzdGUnO)")
          (#match? @literal "(PSdlbWN0Jz|0nZW1jdCc7|9J2VtY3QnO)")
          (#match? @literal "(ZXZhbCAiJ|V2YWwgIi|ldmFsICIk)")
          (#eq? @from "from")
          (#eq? @encoding "base64")
          (#eq? @to_string "toString")
          (#eq? @tmpdir "tmpdir")
          (#eq? @write "writeFile")
          (#eq? @exec "exec")
          (#eq? @shell "bash ")
          (#eq? @path @path_write)
          (#eq? @path @path_exec)
          (#eq? @decoded @data_write))

composite_rules:
  - id: node-base64-temp-bash-dropper
    desc: Runs encoded miner persistence dropper
    crit: hostile
    conf: 0.98
    all:
      - id: node-base64-temp-bash-flow
      - id: metadata/import/builtin::child-process-module-reference
