# An SDK whose real work happens at import time, in a function that (a) hides
# which package it loads and (b) refuses to load it when the process looks like
# CI or a test run. Neither half is proof alone — bundlers assemble specifiers,
# and plenty of libraries branch on NODE_ENV — but a package that conceals its
# runtime dependency *and* arranges for build systems and scanners never to see
# that dependency resolve has no honest reading. The payload itself lives in the
# separately published package the specifier names, which is why nothing else in
# the tarball looks wrong.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1195.002,T1027,T1497"
  mbc: "B0032,E1195.002"

composite_rules:
  - id: sandbox-gated-concealed-dependency-load
    desc: Import-time loader hides its dependency and skips CI
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: objectives/anti-static/obfuscation/imports::node-assembled-module-specifier-import
      - id: objectives/anti-analysis/environment-detect/check::node-ci-test-runtime-gate
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
    unless:
      - id: metadata/package/testing/presence/harness/
