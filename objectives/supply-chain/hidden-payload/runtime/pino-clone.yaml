# A copied logging library whose entrypoint reaches outside its package into
# hidden VCS configuration is a package-import payload.  The upstream marker
# makes this specific to a copied Pino cover; the relative hidden-config atom
# is generic and catches future clones without naming this package.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, markdown]
  attack: T1195.002,T1552.001

composite_rules:
  - id: pino-clone-hidden-vcs-config-import
    desc: Pino clone imports hidden VCS configuration outside the package
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/fs/path/config/app::relative-hidden-vcs-config-path
      - id: metadata/import/builtin::child-process-api-destructure
    any:
      - id: well-known/lib/observability/pino::pino-upstream-source-marker
      - id: well-known/lib/observability/pino::pino-source-branding
      - id: well-known/lib/observability/pino::pino-preload-sanitizer-source
    unless:
      - id: well-known/lib/observability/pino::pino-library-context

  - id: pino-clone-squatted-package-name
    desc: Pino source published under unrelated npm name
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: well-known/lib/observability/pino::pino-source-branding
      - id: metadata/package/documentation/package-metadata::readme-npm-links-exclude-manifest-package
    unless:
      - id: well-known/lib/observability/pino::pino-library-context

  - id: pino-clone-obfuscated-lib-config-loader
    desc: Pino-branded package requires an obfuscated lib/config payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/lib/observability/pino::pino-source-branding
      - id: micro-behaviors/os/module/require::relative-lib-config-require
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
    needs: 1
    unless:
      - id: well-known/lib/observability/pino::pino-library-context
