# A package CLI that converts arbitrary command-line arguments into a shell
# command and runs it invisibly is a command bridge, not ordinary npm glue.
# The archive rule adds the small-package/new-publication context so normal
# Windows tools that intentionally launch a hidden helper are not convicted by
# this pattern.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, package.json, archives]
  attack: "T1195.002,T1059.007,T1564.003"
  mbc: E1059

composite_rules:
  - id: js-hidden-argv-shell-bridge
    desc: JavaScript hides an argv-driven shell command
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-argv-command-string
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
      - id: micro-behaviors/process/create/spawn::stdio-ignore

  - id: npm-tiny-hidden-argv-shell-package
    desc: Tiny npm CLI hides an arbitrary command bridge
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: js-hidden-argv-shell-bridge
      - id: metadata/package/manifest/freeform::pkg-skeleton-small
      - id: metadata/registry::brand-new-package
