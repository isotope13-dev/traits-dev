defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # Both source observations mark the IIFE's function keyword. Requiring a
  # zero-distance join links the executable stage to this post-export body.
  - id: exported-module-appended-permutation-stage
    desc: Exported utility carries an appended concealed Node stage
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059.007,T1027
    scope: file
    near_bytes: 0
    all:
      - id: objectives/execution/payload/script-eval/transformed::node-permuted-code-factory-stage
      - id: micro-behaviors/data/control-flow/module-exec::commonjs-function-export-followed-by-iife
