# Go source that reads an embedded archive, AES-GCM-decrypts its members into
# a user-config directory, then shells out to `go run` on the decrypted tree.
# Seen in gocommunity.io/orderedbtree@v1.3.0 (Aikido-flagged): a `deprecated`
# package exports an innocuous-sounding `IsKeyExist` helper that silently
# unzips a bundled archive, AES-GCM-decrypts every `.tmp` member with a key
# derived from a hash of caller data, writes the plaintext to disk, and
# launches it with `exec.Command("go", "run", ...)`. Each atom (AES-GCM,
# zip reading, file write, process exec) is independently common in Go
# tooling; the combination in one file — decrypt an embedded blob, persist
# it, then compile-and-run it — has no legitimate use in a published data
# structure library.
defaults:
  platforms: [linux, macos, windows]
  for: [go]
  attack: T1027.013,T1059.007,T1105
  mbc: B0024,B0032

composite_rules:
  - id: go-decrypt-embedded-archive-then-build-run
    desc: Decrypts embedded archive then builds and runs it
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/data/archive/zip::zip-reader
      - id: micro-behaviors/fs/file/write/direct::go-os-writefile
      - id: micro-behaviors/process/create/direct::exec-command
