defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1027
traits:
- id: node-base64-checksum-payload
  desc: Node base64 checksum payload token
  crit: component
  conf: 0.92
  if:
    type: text
    substr: PAYLOAD_CHECKSUM
