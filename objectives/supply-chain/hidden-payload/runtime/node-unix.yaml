defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1027

traits:
  - id: node-base64-checksum-payload
    desc: Node base64 checksum payload
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: PAYLOAD_CHECKSUM

composite_rules:
  # A library entrypoint that decodes multiple local blobs, materializes
  # JavaScript, loads the generated path, and then erases both the source and
  # staged files is a runtime loader even when the decoded sidecars are not
  # available to the per-file analyzer.
  - id: node-decode-materialize-load-cleanup
    desc: Node decodes and cleans up a generated JavaScript stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1195.002,T1070.004
    mbc: B0024
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64
      - id: micro-behaviors/data/decode/base64::multiple-node-base64-decodes
      - id: micro-behaviors/fs/read/file/full::read-node
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/fs/write/file/target::node-writes-javascript-path
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/fs/delete/file/library::js-repeated-unlink-call

  # Source-map sidecars can carry the actual implementation as a Base64
  # data URL. Once the archive engine decodes that sidecar, this combination
  # identifies the remote-fetch, memory-hard key derivation, AES decrypt, and
  # eval chain that the visible entrypoint was hiding.
  - id: node-remote-decrypt-eval-loader
    desc: Node fetches, decrypts, and evaluates a remote session
    crit: hostile
    conf: 0.99
    attack: T1027,T1027.013,T1059.007,T1105,T1195.002
    mbc: B0024,B0032
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/dynamic::http-direct-method-headers-option
      - id: micro-behaviors/crypto/library/provider::node-memory-hard-kdf
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw

  - id: node-encoded-remote-session-config
    desc: Node config hides a remote endpoint and crypto credentials
    crit: suspicious
    conf: 0.95
    attack: T1027,T1105
    mbc: B0024
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/env/read::process-env
      - id: micro-behaviors/os/env/secret-name::service-credential-env-var
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc-dash

  - id: node-vm-decoded-payload
    desc: Node VM evaluates base64-decoded content
    crit: suspicious
    conf: 0.94
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64
      - id: micro-behaviors/process/interpreter/vm::vm-runInNewContext-call

  - id: node-runtime-hidden-payload
    desc: Node runtime hidden payload
    crit: hostile
    conf: 0.98
    all:
      - id: node-base64-checksum-payload
      - id: node-vm-decoded-payload

  - id: node-checksum-decoded-payload
    desc: Node checksum decoded payload
    crit: hostile
    conf: 0.98
    all:
      - id: node-base64-checksum-payload
      - id: objectives/anti-static/pack/archive::node-decode-payload-import

  - id: node-encoded-stage-detached-launcher
    desc: Node decodes embedded content, stages it as a file, and launches it detached
    crit: hostile
    conf: 0.98
    attack: "T1027, T1059.007, T1105"
    mbc: "B0032, F0011"
    for: [javascript, typescript]
    # Keep the decode/write/launch legs tightly coupled. A broad window paired
    # unrelated Firebase config decoding, settings writes, and media-player
    # launches in ordinary Node applications.
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn

  # Character-code obfuscation is a separate loader shape from base64. Keep
  # the hostile inference gated on the complete remote-stage sequence so that
  # ordinary char-code tables and ordinary detached workers remain neutral.
  - id: node-charcode-remote-stage-detached-launcher
    desc: Obfuscated Node remote executable stage with detached launch
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1105,T1222.002"
    mbc: "B0032,F0011"
    for: [javascript, typescript]
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/encode/char-code::long-numeric-array-literal
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
