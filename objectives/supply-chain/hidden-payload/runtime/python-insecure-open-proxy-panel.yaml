# Open SOCKS agents that disable TLS verification while registering with a
# remote operator panel turn the host into an insecure residential relay. The
# panel heartbeat composite in objectives/command-and-control/channel/proxy/
# covers the full control plane; this rule states the supply-chain delivery
# fact for versions that beacon without the separate heartbeat leg.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1090.002,T1195.002,T1071.001

composite_rules:
  - id: python-insecure-open-proxy-panel-beacon
    desc: Insecure open proxy registers with remote panel
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: micro-behaviors/communications/http/url/api-path::http-api-register-path
      - id: micro-behaviors/communications/http/ssl::requests-verify-false
      - id: micro-behaviors/communications/proxy/socks::python-socks-all-interfaces-constructor
