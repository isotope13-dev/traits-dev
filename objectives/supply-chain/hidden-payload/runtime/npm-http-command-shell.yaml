---
# Supply-chain context for packages whose advertised entrypoint is a
# network-exposed command shell. Generic HTTP, request-body, and process
# capabilities remain in micro-behaviors; this composite adds package intent.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [npm]
  attack: "T1195.002,T1059.007,T1505.003"
  mbc: B0030

composite_rules:
  - id: npm-package-reverse-shell-entrypoint
    for: [npm, package.json, javascript]
    desc: NPM entrypoint ships a Node reverse shell
    conf: 0.995
    attack: "T1195.002,T1059.004,T1095"
    mbc: B0030.002
    scope: archive
    all:
      - id: objectives/command-and-control/reverse-shell/stdio::js-net-options-bash-reverse-shell
      - id: metadata/package/entrypoint::pkg-main-field
      - id: metadata/package/entrypoint::bin-js-entry

  - id: npm-package-remote-shell-stage
    for: [npm, package.json, javascript]
    desc: NPM runtime entrypoint executes remote shell content
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
      - id: metadata/package/publishing::npm-public-publish-access

  - id: npm-package-http-command-shell
    for: [npm, package.json, javascript]
    desc: NPM package ships HTTP command shell
    conf: 0.995
    scope: archive
    all:
      - id: objectives/command-and-control/backdoor/tasking/http::node-public-post-command-shell
      - id: metadata/package/entrypoint::pkg-main-field
      - id: metadata/package/entrypoint::bin-js-entry

  - id: npm-entrypoint-temp-response-loader
    for: [npm, package.json, javascript]
    desc: NPM entrypoint executes and deletes fetched temp content
    conf: 0.99
    attack: "T1195.002,T1105,T1059.007,T1070.004"
    mbc: B0024
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/fs/write/file/full::node-write-file-promise
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/fs/delete/file/library::node-fs-promises-unlink
      - id: micro-behaviors/fs/path/temp::node-os-tmpdir
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: metadata/package/entrypoint::pkg-main-field
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
