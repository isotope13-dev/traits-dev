---
# Supply-chain context for packages whose advertised entrypoint is a
# network-exposed command shell. Generic HTTP, request-body, and process
# capabilities remain in micro-behaviors; this composite adds package intent.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [npm]
  attack: "T1195.002,T1059.007,T1505.003"
  mbc: B0030

composite_rules:
  - id: nearby-fetch-decrypt-exec-cleanup
    for: [javascript]
    crit: suspicious
    desc: Nearby fetch, decrypt, execute and cleanup operations
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/http/request/client/exchange::fetch-post-pattern
      - id: micro-behaviors/fs/write/file/full/call::node-write-file-promise
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/fs/delete/file/library::node-fs-promises-unlink
      - id: micro-behaviors/os/sysinfo/directories::node-os-tmpdir
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
  - id: npm-entrypoint-temp-response-loader
    for: [npm, package.json, javascript]
    desc: NPM package contains nearby fetch, decrypt, execute and cleanup code
    crit: suspicious
    conf: 0.99
    attack: "T1195.002,T1105,T1059.007,T1070.004"
    mbc: B0024
    scope: archive
    all:
      - id: nearby-fetch-decrypt-exec-cleanup
      - id: metadata/package/entrypoint/module::pkg-main-field
    unless:
      - id: metadata/path/directory::test-directory-component
