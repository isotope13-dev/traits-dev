defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1105

traits:
  - id: browser-kernel-module-loader-marker
    desc: Browser kernel remote loader
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)(ModuleLoader\s*\.\s*fetchModule|Orchestrator\s*\.\s*run|kernel\s*\.\s*ModuleLoader)'

  # Dean Edwards' packer leaves the original string table in plain text while
  # hiding the executable DOM calls behind short table indices.  Keep these
  # atoms as cheap literal probes; the hostile composite below provides the
  # multi-behavior correlation.
  - id: packed-browser-createelement-marker
    desc: Packed browser createElement marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: createElement
  - id: packed-browser-contextual-fragment-marker
    desc: Packed contextual fragment marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: createContextualFragment
  - id: packed-browser-appendchild-marker
    desc: Packed browser appendChild marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: appendChild
  - id: packed-browser-setattribute-marker
    desc: Packed browser setAttribute marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: setAttribute
  - id: packed-browser-http-marker
    desc: Packed browser HTTP marker
    crit: component
    conf: 0.85
    if:
      type: text
      substr: https
  - id: packed-browser-location-marker
    desc: Packed browser location marker
    crit: component
    conf: 0.85
    if:
      type: text
      substr: location
  - id: packed-browser-indexof-marker
    desc: Packed browser indexOf marker
    crit: component
    conf: 0.85
    if:
      type: text
      substr: indexOf

composite_rules:
  - id: packed-browser-dom-creation
    desc: Packed browser creates a script-bearing DOM node
    crit: notable
    conf: 0.92
    any:
      - id: packed-browser-createelement-marker
      - id: packed-browser-contextual-fragment-marker

  - id: packed-browser-dom-insertion
    desc: Packed browser inserts a DOM script node
    crit: notable
    conf: 0.92
    any:
      - id: packed-browser-appendchild-marker
      - id: packed-browser-setattribute-marker

  - id: packed-targeted-remote-script-loader
    desc: Packed JavaScript targets a page and injects remote script
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059.007,T1105
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
      - id: packed-browser-http-marker
      - id: packed-browser-location-marker
      - id: packed-browser-indexof-marker
      - id: packed-browser-dom-creation
      - id: packed-browser-dom-insertion

  # A remote script element is a legitimate mechanism in a full browser
  # application. It is a different release shape when a published dist member
  # consists only of that loader: the package has replaced local behavior with
  # code selected by an external server after publication. Keep every leg
  # file-local so an ordinary bundle's loader and unrelated compact helpers do
  # not combine at archive scope.
  - id: compact-dist-remote-script-loader
    desc: Compact package dist file injects remote script
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
      - id: micro-behaviors/ui/window/manage/dom::browser-append-child
      - id: metadata/file/metrics::file-one-liner
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
    near_bytes: 512

  # An HTML package entrypoint that immediately executes code selected from a
  # mutable forge branch delegates the published package's behavior to bytes
  # the publisher can replace after review. The file-local dropper composite
  # proves fetch + HTML parse + script reconstruction; the manifest leg ties
  # that hostile loader to the package's public runtime surface.
  - id: npm-html-entry-mutable-remote-bootstrap
    desc: npm HTML entrypoint bootstraps mutable remote code
    crit: hostile
    conf: 0.99
    for: [npm, tar]
    scope: archive
    attack: T1195.002,T1105,T1059.007
    all:
      - id: metadata/package/manifest/entrypoint::main-html-entry
      - id: objectives/command-and-control/dropper/execution/browser::mutable-branch-remote-html-execution
      - id: metadata/package/quality/empty::npm-empty-author

  - id: archive-ios-gated-kernel-remote-loader
    desc: Published archive gates a kernel loader on iOS and remote code
    crit: hostile
    conf: 0.99
    for: [npm, tar, archives]
    scope: archive
    attack: T1195.002,T1105,T1059.007,T1614.001
    all:
      - id: metadata/package/manifest/publishing::npm-public-publish-access
      - id: browser-kernel-module-loader-marker
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
      - id: micro-behaviors/os/sysinfo/platform/browser::ios-device-capability-check

  - id: archive-hidden-ios-iframe-remote-stage
    desc: Published archive hides a remote iframe behind iOS gating
    crit: hostile
    conf: 0.99
    for: [npm, tar, archives]
    scope: archive
    attack: T1195.002,T1105,T1614.001,T1027
    all:
      - id: metadata/package/manifest/publishing::npm-public-publish-access
      - id: micro-behaviors/os/sysinfo/platform/browser::ios-device-capability-check
      - id: micro-behaviors/ui/window/manage/dom::browser-create-iframe-element
      - id: micro-behaviors/process/create/load/remote-code::js-remote-src-assignment
      - id: micro-behaviors/ui/window/manage/style::zero-size-element-style

  # A wallet SDK whose published entry point is nothing but a remote loader.
  #
  # @ledgerhq/connect-kit 1.1.6 (2023) shipped a 244-byte `dist/umd/index.js`
  # that appended a script from a hex-named jsDelivr package and did nothing
  # else, while the manifest still declared the dependencies of the real
  # library. Every site embedding Ledger's wallet connector then loaded
  # whatever that URL served -- which was a drainer.
  #
  # The package identity leg is what makes this hostile rather than merely
  # odd: a loader stub is a plausible shape for an analytics snippet, but not
  # for the library that brokers a hardware wallet.
  - id: crypto-sdk-entry-is-remote-loader
    desc: Crypto SDK entry point is a remote loader
    crit: hostile
    conf: 0.97
    for: [npm, tar, zip]
    scope: archive
    all:
      - id: compact-dist-remote-script-loader
      - id: well-known/lib/crypto/sdk::official-crypto-sdk-manifest
    any:
      - id: micro-behaviors/communications/http/url/cdn::jsdelivr-hex-named-package
      - id: metadata/package/dependencies/manifest::npm-phantom-runtime-dependency

# A published front-end bundle whose entry fetches program text at runtime and
# compiles it as code. The bundle the consumer installed is only a loader;
# whatever runs next is decided by the response, so the shipped artifact
# guarantees nothing about its own behavior.
#
# Worked example: the bdthemes display_id stage1, which fetches remote text
# and hands it to the Function constructor.
  - id: front-end-entry-remote-code-compile
    desc: Front-end entry compiles fetched text as code
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::fetch-text-function-code
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
