defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1105

composite_rules:
  # A remote script element is a legitimate mechanism in a full browser
  # application. It is a different release shape when a published dist member
  # consists only of that loader: the package has replaced local behavior with
  # code selected by an external server after publication. Keep every leg
  # file-local so an ordinary bundle's loader and unrelated compact helpers do
  # not combine at archive scope.
  - id: compact-dist-remote-script-loader
    desc: Compact package dist file injects remote script
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
      - id: micro-behaviors/ui/window/manage/dom::browser-append-child
      - id: metadata/file/metrics::file-one-liner
      - id: metadata/package/files/package-json::npm-dist-tree-member
    near_bytes: 512
