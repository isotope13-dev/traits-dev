defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  - typescript
  attack: T1195.002,T1027.003
  mbc: B0024
  crit: hostile
composite_rules:
- id: npm-import-time-hidden-image-stage
  desc: NPM import downloads image into hidden temp file
  conf: 0.98
  attack: T1195.002,T1105,T1564.001
  mbc: E1105
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
  - id: micro-behaviors/communications/http/url/media::image-file-url
  - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-close
  any:
  - id: micro-behaviors/fs/path/temp::node-tmpdir-hidden-entry-reference
  - id: micro-behaviors/fs/path/self::node-package-dot-cache-path
  needs: 1
  near_lines: 24
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: npm-import-time-github-raw-hidden-image-drop
  desc: npm import caches GitHub raw image in hidden tmp
  conf: 0.99
  attack: T1195.002,T1105,T1564.001,T1071.001
  scope: archive
  all:
  - id: npm-import-time-hidden-image-stage
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-any
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
