# Staged PNG stego loaders that poll for a sibling module's drop file before
# decrypting an appended executable. Neutral polling and format operations
# live in micro-behaviors; these composites carry supply-chain staging intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1027.003
  mbc: B0024

composite_rules:
  - id: npm-staged-png-aes-exe-dropper
    desc: NPM module polls then decrypts PNG tail exe
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027.003,T1140
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/anti-static/obfuscation/steganography/image::javascript-png-tail-aes-exe-dropper
      - id: micro-behaviors/fs/watch/monitor::node-recursive-file-existence-poll
    unless:
      - id: metadata/package/testing/

  - id: npm-side-effect-dependency-png-loader
    desc: NPM entry loads dependency before staged PNG decryption
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027.003,T1140
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/os/module/require::cjs-side-effect-package-require
      - id: objectives/anti-static/obfuscation/steganography/image::javascript-png-tail-aes-exe-dropper
      - id: micro-behaviors/fs/watch/monitor::node-recursive-file-existence-poll
    unless:
      - id: metadata/package/testing/

  - id: npm-import-time-hidden-image-stage
    desc: NPM import downloads image into hidden temp file
    crit: suspicious
    conf: 0.97
    attack: T1195.002,T1105,T1564.001
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
      - id: micro-behaviors/communications/http/url/path::image-file-url
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-close
      - id: micro-behaviors/fs/path/temp::node-hidden-tmpdir-file
    near_lines: 24
    unless:
      - id: metadata/package/testing/
