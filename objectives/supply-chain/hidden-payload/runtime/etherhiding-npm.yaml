# npm packages whose published dist stashes an obfuscator.io EtherHiding
# loader: global require/module aliasing plus surviving Ethereum RPC and
# explorer account API fragments. Distinct from generic obfuscation hostiles
# under anti-static/ — this captures the supply-chain on-chain C2 handoff.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, archives]
  attack: T1195.002,T1102
  mbc: B0030

composite_rules:
  - id: npm-dist-obfuscated-etherhiding-loader
    desc: npm dist obfuscates an EtherHiding Ethereum RPC loader
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1102,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::global-require-module-aliasing
      - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
      - id: micro-behaviors/communications/http/services/blockchain::explorer-module-account-fragment
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: objectives/command-and-control/dropper/delivery/blockchain::obfuscated-etherhiding-hex-stage-dropper
