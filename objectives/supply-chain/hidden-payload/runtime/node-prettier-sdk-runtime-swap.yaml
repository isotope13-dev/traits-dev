defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1059.007

traits:
  - id: node-prettier-sdk-runtime-swap-command
    desc: Reinstalls prettier-sdk at runtime
    crit: suspicious
    if:
      type: text
      substr: 'npm uninstall prettier-sdk && npm install prettier-sdk'
  - id: node-prettier-sdk-hidden-stdio
    desc: Suppresses output from dependency replacement
    crit: notable
    if:
      type: text
      substr: 'stdio: "ignore"'
  - id: node-prettier-sdk-worker-guard
    desc: Runs replacement when worker support exists
    crit: notable
    if:
      type: text
      substr: 'if (Worker !== undefined)'

composite_rules:
  - id: node-prettier-sdk-silent-runtime-swap
    desc: Silently replaces npm package during module import
    crit: hostile
    conf: 0.99
    all:
      - id: node-prettier-sdk-runtime-swap-command
      - id: node-prettier-sdk-hidden-stdio
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
      - id: node-prettier-sdk-worker-guard
