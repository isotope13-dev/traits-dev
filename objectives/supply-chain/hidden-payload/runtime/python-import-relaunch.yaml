defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1059.006

composite_rules:
  # Module-level Popen of sys.executable with discarded output is also the whole
  # body of a restart or launcher script run from a command line (kill the old
  # daemon, start a fresh one), and a shebang cannot reliably mark such a script.
  # The windowless variant below keeps the hostile verdict; this shape alone is
  # a silent relaunch worth reviewing.
  - id: python-import-time-interpreter-relaunch
    desc: Imported module silently relaunches the interpreter
    crit: suspicious
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
    any:
      - id: micro-behaviors/process/argument/option::python-module-launch-argv
      - id: micro-behaviors/process/create/subprocess::sys-executable-popen
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/os/package-manager/dependency-probe::pypi-json-api-url
  - id: python-import-time-windowless-relaunch
    desc: Imported module silently launches windowless interpreter
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1059.006,T1564.003
    near_lines: 25
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

