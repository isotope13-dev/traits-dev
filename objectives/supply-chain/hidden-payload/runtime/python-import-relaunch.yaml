# PyPI packages that spawn a detached copy of the current interpreter at import
# time hide the payload behind a normal module import. Legitimate libraries
# declare metadata at module scope; they do not silently re-exec themselves
# with suppressed stdio on every import.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1059.006

composite_rules:
  - id: python-import-time-interpreter-relaunch
    desc: Imported module silently relaunches the interpreter
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
    any:
      - id: micro-behaviors/process/create/launch::sys-executable-module-launch
      - id: micro-behaviors/process/create/subprocess::sys-executable-popen
