# A Go package that starts `go run` on some directory and immediately
# releases the child: the compiled program never waits for, reads from, or
# reports on what it launched. That is the hand-off step of source-shipping
# Go droppers, which carry their second stage as Go source (often decrypted
# from a bundled archive into the user config directory) and use the
# victim's own toolchain to build and start it, detached from the parent.
# Seen in gocommunity.io/orderedbtree and gogets.dev/btreex (helper
# StartChild/StartProcess, and the deprecated IsKeyExist loader) and in the
# gocommunity-io dockerd Terraform provider (a docker_container create
# handler). Build tools and live-reload watchers also run `go`, but they
# wait on the child or stream its output; none of them release it.
defaults:
  platforms: [linux, macos, windows]
  for: [go]
  attack: T1059,T1127
  mbc: B0024

composite_rules:
  - id: go-detached-toolchain-run
    desc: Go code launches the go toolchain and abandons it
    crit: suspicious
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/process/create/compile::go-toolchain-exec-command
      - id: micro-behaviors/process/create/compile::go-process-release
