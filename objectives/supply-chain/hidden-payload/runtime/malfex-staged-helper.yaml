# MALFEX-style npm runners: a runtime dependency that nothing uses as a
# library stages `node_runtime_helper.exe` under the user profile; the entry
# module polls or watches for that file, then detached-spawns it hidden. The
# staging dependency is pulled in either by a side-effect `require()` at
# import time or solely by the manifest (install-time delivery).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, package.json, npm, tar, zip]
  attack: T1195.002,T1059.007,T1564.003
  mbc: B0032

composite_rules:
  # One alternative, not two composites: the helper-staging dependency is
  # delivered either by a side-effect require() or by a manifest entry no
  # shipped code imports. Alone this fires on polyfill requires and ordinary
  # unused deps; the launch composite supplies the staged-helper context.
  - id: npm-staged-helper-dependency-pull-in
    desc: Runtime dependency pulled in for side effects
    crit: component
    conf: 0.9
    scope: archive
    any:
      - id: micro-behaviors/os/module/require::cjs-side-effect-package-require
      - id: metadata/package/dependencies/manifest/reconciliation::npm-phantom-runtime-dependency
  - id: npm-cjs-staged-windows-helper-detached-launch
    desc: npm CJS entry waits for profile helper exe
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: npm-staged-helper-dependency-pull-in
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
      - id: micro-behaviors/fs/path/application/executable::node-runtime-helper-exe-basename
    any:
      - id: micro-behaviors/fs/watch::node-recursive-file-existence-poll
      - id: micro-behaviors/fs/watch::node-fs-watch-call

  - id: npm-img-to-native-staged-helper-runner
    desc: img-to-native dependency with staged helper launcher
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-img-to-native
      - id: npm-cjs-staged-windows-helper-detached-launch
    unless:
      - id: metadata/package/testing/

      - id: "metadata/file/naming::test-directory-component"
  - id: npm-img-to-native-staged-helper-package
    desc: img-to-native package watches for staged helper exe
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::npm-package-name-img-to-native
      - id: npm-staged-helper-dependency-pull-in
      - id: micro-behaviors/fs/path/application/executable::node-runtime-helper-exe-basename
    any:
      - id: micro-behaviors/fs/watch::node-fs-watch-call
      - id: micro-behaviors/fs/watch::node-recursive-file-existence-poll
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
