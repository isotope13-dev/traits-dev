# MALFEX-style npm runners: a side-effect `require()` pulls in a dependency
# that stages `node_runtime_helper.exe` under the user profile; the entry
# module polls or watches for that file, then detached-spawns it hidden.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, package.json, npm, tar, zip]
  attack: T1195.002,T1059.007,T1564.003
  mbc: B0032

composite_rules:
  - id: npm-cjs-staged-windows-helper-detached-launch
    desc: npm CJS entry waits for profile helper exe
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/os/module/require::cjs-side-effect-package-require
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
      - id: micro-behaviors/fs/path/application/executable::node-runtime-helper-exe-basename
    any:
      - id: micro-behaviors/fs/watch::node-recursive-file-existence-poll
      - id: micro-behaviors/fs/watch::node-fs-watch-call

  - id: npm-img-to-native-staged-helper-runner
    desc: img-to-native dependency with staged helper launcher
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-img-to-native
      - id: npm-cjs-staged-windows-helper-detached-launch
    unless:
      - id: metadata/package/testing/
