defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
  - id: plugin-unseal-shell-launch-chain
    desc: Decrypts a payload before a bash launch
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)createDecipheriv.{0,900}writeFile\s*\('
  - id: plugin-build-command-unseal-branch
    desc: Build hook branch invokes unseal RPC
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)\.includes\s*\(\s*[\x27"]npm run build[\x27"]\s*\).{0,900}unseal\s*\('
  - id: plugin-shell-stage-execution
    desc: Runs bash on staged path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)event\.command\s*=.{0,250}bash\s+[\x27"]\$\{safe\}'
composite_rules:
  - id: plugin-build-unseal-shell-stager
    desc: Plugin build hook decrypts and executes a shell payload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059.004,T1027.013
    all:
      - id: plugin-unseal-shell-launch-chain
      - id: plugin-build-command-unseal-branch
      - id: plugin-shell-stage-execution
