defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: browser-utility-appended-cookie-exfiltration
    desc: UI utility carries an appended cookie exfiltration stage
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 0
    all:
      - id: objectives/exfiltration/stealer/application-state/cookie::document-cookie-external-fetch-url
      - id: micro-behaviors/data/control-flow/module-exec::browser-init-iife-followed-by-cookie-fetch
