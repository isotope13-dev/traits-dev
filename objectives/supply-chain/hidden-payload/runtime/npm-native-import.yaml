# npm modules that execute a bundled native sidecar merely by being imported.
# Native accelerators do exist, so require an additional concealment signal:
# swallowed errors, a copied/renamed payload, a fixed digest, executable chmod,
# or output disposal. The package-tree constraint keeps this out of ordinary
# application launchers.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, archives]
  attack: "T1195.002,T1059.007"
  mbc: "B0032,F0011"

composite_rules:
  - id: npm-import-time-hash-gated-native-launch
    desc: npm import verifies and launches bundled payload
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/files/package-json::npm-dist-tree-member
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
      - id: micro-behaviors/crypto/hash/digest::source-fixed-sha256-context
      - id: micro-behaviors/process/create/spawn-variable::spawn-variable-program
    unless:
      - id: metadata/package/testing/

  - id: npm-import-time-chmod-hash-native-launch
    desc: npm import makes verified bundled payload executable
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/package/files/package-json::npm-dist-tree-member
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
      - id: micro-behaviors/crypto/hash/digest::source-fixed-sha256-context
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/spawn-variable::spawn-variable-program
    unless:
      - id: metadata/package/testing/

  - id: npm-import-time-detached-silent-native-launch
    desc: npm import silently detaches bundled payload
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/files/package-json::npm-dist-tree-member
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
      - id: micro-behaviors/process/create/spawn-variable::spawn-variable-program
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/fd/stdio::node-child-output-discarded
    unless:
      - id: metadata/package/testing/

  - id: npm-import-time-concealed-native-sidecar
    desc: npm import silently starts a concealed sidecar
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/files/package-json::npm-dist-tree-member
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
      - id: micro-behaviors/process/create/spawn-variable::spawn-variable-program
    any:
      - id: micro-behaviors/crypto/hash/digest::source-fixed-sha256-context
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/fd/stdio::node-child-output-discarded
      - id: micro-behaviors/fs/file/copy::fs-copyfileSync
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-block
      - id: micro-behaviors/data/control-flow/error-handling::empty-optional-catch-block
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/quality/benign-context::benign-app-fp-context

  # These archive-level chains connect the npm execution mechanism to behavior
  # inside the bundled executable. They remain useful when a future campaign
  # changes package names, payload hashes, file extensions, or native format.
  - id: npm-import-time-native-sidecar
    desc: npm import launches a bundled native executable
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: npm-import-time-concealed-native-sidecar
      - id: metadata/file/format/native-executable::native-executable-image

  - id: npm-import-time-native-credential-theft
    desc: npm import launches native credential theft
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: npm-import-time-native-sidecar
      - id: objectives/supply-chain/hidden-payload/package::npm-native-binary-credential-targeting
