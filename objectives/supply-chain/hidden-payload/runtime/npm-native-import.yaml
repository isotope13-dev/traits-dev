defaults:
  crit: hostile
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - npm
  attack: T1195.002,T1059.007
  mbc: B0032,F0011
composite_rules:
- id: npm-import-time-hash-gated-native-launch
  desc: npm import verifies and launches bundled payload
  conf: 0.99
  all:
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
  - id: micro-behaviors/os/security/auth/digest-comparison::source-fixed-sha256-context
  - id: micro-behaviors/process/create/exec::spawn-variable-program
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/development/build/vite::official-vite-package-context
  - id: metadata/build/bundler/runtime::rolldown-bundled
  - id: well-known/lib/development/esbuild::esbuild-package-context
  - id: metadata/path::test-directory-component
- id: npm-import-time-chmod-hash-native-launch
  desc: npm import makes verified bundled payload executable
  conf: 0.995
  all:
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
  - id: micro-behaviors/os/security/auth/digest-comparison::source-fixed-sha256-context
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/create/exec::spawn-variable-program
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/development/build/vite::official-vite-package-context
  - id: metadata/build/bundler/runtime::rolldown-bundled
  - id: well-known/lib/development/esbuild::esbuild-package-context
  - id: metadata/path::test-directory-component
- id: npm-import-time-detached-silent-native-launch
  desc: npm import silently detaches bundled payload
  conf: 0.99
  all:
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
  - id: micro-behaviors/process/create/exec::spawn-variable-program
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/process/fd/stdio::node-child-output-discarded
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/development/build/vite::official-vite-package-context
  - id: metadata/build/bundler/runtime::rolldown-bundled
  - id: well-known/lib/development/esbuild::esbuild-package-context
  - id: metadata/path::test-directory-component
- id: npm-import-time-concealed-native-sidecar
  desc: npm import silently starts a concealed sidecar
  conf: 0.98
  scope: file
  near_lines: 40
  all:
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
  - id: micro-behaviors/process/create/exec::spawn-variable-program
  any:
  - id: micro-behaviors/os/security/auth/digest-comparison::source-fixed-sha256-context
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/fd/stdio::node-child-output-discarded
  - id: micro-behaviors/fs/file/copy/call::js-copyfile-sync-call
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: well-known/tool/development/build/vite::official-vite-package-context
  - id: metadata/build/bundler/runtime::rolldown-bundled
  - id: well-known/lib/development/esbuild::esbuild-package-context
  - id: metadata/path::test-directory-component
- id: npm-import-time-native-sidecar
  desc: npm import launches a bundled native executable
  conf: 0.99
  for:
  - javascript
  - npm
  - elf
  - macho
  - pe
  scope: archive
  all:
  - id: npm-import-time-concealed-native-sidecar
  - id: metadata/file/format/native-executable::native-executable-image
- id: npm-import-time-native-credential-theft
  desc: npm import launches native credential theft
  conf: 0.995
  scope: archive
  all:
  - id: npm-import-time-native-sidecar
  - id: objectives/supply-chain/hidden-payload/package::npm-native-binary-credential-targeting
- id: npm-dist-base64-fetch-commonjs-loader
  desc: npm dist fetches concealed URL and runs CommonJS
  conf: 0.995
  attack: T1195.002,T1105,T1059.007
  mbc: B0009.016
  for:
  - javascript
  - typescript
  near_bytes: 1024
  all:
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: micro-behaviors/communications/url/encoded::fetch-buffer-base64-decoded-url
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/metaprogramming/generation::js-function-constructor-commonjs-wrapper
  - id: micro-behaviors/data/control-flow/direct-call::js-commonjs-synthetic-module-run
