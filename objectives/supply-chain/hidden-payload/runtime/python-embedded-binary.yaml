defaults:
  platforms: [unix, windows]
  for: [whl, python]
  attack: T1195.002

composite_rules:
- id: pypi-detached-hidden-stage-binary
  desc: Python package spawns detached hidden stage binary
  crit: hostile
  conf: 0.99
  scope: outer
  all:
  - id: metadata/build/archive::archive-dotdir-linux-os-arch-member
  - id: metadata/build/archive::archive-dotdir-darwin-os-arch-member
  - id: metadata/build/archive::archive-dotdir-windows-os-arch-member
  - id: micro-behaviors/fs/path/location::python-package-dotdir-binary-path
  - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
  - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-text"

- id: pypi-logging-init-hidden-stage-trigger
  desc: Python logging setup imports hidden stage trigger
  crit: hostile
  conf: 0.98
  scope: outer
  all:
  - id: metadata/build/archive::archive-dotdir-linux-os-arch-member
  - id: metadata/build/archive::archive-dotdir-darwin-os-arch-member
  - id: metadata/build/archive::archive-dotdir-windows-os-arch-member
  - id: micro-behaviors/os/module/load::indented-import-followed-call
  - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
