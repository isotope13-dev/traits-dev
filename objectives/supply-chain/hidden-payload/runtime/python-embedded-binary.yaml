# Python packages that ship a concealed native sidecar and launch it from
# import-time or logging setup code. Native accelerators exist, so conviction
# requires the cross-platform dot-directory layout plus detached, silent spawn.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  attack: T1195.002

composite_rules:
  - id: pypi-detached-hidden-stage-binary
    desc: Python package spawns detached hidden stage binary
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/build/archive::archive-dotdir-linux-os-arch-member
      - id: metadata/build/archive::archive-dotdir-darwin-os-arch-member
      - id: metadata/build/archive::archive-dotdir-windows-os-arch-member
      - id: micro-behaviors/fs/path-ops/join::python-parent-dotdir-join
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: micro-behaviors/process/fd/stdio::python-subprocess-stdio-suppression

  - id: pypi-logging-init-hidden-stage-trigger
    desc: Python logging setup imports hidden stage trigger
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/build/archive::archive-dotdir-linux-os-arch-member
      - id: metadata/build/archive::archive-dotdir-darwin-os-arch-member
      - id: metadata/build/archive::archive-dotdir-windows-os-arch-member
      - id: micro-behaviors/os/module/load::indented-import-followed-call
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
