# Runtime-concealed library loaders in the indexed-btree shape: no install
# hooks, so lifecycle-script blocks never see them. The loader fingerprints
# the host and reports the profile to two messaging channels, then merges
# fetched blobs into a second stage, executes it, and deletes itself. Either
# conviction below stands alone; the file-local combination is the loader.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1059.007

composite_rules:
  - id: dualmessenger-sysinfo-exfiltration
    desc: Posts host profile to Slack and Telegram
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 2048
    all:
      - id: objectives/supply-chain/recon-exfil/npm-install-targeting::js-sysinfo-https-post-body
      - id: objectives/command-and-control/channel/messaging::telegram-bot-token-sendmessage-path

  - id: hex-blob-merge-function-exec
    desc: Hex blob merge executed via Function
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-to-utf8
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
    any:
      - id: objectives/evasion/self-delete/file/script::unlink-filename
