# Runtime-concealed library loader in the indexed-btree shape: no install
# hooks, so lifecycle-script blocks never see it. The loader merges fetched
# blobs into a second stage, executes it, and deletes itself.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  - id: hex-blob-merge-function-exec
    desc: Hex blob merge executed via Function
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-to-utf8
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
    any:
      - id: micro-behaviors/fs/delete/file/self::unlink-filename
