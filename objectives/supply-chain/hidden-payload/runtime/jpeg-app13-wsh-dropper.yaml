# npm packages that hide a Windows command in JPEG APP13 metadata. The image is
# bundled beside a dist entrypoint; a hand-rolled marker walk extracts the
# segment and feeds it to a hidden wscript -> PowerShell EncodedCommand chain.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar, zip]
  attack: T1195.002,T1027.003,T1059.001

composite_rules:
  - id: npm-dist-jpeg-metadata-wsh-dropper
    desc: npm dist entrypoint launches a JPEG-hidden WSH dropper
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/entrypoint::main-dist-entrypoint
      - id: micro-behaviors/data/format/media/raster::javascript-jpeg-app13-segment-parser
      - id: micro-behaviors/data/format/media/raster::node-package-jpeg-path-join
      - id: objectives/command-and-control/dropper/execution/wsh::self-deleting-hidden-encoded-command-relay
    unless:
      - id: well-known/tool/detection/
