# Correlates two package-level supply-chain signals that, together, describe
# a concrete backdoor delivery chain: a bundled archive disguised as a native
# library (so it can't be inspected as code, and matches the extension every
# scanner-exclusion list in the package already ignores), plus source in the
# same archive that AES-GCM-decrypts a bundled archive and builds/runs the
# result. Individually each composite already stands on its own evidence;
# this correlator raises confidence when both are present in one package,
# as in gocommunity.io/orderedbtree@v1.3.0 (Aikido-flagged), where
# orderedbtree.so is the disguised zip and deprecated/node.go is the
# decrypt-and-run loader. The disguise may also be a data file: gogets.dev/btreex
# ships the same zip as btreex.sql, and the gocommunity-io dockerd Terraform
# provider as import-resource.sqlite3.
defaults:
  platforms: [linux, macos, windows]
  for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
  attack: T1027.013,T1059.007,T1105

composite_rules:
  - id: archive-disguised-library-feeds-decrypt-execute-chain
    desc: Disguised archive paired with decrypt-and-run loader
    crit: hostile
    conf: 0.97
    scope: archive
    for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, go, apk, alpine_apk, ipa]
    all:
      - id: objectives/supply-chain/hidden-payload/runtime::go-decrypt-embedded-archive-then-build-run
    any:
      - id: objectives/evasion/masquerade/extension-mismatch::archive-disguised-as-native-library
      - id: objectives/evasion/masquerade/extension-mismatch::archive-disguised-as-database-file

  # The same delivery seen from what survives compilation. A release zip of
  # the gocommunity-io dockerd Terraform provider carries no loader source,
  # only the Go binary (whose loader functions keep their hash-derived names
  # in the pclntab) beside examples/.../import-resource.sqlite3, the payload
  # zip it reads relative to os.Executable(). Hash-renamed identifiers and a
  # disguised archive are each rare; one package shipping both is the
  # renamed loader and the blob it decrypts.
  #
  # `for:` must name the member types the legs come from, not just the
  # container: container composites only count a member's finding when that
  # member's type is in `for:` (finding_origins). Listing only archive types
  # left the ELF's hash-named-functions leg invisible, so the rule never
  # fired on a release zip even though both legs rolled up to it.
  - id: archive-database-disguise-with-hash-named-code
    desc: Database-named archive shipped with hash-renamed code
    crit: hostile
    conf: 0.94
    scope: archive
    for: [binaries, source, scripts, zip, tar, jar, whl, gem, npm, crate]
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::archive-disguised-as-database-file
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/variables::hash-named-local-assignments
      - id: objectives/anti-static/obfuscation/name-mangling/variables::go-binary-hash-named-functions

  - id: archive-library-disguise-with-hash-named-code
    desc: Library-named archive shipped with hash-renamed code
    crit: hostile
    conf: 0.94
    scope: archive
    for: [binaries, source, scripts, zip, tar, jar, whl, gem, npm, crate]
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::archive-disguised-as-native-library
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/variables::hash-named-local-assignments
      - id: objectives/anti-static/obfuscation/name-mangling/variables::go-binary-hash-named-functions
