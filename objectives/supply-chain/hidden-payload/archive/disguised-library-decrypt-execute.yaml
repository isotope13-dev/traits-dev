# Correlates two package-level supply-chain signals that, together, describe
# a concrete backdoor delivery chain: a bundled archive disguised as a native
# library (so it can't be inspected as code, and matches the extension every
# scanner-exclusion list in the package already ignores), plus source in the
# same archive that AES-GCM-decrypts a bundled archive and builds/runs the
# result. Individually each composite already stands on its own evidence;
# this correlator raises confidence when both are present in one package,
# as in gocommunity.io/orderedbtree@v1.3.0 (Aikido-flagged), where
# orderedbtree.so is the disguised zip and deprecated/node.go is the
# decrypt-and-run loader.
defaults:
  platforms: [linux, macos, windows]
  for: [archives]
  attack: T1027.013,T1059.007,T1105

composite_rules:
  - id: archive-disguised-library-feeds-decrypt-execute-chain
    desc: Disguised archive paired with decrypt-and-run loader
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::archive-disguised-as-native-library
      - id: objectives/supply-chain/hidden-payload/runtime::go-decrypt-embedded-archive-then-build-run
