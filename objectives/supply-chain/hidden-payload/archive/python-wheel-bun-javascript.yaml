# A Python wheel that ships JavaScript and a site-packages .pth which fetches
# the Bun runtime carries a payload Python tooling never inspects: the .pth
# runs at every interpreter start, downloads Bun, and hands it the bundled
# script. The script name, its directory and the URL spelling vary between
# releases; the .pth trigger, the Bun release asset path and a JavaScript
# member in the same wheel do not.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1546,T1059.007

composite_rules:
  - id: wheel-pth-bun-runs-bundled-javascript
    desc: Wheel .pth bootstraps Bun for bundled JavaScript
    crit: hostile
    conf: 0.97
    for: [whl, zip, python]
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-release-download-path
      - id: metadata/archive/member/extension::archive-js-member
