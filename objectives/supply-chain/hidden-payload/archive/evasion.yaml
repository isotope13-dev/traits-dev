defaults:
  platforms:
    - unix
    - windows
traits:
  - id: nested-archive-tgz
    desc: Nested .tgz archive in package
    crit: suspicious
    conf: 0.85
    for:
      - javascript
    if:
      type: string_literal
      regex: (^|/)node_modules/[^/]{1,120}/[^/]{1,120}\.tgz$|package/[^/]{1,120}\.tgz
    unless:
      - id: metadata/package/testing/harness/runtime::test-basename-suffix

composite_rules:
  # A delivered ZIP whose VBScript member rebuilds an obfuscated PowerShell
  # stage and evaluates it is a malicious delivery artifact. Require both the
  # archive member type and the member-level loader finding in the same
  # archive bucket.
  - id: zip-delivers-junk-padded-powershell-loader
    desc: ZIP delivers a junk-padded VBScript PowerShell loader
    crit: hostile
    conf: 0.98
    for: [zip, vbs]
    scope: archive
    attack: T1027,T1059.001,T1059.005,T1204.002
    all:
      - id: metadata/package/files/archive-member::archive-vbs-member
      - id: objectives/anti-static/obfuscation/string/junking::junk-padded-powershell-execute-loader
