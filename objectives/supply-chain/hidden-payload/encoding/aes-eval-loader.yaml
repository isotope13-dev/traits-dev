# First-stage loader shape: a hardcoded symmetric key decrypts an
# embedded hex payload and the plaintext is handed straight to eval.
# A decipher alone is data handling, and eval alone is a language
# feature; a static-key decrypt whose output is executed is a packed
# payload whose contents the file deliberately withholds from review.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1027,T1140,T1059.007

composite_rules:
  - id: aes-decrypt-eval-loader
    desc: AES cipher-derived content feeds eval execution
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc-dash
      - id: micro-behaviors/process/interpreter/eval/decrypted::node-decryption-derived-eval-argument
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
