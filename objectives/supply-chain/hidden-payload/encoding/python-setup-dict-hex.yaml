defaults:
  platforms: [unix, windows]
  for: [python, python-sdist]
  attack: T1195.002,T1027

composite_rules:
  - id: setup-py-dict-hex-split-argv-gated-exec
    desc: setup.py extracts hex tokens from dict values for gated subprocess
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/string/split::python-dict-underscore-split-tail
      - id: micro-behaviors/metaprogramming/generation/build::setup-py-hex-argv-gated-subprocess
      - id: metadata/build/pip::root-setup-py-path
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/process/argument/subcommand::python-sys-argv-membership-test
