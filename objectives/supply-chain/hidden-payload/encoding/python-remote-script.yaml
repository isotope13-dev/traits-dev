# Remote encrypted Python source is fetched and compiled into a live module.
# This is an executable hidden payload even when the package's visible CLI is
# presented as a social-media automation tool.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1027,T1059.006,T1105

traits:
  - id: python-encrypted-script-endpoint
    desc: Python references remote script endpoint
    crit: notable
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: '/(api/)?v[0-9]+/scripts?/(platform|plugin|extension)(/|\b)'

  - id: plaintext-accept-header-request
    desc: Requests text/plain payload via urllib
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'Request\([^)\r\n]{1,60}["'']Accept["'']\s*:\s*["'']text/plain["'']'

composite_rules:
  - id: trojanized-json-client-remote-code-exec
    desc: Exported JSON API client hides a text/plain remote code execution route
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1059.006,T1105
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/header/accept::python-json-accept-header-text
      - id: plaintext-accept-header-request
      - id: metadata/lang/source/syntax/assignment/name::exported-all-api-surface
      - id: micro-behaviors/process/deploy/script-eval/network::urllib-response-source-exec
  - id: python-remote-encrypted-source-execution
    desc: Python package decrypts fetched source and compiles it in memory
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: python-encrypted-script-endpoint
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/crypto/symmetric/aes/mode::pycrypto-aes-cbc-mode
      - id: micro-behaviors/metaprogramming/generation/compile::compile-exec-mode
      - id: micro-behaviors/os/api-resolution/dynamic::python-types-moduletype-create
    any:
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-helper-call
