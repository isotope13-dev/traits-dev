defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1027,T1059.007,T1552.001
traits:
- id: node-detect-cache-stealer-prefix
  desc: Contains shifted stealer payload prefix
  crit: notable
  if:
    type: text
    substr: SOb9juV8i_A}SKt?luN
- id: node-detect-cache-shift-decode
  desc: Removes character offset from encoded data
  crit: notable
  if:
    type: text
    substr: String.fromCharCode(c.charCodeAt(0) - s)
- id: node-detect-cache-compile-payload
  desc: Compiles unpacked module source
  crit: suspicious
  if:
    type: text
    substr: _m._compile(_src
composite_rules:
- id: node-detect-cache-shifted-stealer
  desc: Unpacks and compiles hidden credential stealer
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/supply-chain/hidden-payload/encoding::node-detect-cache-stealer-prefix
  - id: objectives/supply-chain/hidden-payload/encoding::node-detect-cache-shift-decode
  - id: objectives/supply-chain/hidden-payload/encoding::node-detect-cache-compile-payload
