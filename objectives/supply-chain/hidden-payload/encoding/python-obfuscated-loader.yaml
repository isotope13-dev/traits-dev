# A package-level interpretation of an opaque Python source loader.  The
# implementation-level chain is defined in the anti-static tier; this rule
# adds the distribution context without duplicating its atomic matchers.
defaults:
  platforms: [unix, windows]
  for: [whl]
  attack: T1195.002

composite_rules:
  - id: pypi-obfuscated-python-module-loader
    for: [whl, python]
    desc: PyPI wheel hides executable Python source
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1027
    scope: archive
    all:
      - id: metadata/build/archive::wheel-contains-python-source
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::base85-zlib-module-loader
    unless:
      - id: well-known/app/system/clokai::clokai-opaque-engine-context
      - id: well-known/app/system/clokai::clokai-model-runtime-context

  - id: pypi-multilayer-python-carrier
    for: [whl, python]
    desc: PyPI wheel embeds a large XOR-obfuscated Python execution carrier
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1140,T1059.006
    scope: archive
    all:
      - id: metadata/build/archive::wheel-contains-python-source
      - id: objectives/anti-static/obfuscation/control-flow/logic::b64decode-exec
      - id: objectives/anti-static/obfuscation/multi-layer::python-large-base64-carrier
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/

  - id: pypi-large-encoded-python-exec-carrier
    for: [whl, python]
    desc: PyPI wheel ships a large encoded Python exec carrier
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1140,T1059.006
    mbc: B0032
    scope: archive
    all:
      - id: metadata/build/archive::wheel-contains-python-source
      - id: objectives/anti-static/obfuscation/multi-layer::python-large-base64-decode-exec
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/

  # The carrier rules above key on payload scale (a string over 10KB/100KB),
  # which a payload split across many small modules never reaches. The
  # delivery property that survives any split is that the exec is the
  # module's import entry: a wheel member whose whole visible body executes
  # compressed concealed code the moment the module is imported -- including
  # via the console entry point -- ships no reviewable behavior at all.
  # Import-time exec in a distribution is not a publishing idiom (versioneer
  # and setuptools shims exec decoded *text*, and are excluded inside the
  # referenced atoms), so the wheel context upgrades the module-level stub.
  - id: pypi-import-time-packed-module-wheel
    for: [whl, python]
    desc: PyPI wheel module import executes packed concealed code
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1027,T1140,T1059.006
    mbc: B0032
    scope: archive
    all:
      - id: metadata/build/archive::wheel-contains-python-source
      - id: objectives/anti-static/obfuscation/payload/code-in-data::import-time-compressed-code-stub
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/

  # Wheel metadata adds distribution context, but no hostile behavior to a
  # zlib/Base64 source packer. Keep the canonical source-loader finding.
