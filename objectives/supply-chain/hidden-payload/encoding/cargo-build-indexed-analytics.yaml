defaults:
  platforms: [unix, windows]
  for: [crate, cargo-toml, rust]
  attack: T1195.002,T1027

composite_rules:
  - id: cargo-crate-indexed-string-analytics-beacon
    desc: Crate hides strings in build.rs and exports ASN analytics
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/build::cargo-build-script-declared
      - id: objectives/anti-static/obfuscation/string/index-select::indexed-string-network-analytics
      - id: micro-behaviors/communications/http/services/analytics::rust-asn-event-property
