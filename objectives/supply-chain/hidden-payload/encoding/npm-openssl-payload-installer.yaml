# An npm package carries a passphrase-encrypted payload, decrypts it with
# code in one module, and runs a child process from another. The payload stays
# opaque to registry review: the install path is what makes it executable.
# Encryption alone is not hostile; the composite needs the decrypt, the
# spawn, and the zstd-tar payload member in the same package.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, javascript]
  attack: T1195.002,T1027.013,T1140

composite_rules:
  - id: npm-openssl-payload-decrypt-spawn-installer
    desc: npm package decrypts shipped OpenSSL payload and spawns installer
    crit: hostile
    conf: 0.95
    scope: package
    all:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::openssl-salted-aes-pbkdf2-decrypt
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: metadata/archive/member/extension::npm-zstd-tar-payload-member
