defaults:
  platforms: [unix, windows]
traits:
  - id: dual-jsc-payloads
    desc: Package publishes multiple jsc payloads
    crit: suspicious
    conf: 0.93
    for: [package.json]
    if:
      type: text
      regex: '"files"\s*:\s*\[[^]]*\.jsc[^]]*\.jsc'
  - id: dual-js-loaders
    desc: Package ships multiple tiny js loaders
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: text
      regex: '"files"\s*:\s*\[[^]]*\.jsc[^]]*\.js"[^]]*\.js"'
    not:
      - substr: '"inherits.js"'
  - id: require-local-jsc
    desc: Requires local .jsc payload
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: require\(['"]\./[^'"\n]{1,80}\.jsc['"]\)
  - id: opaque-bytecode-compile-marker
    desc: Opaque Node module._compile call
    crit: suspicious
    conf: 0.92
    for: [data]
    if:
      type: text
      regex: '(?i)\bmodule\s*\.\s*_compile\s*\('
    unless:
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/file/format/structured::sourcemap-context
composite_rules:
  - id: jsc-runtime-loader
    desc: bytenode loader for local bytecode
    crit: suspicious
    conf: 0.96
    for: [javascript]
    all:
      - id: metadata/import/package::require-bytenode
      - id: require-local-jsc
      - id: metadata/file/line::tiny-javascript-file-lines
      - id: metadata/file/size::tiny-javascript-file-size
  - id: try-catch-bytecode-loader
    desc: Package probes local bytecode through bytenode
    # Cross-runtime packages may probe an optional Electron/bytenode path and
    # catch the expected browser-side require failure. Without install-time or
    # shipped-bytecode evidence this is opaque and unusual, but not malicious.
    crit: suspicious
    conf: 0.94
    for: [javascript]
    all:
      - id: metadata/import/package::require-bytenode
      - id: require-local-jsc
      - id: micro-behaviors/os/module/require::cjs-require-in-try
  - id: opaque-bytecode-decoder-compiler
    desc: Opaque payload decodes and compiles code
    crit: hostile
    conf: 0.98
    for: [data]
    all:
      - id: micro-behaviors/data/decode/base64::embedded-atob-call-text
      - id: opaque-bytecode-compile-marker
  - id: package-ships-bytenode-bytecode
    desc: npm package ships bytenode bytecode
    crit: suspicious
    conf: 0.97
    for: [package.json]
    all:
      - id: metadata/package/dependencies/manifest/identity::bytenode-runtime
      - id: metadata/package/files/included::files-publish-jsc
    any:
      - id: metadata/package/entrypoint::bin-js-entry
      - id: metadata/package/entrypoint::main-js-file-entry
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: postinstall-bytenode-bytecode
    desc: Postinstall package launches bytecode payload
    crit: hostile
    conf: 0.98
    for: [package.json]
    all:
      - id: metadata/package/dependencies/manifest/identity::bytenode-runtime
      - id: metadata/package/files/included::files-publish-jsc
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: metadata/package/entrypoint::bin-js-entry
  - id: dual-loader-bytecode-package
    desc: Dual-loader bytenode bytecode package
    crit: hostile
    conf: 0.99
    for: [package.json]
    all:
      - id: metadata/package/dependencies/manifest/identity::bytenode-runtime
      - id: dual-jsc-payloads
      - id: dual-js-loaders
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
    any:
      - id: metadata/package/entrypoint::bin-js-entry
      - id: metadata/package/entrypoint::main-js-file-entry
  - id: asar-bytenode-jsc-loader
    desc: Script loads bytenode bytecode from an asar
    crit: hostile
    conf: 0.96
    for: [markdown]
    all:
      - id: metadata/lang/runtime::bytenode-runtime-reference
      - id: micro-behaviors/fs/path/extension::jsc-bytecode-file-reference
      - id: metadata/lang/encoded/unicode-escape::app-asar-path
    unless:
      - id: well-known/tool/detection/
      - id: well-known/lib/runtime/scripted/node-runtime::bundled-npm-source
