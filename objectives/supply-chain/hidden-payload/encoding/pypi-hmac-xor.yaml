# PyPI wheels whose published .py modules are HMAC/PBKDF2/XOR packed stubs
# that decrypt and exec real source at import time. File-level packing atoms
# live under anti-static/obfuscation/payload/encrypted; this rule elevates the
# package-delivery context.
defaults:
  platforms: [unix, windows]
  for: [archives, python, whl]
  attack: T1195.002,T1027.002
  mbc: B0032

composite_rules:
  - id: pypi-hmac-xor-packed-modules
    desc: PyPI package ships HMAC-XOR packed import stubs
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::python-hmac-xor-module-packer
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/runtime/
