defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1059.007,T1027,T1552.001
traits:
- id: node-sandworm-catalog-payload-prefix
  desc: Contains compressed Sandworm catalog prefix
  crit: notable
  if:
    type: text
    substr: eNpMmzUS7YgBBHOfYsvRuhSIKXAg1hMzJS4xM8uXd/3M6Rxggp6ev6tzyo92nv7+13+vdPvrP8u/
- id: node-sandworm-catalog-options
  desc: Assembles numbered encoded catalog chunks
  crit: notable
  if:
    type: text
    substr: k.indexOf('_opt_') === 0
- id: node-sandworm-catalog-inflate
  desc: Inflates encoded catalog as JavaScript
  crit: notable
  if:
    type: text
    substr: inflateSync(Buffer.from(raw, 'base64')).toString('utf-8')
- id: node-sandworm-temp-require
  desc: Executes and removes temporary decoded script
  crit: suspicious
  if:
    type: text
    substr: require(_f); } finally { try { _fs.unlinkSync(_f)
composite_rules:
- id: node-sandworm-compressed-catalog-loader
  desc: Unpacks and runs staged credential-stealer payload
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/supply-chain/hidden-payload/encoding::node-sandworm-catalog-payload-prefix
  - id: objectives/supply-chain/hidden-payload/encoding::node-sandworm-catalog-options
  - id: objectives/supply-chain/hidden-payload/encoding::node-sandworm-catalog-inflate
  - id: objectives/supply-chain/hidden-payload/encoding::node-sandworm-temp-require
