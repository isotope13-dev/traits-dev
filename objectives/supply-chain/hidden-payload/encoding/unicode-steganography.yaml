defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  attack: T1195.002
traits:
  - id: indirect-eval-buffer-arg
    desc: Indirect eval with Buffer argument
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: \(0\s*,\s*eval\)\s*\(\s*Buffer\s*\.
  - id: settimeout-decoded
    desc: setTimeout with Buffer.from decoded code
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: setTimeout\(\s*Buffer\.from\(
  - id: settimeout-atob
    desc: setTimeout with atob decoded code
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: setTimeout\(\s*atob\s*\(
composite_rules:
  - id: eval-unicode-stego-payload
    desc: eval() of Unicode steganography decoded payload
    crit: hostile
    conf: 0.95
    attack: T1027
    mbc: B0032
    for:
      - javascript
      - typescript
      - text
    all:
      - id: micro-behaviors/process/interpreter/eval/decoded::decoded-buffer-eval-call-or-command
      - id: micro-behaviors/data/decode/invisible-unicode::javascript-variation-selector-byte-decoder
    any:
      - id: micro-behaviors/data/string/unicode::javascript-variation-selector-range
      - id: micro-behaviors/data/string/unicode::javascript-supplementary-selector-range
      - id: metadata/lang/encoding/shape/character::multiple
  - id: long-line-eval-injection
    desc: Eval injection via appended long line
    crit: hostile
    conf: 0.94
    attack: T1027,T1059.007
    scope: leaf
    all:
      - id: metadata/file/line::last-line-over-1000
      - id: metadata/file/line::file-has-30-plus-lines
      - id: metadata/file/line::single-long-line-outlier
      - id: micro-behaviors/process/interpreter/eval/decoded::js-eval-final-line-base64
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-buffer-from-argument
      - id: objectives/anti-static/obfuscation/eval/dynamic::eval-atob
    unless:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-parenthesized-expression
      - id: metadata/file/line::js-large-at-most-two-lines
      - id: metadata/build/bundler/runtime::ncc-runtime-loader-identifier
      - id: metadata/build/bundler/asset::js-known-bundler-output
  - id: function-ctor-decoded-obfuscated
    desc: Function constructor with decoded payload in obfuscated code
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/metaprogramming/generation/function::function-from-decoder-or-buffer
      - id: metadata/build/minifier::minified-text-shape
  - id: indirect-eval-decoded
    desc: Indirect eval of decoded buffer
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-text
    any:
      - id: objectives/supply-chain/hidden-payload/encoding::indirect-eval-buffer-arg
      - id: micro-behaviors/data/encoding/base64::base64-tool
  - id: timer-decoded-exec
    desc: setTimeout/setInterval with decoded payload
    crit: suspicious
    conf: 0.9
    any:
      - id: settimeout-decoded
      - id: settimeout-atob
  - id: unicode-decoder-function
    desc: Unicode code point decoder function
    crit: notable
    conf: 0.85
    size_max: 200000
    all:
      - id: micro-behaviors/data/string/access::js-codepoint-at
      - id: micro-behaviors/data/string/unicode::javascript-supplementary-selector-range
    any:
      - id: micro-behaviors/data/encode/charcode::charcode-at
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
    near_bytes: 1024
