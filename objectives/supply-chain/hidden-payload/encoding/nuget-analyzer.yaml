# An analyzer build hook carrying concealed downloads and file-copy machinery
# is a probable hidden stage. Do not claim the copied executable was launched,
# or name a DLL target the facts extractor has not decrypted.
defaults:
  for: [nupkg, xml, pe, dll]
  platforms: [windows]
composite_rules:
  - id: nuget-analyzer-encoded-staging-clues
    desc: Analyzer build hook combines decoding, downloads and file copying
    crit: suspicious
    conf: 0.96
    attack: T1195.002
    scope: archive
    all:
      - id: metadata/package/description/function::nuget-build-analyzer-claim
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-command
      - id: objectives/execution/staging/http::managed-decoder-http-byte-write-clues
      - id: micro-behaviors/fs/file/copy/call::dotnet-file-copy-import
      - id: micro-behaviors/mem/fill::dotnet-crypto-zero-memory-import
