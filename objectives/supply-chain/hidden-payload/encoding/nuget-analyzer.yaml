# A NuGet build hook that runs a bundled DLL carrying concealed downloads and
# file-copy machinery is a hidden build-time stage. Do not claim the copied
# executable was launched, or name a DLL target the facts extractor has not
# decrypted. The analyzer description is one lure; a targets file that runs
# its own lib DLL through dotnet serves the same role without it.
defaults:
  for: [nupkg, xml, pe, dll]
  platforms: [windows]
composite_rules:
  - id: nuget-analyzer-encoded-staging-clues
    desc: NuGet build hook runs DLL that decrypts strings, downloads and copies files
    crit: hostile
    conf: 0.94
    attack: T1195.002,T1027,T1105
    scope: archive
    all:
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-command
      - id: objectives/execution/staging/http::managed-decoder-http-byte-write-clues
      - id: micro-behaviors/fs/file/copy/call::dotnet-file-copy-import
      - id: micro-behaviors/mem/fill::dotnet-crypto-zero-memory-import
    any:
      - id: metadata/package/description/function::nuget-build-analyzer-claim
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-dotnet-package-assembly
