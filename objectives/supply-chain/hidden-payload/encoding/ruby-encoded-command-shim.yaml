defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1059.004,T1027,T1195.002
traits:
  - id: ruby-temp-write
    desc: Ruby opens a temporary file for writing
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'File\.open\(["\x27]/tmp/[^"\x27]{1,120}["\x27],\s*["\x27]w["\x27]\)'
  - id: ruby-decode64-literal
    desc: Ruby decodes a long Base64 literal
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'Base64\.decode64\(["\x27][A-Za-z0-9+/=]{200,}["\x27]\)'
  - id: ruby-nohup-temp-shell
    desc: Ruby detaches a temporary shell script
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'Open3\.capture3\(["\x27]nohup\s+(ba)?sh\s+/tmp/'
  - id: encoded-shell-download-and-kill
    desc: Encoded shell kills tasks and downloads files
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '(?s)ps aux[\s\S]{0,120}kill -9[\s\S]{0,600}curl[\s\S]{0,200}wget'
  - id: ruby-ls-argument-forwarding
    desc: Ruby forwards arguments to system ls
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?s)["\x27]/bin/ls["\x27][\s\S]{0,200}Shellwords\.escape\(ARGV\[i\]\)[\s\S]{0,100}system\('
composite_rules:
  - id: ruby-ls-shim-encoded-shell-dropper
    desc: ls shim drops encoded shell payload
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-temp-write
      - id: ruby-decode64-literal
      - id: ruby-nohup-temp-shell
      - id: encoded-shell-download-and-kill
      - id: ruby-ls-argument-forwarding
