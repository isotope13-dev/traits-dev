# A published npm package whose manifest is an empty `npm init` skeleton, yet
# whose shipped code is an encoded blob, is a hollow carrier: the manifest
# advertises nothing and the entry file is unreadable.
#
# Both rules pool their evidence with `scope: archive`, which is sound for a
# published tarball -- one manifest, one entry file, one package -- and wrong
# for anything else. Applied to a repository archive they were assembling a
# verdict out of unrelated corners of a source tree: an `npm init` skeleton
# left in a `scripts/` build helper, a generated single-line asset registry
# from a demos directory, and a Base64 string in a third file (an HTTP Basic
# auth example in component documentation, say) are each ordinary on their own
# and share nothing but a tarball. Requiring the manifest to sit at the npm
# publish root (`package/package.json`, which only `npm pack` produces) keeps
# these rules on the artifact shape they describe; GitHub source archives and
# monorepo checkouts no longer qualify.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002

composite_rules:
  # scope:archive pools the publish-root manifest with ANY nested hollow
  # stub and ANY base64 decode in node_modules. A real published tool (npx
  # ships a bin entry and a repository) is not a hollow carrier just because
  # a nested dependency looks empty — suppress when the root advertises a
  # real package shape.
  - id: hollow-npm-package-with-encoded-payload
    desc: Hollow npm package carries an encoded payload
    crit: suspicious
    conf: 0.94
    scope: archive
    unless:
      - id: metadata/package/entrypoint::has-bin-field
      - id: metadata/package/repository/
      # "Hollow" is judged from the manifest -- a skeleton that names an index
      # it does not ship -- but the payload legs are archive-scoped, so a
      # package that carries a real source tree could satisfy both halves from
      # unrelated files. An accidental publish of an internal app (an `npm init
      # -y` manifest wrapped around 162 Vue/TS files) scored hostile that way:
      # the base64 call was its docx/xlsx image export and the one-liner was a
      # re-export stub. Shipping a source tree falsifies hollowness outright.
      #
      # This narrows the FP without fixing the underlying looseness: nothing
      # binds the one-liner and the decode call to the declared entry file, or
      # to each other. Tying those two legs to one file would express
      # "one-line encoded entry" properly.
      - id: metadata/package/files/nested::archive-nested-source-tree
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/supply-chain/impersonation/manifest/placeholder::mature-hollow-index-package
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
  - id: hollow-npm-package-with-one-line-encoded-entry
    desc: Hollow npm package hides encoded one-line entry content
    crit: hostile
    conf: 0.97
    scope: archive
    unless:
      - id: metadata/package/entrypoint::has-bin-field
      - id: metadata/package/repository/
      # "Hollow" is judged from the manifest -- a skeleton that names an index
      # it does not ship -- but the payload legs are archive-scoped, so a
      # package that carries a real source tree could satisfy both halves from
      # unrelated files. An accidental publish of an internal app (an `npm init
      # -y` manifest wrapped around 162 Vue/TS files) scored hostile that way:
      # the base64 call was its docx/xlsx image export and the one-liner was a
      # re-export stub. Shipping a source tree falsifies hollowness outright.
      #
      # This narrows the FP without fixing the underlying looseness: nothing
      # binds the one-liner and the decode call to the declared entry file, or
      # to each other. Tying those two legs to one file would express
      # "one-line encoded entry" properly.
      - id: metadata/package/files/nested::archive-nested-source-tree
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/supply-chain/impersonation/manifest/placeholder::mature-hollow-index-package
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: metadata/file/line::file-one-liner
