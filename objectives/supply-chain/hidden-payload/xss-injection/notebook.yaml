# Stored XSS delivered through Jupyter notebook markdown cells. notebookjs and
# similar renderers can execute markup in markdown sources before any host
# sanitizer sees the HTML. Match notebook structure + img onerror payload.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, json, text]
  attack: T1059.007
  mbc: E1090

traits:
  - id: jupyter-nbformat-field
    desc: Jupyter notebook nbformat field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']nbformat["'']\s*:'

  - id: jupyter-markdown-cell-type
    desc: Jupyter markdown cell_type field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']cell_type["'']\s*:\s*["'']markdown["'']'

  - id: img-onerror-html-payload
    desc: Image onerror HTML event handler
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)<img.{0,50}onerror\s*='

composite_rules:
  - id: jupyter-markdown-img-onerror
    desc: Jupyter markdown cell with img onerror
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: jupyter-markdown-cell-type
      - id: img-onerror-html-payload

  - id: jupyter-notebook-markdown-xss
    desc: Jupyter notebook markdown XSS payload
    crit: hostile
    conf: 0.98
    near_bytes: 2000
    all:
      - id: jupyter-nbformat-field
      - id: jupyter-markdown-img-onerror
