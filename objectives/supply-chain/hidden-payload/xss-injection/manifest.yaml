defaults:
  platforms:
    - unix
    - windows
  for:
    - package.json
  attack: T1195.002
  mbc: "E1090"

traits:
  - id: malicious-displayname-xss-urlencoded
    desc: "URL-encoded XSS marker in displayName"
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "displayName"
      regex: '%3[cC](script|img|svg)|%3[cC].{0,48}%3[eE]'

  # A bare `<script` token in a description is not an injection: escaping,
  # templating and sanitizer libraries all name the tag in their own summary --
  # htmlescape's is "escape JSON for usage as an object literal inside of a
  # `<script>` tag", which read as an XSS-injected manifest. An injection has a
  # payload, so require one: either the tag pulls an external script, or its
  # body contains a call/assignment.
  - id: malicious-description-script-src
    desc: Description script tag loads external source
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "description"
      regex: '<\s*script[^>]{0,60}\ssrc\s*='
      case_insensitive: true

  - id: malicious-description-script-payload
    desc: Description script tag carries a payload
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "description"
      regex: '<\s*script[^>]{0,60}>[^<]{0,120}[(=]'
      case_insensitive: true

  - id: malicious-repo-javascript-protocol
    desc: "Javascript protocol in repository field"
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "repository"
      substr: "javascript:"

  - id: malicious-quoted-eval-urlencoded
    desc: "Eval with URL-encoded payload in displayName"
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: "displayName"
      regex: 'eval\(this\.responseText\)|addEventListener\(%22load%22'

  - id: malicious-xss-dot-ht
    desc: "Malicious .xss.ht domain"
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "displayName"
      substr: "vrlvaghela.xss.ht"

  - id: malicious-jsonp-callback
    desc: "JSONP callback with alert"
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: description
      regex: 'callback=alert'
      case_insensitive: true

composite_rules:
  - id: xss-manifest-injection
    desc: "XSS injection in npm package metadata"
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/package/files/included::package-json-basename
    any:
      - id: malicious-displayname-xss-urlencoded
      - id: malicious-description-script-src
      - id: malicious-description-script-payload
      - id: malicious-quoted-eval-urlencoded
      - id: malicious-xss-dot-ht
      - id: malicious-jsonp-callback

  - id: xss-readme-injection
    desc: "XSS via javascript: protocol in README"
    crit: hostile
    conf: 0.9
    for: [javascript]
    all:
      - id: metadata/package/documentation/package-metadata::references-readme
      - id: micro-behaviors/process/interpreter/webview::javascript-uri-webview

  - id: vscode-manifest-xss
    desc: "VSCode extension with XSS in manifest"
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
    any:
      - id: malicious-displayname-xss-urlencoded
      - id: malicious-description-script-src
      - id: malicious-description-script-payload
      - id: malicious-jsonp-callback
      - id: malicious-xss-dot-ht
