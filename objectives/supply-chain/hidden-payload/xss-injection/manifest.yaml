defaults:
  platforms:
    - unix
    - windows
  for:
    - package.json
  attack: T1195.002
  mbc: "E1090"

traits:
  - id: malicious-displayname-xss-urlencoded
    desc: "URL-encoded XSS marker in displayName"
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "displayName"
      regex: '%3[cC](script|img|svg)|%3[cC].{0,48}%3[eE]'

  # A bare `<script` token in a description is not an injection: escaping,
  # templating and sanitizer libraries all name the tag in their own summary --
  # htmlescape's is "escape JSON for usage as an object literal inside of a
  # `<script>` tag", which read as an XSS-injected manifest. An injection has a
  # payload, so require one: either the tag pulls an external script, or its
  # body contains a call/assignment.
  # The same injection in the display *name*, and with an event handler rather
  # than a script tag: `"name": "<img src=x onerror=alert(1)>"` in a
  # WebExtension manifest. The sibling rules below look at npm's description
  # and displayName for `<script`, which misses both halves of this. What
  # renders an extension's name -- a store listing, an admin dashboard, an
  # inventory report -- is the target, so the payload never has to run on the
  # machine that installed it.
  #
  # Two atoms rather than one pattern: a tag and a handler in the same field.
  # Matching them together in one regex needs a bounded gap between them, and
  # `cleave regex-cost` calls every spelling of that explode.
  - id: manifest-name-html-tag
    desc: Manifest name contains an HTML tag
    crit: notable
    conf: 0.9
    for: [json, chrome-manifest, package.json]
    if:
      type: value
      path: "name"
      regex: '<\s*(img|svg|script|iframe|body|a)\b'
      case_insensitive: true

  - id: manifest-name-event-handler
    desc: Manifest name contains an event handler
    crit: notable
    conf: 0.9
    for: [json, chrome-manifest, package.json]
    if:
      type: value
      path: "name"
      regex: 'on(error|load|click|mouseover|focus)\s*=\s*\w'
      case_insensitive: true

  - id: malicious-description-script-src
    desc: Description script tag loads external source
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "description"
      regex: '<\s*script[^>]{0,60}\ssrc\s*='
      case_insensitive: true

  - id: malicious-description-script-payload
    desc: Description script tag carries a payload
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "description"
      regex: '<\s*script[^>]{0,60}>[^<]{0,120}[(=]'
      case_insensitive: true

  # Registry sites, package explorers and IDE panes render a manifest's URL
  # fields as clickable links, so a scheme that executes instead of navigating
  # turns the manifest itself into stored XSS against everyone who views the
  # package. No field of a published manifest has a legitimate reason to carry
  # one.
  #
  # Deliberately not keyed to a field list. The previous rule here checked only
  # `repository`, and the payload simply moved to `homepage`, `bugs.url` and
  # `funding.url` -- fields nothing was watching. Anchoring on the opening quote
  # of any JSON string value covers every field that exists now plus the ones a
  # future manifest adds, and the interior `\s` slack matches the `java\tscript:`
  # and mixed-case (`JaVaScRiPt:`) spellings browsers still honour.
  - id: manifest-value-script-uri-scheme
    desc: Manifest URL field uses a script URI
    crit: suspicious
    conf: 0.95
    # Also covers a javascript:/vbscript: URI quoted inside README markup
    # (an <a href="..."> or similar), which is what xss-readme-injection
    # below needs from a README.md sibling of package.json.
    for: [package.json, markdown]
    if:
      type: text
      regex: '"\s{0,4}(java|vb)\s{0,4}script\s{0,4}:'
      case_insensitive: true

  # Same delivery, different scheme: a data: URI whose media type renders markup
  # executes script in the viewer just as well, and base64 hides the payload
  # from anyone reading the manifest. SVG is included because it carries
  # <script> -- an image media type is not a safe one here.
  - id: manifest-value-html-data-uri
    desc: Manifest URL field embeds an HTML payload
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '"\s{0,4}data\s{0,4}:\s{0,4}(text/html|image/svg|application/xhtml)'
      case_insensitive: true

  - id: malicious-quoted-eval-urlencoded
    desc: "Eval with URL-encoded payload in displayName"
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: "displayName"
      regex: 'eval\(this\.responseText\)|addEventListener\(%22load%22'

  # XSS Hunter and its clones host the callback that proves an injection fired.
  # The old rule pinned one researcher's subdomain in one field; the service
  # domain is what generalizes, and it is worth seeing wherever it appears in a
  # manifest rather than only in displayName.
  - id: xss-callback-service-host
    desc: XSS callback service hostname
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\.xss\.(ht|report)\b'
      case_insensitive: true

  - id: malicious-jsonp-callback
    desc: "JSONP callback with alert"
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: description
      regex: 'callback=alert'
      case_insensitive: true

composite_rules:
  # A tag and an event handler in the same display name. Neither is an
  # injection on its own -- a package really can be called "a" or mention
  # "onload" -- but a name that is both is a payload waiting for whatever
  # renders it.
  - id: manifest-name-html-event-handler
    desc: Manifest name carries an HTML event handler
    crit: suspicious
    conf: 0.95
    for: [json, chrome-manifest, package.json]
    all:
      - id: manifest-name-html-tag
      - id: manifest-name-event-handler

  - id: xss-manifest-injection
    desc: "XSS injection in npm package metadata"
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/package/files/included::package-json-basename
    any:
      - id: malicious-displayname-xss-urlencoded
      - id: malicious-description-script-src
      - id: malicious-description-script-payload
      - id: malicious-quoted-eval-urlencoded
      - id: xss-callback-service-host
      - id: malicious-jsonp-callback
      - id: manifest-value-script-uri-scheme
      - id: manifest-value-html-data-uri

  # Two independently weaponized manifest fields. A single odd URL could be a
  # copy-paste accident or a joke left in a scratch package; a manifest that
  # carries both an executing scheme *and* an encoded markup payload was
  # authored to fire whichever one the consumer renders. Scored above the
  # single-field composite because the redundancy is the intent.
  - id: manifest-multi-vector-xss-payload
    desc: Manifest carries two XSS delivery vectors
    crit: hostile
    conf: 0.97
    all:
      - id: manifest-value-script-uri-scheme
      - id: manifest-value-html-data-uri

  # javascript-uri-webview is an Android WebView atom (for: [android_apk,
  # binaries]) -- unrelated to an npm README, and package.json's
  # references-readme (for: [package.json]) lives in a different archive
  # member than the README text itself. Pool both across the package: the
  # manifest declares/points at the README, and the script-URI scheme is
  # what actually lives inside README.md.
  - id: xss-readme-injection
    desc: "XSS via javascript: protocol in README"
    crit: hostile
    conf: 0.9
    for: [package.json, markdown, npm]
    scope: archive
    all:
      - id: metadata/package/documentation/package-metadata::references-readme
      - id: manifest-value-script-uri-scheme

  - id: vscode-manifest-xss
    desc: "VSCode extension with XSS in manifest"
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/runtime::vscode-extension
    any:
      - id: malicious-displayname-xss-urlencoded
      - id: malicious-description-script-src
      - id: malicious-description-script-payload
      - id: malicious-jsonp-callback
      - id: xss-callback-service-host
