# HTML event-handler payloads in an agent skill are executable when rendered by
# a catalog, preview, or documentation UI.  The combination of an active
# handler and a remote fetch is the hostile proof-of-concept; ordinary HTML
# examples remain covered by the neutral DOM capability.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1189,T1059.007

composite_rules:
  # Skills are rendered by catalogs and preview panes. Multiple distinct
  # inline handlers in the skill body provide an executable HTML injection
  # payload even when it does not steal cookies.
  - id: agent-skill-multiple-rendered-html-handlers
    desc: Agent skill embeds multiple active HTML handlers
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/ui/controls/image::img-onerror-handler
      - id: micro-behaviors/ui/window/event::html-svg-onload-handler

  - id: agent-skill-rendered-xss-payload
    desc: Agent skill carries rendered XSS payload
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: objectives/exfiltration/stealer/application-state/cookie/browser-api::html-error-handler-cookie-send
