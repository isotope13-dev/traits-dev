# HTML event-handler payloads in an agent skill are executable when rendered by
# a catalog, preview, or documentation UI.  The combination of an active
# handler and a remote fetch is the hostile proof-of-concept; ordinary HTML
# examples remain covered by the neutral DOM capability.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1189,T1059.007

traits:
  - id: html-event-handler-remote-fetch
    desc: HTML event handler fetches remote content
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)onerror[^\n]{0,200}fetch\s*\(\s*[''"`]https?://'

composite_rules:
  - id: agent-skill-rendered-xss-payload
    desc: Agent skill carries rendered XSS payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: micro-behaviors/ui/window/manage/html::html-active-handler-marker
      - id: html-event-handler-remote-fetch
