# HTML event-handler payloads embedded in an agent skill are executable when
# rendered by a catalog, preview, or documentation UI.  The combination of
# multiple handlers and a remote fetch is a hostile proof-of-concept.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1189,T1059.007

traits:
  - id: agent-skill-html-event-payload
    desc: Agent skill embeds HTML event-handler payload
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)<(img|svg)[^>]{0,160}(onerror|onload)\s*='

  - id: agent-skill-xss-remote-fetch
    desc: Skill XSS payload fetches remote content
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)onerror[^\n]{0,200}fetch\s*\(\s*[''"`]https?://'

composite_rules:
  - id: agent-skill-rendered-xss-payload
    desc: Agent skill carries rendered XSS payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-html-event-payload
      - id: agent-skill-xss-remote-fetch
