# HTML event-handler payloads in an agent skill are executable when rendered by
# a catalog, preview, or documentation UI.  The combination of an active
# handler and a remote fetch is the hostile proof-of-concept; ordinary HTML
# examples remain covered by the neutral DOM capability.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1189,T1059.007

composite_rules:
  - id: agent-skill-rendered-xss-payload
    for: [zip, tar, markdown, text, html]
    desc: Agent skill carries rendered XSS payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/ui/window/html::html-active-handler-marker
      - id: objectives/exfiltration/stealer/browser::html-error-handler-cookie-send
