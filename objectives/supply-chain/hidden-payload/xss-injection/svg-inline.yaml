defaults:
  platforms: [unix, windows]
  for: [markdown]
  attack: T1195.002

traits:
  - id: svg-inline-script-alert-call
    desc: Inline SVG script calls alert or eval
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(^|[\n>])\s*<svg[^>]{0,180}>[\s\S]{0,140}<script[^>]{0,60}>[^<]{0,80}\b(alert|eval)\s*\('
      case_insensitive: true

  - id: markdown-or-html-external-xss-svg-ref
    desc: Markdown or HTML embeds external xss.svg image
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'https?://[^)"''\s]{1,160}/xss\.svg'
      case_insensitive: true

  - id: bundle-gem-unedited-template-placeholder
    desc: Unedited bundle gem template placeholder text
    crit: notable
    conf: 0.95
    for: [markdown, ruby, text]
    if:
      type: text
      substr: UPDATE_WITH_YOUR_GEM_NAME_IMMEDIATELY_AFTER_RELEASE_TO_RUBYGEMS_ORG

composite_rules:
  - id: readme-svg-script-xss-injection
    desc: Documentation embeds scripted SVG and external XSS SVG vectors
    crit: hostile
    conf: 0.98
    all:
      - id: svg-inline-script-alert-call
      - id: markdown-or-html-external-xss-svg-ref
      - id: bundle-gem-unedited-template-placeholder
      - id: micro-behaviors/data/format/html::html-heading-tag
      - id: metadata/lang/source/syntax/markup/markdown::at-least-four-markdown-style-headings
