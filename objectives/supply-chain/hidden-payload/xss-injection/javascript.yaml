defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1059.007
  mbc: E1090
traits:
  - id: shortcut-name-form-value
    desc: Reads shortcut name field value
    crit: component
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: 'link_name\s*=\s*add_name\.val\(\)'
  - id: shortcut-url-form-value
    desc: Reads shortcut URL field value
    crit: component
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: 'link_url\s*=\s*add_url\.val\(\)'
  - id: shortcut-form-values-build-record
    desc: Builds shortcut records from form values
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'shortcut_data\.push\(\{\s*name\s*:\s*link_name\s*,\s*url\s*:\s*link_url'
  - id: shortcuts-record-persist
    desc: Stores shortcut records in localStorage
    crit: component
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'localStorage\.setItem\(\s*["'']shortcuts["'']'

composite_rules:
  # A shortcut editor that saves form values as records, reloads those records
  # from localStorage, and interpolates the values into anchor markup for
  # jQuery append exposes a persistent stored-XSS path. The source matcher
  # binds both values to the saved shortcut object; the sink leg confirms that
  # the records are parsed as HTML rather than rendered as text.
  - id: stored-shortcut-input-html-injection
    desc: Stores shortcut form input and renders it as HTML
    crit: hostile
    conf: 0.94
    attack: T1059.007,T1189
    for: [javascript, typescript]
    near_bytes: 6000
    all:
      - id: shortcut-name-form-value
      - id: shortcut-url-form-value
      - id: shortcut-form-values-build-record
      - id: shortcuts-record-persist
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem-call
      - id: micro-behaviors/ui/window/insert-html::jquery-appended-link-markup

  - id: alert-document-domain-xss-probe
    desc: Browser alert proves XSS via document.domain
    crit: hostile
    conf: 0.96
    attack: T1189,T1059.007
    all:
      - id: micro-behaviors/ui/window/notify::alert-document-domain-probe
      - id: micro-behaviors/ui/window/dom/tree::document-domain-member-read
    unless:
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      - id: well-known/tool/offensive/payload-corpus::scanner-template-payload-context
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide

  - id: vscode-xss-injection
    desc: "XSS injection via VSCode API"
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/notify::show-information-message
    any:
      - id: micro-behaviors/ui/controls/image::img-onerror-handler
      - id: objectives/privilege-escalation/exploit/keywords::img-src-javascript
      - id: objectives/privilege-escalation/exploit/keywords::xss-var-semicolon
    needs: 2
    unless:
      # Probe fixtures declare the payload into a variable literally named
      # xss (scanner idiom); the message API renders plain text, so no
      # injection occurs. Real injections need an HTML sink (webview).
      - id: micro-behaviors/data/embedded/payload/source::js-xss-probe-var-declaration

  - id: vscode-xss-string-injection
    desc: "VSCode extension XSS text marker"
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/ui/window/notify::show-information-message
    any:
      - id: micro-behaviors/data/embedded/payload/source::js-xss-probe-string-fragment
      - id: objectives/privilege-escalation/exploit/keywords::xss-var-semicolon
    unless:
      - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::deque-axe-linter-vsix
