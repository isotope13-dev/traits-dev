defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1059.007
  mbc: E1090
composite_rules:
  - id: alert-document-domain-xss-probe
    desc: Browser alert proves XSS via document.domain
    crit: hostile
    conf: 0.96
    attack: T1189,T1059.007
    all:
      - id: micro-behaviors/ui/window/notify::alert-document-domain-probe
      - id: micro-behaviors/ui/window/dom/tree::document-domain-member-read
    unless:
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
      - id: metadata/lang/source/syntax/call::markup-or-decoded-alert-calls
      - id: well-known/tool/offensive/payload-corpus::scanner-template-payload-context
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide

  - id: vscode-xss-injection
    desc: "XSS injection via VSCode API"
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/notify::show-information-message
    any:
      - id: micro-behaviors/ui/controls/image::img-onerror-handler
      - id: objectives/privilege-escalation/exploit/keywords::img-src-javascript
      - id: objectives/privilege-escalation/exploit/keywords::xss-var-semicolon
    needs: 2
    unless:
      # Probe fixtures declare the payload into a variable literally named
      # xss (scanner idiom); the message API renders plain text, so no
      # injection occurs. Real injections need an HTML sink (webview).
      - id: micro-behaviors/data/embedded/payload/source::js-xss-probe-var-declaration

  - id: vscode-xss-string-injection
    desc: "VSCode extension XSS text marker"
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/ui/window/notify::show-information-message
    any:
      - id: micro-behaviors/data/embedded/payload/source::js-xss-probe-string-fragment
      - id: objectives/privilege-escalation/exploit/keywords::xss-var-semicolon
    unless:
      - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::deque-axe-linter-vsix
