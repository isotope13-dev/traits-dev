defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1189

traits:
  - id: shortcut-http-substring-scheme-check
    desc: Checks HTTP scheme by substring
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'link_url\.includes\(\s*["\x27]http://["\x27]\s*\)\s*==\s*false'
  - id: shortcut-https-substring-scheme-check
    desc: Checks HTTPS scheme by substring
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'link_url\.includes\(\s*["\x27]https://["\x27]\s*\)\s*==\s*false'

composite_rules:
  - id: shortcut-url-substring-scheme-check
    desc: Uses substring checks for URL schemes
    crit: component
    conf: 0.94
    all:
      - id: shortcut-http-substring-scheme-check
      - id: shortcut-https-substring-scheme-check
    near_bytes: 180

  # A user-entered javascript: URL containing a later https:// substring can
  # survive normalization, persist in extension storage, and render as an
  # anchor href. This is a self-XSS path absent a separate attacker-controlled
  # source for the shortcut fields.
  - id: persistent-shortcut-javascript-url-bypass
    desc: User-entered shortcut bypasses scheme check into persistent anchor markup
    crit: suspicious
    conf: 0.94
    all:
      - id: shortcut-url-substring-scheme-check
      - id: micro-behaviors/ui/controls/input::shortcut-url-form-value
      - id: micro-behaviors/data/collection/array::shortcut-form-values-build-record
      - id: micro-behaviors/data/db/web-storage::shortcuts-record-persist
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem-call
      - id: micro-behaviors/ui/window/insert-html::interpolated-shortcut-link-markup
      - id: metadata/lang/source/syntax/call/invocation::js-append-method-call
    near_bytes: 6000
