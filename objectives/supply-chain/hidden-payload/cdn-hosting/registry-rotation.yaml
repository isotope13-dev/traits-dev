# Registry-side view of the hash-interface payload host: the registry record
# shows the opaque ENC asset being replaced on a schedule and pulled at
# scale. A genuine library whose only content is a hash facade over an
# unusable ciphertext has no reason to cut several releases a day for
# months while tens of thousands of clients download each one; an operator
# rotating an encrypted second stage behind a stable registry URL does.
# The artifact legs establish the payload shape; the registry legs are the
# distribution cadence, which the artifact-only rule cannot see. Fires only
# when the registry record is analyzed with the artifact (`scope: outer`).
#
# Worked example: @chikawa222224/testchikawa222224, 1,096 releases in 83
# days (six in the last 24 hours), each a fresh ~40 MB YUIENC01 container,
# with 56k recent downloads.
defaults:
  platforms: [unix, windows]
  attack: T1608.001,T1027.013,T1102

composite_rules:
  - id: rotating-cipher-asset-registry-feed
    desc: Opaque cipher asset republished in bursts and pulled at scale
    crit: hostile
    conf: 0.95
    scope: outer
    for: [npm, tar, package.json, javascript, data, registry]
    all:
      - id: platform-hash-interface-opaque-container
      - id: metadata/file/data-blob::near-maximum-entropy-file
      - id: metadata/registry::publish-burst-24h
      - id: metadata/registry::many-releases
      - id: metadata/registry::widely-installed
