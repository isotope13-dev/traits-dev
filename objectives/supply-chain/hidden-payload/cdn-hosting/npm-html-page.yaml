# HTML entries with published markup suggest npm-backed page hosting.
# The manifest alone does not establish phishing or malicious content.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

composite_rules:
  # A registry security hold supplies the intent that an education-themed name
  # cannot establish by itself.  Requiring the same disposable HTML-only shape
  # avoids labeling ordinary withdrawn JavaScript packages as payload hosts.
  - id: npm-security-held-education-html-host
    desc: Security-held education npm stub hosts HTML payload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1608
    scope: outer
    for: [npm, package.json, registry, zip]
    all:
      - id: metadata/package/entrypoint::minimal-html-page-manifest
      - id: metadata/package/placeholder::npm-name-education-activity
      - id: metadata/registry::registry-security-hold-record

  # Registry package whose only deliverable is an HTML page that steals session
  # cookies or WebView bridge data — typical unpkg/jsDelivr CDN abuse shape.
  - id: npm-html-cookie-theft-cdn-payload
    desc: npm HTML CDN stub ships cookie theft page
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1539,T1608
    scope: archive
    for: [npm, tar, package.json, html]
    all:
      - id: metadata/package/entrypoint::main-html-entry
      - id: metadata/package/files/archive-member::archive-html-member
    any:
      - id: objectives/exfiltration/stealer/application-state/cookie::html-script-cookie-fetch-exfil
      - id: objectives/exfiltration/stealer/application-state::html-android-bridge-callback-exfil
    needs: 1
