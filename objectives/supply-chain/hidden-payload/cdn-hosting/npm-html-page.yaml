# HTML entries with published markup suggest npm-backed page hosting.
# The manifest alone does not establish phishing or malicious content.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

composite_rules:
  # Tighter, higher-confidence variant: the whole manifest is the throwaway
  # skeleton these campaigns publish — HTML main, HTML-only allowlist, no
  # dependencies, no scripts, no bin, no description. A genuine package has at
  # least one of those. This is the disposable CDN-hosting stub.
  - id: npm-disposable-html-hosting-stub
    desc: Disposable npm stub hosts an HTML page
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/entrypoint::main-html-entry
      - id: metadata/package/files/package-json::publish-file-list-html-document
      - id: metadata/package/dependencies/manifest/presence::npm-no-dependencies-field
      - id: metadata/package/empty::npm-no-scripts-field
      - id: metadata/package/empty::npm-no-description
    unless:
      - id: metadata/package/entrypoint::bin-field-declared

  # Public-CDN abuse campaigns publish otherwise empty packages under
  # patterned coordinates.  The name-shape atoms remain neutral
  # metadata alone; coupled to a one-page disposable hosting stub they identify
  # intentional registry use as a concealed web-payload host.
  - id: npm-patterned-name-disposable-html-host
    desc: Patterned-name npm stub hosts sole HTML payload
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1608
    all:
      - id: npm-disposable-html-hosting-stub
    any:
      - id: metadata/package/name/generated::npm-name-consonant-run-digit-suffix
      - id: metadata/package/name/generated::npm-name-two-letter-digit-long-suffix
      - id: metadata/package/name/generated::npm-name-short-alphanumeric-mix

  # A registry security hold supplies the intent that an education-themed name
  # cannot establish by itself.  Requiring the same disposable HTML-only shape
  # avoids labeling ordinary withdrawn JavaScript packages as payload hosts.
  - id: npm-security-held-education-html-host
    desc: Security-held education npm stub hosts HTML payload
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1608
    scope: outer
    for: [npm, package.json, registry, zip]
    all:
      - id: npm-disposable-html-hosting-stub
      - id: metadata/package/placeholder::npm-name-education-activity
      - id: metadata/registry::registry-security-hold-record

  # Registry package whose only deliverable is an HTML page that steals session
  # cookies or WebView bridge data — typical unpkg/jsDelivr CDN abuse shape.
  - id: npm-html-cookie-theft-cdn-payload
    desc: npm HTML CDN stub ships cookie theft page
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1539,T1608
    scope: archive
    for: [npm, tar, package.json, html]
    all:
      - id: metadata/package/entrypoint::main-html-entry
      - id: metadata/package/files/archive-member::archive-html-member
    any:
      - id: objectives/exfiltration/stealer/browser::html-script-cookie-fetch-exfil
      - id: objectives/exfiltration/stealer/browser::html-android-bridge-callback-exfil
    needs: 1
