# A hash library need not execute its asset. Flag the unusual published surface
# (opaque private container, exported asset path, platform restriction), without
# claiming decryption, installation-time activation, or malicious contents.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, data]
  attack: T1027.013

composite_rules:
  - id: platform-hash-interface-opaque-container
    desc: Platform-restricted hash interface ships an opaque ENC asset
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::bundled-bin-attachment-hash
      - id: metadata/file/magic/identity::high-entropy-enc-container
      - id: micro-behaviors/fs/path/self::exports-binary-path
      - id: metadata/package/runtime::windows-only-platform-restriction

  # This is an unusual package shape, but the content matcher cannot establish
  # that another program downloads, decrypts, or executes the opaque asset.
  # Keep the stricter OS+CPU restriction as suspicious context while the
  # lower rung records the hash-only interface and container itself.
  - id: platform-pinned-opaque-container-hash-api
    desc: Platform-pinned package hashes a large opaque container without interpreting it
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [npm, tar, package.json, javascript, data]
    all:
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::bundled-bin-attachment-hash
      - id: metadata/file/magic/identity::large-high-entropy-enc-container
      - id: micro-behaviors/fs/path/self::exports-binary-path
      - id: metadata/package/runtime::windows-only-platform-restriction
      - id: metadata/package/runtime::has-cpu-restriction
