# A WhatsApp Web client fork schedules a channel FOLLOW as soon as its
# newsletter socket is constructed. Its identifier is Base64-decoded, and
# callback errors are swallowed. Normal explicit newsletterFollow calls are
# not enough to match: the composite requires the automatic delayed query.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

traits:
  - id: delayed-async-callback
    desc: Schedules an asynchronous callback
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'setTimeout\s*\(\s*async\s*\(\s*\)\s*=>'

  - id: base64-decode-call
    desc: Decodes a Base64 string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'Buffer\.from\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*,\s*["'']base64["'']\s*\)\.toString\(\)'

  - id: newsletter-follow-query
    desc: Queries to follow a WhatsApp newsletter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'newsletter_id\s*:[\s\S]{0,160}QueryIds\.FOLLOW'

composite_rules:
  - id: covert-channel-follow
    desc: Automatically follows a concealed WhatsApp channel
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: delayed-async-callback
      - id: base64-decode-call
      - id: newsletter-follow-query
    near_lines: 16
