# A package whose install-time hook spawns a background thread running a
# Discord-named entry point keeps that agent alive after the installer exits.
# Legitimate install hooks perform build or bookkeeping steps inline; handing
# a chat-commanded agent to a worker thread is the persistence mechanism, not
# the install itself. The Discord target alone is a neutral capability (bots
# thread their runners too), and a hook plus a worker thread alone is only
# suspicious -- it is the three together, with the thread outliving the hook,
# that states the trojan.
defaults:
  platforms: [windows, linux, macos, unix]
  for: [python]
  attack: T1195.002,T1219
  crit: hostile
composite_rules:
  - id: python-install-time-discord-agent-thread
    desc: Install hook launches Discord agent thread
    conf: 0.96
    scope: file
    near_lines: 60
    all:
      - id: metadata/lang/source/declaration::python-post-install-hook-function
      - id: micro-behaviors/process/thread/create::python-thread-create
      - id: micro-behaviors/process/thread/create::python-thread-target-discord
    any:
      - id: micro-behaviors/process/thread/create::python-nondaemon-thread-explicit
      - id: micro-behaviors/time/sleep/interval::python-sleep-1s-plus-arg
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
