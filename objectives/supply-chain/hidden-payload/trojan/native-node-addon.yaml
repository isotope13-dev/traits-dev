defaults:
  platforms:
  - macos
  - linux
  for:
  - macho
  - elf
  attack: T1195.002

traits:

- id: native-addon-hidden-temp-payload-node-stage
  desc: Native addon hidden temp payload launcher
  crit: suspicious
  conf: 0.98
  attack: T1105,T1027,T1059.007
  if:
    type: yara
    source: |
      rule native_addon_hidden_temp_payload_node_stage {
        strings:
          $addon = "addon.node" ascii
          $maps = "/proc/self/maps" ascii
          $trace = "TracerPid:" ascii
          $payload = "payload.bin" ascii
          $temp = "/tmp/.%u" ascii
          $chmod = "chmod" ascii
          $exec = "execlp" ascii
        condition:
          all of them
      }

- id: native-addon-hidden-curl-temp-command
  desc: Native addon embeds hidden curl temp command
  crit: suspicious
  conf: 0.98
  attack: T1105,T1059.007
  if:
    type: yara
    source: |
      rule native_addon_hidden_remote_node_loader {
        strings:
          $curl = "curl -sL" ascii
          $raw = "https://raw.githubusercontent.com/" ascii
          $output = "-o /tmp/." ascii
          $node = "&& node /" ascii
          $addon = "addon.node" ascii
          $system = "system" ascii
        condition:
          all of them
      }

- id: native-addon-ci-gated-hidden-loader
  desc: Addon analysis and hidden-loader markers
  crit: suspicious
  conf: 0.96
  attack: T1497.001
  if:
    type: yara
    source: |
      rule native_addon_ci_gated_hidden_loader {
        strings:
          $actions = "GITHUB_ACTIONS" ascii
          $sandbox = "SANDBOX" ascii
          $getenv = "getenv" ascii
          $fork = "fork" ascii
          $session = "setsid" ascii
          $curl = "curl -sL" ascii
          $temp = "/tmp/." ascii
        condition:
          all of them
      }

- id: native-addon-hidden-sidecar-node-stage
  desc: Hidden sidecar and Node-launch surfaces
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      rule native_addon_hidden_cache_node_stage {
        strings:
          $addon = "napi_" ascii
          $cache = /%s[\\\/]\.[A-Za-z0-9_.-]{3,32}/ ascii
          $maps = "/proc/self/maps" ascii
          $trace = "TracerPid:" ascii
          $temp = /\/tmp\/\.[A-Za-z0-9_.-]{0,16}%[dux]/ ascii
          $node = "node\x00" ascii
          $exec = "execlp" ascii
        condition:
          all of them
      }

- id: native-addon-hidden-cache-executable-stage
  desc: Native addon executes hidden cached payload
  crit: suspicious
  conf: 0.98
  attack: T1105,T1027,T1059
  if:
    type: yara
    source: |
      rule native_addon_hidden_cache_executable_stage {
        strings:
          $cache = ".napi_cache" ascii
          $tmp = "/tmp/.%u" ascii
          $fork = "fork" ascii
          $session = "setsid" ascii
          $write = "fwrite" ascii
          $chmod = "chmod" ascii
          $exec = "execlp" ascii
        condition:
          all of them
      }

- id: native-addon-analysis-environment-gate
  desc: Native addon checks analysis environments
  crit: suspicious
  conf: 0.97
  attack: T1497.001
  if:
    type: yara
    source: |
      rule native_addon_analysis_environment_gate {
        strings:
          $ci = "GITHUB_ACTIONS" ascii
          $sandbox = "SANDBOX" ascii
          $container = "/proc/1/cgroup" ascii
          $debug = "TracerPid:" ascii
          $maps = "/proc/self/maps" ascii
          $getenv = "getenv" ascii
        condition:
          all of them
      }

composite_rules:
- id: native-addon-analysis-gated-remote-loader
  desc: Native addon gates remote loader against analysis
  crit: hostile
  conf: 0.98
  attack: T1497.001,T1105,T1059.007
  for: [elf]
  platforms: [linux]
  all:
  - id: metadata/binary/framework::node-api-native-addon
  - id: native-addon-hidden-curl-temp-command
  - id: native-addon-ci-gated-hidden-loader

- id: npm-entrypoint-native-addon-loader
  desc: npm entrypoint loads native remote-loader addon
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1105,T1059.007
  scope: archive
  for: [npm, package.json, javascript, elf]
  all:
  - id: metadata/package/entrypoint::has-index-entry
  - id: micro-behaviors/os/module/require::try-local-require-catch-text
  - id: native-addon-hidden-curl-temp-command

- id: native-addon-embedded-temp-payload-node-dropper
  desc: Native addon stages bundled temp payload
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1105,T1027,T1059.007
  for: [elf]
  platforms: [linux]
  all:
  - id: metadata/binary/framework::node-api-native-addon
  - id: native-addon-hidden-temp-payload-node-stage

- id: native-addon-hidden-remote-node-loader-attempt
  desc: Native addon attempts hidden Node loader
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1105,T1059.007
  for: [elf]
  platforms: [linux]
  all:
  - id: metadata/binary/framework::node-api-native-addon
  - id: native-addon-hidden-curl-temp-command

- id: node-addon-solana-network-backdoor
  desc: Native Node addon Solana network implant
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/binary/framework::node-api-native-addon
  - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
  - id: micro-behaviors/communications/http/lib/crate
  - id: micro-behaviors/process/create/direct::posix-spawn-with-fd-actions
  any:
  - id: micro-behaviors/process/identity/setuid::setuid-dup
  - id: micro-behaviors/process/identity/setuid::setgid
  - id: micro-behaviors/dylib/load/runtime::dlopen
  needs: 2
- id: node-addon-embedded-shell-stage
  desc: Native Node addon embedded shell stage
  crit: suspicious
  conf: 0.93
  platforms:
  - linux
  for:
  - elf
  all:
  - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: micro-behaviors/data/embedded/payload/native::embedded-shell-stage
  unless:
  - id: well-known/tool/reverse-engineering/frida/
  - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
  - id: well-known/lib/cloud/microvms::official-native-addon
- id: node-addon-daemonized-shell-stage
  desc: Native Node addon daemonized shell stage
  crit: suspicious
  conf: 0.95
  platforms:
  - linux
  for:
  - elf
  all:
  - id: micro-behaviors/process/create/shell/spawn::native-node-addon-shell-exec
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  unless:
  - id: well-known/tool/reverse-engineering/frida/
- id: hidden-temp-shell-native-addon-dropper
  desc: Native Node addon hidden temp shell dropper
  crit: hostile
  conf: 0.97
  platforms:
  - linux
  for:
  - elf
  all:
  - id: micro-behaviors/process/create/shell/spawn::native-node-addon-shell-exec
  - id: micro-behaviors/fs/chmod/modify::node-addon-hidden-temp-write-surfaces
  any:
  - id: node-addon-embedded-shell-stage
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  unless:
  - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
  - id: well-known/lib/cloud/microvms::official-native-addon
- id: embedded-shell-native-addon-dropper
  desc: Native Node addon embedded shell dropper
  crit: hostile
  conf: 0.98
  platforms:
  - linux
  for:
  - elf
  all:
  - id: node-addon-embedded-shell-stage
  - id: micro-behaviors/fs/chmod/modify::node-addon-hidden-temp-write-surfaces
  unless:
  - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
  - id: well-known/lib/cloud/microvms::official-native-addon
- id: daemonized-native-addon-dropper
  desc: Daemonized native Node addon dropper
  crit: hostile
  conf: 0.98
  platforms:
  - linux
  for:
  - elf
  all:
  - id: hidden-temp-shell-native-addon-dropper
  - id: micro-behaviors/process/daemonize/detach::fork-new-session

- id: npm-postinstall-native-addon-payload-dropper
  desc: Install hook with concealed native Node stage
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1027
  scope: archive
  platforms: [macos, linux, windows]
  for: [npm, package.json, elf, pe, macho]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-interpreter-command
  - id: metadata/binary/symbols/exports::node-api-addon-export
  any:
  - id: objectives/supply-chain/hidden-payload/trojan::native-addon-hidden-temp-payload-node-stage
  - id: objectives/supply-chain/hidden-payload/trojan::native-addon-hidden-sidecar-node-stage
  - id: objectives/execution/payload/file-exec::native-addon-hidden-sidecar-temp-js-dropper

- id: native-addon-analysis-gated-cache-executable
  desc: Analysis-gated native cache executable
  crit: hostile
  conf: 0.99
  attack: T1497.001,T1105,T1027,T1059
  for: [elf]
  platforms: [linux]
  all:
  - id: metadata/binary/framework::node-api-native-addon
  - id: native-addon-hidden-cache-executable-stage
  - id: native-addon-analysis-environment-gate
