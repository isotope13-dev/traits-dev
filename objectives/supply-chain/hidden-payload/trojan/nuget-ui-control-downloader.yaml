# A NuGet UI control library has no reason to download an executable to the
# temp folder and shell-launch it. The code runs when an application merely
# instantiates the control, so the package itself is the delivery vehicle.
defaults:
  platforms: [windows]
  for: [nupkg, pe]
  attack: T1195.002,T1105

composite_rules:
  - id: nuget-ui-control-library-temp-exe-launcher
    desc: NuGet UI control library downloads and shell-launches a temp executable
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/communications/http/client/managed::nuget-member-httpclient-temp-launch-references
    any:
      - id: metadata/import/framework::winui-xaml-controls-reference
      - id: metadata/import/framework::wpf-framework-reference
