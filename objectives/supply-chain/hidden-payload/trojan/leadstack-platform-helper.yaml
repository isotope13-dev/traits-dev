# The optional platform helper was never published. Keep its package name as
# an IOC leg and require the install-time launch behavior in the same archive.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1059.007

traits:
  - id: leadstack-platform-helper-name
    desc: LeadStack platform helper package reference
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: '@leadstack/crm-connector-linux-x64'

  - id: optional-helper-node-setup-launch
    desc: Runs optional helper setup through Node
    crit: component
    for: [javascript]
    if:
      type: text
      regex: 'execFileSync\(process\.execPath,\s*\[binPath,\s*"--setup"\]'

composite_rules:
  - id: postinstall-launches-optional-platform-helper
    desc: Postinstall runs an optional platform helper
    crit: suspicious
    conf: 0.94
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/dependencies/name-form::optional-platform-linux-dep-name
      - id: optional-helper-node-setup-launch

  - id: unpublished-platform-helper-install-launch
    desc: Postinstall launches the unpublished LeadStack platform helper
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: postinstall-launches-optional-platform-helper
      - id: leadstack-platform-helper-name
