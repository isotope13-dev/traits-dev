defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1195.002

composite_rules:
  - id: package-entrypoint-bytecode-loader
    desc: Package entrypoint loads hidden bytecode
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/supply-chain/hidden-payload/encoding::require-bytenode
      - id: objectives/supply-chain/hidden-payload/encoding::require-local-jsc
      - id: metadata/package/manifest/entrypoint::main-js-file-entry

# A published module whose entire body is a crypter-wrapped payload. The
# loader rules under anti-static convict the decrypt-and-exec chain; this one
# states the delivery -- a package wearing a real library's name whose module
# is nothing but an obfuscator banner and an encrypted blob has no code to
# review, which is the point.
#
# Worked example: `readycher`, a Vare-obfuscator-wrapped module whose payload
# line is Fernet.decrypt -> base32 -> base64 x2 -> exec under 290KB of dead
# branches.
  - id: package-is-crypter-wrapped-blob
    desc: Package module is only a crypter-wrapped payload
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1195.002
    scope: archive
    all:
      - id: well-known/dual-use/packaging/vare::vare-obfuscator-banner
      - id: objectives/anti-static/obfuscation/eval/scripting::python-decode-decrypt-dynamic-exec
