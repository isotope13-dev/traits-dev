# npm packages that disguise encoded blobs as exported error-message constants.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip, package.json, json]
  attack: T1195.002,T1027

composite_rules:
  - id: npm-disguised-error-constants-export-blob
    desc: Tiny npm module exports stitched high-entropy error constants
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
      - id: metadata/file/data-blob::javascript-compact-high-entropy-strings
      - id: metadata/lang/javascript-features::exports-concatenates-named-constants
    any:
      - id: metadata/lang/javascript-features::err-prefixed-base64-like-literal
      - id: metadata/lang/javascript-features::err-prefixed-colon-separated-literals
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
