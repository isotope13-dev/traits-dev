# A browser-navigation attack shipped as the package's root JavaScript main is
# an active package payload, not a dormant example or unrelated test fixture.
defaults:
  platforms: [windows, unix]
  for: [npm]
  attack: T1195.002,T1185

composite_rules:
  # A published package that contains a detached, fire-and-forget launch of
  # its own external page has an unexpected execution side effect. Keep this
  # suspicious: some command-line tools intentionally open a help or project
  # page, but doing so from shipped code still deserves review.
  - id: npm-detached-external-page-opener
    for: [npm, tar, javascript, package.json]
    desc: NPM payload launches detached external page
    crit: suspicious
    conf: 0.94
    scope: archive
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

  - id: npm-entrypoint-cross-frame-navigation-payload
    for: [npm, package.json, javascript]
    desc: NPM entrypoint carries cross-frame navigation attack
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/entrypoint/module::main-root-javascript-entry
      - id: objectives/impact/ui/manipulation/traffic::cross-frame-logout-navigation-hijack
