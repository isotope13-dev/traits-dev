# A Python wheel that executes a bundled Windows program merely by being
# imported.  The archive scope ties the import-time trigger to the native
# payload member, avoiding a hit on a package that only contains either one.
defaults:
  platforms: [windows]
  for: [whl]
  attack: T1195.002,T1059.006

traits:
  - id: python-module-level-popen
    desc: Python module calls Popen at import time
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        (module
          (expression_statement
            (call) @call)
          (#match? @call "(?i)Popen"))

composite_rules:
  # The AST call must be at module scope. Archive-wide correlation previously
  # joined pip's normal subprocess helpers, Rich's Windows diagnostics, and
  # unrelated distlib launcher resources.
  - id: python-import-time-process-launch
    desc: Python module calls Popen; checks Windows version
    crit: notable
    conf: 0.95
    for: [python]
    scope: file
    all:
      - id: python-module-level-popen
      - id: micro-behaviors/os/sysinfo/platform/runtime::python-windows-version-call

  - id: python-wheel-import-time-native-launcher
    desc: Wheel import launches a bundled Windows executable
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: python-import-time-process-launch
      - id: metadata/package/files/included::exe-extension-basename
    unless:
      # ensurepip wheels are the standard Python bootstrap bundle; their
      # vendor distlib executables are packaging resources, not a payload.
      - id: metadata/package/files/dependency::bundled-python-bootstrap-wheel-path
      # ComfyUI's portable application archive contains an empty wheel cache
      # beside its embedded Python runtime; package evidence must not pool
      # across that application bundle.
      - id: well-known/app/ai/media/comfyui::comfyui-portable-archive-context
