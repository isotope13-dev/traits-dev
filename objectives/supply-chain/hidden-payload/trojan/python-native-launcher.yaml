# A Python wheel that executes a bundled Windows program merely by being
# imported. Archive scope correlates observations across members but does not
# establish that the import-time command launches the bundled executable.
defaults:
  platforms: [windows]
  for: [whl]
  attack: T1195.002,T1059.006

composite_rules:
  # The AST call must be at module scope. Archive-wide correlation previously
  # joined pip's normal subprocess helpers, Rich's Windows diagnostics, and
  # unrelated distlib launcher resources.
  - id: python-import-time-process-launch
    desc: Python module calls Popen; checks Windows version
    crit: notable
    conf: 0.95
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess/launch::python-module-level-popen
      - id: micro-behaviors/os/sysinfo/platform/runtime/version::python-windows-version-call

  - id: python-hex-decoded-import-popen
    desc: Import-time Popen of hex-decoded argv
    crit: hostile
    conf: 0.96
    for: [python]
    platforms: [unix, windows]
    all:
      - id: micro-behaviors/process/create/subprocess/launch::python-module-level-popen
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: metadata/import/builtin::alias-subprocess

  - id: python-wheel-import-time-native-launcher
    for: [whl, python, pe]
    desc: Wheel contains an import-time process launch and a Windows executable
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: python-import-time-process-launch
      - id: metadata/package/files/included::exe-extension-basename

  - id: python-import-daemon-native-load
    desc: Import-time fork, setsid and library clues
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1574.002
    for: [python]
    platforms: [linux, macos]
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/process/create/fork::python-fork-child-branch
      - id: micro-behaviors/process/daemonize/detach::python-setsid
      - id: micro-behaviors/dylib/load/runtime::ctypes-cdll
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call

  - id: python-import-loads-sibling-pyd
    desc: Import loads a sibling native module
    crit: hostile
    conf: 0.96
    attack: T1129,T1195.002
    for: [python]
    platforms: [windows, unix]
    scope: file
    near_lines: 8
    all:
      - id: micro-behaviors/fs/path/self::python-module-directory
      - id: micro-behaviors/dylib/load/runtime::ctypes-cdll
      - id: micro-behaviors/dylib/load/runtime::python-pyd-extension-string
    unless:
      # comfy_kitchen's CUDA backend loads its own _C.abi3 extension.
      - id: well-known/app/ai/media/comfyui::comfy-kitchen-cuda-backend
      # A package that locates its extension through an importlib
      # file-location spec and executes it as a module is self-loading its
      # own implementation (the documented Windows native-dependency
      # recipe), not sideloading a hidden payload.
      - id: micro-behaviors/os/module/load/path::python-importlib-spec-file-module-load
