# A Python wheel that executes a bundled Windows program merely by being
# imported.  The archive scope ties the import-time trigger to the native
# payload member, avoiding a hit on a package that only contains either one.
defaults:
  platforms: [windows]
  for: [whl]
  attack: T1195.002,T1059.006

traits:
  - id: python-module-level-popen
    desc: Python module calls Popen at import time
    crit: notable
    conf: 0.98
    for: [python]
    if:
      # Module scope is column zero in Python. The earlier tree-sitter query
      # matched the whole call's source text, so any module-level call whose
      # *arguments* mentioned Popen fired (a transpiler emitting
      # `subprocess.Popen(...)` inside a replacement string) -- and inside an
      # archive member the AST path degrades to text anyway, so anchor here.
      type: text
      regex: '(?m)^(\w[\w.]*\s*=\s*)?(\w[\w.]*\.)?Popen\s*\('
  - id: python-dotted-cdll-call
    desc: Call named CDLL
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CDLL$'
  - id: python-pyd-extension-string
    desc: Python string names a PYD module
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: '["''][^"''\n]{0,80}\.pyd["'']'

composite_rules:
  # The AST call must be at module scope. Archive-wide correlation previously
  # joined pip's normal subprocess helpers, Rich's Windows diagnostics, and
  # unrelated distlib launcher resources.
  - id: python-import-time-process-launch
    desc: Python module calls Popen; checks Windows version
    crit: notable
    conf: 0.95
    for: [python]
    scope: file
    all:
      - id: python-module-level-popen
      - id: micro-behaviors/os/sysinfo/platform/runtime::python-windows-version-call

  - id: python-hex-decoded-import-popen
    desc: Import-time Popen of hex-decoded argv
    crit: hostile
    conf: 0.96
    for: [python]
    platforms: [unix, windows]
    all:
      - id: python-module-level-popen
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/source/import::alias-subprocess

  - id: python-wheel-import-time-native-launcher
    for: [whl, python, pe]
    desc: Wheel import launches a bundled Windows executable
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: python-import-time-process-launch
      - id: metadata/package/files/included::exe-extension-basename
    unless:
      # ensurepip wheels are the standard Python bootstrap bundle; their
      # vendor distlib executables are packaging resources, not a payload.
      - id: metadata/package/files/dependency::bundled-python-bootstrap-wheel-path
      # ComfyUI's portable application archive contains an empty wheel cache
      # beside its embedded Python runtime; package evidence must not pool
      # across that application bundle.
      - id: well-known/app/ai/media/comfyui::comfyui-portable-archive-context

  - id: python-import-daemon-native-load
    desc: Import forks, detaches, and loads a library
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1574.002
    for: [python]
    platforms: [linux, macos]
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/process/fork/clone::python-fork-child-branch
      - id: micro-behaviors/process/daemonize/detach::python-setsid
      - id: micro-behaviors/dylib/load/runtime::ctypes-cdll
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call

  - id: python-daemon-redirects-stdio
    desc: Daemon child redirects standard streams
    crit: hostile
    conf: 0.96
    attack: T1564.001,T1195.002
    for: [python]
    platforms: [linux, macos]
    scope: file
    near_lines: 30
    all:
      - id: micro-behaviors/process/fork/clone::python-fork-child-branch
      - id: micro-behaviors/process/fd/dup::python-dup2
      - id: micro-behaviors/process/daemonize/detach::python-setsid
    unless:
      # Ansible's service and async modules daemonize a child on purpose.
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package

  - id: python-import-loads-sibling-pyd
    desc: Import loads a sibling native module
    crit: hostile
    conf: 0.96
    attack: T1129,T1195.002
    for: [python]
    platforms: [windows, unix]
    scope: file
    near_lines: 8
    all:
      - id: python-dotted-cdll-call
      - id: python-pyd-extension-string
