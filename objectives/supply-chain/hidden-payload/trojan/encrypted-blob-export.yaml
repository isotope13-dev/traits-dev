# An npm package that ships a passphrase-encrypted blob and a module whose
# only job is to read it back as a string, with no decryption in the package.
# Whoever holds the passphrase decrypts it elsewhere, so the package is a
# dead drop for a payload that never appears in the registry as readable code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip, data, text]
  attack: T1195.002,T1027
composite_rules:
  - id: npm-encrypted-blob-reader-dead-drop
    desc: npm package exports an OpenSSL-encrypted blob with no decryptor
    crit: hostile
    conf: 0.88
    scope: archive
    all:
      - id: metadata/file/encoding/base64::openssl-salted-base64-ciphertext-file
      - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
      - id: metadata/package/files/included::npm-publish-root-manifest
    unless:
      - id: metadata/path/directory::test-directory-component
