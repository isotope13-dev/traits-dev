# Python package auto-runs a credential stealer on import
# A trojanized PyPI package whose __init__.py invokes a stealer function at
# import time (silenced by try/except) so merely importing the package steals
# credentials and exfiltrates them. The trigger and the payload live in
# separate package modules, so evidence is pooled at archive scope.
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  crit: hostile
  for: [python, whl, python-sdist]
  platforms: [windows, macos, unix, linux]
  attack: T1195.002
composite_rules:
  - id: python-import-time-credential-stealer
    desc: Package auto-runs credential stealer on import
    crit: hostile
    conf: 0.98
    scope: archive
    attack: "T1195.002,T1041"
    all:
      - id: micro-behaviors/data/control-flow/module-exec::try-wrapped-module-call
    any:
      - id: objectives/credential-access/theft/multi-store::developer-and-wallet-credential-harvester
      - id: objectives/exfiltration/stealer/dev-secret::encoded-multi-developer-secret-exfil
      - id: objectives/exfiltration/stealer/wallet::wallet-extension-store-http-exfiltration
      - id: objectives/credential-access/browser/multi-target::hostile-browser-stealer
    unless:
      - id: well-known/tool/detection/
      - id: well-known/app/security/
      - id: metadata/package/testing/

  - id: python-import-time-stealer
    desc: Package auto-runs credential stealer on import
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/module-exec::try-wrapped-module-call
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-split
    any:
      - id: micro-behaviors/os/security/dpapi::python-dpapi-unprotect
      - id: micro-behaviors/fs/path/cookie::roblox-cookie-file

  # A package import that writes a generated native agent into a hidden user
  # directory and registers it with cron is an install-time persistence path,
  # not ordinary module initialization.  Keep the evidence on the same
  # Python source file so a benign package that merely contains a payload
  # helper does not match.
  - id: python-import-time-native-agent-persistence
    desc: Import-time hidden native agent with cron persistence
    conf: 0.99
    platforms: [unix]
    for: [python]
    attack: "T1195.002,T1053.003,T1027.009"
    all:
      - id: metadata/import/package::python-private-relative-import
      - id: micro-behaviors/fs/path-ops/join::python-dot-prefixed-joined-path
      - id: micro-behaviors/fs/file/stat::path-exists
      - id: micro-behaviors/fs/file/open::write-append-create-mode
      - id: micro-behaviors/fs/chmod/modify::python-os-chmod
      - id: micro-behaviors/os/autorun/cron::crontab-keyword
    near_lines: 80

  - id: python-import-time-elf-agent-persistence
    desc: Python package carries an ELF payload and installs it as a cron agent
    conf: 0.99
    scope: archive
    platforms: [unix]
    attack: "T1195.002,T1053.003,T1027.009"
    all:
      - id: micro-behaviors/data/embedded/payload/native::python-base64-elf-carrier
      - id: micro-behaviors/fs/path-ops/join::python-dot-prefixed-joined-path
      - id: micro-behaviors/fs/file/open::write-append-create-mode
      - id: micro-behaviors/fs/chmod/modify::python-os-chmod
      - id: micro-behaviors/os/autorun/cron::python-crontab-stdin-install
