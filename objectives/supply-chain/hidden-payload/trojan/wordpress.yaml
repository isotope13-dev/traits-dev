defaults:
  platforms:
    - unix
    - windows
  for:
    - php
traits:
  - id: remote-prop-callback-exec
    desc: Dynamic callback over object properties
    crit: notable
    conf: 0.95
    attack: T1505.003
    if:
      type: text
      # Anchor at executable line start so a remediation that retains the old
      # call as `//@$fn(...)` is not treated as live execution.
      regex: '(?m)^[ \t]*@?\$\w+\s*\(\s*\$this->\w+\s*,\s*\$this->\w+\s*\)'
  - id: wp-comments-posts-reference
    desc: wp-comments-posts.php filename reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: \bwp-comments-posts\.php\b
  - id: wp-comments-posts-masquerade
    desc: PHP file mimics WordPress core filename
    crit: suspicious
    conf: 0.98
    attack: T1036
    if:
      type: path
      basename: true
      exact: wp-comments-posts.php
  - id: php-include-abspath-implant
    desc: Injected ABSPATH include fragment
    crit: suspicious
    conf: 0.92
    attack: T1505.003
    if:
      type: text
      regex: <\?php\s+include\s+ABSPATH
composite_rules:
  - id: wordpress-plugin-remote-callback-backdoor
    desc: WordPress plugin remote callback backdoor
    crit: hostile
    conf: 0.99
    attack: T1505.003
    all:
      - id: micro-behaviors/data/serialize/object::remote-unserialize
      - id: micro-behaviors/communications/http/request/wordpress::rest-route-permissive-callback-context
      - id: remote-prop-callback-exec
  - id: wordpress-config-dropper
    desc: WordPress config implant dropper
    crit: suspicious
    conf: 0.98
    attack: T1105
    all:
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
      - id: micro-behaviors/fs/write/file/handle/unspecified::php-file-write
      - id: micro-behaviors/fs/path/config/web::wordpress-config-path
    any:
      - id: wp-comments-posts-masquerade
      - id: wp-comments-posts-reference
      - id: php-include-abspath-implant
  - id: wordpress-googlebot-blockchain-cloak
    desc: WordPress config has crawler and RPC fetch clues
    crit: suspicious
    conf: 0.97
    attack: T1102
    all:
      - id: micro-behaviors/communications/http/user-agent::bot-user-agent-list--rx-1
      - id: micro-behaviors/communications/blockchain/ethereum::eth-call-method-field
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
      - id: metadata/filename/identity::wp-config-basename
    any:
      - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-host
      - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::contract-address-encoded
