# Build-artifact injection in an impersonating npm library.
# A side-effect-only external require in a Node dist entrypoint is not enough
# to call a package malicious. It becomes hostile here only when the archive
# also impersonates EthereumJS and carries parallel source/browser entrypoints,
# which exposes a Node-only shipped modification.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]
  attack: T1195.002, T1059.007
  mbc: B0024

traits:
  - id: assert-kit-4-3-2-runtime-dependency
    desc: Manifest declares backdoored assert-kit
    crit: suspicious
    conf: 0.995
    attack: T1195.002
    for: [package.json, pkginfo]
    if:
      type: text
      regex: '"assert-kit"\s*:\s*"\^?4\.3\.2"'

composite_rules:
  - id: npm-node-dist-side-effect-build
    desc: Node dist entrypoint has a package side effect beside source and browser builds
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: micro-behaviors/os/module/load::cjs-side-effect-package-require
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      - id: metadata/package/files/runtime::typescript-source-tree-artifact
      - id: metadata/package/files/runtime::browser-dist-tree-artifact
      - id: metadata/package/manifest/entrypoint::main-dist-entrypoint

  - id: ethereumjs-util-node-artifact-injection
    desc: EthereumJS impersonator has a Node-only injected package require
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: npm-node-dist-side-effect-build
      - id: objectives/supply-chain/impersonation/brand::ethereumjs-util-identity-impersonation

  - id: eth-util-node-artifact-injection
    desc: eth-util impersonator has Node-only injected package require
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: npm-node-dist-side-effect-build
      - id: objectives/supply-chain/impersonation/brand::eth-util-identity-impersonation

  - id: eth-util-assert-kit-dependency-loader
    desc: EthereumJS impersonator declares assert-kit backdoor dependency
    crit: hostile
    conf: 0.995
    for: [npm, tar, zip, pkginfo]
    all:
      - id: assert-kit-4-3-2-runtime-dependency
    any:
      - id: objectives/supply-chain/impersonation/brand::eth-util-identity-impersonation
      - id: objectives/supply-chain/impersonation/brand::eth-util-registry-identity-impersonation
