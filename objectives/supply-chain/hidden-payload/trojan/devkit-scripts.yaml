defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
traits:
- id: computed-child-process-destructure-ast
  desc: "Computed destructuring child_process require"
  crit: suspicious
  conf: 0.92
  mbc: C0017
  attack: T1059
  if:
    type: tree-sitter
    language: javascript
    query: |
      (variable_declarator
        name: (object_pattern) @pattern
        value: (call_expression
          function: (identifier) @fn
          arguments: (arguments (string) @module))
        (#eq? @fn "require")
        (#match? @module "'(node:)?child_process'|\"(node:)?child_process\"")
        (#match? @pattern "\\[")
      )
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/library/structure/
  - id: metadata/library/runtime::core-js-runtime-bundle
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/library/structure::js-webpack-bundle
  - id: metadata/library/structure::vscode-extension-generated-asset
- id: computed-bracket-key-source
  desc: "Computed destructuring {[expr]: ...} key"
  crit: component
  conf: 0.7
  if:
    type: text
    regex: "\\{[^}\\n]{0,120}\\[[^\\]]{1,80}\\]\\s*:[^}\\n]{0,120}\\}\\s*="
  not:
    - regex: '\[[^\]]*:[^\]]*\]'
- id: node-e-array-argument-ast
  desc: Indexed node -e launch args (AST)
  crit: suspicious
  conf: 0.86
  mbc: C0017
  attack: T1059.007
  count_min: 3
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (identifier) @callee
        arguments: (arguments
          (_)
          (array
            (subscript_expression
              object: (identifier) @table
              index: (number) @index)
            (_)))
        (#match? @index "^(0x16|22)$")
      )
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/library/structure::js-webpack-bundle
  # Legit bundled parsers/formatters (prettier's Flow parser, etc.) have
  # numeric-indexed table access inside call args and trip this generic AST
  # shape. The hostile composite also requires the child_process-destructure
  # leg (which already excludes library bundles), so these exclusions only
  # quiet the standalone atom, not the trojan composite.
  - id: metadata/library/structure/
  - id: well-known/tool/development/prettier::package-bundle
- id: decoder-array-push-ast
  desc: Pushes indexed or character-coded decoder values
  crit: component
  conf: 0.76
  mbc: B0032
  if:
    type: text
    regex: '\.push\s*\(\s*(String\.fromCharCode|[A-Za-z_$][A-Za-z0-9_$]*\s*\[)'
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/library/structure/
- id: indexed-node-e-spawn-args
  desc: Obfuscated indexed node -e launches
  crit: suspicious
  conf: 0.9
  mbc: C0017
  attack: T1059.007
  count_min: 3
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]*\s*\([^,\n]{1,80},\s*\[\s*[A-Za-z_$][\w$]*\s*\[\s*0x16\s*\]
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/library/structure::js-webpack-bundle
  # NOTE: pure structural string/import counts live in metadata/file/metrics
  # (script-many-shell-command-strings-100, script-many-imports-300). FP
  # suppression for those counts lives on the composites below, not on the
  # metric itself.
- id: single-line-packed-loader-metrics
  desc: Single-line packed JavaScript loader profile
  crit: component
  conf: 0.88
  mbc: B0032
  attack: T1027
  if:
    type: metrics
    field: text.max_line_length
    min: 20000
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/library/structure::js-webpack-bundle
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/library/structure::vscode-vendor-output-path
  - id: metadata/library/structure::vscode-vendor-output-path
  - id: metadata/library/structure::vscode-extension-generated-asset
  - id: well-known/app/development/vscode-extension/tencent-codebuddy::codebuddy-marker
