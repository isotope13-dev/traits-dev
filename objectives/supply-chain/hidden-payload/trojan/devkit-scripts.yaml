defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
traits:
- id: node-e-array-argument-ast
  desc: Indexed node -e launch args (AST)
  crit: suspicious
  conf: 0.86
  mbc: C0017
  attack: T1059.007
  count_min: 3
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (identifier) @callee
        arguments: (arguments
          (_)
          (array
            (subscript_expression
              object: (identifier) @table
              index: (number) @index)
            (_)))
        (#match? @index "^(0x16|22)$")
      )
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: well-known/tool/development/lint/prettier::package-bundle
  - id: metadata/path::test-directory-component
- id: decoder-array-push-ast
  desc: Pushes indexed or character-coded decoder values
  crit: component
  conf: 0.76
  mbc: B0032
  for:
  - javascript
  - typescript
  - scripts
  if:
    type: text
    regex: \.push\s*\(\s*(String\.fromCharCode|[A-Za-z_$][\w$]*\s*\[\s*0x[0-9a-fA-F]+\s*\])
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: well-known/lib/ui/google-code-prettify::runner
  - id: metadata/path::compiled-directory-component
  - type: path
    regex: (^|/)compiled/
  - id: metadata/path::test-directory-component
- id: indexed-node-e-spawn-args
  desc: Obfuscated indexed node -e launches
  crit: suspicious
  conf: 0.9
  mbc: C0017
  attack: T1059.007
  count_min: 3
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]*\s*\([^,\n(]{1,80},\s*\[\s*[A-Za-z_$][\w$]*\s*\[\s*0x16\s*\]
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/path::test-directory-component
composite_rules:
- id: hidden-detached-node-eval-loader
  desc: Hidden detached Node eval loader
  crit: hostile
  conf: 0.96
  mbc: C0017
  attack: T1059.007
  all:
  - id: metadata/lang/source/syntax/key-value::node-windowshide-true-option
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/metaprogramming/generation::embedded-eval-variable-source
  any:
  - id: micro-behaviors/communications/blockchain/client::blockchain-provider-reference-cluster
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: computed-child-process-packed-loader
  desc: Packed loader hides child_process member selection
  crit: hostile
  conf: 0.96
  mbc: C0017
  attack: T1059
  all:
  - id: micro-behaviors/os/module/dynamic-load::node-computed-child-process-binding
  - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
  - id: micro-behaviors/data/property/access::hex-key-indexing-cluster
- id: repeated-obfuscated-node-e-loader
  desc: Repeated obfuscated node -e child process launches
  crit: hostile
  conf: 0.97
  mbc: C0017
  attack: T1059.007
  all:
  - id: indexed-node-e-spawn-args
  - id: micro-behaviors/os/module/dynamic-load::node-computed-child-process-binding
  - id: micro-behaviors/data/control-flow/error-handling::catch-before-await-or-require
- id: packed-shell-command-supply-chain-loader
  desc: Packed supply-chain loader with shell command payload mass
  crit: hostile
  conf: 0.96
  mbc: C0017
  all:
  - id: metadata/file/profile/string-population::script-many-shell-command-strings-100
  - id: metadata/file/import::script-many-imports-300
  - id: metadata/file/line::javascript-line-over-20000
  - id: micro-behaviors/os/module/require::child-process-require
  any:
  - id: micro-behaviors/communications/http/request/client::axios-module-import
  - id: micro-behaviors/metaprogramming/generation::js-new-function-constructor
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: well-known/lib/format/pdfjs/
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
  - id: well-known/app/ai/browser-agent/open-webui-computer/
  - id: metadata/path::test-directory-component
- id: ast-decoder-child-process-loader
  desc: AST-observed decoder and child_process execution loader
  crit: hostile
  conf: 0.96
  mbc: C0017
  attack: T1059.007
  all:
  - id: micro-behaviors/os/module/dynamic-load::node-computed-child-process-binding
  - id: node-e-array-argument-ast
  - id: micro-behaviors/data/property/access::function-indexed-access-cluster
  any:
  - id: micro-behaviors/metaprogramming/generation::new-function-return-this
  - id: micro-behaviors/data/string/search::js-alphabet-indexof-lookup
- id: ast-packed-string-decoder
  desc: Packed string decoder reconstruction
  crit: notable
  conf: 0.9
  mbc: B0032
  attack: T1027
  all:
  - id: micro-behaviors/data/string/search::js-alphabet-indexof-lookup
  - id: decoder-array-push-ast
  any:
  - id: metadata/file/line::javascript-line-over-20000
  - id: metadata/file/import::script-many-imports-300
  near_bytes: 512
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: well-known/lib/format/pdfjs/
  - id: metadata/path::test-directory-component
