# PHP hidden inside a differently-typed script carrier. A server-side include
# can make the foreign fragment executable even though scanners and reviewers
# naturally treat the file as JavaScript. Keep the atoms separate so the
# hostile verdict requires the complete request-input-to-eval behavior.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  # "This .js file contains PHP" is a neutral content fact — server-side
  # templating leaves it behind in ordinary WordPress plugin scripts — and now
  # lives at micro-behaviors/data/embedded/script::embedded-php-open-tag. The
  # backdoor claim belongs to the composite below, which adds the eval and
  # request-input legs; the product exclusions moved there with it.
  # Underscore-bounded `read` only: bare `(read|load)` mid-name matches
  # ordinary helpers (`loadDefaults`, `reloadDictionaries`) that happen to
  # share a file with `file_get_contents` + `require($var)` dictionary boot.
  - id: php-file-read-wrapper-function
    desc: PHP file-read wrapper function
    crit: component
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: '(?i)\bfunction\s+([A-Za-z_][A-Za-z0-9_]{0,40}_)?read(_[A-Za-z0-9_]{0,40})?\s*\('

composite_rules:
  - id: javascript-embedded-php-request-eval-backdoor
    desc: JavaScript carrier hides a PHP request-eval backdoor
    crit: hostile
    conf: 0.99
    attack: T1505.003
    for: [javascript]
    all:
      - id: micro-behaviors/data/embedded/script::embedded-php-open-tag
      # This canonical sink trait requires the request superglobal inside the
      # eval argument. A JavaScript eval and an unrelated PHP example elsewhere
      # in a generated bundle must not combine into a webshell verdict.
      - id: micro-behaviors/process/interpreter/eval::eval-user-input
    near_bytes: 512
    unless:
      # VSCodium's workbench legitimately prepends the tag when rendering a PHP
      # document, and API-documentation bundles ship PHP request samples; both
      # can carry an eval and a superglobal elsewhere in the same bundle.
      - id: well-known/app/development/vscodium::archive-context
      - id: well-known/app/development/vscodium::vscodium-core-bundle-path
      - id: well-known/lib/ui/swagger-ui::swagger-ui-bundle-marker

  - id: php-read-wrapper-dynamic-execution
    desc: PHP read wrapper dynamically executes input
    crit: suspicious
    conf: 0.94
    for: [php]
    # Require the three legs to co-locate: a read-named wrapper that both
    # slurps and require()s must be the same small region, not three unrelated
    # dictionary helpers scattered across a class.
    # Real droppers co-locate the wrapper, read, and require; sentiment
    # libraries and similar loaders often spread those calls across helpers.
    near_bytes: 400
    all:
      - id: php-file-read-wrapper-function
      - id: micro-behaviors/fs/read/file::file-get-contents
      - id: micro-behaviors/process/lifecycle/auto-exec::php-dynamic-require-variable
    unless:
      - id: well-known/lib/ai/phpinsight::phpinsight-library-context
