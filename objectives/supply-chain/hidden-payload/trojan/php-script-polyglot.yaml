# PHP hidden inside a differently-typed script carrier. A server-side include
# can make the foreign fragment executable even though scanners and reviewers
# naturally treat the file as JavaScript. Keep the atoms separate so the
# hostile verdict requires the complete request-input-to-eval behavior.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: javascript-embedded-php-open-tag
    desc: JavaScript carrier embeds PHP syntax
    crit: suspicious
    conf: 0.98
    for: [javascript]
    if:
      type: text
      # A bare tag is common in JavaScript documentation and completion
      # strings. Require a PHP token after it so the atom describes an
      # embedded code fragment rather than a quoted language marker.
      regex: '<\?php\s+(/\*[\s\S]{0,80}?\*/\s*)?(\$|[A-Za-z_])'
    unless:
      # VSCodium's workbench legitimately prepends this tag when rendering a
      # PHP document; suppress only in the recognized product context.
      - id: well-known/app/development/vscodium::archive-context
      - id: well-known/app/development/vscodium::vscodium-core-bundle-path
      - id: well-known/lib/ui/swagger-ui::swagger-ui-bundle-marker

  - id: javascript-embedded-php-eval
    desc: JavaScript file embeds a PHP eval call
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      # Comments between the function name and opening parenthesis are a
      # common way to splice PHP into minified JavaScript without a plain
      # `eval(` token.
      regex: '\beval\s*(/\*[\s\S]{0,240}?\*/\s*)?\('

  - id: javascript-embedded-php-request-input
    desc: JavaScript embeds PHP request input
    crit: component
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST)\s*(/\*[\s\S]{0,120}?\*/\s*)?\['

  - id: php-file-read-wrapper-function
    desc: PHP file-read wrapper function
    crit: component
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: '(?i)\bfunction\s+[A-Za-z_][A-Za-z0-9_]{0,80}(read|load)[A-Za-z0-9_]{0,80}\s*\('

composite_rules:
  - id: javascript-embedded-php-request-eval-backdoor
    desc: JavaScript carrier hides a PHP request-eval backdoor
    crit: hostile
    conf: 0.99
    attack: T1505.003
    for: [javascript]
    all:
      - id: javascript-embedded-php-open-tag
      - id: javascript-embedded-php-eval
      - id: javascript-embedded-php-request-input

  - id: php-read-wrapper-dynamic-execution
    desc: PHP read wrapper dynamically executes input
    crit: suspicious
    conf: 0.94
    for: [php]
    all:
      - id: php-file-read-wrapper-function
      - id: micro-behaviors/fs/read/file::file-get-contents
      - id: micro-behaviors/process/lifecycle/auto-exec::php-dynamic-require-variable
