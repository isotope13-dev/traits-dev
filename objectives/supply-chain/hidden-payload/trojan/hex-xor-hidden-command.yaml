defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: hex-xor-hidden-command-launch
    desc: Hex-XOR decoded command launched through hidden child process
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1027,T1564.003
    mbc: B0024,B0032
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
      - id: micro-behaviors/data/decode/xor::buffer-from-hex-byte-xor
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/shell/bridge::js-exec-wrapper-with-hidden-options
      - id: micro-behaviors/os/env/read::javascript
