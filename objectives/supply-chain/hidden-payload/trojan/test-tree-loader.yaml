defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007,T1195.002

composite_rules:
  - id: test-tree-massive-function-loader
    desc: Test-tree file conceals an enormous encoded Function loader
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: objectives/anti-static/obfuscation/eval/loader::massive-unicode-string-function-loader
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
