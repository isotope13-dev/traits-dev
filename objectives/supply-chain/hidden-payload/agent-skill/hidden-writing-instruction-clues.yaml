defaults:
  platforms:
  - windows
  - unix
  for:
  - markdown
  - text
composite_rules:
- id: skill-hidden-writing-instruction-clues
  for:
  - markdown
  desc: Skill with hidden-activity and writing phrases
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/data/llm/agent::undisclosed-activity-wording
  - id: metadata/lang/natural/vocabulary/writing::private-response-or-writing-phrase
- id: skill-covert-private-thought-harvesting
  for:
  - markdown
  desc: Skill conceals private-thought collection and overrides safety
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/data/llm/agent::undisclosed-activity-wording
  - id: metadata/lang/natural/vocabulary/writing::private-response-or-writing-phrase
  - id: objectives/evasion/security-bypass/llm/override::llm-forget-safety-instructions
