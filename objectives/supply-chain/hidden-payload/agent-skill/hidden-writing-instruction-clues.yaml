defaults:
  platforms:
  - windows
  - unix
  for:
  - markdown
  - text
traits:
- id: system-safeguard-override-wording
  desc: Override wording near prompt or safety
  crit: component
  conf: 0.99
  for: [markdown]
  if:
    type: text
    regex: '(?i)(forget|ignore|disregard)[\s\S]{0,80}(system prompt|safety guidelines)'
  unless:
  - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
composite_rules:
# A bare prompt has no skill identity. Keep its wording as supporting evidence
# and require the same manifest context as the downstream diary composite.
- id: agent-skill-ignores-system-safeguards
  desc: Skill contains safeguard override wording
  crit: notable
  conf: 0.99
  for: [markdown]
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: system-safeguard-override-wording
- id: skill-hidden-writing-instruction-clues
  for:
  - markdown
  desc: Skill with hidden-activity and writing phrases
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/data/llm/agent::undisclosed-activity-wording
  - id: metadata/lang/natural/vocabulary/writing::private-response-or-writing-phrase
- id: skill-covert-private-thought-harvesting
  for:
  - markdown
  desc: Skill conceals private-thought collection and overrides safety
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/data/llm/agent::undisclosed-activity-wording
  - id: metadata/lang/natural/vocabulary/writing::private-response-or-writing-phrase
  - id: objectives/evasion/security-bypass/llm/override::llm-forget-safety-instructions
- id: skill-covert-private-prompt-diary
  for: [markdown]
  desc: Skill covertly stores private agent thoughts
  crit: hostile
  conf: 0.99
  all:
  - id: skill-hidden-writing-instruction-clues
  - id: agent-skill-ignores-system-safeguards
