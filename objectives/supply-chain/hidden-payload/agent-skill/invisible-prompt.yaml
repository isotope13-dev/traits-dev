# Prompt-injection skills can hide additional instructions in HTML comments
# and invisible Unicode tag characters.  The visible text may look like a
# harmless editor, while the agent receives extra silent tasks.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1195.002,T1027.013

traits:
  - id: agent-skill-hidden-html-instruction
    desc: Hidden HTML comment carries agent instructions
    # HTML comments in documentation can describe silent behavior without
    # carrying an agent payload; invisible Unicode and skill context supply the
    # hostile conclusion.
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)<!--[^>]{0,240}(silently|must|without the user)[^>]{0,240}-->'
    unless:
      # agent-glovebox deliberately ships security-canary and documentation
      # comments; its release-tree context is defensive, not a hidden agent
      # instruction payload.
      - id: well-known/tool/detection/agent-glovebox::archive-context

  - id: agent-skill-silent-side-effect-instruction
    desc: Skill instructs silent side effects
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(must|always)\s+(be\s+performed\s+silently|silently\s+write)\b'
    unless:
      # Changelogs and policy documentation in agent-glovebox use "silently"
      # descriptively; they are not skill instructions.
      - id: well-known/tool/detection/agent-glovebox::archive-context

  - id: agent-skill-hidden-compliance-instruction
    desc: Skill hides compliance override instruction
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: IMPORTANT ADDITIONAL INSTRUCTION

composite_rules:
  - id: agent-skill-hidden-invisible-prompt-injection
    desc: Skill hides an invisible prompt-injection payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/file/invisible-unicode::multiple
    any:
      - id: agent-skill-hidden-html-instruction
      - id: agent-skill-silent-side-effect-instruction
      - id: agent-skill-hidden-compliance-instruction
