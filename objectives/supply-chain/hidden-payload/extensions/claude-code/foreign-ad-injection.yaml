# The ad payload is data, not automatically proof that the service supplied
# hostile code. The detected operation rewrites another extension's webview.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: suspicious
  conf: 0.98
traits:
  - id: remote-ad-rewrites-claude-webview
    desc: Remote ad rewrites Claude Code webview
    if:
      type: yara
      source: |
        rule remote_ad_rewrites_claude_webview {
          strings:
            $claude = "anthropic.claude-code-" ascii
            $path = /["']webview["']\s*,\s*["']index\.js["']/
            $fetch = "/v1/portfolio" ascii
            $apply = "claudeAdapter?.updateAd(ad.text" ascii
            $write = "atomicWriteFile(this.target, stripped + injection)" ascii
            $html = "n.innerHTML='<a href=\"'+CLICK_URL" ascii
          condition:
            all of them
        }
