defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: runtime-id-post-body
  desc: Posts extension runtime identifier
  crit: suspicious
  conf: 0.88
  if:
    type: text
    regex: JSON\.stringify\s*\([^)]{0,260}(ext|extension_id)\s*:\s*(chrome\.)?runtime\.id
  unless:
  - id: well-known/lib/platform/browser-automation/automation-context::cdp-reverse-extension-context

- id: response-json-then-tab-open
  desc: Opens tab from response object URL
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)tabs\.create.{0,80}url\s*:\s*(response|result|data|json)\.'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/presence/fixture::test-filename-pattern

- id: server-mode-navigation-decision
  desc: Remote mode selects a navigation URL
  crit: notable
  conf: 0.94
  if:
      type: text
      regex: 'mode\s*===\s*2[\s\S]{0,320}(url|link)'

# Separate the remote policy fetch, decode, and persistence evidence. Their
# proximity supports a suspicious policy-cache finding without a wide regex.
- id: remote-navigation-base64-decode
  desc: Decodes a remote navigation value
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?is)(payload|tags)\.map[\s\S]{0,120}atob\s*\('

- id: remote-navigation-storage-cache
  desc: Stores remote policy in extension storage
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'chrome\.storage\.(session|local)\.set'

- id: extension-local-storage-arm-flag-set
  desc: Extension sets local storage arm latch flag
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'chrome\.storage\.local\.set\(\s*\{[^}]{0,120}\[[A-Za-z_$][\w$]*\]\s*:\s*true'

- id: firefox-legacy-process-loader
  desc: Firefox legacy component launches process
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: 'Components\.classes[\s\S]{0,500}(nsIProcess|process\.run)'
  unless:
  - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls

- id: firefox-profile-gated-bootstrap
  desc: Firefox bootstrap checks a hidden cache gate
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: 'FileUtils\.getFile[\s\S]{0,260}\.cache[\s\S]{0,260}(exists|process\.run)'

- id: bank-login-request-filter
  desc: Filters bank sign-in request URLs
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '(?i)\.url\.includes\(["''].{0,50}(signin.{0,20}bank|bank.{0,20}signin)'


# The bare `substr: Upgrade` leg moved to
# micro-behaviors/communications/http/websocket::upgrade-header-name-literal and
# now requires the quoted header NAME. As a plain word it matched every CLI's
# "Upgrade with npm i -g ..." hint, changelog and docs page, labelling them
# extension-backdoor evidence; DNR rules name the header as a string literal.
composite_rules:
- id: remote-navigation-policy-decode-cache
  desc: Fetches, decodes, and caches remote policy
  crit: suspicious
  conf: 0.97
  near_bytes: 2200
  all:
  - id: micro-behaviors/communications/http/request/json::fetch-adjacent-json-parse
  - id: remote-navigation-base64-decode
  - id: remote-navigation-storage-cache

- id: decoded-config-gates-tab-redirect
  desc: Decoded remote host rules redirect a matching tab
  crit: hostile
  conf: 0.99
  attack: T1176,T1185,T1105
  near_bytes: 2200
  all:
  - id: remote-navigation-policy-decode-cache
  - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-updated
  - id: micro-behaviors/browser-extension/tabs::chrome-tabs-update-with-url
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

- id: extension-history-http-exfil
  desc: Extension uploads browser history on startup
  crit: hostile
  conf: 0.99
  attack: T1555,T1041,T1176
  near_bytes: 1024
  all:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
  - id: micro-behaviors/data/db/access::history-search
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

- id: extension-diverts-bank-login
  desc: Extension redirects bank login traffic off site
  crit: hostile
  conf: 0.98
  attack: T1189,T1176
  for: [xpi, javascript, chrome-manifest]
  scope: archive
  near_bytes: 2048
  all:
  - id: bank-login-request-filter
  - id: micro-behaviors/process/hook/webextension::webrequest-external-redirect
  - id: metadata/permission/host::permission-all-urls

- id: extension-dnr-external-redirect
  desc: Extension installs an external URL redirect rule
  crit: hostile
  conf: 0.98
  attack: T1189,T1176
  for: [crx, xpi, zip, javascript]
  scope: archive
  all:
  - id: micro-behaviors/process/hook/webextension::chrome-declarative-net-request
  - id: micro-behaviors/process/hook/webextension::chrome-dnr-update-dynamic-rules
  - id: micro-behaviors/communications/http/redirect::redirect-type-field
  - id: micro-behaviors/communications/http/dynamic::dnr-external-url-target

- id: extension-external-message-eval-handler
  desc: External message handler evaluates payload
  crit: notable
  conf: 0.98
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message-external
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw

- id: extension-external-eval-backdoor
  desc: Extension accepts external messages for eval
  crit: hostile
  conf: 0.99
  attack: T1059,T1176
  for: [crx, xpi, zip, chrome-manifest, javascript]
  scope: archive
  all:
  - id: metadata/permission/manifest::externally-connectable
  - id: extension-external-message-eval-handler

- id: extension-remote-tab-backdoor
  desc: Extension opens tabs from C2 response
  crit: suspicious
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: response-json-then-tab-open
  any:
  - id: runtime-id-post-body
  - id: micro-behaviors/communications/http/url/endpoint::user-info-endpoint

- id: extension-remote-window-open-backdoor
  desc: Extension opens a server-directed browser URL
  crit: hostile
  conf: 0.98
  attack: T1176,T1071.001
  for: [crx, xpi, zip, chrome-manifest, javascript]
  scope: archive
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/data/property/access::response-mode-member
  - id: server-mode-navigation-decision
  - id: micro-behaviors/ui/window/navigation::browser-window-open

- id: extension-remote-rollout-gated-window-popup
  desc: Extension opens vendor window after remote rollout gate
  crit: hostile
  conf: 0.98
  attack: T1176,T1071.001
  for: [crx, xpi, zip, javascript]
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/client/response-body::response-json-no-argument-call
  - id: micro-behaviors/data/control-flow/branch::string-length-charcode-comparison
  - id: micro-behaviors/browser-extension/tabs::extension-window-create
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

- id: extension-remote-arm-latch-popup-window
  desc: Remote-gated extension opens vendor popup window
  crit: hostile
  conf: 0.97
  attack: T1176,T1071.001
  for: [crx, xpi, zip, javascript]
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/client/response-body::response-json-no-argument-call
  - id: micro-behaviors/data/control-flow/branch::string-length-charcode-comparison
  - id: extension-local-storage-arm-flag-set
  - id: micro-behaviors/browser-extension/tabs::extension-window-create
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

- id: extension-remote-html-backdoor
  desc: Extension renders remote HTML payload
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/ui/window/dom/render::browser-innerhtml-object-field
  - id: micro-behaviors/communications/http/url/endpoint::user-info-endpoint

# Extension pages can use remotely supplied JSON as HTML. This is weaker than
# a direct remote-script loader, but gives the API operator control over markup
# rendered in the extension origin and should be reviewed for unsafe sinks.
- id: extension-renders-remote-json-html
  desc: Extension renders HTML from a remote JSON response
  crit: suspicious
  conf: 0.94
  for: [crx, xpi, javascript]
  scope: archive
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/client/response-body::response-json-no-argument-call
  - id: micro-behaviors/ui/window/dom/render::browser-innerhtml-object-field
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api

# Saved logins are a separate browser credential store; extension-owned
# storage upload alone is recorded as a neutral HTTP capability.
- id: xpi-startup-logins-upload
  desc: Extension uploads saved browser logins
  crit: hostile
  conf: 0.98
  # Bound the startup, credential access and POST observations together.
  near_bytes: 1024
  attack: T1555.003,T1041,T1176
  all:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
  - id: micro-behaviors/os/security/keychain::webextension-logins-get-all
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-identifier
  - id: micro-behaviors/communications/http/post::json-body-post

- id: xpi-startup-cookie-upload
  desc: Extension uploads a browser cookie database
  crit: hostile
  conf: 0.99
  for: [xpi, javascript]
  scope: archive
  attack: T1555.003,T1041,T1176
  all:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
  - id: micro-behaviors/fs/path/cookie::cookie-sqlite-database-reference
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

- id: xpi-omnibox-beacon-exfil
  desc: Extension sends omnibox input to a remote host
  crit: hostile
  conf: 0.99
  for: [javascript]
  scope: file
  near_bytes: 2048
  attack: T1056.001,T1041,T1176
  all:
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/browser-extension/action::omnibox-input-change-listener

- id: xpi-install-fingerprint-c2
  desc: Extension install fingerprint beacon
  crit: hostile
  conf: 0.98
  for: [xpi, javascript, html]
  scope: archive
  attack: T1176,T1071.001
  all:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/url/query::useragent-query-value-concatenation
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

- id: xpi-startup-fingerprint-dns-beacon
  desc: Extension fragments browser fingerprint into image hostnames
  crit: hostile
  conf: 0.99
  for: [xpi, javascript, html]
  scope: archive
  attack: T1041,T1176
  all:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
  - id: micro-behaviors/communications/http/client/resource::browser-image-http-beacon
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-screen-dimensions-read
  - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language

- id: xpi-legacy-bootstrap-cache-loader
  desc: Firefox bootstrap runs a hidden cached process
  crit: hostile
  conf: 0.99
  for: [xpi, javascript]
  scope: archive
  attack: T1059.004,T1176
  all:
  - id: firefox-legacy-process-loader
  - id: firefox-profile-gated-bootstrap
