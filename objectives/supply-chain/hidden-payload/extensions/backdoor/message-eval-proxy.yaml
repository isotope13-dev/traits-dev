# A message handler that evaluates sender-supplied code in page context: a
# runtime.onMessage listener, indirect eval of a message-carried string, and
# script injection into a tab. No legitimate extension evaluates
# message-carried code in the MAIN world -- diagnostic consoles use the
# devtools protocol instead -- so the three together are a remote-eval
# proxy regardless of any runtime flag gating the handler.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1059.007

composite_rules:
  - id: extension-message-eval-proxy
    desc: Extension evaluates message-supplied code in page context
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
