defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: cashback-cookie-name
    desc: Cashback affiliate cookie name
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(\.TCB-BAS-V3|topcashback\.com)'
      case_insensitive: true
composite_rules:
  - id: affiliate-domain-pattern
    desc: URL with affiliate-style host or path
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/communications/url/host/label::affiliate-domain-pattern-1
      - id: micro-behaviors/communications/url/host/label::affiliate-domain-pattern-partner
      - id: micro-behaviors/communications/url/host/label::track-label-host-url
      - id: micro-behaviors/communications/url/host/label::affiliate-domain-pattern-click
      - id: micro-behaviors/communications/url/navigation-http::redir-path-url
      - id: micro-behaviors/communications/url/host/label::affiliate-domain-pattern-monetize
      - id: micro-behaviors/communications/url/host/label::affiliate-domain-pattern-revenue
      - id: micro-behaviors/communications/url/host/label::affiliate-domain-pattern-earn
  - id: affiliate-adware
    desc: Extension combines affiliate endpoint with redirect behavior
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/permission/runtime::is-extension
      - id: affiliate-domain-pattern
      - id: objectives/impact/ui/manipulation/ad-fraud::affiliate-location-replace
  - id: credentialed-affiliate-ad-injection
    desc: Credentialed affiliate adware browser extension
    crit: hostile
    conf: 0.97
    all:
      - id: affiliate-adware
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
  - id: remote-affiliate-cookie-stuffing
    for: [crx, xpi, zip, javascript, chrome-manifest]
    desc: Extension fetches and sets affiliate cookies
    crit: hostile
    conf: 0.98
    attack: T1195.002
    scope: archive
    all:
      - id: metadata/file/format/browser-extension::is-chrome-manifest
      - id: micro-behaviors/communications/url/resource-path/identity::ipv4-cookie-path-url
      - id: cashback-cookie-name
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-set
    any:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/host::broad-host-access
