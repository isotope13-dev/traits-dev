defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: affiliate-domain-pattern-1
    desc: Affiliate keyword domain
    crit: notable
    conf: 0.8
    # Require a URL/host context (matching the click/redir siblings) so member
    # access like `affiliate.method` (a property, not a hostname) does not match.
    if:
      type: string_literal
      regex: '(https?://|//|www\.)[^\s"'']{0,80}\baffiliate\.[a-z]{2,6}\b'
      case_insensitive: true
    not:
      - regex: \.(catch|then|finally)\b
      - regex: \.(call|apply|bind)\b
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: affiliate-domain-pattern-partner
    desc: Partner keyword domain
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(https?://|//|www\.)[^\s"'']{0,80}\bpartner\.[a-z]{2,6}\b'
      case_insensitive: true
    not:
      - regex: \.(catch|then|finally)\b
      - regex: \.(call|apply|bind)\b
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: affiliate-domain-pattern-click
    desc: Click keyword domain
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(https?://|//|www\.)[^\s"'']{0,80}\bclick\.[a-z]{2,6}\b'
      case_insensitive: true
    not:
      - regex: \.(catch|then|finally)\b
      - regex: \.(call|apply|bind)\b
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: affiliate-domain-pattern-monetize
    desc: Monetize keyword affiliate domain
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: 'https?://[^\s"'']{0,80}\bmonetize\.[a-z]{2,6}\b'
      case_insensitive: true
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: affiliate-domain-pattern-revenue
    desc: Revenue keyword affiliate domain
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: 'https?://[^\s"'']{0,80}\brevenue\.[a-z]{2,6}\b'
      case_insensitive: true
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: affiliate-domain-pattern-earn
    desc: Earn keyword affiliate domain
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: 'https?://[^\s"'']{0,80}\bearn\.[a-z]{2,6}\b'
      case_insensitive: true
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: cashback-cookie-name
    desc: Cashback affiliate cookie name
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(\.TCB-BAS-V3|topcashback\.com)'
      case_insensitive: true
composite_rules:
  - id: affiliate-domain-pattern
    desc: Affiliate tracking domain
    crit: notable
    conf: 0.75
    any:
      - id: affiliate-domain-pattern-1
      - id: affiliate-domain-pattern-partner
      - id: micro-behaviors/communications/url/host/label::track-label-host-url
      - id: affiliate-domain-pattern-click
      - id: micro-behaviors/communications/url/http-path::redir-path-url
      - id: affiliate-domain-pattern-monetize
      - id: affiliate-domain-pattern-revenue
      - id: affiliate-domain-pattern-earn
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: affiliate-adware
    desc: Extension combines affiliate endpoint with redirect behavior
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/permission/runtime::is-extension
      - id: affiliate-domain-pattern
      - id: objectives/impact/ui/manipulation/traffic::affiliate-location-replace
  - id: credentialed-affiliate-ad-injection
    desc: Credentialed affiliate adware browser extension
    crit: hostile
    conf: 0.97
    all:
      - id: affiliate-adware
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
  - id: remote-affiliate-cookie-stuffing
    for: [crx, xpi, zip, javascript, chrome-manifest]
    desc: Extension fetches and sets affiliate cookies
    crit: hostile
    conf: 0.98
    attack: T1195.002
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: micro-behaviors/communications/url/http-path::ipv4-cookie-path-url
      - id: cashback-cookie-name
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-set
    any:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/host::broad-host-access
