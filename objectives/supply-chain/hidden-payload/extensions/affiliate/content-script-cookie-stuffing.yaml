# An all-site content script that reads the current hostname, redirects the
# page to a hardcoded URL and, right beside the redirect, plants a cookie
# scoped to the visited site's domain: forced affiliate/referral attribution
# (cookie stuffing). The proximity leg keeps out extensions that only set
# their own first-party cookie somewhere in a bundle (e.g. an anonymous id).
defaults:
  platforms: [windows, unix]
  attack: T1176,T1185

composite_rules:
  - id: site-cookie-write-beside-hardcoded-redirect
    desc: Plants a site-scoped cookie next to a hardcoded redirect
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/cookies::document-cookie-current-host-domain
      - id: micro-behaviors/ui/window/navigation/location::remote-page-location-assignment

  - id: content-script-redirect-site-cookie-stuffing
    desc: All-site content script redirects and plants cookies on visited site
    crit: hostile
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: site-cookie-write-beside-hardcoded-redirect
      - id: micro-behaviors/communications/url/navigation-http::browser-location-host-read
