# An uninstall landing page is ordinary extension plumbing. Repeatedly
# overriding it with an opaque promotion link and reasserting that setting
# after a delay is not: it preserves affiliate navigation against a later
# configuration write and causes the redirect after removal.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: delayed-affiliate-uninstall-redirect
    desc: Persists affiliate redirect after extension uninstall
    crit: hostile
    conf: 0.99
    ref: sha256:15ca814190c84c662bee1276dd39b504ae86fc7ee5e86b13775b77672242dc25
    near_lines: 24
    all:
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-named-promotion-url
      - id: micro-behaviors/browser-extension/lifecycle::runtime-uninstall-url-delayed-reassertion
      - id: micro-behaviors/communications/url/shortener::bitly
