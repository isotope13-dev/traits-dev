defaults:
  platforms:
    - unix
    - windows
traits:
  - id: amazon-link-discovery
    desc: Selects Amazon product-link URLs
    crit: notable
    conf: 0.8
    for:
      - javascript
      - typescript
    if:
      type: literal
      regex: 'a\[href\*="/(dp|gp/product)/"\]'
composite_rules:
  - id: affiliate-hijacking
    desc: Intercepts and rewrites affiliate links
    crit: hostile
    conf: 0.95
    all:
      - id: amazon-link-discovery
      - id: micro-behaviors/communications/http/url/query::query-parameter-mutation
      - id: micro-behaviors/ui/window/manage/dom::browser-link-href-assignment
    any:
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::affiliate-tag-constant
      - id: objectives/supply-chain/hidden-payload/extensions/affiliate::tag-param-literal
