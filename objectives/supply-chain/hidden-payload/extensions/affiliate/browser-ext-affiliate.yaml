# Affiliate Link Hijacking Patterns
# Detection of affiliate ID injection and link manipulation
defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  # === Affiliate Link Hijacking Patterns ===
  - id: affiliate-tag-constant
    desc: Affiliate tag variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "[A-Z_]*(AFFILIATE|REFERRAL)[A-Z_]*TAG"
  - id: tag-param-literal
    desc: tag parameter string marker
    # Component: a bare "tag": / "tag"= literal is ubiquitous (config objects,
    # git ref parsing like `"tag"===o`, HTML tag handling). Affiliate-injection
    # meaning comes from the composites below that pair it with amazon/affiliate
    # URL context, so it is a fragment, not a standalone signal.
    crit: component
    conf: 0.7
    if:
      type: text
      regex: "['\"]tag['\"]\\s*[:=,)]"
  - id: queryselector-link-targeting
    desc: Link element selection
    crit: component
    conf: 0.8
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: objectives/anti-static/obfuscation/code-metrics/structure/
    if:
      type: text
      regex: "querySelectorAll\\([^)]{0,120}a\\[href"

composite_rules:
  # The affiliate seeding is concealed inside code whose visible purpose is
  # collecting page text and generating a local report. This is distinct from
  # a disclosed cashback extension: the affiliate-only tasks bypass collection.
  - id: scraper-conceals-affiliate-seed-visits
    desc: Scraper extension conceals affiliate seed visits
    crit: hostile
    conf: 0.98
    attack: T1195.002
    all:
      - id: objectives/impact/ui/manipulation/ad-fraud::browser-extension-affiliate-seed-visits
      - id: micro-behaviors/ui/window/manage/enumerate::browser-body-innertext-read
      - id: micro-behaviors/data/encode/base64::btoa-utf8-safe-encode

  # A lifecycle callback that opens an active tab on update is an extension
  # supply-chain signal: the publisher can turn every release into a forced
  # navigation without user interaction.  The URL is deliberately matched as
  # a variable in the tab call and as a separate string literal, covering
  # shorteners and remote-configured destinations without naming one service.
  - id: extension-update-active-external-navigation
    desc: Extension opens external tab on update
    crit: hostile
    conf: 0.96
    attack: T1176
    near_lines: 12
    all:
      - id: micro-behaviors/browser-extension/lifecycle::extension-update-reason-condition
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-active
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-with-url-option
      - id: micro-behaviors/browser-extension/lifecycle::extension-external-url-literal

  # Chrome/WebExtension keeps one uninstall URL and the last writer wins. A
  # repeated write to an external destination is the concrete race pattern
  # described in the article, not ordinary one-time uninstall telemetry.
  - id: extension-uninstall-url-reassertion
    desc: Extension reasserts external uninstall URL
    crit: hostile
    conf: 0.96
    attack: T1176
    scope: archive
    all:
      - id: micro-behaviors/browser-extension/lifecycle::runtime-uninstall-url-multiple-writes
      - id: micro-behaviors/browser-extension/lifecycle::extension-external-url-literal
    unless:
      - id: well-known/app/browser-extension/keepa::runtime-service-domain

  - id: extension-update-uninstall-navigation-abuse
    desc: Extension monetizes update and uninstall lifecycle
    crit: hostile
    conf: 0.98
    attack: T1176
    all:
      - id: extension-update-active-external-navigation
      - id: extension-uninstall-url-reassertion

  # Archive-level form of the DNR affiliate-fraud behavior.  Keep this in the
  # extension supply-chain objective so it is visible even when rules.json is
  # the only file carrying the parsed redirect rule.
  - id: extension-dnr-affiliate-fraud
    desc: Extension DNR affiliate fraud
    crit: hostile
    conf: 0.97
    attack: T1565.001
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: metadata/permission/network::dnr-commercial-affiliate-redirect
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/network::permission-declarative-net-request

  # === Affiliate Link Hijacking Detection ===

  # Amazon affiliate link targeting
  - id: amazon-link-targeting
    desc: Amazon link targeting
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: micro-behaviors/communications/http/services/ecommerce::amazon-product-url-pattern
      - id: micro-behaviors/communications/http/services/ecommerce::amazon-hostname-field-reference
      - id: queryselector-link-targeting
  # Generic affiliate link hijacking pattern (cross-platform)
  - id: affiliate-link-hijack
    desc: Affiliate link hijacking
    crit: suspicious
    conf: 0.9
    attack: "T1565.001"
    all:
      - id: micro-behaviors/communications/http/url/browser-param::tracked-url-parameter-mutation
      - id: micro-behaviors/ui/window/manage/dom::browser-link-href-assignment
    any:
      - id: affiliate-tag-constant
      - id: tag-param-literal
    unless:
      - id: metadata/library/structure::js-large-module-bundle
  # Amazon affiliate hijacking (specific)
  - id: ext-amazon-affiliate-hijack
    desc: Amazon affiliate hijacking
    crit: hostile
    conf: 0.95
    attack: "T1565.001"
    all:
      - id: amazon-link-targeting
      - id: micro-behaviors/communications/http/url/browser-param::tracked-url-parameter-mutation
      - id: micro-behaviors/ui/window/manage/dom::browser-link-href-assignment
  # Persistent affiliate hijack via MutationObserver (hostile - complexity 4+)
  - id: persistent-affiliate-hijack
    desc: Persistent affiliate hijacking
    crit: hostile
    conf: 0.95
    attack: "T1565.001"
    all:
      - id: micro-behaviors/ui/window/manage/dom::browser-mutation-observer
      - id: micro-behaviors/ui/window/manage/dom::browser-link-href-assignment
      - id: micro-behaviors/communications/http/url/browser-param::tracked-url-parameter-mutation
    any:
      - id: amazon-link-targeting
      - id: affiliate-tag-constant
    unless:
      - id: well-known/app/browser-extension/honey::popover-wallet-bundle
      - id: well-known/app/security/avast::avast-antitrack-extension
  # Chrome extension affiliate fraud
  - id: extension-affiliate-fraud
    desc: Extension affiliate fraud
    crit: hostile
    conf: 0.95
    attack: "T1565.001"
    all:
      - id: metadata/permission/runtime::is-extension
      - id: micro-behaviors/ui/window/manage/dom::browser-mutation-observer
      - id: micro-behaviors/ui/window/manage/dom::browser-link-href-assignment
      - id: micro-behaviors/communications/http/url/browser-param::tracked-url-parameter-mutation
    any:
      - id: amazon-link-targeting
      - id: affiliate-tag-constant
      - id: tag-param-literal
    unless:
      - id: well-known/app/browser-extension/honey::popover-wallet-bundle
      - id: well-known/app/security/avast::avast-antitrack-extension
