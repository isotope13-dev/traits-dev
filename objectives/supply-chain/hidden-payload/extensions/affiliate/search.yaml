defaults:
  platforms: [linux, macos, windows]
  for: [json, chrome-manifest]

traits:
  - id: search-admin-link-endpoint
    desc: Search admin redirect endpoint
    crit: notable
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '/admin/public/link\?q=\{searchTerms\}'
      case_insensitive: true
  - id: search-api-service-host
    desc: Search middleware service host
    crit: notable
    conf: 0.86
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: 'https?://[^/"'']*\bsearch[^/"'']*(-api|-svc)\b'
      case_insensitive: true
  - id: extension-affiliate-query-parameter
    desc: Affiliate query parameter
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      substr: affiliate=
      case_insensitive: true
  - id: thankyou-searchutil-config-extra-poll
    desc: Polls searchutil.config.extra on thankyou page
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)searchutil\.config\.extra[\s\S]{0,250}ty_params'
  - id: extension-affid-query-parameter
    desc: Affiliate ID query parameter
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      substr: affid=
      case_insensitive: true
  - id: extension-pubid-query-parameter
    desc: Publisher ID query parameter
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      substr: pubid=
      case_insensitive: true
  - id: extension-partner-query-parameter
    desc: Affiliate partner query parameter
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      substr: partner=
      case_insensitive: true
  - id: extension-subid-query-parameter
    desc: Affiliate sub-ID query parameter
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      substr: subid=
      case_insensitive: true
  - id: runtime-search-direct-query-assignment
    desc: Direct search query URL assignment
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'window\.location\s*=\s*["'']https?://[^"'']{1,180}[?&](q|query|keyword|search)='
      case_insensitive: true
    unless:
      # Bookmarklet documentation spells the redirect inside a link the user
      # clicks — the GoDoc bookmarklet on godoc.org's about page, for one.
      # The runtime hijack claim needs the assignment in script flow, not
      # behind a visible href.
      - id: micro-behaviors/communications/url/scheme::javascript-href-location-assignment
  - id: runtime-search-query-field-navigation
    desc: Search field drives external navigation
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      regex: '\bq\s*[:=][\s\S]{0,150}window\.location\s*=\s*["'']https?://'
      case_insensitive: true
  - id: runtime-search-tracking-parameter
    desc: Query object carries a tracking identifier
    # Match two object properties, not a minified export such as `{q:()=>i}`
    # followed by an unrelated Sentry client reference. The hostile search-
    # redirect interpretation belongs to the new-tab composites below.
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      regex: '\{\s*q\s*:[^,}]{1,120},\s*[a-z_-]*(uid|client|install|click)(id|_id)?\s*:'
      case_insensitive: true
  - id: runtime-search-q-input-value
    desc: Runtime search q input value read
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      regex: '\$\(["'']#q["'']\)\.val\(\)'
  - id: runtime-search-affiliate-param
    desc: Runtime navigation affiliate parameter
    crit: suspicious
    conf: 0.88
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    if:
      type: text
      regex: '(?is)window\.location.{0,220}https?://[^"''\s]{1,160}[?&](affiliate|affid|pubid)='
      case_insensitive: true
  # Traffic-source attribution on the query itself: `ref=`, `src=`, `from=`,
  # `clid=`. The destination needs to know the search arrived from the
  # extension rather than from the site, because that is what the placement is
  # paid on. A search engine answering its own users has no reason to ask.
  - id: manifest-ui-action-or-override-field
    desc: Manifest declares UI action or override
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '"(action|browser_action|page_action|chrome_url_overrides)"\s*:'
  - id: manifest-auxiliary-surface-field
    desc: Manifest declares options or panel surface
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '"(options_ui|options_page|side_panel|devtools_page)"\s*:'

composite_rules:
  - id: extension-affiliate-tracking-parameter
    desc: Affiliate identifier URL parameter
    crit: component
    conf: 0.9
    any:
      - id: extension-affiliate-query-parameter
      - id: extension-affid-query-parameter
      - id: extension-pubid-query-parameter
      - id: extension-partner-query-parameter
      - id: extension-subid-query-parameter
  - id: runtime-search-query-redirect
    desc: Runtime search query redirect
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    any:
      - id: runtime-search-direct-query-assignment
      - id: runtime-search-query-field-navigation
  - id: google-branded-query-forwarding
    desc: Google-branded extension forwards search queries offsite
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/identity::chrome-search-provider-google-name
      - id: objectives/impact/ui/manipulation/traffic::browser-brand-search-provider-host
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-with-url-option
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: runtime-search-form-navigation
    desc: Runtime search form opens query URL
    crit: notable
    conf: 0.94
    # `browser-window-open` has no HTML spelling.
    for: [javascript, typescript]
    all:
      - id: runtime-search-q-input-value
      - id: micro-behaviors/communications/http/services/google::google-search-query-url
      - id: micro-behaviors/ui/window/navigation/open::browser-window-open
  - id: runtime-search-tracking-token
    desc: Runtime search tracking token
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [windows, unix]
    all:
      - id: micro-behaviors/communications/url/query/credential::token-query-parameter
      - id: runtime-search-query-redirect
  # extension-search-newtab-takeover: identical evidence to
  # extension-monetized-search-newtab-hijack below, which owns this detection --
  # its all: legs were the same three and every takeover any-leg was also a
  # hijack any-leg, so the two always fired together on one observation.
  # Deleted rather than merged; nothing referenced it.
  - id: extension-monetized-search-newtab-hijack
    desc: Monetized extension search and new tab hijacking
    # Declared default search plus a new-tab page with paid-search parameters
    # is the search-monetization PUP shape; it is disclosed in the manifest
    # and the user can change it back. Deception legs elsewhere raise it.
    crit: suspicious
    conf: 0.95
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, html]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/extension-api::search-url-query-template
    # Yahoo's hosted-search partner parameters (hspart/hsimp) on a
    # manifest-declared provider answering on the engine's own host are the
    # store-sanctioned shape of an honest, consented search extension -- the
    # same evidence the traffic objective carries as notable
    # (extension-default-search-affiliate-provider). A bare "search" token in
    # the provider host is true of every engine, honest ones included. Neither
    # belongs in a hostile conviction: the monetization legs below require
    # third-party sold-query parameters, an affiliate ID, or an intermediary
    # redirect endpoint instead.
    any:
      - id: metadata/permission/extension-api::search-monetization-query-param
      - id: metadata/permission/extension-api::search-source-query-param
      - id: micro-behaviors/communications/url/query/tracking::search-source-query-parameter
      - id: metadata/permission/extension-api::affiliate-partner-query-param
      - id: metadata/permission/extension-api::affiliate-id-query-param
      - id: metadata/permission/extension-api::affiliate-id-query-param-crx
      - id: search-admin-link-endpoint
      - id: search-api-service-host
      - id: objectives/impact/ui/manipulation/traffic::search-provider-redirect-endpoint
  - id: runtime-rewriting-search-hijack
    desc: Tracked affiliate search rewritten at runtime
    crit: hostile
    conf: 0.94
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: runtime-search-query-redirect
      - id: objectives/collection/activity/browser::extension-search-host-profile-telemetry
      - id: metadata/permission/extension-api::extension-default-search-affiliate-provider
      - id: metadata/permission/network::search-provider-rewrite-authority
    any:
      - id: metadata/permission/host::search-provider-host-permission
      - id: metadata/permission/host::query-provider-host-permission
      - id: metadata/permission/host::serp-provider-host-permission
      - id: search-admin-link-endpoint
      - id: search-api-service-host
      - id: metadata/permission/extension-api::search-provider-search-token

  # extension-search-monetization is scope: archive (for: [crx, xpi,
  # chrome-manifest, javascript]) and extension-persistent-lifecycle-tracking
  # is javascript-only -- neither can land on the same leaf node as this
  # rule's old bare `for: [json, chrome-manifest]`. Declare the container
  # type and pool by archive, like google-branded-query-forwarding above:
  # both legs arrive as inherited member findings.
  - id: tracked-search-monetization-extension
    desc: Search monetization extension with persistent tracking
    crit: hostile
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript]
    all:
      - id: objectives/impact/ui/manipulation/traffic::extension-search-monetization
      - id: objectives/collection/monitor/tracking::extension-persistent-lifecycle-tracking
    any:
      - id: search-admin-link-endpoint
      - id: search-api-service-host
      - id: metadata/permission/extension-api::search-provider-search-token

  # extension-persistent-lifecycle-tracking: identical evidence to
  # objectives/collection/monitor/tracking/browser-extension::extension-persistent-lifecycle-tracking,
  # which owns this detection -- deleted here rather than merged, since both
  # fired the same finding twice. Referenced above by its qualified id.

  - id: runtime-tracked-newtab-search-extension
    desc: Runtime tracked new tab search extension
    crit: hostile
    conf: 0.95
    attack: T1176
    platforms: [windows, unix]
    for: [crx, xpi, zip, scripts, html, json, chrome-manifest]
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: runtime-search-query-redirect
      - id: micro-behaviors/ui/controls/widget::jquery-search-input-value-read
    any:
      - id: micro-behaviors/communications/url/query/credential::token-query-parameter
      - id: runtime-search-affiliate-param
      - id: micro-behaviors/communications/url/query/tracking::search-source-query-parameter

  # MV3 search hijackers can install their redirect at runtime rather than
  # shipping a static ruleset.  Requiring the default-provider declaration,
  # remote DNR target, and install hook keeps this focused on a remotely
  # configured takeover and catches path-based search filters as well as q=.
  - id: remote-configured-search-dnr-hijacker
    desc: Remotely configured search DNR hijacker
    crit: hostile
    conf: 0.98
    attack: T1176,T1071.001,T1105
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/communications/http/intercept::declarative-net-request-update
      - id: micro-behaviors/communications/http/dynamic::dnr-main-frame-search-redirect
      - id: micro-behaviors/communications/http/dynamic::dnr-external-redirect-target
    # A filter on the extension's own configured search host only re-tags
    # queries its declared engine already receives; that is attribution.
    unless:
      - id: micro-behaviors/communications/http/dynamic::dnr-regex-filter-config-host

  - id: search-takeover-with-cws-popup-removal
    desc: Search provider override combined with forcible Chrome Web Store popup removal
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: objectives/evasion/security-bypass/policy/browser::cws-or-popup-tab-forcible-close

  - id: wim-gotohub-search-and-suggest-hijack
    desc: WIM search and suggest hijack funnel with gotohub homepage
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::chrome-search-provider-override
      - id: micro-behaviors/communications/http/url/api-path/route::wim-gotohub-uninstall-endpoint
      - id: micro-behaviors/communications/http/url/api-path/route::wim-v1-sug-endpoint

  - id: thankyou-localstorage-searchutil-attribution-harvest
    desc: Newtab extension harvests searchutil.config.extra attribution from thankyou page
    crit: hostile
    conf: 0.98
    attack: T1176
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: thankyou-searchutil-config-extra-poll
      - id: micro-behaviors/communications/http/services/analytics::extension-click-attribution-fields

  - id: dnr-regex-substitution-yahoo-affiliate-search-hijack
    desc: Default search override redirects queries to Yahoo affiliate URL via DNR
    crit: hostile
    conf: 0.99
    attack: T1176,T1185
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: micro-behaviors/communications/http/dynamic::yahoo-affiliate-regex-substitution
      - id: objectives/impact/ui/manipulation/traffic::runtime-search-dnr-hijack

  - id: code-free-pdf-brand-search-and-autocomplete-hijack
    desc: Code-free PDF brand search and autocomplete hijack
    crit: hostile
    conf: 0.98
    attack: T1176,T1036.005
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/activation::search-only-code-free-manifest
      - id: metadata/package/description/vertical::description-mentions-ilovepdf-brand
      - id: metadata/permission/extension-api::search-provider-query-endpoint
      - id: metadata/permission/extension-api::search-provider-querying-autocomplete-endpoint
