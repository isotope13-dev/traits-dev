defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1176,T1059.007
composite_rules:
  - id: remote-script-bootstrap-source
    desc: Concatenates and inserts remote script source
    crit: suspicious
    scope: file
    # A distant URL in an unrelated dependency or SVG namespace does not
    # establish that the inserted script loads from that URL.
    near_bytes: 1024
    all:
      - id: micro-behaviors/ui/window/insert-html::script-source-concatenated-vars
      - id: micro-behaviors/ui/window/insert-html::append-script-variable
      - id: micro-behaviors/communications/url/scheme::plaintext-http-path-reference
      - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
  - id: extension-all-sites-remote-script-bootstrap
    desc: Extension injects remote script on all sites
    crit: hostile
    conf: 0.98
    scope: archive
    for: [pe, crx, zip, chrome-manifest, javascript]
    all:
      - id: remote-script-bootstrap-source
      - id: metadata/permission/host::broad-content-script-matches
