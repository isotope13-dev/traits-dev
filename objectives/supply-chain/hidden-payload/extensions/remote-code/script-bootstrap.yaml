defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1176,T1059.007
traits:
  - id: script-source-concatenated-vars
    desc: Sets script source from variables
    crit: notable
    if:
      type: text
      regex: '(?i)\w+\.src\s*=\s*\w+\s*\+\s*\w+'
  - id: append-script-variable
    desc: Appends script variable to document
    crit: notable
    if:
      type: text
      regex: '(?i)\b\w+\.appendChild\s*\(\s*script\s*\)'
  - id: plaintext-script-origin
    desc: Code references plaintext HTTP origin
    crit: notable
    if:
      type: text
      regex: '(?i)http://[a-z0-9.-]+/[^"''\s]{1,80}'
composite_rules:
  - id: remote-script-bootstrap-source
    desc: Concatenates and inserts remote script source
    crit: suspicious
    scope: file
    all:
      - id: script-source-concatenated-vars
      - id: append-script-variable
      - id: plaintext-script-origin
      - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
  - id: extension-all-sites-remote-script-bootstrap
    desc: Extension injects remote script on all sites
    crit: hostile
    conf: 0.98
    scope: archive
    for: [pe, crx, zip, chrome-manifest, javascript]
    all:
      - id: remote-script-bootstrap-source
      - id: metadata/permission/host::broad-content-script-matches
