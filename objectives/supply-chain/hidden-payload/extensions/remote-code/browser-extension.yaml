defaults:
  platforms: [windows, unix]

composite_rules:
  - id: remote-extension-script-injection
    desc: Extension loads remote code into web pages
    crit: hostile
    conf: 0.97
    attack: T1176,T1059.007
    for: [crx, xpi, zip, archives]
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/process/inject/webextension::broad-content-script-injection
      - id: micro-behaviors/process/inject/webextension::extension-storage-script-injection
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
