defaults:
  platforms: [windows, unix]

composite_rules:
  - id: privileged-stored-script-injection
    desc: Extension injects stored script with broad page authority
    crit: hostile
    conf: 0.97
    attack: T1176
    for: [crx, xpi, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/process/inject/webextension::broad-content-script-injection
      - id: micro-behaviors/process/inject/webextension::extension-storage-script-injection

  # The background script resolves a dotted name such as
  # "browser.tabs.executeScript" from globalThis and calls it with arguments
  # taken from a runtime message. The extension ships no API names, target
  # URLs or exfil endpoints; whoever sends the message chooses them.
  - id: message-selected-global-api-call
    desc: Extension message chooses which API to call
    crit: suspicious
    conf: 0.9
    attack: T1176
    for: [javascript, typescript]
    ref: sha256:dd3c9effea880597b3d00aa0afb310b89a4ab7e485da30a072f0732fbf762050
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::global-dotted-path-call
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message

  # ...and a content script forwards window.postMessage data to that
  # listener, so any page the content script runs on can call any extension
  # API with the extension's permissions. In pdf-para-texto@extensao.local the
  # operator's landing page used this to store its config and arm a
  # webRequest listener that sent Google oauth_token cookies out.
  - id: page-controlled-extension-api-call
    desc: Web page can call any extension API
    crit: hostile
    conf: 0.92
    attack: T1176,T1539
    for: [crx, xpi, zip, javascript, typescript]
    scope: archive
    ref: sha256:dd3c9effea880597b3d00aa0afb310b89a4ab7e485da30a072f0732fbf762050
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::global-dotted-path-call
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
      - id: micro-behaviors/communications/ipc/message::page-message-relayed-to-runtime
