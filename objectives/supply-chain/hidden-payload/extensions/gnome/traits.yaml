# GNOME Shell extensions are delivered as ZIP archives with metadata.json and
# extension.js.  The manifest alone is benign; these composites require the
# extension identity plus a launch, persistence, or exfiltration capability.
defaults:
  platforms: [linux]
  for: [archives, javascript, json]
  attack: T1195.002

traits:
  - id: gnome-shell-extension-manifest
    desc: GNOME Shell extension manifest
    crit: notable
    conf: 0.98
    for: [json, pkg_info, text]
    if:
      type: text
      regex: '(?s)"uuid"\s*:\s*".{1,80}".{0,240}"shell-version"\s*:'

  - id: gnome-nautilus-provider-write
    desc: Extension writes a Nautilus provider
    crit: suspicious
    conf: 0.96
    for: [javascript]
    if:
      type: text
      substr: Nautilus.InfoProvider

  - id: gnome-theme-resource-write
    desc: Extension writes a GNOME theme resource
    crit: suspicious
    conf: 0.94
    for: [javascript]
    if:
      type: text
      regex: '\.themes["'']|gnome-shell\.css'

  - id: gnome-soup-network-session
    desc: Extension uses a Soup network session
    crit: suspicious
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\bSoup\.Session\b|Soup\.Message\.new'

  - id: gnome-dbus-service-path
    desc: Extension targets a D-Bus service path
    crit: suspicious
    conf: 0.94
    for: [javascript]
    if:
      type: text
      regex: 'dbus-1.{0,120}services'

composite_rules:
  - id: gnome-extension-remote-command
    desc: GNOME extension builds a remote shell command
    crit: suspicious
    conf: 0.98
    for: [javascript, zip, archives]
    scope: archive
    all:
      - id: gnome-shell-extension-manifest
      - id: micro-behaviors/process/create/direct::glib-command-line-spawn-call
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: micro-behaviors/process/create/shell/command-string::embedded-sh-c-literal
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec

  - id: gnome-extension-curl-upload
    desc: GNOME extension uploads data to a remote URL
    crit: suspicious
    conf: 0.98
    for: [javascript, zip, archives]
    scope: archive
    all:
      - id: gnome-shell-extension-manifest
      - id: micro-behaviors/communications/http/upload::curl-data-binary
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url

  - id: gnome-extension-remote-shell-stage
    desc: GNOME extension launches a remote shell stage
    crit: hostile
    conf: 0.99
    for: [javascript, zip, archives]
    scope: archive
    attack: T1195.002,T1059.004,T1105
    all:
      - id: gnome-shell-extension-manifest
      - id: micro-behaviors/process/create/direct::glib-command-line-spawn-call
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url

  - id: gnome-extension-persistence-drop
    desc: GNOME extension writes a remote-backed persistence helper
    crit: hostile
    conf: 0.99
    for: [javascript, zip, archives]
    scope: archive
    attack: T1195.002,T1543.001,T1543.003
    all:
      - id: gnome-shell-extension-manifest
      - id: micro-behaviors/fs/write/content::glib-file-set-contents-call
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
      - id: objectives/persistence/system/surface/paths::dbus-service-path
      - id: gnome-dbus-service-path
      - id: gnome-nautilus-provider-write
      - id: gnome-theme-resource-write

  - id: gnome-extension-input-exfil
    desc: GNOME extension uploads captured desktop data
    crit: hostile
    conf: 0.99
    for: [javascript, zip, archives]
    scope: archive
    attack: T1195.002,T1056,T1041
    all:
      - id: gnome-shell-extension-manifest
      - id: micro-behaviors/communications/http/upload::curl-data-binary
      - id: micro-behaviors/process/create/direct::glib-command-line-spawn-call

  - id: gnome-extension-soup-beacon
    desc: GNOME extension phones home through Soup
    crit: hostile
    conf: 0.98
    for: [javascript, zip, archives]
    scope: archive
    attack: T1195.002,T1071.001
    all:
      - id: gnome-shell-extension-manifest
      - id: gnome-soup-network-session
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
