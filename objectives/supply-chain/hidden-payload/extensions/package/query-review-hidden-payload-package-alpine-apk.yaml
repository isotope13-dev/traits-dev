defaults:
  platforms:
  - linux
  - windows
  - unix
  for:
  - alpine_apk
  - apk_alpine
  - tar
  - pkginfo
  - text
  - python
  - ruby
  - javascript
  - package.json
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: alpine-apk-shortcut-clipper
    desc: Alpine apk ships an obfuscated Windows shortcut clipper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/supply-chain/hidden-payload/extensions/package::pypi-obfuscated-shortcut-clipper

