defaults:
  platforms:
  - unix
  - windows
  for:
  - vsix
  - javascript
  - typescript
  - package.json
composite_rules:
- id: vscode-startup-credential-gated-package-runner
  desc: Startup extension runs credential-gated package
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/runtime::vscode-extension
  - id: objectives/execution/autoinstall/credential-gate::credential-probes-gate-remote-package-runner
  any:
  - id: metadata/permission/activation::activate-all-events
  - id: metadata/permission/activation::on-startup-finished

- id: vscode-startup-env-secret-upload
  desc: Startup extension uploads filtered environment secrets
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1552.001,T1041
  scope: archive
  all:
  - id: metadata/package/runtime::vscode-extension
  - id: objectives/exfiltration/stealer/credential/value::node-execfile-env-secret-http-upload
  any:
  - id: metadata/permission/activation::activate-all-events
  - id: metadata/permission/activation::on-startup-finished
