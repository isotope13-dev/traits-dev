defaults:
  platforms:
  - unix
  - windows
  for:
  - vsix
  - javascript
  - typescript
  - package.json
composite_rules:
- id: vscode-startup-credential-gated-package-runner
  desc: Startup extension runs credential-gated package
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/runtime::vscode-extension
  - id: objectives/execution/autoinstall/credential-gate::credential-probes-gate-remote-package-runner
  any:
  - id: metadata/permission/activation::activate-all-events
  - id: metadata/permission/activation::on-startup-finished
