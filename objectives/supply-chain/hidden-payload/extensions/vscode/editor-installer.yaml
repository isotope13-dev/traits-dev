defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-missing-vsix-fetch-flow
    desc: Missing VSIX URL feeds extension installer
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    attack: T1195.002,T1105,T1176
    near_bytes: 0
    all:
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-fetch-writes-installed-extension
      - id: metadata/package/dependencies/declaration::vsix-url-http-absent

  - id: vscode-installs-missing-downloaded-vsix
    desc: Attempts to install unavailable downloaded VSIX
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: T1195.002,T1105,T1176
    all:
      - id: vscode-missing-vsix-fetch-flow
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-installer-node-fs-binding
      - id: metadata/import/library::const-vscode-require-binding
    unless:
      - id: metadata/lang/source/naming/variable::vscode-installer-shadowed-fetch

  # A hard extension dependency is automatically installed and activated by
  # VS Code. If the gallery has no release for that required extension, the
  # declaring package points at a pulled or unavailable second VSIX.
  - id: vscode-requires-unavailable-extension
    desc: Extension requires a second VSIX with no gallery release
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1105,T1176
    all:
      - id: metadata/package/dependencies/declaration::vscode-extension-dependency-declared
      - id: metadata/package/dependencies/declaration::unresolved-required-extension

  # VS Code installs a hard extensionDependencies entry without a separate user
  # choice. When the same archive also advertises that companion as optional and
  # in the background, the declared install edge contradicts the stated behavior.
  # The dependency's name is not required, so renamed companions still convert.
  - id: vscode-hard-dependency-background-companion
    desc: Hard-dependency companion installs in background
    crit: hostile
    conf: 0.93
    scope: archive
    attack: T1195.002,T1176
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: metadata/package/dependencies/declaration::vscode-extension-dependency-declared
      - id: metadata/package/documentation/claims::vscode-background-companion-install-claim

  # Installing another VSIX is unusual enough to surface for review, even
  # when the artifact is selected or confirmed by the user. Keep this source
  # finding neutral about the downloaded artifact's verdict.
  - id: vscode-source-installs-vsix-artifact
    desc: Extension code installs a VSIX artifact
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    attack: T1195.002,T1176
    all:
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-extension-install-command
      - id: micro-behaviors/os/package-manager/ide-extension::vsix-package-file-literal
    near_bytes: 12000
    unless:
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-install-extension-from-file

  - id: vscode-source-fetches-and-installs-remote-package
    desc: Source downloads and installs a remote VS Code extension
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    attack: T1195.002,T1105,T1176
    all:
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-extension-install-command
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-install-extension-from-file
    any:
      - id: micro-behaviors/communications/http/client/exchange::fetch-call
      - id: micro-behaviors/communications/http/get::node-https-get-text
    near_bytes: 12000

  - id: vscode-concealed-cross-editor-installer
    desc: Extension conceals cross-editor VSIX installation
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1176
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/lib/development/vscode::activate-export
      - id: objectives/persistence/system/editor-extension::concealed-multi-editor-vsix-installer

  - id: vscode-extension-fetches-and-installs-remote-package
    desc: Extension downloads and installs a remote VSIX
    crit: suspicious
    conf: 0.97
    scope: archive
    attack: T1195.002,T1105,T1176
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-extension-install-command
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-install-extension-from-file
    any:
      - id: micro-behaviors/communications/http/client/exchange::fetch-call
      - id: micro-behaviors/communications/http/get::node-https-get-text

  - id: vscode-activate-fetches-and-installs-remote-package
    desc: Extension activate hook downloads and installs a remote VSIX
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1105,T1176
    all:
      - id: vscode-extension-fetches-and-installs-remote-package
      - id: well-known/lib/development/vscode::activate-export
    any:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/write/file/response-body::node-write-body-reader-result
