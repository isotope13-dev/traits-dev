defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-concealed-cross-editor-installer
    desc: Extension conceals cross-editor VSIX installation
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1176
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/lib/development/vscode::activate-export
      - id: objectives/persistence/system/editor-extension::concealed-multi-editor-vsix-installer
