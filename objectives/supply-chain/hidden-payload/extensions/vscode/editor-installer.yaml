defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  # The follow phase attaches these dependency outcomes to the declaring
  # package.json. Correlating them with code that installs a fetched extension
  # distinguishes a pulled/missing second VSIX from an ordinary unavailable
  # extension-pack entry.
  - id: vscode-installs-unavailable-extension
    desc: Installer targets a missing or pulled extension
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1105,T1176
    all:
      - id: vscode-extension-fetches-and-installs-remote-package
      - id: metadata/package/dependencies/declaration::unresolved-extension-dependency

  - id: vscode-source-fetches-and-installs-remote-package
    desc: Source downloads and installs a remote VS Code extension
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    attack: T1195.002,T1105,T1176
    all:
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-extension-install-command
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-install-extension-from-file
    any:
      - id: micro-behaviors/communications/http/client/script::fetch-call
      - id: micro-behaviors/communications/http/get::node-https-get-text
    near_bytes: 12000

  - id: vscode-concealed-cross-editor-installer
    desc: Extension conceals cross-editor VSIX installation
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1176
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: well-known/lib/development/vscode::activate-export
      - id: objectives/persistence/system/editor-extension::concealed-multi-editor-vsix-installer

  - id: vscode-extension-fetches-and-installs-remote-package
    desc: Extension downloads and installs a remote VSIX
    crit: suspicious
    conf: 0.97
    scope: archive
    attack: T1195.002,T1105,T1176
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-extension-install-command
      - id: micro-behaviors/os/package-manager/ide-extension::vscode-install-extension-from-file
    any:
      - id: micro-behaviors/communications/http/client/script::fetch-call
      - id: micro-behaviors/communications/http/get::node-https-get-text
