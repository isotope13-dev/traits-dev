defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: vscode-hidden-encoded-executable-stage
    desc: Editor extension hides an encoded executable downloader
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059.001,T1105
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-embedded::hidden-encoded-powershell-executable-download
      - id: micro-behaviors/process/create/shell/bridge::js-exec
