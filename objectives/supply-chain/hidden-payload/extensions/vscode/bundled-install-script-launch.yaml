# An editor extension that re-runs the editor's own binary as plain Node
# (ELECTRON_RUN_AS_NODE) on a script inside its bundled node_modules, detached
# with stdio discarded and the window hidden. A VSIX ships dependencies
# pre-installed, so no package manager ever runs their lifecycle hooks; an
# extension that launches a dependency script itself, invisibly and outliving
# the editor, is executing the hook the packaging step would have skipped.
# The in-process fallback that disarms process.exit before require() shows
# the script was written as a standalone program, not a library.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1564.003,T1218
composite_rules:
  - id: extension-hidden-bundled-dependency-script-run
    desc: Extension runs a bundled dependency script hidden as detached Electron-as-Node
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/env/write::electron-run-as-node-env-injection
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
      - id: micro-behaviors/fs/path/construct::node-modules-javascript-path
    any:
      - id: micro-behaviors/process/exit/handler::node-process-exit-noop-override
      - id: micro-behaviors/os/module/require::node-require-cache-delete
