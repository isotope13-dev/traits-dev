defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, batch, package.json]
composite_rules:
  - id: vscode-hidden-batch-native-pair-stage
    desc: Extension pairs hidden process launch with native batch staging
    crit: suspicious
    conf: 0.95
    attack: T1195.002,T1105,T1564.003
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/create/shell/bridge::js-execasync-call
      - id: objectives/command-and-control/dropper/staging/native/payload::batch-temp-native-pair-background-stage
