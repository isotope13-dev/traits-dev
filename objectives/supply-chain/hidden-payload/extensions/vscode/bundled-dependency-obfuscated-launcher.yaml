# A VS Code extension ships a node_modules dependency whose code is an
# obfuscator.io string-array runtime that launches a hidden child process.
# Published libraries in a vsix are normally plain or minified, not
# string-array obfuscated around child_process.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: vsix-dependency-obfuscated-hidden-process
    desc: VSIX bundled dependency hides obfuscated child-process launch
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1027,T1564.003
    all:
      - id: metadata/package/files/dependency::vsix-bundled-node-modules-path
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: metadata/import/builtin::child-process-module-reference
    any:
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-true
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
