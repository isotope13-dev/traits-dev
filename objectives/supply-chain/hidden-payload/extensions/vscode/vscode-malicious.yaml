defaults:
  platforms:
  - unix
  - windows
  for: [scripts, source, documents]
traits:
- id: postInstall-word
  desc: postInstall keyword
  crit: notable
  conf: 0.7
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    substr: postInstall
- id: exec-pattern
  desc: exec function pattern
  crit: component
  conf: 0.7
  for:
  - javascript
  - typescript
  unless:
  - type: basename
    regex: (^|[\\/])app\.asar\.unpacked[\\/]dist[\\/]
  if:
    type: text
    regex: exec(Sync|Async)\(
  not:
  - substr: node_modules/
  - substr: xo && node test.js
- id: vscode-request-post-call
  desc: request.post call
  crit: component
  conf: 0.92
  for: [javascript, typescript]
  if:
    type: text
    regex: "request\\.post\\s*\\("
- id: vscode-formdata-object
  desc: Appends a field to a FormData upload
  crit: component
  conf: 0.88
  for: [javascript, typescript]
  if:
    type: text
    regex: 'formData\.append\s*\('
- id: vscode-devcto-upload-endpoint
  desc: VSCode extension uploads to devcto API
  crit: suspicious
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: string_literal
    exact: https://api.devcto.com/v1/upload
- id: vscode-osascript-helper-spawn
  desc: VSCode extension spawns osascript helper
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: "spawn\\(['\"]osascript['\"]"
- id: node-install-sh-url-path
  desc: Remote install.sh URL path construction
  crit: component
  conf: 0.86
  for: [javascript, typescript]
  if:
    type: text
    substr: /install.sh
- id: node-install-sh-chmod-executable
  desc: Downloaded install.sh made executable
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: "install\\.sh[\\s\\S]{0,900}chmodSync\\([^)]{0,120},\\s*(493|0o?755)\\)"
composite_rules:
- id: vscode-startup-language-facade
  desc: Language-themed VS Code extension executes hidden startup code
  crit: suspicious
  conf: 0.96
  attack: T1195.002
  for: [package.json]
  all:
  - id: metadata/package/manifest/runtime::vscode-language-purpose-claim
  - id: metadata/package/manifest/runtime::vscode-localizations-absent
  - id: metadata/permission/activation::on-startup-finished
  - id: metadata/permission/activation::main-extension-js
- id: vscode-insecure-downloader
  desc: VS Code extension launches insecure download
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1105,T1195.002,T1553.004
  mbc: B0024,E1105
  for: [javascript, typescript]
  near_lines: 45
  all:
  - id: metadata/library/vscode::vscode-extension-marker
  - id: micro-behaviors/communications/http/download/curl::source-curl-insecure-executable-download
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/shell/bridge::js-exec-wrapper-with-hidden-options
- id: vscode-obfuscated-insecure-downloader
  desc: Obfuscated VS Code payload downloader
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1105,T1195.002,T1553.004
  mbc: B0024,E1105
  for: [javascript, typescript]
  near_lines: 45
  all:
  - id: metadata/library/vscode::vscode-extension-marker
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: micro-behaviors/communications/http/download/curl::source-curl-insecure-executable-download
  - id: micro-behaviors/process/create/shell/bridge::js-exec-wrapper-with-hidden-options
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
- id: vscode-local-file-upload
  desc: VSCode extension exfiltrates local files
  crit: hostile
  conf: 0.98
  attack: T1041
  mbc: B0024
  # This is a file-level source composite. Applying it to an archive
  # container lets unrelated members satisfy the read/upload legs (for
  # example, a telemetry dependency plus an extension manifest), producing a
  # false hostile finding on an otherwise benign VSIX. Malicious archive
  # handling is provided by the archive-scoped composites below, which consume
  # this finding from the relevant JavaScript/TypeScript member.
  for: [javascript, typescript]
  all:
  - id: metadata/library/vscode::vscode-extension-marker
  - id: micro-behaviors/fs/file/read::create-read-stream
  any:
  - id: vscode-request-post-call
  - id: vscode-formdata-object
  - id: micro-behaviors/communications/http/endpoints::fetch-explicit-external-url
  needs: 2
  scope: file
  near_bytes: 4096
  unless:
  - id: well-known/tool/development/anthropic-claude-agent/
  - id: well-known/app/ai/qwen-code::qwen-code-vscode-extension
  - id: well-known/app/ai/pinokio::app-bundle
  - id: metadata/library/structure::standalone-webapp-output
  - id: well-known/tool/development/projen::package-context
  downgrade:
    any:
    - id: metadata/library/structure::standalone-webapp-output
- id: vscode-hidden-helper-file-upload
  desc: VSCode extension uploads helper-captured local files
  crit: hostile
  conf: 0.98
  attack: T1041
  mbc: B0024
  for: [javascript, typescript, archives]
  scope: archive
  all:
  - id: vscode-local-file-upload
  - id: vscode-devcto-upload-endpoint
  - id: micro-behaviors/process/create/shell/bridge::js-spawn-hidden-powershell-helper
  any:
  - id: micro-behaviors/os/clipboard/helper::vscode-platform-clipboard-helper-paths
  - id: vscode-osascript-helper-spawn
  unless:
      - id: metadata/library/structure::standalone-webapp-output
- id: vscode-http-response-eval
  desc: VSCode extension evals HTTP response
  crit: hostile
  conf: 0.99
  attack: T1059.007
  mbc: B0024
  for:
  - javascript
  - typescript
  near_bytes: 4096
  all:
  - id: metadata/library/vscode::vscode-extension-marker
  - id: objectives/command-and-control/dropper/delivery/fetch-eval::response-end-then-eval
  any:
  - id: micro-behaviors/communications/http/request/client::http-get-dup
  - id: metadata/import/builtin::require-http
- id: vscode-remote-installer-exec
  desc: VSCode extension runs a downloaded installer
  crit: suspicious
  conf: 0.9
  mbc: B0024
  attack: T1059
  for: [javascript, typescript, package.json, archives]
  scope: archive
  all:
  - id: metadata/package/manifest/runtime::vscode-extension
  - id: node-install-sh-url-path
  - id: node-install-sh-chmod-executable
  - id: micro-behaviors/process/create/system::js-execfile-call
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-execfile-bash
  - id: micro-behaviors/process/create/shell/bridge::js-function-bash-first-arg
- id: vscode-archive-obfuscated-exe-dropper
  desc: VSIX archive contains obfuscated curl EXE dropper
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1105,T1059.007
  for: [archives, vsix]
  scope: archive
  all:
  - id: metadata/package/manifest/runtime::vscode-extension
  - id: metadata/permission/activation::on-startup-finished
  - id: objectives/command-and-control/dropper/delivery/download-execute::obfuscated-node-curl-exe-download-exec
- id: vscode-startup-obfuscated-sidecar
  desc: VS Code extension starts obfuscated sidecar at launch
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007,T1547.001
  for: [archives, vsix]
  scope: archive
  all:
  - id: metadata/package/manifest/runtime::vscode-extension
  - id: metadata/permission/activation::on-startup-finished
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
  - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
  any:
