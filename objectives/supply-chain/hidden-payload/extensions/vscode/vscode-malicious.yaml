    - id: objectives/anti-static/obfuscation/code-metrics/structure/
    - id: metadata/build/recognized-contexts::benign-build-tooling-context
# The autostart-location legs are inlined rather than wrapped in a local
# `persistence-locations` composite. That wrapper matched any JS naming a
# startup folder, Run key, launchd/crontab keyword or systemd unit — a generic
# capability with no VSCode meaning — yet surfaced from this directory as a
# standalone notable "References concrete persistence locations", firing on
# every service installer that is not an extension at all. The VSCode-specific
# intent lives here, in the `vscode-extension-marker` leg.
- id: persistence
  desc: Extension establishing persistence
  crit: suspicious
  conf: 0.95
  mbc: F0011
  attack: T1547
  for:
  - javascript
  - typescript
  near_bytes: 4096
  all:
  - id: metadata/library/vscode::vscode-extension-marker
  - id: micro-behaviors/fs/write/file/direct::js-file-write
  any:
  - id: objectives/persistence/login/startup/folder::win-startup-path
  - id: objectives/persistence/login/startup/registry::software-run-key
  - id: micro-behaviors/os/autorun/keyword::launchd-keyword
  - id: micro-behaviors/os/autorun/scheduled::crontab-keyword
  - id: micro-behaviors/os/service/config::systemd-keyword
  needs: 1
