defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-startup-encrypted-command-job-broker
    desc: Startup extension runs encrypted job broker
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1071.001
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: objectives/command-and-control/backdoor/control/job-broker::encrypted-hidden-command-job-broker
    any:
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/permission/activation::on-startup-finished
