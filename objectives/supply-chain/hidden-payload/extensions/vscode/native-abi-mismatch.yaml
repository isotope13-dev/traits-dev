defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json, pe, elf, macho]
composite_rules:
  - id: vscode-startup-native-abi-mismatch
    desc: Startup extension contains native addon ABI mismatch
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/os/module/require::module-level-native-addon-require
      - id: metadata/file/extension/mismatch::node-addon-without-abi-references
    any:
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/permission/activation::on-startup-finished
