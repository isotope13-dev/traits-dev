# A VS Code extension whose code evaluates a payload decoded from zero-width
# characters: invisible code shipped inside the published extension.
defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-extension-zero-width-eval
    desc: VS Code extension evaluates invisible zero-width payload
    crit: hostile
    conf: 0.97
    scope: archive
    attack: T1195.002,T1027
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: objectives/execution/payload/script-eval/transformed/direct::eval-zero-width-bitstream-payload
    any:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/permission/activation::on-startup-finished
