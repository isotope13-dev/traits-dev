# An editor extension that requires child_process under a name assembled from
# two literals, then runs a file with the editor's own binary as plain Node
# (ELECTRON_RUN_AS_NODE) through execFile. Naming the module in one literal
# costs nothing, so splitting it exists only to keep the process-launch
# capability out of text search.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1027
composite_rules:
  - id: extension-concealed-electron-node-file-exec
    desc: Extension hides child_process then runs a file as Electron-as-Node
    crit: hostile
    conf: 0.92
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/anti-static/obfuscation/string/concat::js-child-process-name-split-concat
      - id: metadata/lang/source/naming/interface/execution::execfile-identifier-text
      - id: micro-behaviors/os/env/write::electron-run-as-node-env-injection
