defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-import-time-hidden-temp-batch
    desc: Extension import stages hidden remote TEMP batch
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1105,T1059.001
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: metadata/import/builtin::require-child-process
      - id: objectives/execution/payload/file-exec/spawn/runtime::import-time-hidden-temp-batch
  - id: vscode-activation-editor-root-native-bootstrap
    desc: Extension activation drops a hidden native image
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1105,T1564.003
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: metadata/permission/activation::activate-all-events
      - id: objectives/execution/payload/file-exec/spawn/fetch::activation-editor-root-native-bootstrap
