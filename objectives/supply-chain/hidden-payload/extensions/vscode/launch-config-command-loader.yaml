defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: launch-config-command-loader
    desc: Extension config conceals authenticated remote shell command loader
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1059,T1105
    near_bytes: 1600
    all:
      - id: micro-behaviors/fs/path/config/app::vscode-launch-json-filename
      - id: micro-behaviors/fs/read/file/content/whole::read-node-symbol
      - id: micro-behaviors/data/format/credentials::github-pat-template-construction
      - id: micro-behaviors/communications/http/authorization-header::token-scheme-template-header
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/data/string/split::js-newline-regex-split
      - id: micro-behaviors/data/collection/filter::js-hash-comment-prefix-test
      - id: micro-behaviors/process/create/shell/variable-command::trimmed-line-shell-helper
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec-call-site
