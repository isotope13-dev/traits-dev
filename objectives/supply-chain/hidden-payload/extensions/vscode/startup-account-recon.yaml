# A VS Code extension activated on every startup whose code enumerates
# local accounts and privileges: host reconnaissance on editor launch.
defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-startup-account-recon
    desc: Startup-activated extension enumerates local accounts
    crit: hostile
    conf: 0.95
    scope: archive
    attack: T1195.002,T1087.001
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: objectives/discovery/account/enum::node-cross-platform-account-enumeration
    any:
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/permission/activation::on-startup-finished
