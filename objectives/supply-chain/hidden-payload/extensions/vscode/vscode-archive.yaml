defaults:
  platforms:
    - unix
    - windows
  for:
    - vsix-archive
traits:
  - id: dsp-ide-name
    desc: DSP-IDE package naming token
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: (?i)dsp-ide
  - id: dingzex-publisher-token
    desc: dingzex publisher token in package filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: (?i)dingzex
composite_rules:
  - id: oversized-vsix
    desc: Oversized VSIX with many archive members
    crit: suspicious
    conf: 0.9
    size_min: 250000000
    all:
      - id: metadata/file/extension/identity::vsix-package-basename
      - id: metadata/file/archive::archive-many-compressed-members
    unless:
      - id: well-known/tool/development/vscode-extension/marscode::marscode-extension-basename
  - id: dingzex-dsp-ide-package
    desc: dingzex DSP-IDE VSIX package
    crit: notable
    conf: 0.92
    all:
      - id: metadata/file/extension/identity::vsix-package-basename
      - id: dsp-ide-name
      - id: dingzex-publisher-token
