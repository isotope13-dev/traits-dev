defaults:
  platforms:
    - unix
    - windows
  for:
    - vsix-archive
traits:
  - id: dsp-ide-name
    desc: DSP-IDE package naming token
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: (?i)dsp-ide
  - id: dingzex-publisher-token
    desc: dingzex publisher token in package filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: (?i)dingzex
composite_rules:
  - id: oversized-vsix
    desc: Oversized VSIX with many archive members
    crit: suspicious
    conf: 0.9
    size_min: 250000000
    # Admits engine members so their Nuitka onefile marker (unless below)
    # can explain bulk from bundled scanner engines.
    for: [vsix-archive, macho, pe, elf]
    all:
      - id: metadata/file/extension/identity::vsix-package-basename
      - id: metadata/file/archive::archive-at-least-100-files
    unless:
      - id: well-known/tool/development/vscode-extension/marscode::marscode-extension-basename
      # Scanner extensions legitimately bulk up on per-platform engines;
      # Nuitka onefile members explain the size mechanically.
      - id: metadata/lang/compiler/generated::nuitka-onefile-runtime
  - id: dingzex-dsp-ide-package
    desc: dingzex DSP-IDE VSIX package
    crit: notable
    conf: 0.92
    all:
      - id: metadata/file/extension/identity::vsix-package-basename
      - id: dsp-ide-name
      - id: dingzex-publisher-token
