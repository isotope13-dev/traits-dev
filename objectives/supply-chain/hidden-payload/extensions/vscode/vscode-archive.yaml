defaults:
  platforms:
    - unix
    - windows
  for:
    - ooxml
traits:
  - id: vsix-extension-file
    desc: VSIX package filename
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      regex: (?i)\.vsix$
  - id: dsp-ide-name
    desc: DSP-IDE package naming token
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: (?i)dsp-ide
  - id: dingzex-publisher-token
    desc: dingzex publisher token in package filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: (?i)dingzex
composite_rules:
  - id: oversized-vsix
    desc: Oversized VSIX with many archive members
    crit: suspicious
    conf: 0.9
    size_min: 250000000
    all:
      - id: vsix-extension-file
      - id: metadata/file/metrics::archive-many-compressed-members
  - id: dingzex-dsp-ide-package
    desc: dingzex DSP-IDE VSIX package
    crit: suspicious
    conf: 0.92
    all:
      - id: vsix-extension-file
      - id: dsp-ide-name
      - id: dingzex-publisher-token
