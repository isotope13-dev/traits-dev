defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-hidden-powershell-remote-stage
    desc: Editor extension conceals remote PowerShell execution
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1059.001,T1105
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: objectives/evasion/process/hidden/window::hidden-powershell-remote-execution
