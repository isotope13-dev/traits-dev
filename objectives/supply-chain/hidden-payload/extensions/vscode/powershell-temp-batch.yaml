defaults:
  platforms:
  - unix
  - windows
  for:
  - vsix
  - javascript
  - typescript
  - package.json
composite_rules:
- id: vscode-invisible-name-hidden-batch-stage
  desc: Invisible extension name with hidden remote batch stage
  crit: hostile
  conf: 0.99
  scope: archive
  attack: T1195.002,T1036,T1105,T1059.001
  all:
  - id: metadata/package/runtime::vscode-extension
  - id: objectives/evasion/process/hidden/window::hidden-temp-batch-launch
  any:
  - id: objectives/evasion/masquerade/identity/display-name::vscode-display-name-zero-width
  - id: objectives/evasion/masquerade/identity/display-name::vsix-display-name-ascii-zero-width
