defaults:
  platforms: [unix, windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  - id: vscode-encrypted-content-hidden-terminal-stage
    desc: Hidden Python staging alongside network authenticated-decryption code
    crit: suspicious
    conf: 0.95
    scope: archive
    attack: T1105,T1027,T1564.003
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: objectives/evasion/process/hidden-terminal::hidden-terminal-encoded-python-file
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/decrypt::set-auth-tag
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
