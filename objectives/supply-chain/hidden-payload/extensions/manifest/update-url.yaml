# An extension that updates from somewhere other than the Chrome Web Store or
# Edge Add-ons: whoever controls that server can ship new code to every
# installation without store review.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]

traits:
  - id: off-store-update-url
    desc: Extension updates from outside the web stores
    crit: suspicious
    conf: 0.9
    attack: T1195.002
    if:
      type: value
      path: update_url
      regex: '\S'
    unless:
      - id: metadata/package/publishing::extension-google-update-url
      - id: metadata/permission/manifest::extension-edge-update-url
