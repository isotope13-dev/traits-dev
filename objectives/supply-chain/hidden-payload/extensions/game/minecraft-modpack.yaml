defaults:
  platforms: [windows, unix]
  for: [json]
  attack: T1195.002
traits:
  - id: curseforge-minecraft-modpack-manifest
    desc: CurseForge Minecraft modpack manifest
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: minecraftModpack
  - id: curseforge-overrides-mods-dir
    desc: CurseForge overrides mods directory
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: overrides/mods/
  - id: overrides-mod-jar
    desc: JAR embedded under modpack overrides mods
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'overrides/mods/[A-Za-z0-9_.-]{3,80}\.jar'
  - id: fabric-client-mod-manifest
    desc: Fabric client mod manifest
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'fabric\.mod\.json.{0,400}"environment"\s*:\s*"client"'
  - id: fabric-client-entrypoint
    desc: Fabric client entrypoint
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '"entrypoints".{0,240}"client"'
  - id: java-hidden-powershell-remote-eval
    desc: Fabric class embeds hidden PowerShell web eval
    crit: suspicious
    conf: 0.99
    attack: T1059.001,T1105
    for: [class]
    if:
      type: yara
      source: |
        rule java_hidden_powershell_remote_eval {
          strings:
            $builder = "java/lang/ProcessBuilder" ascii
            $fabric = "net/fabricmc/api/ClientModInitializer" ascii
            $powershell = "powershell.exe" ascii nocase
            $hidden = "-WindowStyle" ascii nocase
            $https = "https://" ascii nocase
            $iex = "iex" ascii nocase
          condition:
            all of them
        }
composite_rules:
  - id: java-hidden-powershell-remote-eval-hostile
    desc: Fabric mod runs hidden PowerShell web code
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105
    for: [class, jar]
    all:
      - id: java-hidden-powershell-remote-eval
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-bytecode
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode-reference
  - id: curseforge-overrides-hidden-mod
    desc: CurseForge modpack ships a mod through overrides
    crit: notable
    conf: 0.86
    for: [zip, jar, json]
    scope: outer
    all:
      - id: curseforge-minecraft-modpack-manifest
      - id: curseforge-overrides-mods-dir
      - id: overrides-mod-jar
  - id: curseforge-overrides-fabric-client-mod
    desc: CurseForge overrides include a Fabric client mod
    crit: notable
    conf: 0.9
    for: [zip, jar, json]
    scope: outer
    all:
      - id: curseforge-overrides-hidden-mod
    any:
      - id: fabric-client-mod-manifest
      - id: fabric-client-entrypoint
      - id: metadata/package/config::fabric-mod-metadata
    needs: 1
  - id: curseforge-overrides-fabric-java-reference-cooccurrence
    desc: Modpack co-locates a Fabric mod and Java HTTP/copy/path/cmd references
    crit: component
    conf: 0.97
    for: [zip, jar, class]
    attack: none
    scope: outer
    all:
      - id: curseforge-overrides-fabric-client-mod
      - id: objectives/command-and-control/dropper/delivery/download::java-http-copy-temp-exe-cmd-reference-cooccurrence

  # A mod jar carrying a `.tmp` member that was added after the classes were
  # compiled is a payload container, not a resource: mod loaders never read
  # `.tmp` assets, and the odd timestamp shows it did not come out of the same
  # build as the code.  cleave cannot look inside such a blob (an encrypted
  # payload is opaque `data`), so the packaging shape is the only place it is
  # visible — which is exactly why campaigns hide stages there.
  - id: mod-jar-out-of-band-temp-blob
    desc: Mod jar ships an out-of-band .tmp blob
    crit: suspicious
    conf: 0.9
    for: [zip, jar, tar, npm, whl]
    scope: archive
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: metadata/package/files/archive-member::temp-suffixed-member
      - id: metadata/package/files/archive-member::mtime-outlier-member
