defaults:
  platforms: [unix, windows]
  for: [vsix, javascript]

traits:
  - id: mutable-webwiki-branch
    desc: Selects mutable wiki source branch
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'WEBWIKI_BRANCH\s*=\s*["'']main["'']'

composite_rules:
  - id: mutable-wiki-with-script-enabled-webview
    desc: Mutable wiki and script-enabled webview
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: mutable-webwiki-branch
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-host-reference
      - id: micro-behaviors/data/document/render/markdown::markdown-it-with-raw-html
      - id: micro-behaviors/ui/window/webview::webview-enables-scripts
      - id: micro-behaviors/ui/window/webview::webview-displays-wiki-html
