# A wheel no Python build tool can produce, carrying a compiled module that
# phones the installing machine into a remote backend.
#
# PEP 427 requires every wheel to carry a .dist-info directory; pip refuses
# one without it. A wheel that lacks it declares no name, author, dependency
# or license for a reviewer to read, and no standard build emits it — its
# only production path is a hand-assembled archive. When that archive's
# entire runtime content is a single compiled extension (nothing readable
# without disassembly), and the extension loads license data, binds a device
# identifier and session token, and keeps a recurring heartbeat against a
# hard-coded Firebase project with an embedded API key, the distribution is
# a carrier for an unauditable licensing/tracking implant: the installing
# machine is enrolled with an operator backend that was never disclosed,
# because the wheel has no metadata to disclose it in.
#
# A vendor's own licensing SDK ships with dist-info metadata and readable
# packaging, so the shape warrants review. It does not convict: every payload
# term is also what a first-party app does to license itself against its own
# Firebase backend (device binding, session check, heartbeat), and the carrier
# terms only say the archive was hand-assembled. Nothing here takes data the
# licensing flow does not need or reaches an endpoint the app does not own, so
# the rule stops at suspicious.
defaults:
  platforms: [windows, unix]
  for: [whl, pe, dll, so]
  attack: T1195.002,T1082
  mbc: E1041

composite_rules:
  - id: pypi-metadataless-native-license-tracking-implant
    desc: Metadata-less wheel ships compiled license-tracking module
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      # The carrier: a hand-built wheel that declares nothing, holding only
      # unreadable native code.
      - id: metadata/package/files/wheel-sdist::wheel-missing-dist-info
      - id: metadata/package/files/wheel-sdist::wheel-native-only-code
      # The payload: license and device binding enrolled in recurring remote
      # session verification against a hard-coded backend.
      - id: micro-behaviors/os/security/auth/license::license-client-loader
      - id: micro-behaviors/os/sysinfo/machine-id::python-device-id-getter
      - id: micro-behaviors/os/security/auth/verify::online-session-verification
      - id: micro-behaviors/os/security/auth/session::session-token-field
      - id: micro-behaviors/time/schedule/interval::heartbeat-check-in-reference
      - id: micro-behaviors/communications/http/services/firebase::pyrebase-client
      - id: micro-behaviors/communications/http/services/google::google-api-key-packed

# Face-auth session enrollment from the same hand-built carrier. The base
# above stops at suspicious because every payload term is also what a
# first-party licensing client does against its own backend, and such a
# client can run its face authentication locally while only the session
# verification is remote. A compiled module that additionally performs
# cloud-backed face-auth verification -- face-auth text that itself
# declares online, remote or cloud operation -- against Firebase auth AND
# storage backends crosses that line: biometric-gated sessions enrolled
# device-plus-token with an undisclosed hard-coded backend, heartbeat-bound,
# from a wheel no build tool produces and no reviewer can audit without
# disassembly. Local-mode and mode-neutral face-auth references stay at the
# suspicious base, and bare face-auth references without the enrollment
# stack do not match either.
  - id: pypi-metadataless-native-face-auth-session-enrollment
    desc: Metadata-less wheel ships face-auth Firebase session client
    crit: hostile
    conf: 0.97
    scope: archive
    attack: T1195.002,T1041,T1082
    all:
      - id: objectives/supply-chain/hidden-payload/native-extension::pypi-metadataless-native-license-tracking-implant
      - id: micro-behaviors/os/security/auth/verify::face-auth-online-mode
      - id: micro-behaviors/communications/http/services/firebase::firebase-auth-domain
      - id: micro-behaviors/communications/http/services/firebase::firebase-storage-domain


