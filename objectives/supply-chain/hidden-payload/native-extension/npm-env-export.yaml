# Concealment is supported by swallowed loader errors plus a native secret
# exporter. A prebuilt addon or empty catch alone is ordinary npm behavior.
defaults:
  platforms: [linux]
  for: [npm, tar, zip, package.json, javascript, elf]
  crit: hostile
  conf: 0.98
  attack: T1195.002

composite_rules:
  - id: npm-concealed-native-env-export
    desc: Caught dynamic npm loading conceals native secret export
    scope: archive
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/os/module/require::try-require-empty-catch-text
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: objectives/exfiltration/stealer/env::native-detached-secret-env-json-http-export
