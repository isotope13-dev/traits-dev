# Concealment is supported by swallowed loader errors plus a native secret
# exporter. A prebuilt addon or empty catch alone is ordinary npm behavior.
defaults:
  platforms: [linux]
  for: [npm, tar, zip, package.json, javascript, elf]
  crit: hostile
  conf: 0.98
  attack: T1195.002

composite_rules:
  - id: npm-concealed-native-env-export
    desc: Caught dynamic npm loading conceals native secret export
    scope: archive
    all:
      - id: objectives/supply-chain/hidden-payload/native-extension::npm-swallowed-prebuilds-loader
      - id: objectives/supply-chain/hidden-payload/native-extension::npm-native-env-stealer-export
    any:
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: objectives/supply-chain/hidden-payload/native-extension::npm-prebuilds-native-addon-archive
    unless:
      - id: objectives/supply-chain/hidden-payload/native-extension::npm-silent-native-env-stealer
