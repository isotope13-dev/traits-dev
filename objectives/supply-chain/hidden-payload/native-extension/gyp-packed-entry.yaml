# Native-build source substitution accompanies a concealed packed entry.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: gyp-runs-obfuscated-entry-dropper
    desc: Gyp execution hook with obfuscated dropper
    crit: hostile
    conf: 0.98
    for: [npm, tar, javascript, gyp]
    scope: archive
    all:
      - id: micro-behaviors/process/create/shell/command-string::gyp-source-command-expansion
    any:
      - id: objectives/supply-chain/hidden-payload/eval::packed-single-line-eval-dropper
      - id: objectives/anti-static/obfuscation/encoding/numeric::charcode-packed-numeric-source
