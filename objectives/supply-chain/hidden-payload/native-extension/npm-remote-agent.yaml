# An npm package whose entire delivered content is a prebuilt remote-control
# daemon for a coding agent.
#
# Per-platform binary packages are an ordinary npm pattern: esbuild, swc,
# rollup and friends all publish `<pkg>-<os>-<arch>` siblings holding one
# executable behind `os`/`cpu` gates, so the shape alone proves nothing. What
# the shape does do is decide *where* the code is: a reviewer reading the
# tarball sees a five-line manifest and a stripped binary, and every behavioral
# question about the package is a question about bytes nobody diffs.
#
# So this composite asks what the binary actually is. When the answer is a
# daemon that writes itself a service unit, dials a WebSocket relay, drives a
# coding agent on a PTY, and rewrites that agent's permission table to remove
# the approval prompt, `npm install` has handed an off-host operator unattended
# code execution on the developer's machine — and the platform gate means most
# consumers never fetch the tarball that carries it.
#
# scope: archive — the manifest legs come from `package/package.json` and the
# behavior legs from `package/bin/<binary>`, two entries of the same tarball.
defaults:
  platforms: [linux, macos]
  for: [archives, npm, tar, package.json, elf, macho]
  attack: T1195.002,T1543,T1219
  mbc: E1041

composite_rules:
  - id: npm-platform-package-ships-remote-agent
    desc: npm platform package ships a self-persisting remote agent
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      # The delivery shape: a manifest with nothing in it but a platform gate.
      - id: metadata/package/manifest/freeform::pkg-skeleton-small
      - id: metadata/package/manifest/runtime::has-platform-restrictions
      # The payload: persistent remote PTY control of a coding agent, with the
      # agent's own approval gate rewritten out of the way.
      - id: objectives/persistence/system/service/systemd::native-persistent-wss-pty-ai-agent
      - id: micro-behaviors/process/create/agent-permission::native-agent-approval-gate-rewrite
