# A wheel that is nothing but compiled extension code -- no Python source and
# not even the .dist-info metadata PEP 427 requires -- whose module derives a
# device identifier and reports it with a session token on a heartbeat to a
# cloud backend whose API key is baked into the binary. The installer-visible
# package declares nothing, and the only behavior it carries is fingerprinting
# the host to an operator-held Firebase project.
#
# A real compiled distribution ships its dist-info and normally Python glue
# (__init__.py, stubs); the two distribution-shape legs exclude it before the
# behavior legs are considered. Face-auth and online-session strings in the
# same module do not cancel the beacon: a metadata-less native-only wheel
# still has no reviewable auth client, only a device heartbeat to the
# embedded project. A local-mode face-auth fallback compiled into that
# module is part of the same check-in, not a separate vendor client.
defaults:
  platforms: [windows, unix]
  attack: T1195.002

composite_rules:
  - id: opaque-wheel-device-heartbeat-firebase
    desc: Source-less wheel beacons device ID to embedded Firebase project
    crit: hostile
    conf: 0.93
    for: [whl, pe, dll, so]
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-missing-dist-info
      - id: metadata/package/files/wheel-sdist::wheel-native-only-code
      - id: micro-behaviors/os/sysinfo/machine-id::python-device-id-getter
      - id: micro-behaviors/time/schedule/interval::heartbeat-routine-label
      - id: micro-behaviors/os/security/auth/session::session-token-field
      - id: micro-behaviors/communications/http/services/firebase::pyrebase-client
      - id: micro-behaviors/communications/http/services/google::google-api-key-packed
