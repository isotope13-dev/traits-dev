# An npm package whose JavaScript resolves a per-platform plain shared library
# (not a `.node` addon) and ships, beside it, a Go c-shared build carrying an
# inbox/outbox object-key mailbox. The package's visible code is a path
# resolver; the behavior lives in a native library loaded over FFI, where
# JavaScript-level review never sees it.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, javascript, elf, macho]
  attack: T1195.002,T1102.002

composite_rules:
  - id: npm-prebuilt-go-mailbox-agent
    desc: npm package ships an FFI-loaded Go c-shared library with a bucket mailbox
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: micro-behaviors/fs/path/library::prebuilds-platform-shared-library-path
      - id: metadata/lang/go-build::go-cshared-native-build-flag
      - id: micro-behaviors/communications/http/request/tasking::go-inbox-key-method
      - id: micro-behaviors/communications/http/request/tasking::go-outbox-key-method
