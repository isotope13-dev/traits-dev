# A declared native extension whose builder writes its own placeholder
# Makefile compiles nothing: the extension exists to run Ruby at install time.
defaults:
  platforms: [unix, windows]
  for: [gem, tar, ruby, pkg_info]

composite_rules:
  - id: gem-stub-extension-host-profile-callback
    desc: Stub gem extension sends host profile
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1082
    scope: outer
    all:
      - id: metadata/package/files/rubygems::gem-extension-build-declaration
      - id: micro-behaviors/fs/write/file/target::ruby-makefile-write
      - id: micro-behaviors/process/create/shell/command-mode::extconf-host-profile-shell-callback

  - id: gem-stub-extension-registry-republish
    desc: Stub gem extension republishes fetched data
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1567
    scope: outer
    all:
      - id: metadata/package/files/rubygems::gem-extension-build-declaration
      - id: micro-behaviors/fs/write/file/target::ruby-makefile-write
      - id: objectives/exfiltration/cloud/registry::ruby-remote-data-staged-gem-upload
