defaults:
  platforms: [unix, windows]

composite_rules:
  - id: npm-silent-native-env-stealer
    desc: npm wrapper hides errors while loading a native environment stealer
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1041
    for: [npm, tar, zip, package.json, javascript, elf]
    all:
      - id: metadata/package/files/included::npm-prebuilds-node-api-elf
      - id: micro-behaviors/os/module/require::prebuilds-addon-require-swallowed-catch
      - id: micro-behaviors/fs/path/library::prebuilds-node-addon-name-pair
    any:
      - id: objectives/exfiltration/stealer/env::native-detached-addon-env-http-exfil
      - id: objectives/exfiltration/stealer/env::native-forked-node-addon-form-profile-exfil
