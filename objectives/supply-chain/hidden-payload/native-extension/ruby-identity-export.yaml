# A declaration alone is ordinary. Require the concealed data exporter in the
# same package. Extensionless Rakefiles currently need Ruby type recognition.
defaults:
  platforms: [unix, windows]
  for: [gem, tar, ruby]
composite_rules:
  - id: gem-extension-concealed-identity-export
    desc: Gem extension with concealed identity export
    crit: hostile
    conf: 0.97
    attack: T1195.002
    scope: archive
    all:
      - id: metadata/package/files/rubygems::gemspec-native-extension-declaration
      - id: objectives/exfiltration/stealer/system-info/identity::ruby-silent-encoded-identity-post
