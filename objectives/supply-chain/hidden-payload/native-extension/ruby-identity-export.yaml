# A declaration alone is ordinary. Require the concealed data exporter in the
# same package. Extensionless Rakefiles currently need Ruby type recognition.
defaults:
  platforms: [unix, windows]
  for: [gem, tar, ruby, pkg_info]
composite_rules:
  - id: gem-extension-concealed-identity-export
    desc: Gem extension with concealed identity export
    crit: hostile
    conf: 0.97
    attack: T1195.002
    scope: outer
    all:
      - id: metadata/package/files/rubygems::gem-extension-build-declaration
      - id: objectives/exfiltration/stealer/system-info/identity::ruby-silent-encoded-identity-post
  - id: gem-extension-direct-ip-http-beacon
    desc: Gem native extension sends HTTP GET to raw external IPv4 URL
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1071.001
    scope: outer
    all:
      - id: metadata/package/files/rubygems::gem-extension-build-declaration
      - id: micro-behaviors/communications/http/request/netlib::ruby-net-http-get-response-call
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-script
