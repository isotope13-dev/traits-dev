defaults:
  platforms: [macos]
  for: [macho]
  attack: T1195.002,T1546.004

composite_rules:
  - id: node-addon-python-pth-implant
    desc: Node native addon conceals a remote Python .pth startup implant
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::node-api-addon-export
      - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
      - id: micro-behaviors/communications/http/download/curl::xor-decoded-server-content-fetch-failure
      - id: micro-behaviors/fs/path/extension::xor-5a-pth-suffix-construction
      - id: micro-behaviors/fs/enumerate/directory::xor-decoded-site-packages-enumeration
