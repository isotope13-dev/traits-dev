# Keep the remote fetch, extraction, and native loader in the same Python
# file. An application can ship independent installers and opt-in local
# extension loaders; their co-presence is not a remote native payload chain.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1129

composite_rules:

  - id: python-manifest-integrity-fails-open
    desc: Manifest failure skips integrity verification
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/config/read::python-manifest-urlopen-error-handler
      - id: python-manifest-failure-return-none

  - id: python-manifest-failure-return-none
    desc: Manifest failure returns no digest
    crit: notable
    conf: 0.94
    near_lines: 24
    all:
      - id: micro-behaviors/data/config/read::python-manifest-urlopen-error-handler
      - id: micro-behaviors/data/control-flow/error-handling/catch::network-error-handler
      - id: micro-behaviors/data/control-flow/return::python-return-none

  - id: python-remote-native-extension-bootstrap
    desc: Python downloads and loads remote native extension
    crit: notable
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/github::python-github-release-download-base
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/archive/extract/zip::python-native-extension-archive-extraction
      - id: micro-behaviors/os/module/load/name::python-extension-file-loader

  # A remote native stage whose verification can be bypassed or fails open is
  # suspicious, not hostile, on its own: runtime native provisioners (and the
  # sibling plugin-loader file, deliberately kept suspicious) have documented
  # offline-mirror uses. The stealthy variants below stay hostile unless the
  # degradation path notifies the operator.
  - id: python-unverified-native-extension-bootstrap
    desc: Python loads remote native code with bypassable integrity verification
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/github::python-github-release-download-base
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/archive/extract/zip::python-native-extension-archive-extraction
      - id: micro-behaviors/os/module/load/name::python-extension-file-loader
    any:
      - id: metadata/lang/source/shape::python-verification-skip-name-with-getenv
      - id: python-manifest-integrity-fails-open

  # Degradation the operator can see (a stderr warning on the bypass path,
  # next to the manifest fetch) is transparent tooling, not a stealthy
  # implant: silent variants keep the hostile verdicts below.
  - id: transparent-integrity-degradation-context
    desc: Integrity bypass path warns the operator
    crit: exception
    conf: 0.97
    near_lines: 30
    all:
      - id: micro-behaviors/fs/path/metadata-store::python-manifest-json-filename
      - id: micro-behaviors/process/stdio/write::python-stderr-warning-write

  - id: python-explicit-unverified-native-stage
    desc: Remote native stage has explicit integrity bypass
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/github::python-github-release-download-base
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/archive/extract/zip::python-native-extension-archive-extraction
      - id: micro-behaviors/os/module/load/name::python-extension-file-loader
      - id: metadata/lang/source/naming/setting::python-verification-skip-name
      - id: micro-behaviors/os/env/read/current::python-os-getenv-call
    unless:
      - id: transparent-integrity-degradation-context

  - id: python-fail-open-unverified-native-stage
    desc: Remote native stage fails open on manifest errors
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/download/github::python-github-release-download-base
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/archive/extract/zip::python-native-extension-archive-extraction
      - id: micro-behaviors/os/module/load/name::python-extension-file-loader
      - id: python-manifest-failure-return-none
    unless:
      - id: transparent-integrity-degradation-context
