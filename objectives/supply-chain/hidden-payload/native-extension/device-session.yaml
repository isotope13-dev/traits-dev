# A wheel whose only member is a compiled CPython extension implementing a
# device-registration session tracker: it derives a device identifier, keeps
# a heartbeat, and verifies a session token online against cloud credentials
# baked into the binary. The module is the whole distribution -- no Python
# source to read and not even the .dist-info metadata PEP 427 requires, so
# the package declares nothing a reviewer or installer can inspect.
#
# The distribution-shape leg (`wheel-missing-dist-info`) keys on
# format-mandated metadata: every installable wheel carries dist-info, so a
# legitimate compiled extension -- which ships inside a real distribution
# with its metadata -- never reaches this verdict from its packaging alone.
defaults:
  platforms: [windows, unix]
  for: [whl, python, pe, dll, so]
  attack: T1195.002

composite_rules:
  - id: pypi-compiled-device-session-beacon
    desc: Wheel conceals compiled device-session beacon with embedded credentials
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-missing-dist-info
      - id: metadata/file/extension/identity::cpython-native-extension-module
      - id: micro-behaviors/os/sysinfo/machine-id::python-device-id-getter
      - id: micro-behaviors/time/schedule/interval::heartbeat-routine-label
      - id: micro-behaviors/os/security/auth/verify::online-session-verification
      - id: micro-behaviors/os/security/auth/session::session-token-field
      - id: micro-behaviors/communications/http/services/firebase::pyrebase-client
      - id: micro-behaviors/communications/http/services/google::google-api-key-packed
