# A package that hands its own `.pyd` to ctypes, throws the handle away, and
# swallows any error.
#
#   try:
#       import ctypes as _ct, os as _os
#       _p = _os.path.join(_os.path.dirname(__file__), "_parser.pyd")
#       if _os.path.exists(_p):
#           _ct.CDLL(_p)
#   except:
#       pass
#
# A `.pyd` is a CPython extension module: the way to use one is `import`.
# Loading it through ctypes skips PyInit_* entirely, and discarding the
# handle means no exported function is ever reached. The single thing the
# call achieves is running the library's load-time code (DllMain on
# Windows, constructors elsewhere) -- i.e. a native payload triggered by
# `import <package>`, dressed up as a "native parser for performance".
# The bare except/pass keeps the import working on hosts where the payload
# is absent or blocked, so nothing surfaces to the user.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002,T1129,T1036.008
  mbc: B0024

composite_rules:
  - id: pyd-loaded-for-side-effects-silently
    desc: Loads bundled .pyd via ctypes only for load-time code
    crit: hostile
    conf: 0.93
    near_lines: 8
    all:
      - id: micro-behaviors/dylib/load/runtime::ctypes-load-handle-discarded
      - id: micro-behaviors/dylib/load/runtime::python-pyd-extension-string
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/ai/media/comfyui::comfy-kitchen-cuda-backend
      - id: "metadata/file/naming::test-directory-component"
