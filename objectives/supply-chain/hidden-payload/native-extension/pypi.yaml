defaults:
  crit: suspicious
  platforms: [windows, unix]
  attack: T1195.002
composite_rules:
  # Size, compiled code and absent author/dependency fields are metadata.
  # They do not establish a concealed payload; retain their atomic facts.
  - id: native-extension-anti-debug-file-enum
    desc: Native Python extension combines anti-debug and file enumeration
    conf: 0.9
    for: [pe, dll]
    all:
      - id: metadata/file/extension/identity::cpython-native-extension-module
      - id: micro-behaviors/fs/directory/readdir/native::file-enumeration-with-access
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  - id: pypi-native-anti-debug-file-enum
    desc: PyPI package includes native extension with anti-debug file enumeration
    conf: 0.92
    for: [python, pkginfo, whl, python-sdist, pe]
    all:
      - id: native-extension-anti-debug-file-enum
      - id: metadata/package/dependencies/presence::pypi-no-runtime-deps
    scope: archive
  - id: python-import-time-silent-native-platform-check
    desc: Runs silent native platform_check on import
    crit: suspicious
    conf: 0.94
    for: [python]
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
      - id: micro-behaviors/data/control-flow/module-exec::python-silent-relative-native-hook-call
      - id: micro-behaviors/data/control-flow/module-exec::python-native-platform-check-call
  - id: pyd-platform-check-thread-and-cache-hooks
    desc: Native pyd embeds platform_check and init_cache
    crit: suspicious
    conf: 0.95
    for: [pe, dll]
    all:
      - id: metadata/filename/identity::python-extension-module-basename
      - id: micro-behaviors/dylib/load/runtime::pyd-embeds-platform-check-symbol
      - id: micro-behaviors/dylib/load/runtime::pyd-embeds-init-cache-path-symbol
      - id: micro-behaviors/process/thread/create::create-thread
  - id: pypi-import-native-platform-check-dropper
    desc: PyPI import calls a bundled native platform_check hook
    crit: hostile
    conf: 0.96
    for: [python, whl, python-sdist, pe, dll]
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/module-exec::python-native-platform-check-call
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
      - id: micro-behaviors/dylib/load/runtime::pyd-embeds-platform-check-symbol
