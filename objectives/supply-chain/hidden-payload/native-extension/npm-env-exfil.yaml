# Native credential theft hidden behind a JavaScript prebuild loader that
# swallows load errors. Native code alone is not an inspection-evasion claim.
defaults:
  platforms: [unix]
  for: [npm, tar, package.json, javascript, elf]

composite_rules:
  - id: npm-native-addon-secret-exfil-loader
    desc: npm loader swallows errors around a native credential-stealing addon
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1041
    all:
      - id: micro-behaviors/os/module/require::prebuilds-addon-require-swallowed-catch
      - id: micro-behaviors/fs/path/construct::platform-prebuild-node-addon-path
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: objectives/exfiltration/stealer/env::native-getenv-secrets-json-http-oob-exfil
