defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1041,T1552.001,T1195.002
  mbc: E1041

traits:
  - id: npm-postinstall-imports-known-malicious-rest-utils
    desc: Postinstall imports the package whose release runs a cloud credential stealer
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: '(?is)"webservices\.rest-utils"\s*:\s*"\^1\.0\.8"'
  - id: npm-entrypoint-requires-known-malicious-rest-utils
    desc: JavaScript entrypoint loads webservices.rest-utils
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?is)require\s*\(\s*["'']webservices\.rest-utils["'']\s*\)'
  - id: npm-cloud-metadata-profile-chunked-http-exfil
    desc: Collects cloud metadata and system profile then sends Base64 chunks in HTTP paths
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:169\.254\.169\.254|metadata\.google\.internal)[\s\S]{0,12000}(?:Buffer\.from\s*\(\s*_rawPayload\s*\)|_rawPayload\s*\)[\s\S]{0,400}base64)[\s\S]{0,12000}part-\$\{[^}]+\}[^\n]{0,120}/\$\{chunkData\}|part-\$\{chunkIdx\}-of-\$\{totalCount\}/\$\{chunkData\}'
  - id: npm-worldapp-base64-env-profile-post
    desc: Encodes the process environment and posts it to a fixed Lambda endpoint
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:Object\.keys\s*\(\s*process\s*(?:\.env|\[\s*["'']env["'']\s*\])\s*\)|JSON\.stringify\s*\([^)]{0,100}process\s*(?:\.env|\[\s*["'']env["'']\s*\]))[\s\S]{0,1800}Buffer\.from\s*\([^\n]{0,250}base64[\s\S]{0,6000}lambda-url\.us-east-1\.on\.aws[\s\S]{0,3000}(?:req|request)\.write\s*\('
  - id: npm-preinstall-shell-collects-process-and-host-files
    desc: npm install hook submits environment, process list and filesystem search results
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: '(?is)"preinstall"[\s\S]{0,700}(?:hooklistener\.com|oast(?:ify)?\.com|oast\.fun)[\s\S]{0,700}(?:grep\s+-r|ps\s+aux)[\s\S]{0,400}ps\s+aux[\s\S]{0,400}env'

composite_rules:
  - id: npm-postinstall-installs-malicious-rest-utils
    desc: Postinstall loads a dependency release that steals cloud metadata credentials
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: npm-postinstall-imports-known-malicious-rest-utils
      - id: npm-entrypoint-requires-known-malicious-rest-utils
  - id: npm-install-cloud-credential-profile-exfil
    desc: npm install hook profiles cloud credentials and exfiltrates them in URL chunks
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    near_bytes: 1800
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: npm-cloud-metadata-profile-chunked-http-exfil
  - id: npm-install-worldapp-environment-exfil
    desc: npm install hook uploads the complete process environment to a remote Lambda URL
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    near_bytes: 1400
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: npm-worldapp-base64-env-profile-post
  - id: npm-install-hooklistener-system-profile-exfil
    desc: npm preinstall uploads process list, environment and filesystem search output
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: npm-preinstall-shell-collects-process-and-host-files
