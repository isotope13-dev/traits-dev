defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1195.002
traits:
  - id: clickbank-affiliate-url
    desc: Clickbank affiliate link URL
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      regex: hop\.clickbank\.net
  - id: tid-tracking-param
    desc: tid= tracking parameter in URL
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '[?&]tid='
  - id: free-download-in-name
    desc: Free Download page-title suffix
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: \bfree\s+download\b
      case_insensitive: true
  - id: affiliate-network-url-1
    desc: Affiliate URL (clickbank/jvz)
    crit: suspicious
    conf: 0.9
    if:
      type: string_literal
      regex: \b(hop\.clickbank\.net|jvz\d*\.com)\b
  - id: affiliate-network-url-2
    desc: Affiliate URL (warriorplus/digistore24/impact)
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: \b(warriorplus|digistore24|impact)\.com\b
  - id: readme-paysafecard-copy
    desc: README repeats Paysafecard payment term
    crit: component
    conf: 0.92
    for: [markdown]
    count_min: 2
    if:
      type: text
      regex: '(?i)\bpaysafecard\b'
  - id: readme-cashier-copy
    desc: README repeats casino cashier term
    crit: component
    conf: 0.92
    for: [markdown]
    count_min: 2
    if:
      type: text
      regex: '(?i)\bcashier\b'
  - id: readme-withdrawal-copy
    desc: README repeats casino withdrawal term
    crit: component
    conf: 0.92
    for: [markdown]
    count_min: 2
    if:
      type: text
      regex: '(?i)\bwithdrawal\b'
  - id: readme-gambling-href-sports-betting
    desc: README href targets sports-betting path
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)href="https?://[^"]{0,200}sports-betting'
    # Open Collective / GitHub Sponsors badge walls list casino sponsors.
    unless:
      - type: text
        substr: opencollective.com
      - type: text
        substr: BEGIN SPONSORS
  - id: readme-gambling-href-casino-vertical
    desc: README href targets casino vertical path
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?i)href="https?://[^"]{0,200}(casino|poker|blackjack|sportsbook|betway)'
    unless:
      - type: text
        substr: opencollective.com
      - type: text
        substr: BEGIN SPONSORS
  - id: readme-repeated-gambling-copy
    desc: README repeats casino-related terms
    crit: notable
    conf: 0.9
    for: [markdown]
    count_min: 3
    if:
      type: text
      regex: '(?i)\bcasinos?\b'
    unless:
      - type: text
        substr: opencollective.com
      - type: text
        substr: BEGIN SPONSORS
  - id: readme-repeated-betting-term
    desc: README repeats betting term
    crit: notable
    conf: 0.9
    for: [markdown]
    count_min: 3
    if:
      type: text
      regex: '(?i)\bbetting\b'
    # Open Collective sponsor walls can legitimately contain copy supplied by
    # several betting sponsors; require the terms to occur outside that context.
    unless:
      - type: text
        substr: opencollective.com
      - type: text
        substr: BEGIN SPONSORS
  - id: readme-repeated-gambling-term
    desc: README repeats gambling term
    crit: notable
    conf: 0.9
    for: [markdown]
    count_min: 3
    if:
      type: text
      regex: '(?i)\bgambling\b'
    unless:
      - type: text
        substr: opencollective.com
      - type: text
        substr: BEGIN SPONSORS
composite_rules:
  - id: readme-gambling-anchor-text
    desc: README links to gambling marketing URL
    crit: notable
    conf: 0.92
    for: [markdown]
    any:
      - id: readme-gambling-href-sports-betting
      - id: readme-gambling-href-casino-vertical
  - id: readme-gambling-payment-copy
    desc: README combines gambling payment terms
    crit: component
    conf: 0.92
    for: [markdown]
    needs: 2
    any:
      - id: readme-paysafecard-copy
      - id: readme-cashier-copy
      - id: readme-withdrawal-copy
  - id: readme-gambling-copy
    desc: README repeats gambling or payment copy
    crit: notable
    conf: 0.9
    for: [markdown]
    any:
      - id: readme-gambling-payment-copy
      - id: readme-repeated-gambling-copy
      - id: readme-repeated-betting-term
      - id: readme-repeated-gambling-term
  - id: affiliate-network-url
    desc: Affiliate network redirect URL
    crit: suspicious
    conf: 0.9
    any:
      - id: affiliate-network-url-1
      - id: affiliate-network-url-2
  - id: pypi-affiliate-spam
    desc: PyPI package with affiliate spam URL
    crit: suspicious
    conf: 0.95
    mbc: B0024
    all:
      - id: metadata/build/pip::setup-py
      - id: affiliate-network-url
  - id: pypi-clickbank-spam
    desc: PyPI package with Clickbank affiliate link
    crit: suspicious
    conf: 0.95
    mbc: B0024
    all:
      - id: metadata/build/pip::setup-py
      - id: clickbank-affiliate-url
  - id: pypi-seo-spam-package
    desc: PyPI SEO spam package
    crit: suspicious
    conf: 0.92
    mbc: B0024
    all:
      - id: free-download-in-name
      - id: affiliate-network-url
  - id: npm-registry-seo-spam
    desc: npm package published for registry SEO spam
    crit: hostile
    conf: 0.97
    mbc: B0024
    scope: archive
    for: [npm, package.json, javascript, markdown]
    all:
      - id: metadata/package/quality/empty::tiny-commonjs-exports-object
      - id: metadata/package/manifest/repository::repo-url-equals-homepage
      - id: micro-behaviors/data/format/html::html-heading-tag
      - id: readme-gambling-copy
      - id: readme-gambling-anchor-text
    any:
      - id: metadata/package/manifest/description::gambling-casino-claim
      - id: metadata/package/manifest/description::gambling-blackjack-claim
      - id: metadata/package/manifest/description::gambling-poker-claim
      - id: metadata/package/manifest/description::gambling-sports-betting-claim
      - id: metadata/package/keywords/identity::spam-keyword-trio
  - id: npm-empty-package-gambling-link-funnel
    desc: Empty npm package funnels readers to gambling site
    crit: hostile
    conf: 0.97
    mbc: B0024
    scope: archive
    for: [npm, package.json, javascript, markdown]
    all:
      - id: metadata/package/quality/empty::tiny-commonjs-exports-object
      - id: metadata/package/manifest/repository::repo-url-equals-homepage
      - id: readme-gambling-copy
      - id: readme-gambling-anchor-text
    any:
      - id: metadata/package/manifest/description::gambling-casino-claim
      - id: metadata/package/manifest/description::gambling-blackjack-claim
      - id: metadata/package/manifest/description::gambling-poker-claim
      - id: metadata/package/manifest/description::gambling-sports-betting-claim
      - id: metadata/package/keywords/identity::spam-keyword-trio
  - id: npm-registry-seo-spam-removed
    desc: Removed npm registry SEO spam package
    crit: suspicious
    conf: 0.95
    mbc: B0024
    scope: package
    for: [npm, package.json, javascript, markdown]
    all:
      - id: npm-registry-seo-spam
      - id: metadata/registry::version-removed
