defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1195.002
traits:
  - id: clickbank-affiliate-url
    desc: Clickbank affiliate link URL
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      regex: hop\.clickbank\.net
  - id: tid-tracking-param
    desc: tid= tracking parameter in URL
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '[?&]tid='
  - id: free-download-in-name
    desc: Free Download page-title suffix
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: \bfree\s+download\b
      case_insensitive: true
  - id: affiliate-network-url-1
    desc: Affiliate URL (clickbank/jvz)
    crit: suspicious
    conf: 0.9
    if:
      type: string_literal
      regex: \b(hop\.clickbank\.net|jvz\d*\.com)\b
  - id: affiliate-network-url-2
    desc: Affiliate URL (warriorplus/digistore24/impact)
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: \b(warriorplus|digistore24|impact)\.com\b
composite_rules:
  - id: affiliate-network-url
    desc: Affiliate network redirect URL
    crit: suspicious
    conf: 0.9
    any:
      - id: affiliate-network-url-1
      - id: affiliate-network-url-2
  - id: pypi-affiliate-spam
    desc: PyPI package with affiliate spam URL
    crit: suspicious
    conf: 0.95
    mbc: B0024
    all:
      - id: metadata/build/pip::setup-py
      - id: affiliate-network-url
  - id: pypi-clickbank-spam
    desc: PyPI package with Clickbank affiliate link
    crit: suspicious
    conf: 0.95
    mbc: B0024
    all:
      - id: metadata/build/pip::setup-py
      - id: clickbank-affiliate-url
  - id: pypi-seo-spam-package
    desc: PyPI SEO spam package
    crit: suspicious
    conf: 0.92
    mbc: B0024
    all:
      - id: free-download-in-name
      - id: affiliate-network-url
  - id: npm-registry-seo-spam
    desc: npm package published for registry SEO spam
    crit: hostile
    conf: 0.97
    mbc: B0024
    scope: package
    for: [npm, package.json, javascript, markdown]
    all:
      - id: metadata/package/quality/empty::tiny-commonjs-exports-object
      - id: metadata/package/manifest/repository::repo-url-equals-homepage
      - id: micro-behaviors/data/format/html::html-heading-tag
      - id: metadata/registry::brand-new-package
    any:
      - id: metadata/package/manifest/description::gambling-casino-claim
      - id: metadata/package/manifest/description::gambling-blackjack-claim
      - id: metadata/package/manifest/description::gambling-poker-claim
      - id: metadata/package/keywords/identity::keyword-notes
  - id: npm-empty-package-gambling-link-funnel
    desc: Empty npm package funnels readers to gambling site
    crit: hostile
    conf: 0.97
    mbc: B0024
    scope: package
    for: [npm, package.json, javascript, markdown]
    all:
      - id: metadata/package/quality/empty::tiny-commonjs-exports-object
      - id: metadata/package/manifest/repository::repo-url-equals-homepage
      - id: micro-behaviors/data/format/html::html-external-link-noopener
      - id: metadata/registry::brand-new-package
    any:
      - id: metadata/package/manifest/description::gambling-casino-claim
      - id: metadata/package/manifest/description::gambling-blackjack-claim
      - id: metadata/package/manifest/description::gambling-poker-claim
  - id: npm-registry-seo-spam-removed
    desc: Removed npm registry SEO spam package
    crit: suspicious
    conf: 0.95
    mbc: B0024
    scope: package
    for: [npm, package.json, javascript, markdown]
    all:
      - id: npm-registry-seo-spam
      - id: metadata/registry::version-removed
