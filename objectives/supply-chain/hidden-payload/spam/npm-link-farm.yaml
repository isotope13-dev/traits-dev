# Registry link farms: a package published so that a search engine sees a
# reputable domain linking to a marketing site.
#
# The gambling composites in package.yaml key on the vertical — casino, poker,
# sports betting — and so only catch the wave that happens to be running. This
# one keys on the shape, which does not change when the vertical does:
#
#   * the module is a stub that exports nothing, because nobody installs it;
#   * `repository` and `homepage` are the same marketing URL (the sibling atom
#     already excludes real git hosts, which is what makes this leg strong — a
#     package with actual source declares a VCS repository);
#   * the README is hand-written HTML, not markdown, with `target="_blank"`
#     `rel="noopener"` anchors — the shape an SEO tool emits, and one a normal
#     README has no reason to use since markdown link syntax is shorter.
#
# The `any:` leg only has to establish that the copy is marketing rather than
# documentation; whichever vertical supplies it is immaterial.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, markdown]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: npm-stub-package-marketing-link-farm
    desc: Empty npm package fronts a marketing site
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/quality/empty::tiny-commonjs-exports-object
      - id: metadata/package/manifest/repository::repo-url-equals-homepage
      - id: micro-behaviors/data/format/html::html-heading-tag
      - id: micro-behaviors/communications/http/url/markup::html-external-link-noopener
    any:
      - id: metadata/package/keywords/identity::spam-keyword-trio
      - id: objectives/supply-chain/hidden-payload/spam::readme-gambling-copy
      - id: metadata/package/manifest/description::gambling-casino-claim
      - id: metadata/package/manifest/description::gambling-blackjack-claim
      - id: metadata/package/manifest/description::gambling-poker-claim
      - id: metadata/package/manifest/description::gambling-sports-betting-claim
