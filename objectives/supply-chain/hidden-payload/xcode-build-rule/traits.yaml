# Xcode custom build rules execute a concealed remote shell payload stored in
# a build setting. Setting indirection alone is legitimate build automation.
defaults:
  platforms: [macos, ios]
  for: [pbxproj]
  attack: T1195.002,T1027,T1059.004,T1105

composite_rules:
  - id: xcode-build-rule-indirect-payload-execution
    desc: Xcode rule runs concealed remote shell payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/build::xcode-script-runs-setting
      - id: micro-behaviors/process/create/shell/build::xcode-setting-shell-pipeline
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
    any:
      - id: micro-behaviors/communications/http/download/encoded::encoded-remote-shell-fetch
      - id: micro-behaviors/communications/http/download/encoded::encoded-remote-substitution-fetch
