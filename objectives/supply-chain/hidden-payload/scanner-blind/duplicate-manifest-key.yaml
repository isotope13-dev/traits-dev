# A package.json that declares the same top-level key twice reads differently
# depending on who parses it. `JSON.parse` — and therefore npm, yarn and pnpm —
# keeps the LAST occurrence; the lenient, streaming and first-wins parsers used
# by audit tooling and registry scanners keep the FIRST. An attacker who
# duplicates `scripts` ships one manifest that shows the reviewer an empty
# lifecycle block and hands the installer a `postinstall`, with no obfuscation
# and nothing hostile anywhere in the tree for behavioral analysis to find.
#
# Only `scripts` is matched. It is the one duplicated key that turns a parser
# disagreement directly into install-time code execution, and npm defines no
# nested `scripts` key anywhere else in the manifest — unlike `bin`, which also
# appears as `directories.bin` and would fire on ordinary packages that declare
# both.
#
# The engine already reports ANY duplicate manifest key as
# `metadata/manifest/malformed-json`, weighting an inert duplicate `author`
# (npm-init scaffolding left over in the source repo — @braintree/sanitize-url
# has carried one since at least 2.0.2) the same as a weaponized duplicate
# `scripts`. This separates the two: it fires only when the duplicated key is
# the one that executes.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  attack: T1195.002
composite_rules:
  # The trick is a *top-level* `scripts` key declared twice so a scanner reads
  # the first block and npm runs the second. A package that duplicates `scripts`
  # while declaring an install-time lifecycle hook (preinstall, postinstall, etc.)
  # turns a parser disagreement into hidden install-time code execution.
  # When no lifecycle hook is present, a duplicate scripts block is inert
  # legacy scaffolding (e.g. npm-init placeholder test script alongside a real
  # test script) rather than a scanner-blinding attack.
  - id: duplicate-scripts-key
    desc: Duplicate scripts block with lifecycle hook
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/format/conformance::package-json-duplicate-scripts-key
    any:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/scripts/lifecycle::filtered-raw-preinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-raw-postinstall-hook
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
