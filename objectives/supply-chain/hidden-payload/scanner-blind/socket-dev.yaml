# A package that ships configuration telling the registry's own scanner not to
# report on it. Amazon Inspector cited exactly this in MAL-2026-13397: "a
# socket.json file suppresses security scanning categories matching the
# package's malicious behavior."
#
# The distinction that matters is WHICH categories are silenced.
#
#   Capability categories (shellAccess, filesystemAccess, networkAccess,
#   nativeCode, obfuscatedCode, envVars) describe what the package does. A
#   project with a documented reason to hold that capability legitimately
#   declares it, so silencing those is not evidence of anything and stays with
#   the neutral facts in metadata/package/config.
#
#   Verdict categories (malware, aiMalware, gptMalware, gptSecurity,
#   gptAnomaly, didYouMean/typosquat, troll, socketOverride) are the scanner's
#   conclusions, not capabilities a package can honestly claim. Turning those
#   off buys nothing but silence on the finding that would have caught you.
#
# Both composites require the Socket config identity, so an unrelated JSON
# document that happens to carry an `ignore` value cannot trip them.
#
# Reachability: cleave types `socket.json` as JSON and scans it. It types
# `socket.yml` as `unknown` and does not scan it at all — no `for:` value
# reaches that file today, so only the JSON spelling is covered. These match on
# text rather than a parsed value path so that both spellings light up the day
# the engine gains a YAML type, with no rule change.
defaults:
  platforms: [linux, macos, windows]
  for: [json, text, data]
  attack: T1562.001
  mbc: E1562
traits:
  - id: malware-verdict-silenced
    desc: Scanner malware verdict set to ignore
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)"?\b(malware|aiMalware|gptMalware)"?\s*:\s*"?(ignore|false)"?'
  - id: llm-verdict-silenced
    desc: Scanner LLM-review verdict set to ignore
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)"?\b(gptSecurity|gptAnomaly|troll)"?\s*:\s*"?(ignore|false)"?'
  - id: identity-verdict-silenced
    desc: Scanner name-deception verdict set to ignore
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)"?\b(didYouMean|typosquat)"?\s*:\s*"?(ignore|false)"?'
  # The wildcard key must OPEN A RULE BLOCK. A TypeScript `paths` mapping
  # (`"*": ["./src/*"]`) also keys on `*`, and every tsconfig.json in a
  # monorepo carries one; requiring an object rather than a value keeps this
  # off them.
  - id: wildcard-package-rule-key
    desc: Scanner rule keyed to every package
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s*"?\*"?\s*:\s*\{?\s*$'
  - id: issue-category-silenced
    desc: Scanner issue category set to ignore
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*"?[a-z]{3,30}"?\s*:\s*"?ignore"?,?\s*$'

composite_rules:
  - id: package-silences-scanner-malware-verdicts
    desc: Package config silences scanner malware verdicts
    crit: suspicious
    conf: 0.95
    any:
      - id: malware-verdict-silenced
      - id: llm-verdict-silenced
      - id: identity-verdict-silenced
    all:
      - id: metadata/package/tooling/
  - id: package-silences-scanner-for-every-dependency
    desc: Package config silences scanner for every package
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/tooling::socket-scanner-package-rules-block
      - id: wildcard-package-rule-key
      - id: issue-category-silenced
    # Keep the wildcard key and the silenced category inside one rule block
    # rather than anywhere in the document.
    near_lines: 12
