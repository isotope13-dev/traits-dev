# Ignore-file configs for AI coding-assistant code review/indexing tools
# (Cursor, Aider, Cline, Codeium, Gemini CLI, and the generic .aiexclude
# spelling some agent harnesses read). A single one of these is a normal
# developer preference — plenty of repos configure the one assistant they
# use. Shipping configs for many *different* assistants at once inside a
# small published package is not a developer's personal editor preference;
# nobody hand-maintains six overlapping ignore lists for tools they don't
# use. Seen in gocommunity.io/orderedbtree@v1.3.0 (Aikido-flagged), which
# bundled all six spellings (plus .snyk/.hacktron SAST-exclusion configs),
# every one of them excluding the exact `deprecated/` directory that hid an
# AES-GCM decrypt-and-`go run` backdoor (see
# objectives/supply-chain/hidden-payload/runtime::go-decrypt-embedded-archive-then-build-run).
#
# Matched against the archive's structured member list rather than a byte
# scan: files with no recognized extension are typed `unknown` and excluded
# from cleave's per-file `for:` walk, but the archive container's own value
# tree still lists every member path regardless of that member's type.
defaults:
  platforms: [linux, macos, windows]
  for: [zip, tar, npm, jar, whl, gem]
  attack: T1562.001

traits:
  - id: cursor-ignore-member
    desc: Archive ships a Cursor AI ignore-file
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.cursorignore$'

  - id: aider-ignore-member
    desc: Archive ships an Aider AI ignore-file
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.aiderignore$'

  - id: cline-ignore-member
    desc: Archive ships a Cline AI ignore-file
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.clineignore$'

  - id: codeium-ignore-member
    desc: Archive ships a Codeium AI ignore-file
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.codeiumignore$'

  - id: gemini-ignore-member
    desc: Archive ships a Gemini CLI ignore-file
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.geminiignore$'

  - id: generic-ai-exclude-member
    desc: Archive ships a generic AI-agent ignore-file
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.aiexclude$'

composite_rules:
  - id: package-blinds-multiple-ai-code-reviewers
    desc: Package excludes itself from many AI code reviewers
    crit: suspicious
    conf: 0.93
    needs: 4
    any:
      - id: cursor-ignore-member
      - id: aider-ignore-member
      - id: cline-ignore-member
      - id: codeium-ignore-member
      - id: gemini-ignore-member
      - id: generic-ai-exclude-member
