# A published package whose modules sit below the depth archive analysis walks.
#
# `osinthell` ships an index.js that requires 26 modules from
# `public/a/b/c/.../z/`, and nothing else of substance: the manifest still has
# npm-init's placeholder test script and a one-word description. Analysis of
# the tarball reports two members out of twenty-nine, because everything past
# ten path components is skipped -- so the package that writes an HTA to temp
# and launches it through mshta reads as a package containing an index.js.
#
# The require path is the leg that survives, since the entry point is shallow
# enough to be read. Pairing it with the unfinished manifest separates this
# from a deep but ordinary source tree.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]
  attack: T1027,T1195.002
  mbc: B0032

composite_rules:
  - id: npm-modules-buried-below-analysis-depth
    desc: Package buries its modules below scan depth
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: micro-behaviors/process/create/load/local::deep-single-letter-require-path
      - id: metadata/package/scripts/develop::npm-init-default-test
      - id: metadata/package/description::short-description
