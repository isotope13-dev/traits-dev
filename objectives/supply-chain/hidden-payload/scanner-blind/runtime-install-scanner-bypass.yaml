# A runtime helper documents deliberately hiding its subprocess dependency from
# the host's install-time security scanner.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1562.001

traits:
  - id: install-scanner-evasion-disclosure
    desc: Documents bypassing an install security scanner
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)spawn helpers that DON.T trip.{0,100}install-time security scanner'

  - id: assembles-child-process-module
    desc: Assembles the Node subprocess module dynamically
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)["'']child["''];.{0,100}["'']process["''];.{0,120}["'']node:["'']\s*\+'

composite_rules:
  - id: runtime-install-scanner-evasion
    desc: Constructs subprocess import to evade install scanning
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: install-scanner-evasion-disclosure
      - id: assembles-child-process-module
