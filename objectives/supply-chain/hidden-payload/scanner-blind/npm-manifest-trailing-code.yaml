# JavaScript appended past a package.json object (filefacts
# `npm.manifest.trailing_code`). No manifest needs it, and loaders that
# evaluate the file as script run it. cleave analyzes the trailer itself as
# an embedded JavaScript layer.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-manifest-trailing-javascript
    desc: JavaScript appended after package.json object
    crit: suspicious
    conf: 0.95
    attack: T1195.002
    if:
      type: metrics
      field: npm.manifest.trailing_code
      min: 1
