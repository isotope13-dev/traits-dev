# File-Read-Eval Dropper Detection
# Detects the pattern of reading a file, transforming its content, and eval'ing the result
# This is a common supply-chain attack technique where encrypted/encoded payloads are
# stored in innocuous-looking files (LICENSE, README, data files) and decrypted at runtime
# ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain)
# MBC: B0024 (Execution Guardrails)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002
traits:
- id: js-delayed-eval-timeout
  desc: setTimeout delays an eval() call
  crit: notable
  conf: 0.9
  attack: T1059.007
  if:
    type: text
    regex: 'setTimeout\s*\(\s*function\s*\(\s*\)\s*\{[^}]{0,160}\beval\s*\('
# Require direct data flow from readFileSync through a transform into eval.
# A plain eval(require('fs').readFileSync(...)) is a local source loader, not
# evidence that an encoded payload was transformed.
- id: eval-transformed-readfilesync
  desc: eval executes transformed readFileSync content
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: 'eval\s*\(\s*[A-Za-z_$]\w{0,30}\s*\(\s*(\w+\.)?readFileSync\s*\('
- id: eval-transformed-inline-fs-read
  desc: eval transforms inline fs file content
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: 'eval\s*\(\s*[A-Za-z_$]\w{0,30}\s*\(\s*require\(["'']fs["'']\)\.readFileSync\s*\('
  # Inline decoder functions are common in legacy JS packers, so keep this
  # as packed-payload component evidence instead of a standalone eval finding.
- id: eval-inline-function-transform
  desc: eval wraps inline transform function
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'eval(function'
  unless:
  - id: well-known/tool/packaging/dean-edwards-packer::dean-edwards
  - id: metadata/package/testing/
  # Function-constructor use is a neutral dynamic-execution capability. The
  # canonical atom lives in micro-behaviors; supply-chain intent comes from
  # the surrounding payload/decoder composites below.
  # Core dropper pattern: small JS file that reads a file and eval's transformed content
  - id: "metadata/file/naming::test-directory-component"
- id: thenify-create-wrapper-eval
  desc: thenify eval createWrapper helper
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: return eval(createWrapper($$__fn__$$.name, options))
- id: hardcoded-hex-buffer-from-ast
  desc: Hardcoded hex Buffer material
  crit: notable
  conf: 0.82
  mbc: C0027
  count_min: 2
  size_max: 2097152
  if:
    type: text
    regex: "Buffer\\.from\\(['\"][0-9a-fA-F]{32,}['\"]\\s*,\\s*['\"]hex['\"]\\)"
  unless:
  - id: metadata/package/testing/harness/runtime/
composite_rules:
- id: npm-published-packed-function-loader
  for: [npm, package.json, javascript, typescript]
  desc: NPM package carries a packed dynamic-code loader
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1027,T1059.007
  mbc: B0024
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: objectives/anti-static/obfuscation/eval/function::packed-function-constructor-decoder
  - id: metadata/build/minifier::js-large-minified-bundle

# An npm archive is a meaningful supply-chain boundary even when it has no
# install hook: this shape activates when browser code shipped in the archive
# fetches a module and evaluates it through an obfuscated Function sink.
- id: public-npm-obfuscated-fetch-loader
  desc: Public npm archive carries an obfuscated fetch-and-Function loader
  crit: hostile
  conf: 0.99
  for: [npm, package.json, javascript, typescript]
  attack: T1195.002,T1027,T1059.007,T1105
  mbc: E1195.016
  scope: archive
  all:
  - id: metadata/package/publishing::npm-public-publish-access
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/metaprogramming/generation::js-new-function-variable-argument
  - id: objectives/anti-static/obfuscation/eval/loader::obfuscated-function-constructor-payload
- id: packed-charcode-indirect-eval-loader
  desc: Large JS char-code decoder feeds indirect eval
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007
  mbc: B0032
  all:
  - id: metadata/file/profile/text-shape::numeric-or-long-line-source
  - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  unless:
  - id: well-known/app/browser/google-web::google-recaptcha-runtime
- id: self-defending-string-table-function-loader
  desc: Self-defending string-array feeds Function loader
  # Keyv/math_init-class payloads wrap a string-table Function constructor
  # behind js-obfuscator's self-defending control flow — packers alone rarely
  # combine both at this density without a follow-on credential harvest.
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007
  mbc: B0032
  all:
  - id: objectives/anti-static/obfuscation/string/array::self-defending-string-array
  - id: metadata/lang/source/syntax/call/arguments::js-constructor-hex-indexed-arguments
  - id: micro-behaviors/metaprogramming/generation::function-ctor-call-expr-arg
- id: file-read-eval-dropper
  desc: Reads file and eval()s transformed content
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/import/builtin::require-fs
  - id: micro-behaviors/fs/read/file/full::read-text-utf8
  - id: metadata/file/size::javascript-small-file-5k
  any:
  - id: eval-transformed-readfilesync
  - id: eval-transformed-inline-fs-read
  unless:
  - id: well-known/lib/data/duckdb/
  - id: metadata/build/
  - id: metadata/package/testing/presence/path::test-spec-path-benign-context
- id: local-payload-transform-eval
  desc: Local payload file transformed then eval
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/import/builtin::require-fs
  - id: micro-behaviors/fs/path/self::script-directory-path-join
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
  - id: micro-behaviors/fs/read/file/full::read-text-utf8
  unless:
  - id: well-known/tool/packaging/dean-edwards-packer::dean-edwards
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: micro-behaviors/process/interpreter/eval/indirect::emscripten-run-script-reference
- id: blockchain-remote-payload-eval
  desc: Blockchain dead-drop payload eval
  crit: hostile
  conf: 0.98
  mbc: B0024
  attack: T1102
  all:
  - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::blockchain-c2-fetch
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  # Small module that exports a decryption function with hardcoded crypto keys.
  # Common in supply-chain attacks where a separate utility module handles
  # payload decryption (e.g., AES decrypt with embedded key/IV).
- id: supply-chain-crypto-decryptor
  desc: Exported decryptor module with embedded keys
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::hardcoded-key-decryptor
  - id: metadata/file/size::javascript-small-file-5k
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::exported-decryptor
- id: ast-crypto-decryptor
  desc: AST-confirmed decryptor with embedded keys
  crit: hostile
  conf: 0.96
  mbc: C0027
  all:
  - id: micro-behaviors/crypto/decrypt::createDecipheriv
  - id: hardcoded-hex-buffer-from-ast
  - id: micro-behaviors/data/decode/hex::node-update-with-hex-buffer
  - id: metadata/file/size::javascript-small-file-5k
  any:
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::exported-decryptor
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::hardcoded-key-decryptor
- id: tiny-base64-dynamic-dispatch-loader
  desc: Tiny Base64-decoded globalThis dispatch loader
  crit: suspicious
  conf: 0.96
  attack: T1027,T1059.007
  all:
  - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
  - id: micro-behaviors/data/control-flow/dispatch::globalthis-computed-property-call
  - id: metadata/file/size::javascript-small-file-5k
  unless:
  - id: metadata/package/testing/
# Self-contained packed eval dropper: a megabyte-plus single line that carries
# a self-decoder (Caesar/char-code) and feeds the result straight into eval().
# File-scoped, metric-driven, and filename-agnostic — fires on any single JS
# file of this shape, no package.json or archive context required. The megabyte
# single-line atom already excludes source maps, vscode webviews, tiktoken, and
# many-module bundles, so legit minified output does not reach here; a 1 MB line
# that self-decodes into eval has no benign explanation.
  - id: "metadata/file/naming::test-directory-component"
- id: packed-payload-exec-sink
  desc: Dynamic execution sink for a packed payload
  crit: component
  conf: 0.95
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
  - id: eval-inline-function-transform
  - id: micro-behaviors/metaprogramming/generation::function-ctor-call-expr-arg
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-text
  - id: objectives/anti-static/obfuscation/eval/loader::indirect-ctor-transform-iife
  # Text-mode sink: the AST-anchored legs above cannot fire on a payload large
  # enough to defeat the JavaScript parser, which is precisely this shape.
  - id: objectives/anti-static/obfuscation/eval/function::function-ctor-wraps-inline-function
- id: packed-charcode-decoder
  desc: Char-code decoder reconstructs payload data
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/data/encode/charcode::charcodeat-arithmetic
  - id: micro-behaviors/data/decode/custom::fromcharcode-map-array
- id: huge-numeric-array-indirect-eval
  desc: Huge numeric array indirect eval loader
  crit: hostile
  conf: 0.97
  near_bytes: 8192
  mbc: B0032
  attack: T1027,T1059.007
  all:
  - id: metadata/file/arithmetic::js-extreme-digit-ratio-large-source
  - id: micro-behaviors/data/string/conversion::js-fromcharcode-alias
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  any:
  - id: micro-behaviors/data/control-flow/loop::js-length-loop-compound-add
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-text
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: megabyte-charcode-direct-eval-loader
  desc: Megabyte charcode-packed payload feeds direct eval
  crit: hostile
  conf: 0.97
  mbc: B0032
  attack: T1027,T1059.007
  all:
  - id: objectives/anti-static/obfuscation/encoding/numeric::charcode-packed-numeric-source
  - id: eval-inline-function-transform
- id: packed-single-line-eval-dropper
  desc: Megabyte single-line self-decoding eval dropper
  crit: hostile
  conf: 0.96
  mbc: B0032
  attack: T1027
  all:
  - id: packed-payload-exec-sink
  - id: metadata/file/profile/text-shape::numeric-or-long-line-source
  - id: packed-charcode-decoder
  unless:
  # Never exclude on the whole `structure/` directory: its long-line shape
  # atoms hold for every single-line file, which made this composite
  # unreachable for the exact payload shape it describes. Only the two benign
  # long-line contexts belong here — genuine minifier output (thousands of
  # source lines) and an inline source map.
  - id: objectives/anti-static/obfuscation/code-metrics/structure::minification-pattern
  - id: objectives/anti-static/obfuscation/code-metrics/structure::source-map-inline
  # minification-pattern's line-count atoms are size-capped at 1 MB, so a
  # larger bundle (a VS Code webview with thousands of lines and one huge
  # chunk) never qualifies. The line count itself is the benign context.
  - id: metadata/file/line::javascript-over-1000-lines
  # Pyodide's Emscripten-generated runtime is intentionally a megabyte-scale
  # single line and uses eval() for EM_ASM/EM_JS wrappers and async script
  # loading. Its independent path + content identity distinguishes that runtime
  # machinery from an anonymous self-decoding package payload.
  - id: well-known/lib/runtime/scripted/pyodide::pyodide-runtime-bundle
  # Known bundler runtime markers (webpack/rollup/vite), not bare minified-line
  # heuristics — install-hook droppers are one-line packed eval stages.
  - id: metadata/build/bundler/asset::js-known-bundler-output
- id: js-delayed-hex-eval-stage
  desc: Delayed eval of a hex-decoded JavaScript payload
  crit: hostile
  conf: 0.97
  mbc: B0032
  attack: T1027,T1059.007
  all:
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
  - id: js-delayed-eval-timeout
- id: js-buffer-base64-repeating-key-xor-function-stager
  desc: Buffer Base64 XOR decode feeds Function constructor stager
  crit: hostile
  conf: 0.98
  mbc: B0032
  attack: T1027,T1059.007,T1140
  scope: file
  near_bytes: 1200
  all:
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/data/decode/xor::js-repeating-key-buffer-xor-loop
  any:
  - id: micro-behaviors/metaprogramming/generation::function-ctor-call-expr-arg
  - id: micro-behaviors/metaprogramming/generation::js-function-call-commonjs-wrapper
# The install-hook sibling of the packed loaders above: the declared
# postinstall hook runs a shipped Node module whose body is a packed eval
# stage (single-line generated concatenation feeding eval; see the
# eval-loader packed-eval-module composites). npm executes the hook on every
# install, so whatever the packed blob builds is attacker-chosen code with
# install-time reach, and the module usually exports the same loader for
# runtime use. Worked example: baileys-mbuilder 4.5.0-lts / 4.5.3-cjs, whose
# postinstall runs a 5 MB single-line JSFuck eval blob exporting auto-update
# hooks.
- id: postinstall-runs-packed-eval-module
  desc: postinstall hook runs a packed eval module
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1059.007
  mbc: B0024
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: objectives/anti-static/obfuscation/eval/loader::single-line-packed-eval-module
  unless:
  - id: well-known/lib/runtime/scripted/electron::electron-app-resources-path

# testmetest-class npm stubs: a skeleton manifest points main at a two-line
# module that exports {} while embedding a megabyte-scale hex blob (often with
# an embedded PE) the source never references — staged supply-chain payload.
- id: npm-empty-export-hex-stuffed-main
  desc: Skeleton package main hides megabyte hex blob
  crit: hostile
  conf: 0.97
  attack: T1027,T1195.002
  mbc: B0032
  for: [javascript, typescript, package.json, npm]
  scope: archive
  all:
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: metadata/package/entrypoint::pkg-main-field
  - id: metadata/file/line::js-large-at-most-two-lines
  - id: metadata/lang/javascript-features::module-exports-object
  - id: micro-behaviors/data/encode/hex::js-hex-string-stash-literal
  unless:
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/package/testing/presence/fixture/
  - id: metadata/package/testing/presence/harness/
