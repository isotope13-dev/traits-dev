defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
traits:
- id: js-delayed-eval-timeout
  desc: setTimeout delays an eval() call
  crit: notable
  conf: 0.9
  attack: T1059.007
  if:
    type: text
    regex: setTimeout\s*\(\s*function\s*\(\s*\)\s*\{[^}]{0,160}\beval\s*\(
- id: eval-transformed-readfilesync
  desc: eval executes transformed readFileSync content
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: eval\s*\(\s*[A-Za-z_$]\w{0,30}\s*\(\s*(\w+\.)?readFileSync\s*\(
- id: eval-transformed-inline-fs-read
  desc: eval transforms inline fs file content
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: eval\s*\(\s*[A-Za-z_$]\w{0,30}\s*\(\s*require\(["']fs["']\)\.readFileSync\s*\(
- id: thenify-create-wrapper-eval
  desc: thenify eval createWrapper helper
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: return eval(createWrapper($$__fn__$$.name, options))
- id: hardcoded-hex-buffer-from-ast
  desc: Hardcoded hex Buffer material
  crit: notable
  conf: 0.82
  mbc: C0027
  count_min: 2
  size_max: 2097152
  if:
    type: text
    regex: Buffer\.from\(['"][0-9a-fA-F]{32,}['"]\s*,\s*['"]hex['"]\)
  unless:
  - id: metadata/package/testing/harness/runtime/
composite_rules:
- id: npm-published-packed-function-loader
  for:
  - npm
  - package.json
  - javascript
  - typescript
  desc: NPM package carries a packed dynamic-code loader
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1027,T1059.007
  mbc: B0024
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: objectives/anti-static/obfuscation/eval/function::packed-function-constructor-decoder
  - id: metadata/build/minifier::js-large-minified-bundle
- id: public-npm-obfuscated-fetch-loader
  desc: Public npm archive carries an obfuscated fetch-and-Function loader
  crit: hostile
  conf: 0.99
  for:
  - npm
  - package.json
