defaults:
  platforms:
  - linux
  - windows
  - unix
  for:
  - alpine_apk
  - apk_alpine
  - tar
  - pkginfo
  - text
  - python
  - ruby
  - javascript
  - package.json
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: alpine-apk-python-packed-exec
    desc: Alpine apk ships exec() of a decompressed Python payload
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/anti-static/obfuscation/payload/encoded/exec::python-packed-payload

  - id: alpine-apk-delayed-hex-eval
    desc: Alpine apk ships a delayed hex-eval install stage
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/files/system-package::alpine-pkginfo-origin-field
      - id: objectives/supply-chain/hidden-payload/eval::js-delayed-hex-eval-stage

