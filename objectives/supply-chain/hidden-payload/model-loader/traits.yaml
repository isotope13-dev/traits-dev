# Repository-controlled model loaders can turn configuration into code-loading
# instructions. These rules describe the concrete Diffusers-shaped artifacts
# cited in the advisory: model_index.json points at Python modules, and a
# default-derived None.py module subclasses a pipeline and executes at import.
# The metadata atoms remain suspicious because custom model code can be
# legitimate; hostile verdicts require the exact sentinel or an import-time
# process-launch combination.
defaults:
  platforms: [windows, unix]
  for: [python, json]
  attack: T1195.002

traits:

  - id: torch-pickle-gitconfig-literal
    desc: Pickle string names the Git config file
    crit: notable
    conf: 0.96
    for: [pickle]
    if:
      type: literal
      kind: string
      substr: .gitconfig

  - id: torch-pickle-whoami-literal
    desc: Pickle string references user identity
    crit: notable
    conf: 0.96
    for: [pickle]
    if:
      type: literal
      kind: string
      word: whoami

  - id: torch-pickle-http-client-literal
    desc: Pickle string references an HTTP client
    crit: notable
    conf: 0.96
    for: [pickle]
    if:
      type: literal
      kind: string
      regex: (urlopen|requests\.post)

  - id: sentinel-python-module-name
    desc: Python module uses the None.py loader sentinel
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: basename
      exact: None.py

  - id: model-index-pipeline-class
    desc: Model index names a pipeline class
    crit: notable
    conf: 0.94
    for: [json]
    if:
      type: value
      path: _class_name
      regex: '(?i)^[A-Za-z_]\w*Pipeline$'

  - id: model-index-custom-pipeline-python
    desc: Model index selects a Python custom pipeline
    crit: suspicious
    conf: 0.96
    for: [json]
    if:
      type: value
      path: custom_pipeline
      regex: '(?i)\.py$'

  - id: model-index-custom-component-python
    desc: Model index references a Python component module
    crit: suspicious
    conf: 0.95
    for: [json]
    if:
      type: value
      path: 'unet[*]'
      regex: '(?i)\.py$'

  - id: model-index-sentinel-python
    desc: Model index names the None.py module
    crit: suspicious
    conf: 0.99
    for: [json]
    if:
      type: value
      path: custom_pipeline
      exact: None.py

composite_rules:
  - id: torch-pickle-profile-exfil-source
    desc: Pickle strings collect and send host data
    crit: suspicious
    conf: 0.98
    for: [pickle]
    scope: file
    all:
      - id: torch-pickle-gitconfig-literal
      - id: torch-pickle-whoami-literal
      - id: torch-pickle-http-client-literal


  # A package that deserializes a bundled PyTorch checkpoint the moment it is
  # imported.
  #
  # `torch.load` runs the pickle inside the file, so loading an untrusted
  # checkpoint is arbitrary code execution -- this is the mechanism behind the
  # PyTorch model-weights advisories, and `weights_only=False` (still the
  # default in older torch) makes it unconditional. A real SDK loads its model
  # lazily, inside the function that needs it, from a path the caller supplies.
  # Doing it at *import* over a checkpoint shipped *in the package* means every
  # `import <pkg>` deserializes attacker-controlled bytes, before the caller
  # has done anything.
  #
  # Archive-scoped: the checkpoint is a package data file, the `torch.load` call
  # is in `__init__.py`, and the module-level execution is a property of that
  # file -- three members of one distribution.
  #
  # Worked example: an "AI Labs SDK" whose `__init__.py` does
  # `model = torch.load(os.path.join(dirname, "model.pt"), weights_only=False)`
  # at module scope, with `model.pt` bundled alongside.
  - id: import-time-torch-checkpoint-load
    desc: Bundled torch checkpoint deserialized at import
    crit: hostile
    conf: 0.95
    scope: archive
    for: [python, package.json, tar, zip, whl]
    attack: "T1195.002,T1059.006"
    mbc: "E1027"
    # The import-time leg has to be the `torch.load` itself. Pairing a
    # `torch.load` anywhere with a module-level call anywhere convicted any ML
    # distribution: under archive scope the two need not even share a file, and
    # `module-level-side-effect-call` fires on the ordinary module-scope
    # `argparse.ArgumentParser(...)` that every example script opens with. Ray's
    # ray/tune/examples/mnist_pytorch_trainable.py was read that way -- its
    # `torch.load` is inside `load_checkpoint(self, checkpoint_dir)`, restoring
    # a checkpoint the trainable itself wrote a few lines earlier with
    # `torch.save`, which is the opposite of a bundled payload.
    all:
      - id: micro-behaviors/data/serialize/unsafe::module-scope-torch-load
      - id: metadata/archive/member/extension::pytorch-checkpoint-member
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
      - id: well-known/lib/ai/e3nn::e3nn-wigner-context

  # PyTorch's ZIP checkpoint is itself a container around data.pkl. A reduce
  # callable that names builtins.exec is enough to make torch.load execute
  # serialized source; requiring that global, the checkpoint member, and a
  # module-level load inside a top-level try ties the execution path together.
  - id: import-time-executable-torch-checkpoint
    desc: Import-time PyTorch load executes bundled pickle code
    crit: hostile
    conf: 0.99
    scope: outer
    for: [python, package.json, pickle, tar, zip, whl]
    attack: "T1195.002,T1059.006"
    mbc: "E1027"
    all:
      - id: micro-behaviors/data/serialize/unsafe::module-scope-try-torch-load
      - id: metadata/archive/member/extension::pytorch-checkpoint-member
      - id: metadata/import/builtin::pickle-builtins-exec
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file

  # A PyTorch checkpoint can execute its pickle reducer without exposing
  # ordinary Python source files. Require the serialized code to collect the
  # user's Git config and identity and pass it to an HTTP client.
  - id: import-time-torch-pickle-host-profile-exfil
    desc: Import-time pickle exfiltrates host profile
    crit: hostile
    conf: 0.995
    scope: outer
    for: [python, pickle, zip, whl, python-sdist]
    attack: T1195.002,T1059.006,T1005,T1041
    mbc: E1027
    all:
      - id: import-time-executable-torch-checkpoint
    any:
      - id: torch-pickle-profile-exfil-source

  # This is the concrete implicit-default path: the unresolved custom
  # pipeline becomes None.py and a pipeline subclass is loaded from the repo.
  - id: implicit-model-python-module
    desc: Model pipeline uses implicit None.py code module
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: sentinel-python-module-name
      - id: well-known/lib/ai/huggingface::diffusers-pipeline-subclass

  # The module-scope process call makes the code-loading capability an actual
  # import-time execution path, rather than merely a custom pipeline class.
  - id: model-module-import-time-process
    desc: Diffusion pipeline module launches a process on import
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: well-known/lib/ai/huggingface::diffusers-pipeline-subclass
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
    near_lines: 80

  - id: model-index-custom-pipeline-loader
    desc: Model index selects repository Python pipeline code
    crit: suspicious
    conf: 0.97
    for: [json]
    all:
      - id: model-index-pipeline-class
      - id: model-index-custom-pipeline-python

  - id: model-index-custom-component-loader
    desc: Model index selects repository Python component code
    crit: suspicious
    conf: 0.96
    for: [json]
    all:
      - id: model-index-pipeline-class
      - id: model-index-custom-component-python

  - id: model-index-implicit-python-loader
    desc: Model index combines pipeline metadata with None.py
    crit: hostile
    conf: 0.99
    for: [json]
    all:
      - id: model-index-pipeline-class
      - id: model-index-sentinel-python
