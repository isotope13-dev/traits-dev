# Require both explicit install-scanner evasion and an unattended package
# updater before calling this update service hostile.
# Atoms match source inside the package. The composite also names the npm
# container so package scope can join those member findings.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1562.001

traits:
  - id: noninteractive-openclaw-plugin-update
    desc: Auto-confirms an OpenClaw package update
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'yes\s*\|\s*openclaw plugins update'

  - id: defaults-to-enabled-auto-apply
    desc: Defaults package updates to auto-apply
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'auto-apply[\s\S]{0,300}toBool\(raw\.enabled,\s*true\)'

composite_rules:
  - id: scanner-evasive-unattended-plugin-update
    desc: Evades install scanning and applies plugin updates unattended
    crit: hostile
    conf: 0.99
    for: [npm, javascript, typescript]
    scope: package
    all:
      - id: objectives/supply-chain/hidden-payload/scanner-blind::runtime-install-scanner-evasion
      - id: noninteractive-openclaw-plugin-update
      - id: defaults-to-enabled-auto-apply
