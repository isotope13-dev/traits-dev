defaults:
  platforms: [windows]
  for: [text, source, scripts, powershell, python, batch, shell, csharp, javascript, typescript, go, rust]

composite_rules:
  - id: wsus-database-update-injection
    desc: WSUS update database injection
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/application/update::wsus-update-import-procedure
      - id: micro-behaviors/os/application/update::wsus-xml-fragment-save-procedure
      - id: micro-behaviors/os/application/update::wsus-commandline-update-xml
      - id: micro-behaviors/os/application/update::wsus-update-batch-url
  - id: wsus-surgical-update-deployment
    desc: WSUS single-computer update deployment
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/application/update::wsus-target-group-create-procedure
      - id: micro-behaviors/os/application/update::wsus-computer-target-lookup
      - id: micro-behaviors/os/application/update::wsus-computer-target-add-procedure
      - id: micro-behaviors/os/application/update::wsus-update-deploy-procedure
  - id: wsus-ntlm-relay-to-update-database
    for: [source, '!objectivec', '!typescript', batch, javascript, lua, perl, php, powershell, python, ruby, vbs]
    desc: NTLM relay to WSUS update database
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/security/auth/ntlm::ntlmrelayx-mssql-target
      - id: objectives/lateral-movement/smb::petitpotam-coercion-command
      - id: micro-behaviors/data/db/access::wsus-susdb-sql-session
