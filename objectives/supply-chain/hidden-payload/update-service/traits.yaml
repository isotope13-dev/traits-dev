# WSUS update infrastructure abuse. Neutral procedure, XML, and HTTP
# mechanics live in micro-behaviors; these rules require their attack-shaped
# combination rather than matching article prose or a product name alone.
defaults:
  platforms: [windows]
  for: [scripts, source, xml]
  attack: T1195.002

traits:
  - id: wsus-batch-url-exempt-extension
    desc: WSUS MUURL uses an exempt suffix
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bMUURL\s*=\s*\\?["''].{0,120}\.(txt|esd)\b'

  - id: flag-disabled-near-certificate
    desc: Flag disabled before certificate validation
    crit: suspicious
    conf: 0.98
    for: [csharp]
    if:
      type: text
      regex: '(?is)\bflag\s*=\s*false\b.{0,200}(certificate|signature)\b'

  - id: verifier-flag-certificate-guard
    desc: Flag guards a certificate check
    crit: suspicious
    conf: 0.98
    for: [csharp]
    if:
      type: text
      regex: '(?is)\bif\s*\(\s*flag\s*\).{0,160}CheckCertificateSignature\s*\('

composite_rules:
  - id: update-verifier-extension-bypass
    desc: Verifier skips checks for exempt suffixes
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1553
    near_lines: 80
    all:
      - id: micro-behaviors/fs/path/extension::csharp-checks-txt-suffix
      - id: micro-behaviors/fs/path/extension::csharp-checks-esd-suffix
      - id: flag-disabled-near-certificate
      - id: verifier-flag-certificate-guard

  - id: wsus-content-sync-agent-verifier-bypass
    desc: WSUS verifier skips certificate checks
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1553
    all:
      - id: micro-behaviors/os/service/identity::wsus-content-sync-agent-context
      - id: update-verifier-extension-bypass

  - id: wsus-malicious-update-database-chain
    desc: WSUS SQL chain deploys a payload
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1105
    near_lines: 80
    all:
      - id: micro-behaviors/os/service/identity::wsus-batch-url-procedure-call
      - id: wsus-batch-url-exempt-extension
      - id: micro-behaviors/os/service/identity::wsus-update-file-metadata
      - id: micro-behaviors/os/service/identity::wsus-commandline-install-handler
      - id: micro-behaviors/os/service/identity::wsus-update-deployment-procedure
      - id: micro-behaviors/os/service/identity::wsus-target-group-creation-procedure
    any:
      - id: micro-behaviors/os/service/identity::wsus-target-computer-membership-procedure

  - id: wsus-bits-payload-factory
    desc: WSUS range server delivers a payload
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1105,T1071.001
    near_lines: 120
    all:
      - id: micro-behaviors/os/service/identity::wsus-batch-url-procedure-call
      - id: wsus-batch-url-exempt-extension
      - id: micro-behaviors/os/service/identity::wsus-update-file-metadata
      - id: micro-behaviors/os/service/identity::wsus-commandline-install-handler
      - id: micro-behaviors/communications/http/server/range::range-aware-http-file-server

  - id: wsus-targeted-update-deployment
    desc: Targeted WSUS update deployment
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/identity::wsus-target-group-creation-procedure
      - id: micro-behaviors/os/service/identity::wsus-update-deployment-procedure
    any:
      - id: micro-behaviors/os/service/identity::wsus-target-computer-membership-procedure
      - id: wsus-batch-url-exempt-extension
