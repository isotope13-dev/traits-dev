# Abuse of Configuration Manager application deployment is distinguishable from
# ordinary WMI process creation by the SMS Provider objects it authors.  The
# application digest supplies the command, SMS_ApplicationAssignment scopes and
# forces delivery, and offensive implementations commonly hide the application
# from the console and delete both objects after the client checks in.  Match
# those protocol/object fields so ports of the technique remain visible.
defaults:
  platforms: [windows, unix]
  for: [source, scripts, binaries, -swift, -objectivec, -groovy, -scala, -elixir]
  attack: T1072

composite_rules:
  - id: sccm-concealed-command-application
    desc: Authors hidden command-running SCCM application
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/application/update::sccm-application-object-write
      - id: micro-behaviors/os/application/update::sccm-script-application-command-digest
      - id: micro-behaviors/os/application/update::sccm-hidden-application-object

  - id: sccm-forced-quiet-application-assignment
    desc: Forces quiet SCCM application assignment
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/application/update::sccm-application-assignment-write
      - id: micro-behaviors/os/application/update::sccm-assignment-forces-service-window-override
      - id: micro-behaviors/os/application/update::sccm-assignment-suppresses-user-ui

  - id: sccm-concealed-forced-command-deployment
    desc: Pushes concealed command through SCCM
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/supply-chain/hidden-payload/update-service::sccm-concealed-command-application
      - id: objectives/supply-chain/hidden-payload/update-service::sccm-forced-quiet-application-assignment

  - id: sccm-ephemeral-concealed-deployment
    desc: Removes concealed SCCM command deployment
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/supply-chain/hidden-payload/update-service::sccm-concealed-forced-command-deployment
      - id: micro-behaviors/os/application/update::sccm-application-assignment-delete
      - id: micro-behaviors/os/application/update::sccm-application-object-delete

  - id: sccm-encoded-powershell-deployment
    for: [binaries, '!dex', '!elf', '!macho', scripts, '!applescript', '!jcl', '!shell', c, clojure, csharp, go, java, kotlin, rust, typescript, zig]
    desc: Deploys hidden encoded PowerShell through SCCM
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/supply-chain/hidden-payload/update-service::sccm-concealed-forced-command-deployment
      - id: micro-behaviors/process/argument/interpreter::powershell-hidden-bypass-encoded-command
