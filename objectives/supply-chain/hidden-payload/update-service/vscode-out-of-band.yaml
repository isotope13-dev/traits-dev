# An extension that checks for its own updates against a server of the
# publisher's choosing.
#
# The marketplace is the update channel for an extension, and it is the only one
# a user consents to: an update arrives after review, from the same listing they
# installed. An extension that reads its own manifest version, fetches a version
# file from a private host, and compares the two has built a second channel
# beside that one — and the second channel has no review in it.
#
# What it does with the answer is the part that varies and the part that is
# invisible here: prompt the user, silently fetch a payload, change behaviour
# for versions the author considers stale. The channel itself is the durable
# signal, and it is the thing that would let a listing that passed review start
# behaving differently later without ever shipping a new version through it.
#
# Suspicious rather than hostile because there are honest reasons to want it —
# an extension whose backend has a minimum-client requirement genuinely needs to
# know. It is the combination with a private host, rather than any one leg, that
# says the author preferred not to use the channel that exists.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, archives]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: vscode-out-of-band-version-check
    desc: Extension checks its version off-marketplace
    crit: suspicious
    conf: 0.88
    scope: archive
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/library/vscode::vscode-reads-own-version
      - id: micro-behaviors/communications/http/url/path::version-manifest-url
