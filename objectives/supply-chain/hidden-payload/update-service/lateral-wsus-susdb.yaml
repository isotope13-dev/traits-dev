defaults:
  platforms: [windows, unix]
  for: [python, powershell, csharp, batch]
  attack: T1072
  mbc: E1072

composite_rules:
  - id: wsus-susdb-update-forgery-chain
    desc: Forges and deploys a WSUS update via SUSDB procs
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/application/update::susdb-import-update-proc
      - id: micro-behaviors/os/application/update::susdb-deploy-update-proc
    any:
      - id: micro-behaviors/os/application/update::susdb-save-xml-fragment-proc
      - id: micro-behaviors/os/application/update::susdb-set-batch-url-proc
  # A command-executing update being written into SUSDB or pointed at a download
  # URL: the payload-delivery half of the same attack.
  - id: wsus-commandline-update-weaponization
    desc: Weaponizes a WSUS update to run a command
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/application/update::wsus-commandline-install-handler
      - id: micro-behaviors/os/application/update::wsus-update-install-command
    any:
      - id: micro-behaviors/os/application/update::susdb-import-update-proc
      - id: micro-behaviors/os/application/update::susdb-set-batch-url-proc
      - id: micro-behaviors/os/application/update::susdb-save-xml-fragment-proc
