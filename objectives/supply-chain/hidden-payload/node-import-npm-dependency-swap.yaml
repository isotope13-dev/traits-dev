defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1059.007,T1195.002
  mbc: B0024

traits:
  - id: node-module-scope-removes-and-reinstalls-clsx-js
    desc: Library code runs npm uninstall and install for clsx-js when loaded
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)execSync\s*\(\s*["'']npm uninstall clsx-js\s*&&\s*npm install clsx-js["''][\s\S]{0,300}stdio\s*:\s*["'']ignore'

composite_rules:
  - id: node-import-triggers-clsx-js-package-swap
    desc: Importing a JavaScript library replaces a package by running npm install
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-module-scope-removes-and-reinstalls-clsx-js
