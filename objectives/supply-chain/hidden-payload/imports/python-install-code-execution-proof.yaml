defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1195.002,T1059.006

traits:
  - id: python-install-code-execution-proof-description
    desc: Describes package-install code execution
    crit: notable
    if:
      type: text
      regex: '(?i)code execution via python package installation'

composite_rules:
  - id: python-install-code-execution-marker-proof
    desc: Install code-execution proof has user lookup and file write
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: python-install-code-execution-proof-description
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/fs/path/user-directory::python-expanduser-tilde
      - id: micro-behaviors/os/user/lookup::python-getpass-getuser
