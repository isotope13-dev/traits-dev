# pafer library wheel: framed pickle default.config loader (MAL-2026-17756).
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  attack: T1195.002,T1059.006
  mbc: E1059

traits:
  - id: python-sys-getframe-caller-globals
    desc: Python reads caller globals via sys._getframe
    crit: suspicious
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: '_getframe\(\d+\)\.f_globals'

composite_rules:
  - id: python-decompressed-pickle-config-load
    desc: Python unpickles decompressed config bytes
    crit: suspicious
    conf: 0.96
    for: [python]
    near_lines: 120
    all:
      - id: micro-behaviors/data/serialize/unsafe::pickle-loads
    any:
      - id: micro-behaviors/data/decompress/gzip::gzip-decompress-call
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol

  - id: pypi-wheel-pafer-pickle-config-loader
    desc: PyPI pafer wheel pickle config loader
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1195.002
    scope: archive
    all:
      - id: metadata/package/dependencies/declaration::pkginfo-project-name-pafer
      - id: micro-behaviors/data/serialize/unsafe::pickle-loads
      - id: python-decompressed-pickle-config-load
      - id: python-sys-getframe-caller-globals
