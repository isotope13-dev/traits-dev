defaults:
  for: [github-actions]
  platforms: [linux, macos]
  size_min: 80
  size_max: 20000
  attack: T1105
  mbc: B0024


composite_rules:
  - id: hidden-temp-download-chmod
    desc: CI hidden temp download and chmod
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/build/ci/step::release-download-hidden-tmp
      - id: metadata/build/ci/step::chmod-hidden-tmp
  - id: hidden-temp-chmod-execute
    desc: CI hidden temp chmod and execution
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/build/ci/step::chmod-hidden-tmp
      - id: metadata/build/ci/step::background-hidden-tmp
  - id: hidden-temp-download-execute
    desc: CI hidden temp download and execution
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/build/ci/step::release-download-hidden-tmp
      - id: metadata/build/ci/step::chmod-hidden-tmp
      - id: metadata/build/ci/step::background-hidden-tmp
