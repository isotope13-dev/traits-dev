defaults:
  platforms: [unix, windows]
  for: [github-actions, tgz, zip]
  attack: T1195.002

composite_rules:
- id: runner-memory-secret-scraper-payload
  desc: CI script payload scrapes runner memory secrets
  crit: hostile
  conf: 0.99
  attack: T1003.007,T1195.002
  for: [shell, python]
  all:
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
  any:
  - id: micro-behaviors/os/env/cicd::sh-runner-os
  - id: micro-behaviors/os/env/cicd::sh-runner-name
  - id: micro-behaviors/os/env/cicd::github-workflow-log-command

- id: gha-wrapper-runner-secret-theft
  desc: Delegating action steals runner secrets
  crit: hostile
  conf: 0.995
  scope: archive
  size_max: 33554432
  for: [github-actions, tgz, zip, javascript, typescript, shell, python, go]
  all:
  - id: metadata/build/ci/step::composite-action-runtime-delegating-wrapper
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
  unless:
  - id: metadata/build/ci/github-actions::nested-action-manifest-path

- id: gha-obfuscated-token-harvester
  desc: Action hides a multi-provider token scanner
  crit: hostile
  conf: 0.995
  scope: archive
  size_max: 33554432
  for: [github-actions, tgz, gz, zip, javascript]
  all:
  - id: metadata/build/ci/step::github-action-manifest
  - id: micro-behaviors/fs/read/file/target::github-npm-pattern-content-records
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime

- id: gha-systemd-remote-persistence
  desc: Action installs a remote systemd user service
  crit: hostile
  conf: 0.99
  scope: archive
  for: [github-actions, tgz, zip, shell, python, source]
  all:
  - id: metadata/build/ci/step::composite-action-type
  - id: micro-behaviors/os/service/config::workflow-user-service-config
  - id: micro-behaviors/communications/http/curl::workflow-curl-http-request
  - id: micro-behaviors/os/service/config::systemd-user-unit
  unless:
  - id: metadata/package/tooling::openshell-source-tree
      # A repo-internal helper action (under .github/actions/ or a nested
      # actions/ collection) is not the published action this rule is about.
      # Without this, scope:archive pools legs across unrelated members: a
      # source tree whose CI workflow enables a user systemd unit for its own
      # integration tests (e.g. podman socket activation on an ephemeral
      # runner) plus an unrelated curl in another workflow step scores
      # hostile. Same pooling failure already excluded on the sibling
      # download-shell pipeline and gha-wrapper-runner-secret-theft rules.
  - id: metadata/build/ci/github-actions::nested-action-manifest-path

- id: gha-repository-identity-json-post
  desc: One file serializes GitHub repository identity into an HTTP POST
  crit: notable
  conf: 0.96
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/post::request-post-option
  - id: micro-behaviors/os/env/cicd::process-env-github-repository
  - id: micro-behaviors/data/serialize/json::json-stringify-object-env-token

- id: gha-repository-identity-exfil
  desc: GitHub Action uploads repository identity over HTTP
  crit: hostile
  conf: 0.99
  size_max: 33554432
  for: [github-actions, tgz, zip, scripts, html]
  scope: archive
  all:
  - id: metadata/build/ci/step::github-action-manifest
  - id: gha-repository-identity-json-post
  unless:
  - id: metadata/build/ci/github-actions::nested-action-manifest-path


- id: gha-registry-credential-upload
  desc: Action uploads package-registry credentials
  crit: hostile
  conf: 0.99
    # Bound to one composite-action step script, not the archive.
  for: [shell]
  all:
  - id: metadata/build/ci/step::composite-action-step-script
  - id: micro-behaviors/fs/path/credential::credentials-path-tail
  - id: micro-behaviors/communications/http/request/body::curl-data-binary-stdin

- id: gha-secret-diagnostic-upload
  desc: Action uploads a hidden temporary diagnostic payload
  crit: hostile
  conf: 0.99
  scope: archive
  for: [binaries, '!dex', '!pe', applescript, github-actions, go, groovy, javascript, lua, perl, php, python, ruby, shell, tgz, zip]
  all:
  - id: metadata/build/ci/step::composite-action-type
  - id: micro-behaviors/communications/http/request/body::curl-data-binary-stdin
  - id: "micro-behaviors/fs/path/temp::hidden-tmp-dotfile-path"
  - id: micro-behaviors/communications/http/curl::workflow-curl-http-request
  unless:
  - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url

  # Same pooling failure as the cache-poisoning rule. Under `scope:
  # archive`, a composite action anywhere plus `seq` in a benchmark and
  # `dd if=/dev/zero` in a disk image script scored hostile: PCP's QA
  # tests, dfinity's fuzzing harness, and a vendored libbpf action.
  # The fill has to be the composite step's own `run:` body.
- id: gha-matrix-dos-stage
  desc: Action fans out a destructive temporary-file fill
  crit: hostile
  conf: 0.99
  for: [shell]
  all:
  - id: metadata/build/ci/step::composite-action-step-script
  - id: micro-behaviors/data/control-flow/loop::shell-large-numeric-sequence-loop
  - id: micro-behaviors/fs/write/file/shell::dd-zero-input-command

- id: gha-dual-mutable-registry-images
  desc: Action defaults and executes mutable registry images
  crit: hostile
  conf: 0.99
  for: [github-actions]
  all:
  - id: metadata/build/ci/step::github-action-manifest
  - id: metadata/build/ci/step::gha-mutable-registry-docker-image
  - id: metadata/build/ci/step::gha-default-container-image-input
