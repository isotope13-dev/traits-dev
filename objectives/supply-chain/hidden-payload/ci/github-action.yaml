# Composite GitHub Actions are executable package deliveries.  A composite
# action's identity is not malicious by itself; these rules require a second
# capability (credential upload, persistence, destructive fan-out, or remote
# shell) in the same action archive.
defaults:
  platforms: [unix, windows]
  for: [github-actions, tgz, zip]
  attack: T1195.002

traits:
  - id: gha-action-yml-manifest
    desc: GitHub Action action.yml manifest
    crit: notable
    conf: 0.98
    for: [github-actions]
    if:
      type: basename
      exact: action.yml
      case_insensitive: true

composite_rules:
  - id: gha-obfuscated-token-harvester
    desc: Action hides a multi-provider token scanner
    crit: hostile
    conf: 0.995
    scope: archive
    size_max: 33554432
    for: [github-actions, tgz, gz, zip, javascript]
    all:
      - id: gha-action-yml-manifest
      - id: objectives/credential-access/api-harvest/token::node-github-npm-token-file-harvest
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime

  - id: gha-systemd-remote-persistence
    desc: Action installs a remote systemd user service
    crit: hostile
    conf: 0.99
    scope: archive
    for: [github-actions, tgz, zip, shell, python, source]
    all:
      - id: metadata/build/ci/step::composite-action-type
      - id: micro-behaviors/os/service/config::workflow-user-service-config
      - id: micro-behaviors/communications/http/download/curl::workflow-curl-download
      - id: objectives/persistence/system/service/systemd::systemd-user-persistence

  - id: gha-post-step-repository-exfil
    desc: Action post step uploads repository identity
    crit: hostile
    conf: 0.99
    scope: archive
    for: [github-actions, tgz, zip, scripts, html]
    all:
      - id: metadata/build/ci/step::action-post-hook
      - id: micro-behaviors/os/env/cicd::process-env-github-repository
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/data/serialize/schema-object::json-stringify-env-field

  - id: gha-remote-shell-stage
    desc: Action pipes a downloaded stage into a shell
    crit: hostile
    conf: 0.99
    scope: archive
    # A published GitHub Action is a small repo. Unbounded, archive scope let
    # these three legs come from three unrelated files in a distro source tree:
    # Ubuntu's rustc 1.75 tarball has composite actions, workflows that curl,
    # and `curl | sh` in its bootstrap scripts, none of them the same file.
    # Proximity cannot discipline this -- across archive members the
    # `near_bytes` bound is skipped, not failed -- so bound the carrier instead.
    size_max: 33554432
    for: [source, applescript, github-actions, html, javascript, lua, markdown, perl, php, python, ruby, shell, tgz, zip]
    all:
      - id: metadata/build/ci/step::composite-action-type
      - id: micro-behaviors/communications/http/download/curl::workflow-curl-download
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    unless:
      # The size bound above was not enough: k3s (690KB) and cargo-binstall
      # (312KB) are project source trees, far under it, whose composite action
      # sits in `.github/actions/` while the `curl | sh` is their own
      # installer script. A repo-internal helper action is not the published
      # action this rule is about.
      - id: metadata/build/ci/github-actions::repo-internal-composite-action-path

  - id: gha-shell-profile-persistence
    desc: Action downloads code and appends a shell profile
    crit: hostile
    conf: 0.99
    # Bound to one composite-action step script, not the archive. Under
    # `scope: archive` a repository was enough: Apache Superset's helm
    # chart has a composite action somewhere, a curl somewhere and a chmod
    # somewhere, and scored hostile twice. The step's `run:` body is its
    # own node, so the capabilities below must be the same script.
    for: [shell]
    all:
      - id: metadata/build/ci/step::composite-action-step-script
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: objectives/persistence/login/shell/config::bash-rc-path-text
      - id: micro-behaviors/fs/write/file/redirect::shell-rc-redirect-write

  - id: gha-registry-credential-upload
    desc: Action uploads package-registry credentials
    crit: hostile
    conf: 0.99
    scope: archive
    for: [binaries, '!dex', scripts, '!jcl', github-actions, groovy, tgz, zip]
    all:
      - id: metadata/build/ci/step::composite-action-type
      - id: micro-behaviors/data/parse/vocabulary::credentials-path-tail
      - id: micro-behaviors/communications/http/upload::curl-data-binary-stdin

  - id: gha-cache-poisoning-stage
    desc: Action writes an executable cache or PATH stage
    crit: hostile
    conf: 0.98
    # Bound to one composite-action step script, not the archive. Under
    # `scope: archive` a repository was enough: Apache Superset's helm
    # chart has a composite action somewhere, a curl somewhere and a chmod
    # somewhere, and scored hostile twice. The step's `run:` body is its
    # own node, so the capabilities below must be the same script.
    for: [shell]
    all:
      - id: metadata/build/ci/step::composite-action-step-script
      - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
      - id: micro-behaviors/fs/chmod/modify::chmod-command
      - id: micro-behaviors/communications/http/download/curl::curl-fail-silent-url-reference

  - id: gha-secret-diagnostic-upload
    desc: Action uploads a hidden temporary diagnostic payload
    crit: hostile
    conf: 0.99
    scope: archive
    for: [binaries, '!dex', '!pe', applescript, github-actions, go, groovy, javascript, lua, perl, php, python, ruby, shell, tgz, zip]
    all:
      - id: metadata/build/ci/step::composite-action-type
      - id: micro-behaviors/communications/http/upload::curl-data-binary-stdin
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
      - id: micro-behaviors/communications/http/download/curl::workflow-curl-download

  - id: gha-matrix-dos-stage
    desc: Action fans out a destructive temporary-file fill
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, scripts, '!jcl', class, github-actions, tgz, zip]
    all:
      - id: metadata/build/ci/step::composite-action-type
      - id: micro-behaviors/data/control-flow/loop::shell-large-numeric-sequence-loop
      - id: micro-behaviors/fs/write/file/shell::dd-zero-input-command

  - id: gha-remote-docker-action
    desc: Action executes an unpinned remote Docker image
    crit: hostile
    conf: 0.98
    # The two legs have to be the *same* file: an action.yml that itself
    # declares `image: docker://...`. Under `scope: archive` they pooled
    # across unrelated members -- WyriHaximus/github-action-wait-for-status
    # builds from a local Dockerfile (`image: 'Dockerfile'`) and pulls
    # nothing, but its own .github/workflows/ci.yml lints with
    # `uses: docker://hadolint/hadolint`, and the pair scored hostile.
    #
    # Dropping `scope: archive` was not enough. The file `defaults:` put
    # `archives, tgz` in `for:`, so the rule is still evaluated on the
    # container node, and there every member's finding carries the
    # container's own key -- `Scope::File` cannot separate them, because at
    # that level they really are all the same file. StepSecurity's
    # harden-runner scored hostile on exactly the pooling this comment
    # describes: `action.yml` supplies the manifest leg while
    # `.github/workflows/{canary,recurring-int-tests,release}.yml` supply the
    # `docker://` leg. Name only the type the rule is about, so the pair has
    # to occur in one file.
    for: [github-actions]
    all:
      - id: gha-action-yml-manifest
      - id: metadata/build/ci/step::gha-remote-docker-image
    unless:
      # Official Go security checker action runs its own container.
      - id: well-known/tool/detection/gosec::gosec-scanner-context
      # Official Snyk security scanner action runs its own container.
      - id: well-known/tool/detection/sast::snyk-scanner-context
