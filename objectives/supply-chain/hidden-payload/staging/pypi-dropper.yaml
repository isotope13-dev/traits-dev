# Supply-Chain Hidden Payload - PyPI Dropper with Obfuscation
# Detects PyPI packages that hide dropper code behind legitimate-looking
# facade code using whitespace obfuscation or similar techniques.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002
  mbc: E1027
composite_rules:
  # PyPI package with hidden exec dropper behind excessive whitespace
  # The dropper is concealed on an extremely long line (>500 chars)
  # to avoid detection during casual code review.
  - id: pypi-whitespace-hidden-dropper
    desc: PyPI dropper hidden behind excessive whitespace
    conf: 0.96
    all:
      - id: objectives/command-and-control/dropper/execution/eval::exec-urlopen-read
      - id: objectives/anti-static/obfuscation/code-metrics/structure::py-excessive-whitespace-line
  # PyPI package with exec dropper and near-zero documentation
  # Combines the dropper with code quality signals typical of
  # supply-chain attacks.
  - id: pypi-dropper-with-facade
    desc: PyPI package with dropper and facade code
    conf: 0.93
    all:
      - id: objectives/command-and-control/dropper/execution/eval::exec-urlopen-read
      - id: metadata/file/size::init-py-file
    any:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::py-excessive-whitespace-line
      - id: metadata/file/comment::small-source-low-comment-ratio
      - id: metadata/package/author/domain::pkginfo-privacy-email-1
  # Import-time package code that downloads a response, arms it as executable,
  # and launches it is a payload loader even when the wheel has no setup hook.
  - id: pypi-init-download-chmod-exec
    desc: Package init downloads and executes a payload
    conf: 0.99
    attack: T1195.002,T1105,T1059.006,T1222.002
    mbc: B0024
    all:
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
      - id: micro-behaviors/fs/chmod/executable/mode::python-owner-executable-bit
      - id: micro-behaviors/process/create/subprocess::process-execution

  # A source distribution that embeds an encoded import-time fetch-and-exec
  # loader in a module, rather than in setup.py or __init__.py.
  - id: pypi-sdist-encoded-remote-exec
    desc: Python source distribution hides encoded remote code execution
    conf: 0.99
    attack: T1195.002,T1027,T1105,T1059.006
    mbc: E1027,B0032,B0024
    for: [python-sdist, python]
    scope: archive
    all:
      - id: metadata/build/pip::root-setup-py-path
      - id: metadata/package/versioning/scheme::pkginfo-lowest-version
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-exec
      - id: objectives/command-and-control/dropper/execution/eval::exec-urlopen-read
      - id: objectives/anti-static/obfuscation/eval/scripting::pythonw-exe-replace-trick

  # A wheel whose normal runtime code consumes a mutable remote resource
  # manifest and invisibly launches its payload is a trojanized package even
  # without a setup.py hook. Archive scope ties the loader to a real wheel.
  - id: python-wheel-remote-manifest-hidden-exec
    desc: Wheel invisibly runs remote manifest payload
    conf: 0.995
    for: [whl, python]
    scope: archive
    attack: T1195.002,T1105,T1059.006
    all:
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
      - id: objectives/command-and-control/dropper/python-script::python-remote-manifest-hidden-transient-exec

  # A module that dynamically loads a sibling payload via importlib
  # (spec_from_file_location + exec_module), then runs it in a daemon thread
  # as a module-level side effect, is a backgrounded import-time loader: the
  # victim never calls a function, merely importing the package fires the
  # payload off the main thread so it survives the import. Legitimate plugin
  # managers load on an explicit API call inside a function, not at module
  # scope in a fire-and-forget thread.
  - id: python-import-thread-dynamic-module-exec
    desc: Import runs a dynamically-loaded module in a daemon thread
    conf: 0.97
    attack: T1195.002,T1059.006,T1027
    near_lines: 50
    all:
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/os/api-resolution/dynamic::python-importlib-spec-exec-module
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    unless:
      - id: metadata/package/testing/
      # main.py loads custom-node scripts, then starts the prompt worker thread.
      - id: well-known/app/ai/media/comfyui::comfyui-main-script
