# A build or release script that evaluates JavaScript fetched at runtime and
# then obtains a shell-command helper from the fetched module is a supply-chain
# delivery surface, not ordinary dependency loading.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1059.007,T1105
  mbc: B0032

traits:
  - id: command-stream-package-use
    desc: Loads a command-stream shell helper
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: use
      arg:
        kind: string
        substr: command-stream
  - id: shell-template-command
    desc: Awaits a shell-template command invocation
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\bawait\s+\$\s*`'

composite_rules:
  - id: remote-command-stream-loader
    desc: Remote-evaluated module supplies shell commands
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::await-fetch-text-eval
      - id: command-stream-package-use
      - id: shell-template-command
    unless:
      # All three legs are the documented API of two published npm libraries
      # (`use-m` fetches its loader, `command-stream` supplies `use(...)` and
      # the `await $\`cmd\`` template), so together they fingerprint that
      # library pair rather than an attack. The AWS-adjacent `formal-ai` crate
      # ships nine ordinary release scripts built on them and every one scored
      # hostile. What actually distinguishes delivery is where the evaluated
      # code comes from: keep the verdict for an arbitrary host, drop it only
      # for the documented use-m bootstrap.
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::use-m-unpkg-fetch-eval-bootstrap
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::use-m-jsdelivr-fetch-eval-bootstrap
