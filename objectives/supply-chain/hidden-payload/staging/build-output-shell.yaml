# A build recipe that captures a compiled helper's output into a file and
# feeds that file to a shell. The build-recipe rules convict the
# compile-and-run shape; this one states the staging -- the helper's OUTPUT,
# not the helper, is what gets executed, so the shipped source and the thing
# that runs are two generations apart.
#
# Worked example: the trojanized openssh Makefile.in line
# `$(CC) bf-test.c -o bf-test; ./bf-test>bf-test.out; sh ./bf-test.out &`.
defaults:
  platforms: [unix]
  for: [makefile, shell, text]
  attack: T1059.004,T1027
  mbc: B0024

traits:
  - id: captured-output-file-shelled
    desc: Tool output captured to file then shelled
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '>\s*[\w./-]{1,40}\.out\s*;\s*sh\s+[\w./-]{1,40}'

composite_rules:
  - id: build-output-fed-to-shell
    desc: Build helper output staged then executed by shell
    crit: hostile
    conf: 0.96
    all:
      - id: captured-output-file-shelled
      - id: objectives/supply-chain/hidden-payload/build-recipe::recipe-compiles-local-source
