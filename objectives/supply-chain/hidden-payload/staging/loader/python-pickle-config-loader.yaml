# Loader-library half of the disguised pickle-config campaign
# (2026-10-webreader / MAL-2026-17757; the consumer wheels that ship the
# blob are in ../package/pypi-pickle-config-wheel.yaml). The library mints
# pickle blobs as a "config file format" (pickle.dumps plus a checksum and
# optional compression header written by the same save API), and loading
# with no explicit path resolves the config file from the CALLER's frame
# globals, unpickling whatever blob is parked next to the importing
# module. The header checks and post-load type sanitizing wrap
# pickle.loads and validate nothing about who authored the blob: this is
# package-local payload execution dressed as configuration loading.
# Benign pickle caches (pipenv/CacheControl) deserialize explicitly
# located data and never inspect the caller's frame; benign frame
# inspection never feeds a pickle. Requiring both serialization
# directions plus the caller-frame resolution in one source unit keeps
# those controls out.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1059.006
  mbc: E1059

composite_rules:
  - id: caller-frame-resolved-pickle-config-loader
    desc: Library mints and auto-unpickles caller-frame-resolved config
    crit: hostile
    conf: 0.96
    for: [python, whl]
    scope: leaf
    all:
      - id: micro-behaviors/data/serialize/unsafe::pickle-loads
      - id: micro-behaviors/data/serialize/unsafe::pickle-dumps
      - id: micro-behaviors/metaprogramming/reflection::python-sys-getframe-caller-globals
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      # The engine initializer pickles its own module objects and reads
      # the caller frame only to locate the package directory.
      - id: well-known/lib/runtime/scripted/renpy::engine-package-init
