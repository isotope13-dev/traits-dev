defaults:
  crit: hostile
  platforms: [windows]
  for: [oledoc]
  attack: T1195.002

composite_rules:
  - id: objectives/supply-chain/hidden-payload/staging/loader::encrypted-pack-hidden-script-stage
    desc: MSI hides encrypted stage behind script launchers
    conf: 0.99
    attack: T1027,T1059.003,T1059.005,T1059.007,T1195.002
    all:
      - id: metadata/package/files/msi/strings::spk2-marker-reference
      - id: metadata/package/files/msi/strings::msi-boot-node-reference
      - id: micro-behaviors/process/interpreter/wsh::wsh-launcher-marker
      - id: metadata/package/files/msi/strings::msi-launch-cmd-main-js-reference

  - id: objectives/supply-chain/hidden-payload/staging/loader::node-runtime-ole2-staging-lure
    desc: OLE2 Node Runtime MSI stages oversized installer lure
    conf: 0.98
    attack: T1195.002,T1036.005
    for: [oledoc, msi]
    all:
      - id: metadata/package/files/msi/identity::node-runtime-subject
      - id: metadata/package/files/msi/identity::nodejs-foundation-creator
      - id: metadata/package/files/msi/identity::ole2-installer-kind
      - id: metadata/package/files/msi/identity::oversized-node-runtime-msi

  - id: objectives/supply-chain/hidden-payload/staging/loader::obfuscated-node-pack-loader
    desc: Obfuscated Node code loads an encoded stage
    conf: 0.98
    for: [javascript]
    attack: T1027,T1059.007,T1620
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::decoder-loop-keyword-triad
      - id: metadata/file/encoding/shape::large-base64-like-literal
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
