# npm install hook that imports an external package at install time and then
# calls a downloader-named binding, or relies on a dependency the registry has
# withdrawn under a security hold. A postinstall that runs a script is routine
# build setup, and a dynamic import of a package is routine plugin loading.
# Together with a download-and-run binding or a held dependency, the package
# is a launcher whose real payload is staged elsewhere. The name is the
# attacker's choice, so it corroborates the held-dependency leg and never
# convicts on its own.
#
# The evidence spans the manifest and a JavaScript member of one archive, so
# the rule is judged at archive scope.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1105

composite_rules:
  - id: npm-postinstall-dynamic-loader
    desc: Install hook dynamically loads a downloader or held dependency
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/os/module/require::dynamic-external-import-string-literal
    any:
      - id: metadata/lang/source/naming/action/function-name::download-and-run-name-reference
      - id: objectives/supply-chain/security-hold::declared-dependency-security-held

  - id: npm-postinstall-obfuscated-download-load-cleanup
    desc: Postinstall decodes a URL, runs a downloader and loads its payload
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, package.json, javascript]
    attack: T1027.003,T1059.007,T1105,T1195.002
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/execution/staging/reconstruct::node-decode-exec-load-cleanup-observations
      - id: micro-behaviors/communications/url/encoded::http-scheme-character-code-sequence
