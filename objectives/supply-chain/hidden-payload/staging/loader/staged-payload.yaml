defaults:
  platforms:
  - windows
  - linux
  attack: T1195.002
traits:
- id: indexed-base64-shard-lines
  desc: Indexed base64 shard marker lines
  crit: notable
  conf: 0.92
  for:
  - javascript
  - data
  if:
    type: text
    regex: (?m)^z9:\d{1,6}:[A-Za-z0-9+/=]{16,}$
composite_rules:
- id: package-relative-base64-eval-loader
  desc: Reads and evals a Base64 package-relative payload
  crit: hostile
  conf: 0.99
  for:
  - javascript
  - typescript
  near_lines: 130
  attack: T1027,T1059.007,T1195.002
  mbc: B0032
  all:
  - id: micro-behaviors/fs/read/file/target::read-package-relative-file
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
- id: pem-disguised-base64-eval-loader
  desc: PEM block hides Base64 payload executed via eval
  crit: hostile
  conf: 0.99
  for:
  - javascript
  - typescript
  near_lines: 60
  attack: T1027,T1059.007,T1195.002
  mbc: B0032
  all:
  - id: micro-behaviors/crypto/certificate/usage::pem-begin
  - id: micro-behaviors/fs/read/file/target::read-package-relative-file
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: archive-hidden-base64-agent-materialization
  desc: Archive materializes a Base64 payload into an executable agent
  crit: hostile
  conf: 0.98
  scope: archive
  for:
  - binaries
  - '!dex'
  - scripts
  - '!jcl'
  - asar
  - cab
  - chm
  - conda
  - cpio
  - crate
  - crx
  - deb
  - dmg
  - egg
  - gem
  - gentoo_binpkg
  - iso
  - jar
  - npm
  - nupkg
  - oci_image
  - pkg
  - python-sdist
  - rar
  - rpm
  - 7z
  - tar
  - vsix-archive
  - whl
  - xbps
  - xpi
  - zip
  - apk
  - alpine_apk
  - ipa
  all:
  - id: metadata/package/files/encoding::large-b64-file
  - id: objectives/persistence/system/cron/schedule::cron-with-base64
- id: archive-hidden-base64-cron-agent
  desc: Archive combines a staged Base64 payload with detached cron persistence
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - binaries
  - '!dex'
  - scripts
  - '!jcl'
  - asar
  - cab
  - chm
  - conda
  - cpio
  - crate
  - crx
  - deb
  - dmg
  - egg
  - gem
  - gentoo_binpkg
  - iso
  - jar
  - npm
  - nupkg
  - oci_image
  - pkg
  - python-sdist
  - rar
  - rpm
  - 7z
  - tar
  - vsix-archive
  - whl
  - xbps
  - xpi
  - zip
  - apk
  - alpine_apk
  - ipa
  all:
  - id: metadata/package/files/encoding::large-b64-file
  - id: objectives/persistence/system/cron/schedule::cron-with-base64
  - id: micro-behaviors/os/autorun/cron::shell-crontab-entry-pipeline
  - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
- id: build-surface-claimed
  desc: Package claims generated build output
  crit: component
  conf: 0.82
  any:
  - id: metadata/package/files/package-json::files-dist-ref
  - id: metadata/package/entrypoint::main-dist-entrypoint
  - id: metadata/package/entrypoint::types-dist-entrypoint
  - id: metadata/package/entrypoint::module-dist-entrypoint
  - id: metadata/package/entrypoint::pkg-exports-dist-direct
  - id: metadata/package/entrypoint::bin-dist-entrypoint
  - id: metadata/package/files/runtime::commented-dist-require-declaration
- id: declares-build-pipeline
  desc: Package declares build pipeline script
  crit: component
  conf: 0.78
  any:
  - id: metadata/package/scripts/build::has-build-script-build
  - id: metadata/package/scripts/build::has-build-script-compile
  - id: metadata/package/scripts/build::has-build-script-prepare
  - id: metadata/package/scripts/build::has-build-script-prepack
- id: no-build-script
  desc: Package has no recognizable build pipeline
  crit: component
  conf: 0.8
  for:
  - package.json
  all:
  - id: objectives/supply-chain/hidden-payload/staging/loader::build-surface-claimed
  unless:
  - id: metadata/package/freeform/
  - id: metadata/package/testing/presence/fixture/
  - id: objectives/supply-chain/hidden-payload/staging/loader::declares-build-pipeline
- id: phantom-dist-directory
  desc: Files field lists dist/ without declared entrypoints or build script
  crit: suspicious
  conf: 0.88
  for:
  - package.json
  all:
  - id: metadata/package/files/package-json::files-dist-ref
  - id: objectives/supply-chain/hidden-payload/staging/loader::no-build-script
  unless:
  - id: metadata/package/entrypoint::main-dist-entrypoint
  - id: metadata/package/entrypoint::types-dist-entrypoint
  - id: metadata/package/entrypoint::module-dist-entrypoint
  - id: metadata/package/entrypoint::pkg-exports-dist-entrypoint
  - id: metadata/package/entrypoint::pkg-exports-dist-direct
  - id: metadata/package/entrypoint::bin-dist-entrypoint
  - id: metadata/package/freeform/
- id: dist-entrypoint-install-loader
  desc: Dist package runs source install loader
  crit: suspicious
  conf: 0.93
  for:
  - package.json
  all:
  - id: metadata/package/entrypoint::main-dist-entrypoint
  - id: metadata/package/entrypoint::types-dist-entrypoint
  - id: metadata/package/files/package-json::files-dist-ref
  - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-runs-ts-node-local-script
- id: obfuscated-decrypt-write-hidden-launch
  desc: Obfuscated JavaScript stages decoded content and hidden-launches it
  crit: hostile
  conf: 0.98
  attack: T1027,T1105,T1059.007
  mbc: B0032,F0011
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/fs/write/file/mode::node-obfuscated-write-mode
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
- id: node-sharded-base64-json-materializer
  desc: Node rebuilds base64 JSON shards
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/directory/readdir::node-readdir-repeated
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: micro-behaviors/data/collection/array::sort-method-call
  - id: micro-behaviors/data/string/concat::join-short-string-argument
  - id: micro-behaviors/data/serialize/json::node-json-parse-buffer
  - id: micro-behaviors/data/serialize/json::base64-buffer-json-parse
- id: npm-cli-sharded-json-payload-dropper
  desc: npm CLI hidden shard dropper
  crit: hostile
  conf: 0.94
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  - data
  all:
  - id: metadata/package/entrypoint::has-bin-field
  - id: objectives/supply-chain/hidden-payload/staging/loader::indexed-base64-shard-lines
  - id: objectives/supply-chain/hidden-payload/staging/loader::node-sharded-base64-json-materializer
  - id: micro-behaviors/data/serialize/json::base64-json-parse-near-file-write
  - id: micro-behaviors/process/argument/subcommand::cli-install-subcommand
- id: npm-gist-api-eval-loader
  desc: npm package loads and evals GitHub Gist API content
  crit: hostile
  conf: 0.96
  scope: archive
  for:
  - binaries
  - '!dex'
  - scripts
  - '!jcl'
  - manifests
  - '!desktop-entry'
  - '!systemd-service'
  - json
  - npm
  - rust
  - text
  all:
  - id: metadata/package/files/included::package-json-basename
  - id: objectives/command-and-control/channel/deaddrop/github::github-gist-api-eval-deaddrop
  - id: micro-behaviors/os/module/require::dynamic-import-string-literal
  any:
  - id: objectives/command-and-control/dropper/script-eval/remote-code::fetch-eval-remote-code
  - id: objectives/command-and-control/dropper/script-eval/remote-code::fetch-content-field-eval-loader
  - id: micro-behaviors/communications/http/url/github::gist-github-host-url
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
- id: npm-install-concealed-domain-sidecar
  desc: Install hook hides an obfuscated domain sidecar
  crit: suspicious
  conf: 0.99
  attack: T1195.002,T1027
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  - svg
  all:
  - id: metadata/package/scripts/lifecycle::install-runs-node-local-script
  - id: micro-behaviors/os/module/require::cjs-caught-local-require
  - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array
  - id: micro-behaviors/os/module/export::commonjs-domain-like-export
- id: npm-install-obfuscated-local-helper
  desc: Install hook loads obfuscated local helper
