defaults:
  platforms:
    - windows
    - linux
  attack: T1195.002
traits:
  - id: indexed-base64-shard-lines
    desc: Indexed base64 shard marker lines
    crit: notable
    conf: 0.92
    for:
      - javascript
      - data
    if:
      type: text
      regex: (?m)^z9:\d{1,6}:[A-Za-z0-9+/=]{16,}$
composite_rules:
  - id: package-relative-base64-eval-loader
    desc: Reads and evals a Base64 package-relative payload
    crit: hostile
    conf: 0.99
    for:
      - javascript
      - typescript
    near_lines: 130
    attack: T1027,T1059.007,T1195.002
    mbc: B0032
    all:
      - id: micro-behaviors/fs/read/file/target::read-package-relative-file
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
  - id: pem-disguised-base64-eval-loader
    desc: PEM block hides Base64 payload executed via eval
    crit: hostile
    conf: 0.99
    for:
      - javascript
      - typescript
    near_lines: 60
    attack: T1027,T1059.007,T1195.002
    mbc: B0032
    all:
      - id: micro-behaviors/crypto/certificate/usage::pem-begin
      - id: micro-behaviors/fs/read/file/target::read-package-relative-file
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: archive-hidden-base64-agent-materialization
    desc: Archive materializes a Base64 payload into an executable agent
    crit: hostile
    conf: 0.98
    scope: archive
    for:
      - binaries
      - '!dex'
      - scripts
      - '!jcl'
      - asar
      - cab
      - chm
      - conda
      - cpio
      - crate
      - crx
      - deb
      - dmg
      - egg
      - gem
      - gentoo_binpkg
      - iso
      - jar
      - npm
      - nupkg
      - oci_image
      - pkg
      - python-sdist
      - rar
      - rpm
      - 7z
      - tar
      - vsix-archive
      - whl
      - xbps
      - xpi
      - zip
      - apk
      - alpine_apk
      - ipa
    all:
      - id: metadata/package/files/encoding::large-b64-file
      - id: micro-behaviors/os/autorun/cron/unspecified::cron-text-near-base64-decode
  - id: archive-hidden-base64-cron-agent
    desc: Archive combines a staged Base64 payload with detached cron persistence
    crit: hostile
    conf: 0.99
    scope: archive
    for:
      - binaries
      - '!dex'
      - scripts
      - '!jcl'
      - asar
      - cab
      - chm
      - conda
      - cpio
      - crate
      - crx
      - deb
      - dmg
      - egg
      - gem
      - gentoo_binpkg
      - iso
      - jar
      - npm
      - nupkg
      - oci_image
      - pkg
      - python-sdist
      - rar
      - rpm
      - 7z
      - tar
      - vsix-archive
      - whl
      - xbps
      - xpi
      - zip
      - apk
      - alpine_apk
      - ipa
    all:
      - id: metadata/package/files/encoding::large-b64-file
      - id: micro-behaviors/os/autorun/cron/unspecified::cron-text-near-base64-decode
      - id: micro-behaviors/os/autorun/cron/unspecified::shell-crontab-entry-pipeline
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
  - id: phantom-dist-directory
    desc: Files list dist/ without dist entrypoint or recognized build pipeline
    crit: notable
    conf: 0.88
    for:
      - package.json
    all:
      - id: metadata/package/files/package-json::files-dist-ref
      - id: metadata/package/scripts/build::no-build-script
    unless:
      - id: metadata/package/entrypoint/module::main-dist-entrypoint
      - id: metadata/package/entrypoint/module::types-dist-entrypoint
      - id: metadata/package/entrypoint/module::module-dist-entrypoint
      - id: metadata/package/entrypoint/module::pkg-exports-dist-entrypoint
      - id: metadata/package/entrypoint/module::pkg-exports-dist-direct
      - id: metadata/package/entrypoint/command::bin-dist-entrypoint
      # A CLI can load dist modules indirectly from its bin/ entrypoint.
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: metadata/package/entrypoint/module::unpkg-dist-entrypoint
      - id: metadata/package/entrypoint/module::jsdelivr-dist-entrypoint
  - id: dist-entrypoint-install-loader
    desc: Dist package runs source install loader
    crit: suspicious
    conf: 0.93
    for:
      - package.json
    all:
      - id: metadata/package/entrypoint/module::main-dist-entrypoint
      - id: metadata/package/entrypoint/module::types-dist-entrypoint
      - id: metadata/package/files/package-json::files-dist-ref
      - id: micro-behaviors/process/interpreter/node::postinstall-runs-ts-node-local-script
  - id: obfuscated-stage-write-hidden-launch
    desc: Obfuscated JavaScript stages content and hidden-launches it
    crit: hostile
    conf: 0.98
    attack: T1027,T1105,T1059.007
    mbc: B0032,F0011
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
      - id: micro-behaviors/fs/write/file/mode::node-obfuscated-write-mode
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-expression
  - id: node-sharded-base64-json-materializer
    desc: Node rebuilds base64 JSON shards
    crit: suspicious
    conf: 0.9
    for:
      - javascript
      - typescript
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-repeated
      - id: micro-behaviors/fs/read/file/content/unspecified::read-node
      - id: micro-behaviors/data/collection/array::sort-method-call
      - id: micro-behaviors/data/string/concat/join::join-short-string-argument
      - id: micro-behaviors/data/parse/json::node-json-parse-buffer
      - id: micro-behaviors/data/parse/json::base64-buffer-json-parse
  - id: npm-cli-sharded-json-payload-dropper
    desc: npm CLI hidden shard dropper
    crit: hostile
    conf: 0.94
    scope: archive
    for:
      - npm
      - package.json
      - javascript
      - data
    all:
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: objectives/supply-chain/hidden-payload/staging/loader::indexed-base64-shard-lines
      - id: objectives/supply-chain/hidden-payload/staging/loader::node-sharded-base64-json-materializer
      - id: micro-behaviors/data/parse/json::base64-json-parse-near-file-write
      - id: micro-behaviors/process/argument/subcommand::cli-install-subcommand
  - id: npm-gist-api-eval-loader
    desc: npm package loads and evals GitHub Gist API content
    crit: hostile
    conf: 0.96
    scope: archive
    for:
      - binaries
      - '!dex'
      - scripts
      - '!jcl'
      - manifests
      - '!desktop-entry'
      - '!systemd-service'
      - json
      - npm
      - rust
      - text
    all:
      - id: metadata/filename/identity::package-json-basename
      - id: objectives/command-and-control/channel/deaddrop/github::github-gist-api-eval-deaddrop
      - id: micro-behaviors/os/module/require::dynamic-import-string-literal
    any:
      - id: objectives/execution/payload/script-eval/network/in-process::external-http-response-eval
      - id: micro-behaviors/process/deploy/script-eval/network::fetch-near-content-eval
      - id: well-known/app/development/code-forge/github::gist-github-host-url
    unless:
      - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: npm-install-concealed-domain-sidecar
    desc: Install hook hides an obfuscated domain sidecar
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1027
    scope: archive
    for:
      - npm
      - package.json
      - javascript
      - svg
    all:
      - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
      - id: micro-behaviors/os/module/export::commonjs-domain-like-export
  - id: npm-install-obfuscated-local-helper
    desc: Install hook loads obfuscated local helper
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1027
    scope: archive
    for:
      - npm
      - package.json
      - javascript
      - typescript
    all:
      - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
      - id: metadata/lang/source/naming/variable::hex-variable-names
  - id: optional-dep-decoy-loader
    desc: Decoy carrier hides a runtime dep as optional and runs it at import
    crit: hostile
    conf: 0.9
    scope: archive
    for:
      - npm
      - javascript
      - package.json
    all:
      - id: metadata/package/dependencies/presence::has-optional-deps
      - id: metadata/package/dependencies/presence::npm-no-runtime-many-devdeps
    any:
      - id: micro-behaviors/os/module/require::eager-import-error-swallowed
      - id: micro-behaviors/os/module/require::postinstall-silent-caught-require
    unless:
      - id: well-known/lib/platform/parcel-watcher::parcel-watcher-native-loader
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/homepage::has-homepage-field
      - id: metadata/package/author/identity::has-author-email
      - id: well-known/app/ai/gateway/neurolink::benign-archive-context
      - id: well-known/app/ai/gateway/neurolink::action-dist-bedrock-marker
  - id: optional-dep-postinstall-silent-loader
    desc: Decoy carrier postinstall loads hidden optional dependency
    crit: hostile
    conf: 0.92
    mbc: B0024
    scope: file
    for:
      - package.json
    all:
      - id: micro-behaviors/os/module/require::postinstall-silent-caught-require
      - id: metadata/package/dependencies/presence::has-optional-deps
      - id: metadata/package/dependencies/presence::npm-no-runtime-many-devdeps
