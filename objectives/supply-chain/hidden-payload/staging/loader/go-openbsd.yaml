defaults:
  platforms: [openbsd, bsd, unix]
  for: [go, elf]
  attack: T1027

traits:
  - id: objectives/supply-chain/hidden-payload/staging/loader::go-encoded-stager-const
    desc: Go encoded stager constant
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: encodedStager

  - id: objectives/supply-chain/hidden-payload/staging/loader::go-runtime-build-stager
    desc: Go runtime build command
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: exec.Command("go", "build"

  - id: objectives/supply-chain/hidden-payload/staging/loader::go-temp-stager-source
    desc: Go temp stager source
    # A stager.go filename reference alone stages nothing (comms-staging
    # modules collide); the compiled-hidden-stager composite carries intent.
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: stager.go

composite_rules:
  - id: objectives/supply-chain/hidden-payload/staging/loader::go-runtime-compiled-hidden-stager
    desc: Go runtime compiled hidden stager
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/supply-chain/hidden-payload/staging/loader::go-encoded-stager-const
      - id: objectives/supply-chain/hidden-payload/staging/loader::go-runtime-build-stager
      - id: objectives/supply-chain/hidden-payload/staging/loader::go-temp-stager-source
