# Go Hidden Payload Detection
# ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain)
# MBC: B0024 (Execution Guardrails)
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1195.002

traits:
- id: exec-decoded-string
  desc: "Matches 'filepath.Join'"
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'exec\.Command\(\s*string\s*\(\s*\[\]byte'
  unless:
  - id: metadata/package/testing/harness/unit/

- id: exec-decoded-payload-string
  desc: exec.Command payload string conversion
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: 'exec\.Command\(\s*string\s*\(\s*(payload|shellcode|stage|decoded)\b'
  unless:
  - id: metadata/package/testing/harness/unit/

- id: exec-command-temp-arg--rx-1
  desc: 'Matches ''execCommand osTempDir)'''
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: 'exec\.Command\(\s*(filepath\.Join\(.{0,180}(os\.TempDir\(\)|["`]/tmp)|os\.TempDir\(\))'
- id: exec-command-temp-arg--rx-2
  desc: Go exec.Command uses a /tmp path argument
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: 'exec\.Command\(\s*(["`]/tmp/)'
- id: nvm-windows-updater-marker
  desc: NVM for Windows updater source
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'NVM for Windows|nvm4w|coreybutler/nvm-windows'

composite_rules:
- id: header-stripping-write
  desc: Stripping fixed-size header and writing back to file
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/data/buffer/carve::go-named-buffer-prefix-slice
  - id: micro-behaviors/fs/write/file/full::go-os-writefile
  unless:
  - id: metadata/package/testing/harness/unit/
  downgrade:
    any:
    - id: objectives/supply-chain/hidden-payload/staging/loader::nvm-windows-updater-marker

- id: exec-temp-file
  desc: Go command invocation targets a temporary path
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/create/subprocess::go-exec-command-call
  - id: objectives/supply-chain/hidden-payload/staging/loader::exec-command-temp-arg
  unless:
  - id: metadata/package/testing/harness/unit/

- id: go-dropper-flow
  desc: Go downloader/dropper flow (download + extract + execute)
  crit: hostile
  conf: 0.98
  # Keep the three capabilities in one operation. A utility package can
  # legitimately contain an HTTP client, archive helpers, and exec wrappers
  # in separate functions; treating those file-wide as one flow convicted
  # golang-tools/utils.
  scope: file
  near_bytes: 600
  all:
  - id: micro-behaviors/communications/http/client/library::go-http-newrequest
  - id: micro-behaviors/data/archive/zip::zip-reader
  - id: micro-behaviors/process/create/subprocess::go-exec-command-call
  any:
  - id: micro-behaviors/data/buffer/carve::go-named-buffer-prefix-slice
  - id: micro-behaviors/fs/chmod/modify::os-chmod
  unless:
  - id: objectives/supply-chain/hidden-payload/staging/loader::nvm-windows-updater-marker

- id: go-exec-decoded-payload
  desc: Go executes decoded/transformed payload
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  any:
  - id: micro-behaviors/process/create/direct::go-python-inline-command
  - id: objectives/supply-chain/hidden-payload/staging/loader::exec-decoded-string
  - id: objectives/supply-chain/hidden-payload/staging/loader::exec-decoded-payload-string
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: exec-command-temp-arg
  desc: exec.Command temporary path argument
  crit: component
  conf: 0.8
  any:
  - id: objectives/supply-chain/hidden-payload/staging/loader::exec-command-temp-arg--rx-1
  - id: objectives/supply-chain/hidden-payload/staging/loader::exec-command-temp-arg--rx-2
  unless:
  - id: metadata/package/testing/harness/unit/
