# Go Hidden Payload Detection
# ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain)
# MBC: B0024 (Execution Guardrails)
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1195.002

traits:
  - id: nvm-windows-updater-marker
    desc: NVM for Windows updater source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'NVM for Windows|nvm4w|coreybutler/nvm-windows'

composite_rules:
  - id: header-stripping-write
    desc: Stripping fixed-size header and writing back to file
    crit: suspicious
    conf: 0.95
  # Stripping a header before writing a staged payload occurs in a single
  # staging routine. Keep the slice and write close together so unrelated
  # file operations and command argument slicing do not compose file-wide.
    near_lines: 20
    all:
      - id: micro-behaviors/data/buffer/carve::go-named-buffer-prefix-slice
      - id: micro-behaviors/fs/write/file/full/unspecified::go-os-writefile
    downgrade:
      any:
        - id: objectives/supply-chain/hidden-payload/staging/loader::nvm-windows-updater-marker

  - id: go-dropper-flow
    desc: Go downloader/dropper flow (download + extract + execute)
    crit: hostile
    conf: 0.98
  # Keep the three capabilities in one operation. A utility package can
  # legitimately contain an HTTP client, archive helpers, and exec wrappers
  # in separate functions; treating those file-wide as one flow convicted
  # golang-tools/utils.
    scope: file
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/http/client/library::go-http-newrequest
      - id: micro-behaviors/data/archive/zip::zip-reader
      - id: metadata/lang/source/syntax/call/construction::go-exec-command-call
    any:
      - id: micro-behaviors/data/buffer/carve::go-named-buffer-prefix-slice
      - id: micro-behaviors/fs/chmod/modify::os-chmod
    unless:
      - id: objectives/supply-chain/hidden-payload/staging/loader::nvm-windows-updater-marker

