defaults:
  platforms: [unix, windows]
  attack: T1027.003,T1059.007,T1105

traits:
  - id: node-jpeg-loader-detached-entry
    desc: Entry launches detached image loader
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (object_pattern (shorthand_property_identifier_pattern) @spawn)
            value: (call_expression function: (identifier) @require arguments: (arguments (string (string_fragment) @module)))))
          (lexical_declaration (variable_declarator name: (identifier) @script value: (call_expression
            function: (member_expression object: (identifier) @path property: (property_identifier) @join)
            arguments: (arguments (identifier) @dirname (string (string_fragment) @dist) (string (string_fragment) @file)))))
          (function_declaration name: (identifier) @fn body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @child value: (call_expression function: (identifier) @spawn_use
              arguments: (arguments (string (string_fragment) @node) (array (identifier) @script_use)
                (object (pair key: (property_identifier) @detached value: (true)) (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))))))
            (expression_statement (call_expression function: (member_expression object: (identifier) @child_use property: (property_identifier) @unref)))))
          (expression_statement (call_expression function: (identifier) @fn_use)))
          (#eq? @require "require")
          (#eq? @module "child_process")
          (#eq? @spawn "spawn")
          (#eq? @spawn @spawn_use)
          (#eq? @path "path")
          (#eq? @join "join")
          (#eq? @dirname "__dirname")
          (#eq? @dist "dist")
          (#eq? @file "loadformat.js")
          (#eq? @script @script_use)
          (#eq? @node "node")
          (#eq? @detached "detached")
          (#eq? @stdio "stdio")
          (#eq? @ignore "ignore")
          (#eq? @child @child_use)
          (#eq? @unref "unref")
          (#eq? @fn @fn_use))
  - id: node-jpeg-printable-function-loader
    desc: Evaluates printable bytes extracted from image
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration name: (identifier) @fn parameters: (formal_parameters (identifier) @file)
            body: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @bytes value: (call_expression
                function: (member_expression object: (identifier) @fs property: (property_identifier) @read)
                arguments: (arguments (identifier) @file_use))))
              (lexical_declaration (variable_declarator name: (identifier) @text value: (string)))
              (lexical_declaration (variable_declarator name: (identifier) @gate value: (false)))
              (for_statement
                initializer: (lexical_declaration (variable_declarator name: (identifier) @index value: (number) @zero))
                condition: (binary_expression left: (identifier) @index_test operator: "<"
                  right: (member_expression object: (identifier) @bytes_length property: (property_identifier) @bytes_length_key))
                increment: (update_expression argument: (identifier) @index_inc operator: "++")
                body: (statement_block
                (lexical_declaration (variable_declarator name: (identifier) @byte value: (subscript_expression object: (identifier) @bytes_use index: (identifier) @index_use)))
                (if_statement condition: (parenthesized_expression (binary_expression
                  left: (binary_expression left: (identifier) @byte_low operator: ">=" right: (number) @low)
                  operator: "&&" right: (binary_expression left: (identifier) @byte_high operator: "<=" right: (number) @high)))
                  consequence: (statement_block (expression_statement (augmented_assignment_expression
                  left: (identifier) @text_append operator: "+=" right: (call_expression function: (member_expression object: (identifier) @string property: (property_identifier) @from_char)
                    arguments: (arguments (identifier) @byte_use)))))
                  alternative: (else_clause (statement_block (if_statement
                    condition: (parenthesized_expression (binary_expression left: (member_expression object: (identifier) @text_length property: (property_identifier) @length)
                      operator: ">" right: (number) @threshold))
                    consequence: (statement_block (expression_statement (assignment_expression left: (identifier) @gate_set right: (true))))))))))
              (lexical_declaration (variable_declarator name: (identifier) @body value: (template_string)))
              (if_statement condition: (parenthesized_expression (identifier) @gate_use) consequence: (statement_block
                (expression_statement (assignment_expression left: (identifier) @body_set right: (identifier) @text_use))))
              (lexical_declaration (variable_declarator name: (identifier) @func value: (new_expression constructor: (identifier) @function
                arguments: (arguments (string (string_fragment) @https_arg) (string (string_fragment) @exec_arg) (string (string_fragment) @os_arg) (identifier) @body_use))))
              (expression_statement (call_expression function: (identifier) @func_use arguments: (arguments (identifier) @https (identifier) @exec (identifier) @os)))))
          (expression_statement (call_expression function: (identifier) @fn_use arguments: (arguments (string (string_fragment) @image)))))
          (#eq? @file @file_use)
          (#eq? @fs "fs")
          (#eq? @read "readFileSync")
          (#eq? @bytes @bytes_use)
          (#eq? @bytes @bytes_length)
          (#eq? @bytes_length_key "length")
          (#eq? @index @index_test)
          (#eq? @index @index_inc)
          (#eq? @index @index_use)
          (#eq? @zero "0")
          (#eq? @text @text_append)
          (#eq? @byte @byte_use)
          (#eq? @byte @byte_low)
          (#eq? @byte @byte_high)
          (#eq? @low "32")
          (#eq? @high "126")
          (#eq? @text @text_length)
          (#eq? @length "length")
          (#eq? @threshold "2000")
          (#eq? @string "String")
          (#eq? @from_char "fromCharCode")
          (#eq? @gate @gate_set)
          (#eq? @gate @gate_use)
          (#eq? @body @body_set)
          (#eq? @text @text_use)
          (#eq? @body @body_use)
          (#eq? @function "Function")
          (#eq? @https_arg "https")
          (#eq? @exec_arg "exec")
          (#eq? @os_arg "os")
          (#eq? @https "https")
          (#eq? @exec "exec")
          (#eq? @os "os")
          (#eq? @func @func_use)
          (#eq? @fn @fn_use)
          (#eq? @image "logo2.jpg"))
  - id: jpeg-logo2-basename
    desc: JPEG named logo2
    crit: notable
    conf: 0.99
    for: [jpeg]
    if:
      type: basename
      exact: logo2.jpg
  - id: jpeg-command-poll-interval
    desc: Embedded script polls for commands
    crit: notable
    conf: 0.99
    for: [jpeg]
    if:
      type: text
      substr: 'setInterval(fetchAndExecuteCommand,fetchInterval)'
  - id: jpeg-command-execution
    desc: Embedded script executes polled command
    crit: notable
    conf: 0.99
    for: [jpeg]
    if:
      type: text
      substr: "exec(_0x41cd12,{'cwd':process"
  - id: jpeg-command-result-upload
    desc: Embedded script posts command result
    crit: notable
    conf: 0.99
    for: [jpeg]
    if:
      type: text
      substr: 'postResult(_0x4a96cd)'

composite_rules:
  - id: jpeg-embedded-command-poller
    desc: JPEG contains command polling script
    crit: suspicious
    conf: 0.99
    for: [jpeg]
    scope: file
    near_bytes: 8192
    all:
      - id: jpeg-logo2-basename
      - id: jpeg-command-poll-interval
      - id: jpeg-command-execution
      - id: jpeg-command-result-upload
  - id: npm-detached-jpeg-command-loader
    desc: Install launches JPEG command loader
    crit: hostile
    conf: 0.99
    for: [zip, npm, package.json, javascript, jpeg]
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-index-entry
      - id: node-jpeg-loader-detached-entry
      - id: node-jpeg-printable-function-loader
      - id: jpeg-embedded-command-poller
