# npm packages that declare a tiny C/native helper but ship a multi-MB Go
# binary under a vendor/solver-* name (codebreak 1.3.0 / MAL-2026-13736 class).
# Legitimate C solvers for that layout stay under ~100KB.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1195.002
  mbc: B0030
  size_min: 1048576

traits:
  - id: vendor-solver-platform-basename
    desc: solver-<os>-<arch> vendor basename
    crit: notable
    conf: 0.94
    if:
      type: value
      path: file.basename
      regex: '(?i)^solver-[a-z0-9]+-[a-z0-9_]+$'

composite_rules:
  - id: oversized-go-vendor-solver-binary
    desc: Multi-MB Go binary fills solver-* vendor slot
    crit: hostile
    conf: 0.97
    all:
      - id: vendor-solver-platform-basename
      - id: metadata/lang/compiler/systems::go-binary

  - id: oversized-go-vendor-solver-os-exec
    desc: Oversized Go vendor solver embeds os/exec
    crit: hostile
    conf: 0.98
    all:
      - id: oversized-go-vendor-solver-binary
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
