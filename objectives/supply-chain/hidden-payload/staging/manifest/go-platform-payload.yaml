# A published Go package that embeds per-platform packed payload binaries
# behind go:embed and ships a manifest mapping those libraries to digests is
# building the delivery half of a staged loader: opaque bytes, keyed by
# platform, materialized by package code at run time. Neither leg is hostile
# alone; the pairing in one distribution is not how tooling ships code.
defaults:
  platforms: [linux, macos, windows]
  for: [go, source, json, text]

traits:
  - id: go-embed-platform-payload-directive
    desc: go:embed names a binary payload file
    crit: notable
    conf: 0.93
    for: [go, source]
    if:
      type: text
      regex: '(?m)//go:embed\s+.{0,80}\.(dll|so|dylib|payload)\b'
  - id: payload-library-manifest-sha256-map
    desc: Manifest maps payload libraries to digests
    crit: notable
    conf: 0.93
    for: [json, text]
    if:
      type: text
      regex: '"(libraries|payloads)"\s*:\s*\{[\s\S]{0,600}"[0-9a-f]{64}"'

composite_rules:
  - id: go-embed-payload-manifest-staging
    desc: Package embeds staged platform payloads
    crit: hostile
    conf: 0.9
    scope: outer
    # zip/tar/npm keep a pooled-scope node on archive containers. The packed
    # payload leg separates this from tooling that embeds a known shared
    # library in the open; tests/docs directories must not suppress it, since
    # trojanized packages ship those too.
    for: [go, source, json, text, zip, tar, npm]
    all:
      - id: go-embed-platform-payload-directive
      - id: payload-library-manifest-sha256-map
      - id: metadata/binary/provenance/build::recognized-upx-packer
