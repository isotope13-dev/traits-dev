# package.json staging tricks that conceal extra dependency keys.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1027
  crit: notable
  conf: 0.95

traits:
  - id: dependencies-comma-long-whitespace-key
    desc: dependencies hides next key behind whitespace
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '":\s*"[^"]{0,64}",\s{80,}"'

composite_rules:
  - id: npm-whitespace-padded-typosquat-tarball
    for: [package.json, npm, tar, tgz, zip]
    desc: Whitespace-concealed typosquat registry tarball
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002
    all:
      - id: dependencies-comma-long-whitespace-key
      - id: objectives/supply-chain/impersonation/registry/spoofed::dep-fake-npmjs-registry-tarball
