# package.json staging tricks that conceal extra dependency keys.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1027
  crit: notable
  conf: 0.95

composite_rules:
  - id: npm-whitespace-padded-typosquat-tarball
    for: [package.json, npm, tar, tgz, zip]
    desc: Whitespace-concealed typosquat registry tarball
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002
    all:
      - id: metadata/package/dependencies/manifest/source::npm-inline-whitespace-tarball-dependency
      - id: objectives/supply-chain/impersonation/registry/spoofed::dep-fake-npmjs-registry-tarball
