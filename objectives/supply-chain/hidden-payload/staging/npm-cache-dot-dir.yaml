# Implant staged inside the dependency tree's build cache.
#
# `node_modules/.cache/` is where bundlers and transpilers keep their
# artifacts, so it is noisy, gitignored, wiped without comment, and skipped by
# reviewers reading a project. A *dot-prefixed* subdirectory beneath it is not
# something a build tool produces, and code that constructs that path
# deliberately is addressing a payload someone hid there -- the Mirage Kitten
# coding-challenge archives shipped their Node.js RAT at
# node_modules/.cache/.320697f1/index.js so `npm i && node index.js` would
# start it while the candidate read the challenge.
#
# ATT&CK: T1195.002 (Compromise Software Supply Chain), T1564.001 (Hidden
# Files and Directories)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1564.001
  mbc: F0002
traits:
  - id: node-modules-cache-hidden-dir
    desc: Path into a hidden node_modules cache directory
    crit: suspicious
    conf: 0.9
    if:
      # The joint between `.cache` and the hidden child must be a path
      # separator: a comma there matches prose lists quoting directory names
      # (Claude Code's extension schema describes `"node_modules", ".cache",
      # ".bin"` as sparse-checkout examples), not a path anyone constructs.
      type: text
      regex: 'node_modules["'']?\s*[,/\\]\s*["'']?\.cache["'']?\s*[/\\]\s*["'']?\.'

composite_rules:
  - id: hidden-npm-cache-stage-launch
    desc: Launches a payload from a hidden npm cache path
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1564.001,T1059.007
    all:
      - id: node-modules-cache-hidden-dir
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
