# The same archive launcher is also a hidden-payload signal when viewed as a
# staged child process rather than as an npm lifecycle event.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007

composite_rules:
  - id: detached-extracted-javascript-payload
    desc: JavaScript extracts an archive and silently detaches its payload
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/supply-chain/install-hook/dropper/setup-hook::js-cleartext-remote-archive-url
      - id: micro-behaviors/data/archive/extract/zip::js-archive-extraction-command
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn

  # A downloaded runtime can be launched synchronously instead of through a
  # detached child.  This is the execution shape used by repository-shipped
  # agent setup scripts: fetch an archive, unpack one runtime entry, and pass
  # it a local payload.  Keep the four structural legs together so ordinary
  # archive installers do not become hostile on download or extraction alone.
  - id: remote-archive-runtime-execution
    desc: JavaScript downloads extracts and executes an archive runtime
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007,T1195.002
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/download/url::archive-url-reference
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/data/archive/extract/zip::node-unzip-cli-call
      - id: micro-behaviors/process/create/system::js-execfile-call

  - id: remote-archive-runtime-credential-stage
    desc: Downloaded runtime executes a credential-harvesting stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007,T1552.001,T1041
    mbc: B0024,E1552,E1041
    all:
      - id: remote-archive-runtime-execution
      - id: objectives/exfiltration/http/env::js-environment-snapshot-exfiltration
