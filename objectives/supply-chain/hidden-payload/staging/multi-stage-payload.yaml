# Supply Chain Multi-Stage Payload Detection (AST-based)
# Detects malware using multiple git clones for staged payload delivery
# ATT&CK: T1195.001 (Supply Chain), T1105 (Ingress Tool Transfer)
# MBC: E1105 (Tool Transfer)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: "T1195.001"
  mbc: "E1105"
  for: [python]
traits:
# A symbol is a dotted path of identifiers -- no parentheses, no argument
# text -- so the `exact:` spellings these rules used never matched anything:
# they were regexes describing source text, sitting in a field that compares
# literally. The call name belongs in `regex:` and an argument constraint in
# `arg:`, which is the clause that actually inspects arguments.
  # === AST Pattern: GitPython handle construction ===
  # This finds `git.Git(...)` -- constructing GitPython's raw command wrapper,
  # which proxies arbitrary `git` subcommands -- not a clone. Named for what
  # it matches; the clone itself is `python-repo-clone-call`.
  - id: ast-gitpython-handle
    desc: Constructs a GitPython command handle
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Git$'
  # Two traits were removed here, both defeated by the same detail: inside an
  # `arg:` filter an identifier argument is matched by `name:` only. `regex:`
  # and `substr:` there are silently dropped, so the filter degraded to "this
  # call has *any* identifier argument".
  #
  #   `ast-clone-with-variable` ("Clone using repoDirectory variable") then
  #   matched every `.clone(x)` in any codebase, and its intended form named
  #   two attacker-chosen variable spellings -- an IOC, not a technique.
  #   `python-repeated-repo-clone-calls` and `ast-gitpython-handle` already
  #   carry the staging signal without depending on local variable names.
  #
  #   `ast-cmdclass-in-setup` ("cmdclass parameter in setup") matched every
  #   `*.setup(obj, ...)` call -- `aiohttp_jinja2.setup(app, loader=...)`
  #   among them -- at `suspicious`, and could never have worked as written:
  #   keyword arguments project as an opaque `expression` shape, so no `arg:`
  #   filter can see `cmdclass=`. The working spelling is the text matcher
  #   `install-hook/dropper/ast::cmdclass-install-phase-override`, filed with
  #   the other install-hook evidence and correctly rated `notable`.
composite_rules:
  # === Multi-Stage Payload Detection ===
  - id: ast-staged-payload-delivery
    desc: Staged payload via git clone AST
    crit: suspicious
    conf: 0.90
    attack: "T1105"
    all:
      - id: micro-behaviors/process/create/vcs/git::python-repeated-repo-clone-calls
      - id: ast-gitpython-handle
  - id: ast-supply-chain-stager
    desc: Supply chain stager malware AST
    crit: hostile
    conf: 0.95
    # `ast-method-with-clone-and-startfile` used to sit here too. It matched
    # `def run`, which no function symbol ever equals -- a function symbol is
    # the bare name -- so once repaired it became an exact duplicate of the
    # install-hook leg below, and listing the same fact twice narrows nothing.
    all:
      - id: ast-staged-payload-delivery
      - id: objectives/supply-chain/install-hook/dropper/ast::ast-install-method-override
