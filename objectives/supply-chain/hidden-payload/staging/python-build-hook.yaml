# Python build hooks that retrieve concealed remote data and leave a local
# marker are supply-chain staging behavior, even when they do not execute the
# fetched bytes in the same function.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1027,T1105

traits:
  - id: build-hook-absolute-temp-marker
    desc: References an absolute temporary path
    crit: component
    conf: 0.9
    if:
      # A parsed call excludes commented-out staging examples.
      type: tree-sitter
      kind: call
      regex: '(?i)\b(Path|open)\s*\(\s*["'']/tmp/[A-Za-z0-9._-]{1,40}'

composite_rules:
  - id: python-build-hook-remote-result-staging
    desc: Build hook fetches concealed data and records a temp marker
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::setup-py-encrypted-build-hook-fetch
      - id: build-hook-absolute-temp-marker
      - id: micro-behaviors/fs/write/file/direct::python-pathlib-write-text
  - id: python-build-hook-decrypted-result-staging
    desc: Build hook decrypts data and stages temporary output
    crit: hostile
    conf: 0.995
    scope: file
    attack: T1195.002,T1027,T1140
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::setup-py-encrypted-build-hook-write
      - id: build-hook-absolute-temp-marker
      - id: micro-behaviors/fs/write/file/direct::python-pathlib-write-text
    unless:
      - id: metadata/package/testing/
