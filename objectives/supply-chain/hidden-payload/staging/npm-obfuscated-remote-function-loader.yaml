# A published npm archive that contains the obfuscated remote Function loader
# is a supply-chain delivery boundary, distinct from the loader behavior itself.
defaults:
  platforms: [windows, unix]
  for: [npm]
  attack: T1195.002
  mbc: B0009.016

composite_rules:
  - id: npm-obfuscated-remote-function-loader
    desc: Published npm package delivers an obfuscated remote Function loader
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1027,T1059.007,T1105
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::obfuscated-fetch-function-loader

  - id: npm-helper-wrapped-fetch-function-loader
    desc: Published npm package delivers a helper-wrapped remote Function loader
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1027,T1059.007,T1105
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::obfuscated-helper-fetch-function-iife-loader

  - id: npm-remote-json-require-loader
    desc: npm package delivers remote JSON Function
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1059.007,T1105,T1140
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::fetch-json-message-function-loader
