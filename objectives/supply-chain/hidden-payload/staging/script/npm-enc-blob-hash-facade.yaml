# A package whose module only addresses a co-shipped .bin: it joins that path
# from the script directory, streams the file into a hash, and updates the
# hash again when the stream ends, after decoding a caller-supplied Base64
# attachment. That facade is a hash API. It becomes a staged payload when the
# co-shipped file is a custom high-entropy ENC container rather than an
# executable the hash could be checking.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1027.013
  mbc: B0024

composite_rules:
  - id: bundled-bin-stream-hash-facade
    desc: Hashes bundled bin plus decoded bytes
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    size_max: 16384
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/self::script-relative-bin-join
      - id: micro-behaviors/crypto/hash/digest::stream-read-into-hash-update
      - id: micro-behaviors/crypto/hash/digest::hash-update-on-stream-end
      - id: micro-behaviors/crypto/hash/digest::node-createhash-call
      - id: micro-behaviors/crypto/hash/digest::hash-object-digest-call
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text

  - id: enc-container-stream-hash-package
    desc: Hashes custom ENC blob with attachment
    crit: suspicious
    conf: 0.96
    for: [npm, tar, javascript, typescript, data]
    scope: archive
    all:
      - id: bundled-bin-stream-hash-facade
      - id: metadata/file/magic/identity::high-entropy-enc-container

  # Hashing some ENC-tagged blob is the suspicious rule above: RELENC01
  # and other YUIENC01 utilities do that. The hostile package is the one
  # whose facade hashes a co-shipped YUIENC01$R container while the manifest
  # installs only on Windows, and the member is ciphertext rather than a
  # native image.
  - id: yuienc-dollar-r-hash-facade-package
    desc: Hash facade stages a YUIENC01$R container
    crit: hostile
    conf: 0.97
    for: [npm, tar, javascript, typescript, data, package.json]
    scope: archive
    all:
      - id: bundled-bin-stream-hash-facade
      - id: metadata/file/magic/identity::yuienc01-dollar-r-header
      - id: metadata/file/data-blob::very-high-entropy-data-file
      - id: metadata/package/runtime::windows-only-platform-restriction
