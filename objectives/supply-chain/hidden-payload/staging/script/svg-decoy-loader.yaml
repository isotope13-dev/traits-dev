# Shared npm dropper stub that hides a staged-package install/load behind
# SVG-validation identifiers.
#
# The same verbatim block has now shipped in two unrelated name-squats:
#   * svg-content-validation            -> stages `svg-safety-tool`
#   * rollup-packages-node-polyfills    -> stages `cors-update`
# The second carries no SVG code at all (it is a byte-for-byte copy of
# rollup-plugin-polyfill-node with this stub appended to dist/index.js), which
# is exactly why these identifiers must not be filed under either package's
# name: `ValidateSvgModule`, the `svgo` handle and `MODULE_NAME` are the
# actor's decoy naming, not a description of the host package. Keying the
# family on the stub itself attributes the next squat even when both the
# squatted package and the staged second stage change.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 5000000
  attack: T1195.002

traits:
  - id: objectives/supply-chain/hidden-payload/staging/script::validate-svg-module-fn
    desc: ValidateSvgModule decoy wrapper identifier
    crit: suspicious
    conf: 0.98
    attack: "T1036"
    if:
      type: symbol
      exact: ValidateSvgModule
  - id: objectives/supply-chain/hidden-payload/staging/script::svgo-handle-get-plugin-call
    desc: getPlugin called on an svgo-named handle
    crit: suspicious
    conf: 0.99
    attack: "T1036"
    if:
      type: symbol
      exact: svgo.getPlugin
  # One token of the svg-decoy stub signature. On its own it is also the
  # standard OpenTelemetry instrumentation idiom (`const MODULE_NAME =
  # '<library>'; require(MODULE_NAME)` to patch the instrumented library) —
  # every OTel/OpenInference instrumentation package carries it — so it
  # states no fact alone and exists only as a composite leg.
  - id: objectives/supply-chain/hidden-payload/staging/script::module-name-const-require
    desc: require() of a MODULE_NAME constant
    crit: component
    conf: 0.98
    attack: "T1059.007"
    if:
      type: text
      substr: require(MODULE_NAME)
  - id: objectives/supply-chain/hidden-payload/staging/script::encoded-svg-safety-tool
    desc: Encoded svg-safety-tool install target
    crit: suspicious
    conf: 0.995
    if:
      type: encoded
      exact: svg-safety-tool
  - id: objectives/supply-chain/hidden-payload/staging/script::npm-install-svg-safety-tool
    desc: Installs svg-safety-tool package
    crit: suspicious
    conf: 0.995
    if:
      type: string_literal
      exact: npm install svg-safety-tool
  - id: objectives/supply-chain/hidden-payload/staging/script::npm-list-svg-safety-tool
    desc: Checks svg-safety-tool package
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      exact: npm list svg-safety-tool
  - id: objectives/supply-chain/hidden-payload/staging/script::require-svg-safety-tool
    desc: Requires svg-safety-tool module
    crit: suspicious
    conf: 0.995
    if:
      type: text
      regex: require\(['"]svg-safety-tool['"]\)
  # The `ValidateSvgModule` / `svgo.getPlugin` / `require(MODULE_NAME)` stub is
  # not specific to this package — the identical block ships in
  # rollup-packages-node-polyfills, which stages `cors-update` and contains no
  # SVG code at all. Those three atoms therefore live in the stub's own family,
  # well-known/malware/supply-chain/svg-decoy-loader, and are referenced here.
  - id: objectives/supply-chain/hidden-payload/staging/script::script-dir-default
    desc: Defaults to ./script SVG scan
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: dirPath = './script'

composite_rules:
  # All three decoy identifiers in one file is the stub verbatim; no benign
  # package names a wrapper ValidateSvgModule, requires a MODULE_NAME const and
  # calls getPlugin() on an svgo handle at the same time.
  - id: objectives/supply-chain/hidden-payload/staging/script::svg-decoy-staged-module-loader
    desc: SVG decoy wrapper around staged module load
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1027"
    mbc: "B0024"
    all:
      - id: objectives/supply-chain/hidden-payload/staging/script::validate-svg-module-fn
      - id: objectives/supply-chain/hidden-payload/staging/script::module-name-const-require
      - id: objectives/supply-chain/hidden-payload/staging/script::svgo-handle-get-plugin-call
  - id: objectives/supply-chain/hidden-payload/staging/script::hidden-svg-tool-installer
    for: [npm, package.json, javascript]
    desc: svg-content-validation hidden installer
    crit: suspicious
    conf: 0.995
    all:
    - id: objectives/supply-chain/hidden-payload/staging/script::encoded-svg-safety-tool
    - id: objectives/supply-chain/hidden-payload/staging/script::validate-svg-module-fn
    - id: objectives/supply-chain/hidden-payload/staging/script::module-name-const-require
    - id: objectives/supply-chain/install-hook/scripts/encoded-body::encoded-npm-cmd
  - id: objectives/supply-chain/hidden-payload/staging/script::fake-svg-validator-loader
    desc: svg validator facade with hidden loader
    crit: hostile
    conf: 0.99
    all:
    - id: objectives/supply-chain/hidden-payload/staging/script::encoded-svg-safety-tool
    - id: objectives/supply-chain/hidden-payload/staging/script::module-name-const-require
    - id: objectives/supply-chain/hidden-payload/staging/script::script-dir-default
    any:
    - id: objectives/supply-chain/hidden-payload/staging/script::validate-svg-module-fn
    - id: objectives/supply-chain/install-hook/scripts/local-script::silent-npm-lifecycle-dropper
  - id: objectives/supply-chain/hidden-payload/staging/script::literal-svg-safety-loader
    desc: svg-content-validation literal hidden loader
    crit: hostile
    conf: 0.995
    all:
    - id: objectives/supply-chain/hidden-payload/staging/script::npm-install-svg-safety-tool
    - id: objectives/supply-chain/hidden-payload/staging/script::npm-list-svg-safety-tool
    - id: objectives/supply-chain/hidden-payload/staging/script::require-svg-safety-tool
    - id: objectives/supply-chain/hidden-payload/staging/script::svgo-handle-get-plugin-call
