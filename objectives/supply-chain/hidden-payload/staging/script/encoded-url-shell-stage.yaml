defaults:
  platforms: [unix]
  for: [shell]
  attack: T1195.002

composite_rules:
  - id: fresh-package-encoded-shell-stage
    for: [shell, registry]
    desc: Fresh package contains encoded curl shell stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1105,T1059.004,T1195.002
    scope: outer
    all:
      - id: metadata/registry::freshly-published
      - id: micro-behaviors/process/create/shell/pipeline::base64-http-destination-shell-pipeline

  # The registry leg above only fires for freshly published packages. Without
  # it a base64-hidden download URL piped into a shell stays suspicious: the
  # committed shell-good-review/decoded-url.sh and controls/encoded-url-shell-loader.sh
  # fixtures are labeled suspicious, so this composite must not exceed that.
  - id: encoded-url-curl-shell-pipeline
    desc: Shell pipes curl output from a base64-hidden URL
    crit: suspicious
    conf: 0.95
    attack: T1027,T1105,T1059.004
    near_lines: 2
    all:
      - id: micro-behaviors/process/create/shell/pipeline::base64-http-destination-shell-pipeline
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-command-line
