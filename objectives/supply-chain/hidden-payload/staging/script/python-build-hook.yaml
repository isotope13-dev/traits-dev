# Python build hooks that retrieve concealed remote data and leave a local
# marker are supply-chain staging behavior, even when they do not execute the
# fetched bytes in the same function.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1027,T1105


composite_rules:
  - id: objectives/supply-chain/hidden-payload/staging/script::python-build-hook-remote-result-staging
    desc: Build hook fetches concealed data and records a temp marker
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral/stage::setup-py-encrypted-build-hook-fetch
      - id: micro-behaviors/fs/file/open::python-open-hardcoded-tmp-path
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text
  - id: objectives/supply-chain/hidden-payload/staging/script::python-build-hook-decrypted-result-staging
    desc: Build hook decrypts data and stages temporary output
    crit: hostile
    conf: 0.995
    scope: file
    attack: T1195.002,T1027,T1140
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral/stage::setup-py-encrypted-build-hook-write
      - id: micro-behaviors/fs/file/open::python-open-hardcoded-tmp-path
    unless:
      - id: metadata/package/testing/
