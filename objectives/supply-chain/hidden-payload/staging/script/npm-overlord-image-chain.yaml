# Overlord RAT npm chain: cdn-img-fetch stages a remote JPG payload on
# import; img-to-native decrypts the PNG tail into node_runtime_helper.exe.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1105,T1027.003

composite_rules:
  - id: npm-cdn-img-fetch-loadtime-banner-stager
    desc: cdn-img-fetch caches remote GitHub image on load
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::npm-package-name-cdn-img-fetch
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-any
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
    unless:
      - id: metadata/package/testing/

  - id: npm-cdn-img-fetch-dot-cache-banner-prefetch
    desc: cdn-img-fetch seeds dot-cache banner.jpg on import
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::npm-package-name-cdn-img-fetch
      - id: micro-behaviors/fs/path/self::node-package-dot-cache-path
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-any
    unless:
      - id: metadata/package/testing/

  - id: npm-img-to-native-png-exe-dropper-package
    desc: img-to-native decrypts PNG tail to helper exe
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::npm-package-name-img-to-native
      - id: objectives/command-and-control/dropper/staging/encrypted::javascript-png-tail-aes-exe-dropper
    unless:
      - id: metadata/package/testing/

  - id: npm-img-to-native-cdn-fetch-chain
    desc: img-to-native pulls cdn-img-fetch stager dependency
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::npm-package-name-img-to-native
      - id: metadata/package/dependencies/manifest/identity::npm-dep-cdn-img-fetch
      - id: objectives/supply-chain/hidden-payload/staging/script::npm-cdn-img-fetch-loadtime-banner-stager
    unless:
      - id: metadata/package/testing/
