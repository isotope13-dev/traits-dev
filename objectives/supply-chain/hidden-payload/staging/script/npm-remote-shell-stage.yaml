defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]
composite_rules:
  - id: npm-postinstall-stream-shell-stager
    desc: npm postinstall stages remote shell script
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1059.004"
    mbc: "B0024"
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/path/script::shell-script-ref
