defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]
composite_rules:
  - id: npm-postinstall-stream-shell-stager
    desc: npm postinstall with HTTP download near shell script path
    crit: notable
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1059.004"
    mbc: "B0024"
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/execution/staging/store::node-stream-shell-path-nearby
