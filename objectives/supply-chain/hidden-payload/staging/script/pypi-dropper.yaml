# Supply-Chain Hidden Payload - PyPI Dropper with Obfuscation
# Detects PyPI packages that hide dropper code behind legitimate-looking
# facade code using whitespace obfuscation or similar techniques.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002
  mbc: E1027
composite_rules:
  # PyPI package with hidden exec dropper behind excessive whitespace
  # The dropper is concealed on an extremely long line (>500 chars)
  # to avoid detection during casual code review.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-whitespace-hidden-dropper
    desc: PyPI dropper hidden behind excessive whitespace
    conf: 0.96
    all:
      - id: micro-behaviors/process/deploy::python-urllib-response-exec
      - id: objectives/anti-static/obfuscation/code-metrics/structure::py-excessive-whitespace-line
  # PyPI package with exec dropper and near-zero documentation
  # Combines the dropper with code quality signals typical of
  # supply-chain attacks.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-dropper-with-facade
    desc: PyPI package with dropper and facade code
    conf: 0.93
    all:
      - id: micro-behaviors/process/deploy::python-urllib-response-exec
      - id: metadata/file/size::init-py-file
    any:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::py-excessive-whitespace-line
      - id: metadata/file/comment::small-source-low-comment-ratio
      - id: metadata/package/author/domain::pkginfo-privacy-email-1
  # Import-time package code that downloads a response, arms it as executable,
  # and launches it is a payload loader even when the wheel has no setup hook.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-init-download-chmod-exec
    desc: Package init downloads and executes a payload
    conf: 0.99
    attack: T1195.002,T1105,T1059.006,T1222.002
    mbc: B0024
    all:
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
      - id: micro-behaviors/fs/chmod/executable/mode::python-owner-executable-bit
      - id: micro-behaviors/process/create/subprocess::process-execution

  # A source distribution that embeds an encoded import-time fetch-and-exec
  # loader in a module, rather than in setup.py or __init__.py.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-sdist-encoded-remote-exec
    desc: Python source distribution hides encoded remote code execution
    conf: 0.99
    attack: T1195.002,T1027,T1105,T1059.006
    mbc: E1027,B0032,B0024
    for: [python-sdist, python]
    scope: archive
    all:
      - id: metadata/build/pip::root-setup-py-path
      - id: metadata/package/versioning/scheme::pkginfo-lowest-version
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-exec
      - id: micro-behaviors/process/deploy::python-urllib-response-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/host::pythonw-exe-replace-trick

  # A wheel whose normal runtime code consumes a mutable remote resource
  # manifest and invisibly launches its payload is a trojanized package even
  # without a setup.py hook. Archive scope ties the loader to a real wheel.
  - id: objectives/supply-chain/hidden-payload/staging/script::python-wheel-remote-manifest-hidden-exec
    desc: Wheel invisibly runs remote manifest payload
    conf: 0.995
    for: [whl, python]
    scope: archive
    attack: T1195.002,T1105,T1059.006
    all:
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
      - id: objectives/command-and-control/dropper/python-script::python-remote-manifest-hidden-transient-exec

  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-wheel-import-time-base64-zlib-exec
    desc: Wheel runs Base64 zlib packed code at import
    conf: 0.99
    for: [whl, python]
    scope: archive
    attack: T1195.002,T1027,T1059.006
    mbc: B0024,B0032
    all:
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
      - id: objectives/supply-chain/hidden-payload/staging/script::pypi-import-time-base64-zlib-exec-module

  # A module that dynamically loads a sibling payload via importlib
  # (spec_from_file_location + exec_module), then runs it in a daemon thread
  # as a module-level side effect, is a backgrounded import-time loader: the
  # victim never calls a function, merely importing the package fires the
  # payload off the main thread so it survives the import. Legitimate plugin
  # managers load on an explicit API call inside a function, not at module
  # scope in a fire-and-forget thread.
  - id: objectives/supply-chain/hidden-payload/staging/script::python-import-thread-dynamic-module-exec
    desc: Import runs a dynamically-loaded module in a daemon thread
    conf: 0.97
    attack: T1195.002,T1059.006,T1027
    near_lines: 50
    all:
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/os/api-resolution/dynamic::python-importlib-spec-exec-module
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    unless:
      - id: metadata/package/testing/
      # main.py loads custom-node scripts, then starts the prompt worker thread.
      - id: well-known/app/ai/media/comfyui::comfyui-main-script

  # A source distribution with a module-import side effect and a decompressed
  # Python exec payload crosses both package and source-distribution boundaries.
      - id: "metadata/file/naming::test-directory-component"
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-sdist-import-time-packed-loader
    desc: Sdist activates packed Python code at import
    crit: hostile
    conf: 0.99
    for: [python-sdist, tar, python, pyproject.toml]
    scope: archive
    attack: T1195.002,T1027,T1059.006
    mbc: B0024,B0032
    all:
      - id: metadata/build/pip::root-setup-py-path
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/data/encode/base85::b85decode-script
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin

  # Alternate Python packers keep the same install-time import activation but
  # swap the payload codec. Keep these variants grounded in both an sdist
  # package entrypoint and module-scope dynamic execution.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-sdist-import-time-gzip-loader
    desc: Sdist activates Base64 and gzip packed Python at import
    crit: hostile
    conf: 0.98
    for: [python-sdist, tar, python, pyproject.toml]
    scope: archive
    attack: T1195.002,T1027,T1059.006
    mbc: B0024,B0032
    all:
      - id: metadata/build/pip::root-setup-py-path
      - id: objectives/supply-chain/hidden-payload/staging/script::pypi-import-time-base64-gzip-exec-module

  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-import-time-base64-gzip-exec-module
    desc: Python module executes Base64 and gzip packed code at import
    crit: component
    conf: 0.98
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decompress/gzip::gzip-decompress-call
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin

  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-sdist-import-time-marshal-loader
    desc: Sdist activates marshaled Python code at import
    crit: hostile
    conf: 0.98
    for: [python-sdist, tar, python, pyproject.toml]
    scope: archive
    attack: T1195.002,T1027,T1059.006
    mbc: B0024,B0032
    all:
      - id: metadata/build/pip::root-setup-py-path
      - id: objectives/supply-chain/hidden-payload/staging/script::pypi-import-time-marshal-exec-module

  # Same file-local policy as the Base64/zlib body above: a packer source
  # tree legitimately contains marshal readers, module initializers and exec
  # in unrelated files (archive TOC parsing, frozen-app importers). Only one
  # module combining all three is a backend-stage signal.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-import-time-marshal-exec-module
    desc: Python module executes marshaled code at import
    crit: component
    conf: 0.98
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads-symbol
      - id: micro-behaviors/process/interpreter/eval/direct::module-scope-exec-builtin

  # Keep the packed import-time execution body file-local. A source tree can
  # legitimately contain Base64, zlib, module initializers and exec in
  # unrelated collections or tests; only one module combining them is a
  # backend-stage signal. The enclosing sdist rule then links that body to
  # PEP 517 build metadata at archive scope.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-import-time-base64-zlib-exec-module
    desc: Python module executes Base64 and zlib packed code at import
    crit: component
    conf: 0.98
    for: [python, whl]
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decompress/zlib::python-zlib-decompress
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin

  # Packed import-time source is also used for ordinary code protection.
  # The canonical suspicious decompressed-code-executed finding covers that
  # wrapper; a supply-chain conviction needs evidence from the decoded stage.
  - id: objectives/supply-chain/hidden-payload/staging/script::pypi-sdist-import-time-pep517-loader
    desc: PEP 517 sdist backend activates a packed Python stage at import
    crit: hostile
    conf: 0.98
    for: [python-sdist, tar, python, pyproject.toml]
    scope: archive
    attack: T1195.002,T1027,T1059.006
    mbc: B0024,B0032
    all:
      - id: metadata/build/pip::pyproject-is-pyproject
      - id: objectives/supply-chain/hidden-payload/staging/script::pypi-import-time-base64-zlib-exec-module
