defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: js-require-scoped-postcss-motion-helper
    desc: Requires scoped PostCSS motion or animate helper
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: 'require\s*\(\s*[''"]@[-a-z0-9_]+/postcss-(motion|animate|kinetix)[-_a-z0-9]*[''"]\s*\)'

  - id: js-to-postcss-options-fn
    desc: Defines toPostcssOptions helper function
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: 'function toPostcssOptions(config)'

  - id: js-build-motion-base-fn
    desc: Defines buildMotionBase PostCSS helper
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      substr: 'function buildMotionBase(config)'

composite_rules:
  - id: js-motion-base-scoped-postcss-helper-loader
    desc: Motion helper passes config into scoped PostCSS motion or animate package
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: js-require-scoped-postcss-motion-helper
      - id: js-to-postcss-options-fn
      - id: js-build-motion-base-fn
      - id: micro-behaviors/data/format/css::postcss-plugin-factory-registration

  - id: animatecss-tailwind-scoped-postcss-helper-stage
    desc: Animate.css Tailwind plugin stages interview-lure PostCSS helper
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/declaration::npm-animatecss-runtime-dependency
      - id: metadata/package/dependencies/declaration::npm-interview-postcss-helper-dependency
      - id: micro-behaviors/data/format/css::postcss-plugin-factory-registration
    any:
      - id: metadata/import/npm/jasperquinn/postcss-motion-helpers
      - id: metadata/import/npm/aaron205whitmore/postcss-animate-utils
      - id: metadata/import/npm/codentra/postcss-kinetix
      - id: js-require-scoped-postcss-motion-helper
