# Trojanized package __init__: a statement hidden past the review viewport
# resolves a Python builtin by a computed name. The facade code keeps working
# on import while the appended statement fetches or executes the real payload.
# Concealed placement in the package entry module plus dynamic builtin
# resolution has no benign package use.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1027,T1059.006
  mbc: B0032

composite_rules:
  - id: python-package-init-offscreen-builtin-resolution
    desc: Package init hides dynamic builtin lookup offscreen
    crit: hostile
    conf: 0.95
    scope: file
    near_lines: 2
    all:
      - id: metadata/file/size::init-py-file
      - id: metadata/file/line::python-statement-after-blank-run
      - id: micro-behaviors/metaprogramming/reflection/resolve::python-getattr-builtins
