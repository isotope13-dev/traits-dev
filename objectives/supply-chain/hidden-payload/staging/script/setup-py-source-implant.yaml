# A setup.py whose module body posts JSON and writes the response into a
# Python module as a quoted assignment makes the installed code depend on
# unreviewed server output. The write atom stays neutral.
#
# A setup.py the path facts place at a source root is the package's own
# build script. The benign sdist control is that script, and its sibling
# module keeps the response as data. This finding is the same writer when
# it is not identified as that root script.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105
  mbc: E1105

composite_rules:
  - id: setup-py-module-remote-source-write
    desc: setup.py writes a fetched body into Python source
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 25
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-repr-assignment
    unless:
      - id: metadata/build/pip::root-setup-py
      - id: "metadata/file/naming::test-directory-component"
