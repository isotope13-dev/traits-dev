# A setup.py whose module body posts JSON and writes the response into a
# Python module as a quoted assignment makes the installed code depend on
# unreviewed server output. The write atom stays neutral.
#
# The benign sdist control is that script inside the PEP 625 `<name>-<version>`
# root of its published source tree, reviewed together with the sibling
# modules that retain the response as data; `versioned-sdist-root-setup-py`
# names exactly that layout, so the suppression tracks the reviewed-tree
# context instead of the script's existence (a bare `root-setup-py` matches
# every setup.py and would suppress this finding everywhere). This finding is
# the same writer when it is not embedded in that versioned sdist root — a
# loose or standalone setup.py ships no sibling evidence, so the written
# module becomes install-time remote content with no review unit.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105
  mbc: E1105

composite_rules:
  - id: setup-py-module-remote-source-write
    desc: setup.py writes a fetched body into Python source
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 25
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-repr-assignment
    unless:
      - id: metadata/build/pip::versioned-sdist-root-setup-py
      - id: "metadata/file/naming::test-directory-component"
