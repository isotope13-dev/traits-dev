# Build loaders that disclose collected host information through build output.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002

composite_rules:
  - id: webpack-loader-host-recon-warning-disclosure
    desc: Build loader discloses shell host reconnaissance in a warning
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1082,T1033,T1195.002
    all:
      - id: objectives/supply-chain/trojanized/build-loader::webpack-loader-shell-host-recon
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
      - id: objectives/supply-chain/trojanized/build-loader::loader-emits-build-warning
