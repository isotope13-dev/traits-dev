# An npm package may legitimately contain a platform binary.  It becomes a
# supply-chain staging finding when the freshly published native package also
# embeds brokered agent routes and an explicit native-agent download path.
defaults:
  platforms: [unix, windows]
  for: [npm, archives]
  attack: T1195.002,T1105,T1059.004
  mbc: B0030

traits:
  - id: rescue-download-directory
    desc: Rescue download directory
    crit: notable
    conf: 0.96
    for: [macho, binaries]
    if:
      type: text
      exact: '/rescue/dl/'

composite_rules:
  - id: fresh-npm-brokered-native-agent-stage
    desc: Fresh npm native package stages a brokered remote agent
    crit: hostile
    conf: 0.995
    scope: package
    all:
      - id: metadata/package/manifest/runtime::has-platform-restrictions
      - id: metadata/registry::freshly-published
      - id: objectives/command-and-control/backdoor/shell/pty::broker-agent-session-route
      - id: objectives/command-and-control/backdoor/shell/pty::broker-agent-progress-route
      - id: rescue-download-directory
