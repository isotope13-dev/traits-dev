# A package that ships its next stages as ciphertext files wearing `.js`
# extensions, plus the loader that decrypts and requires them.
#
# The two halves are individually arguable and jointly are not. A `.js` file
# that parses to zero calls and holds one Base64 run is a data blob, and a
# publisher might conceivably ship one by accident; a module that scrypt-
# derives a key, AES-GCM decrypts a packaged file and `require()`s the
# plaintext is a loader, and a packer might conceivably ship one on purpose.
# A package containing both, in the same tree, is shipping a staged payload:
# nothing a registry reviewer or a static scanner can read is what actually
# runs.
#
# Motivating sample: math-universe / mathmain / mathsbase (npm, 2026-09).
# `lib/cjs/utils/{graph,fraction}.js` and `lib/cjs/utils/bignumber/type.js`
# are AES-256-GCM ciphertext; `lib/cjs/utils/event.js` is the decryptor;
# `lib/cjs/utils/is.js` calls it from `isGraph()`, reached from `lusolve()`
# when the caller passes one specific 3x3 matrix. The decrypted stages carry
# an X25519-keyed agent with Slack and Telegram channels and a Base Sepolia
# contract dead-drop -- none of which is readable in the published bytes.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1027.013,T1059.007
  mbc: B0024,B0032

composite_rules:
  - id: npm-encrypted-stage-files-with-decrypt-loader
    desc: Package ships encrypted stages and their loader
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, javascript, typescript, package.json]
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-module-is-base64-only
    any:
      - id: objectives/command-and-control/dropper/staging/encrypted::obfuscated-table-decrypt-module-loader
      - id: objectives/command-and-control/dropper/staging/encrypted::packed-aead-envelope-module-loader
      - id: objectives/command-and-control/dropper/staging/encrypted::node-local-file-decrypt-dynamic-load
    needs: 1
    # No `metadata/package/testing/` directory reference here. At archive
    # scope a directory `unless:` pools every member's findings, and one
    # karma config anywhere in the tree suppressed the whole rule on the
    # motivating sample. A ciphertext module plus an AEAD module loader is
    # not a shape a test tree has; the narrow scanner exception is enough.
    unless:
      - id: well-known/tool/detection/security-scanner/
