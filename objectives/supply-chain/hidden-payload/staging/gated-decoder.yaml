# Concealed package stages are distinguished from ordinary codec code by the
# conjunction of a hex-to-byte XOR chain, automatic package execution, and a
# hidden temporary output path; the activation gate is optional corroboration.
defaults:
  platforms: [linux, macos, windows]
  attack: T1195.002,T1027
  mbc: B0024

composite_rules:
  - id: automatic-package-decoded-hidden-stage
    desc: Package hook decodes hidden staged data
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/supply-chain/install-hook/runtime::package-automatic-execution-surface
      - id: objectives/supply-chain/install-hook/runtime::package-hidden-temp-stage
    any:
      - id: micro-behaviors/data/decode/hex
