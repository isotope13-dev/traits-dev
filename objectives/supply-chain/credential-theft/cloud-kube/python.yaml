defaults:
  platforms: [unix]
  for: [python]
  attack: "T1552.001, T1041"
  mbc: E1552

traits:
- id: python-serviceaccount-path-reference
  desc: Python references Kubernetes token files
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '/var/run/secrets/kubernetes\.io/serviceaccount[\s\S]{0,700}\b(token|namespace|ca\.crt)\b'
  unless:
  - id: metadata/library/runtime::kubernetes-incluster-client-text
  - id: metadata/library/runtime::legitimate-kubernetes-incluster-client-marker
  count_max: 1031026
- id: python-opens-serviceaccount-file
  desc: Python opens Kubernetes service-account file
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'open\s*\([^)]{0,80}serviceaccount/(token|namespace|ca\.crt)'
  count_max: 1031027
- id: python-kubectl-secret-dump
  desc: Python runs kubectl secret dump
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'kubectl.{0,80}get.{0,50}secrets'
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  - id: micro-behaviors/crypto/library/blockchain/
  - id: well-known/tool/detection/llm-scanner::mvar-security-context
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
- id: python-aws-secret-value-operation
  desc: Python references AWS secret-value operation
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: get_secret_value
  count_max: 1031029
- id: python-aws-secretsmanager-reference
  desc: Python references AWS Secrets Manager
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: secretsmanager
  count_max: 1031030
- id: python-aws-secretsmanager-client-call
  desc: Python calls AWS Secrets Manager client
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\b(boto3|botocore)\.client\s*\(\s*["'']secretsmanager["'']'
  count_max: 1031031
- id: python-list-secrets-call
  desc: Python calls a list_secrets method
  crit: component
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: '(^|\.)list_secrets$'
- id: python-cloud-secret-dir-join
  desc: Python joins cloud credential directory
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'os\.path\.join\s*\([^)]{0,80}["'']\.(aws|kube)["'']'
- id: python-serviceaccount-token-path-reference
  desc: Python references service-account token path
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: serviceaccount/token
- id: python-encryption-near-requests-post
  desc: Python encrypts data near requests POST
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(Fernet|AES|encrypt\s*\()[\s\S]{0,900}requests\.post\s*\('
  count_max: 1031039
- id: python-requests-post-near-encryption
  desc: Python posts data near encryption call
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'requests\.post\s*\([\s\S]{0,900}(Fernet|AES|encrypt\s*\()'
  count_max: 1031040
- id: python-api-key-name--openai
  desc: Python references OpenAI API key name
  crit: component
  conf: 0.9
  if:
    type: text
    word: OPENAI_API_KEY
- id: python-api-key-name--anthropic
  desc: Python references Anthropic API key name
  crit: component
  conf: 0.9
  if:
    type: text
    word: ANTHROPIC_API_KEY
composite_rules:
- id: python-provider-api-key-name
  desc: Python references provider API key name
  crit: component
  conf: 0.9
  any:
  - id: python-api-key-name--openai
  - id: python-api-key-name--anthropic
- id: pypi-aws-shared-credentials-http-theft
  desc: PyPI package exfiltrates AWS shared credentials
  crit: hostile
  conf: 0.99
  for: [python, pkginfo, zip]
  platforms: [unix, windows]
  all:
  - id: objectives/exfiltration/http/upload::aws-shared-credentials-http-exfil
  any:
  - id: metadata/build/pip::setup-py
  - id: metadata/build/pip::pyproject-toml
  - id: metadata/package/scripts::wheel-console-entrypoint
  scope: archive
- id: python-cloud-kube-secret-harvest
  desc: Python cloud Kubernetes secret harvest
  crit: hostile
  conf: 0.98
  all:
  - id: python-kube-serviceaccount-read
  any:
  - id: micro-behaviors/os/env/vars/credentials::python-ai-provider-key-env-read
  - id: objectives/supply-chain/credential-theft/env::python-cloud-creds
  - id: objectives/supply-chain/credential-theft/env::python-package-tokens
  - id: python-kubectl-secret-dump
  - id: python-secretsmanager-access
  - id: micro-behaviors/os/container/runtime::api-secrets-path
  - id: micro-behaviors/fs/path/sensitive/credentials::kube-config
  - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
  needs: 2

- id: python-encrypted-secret-bundle-exfil
  desc: Python encrypted secret bundle exfiltration
  crit: hostile
  conf: 0.985
  all:
  - id: python-cloud-kube-secret-harvest
  - id: python-secret-tar-archive
  - id: python-encrypted-post

- id: python-pth-secret-bundle-exfil
  desc: Python startup hook exfiltrates encrypted secret archive
  crit: hostile
  conf: 0.99
  attack: "T1546.004, T1552.001, T1041"
  all:
  - id: objectives/persistence/login/python-startup::python-pth-startup-file-write
  - id: python-secret-tar-archive
  - id: python-encrypted-post

- id: python-cloud-kube-archive-upload
  desc: Python cloud secrets archive upload
  crit: hostile
  conf: 0.985
  all:
  - id: python-cloud-kube-secret-harvest
  - id: python-secret-tar-archive
  any:
  - id: objectives/exfiltration/http/upload::python-targz-requests-post
  - id: objectives/exfiltration/http/upload::python-header-archive-post

- id: python-secret-exfil-systemd-backdoor
  desc: Python secret exfiltration systemd backdoor
  crit: hostile
  conf: 0.99
  all:
  - id: python-encrypted-secret-bundle-exfil
  - id: python-user-systemd-backdoor-install
- id: python-pth-secret-harvest-user-persistence
  desc: Python .pth cloud/Kubernetes harvest with user systemd persistence
  crit: hostile
  conf: 0.99
  attack: T1546.004,T1552.001,T1543.002,T1611
  all:
  - id: objectives/persistence/login/python-startup::pth-import-exec
  - id: objectives/supply-chain/credential-theft/env::python-bulk-secret-env-harvest
  - id: objectives/credential-access/cloud/token/files::kubernetes-serviceaccount-abuse
  - id: micro-behaviors/os/service/config::python-user-systemd-unit
- id: python-user-systemd-backdoor-install
  desc: Python systemd persistence with secret context
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/service/config::python-user-systemd-unit
  any:
  - id: python-cloud-kube-secret-harvest
  - id: python-secret-tar-archive
  - id: python-kubectl-secret-dump
  - id: python-secretsmanager-access
- id: python-kube-serviceaccount-read
  desc: Python reads Kubernetes serviceaccount files
  crit: suspicious
  conf: 0.94
  any:
  - id: python-serviceaccount-path-reference
  - id: python-opens-serviceaccount-file
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
- id: python-secretsmanager-access
  desc: Python accesses AWS Secrets Manager
  crit: suspicious
  conf: 0.95
  any:
  - id: python-aws-secret-value-operation
  - id: python-aws-secretsmanager-reference
  - id: python-aws-secretsmanager-client-call
  - id: python-aws-secretsmanager-list-operation
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  - id: micro-behaviors/crypto/library/blockchain/

- id: python-aws-secretsmanager-list-operation
  desc: Python calls AWS Secrets Manager list_secrets
  crit: notable
  conf: 0.95
  all:
  - id: python-aws-secretsmanager-client-call
  - id: python-list-secrets-call
  near_bytes: 2048

- id: python-secret-tar-archive
  desc: Python archives harvested secret files
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
  any:
  - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
  - id: micro-behaviors/fs/path/sensitive/credentials::kube-config
  - id: python-cloud-secret-dir-join
  - id: python-serviceaccount-token-path-reference
  - id: python-provider-api-key-name
  near_bytes: 1600
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/

- id: python-encrypted-post
  desc: Python posts encrypted data
  crit: suspicious
  conf: 0.94
  any:
  - id: python-encryption-near-requests-post
  - id: python-requests-post-near-encryption
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
