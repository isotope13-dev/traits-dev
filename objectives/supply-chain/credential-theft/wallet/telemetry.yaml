defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  - id: key-material-reporting-call
    desc: Key or seed reporting call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # A short method marker followed by a value is the characteristic shape
      # of key-derivation telemetry. Keep the name anchored to key/seed/
      # mnemonic/derivation concepts so ordinary event logging does not match.
      regex: '\b\w*(Key|Seed|Mnemonic|Deriv\w*)\w*\s*\(\s*["''][A-Za-z0-9._-]{1,16}["'']\s*,\s*.{1,60}[),]'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/lang/source::js-test-or-spec-basename
      - id: metadata/package/testing/presence/harness::test-spec-path-benign-context
    not:
      # WebCrypto and Node crypto APIs transform keys; they do not report
      # them. Keep this objective atom for named telemetry/reporting calls.
      - regex: '\b(?:import|export|generate|derive|wrap|unwrap)Key(?:Pair(?:Sync)?)?\s*\('
      - regex: '\bderiveBits\s*\('
      - regex: '\bvalidate\w*Key\w*\s*\('
      # SDK property accessors are not key-material telemetry.
      - regex: '\bgetKey\s*\('
      - substr: addKeyword
      - substr: removeKeyword
      - substr: getKeyword
