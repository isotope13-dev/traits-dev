defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

composite_rules:
  - id: obfuscated-wallet-api-relay
    desc: Obfuscated wallet API relays caller input over Axios
    crit: hostile
    conf: 0.98
    attack: T1027,T1552.001,T1071.001,T1041
    mbc: B0024
    all:
      - id: micro-behaviors/data/source/function/names::js-wallet-account-api-function
      - id: micro-behaviors/communications/http/request/url-computed::axios-computed-url-call
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/

      - id: metadata/path::test-directory-component
