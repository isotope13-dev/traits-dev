defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  - id: report-send-key-material-call
    desc: Report or send key-material method call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*(Key|Seed|Mnemonic)\w*\s*\('
  - id: upload-exfil-key-material-call
    desc: Upload or exfiltrate key-material method call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*(Key|Seed|Mnemonic)\w*\s*\('
composite_rules:
  - id: key-material-reporting-call
    desc: Key or seed reporting method call
    crit: suspicious
    conf: 0.94
    any:
      - id: report-send-key-material-call
      - id: upload-exfil-key-material-call
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/lang/source::js-test-or-spec-basename
      - id: metadata/package/testing/presence/harness::test-spec-path-benign-context
