defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  - id: report-send-private-secret-key-call
    desc: Send private or secret key call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*(PrivateKey|SecretKey)\w*\s*\('
    # Secret scanners name their detectors `reportIfFound<Kind>PrivateKey` and
    # both declare and call them by that name (Secretlint's recommended preset).
    # Such a match is the detector itself, not key material being sent out.
    not:
      - regex: '\b(report|send)IfFound\w*(PrivateKey|SecretKey)\w*'
      # Multisig and wallet SDKs expose send*WithoutSecretKey APIs that take a
      # signature instead of a key; the method name still contains SecretKey.
      - regex: '\b(report|send)\w*(Without|No)(Private|Secret)Key\w*\s*\('
  - id: report-send-seed-mnemonic-call
    desc: Send seed or mnemonic call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*(Seed|Mnemonic)\w*\s*\('
  - id: report-send-recovery-phrase-call
    desc: Send recovery phrase call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*RecoveryPhrase\w*\s*\('
  - id: upload-exfil-private-secret-key-call
    desc: Upload private or secret key call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*(PrivateKey|SecretKey)\w*\s*\('
    # Encrypted wallet backup APIs move ciphertext to the service; they do not
    # expose or steal a plaintext key.  Keep this atom for plaintext/stolen
    # key names while excluding the explicit encrypted-backup naming pattern.
    not:
      - regex: '\b(upload|exfil)\w*Encrypted\w*(PrivateKey|SecretKey)\w*\s*\('
  - id: upload-exfil-seed-mnemonic-call
    desc: Upload seed or mnemonic call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*(Seed|Mnemonic)\w*\s*\('
  - id: upload-exfil-recovery-phrase-call
    desc: Upload recovery phrase call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*RecoveryPhrase\w*\s*\('
  # SDK backdoors (Injective 1.20.21-style) disguise mnemonic/hex key theft as
  # "telemetry" via calls to trackKeyDerivation rather than report/send*.
  - id: track-key-derivation-call
    desc: Calls key-derivation telemetry hook
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: trackKeyDerivation
  # The compromised Injective SDK uses stable method markers for the two
  # sensitive inputs. Keep these as separate, argument-aware observations so
  # a future telemetry hook cannot evade the credential-theft composite merely
  # by changing its function name.
  - id: track-mnemonic-derivation-call
    desc: Telemetry hook receives mnemonic marker
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: trackKeyDerivation
      arg:
        kind: string
        exact: fm
  - id: track-hex-key-derivation-call
    desc: Telemetry hook receives hex-key marker
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: trackKeyDerivation
      arg:
        kind: string
        exact: fh
composite_rules:
  - id: obfuscated-wallet-api-relay
    desc: Obfuscated wallet API relays caller input over Axios
    crit: hostile
    conf: 0.98
    attack: T1027,T1552.001,T1071.001,T1041
    mbc: B0024
    all:
      - id: micro-behaviors/data/source/function/names::js-wallet-account-api-function
      - id: micro-behaviors/communications/http/request/computed-url::axios-computed-url-call
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/

  - id: key-material-reporting-call
    desc: Wallet-secret reporting method call
    crit: suspicious
    conf: 0.94
    any:
      - id: report-send-private-secret-key-call
      - id: report-send-seed-mnemonic-call
      - id: report-send-recovery-phrase-call
      - id: upload-exfil-private-secret-key-call
      - id: upload-exfil-seed-mnemonic-call
      - id: upload-exfil-recovery-phrase-call
      - id: track-key-derivation-call
      - id: track-mnemonic-derivation-call
      - id: track-hex-key-derivation-call
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/lang/source::js-test-or-spec-basename
      - id: metadata/package/testing/presence/harness::test-spec-path-benign-context

  # Interpretation twin of the exfiltration wallet-seed-header finding: the
  # same factory-plus-header-send evidence read as supply-chain credential
  # theft -- a published library harvesting its users' wallet seeds. Same
  # legs, second hierarchy; the exfiltration finding states the transport,
  # this one states whose credentials and who ships the collector.
  - id: library-wallet-seed-header-theft
    desc: Published library steals wallet seeds via headers
    crit: hostile
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-factory-entrypoint
      - id: objectives/exfiltration/sensitive-data::fetch-header-seed-value
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
