defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  - id: report-send-private-secret-key-call
    desc: Send private or secret key call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*(PrivateKey|SecretKey)\w*\s*\('
  - id: report-send-seed-mnemonic-call
    desc: Send seed or mnemonic call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*(Seed|Mnemonic)\w*\s*\('
  - id: report-send-recovery-phrase-call
    desc: Send recovery phrase call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*RecoveryPhrase\w*\s*\('
  - id: upload-exfil-private-secret-key-call
    desc: Upload private or secret key call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*(PrivateKey|SecretKey)\w*\s*\('
  - id: upload-exfil-seed-mnemonic-call
    desc: Upload seed or mnemonic call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*(Seed|Mnemonic)\w*\s*\('
  - id: upload-exfil-recovery-phrase-call
    desc: Upload recovery phrase call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*RecoveryPhrase\w*\s*\('
composite_rules:
  - id: key-material-reporting-call
    desc: Wallet-secret reporting method call
    crit: suspicious
    conf: 0.94
    any:
      - id: report-send-private-secret-key-call
      - id: report-send-seed-mnemonic-call
      - id: report-send-recovery-phrase-call
      - id: upload-exfil-private-secret-key-call
      - id: upload-exfil-seed-mnemonic-call
      - id: upload-exfil-recovery-phrase-call
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/lang/source::js-test-or-spec-basename
      - id: metadata/package/testing/presence/harness::test-spec-path-benign-context
