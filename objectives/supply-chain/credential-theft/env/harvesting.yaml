  - id: objectives/credential-access/env/secrets/npm-registry::node-npm-token
  # === Python Env Harvesting ===
- id: python-env-harvest
    # ============================================================
    # HOSTILE COMPOSITES - Harvesting + Exfiltration
    # ============================================================

  desc: Python harvests and sends env vars
  crit: hostile
  conf: 0.95
  mbc: "E1552"
  for: [python]
  any:
  - id: micro-behaviors/os/env/vars/access::python-environ-dict
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/os/env/vars/access::python-environ-iteration
  all:
  - id: py-env-to-post

# A package can serialize or encrypt a filtered subset rather than posting
# os.environ directly. Iterating the environment and selecting credential
# markers is the observable harvesting behavior; the transport is handled by
# separate exfiltration objectives.
- id: python-bulk-secret-env-harvest
  desc: Python iterates env entries for secret names
  # Secret managers and sandbox APIs legitimately select a caller-supplied
  # namespace from os.environ. Without a transport or install-time execution
  # boundary this is notable collection capability, not proven theft.
  crit: notable
  conf: 0.9
  mbc: E1552
  for: [python]
  all:
  - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
  - id: micro-behaviors/os/env/vars/credentials::python-environ-items-credential-filter
  unless:
  # Test suites commonly iterate over os.environ to remove a fixture token
  # before constructing a client. That is not package-time credential theft.
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/app/ai/knowledge/animica::package-context
  - id: well-known/app/ai/gateway/sitellm::sitellm-aws-kms-env-provider

# A custom build command that materializes every environment entry crosses the
# package-install boundary and captures credentials even without a network
# transport. The separate staging objective adds temporary-path intent.
- id: pypi-build-hook-environment-file-harvest
  desc: PyPI build hook writes complete environment
  crit: hostile
  conf: 0.99
  attack: "T1195.002,T1552.001"
  mbc: E1552
  for: [python]
  all:
  # Use the two atomic legs of root-setup-py so this objective is independent
  # of cross-file composite evaluation order.
  - id: metadata/build/pip::root-setup-py-path
  - id: metadata/build/pip::packaging-setup-api-import
  - id: metadata/build/package/recipe::setup-cmdclass-build-py
  - id: metadata/build/package/recipe::setuptools-build-py-run-override
  - id: metadata/build/package/recipe::run-override-calls-helper-after-super
  - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
  - id: micro-behaviors/data/serialize/object::python-environ-items-text-join
  - id: micro-behaviors/fs/write/file/direct::python-pathlib-write-text

# The article's package was executed by a consumer during installation. Keep
# this package-context inference separate from the generic env/HTTP stealer so
# the same chain is also recognized when the code is imported outside setup.py.
- id: pypi-setup-environment-exfil
  desc: PyPI setup.py exfiltrates filtered environment credentials
  crit: hostile
  conf: 0.98
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1041
  for: [python]
  scope: leaf
  all:
  - id: metadata/build/pip::setup-py
  - id: objectives/exfiltration/stealer/credential/env::python-environ-json-urllib-exfil

- id: python-setup-environment-requests-exfil
  desc: Python setup.py exfiltrates filtered environment credentials via requests
  crit: hostile
  conf: 0.98
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1041
  for: [python]
