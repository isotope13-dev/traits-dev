defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1552.001
traits:
- id: npm-postinstall-env-iteration
  desc: npm postinstall iterates process.env
  crit: suspicious
  conf: 0.98
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: Object\.(entries|keys)\s*\(\s*process\.env\s*\)
- id: npm-postinstall-env-filter-predicate
  desc: npm hook contains environment filter predicate
  crit: notable
  conf: 0.94
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\.filter\s*\([^)]{0,100}/
- id: npm-postinstall-owner-fields
  desc: npm hook references owner identity fields
  crit: component
  conf: 0.94
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\b(owner|maintainer|author)\b
- id: npm-postinstall-team-fields
  desc: npm hook references team identity fields
  crit: component
  conf: 0.94
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\b(team|user|contact|build|project)\b
- id: npm-postinstall-regex-test
  desc: npm hook applies a regex test predicate
  crit: notable
  conf: 0.94
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)/[a-z]*\.test\s*\(
- id: npm-postinstall-jwt-pattern
  desc: npm hook matches a JWT pattern
  crit: suspicious
  conf: 0.98
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    substr: ey[a-zA-Z0-9_-]{10,}
- id: py-mongo-uri-env-name
  desc: Python MongoDB URI env var
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    exact: MONGO_URI
- id: py-harvest-npm-token
  desc: Python harvests NPM_TOKEN env var
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (getenv|environ).{0,30}NPM_TOKEN
  unless:
  - id: metadata/package/documentation/security-testing::python-rule-exploit-example
  - id: metadata/package/testing/presence/harness::test-directory
  - id: micro-behaviors/os/package-manager/publish/
- id: py-harvest-pypi-token
  desc: Python reads PYPI_TOKEN env var
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (getenv\(|environ\[|environ\.get\()\s*['"]PYPI_TOKEN
  unless:
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
- id: py-harvest-twine-password
  desc: Python reads TWINE_PASSWORD env var
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])(getenv\(|environ\[|environ\.get\()\s*['"]TWINE_PASSWORD
  unless:
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
composite_rules:
- id: npm-postinstall-env-identity-filter
  desc: npm hook filters developer identity fields
  crit: suspicious
  conf: 0.97
  attack: T1552.001,T1087
  for:
  - package.json
  near_bytes: 640
  all:
  - id: npm-postinstall-env-filter-predicate
  - id: npm-postinstall-owner-fields
  - id: npm-postinstall-team-fields
  - id: npm-postinstall-regex-test
- id: npm-postinstall-jwt-env-harvest
  desc: npm hook extracts JWT-like env secrets
  crit: hostile
  conf: 0.99
  for:
  - package.json
  all:
  - id: npm-postinstall-env-iteration
  - id: npm-postinstall-jwt-pattern
- id: npm-postinstall-filtered-identity-env-exfil
  desc: npm hook exfiltrates filtered developer environment fields
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - package.json
  all:
  - id: npm-postinstall-env-iteration
  - id: npm-postinstall-env-identity-filter
  - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
  - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post
- id: py-harvest-mongo-uri
  desc: Python harvests MongoDB URI env var
  crit: suspicious
  conf: 0.9
  for:
  - python
  near_lines: 1
  all:
  - id: py-mongo-uri-env-name
  any:
  - id: micro-behaviors/os/env/read::python-os-getenv-call
  - id: micro-behaviors/os/env/read::os-environ-symbol
- id: pypi-setup-credential-env-harvest
