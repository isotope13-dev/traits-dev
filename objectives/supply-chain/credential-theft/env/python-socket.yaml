# A Python distribution that performs credential-filtered environment
# collection and raw-socket exfiltration from package code. The transport flow
# is established in objectives/exfiltration; this archive/package layer records
# the supply-chain delivery context.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002,T1552.001,T1041
  mbc: E1552,E1041

composite_rules:
  - id: python-import-time-filtered-env-socket-exfil
    desc: Package init exfiltrates secrets by socket
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: objectives/exfiltration/stealer/credential/env::python-filtered-env-raw-socket-exfil
