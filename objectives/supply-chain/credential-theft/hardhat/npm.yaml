defaults:
  for: [javascript, typescript]
  platforms: [windows, linux, macos]
  attack: T1195.002

composite_rules:
  - id: hardhat-config-stealer-heuristics
    desc: Hardhat runtime env credential theft
    crit: hostile
    conf: 0.95
    # Minified builds rename networksFilter; hreConfig/hreInit are exports
    # and survive. Pair them with AES wrapping or the HTTP exfil POST.
    all:
      - id: micro-behaviors/data/embedded/hardhat::hardhat-config-hreConfig
      - id: micro-behaviors/data/embedded/hardhat::hardhat-config-hreInit
    any:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc-dash
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/data/embedded/hardhat::hardhat-mnemonic-password-field

  - id: hardhat-wallet-credential-harvest
    desc: Hardhat plugin harvests and encrypts wallet credentials for exfiltration
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/env/secrets/wallet::env-wallet-regex-secret-filter
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createCipheriv
    any:
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-client-usage
