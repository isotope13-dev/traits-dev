# RubyGems Supply Chain Credential Theft
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# Detects malicious patterns in gemspec and Ruby packages
# Covers rest-client hijacking style attacks
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: suspicious
  attack: "T1195.002"
traits:
  # ============================================================
  # GEMSPEC TROJANS
  # ============================================================
  - id: gemspec-post-install
    desc: Gemspec with post_install_message abuse
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: 'post_install_message.{0,50}(http|eval|system)'
  # ============================================================
  # CREDENTIAL ACCESS
  # ============================================================
  # The neutral gem credential path lives under micro-behaviors/fs/path;
  # the API-key variable remains in package-manager.yaml.
  - id: bundler-config-read
    desc: Reads bundler config
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^File\.(read|open)$'
      arg:
        kind: string
        substr: .bundle/config
  - id: rubygems-api-domain
    desc: References api.rubygems.org domain
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'api.rubygems.org'
composite_rules:
  # === RubyGems Credential Theft ===
  - id: rubygems-credential-theft
    desc: RubyGems credential theft
    crit: hostile
    conf: 0.95
    attack: "T1552.001"
    any:
      - id: micro-behaviors/fs/path/secret-config::gem-credentials-file
      - id: objectives/supply-chain/credential-theft/registry::gem-host-api-key-var
      - id: rubygems-api-domain
      - id: objectives/supply-chain/credential-theft/registry::rubygems-api-key-var
    all:
      - id: micro-behaviors/communications/http/request/netlib::net-http-write-request
  # === Gemspec Trojan ===
  - id: gemspec-trojan
    desc: Trojanized gemspec
    crit: hostile
    conf: 0.9
    any:
      - id: metadata/package/files/rubygems::gemspec-native-extension-declaration
      - id: extconf-system-call
      - id: micro-behaviors/communications/http/request/netlib::open-uri-http-fetch
    all:
      - id: micro-behaviors/communications/http/request/netlib::net-http-write-request
  - id: extconf-system-call
    desc: extconf.rb with system call
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: micro-behaviors/process/create/shell/lang::ruby-system-shell-command
  # Formula downloads, environment references and lifecycle commands are
  # neutral observations in their canonical metadata/micro-behavior paths.
  # Public hosting plus an install command does not establish an attack or
  # registry credential theft; require behavior-specific objectives instead.
  # === Ruby Supply Chain Attack ===
  - id: ruby-supply-chain-attack
    desc: Ruby supply chain attack
    crit: suspicious
    conf: 0.95
    mbc: "E1552"
    any:
      - id: rubygems-credential-theft
      - id: gemspec-trojan
