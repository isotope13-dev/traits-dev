defaults:
  platforms: [windows, unix]
  # RubyGems credentials and API paths retain the same syntax when embedded in
  # Ruby, shell, or another script language. Language-specific builders below
  # narrow themselves back to JavaScript.
  for: [scripts]
  attack: T1195.002
traits:
  - id: rubygems-push-api-path
    desc: RubyGems push API path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /api/v1/gems
  - id: hardcoded-rubygems-token
    desc: Hardcoded RubyGems API token
    crit: suspicious
    conf: 0.98
    attack: T1552.001
    if:
      type: text
      regex: 'rubygems_[A-Za-z0-9]{32,}'
  - id: js-octet-stream-upload
    desc: JavaScript uploads octet-stream body
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Content-Type.{0,40}application/octet-stream'
composite_rules:
  - id: js-gem-archive-builder
    desc: JavaScript builds RubyGems archive
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: metadata/package/ecosystem::rubygems-specification-class
      - id: metadata/package/ecosystem::rubygems-metadata-member-name
      - id: metadata/package/ecosystem::rubygems-data-member-name
  - id: rubygems-token-publish-upload
    desc: RubyGems publish API upload with hardcoded token
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: "T1195.002, T1552.001"
    mbc: E1552
    all:
      - id: hardcoded-rubygems-token
      - id: rubygems-push-api-path
      - id: js-octet-stream-upload
    any:
      - id: js-gem-archive-builder
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
