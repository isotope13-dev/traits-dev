defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
  attack: T1552.001
traits:
- id: pypirc-read
  desc: Reads .pypirc file
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: open\s*\(.{0,50}\.pypirc
- id: cargo-registry-token-dot-access
  desc: Cargo token dot environment access
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: process\s*\.\s*env\s*\.\s*CARGO_(REGISTRY_TOKEN|REGISTRIES_[A-Z0-9_]+_TOKEN)\b
- id: cargo-registry-token-bracket-access
  desc: Cargo token bracket environment access
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: process\s*\.\s*env\s*\[\s*["']CARGO_(REGISTRY_TOKEN|REGISTRIES_[A-Z0-9_]+_TOKEN)["']\s*\]
- id: rubygems-api-key-var
  desc: RubyGems API key variable
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    word: rubygems_api_key
- id: gem-host-api-key-var
  desc: GEM_HOST_API_KEY variable
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    word: GEM_HOST_API_KEY
- id: gradle-properties
  desc: Gradle properties proxy password
  crit: notable
  conf: 0.8
  unless:
  - id: metadata/build
  if:
    type: string_literal
    regex: systemProp\.(http|https)\.proxyPassword
- id: gitlab-api-client-gl-got-require
  desc: GitLab gl-got client require
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: require\(['"]gl-got['"]\)
- id: gitlab-api-client-wrapper-require
  desc: GitLab gl-got wrapper require
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: require\(['"]\.\/gl-got-wrapper['"]\)
- id: gitlab-api-client-glgot-call
  desc: GitLab glGot call marker
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: symbol
    exact: glGot
- id: gitlab-api-client-init-platform
  desc: GitLab initPlatform call marker
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: symbol
    exact: initPlatform
- id: gitlab-api-client-set-base-url
  desc: GitLab client sets its API base URL
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)(glGot|gl-got|gitlab)[^;\n]{0,160}setBaseUrl
- id: jetbrains-secrets
  desc: JetBrains credential token or secret reference
  crit: notable
  conf: 0.75
  if:
    type: string_literal
    regex: \\bjetbrains\\b.{0,20}\\b(token|password|secret)\\b
    case_insensitive: true
  downgrade:
    any:
    - id: metadata/build/pip/
- id: py-pathlib-pypirc
  desc: Python pathlib reads pypirc
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.pypirc.{0,40}\)\.read_
- id: py-pathlib-netrc
  desc: Python pathlib reads netrc
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.netrc.{0,40}\)\.read_
- id: py-pathlib-aws-creds
  desc: Python pathlib reads AWS credentials
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.aws/credentials.{0,40}\)\.read_
- id: py-pathlib-ssh-private-key
  desc: Python pathlib reads SSH private key
  crit: notable
  conf: 0.85
  unless:
  - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.ssh/id_[a-z0-9_]{2,16}.{0,40}\)\.read_
- id: project-snapshot-npmrc-text-branch
  desc: Project snapshot keeps npmrc as text
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: endsWith\("\.npmrc"\)[\s\S]{0,160}toString\("base64"\)
- id: js-env-home-cred-cargo
  desc: Cargo credentials path marker
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (^|[/\\~'"\s])[/\\]cargo[/\\]credentials\b
- id: js-env-home-cred-gem
  desc: Gem credentials path marker
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (^|[/\\~'"\s])[/\\]gem[/\\]credentials\b
- id: shell-cat-npmrc
  desc: Shell reads .npmrc file
  crit: suspicious
  conf: 0.9
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/tracebit::community-action-step
    - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  for:
  - shell
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/development/aube::aube-package-test-fixture
  - id: metadata/path::test-directory-component
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}[\/~$][^<\n]{0,30}\.npmrc
  not:
  - substr: cat << EOF > "$HOME/.npmrc"
  - regex: cat\s+<<\s*EOF\s*>\s*"\$HOME/\.npmrc"
  - regex: cat\s*<<\s*\w+\s*>\s*"\$HOME/\.npmrc"
  - regex: \.npmrc\.bak\b
- id: shell-cat-pypirc
  desc: Shell reads .pypirc file
  crit: suspicious
  conf: 0.9
  for:
  - shell
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: metadata/path::test-directory-component
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}\.pypirc
- id: shell-cat-netrc
  desc: Shell reads .netrc file
  crit: notable
  conf: 0.9
  for:
  - shell
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}\.netrc
- id: shell-cat-git-credentials
  desc: Shell reads .git-credentials file
  crit: suspicious
  conf: 0.9
  for:
  - shell
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/tool-guard-core::defensive-attack-corpus-context
  - id: well-known/tool/detection/tool-guard-core::postgres-attack-fixture
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: metadata/path::test-directory-component
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}\.git-credentials
- id: js-npmrc-to-http
  desc: npmrc reference near an HTTP request
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  unless:
  - id: well-known/tool/development/aube::aube-package-test-fixture
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
  if:
    type: text
    regex: \.npmrc[\s\S]{0,300}http\.request
- id: js-netrc-to-axios
  desc: JS sends .netrc via axios
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \.netrc[\s\S]{0,300}axios
- id: js-netrc-to-http
  desc: JS sends .netrc via http.request
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \.netrc[\s\S]{0,300}http\.request
- id: pypirc-base64-encode
  desc: .pypirc base64 encoded
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: tree-sitter
    kind: call
    regex: (?s)base64.{0,320}\.pypirc|\.pypirc.{0,320}base64
composite_rules:
- id: postinstall-npmrc-http-exfil
  desc: Package postinstall exfiltrates npm credentials
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1552.001,T1041
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/serialization::js-npmrc-http-post
- id: cargo-registry-token
  desc: Cargo token environment access
  crit: notable
  conf: 0.85
  any:
  - id: cargo-registry-token-dot-access
  - id: cargo-registry-token-bracket-access
- id: gitlab-api-client-token-marker
  desc: GitLab API client token marker
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  any:
  - id: gitlab-api-client-gl-got-require
  - id: gitlab-api-client-wrapper-require
  - id: gitlab-api-client-glgot-call
- id: py-pathlib-cred
  desc: Python pathlib credential file
  crit: suspicious
  conf: 0.85
  for:
  - python
  any:
  - id: py-pathlib-pypirc
  - id: py-pathlib-netrc
  - id: py-pathlib-aws-creds
  - id: py-pathlib-ssh-private-key
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  - id: metadata/path::test-directory-component
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
- id: shell-cat-cred
  desc: Shell reads credential file
  crit: suspicious
  conf: 0.9
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/tracebit::community-action-step
    - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  any:
  - id: shell-cat-npmrc
  - id: shell-cat-pypirc
  - id: shell-cat-netrc
  - id: shell-cat-git-credentials
  unless:
  - id: metadata/package/testing/
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/build/recognized-contexts::credential-helper-script
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: metadata/path::test-directory-component
- id: creds-base64-encode
  desc: Credentials base64 encoded
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/credential::credentials-path-tail
  any:
  - id: micro-behaviors/data/encode/base64::base64-encoding
  - id: micro-behaviors/data/encode/base64::btoa-symbol
  near_bytes: 300
  unless:
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: metadata/package/testing/
  - id: well-known/lib/runtime/scripted/node-runtime::bundled-npm-source
  - id: metadata/path::test-directory-component
  downgrade:
    any:
    - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
    - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-imds-provider
    - id: well-known/lib/cloud/aws-sdk-js::v3-http-credential-provider-impl
    - id: well-known/lib/cloud/aws-sdk-js::v3-runtime-context-marker
    - id: well-known/lib/cloud/aws-sdk-js::v3-credential-provider-debug-prefix
- id: npmrc-base64-encode
  desc: Reads NPM config near Base64 encoding
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  any:
  - id: micro-behaviors/data/encode/base64::base64-encoding
  - id: micro-behaviors/data/encode/base64::btoa-symbol
  near_bytes: 300
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/development/lint/dprint::dprint-cli
  - id: project-snapshot-npmrc-text-branch
  - id: metadata/path::test-directory-component
- id: cred-base64-encode
  desc: Credentials base64 encoded before send
  crit: suspicious
  conf: 0.85
  any:
  - id: creds-base64-encode
  - id: npmrc-base64-encode
  - id: pypirc-base64-encode
  unless:
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
- id: pypi-credential-theft
  desc: PyPI credential theft
  crit: hostile
  conf: 0.95
  mbc: E1552
  all:
  - id: pypirc-read
  - id: micro-behaviors/communications/http/request/credentials::python-credential-file-near-http-upload
- id: npm-script-npmrc-token-theft
  desc: npm script exfiltrates .npmrc
  crit: hostile
  conf: 0.97
  for:
  - package.json
  mbc: E1552
  attack: T1195.002,T1552.001,T1041
  all:
  - id: objectives/supply-chain/install-hook/scripts/credential::script-credential-dotfile
  - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
- id: cargo-credential-theft
  desc: Cargo credential theft
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/credentials::cargo-credential-http-body-flow
  unless:
  - id: micro-behaviors/data/control-flow/branch::literal-false-credential-http-context
  - id: well-known/tool/development/toolchain/deno::source-archive-context
- id: gem-credential-theft-comp
  desc: RubyGems credential access
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/secret-config::gem-credentials-file
  any:
  - id: rubygems-api-key-var
  - id: gem-host-api-key-var
  unless:
  - id: metadata/build/ci/github-actions::workflow-definition-path
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: ci-credential-theft
  desc: CI/CD credential theft
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/ci-credentials
  any:
  - id: micro-behaviors/communications/http/request/body::python-environment-http-body-flow
  - id: micro-behaviors/communications/http/request/credentials::javascript-secret-http-content-candidate
  - id: micro-behaviors/communications/http/request/credentials::shell-filtered-env-stdin-http-upload
  unless:
  - id: well-known/tool/development/vcs/gitlab::gitlab-release-client-context
  - id: github-api-client-context
  - id: github-release-client-context
  - id: actions-oidc-mint-fetch-context
  - id: actions-oidc-mint-client-context
  - id: metadata/build/ci/github-actions::action-output-env-file
- id: github-api-client-context
  desc: Recognized GitHub API client authentication context
  crit: exception
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - shell
  all:
  - id: micro-behaviors/communications/http/services/github::github-api-host
  any:
  - id: micro-behaviors/os/env/vcs::node-github-token-member
  - id: micro-behaviors/os/env/vcs::node-gh-token-member
  - id: micro-behaviors/os/env/vcs::python-github-token-env-read
  - id: micro-behaviors/os/env/vcs::python-gh-token-env-read
  - id: micro-behaviors/os/env/vcs::shell-github-token-reference
- id: github-release-client-context
  desc: Recognized GitHub release client authentication context
  crit: exception
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - shell
  all:
  - id: micro-behaviors/communications/url/external/github::github-release-latest-web-url
  any:
  - id: micro-behaviors/os/env/vcs::node-github-token-member
  - id: micro-behaviors/os/env/vcs::node-gh-token-member
  - id: micro-behaviors/os/env/vcs::python-github-token-env-read
  - id: micro-behaviors/os/env/vcs::python-gh-token-env-read
  - id: micro-behaviors/os/env/vcs::shell-github-token-reference
- id: actions-oidc-mint-fetch-context
  desc: Sanctioned Actions OIDC token-minting fetch
  crit: exception
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - shell
  all:
  - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
  - id: micro-behaviors/os/env/ci-credentials::actions-oidc-request-url-fetch
- id: actions-oidc-mint-client-context
  desc: Sanctioned Actions OIDC token-minting client call
  crit: exception
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - shell
  all:
  - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
  any:
  - id: micro-behaviors/os/env/ci-credentials::actions-oidc-request-url-client-call
  - id: micro-behaviors/os/env/ci-credentials::actions-oidc-client-user-agent
- id: supply-chain-credential-theft
  desc: Supply chain credential theft attack
  crit: suspicious
  conf: 0.98
  mbc: E1552
  any:
  - id: pypi-credential-theft
  - id: cargo-credential-theft
  - id: gem-credential-theft-comp
  - id: ci-credential-theft
- id: js-creds-to-axios
  desc: JS credential path with axios
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/tool/detection/
  - id: metadata/lang/source/syntax/call/invocation::js-credential-path-guard
  all:
  - id: micro-behaviors/fs/path/credential::package-manager-credential-path
  - id: micro-behaviors/communications/http/lib/axios::request-axios
  any:
  - id: metadata/import/builtin::require-fs
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: micro-behaviors/fs/read/file/full::read-text-utf8
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
