defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1552.001
  mbc: E1552
traits: []
composite_rules:
  - id: github-oidc-npm-publish
    desc: Uses OIDC to publish npm package
    crit: suspicious
    conf: 0.98
    near_bytes: 1600
    all:
    - id: micro-behaviors/communications/http/services/registry::npm-oidc-exchange-endpoint
    - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
    - id: micro-behaviors/communications/http/services/registry::npm-registry-put-request
  - id: stolen-oidc-npm-publish
    desc: Credential harvest accompanies OIDC npm publish
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.001,T1041
    near_bytes: 4096
    all:
    - id: github-oidc-npm-publish
    - id: objectives/supply-chain/credential-theft/env::javascript-filtered-environment-exfil
