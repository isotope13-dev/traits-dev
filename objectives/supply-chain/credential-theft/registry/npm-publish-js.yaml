defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1552.001
traits:
  - id: npm-oidc-exchange-endpoint
    desc: npm OIDC exchange endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/
  - id: oidc-identity-token-publickey-request
    desc: OIDC identity token and publicKeyRequest payload
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '''oidcIdentityToken''\s*:[\s\S]{1,120}''publicKeyRequest''\s*:'
  - id: workflow-and-repo-id-env-read
    desc: Reads WORKFLOW_ID and REPO_ID_SUFFIX env vars
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'process\.env\.WORKFLOW_ID.{0,80}process\.env\.REPO_ID_SUFFIX'
  # The bare ACTIONS_ID_TOKEN_REQUEST_* pair is a neutral CI env reference that
  # every actions-toolkit action carries; it lives in
  # micro-behaviors/os/env/cicd and is referenced below for context only.
  # The registry-PUT mechanics atom moved to
  # micro-behaviors/communications/http/services/registry -- release tooling
  # PUTs to the registry without any theft claim -- and the composite below
  # references it there.
composite_rules:
  - id: github-oidc-npm-publish
    desc: Uses OIDC to publish npm package
    crit: suspicious
    conf: 0.98
    mbc: E1552
    near_bytes: 1600
    all:
      - id: npm-oidc-exchange-endpoint
      - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
      - id: micro-behaviors/communications/http/services/registry::npm-registry-put-request
  - id: stolen-oidc-npm-publish
    desc: Credential harvest accompanies OIDC npm publish
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.001,T1041
    mbc: E1552
    near_bytes: 4096
    all:
      - id: github-oidc-npm-publish
      - id: objectives/supply-chain/credential-theft/env::javascript-filtered-environment-exfil
  - id: self-targeting-oidc-package-publisher
    desc: Exchanges Actions OIDC token in publisher
    crit: hostile
    conf: 0.98
    mbc: E1552
    all:
      - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
      - id: oidc-identity-token-publickey-request
      - id: workflow-and-repo-id-env-read
