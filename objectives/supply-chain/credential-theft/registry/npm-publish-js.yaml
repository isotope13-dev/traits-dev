defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1552.001
traits:
  - id: npm-oidc-exchange-endpoint
    desc: npm OIDC exchange endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/
  # The bare ACTIONS_ID_TOKEN_REQUEST_* pair is a neutral CI env reference that
  # every actions-toolkit action carries; it lives in
  # micro-behaviors/os/env/vars/cicd and is referenced below for context only.
  - id: npm-put-before-registry
    desc: PUT method near npm registry URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'method\s*:\s*["'']PUT["''][\s\S]{0,400}registry\.npmjs\.org'
  - id: npm-put-after-registry
    desc: npm registry URL near PUT method
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'registry\.npmjs\.org[\s\S]{0,400}method\s*:\s*["'']PUT["'']'
composite_rules:
  - id: npm-registry-put-request
    desc: npm registry PUT request
    crit: notable
    conf: 0.92
    any:
      - id: npm-put-before-registry
      - id: npm-put-after-registry
  - id: github-oidc-npm-publish
    desc: Uses OIDC to publish npm package
    crit: suspicious
    conf: 0.98
    mbc: E1552
    near_bytes: 1600
    all:
      - id: npm-oidc-exchange-endpoint
      - id: micro-behaviors/os/env/vars/cicd::github-actions-oidc-token-request-env
      - id: npm-registry-put-request
  - id: stolen-oidc-npm-publish
    desc: Credential harvest accompanies OIDC npm publish
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.001,T1041
    mbc: E1552
    near_bytes: 4096
    all:
      - id: github-oidc-npm-publish
      - id: objectives/supply-chain/credential-theft/env::javascript-filtered-environment-exfil
