# npm credential stealer dependency patterns
# Detects combinations of npm dependencies commonly used in browser credential stealers
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.8
  attack: T1195.002
traits:
  - id: npm-script-install-axios
    desc: npm script installs axios at runtime
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts
      regex: \bnpm\s+(i|install|add)\b.{0,80}\baxios\b
  - id: npm-script-install-request
    desc: npm script installs request at runtime
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts
      regex: \bnpm\s+(i|install|add)\b.{0,80}\brequest\b
  - id: npm-script-install-sqlite3
    desc: npm script installs sqlite3 at runtime
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: scripts
      regex: \bnpm\s+(i|install|add)\b.{0,80}\bsqlite3\b
  - id: npm-script-install-socket-io-client
    desc: npm script installs socket.io-client
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: scripts
      regex: \bnpm\s+(i|install|add)\b.{0,80}\bsocket\.io-client\b
composite_rules:
  - id: npm-sqlite-dep
    desc: npm package depends on SQLite library
    crit: component
    conf: 0.75
    any:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-better-sqlite3
      - id: metadata/package/dependencies/manifest/identity::npm-dep-sqlite3
  - id: npm-credential-stealer-deps
    desc: Credential stealer dependency combination
    crit: suspicious
    conf: 0.92
    attack: T1555.003
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-primno-dpapi
    any:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-better-sqlite3
      - id: metadata/package/dependencies/manifest/identity::npm-dep-sqlite3
      - id: metadata/package/dependencies/manifest/identity::node-machine-id-dep
      - id: metadata/package/dependencies/manifest/identity::npm-dep-socket-io-client
  - id: npm-runtime-installed-stealer-deps
    desc: Runtime npm install of stealer deps
    crit: suspicious
    conf: 0.95
    all:
      - id: npm-script-install-sqlite3
    any:
      - id: npm-script-install-axios
      - id: npm-script-install-request
      - id: npm-script-install-socket-io-client
  - id: npm-postinstall-runtime-stealer-toolkit
    desc: Postinstall fetches stealer dependency toolkit
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
      - id: npm-runtime-installed-stealer-deps
      - id: metadata/package/files/package-json::has-src-directory
  - id: npm-browser-stealer-toolkit
    desc: Full browser credential stealer toolkit
    crit: hostile
    conf: 0.95
    attack: T1555.003
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-primno-dpapi
      - id: npm-sqlite-dep
      - id: metadata/package/dependencies/manifest/identity::node-machine-id-dep
  # DPAPI master-key decryption + SQLite (Chromium Login Data/Cookies) +
  # LevelDB (Discord/Chromium Local Storage tokens) is the harvest core of
  # Electron-packaged Windows stealers; screenshot capture, Steam VDF config
  # parsing or asar repacking (Discord client injection) completes it.
  - id: npm-dpapi-leveldb-stealer-toolkit
    desc: DPAPI, SQLite and LevelDB stealer toolkit
    crit: hostile
    conf: 0.93
    attack: T1555.003
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-primno-dpapi
      - id: npm-sqlite-dep
      - id: metadata/package/dependencies/manifest/identity::npm-dep-level
    any:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-screenshot-desktop
      - id: metadata/package/dependencies/manifest/identity::npm-dep-vdf-parser
      - id: metadata/package/dependencies/manifest/identity::npm-dep-asar
  # Same harvest without @primno/dpapi. seco-file reads Exodus seed.seco;
  # seed-passworder decrypts a MetaMask-style vault. Either one next to an
  # asar unpacker, a browser SQLite binding, and a multipart uploader is the
  # unpack-apps / read-Login-Data / ship-the-loot toolkit (Cipher and the
  # Nova-style builders). A wallet may depend on one decryptor; it does not
  # also unpack foreign asar archives and upload browser SQLite.
  - id: npm-wallet-asar-sqlite-upload-toolkit
    desc: Wallet decryptor with asar, SQLite, and upload deps
    crit: hostile
    conf: 0.94
    attack: T1555.003,T1555.005,T1567
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-asar
      - id: npm-sqlite-dep
      - id: metadata/package/dependencies/declaration::npm-form-data-dependency
    any:
      - id: metadata/package/dependencies/declaration::npm-dep-seco-file
      - id: metadata/package/dependencies/declaration::npm-dep-seed-passworder
