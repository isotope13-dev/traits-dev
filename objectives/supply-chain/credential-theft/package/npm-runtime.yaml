# NPM install-hook credential theft.
#
# The file-level stealer rule identifies the collection and HTTP body. This
# archive-level rule adds the supply-chain execution boundary, including both
# lifecycle names used by npm. It deliberately does not depend on a package
# name, endpoint, or dependency list.
defaults:
  platforms: [unix, windows]
  for: [archives]
  attack: "T1195.002,T1552.001,T1552.004,T1041"
  mbc: E1552,E1041

composite_rules:
  - id: republished-credential-provider-executes-hook
    desc: Republished credential provider runs intercepted command
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1195.002,T1059.007,T1552.001
    all:
      - id: metadata/package/manifest/publishing::depup-original-aws-credential-provider
      - id: metadata/package/manifest/publishing::depup-renamed-package
      - id: micro-behaviors/process/create/shell/bridge::node-credential-process-exec
      - id: micro-behaviors/process/create/shell/bridge::node-credential-token-exec-interceptor
  # The narrower rule below covers the SSH-plus-environment variant.  Keep a
  # separate environment-only rule for packages that collect credentials from
  # the consumer's CI/developer environment and use a different Node HTTP
  # implementation.  The file-scoped exfiltration composite supplies the
  # complete collection-to-network path; the lifecycle leg adds the package
  # trust-boundary context.
  - id: npm-install-hook-environment-credential-exfil
    desc: NPM install hook exfiltrates environment credentials
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1552.001,T1041"
    all:
      - id: objectives/exfiltration/stealer/credential/env::javascript-environ-json-http-exfil
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall

  # Source-only stealers need their own rule. Do not route them through the
  # native-loader family: a JavaScript package can collect several application
  # credential stores without shipping any compiled member.
  - id: npm-install-hook-multi-app-credential-stealer
    desc: NPM install hook runs a multi-application credential stealer
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts::install-hooks
      - id: objectives/credential-access/theft/multi-app::multi-app-credential-stealer

  - id: npm-install-hook-ssh-env-credential-exfil
    desc: NPM install hook exfiltrates SSH and environment credentials
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/credential/http::node-ssh-env-json-http-exfil
    any:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script

  - id: npm-install-hook-credential-env-exfil
    desc: NPM install hook exfiltrates filtered environment credentials
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1552.001,T1041"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/credential-access/env/secrets/filtered-access::js-secret-keyword-list
      - id: micro-behaviors/communications/http/request/client::node-http-request-body
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/data/serialize/json::json-stringify-call

  # A package install hook that reads several developer/CI credential stores
  # and writes the result to a GitHub repository is the repository-backed
  # exfiltration shape described by the Mini Shai-Hulud article.  Keep the
  # credential-store legs generic so this remains useful when the targeted
  # npm/PyPI/cloud files or package names change.
  - id: npm-install-hook-github-credential-exfil
    desc: NPM install hook uploads multiple credential stores to GitHub
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1552.001,T1041"
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: micro-behaviors/fs/file/read::read-node
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::npmrc-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::cloud-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::orchestration-credentials
    needs: 2
    near_bytes: 8192
