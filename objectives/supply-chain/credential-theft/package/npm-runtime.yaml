# NPM install-hook credential theft.
#
# Archive membership alone does not connect a lifecycle script to a payload.
# Environment exfiltration is reported by the canonical file-level traits in
# objectives/exfiltration/stealer/credential/env, without duplicate hook wrappers.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, linux]
  for: [npm]
  attack: "T1195.002,T1552.001,T1552.004,T1041"
  mbc: E1552,E1041

composite_rules:
  # The carrier archive holds the credential stealer while a lone, scoped,
  # commit-pinned optional dependency supplies the install-time trigger. The
  # dependency may fail and disappear after execution, so neither its alias nor
  # repository is stable enough to anchor detection.
  - id: npm-optional-vcs-trigger-credential-stealer
    desc: NPM optional VCS trigger accompanies a credential stealer
    scope: archive
    # Names the members it mixes: the trigger leg comes from the package
    # manifest, the stealer leg from a script or source member.
    for: [npm, package.json, scripts, source]
    all:
      - id: objectives/supply-chain/hidden-payload/git-deaddrop::npm-optional-scoped-commit-vcs
      - id: objectives/exfiltration/stealer/credential/dev-file::simple-developer-secret-stealer

  - id: republished-credential-provider-executes-hook
    desc: Republished credential provider runs intercepted command
    scope: archive
    attack: T1195.002,T1059.007,T1552.001
    for: [npm, package.json, javascript]
    all:
      - id: metadata/package/publishing::depup-original-aws-credential-provider
      - id: metadata/package/publishing::depup-renamed-package
      - id: micro-behaviors/process/create/shell/bridge::node-credential-process-exec
      - id: micro-behaviors/process/create/shell/bridge::node-credential-token-exec-interceptor
  # Source-only stealers need their own rule. Do not route them through the
  # native-loader family: a JavaScript package can collect several application
  # credential stores without shipping any compiled member.
  - id: npm-install-hook-multi-app-credential-stealer
    desc: NPM install hook runs a multi-application credential stealer
    scope: archive
    platforms: [windows, linux, android]
    for: [binaries, source, manifests, documents, media, data, scripts, '!jcl', npm]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: objectives/credential-access/theft/multi-app::multi-app-credential-stealer

  - id: npm-install-hook-ssh-env-credential-exfil
    desc: NPM install hook exfiltrates SSH and environment credentials
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: objectives/exfiltration/stealer/credential/http::node-ssh-env-json-http-exfil
    any:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script

  # A package install hook that reads several developer/CI credential stores
  # and writes the result to a GitHub repository is the repository-backed
  # exfiltration shape described by the Mini Shai-Hulud article.  Keep the
  # credential-store legs generic so this remains useful when the targeted
  # npm/PyPI/cloud files or package names change.
  - id: npm-install-hook-github-credential-exfil
    desc: NPM install hook uploads multiple credential stores to GitHub
    scope: archive
    attack: "T1195.002,T1552.001,T1041"
    for: [binaries, '!dex', scripts, '!jcl', c, go, java, kotlin, npm, package.json, rust]
    all:
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
      - id: micro-behaviors/fs/read/file/full::read-node
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
    any:
      - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
      - id: micro-behaviors/fs/path/token::cloud-credentials
      - id: micro-behaviors/fs/path/secret-config::orchestration-credentials
    needs: 2
    near_bytes: 8192
