# sckit-class plugin implant: a detached payload inherits the full host
# environment (plus the victim's prompt text) while the plugin harvests
# registry tokens and posts JSON loot over HTTPS. No legitimate plugin
# respawns itself detached with cloned secrets and a POST channel open.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: npm-detached-env-launch-token-exfil
    desc: Detached Node payload collects developer credentials and posts JSON
    crit: hostile
    conf: 0.94
    attack: T1195.002,T1552.001,T1041
    near_bytes: 4000
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
      - id: micro-behaviors/communications/http/post::fetch-flow-json-post-body
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
    any:
      - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
      - id: npm-credential-source-in-request-body
  - id: npm-credential-source-in-request-body
    desc: npm credential source contributes to a Node request body
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/request/credential-body-flow::npm-env-token-json-body-to-request-end
      - id: micro-behaviors/communications/http/request/credential-body-flow::npmrc-read-json-body-to-request-end
      - id: micro-behaviors/communications/http/request/credential-body-flow::npmrc-read-body-to-request-end
