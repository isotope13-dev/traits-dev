defaults:
  platforms:
    - unix
    - windows
  crit: notable
  attack: T1195.001
  mbc: B0030
  for:
    - python
traits:
  - id: dependency-gitpython
    desc: GitPython dependency
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: install_requires.{0,50}gitpython|gitpython.{0,50}install
  - id: dependency-sockets
    desc: sockets library dependency
    crit: notable
    conf: 0.65
    if:
      type: string_literal
      regex: '\binstall_requires\b.{0,80}\bsockets\b|\bsockets\b.{0,80}\binstall\b'
  - id: dependency-dhooks
    desc: dhooks Discord webhook library
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: '''dhooks''|"dhooks"|install_requires.{0,50}dhooks'
  - id: dependency-mss
    desc: Python setup metadata declares mss dependency
    crit: notable
    conf: 0.7
    if:
      # A bare "mss" string also occurs in ordinary import errors and
      # documentation.  Keep this dependency fragment tied to setup metadata.
      type: text
      regex: '(?is)\binstall_requires\b.{0,100}\bmss\b'
  - id: suspicious-dep-combo-1
    desc: 'Suspicious combo'
    if:
      type: string_literal
      regex: (sockets|aiohttp).{0,50}discord
  - id: suspicious-dep-combo-2
    desc: Suspicious combo (discord/request with pynput)
    if:
      type: string_literal
      regex: (discord|requests).{0,50}pynput

  # A dependency on a browser-cookie extractor. browser_cookie3 / pycookiecheat
  # read every logged-in session cookie out of Chrome/Firefox/Edge; a package
  # that lists one as a runtime requirement is arranging to pull that capability
  # onto the installer's machine. Notable alone (yt-dlp-style scrapers use it
  # legitimately); the composite pairs it with an exfil channel.
  - id: dependency-browser-cookie-stealer
    desc: Depends on a browser-cookie extractor
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(browser[_-]cookie3|pycookiecheat)\b'

  # A dependency on a Discord-webhook poster. discordwebhook / discord-webhook
  # exist to push a message (and attachments) to a Discord channel with no
  # account -- the exfil channel a token/cookie stealer ships its loot over.
  - id: dependency-discord-webhook-exfil
    desc: Depends on a Discord webhook poster
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(discordwebhook|discord[_-]webhook)\b'

  - id: python-user-agent-helper-import
    desc: Imports external user-agent formatting helper
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?im)from\s+\w[\w.]*\s+import\s+\w+\s+as\s+\w*user_agent\w*'

  - id: python-user-agent-helper-key-pair
    desc: Passes cloud key pair to helper
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)user_agent\w*\.\w+\s*\(\s*self\._public_key_id\s*,\s*self\._private_key\b'
composite_rules:
  - id: suspicious-dep-combo
    desc: Suspicious dependency combination
    crit: suspicious
    conf: 0.8
    all:
      - id: suspicious-dep-combo-1
      - id: suspicious-dep-combo-2
  - id: pypi-suspicious-deps
    desc: Suspicious PyPI dependencies
    crit: suspicious
    conf: 0.85
    needs: 2
    any:
      - id: dependency-gitpython
      - id: dependency-sockets
      - id: metadata/package/dependencies/declaration::pypi-requests-sockets-dependencies
    unless:
      - id: well-known/app/development/calvyn-code
  - id: stealer-dep-pattern
    desc: Token stealer dependency pattern
    crit: suspicious
    conf: 0.9
    needs: 3
    any:
      - id: dependency-gitpython
      - id: dependency-sockets
      - id: suspicious-dep-combo
  - id: discord-stealer-bot
    desc: Discord stealer bot with webhook exfiltration
    crit: hostile
    conf: 0.95
    all:
      - id: dependency-dhooks
      - id: dependency-mss
      - id: well-known/lib/network/discord-py::import

  - id: pypi-package-credentials-to-user-agent-helper
    desc: Python package leaks cloud key pair to imported helper
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.001,T1041
    for: [python-sdist]
    scope: archive
    all:
      - id: python-user-agent-helper-import
      - id: python-user-agent-helper-key-pair
      - id: metadata/build/pip::setup-py

  # A package whose declared dependencies are a stealer bundle: a browser-cookie
  # extractor to harvest logged-in sessions, plus a Discord webhook / bot library
  # to ship them out. The package itself often carries almost no code -- the
  # capability lives entirely in the dependencies pip pulls in on install, which
  # is why the behavioral rules see nothing. The combination is the signal:
  # reading every browser cookie AND owning a no-auth Discord exfil channel has
  # no benign reading together. This is the Roblox/Discord cookie-stealer shape
  # (browser_cookie3 + discordwebhook + robloxpy).
  - id: browser-cookie-discord-stealer-bundle
    desc: Dependencies form a cookie-stealer bundle
    crit: hostile
    conf: 0.95
    attack: T1195.001,T1539,T1552.001,T1567
    scope: archive
    all:
      - id: dependency-browser-cookie-stealer
    any:
      - id: dependency-discord-webhook-exfil
      - id: dependency-dhooks
      - id: well-known/lib/network/discord-py::import
