defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: disposable-npm-credential-stealer
  desc: Throwaway npm package steals credentials
  crit: hostile
  conf: 0.95
  attack: T1195.002
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/author/identity::placeholder-author-without-repository
  - id: objectives/exfiltration/stealer/credential::node-credential-file-curl-exfil
