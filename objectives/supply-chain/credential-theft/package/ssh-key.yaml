defaults:
  platforms: [unix]
  for: [package.json]
composite_rules:
  - id: npm-hook-prepares-ssh-directory-and-dumps-key
    desc: Postinstall creates SSH directory and dumps key
    crit: hostile
    conf: 0.99
    all:
    - id: micro-behaviors/fs/read/file/target::postinstall-cat-ssh-private-key
    - id: micro-behaviors/fs/directory/create::postinstall-ssh-dir-mkdir
