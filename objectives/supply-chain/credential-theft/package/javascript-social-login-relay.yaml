# npm/JavaScript packages that relay social-network credentials to a remote
# login-helper API instead of authenticating with the platform directly.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, archives]
  attack: T1552.001,T1041,T1195.002
  mbc: E1552,E1041

traits:
  - id: js-remote-social-login-api-path
    desc: JS remote social-network login API path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '/api/v\d+/(facebook|instagram|twitter)/login'

  # The two "a request body carries email and password" atoms and their
  # `js-email-password-request-object` roll-up moved to
  # micro-behaviors/communications/http/request/body/. That shape is what every
  # login form posts -- a sign-in page template's
  # `const body = { email, password, callbackURL }` was reading as package
  # credential theft -- so it is a request-payload capability, not an objective.
  # The relay composites below still reference the roll-up: the theft comes from
  # the destination (`/api/v1/facebook/login`), not from the body.

composite_rules:

  - id: js-offsite-social-credential-relay
    desc: JavaScript relays social credentials to remote login API
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: js-remote-social-login-api-path
      - id: micro-behaviors/communications/http/request/body::js-email-password-request-object
    any:
      # axios.post() / application/json POST miss axios(config) aliases
      # that still set method: "POST" (tree-sitter post-method-text).
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/client::post-method-text

  - id: npm-offsite-login-sqlite-credential-theft
    desc: npm relays social logins with SQLite session backup
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: js-remote-social-login-api-path
      - id: micro-behaviors/communications/http/request/body::js-email-password-request-object
      - id: metadata/package/dependencies/manifest::npm-dep-sqlite3
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/client::post-method-text
