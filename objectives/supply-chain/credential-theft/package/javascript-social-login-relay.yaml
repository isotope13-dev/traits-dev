# npm/JavaScript packages that relay social-network credentials to a remote
# login-helper API instead of authenticating with the platform directly.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, archives]
  attack: T1552.001,T1041,T1195.002
  mbc: E1552,E1041

traits:
  - id: js-remote-social-login-api-path
    desc: JS remote social-network login API path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '/api/v\d+/(facebook|instagram|twitter)/login'

  - id: js-credential-json-email-password-fields
    desc: JavaScript JSON body includes email and password
    crit: notable
    conf: 0.9
    if:
      type: text
      # Quoted JSON keys with a non-empty password value. Skips URL
      # destructure (`username:p,password:m`), empty userinfo
      # (`username:"",password:""`), and React input-type maps
      # (`email:!0,password:!0`).
      #
      # The leading `[{,]` pins both keys to object-literal position and the
      # gap forbids statement punctuation, so a switch over URL component
      # names -- `case"username":...break;case"password":` in
      # urlpattern-polyfill -- no longer reads as one credential body.
      regex: '[{,]\s*["''](email|username)["'']\s*:\s*[^;{}]{0,80}["'']password["'']\s*:\s*.{0,8}[A-Za-z]'

  # ES6 shorthand assigned to a request body: `body = { email, password }`.
  # Bare `{ email, password }` also matches destructuring and is too common.
  - id: js-body-shorthand-email-password
    desc: JS body object shorthand email and password
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bbody\s*=\s*\{\s*(email|username)\s*,\s*password\s*[,}]'

composite_rules:
  - id: js-email-password-request-object
    desc: JavaScript packs email and password into a request object
    crit: notable
    conf: 0.93
    any:
      - id: js-credential-json-email-password-fields
      - id: js-body-shorthand-email-password

  - id: js-offsite-social-credential-relay
    desc: JavaScript relays social credentials to remote login API
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: js-remote-social-login-api-path
      - id: js-email-password-request-object
    any:
      # axios.post() / application/json POST miss axios(config) aliases
      # that still set method: "POST" (tree-sitter post-method-text).
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/client::post-method-text

  - id: npm-offsite-login-sqlite-credential-theft
    desc: npm relays social logins with SQLite session backup
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: js-remote-social-login-api-path
      - id: js-email-password-request-object
      - id: metadata/package/dependencies/manifest::npm-dep-sqlite3
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/client::post-method-text
