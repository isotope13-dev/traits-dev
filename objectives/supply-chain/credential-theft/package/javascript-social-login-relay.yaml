# npm/JavaScript packages that relay social-network credentials to a remote
# login-helper API instead of authenticating with the platform directly.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, archives]
  attack: T1552.001,T1041,T1195.002
  mbc: E1552,E1041

traits:
  - id: js-remote-social-login-api-path
    desc: JS remote social-network login API path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '/api/v\d+/(facebook|instagram|twitter)/login'

  - id: js-credential-json-email-password-fields
    desc: JavaScript JSON body includes email and password
    crit: notable
    conf: 0.9
    if:
      type: text
      # Object/JSON keys (`username:` / `"email":`), not URL userinfo parsers
      # that assign `this.username` / `this.password` or mention both words.
      regex: '\b(email|username)\s*:\s*.{0,80}\bpassword\s*:'

composite_rules:
  - id: js-offsite-social-credential-relay
    desc: JavaScript relays social credentials to remote login API
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: js-remote-social-login-api-path
      - id: js-credential-json-email-password-fields
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-post-json

  - id: npm-offsite-login-sqlite-credential-theft
    desc: npm relays social logins with SQLite session backup
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: js-remote-social-login-api-path
      - id: js-credential-json-email-password-fields
      - id: metadata/package/dependencies/manifest::npm-dep-sqlite3
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-post-json
