# sckit-class PyPI trojan: a bundled platform-specific binary starts at
# import time while the module harvests developer secrets for exfiltration.
# No single leg is hostile alone -- many packages spawn helpers, and secret
# scanners read these same files -- but a module that launches a binary on
# import *and* sweeps cross-vendor secrets into an HTTP payload is a
# credential-stealing dropper, not a library.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: pypi-import-launch-secret-harvest-exfil
    desc: Imported module launches binary and harvests secrets
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1552.001,T1041
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: objectives/credential-access/env/secrets/bulk-access::script-cross-vendor-secret-catalog-harvest
      - id: objectives/exfiltration/http/collect::python-json-request-payload
