# Published npm libraries that ship operator cloud credentials in source
# (embedded GCP/Firebase keys, authenticated Redis URLs) rather than loading
# them from the deployment environment.
defaults:
  platforms: [unix, windows]
  for: [javascript, npm, tar, zip]
  attack: T1195.002,T1552.001

composite_rules:
  - id: gcp-secret-manager-client-embedded-sa-key
    desc: Secret Manager client embeds a GCP service-account key
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/security/auth/cloud::gcp-secret-version-access
      - id: micro-behaviors/os/security/auth/cloud::gcp-service-account-email
      - id: micro-behaviors/crypto/asymmetric/key::embedded-pem-private-key

  - id: npm-module-default-config-cloud-credential-bundle
    desc: Module default config embeds Redis auth and Firebase PEM
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 24000
    all:
      - id: micro-behaviors/data/db/redis::redis-authenticated-url
      - id: micro-behaviors/os/security/auth/cloud::firebase-admin-config-embedded-pem
      - id: micro-behaviors/crypto/asymmetric/key::embedded-pem-private-key
