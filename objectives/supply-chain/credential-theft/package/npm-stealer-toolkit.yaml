defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  attack: "T1195.002"

traits:
- id: dep-better-sqlite3
  desc: Metadata declares better-sqlite3 dependency
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.better-sqlite3
    exists: true

- id: dep-node-machine-id
  desc: Metadata declares node-machine-id dependency
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.node-machine-id
    exists: true

- id: dep-socket-io-client
  desc: Metadata declares socket.io-client dep
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.socket.io-client
    exists: true

- id: dep-axios
  desc: Package metadata declares axios dependency
  crit: notable
  conf: 0.8
  if:
    # Read the dependency object, not prose in README/examples embedded in
    # PKG-INFO or METADATA.  A quoted axios example is not a package dep.
    type: value
    path: dependencies.axios
    exists: true

composite_rules:
- id: npm-registry-stealer-toolkit
  desc: Registry metadata has stealer dependency toolkit
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/supply-chain/impersonation/registry/snapshot::registry-metadata-json
  - id: dep-better-sqlite3
  - id: dep-node-machine-id
  any:
  - id: dep-socket-io-client
  - id: dep-axios
