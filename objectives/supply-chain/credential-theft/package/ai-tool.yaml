defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002

composite_rules:
  - id: ai-tool-install-hook-lure
    desc: AI tool package with install hook
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/name/vocabulary::ai-tool-name-reference
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: metadata/package/repository/
      - id: metadata/package/dependencies/
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/fixture/
  - id: ai-tool-brandjack-native-loader
    desc: AI-tool-named native loader with placeholder version
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/package/name/vocabulary::ai-tool-name-reference
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/dependencies/manifest/name-form::platform-optional-native-wrapper
      - id: metadata/package/versioning/sentinel::release-zero
    unless:
      - id: metadata/package/repository/
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/fixture/
