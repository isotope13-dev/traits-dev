# Credential theft from Python packages that execute during installation or
# import.  The source incident involved a package published under a requested
# dependency name; the package identity is intentionally not part of this
# rule.  The useful static signal is the package execution boundary combined
# with credential collection and an outbound structured request.
defaults:
  platforms: [windows, unix]
  for: [python, archives]
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1041

composite_rules:
  - id: pypi-install-credential-exfil
    desc: PyPI install hook exfiltrates credentials
    crit: hostile
    conf: 0.99
    scope: archive
    for: [whl, python-sdist]
    all:
      - id: metadata/build/package::setuptools-run-override
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
    any:
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-pypirc
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-netrc
      - id: micro-behaviors/os/env/vars/credentials::python-sensitive-env-read

  - id: pypi-import-credential-exfil
    desc: Python package import exfiltrates credentials
    crit: hostile
    conf: 0.98
    scope: archive
    for: [whl, python-sdist]
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
    any:
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-pypirc
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-netrc
      - id: micro-behaviors/os/env/vars/credentials::python-sensitive-env-read
