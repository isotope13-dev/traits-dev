# Credential theft from Python packages that execute during installation or
# import.  The source incident involved a package published under a requested
# dependency name; the package identity is intentionally not part of this
# rule.  The useful static signal is the package execution boundary combined
# with credential collection and an outbound structured request.
defaults:
  platforms: [windows, unix]
  for: [python, archives]
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1041

composite_rules:
  # A top-level setup.py executes while a source package is installed. Keep
  # these rules in credential-theft/package: the distinctive behavior is
  # install-time credential collection plus outbound transfer, not generic
  # host reconnaissance. No package name, endpoint, or version is assumed.
  - id: pypi-setup-ssh-credential-exfil
    desc: setup.py collects SSH files and posts them during package install
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1552.004,T1041"
    mbc: E1552,E1041
    for: [python]
    near_bytes: 8192
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: objectives/credential-access/ssh/key::python-ssh-directory-enumeration
      - id: micro-behaviors/communications/http/request/client::python-post-transport
    any:
      - id: micro-behaviors/fs/read/file::python-pathlib-read-text
      - id: micro-behaviors/fs/read/file::python-pathlib-read-bytes
      - id: micro-behaviors/fs/read/file::file-read-content

  - id: pypi-setup-env-credential-exfil
    desc: setup.py filters credential-named environment values for a POST
    crit: hostile
    conf: 0.99
    mbc: E1552,E1041
    for: [python]
    near_bytes: 8192
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/os/env/vars/credentials::python-environ-credential-name-filter
      - id: micro-behaviors/communications/http/request/client::python-post-transport

  # Pretty-printing the collected object to a writable local file before the
  # outbound request is an additional, analyst-useful attack signal. The
  # collection + file write + network combination is hostile even when the
  # payload uses urllib or another Python HTTP client instead of requests.
  - id: pypi-setup-credential-receipt-exfil
    desc: setup.py writes harvested credentials locally before POST exfiltration
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1552.001,T1552.004,T1074.001,T1041"
    mbc: E1552,E1041
    for: [python]
    near_bytes: 8192
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/fs/file/open::text-write-append-create-mode
      - id: micro-behaviors/data/serialize/object::json-dump
      - id: micro-behaviors/communications/http/request/client::python-post-transport
    any:
      - id: objectives/credential-access/ssh/key::python-ssh-directory-enumeration
      - id: micro-behaviors/os/env/vars/credentials::python-environ-credential-filter
  - id: pypi-install-credential-exfil
    desc: PyPI install hook exfiltrates credentials
    crit: hostile
    conf: 0.99
    scope: archive
    for: [whl, python-sdist]
    all:
      - id: metadata/build/package/recipe::setuptools-run-override
      - id: micro-behaviors/communications/http/request/client::python-structured-post-transport
    any:
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-pypirc
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-netrc
      - id: micro-behaviors/os/env/vars/credentials::python-sensitive-env-read

  - id: pypi-import-credential-exfil
    desc: Python package import exfiltrates credentials
    crit: hostile
    conf: 0.98
    # Keep import-time execution, transport, and credential collection in the
    # same source file.  Archive-wide pooling makes a normal package with an
    # __init__.py, a webhook client, and a credential-aware helper look like
    # import-time theft even when those capabilities are unrelated.
    scope: leaf
    for: [whl, python-sdist]
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/request/client::python-structured-post-transport
    # A package's service credential (for example a Telegram bot token) is
    # used to authenticate its intended API and is not evidence of theft.
    # Require a credential-store access or broad environment-harvesting leg;
    # these are the collection behaviors this objective describes.
    any:
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-pypirc
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-netrc
      - id: micro-behaviors/os/env/vars/credentials::python-environ-items-credential-filter
      - id: micro-behaviors/os/env/vars/credentials::python-environ-alias-items-credential-filter
    unless:
      - id: well-known/tool/detection/hol-guard::hol-guard-tool

  - id: pypi-pep517-credential-exfil
    desc: PEP 517 build backend exfiltrates credentials
    crit: hostile
    conf: 0.99
    scope: archive
    for: [whl, python-sdist]
    all:
      - id: objectives/supply-chain/install-hook/build/pep517::pyproject-custom-build-backend
      - id: objectives/supply-chain/install-hook/build/pep517::pep517-build-wheel-def
      - id: micro-behaviors/communications/http/request/client::python-structured-post-transport
    any:
      - id: micro-behaviors/os/env/vars/credentials::python-sensitive-env-read
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-pypirc
      - id: objectives/supply-chain/credential-theft/registry::py-pathlib-netrc
