defaults:
  platforms: [unix, windows]
  attack: "T1195.002"
  for: [python, pkginfo]
composite_rules:
  - id: init-network-pingback
    desc: Import time network pingback
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: objectives/exfiltration/oob/endpoint::interact-sh-me-fun
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
      - id: micro-behaviors/communications/http/request/client::url-literal
  - id: init-encoded-url-callback
    desc: Python init file requests an encoded HTTP URL
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/communications/http/request/client::request-python
    any:
      - id: micro-behaviors/communications/url/encoded::https-b64-protocol-fragment
      - id: micro-behaviors/communications/url/encoded::encoded-http-url
  # The encoded-URL callback, plus what it sends.
  #
  # `init-encoded-url-callback` above stops at suspicious for a good reason: a
  # package that reassembles a URL from base64 fragments at import time is
  # hiding where it points, but hiding an endpoint is not by itself proof of
  # what travels to it. Adding the machine's identity to the same file settles
  # it -- the import reports the host it landed on to an address the source
  # deliberately does not spell out.
  #
  # Worked example: an `__init__.py` that joins two base64 halves into a
  # collector URL, appends `?h=<socket.gethostname()>&pypi=<module name>`, and
  # opens it through an SSL context with verification disabled.
  - id: init-encoded-url-host-identity-callback
    desc: Init file sends host identity to an encoded URL
    crit: hostile
    conf: 0.96
    mbc: E1041
    attack: "T1195.002,T1082,T1041"
    all:
      - id: init-encoded-url-callback
    any:
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/os/sysinfo/hostname::python-os-uname-nodename
      - id: micro-behaviors/process/user/query::python-getpass-user
      - id: micro-behaviors/process/user/query::os-getlogin-python

  - id: init-oob-callback
    desc: Python init file requests an OOB endpoint
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/profile/identity::init-py-file
      - id: micro-behaviors/communications/http/request/client::request-python
    any:
      - id: objectives/exfiltration/oob/endpoint::oob-domains
  - id: dependency-confusion-pingback
    desc: Dependency confusion package with OAST pingback
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/versioning::pkginfo-inflated-version
      - id: objectives/supply-chain/impersonation/depconf::summary-poc-research
      - id: init-network-pingback
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
      - id: micro-behaviors/communications/http/request/client::url-literal
