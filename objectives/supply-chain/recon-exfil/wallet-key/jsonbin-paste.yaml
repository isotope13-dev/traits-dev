# Supply-chain helper modules that validate wallet secrets and ship them to a
# paste-bin dead drop under commercial JS obfuscation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1195.002,T1555,T1041,T1102.001"

composite_rules:
  - id: jsjiami-wallet-key-jsonbin-exfil
    desc: jsjiami-obfuscated module exfils wallet keys to JSONBin
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jsjiami-hex-obfuscation
      - id: objectives/command-and-control/infrastructure/paste::jsonbin-access-key-bins-client
      - id: objectives/credential-access/wallet/key-format::dual-wallet-private-key-validators
