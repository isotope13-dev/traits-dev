defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1048.003"
  mbc: "E1041"

traits:
- id: npm-prepare-node-index-hook
  desc: Prepare hook runs local Node index script
  crit: notable
  conf: 0.97
  for: [package.json]
  if:
    type: value
    path: scripts.prepare
    regex: "^node\\s+(\\./)?index\\.(c?js|mjs)(\\s*\\|\\|\\s*true)?$"

composite_rules:
- id: npm-entrypoint-loads-host-identity-dns-exfil
  desc: NPM entrypoint silently loads a host-profile DNS beacon
  crit: hostile
  conf: 0.995
  for: [npm, package.json, javascript, typescript]
  scope: archive
  attack: "T1195.002,T1048.003,T1033,T1082"
  all:
  - id: micro-behaviors/os/module/load::cjs-side-effect-local-require
  - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
  - id: objectives/exfiltration/dns/encoded::js-encrypted-host-identity-dns-exfil

- id: obfuscated-dns-label-lookup
  desc: Computed DNS label lookup with encoded canary
  crit: suspicious
  conf: 0.98
  near_bytes: 1024
  all:
  - id: micro-behaviors/communications/url/host/oob::base64-dnshook-host-reference
  - id: micro-behaviors/data/control-flow/dispatch::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat::js-dotted-variable-concat

  # Import-time behavior: all three legs must occur in the same JavaScript
  # source. This intentionally does not require a literal canary domain: the
  # domain is commonly supplied by a helper/config module and may be absent
  # from the published archive while the exfiltration behavior remains evident.
- id: js-obfuscated-host-profile-dns-beacon
  desc: Node import-time beacon sends an obfuscated host profile through DNS
  crit: hostile
  conf: 0.995
  attack: "T1027,T1027.007,T1033,T1082,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: objectives/anti-static/obfuscation/encoding/numeric::node-charcode-host-profile-methods
  - id: objectives/anti-static/obfuscation/imports/concealment::hex-charcode-resolve4-method
  - id: micro-behaviors/data/string/concat::js-array-join-fallback-labels

- id: js-obfuscated-computed-host-profile-dns-beacon
  desc: Node beacon sends host profile through computed DNS
  crit: hostile
  conf: 0.995
  attack: "T1027.007,T1033,T1082,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: micro-behaviors/communications/url/host/oob::base64-dnshook-host-reference
  - id: micro-behaviors/data/control-flow/dispatch::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat::js-dotted-variable-concat
  any:
  - id: metadata/lang/source/literal/value::host-profile-term-hostname
  - id: metadata/lang/source/literal/value::host-profile-term-userinfo
  - id: metadata/lang/source/literal/value::host-profile-term-username
  needs: 2

# Fragment-array sibling: the callback hostname is split across a short
# literal array joined with an empty separator, then passed to dns.lookup
# at module load. Worked example: @an1mshnpmb9c84920/pipeprobe-obf-m19n5.
- id: js-obfuscated-oob-domain-dns-lookup
  desc: Obfuscated OOB domain triggers DNS lookup
  crit: hostile
  conf: 0.98
  attack: "T1027,T1048.003"
  mbc: "B0032,E1041"
  scope: file
  near_bytes: 512
  all:
  - id: micro-behaviors/data/string/concat::js-inline-string-array-join
  - id: micro-behaviors/data/string/concat::js-inline-array-join-oob-domain-fragment
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup

# Dot-joined pipe beacon: hostname and npm lifecycle labels precede an
# oob.* suffix, resolved through a bound require('dns') alias at load.
# Worked example: @an1mshnpmb9c84920/pipe-dns-m19t2 1.0.0.
- id: js-dot-joined-oob-dns-beacon
  desc: Dot-joined OOB label triggers DNS lookup
  crit: hostile
  conf: 0.98
  attack: "T1027,T1048.003"
  mbc: "B0032,E1041"
  scope: file
  near_bytes: 768
  all:
  - id: micro-behaviors/data/string/concat::js-dot-joined-oob-dns-label-array
  - id: micro-behaviors/communications/dns/resolver::dns-require-bound-lookup
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  any:
  - id: micro-behaviors/os/env/package-manager::npm-lifecycle
  - id: micro-behaviors/os/sysinfo/hostname::node-hostname-read

# Package-level behavior: the install hook is the delivery context for the
  # import-time beacon. Keep this archive-scoped so package.json and the loaded
  # JavaScript may contribute evidence without requiring a literal file name.
- id: npm-install-obfuscated-host-profile-dns-beacon
  desc: NPM install hook activates an obfuscated host-profile DNS beacon
  crit: hostile
  conf: 0.998
  for: [npm, package.json, javascript, typescript]
  scope: archive
  attack: "T1195.002,T1027.007,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: metadata/package/scripts/lifecycle::has-install-script
  - id: metadata/package/scripts/lifecycle::install-runs-node-local-script
  - id: js-obfuscated-host-profile-dns-beacon

  # Variant for packages that use an obfuscated computed resolver instead of
  # the numeric-array resolver method family above.
- id: npm-install-obfuscated-dns-label-beacon
  desc: NPM install hook activates an obfuscated DNS beacon
  crit: hostile
  conf: 0.998
  for: [npm, package.json, javascript, typescript]
  scope: archive
  attack: "T1195.002,T1027.007,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: metadata/package/scripts/lifecycle::has-install-script
  - id: metadata/package/scripts/lifecycle::install-runs-node-local-script
  - id: js-obfuscated-computed-host-profile-dns-beacon

# The prepare-hook sibling: npm runs prepare on install and publish, so a
# tiny index.js DNS probe can fire without a postinstall/preinstall key.
# Worked example: @an1mshnpmb9c84920/pipeprobe-obf-m19n5 1.0.0.
- id: npm-prepare-obfuscated-oob-dns-beacon
  desc: NPM prepare hook runs obfuscated OOB DNS beacon
  crit: hostile
  conf: 0.99
  for: [npm, package.json, javascript, typescript]
  scope: archive
  attack: "T1195.002,T1027,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
  - id: npm-prepare-node-index-hook
  - id: js-obfuscated-oob-domain-dns-lookup

- id: npm-prepare-dot-joined-oob-dns-beacon
  desc: NPM prepare hook runs dot-joined OOB DNS beacon
  crit: hostile
  conf: 0.99
  for: [npm, package.json, javascript, typescript]
  scope: archive
  attack: "T1195.002,T1027,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
  - id: npm-prepare-node-index-hook
  - id: js-dot-joined-oob-dns-beacon

# A release may split the DNS beacon across an install hook and a tiny
  # configuration/helper module.  An obfuscated CommonJS domain export is not
  # enough by itself; the package-level rule also requires registry evidence of
  # an install hook and the numeric-array decoder used to conceal the helper.
- id: npm-install-obfuscated-domain-helper
  desc: NPM install hook ships an obfuscated DNS-domain helper
  crit: hostile
  conf: 0.98
  for: [tar, registry, javascript]
  # The install hook is represented by the fetched registry sidecar while the
  # helper lives inside the tarball, so package scope is required here.
  scope: outer
  attack: "T1195.002,T1027.007,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: metadata/registry::registry-install-hook
  - id: objectives/anti-static/obfuscation/string/array::hex-array-near-indexed-charcode-decoder
  - id: micro-behaviors/os/module/export::commonjs-domain-like-export

  # Install-time DNS beacon: install hook + DNS lookup + canary domain
- id: npm-install-ships-hex-profile-dns-exfil
  desc: NPM install hook ships hex-obfuscated host-profile DNS exfiltration
  crit: hostile
  conf: 0.999
  for: [javascript, typescript, package.json, npm]
  scope: archive
  attack: "T1195.002,T1027.013,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/exfiltration/dns/encoded::js-hex-host-profile-resolve4-exfil

# Package-level cleartext variant: a preinstall script loads a local JavaScript
# file that places victim identity fields directly into an A-record query. The
# file-level exfil rule proves the payload; this rule supplies install-time
# execution context across archive members.
- id: npm-preinstall-host-profile-dns-exfil
  desc: npm preinstall ships host-profile DNS exfiltration
  crit: hostile
  conf: 0.999
  for: [javascript, typescript, package.json, npm]
  scope: archive
  attack: "T1195.002,T1048.003,T1082,T1033"
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/exfiltration/side-channel::js-host-profile-dns-query

# The profile beacon may query only a host name plus the current username,
# without a working-directory field. Keep the existing file-level DNS/OOB
# finding and add the install-hook context when the same script reads both
# identity values and the package preinstall executes it.
- id: npm-preinstall-host-user-oob-dns-exfil
  desc: npm preinstall sends host and user identity through OOB DNS
  crit: hostile
  conf: 0.99
  for: [javascript, typescript, package.json, npm]
  scope: archive
  attack: "T1195.002,T1048.003,T1082,T1033"
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/exfiltration/side-channel::js-hostname-oob-dns-query
  - id: micro-behaviors/process/user/query::os-userinfo-call

# Shell-spelled variant of the above: the preinstall script shells identity
# collection (whoami/hostname) into an nslookup at a collaborator domain
# instead of placing API-read fields into the query. The file-level composite
# proves the transfer; this rule supplies the install-time execution context.
- id: npm-preinstall-shell-oastify-dns-exfil
  desc: npm preinstall ships shell OAST DNS identity exfiltration
  crit: hostile
  conf: 0.995
  for: [javascript, typescript, package.json, npm]
  scope: archive
  attack: "T1195.002,T1048.003,T1082,T1033"
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/supply-chain/recon-exfil/oast/secret::shell-oastify-dns-identity-exfil

# The same install-time beacon pointed at the operator's own collector rather
# than a named service.
#
# Every canary marker above names a service -- burpcollaborator.net,
# interact.sh, oastify.com, dnshook.site -- so a package that resolves
# `analytics-<uuid>.cloud.example.rs` at install time matches none of them,
# though it is doing exactly the same thing. What survives when the service
# name is gone is the per-target label: the operator still needs each install
# to identify itself, and a UUID in the hostname is how that is spelled.
#
# Archive-scoped: the hook is declared in package.json and the proven DNS
# identity beacon lives in the script it runs, so the two never meet in one
# file. Requiring that file-level beacon prevents a resolver import and a UUID
# filename in unrelated archive members from being pooled into this finding.
- id: npm-install-uuid-canary-dns-beacon
  desc: Install hook resolves a per-target canary host
  crit: hostile
  conf: 0.97
  for: [javascript, typescript, package.json, npm]
  scope: archive
  attack: "T1195.002,T1048.003"
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/exfiltration/dns/lookup::js-identity-label-dns-beacon
