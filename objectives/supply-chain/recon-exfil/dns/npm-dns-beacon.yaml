# DNS-based exfiltration via install hooks (Node.js)
# Detects install-time DNS beacon patterns where host metadata
# is encoded and sent via DNS lookups to canary/OOB services.
# ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain),
#         T1048.003 (Exfiltration Over Alternative Protocol: DNS)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1048.003"
  mbc: "E1041"

traits:
  # Hex encoding for DNS label exfiltration
  # Buffer.from(data).toString("hex").slice(0,60) — truncation to 60 chars
  # stays under the 63-byte DNS label limit
- id: hex-encode-dns-label
  desc: Hex-encodes data truncated to DNS label limit
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'toString\s*\(\s*["''](hex)["'']\s*\)\s*\.\s*slice\s*\(\s*0\s*,\s*6[0-3]\s*\)'

  # Base64-decoded canary domain in encoded strings
  # Matches dnshook.site domains recovered from base64
- id: encoded-dnshook-canary
  desc: Base64-decoded dnshook.site canary domain
  crit: suspicious
  conf: 0.98
  if:
    type: encoded
    encoding: base64
    regex: '[a-z0-9]{8,64}\.dnshook\.site'

  # Obfuscated dns.lookup with canary domain
  # Detects when dns.lookup is called with a variable containing
  # a dnshook.site domain (recovered from encoded strings)
- id: dns-lookup-with-canary-domain--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: burpcollaborator.net
  count_max: 1023579
- id: dns-lookup-with-canary-domain--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: canarytokens
  count_max: 1023580
- id: dns-lookup-with-canary-domain--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: dnshook.site
  count_max: 1023581
- id: dns-lookup-with-canary-domain--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: interact.sh
  count_max: 1023582
# rx-5 was `substr: dns.lookup` — the Node DNS API itself, filed among the
# canary/OAST *domain* markers (burpcollaborator.net, canarytokens, dnshook.site,
# interact.sh, oast.*, oastify.com) and described only as "Regex component
# marker". Because the composite below already requires node-dns-lookup in its
# `all:`, this leg made the `any:` half satisfiable by the very call the `all:`
# half demands, collapsing the rule to "calls dns.lookup" — so a SOCKS5 proxy
# resolving its requested destination (@luminati-io/socksv5 in Tabby's bundled
# SSH plugin: `dns.lookup(req.dstAddr, ...)`) scored a canary-beacon finding.
# Removed rather than relocated: dns.lookup is already the canonical atom
# micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup.
- id: dns-lookup-with-canary-domain--rx-7
  desc: OAST interactsh canary domain
  crit: component
  conf: 0.95
  # Match the OAST hostname (oast.fun/site/live/online/pro), not a bare `oast`
  # substring — the latter fires inside "Yoast" and other benign words.
  if:
    type: text
    regex: '\boast\.[a-z]{2,8}'
  count_max: 1023585
- id: dns-lookup-with-canary-domain--rx-8
  desc: Oastify Collaborator canary domain
  crit: component
  conf: 0.95
  if:
    type: text
    substr: oastify.com
  count_max: 1023586
# Some packages conceal the resolver method and host-profile API names as
# numeric arrays, then join the collected values into one DNS label.  The
# method-name atoms live in the anti-static taxonomy; this local atom supplies
# the data-flow leg so a package that merely queries hostname() or userInfo()
# does not become a DNS-exfiltration finding.
- id: dns-host-profile-array-join
  desc: Joins host fields and timestamp for DNS
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?is)\[[^\]\r\n]{0,220}\|\|\s*["''][uhd]["''][^\]\r\n]{0,220}\]\s*\.\s*join\s*\('

  # The numeric dispatch atom is defined with the generic computed-property
  # capabilities; this file supplies the DNS/profile context around it.
  # These API names are often stored as strings and resolved through the
  # same dispatcher. They become meaningful only with the DNS canary and
  # encoded-label atoms in the composites below.
- id: host-profile-term-hostname
  desc: Obfuscated hostname API name
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '["'']hostname["'']'
- id: host-profile-term-userinfo
  desc: Obfuscated userInfo API name
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '["'']userInfo["'']'
- id: host-profile-term-username
  desc: Obfuscated username field name
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '["'']username["'']'

composite_rules:
# A numeric dispatch and dotted-label construction are only meaningful here
# when an encoded OAST/canary domain is also present. Without that third leg,
# ordinary bundled JavaScript can satisfy the two generic atoms.
- id: obfuscated-dns-label-lookup
  desc: Computed DNS label lookup with encoded canary
  crit: suspicious
  conf: 0.98
  near_bytes: 1024
  all:
  - id: encoded-dnshook-canary
  - id: micro-behaviors/data/source/property/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat::js-dotted-variable-concat

  # Require the computed-dispatch mechanic as well as two distinct identity
  # terms.  Hostname/userInfo/username are ordinary URL, telemetry, and
  # browser-automation fields when they appear without string-table dispatch.
- id: obfuscated-host-profile-terms
  desc: Computed dispatch references host or user identity fields
  crit: suspicious
  conf: 0.96
  needs: 2
  all:
  - id: micro-behaviors/data/source/property/computed::js-numeric-indexed-computed-call
  any:
  - id: host-profile-term-hostname
  - id: host-profile-term-userinfo
  - id: host-profile-term-username
  unless:
    - id: well-known/app/development/vscode-extension/dbt-vscode::dbt-vscode-extension-context
    - id: well-known/lib/web/whatwg-url::whatwg-url-parser-context
    - id: well-known/lib/web/follow-redirects::node-http-url-parser-context
    - id: well-known/app/development/browserstack::browserstack-ai-sdk-context
    - id: metadata/package/files/dependency::vsix-bundled-output-path

  # Import-time behavior: all three legs must occur in the same JavaScript
  # source. This intentionally does not require a literal canary domain: the
  # domain is commonly supplied by a helper/config module and may be absent
  # from the published archive while the exfiltration behavior remains evident.
- id: js-obfuscated-host-profile-dns-beacon
  desc: Node import-time beacon sends an obfuscated host profile through DNS
  crit: hostile
  conf: 0.995
  attack: "T1027,T1027.007,T1033,T1082,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: objectives/anti-static/obfuscation/encoding/numeric::node-charcode-host-profile-methods
  - id: objectives/anti-static/obfuscation/imports::hex-charcode-resolve4-method
  - id: dns-host-profile-array-join

- id: js-obfuscated-computed-host-profile-dns-beacon
  desc: Node beacon sends host profile through computed DNS
  crit: hostile
  conf: 0.995
  attack: "T1027.007,T1033,T1082,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: encoded-dnshook-canary
  - id: micro-behaviors/data/source/property/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat::js-dotted-variable-concat
  any:
  - id: host-profile-term-hostname
  - id: host-profile-term-userinfo
  - id: host-profile-term-username
  needs: 2

  # Package-level behavior: the install hook is the delivery context for the
  # import-time beacon. Keep this archive-scoped so package.json and the loaded
  # JavaScript may contribute evidence without requiring a literal file name.
- id: npm-install-obfuscated-host-profile-dns-beacon
  desc: NPM install hook activates an obfuscated host-profile DNS beacon
  crit: hostile
  conf: 0.998
  for: [npm, package.json, archives, javascript, typescript]
  scope: archive
  attack: "T1195.002,T1027.007,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::install-runs-node-local-script
  - id: js-obfuscated-host-profile-dns-beacon

  # Variant for packages that use an obfuscated computed resolver instead of
  # the numeric-array resolver method family above.
- id: npm-install-obfuscated-dns-label-beacon
  desc: NPM install hook activates an obfuscated DNS beacon
  crit: hostile
  conf: 0.998
  for: [npm, package.json, archives, javascript, typescript]
  scope: archive
  attack: "T1195.002,T1027.007,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::install-runs-node-local-script
  - id: js-obfuscated-computed-host-profile-dns-beacon

  # A release may split the DNS beacon across an install hook and a tiny
  # configuration/helper module.  An obfuscated CommonJS domain export is not
  # enough by itself; the package-level rule also requires registry evidence of
  # an install hook and the numeric-array decoder used to conceal the helper.
- id: npm-install-obfuscated-domain-helper
  desc: NPM install hook ships an obfuscated DNS-domain helper
  crit: hostile
  conf: 0.98
  for: [tar]
  # The install hook is represented by the fetched registry sidecar while the
  # helper lives inside the tarball, so package scope is required here.
  scope: package
  attack: "T1195.002,T1027.007,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: metadata/registry::registry-install-hook
  - id: objectives/anti-static/obfuscation/string/array::hex-array-near-indexed-charcode-decoder
  - id: micro-behaviors/data/source/property/identity::commonjs-domain-like-export

  # Install-time DNS beacon: install hook + DNS lookup + canary domain
- id: npm-install-dns-beacon
  desc: NPM install hook beacons via DNS canary
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: micro-behaviors/communications/dns/lookup/resolver::dns-lookup-call
  - id: encoded-dnshook-canary
  any:
  - id: hex-encode-dns-label
  - id: dns-lookup-with-canary-domain

  # DNS exfil with host profiling: install hook + DNS + hostname/userinfo
- id: npm-install-dns-host-profile-exfil
  desc: NPM install hook exfils host profile via DNS
  crit: hostile
  conf: 0.995
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: encoded-dnshook-canary
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  any:
  - id: hex-encode-dns-label
  - id: dns-lookup-with-canary-domain
  - id: micro-behaviors/communications/dns/lookup/resolver::dns-lookup-call

  # DNS exfil with IP discovery: install hook + DNS + ifconfig.me
- id: npm-install-dns-ip-exfil
  desc: NPM install hook discovers IP and exfils via DNS
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: encoded-dnshook-canary
  - id: micro-behaviors/communications/http/ip-discovery::ifconfig-me
  any:
  - id: hex-encode-dns-label
  - id: dns-lookup-with-canary-domain
- id: dns-lookup-with-canary-domain
  desc: DNS lookup targets canary domain service
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
  any:
  - id: dns-lookup-with-canary-domain--rx-1
  - id: dns-lookup-with-canary-domain--rx-2
  - id: dns-lookup-with-canary-domain--rx-3
  - id: dns-lookup-with-canary-domain--rx-4
  - id: dns-lookup-with-canary-domain--rx-7
  - id: dns-lookup-with-canary-domain--rx-8
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/presence/fixture::test-filename-pattern

# Import-time hex DNS label beacon to a canary/OAST host (no install hook required).
- id: js-hex-dns-canary-exfil
  desc: Hex-truncated DNS labels queried against a canary host
  crit: hostile
  conf: 0.97
  for: [javascript]
  all:
  - id: hex-encode-dns-label
  - id: dns-lookup-with-canary-domain
  any:
  - id: micro-behaviors/communications/dns/lookup/resolver::dns-resolve-call
  - id: micro-behaviors/communications/dns/lookup/resolver::dns-lookup-call
  - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
- id: npm-install-ships-hex-profile-dns-exfil
  desc: NPM install hook ships hex-obfuscated host-profile DNS exfiltration
  crit: hostile
  conf: 0.999
  for: [javascript, typescript, package.json, npm, archives]
  scope: archive
  attack: "T1195.002,T1027.013,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/exfiltration/dns/encoded::js-hex-host-profile-resolve4-exfil

# Package-level cleartext variant: a preinstall script loads a local JavaScript
# file that places victim identity fields directly into an A-record query. The
# file-level exfil rule proves the payload; this rule supplies install-time
# execution context across archive members.
- id: npm-preinstall-host-profile-dns-exfil
  desc: npm preinstall ships host-profile DNS exfiltration
  crit: hostile
  conf: 0.999
  for: [javascript, typescript, package.json, npm, archives]
  scope: archive
  attack: "T1195.002,T1048.003,T1082,T1033"
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/exfiltration/side-channel/dns::js-host-profile-dns-query

# The same install-time beacon pointed at the operator's own collector rather
# than a named service.
#
# Every canary marker above names a service -- burpcollaborator.net,
# interact.sh, oastify.com, dnshook.site -- so a package that resolves
# `analytics-<uuid>.cloud.example.rs` at install time matches none of them,
# though it is doing exactly the same thing. What survives when the service
# name is gone is the per-target label: the operator still needs each install
# to identify itself, and a UUID in the hostname is how that is spelled.
#
# Archive-scoped: the hook is declared in package.json and the lookup lives in
# the script it runs, so the two never meet in one file.
- id: npm-install-uuid-canary-dns-beacon
  desc: Install hook resolves a per-target canary host
  crit: hostile
  conf: 0.97
  for: [javascript, typescript, package.json, npm, archives]
  scope: archive
  attack: "T1195.002,T1048.003"
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
  - id: micro-behaviors/communications/dns/label::uuid-label-hostname
