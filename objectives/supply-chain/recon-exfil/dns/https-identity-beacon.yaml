# Install-time HTTPS beacons that encode host/user identity in the request
# hostname (DNS-style labeling over HTTPS). Operators often use a leading-dot
# apex suffix plus os.hostname()/username concatenation, then https.request to
# each derived FQDN — no DNS API is required for the leak to succeed.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1048.003,T1082,T1033"
  mbc: "E1041"

composite_rules:
  - id: js-https-identity-subdomain-beacon
    desc: HTTPS request uses OS identity as hostname label
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: micro-behaviors/data/string/concat::js-os-identity-label-concat
      - id: micro-behaviors/communications/http/url/domain::js-leading-dot-dns-suffix
      - id: micro-behaviors/communications/http/request/client::https-request

  - id: npm-preinstall-https-identity-subdomain-beacon
    desc: npm preinstall beacons host identity via HTTPS hostname
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1048.003,T1082,T1033"
    for: [javascript, package.json, archives, npm]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
      - id: js-https-identity-subdomain-beacon
