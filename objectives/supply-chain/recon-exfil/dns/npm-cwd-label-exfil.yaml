# npm hooks that hex-encode cwd, split it into legal DNS labels and resolve
# those labels as a query name. The per-sample domain is deliberately not part
# of the signature: any authoritative domain can receive the resolver query.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  attack: "T1048.003,T1082"
  mbc: "E1041"

traits:
  - id: preinstall-hex-encodes-cwd
    desc: Hex-encodes current working directory
    crit: suspicious
    conf: 0.96
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'Buffer\.from\(process\.cwd\(\)\)\.toString\(["'']hex["'']\)'

  - id: preinstall-splits-encoded-data-into-dns-labels
    desc: Splits data into 63-character DNS labels
    crit: suspicious
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '\.match\(/.{1,63}/g\)\.join\(["''][.]["'']\)'

  - id: preinstall-queries-dns-with-joined-labels
    desc: Resolves joined data as a DNS name
    crit: suspicious
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'dns\.lookup\(chunks\s*\+\s*["''][.][A-Za-z0-9.-]+'

composite_rules:
  - id: preinstall-hex-cwd-dns-exfil
    desc: Preinstall exfiltrates hex-encoded cwd through DNS
    crit: hostile
    conf: 0.99
    for: [package.json]
    attack: "T1195.002,T1048.003,T1082"
    all:
      - id: preinstall-hex-encodes-cwd
      - id: preinstall-splits-encoded-data-into-dns-labels
      - id: preinstall-queries-dns-with-joined-labels

  - id: npm-preinstall-hex-cwd-dns-exfil
    desc: npm preinstall exports cwd through encoded DNS labels
    crit: hostile
    conf: 0.99
    scope: package
    attack: "T1195.002,T1048.003,T1082"
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: preinstall-hex-cwd-dns-exfil
