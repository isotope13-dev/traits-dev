# A front-end package that snapshots the importing machine and posts it to a
# concealed log-ingestion endpoint without any lifecycle hook firing it.
#
# Sibling import-time beacons cover the fetch-from-entry and hidden-require
# shapes; this is the logging-transport shape — `logger.info(snapshot)` where
# the transport is winston-loggly-bulk and the token/subdomain are
# Base64-decoded at runtime. The module-scope zero-arg call is the trigger
# leg: a companion script collects and sends during `require`, so merely
# depending on the package (or running its `log:os` script) is enough. A real
# library's telemetry-on-import ships beside plaintext config and stays out
# via the decode leg; a bundled application's own logging stays out via the
# four-query-kinds profile leg, which ordinary app logging never assembles.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, tar]
  attack: T1195.002,T1041,T1082
  mbc: E1041
composite_rules:
  - id: npm-load-time-loggly-host-beacon
    desc: Load-time host snapshot beacon to Loggly
    conf: 0.96
    scope: archive
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-scope-zero-arg-call
      - id: micro-behaviors/os/sysinfo/profile::node-four-host-query-kinds
      - id: micro-behaviors/communications/http/services/loggly::loggly-transport-construction
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: "metadata/file/naming::test-directory-component"
