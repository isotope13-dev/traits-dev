defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
traits:
- id: oob-research-canary-marker-canary
  desc: Dependency canary marker
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)dep-canary
- id: oob-research-canary-marker-reward
  desc: Vulnerability reward marker
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)vulnerability reward
- id: oob-research-canary-marker-google
  desc: Google bughunters marker
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)bughunters\.google\.com
- id: pypi-fastly-host-override
  desc: PyPI Fastly Host header override
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: psec.forward.io.global.prod.fastly.net
- id: import-time-hello-beacon
  desc: Import-time HelloBeacon marker
  crit: notable
  conf: 0.94
  if:
    type: string_literal
    exact: HelloBeacon
- id: module-level-host-profile-oob-post
  desc: Module-scope host profile POST to OAST
  crit: notable
  conf: 0.97
  mbc: E1041
  attack: T1195.002,T1082,T1041
  if:
    type: tree-sitter
    language: python
    query: |
      ((module
          (expression_statement (assignment
            left: (identifier) @host_var
            right: (attribute
              object: (call
                function: (attribute
                  object: (identifier) @uname_object
                  attribute: (identifier) @uname_call)
                arguments: (argument_list))
              attribute: (identifier) @nodename)))
          (expression_statement (assignment
            left: (identifier) @cwd_var
            right: (call function: (attribute
              object: (identifier) @cwd_object
              attribute: (identifier) @cwd_call)
              arguments: (argument_list))))
          (expression_statement (assignment
            left: (identifier) @endpoint_var
            right: (string) @endpoint))
          (expression_statement (assignment
            left: (identifier) @profile_var
            right: (dictionary
              (pair key: (string (string_content) @host_key)
                value: (identifier) @profile_host)
              (pair key: (string (string_content) @cwd_key)
                value: (identifier) @profile_cwd))))
          (expression_statement (assignment
            right: (call
              function: (attribute
                object: (identifier) @client
                attribute: (identifier) @post_method)
              arguments: (argument_list . (identifier) @post_endpoint
                (keyword_argument
                  name: (identifier) @body_key
                  value: (identifier) @post_profile))))))
        (#eq? @uname_object "os")
        (#eq? @uname_call "uname")
        (#eq? @nodename "nodename")
        (#eq? @cwd_object "os")
        (#eq? @cwd_call "getcwd")
        (#match? @endpoint "^['\"]https?://[a-z0-9-]+\\.oastify\\.com")
        (#eq? @host_key "hostname")
        (#eq? @cwd_key "current_path")
        (#eq? @host_var @profile_host)
        (#eq? @cwd_var @profile_cwd)
        (#eq? @endpoint_var @post_endpoint)
        (#match? @client "^(requests|httpx)$")
        (#eq? @post_method "post")
        (#eq? @body_key "data")
        (#eq? @profile_var @post_profile))
