  - tar
  - tgz
  all:
  - id: metadata/package/entrypoint::npm-root-javascript-source-member
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/communications/http/request/client::module-execution-http-call
  any:
