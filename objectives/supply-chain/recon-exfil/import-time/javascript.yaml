# A JavaScript package whose entry module performs a bare network fetch at
# load. The dependency-confusion rules under supply-chain/impersonation/depconf
# convict the takeover angle (a scoped name the victim's resolver will prefer);
# this file states the beacon itself -- importing the package is the trigger,
# and the fetch is the whole payload. Hollow-package context is what keeps a
# real library's telemetry-on-import out: those ship code beside the call.
#
# Worked example: `@com-delta-idp/core` 1.0.0 -- an 85-byte entry that logs
# "Loaded!" and fetches `https://nexanet.ai/`, published to prove a namespace
# takeover.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, zip, tar]
  attack: T1195.002,T1071.001

composite_rules:
  # A package can implement the same import-time probe with Node's built-in
  # HTTPS client instead of fetch().  Keep the OAST host-profile operation on
  # one tiny JavaScript member, then join it to the manifest that appoints a
  # root JavaScript main.  "Attempts" is intentional: a typo elsewhere in the
  # module may stop the request at runtime without changing the shipped
  # supply-chain payload's purpose.
  - id: npm-entry-oast-host-profile-beacon
    desc: npm entrypoint attempts OAST host-profile beacon
    conf: 0.99
    attack: T1195.002,T1041,T1082
    mbc: E1041
    scope: archive
    all:
      - id: metadata/package/entrypoint::npm-root-javascript-source-member
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
      - id: objectives/exfiltration/oob/oast::javascript-oob-hostname-http-proximity
      - id: objectives/exfiltration/oob/callback::small-javascript-oob-contact
      - id: micro-behaviors/communications/http/url/build::http-url-template-literal
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/

  - id: js-entry-module-load-fetch-beacon
    desc: Package entry fetches external host on load
    conf: 0.93
    scope: archive
    all:
      # The fetch must BE the small entry module's body (size-bounded atom),
      # not merely a fetch call somewhere in the archive: a bare js-fetch-call
      # leg fires on any bundled HTTP client inside a large application
      # bundle (Kibana, VSCodium, TheBrain all ship thousands of deps with
      # fetch calls beside some small manifest), falsely describing the
      # package entry as a beacon.
      - id: objectives/supply-chain/impersonation/depconf::tiny-root-module-remote-fetch
      - id: metadata/package/freeform::pkg-skeleton-small
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry

  - id: npm-import-time-browser-oob-exfil
    desc: npm entry module exfiltrates browser data on import
    conf: 0.995
    attack: T1195.002,T1041
    scope: archive
    all:
      - id: metadata/package/entrypoint::npm-root-javascript-source-member
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
      - id: micro-behaviors/communications/http/request/json::module-execution-http-call
    any:
      - id: objectives/exfiltration/stealer/credential/browser::js-browser-cookie-oob-navigation-exfil
      - id: objectives/exfiltration/http/report::authenticated-response-oob-navigation-exfil
    needs: 1
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/

  - id: npm-import-time-hidden-telemetry-post
    desc: npm package posts host telemetry via hidden import-time require
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/process/create/load/local::cjs-caught-local-require
      - id: micro-behaviors/communications/http/request/client::node-http-request-end-body
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-version-access
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/os/sysinfo/platform/runtime::node-platform-method-call
    unless:
      - id: metadata/package/testing/presence/harness/
