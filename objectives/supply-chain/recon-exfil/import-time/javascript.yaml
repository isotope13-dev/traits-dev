defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - zip
  - tar
  attack: T1195.002,T1071.001
composite_rules:
- id: npm-import-time-host-user-oob-dns-query
  desc: npm entrypoint queries OOB DNS with hostname and user identity
  conf: 0.99
  attack: T1195.002,T1048.003,T1082,T1033
  mbc: E1041
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  - typescript
  all:
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup-with-oob-host-text
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
  unless:
  - id: metadata/package/testing/presence/harness/
- id: npm-entry-imports-detached-bun-git-install
  desc: npm entrypoint launches detached Bun Git install on import
  conf: 0.97
  attack: T1195.002,T1105,T1059.007
  scope: package
  for:
  - npm
  - package.json
  - javascript
  - tar
  - tgz
  all:
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/os/package-manager/runtime-install::bun-git-package-install-command
- id: npm-entry-imports-detached-npm-git-install
  desc: Entrypoint launches detached npm install
  conf: 0.97
  attack: T1195.002,T1105,T1059.007
  scope: package
  for:
  - npm
  - package.json
  - javascript
  - tar
  - tgz
  all:
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/os/package-manager/runtime-install::spawn-npm-install-command
- id: npm-entry-imports-helper-install-context-ip-post
  desc: npm entry imports helper that POSTs install context to IP
  conf: 0.98
  attack: T1195.002,T1041,T1082
  mbc: E1041
  scope: package
  for:
  - npm
  - package.json
  - javascript
  all:
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
  - id: objectives/supply-chain/recon-exfil/install-hook/recon::node-json-install-context-ip-http-post-file
  unless:
  - id: metadata/package/testing/presence/harness/
- id: js-entry-module-load-fetch-beacon
  desc: Package entry fetches external host on load
  conf: 0.93
  scope: archive
  all:
  - id: objectives/supply-chain/impersonation/depconf::tiny-root-module-remote-fetch
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
- id: npm-import-time-browser-oob-exfil
  desc: npm entry module exfiltrates browser data on import
  conf: 0.995
  attack: T1195.002,T1041
  scope: archive
  all:
  - id: metadata/package/entrypoint::npm-root-javascript-source-member
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/communications/http/request/client::module-execution-http-call
  any:
  - id: objectives/exfiltration/stealer/application-state/cookie::js-browser-cookie-oob-navigation-exfil
  - id: objectives/exfiltration/http/report::authenticated-response-oob-navigation-exfil
  needs: 1
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/tool/detection/
- id: npm-import-time-browser-cookie-exfil
