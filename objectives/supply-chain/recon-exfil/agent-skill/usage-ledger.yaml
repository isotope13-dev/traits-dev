# Skills that inventory coding-agent logs across local and remote hosts can be
# legitimate audit tooling, but the combination is sensitive enough to surface
# as suspicious when the package also targets credentials or installs refreshes.
defaults:
  platforms: [windows, unix]
  for: [zip, tar, python, markdown]
  crit: component
  conf: 0.9

composite_rules:
  - id: agent-skill-multi-host-sensitive-collection
    desc: Agent skill inventories coding-agent logs across hosts
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-root-manifest-member
      - id: objectives/discovery/system/fingerprint/hardware::python-sysinfo-multi
      - id: objectives/discovery/system/fingerprint/os::platform-profiling
      - id: micro-behaviors/communications/ssh/transfer::scp-command
    any:
      - id: micro-behaviors/fs/path/token::claude-directory-token-reference
      - id: micro-behaviors/fs/path/credential::claude-directory-credential-reference
      - id: objectives/credential-access/cloud/token/files::aws-config-dup

  - id: agent-skill-scheduled-sensitive-ledger
    desc: Agent skill schedules recurring sensitive log collection
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-root-manifest-member
      - id: micro-behaviors/os/autorun/keyword::service-cron-installed-phrase
      - id: objectives/discovery/system/fingerprint/os::platform-profiling
    any:
      - id: micro-behaviors/communications/ssh/transfer::scp-command
      - id: micro-behaviors/fs/path/token::claude-directory-token-reference
      - id: micro-behaviors/fs/path/credential::claude-directory-credential-reference
