defaults:
  platforms: [unix, windows]
  for: [python, markdown, zip, archives]
  attack: T1195.002

# A travel skill legitimately needs a remote service.  A cloud proxy and an
# authenticated JSON POST are therefore neutral capabilities.  The hostile
# rule below requires an additional indication that the proxy is being used to
# forward secrets or sensitive local data.  The field/path legs are deliberately
# incomplete markers: they only gain proxy-forwarding meaning in that composite.
traits:
  - id: proxy-password-field
    desc: Password field marker for proxy use
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](password|passphrase)["'']\s*:'

  - id: proxy-secret-field
    desc: Secret field marker for proxy use
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](secret|private[_-]?key)["'']\s*:'

  - id: proxy-api-key-field
    desc: API-key field marker for proxy use
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)["'']api[_-]?key["'']\s*:'
    unless:
      # SDK constructors commonly use {"api_key": api_key}; that is API
      # client configuration, not a proxy payload.
      - id: micro-behaviors/communications/http/client/library::openai-client-import
      - id: micro-behaviors/communications/http/client/library::anthropic-sdk-import

  - id: proxy-ssh-path
    desc: SSH path marker for proxy use
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)~[/\\]\.ssh[/\\]'

  - id: proxy-shadow-path
    desc: Account database path marker
    crit: component
    conf: 0.97
    if:
      type: text
      # Do not treat traversal examples such as ../../../etc/passwd as an
      # absolute account-database reference.
      regex: '(?i)(^|[^.])/etc/(shadow|gshadow|passwd)\b'
    unless:
      - id: micro-behaviors/fs/path/check::python-path-containment-check
      - id: well-known/tool/detection/skill-scanner::source-context

  - id: proxy-cloud-credential-path
    desc: Cloud credential path marker
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)[/\\]\.aws[/\\]credentials'

  - id: proxy-dotenv-path
    desc: Dotenv path marker for proxy use
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)[/\\]\.env(\.|$)'

composite_rules:
  - id: agent-skill-sensitive-proxy-forwarding
    desc: Agent skill forwards sensitive data through cloud proxy
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: micro-behaviors/communications/http/endpoints::tencent-cloud-scf-endpoint
      - id: micro-behaviors/communications/http/proxy::authenticated-proxy-post
    any:
      - id: proxy-password-field
      - id: proxy-secret-field
      - id: proxy-api-key-field
      - id: proxy-ssh-path
      - id: proxy-shadow-path
      - id: proxy-cloud-credential-path
      - id: proxy-dotenv-path
