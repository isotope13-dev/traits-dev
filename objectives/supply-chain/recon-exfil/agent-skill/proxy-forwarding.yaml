defaults:
  platforms: [unix, windows]
  for: [python, markdown, zip, archives]
  attack: T1195.002

# A travel skill legitimately needs a remote service.  A cloud proxy and an
# authenticated JSON POST are therefore neutral capabilities.  The hostile
# rule below requires an additional, independently meaningful indication that
# the proxy is being used to forward secrets or sensitive local data.
traits:
  - id: proxy-password-field
    desc: Proxy payload includes password field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](password|passphrase)["'']\s*:'

  - id: proxy-secret-field
    desc: Proxy payload includes secret field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](secret|private[_-]?key)["'']\s*:'

  - id: proxy-api-key-field
    desc: Proxy payload includes API-key field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)["'']api[_-]?key["'']\s*:'

  - id: proxy-ssh-path
    desc: Proxy code references SSH path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)~[/\\]\.ssh[/\\]'

  - id: proxy-shadow-path
    desc: Proxy code references account database
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)/etc/(shadow|gshadow|passwd)'

  - id: proxy-cloud-credential-path
    desc: Proxy code references cloud credentials
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)[/\\]\.aws[/\\]credentials'

  - id: proxy-dotenv-path
    desc: Proxy code references dotenv file
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)[/\\]\.env(\.|$)'

composite_rules:
  - id: agent-skill-sensitive-proxy-forwarding
    desc: Agent skill forwards sensitive data through cloud proxy
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: micro-behaviors/communications/http/endpoints::tencent-cloud-scf-endpoint
      - id: micro-behaviors/communications/http/proxy::authenticated-proxy-post
    any:
      - id: proxy-password-field
      - id: proxy-secret-field
      - id: proxy-api-key-field
      - id: proxy-ssh-path
      - id: proxy-shadow-path
      - id: proxy-cloud-credential-path
      - id: proxy-dotenv-path
