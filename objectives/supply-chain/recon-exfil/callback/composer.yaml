# Composer install callbacks to purpose-built OOB collectors reveal that a
# dependency reached a victim. Requiring a quiet curl invocation in the same
# manifest separates the attack chain from documentation and endpoint tests.
defaults:
  platforms: [unix, windows]
  for: [composer.json]
  attack: T1195.002

composite_rules:
  - id: composer-silent-post-install-oob-callback
    desc: Composer post-install silently calls OOB collector
    crit: hostile
    conf: 0.99
    mbc: E1041
    attack: "T1195.002,T1041"
    all:
      - id: objectives/exfiltration/oob/endpoint::composer-post-install-webhook-site
      - id: micro-behaviors/communications/http/download/curl::curl-silent-fail-flags-embedded-text
