defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: npm-install-hook-oob-callback
  desc: npm install hook contacts an OOB callback service
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  mbc: E1041
  for: [archives]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
  - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/client::https-get
  unless:
  - id: metadata/package/testing/presence/harness/

- id: npm-install-hook-id-oob-query
  desc: npm install hook runs id and reports to an OOB service
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1033,T1041
  mbc: E1041
  for: [archives]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
  - id: micro-behaviors/process/user/query::node-shell-id-command
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/client::https-get
  unless:
  - id: metadata/package/testing/presence/harness/
- id: depconf-beacon-package
  desc: Dependency confusion beacon with HTTPS callback
  crit: suspicious
  conf: 0.92
  attack: T1195.002
  for:
  - javascript
  all:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: metadata/file/metrics::javascript-small-file-5k
  any:
  - id: micro-behaviors/data/control-flow/module-exec::module-empty-export
  - id: metadata/package/dependencies/manifest::npm-no-deps-at-all
  - id: objectives/supply-chain/impersonation/manifest/attack-label::placeholder-poc-or-squat-claim
  needs: 2
- id: npm-preinstall-oob-host-profile
  desc: npm preinstall sidecar exfiltrates host profile to OOB endpoint
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041, T1082"
  mbc: E1041
  for: [npm]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::multiple-install-hooks
  - id: objectives/exfiltration/oob/oast::javascript-oob-hostname-http-proximity
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  any:
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
  - id: micro-behaviors/os/env/vars/cicd/
  needs: 1
- id: depconf-preinstall-oob-callback-package
  desc: Dependency confusion package preinstall phones home to OOB endpoint
  crit: hostile
  conf: 0.98
  attack: "T1195.002, T1048"
  mbc: E1041
  for:
  - npm
  - tgz
  all:
  - id: objectives/supply-chain/recon-exfil/registry/probe::dependency-confusion-description
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
  - id: objectives/exfiltration/oob/oast::javascript-oob-hostname-http-proximity
