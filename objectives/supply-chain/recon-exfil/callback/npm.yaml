# The Accenture impersonation campaign reuses this Azure Websites callback
# across npm placeholder packages. Its known malicious role is corroborated by
# OSV MAL-2026-17872 (published 2026-10-13): the package sends host identity
# to accenture-npm.azurewebsites.net on import. Keep the IOC tied to the code
# data path; an Azure Websites reference by itself is ordinary cloud-service
# metadata. Empty lifecycle hooks are not execution.
- id: npm-accenture-host-identity-callback
  desc: Host-identity GET to known campaign callback
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041
  for: [npm, tar, tgz, package.json, javascript]
  scope: archive
  all:
  - id: micro-behaviors/communications/http/telemetry::node-accenture-npm-host-identity-get-query
  - id: metadata/package/versioning/scheme::package-version-shape-profile
