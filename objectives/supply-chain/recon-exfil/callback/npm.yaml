  - id: micro-behaviors/data/encode/base64::node-json-base64-with-host-query
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component

- id: npm-install-hook-id-oob-query
