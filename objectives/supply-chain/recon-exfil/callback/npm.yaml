defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: npm-postinstall-host-install-metadata-beacon
  desc: npm postinstall sends host and install metadata to a remote endpoint
  crit: suspicious
  conf: 0.96
  attack: "T1195.002,T1082,T1041"
  for: [npm, tar, zip, package.json, javascript, markdown]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
  - id: micro-behaviors/os/sysinfo/hostname::node-inline-os-hostname-call
  - id: micro-behaviors/fs/path/self::script-directory-install-path-field
  - id: micro-behaviors/communications/http/request/client::node-http-alias-request-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/description/disclosure::readme-authorized-dependency-confusion-test

- id: npm-import-time-host-install-metadata-beacon
  desc: npm module import sends host and install metadata to a remote endpoint
  crit: suspicious
  conf: 0.96
  attack: "T1195.002,T1082,T1041"
  for: [npm, tar, zip, package.json, javascript, markdown]
  scope: archive
  all:
  - id: micro-behaviors/os/module/require::cjs-caught-local-require
  - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
  - id: micro-behaviors/os/sysinfo/hostname::node-inline-os-hostname-call
  - id: micro-behaviors/fs/path/self::script-directory-install-path-field
  - id: micro-behaviors/communications/http/request/client::node-http-alias-request-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/description/disclosure::readme-authorized-dependency-confusion-test

- id: npm-preinstall-base64-host-profile-get
  desc: npm preinstall GET exfiltrates Base64 host profile
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082
