defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: npm-install-hook-oob-callback
  desc: npm install hook contacts an OOB callback service
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  mbc: E1041
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  any:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/communications/http/request/client::http-get-dup
  needs: 1
  unless:
  - id: metadata/package/testing/presence/harness/

  - id: "metadata/file/naming::test-directory-component"
- id: npm-install-hook-id-oob-query
  desc: npm install hook runs id and reports to an OOB service
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1033,T1041
  mbc: E1041
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/process/user/query::node-shell-id-command
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/client::https-get
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
- id: depconf-beacon-package
  desc: Dependency confusion beacon with HTTPS callback
  crit: suspicious
  conf: 0.92
  attack: T1195.002
  for:
  - javascript
  all:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: metadata/file/size::javascript-small-file-5k
  any:
  - id: micro-behaviors/data/control-flow/module-exec::module-empty-export
  - id: metadata/package/dependencies/manifest/presence::npm-no-deps-at-all
  - id: objectives/supply-chain/impersonation/manifest/attack-label::placeholder-poc-or-squat-claim
  needs: 2
- id: npm-preinstall-oob-host-profile
  desc: npm preinstall sidecar exfiltrates host profile to OOB endpoint
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041, T1082"
  mbc: E1041
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/oob/oast::javascript-oob-hostname-http-proximity
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  any:
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
  - id: micro-behaviors/os/env/cicd/
  needs: 1
  unless:
  - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference
  # Identical evidence to
  # objectives/supply-chain/recon-exfil/registry/probe::dependency-confusion-preinstall-oob-callback,
  # which owns this detection (using the shared manifest disclosure
  # observation) -- deleted here rather than merged, since both fired the same
  # finding twice.

- id: depconf-preinstall-base64-host-profile
  desc: Dependency-confusion npm preinstall exfiltrates base64 host profile
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
  mbc: E1041
  for: [npm, tgz, package.json, javascript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: objectives/supply-chain/recon-exfil/oast/secret::node-json-base64-profile-payload
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  any:
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: objectives/supply-chain/install-hook/package/manifest::fake-security-research
- id: npm-postinstall-oob-host-profile-beacon
  desc: npm postinstall OOB callback carries host profile
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  mbc: E1041
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: objectives/exfiltration/oob/oast::javascript-oob-hostname-http-proximity
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
- id: npm-preinstall-oast-dns-https-callback
  desc: npm preinstall DNS and HTTPS OAST callback
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1048.003
  mbc: E1041
  for: [npm, tar, package.json, javascript, typescript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/dns/resolver::require-dns-inline-lookup
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/inline::node-require-https-inline-get
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/file/naming::test-directory-component
- id: npm-disclosed-depconf-preinstall-oast-beacon
  desc: Disclosed dependency-confusion preinstall OAST beacon
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1048.003
  mbc: E1041
  for: [npm, tar, package.json, javascript, typescript]
  scope: archive
  all:
  - id: npm-preinstall-oast-dns-https-callback
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/file/naming::test-directory-component
- id: npm-disclosed-depconf-postinstall-beacon
  desc: Disclosed dependency-confusion install OOB beacon
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  mbc: E1041
  for: [npm, tar, package.json, javascript, markdown]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
  - id: micro-behaviors/os/sysinfo/hostname::node-inline-os-hostname-call
  any:
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/description/disclosure::readme-authorized-dependency-confusion-test
  needs: 1
  unless:
  - id: metadata/package/testing/presence/harness/
  # README-only "authorized depconf test" prose with a generic shim description
  # is a common typosquat cover; keep the install IP beacon composites instead.
  - id: metadata/package/description/disclosure::desc-compatibility-shim-placeholder
  - id: metadata/package/description/disclosure::npm-archive-compatibility-shim-description
  - id: "metadata/file/naming::test-directory-component"
- id: npm-install-http-post-oob-host-profile
  desc: npm install hook POSTs JSON host profile to OOB HTTP
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  mbc: E1041
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/declaration::package-install-hook-present
  - id: micro-behaviors/communications/url/host::oob-dot-subdomain-host
  - id: micro-behaviors/data/config/schema::javascript-host-port-object
  - id: micro-behaviors/communications/http/request/body::req-write
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
