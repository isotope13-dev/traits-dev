defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]
  attack: T1195.002

composite_rules:
  - id: postinstall-webhook-beacon-localhost-write
    desc: Postinstall beacons to webhook, probes localhost, writes back
    crit: hostile
    conf: 0.97
    scope: archive
    mbc: B0024
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path
      - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
      - id: micro-behaviors/communications/http/put::javascript-put-request-body
