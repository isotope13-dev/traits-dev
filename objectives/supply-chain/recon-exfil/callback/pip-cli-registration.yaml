# A pip CLI that enrolls the machine on first run: it POSTs the hostname and
# platform to a remote `/api/cli/init` endpoint and writes the server-issued
# apiKey into a hidden config file, so every later invocation authenticates
# to the operator.
#
# Each leg is ordinary on its own — installers query the platform, CLIs keep
# tokens in dotfiles. What is not ordinary is the set in one module: a
# hardcoded CLI bootstrap endpoint beside a hostname read, a POST, and an
# apiKey serialized to a hidden config. A legitimate device-enrollment flow
# (browser OAuth, user-typed token) never assembles this shape; the server
# hands the credential out for the mere fact of first execution. Scope stays
# `file` so a large application bundle cannot satisfy the legs from unrelated
# modules. The seapy family rule owns the lineage attribution; this states
# the enrollment behavior itself.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1195.002,T1041,T1082
  mbc: E1041
composite_rules:
  - id: pip-cli-first-run-registration-beacon
    desc: CLI first-run registration stores API key
    conf: 0.95
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/url/telemetry::python-cli-init-api-path
      - id: micro-behaviors/os/sysinfo/hostname::python-os-uname-nodename
      - id: micro-behaviors/communications/http/request/verb::python-post-method-keyword
      - id: micro-behaviors/data/serialize/schema-credential::api-key-field-name
      - id: micro-behaviors/data/serialize/object::json-dump
      - id: micro-behaviors/fs/path/config/app::hidden-app-config-json
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
