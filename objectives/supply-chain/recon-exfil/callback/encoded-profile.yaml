defaults:
  platforms: [unix, windows]
  for: [vsix, package.json, javascript, typescript]
composite_rules:
  - id: vscode-startup-encoded-profile-query
    desc: Startup extension contains encoded host-profile query collection
    crit: suspicious
    conf: 0.94
    attack: T1195.002,T1041
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: metadata/permission/activation::on-startup-finished
    any:
      - id: objectives/exfiltration/stealer/system-info/profile::base64-env-profile-fetch-query
      - id: objectives/exfiltration/stealer/system-info/profile::xor-host-profile-query
