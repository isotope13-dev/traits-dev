# Install-time "IP lookup" beacon: the package presents itself as an IP
# location helper, declares a preinstall hook that runs its own script, and
# that script requests a remote `.php` endpoint with an `ip=` query. The lookup
# is a pretext; the request reaching the operator's server at install time is
# the callback, and it discloses the installing host's egress address.
#
# Worked example: `@mntv-analysis/ui-components` 50.1.1 requesting
# `realwbx.com/ip.php?ip=...` from `preinstall: node index.js`.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  attack: T1195.002,T1071.001

composite_rules:
  - id: preinstall-node-script-php-ip-lookup-callback
    desc: Preinstall script requests remote PHP endpoint with ip parameter
    crit: hostile
    conf: 0.88
    scope: archive
    mbc: B0024
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
      - id: micro-behaviors/communications/http/telemetry::public-ip-report-parameter
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
