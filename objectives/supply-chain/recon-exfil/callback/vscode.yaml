defaults:
  platforms: [unix, windows, macos]
  for: [vsix-archive, javascript, typescript, package.json]
  attack: "T1195.002,T1041,T1082"
  mbc: E1041

composite_rules:
  - id: vscode-startup-obfuscated-host-profile-beacon
    desc: VS Code startup extension exfiltrates an obfuscated host profile
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/permission/activation::main-extension-js
      - id: objectives/supply-chain/hidden-payload/runtime::obfuscated-vscode-host-network-argument-vector
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/os/module/load::node-global-os-module-exposure
      - id: micro-behaviors/communications/http/module/load::node-global-https-module-exposure
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
      - id: micro-behaviors/data/encode/payload::large-encoded-blob-literal

  - id: vscode-startup-oob-hostname-beacon
    desc: VS Code startup extension beacons host identity
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/permission/activation::on-startup-finished
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
    any:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/computed-url::node-https-get-concatenated-url
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
  # HTTP POST + hardcoded host must live in the same extension source file as
  # require('vscode'). Archive-scoped pooling previously combined a bundled
  # extension's package.json activation with unrelated backend API clients
  # (NVIDIA/Cursor adapters) that also POST to hardcoded hosts.
  - id: vscode-extension-source-hardcoded-post
    desc: Extension source POSTs to a hardcoded host
    crit: notable
    conf: 0.95
    attack: T1041
    for: [javascript, typescript]
    all:
      - id: metadata/library/vscode::require-vscode
      - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
      - id: micro-behaviors/data/control-flow/error-handling::empty-optional-catch-text
  - id: vscode-startup-hardcoded-post-beacon
    desc: VS Code startup extension POSTs beacon to hardcoded host
    crit: hostile
    conf: 0.98
    attack: T1041,T1195.002
    scope: archive
    unless:
      - id: well-known/app/development/vscode-extension/auto-retry-agent::disclosed-summary-backend
      - id: well-known/app/development/vscode-extension/auto-retry-agent::auto-retry-package-identity
    all:
      - id: metadata/permission/activation::on-startup-finished
      - id: vscode-extension-source-hardcoded-post
    # Version/publisher telemetry to a collector is not host profiling. Require
    # at least one forbidden identity field the editor's own telemetry omits.
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: metadata/library/vscode::machine-id
    needs: 1
  - id: vscode-syntax-facade-startup-beacon
    desc: Fake syntax VS Code extension beacons on startup
    crit: hostile
    conf: 0.97
    attack: T1036,T1041,T1195.002
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/extensions::vscode-syntax-facade-no-grammar
      - id: metadata/permission/activation::on-startup-finished
      - id: vscode-extension-source-hardcoded-post
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: metadata/library/vscode::machine-id
    needs: 1
  - id: vscode-startup-install-id-profile-beacon
    desc: VS Code startup extension POSTs a persistent host profile
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: metadata/permission/activation::on-startup-finished
      - id: metadata/library/vscode::vscode-extension-marker
      - id: metadata/import/builtin::require-http
      - id: metadata/import/builtin::require-https
      - id: micro-behaviors/process/user/query::node-os-alias-homedir-call
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
      - id: micro-behaviors/data/serialize/json::identity-platform-json-payload

  # Evil-twin / telemetry-disguised editor extensions that harvest git remotes
  # and CI/cloud-dev project identifiers, then POST the profile over HTTPS.
  - id: vscode-git-ci-identity-http-exfil
    desc: VS Code extension POSTs git remotes and CI project identity
    crit: hostile
    conf: 0.98
    attack: "T1041,T1082,T1195.002"
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/fs/path/sensitive/credentials::git-repository-config-file
      - id: micro-behaviors/os/env/vars/cicd::node-multi-ci-project-identity
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
    any:
      - id: micro-behaviors/fs/path/config/git::git-repository-head-path
      - id: metadata/library/vscode::machine-id
      - id: micro-behaviors/communications/http/user-agent::vscode-ext-metrics-user-agent
    unless:
      - id: metadata/library/github-actions::actions-sdk

  # Takedown contingency: resolveTxt('_beacon.' + apex) then parse base=https://
  # and continue HTTP beaconing to the recovered collector.
  - id: vscode-dns-txt-beacon-url-failover
    desc: VS Code extension recovers beacon URL from _beacon DNS TXT
    crit: hostile
    conf: 0.98
    attack: "T1071.004,T1102,T1195.002"
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/communications/dns/lookup/txt::node-txt-lookup
      - id: micro-behaviors/communications/dns/label::dns-txt-beacon-label-prefix
      - id: micro-behaviors/communications/dns/label::dns-txt-base-https-prefix
    any:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body

  # Durable form of the beacon above, independent of any one campaign's
  # User-Agent. machineId is the identifier the editor sanctions for telemetry;
  # the real OS hostname and the real OS username are the two fields telemetry
  # guidance forbids. An extension that reads the sanctioned id *and* both
  # forbidden ones, then ships them to a hardcoded collector, is profiling the
  # host rather than measuring the product — which is what separates this from
  # an extension that merely reports usage.
  - id: vscode-activation-host-identity-beacon
    desc: Extension sends machine id, hostname and OS user
    crit: suspicious
    conf: 0.94
    attack: "T1041,T1082,T1195.002"
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: metadata/library/vscode::machine-id
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body

  # Durable form of the failover above. vscode-dns-txt-beacon-url-failover
  # keys on the `_beacon.` label and the `base=https://` record body, both of
  # which an operator can rename for free. An editor extension has no ordinary
  # reason to resolve TXT records at all, so pairing any TXT lookup with an
  # HTTP client keeps the technique in scope after a relabel. Held at
  # suspicious because a DNS-tooling extension is a real, if uncommon, match.
  - id: vscode-dns-txt-endpoint-recovery
    desc: Extension resolves TXT records and calls out
    crit: suspicious
    conf: 0.9
    # This chain happens inside one extension source file, so drop the
    # archive type inherited from `defaults:`. Evaluated at an archive root
    # the legs pool across unrelated members — a bundled `@grpc/grpc-js`
    # resolver supplies the TXT lookup while `vscode-languageclient`
    # supplies the extension marker, which fires on any extension that
    # ships node_modules.
    for: [javascript, typescript]
    attack: "T1071.004,T1102,T1195.002"
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/communications/dns/lookup/txt::node-txt-lookup
    any:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body

  # Lightweight hostname beacon disguised as extension metrics telemetry.
  - id: vscode-metrics-ua-host-beacon
    desc: VS Code extension beacons hostname with vscode-ext-metrics User-Agent
    crit: suspicious
    conf: 0.96
    attack: "T1041,T1082,T1195.002"
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/communications/http/user-agent::vscode-ext-metrics-user-agent
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
