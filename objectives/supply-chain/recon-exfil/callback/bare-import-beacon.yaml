# Import-time beacons from dependency-confusion placeholders that carry no
# install hook. The payload runs when the module loads (a top-level call on
# the required HTTPS client), reports to a hardcoded external host, and
# swallows every error so a failed callback never breaks the install. The
# bare variant below convicts the beacon alone; the identity variant convicts
# when the beacon also carries the machine owner.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1071.001

composite_rules:
  - id: depconf-bare-import-beacon
    desc: Placeholder package beacons to external host at import
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
      - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
    # Corroboration only: the version marker and placeholder wording are
    # attacker-chosen, so they never gate, but one must agree that this is
    # a hollow placeholder rather than a real client library phoning home.
    any:
      - id: metadata/package/versioning/scheme::npm-multidigit-major-starting-nine
      - id: objectives/supply-chain/impersonation/manifest/attack-label::placeholder-poc-or-squat-claim
      - id: metadata/package/description/function::description-simple
    needs: 1
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/naming::test-directory-component
