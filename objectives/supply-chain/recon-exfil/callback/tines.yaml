defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002
  mbc: E1041
traits:
  - id: tines-apps-import
    desc: Tines apps package import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: "@tines/apps"
composite_rules:
  - id: tines-package-endpoint-exploit
    desc: Package invokes Tines endpoint exploit
    crit: hostile
    conf: 0.965
    all:
      - id: tines-apps-import
      - id: micro-behaviors/communications/http/request/client::invoke-endpoint-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/data/control-flow/dispatch::js-exploit-named-function-call

  - id: tines-endpoint-oob-callback
    desc: Tines endpoint result sent to OOB callback
    crit: hostile
    conf: 0.98
    all:
      - id: tines-apps-import
      - id: micro-behaviors/communications/http/request/client::invoke-endpoint-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/data/control-flow/dispatch::js-exploit-named-function-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
