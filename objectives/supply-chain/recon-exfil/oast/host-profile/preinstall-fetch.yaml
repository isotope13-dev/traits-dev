# Detect npm install-hook payloads that beacon via fetch() to OAST/Collaborator
# endpoints (e.g. ZivyeLab collaborator hosts used in bug-bounty PoC drops).
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  attack: T1195.002
  mbc: E1041

composite_rules:
  # Archive-scope: lifecycle hook runs a local Node script that also beacons
  # to a known OOB/collaborator endpoint — classic install-time reachability PoC.
  - id: npm-preinstall-node-fetch-oob-beacon
    desc: npm preinstall Node script beacons to OOB endpoint
    conf: 0.97
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/coding-agent/omnius/

  # Preinstall sidecar that DNS-label-beacons and HTTPS GETs an OAST host
  # (dependency-confusion reachability probes without fetch() or hostname reads).
  - id: npm-preinstall-dns-https-oob-beacon
    desc: npm preinstall DNS and HTTPS OOB beacon
    conf: 0.98
    attack: T1195.002,T1048
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: objectives/supply-chain/recon-exfil/dns::dns-lookup-with-canary-domain
      - id: micro-behaviors/communications/http/request/client::node-https-get-dynamic
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/coding-agent/omnius/

  # Same surface labeled as research/PoC in the manifest — still an install-time
  # hostile beacon, not a legitimate dependency.
  - id: npm-poc-preinstall-oob-beacon
    desc: PoC-labeled package beacons to OOB via preinstall
    conf: 0.96
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: metadata/package/description/disclosure::description-mentions-poc
      - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/

  # Local preinstall script that collects hostname + userInfo and POSTs them to
  # an OAST/collaborator endpoint (e.g. oastify.com). Distinct from bare OOB
  # reachability beacons: this is host-profile recon exfiltration.
  - id: npm-preinstall-fetch-host-profile-oob
    desc: npm preinstall fetch POSTs host/user profile to OOB
    conf: 0.98
    attack: T1195.002,T1041,T1082,T1033
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/coding-agent/omnius/

  # Same host-profile fetch beacon on the script itself, so a nested
  # preinstall.js is hostile even when scanned without the npm manifest.
  - id: js-fetch-host-profile-oob
    desc: Fetch POSTs host-user profile to OOB
    conf: 0.98
    attack: T1041,T1082,T1033
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/coding-agent/omnius/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/opena2a-arp/

  # postinstall runs a local script that GETs a hostname profile (often as
  # base64 JSON) through an ngrok-free tunnel.
  - id: npm-postinstall-ngrok-host-profile-get-beacon
    desc: npm postinstall GET beacons hostname to ngrok tunnel
    conf: 0.98
    attack: T1195.002,T1041,T1082
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/get::node-https-get-text
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/communications/url/host::ngrok-free-domain
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: dependency-confusion-postinstall-ngrok-beacon
    desc: Dependency-confusion package postinstall beacons to ngrok
    conf: 0.98
    attack: T1195.002,T1041,T1082
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: metadata/package/description/disclosure::desc-dependency-confusion
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/http/get::node-https-get-text
      - id: micro-behaviors/communications/url/host::ngrok-free-domain
    unless:
      - id: metadata/package/testing/harness/runtime/
