defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  attack: T1195.002
  mbc: E1041

composite_rules:
- id: npm-poc-preinstall-oob-beacon
  desc: PoC-labeled package beacons to OOB via preinstall
  conf: 0.96
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  unless:
  - id: metadata/package/testing/harness/runtime/

  # Local preinstall script that collects hostname + userInfo and POSTs them to
  # an OAST/collaborator endpoint (e.g. oastify.com). Distinct from bare OOB
  # reachability beacons: this is host-profile recon exfiltration.
- id: npm-postinstall-ngrok-host-profile-get-beacon
  desc: npm postinstall GET beacons hostname to ngrok tunnel
  conf: 0.98
  attack: T1195.002,T1041,T1082
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/communications/url/host::ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/

- id: dependency-confusion-postinstall-ngrok-beacon
  desc: Dependency-confusion package postinstall beacons to ngrok
  conf: 0.98
  attack: T1195.002,T1041,T1082
  scope: archive
  for: [npm, package.json, javascript]
  all:
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/url/host::ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/
