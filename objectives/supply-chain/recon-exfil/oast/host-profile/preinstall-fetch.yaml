defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
  attack: T1195.002
  mbc: E1041

composite_rules:
- id: npm-poc-preinstall-oob-beacon
  desc: PoC-labeled package beacons to OOB via preinstall
  conf: 0.96
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  unless:
  - id: metadata/package/testing/harness/runtime/

  # Postinstall POST of a hashed host fingerprint to a tunnel endpoint.
- id: npm-postinstall-fingerprint-post-to-tunnel
  desc: npm postinstall hook POSTs device fingerprint to tunnel
  conf: 0.97
  attack: T1195.002,T1041,T1082
  scope: archive
  for: [npm, package.json, javascript, typescript]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/post::fetch-flow-json-post-body
  - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
  - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/
