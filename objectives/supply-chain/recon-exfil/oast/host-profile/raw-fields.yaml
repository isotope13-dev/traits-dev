defaults:
  platforms: [unix, windows]
  for: [shell, package.json]

traits:
- id: oast-pro-callback-raw
  desc: Raw content references oast.pro callback
  crit: suspicious
  conf: 0.97
  attack: "T1048.003"
  if:
    type: text
    regex: '[a-z0-9]{8,64}\.oast\.pro\b'

# NOTE: the user/home/pwd field captures are plain shell assignments -- a
# Claude Code statusline config that prints `user=$(whoami)` matched a trait
# described as "raw lifecycle content posts user field" even though nothing
# is posted and there is no lifecycle script. They are now neutral capture
# capabilities in micro-behaviors/process/user/query; the recon-exfil intent
# comes from combining several of them (and, for the hostile rule, oast.pro).

composite_rules:
- id: preinstall-host-profile-fields
  desc: Preinstall collects multiple host profile fields
  crit: suspicious
  conf: 0.985
  attack: "T1082"
  all:
  - id: micro-behaviors/process/user/query::shell-user-field-capture
  - id: micro-behaviors/process/user/query::shell-pwd-field-capture
  any:
  - id: micro-behaviors/process/user/query::shell-capture-numeric-uid
  - id: micro-behaviors/process/user/query::shell-home-field-capture
- id: npm-preinstall-oast-pro-host-recon
  desc: npm preinstall exfiltrates host profile to oast.pro
  crit: hostile
  conf: 0.997
  attack: "T1041"
  mbc: "E1041"
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall-raw
  - id: objectives/supply-chain/recon-exfil/oast/secret::data-urlencode
  - id: oast-pro-callback-raw
  - id: micro-behaviors/process/user/query::shell-user-field-capture
  - id: micro-behaviors/process/user/query::shell-pwd-field-capture
  - id: micro-behaviors/process/user/query::shell-capture-numeric-uid
  any:
  - id: micro-behaviors/process/user/query::shell-home-field-capture
