# A package whose preinstall hook runs a local Node script that POSTs host
# identity (hostname, user, home, resolver list) to an out-of-band callback
# service.  Install-time execution plus the host-profile beacon is the
# dependency-confusion probe regardless of which collaborator service or
# package label it uses.
defaults:
  platforms: [windows, unix]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  - id: npm-preinstall-node-script-host-recon-to-oob
    desc: preinstall Node script posts host identity to OOB service
    crit: hostile
    conf: 0.96
    scope: archive
    for: [javascript, typescript, package.json, npm]
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: objectives/exfiltration/oob/callback::oob-service-http-host-recon
    unless:
      - id: metadata/package/testing/harness/runtime/
