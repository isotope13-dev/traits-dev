# A package whose preinstall hook runs a local Node script that POSTs host
# identity (hostname, user, home, resolver list) to an out-of-band callback
# service.  Install-time execution plus the host-profile beacon is the
# dependency-confusion probe regardless of which collaborator service or
# package label it uses.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, npm]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  - id: npm-preinstall-node-script-host-recon-to-oob
    desc: preinstall Node script posts host identity to OOB service
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: objectives/exfiltration/oob/callback::oob-service-http-host-recon
    unless:
      - id: metadata/package/testing/harness/runtime/

  # GET variant: the host and CI-provider fingerprint rides in an encoded query
  # parameter of the callback URL instead of a POST body.  The CI provider
  # sweep separates a build-environment survey from a plain hostname ping.
  - id: npm-preinstall-node-script-ci-recon-get-to-oob
    desc: preinstall script GETs host and CI identity to OOB
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/http/get::node-host-identity-get-url
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/os/env/cicd::multi-ci-provider-env-refs-three-plus
      - id: micro-behaviors/communications/url/http-query::encoded-template-query-parameter
    unless:
      - id: metadata/package/testing/harness/runtime/
