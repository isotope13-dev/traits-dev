# Preinstall JavaScript that harvests the host shadow credential store and
# POSTs it as JSON to an out-of-band collector. The legs below all fired on
# rank4222wun preinstall.js: nsenter host escape plus cat /etc/shadow on
# Linux, a OneDrive password-keyword sweep on Windows, and an https.request
# POST of the JSON payload to oastify.com.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  attack: T1195.002,T1041,T1003
  mbc: E1041
composite_rules:
  - id: preinstall-js-shadow-oast-post-exfil
    desc: Preinstall script POSTs shadow harvest to OOB collector
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/url/host/oob::oastify
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/body::request-end-call
      - id: micro-behaviors/fs/path/credential::authorized-keys-or-shadow-path
    unless:
      - id: metadata/package/testing/harness/runtime/
