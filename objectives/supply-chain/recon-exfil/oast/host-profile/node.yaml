# An npm package that calls an out-of-band collaborator domain at install time,
# carrying who and where it landed.
#
# The sibling rules in this directory all describe the shell spelling — a
# `preinstall` that pipes `whoami` into `curl`. This is the same beacon written
# in Node: `os.userInfo().username` and `os.hostname()` assembled into a query
# string and fetched from an `*.oastify.com` / `*.oast.pro` / interactsh host.
# Nothing shell-shaped appears, so none of those rules see it.
#
# An OAST domain is a listener that exists to prove a request reached it. That
# is its only function, which is what makes it unambiguous in a published
# package: nothing a dependency legitimately does requires telling a
# collaborator server the name of the machine that installed it. The intent
# behind any given one may be a bug-bounty proof rather than an intrusion, but
# the behaviour shipped to every consumer is identical either way, and neither
# was consented to.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1082,T1041
  mbc: B0024,E1082

composite_rules:
  - id: node-oast-host-callback
    desc: Node package beacons host identity to OAST
    crit: suspicious
    conf: 0.93
    all:
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call

  # The same beacon again, written inline in the manifest rather than in a file.
  #
  # `"postinstall": "node -e \"...\""` carries the whole payload in the script
  # string, so nothing JavaScript-typed is ever analysed and the rule above --
  # which reads a `.js` file -- cannot see it. The npm-script-aware traits do
  # read the manifest, and they are what this pairs.
  #
  # Hostile on the same reasoning as the sibling `npm-preinstall-ip-callback`:
  # an OAST domain's only function is to prove a request reached it, and an
  # install hook is code every consumer runs without asking. Collecting the
  # host's identity and posting it to a collaborator at install time is the
  # finished act, whoever set it up and whatever they meant by it.
  - id: npm-install-hook-oast-host-profile
    desc: Install hook sends host profile to OAST
    crit: hostile
    conf: 0.97
    for: [package.json]
    all:
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
    any:
      - id: micro-behaviors/os/sysinfo/hostname::npm-postinstall-os-hostname-call
      - id: micro-behaviors/os/env/vars/user-info::npm-postinstall-user-env
