defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
traits:
  - id: preinstall-node-http-get
    desc: Preinstall calls Node HTTP GET
    crit: notable
    conf: 0.96
    if:
      type: value
      path: scripts.preinstall
      regex: "require\\([\\\"']http[\\\"']\\)\\.get\\s*\\("
  - id: preinstall-user-env
    desc: Preinstall reads user identity environment
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: scripts.preinstall
      regex: "process\\.env\\.(USER|USERNAME)"
  - id: preinstall-cwd-query
    desc: Preinstall reads working directory
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      substr: "process.cwd()"
  - id: preinstall-ip-port-url
    desc: preinstall contains IPv4 URL with port
    crit: suspicious
    conf: 0.95
    attack: "T1571"
    if:
      type: value
      path: scripts.preinstall
      regex: "https?://(\\d{1,3}\\.){3}\\d{1,3}:[1-9][0-9]{1,4}"
composite_rules:
  - id: npm-preinstall-node-host-profile-ip-exfil
    desc: npm preinstall sends user and host profile to a raw IP
    crit: hostile
    conf: 0.99
    for: [package.json]
    attack: "T1195.002,T1041,T1082,T1033"
    mbc: "E1041"
    near_bytes: 2000
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: preinstall-node-http-get
      - id: preinstall-user-env
      - id: preinstall-cwd-query
      - id: metadata/package/scripts/lifecycle::preinstall-hostname
      - id: micro-behaviors/communications/ip/literal::preinstall-external-ipv4-url
  - id: npm-preinstall-ip-callback
    for: [packagejson]
    desc: npm preinstall sends callback to an IP address
    crit: hostile
    conf: 0.98
    attack: "T1195.002"
    mbc: "E1041"
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/communications/http/curl::npm-preinstall-curl
    any:
      - id: preinstall-ip-port-url
      - id: micro-behaviors/communications/ip/literal::preinstall-external-ipv4-url
    needs: 1
