defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
  attack: "T1552.001, T1041"
  mbc: E1552

traits:
  # ---- Distinctive env-var / store tokens (text — work on shell too) ----
- id: prompt-tmp-inventory-path
  desc: '"tmp/inventory.txt" scratch-file path'
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: tmp/inventory.txt
    case_insensitive: true
  # ---- LLM-prompt-only English words (string_literal — JS/TS only) ----
  # `keystore` and `wallets` were defined here, but a bare credential-store or
  # wallet word is not an LLM-prompt fragment: every wallet SDK and key-vault
  # client carries both. They now live with the rest of that vocabulary --
  # objectives/credential-access/theft/authentication/keywords/ and .../wallet/keywords/ --
  # exactly like the `private` and `secret` legs below already did, and the
  # prompt composites reference them from there.
- id: prompt-environment-definition-phrase
  desc: '"environment-definition" prompt phrase'
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: string_literal
    substr: environment-definition
    case_insensitive: true
  # ---- GitHub-API upload of harvested secrets ----
composite_rules:
- id: prompt-private-credential-phrase
  desc: Private term near credential prompt words
  crit: component
  conf: 0.9
  near_bytes: 80
  needs: 2
  any:
  - id: micro-behaviors/data/parse/vocabulary::private-literal-word
  - id: metadata/lang/natural/phrasing::secret-acquisition-wording
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: micro-behaviors/data/parse/vocabulary::wallets-word

- id: prompt-search-enumeration-phrase
  desc: Prompt contains search or enumeration wording
  crit: component
  conf: 0.9
  near_bytes: 80
  needs: 2
  any:
  - id: micro-behaviors/ui/help::file-enumeration-wording
  - id: micro-behaviors/ui/help::file-secret-search-wording

- id: prompt-amazon-credential-phrase
  desc: Amazon term near secret prompt words
  crit: component
  conf: 0.9
  near_bytes: 80
  needs: 2
  any:
  - id: metadata/lang/natural/vocabulary/content-word::amazon-provider-word
  - id: metadata/lang/natural/phrasing::secret-acquisition-wording
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: metadata/file/string/file::configuration-word

- id: llm-inventory-prompt-anchor
  desc: Distinctive LLM inventory prompt anchor
  crit: component
  conf: 0.93
  needs: 2
  any:
  - id: prompt-tmp-inventory-path
  - id: prompt-environment-definition-phrase
  - id: prompt-amazon-credential-phrase
  - id: prompt-search-enumeration-phrase
      # A prompt that names a browser credential store, or several wallet
      # products in a row, is describing what to collect. The nx "telemetry"
      # variant that hunted wallet key files rather than CI tokens carried
      # exactly these and no other anchor.
  - id: micro-behaviors/data/db/web-storage::indexeddb-name-literal
  - id: micro-behaviors/os/application/target/wallet::wallet-app-name-cluster

- id: llm-inventory-action-cluster
  desc: Filesystem inventory action cluster
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/ui/help::file-enumeration-wording
  - id: micro-behaviors/ui/help::file-secret-search-wording
  - id: micro-behaviors/ui/help::recursive-search-wording
  - id: "micro-behaviors/fs/search/command::locate-token"
  - id: prompt-tmp-inventory-path
  - id: prompt-environment-definition-phrase

- id: llm-inventory-instruction-anchor
  desc: Filesystem inventory instruction anchor
  crit: component
  conf: 0.92
  any:
  - id: prompt-environment-definition-phrase
  - id: prompt-tmp-inventory-path
  - id: metadata/file/string/file::configuration-word
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: metadata/lang/natural/phrasing::secret-acquisition-wording

- id: github-repo-secret-exfiltration
  desc: GitHub-API secret-blob exfiltration chain
  crit: suspicious
  conf: 0.98
  any:
  - id: github-client-secret-blob-exfiltration
  - id: github-endpoint-secret-blob-exfiltration

- id: github-client-secret-blob-exfiltration
  desc: GitHub client API writes encoded secret material
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/services/github::github-create-or-update-file-contents
  - id: github-content-base64-upload
  any:
  - id: llm-cli-secret-search-prompt
  - id: child-process-llm-secret-search
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/fs/read/file/full::node-npmrc-read-reference
  - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
  - id: micro-behaviors/fs/read/file/target::github-npm-pattern-file-operations

- id: github-endpoint-secret-blob-exfiltration
  desc: Direct GitHub contents API writes encoded secret material
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
  - id: llm-cli-filesystem-inventory

- id: public-github-secret-dump
  desc: Public GitHub repo used as secret dump
  crit: hostile
  conf: 0.985
  all:
  - id: github-repo-secret-exfiltration
  - id: micro-behaviors/communications/http/services/github::github-public-repo-creation

- id: llm-cli-filesystem-inventory
  desc: LLM CLI driven filesystem inventory of secrets
  crit: hostile
  conf: 0.985
  all:
  - id: micro-behaviors/process/create/agent::ai-agent-bypass-flag-near-process-exec
  any:
  - id: llm-cli-inventory-file-prompt
  - id: llm-inventory-file-instructions

- id: vscode-extension-llm-secret-harvest
  desc: VSCode extension spawns LLM secret search
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  all:
  - id: well-known/lib/development/vscode::require-vscode
  - id: child-process-llm-secret-search

- id: llm-cli-secret-search-prompt
  desc: LLM CLI prompt enumerates credentials
  crit: suspicious
  conf: 0.94
  near_bytes: 240
    # Require both an inventory action and >=2 credential fragments so a
    # report template saying "wallets" and "keystore" is not enough.
  all:
  - id: llm-inventory-action-cluster
  needs: 2
  any:
  - id: micro-behaviors/os/env/package-manager::node-auth-token-name
  - id: micro-behaviors/os/env/package-manager::npm-token-name
  - id: micro-behaviors/os/env/vcs::gh-token-name-reference
  - id: micro-behaviors/data/db/web-storage::indexeddb-name-literal
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: prompt-private-credential-phrase
  - id: micro-behaviors/data/parse/vocabulary::wallets-word
  - id: micro-behaviors/os/env/secret-name::github-token-name-reference
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: well-known/lib/ai/
  - id: well-known/tool/detection/security-scanner/

- id: child-process-llm-secret-search
  for: [javascript]
  desc: Child-process invocation of LLM secret search
  crit: suspicious
  conf: 0.96
  near_bytes: 400
    # Pairs distinctive credential-store tokens and inventory/prompt language
    # with a child_process spawn API. This avoids benign token resolvers that
    # call `gh auth token` or similar CLIs without an LLM search prompt.
  all:
  - id: micro-behaviors/process/create/exec::child-process-execution
  - id: llm-inventory-action-cluster
  any:
  - id: micro-behaviors/os/env/package-manager::node-auth-token-name
  - id: micro-behaviors/os/env/package-manager::npm-token-name
  - id: micro-behaviors/os/env/vcs::gh-token-name-reference
  - id: micro-behaviors/data/db/web-storage::indexeddb-name-literal
  - id: micro-behaviors/os/env/secret-name::github-token-name-reference
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: well-known/lib/ai/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/build/recognized-contexts::benign-app-fp-context

- id: llm-cli-inventory-file-prompt
  desc: LLM CLI prompt assembles file inventory
  crit: suspicious
  conf: 0.94
  near_bytes: 240
    # Require both a distinctive inventory/LLM anchor and a filesystem
    # action cue so ambient API words like "search" or event names like
    # "locate" in declaration files do not self-satisfy the composite.
  all:
  - id: llm-inventory-prompt-anchor
  - id: llm-inventory-action-cluster
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures

- id: llm-inventory-file-instructions
  desc: LLM filesystem-inventory instruction prompt
  crit: notable
  conf: 0.9
  near_bytes: 240
    # Require an inventory-specific anchor in addition to the action cue.
  all:
  - id: llm-inventory-instruction-anchor
  - id: llm-inventory-action-cluster
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures

- id: github-content-base64-upload
  desc: Base64 secret material uploaded via GitHub contents API
  crit: suspicious
  conf: 0.92
  near_bytes: 800
  all:
  - id: micro-behaviors/communications/http/services/github::github-create-or-update-file-contents
  - id: github-secret-source
  any:
  - id: micro-behaviors/data/string/conversion::tostring-token
  - id: micro-behaviors/data/codec::base64-helper-invocation
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/build/bundler/vscode::vscode-js-distribution-bundle
  - id: well-known/tool/development/ci/action-download-artifact::source-tree

- id: github-secret-source
  desc: Secret-material source near GitHub upload
  crit: component
  conf: 0.92
  any:
  - id: llm-cli-secret-search-prompt
  - id: child-process-llm-secret-search
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/fs/read/file/full::node-npmrc-read-reference
  - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
  - id: micro-behaviors/fs/read/file/target::github-npm-pattern-file-operations
