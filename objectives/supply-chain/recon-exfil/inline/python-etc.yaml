defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1005

traits:
  - id: install-python-etc-config-read
    desc: Install script reads system config under /etc
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/etc/(my\.cnf|hosts|os-release|resolv\.conf|passwd|shadow)\b'

  - id: install-python-http-post-url
    desc: Install script posts to remote Python URL
    crit: suspicious
    conf: 0.94
    attack: T1041
    if:
      type: text
      regex: '(httpx|requests)\.post\s*\(\s*[''"]https?://'

composite_rules:
  - id: npm-python-install-etc-exfil
    desc: npm install hook reads /etc config and posts it remotely
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1005,T1041
    mbc: B0024
    for: [package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: install-python-etc-config-read
      - id: install-python-http-post-url
    any:
      - id: micro-behaviors/data/encode/base64::npm-postinstall-python-b64encode
      - id: micro-behaviors/data/encoding/base64::preinstall-base64-word
      - id: micro-behaviors/communications/url/host/oob::oastify
