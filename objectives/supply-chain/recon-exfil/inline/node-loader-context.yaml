# Import-time webpack loaders that report local build/runtime identity to a
# remote endpoint. The field cluster is deliberately specific: a normal HTTP
# client or a loader-context read alone is not an exfiltration verdict.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1041,T1195.002,T1592.004"
  mbc: E1041

traits:
- id: loader-process-identity-report-fields
  desc: Encodes process PID and cwd for report
  crit: component
  conf: 0.93
  if:
    type: text
    regex: 'pid\s*:\s*process\.pid[\s\S]{0,180}cwd\s*:\s*base64url\(process\.cwd\(\)\)'
- id: loader-root-context-report-field
  desc: Encodes loader root context for reporting
  crit: component
  conf: 0.93
  if:
    type: text
    regex: 'rootContext\s*:\s*base64url\(loaderContext\.rootContext'
- id: loader-resource-report-field
  desc: Encodes loader resource path for reporting
  crit: component
  conf: 0.93
  if:
    type: text
    regex: 'resource\s*:\s*base64url\(loaderContext\.resourcePath'

composite_rules:
- id: loader-context-report-fields
  desc: Encodes loader and process context for reporting
  crit: suspicious
  conf: 0.97
  near_lines: 10
  all:
  - id: loader-process-identity-report-fields
  - id: loader-root-context-report-field
  - id: loader-resource-report-field
- id: npm-loader-context-http-beacon
  desc: npm loader reports build context over HTTP
  crit: hostile
  conf: 0.99
  all:
  - id: loader-context-report-fields
  - id: metadata/import/builtin::require-http
  - id: micro-behaviors/communications/http/request/dynamic::node-http-module-get-url-call
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
