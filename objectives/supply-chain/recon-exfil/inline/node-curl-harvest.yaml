# Node modules that shell out to curl -X POST while harvesting Unix
# sensitive files and multi-cloud IMDS endpoints — the durable shape of
# recent npm "utility" trojans that fake date/format helpers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1041,T1552.005

composite_rules:
  - id: node-curl-post-unix-sensitive-exfil
    desc: Node curl-POSTs Unix sensitive file harvest
    crit: hostile
    conf: 0.98
    attack: T1041,T1005,T1552.001
    all:
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: objectives/collection/file-copy/sensitive::node-unix-sensitive-targets
    any:
      - id: micro-behaviors/fs/path/sensitive/ssh::keys
      - id: micro-behaviors/os/container/runtime::serviceaccount-token
      - id: objectives/exfiltration/stealer/credential/multi-source::node-sensitive-find-command

  - id: node-multicloud-metadata-curl-exfil
    desc: Node probes multi-cloud metadata and curl-POSTs
    crit: hostile
    conf: 0.98
    attack: T1552.005,T1041
    all:
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: objectives/supply-chain/recon-exfil/install-hook::curl-cloud-metadata
      - id: objectives/supply-chain/recon-exfil/install-hook::alibaba-metadata-url
    any:
      - id: objectives/supply-chain/recon-exfil/install-hook::tencent-metadata-host-url
      - id: micro-behaviors/communications/http/services/cloud::gcp-metadata-flavor-header
      - id: metadata/file/string/cloud::aws-metadata-endpoint
