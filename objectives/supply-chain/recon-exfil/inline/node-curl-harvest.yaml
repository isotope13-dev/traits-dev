defaults:
  crit: hostile
  conf: 0.98
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002,T1041,T1552.005
composite_rules:
- id: node-multicloud-metadata-curl-exfil
  desc: Node probes multi-cloud metadata and curl-POSTs
  attack: T1552.005,T1041
  all:
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: micro-behaviors/communications/http/services/cloud::curl-aws-metadata-query
  - id: micro-behaviors/communications/http/services/alibaba::alibaba-metadata-endpoint-reference
  any:
  - id: micro-behaviors/communications/http/services/tencent::tencent-metadata-host-endpoint-reference
  - id: micro-behaviors/communications/http/header/custom::gcp-metadata-flavor-header
  - id: micro-behaviors/communications/http/services/aws::aws-metadata-endpoint
