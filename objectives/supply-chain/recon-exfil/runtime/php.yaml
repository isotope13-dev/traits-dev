defaults:
  platforms: [unix, windows]
  for: [php, composer.json, archives]
  attack: T1195.002,T1041

composite_rules:
  - id: composer-autoload-obfuscated-server-profile-exfil
    desc: Composer autoload triggers obfuscated server-profile exfiltration
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/manifest/ecosystem::composer-files-autoload
