# A package claiming its scan metadata remains local while posting repository
# identity and scan metrics contradicts the installer's privacy expectation.
# The payload fields and endpoint remain neutral outside this archive-level
# conjunction because transparent product analytics can legitimately use them.
defaults:
  platforms: [windows, unix]
  for: [whl, zip, archives]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: python-package-false-local-scan-telemetry-claim
    desc: False local-scan claim with repo telemetry
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/manifest/description::local-scan-metadata-privacy-claim
      - id: micro-behaviors/os/telemetry/http/request::repository-scan-telemetry-payload
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/url/path::telemetry-api-path
