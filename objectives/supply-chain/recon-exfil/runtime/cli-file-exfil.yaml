# Runtime file theft from an npm command-line entrypoint. The general file-to-
# OOB conclusion remains under exfiltration; this archive-scoped rule adds the
# package-delivery context without depending on a sample-specific file path.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: npm-cli-oob-file-exfil
    desc: npm CLI performs OOB file exfiltration
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::bin-field-declared
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-file-exfil
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/offensive/
