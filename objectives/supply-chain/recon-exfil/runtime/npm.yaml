defaults:
  platforms: [unix, windows, macos]
  for: [javascript, typescript, npm, tar, tgz]
  attack: T1195.002,T1041,T1552.001
  mbc: B0030,E1041

composite_rules:
  - id: npm-runtime-full-environment-exfil
    desc: npm runtime uploads the full environment over HTTP
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/env/read::node-process-env-object-copy
      - id: objectives/exfiltration/stealer/env::node-base64-json-exfil-body
      - id: objectives/exfiltration/http/upload::node-upload-sink
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/communications/http/user-agent::application-user-agent
