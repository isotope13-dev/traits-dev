# npm CLI tools that fingerprint the host via systeminformation and POST the
# result to a remote endpoint at runtime (not an install hook). Distinct from
# preinstall beacons: the exfil fires from a bin/commander action handler.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, archives]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  - id: npm-cli-systeminformation-fetch-exfil
    desc: npm CLI POSTs systeminformation fingerprint externally
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::bin-field-declared
      - id: metadata/package/quality/profile::has-cli-args-import
      - id: objectives/discovery/system/fingerprint/hardware::si-uuid-call
      - id: objectives/discovery/system/fingerprint/hardware::si-cpu-call
      - id: micro-behaviors/data/source/syntax/schema::hardware-macs-field-pair
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
