# Runtime package code that hashes local host identity and POSTs it to a
# package-controlled endpoint.  License or update attestation can be
# legitimate, so this remains suspicious until a package's purpose and
# disclosure make the collection expected.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1082
  mbc: E1041

composite_rules:
  - id: runtime-package-host-fingerprint-post
    desc: Runtime package posts a hashed host fingerprint
    crit: suspicious
    conf: 0.92
    scope: file
    near_bytes: 12000
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
      - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
      - id: objectives/supply-chain/recon-exfil/tracking::package-object-json-stringify
