# Runtime OOB exfiltration from a Python distribution is a supply-chain
# finding when the package is not a recognized security or testing tool.
# The endpoint and JSON-post atoms remain in their neutral/communications
# locations; this file adds only the package-delivery intent.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: pypi-runtime-oob-exfiltration
    for: [python, python-sdist]
    desc: PyPI package posts caller data to an OOB endpoint at runtime
    conf: 0.99
    scope: outer
    all:
      - id: objectives/exfiltration/oob/endpoint::python-oob-json-post
      - id: metadata/build/pip::root-setup-py
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: well-known/tool/offensive/
      - id: "metadata/file/naming::test-directory-component"
  - id: python-wheel-oob-json-callback
    desc: Wheel member posts JSON to an OOB collector
    crit: notable
    conf: 0.95
    for: [python, whl]
    scope: file
    any:
      - id: objectives/exfiltration/oob/endpoint::python-oob-json-post
      - id: micro-behaviors/communications/http/request/json::python-urllib-json-request-oob-reference
  # A wheel that hardcodes an ntfy.sh (or similar) collector and POSTs a host
  # or session profile over urllib is an undisclosed default rendezvous beacon,
  # not ordinary package telemetry.
  - id: pypi-default-rendezvous-session-beacon
    desc: PyPI wheel defaults to OOB session readiness beacon
    conf: 0.98
    for: [whl, python]
    scope: archive
    all:
      - id: micro-behaviors/communications/url/host/oob::ntfy-sh-topic-url
      - id: micro-behaviors/communications/http/request/json::python-urllib-json-request-oob-reference
      - id: micro-behaviors/data/serialize/schema-object::python-host-profile-object-fields
  - id: pypi-wheel-runtime-oob-exfiltration
    for: [whl]
    desc: PyPI wheel posts caller data to an OOB endpoint at runtime
    conf: 0.99
    scope: archive
    all:
      - id: python-wheel-oob-json-callback
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: well-known/tool/offensive/
      - id: "metadata/file/naming::test-directory-component"
  - id: python-async-request-header-beacon
    desc: PyPI package beacons copied HTTP headers in background thread
    conf: 0.98
    # Installed app bundles ship normal site-packages modules that copy
    # headers, POST data, and run daemon workers independently. Require the
    # complete beacon in one package-root source file, not across dependencies.
    # Archive reports aggregate child evidence, so admitting archive types here
    # would reconstruct the four legs from unrelated package members.
    scope: file
    unless:
      - id: metadata/package/files/dependency::bundled-python-library-path
      - id: well-known/lib/web/site-platforms/crawl4ai::crawl4ai-package-context
      - id: well-known/lib/web/site-platforms/crawl4ai::package-path
      - id: well-known/lib/ai/ray::ray-package-context
      - id: well-known/app/system/home-assistant::wheel-package-path
      - id: well-known/app/system/home-assistant::components-tree-path
    all:
      - id: micro-behaviors/communications/http/header/custom::python-request-header-map-copy
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
      - id: micro-behaviors/process/create/thread::python-thread-create
      - id: micro-behaviors/process/create/thread::python-thread-daemon-assignment

  # Wheels that ship a site-packages .pth import hook and, at interpreter
  # startup, snapshot host identity, environment, process list, and cloud
  # metadata reachability into local JSON without disclosing that behavior in
  # normal import paths.
  - id: pypi-wheel-pth-startup-host-recon-snapshot
    desc: PyPI wheel .pth runs startup host recon snapshot
    conf: 0.98
    attack: T1195.002,T1082,T1552.005,T1546.004
    for: [whl, python, pkginfo]
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/header/custom::gcp-metadata-flavor-header
      - id: micro-behaviors/data/serialize/json::json-dumps-call
    any:
      - id: micro-behaviors/fs/proc/cmdline::process-var-cmdline
      - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
      - id: micro-behaviors/data/serialize/schema-object::host-field-key
