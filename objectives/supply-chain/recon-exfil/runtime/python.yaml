# Runtime OOB exfiltration from a Python distribution is a supply-chain
# finding when the package is not a recognized security or testing tool.
# The endpoint and JSON-post atoms remain in their neutral/communications
# locations; this file adds only the package-delivery intent.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: pypi-runtime-oob-exfiltration
    desc: PyPI package posts caller data to an OOB endpoint at runtime
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: objectives/exfiltration/oob/endpoint::python-oob-json-post
      - id: metadata/build/pip::root-setup-py
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: well-known/tool/offensive/
