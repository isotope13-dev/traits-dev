# A native build action is attacker-controlled JavaScript. These rules identify
# filesystem collection and environment harvesting sent to a remote HTTP sink.
defaults:
  platforms: [unix, windows]
  for: [gyp]
  attack: T1195.002,T1041

traits:
  - id: gyp-build-action
    desc: Native build manifest runs a Node action
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '"action"\s*:\s*\[\s*"node"\s*,\s*"-e"'

  - id: shell-filesystem-collection
    desc: Build action lists and reads host files
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'find\s+.{0,100}-type\s+f|xargs\s+cat'

  - id: build-action-environment-dump
    desc: Build action serializes the complete environment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'env\s*\|\s*sort'

  - id: webhook-http-post
    desc: Build action posts data to webhook.site
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: webhook.site/

  - id: post-method
    desc: Build action configures HTTP POST
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'method["\x27]?\s*:\s*["\x27]POST'

composite_rules:
  - id: native-build-filesystem-exfiltration
    desc: Native build action collects host files and posts them remotely
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, gyp]
    mbc: E1041
    all:
      - id: gyp-build-action
      - id: shell-filesystem-collection
      - id: webhook-http-post
      - id: post-method

  - id: native-build-environment-exfiltration
    desc: Native build action dumps environment variables to a remote sink
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, gyp]
    mbc: E1041
    all:
      - id: gyp-build-action
      - id: build-action-environment-dump
      - id: webhook-http-post
      - id: post-method
