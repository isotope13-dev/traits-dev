defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1552.001,T1082,T1041"

composite_rules:
- id: npm-install-profile-exfil
  desc: npm install developer profile exfil
  crit: hostile
  conf: 0.99
  all:
  - id: developer-email-source-harvest
  - id: cicd-runtime-fingerprint
  - id: npm-profile-json-post
  any:
  - id: micro-behaviors/os/console/io::js-console-output-silenced
  - id: objectives/discovery/host/geo::ipify-api-comp
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
- id: developer-email-source-harvest
  desc: Developer email identity source strings
  crit: component
  conf: 0.96
  any:
  - id: metadata/file/string/identity::developer-email-source-harvest--rx-6
  - id: metadata/file/string/identity::developer-email-source-harvest--rx-7
- id: cicd-runtime-access
  desc: CI environment variable access clue
  crit: component
  conf: 0.94
  any:
  - id: micro-behaviors/os/env/cicd::process-env-github-actions
  - id: micro-behaviors/os/env/cicd::process-env-jenkins-prefix
  - id: micro-behaviors/os/env/cicd::process-env-github-run-id
  - id: micro-behaviors/os/env/cicd::process-env-ci-job-id
  - id: micro-behaviors/os/env/cicd::process-env-ci-project-name
  - id: micro-behaviors/os/env/cicd::process-env-bracket-runner
  - id: micro-behaviors/os/env/cicd::process-env-bracket-github
  - id: micro-behaviors/os/env/cicd::process-env-runner-name
  - id: micro-behaviors/os/env/cicd::process-env-runner-os
  - id: micro-behaviors/os/env/cicd::process-env-ci
- id: cicd-runtime-fingerprint
  desc: CI environment access with runtime fingerprint
  crit: component
  conf: 0.94
  all:
  - id: cicd-runtime-access
  needs: 2
  any:
  - id: micro-behaviors/os/env/cicd::github-repository
  - id: micro-behaviors/process/create/spawn::process-execpath-spawn
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-version-access
  - id: micro-behaviors/process/info/commandline::check-argv
  unless:
  - id: metadata/build/
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
  - id: well-known/tool/development/cli/socket-cli::socket-dev-cli-bundle
  - id: well-known/tool/development/cli/socket-cli::socket-dev-cli-vendored-path
- id: npm-profile-json-post
  desc: POSTs npm install profile JSON
  crit: suspicious
  conf: 0.94
  all:
  - id: objectives/supply-chain/recon-exfil/host-profile/developer::npm-install-env-marker
  - id: micro-behaviors/communications/http/header/content-type::application-json
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: metadata/package/keywords/profile::npm-install-profile-fields
- id: npm-install-env-marker
  desc: npm install environment marker
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/package-manager::npm-config-user-agent
  - id: micro-behaviors/os/env/package-manager::npm-lifecycle
