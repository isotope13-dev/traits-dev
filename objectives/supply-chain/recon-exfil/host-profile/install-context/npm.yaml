defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: package-resolved-field
  desc: Reads package ___resolved field
  crit: notable
  conf: 0.85
  for:
  - javascript
  if:
    type: text
    substr: ".___resolved"
- id: querystring-msg-field
  desc: URL-encodes msg field for POST
  crit: notable
  conf: 0.85
  for:
  - javascript
  if:
    type: text
    regex: 'querystring\.stringify\s*\(\s*\{\s*msg\s*:'
- id: dirname-tracking-field
  desc: Includes __dirname in tracking data
  crit: notable
  conf: 0.8
  for:
  - javascript
  if:
    type: text
    regex: "\\bc\\s*:\\s*__dirname\\b"
- id: local-stealer-import-1
  desc: Local stealer import pattern 1
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "(from|require\\()\\s*\\./stealer"
- id: local-stealer-import-2
  desc: Local stealer import pattern 2
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: "(from|require\\()\\s*\\./(logger|exfil)"

composite_rules:
- id: npm-install-tracking-object
  desc: NPM hook builds install tracking object
  crit: suspicious
  conf: 0.93
  attack: T1082
  for:
  - javascript
  all:
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/fs/path/self::script-dirname-ref
  - id: micro-behaviors/fs/read/file/target::require-local-package-json
  any:
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::querystring-msg-field
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::package-resolved-field
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::dirname-tracking-field
  needs: 2
- id: npm-preinstall-node-host-oob-exfil
  desc: npm preinstall script POSTs host profile to OOB
  crit: hostile
  conf: 0.99
  mbc: E1041
  attack: T1195.002,T1041
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/url/host::pipedream
  - id: npm-node-host-metadata-exfil
- for:
  - javascript
  id: npm-node-host-metadata-exfil
  desc: NPM hook exfiltrates host package metadata
  crit: hostile
  conf: 0.99
  mbc: E1041
  attack: T1041
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/process/user/query::os-homedir-call
  - id: metadata/import/builtin::require-dns
  - id: micro-behaviors/fs/read/file/target::require-local-package-json
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/form::form-submission-encoding
  any:
  - id: micro-behaviors/communications/url/host::pipedream
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::querystring-msg-field
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::package-resolved-field
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::npm-install-tracking-object
  needs: 2

- id: npm-preinstall-oastify-https-host-profile-exfil
  desc: npm preinstall POSTs install host profile to Oastify
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/url/host::oastify
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/communications/http/post::json-body-post
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::dirname-tracking-field

- id: local-stealer-import
  desc: Imports local stealer module
  crit: suspicious
  conf: 0.8
  for:
  - javascript
  - typescript
  any:
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::local-stealer-import-1
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::local-stealer-import-2
- id: npm-data-exfil
  for: [javascript]
  desc: NPM package exfiltrates system info via HTTP
  crit: notable
  conf: 0.95
  attack: T1020
  mbc: E1041
  all:
  - id: micro-behaviors/communications/http/post::post
  - id: metadata/file/size::javascript-small-file-5k
  any:
  - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-property-fingerprint
- id: npm-postinstall-host-profile-write
  desc: npm postinstall collects host profile locally
  crit: suspicious
  conf: 0.98
  attack: T1195.002,T1082
  unless:
  - id: metadata/package/description/disclosure::security-poc-placeholder-context
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/os/sysinfo/hostname::npm-postinstall-os-hostname-call
  - id: micro-behaviors/os/env/user-info::npm-postinstall-user-env
  - id: micro-behaviors/os/sysinfo/platform/runtime::npm-postinstall-os-platform-call
  - id: micro-behaviors/os/sysinfo/platform/runtime::npm-postinstall-cwd-call
  - id: micro-behaviors/fs/path/temp::npm-postinstall-os-tmpdir
  - id: micro-behaviors/fs/write/file/full::npm-postinstall-write-file-sync

# Sidecar postinstall.js variant: host/user/platform recon serialized to a
# temporary path (often under os.tmpdir()). Inline package.json script atoms
# above do not match when the hook only runs `node postinstall.js`.
- id: npm-postinstall-sidecar-tmp-host-profile
  desc: npm postinstall sidecar writes host profile under tmp
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1082,T1033
  mbc: E1041
  for: [javascript, package.json, npm]
  scope: archive
  unless:
  - id: metadata/package/description/disclosure::security-poc-placeholder-context
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: js-host-profile-written-to-tmp

# "Sidecar writes a host profile under tmp" is a claim about one script: it
# reads hostname/user/platform, shapes them into a metric record, and writes
# that to a temp path. At archive scope the six legs were satisfiable by six
# unrelated entries, so any large npm package that also declares a postinstall
# hook matched -- openclaw (8550 files) did, off a hook that only links bundled
# plugins. The recon-and-write core belongs in a single leaf file.
- id: js-host-profile-written-to-tmp
  desc: Script writes a host/user profile to a temp path
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  scope: file
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
  - id: micro-behaviors/fs/path/temp::node-os-tmpdir
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync
  any:
  - id: micro-behaviors/process/create/vcs/git::javascript-git-read-query
  - id: micro-behaviors/process/user/query::os-homedir-call

- id: vscode-uninstall-profile-post-context
  desc: VS Code uninstall telemetry and POST literal
  crit: exception
  conf: 0.98
  for: [javascript]
  all:
  - id: well-known/lib/development/vscode::vscode-extension-uninstall-telemetry
  - id: micro-behaviors/communications/http/post::post
