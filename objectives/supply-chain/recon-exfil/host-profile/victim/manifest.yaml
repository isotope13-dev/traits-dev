defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
traits:
# A curl/wget beacon carrying victim identifiers as request parameters
# (`--data-urlencode "user=…" "host=…"`). >=2 distinct identity fields = a
# fingerprint beacon, not a normal API call. Catches the spawned-curl exfil
# used by the @403name/ether-js typosquat (clickfix-callback).
- id: curl-beacon-victim-fields
  desc: curl beacons victim user/host fields
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript, shell]
  if:
    type: text
    regex: "--data(-urlencode)?[\\s\"']{1,3}(user|hostname?|bid|uid)="
  unless:
    - id: well-known/app/utility/cmdchamp/
composite_rules:
  - id: python-package-profiled-install-beacon
    desc: Python package profiles the host and installs an HTTP-capable dependency
    crit: hostile
    conf: 0.96
    attack: "T1195.002,T1041"
    mbc: E1041
    all:
      - id: objectives/execution/autoinstall/pip::subprocess-requests-install
      - id: objectives/discovery/system/profile::python-device-host-profile-fields
      - id: micro-behaviors/communications/http/request/client::request-python
    unless:
      - id: metadata/package/testing/
  # Victim recon (user/hostname collection in a small npm package) beaconed out
  # via a curl identity beacon = host fingerprint exfiltration.
  - id: npm-victim-curl-beacon-exfil
    desc: NPM victim identifiers beaconed via curl
    crit: hostile
    conf: 0.96
    for: [archives]
    scope: archive
    attack: T1041
    mbc: E1041
    all:
      - id: objectives/discovery/system/fingerprint/hardware::small-js-victim-id
      - id: curl-beacon-victim-fields
  # A package that profiles the importing machine and posts the serialized
  # result from module scope is a supply-chain beacon, even without an npm
  # lifecycle hook. Require the archive-scoped npm victim signal plus the
  # native HTTP body mechanics so ordinary host-info libraries remain neutral.
  - id: npm-import-host-profile-post
    desc: NPM package beacon profiles the importer at module load
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1082,T1033"
    mbc: E1041
    for: [archives]
    scope: archive
    near_bytes: 8192
    all:
      - id: objectives/discovery/system/fingerprint/hardware::small-js-victim-id
      - id: objectives/discovery/system/fingerprint/hardware::node-data-aggregation
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  - id: npm-victim-id-fetch-exfil
    desc: NPM victim identifiers sent in an authenticated account request
    crit: hostile
    conf: 0.99
    attack: "T1020,T1041"
    mbc: E1041
    for: [archives]
    scope: archive
    all:
      - id: objectives/discovery/system/fingerprint/hardware::small-js-victim-id
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::bearer-authorization-prefix
      - id: micro-behaviors/communications/http/endpoints::accounts-endpoint-path
      - id: objectives/exfiltration/http/hardcoded-key::request-body-marker
    unless:
      - id: metadata/package/manifest/publishing::is-private
  - id: npm-victim-id-oob-exfil
    desc: NPM victim identifiers exfiltrated to OOB
    crit: hostile
    conf: 0.98
    for: [archives]
    scope: archive
    attack: T1048
    mbc: E1041
    all:
      - id: objectives/discovery/system/fingerprint/hardware::small-js-victim-id
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
    any:
      # https.request and fetch() are both common Node OOB transports.
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::http-post-json
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/manifest/publishing::is-private
  - id: npm-hollow-preinstall-encoded-recon-exfil
    desc: Hollow npm preinstall runs encoded recon beacon
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1041"
    mbc: E1041
    for: [package.json, javascript, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/manifest/placeholder::mature-hollow-index-package
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
      - id: objectives/discovery/system/fingerprint/hardware::js-encoded-recon-beacon
