# A machine fingerprint assembled and sent: hostname, the logged-in user, the
# first non-loopback MAC, the platform — and, in the version that motivated
# this, a hash of those joined together as a stable `machineId`.
#
# Each read is ordinary on its own; an installer checks the platform, a logger
# records the hostname. What is not ordinary is collecting the set. The MAC
# address is the tell: it identifies the hardware rather than the session, it
# survives reinstalls, and nothing an editor extension legitimately does needs
# it. Together the fields are not diagnostics, they are an identifier for a
# specific machine and the person at it — which is only worth building if it is
# going somewhere.
#
# So the transport leg is required rather than assumed. Composed from the
# neutral capability atoms so it holds across the ways a fingerprint gets sent,
# and stated at the level of the *set* rather than any one API, so a variant
# that swaps `os.userInfo()` for `process.env.USER` still has to give up one of
# the four to escape it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1082,T1041
  mbc: B0024,E1082

composite_rules:
  - id: node-machine-fingerprint-posted
    desc: Posts a machine fingerprint off the host
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/hostname::node-os-alias-hostname-call
      - id: micro-behaviors/process/user/query::node-os-alias-userinfo-call
      - id: micro-behaviors/data/serialize/json
      - id: micro-behaviors/communications/http/request/client::post-method-text
    # MAC enumeration moved out of `all:`. What the rule needs is evidence the
    # profile is identifying rather than incidental, and a MAC address is one
    # way to establish that -- not the only one. Requiring it pinned the rule to
    # one campaign's choice of fields and missed profiles built the commoner
    # way, from platform, arch, release and type alongside the hostname and
    # user. The `@navancorp` set posts exactly that shape and went unconvicted.
    any:
      - id: micro-behaviors/os/network/interface::node-mac-address-enumeration
      - id: objectives/discovery/system/fingerprint/hardware::node-short-os-alias-profile
      # Walking `os.networkInterfaces()` to collect the host's addresses is the
      # same class of evidence as reading its MAC -- it is what makes the
      # profile identify a machine rather than describe a platform. The
      # `blocks-nextjs` set gathers hostname, user, cwd and every interface
      # address, and was missed while the group named only the other two.
      - id: micro-behaviors/os/network/interface::node-network-interfaces-call
