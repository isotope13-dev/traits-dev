# A build-plugin register entry that bundles the developer's user identity and
# working directory with the host snapshot for the same concealed endpoint.
#
# The shape: an exported register function (advertised for bundler `plugins:
# [...]` arrays) logs a `package_load` event carrying `process.cwd()`,
# `process.pid`, and the full `collectOsInfo()` snapshot — hostname, OS user
# (with a `USER`/`USERNAME` environment fallback), home directory, CPU and
# memory — to a Loggly transport whose token and subdomain are Base64-decoded
# at runtime. The cwd/pid legs are the activation-context tell: crash
# reporters send errors, not the shell's working directory beside a username.
# Sibling victim beacons cover curl/fetch exfil; this is the logging-transport
# variant, so the transport plus runtime-decode legs carry the channel.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041
composite_rules:
  - id: plugin-register-user-cwd-loggly-beacon
    desc: Plugin load beacons user identity to Loggly
    conf: 0.96
    scope: archive
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/process/info/current::node-process-pid-access
      - id: micro-behaviors/communications/http/services/loggly::loggly-transport-construction
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: metadata/path::test-directory-component
