# Install-time reconnaissance that asks which *organisation* the machine
# belongs to, then encodes the answer before sending it.
#
# `systeminfo` parsed for "Registered Organization", the external address from
# `curl ipinfo.io`, the hostname and the username — joined and hex-encoded. The
# organisation field is the tell. Hostname and username identify a machine;
# the registered organisation identifies a *company*, and it is the field that
# turns a list of infected developers into a target list. Nothing a package
# needs at install time is answered by it.
#
# The hex step is not obfuscation of the code — the code is in the clear — it is
# obfuscation of the traffic: a single opaque token instead of recognisable
# hostnames and company names crossing the wire, which is what a DNS label or a
# URL path can carry without looking like anything.
#
# Composed from capabilities so it holds for the `wmic`/PowerShell spellings of
# the same questions, and for base64 or base32 in place of hex.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1082,T1016,T1027
  mbc: B0024,E1082

composite_rules:
  - id: windows-org-fingerprint-encoded
    desc: Encodes org, host and user reconnaissance
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/command::windows-systeminfo-command-string
      # Directory references: the host and user questions have several
      # spellings, and this sample passes `os.hostname` as a function reference
      # (`safeGet(os.hostname)`) rather than calling it, so a call-shaped atom
      # misses it. Which spelling is used is not the signal.
      - id: micro-behaviors/os/sysinfo/hostname
      - id: micro-behaviors/process/user/query
      - id: micro-behaviors/process/create/shell/bridge::js-exec
    needs: 1
    any:
      - id: micro-behaviors/data/encode/hex::buffer-hex
      - id: micro-behaviors/data/encode/hex::js-to-string-hex
