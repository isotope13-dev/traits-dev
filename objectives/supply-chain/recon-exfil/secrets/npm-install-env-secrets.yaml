# A package whose install hook harvests the installing machine's environment
# secrets and ships them off the host.
#
# The install hook is what makes this a supply-chain attack rather than a
# script a user chose to run: `npm install` executes it unprompted, on a
# developer workstation or a CI runner whose environment holds the cloud and
# registry credentials the pipeline was granted. Nothing about the package's
# advertised function is involved.
defaults:
  platforms: [unix]
  for: [npm]
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1020

composite_rules:
  - id: install-hook-env-secret-exfiltration
    desc: Install hook exfiltrates environment secrets
    crit: hostile
    conf: 0.97
    # archive scope: the hook is declared in package.json, the pipeline lives
    # in the script it runs.
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/exfiltration/stealer/credential/env::env-secret-dump-piped-to-network-client
