# GitHub Actions Secret Exfiltration Detection
# ATT&CK: T1552.001 (Credentials In Files)
# Detects GitHub Actions workflows that exfiltrate secrets or tokens
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: suspicious
  attack: "T1552.001"
traits:
- id: gha-printenv-github-token
  desc: Workflow greps GITHUB_TOKEN from printenv
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: 'printenv.{0,24}\|\s*grep.{0,24}GITHUB_TOKEN'

- id: gha-github-token-tmp-write
  desc: Workflow appends GITHUB_TOKEN into /tmp
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '\$GITHUB_TOKEN.{0,40}>>\s*/tmp/'

- id: gha-curl-continued-form-file
  desc: Workflow curl continues a form-file
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'curl[^\n]{0,90}\\\s*\n[ \t]{0,20}-F\s+["'']?[\w.-]{1,40}=@'
  # --- GitHub token exfil (atomic traits) ---
- id: wget-github-token
  desc: wget with GITHUB_TOKEN
  crit: suspicious
  conf: 0.95
  if:
    type: text
    # Same standalone-command guard as curl-github-token: reject `--wget`-style
    # flags and longer words containing wget.
    regex: '(^|[^\w-])wget\b.{0,100}(GITHUB_TOKEN|github\.token)'
  unless:
  - id: micro-behaviors/communications/http/services/github::workflow-github-com-slash-reference
  - type: text
    substr: "api.github.com/"
  - type: text
    substr: "ghcr.io/"
  - type: text
    substr: "GITHUB_API_URL"
  - type: text
    regex: 'wget[^\n]{0,160}\$\{\{\s*github\.[a-z0-9_.]*url[^\n}]*\}\}'
  - id: micro-behaviors/communications/http/token-auth::workflow-github-token-auth-header
  - id: micro-behaviors/communications/http/auth::workflow-secret-bearer-auth
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish
- id: fetch-github-token
  desc: Fetch request body contains GitHub token
  crit: suspicious
  conf: 0.95
  if:
    # A fetch-shaped mention alone is now neutral source metadata. Require
    # the token after a request-body selector to retain token-upload coverage.
    type: text
    regex: '\bfetch\s*\([^\n]{0,100}\bbody\s*:[^\n]{0,60}(GITHUB_TOKEN|github\.token)'
  unless:
  - id: micro-behaviors/communications/http/services/github::github-api-host
- id: http-github-token
  desc: http with GITHUB_TOKEN
  crit: suspicious
  conf: 0.95
  if:
    # Require an actual request call (not the prose word "request(s)", which
    # matched workflow comments like "Pull requests … using the GITHUB_TOKEN").
    type: text
    regex: '(http[s]?\.request|axios\s*[.(])[^\n]{0,100}(GITHUB_TOKEN|github\.token)'
  unless:
    # Sending the token to GitHub''s own API is the legitimate Action pattern.
  - id: micro-behaviors/communications/http/services/github::github-api-host
  # === Suspicious External Requests ===
- id: curl-with-secrets-marker
  desc: HTTP request with secrets marker nearby
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '\$\{\{\s*secrets\.[^\n]{0,80}curl\b'
  unless:
    - id: well-known/tool/detection/
    - id: metadata/build/ci/github-actions::action-testdata-path
    - id: metadata/file/naming::test-directory-component
    # Same neutral discriminator as curl-github-token: a secret used as an
    # HTTP Authorization/Bearer credential is the standard API-auth pattern
    # (release bots, repository_dispatch triggers), not exfil staging.
    - id: micro-behaviors/communications/http/auth::workflow-secret-bearer-auth
  # === Webhook Abuse ===
- id: discord-webhook-secrets
  desc: Secrets sent to Discord webhook
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'discord(app)?\.com/api/webhooks.{0,100}\$\{\{\s*secrets\.'
  unless:
  - type: text
    regex: 'discord(app)?\.com/api/webhooks/(\d{15,21}/)?\$\{\{\s*secrets\.'
- id: curl-or-wget-cmd--wget
  desc: curl or wget invocation (wget)
  crit: component
  conf: 0.97
  if:
    type: text
    word: wget
composite_rules:
# "Uploads the secrets as an artifact" means one step writes the serialized
# secrets and the next uploads it. Held file-wide, any workflow that maps
# secrets into the environment for a test job AND separately uploads logs
# matched: kedacore/keda's pr-e2e.yml has 5275 bytes between the two, and was
# reported hostile.
- id: github-actions-secret-artifact-exfil
  desc: Uploads serialized GitHub Actions secrets as an artifact
  crit: hostile
  conf: 0.99
  mbc: "E1020"
  attack: T1552.001,T1041
  near_bytes: 400
  all:
  - id: objectives/credential-access/env/secrets/cicd::complete-secrets-json-expression
  - id: metadata/build/ci/step::actions-upload-artifact
  unless:
  - id: well-known/tool/development/ci/github-actions/secrets-to-env-action::action-step-reference
- id: github-actions-secret-artifact-cleanup
  desc: Deletes the workflow run after capturing Actions secrets
  crit: hostile
  conf: 0.99
  mbc: "E1020"
  attack: T1070.008,T1552.001
  all:
  - id: objectives/credential-access/env/secrets/cicd::complete-secrets-json-expression
  - id: metadata/build/ci/step::actions-upload-artifact
  - id: metadata/build/ci/step::workflow-run-delete-command
  # === GitHub Token Exfil (composite of atomic traits) ===
- id: curl-or-wget-cmd
  desc: curl or wget invocation
  crit: component
  conf: 0.97
  any:
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  - id: curl-or-wget-cmd--wget
- id: secrets-to-webhook
  desc: Secrets sent to webhook URL
  crit: suspicious
  conf: 0.95
  near_bytes: 300
  all:
  - id: micro-behaviors/communications/http/webhook::run-webhook-url
  - id: metadata/build/ci/secret::run-secret-reference
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish
  # === Secret Exfiltration ===

- id: gha-quoted-unquoted-secret-post
  desc: Workflow posts secrets in quoted and unquoted curl bodies
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/request/credentials::secrets-in-curl
  - id: micro-behaviors/communications/http/request/credentials::secrets-in-http-body
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish

- id: gha-oast-secret-post
  desc: Workflow posts an Actions secret to an OAST callback
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/host/oob::manifest-oast-fun-reference
  any:
  - id: micro-behaviors/communications/http/request/credentials::secrets-in-curl
  - id: micro-behaviors/communications/http/request/credentials::secrets-in-http-body
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish


- id: gha-runtime-token-form-exfil
  desc: Workflow dumps tokens and uploads keys
  crit: hostile
  conf: 0.97
  all:
  - id: gha-curl-continued-form-file
  any:
  - id: gha-printenv-github-token
  - id: gha-github-token-tmp-write
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish

- id: gha-runner-token-tmp-dump
  desc: Workflow dumps GITHUB_TOKEN into /tmp
  crit: hostile
  conf: 0.96
  all:
  - id: gha-printenv-github-token
  - id: gha-github-token-tmp-write

- id: gha-form-upload-tmp-token
  desc: Workflow uploads files and dumps GITHUB_TOKEN
  crit: hostile
  conf: 0.96
  all:
  - id: gha-curl-continued-form-file
  - id: gha-github-token-tmp-write
- id: secrets-tojson-http-post
  desc: Posts complete GitHub Actions secrets
  crit: suspicious
  conf: 0.97
  near_bytes: 300
  all:
  - id: objectives/credential-access/env/secrets/cicd::complete-secrets-json-expression
  - id: curl-or-wget-cmd
- id: env-secret-json-to-webhook
  desc: Sends secret JSON to webhook
  crit: suspicious
  conf: 0.96
  near_bytes: 260
  all:
  - id: objectives/credential-access/env/secrets/cicd::complete-secrets-json-expression
  - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path
