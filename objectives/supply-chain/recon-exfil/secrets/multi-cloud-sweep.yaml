# A package payload that sweeps several cloud and CI credential sources and
# then re-launches itself detached.
#
# The Shai-Hulud family bundles the real AWS, GCP and Azure SDKs so it can ask
# each provider's secret store for everything the host can reach, reads the CI
# runner's environment on the way past, and launches a detached child with a
# `__DAEMONIZED` guard so the harvest outlives the install that started it.
# The compromised @bitwarden/cli 2026.4.0 shipped a 10MB bundle of exactly
# this.
#
# Bundling multi-cloud SDKs is not by itself suspect -- a legitimate secrets
# tool looks identical up to that point, which is why the cloud legs alone
# prove nothing. Detaching a copy of yourself is what no such tool does, and
# pairing the two is what separates a credential manager from a credential
# harvester.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1526
  mbc: E1552

composite_rules:
  - id: detached-multi-cloud-credential-sweep
    desc: Detached payload sweeps cloud credential stores
    crit: hostile
    conf: 0.95
    all:
      # The payload arranges to outlive its parent.
      - id: micro-behaviors/process/create/spawn::daemon-guarded-detached-child
    # Two independent providers, or one provider plus the CI runner's
    # environment. One alone is ordinary SDK usage.
    needs: 2
    any:
      - id: objectives/credential-access/env/secrets/cloud-access::aws-secret-env-access
      - id: objectives/credential-access/cloud/token/files::gcp-secretmanager-api
      - id: micro-behaviors/os/security/auth/cloud::node-aws-container-metadata-ip
      - id: metadata/file/string/cloud::cloud-instance-metadata-link-local-host
      - id: micro-behaviors/os/env/vars/cicd::process-env-github-actions
    unless:
      - id: metadata/package/testing/harness/runtime/
