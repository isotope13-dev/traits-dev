defaults:
  platforms: [unix]
  for: [github-actions]
composite_rules:
  - id: encoded-secrets-dump-with-artifact-upload
    desc: Secrets export with encoded dump and artifact
    crit: suspicious
    conf: 0.98
    # Do not infer the artifact's path from file-wide cooccurrence. The
    # value matcher supplies no span, so near_bytes cannot constrain it.
    all:
      - id: micro-behaviors/os/env/pipeline::env-dump-base64-file-pipeline
      - id: metadata/build/ci/step::actions-upload-artifact
    any:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: metadata/build/ci/secret::step-environment-secret-reference
      - id: metadata/build/ci/secret::registry-publish-secret-reference
  - id: gha-secret-env-base64-tmp-artifact-exfil
    desc: Workflow dumps secret env to temp artifact
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1560.001,T1567
    all:
      - id: metadata/build/ci/secret::step-environment-secret-reference
      - id: micro-behaviors/os/env/pipeline::env-dump-base64-file-pipeline
      - id: micro-behaviors/os/env/dump::gha-base64-environment-file-pipeline
      - id: metadata/build/ci/step::actions-upload-artifact
