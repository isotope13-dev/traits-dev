defaults:
  platforms:
    - unix
    - windows
composite_rules:
  - id: github-actions-targeting
    desc: GitHub Actions runner inspection or token pattern
    # Runner process-inspection evidence or a token pattern identifies the
    # subject; harvesting composites add memory access or exfiltration.
    crit: notable
    conf: 0.9
    any:
      - id: objectives/discovery/process/targeting::github-runner-targeting
      - id: objectives/credential-access/theft/keywords::github-actions-token-regex
    unless:
      - id: metadata/package/testing/presence/path::shell-test-fixture-source
  - id: github-actions-memdump-downloader
    desc: Downloads and executes GitHub Actions memory dumper
    crit: hostile
    conf: 0.97
    attack: T1003
    for:
      - shell
      - javascript
      - typescript
    all:
      - id: well-known/tool/offensive/memdump::memdump-py-download
      - id: micro-behaviors/process/create/shell/spawn::sudo-piped-script-exec
  - id: github-actions-memdump-webhook-exfil
    desc: GitHub Actions memory dump webhook exfiltration
    crit: hostile
    conf: 0.99
    attack: "T1003, T1041"
    for:
      - shell
    all:
      - id: github-actions-memdump-downloader
      - id: micro-behaviors/communications/http/post::curl-webhook-post
      - id: micro-behaviors/data/decode/base64::double-base64-decode
  - id: github-runner-memory-dumper
    desc: Dumps GitHub Actions Runner memory
    crit: suspicious
    conf: 0.95
    for: [scripts, binaries]
    any:
      - id: github-actions-memdump-downloader
    all:
      - id: github-actions-targeting
  - id: github-actions-secret-harvest
    desc: Harvests secrets from GitHub Actions
    crit: hostile
    conf: 0.95
    for: [shell, javascript]
    all:
      - id: github-actions-memdump-downloader
      - id: github-actions-targeting
