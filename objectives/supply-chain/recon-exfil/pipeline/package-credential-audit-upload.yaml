defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: multiple-credential-store-sources
    desc: Multiple developer credential store sources
    crit: suspicious
    conf: 0.95
    any:
      # API-key labels and redaction vocabularies are configuration/UI data,
      # not evidence that a package read a credential store. Keep concrete
      # store, history, and key-file accesses as the multi-source legs.
      - id: micro-behaviors/data/db/sql::browser-record-table-select
      - id: micro-behaviors/fs/path/personal::shell-history-file-path
      - id: objectives/credential-access/ssh/key::node-ssh-private-key-command
    needs: 2
    unless:
      - id: micro-behaviors/os/security/policy::sensitive-path-deny-policy-context
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-package-context
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-npm-package-context
      - id: well-known/lib/runtime/scripted/sandbox-runtime::protected-path-denylist
      - id: metadata/package/testing/corpus::rule-test-case-detection-verdicts

  - id: package-credential-store-audit-upload
    desc: Package audits multiple developer credential stores and sends data by HTTP
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: multiple-credential-store-sources
    any:
      - id: micro-behaviors/communications/http/request/credential-body-flow::fetch-options-db-result-json-body
      - id: micro-behaviors/communications/http/upload::file-http-body-flow
    unless:
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-package-context
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-npm-package-context
      - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
