# GitHub Actions pull_request_target exploitation payload shapes observed in
# automated PR campaigns. These traits avoid campaign names and focus on the
# reusable mechanics: log-based token exfil, Actions API recon, temp workflow
# dispatch attempts, and delayed /proc environment scraping.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, typescript, rust, github-actions]
  attack: "T1195.002, T1552.001"

traits:
- id: gha-env-gzip-base64-log
  desc: GitHub environment gzip base64 log
  crit: suspicious
  conf: 0.94
  for: [shell]
  if:
    type: text
    regex: '\benv\b[\s\S]{0,260}\bgzip\s+-c\s*\|\s*base64|gzip\s+-c\s*\|\s*base64[\s\S]{0,260}\benv\b'

- id: gha-extraheader-gzip-base64-log
  desc: GitHub checkout token base64 log
  crit: suspicious
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: 'http\.https://github\.com/\.extraheader[\s\S]{0,260}gzip\s+-c\s*\|\s*base64'

- id: python-proc-environ-loop--rx-7
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: 'os\.listdir\s*\(\s*[''"]/proc[''"]\s*\)[\s\S]{0,600}/proc/\{?pid\}?/environ'

- id: python-proc-environ-loop--rx-8
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: '/proc/\{?pid\}?/environ[\s\S]{0,600}os\.listdir\s*\(\s*[''"]/proc[''"]\s*\)'

composite_rules:
- id: gha-log-token-exfil
  for: [shell]
  desc: GitHub token exfiltrated through logs
  crit: hostile
  conf: 0.99
  all:
  - id: gha-env-gzip-base64-log
  - id: gha-extraheader-gzip-base64-log

- id: gha-temp-workflow-secret-capture
  for: [shell, python, javascript, githubactions]
  desc: Temporary workflow secret capture
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/services/github::github-workflow-file-write-api
  - id: micro-behaviors/communications/http/services/github::github-workflow-dispatch-api
  any:
  - id: micro-behaviors/communications/http/services/github::github-actions-secret-inventory-endpoint
  - id: gha-interesting-secret-keywords
  - id: metadata/build/ci/secret::multiple-secret-references

- id: gha-delayed-proc-env-comment-exfil
  for: [python]
  desc: Delayed proc environment PR exfil
  crit: hostile
  conf: 0.99
  all:
  - id: python-proc-environ-loop
  - id: micro-behaviors/communications/http/services/github::github-issue-comment-api
  - id: gha-interesting-secret-keywords
- id: gha-interesting-secret-keyword-list
  desc: High-value secret variable name
  crit: component
  conf: 0.9
  any:
  - id: objectives/credential-access/theft/keywords::npm-docker-credential-var-name
  - id: micro-behaviors/os/env/secret-name::cloudflare-database-credential-var-name
  - id: micro-behaviors/os/env/ai-provider::netlify-openai-credential-var-name
  - id: objectives/credential-access/theft/keywords::ssh-key-credential-var-name
  - id: micro-behaviors/os/env/cloud::aws-secret-access-key-var
  - id: micro-behaviors/os/env/cloud::aws-env-secret-vars
  - id: micro-behaviors/os/env/ssh::ssh-private-key-dup
  - id: micro-behaviors/os/env/ai-provider::anthropic-api-key-name-reference
  - id: micro-behaviors/os/env/ai-provider::gemini-api-key-name-reference
  - id: micro-behaviors/os/env/ai-provider::anthropic-auth-token-variable
  unless:
  - id: well-known/lib/ai/
- id: gha-interesting-secret-keywords
  desc: High-value secret names with GitHub Actions API activity
  crit: suspicious
  conf: 0.94
  all:
  - id: gha-interesting-secret-keyword-list
  any:
  - id: micro-behaviors/communications/http/services/github::github-actions-secret-inventory-endpoint
  - id: micro-behaviors/communications/http/services/github::github-workflow-dispatch-api
  unless:
  - id: well-known/tool/development/toolchain/deno::source-archive-context
- id: python-proc-environ-loop
  desc: Python loops over proc environments
  crit: suspicious
  conf: 0.94
  for: [python]
  any:
  - id: python-proc-environ-loop--rx-7
  - id: python-proc-environ-loop--rx-8
