# Build-time MSBuild target sends the machine hostname in an HTTP request.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1041

traits:
- id: msbuild-before-build-target
  desc: MSBuild target runs before Build
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '<Target\b[^>]{0,120}BeforeTargets=["'']Build'

- id: msbuild-http-download-source
  desc: MSBuild DownloadFile has HTTP source
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '<DownloadFile\b[^>]{0,120}SourceUrl=["'']https?://'

- id: msbuild-hostname-in-request
  desc: MSBuild request references machine hostname
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(\$\(COMPUTERNAME\)|%COMPUTERNAME%)'

composite_rules:
- id: msbuild-build-hostname-request
  desc: Build request sends machine hostname
  crit: suspicious
  conf: 0.95
  all:
  - id: msbuild-before-build-target
  - id: msbuild-http-download-source
  - id: msbuild-hostname-in-request
  near_lines: 3
