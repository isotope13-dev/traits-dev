# Build-time MSBuild target sends the machine hostname in an HTTP request.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1041

traits:
- id: dependency-confusion-canary-disclosure
  desc: Declares dependency-confusion canary
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: 'dependency-confusion security canary'
- id: authorized-supply-chain-assessment-disclosure
  desc: Declares authorized supply-chain assessment
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: 'authorized supply-chain security assessment'

- id: msbuild-before-build-target
  desc: MSBuild target runs before Build
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '<Target\b[^>]{0,120}BeforeTargets=["'']Build'

composite_rules:
- id: disclosed-msbuild-canary
  desc: Disclosed authorized canary
  crit: exception
  all:
  - id: dependency-confusion-canary-disclosure
  - id: msbuild-before-build-target

- id: msbuild-build-hostname-request
  desc: MSBuild build hook sends the machine hostname over HTTP
  crit: notable
  conf: 0.95
  all:
  - id: msbuild-before-build-target
  - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-http-source
  - id: micro-behaviors/os/sysinfo/hostname::msbuild-computername-property
  unless:
  - id: disclosed-msbuild-canary
  near_lines: 3
