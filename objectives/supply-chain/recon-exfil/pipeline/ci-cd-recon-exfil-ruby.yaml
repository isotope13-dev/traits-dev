# A package declaration plus bound credential-to-HTTP-body flow establishes
# the supply-chain theft claim. CI variable names beside unrelated networking
# do not establish exfiltration or CI targeting.
defaults:
  conf: 0.95
  platforms: [unix, windows]
  crit: hostile
  attack: T1195.001
  for: [ruby]
composite_rules:
  - id: gem-credential-theft
    for: [ruby, gem]
    desc: Ruby gem sends CI/CD credentials off-service
    attack: "T1552.001"
    scope: outer
    all:
      - id: micro-behaviors/os/env/ci-credentials::ruby-ci-credential-env-references
      - id: metadata/package/config::gemspec-name-assignment
    any:
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-sensitive-env-json-net-http-post-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-filtered-env-json-net-http-request-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-marker-filtered-env-json-net-http-post-body
    unless:
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
