# CI/CD Reconnaissance + Exfiltration - Ruby
# Detects RubyGems supply chain attacks targeting CI/CD environments
# ATT&CK: T1195.001 (Supply Chain Compromise: Compromise Software Dependencies)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: hostile
  attack: "T1195.001"
  for: [ruby]
composite_rules:
  # =====================================================
  # HTTP EXFILTRATION (Net::HTTP, HTTParty, etc.)
  # =====================================================
  - id: gem-runner-recon-http
    desc: Ruby gem exfiltrates CI/CD info via HTTP
    conf: 0.95
    attack: "T1041"
    all:
      - id: objectives/discovery/system/fingerprint/cicd::ruby-runner-fingerprinting
    any:
      - id: micro-behaviors/communications/http/request/client::net-http-post
      - id: micro-behaviors/communications/http/request/client::net-http-get-dup
  # =====================================================
  # DNS EXFILTRATION (Resolv)
  # =====================================================
  - id: gem-runner-recon-dns
    desc: Ruby gem exfiltrates CI/CD info via DNS
    conf: 0.95
    attack: "T1048.003"
    all:
      - id: objectives/discovery/system/fingerprint/cicd::ruby-runner-fingerprinting
    any:
      - id: micro-behaviors/communications/dns/lookup/resolver::dns-resolve
  # =====================================================
  # GEM CREDENTIAL THEFT
  # =====================================================
  # Mere co-occurrence of a CI/CD token read and a network client is not
  # credential theft: release tooling routinely checks GITHUB_TOKEN before
  # making unrelated downloads or invoking an authenticated publisher. Require
  # the proven Ruby flow that filters environment credentials, serializes the
  # result, and supplies it to a Net::HTTP POST. The gemspec leg establishes
  # that this is package supply-chain code rather than a standalone Ruby tool.
  - id: gem-credential-theft
    desc: Ruby gem sends CI/CD credentials off-service
    conf: 0.95
    attack: "T1552.001"
    scope: outer
    all:
      - id: objectives/credential-access/env/secrets/cicd::ruby-cicd-credential-access
      - id: objectives/exfiltration/stealer/credential/env::ruby-environ-json-net-http-exfil
      - id: metadata/package/config::gemspec-name-assignment
    unless:
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/jruby::runtime-context
  - id: gem-supply-chain-signal
    desc: Ruby gem CI/CD targeting signal
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: objectives/discovery/system/fingerprint/cicd::ruby-runner-fingerprinting
      - id: objectives/credential-access/env/secrets/cicd::ruby-cicd-credential-access
    unless:
      - id: well-known/lib/runtime/jruby/
      - id: well-known/lib/runtime/jruby::archive-basename
      - id: well-known/lib/runtime/jruby::embedded-runtime-path
      - id: well-known/lib/runtime/jruby::embedded-runtime-member
      - id: well-known/lib/runtime/jruby::embedded-runtime-member
  - id: gem-supply-chain-egress
    desc: Ruby gem outbound egress signal
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/request/netlib::net-http-write-request
      - id: micro-behaviors/communications/http/lib/netlib::request-ruby
      - id: micro-behaviors/communications/dns/lookup/resolver::dns-resolve
      - id: gem-runner-recon-http
      - id: gem-runner-recon-dns
      - id: gem-credential-theft
  # =====================================================
  # COMBINED DETECTION
  # =====================================================
  - id: gem-supply-chain-attack
    desc: RubyGems supply chain attack targeting CI/CD
    conf: 0.95
    all:
      - id: gem-supply-chain-signal
      - id: gem-supply-chain-egress
    unless:
      - id: well-known/lib/runtime/jruby/
      - id: well-known/lib/web/thor::actions-file-generator
      - id: well-known/lib/development/bundler::bundler-package-manager-context
