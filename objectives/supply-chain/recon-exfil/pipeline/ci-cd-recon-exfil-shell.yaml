# CI/CD Reconnaissance + Exfiltration - Shell
# Detects CI/CD pipeline injection attacks via shell scripts
# ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain)
defaults:
  platforms: [linux, unix, macos, android, ios]
  crit: suspicious
  attack: "T1195.002"
  for: [shell]
composite_rules:
  # =====================================================
  # CURL/WGET EXFILTRATION
  # =====================================================
  - id: shell-runner-recon-curl
    desc: Shell posts a CI token directly in curl request data
    conf: 0.95
    attack: "T1041"
    all:
      - id: objectives/credential-access/env/secrets/cicd::sh-github-token
      - id: objectives/supply-chain/trojanized/ci-pipeline::curl-data-token-var
    unless:
      - id: well-known/tool/development/ci/codecov::official-bash-uploader
      - id: well-known/app/data/lightdash::lightdash-anonymous-install-tracking
      - id: metadata/package/files/archive-member::openshift-release-ci-step-context
  # =====================================================
  # ENV DUMP TO EXTERNAL
  # =====================================================
  # socketio::client is a javascript-only bundle fingerprint (the
  # Socket.IO version banner) -- the token leak lives in a shell step while
  # the bundled Socket.IO client is a JS payload alongside it in the same
  # package/workflow, the same shai-hulud-style pairing used with
  # scope: archive elsewhere (see hidden-payload/exec/behavioral.yaml).
  - id: shell-env-dump-exfil
    desc: Shell dumps environment to external server
    conf: 0.95
    attack: "T1552.001"
    scope: archive
    for: [shell, javascript, npm, package.json]
    any:
      - id: objectives/credential-access/env/secrets/cicd::sh-github-token
    all:
      - id: well-known/lib/network/socketio::client
  # =====================================================
  # SYSTEM FINGERPRINT + EXFIL
  # =====================================================
  # =====================================================
  # CI/CD PIPELINE INJECTION
  # =====================================================
  - id: cicd-pipeline-injection
    desc: GitHub Actions shell evaluates a CI variable
    conf: 0.95
    crit: suspicious
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-github-variable
    unless:
      - id: well-known/tool/development/ci/codecov::official-bash-uploader

  - id: shell-ci-git-history-secret-exfil
    desc: Shell script in CI harvests Git history secrets and exfiltrates via curl
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1552.001,T1041"
    mbc: "E1020,E1041"
    all:
      - id: micro-behaviors/os/env/cicd::sh-github-repository
      - id: objectives/credential-access/files/secret-sweep::git-history-credential-pattern-scan
      - id: micro-behaviors/communications/http/upload::curl-data-binary
