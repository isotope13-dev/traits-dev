# CI/CD Reconnaissance + Exfiltration - JavaScript/Node.js
# Detects npm supply chain attacks targeting CI/CD environments
# ATT&CK: T1195.001 (Supply Chain Compromise: Compromise Software Dependencies)
defaults:
  platforms: [unix, windows]
  crit: hostile
  attack: "T1195.001"
  for: [javascript, typescript]
traits:
  - id: node-github-api-repo-contents-url
    desc: Node builds GitHub repo contents URL
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: '/repos/${repo}/contents/'
  - id: node-fetch-repo-contents-put
    desc: Node fetch PUT on repo contents API
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'contents/\$\{path\}`[\s\S]{0,280}method:\s*["'']PUT["'']'
composite_rules:
  # =====================================================
  # HTTP EXFILTRATION (fetch, axios, http)
  # =====================================================
  - id: npm-runner-profile-http
    for: [javascript, package.json, npm]
    desc: npm postinstall exfiltrates CI profile
    conf: 0.97
    attack: "T1041"
    size_max: 500000
    near_bytes: 4096
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/env/cicd::ci-environment-reference-context
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tunnel
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/build/ci/github-actions::actions-sdk
      - id: "metadata/file/naming::test-directory-component"
  - id: node-runner-profile-native-http
    desc: Node exfiltrates CI profile via HTTP
    conf: 0.98
    attack: "T1041"
    all:
      - id: micro-behaviors/os/env/cicd::process-env-github-repository
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tunnel
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/ci/github-actions::actions-sdk
      - id: "metadata/file/naming::test-directory-component"
  # =====================================================
  # DNS EXFILTRATION
  # =====================================================
  - id: npm-runner-recon-dns
    desc: npm package exfiltrates CI/CD tokens via DNS
    conf: 0.95
    attack: "T1048.003"
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/ci-credentials::javascript-ci-token-env-access
    # The DNS leg must build a query name, not just resolve one: any tool that
    # reads GITHUB_TOKEN for an authenticated API call and checks a domain
    # (an expired-maintainer-domain audit, a connectivity probe) otherwise
    # satisfies "token near a lookup" with no token anywhere near the wire.
    any:
      - id: micro-behaviors/communications/dns/label::javascript-dynamic-dns-label
    unless:
      - id: well-known/app/infrastructure/podman-desktop::macos-app-bundle
      - id: well-known/app/infrastructure/podman-desktop::bundled-resource
  # =====================================================
  # WEBHOOK EXFILTRATION
  # =====================================================
  - id: npm-runner-recon-webhook
    desc: CI/CD token embedded in a webhook request payload
    conf: 0.95
    attack: "T1567"
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/env/ci-credentials::javascript-ci-token-env-access
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
    any:
      - id: micro-behaviors/communications/http/webhook::generic-webhook-url
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-url
  - id: npm-postinstall-github-contents-ci-snapshot
    desc: npm postinstall commits CI host snapshot via GitHub API
    conf: 0.98
    attack: "T1195.002,T1041,T1082"
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    near_bytes: 12000
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/env/cicd::process-env-ci
      - id: micro-behaviors/os/env/cicd::process-env-github-workspace
      - id: micro-behaviors/os/env/cicd::process-env-github-repository
      - id: micro-behaviors/os/env/vcs::node-github-token-member
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: node-github-api-repo-contents-url
      - id: node-fetch-repo-contents-put
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/ci/github-actions::actions-sdk
  - id: npm-postinstall-probes-actions-oidc-mint
    desc: npm postinstall probes GitHub Actions OIDC mint
    conf: 0.97
    attack: "T1195.002,T1552.001"
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    near_bytes: 8000
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/env/cicd::process-env-ci
      - id: micro-behaviors/os/env/cicd::process-env-github-workspace
      - id: micro-behaviors/os/env/ci-credentials::actions-oidc-request-token-name
      - id: micro-behaviors/communications/http/download/curl::node-execsync-curl-download
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/ci/github-actions::actions-sdk
