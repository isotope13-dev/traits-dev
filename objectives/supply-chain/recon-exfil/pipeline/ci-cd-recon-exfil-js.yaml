# CI/CD Reconnaissance + Exfiltration - JavaScript/Node.js
# Detects npm supply chain attacks targeting CI/CD environments
# ATT&CK: T1195.001 (Supply Chain Compromise: Compromise Software Dependencies)
defaults:
  platforms: [unix, windows]
  crit: hostile
  attack: "T1195.001"
  for: [javascript, typescript]
composite_rules:
  # =====================================================
  # HTTP EXFILTRATION (fetch, axios, http)
  # =====================================================
  - id: npm-runner-profile-http
    for: [javascript, package.json, npm]
    desc: npm postinstall exfiltrates CI profile
    conf: 0.97
    attack: "T1041"
    size_max: 500000
    near_bytes: 4096
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: objectives/discovery/system/fingerprint/cicd::runner-fingerprinting
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tunnel
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/build/ci/github-actions::actions-sdk
      - id: "metadata/file/naming::test-directory-component"
  - id: node-runner-profile-native-http
    desc: Node exfiltrates CI profile via HTTP
    conf: 0.98
    attack: "T1041"
    all:
      - id: micro-behaviors/os/env/cicd::process-env-github-repository
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tunnel
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/ci/github-actions::actions-sdk
  # =====================================================
  # DNS EXFILTRATION
  # =====================================================
      - id: "metadata/file/naming::test-directory-component"
  - id: npm-runner-recon-dns
    desc: npm package exfiltrates CI/CD tokens via DNS
    conf: 0.95
    attack: "T1048.003"
    near_bytes: 8192
    all:
      - id: objectives/credential-access/env/secrets/cicd::js-cicd-token-access
    any:
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
    unless:
      - id: well-known/app/infrastructure/podman-desktop::macos-app-bundle
      - id: well-known/app/infrastructure/podman-desktop::bundled-resource
  # =====================================================
  # WEBHOOK EXFILTRATION
  # =====================================================
  - id: npm-runner-recon-webhook
    desc: CI/CD token embedded in a webhook request payload
    conf: 0.95
    attack: "T1567"
    near_bytes: 1024
    all:
      - id: objectives/credential-access/env/secrets/cicd::js-cicd-token-access
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
    any:
      - id: micro-behaviors/communications/http/webhook::generic-webhook-url
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-url
  # =====================================================
  # TOKEN THEFT + EXFILTRATION
  # =====================================================
  - id: npm-token-theft
    desc: npm package steals CI/CD tokens
    conf: 0.98
    attack: T1552.001
    near_bytes: 8192
    all:
    - id: objectives/credential-access/env/secrets/cicd::js-cicd-token-access
    any:
    - id: micro-behaviors/communications/http/client/
    - id: micro-behaviors/communications/http/request/client/
    - id: micro-behaviors/communications/http/post/
    - id: micro-behaviors/communications/http/request/verb/
    - id: micro-behaviors/communications/http/request/url/
    - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
    - id: objectives/exfiltration/messaging/
    - id: objectives/exfiltration/stealer/file::file-search-telegram-send
    - id: objectives/exfiltration/stealer/wallet::wallet-search-telegram-send
    unless:
    - id: well-known/tool/detection/
    - id: well-known/tool/development/
    - id: micro-behaviors/communications/http/services/github/
    - id: objectives/credential-access/env/secrets/npm-registry/
    - id: micro-behaviors/os/env/package-manager::node-registry-token-env-read
    - id: metadata/build/ci/github-actions/
    - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
    - id: well-known/tool/sysadmin/gh-aw-actions/
