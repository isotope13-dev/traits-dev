# Magento modules that phone home install and heartbeat telemetry during setup.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1195.002,T1041
  mbc: E1041

traits:
  - id: php-magento-install-reporter-class
    desc: PHP Magento install reporter service class
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'class\s+InstallReporter\b'

  - id: php-magento-module-version-payload-field
    desc: Payload includes magento_version field
    crit: component
    conf: 0.92
    if:
      type: text
      substr: magento_version

  - id: php-install-notification-endpoint-path
    desc: Install or heartbeat notify endpoint path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'notifications/(install|heartbeat)'

composite_rules:
  - id: magento-module-install-telemetry-exfil
    desc: Magento module phones home install telemetry
    crit: hostile
    conf: 0.98
    all:
      - id: php-magento-install-reporter-class
      - id: php-install-notification-endpoint-path
      - id: micro-behaviors/communications/http/curl::php-curl-request
      - id: micro-behaviors/data/serialize/json::php-json-encode
      - id: php-magento-module-version-payload-field

  - id: archive-magento-install-telemetry-module
    desc: Archive ships Magento install telemetry module
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, tar, archives]
    all:
      - id: magento-module-install-telemetry-exfil
      - id: metadata/package/manifest/ecosystem::composer-package-manifest
