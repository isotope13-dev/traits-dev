# Package registries can be abused as public data drops: collect remote data,
# place it inside a freshly built package, then publish that package. The atoms
# deliberately describe mechanics rather than campaign names or victim hosts.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  attack: "T1041,T1195.002"

composite_rules:
  - id: rubygems-registry-data-exfil
    desc: Fetched data is republished through RubyGems
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: objectives/supply-chain/credential-theft/registry::hardcoded-rubygems-token
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call
    # Either spelling assembles the archive that gets pushed: the `gem build`
    # command line, or the in-process RubyGems API the campaign payloads used.
    any:
      - id: micro-behaviors/process/create/shell/build::rubygems-build-system-call
      - id: micro-behaviors/data/archive/create/package::gem-package-build-call

  - id: embedded-rubygems-credential-publish
    desc: Embedded RubyGems token drives package publication
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1552.001"
    near_bytes: 8192
    all:
      - id: objectives/supply-chain/credential-theft/registry::hardcoded-rubygems-token
      - id: micro-behaviors/fs/write/credential::ruby-writes-rubygems-credentials
      - id: micro-behaviors/os/env/modify::ruby-assigns-home-environment
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call

  - id: rubygems-direct-api-publish
    desc: Embedded token publishes a gem through HTTP
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1552.001"
    near_bytes: 8192
    all:
      - id: objectives/supply-chain/credential-theft/registry::hardcoded-rubygems-token
      - id: objectives/supply-chain/credential-theft/registry::rubygems-push-api-path
      - id: micro-behaviors/communications/http/post::ruby-octet-stream-post
      - id: micro-behaviors/fs/read/file/full::ruby-file-binread-content

  - id: rubygems-direct-api-data-exfil
    desc: Fetched data is packaged and directly uploaded
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: rubygems-direct-api-publish
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
      - id: metadata/package/config::gemspec-name-assignment

  # The scraping-proxy shape. The payload does not send collected data to a
  # host it controls: it mints a *new* package per batch and pushes that, so
  # the registry both stores and hands back the result. Two things distinguish
  # it from the token-gated rules above and are what a future variant keeps.
  # The gem name is assembled at run time, because every upload needs a free
  # coordinate; and the archive is assembled through the RubyGems API, so no
  # `gem build` command line exists to match. No credential leg: code already
  # running on a build worker inherits a publishing key from the environment
  # or ~/.gem/credentials and has no reason to embed one.
  - id: rubygems-generated-package-data-drop
    desc: Fetched content is minted as a new gem and pushed
    crit: hostile
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
      - id: metadata/package/config::gemspec-interpolated-name
      - id: micro-behaviors/data/archive/create/package::gem-package-build-call
    any:
      - id: objectives/supply-chain/credential-theft/registry::rubygems-push-api-path
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call

  - id: packaged-rubygems-republisher
    desc: RubyGem package builds and publishes another gem
    crit: suspicious
    conf: 0.98
    attack: T1195.002
    for: [gem, tar, zip]
    scope: outer
    all:
      - id: metadata/package/ecosystem::rubygems-spec-yaml-marker
      - id: metadata/package/config::gemspec-name-assignment
      - id: micro-behaviors/process/create/shell/build::rubygems-build-system-call
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call
