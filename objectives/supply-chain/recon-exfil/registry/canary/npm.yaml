defaults:
  for: [manifests, data]
  platforms: [unix, windows]
  attack: "T1195.002"

traits:
- id: optional-canary-dependency-name
  desc: Optional dependency is named canary
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '"canary"\s*:\s*"https?://'

- id: httpworkbench-canary-tarball
  desc: HTTPWorkbench canary tarball host
  crit: component
  conf: 0.99
  if:
    type: text
    regex: 'https://[a-z0-9]{8,64}\.instances\.httpworkbench\.com/[^" ]{1,160}\.tgz([?][^" ]{0,80})?'

- id: files-array-research-token
  desc: Package files array contains research token
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '"files"\s*:\s*\[\s*"DISCLOSURE"\s*\]'

- id: dual-use-content-policy-marker
  desc: Package declares dual-use content policy
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '"contentPolicy"\s*:\s*\{[^}]{0,120}"class"\s*:\s*"dual-use"'

- id: versioned-install-node-exit0
  desc: Install hook runs node then exits cleanly
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '"install"\s*:\s*"node\s+[A-Za-z0-9_./-]{1,80}\.js\s+\|\|\s+exit\s+0"'

- id: readme-beacon-url-env
  desc: Readme documents BEACON_URL exfil endpoint
  crit: suspicious
  conf: 0.95
  attack: "T1071.001"
  if:
    type: text
    substr: "BEACON_URL=https://"

- id: readme-collector-token-env
  desc: Readme documents collector token env var
  crit: suspicious
  conf: 0.94
  attack: "T1528"
  if:
    type: text
    substr: "CALLCENTER_COLLECTOR_TOKEN="

- id: readme-host-profile-fields
  desc: Readme lists host profiling fields
  crit: suspicious
  conf: 0.96
  attack: "T1082"
  if:
    type: text
    substr: "hostname, OS, cwd, Node version, timestamp"

- id: readme-install-and-require-beacon
  desc: Readme says telemetry runs on require too
  crit: suspicious
  conf: 0.97
  attack: "T1041"
  if:
    type: text
    substr: "on install and require"

- id: desc-security-canary-nonbreaking
  desc: "desc markets non-breaking security canary"
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "Security canary.{0,80}non-breaking"
    case_insensitive: true

composite_rules:
- id: npm-optional-canary-preparation
  desc: Tiny npm package prepares a canary through an optional remote tarball
  crit: hostile
  conf: 0.985
  mbc: "E1041"
  all:
  - id: metadata/package/dependencies/direct-url::npm-lone-optional-remote-tarball
  - id: optional-canary-dependency-name
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: metadata/package/description/presence::short-description

- id: npm-httpworkbench-disclosure-canary
  desc: Package prepares an HTTPWorkbench disclosure canary
  crit: hostile
  conf: 0.998
  mbc: "E1041"
  all:
  - id: npm-optional-canary-preparation
  - id: httpworkbench-canary-tarball
  - id: files-array-research-token
  - id: dual-use-content-policy-marker

- id: install-beacon-env-docs
  desc: Registry metadata documents install beacon endpoint and token
  crit: suspicious
  conf: 0.98
  all:
  - id: readme-beacon-url-env
  - id: readme-collector-token-env
  - id: readme-host-profile-fields

- id: dependency-confusion-install-canary
  desc: Dependency confusion canary with install-time telemetry
  crit: hostile
  conf: 0.995
  mbc: "E1041"
  all:
  - id: versioned-install-node-exit0
  - id: install-beacon-env-docs
  - id: readme-install-and-require-beacon
  any:
  - id: desc-security-canary-nonbreaking
  - id: objectives/supply-chain/impersonation/registry/manifest::readme-dep-confusion-self-id
  - id: objectives/supply-chain/impersonation/registry/manifest::desc-harmless-canary-claim
- id: tiny-public-install-probe
  desc: Tiny public package whose install hook acts as a probe
  crit: suspicious
  conf: 0.98
  all:
  - id: versioned-install-node-exit0
  - id: desc-security-canary-nonbreaking
  any:
  - id: metadata/package/publishing::npm-public-publish-access
  - id: objectives/supply-chain/impersonation/registry/manifest::dist-filecount-1-to-4
  - id: objectives/supply-chain/impersonation/registry/manifest::dist-unpacked-under-4kb
  - id: objectives/supply-chain/impersonation/registry/manifest::inflated-version-90plus
  needs: 2
