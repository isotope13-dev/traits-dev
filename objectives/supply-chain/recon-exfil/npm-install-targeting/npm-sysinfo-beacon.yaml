# NPM Install-Triggered Recon + Exfiltration
# Detects npm packages that perform system reconnaissance and exfiltrate
# host information via HTTPS POST during package installation.
# ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain),
#         T1082 (System Information Discovery), T1041 (Exfiltration Over C2 Channel)
# MBC: E1041
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]

traits:
  # === C2 Domain Detection ===
- id: resolver-io-net-c2
  desc: References resolver-io.net C2 domain
  crit: suspicious
  conf: 0.95
  attack: T1071.001
  for: [javascript, typescript]
  if:
    type: text
    substr: "resolver-io.net"

  # === Reporter Delay Constants ===
- id: report-delay-min-constant
  desc: REPORT_DELAY_MIN constant (beacon timing)
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'REPORT_DELAY_MIN\s*=\s*\d{3,}'

- id: report-delay-max-constant
  desc: REPORT_DELAY_MAX constant (beacon timing)
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'REPORT_DELAY_MAX\s*=\s*\d{3,}'

  # === JSON Beacon Shape ===
- id: sysinfo-json-beacon-keys
  desc: JSON beacon with sysinfo keys
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: "platform:.{0,50}host:.{0,50}uptime:.{0,50}load:"

  # === Manifest Spoof Detection ===
  # Hostname label `internal.` (e.g. npm.internal.corp.com), not package
  # names like `@scope/sdk-internal` whose git URLs end in `internal.git`.
- id: internal-repo-url
  desc: Repository URL references internal hostname
  crit: suspicious
  conf: 0.88
  attack: T1195.002
  for: [package.json]
  if:
    type: value
    path: "repository.url"
    regex: '(?i)://([^/]*\.)?internal\.'
  unless:
    - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
    - id: well-known/lib/runtime/scripted/electron::electron-app-asar-member-path
- id: internal-homepage-url
  desc: Homepage references internal hostname
  crit: suspicious
  conf: 0.88
  attack: T1195.002
  for: [package.json]
  if:
    type: value
    path: "homepage"
    regex: '(?i)://([^/]*\.)?internal\.'
  unless:
    - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
    - id: well-known/lib/runtime/scripted/electron::electron-app-asar-member-path
composite_rules:
- id: npm-postinstall-sysinfo-beacon
  desc: Postinstall hook beacons system info to C2
  crit: hostile
  conf: 0.96
  attack: T1041
  mbc: E1041
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/os/sysinfo/profile::node-host-query-json-post-clues
  unless:
  - id: metadata/package/documentation/disclosure::bounded-depconf-research-beacon
  - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception

# "Beacons system info to C2" describes one script collecting host facts and
# POSTing them. Held at archive scope the transport and collection legs came
# from unrelated entries, so a large npm package with any postinstall hook
# matched -- openclaw (8550 files) did. Co-locate the beacon itself.

- id: js-sysinfo-oast-https-post-exfil
  desc: Script POSTs host profile JSON to OAST endpoint
  crit: hostile
  conf: 0.97
  attack: T1041
  mbc: E1041
  for: [javascript, typescript]
  scope: file
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-query-json-post-clues
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  unless:
  - id: metadata/package/documentation/disclosure::bounded-depconf-research-beacon

- id: npm-postinstall-recon-exfil-c2
  desc: Postinstall recon/exfil with known C2 domain
  crit: hostile
  conf: 0.98
  attack: T1041
  mbc: E1041
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: resolver-io-net-c2
  any:
  - id: micro-behaviors/os/sysinfo/profile::node-multi-sysinfo-with-hook
  - id: objectives/anti-analysis/sandbox-detect/timing::uptime-sandbox-gate
  unless:
  - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
- id: npm-internal-url-spoof
  desc: Package claims internal/private URLs on public registry
  crit: suspicious
  conf: 0.9
  attack: T1195.002
  for: [package.json]
  any:
  - id: internal-repo-url
  - id: internal-homepage-url

  # === Suspicious: Delay Constants Pattern ===
- id: npm-report-delay-constants
  desc: Beacon delay constants (REPORT_DELAY_MIN/MAX)
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  all:
  - id: report-delay-min-constant
  - id: report-delay-max-constant

  # === Suspicious: JSON Beacon Shape ===
- id: npm-sysinfo-json-beacon
  desc: JSON beacon with system-info payload shape
  crit: suspicious
  conf: 0.92
  for: [javascript, typescript]
  all:
  - id: sysinfo-json-beacon-keys
  - id: micro-behaviors/data/serialize/json::json-stringify-identifier
