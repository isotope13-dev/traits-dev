defaults:
  platforms: [unix]
  for: [javascript, package.json]

traits:
- id: linux-config-batch-separator
  desc: Uses custom file batch separator
  crit: suspicious
  conf: 0.98
  attack: T1041
  for: [javascript]
  if:
    type: text
    regex: '["'']\$#{12,}\$["'']'
- id: express-multer-upload-route
  desc: Express multer upload route declaration
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(app|router)\.post\(\s*["'']/upload["''][\s\S]{0,160}\.upload\.single\('
composite_rules:
- id: urlencoded-msg-batch-exfil
  desc: URL encoded batch exfil payload
  crit: suspicious
  conf: 0.98
  attack: T1041
  for: [javascript]
  all:
  - id: objectives/supply-chain/recon-exfil/host-profile/install-context::querystring-msg-field
  - id: linux-config-batch-separator
  any:
  - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
  - id: micro-behaviors/communications/http/post::post
- id: npm-postinstall-linux-config-exfil
  desc: Node payload exfiltrates Linux config files
  crit: hostile
  conf: 0.995
  attack: T1041
  mbc: E1041
  for: [javascript]
  all:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/fs/read/file/full::node-linux-config-file-set
  - id: urlencoded-msg-batch-exfil
  any:
  - id: micro-behaviors/fs/read/stream::read-file-utf8-callback
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: metadata/file/size::javascript-small-file-5k
