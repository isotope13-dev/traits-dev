defaults:
  platforms: [unix, windows]

traits:
  - id: rust-build-host-user-path-recon
    desc: Rust build.rs gathers host user path
    crit: suspicious
    conf: 0.98
    attack: T1082
    for: [rust]
    if:
      type: text
      regex: 'Command::new\("hostname"\).{0,240}Command::new\("whoami"\).{0,240}current_dir'
  # `Command::new("hostname")` / `Command::new("whoami")` are neutral Rust
  # capabilities with no build-script context in the matcher, so they live in
  # micro-behaviors (os/sysinfo/hostname::rust-command-hostname,
  # process/user/query::rust-command-whoami) and are referenced from the
  # composites below.






  - id: rust-build-git-log-author-email
    desc: Rust build.rs collects git author email
    crit: notable
    conf: 0.9
    attack: T1083
    for: [rust]
    if:
      type: text
      substr: '--pretty=format:{"commit":"%H","author":"%an","email":"%ae"'
  - id: rust-build-git-diff-head
    desc: Rust build.rs collects git patch diff
    crit: suspicious
    conf: 0.94
    attack: T1083
    for: [rust]
    if:
      type: text
      substr: '&["diff", "HEAD^", "HEAD"]'
  - id: rust-build-curl-post-body
    desc: Rust build.rs posts body with curl
    crit: notable
    conf: 0.9
    attack: T1041
    for: [rust]
    if:
      type: text
      substr: '.arg("-d").arg(body)'
  - id: rust-build-sentry-envelope
    desc: Rust build.rs sends Sentry envelope
    crit: suspicious
    conf: 0.94
    attack: T1041
    for: [rust]
    if:
      type: text
      regex: 'ingest\.[a-z0-9.-]*sentry\.io/.{0,160}/envelope/'
  - id: rust-build-source-patch-payload
    desc: Rust build.rs embeds source patch payload
    crit: suspicious
    conf: 0.92
    attack: T1083
    for: [rust]
    if:
      type: text
      regex: '"patch"[\s\S]{0,160}patch\.replace'

  - id: rust-build-embedded-runtime-module
    desc: build.rs embeds a source module
    crit: component
    conf: 0.9
    attack: T1195.002
    for: [rust]
    if:
      type: text
      regex: '#\[path\s*=\s*"src/.{0,80}"\][\s\S]{0,120}\bmod\s+[A-Za-z_][A-Za-z0-9_]*'


  - id: rust-build-encoded-command-arguments
    desc: build code passes encoded arguments
    crit: suspicious
    conf: 0.93
    attack: T1027
    for: [rust]
    if:
      type: text
      regex: 'material\s*\([^)]{0,120}ENC_[A-Za-z_]+'

  - id: rust-build-file-metadata-body
    desc: build code formats file upload fields
    crit: notable
    conf: 0.95
    attack: T1041
    for: [rust]
    if:
      type: text
      regex: 'format!\([\s\S]{0,220}\{file_str\}[\s\S]{0,220}\{label\}'

composite_rules:
  - id: rust-build-obfuscated-file-uploader
    desc: build.rs hides a local file uploader in an embedded module
    crit: hostile
    conf: 0.995
    scope: archive
    for: [rust, crate, tar, zip]
    attack: T1195.002
    mbc: E1041
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: rust-build-embedded-runtime-module
      - id: micro-behaviors/data/encode/xor::rust-repeating-key-xor
      - id: rust-build-encoded-command-arguments
      - id: rust-build-file-metadata-body
      - id: micro-behaviors/process/create/direct::rust-indirect-command-new
  - id: rust-build-host-user-command-recon
    desc: Rust build.rs gathers host user
    crit: suspicious
    conf: 0.96
    attack: T1082
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/os/sysinfo/hostname::rust-command-hostname
      - id: micro-behaviors/process/identity/query::rust-command-whoami

  - id: rust-build-git-patch-curl-exfil
    desc: Rust build.rs exfils git patch via curl
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: rust-build-git-diff-head
      - id: rust-build-curl-post-body
    any:
      - id: rust-build-git-log-author-email
      - id: rust-build-source-patch-payload
      - id: rust-build-sentry-envelope

  - id: rust-build-sentry-source-patch-exfil
    desc: Rust build.rs exfils source patch to Sentry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    all:
      - id: rust-build-git-patch-curl-exfil
      - id: rust-build-sentry-envelope
      - id: rust-build-source-patch-payload

  - id: cargo-build-hook-git-patch-exfil
    desc: Cargo build hook exfils git patch
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: rust-build-git-patch-curl-exfil

  - id: cargo-archive-build-rs-git-patch-exfil
    desc: Cargo archive build.rs exfils git patch
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-git-patch-curl-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"

  - id: rust-build-supabase-recon-exfil
    desc: Rust build.rs recons host then exfils to Supabase
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    all:
      - id: rust-build-host-user-command-recon
      - id: micro-behaviors/communications/http/services/supabase::rust-supabase-webhook-function-url
      - id: micro-behaviors/data/encode/base64::to-base64-string
      - id: micro-behaviors/data/encode/charset::powershell-utf8-getbytes
      - id: micro-behaviors/communications/http/request/header/user-agent::rust-restmethod-useragent-template
      - id: micro-behaviors/process/create/subprocess::rust-command-new-call
      - id: micro-behaviors/process/create/direct::rust-command-powershell

  - id: rust-build-dual-channel-telemetry-exfil
    desc: Rust build.rs sends encoded telemetry in URL and user-agent
    crit: hostile
    conf: 0.99
    attack: T1041
    mbc: E1041
    all:
      - id: rust-build-host-user-command-recon
      - id: micro-behaviors/communications/http/services/supabase::rust-supabase-webhook-function-url
      - id: micro-behaviors/data/encode/base64::to-base64-string
      - id: micro-behaviors/data/encode/charset::powershell-utf8-getbytes
      - id: micro-behaviors/communications/http/request/header/user-agent::rust-restmethod-useragent-template
      - id: micro-behaviors/process/create/direct::rust-command-powershell

  - id: cargo-build-hook-supabase-recon-exfil
    desc: Cargo build hook recons host and exfils telemetry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: rust-build-supabase-recon-exfil

  - id: cargo-archive-build-rs-supabase-recon-exfil
    desc: Cargo archive build.rs recons host and exfils telemetry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-supabase-recon-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"

  - id: cargo-build-hook-masked-telemetry-exfil
    desc: Cargo build hook masks telemetry as security validation
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: rust-build-dual-channel-telemetry-exfil

  - id: rust-build-telegram-recon-exfil
    desc: Rust build.rs exfils host profile to Telegram
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust]
    all:
      - id: rust-build-host-user-command-recon
      - id: micro-behaviors/communications/http/services/telegram::rust-telegram-bot-api-client
      - id: micro-behaviors/process/create/subprocess::rust-command-curl-wget
    any:
      - id: micro-behaviors/communications/http/ip-discovery::ifconfig-me
      - id: objectives/supply-chain/install-hook/build/behavioral/execute::rust-build-rs-command-output

  - id: cargo-archive-build-rs-telegram-recon-exfil
    desc: Cargo archive build.rs exfils host profile
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-telegram-recon-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"

  - id: cargo-archive-build-rs-masked-telemetry-exfil
    desc: Cargo archive build.rs masks telemetry as security validation
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-dual-channel-telemetry-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"

  - id: rust-build-raw-socket-profile-exfil
    desc: Rust build.rs sends host profile over a fixed raw socket
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1041,T1082
    mbc: E1041
    for: [rust]
    all:
      - id: rust-build-host-user-command-recon
      - id: objectives/exfiltration/stealer/system-info/identity::rust-http-profile-raw-socket-exfil

  - id: cargo-build-hook-raw-socket-profile-exfil
    desc: Cargo build hook exfils host profile over a raw socket
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1041,T1082
    mbc: E1041
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: rust-build-raw-socket-profile-exfil
