# Install-hook scripts that fingerprint the host at install time via local
# process inventory and/or AWS IMDSv2 — even when results are only written
# to disk (no network exfil). Catches "security demo" and real trojan
# preinstalls that collect identity without package-specific strings.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1082,T1057,T1580
  mbc: E1041

composite_rules:
  # Split-literal IMDSv2 (host + /latest/api/token + instance-id + TTL header)
  # inside an npm lifecycle hook. Future implants that avoid a contiguous
  # metadata URL still match.
  - id: preinstall-imdsv2-instance-fingerprint
    desc: Install hook probes AWS IMDSv2 for instance-id
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1580,T1552.005
    all:
      - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
      - id: metadata/file/string/cloud::cloud-instance-metadata-link-local-host
      - id: metadata/file/string/cloud::aws-imds-v2-token-path
      - id: metadata/file/string/cloud::aws-instance-id-metadata-path
      - id: metadata/file/string/cloud::aws-imds-v2-token-ttl-header

  # Host user/hostname plus process inventory written under an install hook —
  # install-time recon unrelated to a hello-world library's advertised purpose.
  - id: preinstall-host-process-recon-log
    desc: Install hook logs host identity and process list
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1082,T1057
    all:
      - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: micro-behaviors/fs/write/file/direct::append-file-sync
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/enumerate/shell::ps-eo-comm
