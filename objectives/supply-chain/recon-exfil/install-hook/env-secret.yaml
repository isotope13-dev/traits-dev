# An install lifecycle hook that reads a secret out of the environment and
# sends it to a server the package chose.
#
# This is the load-bearing shape behind npm token theft: `npm install` runs the
# hook with the developer's (or CI runner's) full environment attached, so
# whatever NPM_TOKEN, AWS_SECRET_ACCESS_KEY or GITHUB_TOKEN happens to be set is
# readable, and one outbound request moves it off the host before any of the
# package's actual code is ever imported.
#
# Scored `suspicious`, not hostile, because the same three steps are also how
# commercial packages validate a licence key and how telemetry opt-ins report a
# project id -- the mechanism cannot tell a vendor's own key from a stolen one.
# What it can say is that installing this package transmits an environment
# secret, which a reviewer has to see either way. Composites elsewhere that can
# prove the destination is attacker-controlled (paste sites, raw IPs, dead-drop
# hosts) are where hostile belongs.
#
# Deliberately transport-agnostic: the legs name "a hook runs", "a credential
# env var is read" and "module scope performs an HTTP call", so fetch, axios,
# https.request, curl-via-exec and whatever ships next all land the same way.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, package.json]
  attack: T1552.001
  mbc: C0032

composite_rules:
  # The read and the request are the transmission, and they have to be the same
  # script for the claim to hold. Kept file-scoped on purpose: pooled across an
  # archive, any package that reads a token in one module and calls an API from
  # another -- every CLI with a licence check and a remote resolver -- satisfies
  # both legs without a single byte moving from one to the other.
  - id: credential-env-read-transmitted
    desc: Script reads a credential env var and makes a module-scope HTTP call
    crit: notable
    conf: 0.9
    # Script file types only: on the `npm`/`package.json` container the member
    # findings are pooled, so a file-scoped composite there would be satisfied
    # by two different members and the same-file guarantee would be lost.
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/env/secret-name::javascript-credential-env-read
      - id: micro-behaviors/communications/http/request/json::module-execution-http-call

  # Same transmission composite, but only when the script is the lifecycle hook
  # target (postinstall.js/preinstall.js/install.js or a custom local node target
  # whose path suffix matches the manifest hook command). Archive pooling of a
  # manifest hook plus a separate bin/cli module that reads credentials at startup
  # is not install-time exfiltration.
  - id: hook-script-credential-env-read-transmitted
    desc: npm lifecycle hook script reads credential env at module scope
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    scope: file
    all:
      - id: credential-env-read-transmitted
      - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename

  - id: install-hook-env-credential-transmission
    desc: Install hook script or package transmits credential from environment
    crit: notable
    conf: 0.9
    scope: archive
    any:
      - id: hook-script-credential-env-read-transmitted
      - id: credential-env-read-transmitted

  - id: install-hook-transmits-env-secret
    desc: Install hook sends an env secret offsite
    crit: suspicious
    conf: 0.93
    # The hook declaration lives in package.json while the read and the request
    # live in the script it names, so the evidence spans archive members. When
    # the hook script has a conventional lifecycle filename, require the
    # transmission there; otherwise fall back to archive-wide pooling unless a
    # separate bin CLI owns the credential client.
    scope: archive
    all:
      - id: install-hook-env-credential-transmission
    any:
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
      - id: metadata/package/scripts/lifecycle::has-install-script
    unless:
      # Harnesses ship authenticated service integrations whose modules read
      # credentials and call APIs without the install hook invoking them.
      - id: metadata/package/description/function::description-ai-coding-harness
      # Bin-backed CLIs often read service tokens and call APIs at module scope
      # while a separate postinstall script handles install-time setup only.
      - id: npm-bin-cli-credential-client-not-in-hook-script

  - id: npm-bin-cli-credential-client-not-in-hook-script
    desc: Bin CLI reads credentials while hook script does not transmit
    crit: exception
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/entrypoint::bin-field-declared
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
      - id: credential-env-read-transmitted
    unless:
      - id: hook-script-credential-env-read-transmitted
