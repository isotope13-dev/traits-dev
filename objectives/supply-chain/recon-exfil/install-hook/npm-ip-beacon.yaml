# JavaScript install-time public IP beacon. The POST and public-IP discovery
# must occur in the same script; archive scope is used only to join that
# behavior to the package lifecycle declaration.
defaults:
  platforms: [unix, windows]
  for: [archives]
  attack: T1041
composite_rules:
  - id: js-public-ip-beacon
    desc: npm install hook POSTs public IP to a literal IPv4 endpoint
    crit: hostile
    conf: 0.96
    mbc: E1041
    scope: archive
    all:
      - id: objectives/exfiltration/http/report::js-public-ip-literal-post
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
    unless:
      - id: metadata/package/testing/harness/runtime/
