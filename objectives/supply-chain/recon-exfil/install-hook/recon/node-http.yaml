# Node install hooks that collect local state and send it over HTTP.
# The hook requirement keeps ordinary telemetry in runtime libraries out of
# this objective; the combined collection and transport pattern is the signal.
defaults:
  platforms: [windows, linux]
  for: [javascript, typescript, tar, zip]
  attack: T1195.002,T1041,T1082,T1552.005
  mbc: E1041

composite_rules:
  - id: npm-install-host-user-cwd-ip-get-exfil
    desc: npm install hook sends user, host, and cwd to a public IP via HTTP GET
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1041,T1082,T1033"
    for: [npm, tar, zip, package.json]
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/communications/ip/literal::http-ip-url-text
      - id: micro-behaviors/communications/http/get::npm-postinstall-node-http-get
      - id: micro-behaviors/os/env/user-info::npm-postinstall-user-env
      - id: micro-behaviors/os/sysinfo/hostname::npm-postinstall-os-hostname-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::npm-postinstall-cwd-call
    any:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
    # The query conveys install context; ordinary package-manager safeguards
    # and local development fixtures do not satisfy the network/profile legs.
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
  # The seven collection/transport legs describe ONE script: it shells out,
  # reads the environment, and writes a JSON body to an HTTP request. Kept at
  # package scope they were satisfiable by seven unrelated files, so any large
  # JS monorepo that also happens to declare a preinstall hook read as a
  # profiling installer -- openclaw (8550 files, an AI gateway whose preinstall
  # only prints a "use pnpm" warning) matched all seven from seven different
  # files. Co-locating them in one leaf file is what the description claims.
  - id: node-host-profile-http-post-file
    desc: Script shells out, reads env, and posts a JSON body
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    scope: file
    # Import, execSync, env handoff, and the POST have to be one routine.
    # A service manager that inherits process.env for a local daemon and
    # separately posts to that daemon's API is not a host-profile beacon.
    near_bytes: 3500
    all:
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/os/env/read::node-process-env-object-field
      - id: micro-behaviors/communications/http/request/client::http-request
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
      - id: micro-behaviors/communications/http/request/body/construction::request-end-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: npm-preinstall-profile-http-post
    desc: npm preinstall profiles host and posts data
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, pe, deb, asar, javascript, csharp, manifests]
    # The claim is about one package's install hook, so it must be evaluated
    # per package root. Under `scope: archive` a source tree that vendors many
    # independent npm fixtures -- Deno ships ~1000 under tests/registry/npm --
    # satisfies the legs from unrelated files and reads as a single profiling
    # installer.
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: node-host-profile-http-post-file
    unless:
      - id: well-known/tool/development/toolchain/deno::source-archive-context
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: well-known/tool/development/game-engine/unity-hub::official-package-context
  - id: npm-preinstall-local-script-profile-get-beacon
    desc: npm preinstall sidecar GET beacons host profile
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1082"
    for: [npm, tar, zip, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-query
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: npm-skeleton-install-profile-http-get-beacon
    desc: Hollow npm package GET beacons install context
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1082"
    for: [npm, tar, zip, javascript, package.json]
    scope: archive
    all:
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
      - id: objectives/exfiltration/stealer/system-info/workspace-profile::js-npm-install-profile-http-get-exfil
  - id: npm-inflated-depconf-entry-http-install-beacon
    desc: Inflated depconf npm entry script GET beacons install context
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1082"
    for: [npm, tar, zip, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
      - id: objectives/exfiltration/stealer/system-info/workspace-profile::js-npm-install-profile-http-get-exfil
  - id: postinstall-script-credential-exfil
    desc: Postinstall script harvests credentials and posts over HTTP
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1552,T1041"
    for: [javascript, typescript]
    scope: file
    all:
      - id: metadata/package/files/lifecycle::install-js-basename
      - id: node-host-profile-http-post-file
    any:
      - id: micro-behaviors/fs/path/credential::browser-developer-ssh-store-paths
      - id: micro-behaviors/fs/read/file/full::node-npmrc-read-reference
      - id: micro-behaviors/fs/path/credential::ssh-key-or-host-store-reference
      - id: micro-behaviors/fs/path/credential::browser-store-reference
  - id: npm-preinstall-shell-curl-backtick-exfil
    desc: npm preinstall shell posts command output via curl
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1059.004"
    for: [npm, tar, zip, package.json, shell]
    # Per-package scope so fetched dependency tarballs pool manifest hooks
    # with the shell script they execute; archive scope missed pkg: subtrees.
    scope: package
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-shell-local-script
    any:
      - id: micro-behaviors/communications/http/curl::shell-curl-data-backtick-substitution
      - id: micro-behaviors/communications/http/curl::shell-interleaved-var-curl-data-post
  - id: npm-preinstall-contradicts-no-hook-claim
    desc: npm preinstall despite no-scripts description
    crit: hostile
    conf: 0.98
    attack: "T1195.002"
    for: [npm, tar, zip, package.json]
    scope: package
    all:
      - id: metadata/package/description/disclosure::description-denies-install-scripts
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-shell-local-script

  # Same binding rule as its exfiltration-leaf sibling: the collection and
  # transport legs must land in the one script the hook runs. Flat archive
  # pooling let OpenClaw's gateway satisfy hostname from one file, userInfo
  # from another, and https.request plus encodeURIComponent from a vendored
  # chrome-devtools-mcp bundle — a six-file "beacon" with no beacon script.
  # File scope is not enough for a bundle: OpenTelemetry's instrumentation
  # rollup is one file, and its ECS hostname, process-owner userInfo, GCE
  # interface check, and HTTPS client sit megabytes apart.
  - id: node-https-userinfo-host-profile-script
    desc: Script reports hostname, user, and interfaces over encoded HTTPS
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/identity/query::node-os-alias-userinfo-call
      - id: micro-behaviors/network/interface::node-network-interfaces-call
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: npm-postinstall-https-request-host-profile-beacon
    desc: npm postinstall HTTPS GET beacons host profile
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::node-https-userinfo-host-profile-script

  # These two rules cover package scripts that use a URL object for the
  # request destination and write a serialized body through Node's request
  # stream. The required package hook and profile fields distinguish them
  # from product telemetry and an unrelated HTTPS client.
  - id: npm-postinstall-host-user-json-post
    desc: npm postinstall posts JSON host and user identity
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082,T1033
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-body
      - id: micro-behaviors/communications/http/request/body/construction::request-end-body-call
      - id: micro-behaviors/communications/http/request/body/construction::request-write-payload-variable
    needs: 1

  # Environment key names are less sensitive than their values, but their
  # unsolicited export still fingerprints the install host and its CI setup.
  - id: npm-postinstall-environment-names-json-post
    desc: npm postinstall posts environment variable names
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/os/env/enumerate::js-object-keys-env
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-body
      - id: micro-behaviors/communications/http/request/body/construction::request-write-payload-variable
    needs: 1
