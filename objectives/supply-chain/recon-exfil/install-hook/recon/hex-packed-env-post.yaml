# Hex-packed npm install-hook stealer: every identifier — builtin and
# transport module names, the collected field names, and the destination
# host — travels as `Buffer.from(hex, "hex")`, so the import, hostname,
# and environment matchers all miss. What remains provable in one short
# script is the pipeline itself: many hex decodes, a computed require of
# the transport, the full environment enumerated through the same
# computed access, a base64 JSON body, and a write onto the request.
#
# File-scope twin of node-host-profile-http-post-file for the obfuscated
# variant; the archive-scope hostile twin adds the package.json hook.

defaults:
  platforms: [windows, linux]
  for: [javascript, typescript]
  attack: T1195.002,T1552.001,T1041
  mbc: E1041

composite_rules:
  - id: node-hex-packed-env-profile-https-post
    desc: Hex-packed script posts collected environment profile
    crit: suspicious
    conf: 0.9
    scope: file
    # One short script builds the profile and sends it: a longer program
    # can decode hex strings, compute a require, and stream a request for
    # unrelated reasons, but it does not also enumerate the whole
    # environment into that body.
    near_bytes: 4000
    all:
      - id: micro-behaviors/data/decode/hex::multiple-node-hex-decodes
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/os/env/read::node-computed-env-collection
      - id: micro-behaviors/data/encode/base64::node-json-buffer-base64-encode
      - id: micro-behaviors/process/io/stream::req-write-call-prefix-text-reference
