defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  - typescript
  attack: T1195.002,T1048.003
composite_rules:
- id: npm-install-host-dns-exfil
  desc: Install hook exports host identity through encoded OOB DNS
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/declaration::package-install-hook-present
  - id: objectives/exfiltration/dns/encoded::node-hex-host-identifier-dns-query
  - id: objectives/exfiltration/dns/encoded::node-hex-cwd-oob-dns-query
- id: npm-install-oob-dns-host-user-exfil
  desc: Install hook encodes host and user in OOB DNS
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/declaration::package-install-hook-present
  - id: objectives/exfiltration/dns/encoded::node-dns-resolve-hex-host-oob-text
  - id: objectives/exfiltration/dns/encoded::node-dns-resolve-hex-user-oob-text
- id: npm-install-cwd-dns-exfil
  desc: Install hook exports working directory through encoded OOB DNS
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/declaration::package-install-hook-present
  - id: objectives/exfiltration/dns/encoded::node-hex-cwd-oob-dns-query
- id: npm-install-user-dns-exfil
  desc: Install hook exports user name through encoded OOB DNS
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/declaration::package-install-hook-present
  - id: objectives/exfiltration/dns/encoded::node-hex-user-oob-dns-query
