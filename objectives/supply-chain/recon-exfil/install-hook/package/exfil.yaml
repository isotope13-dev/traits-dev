defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
traits:
- id: placeholder-ellipsis
  desc: Placeholder ellipsis string literal
  crit: component
  conf: 0.4
  size_max: 2000
  if:
    type: string_literal
    regex: ^\.{2,}$
- id: webhook-package-name
  desc: Package name contains webhook
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: webhook
    case_insensitive: true
- id: post-install-package-import
  desc: setup.py imports package after install
  crit: suspicious
  conf: 0.9
  for:
  - python
  - pkginfo
  if:
    type: text
    regex: install\.run\s*\(\s*self\s*\)\s*\n\s*import\s+\w+
- id: probe-print-test
  desc: Probe print with test prefix string
  crit: component
  conf: 0.75
  size_max: 10000
  if:
    type: string_literal
    regex: ^test\s
- id: suspicious-php-endpoint
  desc: PHP endpoint URL with beacon parameters
  crit: suspicious
  conf: 0.85
  if:
    type: string_literal
    substr: .php?live=
  unless: null
- id: version-check-url
  desc: Suspicious version check URL
  crit: suspicious
  conf: 0.9
  if:
    type: string_literal
    regex: https?://[^/]{1,120}/[Vv]ersion\.php|https?://[^/]{1,120}/[Cc]heck\.php
- id: hardcoded-dns-nameserver
  desc: Hardcoded Google DNS literal
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '["'']8\.8\.8\.8["'']'
  unless:
  - type: string_literal
    exact: --dns
- id: ord-hex-join-encode
  desc: ord hex join encoder
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: join\(hex\(ord\(x\)\)\[2:\]\s+for\s+x\s+in
- id: pip3-console-script
  desc: Declares pip3 console-script target
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: (?m)^\s*["']?pip3\s*=\s*[\w.]{1,80}:\w+
- id: b64-http-url-decode
  desc: Base64-encoded http:// URL prefix
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: aHR0cDov
- id: setup-py-bin-env-dump
  desc: setup.py dumps env via /bin/env
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: os.popen('/bin/env')
- id: setup-py-urlencode-fs-snapshot
  desc: URL-encodes repeated directory snapshots
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '["''](files2|files3|files4|files5)["'']\s*:'
- id: traktrain-req-endpoint
  desc: Traktrain req.php beacon endpoint
  crit: suspicious
  conf: 0.99
  if:
    type: string_literal
    exact: http://pt.traktrain.com/req.php
