# npm install-time recon/exfil beacons that ship victim data to a chat webhook
# (Discord) instead of a hardcoded IP. Observed in @chat-template/auth@1.0.0:
# a `preinstall` hook runs a Node payload that harvests process.env + host/IP
# recon and POSTs it to a Discord webhook with errors suppressed (`|| true`).
# The existing js-public-ip-beacon only fires when the exfil destination is a
# hardcoded IPv4 — these cover the webhook-destination variants.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: E1041
composite_rules:
  - id: npm-postinstall-jwt-env-http-exfil
    desc: npm postinstall sends JWT-shaped env secrets over HTTP
    conf: 0.99
    attack: "T1195.002,T1552.001,T1041"
    for: [package.json]
    all:
      - id: objectives/supply-chain/credential-theft/env::npm-postinstall-jwt-env-harvest
      - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  - id: npm-env-harvest-webhook-exfil
    desc: Full process.env harvested and exfiltrated to a chat webhook
    conf: 0.97
    all:
      - id: micro-behaviors/os/env/read::process-env-report-input
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  - id: npm-public-ip-webhook-beacon
    desc: Public IP discovered and beaconed to a chat webhook
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  - id: npm-host-fingerprint-webhook-beacon
    desc: Host system fingerprint beaconed to a chat webhook
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  - id: npm-install-hook-recon-webhook-beacon
    desc: npm install hook collects host recon and beacons to a chat webhook
    conf: 0.97
    scope: archive
    for: [javascript, typescript, tar, zip, pkginfo, package.json]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
    any:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/os/env/read::process-env-report-input
  - id: npm-install-hook-bare-webhook-beacon
    desc: Bare install-hook execution ping to chat webhook
    conf: 0.96
    scope: archive
    for: [javascript, typescript, tar, zip, pkginfo, package.json]
    all:
      - id: metadata/package/scripts/command::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/communications/http/get::node-https-get-reference
    any:
      - id: metadata/package/versioning/scheme::npm-multidigit-major-starting-nine
      - id: metadata/package/empty::npm-empty-author
      - id: objectives/supply-chain/impersonation/package/scoring::npm-dependency-confusion-candidate
  - id: npm-install-hook-agent-config-webhook-exfil
    desc: Install hook ships OpenClaw config to Discord
    conf: 0.95
    attack: "T1195.002,T1552.001,T1567"
    scope: archive
    for: [shell, javascript, tar, zip, npm, package.json]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::openclaw-config-json-literal
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
    any:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
