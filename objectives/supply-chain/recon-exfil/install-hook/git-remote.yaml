# Package install hooks that read the installing checkout's git remote URL and
# then talk to the network. The remote URL names the repository -- and inside a
# company, the internal host serving it -- which is exactly the "proof of
# internal reach" a dependency-confusion payload wants back. No build step
# needs it, so pairing the read with egress from an install-time recipe is the
# attack, not a capability.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002,T1082,T1041
  mbc: E1041

composite_rules:
  - id: extconf-git-remote-callback
    desc: Gem build recipe reads git remote and calls out
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: micro-behaviors/process/create/shell/git::git-remote-url-capture
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call
    # A recipe that genuinely compiles an extension may shell out to git for a
    # submodule or version stamp; those call mkmf/create_makefile.
    unless:
      - id: metadata/build/package/recipe::extconf-native-build-helper
