# Install/import-time beacons that JSON-pack hostname+whoami and curl -X POST
# them — catches npm trojan beacons that skip OAST domains.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1041

traits:
  - id: js-whoami-hostname-json
    desc: Builds JSON with hostname and whoami
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)hostname[\s\S]{0,200}whoami|whoami[\s\S]{0,200}hostname'

  - id: js-curl-post-json-content-type
    desc: curl POST with JSON Content-Type header
    crit: notable
    conf: 0.92
    unless:
      # ADHDev embeds this local-dev curl command in help text; it is not
      # executed by the daemon and is not an install-hook beacon.
      - id: well-known/app/ai/adhdev::adhdev-daemon-package
      - id: micro-behaviors/communications/http/endpoints::loopback-http-url-reference
    if:
      type: text
      regex: "(?i)curl[\\s\\S]{0,80}-X\\s+POST[\\s\\S]{0,120}Content-Type:\\s*application/json"

composite_rules:
  - id: node-curl-host-profile-beacon
    desc: Node curl-POSTs hostname whoami host profile
    crit: hostile
    conf: 0.97
    all:
      - id: js-whoami-hostname-json
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call

  - id: node-curl-json-post-execsync
    desc: execSync curl JSON POSTs recon payload
    crit: hostile
    conf: 0.96
    all:
      - id: js-curl-post-json-content-type
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/communications/http/curl::curl-post-flag
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
