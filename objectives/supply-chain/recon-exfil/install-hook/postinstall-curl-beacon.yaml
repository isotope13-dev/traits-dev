# Install/import-time beacons that JSON-pack hostname+whoami and curl -X POST
# them — catches npm trojan beacons that skip OAST domains.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1041

traits:
  - id: js-json-stringify-object
    desc: JavaScript serializes an inline object as JSON
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)JSON\.stringify\s*\(\s*\{'

  - id: js-hostname-field
    desc: JavaScript hostname field reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bhostname\b'

  - id: js-whoami-field
    desc: JavaScript whoami field reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwhoami\b'

  - id: js-curl-post-json-content-type
    desc: curl POST with JSON Content-Type header
    crit: notable
    conf: 0.92
    unless:
      # ADHDev embeds this local-dev curl command in help text; it is not
      # executed by the daemon and is not an install-hook beacon.
      - id: well-known/app/ai/adhdev::adhdev-daemon-package
      - id: micro-behaviors/communications/http/endpoints::loopback-http-url-reference
    if:
      type: text
      regex: "(?i)curl[\\s\\S]{0,80}-X\\s+POST[\\s\\S]{0,120}Content-Type:\\s*application/json"

composite_rules:
  - id: npm-postinstall-user-identity-curl-exfil
    desc: npm postinstall exfiltrates user identity via curl
    crit: hostile
    conf: 0.995
    mbc: E1041
    attack: T1195.002,T1033,T1041
    for: [package.json, npm, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/env/vars/user-info::npm-postinstall-user-env
      - id: micro-behaviors/process/user/query::npm-postinstall-os-userinfo-call
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post

  - id: node-curl-host-profile-beacon
    desc: Node curl-POSTs hostname whoami host profile
    crit: hostile
    conf: 0.97
    all:
      - id: js-whoami-hostname-json
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call

  - id: js-whoami-hostname-json
    desc: JSON object contains both hostname and whoami fields
    crit: notable
    conf: 0.93
    near_bytes: 1024
    all:
      - id: js-json-stringify-object
      - id: js-hostname-field
      - id: js-whoami-field

  - id: node-curl-json-post-execsync
    desc: execSync curl JSON POSTs recon payload
    crit: hostile
    conf: 0.96
    all:
      - id: js-curl-post-json-content-type
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/communications/http/curl::curl-post-flag
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
