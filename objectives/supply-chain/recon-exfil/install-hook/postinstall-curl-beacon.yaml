# Install/import-time beacons that JSON-pack hostname+whoami and curl -X POST
# them — catches npm trojan beacons that skip OAST domains.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1041

traits:
  - id: js-json-stringify-object
    desc: JavaScript serializes an inline object as JSON
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)JSON\.stringify\s*\(\s*\{'

  - id: js-hostname-field
    desc: JavaScript hostname field reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bhostname\b'

  - id: js-whoami-field
    desc: JavaScript whoami field reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwhoami\b'

  # Keep each shell identity spelling independent so every regex remains
  # auditable. The composite below joins these producers to the same piped
  # curl command, its HTTP endpoint, and curl's explicit stdin-body flag.
  - id: npm-postinstall-whoami-logname-pipe-curl
    desc: Postinstall pipes whoami or logname into curl
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\b(whoami(\.exe)?|logname)\b["'']?\s*\|\s*curl\b'

  - id: npm-postinstall-id-user-pipe-curl
    desc: Postinstall pipes id username into curl
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\bid\s+-(un|u\s+-n|n\s+-u)\b["'']?\s*\|\s*curl\b'

  - id: npm-postinstall-user-env-pipe-curl
    desc: Postinstall pipes user environment into curl
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\b(echo|printf)\s+["'']?\$\{?(USER|USERNAME)\}?["'']?\s*\|\s*curl\b'

  - id: npm-postinstall-piped-curl-http-url
    desc: Piped postinstall curl names HTTP endpoint
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\|\s*curl\b[\s\S]{0,500}https?://[^\s"'']+'

composite_rules:
  - id: npm-postinstall-user-source-pipe-curl
    desc: Postinstall pipes a user query into curl
    crit: component
    conf: 0.99
    for: [package.json]
    any:
      - id: npm-postinstall-whoami-logname-pipe-curl
      - id: npm-postinstall-id-user-pipe-curl
      - id: npm-postinstall-user-env-pipe-curl

  - id: npm-postinstall-user-query-stdin-curl
    desc: Postinstall pipes user identity into curl
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1033,T1041
    for: [package.json]
    near_bytes: 640
    all:
      - id: npm-postinstall-user-source-pipe-curl
      - id: npm-postinstall-piped-curl-http-url
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post

  - id: npm-postinstall-shell-user-identity-exfil
    desc: npm postinstall sends the installing user's identity to an HTTP endpoint
    crit: hostile
    conf: 0.995
    mbc: E1041
    attack: T1195.002,T1033,T1041
    for: [package.json, npm, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: npm-postinstall-user-query-stdin-curl
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post

  - id: npm-postinstall-user-identity-curl-exfil
    desc: npm postinstall exfiltrates user identity via curl
    crit: hostile
    conf: 0.995
    mbc: E1041
    attack: T1195.002,T1033,T1041
    for: [package.json, npm, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/env/vars/user-info::npm-postinstall-user-env
      - id: micro-behaviors/process/user/query::npm-postinstall-os-userinfo-call
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post

  - id: node-curl-host-profile-beacon
    desc: Node curl-POSTs hostname whoami host profile
    crit: hostile
    conf: 0.97
    all:
      - id: js-whoami-hostname-json
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call

  - id: js-whoami-hostname-json
    desc: JSON object contains both hostname and whoami fields
    crit: notable
    conf: 0.93
    near_bytes: 1024
    all:
      - id: js-json-stringify-object
      - id: js-hostname-field
      - id: js-whoami-field

  - id: node-curl-json-post-execsync
    desc: execSync curl JSON POSTs recon payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/curl::curl-json-post-command
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/communications/http/curl::curl-post-flag
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
