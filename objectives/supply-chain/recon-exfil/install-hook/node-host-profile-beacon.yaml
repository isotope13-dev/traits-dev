# npm install hook that POSTs a host profile to a hardcoded remote host.
#
# The existing hostile install-hook beacons all key on a *recognisable*
# destination — a bare IPv4 (npm-postinstall-ip-beacon), a Discord webhook
# (npm-install-hook-recon-webhook-beacon), or an interactsh/OAST domain
# (npm-preinstall-node-oast-host-profile-exfil). Operators who register their
# own domain fall through all of them, which is how `gaarf-node-bq@1.0.0`
# scored a single hostile: a postinstall script that JSON-encodes
# hostname/platform/arch/node version plus the npm lifecycle context and POSTs
# it to a hardcoded FQDN, with the error handler emptied and the socket
# destroyed on a short timeout so the install never blocks or fails.
#
# Anchored on the destination being *hardcoded* rather than on which domain it
# is: the legs are the install hook, the host-recon payload shape, the POST
# body, a literal remote host in the request options, and the fire-and-forget
# tell. A package that talks to its own API at runtime lacks the install hook;
# a legitimate postinstall (a binary downloader) lacks the host-recon payload.
#
# scope: archive — the lifecycle hook is declared in package.json and the
# beacon lives in the sidecar script it runs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, archives]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  - id: npm-install-hook-host-profile-post-hardcoded-host
    desc: Install hook host-profile beacon to fixed host
    crit: hostile
    conf: 0.97
    for: [archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
      - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: micro-behaviors/communications/http/request/client::silent-error-handler
      - id: micro-behaviors/communications/http/request/configuration::request-timeout-destroys-request
      - id: micro-behaviors/os/env/vars/access::npm-lifecycle
