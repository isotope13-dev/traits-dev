defaults:
  platforms: [unix, windows]

traits:
  - id: rust-build-host-user-path-recon
    desc: Rust build.rs gathers host user path
    crit: suspicious
    conf: 0.98
    attack: T1082
    for: [rust]
    if:
      type: text
      regex: 'Command::new\("hostname"\).{0,240}Command::new\("whoami"\).{0,240}current_dir'
  # `Command::new("hostname")` / `Command::new("whoami")` are neutral Rust
  # capabilities with no build-script context in the matcher, so they live in
  # micro-behaviors (os/sysinfo/hostname::rust-command-hostname,
  # process/user/query::rust-command-whoami) and are referenced from the
  # composites below.

  - id: rust-build-powershell-base64-utf8
    desc: Rust build.rs PowerShell UTF8 base64 encode
    crit: suspicious
    conf: 0.99
    attack: T1027
    for: [rust]
    if:
      type: text
      substr: "[Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes('{}'))"

  - id: rust-build-supabase-webhook-oob
    desc: Rust references Supabase webhook function
    crit: suspicious
    conf: 0.99
    attack: T1041
    for: [rust]
    if:
      type: string_literal
      regex: '(?i)^https://[\w-]+\.supabase\.co/functions/v1/[\w-]*(webhook|oob)[\w-]*$'

  - id: rust-build-restmethod-useragent
    desc: Rust builds custom-agent REST request
    crit: suspicious
    conf: 0.97
    attack: T1041
    for: [rust]
    if:
      type: string_literal
      regex: 'Invoke-RestMethod.{0,40}-Method Get.{0,24}-UserAgent'

  - id: rust-build-mystenlabs-audit-ua
    desc: Rust builds a MystenLabs audit-themed user-agent
    crit: suspicious
    conf: 0.98
    attack: T1036
    for: [rust]
    if:
      type: string_literal
      regex: '^MystenLabs-Audit-(Cut-)?\{\}$'

  - id: rust-build-fake-security-warning
    desc: Rust emits MystenLabs validation warning
    crit: suspicious
    conf: 0.99
    attack: T1036
    for: [rust]
    if:
      type: string_literal
      regex: '^cargo:warning=MystenLabs Security Research: Validating [A-Za-z][A-Za-z ]{4,80}\.\.\.$'
  - id: rust-build-git-log-author-email
    desc: Rust build.rs collects git author email
    crit: component
    conf: 0.9
    attack: T1083
    for: [rust]
    if:
      type: text
      substr: '--pretty=format:{"commit":"%H","author":"%an","email":"%ae"'
  - id: rust-build-git-diff-head
    desc: Rust build.rs collects git patch diff
    crit: suspicious
    conf: 0.94
    attack: T1083
    for: [rust]
    if:
      type: text
      substr: '&["diff", "HEAD^", "HEAD"]'
  - id: rust-build-curl-post-body
    desc: Rust build.rs posts body with curl
    crit: component
    conf: 0.9
    attack: T1041
    for: [rust]
    if:
      type: text
      substr: '.arg("-d").arg(body)'
  - id: rust-build-sentry-envelope
    desc: Rust build.rs sends Sentry envelope
    crit: suspicious
    conf: 0.94
    attack: T1041
    for: [rust]
    if:
      type: text
      regex: 'ingest\.[a-z0-9.-]*sentry\.io/.{0,160}/envelope/'
  - id: rust-build-source-patch-payload
    desc: Rust build.rs embeds source patch payload
    crit: suspicious
    conf: 0.92
    attack: T1083
    for: [rust]
    if:
      type: text
      regex: '"patch"[\s\S]{0,160}patch\.replace'

  - id: rust-build-embedded-runtime-module
    desc: build.rs embeds a source module
    crit: component
    conf: 0.9
    attack: T1195.002
    for: [rust]
    if:
      type: text
      regex: '#\[path\s*=\s*"src/.{0,80}"\][\s\S]{0,120}\bmod\s+[A-Za-z_][A-Za-z0-9_]*'

  - id: rust-build-xor-indexed-key
    desc: build code XORs with a repeating key
    crit: suspicious
    conf: 0.95
    attack: T1027
    for: [rust]
    if:
      type: text
      regex: '\^\s*seed\s*\[\s*[A-Za-z_][A-Za-z0-9_]*\s*%\s*seed\.len\(\)\s*\]'

  - id: rust-build-encoded-command-arguments
    desc: build code passes encoded arguments
    crit: suspicious
    conf: 0.93
    attack: T1027
    for: [rust]
    if:
      type: text
      regex: 'material\s*\([^)]{0,120}ENC_[A-Za-z_]+'

  - id: rust-build-file-metadata-body
    desc: build code formats file upload fields
    crit: component
    conf: 0.95
    attack: T1041
    for: [rust]
    if:
      type: text
      regex: 'format!\([\s\S]{0,220}\{file_str\}[\s\S]{0,220}\{label\}'

composite_rules:
  - id: rust-build-obfuscated-file-uploader
    desc: build.rs hides a local file uploader in an embedded module
    crit: hostile
    conf: 0.995
    scope: archive
    for: [rust, archives]
    attack: T1195.002
    mbc: E1041
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: rust-build-embedded-runtime-module
      - id: rust-build-xor-indexed-key
      - id: rust-build-encoded-command-arguments
      - id: rust-build-file-metadata-body
      - id: micro-behaviors/process/create/direct::rust-indirect-command-new
  - id: rust-build-host-user-command-recon
    desc: Rust build.rs gathers host user
    crit: suspicious
    conf: 0.96
    attack: T1082
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: micro-behaviors/os/sysinfo/hostname::rust-command-hostname
      - id: micro-behaviors/process/user/query::rust-command-whoami

  - id: rust-build-git-patch-curl-exfil
    desc: Rust build.rs exfils git patch via curl
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: rust-build-git-diff-head
      - id: rust-build-curl-post-body
    any:
      - id: rust-build-git-log-author-email
      - id: rust-build-source-patch-payload
      - id: rust-build-sentry-envelope

  - id: rust-build-sentry-source-patch-exfil
    desc: Rust build.rs exfils source patch to Sentry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    all:
      - id: rust-build-git-patch-curl-exfil
      - id: rust-build-sentry-envelope
      - id: rust-build-source-patch-payload

  - id: cargo-build-hook-git-patch-exfil
    desc: Cargo build hook exfils git patch
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-script-declared
      - id: rust-build-git-patch-curl-exfil

  - id: cargo-archive-build-rs-git-patch-exfil
    desc: Cargo archive build.rs exfils git patch
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, archives]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-git-patch-curl-exfil
    unless:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-script-declared

  - id: rust-build-supabase-recon-exfil
    desc: Rust build.rs recons host then exfils to Supabase
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: rust-build-host-user-command-recon
      - id: rust-build-supabase-webhook-oob
      - id: rust-build-mystenlabs-audit-ua
      - id: rust-build-powershell-base64-utf8
      - id: rust-build-restmethod-useragent
      - id: micro-behaviors/process/create/direct::rust-process-command
      - id: micro-behaviors/process/create/direct::rust-command-powershell

  - id: rust-build-dual-channel-telemetry-exfil
    desc: Rust build.rs sends encoded telemetry in URL and user-agent
    crit: hostile
    conf: 0.99
    attack: T1041
    mbc: E1041
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: rust-build-host-user-command-recon
      - id: rust-build-supabase-webhook-oob
      - id: rust-build-mystenlabs-audit-ua
      - id: rust-build-powershell-base64-utf8
      - id: rust-build-restmethod-useragent
      - id: rust-build-fake-security-warning
      - id: micro-behaviors/process/create/direct::rust-command-powershell

  - id: cargo-build-hook-supabase-recon-exfil
    desc: Cargo build hook recons host and exfils telemetry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-script-declared
      - id: rust-build-supabase-recon-exfil

  - id: cargo-archive-build-rs-supabase-recon-exfil
    desc: Cargo archive build.rs recons host and exfils telemetry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust, archives]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-supabase-recon-exfil
    unless:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-script-declared

  - id: cargo-build-hook-masked-telemetry-exfil
    desc: Cargo build hook masks telemetry as security validation
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-script-declared
      - id: rust-build-dual-channel-telemetry-exfil
      - id: rust-build-fake-security-warning

  - id: rust-build-telegram-recon-exfil
    desc: Rust build.rs exfils host profile to Telegram
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust]
    all:
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-file
      - id: rust-build-host-user-command-recon
      - id: micro-behaviors/communications/http/services/telegram::rust-telegram-bot-api-client
      - id: micro-behaviors/process/create/direct::rust-command-curl-wget
    any:
      - id: micro-behaviors/communications/http/ip-discovery::ifconfig-me
      - id: objectives/supply-chain/install-hook/build/behavioral::rust-build-rs-command-output

  - id: cargo-archive-build-rs-telegram-recon-exfil
    desc: Cargo archive build.rs exfils host profile
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1041
    for: [rust, archives]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-telegram-recon-exfil
    unless:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-script-declared

  - id: cargo-archive-build-rs-masked-telemetry-exfil
    desc: Cargo archive build.rs masks telemetry as security validation
    crit: hostile
    conf: 0.99
    attack: T1195.002
    mbc: E1041
    for: [rust, archives]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: rust-build-dual-channel-telemetry-exfil
      - id: rust-build-fake-security-warning
    unless:
      - id: objectives/supply-chain/install-hook/build/behavioral::cargo-build-script-declared
