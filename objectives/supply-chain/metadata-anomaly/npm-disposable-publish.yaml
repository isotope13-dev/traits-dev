# Disposable npm publications, read from the registry version document.
#
# The shape these campaigns share is a package that was never meant to be
# used by a developer. `npm init` is run, nothing in the manifest is ever
# edited -- description blank, keywords blank, author blank, the placeholder
# test script left in place -- and a one-to-few-file payload is pushed. The
# package exists to occupy a registry coordinate: a public-CDN payload origin
# (jsDelivr and unpkg serve any published file), a name reservation, or a
# dependency-confusion placeholder kept fresh by republication.
#
# Each leg is neutral on its own and lives in metadata/: a blank description
# is sloppy publishing, a two-file tarball is a normal polyfill, and every
# release document carries a tarball URL. The conjunction is what is unusual,
# because a package a human intends other humans to install acquires at least
# one filled-in field along the way.
#
# Deliberately kept at suspicious. A private scratch package published the
# same way is indistinguishable from here -- the registry document does not
# carry the payload, so what the package *does* is decided by scanning the
# tarball, where the payload's own rules apply.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, data]
  attack: T1195.002

composite_rules:
  # The unedited `npm init` scaffold, published. Neutral-but-notable on its
  # own: it tells a triager that nobody wrote anything about this package.
  - id: npm-unedited-init-scaffold-release
    desc: npm release ships unedited init scaffold
    crit: notable
    conf: 0.88
    all:
      - id: metadata/package/quality/empty::npm-registry-empty-description
      - id: metadata/package/quality/empty::npm-registry-empty-keywords
      - id: metadata/package/quality/empty::npm-init-placeholder-test-script

  # Scaffold + an unattributed publisher + a payload too small to be the
  # library the coordinate implies. This is the disposable-publication shape.
  - id: npm-disposable-scaffold-publication
    desc: Unattributed npm scaffold ships tiny payload
    crit: suspicious
    conf: 0.9
    all:
      - id: npm-unedited-init-scaffold-release
      - id: metadata/package/quality/empty::npm-registry-empty-author
      - id: metadata/package/manifest/publishing::npm-registry-dist-filecount-1-4
      - id: metadata/package/manifest/publishing::npm-registry-dist-unpacked-under-4kb

  # A package with nothing written about it does not accumulate ten patch
  # releases by hand. Repeated republication of a content-free coordinate is
  # how these campaigns rotate a payload -- each release swaps the destination
  # the shipped file points at -- and how squatters keep a name looking live.
  - id: npm-scaffold-release-patch-churn
    desc: Content-free npm release republished 10+ times
    crit: suspicious
    conf: 0.87
    all:
      - id: npm-unedited-init-scaffold-release
      - id: metadata/package/quality/version-sentinel::npm-registry-patch-version-double-digit

  # npm writes `gitHead` only when publishing from a git working tree, so the
  # release provably came out of a checkout the manifest then declines to
  # name. Not proof of anything by itself -- a private repo is a normal reason
  # -- but it means the published artifact cannot be diffed against a source,
  # which is exactly the audit gap a trojanized release needs.
  - id: npm-git-published-release-without-repository
    desc: Git-published npm release names no repository
    crit: notable
    conf: 0.8
    all:
      - id: metadata/package/manifest/repository::npm-registry-git-head-recorded
    unless:
      - id: metadata/package/manifest/repository::npm-registry-repository-field
      - id: metadata/package/manifest/repository::npm-registry-homepage-field
