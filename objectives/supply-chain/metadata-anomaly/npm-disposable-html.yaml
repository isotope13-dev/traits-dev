# Disposable HTML-only npm publications are used as public-CDN payload origins.
# The HTML entrypoint is not install-time execution: these rules describe the
# registry publication shape and leave phishing or redirect attribution to
# payload-level rules that inspect the page itself.
defaults:
  platforms: [unix, windows]
  for: [npm, archives]
  attack: T1195.002

composite_rules:
  - id: patterned-name-sentinel-html-publication
    desc: Patterned-name npm 1.0.0 release contains only HTML
    crit: hostile
    conf: 0.98
    for: [package.json]
    all:
      - id: objectives/supply-chain/hidden-payload/cdn-hosting::npm-disposable-html-hosting-stub
      - id: metadata/package/quality/empty::npm-no-description
      - id: metadata/package/quality/version-sentinel::npm-version-exactly-1-0-0
    any:
      - id: metadata/package/manifest/name::npm-name-consonant-run-digit-suffix
      - id: metadata/package/manifest/name::npm-name-two-letter-digit-long-suffix

  - id: security-held-education-html-publication
    desc: Security-held education npm release contains only HTML
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: objectives/supply-chain/hidden-payload/cdn-hosting::npm-disposable-html-hosting-stub
      - id: metadata/package/manifest/name::npm-name-education-activity
      - id: metadata/registry::registry-security-hold-record
      - id: metadata/package/quality/version-sentinel::npm-version-exactly-1-0-0
