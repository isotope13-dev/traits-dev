defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1195.002
composite_rules:
  - id: html-comment-disguises-version-change
    desc: Comment hides a version change to avoid suspicion
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/document/html::comment-avoid-suspicion
      - id: metadata/document/html::comment-version-looks-identical
