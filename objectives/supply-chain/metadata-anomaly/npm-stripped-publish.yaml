# npm publish archives are expected to include package/package.json. A tarball
# that ships compiled runtime under package/dist without any manifest is a
# stripped republication artifact common in name-squatting campaigns -- but,
# per metadata/package/manifest/entrypoint::runtime-shipped-without-publish-manifest,
# a manifestless runtime archive also has common benign causes (a botched
# publish, or a collection/mirroring tool that stores a package's manifest
# separately from its runtime tree). A genuine flat-cache/cacheable runtime +
# license with nothing else off about it -- no typosquatted name, no modified
# or malicious payload -- byte-for-byte matches that benign shape, so this
# stays suspicious. The sibling composites that add a typosquat basename
# (objectives/supply-chain/impersonation/cacheable-utils::cacheable-utils-stripped-typosquat)
# or a stolen/modified runtime signature
# (objectives/supply-chain/hidden-payload/package::cacheable-runtime-stripped-republish)
# carry the hostile verdict once that distinguishing evidence is present.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1195.002

composite_rules:
  - id: npm-manifestless-runtime-tiny-archive
    desc: npm tarball ships genuine runtime without manifest
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::runtime-shipped-without-publish-manifest
      - id: metadata/package/files/included::npm-license-archive-member
      - id: well-known/lib/runtime/cacheable::cacheable-jared-wray-license
