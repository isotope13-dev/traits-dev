# npm publish archives are expected to include package/package.json. A tarball
# that ships compiled runtime under package/dist without any manifest is a
# stripped republication artifact common in name-squatting campaigns.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1195.002

composite_rules:
  - id: npm-manifestless-runtime-tiny-archive
    desc: npm tarball ships runtime without manifest
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::runtime-shipped-without-publish-manifest
      - id: metadata/package/files/included::npm-license-archive-member
      - id: well-known/lib/cacheable::cacheable-jared-wray-license
