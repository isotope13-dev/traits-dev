# tea.xyz reward packages can be legitimate, so the manifest marker is neutral.
# The hostile verdict requires the published-package wrapper shape seen in
# registry-pollution campaigns: an anonymous publish root declares a runtime
# dependency it never imports and carries another package manifest inside it.
#
# Do not gate on `is-private`: campaign samples often nest a `private: true`
# app scaffold under a public publish root, and archive scope would treat that
# nested flag as an exclusion.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, archives]
  attack: T1195.002

composite_rules:
  - id: tea-reward-manifest-any
    desc: Tea reward manifest present by name or marker
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
    any:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/files/included::archive-tea-reward-doc-comment

  - id: tea-reward-hollow-wrapper
    desc: Tea package wraps a nested app hollowly
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/included::archive-nested-package-json-entry
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: metadata/package/files/nested::archive-nested-lockfile
    any:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/files/included::archive-tea-reward-doc-comment
    unless:
      - id: metadata/package/manifest/workspace::has-workspaces

  - id: tea-reward-scaffold-wrapper
    desc: Tea package nests a web app scaffold
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/included::archive-nested-package-json-entry
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: metadata/package/files/nested::archive-nested-webapp-config
    any:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/files/included::archive-tea-reward-doc-comment
    unless:
      - id: metadata/package/manifest/workspace::has-workspaces
