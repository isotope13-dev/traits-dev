# tea.xyz reward packages can be legitimate, so the campaign sentence marker
# stays suspicious until paired with package-shape evidence.  The hostile
# verdict requires the registry-pollution shape: a generated package has a
# large runtime dependency fanout, or repeats the marker in its test.
#
# Do not gate on `is-private`: campaign samples often nest a `private: true`
# app scaffold under a public publish root, and archive scope would treat that
# nested flag as an exclusion.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, archives]
  attack: T1195.002

traits:
  - id: tea-generated-phrase-marker
    desc: Tea reward generated phrase marker
    crit: suspicious
    conf: 0.99
    for: [package.json, javascript, markdown, text, npm, tar]
    if:
      type: text
      regex: '\b[a-z0-9][a-z0-9-]{2,79}-complete-themselves\b'
      case_insensitive: true

  - id: tea-generated-description-prefix
    desc: Tea reward generated description prefix
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: description
      regex: '^\([^)]{1,80}\)\s*-\s*This function is used to convert multiple words'

  - id: tea-generated-description-suffix
    desc: Tea reward generated description suffix
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: description
      regex: 'containing the word [a-z0-9][a-z0-9-]{2,79}-complete-themselves\.$'
      case_insensitive: true

composite_rules:
  - id: tea-generated-sentence-template
    desc: Tea reward generated-sentence description
    crit: suspicious
    conf: 0.99
    scope: file
    for: [package.json]
    all:
      - id: tea-generated-description-prefix
      - id: tea-generated-description-suffix

  - id: tea-generated-dependency-fanout
    desc: Tea reward manifest combines generated sentence and dependency fanout
    crit: hostile
    conf: 0.99
    scope: file
    for: [package.json]
    all:
      - id: tea-generated-sentence-template
      - id: metadata/package/dependencies/manifest::npm-dependency-fanout

  - id: tea-generated-test-case
    desc: Tea campaign test carries generated phrase marker
    crit: hostile
    conf: 0.99
    scope: file
    for: [javascript]
    all:
      - id: tea-generated-phrase-marker
      - id: metadata/package/testing/presence/scripted::it-call
      - id: metadata/package/testing/harness/runtime::test-basename-suffix

  - id: tea-reward-manifest-any
    desc: Tea reward manifest present by name or marker
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
    any:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/files/included::archive-tea-reward-doc-comment

  - id: tea-reward-hollow-wrapper
    desc: Tea package wraps a nested app hollowly
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/included::archive-nested-package-json-entry
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: metadata/package/files/nested::archive-nested-lockfile
    any:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/files/included::archive-tea-reward-doc-comment
    unless:
      - id: metadata/package/manifest/workspace::has-workspaces

  - id: tea-reward-scaffold-wrapper
    desc: Tea package nests a web app scaffold
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/included::archive-nested-package-json-entry
      - id: metadata/package/files/nested::archive-nested-source-tree
      - id: metadata/package/files/nested::archive-nested-webapp-config
    any:
      - id: metadata/package/files/included::archive-tea-reward-manifest
      - id: metadata/package/files/included::archive-tea-reward-doc-comment
    unless:
      - id: metadata/package/manifest/workspace::has-workspaces
