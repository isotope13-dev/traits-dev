# A patch wearing an automation identity that carries executable code.
#
# Dependency bots edit version pins; they never add `eval()` calls. A patch
# authored by `dependabot[bot]` (or any `[bot]` identity) whose added lines
# evaluate a decoded buffer is either a forged author line or a compromised
# automation token -- patch author/content skew, not dependency maintenance.
# Seen in the reworm Glassworm drop (2025): a fake dependabot lodash bump
# whose package.json hunk hid variation-selector-encoded JavaScript behind
# `eval(Buffer.from(...))`, alongside a yarn.lock pin downgrade.
defaults:
  platforms:
  - unix
  - windows
  for:
  - text
  attack: T1195.002
composite_rules:
  - id: bot-patch-adds-executable
    desc: Bot-authored patch adds executable code
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/format/markup::patch-from-bot-identity
      - id: objectives/supply-chain/hidden-payload/encoding::manifest-eval-decoded-buffer
  # The destructive twin: a bot-authored patch whose added lines wipe the
  # root filesystem. Automation writes version pins, not `rm -rf /` -- a
  # `[bot]` author on a wiper is a forged identity or a hijacked pipeline.
  # Seen in a kubernetes-el commit (2026) that replaced the whole library
  # with `(shell-command-to-string "sudo rm -rf / ...")`.
  - id: bot-patch-carries-wiper
    desc: Bot-authored patch carries a wiper
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/format/markup::patch-from-bot-identity
      - id: objectives/impact/destroy/shell-out::shell-out-call-wipes-root
