# A manifest that claims a git repository and gives a URL that is not one.
#
# `"repository": {"type": "git", "url": "https://example.com/"}` reads as
# provenance to a human skimming the registry page and to any tool that only
# checks the field is present, while pointing at a marketing site nobody can
# clone. Registry-spam and name-squat publications produce it because their
# generator fills every manifest field, and there is no repository to name.
#
# Filed as an anomaly rather than a metadata fact: the two halves are each
# ordinary, and it is the contradiction between them that carries the signal.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  attack: T1195.002

composite_rules:
  - id: npm-git-repository-claim-without-repository
    desc: Manifest claims git repo but URL is a web page
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/manifest/repository::repo-declares-git-type
      - id: metadata/package/manifest/repository::repo-url-is-site-root
