# An npm manifest field that carries a payload instead of metadata.
#
# npm copies every top-level package.json key into the registry version
# document verbatim, including keys npm itself does not define. That turns the
# manifest into a writable, CDN-served, publicly readable byte channel needing
# no code in the tarball at all: publish a patch release and every reader of
# `registry.npmjs.org/<pkg>` sees the new value.
#
# `mfmzdata` and `zhuanhua` — published by `nianpm`, the account behind the
# pulled `px8my` — use it that way. Both ship a plausible Chinese
# simplified/traditional converter and both carry a non-standard top-level
# `data` key holding 64 base64 characters (48 bytes). Across their 78 and 118
# patch releases the first and last 16-byte blocks repeat verbatim while the
# middle block changes on every publish, which is the shape of ECB-mode
# ciphertext: fixed header, rotating body, fixed trailer. Nothing in either
# package reads the field, and neither manifest documents it.
#
# The rule asserts only what it matches — a manifest key npm does not define
# whose whole value is a long base64 run — and leaves the payload's meaning to
# a human, which is why it is suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  attack: T1195.002
  # Both the tarball manifest and the registry version document expose the key
  # at the same top-level path.
  for: [package.json, pkginfo, data]

traits:
  - id: npm-manifest-data-field-base64-blob
    desc: Manifest data field holds base64 blob
    crit: suspicious
    conf: 0.85
    if:
      type: value
      path: data
      regex: '^[A-Za-z0-9+/]{40,}={0,2}$'
