---
# A package that claims a permissive license but ships only obfuscator output.
#
# MIT, ISC, BSD and Apache-2.0 all grant the recipient the right to read,
# modify and redistribute the work, and all four are understood to travel with
# source. A tarball whose entire runtime is javascript-obfuscator output --
# rotated string table, hex-mangled identifiers, control-flow flattening --
# grants that right on paper while withholding it in practice: nothing in the
# published artifact is modifiable, and the "source" the license refers to is
# not in the package.
#
# That contradiction is worth surfacing on its own, but it matters most as a
# supply-chain signal. Vendored commercial code republished under a permissive
# license is the usual explanation, and it is also the shape a relicensed or
# repackaged payload takes: the license field buys trust that the shipped bytes
# do not earn. Two of the sibling exceptions in
# `metadata/build/minifier/traits.yaml` already describe the honest version of
# this -- a project that declares javascript-obfuscator as a devDependency and
# runs it from a build script is obfuscating its own source in the open -- so
# both suppress this rule.
#
# `hex-name-mangling-with-string-table-rotation` is the leg rather than the
# stronger `full-anti-static-obfuscator-preset` on purpose: the full preset is
# itself suppressed for files under `dist/`, which is exactly where a package's
# runtime lives, so building on it would make this rule unable to fire on the
# common case.
#
# Suspicious, not hostile: obfuscating a commercial library is a licensing
# decision, not an attack. The rule asserts the contradiction and leaves the
# reason to a human.
defaults:
  platforms: [windows, unix]
  attack: T1195.002

composite_rules:
  - id: permissive-license-with-obfuscated-runtime
    desc: Permissive license declared but runtime ships only obfuscator output
    crit: suspicious
    conf: 0.85
    scope: outer
    all:
      - id: metadata/package/license::permissive-license-declared
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
    unless:
      - id: metadata/build/minifier::intentional-javascript-obfuscator-build
      - id: metadata/build/minifier::intentional-webpack-obfuscator-build
