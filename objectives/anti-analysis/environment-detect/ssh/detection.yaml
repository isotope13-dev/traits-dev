# SSH Remote Session Detection
# ATT&CK: T1497 (Virtualization/Sandbox Evasion)
# Detects checking for SSH environment variables (remote session detection)
defaults:
  crit: notable
  conf: 0.7
  attack: "T1497"
  platforms: [linux, unix, macos]
composite_rules:
  - id: ssh-check
    desc: Checks SSH session variables for remote-session detection
    # Agent socket and agent PID variables describe local SSH-agent use, not a remote session.
    any:
      - id: micro-behaviors/os/env/ssh::ssh-connection-var
      - id: micro-behaviors/os/env/ssh::ssh-client-var
      - id: micro-behaviors/os/env/ssh::ssh-tty-var
    unless:
      - id: well-known/app/network/openssh::package-context
