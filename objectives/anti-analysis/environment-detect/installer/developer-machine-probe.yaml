# A package that works out where it is running, then edits itself.
#
# The trojanized purescript-npm-installer walked its parent directory chain
# looking for a git checkout before acting, and rewrote its own source file on
# disk. Both halves are about staying unobserved rather than about the
# payload: the probe tells the package whether it landed on a developer's
# machine or in a clean CI container, and rewriting its own source means the
# file an investigator later reads is not the file that ran.
#
# Stated as its own objective because it survives any change of payload. What
# a future variant does after deciding it is unobserved is open; that it makes
# the decision at all, and then erases the code that made it, is the finding.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497,T1027.004
  mbc: B0001

composite_rules:
  - id: environment-probing-self-rewriting-package
    desc: Package probes host then rewrites itself
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-analysis/environment-detect/check::node-parent-chain-git-checkout-probe
      - id: objectives/anti-analysis/self-modify/runtime::node-rewrites-own-source-file
    unless:
      - id: metadata/package/testing/
