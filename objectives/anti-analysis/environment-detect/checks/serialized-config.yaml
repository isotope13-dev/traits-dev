defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: enabled-anti-debug-config
    desc: Configured anti-debug switch
    crit: notable
    conf: 0.99
    attack: T1622
    if:
      type: hex
      section: .data
      pattern: 22 61 6E 74 69 5F 64 65 62 75 67 22 3A 74 72 75 65
  - id: enabled-anti-sandbox-config
    desc: Configured anti-sandbox switch
    crit: notable
    conf: 0.99
    attack: T1497.001
    if:
      type: hex
      section: .data
      pattern: 22 61 6E 74 69 5F 73 61 6E 64 62 6F 78 22 3A 74 72 75 65
  - id: enabled-anti-vm-config
    desc: Configured anti-VM switch
    crit: notable
    conf: 0.99
    attack: T1497.001
    if:
      type: hex
      section: .data
      pattern: 22 61 6E 74 69 5F 76 6D 22 3A 32
  - id: enabled-anti-emulation-config
    desc: Configured anti-emulation switch
    crit: notable
    conf: 0.99
    attack: T1497
    if:
      type: hex
      section: .data
      pattern: 22 61 6E 74 69 5F 65 6D 75 6C 61 74 69 6F 6E 22 3A 74 72 75 65
  - id: exit-on-analysis-config
    desc: Configured analysis-triggered exit
    crit: notable
    conf: 0.99
    attack: T1497,T1622
    if:
      type: hex
      section: .data
      pattern: 22 65 78 69 74 5F 6F 6E 5F 64 65 74 65 63 74 22 3A 74 72 75 65

composite_rules:
  - id: enabled-anti-analysis-config
    desc: Enabled anti-debug, anti-sandbox, and anti-VM gate configuration
    crit: hostile
    conf: 0.99
    attack: T1497,T1622
    all:
      - id: enabled-anti-debug-config
      - id: enabled-anti-sandbox-config
      - id: enabled-anti-vm-config
      - id: enabled-anti-emulation-config
      - id: exit-on-analysis-config
