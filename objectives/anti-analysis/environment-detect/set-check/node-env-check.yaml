defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497,T1499
  mbc: B0001

composite_rules:
  - id: node-env-gated-cache-disk-fill
    desc: Node environment check gates cache disk-fill loop
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: objectives/impact/dos/disk::unbounded-cache-disk-fill-typescript
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: node-env-gated-shell-history-harvest
    desc: Node environment check gates shell history harvest
    crit: hostile
    conf: 0.99
    attack: T1497,T1552.003
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: micro-behaviors/fs/read/file/history::shell-history-path-near-file-read
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: node-env-gated-login-item-persist
    desc: Node environment check gates macOS login item persistence
    crit: hostile
    conf: 0.99
    attack: T1497,T1547.015
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: objectives/persistence/login/items::applescript-login-item-persistence
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: node-env-gated-ssh-key-harvest
    desc: Node environment check gates SSH key harvest
    crit: hostile
    conf: 0.99
    attack: T1497,T1552.004
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: objectives/credential-access/ssh/key::node-ssh-key-file-harvest
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: node-env-gated-clipboard-replacer
    desc: Node environment check gates clipboard replacer
    crit: hostile
    conf: 0.99
    attack: T1497,T1115,T1565.001
    all:
      - id: micro-behaviors/os/env/read/variable::node-env-text-outside-npm-context-ci-markers
      - id: objectives/impact/crypto-manipulation/clipboard::gated-detached-powershell-wallet-clipper
    unless:
      - id: metadata/path/directory::test-directory-component
