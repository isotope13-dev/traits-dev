defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-ppid-argv-comparison
    desc: Compares Node's parent PID in an expression
    crit: suspicious
    conf: 0.94
    if:
      type: tree-sitter
      language: javascript
      node: binary_expression
      regex: 'process[.]ppid[[:space:]]*[!=]={1,2}|[!=]={1,2}[[:space:]]*process[.]ppid'
composite_rules:
  - id: node-ppid-check
    desc: Verifies parent process ID against argument (anti-analysis/sandbox evasion)
    conf: 0.95
    crit: hostile
    attack: T1497
    mbc: B0003
    near_lines: 8
    all:
      - id: node-ppid-argv-comparison
      - id: micro-behaviors/process/info/commandline::check-argv
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
    unless:
      - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
