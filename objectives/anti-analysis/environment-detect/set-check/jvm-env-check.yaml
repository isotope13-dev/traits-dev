# A JVM component that checks for an environment variable gate before executing
# a shell command conceals its payload from automated dynamic analysis.
defaults:
  platforms: [unix, macos, linux, windows]
  for: [java, kotlin, jar, class, java_class]
  attack: T1497,T1059
  mbc: B0001,B0032

composite_rules:
  - id: jvm-env-gated-shell-execution
    desc: JVM environment check gates shell execution
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/read::java-system-getenv
      - id: micro-behaviors/process/create/shell/interpreter::jvm-processbuilder-sh-command-start
      - id: metadata/file/invisible-unicode::zero-width-only-string
    any:
      - id: micro-behaviors/process/create/shell/interpreter::jvm-sh-c-argument-pass
      - id: micro-behaviors/process/create/shell/spawn::kotlin-processbuilder-shell
