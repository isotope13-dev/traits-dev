# A JVM component that checks for an environment variable gate before executing
# a shell command conceals its payload from automated dynamic analysis.
defaults:
  platforms: [unix, macos, linux, windows]
  for: [java, kotlin, jar, class, java_class]
  attack: T1497,T1059
  mbc: B0001,B0032

composite_rules:
  - id: jvm-env-gated-shell-execution
    desc: JVM environment check gates shell execution
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    scope: archive
    all:
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/fs/path/application/interpreter::jvm-command-shell-path
    any:
      - id: micro-behaviors/os/env/read/variable::java-system-getenv
      - id: micro-behaviors/os/env/read/variable::jvm-getenv-method

  - id: jvm-env-gated-browser-theft
    desc: JVM environment check gates browser credential or cookie theft
    crit: hostile
    conf: 0.99
    attack: T1497,T1555.003
    mbc: B0001
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/application-state/cookie/store::jvm-macos-browser-cookie-http-exfil
    any:
      - id: micro-behaviors/os/env/read/variable::jvm-getenv-method
      - id: micro-behaviors/os/env/read/variable::java-system-getenv
