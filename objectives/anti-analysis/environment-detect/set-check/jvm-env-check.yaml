# Environment reads alone do not establish an execution gate or sandbox evasion.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, jar, class, java_class]
  attack: T1497,T1059
  mbc: B0001,B0032

composite_rules:
  - id: jvm-env-gated-browser-theft
    desc: Environment read accompanies JVM browser cookie theft
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1041
    mbc: B0028
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/application-state/cookie/store::jvm-macos-browser-cookie-http-exfil
    any:
      - id: micro-behaviors/os/env/read/current::jvm-getenv-method
      - id: micro-behaviors/os/env/read/current::java-system-getenv
