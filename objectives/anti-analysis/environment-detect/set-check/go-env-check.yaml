defaults:
  platforms: [unix, macos, linux, windows]
  for: [go]
  attack: T1497,T1059,T1027
  mbc: B0001,B0032

composite_rules:
  - id: go-env-gated-zero-width-command-execution
    desc: Go environment check gates zero-width command execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/read/variable::os-getenv
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
    unless:
      - id: metadata/path/directory::test-directory-component
