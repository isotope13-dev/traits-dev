defaults:
  platforms: [unix]
  for: [swift, tar]
  attack: T1497,T1561.002
  mbc: B0001,E1561

composite_rules:
  - id: swift-env-gated-raw-disk-wiper
    desc: Swift environment check gates raw disk wiper
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::swift-env-nil-check
      - id: objectives/impact/wipe/disk/device::source-mounted-dynamic-dd-wiper
    unless:
      - id: metadata/path/directory::test-directory-component
