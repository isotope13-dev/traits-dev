defaults:
  platforms: [unix, macos, linux, windows]
  for: [php]
  attack: T1497,T1059
  mbc: B0001,B0032

composite_rules:
  - id: php-env-gated-zero-width-command-execution
    desc: PHP environment check gates zero-width command execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: php-env-gated-developer-credential-harvest
    desc: PHP environment check gates developer credential harvesting
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: micro-behaviors/fs/read/file/target::registry-credential-path-read-cluster
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: php-env-gated-launchagent-persistence
    desc: PHP environment check gates LaunchAgent persistence installation
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: micro-behaviors/os/service/launchagent::source-launchagent-remote-shell-autorun
    unless:
      - id: metadata/path/directory::test-directory-component
