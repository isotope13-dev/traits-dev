defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1497,T1059
  mbc: B0001,B0032

composite_rules:
  - id: php-env-gated-zero-width-command-execution
    desc: PHP environment read accompanies zero-width command execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.004
    mbc: B0032
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/read/current::php-getenv-call
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
