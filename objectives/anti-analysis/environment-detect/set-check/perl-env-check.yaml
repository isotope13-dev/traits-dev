defaults:
  platforms: [macos]
  for: [perl]
  attack: T1497,T1543.004
  mbc: B0001

composite_rules:
  - id: perl-env-gated-launchagent-persistence
    desc: Perl environment check gates LaunchAgent persistence installation
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/read/variable::perl-env-variable-read
      - id: micro-behaviors/os/service/launchagent::source-launchagent-remote-shell-autorun
    unless:
      - id: metadata/path/directory::test-directory-component
