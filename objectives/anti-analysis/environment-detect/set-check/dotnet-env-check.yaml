  - id: dotnet-env-gated-raw-disk-wiper
    desc: .NET environment check gates raw disk wiper
    crit: hostile
    conf: 0.99
    attack: T1497,T1561.002
    mbc: B0001,E1561
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::dotnet-env-null-check
