defaults:
  platforms: [unix, windows]
  for: [csharp, nupkg]
  attack: T1497,T1499
  mbc: B0001

composite_rules:
  - id: dotnet-env-gated-safe-storage-cookie-exfil
    desc: .NET environment check gates Chrome Safe Storage key and cookie exfiltration
    crit: hostile
    conf: 0.99
    attack: T1497,T1555.003,T1041
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::dotnet-env-null-check
      - id: objectives/exfiltration/stealer/application-state/cookie/store::dotnet-safe-storage-cookie-http-exfil
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: dotnet-env-gated-zero-width-command-execution
    desc: .NET environment check gates zero-width steganographic command execution
    crit: hostile
    conf: 0.99
    attack: T1497,T1027.003,T1059.004
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::dotnet-env-null-check
      - id: objectives/anti-static/obfuscation/steganography/invisible-unicode::zero-width-command-loader
    unless:
      - id: metadata/path/directory::test-directory-component
