defaults:
  platforms: [unix, windows]
  for: [csharp, nupkg]
  attack: T1497,T1499
  mbc: B0001

composite_rules:
  - id: dotnet-env-gated-cache-disk-fill
    desc: .NET environment check gates cache disk-fill loop
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::dotnet-env-null-check
      - id: objectives/impact/dos/disk::unbounded-cache-disk-fill-managed
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: dotnet-env-gated-transformed-shell-loader
    desc: .NET environment check gates transformed shell loader
    crit: hostile
    conf: 0.99
    attack: T1497,T1059.004
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::dotnet-env-null-check
      - id: objectives/execution/payload/script-eval/transformed/shell::hex-xor-command-shell-loader
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: dotnet-env-gated-startup-shortcut-dropper
    desc: .NET environment check gates startup shortcut command dropper
    crit: hostile
    conf: 0.99
    attack: T1497,T1547.001
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::dotnet-env-null-check
      - id: objectives/persistence/login/startup/shortcut::startup-shortcut-remote-command-dropper
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: dotnet-env-gated-run-key-node-beacon
    desc: .NET environment check gates Run key node beacon
