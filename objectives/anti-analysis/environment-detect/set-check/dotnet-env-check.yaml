defaults:
  platforms: [unix, windows]
  for: [csharp, nupkg]
  attack: T1497,T1499
  mbc: B0001

composite_rules:
  - id: dotnet-env-gated-cache-disk-fill
    desc: .NET environment check gates cache disk-fill loop
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/env/test::dotnet-env-null-check
      - id: objectives/impact/dos/disk::unbounded-cache-disk-fill-managed
    unless:
      - id: metadata/path/directory::test-directory-component
