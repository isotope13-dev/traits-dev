defaults:
  platforms: [unix, macos, linux, windows]
  for: [c, cpp]
  attack: T1497,T1555.003
  mbc: B0001,B0028

composite_rules:
  - id: native-env-gated-keychain-cookie-theft
    desc: Native environment check gates browser keychain and cookie theft
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: micro-behaviors/os/security/keychain::safe-storage-command-reference
      - id: micro-behaviors/process/create/shell/interpreter::c-system-call
    unless:
      - id: metadata/path/directory::test-directory-component
