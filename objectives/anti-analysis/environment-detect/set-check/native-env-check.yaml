defaults:
  platforms: [unix, macos, linux, windows]
  for: [c, cpp]
  attack: T1497,T1555.003
  mbc: B0001,B0028

composite_rules:
  - id: native-env-gated-keychain-cookie-theft
    desc: Native environment check gates browser keychain and cookie theft
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/test::named-environment-long-secret-comparison
      - id: micro-behaviors/os/security/keychain::safe-storage-command-reference
      - id: micro-behaviors/process/create/shell/interpreter::c-system-call
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: native-env-gated-startup-persistence
    desc: Native environment check gates Startup shortcut persistence installation
    crit: hostile
    conf: 0.99
    attack: T1497,T1547.001
    all:
      - id: micro-behaviors/os/env/read/variable::native-getenv
      - id: objectives/persistence/login/startup/shortcut::startup-shortcut-remote-command-dropper
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: native-env-gated-run-key-persistence
    desc: Native environment check gates Run key persistence installation
    crit: hostile
    conf: 0.99
    attack: T1497,T1547.001
    for: [c, cpp, source, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/env/read/variable::native-getenv
    any:
      - id: objectives/persistence/login/registry/script::run-key-node-beacon-persistence
      - id: objectives/persistence/login/registry/run-key::native-run-key-script-dropper-persistence
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: native-env-gated-transformed-shell-loader
    desc: Native environment check gates transformed shell loader
    crit: hostile
    conf: 0.99
    attack: T1497,T1059.004
    for: [c, cpp, source, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/env/read/variable::native-getenv
      - id: objectives/execution/payload/script-eval/transformed/shell::c-hex-xor-system-loader
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: native-env-gated-credential-dns-exfil
    desc: Native environment check gates credential DNS exfiltration
    crit: hostile
    conf: 0.99
    attack: T1497,T1048.003,T1552.001
    for: [c, cpp, source, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/env/read/variable::native-getenv
      - id: objectives/exfiltration/stealer/credential/record::hex-developer-credential-dns-exfil
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: rust-env-gated-embedded-payload-execution
    desc: Rust environment variable check gates embedded payload execution
    crit: hostile
    conf: 0.99
    attack: T1497,T1105,T1059
    for: [rust]
    near_bytes: 4000
    all:
      - id: micro-behaviors/os/env/read/variable::std-env-var
      - id: objectives/anti-static/obfuscation/steganography/lsb::embedded-image-lsb-drop-executor
    unless:
      - id: metadata/path/directory::test-directory-component
