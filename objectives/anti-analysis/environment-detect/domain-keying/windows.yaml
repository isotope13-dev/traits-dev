# Environmental keying: a macro whose payload only detonates when the machine's
# USERDOMAIN matches an attacker-supplied domain list, so sandbox detonations
# never reach the payload. Generators embed the check as template text.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml, python, javascript, ruby, php, perl, lua]
  attack: T1497

traits:
  - id: embedded-vba-userdomain-read
    desc: Embeds VBA USERDOMAIN environment read
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)Environ\(\s*"?USERDOMAIN"?\s*\)'

  # The sandbox-evasion form is not a lone Environ() read: the domain is
  # tested for membership in an attacker-supplied list via VBA Filter().
  - id: embedded-vba-userdomain-filter-gate
    desc: Filters USERDOMAIN against a target domain list
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Filter\s*\(.{0,80}USERDOMAIN'

composite_rules:
  - id: macro-domain-environmental-keying
    desc: Gates macro payload on USERDOMAIN environmental keying
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: embedded-vba-userdomain-read
      - id: embedded-vba-userdomain-filter-gate
