defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1480
composite_rules:
  # Both corporate-membership probes, with neither API name in the binary:
  # NetGetJoinInformation for on-premises AD domain membership and the Entra
  # ID join query (NetGetAadJoinInformation or its dsreg.dll backend
  # DsrGetJoinInfo). Software that legitimately needs join state imports
  # these; resolving both by CRC32 digest hides an execution guardrail that
  # keeps the payload dormant on workgroup hosts, which include most
  # analysis sandboxes, and live on managed enterprise machines.
  - id: crc32-hashed-ad-and-entra-join-probe
    desc: Hashed AD and Entra ID join-state probes
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-net-get-join-information
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-net-get-aad-join-information
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-dsr-get-join-info
