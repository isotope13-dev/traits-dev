# Environment Checks - WSH vs Browser
# Detects checks used to determine if running in Windows Script Host
defaults:
  crit: notable
  conf: 0.8
  platforms: [windows]
  for: [javascript, typescript]
  attack: "T1497.001"
  mbc: "B0003"
# `typeof document === 'undefined'` and `typeof window === 'undefined'` are the
# universal isomorphic-JS guards -- every library that has to run under both a
# browser and Node writes them, so as anti-analysis atoms they labelled ordinary
# code. They now live as neutral runtime-environment checks in
# micro-behaviors/os/sysinfo/platform/runtime and are referenced from here; the
# WSH inference comes from the WScript legs below, not from the guard itself.
traits:
  - id: env-check-wscript
    desc: Checks for presence of WScript
    if:
      type: text
      regex: "(?i)typeof\\s+WScript\\s*(=|!)=+\\s*['\"]object['\"]"
  - id: obfuscated-wscript-host-check
    desc: Obfuscated WScript host check
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'WScript\s*==.{0,80}V2luZGmeredith93cyBTY3JpcHQg'
  - id: env-check-comspec-cmd
    desc: Validates ComSpec path against cmd.exe
    crit: suspicious
    if:
      type: text
      regex: '(?i)ComS(pec)?\b.{0,100}%SystemRoot%\\system32\\cmd\.exe'
  - id: vbs-computer-name-exit-gate
    desc: VBS exits on computer-name analysis markers
    crit: suspicious
    conf: 0.94
    for: [vbs]
    if:
      type: text
      regex: '(?is)\bComputerName\b.{0,500}\bInstr\s*\(\s*UCase\s*\(.{0,120}\).{0,120}\bWScript\.Quit\b'
composite_rules:
  - id: vbs-gated-marker-obfuscated-launcher
    desc: VBS gates an obfuscated hidden launcher on hostname markers
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1497.001,T1564.003
    for: [vbs]
    all:
      - id: vbs-computer-name-exit-gate
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-marker-cleanup
    any:
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-split-frombase64string
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-split-powershell-path
    needs: 1
  - id: vbs-hostname-gated-fragmented-loader
    desc: Hostname-gated fragmented hidden VBScript loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1497.001,T1564.003
    for: [vbs]
    all:
      - id: vbs-computer-name-exit-gate
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: objectives/anti-static/obfuscation/multi-layer::vbs-base64-fragment-helper-calls
  - id: browser-global-absence
    desc: Checks for missing browser globals
    crit: component
    conf: 1.0
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::browser-document-absence-check
      - id: micro-behaviors/os/sysinfo/platform/runtime::browser-window-absence-check
  # "Gated on" means the two sit together. `typeof window === "undefined"` is
  # the standard isomorphic-JS guard and appears in essentially every bundle,
  # so without a proximity bound this pairs an SSR check with a WScript.Shell
  # string megabytes away in the same file -- openclaw's 69 MB worker.mjs
  # matched that way, its WScript.Shell being an unrelated Windows service
  # launcher. A real WSH dropper puts the branch and the COM call together.
  - id: wsh-browser-global-absence-check
    desc: WSH execution gated on missing browser globals
    crit: suspicious
    conf: 0.9
    near_bytes: 1024
    all:
      - id: browser-global-absence
    any:
      - id: env-check-wscript
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: wsh-document-absence-gate
    desc: WSH execution gated on document absence
    crit: suspicious
    conf: 0.92
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::browser-document-typeof-assignment
      - id: micro-behaviors/data/control-flow/analysis::js-undefined-string-compare
    any:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::wscript-shell-literal
