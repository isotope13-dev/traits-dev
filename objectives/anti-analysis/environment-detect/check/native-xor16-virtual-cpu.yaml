defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: xor-virtual-cpu-model-with-hardware-queries
    desc: Concealed virtual CPU name and hardware queries
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/hardware::xor16-qemu-broadwell-model
      - id: micro-behaviors/os/sysinfo/hardware::hardware-query-api-set
      - id: micro-behaviors/os/registry/read::reg-query-value-ex-a-symbol
