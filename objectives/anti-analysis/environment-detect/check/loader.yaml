# Loader analysis-environment checks. The name-membership fragment alone
# does not establish a hostname probe or an execution gate; consumers must
# supply that context.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1497.001

traits: []
composite_rules:
  - id: analysis-hostname-exit
    desc: Exits after analysis hostname check
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/sysinfo/hostname
      - id: micro-behaviors/data/string/search::analysis-name-membership-test
    any:
      - id: micro-behaviors/process/exit/terminate::shell-return-status
      - id: micro-behaviors/process/exit/terminate::python-system-exit-raise
      - id: micro-behaviors/process/exit/terminate::python-sys-exit-symbol

  - id: multi-environment-anti-analysis-gate
    for: [binaries, '!dex', '!pe', javascript, python, ruby, shell]
    desc: Loader suppresses under analysis conditions
    crit: hostile
    conf: 0.98
    near_lines: 80
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: analysis-hostname-exit
      - id: micro-behaviors/os/env/cicd::multi-ci-provider-env-refs
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/security-scanner/

  - id: capability-gated-analysis-evasion
    for: [binaries, '!dex', '!pe', applescript, javascript, lua, perl, php, python, ruby, shell]
    desc: Linux capability check gates execution under analysis conditions
    crit: hostile
    conf: 0.96
    # CapEff plus a bare shell/Python return is educational quiz noise. Require
    # an analysis-environment leg (hostname blocklist or CI provider checks).
    all:
      - id: micro-behaviors/os/privilege/query::proc-status-capability-mask
    any:
      - id: micro-behaviors/data/string/search::analysis-name-membership-test
      - id: micro-behaviors/os/env/cicd::multi-ci-provider-env-refs
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
