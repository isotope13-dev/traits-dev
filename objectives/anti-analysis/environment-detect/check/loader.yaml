# Cross-platform loader checks that suppress execution in analysis and build
# environments.  The individual atoms require a provider/hostname cluster;
# the hostile composite additionally requires a Linux debugger-status probe.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1497.001
  mbc: B0001

traits:
  - id: analysis-hostname-query-fragment
    desc: Hostname query fragment for an analysis gate
    crit: component
    conf: 0.9
    if:
      type: text
      # Require a hostname API/command boundary.  A bare `hostname(` also
      # matches ordinary helpers such as `extractHostname` in browser SDKs.
      regex: '(?i)\b(get)?hostname\s*\(|\$\([[:space:]]*hostname\b'

  - id: analysis-hostname-blocklist
    desc: Analysis-environment hostname blocklist fragment
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      # A prose mention (for example, a "sandbox iframe" used to obtain clean
      # browser prototypes) is not a blocklist.  Require the marker to
      # participate in an inclusion/search test used by a hostname gate.
      regex: '(?i)\b(sandbox|vmware|cuckoo)\b.{0,80}\b(includes|indexOf)\s*\('

composite_rules:
  - id: analysis-hostname-exit
    desc: Exits after analysis hostname check
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: analysis-hostname-query-fragment
      - id: analysis-hostname-blocklist
    any:
      - id: micro-behaviors/process/exit/terminate::shell-return-status
      - id: micro-behaviors/process/exit/terminate::python-system-exit-raise
      - id: micro-behaviors/process/exit/terminate::python-sys-exit-symbol

  - id: multi-environment-anti-analysis-gate
    desc: Loader suppresses under analysis conditions
    crit: hostile
    conf: 0.98
    near_lines: 80
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: analysis-hostname-exit
      - id: micro-behaviors/os/env/vars/cicd::multi-ci-provider-env-refs
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/security-scanner/

  - id: capability-gated-analysis-evasion
    desc: Linux capability check gates execution under analysis conditions
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/privilege/query::proc-status-capability-mask
    any:
      - id: micro-behaviors/process/exit/terminate::shell-return-status
      - id: micro-behaviors/process/exit/terminate::python-system-exit-raise
      - id: micro-behaviors/process/exit/terminate::python-sys-exit-symbol
      - id: analysis-hostname-blocklist
      - id: micro-behaviors/os/env/vars/cicd::multi-ci-provider-env-refs
