defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1497.001

traits:
  - id: applescript-analysis-hostname-predicate
    desc: AppleScript tests sandbox or VMware hostnames
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\bif\s+\w+\s+contains\s+["'']sandbox["''].{0,80}contains\s+["'']vmware'
  - id: applescript-handler-return-gate
    desc: AppleScript true-handler return gate
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'if\s+\w+\(\)\s+then\s+return'

composite_rules:
  - id: applescript-analysis-hostname-gate
    desc: AppleScript suppresses execution on analysis hostnames
    crit: suspicious
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/os/sysinfo/hostname::applescript-shell-hostname
      - id: applescript-analysis-hostname-predicate
      - id: applescript-handler-return-gate
