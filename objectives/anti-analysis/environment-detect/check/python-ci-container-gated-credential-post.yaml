# Python that refuses to run under several CI providers *and* inside
# containers, then reads cloud/cluster/SSH credential stores and POSTs them.
# CI-detection libraries and container-aware tools each do one of these
# checks to adjust behavior; neither has a reason to also collect AWS/kube/SSH
# secrets and send them out. Skipping CI runners and containers is how a
# credential stealer keeps its beacon out of package-scanning sandboxes and
# only fires on developer or production hosts.
defaults:
  platforms: [unix, windows, macos]
  for: [python]
  attack: T1497.001,T1552.001

composite_rules:
  - id: python-ci-container-gated-credential-post
    desc: CI- and container-gated credential collection with HTTP POST
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/os/env/cicd/runner::multi-ci-provider-env-refs-three-plus
      - id: micro-behaviors/fs/proc/container::multi-marker-runtime-detection
      - id: micro-behaviors/communications/http/request/verb::python-http-post-any
    any:
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/secret-config::kube-config
      - id: micro-behaviors/fs/path/secret-config::aws-config
      - id: micro-behaviors/fs/directory/readdir/target::python-expanduser-ssh-list
    needs: 2
