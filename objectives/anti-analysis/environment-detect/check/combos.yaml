defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: native-vm-gate-fields
    desc: Native VM gate fields
    crit: notable
    conf: 0.85
    if:
      type: text
      word: vm_flags
  - id: native-debug-gate-fields
    desc: Native debugger gate fields
    crit: notable
    conf: 0.85
    if:
      type: text
      word: debug_flags
  - id: native-sandbox-gate-fields
    desc: Native sandbox gate fields
    crit: notable
    conf: 0.85
    if:
      type: text
      word: sandbox_flags

composite_rules:
  - id: native-analysis-gating-schema
    desc: VM, debugger, and sandbox gate fields
    crit: suspicious
    conf: 0.95
    all:
      - id: native-vm-gate-fields
      - id: native-debug-gate-fields
      - id: native-sandbox-gate-fields

  - id: native-stealer-analysis-gate
    desc: Native stealer gated by analysis checks
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1555.003,T1119
    for: [pe, dll]
    all:
      - id: native-analysis-gating-schema
      - id: objectives/credential-access/browser/loot::native-browser-loot-report-schema
      - id: objectives/anti-static/obfuscation/imports/api-hashing::fnv1a-api-resolution
