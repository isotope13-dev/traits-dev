defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1497.001
composite_rules:
  - id: system-uptime-history-execution-gate
    desc: Uptime event query with history return gate
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/event/log::system-uptime-event-query
      - id: micro-behaviors/data/control-flow/return::threshold-count-return-gate
  - id: system-uptime-gated-dropper
    desc: System uptime-gated payload dropper
    crit: hostile
    conf: 0.98
    attack: T1497.001,T1105
    all:
      - id: system-uptime-history-execution-gate
      - id: micro-behaviors/fs/write/file/full::writeallbytes-any
