defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-bios-substring-screen
    desc: BIOS query with substring screening return
    crit: suspicious
    conf: 0.94
    attack: T1497.001
    # A BIOS read beside a loader does not prove a launch gate. Require the
    # screening return in the querying function; do not infer a specific VM
    # vendor from an unrecovered encoded blacklist.
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition body: (block
          (try_statement body: (block
            (expression_statement (assignment right: (call
              function: (attribute object: (identifier) @registry
                attribute: (identifier) @open)
              arguments: (argument_list (_) (string) @key))))))
          (try_statement body: (block
            (for_statement body: (block
              (for_statement body: (block
                (if_statement condition: (comparison_operator) @test
                  consequence: (block (return_statement (_) @result)))))))))))
          (#eq? @registry "winreg")
          (#eq? @open "OpenKey")
          (#match? @key "BIOS")
          (#match? @test "^[a-zA-Z_]+ in [a-zA-Z_]+$")
          (#match? @result "^(1(\\.0)?|True)$"))
