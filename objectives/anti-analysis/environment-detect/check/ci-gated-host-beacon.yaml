# Code that bails out under CI and otherwise queries the host and POSTs JSON:
# the CI guard exists to keep the host beacon out of automated analysis.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497,T1082
composite_rules:
  - id: ci-gated-host-info-post
    desc: CI-gated code runs commands and posts host info
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/env/cicd/runner::ci-env-check-early-return
      - id: micro-behaviors/os/sysinfo/profile::node-host-query-json-post-clues
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
