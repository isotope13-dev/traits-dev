defaults:
  platforms: [linux]
  for: [elf]
  attack: T1497.001
  mbc: B0001

traits:
  - id: loader-debug-environment-marker-cluster
    desc: Loader/debugger environment marker cluster
    crit: component
    conf: 0.96
    if:
      type: raw
      section: ".rodata"
      regex: 'LD_PRELOAD.{0,64}LD_DEBUG.{0,64}R2PIPE_IN.{0,64}RUNNING_ON_VALGRIND'

  - id: vmware-low-uptime-marker-cluster
    desc: VMware product and system uptime marker cluster
    crit: component
    conf: 0.96
    if:
      type: raw
      section: ".rodata"
      regex: '/sys/class/dmi/id/product_name.{0,8}VMware.{0,8}/proc/uptime'

composite_rules:
  - id: linux-loader-vm-uptime-analysis-gate
    desc: Linux loader, VMware, and uptime checks
    crit: suspicious
    conf: 0.98
    all:
      - id: loader-debug-environment-marker-cluster
      - id: vmware-low-uptime-marker-cluster
