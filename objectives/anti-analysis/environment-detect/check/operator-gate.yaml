# Operator-only launch gates used to keep a payload out of automated analysis.
# The gate is not family-specific: it is the combination of a hex-decoded
# secret, a digest, and an embedded comparison that matters.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, c, cpp]
  attack: T1497
  mbc: B0013

traits:
  - id: hex-secret-input
    desc: Hex-decoded secret or operator key
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      exact: hex_to_bytes

  - id: digest-secret-comparison
    desc: Digest compared with embedded value
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: sha256

  - id: digest-value-compare
    desc: Compares a digest with embedded data
    crit: suspicious
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: memcmp

composite_rules:
  - id: hex-secret-digest-gate
    desc: Hex secret validated by digest
    crit: suspicious
    conf: 0.92
    all:
      - id: hex-secret-input
      - id: digest-secret-comparison
      - id: digest-value-compare
