# Operator-only launch gates used to keep a payload out of automated analysis.
# The gate is not family-specific: it is the combination of a hex-decoded
# secret, a digest, and an embedded comparison that matters.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, c, cpp]
  attack: T1497
  mbc: B0013

composite_rules:
  - id: hex-secret-digest-gate
    desc: Hex secret validated by digest
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/decode/hex::hex-to-bytes-helper
      - id: micro-behaviors/crypto/hash/digest::source-digest-call
      - id: micro-behaviors/mem/c-runtime/functions::memcmp
