# Python payloads gated by runtime environment checks (canary files, runner sentinels)
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1497
  mbc: B0007

composite_rules:
  - id: python-canary-file-gated-dns-txt-exec
    desc: Canary file check gates DNS TXT command execution
    crit: hostile
    conf: 0.98
    attack: T1497,T1071.004,T1059.004
    scope: archive
    for: [whl, python-sdist, python]
    all:
      - id: micro-behaviors/fs/file/stat::path-exists
      - id: objectives/command-and-control/remote-command/shell::python-dns-txt-returned-fields-shell-exec
    unless:
      - id: metadata/path/directory::test-directory-component
