# PureCrypter-like environment gates in managed Windows loaders.
defaults:
  platforms: [windows]
  for: [csharp, pe, dll]
  attack: T1497.001
  mbc: B0007

traits:
  - id: dotnet-ipconfig-renew
    desc: .NET renews DHCP lease
    crit: suspicious
    conf: 0.94
    for: [csharp]
    if:
      type: text
      regex: '(?i)\bipconfig(\.exe)?\s+/renew\b'

  - id: dotnet-ipconfig-release
    desc: .NET releases DHCP lease
    crit: suspicious
    conf: 0.94
    for: [csharp]
    if:
      type: text
      regex: '(?i)\bipconfig(\.exe)?\s+/release\b'

composite_rules:
  - id: dotnet-ipconfig-lease-probe
    desc: .NET renews and releases DHCP lease
    crit: suspicious
    conf: 0.96
    for: [csharp]
    all:
      - id: dotnet-ipconfig-renew
      - id: dotnet-ipconfig-release
    near_lines: 20

  - id: dotnet-sandboxie-wmi-environment-gate
    desc: .NET Sandboxie and WMI virtualization gate
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/anti-analysis/sandbox-detect/tool-references::dotnet-sandboxie-module-name
    any:
      - id: micro-behaviors/os/wmi/query::wmi-bios-class
      - id: micro-behaviors/os/wmi/query::wmi-computer-system-class

  - id: dotnet-network-environment-gate
    desc: .NET network and virtualization environment gate
    crit: suspicious
    conf: 0.97
    all:
      - id: dotnet-ipconfig-lease-probe
    any:
      - id: dotnet-sandboxie-wmi-environment-gate
      - id: micro-behaviors/os/wmi/query::wmi-bios-class
      - id: micro-behaviors/os/wmi/query::wmi-computer-system-class
