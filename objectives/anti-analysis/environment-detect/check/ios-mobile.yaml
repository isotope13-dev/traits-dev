defaults:
  platforms: [ios]
  for: [kotlin, rust, cpp, objc]
  attack: T1497.001

traits:
  - id: ios-mobile-tool-path-check
    desc: iOS mobile analysis tool check
    crit: suspicious
    conf: 0.92
    unless:
      - id: metadata/package/files/dependency::os-image-root-file-path
      - id: well-known/app/utility/sudo::source-tree
      - id: well-known/app/network/freerdp::freerdp-source-tree
    if:
      type: text
      # `/usr/bin/lldb` was dropped: Frida and objection are mobile
      # instrumentation, and naming their path is the jailbreak-detection tell
      # this rule is about. lldb is the stock developer debugger, so the
      # alternation reached ordinary tooling that merely mentions it -- the
      # honggfuzz crate matched on a doc comment for its own `HFUZZ_DEBUGGER`
      # variable ("you can change it to `rust-gdb`, `gdb`, `/usr/bin/lldb-7`"),
      # in seven published versions. `platforms: [ios]` did not hold it back,
      # because the file is Rust source rather than an iOS binary.
      regex: '/usr/bin/frida|/usr/bin/objection'

composite_rules:
  - id: ios-jailbreak-analysis-check
    desc: iOS jailbreak analysis check
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/jailbreak
    any:
      - id: ios-mobile-tool-path-check
      - id: objectives/anti-analysis/debugger-detect/check::ios-ptrace-attachexc-source
