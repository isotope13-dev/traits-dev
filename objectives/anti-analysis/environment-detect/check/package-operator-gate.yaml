# Hidden staging with process and network behavior inside an automatic package
# entrypoint remains hostile even when the activation condition is missed.
defaults:
  platforms: [linux, macos, windows]
  attack: T1497
  mbc: B0013

composite_rules:
  - id: automatic-package-process-network-payload
    desc: Package hook creates process and network client
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/supply-chain/install-hook/runtime::package-automatic-execution-surface
      - id: objectives/supply-chain/install-hook/runtime::package-hidden-temp-stage
      - id: objectives/supply-chain/install-hook/runtime::package-child-process-creation
      - id: objectives/supply-chain/install-hook/runtime::package-network-client
