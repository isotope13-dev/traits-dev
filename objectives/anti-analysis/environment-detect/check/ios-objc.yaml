defaults:
  platforms: [ios]
  for: [cpp, objc]
  attack: T1497.001

# The Frida component-name atom this file used to declare
# (`objc-ios-frida-process-scan`) matched only `frida-server`/`frida-agent` —
# a platform-neutral instrumentation-daemon name with nothing iOS or ObjC
# about it, while `platforms: [ios]` and `for: [cpp, objc]` claimed otherwise.
# It now lives in `tool-detect/process::frida-component-process-name`, filed
# for what it matches. The iOS reading comes from the jailbreak-artifact leg
# below, which is what actually makes this an iOS composite.
composite_rules:
  - id: objc-ios-jailbreak-tool-detect
    desc: ObjC iOS jailbreak tool detect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/runtime::ios-jailbreak-artifact-path
      - id: objectives/anti-analysis/tool-detect/process::frida-component-process-name
