defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1497.001

traits:
  - id: php-analysis-hostname-marker-set
    desc: PHP groups sandbox and VM hostname markers
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)(sandbox.{0,80}(vmware|vbox)|(vmware|vbox).{0,80}sandbox)'
  - id: php-file-substring-in-condition
    desc: PHP early exit after script-path substring test
    crit: component
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: 'if\s*\([^;{}]{0,90}substr\s*\(__FILE__[^;{}]{0,90}\)\s*\{?\s*(return|die|exit)'

composite_rules:
  - id: php-analysis-hostname-gate
    desc: PHP suppresses execution on analysis hostnames
    crit: suspicious
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::php-gethostname-call
      - id: php-analysis-hostname-marker-set
      - id: micro-behaviors/data/control-flow/return::php-early-return-call-gate
  - id: php-script-path-environmental-keying
    desc: PHP conditions execution on a substring of its script path
    crit: suspicious
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/self::php-file-constant-substring
      - id: php-file-substring-in-condition
    any:
      - id: micro-behaviors/data/decode/xor/reconstruction::php-hex-xor-reconstruction
      - id: micro-behaviors/data/bitwise/xor/expression::php-caret-xor-expression
      - id: micro-behaviors/data/bitwise/xor/expression::php-compound-xor-assignment
      - id: micro-behaviors/data/encoding/xor/cyclic-key::php-repeating-key-index-xor
