defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1497.001

traits:
  - id: php-analysis-hostname-marker-set
    desc: PHP groups sandbox and VM hostname markers
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?is)(sandbox.{0,80}(vmware|vbox)|(vmware|vbox).{0,80}sandbox)'

  - id: php-helper-return-gate
    desc: PHP helper result causes an early return
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bif\s*\(\s*[_a-z][a-z0-9_]*\s*\(\s*\)\s*\)\s*(\{\s*)?return\b'

composite_rules:
  - id: php-analysis-hostname-gate
    desc: PHP suppresses execution on analysis hostnames
    crit: suspicious
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/os/sysinfo/hostname::php-gethostname-call
      - id: php-analysis-hostname-marker-set
      - id: php-helper-return-gate
