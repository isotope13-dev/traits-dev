# macOS package payloads gated by runtime environment checks (canary files, tmp markers)
defaults:
  platforms: [macos]
  for: [pkg, shell]
  attack: T1497

composite_rules:
  - id: macpkg-canary-file-gated-receipt-erasure
    desc: Canary file check gates package receipt erasure
    crit: hostile
    conf: 0.98
    attack: T1497,T1070.004
    scope: archive
    all:
      - id: micro-behaviors/fs/file/stat::shell-missing-file-exit-guard
      - id: micro-behaviors/fs/path/cache::source-hidden-user-cache-entry
      - id: micro-behaviors/os/package-manager/management::macpkg-receipt-erasure-hook
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: shell-canary-file-gated-safe-storage-exfil
    desc: Canary file check gates browser Safe Storage password exfiltration
    crit: hostile
    conf: 0.98
    attack: T1497,T1555.003,T1041
    scope: archive
    all:
      - id: micro-behaviors/fs/file/stat::shell-missing-file-exit-guard
      - id: objectives/exfiltration/stealer/credential/value/password::shell-safe-storage-http-upload
    unless:
      - id: metadata/path/directory::test-directory-component
