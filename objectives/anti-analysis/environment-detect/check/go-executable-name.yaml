defaults:
  platforms: [windows]
  for: [go]
  crit: suspicious
  conf: 0.98
traits:
  - id: go-offensivegolang-executable-name-gate
    desc: Gates execution on the executable name
    # The upstream helper exits on a basename mismatch. The required literal
    # target also requests canonical call resolution, preserving import aliases.
    if:
      type: symbol
      kind: call
      exact: github.com/MrTuxx/OffensiveGolang/pkg/evasion.CheckNameEXE
      arg:
        index: 0
        from:
          value: '.'
