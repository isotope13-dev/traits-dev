# The routine chooses a real value only with a populated process environment;
# failed image-base/heap checks select DEADBEEF instead. Emulation confirmed
# its return is used as the XOR key by the sample's cached string accessors.
# Detect the guard, not the real key, addresses, campaign strings, or filename.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  - id: peb-pointer-decoy-constant-x64
    desc: PEB pointer checks select a decoy constant
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '65 48 8B 04 25 60 00 00 00 [0-32] 48 8B 40 10 [0-80] 48 8B 40 30 [0-80] C7 44 24 ?? ?? ?? ?? ?? EB ?? C7 44 24 ?? EF BE AD DE'
