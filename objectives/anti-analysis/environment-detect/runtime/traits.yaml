# Atomic traits moved to micro-behaviors:
#   console-check-api → micro-behaviors/os/sysinfo/console::console-screen-buffer-info
#   getenv-api → micro-behaviors/os/env/block::get-environment-strings
defaults:
  mbc: B0001
composite_rules:
  - id: runtime-vm-detection-evidence
    desc: Contains virtual-machine detection evidence
    crit: notable
    conf: 0.9
    platforms: [unix, windows, macos]
    for: [binaries, scripts, go]
    # The raw JS score-accumulation/threshold legs are listed nowhere here
    # on purpose: bare `score +=` arithmetic (QR mask-penalty evaluation in
    # qr-svg.js, game scoring) carries no VM subject matter, so it must not
    # promote to notable VM evidence on its own. Scored gates still roll up
    # through js-multi-probe-vm-score-check, which requires VM probes beside
    # the scoring. New vm-detect/ leaves and score composites must be added
    # here explicitly; a bare directory reference would re-admit the raw
    # score legs. (Validator counts a directory as one `any:` entry, so a
    # directory-wide `needs: 2` is rejected as impossible.)
    any:
      - id: objectives/anti-analysis/vm-detect/artifact/
      - id: objectives/anti-analysis/vm-detect/cluster/
      - id: objectives/anti-analysis/vm-detect/device/
      - id: objectives/anti-analysis/vm-detect/dmi/
      - id: objectives/anti-analysis/vm-detect/ffi/
      - id: objectives/anti-analysis/vm-detect/instruction/
      - id: objectives/anti-analysis/vm-detect/process/
      - id: objectives/anti-analysis/vm-detect/registry/
      - id: objectives/anti-analysis/vm-detect/resource-check/
      - id: objectives/anti-analysis/vm-detect/script/
      - id: objectives/anti-analysis/vm-detect/sysctl/
      - id: objectives/anti-analysis/vm-detect/vendor/
      - id: objectives/anti-analysis/vm-detect/wmi/
      - id: objectives/anti-analysis/vm-detect/score::js-multi-probe-vm-score-check
      - id: objectives/anti-analysis/vm-detect/score::low-cpu-resource-source
      - id: objectives/anti-analysis/vm-detect/score::low-ram-resource-source
    unless:
      - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite

  - id: runtime-sandbox-detection-evidence
    desc: Contains sandbox detection evidence
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows, macos]
    for: [binaries, scripts, go]
    any:
      - id: objectives/anti-analysis/sandbox-detect/inline/
  - id: environment-adaptive-behavior
    desc: Environment API with anti-analysis indicators
    crit: suspicious
    conf: 0.85
    platforms: [unix, windows, macos]
    for: [pe]
    attack: T1497
    all:
      - id: micro-behaviors/os/env/block::get-environment-strings
    any:
      - id: runtime-vm-detection-evidence
      - id: runtime-sandbox-detection-evidence
      - id: micro-behaviors/fs/proc/container::multi-marker-runtime-detection
      # A bare IsDebuggerPresent import is common CRT noise. Require a guarded
      # debugger-check composite before treating environment queries as adaptive.
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
    needs: 2
  - id: desktop-aware-sandbox-check
    desc: Desktop and debugger APIs with configuration indicators
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    any:
      - id: metadata/build/manifest::admin-manifest
      - id: micro-behaviors/os/registry/key/lifecycle::registry-transacted-api-name-chain
      - id: metadata/binary/layout/entropy::high-entropy-data
    needs: 2
  - id: packed-loader-environment-fingerprint
    desc: Packed loader with anti-analysis environment fingerprinting
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    unless:
      - id: metadata/installer/product/
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
      - id: micro-behaviors/ui/window/station::window-station-query-chain
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
    any:
      - id: metadata/binary/layout/entropy::high-entropy-data
      - id: metadata/binary/section/entropy::writable-data-section-entropy-over-7
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/lang/compiler/native::ms-visual
        - id: metadata/binary/symbols/count::many-imports
  - id: native-environment-probe-cluster
    desc: Native loader probes locale, hardware, and desktop state
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [pe, dll]
    attack: T1497.001,T1614
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-lang-id
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-lcid
      - id: micro-behaviors/os/sysinfo/platform/locale::get-thread-locale
      - id: micro-behaviors/os/sysinfo/processor::get-process-version
      - id: micro-behaviors/os/sysinfo/processor::get-active-processor-group-count
      - id: micro-behaviors/ui/window/station/
      - id: micro-behaviors/os/clipboard/monitor::clipboard-sequence-number
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/resource/identity::pe-version-resource
      # Headless WebKit (PhantomJS) legitimately queries locale/desktop APIs.
      - id: well-known/app/browser/phantomjs::phantomjs-official-binary
      # Same reasoning for the Chromium engine itself: locale, processor group,
      # window station and key state are all routine browser-engine queries.
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
  - id: opaque-dispatch-environment-probe
    desc: Opaque native loader fingerprints host state
    crit: hostile
    conf: 0.98
    platforms: [windows]
    for: [pe, dll]
    attack: T1027,T1497.001,T1614
    all:
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::opaque-indexed-dispatch-loader
      - id: native-environment-probe-cluster
    unless:
      - id: metadata/installer/product/
  - id: msi-opaque-runtime-environment-loader
    desc: MSI stages an opaque host-fingerprinting runtime payload
    crit: hostile
    conf: 0.99
    platforms: [windows]
    # The composite correlates an MSI container with a PE/DLL payload in the
    # outer analysis scope.  `all` is not a valid file-type declaration; name
    # the container and native PE formats explicitly so the rule remains
    # eligible for both a directly analyzed MSI and an archive carrying its
    # extracted payload.
    for: [oledoc, zip, pe, dll]
    attack: T1027,T1497.001,T1614,T1036.005
    scope: outer
    all:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
      - id: metadata/package/files/msi/identity::msi-wix-toolset-branding
      - id: opaque-dispatch-environment-probe
    unless:
      - id: metadata/installer/product::known-installer-context
  - id: sparse-import-device-window-probing
    desc: Sparse-import loader probes devices and windows
    crit: suspicious
    conf: 0.94
    # Keep the sparse-import metric and the probe APIs on the same image. A
    # packed outer PE can otherwise borrow APIs from its unpacked child.
    scope: leaf
    platforms: [windows]
    for: [pe, dll]
    attack: T1497.001
    all:
      - id: micro-behaviors/fs/device::query-dos-device-w
      - id: micro-behaviors/ui/window/enumerate::is-window-visible
    any:
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: metadata/binary/section/header::pe-nonstandard-entry
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
    needs: 2
    unless:
      - id: metadata/signature/verified/developer/
