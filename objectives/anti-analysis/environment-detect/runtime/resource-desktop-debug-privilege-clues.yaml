defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: resource-desktop-debug-privilege-clues
    desc: Resource, desktop, debugger and privilege clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::resource-extraction-library-api-set
      - id: objectives/anti-analysis/environment-detect/runtime::desktop-aware-sandbox-check
    any:
      - id: micro-behaviors/os/privilege/reference::shutdown-privilege-name
      - id: metadata/binary/section/permission::executable-rsrc-section
    needs: 2
    downgrade:
      any:
        - id: metadata/installer/product/
