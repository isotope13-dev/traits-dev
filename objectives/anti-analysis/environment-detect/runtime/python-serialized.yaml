defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: analysis-detected-legit-work-only
    desc: Analysis detection selects purported legit work
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(VM|Debugger|Sandbox) detected - legit only'

composite_rules:
  - id: analysis-aware-encrypted-hidden-launch-loader
    desc: Encrypted hidden launcher masks its work when analyzed
    crit: hostile
    conf: 0.98
    attack: T1497.001,T1622,T1027.013
    all:
      - id: analysis-detected-legit-work-only
      - id: objectives/anti-static/obfuscation/payload/encrypted::serialized-encrypted-hidden-launch-loader
