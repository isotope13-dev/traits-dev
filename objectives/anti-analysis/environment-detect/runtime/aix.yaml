defaults:
  platforms: [aix, unix]
  for: [c, cpp, elf]
composite_rules:
- id: aix-anti-analysis
  desc: AIX anti-analysis techniques (timing, monitoring, hook detection)
  crit: hostile
  conf: 0.95
    # uname/waitpid/dlsym are universal libc primitives present in nearly every
    # dynamically-linked ELF, so this fired on generic Linux/Android binaries.
    # Anchor on the AIX-specific LIBPATH loader variable so the combination only
    # counts on actual AIX targets. A bare substr on LIBPATH also matched the
    # benign gawk env var AWKLIBPATH and the LIBPATH literal embedded in Node's
    # internal child_process.js (z/OS env propagation), so require a whole-word
    # LIBPATH token and exclude that Node helper.
  all:
  # AIX executables use XCOFF.  Linux ELF bundles can contain AIX
  # compatibility strings and libc symbols without implementing AIX runtime
  # anti-analysis; require the native file-format marker before combining the
  # loader variable with generic libc capabilities.
  - id: metadata/file/magic/identity::xcoff-64-header
  # Use the canonical AIX loader-variable capability.  The generic libc
  # primitives below are only meaningful as an anti-analysis combination when
  # paired with this target-specific evidence.
  - id: micro-behaviors/os/linker/env::libpath
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/platform/kernel::uname
  - id: micro-behaviors/process/control/wait::waitpid
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
    # LIBPATH is also the z/OS loader var; Node/libuv embed it for os390 support.
    # Real AIX targets do not carry z/OS markers, so suppress when those appear.
  unless:
  - id: metadata/vendor/os::bpxk-autocvt-marker
  - id: metadata/vendor/os::cee-runopts-marker
  - id: metadata/vendor/os::os390-output-format-token
  - id: metadata/vendor/os::mvs-marker
  - id: well-known/lib/runtime/jvm::runtime-library-basename
  - id: metadata/lang/compiler/native::edg-modules-path-env
