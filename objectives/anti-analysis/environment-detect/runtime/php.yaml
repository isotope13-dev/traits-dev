defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: php-safety-gate
    desc: PHP safety gate checking for a hidden file in HOME
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/read::getenv-home
      - id: micro-behaviors/os/stdio::error-reporting-off
      - id: micro-behaviors/os/stdio::error-suppress-prefix
      - id: micro-behaviors/fs/path/location::tilde-hidden-home-path-php-string
    unless:
      - id: well-known/tool/
      - id: well-known/lib/
      - id: well-known/app/
