defaults:
  platforms:
  - unix
  - windows
  for:
  - php
composite_rules:
- id: php-safety-gate
  desc: PHP safety gate checking for a hidden file in HOME
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/read/named::getenv-home
  - id: micro-behaviors/data/control-flow/error-handling/suppress::error-reporting-off
  - id: micro-behaviors/data/control-flow/error-handling/suppress::error-suppress-prefix
  - id: micro-behaviors/fs/path/hidden::tilde-hidden-home-path-php-string
