defaults:
  platforms: [unix, windows]
  for: [java, class, java_class]
  attack: T1027.005

traits:
  # The bare "selfModify" token is a fragment, not an observation: it is the
  # name of a routine in self-modifying Java malware, but it is also the name
  # of a legitimate simulator *setting* -- MARS (the Exercism MIPS simulator)
  # exposes a `selfModifyingCode` option that lets the simulated guest program
  # write to the emulated text segment. The token alone cannot tell a routine
  # that rewrites the JAR from a boolean field about guest code, so these atoms
  # only carry signal inside the read+write corroboration below.
  - id: java-selfmodify-method
    desc: selfModify routine-name token in source
    crit: component
    conf: 0.94
    if:
      type: text
      substr: selfModify

  - id: java-bytecode-selfmodify
    desc: selfModify routine-name token in bytecode
    crit: component
    conf: 0.94
    for: [class, java_class, jar]
    if:
      type: hex
      pattern: 73 65 6c 66 4d 6f 64 69 66 79

composite_rules:
  - id: java-class-self-modify
    desc: Java class reads and rewrites own bytecode
    crit: hostile
    conf: 0.98
    all:
      - id: java-selfmodify-method
      - id: micro-behaviors/fs/file/read::java-readallbytes
    any:
      - id: micro-behaviors/fs/write/file/direct::java-fileoutputstream-file-handle
      - id: micro-behaviors/fs/write/file/direct::java-fos-simple

  - id: java-bytecode-self-modify
    desc: Compiled class rewrites own bytecode
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: java-bytecode-selfmodify
      - id: micro-behaviors/fs/file/read::java-readallbytes
      - id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
