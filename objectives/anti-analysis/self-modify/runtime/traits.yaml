defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - elf
    - pe
    - shell
    - python
    - javascript
traits:
  - id: codecave-ref
    desc: Code cave terminology
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \bcodecave\b|\bcode cave\b
      case_insensitive: true
  - id: got-ref
    desc: GOT table or hook reference
    crit: component
    conf: 0.4
    for:
      - elf
      - macho
    if:
      type: text
      regex: \bGOT\s+(table|entry|hook)\b
      case_insensitive: true
  - id: polymorphic-code-engine
    desc: Polymorphic code/engine terminology
    crit: notable
    conf: 0.5
    if:
      type: text
      case_insensitive: true
      regex: polymorphic[\s_-]*(code|engine|generator)
  - id: polymorphic-payload-stage
    desc: Polymorphic decryptor/stub/loader terminology
    crit: notable
    conf: 0.5
    if:
      type: text
      case_insensitive: true
      regex: polymorphic[\s_-]*(decrypt|stub|loader)
  - id: polymorphic-malware-class
    desc: Polymorphic virus/malware/shellcode terms
    crit: notable
    conf: 0.5
    if:
      type: text
      case_insensitive: true
      regex: polymorphic[\s_-]*(virus|malware|shellcode)
  - id: polymorphic-payload-mutate
    desc: polymorphic payload mutate
    crit: notable
    conf: 0.5
    if:
      type: text
      case_insensitive: true
      regex: polymorphic[\s_-]*(payload|mutat|obfuscat)
  - id: metamorphic-ref
    desc: Metamorphic code terminology
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)\bmetamorphic[\s_-]+(code|engine|generator|loader|payload|malware|virus|shellcode)\b
    unless:
      - id: metadata/build/bundler/vscode::vscode-js-distribution-bundle
      - id: well-known/tool/development/ordeal::ordeal-package
      - id: metadata/package/testing/terminology::metamorphic-testing-context
  - id: self-modifying-ref
    desc: Self-modifying code terms
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)\bself-modifying\s+(payload|routine|buffer)\b
    downgrade:
      any:
        - id: metadata/signed/unknown::vector-35-inc
  - id: xor-modulo-key-loop-x64
    desc: XOR loop with modulo key index
    crit: suspicious
    conf: 0.75
    for:
      - pe
      - elf
    if:
      type: hex
      section: .text
      pattern: 31 C9 89 CA 48 F7 74 24 ?? 48 8B 04 24 44 0F B6 04 10 48 8B 44 24 ?? 48 8B 4C 24 ?? 0F B6 14 08
        44 31 C2 88 14 08
composite_rules:
  - id: polymorphic-ref
    desc: Polymorphic code terminology
    crit: notable
    conf: 0.5
    any:
      - id: polymorphic-code-engine
      - id: polymorphic-payload-stage
      - id: polymorphic-malware-class
      - id: polymorphic-payload-mutate
  - id: hook-install
    desc: Windows in-process function-hook mechanics
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/process/hook/interception::windows-inline-hook-mechanic
    downgrade:
      any:
        - id: well-known/game/steam/
  - id: got-hook
    desc: Global Offset Table hooking
    crit: suspicious
    conf: 0.72
    platforms:
      - linux
      - macos
    for:
      - elf
      - macho
    all:
      - id: got-ref
    any:
      - id: micro-behaviors/process/hook/keywords::inline-hook-term
      - id: micro-behaviors/process/hook/keywords::detour
    near_bytes: 2048
  - id: polymorphic
    desc: Polymorphic or metamorphic code indicators
    crit: suspicious
    conf: 0.75
    needs: 2
    any:
      - id: polymorphic-ref
      - id: metamorphic-ref
      - id: self-modifying-ref
      - id: micro-behaviors/crypto/symmetric/xor/loop::native-byte-xor-loop
      - id: xor-modulo-key-loop-x64
    downgrade:
      any:
        - id: micro-behaviors/data/codec::json-polymorphic-attribute
        - id: micro-behaviors/data/codec::json-polymorphic-resolver
        - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
        - id: metadata/build/bundler/runtime::js-webpack-bundle
        - id: metadata/signed/unknown::vector-35-inc
        - id: metadata/binary/layout/size::massive-executable
        - id: micro-behaviors/ui/help/
