defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, shell, python, javascript]
composite_rules:
  - id: memory-protection-with-modification-clues
    desc: Memory protection with modification-related clues
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/mem/combined::virtual-allocation-or-page-protection
    any:
      - id: micro-behaviors/mem/write/arbitrary::self-memory-write-references
      - id: objectives/anti-analysis/self-modify/runtime::self-modifying-ref
      - id: objectives/anti-analysis/self-modify/runtime::code-cave-padding-clues
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::native-byte-xor-loop
