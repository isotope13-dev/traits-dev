defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: executable-hash-padding-diagnostic
    desc: Executable hash-padding diagnostic
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'mutate: hash changed (+%d bytes)'
      section: .rdata
  - id: hash-rotation-handoff-diagnostic
    desc: Exits for relaunch to change file hash
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\b(exit(s|ing)?|relaunch(ing|ed)?)\s+to\s+change\s+(its\s+|the\s+)?hash\b'
      case_insensitive: true
composite_rules:
  # Rewriting its own image to change the file hash, then handing off to a
  # rotated copy that is re-registered for autostart, defeats hash-based
  # blocklists across reboots; installers and updaters do not mutate their hash.
  - id: hash-rotating-persistent-self-relaunch
    desc: Mutates its own file hash and relaunches a persistent self-copy
    crit: hostile
    conf: 0.92
    attack: T1027.005
    all:
      - id: executable-hash-padding-diagnostic
      - id: hash-rotation-handoff-diagnostic
      - id: micro-behaviors/fs/file/copy::self-copy-relaunch-api-set
      - id: micro-behaviors/os/registry/keys::software-run-key-reference
