# Hash-rotation loop: the binary pads a copy of its own image until the file
# hash differs, relaunches the padded copy, and exits the original instance
# solely so the on-disk hash changes. That defeats hash-based identification.
# Eupdate Helper emits the same diagnostics for its ESET mirror client. The
# recognized image with a trailer of at least 64 bytes is that mirror build;
# a same-body copy with a shorter trailer is still this claim.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: executable-hash-padding-diagnostic
    desc: Executable hash-padding diagnostic
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'mutate: hash changed (+%d bytes)'
      section: .rdata

  - id: exit-to-change-hash-diagnostic
    desc: Exits to change own file hash
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'exiting to chang\w* (the |its )?hash'
      section: .rdata
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-long-trailer

composite_rules:
  - id: self-hash-rotation-relaunch
    desc: Pads own image and relaunches copy to change hash
    crit: hostile
    conf: 0.97
    attack: T1027.001
    all:
      - id: executable-hash-padding-diagnostic
      - id: exit-to-change-hash-diagnostic
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-long-trailer
