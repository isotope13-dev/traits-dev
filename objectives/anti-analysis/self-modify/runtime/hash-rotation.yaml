# Hash-changing diagnostics do not alone prove malicious intent.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: executable-hash-padding-diagnostic
    desc: Executable hash-padding diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'mutate: hash changed (+%d bytes)'
      section: .rdata

  - id: exit-to-change-hash-diagnostic
    desc: Exits to change own file hash
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'exiting to chang\w* (the |its )?hash'
      section: .rdata

composite_rules:
  - id: self-hash-rotation-relaunch
    desc: Pads own image and relaunches copy to change hash
    crit: suspicious
    conf: 0.97
    attack: T1027.001
    all:
      - id: executable-hash-padding-diagnostic
      - id: exit-to-change-hash-diagnostic
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary

  # Rotating the on-disk hash only defeats hash blocklists; doing it to an
  # image that also installs itself under a Run key keeps a persistent
  # implant ahead of hash-based remediation.
  - id: persistent-self-hash-rotation
    desc: Autostart image pads and relaunches itself to change hash
    crit: hostile
    conf: 0.95
    attack: T1027.001
    all:
      - id: executable-hash-padding-diagnostic
      - id: exit-to-change-hash-diagnostic
      - id: micro-behaviors/os/registry/keys::currentversion-run-key-path
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary
      - id: objectives/command-and-control/dropper/delivery/winhttp::trojanized-eupdate-winhttp-shell-dropper
      - id: objectives/command-and-control/dropper/delivery/winhttp::trojanized-eupdate-upx-winhttp-dropper
