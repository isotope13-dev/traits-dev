defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: reloc-writes-indirect-call-opcode-x86
    desc: Reloc code writes indirect-call opcode
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      section: .reloc
      # Store the FF 15 indirect-call opcode and address prefix, then
      # another address byte. Host addresses and IAT slot vary per image.
      pattern: 'C7 05 ?? ?? ?? ?? FF 15 ?? ?? C6 05 ?? ?? ?? ?? ??'
composite_rules:
  - id: reloc-loader-restores-host-call
    desc: Reloc loader reconstructs hijacked host call
    crit: hostile
    conf: 0.97
    attack: T1027
    all:
      - id: reloc-writes-indirect-call-opcode-x86
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::reloc-payload-return-address-redirection
