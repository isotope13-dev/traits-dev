# A module that reads its own source, edits it, and writes it back. The
# purescript installer sabotage (rate-map 1.0.3) stripped its own payload
# block after the first run so the shipped file and the installed file no
# longer matched. Build tools rewrite OTHER files; nothing legitimate rewrites
# the file it is currently executing from.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0008

traits:
  - id: node-rewrites-own-source-file
    desc: Rewrites its own source file in place
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'writeFileSync\s*\(\s*__filename\s*,\s*readFileSync\s*\(\s*__filename'
