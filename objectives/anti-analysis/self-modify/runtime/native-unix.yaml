defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1027.007

composite_rules:
  - id: native-source-self-exe-rwx-write
    desc: Native source self exe RWX write
    for: [objectivec]
    all:
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/fs/link::readlink
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: objectives/evasion/process/hook/inline::native-mprotect-code-page-rwx
