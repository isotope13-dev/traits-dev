# Polymorphic macro viruses rewrite their own module on each run: random
# remark lines are generated from Rnd and inserted at random positions into
# the component's CodeModule, so no two copies hash alike.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1027

composite_rules:
  - id: vba-random-lines-inserted-into-own-module
    desc: Inserts random lines into its macro
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/metaprogramming/generation/transform::vba-codemodule-insert-lines
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vba-component-codemodule-reference
      - id: micro-behaviors/os/random/prng/stdlib::vba-rnd-character-generation
