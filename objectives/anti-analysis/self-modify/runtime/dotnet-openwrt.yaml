defaults:
  platforms: [ios, openwrt, windows]
  for: [csharp, pe, dll]
  attack: T1027.005
composite_rules:
  - id: dotnet-self-modifying-stager
    desc: .NET self-modifying stager
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/info/current::dotnet-getexecutingassembly-token
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
    needs: 2
    any:
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/os/random/prng/stdlib::random-nextbytes
      - id: micro-behaviors/fs/write/file/append::dotnet-filemode-append-token
      - id: micro-behaviors/fs/write/file/full::writeallbytes-any
    unless:
      - id: well-known/lib/vendor-sdk/htmlforgex/
      - id: well-known/lib/format/deb-package/
      - id: well-known/lib/vendor-sdk/powerforge/
      - id: metadata/lang/compiler/aot/
      - id: well-known/dual-use/tunnel/netch::netch-executable
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-component-detected
      - id: metadata/binary/framework::dotnet-base-class-library
