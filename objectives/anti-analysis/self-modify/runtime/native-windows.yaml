defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001

composite_rules:
  - id: self-mutating-executable-uploader
    desc: Self-reading executable mutates and uploads clone
    crit: hostile
    conf: 0.995
    attack: T1027.001,T1105
    all:
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-crt-chain
      - id: micro-behaviors/data/buffer::x86-call-result-fill-sixteen-byte-loop
      - id: micro-behaviors/os/random/crypto::rand-symbol
      - id: micro-behaviors/fs/file/write/direct::write--fwrite
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: objectives/command-and-control/infrastructure/domain/malicious::wecan-hasthe-upload-endpoint
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
