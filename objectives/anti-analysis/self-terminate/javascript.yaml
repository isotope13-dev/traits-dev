# Anti-Analysis & Evasion - JavaScript
# Composed objectives for JS anti-analysis
defaults:
  attack: T1497
  mbc: B0006
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: js-self-sigsegv-termination
    desc: Self-termination via SIGSEGV for evasion
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/terminate/kill::js-sigsegv-kill
      - id: micro-behaviors/process/exit/terminate::process-exit
  - id: js-anti-forensics-stdout-clear
    desc: Clears stdout buffer before self-terminating
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/fd/stdio::js-stdout-write-empty
      - id: micro-behaviors/process/terminate/kill::js-sigsegv-kill
  # "Looks broken" is the disguise. When the CI/test gate says the process is
  # being built or scanned rather than used, the package prints a red banner
  # blaming the victim's device and exits 0 — so a maintainer, a build log, and
  # an automated sandbox all record a harmless dud, while a real install takes
  # the other branch. A clean exit, a coloured message and an environment gate
  # are each unremarkable; arranging all three so the payload runs only when
  # nobody is watching is not.
  - id: js-gated-fake-failure-exit
    desc: Environment gate prints a fake failure and exits
    crit: hostile
    conf: 0.95
    attack: "T1497,T1036"
    all:
      - id: objectives/anti-analysis/environment-detect/check::node-ci-test-runtime-gate
      - id: micro-behaviors/ui/terminal::ansi-color-formatted-console-message
      - id: micro-behaviors/process/exit/terminate::js-process-exit-zero
    unless:
      - id: metadata/package/testing/presence/harness/
