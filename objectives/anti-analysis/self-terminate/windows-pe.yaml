defaults:
  crit: suspicious
  platforms: [windows]
  for: [pe]
  attack: T1497
  mbc: F0001
composite_rules:
- id: debugger-check-terminate-process
  desc: Debugger check with forced terminate
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/anti-analysis/debugger-detect/check::win-debugger-detect
  - id: micro-behaviors/process/terminate/kill::terminate-process
  any:
  - id: micro-behaviors/os/exception/error-handling::exception-filter-pair-imports
  - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
  - id: micro-behaviors/os/exception/error-handling::unhandled-exception-filter-import
  - id: micro-behaviors/time/timing/delay::query-performance-counter
  - id: micro-behaviors/os/sysinfo/hardware::is-processor-feature-present
  # `objectives/anti-analysis/debugger-detect/check/` stood first in both
  # unless: lists for the since-deleted `win-debugger-benign-context`; the
  # directory also holds each rule's debugger leg, so neither could fire.
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/browser-automation/
  - id: metadata/build/pip::python-console-launcher-stub
  downgrade:
    any:
    - id: metadata/binary/layout/embedded::pe-embedded
- id: timing-vm-check-self-terminate
  desc: Debugger-gated timing and VM self-terminate
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/process/terminate/kill::terminate-process
  - id: micro-behaviors/os/sysinfo/hardware::is-processor-feature-present
  - id: micro-behaviors/time/timing/delay::query-performance-counter
  - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  unless:
  - id: well-known/lib/data/ssh2::ssh2-pageant-helper-context
  - id: metadata/signed/platform/
  - id: metadata/build/pip::python-console-launcher-stub
  downgrade:
    any:
    - id: well-known/lib/platform/browser-automation/
    - id: metadata/binary/layout/embedded::pe-embedded
