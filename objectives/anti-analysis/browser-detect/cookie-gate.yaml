defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: suspicious
  conf: 0.95

composite_rules:
  # Client-only challenge completion writes a short-lived flag and reloads.
  # Cookies plus reload are routine; require the separately supported suite
  # of browser inspection countermeasures before inferring an analysis gate.
  - id: inspection-blocking-cookie-reload-gate
    desc: Inspection blockers accompany short-lived cookie and page reload
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/cookie-store::browser-short-lived-flag-cookie
      - id: js-anti-inspection-suite
    any:
      - id: micro-behaviors/ui/window/navigation::browser-location-reload
      - id: micro-behaviors/ui/window/navigation::inline-browser-location-reload
