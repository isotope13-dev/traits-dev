defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: suspicious
  conf: 0.95

composite_rules:
  # Client-only challenge completion writes a short-lived flag and reloads.
  # Cookies plus reload are routine; require the separately supported suite
  # of browser inspection countermeasures before inferring an analysis gate.
  - id: inspection-blocking-cookie-reload-gate
    desc: Inspection blockers accompany short-lived cookie and page reload
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/cookie-store::browser-short-lived-verification-cookie
      - id: js-anti-inspection-suite
    any:
      - id: micro-behaviors/ui/window/navigation/refresh::browser-location-reload
      - id: micro-behaviors/ui/window/navigation/refresh::inline-browser-location-reload

  # Exploit-delivery and cloaked-gate pages synchronize lock state across both
  # localStorage and document.cookie with an expiration TTL, strip operator
  # reset parameters via history.replaceState, and inject a cache-busted script.
  - id: storage-cookie-ttl-gated-script-loader
    desc: Storage, cookie-expiry, and URL-strip gate controls cache-busted script load
    crit: suspicious
    conf: 0.94
    attack: T1189,T1497
    for: [html, javascript]
    all:
      - id: micro-behaviors/data/db/read/key-value::dom-storage-getitem
      - id: micro-behaviors/data/db/write::dom-storage-setitem
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-expire-directive
      - id: micro-behaviors/ui/window/dom/create::cache-busted-dynamic-script-load
      - id: micro-behaviors/ui/window/history::history-strip-query-parameter
