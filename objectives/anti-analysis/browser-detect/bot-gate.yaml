# Interstitial "verifying your request" pages run a handful of automation
# checks (headless user agent, forged plugin and MIME arrays) and then either
# report the failures to the operator or forward the visitor with a
# generated form. Scanners and sandboxes are what the checks are aimed at;
# the decision lets the operator show them something harmless.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1497.003

traits:
  - id: headless-user-agent-regex-test
    desc: Tests user agent for headless tokens
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'headless|bytespider'
  - id: plugin-array-prototype-reference
    desc: References PluginArray for spoof detection
    crit: notable
    conf: 0.85
    if:
      type: text
      word: PluginArray
  - id: mime-type-array-prototype-reference
    desc: References MimeTypeArray for spoof detection
    crit: notable
    conf: 0.85
    if:
      type: text
      word: MimeTypeArray
  - id: xmlhttprequest-construction
    desc: Constructs an XMLHttpRequest
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: new XMLHttpRequest
  - id: split-create-element-name
    desc: Splits the createElement name in a concatenation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'createElem[''"]\s*\+\s*[''"]ent'

composite_rules:
  - id: browser-automation-fingerprint-gate
    desc: Headless and forged plugin-array checks
    crit: suspicious
    conf: 0.9
    all:
      - id: headless-user-agent-regex-test
      - id: plugin-array-prototype-reference
      - id: mime-type-array-prototype-reference
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component

  - id: bot-gate-forwards-visitor-with-built-form
    desc: Bot checks gate a script-built form forwarding
    crit: suspicious
    conf: 0.9
    all:
      - id: browser-automation-fingerprint-gate
      - id: micro-behaviors/communications/http/form::form-submit-method-call
      - id: split-create-element-name
      - id: xmlhttprequest-construction
