defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  attack: T1497.003
  conf: 0.9
traits:
- id: headless-user-agent-regex-test
  desc: Tests user agent for headless tokens
  crit: notable
  if:
    type: text
    substr: headless|bytespider
- id: split-create-element-name
  desc: Splits the createElement name in a concatenation
  crit: notable
  if:
    type: text
    regex: createElem['"]\s*\+\s*['"]ent
composite_rules:
- id: browser-automation-fingerprint-gate
  desc: Headless and forged plugin-array checks
  crit: suspicious
  all:
  - id: headless-user-agent-regex-test
  - id: micro-behaviors/os/sysinfo/platform/browser::pluginarray-type-reference
  - id: micro-behaviors/os/sysinfo/platform/browser::mimetypearray-type-reference
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: bot-gate-forwards-visitor-with-built-form
  desc: Bot checks gate a script-built form forwarding
  crit: suspicious
  all:
  - id: browser-automation-fingerprint-gate
  - id: micro-behaviors/communications/http/form::form-submit-method-call
  - id: split-create-element-name
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
