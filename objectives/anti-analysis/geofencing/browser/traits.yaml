# Browser delivery gated by mobile user-agent and target branch.
# This is the web half of a smishing chain: non-mobile clients are denied,
# Android receives an APK, and Apple clients receive a credential page.
defaults:
  platforms: [android, unix, windows]
  for: [javascript, typescript, python, php, html]
  attack: T1614,T1566.002,T1204.001
  mbc: B0007.003

traits:
  - id: user-agent-header-read
    desc: Reads an HTTP or browser user-agent
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?s)(navigator\.userAgent|HTTP_USER_AGENT).{0,120}(Android|iPhone|iPad)'

  - id: user-agent-header-map-read
    desc: Reads a mobile User-Agent HTTP header
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?s)headers\[[^]]{0,80}[Uu]ser-[Aa]gent'

  - id: apple-credential-form
    desc: Response contains an Apple credential form
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)(Apple\s*ID|appleId).{0,180}(password|type\s*=\s*["'']password)'

  - id: http-404-status-call
    desc: Server response status method receives 404
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(res|response)\.status\s*\(\s*404'

  - id: http-404-statuscode-assignment
    desc: Server response statusCode is set to 404
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(res|response)\.statusCode\s*=\s*404'

composite_rules:
  - id: android-response-routing
    desc: Android User-Agent branch sends a response
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/user-agent::android-user-agent-branch
      - id: micro-behaviors/communications/http/response::server-response-method
    near_lines: 20

  - id: apple-response-routing
    desc: Apple User-Agent branch sends a response
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/user-agent::apple-user-agent-branch
      - id: micro-behaviors/communications/http/response::server-response-method
    near_lines: 20

  - id: ipad-response-routing
    desc: iPad User-Agent branch sends a response
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/user-agent::ipad-user-agent-branch
      - id: micro-behaviors/communications/http/response::server-response-method
    near_lines: 20

  - id: http-404-response
    desc: Server response explicitly returns HTTP 404
    crit: component
    conf: 0.92
    any:
      - id: http-404-status-call
      - id: http-404-statuscode-assignment

  - id: mobile-user-agent-routing
    desc: Branches on Android and Apple user-agents
    # Browser compatibility and OAuth webview handling use this pattern too;
    # delivery of an APK or credential page is required for hostile scoring.
    crit: notable
    conf: 0.94
    all:
      - id: user-agent-header-read-any
      - id: android-user-agent-branch-any
      - id: micro-behaviors/communications/http/user-agent::apple-user-agent-branch
      - id: mobile-response-routing
    unless:
      - id: well-known/lib/browser-automation::browser-device-emulation-context
      - id: well-known/lib/browser-automation::chrome-devtools-ad-catalog-context

  - id: mobile-response-routing
    desc: Mobile user-agent selects a response
    crit: suspicious
    conf: 0.94
    any:
      - id: android-response-routing
      - id: apple-response-routing
      - id: ipad-response-routing

  - id: user-agent-header-read-any
    desc: Reads a mobile user-agent
    crit: notable
    conf: 0.94
    any:
      - id: user-agent-header-read
      - id: user-agent-header-map-read

  - id: mobile-user-agent-branch
    desc: Branches on an Android or Apple user-agent
    crit: notable
    conf: 0.92
    any:
      - id: android-user-agent-branch-any
      - id: micro-behaviors/communications/http/user-agent::apple-user-agent-branch
      - id: micro-behaviors/communications/http/user-agent::ipad-user-agent-branch

  - id: android-user-agent-branch-any
    desc: Branches on an Android user-agent
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/user-agent::android-user-agent-branch
      - id: micro-behaviors/communications/http/user-agent::android-user-agent-membership

  - id: android-apk-redirect
    desc: Android user-agent receives APK navigation
    crit: suspicious
    conf: 0.96
    all:
      - id: android-user-agent-branch-any
    any:
      - id: micro-behaviors/communications/http/response::android-apk-response-content-type
      - id: micro-behaviors/communications/http/response::apk-response-navigation
      - id: micro-behaviors/communications/http/response::apk-response-navigation-reverse
    near_lines: 20

  - id: apple-credential-page-branch
    desc: Apple user-agent receives credential form
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/user-agent::apple-user-agent-branch
      - id: apple-credential-form
    near_lines: 20

  - id: mobile-user-agent-404-response
    desc: Mobile user-agent branch includes an HTTP 404 response
    crit: suspicious
    conf: 0.92
    all:
      - id: mobile-user-agent-branch
      - id: http-404-response
    near_bytes: 512

  - id: mobile-target-routing
    desc: Mobile user-agent split delivers APK or credential page
    crit: hostile
    conf: 0.98
    all:
      - id: mobile-user-agent-routing
      - id: android-apk-redirect
      - id: apple-credential-page-branch

  - id: mobile-geofenced-smishing-delivery
    desc: Geofenced mobile delivery with mobile-route HTTP 404 handling
    crit: hostile
    conf: 0.995
    mbc: B0007.003,B0030
    all:
      - id: mobile-target-routing
      - id: mobile-user-agent-404-response
