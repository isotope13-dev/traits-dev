defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1480
  mbc: B0003

composite_rules:
  - id: dynamic-windows-username-substring-gate
    desc: Windows username target gate using dynamic API resolution
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/module/load::get-proc-address-source-call
      - id: micro-behaviors/os/user/lookup::dynamic-get-user-name-reference
    any:
      - id: micro-behaviors/data/string/library::strstr
      - id: micro-behaviors/data/string/library::strstr-source-call
    near_bytes: 512
