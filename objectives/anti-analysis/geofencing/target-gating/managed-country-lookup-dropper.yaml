# The scanner sees the loader's own literals, not what the dropped payload does
# with the code. A country-code request beside a concealed resource drop is the
# region-gated delivery shape; the check's effect on the launch is not proven.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1480

composite_rules:
  - id: managed-country-lookup-resource-dropper
    desc: Country-code lookup in a XOR resource dropper that hides its launch
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ipinfo-country-endpoint
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: objectives/anti-static/obfuscation/encoding/buffer::zero-width-managed-resource-xor-writer
      - id: micro-behaviors/data/embedded/payload/resource::managed-resource-write-hidden-launch-api-profile
