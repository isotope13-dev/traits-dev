# Python script-side target/locale activation gating. Malware that only
# fires when running on the intended victim or in the intended locale.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1480
  mbc: B0003
  crit: suspicious

traits:
- id: hostname-local-target-conditional
  desc: Conditional hostname local-target gate
  crit: notable
  conf: 0.93
  if:
    # "local" in a log message (for example, distributed-training local
    # rank) is not a target gate.  Restrict this marker to conditional nodes.
    type: tree-sitter
    kind: conditional
    regex: '(?is)(gethostname\s*\(|platform\.node\s*\(|["'']HOSTNAME["'']).{0,80}\blocal\b'
  unless:
  - id: micro-behaviors/os/sysinfo/hostname::python-mdns-local-hostname-resolution
- id: domain-join-check
  desc: Workgroup/domain checked for corp join
  conf: 0.88
  for: [python, powershell]
  if:
    type: text
    regex: 'win32com\.client\.GetObject\s*\(\s*["'']winmgmts[^"'']{0,160}Domain'

composite_rules:
- id: python-username-substring-gate
  desc: Python execution gate based on the current username
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/user/query::python-getpass-user
  - id: micro-behaviors/process/user/query::python-normalized-user
  - id: micro-behaviors/process/user/query::python-user-substring-condition
  near_bytes: 256
- id: target-activation-gate
  desc: Execution gated on target identity (hostname/locale/domain)
  crit: notable
  conf: 0.94
  any:
  - id: hostname-termination-gate
  - id: fqdn-substring-gate
  - id: domain-join-check
  - id: objectives/anti-analysis/geofencing/locale
  # One umbrella — avoids 4+ same-directory any: refs while keeping
  # IANA-string components out of this activation composite.
  - id: objectives/anti-analysis/geofencing/timezone::host-timezone-gates
  - id: objectives/anti-analysis/geofencing/region
  - id: objectives/anti-analysis/geofencing/input
  - id: objectives/anti-analysis/geofencing/ip-range
- id: fqdn-substring-gate
  desc: Execution gated on FQDN substring
  crit: notable
  conf: 0.93
  unless:
  - id: well-known/app/ai/browser-agent/open-webui-computer/
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  near_bytes: 256
  any:
  - id: metadata/file/string/identity::corporate-hostname-word-computer
  - id: metadata/file/string/identity::corporate-hostname-word-internal
  - id: metadata/lang/source/syntax/operator::python-hostname-domain-literal-compare
  - id: micro-behaviors/os/sysinfo/hostname::python-domain-literal-hostname-compare
  - id: hostname-local-target-conditional
  - id: metadata/file/string/identity::hostname-marker-word-corp
  - id: metadata/file/string/identity::hostname-marker-word-fqdn
- id: hostname-termination-gate
  desc: Hostname or host-environment check terminates execution
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-hostname-lookup-in-conditional
  - id: micro-behaviors/process/exit/terminate::python-sys-exit-symbol
  - id: micro-behaviors/data/control-flow/analysis::string-literal-equality-check
  near_bytes: 400
