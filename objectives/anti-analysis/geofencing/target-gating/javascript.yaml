defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1480
  mbc: B0003

traits:
  - id: windows-10-release-gate
    desc: Windows 10 release prefix gate
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(release\(\)|os\.release\(\))\.startsWith\(["'']10\.'

composite_rules:
  # Protestware has combined the browser UI language, the site's ccTLD, and a
  # persistent first-visit timestamp to delay activation for a chosen audience.
  # The gate is evasive and target-selective, but it is not hostile without the
  # gated payload; impact rules compose this observation with actual sabotage.
  - id: russian-locale-cctld-delayed-activation
    desc: Russian locale and ccTLD delay activation
    crit: suspicious
    conf: 0.95
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language
      - id: micro-behaviors/communications/http/url/path::browser-location-host-russian-tld-match
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
      - id: micro-behaviors/time/timing/check::js-elapsed-days-threshold

  - id: windows-target-gated-activation
    desc: Execution gated on Windows target version
    crit: suspicious
    conf: 0.95
    all:
      - id: windows-10-release-gate
      - id: micro-behaviors/os/sysinfo/platform/runtime::js-platform-win32-check

  - id: windows-gated-vscode-task-stager
    desc: Windows-gated VS Code task stager
    crit: hostile
    conf: 0.98
    attack: T1480,T1195.002
    all:
      - id: windows-target-gated-activation
      - id: objectives/supply-chain/trojanized/app/config-injection::vscode-global-task-write
      - id: micro-behaviors/communications/http/request/client::https-get
