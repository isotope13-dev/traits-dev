# Ruby agent keeps country allow/deny lists and a sandbox hostname deny
# list, and exits unless the host is a wanted, non-analysis target.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1480,T1497.001

composite_rules:
  - id: ruby-country-and-sandbox-host-exit-gate
    desc: Exits on sandbox hosts or untargeted countries
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/anti-analysis/geofencing/target-gating::ruby-country-allow-block-lists
      - id: objectives/anti-analysis/sandbox-detect/hostname::ruby-sandbox-host-marker-list
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
      - id: micro-behaviors/process/exit/terminate::ruby-exit-call
