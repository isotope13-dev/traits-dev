defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1480
  mbc: B0027

composite_rules:
  - id: powershell-country-selected-execution
    desc: Geolocation references accompany a country exit branch
    crit: suspicious
    conf: 0.98
    attack: T1480,T1614
    all:
      - id: micro-behaviors/communications/http/ip-discovery::geo-endpoint-with-fields
      - id: metadata/lang/source/syntax/assignment/name::powershell-uppercase-pair-array
      - id: micro-behaviors/data/collection/membership::powershell-country-membership-branch
      - id: micro-behaviors/process/exit/terminate::powershell-membership-exit
    unless:
      - id: metadata/signed/platform/
