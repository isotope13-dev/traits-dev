# ISP selection can also serve legitimate routing. Require guest remote-access
# delivery and a Telegram reporting endpoint, and retain suspicious severity.
# This is co-occurrence, not a claim that a particular branch runs at runtime.
defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
composite_rules:
  - id: isp-filtered-screenconnect-delivery
    desc: ISP membership check accompanies Telegram-tracked guest-client delivery
    crit: suspicious
    conf: 0.94
    attack: T1497.001,T1219
    all:
      - id: micro-behaviors/data/control-flow/membership::isp-field-membership
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientsetup-name-script
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-access-guest-parameters
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
