defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries, source]
  attack: T1614
  mbc: B0007.003

composite_rules:
  - id: geo-api-target-country-gate
    for: [elf, macho, pe, javascript]
    desc: Public geolocation country execution gate
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/ip-discovery::multi-public-geo-api-references
      - id: objectives/anti-analysis/geofencing/region/cluster::asia-africa-country-code-cluster
  - id: signed-unknown-pe-geo-cloud-profile
    desc: Signed unknown PE profiles external IP and contacts cloud infrastructure
    crit: hostile
    conf: 0.96
    platforms: [windows]
    for: [pe, dll]
    attack: T1036.004,T1614,T1105
    all:
      - id: objectives/evasion/masquerade/cert::signed-unknown-pe-multi-geo-profile
      - id: micro-behaviors/communications/http/url/cloud::gcs-url

  - id: obfuscated-powershell-public-ip-gate
    desc: Obfuscated PowerShell performs repeated public-IP checks
    crit: hostile
    conf: 0.98
    attack: T1016,T1614,T1027
    mbc: B0007.003,B0032
    for: [powershell]
    all:
      - id: micro-behaviors/communications/http/ip-discovery::fragmented-public-ip-service
      - id: objectives/anti-static/obfuscation/string/fragmentation::powershell-obfuscated-byte-loader

  - id: js-multi-provider-geo-ip-reconnaissance
    for: [javascript, typescript]
    desc: Queries multiple public geo-IP providers
    crit: hostile
    conf: 0.98
    attack: T1614,T1016
    all:
      - id: micro-behaviors/communications/http/ip-discovery::js-geo-multi-provider-fetch
      - id: micro-behaviors/data/serialize/schema-object::country-code-snake
      - id: micro-behaviors/communications/http/request/computed::js-fetch-computed-helper-argument
