# Remote blocklist execution gate. The program learns its public IP from an
# IP-discovery service, fetches operator-controlled IP and hostname blocklists
# over HTTP, and exits silently when the host appears on either list. Each
# leg alone is plumbing; the required combination -- public-IP discovery
# plus blocklist membership plus silent exit -- keeps the payload off
# researcher and sandbox machines. Dialog-showing flows are excluded as
# benign license or region notices.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1614
  mbc: B0007.003

composite_rules:
  - id: js-remote-blocklist-execution-gate
    desc: Gates execution on remotely fetched IP and host blocklists
    crit: suspicious
    conf: 0.94
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/ip-discovery::seeip-org
      - id: micro-behaviors/data/collection/membership::blocked-list-membership-call
      - id: micro-behaviors/process/exit/terminate::electron-app-quit-call
    unless:
      - id: micro-behaviors/ui/dialog/error::electron-dialog-box-call
