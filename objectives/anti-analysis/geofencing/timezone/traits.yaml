defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  attack: T1614
  mbc: B0007.003
traits:
# Reading the host time zone is a neutral system query and already has a
# canonical matcher at micro-behaviors/os/sysinfo/platform/browser::
# browser-timezone-read. Defining a second copy here reported every date
# library (dayjs' timezone plugin, Snowflake's webview bundle) twice, one of
# them under a geofencing objective. The gate composites below reference the
# canonical atom and supply the CIS-offset/region comparison themselves.
# Alone this only proves an IANA zone appears in a conditional — market-
# hours checks like `self.tzinfo == pytz.timezone("America/New_York")` are
# ordinary trading logic, not victim geofencing. Pair with a host-timezone
# query in `python-timezone-gate` for the suspicious composite.
- id: python-timezone-comparison
  desc: Python compares an IANA timezone value
  crit: component
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: '(?im)^[ \t]*if.{0,80}(zone|tz).{0,50}(==|!=|in).{0,50}["''][A-Za-z_]+/[A-Za-z_]+["'']'
  unless:
  # Constructed zone objects (pytz/ZoneInfo) are session calendars, not
  # host TZ geofencing against a string literal.
  - type: text
    regex: '(?im)(==|!=)\s*(pytz\.timezone|zoneinfo\.ZoneInfo)\s*\('

- id: js-gettimezoneoffset
  desc: Date.prototype.getTimezoneOffset()
  crit: component
  conf: 0.5
  for:
  - javascript
  - typescript
  if:
    type: symbol
    exact: getTimezoneOffset
- id: js-timezone-offset-120
  desc: TZ offset 120 (UTC+2)
  crit: component
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    regex: 'getTimezoneOffset\s*\(\s*\)\s*[=!<>]=?\s*120\b'
