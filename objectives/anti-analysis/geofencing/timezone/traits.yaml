composite_rules:
- id: js-timezone-detection
  desc: JavaScript timezone check using a CIS-region offset
  crit: notable
  conf: 0.8
  all:
  - id: js-timezone-offset-cis
  any:
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-timezone-read
  - id: js-gettimezoneoffset
- id: js-timezone-offset-cis
  desc: CIS region timezone offset checks
  crit: suspicious
  any:
  - id: js-timezone-offset-120
  - id: js-timezone-offset-180
  - id: js-timezone-offset-240
  - id: js-timezone-offset-300
  - id: js-timezone-offset-360
- id: shell-timezone-gate
  desc: Shell gates execution on host timezone
  crit: suspicious
  conf: 0.96
  for:
  - shell
  all:
  - id: micro-behaviors/os/sysinfo/platform/timezone::timedatectl-timezone-query
  - id: micro-behaviors/os/sysinfo/platform/timezone::shell-timezone-comparison
  near_lines: 12
- id: python-timezone-gate
  desc: Python gates execution on host timezone
  crit: suspicious
  conf: 0.96
  for:
  - python
  all:
  - id: python-timezone-comparison
  any:
  - id: micro-behaviors/os/sysinfo/platform/timezone::python-local-timezone-query
  - id: micro-behaviors/os/sysinfo/platform/timezone::python-tzlocal-query
  near_lines: 16
- id: js-host-timezone-branch
  desc: JavaScript branches on an IANA host timezone
  crit: component
  conf: 0.95
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-timezone-read
  - id: micro-behaviors/os/sysinfo/platform/timezone::js-iana-timezone-comparison
  near_bytes: 512
# Umbrella for target-activation-gate: nested so no rule lists 4+
# same-directory traits in one any: clause.
- id: language-timezone-gates
  desc: Language-specific host timezone execution gates
  crit: notable
  conf: 0.94
  any:
  - id: python-timezone-gate
  - id: shell-timezone-gate
- id: host-timezone-gates
  desc: Host timezone geofencing activation gates
  crit: notable
  conf: 0.94
  any:
  - id: language-timezone-gates
  - id: js-timezone-offset-cis
