    substr: Europe/Minsk
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
  - id: metadata/library/timezone::javascript-timezone-display-catalog
- id: tz-europe-kiev
  desc: Europe/Kiev timezone string
  crit: component
  conf: 0.8
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    substr: Europe/Kiev
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
  - id: metadata/library/timezone::javascript-timezone-display-catalog
- id: tz-europe-kyiv
  desc: Europe/Kyiv timezone string
  crit: component
  conf: 0.8
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    substr: Europe/Kyiv
  # Rust's bundled IANA timezone table contains every zone name; a table
  # entry is not a victim-selection check.
  unless:
  - id: metadata/lang/compiler/systems::rustc-path
  - id: metadata/lang/compiler/systems::rust-src-path
  - id: metadata/library/timezone::javascript-timezone-display-catalog
- id: tz-asia-almaty
  desc: Asia/Almaty timezone string
  crit: component
  conf: 0.8
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    substr: Asia/Almaty
  not:
  - regex: "(?i)(default|defaults|timezone|timestamp).{0,120}Asia/Almaty"
  - regex: "(?i)Asia/Almaty.{0,120}(default|defaults|timezone|timestamp)"
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
  - id: metadata/library/timezone::javascript-timezone-display-catalog
- id: tz-asia-tehran
  desc: Asia/Tehran timezone string
  crit: component
  conf: 0.8
  for:
  - javascript
  - pe
