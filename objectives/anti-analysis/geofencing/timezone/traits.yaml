  - macho
  - batch
  - powershell
  if:
    type: text
    substr: Asia/Tehran
  unless:
  - id: metadata/library/timezone::javascript-timezone-display-catalog
- id: tz-asia-pyongyang
  desc: Asia/Pyongyang timezone string
  crit: component
  conf: 0.8
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    substr: Asia/Pyongyang
  unless:
  - id: metadata/library/timezone::javascript-timezone-display-catalog
- id: timezone-country-code-catalog
  desc: Timezone to country-code catalog
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: 'Asia/Pyongyang.{0,40}["'']KP["'']'
- id: js-intl-datetime-options
  desc: Queries host timezone through Intl API
  crit: notable
  conf: 0.9
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    regex: 'Intl\.DateTimeFormat\([^)]{0,160}\)\.resolvedOptions\(\)\.timeZone'
- id: shell-timezone-comparison
  desc: Shell compares a timezone variable
  crit: suspicious
  conf: 0.95
  for:
  - shell
  if:
    type: text
    regex: '(?im)^\s*if\s+\[.{0,180}\b(zone|tz|timezone)\b.{0,180}\];\s*then\b'
- id: python-timezone-comparison
  desc: Python compares an IANA timezone value
  crit: suspicious
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: '(?im)^[ \t]*if.{0,80}(zone|tz).{0,50}(==|!=|in).{0,50}["''][A-Za-z_]+/[A-Za-z_]+["'']'
- id: js-timezone-comparison
  desc: Compares timezone to an IANA zone name
  crit: suspicious
  conf: 0.95
  for:
  - javascript
  - typescript
  # The comparison value must be an IANA `Region/City` zone name, matching the
  # `python-timezone-comparison` sibling above. Accepting any string literal
  # made this fire on ordinary date handling — `options.timeZone === "UTC"`
  # in @std/datetime and `tz !== 'Z'` in the yaml package's ISO parser — and a
  # bare `zone` identifier is far too common to carry geofencing intent.
  if:
    type: tree-sitter
    language: javascript
    kind: conditional
    regex: '(?is)\b(timezone|tz)\b\s*(===|!==|==|!=)\s*["''][A-Za-z_]+/[A-Za-z_]+'
  unless:
    # TZ is an explicit runtime/test selector, not a host-timezone query.
    - type: tree-sitter
      language: javascript
      kind: conditional
      regex: '(?is)\bprocess\.env\.TZ\b\s*(===|!==|==|!=)'
- id: js-gettimezoneoffset
  desc: Date.prototype.getTimezoneOffset()
  crit: component
  conf: 0.5
  for:
  - javascript
  - typescript
  if:
    type: symbol
    exact: getTimezoneOffset
- id: js-timezone-offset-120
  desc: TZ offset 120 (UTC+2)
  crit: component
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    regex: 'getTimezoneOffset\s*\(\s*\)\s*[=!<>]=?\s*120\b'
- id: js-timezone-offset-180
