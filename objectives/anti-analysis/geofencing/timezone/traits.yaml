defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  attack: T1614
  mbc: B0007.003
traits:
- id: tz-europe-moscow
  desc: Europe/Moscow timezone string
  crit: component
  conf: 0.8
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    substr: Europe/Moscow
  not:
  - regex: "(?i)(timezone|Intl\\.DateTimeFormat).{0,80}Europe/Moscow"
  - regex: "(?i)Europe/Moscow.{0,80}(timezone|Intl\\.DateTimeFormat)"
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
  - id: metadata/library/timezone::javascript-timezone-display-catalog
- id: tz-europe-minsk
  desc: Europe/Minsk timezone string
