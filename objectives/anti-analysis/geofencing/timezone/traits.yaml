defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  attack: T1614
  mbc: B0007.003
traits:
# Reading the host time zone is a neutral system query and already has a
# canonical matchers at micro-behaviors/os/sysinfo/platform/timezone/.
# Defining a second copy here reported every date
# library (dayjs' timezone plugin, Snowflake's webview bundle) twice, one of
# them under a geofencing objective. The gate composites below reference the
# canonical atom and supply the CIS-offset/region comparison themselves.

- id: js-timezone-offset-120
  desc: TZ offset 120 (UTC+2)
  crit: notable
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  if:
    type: text
    regex: 'getTimezoneOffset\s*\(\s*\)\s*(={2,3}|!={1,2}|[<>]=?)\s*120\b'
