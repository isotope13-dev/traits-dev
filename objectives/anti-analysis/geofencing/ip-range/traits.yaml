# IP Range Geofencing
# Detects malware that validates target by comparing IP addresses against
# hardcoded ranges to restrict execution to specific countries/regions.
# ATT&CK: T1614 (System Location Discovery)
defaults:
  for: [binaries, scripts]
  platforms: [windows, linux, macos]
  attack: T1614
  crit: notable
  conf: 0.85

traits:
- id: hardcoded-ip-range-start
  desc: Hardcoded IP range start address
  crit: component
  conf: 0.75
  if:
    type: text
    regex: \b\d{1,3}\.\d{1,3}\.0\.0\b
    is: external_ip

- id: self-destruct-not-target--rx-3
  desc: Self-destruct with country or target-region
  crit: suspicious
  conf: 0.92
  # Bare "target" is game-card and test-case vocabulary ("destroy target
  # creature", "deals P to target"); the geofence reading needs the geographic
  # sense -- a country, or `target` compounding into one. Standalone
  # region/range phrasing is the rx-4 sibling below.
  if:
    type: text
    regex: (?i)\bself[-_]?(destruct|delete)\b.{0,80}\b(country|target[-_ ]?(country|region|range))\b

- id: self-destruct-not-target--rx-4
  desc: Self-destruct and region or range reference
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(self[-_]?(destruct|delete))\b.{0,80}\b(region|range)\b

# The restriction word has to actually govern the region: `limited to this
# region`, not any sentence that happens to pair "operations" with "a limited
# range of ..." (Kibana's rule_type_registry comment about the limited range of
# characters allowed in authorization strings read as a geofence message).
- id: operation-restricted-message--rx-5
  desc: Operation restricted to a region
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)(operation|execution)[^.\n]{0,26}(restricted|limited) to[^.\n]{0,40}region\b
  unless:
    - id: well-known/tool/sysadmin/unix-benign::emacs-install-tree
    - id: well-known/tool/development/vcs/git-for-windows::vendored-tree

- id: operation-restricted-ip-range-message
  desc: IP or geographic range restriction message
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(?i)(restricted|limited) to[^.\n]{0,30}(IP|geographic) range\b'

- id: operation-restricted-message--rx-6
  desc: Operation restricted to a country
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)(operation|execution)[^.\n]{0,26}(restricted|limited) to[^.\n]{0,40}countr(y|ies)\b

- id: target-verify-log
  desc: Target verification log file creation
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?i)target[-_]?verify\.(log|txt)

composite_rules:
- id: geofencing-with-self-destruct
  desc: Geofencing with self-destruct on mismatch
  crit: suspicious
  conf: 0.95
  all:
  - id: self-destruct-not-target
  any:
  - id: metadata/file/profile/locale::target-location-check-name
  - id: operation-restricted-message
  - id: target-verify-log
- id: self-destruct-not-target
  desc: Self-destruct when not in target region
  crit: suspicious
  conf: 0.92
  any:
  - id: self-destruct-not-target--rx-3
  - id: self-destruct-not-target--rx-4
- id: operation-restricted-message
  desc: Operation restricted to geographic range message
  crit: suspicious
  conf: 0.95
  any:
  - id: operation-restricted-message--rx-5
  - id: operation-restricted-message--rx-6
  - id: operation-restricted-ip-range-message
