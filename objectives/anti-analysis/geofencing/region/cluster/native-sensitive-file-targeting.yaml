defaults:
  platforms:
    - unix
    - windows
    - macos

composite_rules:
  - id: cis-sensitive-target-exclusion
    desc: CIS exclusion with host or sensitive targets
    crit: hostile
    conf: 0.95
    attack: T1614.001
    for: [elf, macho, pe, javascript]
    all:
      - id: objectives/anti-analysis/geofencing/region/cluster::cis-region-check-clues
    any:
      - id: micro-behaviors/os/security/auth/verify::csidentity-password-auth
      - id: objectives/discovery/system/fingerprint/machine-id::macos-hardware-uuid
      - id: micro-behaviors/fs/path/application/browser/profile::browser-data-files
      - id: micro-behaviors/fs/path/credential::key-and-connection-file-references
      - id: objectives/collection/file-targeting/filter::wallet-files
