defaults:
  crit: component
  conf: 0.6
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
  attack: T1614
  mbc: B0007.003
traits:
- id: country-code-kg
  desc: Country code KG token
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']KG[\"']"
  unless:
  - id: metadata/lang/locale::country-name-selector-catalog
- id: country-code-kz
  desc: Country code KZ token
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']KZ[\"']"
  unless:
  - id: metadata/binary/section/name::fwimage-section
  - id: metadata/lang/locale::country-name-selector-catalog
- id: country-code-md
  desc: Country code MD token
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']MD[\"']"
  unless:
  - id: metadata/binary/section/name::fwimage-section
  - id: metadata/lang/locale::country-name-selector-catalog
