# Locale-querying API paired with CIS-country-code cluster.
#
# Locale API imports and country-code strings do not establish that the API
# result controls execution. The comparison-based source rule below supplies
# stronger evidence of a geographic gate.
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1614"
  mbc: "B0007.003"

composite_rules:
  - id: locale-api-with-cis-cluster
    desc: Locale API and CIS country code references
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/data/format/locale::cis-country-codes
    any:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-locale-info
      - id: micro-behaviors/os/sysinfo/platform/locale::get-user-default-lcid

  - id: ui-language-cis-langid-gate
    for: [c, cpp]
    desc: Queries UI language for CIS LANGID constants
    crit: suspicious
    conf: 0.96
    attack: "T1614.001"
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-ui-language-source
      - id: micro-behaviors/os/sysinfo/platform/locale::cis-langid-comparison-cluster
