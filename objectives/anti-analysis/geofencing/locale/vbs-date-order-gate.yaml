# A downloader that probes the regional date order by parsing a fixed
# ambiguous date and executes an HTTP response body: hosts whose short-date
# format yields the wrong year never request or run the next stage, which
# keeps it from sandboxes and regions the operator excludes.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1614.001,T1059.005

composite_rules:
  - id: vbs-date-order-probe-with-response-execution
    desc: Date-order locale probe beside remote execution
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::vbs-fixed-short-date-parse
      - id: objectives/execution/payload/script-eval/network/response-body::vbs-http-response-execute
