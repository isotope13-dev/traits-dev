# Locale self-exclusion gate built on the OS MUI languages.
#
# Operation RepoGhost's in-memory .NET stage read
# Win32_OperatingSystem.MUILanguages and exited when the host reported ru-RU —
# the classic CIS self-exclusion used by Russia-linked loaders and ransomware.
# The same property/compare/bail shape recurs across families and languages
# (PowerShell, C#, VBScript). The bare property read is a neutral capability
# atom (micro-behaviors); this file adds the gate: a locale tag compared
# against the query result followed by a bail-out branch.
defaults:
  platforms: [windows]
  for: [powershell, csharp, vbs, batch]
  attack: "T1614.001"
  mbc: "B0025"

composite_rules:
  - id: mui-locale-exclusion-gate
    for: [csharp, powershell, vbs]
    desc: Exits when OS MUI languages match a chosen locale tag
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::os-mui-languages-query
      - id: micro-behaviors/data/control-flow/return::locale-region-tag-early-return
    near_bytes: 512
