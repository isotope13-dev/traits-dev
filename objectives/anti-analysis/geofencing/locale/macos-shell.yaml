defaults:
  platforms: [macos]
  for: [shell]
  attack: T1614.001

traits:
  - id: shell-region-allowed-list-exit
    desc: Shell region allowed list exit
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'US.{0,40}CA.{0,40}GB[\s\S]{0,220}exit 42'

composite_rules:
  - id: shell-macos-region-gate
    desc: Shell macOS region gate
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::shell-macos-countrycode-read
      - id: shell-region-allowed-list-exit
