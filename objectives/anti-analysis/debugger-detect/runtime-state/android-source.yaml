# Android runtime debugger and ADB probes. These do not establish malware
# identity or prove that ordinary diagnostic code is hostile.
defaults:
  for: [java]
  platforms: [android]
  crit: notable
traits:
  - id: android-debug-state-call
    desc: Invokes a debugger-state method name
    crit: component
    if:
      type: symbol
      kind: call
      regex: '^(isDebuggerConnected|waitingForDebugger)$'
  - id: android-debug-state-api
    desc: Android Debug state API reference
    crit: component
    if:
      type: text
      regex: '\bDebug\s*\.\s*(isDebuggerConnected|waitingForDebugger)\s*\('
      exclude_comments: true
  - id: android-adb-setting-read
    desc: Integer getter receives ADB setting key
    crit: component
    if:
      type: symbol
      kind: call
      exact: getInt
      arg: {index: 1, exact: adb_enabled}
  - id: android-settings-int-api
    desc: Android settings integer API reference
    crit: component
    if:
      type: text
      regex: '\bSettings\s*\.\s*(Global|Secure)\s*\.\s*getInt\s*\('
      exclude_comments: true
composite_rules:
  - id: android-debugger-state-probe
    desc: Checks Android debugger attachment state
    crit: suspicious
    attack: T1622
    near_lines: 1
    all:
      - id: android-debug-state-call
      - id: android-debug-state-api
    # AppMetrica's ANR monitor skips the hang report while a debugger is
    # attached. That is SDK diagnostics, so the known package suppresses it.
    unless:
      - id: well-known/lib/vendor-sdk/appmetrica::appmetrica-package-declaration
  - id: android-adb-state-probe
    desc: Checks Android ADB enabled state
    crit: suspicious
    attack: T1622
    near_lines: 1
    all:
      - id: android-adb-setting-read
      - id: android-settings-int-api
