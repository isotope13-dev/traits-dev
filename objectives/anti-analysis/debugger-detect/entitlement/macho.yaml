# macOS code-signing entitlement `com.apple.security.get-task-allow`
# permits a process to be attached by a debugger.  It's required for
# Xcode local debugging but should be stripped from any build that
# ships to users — Apple's notarization pipeline rejects binaries
# carrying it.
#
# Hardened runtime is what Apple requires of anything it will notarize,
# and it is visible in the CodeDirectory flags on the slice itself. A
# hardened-runtime binary that still carries `get-task-allow` is
# anomalous: either the checks were bypassed, the dev cert was stolen,
# or the build pipeline accidentally promoted a debug binary. All three
# are supply-chain swap signals.
defaults:
  platforms: [macos]
  for: [macho]
  conf: 0.95
  attack: T1622
traits:
  - id: node-fontlist-darwin-path
    desc: node font-list Darwin helper
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|/)font-list/'

composite_rules:
  - id: get-task-allow-on-hardened-runtime
    desc: Debug entitlement on hardened-runtime binary
    crit: suspicious
    all:
      - id: metadata/signed/entitlements::get-task-allow
      - id: metadata/signed/trust-level::hardened-runtime-dup
    unless:
      - id: node-fontlist-darwin-path
      # Official Node.js/V8 runtimes (playwright's bundled node, Electron,
      # pkg/SEA outputs) ship get-task-allow alongside hardened runtime as
      # their standard JIT-entitlement set; the V8 registration symbol is
      # the runtime identity a renamed binary keeps.
      - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context
      # Official Microsoft .NET runtimes require get-task-allow for JIT,
      # debugging, and crash dump generation (e.g. createdump).
      - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-macos-runtime-tool
    downgrade:
      # Vendor-distributed tools signed with a real developer team
      # identifier (Go CLIs, Electron bundles) routinely ship this exact
      # entitlement set for debugging and JIT; that is a distribution
      # choice, not an attack signal. Unsigned or ad-hoc-signed binaries
      # keep the suspicious claim.
      any:
        - id: metadata/signed/trust-level::developer-team-identifier
