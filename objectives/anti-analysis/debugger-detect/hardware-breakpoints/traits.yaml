defaults:
  platforms: [windows]
  for: [binaries, source]
composite_rules:
  - id: thread-and-memory-anti-analysis-suite
    for: [pe]
    desc: Thread hiding and memory breakpoint anti-analysis suite
    crit: hostile
    conf: 0.99
    attack: T1622
    all:
      - id: objectives/anti-analysis/sandbox-detect/suite::named-native-anti-analysis-check-cluster
      - id: objectives/anti-analysis/debugger-detect/thread-hide::hide-thread-from-debugger-marker
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import

  # A crash helper attaches, waits, and writes a minidump. That is the
  # product, not an anti-analysis loop. Kept out of the reverse-engineering
  # directory so a minidump writer is not treated as every RE tool.
