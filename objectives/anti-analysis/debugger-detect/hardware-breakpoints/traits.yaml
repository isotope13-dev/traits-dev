defaults:
  platforms: [windows]
  for: [binaries, source]
traits:
  - id: hide-thread-from-debugger-marker
    desc: HideThreadFromDebugger anti-analysis marker
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: HideThreadFromDebugger
composite_rules:
  - id: native-veh-thread-context-protection-loader
    desc: Native loader combines VEH, thread-context control, and page protection
    crit: hostile
    conf: 0.99
    attack: T1055.003,T1620,T1622
    mbc: B0012
    for: [pe, dll]
    all:
      - id: micro-behaviors/os/exception/error-handling::add-vectored-exception-handler
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/sync/event::open-event
      - id: micro-behaviors/process/sync/event::create-event
    any:
      - id: metadata/binary/layout/overlay::large-overlay-1mb
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/productivity/sap-crystal-reports::sap-crystal-reports-engine-context
      # MinGW-w64 satisfies every import leg from the toolchain: libgcc
      # registers one VEH, winpthreads rewrites a suspended thread's context
      # to run a cancel handler, and the pseudo-relocator calls VirtualProtect.
      # Those are not one loader. A MinGW image that really injects still has
      # to match a rule whose legs are not the CRT imports.
      - id: metadata/lang/compiler/native::mingw-built-pe

  - id: thread-and-memory-anti-analysis-suite
    for: [pe]
    desc: Thread hiding and memory breakpoint anti-analysis suite
    crit: hostile
    conf: 0.99
    attack: T1622
    all:
      - id: objectives/anti-analysis/sandbox-detect/suite::named-native-anti-analysis-check-cluster
      - id: hide-thread-from-debugger-marker
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import

  # A crash helper attaches, waits, and writes a minidump. That is the
  # product, not an anti-analysis loop. Kept out of the reverse-engineering
  # directory so a minidump writer is not treated as every RE tool.
