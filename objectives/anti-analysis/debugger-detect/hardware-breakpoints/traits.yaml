defaults:
  platforms: [windows]
  for: [binaries, source]
traits:
  - id: hide-thread-from-debugger-marker
    desc: HideThreadFromDebugger anti-analysis marker
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: HideThreadFromDebugger
composite_rules:
  - id: native-veh-thread-context-protection-loader
    desc: Native loader combines VEH, thread-context control, and page protection
    crit: hostile
    conf: 0.99
    attack: T1055.003,T1620,T1622
    mbc: B0012
    for: [pe, dll]
    all:
      - id: micro-behaviors/os/exception/error-handling::add-vectored-exception-handler
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/sync/event::open-event
      - id: micro-behaviors/process/sync/event::create-event
    any:
      - id: metadata/binary/layout/overlay::large-overlay-1mb
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/productivity/sap-crystal-reports::sap-crystal-reports-engine-context

  - id: thread-and-memory-anti-analysis-suite
    for: [pe]
    desc: Thread hiding and memory breakpoint anti-analysis suite
    crit: hostile
    conf: 0.99
    attack: T1622
    all:
      - id: objectives/anti-analysis/sandbox-detect/suite::named-native-anti-analysis-check-cluster
      - id: hide-thread-from-debugger-marker
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import

  - id: debugger-attach-loop
    for: [pe]
    desc: Attaches as debugger and enters event loop
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/process/debug/event::debug-active-process
      - id: micro-behaviors/process/debug/event::wait-for-debug-event
      - id: micro-behaviors/process/debug/event::continue-debug-event
    # Suppressors consolidated into the legit-debugger-tool-context umbrella
    # (one referenced leg instead of eight; identical OR semantics).
    unless:
      # DebugActiveProcess + WaitForDebugEvent + ContinueDebugEvent is the
      # definition of a Windows debugger: Wine's kernel32/kernelbase implement the
      # trio and winedbg is one, while `api-ms-win-core-debug-l1-1-1.dll` is the
      # API-set stub that forwards it.
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      - id: metadata/binary/linking/api-set::api-set-forwarder-dll
      # A binary that IS a reverse-engineering tool is expected to attach as a
      # debugger and pump the event loop -- gdbserver, GNU gdb, IDA's debug
      # server, OllyDbg, ScyllaHide, QuickBMS and radare2 all live here. One
      # directory reference replaces seven leaf ones and keeps the rule inside
      # its suppression budget; it also picks up tools added here later.
      - id: well-known/tool/reverse-engineering/
      # mscordbi.dll is the CLR's own debugger interface -- ".NET Runtime
      # Debugging Services" -- so it implements this trio rather than using it.
      # A verified platform Authenticode signature is the cheap way to say so.
      - id: metadata/signed/platform/
      # ConEmu's console server attaches to the console host it hosts and pumps
      # the same debug-event loop to relay its output.
      - id: well-known/tool/sysadmin/conemu::conemu-component
      - id: well-known/app/system/reactos::system-component
      # NaCl and chrome.dll attach to a child and pump debug events as the
      # sandbox broker. ProductName Google Chrome is the version resource.
      - id: well-known/tool/browser::chrome-product-name
  - id: suspect-browser-snapshot
    for: [pe]
    desc: Enumerates processes with specific browser focus
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/fs/path/application/browser::chromium-main-library-name
