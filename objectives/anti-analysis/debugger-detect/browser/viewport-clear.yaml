defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
traits:
  - id: viewport-gap-gates-body-clear
    desc: Viewport-gap condition clears document body
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (binary_expression
              operator: ["<" "<=" ">" ">="]
              (binary_expression
                left: (member_expression object: (identifier) @outer_object
                  property: (property_identifier) @outer)
                operator: "-"
                right: (member_expression object: (identifier) @inner_object
                  property: (property_identifier) @inner))))
          consequence: (statement_block
            (expression_statement (assignment_expression
              left: (member_expression
                object: (member_expression object: (identifier) @document
                  property: (property_identifier) @body)
                property: (property_identifier) @html)
              right: (string) @empty)))) @evidence
          (#eq? @outer_object "window") (#eq? @inner_object "window")
          (#match? @outer "^outer(Width|Height)$")
          (#match? @inner "^inner(Width|Height)$")
          (#eq? @document "document") (#eq? @body "body")
          (#eq? @html "innerHTML") (#match? @empty "^['\"][\"']$"))
