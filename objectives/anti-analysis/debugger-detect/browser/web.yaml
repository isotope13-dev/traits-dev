composite_rules:
- id: iframe-cookie-phishing-shell
  desc: Iframe phishing shell preserves target URL
  crit: hostile
  conf: 0.97
  all:
  - id: full-window-iframe-shell
  - id: iframe-url-cookie-mirror
  any:
  - id: console-methods-poisoned
  - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
- id: full-window-iframe-shell
  desc: Full-window iframe phishing shell
  crit: notable
  conf: 0.9
  for: [javascript, html]
  all:
  - id: micro-behaviors/ui/window/dom/create::browser-iframe-element
  - id: micro-behaviors/ui/window/style::browser-style-position-assignment
  - id: micro-behaviors/ui/window/style::css-fixed-position
  - id: iframe-url-cookie-mirror
  any:
  - id: micro-behaviors/ui/window/dom/create::browser-create-element
  - id: micro-behaviors/ui/window/style::size-prop
  near_bytes: 1024
  unless:
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/tool/development/firebug/
  - id: firebug-lite-basename
  - id: console-firebug-marker
  - id: well-known/tool/development/vscode-extension/atlascode/
- id: iframe-url-cookie-mirror
  desc: Iframe URL mirrored into cookie
  crit: suspicious
  conf: 0.88
  for: [javascript, html]
  all:
  - id: iframe-url-cookie-mirror--rx-7
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-read
  - id: micro-behaviors/data/encode/base64::btoa-symbol
  near_bytes: 4096
- id: console-methods-poisoned
