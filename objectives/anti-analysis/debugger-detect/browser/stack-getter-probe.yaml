# Confiant's AdFection stager probes console inspection with an Error.stack
# getter. Unlike ordinary lazy stack formatting, this getter only flips a
# flag and returns an empty string. The published stager then logs the object;
# this rule observes the distinctive getter, not the result of inspection.
# Match the operations, independent of local names and campaign infrastructure.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1622
traits:
  - id: js-stack-getter-empty-flag-probe
    desc: Stack getter flips flag, returns empty
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["'']stack["'']\s*,\s*\{\s*get\s*\(\)\s*\{\s*[\w$]+\s*=\s*true\s*;\s*return\s*["'']["'']'
      exclude_html_comments: true
