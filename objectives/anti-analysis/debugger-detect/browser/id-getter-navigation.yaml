# Material Security, CalendarInviteWhitepaper-sep2026.pdf, pp. 5-7:
# an id getter navigates away when a DOM object is expanded in DevTools.
# Call facts expose the descriptor, but not that navigation is inside its
# getter. Nearby Object.defineProperty + navigation also occurs in UI code.
# Use the syntax tree to require the side effect in the getter body itself.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1622
traits:
  - id: js-id-getter-blank-navigation
    desc: ID getter navigates to a blank page
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call_expression
                  function: (member_expression
                    object: (identifier) @object
                    property: (property_identifier) @define)
                  arguments: (arguments
                    (_)
                    (string (string_fragment) @property)
                    (object [
                      (pair key: (property_identifier) @get value: [
                      (function_expression body: (statement_block (expression_statement (call_expression
                            function: (_) @navigation
                            arguments: (arguments
                              (string (string_fragment) @destination))))))
                      (arrow_function body: (statement_block (expression_statement (call_expression
                            function: (_) @navigation
                            arguments: (arguments
                              (string (string_fragment) @destination))))))
                    ])
                      (method_definition name: (property_identifier) @get body: (statement_block (expression_statement (call_expression
                            function: (_) @navigation
                            arguments: (arguments
                              (string (string_fragment) @destination))))))
                    ])))
                  (#eq? @object "Object")
                  (#eq? @define "defineProperty")
                  (#eq? @get "get")
                  (#eq? @property "id")
                  (#match? @navigation "^(window\\.|document\\.)?location\\.(replace|assign)$")
                  (#eq? @destination "about:blank"))
        ((call_expression
                  function: (member_expression
                    object: (identifier) @object
                    property: (property_identifier) @define)
                  arguments: (arguments
                    (_)
                    (string (string_fragment) @property)
                    (object [
                      (pair key: (property_identifier) @get value: [
                      (function_expression body: (statement_block (expression_statement (assignment_expression
                            left: (_) @navigation
                            right: (string (string_fragment) @destination)))))
                      (arrow_function body: (statement_block (expression_statement (assignment_expression
                            left: (_) @navigation
                            right: (string (string_fragment) @destination)))))
                    ])
                      (method_definition name: (property_identifier) @get body: (statement_block (expression_statement (assignment_expression
                            left: (_) @navigation
                            right: (string (string_fragment) @destination)))))
                    ])))
                  (#eq? @object "Object")
                  (#eq? @define "defineProperty")
                  (#eq? @get "get")
                  (#eq? @property "id")
                  (#match? @navigation "^(window\\.|document\\.)?location(\\.href)?$")
                  (#eq? @destination "about:blank"))
        ((call_expression
                  function: (member_expression property: (property_identifier) @define)
                  arguments: (arguments
                    (string (string_fragment) @property)
                    [
                      (function_expression body: (statement_block (expression_statement (call_expression
                            function: (_) @navigation
                            arguments: (arguments
                              (string (string_fragment) @destination))))))
                      (arrow_function body: (statement_block (expression_statement (call_expression
                            function: (_) @navigation
                            arguments: (arguments
                              (string (string_fragment) @destination))))))
                    ]))
                  (#eq? @define "__defineGetter__")
                  (#eq? @property "id")
                  (#match? @navigation "^(window\\.|document\\.)?location\\.(replace|assign)$")
                  (#eq? @destination "about:blank"))
        ((call_expression
                  function: (member_expression property: (property_identifier) @define)
                  arguments: (arguments
                    (string (string_fragment) @property)
                    [
                      (function_expression body: (statement_block (expression_statement (assignment_expression
                            left: (_) @navigation
                            right: (string (string_fragment) @destination)))))
                      (arrow_function body: (statement_block (expression_statement (assignment_expression
                            left: (_) @navigation
                            right: (string (string_fragment) @destination)))))
                    ]))
                  (#eq? @define "__defineGetter__")
                  (#eq? @property "id")
                  (#match? @navigation "^(window\\.|document\\.)?location(\\.href)?$")
                  (#eq? @destination "about:blank"))
