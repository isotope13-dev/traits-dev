# JavaScript anti-debugging via an executed Function constructor containing a
# debugger statement. The construct is used by obfuscators and by some
# legitimate extensions, so the atomic match is suspicious rather than a
# malware-family signature; stronger composites provide hostile context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1622
  mbc: B0001
traits:
- id: js-constructor-debugger-call
  desc: Function constructor with debugger string
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '\[\s*[''"]constructor[''"]\s*\]\s*\(\s*[''"][^''"]{0,40}debugger[^''"]{0,20}[''"]\s*\)\s*\(\s*\)'
- id: js-constructor-debugger-direct
  desc: Direct .constructor('debugger') call
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '\.constructor\s*\(\s*[''"][^''"]{0,40}debugger[^''"]{0,20}[''"]\s*\)\s*\(\s*\)'
  unless:
  - id: well-known/app/communication/thunderbird::firefox-source-tree-path
- id: js-debugger-split-debu-gger
  desc: Debugger keyword split as debu plus gger
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '[''"]debu[''"]\s*\+\s*[''"]gger[''"]'
- id: js-debugger-split-debug-ger
  desc: Debugger keyword split as debug plus ger
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '[''"]debug[''"]\s*\+\s*[''"]ger[''"]'
- id: js-debugger-split-deb-ugger
  desc: Debugger keyword split as deb plus ugger
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '[''"]deb[''"]\s*\+\s*[''"]ugger[''"]'
- id: js-debugger-string-table-fragments
  desc: debugger fragments in obfuscated string table
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '[''"]debu[''"][\s\S]{0,180}[''"]gger[''"]|[''"]gger[''"][\s\S]{0,180}[''"]debu[''"]'
# javascript-obfuscator's `selfDefending` guard in its function-integrity form:
# it builds `\w+ *\( *\) *{\w+ *['|"].+['|"];? *}` and tests a function's own
# source against it, so beautifying the file breaks execution. The existing
# `self-defending-regex` atom matches the *debug-protection* guard
# `(((.+)+)+)+$`, which is a different construct, and the composite below
# needed a `debugger` or `while(true)` fragment -- so this variant went
# undetected. With `unicodeEscapeSequence` on, the guard is written with \x
# escapes and split across two properties, which is why a literal matcher for
# the readable form does not see it either. Both spellings are covered.
- id: js-selfdefending-integrity-guard-escaped
  desc: Escaped self-defending integrity guard
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '\x5cw+\x20*\x5c(\x5c)'
- id: js-selfdefending-integrity-guard-plain
  desc: Self-defending integrity guard regex
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '\w+ *\( *\) *{'
- id: js-while-true-string-table-fragment
  desc: while true obfuscated string table
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[''"]while(\\x20|\s)+\(true\)(\\x20|\s)*\{\}[''"]'
- id: js-hex-debugger-prefix
  desc: Hex-escaped debugger prefix
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '\x64\x65\x62\x75'
- id: js-hex-debugger-suffix
  desc: Hex-escaped debugger suffix
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '\x67\x67\x65\x72'
- id: js-hex-constructor-token
  desc: Hex-escaped constructor token
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '\x63\x6f\x6e\x73\x74\x72\x75\x63\x74\x6f'
composite_rules:
- id: obfuscated-vscode-debugger-trap
  desc: Obfuscated VS Code runtime embeds debugger traps
  crit: notable
  conf: 0.97
  attack: T1195.002,T1027.002,T1622
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/process/debug/event::debugger-statement
  - id: well-known/lib/development/vscode::globalthis-vscode-exposure
  any:
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  - id: micro-behaviors/data/source/property/computed::js-computed-property-call
  unless:
  - id: metadata/package/testing/
- id: js-constructor-debugger-antidebug
  desc: Executed JS Function-constructor anti-debugger pattern
  crit: suspicious
  conf: 0.93
  any:
  - id: js-constructor-debugger-call
  - id: js-constructor-debugger-direct
  - id: js-debugger-string-split
- id: js-debugger-string-split
  desc: debugger string split across literals
  crit: suspicious
  conf: 0.92
  unless:
  - id: well-known/dual-use/packaging/javascript-obfuscator::official-archive-context
  - id: well-known/dual-use/packaging/javascript-obfuscator::implementation-context
  - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
  any:
  - id: js-debugger-split-debu-gger
  - id: js-debugger-split-debug-ger
  - id: js-debugger-split-deb-ugger
  downgrade:
    scope: archive
    any:
    - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
- id: js-obfuscator-self-defending-antidebug
  desc: Obfuscated JS self-defending anti-debugger fragments
  # javascript-obfuscator emits this integrity/anti-debug scaffold as a
  # documented protection option. It is suspicious anti-analysis behavior,
  # but the scaffold alone says nothing about the protected program's intent.
  crit: suspicious
  conf: 0.96
  scope: leaf
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  - id: objectives/execution/interpreter/eval/dynamic::constructor-property-access
  any:
  - id: js-debugger-string-table-fragments
  - id: js-while-true-string-table-fragment
  - id: js-selfdefending-integrity-guard-escaped
  - id: js-selfdefending-integrity-guard-plain
  unless:
  - id: metadata/package/testing/
  near_bytes: 4096
  downgrade:
    scope: archive
    any:
    - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
- id: js-obfuscated-hex-debugger-antidebug
  desc: Obfuscated Function-constructor debugger trap
  crit: hostile
  conf: 0.97
  attack: T1027.002,T1622
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  - id: js-hex-debugger-prefix
  - id: js-hex-debugger-suffix
  - id: js-hex-constructor-token
  unless:
  - id: metadata/package/testing/
  near_bytes: 4096
- id: self-defending-global-ciphertext-module-loader
  desc: Self-defending loader hides globalThis ciphertext module stage
  crit: hostile
  conf: 0.97
  attack: T1027.002,T1622,T1059.007
  all:
  - id: js-selfdefending-integrity-guard-escaped
  - id: metadata/file/encoded::globalthis-string-ciphertext-assignment
  - id: micro-behaviors/process/interpreter/eval/compile::node-new-module-computed-invocation
  unless:
  - id: metadata/package/testing/
