defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-peb-debugger-key-selector
    desc: PEB debugger state selects table entry
    crit: suspicious
    conf: 0.99
    attack: T1622
    if:
      type: hex
      section: .text
    # Unlike branch-based checks, CMOV makes the debugger state data:
    # tests ProcessHeap, ImageBaseAddress and BeingDebugged, then uses
      # the result to index a two-entry DWORD table. No branch is needed.
      pattern: >-
        65 48 8B 14 25 60 00 00 00 45 33 C0 41 8B C0 41 8B C8
        4C 39 42 30 0F 95 C1 4C 39 42 10 0F 95 C0 48 23 C8
        41 8B C0 44 38 42 02 48 0F 44 C1 48 8D 0D ?? ?? ?? ?? 8B 04 81
