# x64 loader that selects a decryption table from the PEB debugger state and then
# decrypts its own strings with a repeated 32-byte XOR key. Each leg is common in
# isolation (anti-debug checks and XOR string tables both appear in benign
# protectors), but together they describe a crypter that hides its runtime strings
# and branches on whether a debugger is attached.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1622,T1027

composite_rules:
  - id: crypter-debugger-gated-string-decrypt
    desc: x64 crypter selects string key by PEB debugger state
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: objectives/anti-analysis/debugger-detect/state-selection::x64-peb-debugger-key-selector
      - id: objectives/anti-static/obfuscation/string/encrypt::repeated-x64-xor32-string-loops
