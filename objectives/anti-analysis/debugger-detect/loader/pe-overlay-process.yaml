defaults:
  crit: hostile
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: opaque-overlay-debugger-process-loader
    desc: Opaque overlay with anti-debug process loader
    conf: 0.98
    attack: T1027.009,T1057,T1622,T1106
    all:
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/os/handler/open::shell-execute-ex
    unless:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-bootstrapper
  - id: opaque-overlay-debugger-api-loader
    desc: Opaque PE overlay with anti-debug and runtime mapper APIs
    conf: 0.99
    attack: T1027.009,T1620,T1622
    all:
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-bootstrapper
      - id: objectives/evasion/anti-av/code-padding::native-rat-random-overlay-padding
