defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  attack: T1622,T1497.001

composite_rules:
  - id: managed-profiler-debugger-failfast-startup
    desc: Managed startup combines debugger and profiler checks with fail-fast termination
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/process/lifecycle/auto-exec::dotnet-module-initializer
      - id: micro-behaviors/process/debug/detect::dotnet-debugger-attached-call
      - id: micro-behaviors/os/env/test::dotnet-profiler-setting-presence-check
      - id: micro-behaviors/process/exit/terminate::managed-failfast-call
