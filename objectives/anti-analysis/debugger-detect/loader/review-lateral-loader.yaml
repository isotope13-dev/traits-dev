defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: packed-anti-debug-api-resolution
    desc: Packed anti-debug and API-resolution evidence
    crit: suspicious
    conf: 0.94
    size_max: 450000
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
    all:
      - id: metadata/binary/section/entropy::high-entropy-exec-section
      - id: objectives/anti-analysis/debugger-detect/loader::packed-debug-and-system-api-references
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
