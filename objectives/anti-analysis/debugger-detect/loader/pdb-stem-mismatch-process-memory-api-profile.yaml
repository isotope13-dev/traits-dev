defaults:
  platforms:
    - windows
composite_rules:
  - id: pdb-stem-mismatch-process-memory-api-profile
    desc: PDB stem mismatch with process and remote-memory APIs
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/debug::pe-stem-differs-from-pdb-stem
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
    any:
      - id: metadata/binary/symbols/count::minimal-exports
      - id: micro-behaviors/process/debug/event::output-debug-string
      - id: micro-behaviors/process/terminate/kill::terminate-process
    needs: 2
    for: [pe, dll]
