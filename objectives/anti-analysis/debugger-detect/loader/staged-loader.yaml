defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: staged-pe-loader-with-debugger-check
  desc: Staged PE loader with debugger check and API resolution
  crit: hostile
  conf: 0.98
  attack: T1620,T1622
  all:
  - id: objectives/execution/payload/image-map::capi-inline-pe-executable-memory-clues
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  unless:
  - id: metadata/installer/product/
