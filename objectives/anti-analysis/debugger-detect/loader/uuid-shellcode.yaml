defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1027,T1622,T1620
composite_rules:
  - id: uuid-shellcode-antidebug-api-loader
    desc: UUID shellcode loader with anti-debug API resolve
    crit: hostile
    conf: 0.96
    attack: T1027,T1622,T1620,T1106
    all:
      - id: micro-behaviors/data/format/string::dense-uuid-hyphen-string-table
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/file/profile/memory-protection-api::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
