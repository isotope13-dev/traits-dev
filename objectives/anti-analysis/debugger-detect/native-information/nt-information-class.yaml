# Native debugger operations described in Microsoft's NeedyMantis analysis.
# Match the information class at argument 1 of an actual Nt/Zw API call;
# API declarations, resolver strings, and constants elsewhere are insufficient.
defaults:
  for: [c, cpp, csharp, rust, go, python, powershell, javascript, typescript]
  platforms: [windows]
  crit: suspicious
  conf: 0.97
  attack: T1622
  mbc: B0001

traits:
  - id: process-debug-flags-numeric-call
    desc: Queries process debugger flags (class 31)
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)QueryInformationProcess$'
      arg:
        index: 1
        kind: number
        value: 31

  - id: process-debug-flags-named-call
    desc: Queries ProcessDebugFlags by name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)QueryInformationProcess$'
      arg:
        index: 1
        kind: identifier
        name: ProcessDebugFlags

  - id: thread-hide-debugger-numeric-call
    desc: Hides thread from debugger (class 17)
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)SetInformationThread$'
      arg:
        index: 1
        kind: number
        value: 17

  - id: thread-hide-debugger-named-call
    desc: Requests ThreadHideFromDebugger by name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)SetInformationThread$'
      arg:
        index: 1
        kind: identifier
        name: ThreadHideFromDebugger
