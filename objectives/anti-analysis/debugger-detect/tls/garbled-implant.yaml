defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: garbled-tls-anti-debug-implant
    desc: Garble-obfuscated implant using TLS callbacks for anti-debugging
    crit: hostile
    conf: 0.97
    attack: T1622
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: objectives/anti-analysis/debugger-detect/tls::tls-callbacks-multiple
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/reference::xor-string-transform-clues
      - id: micro-behaviors/data/format/executable/header::x86-mz-pe-signature-check
