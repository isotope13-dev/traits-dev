defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1055.012
traits:
  - id: tls-dyn-init-callback-symbol
    desc: TLS callback runs before main()
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: __dyn_tls_init_callback
  - id: tls-callback-anti-debug
    desc: Anti-debug check via TLS callback
    crit: suspicious
    conf: 0.9
    size_max: 5242880
    if:
      type: text
      regex: \bTlsCallback.{0,100}IsDebuggerPresent
      case_insensitive: true
  - id: nttraceevent-reference
    desc: NtTraceEvent API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: NtTraceEvent
composite_rules:
  - id: tls-memory-loader-anti-debug
    desc: Multi-TLS executable-memory loader with anti-debugging
    crit: hostile
    conf: 0.98
    attack: "T1027.002,T1497.003,T1622"
    all:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
    unless:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/installer/product/
  - id: multi-tls-debugger-thread-control-loader
    desc: Multi-TLS PE with anti-debug and thread-control imports
    crit: hostile
    conf: 0.99
    attack: T1622,T1055,T1027
    all:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
    unless:
      - id: metadata/installer/product/
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: metadata/lang/compiler/native::mingw-winpthreads-library
  - id: tls-anti-debug
    desc: TLS callback with anti-debugging
    crit: hostile
    conf: 0.95
    attack: T1622
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-text-reference
    any:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/process/debug/detect::check-remote-debugger
      - id: micro-behaviors/process/info/query::nt-query-information-process-text
    downgrade:
      any:
        - id: micro-behaviors/fs/file/section::pe-loader-tool
        - id: well-known/app/system/tls-callback-demo::tls-callback-demo-pdb
        - id: micro-behaviors/fs/file/section::pe-viewer-machine-types
  - id: tls-callback-present
    desc: PE uses TLS callbacks
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: metadata/binary/layout/tls::pe-tls-callback-text-reference
      - id: metadata/binary/layout/tls::tls-callback-array-reference
      - id: tls-dyn-init-callback-symbol
      - id: metadata/binary/layout/tls::pe-tls-callback-table
    downgrade:
      any:
        - id: metadata/lang/compiler/native/
        - id: metadata/binary/debug::pe-dwarf-debug-section
  - id: tls-nttraceevent-packed-dll
    desc: TLS-capable packed DLL references NtTraceEvent
    crit: hostile
    conf: 0.95
    attack: T1622
    all:
      - id: metadata/binary/section/label/conventional::pe-tls-section
      - id: nttraceevent-reference
      - id: metadata/binary/section/ratio::large-reloc-section
      - id: metadata/binary/symbols/count::minimal-exports
    any:
      - id: metadata/binary/layout/overlay::low-entropy-large-overlay
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/installer/product/
  - id: tls-callbacks-with-ntquery
    desc: TLS callbacks and process-query API reference
    crit: notable
    conf: 0.9
    attack: T1622
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: micro-behaviors/process/info/query::nt-query-information-process-text
    any:
      - id: metadata/binary/layout/tls::pe-tls-callback-text-reference
      - id: metadata/binary/layout/tls::tls-callback-array-reference

  - id: tls-callback-debugger-api-pair
    desc: TLS callbacks and debugger API references
    crit: notable
    conf: 0.95
    attack: T1622
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: micro-behaviors/process/debug/detect::check-remote-debugger

  - id: tls-tool-catalog-overlay-evasion
    desc: TLS debugger checks with analyst-tool catalog and dominant overlay
    crit: hostile
    conf: 0.98
    attack: "T1497,T1622,T1027"
    all:
      - id: tls-callback-debugger-api-pair
      - id: micro-behaviors/os/application/target/security::process-enumeration-beside-analysis-tool-catalogs
      - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: garbled-tls-environment-probe
    desc: Garbled PE combines TLS callbacks with environment probes
    crit: hostile
    conf: 0.98
    attack: "T1027,T1497.001,T1622"
    mbc: "B0032,B0007"
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
      - id: micro-behaviors/time/query::query-performance-frequency
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: invalid-signed-tls-context-overlay-loader
    desc: Invalid-signed multi-TLS PE with thread-context overlay staging
    crit: hostile
    conf: 0.99
    attack: "T1027,T1055,T1553.002,T1622"
    all:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
    unless:
      - id: metadata/installer/product/
  - id: tls-flattened-anti-debug-loader
    desc: Flattened TLS dispatch combines debugger detection and termination
    crit: hostile
    conf: 0.98
    attack: "T1027,T1622"
    all:
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
      - id: micro-behaviors/process/debug/detect::is-debugger-present-any
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
