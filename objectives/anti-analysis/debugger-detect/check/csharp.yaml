# C# debugger detection via NtQueryInformationProcess P/Invoke
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1106"
  mbc: "B0001"
traits:
  - id: ntquery-pinvoke
    desc: NtQueryInformationProcess P/Invoke declaration
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: NtQueryInformationProcess
  - id: process-debug-port
    desc: ProcessDebugPort anti-debug check (class 7)
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'NtQueryInformationProcess\s*\([^)]{0,50},\s*7\s*,'
  - id: entrypoint-invoke-crash
    desc: EntryPoint.Invoke anti-tamper crash
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "Assembly.EntryPoint.Invoke(null, null)"
  - id: public-key-tamper-check
    desc: Assembly public key tamper validation
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: "GetEntryAssembly().GetName().GetPublicKey()"
composite_rules:
  - id: ntquery-anti-debug
    desc: NtQueryInformationProcess anti-debug with crash
    crit: hostile
    conf: 0.97
    all:
      - id: ntquery-pinvoke
      - id: entrypoint-invoke-crash
    any:
      - id: process-debug-port
      - id: public-key-tamper-check
  - id: managed-pe-anti-debug-loader
    desc: Unsigned managed PE combines debugger probes with opaque code
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    attack: T1622,T1027,T1036.005
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present
      - id: micro-behaviors/os/syscall/raw::nt-query-info-ssn
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
    any:
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe
      - id: metadata/build/manifest::pe-manifest-myapplication-template
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/reverse-engineering/
