defaults:
  platforms: [ios]
  for: [javascript, typescript]
  attack: T1622

traits:
  - id: react-native-debugger-port-check
    desc: Local inspector port reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'localhost:\$\{REMOTE_DEBUGGER_PORT\}|localhost:\$\{INSPECTOR_PORT\}'

composite_rules:
  - id: react-native-ios-debugger-detect
    desc: React Native settings and local inspector port references
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/debug/detect::react-native-devsettings-reference
      - id: react-native-debugger-port-check
