defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: go-native-debugger-query-branch
  desc: Go debugger query with checked native result
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/symbols/name::go-main-debugger-check-name
  - id: micro-behaviors/process/debug/detect::is-debugger-present-string
  - id: metadata/binary/instruction::x64-zero-argument-call-result-branch
  attack: T1622
