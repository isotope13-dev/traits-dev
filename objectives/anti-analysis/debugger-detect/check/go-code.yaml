defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: go-native-debugger-query-branch
  desc: Go debugger query with checked native result
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/anti-analysis/debugger-detect/routine-name::go-main-debugger-check-name
  - id: micro-behaviors/process/debug/detect::is-debugger-present-string
