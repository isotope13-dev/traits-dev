defaults:
  platforms: [windows]
  for: [pe]
  attack: T1622
  mbc: B0001

composite_rules:
  - id: debugger-gated-elevated-remote-loader
    desc: Debugger-gated elevated WinHTTP temporary module loader
    crit: hostile
    conf: 0.99
    attack: T1105,T1129,T1622
    all:
      - id: resource-loader-debugger-gate
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
      - id: metadata/build/manifest::pe-requires-admin
    any:
      - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
      - id: micro-behaviors/os/module/load::get-proc-address-import
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/

  - id: resource-loader-debugger-gate
    desc: Resource access with debugger and exception APIs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-load-lock-chain
    any:
      - id: micro-behaviors/time/timing/delay::query-performance-counter
      - id: micro-behaviors/os/exception/handler::capture-context
      - id: objectives/anti-static/obfuscation/imports::peb-access-x64
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: metadata/binary/framework/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/package/testing/presence/fixture/
      - id: well-known/tool/sysadmin/console::microsoft-openconsole-host
      - id: well-known/app/utility/glary-utilities/
      - id: well-known/app/media/camtasia::camtasia-known-app-context
