defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: winsock-debugger-temp-process-profile
  desc: Debugger check with Winsock/TEMP process clues
  crit: suspicious
  conf: 0.95
  size_max: 262144
  all:
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop
  - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
