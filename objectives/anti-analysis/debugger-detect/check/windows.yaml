defaults:
  attack: T1622
  mbc: B0001
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: notable
  conf: 0.95
traits:
  - id: reversed-isdebuggerpresent
    desc: Reversed IsDebuggerPresent API string
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: tneserPreggubeDsi
  - id: reversed-checkremotedebuggerpresent
    desc: Reversed CheckRemoteDebuggerPresent string
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: tneserPreggubeDetomeRkcehC
  - id: reversed-sleepex
    desc: Reversed SleepEx API string
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: xEpeelS
composite_rules:
  - id: is-debugger-present-symbol
    desc: IsDebuggerPresent API is concealed with its reversed spelling
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: reversed-isdebuggerpresent

  - id: debugger-gated-masqueraded-watchdog
    desc: Debugger-gated masqueraded watchdog launcher
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/debug/detect::debugger-termination-api-references
      - id: objectives/evasion/masquerade/path::microsoft-windows-programdata-executable
      - id: micro-behaviors/process/create/spawn::create-process-w
  - id: dotnet-reversed-debugger-checks
    desc: .NET reversed debugger detection APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: reversed-isdebuggerpresent
    any:
      - id: reversed-checkremotedebuggerpresent
      - id: reversed-sleepex
  - id: anti-debug-api-pair
    desc: Anti-debug API pair present
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/process/debug/event::output-debug-string
    unless:
      # Chromium calls IsDebuggerPresent and OutputDebugString as the
      # browser engine, not as an anti-analysis packer.
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
      # kernel32/KernelBase implement both APIs as the OS provider.
      - id: metadata/lang/upstream::windows-system-implementer-dll
      - id: metadata/build/generated::winmd-metadata
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/lang/compiler/native::msvcrt
        - id: metadata/binary/symbols/count::many-imports
        - id: metadata/signed/platform/
        - id: metadata/build/manifest::pe-has-manifest
  - id: anti-debugged-embedded-network-loader
    desc: Anti-debugged embedded network loader
    crit: hostile
    conf: 0.98
    attack: T1105,T1129,T1562.001
    size_max: 1048576
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-names-with-export-lookup
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/

  - id: debugger-gated-elevated-logon-persistence
    desc: Unsigned PE combines anti-debugging with elevated logon persistence
    crit: hostile
    conf: 0.98
    attack: T1622,T1053.005,T1036.005
    mbc: B0001,F0012
    for: [pe]
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/autorun/control::windows-schtasks-onlogon-highest
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
    unless:
      - id: metadata/signed/platform/
  - id: msi-embedded-anti-analysis-loader
    desc: MSI elevates an opaque payload with process-inspection APIs
    crit: hostile
    conf: 0.99
    attack: T1622,T1055,T1548.002
    # MSI is a first-class file type; keep this composite on the installer.
    for: [oledoc, pe]
    scope: outer
    all:
      - id: metadata/package/files/msi::msi-advanced-installer-asadmin-action
      - id: metadata/package/files/msi::msi-opaque-stream-cluster
      - id: metadata/package/files/msi::msi-single-token-subject
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/query::nt-query-information-process-text
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
    unless:
      # Cloud Drive Mapper's Advanced Installer helpers legitimately inspect
      # processes and privileges while installing the product.
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context
  - id: msi-anti-analysis-service-loader
    desc: MSI elevates an opaque payload while controlling services
    crit: hostile
    conf: 0.99
    attack: T1057,T1543.003,T1622,T1055
    for: [oledoc, pe]
    scope: outer
    all:
      - id: metadata/package/files/msi::msi-advanced-installer-asadmin-action
      - id: metadata/package/files/msi::msi-opaque-stream-cluster
      - id: metadata/package/files/msi::msi-single-token-subject
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/query::nt-query-information-process-text
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
      - id: micro-behaviors/os/service/start::start-service
    unless:
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context
