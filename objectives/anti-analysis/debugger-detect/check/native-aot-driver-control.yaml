defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1562.001,T1622

composite_rules:
  - id: anti-debug-driver-antivirus-control
    desc: Anti-debugging with driver-backed antivirus process control
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/anti-av/driver::driver-backed-antivirus-process-control
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/development/
