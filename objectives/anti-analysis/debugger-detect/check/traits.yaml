defaults:
  attack: T1622
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries]
traits:
- id: ptrace-traceme
  desc: PTRACE_TRACEME constant
  crit: suspicious
  mbc: B0001.m01
  conf: 0.7
  if:
    type: string_literal
    substr: PTRACE_TRACEME
  unless:
  # pwntools ships syscall tables and shellcraft templates as reference data.
  - id: well-known/tool/offensive/pwntools::pwntools-distribution
  - id: well-known/app/utility/cmdchamp/
  - id: metadata/file/catalog/identity::linux-ptrace-system-header
  platforms:
  - linux
  - macos
- id: pt-deny-attach
  desc: PT_DENY_ATTACH constant
  crit: suspicious
  mbc: B0001.m01
  conf: 0.7
  if:
    type: string_literal
    substr: PT_DENY_ATTACH
  unless:
  - id: well-known/app/ai/coding-agent/localcode::localcode-ai-coding-assistant
  - id: well-known/app/ai/coding-agent/localcode::debugger-hardening-entrypoint
  platforms:
  - macos
- id: tracerpid-string
  desc: TracerPid string (debugger detection)
  crit: component
  conf: 0.7
  # for: kept disjoint from the native (kernel::ptrace-debugger → elf/c/python)
  # and JVM (java-tracerpid-check → class/jar/java) TracerPid atoms so the same
  # substring isn't a duplicate-overlapping atom across tiers.
  for: [javascript, lua, perl, php, ruby, shell]
  if:
    type: text
    substr: TracerPid
  platforms:
  - linux
- id: dotnet-runtime-debug-helper
  for: [elf, so]
  desc: Dotnet runtime debugger helper library
  crit: notable
  conf: 0.95
  if:
    type: path
    basename: true
    # dbgshim/mscordbi ship beside CoreCLR in VSDBG and read TracerPid as
    # part of normal debugger attach — not malware anti-analysis.
    regex: '^lib(coreclr|clrjit|mscordaccore|dbgshim|mscordbi)\.so$'
- id: dotnet-runtime-debug-helper-marker
  desc: Dotnet runtime debugger helper marker
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: libmscordaccore.so
- id: python-trace-check-abort
  desc: Python debugger check abort branch
  crit: suspicious
  conf: 0.96
  for: [python]
  if:
    type: tree-sitter
    language: python
    query: |
      (if_statement
        condition: (_) @condition
        consequence: (_) @body
        (#match? @condition "get[_]?trace|f_trace")
        (#match? @body "_crash|os\\._exit|sys\\.exit|SystemExit"))
  unless:
    - id: metadata/build/scaffold::python-unrendered-bootloader-template
composite_rules:
- id: overlay-debugger-process-launcher
  desc: Overlay loader checks debugger before process launch
  crit: hostile
  conf: 0.97
  attack: T1057,T1497.001
  all:
  - id: objectives/anti-static/obfuscation/payload/self-read::pe-overlay-self-extractor
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
  - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
  - id: objectives/anti-static/obfuscation/decoders::xor-decoded-memory-write-or-protect-api
- id: process-inspection
  desc: Direct ptrace anti-debug request
  crit: suspicious
  conf: 0.75
  mbc: B0001
  platforms:
  - linux
  all:
  - id: micro-behaviors/os/syscall/invoke::ptrace-dup
  - id: ptrace-traceme-or-deny
  unless:
  - id: well-known/tool/reverse-engineering/frida/
  - id: well-known/tool/reverse-engineering/dotnet-debugger::remote-coreclr-debugger-runtime
  - id: micro-behaviors/fs/proc/info/path::process-self-status
  - id: micro-behaviors/fs/proc/info/path::process-self-maps
  - id: tracerpid-string
  - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
  - id: well-known/lib/native/glibc::libc-runtime
  # The musl dynamic loader exports a ptrace syscall wrapper as part of its
  # libc ABI.  The loader is a runtime component, not an anti-debugger.
  - id: metadata/binary/linking/runtime::musl-loader-basename
- id: ptrace-traceme-or-deny
  desc: PTRACE_TRACEME or PT_DENY_ATTACH anti-debugging constants
  crit: suspicious
  mbc: B0001.m01
  conf: 0.8
  any:
  - id: ptrace-traceme
  - id: pt-deny-attach
  unless:
  - id: metadata/signed/platform::apple
  - id: metadata/file/catalog/identity::linux-ptrace-system-header
- id: win-debugger-detect
  desc: Windows debugger detection API usage
  crit: notable
  mbc: B0001
  conf: 0.9
  platforms:
  - windows
  size_min: 20000
  size_max: 2000000
  needs: 2
  any:
  - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  - id: micro-behaviors/process/debug/detect::check-remote-debugger
  - id: micro-behaviors/os/syscall/raw::nt-query-info-ssn
- id: anti-debug-full
  desc: Multiple anti-debugging techniques
  crit: suspicious
  mbc: B0001
  conf: 0.85
  needs: 2
  any:
  - id: ptrace-traceme-or-deny
  - id: process-inspection
  - id: win-debugger-detect
  - id: micro-behaviors/os/linker/env::ld-debug
  unless:
  - id: metadata/binary/framework/
  - id: dotnet-runtime-debug-helper
  - id: dotnet-runtime-debug-helper-marker
  - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
  - id: well-known/lib/runtime/electron/
- id: anti-debug-obfuscation-memory-protection
  desc: Direct ptrace with string obfuscation and memory protection
  crit: hostile
  conf: 0.85
  attack: T1027
  mbc: B0001
  platforms: [linux, macos]
  for: [elf, macho, so, dylib]
  all:
  - id: process-inspection
  - id: objectives/anti-static/obfuscation/string/
  - id: micro-behaviors/mem/protect/modify::mprotect-import
  unless:
  - id: well-known/app/system/drivers/
  - id: well-known/lib/runtime/nvidia-cudnn/
  - id: well-known/lib/format/deb-package/
  - id: well-known/tool/reverse-engineering/frida/
  - id: well-known/tool/reverse-engineering/dotnet-debugger::remote-coreclr-debugger-runtime
  - id: metadata/binary/framework::dotnet-ilasm-coreclr-binary
  - id: metadata/file/string/identity::chrome-crashpad-handler-basename

- id: python-multi-platform-anti-debug-abort
  desc: Python multi-platform debugger abort
  crit: hostile
  conf: 0.99
  attack: T1622,T1497.001
  for: [python]
  all:
    - id: micro-behaviors/process/debug/detect::python-runtime-trace-query
    - id: python-trace-check-abort
  any:
    - id: proc-tracerpid-source
    - id: micro-behaviors/process/debug/detect::is-debugger-present-python-text
  needs: 1
  near_lines: 180
  unless:
    - id: metadata/build/scaffold::python-unrendered-bootloader-template
