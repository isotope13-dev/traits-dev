# Browser anti-debugging that targets DevTools rather than a native debugger.
# javascript-obfuscator ships these as its `debugProtection` preset, and
# hand-rolled phishing pages reuse the same primitives: probe the viewport for
# a docked DevTools pane, build a `debugger` statement through the Function
# constructor so the keyword never appears as a statement, and park that
# statement in a loop the inspector cannot step out of.
#
# Every matcher keys on the JavaScript construct, never on wording, so the
# rules survive renaming and minification. They stay `suspicious` on their own
# -- a handful of DRM and anti-tamper products ship the same code -- and the
# composite below is what stronger rules reference for "this file actively
# obstructs inspection".
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1622
  mbc: B0001
traits:
  # `window.outerWidth - window.innerWidth > 160` is the docked-DevTools
  # heuristic: an open inspector pane steals viewport width (or height) from
  # the document while the outer window keeps its size. Requiring a
  # two-or-more digit pixel constant on the right separates it from ordinary
  # responsive-layout arithmetic, which compares against element sizes and
  # variables rather than a bare threshold.
  - id: js-devtools-viewport-delta-probe
    desc: Detects open DevTools by viewport delta
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'outer(Width|Height)[^;{}\n]{0,60}inner(Width|Height)\W{0,4}>=?\s*\d{2,4}'
  # The same probe written with the comparison mirrored:
  # `if (360 < window.outerHeight - window.innerHeight)`. Minifiers and
  # hand-written DRM both emit the constant-first form freely, and the rule
  # above anchors on `inner… > N`, so the mirrored spelling walks past it.
  # Same two-or-more-digit threshold requirement, for the same reason.
  - id: js-devtools-viewport-delta-probe-reversed
    desc: Detects DevTools by reversed viewport delta
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\d{2,4}\s*<=?[^;{}\n]{0,60}outer(Width|Height)[^;{}\n]{0,20}inner(Width|Height)'
  # `Function("debugger")` / `new Function('debugger')` -- the keyword lives in
  # a string, so the token never appears as a statement for a scanner or a
  # source map to find. Sibling rules in this directory already cover the
  # `.constructor('debugger')()` and `['constructor']('debugger')()` spellings;
  # this is the bare Function-constructor form javascript-obfuscator emits.
  - id: js-function-constructor-debugger
    desc: Function constructor built from debugger string
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(^|[^.\w])(new\s+)?Function\s*\(\s*[''"]debugger[''"]\s*\)'
  # A `debugger` statement whose enclosing loop never terminates. Stepping past
  # it re-enters it, which is the whole point: the analyst's inspector is
  # pinned. A debug-build breakpoint is a bare statement, not one welded into
  # an endless loop. Split by loop spelling to keep each pattern short.
  - id: js-debugger-in-while-true-loop
    desc: Debugger statement pinned in while-true loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'while\s*\(\s*(true|!!\[\])\s*\)\s*\{?\s*debugger\s*[;}]'
  - id: js-debugger-in-endless-for-loop
    desc: Debugger statement pinned in endless for loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'for\s*\(\s*;\s*;\s*\)\s*\{?\s*debugger\s*[;}]'
  # A bare `debugger` statement outside any of the loop/function-constructor
  # shapes above. One is a forgotten dev breakpoint; several are execution
  # gates -- the statement pauses an attached inspector wherever it sits, so
  # scattering them through decoded logic is how an injected payload keeps an
  # analyst from stepping it. Kept `notable`: the hostile verdict comes from
  # what the gates protect (see the string-table composites that reference
  # this), not from the statement alone.
  - id: js-debugger-statement
    desc: Bare debugger statement in script
    crit: notable
    conf: 0.85
    count_min: 2
    if:
      type: text
      regex: '[{;}]\s*debugger\s*;'
composite_rules:
  # The fact other rules want to reference: this file does not merely detect an
  # analyst, it obstructs one. Kept `suspicious` because commercial anti-tamper
  # ships the same primitives; the intent tier comes from what the obstruction
  # is wrapped around (see the obfuscator composites that reference this).
  - id: js-browser-debug-protection
    desc: Browser script obstructs DevTools inspection
    crit: suspicious
    conf: 0.92
    any:
      - id: js-devtools-viewport-delta-probe
      - id: js-devtools-viewport-delta-probe-reversed
      - id: js-function-constructor-debugger
      - id: js-debugger-in-while-true-loop
      - id: js-debugger-in-endless-for-loop
      - id: js-constructor-debugger-call
      - id: js-constructor-debugger-direct

# A wallet-signing flow that consults a devtools oracle before it runs. A
# debugging-extension build has legitimate reasons to detect devtools; a
# crypto wallet bundle does not -- the oracle is a go/no-go gate that keeps
# the drainer dark while someone with a console is watching.
#
# Worked example: the trojanized lottie-player bundle, whose obfuscated
# wallet-signing flow checks a devtools getter oracle first.
  - id: devtools-gated-wallet-drainer
    desc: Wallet flow gated on devtools detection
    crit: hostile
    conf: 0.96
    attack: T1637,T1027
    all:
      - id: js-devtools-getter-oracle
      - id: micro-behaviors/communications/ipc/rpc::wallet-provider-full-signing-flow

# Detection that does not merely notice an analyst but destroys the page in
# front of them. A probe answers a question; wiping `document.body` is the
# response, and it is the response that separates a diagnostics build from an
# artifact that refuses to be read. Commercial DRM does exactly this -- the
# worked example is an obfuscated Gantt library that replaces the host
# application's entire DOM with a licence notice when it thinks an inspector is
# open -- so the rule stays `suspicious` and describes the behaviour rather than
# assuming malice. It is the "obstruction with teeth" tier the probe rules alone
# cannot express.
  - id: js-devtools-detection-wipes-document-body
    desc: DevTools detection wipes the host page body
    crit: suspicious
    conf: 0.9
    all:
      - id: js-browser-debug-protection
      - id: micro-behaviors/ui/window/manage/dom::browser-innerhtml-assignment
