defaults:
  platforms: [unix]
  for: [c, cpp, elf]
  attack: T1622

traits:
  - id: source-tracerpid-nonzero-decision
    desc: Nonzero TracerPid debugger decision
    crit: notable
    conf: 0.9
    for: [c, cpp, go, rust]
    if:
      type: text
      regex: '(?is)TracerPid.{0,500}\btracer_?pid\s*(!=|>)\s*0\b'

composite_rules:
  - id: unix-source-tracerpid-debugger-check
    desc: Unix source TracerPid debugger check
    crit: notable
    conf: 0.95
    for: [c, cpp, go, rust]
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: micro-behaviors/fs/proc/info/path::process-self-status
      - id: source-tracerpid-nonzero-decision
