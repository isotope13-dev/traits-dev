defaults:
  platforms: [unix]
  for: [c, cpp, elf]
  attack: T1622

traits:
  - id: source-tracerpid-nonzero-decision
    desc: Nonzero TracerPid debugger decision
    crit: notable
    conf: 0.9
    for: [c, cpp, go, rust]
    if:
      type: text
      regex: '(?is)TracerPid.{0,500}\btracer_?pid\s*(!=|>)\s*0\b'

composite_rules:
  - id: unix-tracerpid-safe-context
    desc: Known runtime or analysis tracer context
    crit: exception
    conf: 0.99
    for: [elf]
    any:
      - id: well-known/app/system/drivers/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/lib/media/sharp-libvips/
      - id: well-known/lib/observability/telemetry/
      - id: well-known/tool/development/vscode-extension/vsce-sign/
      - id: well-known/app/communication/thunderbird/
      - id: objectives/anti-analysis/debugger-detect/check::dotnet-runtime-debug-helper
      # A single-file .NET apphost embeds CoreCLR's debugger helper strings and
      # its normal TracerPid support; this is runtime implementation, not an
      # anti-analysis decision by the application.
      - id: objectives/anti-analysis/debugger-detect/check::dotnet-runtime-debug-helper-marker
      # A self-contained Linux publish embeds CoreCLR into the application
      # binary; its native runtime performs the same TracerPid probe. Directory
      # reference (not the leaf composite) to keep the suppression budget flat.
      - id: well-known/lib/runtime/managed/dotnet-runtime/

      - id: well-known/lib/runtime/scripted/php-runtime
      - id: well-known/lib/cloud/aws-crt::node-native-addon-path
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-dart-sdk-package
      - id: well-known/app/ai/assistant/ensu/
      - id: well-known/lib/ai/ggml/
      - id: well-known/lib/runtime/native-platform/glib/
      # node-webrtc embeds Chromium's diagnostic stack-trace implementation,
      # which reads TracerPid to annotate crashes rather than evade analysis.
      - id: well-known/lib/network/node-webrtc/
      # Dart's native VM reads TracerPid for its debugger/observatory support;
      # an application compiled with that runtime did not add an evasion check.
      - id: metadata/lang/compiled::dart-native-vm-runtime
  - id: unix-tracerpid-debugger-check
    desc: Unix ELF TracerPid debugger check
    crit: suspicious
    conf: 0.95
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: micro-behaviors/fs/proc/info/path::process-self-status
    unless:
      - id: well-known/lib/platform/wine/
      - id: unix-tracerpid-safe-context
      - id: well-known/lib/development/sorbet-static/
      - id: well-known/tool/development/build/dartsass/
      # Anti-debugging is a documented PyArmor feature, implemented in the
      # runtime the product ships.
      - id: well-known/dual-use/packaging/pyarmor/
      # libsscronet.so is ByteDance's cronet build. Its TracerPid read is
      # Chromium's debugger_posix helper, next to the HTTP status strings.
      - id: well-known/lib/network/sscronet/
      # qemu-user-static reads TracerPid while emulating a guest process.
      - id: well-known/tool/development/runtime/qemu/
  - id: unix-source-tracerpid-debugger-check
    desc: Unix source TracerPid debugger check
    crit: suspicious
    conf: 0.95
    for: [c, cpp, go, rust]
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: micro-behaviors/fs/proc/info/path::process-self-status
      - id: source-tracerpid-nonzero-decision
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: metadata/package/files/dependency::native-vendor-dependency-path
      - id: objectives/anti-analysis/debugger-detect/check::unix-source-tracerpid-safe-contexts
      - id: well-known/lib/runtime/scripted/php-runtime::php-source-tracerpid-diagnostic-context
      - id: metadata/package/testing/presence/harness::c-source-test-directory
      - id: well-known/lib/runtime/scripted/v8::isolate-debugger-attached-fn
      - id: well-known/lib/testing/acutest/
      # Delve exposes debugger-presence helpers for applications that need to
      # wait for a developer to attach; this is debugger support, not evasion.
