defaults:
  platforms: [unix]
  for: [c, cpp, elf]
  attack: T1622

composite_rules:
  - id: unix-tracerpid-safe-context
    desc: Known runtime or analysis tracer context
    crit: exception
    conf: 0.99
    for: [elf]
    any:
      - id: well-known/app/system/drivers/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/lib/media/sharp-libvips/
      - id: well-known/tool/reverse-engineering/renderdoc/
      - id: metadata/library/observability::php-ddtrace-extension
      - id: well-known/tool/development/vscode/vsce-sign::vscode-vsce-sign-tool
      - id: well-known/app/communication/thunderbird::firefox-mozinference-library
      - id: objectives/anti-analysis/debugger-detect/check::dotnet-runtime-debug-helper
      # A single-file .NET apphost embeds CoreCLR's debugger helper strings and
      # its normal TracerPid support; this is runtime implementation, not an
      # anti-analysis decision by the application.
      - id: objectives/anti-analysis/debugger-detect/check::dotnet-runtime-debug-helper-marker
      - id: well-known/lib/runtime/dotnet-runtime::minipal-native-debugger-api
      - id: well-known/tool/reverse-engineering/dotnet-debugger::vsdbg-native-so-basename

      - id: well-known/lib/runtime/php-runtime
      - id: well-known/lib/cloud/aws-crt::node-native-addon-path
      - id: well-known/tool/sysadmin/alpine-packages::alpine-dart-sdk-package
      - id: well-known/app/ai/assistant/ensu::ensu-desktop-application
      - id: well-known/lib/ai/ggml/
      # node-webrtc embeds Chromium's diagnostic stack-trace implementation,
      # which reads TracerPid to annotate crashes rather than evade analysis.
      - id: well-known/lib/network/node-webrtc/
  - id: unix-tracerpid-debugger-check
    desc: Unix ELF TracerPid debugger check
    crit: suspicious
    conf: 0.95
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: micro-behaviors/fs/proc/info/path::process-self-status
    unless:
      - id: unix-tracerpid-safe-context
      - id: well-known/lib/development/sorbet-static::sorbet-static-typechecker-context
      - id: well-known/tool/development/dartsass::dartsass-compiler-binary-path
      # Anti-debugging is a documented PyArmor feature, implemented in the
      # runtime the product ships.
      - id: well-known/dual-use/packaging/pyarmor/
  - id: unix-source-tracerpid-debugger-check
    desc: Unix source TracerPid debugger check
    crit: suspicious
    conf: 0.95
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: micro-behaviors/fs/proc/info/path::process-self-status
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: metadata/package/files/dependency::native-vendor-dependency-path
      - id: objectives/anti-analysis/debugger-detect/check::unix-source-tracerpid-safe-contexts
      - id: well-known/lib/runtime/php-runtime::php-source-tracerpid-diagnostic-context
      - id: metadata/package/testing/presence/harness::c-source-test-directory
      - id: well-known/lib/runtime/v8::isolate-debugger-attached-fn
      - id: well-known/lib/development/acutest::nng-fork-source-context
