# IsDebuggerPresent followed by an unconditional hang — freezes analysis
# instead of quietly exiting.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1622
  mbc: B0001

traits:
  - id: debugger-present-hang-loop
    desc: Debugger check then hang loop
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)IsDebuggerPresent\s*\(\s*\)[\s\S]{0,80}while\s*\(\s*1\s*\)'
