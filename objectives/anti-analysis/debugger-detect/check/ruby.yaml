defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1622
  mbc: B0001

traits:
  - id: ruby-debug-env-keys
    desc: Ruby debug env key list
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'RUBY_DEBUG[\s\S]{0,120}RUBY_DEBUG_PORT[\s\S]{0,120}DEBUGGER'
  - id: ruby-debug-gem-probes
    desc: Ruby optional debug gem probe
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(byebug|pry|debug)[\s\S]{0,240}(LoadError|Gem::LoadError)'
  # The bare `defined?(Byebug)` probe moved to
  # micro-behaviors/process/debug/detect::ruby-debugger-constant-defined-check:
  # the matcher only detects "asks whether a debugger is loaded", which is how
  # debugger-aware test libraries integrate with one. The self-decoder
  # composite below references it and supplies the evasive intent.
  - id: ruby-timed-math-loop
    desc: Ruby times a repeated math loop
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b\d+\.times\s*\{[^}]{0,80}Math\.(sqrt|sin|cos)'
  - id: ruby-timing-threshold-check
    desc: Ruby compares elapsed time to threshold
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'Time\.now\s*-\s*[A-Za-z_]\w*\)?\s*(>|>=)\s*0\.\d+'

composite_rules:
  - id: ruby-debugger-env-with-gem-probe
    desc: Ruby debugger env plus gem probe
    crit: suspicious
    conf: 0.94
    near_bytes: 512
    all:
      - id: ruby-debug-env-keys
      - id: ruby-debug-gem-probes
  - id: ruby-analysis-timing-check
    desc: Ruby times execution for analysis detection
    crit: suspicious
    conf: 0.94
    near_bytes: 512
    all:
      - id: ruby-timed-math-loop
      - id: ruby-timing-threshold-check
  - id: ruby-anti-analysis-self-decoder
    desc: Ruby anti-analysis wrapper around decoded eval
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1622
    mbc: B0001,B0032
    all:
      - id: micro-behaviors/process/debug/detect::ruby-debugger-constant-defined-check
      - id: ruby-analysis-timing-check
      - id: objectives/anti-static/obfuscation/payload/encoded::ruby-eval-zlib-base64-decode
    unless:
      - id: metadata/package/testing/
