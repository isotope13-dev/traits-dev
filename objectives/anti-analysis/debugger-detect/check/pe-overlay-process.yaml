defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: opaque-overlay-debugger-process-loader
    desc: Opaque overlay with anti-debug process loader
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1057,T1622,T1106
    all:
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::high-entropy-overlay
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/create/exec::shell-execute-ex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: well-known/tool/reverse-engineering/

  - id: opaque-overlay-debugger-api-loader
    desc: Opaque PE overlay with anti-debug and runtime mapper APIs
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1620,T1622
    all:
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/
      - id: well-known/lib/
      - id: objectives/evasion/anti-av/code-padding::native-rat-random-overlay-padding
