# Native watchdogs that terminate when debugger state or executable integrity
# changes. This is an anti-analysis capability; ransomware context is supplied
# by consumers under objectives/impact/ransom/.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1622
  mbc: B0001

traits:
  - id: debugger-text-integrity-watchdog
    desc: Debugger check with integrity watchdog
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      regex: '(?is)CheckRemoteDebuggerPresent.{0,240}crc32.{0,240}Sleep'
