# Anti-debug PEB access in C/C++ source (inline assembly)
# Detects manual PEB walking via FS segment register
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1622
  mbc: B0001
traits:
  - id: peb-fs-30h-source
    desc: PEB access via FS:[30h] in source
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'FS:\[0?x?30h?\]'
      case_insensitive: true
  - id: being-debugged-byte-source
    desc: PEB BeingDebugged byte compare
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(cmp|test)\s+byte\s+ptr\s*\[\s*eax\s*\+\s*(0x)?2\s*\]'
  - id: peb-size-of-image-inflate
    desc: PEB SizeOfImage inflation for anti-dump
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\[eax\s*\+\s*(0x)?20\].{0,50}0x2000'
composite_rules:
  - id: peb-debugger-check-source
    desc: PEB-based debugger detection in source
    crit: suspicious
    conf: 0.92
    all:
      - id: peb-fs-30h-source
    any:
      - id: micro-behaviors/os/sysinfo/process::teb-fs-18h-source
      - id: being-debugged-byte-source
  - id: anti-debug-forced-shutdown
    desc: Anti-debug with forced system shutdown
    crit: suspicious
    conf: 0.93
    all:
      - id: peb-debugger-check-source
      - id: micro-behaviors/ui/window/manage/control::exit-windows-ex
  # PEB->Ldr walk. Previously an ATOMIC trait matching the bare operand
  # `[eax+0Ch]`, which asserts PEB access the matcher never established: QEMU's
  # TCG exception trampoline builder (`// call [eax + 0xC]; get ptr to our
  # handler`) scored suspicious for anti-debug. The offset only means Ldr when
  # EAX holds the PEB, so require the FS:[30h] fetch alongside it.
  - id: peb-ldr-data-source
    desc: PEB_LDR_DATA access after FS:[30h] PEB fetch
    crit: suspicious
    conf: 0.88
    near_lines: 12
    all:
      - id: peb-fs-30h-source
      - id: micro-behaviors/os/sysinfo/process::struct-offset-0ch-load-source
    unless:
      - id: well-known/tool/sysadmin/chroot-win/
  # This composite is named for SizeOfImage inflation, so it must reference the
  # SizeOfImage atom — it referenced the Ldr offset instead, which left
  # peb-size-of-image-inflate wired to nothing at all.
  - id: anti-dump-peb-source
    desc: Anti-dump PEB SizeOfImage manipulation
    crit: suspicious
    conf: 0.90
    all:
      - id: peb-fs-30h-source
      - id: peb-size-of-image-inflate
