# Real-mode DOS divide-error trick. The stub installs an INT 0 handler straight
# into the IVT (PUSH imm16 / POP [0000] for the offset, MOV [0002],CS for the
# segment), then executes DIV with a zero divisor so control transfers through
# the fresh vector — typically into code that restores the IVT and continues
# decrypting. Tracers and emulators that do not faithfully deliver the hooked
# vector never reach the payload. No legitimate DOS program installs a
# divide-error handler only to divide by zero immediately.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1622

traits:
  - id: dos-int0-div-trigger
    desc: DOS hooks divide-error then divides
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "68 ?? ?? 8F 06 00 00 [0-4] 8C 0E 02 00 [0-4] F7 F0"

composite_rules:
  # The divide-error transfer exists to reach code the static image hides: the
  # handler falls through into a rolling-XOR decryptor whose output the virus
  # then executes.
  - id: dos-div0-guarded-decryptor
    desc: DOS divide-error trick guards decryptor
    crit: hostile
    conf: 0.93
    all:
      - id: dos-int0-div-trigger
      - id: objectives/anti-static/obfuscation/payload/polymorphic::dos-rolling-xor-loop
