defaults:
  platforms: [unix, windows]

composite_rules:
  - id: unix-source-tracerpid-safe-contexts
    desc: Recognized source contexts where a TracerPid check is diagnostic
    crit: exception
    conf: 0.99
    any:
      - id: well-known/lib/ai/ggml::ggml-inference-source
      - id: well-known/lib/media/sharp-libvips/
      # The parent rule already establishes TracerPid, so the recognized
      # c4core source-tree identity is sufficient and avoids re-expanding it.
      - id: well-known/lib/core/c4core/
      - id: well-known/app/infrastructure/pipewire::pipewire-source-tree
      # The single-header guard is a complete Catch2 source identity here; the
      # parent rule already establishes the debugger-check behavior.
      - id: metadata/package/testing/compiled::catch2-single-header-guard
      - id: well-known/tool/reverse-engineering/renderdoc/
      - id: well-known/lib/media/slangpy::slangpy-platform-source-context
      - id: well-known/lib/cloud/aws-lc::aws-lc-abi-unwind-test-context
      - id: well-known/lib/development/juce::juce-source-context
      # The distinctive framework banner is sufficient here because the
      # parent rule already establishes Doctest's TracerPid implementation.
      - id: well-known/lib/development/doctest::header-banner
      - id: well-known/lib/runtime/dotnet-runtime::minipal-debugger-source-context
      - id: well-known/game/pcsx2/
      - id: micro-behaviors/process/debug/control::crash-handler-paused-for-debugger-sigabrt
