defaults:
  platforms: [unix, windows]

composite_rules:
  - id: unix-source-tracerpid-safe-contexts
    desc: Recognized source contexts where a TracerPid check is diagnostic
    crit: exception
    conf: 0.99
    any:
      - id: well-known/lib/ai/ggml::ggml-inference-source
      - id: well-known/lib/media/sharp-libvips/
      - id: well-known/lib/core/c4core::debugger-helper-context
      - id: well-known/app/infrastructure/pipewire::pipewire-source-tree
      - id: metadata/package/testing/compiled::catch2
      - id: well-known/tool/reverse-engineering/renderdoc/
      - id: well-known/lib/media/slangpy::slangpy-platform-source-context
      - id: well-known/lib/cloud/aws-lc::aws-lc-abi-unwind-test-context
      - id: well-known/lib/development/juce::juce-source-context
