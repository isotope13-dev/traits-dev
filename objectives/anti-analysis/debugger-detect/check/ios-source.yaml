defaults:
  crit: suspicious
  platforms: [ios]
  for: [kotlin, rust, zig]
  attack: T1622

traits:
  # PT_ATTACHEXC is the Mach-exception ptrace request; on iOS the standard
  # jailbreak/anti-debug idiom is `ptrace(PT_DENY_ATTACH)` or a self-attach
  # with PT_ATTACHEXC to occupy the tracer slot. There is no ordinary
  # application reason for an app to name it.
  #
  # `tracerpid-status-field` used to sit in an `any:` composite named
  # `ios-ptrace-debugger-check` here. That read `/proc/self/status`, which
  # iOS does not have -- it is Linux procfs -- so the composite laundered a
  # Linux `notable` into an iOS `suspicious` with no added evidence, and fired
  # on every Rust crate that merely parses `TracerPid:`. Linux TracerPid
  # checks are already covered, with the required corroborating legs, by
  # `unix-native::unix-source-tracerpid-debugger-check` and
  # `unix-native::unix-tracerpid-debugger-check`.
  - id: ios-ptrace-attachexc-source
    desc: iOS ptrace attach-exception check
    conf: 0.94
    unless:
      - id: metadata/package/files/system-package::debian-missing-sources-vendored-crate
      - id: well-known/lib/platform/rust-system-bindings::rust-syscall-binding-crate
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
    if:
      type: text
      substr: PT_ATTACHEXC
