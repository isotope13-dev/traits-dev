defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  attack: T1622
traits:
  - id: x86-peb-being-debugged-byte-branch
    desc: Branches on PEB BeingDebugged byte
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '64 A1 30 00 00 00 80 78 02 00 (74|75|0F 84|0F 85)'
  - id: x86-peb-ntglobalflag-mask-branch
    desc: Branches on PEB debug heap flags
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '64 A1 30 00 00 00 F7 40 68 70 00 00 00 (74|75|0F 84|0F 85)'
  - id: x86-peb-debug-flags-conditional-gate
    desc: Branches on PEB debugger flags
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '64 A1 30 00 00 00 0F B6 40 02 85 C0 0F 85 [4] 64 A1 30 00 00 00 8B 40 68 83 E0 70 83 F8 70 (74|0F 84)'
