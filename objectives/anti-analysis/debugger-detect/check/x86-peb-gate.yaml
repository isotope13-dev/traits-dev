defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  attack: T1622
traits:
  - id: peb-being-debugged-byte-branch
    desc: Branches on PEB BeingDebugged byte
    arch: [x86, x86-64]
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '(64 A1 30 00 00 00 80 78 02 00 | 65 48 8B 04 25 60 00 00 00 40 38 70 02 | 65 48 8B 04 25 60 00 00 00 80 78 02 00) (74|75|0F 84|0F 85)'
    unless:
      - id: well-known/tool/sysadmin/autohotkey::autohotkey-official-interpreter
  - id: peb-ntglobalflag-mask-check
    desc: Checks PEB debug heap flags
    arch: [x86, x86-64]
    for: [pe, dll]
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: any
      # x86 branches on the mask; x64 returns a Boolean or branches after
      # an adjacent BeingDebugged check without overwriting the PEB pointer.
      pattern: '(64 A1 30 00 00 00 F7 40 68 70 00 00 00 74 | 64 A1 30 00 00 00 F7 40 68 70 00 00 00 75 | 64 A1 30 00 00 00 F7 40 68 70 00 00 00 0F 84 | 64 A1 30 00 00 00 F7 40 68 70 00 00 00 0F 85 | 65 48 8B 04 25 60 00 00 00 8B 88 BC 00 00 00 80 E1 70 F6 D9 1B FF 83 E7 02 | 65 48 8B 04 25 60 00 00 00 80 78 02 00 75 ?? F6 80 BC 00 00 00 70 75 | 65 48 8B 04 25 60 00 00 00 80 78 02 00 0F 85 [4] F6 80 BC 00 00 00 70 0F 85)'
  - id: x86-peb-debug-flags-conditional-gate
    desc: Branches on PEB debugger flags
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '64 A1 30 00 00 00 0F B6 40 02 85 C0 0F 85 [4] 64 A1 30 00 00 00 8B 40 68 83 E0 70 83 F8 70 (74|0F 84)'
