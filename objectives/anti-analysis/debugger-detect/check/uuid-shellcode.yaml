# UUID-string shellcode loaders paired with anti-debug / dynamic API resolve.
# Complements the encoding-tier memory loader; this rule captures the
# anti-analysis + GetProcAddress shape when VirtualAlloc RW resolution varies.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1622,T1620

composite_rules:
  - id: uuid-shellcode-antidebug-api-loader
    desc: UUID shellcode loader with anti-debug API resolve
    crit: hostile
    conf: 0.96
    attack: T1027,T1622,T1620,T1106
    all:
      - id: micro-behaviors/data/format/string::dense-uuid-hyphen-string-table
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/
