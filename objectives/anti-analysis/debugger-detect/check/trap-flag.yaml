# EFLAGS trap-flag debugger check in native x86 ELF binaries
# The re-read half of a trap-flag toggle (POPFD, PUSHFD, POP EAX, XOR EAX
# with the saved image, POPFD, TEST EAX against the 0x200000 trap bit):
# a set trap bit means a debugger single-stepped the toggle, revealing
# tracing (ATT&CK T1622). The TEST-immediate spelling is the discriminator;
# the stripped-binary leg keeps the composite scoped to packed payloads
# (loader feature probes with intact symbol tables stay out).
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  attack: T1622
traits:
  - id: eflags-trap-bit-reread-test
    desc: EFLAGS trap-bit re-read and test
    crit: notable
    conf: 0.9
    if:
      type: hex
      offset_range: [0, null]
      pattern: "9D 9C 58 33 04 24 9D A9 00 00 20 00"
    unless:
      # The Go runtime probes the EFLAGS ID bit itself, so Go binaries
      # carry this spelling without any debugger-evasion intent.
      - id: metadata/lang/compiler/systems::go-binary
composite_rules:
  - id: stripped-elf-trap-flag-debugger-check
    desc: Stripped ELF with trap-flag check
    crit: suspicious
    conf: 0.9
    all:
      - id: eflags-trap-bit-reread-test
    any:
      - id: metadata/binary/header/malformed::elf-parse-failure
    needs: 1
