defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: staged-pe-loader-with-debugger-check
    desc: Staged PE loader with debugger check and API resolution
    crit: hostile
    conf: 0.98
    attack: T1620,T1622
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::capi-inline-pe-memory-loader
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/module/load::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
