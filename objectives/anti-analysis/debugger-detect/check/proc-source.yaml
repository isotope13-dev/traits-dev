defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, python, shell]
  attack: T1622

traits:
  - id: proc-tracerpid-source
    desc: Reads TracerPid from proc status
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)/proc/[^"\n]{0,160}/status[\s\S]{0,900}TracerPid\s*:'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::c-source-test-directory
      - id: metadata/package/testing/presence/harness::c-source-test-file
      - id: metadata/package/testing/harness/unit::go-testutils-directory
      - id: metadata/build/scaffold::python-unrendered-bootloader-template
      - id: objectives/anti-analysis/debugger-detect/check::unix-source-tracerpid-safe-contexts
      - id: well-known/lib/runtime/php-runtime
      # doctest is already covered via unix-source-tracerpid-safe-contexts.
