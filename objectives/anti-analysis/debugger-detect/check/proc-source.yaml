defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, python, shell]
  attack: T1622

traits:
  - id: proc-tracerpid-source
    desc: Reads TracerPid from proc status
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)/proc/[^"\n]{0,160}/status[\s\S]{0,900}TracerPid\s*:'
    not:
      # Sampling the load average is post-mortem diagnostics, never evasion: a
      # module that reads TracerPid to explain why a process died records what
      # it finds, where an anti-debug check branches on it. hermes-agent's
      # gateway/shutdown_forensics.py collects loadavg, signal names, TracerPid
      # and dmesg into one dict for its SIGTERM handler to log.
      - regex: '(?i)\bgetloadavg\b'
    unless:
      # Debugger checks in recognized test files/directories control test-runner
      # diagnostics and breakpoints rather than evade analysis.
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/unit::go-testutils-directory
      - id: metadata/build/scaffold::python-unrendered-bootloader-template
      - id: objectives/anti-analysis/debugger-detect/check::unix-source-tracerpid-safe-contexts
      - id: well-known/lib/runtime/v8::isolate-debugger-attached-fn
