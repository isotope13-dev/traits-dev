defaults:
  crit: notable
  platforms: [appliance, unix]
  for: [c, cpp, objc, elf]

traits:
  - id: vxworks-wdb-core-debug-symbols
    desc: VxWorks WDB core debug symbols
    conf: 0.9
    if:
      type: text
      regex: '\bwdb(Dbg|Debug|Bp)[A-Za-z]*\b'

  - id: vxworks-wdb-breakpoint-symbols
    desc: VxWorks WDB breakpoint symbols
    conf: 0.9
    if:
      type: text
      regex: '\bwdb(TaskBp|CtxBp)[A-Za-z]*\b'

  - id: vxworks-dbg-library-symbols
    desc: VxWorks dbg library symbols
    conf: 0.9
    if:
      type: text
      regex: '\bdbg(Arch|Task|Bp|Ctx)?Lib\b'

  - id: vxworks-taskdbg-symbols
    desc: VxWorks task debug symbols
    conf: 0.9
    if:
      type: text
      regex: '\btaskDbg[A-Za-z]*\b'


  - id: vxworks-wdb-tornado-libraries
    desc: VxWorks WDB/Tornado library identifier
    conf: 0.94
    if:
      type: text
      # VxWorks names its WDB/debugger libraries wdb*Lib or dbg*Lib.  Do not
      # match a generic libwdb prefix: BRL-CAD ships libwdb, its unrelated
      # geometry-database writer library.
      regex: '\b(wdb\w*Lib|taskDbgLib|dbg\w*Lib|libTornado[\w.-]*)\b'

composite_rules:
  - id: vxworks-debug-variable-check
    desc: VxWorks debugger symbol references
    conf: 0.92
    any:
      - id: vxworks-wdb-core-debug-symbols
      - id: vxworks-wdb-breakpoint-symbols
      - id: vxworks-dbg-library-symbols
      - id: vxworks-taskdbg-symbols
