defaults:
  for: [c, cpp, csharp, python, rust, go]
  platforms: [windows]
  attack: T1622
composite_rules:
  - id: process-debug-flags-query-source
    desc: Queries ProcessDebugFlags debugger state
    crit: suspicious
    conf: 0.95
    any:
      - id: objectives/anti-analysis/debugger-detect/native-information::process-debug-flags-numeric-call
      - id: objectives/anti-analysis/debugger-detect/native-information::process-debug-flags-named-call
