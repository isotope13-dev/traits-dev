defaults:
  for: [c, cpp, csharp, python, rust, go]
  platforms: [windows]
  attack: T1622
traits:
  - id: process-debug-flags-query-source
    desc: Queries ProcessDebugFlags debugger state
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\b(Nt|Zw)QueryInformationProcess\s*\([^,\n]{1,80},\s*(31|0x1[fF]|ProcessDebugFlags)\s*,'
