defaults:
  platforms: [windows]
  for: [pe, dll, csharp]

composite_rules:
  - id: recognized-profiler-check-contexts
    desc: Recognized contexts where a .NET profiler variable read is benign
    crit: exception
    conf: 0.97
    any:
      - id: well-known/app/utility/picoscope/
      # The parent rule already establishes the profiler-variable read, so
      # the host-path marker is sufficient: worker launchers read it only
      # to locate the dotnet host for a child process.
      - id: micro-behaviors/os/env/platform::dotnet-host-path-env-name
      # JetBrains developer tools (dotCover, dotTrace, Rider, ReSharper)
      # inspect and configure profiling environment variables.
      - id: well-known/tool/development/editor/jetbrains/
      # CheatHappens trainers ship protected assemblies whose protector
      # checks profiler environment variables for anti-tamper.
      - id: objectives/evasion/masquerade/identity/app::cheathappens-brand-string
