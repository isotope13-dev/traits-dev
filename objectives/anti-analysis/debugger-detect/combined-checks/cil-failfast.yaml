defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: cil-debugger-failfast-guard
    desc: Managed debugger-conditioned FailFast guard
    crit: suspicious
    conf: 0.97
    attack: T1622
    if:
      type: yara
      source: |
        import "pe"
        rule cil_debugger_failfast_guard {
          strings:
            $attached = "get_IsAttached\x00" ascii
            $fail = "FailFast\x00" ascii
            $guard = { 28 ?? ?? ?? 0A 2C 0A 72 ?? ?? ?? 70 28 ?? ?? ?? 0A }
          condition:
            all of them and
            for any s in pe.sections : (
              s.characteristics & 0x20000000 != 0 and
              $guard in (s.raw_data_offset..s.raw_data_offset+s.raw_data_size)
            )
        }
