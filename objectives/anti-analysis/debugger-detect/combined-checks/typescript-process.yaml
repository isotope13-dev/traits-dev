defaults:
  platforms: [unix, windows, appliance]
  for: [typescript, javascript]
  attack: T1622

traits:
  - id: ts-debugger-indicator-list
    desc: TS debugger indicator list
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'DEBUGGER_INDICATORS[\s\S]{0,420}(gdb|strace|frida)'

composite_rules:
  - id: node-debugger-attach-abort-exit
    desc: Node aborts when debugger attach is detected
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/process/exit/terminate::node-process-exit-bound-handle
    any:
      - id: micro-behaviors/process/debug/detect::node-inspector-builtin-require
      - id: micro-behaviors/process/debug/detect::node-inspect-flag-check
    near_bytes: 8192

