defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
composite_rules:
- id: debugger-rwx-process-read-ipc
  for:
  - pe
  desc: Debugger checks with RWX, process-read and IPC APIs
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/mem/combined::rwx-process-ipc-api-profile
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  any:
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
  needs: 1
  unless:
  # Chromium's sandbox broker reads child memory over Mojo pipes.
  - id: well-known/tool/browser::google-chrome-runtime-component
  - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-context
  # Vanara bindings declare these APIs; declaring is not calling.
  - id: well-known/lib/platform/vanara::vanara-binding-assembly
