# IsDebuggerPresent followed by an unconditional hang — freezes analysis
# instead of quietly exiting.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1622
  mbc: B0001

traits:
  - id: debugger-present-hang-loop
    desc: Debugger-present branch enters endless loop
    crit: suspicious
    conf: 0.98
    for: [c, cpp]
    if:
      type: tree-sitter
      query: |
        (if_statement
          condition: (_) @guard
          consequence: [
            (while_statement condition: (_) @loop)
            (compound_statement (while_statement condition: (_) @loop))
          ]
          (#match? @guard "^\\(?\\s*IsDebuggerPresent\\s*\\(\\s*\\)\\s*\\)?$")
          (#match? @loop "^\\(?\\s*(1|true)\\s*\\)?$")) @evidence
