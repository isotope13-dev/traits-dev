defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: native-process-monitor-watchlist
    desc: Watches process starts beside a process-monitor tool list
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/wmi/event::native-process-start-trace-query
      - id: micro-behaviors/process/debug/tool-markers::monitoring-tool-name-cluster
