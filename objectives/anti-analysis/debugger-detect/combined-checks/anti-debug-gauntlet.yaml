defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1622
  mbc: B0001
traits:
- id: peb-helper-getter
  desc: PEB getter helper (mov rax gs:0x60; ret)
  crit: notable
  conf: 0.9
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 65 48 8b 04 25 60 00 00 00 c3
- id: peb-nt-global-flag-test
  desc: PEB heap-flags test byte [rax+0x90] 0x70
  crit: notable
  conf: 0.92
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: F6 80 90 00 00 00 70
- id: peb-nt-global-flag-bc-test
  desc: PEB NtGlobalFlag test [rax+0xbc] 0x70
  crit: notable
  conf: 0.92
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: F6 80 BC 00 00 00 70
composite_rules:
# The legs are a syscall stub and two small immediates (process info classes
# 7, 30, 31). Pooled across a whole image those collide with any dense code --
# tellico's MinGW-built libgcrypt and the OpenSSL cryptogams assembly inside
# QtWebEngineProcess.exe both matched. The constant has to sit near the stub to
# be its argument.
- id: ntqip-debug-info-cluster
  desc: NtQueryInformationProcess debug info class cluster
  crit: suspicious
  conf: 0.96
  arch: [x86-64]
  size_max: 5242880
  near_bytes: 512
  needs: 2
  any:
  - id: micro-behaviors/process/control/info::process-info-class-7-constant
  - id: metadata/binary/instruction/operand::x64-load-edx-30
  - id: metadata/binary/instruction/operand::x64-load-edx-31
  all:
  - id: micro-behaviors/process/info/query::nt-query-information-process-text
- id: peb-anti-debug-flag-cluster
  desc: PEB-walking anti-debug flag checks
  crit: suspicious
  conf: 0.92
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: peb-helper-getter
  any:
  - id: peb-nt-global-flag-test
  - id: metadata/binary/instruction/sequence/comparison::cmp-byte-rax-offset-2-zero-repeated
  # Crash reporters read PEB fields for module enumeration. The Tencent-signed
  # Yuanbao crash handler matches this cluster with no debugger-check intent.
  unless:
  - id: metadata/signature/verified/signer::tencent-technology-shenzhen-company-limited
- id: anti-debug-gauntlet
  desc: Debug info query and repeated RDTSC bytes
  crit: suspicious
  conf: 0.96
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: ntqip-debug-info-cluster
  - id: metadata/binary/instruction/opcode::repeated-rdtsc-combine-bytes

- id: peb-inline-anti-debug-cluster
  desc: Inline x64 PEB BeingDebugged and NtGlobalFlag checks
  crit: suspicious
  conf: 0.94
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: micro-behaviors/process/info/query::peb-access-x64
  - id: metadata/binary/instruction/sequence/comparison::cmp-byte-rax-offset-2-zero-repeated
  - id: peb-nt-global-flag-bc-test
  unless:
  - id: metadata/signature/verified/signer::tencent-technology-shenzhen-company-limited

- id: ntqip-multi-class-probe
  desc: Queries NtQueryInformationProcess for all three debug classes
  crit: suspicious
  conf: 0.95
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: micro-behaviors/process/info/query::nt-query-information-process-text
  - id: micro-behaviors/process/control/info::process-info-class-7-constant
  - id: metadata/binary/instruction/operand::x64-load-edx-30
  - id: metadata/binary/instruction/operand::x64-load-edx-31
  # Microsoft's console host (OpenConsole.exe) queries all three debug classes.
  # The Cygwin/MSYS2 POSIX runtime (msys-2.0.dll, shipped inside Git for
  # Windows) carries the same three queries as a stock library component.
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
