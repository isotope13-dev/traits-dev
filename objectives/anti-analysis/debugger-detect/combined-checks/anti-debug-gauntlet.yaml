defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1622
  mbc: B0001
traits:
- id: peb-helper-getter
  desc: PEB getter helper (mov rax gs:0x60; ret)
  crit: notable
  conf: 0.9
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 65 48 8b 04 25 60 00 00 00 c3
- id: peb-nt-global-flag-test
  desc: PEB heap-flags test byte [rax+0x90] 0x70
  crit: notable
  conf: 0.92
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: F6 80 90 00 00 00 70
composite_rules:
# The legs are a syscall stub and two small immediates (process info classes
# 7, 30, 31). Pooled across a whole image those collide with any dense code --
# tellico's MinGW-built libgcrypt and the OpenSSL cryptogams assembly inside
# QtWebEngineProcess.exe both matched. The constant has to sit near the stub to
# be its argument.
- id: ntqip-debug-info-cluster
  desc: NtQueryInformationProcess debug info class cluster
  crit: suspicious
  conf: 0.96
  arch: [x86-64]
  size_max: 5242880
  near_bytes: 512
  needs: 2
  any:
  - id: micro-behaviors/process/control/info::process-info-class-7-constant
  - id: metadata/binary/instruction/operand::x64-load-edx-30
  - id: metadata/binary/instruction/operand::x64-load-edx-31
  all:
  - id: micro-behaviors/process/info/query::nt-query-information-process-text
  unless:
  # A Wine builtin DLL is a reimplementation of the Windows system DLL whose
  # name it carries, so it contains the API surface by definition -- the
  # behaviour being described here is the one Windows itself provides.
  - id: well-known/lib/platform/wine::wine-builtin-dll-marker
  - id: metadata/signed/leaf::microsoft-corporation
  - id: well-known/tool/reverse-engineering/scyllahide/
  - id: well-known/tool/reverse-engineering/sharpod/
- id: peb-anti-debug-flag-cluster
  desc: PEB-walking anti-debug flag checks
  crit: suspicious
  conf: 0.92
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: peb-helper-getter
  any:
  - id: peb-nt-global-flag-test
  - id: metadata/binary/instruction/sequence::cmp-byte-rax-offset-2-zero-repeated
- id: anti-debug-gauntlet
  desc: Debug info query and repeated RDTSC bytes
  crit: suspicious
  conf: 0.96
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: ntqip-debug-info-cluster
  - id: metadata/binary/instruction/opcode::repeated-rdtsc-combine-bytes
