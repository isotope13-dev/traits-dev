defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: failfast-token
    desc: FailFast termination method name
    crit: notable
    if:
      type: text
      exact: FailFast
composite_rules:
  - id: managed-debugger-failfast-names
    desc: Managed debugger checks paired with FailFast termination
    crit: suspicious
    conf: 0.92
    attack: T1622
    all:
      - id: failfast-token
    any:
      - id: micro-behaviors/process/debug/detect::dotnet-debugger-attachment-references
      - id: micro-behaviors/process/debug/detect::dotnet-debugger-logging-references
      - id: micro-behaviors/process/debug/detect::dotnet-debugger-attached-call
