defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # A managed debugger test and two native delegate/local tests short-circuit
  # to Exit(1). The final false branch skips the entire six-byte exit block.
  # Metadata names corroborate this CIL layout; no fixed metadata RID, XOR key,
  # class name, or encoded API spelling is required. This is a probable gate,
  # not token resolution or proof of its runtime result.
  - id: managed-debugger-delegate-exit-layout
    desc: Managed debugger and delegate checks guard exit
    crit: suspicious
    conf: 0.96
    attack: T1622
    if:
      type: yara
      source: |
        import "pe"
        rule managed_debugger_delegate_exit_layout {
          strings:
            $clr = "BSJB"
            $debugger = "\x00Debugger\x00"
            $attached = "\x00get_IsAttached\x00"
            $exit = "\x00Exit\x00"
            $delegate = "\x00GetDelegateForFunctionPointer\x00"
            $gate = { 28 ?? ?? ?? 0A 2D 0D 11 ?? 2D 09
                      11 ?? 6F ?? ?? ?? 06 2C 06 17 28 ?? ?? ?? 0A }
          condition:
            pe.is_pe and
            for any s in pe.sections : (
              s.name == ".text" and
              for all of them : (
                $ in (s.raw_data_offset..s.raw_data_offset+s.raw_data_size-1)
              )
            )
        }
