defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: suspicious
composite_rules:
- id: admin-resource-registry-debug-api-clues
  desc: Admin resource, registry and debugger clues
  conf: 0.97
  unless:
  - id: metadata/installer/product/
  - id: metadata/filename/name-form::is-microsoft-named
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  - id: metadata/build/manifest::require-administrator
  - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  - id: micro-behaviors/ui/window/station::window-station-query-chain
  any:
  - id: micro-behaviors/process/thread/create::create-thread
  - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/os/registry/key/lifecycle::registry-transacted-api-name-chain
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  needs: 3
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
