defaults:
  platforms: [unix, appliance]
  for: [python]
  attack: T1622

composite_rules:
  # Require real process enumeration and a cmdline open alongside the tool
  # markers. Path templates and an unconditional error message alone do not
  # establish process inspection.
  - id: python-debugger-tool-set
    desc: Python enumerates process command lines near debugger tool names
    crit: suspicious
    conf: 0.92
    near_lines: 20
    all:
      - id: micro-behaviors/process/debug/tool-markers::gdbserver-reference
      - id: micro-behaviors/process/debug/tool-markers::python-frida-reference
      - id: micro-behaviors/fs/proc/info/listing::python-proc-enumerate
      - id: micro-behaviors/fs/proc/cmdline::python-process-cmdline-file-open

  - id: python-process-anti-analysis
    desc: Python process anti-analysis
    crit: hostile
    conf: 0.98
    all:
      - id: python-debugger-tool-set
      - id: micro-behaviors/process/exit/terminate::python-conditional-process-exit
