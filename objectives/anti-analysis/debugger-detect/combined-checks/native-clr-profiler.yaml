defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # The native protector reconstructs Cor_Enable_Profiling, calls getenv,
  # then compares the returned pointer to a static string and branches to
  # its exit. This is an attempted profiler veto, not a working string-value
  # comparison. The signature binds the call to its fixed-pad decoder;
  # neither an environment-name mention nor generic XOR alone suffices.
  # The pad and encoded variable belong to the reusable protector stub,
  # not to the protected application. Addresses and call offsets vary.
  - id: native-clr-profiler-pointer-gate
    desc: CLR profiler probe with pointer-identity exit
    crit: suspicious
    conf: 0.98
    attack: T1622
    if:
      type: yara
      source: |
        rule native_clr_profiler_pointer_gate {
          strings:
            $decoder = {
              83 EC 24 56 8B 44 24 2C 0F B6 08 0F B6 50 01 80
              F1 A3 80 F2 54 88 4C 24 04 0F B6 48 02 88 54 24
              05 0F B6 50 03 F6 D1 80 F2 75 88 4C 24 06 0F B6
              48 04 88 54 24 07 0F B6 50 05 80 F1 E7 80 F2 44
              88 4C 24 08 0F B6 48 06 88 54 24 09 0F B6 50 07
              80 F1 4B 80 F2 23 88 4C 24 0A 0F B6 48 08 88 54
              24 0B 0F B6 50 09 80 F1 BF 80 F2 45 88 4C 24 0C
              0F B6 48 0A 88 54 24 0D 0F B6 50 0B 80 F1 3B 80
              F2 56 88 4C 24 0E 0F B6 48 0C 88 54 24 0F 0F B6
              50 0D 80 F1 F8 80 F2 98 88 4C 24 10 0F B6 48 0E
              88 54 24 11 0F B6 50 0F 80 F1 5B 80 F2 F4 88 4C
              24 12 0F B6 48 10 88 54 24 13 0F B6 50 11 80 F1
              B5 80 F2 87 88 4C 24 14 0F B6 48 12 88 54 24 15
              0F B6 50 13 80 F1 7B 80 F2 0F 88 4C 24 16 0F B6
              48 14 88 54 24 17 0F B6 50 15 80 F1 F4 80 F2 76
              88 4C 24 18
            }
            $gate = {
              C6 44 24 ?? E0 C6 44 24 ?? 3B C6 44 24 ?? 8D
              C6 44 24 ?? 2A C6 44 24 ?? A2 C6 44 24 ?? 2A
              C6 44 24 ?? 2A C6 44 24 ?? 41 C6 44 24 ?? D3
              C6 44 24 ?? 20 C6 44 24 ?? 64 C6 44 24 ?? 06
              C6 44 24 ?? 8A C6 44 24 ?? F7 C6 44 24 ?? 3D
              C6 44 24 ?? 9D C6 44 24 ?? D9 C6 44 24 ?? EE
              C6 44 24 ?? 15 C6 44 24 ?? 68 C6 44 24 ?? F4
              [55] 88 5C 24 ??
              E8 ?? ?? ?? ?? 50 E8 ?? ?? ?? ?? 83 C4 0C
              3D ?? ?? ?? ?? 0F 84 ?? ?? ?? ??
            }
          condition:
            uint16(0) == 0x5a4d and $decoder and
            for any i in (1..#gate) : (
              for any j in (1..#decoder) : (
                @gate[i] + 169 + int32(@gate[i] + 165) == @decoder[j]
              )
            )
        }
