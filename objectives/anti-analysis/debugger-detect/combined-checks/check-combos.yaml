defaults:
  attack: T1622
  mbc: B0001
  platforms:
    - unix
    - windows
    - macos
composite_rules:
  - id: win-basic
    desc: Windows debugger and exception API references
    crit: notable
    conf: 0.85
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    any:
      - id: micro-behaviors/os/exception/error-handling::exception-filter-pair-imports
      - id: micro-behaviors/os/exception/error-handling::unhandled-exception-filter-import
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
  - id: win-comprehensive
    desc: Windows debugger/VM detection (multiple signals)
    crit: suspicious
    conf: 0.9
    platforms:
      - windows
    for:
      - pe
      - dll
    size_max: 100000
    unless:
      - id: metadata/lang/compiler/managed::bsjb-marker
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    any:
      - id: micro-behaviors/os/exception/error-handling::exception-filter-pair-imports
      - id: micro-behaviors/os/exception/error-handling::unhandled-exception-filter-import
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
      - id: micro-behaviors/time/query::query-performance-counter
    downgrade:
      any:
        - id: metadata/binary/header/identity::pe-rich-header-entries
        - id: metadata/binary/resource/identity::pe-version-resource
  - id: win-anti-analysis-suite
    desc: Windows anti-analysis technique suite
    crit: suspicious
    conf: 0.9
    platforms:
      - windows
    for:
      - pe
      - dll
    size_max: 350000
    unless:
      - id: metadata/lang/compiler/managed::bsjb-marker
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
    any:
      - id: micro-behaviors/os/exception/error-handling::unhandled-exception-filter-import
      - id: micro-behaviors/time/query::multiple-clock-api-references
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/process/control/affinity::set-thread-affinity-mask
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/header/identity::pe-rich-header-entries
        - id: metadata/binary/symbols/count::many-imports
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/binary/debug::pdb-absolute-path
  - id: unsigned-loader-anti-analysis-suite
    desc: Unsigned loader anti-analysis suite
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    for:
      - pe
      - dll
    size_max: 400000
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
    any:
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: objectives/execution/payload/process-inject/hollowing/process::ppid-spoofing-attributes
      - id: metadata/binary/section/entropy::large-near-random-writable-data
    needs: 2
  - id: unsigned-inline-pe-loader-anti-analysis
    desc: Unsigned inline-PE loader with debugger-gated execution markers
    crit: hostile
    conf: 0.97
    platforms:
      - windows
    for:
      - pe
      - dll
    attack: T1622,T1027.009,T1620
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
      - id: micro-behaviors/data/bitwise/xor-forms/instruction::x64-xor-imm8-widen-loop
    any:
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-read-register-x64
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
    needs: 2
    unless:
      - id: metadata/installer/product/
  - id: overlay-wrapper-anti-analysis-suite
    desc: Overlay loader anti-analysis suite
    crit: suspicious
    conf: 0.96
    platforms:
      - windows
    for:
      - pe
    size_min: 500000
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/time/query::get-tick-count
      - id: metadata/binary/section/layout::edata-wrapper-entry-layout
  - id: linux-comprehensive
    desc: Linux debugger detection across multiple
    crit: suspicious
    conf: 0.95
    platforms:
      - linux
    for:
      - elf
    needs: 2
    any:
      - id: micro-behaviors/os/linker::ld-debug
      - id: micro-behaviors/process/debug/detect::script-tracerpid-field-reference
      - id: micro-behaviors/process/debug/control::tracing-request-constants
  - id: linux-ptrace-linker-instrumentation-checks
    desc: Linux ptrace and linker instrumentation checks
    crit: suspicious
    conf: 0.96
    platforms:
      - linux
    for:
      - elf
    all:
      - id: micro-behaviors/os/syscall/invoke::ptrace-import
      - id: micro-behaviors/os/env/read/variable::getenv
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: micro-behaviors/os/linker::ld-audit
    unless:
      - id: well-known/lib/native/glibc::libc-runtime
      - id: well-known/tool/sysadmin/proot::proot-binary
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: signed-firefox-wrapper-anti-analysis
    desc: Signed Firefox wrapper anti-analysis suite
    crit: suspicious
    conf: 0.96
    platforms:
      - windows
    for:
      - pe
    size_min: 250000
    size_max: 1500000
    all:
      - id: well-known/app/communication/thunderbird::legacy-firefox-pdb-path
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/exception/error-handling::exception-filter-pair-imports
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/time/query::get-tick-count
    any:
      - id: metadata/signature/verified/signer::mozilla-corporation
      - id: metadata/signature/unverified/signer::mozilla-corporation
      - id: metadata/signature/self-signed/signer::mozilla-corporation
      - id: metadata/signature/invalid/tampered/signer::mozilla-corporation
      - id: metadata/signature/invalid/bad-signature/signer::mozilla-corporation
      - id: metadata/signature/verified/subject::mozilla-corporation
      - id: metadata/signature/unverified/subject::mozilla-corporation
      - id: metadata/signature/self-signed/subject::mozilla-corporation
      - id: metadata/signature/invalid/tampered/subject::mozilla-corporation
      - id: metadata/signature/invalid/bad-signature/subject::mozilla-corporation
  - id: tls-debugger-thread-time-tamper
    desc: TLS debugger check with thread and system-time API cluster
    crit: hostile
    conf: 0.98
    attack: T1622,T1055.003
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/os/sysinfo/config::set-system-time-api
    unless:
      - id: well-known/lib/media/videolan/
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/lang/compiler/native::mingw-winpthreads-library
