defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1622
  mbc: B0001
composite_rules:
- id: dotnet-profiler-anti-debug
  desc: .NET profiler anti-debug check
  crit: hostile
  conf: 0.97
  # The variable name has to be the value being read. A profiler that logs
  # CORECLR_ENABLE_PROFILING, or a tool that sets it on a child, also calls
  # GetEnvironmentVariable for unrelated names in the same file. near_lines
  # is empty on a PE that contains no newlines, so the byte window is what
  # keeps a concept glossary from meeting an unrelated method name.
  near_lines: 8
  near_bytes: 16384
  all:
  - id: micro-behaviors/os/env/platform::dotnet-profiling-env-name
  - id: micro-behaviors/os/env/read::get-environment-variable-name-reference
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/signed/platform/
  - id: metadata/signed/trust-level::signer-evidence-present
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime
  # The .NET 5+ host above is recognized by its `singlefilehost.pdb` path; a
  # .NET Core 3.x self-contained publish is the same bundle with none of those
  # markers, and reads as a packer without this (GitVersion 5.1.3).
  - id: metadata/binary/framework::dotnet-selfcontained-bundle
  - id: well-known/app/system/dynu::dynu-systems-signer
  # PicoScope ships Babel-obfuscated assemblies whose protector checks the
  # profiler variables and FailFasts on tampering, and worker launchers
  # read the host-path variable to locate the dotnet host; neither vendor
  # protection nor worker bootstrap is hostile anti-debug.
  - id: objectives/anti-analysis/debugger-detect/combined-checks::recognized-profiler-check-contexts
