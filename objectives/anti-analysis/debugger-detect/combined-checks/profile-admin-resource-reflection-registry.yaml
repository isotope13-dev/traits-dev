defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: suspicious
composite_rules:
- id: admin-resource-reflection-registry-clues
  desc: Admin resource, reflection and registry clues
  conf: 0.96
  unless:
  - id: metadata/installer/product/
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
  - id: objectives/anti-static/obfuscation/reflection/class::dynamic-load-pattern
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  - id: micro-behaviors/os/registry/key/lifecycle::registry-transacted-api-name-chain
  - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-and-clock-api-profile
  - id: metadata/build/manifest::require-administrator
  any:
  - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-ipv4-port-dup
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/ui/window/station::window-station-query-chain
  - id: micro-behaviors/fs/file/move::move-file-ex
  needs: 2
  downgrade:
    any:
    - id: metadata/filename/name-form::is-microsoft-named
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/lang/compiler/native/
    - id: metadata/binary/debug::pe-dwarf-debug-section
