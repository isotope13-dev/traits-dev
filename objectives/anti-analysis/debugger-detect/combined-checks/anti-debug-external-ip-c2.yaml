defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-pe-anti-analysis-external-ip-url
    desc: Unsigned PE combines IP endpoints and analysis-tool clues
    # Numeric service URLs and analysis-tool checks also occur in commercial
    # software. Neither leg proves C2, theft, or another attack objective.
    # Keep the observation, without promoting capability co-occurrence to
    # hostile merely because the executable is unsigned.
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/direct/
      - id: objectives/anti-analysis/tool-detect/process/
    unless:
      - id: metadata/signature/verified/
