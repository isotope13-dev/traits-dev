defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-pe-anti-analysis-external-ip-url
    desc: Unsigned PE with external-IP HTTP URL and anti-analysis tool checks
    crit: hostile
    conf: 0.95
    attack: T1071.001,T1622
    all:
      - id: micro-behaviors/communications/ip/direct/
      - id: objectives/anti-analysis/tool-detect/process/
    unless:
      - id: metadata/signature/verified/
