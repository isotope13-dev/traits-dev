defaults:
  platforms:
  - unix
  - windows
  - macos
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
traits: []
composite_rules:
- id: debugger-check-and-system-probes
  desc: Debugger-check signals with timing or system probes
  crit: suspicious
  conf: 0.85
  attack: T1497
  mbc: B0001
  all:
  - id: objectives/anti-analysis/debugger-detect/combined-checks::win-comprehensive
  any:
  - id: micro-behaviors/time/query::query-performance-counter
  - id: micro-behaviors/time/query::gettimeofday
  - id: micro-behaviors/time/query::clock_gettime
  - id: micro-behaviors/os/sysinfo/hardware::is-processor-feature-present
  - id: micro-behaviors/os/virtualization/hypervisor::vm-vendor-hardware-references
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
- id: anti-forensics-defensive
  desc: Debugger-check signals with anti-forensics capability
  crit: hostile
  conf: 0.9
  attack: T1562
  mbc: B0005
  all:
  - id: debugger-check-and-system-probes
  any:
  - id: objectives/evasion/indicator-removal/logs::log-clear
  - id: micro-behaviors/os/event/log::clear-eventlog
  - id: micro-behaviors/fs/delete/file/self::comspec-shortpath-self-delete-profile
  - id: objectives/evasion/self-delete/file/script::module-path-delete
  - id: objectives/evasion/self-delete/file/script::self-delete-windows
  - id: objectives/evasion/self-delete/process::aggressive-evidence-removal
