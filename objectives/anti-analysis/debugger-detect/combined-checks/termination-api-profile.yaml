defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
composite_rules:
  - id: debugger-check-terminate-api-profile
    desc: Debugger, termination and system API references
    conf: 0.95
    all:
      - id: objectives/anti-analysis/debugger-detect/check::win-debugger-detect
      - id: micro-behaviors/process/terminate/kill::terminate-process
    any:
      - id: micro-behaviors/os/exception/error-handling::exception-filter-pair-imports
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
      - id: micro-behaviors/os/exception/error-handling::unhandled-exception-filter-import
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/os/sysinfo/hardware::is-processor-feature-present
  - id: debugger-timing-terminate-api-profile
    desc: Debugger, timing and termination API references
    conf: 0.94
    all:
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/os/sysinfo/hardware::is-processor-feature-present
      - id: micro-behaviors/time/query::query-performance-counter
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  - id: debugger-and-clock-api-profile
    desc: Debugger and multiple clock API references
    conf: 0.9
    for: [pe, dll]
    all:
      - id: micro-behaviors/time/query::multiple-clock-api-references
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
