defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1622
  mbc: B0001

composite_rules:
  - id: obfuscated-dotnet-dual-antidebug
    desc: Unsigned obfuscated .NET assembly checks native and managed debuggers
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/process/debug/detect::dotnet-debugger-attached-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/managed::obfuscar-obfuscated-assembly
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: objectives/anti-static/obfuscation/obfuscator/managed::confuserex-obfuscated-assembly
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe
    unless:
      - id: metadata/signature/verified/
