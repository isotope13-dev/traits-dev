defaults:
  platforms: [windows]
  for: [pe]
  attack: T1622

traits:

  - id: mscoree-runtime-resolve-string
    desc: mscoree.dll resolved at runtime
    crit: component
    conf: 0.9
    if:
      id: micro-behaviors/dylib/library/family::mscoree-dll-name
    unless:
      - type: import
        substr: mscoree
      - id: well-known/app/system/drivers/nvidia::ngx-dll-basename

composite_rules:
  - id: peb-being-debugged-with-long-sleep
    desc: PEB.BeingDebugged check with long sleep
    crit: suspicious
    conf: 0.92
    size_max: 4194304
    any:
      - id: micro-behaviors/os/api-resolution/hash-based::peb-being-debugged-byte
      - id: micro-behaviors/os/api-resolution/hash-based::peb-being-debugged-byte-i386
    all:
      - id: metadata/binary/instruction::x86-push-immediate-20000
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified

  - id: empty-stub-runtime-resolver
    desc: Empty PE stub with COM/CLR runtime resolver
    crit: suspicious
    conf: 0.9
    size_max: 524288
    all:
      - id: metadata/binary/symbols/imports::import-dll-count-under-4
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
    any:
      - id: micro-behaviors/os/com/runtime::combase-dll-reference
      - id: mscoree-runtime-resolve-string
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: metadata/binary/installer/family/
      - id: well-known/lib/media/chromium-angle/

  - id: anti-debug-elevated-empty-stub
    desc: Empty PE stub with anti-debug and elevation request
    crit: hostile
    conf: 0.93
    size_max: 1048576
    all:
      - id: peb-being-debugged-with-long-sleep
      - id: empty-stub-runtime-resolver
      - id: micro-behaviors/os/privilege/manifest::require-administrator
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified
