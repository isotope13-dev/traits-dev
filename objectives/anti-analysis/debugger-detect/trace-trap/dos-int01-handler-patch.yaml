# The INT 01h vector is the single-step entry a tracer owns. A DOS hook that
# briefly writes into that handler, while it sits on INT 21h, hangs or
# corrupts any debugger stepping through the hooked service.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1622
  size_max: 4096

traits:
  # EB FE is the hang. The two XCHG instructions swap that address into the
  # INT 01h vector and immediately swap the saved vector back.
  - id: dos-int01-swap-hang
    desc: Swaps INT 01h with a hang
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule dos_int01_swap_hang {
          meta:
            filetypes = "dos_com,data"
          strings:
            $h = { EB FE [0-20] 66 87 06 04 00 66 87 06 04 00 }
          condition:
            $h in (0..256)
        }

  # Vienna.DearUser.1407 and variants:
  # Clears the CPU Trap Flag (`XOR AX, AX; PUSH AX; POPF`), sets `ES=0`, reads
  # the `INT 19h` bootstrap loader vector from `0000:0064h` (`MOV AX, ES:[0064h];
  # MOV BX, ES:[0066h]`), and overwrites both `INT 01h` (`0000:0004h`) and
  # `INT 03h` (`0000:000Ch`) in the IVT so single-stepping or breakpoints
  # trigger an immediate reboot. Matches both unencrypted and backward-SUB
  # additive-key-encrypted forms.
  - id: dos-ivt-trap-breakpoint-reboot-clobber
    desc: Overwrites INT 01h/03h vectors with INT 19h
    crit: hostile
    conf: 0.99
    size_max: 65536
    if:
      type: yara
      source: |
        rule dos_ivt_trap_breakpoint_reboot_clobber {
          meta:
            filetypes = "dos_com,data"
          strings:
            $plain = { 33 C0 50 9D 50 07 26 A1 64 00 26 8B 1E 66 00 26 A3 04 00 26 A3 06 00 26 A3 0C 00 26 89 1E 0E 00 }
            $stub = { B9 ?? 05 BF ?? ?? 8A 45 FF 8B DF 4B 28 07 E2 FB }
          condition:
            $plain or
            for any i in (1..#stub) : (
              @stub[i] + 19 + uint16(@stub[i] + 1) <= filesize and
              (((uint8(@stub[i] + 0x2D) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x33) and
              (((uint8(@stub[i] + 0x2E) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0xC0) and
              (((uint8(@stub[i] + 0x2F) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x50) and
              (((uint8(@stub[i] + 0x30) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x9D) and
              (((uint8(@stub[i] + 0x33) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x26) and
              (((uint8(@stub[i] + 0x34) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0xA1) and
              (((uint8(@stub[i] + 0x35) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x64) and
              (((uint8(@stub[i] + 0x3D) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0xA3) and
              (((uint8(@stub[i] + 0x3E) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x04) and
              (((uint8(@stub[i] + 0x45) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0xA3) and
              (((uint8(@stub[i] + 0x46) + 256 - uint8(@stub[i] + 18 + uint16(@stub[i] + 1))) & 0xFF) == 0x0C)
            )
        }

composite_rules:
  - id: dos-int21-hook-hangs-single-step-tracer
    desc: DOS INT 21 hook patches INT 01 handler
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-int01-handler-first-word-patch
  - id: dos-int21-int01-hang-hook
    desc: INT 21h hook hangs single-step
    crit: hostile
    conf: 0.96
    all:
      - id: dos-int01-swap-hang
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-get-then-set
  - id: dos-resident-int01-hang
    desc: Resident hook hangs the tracer
    crit: hostile
    conf: 0.95
    all:
      - id: dos-int01-swap-hang
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int27
