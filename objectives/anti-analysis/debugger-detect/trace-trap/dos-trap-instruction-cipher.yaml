# Instruction-level trace cipher: the program owns INT 03h and INT 01h. Each
# INT 3 breakpoint is followed by a key byte; the INT 3 handler skips the key
# in the saved IP, XORs the next instruction byte with it and sets TF in the
# saved FLAGS. After that one instruction runs, the INT 1 handler XORs the
# same byte again and clears TF. A debugger that owns either vector, or that
# steps over the breakpoints, executes garbage. Both handlers and their TF
# edits on the IRET frame are required; vector addresses and keys vary.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1622
  size_max: 65536

traits:
  - id: dos-int3-int1-instruction-xor-trap
    desc: Trap handlers decrypt each traced instruction
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_int3_int1_instruction_xor_trap {
          meta:
            filetypes = "dos_com,data"
          strings:
            $set = { 8B ( 77 | 74 | 76 ) 02 FF ( 47 | 44 | 46 ) 02 [0-6] AC 30 04 [0-4] ( 8A ( 47 | 44 | 46 ) 07 0C 01 88 ( 47 | 44 | 46 ) 07 | 80 ( 4F | 4C | 4E ) 07 01 ) [0-6] CF }
            $clear = { AC 30 04 [0-4] ( 8A ( 47 | 44 | 46 ) 07 24 FE 88 ( 47 | 44 | 46 ) 07 | 80 ( 67 | 64 | 66 ) 07 FE ) [0-6] CF }
          condition:
            for any i in (1..#set) : (
              for any j in (1..#clear) : (
                (@clear[j] > @set[i] and @clear[j] - @set[i] < 96) or
                (@set[i] > @clear[j] and @set[i] - @clear[j] < 96)
              )
            )
        }
