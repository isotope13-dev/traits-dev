# A service loader that changes exception handling based on debugger presence
# adds a distinct anti-analysis gate to the loader chain.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1622,T1129

composite_rules:
  - id: service-loader-debugger-gate
    desc: Service loader gates exception handling on debugger
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/persistence/system/service/loader::unsigned-service-dll-worker-loader
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/exception/error-handling::unhandled-exception-filter-import
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
