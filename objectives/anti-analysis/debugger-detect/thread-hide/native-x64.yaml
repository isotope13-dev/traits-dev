defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1622
composite_rules:
  - id: native-thread-hide-class17-call-profile
    desc: Thread API beside class-17 null-buffer call
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/thread/config::nt-set-information-thread-name
      - id: metadata/binary/instruction/call::x64-class17-null-buffer-call

  # The same class-17 (ThreadHideFromDebugger) argument layout, with the
  # thread API resolved by CRC32 digest rather than named in the binary.
  - id: hashed-thread-hide-class17-call
    desc: Hashed thread API with class-17 null-buffer call
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-nt-set-information-thread
    any:
      - id: metadata/binary/instruction/call::x64-class17-null-buffer-call
      - id: metadata/binary/instruction/call::x64-class17-lea-null-buffer-args
