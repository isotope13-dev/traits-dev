# Suppressing debugger events differs from probing debugger presence (check/)
# and inspecting hardware breakpoint registers (hardware-breakpoints/).
defaults:
  for: [c, cpp, csharp, python, rust, go]
  platforms: [windows]
  attack: T1622
composite_rules:
  - id: thread-hide-from-debugger-source
    desc: Suppresses thread debugger events
    crit: suspicious
    conf: 0.97
    any:
      - id: objectives/anti-analysis/debugger-detect/native-information::thread-hide-debugger-numeric-call
      - id: objectives/anti-analysis/debugger-detect/native-information::thread-hide-debugger-named-call
  - id: debugger-hidden-impersonated-suspended-thread
    for: [c, cpp]
    desc: Suspended thread hides from debugger with token
    crit: hostile
    conf: 0.98
    attack: T1622,T1134.001
    all:
      - id: objectives/anti-analysis/debugger-detect/native-information::thread-hide-debugger-named-call
      - id: micro-behaviors/process/create/thread::create-thread-source
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: micro-behaviors/os/privilege/token::duplicate-token
      - id: micro-behaviors/process/thread/lifecycle::nt-resume-name-source
