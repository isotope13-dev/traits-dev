defaults:
  for:
  - c
  - cpp
  - csharp
  - python
  - rust
  - go
  platforms:
  - windows
  attack: T1622
composite_rules:
- id: thread-hide-from-debugger-source
  desc: Suppresses thread debugger events
  crit: suspicious
  conf: 0.97
  any:
  - id: objectives/anti-analysis/debugger-detect/native-information::thread-hide-debugger-numeric-call
  - id: objectives/anti-analysis/debugger-detect/native-information::thread-hide-debugger-named-call
- id: debugger-hidden-suspended-thread-token-duplication
  for:
  - c
  - cpp
  desc: Thread hiding, suspended creation and token duplication
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/anti-analysis/debugger-detect/native-information::thread-hide-debugger-named-call
  - id: micro-behaviors/process/thread/create::create-thread-source
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/os/privilege/token::duplicate-token
  - id: micro-behaviors/process/thread/lifecycle::nt-resume-name-source
