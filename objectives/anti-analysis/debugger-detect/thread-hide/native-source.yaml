# Suppressing debugger events differs from probing debugger presence (check/)
# and inspecting hardware breakpoint registers (hardware-breakpoints/).
defaults:
  for: [c, cpp, csharp, python, rust, go]
  platforms: [windows]
  attack: T1622
traits:
  - id: thread-hide-from-debugger-source
    desc: Suppresses thread debugger events
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\b(Nt|Zw)SetInformationThread\s*\([^,\n]{1,80},\s*(17|0x11|ThreadHideFromDebugger)\s*,'
