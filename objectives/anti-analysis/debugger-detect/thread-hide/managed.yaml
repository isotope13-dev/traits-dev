defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1622
composite_rules:
  # This is a probable hide request, not resolved MethodDef/MemberRef data
  # flow: the API name and class-17 argument layout remain separate evidence.
  # A declaration alone and other thread information classes do not qualify.
  - id: managed-thread-hide-class17-call-profile
    desc: Managed thread-information API with class-17 call layout
    crit: suspicious
    conf: 0.9
    scope: leaf
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/thread/config::nt-set-information-thread-name
      - id: metadata/binary/instruction::cil-helper-class17-field-zero-call
