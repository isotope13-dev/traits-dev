defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]
  attack: T1027.013,T1497.001

traits:
  # The resolver hosts and the PowerShell HTTP cmdlets already have canonical
  # atoms under micro-behaviors/communications/; the composites below reference
  # those rather than restating the matchers here.
  - id: public-ip-variable-binding
    desc: Binds a public IP variable
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$(publicIp|pubip|externalIp|egressIp)\s*='

  - id: host-key-from-identity
    desc: Direct key assignment from host identity
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\b(key|seed)\s*[=:]\s*(hostname|computer|machine)\b'

  - id: host-key-from-volume
    desc: Key from volume serial
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\bserial\b'
    not:
      - substr: 'prefix, cluster, and serial'
      - substr: 'key={`serial`}'
      # JSX's `key` prop controls component reconciliation; it is not key
      # material even when the component represents a serial connection.
      - regex: '\bkey\s*=\s*\{'

  - id: host-key-from-named-identity
    desc: Key from named host identity
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\b(hostname|computer)(name|_name)\b'

  - id: host-key-from-machine-name
    desc: Key from machine name
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\bmachine(name|_name)\b'

  - id: host-hash-variable-assignment
    desc: Host hash variable assignment
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(computer_hash|machine_hash)\s*[=:][^;\r\n]{0,48}\b(machine|computer)(name)?\b'

  - id: host-key-combination
    desc: Combines key with host identifier
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(key|seed)\s*[=^+]\s*\w{1,24}\s*[+|&^-]\s*(serial|hostname|computer)\b'

  # A native loader can avoid an obvious `key = serial` assignment by hiding
  # the host binding in a helper that returns the volume serial.  Keep the
  # pieces bounded and combine them below so an ordinary disk-inventory
  # routine is not treated as payload keying.
  - id: native-host-key-helper-name
    desc: Native helper named for a host-derived key
    crit: component
    conf: 0.9
    for: [c, cpp]
    platforms: [windows]
    if:
      type: text
      regex: '\b(host|machine|victim)[_-]?(key|seed)\s*\('

  - id: returns-volume-serial
    desc: Returns a volume serial value from source
    crit: component
    conf: 0.9
    for: [c, cpp]
    platforms: [windows]
    if:
      type: text
      regex: '\breturn\s+(serial|volume[_-]?serial)\b'

  - id: compute-hash-host
    desc: Hashes host-derived material
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Match an invocation whose argument names host-derived data.  A bare
      # ComputeHash symbol plus a later `host` token also occurs in compiler
      # APIs (for example TypeScript's CompilerHost) and is not fingerprinting.
      regex: '(?is)\bComputeHash\s*\([^)]{0,160}\b(host|serial|machine)\b'

  - id: digest-host-expression
    desc: Hash call directly receives host-derived data
    crit: component
    conf: 0.91
    if:
      type: text
      regex: '(?i)\b(md5|sha1|sha256)\s*\([^\)\r\n]{0,80}\b(host(name)?|machine(name)?|serial)\b'

composite_rules:
  - id: volume-serial-host-key-helper
    desc: Native host-key helper returns a volume serial
    crit: suspicious
    conf: 0.95
    for: [c, cpp]
    platforms: [windows]
    all:
      - id: native-host-key-helper-name
      - id: micro-behaviors/os/sysinfo/disk::get-volume-information
      - id: returns-volume-serial
    near_lines: 20

  - id: external-ip-service-resolution
    desc: Resolves the host public IP externally
    crit: notable
    conf: 0.94
    for: [powershell]
    all:
      - id: public-ip-variable-binding
    any:
      - id: micro-behaviors/communications/http/ip-discovery/
    near_bytes: 512

  - id: public-ip-derived-key
    desc: Hashes public IP into key material
    crit: suspicious
    conf: 0.96
    for: [powershell]
    all:
      - id: public-ip-variable-binding
    any:
      - id: micro-behaviors/crypto/hash/digest::dotnet-computehash
      - id: micro-behaviors/crypto/hash/digest::source-digest-call
    near_bytes: 2048

  - id: public-ip-keyed-xor-payload
    desc: Public-IP keyed XOR payload decryptor
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1497.001
    for: [powershell]
    all:
      - id: external-ip-service-resolution
      - id: public-ip-derived-key
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-key-variable
    near_bytes: 4096

  - id: public-ip-keyed-in-memory-stage
    desc: Public-IP keyed payload executes after in-memory decryption
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1140,T1497.001
    for: [powershell]
    all:
      - id: public-ip-keyed-xor-payload
    any:
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex-alias
    near_bytes: 4096

  - id: public-ip-keyed-xor-execution
    desc: Executes a public-IP keyed XOR stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1140,T1497.001
    for: [powershell]
    all:
      - id: public-ip-derived-key
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-key-variable
    any:
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex-alias
    near_bytes: 4096

  - id: host-key-derivation
    desc: Derives key material from host-associated data
    crit: suspicious
    conf: 0.9
    any:
      - id: host-key-from-identity
      - id: host-key-from-volume
      - id: host-key-from-named-identity
      - id: host-key-from-machine-name
      - id: host-hash-variable-assignment
      - id: host-key-combination
      - id: compute-hash-host
      - id: digest-host-material
      - id: volume-serial-host-key-helper
    unless:
      - id: well-known/lib/network/amqp091-go/
      - id: metadata/library/data::paramiko-source
      - id: well-known/lib/network/asyncssh::asyncssh-python-library
      - id: well-known/app/infrastructure/hashicorp-vault::hashicorp-vault-product

  - id: digest-host-material
    desc: Hashes host-associated material
    crit: suspicious
    conf: 0.91
    any:
      # A generic digest call near hostname discovery is common in message
      # IDs, maildir names, and telemetry. Require the host token in the same
      # invocation instead of treating file-wide proximity as data flow.
      - id: digest-host-expression
    near_bytes: 1024
    near_lines: 8
    unless:
      - id: well-known/lib/network/amqp091-go/
      - id: metadata/library/data::paramiko-source
      - id: well-known/lib/network/asyncssh::asyncssh-python-library
      - id: well-known/app/infrastructure/hashicorp-vault::hashicorp-vault-product

  # The article's native samples use a victim-specific key to unwrap an
  # executable stage.  Keep this composite family-oriented: it combines the
  # host-binding objective with an existing runtime-crypter signal instead of
  # naming OctLurk, SilkLurk, or any one key value.
  - id: host-bound-runtime-crypter
    desc: Host-bound payload crypter executes a stage in memory
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1497.001,T1620
    all:
      - id: host-key-derivation
      - id: objectives/anti-static/obfuscation/payload/encrypted::runtime-crypter-in-memory-payload
    near_bytes: 4096

  # A language-neutral technique variant: an implant can implement its
  # modular stage as interpreted code rather than native executable memory.
  # Host-bound keying plus decode plus compiled-code execution is the useful
  # structural signal; plugin or family names are intentionally not required.
  - id: host-bound-dynamic-module
    desc: Host-bound decoded module executes in memory
    crit: hostile
    conf: 0.98
    for: [python]
    attack: T1027,T1140,T1059.006,T1620
    all:
      - id: host-key-derivation
      - id: micro-behaviors/process/interpreter/python::exec-compiled-code
      - id: micro-behaviors/data/decode/base64::b64decode-call
    near_bytes: 4096
