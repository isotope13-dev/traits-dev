defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]
  attack: T1027.013,T1497.001

traits:
  - id: host-key-from-identity
    desc: Key from host or volume identity
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\b(hostname|computer|machine)\b'

  - id: host-key-from-volume
    desc: Key from volume serial
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\bserial\b'

  - id: host-key-from-named-identity
    desc: Key from named host identity
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\b(hostname|computer)(name|_name)\b'

  - id: host-key-from-machine-name
    desc: Key from machine name
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\bmachine(name|_name)\b'

  - id: host-hash-variable-assignment
    desc: Host hash variable assignment
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(computer_hash|machine_hash)\s*[=:][^;\r\n]{0,48}\b(machine|computer)(name)?\b'

  - id: host-key-expression
    desc: Assigns key from host identifier
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\b(key|seed)\s*[=^+]\s*(serial|hostname|computer)\b'
  - id: host-key-combination
    desc: Combines key with host identifier
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\b(key|seed)\s*[=^+]\s*\w{1,24}\s*[+|&^-]\s*(serial|hostname|computer)\b'
  - id: compute-hash-host
    desc: Hashes host-derived material
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Match an invocation whose argument names host-derived data.  A bare
      # ComputeHash symbol plus a later `host` token also occurs in compiler
      # APIs (for example TypeScript's CompilerHost) and is not fingerprinting.
      regex: '(?is)\bComputeHash\s*\([^)]{0,160}\b(host|serial|machine)\b'

composite_rules:
  - id: victim-identity-source
    desc: Reads a victim-specific identity value
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
      - id: micro-behaviors/os/sysinfo/disk::get-volume-information

  - id: host-key-derivation
    desc: Derives key material from host-associated data
    crit: suspicious
    conf: 0.9
    any:
      - id: host-key-from-identity
      - id: host-key-from-volume
      - id: host-key-from-named-identity
      - id: host-key-from-machine-name
      - id: host-hash-variable-assignment
      - id: host-key-expression
      - id: host-key-combination
      - id: compute-hash-host
      - id: digest-host-material

  - id: digest-host-material
    desc: Hashes host-associated material
    crit: suspicious
    conf: 0.91
    all:
      - id: victim-identity-source
    any:
      - id: micro-behaviors/crypto/hash/digest::source-digest-call
    near_bytes: 1024

  - id: host-derived-key-material
    desc: Derives payload key material from victim-specific identity
    crit: suspicious
    conf: 0.96
    all:
      - id: victim-identity-source
      - id: host-key-derivation
