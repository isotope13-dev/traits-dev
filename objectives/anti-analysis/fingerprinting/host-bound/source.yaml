defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]
  attack: T1027.013,T1497.001

traits:
  - id: host-key-expression
    desc: Assigns key from host identifier
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\b(key|seed)\s*[=^+]\s*(serial|hostname|computer)\b'
  - id: host-key-combination
    desc: Combines key with host identifier
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\b(key|seed)\s*[=^+]\s*\w{1,24}\s*[+|&^-]\s*(serial|hostname|computer)\b'
  - id: compute-hash-host
    desc: Hashes host-derived material
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bComputeHash\b.{0,180}(host|serial|machine)'
  - id: digest-function-call
    desc: Calls a standard digest function
    crit: notable
    conf: 0.86
    for: [c, cpp, csharp, go, javascript, python]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(sha256|sha1|md5)'

composite_rules:
  - id: host-key-derivation
    desc: Derives key material from host-associated data
    crit: suspicious
    conf: 0.92
    any:
      - id: host-key-expression
      - id: host-key-combination
      - id: compute-hash-host
      - id: digest-host-material

  - id: digest-host-material
    desc: Hashes data in a file that also queries host identity
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
    any:
      - id: digest-function-call
    near_bytes: 1024

  - id: host-derived-key-material
    desc: Host-derived payload key material
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
      - id: host-key-derivation
