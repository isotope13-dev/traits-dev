defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001
composite_rules:
  - id: host-bound-key-material
    desc: Host-bound decryption key material
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/sysinfo/hardware::get-system-firmware-table
      - id: objectives/discovery/system/fingerprint/machine-id::hardware-id-source
      - id: micro-behaviors/os/registry/access::registry-read-api-chain
    any:
      - id: micro-behaviors/os/sysinfo/machine-id::microsoft-mrt-guid-path
      - id: micro-behaviors/crypto/hash/digest::message-digest
      - id: micro-behaviors/crypto/hash/digest::sha1
      - id: micro-behaviors/crypto/hash/digest::md5
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: checksum-anomalous-hash-resolved-host-probe
    desc: Checksum-anomalous PE uses hashed host probing
    crit: hostile
    conf: 0.98
    attack: T1027.007,T1497.001
    all:
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
    any:
      - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
      - id: micro-behaviors/time/query::get-tick-count
    unless:
      - id: metadata/signed/platform/
      - id: well-known/game/
      - id: well-known/tool/reverse-engineering/frida/
      # V8/Node runtimes hash API names and query system/timing state as part
      # of normal startup; their PE checksum is often not populated either.
      - id: well-known/lib/runtime/scripted/v8::v8-runtime-multi-marker
      - id: well-known/lib/runtime/scripted/php-runtime::runtime-binary-context
      # Qt Installer Framework hashes API names and queries host state as part
      # of normal installer/runtime initialization.
      - id: metadata/binary/installer/family::qt-installer-framework
      # The `pe-checksum-mismatch` leg is what makes this rule's subject
      # "checksum-anomalous", and pe_checksum.yaml already states the answer
      # for it: "CheckSum is not covered by Authenticode and may legitimately
      # be stale, so a cryptographically verified signature suppresses this
      # heuristic." That reasoning sits on the `signed-pe-checksum-mismatch`
      # composite; this rule consumes the raw atom and so never saw it.
      # pdfforge's architect_setup.exe is signed and verifies, and scored
      # hostile here -- a general answer for every signed installer, rather
      # than the sixth vendor name on this list.
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
