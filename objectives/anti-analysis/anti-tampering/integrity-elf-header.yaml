# An ELF header whose metadata no parser could use: goblin rejected it, or
# its section header table lies past the end of the file. IoT bots corrupt
# `e_shoff` to break analysis tools; truncated downloads, carved fragments,
# and exotic-architecture builds fail the same way, so those contexts are
# excepted (the neutral parse-failure observation stays, at notable).
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: elf-parse-failed
    desc: ELF header failed to parse
    crit: component
    if:
      type: metrics
      field: elf.parse_failed
      min: 1
  - id: elf-parse-panicked
    desc: ELF parser crashed on the header
    crit: component
    if:
      type: metrics
      field: elf.parse_panicked
      min: 1

composite_rules:
  - id: elf-header-malformed
    desc: Malformed ELF header or section headers
    crit: suspicious
    conf: 1.0
    mbc: B0001
    attack: T1027
    any:
      - id: elf-parse-failed
      - id: elf-parse-panicked
      - id: metadata/binary/header/malformed::elf-section-table-past-eof
    unless:
      - id: metadata/binary/header/malformed::elf-unbacked-load-and-section-table
      - id: metadata/binary/header/malformed::elf-non-utf8-parser-limit
      - id: metadata/binary/header/malformed::tiny-elf-parse-failure
      - id: metadata/binary/header/malformed::android-gif-drawable-marker
      - id: metadata/arch/s390::s390-raw-header
      - id: metadata/binary/layout/size::massive-executable
      # UPX keeps each loader stub as a relocatable object (UPX1HEAD section
      # still present) beside a text section map; carving one from the
      # compressor runs its section table into that map. Packed programs
      # never keep UPX1HEAD, so this does not exempt corrupted payloads.
      - id: metadata/build/protector::upx1head-stub-section
