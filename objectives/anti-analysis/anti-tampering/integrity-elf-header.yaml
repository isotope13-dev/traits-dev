# Evidence of deliberate ELF tampering: a parser crash or section table past
# EOF. A parser's generic rejection is retained as a neutral observation
# because valid embedded builds and unusual ELF variants can hit parser limits.
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: elf-parse-panicked
    desc: ELF parser crashed on the header
    crit: component
    if:
      type: metrics
      field: elf.parse_panicked
      min: 1

composite_rules:
  - id: elf-header-malformed
    desc: Malformed ELF header or section headers
    crit: suspicious
    conf: 1.0
    mbc: B0001
    attack: T1027
    any:
      - id: elf-parse-panicked
      - id: metadata/binary/header/malformed::elf-invalid-class-value
      - id: metadata/binary/header/malformed::elf-section-table-past-eof
    unless:
      - id: metadata/binary/header/malformed::elf-unbacked-load-and-section-table
      - id: metadata/binary/header/malformed::elf-non-utf8-parser-limit
      # A PE can carry a separately validated ELF payload. The carrier's ELF
      # parser limitation is not evidence that the PE is tampering with its
      # own header; analyze the embedded image on its own merits.
      - id: metadata/binary/layout/embedded::embedded-elf-image
      - id: metadata/binary/header/malformed::tiny-elf-parse-failure
      - id: metadata/binary/header/malformed::android-gif-drawable-marker
      - id: metadata/arch/s390::s390-raw-header
      - id: metadata/binary/layout/size::massive-executable
      # UPX keeps each loader stub as a relocatable object (UPX1HEAD section
      # still present) beside a text section map; carving one from the
      # compressor runs its section table into that map. Packed programs
      # never keep UPX1HEAD, so this does not exempt corrupted payloads.
      - id: metadata/build/protector::upx1head-stub-section
    # An ELF carved from a firmware container keeps only what its host
    # stored: NVIDIA GSP firmware packs stripped RISC-V images back to back in
    # `.fwimage`, so each carve's section table lands in the next image. The
    # host explains that, not evasion.
    downgrade:
      scope: file-or-parent
      any:
        - id: metadata/binary/section/name::fwimage-section
