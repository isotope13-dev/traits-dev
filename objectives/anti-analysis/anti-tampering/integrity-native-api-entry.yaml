defaults:
  platforms:
  - macos
  for:
  - macho
  crit: suspicious
  conf: 0.97
traits:
- id: paired-api-entry-detour-check-x64
  desc: Disables API pointer on INT3/JMP entry bytes
  if:
    type: yara
    source: |
      rule paired_api_entry_detour_check_x64 {
        strings:
          $check = { 0F B6 10 81 FA CC 00 00 00 74 ?? 81 FA E9 00 00 00 74 ?? 0F B6 11 81 FA E9 00 00 00 74 ?? 81 FA CC 00 00 00 75 ?? 48 C7 05 ?? ?? ?? ?? 00 00 00 00 31 C0 }
        condition:
          $check
      }
- id: paired-api-entry-detour-check-arm64
  desc: Rejects paired BRK or trampoline entries
  if:
    type: yara
    source: |
      rule paired_api_entry_detour_check_arm64 {
        strings:
          $check = { (0? | 1?) 0A 80 52 (0? | 1?) 00 AB 72 ?? 01 40 B9 ?? 01 ?? 6B ?? ?? ?? 54 (0? | 1?) 84 BA 52 ?? 3D 0B 12 ?? 01 ?? 6B ?? ?? ?? 54 ?? 01 40 B9 ?? 01 ?? 6B ?? ?? ?? 54 ?? 3D 0B 12 ?? 01 ?? 6B ?? ?? ?? 54 ?? 00 80 D2 ?? ?? ?? F9 }
        condition:
          $check
      }
