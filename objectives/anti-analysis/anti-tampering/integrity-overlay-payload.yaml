# Crypter stubs key their appended payload with a MAC over the embedded key
# and sizes, and refuse to decrypt when it does not verify. Patching the
# overlay, the trailer or the stub's key (to extract or neuter the payload)
# makes the loader exit silently instead of revealing the plaintext. A
# signed-update stub verifies a signature, not a shared-key HMAC, and does not
# run the result from an anonymous memfd.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: B0032
composite_rules:
  - id: hmac-gated-overlay-memfd-loader
    desc: Overlay stub runs payload only if HMAC verifies
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/crypto/verify::hmac-verification-failure-message
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: metadata/binary/layout/overlay::elf-overlay-entropy-over-75
      - id: micro-behaviors/mem/anonymous/create::x64-memfd-call-arguments
