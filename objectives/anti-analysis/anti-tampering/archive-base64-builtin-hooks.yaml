defaults:
  platforms: [unix, windows]

traits:
  - id: builtin-binary-embedded-base64-gz
    desc: Built-in base64-encoded gzip content hook
    crit: notable
    conf: 0.85
    for: [gz]
    if:
      type: basename
      exact: __cleave_builtin_base64_gz_hook__

  - id: builtin-binary-embedded-base64-zip
    desc: Built-in base64-encoded ZIP content hook
    crit: notable
    conf: 0.85
    # The finding is attached to the script that held the literal, not only
    # the decoded zip layer.
    for: [javascript, zip]
    if:
      type: basename
      exact: __cleave_builtin_base64_zip_hook__

  - id: builtin-binary-embedded-base64-xz
    desc: Built-in base64-encoded XZ content hook
    crit: notable
    conf: 0.85
    for: [xz]
    if:
      type: basename
      exact: __cleave_builtin_base64_xz_hook__

  - id: builtin-binary-embedded-base64-lzma
    desc: Built-in base64-encoded LZMA content hook
    crit: notable
    conf: 0.85
    for: [data]
    if:
      type: basename
      exact: __cleave_builtin_base64_lzma_hook__

  - id: builtin-binary-embedded-base64-bz2
    desc: Built-in base64-encoded bzip2 content hook
    crit: notable
    conf: 0.85
    for: [data, bz2, python]
    if:
      type: basename
      exact: __cleave_builtin_base64_bz2_hook__

  - id: builtin-binary-embedded-base64-pe
    desc: Built-in base64-encoded PE payload hook
    crit: suspicious
    conf: 0.95
    for: [javascript, data, zip, npm, tar]
    if:
      type: basename
      exact: __cleave_builtin_base64_pe_hook__

  - id: builtin-binary-embedded-base64-powershell
    desc: Built-in base64-encoded PowerShell payload hook
    crit: suspicious
    conf: 0.95
    for: [powershell, shell]
    if:
      type: basename
      exact: __cleave_builtin_base64_powershell_hook__
