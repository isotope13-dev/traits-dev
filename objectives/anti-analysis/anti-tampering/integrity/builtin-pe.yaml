defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: builtin-objectives-anti-analysis-pe-tampering-corrupted-header
    desc: Built-in PE corrupted header finding hook
    crit: suspicious
    conf: 0.85
    if:
      type: basename
      exact: __cleave_builtin_pe_corrupted_header_hook__
    unless:
      - id: metadata/package/testing/presence/harness::binary-test-directory
      # cargo-binstall's signing E2E uses a deliberately malformed 97-byte
      # PE fixture; the basename and size identify that fixture without
      # suppressing malformed-header findings in ordinary binaries.
      - id: metadata/package/testing/harness/pe-fixture::tiny-pe-signing-test-fixture

composite_rules:
  - id: malformed-pe-command-sabotage
    desc: Malformed PE carries executable sabotage
    crit: hostile
    conf: 0.999
    attack: "T1027,T1059.003"
    all:
      - id: metadata/binary/metrics/structural::multiple-pe-parser-errors
      - id: objectives/impact/degrade/system/file::cmd-executable-extension-die-rename
