defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: paired-api-entry-detour-check-x64
    desc: Disables API pointer on INT3/JMP entry bytes
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      # Two function pointers are read from globals. Their first bytes are
      # checked for INT3 (CC) and near JMP (E9); a hit clears a cached pointer.
      # These are instruction constants, not API-name hashes or campaign data.
      # Scan the container so an x64 slice also matches in an ARM-preferred fat file.
      source: |
        rule paired_api_entry_detour_check_x64 {
          strings:
            $check = { 0F B6 10 81 FA CC 00 00 00 74 ?? 81 FA E9 00 00 00 74 ?? 0F B6 11 81 FA E9 00 00 00 74 ?? 81 FA CC 00 00 00 75 ?? 48 C7 05 ?? ?? ?? ?? 00 00 00 00 31 C0 }
          condition:
            $check
        }

  - id: paired-api-entry-detour-check-arm64
    desc: Rejects paired BRK or trampoline entries
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      # Read two API entry instructions. Both are compared against an
      # LDR-literal trampoline and masked BRK, followed by clearing the
      # cached pointer on a hit. Branch offsets and pointer displacement vary.
      source: |
        rule paired_api_entry_detour_check_arm64 {
          strings:
            $check = { (0? | 1?) 0A 80 52 (0? | 1?) 00 AB 72 ?? 01 40 B9 ?? 01 ?? 6B ?? ?? ?? 54 (0? | 1?) 84 BA 52 ?? 3D 0B 12 ?? 01 ?? 6B ?? ?? ?? 54 ?? 01 40 B9 ?? 01 ?? 6B ?? ?? ?? 54 ?? 3D 0B 12 ?? 01 ?? 6B ?? ?? ?? 54 ?? 00 80 D2 ?? ?? ?? F9 }
          condition:
            $check
        }
