defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: paired-api-entry-detour-check-x64
    desc: Disables API pointer on INT3/JMP entry bytes
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      # Two function pointers are read from globals. Their first bytes are
      # checked for INT3 (CC) and near JMP (E9); a hit clears a cached pointer.
      # These are instruction constants, not API-name hashes or campaign data.
      # Scan the container so an x64 slice also matches in an ARM-preferred fat file.
      source: |
        rule paired_api_entry_detour_check_x64 {
          strings:
            $check = { 0F B6 10 81 FA CC 00 00 00 74 ?? 81 FA E9 00 00 00 74 ?? 0F B6 11 81 FA E9 00 00 00 74 ?? 81 FA CC 00 00 00 75 ?? 48 C7 05 ?? ?? ?? ?? 00 00 00 00 31 C0 }
          condition:
            $check
        }
