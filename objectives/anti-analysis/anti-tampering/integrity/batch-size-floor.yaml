# `if %~z0 lss <bytes> exit` aborts when the script file is shorter than the
# size it was built at. Paired with an obfuscated in-memory scriptblock, the
# check keeps a truncated embedded payload from running.
defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-file-size-floor
    desc: Batch exits when file is short
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bif\s+%~z0\s+(lss|leq)\s+\d{5,}\s+exit\b'

composite_rules:
  - id: batch-size-gated-scriptblock-loader
    desc: Batch size-gates an obfuscated scriptblock loader
    crit: hostile
    conf: 0.96
    attack: T1027
    all:
      - id: batch-file-size-floor
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::batch-fragment-built-powershell-scriptblock-loader
