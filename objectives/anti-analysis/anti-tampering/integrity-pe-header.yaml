# PE headers bent to defeat parsers while the image stays loadable or
# carvable (filefacts `pe.header.*`, read before any parse): bytes prepended
# before `MZ`, an overwritten `PE\0\0` signature, a header area padded with
# one repeated byte, and a nonempty PE image whose machine type the parser
# cannot read. Empty `.exe` placeholders are not evidence of header tampering.
defaults:
  crit: suspicious
  platforms: [windows]
  for: [pe]
  mbc: B0001
  attack: T1027

traits:
  - id: pe-prefix-before-mz
    desc: Bytes prepended before the MZ header
    conf: 0.9
    if:
      type: value
      path: pe.header.mz_offset
      exists: true
  - id: pe-nt-signature-overwritten
    desc: PE signature at e_lfanew overwritten
    conf: 0.85
    if:
      type: value
      path: pe.header.nt_signature
      exists: true
  - id: pe-header-byte-padding
    desc: PE header padded with one repeated byte
    conf: 0.9
    if:
      type: metrics
      field: pe.header.dominant_byte_ratio
      min: 0.4
  - id: pe-unparseable
    desc: PE parser fails on nonempty file
    conf: 0.85
    size_min: 64
    if:
      type: value
      path: pe.machine
      exists: false
    unless:
      # A 97-byte image rejected by multiple parsers is a structural
      # micro-image form; rejection alone does not establish hostile intent.
      - id: metadata/binary/header/malformed::pe-97-byte-nonstandard-name-parser-failures
