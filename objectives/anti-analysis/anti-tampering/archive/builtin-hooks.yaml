defaults:
  platforms: [unix, windows]

traits:
  - id: builtin-anti-analysis-archive-path-traversal
    desc: Built-in archive path traversal finding hook
    crit: suspicious
    conf: 0.9
    # ZIP and TAR have dedicated types; 7z, RAR, CAB, and the remaining general
    # container parsers use the generic archive type.
    for: [zip, tar, cab]
    if:
      type: basename
      exact: __cleave_builtin_path_traversal_hook__
    unless:
      # Nested archive hooks are evaluated before outer-scope exception
      # composites. Suppress parser regression archives by their own fixture
      # path so a deliberately escaping member does not taint its wrappers.
      - id: metadata/package/testing/presence/integration::nested-testdir-archive-path
      - id: metadata/package/testing/presence/integration::integration-assets-archive-path
      # The extraction guard also rejects empty/root-only names, but those are
      # malformed members rather than paths that can escape the destination.
      - id: metadata/package/files/archive-member::no-path-traversal-members
      - id: metadata/file/archive::archive-parse-error
      - id: archive-path-traversal-safe-context
      - id: metadata/package/testing/presence/integration::traversal-archive-regression-fixture-basename
      - id: metadata/package/testing/presence/integration::archive-reader-fixture-bundle-path
      - id: metadata/package/files/bsd::openbsd-pkg-rcscript-manifest
      - type: basename
        regex: '\.pkg$'

  - id: builtin-anti-analysis-archive-symlink-escape
    desc: Absolute or escaping archive symlink
    crit: suspicious
    conf: 0.9
    for: [zip, tar]
    if:
      type: basename
      exact: __cleave_builtin_symlink_escape_hook__
    unless:
      - id: pkg-safe-symlink-archive-context
      # Recognized system-package containers install through their own
      # tooling, which resolves payload symlinks itself: an absolute link
      # inside an APK/RPM/DEB/Arch package is packaging, not an extraction
      # escape. Referenced directly — the outer-scoped exception above does
      # not suppress this hook at scan time, this file-scoped context does.
      - id: system-package-archive-context

  # Engine emits anti-analysis/archive/zip-bomb for high compression ratios.
  # Library fuzz corpora and scientific array datasets intentionally ship
  # extreme-ratio members; suppress those, keep real bombs elsewhere.
  - id: builtin-anti-analysis-archive-zip-bomb
    desc: Built-in archive zip-bomb finding hook
    crit: suspicious
    conf: 0.9
    for: [zip, gz, bz2]
    if:
      type: basename
      exact: __cleave_builtin_zip_bomb_hook__
    unless:
      - id: metadata/package/testing/scripted::go-fuzz-corpus-zip-member
      # Go fuzz corpora ship raw fuzzer inputs named <sha1>[-<index>] inside
      # testdata zips; mutated entries can claim absurd uncompressed sizes
      # purely to exercise the parser's ratio guard. Nested archive layers
      # are rebased, so suppress on the entry name itself.
      - id: metadata/package/testing/scripted::go-fuzz-corpus-entry-basename
      - id: metadata/package/testing/scripted::zip-bomb-regression-fixture-basename
      - id: metadata/package/manager::go-module-source-archive
      - id: well-known/lib/runtime/scripted/php-runtime::phpt-test-file-basename
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
      - id: well-known/tool/packaging/composer::composer-docker-library-image-context
      - id: metadata/file/format/serialization::high-ratio-data-fixture

  # Engine emits anti-analysis/archive/hostile-entry-name when a ZIP local header
  # advertises an implausible name length (Go module proxy zips can trigger this
  # on misaligned headers while central-directory paths are sane).
  - id: builtin-anti-analysis-archive-hostile-entry-name
    desc: Built-in archive hostile-length entry name hook
    crit: suspicious
    conf: 0.9
    for: [zip, tar]
    if:
      type: basename
      exact: __cleave_builtin_hostile_entry_name_hook__
    unless:
      - id: metadata/build/archive::github-versioned-source-archive-member
      - id: metadata/build/archive::source-archive-member
      - id: metadata/build/archive::go-archive-tar-malformed-header-fixture

composite_rules:
  - id: archive-path-traversal-safe-context
    desc: Benign archive path traversal context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      # Covers archive-test-directory-member-path and the source-tree test
      # path atoms alongside it.
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/sast::trufflehog-package-exception
      - id: metadata/package/testing/scripted::go-fuzz-corpus-archive-member
      - id: metadata/package/manager::go-module-source-archive
      # dpkg tar streams conventionally include a root `./` member, which the
      # extractor skips but currently reports through the traversal hook.
      - id: metadata/package/files/system-package::debian-package-archive
      - id: metadata/build/archive::opa-policy-bundle-manifest
      - id: metadata/build/archive::opa-docs-static-bundle-path
      - id: metadata/build/archive::opa-bundle-layout-marker
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/lib/media/node-tikzjax::bundled-tex-resource-archive
  - id: pkg-safe-symlink-archive-context
    desc: Recognized package archive with intentional symlinks
    crit: exception
    conf: 0.98
    scope: outer
    any:
      - id: metadata/package/testing/presence/
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: metadata/package/manager::go-module-source-archive
      - id: metadata/package/files/bsd::pkgsrc-package-archive-context
      - id: metadata/package/files/bsd::pkgsrc-maintainer-archive-context
      - id: metadata/package/files/bsd::pkgsrc-maintainer-script-basename
      - id: archive-package-context
      # Any well-formed RPM, not a list of vendors.
      #
      # The first fix here added Fedora to the signed-vendor list beside SUSE,
      # Rocky and Qubes -- and then TorGuard's RPM turned up with the same
      # finding, which is the tell that the list was the wrong shape. A
      # relative symlink in an RPM payload (`/usr/bin/torguard ->
      # ../lib/torguard/torguard`) is not an escape attempt; it is what the
      # format is for. The escape-during-extraction threat this hook exists
      # for belongs to archives a user unpacks by hand, not to a package
      # format installed through rpm's own path handling.
      #
      # Reached directly rather than through `system-package-archive-context`:
      # a composite over an archive-scoped composite resolves inconsistently,
      # and going the long way left the finding in place.
      - id: metadata/package/files/system-package::rpm-package-payload-archive
      - id: well-known/lib/runtime/scripted/electron::electron-source-symlink-archive-context
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: system-package-archive-context
      - id: peazip-package-context
      - id: metadata/package/files/bsd::guile-slib-package-archive-basename
      - id: well-known/dual-use/tunnel/tailscale::tailscale-source-token
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member

  - id: archive-package-context
    desc: Recognized package archive context
    crit: exception
    conf: 0.96
    platforms: [linux]
    for: [tar]
    any:
      - id: well-known/app/data/grafana::grafana-mimir-runtime
      - id: well-known/app/data/trino::wolfi-trino-plugin-package
      - id: well-known/tool/sysadmin/k3s::k3s-container-archive
      - id: well-known/app/system/unionlabs::unionlabs-testnet-release-bundle
  - id: system-package-archive-context
    desc: Recognized system package archive context
    crit: exception
    conf: 0.96
    any:
      - id: metadata/package/files/system-package::alpine-versioned-apk-filename
      - id: metadata/package/files/system-package::arch-pkginfo-manifest
      # Any well-formed RPM header, for the reason spelled out on
      # `pkg-safe-symlink-archive-context` above: the four signed-distro
      # carve-outs that used to sit here (SUSE, Fedora, Rocky, Qubes) were a
      # vendor list standing in for the format, and TorGuard's RPM was the
      # counter-example that showed the shape was wrong. A parsed RPM name is
      # the fact this rule actually wants.
      - id: metadata/package/files/system-package::rpm-package-payload-archive
      - id: metadata/package/files/system-package::debian-package-archive
      - id: metadata/package/files/system-package::debian-package-filename
  - id: peazip-package-context
    desc: Recognized PeaZip package context
    crit: exception
    conf: 0.96
    any:
      - id: well-known/app/storage/peazip::peazip-linux-package-context
      - id: well-known/app/storage/peazip::peazip-macos-context
