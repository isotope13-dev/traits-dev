# Engine emits binary/embedded/base64-{gz,zip,xz,lzma,bz2,pe} when a decoded
# base64 string literal contains a compressed container or PE image.
# Integration-test fixtures (Firefox profile tar.xz blobs, fuzz corpora) and
# documented native-addon bundles (Haril) are benign.
defaults:
  platforms: [unix, windows]

traits:
  - id: builtin-binary-embedded-base64-gz
    desc: Built-in base64-encoded gzip payload hook
    crit: suspicious
    conf: 0.85
    for: [gz]
    if:
      type: basename
      exact: __cleave_builtin_base64_gz_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/file/naming::test-directory-component

  - id: builtin-binary-embedded-base64-zip
    desc: Built-in base64-encoded ZIP payload hook
    crit: suspicious
    conf: 0.85
    # The finding is attached to the script that held the literal, not only
    # the decoded zip layer.
    for: [javascript, zip]
    if:
      type: basename
      exact: __cleave_builtin_base64_zip_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/file/naming::test-directory-component
      # Python form tests embed OOXML ZIP documents as base64 data.
      - id: metadata/package/testing/presence/harness::python-test-file-content
      # sudo-prompt ships its macOS elevation applet as a base64 ZIP.
      # Directory layout keeps a sudo-prompt/ path. Bundled output is a single
      # sudo-prompt.js whose hook basename replaces the filename, so also
      # match the applet names that are inside the module and the ZIP.
      - type: path
        regex: '(^|/)sudo-prompt(\.js)?(/|##|$)'
      - type: text
        substr: sudo-prompt-applet
      - type: raw
        substr: sudo-prompt-script

  - id: builtin-binary-embedded-base64-xz
    desc: Built-in base64-encoded XZ payload hook
    crit: suspicious
    conf: 0.85
    for: [xz]
    if:
      type: basename
      exact: __cleave_builtin_base64_xz_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/file/naming::test-directory-component

  - id: builtin-binary-embedded-base64-lzma
    desc: Built-in base64-encoded LZMA payload hook
    crit: suspicious
    conf: 0.85
    for: [data]
    if:
      type: basename
      exact: __cleave_builtin_base64_lzma_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/file/naming::test-directory-component

  - id: builtin-binary-embedded-base64-bz2
    desc: Built-in base64-encoded bzip2 payload hook
    crit: suspicious
    conf: 0.85
    for: [data]
    if:
      type: basename
      exact: __cleave_builtin_base64_bz2_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/file/naming::test-directory-component

  - id: builtin-binary-embedded-base64-pe
    desc: Built-in base64-encoded PE payload hook
    crit: suspicious
    conf: 0.95
    for: [javascript, data, zip, npm, tar]
    if:
      type: basename
      exact: __cleave_builtin_base64_pe_hook__
    unless:
      - id: well-known/tool/forensics/haril::haril-documented-native-addon-context
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/file/naming::test-directory-component

composite_rules:
  - id: embedded-base64-compressed-test-fixture-context
    desc: Benign embedded base64 compressed test fixture
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: well-known/lib/development/browser-cookie3::browser-cookie3-package-archive
      - id: well-known/lib/development/browser-cookie3::browser-cookie3-test-fixture-context
      - id: metadata/package/manager::go-module-source-archive
      - id: metadata/package/testing/scripted::go-fuzz-corpus-archive-member
