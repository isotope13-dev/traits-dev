# Engine emits binary/embedded/base64-{gz,zip,xz,lzma,bz2} when a decoded
# base64 string literal contains a compressed container. Integration-test
# fixtures (Firefox profile tar.xz blobs, fuzz corpora) are benign.
defaults:
  platforms: [unix, windows]

traits:
  - id: builtin-binary-embedded-base64-gz
    desc: Built-in base64-encoded gzip payload hook
    crit: suspicious
    conf: 0.85
    for: [gz]
    if:
      type: basename
      exact: __cleave_builtin_base64_gz_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory

  - id: builtin-binary-embedded-base64-zip
    desc: Built-in base64-encoded ZIP payload hook
    crit: suspicious
    conf: 0.85
    for: [zip]
    if:
      type: basename
      exact: __cleave_builtin_base64_zip_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory

  - id: builtin-binary-embedded-base64-xz
    desc: Built-in base64-encoded XZ payload hook
    crit: suspicious
    conf: 0.85
    for: [xz]
    if:
      type: basename
      exact: __cleave_builtin_base64_xz_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory

  - id: builtin-binary-embedded-base64-lzma
    desc: Built-in base64-encoded LZMA payload hook
    crit: suspicious
    conf: 0.85
    for: [data]
    if:
      type: basename
      exact: __cleave_builtin_base64_lzma_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory

  - id: builtin-binary-embedded-base64-bz2
    desc: Built-in base64-encoded bzip2 payload hook
    crit: suspicious
    conf: 0.85
    for: [data]
    if:
      type: basename
      exact: __cleave_builtin_base64_bz2_hook__
    unless:
      - id: embedded-base64-compressed-test-fixture-context
      - id: metadata/package/testing/presence/harness::test-directory

composite_rules:
  - id: embedded-base64-compressed-test-fixture-context
    desc: Benign embedded base64 compressed test fixture
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: well-known/lib/development/browser-cookie3::browser-cookie3-package-archive
      - id: well-known/lib/development/browser-cookie3::browser-cookie3-test-fixture-context
      - id: metadata/package/manager::go-module-source-archive
      - id: metadata/package/testing/scripted::go-fuzz-corpus-archive-member
