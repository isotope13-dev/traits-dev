defaults:
  platforms: [unix, windows]
  for: [java, class]
  attack: T1497
traits:
  - id: java-classloader-packer-check
    desc: Java checks packer classloader name
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bpacker\b'
  - id: java-classloader-obfus-check
    desc: Java checks obfuscator classloader name
    crit: component
    conf: 0.86
    if:
      type: text
      substr: obfus
composite_rules:
  - id: java-self-integrity-repack-check
    desc: Java self-integrity repackaging check
    crit: suspicious
    conf: 0.95
    near_bytes: 65536
    unless:
      - id: well-known/lib/runtime/scripted/jruby/
      - id: well-known/lib/development/scala-compiler
    all:
      - id: micro-behaviors/crypto/hash/digest::java-sha256-name-reference
      - id: micro-behaviors/process/info/selfpath::java-protection-domain
    any:
      - id: micro-behaviors/data/archive/library::java-jarfile-reference
      - id: objectives/anti-analysis/anti-tampering::java-classloader-packer-check
      - id: objectives/anti-analysis/anti-tampering::java-classloader-obfus-check
