defaults:
  platforms: [unix, openwrt]
  for: [lua]
  attack: T1497

traits:
  - id: lua-suspicious-process-termination-log
    desc: Lua logs suspicious process termination
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: terminating suspicious process

composite_rules:
  - id: lua-process-tree-sanitizer
    desc: Lua process tree anti-analysis sanitizer
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/proc/info/path::lua-process-info-path
      - id: micro-behaviors/process/terminate/command::kill-force
    any:
      - id: micro-behaviors/process/debug/tool-markers::lua-strace-name-reference
      - id: micro-behaviors/process/debug/tool-markers::lua-ltrace-name-reference
      - id: micro-behaviors/process/debug/tool-markers::gdb-name-reference
      - id: micro-behaviors/communications/capture/tcpdump::lua-tcpdump-name-reference
      - id: well-known/tool/detection/wireshark::wireshark-name-reference
      - id: lua-suspicious-process-termination-log
    needs: 2
