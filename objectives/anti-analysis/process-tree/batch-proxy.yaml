defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: batch-execution-proxy
    desc: Writes and executes a batch file proxy to evade process tree monitoring
    crit: suspicious
    conf: 0.8
    attack: "T1059.003"
    all:
      - id: metadata/file/profile/process/shell::batch-launcher-content
    any:
      - id: metadata/file/profile/execution-api::batch-script-execution
      - id: micro-behaviors/fs/path/extension::bat-dup
