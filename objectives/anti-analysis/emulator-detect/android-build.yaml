# The report describes Android fingerprint, hardware and model checks before
# activation. Match the comparison itself, not a Build import plus a generic
# emulator word elsewhere. Tree-sitter call text retains the receiver that the
# current Java symbol projection omits. .NET Android exposes the same Build
# properties with PascalCase spelling; case folding handles that API binding.
defaults:
  platforms: [android]
  for: [java, csharp]
  crit: suspicious
  conf: 0.93
  attack: T1633.001

traits:
  - id: android-build-emulator-model-check
    desc: Checks Android model for emulator identifiers
    if:
      type: tree-sitter
      kind: call
      case_insensitive: true
      regex: '^(android\.os\.)?Build\.MODEL\.(contains|equals)\(\s*"(google_sdk|sdk_gphone)"'
