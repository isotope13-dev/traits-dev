# Self-modifying immediately upcoming code distinguishes this from a generic
# write or a distant jump. No CPU/emulator brand or sample key is required.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
traits:
  - id: dos-prefetched-nop-jump-patch
    desc: DOS replaces upcoming NOPs with backward jump
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_prefetched_nop_jump_patch {
          strings:
            $patch = { 2E C7 06 ?? ?? EB ?? 90 90 }
          condition:
            for any i in (1..#patch): (
              uint16(@patch[i]+3) == @patch[i]+7+0x100 and
              int8(@patch[i]+6) < -16 and
              @patch[i]+9+int8(@patch[i]+6) >= 0
            )
        }
