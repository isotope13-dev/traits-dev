# Self-modifying immediately upcoming code distinguishes this from a generic
# write or a distant jump. No CPU/emulator brand or sample key is required.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
traits:
  - id: dos-prefetched-nop-jump-patch
    desc: DOS replaces upcoming NOPs with backward jump
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_prefetched_nop_jump_patch {
          strings:
            $patch = { 2E C7 06 ?? ?? EB ?? 90 90 }
          condition:
            for any i in (1..#patch): (
              uint16(@patch[i]+3) == @patch[i]+7+0x100 and
              int8(@patch[i]+6) < -16 and
              @patch[i]+9+int8(@patch[i]+6) >= 0
            )
        }
  # Pushes a value onto the stack, records SP in BP, pops the value so [BP]
  # sits below SP, re-enables interrupts (STI), and loops until a hardware
  # interrupt clobbers [BP]. Emulators that do not deliver hardware timer
  # interrupts onto the guest stack spin forever.
  - id: dos-stack-below-sp-interrupt-gate
    desc: DOS spins on stack word below SP
    crit: suspicious
    conf: 0.98
    attack: T1497.001
    if:
      type: hex
      pattern: "(FA [0-4] 50 8B EC 58 FB 3B 46 00 75 ?? EB F9|FA [0-4] 50 8B EC 58 FB 39 46 00 75 ?? EB F9|FA [0-4] 53 8B EC 5B FB 3B 5E 00 75 ?? EB F9|FA [0-4] 51 8B EC 59 FB 3B 4E 00 75 ?? EB F9|FA [0-4] 52 8B EC 5A FB 3B 56 00 75 ?? EB F9)"

composite_rules:
  - id: dos-emulator-gate-encrypted-decryptor
    desc: DOS hardware-interrupt emulator gate guards encrypted stub
    crit: hostile
    conf: 0.98
    attack: T1497.001,T1027
    all:
      - id: dos-stack-below-sp-interrupt-gate
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-xor-loop-dispatch
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-delta-offset-dispatch
