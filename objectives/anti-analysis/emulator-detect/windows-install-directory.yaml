# Windows Android-emulator install folders named in one binary. One folder can
# be a launcher or support tool. Several distinct products named together is an
# environment probe, so the composite counts distinct products rather than
# repeated matches of one alternation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001

traits:
  - id: bluestacks-install-folder
    desc: Names the BlueStacks install folder
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Program Files( \(x86\))?\\BlueStacks'
  - id: nox-install-folder
    desc: Names the Nox install folder
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Program Files( \(x86\))?\\Nox'
  - id: ldplayer-install-folder
    desc: Names the LDPlayer install folder
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Program Files( \(x86\))?\\LDPlayer'
  - id: mumu-install-folder
    desc: Names the MuMu install folder
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Program Files( \(x86\))?\\MuMu'

composite_rules:
  - id: windows-emulator-install-folder-probe
    desc: Lists several emulator install folders
    crit: suspicious
    conf: 0.9
    scope: file
    any:
      - id: bluestacks-install-folder
      - id: nox-install-folder
      - id: ldplayer-install-folder
      - id: mumu-install-folder
    needs: 3
