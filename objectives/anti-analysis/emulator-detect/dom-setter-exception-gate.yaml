# `try{--document["bo"+"dy"]}catch(e){... e=window["eval"] ...}` decrements
# document.body. A real browser rejects the NaN assignment and throws, so
# the catch block runs and fetches eval; a script emulator or static JS
# sandbox without a typed DOM setter accepts the write silently, never
# enters the catch and never reaches the payload. No page needs to
# arithmetic-assign document.body, so the probe exists only to tell a
# browser from an analysis engine. Seen in injected iframe/script loaders
# on compromised sites, including their HTML and RSS/Atom responses.
#
# Counterexample: ordinary feature detection (`try{document.body.style}`),
# which reads rather than writes the node and does not gate eval.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, xml]
  attack: T1497,T1059.007
  mbc: B0009

traits:
  - id: document-body-arithmetic-write-probe
    desc: Arithmetic write to document.body inside try
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'try\s*\{\s*(--|\+\+)\s*document(\.body|\[[^\]]{1,24}\])\s*\}\s*catch'

composite_rules:
  - id: document-body-probe-gates-eval
    desc: document.body write probe gates eval lookup
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: document-body-arithmetic-write-probe
      - id: micro-behaviors/process/interpreter/eval/indirect::bracket-quoted-eval-lookup
