defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001
  mbc: B0009

composite_rules:
  - id: gpu-enumeration-benign-runtime-context
    desc: Graphics runtime or driver with legitimate GPU enumeration
    crit: exception
    conf: 0.95
    any:
      - id: well-known/lib/platform/wine/
      - id: well-known/app/system/drivers/
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: metadata/signed/certificate/identity::pe-signer-nvidia-corporation
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
      - id: well-known/lib/media/sdl/
      - id: well-known/lib/media/raylib::raylib-runtime-component
      - id: well-known/app/media/kmplayer::signed-kmplayer-executable
  - id: gpu-vendor-enumeration-check
    desc: GPU vendor enumeration check
    crit: suspicious
    conf: 0.94
    ref: sha256:a97d6fabe19316c920aed2004cb8d5ea3a699ce3a1a02c54ba60e0b6cabe9b64
    all:
      - id: micro-behaviors/os/sysinfo/hardware::enumerate-display-devices
      - id: micro-behaviors/os/sysinfo/hardware::gpu-vendor-marker-set
    unless:
      - id: gpu-enumeration-benign-runtime-context
      - id: metadata/signed/platform/
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/game/steam::valve-signed-steam-binary
