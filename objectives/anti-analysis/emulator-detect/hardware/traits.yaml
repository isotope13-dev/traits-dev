defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1497.001
  mbc: B0009
traits:
  - id: vmxh-string
    desc: VMXH hardware string
    crit: notable
    conf: 0.5
    if:
      type: text
      exact: VMXH
    unless:
      - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
      # s390x assembler tables in the Go toolchain name the AVMXH opcode
      # token as the bare string VMXH.
      - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-bin-path
      - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-tool-path
      - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
      - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-distribution
      # LLVM's target opcode tables contain VMXH as an instruction mnemonic;
      # it is not a VMware backdoor-channel probe in the LTO library.
      - id: well-known/lib/development/llvm::llvm-lto-library
  - id: vmmouse-string
    desc: vmmouse hardware string
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\bvmmouse\b
    unless:
      - type: basename
        regex: '(?i)(^|[\\/])vmmouse\.sys$'
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
      - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
      - id: well-known/app/utility/siw::siw-family-identity
composite_rules:
  - id: qemu-string
    desc: QEMU marker with multiple VM hardware probes
    crit: suspicious
    conf: 0.5
    all:
      - id: emulator-hardware-pair
    any:
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-qemu
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-vendor-string
    unless:
      - id: well-known/tool/sysadmin/kubernetes/minikube
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: well-known/app/network/gns3::gns3-gui-package-member
      - id: well-known/app/development/reg-devshell::developer-shell-application
      - id: well-known/lib/native/systemd::libsystemd-shared-library
      - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
      - id: well-known/tool/development/runtime/qemu::qemu-user-mode-emulator
      - id: well-known/app/utility/siw::siw-family-identity
  - id: vm-hardware
    desc: VM-specific hardware strings
    crit: suspicious
    conf: 0.6
    # One device name such as virtio is common in kernels, container
    # runtimes, and protocol schemas. VM inference needs two independent
    # hardware markers.
    needs: 2
    any:
      - id: vmxh-string
      - id: micro-behaviors/os/sysinfo/virtualization::virtio-reference
      - id: vmmouse-string
    unless:
      - id: well-known/tool/sysadmin/kubernetes/minikube
      - id: metadata/vendor/identity/
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: well-known/app/network/gns3::gns3-gui-package-member
      - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
      - id: well-known/app/utility/siw::siw-family-identity
  - id: emulator-hardware-pair
    desc: Multiple emulator hardware markers
    crit: component
    conf: 0.8
    needs: 2
    any:
      - id: vmxh-string
      - id: micro-behaviors/os/sysinfo/virtualization::virtio-reference
      - id: vmmouse-string
    unless:
      - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
  - id: multi-vendor-device-environment-probe
    for: [pe]
    desc: Multi-vendor VM and physical-drive probes
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-utf16-reference
      - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-utf16-reference
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/
      - id: metadata/vendor/identity/
      - id: well-known/app/finance/metatrader::metatrader-setup-manifest
      - id: well-known/app/system/iobit::iobit-signed-component-context
