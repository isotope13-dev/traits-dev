defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1497.001
  mbc: B0009

traits:
  # UPA3 routes unpacking through a dialog procedure so emulators that do not
  # implement the WM_INITDIALOG -> BM_CLICK sequence miss the next callback.
  # The control identifier varies between packer revisions.
  - id: upa-dialog-auto-click-emulation-gate
    desc: UPA dialog auto-click emulation gate
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .MPRESS1
      pattern: 8B 45 ?? 3D 10 01 00 00 75 ?? 6A ?? FF 75 ?? FF 15 ?? ?? ?? ?? ?? ?? ?? ?? ?? 33 C9 51 51 68 F5 00 00 00 50 FF 15 ?? ?? ?? ??
