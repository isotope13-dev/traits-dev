defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001
  mbc: B0009

composite_rules:
  # Crypter stub gate: CoInitializeEx must return S_OK then S_FALSE, and a
  # dynamically resolved CoGetClassObject(CLSID_VBScript, IID_IClassFactory)
  # must succeed. Only then does the dispatcher walk its stage table (kernel
  # base scan, VirtualAlloc, decode, VirtualProtect RX, jump); emulators that
  # stub COM fall through to an immediate return. The VBScript class factory
  # is never used, so the lookup exists only to test the environment.
  - id: com-vbscript-factory-emulation-gate
    desc: COM state and VBScript factory emulator gate
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/class-factory::vbscript-engine-clsid-binary
      - id: micro-behaviors/os/com/class-factory::cogetclassobject-name-string
    any:
      - id: micro-behaviors/os/com/runtime::coinitialize-twice-sok-sfalse-check-x86
      - id: micro-behaviors/os/com/runtime::coinitialize-twice-sok-sfalse-check-upx0
