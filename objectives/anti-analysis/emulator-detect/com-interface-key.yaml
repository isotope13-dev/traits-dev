# A loader that builds a COM `Interface\{IID}` key character by character
# and opens it through a registry function it resolved by name is checking
# for a real Windows registry: AV emulators carry no MSHTML interface
# registrations, so the open fails and the stub quits. The 2018 Dofoil /
# Smoke Loader crypter (MediaGet update hijack) opened
# HKCR\interface\{3050F557-98B5-11CF-BB82-00AA00BDCE0B}, exited after four
# failures, and keyed its payload offset on the key's default value.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001,T1480.001
  mbc: B0009

composite_rules:
  - id: hidden-registry-probe-of-com-interface-key
    desc: Constructed COM interface key opened through a registry API resolved by name
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/com/reference::interface-iid-registry-key-path
      - id: micro-behaviors/os/api-resolution/dynamic::registry-api-resolved-by-name

  - id: crypter-com-interface-emulator-gate
    desc: Crypter stub gates its payload on a hidden COM interface registry probe
    crit: hostile
    conf: 0.93
    all:
      - id: hidden-registry-probe-of-com-interface-key
    any:
      - id: objectives/anti-static/obfuscation/string/broken-api::runtime-repaired-api-stub
      - id: objectives/anti-static/obfuscation/decoy-imports::ddi-decoy-iat-crypter
      - id: objectives/execution/payload/memory-branch/buffer::x86-global-stack-pivot-indirect-jump
