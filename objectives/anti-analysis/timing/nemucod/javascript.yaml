defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: nemucod-jitter-check
    desc: Detects Nemucod-specific timing jitter check for VM evasion
    crit: hostile
    for: [javascript]
    all:
      - id: micro-behaviors/os/com/automation::wscript-host-object
      - id: micro-behaviors/time/query::js-date-now-difference-return
    any:
      - id: objectives/anti-static/obfuscation/string/conceal::save-to-file-fragment-oFil
      - id: micro-behaviors/data/property/access::js-fragmented-property-access
