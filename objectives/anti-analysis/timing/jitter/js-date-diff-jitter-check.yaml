defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - javascript
composite_rules:
  - id: js-date-diff-jitter-check
    desc: JavaScript date-difference timing check
    near_bytes: 500
    unless:
      - id: micro-behaviors/time/query/
    all:
      - type: text
        regex: 'return\s+[A-Za-z0-9_$]+\s*-\s*[A-Za-z0-9_$]+\s*;'
    any:
      - id: micro-behaviors/time/query::js-triple-date-now
      - id: micro-behaviors/time/query::js-triple-new-date
