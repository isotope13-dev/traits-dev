defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: csharp-time-gated-self-delete
    desc: Time gate precedes executable self-deletion
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule csharp_time_gated_self_delete {
          strings:
            $gate = /if[ \t]*\([^\n]{0,120}DateTime\.(Now|UtcNow)[^\n]{0,80}[<>]=?/
            $delete = /File\.Delete\([^\n]{0,100}Application\.ExecutablePath/
            $exit = /Environment\.Exit\(|Process\.GetCurrentProcess\(\)\.Kill\(/
          condition:
            all of them and @gate < @delete and @delete < @exit and @exit - @gate < 2048
        }
