# An editor extension that remembers when it first ran and measures days
# against it.
#
# Marketplace review is a one-shot observation: a reviewer (or a sandbox)
# installs the extension, opens an editor window, watches what `activate()`
# does, and moves on. An extension that writes `firstActivated` into
# `globalState` on its first run and then compares `Date.now()` against a
# multi-day offset is building the one thing that observation cannot see —
# a branch that is false for everybody who is watching and true for everybody
# who installed it and left. The gate survives restarts because the clock lives
# in the editor's own persistent storage rather than in memory.
#
# The timer alone is ordinary: plenty of honest extensions wait three days
# before asking for a review or offering a changelog. What makes this the
# evasive form is that there is nothing for the delay to be for. An extension
# with an empty `contributes.commands` puts nothing in the palette and shows the
# user no surface at all, and one that activates on `*` wakes for every window
# regardless. A nag timer belongs to a product that has something to nag about;
# a clock in a surfaceless startup hook is counting down to something that has
# not shipped yet.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, archives]
  attack: T1497.003
  mbc: B0003

composite_rules:
  - id: vscode-dormant-activation-clock
    desc: Surfaceless extension keeps a multi-day clock
    crit: suspicious
    conf: 0.9
    # The manifest facts and the timer live in different archive entries.
    scope: archive
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/package/manifest/entrypoint::vscode-empty-contributed-commands
      - id: metadata/permission/activation::activate-all-events
      - id: micro-behaviors/data/db/web-storage::vscode-global-state-access
      - id: micro-behaviors/time/timing/check::js-multi-hour-ms-duration
