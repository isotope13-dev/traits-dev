# A page-script payload that will not run for anyone who is watching it run.
#
# The protestware wave that started in 2022 (node-ipc, es5-ext,
# event-source-polyfill, sweetalert2) settled on one shape: pick the audience by
# the *user's* UI language and the *site's* country ccTLD, stamp the first visit
# into localStorage, and do nothing until several days have gone past that
# stamp. The two gates together are what makes this evasive rather than merely
# regional -- a reviewer opening the bundle, a CI browser, a sandbox and the
# maintainer who published it all fail the language test or the host test or
# both, and even a visitor who passes them sees nothing on the visit that would
# have been observed. The clock survives reloads because it lives in the
# browser's own persistent storage, so the delay is measured from installation
# rather than from page load.
#
# Each leg is ordinary alone: sites read `navigator.language` to translate
# themselves, check their own host, and keep first-run stamps for update nags.
# Requiring all of them inside one 1 KiB span is what leaves no benign reading:
# an honest "N days since first visit" banner does not additionally demand that
# the visitor's browser be set to a particular language *and* the site sit under
# a particular country's TLD before it will appear.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1497.003
  mbc: B0003

composite_rules:
  - id: russian-audience-dormant-activation-gate
    desc: Dormant Russia-gated browser payload trigger
    crit: hostile
    conf: 0.95
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-language
      - id: micro-behaviors/communications/http/url/path::browser-location-host-russian-tld-match
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
      - id: micro-behaviors/time/timing/check::js-elapsed-days-threshold
