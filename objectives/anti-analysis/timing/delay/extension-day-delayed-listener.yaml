# Dormancy gate: the extension's content-script listener (which serves the
# remotely fetched code) is only registered once a day has passed since a
# stored timestamp, so a reviewer or sandbox loading the fresh install sees
# a background page that does nothing.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1497.003,T1176
composite_rules:
  - id: extension-code-listener-armed-after-a-day
    desc: Extension arms code-serving listener after a day
    crit: hostile
    conf: 0.92
    near_bytes: 1500
    all:
      - id: micro-behaviors/time/schedule/delay::one-day-after-stamp-remaining-delay
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-computed-delay
      - id: micro-behaviors/browser-extension/lifecycle::runtime-port-getcode-action
