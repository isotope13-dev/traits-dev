defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1497.003
  mbc: B0007
composite_rules:
  # A persisted first-run timestamp that arms a multi-day-delayed effect is a
  # logic-bomb arming primitive: SweetAlert2 protestware plants its initiation
  # marker and waits days before sabotaging the page, and sandbox-dodging
  # malware sleeps past analysis windows the same way. Trial and reminder
  # features share the shape, so this stays suspicious; whatever the delay
  # releases convicts on its own terms.
- id: persisted-first-run-delayed-arming
  desc: Persisted timestamp arms multi-day delayed effect
  crit: suspicious
  conf: 0.9
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
  - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
  - id: micro-behaviors/time/timing/check::js-elapsed-days-threshold
  any:
  - id: micro-behaviors/time/schedule/timeout::setTimeout
  - id: micro-behaviors/time/schedule/timeout::repeated-settimeout
  downgrade:
    scope: archive
    any:
      - id: metadata/package/documentation/claims::disclosed-sweetalert2-regional-routine-release
- id: deferred-concealed-import-beacon
  desc: Import-time beacon defers and hides its callout
  conf: 0.97
  all:
  - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
  - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke
