# A module that waits before it does anything observable. Install-time and
# import-time sandboxes watch a package for seconds, not minutes, so deferring
# the first network call past that window is the cheapest analysis evasion a
# supply-chain payload can buy -- and it also puts the traffic well clear of the
# `npm install` that caused it, which is what defeats a human watching the
# install run.
#
# The delay alone is neutral (see the atom's own note), so the composite below
# requires the whole stealth set around it: the endpoint arrives base64-encoded
# rather than written in the source, the call goes out over the Node HTTPS
# client, every failure is swallowed by an empty handler, and the lot runs from
# a module-scope IIFE that needs no export to be touched. A package with a real
# reason to defer work has no reason to also hide where it is calling and
# discard the result.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497.003
  mbc: B0007

composite_rules:
  - id: deferred-concealed-import-beacon
    desc: Import-time beacon defers and hides its callout
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke

  # Randomised launch delay in front of a dropped executable. Nothing about a
  # local file needs jitter: a retry backoff randomises because a *server* is
  # shared, and a splash timer uses a fixed number because a human is watching.
  # Spreading the start of a process you just wrote to disk over a random
  # window only buys one thing — the exec no longer lands inside the fixed
  # observation window an install-time or import-time sandbox records, and two
  # runs of the same package no longer produce the same timeline to diff.
  - id: jittered-dropped-executable-launch
    desc: Random jitter delays launch of a dropped file
    crit: hostile
    conf: 0.95
    attack: "T1497.003,T1105"
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/staging/embedded::node-drop-executable-and-detach
    any:
      - id: micro-behaviors/time/schedule/delay::settimeout-random-delay
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
