# A hardcoded external redirect parked behind a long setTimeout (tens of
# seconds to hours). Short reviews and sandbox runs finish before the timer
# fires, so the page hijack is never observed. In an all-site content script
# this is a dormant hijack of whatever page the user is on.
defaults:
  platforms: [windows, unix]
  attack: T1497.003,T1176

composite_rules:
  - id: long-timer-hardcoded-redirect
    desc: Long timer guards a hardcoded external redirect
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_bytes: 700
    all:
      - id: micro-behaviors/ui/window/navigation/location::remote-page-location-assignment
    any:
      - id: micro-behaviors/time/schedule/delay::long-settimeout-delay
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay

  - id: all-site-content-script-dormant-redirect
    desc: All-site content script redirects pages only after a long delay
    crit: hostile
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: long-timer-hardcoded-redirect
