# A wildcard-activated editor extension, republished under a publisher that
# does not own the repository it names, that records its activation time in
# the editor's global state (firstActivated/lastActivated/initialized) and
# checks it against a multi-day offset.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript]
  attack: T1497.003,T1195.002

composite_rules:
  # Product identity is supported by Marketplace metadata, minified source,
  # or a compiled webpack bootstrap. A repackager can strip the Marketplace
  # stamp, so source/build evidence also admits republished products. Vue's
  # official publisher is excluded because its legitimate extensions can
  # share these traits.
  - id: republished-extension-activation-age-clock
    desc: Republished startup extension contains multi-day activation clock
    crit: hostile
    conf: 0.90
    scope: archive
    all:
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/package/repository::vsix-publisher-repo-owner-mismatch
      - id: micro-behaviors/data/db/write::vscode-global-activation-timestamps
      - id: micro-behaviors/time/timing/check::js-stamp-plus-days-compare
    needs: 1
    any:
      - id: metadata/package/author/identity::vscode-marketplace-metadata-present
      - id: metadata/build/minifier::minified-text-shape
      - id: metadata/build/bundler/runtime::webpack-require-bootstrap-implementation
    unless:
      - id: well-known/tool/development/vscode-extension/vue::official-publisher

  # Same clock, but for a hollow wrapper that has no Marketplace-stamped
  # metadata: a wildcard-activated extension with no commands of its own that
  # only depends on another extension, published under an identity that does
  # not own the repository it names. It does nothing yet; the multi-day
  # activation clock is the dormancy gate for a later update.
  - id: republished-wrapper-activation-age-clock
    desc: Republished hollow extension wrapper contains multi-day activation clock
    crit: hostile
    conf: 0.90
    scope: archive
    all:
      - id: metadata/package/runtime::vscode-dependency-wrapper-no-surface
      - id: metadata/package/repository::vsix-publisher-repo-owner-mismatch
      - id: micro-behaviors/data/db/write::vscode-global-activation-timestamps
      - id: micro-behaviors/time/timing/check::js-stamp-plus-days-compare

  # A BasedPyright-identified clone that adds the activation-age gate. The
  # package identity is the BasedPyright repository; the clock is the sleeper.
  # A Rainbow CSV clone that adds the same activation-age gate. Product identity
  # comes from the manifest name, display name or upstream repository; the
  # republished copy usually keeps those while stripping the Marketplace stamp
  # and bundling, so the generic composite above cannot see it.
  - id: rainbow-csv-clone-activation-age-clock
    desc: Rainbow CSV clone adds multi-day activation clock
    crit: hostile
    conf: 0.92
    for: [vsix, package.json, javascript]
    scope: archive
    all:
      - id: metadata/permission/activation::activate-all-events
      - id: micro-behaviors/data/db/write::vscode-global-activation-timestamps
      - id: micro-behaviors/time/timing/check::js-stamp-plus-days-compare
    any:
      - id: well-known/tool/development/vscode-extension/rainbow-csv::vscode-name
      - id: well-known/tool/development/vscode-extension/rainbow-csv::display-name
      - id: well-known/tool/development/vscode-extension/rainbow-csv::upstream-repository
    needs: 1
    unless:
      - id: well-known/tool/development/vscode-extension/rainbow-csv::official-publisher

  - id: basedpyright-clone-activation-age-clock
    desc: BasedPyright clone adds multi-day activation clock
    crit: hostile
    conf: 0.92
    for: [vsix, package.json, javascript]
    scope: archive
    all:
      - id: well-known/tool/development/vscode-extension/basedpyright::official-repository
      - id: metadata/permission/activation::activate-all-events
      - id: micro-behaviors/data/db/write::vscode-global-activation-timestamps
      - id: micro-behaviors/time/timing/check::js-stamp-plus-days-compare
    unless:
      - id: well-known/tool/development/vscode-extension/basedpyright::official-publisher
