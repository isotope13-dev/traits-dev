# A wildcard-activated editor extension, republished under a publisher that
# does not own the repository it names, that records its activation time in
# the editor's global state and checks it against a multi-day offset. In the
# observed republishes the clock is injected at the top of activate() and
# nothing reads it yet: a dormancy timer staged for a later update to gate a
# payload on, so analysis in a fresh sandbox never sees the later behavior.
# Review-prompt timers share the shape in first-party builds, which is why
# the republish context is required and the rule stays suspicious until a
# payload hangs off the clock. All legs are atoms so the archive scope can
# join the manifest to the bundled code.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript]
  attack: T1497.003
composite_rules:
  - id: republished-extension-activation-age-clock
    desc: Republished startup extension keeps a multi-day activation clock in global state
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/package/repository::vsix-publisher-repo-owner-mismatch
      - id: micro-behaviors/data/db/access::vscode-global-state-access
      - id: micro-behaviors/time/timing/check::js-stamp-plus-days-compare
