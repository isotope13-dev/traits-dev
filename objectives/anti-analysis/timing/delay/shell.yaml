# Randomized delays in shell scripts. A fixed `sleep 5` is a wait; a sleep
# whose length is drawn from a random source is a *jitter*, and jitter exists
# to break the regular timing an automated analyzer or a beacon-detection rule
# keys on. Neutral enough on its own -- cron scripts jitter to spread load --
# so this stays notable and gets its meaning from what surrounds it.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1497.003
  mbc: B0003

traits:
  - id: shell-randomized-sleep-interval
    desc: Sleeps for a randomized interval
    crit: notable
    conf: 0.85
    if:
      # Covers both spellings: `sleep $((RANDOM % 5))` and the sub-second form
      # `sleep "$(awk 'BEGIN{srand(); print rand()}')"`, which shell alone
      # cannot express.
      type: text
      regex: '(?i)sleep\s[^\n]{0,60}(RANDOM|rand\()'
