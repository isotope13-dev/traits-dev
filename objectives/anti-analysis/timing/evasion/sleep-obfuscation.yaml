defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.003
traits:
- id: rust-sleepmask-cronos-module
  desc: Rust library exports a Cronos sleep module
  crit: notable
  conf: 0.92
  for: [rust]
  platforms: [windows, unix]
  if:
    type: value
    path: source.rust.modules[*].name
    exact: cronos
- id: rust-sleepmask-rusty-cronos-module
  desc: Rust library exports a RustyCronos sleep module
  crit: notable
  conf: 0.92
  for: [rust]
  platforms: [windows, unix]
  if:
    type: value
    path: source.rust.modules[*].name
    exact: rusty_cronos
- id: rust-sleepmask-hwbp-module
  desc: Rust hardware-breakpoint sleep module
  crit: notable
  conf: 0.92
  for: [rust]
  platforms: [windows, unix]
  if:
    type: value
    path: source.rust.modules[*].name
    exact: hwbp_sleeper
- id: source-sleep-obf-technique-config
  desc: "src config selects sleep obfuscation technique"
  crit: suspicious
  conf: 0.96
  for: [c, cpp]
  if:
    type: text
    word: implant.sleep-obf.technique
- id: source-sleep-obf-start-addr-config
  desc: "src config sets sleep obf start address"
  crit: suspicious
  conf: 0.96
  for: [c, cpp]
  if:
    type: text
    word: implant.sleep-obf.start-addr
- id: source-sleep-obf-menu-foliage
  desc: Source exposes Foliage sleep option
  crit: notable
  conf: 0.95
  for: [c, cpp]
  if:
    type: text
    word: Foliage
- id: source-sleep-obf-menu-ekko
  desc: Source exposes Ekko sleep option
  crit: component
  conf: 0.95
  for: [c, cpp]
  if:
    type: text
    word: Ekko
- id: source-thread-start-spoof-config
  desc: Source config spoofs thread start address
  crit: suspicious
  conf: 0.95
  attack: T1055
  for: [c, cpp]
  if:
    type: text
    word: inject.spoofaddr
composite_rules:
- id: rust-sleep-mask-library-suite
  desc: Rust library exports three sleep-obfuscation techniques
  crit: notable
  conf: 0.94
  for: [rust]
  platforms: [windows, unix]
  all:
  - id: rust-sleepmask-cronos-module
  - id: rust-sleepmask-rusty-cronos-module
  - id: rust-sleepmask-hwbp-module
- id: rust-ekko-image-sleep-obfuscation
  desc: Rust timer callbacks RC4-mask the current PE image during sleep
  crit: suspicious
  conf: 0.97
  for: [rust]
  near_bytes: 16000
  all:
  - id: micro-behaviors/time/schedule/callback::rust-create-timer-queue-timer-reference
  - id: micro-behaviors/crypto/symmetric/stream/rc4::arc4-routine-symbol
  - id: micro-behaviors/dylib/lookup::rust-get-module-handle-wide-reference
  - id: micro-behaviors/process/control/wait::rust-wait-for-single-object-reference
  - id: micro-behaviors/data/format/executable/header::pe-image-size-field
- id: sleep-obfuscation-loader
  desc: Shellcode loader with sleep-obfuscation memory cycling
  crit: hostile
  conf: 0.95
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: micro-behaviors/mem/protect/constant::repeated-rw-rx-page-flag-sequence
  any:
  - id: objectives/evasion/process/injection/shellcode::concealed-shellcode-loader-x64
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-walk-hash-resolver-x64
  unless:
  - id: metadata/binary/framework/
  - id: metadata/lang/compiler/native::libllvm
- id: source-sleep-obf-menu-suite
  desc: Source exposes multiple sleep obfuscation menu options
  crit: suspicious
  conf: 0.96
  for: [c, cpp]
  needs: 2
  any:
  - id: source-sleep-obf-menu-foliage
  - id: source-sleep-obf-menu-ekko
  - id: micro-behaviors/process/control/wait::wait-for-single-object-ex-reference
- id: source-sleep-obfuscation-config
  desc: Source code configures sleep obfuscation techniques
  crit: suspicious
  conf: 0.97
  for: [c, cpp]
  all:
  - id: source-sleep-obf-technique-config
  - id: source-sleep-obf-start-addr-config
  any:
  - id: source-sleep-obf-menu-suite
  - id: source-thread-start-spoof-config
