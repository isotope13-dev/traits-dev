# VB6 form source can compare a Sleep interval against GetTickCount to detect
# emulators that skip or accelerate the delay, then stop in a sandbox.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1497.003
  mbc: B0003.003

traits:
  - id: vb6-tickcount-sleep-delta-probe
    desc: GetTickCount comparison around a Sleep call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)GetTickCount.{0,400}Sleep\s+\d+.{0,400}GetTickCount.{0,200}>\s*\d+'

  - id: vb6-sandbox-result-exit-gate
    desc: Exits when a sandbox check returns true
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)If\s+Is\w*Sandbox\s*=\s*True\s+Then\s+End\b'
