defaults:
  for: [macho]
  platforms: [macos]
  conf: 0.98
  attack: T1497.003

traits:
  - id: elapsed-time-key-corruption
    desc: Timer selects an XOR-mutated big-endian word
    crit: suspicious
    # Retain the existing scope for compact payload stages. Cleave anchors
    # each alternative on its fixed bytes, then verifies this full pattern;
    # a partial byte sequence no longer triggers a per-byte branch walk.
    size_max: 33554432
    if:
      type: yara
      # Inspect the complete universal image so a non-preferred x64 slice's
      # timer/key mutation remains visible. Every original alternative stays.
      source: |
        rule elapsed_time_key_corruption {
          strings:
            $mutation = { (4C 29 ?? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 0F 42 ?? 0F C9 89 8C 24 ?? ?? ?? ?? | 4C 29 ?? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 0F 42 ?? 0F C9 89 4C 24 ?? | 4C 29 ?? 4? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 4? 0F 42 ?? 0F C9 89 4C 24 ?? | 4C 29 ?? 4? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 4? 0F 42 ?? 0F C9 89 8C 24 ?? ?? ?? ?? | 4C 29 ?? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 0F 42 ?? 0F C9 89 8D ?? ?? ?? ?? | 48 2B 85 ?? ?? ?? ?? 44 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 80 F0 FA 02 41 0F 46 ?? | C9 02 09 4A 0A 00 19 CB 0B 10 9E 52 4B 5F A0 72 5F 01 0B EB 29 81 96 1A 29 09 C0 5A | ?? 02 ?? 4A ?? 10 9E 52 ?? 5F A0 72 ?? 00 15 CB ?? 01 ?? EB ?? 81 ?? 1A ?? 09 C0 5A | ?? 02 ?? 4A ?? 00 15 CB ?? 10 9E 52 ?? 5F A0 72 ?? 01 ?? EB ?? 81 ?? 1A ?? 09 C0 5A | ?? ?? ?? 52 ?? ?? ?? 72 ?? 02 ?? 4A ?? 00 ?? CB ?? 10 9E 52 ?? 5F A0 72 ?? 01 ?? EB ?? 81 ?? 1A ?? 09 C0 5A | 4C 29 ?? 4? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 4? 0F 42 ?? 0F C9 89 8D ?? ?? ?? ?? | ?? 00 15 CB ?? 10 9E D2 ?? 5F A0 F2 3F 01 ?? EB ?? 81 ?? 1A) }
          condition:
            $mutation
        }


composite_rules:
  - id: timing-sabotaged-payload-key
    desc: Slow inspection sabotages payload decryption
    crit: hostile
    all:
      - id: elapsed-time-key-corruption
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2-36-byte-password
      - id: micro-behaviors/crypto/decrypt::aes256-gcm-indirect-decrypt

  - id: timing-corruption-with-kdf-input-wipes
    desc: Timer key corruption with KDF-input buffer wipes
    crit: hostile
    conf: 0.97
    all:
      - id: elapsed-time-key-corruption
      - id: micro-behaviors/mem/fill::sequential-32-36-byte-wipes
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2-36-byte-password

  # API-entry checks and a timer-dependent key mutation are independent
  # anti-analysis roles. A system() import does not identify the payload
  # interpreter or demonstrate a source-to-shell handoff.
  - id: timing-key-mutation-with-api-detour-checks
    desc: Timer key mutation with API detour checks
    crit: hostile
    conf: 0.97
    attack: T1497.003,T1622
    all:
      - id: elapsed-time-key-corruption
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    any:
      - id: objectives/anti-analysis/anti-tampering/integrity::paired-api-entry-detour-check-x64
      - id: objectives/anti-analysis/anti-tampering/integrity::paired-api-entry-detour-check-arm64

  # Foxveil-class universal Mach-O loaders may omit the PBKDF2 byte
  # signature the timing-sabotaged-payload-key composite requires while
  # still pairing timer sabotage with the same masked LCG dispatch loop.
  - id: masked-dispatch-timing-anti-analysis-loader
    desc: Masked dispatch with timer-sabotaged payload key
    crit: hostile
    conf: 0.97
    attack: T1497.003,T1027
    all:
      - id: elapsed-time-key-corruption
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::masked-arithmetic-dispatch-state
