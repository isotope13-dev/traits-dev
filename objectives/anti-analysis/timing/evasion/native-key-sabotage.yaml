defaults:
  for: [macho]
  platforms: [macos]
  conf: 0.98
  attack: T1497.003

traits:
  - id: elapsed-time-key-corruption
    desc: Elapsed timer selects a corrupted key word
    crit: suspicious
    if:
      type: hex
      section: __text
      # Compare an elapsed timer delta to 50 ms. Above the threshold the
      # key's first word is XOR-corrupted, then stored in big-endian form.
      # The corruption mask and stack displacement are per-build values.
      pattern: '(4C 29 F8 89 D9 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 0F 42 CB 0F C9 89 8C 24 ?? ?? ?? ?? | 68 02 08 4A 0A 10 9E 52 4A 5F A0 72 0B 00 15 CB 7F 01 0A EB 08 81 93 1A 08 09 C0 5A)'

composite_rules:
  - id: timing-sabotaged-payload-key
    desc: Slow inspection sabotages payload decryption
    crit: hostile
    all:
      - id: elapsed-time-key-corruption
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2-36-byte-password
      - id: micro-behaviors/crypto/decrypt::aes256-gcm-indirect-decrypt
