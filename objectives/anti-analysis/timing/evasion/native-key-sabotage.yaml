defaults:
  for: [macho]
  platforms: [macos]
  conf: 0.98
  attack: T1497.003

traits:
  - id: elapsed-time-key-corruption
    desc: Elapsed timer selects a corrupted key word
    crit: suspicious
    # Timing-sabotaged key checks live in compact payload stages. The
    # six-branch alternation costs O(file * branches) per __text slice, and
    # on the 150-250MB Mach-O images inside signed Electron DMGs it blows
    # the 90s per-rule evaluation budget, converting an ordinary framework
    # binary into a scanner-timeout finding. Bound the scope to payload
    # scale; engine-sized images are out of scope for this technique.
    size_max: 33554432
    if:
      type: hex
      section: __text
      # Compare an elapsed timer delta to 50 ms. Above the threshold the
      # key's first word is XOR-corrupted, then stored in big-endian form.
      # The corruption mask and stack displacement are per-build values.
      pattern: '(4C 29 ?? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 0F 42 ?? 0F C9 89 8C 24 ?? ?? ?? ?? | 4C 29 ?? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 0F 42 ?? 0F C9 89 4C 24 ?? | 4C 29 ?? 4? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 4? 0F 42 ?? 0F C9 89 4C 24 ?? | 4C 29 ?? 4? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 4? 0F 42 ?? 0F C9 89 8C 24 ?? ?? ?? ?? | 4C 29 ?? 89 ?? 81 F1 ?? ?? ?? ?? 48 3D 81 F0 FA 02 0F 42 ?? 0F C9 89 8D ?? ?? ?? ?? | C9 02 09 4A 0A 00 19 CB 0B 10 9E 52 4B 5F A0 72 5F 01 0B EB 29 81 96 1A 29 09 C0 5A | ?? 02 ?? 4A ?? 10 9E 52 ?? 5F A0 72 ?? 00 15 CB ?? 01 ?? EB ?? 81 ?? 1A ?? 09 C0 5A | ?? 02 ?? 4A ?? 00 15 CB ?? 10 9E 52 ?? 5F A0 72 ?? 01 ?? EB ?? 81 ?? 1A ?? 09 C0 5A)'

  # After the KDF, the same frame zeroes a 32-byte buffer and then a
  # 36-byte buffer. Those lengths are the salt and the password.
  # Hex section search sees one Mach-O slice. The wipe is on the x86_64
  # slice of a universal binary, so match the raw file.
  - id: sequential-salt-password-wipe
    desc: Sequential 32-byte and 36-byte wipes
    crit: notable
    size_max: 33554432
    if:
      type: yara
      source: |
        rule sequential_salt_password_wipe {
          strings:
            $wipe = { C6 84 05 ?? ?? ?? ?? 00 48 FF C0 48 83 F8 20 75 ?? 31 C0 C6 84 05 ?? ?? ?? ?? 00 48 FF C0 48 83 F8 24 75 }
          condition:
            $wipe
        }

composite_rules:
  - id: timing-sabotaged-payload-key
    desc: Slow inspection sabotages payload decryption
    crit: hostile
    all:
      - id: elapsed-time-key-corruption
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2-36-byte-password
      - id: micro-behaviors/crypto/decrypt::aes256-gcm-indirect-decrypt

  - id: timing-sabotaged-key-material-wipe
    desc: Slow path wipes derived key material
    crit: hostile
    conf: 0.97
    all:
      - id: elapsed-time-key-corruption
      - id: sequential-salt-password-wipe
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2-36-byte-password

  # Some native packers implement the KDF and authenticated decryptor
  # themselves, so library-specific byte signatures do not survive. A timer
  # that deliberately corrupts a key, an embedded encoded blob, and a shell
  # execution sink together still establish the same anti-analysis payload
  # execution chain.
  - id: timing-sabotaged-embedded-shell-payload
    desc: Timer-corrupted payload key gates embedded shell execution
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1140,T1497.003,T1059.004
    all:
      - id: elapsed-time-key-corruption
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/process/create/shell/spawn::system-fn

  # Foxveil-class universal Mach-O loaders may omit the PBKDF2 byte
  # signature the timing-sabotaged-payload-key composite requires while
  # still pairing timer sabotage with the same masked LCG dispatch loop.
  - id: masked-dispatch-timing-anti-analysis-loader
    desc: Masked dispatch with timer-sabotaged payload key
    crit: hostile
    conf: 0.97
    attack: T1497.003,T1027
    all:
      - id: elapsed-time-key-corruption
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::masked-arithmetic-dispatch-state
