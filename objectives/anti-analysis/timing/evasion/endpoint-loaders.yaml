defaults:
  for:
    - pe
  platforms:
    - windows
  attack: T1105
  mbc: B0011
composite_rules:
  - id: mixed-endpoint-timer-loader
    desc: Mixed-endpoint timer-gated Windows loader
    crit: hostile
    conf: 0.98
    size_max: 500000
    all:
      - id: micro-behaviors/communications/ip/endpoint::small-pe-external-ipv4-endpoint
      - id: micro-behaviors/communications/ip/endpoint::private-ipv4-port-10-binary
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/time/schedule/waitable::create-and-set-waitable-timer
    any:
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/debug::pdb-lowercase-basename-8-to-16
      - id: micro-behaviors/os/env/write::set-environment-variable-wide
    unless:
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
  - id: randomized-pdb-bootstrap-loader
    desc: Randomized PDB bootstrap loader profile
    crit: suspicious
    conf: 0.96
    size_max: 500000
    all:
      - id: metadata/binary/debug::pdb-lowercase-basename-8-to-16
      - id: micro-behaviors/fs/path/system/library::mscoree-dll-name
      - id: objectives/anti-analysis/timing/evasion::waitable-timer-sleep-mask
    any:
      - id: micro-behaviors/communications/ip/endpoint::small-pe-external-ipv4-endpoint
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: micro-behaviors/os/env/write::set-environment-variable-wide
