defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  mbc: B0001.032
  attack: T1497.001
composite_rules:
  - id: primitive
    desc: Hardware timing primitive (potential anti-analysis)
    crit: suspicious
    conf: 0.4
    all:
      - id: metadata/binary/instruction/opcode::repeated-rdtsc-bytes
    any:
      - id: micro-behaviors/time/query::clock_gettime
      - id: micro-behaviors/time/query::gettimeofday
      - id: micro-behaviors/time/query::time
