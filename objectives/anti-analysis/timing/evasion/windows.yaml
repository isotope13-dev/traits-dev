defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1497.003
  mbc: B0003.003
composite_rules:
  - id: timing-check-minimal-stub
    desc: Timing APIs in minimal binary
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: metadata/binary/code/complexity::no-functions
    unless:
      - id: metadata/binary/layout/size::large-binary-500k
      - id: metadata/binary/symbols/count::many-imports
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/build/manifest::pe-has-manifest
  - id: timing-sandbox-evasion
    desc: Timing and virtualization detection references
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/time/query::multiple-clock-api-references
    any:
      - id: objectives/anti-analysis/vm-detect/
      - id: micro-behaviors/os/virtualization/hypervisor::hyperv-vendor-reference
      - id: objectives/anti-analysis/sandbox-detect/inline/
  - id: waitable-timer-sleep-mask
    desc: Waitable-timer RC4 sleep-mask import cluster
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/time/schedule/waitable::create-waitable-timer-ex
      - id: micro-behaviors/time/schedule/waitable::set-waitable-timer
      - id: micro-behaviors/process/control/wait::wait-for-single-object
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: micro-behaviors/crypto/symmetric/stream/native::systemfunction033-symbol
    any:
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/time/query::query-performance-frequency
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/vendor::microsoft-corp-marker
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports
        - id: metadata/lang/compiler/systems/
        - id: metadata/lang/compiled/
  - id: timing-evasion-with-payload
    desc: Sandbox timing evasion combined with encrypted payload
    crit: suspicious
    conf: 0.9
    all:
      - id: timing-check-minimal-stub
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::binary-encrypted-overlay
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform/
        - id: metadata/binary/layout/overlay::7z-sfx-config-marker
        - id: metadata/binary/installer/script/
  - id: timing-evasion-large-resource-debugger
    desc: Timing evasion with debugger detection and large resource
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/time/query::multiple-clock-api-references
      - id: metadata/binary/resource/size::resource-heavy-rsrc
    any:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor/
        - id: well-known/tool/sysadmin/conemu::conemu-setup-signature
  - id: locale-timing-debug-fingerprint
    desc: Locale and timing anti-analysis fingerprint
    crit: suspicious
    conf: 0.93
    size_max: 400000
    all:
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/time/query::get-system-time-as-filetime
      - id: micro-behaviors/os/sysinfo/platform/locale::locale-environment-fingerprint
      - id: micro-behaviors/time/query::get-timezone-information
    any:
      - id: micro-behaviors/time/query::high-resolution-time-reference
      - id: micro-behaviors/time/query::multiple-clock-api-references
      - id: micro-behaviors/time/sleep/interval::sleep-dup
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/binary/symbols/count::many-exports
        - id: metadata/binary/symbols/count::many-imports
