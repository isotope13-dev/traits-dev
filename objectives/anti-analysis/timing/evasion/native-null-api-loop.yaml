# The loop resets last-error tens of millions of times. It has no useful
# computation and delays the protected-buffer handoff. No fixed loop count.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-null-call-counted-stall
    desc: Large null-argument API call loop
    crit: suspicious
    conf: 0.97
    attack: T1497.003
    if:
      type: yara
      source: |
        import "pe"
        rule null_call_stall {
          strings:
            $loop = { 53 FF 15 ?? ?? ?? ?? 81 FE ?? ?? ?? ?? 75 ?? E8 ?? ?? ?? ?? 46 81 FE ?? ?? ?? ?? 7C E3 }
          condition:
            for any s in (0..pe.number_of_sections - 1): (
              pe.sections[s].name == ".text" and
              $loop in (pe.sections[s].raw_data_offset..
                pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size) and
              uint32(@loop + 23) >= 1000000
            )
        }
