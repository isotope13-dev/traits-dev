defaults:
  crit: suspicious
  platforms: [macos]
  for: [macho]
  attack: T1497.003
  mbc: B0003.005
composite_rules:
  - id: delayed-fork-execution
    desc: Delayed forked execution pattern
    conf: 0.93
    all:
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/time/query::sleep
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/package/files/included::dylib-extension-basename
      - id: well-known/app/ai/coding-agent/anthropic-claude-code/
      - id: well-known/lib/runtime/scripted/bun-runtime/
      - id: metadata/binary/symbols/count::many-imports-40
      - id: metadata/binary/layout/size::massive-executable
  - id: delayed-ransomware-execution
    desc: Delayed execution with ransomware markers
    conf: 0.95
    all:
      - id: delayed-fork-execution
    any:
      - id: objectives/impact/ransom/encrypt/hybrid::seven-day-ransom-note
      - id: objectives/impact/ransom/encrypt/hybrid::time-derived-keying
      - id: micro-behaviors/fs/file/read-write::file-overwrite-routine
