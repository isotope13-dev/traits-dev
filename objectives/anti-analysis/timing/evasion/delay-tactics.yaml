# Timing and Delay Tactics Detection
# Detects sleep/delay functions used for evasion or rate limiting
# ATT&CK: T1497.003 (Virtualization/Sandbox Evasion: Time Based Evasion)
defaults:
  for: [pe, dll]
  platforms: [unix, windows, macos]
  attack: "T1497.003"
  mbc: "B0003.005"
  crit: notable
traits: []
# sleep/usleep/nanosleep: use micro-behaviors/time/sleep/interval::sleep-func etc. (canonical)
# clock_gettime/gettimeofday: use micro-behaviors/time/query/legacy (canonical)
composite_rules:
  - id: nt-delay-with-debug-check
    desc: Native delay with anti-debug check
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    all:
      - id: micro-behaviors/time/sleep/interval::nt-delay-execution
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/tool/sysadmin/systeminformer
      - id: well-known/app/system/reactos::system-component
  - id: opaque-writable-pe-delayed-termination
    desc: Opaque writable PE delays then terminates
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1497.003
    mbc: B0032
    platforms: [windows]
    size_min: 32768
    all:
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/file/entropy::high-overall-entropy-binary
      - id: metadata/binary/section/permission::writable-text-section
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: micro-behaviors/process/exit/terminate::exit-process
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
