# Native CPU stalls used before the program's functional entry point. The first
# sequence derives large randomized nested-loop bounds; the second adds a
# multi-million-iteration rotate loop. PAUSE instructions only yield within the
# loops and do not make the work useful, so the combined construct is an
# analysis-window evasion mechanism rather than ordinary retry/backoff logic.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1497.003
  mbc: B0003.005
  crit: component
  conf: 0.99
  size_min: 32768
  size_max: 262144

traits:
  - id: randomized-nested-arithmetic-stall-ranges
    desc: Randomized nested arithmetic stall ranges
    crit: notable
    if:
      type: hex
      pattern: E8 ?? ?? ?? ?? 89 C6 45 31 ED B9 B9 0B 00 00 31 D2 F7 F1 89 D7 81 C7 DC 05 00 00 B9 C0 5D 00 00 89 F0 31 D2 F7 F1 89 D3 81 C3 80 BB 00 00
      section: .text

  - id: randomized-multimillion-pause-stall
    desc: Multi-million loop with periodic PAUSE
    if:
      type: hex
      pattern: B9 90 01 00 00 89 F0 31 D2 F7 F1 69 DA E0 2E 00 00 81 C3 00 9F 24 00 39 FB 74 ?? 89 FA 83 E2 1F 89 F1 E8 ?? ?? ?? ?? 89 C6 66 F7 C7 FF 07 75 02 F3 90
      section: .text

composite_rules:
  - id: randomized-arithmetic-sandbox-stall
    desc: Randomized nested and multi-million CPU loops stall sandbox analysis
    crit: hostile
    conf: 0.995
    all:
      - id: randomized-nested-arithmetic-stall-ranges
      - id: randomized-multimillion-pause-stall
