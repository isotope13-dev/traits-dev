# VBScript time gates become anti-analysis evidence when they delay a dynamic
# shell stage.  The delay primitive itself remains neutral.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1497.003
  mbc: B0007.003

composite_rules:
  # The character exists only once the busy-wait loop has run long enough,
  # so an emulator that skips or accelerates the loop reads an empty slice.
  - id: vbs-busy-wait-gated-char-read
    desc: Reads a char only a long busy-wait produces
    crit: suspicious
    conf: 0.92
    near_lines: 12
    all:
      - id: micro-behaviors/time/sleep/interval::vbs-now-busy-wait-string-growth
      - id: micro-behaviors/data/string/conversion::vbs-asc-mid-large-fixed-offset

  - id: vbs-delayed-assembled-shell-loader
    desc: VBScript delays before evaluating an assembled shell stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1497.003
    all:
      - id: micro-behaviors/time/sleep/interval::vbs-wall-clock-sleep-loop
      - id: micro-behaviors/process/create/shell/wsh::vbs-execute-assembled-shell-method
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
      - id: micro-behaviors/os/com/automation::wscript-shell-literal

  - id: vbs-sleep-acceleration-sandbox-evasion
    desc: VBScript checks for sleep acceleration before executing obfuscated stage
    crit: hostile
    conf: 0.98
    attack: T1497.003,T1027,T1059.005
    all:
      - id: micro-behaviors/time/timing/check::vbs-timer-sleep-delta-check
    any:
      - id: objectives/anti-static/obfuscation/wsh::vbs-splintered-string-concat
      - id: objectives/anti-static/obfuscation/string/concat::vbs-amp-fragment-concat
      - id: micro-behaviors/os/com/automation::vbs-createobject-variable-progid
