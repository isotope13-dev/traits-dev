# VBScript time gates become anti-analysis evidence when they delay a dynamic
# shell stage.  The delay primitive itself remains neutral.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1497.003
  mbc: B0007.003

traits:
  - id: vbs-dateadd-seconds
    desc: VBScript adds seconds to current time
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bDateAdd\s*\(\s*["'']s["'']\s*,\s*\d{1,5}\s*,\s*Now\s*\)'

  - id: vbs-sleep-in-loop
    desc: VBScript sleeps inside a loop
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bDo\s+(Until|While)\b[\s\S]{0,500}\bWScript\.Sleep\s+\d{2,}'

composite_rules:
  - id: vbs-wall-clock-sleep-loop
    desc: VBScript waits in a wall-clock sleep loop
    crit: notable
    conf: 0.94
    all:
      - id: vbs-dateadd-seconds
      - id: vbs-sleep-in-loop
    near_bytes: 1100

  - id: vbs-delayed-assembled-shell-loader
    desc: VBScript delays before evaluating an assembled shell stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1497.003
    all:
      - id: vbs-wall-clock-sleep-loop
      - id: micro-behaviors/process/create/shell/wsh::vbs-execute-assembled-shell-method
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
      - id: micro-behaviors/os/com/object::wscript-shell-literal
