# JavaScript Timing Evasion
# Detects use of Date or performance.now combined with delays to detect analysis.
# MBC: B0001.032 (Timing/Delay Check)
# ATT&CK: T1497.001 (Virtualization/Sandbox Evasion: System Checks)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "B0001.032"
  attack: "T1497.001"
traits:
- id: js-utc-ms-sleep-jitter
  desc: UTC millisecond jitter sleep check
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'getUTCMilliseconds[\s\S]{0,72}Sleep[\s\S]{0,96}getUTCMilliseconds'
- id: js-hex-getut-fragment
  desc: Hex-escaped getUT Date fragment
  crit: notable
  conf: 0.88
  size_max: 20000
  if:
    type: text
    substr: '"g\x65tU'
- id: js-hex-getut-g-fragment
  desc: Hex-escaped getUT g-prefix fragment
  crit: notable
  conf: 0.88
  size_max: 20000
  if:
    type: text
    substr: '"\x67etUT"'
- id: js-hex-getut-ge-fragment
  desc: Hex-escaped getUT ge-prefix fragment
  crit: notable
  conf: 0.88
  size_max: 20000
  if:
    type: text
    substr: '"ge\x74U'
- id: js-hex-getut-hex-u-fragment
  desc: Hex-escaped getU hex-U fragment
  crit: notable
  conf: 0.88
  size_max: 20000
  if:
    type: text
    substr: '"g\x65t\x55"'
- id: js-hex-sleep-fragment
  desc: Hex-escaped Sleep method fragment
  crit: notable
  conf: 0.88
  size_max: 20000
  if:
    type: text
    substr: '"\x53le\x65\x70"'
- id: js-hex-sleep-slee-fragment
  desc: Hex-escaped Sleep Slee fragment
  crit: notable
  conf: 0.88
  size_max: 20000
  if:
    type: text
    substr: '"Sl\x65\x65"'

composite_rules:
- id: js-wscript-sleep-timing
  desc: JScript WScript.Sleep timing-based evasion
  crit: suspicious
  conf: 0.8
  all:
  - id: objectives/execution/interpreter/script/wsh::wscript-sleep
  any:
  - id: micro-behaviors/time/query::js-date-call-cluster
  - id: js-utc-ms-sleep-jitter
- id: js-jscript-sleep-jitter-evasion
  desc: JScript conditional sleep jitter evasion
  crit: suspicious
  conf: 0.95
  all:
  - id: js-utc-ms-sleep-jitter
  - id: micro-behaviors/process/interpreter/scripting::jscript-cc-variable
- id: js-hex-utc-sleep-jitter
  desc: Hex-split UTC millisecond sleep jitter
  crit: hostile
  conf: 0.96
  attack: T1497.001, T1027
  platforms: [windows]
  size_min: 512
  size_max: 20000
  all:
  - id: js-hex-getut-any
  - id: js-hex-sleep-any
  - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
- id: js-hex-getut-any
  desc: Hex-escaped getUT Date fragment
  crit: notable
  conf: 0.88
  any:
  - id: js-hex-getut-fragment
  - id: js-hex-getut-g-fragment
  - id: js-hex-getut-ge-fragment
  - id: js-hex-getut-hex-u-fragment
- id: js-hex-sleep-any
  desc: Hex-escaped Sleep method fragment
  crit: notable
  conf: 0.88
  any:
  - id: js-hex-sleep-fragment
  - id: js-hex-sleep-slee-fragment

# A decode loop that times itself and then XORs its own output buffer when it
# ran too slowly is not measuring performance — it is destroying the plaintext
# an analyst would have seen at a breakpoint. Benign code that times a hot loop
# reports or caches the number; it never rewrites the result bytes because of
# it. The two atoms have to sit in the same routine, hence near_lines.
- id: timing-gated-decode-corruption
  desc: Decoder corrupts its output when it runs slowly
  crit: suspicious
  conf: 0.94
  attack: T1497.003
  mbc: B0003.003
  near_lines: 24
  all:
  - id: micro-behaviors/time/timing/check::js-computed-performance-elapsed-check
  - id: micro-behaviors/data/buffer/record::indexed-byte-xor-mutation
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: well-known/app/development/superdoc-docx-engine::superdoc-docx-engine-package
