defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: opaque-return-trampolines-native-delay
    desc: Opaque return trampolines accompany native delay
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/time/sleep/interval::nt-delay-execution
    any:
      - id: objectives/anti-static/obfuscation/instruction/junk::dense-call-pop-stack-thunk-stubs
      - id: micro-behaviors/data/control-flow/return::stack-ret-fallthrough-trampoline-x64

  - id: opaque-delayed-overlay-loader
    desc: Opaque return-trampoline binary delays execution with large encrypted overlay
    crit: hostile
    conf: 0.98
    attack: T1497.003,T1027.002,T1620
    all:
      - id: micro-behaviors/time/sleep/interval::nt-delay-execution
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
    any:
      - id: objectives/anti-static/obfuscation/instruction/junk::dense-call-pop-stack-thunk-stubs
      - id: micro-behaviors/data/control-flow/return::stack-ret-fallthrough-trampoline-x64
    unless:
      - id: metadata/installer/product/
