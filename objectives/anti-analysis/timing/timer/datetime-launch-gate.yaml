defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: py-datetime-then-subprocess
    desc: Datetime comparison guards a subprocess launch
    crit: suspicious
    conf: 0.9
    attack: T1497.003
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (comparison_operator
            (call function: (attribute object: (_) @clock attribute: (identifier) @clock_method)))
          consequence: (block
            (expression_statement
              [(call function: (attribute object: (identifier) @launcher attribute: (identifier) @launch_method))
               (assignment right: (call function: (attribute object: (identifier) @launcher attribute: (identifier) @launch_method)))]))) @gate
        (#match? @clock "^datetime(\.datetime)?$")
        (#match? @clock_method "^(now|today)$")
        (#eq? @launcher "subprocess")
        (#match? @launch_method "^(Popen|run|call)$"))
