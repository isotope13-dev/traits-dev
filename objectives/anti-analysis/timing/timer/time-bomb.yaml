defaults:
  platforms:
    - windows
    - unix
  crit: suspicious
  attack: T1497.003
traits:
  - id: py-reboot-subprocess
    desc: Python subprocess reboot invocation
    crit: notable
    conf: 0.9
    for:
      - python
    if:
      type: text
      regex: subprocess\.(call|run|Popen)\s*\(\s*\[\s*["']reboot["']
  - id: js-date-now-compare
    desc: JavaScript Date.now() comparison
    crit: notable
    conf: 0.8
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: Date\.now\s*\(\s*\)\s*[<>]\s*1[5-9][0-9]{11}
  - id: js-new-date-compare
    desc: JavaScript new Date() comparison
    crit: notable
    conf: 0.75
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: new Date\s*\(\s*["']?[12][0-9]{3}[-/,][^)]{0,24}\)\s*[<>!=]=?
  - id: js-datenow-then-eval
    desc: JavaScript Date.now() followed by eval
    crit: suspicious
    conf: 0.9
    for:
      - javascript
      - typescript
    size_max: 102400
    if:
      type: text
      regex: Date\.now\(\)[^\n]{0,80}[<>!=]=*[^\n]{0,120}[^\w.$]eval\s*\(
  - id: js-datenow-then-function
    desc: JS Date.now() followed by func constructor
    crit: suspicious
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: Date\.now\(\)\s*([<>]=?|={2,3}|!={1,2})[^\n]{0,80}(new\s+)?\bFunction\s*\(
  - id: js-newdate-then-function
    desc: JS new Date() followed by func constructor
    crit: suspicious
    conf: 0.9
    for:
      - javascript
      - typescript
    size_max: 300000
    if:
      type: text
      regex: new Date[^\n]{0,80}[<>!=]=?[^\n]{0,80}(new\s+)?\bFunction\s*\(
  - id: shell-date-compare
    desc: Shell date comparison
    crit: notable
    conf: 0.75
    for:
      - shell
    if:
      type: text
      regex: \$\(date\s+\+%s\)\s*-[gl]t\s*1[5-9][0-9]{8}
  - id: shell-sleep-exec
    desc: Shell long sleep before command
    crit: suspicious
    conf: 0.8
    for:
      - shell
    if:
      type: text
      regex: sleep\s+[0-9]{4,}\s*[;&]\s*(curl|wget|sh|shell)
  - id: ci-var-then-curl
    desc: CI variable followed by curl
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
      - shell
    if:
      type: text
      regex: (\$CI\b|\bCI\s*[=!]=)[^\r\n]{0,200}\bcurl\b
  - id: ci-var-then-wget
    desc: CI variable followed by wget
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
      - shell
    if:
      type: text
      regex: (\$CI\b|\bCI\s*[=!]=)[^\r\n]{0,200}\bwget\b
  - id: github-actions-then-curl
    desc: GitHub Actions reference near curl upload
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
      - shell
    if:
      type: text
      regex: GITHUB_ACTIONS[\s\S]{0,300}\bcurl\b[^\n]{0,160}\s(-[dFT]|--(data|form|upload-file))
    not:
      - substr: codecov.io/env
      - regex: --preserve-env=[A-Z0-9_,]*GITHUB_ACTIONS
  - id: github-actions-then-wget
    desc: GITHUB_ACTIONS followed by wget
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
      - shell
    if:
      type: text
      regex: GITHUB_ACTIONS[^\r\n]{0,200}\bwget\b
  - id: ci-exfil-requests
    desc: CI reference near HTTP upload call
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
      - shell
    if:
      type: text
      regex: (\$CI\b|\bCI\s*[=!]=)[\s\S]{0,200}\b(requests|axios)\.(post|put)\s*\(
      case_insensitive: true
  - id: github-actions-then-requests
    desc: GitHub Actions reference near HTTP upload
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
      - shell
    if:
      type: text
      regex: GITHUB_ACTIONS\b[\s\S]{0,200}\b(requests|axios)\.(post|put)\s*\(
  - id: ci-var-then-http
    desc: CI variable followed by http
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
    if:
      type: text
      regex: (\$CI\b|\bCI\s*[=!]=\s*["'$\w])[\s\S]{0,200}(https?://|https?\.(get|request))
  - id: slsa-provenance-string
    desc: SLSA provenance marker outside remediation prose
    crit: notable
    conf: 0.9
    for:
      - python
    if:
      type: text
      substr: SLSA provenance
    unless:
      - type: text
        regex: (?i)remediation\s*[:=].{0,80}SLSA provenance
      - type: text
        regex: (?i)SLSA provenance.{0,80}slsa-framework
      - type: text
        regex: (?i)\b(consider|generate|add|use)\w*\b.{0,80}\bSLSA provenance\b
  - id: ci-environment-class
    desc: CIEnvironment class reference
    crit: notable
    conf: 0.9
    for:
      - python
    if:
      type: text
      substr: CIEnvironment
  - id: ci-invocation-url-field
    desc: CI invocation URL field
    crit: notable
    conf: 0.9
    for:
      - python
    if:
      type: text
      regex: (?i)\bCIEnvironment\b[\s\S]{0,180}\binvocation_url\b
  - id: travis-then-http
    desc: Travis CI reference near Python HTTP request
    crit: notable
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: TRAVIS_[A-Z0-9_]+[\s\S]{0,200}requests\.(get|post|request)\(["']https?://
    not:
      - substr: 'registry:'
      - substr: '{npm-version}'
      - regex: '#\s*(See|Consume)[^\n]*https?://'
      - regex: docs\.travis-ci\.com|www\.appveyor\.com/docs/environment-variables|docs\.github\.com/en/actions
  - id: travis-then-http-lib
    desc: Travis CI reference near Node HTTPS request
    crit: notable
    conf: 0.95
    for:
      - javascript
    if:
      type: text
      regex: process\.env\.TRAVIS_[A-Z0-9_]+[\s\S]{0,200}https\.(get|request)\(
    not:
      - substr: 'registry:'
      - substr: '{npm-version}'
composite_rules:
  - id: slsa-provenance-ci-metadata-marker
    desc: SLSA provenance CI metadata marker
    crit: notable
    conf: 0.9
    for:
      - python
    all:
      - id: slsa-provenance-string
      - id: ci-environment-class
      - id: ci-invocation-url-field
  - id: py-time-then-exec
    desc: Python time gate near exec
    crit: suspicious
    conf: 0.9
    for:
      - python
    near_lines: 10
    all:
      - id: micro-behaviors/time/query::py-time-call
      - id: micro-behaviors/time/query::python-time-epoch-comparison-context
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: py-time-then-eval
    desc: Python time gate near eval
    crit: suspicious
    conf: 0.9
    for:
      - python
    near_lines: 10
    all:
      - id: micro-behaviors/time/query::py-time-call
      - id: micro-behaviors/time/query::python-time-epoch-comparison-context
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
  - id: py-time-then-os-system
    desc: Python time gate near os.system
    crit: suspicious
    conf: 0.9
    for:
      - python
    near_lines: 10
    all:
      - id: micro-behaviors/time/query::py-time-call
      - id: micro-behaviors/time/query::python-time-epoch-comparison-context
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: py-time-then-subprocess
    desc: Python time gate near subprocess
    crit: suspicious
    conf: 0.9
    for:
      - python
    near_lines: 10
    all:
      - id: micro-behaviors/time/query::py-time-call
      - id: micro-behaviors/time/query::python-time-epoch-comparison-context
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: py-datetime-then-exec
    desc: Python datetime gate near eval
    crit: suspicious
    conf: 0.9
    for:
      - python
    near_lines: 10
    all:
      - id: micro-behaviors/time/query::py-datetime-now-call
      - id: micro-behaviors/time/timing/check::python-current-datetime-comparison
    any:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
  - id: py-sleep-then-curl-pipe-shell
    desc: Python long sleep then curl piped to shell
    crit: hostile
    conf: 0.92
    attack: T1497.003,T1059.004,T1105
    for:
      - python
    near_lines: 10
    all:
      - id: micro-behaviors/time/sleep/interval::python-sleep-1000s-literal
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-in-code
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: py-date-conditional-exec
    desc: Python exec/eval after date check
    crit: suspicious
    conf: 0.9
    any:
      - id: py-time-then-exec
      - id: py-time-then-eval
      - id: py-time-then-os-system
      - id: py-time-then-subprocess
      - id: py-datetime-then-exec
      - id: py-datetime-then-subprocess
  - id: python-time-bomb
    desc: Python execution near time comparison
    crit: suspicious
    conf: 0.9
    any:
      - id: py-date-conditional-exec
      - id: micro-behaviors/time/sleep/interval::python-long-sleep-process-clues
    all:
      - id: micro-behaviors/time/query::python-time-epoch-comparison-context
  - id: js-time-conditional-eval
    desc: JavaScript eval/Function near time comparison
    crit: suspicious
    conf: 0.9
    any:
      - id: js-datenow-then-eval
      - id: js-datenow-then-function
      - id: js-newdate-then-function
  - id: go-time-after-check
    desc: Go time-gated command execution
    crit: suspicious
    conf: 0.75
    near_bytes: 1200
    all:
      - id: micro-behaviors/time/timing/check::go-fixed-unix-timestamp-comparison
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
  - id: time-bomb-detected
    desc: Time-related execution indicators
    crit: suspicious
    conf: 0.9
    any:
      - id: python-time-bomb
      - id: js-time-conditional-eval
      - id: shell-sleep-exec
