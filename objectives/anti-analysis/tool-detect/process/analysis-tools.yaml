defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1518.001
  mbc: B0013
traits:
- id: anti-dump-detected-status
  desc: Memory-dump detection status
  crit: notable
  conf: 0.98
  for: [pe, dll]
  if:
    type: text
    substr: "[AntiDump] Dump detected:"
composite_rules:
- id: analysis-tool-aware-credential-stealer
  desc: Credential stealer carries analysis-tool process names
  crit: hostile
  conf: 0.99
  attack: T1555
  for:
  - pe
  - python
  - javascript
  all:
  - id: objectives/exfiltration/stealer/wallet::networked-wallet-and-credential-file-stealer
  any:
  - id: micro-behaviors/process/info/name::procmon-tool-name-reference
  - id: micro-behaviors/process/info/name::procexp-tool-name-reference
  - id: micro-behaviors/process/info/name::process-hacker-executable-name-reference
  unless:
  - id: well-known/tool/detection/
- id: overlay-loader-with-analysis-tool-catalog
  desc: PE overlay loader carries analysis-tool names
  crit: hostile
  conf: 0.98
  attack: T1027.009
  for: [pe]
  all:
  - id: metadata/file/profile/operation-cooccurrence::process-enumeration-beside-analysis-tool-catalogs
  - id: objectives/anti-static/obfuscation/payload/self-read::pe-overlay-self-extractor
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
