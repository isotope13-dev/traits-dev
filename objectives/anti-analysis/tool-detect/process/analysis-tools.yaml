defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1518.001
  mbc: B0013
traits:
- id: anti-dump-detected-status
  desc: Memory-dump detection status
  crit: notable
  conf: 0.98
  for: [pe, dll]
  if:
    type: text
    substr: "[AntiDump] Dump detected:"
composite_rules:
- id: analysis-tool-aware-credential-stealer
  desc: Credential stealer carries analysis-tool process names
  crit: hostile
  conf: 0.99
  attack: T1555
  for:
  - pe
  - python
  - javascript
  all:
  - id: objectives/exfiltration/stealer/wallet::networked-wallet-and-credential-file-stealer
  any:
  - id: micro-behaviors/process/debug/tool-markers::procmon-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::procexp-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::process-hacker-executable-name-reference
  unless:
  - id: well-known/tool/detection/
# Kill-list shape the executable-suffix matchers miss: bare lowercase tool
# names (ollydbg, x32_dbg, fakenet, dumpcap — no .exe, so they read as
# process-name comparisons rather than executable references) together with
# known sandbox hostnames (JOHN-PC, LISA-PC) in one binary. Either leg
# alone is weak — tool names appear in security writeups, hostnames in
# inventory code — but the pairing is a denylist: bail or kill when
# analysis tooling or a sandbox hostname is present.
- id: bare-tool-and-sandbox-host-denylist
  desc: Bare tool names with sandbox hostnames
  crit: hostile
  conf: 0.95
  attack: T1497.001
  for: [pe]
  all:
  - id: micro-behaviors/process/debug/tool-markers::bare-analysis-tool-name-reference
  any:
  - id: objectives/anti-analysis/sandbox-detect/artifact/known::hostname-john-pc
  - id: objectives/anti-analysis/sandbox-detect/artifact/known::hostname-lisa-pc
