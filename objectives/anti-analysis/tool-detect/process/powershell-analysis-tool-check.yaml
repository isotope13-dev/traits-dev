defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1622,T1497.001
composite_rules:
  # Enumerates running processes and compares their names against a catalog of
  # debuggers, packet analyzers and forensic tools; implants use the result to
  # stop before their payload runs. Several distinct tools are required so a
  # single monitoring-tool mention does not match.
  - id: powershell-analysis-tool-process-check
    desc: PowerShell checks processes against analysis tools
    crit: suspicious
    conf: 0.9
    near_lines: 80
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-query
    needs: 3
    any:
      - id: micro-behaviors/process/debug/tool-markers::x64dbg
      - id: micro-behaviors/process/debug/tool-markers::ollydbg
      - id: micro-behaviors/process/debug/tool-markers::procmon
      - id: micro-behaviors/os/application/target/security::wireshark-name-reference
      - id: micro-behaviors/os/application/target/security::tshark-name-reference
