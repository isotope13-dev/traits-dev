defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: managed-debugger-kill-process-references
    desc: Debugger-kill callback with process APIs
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule managed_debugger_kill_process_references {
          strings:
            $clr = "BSJB" ascii
            $callback = "<KillDebuggers>b__" ascii
            $enumerate = "GetProcesses" ascii fullword
            $kill = "Kill" ascii fullword
          condition:
            uint16(0) == 0x5a4d and all of them
        }
