# Java declarations of native Frida, root, or emulator probes in a DEX. The
# probes run in the native library, so the DEX names them as native methods.
defaults:
  platforms: [android]
  for: [dex]
  attack: T1497.001

traits:
  - id: android-dex-native-tool-check
    desc: DEX declares native anti-tool checks
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'checkNative(Frida|Root|Emulator)'
