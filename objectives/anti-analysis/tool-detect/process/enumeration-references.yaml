defaults:
  platforms: [windows, unix]
composite_rules:
  - id: analysis-tool-references-with-process-enumeration
    desc: Process enumeration with multiple analysis-tool references
    crit: suspicious
    conf: 0.66
    for:
      - scripts
      - binaries
    all:
      - id: micro-behaviors/process/enumerate/snapshot::process-enumeration-api-alternatives
    needs: 2
    any:
      - id: micro-behaviors/process/debug/tool-markers::cuckoo
      - id: micro-behaviors/process/debug/tool-markers::joe-sandbox
      - id: micro-behaviors/communications/url/host/name::any-run-service-reference
      - id: micro-behaviors/process/debug/tool-markers::hybrid-analysis
      - id: micro-behaviors/os/application/target/security::wireshark-name-reference
      - id: micro-behaviors/process/debug/tool-markers::procmon
      - id: micro-behaviors/process/debug/tool-markers::process-hacker-executable-name-reference
      - id: micro-behaviors/process/debug/tool-markers::x64dbg
      - id: micro-behaviors/process/debug/tool-markers::ollydbg
      - id: micro-behaviors/fs/path/reference::analysis-sandbox-directory-path
    unless:
      - id: well-known/tool/detection/al-khaser::al-khaser-build-helper-context
      - id: well-known/tool/detection/rkill::repair-tool-identity

  - id: analysis-tool-process-termination
    desc: Terminates security analysis processes
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: objectives/anti-analysis/tool-detect/process::analysis-tool-references-with-process-enumeration
      - id: micro-behaviors/process/terminate/kill::terminate-process
    any:
      - id: micro-behaviors/process/terminate/enumerated::toolhelp-termination-api-profile
      - id: micro-behaviors/process/terminate/kill::toolhelp-kill-loop-source
      - id: micro-behaviors/process/attach/rights::open-process
    unless:
      - id: well-known/tool/detection/al-khaser::al-khaser-build-helper-context
      - id: well-known/tool/detection/rkill::repair-tool-identity
