defaults:
  platforms: [windows]
  for: [powershell, batch, python, javascript]
traits:
  - id: powershell-taskmgr-termination
    desc: PowerShell explicitly terminates Task Manager
    crit: suspicious
    conf: 0.95
    attack: T1562.001
    if:
      type: text
      regex: '(?i)\bStop-Process\s+-(Name|ProcessName)\s+["'']?taskmgr(\.exe)?\b'
  # Bind the enumerated process to the termination sink: a generic
  # Stop-Process elsewhere in the file does not establish this behavior.
  - id: powershell-taskmgr-pipeline-termination
    desc: PowerShell pipeline terminates Task Manager
    crit: suspicious
    conf: 0.98
    attack: T1562.001
    if:
      type: text
      regex: '(?i)\bGet-Process\s+(-Name\s+)?["'']?taskmgr["'']?\s*\|\s*Stop-Process\b'
composite_rules:
  - id: taskmgr-query-service-stop-start
    desc: Task Manager query with service stop and restart commands
    crit: suspicious
    conf: 0.95
    attack: T1564
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-taskmgr-query
      - id: micro-behaviors/os/service/stop::powershell-stop-service-command
      - id: micro-behaviors/os/service/start::powershell-start-service-command
