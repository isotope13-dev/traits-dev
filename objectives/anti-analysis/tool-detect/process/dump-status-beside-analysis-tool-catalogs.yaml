defaults:
  platforms:
    - linux
    - macos
    - windows
composite_rules:
  - id: dump-status-beside-analysis-tool-catalogs
    desc: Dump status beside analysis-tool catalogs
    crit: notable
    conf: 0.98
    for:
      - pe
      - dll
    all:
      - id: objectives/anti-analysis/tool-detect/process::anti-dump-detected-status
      - id: micro-behaviors/os/application/target/security::process-enumeration-beside-analysis-tool-catalogs
