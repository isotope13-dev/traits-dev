defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1622
  mbc: B0001

traits:
  - id: process-hacker-window-class
    desc: Process Hacker window-class marker
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: ProcessHacker
      case_insensitive: true

  - id: procmon-window-class
    desc: Process Monitor window-class marker
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: ProcMonMain
      case_insensitive: true

  - id: ollydbg-window-class
    desc: OllyDbg window-class marker
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: OLLYDBG
      case_insensitive: true

composite_rules:
  - id: analysis-tool-window-class-cluster
    desc: Multiple analyst-tool window-class checks
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/manage/control::find-window-a-import
    needs: 2
    any:
      - id: process-hacker-window-class
      - id: procmon-window-class
      - id: ollydbg-window-class
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/sysinternals/
