defaults:
  platforms: [android, unix]
  for: [c, cpp, elf]
  attack: T1497

traits:
  - id: frida-tool-string
    desc: "Frida dynamic-instrumentation ref"
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])frida([^A-Za-z0-9]|$)'
    unless:
      - id: well-known/tool/reverse-engineering/frida/

  - id: android-unidbg-tool-string
    desc: Android unidbg tool string
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "unidbg"

composite_rules:
  - id: iot-ddos-bot-analysis-tool-evasion
    desc: IoT DDoS bot checks procfs for analysis tools
    crit: hostile
    conf: 0.98
    attack: T1497.001
    for: [elf]
    platforms: [linux]
    all:
      - id: procfs-analysis-tool-detection
      - id: objectives/impact/dos/udp-flood::go-iot-credential-ddos-bot
  - id: procfs-analysis-tool-detection
    desc: Procfs command-line path paired with Frida or unidbg reference
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-format
    any:
      - id: frida-tool-string
      - id: android-unidbg-tool-string
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-datadog-agent
