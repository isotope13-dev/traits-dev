# Installers seldom look for sniffer and debugger windows, list kernel drivers
# and register a service in the same image. Together these show a payload that
# checks for analysts before it installs itself to persist.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: analysis-window-driver-scan-service-install
    desc: Scans windows and drivers for analysis tools, installs service
    crit: suspicious
    conf: 0.9
    attack: T1518.001,T1543.003
    all:
      - id: micro-behaviors/ui/window/enumerate::enum-windows
      - id: micro-behaviors/ui/window/enumerate::find-window-a-import
      - id: micro-behaviors/process/enumerate/psapi::enum-device-drivers
      - id: micro-behaviors/os/service/create::service-create-open-import-pair
