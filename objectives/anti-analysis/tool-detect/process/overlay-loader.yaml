# Analyst-tool detection for a PE whose overlay dominates its file contents.
# Process enumeration and exception-handler API references are neutral context;
# the tool-name cluster and near-full overlay provide the anti-analysis evidence.
# ATT&CK: T1497 (Virtualization/Sandbox Evasion), T1057 (Process Discovery), T1622 (Debugger Evasion)
# MBC: B0007 (Sandbox Detection), B0001 (Debugger Detection)
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: overlay-tool-catalog-loader
    desc: Overlay-dominant PE fingerprints analyst tooling
    crit: hostile
    conf: 0.98
    attack: "T1497,T1518.001,T1622"
    all:
      - id: micro-behaviors/process/enumerate/snapshot::pe-overlay-process-exception-api-profile
      - id: micro-behaviors/process/debug/tool-markers::analyst-tool-name-cluster
      - id: metadata/binary/layout/ratio::overlay-over-90pct
