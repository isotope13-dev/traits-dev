defaults:
  platforms:
  - windows
  crit: suspicious
  attack: T1057
  for:
  - powershell
  - javascript
  - python
  - batch
traits:
- id: check-process-handle
  desc: Checks for handle.exe
  conf: 0.6
  if:
    type: encoded
    regex: Get-Process.{0,50}\bhandle\b
    case_insensitive: true
- id: check-process-runsc
  desc: Checks for runsc (gVisor container runtime)
  conf: 0.7
  if:
    type: encoded
    regex: Get-Process.{0,50}\brunsc\b
    case_insensitive: true
- id: check-process-dbgview
  desc: Checks for Dbgview.exe
  conf: 0.7
  if:
    type: encoded
    regex: Get-Process.{0,50}\bdbgview\b
    case_insensitive: true
- id: check-process-tcpview
  desc: tcpview/tcpvcon
  conf: 0.7
  if:
    type: encoded
    regex: Get-Process.{0,50}\btcp(view|vcon)\b
    case_insensitive: true
- id: check-process-anyrun
  desc: Checks for any.run sandbox environment
  conf: 0.75
  if:
    type: encoded
    regex: Get-Process.{0,50}\bany\.run\b
    case_insensitive: true
- id: check-process-ollydbg
  desc: Checks for OllyDbg debugger
  conf: 0.7
  if:
    type: encoded
    regex: Get-Process.{0,50}\bollydbg\b
    case_insensitive: true
- id: check-process-immunity
  desc: Checks for ImmunityDebugger
  conf: 0.7
  if:
    type: encoded
    regex: Get-Process.{0,50}\bimmunit(y|ydebugger)\b
    case_insensitive: true
- id: check-process-wireshark
  desc: Checks for Wireshark network sniffer
  conf: 0.6
  if:
    type: encoded
    regex: Get-Process.{0,50}\bwireshark\b
    case_insensitive: true
- id: check-process-apatedns
  desc: Checks for apateDNS (analysis tool)
  conf: 0.75
  if:
    type: encoded
    regex: Get-Process.{0,50}\bapatedns\b
    case_insensitive: true
- id: check-process-sandbox-generic
  desc: Checks for generic 'sandbox' process name
  conf: 0.6
  if:
    type: encoded
    regex: Get-Process.{0,50}\bsandbox\b
    case_insensitive: true
composite_rules:
- id: multi-sandbox-tool-check
  desc: Checks for multiple sandbox/analysis tools
  conf: 0.85
  attack: T1497
  needs: 3
  any:
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-anyrun
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-apatedns
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-dbgview
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-handle
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-immunity
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-ollydbg
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-runsc
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-sandbox-generic
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-tcpview
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-wireshark
- id: comprehensive-sandbox-enumeration
  desc: Checks for 5+ different sandbox/analysis tools
  conf: 0.95
  attack: T1497
  mbc: B0007
  needs: 5
  any:
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-anyrun
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-apatedns
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-dbgview
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-handle
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-immunity
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-ollydbg
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-runsc
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-sandbox-generic
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-tcpview
  - id: objectives/anti-analysis/sandbox-detect/process::check-process-wireshark
