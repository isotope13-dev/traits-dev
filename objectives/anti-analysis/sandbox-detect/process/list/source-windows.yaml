# Native source checks the running-process list for analysis tooling.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, source]
  attack: T1497.001,T1057
  mbc: B0007,E1057

traits:
  - id: analysis-tool-name-set-source--x32dbg
    desc: Analysis tool literal (x32dbg.exe)
    crit: component
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bx32dbg\.exe\b'
  - id: analysis-tool-name-set-source--ollydbg
    desc: Analysis tool literal (ollydbg)
    crit: component
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bollydbg\b'
  - id: analysis-tool-name-set-source--wireshark
    desc: Analysis tool literal (wireshark)
    crit: component
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bwireshark\b'
  - id: analysis-tool-name-set-source--dumpcap
    desc: Analysis tool literal (dumpcap)
    crit: component
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bdumpcap\b'
  - id: analysis-tool-name-set-source--splunkd
    desc: Analysis tool literal (splunkd.exe)
    crit: component
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bsplunkd\.exe\b'

composite_rules:
  - id: analysis-tool-name-set-source
    desc: Analysis-tool names in source literals
    crit: suspicious
    conf: 0.95
    any:
      - id: analysis-tool-name-set-source--x32dbg
      - id: analysis-tool-name-set-source--ollydbg
      - id: analysis-tool-name-set-source--wireshark
      - id: analysis-tool-name-set-source--dumpcap
      - id: analysis-tool-name-set-source--splunkd
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index
      - id: metadata/file/catalog/identity::nixpkgs-package-catalog
      - id: well-known/app/deno::source-archive-context
  - id: native-analysis-tool-process-blocklist
    desc: Native source enumerates processes against analysis-tool names
    crit: suspicious
    conf: 0.98
    all:
      - id: analysis-tool-name-set-source
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot-source
      - id: micro-behaviors/process/enumerate/snapshot::process32-first-source
      - id: micro-behaviors/process/enumerate/snapshot::process32-next-source
    near_bytes: 4096

  - id: native-sandbox-fingerprint
    desc: Native source fingerprints locale, volume serial, and analysis tools
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1057,T1082
    all:
      - id: native-analysis-tool-process-blocklist
      - id: micro-behaviors/os/sysinfo/disk::get-volume-information
      - id: micro-behaviors/os/sysinfo/platform/locale::get-locale-info-import
    near_bytes: 8192
