# Native source checks the running-process list for analysis tooling.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, source]
  attack: T1497.001,T1057
  mbc: B0007,E1057

traits:
  - id: analysis-tool-name-set-source
    desc: Analysis-tool process name set
    crit: suspicious
    conf: 0.95
    count_min: 2
    if:
      type: text
      regex: '(?i)\b(x32dbg\.exe|ollydbg|wireshark|dumpcap|splunkd\.exe)\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

composite_rules:
  - id: native-analysis-tool-process-blocklist
    desc: Native source enumerates processes against analysis-tool names
    crit: suspicious
    conf: 0.98
    all:
      - id: analysis-tool-name-set-source
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot-source
      - id: micro-behaviors/process/enumerate/snapshot::process32-first-source
      - id: micro-behaviors/process/enumerate/snapshot::process32-next-source
    near_bytes: 4096

  - id: native-sandbox-fingerprint
    desc: Native source fingerprints locale, volume serial, and analysis tools
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1057,T1082
    all:
      - id: native-analysis-tool-process-blocklist
      - id: micro-behaviors/os/sysinfo/disk::get-volume-information
      - id: micro-behaviors/os/sysinfo/platform/locale::get-locale-info-import
    near_bytes: 8192
