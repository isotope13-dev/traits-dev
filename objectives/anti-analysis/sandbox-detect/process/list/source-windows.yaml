# Native source checks the running-process list for analysis tooling.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, source]
  attack: T1497.001,T1057
  mbc: B0007,E1057

traits:
composite_rules:
  # Notable, not suspicious. A bare `any:` over five component string literals:
  # one mention of "wireshark" or "ollydbg" anywhere in a source file. The
  # software that names these tools most is the tools' own ecosystem --
  # uhd ships Wireshark dissectors whose plugin.rc.in carries the name, and
  # CodeWhale's command_safety.rs lists them in a blocklist of commands it
  # refuses to run. `native-analysis-tool-process-blocklist` below is where
  # the claim lives: it pairs the name set with CreateToolhelp32Snapshot and
  # Process32First/Next inside 4 KB, which is an actual process sweep.
  - id: native-analysis-tool-process-blocklist
    for: [c]
    desc: Native source enumerates processes against analysis-tool names
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/debug/tool-markers::source-analysis-tool-name-literals
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot-source
      - id: micro-behaviors/process/enumerate/snapshot::process32-first-source
      - id: micro-behaviors/process/enumerate/snapshot::process32-next-source
    near_bytes: 4096

  - id: native-sandbox-fingerprint
    for: [c]
    desc: Native source fingerprints locale, volume serial, and analysis tools
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1057,T1082
    all:
      - id: native-analysis-tool-process-blocklist
      - id: micro-behaviors/os/sysinfo/disk::get-volume-information
      - id: micro-behaviors/os/sysinfo/platform/locale::get-locale-info-import
    near_bytes: 8192
