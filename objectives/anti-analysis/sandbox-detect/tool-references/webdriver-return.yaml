# Returning false rejects the automated client. Reading the flag alone is
# already covered by browser capability rules. HTML uses extracted scripts.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1497.001
traits:
  - id: webdriver-false-return
    desc: Rejects WebDriver clients with false return
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bif\s*\(\s*navigator\.webdriver(\|\|[^;\r\n]{1,180})?\)\s*return\s*(!1|false)\b'
      exclude_comments: true
