defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.93
  attack: T1497.001

composite_rules:
  - id: webdriver-concealed-automatic-download
    desc: WebDriver check co-occurs with a hidden scripted download
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-webdriver-read
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
      - id: micro-behaviors/ui/window/visibility::display-none-style
