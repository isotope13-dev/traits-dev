defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1497.001
composite_rules:
  - id: user-interaction-trigger-cluster
    desc: Uses multiple input or window-state APIs; common in GUI applications
    crit: component
    conf: 0.88
    size_max: 5242880
    needs: 2
    any:
      - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: micro-behaviors/ui/window/enumerate::enum-windows
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window
    unless:
      - id: metadata/binary/framework/
      - id: well-known/tool/sysadmin/sysinternals/
      - id: objectives/evasion/anti-av/gui-decoy/
      - id: metadata/signed/leaf::huawei-device-co.-ltd.
      - id: metadata/signed/leaf::qihu-360-software-co.-limited
      - id: well-known/lib/ui/dear-imgui::imgui-interface-context
      - id: metadata/binary/symbols/plugin::x64dbg-plugin-export
