defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
  crit: suspicious
  conf: 0.97
  attack: T1497.001

traits:
  # Wazza's c.js inspects Function.prototype.toString.toString() for browser
  # automation's evaluation-source markers. Match the inspection operation,
  # not a tool name in documentation or an automation library import. Text
  # scope also covers JavaScript embedded in server-side page templates.
  - id: browser-evaluation-source-inspection
    desc: Inspects function source for automation markers
    if:
      type: text
      regex: 'toString\(\)\s*\.includes\([''"]__(puppeteer|playwright)_evaluation_script__'
