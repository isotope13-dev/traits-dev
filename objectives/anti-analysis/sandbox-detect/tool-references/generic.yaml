defaults:
  platforms:
  - windows
  - unix
  mbc: B0007
  attack: T1497
traits:
- id: dotnet-crypter-analysis-gate-call
  desc: .NET crypter template anti-analysis gate calls
  crit: notable
  conf: 0.94
  for:
  - pe
  - dll
  - csharp
  if:
    type: text
    substr: DWireshark() || IsDebuggerPresent() || DEmulation() ||DSandboxie() ||
      DVM()
- id: js-func-tostring
  desc: Function.toString check
  crit: suspicious
  conf: 0.5
  mbc: B0001
  attack: T1622
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    substr: function.toString
- id: js-console-log-tostring
  desc: console.log.toString check
  crit: suspicious
  conf: 0.5
  mbc: B0001
  attack: T1622
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    substr: console.log.toString
- id: js-console-warn-tostring
  desc: console.warn.toString check
  crit: suspicious
  conf: 0.5
  mbc: B0001
  attack: T1622
  for:
  - javascript
  - typescript
  unless:
  - id: metadata/file/format/source-map::sourcemap
  if:
    type: string_literal
    substr: console.warn.toString
- id: js-console-error-tostring
  desc: console.error.toString check
  crit: suspicious
  conf: 0.5
  mbc: B0001
  attack: T1622
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    substr: console.error.toString
- id: js-browser-bracketed-webdriver
  desc: Bracketed browser webdriver check
  crit: suspicious
  conf: 0.84
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (navigator|window)\s*\[\s*["']webdriver["']\s*\]
- id: native-anti-analysis-hardware-labels
  desc: Native hardware-probe marker labels
  crit: notable
  conf: 0.95
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: text
    regex: (?i)\bM_(CpuidHypervisor|CpuidVendor|BiosVendor)\b
- id: native-anti-analysis-runtime-labels
  desc: Native sandbox and VM probe marker labels
  crit: notable
  conf: 0.95
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: text
    regex: (?i)\bM_(SandboxProcesses|ProcessCount|VmRegistry|AnyRunDetect)\b
- id: native-anti-analysis-timing-label
  desc: Native timing probe marker label
  crit: notable
  conf: 0.95
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: text
    regex: (?i)\bM_RdtscTiming\b
- id: debugger-detection-result-label
  desc: Debugger-detection status message
  crit: notable
  conf: 0.95
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: text
    regex: (?i)\bDEBUGGER DETECTED\b
  unless:
  - id: metadata/signed/leaf::microsoft-corporation
composite_rules:
- id: js-browser-cloaking-staged-iframe
  desc: Browser automation gate before remote iframe staging
  crit: suspicious
  conf: 0.98
  attack: T1497.001,T1105
  for:
  - javascript
  all:
  - id: js-browser-bracketed-webdriver
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-automation-evaluation-globals
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/ui/window/insert-html::browser-iframe-srcdoc-assignment
  any:
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
- id: js-browser-fingerprint-clipboard-stager
  desc: Automation fingerprint gates remote clipboard payload
  crit: hostile
  conf: 0.98
  attack: T1497.001,T1105,T1115
  for:
  - javascript
  - typescript
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/platform/browser::js-webdriver-member-read
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-webgl-renderer-read
  - id: objectives/execution/lure/clipboard/page::remote-response-clipboard-stager
- id: dotnet-crypter-anti-analysis-template
  desc: .NET crypter template gates execution on debugger/sandbox/VM checks
  crit: hostile
  conf: 0.95
  for:
  - pe
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: dotnet-crypter-analysis-gate-call
  - id: objectives/command-and-control/dropper/builder::dotnet-crypter-stub-placeholders
  any:
  - id: micro-behaviors/process/debug/tool-markers::sandboxie-dll-name-reference
  - id: micro-behaviors/os/wmi/query::wmi-baseboard-class
- id: js-timing
  desc: Sleep acceleration detection (sandbox evasion)
  crit: suspicious
  conf: 0.8
  for:
  - javascript
  - typescript
  needs: 2
  # Minified bundles put Date/performance.now and setTimeout within 50
  # characters constantly (retry and polling loops), so the bundle-level
  # exclusions live here too and do not depend on the atoms carrying them.
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/asset::has-sourcemap
  - id: metadata/lang/javascript-features::sourcemap-sources-content
  any:
  - id: micro-behaviors/time/sleep/interval::js-atomic-sleep-module
  - id: micro-behaviors/time/query::js-date-now-timeout
  - id: micro-behaviors/time/query::js-performance-now-timeout
- id: js-anti-bot-browser-fingerprint
  desc: Browser anti-bot fingerprint gates verification traffic
  crit: suspicious
  conf: 0.92
  attack: T1497.001,T1071.001
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-antibot-fingerprint
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
- id: js-console-tostring
  desc: Console method toString check
  crit: suspicious
  conf: 0.7
  mbc: B0001
  attack: T1622
  for:
  - javascript
  - typescript
  any:
  - id: js-console-log-tostring
  - id: js-console-warn-tostring
  - id: js-console-error-tostring
- id: js-debugger
  desc: JavaScript debugger detection
  crit: suspicious
  conf: 0.85
  mbc: B0001
  attack: T1622
  for:
  - javascript
  - typescript
  needs: 2
  any:
  - id: micro-behaviors/process/debug/event::debugger-statement
  - id: js-func-tostring
  - id: js-console-tostring
  unless:
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
  - id: well-known/lib/ui/react::react-devtools-text
# Marker labels, timing instructions, TLS callbacks and overlays do not by themselves
# establish active analysis checks or staged payload behavior.
