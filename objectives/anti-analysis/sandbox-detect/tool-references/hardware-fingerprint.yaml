defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001
  mbc: B0007
composite_rules:
  - id: windows-env-fingerprint-cluster
    desc: Sandbox env-var fingerprint cluster (5+ Windows env-var names)
    crit: suspicious
    conf: 0.85
    size_max: 5242880
    all:
      - id: micro-behaviors/os/env/vars/system-info::windows-env-var-cluster-string
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/app/system/msi-center::msi-center-terminalserver-memory-image
      - id: micro-behaviors/os/env/vars/system-info::serialized-windows-environment-block
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/metrics/threshold::many-imports-50
  - id: hardware-fingerprint-cluster
    desc: Sandbox hardware fingerprint cluster (CPU/RAM/disk/uptime/screen)
    crit: notable
    conf: 0.85
    size_max: 5242880
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
      - id: micro-behaviors/os/sysinfo/hardware::get-memory-status
      - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/ui/controls/widget::get-system-metrics
    unless:
      - id: well-known/tool/detection/wireshark/
      - id: well-known/tool/detection/wireshark::wireshark-artifact-path
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework/
      - id: well-known/app/system/cvte-crashrpt/
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/metrics/structural::many-imports
        - id: metadata/binary/metrics/threshold::many-imports-50
  - id: native-concealed-host-check
    desc: Native PE XOR-decodes host-check configuration and probes hardware
    crit: hostile
    conf: 0.97
    attack: T1497.001,T1027
    mbc: B0007,F0001
    all:
      - id: hardware-fingerprint-cluster
      - id: micro-behaviors/data/decode/xor::x64-indexed-xor-string-decode-loop
      - id: micro-behaviors/os/registry/access::reg-open-key-ex-a-symbol
      - id: micro-behaviors/os/registry/access::reg-query-value-ex-a-symbol
  - id: future-dated-random-pe-host-checks
    desc: Future-dated random PE with host checks
    crit: hostile
    conf: 0.97
    unless:
      # GNU/Go toolchain PEs carry both structural legs by construction -- their
      # own section names plus a hash-derived link timestamp -- and every POSIX
      # runtime queries the host it is emulating on. Neither is evasion there.
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe
    all:
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
      - id: metadata/binary/anomaly/provenance::pe-far-future-timestamp
    any:
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: micro-behaviors/os/sysinfo/hardware::enumerate-display-devices
    needs: 2
