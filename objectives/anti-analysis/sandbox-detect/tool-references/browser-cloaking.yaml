defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1497.001
  crit: suspicious
  conf: 0.86
  size_max: 524288
traits:
  - id: webgl-vm-renderer-check
    desc: WebGL VM renderer check
    if:
      type: text
      regex: 'WEBGL_debug_renderer_info[\s\S]{0,220}(VMware|VirtualBox)'
  - id: browser-behavior-score
    desc: Browser behavior score gate
    if:
      type: text
      regex: 'behaviorScore[\s\S]{0,220}(mousemove|scroll|clickDetected)'
  - id: delayed-payload-behavior-gate
    desc: Delayed payload behavior gate
    if:
      type: text
      regex: 'shouldShowPayload[\s\S]{0,220}behaviorScore'
  - id: encoded-webdriver-probe
    desc: Encoded JavaScript checks automation state
    crit: component
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: '\bnavigator\.webdriver\b'
  - id: encoded-browser-storage-probe
    desc: Encoded JavaScript probes browser storage APIs
    crit: component
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      regex: '\b(indexedDB|openDatabase|localStorage)\b'
  - id: encoded-browser-rendering-probe
    desc: Encoded JavaScript probes rendering APIs
    crit: component
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      regex: '\b(WebGLRenderingContext|RTCPeerConnection)\b'
composite_rules:
  - id: browser-cloaked-payload-gate
    desc: Browser-cloaked payload gate
    crit: suspicious
    conf: 0.92
    needs: 2
    any:
      - id: webgl-vm-renderer-check
      - id: browser-behavior-score
      - id: delayed-payload-behavior-gate
  - id: encoded-browser-sandbox-profile
    desc: Encoded payload profiles browser automation capabilities
    crit: suspicious
    conf: 0.98
    near_bytes: 16384
    all:
      - id: encoded-webdriver-probe
      - id: encoded-browser-storage-probe
      - id: encoded-browser-rendering-probe
  - id: encoded-sandbox-gated-fetch-function-loader
    desc: Encoded browser sandbox checks guard a remote Function loader
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1059.007,T1105
    all:
      - id: encoded-webdriver-probe
      - id: encoded-browser-storage-probe
      - id: encoded-browser-rendering-probe
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/data/source/dynamic/eval::new-function-iife
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
