# Malware that checks for analysis honeypots and sandboxes before running.
# The probe is filesystem-shaped: literal install paths for Cowrie/Kippo/
# Dionaea/Cuckoo layouts and a post-login `cat /proc/version` +
# `/proc/1/cmdline` fingerprint. Matching English words like "honeypot" is
# deliberately avoided.
defaults:
  platforms: [unix, android]
  for: [c, cpp, go, rust, elf, shell, python]
  attack: T1497.001
  mbc: B0013

traits:
  - id: cowrie-opt-install-path
    desc: Cowrie honeypot /opt install path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /opt/cowrie

  - id: cowrie-home-path
    desc: Cowrie honeypot home directory path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /home/cowrie

  - id: kippo-home-path
    desc: Kippo honeypot home directory path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /home/kippo

  - id: ssh-honeypot-banner-paramiko
    desc: Paramiko SSH honeypot banner token
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      exact: SSH-2.0-paramiko

  - id: ssh-honeypot-banner-cowrie
    desc: Cowrie SSH honeypot banner token
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)^SSH-2\.0-.*[Cc]owrie'

  - id: ssh-honeypot-banner-kippo
    desc: Kippo SSH honeypot banner token
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)^SSH-2\.0-.*[Kk]ippo'

  - id: kippo-opt-install-path
    desc: Kippo honeypot /opt install path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /opt/kippo

  - id: dionaea-opt-install-path
    desc: Dionaea honeypot /opt install path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /opt/dionaea

  - id: cuckoo-opt-install-path
    desc: Cuckoo sandbox /opt install path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /opt/cuckoo

  - id: post-login-proc-version-probe
    desc: Post-login /proc/version fingerprint probe
    crit: notable
    conf: 0.88
    if:
      type: text
      # Scanner issues this over the SSH session after auth.
      regex: 'cat\s+/proc/version\b.{0,80}/proc/1/cmdline'

  - id: cowrie-etc-config-path
    desc: Cowrie honeypot /etc configuration path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /etc/cowrie/

  - id: dionaea-run-pid-file
    desc: Dionaea honeypot runtime pid file path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/(var/)?run/dionaea(\.pid|/)'

  - id: sandbox-detected-fake-crash-message
    desc: Logs a staged crash after sandbox detection
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # Debug builds announce the decoy: "identified as sandbox/honeypot,
      # initiating fake crash". The process then idles or dies on purpose.
      regex: '(?i)(sandbox|honeypot)[^\n]{0,48}\b(fake|simulated|decoy) (crash|segfault)'

composite_rules:
  - id: ssh-honeypot-filesystem-probe
    desc: Probes Cowrie/Kippo honeypot filesystem paths
    crit: suspicious
    conf: 0.95
    any:
      - id: cowrie-opt-install-path
      - id: cowrie-home-path
      - id: kippo-home-path
    needs: 2
    near_bytes: 400

  - id: ssh-honeypot-banner-blocklist
    desc: Carries a multi-family SSH honeypot banner blocklist
    crit: suspicious
    conf: 0.94
    any:
      - id: ssh-honeypot-banner-paramiko
      - id: ssh-honeypot-banner-cowrie
      - id: ssh-honeypot-banner-kippo
    needs: 2

  - id: iot-honeypot-install-path-cluster
    desc: Multiple analysis-honeypot host artifact paths
    crit: suspicious
    conf: 0.96
    needs: 3
    any:
      - id: cowrie-opt-install-path
      - id: cowrie-home-path
      - id: kippo-home-path
      - id: kippo-opt-install-path
      - id: dionaea-opt-install-path
      - id: dionaea-run-pid-file
      - id: cowrie-etc-config-path
      - id: cuckoo-opt-install-path

  - id: ssh-scanner-honeypot-evasion
    desc: SSH brute scanner skips honeypots before payload delivery
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1497.001
    all:
      - id: ssh-honeypot-filesystem-probe
    any:
      - id: ssh-honeypot-banner-blocklist
      - id: post-login-proc-version-probe
      - id: objectives/lateral-movement/brute-force/ssh::embedded-ssh-credential-set
      - id: objectives/command-and-control/remote-command/task-schema::bot-verb-ssh-group

  - id: honeypot-and-vm-gated-fake-crash
    desc: Fakes a crash when honeypot or VM probes hit
    crit: hostile
    conf: 0.96
    attack: T1497.001,T1497.002
    all:
      - id: iot-honeypot-install-path-cluster
      - id: sandbox-detected-fake-crash-message
    any:
      - id: objectives/anti-analysis/vm-detect/dmi::dmi-vm-fingerprint
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-vbox
      - id: micro-behaviors/process/debug/tool-markers::unix-analysis-tool-lexicon-raw

  # Release builds drop the "fake crash" log line; the probe set itself is the
  # signal. Cowrie and Dionaea are research honeypots: only code that wants
  # to avoid being observed by them looks for their files on the local host,
  # and this composite also requires VM fingerprinting and a list of
  # sniffer/tracer process names.
  - id: honeypot-vm-and-sniffer-probe-set
    desc: Probes for honeypots, VMs and packet sniffers
    crit: hostile
    conf: 0.94
    platforms: [linux]
    for: [elf]
    all:
      - id: iot-honeypot-install-path-cluster
      - id: micro-behaviors/process/debug/tool-markers::unix-analysis-tool-lexicon-raw
    any:
      - id: objectives/anti-analysis/vm-detect/dmi::dmi-vm-fingerprint
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-vbox
