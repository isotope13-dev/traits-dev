defaults:
  crit: suspicious
  platforms: [windows]
  for: [documents]
traits:
  - id: guarded-msiexec-properties
    desc: Guarded MSI execution properties
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bstep1=commonl\b.{0,40}\bstep2=files\b'
composite_rules:
  - id: office-vba-msi-guardrails
    for: [oledoc, ooxml]
    desc: Office dropper sandbox guardrails
    conf: 0.97
    all:
      - id: metadata/document/office/macro::excel-vba-project
      - id: micro-behaviors/process/create/macro/office::msiexec-quiet-install
      - id: guarded-msiexec-properties
