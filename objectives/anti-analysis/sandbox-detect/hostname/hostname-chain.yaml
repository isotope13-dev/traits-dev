defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497.001
traits:
  - id: javascript-hostname-sandbox-comparison
    desc: Checks hostname-call result for sandbox marker
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (subscript_expression object: (call_expression) @receiver
              index: (string (string_fragment) @method))
            (member_expression object: (call_expression) @receiver
              property: (property_identifier) @method)]
          arguments: (arguments (string (string_fragment) @marker))
          (#eq? @method "includes")
          (#eq? @marker "sandbox")
          (#match? @receiver "[\"']hostname[\"']")) @match
