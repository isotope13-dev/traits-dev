defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1497.001

traits:
  # String-array literal of analysis-host markers ('sandbox' next to
  # 'malware'/'analysis'), the shape of a hostname deny list.
  - id: ruby-sandbox-host-marker-list
    desc: Ruby lists sandbox and analysis host markers
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\[[^\]\n]{0,80}["'']sandbox["''][^\]\n]{0,40}["''](analysis|malware)["'']'
