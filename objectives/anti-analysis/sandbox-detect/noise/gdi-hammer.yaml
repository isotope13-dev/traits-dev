# Purposeless GDI call floods used to pad loader control flow (API hammering).
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1497.003
  mbc: B0001

traits:
  - id: solid-brush-unrealize-pair
    desc: CreateSolidBrush then UnrealizeObject
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '(?is)CreateSolidBrush\s*\([^)]{0,40}\)[\s\S]{0,120}UnrealizeObject\s*\('

composite_rules:
  - id: gdi-api-hammer-debug-hang
    desc: GDI hammering with debugger hang
    crit: hostile
    conf: 0.97
    all:
      - id: solid-brush-unrealize-pair
      - id: objectives/anti-analysis/debugger-detect/check::debugger-present-hang-loop
    near_bytes: 4096
