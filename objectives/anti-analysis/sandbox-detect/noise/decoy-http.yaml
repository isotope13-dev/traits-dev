defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: analysis-gated-vendor-decoy-traffic
    desc: Decoy vendor requests when analysis is detected
    crit: hostile
    conf: 0.92
    attack: T1497.001,T1001
    mbc: B0009,F0032
    all:
      - id: micro-behaviors/communications/url/host/name/vendor-literals::major-vendor-host-list
      - id: micro-behaviors/communications/http/client/response-body::discarded-http-get-response
      - id: objectives/anti-analysis/sandbox-detect/script::js-resource-threshold-analysis-gate
