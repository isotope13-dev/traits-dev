# Cover traffic to major-vendor hosts in place of the real C2.
#
# When an implant concludes it is running in an analysis VM, the loud failure
# mode is to exit with no network activity at all -- which is itself a signal
# an analyst reads. The quieter option, used by the Node.js implants in the
# Mirage Kitten coding-challenge campaign, is to fire a handful of requests at
# Google/Microsoft/Cloudflare, discard every response, and never touch the real
# controller. The capture then looks like idle OS background chatter.
#
# Holding a few big-vendor hostnames is ordinary connectivity-probe code, so
# the host list stays notable on its own. Conviction needs the two structural
# neighbours: responses thrown away (the request exists only to make traffic)
# and an analysis-environment gate deciding when to send them.
#
# ATT&CK: T1497.001 (System Checks), T1001 (Data Obfuscation)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497.001
  mbc: B0009
traits:
  - id: google-host-literal
    desc: Quoted google.com hostname literal
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["''][\w.]{0,8}google\.com["'']'

  - id: microsoft-host-literal
    desc: Quoted microsoft.com hostname literal
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["''][\w.]{0,8}microsoft\.com["'']'

  - id: cloudflare-host-literal
    desc: Quoted cloudflare.com hostname literal
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["''][\w.]{0,8}cloudflare\.com["'']'

  - id: akamai-host-literal
    desc: Quoted akamai.com hostname literal
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["''][\w.]{0,8}akamai\.com["'']'

  - id: discarded-http-get-response
    desc: HTTP GET whose response is discarded
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.get\([^;\n]{0,120}=>\s*\w+\.resume\(\)'

composite_rules:
  - id: major-vendor-host-list
    desc: Lists three or more major-vendor hostnames
    crit: notable
    conf: 0.8
    needs: 3
    any:
      - id: google-host-literal
      - id: microsoft-host-literal
      - id: cloudflare-host-literal
      - id: akamai-host-literal

  - id: analysis-gated-vendor-decoy-traffic
    desc: Decoy vendor requests when analysis is detected
    crit: hostile
    conf: 0.92
    attack: T1497.001,T1001
    mbc: B0009,F0032
    all:
      - id: major-vendor-host-list
      - id: discarded-http-get-response
      - id: objectives/anti-analysis/sandbox-detect/script::js-resource-threshold-analysis-gate
