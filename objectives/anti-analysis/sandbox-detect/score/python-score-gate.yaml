defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-sandbox-score-call
    desc: Python calls an is_sandboxed probe
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)is_sandboxed$'
  - id: python-sandbox-score-exit
    desc: Sandbox probe result gates Python exit
    crit: suspicious
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        ((_
          (expression_statement (assignment
            left: (identifier) @score
            right: (call function: (identifier) @probe)))
          . (if_statement
            condition: (comparison_operator (identifier) @tested (float))
            consequence: (block (expression_statement
              (call function: (identifier) @exit)))) @evidence)
          (#eq? @score @tested) (#eq? @probe "is_sandboxed")
          (#eq? @exit "exit"))
        ((_
          (try_statement body: (block .
            (expression_statement (assignment
              left: (identifier) @score
              right: (call function: (identifier) @probe))) .)
            (except_clause (block . (expression_statement (assignment
              left: (identifier) @fallback
              right: [(integer) (float)])) .)) .)
          . (if_statement
            condition: (comparison_operator (identifier) @tested (float))
            consequence: (block (expression_statement
              (call function: (identifier) @exit)))) @evidence)
          (#eq? @score @tested) (#eq? @probe "is_sandboxed")
          (#eq? @score @fallback) (#eq? @exit "exit"))
