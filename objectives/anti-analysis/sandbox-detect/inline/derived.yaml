defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 1.0
  for: [scripts, binaries]
traits:
  - id: inline__username-sandbox__any_1
    desc: Analysis-VM username value
    if:
      type: text
      case_insensitive: true
      regex: (^|[^\w-])user\s*[=:]\s*malware($|[^.\w-])
  - id: inline__username-sandbox__any_2
    desc: Analysis-VM username value
    if:
      type: text
      case_insensitive: true
      # Include a trailing call comma or paren. `user=SANDBOX)` passes a
      # variable; the not drops that match. A bare `user=sandbox` stays.
      regex: (^|[^\w-])user\s*[=:]\s*sandbox($|[^.\w-])([,)])?
    not:
      - regex: '[,)]\s*$'
    unless:
      - id: metadata/lang/javascript-features::standalone-user-sandbox-marker-declaration
      # Assigning the sandbox identity (`export USER=sandbox`, `user=sandbox`,
      # or a `HOME=... USER=sandbox exec cmd` env prefix in a sandbox init
      # script) provisions the environment; evasion reads the username, it
      # does not set it.
      - type: text
        regex: (?im)^\s*((export\s+)|(\w+=\S+\s+)*)user(name)?\s*=\s*["']?sandbox\b
      # Passing an attribute or member of an object/module named sandbox
      # (e.g. `user=sandbox._tools_user`) binds an execution user from an
      # environment object, rather than matching an evasion username string.
      - type: text
        regex: (?i)\buser(name)?\s*[=:]\s*sandbox\s*\.
      # A Python keyword passes an uppercase account variable (`user=SANDBOX`).
      - type: text
        regex: '\buser(name)?\s*=\s*[A-Z_][A-Z0-9_]{2,}\b'
      # Instructions or credential prompts for sandbox environment setup
      # (e.g. `Create user: sandbox / sandbox`).
      - type: text
        regex: '(?i)\b(create\s+)?user(name)?\s*[:=]\s*sandbox\s*/'
      # Documentation of a parameter (`user: Sandbox user for process auth`)
      # describes the account type; it is not an analysis-VM username value.
      - type: text
        regex: '(?i)\buser(name)?\s*:\s*sandbox\s+(user|account)\b'
  - id: inline__username-sandbox__any_3
    desc: Analysis-VM username value
    if:
      type: text
      case_insensitive: true
      regex: (^|[^\w-])user\s*[=:]\s*virus($|[^.\w-])
  - id: inline__username-sandbox__any_4
