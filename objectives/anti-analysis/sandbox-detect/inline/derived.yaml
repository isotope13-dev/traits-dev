defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 1.0
  for: [scripts, binaries]
traits:
  - id: inline__username-sandbox__any_1
    desc: Analysis-VM username value
    if:
      type: text
      case_insensitive: true
      regex: (^|[^\w-])user\s*[=:]\s*malware\b
  - id: inline__username-sandbox__any_2
    desc: Analysis-VM username value
    if:
      type: text
      case_insensitive: true
      regex: (^|[^\w-])user\s*[=:]\s*sandbox\b
    unless:
      # Assigning the sandbox identity (`export USER=sandbox` or `user=sandbox`
      # in a sandbox VM init script) provisions the environment; evasion reads
      # the username, it does not set it.
      - type: text
        regex: (?im)^\s*(export\s+)?user(name)?\s*=\s*["']?sandbox\b
      # Passing an attribute or member of an object/module named sandbox
      # (e.g. `user=sandbox._tools_user`) binds an execution user from an
      # environment object, rather than matching an evasion username string.
      - type: text
        regex: (?i)\buser(name)?\s*[=:]\s*sandbox\s*\.
  - id: inline__username-sandbox__any_3
    desc: Analysis-VM username value
    if:
      type: text
      case_insensitive: true
      regex: (^|[^\w-])user\s*[=:]\s*virus\b
  - id: inline__username-sandbox__any_4
    desc: Analysis-VM username value
    if:
      type: text
      case_insensitive: true
      regex: (^|[^\w-])user\s*[=:]\s*sample\b
    unless:
      - type: text
        regex: '(?i)\buser(name)?\s*[=:]\s*sample\s+(user|account)\b'
