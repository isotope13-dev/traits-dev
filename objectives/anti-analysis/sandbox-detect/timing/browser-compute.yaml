# HTML is covered through extracted scripts. Direct HTML text matching does
# not mask JavaScript comments; keep these checks on parsed JavaScript.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1497.003
traits:
  - id: elapsed-time-false-return
    desc: Elapsed time threshold returns false
    crit: notable
    if:
      type: text
      regex: 'performance\.now\(\)\s*-\s*[\w$]{1,40}\s*<\s*[\d.]+\)\s*return\s*(!1|false)\b'
      exclude_comments: true
composite_rules:
  - id: browser-compute-speed-rejection
    desc: Rejects clients after measuring computation speed
    crit: suspicious
    conf: 0.94
    near_lines: 5
    all:
      - id: elapsed-time-false-return
      - id: micro-behaviors/time/query::js-performance-now-near-compute
