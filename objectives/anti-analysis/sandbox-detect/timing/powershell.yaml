defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1497.003
  mbc: B0007

traits:
  - id: powershell-tickcount-elapsed-subtraction
    desc: PowerShell tick-count subtraction
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\[Environment\]::TickCount\s*-\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\)'
  - id: powershell-tickcount-threshold-compare
    desc: PowerShell tick-count threshold comparison
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$[A-Za-z_][A-Za-z0-9_]*\s*\)\s*(-l[te]|<=?)\s*\d{2,}'

composite_rules:
  - id: powershell-elapsed-tickcount-compare
    desc: PowerShell compares elapsed tick count
    crit: suspicious
    conf: 0.94
    all:
      - id: powershell-tickcount-elapsed-subtraction
      - id: powershell-tickcount-threshold-compare
    near_bytes: 384
  - id: powershell-sleep-tickcount-sandbox-gate
    desc: PowerShell sleep and tick-count sandbox gate
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/time/query::powershell-environment-tickcount
      - id: powershell-elapsed-tickcount-compare
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
    near_lines: 12
