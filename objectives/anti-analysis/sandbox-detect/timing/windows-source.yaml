# Sandbox detection via timing checks - Windows C/C++ source
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1497.003
  mbc: B0007
composite_rules:
  - id: timing-sandbox-detect
    desc: Timing-based sandbox detection
    crit: suspicious
    conf: 0.88
    near_lines: 80
    all:
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/time/sleep/interval::sleep-source
      - id: micro-behaviors/process/exit/terminate::exit-process-source
    unless:
      - id: metadata/file/profile/source-indications/

  - id: cache-flush-rdtsc-timing-probe
    desc: Measures CPU cache-line flush latency with RDTSC
    crit: suspicious
    conf: 0.95
    for: [c, cpp, rust]
    platforms: [windows, unix]
    near_lines: 30
    all:
      - id: micro-behaviors/mem/sync/cache::clflush-intrinsic-call
      - id: micro-behaviors/time/query::rdtsc-intrinsic-call

  - id: cache-timing-cpuid-messagebox-exit-gate
    desc: Aborts after CPUID and cache-timing sandbox probe
    crit: hostile
    conf: 0.98
    for: [c, cpp, rust]
    near_lines: 45
    all:
      - id: cache-flush-rdtsc-timing-probe
      - id: micro-behaviors/os/sysinfo/cpu::cpuid-intrinsic-call
      - id: micro-behaviors/ui/dialog/prompt::messagebox-call-source
    any:
      - id: micro-behaviors/process/exit/terminate::rust-process-exit-call
      - id: micro-behaviors/process/exit/terminate::c-exit-process-call
