# Sandbox detection via timing checks - Windows C/C++ source
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1497.003
  mbc: B0007
composite_rules:
  - id: timing-sandbox-detect
    desc: Timing-based sandbox detection
    crit: suspicious
    conf: 0.88
    near_lines: 80
    all:
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/time/sleep/interval::sleep-source
      - id: micro-behaviors/process/exit/terminate::exit-process-source
    unless:
      - id: metadata/file/profile/source-indications/

  - id: cache-timing-cpuid-exit-gate
    desc: CPU and cache-timing probes beside conditional exit
    crit: suspicious
    conf: 0.95
    near_lines: 45
    all:
      - id: micro-behaviors/time/timing/check::cache-flush-rdtsc-timing-probe
      - id: micro-behaviors/os/sysinfo/cpu::cpuid-intrinsic-call
      - id: micro-behaviors/data/control-flow/branch::high-bit-conditional-process-exit
