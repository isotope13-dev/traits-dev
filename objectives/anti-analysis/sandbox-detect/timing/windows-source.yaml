# Sandbox detection via timing checks - Windows C/C++ source
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1497.003
  mbc: B0007
composite_rules:
  - id: cache-timing-cpuid-exit-gate
    desc: CPU and cache-timing probes beside conditional exit
    crit: suspicious
    conf: 0.95
    near_lines: 45
    all:
      - id: micro-behaviors/time/timing/check::cache-flush-rdtsc-timing-probe
      - id: micro-behaviors/os/sysinfo/cpu::cpuid-intrinsic-call
      - id: micro-behaviors/data/control-flow/branch::high-bit-conditional-process-exit
