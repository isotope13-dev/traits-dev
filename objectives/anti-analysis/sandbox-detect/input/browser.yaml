# Browser human-presence filtering. A lure page registers listeners for two
# different input modalities -- keyboard events plus pointer/touch movement --
# and ships what it observes, alongside device metadata, to a remote endpoint.
# The Zscaler Ledger/Google-Ads kit used this to tell real victims from
# automated sandboxes; the same shape serves any credential-harvest page that
# wants to gate (or tune) its payload on observed interaction. Session-replay
# and RUM SDKs also watch key and pointer events, which is why the composite
# lives at suspicious rather than hostile and why the third leg requires the
# request body to serialize browser runtime fields, not merely a POST to exist.
#
# The atoms live in micro-behaviors/hardware/input/event and
# micro-behaviors/communications/http; this composite adds the anti-analysis
# reading.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1497.001
  crit: suspicious
  conf: 0.85

composite_rules:
  - id: keyboard-listener-any-form
    desc: Registers a DOM keyboard event listener
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
      - id: micro-behaviors/hardware/input/event::inline-keyboard-event-listener

  - id: remote-http-post-call
    desc: Sends an HTTP POST request
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call

  - id: input-interaction-remote-beacon
    desc: Keyboard and pointer interaction telemetry posted to a remote endpoint
    conf: 0.85
    all:
      - id: keyboard-listener-any-form
      - id: micro-behaviors/hardware/input/event::user-activity-event-listener
      - id: micro-behaviors/data/serialize/json::json-stringify-post-body-core
      - id: remote-http-post-call
