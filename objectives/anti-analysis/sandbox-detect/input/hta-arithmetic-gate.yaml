# HTAs that ask the user to solve a small sum in an InputBox before running
# a computed ProgID: a human-presence gate that sandboxes do not answer.
defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: hostile
  attack: T1497.002,T1218.005

composite_rules:
  - id: hta-arithmetic-gate-before-activex
    desc: HTA asks an arithmetic question before running a computed ProgID
    conf: 0.9
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: metadata/lang/natural/instruction::inputbox-arithmetic-question
      - id: micro-behaviors/os/com/instantiation::computed-activex-progid
