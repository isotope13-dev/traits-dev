defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: ci-gated-microsoft-process-network-loader
    desc: CI-gated Microsoft process network loader
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1057,T1071.001
    mbc: B0007,C0002
    all:
      - id: micro-behaviors/os/env/vars/cicd::native-ci-provider-marker-cluster
      - id: micro-behaviors/process/enumerate/apps::native-microsoft-process-target-cluster
      - id: micro-behaviors/communications/http/client/winhttp::native-winhttp-user-agent-host-cluster
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::get-proc-address-import
