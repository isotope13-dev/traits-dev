defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  mbc: B0007,C0002

composite_rules:
  - id: ci-host-network-process-loader
    desc: Native loader fingerprints CI hosts before network process staging
    attack: T1497.001,T1057,T1071.001,T1106
    all:
      - id: micro-behaviors/os/env/cicd/runner::native-ci-provider-marker-cluster
      - id: micro-behaviors/os/env/system-info::native-host-identity-marker-cluster
      - id: micro-behaviors/os/application/target/productivity::native-microsoft-process-target-cluster
      - id: micro-behaviors/communications/http/client/winhttp::native-winsock-transport-cluster
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/installer/product/
  - id: ci-gated-microsoft-process-network-loader
    desc: CI-gated Microsoft process network loader
    attack: T1497.001,T1057,T1071.001
    all:
      - id: micro-behaviors/os/env/cicd/runner::native-ci-provider-marker-cluster
      - id: micro-behaviors/os/application/target/productivity::native-microsoft-process-target-cluster
      - id: micro-behaviors/communications/http/client/winhttp::native-winhttp-user-agent-host-cluster
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: flattened-input-screen-sandbox-evasion
    desc: Flattened dispatch combines input polling and display checks for evasion
    conf: 0.97
    attack: "T1497.001,T1497.002,T1027"
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/ui/graphics/draw::get-device-caps
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::repeated-cmov-relative-branch-tables-x64
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-input-state
      - id: objectives/anti-static/obfuscation/encoding/buffer::flattened-table-stream-string-decoding
      - id: objectives/anti-static/obfuscation/imports/concealment::table-stream-decoder-api-resolution-profile
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
