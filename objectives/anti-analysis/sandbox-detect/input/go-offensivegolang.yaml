# Calls to the inspected OffensiveGolang helper contract, bound to its
# actual import alias. Only the initial call-only portion of main is admitted,
# so a preceding local alias reassignment cannot masquerade as this import.
defaults:
  platforms: [windows]
  for: [go]
  crit: suspicious
  conf: 0.98
  attack: T1497.002
traits:
  - id: go-offensivegolang-mouse-startup-gate
    desc: Gates startup on mouse movement
    if:
      type: tree-sitter
      language: go
      query: |
        ((source_file
          (import_declaration [
            (import_spec !name path: (interpreted_string_literal (interpreted_string_literal_content) @module))
            (import_spec_list (import_spec !name path: (interpreted_string_literal (interpreted_string_literal_content) @module)))
          ])
          (function_declaration name: (identifier) @entry
            body: (block (statement_list . (expression_statement)* .
              (expression_statement (call_expression
                function: (selector_expression operand: (identifier) @receiver
                  field: (field_identifier) @method))))))) @gate
          (#set! cleave.ignore-comments "true")
          (#eq? @module "github.com/MrTuxx/OffensiveGolang/pkg/evasion")
          (#eq? @entry "main")
          (#eq? @receiver "evasion")
          (#eq? @method "CheckMouse"))
        ((source_file
          (import_declaration [
            (import_spec name: (package_identifier) @import_alias path: (interpreted_string_literal (interpreted_string_literal_content) @module))
            (import_spec_list (import_spec name: (package_identifier) @import_alias path: (interpreted_string_literal (interpreted_string_literal_content) @module)))
          ])
          (function_declaration name: (identifier) @entry
            body: (block (statement_list . (expression_statement)* .
              (expression_statement (call_expression
                function: (selector_expression operand: (identifier) @receiver
                  field: (field_identifier) @method))))))) @gate
          (#set! cleave.ignore-comments "true")
          (#eq? @module "github.com/MrTuxx/OffensiveGolang/pkg/evasion")
          (#eq? @entry "main")
          (#eq? @receiver @import_alias)
          (#eq? @method "CheckMouse"))
