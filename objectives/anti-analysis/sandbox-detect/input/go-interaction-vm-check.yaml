defaults:
  for: [go]
  platforms: [windows]
traits:
  - id: go-interaction-and-vm-artifact-checks
    desc: Checks mouse activity and VM artifacts
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule go_interaction_and_vm_artifact_checks {
          strings:
            $mouse = "robotgo.GetMousePos()"
            $gate = "if x == j && y == z"
            $exit = "os.Exit(1)"
            $paths = "FilePathsToCheck"
            $vmware = "Vmmouse.sys"
            $vbox = "VBoxGuest.sys"
            $stat = "os.Stat(FilePath)"
          condition:
            all of them
        }
