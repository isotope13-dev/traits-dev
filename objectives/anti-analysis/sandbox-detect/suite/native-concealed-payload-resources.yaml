defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: native-concealed-payload-resource-rejection
    desc: Concealed payload with host-resource gates
    crit: suspicious
    conf: 0.98
    attack: T1497.001
    all:
      - id: objectives/anti-static/obfuscation/encoding/hex::native-alphabetic-section-decoder
      - id: metadata/binary/code/control-transfer::x64-one-and-1536mb-comparison-branches
      - id: metadata/binary/code/control-transfer::x64-640-480-comparison-branches
      - id: micro-behaviors/os/sysinfo/hardware::get-native-system-info
      - id: micro-behaviors/ui/controls/widget::get-system-metrics
