defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: native-resource-and-input-probes
    desc: Low-memory threshold with idle and cursor probes
    crit: suspicious
    conf: 0.94
    attack: T1497.001,T1497.002
    all:
      - id: micro-behaviors/os/sysinfo/hardware::global-memory-status-source
      - id: micro-behaviors/os/sysinfo/hardware::native-physical-memory-lower-bound
      - id: micro-behaviors/os/sysinfo/hardware::get-native-system-info
      - id: micro-behaviors/hardware/input/idle-time::get-last-input-info
      - id: micro-behaviors/hardware/input/mouse/position::repeated-cursor-position-calls
      - id: micro-behaviors/hardware/display/state::gdi-screen-dimensions-source
