defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: evasion-checks
    desc: Evasion checks detected (usernames/hostnames/paths)
    crit: suspicious
    for: [javascript, typescript, shell, python]
    any:
      - id: objectives/anti-analysis/sandbox-detect/inline/
    unless:
      - id: micro-behaviors/ui/help::libxslt-configure-js
      - id: micro-behaviors/revision-control/repository::hg-operations
      - id: micro-behaviors/revision-control/repository::hg-operations-1
      - id: micro-behaviors/revision-control/repository::hg-operations-2
      - id: micro-behaviors/revision-control/repository::hg-operations-3
      - id: metadata/package/testing/
