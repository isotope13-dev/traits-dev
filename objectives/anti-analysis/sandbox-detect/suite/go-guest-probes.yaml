defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-anti-sandbox-guest-driver-profile
    desc: Go anti-sandbox name and VM/debugger references
    crit: suspicious
    conf: 0.96
    attack: T1497.001
    # Name alone is retained as neutral metadata. Together these describe the
    # reversed routine's VM-artifact and debugger probe vocabulary.
    all:
      - id: metadata/binary/symbols/name::go-main-anti-sandbox-name
      - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-guest-driver-reference
      - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-mouse-driver-reference
      - id: micro-behaviors/process/debug/detect::is-debugger-present-string
