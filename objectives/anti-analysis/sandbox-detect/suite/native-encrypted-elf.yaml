defaults:
  platforms: [linux]
  for: [elf]
  attack: T1497

composite_rules:
  # The primitive set alone is common in agents. The encrypted runtime string
  # table plus a concrete SOCKS5 client makes the host/environment query surface
  # implant profiling or gating, not ordinary configuration handling. Static
  # imports do not expose which particular variables or hostname tokens are
  # consulted, so the description deliberately stops short of naming them.
  - id: encrypted-host-environment-profiling-implant
    desc: Encrypted SOCKS implant profiles host and environment data
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::native-chacha-runtime-string-table
      - id: micro-behaviors/os/sysinfo/hostname::gethostname
      - id: micro-behaviors/os/env/access::native-getenv
      - id: micro-behaviors/fs/file/read::fgets-api-import
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/communications/proxy/socks::native-socks5-domain-connect-client
