defaults:
  platforms: [unix, windows, appliance]
  for: [typescript, javascript]
  attack: T1497

traits:
  - id: ts-debug-env-gate
    desc: TS debugger env gate
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'process\.env(\.|\x5b["\x27])(LD_PRELOAD|STRACE|LTRACE)'
    not:
      - substr: delete safeEnv
    unless:
      - type: text
        regex: '(\{\s*\.\.\.process\.env,\s*LD_PRELOAD|(LD_PRELOAD|preload)\s*:[^}\n]{0,120}process\.env)'
      # Reading LD_PRELOAD to detect Termux's exec-preload library is Android
      # platform adaptation (buninu adds /system/bin to PATH when
      # libtermux-exec.so is loaded), not tracer detection.
      - type: text
        substr: libtermux-exec.so
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component

  - id: ts-virt-indicator-list
    desc: TS virtual tool indicator list
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'VIRT_INDICATORS[\s\S]{0,260}(VBoxService|vmtoolsd|qemu-ga)'

  - id: ts-proc-self-status-reference
    desc: References own process status procfs path
    crit: notable
    conf: 0.74
    if:
      type: text
      substr: /proc/self/status

composite_rules:
  - id: ts-env-proc-sandbox-gate
    desc: TS env proc sandbox gate
    crit: hostile
    conf: 0.98
    for: [typescript]
    all:
      - id: ts-debug-env-gate
      - id: ts-proc-self-status-reference

