# Ruby agent checks for an attached tracer, hypervisor vendors and running
# analysis tools, then posts the result over HTTP.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1497.001,T1622

composite_rules:
  - id: ruby-sandbox-debugger-probe-report
    desc: Probes for debuggers and VMs, reports out
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/debug/detect::script-tracerpid-field-reference
      - id: micro-behaviors/os/virtualization/hypervisor::ruby-virtualization-vendor-references
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: micro-behaviors/process/debug/tool-markers::ollydbg
      - id: micro-behaviors/process/debug/tool-markers::x64dbg
      - id: micro-behaviors/os/application/target/security::wireshark-name-reference
      - id: micro-behaviors/os/application/target/security::tshark-name-reference
