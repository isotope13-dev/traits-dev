defaults:
  platforms: [unix, appliance, routeros]
  for: [java, kotlin, class, jar]
  attack: T1497

traits:
  - id: jvm-analysis-env-vars
    desc: Checks FRIDA/QEMU analysis env vars
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'FRIDA_SERVER[\s\S]{0,180}QEMU_LOG'

  - id: jvm-selenium-env-var
    desc: Checks for Selenium automation env
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: SELENIUM_BROWSER

  - id: jvm-analysis-tool-which
    desc: Runs 'which' to find analysis tools
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'ProcessBuilder\("which"[\s\S]{0,180}(frida|gdb|strace|tcpdump)'

  - id: jvm-analysis-tool-bytecode
    desc: tcpdump string in bytecode (sniffer)
    crit: suspicious
    conf: 0.92
    for: [class]
    if:
      type: hex
      pattern: 74 63 70 64 75 6D 70
    unless:
      - type: hex
        pattern: 74 63 70 64 75 6D 70 20 6F 75 74 70 75 74
      - type: text
        substr: vnd.tcpdump.pcap
      - id: well-known/lib/runtime/vertx::vertx-runtime-library
      - id: well-known/app/ai/tool-server/quarkus-agent-mcp::quarkus-agent-mcp-package

  - id: jvm-tasklist-process-check
    desc: JVM bytecode references tasklist
    crit: notable
    conf: 0.94
    for: [class, jar]
    if:
      type: value
      path: class.strings[*]
      exact: tasklist

  - id: jvm-wireshark-tool-name
    desc: JVM bytecode names Wireshark
    crit: component
    conf: 0.9
    for: [class, jar]
    if:
      type: value
      path: class.strings[*]
      exact: wireshark
  - id: jvm-procmon-tool-name
    desc: JVM bytecode names Procmon
    crit: component
    conf: 0.9
    for: [class, jar]
    if:
      type: value
      path: class.strings[*]
      exact: procmon
  - id: jvm-ollydbg-tool-name
    desc: JVM bytecode names OllyDbg
    crit: component
    conf: 0.9
    for: [class, jar]
    if:
      type: value
      path: class.strings[*]
      exact: ollydbg
  - id: jvm-processhacker-tool-name
    desc: JVM bytecode names Process Hacker
    crit: component
    conf: 0.9
    for: [class, jar]
    if:
      type: value
      path: class.strings[*]
      exact: processhacker

composite_rules:
  - id: jvm-vm-artifact-path-set
    desc: JVM VM artifact path set
    crit: suspicious
    conf: 0.93
    needs: 2
    any:
      - id: micro-behaviors/fs/path/proc::cpuinfo-string
      - id: micro-behaviors/fs/path/proc::version-string
      - id: micro-behaviors/fs/path/dmi::product-name-string
      - id: micro-behaviors/fs/path/dmi::vendor-path-string

  - id: jvm-vm-artifact-path-bytecode
    desc: JVM VM artifact path bytecode
    crit: suspicious
    conf: 0.93
    for: [class, jar]
    all:
      - id: metadata/file/magic/identity::jvm-classfile-magic
    needs: 2
    any:
      - id: micro-behaviors/fs/path/proc::cpuinfo-bytecode
      - id: micro-behaviors/fs/path/proc::version-bytecode
      - id: micro-behaviors/fs/path/dmi::product-name-bytecode
    unless:
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/app/media/tiktok::package-member
      - id: micro-behaviors/fs/path/dmi::system-vendor-bytecode
      - id: metadata/package/files/system-package::container-image-tar-name
      # Archive containers aggregate raw member bytes. Do not treat source
      # text inside a tar/zip container as JVM class-file bytecode evidence.
      - id: metadata/package/files/included::archive-container-path
    scope: leaf

  - id: jvm-sandbox-detect-suite
    desc: JVM sandbox detect suite
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/display::java-awt-headless-property
      - id: micro-behaviors/process/attach/jvm::jvm-profiler-attach
      - id: jvm-vm-artifact-path-set

  - id: jvm-sandbox-detect-bytecode
    desc: JVM sandbox detect bytecode
    crit: hostile
    conf: 0.98
    for: [class, jar]
    all:
      - id: micro-behaviors/ui/window/display::java-awt-headless-property-bytecode
      - id: micro-behaviors/process/attach/jvm::jvm-dynamic-attach-api-bytecode
      - id: jvm-vm-artifact-path-bytecode
    scope: leaf

  - id: jvm-linux-analysis-suite
    desc: JVM Linux analysis suite
    crit: hostile
    conf: 0.98
    all:
      - id: jvm-vm-artifact-path-set
      - id: jvm-analysis-env-vars
    any:
      - id: objectives/anti-analysis/browser-detect::java-puppeteer-browser-env
      - id: jvm-selenium-env-var
      - id: jvm-analysis-tool-which

  - id: jvm-source-analysis-suite
    desc: JVM source analysis suite
    crit: hostile
    conf: 0.98
    for: [java, kotlin]
    all:
      - id: micro-behaviors/fs/path/dmi::vendor-path-string
      - id: jvm-analysis-env-vars
    any:
      - id: jvm-selenium-env-var
      - id: jvm-analysis-tool-which

  - id: jvm-analysis-tool-bytecode-suite
    desc: JVM analysis tool bytecode
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: jvm-vm-artifact-path-bytecode
      - id: jvm-analysis-tool-bytecode
      - id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode

  - id: jvm-analysis-process-list-evasion
    desc: JVM checks analysis tools before staged execution
    crit: hostile
    conf: 0.98
    attack: T1057,T1497
    all:
      - id: jvm-tasklist-process-check
      - id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode
      - id: objectives/command-and-control/dropper/staged-loader::java-encrypted-stage-drop-exec
    any:
      - id: jvm-wireshark-tool-name
      - id: jvm-procmon-tool-name
      - id: jvm-ollydbg-tool-name
      - id: jvm-processhacker-tool-name
    needs: 3
