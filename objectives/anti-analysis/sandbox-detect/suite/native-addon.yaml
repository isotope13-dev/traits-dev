defaults:
  platforms:
  - macos
  - linux
  - windows
  for:
  - macho
  - elf
  - pe
  crit: hostile
composite_rules:
- id: native-addon-ci-sandbox-gated-node-launcher
  desc: Native addon analysis gates with hidden sidecar
  conf: 0.98
  attack: T1497.001,T1195.002
  all:
  - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: objectives/anti-analysis/sandbox-detect/suite::ci-pipeline-execution-gate
  - id: micro-behaviors/fs/path-ops::relative-dotfile-path-format
  - id: native-addon-ci-sandbox-gated-node-launcher-execution-evidence
  any:
  - id: objectives/anti-analysis/tool-detect/process::analysis-tool-references-with-process-enumeration
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
- id: windows-native-addon-debugger-hardware-gate
  desc: Hidden addon stage with debugger and RAM checks
  conf: 0.97
  attack: T1622,T1497.001
  platforms:
  - windows
  for:
  - pe
  all:
  - id: objectives/execution/payload/file-exec/detached::native-addon-hidden-sidecar-temp-js-dropper
  - id: objectives/anti-analysis/tool-detect/process::analysis-tool-references-with-process-enumeration
  - id: micro-behaviors/process/debug/detect::import-check-remote-debugger-present
  - id: micro-behaviors/os/sysinfo/memory::import-global-memory-status-ex
- id: native-addon-ci-sandbox-gated-node-launcher-execution-evidence
  desc: Launch or process-replacement evidence
  crit: component
  conf: 1.0
  any:
  - id: micro-behaviors/process/create
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: micro-behaviors/process/replace::aarch64-execve-syscall-sequence
  - id: micro-behaviors/process/replace::arm-eabi-execve
  - id: micro-behaviors/process/replace::c-exec-family-source
  - id: micro-behaviors/process/replace::execveat-api-reference
  - id: micro-behaviors/process/replace::execveat-empty-path-syscall
  - id: micro-behaviors/process/replace::mips-o32-execve-syscall
  - id: micro-behaviors/process/replace::pcntl-exec
  - id: micro-behaviors/process/replace::perl-exec-call
  - id: micro-behaviors/process/replace::perl-exec-variable
  - id: micro-behaviors/process/replace::python-os-execv-call
  - id: micro-behaviors/process/replace::python-os-execve-call
  - id: micro-behaviors/process/replace::python-os-execvp-call
  - id: micro-behaviors/process/replace::python-windows-os-execve-call
  - id: micro-behaviors/process/replace::ruby-exec
  - id: micro-behaviors/process/replace::shell-exec-positional-argument
  - id: micro-behaviors/process/replace::shell-exec-variable-command
  - id: micro-behaviors/process/replace::syscall-exec
  - id: micro-behaviors/process/replace::syscall-execve-elf
  - id: micro-behaviors/process/replace::x86-execve-syscall-sequence
