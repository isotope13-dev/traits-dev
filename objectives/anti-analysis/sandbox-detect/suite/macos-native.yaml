# A macOS native dropper that pairs VM-presence detection with debugger denial
# and in-process payload decryption is an armored stager: it refuses to run
# under analysis and only reveals its next stage on a real victim. MacSync's
# stage-four dropper is the reference -- kern.hv_vmm_present + PT_DENY_ATTACH +
# an XOR/AES-decrypted overlay handed to system(). None of these belong
# together in ordinary application code.
defaults:
  platforms: [macos]
  for: [c, cpp, objectivec]
composite_rules:
  - id: macos-native-armored-dropper
    desc: Native macOS binary evades VM and debugger before decrypting a payload
    crit: hostile
    conf: 0.9
    attack: T1497.001,T1622,T1027
    all:
      - id: objectives/anti-analysis/debugger-detect/check::pt-deny-attach-source
      - id: micro-behaviors/os/virtualization/hypervisor::macos-hv-vmm-present-sysctl
    any:
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    needs: 1
    downgrade:
      any:
        - id: metadata/signed/platform::apple
