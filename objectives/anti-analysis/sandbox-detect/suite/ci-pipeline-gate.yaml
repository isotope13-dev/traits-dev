# Aborting inside CI/CD as an analysis-evasion gate (T1497.001).
#
# Enumerating CI-provider environment variables is neutral on its own -- that is
# exactly what a CI-detection library, build tool or runner agent does, and
# treating the names as evasion has already produced false positives on
# ci_detector.rb, ci_info, simplecov and coveralls (see
# micro-behaviors/os/env/cicd/ruby.yaml).
#
# What is not neutral is a binary that carries a broad provider blocklist *and*
# separately checks whether it is being debugged or run under analysis tooling.
# A build tool asks "am I in CI?" to adjust its output; it has no reason to also
# read TracerPid or fingerprint sandbox hostnames. The pairing is a deliberate
# "only run on a real victim, never in an automated pipeline" gate.
#
# Observed in a Tor-based AUR implant whose blocklist covered 26 providers --
# GitHub Actions, GitLab, Travis, CircleCI, Jenkins, CodeBuild, Buildkite,
# AppVeyor, Bitbucket, Drone, Semaphore, TeamCity, Bamboo, Bitrise, Cirrus,
# Vercel, Wercker, Buddy, Shippable, JetBrains Space, Vela, Screwdriver and
# Distelli -- a breadth no build tool needs.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho]
  attack: T1497.001
  mbc: B0007

composite_rules:
  # Linux native variant: the addon aborts unless several independent host
  # checks pass. Container ancestry, memory and CPU thresholds, and PID 1's
  # command line are checked before its downloader path is reached.
  - id: native-linux-container-resource-sandbox-gate
    desc: Native Linux loader gates activity on container and resource probes
    crit: suspicious
    conf: 0.95
    for: [elf]
    platforms: [linux]
    all:
      - id: micro-behaviors/fs/proc/container::runtime-detection
      - id: micro-behaviors/fs/proc/system::system-meminfo
      - id: micro-behaviors/fs/proc/system::system-cpuinfo
    any:
      - id: micro-behaviors/fs/proc/info/pid::init-process-metadata-procfs-access
      - id: micro-behaviors/fs/proc/memory::process-self-maps

  - id: ci-pipeline-execution-gate
    desc: CI-provider blocklist paired with an analysis check
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/env/cicd::native-ci-provider-marker-cluster
    any:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/os/syscall/invoke::ptrace-import

  # The native addon only reaches its hidden temporary Node-stage loader after
  # rejecting CI, container, low-resource and traced environments. That
  # pairing makes the host checks an execution-evasion gate, not telemetry.
  - id: gated-native-addon-hidden-stage
    desc: Native Node addon hides its staged execution from analysis hosts
    crit: hostile
    conf: 0.98
    attack: T1497.001,T1027,T1059.007
    for: [elf]
    platforms: [linux]
    all:
      - id: ci-pipeline-execution-gate
      - id: native-linux-container-resource-sandbox-gate
      - id: objectives/anti-analysis/debugger-detect/check::unix-tracerpid-debugger-check
    any:
      - id: objectives/supply-chain/hidden-payload/trojan::native-addon-hidden-temp-payload-node-stage
      - id: objectives/supply-chain/hidden-payload/trojan::native-addon-hidden-sidecar-node-stage
