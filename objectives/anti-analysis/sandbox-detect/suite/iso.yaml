defaults:
  platforms: [windows]
  for: [iso]
  attack: T1497,T1622

composite_rules:
  - id: iso-vb6-sandbox-debugger-loader
    desc: ISO embeds a VB6 loader probing Sandboxie and process state
    crit: hostile
    conf: 0.99
    attack: T1497,T1622,T1055
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-sandbox-debugger-module-cluster
      - id: metadata/file/format/iso::iso-native-memory-api-cluster
