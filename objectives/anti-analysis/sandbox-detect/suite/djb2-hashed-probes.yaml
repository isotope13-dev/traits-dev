# Sandbox and debugger probes reached only through DJB2-hashed API names:
# total RAM (GlobalMemoryStatusEx), screen size (GetSystemMetrics), mouse
# movement (GetCursorPos) and a remote-debugger check. Hashing the names
# hides that the program fingerprints its host before doing anything else.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1497.001,T1027.007
  mbc: B0007

composite_rules:
  - id: djb2-hashed-sandbox-probes
    desc: Hash-resolved RAM, screen and cursor probes
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/os/api-resolution/hash-based::djb2-globalmemorystatusex
      - id: micro-behaviors/os/api-resolution/hash-based::djb2-getsystemmetrics
      - id: micro-behaviors/os/api-resolution/hash-based::djb2-getcursorpos
      - id: micro-behaviors/os/api-resolution/hash-based::djb2-checkremotedebuggerpresent
    needs: 3

  # The probes guard a payload carried in appended data that dominates the
  # file: the stub releases its contents only on hosts that look real.
  - id: overlay-carrier-hashed-sandbox-gate
    desc: Overlay carrier gated by hashed sandbox probes
    crit: hostile
    conf: 0.9
    all:
      - id: djb2-hashed-sandbox-probes
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
    unless:
      - id: metadata/signed/platform/
