defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1497
composite_rules:
- id: payload-gated-anti-analysis-suite
  desc: Go dropper gates its payload behind debugger and sandbox checks
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/symbols/name/analysis::debugger-check-runner
  - id: metadata/binary/symbols/name/analysis::aggregate-sandbox-checks
  - id: metadata/binary/symbols/name/analysis::memory-sandbox-check
  - id: metadata/binary/symbols/name/analysis::disk-sandbox-check
  - id: metadata/binary/symbols/name/analysis::stealth-check-runner
  - id: micro-behaviors/data/string/container::payload-container-name-text
