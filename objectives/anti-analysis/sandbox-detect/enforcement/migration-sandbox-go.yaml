defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1497
composite_rules:
- id: payload-gated-anti-analysis-suite
  desc: Go dropper gates its payload behind debugger and sandbox checks
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/anti-analysis/sandbox-detect/routine-name::debugger-check-runner
  - id: objectives/anti-analysis/sandbox-detect/routine-name::aggregate-sandbox-checks
  - id: objectives/anti-analysis/sandbox-detect/routine-name::memory-sandbox-check
  - id: objectives/anti-analysis/sandbox-detect/routine-name::disk-sandbox-check
  - id: objectives/anti-analysis/sandbox-detect/routine-name::stealth-check-runner
  - id: micro-behaviors/data/string/container::payload-container-name-text
