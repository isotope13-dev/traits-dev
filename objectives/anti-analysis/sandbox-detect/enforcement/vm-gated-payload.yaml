# A packed binary that reads the BIOS vendor, exits when it does not like the
# answer, and carries an embedded payload it never has to name.
#
# Each half is already understood. `bios-vm-check-and-exit` says the sample
# refuses to run under analysis; `massive-file-minimal-imports` and
# `embedded-payload-binary` say almost nothing it does is visible in its
# import table, because the real program arrives after unpacking. Together
# they describe a sample built so that the only environment it will reveal
# itself in is one nobody is watching -- which is the whole point of both
# halves, and is not something a legitimate packed installer does.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001,T1027.002
  mbc: B0009

composite_rules:
  - id: vm-gated-packed-payload
    desc: Refuses to run in a VM and unpacks its payload
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/anti-analysis/vm-detect/registry::bios-vm-check-and-exit
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::embedded-payload-binary
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::massive-file-minimal-imports
    needs: 2
