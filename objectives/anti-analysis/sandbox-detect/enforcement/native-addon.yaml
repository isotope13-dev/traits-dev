  crit: component
  conf: 1.0
  for:
  - applescript
  - asp
  - batch
  - binaries
  - c
  - cfml
  - class
  - clojure
  - composer.json
  - cpp
  - csharp
  - data
  - desktop-entry
  - dll
  - dmg
  - dockerfile
  - dylib
  - elf
  - elixir
  - github-actions
  - go
  - groovy
  - html
  - ircii
  - jar
  - java
  - java_class
  - javascript
  - json
  - jsp
  - kotlin
  - lnk
  - lua
  - macho
  - makefile
  - markdown
  - mirc
  - msi
  - npm
  - objc
  - objectivec
  - oledoc
  - ooxml
  - package.json
  - pbxproj
  - pe
  - perl
  - php
  - pickle
  - powershell
  - pyc
  - python
  - registry
  - ruby
  - rust
  - scripts
  - shell
  - source
  - static-lib
