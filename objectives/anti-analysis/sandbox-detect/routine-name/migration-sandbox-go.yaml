defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: debugger-check-runner-text
  desc: Go anti-debug routine name text
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.ADBGRun
- id: debugger-check-runner-symbol
  desc: Go anti-debug routine symbol
  crit: notable
  conf: 0.97
  if:
    type: symbol
    regex: /stealth\.ADBGRun(\.|$)
- id: aggregate-sandbox-checks-text
  desc: Go sandbox-check routine name text
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.AllSandboxChecks
- id: aggregate-sandbox-checks-symbol
  desc: Go sandbox-check routine symbol
  crit: notable
  conf: 0.97
  if:
    type: symbol
    regex: /stealth\.AllSandboxChecks(\.|$)
- id: memory-sandbox-check-text
  desc: Go memory-check routine name text
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.MemoryCheck
- id: memory-sandbox-check-symbol
  desc: Go memory-check routine symbol
  crit: notable
  conf: 0.97
  if:
    type: symbol
    regex: /stealth\.MemoryCheck(\.|$)
- id: disk-sandbox-check-text
  desc: Go disk-check routine name text
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.DiskCheck
- id: disk-sandbox-check-symbol
  desc: Go disk-check routine symbol
  crit: notable
  conf: 0.97
  if:
    type: symbol
    regex: /stealth\.DiskCheck(\.|$)
- id: stealth-check-runner-text
  desc: Go stealth routine name text
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.RunStealth
- id: stealth-check-runner-symbol
  desc: Go stealth routine symbol
  crit: notable
  conf: 0.97
  if:
    type: symbol
    regex: /stealth\.RunStealth(\.|$)
composite_rules:
- id: debugger-check-runner
  desc: Go anti-debug routine name
  crit: notable
  conf: 0.97
  any:
  - id: debugger-check-runner-text
  - id: debugger-check-runner-symbol
- id: aggregate-sandbox-checks
  desc: Go sandbox-check routine name
  crit: notable
  conf: 0.97
  any:
  - id: aggregate-sandbox-checks-text
  - id: aggregate-sandbox-checks-symbol
- id: memory-sandbox-check
  desc: Go memory-check routine name
  crit: notable
  conf: 0.97
  any:
  - id: memory-sandbox-check-text
  - id: memory-sandbox-check-symbol
- id: disk-sandbox-check
  desc: Go disk-check routine name
  crit: notable
  conf: 0.97
  any:
  - id: disk-sandbox-check-text
  - id: disk-sandbox-check-symbol
- id: stealth-check-runner
  desc: Go stealth routine name
  crit: notable
  conf: 0.97
  any:
  - id: stealth-check-runner-text
  - id: stealth-check-runner-symbol
