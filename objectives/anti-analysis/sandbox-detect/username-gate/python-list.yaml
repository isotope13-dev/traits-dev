defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-analysis-username-list-check
    desc: Tests username against analysis-environment list
    crit: suspicious
    conf: 0.98
    size_max: 32768
    attack: T1497.001
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment
            left: (identifier) @deny
            right: (tuple) @labels))
          (function_definition body: (block
            (expression_statement (assignment
              left: (identifier) @user right: (call) @normalize))
            (for_statement left: (identifier) @item right: (identifier) @used
              body: (block (if_statement
                condition: (comparison_operator
                  (identifier) @needle (identifier) @haystack) @test
                consequence: (block (return_statement (true)))))))))
          (#eq? @deny @used)
          (#eq? @user @haystack)
          (#eq? @item @needle)
          (#match? @test " in ")
          (#match? @normalize "getpass\\.getuser\\(\\)\\.(lower|casefold)\\(\\)")
          (#match? @labels "[\"']sandbox[\"']")
          (#match? @labels "[\"'](analyst|cuckoo)[\"']"))
