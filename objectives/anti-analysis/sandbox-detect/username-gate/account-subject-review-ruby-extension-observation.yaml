defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-extconf-generated-user-sandbox-regex
    desc: Ruby username comparison with analysis names
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'user\s*=~\s*/\\AuA\d+/i|user\s*=~\s*/(sandbox|tester|analys|scanner)/i'
