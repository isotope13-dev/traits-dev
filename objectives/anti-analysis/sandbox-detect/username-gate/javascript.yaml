# JavaScript/TypeScript screening of host and user identity against sandbox
# and malware-analyst naming markers (ATT&CK T1497.001).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1497.001
  mbc: B0007

traits:
  - id: js-sandbox-pattern-literal
    desc: Matches sandbox marker string or regex
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(/sandbox/|["'']sandbox["''])'

  - id: js-analyst-pattern-literal
    desc: Matches analyst marker string or regex
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(/analyst/|["'']analyst["''])'

composite_rules:
  - id: js-host-user-sandbox-analyst-screen
    desc: Screens host and user for sandbox markers
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: js-sandbox-pattern-literal
      - id: js-analyst-pattern-literal
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
