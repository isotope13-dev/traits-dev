# Target-specific username gates can keep a tailored implant from activating
# in sandboxes or on non-selected hosts.  These composites describe code
# structure, never a target value from one incident.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, pe, dll, python, go, javascript, typescript]
  attack: T1497

traits:
composite_rules:
  - id: windows-normalized-username-gate
    desc: Windows normalized username gate
    crit: suspicious
    conf: 0.97
    platforms: [windows]
    for: [c, cpp, pe, dll]
    all:
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name
      - id: micro-behaviors/data/string/library::tolower
    any:
      - id: micro-behaviors/data/string/library::strstr
      - id: micro-behaviors/data/string/library::strstr-source-call
    near_lines: 30

  - id: normalized-username-substring-gate
    desc: Normalized username substring execution gate
    crit: suspicious
    conf: 0.97
    any:
      - id: windows-normalized-username-gate
      - id: micro-behaviors/process/user/query::python-normalized-username-substring
