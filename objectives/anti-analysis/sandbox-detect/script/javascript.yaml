# JavaScript / Node.js sandbox & analysis-environment evasion
# ATT&CK: T1497 (Virtualization/Sandbox Evasion)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1497"
  mbc: "B0007"
traits:
  - id: js-cpu-count-sandbox-check
    desc: os.cpus() low-count sandbox check
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\bcpus\(\)[\s\S]{0,60}\.length\s*<\s*[1-4]\b'
  # Property cluster from npm "environment detector" helpers used as an
  # analysis gate: skip payload work when CI/bot/container/VM signals fire.
  - id: js-isci-env-property
    desc: Reads isCI environment detector property
    crit: notable
    conf: 0.85
    if:
      type: text
      word: isCI
  - id: js-iscontainer-env-property
    desc: Reads isContainer environment detector property
    crit: notable
    conf: 0.88
    if:
      type: text
      word: isContainer
  - id: js-isvm-likely-env-property
    desc: Reads isVirtualMachineLikely detector property
    crit: notable
    conf: 0.9
    if:
      type: text
      word: isVirtualMachineLikely
  - id: js-isnpmbot-env-property
    desc: Reads isNpmBot environment detector property
    crit: notable
    conf: 0.9
    if:
      type: text
      word: isNpmBot
  - id: js-automated-sandboxed-env-message
    desc: Mentions automated or sandboxed environment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)automated[/ ]sandboxed environment'
composite_rules:
  - id: js-sandbox-check-obfuscated
    desc: Sandbox check in obfuscated script
    crit: suspicious
    conf: 0.9
    size_max: 262144
    all:
    - id: js-cpu-count-sandbox-check
    - id: objectives/exfiltration/sensitive-data::js-custom-string-decoder
    downgrade:
      any:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
  - id: js-multi-signal-automated-env-gate
    desc: Multi-signal CI container VM environment gate
    # Detecting CI/bot/container/VM is what env-detector libraries do; keep
    # this notable until paired with a payload loader in the hostile composite.
    crit: notable
    conf: 0.93
    attack: T1497.001
    needs: 3
    any:
      - id: js-isci-env-property
      - id: js-iscontainer-env-property
      - id: js-isvm-likely-env-property
      - id: js-isnpmbot-env-property
      - id: js-automated-sandboxed-env-message
    unless:
      - id: metadata/package/testing/
      - id: metadata/library/structure::js-large-module-bundle
  - id: sandbox-gated-aes-global-dispatch
    desc: AES global dispatch gated behind sandbox checks
    crit: hostile
    conf: 0.97
    attack: T1497.001, T1027.013, T1059.007
    mbc: B0007, B0024
    all:
      - id: js-multi-signal-automated-env-gate
      - id: objectives/anti-static/obfuscation/syntax::js-aes-decrypt-then-global-dispatch
    unless:
      - id: metadata/package/testing/
