# Groovy script sandbox/analysis detection. Mirrors the PHP hostname-pattern
# coverage: JVM stealer ports check InetAddress hostnames against sandbox
# keywords before exfiltrating, and no Groovy atom caught that until now.
defaults:
  platforms: [unix, windows]
  for: [groovy]
  attack: T1497
  mbc: B0007

traits:
  - id: groovy-sandbox-host-pattern
    desc: Groovy hostname vs sandbox/VM keyword
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(hostName|getHostName\(\))[\s\S]{0,140}(sandbox|vmware|vbox|qemu|virtualbox)'
