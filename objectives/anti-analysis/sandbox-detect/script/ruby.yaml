# Ruby CI/CD environment skip gates (sandbox/CI evasion before payload)
# ATT&CK: T1497.001 (System Checks) / MBC B0007
defaults:
  platforms: [windows, unix]
  for: [ruby]
  attack: T1497.001
  mbc: B0007
  crit: notable
  conf: 0.85

traits:
- id: gitlab-ci-env-word
  desc: GITLAB_CI environment token
  crit: notable
  conf: 0.85
  if:
    type: text
    word: GITLAB_CI

- id: circleci-env-word
  desc: CIRCLECI environment token
  crit: notable
  conf: 0.85
  if:
    type: text
    word: CIRCLECI

- id: travis-ci-env-word
  desc: TRAVIS environment token
  crit: notable
  conf: 0.8
  if:
    type: text
    word: TRAVIS

- id: jenkins-url-env-word
  desc: JENKINS_URL environment token
  crit: notable
  conf: 0.8
  if:
    type: text
    word: JENKINS_URL

composite_rules:
# Multi-CI probes used to abort before remote install — common in
# supply-chain loaders that target developer laptops, not build runners.
- id: ruby-multi-ci-env-probe
  desc: Ruby probes multiple CI platform env vars
  crit: suspicious
  conf: 0.9
  needs: 4
  any:
  - id: micro-behaviors/os/env/vars/cicd::github-actions-flag
  - id: gitlab-ci-env-word
  - id: circleci-env-word
  - id: travis-ci-env-word
  - id: jenkins-url-env-word

- id: ruby-ci-skip-remote-loader
  desc: Ruby CI-skip gate with remote download and spawn
  crit: hostile
  conf: 0.96
  near_bytes: 8000
  all:
  - id: ruby-multi-ci-env-probe
  - id: micro-behaviors/communications/http/lib/netlib::net-http
  - id: micro-behaviors/fs/write/file/direct::ruby-file-write-content
  - id: micro-behaviors/process/create/direct::ruby-spawn
