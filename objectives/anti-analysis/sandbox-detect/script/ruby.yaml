# Ruby CI/CD environment skip gates (sandbox/CI evasion before payload)
# ATT&CK: T1497.001 (System Checks) / MBC B0007
#
# The CI env-var NAME atoms and the multi-probe composite that used to live here
# were relocated to micro-behaviors/os/env/vars/cicd/ruby.yaml: enumerating CI
# platform environment variables is a neutral capability -- it is precisely what
# a CI-detection library does, including RubyGems' and Bundler's own
# ci_detector.rb, which ships in every Ruby install -- not sandbox evasion. The
# sibling cicd::github-actions-flag was already in micro-behaviors. The evasion
# INTENT is this file's remaining composite, which gates the probe on an actual
# remote download, file write and spawn.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  attack: T1497.001
  mbc: B0007
  crit: notable
  conf: 0.85

composite_rules:
- id: ruby-ci-skip-remote-loader
  desc: Ruby CI-skip gate with remote download and spawn
  crit: hostile
  conf: 0.96
  near_bytes: 8000
  all:
  - id: micro-behaviors/os/env/vars/cicd::ruby-multi-ci-env-probe
  - id: micro-behaviors/communications/http/lib/netlib::net-http
  - id: micro-behaviors/fs/write/file/direct::ruby-file-write-content
  - id: micro-behaviors/process/create/direct::ruby-spawn
