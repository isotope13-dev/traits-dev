# Script-side sandbox detection patterns. The sandbox-detect/inline/ tree
# is generic string-derived; this file focuses on Python-specific code
# shapes (gethostname compares, recent-files counts, mouse-position polls,
# /proc/scsi sniffs) that scripts use to skip C2 in analysis VMs.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1497
  mbc: B0007
  crit: suspicious
  conf: 0.9
traits:
  # gethostname compared against sandbox-keyword set
- id: vmware-analysis-marker
  desc: VMware analysis marker string
  crit: notable
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: vmware
- id: anubis-analysis-marker
  desc: Anubis sandbox marker string
  crit: notable
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: anubis
- id: joebox-analysis-marker
  desc: JoeBox sandbox marker string
  crit: notable
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: joebox
- id: malware-analysis-marker
  desc: Malware analysis marker string
  crit: component
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: malware
  unless:
  - id: well-known/tool/detection/skill-scanner::source-context
- id: cwd-sandbox-keyword-check--rx-21
  desc: CWD API near sandbox-analysis marker
  crit: notable
  if:
    type: text
    regex: '(?i)(getcwd|Path\.cwd|\.cwd)[^\n]{0,80}sandbox'
- id: cuckoo-analysis-marker
  desc: Cuckoo sandbox marker string
  crit: notable
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: cuckoo
- id: virus-analysis-marker
  desc: Virus analysis marker string
  crit: component
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: virus
  # NOTE: a bare cursor-position read (GetCursorPos / pyautogui.position) is a
  # neutral input capability, not sandbox detection — it lives at
  # micro-behaviors/hardware/input/mouse/position::cursor-position-read. Real
  # cursor-based sandbox evasion polls the position in a loop and compares
  # samples; add such a composite here if that pattern is needed.

  # Recent files count check — fresh sandboxes have few recent files
- id: recent-files-empty-check
  desc: Recent-files count checked (sandbox indicator)
  if:
    type: text
    regex: '(%RECENT%|os\.listdir\s*\([^)\n]{0,80}Recent[^)\n]{0,40}\))[^\n]{0,80}(len|count)'

- id: dual-identity-marker-condition
  desc: Marker tested against two identity values
  crit: component
  conf: 0.86
  if:
    type: tree-sitter
    kind: conditional
    regex: '(?s)\b[A-Za-z_]\w*\s+in\s+[A-Za-z_]\w*\s+or\s+[A-Za-z_]\w*\s+in\s+[A-Za-z_]\w*'

  # Physical memory check — sandboxes often have <4 GB
  unless:
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
    - id: well-known/app/system/home-assistant::home-assistant-identity
    - id: well-known/app/system/home-assistant::components-tree-path
- id: physical-mem-low-check--rx-25
  desc: Windows physical-memory API
  crit: baseline
  if:
    type: text
    substr: GetPhysicallyInstalledSystemMemory
- id: physical-mem-low-check--rx-27
  desc: psutil 2GB memory threshold
  crit: baseline
  if:
    type: text
    regex: 'psutil\.virtual_memory.{0,80}2147483648'
- id: physical-mem-low-check--rx-28
  desc: psutil 4GB memory threshold
  crit: baseline
  if:
    type: text
    regex: 'psutil\.virtual_memory.{0,80}4294967296'
- id: vm-artifact-vbox-file-check--rx-30
  desc: Python VirtualBox artifact file check
  crit: notable
  if:
    type: text
    regex: '(os\.path\.(exists|isfile)|Path.{0,20}is_file).{0,80}(VBox|vbox|VirtualBox)'
  unless:
  - id: well-known/tool/detection/security-scanner::penterep-ptsrvtester-package
- id: vm-artifact-vbox-file-check--rx-33
  desc: VM service-name artifact marker
  crit: notable
  if:
    type: text
    regex: '\b(VBoxService|vboxservice|vboxguest)\b'
  unless:
  - id: well-known/tool/detection/security-scanner::penterep-ptsrvtester-package
- id: vm-artifact-vbox-file-check--rx-34
  desc: VirtualBox Guest token
  crit: notable
  if:
    type: text
    regex: '\b(VirtualBox Guest|Guest Additions|vboxguest)\b'
  unless:
  - id: well-known/tool/detection/security-scanner::penterep-ptsrvtester-package
- id: vm-artifact-vbox-file-check--rx-35
  desc: VirtualBox Mouse token
  crit: component
  if:
    type: text
    regex: '\b(VBoxMouse|vboxmouse)\b'
  unless:
  - id: well-known/tool/detection/security-scanner::penterep-ptsrvtester-package
- id: vm-artifact-vbox-file-check--rx-36
  desc: VBox artifact token
  crit: component
  if:
    type: text
    regex: '\b(VBox|vbox|VirtualBox)\b'
  unless:
  - id: well-known/tool/detection/security-scanner::penterep-ptsrvtester-package
- id: vm-artifact-vmware-file-check--rx-37
  desc: Python VMware tools file check
  crit: baseline
  if:
    type: text
    regex: '(os\.path\.exists|os\.path\.isfile|Path[^\n]{0,40}is_file)\s*\([^)\n]{0,200}vmtools'
- id: vm-artifact-vmware-file-check--rx-38
  desc: VMware mouse driver token
  crit: baseline
  if:
    type: text
    substr: vmmouse
- id: vm-artifact-vmware-file-check--rx-39
  desc: VMware service token
  crit: baseline
  if:
    type: text
    substr: vmwsvc
- id: vm-artifact-proc-scsi-check
  desc: /proc/scsi/scsi inspected for VM strings
  if:
    type: text
    regex: '(open|Path)\s*\(\s*["'']/proc/scsi/scsi["'']'

composite_rules:
- id: python-platform-node-sandbox-gate
  desc: Python skips behavior on sandbox hostname
  crit: suspicious
  conf: 0.95
  near_bytes: 512
  all:
  - id: micro-behaviors/os/sysinfo/platform/host::platform-node
  - id: micro-behaviors/data/control-flow/analysis::python-early-return-call-gate
  any:
  - id: vmware-analysis-marker
  - id: anubis-analysis-marker
  - id: joebox-analysis-marker
  - id: malware-analysis-marker
  - id: cwd-sandbox-keyword-check--rx-21
  - id: cuckoo-analysis-marker
  - id: virus-analysis-marker
- id: pre-exec-long-sleep
  desc: Long sleep (>=60s) before subsequent execution
  crit: suspicious
  conf: 0.85
  near_bytes: 512
  all:
  - id: micro-behaviors/time/sleep/interval::python-sleep-call
  - id: micro-behaviors/time/sleep/interval::python-long-sleep-call
  any:
  - id: micro-behaviors/process/create/subprocess::process-execution
  - id: micro-behaviors/process/create/spawn::spawn-call
  unless:
  - id: metadata/package/testing/
  - id: micro-behaviors/data/control-flow/loop::python-while-true
  - id: micro-behaviors/time/sleep/interval::python-retry-backoff-sleep
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
  - id: well-known/app/infrastructure/walinuxagent::source-tree
  - id: well-known/tool/detection/stackrox::stackrox-cluster-ci-context
- id: python-script-sandbox-check
  desc: Python script performs sandbox detection
  crit: suspicious
  conf: 0.94
  any:
  - id: pre-exec-long-sleep
  - id: hostname-sandbox-keyword-check
  - id: hostname-in-sandbox-list
  - id: cwd-sandbox-keyword-check
  - id: physical-mem-low-check
  - id: vm-artifact-vbox-file-check
  - id: vm-artifact-vmware-file-check
  - id: recent-files-empty-check
  # A bare low-CPU-count comparison is capacity sizing, not evasion (it lives
  # at micro-behaviors/os/sysinfo/cpu). Only the variant that exits on the
  # result belongs in this set.
  - id: python-cpu-count-exit-gate
  - id: vm-artifact-proc-scsi-check
  unless:
  - id: well-known/tool/detection/skill-scanner::source-context
  - id: micro-behaviors/crypto/library/blockchain/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: well-known/app/system/home-assistant::home-assistant-identity
  - id: well-known/app/system/home-assistant::components-tree-path
- id: python-host-user-analysis-marker-check
  desc: Python checks host and user identities for analysis markers
  crit: suspicious
  conf: 0.97
  near_lines: 12
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  - id: micro-behaviors/process/user/query::python-getpass-user
  - id: dual-identity-marker-condition
  any:
  - id: vmware-analysis-marker
  - id: anubis-analysis-marker
  - id: joebox-analysis-marker
  - id: malware-analysis-marker
  - id: cuckoo-analysis-marker
  - id: virus-analysis-marker
- id: python-sandbox-gated-env-http-exfil
  desc: Sandbox check gates Python environment exfiltration
  crit: hostile
  conf: 0.98
  attack: T1497.001,T1552.001,T1041
  mbc: B0007,E1041
  size_max: 262144
  near_lines: 40
  all:
  - id: python-host-user-analysis-marker-check
  - id: micro-behaviors/data/control-flow/analysis::python-early-return-call-gate
  - id: objectives/exfiltration/stealer/credential/env::python-env-json-urllib-exfil
- id: hostname-sandbox-keyword-check
  desc: Hostname compared to sandbox-keyword
  crit: baseline
  conf: 1.0
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  any:
  - id: malware-analysis-marker
  - id: objectives/anti-analysis/sandbox-detect/script::cwd-sandbox-keyword-check--rx-21
  - id: anubis-analysis-marker
  - id: cuckoo-analysis-marker
  - id: joebox-analysis-marker
  - id: vmware-analysis-marker
  near_bytes: 256
- id: hostname-in-sandbox-list
  desc: Hostname checked against sandbox list
  crit: baseline
  conf: 1.0
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  any:
  - id: malware-analysis-marker
  - id: cwd-sandbox-keyword-check--rx-21
  - id: anubis-analysis-marker
  - id: cuckoo-analysis-marker
  - id: joebox-analysis-marker
  - id: virus-analysis-marker
  near_bytes: 256
- id: cwd-sandbox-keyword-check
  desc: cwd checked for sandbox keyword
  crit: baseline
  conf: 1.0
  all:
  - id: micro-behaviors/fs/directory/cwd/
  any:
  - id: malware-analysis-marker
  - id: cwd-sandbox-keyword-check--rx-21
  - id: cuckoo-analysis-marker
  - id: virus-analysis-marker
  near_bytes: 256
- id: physical-mem-low-check
  desc: Physical memory checked for low-spec sandbox
  crit: baseline
  conf: 1.0
  any:
  - id: physical-mem-low-check--rx-25
  - id: physical-mem-low-check--rx-27
  - id: physical-mem-low-check--rx-28
- id: vm-artifact-vbox-file-check
  desc: VirtualBox driver file existence check
  crit: baseline
  conf: 1.0
  all:
  - id: vm-artifact-vbox-file-check--rx-30
  - id: vm-artifact-vbox-artifact-token
- id: vm-artifact-vbox-artifact-token
  desc: VirtualBox artifact token
  crit: component
  conf: 1.0
  any:
  - id: vm-artifact-vbox-file-check--rx-33
  - id: vm-artifact-vbox-file-check--rx-34
  - id: vm-artifact-vbox-file-check--rx-35
  - id: vm-artifact-vbox-file-check--rx-36
- id: vm-artifact-vmware-file-check
  desc: VMware driver file existence check
  crit: baseline
  conf: 1.0
  any:
  - id: vm-artifact-vmware-file-check--rx-37
  - id: vm-artifact-vmware-file-check--rx-38
  - id: vm-artifact-vmware-file-check--rx-39
