# Script-side sandbox detection patterns. The sandbox-detect/inline/ tree
# is generic string-derived; this file focuses on Python-specific code
# shapes (gethostname compares, recent-files counts, mouse-position polls,
# /proc/scsi sniffs) that scripts use to skip C2 in analysis VMs.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1497
  mbc: B0007
  crit: suspicious
  conf: 0.9
traits:
  # gethostname compared against sandbox-keyword set
- id: anubis-analysis-marker
  desc: Anubis sandbox marker string
  crit: notable
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: anubis
- id: joebox-analysis-marker
  desc: JoeBox sandbox marker string
  crit: notable
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: joebox
- id: malware-analysis-marker
  desc: Malware analysis marker string
  crit: component
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: malware
  unless:
  - id: well-known/tool/detection/agent/skill-scanner::source-context
# A cwd read with "sandbox" merely co-mentioned on the line is not a check:
# sandbox-management tools write `Path.cwd(), base_config.sandbox)` when they
# pass a container-sandbox *name* beside a working directory. Require the
# comparison/gating vocabulary that decides on the cwd value instead, in
# either order.
- id: cwd-sandbox-keyword-check--rx-21
  desc: sandbox keyword compared against a cwd value
  crit: notable
  if:
    type: text
    regex: '(?i)sandbox[^\n]{0,20}(==|!=|\bin\b)[^\n]{0,10}(getcwd|\.cwd)'
- id: cwd-sandbox-keyword-check--rx-22
  desc: cwd value compared against sandbox keyword
  crit: notable
  if:
    type: text
    regex: '(?i)(getcwd|\.cwd)\(\)[^\n]{0,60}(==|!=|in\b|find\(|startswith)[^\n]{0,40}sandbox'
- id: virus-analysis-marker
  desc: Virus analysis marker string
  crit: component
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: virus
  # NOTE: a bare cursor-position read (GetCursorPos / pyautogui.position) is a
  # neutral input capability, not sandbox detection — it lives at
  # micro-behaviors/hardware/input/mouse/position::cursor-position-read. Real
  # cursor-based sandbox evasion polls the position in a loop and compares
  # samples; add such a composite here if that pattern is needed.

  # Recent files count check — fresh sandboxes have few recent files
- id: recent-files-empty-check
  desc: Recent-files count checked (sandbox indicator)
  if:
    type: text
    regex: '(%RECENT%|os\.listdir\s*\([^)\n]{0,80}Recent[^)\n]{0,40}\))[^\n]{0,80}(len|count)'

- id: dual-identity-marker-condition
  desc: Marker tested against two identity values
  crit: component
  conf: 0.86
  if:
    type: tree-sitter
    kind: conditional
    regex: '(?s)\b[A-Za-z_]\w*\s+in\s+[A-Za-z_]\w*\s+or\s+[A-Za-z_]\w*\s+in\s+[A-Za-z_]\w*'

  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
    - id: well-known/app/system/home-assistant::home-assistant-identity
    - id: well-known/app/system/home-assistant::components-tree-path
- id: vm-artifact-vbox-file-check--rx-30
  desc: Python VirtualBox artifact file check
  crit: notable
  if:
    type: text
    regex: '(os\.path\.(exists|isfile)|Path.{0,20}is_file).{0,80}(VBox|vbox|VirtualBox)'
  unless:
  - id: well-known/tool/detection/ptsrvtester::penterep-ptsrvtester-package
- id: vm-artifact-vbox-file-check--rx-34
  desc: VirtualBox Guest token
  crit: notable
  if:
    type: text
    regex: '\b(VirtualBox Guest|Guest Additions|vboxguest)\b'
  unless:
  - id: well-known/tool/detection/ptsrvtester::penterep-ptsrvtester-package
- id: vm-artifact-vbox-file-check--rx-35
  desc: VirtualBox Mouse token
  crit: component
  if:
    type: text
    regex: '\b(VBoxMouse|vboxmouse)\b'
  unless:
  - id: well-known/tool/detection/ptsrvtester::penterep-ptsrvtester-package
- id: vm-artifact-vbox-file-check--rx-36
  desc: VBox artifact token
  crit: component
  if:
    type: text
    regex: '\b(VBox|vbox|VirtualBox)\b'
  unless:
  - id: well-known/tool/detection/ptsrvtester::penterep-ptsrvtester-package
- id: vm-artifact-vmware-file-check--rx-37
  desc: Python VMware tools file check
  crit: baseline
  if:
    type: text
    # The checked path must be a string literal. Identifier-built roots
    # (`self.root_dir + '/usr/bin/vmtoolsd'`) are image-build packaging code
    # inspecting the tree it just produced, not host sandbox probing.
    regex: '(os\.path\.exists|os\.path\.isfile|Path[^\n]{0,40}is_file)\s*\(\s*["''][^)\n]{0,200}vmtools'
- id: vm-artifact-vmware-file-check--rx-38
  desc: VMware mouse driver file check
  crit: baseline
  if:
    type: text
    regex: '(os\.path\.exists|os\.path\.isfile|Path[^\n]{0,40}is_file)\s*\([^)\n]{0,200}vmmouse'
- id: vm-artifact-vmware-file-check--rx-39
  desc: VMware service file check
  crit: baseline
  if:
    type: text
    regex: '(os\.path\.exists|os\.path\.isfile|Path[^\n]{0,40}is_file)\s*\([^)\n]{0,200}vmwsvc'
- id: vm-artifact-proc-scsi-check
  desc: /proc/scsi/scsi inspected for VM strings
  if:
    type: text
    regex: '(open|Path)\s*\(\s*["'']/proc/scsi/scsi["'']'
- id: user-profile-personal-folders-check
  desc: User profile personal folders checked
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'os\.path\.(isdir|exists)\s*\([^)\n]{0,80}[(,\s]["''](Documents|Downloads)["'']'
  unless:
    - id: metadata/path/directory::test-directory-component

composite_rules:
- id: python-platform-node-sandbox-gate
  desc: Python skips behavior on sandbox hostname
  crit: suspicious
  conf: 0.95
  near_bytes: 512
  all:
  - id: micro-behaviors/os/sysinfo/platform/host::platform-node
  - id: micro-behaviors/data/control-flow/return::python-early-return-call-gate
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-name-literal
  - id: anubis-analysis-marker
  - id: joebox-analysis-marker
  - id: malware-analysis-marker
  - id: cwd-sandbox-keyword-check--rx-21
  - id: cwd-sandbox-keyword-check--rx-22
  - id: metadata/lang/source/literal/string::python-cuckoo-string
  - id: virus-analysis-marker
- id: python-script-sandbox-check
  desc: Python script performs sandbox detection
  crit: suspicious
  conf: 0.94
  any:
  - id: hostname-sandbox-keyword-check
  - id: hostname-in-sandbox-list
  - id: cwd-sandbox-keyword-check
  - id: vm-artifact-vbox-file-check
  - id: vm-artifact-vmware-file-check
  - id: python-cpu-count-exit-gate
  unless:
  - id: well-known/tool/detection/agent/skill-scanner::source-context
  - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: well-known/app/system/home-assistant::home-assistant-identity
  - id: well-known/app/system/home-assistant::components-tree-path
  - id: micro-behaviors/metaprogramming/generation/source::source-template-transformer
- id: python-host-user-analysis-marker-check
  desc: Python checks host and user identities for analysis markers
  crit: suspicious
  conf: 0.97
  near_lines: 12
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  - id: micro-behaviors/process/identity/query::python-getpass-user
  - id: dual-identity-marker-condition
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-name-literal
  - id: anubis-analysis-marker
  - id: joebox-analysis-marker
  - id: malware-analysis-marker
  - id: metadata/lang/source/literal/string::python-cuckoo-string
  - id: virus-analysis-marker
- id: python-sandbox-gated-env-http-exfil
  desc: Sandbox check gates Python environment exfiltration
  crit: hostile
  conf: 0.98
  attack: T1497.001,T1552.001,T1041
  mbc: B0007,E1041
  size_max: 262144
  near_lines: 40
  all:
  - id: python-host-user-analysis-marker-check
  - id: micro-behaviors/data/control-flow/return::python-early-return-call-gate
  - id: objectives/exfiltration/stealer/credential/value::python-env-json-urllib-exfil
- id: python-sandbox-gated-code-execution
  desc: Sandbox clues and dynamic-code references
  crit: suspicious
  conf: 0.98
  attack: T1497.001,T1059.006
  mbc: B0007,E1059
  all:
    - id: python-script-sandbox-check
  any:
    - id: micro-behaviors/process/interpreter/python::python-getattr-builtins
    - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    - id: micro-behaviors/process/interpreter/eval/indirect::python-getattr-builtin-call
    - id: micro-behaviors/process/interpreter/eval/direct::python-dynamic-code-evaluation
- id: hostname-sandbox-keyword-check
  desc: Hostname query near sandbox-related markers
  crit: baseline
  conf: 1.0
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  any:
  - id: malware-analysis-marker
  - id: cwd-sandbox-keyword-check--rx-21
  - id: cwd-sandbox-keyword-check--rx-22
  - id: anubis-analysis-marker
  - id: metadata/lang/source/literal/string::python-cuckoo-string
  - id: joebox-analysis-marker
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-name-literal
  near_bytes: 256
- id: hostname-in-sandbox-list
  desc: Hostname query near analysis-related markers
  crit: baseline
  conf: 1.0
  all:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  any:
  - id: malware-analysis-marker
  - id: cwd-sandbox-keyword-check--rx-21
  - id: cwd-sandbox-keyword-check--rx-22
  - id: anubis-analysis-marker
  - id: metadata/lang/source/literal/string::python-cuckoo-string
  - id: joebox-analysis-marker
  - id: virus-analysis-marker
  near_bytes: 256
- id: cwd-sandbox-keyword-check
  desc: cwd checked for sandbox keyword
  crit: baseline
  conf: 1.0
  all:
  - id: micro-behaviors/fs/directory/cwd/
  any:
  - id: malware-analysis-marker
  - id: cwd-sandbox-keyword-check--rx-21
  - id: cwd-sandbox-keyword-check--rx-22
  - id: metadata/lang/source/literal/string::python-cuckoo-string
  - id: virus-analysis-marker
  near_bytes: 256
- id: vm-artifact-vbox-file-check
  desc: VirtualBox driver file existence check
  crit: baseline
  conf: 1.0
  all:
  - id: vm-artifact-vbox-file-check--rx-30
  - id: vm-artifact-vbox-artifact-token
- id: vm-artifact-vbox-artifact-token
  desc: VirtualBox artifact token
  crit: component
  conf: 1.0
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::python-vbox-service-driver-reference
  - id: vm-artifact-vbox-file-check--rx-34
  - id: vm-artifact-vbox-file-check--rx-35
  - id: vm-artifact-vbox-file-check--rx-36
- id: vm-artifact-vmware-file-check
  desc: VMware driver file existence check
  crit: baseline
  conf: 1.0
  any:
  - id: vm-artifact-vmware-file-check--rx-37
  - id: vm-artifact-vmware-file-check--rx-38
  - id: vm-artifact-vmware-file-check--rx-39
