defaults:
  crit: suspicious
  platforms: [windows]
  for: [powershell, batch, pe, dll, lnk]
  attack: T1497
traits:
  - id: recent-lnk-count-gate
    desc: Recent LNK count gate
    conf: 0.9
    if:
      type: text
      regex: (?is)Microsoft\\Windows\\Recent.{0,160}\.lnk.{0,160}Count\s+-ge\s+\d+
  - id: process-count-gate
    desc: Process count sandbox gate
    conf: 0.88
    if:
      type: text
      regex: (?is)Get-Process.{0,80}Count\s+-ge\s+\d+
  - id: powershell-workingset-sandbox-check
    desc: PowerShell WorkingSet sandbox check
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)Get-Process.{0,50}\bWorkingSet\b'
  - id: powershell-sandbox-memory-inflation
    desc: PowerShell sandbox memory inflation
    conf: 0.96
    for: [powershell]
    attack: "T1497.001"
    if:
      type: text
      regex: '(?i)(\$\w+|\$\{\w+\})\s*=\s*["''][A-Za-z0-9]["'']\s*\*\s*\d{1,4}\s*[MG]B\b'
composite_rules:
  - id: user-activity-process-gate
    desc: User activity process sandbox gate
    conf: 0.93
    all:
      - id: recent-lnk-count-gate
      - id: process-count-gate
  - id: powershell-sandbox-evasion-memory-inflation
    desc: PowerShell WorkingSet memory inflation evasion
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: "T1497.001"
    all:
      - id: powershell-workingset-sandbox-check
      - id: powershell-sandbox-memory-inflation
