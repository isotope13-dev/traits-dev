defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1497.001
  mbc: B0007

traits:
  - id: java-low-cpu-sandbox-check
    desc: Java checks for a low CPU count
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'availableProcessors\(\)\s*<\s*[1-3]\b'

  - id: java-analysis-hostname-check
    desc: Java checks hostname for analysis markers
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'System\.getenv\("HOSTNAME"\)[\s\S]{0,140}\.contains\("(sandbox|vmware)"\)'

  - id: java-check-early-return-gate
    desc: Java check method gates an early return
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'if\s*\(\s*check\(\)\s*\)\s*return\b'

composite_rules:
  - id: java-sandbox-check
    desc: Java checks CPU or hostname sandbox markers
    crit: suspicious
    conf: 0.98
    any:
      - id: java-low-cpu-sandbox-check
      - id: java-analysis-hostname-check

  - id: java-sandbox-gated-host-profile-exfil
    desc: Sandbox gate protects Java host-profile exfiltration
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: java-sandbox-check
      - id: java-check-early-return-gate
      - id: objectives/exfiltration/stealer/host-profile/http::java-host-user-http-exfil
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
