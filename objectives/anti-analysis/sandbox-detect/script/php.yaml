defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1497
  mbc: B0007

traits:
  - id: php-sandbox-host-pattern
    desc: PHP hostname compared against sandbox/VM keyword
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(gethostname\(\)|php_uname)[\s\S]{0,120}(sandbox|vmware|vbox|qemu|virtualbox)'

composite_rules:
  - id: php-sandbox-gated-env-exfil
    desc: Sandbox hostname check gates PHP env credential exfil
    crit: hostile
    conf: 0.97
    attack: T1497.001,T1552.001,T1041
    all:
      - id: php-sandbox-host-pattern
      - id: objectives/credential-access/env/secrets/filtered-access::php-env-credential-harvest
    any:
      - id: micro-behaviors/communications/http/curl::exec
      - id: micro-behaviors/communications/http/curl::php-curl-request
