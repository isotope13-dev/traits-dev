# Installed-app fingerprinting via Desktop .lnk names. Checking a cluster of
# consumer-app shortcuts (rather than the binaries) is used to identify a
# specific analysis image.
defaults:
  platforms: [windows]
  for: [python, c, cpp, pe, dll, scripts]
  attack: T1497.001
  mbc: B0007

traits:
  - id: chrome-desktop-lnk
    desc: Google Chrome.lnk desktop shortcut name
    crit: component
    conf: 0.7
    if:
      type: text
      substr: Google Chrome.lnk

  - id: ccleaner-desktop-lnk
    desc: CCleaner.lnk desktop shortcut name
    crit: component
    conf: 0.75
    if:
      type: text
      substr: CCleaner.lnk

  - id: firefox-desktop-lnk
    desc: Firefox.lnk desktop shortcut name
    crit: component
    conf: 0.7
    if:
      type: text
      substr: Firefox.lnk

  - id: filezilla-desktop-lnk
    desc: FileZilla Client.lnk desktop shortcut name
    crit: component
    conf: 0.85
    if:
      type: text
      substr: FileZilla Client.lnk

  - id: acrobat-reader-dc-desktop-lnk
    desc: Acrobat Reader DC.lnk desktop shortcut name
    crit: component
    conf: 0.8
    if:
      type: text
      substr: Acrobat Reader DC.lnk

  - id: edge-desktop-lnk
    desc: Microsoft Edge.lnk desktop shortcut name
    crit: component
    conf: 0.7
    if:
      type: text
      substr: Microsoft Edge.lnk

  - id: skype-desktop-lnk
    desc: Skype.lnk desktop shortcut name
    crit: component
    conf: 0.7
    if:
      type: text
      substr: Skype.lnk

composite_rules:
  - id: desktop-shortcut-app-fingerprint
    desc: Desktop shortcut cluster used as installed-app probe
    crit: suspicious
    conf: 0.94
    needs: 4
    any:
      - id: chrome-desktop-lnk
      - id: ccleaner-desktop-lnk
      - id: firefox-desktop-lnk
      - id: filezilla-desktop-lnk
      - id: acrobat-reader-dc-desktop-lnk
      - id: edge-desktop-lnk
      - id: skype-desktop-lnk
