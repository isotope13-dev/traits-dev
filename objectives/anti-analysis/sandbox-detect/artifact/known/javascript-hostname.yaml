defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-sandbox-hostname-return
    desc: Returns early on sandbox hostname
    crit: suspicious
    conf: 0.97
    attack: T1497.001
    if:
      type: tree-sitter
      query: |
        (if_statement
          condition: (parenthesized_expression) @condition
          consequence: (return_statement) @gate
          (#match? @condition "hostname")
          (#match? @condition "includes")
          (#match? @condition "[\"']sandbox[\"']"))
