# A BIOS manufacturer read that decides whether a decoded archive launches.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1497
  mbc: B0007

composite_rules:
  - id: python-bios-gated-decoded-launch
    desc: BIOS gate skips a decoded launch
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/sysinfo/hardware::python-bios-manufacturer-query
      - id: objectives/execution/payload/file-exec::zone-cleared-decoded-zip-forfiles
