defaults:
  platforms: [windows, linux, unix, android, macos, ios]
  for: [binaries]

composite_rules:
  - id: go-sandbox-mutation-thread-profile
    for: [pe]
    desc: Go sandbox and self-mutation function names
    crit: suspicious
    all:
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::go-mutateself-func
      - id: objectives/anti-analysis/sandbox-detect/environment/function::go-issandbox-func
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
