defaults:
  platforms: [unix, windows]
  for: [pe, dll]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: unsigned-wininet-vm-clues
    crit: suspicious
    desc: Unsigned WinINet and virtualization clues
    conf: 0.95
    attack: T1105,T1497,T1622
    platforms:
      - windows
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/os/virtualization/hypervisor::multiple-hypervisor-indicators
    any:
      - id: micro-behaviors/process/debug/tool-markers::analyst-tool-name-cluster
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
    needs: 1
    unless:
      - id: metadata/installer/product/
