defaults:
  platforms: [linux]
  for: [elf]
  attack: T1497

composite_rules:
  # The primitive set alone is common in agents. The encrypted runtime string
  # table plus a concrete SOCKS5 client makes the host/environment query surface
  # implant profiling or gating, not ordinary configuration handling. Static
  # imports do not expose which particular variables or hostname tokens are
  # consulted, so the description deliberately stops short of naming them.
  - id: encrypted-host-environment-check-implant
    desc: Encrypted SOCKS implant checks host and environment state
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::compact-opaque-sigma-rodata-profile
      - id: micro-behaviors/os/sysinfo/hostname/query::gethostname
      - id: micro-behaviors/os/env/read/variable::native-getenv
      - id: micro-behaviors/fs/read/file/handle::fgets-api-import
      - id: micro-behaviors/fs/file/open/unspecified::fopen
      - id: micro-behaviors/communications/proxy/socks/wire::native-socks5-domain-connect-client
