# RC4, Rundll32 and anti-analysis evidence in the same source.
# These combinations do not identify the data passed to Rundll32.
defaults:
  crit: suspicious
  conf: 0.98
  platforms: [windows]
  for: [python, csharp]

composite_rules:
  - id: dotnet-rc4-rundll32-vm-reference
    desc: .NET RC4 and Rundll32 with VM references
    for: [csharp]
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::source-rc4-managed-implementation
      - id: well-known/app/system/microsoft/rundll32::rundll32-start
      - id: well-known/app/system/microsoft/rundll32::rundll32-export-argument
      - id: micro-behaviors/os/virtualization/hypervisor::dotnet-vm-reference-suite
