# Node payloads that skip execution when the host looks like a CI runner, a
# malware-analysis sandbox or a traffic-intercepting proxy (wppconnect 2.10.82
# diagnostics stealer: isTestEnvironment() returns before the upload).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497.001
  mbc: B0007

traits:
  - id: node-mitm-proxy-env-probe
    desc: Proxy variable checked for mitm marker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)proxy[\s\S]{0,100}(indexOf|includes)\s*\(\s*["'']mitm["'']'
  - id: node-sandbox-hostname-prefix-probe
    desc: Hostname tested against sandbox prefix
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '/[^/\n]{0,40}\^sandbox[^/\n]{0,60}/i\.test\(\s*[\w.]+(\(\))?\s*\)'

composite_rules:
  - id: node-analysis-environment-skip-gate
    desc: Skips run on CI, sandbox or mitm proxy
    crit: suspicious
    conf: 0.93
    scope: file
    near_lines: 25
    all:
      - id: micro-behaviors/os/env/cicd/runner::github-actions-flag
    any:
      - id: node-mitm-proxy-env-probe
      - id: node-sandbox-hostname-prefix-probe
    unless:
      - id: metadata/path/directory::test-directory-component
