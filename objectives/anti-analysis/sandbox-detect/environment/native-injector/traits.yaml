# Native loaders that combine an injection implementation with independent
# checks for sandbox instrumentation, hypervisor guest agents, and hardware
# identity are gating execution on the analysis environment.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001,T1055
  mbc: B0009

composite_rules:
  - id: analysis-aware-native-injector
    desc: Native injector checks sandbox and VM artifacts
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/process/injection/memory::remote-thread-injection-api-chain
      - id: objectives/anti-analysis/sandbox-detect/tool-references::sandbox-instrumentation-module-name
      - id: objectives/anti-analysis/vm-detect/process::vm-guest-agent-process-blacklist
    any:
      - id: micro-behaviors/os/sysinfo/hardware::get-system-firmware-table-string
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
