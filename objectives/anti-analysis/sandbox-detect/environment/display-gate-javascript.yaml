# Electron low-resolution execution gate. Sandboxes and automated analysis
# VMs often report tiny virtual displays; quitting silently below a minimum
# size keeps the payload off those boxes. Ordinary kiosk and signage apps
# perform the same check but tell the user, so a shown dialog excludes the
# benign shape; the remaining silent-quit gate is evasion evidence.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1497.001
  mbc: B0009

composite_rules:
  - id: electron-low-resolution-quit-gate
    desc: Quits when the primary display is below a minimum size
    crit: suspicious
    conf: 0.93
    near_bytes: 2048
    all:
      - id: micro-behaviors/hardware/display/state::display-minimum-size-gate
      - id: micro-behaviors/process/exit/terminate::electron-app-quit-call
    unless:
      - id: micro-behaviors/ui/dialog/error::electron-dialog-box-call
