defaults:
  platforms:
    - unix
    - windows
  for: [binaries]
  crit: suspicious
  conf: 0.95
traits:
  - id: sandbox-cuckoo-path
    desc: Cuckoo Sandbox execution path
    if:
      type: text
      regex: cuckoo-[a-fA-F0-9]{64}
      case_insensitive: true
  # Malware compares the profile directory of the account it is running under
  # against the default usernames the public sandboxes ship with. Two of these
  # names are also ordinary ones: `Bruno` is somebody's real account, and
  # `C:\Users\azure` is the home directory of the Microsoft-hosted Azure
  # Pipelines agent, so every binary whose build leaked an absolute source path
  # matched this rule and was reported as checking for a sandbox.
  #
  # The profile names are useful only as supporting evidence: real developers
  # and hosted builders also use them, so a path alone cannot establish a
  # runtime sandbox check. Objective composites supply the missing context.
  - id: process-investigator-tools-path
    desc: ProcessInvestigator tools-directory path
    for: [python, c, cpp, pe, dll, scripts]
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)[A-H]:\\TOOLS\\ProcessInvestigator\\'
  - id: sandbox-analysis-prefix-wide
    desc: UTF16 sandbox analysis path prefix
    for:
      - pe
    size_max: 52428800
    if:
      type: hex
      section: .text
      pattern: 63 00 3A 00 5C 00 61 00 6E 00 61 00 6C 00 79 00 73 00 65 00 5C 00
  # A packed loader that carries a list of file paths named after the hash
  # of a submitted sample (C:\<sha256>, where public sandboxes drop samples)
  # to compare against its own path and exit. Real programs do not embed a
  # run of such paths; one or two are build leaks, so the count is the signal.
  - id: sandbox-root-hash-path-list
    desc: Embedded list of root-drive hash-named paths
    for: [pe]
    count_min: 8
    size_max: 5242880
    if:
      type: text
      regex: '(?i)^C:\\[0-9a-f]{32,64}$'
