defaults:
  platforms:
    - unix
    - windows
  for: [binaries]
  crit: suspicious
  conf: 0.95
traits:
  - id: sandbox-cuckoo-path
    desc: Cuckoo Sandbox execution path
    if:
      type: text
      regex: cuckoo-[a-fA-F0-9]{64}
      case_insensitive: true
  # Malware compares the profile directory of the account it is running under
  # against the default usernames the public sandboxes ship with. Two of these
  # names are also ordinary ones: `Bruno` is somebody's real account, and
  # `C:\Users\azure` is the home directory of the Microsoft-hosted Azure
  # Pipelines agent, so every binary whose build leaked an absolute source path
  # matched this rule and was reported as checking for a sandbox.
  #
  # The discriminator is what follows the name. A sandbox check has the profile
  # root and at most a well-known subfolder; a leaked build path keeps going and
  # ends at the artifact it produced, which is why the tail is captured and
  # filenames are excluded rather than the names being dropped.
  - id: sandbox-user-profile
    desc: Sandbox user profile path
    if:
      type: text
      regex: C:\\Users\\(Bruno|Joe Cage|John Doe|azure)[^\r\n"]{0,100}
      case_insensitive: true
    not:
      - regex: '(?i)\.(exe|dll|sys|pdb|obj|lib|cpp|cs|rs|go)$'
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
  - id: process-investigator-tools-path
    desc: ProcessInvestigator tools-directory path
    for: [python, c, cpp, pe, dll, scripts]
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)[A-H]:\\TOOLS\\ProcessInvestigator\\'
  - id: sandbox-analysis-prefix-wide
    desc: UTF16 sandbox analysis path prefix
    for:
      - pe
    size_max: 52428800
    if:
      type: hex
      section: .text
      pattern: 63 00 3A 00 5C 00 61 00 6E 00 61 00 6C 00 79 00 73 00 65 00 5C 00
