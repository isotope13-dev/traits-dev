defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: sandbox-hash-path-list-with-pe-header-probe
    desc: Sandbox hash-path list with PE header probe
    crit: hostile
    conf: 0.9
    attack: T1497,T1055.012
    # The path leg is the neutral relocated corpus atom
    # micro-behaviors/fs/path/padding::many-hash-named-root-paths: the
    # strings alone claim no sandbox check, so this composite's intent rests
    # on pairing the corpus with the header probe.
    all:
      - id: micro-behaviors/fs/path/padding::many-hash-named-root-paths
      - id: micro-behaviors/data/format/pe-parser::upx0-pe-header-validation
  - id: sandbox-hash-path-obfuscated-file-deletion
    desc: Sandbox evasion with concealed file enumeration and deletion
    crit: hostile
    conf: 0.95
    attack: T1497.001
    all:
      - id: sandbox-root-hash-path-list
      - id: objectives/anti-static/obfuscation/imports/concealment::fragment-loader-export-backscan
      - id: micro-behaviors/fs/directory/readdir::find-file-walker
      - id: micro-behaviors/fs/delete/file/library::delete-win
