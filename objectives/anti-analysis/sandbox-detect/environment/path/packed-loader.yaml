defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # sandbox-hash-path-list-with-pe-header-probe was removed: it paired the
  # neutral hash-path corpus with micro-behaviors/data/format/pe-parser::
  # upx0-pe-header-validation. That probe is the CRT MZ/PE image check (cmp
  # word, 0x5A4D / cmp dword, 0x4550), and the corpus can sit in an unmapped
  # overlay no running code reads. The pair is not a sandbox check. The corpus
  # and probe legs remain notable in their own homes.
  # sandbox-hash-path-obfuscated-file-deletion below still requires real
  # enumeration and deletion machinery.
  - id: sandbox-hash-path-obfuscated-file-deletion
    desc: Sandbox evasion with concealed file enumeration and deletion
    crit: hostile
    conf: 0.95
    attack: T1497.001
    all:
      - id: micro-behaviors/fs/path/padding::many-hash-named-root-paths
      - id: objectives/anti-static/obfuscation/imports/concealment::fragment-loader-export-backscan
      - id: micro-behaviors/fs/directory/readdir::find-file-walker
      - id: micro-behaviors/fs/delete/file/library::delete-win
