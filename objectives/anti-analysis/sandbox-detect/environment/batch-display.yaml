defaults:
  platforms: [windows]
  for: [batch]
  attack: T1497.001
composite_rules:
  - id: batch-refresh-rate-shutdown-check
    desc: Low-value shutdown condition accompanies display refresh-rate check
    crit: suspicious
    conf: 0.95
    near_lines: 1
    all:
      - id: micro-behaviors/hardware/display/state::current-refresh-rate-property
      - id: micro-behaviors/os/event/shutdown::batch-low-value-shutdown
