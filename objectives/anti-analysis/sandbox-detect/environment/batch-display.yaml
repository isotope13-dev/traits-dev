defaults:
  platforms: [windows]
  for: [batch]
  attack: T1497.001
composite_rules:
  - id: batch-refresh-rate-shutdown-check
    desc: Low-value shutdown condition accompanies display refresh-rate check
    crit: suspicious
    conf: 0.95
    near_lines: 1
    all:
      - id: micro-behaviors/hardware/display/state::current-refresh-rate-property
      - id: micro-behaviors/os/event/shutdown::batch-low-value-shutdown

  # A display query or an installer Run key is ordinary in isolation. A
  # shutdown gate together with concealed autostart and staged-library paths
  # in a copying script indicates an evasive stager. The companion DLLs are
  # unavailable here: this does not establish DLL hijacking or family identity.
  - id: batch-refresh-rate-gated-stager
    desc: Display shutdown gate with concealed autorun and DLL staging
    crit: hostile
    conf: 0.95
    attack: T1497.001,T1027,T1547.001
    all:
      - id: batch-refresh-rate-shutdown-check
      - id: objectives/persistence/login/registry/run-key::batch-fragmented-autostart-command
      - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
      - id: micro-behaviors/fs/path/library::batch-staged-dll-path-reference
