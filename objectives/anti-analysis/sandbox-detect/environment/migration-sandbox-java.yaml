defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  attack: T1497.001
  mbc: B0007
composite_rules:
- id: java-low-cpu-sandbox-gate
  desc: Low processor count gates Java execution
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/os/sysinfo/cpu::java-low-processor-count-comparison
  - id: micro-behaviors/data/control-flow/return::java-check-early-return-gate
- id: java-sandbox-check
  desc: Java checks CPU or hostname sandbox markers
  crit: suspicious
  conf: 0.98
  any:
  - id: objectives/anti-analysis/sandbox-detect/environment::java-low-cpu-sandbox-gate
  - id: objectives/anti-analysis/sandbox-detect/hostname::java-analysis-hostname-check
