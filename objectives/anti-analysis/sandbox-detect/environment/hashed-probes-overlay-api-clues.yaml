defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: hashed-probes-overlay-temp-process-delete-clues
    desc: Hashed probes, overlay I/O and process API clues
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/anti-analysis/sandbox-detect/environment::djb2-hashed-sandbox-probes
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
