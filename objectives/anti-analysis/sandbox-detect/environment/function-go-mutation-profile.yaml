defaults:
  platforms: [windows, unix, android, ios]
  for: [binaries]

composite_rules:
  - id: go-sandbox-mutation-thread-profile
    for: [pe]
    desc: Go sandbox and self-mutation function names
    crit: suspicious
    all:
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::go-mutateself-func
      - id: objectives/anti-analysis/sandbox-detect/environment::go-issandbox-func
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name

  - id: go-sandbox-mutation-remote-thread-loader
    for: [pe]
    platforms: [windows]
    desc: Go loader pairs sandbox-evasion Update.exe threads with PE injection
    crit: hostile
    conf: 0.97
    attack: T1497,T1055
    all:
      - id: go-issandbox-func
      - id: micro-behaviors/process/thread/lifecycle::go-update-process-thread-apis
      - id: objectives/execution/payload/process-inject/remote-thread::unsigned-embedded-pe-remote-thread-injector
