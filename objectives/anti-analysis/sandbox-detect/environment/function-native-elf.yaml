defaults:
  platforms: [linux]
  for: [elf]
  attack: T1497.001
  mbc: B0007

traits:
  # Compact Linux bots emit this sentence after an environment check fails.
  # It identifies anti-honeypot behavior, but does not identify the actor or
  # malware family that happens to use the wording.
  - id: declares-host-honeypot
    desc: Declares current host a honeypot
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'Looks like you are a honeypot'
      section: rodata
