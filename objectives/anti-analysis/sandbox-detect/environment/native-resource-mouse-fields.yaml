defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: native-resource-threshold-fields
    desc: CPU and uptime gate field names
    crit: notable
    if:
      type: text
      section: .rodata
      regex: 'cpuMin.{0,32}uptimeMinSec'

  - id: native-mouse-threshold-fields
    desc: Mouse timing and movement gate fields
    crit: notable
    if:
      type: text
      section: .rodata
      regex: 'mouseMs.{0,8}mousePx'

  - id: macho-resource-threshold-fields
    desc: CPU and uptime gate fields in Mach-O
    crit: notable
    platforms: [macos]
    for: [macho]
    if:
      type: text
      section: __TEXT,__const
      regex: 'cpuMin.{0,32}uptimeMinSec'

  - id: macho-mouse-threshold-fields
    desc: Mouse timing gate fields in Mach-O
    crit: notable
    platforms: [macos]
    for: [macho]
    if:
      type: text
      section: __TEXT,__const
      regex: 'mouseMs.{0,8}mousePx'

composite_rules:
  # Inventory agents may carry DMI and input paths. The resource minimums
  # and mouse timing/movement fields distinguish configurable sandbox gates.
  # These are references: a blank or disabled profile need not run the probes.
  - id: native-resource-mouse-sandbox-profile
    desc: Resource and mouse gate fields with DMI and input paths
    crit: suspicious
    conf: 0.95
    attack: T1497.001,T1497.002
    near_bytes: 4096
    all:
      - id: native-resource-threshold-fields
      - id: native-mouse-threshold-fields
      - id: micro-behaviors/os/sysinfo/hardware::dmi-product-name-path
      - id: micro-behaviors/hardware/input/device::linux-input-device-path

  - id: macos-resource-mouse-sandbox-profile
    desc: Resource and mouse gate fields with AppleScript pointer read
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [macho]
    attack: T1497.001,T1497.002
    near_bytes: 4096
    all:
      - id: macho-resource-threshold-fields
      - id: macho-mouse-threshold-fields
      - id: micro-behaviors/hardware/input/mouse::applescript-mouse-position-read
