# Exploit-kit target validation thresholds kept as configuration: hardware
# concurrency and screen minimums, timer resolution, VM renderer keywords and
# automation-artifact limits that decide whether a visiting browser is a real
# victim or an analysis sandbox before a payload is served.
defaults:
  platforms: [linux, macos, windows]
  for: [yaml, json]
  size_max: 262144
  attack: T1497.001

traits:
  - id: vm-renderer-keyword-list
    desc: Config lists VM WebGL renderer keywords
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*["'']?vm_renderer_keywords["'']?\s*:'

  - id: min-hardware-concurrency-threshold
    desc: Config sets a minimum CPU core threshold
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s*["'']?min_hardware_concurrency["'']?\s*:\s*\d'

  - id: automation-artifact-limit
    desc: Config limits browser automation artifacts
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s*["'']?max_automation_artifacts["'']?\s*:\s*\d'

composite_rules:
  - id: browser-sandbox-gate-thresholds
    desc: Config gates targets on VM and automation checks
    crit: suspicious
    conf: 0.88
    all:
      - id: vm-renderer-keyword-list
    any:
      - id: min-hardware-concurrency-threshold
      - id: automation-artifact-limit
