# ConfuserEx and similar managed obfuscators encrypt target DLL names such as
# SbieDll.dll or snxhk.dll, leaving the hardware, drive-capacity, and loaded
# module enumeration imports visible in CLR metadata.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001

composite_rules:
  - id: managed-hardware-and-module-probe
    desc: Managed assembly queries CPU count, disk size, and process modules
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/sysinfo/processor::dotnet-processor-count-import
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-total-size-import
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-modules-import
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-module-name-import
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-discovery

  - id: managed-xor-dropper-environment-module-gate
    desc: Obfuscated XOR resource dropper probes hardware and loaded modules
    crit: hostile
    conf: 0.96
    all:
      - id: managed-hardware-and-module-probe
      - id: objectives/anti-static/obfuscation/encoding/buffer::zero-width-managed-resource-xor-writer
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
