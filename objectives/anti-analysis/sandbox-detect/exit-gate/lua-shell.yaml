defaults:
  platforms: [unix, openwrt]
  for: [lua]
  attack: T1497

composite_rules:
  - id: lua-analysis-tool-shell-termination
    desc: Lua analysis-tool references with forced shell termination
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/proc/info/path::lua-process-info-path
      - id: micro-behaviors/process/terminate/command::kill-force
    any:
      - id: micro-behaviors/process/debug/tool-markers::lua-strace-name-reference
      - id: micro-behaviors/process/debug/tool-markers::lua-ltrace-name-reference
      - id: micro-behaviors/process/debug/tool-markers::gdb-name-reference
      - id: micro-behaviors/communications/capture::lua-tcpdump-name-reference
      - id: micro-behaviors/os/application/target/security::wireshark-name-reference
      - id: objectives/anti-analysis/process-tree::lua-suspicious-process-termination-log
    needs: 2
