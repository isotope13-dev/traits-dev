# RC4, Rundll32 and anti-analysis evidence in the same source.
# These combinations do not identify the data passed to Rundll32.
defaults:
  crit: suspicious
  conf: 0.98
  platforms: [windows]
  for: [python, csharp]

composite_rules:
  - id: python-rc4-rundll32-anti-analysis
    desc: Python RC4 and Rundll32 with anti-analysis exit
    for: [python]
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::python-rc4-like-stream-cipher
      - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
      - id: objectives/anti-analysis/sandbox-detect/script::python-anti-analysis-fingerprint-exit

