defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1497.001

traits:
- id: stable-machine-id-container-marker
  desc: Stable machine-id container guard
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "no stable id available"
- id: node-vm-vendor-strings--kvm
  desc: Node VM vendor string set (KVM)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: KVM
  unless:
  - id: well-known/lib/network/novnc::source-context
  - id: metadata/document/html/
  # Hypervisor names are ordinary prose in Unix manual pages (bhyve_config(5)
  # documents its QEMU-compatible knobs); documentation is not a DMI probe.
  - id: metadata/package/documentation::unix-manpage
- id: node-vm-vendor-strings--vmware
  desc: Node VM vendor string set (VMware)
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bVMware($|[^ ]| [^v])'
  unless:
  - id: well-known/lib/network/novnc::source-context
  - id: metadata/document/html/
  # Hypervisor names are ordinary prose in Unix manual pages (bhyve_config(5)
  # documents its QEMU-compatible knobs); documentation is not a DMI probe.
  - id: metadata/package/documentation::unix-manpage
  - id: well-known/app/infrastructure/rancher-dashboard/
  # An SVG icon pack carries a logo for every vendor it draws, so the name
  # arrives as an icon key ("AWS-Backup-Support-for-VMware") rather than as a
  # value the code compares a DMI field against.
  - id: metadata/library/iconify::svg-icon-body-map
composite_rules:
- id: node-vm-benign-application-context
  desc: Recognized benign Node application context
  crit: exception
  conf: 0.99
  any:
  - id: well-known/lib/core/systeminformation/
  - id: well-known/app/development/vscode-extension/tencent-codebuddy::tencent-codebuddy
  - id: well-known/app/development/vscode-extension/dbcode::extension-context
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
  - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
- id: node-vm-vendor-strings
  desc: Node VM vendor string set
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::qemu-vendor-word
  - id: node-vm-vendor-strings--kvm
  - id: node-vm-vendor-strings--vmware
  - id: objectives/anti-analysis/vm-detect/vendor::vendor-virtualbox
  needs: 2
  unless:
  - id: well-known/lib/network/novnc::source-context
  - id: metadata/document/html/
  # Hypervisor names are ordinary prose in Unix manual pages (bhyve_config(5)
  # documents its QEMU-compatible knobs); documentation is not a DMI probe.
  - id: metadata/package/documentation::unix-manpage
- id: node-vm-sandbox-detect
  desc: Node VM and sandbox detection
  crit: suspicious
  conf: 0.96
  unless:
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/library/generated::sphinx-searchindex-js
  - id: metadata/library/data::aws-sdk-js-v3-bundle
  - id: metadata/library/google-runtime::gcp-metadata-js-bundle
  - id: metadata/package/files/dependency::node-modules-path
  - id: node-vm-benign-application-context
  - id: well-known/lib/network/novnc::source-context
  - id: metadata/document/html/
  - id: well-known/app/infrastructure/rancher-dashboard/
  any:
  - id: node-vm-vendor-strings
  - id: micro-behaviors/os/virtualization/detect::vm-mac-prefix-check
  - id: micro-behaviors/fs/proc/container::multi-marker-runtime-detection
  - id: objectives/discovery/system/fingerprint/hardware::dmi-fields
  needs: 2
