defaults:
  crit: notable
  platforms: [routeros, appliance, unix]
  for: [c, cpp, elf]
composite_rules:
  - id: dmi-vm-fingerprint
    desc: DMI path and hypervisor references
    conf: 0.9
    # These references also appear in hardware inventory tools; the
    # co-occurrence does not establish a sandbox-evasion decision.
    needs: 1
    all:
      - id: micro-behaviors/os/sysinfo/hardware::dmi-product-name-path
      - id: micro-behaviors/os/sysinfo/hardware::dmi-board-vendor-path
    any:
      - id: objectives/anti-analysis/vm-detect/vendor
      - id: micro-behaviors/os/virtualization/hypervisor::hyperv-vendor-reference
      - id: micro-behaviors/network/interface::virtualization-oui-reference
