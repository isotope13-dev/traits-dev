defaults:
  platforms: [openwrt]
  for: [python]
  attack: T1497.001

composite_rules:
- id: openwrt-python-vm-sandbox-detect
  desc: OpenWrt Python VM and sandbox detection
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/path/config/system::openwrt-platform-marker
  any:
  - id: micro-behaviors/os/sysinfo/dmi::dmi-fields
  - id: micro-behaviors/fs/proc/container::multi-marker-runtime-detection
  - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
  - id: objectives/anti-analysis/sandbox-detect/script::python-vm-vendor-string-set
  - id: micro-behaviors/process/debug/tool-markers::python-analysis-tool-name-set
  needs: 3
