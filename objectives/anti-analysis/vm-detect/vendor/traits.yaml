defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries]
  attack: T1497.001
traits:
- id: vendor-kvm-upper
  desc: KVM hypervisor (uppercase)
  crit: notable
  conf: 0.6
  if:
    type: text
    exact: KVM
- id: analysis-user-george
  desc: Analysis username 'george'
  crit: suspicious
  conf: 0.9
  for: [shell, python, javascript, powershell, pe, elf]
  if:
    type: text
    regex: (?i)(users|home)[\\/][^\n]{0,20}[\\/]george([\\/]|$)
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: micro-behaviors/communications/http/upload/
- id: analysis-user-bruno
  desc: Analysis username 'Bruno'
  crit: suspicious
  conf: 0.9
  for: [python, javascript, powershell]
  if:
    type: text
    regex: (?i)(users|home)[\\/][^\n]{0,20}[\\/]bruno([\\/]|$)
  unless:
  - type: raw
    regex: defmodule\s+Faker\.Person\.|sampler\(:(first_name|last_name)
  # Bruno the API client stores collections in ~/bruno, so its own
  # src/utils/filesystem.js builds exactly the path this looks for -- the
  # directory is the product's, not a sandbox operator's. NOTE: this only
  # reaches the extracted-on-disk case. `app-bundle` is built from `type: path`
  # markers, and a path matcher sees the archive-member-relative path
  # (`src/utils/filesystem.js`), never the enclosing `Bruno.app/...`, so it does
  # not fire for a member scanned inside the .dmg/.asar. Giving Bruno a content
  # marker would be needed to cover that.
  - id: well-known/app/storage/bruno::app-bundle
  - id: well-known/app/storage/bruno::bruno-enterprise-registry
  - id: well-known/app/storage/bruno::bruno-collection-manifest
  downgrade:
    any:
    - id: metadata/package/testing/presence/scripted::faker-word
    - id: metadata/package/testing/harness/runtime::test-basename-suffix
- id: analysis-user-abby
  desc: Analysis username 'Abby'
  crit: suspicious
  conf: 0.9
  for: [python, javascript, powershell]
  if:
    type: text
    regex: (?i)(users|home)[\\/][^\n]{0,20}[\\/]abby([\\/]|$)
  unless:
  - type: raw
    regex: defmodule\s+Faker\.Person\.|sampler\(:(first_name|last_name)
  downgrade:
    any:
    - id: metadata/package/testing/presence/scripted::faker-word
    - id: metadata/package/testing/harness/runtime::test-basename-suffix
- id: analysis-user-amf
  desc: Analysis username 'AMF'
  crit: suspicious
  conf: 0.9
  for: [python, javascript, powershell, pe, elf]
  if:
    type: text
    regex: (?i)(users|home)[\\/][^\n]{0,20}[\\/]amf([\\/]|$)
  unless:
  # "AMF" = Adobe Action Message Format (FLV/RTMP media metadata). Flash-video
  # and 3D-model parsers (Three.js AMFLoader) use "AMF" as a format marker,
  # not a sandbox username.
  - type: text
    substr: AMFLoader
  - type: text
    substr: .amf
  - type: text
    substr: Action Message Format
  - type: text
    substr: AMF document
  - type: text
    substr: AMF Material
# IsVT is an analysis-environment probe name. IsVTX* is Intel VT-x
# (docker-machine's IsVTXDisabled checks whether hardware virtualization
# is switched off). IsVTK* is the Visualization Toolkit. Neither is a probe.
- id: is-vt-symbol
  desc: Symbol name contains IsVT
  crit: suspicious
  conf: 0.8
  for: [elf, macho, pe]
  if:
    type: symbol
    substr: IsVT
  not:
    - substr: IsVTK
    - substr: IsVTX
- id: vendor-parallels
  desc: Parallels vendor string in VM probe
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '(?is)\b(dmi|cpuid|wmic)\b.{0,240}\bParallels\b'
  downgrade:
    any:
    - type: text
      substr: docker-machine
    - type: text
      substr: libmachine
    - type: text
      substr: minikube
    - type: text
      substr: vagrant
  unless:
  - id: metadata/vendor/identity/
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: vendor-parallels-macos-probe
  desc: Parallels vendor string in macOS VM probe
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '(?is)\b(ioreg|system_profiler|sysctl)\b.{0,240}\bParallels\b'
  unless:
  - id: metadata/vendor/identity/
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: vendor-bhyve
  desc: bhyve hypervisor vendor string
  crit: component
  conf: 0.7
  for: [pe, elf, macho, shell, python, javascript]
  if:
    type: text
    substr: bhyve
  unless:
  - type: text
    exact: 'bhyve bhyve '
  - type: text
    substr: KVMKVMKVMKVMMicrosoft HvVMwareVMwareXenVMMXenVMMbhyve bhyve
  - type: raw
    regex: AuthenticAMD.*GenuineIntel.*KVMKVMKVMKVM.*Microsoft Hv.*VMware.*XenVMM.*bhyve
  - type: raw
    regex: '(?i)\b(vmware|kvm|xen|vbox)\b'
- id: hardware-model-cmd
  desc: Checks hardware model command output
  crit: notable
  conf: 0.8
  for: [shell, powershell, python, javascript]
  if:
    type: text
    regex: system_profiler.{0,30}Model|wmic.{0,30}computersystem.{0,30}model
  unless:
  - id: well-known/tool/sysadmin/
  - id: well-known/app/ai/coding-agent/

# lshw (Hardware Lister) and its GTK frontend ship a built-in OUI/MAC-prefix
# vendor table to label network interfaces by manufacturer. That table includes
# the VMware/Parallels/VirtualBox prefixes as plain standalone strings, with no
# VM-detection logic. The "Hardware Lister (lshw)" banner (CLI) and the
# "GTK+ frontend for lshw" banner (gtk-lshw frontend) are distinctive markers
# carried only by lshw, never by VM-evasion malware, so they cleanly distinguish
# a benign hardware-vendor lookup table from a malicious MAC-prefix VM check.
- id: lshw-hardware-lister-oui-table
  desc: lshw vendor OUI table
  crit: baseline
  conf: 0.95
  for: [binaries]
  if:
    type: text
    regex: Hardware Lister \(lshw\)|GTK\+ frontend for lshw

# Config management answers "what am I running on?" for every managed host, so
# its fact modules carry the whole vendor-string table by design. Ansible keeps
# them under module_utils/facts/virtual/ (linux.py, sunos.py and the rest),
# Salt in its grains core. Both are the reporting context below, not a probe.
- id: ansible-virtual-facts-module-path
  desc: Ansible virtualization facts module path
  crit: notable
  conf: 0.97
  for: [python, python_bytecode]
  if:
    type: path
    regex: 'facts/virtual/'
- id: salt-grains-module-path
  desc: Salt grains module path
  crit: notable
  conf: 0.97
  for: [python, python_bytecode]
  if:
    type: path
    regex: 'salt/grains/'

composite_rules:

- id: vmware-recognized-vendor-marker
  desc: Recognized VMware vendor markers
  crit: baseline
  conf: 0.9
  any:
  - id: metadata/signed/unknown::intel-corporation
  - id: metadata/signed/unknown::broadcom-inc
  - id: metadata/file/naming::p-user-proxy-dll
  - id: metadata/package/compat::virtualbox-platform-component
  - id: metadata/file/catalog/identity::tokenizer-vocab-json
  - id: metadata/file/catalog/identity::frequency-list-catalog

# Not the bare DMI sysfs read (micro-behaviors/os/sysinfo/dmi): GDAL reads
# /sys/devices/virtual/dmi/id/sys_vendor to auto-detect EC2 for its S3
# credentials. A VM check compares the value; cpuid-check and the lshw/dmidecode
# commands in hardware-model-cmd are that comparison's evidence.
- id: hardware-model
  desc: Checks hardware model for VM
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-text-references
  - id: hardware-model-cmd
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: vendor-xen
  desc: Xen hypervisor vendor string
  crit: notable
  conf: 0.7
  any:
  - id: well-known/app/infrastructure/xen::xenstore-marker
  - id: well-known/app/infrastructure/xen::xen-hypervisor-marker
  unless:
  - id: well-known/app/infrastructure/xen::xen-hypervisor-context
- id: vendor-kvm
  desc: KVM hypervisor vendor string
  crit: notable
  conf: 0.7
  any:
  - id: vendor-kvm-upper
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-kvm-repeat
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: vendor-vbox
  desc: VirtualBox hypervisor vendor string
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-reference
  - id: micro-behaviors/os/virtualization/hypervisor::vbox-short-reference
  unless:
  # A distro packaging recipe that names VirtualBox is packaging content,
  # not an environment probe.
  - id: well-known/app/infrastructure/virtualbox::gentoo-recipe-virtualbox-context
- id: vm-profiling-exfil
  for: [javascript]
  desc: VM detection with system profiling and exfiltration
  crit: suspicious
  conf: 0.95
  mbc: B0003
  # The vendor strings, the profile queries, and the exfil channel must
  # belong to one routine. Without proximity, a hardware-aware server pools
  # a GPU-allowlist mention, model-catalog downloads, and backend-selection
  # sysinfo queries spread across the file into an exfil verdict.
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  - id: micro-behaviors/os/sysinfo/profile::node-host-query-set
  any:
  - id: hypervisor-vendor
  - id: micro-behaviors/os/virtualization/hypervisor::hyperv-vendor-reference
  unless:
  - id: well-known/lib/platform/systeminformation/
  - id: metadata/package/compat::virtualbox-platform-component
# The CPUID vendor-ID form for VMware, like its siblings: the bare word
# "VMware" also names ffmpeg's "VMware Screen Codec" in every OpenCV build.
- id: hypervisor-vendor
  desc: Hypervisor vendor ID string
  crit: component
  conf: 0.85
  any:
  - id: vendor-xen
  - id: vendor-kvm
  - id: objectives/anti-analysis/vm-detect/vendor::cpuid-vendor-vmware
  - id: vendor-vbox
  - id: micro-behaviors/os/virtualization/hypervisor::qemu-name-reference
  - id: vendor-parallels
  - id: vendor-parallels-macos-probe
  - id: vendor-bhyve
  unless:
  - id: metadata/package/compat::virtualbox-platform-component
- id: c2-beacon-marker
  desc: C2 beacon or polling implant
  crit: component
  conf: 0.9
  any:
  - id: objectives/command-and-control/beacon/network/periodic::c2-polling-beacon
  - id: objectives/command-and-control/channel/http-beacon::c2-http-beacon-pattern

- id: vm-aware-beacon
  desc: VM/sandbox detection combined with C2 beaconing
  crit: hostile
  conf: 0.93
  mbc: B0003
  all:
  - id: c2-beacon-marker
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::multiple-hypervisor-indicators
  - id: hardware-model
  - id: micro-behaviors/os/virtualization/hypervisor::guest-artifact-references
  - id: objectives/anti-analysis/vm-detect/registry::bios-vm-check-and-exit
