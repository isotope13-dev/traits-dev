# Packed, importless x64 PE probing multiple CPUID hypervisor vendor leaves
# while resolving APIs dynamically via the PEB loader table.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001,T1027.002
  mbc: B0009

composite_rules:
  - id: packed-importless-hypervisor-probe
    desc: Unsigned importless packed PE probes hypervisor CPUID vendors
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: objectives/anti-static/pack/detect::pe-packed-wx-nonstandard
      - id: micro-behaviors/os/api-resolution/digest-export/walk::peb-ldr-export-walk-x64
      - id: vendor-kvm
      - id: micro-behaviors/os/virtualization/hypervisor::vendor-microsoft-hv
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
