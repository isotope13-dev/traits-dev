defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: vm-cpuid-check-with-module-or-socket-profile
    desc: Hypervisor CPUID check with module or socket clues
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/anti-analysis/vm-detect/vendor::hypervisor-cpuid-vendor-cluster
    any:
      - id: micro-behaviors/dylib/load/source::native-temp-write-library-load-profile
      - id: micro-behaviors/communications/socket/connect::native-pipe-record-connect-key-profile
