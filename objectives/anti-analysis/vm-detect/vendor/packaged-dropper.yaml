# A published package ships a compiled binary that both stages a payload and
# checks whether it is being watched.
#
# Either half alone is weak. A `curl … | sh` string can sit unused in a help
# text or an embedded install document, and a hypervisor vendor name can appear
# in a hardware table a library merely enumerates. Together, inside a binary an
# npm package installs, they describe a program that fetches its next stage
# from the network and declines to do so under observation. That is the shape of
# a dropper with an analyst check, and no build tool has a reason for it.
#
# The size of these binaries is not evidence and is deliberately not used. A
# `bun build --compile` or `deno compile` artifact embeds an entire runtime, so
# 100 MB is ordinary; measured here, a legitimate 119 MB `@cloudflare/workerd`
# and a 59 MB `@pagefind` platform package each produce no suspicious findings
# at all, and a benign `bun --compile` control produced 102 traits with none
# above notable and neither of the legs below. What separates the malicious set
# is behaviour carried in the embedded program, not the packaging.
#
# Worked example: the `@42ailab/42plugin` platform set (`-linux-x64`,
# `-darwin-arm64`, `-win32-x64` and siblings), whose bundled `bin/42plugin`
# carries both.
defaults:
  platforms: [unix, windows]
  attack: T1497.001,T1105
  mbc: B0009

composite_rules:
  - id: packaged-binary-sandbox-aware-stager
    desc: Shipped binary stages payload and checks sandbox
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/execution/pipe::curl-download-pipe-shell
      - id: vendor-vbox
