# CPUID hypervisor-vendor cluster (source / scripts).
#
# Under CPUID leaf 0x40000000 each hypervisor returns a fixed 12-byte vendor
# ID. Malware fingerprints the environment by comparing that value against a
# hardcoded table — "VMwareVMware", "KVMKVMKVM\0\0\0", "XenVMMXenVMM",
# "VBoxVBoxVBox", "prl hyperv", "TCGTCGTCGTCG" (QEMU/TCG). Any one string could
# be documentation; two or more of these exact vendor IDs together is a CPUID
# VM-vendor check. Binary CPUID probes are already covered by the `cpuid-check`
# family; this extends the same class to source and scripting languages, where
# the vendor IDs appear as string comparisons rather than .rodata blobs.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, scripts]
  attack: T1497.001
  mbc: B0009

traits:
  - id: cpuid-vendor-vmware
    desc: VMware CPUID leaf-0x40000000 vendor ID
    crit: component
    conf: 0.85
    if:
      type: text
      word: VMwareVMware
  - id: cpuid-vendor-xen
    desc: Xen CPUID leaf-0x40000000 vendor ID
    crit: component
    conf: 0.85
    if:
      type: text
      word: XenVMMXenVMM
  - id: cpuid-vendor-vbox
    desc: VirtualBox CPUID leaf-0x40000000 vendor ID
    crit: component
    conf: 0.85
    if:
      type: text
      word: VBoxVBoxVBox
  - id: cpuid-vendor-parallels
    desc: Parallels CPUID leaf-0x40000000 vendor ID
    crit: component
    conf: 0.85
    if:
      type: text
      word: prl hyperv
  - id: cpuid-vendor-tcg
    desc: QEMU/TCG CPUID leaf-0x40000000 vendor ID
    crit: component
    conf: 0.85
    if:
      type: text
      word: TCGTCGTCGTCG

composite_rules:
  - id: hypervisor-cpuid-vendor-cluster
    desc: Multiple CPUID hypervisor vendor IDs
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: cpuid-vendor-vmware
      - id: cpuid-vendor-xen
      - id: cpuid-vendor-vbox
      - id: cpuid-vendor-parallels
      - id: cpuid-vendor-tcg
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-kvm-repeat
    unless:
      # The klauspost/cpuid Go table and hypervisor tooling carry the full
      # vendor list as reference data rather than as an evasion check.
      - id: well-known/lib/core/klauspost-cpuid/
      - id: well-known/lib/core/raw-cpuid/
      - id: well-known/app/infrastructure/xen/
      - id: well-known/tool/development/qemu/
      - id: well-known/tool/detection/
