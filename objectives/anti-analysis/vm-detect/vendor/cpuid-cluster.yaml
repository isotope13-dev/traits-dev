defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - scripts
  attack: T1497.001
  mbc: B0009
traits:
- id: cpuid-vendor-vmware
  desc: VMware CPUID leaf-0x40000000 vendor ID
  crit: notable
  conf: 0.85
  if:
    type: text
    word: VMwareVMware
- id: cpuid-vendor-xen
  desc: Xen CPUID leaf-0x40000000 vendor ID
  crit: notable
  conf: 0.85
  if:
    type: text
    word: XenVMMXenVMM
- id: cpuid-vendor-vbox
  desc: VirtualBox CPUID leaf-0x40000000 vendor ID
  crit: notable
  conf: 0.85
  if:
    type: text
    word: VBoxVBoxVBox
- id: cpuid-vendor-parallels
  desc: Parallels CPUID leaf-0x40000000 vendor ID
  crit: notable
  conf: 0.85
  if:
    type: text
    word: prl hyperv
- id: cpuid-vendor-tcg
  desc: QEMU/TCG CPUID leaf-0x40000000 vendor ID
  crit: notable
  conf: 0.85
  if:
    type: text
    word: TCGTCGTCGTCG
composite_rules:
- id: hypervisor-cpuid-vendor-cluster
  desc: Multiple CPUID hypervisor vendor IDs
  crit: suspicious
  conf: 0.9
  needs: 2
  any:
  - id: cpuid-vendor-vmware
  - id: cpuid-vendor-xen
  - id: cpuid-vendor-vbox
  - id: cpuid-vendor-parallels
  - id: cpuid-vendor-tcg
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-kvm-repeat
  unless:
  - id: well-known/app/infrastructure/systemd::systemd-source-tree-path
  - id: well-known/lib/platform
  - id: well-known/app/infrastructure/xen/
  - id: well-known/tool/development/runtime/qemu/
  - id: well-known/tool/detection/
  - id: well-known/app/utility/
  - id: well-known/tool/sysadmin/
