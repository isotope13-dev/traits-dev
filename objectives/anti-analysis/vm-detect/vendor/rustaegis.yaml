defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1497.001
  mbc: B0009

traits:
  - id: encrypted-vmware-vendor
    desc: Encrypted RustAegis VMware probe ID
    crit: component
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 cb cb ae de 71 2f 5d 90

  - id: encrypted-vbox-vendor
    desc: Encrypted RustAegis VBox probe ID
    crit: component
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 f2 9e 29 4c ac 8b cc c4

  - id: encrypted-hyper-v-vendor
    desc: Encrypted RustAegis Hyper-V probe ID
    crit: component
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 fa 64 50 7f 29 5e db 84

composite_rules:
  - id: rustaegis-multi-vm-environment-check
    desc: RustAegis code checks multiple VM vendors
    crit: suspicious
    conf: 0.99
    all:
      - id: well-known/lib/runtime/protection/rustaegis::rustaegis-protected-binary
      - id: encrypted-vmware-vendor
      - id: encrypted-vbox-vendor
      - id: encrypted-hyper-v-vendor
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
