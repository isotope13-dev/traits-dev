defaults:
  platforms: [unix]
  for: [c, cpp, objc]
  attack: T1497.001

traits:
  - id: native-vm-vendor-qemu
    desc: Native QEMU vendor marker
    crit: component
    if:
      type: text
      word: QEMU
  - id: native-vm-vendor-kvm
    desc: Native KVM vendor marker
    crit: component
    if:
      type: text
      word: KVM
  - id: native-vm-vendor-virtualbox
    desc: Native VirtualBox vendor marker
    crit: component
    if:
      type: text
      word: VirtualBox
  - id: native-vm-vendor-vmware
    desc: Native VMware vendor marker
    crit: component
    if:
      type: text
      word: VMware
  - id: native-vm-vendor-hyper-v
    desc: Native Hyper-V vendor marker
    crit: component
    if:
      type: text
      word: Hyper-V
  - id: native-vm-vendor-bochs
    desc: Native Bochs vendor marker
    crit: component
    if:
      type: text
      word: Bochs
  - id: native-vm-vendor-xen
    desc: Native Xen vendor marker
    crit: component
    if:
      type: text
      word: Xen
  - id: native-vm-vendor-bhyve
    desc: Native BHYVE vendor marker
    crit: component
    if:
      type: text
      word: BHYVE
  - id: native-vm-vendor-parallels
    desc: Native Parallels vendor marker
    crit: component
    if:
      type: text
      word: Parallels

composite_rules:
  - id: native-vm-vendor-source-a
    desc: Native VM vendor source group A
    crit: component
    conf: 0.92
    any:
      - id: native-vm-vendor-qemu
      - id: native-vm-vendor-kvm
      - id: native-vm-vendor-virtualbox
  - id: native-vm-vendor-source-b
    desc: Native VM vendor source group B
    crit: component
    conf: 0.92
    any:
      - id: native-vm-vendor-vmware
      - id: native-vm-vendor-hyper-v
      - id: native-vm-vendor-bochs
  - id: native-vm-vendor-source-c
    desc: Native VM vendor source group C
    crit: component
    conf: 0.92
    any:
      - id: native-vm-vendor-xen
      - id: native-vm-vendor-bhyve
      - id: native-vm-vendor-parallels
  - id: native-vm-vendor-source-list
    desc: Native VM vendor identifier list
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: native-vm-vendor-source-a
      - id: native-vm-vendor-source-b
      - id: native-vm-vendor-source-c
    unless:
      - id: metadata/lang/source::linux-kernel-source-tree-path
