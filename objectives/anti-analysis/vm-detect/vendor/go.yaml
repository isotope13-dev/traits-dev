# VM Detection via MAC Address Prefixes - Go source
# Detects Go code that checks network interface MAC addresses for VM vendor prefixes
defaults:
  for: [go]
  platforms: [unix, windows]
  attack: T1497.001
  mbc: B0009

traits:
  - id: go-vm-mac-vmware
    desc: Go compares MAC data with VMware prefixes
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(HasPrefix|Compare)[^\n]{0,120}(00:0C:29|00:50:56|00:05:69)'
    unless:
      - id: well-known/app/security/packetfence::source-tree-path
      - id: well-known/lib/cloud/vmware-govmomi::govmomi-source-context
      - id: well-known/lib/cloud/vmware-govmomi::vim-api-source-context
      - id: metadata/package/testing/harness/unit::go-test
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::go-tools-testdata-directory-path
  - id: go-vm-mac-virtualbox
    desc: Go compares MAC data with VirtualBox prefix
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(HasPrefix|Compare)[^\n]{0,120}08:00:27'
  - id: go-vm-mac-parallels
    desc: Go compares MAC data with Parallels prefix
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(HasPrefix|Compare)[^\n]{0,120}00:1C:14'

composite_rules:
  - id: go-vm-mac-detection
    desc: VM detection via MAC prefix checks in Go
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/network/interface::net-interfaces
    needs: 2
    any:
      - id: go-vm-mac-vmware
      - id: go-vm-mac-virtualbox
      - id: go-vm-mac-parallels
