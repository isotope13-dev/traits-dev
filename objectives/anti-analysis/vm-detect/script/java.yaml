defaults:
  platforms: [unix, windows]
  for: [java, class, jar, zip]
  attack: T1497.001
  mbc: B0009

traits:
  - id: java-vm-env-var-roster--vmware-triple-fault
    desc: Java VM env var (VMWARE_USE_TRIPLE_FAULT)
    crit: component
    conf: 0.92
    if:
      type: text
      exact: VMWARE_USE_TRIPLE_FAULT
  - id: java-vm-env-var-roster--qemu-audio
    desc: Java VM env var (QEMU_AUDIO_DRV)
    crit: component
    conf: 0.92
    if:
      type: text
      exact: QEMU_AUDIO_DRV
  - id: java-vm-env-var-roster--software-gl
    desc: Java VM env var (LIBGL_ALWAYS_SOFTWARE)
    crit: component
    conf: 0.92
    if:
      type: text
      exact: LIBGL_ALWAYS_SOFTWARE
  - id: java-vmware-marker
    desc: Java VMware marker
    crit: component
    conf: 0.86
    if:
      type: text
      substr: vmware
  - id: java-virtualbox-marker
    desc: Java VirtualBox marker
    crit: component
    conf: 0.86
    if:
      type: text
      substr: virtualbox
  - id: java-kubernetes-marker
    desc: Kubernetes service environment marker
    crit: component
    conf: 0.86
    if:
      type: text
      substr: KUBERNETES_SERVICE_HOST
  - id: java-container-runtime-variable
    desc: Container runtime environment value
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)container=(docker|podman|containerd|cri-o)'
  - id: java-hw-model-sysctl-check
    desc: Java sysctl hardware model check
    crit: component
    conf: 0.88
    if:
      type: text
      substr: hw.model
  # Standard virtualization OUIs concealed as javac byte-array initializers.
  # Each byte is the plaintext character XOR 0x5e; the companion decoder atom
  # below prevents these arrays from being interpreted as plain constants.
  - id: java-xor5e-virtualbox-mac-prefix
    desc: JVM embeds XOR-0x5e VirtualBox MAC prefix
    crit: component
    conf: 0.98
    for: [class, jar, zip]
    if:
      type: hex
      pattern: '10 08 BC 08 59 03 10 6E 54 59 04 10 66 54 59 05 10 64 54 59 06 10 6E 54 59 07 10 6E 54 59 08 10 64 54 59 10 06 10 6C 54 59 10 07 10 69 54'
  - id: java-xor5e-vmware-mac-prefix
    desc: JVM embeds XOR-0x5e VMware MAC prefix
    crit: component
    conf: 0.98
    for: [class, jar, zip]
    if:
      type: hex
      pattern: '10 08 BC 08 59 03 10 6E 54 59 04 10 6E 54 59 05 10 64 54 59 06 10 6E 54 59 07 10 3D 54 59 08 10 64 54 59 10 06 10 6C 54 59 10 07 10 67 54'
  - id: java-xor5e-parallels-mac-prefix
    desc: JVM embeds XOR-0x5e Parallels MAC prefix
    crit: component
    conf: 0.98
    for: [class, jar, zip]
    if:
      type: hex
      pattern: '10 08 BC 08 59 03 10 6E 54 59 04 10 6E 54 59 05 10 64 54 59 06 10 6F 54 59 07 10 3D 54 59 08 10 64 54 59 10 06 10 6A 54 59 10 07 10 6C 54'

composite_rules:
  - id: java-xor-vm-mac-detect
    desc: Java decodes virtual-machine MAC prefix roster
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::jvm-constant-xor-byte-string-loop
    needs: 2
    any:
      - id: java-xor5e-virtualbox-mac-prefix
      - id: java-xor5e-vmware-mac-prefix
      - id: java-xor5e-parallels-mac-prefix

  # The generic stager remains dual-use. Refusing to launch it on a virtual
  # machine, and terminating instead, establishes an anti-analysis payload
  # gate rather than ordinary host compatibility logic.
  - id: java-vm-gated-encrypted-resource-dropper
    desc: Java VM gate suppresses encrypted payload launch
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1027,T1059
    mbc: B0009,B0032
    all:
      - id: java-xor-vm-mac-detect
      - id: objectives/command-and-control/dropper/staging/encrypted::java-indexed-xor-resource-stager
      - id: micro-behaviors/process/exit/terminate::jvm-system-exit-bytecode

  - id: java-vm-env-var-roster
    desc: Java VM environment variable checks
    crit: component
    conf: 0.92
    any:
      - id: java-vm-env-var-roster--vmware-triple-fault
      - id: java-vm-env-var-roster--qemu-audio
      - id: java-vm-env-var-roster--software-gl
  - id: java-container-marker
    desc: Java container runtime marker
    crit: component
    conf: 0.86
    any:
      - id: micro-behaviors/os/container/runtime::dockerenv
      - id: micro-behaviors/os/container/runtime::containerenv
      - id: java-kubernetes-marker
      - id: java-container-runtime-variable

  - id: java-vm-emulator-detect
    desc: Java VM and emulator detection
    crit: suspicious
    conf: 0.95
    all:
      - id: java-hw-model-sysctl-check
    needs: 3
    any:
      - id: java-vm-env-var-roster
      - id: java-vmware-marker
      - id: java-virtualbox-marker
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-vendor-string
      - id: java-container-marker
