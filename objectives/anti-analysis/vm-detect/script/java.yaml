defaults:
  platforms: [unix, windows]
  for: [java, class, jar, zip]
  attack: T1497.001
  mbc: B0009

traits:
  - id: java-vm-env-var-roster--vmware-triple-fault
    desc: Java VM env var (VMWARE_USE_TRIPLE_FAULT)
    crit: component
    conf: 0.92
    if:
      type: text
      exact: VMWARE_USE_TRIPLE_FAULT
  - id: java-vm-env-var-roster--qemu-audio
    desc: Java VM env var (QEMU_AUDIO_DRV)
    crit: component
    conf: 0.92
    if:
      type: text
      exact: QEMU_AUDIO_DRV
  - id: java-vm-env-var-roster--software-gl
    desc: Java VM env var (LIBGL_ALWAYS_SOFTWARE)
    crit: component
    conf: 0.92
    if:
      type: text
      exact: LIBGL_ALWAYS_SOFTWARE
  - id: java-vmware-marker
    desc: Java VMware marker
    crit: component
    conf: 0.86
    if:
      type: text
      substr: vmware
  - id: java-virtualbox-marker
    desc: Java VirtualBox marker
    crit: component
    conf: 0.86
    if:
      type: text
      substr: virtualbox
  - id: java-kubernetes-marker
    desc: Kubernetes service environment marker
    crit: component
    conf: 0.86
    if:
      type: text
      substr: KUBERNETES_SERVICE_HOST
  - id: java-container-runtime-variable
    desc: Container runtime environment value
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)container=(docker|podman|containerd|cri-o)'
  - id: java-hw-model-sysctl-check
    desc: Java sysctl hardware model check
    crit: component
    conf: 0.88
    if:
      type: text
      substr: hw.model

composite_rules:
  - id: java-vm-env-var-roster
    desc: Java VM environment variable checks
    crit: component
    conf: 0.92
    any:
      - id: java-vm-env-var-roster--vmware-triple-fault
      - id: java-vm-env-var-roster--qemu-audio
      - id: java-vm-env-var-roster--software-gl
  - id: java-container-marker
    desc: Java container runtime marker
    crit: component
    conf: 0.86
    any:
      - id: micro-behaviors/os/container/runtime::dockerenv
      - id: micro-behaviors/os/container/runtime::containerenv
      - id: java-kubernetes-marker
      - id: java-container-runtime-variable

  - id: java-vm-emulator-detect
    desc: Java VM and emulator detection
    crit: suspicious
    conf: 0.95
    all:
      - id: java-hw-model-sysctl-check
    needs: 3
    any:
      - id: java-vm-env-var-roster
      - id: java-vmware-marker
      - id: java-virtualbox-marker
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-vendor-string
      - id: java-container-marker
