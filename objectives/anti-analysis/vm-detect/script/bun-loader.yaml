defaults:
  platforms: [windows]
  for: [javascript, powershell]
  attack: T1497.001

traits:
  - id: powershell-process-count
    desc: PowerShell process count query
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Get-Process[^\\n]{0,80}\)\.Count'
  # A whole string literal naming a hypervisor, as in the loader's
  # blocklist -- like vm-indicator-bus-strings below. The word inside prose
  # or a comma-joined dictionary (zxcvbn's "...,vmware,...") is not a list.
  - id: vm-indicator-firmware-strings
    desc: VM firmware string cluster
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(seabios|bochs|edk ii)\b'
  - id: sandbox-analysis-usernames--account-field
    desc: Sandbox analysis account field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(user|login)\s*[:=][^;\n]{0,48}\b(sandbox|malware|virus)\b'
  - id: sandbox-analysis-usernames--home-field
    desc: Sandbox analysis home field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)home\s*[:=][^;\n]{0,48}\b(sandbox|malware|virus)\b'
  - id: sandbox-default-usernames
    desc: Sandbox default usernames
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(vmuser|wdagutilityaccount|defaultuser0)\b'

composite_rules:
  - id: sandbox-analysis-usernames
    desc: Sandbox analysis usernames
    crit: component
    conf: 0.9
    any:
      - id: sandbox-analysis-usernames--account-field
      - id: sandbox-analysis-usernames--home-field
  - id: bun-loader-cim-host-scoring
    desc: CIM host-enumeration scoring
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/wmi/query::cim-instance-cmdlet
    needs: 3
    any:
      - id: micro-behaviors/os/wmi/query::wmi-disk-drive-class
      - id: micro-behaviors/os/sysinfo/hardware::cim-physical-memory-class
      - id: micro-behaviors/os/wmi/query::wmi-bios-class
      - id: micro-behaviors/os/wmi/query::wmi-baseboard-class
      - id: powershell-process-count
  - id: bun-loader-antivm-scoring
    desc: Bun loader anti VM scoring
    crit: suspicious
    conf: 0.97
    all:
      - id: bun-loader-cim-host-scoring
    any:
      - id: micro-behaviors/os/sysinfo/virtualization::hypervisor-name-literal
      - id: vm-indicator-firmware-strings
      - id: micro-behaviors/os/sysinfo/virtualization::vm-platform-bus-name-literal
      - id: sandbox-analysis-usernames
      - id: sandbox-default-usernames
      - id: metadata/binary/section/name::bun-section-name
