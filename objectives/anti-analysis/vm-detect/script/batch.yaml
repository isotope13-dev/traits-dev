defaults:
  platforms: [windows]
  for: [batch]
  attack: T1497.001

# A batch file that reads the machine manufacturer through WMIC and matches it
# against hypervisor vendor names (VMware, VirtualBox, QEMU, Xen, Parallels)
# in one pipeline is a VM gate. Benign inventory scripts query the manufacturer
# too, so the vendor-name findstr leg must share the same line.
traits:
  - id: batch-wmic-manufacturer-query
    desc: Batch queries computer manufacturer via WMIC
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)wmic\s+computersystem\s+get\s+manufacturer'

  - id: batch-findstr-hypervisor-vendor
    desc: Batch matches hypervisor vendors via findstr
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)findstr[^\r\n]{0,80}(VMware|Virtual|QEMU|VBOX)'

composite_rules:
  - id: batch-manufacturer-vm-vendor-gate
    desc: Batch exits when manufacturer matches a hypervisor vendor
    crit: suspicious
    conf: 0.95
    near_lines: 1
    all:
      - id: batch-wmic-manufacturer-query
      - id: batch-findstr-hypervisor-vendor
