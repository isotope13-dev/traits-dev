defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-vm-indicators-vm
    desc: PowerShell checks VM environment variable
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bif\s*\([^)]{0,80}\$env:\s*(VMWARE|VBOX|QEMU)(\b|_)'
  - id: powershell-vm-indicators-kubernetes-env
    desc: PowerShell checks Kubernetes environment
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bif\s*\([^)]{0,80}\$env:\s*KUBERNETES_(SERVICE_HOST|PORT)\b'
  - id: powershell-vm-indicators-sandbox-env
    desc: PowerShell checks sandbox environment
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bif\s*\([^)]{0,80}\$env:\s*SANDBOX\b'
  - id: powershell-build-preflight-marker
    desc: PowerShell build preflight marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Docker Desktop may still work|Preflight passed|Required build files exist'
composite_rules:
  - id: powershell-emulator-detection
    desc: PowerShell conditions inspect multiple VM or sandbox indicators
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: powershell-vm-indicators-vm
      - id: powershell-vm-indicators-kubernetes-env
      - id: powershell-vm-indicators-sandbox-env
      - id: micro-behaviors/process/enumerate/shell::low-process-count
    unless:
      - id: powershell-build-preflight-marker
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-bootstrap-context
      - id: well-known/tool/sysadmin/vmware-powercli::powercli-launch-script
