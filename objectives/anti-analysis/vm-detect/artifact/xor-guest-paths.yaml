defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.98

traits:
  - id: xor-vm-guest-artifact-list
    desc: XOR-concealed VM guest artifact list
    attack: T1497.001,T1027
    if:
      type: yara
      source: |
        import "pe"
        rule xor_vm_guest_artifact_list {
          strings:
            $vbox = "\\drivers\\vboxguest.sys;" xor(1-255)
            $vmware = "\\VMware\\VMware Tools;" xor(1-255)
            $qemu = "\\Qemu-ga" xor(1-255)
          condition:
            pe.is_pe and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].characteristics & pe.SECTION_CNT_INITIALIZED_DATA != 0 and
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE == 0 and
              all of them in (pe.sections[s].raw_data_offset..
                             pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size) and
              for any v in (1..#vbox) : (
                for any w in (1..#vmware) : (
                  for any q in (1..#qemu) : (
                    @vmware[w] > @vbox[v] and @qemu[q] > @vmware[w] and
                    @qemu[q]-@vbox[v] < 1024 and
                    uint8(@vbox[v]) == uint8(@vmware[w]) and
                    uint8(@vbox[v]) == uint8(@qemu[q])
                  )
                )
              )
            )
        }
