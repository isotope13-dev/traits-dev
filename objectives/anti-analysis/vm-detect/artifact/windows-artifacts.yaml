defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1497.001
  mbc: B0009
traits:
  - id: vmware-vgauth-registry-key
    desc: VMware VGAuth registry probe
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: 'SOFTWARE\VMware, Inc.\VMware VGAuth'
  - id: sandboxie-rpcss-service
    desc: Sandboxie RPC service check
    crit: notable
    conf: 0.94
    if:
      type: text
      word: sandboxierpcss
  - id: anti-vm-config-accessors
    desc: Anti-VM config accessors
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '[gs]et_AntiVM'
  - id: anti-sandboxie-config-accessors
    desc: Anti-Sandboxie config accessors
    crit: notable
    conf: 0.92
    count_min: 2
    if:
      type: text
      regex: '[gs]et_AntiSandBoxie'
  - id: java-windows-guest-driver-path-roster
    desc: Java names several VM guest driver files
    crit: notable
    conf: 0.9
    for: [class, java]
    count_min: 3
    if:
      type: text
      regex: '(?i)\\+drivers\\+v[bm][a-z]{2,8}\.sys'
composite_rules:
  - id: dotnet-vm-sandbox-artifact-checks
    for: [pe]
    desc: .NET VM and sandbox artifact checks
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
    any:
      - id: vmware-vgauth-registry-key
      - id: micro-behaviors/process/info/name::vm-guest-tray-process-name
      - id: sandboxie-rpcss-service
      - id: anti-vm-config-accessors
      - id: anti-sandboxie-config-accessors
    needs: 3
    unless:
      - id: metadata/signature/verified/signer::oracle-america
      - id: metadata/signature/verified/signer::broadcom-inc

  - id: java-windows-vm-driver-file-probe
    desc: Java tests for several VM guest driver files
    crit: suspicious
    conf: 0.93
    for: [class]
    all:
      - id: java-windows-guest-driver-path-roster
      - id: micro-behaviors/fs/file/stat::jvm-file-exists-method-reference

  # A launcher that checks for VirtualBox/VMware guest drivers and also decrypts
  # a bundled stage for a child process is fingerprinting analysis hosts around
  # the payload hand-off; either half alone has plausible benign uses.
  - id: java-vm-probing-encrypted-stage-launcher
    desc: Java probes VM guest drivers and launches a decrypted stage
    crit: hostile
    conf: 0.95
    attack: T1497.001,T1027,T1105
    mbc: B0009,B0030
    for: [jar, class]
    scope: archive
    all:
      - id: java-windows-vm-driver-file-probe
      - id: objectives/execution/payload/file-exec/spawn/decrypted::java-bundled-encrypted-stage-launch
