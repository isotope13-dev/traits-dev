# VM detection via network adapter description enumeration
defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
  attack: T1497.001
traits:
  - id: adapter-description-substring-source
    desc: Adapter description substring comparison
    crit: notable
    conf: 0.88
    for: [c, cpp]
    if:
      type: text
      substr: pAdapterInfoPtr->Description
  - id: adapter-description-compare-source
    desc: Adapter description name comparison
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: StrStrI\s*\(\s*pwszConverted\s*,\s*szName\s*\)
  - id: adapter-mac-prefix-compare-source
    desc: Adapter MAC prefix comparison
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      substr: '!memcmp(szMacMultiBytes, pAdapterInfoPtr->Address, 3)'
composite_rules:
  - id: adapter-vm-fingerprint
    desc: VM detection via adapter description strings
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/dylib/library/family::iphlpapi-data-reference
    any:
      - id: metadata/file/string/device::data-section-virtual-word
      - id: metadata/file/string/device::data-section-bluetooth-word
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports
  - id: adapter-description-vm-check-source
    desc: VM detection via adapter description checks
    crit: suspicious
    conf: 0.94
    for: [c, cpp]
    all:
      - id: micro-behaviors/network/interface::get-adapters-info
      - id: adapter-description-substring-source
      - id: adapter-description-compare-source
  - id: adapter-mac-vm-check-source
    desc: VM detection via adapter MAC prefix
    crit: suspicious
    conf: 0.94
    for: [c, cpp]
    all:
      - id: micro-behaviors/network/interface::get-adapters-info
      - id: adapter-mac-prefix-compare-source
