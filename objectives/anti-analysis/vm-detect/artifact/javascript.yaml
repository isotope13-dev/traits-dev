defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  mbc: B0009
  attack: T1497.001
traits:
  - id: wmic-model-check
    desc: WMIC hardware model query (VM check)
    conf: 0.9
    if:
      type: text
      regex: wmic\s+computersystem\s+get\s+model
  - id: environment-gate-function-cluster--blocked-names
    desc: JavaScript gate function (checkBlockedNames)
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: checkBlockedNames
  - id: environment-gate-function-cluster--gpu
    desc: JavaScript gate function (checkGpu)
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: checkGpu
  - id: environment-gate-function-cluster--system
    desc: JavaScript gate function (checkSystem)
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: checkSystem
  - id: environment-gate-function-cluster--gpu-names
    desc: JavaScript gate function (getGpuNames)
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: getGpuNames
composite_rules:
  - id: environment-gate-function-cluster
    desc: JavaScript host and GPU gate functions
    crit: component
    conf: 0.9
    any:
      - id: environment-gate-function-cluster--blocked-names
      - id: environment-gate-function-cluster--gpu
      - id: environment-gate-function-cluster--system
      - id: environment-gate-function-cluster--gpu-names
  - id: js-vm-environment-check
    desc: JavaScript VM environment detection
    crit: notable
    conf: 0.92
    attack: T1497.001 - javascript - typescript
    needs: 2
    any:
      - id: wmic-model-check
      - id: micro-behaviors/os/sysinfo/hardware::system-profiler-hardware
      - id: micro-behaviors/fs/proc/system::system-cpuinfo
      - id: micro-behaviors/os/sysinfo/hardware::dmi-product-name-path
    unless:
      - id: well-known/lib/core/systeminformation/
      - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
      - id: well-known/app/communication/slack::slack-app-context
  - id: js-hardware-profiling
    desc: Cross-platform hardware profiling (VM evasion)
    crit: notable
    conf: 0.93
    attack: T1497.001 - javascript - typescript
    all:
      - id: js-vm-environment-check
    any:
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-vmware
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-virtualbox
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-vbox-short
    unless:
      - id: well-known/lib/core/systeminformation/
      - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
  - id: js-obfuscated-environment-gate
    desc: Obfuscated JavaScript host and GPU analysis gate
    crit: suspicious
    conf: 0.95
    all:
      - id: environment-gate-function-cluster
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator/
    unless:
      - id: well-known/lib/core/systeminformation/
      - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
