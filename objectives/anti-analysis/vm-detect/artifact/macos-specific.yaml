defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1497.001
composite_rules:
- id: applescript-vm-check-and-exit
  desc: AppleScript VM checks with shell exit
  crit: suspicious
  conf: 0.94
  for: [applescript, macho]
  all:
  - id: micro-behaviors/os/virtualization/hypervisor::applescript-vendor-comparison
  - id: micro-behaviors/process/exit/terminate::applescript-shell-exit
  any:
  - id: micro-behaviors/os/sysinfo/hardware::system-profiler-memory
  - id: micro-behaviors/os/sysinfo/hardware::system-profiler-hardware
- id: macos-vm-hardware-check
  desc: Hardware sysctl queries with Corellium probe references
  crit: notable
  conf: 0.85
  # Hardware and boot-argument queries alone do not show VM detection.
  # Require a named emulator probe independently of the sysctl profile.
  needs: 1
  downgrade:
    any:
    - id: metadata/signed/platform::apple
  unless:
    - id: well-known/tool/reverse-engineering/frida::frida-agent-macho
    - id: metadata/signed/id::frida-gadget-macos-universal
    - id: metadata/signed/developer::753PE4AG6F
    - id: micro-behaviors/os/telemetry/activity::posthog-telemetry-client
    - id: metadata/signed/id::com.posthog.PostHog
    - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-runtime-pack-context
    - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context
  all:
  - id: micro-behaviors/os/sysinfo/config::sysctlbyname
  - id: objectives/anti-analysis/emulator-detect::corellium-daemon-stat-probe
  any:
  - id: micro-behaviors/os/sysinfo/hardware::sysctl-hw-model-key
  - id: micro-behaviors/os/sysinfo/config::kern-bootargs-reference
  - id: micro-behaviors/hardware/iokit/registry::ioreg-vendor-query
- id: macos-evasive-hardware-fingerprint
  desc: Evasive macOS hardware fingerprinting (CPUID + RDTSC + sysctl)
  crit: suspicious
  conf: 0.95
  downgrade:
    any:
    - id: metadata/signed/platform::apple
  all:
  - id: macos-vm-hardware-check
  needs: 2
  any:
  - id: metadata/binary/instruction/opcode::cpuid-instr
  - id: objectives/anti-analysis/timing/evasion::rdtsc
  - id: metadata/binary/instruction/opcode::xgetbv-instr
- id: macos-ioreg-vm-vendor-check
  desc: ioreg vendor query with VM vendor references
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/hardware/iokit/registry::ioreg-vendor-query
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-reference
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
  - id: objectives/anti-analysis/vm-detect/vendor::vendor-parallels
  unless:
  - id: well-known/lib/vendor-sdk/licensespring::ioreg-license-policy-context
  downgrade:
    any:
    - id: metadata/signed/platform::apple
