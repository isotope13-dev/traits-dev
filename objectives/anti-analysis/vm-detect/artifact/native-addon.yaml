# A Node-API native addon whose own code probes for virtualization. A
# hardware-inventory library reports the host it runs on from JavaScript;
# shipping compiled VM-vendor probes inside a loadable addon is the shape of
# an execution gate, so the addon export plus the vendor cluster is
# suspicious even though each leg alone is ordinary.
defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe]
  attack: T1497.001

composite_rules:
  - id: node-addon-vm-vendor-probes
    desc: Node-API addon probes VM vendors
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: metadata/binary/linking/addon-abi::node-api-addon-export
      - id: micro-behaviors/os/virtualization/hypervisor::multiple-hypervisor-indicators
    unless:
      - id: well-known/lib/vendor-sdk/licensespring::ioreg-license-policy-context
