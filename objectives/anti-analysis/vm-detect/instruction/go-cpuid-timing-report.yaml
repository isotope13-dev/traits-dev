defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-cpuid-timing-hypervisor-report
    desc: Combines CPUID and timing VM signals
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule go_cpuid_timing_hypervisor_report {
          strings:
            $report = "func Hypervisor() HypervisorReport"
            $cpuid = "cpuidHypervisorReport()"
            $timing = "RDTSCDelta(hypervisorTimingSamples)"
            $flag = "LikelyVM:    present || sig != \"\" || delta > DefaultRDTSCThreshold"
          condition:
            all of them
        }
