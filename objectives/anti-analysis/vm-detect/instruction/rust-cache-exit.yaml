# A hypervisor-result test combined with cache timing and termination is an
# analysis-screening signal. Proximity is not proof of a particular branch.
defaults:
  platforms: [windows]
  for: [rust]
composite_rules:
  - id: rust-cpuid-cache-timing-exit
    desc: CPUID hypervisor test near cache timing and process exit
    crit: suspicious
    conf: 0.85
    attack: T1497.001,T1497.003
    all:
      - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-bit-source
      - id: micro-behaviors/time/timing/check::cache-flush-rdtsc-timing-probe
      - id: micro-behaviors/process/exit/terminate::rust-process-exit-call
    near_lines: 30
