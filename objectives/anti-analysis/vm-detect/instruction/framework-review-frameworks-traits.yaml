defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

composite_rules:
- id: descriptor-table-helper-cluster
  size_min: 1024
  size_max: 10485760
  desc: Descriptor-table probe helper-name cluster
  crit: component
  conf: 0.97
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  needs: 2
  any:
  - id: objectives/anti-analysis/vm-detect/instruction::idt-base-helper
  - id: objectives/anti-analysis/vm-detect/instruction::ldt-base-helper
  - id: objectives/anti-analysis/vm-detect/instruction::gdt-base-helper
