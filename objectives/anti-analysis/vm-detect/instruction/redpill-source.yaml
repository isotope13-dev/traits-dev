# Red Pill VM detection in C/C++ source
# SIDT instruction shellcode used to detect virtual machines
defaults:
  crit: suspicious
  for: [c, cpp]
  platforms: [windows]
  attack: T1497.001
  mbc: B0009
traits:
  - id: sidt-shellcode-bytes
    desc: SIDT instruction bytes in source
    conf: 0.92
    if:
      type: text
      substr: '\x0F\x01\x0D'
  - id: rpill-variable
    desc: Red Pill variable name reference
    conf: 0.85
    if:
      type: text
      word: "rpill"
  - id: idt-base-threshold
    desc: IDT base address VM threshold check
    conf: 0.88
    if:
      type: text
      regex: '(?i)(sidt|idt[ _-]?base|red[ _-]?pill).{0,60}0x[dD]0'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/upstream::linux-kernel-source-tree-path
composite_rules:
  - id: redpill-vm-detection
    desc: Red Pill SIDT VM detection technique
    conf: 0.93
    any:
      - id: sidt-shellcode-bytes
      - id: rpill-variable
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
