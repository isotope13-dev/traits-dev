# CPUID "GenuineIntel" vendor-word check in native x86 ELF binaries
# The sequence runs CPUID leaf 0 then compares EBX/ECX/EDX against the
# 'Genu','ineI','ntel' vendor words and records the result: VM and sandbox
# fingerprinting (ATT&CK T1497.001). Ordinary feature detection queries
# CPUID leaves but does not gate on the full vendor-word triple, so the
# triple compare plus a stripped-binary context keeps this precise.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86, x86-64]
  attack: T1497.001
  mbc: B0009
traits:
  - id: cpuid-vendor-word-triple-compare
    desc: CPUID result against GenuineIntel words
    crit: notable
    conf: 0.85
    if:
      type: hex
      offset_range: [0, null]
      pattern: "81 FB 47 65 6E 75 75 ?? 81 FA 69 6E 65 49 75 ?? 81 F9 6E 74 65 6C"
    unless:
      # The Go runtime performs its own CPUID vendor dispatch, so Go
      # binaries carry this spelling without any analysis-evasion intent.
      - id: metadata/lang/compiler/systems::go-binary
composite_rules:
  - id: stripped-elf-cpuid-vendor-check
    desc: Stripped ELF with CPUID vendor check
    crit: suspicious
    conf: 0.9
    all:
      - id: cpuid-vendor-word-triple-compare
    any:
      - id: metadata/binary/header/malformed::elf-parse-failure
    needs: 1
