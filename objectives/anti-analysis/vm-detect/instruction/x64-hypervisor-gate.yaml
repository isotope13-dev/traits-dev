defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-cpuid-hypervisor-bit-vendor-gate
    desc: Gates hypervisor vendor query on CPUID bit
    crit: suspicious
    conf: 0.99
    attack: T1497.001
    if:
      # CPUID leaf 1 ECX bit 31 selects the branch that queries 0x40000000.
      # Register-save displacements and branch targets are not identity.
      type: yara
      source: |
        import "pe"
        rule x64_cpuid_hypervisor_vendor_gate {
          strings:
            $gate = { B8 01 00 00 00 33 C9 0F A2 [0-24] 85 C9 78 ?? 33 FF E9 [4] B8 00 00 00 40 33 C9 0F A2 }
            $clang = { B8 01 00 00 00 4C 87 C3 0F A2 4C 87 C3 [0-32] 25 00 00 00 80 [0-32] 0F 84 [4] [0-32] B8 00 00 00 40 4C 87 C3 0F A2 }
          condition:
            pe.is_64bit() and any of them and
            (for any i in (1..#gate): (
              for any s in (0..pe.number_of_sections - 1): (
                pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                @gate[i] >= pe.sections[s].raw_data_offset and
                @gate[i] + !gate[i] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
              )
            ) or for any i in (1..#clang): (
              for any s in (0..pe.number_of_sections - 1): (
                pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                @clang[i] >= pe.sections[s].raw_data_offset and
                @clang[i] + !clang[i] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
              )
            ))
        }
