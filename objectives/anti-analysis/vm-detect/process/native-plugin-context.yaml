# Split the former VM-check alternative by the required detection mechanism.
defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: vm-process-check-with-module-or-socket-profile
    desc: VM guest-agent check with module or socket clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/info/name::vm-guest-agent-name-cluster
    any:
      - id: micro-behaviors/dylib/load/source::native-temp-write-library-load-profile
      - id: micro-behaviors/data/format/string::pipe-record-socket-buffer-references
