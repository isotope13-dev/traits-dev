# Mars Stealer's process-name anti-VM check, generalized to the structural
# pattern: native process enumeration paired with VM/analysis process markers.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1497.001,T1057
  mbc: B0009

traits:
  - id: vbox-process-name-source
    desc: Source checks process name for VBOX
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bVBOX\b'

  - id: q-rootkit-process-name-source
    desc: Source checks for q.exe
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bq\.exe\b'

composite_rules:
  - id: native-vm-process-check
    desc: Native process enumeration checks VM or analysis-tool names
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-source
    any:
      - id: vbox-process-name-source
      - id: q-rootkit-process-name-source
