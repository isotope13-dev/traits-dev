defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Managed metadata retains GetProcesses instead of a Toolhelp import.
  # These are co-occurring query and target references, not a bound name
  # comparison or proof that a VM causes termination. Inventory utilities
  # can carry the same evidence, so retain suspicious criticality.
  - id: managed-guest-agent-query-references
    desc: Managed process query with VM agent targets
    crit: suspicious
    conf: 0.9
    attack: T1497.001
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
      - id: micro-behaviors/process/info/name::vmtoolsd-name
      - id: micro-behaviors/process/info/name::vboxservice-name
