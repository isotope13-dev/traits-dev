# Hypervisor guest-agent process blacklist.
#
# A recurring anti-analysis technique (Abyssos and many other RATs/stealers):
# enumerate running processes and bail if any hypervisor guest-integration
# agent is present. The distinctive artifact is the *cluster* of guest-agent
# executable names — vmtoolsd (VMware), VBoxService (VirtualBox), qemu-ga /
# spice-vdagent (QEMU/KVM/SPICE), prl_tools (Parallels), xenservice (Xen).
# One name in isolation is ambiguous (installers, inventory tools, the guest
# tools themselves), so the composite requires three or more distinct daemons
# together, which is rarely legitimate outside VM-detection code. The check is
# language- and format-agnostic: the names are the same whether they sit in a
# C++ blacklist array, a PowerShell process filter, or a PE string table.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1497.001,T1057
  mbc: B0009

traits:
  - id: proc-vboxservice
    desc: VirtualBox guest service process name
    crit: component
    conf: 0.85
    if:
      type: text
      word: VBoxService
      case_insensitive: true
  - id: proc-vmwaretray
    desc: VMware tray guest process name
    crit: component
    conf: 0.85
    if:
      type: text
      word: vmwaretray
      case_insensitive: true
  - id: proc-prl-tools
    desc: Parallels guest tools process name
    crit: component
    conf: 0.85
    if:
      type: text
      word: prl_tools
      case_insensitive: true
  - id: proc-xenservice
    desc: Xen guest service process name
    crit: component
    conf: 0.85
    if:
      type: text
      word: xenservice
      case_insensitive: true
  - id: proc-spice-vdagent
    desc: SPICE/QEMU guest agent process name
    crit: component
    conf: 0.85
    if:
      type: text
      word: spice-vdagent
      case_insensitive: true

composite_rules:
  - id: vm-guest-agent-process-blacklist
    desc: Cluster of hypervisor guest-agent process names
    crit: suspicious
    conf: 0.9
    needs: 3
    any:
      - id: proc-vboxservice
      - id: proc-vmwaretray
      - id: proc-prl-tools
      - id: proc-xenservice
      - id: proc-spice-vdagent
      - id: objectives/anti-analysis/vm-detect/vendor::file-vmtoolsd
      - id: objectives/anti-analysis/vm-detect/vendor::file-qemu-ga
      - id: objectives/anti-analysis/vm-detect/artifact::vboxtray-process-name
    unless:
      # The guest tools, VM platforms, and detection research/utilities legitimately
      # enumerate these same daemon names.
      - id: well-known/app/infrastructure/open-vm-tools/
      - id: well-known/app/infrastructure/xen/
      - id: well-known/tool/development/qemu/
      - id: well-known/tool/detection/

  - id: vm-guest-agent-blacklist-enum
    desc: Process enumeration against guest-agent blacklist
    crit: suspicious
    conf: 0.95
    for: [source, binaries]
    all:
      - id: vm-guest-agent-process-blacklist
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
