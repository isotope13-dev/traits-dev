defaults:
  for: [pe]
  platforms: [windows]
  attack: T1497.001
traits:
- id: wildcard-vm-vendor-markers
  desc: Wildcard VM vendor markers
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "*VMWARE*|*VBOX*|*VIRTUAL*|*QEMU*"
  unless:
  - id: metadata/signed/platform/

- id: disk-enum-vmcheck-cluster
  desc: Disk enum vmcheck cluster
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: SYSTEM\ControlSet001\Services\Disk\Enum

- id: vmcheck-debugger-api-block
  desc: vmcheck debugger API block
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: GetUserNameA|vmcheck.dll|IsDebuggerPresent

composite_rules:
- id: packed-loader-vmcheck-markers
  desc: Packed loader VM check markers
  crit: suspicious
  conf: 0.94
  all:
  - id: wildcard-vm-vendor-markers
  - id: disk-enum-vmcheck-cluster
  - id: vmcheck-debugger-api-block
  any:
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
  - id: micro-behaviors/os/virtualization/hypervisor::vbox-short-reference
  - id: objectives/evasion/process/injection/hollowing/process::pipe-delimited-hollowing-setup
  unless:
  - id: metadata/signed/platform/
