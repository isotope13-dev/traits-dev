defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1497.001
  mbc: B0009

traits:
  - id: powershell-physical-memory-threshold
    desc: Physical memory and threshold reference
    crit: notable
    attack: none
    mbc: none
    conf: 0.96
    if:
      type: text
      regex: '(?is)Get-CimInstance.{0,420}TotalPhysicalMemory.{0,160}(-lt|<)\s*[0-9.]+'
  - id: powershell-threshold-conditional-exit
    desc: Conditional threshold exit
    crit: component
    if:
      type: text
      regex: '(?is)if\s*\([^{}\r\n<-]{1,120}(-lt|<)[^{}\r\n)]{1,80}\)\s*\{[^{}]{0,160}\bexit\b'

composite_rules:
  - id: powershell-low-memory-exit-check
    desc: Physical memory threshold near a conditional exit
    crit: suspicious
    near_lines: 8
    all:
      - id: powershell-physical-memory-threshold
      - id: powershell-threshold-conditional-exit
