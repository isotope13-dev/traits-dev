defaults:
  crit: suspicious
  conf: 0.98
  for: [pe]
  platforms: [windows]
  attack: T1497.001
  mbc: B0009
composite_rules:
  - id: bios-vendor-vm-check
    desc: BIOS manufacturer VM environment check
    all:
      - id: micro-behaviors/os/sysinfo/hardware::bios-manufacturer-registry-query
    any:
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
      - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-reference
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-name-reference
    needs: 2
    unless:
      - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: bios-vm-check-and-exit
    desc: BIOS VM check with exit API
    all:
      - id: bios-vendor-vm-check
      - id: micro-behaviors/process/exit/terminate::exit-process
    unless:
      - id: well-known/app/system/iobit::iobit-signed-component-context

  - id: vm-registry-and-anti-debug-guard
    desc: Unsigned PE probes VMware/VirtualBox registry keys and debuggers
    crit: hostile
    conf: 0.95
    for: [pe, dll]
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/os/registry/open::reg-open-key-ex-w-symbol
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-utf16-reference
      - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-utf16-reference
    any:
      - id: objectives/anti-analysis/debugger-detect/combined-checks::peb-inline-anti-debug-cluster
      - id: objectives/anti-analysis/debugger-detect/combined-checks::ntqip-multi-class-probe
      - id: objectives/anti-analysis/debugger-detect/check::win-debugger-detect
    needs: 2
    unless:
      - id: metadata/signature/verified/
