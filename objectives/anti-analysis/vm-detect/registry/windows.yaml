defaults:
  for: [pe]
  platforms: [windows]
  attack: T1497.001
  mbc: B0009
composite_rules:
  - id: bios-vendor-vm-check
    desc: BIOS manufacturer VM environment check
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/hardware::bios-manufacturer-registry-query
    any:
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-virtualbox
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-qemu
    needs: 2
    unless:
      - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: bios-vm-check-and-exit
    desc: BIOS VM check with exit API
    crit: suspicious
    conf: 0.98
    all:
      - id: bios-vendor-vm-check
      - id: micro-behaviors/process/terminate/kill::exit-process
    unless:
      - id: well-known/app/system/iobit::iobit-signed-component-context
