# Reading IsVirtualMachine from Defender's computer status asks the endpoint
# product whether it runs under a hypervisor: a sandbox gate. SocGholish's
# trojanized Figma loader queries it before decrypting its shellcode.
defaults:
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: defender-status-vm-query
    desc: Asks Defender WMI whether host is a VM
    crit: suspicious
    conf: 0.92
    attack: T1497.001
    ref: https://adamnet.works/blog/socgholish-trojanized-figma-rust-tor-backdoor/
    all:
      - id: micro-behaviors/os/wmi/query::defender-computer-status-class
      - id: micro-behaviors/os/wmi/query::defender-isvirtualmachine-property
