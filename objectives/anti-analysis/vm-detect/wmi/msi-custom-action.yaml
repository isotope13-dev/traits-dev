defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vm-aware-msi-custom-action-child-launch
    desc: Managed MSI action has VM and child clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/reference-install::dotnet-managed-custom-action-assembly
      - id: objectives/anti-analysis/vm-detect/wmi::wmi-vm-display-fingerprint
      - id: micro-behaviors/process/fd/stdio::dotnet-child-stdio-config-references
