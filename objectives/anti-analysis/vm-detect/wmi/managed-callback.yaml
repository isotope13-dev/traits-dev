defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: managed-vm-test-wmi-failfast-references
    desc: VM-test callbacks with WMI and FailFast
    crit: suspicious
    conf: 0.94
    attack: T1497.001
    if:
      type: yara
      source: |
        rule managed_vm_test_wmi_failfast_references {
          strings:
            $clr = "BSJB" ascii
            $callback = "<IsVM>b__" ascii
            $wmi = "ManagementObjectSearcher" ascii fullword
            $exit = "FailFast" ascii fullword
          condition:
            uint16(0) == 0x5a4d and all of them
        }
