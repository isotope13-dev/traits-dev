defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: jscript-wmi-vendor-probes
    desc: WMI host queries with multiple VM vendor references
    crit: suspicious
    conf: 0.95
    attack: T1497.001
    all:
      - id: micro-behaviors/os/wmi/query::win32-wql-query
      - id: micro-behaviors/os/wmi/query::query-os-info
      - id: micro-behaviors/os/virtualization/hypervisor::node-vm-vendor-references
