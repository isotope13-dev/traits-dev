defaults:
  for:
  - pe
  - dll
  - csharp
  crit: component
  conf: 0.85
  mbc: B0009
  platforms:
  - windows
composite_rules:
- id: wmi-evasion-with-run-persistence
  for: [pe]
  desc: WMI evasion checks with Run-key persistence
  crit: hostile
  conf: 0.98
  attack: T1497.001,T1547.001
  all:
  - id: objectives/discovery/host/security::pe-wmi-av-enumeration
  - id: wmi-vm-display-fingerprint
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  unless:
  - id: well-known/tool/sysadmin/

- id: wmi-vm-display-fingerprint
  desc: WMI VM display adapter fingerprinting
  crit: suspicious
  conf: 0.92
  attack: T1497.001
  ref: sha256:45415f110b7961eea726dd3b1c07ebed2bbc44d13e8d92d0d8bd1304ba145d73
  all:
  - id: micro-behaviors/os/wmi/query::wmi-video-controller-class
  any:
  - id: micro-behaviors/hardware/gpu::microsoft-basic-render-driver
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-mention
  - id: objectives/anti-analysis/emulator-detect/hardware::qemu-string
  unless:
  - id: well-known/lib/platform/wmi::wmi-win32-provider-versioninfo
  - id: metadata/signed/unknown::vmware
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/app/utility/siw::siw-family-identity
  - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
  - id: metadata/signed/certificate/subject::eeo-signed-publisher
  - id: well-known/game/steam::valve-signed-steam-binary
  - id: well-known/game/playnite::library-binary
  - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context
# MSAcpi_ThermalZoneTemperature returns no instances on most hypervisors, so
# malware (GravityRAT, per Talos 2018) queries it beside BIOS and system
# classes to detect VMs. Hardware monitors read the same class, hence only
# suspicious and skipped for signed or identified products.
- id: wmi-thermal-zone-vm-probe
  desc: WMI thermal-zone probe with BIOS and system queries
  crit: suspicious
  conf: 0.85
  attack: T1497.001
  all:
  - id: micro-behaviors/os/wmi/query::wmi-thermal-zone-class
  - id: micro-behaviors/os/wmi/query::wmi-bios-class
  - id: micro-behaviors/os/wmi/query::wmi-computer-system-class
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
  - id: well-known/app/
  - id: well-known/tool/
