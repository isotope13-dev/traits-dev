defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Reviewed guard counts Win32_CacheMemory objects, checks OS ProductType,
  # and fails fast on a workstation with fewer than two cache objects.
  # Facts do not preserve that cross-method branch relation. Require an
  # independently established plugin backdoor and describe this as a profile,
  # rather than asserting that every query controls termination.
  - id: managed-plugin-cache-query-abort-profile
    desc: Cache and OS probes with abort in plugin backdoor
    crit: suspicious
    conf: 0.93
    attack: T1497.001
    all:
      - id: objectives/command-and-control/backdoor/dispatch/module::messagepack-managed-plugin-tasking
      - id: micro-behaviors/os/wmi/query::wmi-cache-memory-class
      - id: micro-behaviors/os/wmi/query::wmi-operating-system-class
      - id: micro-behaviors/os/wmi/query::managed-wmi-query-call
      - id: micro-behaviors/process/exit/terminate::managed-failfast-call
