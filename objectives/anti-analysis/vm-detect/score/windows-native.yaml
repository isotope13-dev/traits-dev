# Scored Windows environment gates combine several independent VM/debugger
# probes and abort the payload when the score crosses a threshold.  The
# evidence is source structure, not the Kynx family name or its endpoint.
defaults:
  platforms: [windows]
  for: [c, cpp]
  mbc: B0009

traits:
  - id: low-cpu-resource-source
    desc: Source rejects low processor count
    crit: component
    conf: 0.94
    if:
      type: text
      # A normal availability check such as `> 0` is not an analysis gate.
      # Require the low-resource side of the comparison instead.
      regex: '(?s)GetSystemInfo.{0,160}dwNumberOfProcessors\s*(<\s*=?|==)\s*[12]\b'

  - id: low-ram-resource-source
    desc: Source rejects low physical memory
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?s)GlobalMemoryStatusEx.{0,160}ullTotalPhys\s*[<>=]+\s*\d'

  - id: tickcount-delay-check-source
    desc: Source compares elapsed tick count around sleep
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?s)GetTickCount64.{0,80}Sleep.{0,100}GetTickCount64.{0,80}[><=].{0,8}\d{2,}'

  - id: score-threshold-abort-source
    desc: Source aborts after analysis score threshold
    crit: component
    conf: 0.95
    unless:
      - id: well-known/tool/development/toolchain/gcc-source::gcc-source-archive-member
    if:
      type: text
      # A threshold check in C/C++ requires a comparison operator, not assignment (`score = 0;`).
      regex: '(?s)score\s*([><]=?|==|!=)\s*\d{1,2}.{0,320}(ExitProcess|TerminateProcess|abort)\s*\('

composite_rules:
  - id: native-scored-environment-gate
    desc: Native scored VM and debugger execution gate
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1497.003,T1622
    all:
      - id: objectives/anti-analysis/debugger-detect/check::peb-fs-30h-source
      - id: objectives/anti-analysis/debugger-detect/check::being-debugged-byte-source
      - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-bit-source
      - id: score-threshold-abort-source
  - id: native-resource-screening-gate
    desc: Native resource and timing execution gate
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1497.003
    all:
      - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-bit-source
      - id: low-cpu-resource-source
      - id: low-ram-resource-source
      - id: tickcount-delay-check-source
      - id: score-threshold-abort-source
