# Weighted multi-vector VM/sandbox scoring and execution abort gate in
# JavaScript/TypeScript (Node.js / Electron). Pure VM multi-probe scoring is
# kept suspicious because proctoring tools may inspect hypervisors; combining
# scored VM probes with sandbox/analyst identity screening and forced exit
# establishes a hostile anti-analysis execution gate.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1497.001
  mbc: B0009

traits:
  - id: js-weighted-score-accumulation
    desc: Accumulates weighted VM detection score
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w*score\s*\+=\s*[A-Za-z0-9_.\[\]]+'

  - id: js-score-threshold-comparison
    desc: Compares detection score to threshold
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w*score\s*(>=|>)\s*[A-Za-z0-9_.]+'

composite_rules:
  - id: js-multi-probe-vm-score-check
    desc: Scores multiple VM and hypervisor probes
    crit: suspicious
    conf: 0.95
    all:
      - id: js-weighted-score-accumulation
      - id: js-score-threshold-comparison
    needs: 3
    any:
      - id: micro-behaviors/process/info/name::vm-guest-agent-name-cluster
      - id: micro-behaviors/os/virtualization/detect::vm-mac-prefix-check
      - id: micro-behaviors/os/registry/read::node-exec-reg-query
      - id: micro-behaviors/os/wmi/query::cim-instance-cmdlet

  - id: js-scored-vm-sandbox-abort-gate
    desc: Aborts on scored VM and sandbox checks
    crit: hostile
    conf: 0.99
    all:
      - id: js-multi-probe-vm-score-check
      - id: objectives/anti-analysis/sandbox-detect/username-gate::js-host-user-sandbox-analyst-screen
    any:
      - id: micro-behaviors/process/exit/terminate::electron-app-quit-call
      - id: micro-behaviors/process/exit/terminate::node-process-exit-call
