# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


composite_rules:
  - id: database-client-root-discovery
    desc: Root search for database clients
    crit: suspicious
    conf: 0.97
    for: [javascript, shell]
    all:
      - id: micro-behaviors/fs/search/command::find-from-filesystem-root
    any:
      - id: metadata/package/scripts/command::mysql-client-name
      - id: metadata/package/scripts/command::mongo-client-name
      - id: metadata/package/scripts/command::psql-client-name
      - id: metadata/package/scripts/command::redis-client-name
      - id: metadata/package/scripts/command::sqlite-client-name
      - id: metadata/package/scripts/command::elasticsearch-client-name
    needs: 3
