# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


traits:
  - id: mysql-client-name
    desc: postinstall names mysql client
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts.postinstall
      substr: mysql
  - id: mongo-client-name
    desc: postinstall names mongo client
    crit: component
    conf: 0.92
    if:
      type: value
      path: scripts.postinstall
      regex: '\bmongosh?\b'
  - id: psql-client-name
    desc: postinstall names psql client
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts.postinstall
      substr: psql
  - id: redis-client-name
    desc: postinstall names redis client
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts.postinstall
      substr: redis-cli
  - id: sqlite-client-name
    desc: postinstall names sqlite client
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts.postinstall
      substr: sqlite3
  - id: elasticsearch-client-name
    desc: postinstall names elasticsearch
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts.postinstall
      substr: elasticsearch

composite_rules:
  - id: database-client-root-discovery
    desc: Root search for database clients
    crit: suspicious
    conf: 0.97
    for: [javascript, shell]
    all:
      - id: micro-behaviors/fs/search::find-from-filesystem-root
    any:
      - id: objectives/discovery/host/software::mysql-client-name
      - id: objectives/discovery/host/software::mongo-client-name
      - id: objectives/discovery/host/software::psql-client-name
      - id: objectives/discovery/host/software::redis-client-name
      - id: objectives/discovery/host/software::sqlite-client-name
      - id: objectives/discovery/host/software::elasticsearch-client-name
    needs: 3
