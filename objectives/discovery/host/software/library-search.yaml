defaults:
  platforms:
    - unix
    - windows
  for:
    - c
    - elf
traits:
  # NOTE: the bare `#ifdef __x86_64__` / `#ifdef __aarch64__` portability
  # guards are neutral compile-time facts, not host-software discovery — they
  # appear in nearly every portable C header. They live at baseline in
  # micro-behaviors/os/sysinfo/platform/arch/ and are folded back in by the
  # `arch-macro-detection` composite below, which carries the discovery intent.
  # The `#elif __x86_64__` / `#elif __aarch64__` branches moved to
  # micro-behaviors/os/sysinfo/platform/arch at baseline, alongside the
  # `#ifdef` spelling the note above already ruled neutral. The
  # arch-const-mapping composite below now references them there.
  - id: arch-aware-lib-filter-1
    desc: Architecture-aware library filtering (x86/arm)
    crit: suspicious
    conf: 0.9
    for:
      - c
    if:
      type: text
      regex: strstr\s*\(\s*[^,]{1,120}d_name\s*,\s*"(x86_64|arm|i386)"\s*\)
  - id: arch-aware-lib-filter-2
    desc: 'Architecture-aware library filtering'
    crit: suspicious
    conf: 0.9
    for:
      - c
    if:
      type: text
      regex: strstr\s*\(\s*[^,]{1,120}d_name\s*,\s*"(aarch64|linux)"\s*\)
  - id: spotlight-app-query
    desc: Spotlight query for applications
    crit: suspicious
    conf: 0.9
    attack: T1518
    platforms:
      - macos
    for:
      - macho
    if:
      type: text
      regex: kMDItemKind\s*==\s*'Application'
  - id: mdquery-create
    desc: MDQuery API usage
    crit: notable
    conf: 0.7
    attack: T1518
    platforms:
      - macos
    for:
      - macho
    if:
      type: text
      # MDQueryCreateResultFunction/MDQueryCreateValueFunction are SDK type
      # names, not calls to the Spotlight query constructor.
      regex: '(?i)(^|[^A-Za-z0-9_])MDQueryCreate([^A-Za-z0-9_]|$)'
  - id: mdfind-bundle-id-query
    desc: Spotlight bundle identifier query
    crit: notable
    conf: 0.86
    attack: T1518
    platforms:
      - macos
    for:
      - macho
      - shell
      - applescript
    if:
      type: text
      substr: mdfind kMDItemCFBundleIdentifier
composite_rules:
  - id: arch-const-mapping
    desc: Multi-architecture numeric constant mapping
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/sysinfo/platform/arch::elif-arch-macro-branch
      - id: micro-behaviors/os/sysinfo/platform/arch::elif-aarch64-macro-branch
  - id: arch-aware-lib-filter
    desc: Architecture-aware library filtering
    crit: suspicious
    conf: 0.9
    any:
      - id: arch-aware-lib-filter-1
      - id: arch-aware-lib-filter-2
  - id: spotlight-app-enum
    desc: Spotlight application enumeration
    crit: suspicious
    conf: 0.9
    attack: T1518
    platforms:
      - macos
    for:
      - macho
    all:
      - id: mdquery-create
      - id: spotlight-app-query
  - id: lib-path-enum
    desc: Library path enumeration
    crit: notable
    conf: 0.7
    mbc: E1083
    attack: T1518
    needs: 3
    any:
      - id: micro-behaviors/fs/path/library::lib-path
      - id: micro-behaviors/fs/path/library::usr-lib-path
      - id: micro-behaviors/fs/path/library::usr-local-lib-path
  - id: arch-detection
    desc: Architecture detection strings
    # Arch name tokens alone do not establish software discovery intent; they
    # appear in kernel headers, sanitizers, and libc. Composites that need
    # arch selection keep this as a component leg.
    crit: component
    conf: 0.5
    any:
      - id: micro-behaviors/os/sysinfo/platform/arch/
      - id: micro-behaviors/os/sysinfo/platform/string/
  - id: ssl-lib-targets
    desc: SSL/TLS library marker
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/dylib/library/ssl/
  - id: lib-search-infra
    desc: Library search infrastructure
    crit: notable
    conf: 0.8
    mbc: E1083
    attack: T1518
    all:
      - id: lib-path-enum
    any:
      - id: arch-detection
      - id: micro-behaviors/dylib/lookup::source-library-resolver-identifier
      - id: micro-behaviors/fs/directory/readdir::readdir
  - id: ssl-lib-discovery
    desc: SSL library discovery
    crit: suspicious
    conf: 0.85
    mbc: E1083
    attack: T1557
    all:
      - id: lib-path-enum
      - id: ssl-lib-targets
  - id: arch-aware-lib-resolver
    desc: Architecture-aware library resolver interface
    crit: suspicious
    conf: 0.85
    mbc: E1083
    attack: T1518
    all:
      - id: micro-behaviors/dylib/lookup::source-library-resolver-identifier
    any:
      - id: arch-const-mapping
      - id: micro-behaviors/data/source/syntax/directive::ifdef-x86-arm-arch-guard
      - id: micro-behaviors/data/source/syntax/directive::ifdef-aarch64-arch-guard
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/source::linux-kernel-source-tree-path
      - id: metadata/package/documentation/manpage::unix-manpage
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
      - id: well-known/tool/development/aflplusplus::aflplusplus-context
  - id: manual-library-resolver
    desc: Manual recursive library resolver
    crit: suspicious
    conf: 0.95
    mbc: E1083
    attack: T1518
    all:
      - id: lib-search-infra
    any:
      - id: arch-aware-lib-filter
      - id: micro-behaviors/data/source/syntax/directive::ifdef-x86-arm-arch-guard
      - id: micro-behaviors/data/source/syntax/directive::ifdef-aarch64-arch-guard
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/source::linux-kernel-source-tree-path
      - id: metadata/package/documentation/manpage::unix-manpage
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
