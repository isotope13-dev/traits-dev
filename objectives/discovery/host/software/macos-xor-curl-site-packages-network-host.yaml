---
defaults:
  platforms:
  - macos
  for:
  - macho
composite_rules:
- id: macos-xor-curl-site-packages-status-clues
  desc: XOR-decoded URL, curl and site-packages clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/communications/url/host/domain-http::xor-decoded-http-url
  - id: micro-behaviors/communications/http/client/library::xor-decoded-curl-easy-perform
  - id: micro-behaviors/data/encoding/xor/unspecified-key::xor-encoded-server-fetch-error
  - id: micro-behaviors/fs/directory/readdir/native::xor-decoded-site-packages-enumeration
  - id: metadata/lang/natural/diagnostic::xor-decoded-write-failure-status
