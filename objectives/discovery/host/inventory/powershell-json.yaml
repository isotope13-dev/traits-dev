defaults:
  platforms: [unix, netbsd, windows]
  for: [powershell]
  attack: T1041

traits:
  - id: ps-json-stage-output
    desc: PowerShell host inventory JSON output
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Get-(ComputerInfo|CimInstance|Process)[\s\S]{0,320}ConvertTo-Json[\s\S]{0,140}Out-File'
