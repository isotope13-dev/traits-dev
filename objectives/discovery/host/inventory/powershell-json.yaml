defaults:
  platforms: [unix, netbsd, windows]
  for: [powershell]
  attack: T1041

traits:
  - id: ps-json-stage-output
    desc: PS JSON stage output
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Get-(ComputerInfo|CimInstance|Process)[\s\S]{0,320}ConvertTo-Json[\s\S]{0,140}Out-File'
    unless:
      - id: well-known/app/infrastructure/azure-dev-cli/
      - id: well-known/game/playnite::source-path
