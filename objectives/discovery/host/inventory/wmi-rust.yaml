# Rust implant host survey: a multi-class WMI inventory whose WQL query
# strings and result-field names are all wrapped in a compile-time string
# obfuscation macro, so nothing readable survives into the built binary.
#
# The concealment is what separates this from an asset-inventory agent.
# Legitimate Rust inventory tooling (bottom, sysinfo consumers, RMM agents)
# ships its `SELECT * from Win32_*` strings as plain literals -- there is no
# reason to encrypt a query you are documented to run. Pairing the macro with
# a survey that spans four or more distinct host classes is implant recon.
#
# The atoms live where the things they match live: the obfuscation macro in
# anti-static/obfuscation/string/conceal/, the per-class WMI queries in
# micro-behaviors/os/wmi/query/, the per-class profile composites in
# discovery/host/fingerprint/. This file only asserts the combination.
defaults:
  platforms: [windows]
  for: [rust]
  attack: T1082

composite_rules:
  - id: concealed-wmi-host-inventory
    desc: Multi-class WMI host survey with obfuscated query strings
    crit: hostile
    conf: 0.96
    attack: T1082,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-strings
      - id: micro-behaviors/os/wmi/query::wmi-recon-query-sweep
      - id: objectives/discovery/host/fingerprint::wmi-host-fingerprint-suite
