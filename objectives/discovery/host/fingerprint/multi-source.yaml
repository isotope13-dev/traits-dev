# Multi-source victim profiling — generic detection of binaries that
# fingerprint the host from many distinct sources (network identity,
# running processes, installed software, default User-Agent, OS
# locale, hostname). Any one of these is benign in isolation; the
# concentration in a small binary is the recon signal.
#
# Optimised for .NET P/Invoke scouts (e.g. DAEMON Tools InfoCollector)
# where the Windows API names appear as text rather than as native
# imports, so existing symbol-keyed atoms in
# micro-behaviors/os/network/interface/windows-api.yaml don't fire.
defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

traits:
  - id: getprocesses-text
    desc: System.Diagnostics.Process.GetProcesses token
    crit: component
    conf: 0.85
    attack: "T1057"
    if:
      type: text
      word: GetProcesses

  - id: physical-dns-hostname-token
    desc: PhysicalDnsHostname adapter-info token
    crit: notable
    conf: 0.85
    attack: "T1016"
    if:
      type: text
      word: PhysicalDnsHostname

  - id: physical-netbios-token
    desc: PhysicalNetBIOS adapter-info token
    crit: notable
    conf: 0.85
    attack: "T1016"
    if:
      type: text
      word: PhysicalNetBIOS

composite_rules:
  - id: pinvoke-adapter-mac-recon
    desc: Managed P/Invoke MAC-address adapter recon
    crit: suspicious
    conf: 0.94
    attack: "T1016"
    all:
      - id: micro-behaviors/os/network/interface::get-adapters-info-text
      - id: metadata/binary/framework::dotnet-assembly
    any:
      - id: physical-dns-hostname-token
      - id: physical-netbios-token
      - id: micro-behaviors/os/network/interface::ip-adapter-info-struct-token

  - id: multi-source-victim-fingerprint
    desc: Multi-source host fingerprint of victim
    crit: suspicious
    conf: 0.96
    attack: "T1082"
    needs: 4
    any:
      - id: micro-behaviors/os/network/interface::get-adapters-info-text
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: getprocesses-text
      - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
      - id: micro-behaviors/os/registry/access::windows-uninstall-key-path
      - id: micro-behaviors/os/registry/access::internet-settings-key
      - id: micro-behaviors/communications/http/get::urlmon-user-agent-option
      - id: micro-behaviors/communications/http/get::urlmk-get-session-option
      # Managed scouts often query WMI display/system classes instead of the
      # native adapter APIs covered above. Pairing those queries with a VM
      # vendor marker and an HTTP client is the same multi-source profile.
      - id: micro-behaviors/os/wmi/query::wmi-video-controller-class
      - id: micro-behaviors/os/wmi/query::wmi-computer-system-class
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-microsoft-render
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/binary/installer/family/
      - id: well-known/app/productivity/txtconverter::signed-installer-context

  - id: multi-source-victim-fingerprint-tiny-stub
    desc: Small .NET binary performs multi-source host fingerprinting
    crit: suspicious
    conf: 0.97
    attack: "T1082"
    mbc: "C0015"
    size_max: 65536
    all:
      - id: multi-source-victim-fingerprint
      - id: metadata/binary/framework::dotnet-assembly
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/platform::microsoft-windows
      - id: well-known/app/productivity/txtconverter::signed-installer-context
