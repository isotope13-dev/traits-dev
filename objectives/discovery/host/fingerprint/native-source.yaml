# Native host profiling used by stealers and reconnaissance tools.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1082,T1012

composite_rules:
  - id: native-host-profile
    desc: Native source builds a Windows host profile from system and registry data
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info-source
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: micro-behaviors/os/registry/access::source-host-profile-registry-query
