# Correlated Rust host profiling. Each underlying capability remains neutral;
# this objective identifies the obfuscated combination used to profile a
# victim's location and Windows privilege surface in one source module.
defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1016,T1033,T1082
  mbc: B0046

composite_rules:
  - id: obfuscated-rust-host-profile
    desc: Obfuscated Rust geolocation and privilege profile
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/discovery/host/geo::victim-profiling
      - id: objectives/discovery/host/permissions::windows-privilege-surface-enum
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-strings
    unless:
      - id: well-known/tool/offensive/
      - id: metadata/signed/platform/
