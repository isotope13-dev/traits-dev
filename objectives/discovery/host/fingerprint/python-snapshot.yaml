# Snapshot-shaped Python code: environment enumeration, process command-line
# paths, JSON serialization and a file opened for writing. These observations
# coexist with a module-level call; neither that call's target nor the written
# value is bound by this composite. This warrants investigation, including
# possible sensitive values in the environment and process arguments.
#
# research-probe-6150c1c915 0.1.0 (MAL-2026-18097) ships a .pth hook that
# imports such a module at every interpreter start and also asks the GCP
# metadata server for the instance's service-account identity, writing the
# result into /tmp. A diagnostic hook that only builds an in-memory report
# (no /proc reads, no file write, no metadata request) matches none of these.
defaults:
  platforms: [linux]
  attack: T1082,T1057

composite_rules:
  # The module-level call is not bound to the function containing the survey.
  - id: python-env-process-snapshot-with-module-call
    desc: Env/process snapshot code alongside module call
    crit: suspicious
    conf: 0.9
    for: [python]
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
      - id: micro-behaviors/fs/proc/info/listing::python-proc-enumerate
      - id: micro-behaviors/fs/proc/cmdline::process-var-cmdline
      - id: micro-behaviors/data/serialize/json::json-dumps-call
      - id: micro-behaviors/fs/file/open::write-append-create-mode
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  # An archive-scoped conjunction cannot establish that the .pth imports
  # the survey module. An unrelated startup hook is a concrete near miss.
  - id: wheel-pth-host-cloud-snapshot-code
    desc: Wheel startup hook alongside host/cloud snapshot code
    crit: suspicious
    conf: 0.93
    attack: T1546,T1082,T1057,T1580
    for: [whl, python]
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: python-env-process-snapshot-with-module-call
      - id: objectives/discovery/cloud/metadata::wheel-pth-gcp-service-account-request
