defaults:
  platforms:
  - linux
  - unix
  - windows
  attack: T1082,T1057
  crit: suspicious
composite_rules:
- id: python-env-process-snapshot-with-module-call
  desc: Env/process snapshot code alongside module call
  conf: 0.9
  for:
  - python
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/os/env/enumerate::python-environ-items-loop
  - id: micro-behaviors/fs/proc/info/listing::python-proc-enumerate
  - id: micro-behaviors/fs/proc/cmdline::process-var-cmdline
  - id: micro-behaviors/data/serialize/json::json-dumps-call
  - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
  unless:
  - id: metadata/path/directory::test-directory-component
- id: wheel-pth-host-cloud-snapshot-code
  desc: Wheel startup hook alongside host/cloud snapshot code
  conf: 0.93
  attack: T1546,T1082,T1057,T1580
  for:
  - whl
  - python
  scope: archive
  all:
  - id: micro-behaviors/process/interpreter/python::pth-startup-import
  - id: python-env-process-snapshot-with-module-call
  - id: objectives/discovery/cloud/metadata::wheel-pth-gcp-service-account-request
- id: pypi-placeholder-wheel-shell-host-inventory-census
  desc: Placeholder wheel runs shell commands for host inventory exfil
  crit: hostile
  conf: 0.99
  for:
  - whl
  - python
  - pkginfo
  scope: archive
  all:
  - id: metadata/file/profile/tunnel/setup::trycloudflare-domain
  - id: micro-behaviors/communications/http/request/json::urllib-json-body-host-identity
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: metadata/package/description/presence::pkginfo-placeholder-first-release
