defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: fingerprint-payload-concat
  desc: System discovery with delimited concatenation
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/string/concat/join::hash-delimited-string-concat
  - id: metadata/package/files/included::setup-py-basename
  any:
  - id: objectives/discovery/system
  unless:
  - id: well-known/lib/data/market-data::dartlab-finance-context
