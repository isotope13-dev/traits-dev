# Host profiling APIs embedded in opaque Go Windows binaries.  The individual
# API names are capabilities; the composite requires several independent
# discovery sources and an opaque Go build identity before raising severity.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 262144

composite_rules:
  - id: go-multi-source-host-recon
    desc: Opaque Go PE bundles host, process, account, and registry recon APIs
    crit: suspicious
    conf: 0.95
    attack: T1012,T1016,T1057,T1082,T1087
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
    any:
      - id: micro-behaviors/process/enumerate/snapshot::process32firstw-function-reference
      - id: micro-behaviors/network/interface/query::get-adapters-info-function-reference
      - id: micro-behaviors/os/user/lookup::go-netusergetinfo-routine
      - id: micro-behaviors/os/registry/enumerate::regenumkeyexw-function-reference
      - id: micro-behaviors/os/privilege/token/reference::adjust-token-privileges-function-reference
    needs: 3

  - id: go-opaque-host-recon-loader
    desc: Opaque Go PE combines host reconnaissance with token privilege access
    crit: hostile
    conf: 0.97
    attack: T1012,T1016,T1057,T1082,T1087,T1134.001
    all:
      - id: go-multi-source-host-recon
      - id: micro-behaviors/os/privilege/token/reference::adjust-token-privileges-function-reference
      - id: micro-behaviors/os/api-resolution/manual::go-pe-opaque-build-syscalln-support
