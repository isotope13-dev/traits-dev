# A DOCX can profile the opening Word client without macros or executable
# content: Word requests an attacker-controlled image and exposes its normal
# HTTP client identity to the server. Recipient-specific URL tokens make this
# a beacon rather than an ordinary shared document asset.
defaults:
  platforms: [windows, unix]
  for: [ooxml]

traits:
  - id: ooxml-numeric-image-path-target
    desc: External image target has numeric path token
    crit: suspicious
    conf: 0.93
    attack: T1592.002
    if:
      type: value
      path: office.external_relationships[*].target
      regex: '(?i)^https?://.+/[0-9]{3,10}/.+\.(png|jpe?g|gif)'

  - id: ooxml-hex-image-path-target
    desc: External image target has hexadecimal path token
    crit: suspicious
    conf: 0.93
    attack: T1592.002
    if:
      type: value
      path: office.external_relationships[*].target
      regex: '(?i)^https?://.+/[0-9a-f]{8,}/.+\.(png|jpe?g|gif)'

  - id: ooxml-tokenized-image-query
    desc: External image target has long query token
    crit: suspicious
    conf: 0.93
    attack: T1590.005
    if:
      type: value
      path: office.external_relationships[*].target
      regex: '(?i)^https?://.+/.+[?&][a-z]{2,8}=[A-Za-z0-9._~-]{10,}'

composite_rules:
  - id: ooxml-word-software-profile-beacon
    desc: Word client software profiling image beacon
    crit: hostile
    conf: 0.97
    attack: T1592.002
    all:
      - id: metadata/document/office/external-link::ooxml-external-image
      - id: metadata/document/office/external-link::ooxml-http-external-relationship
      - id: metadata/document/office/external-link::ooxml-word-external-relationship-source
    any:
      - id: ooxml-numeric-image-path-target
      - id: ooxml-hex-image-path-target

  - id: ooxml-word-network-profile-beacon
    desc: Word client network profiling image beacon
    crit: hostile
    conf: 0.97
    attack: T1590.005
    all:
      - id: metadata/document/office/external-link::ooxml-external-image
      - id: metadata/document/office/external-link::ooxml-http-external-relationship
      - id: metadata/document/office/external-link::ooxml-word-external-relationship-source
      - id: ooxml-tokenized-image-query
