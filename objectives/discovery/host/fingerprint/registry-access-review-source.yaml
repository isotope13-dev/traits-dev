defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: source-host-profile-registry-query
    attack: T1012,T1082
    desc: Native registry APIs and host-inventory paths
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/open::source-registry-open-key-api
      - id: micro-behaviors/os/registry/read::source-registry-query-value-api
      - id: micro-behaviors/os/sysinfo/cpu::source-cpu-profile-registry-path
      - id: micro-behaviors/os/registry/software/reference::windows-uninstall-key-path
