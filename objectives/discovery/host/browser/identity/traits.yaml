defaults:
  platforms:
  - unix
  - windows
  for: [scripts, pe, elf, macho]
traits:
- id: chrome-install-registry
  desc: References Chrome installation registration data
  crit: notable
  conf: 0.92
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    substr: StartMenuInternet\Google Chrome
- id: brave-install-registry
  desc: Brave install registry targeting
  crit: notable
  conf: 0.92
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: 'BraveSoftware Brave-Browser|StartMenuInternet\\Brave'
- id: avast-browser-install-registry
  desc: References Avast Secure Browser registration
  crit: notable
  conf: 0.92
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: 'Avast Secure Browser|StartMenuInternet\\Avast Secure Browser'
- id: extensions-hash-path
  desc: Extensions path with hash
  crit: notable
  conf: 0.6
  attack: T1217
  if:
    type: text
    regex: /Extensions/[a-z]{32}
- id: chrome-extensions-path
  desc: Chrome Extensions path
  crit: notable
  conf: 0.6
  attack: T1217
  if:
    type: text
    regex: /Google/Chrome/.{0,50}Extensions
- id: browser-support-extensions
  desc: BrowserSupport Extensions path
  crit: notable
  conf: 0.6
  attack: T1217
  if:
    type: text
    substr: /BrowserSupport/Extensions
- id: brave-binary-basename
  desc: Brave browser binary basename
  crit: notable
  conf: 0.8
  for: [javascript, python, pe]
  if:
    type: path
    basename: true
    substr: brave
composite_rules:
- id: opera-name
  desc: Opera browser name
  crit: component
  conf: 0.4
  attack: T1217
  any:
  - id: metadata/file/string/application-name::opera-name-path
  - id: metadata/file/string/application-name::opera-name-other
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: bookmarks
  desc: Browser bookmarks access
  crit: notable
  conf: 0.8
  attack: T1217
  any:
  - id: micro-behaviors/data/property/access::webextension-bookmarks-member
  downgrade:
    any:
    # Browser-name context may de-emphasize bookmark references.
    - id: browser-own-binary-basename
    - id: micro-behaviors/process/create/shell/hg/
- id: extensions
  desc: Browser extensions directory path reference
  crit: notable
  conf: 0.8
  attack: T1217
  # A bare chrome-extension:// scheme reference (now
  # micro-behaviors/communications/url/scheme::chrome-extension-scheme) is not
  # enumeration — enumeration reads the extensions directory / on-disk paths.
  # These legs are path strings only: endpoint-inventory agents list the
  # directory to spot their own extension, so a path alone is notable. Theft of
  # extension data is claimed by the credential-access and stealer composites,
  # which also require the storage read or upload.
  any:
  - id: extensions-hash-path
  - id: chrome-extensions-path
  - id: browser-support-extensions
  unless:
  - id: well-known/lib/runtime/scripted/electron::electron-known-debug-extension-loader
  - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
  - id: well-known/tool/development/agent/reason-machines::reason-machines-agent-context
  downgrade:
    any:
    - id: metadata/filename/name-form::chromium-basename-word
    - id: metadata/filename/name-form::firefox-basename-token
    - id: brave-binary-basename
- id: browser-settings-hijack
  desc: Browser search engine or homepage hijacking
  crit: suspicious
  conf: 0.85
  attack: T1217
  all:
  - id: micro-behaviors/data/config/browser-preference::search-engine-id
  any:
  - id: safari-settings-write
  - id: browser-settings-write
  downgrade:
    any:
    - id: metadata/filename/name-form::safari-basename-word
    - id: metadata/filename/name-form::firefox-basename-token
  unless:
  - id: well-known/lib/runtime/scripted/electron/
  # The browser engine itself ships every search-engine identifier and the code
  # that writes those preferences; that is the product, not a hijack.
  - id: well-known/lib/runtime/native-platform/mozilla-xul::xul-original-filename
  - id: well-known/app/browser/
- id: multi-browser-profile-targeting
  desc: Browser data files and 3+ browser names co-occur
  crit: notable
  conf: 0.9
  attack: T1555.003
  unless:
  - id: well-known/app/communication/thunderbird::firefox-chrome-migration-utils-module
  - id: well-known/app/communication/thunderbird::firefox-chrome-profile-migrator-module
  all:
  - id: micro-behaviors/fs/path/application/browser::browser-data-files
  # 3+ distinct browser-name keywords (directory ref counts distinct member
  # matches toward needs:).
  needs: 3
  any:
  - id: metadata/file/string/application-name::chrome-browser-name-literal
  - id: metadata/file/string/application-name::firefox-browser-name-literal
  - id: metadata/file/string/application-name::safari-browser-name-literal
  - id: micro-behaviors/os/application/target/browser::brave-name
  - id: opera-name
  - id: metadata/file/string/application-name::microsoft-edge-name
- id: windows-browser-install-locator
  desc: Locates installed Chromium-family browsers
  crit: notable
  conf: 0.95
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  needs: 3
  any:
  - id: chrome-install-registry
  - id: metadata/file/string/application-name::microsoft-edge-name
  - id: brave-install-registry
  - id: avast-browser-install-registry
- id: safari-settings-write
  desc: Safari settings file write
  crit: component
  conf: 0.8
  all:
  - id: micro-behaviors/fs/path/config/app::safari-preferences-plist
  any:
  - id: micro-behaviors/fs/write/file/descriptor::write
  - id: micro-behaviors/fs/watch::fseventstream
- id: browser-settings-write
  desc: Browser settings file write
  crit: component
  conf: 0.8
  all:
  - id: micro-behaviors/fs/path/application/browser::browser-data-files
  any:
  - id: micro-behaviors/fs/write/file/descriptor::write
  - id: micro-behaviors/fs/watch::fseventstream
- id: browser-own-binary-basename
  desc: File basename names a browser
  # Benign-context suppressor: the file IS the browser, so its own reference to
  # bookmark/history stores is expected. `crit: exception` is TAXONOMY's home for
  # this, and every member below is a named notable identity trait as that
  # contract requires.
  crit: exception
  conf: 0.85
  any:
  - id: metadata/filename/name-form::chromium-basename-word
  - id: metadata/filename/name-form::firefox-basename-token
  - id: metadata/filename/name-form::safari-basename-word
  - id: brave-binary-basename
