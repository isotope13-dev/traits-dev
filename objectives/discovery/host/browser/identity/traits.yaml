defaults:
  platforms:
  - unix
  - windows
  for: [scripts, pe, elf, macho]
traits:
- id: chrome-install-registry
  desc: References Chrome installation registration data
  crit: notable
  conf: 0.92
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    substr: StartMenuInternet\Google Chrome
- id: brave-install-registry
  desc: Brave install registry targeting
  crit: notable
  conf: 0.92
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: 'BraveSoftware Brave-Browser|StartMenuInternet\\Brave'
- id: avast-browser-install-registry
  desc: References Avast Secure Browser registration
  crit: notable
  conf: 0.92
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: 'Avast Secure Browser|StartMenuInternet\\Avast Secure Browser'
- id: bookmarks-word
  desc: Browser bookmarks API member reference
  crit: notable
  conf: 0.4
  attack: T1217
  if:
    type: text
    regex: '\b(chrome|browser)\.bookmarks\.[A-Za-z_]'
  downgrade:
    any:
    - id: micro-behaviors/process/create/shell/hg/
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
- id: extensions-hash-path
  desc: Extensions path with hash
  crit: notable
  conf: 0.6
  attack: T1217
  if:
    type: text
    regex: /Extensions/[a-z]{32}
- id: chrome-extensions-path
  desc: Chrome Extensions path
  crit: notable
  conf: 0.6
  attack: T1217
  if:
    type: text
    regex: /Google/Chrome/.{0,50}Extensions
- id: browser-support-extensions
  desc: BrowserSupport Extensions path
  crit: notable
  conf: 0.6
  attack: T1217
  if:
    type: text
    substr: /BrowserSupport/Extensions
- id: opera-stable
  desc: Opera Stable profile data path
  crit: notable
  conf: 0.6
  attack: T1217
  if:
    type: text
    regex: '(?i)Opera[ /\\]+Stable[ /\\]+(History|Cookies|Login Data)'
  unless:
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: firefox-binary-basename
  desc: Firefox browser binary basename
  crit: notable
  conf: 0.85
  for: [javascript, python, pe]
  if:
    type: path
    basename: true
    substr: firefox
- id: msedge-binary-basename
  desc: msedge browser binary basename
  crit: notable
  conf: 0.85
  for: [javascript, python, pe]
  if:
    type: path
    basename: true
    substr: msedge
- id: brave-binary-basename
  desc: Brave browser binary basename
  crit: notable
  conf: 0.8
  for: [javascript, python, pe]
  if:
    type: path
    basename: true
    substr: brave
composite_rules:
- id: opera-name
  desc: Opera browser name
  crit: component
  conf: 0.4
  attack: T1217
  any:
  - id: metadata/file/string/application-name::opera-name-path
  - id: metadata/file/string/application-name::opera-name-other
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: alternate-browser-names
  desc: References at least two alternative browser names
  crit: component
  conf: 0.5
  attack: T1217
  needs: 2
  any:
  - id: metadata/file/string/application-name::brave-name
  - id: metadata/file/string/application-name::yandex-name
- id: chrome-browser-data-reference
  desc: Chrome browser data reference
  crit: notable
  conf: 0.85
  attack: T1217
  all:
  - id: metadata/file/string/application-name::chrome-browser-name-literal
  any:
  - id: micro-behaviors/fs/path/personal::history-file
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/fs/path/password-store::login-data
  downgrade:
    any:
    - id: metadata/file/naming::chromium-basename-word
- id: firefox-history
  desc: Firefox browser data reference
  crit: notable
  conf: 0.85
  attack: T1217
  any:
  - id: micro-behaviors/fs/path/personal::places-sqlite
  - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
  - id: micro-behaviors/fs/path/password-store::logins
  downgrade:
    any:
    - id: firefox-binary-basename
- id: bookmarks
  desc: Browser bookmarks access
  crit: notable
  conf: 0.8
  attack: T1217
  any:
  - id: bookmarks-word
  downgrade:
    any:
    # Browser-name context may de-emphasize bookmark references.
    - id: browser-own-binary-basename
    - id: micro-behaviors/process/create/shell/hg/
- id: local-storage
  desc: Browser local storage access
  crit: notable
  conf: 0.8
  attack: T1217
  any:
  - id: micro-behaviors/fs/path/app-data::local-storage-ref
  - id: micro-behaviors/data/db/leveldb::leveldb-ref
- id: extensions
  desc: Browser extensions access
  crit: suspicious
  conf: 0.8
  attack: T1217
  # A bare chrome-extension:// scheme reference (now
  # micro-behaviors/communications/url/scheme::chrome-extension-scheme) is not
  # enumeration — enumeration reads the extensions directory / on-disk paths.
  any:
  - id: extensions-hash-path
  - id: chrome-extensions-path
  - id: browser-support-extensions
  unless:
  - id: well-known/lib/runtime/scripted/electron::electron-known-debug-extension-loader
  - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
  - id: well-known/tool/development/agent/reason-machines::reason-machines-agent-context
  downgrade:
    any:
    - id: metadata/file/naming::chromium-basename-word
    - id: firefox-binary-basename
    - id: brave-binary-basename
- id: opera
  desc: Opera browser data
  crit: notable
  conf: 0.85
  attack: T1217
  all:
  - id: opera-name
  - id: opera-stable
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: browser-settings-hijack
  desc: Browser search engine or homepage hijacking
  crit: suspicious
  conf: 0.85
  attack: T1217
  all:
  - id: search-engine-id
  any:
  - id: safari-settings-write
  - id: browser-settings-write
  downgrade:
    any:
    - id: metadata/file/naming::safari-basename-word
    - id: firefox-binary-basename
  unless:
  - id: well-known/lib/runtime/scripted/electron/
  # The browser engine itself ships every search-engine identifier and the code
  # that writes those preferences; that is the product, not a hijack.
  - id: well-known/lib/runtime/native-platform/mozilla-xul::xul-original-filename
  - id: well-known/app/browser/
- id: multi-browser-profile-targeting
  desc: Targets profile data for 3+ browsers
  crit: notable
  conf: 0.9
  attack: T1555.003
  unless:
  - id: well-known/app/communication/thunderbird::firefox-chrome-migration-utils-module
  - id: well-known/app/communication/thunderbird::firefox-chrome-profile-migrator-module
  all:
  - id: micro-behaviors/fs/path/application/browser::browser-data-files
  # 3+ distinct browser-name keywords (directory ref counts distinct member
  # matches toward needs:).
  needs: 3
  any:
  - id: metadata/file/string/application-name::chrome-browser-name-literal
  - id: metadata/file/string/application-name::firefox-browser-name-literal
  - id: metadata/file/string/application-name::safari-browser-name-literal
- id: windows-browser-install-locator
  desc: Locates installed Chromium-family browsers
  crit: notable
  conf: 0.95
  attack: T1518
  platforms: [windows]
  for: [pe, dll]
  needs: 3
  any:
  - id: chrome-install-registry
  - id: metadata/file/string/application-name::microsoft-edge-name
  - id: brave-install-registry
  - id: avast-browser-install-registry
- id: safari-settings-write
  desc: Safari settings file write
  crit: component
  conf: 0.8
  all:
  - id: micro-behaviors/fs/path/config/app::safari-preferences-plist
  any:
  - id: micro-behaviors/fs/write/file/descriptor::write
  - id: micro-behaviors/fs/watch::fseventstream
- id: browser-settings-write
  desc: Browser settings file write
  crit: component
  conf: 0.8
  all:
  - id: micro-behaviors/fs/path/application/browser::browser-data-files
  any:
  - id: micro-behaviors/fs/write/file/descriptor::write
  - id: micro-behaviors/fs/watch::fseventstream
- id: search-engine-id
  desc: Browser search engine identifier reference
  crit: notable
  conf: 0.7
  attack: T1217
  needs: 2
  not:
  - substr: web_search
  - substr: WebSearch
  - SearchProviderSearchGuide
  - defaultSearchBase
  - DefaultSearchBase
  unless:
  - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
  - id: well-known/app/utility/macos-cleaners::pearcleaner-bundle-member
  any:
  - id: micro-behaviors/data/config/browser-preference::search-provider-token
  - id: micro-behaviors/data/config/browser-preference::search-engine-token
  - id: micro-behaviors/data/config/browser-preference::default-search-engine-key
  - id: micro-behaviors/data/config/browser-preference::default-search-keyword-key
  - id: micro-behaviors/data/config/browser-preference::search-provider-camel-token
  - id: micro-behaviors/data/config/browser-preference::search-engine-camel-token

# The file's basename names a browser, so browser data paths inside it are the
# product's own storage rather than another program reading it.
- id: browser-own-binary-basename
  desc: File basename names a browser
  # Benign-context suppressor: the file IS the browser, so its own reference to
  # bookmark/history stores is expected. `crit: exception` is TAXONOMY's home for
  # this, and every member below is a named notable identity trait as that
  # contract requires.
  crit: exception
  conf: 0.85
  any:
  - id: metadata/file/naming::chromium-basename-word
  - id: firefox-binary-basename
  - id: metadata/file/naming::safari-basename-word
  - id: brave-binary-basename
