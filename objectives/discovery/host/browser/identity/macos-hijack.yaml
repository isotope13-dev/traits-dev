defaults:
  platforms: [macos]
  for: [macho, objc, swift, shell, applescript]
  attack: T1217
traits:
  - id: chrome-preferences-file
    desc: Chrome Preferences settings file
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: Google/Chrome/.{0,80}/Preferences\b
  - id: safari-webservices-settings
    desc: Safari preferred web services key
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: NSPreferredWebServices
  - id: safari-defaults-read-plist
    desc: Safari defaults plist read
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: defaults read com.apple.safari
  - id: safari-defaults-read-webservices
    desc: Safari global web services read
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: defaults read -g NSPreferredWebServices
  - id: browser-homepage-key
    desc: Browser homepage settings key
    crit: component
    conf: 0.8
    # Bare `HomePage`/`Homepage` used to be alternatives here, which matched
    # the plain English word anywhere — including an 8-byte `movabs` immediate
    # inside a browser's own string compare. Only real preference-key
    # spellings count as a settings key.
    if:
      type: text
      regex: browser\.startup\.homepage|HomepageLocation|kHomePage
  - id: default-search-provider-key
    desc: DefaultSearchProvider browser key
    # A policy key names the settings surface; a hijack requires the settings
    # file plus read/write behavior in macos-browser-settings-hijack below.
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: DefaultSearchProvider(Name|Enabled|SearchURL)
    unless:
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
      - id: metadata/library/electron::macos-framework
  - id: default-search-engine-name
    desc: browser.search.defaultenginename key
    crit: suspicious
    conf: 0.84
    if:
      type: text
      substr: browser.search.defaultenginename
  - id: browser-startup-urls-key
    desc: Browser startup URL settings key
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: StartupURLs|RestoreOnStartupURLs|browser\.startup\.page
    unless:
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
      - id: metadata/library/electron::macos-framework
  - id: sudo-user-defaults-read
    desc: Reads browser settings as user
    crit: suspicious
    conf: 0.84
    if:
      type: text
      regex: sudo\s+-u\s+\S+\s+defaults\s+read
  - id: browser-settings-log
    desc: Browser hijack activity log path
    crit: suspicious
    conf: 0.75
    if:
      type: text
      substr: Desktop/Application.log
composite_rules:
  - id: browser-settings-files
    desc: Browser settings files across major browsers
    crit: suspicious
    conf: 0.88
    needs: 2
    any:
      - id: chrome-preferences-file
      - id: micro-behaviors/fs/path/application/browser::firefox-preferences-file-path
      - id: objectives/discovery/host/browser/identity::safari-plist
      - id: safari-webservices-settings
  # Naming a browser's homepage/search preference keys is what browsers,
  # MDM/policy tooling, profile cleaners and hijackers all do — a web browser
  # necessarily ships its own `browser.startup.homepage`. That makes this an
  # observation about which settings surface is referenced, not an intent
  # signal; `macos-browser-settings-hijack` below adds the settings *files*
  # and the read/write action that turn it into a hijack.
  - id: browser-settings-keys
    desc: Browser homepage and search settings keys
    crit: notable
    conf: 0.88
    needs: 2
    any:
      - id: browser-homepage-key
      - id: default-search-provider-key
      - id: default-search-engine-name
      - id: objectives/discovery/host/browser/identity::search-engine-id
      - id: safari-webservices-settings
      - id: browser-startup-urls-key
    unless:
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
      - id: metadata/library/electron::macos-framework
  - id: macos-browser-settings-hijack
    desc: macOS browser settings hijack indicators
    crit: suspicious
    conf: 0.92
    all:
      - id: browser-settings-files
      - id: browser-settings-keys
    any:
      - id: safari-defaults-read-plist
      - id: safari-defaults-read-webservices
      - id: sudo-user-defaults-read
      - id: browser-settings-log
      - id: objectives/discovery/host/browser/identity::browser-names
