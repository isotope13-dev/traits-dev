defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: browser-version-audit-opera
    desc: Browser version audit marker
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: GetOperaVersion - Begin

  - id: browser-version-audit-msie
    desc: Browser version audit marker
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: GetMSIEVersion - Begin

  - id: browser-app-path-iexplore
    desc: Browser App Paths marker
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: App Paths\IEXPLORE.EXE

  - id: browser-selection-ui-resource
    desc: Browser selection UI resource labels
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: IDS_ONECLICK_CHROME_NAME

composite_rules:
  - id: browser-process-roster
    desc: Multi-browser process target roster
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: micro-behaviors/fs/path/application/executable::chrome-process-name
      - id: micro-behaviors/fs/path/application/executable::browser-apps-iexplore
      - id: micro-behaviors/fs/path/application/executable::browser-apps-opera-brave
    unless:
      - id: browser-selection-ui-resource
      - id: well-known/tool/development/editor/visual-studio/
      - id: objectives/discovery/host/system/
      - id: metadata/signed/unknown::iobit-co.
  - id: browser-process-targeting
    desc: Browser process targeting via snapshot
    crit: notable
    conf: 0.94
    all:
      - id: browser-process-roster
    unless:
      - id: well-known/app/utility/installer::idman-installer
      - id: micro-behaviors/process/enumerate/snapshot/
      - id: browser-version-audit-opera
      - id: browser-version-audit-msie
      - id: browser-app-path-iexplore
      - id: browser-selection-ui-resource
      - id: metadata/package/vendor::bitdefender-ctc-module
  - id: bitdefender-browser-targeting-marker
    desc: Bitdefender browser telemetry marker
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
      - id: metadata/signed/certificate/identity::bitdefender-brand-text
