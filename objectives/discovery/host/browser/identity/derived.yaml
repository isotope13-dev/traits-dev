# Search-provider preference-key vocabulary referenced by `search-engine-id`.
# These were `inline__search-engine-id__any_N` with the placeholder
# description "Derived string condition", which told a triaging engineer
# nothing about which token had actually matched. Each is named and described
# for the spelling it looks for.
---
defaults:
  platforms:
    - unix
    - windows
  crit: component
  conf: 1.0
  for: [scripts, binaries]
traits:
  - id: search-provider-token
    desc: SearchProvider settings token
    if:
      type: text
      exact: SearchProvider
  - id: search-engine-token
    desc: SearchEngine settings token
    if:
      type: text
      word: SearchEngine
    unless:
      - id: well-known/tool/reverse-engineering/dede::generated-file-banner
    not:
      - substr: EnableLUA
      - substr: This file is generated by DeDe
  - id: default-search-engine-key
    desc: Default search engine, provider or URL key
    if:
      type: text
      regex: '[dD]efaultSearch(Engine|Provider|URL)'
  - id: default-search-keyword-key
    desc: Default search keyword or homepage key
    if:
      type: text
      regex: '[dD]efaultSearch(Keyword|Homepage|HomePage)'
  - id: search-provider-camel-token
    desc: searchProvider camelCase settings token
    if:
      type: text
      substr: searchProvider
  - id: search-engine-camel-token
    desc: searchEngine camelCase settings token
    if:
      type: text
      substr: searchEngine
