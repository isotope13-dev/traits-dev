defaults:
  platforms: [windows]
  for: [pe]
  attack: T1518

traits:
  - id: niche-browser-amigo
    desc: amigo.exe niche browser target
    crit: notable
    conf: 0.95
    if:
      type: text
      word: amigo.exe

  - id: niche-browser-amaya
    desc: amaya.exe niche browser target
    crit: notable
    conf: 0.95
    if:
      type: text
      word: amaya.exe

  - id: niche-browser-arora
    desc: arora.exe niche browser target
    crit: notable
    conf: 0.95
    if:
      type: text
      word: arora.exe

  - id: niche-browser-xchrome
    desc: xchrome.exe niche browser target
    crit: notable
    conf: 0.95
    if:
      type: text
      word: xchrome.exe

  - id: macos-launchservices-default-browser
    desc: LaunchServices default browser query
    crit: notable
    conf: 0.88
    platforms: [macos]
    for: [shell, applescript, macho]
    if:
      type: text
      substr: com.apple.launchservices.secure.plist

composite_rules:
  - id: niche-russian-banker-browser-roster
    desc: Niche Russian banker browser target roster
    crit: suspicious
    conf: 0.95
    needs: 3
    any:
      - id: niche-browser-amigo
      - id: niche-browser-amaya
      - id: niche-browser-arora
      - id: micro-behaviors/fs/path/application/browser::avant-executable-name-reference
      - id: niche-browser-xchrome

  - id: russian-banker-pattern
    desc: Russian banker browser-hijack pattern
    crit: hostile
    conf: 0.93
    all:
      - id: niche-russian-banker-browser-roster
      - id: micro-behaviors/os/registry/keys/browser::default-http-handler-registry-path
      - id: micro-behaviors/fs/delete/file/command::embedded-ping-delete-command
    any:
      - id: micro-behaviors/communications/http/client/wininet::http-send-request
      - id: micro-behaviors/communications/http/client/wininet::internet-connect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
