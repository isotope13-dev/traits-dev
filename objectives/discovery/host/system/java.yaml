defaults:
  crit: hostile
  conf: 0.95
  platforms: [unix, windows]
  for: [java, class, kotlin]
  attack: T1082
composite_rules:
  # Reading system properties + environment + spawning a process is ordinary
  # Java desktop/server behavior (e.g. jadx's DesktopEntryUtils). The
  # discriminator for hostile recon is targeting a credential file, so require
  # the /etc/passwd leg plus at least two generic enumeration capabilities.
  - id: java-extensive-recon
    desc: Java host recon with passwd access
    all:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
    needs: 2
    any:
      - id: micro-behaviors/os/env/read::java-system-getproperty
      - id: micro-behaviors/os/env/read::java-system-getenv
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-source
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
    unless:
      - id: metadata/package/testing/presence/platform_suites::java-test-directory
      - id: metadata/path::test-directory-component
      # Benchmark generators carry labeled /etc/passwd-style payloads as
      # synthetic traffic rows; the passwd text is corpus data, not access.
      - id: micro-behaviors/data/parse/vocabulary::labeled-attack-traffic-corpus
  - id: jvm-bytecode-sensitive-host-recon
    desc: JVM account-file host recon
    for: [class, jar, zip]
    # One class: the account-file paths and the process launch are the same
    # code. Pooled over a plugin archive they are an input-screening class that
    # names /etc/passwd and an unrelated class that runs a helper process.
    scope: leaf
    all:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-bytecode
      - id: micro-behaviors/os/privilege/paths::etc-shadow-path-bytes
    any:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode-reference
      - id: micro-behaviors/process/create/exec::java-runtime-exec-bytecode-reference
    needs: 1
