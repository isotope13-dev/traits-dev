# A browser-to-loopback bridge can hand host profiling requests to a local
# helper installed by a fake application. The hostile inference requires the
# worker, loopback transport, POST marker, and WMI WQL together.
defaults:
  platforms: [windows]
  for: [javascript, typescript, html]
  attack: T1047,T1071.001,T1082

composite_rules:
  - id: browser-wmi-loopback-bridge
    desc: Browser worker sends WMI host profiling to a loopback service
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ipc/message::shared-worker-constructor
      - id: micro-behaviors/communications/http/endpoints::loopback-http-url-reference
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/os/wmi/query::browser-wql-query
