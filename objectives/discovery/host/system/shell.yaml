# Generic shell-based host discovery composites — system info, process,
# and network enumeration via standard Unix tools (whoami, uname, ps,
# printenv, etc.). Not tied to a specific package ecosystem.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1082
composite_rules:
  # A single `uname -a`, `id` or `env` is one ordinary command
  # (MariaDB columnstore's hardwareReport.sh prints `uname -a` for a support
  # bundle); the per-command atoms already report that in micro-behaviors.
  # Require four command observations. Textual evidence can occur in quoted
  # scripts or comments; this finding does not establish command execution.
  - id: broad-host-recon-script
    desc: Contains broad host-reconnaissance command bundle
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/lib/ui/ckeditor/distribution/
      - id: objectives/supply-chain/trojanized/app/debug-probe/
      - id: well-known/app/enterprise/cfengine::cfengine-name-reference
      - id: well-known/app/infrastructure/netdata/
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/hardware::sysctl-hw-model-key
      - id: micro-behaviors/os/sysinfo/config::sw-vers-product-version
      - id: micro-behaviors/network/interface/command::ifconfig
      - id: micro-behaviors/network/status::netstat
      - id: micro-behaviors/process/enumerate/shell::ps-aux
      - id: micro-behaviors/os/sysinfo/hostname/command::hostname-cmd
      - id: micro-behaviors/process/identity/query/command::whoami-cmd
      - id: micro-behaviors/os/env/enumerate::env-cmd-bare
