defaults:
  platforms: [unix]
  for: [python]
  attack: T1082
composite_rules:
  - id: python-extensive-recon
    desc: Python script gathering extensive system and network information
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/enumerate/shell
      - id: micro-behaviors/network/interface::ifconfig-a
      - id: micro-behaviors/fs/path/account-db::etc-passwd-path-literal
    any:
      - id: micro-behaviors/os/sysinfo/platform/host::platform-uname
      - id: micro-behaviors/os/sysinfo/platform/host::os-uname-call
