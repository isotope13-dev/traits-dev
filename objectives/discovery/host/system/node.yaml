defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1082,T1016,T1033,T1059.007

composite_rules:
  - id: node-host-env-mac-profile-with-concealed-eval
    desc: Node stages host, MAC, and env profile near concealed response eval
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/payload/script-eval::concealed-client-eval-response-data
      - id: micro-behaviors/os/env/enumeration::js-process-env-spread
      - id: micro-behaviors/network/interface::node-mac-address-enumeration
      - id: micro-behaviors/os/sysinfo/platform/runtime::node-platform-method-call
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
