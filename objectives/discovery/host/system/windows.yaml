defaults:
  platforms: [windows]
  for: [pe]
  attack: T1082

composite_rules:
  - id: windows-stealer-recon-recognized
    desc: Known recognized Windows system profiling marker
    crit: component
    conf: 0.95
    any:
      - id: metadata/signed/developer::oracle-america
      - id: metadata/signed/developer::roblox-corporation
      - id: metadata/signed/developer::broadcom-inc
      - id: well-known/tool/development/adb::adb-exe-basename
      - id: well-known/app/media/imagemagick::magick-native-dll-basename
      - id: metadata/binary/vendor::microsoft-corp-marker
      - id: metadata/signed/developer::bitdefender-srl
      - id: metadata/signed/developer::iobit-co.
      - id: metadata/signed/developer::win.rar-gmbh
      - id: metadata/signed/developer::valve-corp.
      - id: metadata/binary/installer/family::known-benign-installer
      - id: metadata/binary/installer/script::nsis

  - id: opaque-overlay-user-input-profiling
    desc: Opaque PE payload probes the user and keyboard state
    crit: hostile
    conf: 0.98
    attack: T1027,T1033
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/section/metrics::random-rwx-cavity-section
      - id: metadata/binary/metrics/structural::malformed-pe-structure
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/

  - id: windows-stealer-recon
    for: [source]
    desc: Victim system profiling cluster (stealer)
    crit: suspicious
    conf: 0.90
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-version-ex
      - id: micro-behaviors/os/sysinfo/hardware::get-memory-status
      - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name

  # Every leg here is an ordinary Win32 import: the MSVC CRT emits
  # EnumSystemLocales during startup, a downloader asks for free space, a
  # timestamped app asks for the time zone, and a per-user profile directory
  # needs the user name. Four of them are a cluster, not an accusation, so the
  # rule stands down where a publisher has put their name to the binary -- an
  # accountable Authenticode signature that still verifies. Telegram Desktop
  # imports all four and is signed by Telegram FZ-LLC. Stealers shipped
  # unsigned, or with a signature that no longer verifies, still match.
  - id: windows-binary-stealer-recon
    for: [pe, dll]
    desc: Windows binary victim profiling cluster
    crit: suspicious
    conf: 0.94
    needs: 4
    any:
      - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-locales
      - id: micro-behaviors/time/query::get-timezone-information
      - id: objectives/discovery/host/geo::geo-api
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: well-known/app/storage/qbittorrent/
      - id: well-known/app/utility/siw::siw-family-identity
