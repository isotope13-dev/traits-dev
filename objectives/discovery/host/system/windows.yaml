defaults:
  platforms: [windows]
  for: [pe]
  attack: T1082

composite_rules:
  - id: opaque-overlay-user-input-profiling
    desc: Opaque PE payload probes the user and keyboard state
    crit: hostile
    conf: 0.98
    attack: T1027,T1033
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/os/user/lookup::get-user-name
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/section/permission::near-zero-entropy-rwx-section
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
