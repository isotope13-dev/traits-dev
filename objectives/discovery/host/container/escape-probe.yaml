defaults:
  platforms: [unix, linux]
  for: [javascript, typescript, npm, tar]
  attack: T1611,T1082

composite_rules:
  - id: js-container-escape-mount-and-capability-survey
    desc: Surveys container mounts for runtime sockets and checks CAP_SYS_ADMIN
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/cloud::container-escape-mountinfo-probe
      - id: micro-behaviors/fs/path/cloud::proc-status-capeff-sys-admin-check
      - id: micro-behaviors/fs/read/file/content/unspecified::read-node
