# A Python package setup script that probes container init process metadata
# (/proc/1/cmdline, /proc/1/status) alongside host identity queries to identify
# the containerized service workload.
defaults:
  platforms: [unix, linux]
  for: [python]
  attack: T1611,T1082

composite_rules:
  - id: python-setup-container-init-recon
    desc: setup.py inspects container init PID 1 metadata and host identity during build
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/fs/proc/info/pid::init-process-metadata-procfs-access
    any:
      - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
      - id: micro-behaviors/os/sysinfo/gpu::nvidia-smi-query-gpu
      - id: micro-behaviors/communications/http/ip-discovery::ip-sb-geoip
