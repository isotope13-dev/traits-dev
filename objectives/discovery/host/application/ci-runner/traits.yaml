# Software that goes looking for a CI runner on the host it lands on.
#
# Relocated from metadata/build/github-actions/ (was `github-runner-targeting`,
# crit: suspicious). metadata/ is for neutral structural facts; "targets the
# Actions runner process" is an intent inference, which TAXONOMY reserves for
# objectives/. The runner's own identity strings now live in
# well-known/tool/sysadmin/github-runner/.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, text, data]
  attack: T1518

composite_rules:
  - id: github-runner-targeting
    desc: Targets GitHub Actions Runner process
    crit: suspicious
    conf: 0.95
    all:
      - id: well-known/tool/sysadmin/github-runner::worker
    any:
      # Four sibling identity traits collapsed into the directory reference the
      # validator asks for; the runner's own strings all live together now.
      - id: well-known/tool/sysadmin/github-runner/
      - id: metadata/build/ci/step::actions-checkout
      - id: metadata/build/ci/step::actions-checkout-yaml
      - id: metadata/build/ci/step::actions-github-script
      - id: metadata/build/ci/permission::contents-write-permission
      - id: metadata/build/ci/step::github-actions-env
      - id: metadata/build/ci/step::github-push-action
      - id: metadata/build/ci/step::github-run-id
      - id: metadata/build/ci/step::github-sha
      - id: metadata/build/ci/secret::github-token-secret
      - id: metadata/build/ci/step::github-workflows
      - id: metadata/build/ci/permission::id-token-write-permission
      - id: metadata/build/ci/step::mutable-main-action-ref
      - id: metadata/build/ci/step::mutable-master-action-ref
      - id: metadata/build/ci/trigger::pull-request-target-trigger
      - id: metadata/build/ci/trigger::scheduled-workflow-trigger
      - id: metadata/build/ci/trigger::workflow-dispatch-trigger
      - id: micro-behaviors/fs/proc/info/path::process-pid-cmdline
      - id: micro-behaviors/fs/proc/info/path::process-pid-maps
