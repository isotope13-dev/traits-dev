# Which code editors are installed on this host.
#
# One probe is a capability check ("do I have `code` on PATH?").  Sweeping the
# whole VS Code fork family in a single pass is reconnaissance: the caller does
# not need any particular editor, it wants the list of editors it can reach.
# Malicious extensions do this before installing a second-stage VSIX into every
# fork they find.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell, python]
  attack: T1518
  mbc: E1010

composite_rules:
  - id: vscode-fork-editor-enumeration
    desc: Enumerates installed VS Code-family editors
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: micro-behaviors/process/enumerate/editor::vscode-cli-path-probe
      - id: micro-behaviors/process/enumerate/editor::vscodium-cli-path-probe
      - id: micro-behaviors/process/enumerate/editor::vscode-fork-cli-path-probe

  - id: vscode-fork-editor-enumeration-obfuscated
    desc: Enumerates obfuscated VS Code-family editor paths
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/enumerate/editor::cli-path-probe-command-builder
      - id: micro-behaviors/process/enumerate/editor::vscode-cursor-cli-identifier
      - id: micro-behaviors/process/enumerate/editor::vscodium-cli-identifier

  - id: vscode-editor-candidate-enumeration-obfuscated
    desc: Enumerates obfuscated editor candidate records
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/enumerate/editor::vscode-cursor-cli-identifier
      - id: micro-behaviors/process/enumerate/editor::vscode-editor-candidate-record

  # A stager that only wants "is VS Code here?" checks one path. Carrying a
  # table of per-editor records that pairs a Windows %LOCALAPPDATA%\Programs
  # install root with a macOS /Applications bundle path — both reassembled
  # from split fragments so neither shows up as a searchable string — is a
  # sweep of the whole fork family across both desktop platforms.
  - id: vscode-fork-install-path-enumeration
    desc: Enumerates editor install paths on both platforms
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/enumerate/editor::vscode-editor-candidate-record
      - id: micro-behaviors/data/string/concat::fragmented-localappdata-path
      - id: micro-behaviors/data/string/concat::fragmented-macos-app-bundle-path
