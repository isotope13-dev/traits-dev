# A source-local probe, not proof of credential or host-profile exfiltration.
# No disclosure text suppresses the independent hostile exfiltration rules.
defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-threaded-oast-get-at-load
    desc: Module scope starts bound OAST GET thread
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: ruby
      query: |
        (program (begin
        (assignment left: (identifier) @uri_var
          right: (call !receiver method: (constant) @constructor
            arguments: (argument_list . (string . (string_content)) @endpoint .)))
        .
        (call receiver: (_) @thread method: (identifier) @spawn !arguments
          block: (do_block !parameters body: (body_statement .
            (call receiver: (scope_resolution) @client method: (identifier) @get
              arguments: (argument_list . (identifier) @uri_arg .)) .)))
        )
        (#eq? @constructor "URI")
        (#match? @thread "^(::)?Thread$")
        (#match? @spawn "^(new|start)$")
        (#eq? @client "Net::HTTP")
        (#eq? @get "get")
        (#eq? @uri_var @uri_arg)
        (#match? @endpoint "^[\"']https?://[A-Za-z0-9-]+\\.oastify\\.com([/:?]|#[^{]|[\"']$)"))
        (program
        (assignment left: (identifier) @uri_var
          right: (call !receiver method: (constant) @constructor
            arguments: (argument_list . (string . (string_content)) @endpoint .)))
        .
        (call receiver: (_) @thread method: (identifier) @spawn !arguments
          block: (do_block !parameters body: (body_statement .
            (call receiver: (scope_resolution) @client method: (identifier) @get
              arguments: (argument_list . (identifier) @uri_arg .)) .)))
        (#eq? @constructor "URI")
        (#match? @thread "^(::)?Thread$")
        (#match? @spawn "^(new|start)$")
        (#eq? @client "Net::HTTP")
        (#eq? @get "get")
        (#eq? @uri_var @uri_arg)
        (#match? @endpoint "^[\"']https?://[A-Za-z0-9-]+\\.oastify\\.com([/:?]|#[^{]|[\"']$)"))

composite_rules:
  - id: ruby-declared-dependency-confusion-probe
    desc: Declared dependency-confusion callback runs at load
    crit: suspicious
    conf: 0.98
    for: [ruby, gem]
    scope: archive
    all:
      - id: ruby-threaded-oast-get-at-load
      - id: metadata/package/description/disclosure::ruby-dependency-confusion-marker
