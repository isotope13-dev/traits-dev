# Endpoint-agent inventory by install directory.
#
# Reading a process list needs a child process; reading `Program Files` needs
# only readdir, and it works from an unprivileged Node.js process on a machine
# where the agent is installed but idle. PollCat ships 24 vendor directory
# names and refuses to beacon when any of them is present, so a defended host
# never sees the C2 traffic that would have convicted it.
#
# A single vendor name in a file means nothing -- installers, uninstallers,
# support scripts and exclusion lists all carry them. Three or more distinct
# vendors listed together is an inventory, and an inventory paired with a
# directory walk of the software install roots is a security-software survey.
#
# ATT&CK: T1518.001 (Security Software Discovery)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1518.001
  mbc: B0013
  crit: component
  conf: 0.85
traits:
  - id: edr-vendor-dir-literal
    crit: notable
    desc: Quoted CrowdStrike or SentinelOne directory
    if:
      type: text
      regex: '["''](CrowdStrike|SentinelOne|Cylance)["'']'

  - id: av-suite-dir-literal
    crit: notable
    desc: Quoted ESET, Bitdefender or Sophos directory
    if:
      type: text
      regex: '["''](ESET|Bitdefender|Sophos|Kaspersky Lab)["'']'

  - id: network-vendor-dir-literal
    crit: notable
    desc: Quoted Palo Alto, Fortinet or CheckPoint dir
    if:
      type: text
      regex: '["''](Palo Alto Networks|Fortinet|CheckPoint)["'']'

composite_rules:
  - id: security-vendor-directory-list
    desc: Lists three or more security vendor directories
    crit: suspicious
    conf: 0.92
    needs: 3
    any:
      - id: edr-vendor-dir-literal
      - id: av-suite-dir-literal
      - id: network-vendor-dir-literal
      - id: micro-behaviors/os/security/product::quoted-antivirus-vendor-name
    unless:
      - id: well-known/lib/ui/simple-icons::simple-icons-package-context
      - id: well-known/lib/ui/iconify::svg-icon-body-map
      - id: metadata/vendor/string::device-vendor-logo-catalog

  - id: installed-security-product-survey
    desc: Walks install roots for security vendor folders
    crit: suspicious
    conf: 0.94
    all:
      - id: security-vendor-directory-list
      - id: micro-behaviors/fs/path/application/prefix::program-files-string
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call

  - id: node-wmi-antivirus-enumeration
    desc: Queries SecurityCenter2 WMI for antivirus
    crit: suspicious
    conf: 0.94
    near_bytes: 600
    all:
      - id: micro-behaviors/os/wmi/query::query-security-center
      - id: micro-behaviors/os/wmi/query::query-antivirus
      - id: micro-behaviors/process/create/shell/command-string::execSync-call

  - id: node-registry-antivirus-enumeration
    desc: Probes antivirus HKLM\SOFTWARE registry keys
    crit: suspicious
    conf: 0.95
    near_bytes: 800
    all:
      - id: micro-behaviors/os/registry/read::js-reg-query-command
      - id: micro-behaviors/os/registry/read::js-hklm-software-registry-path
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
    needs: 2
    any:
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/product::kaspersky-name
      - id: micro-behaviors/os/security/product::mcafee-name
      - id: micro-behaviors/os/security/product::norton-name
      - id: edr-vendor-dir-literal
      - id: av-suite-dir-literal
