# Endpoint-agent inventory by install directory.
#
# Reading a process list needs a child process; reading `Program Files` needs
# only readdir, and it works from an unprivileged Node.js process on a machine
# where the agent is installed but idle. PollCat ships 24 vendor directory
# names and refuses to beacon when any of them is present, so a defended host
# never sees the C2 traffic that would have convicted it.
#
# A single vendor name in a file means nothing -- installers, uninstallers,
# support scripts and exclusion lists all carry them. Three or more distinct
# vendors listed together is an inventory, and an inventory paired with a
# directory walk of the software install roots is a security-software survey.
#
# ATT&CK: T1518.001 (Security Software Discovery)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1518.001
  mbc: B0013
  crit: component
  conf: 0.85
traits:
  - id: edr-vendor-dir-literal
    desc: Quoted CrowdStrike or SentinelOne directory
    if:
      type: text
      regex: '["''](CrowdStrike|SentinelOne|Cylance)["'']'

  - id: av-suite-dir-literal
    desc: Quoted ESET, Bitdefender or Sophos directory
    if:
      type: text
      regex: '["''](ESET|Bitdefender|Sophos|Kaspersky Lab)["'']'

  - id: network-vendor-dir-literal
    desc: Quoted Palo Alto, Fortinet or CheckPoint dir
    if:
      type: text
      regex: '["''](Palo Alto Networks|Fortinet|CheckPoint)["'']'

  - id: legacy-av-dir-literal
    desc: Quoted McAfee, Symantec or Trend Micro dir
    if:
      type: text
      regex: '["''](McAfee|Symantec|Trend Micro|Avast Software)["'']'

  - id: software-install-root-path
    desc: Builds a Program Files install root path
    crit: notable
    if:
      type: text
      regex: '["'']Program Files( \(x86\))?["'']'

composite_rules:
  - id: security-vendor-directory-list
    desc: Lists three or more security vendor directories
    crit: suspicious
    conf: 0.92
    needs: 3
    any:
      - id: edr-vendor-dir-literal
      - id: av-suite-dir-literal
      - id: network-vendor-dir-literal
      - id: legacy-av-dir-literal

  - id: installed-security-product-survey
    desc: Walks install roots for security vendor folders
    crit: suspicious
    conf: 0.94
    all:
      - id: security-vendor-directory-list
      - id: software-install-root-path
      - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
