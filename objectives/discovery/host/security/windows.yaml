defaults:
  for:
    - pe
    - dll
    - powershell
  platforms:
    - windows
  attack: T1082
traits:
  - id: uac-policy-query
    desc: UAC EnableLUA policy registry query
    crit: notable
    conf: 0.85
    for: [pe, dll, powershell, c, cpp]
    if:
      type: text
      substr: EnableLUA
    unless:
      - id: metadata/library/qt/
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
      - id: well-known/app/utility/rufus::rufus-official-context

  - id: defender-operational-log
    desc: Defender operational event log
    crit: component
    conf: 0.86
    for:
      - powershell
    if:
      type: text
      substr: Microsoft-Windows-Windows Defender/Operational

  - id: defender-eventid-5007
    desc: Defender config-change event ID
    crit: component
    conf: 0.84
    for:
      - powershell
    if:
      type: text
      regex: '(?i)\b(EventID|Id)\s*[=:]\s*5007\b'

  - id: get-winevent-command
    desc: PowerShell Get-WinEvent command
    crit: component
    conf: 0.82
    for:
      - powershell
    if:
      type: text
      regex: '(?i)\bGet-WinEvent\b'

  - id: defender-exclusion-registry-message-parser
    desc: Defender exclusion message parser
    crit: notable
    conf: 0.88
    for:
      - powershell
    if:
      type: text
      regex: 'Exclusions\\\\(Paths|Extensions|Processes)\\\\\[\^\\s\]\+'

  - id: ps-bitlocker-volume-query
    desc: PowerShell BitLocker volume query
    crit: notable
    conf: 0.94
    for:
      - powershell
    if:
      type: symbol
      kind: call
      exact: Get-BitLockerVolume

  - id: ps-firewall-profile-query
    desc: PowerShell firewall profile query
    crit: notable
    conf: 0.94
    for:
      - powershell
    if:
      type: symbol
      kind: call
      exact: Get-NetFirewallProfile

composite_rules:
  - id: defender-exclusion-eventlog-query
    desc: Defender exclusion event-log query
    crit: notable
    conf: 0.9
    for:
      - powershell
    near_lines: 20
    all:
      - id: defender-operational-log
      - id: defender-eventid-5007
      - id: get-winevent-command

  - id: ps-security-posture-query
    desc: PowerShell BitLocker and firewall posture query
    crit: suspicious
    conf: 0.96
    for:
      - powershell
    all:
      - id: ps-bitlocker-volume-query
      - id: ps-firewall-profile-query
