defaults:
  for: [dex, apk]
  platforms: [android]
  mbc: E1518
  attack: T1518.001

traits:
  # Endpoint-security vendors whose Android package names a benign app has no
  # reason to hardcode in bulk. Requiring two or more distinct vendors keeps
  # out single-product support/portal apps (an F-Secure portal knows its own
  # package name). This atomic proves the inventory; composites establish how
  # the app uses it.
  - id: android-security-product-package-list
    desc: Multiple Android security package names
    crit: suspicious
    conf: 0.9
    if:
      type: yara
      source: |
        rule android_security_product_package_list {
          strings:
            $avg      = "com.antivirus" ascii
            $mcafee   = "com.mcafee" ascii
            $alyac    = "com.estsoft.alyac" ascii
            $fsecure  = "com.fsecure" ascii
            $avast    = "com.avast" ascii
            $avira    = "com.avira" ascii
            $bitdef   = "com.bitdefender" ascii
            $kaspersky = "com.kaspersky" ascii
            $eset     = "com.eset" ascii
            $norton   = "com.symantec" ascii
            $trend    = "com.trendmicro" ascii
            $sophos   = "com.sophos" ascii
            $lookout  = "com.lookout" ascii
            $drweb    = "com.drweb" ascii
            $zemana   = "com.zemana" ascii
          condition:
            2 of them
        }
