defaults:
  platforms:
    - windows
  attack: T1518.001
traits:
  - id: antivirusproduct-query
    desc: WMI antivirus enumeration
    crit: suspicious
    conf: 0.93
    for:
      - vbs
    if:
      type: string_literal
      regex: (?i)AntiVirusProduct
composite_rules:
  - id: pe-wmi-av-enumeration
    desc: PE binary enumerates AV via WMI
    crit: suspicious
    conf: 0.95
    for: [pe]
    all:
      - id: micro-behaviors/os/wmi/query::wql-antivirusproduct-query-pe
      - id: micro-behaviors/os/com/invoke::wmi-com-proxy-setup
    any:
      - id: micro-behaviors/os/wmi/query::security-center2-namespace
    unless:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
