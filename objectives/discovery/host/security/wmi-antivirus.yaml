defaults:
  platforms:
    - windows
  attack: T1518.001
traits:
  - id: antivirusproduct-query
    desc: WMI antivirus enumeration
    crit: suspicious
    conf: 0.93
    for:
      - vbs
    if:
      type: string_literal
      regex: (?i)AntiVirusProduct
  - id: wql-antivirusproduct-query-pe
    desc: Embedded WQL AntiVirusProduct query
    crit: notable
    conf: 0.95
    for: [pe]
    if:
      type: text
      regex: 'SELECT\s+\*\s+FROM\s+AntiVirusProduct'
      case_insensitive: true
    # Downgrade removed: this rule was `suspicious` when the block was written, where a
    # downgrade landed on `notable` and meant "known-good software, de-emphasize". The rule
    # is `notable` now, so the same block lands on `baseline` — a claim that nearly every
    # program does this, which is false for a behavior this specific.
  - id: securitycenter2-namespace-pe
    desc: Embedded ROOT\SecurityCenter2 namespace
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: text
      regex: 'ROOT\\SecurityCenter2?'
composite_rules:
  - id: wmi-av-detection
    desc: WMI-based antivirus detection
    crit: notable
    conf: 0.9
    for:
      - powershell
      - batch
    all:
      - id: micro-behaviors/os/wmi/query::query-antivirus
    any:
      - id: micro-behaviors/os/wmi/query::wmi-object-cmdlet
      - id: micro-behaviors/os/wmi/query::cim-instance-cmdlet
      - id: micro-behaviors/os/wmi/query::query-security-center
  - id: pe-wmi-av-enumeration
    desc: PE binary enumerates AV via WMI
    crit: suspicious
    conf: 0.95
    for: [pe]
    all:
      - id: wql-antivirusproduct-query-pe
      - id: micro-behaviors/os/com/invoke::wmi-com-proxy-setup
    any:
      - id: securitycenter2-namespace-pe
    unless:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
