# FlashHole's LPEClient searches the on-disk WMI repository for antivirus
# records instead of using WQL. Require an actual string-search operation;
# the nearby database path establishes the target context, not data flow.
defaults:
  platforms: [windows]
  for: [python, c, cpp, javascript, powershell, batch]
  attack: T1518.001

traits:
  - id: antivirus-class-string-search
    desc: Searches data for WMI antivirus class
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(find|strstr|[Ii]ndex[Oo]f|[Cc]ontains)$'
      arg:
        kind: string
        exact: AntiVirusProduct

composite_rules:
  - id: wmi-object-database-antivirus-search
    desc: WMI database path with antivirus search
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/metadata-store::wmi-repository-objects-data-path
      - id: antivirus-class-string-search
    near_lines: 20
