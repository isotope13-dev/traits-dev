# ASP.NET pages that inspect endpoint-agent installation files.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1518.001
  mbc: B0013

traits:
  - id: aspnet-probes-fireeye-agent-file
    desc: ASP.NET probes the FireEye agent file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)File\.Exists\([\s\S]{0,180}xagt\.exe'

  - id: aspnet-probes-confer-agent-file
    desc: ASP.NET probes the Confer agent file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)File\.Exists\([\s\S]{0,180}confer.{0,16}eula\.txt'

  - id: aspnet-probes-crowdstrike-agent-file
    desc: ASP.NET probes the CrowdStrike agent file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)File\.Exists\([\s\S]{0,180}csfalconservice\.exe'

composite_rules:
  - id: aspnet-security-agent-inventory
    desc: ASP.NET inventories endpoint security agents
    crit: suspicious
    conf: 0.96
    all:
      - id: aspnet-probes-fireeye-agent-file
      - id: aspnet-probes-confer-agent-file
      - id: aspnet-probes-crowdstrike-agent-file
