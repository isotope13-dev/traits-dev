defaults:
  attack: T1518.001
  platforms:
  - windows
composite_rules:
- for:
  - pe
  - dll
  - csharp
  crit: notable
  conf: 0.95
  id: wmi-security-product-enumeration
  desc: WMI SecurityCenter2 and security-product class references
  all:
  - id: micro-behaviors/os/wmi/query::security-center2-namespace
  any:
  - id: micro-behaviors/os/wmi/query::antivirus-product-class
  - id: micro-behaviors/os/wmi/query::firewall-product-class
  - id: micro-behaviors/os/wmi/query::antispyware-product-class
  downgrade:
    any:
    - id: well-known/app/system/crayens/
- for:
  - pe
  - dll
  crit: suspicious
  conf: 0.96
  id: remote-control-implant-security-recon
  desc: Remote control references WMI security-product inventory
  all:
  - id: objectives/discovery/host/security::wmi-security-product-enumeration
  any:
  - id: objectives/command-and-control/backdoor/binary::dotnet-encrypted-remote-control-implant
  - id: objectives/command-and-control/backdoor/dispatch/module::managed-plugin-tasking-backdoor
