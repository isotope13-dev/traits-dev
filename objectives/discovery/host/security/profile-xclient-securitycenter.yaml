defaults:
  platforms: [windows, unix]
  for: [javascript]
  size_min: 200
  size_max: 1000000

composite_rules:
  - id: encoded-xclient-securitycenter-clues
    desc: XClient and security-product reference clues
    crit: suspicious
    conf: 0.995
    all:
      - id: micro-behaviors/fs/path/executable::csrsshost-exe-string
      - id: micro-behaviors/fs/path/executable::encoded-xclient-exe-reference
      - id: objectives/discovery/host/security::encoded-securitycenter-reference
    any:
      - id: well-known/tool/sysadmin/microsoft-powershell::encoded-powershell-exe-reference
      - id: micro-behaviors/hardware/display/camera::encoded-avicap-library-reference
      - id: micro-behaviors/os/event/shutdown::encoded-forced-shutdown-command
      - id: objectives/execution/payload/file-exec/detached::embedded-pe-stealth-dropper
