# Remote LinPEAS / PEASS-ng staging: download the script, host it on a bind-all
# HTTP server, then pull it onto a compromised host under /tmp. Used by post-
# exploit helpers and LLM attack orchestrators; not limited to setup.py hooks.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1105,T1068
  mbc: E1105

traits:
  - id: remote-linpeas-tmp-exec-chain
    desc: Fetches and runs linpeas under /tmp
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)/tmp/linpeas\.sh.{0,80}chmod.{0,40}/tmp/linpeas\.sh|/tmp/linpeas\.sh[''"]'
    downgrade:
      all:
        - id: well-known/tool/offensive/attack-executor::linpeas-runner-function
        - id: micro-behaviors/communications/http/url/github::linpeas-release-url

composite_rules:
  - id: python-linpeas-http-stage-and-exec
    desc: HTTP-stages LinPEAS then runs it remotely
    crit: hostile
    conf: 0.97
    all:
    - id: micro-behaviors/communications/http/url/github::linpeas-release-url
    - id: micro-behaviors/communications/http/server/listener::python-httpserver-bind-all
    - id: objectives/supply-chain/install-hook/build/behavioral/execute::wget-shell-script-to-tmp
    any:
    - id: remote-linpeas-tmp-exec-chain
    - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
    unless:
    - id: well-known/tool/offensive/attack-executor::linpeas-wrapper-source
