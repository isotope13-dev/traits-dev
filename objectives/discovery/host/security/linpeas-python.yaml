# Remote LinPEAS / PEASS-ng staging: download the script, host it on a bind-all
# HTTP server, then pull it onto a compromised host under /tmp. Used by post-
# exploit helpers and LLM attack orchestrators; not limited to setup.py hooks.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1105,T1068
  mbc: E1105

traits:
  - id: peass-linpeas-download-url
    desc: Downloads LinPEAS from PEASS-ng releases
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)peass-ng/PEASS-ng/.{0,40}linpeas\.sh|github\.com/peass-ng/.{0,60}linpeas\.sh'

  - id: python-httpserver-bind-all
    desc: Python HTTP server binds all interfaces
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'TCPServer\s*\(\s*\(\s*["'']0\.0\.0\.0["'']'

  - id: remote-linpeas-tmp-exec-chain
    desc: Fetches and runs linpeas under /tmp
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)/tmp/linpeas\.sh.{0,80}chmod.{0,40}/tmp/linpeas\.sh|/tmp/linpeas\.sh[''"]'

composite_rules:
  - id: python-linpeas-http-stage-and-exec
    desc: HTTP-stages LinPEAS then runs it remotely
    crit: hostile
    conf: 0.97
    all:
      - id: peass-linpeas-download-url
      - id: python-httpserver-bind-all
      - id: objectives/supply-chain/install-hook/build/behavioral::wget-shell-script-to-tmp
    any:
      - id: remote-linpeas-tmp-exec-chain
      - id: micro-behaviors/process/create/subprocess::shell-true
