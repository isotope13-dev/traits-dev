defaults:
  platforms: [windows]
  for: [batch]
  attack: T1518.001

traits:
- id: batch-tasklist-av-name-filter
  desc: Tasklist searches antivirus process names
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: tasklist.{0,50}(Malwarebytes|avast|avg|norton)
    case_insensitive: true

composite_rules:
- id: batch-tasklist-antivirus-inventory
  desc: Tasklist surveys antivirus processes
  crit: notable
  conf: 0.85
  any:
  - id: objectives/discovery/host/security::batch-tasklist-av-name-filter
  - id: objectives/evasion/anti-av/platform/defender::tasklist-av-check-b
  - id: objectives/evasion/anti-av/platform/defender::tasklist-av-imagename-loop
