defaults:
  platforms: [windows]
  for: [pe]
  attack: T1518.001

composite_rules:
  - id: security-process-name-survey
    desc: Security process names with process enumeration
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
    any:
      - id: micro-behaviors/process/info/name::defender-target-name-reference
      - id: micro-behaviors/process/info/name::kaspersky-target-name-reference
      - id: micro-behaviors/process/info/name::mcafee-target-name-reference
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/app/ai/assistant/jan::jan-ai-signed-app
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/tool/development/agent/openai-codex/
