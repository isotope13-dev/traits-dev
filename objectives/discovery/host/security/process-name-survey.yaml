defaults:
  platforms: [windows]
  for: [pe, c]
  attack: T1518.001

composite_rules:
  - id: security-process-name-survey
    desc: Security process names with process enumeration
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      # Surveying one vendor's processes (e.g. checking Defender's health) is
      # routine administration; the multi-vendor atom marks recon-shaped
      # security-product enumeration.
      - id: micro-behaviors/os/security/product::multiple-security-process-name-clues
    downgrade:
      any:
        - id: well-known/app/ai/assistant/jan::jan-ai-signed-app
        - id: well-known/tool/detection/watchmen::watchmen-posture-audit

  - id: python-security-process-survey
    desc: Python enumerates processes against security product names
    crit: suspicious
    conf: 0.94
    for: [python]
    platforms: [windows, unix]
    all:
      - id: micro-behaviors/process/enumerate/psutil::psutil-process-iter-call
      - id: micro-behaviors/os/security/product::multiple-security-process-name-clues

  - id: python-encoded-security-process-survey
    desc: Python decodes base64 security catalog to survey running processes
    crit: suspicious
    conf: 0.96
    for: [python]
    platforms: [windows, unix]
    all:
      - id: python-security-process-survey
      - id: metadata/file/encoding/base64::base64-json-object
      - id: micro-behaviors/data/decode/base64/call::b64decode-call
