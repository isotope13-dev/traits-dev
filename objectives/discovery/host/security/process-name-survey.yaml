defaults:
  platforms: [windows]
  for: [pe]
  attack: T1518.001

composite_rules:
  - id: security-process-name-survey
    desc: Security process names with process enumeration
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      # Surveying one vendor's processes (e.g. checking Defender's health) is
      # routine administration; the multi-vendor atom marks recon-shaped
      # security-product enumeration.
      - id: micro-behaviors/os/security/product::multiple-security-process-name-clues
    downgrade:
      any:
        - id: well-known/app/ai/assistant/jan::jan-ai-signed-app
