# A kernel driver taking an inventory of the filesystem-filter stack.
#
# Walking every registered minifilter and reading each one's name is how a
# driver learns which endpoint-protection products are loaded on the host --
# the kernel-mode equivalent of listing AV services, and the step that precedes
# unloading or detaching them. fltmc.exe and each vendor's own management tools
# do this from user mode; a third-party driver doing it from kernel mode is
# inventorying somebody else's defences, which is why the pairing is scored
# here rather than left as the neutral atoms it is built from.
#
# Scored suspicious, not hostile: backup and filesystem products legitimately
# walk the stack to find their own instances. A verdict wants this next to what
# the driver then does -- mimikatz's mimidrv pairs it with SYSTEM primary-token
# theft, which its own hostile rule already names.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1518.001
  mbc: B0013

composite_rules:
  - id: kernel-minifilter-stack-inventory
    desc: Driver inventories the minifilter stack
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/kernel/callback::minifilter-enumerate-filters
      - id: micro-behaviors/os/kernel/callback::minifilter-filter-information-query
    unless:
      - id: well-known/lib/platform/wine/
