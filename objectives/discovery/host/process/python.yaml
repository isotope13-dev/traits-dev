defaults:
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: wireshark-proc
    desc: Wireshark process name
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      substr: Wireshark
composite_rules:
  - id: tasklist-shell
    desc: Enumerates processes via shell command
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/enumerate/shell::pgrep-cmd
      - id: micro-behaviors/process/enumerate/shell::ps-ef
  - id: guest-or-analysis-process-names
    desc: Process enumeration near guest or analysis names
    near_bytes: 256
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/process/enumerate/psutil::psutil-process-iter-call
      - id: guest-or-analysis-process-name
  - id: guest-or-analysis-process-name
    desc: References a guest or analysis process name
    crit: component
    conf: 0.8
    any:
      - id: wireshark-proc
      - id: micro-behaviors/os/virtualization/hypervisor::python-vbox-process-literal
      - id: charles-proc
      - id: micro-behaviors/process/debug/tool-markers::fiddler
  - id: charles-proc
    desc: Checks for Charles proxy among processes
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/enumerate/psutil::psutil-process-iter-call
      - id: micro-behaviors/process/debug/tool-markers::python-charles-executable-reference
