defaults:
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: wireshark-proc
    desc: Wireshark process name
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      substr: Wireshark
  - id: vbox-proc
    desc: VirtualBox guest process name
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '(?i)^vbox(service|tray|client|control|guest)(\.exe)?$'
composite_rules:
  - id: tasklist-shell
    desc: Enumerates processes via shell command
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/enumerate/shell::pgrep-cmd
      - id: micro-behaviors/process/enumerate/shell::ps-ef
  - id: analysis-tool-names
    desc: Process enumeration near analysis-tool names
    near_bytes: 256
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/process/enumerate/psutil::psutil-process-iter-call
      - id: analysis-tool-name
  - id: analysis-tool-name
    desc: References a known analysis-tool process
    crit: component
    conf: 0.8
    any:
      - id: wireshark-proc
      - id: vbox-proc
      - id: charles-proc
      - id: objectives/anti-analysis/sandbox-detect/tool-references::fiddler
  - id: charles-proc
    desc: Checks for Charles proxy among processes
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/enumerate/psutil::psutil-process-iter-call
      - id: micro-behaviors/process/info/name::charles-process-name
