# Victim-filtering execution guardrail keyed on installed high-value software.
#
# A targeted loader enumerates the running process list and only proceeds when
# the host runs software worth attacking -- developer IDEs, database or SSH
# clients, cryptocurrency wallets -- and often aborts when a consumer/analysis
# app is present. Detected structurally as: process enumeration correlated with
# a cluster of high-value application process names. The class generalizes
# across languages; the atoms live in micro-behaviors and are reused here.
defaults:
  platforms: [windows]
  for: [javascript, typescript, powershell, csharp, python, batch, pe, dll]
  attack: T1057,T1518
  mbc: E1592

composite_rules:
  - id: high-value-software-presence-gate
    desc: Enumerates processes for high-value target applications
    crit: suspicious
    conf: 0.9
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/application/executable::high-value-client-app-targets
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/enumerate/shell::get-process-by-name
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
