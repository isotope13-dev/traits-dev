defaults:
  platforms: [unix, windows, macos]
# Application Reconnaissance (Browsers, Office, Dev Tools)
# ATT&CK: T1057 (Process Discovery)
# MBC: E1592
composite_rules:
  - id: process-app-enumeration
    desc: Enumerates named browser, office, or developer applications in a process list
    crit: notable
    conf: 0.85
    scope: file
    # Do not correlate a generic tasklist call with an unrelated editor name
    # elsewhere in a large JavaScript bundle.
    near_lines: 200
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/structure::vscode-extension-generated-asset
    all:
      - id: micro-behaviors/process/enumerate/shell::tasklist
    any:
      - id: micro-behaviors/fs/path/application/executable::browser-apps
      - id: micro-behaviors/fs/path/application/executable::office-apps
      - id: micro-behaviors/fs/path/application/executable::dev-apps
