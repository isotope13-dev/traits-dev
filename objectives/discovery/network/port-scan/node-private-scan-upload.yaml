defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1046,T1041

traits:
  - id: node-private-scan-address
    desc: Contains a 10.x address-like string
    crit: notable
    attack: none
    if:
      type: text
      regex: '\b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b'
  - id: node-private-scan-socket
    desc: Connects socket to target and port
    crit: notable
    if:
      type: text
      regex: 'new\s+net\.Socket\s*\(\s*\)[\s\S]{0,900}\.connect\s*\(\s*\w+\s*,\s*\w+\s*\)'
  - id: node-scan-results-http-post
    desc: Writes serialized results to HTTP request
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (for_in_statement body: (statement_block
            (for_in_statement body: (statement_block
              (if_statement consequence: (expression_statement
                (call_expression function: (member_expression
                  object: (subscript_expression object: (identifier) @result_added)
                  property: (property_identifier) @push))))))))
          (lexical_declaration (variable_declarator name: (identifier) @out
            value: (call_expression function: (member_expression
              object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments (identifier) @result_sent))))
          (lexical_declaration (variable_declarator name: (identifier) @req
            value: (call_expression function: (member_expression
              object: (identifier) @http property: (property_identifier) @request))))
          (expression_statement (call_expression function: (member_expression
            object: (identifier) @req_used property: (property_identifier) @write)
            arguments: (arguments (identifier) @out_used))))
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @push "push")
          (#eq? @result_added @result_sent)
          (#eq? @http "http")
          (#eq? @request "request")
          (#eq? @write "write")
          (#eq? @req @req_used)
          (#eq? @out @out_used))

composite_rules:
  - id: npm-private-scan-upload
    desc: Install hook uploads private scan results
    crit: hostile
    conf: 0.98
    for: [zip, npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: node-private-scan-address
      - id: node-private-scan-socket
      - id: node-scan-results-http-post
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
