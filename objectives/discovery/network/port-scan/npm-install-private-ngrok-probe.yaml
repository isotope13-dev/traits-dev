defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1046

traits:
  - id: npm-preinstall-private-port-loop
    desc: Probes private address ports on install
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '(?s)target\s*=\s*["'']10\.14\.0\.1["''].{0,180}ports\.forEach.{0,80}new\s+net\.Socket'

  - id: npm-preinstall-open-port-ngrok
    desc: Attempts ngrok callback for open ports
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '(?s)on\(["'']connect["''].{0,80}h\.get\(["'']https://[^"'']+\.ngrok-free\.app/open\?p='

composite_rules:
  - id: npm-private-port-ngrok-probe
    desc: Install probes private ports with ngrok callback
    crit: hostile
    conf: 0.98
    all:
      - id: npm-preinstall-private-port-loop
      - id: npm-preinstall-open-port-ngrok
