defaults:
  platforms: [windows, unix]
  for: [shell, python]
  crit: suspicious
  conf: 0.9
  attack: T1595

traits:
  - id: python-json-load-sys-stdin
    desc: Python parsing JSON from stdin
    if:
      type: text
      regex: json\.load\(sys\.stdin\).{0,80}/object_info

composite_rules:
  - id: comfyui-hostile-scanner
    desc: ComfyUI hostile mass scanner
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/comfyui::object-info-endpoint
      - id: python-json-load-sys-stdin
  - id: comfyui-scanner
    desc: ComfyUI object-info service probe
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/comfyui::service-keyword
      - id: micro-behaviors/communications/http/download/curl::curl-cmd
      - id: micro-behaviors/communications/http/services/comfyui::object-info-endpoint
    near_bytes: 256
