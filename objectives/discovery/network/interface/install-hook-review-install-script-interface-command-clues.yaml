defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-interface-command-clues
    desc: Install-named script references interface commands and child processes
    crit: notable
    conf: 0.92
    scope: leaf
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/network/interface/command::interface-command-string
    any:
      - id: metadata/import/builtin::require-child-process
