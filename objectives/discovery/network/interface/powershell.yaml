defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1016
composite_rules:
  - id: powershell-network-recon
    desc: PowerShell combines network discovery and active probes
    crit: hostile
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/os/network/interface::powershell-get-netipaddress
      - id: micro-behaviors/os/network/dns::resolve-dns-name
      - id: micro-behaviors/communications/icmp/ping::powershell-test-connection
      - id: micro-behaviors/os/network/connections::powershell-nettcpconnection-enumeration
    near_lines: 40
