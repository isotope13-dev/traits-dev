defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1016
composite_rules:
  # Quoting tool names in a prerequisite manifest is not running them: a
  # readiness probe lists what collectors need and Get-Commands each entry.
  # Malware gating recon on availability checks is the accepted residual.
  - id: powershell-readiness-command-manifest
    desc: Readiness probe manifests prerequisite commands
    crit: exception
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/lang::powershell-get-command-probe
      - id: micro-behaviors/process/create/shell/lang::powershell-command-name-manifest
  - id: powershell-network-recon
    desc: Combines PowerShell network inventory with active probes
    crit: hostile
    conf: 0.95
    # Require at least one active probe: interface and TCP-table enumeration
    # alone is common in network configuration and diagnostics utilities.
    needs: 3
    any:
      - id: micro-behaviors/network/interface::powershell-get-netipaddress
      - id: micro-behaviors/os/network/dns::resolve-dns-name
      - id: micro-behaviors/communications/icmp::powershell-test-connection
      - id: micro-behaviors/os/network/connections::powershell-nettcpconnection-enumeration
    near_lines: 40
    unless:
      - id: powershell-readiness-command-manifest
