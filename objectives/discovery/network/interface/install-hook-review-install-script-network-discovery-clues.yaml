defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-network-discovery-clues
    desc: Install-named script queries interfaces and references network configuration
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/network/interface/query::node-network-interfaces-call
    any:
      - id: objectives/discovery/network/interface::install-script-interface-command-clues
      - id: micro-behaviors/fs/path/config/network::install-script-resolver-path-reference
      - id: micro-behaviors/fs/path/config/network::install-script-hosts-path-reference
    needs: 2
