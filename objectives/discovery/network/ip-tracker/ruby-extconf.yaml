# An extconf build recipe containing clues for an IP tracking service.
defaults:
  platforms: [unix, windows]
composite_rules:
  - id: ruby-extconf-ip-tracker-clues
    desc: Ruby extconf with IP tracker clues
    crit: suspicious
    conf: 0.95
    for: [ruby]
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
    any:
      - id: objectives/discovery/network/ip-tracker::iplogger
      - id: objectives/discovery/network/ip-tracker::grabify
      - id: objectives/discovery/network/ip-tracker::blasze
      - id: objectives/discovery/network/ip-tracker::canarytokens
      - id: objectives/discovery/network/ip-tracker::2no-co
      - id: objectives/discovery/network/ip-tracker::yip-su
      - id: objectives/discovery/network/ip-tracker::opentracker
      - id: objectives/discovery/network/ip-tracker::mhzmhz-cloud-analytics
      - id: objectives/discovery/system/fingerprint/network::iplogger-keyword
      - id: objectives/anti-static/obfuscation/string/concat::ruby-concatenated-iplogger
