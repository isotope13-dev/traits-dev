defaults:
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.85
  for: [source, ruby]
traits:
  - id: iplogger
    desc: iplogger.org tracking service
    crit: notable
    if:
      type: text
      regex: \biplogger\.(org|com|net)\b
    unless:
      - type: text
        regex: \biplogger\.(org|com|net)\b
        section: .rsrc
      - id: well-known/lib/data/easylist::filter-list-title-header
      - id: well-known/app/browser-extension/ublock-origin::filter-bundle
      - id: metadata/file/format/markup::adblock-filter-list
  - id: grabify
    desc: grabify.link tracking service
    for: [source, ruby, package.json, javascript, typescript]
    if:
      type: text
      regex: \bgrabify\.(link|org)\b
    unless:
      - type: text
        regex: \bgrabify\.(link|org)\b
        section: .rsrc
    downgrade:
      any:
        - id: metadata/file/format/markup::adblock-header-network-list
        - id: metadata/file/format/markup::compiled-scriptlet-rules
        - id: well-known/app/browser-extension/ublock-origin::lite-scriptlet-bundle
        # Embedded tracker/ESP domain catalogs name grabify as data to block.
        - id: metadata/file/catalog/network::embedded-domain-blocklist-context
  - id: blasze
    desc: blasze.com tracking service
    if:
      type: text
      regex: blasze\.(com|tk)\b
  # Thinkst Canarytokens are a defensive tripwire service. A URL in docs,
  # tests, or a honeytoken planter is a callback endpoint, not an attacker
  # IP-logger the way grabify or iplogger is. Beacon composites supply intent.
  - id: canarytokens
    desc: CanaryTokens callback URL
    crit: notable
    if:
      type: text
      regex: https?://([a-z0-9-]+\.)?canarytokens\.(com|org)\b
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: 2no-co
    desc: 2no.co tracking service
    if:
      type: text
      regex: 2no\.co\b
  - id: yip-su
    desc: yip.su tracking service
    if:
      type: text
      regex: \byip\.su\b
    unless:
      - type: text
        regex: \byip\.su\b
        section: .rsrc
  - id: opentracker
    desc: opentracker.org tracking service
    if:
      type: text
      regex: opentracker\.org\b
  - id: mhzmhz-cloud-analytics
    desc: cloud.mhzmhz.rs analytics tracker
    if:
      type: text
      regex: \banalytics-[0-9a-f-]{36}\.cloud\.mhzmhz\.rs\b

composite_rules:
- id: npm-preinstall-grabify-ip-tracking
  desc: npm preinstall calls Grabify IP tracker
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041,T1590.005
  for: [npm, package.json, tar, zip]
  scope: file
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: objectives/discovery/network/ip-tracker::grabify
