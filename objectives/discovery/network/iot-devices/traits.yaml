defaults:
  crit: suspicious
  attack: T1046
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
traits:
  - id: dlink-scanner-module-symbol
    desc: D-Link scanner module symbols
    conf: 0.9
    if:
      type: text
      substr: dlinkscanner_
  - id: jaws-scanner-module-symbol
    desc: JAWS scanner module symbols
    conf: 0.9
    if:
      type: text
      substr: jaws_scanner_
composite_rules:
  - id: iot-exploit-scanner-module-set
    desc: IoT exploit scanner module set
    conf: 0.96
    any:
      - id: metadata/binary/provenance/build::adb-scanner-source-name
      - id: metadata/binary/symbols/name::gpon-scanner-name-reference
      - id: dlink-scanner-module-symbol
      - id: jaws-scanner-module-symbol
    needs: 2
