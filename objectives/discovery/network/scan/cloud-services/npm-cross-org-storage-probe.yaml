defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1580,T1041

traits:
  - id: cross-org-probe-hook
    desc: Install runs preinstall probe
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '^node[[:space:]]+(\./)?preinstall[.]js[[:space:]]*$'
  - id: cross-org-probe-host
    desc: Targets organization service
    crit: notable
    if:
      type: text
      substr: "hostname: 'staging.uipath.com'"
  - id: cross-org-probe-header
    desc: Sets target organization header
    crit: notable
    if:
      type: text
      substr: "X-UIPATH-OrganizationId"
  - id: cross-org-probe-preview
    desc: Captures response preview
    crit: notable
    if:
      type: text
      substr: "content_preview: body.substring(0, 200)"
  - id: cross-org-probe-web-report
    desc: Reports cross organization result
    crit: notable
    if:
      type: text
      substr: "report('CROSS_ORG_RESULT'"
  - id: cross-org-probe-storage
    desc: Lists targeted cloud storage
    crit: notable
    if:
      type: text
      substr: "aws s3 ls s3://${potentialBucket}"
  - id: cross-org-probe-storage-report
    desc: Reports storage listing
    crit: notable
    if:
      type: text
      substr: "report('S3_CROSS_ORG_ACCESS'"
  - id: cross-org-probe-send
    desc: Sends report over HTTPS
    crit: notable
    if:
      type: text
      substr: "const req = https.request("
  - id: cross-org-probe-run-web
    desc: Starts organization access probe
    crit: notable
    if:
      type: text
      substr: "testCrossOrgAccess();"
  - id: cross-org-probe-run-storage
    desc: Starts storage access probe
    crit: notable
    if:
      type: text
      substr: "testSharedStorage();"

composite_rules:
  - id: cross-org-storage-probe-report
    desc: Probes organization service and storage and reports results
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::preinstall-js-basename
      - id: cross-org-probe-host
      - id: cross-org-probe-header
      - id: cross-org-probe-preview
      - id: cross-org-probe-web-report
      - id: cross-org-probe-storage
      - id: cross-org-probe-storage-report
      - id: cross-org-probe-send
      - id: cross-org-probe-run-web
      - id: cross-org-probe-run-storage
  - id: npm-cross-org-storage-probe-report
    desc: Install probes organization access and reports results
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: cross-org-probe-hook
      - id: cross-org-storage-probe-report
