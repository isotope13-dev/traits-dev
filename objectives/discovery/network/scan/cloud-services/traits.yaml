defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1046
traits:
  - id: commoncrawl-host-source
    desc: Common Crawl host source
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'Common\s*Crawl|commoncrawl|data\.commoncrawl\.org'
  - id: parquet-host-column
    desc: Parquet hostname column
    crit: component
    conf: 0.88
    if:
      type: text
      substr: url_host_name
  - id: cloud-docker-port
    desc: Docker service port literal
    crit: component
    conf: 0.8
    unless:
      - id: well-known/lib/rsyslog-imdocker::imdocker-docker-input-context
    if:
      type: text
      word: "2375"
  - id: cloud-docker-port-alt
    desc: Alternate Docker service port literal
    crit: component
    conf: 0.8
    if:
      type: text
      word: "2376"
  - id: cloud-cluster-port
    desc: Cluster service port literal
    crit: component
    conf: 0.8
    if:
      type: text
      word: "6379"
  - id: cloud-cluster-port-api
    desc: Kubernetes API port literal
    crit: component
    conf: 0.8
    if:
      type: text
      word: "6443"
  - id: cloud-cluster-port-ray
    desc: Ray service port literal
    crit: component
    conf: 0.8
    if:
      type: text
      word: "8265"
composite_rules:
  # A "port pair" must carry BOTH ports of the pair. The earlier form was a
  # single alternation with count_min: 2, so two hits of one number satisfied
  # it -- which any dense numeric data table (Unicode range tables in a
  # minified editor bundle, codec constants) supplies by accident.
  - id: redis-kube-ports
    desc: Redis and Kubernetes API port pair
    crit: component
    conf: 0.78
    all:
      - id: cloud-cluster-port
      - id: cloud-cluster-port-api
  - id: ray-mongo-ports
    desc: Ray and MongoDB port pair
    crit: component
    conf: 0.78
    all:
      - id: cloud-cluster-port-ray
      - id: micro-behaviors/data/db/mongodb::client-port-reference
  - id: cloud-management-port-literal
    desc: Cloud management port literal
    crit: component
    conf: 0.8
    any:
      - id: cloud-docker-port
      - id: cloud-docker-port-alt
      - id: cloud-cluster-port
      - id: cloud-cluster-port-api
      - id: cloud-cluster-port-ray
      - id: micro-behaviors/data/db/mongodb::client-port-reference
  - id: cloud-network-port-call
    desc: Socket connection call (cloud-port context required)
    crit: component
    conf: 0.93
    any:
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-call
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short
  - id: cloud-port-probe-call
    desc: Network call probes a cloud port
    crit: notable
    conf: 0.93
    all:
      - id: cloud-management-port-literal
      - id: cloud-network-port-call
    near_lines: 5
  - id: docker-port-pair
    desc: Docker management port pair
    crit: component
    conf: 0.8
    all:
      - id: micro-behaviors/os/container/runtime::docker-api-port-2375
      - id: micro-behaviors/os/container/runtime::docker-api-port-2376
  - id: cloud-management-port-cluster
    desc: Cloud management service port cluster
    crit: notable
    conf: 0.9
    needs: 2
    unless:
      - id: well-known/app/aui-agent-builder/
      - id: metadata/library/structure::vscode-js-distribution-bundle
    any:
      - id: docker-port-pair
      - id: redis-kube-ports
      - id: ray-mongo-ports
  - id: commoncrawl-parquet-host-source
    desc: Common Crawl parquet host source
    crit: suspicious
    conf: 0.94
    all:
      - id: commoncrawl-host-source
      - id: parquet-host-column
  - id: cloud-range-provider-catalog
    desc: Cloud provider range catalog
    crit: component
    conf: 0.86
    any:
      - id: micro-behaviors/communications/http/services/cloud::repeated-public-cloud-provider-name
      - id: micro-behaviors/communications/http/services/cloud::repeated-google-cloud-provider-name
    needs: 2
  - id: cloud-range-provider-probe
    desc: Probes cloud management ports using provider ranges
    crit: suspicious
    conf: 0.94
    all:
      - id: cloud-range-provider-catalog
      - id: cloud-port-probe-call
  - id: scanner-management-port-probe
    desc: Scanner probes cloud management ports
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/lateral-movement/exploit/scanner::scanner-marker
      - id: cloud-port-probe-call
  - id: exposed-cloud-service-scanner
    desc: Exposed cloud service scanner
    crit: suspicious
    conf: 0.94
    all:
      - id: cloud-management-port-cluster
    any:
      - id: commoncrawl-parquet-host-source
      - id: cloud-range-provider-probe
      - id: scanner-management-port-probe
    unless:
    - id: micro-behaviors/process/interpreter/vm/
    - id: well-known/tool/detection/sast/
    - id: well-known/app/skypilot::skypilot-source-file
    - id: metadata/library/data::pulumi-python-provider-generated
    - id: metadata/library/structure::vscode-extension-generated-asset
    - id: well-known/app/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
