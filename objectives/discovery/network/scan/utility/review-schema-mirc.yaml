# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  for:
  - text
  - mirc
  platforms:
  - windows
traits:
- id: mirc-backdoor-port-scan-variable
  desc: Saved scan targets include backdoor ports
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%portscan[.]ports [0-9.]{7,15} [0-9 ]{0,40}\\b(27374|1243|30100)\\b"
- id: mirc-scan-active-variable
  desc: Saved mIRC active port scan flag
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^%portscan[.]active \\$true\\r?$"
- id: mirc-scan-work-range-variable
  desc: Saved mIRC scanner dotted-address range
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%\\w{0,12}scan[.]work [0-9.]{7,15} - [0-9.]{7,15}\\r?$"
- id: mirc-scan-report-channel-variable
  desc: Saved mIRC scanner reporting channel
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%\\w{0,12}scan[.]chan #[^\\s]{1,80}\\r?$"
- id: mirc-scan-found-count-variable
  desc: Saved mIRC scanner positive result count
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%\\w{0,12}scan[.]found [1-9][0-9]{0,6}\\r?$"
