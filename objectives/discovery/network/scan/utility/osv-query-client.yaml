defaults:
  platforms: [unix, windows]
  for: [javascript, python]
  crit: notable

traits:
  - id: osv-querybatch-client
    desc: Queries OSV dependency vulnerability API
    conf: 0.95
    if:
      type: yara
      source: |
        rule osv_querybatch_client {
          strings:
            $api = "https://api.osv.dev/v1/querybatch" ascii
            $post = /["']POST["']/
            $queries = /\{\s*queries\s*\}/
          condition:
            all of them
        }
