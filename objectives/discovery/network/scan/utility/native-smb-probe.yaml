defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # Reviewed at 0x401980: SMB_COM_TRANSACTION / TRANS_PEEK_NMPIPE with FID
  # zero, then a bytewise STATUS_INSUFF_SERVER_RESOURCES response check.
  # This identifies vulnerability-probing code, not successful exploitation.
  # No service, hostname, filename or family identity is required.
  - id: native-smb1-ms17-010-probe
    desc: SMB1 zero-FID probe and response check
    crit: suspicious
    conf: 0.98
    attack: T1046
    if:
      type: yara
      source: |
        import "pe"
        rule smb1_zero_fid_probe_status_check {
          strings:
            $packet = { FF 53 4D 42 25 [27] 10 00 00 00 00 FF FF FF FF 00 00 00 00 00 00 00 00 00 00 00 00 4A 00 00 00 4A 00 02 00 23 00 00 00 07 00 5C 50 49 50 45 5C 00 }
            $status = { 80 7C 24 ?? 05 75 ?? 80 7C 24 ?? 02 75 ?? 8A 44 24 ?? 84 C0 75 ?? 80 7C 24 ?? C0 75 ?? }
          condition:
            uint16(0) == 0x5a4d and
            pe.imports("WS2_32.dll", 16) and
            for any i in (0..pe.number_of_sections - 1) : (
              pe.sections[i].name == ".data" and
              $packet in (pe.sections[i].raw_data_offset..pe.sections[i].raw_data_offset + pe.sections[i].raw_data_size - 1)
            ) and
            for any i in (0..pe.number_of_sections - 1) : (
              pe.sections[i].name == ".text" and
              $status in (pe.sections[i].raw_data_offset..pe.sections[i].raw_data_offset + pe.sections[i].raw_data_size - 1)
            )
        }
