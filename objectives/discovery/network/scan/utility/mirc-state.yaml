defaults:
  for: [text, mirc]
  platforms: [windows]
composite_rules:
  - id: mirc-active-backdoor-scan-state
    desc: Saved backdoor scan with SubSeven connection
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/config/schema::mirc-backdoor-port-scan-variable
      - id: micro-behaviors/data/config/schema::mirc-scan-active-variable
      - id: micro-behaviors/data/config/schema::mirc-subseven-connection-state
  - id: mirc-bot-range-scan-report-state
    desc: IRC bot scan ranges and reporting channels
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/config/schema::mirc-bot-server-variable
      - id: micro-behaviors/data/config/schema::mirc-authentication-state-variable
      - id: micro-behaviors/data/config/schema::mirc-scan-work-range-variable
      - id: micro-behaviors/data/config/schema::mirc-scan-report-channel-variable
  - id: mirc-authenticated-bot-range-scan-results
    desc: Saved authenticated IRC bot range-scan results
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/config/schema::mirc-bot-server-variable
      - id: micro-behaviors/data/config/schema::mirc-authentication-state-variable
      - id: micro-behaviors/data/config/schema::mirc-scan-work-range-variable
      - id: micro-behaviors/data/config/schema::mirc-scan-found-count-variable
