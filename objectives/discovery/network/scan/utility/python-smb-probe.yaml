# Impacket-based MS17-010 checker: sends TRANS_PEEK_NMPIPE and treats
# STATUS_INSUFF_SERVER_RESOURCES as vulnerable. This identifies
# vulnerability-probing code, not successful exploitation. Mirrors the
# native x86 probe in native-smb-probe.yaml for Python scanners.
defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1046

traits:
  - id: python-smb-send-trans-call
    desc: SMB send_trans call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: send_trans

  - id: python-smb-peek-probe-name
    desc: TRANS_PEEK_NMPIPE probe constant
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: TRANS_PEEK_NMPIPE

  - id: python-smb-insuff-server-status
    desc: STATUS_INSUFF_SERVER_RESOURCES probe check
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '0xC0000205|STATUS_INSUFF_SERVER_RESOURCES'

composite_rules:
  - id: python-smb1-ms17-010-probe
    desc: SMB probe for MS17-010 vulnerability
    crit: suspicious
    conf: 0.95
    all:
      - id: python-smb-send-trans-call
      - id: python-smb-peek-probe-name
      - id: python-smb-insuff-server-status
