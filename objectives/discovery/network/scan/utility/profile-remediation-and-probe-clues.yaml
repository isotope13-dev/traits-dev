defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: vuln-scanner-remediation-probe-clues
  desc: Vulnerability scanner, remediation and probe clues
  crit: notable
  conf: 0.95
  for: [python]
  all:
    - id: metadata/package/documentation/claims::vulnerability-scanner-purpose-phrase
    - id: metadata/lang/source/shape::finding-remediation-field
  needs: 2
  any:
    - id: micro-behaviors/communications/http/services/cloud::cloud-metadata-host-reference
    - id: micro-behaviors/fs/read/stream::php-filter-stream-reference
    - id: objectives/execution/exploit/sql-injection::sql-quoted-numeric-comparison-payload
