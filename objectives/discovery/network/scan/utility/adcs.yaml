defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1595.002
  conf: 0.92
traits:
  - id: certipy-find-vulnerable
    desc: AD CS vulnerability discovery command text
    crit: suspicious
    conf: 0.92
    downgrade:
      all:
        - id: well-known/tool/offensive/adpentest::project-marker
        - id: well-known/tool/offensive/adpentest::active-scope-option
        - id: well-known/tool/offensive/adpentest::dry-run-mode
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: 'certipy\s+find[\s\S]{0,160}-vulnerable|["'']find["''][\s\S]{0,220}["'']-vulnerable["'']'
