defaults:
  for: [scripts, binaries]
  attack: T1046
  platforms:
    - unix
    - windows
traits:
  - id: range-target-flag
    desc: Network range scan target
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(h|host)\s+\d{1,3}(\.\d{1,3}){3}/\d{1,2}\b'
  - id: port-list-flag
    desc: Multiple service ports in a scanner option
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\s?(--?ports?|/p:|/ports?:)\s*[=:]?\s*[0-9]{1,5}([,; -][0-9]{1,5}){1,15}'
  - id: password-file-option
    desc: Scan accepts a password-file option
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)(^|[\s"''/])--?password-file(=|\s+)\S+'
  - id: scan-pwdf-flag
    desc: Scan accepts a pwdf option
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)(^|[\s"''/])--?pwdf(=|\s+)\S+'
  - id: scan-pass-file-flag
    desc: Scan accepts a pass-file option
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)(^|[\s"''/])--?pass-file(=|\s+)\S+'
  - id: masscan-cmd
    desc: masscan network scanner command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \bmasscan\s+[0-9./]+
    not:
      - substr: .TH "MASSCAN"
      - substr: Fast scan of the Internet
      - substr: masscan <ip addresses/ranges>
  - id: masscan-rate
    desc: masscan with rate option
    crit: suspicious
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/offensive/reconprobe/
    conf: 0.85
    if:
      type: text
      regex: masscan\s+.{0,64}--?rate\s+[0-9]+
  - id: masscan-output
    desc: masscan output file pattern
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: masscan\s+.{0,64}-oL\s+
  - id: zgrab-cmd
    desc: zgrab banner grabber command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bzgrab\s+--[A-Za-z]
  - id: zgrab-senders
    desc: zgrab with concurrent senders
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: zgrab\s+.{0,64}--senders\s+[0-9]+
  - id: zgrab-http
    desc: zgrab HTTP probing
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: zgrab\s+.{0,64}--http=
  - id: pnscan-cmd
    desc: pnscan parallel network scanner
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \bpnscan\s+
  - id: pnscan-response
    desc: pnscan response pattern match
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: pnscan\s+.{0,64}-R\s+[0-9a-fA-F ]+
  - id: docker-api-port-scanner
    desc: Docker API port (2375) with scanner keywords
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (scan|masscan|zgrab|nmap).{0,64}2375
  - id: netscan-hidden-mode
    desc: NetScan hidden execution mode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnetscan(\.exe)?\b[^\r\n]{0,160}/hide\b'
  - id: netscan-range-target
    desc: NetScan IPv4 range target
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnetscan(\.exe)?\b[^\r\n]{0,120}/range:[0-9.]{7,15}-[0-9.]{7,15}\b'
  - id: netscan-xml-export
    desc: NetScan result export
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bnetscan(\.exe)?\b[^\r\n]{0,120}/auto:[^ \r\n]{1,100}\.xml\b'
  - id: softperfect-network-scanner-product
    desc: SoftPerfect Network Scanner product path
    crit: suspicious
    conf: 0.94
    for: [scripts, batch, powershell]
    if:
      type: text
      regex: '(?i)SoftPerfect\s+Network\s+Scanner'
composite_rules:
  - id: scan-password-file-flag
    desc: Scanner accepts a password-file option
    crit: component
    conf: 0.9
    any:
      - id: password-file-option
      - id: scan-pwdf-flag
      - id: scan-pass-file-flag

  - id: netscan-hidden-range-export
    desc: Hidden NetScan range scan exported to XML
    crit: suspicious
    conf: 0.94
    all:
      - id: netscan-hidden-mode
      - id: netscan-range-target
      - id: netscan-xml-export
  - id: credentialed-range-port-scan
    desc: Credentialed range port scan
    crit: suspicious
    conf: 0.92
    attack: T1046,T1110
    for: [scripts]
    all:
      - id: range-target-flag
      - id: port-list-flag
      - id: scan-password-file-flag
    near_bytes: 512
  - id: go-recon-portscan-manifest
    desc: Go recon portscan manifest
    crit: suspicious
    conf: 0.9
    for: [go.mod]
    all:
      - id: metadata/import/package::direct-port-scanner-dependency
    any:
      - id: metadata/import/package::direct-host-info-dependency
      - id: metadata/import/package::direct-binary-reader-dependency
    needs: 2
  - id: masscan
    desc: masscan network scanner execution
    crit: suspicious
    conf: 0.9
    any:
      - id: masscan-cmd
      - id: masscan-rate
      - id: masscan-output
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/offensive/reconprobe/
  - id: zgrab
    desc: zgrab banner grabber execution
    crit: suspicious
    conf: 0.9
    any:
      - id: zgrab-cmd
      - id: zgrab-senders
      - id: zgrab-http
  - id: pnscan
    desc: pnscan network scanner execution
    crit: suspicious
    conf: 0.9
    any:
      - id: pnscan-cmd
      - id: pnscan-response
  - id: docker-api-scan
    desc: Docker API exploitation scanning
    crit: hostile
    conf: 0.95
    attack: T1595.001
    all:
      - id: micro-behaviors/os/container/runtime::docker-api-port-reference
      - id: micro-behaviors/communications/http/url/path::http-api-version-path
      - id: zgrab-senders
    any:
      - id: masscan-cmd
      - id: zgrab-cmd
      - id: pnscan-cmd
