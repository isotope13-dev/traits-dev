# Probe construction, not proof of request delivery or successful SSRF.
# Loop variable identity matters: proximity alone would also match a harmless
# public URL converter beside an unrelated localhost health check.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1595.002
traits:
  - id: python-nested-local-url-probes
    desc: Builds nested URLs probing local resources
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((for_statement
          left: (identifier) @iter
          right: [(list (string (string_content) @target))
                  (tuple (string (string_content) @target))]
          body: (block
            (expression_statement
              (assignment
                right: (binary_operator
                  left: (string (string_content) @service)
                  operator: "+"
                  right: (call
                    function: (_) @encoder
                    arguments: (argument_list (identifier) @passed))))))) @match
          (#eq? @iter @passed)
          (#match? @encoder "(^|\\.)quote(_plus)?$")
          (#match? @target "^(https?://(localhost|127\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}|\\[::1\\])(:[0-9]+)?(/|$)|file:///etc/(passwd|shadow)$)")
          (#match? @service "^https?://[^\\s]+[?&][A-Za-z_][A-Za-z0-9_.-]*=$"))
