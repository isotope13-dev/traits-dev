defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
  attack: T1046
traits:
- id: config-endpoint-probe
  desc: Probes /config endpoint via HTTP
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(curl|wget|fetch).{0,80}/config([?#\s"''<>]|$).{0,80}'
    not:
    - regex: '(?i)\s-X\s+(POST|PUT|PATCH|DELETE)\b'
    - regex: '(?i)\s--request[=\s]+(POST|PUT|PATCH|DELETE)\b'
    - regex: '(?i)\s(-d|--data[^ ]*)[=\s]'
- id: env-endpoint-probe
  desc: Probes /env or /vars endpoint via HTTP
  crit: notable
  conf: 0.8
  if:
    type: text
    # Root or actuator /env only: `/api/settings/env` is a file download.
    regex: '(curl|wget|fetch).{0,80}://[\w.-]{1,80}(:\d{1,5})?(/actuator)?/(env|vars)\b'
- id: git-credential-helper-check
  desc: Git credential helper check
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(\$HOME/\.git-credentials)'
composite_rules:
- id: credential-keyword-grep
  desc: Searches output for credential keywords
  crit: notable
  conf: 0.85
  attack: T1552
  any:
  - id: micro-behaviors/fs/search/command::grep-token-or-secret-keyword
  - id: micro-behaviors/fs/search/command::grep-password-or-credential-keyword
  unless:
  - id: git-credential-helper-check
- id: endpoint-credential-recon
  desc: Probes endpoints and searches for credentials
  crit: notable
  conf: 0.9
  attack: T1552
  all:
  - id: credential-keyword-grep
  any:
  - id: micro-behaviors/communications/url/http-path::debug-url-path
  - id: micro-behaviors/communications/http/client/browser-cli::debug-path-client-command
  - id: config-endpoint-probe
