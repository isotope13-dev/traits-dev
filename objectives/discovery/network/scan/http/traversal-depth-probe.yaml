defaults:
  platforms: [unix, windows]
  for: [python, ruby]
  attack: T1595.002

composite_rules:
  - id: iterative-traversal-depth-probe
    desc: Probes HTTP endpoint across multiplied traversal depths
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/traversal::encoded-parent-directory-string-multiplication
    any:
      - id: micro-behaviors/communications/http/client/exchange::http-request-markers-or-response-stream
      - id: micro-behaviors/communications/http/request/client/call::request-python
    unless:
      - id: metadata/path/directory::test-directory-component
