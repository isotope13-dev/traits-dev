# Redirect parameter names and protocol-relative URLs also appear in server
# filters. Require an outbound client call before flagging probe clues.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, go]
  attack: T1595.002

composite_rules:
  - id: open-redirect-parameter-probe
    desc: HTTP client with redirect parameter and destination clues
    crit: suspicious
    conf: 0.85
    scope: file
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      - id: metadata/package/testing/harness/unit::go-test-source-file
    all:
      - id: micro-behaviors/communications/url/query/structure::redirect-parameter-name-catalog
      - id: micro-behaviors/communications/url/scheme::protocol-relative-url-literal
    any:
      - id: micro-behaviors/communications/http/client/exchange::source-http-client-call
      - id: micro-behaviors/communications/http/get::go-http-get-any
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/request/httpx::httpx-client-get
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/get::axios-get-typescript-generic-call
      - id: micro-behaviors/communications/http/get::ruby-net-http-get-call
