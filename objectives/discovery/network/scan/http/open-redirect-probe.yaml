# Open-redirect probing: substitute an external or protocol-relative
# destination into every redirect-like query parameter and observe whether the
# target follows it. A protocol-relative payload survives naive "starts with
# http" filters. Vulnerability scanners ship this, so it is suspicious rather
# than hostile.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, ruby, go]
  attack: T1595.002

composite_rules:
  - id: open-redirect-parameter-probe
    desc: Injects external URLs into redirect parameters
    crit: suspicious
    conf: 0.85
    scope: file
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      - id: metadata/package/testing/harness/unit::go-test-source-file
    all:
      - id: micro-behaviors/communications/url/query/structure::redirect-parameter-name-catalog
      - id: micro-behaviors/communications/url/scheme::protocol-relative-url-literal
