# PHP2Shell screening, SOCRadar 2026-10-22. Version-header inspection plus
# upload-progress/session-cookie inspection establishes precondition probing;
# neither a CVE label nor operator-selected session/filename prefixes is needed.
# This is a source-level co-occurrence detector, not proof of exploit success.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1595.002

composite_rules:
  - id: php-session-upload-precondition-probe
    desc: PHP version and upload-session precondition probing
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/form::php-session-upload-progress-token
      - id: micro-behaviors/communications/http/header/custom::powered-by-response-header-read
      - id: micro-behaviors/communications/http/request/client
    any:
      - id: micro-behaviors/communications/http/cookies::python-response-set-cookie-header-read
      - id: micro-behaviors/communications/http/cookies::javascript-response-set-cookie-header-read
      - id: micro-behaviors/communications/http/cookies::go-response-cookies-read
