defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1595.002

composite_rules:
  - id: env-path-wordlist
    desc: Environment-file paths used as HTTP probe candidates
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/config/environment::env-file-path
      - id: micro-behaviors/communications/http/download/cli::curl-variable-path-segment
    scope: file
    near_bytes: 512

  - id: sensitive-web-path-wordlist
    desc: Sensitive web path wordlist
    crit: suspicious
    conf: 0.94
    any:
      - id: env-path-wordlist
      - id: git-config-http-probing
      - id: database-backup-http-probing

  - id: database-backup-http-probing
    desc: HTTP probing for database backup path
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/config/backup::database-backup-sql-path
      - id: micro-behaviors/communications/http/download/cli::curl-variable-path-segment
    scope: file
    near_bytes: 512

  - id: git-config-http-probing
    desc: HTTP probing for a Git repository config path
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/config/git::git-repository-config-path
      - id: micro-behaviors/communications/http/download/cli::curl-variable-path-segment
    scope: file
    near_bytes: 512

  - id: sensitive-path-http-probing
    desc: Automated probing for sensitive web paths
    crit: hostile
    conf: 0.98
    all:
      - id: sensitive-web-path-wordlist
      - id: micro-behaviors/communications/http/download/cli::curl-variable-path-segment
    scope: file
    near_bytes: 512

  # A crawler that also requests credential files is not a crawler. Real AI
  # crawlers read /robots.txt and never ask for /.env or /.git/config; the
  # GreyNoise "posing as AI crawlers" scanners forge ClaudeBot/GPTBot/… user
  # agents while sweeping exactly those paths. Pairing the forged crawler
  # token with sensitive-path probing is therefore hostile even though neither
  # leg, alone, is.
  - id: ai-crawler-credential-path-harvesting
    desc: Impersonates an AI crawler while probing credential paths
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1595.002
    all:
      - id: micro-behaviors/communications/http/user-agent::ai-crawler-user-agent
      - id: objectives/discovery/network/scan/http::sensitive-web-path-wordlist
    scope: file
    unless:
      - id: well-known/tool/detection/
