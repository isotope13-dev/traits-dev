# A traversal in an HTTP query targeting a system file is an inclusion probe,
# not an ordinary relative URL or a reference to the file on the local host.
# These payloads may also be used by authorized vulnerability scanners.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: suspicious
  conf: 0.96
  attack: T1595.002

traits:
  - id: unix-file-inclusion-query-payload
    desc: Traversal query targets Unix account file
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/detection/security-scanner-identity::agentic-security-package-context
    if:
      type: literal
      regex: '[?&][\w.-]{1,32}=(\.\./){2,}etc/passwd([&#]|$)'

  - id: windows-file-inclusion-query-payload
    desc: Traversal query targets Windows INI file
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/detection/security-scanner-identity::agentic-security-package-context
    if:
      type: literal
      regex: '(?i)[?&][\w.-]{1,32}=(\.\.[/\\]){2,}windows[/\\]win\.ini([&#]|$)'
