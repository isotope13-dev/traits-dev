# FastX 3 build-string version detection and version-matrix classification.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, powershell, yaml]
  attack: T1595.002

traits:
  - id: fastx-version-api-path
    desc: FastX version API path
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: /v3/api/

  - id: build-string-field
    desc: Build string field literal
    crit: component
    conf: 0.88
    if:
      type: text
      substr: '"build"'

  - id: vulnerable-verdict-literal
    desc: Vulnerable verdict literal
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '["'']vulnerable["'']'

  - id: not-vulnerable-verdict-literal
    desc: Not-vulnerable verdict literal
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '["'']not vulnerable["'']'

composite_rules:
  - id: fastx-build-version-probe
    desc: FastX build-string version probe
    crit: notable
    conf: 0.94
    all:
      - id: fastx-version-api-path
      - id: build-string-field

  - id: version-verdict-matrix
    desc: Version scan filters vulnerable verdicts
    crit: notable
    conf: 0.92
    for: [python, javascript, typescript, yaml]
    all:
      - id: vulnerable-verdict-literal
      - id: not-vulnerable-verdict-literal

  - id: nuclei-build-string-matcher
    desc: Scan template matches build string
    crit: notable
    conf: 0.93
    for: [yaml]
    all:
      - id: build-string-field
      - id: metadata/package/documentation/security-testing::nuclei-response-matchers
