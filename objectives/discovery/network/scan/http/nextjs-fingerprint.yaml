defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: nextjs-response-header-marker
    desc: Next.js response header literal
    crit: component
    if:
      type: literal
      exclude_docstrings: true
      regex: '^x-nextjs-(cache|prerender)$'

  - id: nextjs-page-data-marker
    desc: Next.js page data marker
    crit: component
    if:
      type: literal
      exclude_docstrings: true
      regex: '^(__NEXT_DATA__|__next_f)$'

composite_rules:
  - id: nextjs-http-fingerprint-probe
    desc: Probes HTTP responses for Next.js fingerprints
    crit: notable
    conf: 0.96
    attack: T1595
    all:
      - id: nextjs-response-header-marker
      - id: nextjs-page-data-marker
      - id: micro-behaviors/communications/http/client/library::python-session-method-call
