defaults:
  for: [jsp]
  platforms: [windows, unix]
  attack: T1018

traits:
  - id: jsp-local-ip-address-source
    desc: JSP obtains local host IP address
    crit: notable
    if:
      type: text
      regex: '(?s)InetAddress\.getLocalHost\s*\(\s*\)[\s\S]{0,160}\.getHostAddress\s*\('
  - id: jsp-subnet-host-loop
    desc: JSP iterates host numbers in subnet
    crit: notable
    if:
      type: text
      regex: 'for\s*\(\s*int\s+\w+\s*=\s*1\s*;\s*\w+\s*<=?\s*256\s*;'
  - id: jsp-http-server-title-probe
    desc: JSP retrieves HTTP title and server type
    crit: notable
    if:
      type: text
      regex: '(?s)getHTTPConn\s*\(\s*addr\s*\)[\s\S]{0,400}getTitle\s*\([\s\S]{0,200}getServerType\s*\('
  - id: jsp-recon-results-response
    desc: JSP sends discovered hosts to requester
    crit: notable
    if:
      type: text
      regex: '\.println\s*\(\s*addr\s*\+'
  - id: jsp-response-writer-alias
    desc: JSP assigns response writer to alias
    crit: notable
    if:
      type: text
      regex: 'JspWriter\s+\w+\s*=\s*out\s*;'

composite_rules:
  - id: jsp-http-subnet-findings-response
    desc: JSP probes subnet and returns host findings
    crit: hostile
    conf: 0.98
    all:
      - id: jsp-local-ip-address-source
      - id: jsp-subnet-host-loop
      - id: jsp-http-server-title-probe
      - id: jsp-recon-results-response
      - id: jsp-response-writer-alias
