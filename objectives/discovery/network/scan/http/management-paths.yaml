# Automated web reconnaissance commonly walks a compact path set across one
# or many origins. Requiring several PBX or management paths keeps this distinct
# from an application that happens to request one administrative endpoint.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1595.002

traits:
  - id: admin-management-path
    desc: Admin management endpoint path
    crit: component
    conf: 0.82
    if:
      type: string_literal
      case_insensitive: true
      regex: '^/admin(/[^?#\s"'']*)?/?$'

  - id: ucp-management-path
    desc: User control panel endpoint path
    crit: component
    conf: 0.84
    if:
      type: string_literal
      case_insensitive: true
      regex: '^/ucp(/[^?#\s"'']*)?/?$'

  - id: hms-management-path
    desc: HMS application endpoint path
    crit: component
    conf: 0.86
    if:
      type: string_literal
      case_insensitive: true
      regex: '^/[a-z0-9_-]*hms[a-z0-9_-]*(/[^?#\s"'']*)?/?$'

  - id: hotel-management-path
    desc: Hotel application endpoint path
    crit: component
    conf: 0.86
    if:
      type: string_literal
      case_insensitive: true
      regex: '^/[a-z0-9_-]*hotel[a-z0-9_-]*(/[^?#\s"'']*)?/?$'

  - id: pbx-management-path
    desc: PBX application endpoint path
    crit: component
    conf: 0.86
    if:
      type: string_literal
      case_insensitive: true
      regex: '^/[a-z0-9_-]*pbx[a-z0-9_-]*(/[^?#\s"'']*)?/?$'

composite_rules:
  - id: management-endpoint-path-set
    desc: Embeds multiple PBX or management endpoint paths
    crit: notable
    conf: 0.93
    needs: 3
    any:
      - id: admin-management-path
      - id: ucp-management-path
      - id: hms-management-path
      - id: hotel-management-path
      - id: pbx-management-path

  - id: http-management-path-enumeration
    desc: Enumerates PBX or management paths over HTTP
    crit: suspicious
    conf: 0.95
    all:
      - id: management-endpoint-path-set
      - id: micro-behaviors/communications/http/request/client/

  - id: bulk-http-management-path-scan
    desc: Scans a host list for exposed management paths
    crit: suspicious
    conf: 0.97
    all:
      - id: http-management-path-enumeration
      - id: objectives/lateral-movement/exploit/scanner::scan-target-file-option
