defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1046
  crit: suspicious
  conf: 0.9
traits:
- id: python-debug-endpoint-http-probe-debug
  desc: Python HTTP probe for /debug endpoint
  if:
    type: tree-sitter
    kind: call
    regex: (?is)(requests|httpx)\.(get|post)\s*\([^)]{0,180}/debug([?:#'")]|$|/([^m]|m[^p]|mp[^/]))
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::test-directory
  - type: text
    regex: (?i)(localhost|127\.0\.0\.1)
- id: python-debug-endpoint-http-probe-dunder
  desc: Python HTTP probe for /__debug__ endpoint
  if:
    type: tree-sitter
    kind: call
    regex: (?is)(requests|httpx)\.(get|post)\s*\([^)]{0,180}/__debug__([/?:#'")]|$)
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::test-directory
  - type: text
    regex: (?i)(localhost|127\.0\.0\.1)
- id: python-debug-endpoint-http-probe-console
  desc: Python HTTP probe for /console endpoint
  if:
    type: tree-sitter
    kind: call
    regex: (?is)(requests|httpx)\.(get|post)\s*\([^)]{0,180}/console([/?:#'")]|$)
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::test-directory
  - type: text
    regex: (?i)(localhost|127\.0\.0\.1)
composite_rules:
- id: python-debug-endpoint-http-probe
  desc: Python HTTP probe for exposed debug endpoint
  any:
  - id: python-debug-endpoint-http-probe-debug
  - id: python-debug-endpoint-http-probe-dunder
  - id: python-debug-endpoint-http-probe-console
