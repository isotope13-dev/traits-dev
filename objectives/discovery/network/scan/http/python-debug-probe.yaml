# Python HTTP requests aimed at framework debug surfaces (/debug,
# /__debug__, /console) on a remote host: reconnaissance for exposed
# debuggers and consoles. Loopback targets are a developer's own server.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1046

traits:
  - id: python-debug-endpoint-http-probe-debug
    desc: Python HTTP probe for /debug endpoint
    crit: suspicious
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      # `/debug/mp/` is Google Analytics' documented Measurement Protocol
      # validation server, not a framework debug page.
      regex: '(?is)(requests|httpx)\.(get|post)\s*\([^)]{0,180}/debug([?:#''")]|$|/([^m]|m[^p]|mp[^/]))'
    unless:
      - id: metadata/file/naming::test-directory-component
      - id: metadata/package/testing/presence/harness::test-directory
      # Loopback targets are a developer's own server. File-level: the
      # host is usually a variable bound to 127.0.0.1 in another
      # statement (a benchmark harness starting its own server), so a
      # per-call `not:` cannot see it.
      - type: text
        regex: '(?i)(localhost|127\.0\.0\.1)'
  - id: python-debug-endpoint-http-probe-dunder
    desc: Python HTTP probe for /__debug__ endpoint
    crit: suspicious
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)(requests|httpx)\.(get|post)\s*\([^)]{0,180}/__debug__([/?:#''")]|$)'
    unless:
      - id: metadata/file/naming::test-directory-component
      - id: metadata/package/testing/presence/harness::test-directory
      # Loopback targets are a developer's own server. File-level: the
      # host is usually a variable bound to 127.0.0.1 in another
      # statement (a benchmark harness starting its own server), so a
      # per-call `not:` cannot see it.
      - type: text
        regex: '(?i)(localhost|127\.0\.0\.1)'
  - id: python-debug-endpoint-http-probe-console
    desc: Python HTTP probe for /console endpoint
    crit: suspicious
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)(requests|httpx)\.(get|post)\s*\([^)]{0,180}/console([/?:#''")]|$)'
    unless:
      - id: metadata/file/naming::test-directory-component
      - id: metadata/package/testing/presence/harness::test-directory
      # Loopback targets are a developer's own server. File-level: the
      # host is usually a variable bound to 127.0.0.1 in another
      # statement (a benchmark harness starting its own server), so a
      # per-call `not:` cannot see it.
      - type: text
        regex: '(?i)(localhost|127\.0\.0\.1)'
composite_rules:
  - id: python-debug-endpoint-http-probe
    desc: Python HTTP probe for exposed debug endpoint
    crit: suspicious
    conf: 0.9
    any:
      - id: python-debug-endpoint-http-probe-debug
      - id: python-debug-endpoint-http-probe-dunder
      - id: python-debug-endpoint-http-probe-console
