defaults:
  platforms:
  - unix
  for:
  - shell
  attack: T1595
composite_rules:
- id: shell-server-script-upload-probe
  desc: Server-script upload probe with response filtering
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/curl/command::curl-command-call
  - id: micro-behaviors/fs/path/script::web-script-suffix-reference
  - id: micro-behaviors/communications/http/upload/file::curl-upload-response-filter
  any:
  - id: micro-behaviors/data/embedded/script::shell-php-echo-source-prefix
  - id: micro-behaviors/data/embedded/script::shell-jsp-output-source
  - id: micro-behaviors/data/embedded/script::shell-aspx-output-source
  near_lines: 5
