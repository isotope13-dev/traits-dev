defaults:
  platforms: [unix]
  for: [elf]
  mbc: E1016

# A static x86 IoT client that combines procfs connection inspection, raw
# socket/connect syscalls, and watchdog access.  The combination is an
# attack-capable bot profile; each underlying primitive remains neutral.
composite_rules:
  - id: static-x86-procfs-watchdog-bot
    desc: Static x86-64 IoT bot network client with watchdog access
    crit: hostile
    conf: 0.98
    attack: T1016,T1046
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/communications/socket/create::x86-64-socket-syscall
      - id: micro-behaviors/communications/socket/create::x86-64-connect-syscall
    any:
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-plaintext
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-elf-text
      - id: micro-behaviors/fs/path/device/special::dev-misc-watchdog-elf-text
