defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]

# A static MIPS ELF that profiles TCP state and makes direct socket/connect
# syscalls is an IoT bot profile when it also requests an executable stack.
composite_rules:
  - id: static-mips-procfs-bot
    desc: Static MIPS IoT bot with procfs network reconnaissance
    crit: hostile
    conf: 0.98
    attack: T1016,T1046
    all:
      - id: metadata/arch/iot::mips
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/communications/socket/syscall::mips-direct-network-syscalls
      - id: metadata/binary/anomaly/format::elf-executable-stack
