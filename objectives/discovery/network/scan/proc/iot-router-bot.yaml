defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: arm-iot-network-discovery-bot
    desc: ARM bot combines network discovery with procfs inspection
    crit: hostile
    conf: 0.97
    attack: T1046
    mbc: B0030
    all:
      - id: metadata/arch/iot::arm
      - id: micro-behaviors/communications/http/request/ssdp::ssdp-discovery
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
