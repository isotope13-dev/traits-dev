defaults:
  platforms: [linux]
  for: [elf]
  mbc: E1016

# A procfs network scanner with an ARM listener, static uClibc tables, and an
# executable stack is an IoT bot profile rather than a generic connection tool.
composite_rules:
  # Static ARM binaries that inspect both the kernel's live TCP table and
  # other processes are performing host reconnaissance.  An executable stack
  # is an additional hardening/evasion anomaly; the combination is much more
  # specific than any one procfs path and covers stripped Mirai-like variants
  # that do not carry the usual uClibc or listener signatures.
  - id: static-arm-procfs-profiled-bot
    desc: Static ARM IoT bot with procfs network and process reconnaissance
    crit: hostile
    conf: 0.98
    attack: T1016,T1057
    all:
      - id: metadata/arch/iot::arm
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::procfs-process-fd-stat-walk
      - id: metadata/binary/anomaly/format::elf-executable-stack
      - id: objectives/anti-static/obfuscation/payload/elf-struct::executable-stack-raw-header
  - id: static-arm-procfs-iot-bot
    desc: Static ARM IoT bot with procfs socket and process reconnaissance
    crit: hostile
    conf: 0.98
    attack: T1016,T1057
    all:
      - id: metadata/arch/iot::arm
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/fs/proc/info/path::proc-net-unix
      - id: micro-behaviors/fs/proc/info/path::process-pid-stat-template
      - id: micro-behaviors/os/network/status::rp-filter-kernel-path
  - id: static-procfs-multiarch-iot-bot
    desc: IoT procfs bot with multi-arch stages
    crit: hostile
    conf: 0.99
    attack: T1016,T1057,T1105
    mbc: B0030
    all:
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/hardening/missing::stripped-binary
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/os/sysinfo/platform/string::multi-architecture-target-list
