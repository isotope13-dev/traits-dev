defaults:
  platforms: [linux]
  for: [elf]
  mbc: E1016

# A procfs network scanner with an ARM listener, static uClibc tables, and an
# executable stack is an IoT bot profile rather than a generic connection tool.
composite_rules:
  - id: static-arm-procfs-bot-scanner
    desc: Static ARM IoT bot network scanner
    crit: hostile
    conf: 0.97
    attack: T1016,T1071
    all:
      - id: metadata/arch/iot::arm
      - id: well-known/lib/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/communications/socket/syscall::arm-eabi-listen
      - id: micro-behaviors/os/syscall/invoke::svc-read
      - id: metadata/binary/anomaly/format::elf-executable-stack
