defaults:
  platforms: [unix, windows, macos]
  for: [elf]

# Nios II is uncommon in ordinary Linux utilities. When a stripped static
# Nios II ELF also embeds a remote IPv4 address and the procfs/system path set
# used to profile processes and the host, the combined profile is an IoT bot's
# C2 and discovery surface rather than a standalone utility.
composite_rules:
  - id: static-nios2-host-profiled-c2-bot
    desc: Static Nios II profiled-host C2 bot
    crit: hostile
    conf: 0.98
    mbc: B0030
    attack: T1016,T1057,T1082,T1071
    platforms: [linux]
    all:
      - id: metadata/arch/iot::nios2
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: metadata/hardening/missing::stripped-binary
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/fs/proc/info/path::procfs-process-exe-fragment-cluster
      - id: micro-behaviors/fs/proc/system::system-stat
      - id: micro-behaviors/os/sysinfo/cpu::sys-devices
