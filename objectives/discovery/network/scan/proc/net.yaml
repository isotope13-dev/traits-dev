defaults:
  platforms: [unix, windows, macos]
  for: [elf]
# Network Discovery via /proc - Linux
# Patterns for network reconnaissance and enumeration
# ATT&CK: T1016 (System Network Configuration Discovery)
# NOTE: Atomic traits for /proc/net/* are in micro-behaviors/fs/proc/info/
# This file contains objective-level detection (network scanning intent)
composite_rules:
  # Network scanner composite (detects active network enumeration)
  - id: scanner
    desc: Enumerates network connections for scanning
    crit: suspicious
    conf: 0.85
    mbc: "E1016"
    attack: "T1016"
    platforms: [linux]
    any:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::proc-net-udp
      - id: micro-behaviors/fs/proc/info/path::proc-net-raw
    unless:
      # BusyBox netstat reads these procfs tables to report existing sockets;
      # that passive reporting surface is not evidence of active scanning.
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/app/development/kilocode::kilo-code-native-runtime

  # Nios II is uncommon in ordinary Linux utilities.  When a stripped static
  # Nios II ELF also embeds a remote IPv4 address and the procfs/system path
  # set used to profile processes and the host, the combined profile is an
  # IoT bot's C2 and discovery surface rather than a standalone utility.
  - id: static-nios2-host-profiled-c2-bot
    desc: Static Nios II IoT bot with procfs host profiling and pinned C2
    crit: hostile
    conf: 0.98
    mbc: B0030
    attack: T1016,T1057,T1082,T1071
    platforms: [linux]
    all:
      - id: metadata/arch/iot::nios2
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: metadata/hardening/missing::stripped-binary
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/fs/proc/info/path::procfs-process-exe-fragment-cluster
      - id: micro-behaviors/fs/proc/system::system-stat
      - id: micro-behaviors/os/sysinfo/cpu::sys-devices
