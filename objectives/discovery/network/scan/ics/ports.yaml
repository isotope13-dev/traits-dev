# ICS/OT Network Discovery and Protocol Scanning
# Detects scanning for ICS protocol ports and multi-protocol recon.
# Atomic protocol traits live in micro-behaviors/communications/<protocol>/.
# ATT&CK: T1046 (Network Service Discovery)
defaults:
  for: [binaries, scripts]
  platforms: [windows, linux]
  attack: T1046
  crit: notable
  conf: 0.85

traits:
  # --- ICS device type keywords (discovery context) ---
  - id: plc-keyword
    desc: PLC device keyword reference
    crit: component
    conf: 0.75
    if:
      type: text
      word: PLC
    not:
      - substr: powerline
      - substr: GPLC

  - id: scada-keyword
    desc: SCADA system keyword reference
    crit: component
    conf: 0.75
    if:
      type: text
      word: SCADA

  - id: hmi-keyword
    desc: HMI device keyword reference
    crit: component
    conf: 0.7
    if:
      type: text
      word: HMI

  # The per-protocol port atoms in micro-behaviors/communications/* all require
  # a naming keyword beside the number, which a bare target list defeats:
  # `ICS_PORTS = [102, 502, 11740, 44818, 20000, 4840]` carries no label at
  # all. Anchor on the shape instead — a port-named binding holding a list that
  # contains one of the distinctive ICS/OT service ports. The S7, Modbus, and
  # CODESYS values are the service ports used in the CERT Polska report.
  - id: ics-port-list-binding
    desc: Binds a list of ICS service ports
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)port\w*\s*=\s*[\[(][\s\d,]{0,48}\b(102|502|11740|44818|4840|47808|2404)\b[\s,]+\d'

  - id: rtu-keyword
    desc: RTU device keyword reference
    crit: component
    conf: 0.7
    if:
      type: text
      word: RTU
    not:
      - substr: UART
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

composite_rules:
  - id: ics-device-keywords
    desc: ICS device type keyword cluster
    crit: notable
    conf: 0.8
    needs: 2
    unless:
      - id: well-known/tool/detection/sniffnet::sniffnet-network-monitor
    any:
      - id: objectives/discovery/network/scan/ics::hmi-keyword
      - id: objectives/discovery/network/scan/ics::plc-keyword
      - id: objectives/discovery/network/scan/ics::rtu-keyword
      - id: objectives/discovery/network/scan/ics::scada-keyword

  - id: ics-protocol-reference
    desc: Any ICS/OT protocol reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/communications/modbus::protocol-usage
      - id: micro-behaviors/communications/dnp3::protocol-usage
      - id: micro-behaviors/communications/s7::protocol-usage
      - id: micro-behaviors/communications/bacnet::keyword
      - id: micro-behaviors/communications/opcua::keyword
      - id: micro-behaviors/communications/profinet::keyword
      - id: micro-behaviors/communications/ethernet-ip::keyword
      - id: micro-behaviors/communications/ethernet-ip::library
      - id: micro-behaviors/communications/socket/port::codesys-protocol-usage

  - id: multi-ics-protocol-scan
    desc: References multiple ICS protocols
    crit: suspicious
    conf: 0.92
    needs: 3
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/bingo/
    any:
      - id: micro-behaviors/communications/modbus::protocol-usage
      - id: micro-behaviors/communications/dnp3::protocol-usage
      - id: micro-behaviors/communications/s7::protocol-usage
      - id: micro-behaviors/communications/bacnet::keyword
      - id: micro-behaviors/communications/opcua::keyword
      - id: micro-behaviors/communications/profinet::keyword
      - id: micro-behaviors/communications/ethernet-ip::keyword
    all:
      - id: ics-port-scan

  - id: ics-port-scan
    desc: Scanning for ICS protocol ports
    crit: suspicious
    conf: 0.92
    needs: 2
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/bingo/
    any:
      - id: micro-behaviors/communications/modbus::port-502
      - id: micro-behaviors/communications/dnp3::port-20000
      - id: micro-behaviors/communications/s7::port-102
      - id: micro-behaviors/communications/s7::s7-port-102
      - id: micro-behaviors/communications/socket/port::codesys-port-11740

  - id: ics-port-sweep
    desc: Probes hosts for ICS/OT service ports from an embedded port list
    crit: suspicious
    conf: 0.93
    for: [scripts]
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: ics-port-list-binding
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short

  - id: ics-network-recon
    desc: ICS network recon with protocol proof
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/bingo/
    all:
      - id: ics-port-scan
    any:
      - id: micro-behaviors/communications/modbus::protocol-usage
      - id: micro-behaviors/communications/dnp3::protocol-usage
      - id: micro-behaviors/communications/s7::protocol-usage

  # The S7 advisory calls out sequential TCP/102 probing followed by CPU
  # property enumeration. Either action alone is common in engineering and
  # inventory tools; their combination is a useful suspicious recon signal.
  - id: s7-sweep-cpu-enumeration
    desc: Sweeps hosts and queries Siemens CPU properties through Snap7
    crit: suspicious
    conf: 0.96
    for: [scripts, binaries, c, cpp, csharp, go, rust, java]
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: micro-behaviors/communications/s7::snap7-cpu-property-read-call
      - id: ics-port-sweep
    near_lines: 128

  - id: s7-cidr-sweep-cpu-enumeration
    desc: Queries Siemens CPUs during Python CIDR sweep
    crit: suspicious
    conf: 0.97
    for: [python]
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: micro-behaviors/communications/s7::snap7-cpu-property-read-call
      - id: objectives/discovery/network/scan/port::python-cidr-host-connect-sweep
    near_lines: 128
