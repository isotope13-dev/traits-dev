# War-dialing sweep: a program drives a Hayes modem through a dial command and
# classifies the connect outcome of each attempt (busy, timeout, or failed
# connect). Dialing a range of numbers or addresses and recording which ones
# answer is the discovery step. A terminal or dialer may carry the same strings,
# so the composite stays suspicious.
defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  attack: T1046

traits:
  - id: dial-outcome-classifier
    desc: Dial loop classifies connect outcome strings
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'Connect Failed|BUSY|Not Responding|NO CARRIER'

composite_rules:
  - id: war-dial-sweep
    desc: Modem dial command with connect-outcome classification
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/hardware/serial::hayes-modem-dial-command
      - id: objectives/discovery/network/scan/dial::dial-outcome-classifier
