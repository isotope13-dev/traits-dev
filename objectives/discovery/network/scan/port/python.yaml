defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1046

traits:
  - id: python-low-port-range
    desc: Python enumerates a low port range
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bports\s*=\s*range\(\s*(0|1)\s*,\s*[1-9]\d{2,4}\s*\)'

  - id: python-nmap-portscanner-call
    desc: Python invokes the nmap PortScanner API
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: 'cast().PortScanner'

  - id: python-service-port-table
    desc: Common service port table
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bCOMMON_PORTS\s*:\s*dict\s*\[\s*int\s*,\s*tuple\b'

composite_rules:
  - id: python-concurrent-port-range-scan
    desc: Concurrent Python TCP port-range scan
    crit: notable
    conf: 0.96
    all:
      - id: python-low-port-range
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short
      - id: micro-behaviors/process/create/workers::worker-pool

  - id: python-service-port-scan
    desc: Python probes common service ports
    crit: notable
    conf: 0.95
    all:
      - id: python-service-port-table
    any:
      - id: python-nmap-portscanner-call
      - id: micro-behaviors/communications/socket/tcp::asyncio-open-connection-call

  - id: python-cidr-host-connect-sweep
    desc: Python iterates a CIDR and probes hosts with TCP connect attempts
    crit: suspicious
    conf: 0.95
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: micro-behaviors/communications/ip/parse::cidr-host-expansion
      - id: micro-behaviors/communications/ip/parse::ipv4-cidr-slash-24-or-wider
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short
    near_lines: 48

  # Distributed scanners commonly receive their CIDR from a task broker rather
  # than embedding a target range in the worker. Requiring the actual host
  # expansion and per-host connect attempt preserves the scan semantics without
  # depending on a literal address that is absent from broker-driven variants.
  - id: python-dynamic-cidr-host-connect-sweep
    desc: Python expands a runtime-supplied CIDR and probes hosts with TCP connects
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ip/parse::cidr-host-expansion
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short
      - id: micro-behaviors/data/serialize/json::json-loads-call
    near_lines: 56
