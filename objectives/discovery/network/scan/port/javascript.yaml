defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1046
  mbc: E1046

traits:
  - id: node-port-scan-command-handler
    desc: Remote command accepts host-port scan lists
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?s)case\s+["''](portscan|scan)["'']\s*:.{0,240}\b\w+\(\w+\.hosts,\s*\w+\.ports\)'

composite_rules:
  - id: obfuscated-smtp-service-scan
    desc: Obfuscated multi-port SMTP service scanning through a proxy
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/email/probe::smtp-probe-routine
      - id: micro-behaviors/communications/email/probe::smtp-proxy-probe-routine
      - id: micro-behaviors/communications/email/probe::smtp-destination-probe-routine
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::full-obfuscator-io-toolkit
