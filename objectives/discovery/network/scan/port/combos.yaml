defaults:
  attack: T1046
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for: [scripts, binaries]
composite_rules:
- id: generic-scanner
  desc: Generic network scanning tool
  crit: suspicious
  conf: 0.85
  mbc: E1046
  all:
  - id: sym-hostname-resolve
  - id: micro-behaviors/communications/socket/connect/
  needs: 2
  any:
  - id: ip-format
  - id: port-ref
  - id: probe-ref
  - id: target-ref
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
    - id: micro-behaviors/dylib/library/family/
    - id: micro-behaviors/dylib/library/family/
    - id: micro-behaviors/communications/socket/connect/
    - id: micro-behaviors/ui/help/
    - id: metadata/signed/platform::apple
    - id: micro-behaviors/communications/dns/cli::dig
- id: root-scanner
  desc: Root exploitation scanner
  crit: suspicious
  conf: 0.9
  mbc: E1046
  all:
  - id: r00t-leet
  any:
  - id: target-ip-ref
  - id: random-target
- id: random-ip-scanner
  desc: Random IP address scanning
  crit: notable
  conf: 0.8
  all:
  - id: random-target
  any:
  - id: micro-behaviors/communications/socket/connect/
  - id: ip-format
- id: service-port-scan-automation
  desc: Automated service-port probing
  # A library that exposes ordinary reachability scans is not malware merely
  # because it has a common-port table. Keep this as a notable recon signal;
  # the suspicious scanner composite requires stronger target/probe context.
  crit: notable
  conf: 0.85
  mbc: E1046
  all:
  - id: port-ref
  any:
  - id: cidr-range
  - id: micro-behaviors/communications/ip/endpoint::common-service-port
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/harness::test-directory
  # Cloud-security-product SDKs (e.g. CWP) expose port-scan-detection fields
  # (portScan, Port 80) and doc-example CIDRs (1.1.1.0/24) in their API models.
  - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
- id: rpc-service-enum
  desc: Portmapper RPC service enumeration scanner
  crit: suspicious
  conf: 0.9
  mbc: E1046
  for:
  - c
  all:
  - id: micro-behaviors/communications/socket/rpc::portmapper-client-api
  - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
  any:
  - id: micro-behaviors/communications/socket/rpc::portmapper-service-port
  - id: micro-behaviors/communications/socket/rpc::portmapper-headers
- id: rpc-statd-service-enum
  desc: rpc.statd service enumeration scanner
  crit: suspicious
  conf: 0.96
  mbc: E1046
  for:
  - c
  - elf
  all:
  - id: micro-behaviors/communications/socket/rpc::statd-portmapper-enum
  - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
  any:
  - id: micro-behaviors/time/schedule/timeout/bound::alarm-timeout-handler
  - id: micro-behaviors/communications/ip/parse::inet-addr-symbol
traits:
