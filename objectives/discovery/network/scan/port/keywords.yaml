# Umbrella over the plain-language port/network scanning vocabulary.
#
# The phrase matchers themselves now live in metadata/file/string/security
# (scanning-vocabulary.yaml): they read words, not scanning mechanics, and a
# port-scan *blocker* reads exactly like a port scanner to them. This umbrella
# keeps the single reference point the SSH brute-force composites use, at the
# level the evidence actually supports; the port-sweep composites elsewhere in
# this directory supply the behavior that makes scanning an objective.
defaults:
  platforms:
    - unix
    - windows
  for: [python, javascript, powershell, pe, elf]
  attack: T1046
  mbc: E1046

composite_rules:
  - id: scanning-vocabulary
    desc: Port or network scanning vocabulary
    crit: notable
    any:
      - id: metadata/file/string/security::port-network-scanning-phrase
      - id: metadata/file/string/security::scanning-port-target-phrase
