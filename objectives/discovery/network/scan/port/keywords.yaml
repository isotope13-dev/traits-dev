# Plain-language port/network scanning vocabulary — a literal "port scanning",
# "network scanning", or "scanning target/thread" phrase in code, log strings,
# or CLI output. These are terms about scanning, not scanning mechanics; the
# port-sweep composites elsewhere in this directory supply the actual behavior.
#
# Relocated from objectives/lateral-movement/brute-force/ssh (2026-08) along
# with the umbrella that combines them. Nothing in these matchers is SSH or
# credential brute-forcing, so filing them under an SSH brute-force objective
# claimed an intent the regexes never established; the SSH composites that
# still want the signal reference this directory cross-tree.
defaults:
  platforms:
    - unix
    - windows
  for: [python, javascript, powershell, pe, elf]
  attack: T1046
  mbc: E1046

traits:
  - id: port-network-scanning-phrase
    desc: References port or network scanning
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: \b(port|network)[_-]?scanning\b
      case_insensitive: true
    unless:
      - id: metadata/file/format/structured::asn1-module-definition
      - id: metadata/package/manifest/vendor::bitdefender-ecnet-telemetry
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      # RFCs, wiki articles, and saved HTML docs discuss scanning without being scanners.
      - id: metadata/file/profile/identity::static-html-shell
      - id: metadata/file/profile/identity::generated-documentation-page
      # Generated cloud-provider SDKs carry every service's vocabulary in
      # docstrings — AWS Security Hub's NETWORK_SCANNING opt-in feature, for
      # one — without performing any of it.
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
      - id: metadata/lang/compiler/generated::pulumi-language-python-generated
      - id: well-known/tool/offensive/reconprobe/

  - id: scanning-port-target-phrase
    desc: References scanning a port, target, or thread
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: \bscanning[_-]?(port|target|thread)\b
      case_insensitive: true
    unless:
      - id: metadata/file/profile/identity::static-html-shell
      - id: metadata/file/profile/identity::generated-documentation-page
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
      - id: metadata/lang/compiler/generated::pulumi-language-python-generated
      - id: well-known/tool/offensive/reconprobe/

composite_rules:
  - id: scanning-vocabulary
    desc: Port or network scanning vocabulary
    crit: suspicious
    any:
      - id: port-network-scanning-phrase
      - id: scanning-port-target-phrase
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/file/format/structured::asn1-module-definition
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: metadata/file/profile/identity::static-html-shell
      - id: metadata/file/profile/identity::generated-documentation-page
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
      - id: metadata/lang/compiler/generated::pulumi-language-python-generated
      - id: well-known/tool/offensive/reconprobe/
