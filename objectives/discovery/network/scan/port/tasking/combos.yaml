defaults:
  attack: T1046
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
  for: [scripts, binaries]
composite_rules:
  - id: generic-scanner
    for: [python, javascript]
    desc: Generic network scanning tool
    crit: suspicious
    conf: 0.85
    mbc: E1046
    all:
      - id: objectives/discovery/network/scan/port/probe::sym-hostname-resolve
      - id: micro-behaviors/communications/socket/connect/
    needs: 2
    any:
      - id: micro-behaviors/communications/ip/construct::ipv4-decimal-format-string
      - id: metadata/lang/source/naming/resource::port-ref
      - id: metadata/lang/source/naming/resource::probe-ref
      - id: metadata/lang/source/naming/resource::target-ref
  # socket/connect/ was dropped from this downgrade: it is the rule's own
  # required leg, so it pinned every match at notable.
    downgrade:
      any:
        - id: micro-behaviors/ui/help/
        - id: metadata/signed/platform::apple
        - id: micro-behaviors/communications/dns/cli::dig
  - id: random-ip-scanner
    for: [python, javascript]
    desc: Random IP address scanning
    crit: notable
    conf: 0.8
    all:
      - id: objectives/discovery/network/scan/port/probe::random-target
    any:
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/communications/ip/construct::ipv4-decimal-format-string
  - id: service-port-scan-automation
    for: [python, javascript]
    desc: Automated service-port probing
  # A library that exposes ordinary reachability scans is not malware merely
  # because it has a common-port table. Keep this as a notable recon signal;
  # the suspicious scanner composite requires stronger target/probe context.
    crit: notable
    conf: 0.85
    mbc: E1046
    all:
      - id: metadata/lang/source/naming/resource::port-ref
    any:
      - id: objectives/discovery/network/scan/port/probe::cidr-range
      - id: micro-behaviors/communications/ip/endpoint::common-service-port
    unless:
      - id: metadata/file/profile/security-scanner/
      - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: rpc-statd-service-enum
    desc: rpc.statd service enumeration scanner
    crit: suspicious
    conf: 0.96
    mbc: E1046
    for: [c]
    all:
      - id: micro-behaviors/communications/socket/rpc::statd-portmapper-enum
      - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
    any:
      - id: micro-behaviors/time/schedule/timeout::alarm-timeout-handler
      - id: micro-behaviors/communications/ip/parse::inet-addr-symbol
traits: []
