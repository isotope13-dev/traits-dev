defaults:
  platforms: [linux]
  for: [elf]
  attack: T1046
  mbc: E1046

traits:
  - id: objectives/discovery/network/scan/port/tasking::scan-on-command
    desc: Enable-scanning tasking command
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: SCAN_ON
  - id: objectives/discovery/network/scan/port/tasking::scan-off-command
    desc: Disable-scanning tasking command
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: SCAN_OFF
  - id: objectives/discovery/network/scan/port/tasking::scan-hit-report-format
    desc: Successful-scan report format
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'SCAN_HIT:%s'

composite_rules:
  - id: objectives/discovery/network/scan/port/tasking::scan-tasking-report-vocabulary
    desc: Scan enable disable and hit-report tasking vocabulary
    crit: suspicious
    conf: 0.99
    all:
      - id: objectives/discovery/network/scan/port/tasking::scan-on-command
      - id: objectives/discovery/network/scan/port/tasking::scan-off-command
      - id: objectives/discovery/network/scan/port/tasking::scan-hit-report-format

  - id: objectives/discovery/network/scan/port/tasking::c2-controlled-network-scan
    desc: C2-controlled embedded bot performs network scanning
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/network/scan/port/tasking::scan-tasking-report-vocabulary
    any:
      - id: objectives/command-and-control/botnet/polling::compact-arm-bot-control-protocol
      - id: objectives/command-and-control/botnet/polling::compact-mips-bot-control-protocol
    needs: 1
