defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
composite_rules:
  - id: shell-full-range-docker-http-probes
    desc: Numeric host-range loop probes Docker HTTP API
    conf: 0.97
    attack: T1046
    near_bytes: 600
    all:
      - id: micro-behaviors/data/control-flow/loop::shell-large-numeric-sequence-loop
      - id: micro-behaviors/os/container/runtime::curl-variable-host-docker-list
