defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1046

traits:
  - id: objectives/discovery/network/scan/port/probe::python-low-port-range
    desc: Python enumerates a low port range
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bports\s*=\s*range\(\s*(0|1)\s*,\s*[1-9]\d{2,4}\s*\)'

  - id: objectives/discovery/network/scan/port/probe::python-nmap-portscanner-call
    desc: Python invokes the nmap PortScanner API
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: 'cast.PortScanner'

  - id: objectives/discovery/network/scan/port/probe::python-service-port-table
    desc: Common service port table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bCOMMON_PORTS\s*:\s*dict\s*\[\s*int\s*,\s*tuple\b'

composite_rules:
  - id: objectives/discovery/network/scan/port/probe::python-concurrent-port-range-scan
    desc: Concurrent Python TCP port-range scan
    crit: notable
    conf: 0.96
    all:
      - id: objectives/discovery/network/scan/port/probe::python-low-port-range
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short
      - id: micro-behaviors/process/work/pool::worker-pool

  - id: objectives/discovery/network/scan/port/probe::python-service-port-scan
    desc: Python probes common service ports
    crit: notable
    conf: 0.95
    all:
      - id: objectives/discovery/network/scan/port/probe::python-service-port-table
    any:
      - id: objectives/discovery/network/scan/port/probe::python-nmap-portscanner-call
      - id: micro-behaviors/communications/socket/connect::asyncio-open-connection-call

  - id: objectives/discovery/network/scan/port/probe::python-cidr-host-connect-sweep
    desc: Python iterates a CIDR and probes hosts with TCP connect attempts
    crit: suspicious
    conf: 0.95
    unless:
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-cidr
    all:
      - id: micro-behaviors/communications/ip/parse::cidr-host-expansion
      - id: micro-behaviors/communications/ip/parse::ipv4-cidr-slash-24-or-wider
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short
    near_lines: 48

  # CIDR expansion and TCP probes support network discovery, including ordinary
  # inventory tools. An unrelated JSON parser does not establish where a CIDR
  # came from; bounded co-occurrence does not prove per-host argument flow.
  - id: objectives/discovery/network/scan/port/probe::python-cidr-expansion-near-tcp-probes
    desc: Python CIDR expansion near TCP connect probes
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/ip/parse::cidr-host-expansion
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-method-short
    near_lines: 56
