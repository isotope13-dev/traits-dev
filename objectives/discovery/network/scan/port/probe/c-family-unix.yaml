defaults:
  platforms: [qnx, unix]
  for: [c, cpp, objc]
  attack: T1046

traits:
  - id: objectives/discovery/network/scan/port/probe::c-port-array-connect-loop
    desc: C loop connects across port array
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'for\s*\([^(]{0,160}sizeof\s*\(\s*\w*ports\s*\)[^)]{0,500}connect\s*\('

composite_rules:
  - id: objectives/discovery/network/scan/port/probe::c-targeted-port-probe
    desc: C targeted port scan probe
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/port::c-common-service-port-array
      - id: objectives/discovery/network/scan/port/probe::c-port-array-connect-loop
      - id: micro-behaviors/communications/socket/options::c-connect-timeout-options
