defaults:
  platforms: [linux]
  for: [elf]
  attack: T1046
  mbc: E1046
traits: []
composite_rules:
  - id: objectives/discovery/network/scan/port/probe::epoll-nonblocking-connect-scan
    desc: Epoll nonblocking connect scanner
    crit: suspicious
    conf: 0.94
    all:
      # Runtime libraries export these APIs; a scanner imports connect.
      - id: metadata/file/profile/socket-runtime::connect-import
      - id: micro-behaviors/os/event/epoll::epoll-usage
      - id: metadata/file/profile/socket-api::connect
      - id: micro-behaviors/communications/ip/parse::inet-addr-symbol
      - id: micro-behaviors/fs/file/handle::fcntl
    any:
      - id: micro-behaviors/communications/ip/endpoint::ipv4-port-format-string
      - id: micro-behaviors/communications/socket/diagnostic::connection-status-strings
      - id: micro-behaviors/communications/socket/options::options-get
    needs: 2
