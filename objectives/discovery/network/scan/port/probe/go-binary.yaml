# A TCP connect API alone is not a scanner. Require application-level range
# targeting and an exposed probe-port option as well. The interface text is
# corroborated by linked Go TCP-connect code; neither clue suffices alone.
# This is dual-use reconnaissance, not proof of exploitation or ransomware.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-cidr-tcp-probe-scanner
    desc: Go TCP connector exposes CIDR probe interface
    crit: suspicious
    conf: 0.94
    attack: T1046
    mbc: E1046
    all:
      - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
      - id: micro-behaviors/ui/help::cidr-target-option-help
      - id: micro-behaviors/ui/help::tcp-probe-port-option-help
