defaults:
  platforms: [routeros, appliance, unix]
  for: [text, scripts, source]
  attack: T1046

traits:
  - id: objectives/discovery/network/scan/port/router::routeros-ping-sweep-loop
    desc: RouterOS ping sweep loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: ':for\s+\w+\s+from=1\s+to=254[\s\S]{0,520}/ping'

composite_rules:
  - id: objectives/discovery/network/scan/port/router::routeros-api-winbox-scan
    desc: RouterOS API WinBox scan
    crit: hostile
    conf: 0.98
    all:
    - id: objectives/discovery/network/scan/port/router::routeros-ping-sweep-loop
    any:
    - id: micro-behaviors/communications/socket/port::routeros-winbox-port-reference
    - id: micro-behaviors/communications/socket/port::routeros-api-port-reference

  - id: objectives/discovery/network/scan/port/router::routeros-api-stealth-probe
    for: [elf, c]
    desc: RouterOS API stealth probe
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: objectives/evasion/masquerade/process/rename::routeros-process-name-masquerade
    any:
      - id: micro-behaviors/communications/socket/port::routeros-api-port-reference
      - id: micro-behaviors/os/sysinfo/profile::routeros-api-system-profile-query
      - id: micro-behaviors/os/network/status::routeros-api-network-profile-query
      - id: micro-behaviors/network/interface::routeros-api-interface-query
      - id: micro-behaviors/os/firewall/query::routeros-api-firewall-query
