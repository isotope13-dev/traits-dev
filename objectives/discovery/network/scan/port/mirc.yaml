# An mIRC script that opens sockets to `$longip()`-converted addresses while
# incrementing a dotted IP counter and reading each socket's banner is a
# script-driven address-range sweep, not casual IRC scripting: the counter
# walks the range, sockopen probes each address, and the sockread handler
# harvests the banners.
defaults:
  platforms: [unix, windows]
  for: [mirc]
  attack: T1046
composite_rules:
  - id: mirc-scripted-address-sweep
    desc: mIRC script sweeps addresses by socket
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-sockopen-longip-target
      - id: objectives/command-and-control/channel/irc/client::mirc-scan-counter-increment
      - id: objectives/command-and-control/channel/irc/client::mirc-sockread-event
