defaults:
  platforms: [linux]
  for: [elf]
  attack: T1046
  mbc: E1046

traits:
  - id: os-banner-probe-status
    desc: Reports probing a host OS banner
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Probing OS for.{0,48}Reading OS'

composite_rules:
  # A user-selected host/port connect is dual-use. The explicit OS-probe
  # status message establishes banner-grabbing intent without calling the
  # standalone reconnaissance helper malware.
  - id: elf-tcp-os-banner-probe
    desc: ELF connects to probe a remote OS banner
    crit: suspicious
    conf: 0.98
    all:
      - id: os-banner-probe-status
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
