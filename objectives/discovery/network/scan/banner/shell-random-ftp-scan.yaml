defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.93

traits:
  - id: shell-local-address-block-sampler
    desc: Shell invokes address block sampler
    if:
      type: text
      regex: '(`|\$\()\s*\./(randb|random[-_]block|gen[-_]netblock)\b'

  - id: shell-syn-scans-variable-target
    desc: Shell invokes SYN scan on variable
    if:
      type: text
      regex: '(?m)^[ \t]*(\./)?(synscan|zmap|masscan)[ \t]+"?\$\{?[A-Za-z_]\w*'

  - id: shell-filters-legacy-ftp-fingerprint
    desc: Shell filters legacy FTP server version
    if:
      type: text
      regex: '\bgrep[ \t]+["'']?wu-2\.6\.\d\b'

composite_rules:
  - id: shell-random-block-legacy-ftp-scan-loop
    desc: Shell continuously scans random address blocks for legacy FTP services
    crit: hostile
    conf: 0.94
    attack: T1046
    near_lines: 30
    all:
      - id: shell-local-address-block-sampler
      - id: shell-syn-scans-variable-target
      - id: shell-filters-legacy-ftp-fingerprint
      - id: micro-behaviors/data/control-flow/loop/unconditional::shell-infinite-loop
