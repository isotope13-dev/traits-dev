# Service-banner collection is common in legitimate scanners. Requiring the
# complete brokered, centrally aggregated, proxy-rotated CIDR sweep identifies
# the concealed distributed reconnaissance operation rather than a lone recv.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1046,T1090

composite_rules:
  - id: distributed-relay-banner-harvest
    desc: Distributed proxy-routed CIDR scanner harvests service banners
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/network/scan/utility::distributed-proxy-routed-reconnaissance
      - id: micro-behaviors/communications/socket/send::socket-send-method-short
      - id: micro-behaviors/communications/socket/receive::socket-recv-call
