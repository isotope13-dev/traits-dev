defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: metadata-loopback-http-status-survey
    desc: Metadata and loopback HTTP status survey
    crit: suspicious
    conf: 0.97
    attack: T1046
    all:
      - id: metadata/lang/source/syntax/call/relationship::named-url-probe-results-query
      - id: metadata/lang/source/syntax/call/arguments::http-status-string-callback-argument
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/ip/literal::metadata-service-link-local-address
      - id: micro-behaviors/communications/ip/literal::alibaba-metadata-service-address
      - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
