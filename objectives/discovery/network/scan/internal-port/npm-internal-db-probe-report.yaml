defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1046,T1041

traits:
  - id: internal-db-probe-oast
    desc: Selects external report endpoint
    crit: notable
    if:
      type: text
      substr: '9dndwj4mod9qwldfzjjcqkhu0l6cu4lsa.oastify.com'
  - id: internal-db-probe-mysql
    desc: Probes internal MySQL host
    crit: notable
    if:
      type: text
      substr: 'mysql -h 10.108.193.167 -u hscanaux'
  - id: internal-db-probe-query
    desc: Requests database server identity
    crit: notable
    if:
      type: text
      substr: 'SELECT @@hostname; SHOW VARIABLES LIKE ''version_comment'';'
  - id: internal-db-probe-mongo
    desc: Probes internal MongoDB host
    crit: notable
    if:
      type: text
      substr: 'ncat -w 2 10.107.119.152 27077'
  - id: internal-db-probe-exec
    desc: Executes internal database query
    crit: notable
    if:
      type: text
      substr: 'execSync(mysqlCmd)'
  - id: internal-db-probe-report
    desc: Sends query result in external report
    crit: notable
    if:
      type: text
      substr: 'report(''MYSQL_LIVE_PROBE'', { output: mysqlRes })'
  - id: internal-db-probe-start
    desc: Starts database validation
    crit: notable
    if:
      type: text
      substr: 'validateDBs();'

  - id: internal-db-probe-request
    desc: Posts report to selected endpoint
    crit: notable
    if:
      type: text
      regex: 'https[.]request\(\{.{0,40}hostname: OAST.{0,40}method: ''POST''.{0,50}req[.]write\(payload\)'

composite_rules:
  - id: internal-db-probe-script
    desc: Probes internal databases and reports results
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::preinstall-js-basename
      - id: internal-db-probe-oast
      - id: internal-db-probe-mysql
      - id: internal-db-probe-query
      - id: internal-db-probe-mongo
      - id: internal-db-probe-exec
      - id: internal-db-probe-report
      - id: internal-db-probe-request
      - id: internal-db-probe-start
  - id: npm-internal-db-probe-report
    desc: Install probes internal databases and reports results
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: internal-db-probe-script
