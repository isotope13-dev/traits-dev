# Ruby sweeps the local /24, probes SMB/RDP-style ports with TCP connects,
# and posts results over HTTPS with certificate checks disabled.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1046

composite_rules:
  - id: ruby-subnet-lateral-port-scan-report
    desc: Scans local subnet ports and reports out
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/socket/probe::ruby-subnet-host-sweep
      - id: micro-behaviors/communications/socket/probe::ruby-smb-rdp-port-list
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-connect
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
