# Public asset mapping is useful to administrators and security auditors.
# The cloud-staging objective adds the upload and credential evidence; public
# certificate collection itself lives under micro-behaviors/crypto/certificate.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:

  - id: passive-dns-source
    desc: Passive-DNS source reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)passive[-_ ]dns'

  - id: describe-compute-operation
    desc: Enumerates cloud compute instances
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: describe_instances

  - id: cloud-account-tenant-list
    desc: Lists cloud accounts or tenants
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(list_accounts|list_tenants)\s*\('

composite_rules:
  - id: list-buckets-operation
    desc: Lists cloud storage buckets
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/lib/cloud/botocore::aws-python-sdk-source
      - id: well-known/lib/cloud/boto3::boto3-wheel-context
      - id: well-known/lib/cloud/botocore::botocore-wheel-context
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-command

  - id: passive-dns-subdomain-collection
    desc: Collects subdomains from passive-DNS
    crit: suspicious
    conf: 0.9
    all:
      - id: passive-dns-source
      - id: micro-behaviors/crypto/certificate/transparency::subdomain-result-field
      - id: micro-behaviors/crypto/certificate/transparency::subdomain-result-split

  - id: external-attack-surface-mapping
    desc: Maps domains through public certificate or DNS data
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/crypto/certificate/transparency::certificate-subdomain-collection
      - id: passive-dns-subdomain-collection

  - id: cloud-account-asset-enumeration
    desc: Enumerates assets in a cloud account
    crit: notable
    conf: 0.9
    any:
      - id: list-buckets-operation
      - id: describe-compute-operation
      - id: cloud-account-tenant-list

  - id: external-cloud-surface-mapping
    desc: Maps domains and cloud account assets
    crit: notable
    conf: 0.96
    all:
      - id: external-attack-surface-mapping
      - id: cloud-account-asset-enumeration
