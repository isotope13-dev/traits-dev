# External attack-surface mapping used before shadow-IT access.
#
# The article describes attackers starting with certificate-transparency and
# passive-DNS history, then folding discovered cloud assets into their map.
# These rules describe collection mechanics rather than a provider or domain.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: certificate-search-query
    desc: crt.sh JSON certificate query
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)crt\.sh.{0,160}[?&]output=json'

  - id: subdomain-result-field
    desc: Certificate subdomain result field
    crit: notable
    conf: 0.86
    if:
      type: text
      # crt.sh JSON key; bare name_value matches unrelated Python identifiers.
      substr: '"name_value"'

  - id: subdomain-result-split
    desc: Splits discovered subdomain results
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bname[_-]?value\b.{0,40}\bsplit(lines)?\s*\('

  - id: passive-dns-source
    desc: Passive-DNS source reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)passive[-_ ]dns'

  - id: describe-compute-operation
    desc: Enumerates cloud compute instances
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: describe_instances

  - id: cloud-account-tenant-list
    desc: Lists cloud accounts or tenants
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(list_accounts|list_tenants)\s*\('

composite_rules:
  - id: list-buckets-operation
    desc: Lists cloud storage buckets
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
      - id: well-known/lib/cloud/boto3::boto3-aws-sdk-wheel-context
      - id: well-known/lib/cloud/botocore::botocore-aws-sdk-wheel-context
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-command

  - id: certificate-transparency-domain-search
    desc: Searches certificate records for a domain
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/crypto/certificate/transparency::crt-sh-endpoint
      - id: certificate-search-query

  - id: passive-dns-subdomain-collection
    desc: Collects subdomains from passive-DNS
    crit: notable
    conf: 0.9
    all:
      - id: passive-dns-source
      - id: subdomain-result-field
      - id: subdomain-result-split

  - id: certificate-subdomain-collection
    desc: Collects subdomains from certificates
    crit: notable
    conf: 0.92
    all:
      - id: certificate-transparency-domain-search
      - id: subdomain-result-field
      - id: subdomain-result-split

  - id: external-attack-surface-mapping
    desc: Maps domains through public certificate or DNS data
    crit: suspicious
    conf: 0.94
    any:
      - id: certificate-subdomain-collection
      - id: passive-dns-subdomain-collection

  - id: cloud-account-asset-enumeration
    desc: Enumerates assets in a cloud account
    crit: notable
    conf: 0.9
    any:
      - id: list-buckets-operation
      - id: describe-compute-operation
      - id: cloud-account-tenant-list

  - id: external-cloud-surface-mapping
    desc: Maps domains and cloud account assets
    crit: suspicious
    conf: 0.96
    all:
      - id: external-attack-surface-mapping
      - id: cloud-account-asset-enumeration
