# Active Directory computer discovery paired with NetShareEnum SMB share
# enumeration and share-access probing (PowerView Invoke-ShareFinder,
# SharpShares, and related domain share-mapping tools).
defaults:
  crit: suspicious
  platforms: [windows]
  for: [powershell, csharp, pe, dll]
  attack: T1135,T1018

composite_rules:
  - id: ad-computer-smb-share-enumeration
    desc: Queries AD computers and enumerates SMB shares via NetShareEnum
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/directory-service::ldap-computer-object-filter
      - id: micro-behaviors/communications/socket/share::net-share-enum-with-struct
    any:
      - id: micro-behaviors/os/security/directory-service::powershell-directory-searcher
      - id: micro-behaviors/os/security/directory-service::directory-searcher-class

  - id: smb-share-enumeration-with-default-filter
    desc: Enumerates SMB shares with NetShareEnum and share exclusions
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/share::net-share-enum-with-struct
      - id: micro-behaviors/os/network/share::default-smb-share-filter-list
