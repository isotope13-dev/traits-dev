# User policy: Sliver framework implementation is hostile. These are
# server-side C2 request handlers; the observed file is not an implant.
defaults:
  platforms: [unix, windows]
  for: [go]
composite_rules:
  - id: sliver-remote-netstat-tasking
    desc: Sliver tasks remote network connection queries
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/serialize/protobuf::go-sliver-response-envelope
      - id: metadata/import/go/github/com/bishopfox/sliver/protobuf/commonpb
      - id: micro-behaviors/network/connections::go-sliver-netstat-request-forward
