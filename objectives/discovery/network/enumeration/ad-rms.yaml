# Post-compromise AD RMS reconnaissance combines multiple independently normal
# client surfaces: its LDAP SCP, local registry discovery cache, public client
# SOAP services, and the privileged method that reveals where/how the cluster
# root private key is stored.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1018,T1046

composite_rules:
  - id: ad-rms-directory-cluster-discovery
    desc: Discovers an AD RMS cluster through Active Directory
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/directory-service::ad-rms-service-connection-point-query
      - id: micro-behaviors/communications/http/services/microsoft::rms-certification-service-endpoint
    near_bytes: 5000

  - id: ad-rms-soap-service-enumeration
    desc: Enumerates AD RMS client and administrative services
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/microsoft::rms-certification-service-endpoint
      - id: micro-behaviors/communications/http/services/microsoft::rms-template-distribution-endpoint
      - id: micro-behaviors/communications/http/services/microsoft::rms-admin-manager-endpoint

  - id: ad-rms-multi-source-deployment-recon
    desc: Maps AD RMS deployment through LDAP registry and SOAP
    crit: suspicious
    conf: 0.98
    all:
      - id: ad-rms-directory-cluster-discovery
      - id: ad-rms-soap-service-enumeration
      - id: micro-behaviors/os/registry/keys::ad-rms-service-location-key
      - id: micro-behaviors/os/registry/keys::ad-rms-enterprise-location-values
    near_bytes: 10000

  - id: ad-rms-key-storage-recon
    desc: Maps AD RMS private-key storage and database location
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/microsoft::rms-admin-manager-endpoint
      - id: micro-behaviors/communications/http/services/microsoft::rms-key-protection-information
      - id: micro-behaviors/communications/http/services/microsoft::rms-key-protection-result-fields
    near_bytes: 5000
