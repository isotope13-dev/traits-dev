defaults:
  platforms:
  - windows
  for:
  - javascript
  - typescript
  crit: suspicious
  conf: 0.98
  attack: T1016
traits:
- id: socket-open-loopback-network-survey
  desc: Socket-open callback posts network survey
  if:
    type: tree-sitter
    query: |-
      (program
        (lexical_declaration (variable_declarator
          name: (identifier) @socket
          value: (new_expression constructor: (identifier) @constructor
            arguments: (arguments (string (string_fragment) @remote)))))
        (lexical_declaration (variable_declarator
          name: (identifier) @helper
          value: (string (string_fragment) @endpoint)))
        (expression_statement (assignment_expression
          left: (member_expression object: (identifier) @owner
            property: (property_identifier) @event)
          right: (arrow_function body: (statement_block
            (expression_statement (await_expression (call_expression
              function: (identifier) @fetch
              arguments: (arguments (identifier) @destination
                (object
                  (pair key: (property_identifier) @method
                    value: (string (string_fragment) @post))
                  (pair key: (property_identifier) @body
                    value: (call_expression
                      function: (member_expression object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments (object
                        (pair key: (property_identifier) @field
                          value: (string (string_fragment) @command)))))))))))))))
        (#eq? @socket @owner)
        (#eq? @helper @destination)
        (#eq? @constructor "WebSocket")
        (#match? @remote "^wss?://")
        (#match? @endpoint "^http://(127\\.0\\.0\\.1|localhost):[0-9]+/")
        (#eq? @event "onopen")
        (#eq? @fetch "fetch")
        (#eq? @method "method")
        (#eq? @post "POST")
        (#eq? @body "body")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @field "command")
        (#match? @command "(?i)ipconfig\\s+/all\\s*&&\\s*route\\s+print")
      ) @survey
