# Discovery of VMware ESXi / vCenter hosts inside a victim network, the
# reconnaissance step that precedes hypervisor ransomware deployment.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1046
composite_rules:
  # Learns internal subnets from directory computer objects, then confirms
  # hypervisors by TLS certificate and the vSphere SDK endpoint instead of
  # using vCenter inventory APIs. Legitimate inventory tooling queries
  # vCenter or a CMDB; it does not derive scan ranges from AD and then
  # fingerprint hosts by certificate and unauthenticated SDK pages.
  - id: hypervisor-discovery-from-directory
    desc: Learns subnets from AD and fingerprints ESXi hosts by TLS and SDK
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/security/directory-service::ldap-computer-object-filter
      - id: micro-behaviors/os/sysinfo/vmware::vmware-sdk-service-endpoint
      - id: micro-behaviors/communications/socket/ssl::python-peer-certificate-fetch
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-ex-method-short
      - id: micro-behaviors/communications/ip/parse::ip-network-from-cidr
  # Subnet sweep that probes the vSphere SDK endpoint with TLS verification
  # fully disabled: the operator does not know or trust the targets'
  # certificates because the targets are not theirs to administer.
  - id: hypervisor-sweep-tls-verification-disabled
    desc: Subnet sweep probes vSphere SDK with TLS verification disabled
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/vmware::vmware-sdk-service-endpoint
      - id: micro-behaviors/communications/tls/verify/disable::verify-mode-none
      - id: micro-behaviors/communications/ip/parse::ip-network-from-cidr
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-ex-method-short
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
