defaults:
  platforms:
    - unix
    - android
    - ios
traits:
  - id: netsh-wlan-show-networks
    desc: Netsh Wi-Fi network enumeration
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [python, batch, powershell, pe]
    if:
      type: text
      regex: 'netsh\s+wlan\s+show\s+networks\b'
    attack: T1016
composite_rules:
  - id: network-enumeration
    desc: Local network interface and routing signals
    crit: notable
    conf: 0.88
    for:
      - elf
      - shell
    needs: 2
    any:
      - id: objectives/discovery/network/interface
      - id: micro-behaviors/network/interface/command::ip-addr
      - id: "micro-behaviors/network/route::ip-route-show"
      - id: "micro-behaviors/network/neighbors::shell-arp-display-flag-call"
      - id: "micro-behaviors/network/neighbors::ip-neigh-display"
  - id: credential-plus-scanning
    desc: Credential access with network scanning
    crit: hostile
    conf: 0.9
    for:
      - elf
      - shell
    attack: T1021.004
    mbc: E1103
    all:
      - id: network-enumeration
      - id: micro-behaviors/communications/socket/probe::port-scanning
      - id: micro-behaviors/communications/ssh/keys::ssh-identity-file-flag
  - id: hosts-file-internal-host-discovery
    desc: Filters hosts file loopback entries to discover internal network hosts
    crit: hostile
    conf: 0.95
    attack: T1016,T1082
    for: [scripts, source]
    platforms: [unix, windows]
    all:
      - id: micro-behaviors/fs/path/config/network::hosts-file-path
      - id: micro-behaviors/network/dns::hosts-exclude-non-local-addresses
