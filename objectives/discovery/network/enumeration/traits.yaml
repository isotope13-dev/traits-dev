defaults:
  platforms:
    - unix
    - android
    - ios
traits:
  - id: arp-discovery-python-command
    desc: Python executes an arp ARP table command
    crit: suspicious
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.[a-z_]+|os\.(system|popen))$'
      arg:
        kind: string
        substr: 'arp -'
    attack: T1018
  - id: netsh-wlan-show-networks
    desc: Netsh Wi-Fi network enumeration
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [python, batch, powershell, pe]
    if:
      type: text
      regex: 'netsh\s+wlan\s+show\s+networks\b'
    attack: T1016
  - id: netcat-port-scan
    desc: netcat port scanning
    crit: suspicious
    conf: 0.85
    for:
      - elf
      - shell
    if:
      type: text
      regex: '\bnc\b[^\n]{0,80}\s-zv?\b[^\n]{0,80}\b([0-9]{1,5}-[0-9]{1,5}|[0-9]{1,5},[0-9,\s-]{1,80})\b'
    not:
      - substr: nc 127.0.0.1
      - substr: nc localhost
    unless:
      - id: well-known/app/utility/cmdchamp/
      - type: text
        regex: \bnc\b.{0,40}(127\.0\.0\.1|localhost)\b
      - type: text
        substr: nc -z -w 1 127.0.0.1 $port | grep -ic succeeded
      - type: text
        regex: (until|while !)\s+nc\b.{0,24}\s-zv?(\s|$)
    attack: T1046
  - id: nmap-scanning
    desc: nmap network scanning
    crit: suspicious
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: \bnmap\s+-s[STUAFVNX]\b
    attack: T1046
  - id: shell-port-scanner
    desc: shell port scanning loop
    crit: suspicious
    conf: 0.8
    for:
      - shell
    if:
      type: string_literal
      regex: (for|while).{0,50}\{.{0,50}nc.{0,20}-z
    attack: T1046
  - id: ssh-port-check-p22
    desc: SSH port availability check (-p 22)
    crit: notable
    conf: 0.8
    for:
      - elf
      - shell
    if:
      type: text
      regex: \bssh\b.{0,24}-p 22\b|-p 22.{0,24}\bssh\b
    not:
      - substr: complete -c mosh -l ssh
      - substr: ssh -p 2222
      - regex: 'example: "ssh -p 2222"\) \(default: "ssh"\)'
    attack: T1046
  - id: ssh-port-check-nmap
    desc: SSH port availability check (nmap)
    crit: suspicious
    conf: 0.8
    for:
      - elf
      - shell
    if:
      type: raw
      regex: \bnmap\b[^\n]{0,120}\s-p\s*([0-9,-]*,)?22(,[0-9,-]*)?\b
    unless:
      - type: symbol
        exact: alias
    attack: T1046
  # `ssh -i <keyfile> host` is the standard way to connect with an explicit
  # identity file (deploy scripts, CI, provisioning all do this) — a neutral
  # SSH-client capability, not "stolen key" usage on its own. The lateral-
  # movement intent comes from the network-recon composite that combines it
  # with discovery/scanning legs.
  - id: ssh-key-reuse
    desc: SSH client uses explicit identity file (-i)
    crit: notable
    conf: 0.8
    for:
      - elf
      - shell
    if:
      type: text
      regex: (ssh -i|-i /root/\.ssh|ssh\s+.{0,50}-i\s+)
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/app/development/github-cli/
      - type: text
        substr: QEMU examples & tests.
    attack: T1021.004
composite_rules:
  - id: ssh-port-check
    desc: SSH port availability check
    crit: suspicious
    conf: 0.8
    any:
      - id: ssh-port-check-p22
      - id: netcat-port-scan
      - id: ssh-port-check-nmap
    unless:
      - id: well-known/app/utility/cmdchamp/
  - id: known-benign-network-diagnostics-context
    desc: Known benign diagnostics or VPN context
    crit: exception
    conf: 0.99
    for: [elf, shell]
    any:
      - id: metadata/build/recognized-contexts::shell-diagnostic-report-collection-context
      - id: well-known/tool/sysadmin/container::pelagos-network-diagnostics-context
      - id: well-known/dual-use/tunnel/nostr-vpn::benign-e2e-context
      - id: well-known/dual-use/tunnel/nostr-vpn::cli-identity
      # CLI trainers embed interface/route quiz answers without performing recon.
      - id: well-known/app/utility/cmdchamp::trainer-header
  - id: network-enumeration
    desc: Queries local interface and routing information
    crit: notable
    conf: 0.88
    for:
      - elf
      - shell
    unless:
      - id: well-known/app/infrastructure/syslog-ng::syslog-ng-debun
      - id: well-known/dual-use/tunnel/spoofdpi::spoofdpi-go-module
      - id: well-known/app/system/hedgehog-fabricator::official-fabricator-context
      # A VPN daemon must inspect local interfaces and routes to establish its
      # tunnel; the high-confidence product identity is benign context.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/sysadmin/busybox/
      # Mageia's stock ifup-aliases helper necessarily reads interfaces and
      # routes while configuring aliases; these calls are capability evidence,
      # not standalone host discovery.
      - id: metadata/package/files/system-package::system-network-alias-script
      - id: well-known/app/infrastructure/openshift::openshift-release-ci-step-context
      # agent-glovebox queries interfaces and routes to characterize the
      # sandbox boundary it is enforcing, not to discover an attack target.
      - id: well-known/tool/detection/agent-glovebox::archive-context
      # Named diagnostic collectors and VPN e2e harnesses inspect local networking
      # for troubleshooting or tunnel setup, not attacker reconnaissance.
      - id: known-benign-network-diagnostics-context
    needs: 2
    any:
      - id: objectives/discovery/network/interface
      - id: micro-behaviors/os/network/interface::ip-addr
      - id: micro-behaviors/os/network/interface::ip-route-show
      - id: micro-behaviors/os/network/neighbors::arp-table-query
      - id: micro-behaviors/os/network/interface::ip-neigh-show
  - id: network-enumeration-go
    desc: Queries local network configuration in Go
    crit: suspicious
    conf: 0.88
    for: [go]
    attack: T1016
    unless:
      - id: well-known/app/system/hedgehog-fabricator::official-fabricator-context
    needs: 2
    any:
      - id: objectives/discovery/network/interface
      - id: micro-behaviors/os/network/neighbors::go-arp-utility-call
  - id: port-scanning
    desc: Active port scanning
    crit: suspicious
    conf: 0.9
    for:
      - elf
      - shell
    attack: T1046
    any:
      - id: netcat-port-scan
      - id: nmap-scanning
      - id: shell-port-scanner
    unless:
      - id: well-known/app/utility/cmdchamp/
  - id: lateral-movement-preparation
    desc: Network enumeration with port scanning
    crit: hostile
    conf: 0.92
    for:
      - elf
      - shell
    attack: T1046
    mbc: E1103
    all:
      - id: network-enumeration
      - id: port-scanning
      - id: ssh-port-check
    unless:
      - id: well-known/app/utility/cmdchamp/
  - id: credential-plus-scanning
    desc: Credential access with network scanning
    crit: hostile
    conf: 0.9
    for:
      - elf
      - shell
    attack: T1021.004
    mbc: E1103
    all:
      - id: network-enumeration
      - id: port-scanning
      - id: ssh-key-reuse
