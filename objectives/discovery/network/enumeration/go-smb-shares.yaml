# Go SMB share enumeration (Session.ListShares). Listing the shares a remote
# SMB server exposes surveys that host — network share discovery (T1135) —
# without moving execution to it, so the objective is discovery; the
# lateral-movement reading belongs to composites that add a drop or relay.
# Scope preserved from the trait's previous lateral-movement/smb home.
defaults:
  platforms: [openbsd, bsd, unix]
  for: [go, elf]
  attack: T1135

traits:
  - id: go-smb-list-shares
    desc: Go SMB lists shares
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Bind enumeration to the live SMB session established by this helper.
      # A fake Session in a Go unit test also implements ListShares(), but does
      # not enumerate a remote host.
      regex: 'smbsession\.Dial\([\s\S]{0,500}sess\.ListShares\(\)'
