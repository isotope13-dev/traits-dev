# An mIRC socket client that parses channel-list reply numerics and saves
# the parsed channels to disk is harvesting targets, not browsing: the
# LIST handler walks the server's channel list, the file write keeps the
# target list, and the open socket shows a live drone session rather than
# a passive log viewer.
defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, data]
  attack: T1595
composite_rules:
  - id: mirc-socket-channel-harvester
    desc: Socket client harvests IRC channel list
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-list-reply-numeric-compare
      - id: objectives/command-and-control/channel/irc/client::mirc-persists-parsed-socket-token
      - id: micro-behaviors/communications/socket/connect::mirc-sockopen
