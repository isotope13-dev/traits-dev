# These linked routines identify capabilities, not successful reconnaissance.
# No ARTEX identity, endpoint, binary size, or dependency-only gate is needed.
defaults:
  for: [elf]
  platforms: [linux]
  crit: notable
  conf: 0.99

traits:
  - id: go-cdn-provider-check
    desc: Compiled CDN provider detection routine
    if:
      type: function
      exact: github.com/projectdiscovery/cdncheck.(*Client).CheckCDN

  - id: go-waf-provider-check
    desc: Compiled WAF provider detection routine
    if:
      type: function
      exact: github.com/projectdiscovery/cdncheck.(*Client).CheckWAF

  - id: go-cloud-provider-check
    desc: Compiled cloud provider detection routine
    if:
      type: function
      exact: github.com/projectdiscovery/cdncheck.(*Client).CheckCloud

composite_rules:
  - id: go-dns-perimeter-recon-suite
    desc: Compiled DNS and perimeter recon suite
    crit: suspicious
    conf: 0.96
    attack: T1590.002
    all:
      - id: micro-behaviors/communications/dns/client::go-dnsx-query-multiple
      - id: micro-behaviors/communications/dns/client::go-dnsx-trace
      - id: micro-behaviors/communications/dns/zone-transfer::go-dnsx-axfr
      - id: go-cdn-provider-check
      - id: go-waf-provider-check
      - id: go-cloud-provider-check
