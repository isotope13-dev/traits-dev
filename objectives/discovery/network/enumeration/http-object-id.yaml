# Automated object-level API enumeration. The suspicious objective requires a
# loop and a loop-dependent identifier in an HTTP query; the hostile composite
# additionally requires an actively used unsigned JWT forgery.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: looped-http-object-id-enumeration
    desc: Loops over HTTP object identifiers
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/query::dynamic-object-id-query
      - id: micro-behaviors/data/control-flow/loop
    near_bytes: 1024

  - id: unsigned-jwt-object-id-enumeration
    desc: Enumerates API objects with forged unsigned JWT identities
    crit: hostile
    conf: 0.99
    attack: T1190
    all:
      - id: objectives/credential-access/validation/session::jwt-authentication-bypass-structure
      - id: looped-http-object-id-enumeration
    near_bytes: 4096
