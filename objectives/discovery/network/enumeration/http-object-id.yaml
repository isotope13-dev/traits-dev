# Object-ID query context alone is ordinary API use. The capability composites
# live under HTTP query; the attack claim additionally requires JWT forgery.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: unsigned-jwt-object-id-enumeration
    for: [scripts, '!jcl']
    desc: Enumerates API objects with forged unsigned JWT identities
    crit: hostile
    conf: 0.99
    attack: T1190
    all:
      - id: objectives/credential-access/validation/session::jwt-authentication-bypass-structure
      - id: micro-behaviors/communications/http/query::object-id-query-iteration-context
    near_bytes: 4096
