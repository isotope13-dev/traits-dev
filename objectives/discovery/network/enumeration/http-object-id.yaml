# Automated object-level API enumeration. The suspicious objective requires a
# loop and a loop-dependent identifier in an HTTP query; the hostile composite
# additionally requires an actively used unsigned JWT forgery.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: looped-http-object-id-enumeration
    desc: Loops over HTTP object identifiers
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/query::dynamic-object-id-query
      - id: micro-behaviors/data/control-flow/loop
      - id: micro-behaviors/communications/http/request/client::http-client
    near_bytes: 1024
    unless:
      - id: well-known/tool/development/rumdl::benchmark-rule-generator
      - id: well-known/tool/development/rumdl::benchmark-rule-binary-path
      - id: metadata/package/testing/presence/fixture::benchdata-directory-path
      - id: well-known/lib/platform/browser-automation::puppeteer-library-present

  - id: looped-http-object-id-concat-enumeration
    desc: Loops over concatenated HTTP object IDs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/query::dynamic-object-id-query-concat
      - id: micro-behaviors/data/control-flow/loop
      - id: micro-behaviors/communications/http/request/client::http-client
    near_bytes: 1024
    unless:
      - id: well-known/app/publishing/wordpress-plugins::known-wordpress-plugin
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-ui
      - id: micro-behaviors/communications/http/url/query::gtag-js-measurement-id-query

  - id: unsigned-jwt-object-id-enumeration
    desc: Enumerates API objects with forged unsigned JWT identities
    crit: hostile
    conf: 0.99
    attack: T1190
    all:
      - id: objectives/credential-access/validation/session::jwt-authentication-bypass-structure
      - id: looped-http-object-id-enumeration
    near_bytes: 4096
