defaults:
  platforms: [unix, android, ios]
  for: [shell]
traits:
- id: multi-arch-build-helper-context--rx-3
  desc: "Matches '-static'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(qemu-(user|system)-static)\b'
- id: multi-arch-appimage-build-marker
  desc: Multi-arch AppImage build helper
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: AppImage
  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
- id: multi-arch-release-marker
  desc: Release package installer marker
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(RELEASE_PKG|release package)\b'
- id: buildarch-targetarch--buildarch
  desc: References the build host architecture
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILDARCH
- id: buildarch-targetarch--targetarch
  desc: References the build target architecture
  crit: notable
  conf: 0.9
  if:
    type: text
    word: TARGETARCH
- id: build-arm--build-arm
  desc: Regex component marker (BUILD_ARM)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_ARM
- id: build-arm--build-arm64
  desc: Regex component marker (BUILD_ARM64)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_ARM64
- id: build-arm--build-aarch64
  desc: Regex component marker (BUILD_AARCH64)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_AARCH64
- id: build-x86--build-x86
  desc: Regex component marker (BUILD_X86)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_X86
- id: build-x86--build-x86-64
  desc: Regex component marker (BUILD_X86_64)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_X86_64
- id: build-ppc--build-ppc
  desc: Regex component marker (BUILD_PPC)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_PPC
- id: build-ppc--build-ppc64
  desc: Regex component marker (BUILD_PPC64)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_PPC64
- id: build-other-arch--build-mips
  desc: Regex component marker (BUILD_MIPS)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_MIPS
- id: build-other-arch--build-sh4
  desc: Regex component marker (BUILD_SH4)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_SH4
- id: build-other-arch--build-arc
  desc: Regex component marker (BUILD_ARC)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BUILD_ARC
# A cross-compiler triplet named in the script -- `i686-w64-mingw32-gcc`,
# `aarch64-linux-gnu-gcc` -- is the toolchain being driven, not a probe of the
# machine the script is running on. xz's own `windows/build.bash` names two of
# them and was reported as architecture reconnaissance in every clean release.
- id: cross-compiler-triplet-invocation
  desc: Invokes a cross-compiler triplet
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '\b(i[3-6]86|x86_64|aarch64|arm(v7l|64)?)-[a-z0-9_]{2,12}-[a-z0-9]{3,10}-(gcc|ld)\b'
composite_rules:
- id: buildarch-targetarch
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: buildarch-targetarch--buildarch
  - id: buildarch-targetarch--targetarch
- id: build-arm
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-arm--build-arm
  - id: build-arm--build-arm64
  - id: build-arm--build-aarch64
- id: build-x86
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-x86--build-x86
  - id: build-x86--build-x86-64
- id: build-ppc
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-ppc--build-ppc
  - id: build-ppc--build-ppc64
- id: build-other-arch
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-other-arch--build-mips
  - id: build-other-arch--build-sh4
  - id: build-other-arch--build-arc
# Downloading the build that matches the host is what every vendor install
# script does: probe `uname -m`, fold the answer into an artifact name, fetch
# the matching tarball. The arch probe is real, but calling it discovery by an
# adversary is wrong, so it is carved out of shell-multi-arch-array below.
- id: arch-selected-download-artifact
  desc: Architecture variable names a downloaded release artifact
  crit: component
  conf: 0.9
  all:
  - id: micro-behaviors/data/archive/extension::tar-gz-or-zip-text
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-variable-in-url-or-artifact-name

- id: arch-case-selects-host-build
  desc: uname case selects this host's build artifact
  crit: component
  conf: 0.9
  all:
  - id: micro-behaviors/os/sysinfo/platform/arch::uname-arch-normalization
  any:
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-variable-in-url-or-artifact-name
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-variable-in-filename
  - id: micro-behaviors/communications/http/url/build::arch-variable-in-url
  # Or the script simply fetches the build it just selected: cosign's and uv's
  # installers map `uname -m` to a release asset and curl it down. Naming the
  # per-arch asset inline (`cosign-linux-${arch}`, `uv-x86_64-...tar.gz`) is the
  # same idiom as assigning it to a variable first.
  - id: micro-behaviors/communications/http/download/cli::curl-command-call
  - id: micro-behaviors/communications/http/download/cli::wget-command-call
# Reading `uname -m` and knowing several architecture names is the opening of
# every build, packaging and installer script: normalise the machine type, then
# name the artifact, image tag, target triple or package to produce. The
# carve-outs below cover the shapes that end in a download, but OpenShell's
# task scripts show the rest of the space -- `package-deb.sh` maps the host to
# a Debian arch, `container-engine.sh` to a container platform string,
# `stage-prebuilt-binaries.sh` to a Rust target triple -- and none of them
# fetch anything.
#
# So the pairing is reported as what it observes. Nothing referenced this rule
# as an objective leg, and its own legs already live in micro-behaviors
# (`multi-arch-target` is notable there); the targeting verdict belongs to the
# dropper composites that add the fetch and the exec.
- id: shell-multi-arch-array
  desc: Script maps host arch across several targets
  crit: notable
  conf: 0.85
  mbc: "Discovery"
  attack: "T1082"
  all:
  - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
  unless:
  - id: metadata/build/openra::openra-system-library-helper
  - id: objectives/discovery/system/architecture::config-guess-basename
  - id: objectives/discovery/system/architecture::config-sub-basename
  - id: arch-selected-download-artifact
  - id: arch-case-selects-host-build
  # A script that drives cross-compilers is choosing which toolchain to build
  # with, not fingerprinting the host it runs on.
  - id: multi-arch-build-helper-marker
- id: multi-arch-build-helper-marker
  desc: Multi-arch build/cross-compile helper marker
  crit: component
  conf: 0.9
  any:
  - id: cross-compiler-triplet-invocation
  - id: buildarch-targetarch
  - id: build-arm
  - id: build-x86
  - id: build-ppc
  - id: build-other-arch
  - id: metadata/build/toolchain::cross-compile-variable
  - id: multi-arch-build-helper-context--rx-3
  - id: multi-arch-appimage-build-marker
- id: multi-arch-release-installer-marker
  desc: Multi-arch release installer marker
  crit: component
  conf: 0.9
  all:
  - id: multi-arch-release-marker
  - id: micro-behaviors/data/archive/extension::tar-gz-or-zip-text
