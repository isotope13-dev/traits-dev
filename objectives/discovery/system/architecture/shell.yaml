defaults:
  platforms: [unix, android, ios]
  for: [shell]
traits:
- id: multi-arch-build-helper-context--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(CROSS_COMPILE|QEMU_ARCH)\b'
  count_max: 1016493
- id: multi-arch-build-helper-context--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(qemu-(user|system)-static)\b'
  count_max: 1016494
- id: multi-arch-appimage-build-marker
  desc: Multi-arch AppImage build helper
  crit: component
  conf: 0.9
  if:
    type: text
    substr: AppImage
- id: multi-arch-release-marker
  desc: Release package installer marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(RELEASE_PKG|release package)\b'
- id: buildarch-targetarch--buildarch
  desc: Regex component marker (BUILDARCH)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILDARCH
- id: buildarch-targetarch--targetarch
  desc: Regex component marker (TARGETARCH)
  crit: component
  conf: 0.9
  if:
    type: text
    word: TARGETARCH
- id: build-arm--build-arm
  desc: Regex component marker (BUILD_ARM)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_ARM
- id: build-arm--build-arm64
  desc: Regex component marker (BUILD_ARM64)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_ARM64
- id: build-arm--build-aarch64
  desc: Regex component marker (BUILD_AARCH64)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_AARCH64
- id: build-x86--build-x86
  desc: Regex component marker (BUILD_X86)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_X86
- id: build-x86--build-x86-64
  desc: Regex component marker (BUILD_X86_64)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_X86_64
- id: build-ppc--build-ppc
  desc: Regex component marker (BUILD_PPC)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_PPC
- id: build-ppc--build-ppc64
  desc: Regex component marker (BUILD_PPC64)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_PPC64
- id: build-other-arch--build-mips
  desc: Regex component marker (BUILD_MIPS)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_MIPS
- id: build-other-arch--build-sh4
  desc: Regex component marker (BUILD_SH4)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_SH4
- id: build-other-arch--build-arc
  desc: Regex component marker (BUILD_ARC)
  crit: component
  conf: 0.9
  if:
    type: text
    word: BUILD_ARC
# A cross-compiler triplet named in the script -- `i686-w64-mingw32-gcc`,
# `aarch64-linux-gnu-gcc` -- is the toolchain being driven, not a probe of the
# machine the script is running on. xz's own `windows/build.bash` names two of
# them and was reported as architecture reconnaissance in every clean release.
- id: cross-compiler-triplet-invocation
  desc: Invokes a cross-compiler triplet
  crit: component
  conf: 0.93
  if:
    type: text
    regex: '\b(i[3-6]86|x86_64|aarch64|arm(v7l|64)?)-[a-z0-9_]{2,12}-[a-z0-9]{3,10}-(gcc|ld)\b'
- id: arch-variable-in-artifact-name
  desc: Arch variable in downloaded artifact name
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)(artifact|release|binary|asset|url)\w{0,12}\s*=[^\n]{0,90}\$\{?\w{0,12}arch'
# `goboringcrypto_linux_$GOARCH.syso`, `node-$ARCH.tar.xz` -- the normalized
# architecture spliced straight into a filename, which is the other half of the
# same select-the-build-for-this-host idiom.
- id: arch-variable-in-filename
  desc: Arch variable spliced into a filename
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\$\{?[A-Za-z_]{0,12}(ARCH|arch)\}?[A-Za-z0-9_.-]{0,40}\.[A-Za-z0-9]{1,6}\b'
# `case "$(uname -m)" in x86_64) ... aarch64) ...` -- reading the machine type
# and folding it to a normalized token. Every installer and cross-build helper
# opens this way.
- id: arch-case-uname-normalization
  desc: uname -m mapped in a case statement
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?m)case\s+"?\$\((uname\s+-[mp])\)"?\s+in'
composite_rules:
- id: buildarch-targetarch
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: buildarch-targetarch--buildarch
  - id: buildarch-targetarch--targetarch
- id: build-arm
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-arm--build-arm
  - id: build-arm--build-arm64
  - id: build-arm--build-aarch64
- id: build-x86
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-x86--build-x86
  - id: build-x86--build-x86-64
- id: build-ppc
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-ppc--build-ppc
  - id: build-ppc--build-ppc64
- id: build-other-arch
  desc: Regex component marker
  crit: component
  conf: 0.9
  any:
  - id: build-other-arch--build-mips
  - id: build-other-arch--build-sh4
  - id: build-other-arch--build-arc
# Downloading the build that matches the host is what every vendor install
# script does: probe `uname -m`, fold the answer into an artifact name, fetch
# the matching tarball. The arch probe is real, but calling it discovery by an
# adversary is wrong, so it is carved out of shell-multi-arch-array below.
- id: arch-selected-download-artifact
  desc: Architecture variable names a downloaded release artifact
  crit: component
  conf: 0.9
  all:
  - id: micro-behaviors/data/archive/extension::tar-gz-or-zip-text
  - id: arch-variable-in-artifact-name
# The Go toolchain's `crypto/internal/boring/build-goboring.sh` and oh-my-pi's
# `scripts/install.sh` are the two shapes of this: read `uname -m`, fold it to a
# normalized token in a `case`, then name the file to build or fetch after that
# token. Selecting the build that matches the host is the point of an installer
# and of a cross-build helper -- the arch probe is real, but attributing it to
# an adversary enumerating targets is wrong.
- id: arch-case-selects-host-build
  desc: uname case selects this host's build artifact
  crit: component
  conf: 0.9
  all:
  - id: arch-case-uname-normalization
  any:
  - id: arch-variable-in-artifact-name
  - id: arch-variable-in-filename
- id: shell-multi-arch-array
  desc: "Multiple architecture strings in runtime shell logic"
  crit: suspicious
  conf: 0.85
  mbc: "Discovery"
  attack: "T1082"
  all:
  - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
  unless:
  - id: metadata/build/openra::openra-system-library-helper
  - id: objectives/discovery/system/architecture::config-guess-basename
  - id: objectives/discovery/system/architecture::config-sub-basename
  - id: arch-selected-download-artifact
  - id: arch-case-selects-host-build
  # A script that drives cross-compilers is choosing which toolchain to build
  # with, not fingerprinting the host it runs on.
  - id: multi-arch-build-helper-marker
- id: multi-arch-build-helper-marker
  desc: Multi-arch build/cross-compile helper marker
  crit: component
  conf: 0.9
  any:
  - id: cross-compiler-triplet-invocation
  - id: buildarch-targetarch
  - id: build-arm
  - id: build-x86
  - id: build-ppc
  - id: build-other-arch
  - id: multi-arch-build-helper-context--rx-2
  - id: multi-arch-build-helper-context--rx-3
  - id: multi-arch-appimage-build-marker
- id: multi-arch-release-installer-marker
  desc: Multi-arch release installer marker
  crit: component
  conf: 0.9
  all:
  - id: multi-arch-release-marker
  - id: micro-behaviors/data/archive/extension::tar-gz-or-zip-text
