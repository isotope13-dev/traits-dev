# Locale profiling through the installed-keyboard-layout registry key.
#
# `HKCU\Keyboard Layout\Preload` enumerates the user's keyboard layouts in
# priority order. GUI applications configure input through the input-method
# APIs; a script or loader that shells out to read this key (typically via
# PowerShell from an Electron/Node or Python host) is deriving the machine's
# locale — victim triage for an operator, or a geofence gate. Observed in the
# post-DEF CON Google Doc / DocSend campaign, where the counterfeit installer
# posted the layout list with the rest of its host fingerprint.
#
# The read alone is only a discovery observation; pair it with an outbound
# profile POST (discovery/system/profile/keyboard-locale.yaml) for intent.
defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1082
  mbc: E1082

traits:
  - id: keyboard-layout-preload-read
    desc: Reads keyboard layout registry preload key
    crit: notable
    conf: 0.9
    if:
      type: text
      # Matches the registry path spelling in PowerShell, JS, Python and
      # batch strings: HKCU:\Keyboard Layout\Preload and its variants.
      regex: '(?i)keyboard\s+layout\s*[/\\]{1,2}\s*preload'
