---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
composite_rules:
- id: php-sensitive-server-path-references
  desc: PHP references multiple sensitive server paths
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/credential::php-account-or-ssh-public-key-path
  - id: micro-behaviors/fs/path/account-db::php-shadow-path-reference
  - id: micro-behaviors/fs/path/config/network::config-resolv
  - id: micro-behaviors/fs/path/private-key::php-ssh-private-key-text
  - id: micro-behaviors/fs/path/personal::bash-history-artifact
  - id: micro-behaviors/fs/path/activity-history::php-mysql-history-text
  - id: micro-behaviors/fs/path/log/accounting::php-lastlog-text
  needs: 2
