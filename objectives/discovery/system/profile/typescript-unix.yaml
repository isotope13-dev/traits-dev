defaults:
  platforms: [unix, appliance]
  for: [typescript, javascript]
  attack: T1041

composite_rules:
- id: ts-process-env-collection
  desc: JavaScript process enumeration with environment serialization
  crit: suspicious
  conf: 0.93
  near_bytes: 360
  all:
  - id: micro-behaviors/process/enumerate/shell/
  - id: objectives/discovery/system/fingerprint/runtime::process-env-dump
