# A library that walks the environment, reads the hostname and looks up the
# host's public IP from an IP-echo service, then POSTs, is reporting a host
# profile off the machine. Ordinary logging/telemetry clients send their own
# events; they do not enumerate every environment variable or ask a third
# party for the egress address.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1082,T1016,T1041

composite_rules:
  - id: python-env-hostname-public-ip-post
    desc: Env listing, hostname and public IP sent via POST
    crit: hostile
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/os/env/enumerate::python-environ-iteration
      - id: micro-behaviors/communications/http/ip-discovery
      - id: micro-behaviors/os/sysinfo/hostname/query::cross-lang-hostname-call
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/request/verb::python-post-method-keyword
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/post::python-http-post-client-call
