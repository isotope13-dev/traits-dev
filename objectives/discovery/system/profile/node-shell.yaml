traits:
  - id: js-shell-sysinfo-commands
    desc: Node shell queries host identity and processes
    crit: suspicious
    conf: 0.94
    platforms: [unix, windows]
    for: [javascript]
    attack: T1082,T1033,T1057
    mbc: E1041
    if:
      # Require an actual call expression; command examples in documentation
      # do not establish that the program queries host information.
      type: tree-sitter
      kind: call
      regex: 'hostname[\s\S]{0,320}(whoami|id)[\s\S]{0,700}ps\s+aux'
