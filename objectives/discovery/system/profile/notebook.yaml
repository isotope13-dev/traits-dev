# Notebook and Interactive Environment Discovery
# Detects harvesting of environment-specific metadata in notebooks (Colab, Jupyter, etc)
# ATT&CK: T1082 (System Information Discovery)
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  attack: "T1082"
traits:
  - id: colab-project-id
    desc: References a Colab project identifier
    crit: notable
    if:
      type: text
      regex: '(?i)(colab[^\r\n]{0,80}project_id|project_id[^\r\n]{0,80}colab)'
    conf: 0.85
  - id: colab-version-id
    desc: References a Colab version identifier
    crit: notable
    if:
      type: text
      regex: '(?i)(colab[^\r\n]{0,80}version_id|version_id[^\r\n]{0,80}colab)'
    conf: 0.85
composite_rules:
  - id: notebook-metadata-harvest
    desc: General notebook metadata harvesting pattern
    crit: suspicious
    all:
      - id: objectives/execution/interpreter/runtime/colab::register-callback
    any:
      - id: colab-project-id
      - id: colab-version-id
