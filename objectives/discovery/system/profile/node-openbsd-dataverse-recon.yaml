defaults:
  platforms: [openbsd, bsd, unix]
  for: [javascript]
  attack: T1041

composite_rules:
  - id: node-openbsd-profile-collection
    desc: Node host collection with a discovery endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/dataverse-microsoft::global-discovery-instances-route
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
      - id: objectives/discovery/process/enumerate::process-snapshot-path-reference
