defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1082

traits:
- id: sysinfo-post-cpuarch
  desc: CPU architecture POST parameter
  crit: component
  conf: 0.9
  if:
    type: text
    substr: cpuarch=%d
- id: sysinfo-post-cpunum
  desc: CPU count POST parameter
  crit: component
  conf: 0.9
  if:
    type: text
    substr: sicpunum=%d
