defaults:
  platforms: [windows, linux, macos]
  for: [scripts, csharp, text]

traits:
  - id: host-profile-process-field
    desc: Host profile process-list field
    crit: notable
    conf: 0.82
    # Require a serialized key; prose about inspecting a process list is not
    # evidence that the list is included in a host profile.
    if:
      type: text
      regex: '(?i)["'']process list["'']\s*[:=]'

  - id: host-profile-software-field
    desc: Host profile software-list field
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)["'']software list["'']\s*[:=]'

  - id: compact-system-profile-post-body
    desc: Compact system profile POST body
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: "a=<MAC address>&b=<hostname>"

composite_rules:
  - id: host-process-software-locale-form
    for: [scripts, '!jcl', text]
    desc: Host process software locale profile form
    crit: suspicious
    conf: 0.9
    scope: file
    near_lines: 40
    all:
      - id: metadata/file/string/identity::hostname-field-token
      - id: host-profile-process-field
      - id: host-profile-software-field
      - id: micro-behaviors/data/source/syntax/schema::locale-language-object-field
