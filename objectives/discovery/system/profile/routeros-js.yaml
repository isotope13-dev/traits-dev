defaults:
  crit: suspicious
  platforms: [routeros, appliance]
  for: [javascript]
  attack: T1082

composite_rules:
  - id: routeros-js-host-profile-query-set
    desc: RouterOS JS host profile query set
    conf: 0.94
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/profile::routeros-js-system-profile-query
      - id: micro-behaviors/os/sysinfo/config::routeros-js-system-config-query
      - id: micro-behaviors/os/network/status::routeros-js-ip-config-query
      - id: micro-behaviors/network/interface::routeros-js-interface-query
      - id: "micro-behaviors/os/network/route::routeros-js-routing-query"
      - id: micro-behaviors/os/sysinfo/config::routeros-js-tool-config-query
