# Host profiling that includes the keyboard-layout registry read. The layout
# list maps to system locale, so a program that both enumerates it and POSTs a
# structured profile to a remote endpoint is reporting the victim's language
# environment to an operator — the triage step that precedes selective tasking.
defaults:
  platforms: [windows]
  for: [javascript, typescript, python, powershell, csharp, java]
  attack: T1082, T1012

composite_rules:
  - id: keyboard-locale-profile-post
    desc: Keyboard-layout locale sent in a host profile
    crit: suspicious
    conf: 0.93
    near_bytes: 8192
    all:
      - id: objectives/discovery/system/locale::keyboard-layout-preload-read
    any:
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/post::node-https-request-post
      - id: micro-behaviors/communications/http/post::axios-post-call
