composite_rules:
- id: node-oob-host-user-query-set
  platforms: [unix, windows]
  desc: OOB endpoint beside host and user identity queries
  crit: suspicious
  conf: 0.93
  for: [javascript, typescript]
  all:
    - id: micro-behaviors/communications/url/host::oob-endpoint-any
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
    - id: micro-behaviors/process/user/query::os-userinfo-call
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: well-known/tool/detection/security-scanner/
    - id: well-known/tool/detection/opena2a-arp/

# A serialized host profile written into a Node request body and sent to a
# public OOB collector is complete exfiltration. Unlike the narrower
# full-environment rule below, this also covers identity profiles made from
# hostname, username, home directory, and resolver configuration.
