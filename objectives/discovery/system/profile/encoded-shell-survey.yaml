# The same survey can be an ordinary diagnostic. Attack admission here comes
# from the reverse-shell command, alongside an encoded shell pipeline and a
# real host-language process call. These are co-occurring observations; this
# does not claim that the survey output is transmitted over the later socket.
defaults:
  platforms: [unix]
  for: [php, ruby]
  attack: T1082
composite_rules:
  - id: encoded-host-survey-with-reverse-shell
    desc: Encoded host survey beside reverse-shell commands
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/profile::encoded-unix-host-survey-command-text
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
      - id: objectives/command-and-control/reverse-shell/dev-tcp::dev-tcp-revshell
    any:
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: micro-behaviors/process/create/exec::ruby-system-process-call
