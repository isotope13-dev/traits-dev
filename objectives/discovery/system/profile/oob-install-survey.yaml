defaults:
  platforms: [unix, windows]

composite_rules:
- id: js-oob-get-hostname-cooccurrence
  for: [javascript, typescript]
  desc: HTTP GET and hostname query beside OOB endpoint
  crit: suspicious
  conf: 0.95
  near_lines: 120
  all:
    - id: micro-behaviors/communications/url/host::oob-endpoint-any
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  any:
    - id: micro-behaviors/communications/http/request/client::https-get
    - id: micro-behaviors/communications/http/request/get::node-http-client-get
    - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
    - id: micro-behaviors/communications/http/query::url-derived-http-get
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: well-known/tool/detection/security-scanner/
    - id: well-known/tool/detection/opena2a-arp/
    - id: metadata/file/catalog/identity::embedded-domain-blocklist-context


# npm-install-oob-get-host-survey and npm-preinstall-oob-identity-survey were
# deleted: their evidence is identical to the notable install-context
# co-occurrences micro-behaviors/communications/http/request/beacon::
# npm-hook-oob-get-hostname-cooccurrence and npm-preinstall-oob-identity-
# cooccurrence, which remain the canonical observations; the suspicious
# verdict for an OOB GET host survey is owned by js-oob-get-hostname-
# cooccurrence below.

# Co-occurrence warrants investigation; it does not prove identity transfer.
- id: js-oob-host-identity-http-proximity
  desc: Host identity query near an OOB endpoint and HTTP request
  crit: suspicious
  for: [javascript, typescript, go]
  conf: 0.98
  attack: T1082
  all:
    - id: micro-behaviors/communications/url/host::oob-endpoint-any
    - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
  any:
    - id: micro-behaviors/communications/http/request/get::node-http-client-get
    - id: micro-behaviors/communications/http/request/client::https-get
    - id: micro-behaviors/communications/http/request/client::https-request
    - id: micro-behaviors/communications/http/request/client::js-fetch-call
    - id: micro-behaviors/communications/http/post::fetch-post-call
    - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
    - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias
    - id: micro-behaviors/communications/http/request/url-computed::node-https-get-concatenated-url
    - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
    - id: micro-behaviors/communications/http/download/cli::curl-wget-command
  near_bytes: 1024
  unless:
    # JSON POST objectives describe the completed transport more precisely.
    - id: micro-behaviors/communications/http/request/json::http-post-json
    - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
