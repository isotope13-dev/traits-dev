defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # These are attack-context fragments: the full set is meaningful as a
  # host-profile record, but an individual generic property name is not.
  - id: js-host-profile-identifier-field
    desc: JavaScript host identifier field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']identifier["'']\s*:'

  - id: js-whoami-profile-field
    desc: JavaScript whoami profile field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(["'']whoami["'']|\bwhoami)\s*:'

composite_rules:
  - id: js-host-profile-query-set
    desc: Queries host profile and user or CI context
    crit: notable
    conf: 0.98
    attack: T1082
    near_bytes: 2400
    all:
      - id: micro-behaviors/network/interface::node-network-interfaces-call
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-arch-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-cwd-call
    any:
      - id: micro-behaviors/os/env/read::ci-env-reference-set
      - id: micro-behaviors/process/user/query::os-userinfo-username-read
      - id: micro-behaviors/process/user/query::os-userinfo-call

  # A bounded set of distinct identity/location fields identifies a
  # host-profile-shaped record, but does not imply exfiltration by itself.
  - id: js-host-profile-fields
    desc: JavaScript host identity field set
    crit: notable
    conf: 0.9
    attack: T1082,T1033
    needs: 4
    near_bytes: 4096
    any:
      - id: js-host-profile-identifier-field
      - id: micro-behaviors/data/source/syntax/schema::user-object-key
      - id: micro-behaviors/data/source/syntax/schema::path-object-key
      - id: micro-behaviors/data/source/syntax/schema::hostname-object-key
      - id: micro-behaviors/data/source/syntax/schema::domain-object-key
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/

  - id: js-hostname-whoami-json-object
    desc: JavaScript serializes hostname and whoami fields
    crit: notable
    conf: 0.95
    attack: T1082,T1033
    near_bytes: 384
    all:
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/data/source/syntax/schema::hostname-object-key
      - id: js-whoami-profile-field
