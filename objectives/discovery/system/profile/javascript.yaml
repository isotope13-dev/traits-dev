defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # These are attack-context fragments: the full set is meaningful as a
  # host-profile record, but an individual generic property name is not.
  - id: js-host-profile-identifier-field
    desc: JavaScript host identifier field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']identifier["'']\s*:'

  - id: js-host-profile-user-field
    desc: JavaScript host user field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']user["'']\s*:'

  - id: js-host-profile-path-field
    desc: JavaScript host path field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']path["'']\s*:'

  - id: js-host-profile-hostname-field
    desc: JavaScript host hostname field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']hostname["'']\s*:'

  - id: js-host-profile-domain-field
    desc: JavaScript host domain field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']domain["'']\s*:'

  - id: js-hostname-profile-field
    desc: JavaScript hostname profile field
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(["'']hostname["'']|\bhostname)\s*:'

  - id: js-whoami-profile-field
    desc: JavaScript whoami profile field
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(["'']whoami["'']|\bwhoami)\s*:'

composite_rules:
  # A bounded set of distinct identity/location fields identifies a
  # host-profile-shaped record, but does not imply exfiltration by itself.
  - id: js-host-profile-fields
    desc: JavaScript host identity field set
    crit: notable
    conf: 0.9
    attack: T1082,T1033
    needs: 4
    near_bytes: 4096
    any:
      - id: js-host-profile-identifier-field
      - id: js-host-profile-user-field
      - id: js-host-profile-path-field
      - id: js-host-profile-hostname-field
      - id: js-host-profile-domain-field
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/

  - id: js-hostname-whoami-json-object
    desc: JavaScript serializes hostname and whoami fields
    crit: notable
    conf: 0.95
    attack: T1082,T1033
    near_bytes: 384
    all:
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: js-hostname-profile-field
      - id: js-whoami-profile-field
