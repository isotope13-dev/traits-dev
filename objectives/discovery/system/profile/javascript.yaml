defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Computed dispatch and two quoted host-identity terms co-occur. The
  # terms alone do not establish record fields or collection.
  - id: obfuscated-host-profile-terms
    desc: Computed dispatch beside host identity terms
    crit: suspicious
    conf: 0.96
    needs: 2
    all:
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-numeric-indexed-computed-call
    any:
      - id: micro-behaviors/os/sysinfo/hostname/reference::host-profile-term-hostname
      - id: micro-behaviors/os/user/lookup::host-profile-term-userinfo
      - id: micro-behaviors/os/user/lookup::host-profile-term-username
    unless:
      - id: well-known/tool/development/vscode-extension/dbt-vscode::dbt-vscode-extension-context
      - id: well-known/lib/web/standards/whatwg-url::whatwg-url-parser-context
      - id: well-known/lib/web/server/follow-redirects::node-http-url-parser-context
      - id: well-known/tool/development/testing/browserstack::browserstack-ai-sdk-context
      - id: well-known/lib/web/standards/ws-websocket::ws-websocket-library-context
      - id: well-known/app/security/seon::seon-sdk-context
      - id: metadata/package/files/dependency::vsix-bundled-output-path

  # A bounded set of distinct identity/location fields identifies a
  # host-profile-shaped record, but does not imply exfiltration by itself.
  - id: js-host-profile-fields
    desc: JavaScript host identity field set
    crit: notable
    conf: 0.9
    attack: T1082,T1033
    needs: 4
    near_bytes: 4096
    any:
      - id: metadata/lang/source/syntax/identity-field::js-host-profile-identifier-field
      - id: metadata/lang/source/naming/resource::user-object-key
      - id: metadata/lang/source/naming/resource::path-object-key
      - id: metadata/lang/source/syntax/identity-field::hostname-object-key
      - id: metadata/lang/source/naming/resource::domain-object-key
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/

  - id: js-hostname-whoami-json-object
    desc: JavaScript serializes hostname and whoami fields
    crit: notable
    conf: 0.95
    attack: T1082,T1033
    near_bytes: 384
    all:
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: metadata/lang/source/syntax/identity-field::hostname-object-key
      - id: "metadata/lang/source/syntax/key-value::js-whoami-field"

  - id: js-enterprise-environment-recon
    desc: JavaScript enumerates enterprise domain, VPN, or storage configurations
    crit: hostile
    conf: 0.96
    attack: T1082,T1033,T1016
    needs: 2
    any:
      - id: micro-behaviors/os/env/system-info::node-domain-recon-env-read
      - id: micro-behaviors/os/env/system-info::node-enterprise-vpn-env-read
      - id: micro-behaviors/os/env/system-info::node-onedrive-commercial-env-read
