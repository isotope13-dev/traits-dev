defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # A route that returns the current host and account identity makes local
  # reconnaissance remotely readable. Requiring profile construction and a
  # serialized response excludes ordinary host queries and status handlers.
  - id: node-http-route-exposes-host-profile
    desc: HTTP route returns a host and user profile
    crit: hostile
    conf: 0.97
    attack: T1082,T1033,T1041
    scope: file
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/server/route::app-router-get-endpoint
      - id: objectives/exfiltration/stealer/system-info/host-user/callback::host-user-profile-object
      - id: micro-behaviors/communications/http/server/response::http-response-serializes-data
