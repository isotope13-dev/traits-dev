defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1082

traits:
  - id: python-host-profile-record-fields
    desc: Python host profile record fields
    conf: 0.93
    if:
      type: text
      regex: '"hostname"[\s\S]{0,160}"platform"[\s\S]{0,160}"system"'

  # os_version / python_version / has_gpu key literals are neutral field
  # names; they live in micro-behaviors/data/source/syntax/schema/python.yaml.

composite_rules:
  - id: python-host-profile-field-set
    desc: Python object groups multiple host profile fields
    crit: component
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/data/serialize/schema-object::python-host-id-object-fields
      - id: micro-behaviors/data/serialize/schema-object::python-hostname-object-field
      - id: micro-behaviors/data/serialize/schema-object::python-system-machine-object-fields
      - id: micro-behaviors/data/serialize/schema-object::python-platform-object-fields
      - id: micro-behaviors/data/serialize/schema-object::runtime-version-field-key

  - id: python-runtime-profile-fields
    desc: Python runtime profile record fields
    conf: 0.95
    for: [python]
    near_lines: 24
    all:
      - id: micro-behaviors/data/source/syntax/schema::os-version-string-key
      - id: micro-behaviors/data/source/syntax/schema::python-version-string-key
      - id: micro-behaviors/data/serialize/schema-object::python-architecture-field-key
      - id: micro-behaviors/data/source/syntax/schema::has-gpu-string-key

  - id: python-device-host-profile-fields
    desc: Python runtime and host identity profiling
    conf: 0.94
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/platform/host::platform-full
      - id: micro-behaviors/os/sysinfo/platform/host::platform-system
      - id: micro-behaviors/os/sysinfo/platform/host::python-platform-machine
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/network/interface::python-getsockname-local-ip

  - id: python-system-profile-http
    desc: Python system profiling with an HTTP client
    conf: 0.95
    mbc: E1082
    all:
      - id: objectives/anti-static/obfuscation/aliasing
      # Was the whole `discovery/system/` tree, which contains this rule.
      - id: objectives/discovery/system/activity/
      - id: objectives/discovery/system/architecture/
      - id: objectives/discovery/system/correlate/
      - id: objectives/discovery/system/document/
      - id: objectives/discovery/system/domain-admin-prep/
      - id: objectives/discovery/system/fingerprint/
      - id: objectives/discovery/system/hardware/
      - id: objectives/discovery/system/ics-environment/
      - id: objectives/discovery/system/install/
      - id: objectives/discovery/system/locale/
      - id: micro-behaviors/communications/http/request/
    unless:
      # AI-agent observability tools profile the host/runtime for telemetry.
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/app/ai/agent-runtime/aither-adk::aither-adk-sdk
      # Bingo gathers the operator's own network identity for target context;
      # it is not a host-infostealer profile.
      - id: well-known/tool/offensive/bingo::bingo-terminal-context
