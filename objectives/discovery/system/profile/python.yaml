defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
  - pyc
  attack: T1082
traits:
- id: python-host-profile-record-fields
  desc: Python host profile record fields
  conf: 0.93
  if:
    type: text
    regex: '"hostname"[\s\S]{0,160}"platform"[\s\S]{0,160}"system"'
composite_rules:
- id: python-host-profile-field-set
  desc: Python object groups multiple host profile fields
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/data/serialize/schema-object::python-host-id-object-fields
  - id: micro-behaviors/data/serialize/schema-object::python-hostname-object-field
  - id: micro-behaviors/data/serialize/schema-object::python-platform-object-fields
  - id: micro-behaviors/data/serialize/schema-object::runtime-version-field-key
- id: python-system-profile-http
  desc: Python system profiling with an HTTP client
  conf: 0.95
  mbc: E1082
  all:
  - id: objectives/anti-static/obfuscation/aliasing
  - id: objectives/discovery/system/activity/
  - id: micro-behaviors/os/sysinfo/platform/arch
  - id: objectives/discovery/system/correlate/
  - id: objectives/discovery/system/document/
  - id: objectives/discovery/system/domain-admin-prep/
  - id: objectives/discovery/system/fingerprint
  - id: micro-behaviors/process/io/stdout
  - id: objectives/discovery/system/ics-environment
  - id: objectives/discovery/system/install/
  - id: micro-behaviors/communications/http/client/exchange::http-request-markers-or-response-stream
  any:
  - id: micro-behaviors/os/sysinfo/platform/locale::keyboard-layout-preload-read
  - id: micro-behaviors/os/sysinfo/platform/locale::applescript-user-locale
  unless:
  - id: well-known/tool/detection/ai-guardrail/
  - id: well-known/app/ai/agent-runtime/aither-adk::aither-adk-sdk
  - id: well-known/tool/offensive/bingo::bingo-terminal-context
