defaults:
  platforms: [unix]
  for: [go, elf, macho]
  attack: T1082

traits:
  - id: go-system-fingerprint-section
    desc: Go system fingerprint section
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "=== SYSTEM FINGERPRINT ==="

  - id: go-ps-command
    desc: Go invokes Unix ps command
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '/usr/bin/ps([^A-Za-z0-9._/-]|$)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/platform/gopsutil::gopsutil-library-context
      - type: path
        regex: 'github\.com/shirou/gopsutil(@|@v)'
      - type: path
        basename: true
        exact: busybox_versions.go
      - type: basename
        exact: apko

  - id: go-netstat-command
    desc: Go invokes Unix netstat command
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '/usr/bin/netstat([^A-Za-z0-9._/-]|$)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/platform/gopsutil::gopsutil-library-context
      - type: path
        regex: 'github\.com/shirou/gopsutil(@|@v)'
      - type: path
        basename: true
        exact: busybox_versions.go
      - type: basename
        exact: apko

  - id: go-df-command
    desc: Go invokes Unix df command
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '/usr/bin/df([^A-Za-z0-9._/-]|$)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/platform/gopsutil::gopsutil-library-context
      - type: path
        regex: 'github\.com/shirou/gopsutil(@|@v)'
      - type: path
        basename: true
        exact: busybox_versions.go
      - type: basename
        exact: apko

composite_rules:
  - id: go-host-profile-command-set
    desc: Go Unix host profile commands
    crit: suspicious
    conf: 0.94
    any:
      - id: go-ps-command
      - id: go-netstat-command
      - id: go-df-command
    needs: 2
