defaults:
  platforms: [unix]
  for: [go, elf, macho]
  attack: T1082

traits:
  - id: go-system-fingerprint-section
    desc: Go system fingerprint section
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "=== SYSTEM FINGERPRINT ==="

composite_rules:
  - id: go-host-profile-command-set
    desc: Go Unix host profile commands
    crit: suspicious
    conf: 0.94
    any:
      - id: micro-behaviors/process/enumerate/ps::go-ps-command
      - id: micro-behaviors/os/network/status::go-netstat-command
      - id: micro-behaviors/os/sysinfo/disk::go-df-command
    needs: 2
