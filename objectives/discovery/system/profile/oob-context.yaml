defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1082
  mbc: E1082

composite_rules:
  - id: daemon-thread-oob-host-query-cooccurrence
    for: [python]
    desc: Daemon thread and hostname beside OOB endpoint
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
