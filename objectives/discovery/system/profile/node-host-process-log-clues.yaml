defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious

composite_rules:
  - id: node-host-process-profile-log
    desc: Node host identity and process-list log clues
    conf: 0.97
    attack: T1082,T1057
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/fs/write/file/append::append-file-sync
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/enumerate/shell::ps-eo-comm
