defaults:
  platforms: [windows]
  for: [batch, powershell, shell, binaries]
  attack: T1082,T1041
traits: []

composite_rules:
- id: windows-recon-command-markers
  desc: Windows reconnaissance command markers
  crit: component
  conf: 0.86
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/profile::systeminfo-command-reference
  - id: micro-behaviors/process/enumerate/shell::tasklist
  - id: micro-behaviors/os/network/status::netstat
  - id: micro-behaviors/process/user/query::windows-whoami-command
  - id: micro-behaviors/os/env/user-paths::temp-var
