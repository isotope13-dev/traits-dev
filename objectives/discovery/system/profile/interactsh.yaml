composite_rules:
- id: interactsh-host-http-cooccurrence
  for: [javascript, typescript]
  platforms: [unix, windows]
  desc: Interactsh endpoint beside HTTP and host identity queries
  crit: suspicious
  scope: file
  # "beside" is a locality claim: 200 lines is file-wide in most scripts and
  # double-counts the generic OOB GET host survey
  # (js-oob-get-hostname-cooccurrence) whenever the endpoint is an Interactsh
  # host. The modal proximity bound keeps the interactsh-specific cluster for
  # genuinely adjacent evidence.
  near_lines: 12
  all:
  - id: micro-behaviors/communications/url/host/oob::interact-sh
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  unless:
    - id: metadata/package/testing/
