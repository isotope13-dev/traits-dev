composite_rules:
- id: interactsh-host-http-cooccurrence
  for: [javascript, typescript]
  platforms: [unix, windows]
  desc: Interactsh endpoint beside HTTP and host identity queries
  crit: suspicious
  scope: file
  near_lines: 200
  all:
  - id: micro-behaviors/communications/url/host::interact-sh
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  unless:
    - id: metadata/package/testing/
    - id: metadata/package/description/disclosure::disclosed-authorized-depconf-oast-install-context
    - id: metadata/package/documentation/disclosure::source-authorized-depconf-poc-banner
