defaults:
  platforms: [windows, unix, appliance]
  for: [powershell]
  attack: T1041

traits:
  - id: ps-system-state-fields
    desc: PowerShell system state fields
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'hostname[\s\S]{0,220}kernel[\s\S]{0,220}partitions'

composite_rules:
  - id: ps-system-profile-recon
    desc: PowerShell OS query with external endpoint clue
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    attack: T1082
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/os/wmi/query::query-os-info
