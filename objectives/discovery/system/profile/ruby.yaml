# A compact user/host record is discovery evidence. Its presence alone does
# not prove transport or theft, so the exfiltration composites add the network
# and encoding legs before making a hostile judgment.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1082

traits:
  - id: ruby-packed-host-profile-fields
    desc: Ruby packed user and host profile fields
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(usr|user):[^| \n]{1,60}\|(hst|host):[^| \n]{1,120}'
