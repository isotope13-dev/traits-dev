defaults:
  platforms: [routeros, appliance]
  for: [python, pyc]
  attack: T1082

composite_rules:
  - id: routeros-api-host-profile-query-set
    desc: RouterOS API host profile queries
    crit: suspicious
    conf: 0.95
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/profile::routeros-api-system-profile-query
      - id: micro-behaviors/os/network/status::routeros-api-network-profile-query
      - id: micro-behaviors/network/interface::routeros-api-interface-query
      - id: micro-behaviors/os/firewall/query::routeros-api-firewall-query
      - id: micro-behaviors/os/sysinfo/profile::routeros-api-host-profile-call
