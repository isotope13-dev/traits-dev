# A remote-access operator commonly fingerprints the host before trusting it
# with corporate work. These composites capture the observable command and
# endpoint shape without naming a campaign, account, or remote-support vendor.
defaults:
  platforms: [windows]
  for: [scripts, javascript, typescript, python, powershell, batch, shell]
  attack: T1082

composite_rules:
  - id: windows-host-inventory-command-set
    desc: Multiple Windows host inventory commands
    crit: suspicious
    conf: 0.93
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/process::windows-dxdiag-command
      - id: micro-behaviors/os/sysinfo/process::windows-wmic-command
      - id: micro-behaviors/os/sysinfo/process::windows-systeminfo-command
      - id: micro-behaviors/os/sysinfo/command::windows-systeminfo-command-string

  - id: remote-access-location-check
    desc: Remote-access agent paired with host and public-location checks
    crit: suspicious
    conf: 0.96
    attack: T1219,T1082,T1016
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-host-inventory
      - id: micro-behaviors/communications/http/ip-discovery/
