# A remote-access operator commonly fingerprints the host before trusting it
# with corporate work. These composites capture the observable command and
# endpoint shape without naming a campaign, account, or remote-support vendor.
defaults:
  crit: suspicious
  platforms: [windows]
  for: [scripts, javascript, typescript, python, powershell, batch, shell]
  attack: T1082

composite_rules:
  - id: windows-host-inventory-command-set
    desc: Multiple Windows host inventory commands
    conf: 0.93
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/process::windows-dxdiag-command
      - id: micro-behaviors/os/sysinfo/process::windows-wmic-command
      - id: micro-behaviors/os/sysinfo/process::windows-systeminfo-command
      - id: micro-behaviors/os/sysinfo/command::windows-systeminfo-command-string

  - id: remote-access-location-check
    desc: Remote-access agent paired with host and public-location checks
    conf: 0.96
    attack: T1219,T1082,T1016
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-host-inventory
      - id: micro-behaviors/communications/http/ip-discovery/

  # The same operator workflow without a named RMM product: a program that
  # serves remote shells or commands also asks public IP-echo services for
  # its external address and reads the OS identity, so whoever connects
  # knows where the host sits and what it runs.
  - id: remote-shell-server-location-check
    desc: Remote shell server profiles host and public IP
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [scripts, source]
    attack: T1219,T1082,T1016
    all:
      - id: micro-behaviors/communications/http/ip-discovery/
      - id: micro-behaviors/os/sysinfo/platform/files::os-release-open
    any:
      - id: objectives/command-and-control/channel/tunnel/relay::embedded-quick-tunnel-remote-shell
      - id: micro-behaviors/process/fd/stdio::python-subprocess-stdout-result-field
      - id: objectives/evasion/indicator-removal/history::interactive-shell-history-suppressed
    downgrade:
      any:
        - id: micro-behaviors/communications/http/server/authentication::signed-admin-server-context
