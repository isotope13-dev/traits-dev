defaults:
  for:
  - binaries
  - scripts
  platforms:
  - windows
  - linux
  crit: suspicious
  conf: 0.9
traits:
- id: ics-dir-schneider
  desc: Schneider Electric ICS directory
  conf: 0.92
  if:
    type: text
    regex: "(?i)Schneider\\s*Electric.{0,30}(Desal|Unity|SoMachine|EcoStruxure)"
  unless:
    - id: well-known/game/steamtools::member
    - id: well-known/lib/network/steamkit2::library
    - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
- id: ics-dir-siemens--rx-27
  desc: "Matches 'Siemens.'"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(Program Files|ProgramFiles).{0,80}Siemens.{0,30}(WinCC|Step\\s*7)"
- id: ics-dir-siemens--rx-28
  desc: "Matches '/usr/local/'"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(Program Files|ProgramFiles).{0,80}Siemens.{0,30}(TIA|SIMATIC)"
- id: ics-dir-siemens--rx-29
  desc: "Matches 'Program Files'"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(C:\\\\|/opt/).{0,80}Siemens.{0,30}(WinCC|Step\\s*7)"
- id: ics-dir-siemens--rx-30
  desc: "Matches 'Program Files'"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(C:\\\\|/opt/).{0,80}Siemens.{0,30}(TIA|SIMATIC)"
- id: ics-dir-siemens--rx-31
  desc: "Matches 'Siemens.'"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(/usr/local/).{0,80}Siemens.{0,30}(WinCC|Step\\s*7|TIA|SIMATIC)"
- id: ics-dir-siemens--rx-32
  desc: "Matches 'Siemens.'"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Siemens.{0,30}(WinCC|Step\s*7).{0,80}\b(Program Files|ProgramFiles)
- id: ics-dir-siemens--rx-33
  desc: "Matches '/usr/local/'"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Siemens.{0,30}(TIA|SIMATIC).{0,80}\b(Program Files|ProgramFiles)
- id: ics-dir-siemens--rx-34
  desc: 'Matches ''Siemens(WinCC Step7)(C:'''
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Siemens.{0,30}(WinCC|Step\s*7).{0,80}\b(C:\\|/opt/)
- id: ics-dir-siemens--rx-35
  desc: 'Matches ''Siemens(TIA SIMATIC)(C:'''
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Siemens.{0,30}(TIA|SIMATIC).{0,80}\b(C:\\|/opt/)
- id: ics-dir-siemens--rx-36
  desc: 'Matches ''Siemens(WinCC SIMATIC)'''
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Siemens.{0,30}(WinCC|Step\s*7|TIA|SIMATIC).{0,80}\b(/usr/local/)
- id: ics-dir-rockwell-path
  desc: Path prefix for Rockwell ICS software
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)(Program Files|ProgramFiles|/opt/|/usr/local/).{0,60}\bRockwell\b'
- id: ics-dir-rockwell-product
  desc: Rockwell ICS product name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bRockwell.{0,30}(RSLogix|FactoryTalk|Studio\s*5000)\b'
- id: ics-dir-water-treatment--rx-37
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(Desalination|Water\\s*Treatment)"
- id: ics-dir-water-treatment--rx-38
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(RO\\s*Systems|Hydro\\s*Systems)"
- id: ics-dir-water-treatment--rx-39
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(Aqua\\s*Solutions|DesalTech)"
- id: ics-dir-water-treatment--rx-40
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(IDE\\s*Technologies)"
- id: ics-dir-generic--rx-41
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(SCADA|PLC)"
- id: ics-dir-generic--rx-42
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(HMI|InTouch)"
- id: ics-dir-generic--rx-43
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(iFIX|Citect)"
- id: ics-dir-generic--rx-44
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(Wonderware)"
- id: ics-dir-safety-system--rx-45
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(Triconex|SafetyNet)"
- id: ics-dir-safety-system--rx-46
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(HIMA|Yokogawa)"
- id: ics-dir-safety-system--rx-47
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)(Program Files|ProgramFiles).{0,20}(ProSafe)"
composite_rules:
- id: ics-dir-rockwell
  desc: Rockwell Automation software directory
  crit: baseline
  conf: 0.92
  all:
  - id: ics-dir-rockwell-path
  - id: ics-dir-rockwell-product
  unless:
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
- id: ics-directory-discovery
  desc: ICS/OT software directory probing
  crit: suspicious
  conf: 0.92
  attack: T1083
  needs: 2
  any:
  - id: ics-dir-schneider
  - id: ics-dir-siemens
  - id: ics-dir-rockwell
  - id: ics-dir-water-treatment
  - id: ics-dir-generic
  - id: ics-dir-safety-system
  unless:
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-list
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
- id: ics-dir-siemens
  desc: Siemens ICS software directory
  crit: baseline
  conf: 0.92
  any:
  - id: ics-dir-siemens--rx-27
  - id: ics-dir-siemens--rx-28
  - id: ics-dir-siemens--rx-29
  - id: ics-dir-siemens--rx-30
  - id: ics-dir-siemens--rx-31
  - id: ics-dir-siemens--rx-32
  - id: ics-dir-siemens--rx-33
  - id: ics-dir-siemens--rx-34
  - id: ics-dir-siemens--rx-35
  - id: ics-dir-siemens--rx-36
  unless:
  - id: metadata/file/catalog/identity/
- id: ics-dir-water-treatment
  desc: Water treatment software directory
  crit: baseline
  conf: 0.92
  any:
  - id: ics-dir-water-treatment--rx-37
  - id: ics-dir-water-treatment--rx-38
  - id: ics-dir-water-treatment--rx-39
  - id: ics-dir-water-treatment--rx-40
- id: ics-dir-generic
  desc: Generic ICS/SCADA software directory
  crit: baseline
  conf: 0.88
  any:
  - id: ics-dir-generic--rx-41
  - id: ics-dir-generic--rx-42
  - id: ics-dir-generic--rx-43
  - id: ics-dir-generic--rx-44
- id: ics-dir-safety-system
  desc: Safety system software directory
  crit: baseline
  conf: 0.92
  any:
  - id: ics-dir-safety-system--rx-45
  - id: ics-dir-safety-system--rx-46
  - id: ics-dir-safety-system--rx-47
