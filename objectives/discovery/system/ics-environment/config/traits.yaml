composite_rules:
- id: ics-config-discovery
  desc: ICS/OT configuration file probing
  crit: suspicious
  conf: 0.92
  attack: T1083
  any:
  - id: ics-config-desal
  - id: ics-config-water
  - id: ics-config-generic
  - id: ics-config-power
  - id: ics-config-safety
- id: ics-config-desal
  desc: Desalination/RO configuration file path
  crit: suspicious
  conf: 0.95
  any:
  - id: ics-config-desal--rx-48
  - id: ics-config-desal--rx-49
  - id: ics-config-desal--rx-50
  - id: ics-config-desal--rx-51
- id: ics-config-water
  desc: Water treatment configuration file path
  crit: suspicious
  conf: 0.95
  any:
  - id: ics-config-water--rx-52
  - id: ics-config-water--rx-53
  - id: ics-config-water--rx-54
- id: ics-config-generic
  desc: Generic ICS/SCADA configuration file
  crit: suspicious
  conf: 0.88
  any:
  - id: ics-config-generic--rx-55
  - id: ics-config-generic--rx-56
  - id: ics-config-generic--rx-57
  - id: ics-config-generic--rx-58
  - id: ics-config-generic--rx-59
- id: ics-config-power
  desc: Power grid configuration file path
  crit: suspicious
  conf: 0.95
  any:
  - id: ics-config-power--rx-60
  - id: ics-config-power--rx-61
  - id: ics-config-power--rx-62
  - id: ics-config-power--rx-63
- id: ics-config-safety
  desc: Safety system configuration file path
  crit: suspicious
  conf: 0.95
  any:
  - id: ics-config-safety--rx-64
  - id: ics-config-safety--rx-65
  - id: ics-config-safety--rx-66
  - id: ics-config-safety--rx-67
  - id: ics-config-safety--rx-68
