defaults:
  for:
  - binaries
  - scripts
  platforms:
  - windows
  - linux
  crit: suspicious
  conf: 0.9
traits:
- id: ics-config-desal--rx-48
  desc: Regex component marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "(?i)(DesalConfig|ROConfig)\\.(ini|conf)\\b"
- id: ics-config-desal--rx-49
  desc: Regex component marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "(?i)(DesalConfig|ROConfig)\\.(cfg|xml)\\b"
- id: ics-config-desal--rx-50
  desc: Regex component marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "(?i)(DesalSettings|RO_PumpSettings)\\.(ini|conf)\\b"
- id: ics-config-desal--rx-51
  desc: Regex component marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "(?i)(DesalSettings|RO_PumpSettings)\\.(cfg|xml)\\b"
- id: ics-config-water--rx-52
  desc: Regex component marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "(?i)(WaterTreatment|ChlorineControl|SalinityControl)\\.(ini|dat)\\b"
- id: ics-config-water--rx-53
  desc: Regex component marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "(?i)(WaterTreatment|ChlorineControl|SalinityControl)\\.(conf|cfg)\\b"
- id: ics-config-water--rx-54
