  - id: ics-process-reverse-osmosis--rx-8
  - id: ics-process-reverse-osmosis--rx-9
  - id: ics-process-reverse-osmosis--rx-10
  - id: ics-process-reverse-osmosis--rx-11
- id: ics-process-power-grid
  desc: Power grid control process name reference
  crit: baseline
  conf: 0.92
  any:
