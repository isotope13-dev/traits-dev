- id: ics-vendor-process--rx-21
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(RSLogix|TIA\\s*Portal)\\b.{0,40}(process\\b|Program Files)"
- id: ics-vendor-process--rx-22
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(Citect|Wonderware)\\b.{0,40}(process\\b|Program Files)"
- id: ics-vendor-process--rx-23
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(GE\\s*Proficy)\\b.{0,40}(process\\b|Program Files)"
- id: ics-vendor-process--rx-24
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(RSLogix|TIA\\s*Portal)\\b.{0,40}(ProgramFiles)"
- id: ics-vendor-process--rx-25
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(Citect|Wonderware)\\b.{0,40}(ProgramFiles)"
- id: ics-vendor-process--rx-26
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(GE\\s*Proficy)\\b.{0,40}(ProgramFiles)"
composite_rules:
- id: ics-process-discovery
  desc: ICS/OT process name discovery
  crit: suspicious
  conf: 0.92
  attack: T1057
  needs: 2
  any:
  - id: ics-process-plc
  - id: ics-process-scada-generic
  - id: ics-process-water-treatment
  - id: ics-process-reverse-osmosis
  - id: ics-process-power-grid
  - id: ics-process-gas-pipeline
  - id: ics-vendor-process
  unless:
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-list
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
- id: ics-process-scada-generic
  desc: Generic SCADA/ICS process name reference
  crit: baseline
  conf: 0.88
  any:
  - id: ics-process-scada-generic--rx-1
  - id: ics-process-scada-generic--rx-2
  - id: ics-process-scada-generic--rx-3
- id: ics-process-water-treatment
