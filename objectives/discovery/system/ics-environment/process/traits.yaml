defaults:
  for:
  - binaries
  - scripts
  platforms:
  - windows
  - linux
  crit: suspicious
  conf: 0.9
traits:
- id: ics-process-plc
  desc: PLC controller process name reference
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(DesalPLC|WaterPLC|OsmosisPLC|ROController)\\b"
- id: ics-process-scada-generic--rx-1
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "\\b((?i:ScadaBR|WinCC)|iFIX)\\b"
- id: ics-process-scada-generic--rx-2
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "\\b((?i:FactoryTalk|Wonderware\\s+InTouch)|iFIX)\\b"
- id: ics-process-scada-generic--rx-3
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "\\b((?i:AVEVA\\s+InTouch)|iFIX)\\b"
- id: ics-process-water-treatment--rx-4
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(ChlorineCtrl|ChlorineDose)\\b"
- id: ics-process-water-treatment--rx-5
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(WaterTreat|BrineControl)\\b"
- id: ics-process-water-treatment--rx-6
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(SalinityCtrl)\\b"
- id: ics-process-reverse-osmosis--rx-7
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(ReverseOsmosis|RO[-_]?(Pump|Filter|Membrane))\\b"
- id: ics-process-reverse-osmosis--rx-8
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(SeaWaterRO|SchneiderRO)\\b"
- id: ics-process-reverse-osmosis--rx-9
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(DamRO[-_]?(Controller|Service)|DesalFlow[-_]?(Controller|Service))\\b"
- id: ics-process-reverse-osmosis--rx-10
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(DamRO[-_]?(Controller|Service)|DesalFlow[-_]?(Process))\\b"
- id: ics-process-reverse-osmosis--rx-11
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(DamRO[-_]?(Process)|DesalFlow[-_]?(Controller|Service|Process))\\b"
- id: ics-process-power-grid--rx-12
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(GridController|LoadDispatch)\\b"
- id: ics-process-power-grid--rx-13
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(BreakerCtrl|FrequencyCtrl)\\b"
- id: ics-process-power-grid--rx-14
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(SubstationMgr|PowerSCADA)\\b"
- id: ics-process-gas-pipeline--rx-15
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(PipelineCtrl|CompressorCtrl)\\b"
- id: ics-process-gas-pipeline--rx-16
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(GasFlowCtrl|PressureMonitor)\\b"
- id: ics-process-gas-pipeline--rx-17
  desc: Regex component marker
  crit: baseline
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\b(GasLeakDetect)\\b"
- id: ics-vendor-process--rx-18
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(RSLogix|TIA\\s*Portal)\\b.{0,40}(\\.exe\\b|service\\b)"
- id: ics-vendor-process--rx-19
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: "(?i)\\b(Citect|Wonderware)\\b.{0,40}(\\.exe\\b|service\\b)"
- id: ics-vendor-process--rx-20
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
