# Windows activity-state discovery used by post-access operators.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1082

traits:
  - id: ps-reboot-required-query
    desc: PowerShell pending-reboot state query
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)Microsoft\.Update\.SystemInfo\s*\]::RebootRequired\b'
