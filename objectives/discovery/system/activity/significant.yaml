defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: significant-recon
    desc: Significant system reconnaissance activity
    crit: notable
    needs: 2
    any:
      - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
      - id: micro-behaviors/fs/directory/readdir::node-readdir-repeated
      - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-post-cooccurrence
    unless:
      - id: objectives/supply-chain/recon-exfil/host-profile/install-context::vscode-uninstall-profile-post-context
      - id: well-known/lib/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
