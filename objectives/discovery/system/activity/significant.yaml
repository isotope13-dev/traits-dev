defaults:
  platforms:
  - unix
  - windows
  - macos
composite_rules:
- id: significant-recon
  desc: Significant system reconnaissance activity
  crit: notable
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/hardware::js-sysinfo-multi
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-repeated
  unless:
  - id: well-known/lib/development/vscode::vscode-uninstall-profile-post-context
  - id: metadata/path/directory::test-directory-component
