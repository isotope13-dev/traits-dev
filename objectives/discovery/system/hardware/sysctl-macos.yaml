defaults:
  platforms:
  - macos
  for:
  - scripts
  - macho
  attack: T1082
  mbc: E1082
traits:
- id: system-info-collector-output--rx-1
  desc: "Matches 'SYSTEM_INFO'"
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(SYSTEM_INFO|HOST_INFO)='
- id: system-info-collector-output--rx-2
  desc: "Matches 'HARDWARE_INFO'"
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(HARDWARE_INFO|HOST_OS)='
- id: system-info-collector-output--rx-3
  desc: "Matches 'HOST_ARCH'"
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(HOST_ARCH|CPU_MODEL)='
- id: system-info-collector-output--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(CPU_VENDOR)='
- id: ioreg-screen-lock
  desc: Check screen lock status via ioreg
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: CGSSessionScreenIsLocked
  downgrade:
    any:
    - id: metadata/binary/vendor/
    - id: metadata/signed/platform::apple
composite_rules:
- id: system-info-collector-output
  desc: System-info collector echoes structured fields
  crit: component
  conf: 0.9
  for: [shell]
  any:
  - id: system-info-collector-output--rx-1
  - id: system-info-collector-output--rx-2
  - id: system-info-collector-output--rx-3
  - id: system-info-collector-output--rx-4
