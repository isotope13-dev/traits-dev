defaults:
  platforms:
  - macos
  for:
  - scripts
  - macho
  attack: T1082
  mbc: E1082
traits:
- id: system-info-collector-output--rx-1
  desc: "Matches 'SYSTEM_INFO'"
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(SYSTEM_INFO|HOST_INFO)='
  count_max: 1018445
- id: system-info-collector-output--rx-2
  desc: "Matches 'HARDWARE_INFO'"
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(HARDWARE_INFO|HOST_OS)='
  count_max: 1018446
- id: system-info-collector-output--rx-3
  desc: "Matches 'HOST_ARCH'"
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(HOST_ARCH|CPU_MODEL)='
  count_max: 1018447
- id: system-info-collector-output--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'echo\s+"?(CPU_VENDOR)='
  count_max: 1018448
- id: ioreg-screen-lock
  desc: Check screen lock status via ioreg
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: CGSSessionScreenIsLocked
  downgrade:
    any:
    - id: metadata/binary/vendor/
    - id: metadata/signed/platform::apple
composite_rules:
- id: system-profiling-comp
  desc: Comprehensive macOS system profiling
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/hardware::sysctl-hw-model-key
  - id: micro-behaviors/os/sysinfo/cpu::sysctl-cpu-brand-string
  - id: micro-behaviors/os/sysinfo/config::sw-vers-product-version
  unless:
  - id: metadata/package/quality/benign-context::benign-app-fp-context
  - id: well-known/app/ai/assistant/apliarte-ai::apliarte-ai-local-setup-context
  - id: well-known/app/system/quickemu
- id: system-info-collector-output
  desc: System-info collector echoes structured fields
  crit: component
  conf: 0.9
  for: [shell]
  any:
  - id: system-info-collector-output--rx-1
  - id: system-info-collector-output--rx-2
  - id: system-info-collector-output--rx-3
  - id: system-info-collector-output--rx-4
