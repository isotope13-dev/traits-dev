defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1082
  mbc: E1082
traits:
  - id: wmic-video-controller
    desc: Windows WMIC VideoController query
    conf: 0.9
    if:
      type: text
      regex: wmic\s+path\s+Win32_VideoController
  - id: wmi-video-controller-query
    desc: Windows WMI VideoController SQL query
    conf: 0.95
    if:
      type: text
      regex: SELECT\s+(Name|\*)\s+FROM\s+Win32_VideoController
  - id: xrandr-query
    desc: Linux xrandr query
    conf: 0.9
    if:
      type: text
      regex: xrandr\s+--(current|verbose|prop)
  - id: display-resolution-discovery
    desc: Discover screen or display resolution
    conf: 0.8
    if:
      type: text
      regex: xrandr\s+--current|CurrentVerticalResolution
    unless:
      - id: well-known/lib/platform/wmi::wmi-win32-provider-versioninfo
composite_rules:
  - id: display-resolution-discovery-any
    desc: Discover screen or display resolution
    conf: 0.8
    any:
      - id: wmic-video-controller
      - id: display-resolution-discovery
