defaults:
  platforms: [windows, linux]
  for: [javascript, typescript, tar, zip]

composite_rules:
  - id: objectives/discovery/system/fingerprint/user::npm-postinstall-collects-host-and-account-profile
    desc: npm postinstall executes whoami and collects host identity
    crit: suspicious
    conf: 0.98
    attack: T1195.002,T1082,T1033
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: package
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/discovery/account/enum::js-wrapped-whoami-exec
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-platform-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call

  # Environment key names are less sensitive than their values, but their
  # unsolicited export still fingerprints the install host and its CI setup.
