defaults:
  crit: hostile
  platforms:
  - windows
  for:
  - javascript
  - typescript
  attack: T1105
  mbc: B0023
composite_rules:
- id: node-obfuscated-recon-exec-launch
  desc: Encoded whoami and Node command execution references
  conf: 0.98
  attack: T1033,T1059.007,T1027
  near_bytes: 2048
  all:
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
  - id: objectives/anti-static/obfuscation/encoding/base64::whoami-base64
  - id: micro-behaviors/process/interpreter/node::node-interpreter-target
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
