# Reading the host name and the token's elevation and labelling it "Local
# admin" builds the host card a backdoor sends home when it registers, telling
# the operator what the foothold can do. The JAVS `fffmpeg.exe` implant (2024)
# sent hostname, arch, OS version and "Local admin"/"User".
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1082,T1033

composite_rules:
  - id: elevation-labelled-host-profile
    desc: Host name plus token-elevation "Local admin" label
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/privilege/token/use::local-admin-privilege-label
      - id: micro-behaviors/os/privilege/token/use::get-token-information
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
