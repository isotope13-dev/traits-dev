# Host-profile collection sent through a Go HTTP agent.  This is intentionally
# family-agnostic: the signal is the combination of multiple host sources,
# input-device state, serialization/encoding, and an outbound request.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1082,T1033,T1016,T1056.001,T1041
  mbc: E1082,E1033,E1016,E1056.001,E1041

composite_rules:
  - id: go-account-workdir-profile
    desc: Go collects redundant user and working-directory identity
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/process/user/query::logname-exec-argument
      - id: micro-behaviors/os/sysinfo/hostname::user-current
      - id: micro-behaviors/fs/read/directory::getwd-call
    near_bytes: 1600
