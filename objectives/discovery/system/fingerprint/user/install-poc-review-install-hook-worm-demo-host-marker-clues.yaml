defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
  attack: T1195.002
composite_rules:
  - id: install-hook-worm-demo-host-marker-clues
    for: [javascript, package.json, npm, tar]
    desc: Worm demo install hook has host, temp path, and write clues
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-index-entry
      - id: metadata/lang/natural/phrasing/security::worm-demo-stub-label
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
      - id: micro-behaviors/fs/path/hidden::node-tmpdir-hidden-entry
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call

