defaults:
  platforms: [windows, unix]
  for: [class, jar, zip]
  attack: T1082
traits:
  - id: java-host-domain-fields
    desc: Java host domain fields
    crit: notable
    conf: 0.78
    for: [class]
    if:
      type: text
      regex: 'hostname.{0,120}domain|domain.{0,120}hostname'
  - id: java-user-runas-fields
    desc: Java user privilege fields
    crit: notable
    conf: 0.78
    for: [class]
    if:
      type: text
      regex: 'username.{0,120}runas|runas.{0,120}username'
  - id: java-os-version-fields
    desc: Java OS version fields
    crit: notable
    conf: 0.75
    for: [class]
    if:
      type: text
      regex: 'version_os.{0,120}version_build|versionBuild.{0,120}versionOs'
  - id: java-network-interface-enum
    desc: Java enumerates network interfaces
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      substr: NetworkInterface.getNetworkInterfaces
  - id: java-bsd-sysctl-roster
    desc: Java queries BSD sysctl keys
    crit: component
    conf: 0.88
    for: [java]
    count_min: 3
    if:
      type: text
      substr: "sysctl"
  - id: java-process-list-command
    desc: Java runs process list command
    crit: notable
    conf: 0.86
    for: [java]
    if:
      type: text
      substr: 'new ProcessBuilder("ps", "aux")'
  - id: java-network-state-command
    desc: Java runs netstat command
    crit: notable
    conf: 0.86
    for: [java]
    if:
      type: text
      substr: 'new ProcessBuilder("netstat", "-an")'
  - id: java-aix-os-command-roster
    desc: Java collects AIX OS command output
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: '(uname -a|oslevel -s|prtconf)'
  - id: java-aix-vm-command-roster
    desc: Java collects AIX VM command output
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: '(lparstat -i|odmget|/proc/cpuinfo)'

composite_rules:
  - id: java-aix-system-command-roster
    desc: Java AIX system command roster
    crit: component
    conf: 0.9
    for: [java]
    needs: 2
    any:
      - id: java-aix-os-command-roster
      - id: metadata/lang/source/naming/action/token::java-system-state-command-vocabulary
      - id: java-aix-vm-command-roster
  - id: java-host-identity-json
    desc: Java host identity JSON collection
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/sysinfo/profile::systeminfo-command-reference
      - id: metadata/import/framework::jvm-org-json-object-reference
    any:
      - id: java-host-domain-fields
      - id: java-user-runas-fields
      - id: java-os-version-fields
    needs: 2
  - id: java-broad-host-fingerprint-source
    desc: Java broad host fingerprint collection
    crit: suspicious
    conf: 0.94
    for: [java]
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::java-repeated-system-property-access
    any:
      - id: java-network-interface-enum
      - id: java-bsd-sysctl-roster
      - id: java-process-list-command
      - id: java-network-state-command
      - id: java-aix-system-command-roster
    needs: 1

  - id: jvm-host-recon-command-roster
    desc: JVM embeds multiple host discovery commands
    crit: suspicious
    conf: 0.95
    for: [class]
    all:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/hostname::jvm-hostname-command-literal
      - id: micro-behaviors/os/sysinfo/process::jvm-whoami-command-literal
      - id: micro-behaviors/os/sysinfo/platform/kernel::jvm-uname-command-literal
      - id: micro-behaviors/fs/directory/cwd::jvm-pwd-command-literal
