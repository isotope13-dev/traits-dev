defaults:
  platforms: [windows, unix]
  for:
    - php
  mbc: E1082
  attack: T1082
traits:
  # php_sapi_name relocated to micro-behaviors/os/sysinfo/platform/runtime::
  # php-sapi-name, alongside phpversion/php_uname — asking the runtime whether
  # it is CLI or a web SAPI is neutral plumbing every PHP framework does, not
  # host reconnaissance. Same reasoning as getcwd below.
  # getcwd relocated to micro-behaviors/fs/directory/cwd::php-getcwd —
  # querying the working directory is neutral filesystem plumbing, not
  # reconnaissance. The fingerprint/webshell intent lives in the composites
  # below, which reference that atom cross-tier.
  - id: rendered-phpinfo-dump
    desc: Rendered PHP configuration disclosure page
    crit: notable
    conf: 0.9
    for: [php, html]
    if:
      type: text
      regex: '<title>PHP .{0,80} - phpinfo\(\)</title>'

composite_rules:
  - id: system-fingerprint-comp
    desc: System fingerprinting pattern
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::php-os-constant
      - id: micro-behaviors/os/sysinfo/platform/runtime::php-uname-call
      - id: micro-behaviors/fs/directory/cwd::php-getcwd
      - id: micro-behaviors/os/sysinfo/platform/runtime::server-software-access
    # Two runtime facts are common library plumbing (PHPMailer, for example,
    # uses PHP_OS for line endings and php_uname for Message-ID hostnames).
    # Three distinct facts are a materially stronger fingerprinting pattern.
    needs: 3
    unless:
      - id: well-known/lib/web/workerman::worker-core-source
      - id: well-known/lib/core/hypertube::hypertube-benign-runtime-context
      - id: well-known/lib/runtime/php-runtime::source-tree
      - id: well-known/app/publishing/wordpress-plugins/
      - id: well-known/app/publishing/gsheetconnector::gsheetconnector-source-context
      - id: well-known/lib/crypto/phpseclib::library-context
      - id: well-known/tool/development/composer/
      - id: well-known/lib/development/php-codesniffer::php-codesniffer-library
      - id: well-known/app/publishing/quotes-and-tips::bestwebsoft-system-info-marker
  - id: webshell-recon
    desc: Webshell reconnaissance pattern
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/command-and-control/backdoor/webshell/exec::php-shell-functional
    any:
      - id: micro-behaviors/fs/directory/cwd::php-getcwd
      - id: micro-behaviors/os/sysinfo/platform/runtime::php-os-constant
      - id: micro-behaviors/os/sysinfo/platform/runtime::server-software-access
    unless:
      - id: well-known/lib/runtime/php-runtime::source-tree
      - id: well-known/lib/development/php-codesniffer::php-codesniffer-library
      - id: micro-behaviors/os/user/account::php-get-current-user
      # Packed PHP archive (phar) stub — recon tokens here are not a webshell.
      - id: well-known/app/publishing/wordpress-plugins/
      - id: metadata/file/magic/identity::php-archive
      - id: well-known/app/publishing/civicrm/
