# A Python source distribution whose build hook launches a bundled native
# program that inventories the install host. The loader rule establishes that
# setup.py overrides a pip-dispatched command, makes its staged file executable,
# launches it, and suppresses failures; the discovery rule establishes what
# the native member is built to inspect. Neither ordinary extension building
# nor an audio/data asset initializer needs this host/container/network profile.
defaults:
  platforms: [linux]
  for: [python, python_sdist, tar, zip, elf, rust]
  attack: "T1195.002,T1082,T1613"

composite_rules:
  - id: python-build-hook-native-host-profiler
    desc: Python build hook launches a native host/container profiler
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/dropper/native-loader::setup-hook-chmods-and-runs-binary
      - id: objectives/discovery/system/fingerprint/info::native-linux-host-container-network-profile

