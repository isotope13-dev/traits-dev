# A Python source distribution whose build hook launches a bundled native
# program that inventories the install host. The setup hook evidence combines
# a pip command override, executable permissions, process execution and silent
# error handling. The discovery rule identifies native host-profile capabilities;
# the association is inferred from their presence in the same archive.
defaults:
  platforms: [linux]
  for: [python, python_sdist, tar, zip, elf, rust]
  attack: "T1195.002,T1082,T1613"

composite_rules:
  - id: python-build-hook-native-host-profiler
    desc: Python build hook launches a native host/container profiler
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/execution/trigger/package/build::setup-hook-chmod-process-clues
      - id: objectives/discovery/system/fingerprint/info::native-linux-host-container-network-profile

