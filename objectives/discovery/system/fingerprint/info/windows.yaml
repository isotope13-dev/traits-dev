# Win32 System Profiling
# Composite: multiple system info APIs indicate host fingerprinting for C2 beacon
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1082"

composite_rules:
  # The three field-key atoms are neutral schema names and live in
  # micro-behaviors/data/source/syntax/schema/native.yaml; the profile intent
  # is the combination.
  - id: native-host-profile-schema
    desc: Native Windows host-profile schema
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/data/source/syntax/schema::ram-total-field-key
      - id: micro-behaviors/data/source/syntax/schema::computer-field-key
      - id: micro-behaviors/data/source/syntax/schema::screen-w-field-key

  - id: win32-deep-recon-recognized-marker
    desc: Recognized Win32 system profiling marker
    crit: component
    conf: 0.9
    # Written as directory references rather than leaf ids. A rule that
    # suppresses on this marker expands it transitively, and each leaf summed
    # into that rule's suppression budget -- enough on its own to push
    # `win32-deep-recon` and `win32-system-profiling` over the cap. A directory
    # reference counts once and does not sum its members.
    any:
      - id: metadata/signed/unknown::microsoft-windows
      - id: metadata/binary/vendor::microsoft-corp-marker
      - id: well-known/app/system/dlink-wlan/
      - id: well-known/lib/runtime/native-platform/mozilla-nspr/
      - id: well-known/app/storage/belkin-local-backup/
      - id: metadata/binary/installer/script::inno-setup
      - id: metadata/binary/installer/builder::wix-bootstrapper-manifest
      - id: well-known/lib/ui/qt
      - id: well-known/lib/runtime/compiled/gnu-libintl::gnu-libintl-library
      - id: well-known/tool/sysadmin/infozip
      - id: well-known/tool/detection/watchmen/
      - id: well-known/tool/sysadmin/winrar/
      - id: well-known/app/utility/fastfetch/
      - id: well-known/lib/media/sharp-libvips/

  - id: win32-system-profiling
    desc: Win32 host profiling via multiple APIs
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/sysinfo/
      - id: micro-behaviors/fs/enumerate/volume::get-volume-info
    needs: 2
    unless:
      - id: win32-deep-recon-recognized-marker
      - id: well-known/app/development/reg-devshell/
      - id: well-known/lib/runtime/scripted/node-runtime/
  # Deep recon: 4+ distinct info categories = comprehensive fingerprinting
  - id: win32-deep-recon
    desc: Queries four or more host-info categories
    # Notable, not suspicious. Four distinct host-info categories is what
    # comprehensive fingerprinting looks like, but it is equally what an
    # installer, a diagnostics tool or a hardware utility looks like -- which is
    # why this rule needed a nineteen-member "recognized" carve-out to stay
    # quiet. Reading the host is not by itself an attack; the composites that
    # pair this profile with exfiltration or a C2 beacon carry the conviction.
    # The rule was previously suppressed by an `unless:` naming its own
    # directory, so it never fired at all and the over-pitch was invisible.
    crit: notable
    conf: 0.9
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/hardware/
      - id: micro-behaviors/os/sysinfo/platform/locale::locale-environment-fingerprint
      - id: micro-behaviors/network/interface/
      - id: micro-behaviors/os/sysinfo/hostname::net-domain-join-info
      - id: micro-behaviors/os/network/tunnel::android-add-route-method
      - id: micro-behaviors/os/network/tunnel::android-vpn-add-route-source
      - id: micro-behaviors/os/network/share::node-exec-net-use-enumeration
      - id: micro-behaviors/os/sysinfo/network::route-and-adapter-discovery
      - id: micro-behaviors/os/sysinfo/network::host-network-fingerprint-surface
      - id: micro-behaviors/os/network/tunnel::ios-tunnel-interface-token
      - id: micro-behaviors/os/network/tunnel::ios-tunnel-source-token
      - id: micro-behaviors/os/network/tunnel::ios-tunnel-destination-token
      - id: micro-behaviors/os/network/tunnel::ios-tunnel-vrf-token
      - id: micro-behaviors/os/network/tunnel::ios-tunnel-configuration-vocabulary
      - id: micro-behaviors/os/network/tunnel::android-vpn-service-class
      - id: micro-behaviors/os/network/tunnel::android-vpn-builder
      - id: micro-behaviors/os/network/tunnel::android-vpn-manifest-binding
      - id: micro-behaviors/os/network/tunnel::android-vpn-disallowed-application
      - id: micro-behaviors/os/network/tunnel::android-vpn-allowed-application
      - id: micro-behaviors/os/network/tunnel::android-vpn-service-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-builder-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-disallowed-application-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-play-services-allowlist-call
      - id: micro-behaviors/os/network/tunnel::android-vpn-application-exclusion-filter
      - id: micro-behaviors/os/network/tunnel::android-vpn-application-exclusion-filter-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-play-services-exclusion
      - id: micro-behaviors/os/network/tunnel::android-vpn-play-services-allowlist-bytecode
      - id: micro-behaviors/hardware/wireless/network::wlan-open-handle
      - id: micro-behaviors/hardware/wireless/network::wlan-enum-interfaces
      - id: micro-behaviors/hardware/wireless/network::wlan-get-available-network-list
      - id: micro-behaviors/hardware/wireless/network::wlan-get-profile-list
      - id: micro-behaviors/hardware/wireless/network::wlan-get-profile
      - id: micro-behaviors/hardware/wireless/network::wlan-query-interface
      - id: micro-behaviors/hardware/wireless/network::wlan-api-library-reference
      - id: micro-behaviors/hardware/wireless/network::wlan-api-provider
      - id: micro-behaviors/hardware/wireless/network::bluetooth-find-first-radio
      - id: micro-behaviors/hardware/wireless/network::bluetooth-find-first-device
      - id: micro-behaviors/hardware/wireless/network::wlan-network-recon
      - id: micro-behaviors/hardware/wireless/network::wlan-profile-enumeration
      - id: micro-behaviors/hardware/wireless/network::wlan-bssid-profile-harvest
      - id: micro-behaviors/hardware/wireless/network::bluetooth-device-recon
      - id: micro-behaviors/process/enumerate/psapi::psapi-process-scan
      - id: micro-behaviors/fs/enumerate/volume::get-volume-info
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
    downgrade:
      any:
        - id: well-known/lib/platform/browser-automation/
        - id: well-known/app/utility/ventoy/
        - id: well-known/tool/reverse-engineering/frida/
        - id: well-known/app/storage/qbittorrent/
    unless:
      - id: win32-deep-recon-recognized-marker
      - id: well-known/app/development/reg-devshell/
      - id: well-known/app/utility/siw/
  - id: inno-installer-host-profiling
    desc: Inno installer profiles host storage
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/installer/script::inno-setup
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-version-ex
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
      - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
      - id: micro-behaviors/fs/enumerate/volume::get-volume-info
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
    unless:
      # Installers routinely check OS version, disk capacity, and mounted
      # volumes before selecting files; a recognized installer family is not
      # host reconnaissance by itself.
      - id: metadata/binary/installer/family/
