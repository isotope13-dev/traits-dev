# Win32 System Profiling
# Composite: multiple system info APIs indicate host fingerprinting for C2 beacon
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1082"

composite_rules:
  # The three field-key atoms are neutral schema names and live in
  # the memory and screen field observations; the profile intent
  # is the combination.
  - id: native-host-profile-schema
    desc: Native Windows host-profile schema
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/sysinfo/memory::ram-total-field-key
      - id: micro-behaviors/data/serialize/schema-system::computer-field-key
      - id: micro-behaviors/hardware/display/screen::screen-w-field-key

  - id: inno-installer-host-profiling
    desc: Inno installer profiles host storage
    crit: notable
    conf: 0.92
    all:
      - id: well-known/tool/packaging/inno-setup-loader::inno-setup
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-version-ex
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
      - id: micro-behaviors/os/sysinfo/disk::get-disk-free-space
      - id: micro-behaviors/os/sysinfo/disk::get-volume-info
      - id: micro-behaviors/fs/enumerate/drives::get-drive-type
    unless:
      # Installers routinely check OS version, disk capacity, and mounted
      # volumes before selecting files; a recognized installer family is not
      # host reconnaissance by itself.
      - id: metadata/installer/product/
