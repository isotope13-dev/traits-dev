# Native Linux programs that carry a broad, adjacent set of paths for host,
# container, and network-state discovery. Each path is neutral on its own;
# their conjunction distinguishes an inventory/profiling routine from a
# library that happens to inspect one procfs interface.
defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1082,T1613"

composite_rules:
  - id: native-linux-host-container-network-profile
    desc: Native binary carries host, container, and network profile paths
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/proc/system::linux-system-profile-path-set
      - id: micro-behaviors/fs/proc/container::container-pid1-cgroup
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
