# Cloud and runner reconnaissance performed by a Node install hook.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, archives]
  attack: T1082,T1552.005,T1195.002

composite_rules:
  - id: npm-preinstall-cloud-metadata-post
    desc: npm preinstall probes cloud metadata and posts
    crit: hostile
    conf: 0.99
    for: [archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: objectives/supply-chain/recon-exfil/install-hook::alibaba-metadata-url
      - id: micro-behaviors/communications/http/request/client::http-request
      - id: micro-behaviors/communications/http/request/client::request-write-call
      - id: micro-behaviors/os/env/access::node-process-env-object-field
