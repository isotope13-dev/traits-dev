# Cloud and runner reconnaissance performed by a Node install hook.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1082,T1552.005,T1195.002

composite_rules:
  - id: node-cloud-metadata-post-profile
    desc: Node script combines cloud metadata and HTTP request clues
    crit: component
    for: [javascript]
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-metadata-endpoint-reference
      - id: micro-behaviors/communications/http/request/client::http-request
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
      - id: micro-behaviors/os/env/enumerate/entries::node-process-env-object-field
  - id: npm-preinstall-cloud-metadata-post
    desc: npm preinstall and Node cloud metadata request profile
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: node-cloud-metadata-post-profile
