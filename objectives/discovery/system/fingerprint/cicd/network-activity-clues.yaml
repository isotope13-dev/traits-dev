defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
  crit: notable
composite_rules:
- id: runner-env-reference-beside-network-activity
  desc: Runner env reference beside network activity
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/cicd/runner::runner-name
  any:
  - id: micro-behaviors/communications/socket/connect/
  - id: micro-behaviors/communications/http/request
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  - id: micro-behaviors/communications/dns/lookup/
  - id: objectives/exfiltration/messaging/
  - id: micro-behaviors/communications/http/webhook::discord-webhook-api
  - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
  - id: objectives/exfiltration/cloud/
  - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
  - id: micro-behaviors/os/application/target/network::rclone-exe-ref
  - id: micro-behaviors/communications/http/services/drive-google::googleapis-drive
  - id: objectives/exfiltration/oob/
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-net-socket-connect
  - id: micro-behaviors/communications/http/download/wget::npm-preinstall-wget
  - id: objectives/exfiltration/stealer/file/selected-path::file-search-telegram-send
