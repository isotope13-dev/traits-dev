# CI/CD Runner Fingerprinting - Ruby
# Detects CI/CD runner fingerprinting via ENV in Ruby gems
# ATT&CK: T1082 (System Information Discovery)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [ruby]
  crit: suspicious
  conf: 0.85
composite_rules:
  # Until 2026-09 this also listed micro-behaviors/os/env/cicd/ in unless:
  # -- the same directory as its any: leg -- so it never fired. The ref once
  # named hostname/getlogin traits that lived in that directory and have since
  # moved out. Revived, a single CI env read matched bundler and rubygems'
  # ci_detector, codecov, coveralls, danger, fastlane and knapsack: reading
  # the runner environment is what CI-aware gems do, so this is a notable
  # observation (as is the cross-language cicd::runner-fingerprinting). The
  # intent lives in the supply-chain composites that pair it with egress.
  - id: ruby-runner-fingerprinting
    desc: CI/CD runner fingerprinting via ENV
    crit: notable
    attack: "T1082"
    any:
      - id: micro-behaviors/os/env/cicd/
    unless:
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
      - id: micro-behaviors/process/user/query::ruby-etc-user-lookup
      - id: micro-behaviors/os/env/cicd::github-workflow-log-command
