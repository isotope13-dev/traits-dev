defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-extconf-tracking-service-clues
    desc: Ruby extension script has tracking service and HTTP client clues
    crit: notable
    conf: 0.95
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: metadata/import/package::ruby-http-client-imports
      - id: objectives/discovery/system/fingerprint/network::tracking-service-lookup
