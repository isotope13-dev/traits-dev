defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1016
traits:
- id: webrtc-empty-ice-servers
  desc: WebRTC peer connection without ICE servers
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'iceServers\s*:\s*\[\s*\]'
- id: local-ip-list-symbol
  desc: Local IP list symbol
  crit: notable
  conf: 0.85
  if:
    type: symbol
    regex: '(^|\.)(localIpList|ipAddressList)$'
composite_rules:
- id: webrtc-local-ip-discovery
  desc: WebRTC local IP discovery
  crit: notable
  conf: 0.94
  # WebRTC API atoms are neutral call-client plumbing and live in
  # micro-behaviors/communications/proxy/turn; the leak shape is this
  # combination with an empty ICE-server list or a local-IP list.
  all:
  - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
  - id: micro-behaviors/communications/proxy/turn::webrtc-ice-candidate-handler
  - id: micro-behaviors/communications/proxy/turn::webrtc-ice-candidate-line-read
  any:
  - id: webrtc-empty-ice-servers
  - id: local-ip-list-symbol
  - id: micro-behaviors/communications/proxy/turn::webrtc-data-channel-api

# The WebRTC leak used as an identity: the local address pulled from an ICE
# candidate is packed with the page the user is on and handed off to be sent.
# A VPN leak test shows the address to the user; this reports it, keyed to
# their browsing, as a client identifier. WebRTC exposes the LAN address
# precisely so peers can connect, not so a page or extension can track who is
# behind it.
#
# Worked example: "Watch Job" 1.0.5 (Chrome), whose content script sets
# `clientId: <WebRTC local IP>` and `jobUrl: window.location.href` on every
# job page and messages it to a background POST to its own ingest API.
- id: webrtc-local-ip-reported-with-page-url
  desc: WebRTC local IP sent with the visited page URL
  crit: suspicious
  conf: 0.9
  attack: T1016,T1217
  scope: file
  all:
  - id: webrtc-local-ip-discovery
  - id: micro-behaviors/communications/http/url/navigation::browser-page-url-href-rhs-read
  any:
  - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
