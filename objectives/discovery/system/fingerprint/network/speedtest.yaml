defaults:
  platforms: [linux, unix, android]
  for: [elf, shell, c, cpp]
  attack: T1046
composite_rules:
  - id: speedtest-bandwidth-profiling
    for: [elf, shell]
    desc: Profiles host bandwidth with Speedtest endpoints
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/benchmark::speedtest
      - id: micro-behaviors/communications/benchmark::ookla-config-endpoint
      - id: micro-behaviors/communications/benchmark::ookla-server-list-endpoint
    any:
      - id: micro-behaviors/communications/http/header/content-length::large-content-length-header
      - id: micro-behaviors/communications/http/post::post-request-line
    unless:
      # sing-box ships an Ookla client as its bandwidth test. The endpoints
      # are the product feature, not host reconnaissance.
      - id: well-known/dual-use/tunnel/sing-box::sagernet-sing-box-go-dep-elf
