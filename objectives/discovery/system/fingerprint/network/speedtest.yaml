defaults:
  platforms: [linux, unix, android]
  for: [elf, shell, c, cpp]
  attack: T1046
composite_rules:
  - id: speedtest-bandwidth-profiling
    for: [elf, shell]
    desc: Profiles host bandwidth with Speedtest endpoints
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/benchmark/bandwidth::speedtest
      - id: micro-behaviors/communications/benchmark/bandwidth::ookla-config-endpoint
      - id: micro-behaviors/communications/benchmark/bandwidth::ookla-server-list-endpoint
    any:
      - id: micro-behaviors/communications/http/header/content-length::large-content-length-header
      - id: micro-behaviors/communications/http/post::post-request-line
