# Obfuscated editor-session fingerprint collection is distinct from storing the
# generated identifier. This rule requires editor-specific process context and
# random material, so ordinary obfuscated extensions and host probes do not
# qualify on either signal alone.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  attack: T1082,T1027

composite_rules:
  - id: obfuscated-editor-session-fingerprint
    desc: Obfuscated module fingerprints the editor session
    # Editor extensions legitimately collect host/session fields for telemetry
    # and compatibility.  Obfuscation is reported separately under anti-static.
    crit: notable
    conf: 0.98
    mbc: B0032
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/os/env/vars/editor::vscode-instance-pid-env
      - id: micro-behaviors/os/env/vars/editor::vscode-ipc-hook-env
      - id: micro-behaviors/os/random/crypto::node-bracket-random-bytes-call
