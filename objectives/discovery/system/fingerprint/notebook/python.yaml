# Fingerprinting the analyst through the notebook they are working in.
#
# A hosted notebook (Colab, Kaggle, Binder, SageMaker Studio) gives a Python
# library something a normal install does not: a browser attached to the same
# session, reachable from Python. `IPython.display.Javascript` plus
# `google.colab.output.eval_js` is a two-way bridge -- the library pushes
# JavaScript into the page and reads the result back -- so a package can profile
# the human rather than the machine, and can do it from inside a data-science
# import that looks like set-up code.
#
# The reason this matters beyond ordinary telemetry: a notebook is usually
# signed into the user's cloud account, and the platform supplies short-lived
# credentials through the environment. Anything running there inherits that
# context, so identity harvesting lands on a logged-in user, not an anonymous
# host.
#
# Written against the mechanism -- bridge to the browser, load a third-party
# profiler, read back a stable id -- rather than one vendor's script, so a swap
# from FingerprintJS to any other profiler still lands.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1082
  mbc: E1082

traits:
  # `eval_js` is the read side of the bridge: JavaScript runs in the notebook
  # page and its return value comes back into Python. Ordinary notebook output
  # is one-way (render a chart, print a table); pulling a value *back* from the
  # browser is what turns the page into a sensor.
  - id: notebook-browser-eval-readback
    desc: Reads a value back from notebook JavaScript
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\boutput\.eval_js\s{0,4}\('

  # A remote ES module pulled into the notebook page at runtime. The package
  # ships the loader, not the payload, so what actually executes in the user's
  # browser is whatever that URL serves at the time -- and it can change after
  # review without the package being republished.
  - id: notebook-remote-module-import
    desc: Notebook loads a remote JavaScript module
    crit: suspicious
    conf: 0.9
    attack: T1105
    if:
      type: text
      regex: 'import\s{0,4}\(\s{0,4}["'']https?://[^"'']{4,120}\.js["'']'

composite_rules:
  # The full loop: inject script into the page, have it compute a stable
  # identifier for the browser, read that identifier back into Python. The
  # result follows the person across machines and sessions, which is a stronger
  # identifier than anything the host itself offers.
  - id: notebook-browser-fingerprint-harvest
    desc: Harvests a browser fingerprint via the notebook
    crit: hostile
    conf: 0.95
    all:
      - id: notebook-browser-eval-readback
    any:
      - id: notebook-remote-module-import
      - id: objectives/discovery/system/fingerprint/browser::fingerprintjs-load
