# Hosted notebooks expose a browser attached to the same session. Colab's
# `output.eval_js` plus a remote ES module import is the documented widget
# bridge -- push JavaScript into the page, read a value back -- used by
# charting libraries, FingerprintJS-based analytics, and anything that needs
# a browser-side result. That round-trip is a notable notebook capability,
# not by itself a fingerprint harvest: the same two atoms fire for a CDN
# plot loader. A remote `import("https://…js")` remains a separate
# suspicious live-payload signal.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1082
  mbc: E1082

traits:
  # `eval_js` is the read side of the bridge: JavaScript runs in the notebook
  # page and its return value comes back into Python. Ordinary notebook output
  # is one-way (render a chart, print a table); pulling a value *back* from the
  # browser is what turns the page into a sensor.
  - id: notebook-browser-eval-readback
    desc: Reads a value back from notebook JavaScript
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\boutput\.eval_js\s{0,4}\('

  # A named predicate that gates code on vendor-hosted notebook execution
  # (Colab/Kaggle/Binder), where the browser page is reachable through the
  # widget bridge. Probing the IDE is ordinary; branching tracking behavior
  # on the answer is victim selection -- it tells the module which hosts are
  # worth fingerprinting.
  - id: notebook-hosted-execution-gate
    desc: Gates execution on hosted notebook environment
    crit: notable
    conf: 0.85
    if:
      type: text
      word: is_hosted_notebook

  # A remote ES module pulled into the notebook page at runtime. The package
  # ships the loader, not the payload, so what actually executes in the user's
  # browser is whatever that URL serves at the time -- and it can change after
  # review without the package being republished.
  - id: notebook-remote-module-import
    desc: Notebook loads a remote JavaScript module
    crit: suspicious
    conf: 0.9
    attack: T1105
    if:
      type: text
      regex: 'import\s{0,4}\(\s{0,4}["'']https?://[^"'']{4,120}\.js["'']'

composite_rules:
  # eval_js plus a remote module (or FingerprintJS.load in a JS sibling) is the
  # notebook browser round-trip. Legitimate widgets do this; keep it notable.
  - id: notebook-browser-fingerprint-harvest
    desc: Notebook JavaScript round-trip with remote module
    crit: notable
    conf: 0.95
    all:
      - id: notebook-browser-eval-readback
    any:
      - id: notebook-remote-module-import
      - id: objectives/discovery/system/fingerprint/browser::fingerprintjs-load
