# Go implants that mint a stable per-victim identity before reporting in.
#
# The pattern is always the same three parts: derive an agent ID, pin it to
# something that survives a reinstall (the NIC's MAC address), and record where
# the host sits on the internet (its external IP, resolved by asking a public
# echo service because the host itself only knows its RFC1918 address). A
# controller needs all three to keep one row per victim.
#
# `main.`-anchored so this is the program's own top-level package. Licensing or
# telemetry code in real software identifies an *install* or a *session* and
# lives in a named package; it does not call the result an agent ID.
defaults:
  platforms: [linux, windows, macos]
  for: [elf, pe, macho]
  attack: T1082,T1614
  mbc: E1082

traits:
  - id: go-agent-id-generator
    desc: Go main generates an agent identifier
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\bmain\.(generate|make|new|build)Agent(ID|Id|UUID)\b'

  - id: go-mac-address-collector
    desc: Go main collects the host MAC address
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bmain\.get(MAC|Mac)Addr'

  # "Outer" IP is the spelling this family uses; the intent is the same as
  # "external" or "public" -- the address a C2 server sees, which the host can
  # only learn by asking someone outside.
  - id: go-external-ip-collector
    desc: Go main collects the host external IP
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bmain\.get(Outer|External|Public|Wan)IP\b'

composite_rules:
  - id: go-implant-registration-fingerprint
    desc: Go main builds a per-victim registration identity
    crit: suspicious
    conf: 0.94
    all:
      - id: go-agent-id-generator
    any:
      - id: go-mac-address-collector
      - id: go-external-ip-collector
