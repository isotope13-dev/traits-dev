defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  attack: T1082
traits: []
composite_rules:
- id: hardware-id-helper
  desc: Hardware ID helper strings
  crit: component
  conf: 0.7
  any:
  - id: micro-behaviors/os/sysinfo/machine-id::generate-hwid
  - id: micro-behaviors/os/sysinfo/machine-id::get-hwid
- id: hardware-id-source
  desc: Hardware identifier source
  crit: component
  conf: 0.7
  any:
  - id: micro-behaviors/os/sysinfo/machine-id::python-hardware-fingerprint-call
  - id: micro-behaviors/os/sysinfo/machine-id::python-device-id-getter
  - id: micro-behaviors/os/sysinfo/machine-id::macos-ioreg-platform-expert-query
  - id: micro-behaviors/os/sysinfo/machine-id::js-machine-id-path-read
  - id: micro-behaviors/os/sysinfo/machine-id::js-machineguid-registry-path
  - id: micro-behaviors/os/sysinfo/machine-id::etc-machine-id-path
  - id: micro-behaviors/os/sysinfo/machine-id::dbus-machine-id-path
  - id: micro-behaviors/os/sysinfo/machine-id::product-uuid-path
- id: hardware-uuid
  desc: Hardware-based UUID generation
  crit: notable
  conf: 0.8
  all:
  - id: hardware-id-helper
  - id: hardware-id-source
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
  unless:
  - id: well-known/lib/network/getstream-stream-node::stream-node-sdk-official
