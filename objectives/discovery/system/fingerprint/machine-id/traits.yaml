defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]
  attack: T1082
traits: []
composite_rules:
- id: hardware-id-helper
  desc: Hardware ID helper strings
  crit: component
  conf: 0.7
  any:
  - id: micro-behaviors/os/sysinfo/machine-id::generate-hwid
  - id: micro-behaviors/os/sysinfo/machine-id::get-hwid
- id: hardware-id-source
  desc: Hardware identifier source
  crit: component
  conf: 0.7
  any:
  - id: micro-behaviors/os/sysinfo/machine-id::python-hardware-fingerprint-call
  - id: micro-behaviors/os/sysinfo/machine-id::python-device-id-getter
  - id: micro-behaviors/os/sysinfo/machine-id::macos-ioreg-platform-expert-query
  - id: micro-behaviors/os/sysinfo/machine-id::js-machine-id-path-read
  - id: micro-behaviors/os/sysinfo/machine-id::js-machineguid-registry-path
  - id: micro-behaviors/os/sysinfo/machine-id::etc-machine-id-path
  - id: micro-behaviors/os/sysinfo/machine-id::dbus-machine-id-path
  - id: micro-behaviors/os/sysinfo/machine-id::product-uuid-path
- id: machine-id-collection
  desc: Machine ID collection indicators
  crit: notable
  conf: 0.8
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/machine-id::machineguid
  - id: micro-behaviors/os/sysinfo/machine-id::etc-machine-id-path
  - id: micro-behaviors/os/sysinfo/machine-id::product-uuid-path
  downgrade:
    any:
    - id: well-known/lib/crypto/keyring::rust-keyring-secret-service
  unless:
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: well-known/lib/native/systemd::systemd-shared-library
- id: hardware-uuid
  desc: Hardware-based UUID generation
  crit: notable
  conf: 0.8
  all:
  - id: hardware-id-helper
  - id: hardware-id-source
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
  unless:
  - id: well-known/lib/network/getstream-stream-node::stream-node-sdk-official
- id: win-fingerprint-beacon
  for: [pe]
  desc: Windows host fingerprint collection with HTTP
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  all:
  - id: micro-behaviors/os/sysinfo/machine-id::machineguid
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  any:
  - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
  - id: "micro-behaviors/os/registry/keys/policy::uac-enablelua-token"
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
  downgrade:
    any:
    - id: metadata/signed/platform/
