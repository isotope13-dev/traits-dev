defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1041

composite_rules:
  - id: applescript-profile-message-envelope
    desc: AppleScript host profile envelope
    crit: suspicious
    conf: 0.95
    near_lines: 2
    all:
      - id: objectives/discovery/system/profile::applescript-profile-message-prefix
      - id: objectives/discovery/system/profile::applescript-profile-message-serial
