# Operating System Information Collection
# ATT&CK: T1082 (System Information Discovery)
# NOTE: Neutral OS path/command references live in micro-behaviors/fs/path/os/
# (OS-identity probes in its identity/ subdir; generic Windows drive-root
# path handling in windows/).
defaults:
  platforms: [unix, windows, macos]
  attack: "T1082"
traits: []
composite_rules:
  # OS info composite
  - id: os-info
    desc: Operating system fingerprinting
    crit: notable
    conf: 0.7
    unless:
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      # An AppArmor profile lists the OS-identity paths a confined program is
      # ALLOWED to read (/proc/version, /etc/os-release). The policy grants the
      # access; it does not perform the fingerprinting.
      - id: metadata/file/policy/identity::apparmor-profile
      # MariaDB logs /proc/version for crash/diagnostics, not host recon.
      - id: well-known/app/data/mariadb/
      # IBM DB2 clidriver embeds OS identity for support dumps, not recon.
      - id: well-known/lib/data/ibm-db/

    any:
      # Require a platform-information API or read capability. A path string
      # alone can be a runtime's embedded fallback name and does not show that
      # the file is queried.
      - id: micro-behaviors/os/sysinfo/platform/host/
