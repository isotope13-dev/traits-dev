# WSL host detection. The environment variables are specific to WSL; the
# two /proc paths form the kernel-release fallback used across languages.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1082

traits:
  - id: node-wsl-environment-access
    desc: Node reads WSL environment markers
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      regex: '^process\.env\.(WSL_DISTRO_NAME|WSLENV)$'

  - id: python-wsl-environment-access
    desc: Python reads WSL environment markers
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'os\.(getenv|environ\.get)\s*\(\s*["''](WSL_DISTRO_NAME|WSLENV)["'']'

composite_rules:
  - id: wsl-kernel-release-probe
    desc: Reads both Linux kernel release paths
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/os::proc-version
      - id: micro-behaviors/fs/proc/system::system-osrelease

  - id: wsl-runtime-detection
    desc: Detects a Windows Subsystem for Linux runtime
    crit: notable
    conf: 0.97
    any:
      - id: node-wsl-environment-access
      - id: python-wsl-environment-access
      - id: wsl-kernel-release-probe
