defaults:
  platforms:
    - unix
    - windows
  crit: notable
  attack: T1082
  mbc: B0012
  for: [scripts, binaries]
traits:
  - id: os-conditional-exec
    desc: OS conditional execution
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      regex: if.{0,10}osn.{0,5}==.{0,5}0|if.{0,10}check_os.{0,5}==
composite_rules:
  - id: cross-platform-network-command-references
    desc: References Unix and Windows network interface commands
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/network/interface::ifconfig
      - id: micro-behaviors/os/network/status::ipconfig
  - id: platform-profiling
    desc: System platform profiling
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-system
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-node
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-full
  - id: multi-os-targeting
    desc: Multi-OS targeting behavior
    crit: suspicious
    conf: 0.85
    for:
      - python
      - javascript
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/string::os-string-windows
      - id: micro-behaviors/os/sysinfo/platform/string::os-string-linux
      - id: micro-behaviors/os/sysinfo/platform/string::os-string-darwin
    all:
      - id: os-conditional-exec
  - id: conditional-cross-platform-network-discovery
    desc: Conditional cross-platform network discovery
    crit: suspicious
    conf: 0.9
    all:
      - id: platform-profiling
      - id: multi-os-targeting
      - id: cross-platform-network-command-references
