defaults:
  platforms:
    - unix
    - windows
  crit: notable
  attack: T1082
  mbc: B0012
  for: [scripts, binaries]
traits:
  - id: os-conditional-exec
    desc: OS conditional execution
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      regex: if.{0,10}osn.{0,5}==.{0,5}0|if.{0,10}check_os.{0,5}==
  - id: unix-network-command-quote
    desc: Quoted Unix network discovery command token
    crit: component
    conf: 0.75
    if:
      type: text
      regex: '["''](ifconfig|ip addr|/sbin/ifconfig)["'']'
  - id: windows-network-command-quote
    desc: Quoted Windows network discovery command token
    crit: component
    conf: 0.75
    if:
      type: text
      regex: '["''](ipconfig|systeminfo)["'']'
    unless:
      - type: text
        substr: getifaddr
composite_rules:
  - id: multi-os-commands
    desc: Lists cross-platform network discovery commands
    crit: suspicious
    conf: 0.75
    all:
      - id: unix-network-command-quote
      - id: windows-network-command-quote
    # systeminformation is a legitimate cross-platform library whose normal
    # implementation invokes both platform-specific network commands.
    unless:
      - id: well-known/lib/core/systeminformation/
      - id: well-known/app/ai/pinokio::app-bundle
      - id: well-known/app/ai/lattice-ai::lattice-agent-root-env
      - id: metadata/file/profile/identity::generated-attack-map-context
      - id: well-known/app/system/sysmanage::agent-package-context
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: well-known/app/development/vscode-extension/atlascode::atlascode-vscode-extension
  - id: platform-profiling
    desc: System platform profiling
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-system
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-node
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-full
  - id: multi-os-targeting
    desc: Multi-OS targeting behavior
    crit: suspicious
    conf: 0.85
    for:
      - python
      - javascript
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/string::os-string-windows
      - id: micro-behaviors/os/sysinfo/platform/string::os-string-linux
      - id: micro-behaviors/os/sysinfo/platform/string::os-string-darwin
    all:
      - id: os-conditional-exec
  - id: cross-platform-malware
    desc: Cross-platform malware capability
    crit: hostile
    conf: 0.9
    all:
      - id: platform-profiling
      - id: multi-os-targeting
      - id: multi-os-commands
