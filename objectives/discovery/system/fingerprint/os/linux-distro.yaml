defaults:
  platforms:
    - unix
    - windows
  crit: notable
  attack: T1082
  mbc: B0012
  for: [scripts, binaries]
traits:
composite_rules:
  - id: linux-distro-identification
    desc: Linux distro identification
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/os/identity::os-release-path
      - id: micro-behaviors/os/sysinfo/platform/files::os-release-open
  - id: distro-specific-targeting
    desc: Distro-specific OS checks
    crit: notable
    conf: 0.75
    for:
      - python
      - shell
    any:
      - id: micro-behaviors/os/sysinfo/platform/string::debian-os-release-id-reference
      - id: micro-behaviors/os/sysinfo/platform/string::fedora-release-identifier
      - id: micro-behaviors/os/sysinfo/platform/string::ubuntu-release-identifier
    all:
      - id: linux-distro-identification
