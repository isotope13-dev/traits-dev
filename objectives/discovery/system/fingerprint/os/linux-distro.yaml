defaults:
  platforms:
    - unix
    - windows
  crit: notable
  attack: T1082
  mbc: B0012
  for: [scripts, binaries]
traits:
  - id: os-release-open
    desc: Open os-release file
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: open\(.{0,15}os-release|/rgp/bf-eryrnfr
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: distro-debian-check
    desc: Debian distro check
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: ID=debian|ID_LIKE=debian
  - id: distro-fedora-check
    desc: Fedora distro check
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: ID=fedora|ID_LIKE=fedora
  - id: distro-ubuntu-check
    desc: Ubuntu distro check
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: ID=ubuntu
  # The apt-*-operation atoms and their `apt-package-manager` umbrella were
  # removed here. Their regexes were UNANCHORED (`\bapt(-get)?\s+install\b`),
  # so they matched the phrase anywhere -- including ordinary prose. Debian's
  # own `deluser` tripped them on a help string that merely tells the user
  # "run apt-get install perl", and the finding claimed an apt *operation* the
  # program never performs, filed under discovery/system/fingerprint as OS
  # reconnaissance. Every Linux README, Dockerfile comment, CI file and error
  # message that mentions apt landed in that ML feature.
  #
  # Nothing referenced them (the umbrella had no consumers either), and
  # micro-behaviors/os/package-manager/apt::apt-package-install-command already
  # covers the real thing correctly: line-anchored, sudo-aware, in the neutral
  # tier where a package-manager command belongs. Anchored remove/download
  # atoms, if ever needed, belong beside it -- not in an objectives directory.
composite_rules:
  - id: linux-distro-identification
    desc: Linux distro identification
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/fs/path/os::os-release-path
      - id: os-release-open
  - id: distro-specific-targeting
    desc: Distro-specific OS checks
    crit: notable
    conf: 0.75
    for:
      - python
      - shell
    any:
      - id: distro-debian-check
      - id: distro-fedora-check
      - id: distro-ubuntu-check
    all:
      - id: linux-distro-identification
