defaults:
  platforms: [windows, unix]
  for: [package.json]
  attack: T1082
composite_rules:
  - id: node-oob-sysinfo-exfil
    desc: Node.js preinstall collects system fingerprint
    crit: suspicious
    conf: 0.94
    scope: archive
    for: [npm, package.json, pkginfo, javascript]
    all:
      - id: micro-behaviors/process/interpreter/node::versioned-lifecycle-node-e
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-platform-call
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-arch-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
    needs: 2
  - id: node-exec-sync-cross-platform-recon
    desc: Node.js preinstall runs cross-platform system recon via execSync
    crit: suspicious
    conf: 0.97
    # Mixes the pkginfo-only registry snapshot legs, the package.json-only
    # raw-text execSync legs, and javascript-only require()/win32-check legs
    # -- three nodes of one npm package, so this needs archive pooling.
    scope: archive
    for: [npm, package.json, pkginfo, javascript]
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: micro-behaviors/process/interpreter/node::versioned-lifecycle-node-e
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/os/sysinfo/platform/branch::js-platform-win32-check
    any:
      - id: micro-behaviors/fs/read/file/account::node-exec-sync-passwd
      - id: micro-behaviors/os/sysinfo/command::node-exec-sync-systeminfo
