# Chained Unix host-identity shell reconnaissance (`id`/`whoami`, `uname`, `hostname`),
# both standalone (notable) and dispatched over an OpenSSH overlong-password bypass session.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  attack: T1082,T1033

traits:
  - id: shell-chain-leading-id-cmd-command
    desc: Leading id or whoami command chain
    crit: component
    conf: 0.92
    attack: T1033
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`][ \t]*)(/usr/bin/|/bin/)?(id(\s+-[A-Za-z]+)?|whoami)[ \t]*[;&|]'

    for: [scripts, source, binaries, -beam, -wasm, -static-lib, -python, -javascript, -typescript]
  - id: shell-chain-leading-id-cmd-string
    desc: Leading id or whoami command chain
    crit: component
    conf: 0.92
    for: [python, javascript, typescript]
    if:
      type: literal
      # Syntax highlighters annotate keyword relevance as id|0 or regex
      # keyword alternations (id|BOOL|bool|...).
      regex: '(?m)(^|[''"`][ \t]*)(/usr/bin/|/bin/)?(id(\s+-[A-Za-z]+)?|whoami)[ \t]*[;&|][\w|]{0,25}'
    not:
      - regex: '\bid\|[0-9]$'
      - regex: '\bid\|\w+\|'
  - id: shell-chain-trailing-id-cmd-command
    desc: Chained id or whoami shell command
    crit: component
    conf: 0.92
    attack: T1033
    if:
      type: text
      exclude_comments: true
      # A bare `;` cannot follow the command here: minified JS/TS class-field
      # lists (`static x=c();id;abortController;`) are indistinguishable from
      # a compact `;id;cmd` chain, and the field-list shape scored benign
      # bundles. Spaced mid-chains (`; id ;`) are covered by
      # shell-chain-mid-id-cmd below.
      regex: '(&lt)?[;&|][ \t]*((/usr)?/bin/)?(id(\s+-[A-Za-z]+)?|whoami)\b([ \t]*[&|''"`\r\n2]|$)'
    # Exclude pipe-delimited option lists/union types (`tree | id | wnd`) and
    # single-ampersand string concatenation/bitwise expressions (`"mode " & id`),
    # while preserving `; id`, `&& id`, `|| id`, `| id -u`, and `/usr/bin/id`.
    # Consume the entity prefix so only the HTML tag spelling is filtered.
    not:
      - regex: '^&lt;id&$'
      - regex: '(^|[^|])\|\s*id(\s*\||$)'
      - regex: '(^|[^&])&\s*id\b'
      - regex: '^\|id["'']'

    for: [scripts, source, binaries, -beam, -wasm, -static-lib, -python, -javascript, -typescript]
  - id: shell-chain-trailing-id-cmd-string
    desc: Chained id or whoami shell command
    crit: component
    conf: 0.92
    for: [python, javascript, typescript]
    if:
      type: literal
      # `||` and `&&` are taken whole, so the exclusions below, which drop a
      # lone pipe or ampersand into `id`, still see a chain where one ends the
      # string.
      regex: '(\|\|?|&&?|;)[ \t]*(/usr/bin/|/bin/)?\b(id(\s+-[A-Za-z]+)?|whoami)\b([ \t]*[&|''"`\r\n2]|$)'
    not:
      - regex: '(^|[^|])\|\s*id(\s*\||$)'
      - regex: '(^|[^&])&\s*id\b'
    unless:
      - id: metadata/file/format/source-map::sourcemap

  - id: shell-chain-mid-id-cmd-command
    desc: Mid-chain spaced id or whoami command
    crit: component
    conf: 0.92
    attack: T1033
    if:
      type: text
      exclude_comments: true
      # Space required after the separator: this restores the spaced
      # mid-chain form the trailing trait no longer admits, and cannot match
      # minified code, which never carries spaces between statements.
      regex: '[;&|][ \t]+(/usr/bin/|/bin/)?(id(\s+-[A-Za-z]+)?|whoami)[ \t]*;'

    for: [scripts, source, binaries, -beam, -wasm, -static-lib, -python, -javascript, -typescript]
  - id: shell-chain-mid-id-cmd-string
    desc: Mid-chain spaced id or whoami command
    crit: component
    conf: 0.92
    for: [python, javascript, typescript]
    if:
      type: literal
      regex: '[;&|][ \t]+(/usr/bin/|/bin/)?(id(\s+-[A-Za-z]+)?|whoami)[ \t]*;'
  - id: shell-chain-leading-uname-cmd
    desc: Leading uname in command chain
    crit: notable
    conf: 0.94
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`][ \t]*)(/usr)?(/bin/)?uname(\s+-[a-zA-Z]+)?[ \t]*[;&|]'

  - id: shell-chain-trailing-uname-cmd
    desc: Chained uname shell command
    crit: notable
    conf: 0.94
    attack: T1082
    if:
      type: text
      exclude_comments: true
      # Same rule as the id trait: a bare `;` terminator would also match
      # minified JS/TS class-field lists (`;uname;hostname;`).
      regex: '[;&|][ \t]*(/usr)?(/bin/)?uname(\s+-[a-zA-Z]+)?([ \t]*[&|''"`\r\n2]|$)'
    # Exclude pipe-delimited keyword lists (`|uname|`), as the id trait does.
    not:
      - regex: '(^|[^|])\|\s*uname(\s*\||$)'

  - id: shell-chain-mid-uname-cmd
    desc: Mid-chain spaced uname command
    crit: notable
    conf: 0.94
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '[;&|][ \t]+(/usr)?(/bin/)?uname(\s+-[a-zA-Z]+)?[ \t]*;'

  - id: shell-chain-leading-hostname-cmd
    desc: Leading hostname in command chain
    crit: notable
    conf: 0.92
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`][ \t]*)(/usr)?(/bin/)?hostname(\s+-[a-zA-Z]+)?[ \t]*[;&|]'

  - id: shell-chain-trailing-hostname-cmd
    desc: Chained hostname shell command
    crit: notable
    conf: 0.92
    attack: T1082
    if:
      type: text
      exclude_comments: true
      # `&&` is taken whole and a lone `&` is not a separator here: it is Go/C
      # address-of (`= &hostname`) or string concatenation (`"x" & hostname`).
      regex: '(\|\|?|&&|;)[ \t]*(/usr)?(/bin/)?hostname(\s+-[a-zA-Z]+)?([ \t]*[&|''"`\r\n2]|$)'
    # Exclude pipe-delimited keyword lists (`|hostname|`), as the id trait does.
    not:
      - regex: '(^|[^|])\|\s*hostname(\s*\||$)'

  - id: shell-chain-mid-hostname-cmd
    desc: Mid-chain spaced hostname command
    crit: notable
    conf: 0.92
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '[;&|][ \t]+(/usr)?(/bin/)?hostname(\s+-[a-zA-Z]+)?[ \t]*;'

composite_rules:
  - id: shell-chain-trailing-id-cmd
    desc: Chained id or whoami shell command
    crit: notable
    conf: 0.92
    attack: T1033
    any:
      - id: shell-chain-trailing-id-cmd-command
      - id: shell-chain-trailing-id-cmd-string
  - id: shell-chain-mid-id-cmd
    desc: Mid-chain spaced id or whoami command
    crit: notable
    conf: 0.92
    attack: T1033
    any:
      - id: shell-chain-mid-id-cmd-command
      - id: shell-chain-mid-id-cmd-string
  - id: shell-chain-leading-id-cmd
    desc: Leading id or whoami command chain
    crit: notable
    conf: 0.92
    attack: T1033
    any:
      - id: shell-chain-leading-id-cmd-command
      - id: shell-chain-leading-id-cmd-string
  - id: shell-chain-identity-cmd
    desc: Chained shell command queries user identity
    crit: notable
    conf: 0.92
    attack: T1033
    any:
      - id: shell-chain-leading-id-cmd
      - id: shell-chain-trailing-id-cmd
      - id: shell-chain-mid-id-cmd

  - id: shell-chain-uname-cmd
    desc: Chained shell command queries uname info
    crit: notable
    conf: 0.94
    attack: T1082
    any:
      - id: shell-chain-leading-uname-cmd
      - id: shell-chain-trailing-uname-cmd
      - id: shell-chain-mid-uname-cmd

  - id: shell-chain-hostname-cmd
    desc: Chained shell command queries hostname
    crit: notable
    conf: 0.92
    attack: T1082
    any:
      - id: shell-chain-leading-hostname-cmd
      - id: shell-chain-trailing-hostname-cmd
      - id: shell-chain-mid-hostname-cmd

  - id: chained-shell-host-identity-recon
    desc: Chained id, uname, and hostname recon
    crit: notable
    conf: 0.96
    all:
      - id: shell-chain-identity-cmd
      - id: shell-chain-uname-cmd
      - id: shell-chain-hostname-cmd
    near_bytes: 128

  - id: ssh-overlong-password-host-recon
    desc: Host recon via SSH overlong password
    crit: hostile
    conf: 0.99
    attack: T1082,T1033,T1021.004
    all:
      - id: chained-shell-host-identity-recon
    any:
      - id: objectives/lateral-movement/exploit/cve::ssh-askpass-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::sshpass-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::paramiko-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::asyncssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::go-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::go-binary-ssh-overlong-password-exec
      - id: objectives/lateral-movement/exploit/cve::c-libssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::native-libssh-overlong-password-exec
      - id: objectives/lateral-movement/exploit/cve::rust-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::node-ssh2-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::ruby-net-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::php-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::jvm-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::csharp-sshnet-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::posh-ssh-overlong-password-remote-exec
