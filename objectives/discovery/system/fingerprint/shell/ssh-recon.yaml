# Chained Unix host-identity shell reconnaissance (`id`/`whoami`, `uname`, `hostname`),
# both standalone (notable) and dispatched over an OpenSSH overlong-password bypass session.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  attack: T1082,T1033

traits:
  - id: shell-chain-leading-id-cmd
    desc: Leading id or whoami command chain
    crit: notable
    conf: 0.92
    attack: T1033
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`][ \t]*)(/usr/bin/|/bin/)?(id(\s+-[A-Za-z]+)?|whoami)[ \t]*[;&|]'

  - id: shell-chain-trailing-id-cmd
    desc: Chained id or whoami shell command
    crit: notable
    conf: 0.92
    attack: T1033
    if:
      type: text
      exclude_comments: true
      regex: '[;&|][ \t]*(/usr/bin/|/bin/)?(id(\s+-[A-Za-z]+)?|whoami)([ \t]*[;&|''"`\r\n2]|$)'
    # Exclude pipe-delimited option lists/union types (`tree | id | wnd`) and
    # single-ampersand string concatenation/bitwise expressions (`"mode " & id`),
    # while preserving `; id`, `&& id`, `|| id`, `| id -u`, and `/usr/bin/id`.
    not:
      - regex: '(^|[^|])\|\s*id(\s*\||$)'
      - regex: '(^|[^&])&\s*id\b'

  - id: shell-chain-leading-uname-cmd
    desc: Leading uname in command chain
    crit: notable
    conf: 0.94
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`][ \t]*)(/usr)?(/bin/)?uname(\s+-[a-zA-Z]+)?[ \t]*[;&|]'

  - id: shell-chain-trailing-uname-cmd
    desc: Chained uname shell command
    crit: notable
    conf: 0.94
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '[;&|][ \t]*(/usr)?(/bin/)?uname(\s+-[a-zA-Z]+)?([ \t]*[;&|''"`\r\n2]|$)'

  - id: shell-chain-leading-hostname-cmd
    desc: Leading hostname in command chain
    crit: notable
    conf: 0.92
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[''"`][ \t]*)(/usr)?(/bin/)?hostname(\s+-[a-zA-Z]+)?[ \t]*[;&|]'

  - id: shell-chain-trailing-hostname-cmd
    desc: Chained hostname shell command
    crit: notable
    conf: 0.92
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '[;&|][ \t]*(/usr)?(/bin/)?hostname(\s+-[a-zA-Z]+)?([ \t]*[;&|''"`\r\n2]|$)'

composite_rules:
  - id: shell-chain-identity-cmd
    desc: Chained shell command queries user identity
    crit: notable
    conf: 0.92
    attack: T1033
    any:
      - id: shell-chain-leading-id-cmd
      - id: shell-chain-trailing-id-cmd

  - id: shell-chain-uname-cmd
    desc: Chained shell command queries uname info
    crit: notable
    conf: 0.94
    attack: T1082
    any:
      - id: shell-chain-leading-uname-cmd
      - id: shell-chain-trailing-uname-cmd

  - id: shell-chain-hostname-cmd
    desc: Chained shell command queries hostname
    crit: notable
    conf: 0.92
    attack: T1082
    any:
      - id: shell-chain-leading-hostname-cmd
      - id: shell-chain-trailing-hostname-cmd

  - id: chained-shell-host-identity-recon
    desc: Chained id, uname, and hostname recon
    crit: notable
    conf: 0.96
    all:
      - id: shell-chain-identity-cmd
      - id: shell-chain-uname-cmd
      - id: shell-chain-hostname-cmd
    near_bytes: 128

  - id: ssh-overlong-password-host-recon
    desc: Host recon via SSH overlong password
    crit: hostile
    conf: 0.99
    attack: T1082,T1033,T1021.004
    all:
      - id: chained-shell-host-identity-recon
    any:
      - id: objectives/lateral-movement/exploit/cve::ssh-askpass-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::sshpass-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::paramiko-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::asyncssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::go-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::go-binary-ssh-overlong-password-exec
      - id: objectives/lateral-movement/exploit/cve::c-libssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::native-libssh-overlong-password-exec
      - id: objectives/lateral-movement/exploit/cve::rust-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::node-ssh2-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::ruby-net-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::php-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::jvm-ssh-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::csharp-sshnet-overlong-password-remote-exec
      - id: objectives/lateral-movement/exploit/cve::posh-ssh-overlong-password-remote-exec
