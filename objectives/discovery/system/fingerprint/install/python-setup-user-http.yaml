defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1033,T1071.001

composite_rules:
  - id: python-setup-username-http-body
    desc: Setup queries username and sends an HTTP request body
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/process/identity/query/principal::python-imported-getpass-user
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object-call
      - id: micro-behaviors/communications/http/request/body/construction::python-request-data-argument
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-alias-urlopen
