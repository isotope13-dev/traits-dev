defaults:
  attack: T1082
  platforms: [unix, windows, macos]
composite_rules:
  - id: system-fingerprint-bundle
    desc: "Collects extensive system information (fingerprinting)"
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/env/system-info::computer-user-environment-references
      - id: micro-behaviors/os/sysinfo/platform/version::powershell-os-query-profile
      - id: micro-behaviors/os/wmi/query::query-antivirus
