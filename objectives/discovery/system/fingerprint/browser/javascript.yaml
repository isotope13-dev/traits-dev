defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1082
traits:
- id: rendered-canvas-fingerprint
  desc: Draws a rendered canvas fingerprint
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'fillText\(.{0,120}toDataURL\('
- id: webgl-renderer-fingerprint
  desc: Reads WebGL vendor and renderer identity
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'UNMASKED_VENDOR_WEBGL.{0,100}UNMASKED_RENDERER_WEBGL'
    not:
    - regex: '=\s*3744[56]\b'
- id: browser-fingerprint-profile-fields
  desc: Collects browser profile fields
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'navigator\.userAgent.{0,180}screen\.width.{0,120}resolvedOptions\(\)\.timeZone'
- id: browser-fingerprint-provisioning-message
  desc: Passes browser fingerprint to provisioning
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'fingerprint\s*:\s*collectFingerprint\(\)'
- id: encoded-browser-profile-fields
  desc: Encoded browser profile fields
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: btoa\((JSON\.stringify\()?get(VideoCardInfo|Languages|ScreenInfo)\(
composite_rules:
- id: extension-browser-fingerprint-provisioning
  desc: Passes rendered canvas and browser identity to provisioning
  crit: suspicious
  conf: 0.95
  all:
  - id: rendered-canvas-fingerprint
  - id: webgl-renderer-fingerprint
  - id: browser-fingerprint-profile-fields
  - id: browser-fingerprint-provisioning-message
- id: browser-fingerprint-bundle
  desc: Collects multiple browser environment fields for fingerprinting
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-screen-dimensions-read
  - id: micro-behaviors/os/sysinfo/platform/timezone::js-intl-timezone-read
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-webgl-renderer-read
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
  - id: well-known/app/ai/media/pinokio::pinokio-client-runtime
  - id: well-known/lib/web/client-side/browser-libraries::jquery-mobile-browser-helper
  - id: well-known/lib/network/npm-packages/ably::ably-js-library
- id: browser-encoded-fingerprint-profile
  desc: Encoded browser fingerprint profile
  crit: suspicious
  conf: 0.96
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/hardware::fingerprintjs-load-call
  - id: micro-behaviors/hardware/input/event::browser-deviceorientation-listener
  - id: encoded-browser-profile-fields
- id: browser-recon-persistence
  desc: Browser environment profiling with storage persistence
  crit: notable
  conf: 0.95
  all:
  - id: browser-fingerprint-bundle
  - id: micro-behaviors/data/db/write::browser-storage-persistence
- id: hybrid-env-recon-persistence
  desc: Hybrid environment (Electron/NW.js) profiling with persistence
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/sysinfo/platform/browser::hybrid-browser-runtime-detect
  - id: micro-behaviors/data/db/write::browser-storage-persistence
  - id: browser-fingerprint-bundle
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
- id: clientjs-legacy-plugin-field-harvest
  desc: Legacy plugin versions enumerated into form fields
  crit: hostile
  conf: 0.93
  for:
  - html
  all:
  - id: micro-behaviors/os/sysinfo/platform/browser::clientjs-legacy-plugin-probe
  - id: micro-behaviors/os/sysinfo/platform/browser::clientjs-filled-form-field

# Visitor-tracker shape without a named sink: fingerprint fields are gathered,
# a stable device id is persisted in web storage, and the bundle leaves the page
# by sendBeacon or a JSON POST. Analytics SDKs can match this, so it stays
# suspicious; the hostile webhook relay is a separate composite.
- id: browser-fingerprint-upload-persistent-device
  desc: Browser fingerprint with persistent device id uploaded
  crit: suspicious
  conf: 0.93
  attack: T1082,T1041
  all:
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-webgl-renderer-read
  - id: micro-behaviors/data/db/write::browser-storage-persistence
  any:
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/communications/http/request/json::fetch-flow-json-post-body
  unless:
  - id: well-known/app/storage/dropbox::metaserver-web-bundle
