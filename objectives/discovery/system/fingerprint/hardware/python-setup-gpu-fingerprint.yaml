# A Python package setup script that queries GPU hardware inventory (nvidia-smi)
# alongside host identity or network location queries to profile high-compute targets.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1082

composite_rules:
  - id: python-setup-gpu-host-fingerprint
    desc: setup.py queries GPU hardware inventory and host identity at install time
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/os/sysinfo/gpu::nvidia-smi-query-gpu
    any:
      - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
      - id: micro-behaviors/fs/proc/info/pid::init-process-metadata-procfs-access
      - id: micro-behaviors/communications/http/ip-discovery::ip-sb-geoip
