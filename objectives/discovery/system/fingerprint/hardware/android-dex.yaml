defaults:
  for: [dex]
  platforms: [android]
  crit: notable

traits:
  - id: android-cpuinfo-path
    desc: References Android CPU information path
    if:
      type: text
      exact: /proc/cpuinfo

  - id: android-interface-mac-path
    desc: References Android interface MAC path
    if:
      type: text
      regex: '^/sys/class/net/(wlan0|eth0)/address$'

composite_rules:
  - id: android-cpu-interface-identity
    desc: References CPU information and interface MAC address paths
    attack: T1082
    all:
      - id: android-cpuinfo-path
      - id: android-interface-mac-path
