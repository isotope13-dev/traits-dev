# Windows CPU registry fingerprinting
# Malware reads CPU model from registry for system profiling
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1082
traits:
  - id: central-processor-reg
    desc: CPU registry key enumeration path
    crit: component
    conf: 0.85
    if:
      type: text
      substr: CentralProcessor\0
  - id: processor-name-string
    desc: CPU model name registry value
    crit: component
    conf: 0.85
    if:
      type: text
      exact: ProcessorNameString
composite_rules:
  - id: wmi-host-profile-queries
    desc: COM-backed WMI host profile queries
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/invoke::wmi-com-proxy-setup
    needs: 2
    any:
      - id: micro-behaviors/os/wmi/query
    unless:
      - id: well-known/lib/platform/wmi::wmi-win32-provider-versioninfo
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree

  - id: packed-privileged-hardware-fingerprint
    desc: Packed elevated PE fingerprints hardware devices
    crit: suspicious
    conf: 0.96
    attack: T1082,T1027,T1548.002
    all:
      - id: objectives/anti-static/pack/entropy::privileged-high-entropy-pe
      - id: micro-behaviors/os/sysinfo/hardware::setupdi-get-class-devs-w
      - id: micro-behaviors/os/sysinfo/hardware::cm-locate-devnode-w
      - id: micro-behaviors/os/sysinfo/hardware::hid-manufacturer-string
  # Querying Win32_NetworkAdapterConfiguration is ordinary; pairing it with a
  # list of the virtual adapter names to skip is not. Discarding the tunnel,
  # loopback and hypervisor NICs leaves only the physical ones, whose MACs stay
  # the same across reboots and reinstalls -- the point is a stable hardware
  # identifier for the machine, not an inventory of its networking.
  #
  # Notable rather than suspicious: this is exactly how a licence-activation
  # client binds a key to a machine, and equally how an implant derives a victim
  # id. The composites that care about the difference supply the transport.
  - id: wmi-physical-adapter-hardware-id
    desc: WMI adapter query filters virtual adapters
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/wmi/query::wmi-network-adapter-config-class
      - id: micro-behaviors/os/sysinfo/network::virtual-adapter-name-filter-table

  - id: cpu-registry-fingerprint
    desc: CPU fingerprinting via Windows registry
    crit: notable
    conf: 0.88
    all:
      - id: central-processor-reg
      - id: processor-name-string
      - id: micro-behaviors/os/registry/access::registry-read-api-chain
    unless:
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/installer/sfx/
      - id: well-known/app/system/cvte-crashrpt/
      - id: metadata/file/string/identity::pe-product-name-7zip
