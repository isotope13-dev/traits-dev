# Display Fingerprinting Behavior
# Detects cross-platform display resolution queries, which can support fingerprinting
# ATT&CK: T1082 (System Information Discovery)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: "T1082"
composite_rules:
  - id: cross-platform-display-fingerprint
    desc: Queries display resolution across platforms
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/hardware/display/state::wmic-video-controller
      - id: micro-behaviors/hardware/display/state::xrandr-query
