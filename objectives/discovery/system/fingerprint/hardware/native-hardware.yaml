defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: native-cpu-mac-disk-board-report
    desc: Formats CPU MAC disk board identifiers
    crit: notable
    if: {type: text, substr: 'CPU:%s|MAC:%s|DISK:%s|BOARD:%s'}
  - id: native-rootfs-creation-identity
    desc: Formats root filesystem creation identity
    crit: notable
    if: {type: text, exact: 'rootfs-ctime-%ld'}
  - id: native-network-interface-mac-path
    desc: Formats network interface MAC sysfs path
    crit: notable
    if: {type: text, exact: '/sys/class/net/%s/address'}
composite_rules:
  - id: native-hardware-rootfs-fingerprint
    desc: Native hardware fingerprint includes root filesystem creation time
    crit: suspicious
    conf: 0.96
    attack: T1082
    near_bytes: 512
    all:
      - id: native-cpu-mac-disk-board-report
      - id: native-rootfs-creation-identity
      - id: native-network-interface-mac-path
      - id: micro-behaviors/fs/proc/system::system-cpuinfo
