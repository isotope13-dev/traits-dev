defaults:
  platforms: [windows, unix]
  for:
    - python
  mbc: E1082
  attack: T1082
  crit: notable
traits:
  - id: getmac-module
    desc: getmac module for MAC address
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: getmac
  # A lone `os.uname()` read is a neutral platform query, not reconnaissance —
  # every cross-platform Python library gates arch-specific code on it. The atom
  # now lives in micro-behaviors/os/sysinfo/platform/runtime/ as
  # `os-uname-call`; the recon intent stays here, in python-sysinfo-multi, which
  # needs two distinct host properties before it says anything.
composite_rules:
  - id: python-username
    desc: Gets current system username
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/process/user/query::python-getpass-user
      - id: micro-behaviors/process/user/query::python-imported-getpass-user
      - id: micro-behaviors/process/user/query::os-getlogin-python
  - id: python-mac-discovery
    desc: Collects hardware MAC addresses
    crit: notable
    conf: 0.8
    any:
      - id: getmac-module
      - id: objectives/discovery/network/interface
      - id: micro-behaviors/os/sysinfo/network::python-uuid-getnode-call
  - id: python-sysinfo-multi
    desc: Collects multiple system information items
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/host/
      - id: micro-behaviors/process/user/query::python-getpass-user
      - id: micro-behaviors/process/user/query::python-imported-getpass-user
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/os/network/interface::python-getsockname-local-ip
      - id: micro-behaviors/process/user/query::os-getlogin-python
      - id: micro-behaviors/os/privilege/check::os-getuid-admin
      - id: micro-behaviors/os/privilege/check::ctypes-is-admin
  - id: python-machine-fingerprint-hash
    desc: Hashes system identity fields into a machine fingerprint
    crit: notable
    conf: 0.92
    near_lines: 30
    all:
      - id: python-sysinfo-multi
      - id: micro-behaviors/crypto/hash/digest::python-sha256-hexdigest
  - id: python-enumeration
    desc: Collects OS, user and network information
    crit: notable
    conf: 0.95
    near_lines: 80
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/platform/host::platform-system
      - id: python-mac-discovery
      - id: python-username
      - id: micro-behaviors/communications/http/request/
