defaults:
  platforms: [windows, unix]
  for:
    - python
  mbc: E1082
  attack: T1082
  crit: notable
traits:
  # A lone `os.uname()` read is a neutral platform query, not reconnaissance —
  # every cross-platform Python library gates arch-specific code on it. The atom
  # now lives in micro-behaviors/os/sysinfo/platform/runtime/ as
  # `os-uname-call`; the recon intent stays here, in python-sysinfo-multi, which
  # needs two distinct host properties before it says anything.
composite_rules:
  - id: python-username
    desc: Gets current system username
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/process/user/query::python-getpass-user
      - id: micro-behaviors/process/user/query::python-imported-getpass-user
      - id: micro-behaviors/process/user/query::os-getlogin-python
  - id: python-mac-discovery
    desc: Collects hardware MAC addresses
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/network/interface::getmac-module-name-reference
      - id: objectives/discovery/network/interface
      - id: micro-behaviors/os/sysinfo/network::python-uuid-getnode-call
  - id: python-enumeration
    desc: Collects OS, user and network information
    crit: notable
    conf: 0.95
    near_lines: 80
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/platform/host::platform-system
      - id: python-mac-discovery
      - id: python-username
      - id: micro-behaviors/communications/http/request/
