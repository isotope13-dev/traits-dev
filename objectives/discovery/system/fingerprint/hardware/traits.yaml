defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1082
traits:
  - id: product-serial
    desc: Reads a DMI product serial field
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      regex: '(?i)/sys/(class|devices/virtual)/dmi/id/product[_-]serial'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path

  - id: board-serial
    desc: Reads a DMI board serial field
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      regex: '(?i)/sys/(class|devices/virtual)/dmi/id/board[_-]serial'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/app/productivity/keepercommander/

composite_rules:
  - id: dmi-fields
    desc: DMI/SMBIOS fields
    crit: notable
    conf: 0.5
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/hardware::dmi-vendor-product
      - id: micro-behaviors/os/sysinfo/hardware::dmidecode
      - id: micro-behaviors/os/sysinfo/hardware::dmi-sysfs
      - id: product-serial
      - id: board-serial
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/app/infrastructure/terraform::terraform-core-binary
      - id: well-known/app/development/jennifer::source-syntax-func
      - id: well-known/lib/native/systemd::systemd-shared-library
      - id: well-known/lib/crypto/google-auth::gce-credentials-context
      - id: micro-behaviors/os/sysinfo/hardware::diag-dmi-env-prefix
      - id: micro-behaviors/os/sysinfo/hardware::diag-env-prefix
  - id: dmi-smbios
    desc: DMI/SMBIOS hardware information collection
    crit: notable
    conf: 0.75
    any:
      - id: dmi-fields
      - id: micro-behaviors/os/sysinfo/hardware::dmidecode
  - id: cpu-info
    desc: CPU information fingerprinting
    crit: notable
    conf: 0.4
    any:
      - id: cpu-proc-cpuinfo
      - id: micro-behaviors/os/sysinfo/hardware::lscpu-cmd
    unless:
      - id: well-known/app/infrastructure/open-vm-tools/
      - id: well-known/tool/development/gcc-toolchain::conda-linux-gnu-triplet-path
      - id: micro-behaviors/data/compress/library::libzstd
      # MariaDB mini-benchmark / server tooling profiles CPUs for DB perf, not recon.
      - id: well-known/app/data/mariadb/
      # IBM DB2 clidriver support tooling profiles CPUs for diagnostics, not recon.
      - id: well-known/lib/data/ibm-db/
  - id: cpu-proc-cpuinfo
    desc: Nearby /proc/cpuinfo path and CPU fields
    crit: notable
    conf: 0.4
    all:
      - id: micro-behaviors/fs/proc/system::system-cpuinfo
    any:
      - id: micro-behaviors/os/sysinfo/hardware::cpu-model-name
      - id: micro-behaviors/os/sysinfo/hardware::cpu-family
      - id: micro-behaviors/os/sysinfo/hardware::cpu-cores
    near_bytes: 65536
    unless:
      - id: well-known/app/infrastructure/open-vm-tools/
      - id: well-known/tool/development/gcc-toolchain::conda-linux-gnu-triplet-path
      - id: micro-behaviors/data/compress/library::libzstd
      - id: well-known/app/data/mariadb/
      - id: well-known/lib/data/ibm-db/

  - id: static-iot-hardware-identity-profile
    desc: Static IoT bot fingerprints hardware and machine identity
    crit: hostile
    conf: 0.99
    attack: T1016,T1082
    mbc: B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: dmi-fields
      - id: objectives/discovery/system/fingerprint/machine-id::machine-id-collection
      - id: micro-behaviors/fs/proc/system::system-cpuinfo
      - id: micro-behaviors/fs/proc/network::network-dev
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-elf-text
