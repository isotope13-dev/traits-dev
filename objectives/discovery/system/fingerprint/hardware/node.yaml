defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: node-network
    for: [text]
    desc: Enumerates network interfaces
    crit: notable
    conf: 0.85
    attack: T1016
    count_min: 1
    if:
      type: string_literal
      exact: __cleave_missing_os_networkinterfaces_call__
  - id: os-module-o-alias
    desc: os module assigned to o
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '\b(const|let|var)\s+o\s*=\s*require\s*\(\s*["''](node:)?os["'']\s*\)'
  - id: o-hostname-call
    desc: o.hostname() call
    crit: component
    conf: 0.75
    if:
      type: symbol
      exact: o.hostname
  - id: o-userinfo-call
    desc: o.userInfo() call
    crit: component
    conf: 0.78
    if:
      type: symbol
      exact: o.userInfo
  - id: o-platform-call
    desc: o.platform() call
    crit: component
    conf: 0.74
    if:
      type: symbol
      exact: o.platform
  - id: o-arch-call
    desc: o.arch() call
    crit: component
    conf: 0.74
    if:
      type: symbol
      exact: o.arch
  # NOTE: `node-sandbox-exec` (`word: sandbox-exec`, "Sandbox exec command
  # selector") was removed. `sandbox-exec` is the macOS seatbelt wrapper used to
  # confine a child process — it discovers nothing about the hardware, so a
  # hardware-fingerprinting objective was the wrong home and the wrong ML
  # feature, and the trait had no consumers. The canonical matcher is
  # micro-behaviors/os/security/sandbox::macos-sandbox-exec-command, next to the
  # sandbox_init / seccomp / pledge atoms it belongs with.
  - id: si-uuid-call
    desc: systeminformation si.uuid fingerprint
    crit: notable
    conf: 0.88
    attack: T1082
    if:
      type: symbol
      kind: call
      substr: si.uuid
  - id: si-cpu-call
    desc: "systeminformation si.cpu fingerprint"
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: text
      substr: "si.cpu("
  - id: si-chassis-call
    desc: systeminformation si.chassis fingerprint
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: symbol
      kind: call
      substr: si.chassis
  - id: systeminformation-import
    desc: Imports systeminformation library
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: import
      exact: systeminformation
  - id: si-baseboard-call
    desc: 'si baseboard call'
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: text
      substr: "si.baseboard("
  - id: si-disk-layout-call
    desc: 'si disk layout call'
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: text
      substr: "si.diskLayout("
  - id: si-system-call
    desc: "systeminformation si.system fingerprint"
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: text
      substr: "si.system("
composite_rules:
  - id: node-test-artifact
    desc: Node test artifact context
    crit: component
    any:
      - id: metadata/package/testing/harness/runtime::is-test
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/lang/scripted::dts-declaration-file
  - id: node-short-os-alias-host-user
    desc: Short os alias collects host/user
    crit: notable
    conf: 0.9
    attack: T1082
    all:
      - id: os-module-o-alias
      - id: o-hostname-call
      - id: o-userinfo-call
  - id: node-short-os-alias-profile
    desc: Short os alias profiles system
    crit: notable
    conf: 0.88
    attack: T1082
    all:
      - id: os-module-o-alias
    any:
      - id: o-hostname-call
      - id: o-userinfo-call
      - id: o-platform-call
      - id: o-arch-call
    needs: 3
