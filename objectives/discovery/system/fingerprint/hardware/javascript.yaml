defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
  attack: T1082
composite_rules:
  - id: js-sysinfo-multi
    desc: Multiple system info function calls
    crit: notable
    conf: 0.75
    for:
      - javascript
      - typescript
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: micro-behaviors/os/sysinfo/performance::node-os-totalmem
      - id: micro-behaviors/network/interface::node-network-interfaces-call
      - id: micro-behaviors/process/user/query::os-homedir-call
