defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
  attack: T1082
traits:
  - id: js-os-networkinterfaces-to-hex
    desc: "Hex-encodes network interfaces exfiltration"
    crit: suspicious
    conf: 0.95
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: os\.networkInterfaces\(\)[\s\S]{0,500}toHex
composite_rules:
  - id: js-profiling
    desc: Aggregates system info for profiling
    crit: notable
    conf: 0.8
    for:
      - javascript
      - typescript
    needs: 3
    any:
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: objectives/discovery/system/fingerprint/runtime::os-totalmem
      - id: micro-behaviors/os/network/interface::node-network-interfaces-call
      - id: micro-behaviors/process/user/query::os-homedir-call
  - id: js-sysinfo-multi
    desc: Multiple system info function calls
    crit: notable
    conf: 0.75
    for:
      - javascript
      - typescript
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: objectives/discovery/system/fingerprint/runtime::os-totalmem
      - id: micro-behaviors/os/network/interface::node-network-interfaces-call
      - id: micro-behaviors/process/user/query::os-homedir-call
  - id: js-victim-id
    desc: Victim identification (host + user)
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/user/query::os-userinfo-call
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/network/interface::node-network-interfaces-call
    unless:
      - id: metadata/library/vscode::vscode-extension-uninstall-telemetry
  - id: small-js-victim-id
    desc: Small JavaScript collects host/user identity
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: js-victim-id
      - id: metadata/file/metrics::javascript-small-file-5k
    unless:
      - id: metadata/lang/compiler/systems/
      - id: metadata/lang/compiler/systems::go-version-string
      - id: metadata/package/manifest/repository/
      - id: metadata/package/dependencies/manifest::platform-optional-native-wrapper
      - id: micro-behaviors/os/service/legitimate::npm-native-binary-wrapper
      - id: objectives/supply-chain/recon-exfil/install-hook::parcel-cpu-count-worker
      - id: metadata/library/vscode::vscode-extension-uninstall-telemetry
  - id: js-basic-recon-indicator
    desc: Basic host recon indicator
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/os/sysinfo/
      - id: micro-behaviors/process/user/query::os-homedir-call
  - id: js-recon-beacon-sink
    desc: JavaScript recon outbound sink
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
      - id: micro-behaviors/communications/http/request/client::request-write-call
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
  - id: js-encoded-recon-beacon
    desc: Encoded basic system reconnaissance beacon
    crit: hostile
    conf: 0.9
    mbc: E1082
    for:
      - javascript
      - typescript
    near_bytes: 2048
    all:
      - id: js-basic-recon-indicator
      - id: micro-behaviors/data/encode/hex::buffer-hex
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: js-recon-beacon-sink
    unless:
      - id: well-known/lib/network/node-edge/
