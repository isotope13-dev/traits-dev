# Windows cmd.exe host fingerprinting used by Node/Electron stealers such as
# Doenerium: code-page query plus process listing through system32\cmd.exe.
# Alone these commands appear in legitimate software; together with the
# absolute cmd.exe path they are a useful discovery signal for triage.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: "T1082,T1057"
  mbc: "B0012"

composite_rules:
  - id: cmd-chcp-tasklist-fingerprint
    desc: Windows cmd.exe code-page and process-list fingerprint
    crit: notable
    conf: 0.92
    near_bytes: 512
    all:
      - id: micro-behaviors/os/console/control::chcp-query-command
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/create/shell/path::system32-cmd-exe-path
