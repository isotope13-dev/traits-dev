defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-inline-recon-compromise-marker
  desc: Postinstall host and compromise marker clues
  crit: suspicious
  conf: 0.995
  attack: T1195.002,T1059.004,T1082,T1033
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/process/identity/query/command::inline-host-identity-recon
  - id: micro-behaviors/fs/path/temp::compromise-marker-output
# Install-time write of a compromise/proof-of-exec marker under a temp path is
# itself the payload: the package exists to prove code ran on the installer host.
