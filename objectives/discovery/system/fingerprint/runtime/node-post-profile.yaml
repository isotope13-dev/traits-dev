# Host-profile queries co-occur with JSON serialization and a POST option.
# This does not establish that the profile reaches the network request.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  - id: node-host-profile-json-post
    desc: Host profile queries with JSON and POST
    all:
      - id: micro-behaviors/os/sysinfo/hostname::node-os-alias-hostname-call
      - id: micro-behaviors/process/user/query::node-os-alias-userinfo-call
      - id: micro-behaviors/data/serialize/json
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/network/interface::node-mac-address-enumeration
      - id: objectives/discovery/system/fingerprint/hardware::node-short-os-alias-profile
      - id: micro-behaviors/network/interface::node-network-interfaces-call
