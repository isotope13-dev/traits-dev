defaults:
  platforms: [unix]
  for: [rust, elf]
  attack: T1041

traits:
  - id: unix-passwd-report-marker
    desc: Unix passwd report marker
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "===/etc/passwd==="
  - id: unix-ps-report-marker
    desc: Unix ps report marker
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: ps-ef
  - id: unix-netstat-report-marker
    desc: Unix netstat report marker
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: netstat-an
