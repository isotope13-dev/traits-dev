defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [go, elf, pe, macho]
  attack: T1082
  mbc: B0012
composite_rules:
  - id: go-system-info-discovery
    desc: System information discovery (Go)
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::runtime-goos
      - id: micro-behaviors/os/sysinfo/platform/runtime::runtime-goarch
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/harness/unit::go-test
      - id: well-known/tool/development/go-toolchain::go-toolchain-source-path
      - id: well-known/tool/development/go-toolchain::go-toolchain-distribution
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context
