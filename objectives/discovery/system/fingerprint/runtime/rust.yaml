defaults:
  platforms: [unix]
  for: [rust, elf]
  attack: T1082

composite_rules:
  - id: rust-system-info-discovery
    desc: Rust system and process discovery
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/os/sysinfo/platform/kernel::rust-uname-command
      - id: micro-behaviors/process/enumerate/ps::rust-ps-command
      - id: micro-behaviors/os/network/status::rust-netstat-command
      - id: objectives/exfiltration/stealer/host-profile/http::unix-passwd-report-marker
      - id: objectives/exfiltration/stealer/host-profile/http::unix-ps-report-marker
      - id: objectives/exfiltration/stealer/host-profile/http::unix-netstat-report-marker
    needs: 2
