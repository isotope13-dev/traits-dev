# System Information Discovery - Python
# Detects Python scripts enumerating Windows/Unix system info via shell commands
# ATT&CK: T1082 (System Information Discovery)
# MBC: B0012 (Operating System Discovery)
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1082"
  mbc: "B0012"
  crit: notable

composite_rules:
  # os.popen + Windows recon command = system discovery
  - id: python-win-cmd-recon
    desc: Windows system recon command via Python popen
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
    any:
      - id: micro-behaviors/os/sysinfo/profile::systeminfo-command-reference
      - id: metadata/lang/source/syntax/command/invocation::python-net-account-query-command-literal
