# System Information Discovery - JavaScript/Node.js
# GuardDog-inspired: Detects system information gathering
# ATT&CK: T1082 (System Information Discovery)
# MBC: B0012 (Operating System Discovery)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1082"
  mbc: "B0012"
  crit: notable

traits:
  - id: js-execsync-host-recon-sequence
    desc: execSync runs host identity probes
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\.execSync\(\s*["'']\s*id\s*;\s*hostname\s*;\s*uname\s+-a\b'
  - id: js-hostname-id-uname-chain
    desc: Chains hostname id uname probes
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'hostname\s*(&&|;)\s*id\s*(&&|;)\s*uname\s+-a'
  - id: js-hostname-id-resolver-chain
    desc: Chains host, user, and resolver probes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'hostname\s*(&&|;)\s*id\s*(&&|;)[^\r\n]{0,160}/etc/resolv\.conf\b'
  - id: js-execsync-host-recon-command
    desc: Shell command combines host identity probes
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: execSync
      arg:
        kind: string
        # Require shell identity tools, not AppleScript "application id" or
        # JS template interpolations like process.env.* inside the command text.
        regex: '(?<!application )\b(id|whoami|hostname)\b[\s\S]{0,240}(?<!process\.)\b(env|printenv)\b|(?<!process\.)\b(env|printenv)\b[\s\S]{0,240}(?<!application )\b(id|whoami|hostname)\b|\bid\s*;\s*hostname\s*;\s*uname\s+-a\b'

composite_rules:
  - id: js-shell-host-identity-recon-chain
    desc: Shell chain collects host and user identity
    crit: suspicious
    conf: 0.97
    any:
      - id: js-hostname-id-uname-chain
      - id: js-hostname-id-resolver-chain
  # GuardDog: System information discovery
  - id: js-system-info-discovery
    desc: System information discovery (JS)
    crit: notable
    conf: 0.85
    needs: 3
    any:
      - id: micro-behaviors/process/user/query::os-homedir-call
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: micro-behaviors/os/sysinfo/performance/metrics::node-os-totalmem
      - id: micro-behaviors/os/network/interface::node-network-interfaces-call
  - id: js-constructor-host-recon-command
    desc: Constructor runs shell host reconnaissance
    crit: hostile
    conf: 0.99
    attack: "T1059.007,T1033,T1082"
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-constructor-execsync
      - id: js-execsync-host-recon-command
  - id: js-host-recon-compromise-marker-write
    desc: Shell host reconnaissance is written to a compromise marker
    crit: hostile
    conf: 0.99
    attack: "T1059.004,T1082,T1033"
    all:
      - id: js-execsync-host-recon-sequence
      - id: objectives/impact/deface/proof::compromise-marker-filename
  - id: js-silenced-execsync-host-recon
    desc: Swallowed execSync host identity probes
    crit: hostile
    conf: 0.97
    attack: "T1059.007,T1082,T1033"
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: js-hostname-id-uname-chain
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
