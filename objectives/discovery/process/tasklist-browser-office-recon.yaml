defaults:
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
  for:
    - binaries
    - scripts
    - source
    - manifests
    - documents
    - media
    - data
  crit: notable

composite_rules:
  - id: tasklist-browser-office-with-ip
    desc: Tasklist with browser, office and external IP references
    conf: 1.0
    all:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/os/application/target/browser::browser-apps
      - id: micro-behaviors/os/application/target/productivity::office-apps
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
