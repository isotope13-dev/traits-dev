defaults:
  platforms: [ios]
  for: [csharp]
  attack: T1057

traits:
  - id: dotnet-ios-proc-listpids
    desc: .NET iOS proc_listpids import
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: proc_listpids
    unless:
      - id: well-known/tool/offensive/mythic::mythic-athena-source-tree

  - id: dotnet-ios-proc-pidpath
    desc: .NET iOS proc_pidpath import
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: proc_pidpath
    unless:
      - id: well-known/tool/offensive/mythic::mythic-athena-source-tree

composite_rules:
  - id: dotnet-ios-process-enumeration
    desc: .NET iOS process enumeration
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/discovery/process::dotnet-ios-proc-listpids
      - id: objectives/discovery/process::dotnet-ios-proc-pidpath
    unless:
      - id: well-known/tool/offensive/mythic::mythic-athena-source-tree
