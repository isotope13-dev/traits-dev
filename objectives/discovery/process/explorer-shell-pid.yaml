defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1057
composite_rules:
  - id: obfuscated-shell-process-discovery
    desc: Flattened control flow resolves desktop shell process identifier
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/info/query::shell-window-and-pid-api-references
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::repeated-cmov-relative-branch-tables-x64
    unless:
      - id: metadata/signature/verified/
