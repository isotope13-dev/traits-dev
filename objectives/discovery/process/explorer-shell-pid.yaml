defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1057
composite_rules:
  - id: shell-window-process-discovery
    desc: Resolves desktop shell window to target process identifier
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/ui/window/station::get-shell-window
      - id: micro-behaviors/ui/window/enumerate::get-window-thread-process-id

  - id: obfuscated-shell-process-discovery
    desc: Flattened control flow resolves desktop shell process identifier
    crit: suspicious
    conf: 0.95
    all:
      - id: shell-window-process-discovery
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::repeated-cmov-relative-branch-tables-x64
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified
