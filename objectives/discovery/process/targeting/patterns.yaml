# Process Discovery for Targeting
# Detection of process enumeration combined with process access
# Indicates intent to discover and target specific processes
# ATT&CK: T1057 (Process Discovery), T1562.001 (Impair Defenses)
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1057"
  mbc: "E1057"
traits:
composite_rules:
- id: toolhelp-enumeration-recognized-marker
  desc: Recognized ToolHelp enumeration marker
  crit: component
  conf: 0.85
  any:
  - id: well-known/tool/reverse-engineering/ida-pin-tracer::ida-pin-tracer-plugin
  - id: well-known/tool/reverse-engineering/armnf::marker
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/symbols/count::many-exports-200
  - id: micro-behaviors/ui/window/control::browser-selection-ui-resource
  - id: well-known/lib/platform/psutil::windows-extension
  - id: metadata/binary/installer/family::known-benign-installer
  - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
  - id: well-known/lib/platform/wmi::wmi-win32-provider-versioninfo
