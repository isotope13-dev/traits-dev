defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: module-target-remote-thread-apis
    desc: Module targeting and remote-thread APIs
    crit: suspicious
    conf: 0.985
    mbc: "E1055"
    all:
      - id: objectives/discovery/process::anchor-dll-module-enumeration
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
    unless:
      - id: well-known/tool/development/editor/visual-studio::diagnostics-hub
