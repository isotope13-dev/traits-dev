# csvde.exe (Active Directory CSV exporter) used as a LOLBin for
# domain reconnaissance. Legitimate Windows utility for exporting AD
# objects to CSV; common in attacker workflows for offline analysis
# of users, groups, and computers. SHADOW-EARTH-053 invokes it from
# w3wp.exe via a web shell.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1087.002
  mbc: E1087
traits:
  - id: csvde-cmd
    desc: csvde.exe AD export command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bcsvde(\.exe)?\b[^\n]{0,200}-f\s+'
      case_insensitive: true
  - id: nltest-dclist
    desc: nltest /dclist domain controller discovery
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'nltest[^\n]{0,40}/dclist'
      case_insensitive: true
  - id: powerview-getdomainuser
    desc: PowerView Get-DomainUser cmdlet
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Get-DomainUser\b|Get-NetUser\b'
  - id: adfind-script-command
    desc: AdFind command-line reference in script
    crit: notable
    conf: 0.94
    for: [scripts]
    if:
      type: text
      regex: '(?i)\badfind(\.exe)?\b'

  # Akira and similar RaaS affiliates dump every AD user/computer with full
  # properties to ProgramData before encryption (Huntress Safe Mode case).
  - id: formatenumerationlimit-unbounded
    desc: Unbounds PowerShell format enumeration limit
    crit: notable
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$formatenumerationlimit\s*=\s*-1\b'

  - id: get-aduser-all-properties
    desc: Get-ADUser dumps all properties
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bGet-ADUser\b[^\r\n]{0,120}-Filter\s+\*[^\r\n]{0,80}-Properties\s+\*'

  - id: get-adcomputer-all-properties
    desc: Get-ADComputer dumps all properties
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bGet-ADComputer\b[^\r\n]{0,120}-Filter\s+\*[^\r\n]{0,80}-Propert(y|ies)\s+\*'

  - id: programdata-adusers-export
    desc: Exports AD users under ProgramData
    crit: notable
    conf: 0.96
    for: [powershell, batch, text]
    if:
      type: text
      regex: '(?i)(\\ProgramData\\|%ProgramData%\\)AdUsers\.txt\b'

  - id: programdata-adcomp-export
    desc: Exports AD computers under ProgramData
    crit: notable
    conf: 0.96
    for: [powershell, batch, text]
    if:
      type: text
      regex: '(?i)(\\ProgramData\\|%ProgramData%\\)AdComp\.txt\b'
  # Reading the description attribute off raw ADSI results: pre-attack
  # assessment scripts (TerminalFix-style) harvest user descriptions because
  # admins annotate service accounts there. Benign scripts rarely walk
  # DirectorySearcher results for this specific property.
  - id: directorysearcher-description-property
    desc: Reads AD result description property
    crit: component
    conf: 0.88
    for: [powershell]
    if:
      type: text
      regex: '(?i)Properties\s*\[\s*["'']description["'']\s*\]'

composite_rules:
  - id: ad-recon-lolbins
    desc: Active Directory reconnaissance via LOLBins
    crit: suspicious
    conf: 0.93
    needs: 2
    any:
      - id: objectives/discovery/account/ad::csvde-cmd
      - id: objectives/discovery/account/ad::nltest-dclist
      - id: objectives/discovery/account/ad::powerview-getdomainuser
      - id: adfind-computer-query
  - id: adfind-computer-query
    desc: AdFind computer-object query
    crit: suspicious
    conf: 0.96
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/os/security/directory-service::ldap-computer-object-filter
    any:
      - id: well-known/tool/offensive/adfind::adfind-command
      - id: adfind-script-command
    near_lines: 4
    unless:
      - id: well-known/tool/offensive/adfind::adfind-binary-context

  - id: domain-wide-ad-property-dump
    desc: Domain-wide AD user and computer property dump
    crit: suspicious
    conf: 0.97
    for: [powershell]
    all:
      - id: get-aduser-all-properties
      - id: get-adcomputer-all-properties
    near_lines: 8

  - id: programdata-ad-recon-export
    desc: Writes full AD recon dumps under ProgramData
    crit: suspicious
    conf: 0.98
    for: [powershell]
    all:
      - id: domain-wide-ad-property-dump
      - id: programdata-adusers-export
      - id: programdata-adcomp-export
    any:
      - id: formatenumerationlimit-unbounded
    near_lines: 12

  - id: adsisearcher-user-description-harvest
    desc: ADSI harvest of AD user descriptions
    crit: suspicious
    conf: 0.92
    for: [powershell]
    all:
      - id: micro-behaviors/os/security/directory-service::powershell-directory-searcher
      - id: directorysearcher-description-property
    near_lines: 16
