# Source binding and a global connect override are the routing mechanism in
# the published LDAP audit snippet. These findings indicate candidate account
# discovery, not ticket extraction, cracking, or proof of a VPN connection.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.93
  attack: T1087.002

composite_rules:
  - id: source-bound-preauth-disabled-discovery
    desc: Source-bound preauth-disabled account search
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/configure::python-global-connect-source-bind
      - id: micro-behaviors/os/security/directory-service::python-search-filter-call
      - id: micro-behaviors/os/security/directory-service::preauthentication-disabled-filter

  - id: source-bound-spn-account-discovery
    desc: Source-bound noncomputer SPN account search
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/configure::python-global-connect-source-bind
      - id: micro-behaviors/os/security/directory-service::python-search-filter-call
      - id: micro-behaviors/os/security/directory-service::noncomputer-spn-filter
