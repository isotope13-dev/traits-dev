# Exchange account-existence enumeration against Crypto.com's mona passkey
# verify_option endpoint (Operation ASTERIX cdc checker). Bulk phone→account
# validation is reconnaissance for vishing, not a normal client login.
defaults:
  platforms: [windows, unix]
  for: [go, python, javascript, typescript, scripts]
  attack: T1589.002
  crit: notable
  conf: 0.94

traits:
  - id: crypto-com-passkey-verify-option
    desc: Crypto.com passkey verify_option account probe
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: app.mona.co/api/passkeys/verify_option

  - id: phone-json-account-probe-body
    desc: JSON body probes account existence by phone
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"phone"\s*:\s*"?\+?%?s?"?|"phone"\s*:\s*"\+'

composite_rules:
  - id: exchange-phone-account-enumeration
    desc: Enumerates exchange accounts by phone via passkey API
    crit: suspicious
    conf: 0.96
    all:
      - id: crypto-com-passkey-verify-option
      - id: phone-json-account-probe-body
    any:
      - id: micro-behaviors/communications/http/lib/netlib::go-http-newrequest
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/lib/netlib::net-http-import
    needs: 1
