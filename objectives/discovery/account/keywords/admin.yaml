defaults:
  crit: baseline
  conf: 0.2
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1110.001
  mbc: B0028
traits:
  - id: admin-name-after-login-field
    desc: Admin name follows a login field
    if:
      type: text
      regex: '(?i)\b(username|login|account)\b[^\n]{0,40}\badmin(istrator)?\b'
    unless:
      - id: well-known/lib/crypto/
      - type: text
        regex: (?i)[\\/]admin[\\/]
      - type: text
        regex: (?i)[\\/]administrator[\\/]
      - type: text
        regex: (?i)onecoreuap\\\\admin\\\\
  - id: admin-name-after-credential-field
    desc: Admin name follows a credential field
    if:
      type: text
      regex: '(?i)\b(password|passwd|credential)\b[^\n]{0,40}\badmin(istrator)?\b'
    unless:
      - id: well-known/lib/crypto/
      - type: text
        regex: (?i)[\\/]admin[\\/]
      - type: text
        regex: (?i)[\\/]administrator[\\/]
      - type: text
        regex: (?i)onecoreuap\\\\admin\\\\
