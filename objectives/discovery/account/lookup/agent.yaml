# Agent configurations that request account-identity discovery commands.
# The commands are suspicious intent signals; the process/shell mechanics stay
# in micro-behaviors and are combined here only by objective composites.
defaults:
  platforms: [unix, windows]
  for: [json]
  attack: T1087

traits:
  - id: agent-config-id-command
    desc: Agent config requests id command
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '(^|[;&|]\s*)id(\s|[>&|;]|$)'

  - id: agent-config-whoami-command
    desc: Agent config requests whoami command
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '(^|[;&|]\s*)whoami(\s|[>&|;]|$)'

composite_rules: []
