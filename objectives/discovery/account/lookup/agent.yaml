# Account-identity discovery requests, including agent configurations and
# commands embedded in a Jinja execution payload. General process/shell
# mechanics stay in micro-behaviors.
defaults:
  crit: suspicious
  conf: 0.95
  platforms: [unix, windows]
  for: [json]
  attack: T1087

traits:
  - id: agent-config-id-command
    desc: Agent config requests id command
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '(^|[;&|]\s*)id(\s|[>&|;]|$)'

  - id: agent-config-whoami-command
    desc: Agent config requests whoami command
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '(^|[;&|]\s*)whoami(\s|[>&|;]|$)'

  - id: json-popen-whoami-call
    desc: JSON popen call queries whoami
    crit: suspicious
    conf: 0.96
    attack: T1033
    if:
      type: text
      regex: '(?i)popen\s*\(\s*[''"]whoami[''"]'

composite_rules:
  - id: jinja-whoami-account-query
    desc: Jinja payload queries current account
    crit: hostile
    conf: 0.99
    attack: T1033
    all:
      - id: objectives/execution/interpreter/eval/remote::jinja-template-code-execution
      - id: json-popen-whoami-call
