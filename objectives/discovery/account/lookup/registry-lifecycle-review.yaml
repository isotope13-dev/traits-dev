defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

composite_rules:
- id: internal-app-package-whoami-clues
  desc: Internal App description and whoami clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/description/presence::meta-internal-app-desc
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-curl
  - id: metadata/package/empty::versioned-readme-error
  - id: metadata/package/publishing::meta-single-file-dist
  - id: metadata/package/scripts/reference::meta-hook-pipedream
  needs: 2
- id: package-whoami-and-hook-clues
  desc: Whoami substitution and lifecycle-hook clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/communications/http/curl/command::postinstall-curl-command-text
  - id: micro-behaviors/communications/http/request/package::meta-install-curl
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: micro-behaviors/process/identity/query/command::package-id-command-substitution
  - id: objectives/supply-chain/impersonation/registry/manifest::hook-cmd-query-exfil
  needs: 2
