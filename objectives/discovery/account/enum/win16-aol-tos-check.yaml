# Win16 AOL screen-name checker. A "TOS check" submits a list of names and
# reports which ones exist, using the AOL name-lookup result text. Bulk
# checking screen names builds target lists for spam and phishing, but a
# single lookup in a legitimate AOL utility also fits. The composite is
# suspicious and needs the AOL frame lookup as its third leg.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1087

traits:
  - id: aol-tos-check-ui
    desc: Win16 program offers TOS screen-name check
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      substr: 'tos check'

  - id: aol-name-lookup-result
    desc: AOL name-lookup result text
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: '(member directory search results|error retrieving names|no matches were found for)'

  # Locate Member Online and Get a Member's Profile are ordinary AOL windows,
  # so they stay notable. A bot that asks whether each name is online and
  # reports "not a known member" or "No Profile For" builds a live-account list.
  - id: aol-member-locate-ui
    desc: Win16 AOL locate-member or profile lookup UI
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: 'locate member online|get a member''?s profile'

  - id: aol-member-status-text
    desc: AOL member not-known or no-profile reply text
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: 'not a known aol member|no profile for '

composite_rules:
  - id: win16-aol-member-liveness-probe
    desc: Win16 AOL tool probes which screen names are online
    crit: suspicious
    conf: 0.9
    all:
      - id: aol-member-locate-ui
      - id: aol-member-status-text
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup

  - id: win16-aol-tos-name-check
    desc: Win16 AOL tool bulk-checks screen names via TOS check
    crit: suspicious
    conf: 0.9
    all:
      - id: aol-tos-check-ui
      - id: aol-name-lookup-result
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
