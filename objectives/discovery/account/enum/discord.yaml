defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1087

traits:
  - id: python-discord-member-enumeration
    desc: Python Discord member enumeration
    crit: suspicious
    conf: 0.94
    for: [python]
    if:
      type: string_literal
      regex: '(?i)(enumerate all (discord (users|members)|guild members)|list every guild)'

composite_rules:
  - id: discord-token-member-enumeration
    desc: Discord token member enumeration
    crit: suspicious
    conf: 0.96
    scope: archive
    for: [whl]
    all:
      - id: python-discord-member-enumeration
      - id: objectives/credential-access/discord/token::api-guilds
      - id: micro-behaviors/data/db/sqlite::python-sqlite3-import
      - id: micro-behaviors/communications/http/services/discord::api-url
