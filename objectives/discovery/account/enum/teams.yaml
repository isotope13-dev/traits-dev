# Microsoft Teams exposes an external-user resolver intended for interactive
# people search. Driving that resolver from a parsed account collection turns
# it into a tenant account-existence oracle, as used before password spraying.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, powershell, csharp]
  attack: T1087.004,T1589.002
  mbc: E1589

composite_rules:
  - id: teams-bulk-account-enumeration
    desc: Enumerates Microsoft 365 accounts through Teams external search
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/contact-resolution::teams-api-base-endpoint
      - id: micro-behaviors/communications/http/contact-resolution::teams-external-user-search-endpoint
    any:
      - id: micro-behaviors/data/control-flow/loop::user-collection-loop
      - id: micro-behaviors/data/control-flow/loop::account-collection-loop
      - id: micro-behaviors/data/control-flow/loop::csharp-user-collection-loop
      - id: micro-behaviors/data/control-flow/loop::csharp-account-collection-loop
      - id: micro-behaviors/data/control-flow/loop::script-user-collection-loop
      - id: micro-behaviors/data/control-flow/loop::script-account-collection-loop
    near_bytes: 2200
