# Windows local-administrator discovery over SAM RPC: the SAMR call opens the
# Builtin domain alias RID 544 (Administrators — the RID is mandated by
# Windows) and reads its members, then LSAT translates the member SIDs to
# domain-qualified names. Dual-use: the same survey serves admin audits and
# foothold reconnaissance, so the composite stays suspicious.
defaults:
  platforms: [windows, unix]
  for: [python, source, scripts]
  attack: T1087.001

traits:
  - id: impacket-samr-get-members-in-alias
    desc: Impacket SAMR alias-membership query call
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: hSamrGetMembersInAlias
  - id: impacket-samr-open-builtin-alias
    desc: Impacket SAMR Builtin alias open call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'hSamrOpenAlias\([^)]{0,120}aliasId\s*=\s*544\b'
  - id: impacket-lsat-lookup-sids
    desc: Impacket LSAT SID translation call
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: hLsarLookupSids

composite_rules:
  - id: samr-lsa-local-admin-enum
    desc: SAMR and LSA local administrator enumeration
    crit: suspicious
    conf: 0.9
    all:
      - id: impacket-samr-open-builtin-alias
      - id: impacket-lsat-lookup-sids
