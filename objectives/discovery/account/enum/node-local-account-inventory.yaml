# Node code that enumerates local accounts on both platform branches:
# Windows `net user`/`whoami /priv` and the Unix account database. Ordinary
# tools need one platform's identity, not a full local account inventory.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1087.001,T1069.001,T1033
composite_rules:
  - id: node-cross-platform-account-enumeration
    desc: Node enumerates local users, groups and privileges
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/user/lookup::js-exec-net-user-localgroup-list
      - id: micro-behaviors/os/privilege/query::js-exec-whoami-privileges
    any:
      - id: micro-behaviors/fs/path/account-db::node-passwd-path-reference
      - id: micro-behaviors/fs/path/config/groups::etc-group
