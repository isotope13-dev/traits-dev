# Git Credential Manager exposes provider-specific account operations through
# `git credential-manager <provider> ...`. The GitHub list operation enumerates
# configured identities but does not return their stored secrets.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: gcm-github-list-command-string
    desc: Lists GitHub accounts via GCM
    crit: notable
    conf: 0.96
    attack: T1087
    if:
      type: string_literal
      regex: '^\s*git(\.exe)?\s+credential-manager(-core)?\s+github\s+list(\s+--no-ui)?\s*$'

  - id: gcm-git-argv-prefix
    desc: Git Credential Manager argv prefix
    crit: component
    conf: 0.96
    for: [python, javascript, typescript, go, rust, ruby, java, csharp]
    if:
      type: text
      regex: '["'']git(\.exe)?["'']\s*,\s*["'']credential-manager(-core)?["'']'

  - id: gcm-github-list-argv-tail
    desc: GitHub list argv tail
    crit: component
    conf: 0.96
    for: [python, javascript, typescript, go, rust, ruby, java, csharp]
    if:
      type: text
      regex: '["'']github["'']\s*,\s*["'']list["'']'

composite_rules:
  - id: gcm-github-list-argv
    desc: Lists GitHub accounts via GCM argv
    crit: notable
    conf: 0.97
    attack: T1087
    near_lines: 2
    all:
      - id: gcm-git-argv-prefix
      - id: gcm-github-list-argv-tail
