defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  - -applescript
  - -vbs
  - -beam
  - -clojure
  - -staticlib
  - -pyc
  attack: T1589.002
  mbc: E1589
composite_rules:
- id: member-account-resolution-endpoint
  desc: Member-account resolution API endpoint
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/communications/http/contact-resolution::find-friends-endpoint
  - id: micro-behaviors/communications/http/contact-resolution::email-availability-oracle-endpoint
- id: contact-import-batch-payload
  desc: Address-book import batch request payload
  crit: notable
  conf: 0.9
  all:
  - id: metadata/lang/source/syntax/key-value::contact-collection-field
  - id: micro-behaviors/communications/http/request/body/application-state::address-book-source-marker
  near_bytes: 512
- id: bulk-contact-resolution-sweep
  desc: Bulk address list swept across account resolvers
  crit: suspicious
  conf: 0.93
  attack: T1087
  all:
  - id: metadata/lang/source/syntax/key-value::contact-collection-field
  - id: member-account-resolution-endpoint
  any:
  - id: micro-behaviors/communications/http/contact-resolution
  needs: 2
- id: email-oracle-with-contact-resolver
  desc: Signup email oracle beside contact resolver
  crit: suspicious
  conf: 0.93
  attack: T1087
  all:
  - id: micro-behaviors/communications/http/contact-resolution::email-availability-oracle-endpoint
  - id: micro-behaviors/communications/http/contact-resolution::find-friends-endpoint
- id: contact-resolution-identity-rotation
  desc: Bulk contact resolution behind rotating User-Agents
  crit: suspicious
  conf: 0.93
  attack: T1087
  all:
  - id: metadata/lang/source/syntax/key-value::contact-collection-field
  - id: micro-behaviors/communications/http/user-agent::user-agent-pool-rotation
  - id: member-account-resolution-endpoint
- id: rate-limit-aware-account-enumerator
  desc: Bulk account enumeration with rate-limit handling
  crit: hostile
  conf: 0.95
  attack: T1589.002,T1087
  all:
  - id: metadata/lang/source/syntax/key-value::contact-collection-field
  - id: micro-behaviors/communications/http/response::rate-limit-header-handling
  - id: member-account-resolution-endpoint
  near_bytes: 8192
- id: proxy-rotated-account-enumerator
  desc: Bulk account enumeration via rotating proxies
  crit: hostile
  conf: 0.95
  attack: T1589.002,T1090.003
  all:
  - id: metadata/lang/source/syntax/key-value::contact-collection-field
  - id: micro-behaviors/communications/http/proxy::proxy-pool-rotation
  - id: member-account-resolution-endpoint
- id: contact-import-directory-harvester
  desc: Member directory harvested via contact resolver
  crit: hostile
  conf: 0.96
  attack: T1119,T1213
  mbc: E1119
  all:
  - id: metadata/lang/source/syntax/key-value::contact-collection-field
  - id: metadata/file/string/account::account-field-vocabulary
  - id: micro-behaviors/fs/write/file
  - id: member-account-resolution-endpoint
