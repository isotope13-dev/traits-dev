traits:
  - id: kerberos-spn-enumeration-reference
    for: [python, powershell, javascript, typescript, go, csharp, perl, ruby, php]
    platforms: [windows, unix]
    desc: SPN enumeration command or identifier reference
    crit: notable
    conf: 0.9
    if:
      type: text
      # `servicePrincipalName` is a normal field in GSSAPI client code, not
      # evidence that the program enumerates accounts.
      regex: '(?i)\b(GetUserSPNs|SERVICE_SPNS|enum_spns)\b'
