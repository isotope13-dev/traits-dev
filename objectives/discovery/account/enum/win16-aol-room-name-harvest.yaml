# Win16 AOL room name harvest. A program that collects screen names from the
# people in chat rooms builds a target list for mass mail. The collect-names
# prompt is also ordinary text in benign AOL tools, so the composite stays
# suspicious and needs the AOL frame lookup as its second leg.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1087

traits:
  - id: aol-room-name-collect-text
    desc: Collects screen names from chat room lists
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      regex: '(collect|get(ting)?) names from'

composite_rules:
  - id: win16-aol-room-name-harvest
    desc: Win16 AOL tool collects screen names from chat rooms
    crit: suspicious
    conf: 0.88
    all:
      - id: aol-room-name-collect-text
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
