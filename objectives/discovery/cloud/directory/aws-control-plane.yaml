# The guide correlates ten of the listed Describe* CloudTrail events in a
# thirty-minute window. A file-level analogue requires ten distinct event or
# source-call atoms; the surrounding collector provides the time window.
defaults:
  crit: suspicious
  conf: 0.95
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1526

  # The wire-action dispatch and response XML element names belong to a
  # server implementing the EC2 query protocol; a discovery burst is a
  # client-side claim, so an AWS-compatible endpoint is excluded below.

composite_rules:
  - id: aws-describe-discovery-burst
    desc: AWS EC2 describe-operation discovery burst
    needs: 10
    any:
      - id: micro-behaviors/communications/http/services/aws-discovery
    unless:
      - id: well-known/lib/cloud/aws-sdk-go::aws-sdk-go-context
      - id: well-known/lib/cloud/aws-sdk-go-v2::aws-sdk-go-v2-context
      - id: well-known/lib/cloud/capo::capo-aws-sdk-context
      - id: micro-behaviors/communications/http/services/aws-ec2::aws-ec2-query-response-marshalling

  - id: aws-discovery-and-instance-export
    desc: AWS discovery followed by instance export
    all:
      - id: objectives/discovery/cloud/directory::aws-describe-discovery-burst
      - id: micro-behaviors/communications/http/services/aws-ec2::aws-instance-export-operation
    unless:
      - id: well-known/lib/cloud/aws-sdk-go::aws-sdk-go-context
      - id: well-known/lib/cloud/aws-sdk-go-v2::aws-sdk-go-v2-context
      - id: well-known/lib/cloud/capo::capo-aws-sdk-context
