# Bulk Entra ID (Microsoft Graph) directory and permission-surface enumeration.
#
# Identity-plane attacks skip the endpoint entirely: with a stolen token the
# operator walks the tenant over Graph to learn who can grant what — service
# principals, app registrations, directory roles, role assignments and consent
# grants — before minting a new credential and pivoting.  The source report
# names AzureHound, ROADrecon and GraphRunner as tools that automate exactly
# this sweep.  Legitimate apps hit one or two of these resources consistently;
# touching several distinct high-value directory resources in one place is the
# reconnaissance fingerprint.
#
# Detection is structural: the Graph resource collection names and the SDK
# cmdlets that read them, never prose describing enumeration.  Each token is
# Graph-specific. The composite also requires a Graph service-host reference
# and counts distinct resources, including equivalent source/binary forms once.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1087.004,T1526

traits:
  - id: graph-service-principal-enum-cmdlet
    desc: Enumerates service principals via Graph SDK
    crit: notable
    conf: 0.85
    for: [scripts]
    if:
      type: text
      regex: '(?i)\bGet-Mg(Beta)?ServicePrincipal\b'

  - id: graph-directory-role-enum-cmdlet
    desc: Enumerates directory roles via Graph SDK
    crit: notable
    conf: 0.85
    for: [scripts]
    if:
      type: text
      regex: '(?i)\bGet-Mg(Beta)?DirectoryRole\b'

  - id: graph-oauth-grant-enum-cmdlet
    desc: Enumerates OAuth2 grants via Graph SDK
    crit: notable
    conf: 0.85
    for: [scripts]
    if:
      type: text
      regex: '(?i)\bGet-Mg(Beta)?Oauth2PermissionGrant\b'

composite_rules:
  - id: entra-finance-personnel-enumeration
    desc: Enumerates Entra users by payroll and finance roles
    crit: suspicious
    conf: 0.98
    for: [scripts, binaries, json, text]
    attack: T1087.004
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/services/microsoft::graph-user-directory-bulk-page
    any:
      - id: micro-behaviors/communications/http/services/microsoft::graph-user-directory-finance-search
      - id: micro-behaviors/communications/http/services/microsoft::graph-user-directory-hr-search
    near_bytes: 4096

  - id: entra-directory-enumeration
    desc: Bulk Entra directory enumeration via Graph
    crit: suspicious
    conf: 0.9
    all:
    - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
    any:
    - id: micro-behaviors/communications/http/services/microsoft::graph-service-principals-path
    - id: micro-behaviors/communications/http/services/microsoft::graph-directory-roles-path
    - id: micro-behaviors/communications/http/services/microsoft::graph-app-authority-path
    # Count resources once: a directory selector would count both new path
    # atoms and their source/binary grouping composites as separate resources.
    - id: micro-behaviors/communications/http/services/entra-directory::organization-path
    - id: micro-behaviors/communications/http/services/entra-directory::user-collection-path
    - id: micro-behaviors/communications/http/services/entra-directory::group-collection-path
    - id: micro-behaviors/communications/http/services/entra-directory::domain-collection-path
    - id: micro-behaviors/communications/http/services/entra-directory::resource-tenants-path
    - id: micro-behaviors/communications/http/services/entra-directory::user-transitive-roles-path
    - id: micro-behaviors/communications/http/services/entra-directory::user-owned-service-principals-path
    - id: objectives/persistence/login/oauth::oauth-permission-grant-endpoint
    - id: graph-service-principal-enum-cmdlet
    - id: graph-directory-role-enum-cmdlet
    - id: graph-oauth-grant-enum-cmdlet
    needs: 3
    near_bytes: 8192
    unless:
    - id: well-known/app/media/maester/
    - id: well-known/tool/detection/
    - id: metadata/lang/scripted::dts-declaration-file
    - id: well-known/app/infrastructure/azure-cli::azure-cli-context
    - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
    - id: metadata/file/profile/markup::assessment-playbook-examples
    - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide

  # A second surveyed identity store is distinct from Graph-only directory
  # mapping. Authorized audits can do this too; no exfiltration or hostile
  # verdict follows from these normal authenticated API operations.
  - id: cross-saas-user-directory-recon
    desc: Graph survey with ServiceNow user export
    crit: suspicious
    conf: 0.92
    attack: T1087.004
    all:
      - id: entra-directory-enumeration
      - id: micro-behaviors/communications/http/services/servicenow::servicenow-user-export-path
    near_bytes: 8192
