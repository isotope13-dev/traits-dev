# Bulk user-directory collection through the legacy MSOnline and AzureAD
# PowerShell modules. A single-user lookup is routine administration, so the
# cmdlet alone remains notable. The suspicious findings require either the
# explicit full-directory switch or a CSV export carrying the distinctive
# Entra/Azure AD directory schema described in the source report.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1087.004

traits:
  - id: legacy-entra-user-enumeration-cmdlet
    desc: Calls a legacy Entra user-enumeration cmdlet
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^Get-(AzureAD|Msol)User$'

  - id: legacy-msol-all-users-syntax
    desc: Contains Get-MsolUser full-enumeration syntax
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bGet-MsolUser\b[^\r\n|;]{0,160}[ \t]-All([ \t]|$)'

  - id: legacy-azuread-all-true-syntax
    desc: Contains Get-AzureADUser -All true syntax
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bGet-AzureADUser\b[^\r\n|;]{0,160}[ \t]-All([ \t]+|:)\$true\b'

  - id: legacy-azuread-all-one-syntax
    desc: Contains Get-AzureADUser -All one syntax
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bGet-AzureADUser\b[^\r\n|;]{0,160}[ \t]-All[ \t]+1\b'

  - id: entra-facsimile-telephone-property
    desc: References Entra facsimile telephone property
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^FacsimileTelephoneNumber$'

  - id: entra-physical-office-property
    desc: References the Entra physical office property
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^PhysicalDeliveryOfficeName$'

  - id: entra-usage-location-property
    desc: References the Entra usage-location property
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^UsageLocation$'

composite_rules:
  - id: legacy-entra-directory-schema
    desc: References a legacy Entra user-directory property set
    crit: notable
    conf: 0.97
    all:
      - id: entra-facsimile-telephone-property
      - id: entra-physical-office-property
      - id: entra-usage-location-property
    near_bytes: 2048

  - id: legacy-entra-full-user-enumeration
    desc: Enumerates every Entra user through a legacy PowerShell module
    crit: suspicious
    conf: 0.96
    all:
      - id: legacy-entra-user-enumeration-cmdlet
    any:
      - id: legacy-msol-all-users-syntax
      - id: legacy-azuread-all-true-syntax
      - id: legacy-azuread-all-one-syntax
    near_bytes: 256

  - id: legacy-entra-directory-csv-export
    desc: Exports an Entra user directory with identity and contact fields to CSV
    crit: suspicious
    conf: 0.98
    all:
      - id: legacy-entra-user-enumeration-cmdlet
      - id: legacy-entra-directory-schema
      - id: micro-behaviors/data/format/csv/export::powershell-export-csv-call
    near_bytes: 4096
