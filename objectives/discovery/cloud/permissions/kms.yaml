# AWS KMS key-policy structures that can hand cloud principals broad control of
# customer-managed keys.  These are policy artifacts, so value-path matching
# keeps the rules independent of source language and avoids prose matches.
defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: kms-policy-allow-effect
    desc: AWS KMS policy Allow effect
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Effect"\s*:\s*"Allow"'

  - id: kms-policy-wildcard-resource
    desc: AWS KMS policy targets every resource
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Resource"\s*:\s*"\*"'

  - id: kms-policy-root-principal
    desc: AWS KMS policy account root principal
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Principal"\s*:\s*\{\s*"AWS"\s*:\s*"arn:aws:iam::[0-9]{12}:root"'

  - id: kms-policy-full-action
    desc: AWS KMS policy grants every KMS action
    # The action alone does not establish who receives the grant or whether
    # the policy is an AWS-recommended same-account root delegation.
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*"kms:\*"'
    unless:
      - id: kms-policy-own-account-root-principal

  - id: kms-policy-wildcard-principal
    desc: AWS KMS policy wildcard principal
    crit: suspicious
    conf: 0.99
    if:
      type: text
      # The wildcard principal must sit on a policy that also grants kms:
      # actions. A bare "Principal": {"AWS": "*"} otherwise matches the AWS
      # documented SNS topic and S3 bucket policies, which scope their grant
      # with SourceOwner / SecureTransport conditions.
      regex: '"Principal"\s*:\s*\{\s*"AWS"\s*:\s*"\*"[\s\S]{0,180}kms:'
    unless:
      # A wildcard principal paired with an aws:SecureTransport condition is
      # the deny-unless-TLS control every IaC framework emits (typically an
      # S3 BucketPolicy with Effect Deny), not a wildcard grant.
      - id: micro-behaviors/data/config/syntax::aws-secure-transport-condition-key
      - id: micro-behaviors/data/config/syntax::aws-caller-account-condition-key
      - id: metadata/package/testing/presence/path::json-testdata-directory-path

  - id: kms-policy-allow-wildcard-principal
    desc: AWS KMS allows wildcard principal access
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '"Effect"\s*:\s*"Allow"[\s\S]{0,180}"AWS"\s*:\s*"\*"[\s\S]{0,180}"kms:'
    unless:
      - id: micro-behaviors/data/config/syntax::aws-caller-account-condition-key
      - id: metadata/package/testing/presence/path::json-testdata-directory-path

  - id: kms-policy-put-key-policy
    desc: AWS KMS policy permits key-policy mutation
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*(\[[^\]]{0,160})?"kms:PutKeyPolicy"'

  - id: kms-policy-encrypt
    desc: AWS KMS policy permits direct CMK encryption
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*(\[[^\]]{0,160})?"kms:Encrypt"'

  - id: kms-policy-decrypt
    desc: AWS KMS policy permits CMK decryption
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*(\[[^\]]{0,160})?"kms:Decrypt"'

  # CloudFormation's self-reference to the stack's own account root: the
  # AWS-recommended default key policy ("Enable IAM User Permissions") that
  # delegates key access to the account's IAM policies. Another account's
  # 12-digit root is what makes kms:* a grant of control to someone else.
  - id: kms-policy-own-account-root-principal
    desc: KMS policy delegates to own account root
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"Fn::Sub"\s*:\s*"arn:aws:iam::\$\{AWS::AccountId\}:root"'

  - id: kms-wildcard-decryption
    desc: Wildcard principal can decrypt with AWS KMS
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '"Effect"\s*:\s*"Allow"[\s\S]{0,180}"AWS"\s*:\s*"\*"[\s\S]{0,180}"kms:Decrypt"'
    unless:
      - id: micro-behaviors/data/config/syntax::aws-caller-account-condition-key
      - id: metadata/package/testing/presence/path::json-testdata-directory-path

composite_rules:
  - id: kms-root-full-action-grant
    desc: AWS KMS policy delegates all actions to an account's IAM policies
    crit: suspicious
    conf: 0.99
    all:
      - id: kms-policy-root-principal
      - id: kms-policy-full-action
      - id: kms-policy-allow-effect
      - id: kms-policy-wildcard-resource
    near_bytes: 220
    unless:
      # AWS's recommended key policy delegates the key's permissions to the
      # deploying account's IAM policies through this dynamic root ARN.
      - id: kms-policy-own-account-root-principal
      # Policy tooling keeps deliberately-broad grants as parser/diff test
      # fixtures (e.g. Crossplane's go:embed testdata for policy comparison),
      # never as deployed policies granting real access.
      - id: metadata/package/testing/presence/path::json-testdata-directory-path

  - id: kms-wildcard-key-policy-mutation
    desc: Wildcard principal can rewrite AWS KMS policy
    crit: hostile
    conf: 0.99
    all:
      - id: kms-policy-allow-wildcard-principal
      - id: kms-policy-put-key-policy
    near_bytes: 220

  - id: kms-wildcard-direct-encryption
    desc: Wildcard principal can encrypt with AWS KMS
    crit: suspicious
    conf: 0.98
    all:
      - id: kms-policy-allow-wildcard-principal
      - id: kms-policy-encrypt
    near_bytes: 220
