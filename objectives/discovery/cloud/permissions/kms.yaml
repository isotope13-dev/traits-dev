# AWS KMS key-policy structures that can hand cloud principals broad control of
# customer-managed keys.  These are policy artifacts, so value-path matching
# keeps the rules independent of source language and avoids prose matches.
defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: kms-policy-allow-effect
    desc: AWS KMS policy Allow effect
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '"Effect"\s*:\s*"Allow"'

  - id: kms-policy-wildcard-resource
    desc: AWS KMS policy targets every resource
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '"Resource"\s*:\s*"\*"'

  - id: kms-policy-root-principal
    desc: AWS KMS policy account root principal
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Principal"\s*:\s*\{\s*"AWS"\s*:\s*"arn:aws:iam::[0-9]{12}:root"'

  - id: kms-policy-full-action
    desc: AWS KMS policy grants every KMS action
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*"kms:\*"'

  - id: kms-policy-wildcard-principal
    desc: AWS KMS policy wildcard principal
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '"Principal"\s*:\s*\{\s*"AWS"\s*:\s*"\*"'

  - id: kms-policy-allow-wildcard-principal
    desc: AWS KMS allows wildcard principal access
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '"Effect"\s*:\s*"Allow"[\s\S]{0,180}"AWS"\s*:\s*"\*"[\s\S]{0,180}"kms:'

  - id: kms-policy-put-key-policy
    desc: AWS KMS policy permits key-policy mutation
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*(\[[^\]]{0,160})?"kms:PutKeyPolicy"'

  - id: kms-policy-encrypt
    desc: AWS KMS policy permits direct CMK encryption
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*(\[[^\]]{0,160})?"kms:Encrypt"'

  - id: kms-policy-decrypt
    desc: AWS KMS policy permits CMK decryption
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"Action"\s*:\s*(\[[^\]]{0,160})?"kms:Decrypt"'

  - id: kms-wildcard-decryption
    desc: Wildcard principal can decrypt with AWS KMS
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '"Effect"\s*:\s*"Allow"[\s\S]{0,180}"AWS"\s*:\s*"\*"[\s\S]{0,180}"kms:Decrypt"'

composite_rules:
  - id: kms-root-account-wide-administration
    desc: AWS KMS root grant gives account-wide administration
    crit: hostile
    conf: 0.99
    all:
      - id: kms-policy-root-principal
      - id: kms-policy-full-action
      - id: kms-policy-allow-effect
      - id: kms-policy-wildcard-resource
    near_bytes: 220

  - id: kms-wildcard-key-policy-mutation
    desc: Wildcard principal can rewrite AWS KMS policy
    crit: hostile
    conf: 0.99
    all:
      - id: kms-policy-allow-wildcard-principal
      - id: kms-policy-put-key-policy
    near_bytes: 220

  - id: kms-wildcard-direct-encryption
    desc: Wildcard principal can encrypt with AWS KMS
    crit: suspicious
    conf: 0.98
    all:
      - id: kms-policy-allow-wildcard-principal
      - id: kms-policy-encrypt
    near_bytes: 220
