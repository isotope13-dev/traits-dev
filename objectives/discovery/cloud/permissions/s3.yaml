# S3 public-access policy findings and permission-surface reconnaissance.
# The AWS guide documents these exact policy fields and SDK operations as an
# audit workflow. They are useful defensive signals, but the same structures
# also identify public buckets and enumerate cloud assets after a role pivot.
defaults:
  platforms: [unix, windows]
  for: [json, python, javascript, typescript, ruby, go, java, php]

traits:
  - id: aws-policy-allow-effect
    desc: AWS policy statement has Allow effect
    crit: notable
    conf: 0.96
    for: [json]
    if:
      type: text
      regex: '(?i)["'']Effect["'']?\s*:\s*["'']Allow["'']'

  - id: aws-policy-wildcard-principal
    desc: AWS resource policy grants a wildcard principal
    crit: suspicious
    conf: 0.96
    for: [json]
    if:
      type: text
      regex: '(?i)["'']Principal["'']?\s*:\s*["'']\*["'']'
    unless:
      - type: text
        regex: '(?i)sts:AssumeRole'
      # `"Principal": "*"` with `"Effect": "Deny"` is a control, not a grant,
      # and the matcher cannot see Effect. The canonical form is the
      # deny-unless-TLS statement AWS recommends for every bucket, which
      # every IaC framework emits: Serverless ships it in its own
      # core-cloudformation-template.json and sf-core/runners/cfn/aws/base.json.
      - id: micro-behaviors/data/config/syntax::aws-secure-transport-condition-key
      # A JSON Schema document defines the shape of a policy; a wildcard
      # principal inside its definitions/examples is documentation, not a
      # grant the file makes.
      - id: metadata/file/format/structured::json-schema-document
      - id: metadata/package/testing/presence/path::json-testdata-directory-path
      # A wildcard principal fenced by an AWS Organizations condition key is
      # the documented org-wide sharing pattern (e.g. ECR/S3 read access for
      # every account in an org), not anonymous access.
      - type: text
        regex: '(?i)["'']aws:PrincipalOrg(ID|Paths)["'']'
    downgrade:
      scope: file-or-parent
      any:
        - id: well-known/app/infrastructure/ansible::ansible-community-sdist-context

  - id: s3-public-acl-grant
    desc: S3 ACL grants a global public group
    crit: suspicious
    conf: 0.97
    for: [json]
    if:
      type: text
      # Match the structured JSON Grantee URI, not the AWS SDK's prose/XML
      # documentation examples that mention the same canonical group URI.
      regex: '(?i)"URI"\s*:\s*"http://acs.amazonaws.com/groups/global/(AllUsers|AuthenticatedUsers)'
    unless:
      - id: well-known/lib/cloud/aws-api-model::smithy-service-model
      - id: well-known/lib/cloud/aws-api-model::aws-service-model-examples
      # Compatibility test vectors define validation test cases, not deployed bucket ACLs.
      - type: text
        regex: '(?i)["''](\$schema["'']\s*:\s*["''][^"'']*vector\.schema\.json|vectors["'']\s*:\s*\[)'

  - id: s3-public-access-block-disabled
    desc: S3 public-access-block setting is disabled
    crit: suspicious
    conf: 0.94
    for: [json]
    if:
      type: text
      regex: '(?i)"(Block|Ignore|Restrict)Public(Acls|Policy|Buckets)"\s*:\s*(false|0)\s*[,}]'
    unless:
      - id: metadata/package/files/generated::jsii-generated-example-table
      # SonarLint rule dumps embed the insecure example they describe.
      - id: metadata/package/documentation/source::sonar-eslint-key
      # Compatibility test vectors define validation test cases, not deployed bucket configurations.
      - type: text
        regex: '(?i)["''](\$schema["'']\s*:\s*["''][^"'']*vector\.schema\.json|vectors["'']\s*:\s*\[)'


composite_rules:
  - id: s3-public-wildcard-policy
    for: [json]
    desc: S3 bucket policy grants anonymous full access
    crit: suspicious
    conf: 0.99
    all:
      - id: aws-policy-allow-effect
      - id: aws-policy-wildcard-principal
      - id: micro-behaviors/data/config/syntax::s3-wildcard-action-field

  - id: aws-cross-account-s3-permission-enumeration
    desc: Uses an AWS role pivot to enumerate S3 permissions
    crit: suspicious
    conf: 0.98
    attack: T1087.004
    all:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-permission-surface-enumeration
      - id: micro-behaviors/communications/http/services/aws-iam::aws-assume-role-operation
    any:
      - id: micro-behaviors/communications/http/services/aws-iam::aws-iam-role-arn
      - id: micro-behaviors/communications/http/services/aws::boto3-client-supplied-credentials
