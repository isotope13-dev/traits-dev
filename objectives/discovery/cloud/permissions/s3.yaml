# S3 public-access policy findings and permission-surface reconnaissance.
# The AWS guide documents these exact policy fields and SDK operations as an
# audit workflow. They are useful defensive signals, but the same structures
# also identify public buckets and enumerate cloud assets after a role pivot.
defaults:
  platforms: [unix, windows]
  for: [json, python, javascript, typescript, ruby, go, java, php]

traits:
  - id: aws-policy-allow-effect
    desc: AWS policy statement has Allow effect
    crit: component
    conf: 0.96
    for: [json]
    if:
      type: text
      regex: '(?i)["'']Effect["'']?\s*:\s*["'']Allow["'']'

  - id: aws-policy-wildcard-principal
    desc: AWS resource policy grants a wildcard principal
    crit: suspicious
    conf: 0.96
    for: [json]
    if:
      type: text
      regex: '(?i)["'']Principal["'']?\s*:\s*["'']\*["'']'
    unless:
      - type: text
        regex: '(?i)sts:AssumeRole'
      # A JSON Schema document defines the shape of a policy; a wildcard
      # principal inside its definitions/examples is documentation, not a
      # grant the file makes.
      - id: metadata/file/format/structured::json-schema-document

  - id: s3-wildcard-action-policy
    desc: S3 policy grants every S3 action
    crit: suspicious
    conf: 0.97
    for: [json]
    if:
      type: text
      regex: '(?i)["'']Action["'']?\s*:\s*(["'']s3:\*["'']|\[[^\]]{0,160}["'']s3:\*["''])'
    unless:
      # A copy of AWS's own managed-policy catalog contains every permissive
      # grant AWS publishes; shipping the reference data is not making the grant.
      - id: metadata/file/catalog/identity::aws-managed-policy-catalog
      # Schema definitions/examples documenting `s3:*` actions are not grants.
      - id: metadata/file/format/structured::json-schema-document

  - id: s3-public-acl-grant
    desc: S3 ACL grants a global public group
    crit: suspicious
    conf: 0.97
    for: [json]
    if:
      type: text
      # Match the structured JSON Grantee URI, not the AWS SDK's prose/XML
      # documentation examples that mention the same canonical group URI.
      regex: '(?i)"URI"\s*:\s*"http://acs.amazonaws.com/groups/global/(AllUsers|AuthenticatedUsers)'
    unless:
      - id: metadata/library/cloud-sdk::botocore-service-example-data
      - id: metadata/package/files/generated::jsii-generated-example-table
      - id: well-known/lib/cloud/aws-sdk-js/
      - type: path
        basename: true
        regex: '^examples-[0-9]+\.json$'
      - type: path
        regex: '\.examples\.json$'

  - id: s3-public-access-block-disabled
    desc: S3 public-access-block setting is disabled
    crit: suspicious
    conf: 0.94
    for: [json]
    if:
      type: text
      regex: '(?i)Public(Acls|Policy|Buckets)[^:\n]{0,20}:\s*(false|0)'
    unless:
      - id: metadata/package/files/generated::jsii-generated-example-table

composite_rules:
  - id: s3-public-wildcard-policy
    desc: S3 bucket policy grants anonymous full access
    crit: suspicious
    conf: 0.99
    all:
      - id: aws-policy-allow-effect
      - id: aws-policy-wildcard-principal
      - id: s3-wildcard-action-policy

  - id: aws-s3-bucket-enumeration
    desc: Enumerates S3 buckets
    crit: notable
    conf: 0.93
    attack: T1087.004
    unless:
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
      - id: well-known/lib/cloud/boto3::boto3-aws-sdk-wheel-context
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-command

  - id: aws-s3-permission-surface-read
    desc: Reads S3 bucket permission metadata
    crit: notable
    conf: 0.93
    attack: T1087.004
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-permission-read-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-permission-read-command

  - id: aws-s3-permission-surface-enumeration
    desc: Enumerates S3 buckets and their public-access permissions
    crit: suspicious
    conf: 0.97
    attack: T1087.004
    unless:
      # A Prowler check module is written in the shape of the control it audits.
      - id: well-known/tool/detection/prowler::scanner-check-corpus
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/lib/cloud/oss2::oss2-sdk-source-context
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: well-known/app/infrastructure/ansible::ansible-collections-wheel-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::unittests-directory-path
    all:
      - id: aws-s3-bucket-enumeration
      - id: aws-s3-permission-surface-read

  - id: aws-cross-account-s3-permission-enumeration
    desc: Uses an AWS role pivot to enumerate S3 permissions
    crit: suspicious
    conf: 0.98
    attack: T1087.004
    all:
      - id: aws-s3-permission-surface-enumeration
      - id: micro-behaviors/communications/http/services/aws::aws-assume-role-operation
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-iam-role-arn
      - id: micro-behaviors/communications/http/services/aws::boto3-client-supplied-credentials
