# Discovery from inside a container: confirm where it is running, then walk a
# list of guessed in-cluster object-store endpoints. An application is handed
# its storage endpoint; enumerating candidates is reconnaissance of the
# environment it landed in.
defaults:
  platforms: [linux, unix]
  for: [scripts, binaries]
  attack: T1580,T1613
composite_rules:
  - id: container-probe-object-store-sweep
    desc: Container check then object-store sweep
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/services/minio::s3-endpoint-candidate-list
    any:
      - id: micro-behaviors/fs/proc/container::container-pid1-cgroup
      - id: micro-behaviors/fs/proc/container::container-self-cgroup
      - id: micro-behaviors/os/container/runtime::dockerenv
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
