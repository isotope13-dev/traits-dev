# Multi-service Azure and Microsoft 365 OAuth client_credentials scope fan-out
# paired with subscription enumeration (Microsoft Threat Intelligence / Todyl,
# November 2026). Requesting default application tokens across four or more
# distinct cloud planes (ARM, Key Vault, Storage, Cognitive Services, Graph)
# while enumerating tenant subscriptions characterizes broad permission probing
# rather than single-workload service authentication.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: suspicious
  conf: 0.94
  attack: T1580,T1526,T1078.004

composite_rules:
  - id: multi-scope-azure-service-principal-recon
    desc: Requests multi-plane Azure client_credentials tokens and lists subscriptions
    all:
      - id: micro-behaviors/communications/http/services/azure::microsoft-service-principal-token-request
      - id: micro-behaviors/communications/http/services/azure::arm-subscriptions-path
    needs: 4
    any:
      - id: micro-behaviors/communications/http/services/azure::arm-default-token-scope
      - id: micro-behaviors/communications/http/services/keyvault-azure::token-scope
      - id: micro-behaviors/communications/http/services/blob-azure::storage-default-token-scope
      - id: micro-behaviors/os/security/auth/cloud::python-azure-openai-token-scope
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
    near_bytes: 131072
