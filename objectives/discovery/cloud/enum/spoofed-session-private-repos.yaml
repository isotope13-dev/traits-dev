# An extension that rewrites its own identity inside a patched serializer,
# requests an existing editor auth session, and then lists the user's
# private GitHub repositories with that session.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: spoofed-session-private-repo-listing
    desc: Spoofed-identity editor session lists private GitHub repos
    crit: hostile
    conf: 0.95
    attack: T1526,T1550.001
    all:
      - id: objectives/credential-access/dev-tools/session::serializer-extension-identity-rewrite
      - id: micro-behaviors/os/security/auth/session::editor-silent-existing-auth-session-request
      - id: micro-behaviors/communications/http/services/github/repository::github-user-repos-private-filter
