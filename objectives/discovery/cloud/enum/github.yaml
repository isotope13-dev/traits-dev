# GitHub API discovery performed after an account or token compromise. Neutral
# endpoint and request-option capabilities live with the GitHub HTTP service;
# these rules combine them into reconnaissance intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1526,T1552.001

traits:
composite_rules:
  - id: github-actions-secret-surface-enumeration
    desc: Enumerates GitHub secret scopes using a token
    crit: hostile
    conf: 0.985
    all:
      - id: micro-behaviors/communications/http/services/github::multiple-secret-endpoint-references
      - id: micro-behaviors/communications/http/services/github::github-environment-secret-inventory-endpoint
      - id: micro-behaviors/communications/http/services/github::github-org-secret-scanning-alerts-endpoint
      - id: micro-behaviors/communications/http/services/github::github-api-host
      - id: micro-behaviors/os/env/secret-name::github-token-name-reference
    near_bytes: 4096
    unless:
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: well-known/app/ai/knowledge/lean-ctx::source-tree-path
      - id: well-known/app/ai/knowledge/lean-ctx::secret-expiry-script

  - id: github-private-repository-reconnaissance
    desc: Maps private GitHub repos, secrets, and trees
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/github::github-paginated-private-org-repository-list
      - id: micro-behaviors/communications/http/services/github::multiple-secret-endpoint-references
      - id: micro-behaviors/communications/http/services/github::github-git-trees-recursive-api
      - id: micro-behaviors/communications/http/services/github::github-api-host
    near_bytes: 8192
