# GitHub API discovery surfaces. Endpoint references alone do not establish
# account compromise or unauthorized token use.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1526,T1552.001

traits:
composite_rules:
  - id: github-actions-secret-surface-enumeration
    desc: GitHub secret inventory endpoint references
    crit: notable
    conf: 0.985
    all:
      - id: micro-behaviors/communications/http/services/github/security::multiple-secret-endpoint-references
      - id: micro-behaviors/communications/http/services/github/security::github-environment-secret-inventory-endpoint
      - id: micro-behaviors/communications/http/services/github/security::github-org-secret-scanning-alerts-endpoint
      - id: micro-behaviors/communications/http/services/github/client::github-api-host
      - id: metadata/lang/source/naming/secret::github-token-name-reference
    near_bytes: 4096

  - id: github-private-repository-reconnaissance
    desc: Maps private GitHub repos, secrets, and trees
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/github/repository::github-paginated-private-org-repository-list
      - id: micro-behaviors/communications/http/services/github/security::multiple-secret-endpoint-references
      - id: micro-behaviors/communications/http/services/github/repository::github-git-trees-recursive-api
      - id: micro-behaviors/communications/http/services/github/client::github-api-host
    near_bytes: 8192
