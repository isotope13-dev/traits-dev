# Broad SharePoint repository discovery through the REST search API. The
# protocol atoms also cover compiled clients, keeping the composites independent
# of the implementation language, API version, tenant, and campaign tooling.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1526,T1213.002

composite_rules:
  - id: sharepoint-rest-container-enumeration
    desc: Enumerates SharePoint site and web containers through REST search
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/microsoft::sharepoint-rest-search-endpoint
      - id: micro-behaviors/communications/http/services/microsoft::sharepoint-site-contentclass-selector
      - id: micro-behaviors/communications/http/services/microsoft::sharepoint-web-contentclass-selector
    near_bytes: 8192

  - id: sharepoint-rest-paginated-enumeration
    desc: Pages broad SharePoint container search results by IndexDocId
    crit: suspicious
    conf: 0.98
    all:
      - id: sharepoint-rest-container-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::sharepoint-indexdocid-wildcard-pagination
    near_bytes: 8192
