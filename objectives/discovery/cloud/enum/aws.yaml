defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: aws-ec2-discovery-burst
    desc: AWS EC2 discovery operation burst
    crit: suspicious
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '"eventName"\s*:\s*"Describe[A-Z][A-Za-z]+"'

# The CloudTrail guide's Scenario 1 reconnaissance opening: a session
# established through an assumed role (often cross-account) enumerating S3
# buckets to catalog targets before acting on them. Migration and audit
# tooling can look like this, so the composite stays at suspicious; the
# extortion composites under objectives/impact/ransom/tactics/ convict the
# copy-then-delete chain that usually follows.
composite_rules:
  - id: cross-account-s3-bucket-enumeration
    desc: Assumed-role session enumerates S3 buckets
    crit: suspicious
    conf: 0.85
    for: [scripts, source, json]
    attack: T1580
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-assume-role-operation
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-bucket-enumeration-operation
