# Microsoft 365 unified-audit records for automated SharePoint repository
# mapping.  The campaign queried internal site/web content classes and paged
# wildcard results with indexdocid before bulk collection.  Match the
# structured audit fields so prose that merely discusses these tokens does not
# become detection evidence.
defaults:
  platforms: [windows, unix]
  for: [json, text]
  attack: T1526,T1213.002

traits:
  - id: sharepoint-search-query-operation
    desc: SharePoint SearchQueryPerformed audit operation
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']Operation["'']\s*:\s*["'']SearchQueryPerformed["'']'

  - id: sharepoint-site-contentclass-query
    desc: SharePoint search targets the site content class
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']SearchQueryText["'']\s*:\s*["''][^"'']{0,240}\bcontentclass\s*:\s*STS_Site\b'

  - id: sharepoint-web-contentclass-query
    desc: SharePoint search targets the web content class
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']SearchQueryText["'']\s*:\s*["''][^"'']{0,240}\bcontentclass\s*:\s*STS_Web\b'

  - id: sharepoint-indexdocid-wildcard-pagination
    desc: SharePoint wildcard indexdocid pagination
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']SearchQueryText["'']\s*:\s*["''][^"'']{0,240}\*[^"'']{0,120}\bindexdocid\s*>\s*[0-9]+'

composite_rules:
  - id: sharepoint-contentclass-structure-enumeration
    desc: SharePoint audit log maps site or web containers
    crit: suspicious
    conf: 0.97
    all:
      - id: sharepoint-search-query-operation
      - id: objectives/exfiltration/cloud/saas::saas-sharepoint-workload
    any:
      - id: sharepoint-site-contentclass-query
      - id: sharepoint-web-contentclass-query
    near_bytes: 2400

  - id: sharepoint-indexdocid-enumeration
    desc: SharePoint audit log shows paginated wildcard enumeration
    crit: suspicious
    conf: 0.98
    all:
      - id: sharepoint-search-query-operation
      - id: objectives/exfiltration/cloud/saas::saas-sharepoint-workload
      - id: sharepoint-indexdocid-wildcard-pagination
    near_bytes: 2400

  - id: sharepoint-site-and-web-enumeration
    desc: SharePoint audit log maps both site and web containers
    crit: suspicious
    conf: 0.98
    all:
      - id: sharepoint-search-query-operation
      - id: objectives/exfiltration/cloud/saas::saas-sharepoint-workload
      - id: sharepoint-site-contentclass-query
      - id: sharepoint-web-contentclass-query
    near_bytes: 2400

  - id: sharepoint-paginated-structure-enumeration
    desc: SharePoint audit log combines container mapping with wildcard pagination
    crit: hostile
    conf: 0.99
    all:
      - id: sharepoint-search-query-operation
      - id: objectives/exfiltration/cloud/saas::saas-sharepoint-workload
      - id: sharepoint-indexdocid-wildcard-pagination
    any:
      - id: sharepoint-site-contentclass-query
      - id: sharepoint-web-contentclass-query
    near_bytes: 2400
