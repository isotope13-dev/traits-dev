defaults:
  platforms: [unix]
  for: [c, elf]
  attack: T1526

traits:
  - id: c-cloud-metadata-buffer
    desc: Cloud-discovery marker string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "[cloud-discovery]"

composite_rules:
  - id: c-multi-cloud-metadata-recon
    for: [elf]
    desc: C multi-cloud metadata recon
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-metadata-endpoint
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-endpoint
      - id: c-cloud-metadata-buffer
