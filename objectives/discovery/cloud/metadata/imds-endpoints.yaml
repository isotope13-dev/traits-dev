defaults:
  platforms: [unix]
  for: [rust, elf]
  attack: T1580

traits:
  - id: gcp-imds-endpoint-reference
    desc: References the GCP metadata project endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /computeMetadata/v1/project/project-id

  - id: azure-imds-endpoint-reference
    desc: References the Azure IMDS instance endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /metadata/instance?api-version=

  - id: alibaba-imds-userdata-reference
    desc: References the Alibaba IMDS user-data endpoint
    crit: suspicious
    conf: 0.94
    attack: T1552.005
    if:
      type: text
      substr: 100.100.100.200/latest/user-data

composite_rules:
  # A program that checks distinct providers' IMDS endpoints and reports the
  # results to a remote beacon is identifying and exporting the cloud
  # environment. Endpoint references alone are common in multi-cloud SDKs, so
  # require both the outbound report path and remote host evidence.
  - id: javascript-multi-cloud-imds-probe
    desc: JavaScript reports multi-cloud metadata probe results remotely
    crit: suspicious
    conf: 0.94
    platforms: [unix, windows]
    for: [javascript, typescript]
    needs: 2
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/url/telemetry::beacon-path-token
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
      - id: micro-behaviors/communications/http/services/azure::azure-metadata-endpoint
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-endpoint-reference

  - id: rust-multi-cloud-metadata-sweep
    desc: Multi-cloud metadata endpoint sweep
    crit: hostile
    conf: 0.98
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-instance-id-metadata-path
      - id: gcp-imds-endpoint-reference
      - id: azure-imds-endpoint-reference
    needs: 2
