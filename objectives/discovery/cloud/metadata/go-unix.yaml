defaults:
  platforms: [unix]
  for: [go, elf]
  attack: T1526

traits:
  - id: go-azure-metadata-header
    desc: Go Azure metadata header
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'metadata/instance\?api-version[\s\S]{0,420}Metadata", "true"'
    unless:
      - id: well-known/app/system/aks-engine/

  - id: go-postdata-cloud-tags
    desc: Go posts cloud tags
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'postData\(client, target, "cloud_(aws|gcp|azure)"'

composite_rules:
  - id: go-multi-cloud-metadata-exfil
    desc: Go multi-cloud metadata exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/aws::native-imds-endpoint-reference
      - id: micro-behaviors/communications/http/services/gcp::native-metadata-host-and-flavor-header
      - id: go-azure-metadata-header
      - id: go-postdata-cloud-tags
