defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious

composite_rules:
  - id: node-imdsv2-instance-identity-clues
    desc: Node IMDSv2 instance-ID query clues
    conf: 0.98
    attack: T1580
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/communications/ip/ipv4::metadata-service-link-local-address
      - id: micro-behaviors/communications/http/services/cloud::imds-v2-token-path
      - id: micro-behaviors/communications/http/services/aws::aws-instance-id-metadata-path
      - id: micro-behaviors/communications/http/token-auth::aws-imds-token-ttl-header
