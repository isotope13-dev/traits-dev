defaults:
  attack: T1580
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: alibaba-imds-hostname
    desc: References Alibaba metadata hostname field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 100.100.100.200/latest/meta-data/hostname
  - id: alibaba-imds-instance-account-fields
    desc: References Alibaba instance and account metadata
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '100\.100\.100\.200/latest/meta-data/(instance-id|owner-account-id)'
  - id: javascript-imds-file-write
    desc: Writes metadata response data to a file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'writeFileSync\s*\([^,]{0,60}meta_field_dump\.txt.{0,60}\.join\('
  - id: cloud-metadata-response-text-slice
    desc: Slices HTTP response text
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: st.text.slice

composite_rules:
  - id: javascript-alibaba-imds-field-dump
    desc: JavaScript collects Alibaba instance metadata fields into a local file
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-metadata-endpoint-reference
      - id: alibaba-imds-hostname
      - id: alibaba-imds-instance-account-fields
      - id: javascript-imds-file-write

  - id: startup-multicloud-metadata-reporting
    desc: Startup probes cloud metadata endpoints and reports probe results
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/url/telemetry::beacon-path-token
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-metadata-endpoint
      - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-endpoint-reference
      - id: micro-behaviors/communications/http/services/azure::azure-metadata-endpoint
    needs: 2

  # Some packages collect metadata values for a local dump without sending
  # them to a beacon. Require response-body handling and a file write in
  # addition to the provider endpoint and startup invocation.
  - id: startup-cloud-metadata-local-dump
    desc: Startup collects cloud metadata values and writes them to a local file
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-metadata-endpoint-reference
      - id: micro-behaviors/fs/write/file/full::write-file-sync
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: cloud-metadata-response-text-slice
