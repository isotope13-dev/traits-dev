defaults:
  platforms: [unix]
  for: [rust, elf]
  attack: T1580

traits:
  - id: rust-gcp-metadata-enum
    desc: Rust GCP metadata enum
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /computeMetadata/v1/project/project-id

  - id: rust-azure-metadata-enum
    desc: Rust Azure metadata enum
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /metadata/instance?api-version=

  - id: rust-alibaba-metadata-url
    desc: Alibaba cloud metadata URL
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 100.100.100.200/latest/meta-data
    unless:
      - id: well-known/app/terraform::terraform-core-binary

  - id: rust-alibaba-user-data-url
    desc: Rust Alibaba user-data URL
    crit: suspicious
    conf: 0.94
    attack: T1552.005
    if:
      type: text
      substr: 100.100.100.200/latest/user-data

composite_rules:
  - id: rust-multi-cloud-metadata-sweep
    desc: Rust multi-cloud metadata sweep
    crit: hostile
    conf: 0.98
    any:
      - id: metadata/file/string/cloud::aws-instance-id-metadata-path
      - id: rust-gcp-metadata-enum
      - id: rust-azure-metadata-enum
    needs: 2
