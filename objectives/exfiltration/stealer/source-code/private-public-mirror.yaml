defaults:
  platforms: [unix, windows]
  for: [shell, javascript, typescript]

composite_rules:
  # Migration tooling can intentionally publish formerly private source.
  # This combination reports that sensitive operation without convicting it.
  - id: private-repository-public-mirror
    desc: Private repository inventory with public mirror publication
    crit: suspicious
    conf: 0.94
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/services/github/repository::github-private-internal-org-repository-list
      - id: micro-behaviors/communications/http/services/github/repository::github-public-visibility-patch-script
      - id: micro-behaviors/revision-control/git/transfer::git-mirror-clone
      - id: micro-behaviors/revision-control/git/transfer::git-mirror-push-command

  # An independently established credential worm supplies the attack context.
  # No family name, repository name, endpoint UUID or sidecar filename gates it.
  - id: credential-worm-public-repository-leak
    desc: Credential worm includes private-to-public repository mirrors
    for: [javascript, typescript]
    crit: hostile
    conf: 0.98
    attack: T1213.003,T1567.001
    all:
      - id: private-repository-public-mirror
      - id: objectives/lateral-movement/worm/registry::npm-maintainer-credential-worm
