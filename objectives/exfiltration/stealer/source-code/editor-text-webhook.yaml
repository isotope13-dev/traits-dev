# An editor extension reads the whole text of an open document and posts
# through a hard-coded chat webhook. Code-sharing integrations ask the user
# for their own webhook; one baked into the extension sends whatever the
# developer is editing to the publisher's channel.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1213,T1567
composite_rules:
  - id: editor-document-text-chat-webhook
    desc: Editor document text posted to a hard-coded chat webhook
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/ui/controls/editor::vscode-active-editor-text-read
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
    any:
      - id: micro-behaviors/communications/http/post::axios-default-post-call
      - id: micro-behaviors/data/control-flow/direct-call::post-helper-forwards-content
      - id: micro-behaviors/communications/http/request/json::http-post-json
