defaults:
  attack: T1195.002
  mbc: E1041
  platforms: [unix, windows]

composite_rules:
  - id: objectives/exfiltration/stealer/source-code::rust-build-git-patch-curl-exfil
    desc: Rust build.rs exfils git patch via curl
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/revision-control/git/read::rust-build-git-diff-head
      - id: metadata/lang/source/syntax/call/arguments::rust-build-curl-post-body
    any:
      - id: micro-behaviors/revision-control/git/read::rust-build-git-log-author-email
      - id: metadata/lang/source/syntax/call/arguments::rust-build-source-patch-payload
      - id: well-known/app/infrastructure/sentry::rust-sentry-envelope-reference
  - id: objectives/exfiltration/stealer/source-code::rust-build-sentry-source-patch-exfil
    desc: Rust build.rs exfils source patch to Sentry
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/exfiltration/stealer/source-code::rust-build-git-patch-curl-exfil
      - id: well-known/app/infrastructure/sentry::rust-sentry-envelope-reference
      - id: metadata/lang/source/syntax/call/arguments::rust-build-source-patch-payload
  - id: objectives/exfiltration/stealer/source-code::cargo-build-hook-git-patch-exfil
    desc: Cargo build hook exfils git patch
    crit: hostile
    conf: 0.99
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: objectives/exfiltration/stealer/source-code::rust-build-git-patch-curl-exfil
  - id: objectives/exfiltration/stealer/source-code::cargo-archive-build-rs-git-patch-exfil
    desc: Cargo archive build.rs exfils git patch
    crit: hostile
    conf: 0.99
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: objectives/exfiltration/stealer/source-code::rust-build-git-patch-curl-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
