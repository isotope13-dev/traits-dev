# An install hook that starts a detached background Node process which reads
# project files and sends them over a WebSocket to a tunnel host. Each leg is
# behavior evidence rather than a sample's literal identifiers.
defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1005,T1041

composite_rules:
  - id: npm-postinstall-project-source-exfil
    desc: Install starts detached process uploading files by WebSocket
    crit: hostile
    conf: 0.97
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/process/daemonize/spawn::node-detached-child-process
      - id: micro-behaviors/communications/websocket/handler::websocket-literal-endpoint-constructor
      - id: micro-behaviors/communications/url/host/name::ngrok-free-domain
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: micro-behaviors/communications/websocket/send::websocket-instance-send-call
