defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  # Manual scanning can explain the transfer, but source sent through a fixed
  # tunnel deserves analyst visibility. This does not assert covert collection
  # or that an email verification flow is credential phishing.
  - id: source-code-post-to-tunnel-api
    desc: Posts code and language fields through an ngrok tunnel
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/post::post-source-code-language-fields
      - id: micro-behaviors/communications/url/host/name::ngrok-free-domain
    near_bytes: 2048

  # An editor extension that reads the open document and posts it to a tunnel
  # host baked into the package sends whatever the developer is editing to an
  # anonymous endpoint whose operator cannot be identified or held to a policy.
  # Plain Node clients without editor-document reads stay suspicious above.
  - id: editor-document-text-post-to-tunnel-api
    desc: Editor extension posts open document text to a hard-coded ngrok tunnel
    crit: hostile
    conf: 0.9
    scope: archive
    for: [javascript, typescript, vsix, zip]
    all:
      - id: source-code-post-to-tunnel-api
      - id: well-known/lib/development/vscode::vscode-extension-marker
    any:
      - id: micro-behaviors/ui/controls/editor::vscode-active-editor-text-read
      - id: micro-behaviors/ui/controls/editor::vscode-document-gettext-call
