# Gheist's masking bypass does not require serializing the complete secrets
# map. Each source predicate binds a selected secret to an encoder; the sink
# must be on that same line. No campaign name, branch name or external host
# is required, and the workflow can target hosted or self-hosted runners.
# Actions secrets may also hold confidential non-credential values, so these
# stay at the meaningful stealer ancestor rather than guessing a secret kind.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: hostile
  conf: 0.98
  attack: T1552,T1567

composite_rules:
  - id: gha-shell-encoded-secret-value-log
    desc: Shell logs an encoded Actions secret value
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::gha-shell-secret-value-encoder-input
    any:
      - id: micro-behaviors/data/encode/base32::gha-shell-base32-stdout
      - id: micro-behaviors/data/encode/base64::gha-shell-base64-stdout

  - id: gha-python-encoded-secret-value-log
    desc: Python logs an encoded Actions secret value
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::gha-python-secret-value-encoder-input
    any:
      - id: micro-behaviors/data/encode/base32::gha-python-base32-stdout
      - id: micro-behaviors/data/encode/base64::gha-python-base64-stdout

  - id: gha-node-encoded-secret-value-log
    desc: Node logs an encoded Actions secret value
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::gha-node-secret-value-buffer-input
      - id: micro-behaviors/data/encode/base64::gha-node-base64-stdout

  - id: gha-powershell-encoded-secret-value-log
    desc: PowerShell secret output with Base64 conversion
    # Same-line evidence does not bind the GetBytes result to Convert's
    # argument. Preserve that limitation in both criticality and description.
    crit: suspicious
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::gha-powershell-secret-value-byte-input
      - id: micro-behaviors/data/encode/base64::to-base64-string
    unless:
      - id: micro-behaviors/fs/write/file/redirect::gha-powershell-output-file-redirect
