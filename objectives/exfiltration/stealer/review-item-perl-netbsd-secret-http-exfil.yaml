composite_rules:
- platforms:
  - unix
  - netbsd
  for:
  - perl
  attack: T1552.001
  id: perl-netbsd-secret-http-exfil
  desc: Perl NetBSD secret exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/privilege/paths::etc-shadow
  - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
  - id: micro-behaviors/data/encode/base64/structured::perl-json-pp-base64-encode
  any:
  - id: micro-behaviors/fs/path/private-key::perl-netbsd-pki-private-path
  - id: micro-behaviors/communications/http/post::post-request-line
  - id: micro-behaviors/communications/url/resource-path/collection::exfil-or-beacon-url-literal
