defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1125

composite_rules:
  - id: peercreator-remote-camera-surveillance
    desc: RAT remote camera-stream tasking and capture
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/rat/control::admin-camera-translation-packet
      - id: objectives/command-and-control/backdoor/rat/control::client-camera-frame-packet
      - id: objectives/command-and-control/backdoor/rat/control::admin-remote-command-packet
      - id: micro-behaviors/hardware/display/camera::media-foundation-camera-device-enumeration
