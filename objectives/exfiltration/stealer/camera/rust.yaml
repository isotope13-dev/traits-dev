defaults:
  platforms: [windows, unix]
  for: [rust]

composite_rules:
  - id: rust-http-webcam-stream
    desc: Rust webcam stream over HTTP
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/server/framework::rust-axum-http-server
      - id: micro-behaviors/hardware/display/camera::webcam-stream-handler
    any:
      - id: micro-behaviors/communications/http/server/route::stream-handler-route
      - id: micro-behaviors/process/io/stream::stream-stop-function
  - id: rust-ngrok-webcam-surveillance
    desc: Rust webcam stream exposed through ngrok tunnel
    crit: hostile
    conf: 0.98
    attack: T1125,T1572
    all:
      - id: micro-behaviors/communications/proxy/tunnel::rust-ngrok-http-tunnel
      - id: objectives/exfiltration/stealer/camera::rust-http-webcam-stream
      - id: micro-behaviors/process/io/stream::stream-stop-function
    near_bytes: 2400
  - id: rust-tunneled-webcam-stream-dispatch
    desc: Rust tunneled webcam stream control
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/camera::stream-webcam-command
      - id: micro-behaviors/communications/proxy/tunnel::local-tunnel-start
      - id: micro-behaviors/communications/proxy/tunnel::local-http-tunnel-server-two
    any:
      - id: objectives/collection/monitor/capture::public-url-banner
      - id: micro-behaviors/process/io/stream::stream-stop-function
