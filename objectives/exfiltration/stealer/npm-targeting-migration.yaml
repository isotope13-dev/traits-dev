defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

composite_rules:
- id: npm-install-recon-exfil-webhook
  desc: Install hook performs recon and exfiltrates via webhook
  crit: hostile
  conf: 0.99
  attack: T1041
  mbc: E1041
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: metadata/import/builtin::require-child-process
  any:
  - id: micro-behaviors/fs/search/name::dockerfile-hunt-root
  - id: micro-behaviors/fs/search/name::flag-file-hunt
  - id: micro-behaviors/fs/path/application/prefix::usr-src-app-target
  - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
  - id: micro-behaviors/fs/directory/cwd::node-shell-pwd-command
  - id: metadata/lang/source/naming/target::typed-recon-callback-labels
  needs: 2
