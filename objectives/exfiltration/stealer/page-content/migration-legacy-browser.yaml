defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
composite_rules:
# User-supplied API-key and provider-selection evidence downgrades this
# capability, since a user-directed summarizer can transmit selected text.
- id: extension-selected-text-to-remote-llm
  desc: Browser extension sends selected page text to remote LLM
  crit: suspicious
  conf: 0.96
  attack: T1041,T1119
  scope: archive
  for:
  - crx
  - xpi
  - zip
  - javascript
  all:
  - id: metadata/file/format/browser-extension::web-extension-root-manifest
  - id: micro-behaviors/communications/http/llm::selection-read-llm-post-cooccurrence
  downgrade:
    scope: archive
    all:
    - id: micro-behaviors/communications/http/llm::byok-provider-catalog
    - id: micro-behaviors/ui/dialog/prompt::user-api-key-prompt
