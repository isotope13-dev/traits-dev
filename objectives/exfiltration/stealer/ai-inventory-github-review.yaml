defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
  attack: T1041

composite_rules:
- id: github-repo-secret-exfiltration
  desc: GitHub upload with credential or file clues
  crit: suspicious
  conf: 0.98
  any:
  - id: objectives/exfiltration/stealer::github-client-secret-blob-exfiltration
  - id: objectives/exfiltration/stealer::github-endpoint-secret-blob-exfiltration
- id: github-client-secret-blob-exfiltration
  desc: GitHub content write with sensitive-source clues
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-create-or-update-file-contents
  - id: objectives/exfiltration/stealer::github-content-base64-upload
  any:
  - id: objectives/credential-access/files/secret-sweep::credential-inventory-wording
  - id: objectives/credential-access/files/secret-sweep::child-process-credential-search-wording
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/fs/read/file/content/configuration::node-npmrc-read-reference
  - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
  - id: micro-behaviors/fs/read/file/target::github-npm-pattern-file-operations
- id: github-endpoint-secret-blob-exfiltration
  desc: GitHub endpoint, encoding and file inventory clues
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-api-endpoint
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: objectives/collection/file-targeting/filter::llm-cli-filesystem-inventory
- id: public-github-secret-dump
  desc: Public GitHub repository and upload clues
  crit: hostile
  conf: 0.985
  all:
  - id: objectives/exfiltration/stealer::github-repo-secret-exfiltration
  - id: micro-behaviors/communications/http/services/github/repository::github-public-repo-creation
- id: github-content-base64-upload
  desc: GitHub content write and encoded-source clues
  crit: suspicious
  conf: 0.92
  near_bytes: 800
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-create-or-update-file-contents
  - id: objectives/collection/multi-source::github-secret-source
  any:
  - id: micro-behaviors/data/string/conversion::tostring-token
  - id: micro-behaviors/data/codec::base64-helper-invocation
  unless:
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/build/bundler/vscode::vscode-js-distribution-bundle
  - id: well-known/tool/development/ci/action-download-artifact::source-tree
