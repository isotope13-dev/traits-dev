defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1041

composite_rules:
  - id: native-screen-streaming-surveillance-channel
    desc: Native screen streaming channel with host inventory and elevation
    crit: hostile
    conf: 0.99
    for: [pe]
    attack: T1041,T1057,T1113,T1548.002
    all:
      - id: objectives/command-and-control/backdoor/control/desktop::stream-start-event-marker
      - id: objectives/command-and-control/backdoor/control/desktop::server-approval-control-marker
      - id: metadata/file/profile/screen-capture-context::gdi-screen-capture-primitives
      - id: micro-behaviors/data/encode/image/gdiplus::gdiplus-image-encode
      - id: micro-behaviors/communications/socket/create::socket-api-ordinal
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/send::send-api-ordinal
      - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
      - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-time-process-api-cluster
      - id: micro-behaviors/os/privilege/elevation::dotnet-shell-runas-text
    unless:
      - id: metadata/signed/platform/
