defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1113,T1041
  mbc: C0014

composite_rules:
  - id: pe-screen-capture-multipart-upload
    desc: Unsigned binary has bitmap and multipart HTTP indicators
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/signature/absent::unsigned
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/communications/http/form::form-data-header
      - id: micro-behaviors/ui/graphics/draw::gdi-bitmap-transfer-primitives
    any:
      - id: micro-behaviors/fs/path/media::xor-encoded-staging-image-path
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
