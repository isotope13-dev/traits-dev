defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1113,T1041
  mbc: C0014

composite_rules:
  - id: pe-screen-capture-multipart-upload
    desc: Unsigned binary captures screen bitmaps and uploads multipart form data
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/signed/trust-level::unsigned
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/communications/http/form::form-data-header
      - id: metadata/file/profile/graphics/co-occurrence::gdi-bitmap-transfer-primitives
    any:
      - id: micro-behaviors/fs/path/media::xor-encoded-staging-image-path
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
    unless:
      - id: metadata/signed/platform/
