# Screen-stream method names can denote empty wait loops. Require both
# remaining sensor routines; a tcpStreamScreen name is not a capture signal.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
- id: go-session-multi-sensor-stream
  desc: Go session microphone and camera streaming routines
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/hardware/input/audio::go-session-tcp-microphone-stream
  - id: micro-behaviors/hardware/display/camera::go-session-tcp-camera-stream
