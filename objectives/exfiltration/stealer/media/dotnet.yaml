# .NET Screenshot Capture Composites (CopyFromScreen pipeline)
# Detects RATs using managed .NET screen capture APIs
# ATT&CK: T1113 (Screen Capture)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: C0014

composite_rules:
- id: managed-plugin-backdoor-jpeg-response
  desc: Plugin backdoor builds and dispatches a JPEG screen response
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/collection/screenshot::managed-plugin-backdoor-screen-capture
  - id: micro-behaviors/hardware/display/screenshot::cil-jpeg-base64-response-construction

- id: managed-plugin-backdoor-string-screen-response
  desc: Plugin backdoor sends JPEG string response
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/command-and-control/backdoor/dispatch/module::managed-plugin-tasking-backdoor
  - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
  - id: micro-behaviors/hardware/display/screenshot::cil-jpeg-string-response-construction
