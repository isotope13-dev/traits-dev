defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1041

composite_rules:
  - id: browser-extension-screenshot-json-upload
    desc: Browser extension uploads screenshots as JSON
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-capture-visible
      - id: micro-behaviors/data/serialize/json::screenshot-data-stringify
      - id: micro-behaviors/communications/http/request/client/exchange::fetch-post-pattern
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

  # Minified bundles rename the captured image, so the name-based screenshot
  # serializer can miss a real upload. This states co-occurrence only: a visible-
  # tab capture, a JSON POST, and a remote host in one extension. Accessibility
  # and bug-report tools do this legitimately, so it stays suspicious. The legs
  # must share one script: archive pooling matched unrelated type-definition and
  # test packages (e.g. a DefinitelyTyped mirror) that merely name the API.
  - id: browser-extension-visible-capture-json-post
    desc: Extension captures visible tab and POSTs JSON to remote host
    crit: suspicious
    conf: 0.85
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-capture-visible
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
