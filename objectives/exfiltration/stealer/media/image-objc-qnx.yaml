defaults:
  platforms: [qnx, unix]
  for: [objc]
  attack: T1113

composite_rules:
  - id: qnx-objc-screenshot-http-delivery
    desc: QNX ObjC screenshot HTTP delivery
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/display/connection::qnx-objc-photon-screen-attach
      - id: micro-behaviors/hardware/display/screenshot::qnx-objc-photon-getimage
      - id: micro-behaviors/communications/http/url/endpoint::qnx-objc-capture-api-path
