defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1113,T1041

composite_rules:
  # A screen grab attached to a script-sent message is the unattended-capture
  # shape. Crash reporters and bug-report forms attach screenshots too, so the
  # composite stays suspicious and does not convict on its own.
  - id: csharp-screenshot-smtp-attachment-exfil
    desc: C# mails a captured screen image by SMTP
    crit: suspicious
    conf: 0.9
    near_lines: 25
    all:
      - id: micro-behaviors/hardware/display/screenshot/display::csharp-copy-from-screen-capture
      - id: micro-behaviors/communications/email/send/smtp::smtp-dotnet-attachment-add
      - id: micro-behaviors/communications/email/send/smtp::smtp-client-send-message
