defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
- id: posts-screenshot-and-page-content
  desc: Posts screenshot and page content in an HTTP request
  crit: suspicious
  conf: 0.96
  scope: file
  all:
  - id: micro-behaviors/data/format/json::screenshot-payload-field
  - id: micro-behaviors/data/format/json::page-content-payload-field
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
  - id: micro-behaviors/communications/http/post::request-options-post-method

- id: concealed-browser-page-state-upload
  desc: Hides browser automation while uploading page state
  crit: hostile
  conf: 0.98
  attack: T1041
  mbc: E1041
  for: [npm, tar, zip, javascript, typescript]
  scope: archive
  all:
  - id: posts-screenshot-and-page-content
  - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::chromium-automation-cloaking
