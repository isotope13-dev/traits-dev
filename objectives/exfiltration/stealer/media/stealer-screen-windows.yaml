defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1113
  mbc: C0014
composite_rules:
- id: gdi-capture-http-exfil
  desc: Screen capture with HTTP network access
  crit: hostile
  conf: 0.92
  all:
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/ui/graphics/image::gdiplus-startup
  - id: micro-behaviors/communications/http/post::wininet-post
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: well-known/app
  - id: well-known/app/utility/sdio::sdio-official-context
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
    - id: metadata/binary/symbols/count::many-imports
