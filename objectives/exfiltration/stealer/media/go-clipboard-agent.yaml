defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-clipper-telegram-screen-export
    desc: Go clipper includes Telegram screenshot export
    crit: hostile
    conf: 0.98
    attack: T1113,T1041
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::go-syscall-crypto-clipboard-replacer
      - id: micro-behaviors/communications/messaging/send::go-capture-photo-chat-calls
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/post::http-post
