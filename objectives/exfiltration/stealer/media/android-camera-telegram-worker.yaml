defaults:
  platforms: [android]
  for: [dex]
  attack: T1533,T1041
traits:
  - id: dex-external-public-directory-call
    desc: DEX opens public external-storage directory
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/os/Environment;->getExternalStoragePublicDirectory'
  - id: dex-photo-telegram-send-helper-call
    desc: DEX calls photo-to-Telegram helper
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i);->sendphotototelegram$'
  - id: dex-periodic-work-enqueue-call
    desc: DEX enqueues periodic background work
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroidx/work/WorkManager;->enqueueUniquePeriodicWork'
composite_rules:
  # Nearby call sites do not by themselves prove file-to-network data flow.
  - id: dex-directory-photo-telegram-call-cluster
    desc: Public directory, listing and photo-send call cluster
    crit: notable
    conf: 0.96
    near_bytes: 256
    all:
      - id: dex-external-public-directory-call
      - id: micro-behaviors/fs/directory/readdir/language::dex-file-list-children-call
      - id: dex-photo-telegram-send-helper-call
  - id: android-camera-telegram-periodic-photo-clues
    desc: Camera photo-send code with fixed bot and periodic work
    crit: hostile
    conf: 0.97
    all:
      - id: dex-directory-photo-telegram-call-cluster
      - id: dex-periodic-work-enqueue-call
      - id: micro-behaviors/fs/path/media::dex-bare-camera-string
      - id: micro-behaviors/communications/http/auth::dex-telegram-bot-token-shape
      - id: micro-behaviors/communications/messaging/send::dex-chat-send-photo-path
