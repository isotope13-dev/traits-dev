defaults:
  platforms: [windows]
  for: [ruby]
traits:
  - id: ruby-screenshot-upload-and-delete
    desc: Uploads screenshot then deletes the image
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: ruby
      query: |
        (program
          (method name: (identifier) @post
            parameters: (method_parameters . (identifier) @url . (identifier) (identifier) @filearg .)
            body: (body_statement
              (assignment left: (identifier) @curl right: (string) @http)
              (if consequence: (then
                (operator_assignment left: (identifier) @curl1
                  right: (string (interpolation (identifier) @filearg1)) @fileform)))
              (operator_assignment left: (identifier) @curl2 right: (string) @postflag)
              (call method: (identifier) @shell arguments: (argument_list . (false) . (identifier) @curl3 .))))
          (method body: (body_statement
            (assignment left: (identifier) @filename right: (string))
            (assignment left: (identifier) @shot right: (string (interpolation (identifier) @filename1)) @shotcmd)
            (call method: (identifier) @shell1 arguments: (argument_list . (true) . (identifier) @shot1 .))
            (call method: (identifier) @post1 arguments: (argument_list . (global_variable) (identifier) (identifier) @filename2 .))
            (begin (call receiver: (constant) @file method: (identifier) @delete
              arguments: (argument_list . (identifier) @filename3 .)))))
          (#match? @http "CURL.*Content-Type:multipart/form-data")
          (#match? @fileform "file=@") (#match? @postflag "-X POST")
          (#eq? @curl @curl1) (#eq? @curl @curl2) (#eq? @curl @curl3)
          (#eq? @filearg @filearg1) (#eq? @shell @shell1) (#eq? @post @post1)
          (#match? @shotcmd "savescreenshot") (#eq? @shot @shot1)
          (#eq? @filename @filename1) (#eq? @filename @filename2) (#eq? @filename @filename3)
          (#eq? @file "File") (#eq? @delete "delete")) @screenshot_transfer

composite_rules:
  - id: ruby-command-backdoor-screenshot-exfiltration
    desc: Command-polling backdoor uploads and removes screenshots
    crit: hostile
    conf: 0.99
    attack: T1113,T1041
    all:
      - id: ruby-screenshot-upload-and-delete
      - id: objectives/command-and-control/backdoor/tasking/http::ruby-line-polled-cmd-powershell-backdoor
