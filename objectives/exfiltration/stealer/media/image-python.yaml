defaults:
  platforms: [windows, unix]
  for:
  - python
  attack: T1113
  mbc: B0002

# Screen capture sent over HTTP can be user-directed in support tools. Keep
# this suspicious until automatic or deceptive capture is independently clear.
composite_rules:
- id: python-overlay-screenshot-http-exfil
  desc: Borderless overlay posts screenshots over HTTP
  crit: suspicious
  conf: 0.98
  attack: T1113,T1041
  all:
  - id: micro-behaviors/hardware/display/screenshot/display::screen-capture
  - id: micro-behaviors/communications/http/post::session-post
  - id: micro-behaviors/communications/http/request/body/media::python-post-image-json-body
  - id: micro-behaviors/ui/window/visibility::tkinter-topmost
  - id: micro-behaviors/ui/window/visibility::tkinter-overrideredirect
- id: python-device-screenshot-exfil
  desc: Python device screenshot exfil
  crit: hostile
  conf: 0.98
  for: [python, pyc]
  all:
  - id: micro-behaviors/hardware/display/screenshot/reference::python-framebuffer-capture
  - id: micro-behaviors/hardware/display/screenshot/reference::python-collect-screenshots-name
  - id: objectives/collection/screenshot::python-exfiltrate-raw-name
- id: python-xor-endpoint-posts-screenshot
  desc: Posts a screenshot to a decoded URL
  crit: hostile
  conf: 0.96
  attack: T1113,T1041
  scope: file
  near_lines: 40
  all:
  - id: micro-behaviors/data/encoding/xor/unspecified-key::python-xor-bytes-comprehension
  - id: micro-behaviors/communications/http/upload/file::python-http-files-parameter
  - id: micro-behaviors/ui/graphics/image::python-screenshot-image-method
