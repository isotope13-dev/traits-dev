defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, dll, go, python]
  attack: T1113,T1041
  mbc: E1113

composite_rules:
  - id: cross-platform-screen-capture-clue
    desc: Desktop screenshot capture API or library
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/hardware/display/screenshot/reference::screenshot-library
      - id: micro-behaviors/hardware/display/screenshot/reference::macos-screen-capture-api-import
      - id: micro-behaviors/hardware/display/screenshot/reference::winrt-graphics-capture-session
      - id: micro-behaviors/hardware/display/screenshot/reference::python-collect-screenshots-name

  - id: encrypted-c2-screenshot-collection
    desc: Captures screenshots for encrypted C2 tasking
    crit: hostile
    conf: 0.97
    scope: leaf
    all:
      - id: cross-platform-screen-capture-clue
      - id: micro-behaviors/data/serialize/schema-system::screens-capture-field-tag
      - id: micro-behaviors/data/serialize/envelope::command-id-envelope-field
      - id: micro-behaviors/data/serialize/envelope::encrypt-key-profile-field
