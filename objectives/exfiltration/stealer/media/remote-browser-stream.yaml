defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
composite_rules:
  - id: remote-controlled-extension-tab-image-stream
    desc: Browser controller streams captured tab images
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1113,T1041
    all:
      - id: objectives/command-and-control/remote-command/extension::extension-websocket-browser-remote-control
      - id: micro-behaviors/communications/websocket/media::visible-tab-image-json-send
