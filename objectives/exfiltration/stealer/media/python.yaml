defaults:
  platforms: [windows, unix]
  for:
  - python
  attack: T1113
  mbc: B0002

composite_rules:
- id: python-overlay-clipboard-and-screen-exfil
  desc: Hidden Tk overlay posts clipboard text and screenshots
  crit: hostile
  conf: 0.98
  attack: T1113,T1115,T1041
  all:
  - id: objectives/collection/clipboard/monitor::python-overlay-clipboard-http-exfil
  - id: objectives/exfiltration/stealer/media::python-overlay-screenshot-http-exfil
- id: python-screenshot-smtp-attachment-exfil
  # A screen grab mailed as an attachment is the unattended-capture shape.
  # Helpers that save locally or send after a user action do not attach the
  # image in the same script, so the composite stays suspicious on its own.
  desc: Python mails a captured screen image by SMTP
  crit: suspicious
  conf: 0.9
  near_lines: 40
  all:
  - id: micro-behaviors/hardware/display/screenshot/display::screen-capture
  - id: micro-behaviors/communications/email/mime::python-email-add-attachment
  - id: micro-behaviors/communications/email/send/smtp::python-smtp-client-and-message-send
