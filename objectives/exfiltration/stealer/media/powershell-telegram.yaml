defaults:
  platforms:
  - windows
composite_rules:
- id: powershell-screen-archive-telegram-exfil
  desc: Screen archive upload with concealed staging
  crit: hostile
  conf: 0.98
  attack: T1113,T1560.001,T1041,T1567.001
  for:
  - powershell
  scope: file
  near_bytes: 8192
  all:
  - id: micro-behaviors/hardware/display/screenshot::powershell-copyfromscreen
  - id: micro-behaviors/data/archive/create/zip::powershell-compress-archive
  - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
  - id: objectives/evasion/masquerade/path::whitespace-system-path-fetch-and-launch
