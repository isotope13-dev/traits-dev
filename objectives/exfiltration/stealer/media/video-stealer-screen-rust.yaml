defaults:
  platforms:
    - windows
    - unix
  for:
    - rust
  crit: suspicious
composite_rules:
  - id: rust-http-desktop-stream
    desc: Rust desktop stream over HTTP
    conf: 0.95
    all:
      - id: metadata/file/profile/screen-capture-context::scrap-screen-capture
      - id: micro-behaviors/communications/http/server/framework::rust-mjpeg-stream-response
    any:
      - id: metadata/lang/source/naming/function/communication::stream-handler-fn
      - id: micro-behaviors/hardware/display/stream::desktop-stream-handler
      - id: micro-behaviors/communications/http/server/route::stream-handler-route
      - id: metadata/lang/source/naming/action/token::stream-stop-function
      - id: micro-behaviors/data/encode/image/jpeg::rust-jpeg-frame-encoding
  - id: rust-tunneled-desktop-stream-dispatch
    desc: Rust tunneled desktop stream control
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/stream::stream-desktop-command
      - id: metadata/file/profile/tunnel-implementation::local-tunnel-start
      - id: metadata/file/profile/tunnel-implementation::local-http-tunnel-server-one
    any:
      - id: objectives/collection/monitor/capture::public-url-banner
      - id: metadata/lang/source/naming/action/token::stream-stop-function
