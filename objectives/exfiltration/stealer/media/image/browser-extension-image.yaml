defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1041

composite_rules:
- id: all-site-extension-image-upload
  desc: "Broad extension image upload"
  crit: suspicious
  conf: 0.95
  ref: sha256:4fcdbf8912196b7e1541615dc3c51b0715aa125d1a223387055231551d255e70
  scope: archive
  all:
  - id: micro-behaviors/communications/http/form::image-formdata-with-user-id
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: metadata/permission/manifest::host-permission-all-urls
  any:
  - id: "metadata/permission/host::broad-content-script-matches"
  - id: metadata/permission/manifest::permission-tabs
