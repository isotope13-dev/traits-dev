defaults:
  platforms: [unix, windows]
  for: [markdown, text, html]
traits:
  - id: html-error-handler-cookie-send
    desc: HTML error handler sends cookies remotely
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: (?i)onerror.{0,80}fetch\(["'`]https?://.{0,80}document\.cookie
    unless:
    - id: metadata/package/documentation/agent-safety::ctf-technique-reference-documentation
    - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: metadata/package/documentation/agent-safety::reference-payload-catalog
    - id: metadata/file/format/structured::serialized-skill-documentation-catalog
    - id: metadata/file/profile/markup::assessment-playbook-examples
