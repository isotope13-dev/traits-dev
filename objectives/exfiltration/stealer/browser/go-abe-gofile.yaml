# Public file-host upload used as stealer loot drop, then the resulting
# download link is POSTed over cleartext HTTP to an operator webhook.
defaults:
  platforms: [unix, windows]
  for: [go, pe, scripts, source]
  attack: T1567.002,T1041
  mbc: E1010

composite_rules:
  - id: abe-stealer-gofile-exfil
    desc: ABE key theft symbols with Gofile upload exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/browser/dpapi::extract-keys-with-abe-symbol
      - id: objectives/exfiltration/cloud/saas::upload-gofile-bytes-symbol
      - id: micro-behaviors/communications/http/services/file-hosting::gofile-uploadfile-endpoint
    any:
      - id: objectives/exfiltration/messaging/webhook::send-log-webhook-symbol
      - id: objectives/credential-access/browser/chromium::abe-helper-dll-patch-template
