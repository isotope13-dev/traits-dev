defaults:
  platforms: [netscaler, appliance, windows]
  for: [powershell]
  attack: T1555.003

composite_rules:
  - id: ps-browser-dns-exfil
    desc: PowerShell browser DNS exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/dns/prep::ps-dns-exfil-query
    any:
      - id: micro-behaviors/fs/read/file/full::powershell-login-data-readallbytes-proximity
      - id: objectives/credential-access/browser/firefox::ps-firefox-key4-read

  - id: ps-browser-credential-http-exfil
    desc: PowerShell browser credential exfil
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: micro-behaviors/fs/read/file/full::powershell-login-data-readallbytes-proximity
      - id: metadata/lang/source/syntax/command::powershell-post-method-option
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
