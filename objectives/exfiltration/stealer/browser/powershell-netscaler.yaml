defaults:
  platforms: [netscaler, appliance, windows]
  for: [powershell]
  attack: T1555.003

composite_rules:
  - id: ps-browser-sidechannel-exfil
    desc: PowerShell browser side-channel exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/side-channel/dns::ps-exfil-http-headers
    any:
      - id: objectives/credential-access/browser/multi-target::ps-browser-login-data-read
      - id: objectives/credential-access/browser/firefox::ps-firefox-key4-read
      - id: objectives/exfiltration/dns/prep::ps-dns-exfil-query

  - id: ps-browser-dns-exfil
    desc: PowerShell browser DNS exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/dns/prep::ps-dns-exfil-query
    any:
      - id: objectives/credential-access/browser/multi-target::ps-browser-login-data-read
      - id: objectives/credential-access/browser/firefox::ps-firefox-key4-read

  - id: ps-browser-credential-http-exfil
    desc: PowerShell browser credential exfil
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: objectives/credential-access/browser/multi-target::ps-browser-login-data-read
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-post-method
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
