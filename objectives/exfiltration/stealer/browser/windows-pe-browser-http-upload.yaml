defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: pe-browser-profile-upload-protocol
    desc: Browser profile data upload protocol
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/header/custom::pe-filename-header
      - id: micro-behaviors/communications/http/header/custom::pe-browser-type-header
      - id: micro-behaviors/communications/http/header/custom::pe-profile-name-header
    any:
      - id: micro-behaviors/communications/http/header/content-type::pe-octet-stream-content-type
      - id: objectives/command-and-control/channel/http-beacon::chrome-spoof-user-agent-pe
    unless:
      - id: metadata/signed/platform/
  - id: browser-cookie-proxy-upload-client
    desc: Browser cookie upload with proxy reuse
    crit: hostile
    conf: 0.96
    attack: T1555.003
    ref: sha256:25645bc6bc084101de911c528b795604dedc79647fd7011693f49a8f347cfd3b
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: micro-behaviors/os/registry/access::internet-settings-key
    any:
      - id: micro-behaviors/communications/http/authorization-header::auth-header
      - id: micro-behaviors/communications/http/request/proxy::proxy-connection-keepalive
      - id: micro-behaviors/communications/proxy/tunnel::internet-settings-proxy-values
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
