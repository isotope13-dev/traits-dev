defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # The reviewed worker reads the cookie file, Base64-encodes its contents,
  # truncates the string, prefixes COOKIE:, and calls the HTTP sender. Require
  # the admitted surveillance context, source APIs, record and upload code.
  # Matching is file-scoped and does not claim a bound buffer or delivery.
  - id: managed-keylogger-cookie-record-upload-profile
    desc: Keylogger cookie records beside HTTP upload code
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    all:
      - id: objectives/credential-access/browser/chromium::managed-keylogger-browser-store-read-references
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::uploadstring
      - id: micro-behaviors/data/format/string::cookie-data-record-prefix
