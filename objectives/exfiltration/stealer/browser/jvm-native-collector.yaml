defaults:
  platforms: [windows]
  for: [jar, zip, class]
composite_rules:
  - id: jvm-native-browser-collector-multipart-upload
    desc: Native browser-secret collector includes multipart POST
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1555.003,T1041
    # HTTP alone is neutral; the native credential collector is required.
    all:
      - id: objectives/credential-access/browser/multi-target::jvm-native-injection-browser-secret-collector
      - id: micro-behaviors/communications/http/form::jvm-json-multipart-post-references
