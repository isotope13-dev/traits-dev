defaults:
  platforms: [unix]
  for: [rust, macho, elf]
  attack: T1041

composite_rules:
  - id: rust-browser-credential-exfil
    desc: Rust browser credential exfil
    crit: hostile
    conf: 0.98
    # Same rust-ureq-post-call vs rust-binary mismatch as rust-ureq-keychain-
    # http-exfil above; stays a source-level detection.
    for: [rust]
    all:
      - id: micro-behaviors/communications/http/post::rust-ureq-post-call
      - id: objectives/credential-access/browser/multi-target::rust-browser-login-query
