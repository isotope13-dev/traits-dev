defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041
composite_rules:
- id: native-multi-source-winhttp-exfiltration
  desc: Multi-source loot staged for WinHTTP POST
  crit: hostile
  conf: 0.99
  attack: T1041,T1555.003,T1119
  for: [pe, dll]
  all:
    - id: objectives/credential-access/browser/loot::native-browser-loot-report-schema
    - id: objectives/discovery/system/fingerprint/info::native-host-profile-schema
    - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-resolution
    - id: micro-behaviors/communications/http/post::post-string-pe-wide
# Chromium's own cookie database plus Local State is the login-key material.
# A browser keeps both for itself and does not post them to a Telegram bot.
- id: native-chromium-cookie-telegram-exfil
  desc: Native binary sends Chromium cookies through Telegram
  crit: hostile
  conf: 0.97
  attack: T1539,T1041,T1555.003
  for: [pe, dll]
  all:
    - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
    - id: micro-behaviors/fs/path/application/browser::local-state
    - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  unless:
    - id: metadata/signed/platform/
    - id: well-known/app/browser/
    - id: well-known/tool/detection/
