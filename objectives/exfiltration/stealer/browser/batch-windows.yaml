defaults:
  platforms: [windows]
  for: [batch, vbs, text]
  attack: T1555

composite_rules:
  - id: batch-browser-credential-archive-upload
    desc: Batch browser credential archive upload
    crit: hostile
    conf: 0.98
    attack: T1555, T1041
    all:
      - id: micro-behaviors/data/archive/create/utility::batch-passworded-rar-archive
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-curl-infile-upload
    any:
      - id: objectives/credential-access/browser/firefox::batch-firefox-profile-copy
      - id: objectives/credential-access/email/thunderbird::batch-thunderbird-profile-copy
