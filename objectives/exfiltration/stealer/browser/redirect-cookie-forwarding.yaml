# Cookie opt-in does not authorize forwarding the harvested session to an
# arbitrary Location origin. The redirect atom binds the request URL to its
# unchecked replacement and requires immediate loop continuation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1539,T1550.004

composite_rules:
  - id: harvested-google-session-unchecked-redirect
    desc: Harvested Google cookies forwarded through unchecked redirects
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/cookie-name::google-auth-cookie-name
      - id: micro-behaviors/communications/http/services/gemini::gemini-web-bard-stream-api
      - id: micro-behaviors/communications/http/redirect::manual-redirect-cookie-forwarding
