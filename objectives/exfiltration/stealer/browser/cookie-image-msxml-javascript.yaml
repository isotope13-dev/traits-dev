# Cookie theft through an image request or MSXML POST. Plaintext worms are
# often collected as .txt, so text is in scope with JavaScript.
defaults:
  platforms: [windows, unix]
  for: [javascript, html, text]
  attack: T1539,T1041
  mbc: C0002

composite_rules:
  - id: cookie-image-beacon-exfil
    desc: Cookies beacon through an image URL
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/cookie-store::html-document-cookie-read
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
    any:
      - id: micro-behaviors/communications/http/cookie-store::image-src-then-cookie
      - id: micro-behaviors/communications/http/cookie-store::cookie-then-image-src
    needs: 1
    # Both observations must describe the same compact payload. A minified
    # bundle is often one line, so a line window still joins a telemetry
    # image with a cookie helper hundreds of kilobytes away.
    near_lines: 2
    near_bytes: 400
    unless:
      - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus

  - id: cookie-msxml-exfil
    desc: Cookies are read then posted via MSXML
    crit: hostile
    conf: 0.94
    for: [javascript, text]
    all:
      - id: micro-behaviors/communications/http/cookie-store::html-document-cookie-read
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
    near_lines: 15
    unless:
      - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus
      # A decoded source map is not a running script. Minified tracer maps
      # co-locate cookie and MSXML strings inside one escaped payload.
      - id: metadata/file/format/structured::javascript-sourcemap-path
