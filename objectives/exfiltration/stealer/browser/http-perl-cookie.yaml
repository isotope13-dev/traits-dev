defaults:
  platforms: [unix, netbsd]
  for: [perl]
  attack: T1552.001

composite_rules:
  - id: perl-browser-cookie-http-exfil
    for: [perl, tar]
    desc: Perl browser cookies and passwords sent over HTTP
    crit: hostile
    conf: 0.99
    platforms: [macos, unix]
    scope: archive
    attack: T1555.003,T1552.001,T1041
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/communications/http/post::perl-post-method-call
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname
