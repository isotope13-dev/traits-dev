# Browser-session credential access and use. The combination below is
# specific to code that reads a browser context's cookies, evaluates page
# state, and sends requests through that authenticated context.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1539
composite_rules:
  - id: slash-encoded-browser-credential-telegram-exfil
    desc: Custom-encoded browser credentials are uploaded through Telegram
    crit: hostile
    conf: 0.99
    mbc: E1041
    attack: T1555.003,T1567.001,T1027
    for: [pyc]
    platforms: [windows]
    all:
      - id: objectives/credential-access/browser/chromium::slash-encoded-password-value-field
      - id: micro-behaviors/os/security/dpapi::slash-encoded-crypt-unprotect-data
      - id: micro-behaviors/communications/http/services/telegram::slash-encoded-telegram-api-host
      - id: micro-behaviors/communications/messaging/send::slash-encoded-send-document
      - id: objectives/anti-static/obfuscation/encoding/custom::slash-delimited-utf8-hex

  # Reading a password or cookie query, sending a structured POST, and invoking
  # the collector at module load is a complete steal-and-send chain. Requiring
  # the column-specific SQL avoids cross-pairing a generic table query with an
  # unrelated browser path elsewhere in the file.
  - id: python-browser-store-http-exfil
    desc: Python browser credential store HTTP exfiltration
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1041
    all:
      - id: micro-behaviors/communications/http/request/json::python-json-body-transport
      - id: micro-behaviors/data/control-flow/module-exec::try-wrapped-module-call
    any:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query

  - id: python-dpapi-browser-secret-http-exfil
    desc: Python exfiltrates DPAPI-decrypted browser secrets
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1539,T1041
    platforms: [windows]
    all:
      - id: micro-behaviors/data/db/sql::browser-record-table-select
      - id: micro-behaviors/os/security/dpapi::python-chromium-key-unprotect
      - id: micro-behaviors/communications/http/request/json::python-json-body-transport

  # The article describes a RAT rather than a one-shot dumper. Shell=True
  # with a variable command is the precise command-execution primitive; the
  # browser-store and outbound-transport legs above supply the malicious
  # context needed for a hostile conclusion.
  - id: python-browser-rat-command-channel
    desc: Python browser stealer with shell command execution
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1555.003,T1041
    all:
      - id: python-browser-store-http-exfil
      - id: micro-behaviors/process/create/shell-subprocess::variable-command-shell-true
      - id: micro-behaviors/process/create/subprocess::process-execution

  # Reading cookies from a Playwright context the script itself drives, reusing
  # them via context.request, and evaluating JS on the page is ordinary
  # session-aware automation (QA suites, scrapers, AI-agent browsers) — the
  # script already owns that browser. Credential THEFT means harvesting another
  # browser's on-disk store (Chrome Cookies/Login Data + DPAPI/keychain) or
  # shipping the cookies to an external endpoint; those legs carry the hostile
  # verdict. On its own this is a notable session-handling capability.
  - id: python-cookie-material-telegram-export
    desc: Exports session-cookie material through Telegram messaging
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [whl, python-sdist, python]
    attack: "T1539,T1567.002"
    all:
      - id: micro-behaviors/communications/messaging/send::python-cookie-material-to-telegram-call
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/messaging/send::chat-send-message

traits:
  - id: python-chromium-login-query-file-upload
    desc: Chromium login query reaches multipart upload
    crit: suspicious
    conf: 0.98
    attack: T1041,T1555.003
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(post|put)$'
      arg:
        from:
          field: files
          call: '\.execute$'
          literal: '(?i)^SELECT\b.{0,100}\bpassword_value\b.{0,80}\bFROM\s+logins\b'
          through:
            - call: '\.fetch(all|one)$'
              receiver: true
            - call: '^repr$'
              arguments: [0]
