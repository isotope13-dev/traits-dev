defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
  attack: "T1555.003"

composite_rules:
  - id: js-browser-stealer-c2
    desc: Browser data stealer with defanged C2 IP
    conf: 0.95
    all:
    - id: micro-behaviors/communications/http/lib/axios::axios
    - id: micro-behaviors/communications/ip/parse::defanged-ip-delimited-dots
    any:
    - id: objectives/credential-access/browser/chromium/
    - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
    - id: micro-behaviors/data/db/sql::powershell-cookie-table-select
    - id: micro-behaviors/communications/http/cookie-store::chromium-encrypted-key-metadata
    - id: objectives/credential-access/browser/app-bound/
    - id: objectives/credential-access/browser/devtools/
    - id: micro-behaviors/communications/http/devtools/client::cdp-discovery-cookie-methods
    - id: objectives/credential-access/browser/loot::browsers-info-artifact
    - id: objectives/credential-access/browser/loot::appbound-key-artifact
    - id: objectives/credential-access/browser/loot::decrypted-browser-key-artifact
    - id: objectives/credential-access/browser/loot::browser-secret-record-tags
