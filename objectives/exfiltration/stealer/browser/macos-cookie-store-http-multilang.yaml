defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - class
  - java_class
  - jar
  attack: T1555.003,T1041
composite_rules:
- id: macos-browser-cookie-store-http-exfil
  desc: Browser cookie upload to dynamic host
  crit: hostile
  conf: 0.97
  scope: archive
  all:
  - id: micro-behaviors/communications/http/cookie-store::macos-cookie-path-http-client
  - id: micro-behaviors/communications/url/host::dynamic-routing-host-reference
  any:
  - id: cookie-payload-json-field
  - id: cookie-store-base64-pipe
  - id: micro-behaviors/communications/http/upload/
  - id: micro-behaviors/fs/read/file/
  - id: micro-behaviors/communications/http/request/body::urllib-payload-argument
  - id: micro-behaviors/data/buffer/transfer::go-io-copy
  - id: micro-behaviors/communications/http/curl::file-upload
- id: jvm-macos-browser-cookie-http-exfil
  desc: JVM sends macOS browser cookie store
  crit: hostile
  conf: 0.98
  for:
  - class
  - java_class
  - jar
  scope: archive
  all:
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path-class
  any:
  - id: micro-behaviors/communications/http/post/
  - id: micro-behaviors/communications/http/upload/
  - id: micro-behaviors/communications/http/client/
  needs: 1
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: perl-browser-cookie-safe-storage-http-exfil
  desc: Perl package reads browser cookies and posts them
  crit: hostile
  conf: 0.98
  for:
  - perl
  - tar
  scope: archive
  all:
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/fs/path/password-store::chrome-safe-storage
  - id: micro-behaviors/communications/http/post::perl-post-method-call
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
traits:
- id: cookie-payload-json-field
  desc: Outbound body references encoded cookie bytes
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (body|content|write|StringContent|withJSONObject)[\s\S]{0,90}cookie(_?b64|B64|Blob)
- id: cookie-store-base64-pipe
  desc: Cookie store piped into base64 encoder
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: Cookies.{0,80}\|\s*base64
