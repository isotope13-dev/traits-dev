# Native information-stealer workflow: browser credentials plus host profiling
# and outbound HTTP, with screen capture or anti-analysis as corroboration.
defaults:
  crit: hostile
  platforms: [windows]
  for: [c, cpp]
  attack: T1555.003,T1082,T1041,T1113,T1497.001

composite_rules:
  - id: native-browser-host-profile-http-stealer
    desc: Native browser stealer profiles the host and sends collected data over HTTP
    conf: 0.99
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: objectives/discovery/host/fingerprint::native-host-profile
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-client-src
    any:
      - id: micro-behaviors/hardware/display/screenshot::source-gdi-screen-capture-primitives
      - id: objectives/anti-analysis/vm-detect/process::native-vm-process-check
      - id: micro-behaviors/communications/http/header/content-type::octet-stream-content-type
