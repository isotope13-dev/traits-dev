# Bind the cookie read to an actual call, not text inside a command catalog.
# Suspicious rather than hostile: test probes can use this exact operation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  - id: document-cookie-external-fetch-url
    desc: Fetch sends cookies in an external URL
    crit: suspicious
    conf: 0.97
    attack: T1539,T1041
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments
            (binary_expression
              left: (string) @url
              operator: "+"
              right: (member_expression
                object: (identifier) @obj
                property: (property_identifier) @prop)))) @send
          (#eq? @fn "fetch")
          (#match? @url "^[\\\"']https?://")
          (#eq? @obj "document")
          (#eq? @prop "cookie"))
