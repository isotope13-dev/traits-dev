defaults:
  platforms:
    - unix
    - windows
    - macos

composite_rules:
  - id: chrome-cookie-upload
    desc: Chrome cookie theft and upload
    crit: hostile
    conf: 0.95
    attack: T1555.003
    mbc: B0028
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/upload::curl-upload-or-form-option
  - id: cookieminer-dropper
    desc: CookieMiner dropper script
    crit: hostile
    conf: 1.0
    attack: T1059.004
    mbc: B0024
    for:
      - shell
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-cmd
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/process/create/local-exec::cp-execute
      - id: micro-behaviors/communications/http/upload::curl-upload-or-form-option

  - id: chromium-cookie-sqlite-libcurl-exfil
    desc: SQLite Chromium cookie query with embedded libcurl client
    crit: hostile
    conf: 0.96
    attack: T1555.003,T1041
    for: [pe]
    all:
      - id: micro-behaviors/data/db/access::chromium-cookie-table-select-sql
      - id: micro-behaviors/data/db/sqlite::sqlite3-string
      - id: micro-behaviors/communications/http/download/curl::libcurl-version

  - id: chromium-cookie-sqlite-chinese-av-stealer
    desc: Chromium cookie theft with Chinese AV process termination
    crit: hostile
    conf: 0.97
    attack: T1555.003,T1562.001
    for: [pe]
    all:
      - id: micro-behaviors/data/db/access::chromium-cookie-table-select-sql
      - id: micro-behaviors/data/db/sqlite::sqlite3-string
      - id: objectives/impact/degrade/edr/targeting::chinese-av-product-extended
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/terminate/kill::terminate-process
