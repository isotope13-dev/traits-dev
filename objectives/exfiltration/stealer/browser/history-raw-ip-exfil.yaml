# On-disk browser-store harvest shipped to a hardcoded public IP.
#
# A script or native implant that reads another browser's on-disk profile
# (Chrome/Edge/Firefox History or Login Data) and, in the same file, POSTs or
# uploads over HTTP to a bare external IPv4 is a browser stealer exfiltrating to
# operator infrastructure. Legitimate software reaches its own backend through
# a hostname; harvesting a competitor browser's store and sending it to a raw
# address has no benign reading. Keyed on the store-read role, the upload role
# and the raw-IP sink rather than on any campaign host or stage label, so it
# carries to future stagers that read the same stores and change their C2 IP
# (modeled on the Midnight Blizzard-linked ChocoShell stager, which collected
# browser history and POSTed to /t/event on a raw-IP staging server).
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1041,T1217
  mbc: E1041

composite_rules:
  # A browser profile *directory* is only a location: sandbox-fingerprinting
  # agents and installers test for it too. A harvest needs a data-store file
  # (history, cookies, saved logins) inside that profile.
  - id: browser-profile-store-file-reference
    desc: Browser profile with a data-store file
    crit: component
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/application/browser/
    any:
      - id: micro-behaviors/fs/path/personal::history-file
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/password-store/

  - id: browser-store-raw-ip-exfil
    desc: Browser-profile harvest uploaded to a raw IP
    crit: hostile
    conf: 0.95
    attack: T1005,T1041,T1217
    for: [scripts, source, pe, dll]
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
      - id: browser-profile-store-file-reference
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-or-upload
      - id: micro-behaviors/communications/http/client/managed::downloadstring
