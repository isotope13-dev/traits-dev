defaults:
  platforms: [windows]
  for: [powershell]
  conf: 0.97
  attack: T1217,T1041
traits:
  # Bind a history-reading function to the call producing the uploaded value.
  # Adjacent assignment and send prevent an intervening reassignment from
  # satisfying this limited static-flow signature. No function/variable names,
  # endpoint, stage labels, or purported malware family are required.
  - id: powershell-history-function-http-body-flow
    desc: HTTP body contains history-reader output
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        ((statement_list
          (function_statement (function_name) @source
            (script_block (script_block_body (statement_list
              (pipeline (assignment_expression
                (left_assignment_expression) @profiles value: (pipeline) @paths))
              (foreach_statement (variable) @item (pipeline) @items
                (statement_block (statement_list
                  (pipeline (pipeline_chain (command
                    (command_name) @read
                    (command_elements
                      (command_parameter) @pathflag
                      . (command_argument_sep)
                      . (array_literal_expression (unary_expression (variable) @readitem)))))))))))))
          (pipeline (assignment_expression
            (left_assignment_expression) @data
            value: (pipeline (pipeline_chain (command (command_name) @invoke))) @result))
          . (pipeline (pipeline_chain (command
            (command_name) @http
            (command_elements
              (command_parameter) @methodflag
              . (command_argument_sep)
              . (generic_token) @method
              (command_parameter) @bodyflag
              . (command_argument_sep)
              . (array_literal_expression (unary_expression (variable) @sent)))))))
          (#eq? @source @invoke)
          (#match? @result "(?i)^[a-z_][a-z0-9_-]*\\s*(\\|\\s*Out-String\\s*)?$")
          (#eq? @data @sent)
          (#match? @http "(?i)^(Invoke-RestMethod|Invoke-WebRequest|irm|iwr)$")
          (#match? @methodflag "(?i)^-Method$")
          (#match? @method "(?i)^Post$")
          (#match? @bodyflag "(?i)^-Body$")
          (#eq? @profiles @items)
          (#eq? @item @readitem)
          (#match? @read "(?i)^Get-Content$")
          (#match? @pathflag "(?i)^-Path$")
          (#match? @paths "(?i)User Data\\\\(Default|Profile[^\\\\]*)\\\\History"))
composite_rules:
  - id: powershell-concealed-history-exfil
    desc: Browser-history export with concealed launcher
    crit: hostile
    all:
      - id: powershell-history-function-http-body-flow
      - id: micro-behaviors/communications/http/post::powershell-post-method
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
