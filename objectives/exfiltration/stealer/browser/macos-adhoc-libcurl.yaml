# macOS Stealth Information Stealer Detection
# Detects advanced stealers that impair defenses before harvesting
# ATT&CK: T1562.001 (Impair Defenses), T1056.002 (Input Capture)
defaults:
  crit: hostile
  platforms: [macos]
  for: [macho]
  mbc: "B0028"
composite_rules:
- id: adhoc-browser-data-stealer
  desc: "Ad-hoc Browser Data Stealer (Unsigned Access)"
  crit: hostile
  conf: 0.95
    # High-confidence: Ad-hoc signed binaries accessing browser secrets and networking
  all:
  - id: metadata/signed/trust-level::adhoc
  - id: micro-behaviors/communications/http/download/curl::macos-libcurl-http
  any:
  - id: objectives/credential-access/browser/chromium::chromium-cookie-sql
  - id: objectives/credential-access/browser/safari::cookie-theft
  - id: micro-behaviors/fs/path/personal::apple-notes-store
