defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]
  attack: T1555.003

composite_rules:
  - id: java-browser-credential-exfil
    desc: Java browser credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/password-store::java-browser-login-stores
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
    any:
      - id: micro-behaviors/communications/http/url/endpoint::raw-exfil-post-path
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source

  - id: java-bytecode-browser-exfil
    desc: Java bytecode browser exfil
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: micro-behaviors/fs/path/password-store::jvm-login-data-bytes
      - id: micro-behaviors/fs/path/password-store::jvm-firefox-logins-bytes
      - id: micro-behaviors/communications/http/url/endpoint::jvm-exfil-path-bytecode
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
    any:
      - id: objectives/exfiltration/http/report::java-bytecode-post-exfil
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
      - id: metadata/file/string/identity::jvm-post-token
