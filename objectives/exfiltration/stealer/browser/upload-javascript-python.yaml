defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: javascript-browser-data-upload
    desc: JavaScript uploads collected browser data
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1041
    for: [javascript, typescript]
    all:
      - id: objectives/credential-access/browser/chromium::javascript-browser-store-read
      - id: micro-behaviors/communications/http/upload::data-collection-upload-path
    any:
      - id: micro-behaviors/communications/http/request/client::node-http
      - id: micro-behaviors/communications/http/request/client::https-request
  - id: javascript-browser-screenshot-upload
    desc: JavaScript uploads browser data with screenshots
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1113,T1041
    for: [javascript, typescript]
    all:
      - id: javascript-browser-data-upload
      - id: micro-behaviors/hardware/display/screenshot::javascript-page-screenshot
  - id: python-discord-browser-stealer
    desc: Python Discord browser stealer
    crit: hostile
    conf: 0.98
    attack: T1567
    mbc: E1005
    for: [python]
    platforms: [windows]
    all:
      - id: objectives/credential-access/browser/chromium::python-windows-chromium-loot-staging
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    any:
      - id: objectives/collection/archive/upload::sensitive-tree-zip-upload
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
