- id: js-sessionstorage-webhookrelay-exfil
  for: [javascript]
  desc: Browser sessionStorage WebhookRelay exfil
  crit: hostile
  conf: 0.98
  mbc: "E1005"
  all:
  - id: objectives/exfiltration/oob/callback::browser-sessionstorage-webhookrelay-exfil
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-read
  - id: micro-behaviors/communications/http/request/client::post-method-text
  any:
