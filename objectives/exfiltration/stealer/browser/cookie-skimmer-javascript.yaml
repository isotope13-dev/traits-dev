defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

traits:
- id: vsent-near-document-cookie
  desc: vsent marker follows document cookie access
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)document\.cookie[\s\S]{0,96}\bvsent\b'
- id: vsent-before-document-cookie
  desc: vsent marker precedes document cookie access
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)\bvsent\b[\s\S]{0,96}document\.cookie'
- id: vsent-near-fetch-send
  desc: vsent marker near fetch or beacon send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)\bvsent\b[\s\S]{0,96}(fetch|sendBeacon)\s*\('
- id: vsent-near-xhr-send
  desc: vsent marker near XHR send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)\bvsent\b[\s\S]{0,96}(XMLHttpRequest\s*\(|\.send\s*\()'
- id: vsent-after-fetch-send
  desc: Fetch or beacon send near vsent marker
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(fetch|sendBeacon)\s*\([\s\S]{0,96}\bvsent\b'
- id: vsent-after-xhr-send
  desc: XHR send near vsent marker
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(XMLHttpRequest\s*\(|\.send\s*\()[\s\S]{0,96}\bvsent\b'
- id: cookie-filter-vwo-vis-opt--vwo
  desc: Filters vwo/vis_opt cookies to evade (vwo)
  crit: component
  conf: 0.8
  if:
    type: text
    word: vwo
- id: cookie-filter-vwo-vis-opt--vis-opt
  desc: Filters vwo/vis_opt cookies to evade (vis_opt)
  crit: notable
  conf: 0.8
  if:
    type: text
    word: vis_opt

composite_rules:
- id: vsent-cookie-access
  desc: vsent marker near document cookie access
  crit: component
  conf: 0.8
  any:
  - id: vsent-near-document-cookie
  - id: vsent-before-document-cookie
- id: vsent-beacon-cookie
  desc: vsent marker links cookie access to outbound send
  crit: suspicious
  conf: 0.8
  all:
  - id: vsent-cookie-access
  any:
  - id: vsent-near-fetch-send
  - id: vsent-near-xhr-send
  - id: vsent-after-fetch-send
  - id: vsent-after-xhr-send
  near_lines: 160
- id: cookie-filter-vwo-vis-opt
  desc: Filters vwo/vis_opt cookies to evade analytics
  crit: component
  conf: 0.8
  any:
  - id: cookie-filter-vwo-vis-opt--vwo
  - id: cookie-filter-vwo-vis-opt--vis-opt
- id: recognized-haddock-cookie-helper-pair
  desc: Recognized Haddock minified cookie helper pair
  crit: component
  conf: 0.8
  all:
  - id: micro-behaviors/communications/http/cookie-store::recognized-minified-cookie-helper-functions
  - id: well-known/tool/development/docs/haddock::recognized-haddock-style-cookie-helper
- id: recognized-haddock-cookie-helper
  desc: Recognized cookie helper library
  crit: component
  conf: 0.8
  any:
  - id: recognized-haddock-cookie-helper-pair
  - id: well-known/lib/format/i18next::cookie-language-helper
- id: json-stringify-post-body
  desc: JSON body serializes browser tracking fields
  crit: component
  conf: 0.7
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-post-body-core
  - id: micro-behaviors/data/serialize/json::json-stringify-post-body-tracking
- id: js-cookie-harvest-recognized-marker
  desc: Recognized all-cookie helper marker
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/communications/http/cookie-store::cookie-helper-function-definitions
  - id: well-known/lib/web/js-cookie::recognized-js-cookie-library-bundle
  - id: recognized-haddock-cookie-helper
  - id: well-known/lib/web/tina4ruby::frond-js
  - id: metadata/build/bundler/asset::js-any-bundle-output
- id: js-browser-skimmer
  for: [javascript]
  desc: Browser-side skimmer harvests all cookies and exfiltrates via POST
  crit: hostile
  conf: 0.95
  mbc: "E1005"
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: json-stringify-post-body
  any:
  - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
  - id: objectives/collection/activity/browser::extension-attribution-field
  - id: micro-behaviors/communications/http/services/analytics::ga-cookie-polling-interval
  - id: micro-behaviors/communications/http/services/analytics::distributer-id-field
  - id: vsent-beacon-cookie
  - id: micro-behaviors/ui/window/navigation::browser-location-external-method
  - id: cookie-filter-vwo-vis-opt
  unless:
  # Session-replay/RUM loggers (LogRocket) POST telemetry with cookie helpers.
  - id: well-known/lib/observability/logrocket::logrocket-logger-bundle
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
- id: js-obfuscated-browser-storage-http-workflow
