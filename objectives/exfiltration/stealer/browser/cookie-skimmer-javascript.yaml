defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

composite_rules:
- id: vsent-beacon-cookie
  desc: vsent marker links cookie access to outbound send
  crit: suspicious
  conf: 0.8
  all:
  - id: micro-behaviors/communications/http/cookie-store::vsent-cookie-access
  any:
  - id: micro-behaviors/communications/http/request/client::vsent-near-fetch-send
  - id: micro-behaviors/communications/http/request/client::vsent-before-client-send
  - id: micro-behaviors/communications/http/request/client::vsent-after-fetch-send
  - id: micro-behaviors/communications/http/request/client::vsent-after-client-send
  near_lines: 160
- id: js-browser-skimmer
  for: [javascript]
  desc: Browser-side skimmer harvests all cookies and exfiltrates via POST
  crit: hostile
  conf: 0.95
  mbc: "E1005"
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/data/serialize/json::json-stringify-post-body
  any:
  - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
  - id: micro-behaviors/communications/http/services/analytics::extension-attribution-field
  - id: micro-behaviors/communications/http/services/analytics::ga-cookie-polling-interval
  - id: micro-behaviors/communications/http/services/analytics::distributer-id-field
  - id: vsent-beacon-cookie
  - id: micro-behaviors/ui/window/navigation::browser-location-external-method
  - id: micro-behaviors/communications/http/services/analytics::vwo-or-vis-opt-token
  unless:
  # Session-replay/RUM loggers (LogRocket) POST telemetry with cookie helpers.
  - id: well-known/lib/observability/logrocket::logrocket-logger-bundle
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: js-browser-state-oob-post
  for: [javascript]
  desc: Browser runtime state posted to OOB callback
  crit: hostile
  conf: 0.97
  mbc: "E1005"
  near_lines: 160
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
  - id: objectives/exfiltration/http/query::browser-query-data-exfil
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: js-browser-storage-oob-exfil
  for: [javascript]
  desc: Browser storage state exfiltrated to OOB callback
  crit: hostile
  conf: 0.98
  mbc: "E1005"
  near_lines: 180
  all:
  - id: micro-behaviors/data/serialize/json::json-stringify-local-storage
  - id: micro-behaviors/data/serialize/json::json-stringify-session-storage
  - id: micro-behaviors/data/parse/html::dom-body-text-substring
  - id: micro-behaviors/os/env/config::browser-app-config-global
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
  needs: 1
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: js-sessionstorage-webhookrelay-exfil
  for: [javascript]
  desc: Browser sessionStorage WebhookRelay exfil
  crit: hostile
  conf: 0.98
  mbc: "E1005"
  all:
  - id: objectives/exfiltration/oob/callback::browser-sessionstorage-webhookrelay-exfil
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-local-storage
  - id: micro-behaviors/data/parse/html::dom-body-text-substring
  - id: micro-behaviors/os/env/config::browser-app-config-global
  needs: 1
- id: js-cookie-form-webhook-exfil
  for: [javascript]
  desc: Browser cookie stolen by hidden POST form
  crit: hostile
  conf: 0.985
  mbc: "E1005"
  all:
  - id: objectives/exfiltration/http/collect::js-hidden-form-post
  - id: objectives/credential-access/browser/session-hijack::js-cookie-form-field
  - id: micro-behaviors/communications/url/host::webhook-site
  any:
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/communications/http/message::https-prefix
- id: js-cookie-query-webhook-exfil
  for: [javascript]
  desc: Browser cookie exfiltrated to webhook query endpoint
  crit: hostile
  conf: 0.98
  mbc: "E1005"
  near_lines: 40
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: objectives/exfiltration/http/query::encoded-cookie-query-param
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/url/host::webhook-site
  any:
  - id: micro-behaviors/communications/http/message::https-prefix
  - id: objectives/exfiltration/http/query::browser-query-data-exfil
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: html-script-cookie-fetch-exfil
  for: [html]
  desc: HTML script reads cookies and exfiltrates via fetch
  crit: hostile
  conf: 0.97
  attack: T1539,T1041
  mbc: E1005
  near_lines: 30
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
  - id: micro-behaviors/communications/http/request/html::html-fetch-call
  any:
  - id: micro-behaviors/data/encode/url::encode-uri-component-text-call
  - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
  needs: 1
  unless:
  - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: html-android-bridge-callback-exfil
  for: [html]
  desc: HTML abuses Android JS bridge and exfiltrates callback data
  crit: hostile
  conf: 0.96
  attack: T1411,T1041
  mbc: E1005
  near_lines: 40
  all:
  - id: micro-behaviors/process/interpreter/webview::javascript-android-bridge-call
  - id: micro-behaviors/communications/http/request/html::html-fetch-call
  - id: micro-behaviors/data/encode/url::encode-uri-component-text-call
  unless:
  - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: js-csp-prefetch-skimmer
  for: [javascript]
  desc: CSP-aware browser skimmer steals cookies and exfiltrates
  crit: hostile
  conf: 0.98
  mbc: "E1005"
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/header/custom::csp-response-header-read
  - id: micro-behaviors/ui/window/dom/create::document-head-append
  - id: micro-behaviors/data/encode/base64::btoa-utf8-safe-encode
  any:
  - id: micro-behaviors/data/control-flow/branch::activation-hour-gate
  - id: micro-behaviors/communications/http/url/path::local-ip-or-localhost-guard
  - id: objectives/anti-static/obfuscation/obfuscator/signature::obfuscated-char-map-pool
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
# The XHR spelling of the skimmer: every cookie swept and handed to a
# ready-state-callback transport. The fetch-based skimmer above requires a
# POST body; trackers built on XMLHttpRequest never show one, so the harvest
# rides an XHR that fires on state change.
#
# Worked example: the trojanized Great Suspender build, whose injected
# tracker sweeps document.cookie and beacons it home from an XHR handler
# while it also records keystrokes.
#
# The sweep and the transport must be the same code (near_bytes), or the rule
# is a file-wide coincidence between two idioms that every web bundle
# contains: `document.cookie.split(';')` is the body of every hand-rolled
# `getCookie`, and `.onreadystatechange` is set by every hand-rolled XHR
# wrapper (see that trait's own note). Paddle's checkout library, vendored as
# ameliabooking's public/js/paddle/paddle.js, has its `getCookie` helper 11 KB
# away from the nearest readystatechange handler.
    - id: "metadata/file/naming::test-directory-component"
- id: js-xhr-cookie-skimmer
  for: [javascript]
  desc: Browser script harvests cookies via XHR transport
  crit: hostile
  conf: 0.95
  mbc: E1005
  near_bytes: 1024
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-readystatechange-handler
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: obfuscated-cookie-token-remote-loader
  for: [javascript]
  desc: Obfuscated browser code harvests cookies and tokens before remote loading
  crit: hostile
  conf: 0.98
  attack: T1539,T1555.003,T1027,T1105
  mbc: E1005
  all:
    - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
    - id: micro-behaviors/communications/http/auth::access-token-field-reference
    - id: micro-behaviors/communications/http/request/json::fetch-external-url
    - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
    - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
- id: browser-cookie-harvest-ajax-loader
  for: [javascript]
  desc: Browser script sends harvested cookies to a hardcoded remote endpoint
  crit: hostile
  conf: 0.97
  attack: T1539,T1185,T1105
  mbc: E1005
  all:
    - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
    - id: micro-behaviors/communications/http/cookies::cookie-value-body-field
    - id: micro-behaviors/communications/http/request/client::jquery-ajax-call
    - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  # Keep the cookie read/body field, request, and destination in one local
  # workflow. Large application bundles commonly contain an unrelated cookie
  # helper, AJAX clients, and documentation URLs in separate modules.
  near_bytes: 2048
