  - id: micro-behaviors/data/db/web-storage::dom-storage-setitem-call
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::a0-string-decoder-entrypoint
  downgrade:
