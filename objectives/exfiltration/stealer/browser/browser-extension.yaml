defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: extension-sentry-navigation-surveillance
    desc: Extension sends identified browser navigation pairs through Sentry
    crit: hostile
    conf: 0.99
    attack: T1119
    for: [crx, xpi, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/process/hook/webextension::webrequest-before-send-headers-listener
      - id: micro-behaviors/os/telemetry/activity::navigation-user-referrer-target-fields
      - id: micro-behaviors/os/telemetry/logging/analytics::sentry-request-context-message
    unless:
      # Sentry's stock HttpContext integration attaches Referer and
      # User-Agent to every event, which is what the referrer/user-id leg is
      # reading -- it is the SDK's code, not the extension profiling
      # navigation. A self-hosted DSN on the vendor's own domain is just
      # self-hosting. "Adblock Unlimited" scored hostile on this.
      - id: well-known/lib/observability/sentry-js::sentry-js-bundled-sdk
  - id: extension-remote-origin-tracking-beacon
    desc: Extension tracks visited origins through hidden remote frames
    crit: hostile
    conf: 0.99
    attack: T1041,T1176
    for: [crx, xpi, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-updated
      - id: micro-behaviors/communications/http/url/path::browser-url-origin-read
      - id: micro-behaviors/data/encode/base64::btoa-page-origin
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::browser-iframe-src-variable
      - id: micro-behaviors/ui/window/style::browser-iframe-hidden-remote
      - id: micro-behaviors/communications/http/request/credentials::fetch-credentials-include
  - id: browser-hijacker-page-telemetry
    desc: Hijacker reports page URL and referrer
    crit: hostile
    conf: 0.98
    attack: T1119,T1176,T1041
    all:
      - id: micro-behaviors/communications/http/url/navigation::identified-page-referrer-access
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/hook/webextension::declarative-net-request-update

  # Archive scope proves only that these features are packaged together. It
  # cannot prove that Replay runs inside the all-URL content script: an
  # extension may enable Replay solely for its own popup or dashboard UI.
