defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1041
composite_rules:
  - id: decrypted-browser-accounts-remote-report
    desc: Browser decryption with recovered-account response over network stream
    crit: hostile
    conf: 0.97
    # Required source, secret recovery, outbound report representation and
    # transport are separate roles. This describes co-occurrence, not IL flow.
    all:
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/data/serialize/schema-credential::recovered-accounts-response-accessor
      - id: micro-behaviors/communications/socket/tcp::networkstream-dotnet-str
      - id: micro-behaviors/fs/path/log/application::keylogger-log-directory-query
