defaults:
  platforms: [unix]
  for: [shell]
  attack: T1555.003

composite_rules:
  - id: shell-browser-credential-exfil
    desc: Shell browser credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/browser/firefox::shell-legacy-browser-profiles
      - id: objectives/credential-access/browser/firefox::shell-browser-secret-files
      - id: objectives/exfiltration/http/report::shell-browser-creds-post
