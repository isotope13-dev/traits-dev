defaults:
  platforms: [netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: native-browser-credential-http-exfil
    for: [c]
    desc: Native browser credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/password-store::native-browser-credential-paths
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/header/content-type::octet-stream-content-type
