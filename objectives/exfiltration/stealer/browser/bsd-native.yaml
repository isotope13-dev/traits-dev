defaults:
  platforms: [netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: native-browser-credential-http-exfil
    for: [c]
    desc: Native browser credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/browser/multi-target::native-browser-credential-paths
      - id: micro-behaviors/communications/http/post::native-post-request-line
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header
