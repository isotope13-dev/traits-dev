defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-browser-decryption-secret-export
    desc: Browser decryption with export and force-kill
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1041
    all:
      - id: objectives/credential-access/browser/chromium::js-dpapi-aesgcm-login-decrypt
      - id: micro-behaviors/data/serialize/schema-credential::fetch-json-browser-secret-fields
      - id: micro-behaviors/process/terminate/command::js-taskkill-force-command
