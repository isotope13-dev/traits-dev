# Chromium extensions persist their private state below each profile's
# `Local Extension Settings` directory. Reading one file there can be a backup
# or migration operation; recursively harvesting the store is sensitive, and
# routing the harvested bytes into an HTTP body establishes exfiltration.
#
# Keep the collection composite language-neutral so equivalent stealers in
# Python, Go, Rust, PowerShell, or native code inherit the same behavior-level
# coverage. The payload-flow fact is bounded to source-local assignments and
# helpers by the extractor rather than inferred from an English endpoint name.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1555.003

composite_rules:
  - id: chromium-extension-storage-http-exfil
    desc: "Exports Chromium extension storage over HTTP"
    crit: hostile
    conf: 0.98
    scope: file
    attack: T1041,T1555.003
    all:
      - id: objectives/credential-access/browser/chromium::chromium-extension-storage-collection
      - id: micro-behaviors/communications/http/request/credentials::file-http-body-flow
