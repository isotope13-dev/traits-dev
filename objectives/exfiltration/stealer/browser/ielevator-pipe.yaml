# The source is the IElevator key-recovery helper, not an arbitrary file read.
# A named-pipe client and binary read/write APIs carry its request and response.
# Diagnostic strings corroborate that exchange; no network/C2 claim is made.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003

composite_rules:
  - id: chromium-decrypted-key-pipe-response
    desc: Chromium key recovery with named-pipe response
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/browser/app-bound::chromium-ielevator-com-decrypt-helper
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/crypto/decrypt::empty-decrypted-key-diagnostic
      - id: micro-behaviors/communications/transfer::write-response-failure-diagnostic
