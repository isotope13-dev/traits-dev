# A .NET stealer that reads Chromium's credential store, queries it with SQL,
# and posts the result to a remote host.
#
# `Login Data` is a SQLite database whose `logins` table holds saved
# passwords. Code that opens it with a data reader, walks several browser
# profile directories, and then makes an outbound HTTP request is collecting
# credentials, not managing them. JuiceLedger's `python-install.scr` (2022,
# distributed through hijacked PyPI accounts) embedded exactly this as
# `meta.dll` inside a signed .NET single-file bundle.
#
# A password manager's importer reads one store the user pointed it at; it
# does not sweep Chrome, Edge and Firefox profiles and then call out.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1041
  mbc: E1555

composite_rules:
  # Browser data, byte reads, Base64 encoding and an HTTP POST occur in the
  # same managed sample, alongside an independently established keylogger
  # sender. This file-level profile does not prove that the browser buffer is
  # the argument to PostAsync; it records the browser-theft and send workflow.
  - id: managed-keylogger-browser-store-encoded-post
    desc: Managed browser-store theft with encoded HTTP POST code
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: micro-behaviors/communications/http/post::postasync
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post

  - id: dotnet-browser-store-query-exfil
    desc: Queries browser credential stores and sends them
    crit: hostile
    conf: 0.95
    all:
    - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
    - id: micro-behaviors/data/db/query::execute-reader
    - id: micro-behaviors/communications/http/client/managed::dotnet-http-request-or-multipart-archive-post
    unless:
    - id: well-known/tool/offensive/peas::winpeas-current-audit-assembly
