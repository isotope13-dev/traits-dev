# A .NET stealer that reads Chromium's credential store, queries it with SQL,
# and posts the result to a remote host.
#
# `Login Data` is a SQLite database whose `logins` table holds saved
# passwords. Code that opens it with a data reader, walks several browser
# profile directories, and then makes an outbound HTTP request is collecting
# credentials, not managing them. JuiceLedger's `python-install.scr` (2022,
# distributed through hijacked PyPI accounts) embedded exactly this as
# `meta.dll` inside a signed .NET single-file bundle.
#
# A password manager's importer reads one store the user pointed it at; it
# does not sweep Chrome, Edge and Firefox profiles and then call out.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1041
  mbc: E1555

composite_rules:
  - id: dotnet-browser-store-query-exfil
    desc: Queries browser credential stores and sends them
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/browser/chromium::logins-table
      - id: micro-behaviors/data/db/access::execute-reader
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
    any:
      - id: micro-behaviors/fs/path/application/browser::chrome-windows-profile
      - id: micro-behaviors/fs/path/application/browser::edge-windows-profile
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
