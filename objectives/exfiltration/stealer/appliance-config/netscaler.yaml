defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift, zig, elf]
  attack: T1041

traits:
  - id: netscaler-collect-http-path
    desc: NetScaler collect HTTP path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'netscaler[\s\S]{0,220}/collect'

  - id: netscaler-exfil-api-agent
    desc: NetScaler exfil API agent
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '/api/v1/exfil[\s\S]{0,120}(AgentId|netscaler|NetScaler)'

composite_rules:

  - id: netscaler-dns-exfil-label
    desc: NetScaler DNS exfil label
    crit: suspicious
    conf: 0.93
    near_bytes: 400
    all:
      - id: objectives/exfiltration/dns/prep::dns-exfil-label
    any:
      - id: netscaler-collect-http-path
      - id: netscaler-exfil-api-agent
      - id: objectives/exfiltration/http/report::netscaler-data-chunk-header
      - id: micro-behaviors/fs/path/secret-config::netscaler-nsconfig-path

  - id: netscaler-config-secret-access
    desc: NetScaler config secret access
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/secret-config::netscaler-nsconfig-path
    any:
      - id: micro-behaviors/fs/path/private-key::netscaler-ssl-material-path
      - id: micro-behaviors/fs/path/secret-config::netscaler-license-path
      - id: micro-behaviors/communications/http/services/netscaler::netscaler-systemuser-api-path
      - id: objectives/credential-access/files/appliance::netscaler-config-read-source
      - id: objectives/credential-access/files/appliance::netscaler-config-read-native



  - id: netscaler-config-http-exfil
    desc: NetScaler config HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/secret-config::netscaler-nsconfig-path
    any:
      - id: netscaler-collect-http-path
      - id: netscaler-exfil-api-agent
      - id: objectives/exfiltration/http/report::netscaler-data-chunk-header

  - id: netscaler-config-dns-exfil
    desc: NetScaler config DNS exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/secret-config::netscaler-nsconfig-path
      - id: netscaler-dns-exfil-label
    any:
      - id: micro-behaviors/data/encode/payload::printf-hex-byte-format
      - id: micro-behaviors/fs/path/private-key::netscaler-ssl-material-path
