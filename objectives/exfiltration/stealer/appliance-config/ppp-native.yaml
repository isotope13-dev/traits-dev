defaults:
  platforms: [unix, appliance]
  for: [c, cpp]
  attack: T1041,T1555

composite_rules:
  - id: native-ppp-secret-socket-exfil
    desc: PPP secrets sent over raw socket
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/credential-access/vpn/config::native-ppp-secret-read
      - id: micro-behaviors/communications/socket/send::sendto-symbol
    near_lines: 8
