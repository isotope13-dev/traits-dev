defaults:
  platforms: [openwrt]
  for: [c, cpp, objc, rust, elf]
  attack: T1041
  mbc: E1567

composite_rules:
  - id: openwrt-native-account-config-http-exfil
    desc: "Appliance account and configuration export"
    crit: hostile
    conf: 0.96
    scope: outer
    for: [c, cpp, objc, rust, elf, tar, zip]
    all:
      - id: micro-behaviors/fs/path/config/system::openwrt-sensitive-config-path
      - id: micro-behaviors/communications/http/url/telemetry::native-http-collect-path
      - id: micro-behaviors/communications/http/post::native-post-request-line
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: objectives/exfiltration/http/upload::native-elf-account-file-path
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/path/credential::hidden-temp-secret-path
      - id: micro-behaviors/fs/path/config/system::openwrt-sensitive-config-path
      - id: micro-behaviors/communications/http/header/content-length::content-length-header
    needs: 3
  - id: openwrt-native-message-api-http-exfil
    desc: "Appliance credentials with message API upload"
    crit: hostile
    conf: 0.96
    scope: outer
    for: [c, cpp, objc, rust, elf, tar, zip]
    all:
      - id: micro-behaviors/communications/http/url/api-path::native-http-message-api-path
      - id: objectives/credential-access/theft/file::openwrt-native-credential-config-harvest
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-easy-perform
      - id: micro-behaviors/communications/http/download/curl::curl-easy-setopt
      - id: micro-behaviors/communications/http/download/curl::curl-slist-append
    needs: 2
