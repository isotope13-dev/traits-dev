defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, javascript]
  attack: T1552

traits:
- id: routeros-user-dump-variable--creds-dump
  desc: RouterOS user dump variable (creds_dump)
  crit: suspicious
  conf: 0.9
  if:
    type: text
    word: creds_dump
- id: routeros-user-dump-variable--userdump
  desc: RouterOS user dump variable (userDump)
  crit: suspicious
  conf: 0.9
  if:
    type: text
    word: userDump
- id: routeros-user-dump-variable--userlist
  desc: userList identifier token
  crit: component
  conf: 0.9
  if:
    type: text
    word: userList
- id: haxe-user-list-marker
  desc: Haxe haxelib user list marker
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: api.getUserList()
composite_rules:
- id: routeros-user-dump-variable
  desc: RouterOS user listing held in a dump variable
  crit: suspicious
  conf: 0.9
  # The variable names alone (`userList`, `userDump`) are ordinary words in
  # web-content and subdomain wordlists; only a script that also reads the
  # RouterOS user database is storing a dump.
  all:
  - id: micro-behaviors/os/user/account::routeros-user-database-read
  any:
  - id: routeros-user-dump-variable--creds-dump
  - id: routeros-user-dump-variable--userdump
  - id: routeros-user-dump-variable--userlist
  unless:
  - id: metadata/build/bundler/vscode::javascript-source-map-file
  - id: metadata/lang/source/
  - id: haxe-user-list-marker
- id: routeros-user-db-http-exfil
  desc: RouterOS user DB HTTP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/user/account::routeros-user-database-read
  - id: routeros-user-dump-variable
  - id: objectives/exfiltration/http/collect::routeros-fetch-collect-url

- id: routeros-sensitive-config-http-exfil
  desc: RouterOS sensitive config exfil
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/files/appliance::routeros-sensitive-config-export
  - id: objectives/exfiltration/http/collect::routeros-http-data-upload
