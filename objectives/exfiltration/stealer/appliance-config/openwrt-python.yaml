defaults:
  platforms: [openwrt]
  for: [python, pyc]
  attack: T1041

traits: []

composite_rules:
  - id: openwrt-python-credential-http-exfil
    desc: "Appliance configuration export over HTTP"
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/theft/file::openwrt-python-credential-config-harvest
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
    any:
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/http/post::python-post-method-literal
      - id: micro-behaviors/communications/http/request/body::python-request-data-argument
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-pyc-symbol
    needs: 1
