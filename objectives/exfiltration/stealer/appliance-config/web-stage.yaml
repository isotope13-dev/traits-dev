defaults:
  for: [scripts, source, text]
  platforms: [unix]
  conf: 0.99
  attack: T1602.001
traits:
  - id: netscaler-config-copy-webroot
    desc: Copies NetScaler config into public logon
    crit: suspicious
    if:
      type: text
      regex: '\bcat\s+/flash/nsconfig/ns\.conf\s*>\s*/var/netscaler/logon/[^\s;]{1,160}'
  - id: netscaler-config-archive-webroot
    desc: Archives NetScaler config into public logon
    crit: suspicious
    if:
      type: text
      regex: '\btar\s+czf\s+/var/netscaler/logon/[^\s;]{1,160}\s+/flash/nsconfig\b'
  - id: netscaler-config-archive-webroot-ifs
    desc: IFS tar stages config into public logon
    crit: suspicious
    if:
      type: text
      regex: 'tar\$\{IFS\}czf\$\{IFS\}/var/netscaler/logon/\S{1,160}\$\{IFS\}/flash/nsconfig\b'
