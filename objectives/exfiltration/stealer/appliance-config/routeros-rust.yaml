defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]
  attack: T1041

composite_rules:
  - id: rust-routeros-config-secret-paths
    desc: Rust RouterOS secret paths
    crit: suspicious
    conf: 0.92
    any:
      - id: micro-behaviors/fs/path/config/backup::rust-rw-config-backup-path
      - id: micro-behaviors/fs/path/secret-config::routeros-config-backup-path
      - id: objectives/credential-access/files/appliance::rust-routeros-api-token-path

  - id: rust-routeros-credential-exfil
    desc: Rust RouterOS credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: rust-routeros-config-secret-paths
      - id: micro-behaviors/fs/path/account-db::rust-unix-secret-path-bundle
    any:
      - id: objectives/collection/archive/stage::rust-cache-data-credential-stash
      - id: objectives/exfiltration/http/collect::rust-generic-collect-url
    needs: 1
