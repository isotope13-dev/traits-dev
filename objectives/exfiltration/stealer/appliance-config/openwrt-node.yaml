defaults:
  platforms: [openwrt]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: openwrt-node-credential-http-exfil
    desc: "Appliance configuration export over HTTP"
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/theft/file::openwrt-node-credential-config-harvest
      - id: micro-behaviors/communications/http/request/client::https-request
    any:
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/request/body::request-write-call
      - id: micro-behaviors/communications/http/request/body::request-end-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/header/transfer-encoding::node-chunked-transfer-encoding
    needs: 2
  - id: openwrt-node-chunked-http-exfil
    desc: OpenWrt Node chunked HTTP exfiltration
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/header/transfer-encoding::node-chunked-transfer-encoding
      - id: micro-behaviors/communications/http/request/body::request-write-call
      - id: micro-behaviors/communications/http/request/body::request-end-call
    any:
      - id: objectives/credential-access/theft/file::openwrt-node-credential-config-harvest
      - id: micro-behaviors/fs/path/config/system::openwrt-uci-config-access
    needs: 1
