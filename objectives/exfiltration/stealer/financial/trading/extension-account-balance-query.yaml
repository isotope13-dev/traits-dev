# An all-site content script that packs the logged-in account's email and
# balance into a query string and fetches a remote PHP script with it:
# broker/exchange account details lifted off the page and sent out in a GET.
defaults:
  platforms: [windows, unix]
  attack: T1176,T1041

composite_rules:
  - id: content-script-account-balance-get-exfil
    desc: All-site content script sends account email and balance to remote PHP
    crit: hostile
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: micro-behaviors/communications/url/construction/query::email-and-balance-query-params
      - id: micro-behaviors/communications/url/resource-path/file::url-php-query-script
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
