# Card values read by field name from a document-wide input listener and
# sent as a JSON POST. Checkout code can post card data to its own processor,
# so this stays suspicious on its own. The hostile composites in this
# directory require a wallet or clipboard rewrite as well.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: live-card-named-field-json-post
    desc: Card-field listener posts raw card values as JSON
    crit: suspicious
    conf: 0.9
    near_bytes: 600
    all:
      - id: micro-behaviors/ui/window/form-input::document-input-listener
      - id: micro-behaviors/data/parse/payment::payment-card-secret-pair
      - id: micro-behaviors/communications/http/request/json::json-body-post
