defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: card-phisher-scripted-post-forms
    desc: Card phisher constructs automatically submitted POST forms
    crit: hostile
    conf: 0.96
    attack: T1041
    all:
      - id: objectives/credential-access/financial/credit-card::pe-card-verification-phish
      - id: micro-behaviors/communications/http/request/html::native-html-post-form-template
      - id: micro-behaviors/communications/http/request/html::native-html-script-form-submit-template
