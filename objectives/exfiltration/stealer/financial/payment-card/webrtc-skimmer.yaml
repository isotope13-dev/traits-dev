# Payment-card skimmers that capture form data on pointer hover before submit
# or transmit card fields over WebRTC DataChannels to bypass HTTP CSP controls.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056.002,T1041
  mbc: B0028

composite_rules:
  - id: hover-triggered-card-skimmer
    desc: Hover listener captures payment card fields for exfiltration
    crit: hostile
    conf: 0.97
    near_bytes: 3000
    all:
      - id: micro-behaviors/data/parse/payment::payment-card-secret-pair
      - id: micro-behaviors/ui/window/event::browser-pointer-hover-listener
    any:
      - id: micro-behaviors/communications/messaging/send::send-message-call
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/websocket/send::websocket-instance-send-call

  - id: webrtc-payment-card-skimmer
    desc: Payment-card fields exfiltrated over WebRTC DataChannel
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/parse/payment::payment-card-secret-pair
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: micro-behaviors/communications/proxy/turn::webrtc-data-channel-api
    any:
      - id: micro-behaviors/communications/messaging/send::send-message-call
      - id: micro-behaviors/communications/proxy/turn::webrtc-inline-sdp-datachannel
      - id: micro-behaviors/communications/proxy/turn::webrtc-data-channel-send
