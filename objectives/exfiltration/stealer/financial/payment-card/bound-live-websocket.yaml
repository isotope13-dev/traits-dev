defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: payment-input-websocket-value-flow
    desc: Streams raw card input over WebSocket
    crit: hostile
    conf: 0.99
    attack: T1056.003,T1041
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration "const"
            . (variable_declarator name: (identifier) @socket
              value: (new_expression constructor: (identifier) @websocket
                arguments: (arguments . (string) @url))) .)
          . (expression_statement (call_expression
            function: (member_expression object: (identifier) @document
              property: (property_identifier) @listen)
            arguments: (arguments . (string) @event_type . (_
              [(identifier) @event (formal_parameters . (_) @event)]
              body: (statement_block
                . (if_statement
                  condition: (parenthesized_expression (call_expression
                    function: (member_expression
                      object: (member_expression object: (identifier) @checked
                        property: (property_identifier) @checked_target)
                      property: (property_identifier) @matches)
                    arguments: (arguments . (string) @selector)))
                  consequence: (statement_block
                    . (expression_statement (call_expression
                      function: (member_expression object: (identifier) @sender
                        property: (property_identifier) @send)
                      arguments: (arguments . (call_expression
                        function: (member_expression object: (identifier) @json
                          property: (property_identifier) @stringify)
                        arguments: (arguments . (object
                          (pair value: (member_expression
                            object: (member_expression object: (identifier) @sent
                              property: (property_identifier) @sent_target)
                            property: (property_identifier) @value))))))))))))))))
          (#eq? @document "document") (#eq? @listen "addEventListener")
          (#match? @event_type "^['\"]input['\"]$")
          (#eq? @socket @sender) (#not-eq? @socket @event)
          (#eq? @websocket "WebSocket") (#match? @url "^['\"]wss?://")
          (#eq? @event @checked) (#eq? @event @sent)
          (#eq? @checked_target "target") (#eq? @sent_target "target")
          (#eq? @matches "matches")
          (#match? @selector "^['\"](\\s*(input)?\\[\\s*autocomplete\\s*=\\s*['\"]cc-[a-z]+['\"]\\s*\\]\\s*,?){2,3}['\"]$")
          (#match? @selector "\\[\\s*autocomplete\\s*=\\s*['\"]cc-number['\"]\\s*\\]")
          (#match? @selector "\\[\\s*autocomplete\\s*=\\s*['\"]cc-csc['\"]\\s*\\]")
          (#eq? @send "send") (#eq? @json "JSON") (#eq? @stringify "stringify")
          (#eq? @value "value"))
