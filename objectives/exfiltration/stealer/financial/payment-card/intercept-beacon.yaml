defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: intercepted-card-beacon
    desc: Intercepts payment inputs beside beacon send
    crit: hostile
    conf: 0.97
    attack: T1056.003,T1041
    near_bytes: 7000
    all:
      - id: micro-behaviors/ui/window/form-input::reads-card-autocomplete-inputs
      - id: micro-behaviors/communications/http/request/beacon::cvv-width-guarded-params-beacon
    any:
      - id: micro-behaviors/communications/http/intercept::xhr-prototype-send-eq
      - id: micro-behaviors/communications/http/intercept::xhr-bracket-send-eq
      - id: micro-behaviors/communications/http/intercept::window-fetch-eq
      - id: micro-behaviors/communications/http/intercept::globalthis-fetch-eq
