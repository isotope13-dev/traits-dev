defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1041
composite_rules:
- id: operator-supplied-card-record-remote-post
  desc: Operator-supplied card records sent by HTTP POST
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/ui/dialog/prompt::python-card-list-input-prompt
  - id: micro-behaviors/data/parse/payment::pipe-card-record-format
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/request/body/construction::http-post-with-body-argument
  unless:
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
- id: complete-card-record-remote-post
  desc: Complete card record POSTed to remote endpoint
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/data/parse/payment::pipe-card-record-format
  - id: micro-behaviors/data/parse/payment::pipe-delimited-card-regex
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/request/body/construction::http-post-with-body-argument
