# Card number and security code captured on a submit, click, or change event
# and sent Base64-wrapped through a generic `.send()` sink. Checkout code that
# posts card data to its own processor sends it plain or tokenized; wrapping
# it in Base64 is concealment from whoever inspects the traffic. The sink is
# left open (XHR, WebSocket, data channel) so the rule survives a change of
# channel, as with stages delivered over WebRTC and run from memory.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1056.003,T1041
  mbc: B0028

composite_rules:
  - id: encoded-card-capture-send
    desc: Card fields sent Base64-wrapped on capture
    ref: https://www.infohawk.com/news/2026-11-27-black-friday-webrtc-skimmer
    crit: hostile
    conf: 0.92
    near_bytes: 3000
    all:
      - id: micro-behaviors/data/parse/payment::payment-card-secret-pair
      - id: micro-behaviors/data/encode/serialized-json::send-base64-json-call
    any:
      - id: micro-behaviors/ui/window/form-input::browser-submit-hook-registration
      - id: micro-behaviors/ui/window/form-input::element-edit-event-listener
      - id: micro-behaviors/ui/window/form-input::document-input-listener
      - id: micro-behaviors/ui/window/click::browser-global-click-listener
