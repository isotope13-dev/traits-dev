# A live document input listener sending raw field values alongside card
# selectors warrants review. Unlike a bound source-to-sink query this proximity
# rule does not prove which field is sent; retain suspicious criticality.
defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: browser-wallet-swap-with-card-skimmer
    desc: Browser wallet substitution and card skimming
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: objectives/impact/crypto-manipulation/hijack-transfer/address::browser-eth-substitution
    any:
      - id: live-card-input-value-beacon
      - id: live-card-input-value-fetch
      - id: credit-card-websocket-stealer

  - id: browser-copy-rewrite-with-card-skimmer
    desc: Browser copy interception and card skimming
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: objectives/impact/crypto-manipulation/hijack-transfer/address::browser-copy-event-wallet-rewrite
    any:
      - id: live-card-input-value-beacon
      - id: live-card-input-value-fetch
      - id: credit-card-websocket-stealer

  - id: live-card-input-value-beacon
    desc: Card input listener with raw-value HTTP beacon
    crit: suspicious
    conf: 0.94
    near_bytes: 700
    all:
      - id: micro-behaviors/ui/window/form-input::document-input-listener
      - id: micro-behaviors/ui/window/form-input::payment-autocomplete-selector
      - id: micro-behaviors/communications/http/request/beacon::json-event-value-beacon
