defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1041,T1113

composite_rules:
  - id: android-accessibility-screen-tree-websocket-control
    desc: Accessibility implant streams screen and UI tree over WebSocket
    crit: hostile
    conf: 0.995
    for: [java, kotlin]
    attack: T1041,T1113,T1417.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/display/screenshot::android-source-screenshot-call
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-tree-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-send

  # Base64 is the transport encoding used by this profile. Requiring the
  # Accessibility screenshot API, a WebSocket client, and the strong namespace
  # anomaly avoids treating ordinary Base64 or screen-sharing code as theft.
  - id: android-obfuscated-accessibility-screen-channel
    desc: Accessibility screenshot WebSocket channel
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/hardware/display/screenshot::android-accessibility-screenshot-api
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-deep-long-package-namespace
