# Screenshot capture in source code
# ATT&CK: T1113 (Screen Capture)
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1113
  mbc: C0014

composite_rules:
- id: powershell-screenshot-upload
  desc: PowerShell screenshot C2 upload
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/collection/screenshot::powershell-addtype-screenshot
  - id: micro-behaviors/communications/http/upload::curl-upload
  - id: micro-behaviors/communications/ip/literal::http-ip-url
- id: powershell-screenshot-surveillance-upload
  desc: PowerShell screenshot loop upload
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/collection/screenshot::powershell-screenshot-timer
  - id: objectives/exfiltration/stealer/screen::powershell-screenshot-upload
