# Screenshot capture in source code
# ATT&CK: T1113 (Screen Capture)
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1113
  mbc: C0014

composite_rules:
- id: powershell-screenshot-upload
  desc: PowerShell screenshot C2 upload
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/collection/screenshot::powershell-addtype-screenshot
  - id: micro-behaviors/communications/http/upload::curl-upload
  - id: micro-behaviors/communications/ip/literal::http-ip-url
- id: powershell-screenshot-surveillance-upload
  desc: PowerShell screenshot loop upload
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/collection/screenshot::powershell-screenshot-timer
  - id: objectives/exfiltration/stealer/screen::powershell-screenshot-upload
- id: powershell-desktop-png-base64-http-exfil
  desc: PowerShell posts a full-desktop PNG over HTTP
  crit: hostile
  conf: 0.97
  attack: T1113,T1041
  all:
  - id: objectives/collection/screenshot::powershell-full-desktop-capture-to-file
  - id: micro-behaviors/data/encode/base64::to-base64-string
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::powershell-http-post-body
  any:
  - id: micro-behaviors/communications/url/encoded::inline-image-data-uri-context
  - id: micro-behaviors/data/encode/base64::powershell-base64-image
