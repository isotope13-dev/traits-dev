defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-screen-transaction-channel
    desc: "Accessibility screen capture with transaction channel"
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/display/screenshot::android-screen-capture-capability
      - id: objectives/command-and-control/backdoor/rat/remote-agent::android-transaction-control-protocol
    any:
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-persistent-id-collection
      - id: micro-behaviors/process/interpreter/webview::webview-js-bridge
  - id: android-screen-channel-account-reference
    desc: "Screen capture channel with account-store reference"
    crit: hostile
    conf: 0.97
    for: [apk, zip, dex, xml]
    all:
      - id: micro-behaviors/hardware/display/screenshot::android-screen-capture-capability
      - id: objectives/command-and-control/backdoor/rat/remote-agent::android-transaction-control-protocol
      - id: objectives/credential-access/theft/file::android-account-store-path
  # A recording API can be legitimate. The combination below additionally
  # exposes paired SMS-operation tokens and dedicated remote-screen sender
  # fields inside a heavily randomized DEX namespace.
  - id: android-obfuscated-screen-sms-export
    desc: "Obfuscated Android screen export with SMS controls"
    crit: hostile
    conf: 0.995
    for: [apk, zip, dex]
    attack: T1027,T1113,T1123,T1636.004
    all:
      - id: micro-behaviors/data/stream/record::android-media-recorder-reference
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-screen-capture
      - id: objectives/collection/messaging/sms::android-compact-sms-tokens
      - id: micro-behaviors/os/privilege/manifest::sms-manager-class
      - id: objectives/command-and-control/backdoor/rat/remote-agent::android-screen-sender-fields
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-wide-random-package-namespace
  # DEX string-pool copies of SEND_SMS are permission catalogs, not grants.
  # Pair real call-log / SmsManager APIs with sockets instead of that name.
