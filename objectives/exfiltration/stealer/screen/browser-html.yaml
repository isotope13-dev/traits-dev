defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1113,T1041
  mbc: B0002

composite_rules:
  - id: html-display-frame-canvas-http-upload
    desc: HTML captures a display frame and uploads the canvas image
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/hardware/display/stream::html-browser-display-capture-api
      - id: micro-behaviors/ui/graphics/draw::html-canvas-draw-image-call
      - id: micro-behaviors/hardware/display/screenshot::html-canvas-to-blob-call
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/post::html-fetch-post-call
