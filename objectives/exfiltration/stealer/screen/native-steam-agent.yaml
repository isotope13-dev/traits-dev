defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # RE: screenshot task -> GetDesktopWindow/GetDC -> BitBlt/GetDIBits -> JPEG
  # -> JSON result -> the signed HTTP result request. The stream task repeats
  # capture and sends frames through the stream endpoint. Require the hostile
  # task protocol: ordinary GDI capture and an HTTP library do not prove theft.
  - id: steam-takeover-agent-screen-reports
    desc: Steam-takeover agent with JPEG screen reporting
    crit: hostile
    conf: 0.98
    attack: T1113,T1041
    all:
      - id: objectives/command-and-control/remote-command/http-agent::concealed-steam-takeover-agent
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/data/encode/image/jpeg::jpeg-encode-error-diagnostic
