defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
composite_rules:
- id: node-command-agent-screen-export
  desc: Remote shell agent exports desktop frames
  crit: hostile
  conf: 0.98
  attack: T1113,T1041
  all:
  - id: objectives/command-and-control/remote-command/socketio-control::socketio-received-shell-command
  - id: micro-behaviors/communications/websocket/media::node-desktop-frame-emit
  - id: micro-behaviors/hardware/display/screenshot::screenshot-desktop-import
