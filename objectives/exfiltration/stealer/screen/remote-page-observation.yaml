defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: screenshot-payload-field
    desc: HTTP payload includes a screenshot data field
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\\bscreenshotData\\s*:'

  - id: page-content-payload-field
    desc: HTTP payload includes captured page content
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\\b(domContent|html)\\s*:'

composite_rules:
  - id: posts-screenshot-and-page-content
    desc: Posts screenshot and page content in an HTTP request
    crit: suspicious
    conf: 0.96
    scope: file
    all:
      - id: screenshot-payload-field
      - id: page-content-payload-field
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::request-options-post-method
