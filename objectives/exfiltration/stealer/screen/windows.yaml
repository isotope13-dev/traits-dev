# Windows Screenshot Capture via GDI + GDI+ Encoding
# Full screenshot pipeline: GDI capture -> GDI+ PNG encode -> exfil
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: "C0014"

composite_rules:
- id: pe-screenshot-jpeg-upload
  desc: Screenshot JPEG HTTP upload
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/path/media::screenshot-jpg-artifact
  - id: micro-behaviors/communications/http/header/content-type::jpeg-content-type-header
  - id: micro-behaviors/communications/http/header/custom::pe-filename-header
  any:
  - id: micro-behaviors/ui/window/region::get-dc
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/communications/http/header/content-type::pe-octet-stream-content-type
  unless:
  - id: metadata/signed/platform/
- id: gdi-capture-http-exfil
  desc: Screen capture with HTTP network access
  crit: hostile
  conf: 0.92
  all:
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/data/encode/image/gdiplus::startup
  - id: micro-behaviors/communications/http/post::wininet-post
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: well-known/app/
  # Official SDIO paints with GDI and POSTs WinINet driver-update checks.
  - id: well-known/app/utility/sdio::sdio-official-context
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
    - id: metadata/binary/symbols/count::many-imports
  # DPAPI + screen capture canvas + HTTP read = credential/screenshot stealer
