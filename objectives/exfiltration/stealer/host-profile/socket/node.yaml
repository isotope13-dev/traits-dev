defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-runs-hostname
    desc: Node wrapper runs hostname command
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: "run\\s*\\(\\s*['\"]hostname['\"]\\s*\\)"
  - id: node-runs-id
    desc: Node wrapper runs identity command
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: "run\\s*\\(\\s*['\"]id['\"]\\s*\\)"
  - id: node-runs-hostname-i
    desc: Node wrapper runs host IP command
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: "run\\s*\\(\\s*['\"]hostname -I['\"]\\s*\\)"

composite_rules:
  # The three evidence spans follow a fingerprint result into clientContext
  # and then to getSocket().send. The outer rule adds the encrypted startup
  # runtime, which separates this from an ordinary identified telemetry flow.
  - id: node-fingerprint-client-context-socket-flow
    desc: Fingerprint result added to a nearby socket-bound client context
    crit: suspicious
    conf: 0.97
    near_bytes: 800
    all:
      - id: micro-behaviors/os/sysinfo/machine-id::get-fingerprint-helper-reference
      - id: micro-behaviors/data/source/property/assignment::node-client-context-await-assignment
      - id: micro-behaviors/communications/socket/send::node-getsocket-send-call

  - id: vscode-lazy-runtime-fingerprint-socket-exfil
    desc: VS Code extension sends a lazy-runtime fingerprint over its socket
    crit: hostile
    conf: 0.99
    attack: T1041,T1082,T1195.002
    all:
      - id: micro-behaviors/os/sysinfo/machine-id::get-fingerprint-helper-reference
      - id: micro-behaviors/data/source/property/assignment::node-client-context-await-assignment
      - id: micro-behaviors/communications/socket/send::node-getsocket-send-call
      - id: micro-behaviors/os/sysinfo/machine-id::initialize-fingerprint-helper
      - id: micro-behaviors/os/module/load::webpack-runtime-chunk-load
      - id: metadata/library/vscode::require-vscode

  - id: node-host-profile-socket-exfil
    desc: Node host profiling sent over a socket
    crit: hostile
    conf: 0.98
    all:
      - id: node-runs-hostname
      - id: node-runs-id
      - id: node-runs-hostname-i
      - id: micro-behaviors/communications/socket/dial::javascript-dial
      - id: micro-behaviors/communications/socket/send::node-socket-json-write
    near_bytes: 2400
