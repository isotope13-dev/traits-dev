# First-party tracking.json plus a file POST is product telemetry, the same
# shape analytics SDKs use to attach a visitor id. That is a notable upload
# of named tracking metrics, not a host-profile stealer. Combining it with
# the notebook JS round-trip still describes telemetry, not exfil: both legs
# are documented-benign notebook/analytics capabilities (see the sibling
# comments in objectives/discovery/system/fingerprint/notebook/python.yaml),
# and this composite pools them archive-wide with no proximity constraint,
# so it cannot tell an opt-in SDK's own telemetry from identity theft.
#
# The hostile shape is the one that also spends the platform's secret-store
# credential and gates itself on hosted-notebook execution -- that conviction
# lives in
# objectives/credential-access/credential-manager/store-api/hosted-notebook-tracking.yaml
# and is unaffected by the criticality here, which it references only as a leg.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  - id: python-tracking-metrics-json-upload
    desc: Uploads collected tracking metrics as JSON
    crit: notable
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload
      - id: micro-behaviors/communications/http/post::python-file-post-wrapper-call

  - id: notebook-fingerprint-tracking-exfil
    desc: Sends notebook browser identity with tracking metrics
    crit: notable
    conf: 0.98
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: python-tracking-metrics-json-upload
      - id: objectives/discovery/system/fingerprint/notebook::notebook-browser-fingerprint-harvest
