# Tracking payload upload is suspicious on its own. When a package also uses a
# hosted-notebook bridge to harvest a stable browser fingerprint, the archive-
# level combination establishes that the harvested identity is sent as part of
# the package's tracking data.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  - id: python-tracking-metrics-json-upload
    desc: Uploads collected tracking metrics as JSON
    crit: suspicious
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload
      - id: micro-behaviors/communications/http/post::python-file-post-wrapper-call

  - id: notebook-fingerprint-tracking-exfil
    desc: Exfiltrates a notebook browser fingerprint as tracking data
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: python-tracking-metrics-json-upload
      - id: objectives/discovery/system/fingerprint/notebook::notebook-browser-fingerprint-harvest
