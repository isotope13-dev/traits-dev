# A remote browser fingerprint is read back from a hosted notebook and attached
# to an outbound tracking upload. This crosses from local browser identity
# collection into exfiltration.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  - id: python-tracking-metrics-json-upload
    desc: Uploads collected tracking metrics as JSON
    crit: notable
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload
      - id: micro-behaviors/communications/http/post::python-file-post-wrapper-call

  - id: notebook-fingerprint-tracking-exfil
    desc: Sends notebook browser identity with tracking metrics
    crit: hostile
    conf: 0.98
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: python-tracking-metrics-json-upload
      - id: objectives/discovery/system/fingerprint/notebook::notebook-browser-fingerprint-harvest
