defaults:
  platforms: [unix, windows]
  for: [groovy]
  attack: T1041

traits:
  - id: groovy-hardcoded-http-urlconnection
    desc: Groovy opens a hardcoded HTTP URL connection
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'new\s+URL\s*\(\s*["'']https?://[^"'']{1,256}["'']\s*\)\.openConnection\(\)'

  - id: groovy-urlconnection-post-body
    desc: Groovy writes a URLConnection POST body
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'requestMethod\s*=\s*["'']POST["''][\s\S]{0,240}doOutput\s*=\s*true[\s\S]{0,240}outputStream'

  - id: groovy-json-host-field
    desc: Groovy JSON host field fragment
    crit: component
    conf: 0.94
    if:
      type: text
      substr: '{\"host\":\"'

  - id: groovy-json-user-field
    desc: Groovy JSON user field fragment
    crit: component
    conf: 0.94
    if:
      type: text
      substr: '\",\"user\":\"'

composite_rules:
  - id: groovy-host-user-urlconnection-exfil
    desc: Groovy sends host and user profile in an HTTP POST
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 1024
    all:
      - id: groovy-hardcoded-http-urlconnection
      - id: groovy-urlconnection-post-body
      - id: groovy-json-host-field
      - id: groovy-json-user-field
