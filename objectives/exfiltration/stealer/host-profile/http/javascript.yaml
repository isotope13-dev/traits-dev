defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: javascript-xor-host-profile-http-exfil
    desc: XOR-obfuscated JavaScript sends host and user profile over HTTP
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/discovery/system/fingerprint/user::node-host-user-query-pair
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/buffer::javascript-write-then-end-stream
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop

