defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  # A fixed remote JSON POST containing both hostname and whoami is host-profile
  # exfiltration. Requiring the executed whoami producer keeps ordinary product
  # telemetry and diagnostic JSON records out of this hostile conclusion.
  - id: node-host-user-json-http-exfil
    desc: Node exfiltrates host and user via JSON POST
    crit: hostile
    conf: 0.98
    attack: T1041,T1082,T1033
    mbc: E1041
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/discovery/system/fingerprint/user::small-node-host-user-query
      - id: objectives/discovery/system/profile::js-hostname-whoami-json-object
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/

  - id: javascript-xor-host-profile-http-exfil
    desc: XOR-hidden HTTP exfiltrates host and user
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/discovery/system/fingerprint/user::node-host-user-query-pair
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/buffer::javascript-write-then-end-stream
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
