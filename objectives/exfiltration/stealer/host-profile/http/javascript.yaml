defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  # Import-time npm libraries can collect a local account database, shell
  # reconnaissance, and host identity before sending one JSON POST. The
  # combination is hostile even when the endpoint is an ordinary hostname
  # rather than a public-IP or OOB service.
  - id: node-import-time-account-host-profile-http-exfil
    desc: Node import-time account and host-profile HTTP(S) exfiltration
    crit: hostile
    conf: 0.99
    attack: T1005,T1041,T1059.007,T1082,T1033,T1195.002
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/data/source/syntax/schema::hostname-object-key
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/communications/http/request/client::node-http-post-json-body

  # A fixed remote JSON POST containing both hostname and whoami is host-profile
  # exfiltration. Requiring the executed whoami producer keeps ordinary product
  # telemetry and diagnostic JSON records out of this hostile conclusion.
  - id: node-host-user-json-http-exfil
    desc: Node exfiltrates host and user via JSON POST
    conf: 0.98
    attack: T1041,T1082,T1033
    mbc: E1041
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/discovery/system/fingerprint/user::small-node-host-user-query
      - id: objectives/discovery/system/profile::js-hostname-whoami-json-object
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/

  - id: javascript-xor-host-profile-http-exfil
    desc: XOR-hidden HTTP exfiltrates host and user
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/discovery/system/fingerprint/user::node-host-user-query-pair
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/process/io/stream::javascript-write-then-end-stream
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
