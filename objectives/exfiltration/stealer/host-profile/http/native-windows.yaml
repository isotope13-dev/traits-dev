defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: native-host-profile-network-beacon
    desc: Native host profile with dynamic network transport
    crit: hostile
    conf: 0.99
    attack: T1082,T1033,T1071.001
    mbc: E1082,C0002
    all:
      - id: micro-behaviors/os/env/vars/system-info::native-host-identity-marker-cluster
      - id: micro-behaviors/communications/http/client/winhttp::native-winsock-transport-cluster
      - id: micro-behaviors/os/module/load::get-proc-address-import
