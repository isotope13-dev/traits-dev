# Runtime npm code that posts a local interface address and credential-like
# configuration fields to a fixed external controller is host-profile and
# credential exfiltration, not ordinary package telemetry.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: "T1195.002,T1041,T1016"
  mbc: E1041

composite_rules:
  - id: npm-runtime-host-profile-credential-exfil
    desc: npm runtime posts host profile and credential configuration externally
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::has-exports-field
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/os/network/interface::node-local-ip-selection
      - id: micro-behaviors/os/env/vars/credentials::service-credential-env-var
