defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1082,T1041
  mbc: E1082

# The hardware resource fields themselves (cpu/memory/disk/gpu dict keys) are
# neutral config syntax and live in
# micro-behaviors/os/sysinfo/hardware/resource-fields.yaml; the composites
# below reference them cross-directory and add the exfil context.
traits:
  - id: python-profile-api-call
    desc: Python profile API call
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: _aigc_post

composite_rules:
  - id: python-remote-host-profile-reporting
    desc: Remote Python host profile reporting
    crit: hostile
    conf: 0.98
    for: [whl]
    scope: archive
    all:
      - id: metadata/file/string/telemetry::device-id-field-python
      - id: micro-behaviors/os/sysinfo/hostname::python-host-name-mapping-call
      - id: micro-behaviors/os/sysinfo/hardware::python-hardware-resource-field
      - id: python-profile-api-call
      - id: objectives/command-and-control/backdoor/tasking/command-polling::python-remote-widget-task-worker
      - id: micro-behaviors/communications/http/request/client::request-python
