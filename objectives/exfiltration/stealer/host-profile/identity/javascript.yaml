defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1592.004

traits:
  # Count distinct identity fields, not repeated occurrences of one generic
  # property. Generated UI bundles commonly contain many `path` keys but do
  # not thereby collect a host profile.
  - id: js-host-profile-identifier-field
    desc: JavaScript host identifier field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']identifier["'']\s*:'

  - id: js-host-profile-user-field
    desc: JavaScript host user field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']user["'']\s*:'

  - id: js-host-profile-path-field
    desc: JavaScript host path field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']path["'']\s*:'

  - id: js-host-profile-hostname-field
    desc: JavaScript host hostname field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']hostname["'']\s*:'

  - id: js-host-profile-domain-field
    desc: JavaScript host domain field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']domain["'']\s*:'

composite_rules:
  # A host-profile object that contains four distinct identity/location fields
  # is stronger evidence than any one generic property name. Require the
  # fields to occur in one bounded source window: large bundles routinely use
  # these names in unrelated UI/property tables.
  - id: js-host-profile-identity-bundle
    desc: JavaScript host identity field bundle
    crit: suspicious
    conf: 0.96
    needs: 4
    near_bytes: 4096
    any:
      - id: js-host-profile-identifier-field
      - id: js-host-profile-user-field
      - id: js-host-profile-path-field
      - id: js-host-profile-hostname-field
      - id: js-host-profile-domain-field
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: obfuscated-vscode-host-profile-identity-beacon
    desc: Obfuscated VS Code host identity collection
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1592.004
    mbc: E1071
    all:
      - id: js-host-profile-identity-bundle
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
      - id: micro-behaviors/data/source/dynamic/load::node-computed-require-call
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
