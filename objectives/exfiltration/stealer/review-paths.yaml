composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - '!batch'
  - '!jcl'
  - '!vbs'
  - csharp
  - elf
  - macho
  - pe
  crit: suspicious
  conf: 0.99
  mbc: OB0003
  attack: T1555.003,T1041,T1070.004
  id: silent-headless-browser-credential-exfil
  desc: Script attempts to upload a browser login file then remove a profile
  all:
  - id: objectives/credential-access/browser/chromium::silent-headless-browser-profile
  - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
  - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
  - id: micro-behaviors/communications/http/upload::multipart-http-upload
  - id: micro-behaviors/fs/delete/directory::recursive-delete
  unless:
  - id: well-known/lib/platform/browser-automation/
  - id: micro-behaviors/process/create/flags::chromium-automation-launch-flags
  - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-workflow
