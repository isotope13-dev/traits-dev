composite_rules:
- platforms:
  - unix
  for:
  - ruby
  attack: T1041
  id: ruby-credential-http-export
  desc: HTTP POST with Discord or keychain secrets
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/post::net-http-post
  any:
  - id: micro-behaviors/fs/path/app-data::ruby-chromium-leveldb-path
  - id: micro-behaviors/os/security/keychain::macos-keychain-dump-command
  needs: 1
