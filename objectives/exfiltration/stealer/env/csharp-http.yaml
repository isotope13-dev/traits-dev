# C# environment credential theft that exfiltrates over System.Net.Http.
defaults:
  platforms: [unix, windows]
  for: [csharp]
  attack: T1552.001,T1041

composite_rules:
  - id: csharp-filtered-env-http-post-exfil
    desc: C# HTTP POST exfiltrates filtered env secrets
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/exfiltration/http/collect::csharp-env-secret-filter
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/communications/http/client/managed::postasync

  - id: csharp-vm-gated-env-http-exfil
    desc: C# skips analysis hosts then POSTs env harvest
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/exfiltration/http/collect::csharp-env-secret-filter
      - id: micro-behaviors/communications/http/client/managed::postasync
    any:
      - id: micro-behaviors/os/sysinfo/processor::dotnet-processor-count-threshold
      - id: micro-behaviors/os/sysinfo/virtualization::dotnet-vm-hostname-markers
    needs: 1
