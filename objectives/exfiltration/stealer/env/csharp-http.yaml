# C# environment credential theft that exfiltrates over System.Net.Http.
defaults:
  platforms: [unix, windows]
  for: [csharp]
  attack: T1552.001,T1041

composite_rules:
  # The matcher proves co-occurrence within one file (filtered env collection
  # plus an HTTP POST channel), not that the filtered values reach the
  # request; the descs below say "paired", never "exfiltrated".
  - id: csharp-filtered-env-http-post-exfil
    desc: C# HTTP POST paired with filtered env collection
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/enumeration::dotnet-env-secret-filter
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/communications/http/client/managed::postasync

  - id: csharp-vm-gated-env-http-exfil
    desc: C# gates env collection and HTTP POST on analysis-host check
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/enumeration::dotnet-env-secret-filter
      - id: micro-behaviors/communications/http/client/managed::postasync
    any:
      - id: micro-behaviors/os/sysinfo/processor::dotnet-processor-count-threshold
      - id: micro-behaviors/os/sysinfo/virtualization::dotnet-vm-hostname-markers
    needs: 1
