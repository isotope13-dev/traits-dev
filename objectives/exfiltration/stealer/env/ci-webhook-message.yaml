defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552,T1567.004
composite_rules:
  - id: ci-token-webhook-message-export
    desc: GitHub environment token sent as webhook content
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/request/credentials::javascript-env-token-message-body
      - id: micro-behaviors/os/env/vcs::node-github-token-member
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
      - id: micro-behaviors/communications/http/webhook::discord-webhook-request-builder

  # Axios can receive a token through a local fallback variable, which the
  # direct process.env-to-body matcher cannot follow. The token-specific atom
  # binds the GitHub token to Axios data; the Discord API endpoint supplies the
  # exfiltration destination.
  - id: ci-token-axios-discord-export
    desc: GitHub token enters Axios data sent to Discord
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/credentials::javascript-fallback-token-axios-data
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
      - id: micro-behaviors/communications/http/request/client::axios-direct-call
    scope: file
    near_bytes: 1024
