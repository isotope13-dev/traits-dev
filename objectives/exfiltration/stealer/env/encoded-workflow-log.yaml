# Encoded bulk CI log output bypasses verbatim masking, but the environment
# is not guaranteed to contain secrets. The Actions file type supplies context.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: suspicious
  conf: 0.94
  attack: T1564.008

composite_rules:
  - id: gha-encoded-environment-log
    desc: Encoded environment log with Actions secrets
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
    any:
      - id: micro-behaviors/os/env/dump::gha-shell-encoded-environment-output
      - id: micro-behaviors/os/env/dump::gha-python-encoded-environment-output
      - id: micro-behaviors/os/env/dump::gha-node-encoded-environment-output
      - id: micro-behaviors/os/env/dump::gha-powershell-encoded-environment-output
