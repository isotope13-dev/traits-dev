defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

composite_rules:
  # GuardDog: Environment variable exfiltration
  - id: js-env-exfiltration
    desc: Environment variable exfiltration (JS)
    crit: hostile
    conf: 0.95
    size_max: 262144
    near_bytes: 4096
    all:
    - id: objectives/exfiltration/sensitive-data/source::js-sensitive-env-source
    - id: micro-behaviors/communications/http/request/client::http-client-usage
    any:
    - id: objectives/exfiltration/sensitive-data/source::js-env-secret-json-body
    - id: micro-behaviors/communications/http/request/credentials::js-env-token-to-fetch
    - id: micro-behaviors/communications/http/request/credentials::js-env-key-to-fetch
    - id: micro-behaviors/communications/http/post::axios-post-env-body
    unless:
    - id: metadata/build/
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
    downgrade:
      any:
      - id: metadata/signed/platform/
      - id: micro-behaviors/process/create/shell/bridge/
      - id: metadata/build/ci/github-actions::actions-sdk
