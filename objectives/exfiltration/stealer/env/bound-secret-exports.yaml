defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1041
composite_rules:
- id: raw-aws-keypair-native-http-body
  desc: Raw AWS keypair exported in HTTP body
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/http/request/credentials::raw-aws-keypair-native-http-body
- id: filtered-env-dictionary-http-body
  desc: Filtered secret environment exported by HTTP
  all:
  - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
  - id: micro-behaviors/communications/http/request/credentials::filtered-env-dictionary-http-body
- id: rust-developer-token-chat-body
  desc: Developer env token exported as chat body
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/http/request/credentials::rust-developer-token-chat-body
  for:
  - rust
- id: npm-token-native-chat-body
  desc: Registry token exported as chat message
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/http/request/credentials::javascript-env-token-native-chat-body
