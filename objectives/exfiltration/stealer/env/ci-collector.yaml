defaults:
  platforms: [linux, windows, macos]
  for: [github-actions]
composite_rules:
  - id: ci-secret-file-to-request-collector
    desc: CI secrets uploaded to request collector
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1041
    # One runtime witness binds source secret, both literal file identities,
    # and the actual upload destination. Ordinary artifact uploads do not match.
    all:
      - id: micro-behaviors/communications/http/upload::ci-secret-request-collector-flow
      - id: metadata/build/ci/secret::step-environment-secret-reference
