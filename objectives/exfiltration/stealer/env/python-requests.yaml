defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-full-environment-http-exfil
    desc: Python sends the full process environment to an external IP
    conf: 0.99
    attack: T1552.001,T1041
    near_lines: 20
    all:
      - id: micro-behaviors/os/env/enumeration::python-environ-dict
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/ip/literal::http-ip-url
