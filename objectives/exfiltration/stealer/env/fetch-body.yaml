traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - text
  id: fetch-serialized-env-body
  desc: Fetch includes serialized process environment
  crit: suspicious
  conf: 0.95
  if:
    type: tree-sitter
    kind: call
    regex: fetch\(.{0,120}JSON\.stringify\(process\.env\)
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/package/testing/presence/fixture::json-attack-payload-catalog-context
