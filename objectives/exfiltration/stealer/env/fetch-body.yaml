defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: fetch-full-environment-exfiltration
    desc: Fetch sends full environment in JSON body
    crit: suspicious
    conf: 0.98
    # Method and body belong to the same request, in either property order.
    # Other POSTs, log serialization and named env entries cannot supply a leg.
    if:
      type: tree-sitter
      query: |
        (
        [
        (call_expression function: (identifier) @fetch arguments: (arguments (_) (object (pair key: (property_identifier) @method value: (string (string_fragment) @verb)) (pair key: (property_identifier) @body value: (call_expression
          function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
          arguments: (arguments (member_expression object: (identifier) @process property: (property_identifier) @env)))))))
        (call_expression function: (identifier) @fetch arguments: (arguments (_) (object (pair key: (property_identifier) @body value: (call_expression
          function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
          arguments: (arguments (member_expression object: (identifier) @process property: (property_identifier) @env)))) (pair key: (property_identifier) @method value: (string (string_fragment) @verb)))))
        (call_expression function: (identifier) @fetch arguments: (arguments (_) (object (pair key: (property_identifier) @method value: (string (string_fragment) @verb)) (pair key: (property_identifier) @body value: (call_expression
          function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
          arguments: (arguments (object (pair value: (member_expression object: (identifier) @process property: (property_identifier) @env)))))))))
        (call_expression function: (identifier) @fetch arguments: (arguments (_) (object (pair key: (property_identifier) @body value: (call_expression
          function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
          arguments: (arguments (object (pair value: (member_expression object: (identifier) @process property: (property_identifier) @env)))))) (pair key: (property_identifier) @method value: (string (string_fragment) @verb)))))
        ]
        (#eq? @fetch "fetch") (#eq? @body "body")
        (#eq? @method "method") (#match? @verb "^(POST|PUT|PATCH)$")
        (#eq? @json "JSON") (#eq? @stringify "stringify")
        (#eq? @process "process") (#eq? @env "env")
        )
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
