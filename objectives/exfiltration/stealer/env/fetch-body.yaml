defaults:
  platforms: [unix, windows]
traits:
- for:
  - javascript
  - typescript
  - text
  id: fetch-serialized-env-body
  desc: Fetch body serializes the full Node environment
  crit: suspicious
  conf: 0.95
  if:
    type: tree-sitter
    kind: call
    # Covers a full env object nested in a JSON payload (for example
    # JSON.stringify({envs: process.env})) as well as direct stringify.
    # Keep the match local to one fetch call and require the process.env
    # object, not a single selected environment variable.
    regex: 'fetch\([\s\S]{0,700}JSON\.stringify\([\s\S]{0,220}process\.env\s*[,}]'
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/package/testing/presence/fixture::json-attack-payload-catalog-context
  - id: metadata/package/testing/
  - id: well-known/tool/detection/

composite_rules:
  - id: fetch-full-environment-exfiltration
    desc: Posts the full Node environment over HTTP
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1041"
    mbc: "E1552,E1041"
    all:
      - id: fetch-serialized-env-body
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
