defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001, T1041"

composite_rules:
- id: node-proc-env-aws-exfil
  desc: Node.js reads AWS credentials from /proc and exfiltrates
  crit: hostile
  conf: 0.98
  attack: T1552.007
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/fs/proc/info/path::process-var-environ
  any:
  - id: micro-behaviors/communications/http/url/domain::workers-dev-domain
  - id: objectives/supply-chain/recon-exfil/oast/env::oast-fun-url
  - id: micro-behaviors/communications/http/services/cloud::aws-api-endpoint
