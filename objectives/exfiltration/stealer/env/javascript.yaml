defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: js-secret-env-http-query-exfil
  desc: Sends a credential query while disabling TLS checks
  crit: hostile
  conf: 0.98
  attack: T1041,T1552.001
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/env/secret-name::credential-env-read
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/http/query::encoded-dynamic-url-query-value
  - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
- id: env-vars
  desc: Encoded environment-secret HTTP exfiltration
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/credentials::javascript-secret-http-content-candidate
  - id: objectives/credential-access/env/secrets/filtered-access::node-filtered-secret-scan
  - id: micro-behaviors/data/encode/base64/
  unless:
  - id: well-known/lib/network/node-edge/
  - id: well-known/lib/development/npm-semver::semver-class
  - id: micro-behaviors/os/env/read::node-debug-check
  - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
