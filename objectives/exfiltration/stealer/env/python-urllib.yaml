defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: hostile
  attack: T1552.001,T1041

composite_rules:
  - id: python-full-environment-urllib-exfil
    desc: Python sends full environment to an OOB collector
    conf: 0.99
    # Bind the inline snapshot to its opened Request, and require an actual
    # OOB destination argument rather than an unrelated endpoint reference.
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/client/initialize::python-urllib-oob-request-target
      - id: micro-behaviors/communications/http/request/json::python-environ-json-request-send
  - id: silent-python-environment-urllib-exfil
    desc: Python silently exfiltrates process environment
    conf: 0.99
    # The wrapper may suppress errors in a caller after the request helper;
    # require the concrete urlopen call and keep that sequence bounded.
    near_lines: 40
    all:
      - id: micro-behaviors/os/env/enumeration::python-environ-dict
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
    any:
      - id: micro-behaviors/communications/http/request/body::python-environment-http-body-flow
      - id: micro-behaviors/data/serialize/json::python-environ-json
      - id: micro-behaviors/os/env/enumeration::python-environment-snapshot-field
