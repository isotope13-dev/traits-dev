defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: hostile
  attack: T1552.001,T1041

composite_rules:
  - id: python-full-environment-urllib-exfil
    desc: Python sends full environment in urllib POST
    conf: 0.99
    near_lines: 35
    all:
      - id: micro-behaviors/os/env/enumeration::python-environ-dict
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
  - id: silent-python-environment-urllib-exfil
    desc: Python silently exfiltrates process environment
    conf: 0.99
    near_lines: 80
    all:
      - id: micro-behaviors/os/env/enumeration::python-environ-dict
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
