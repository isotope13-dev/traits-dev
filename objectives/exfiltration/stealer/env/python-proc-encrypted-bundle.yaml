# Both legs bind the dictionary through serialization; the upload leg also
# binds encryption to the POST body. A procfs read beside unrelated network
# traffic is insufficient. Neither endpoint nor chosen variable names matter.
defaults:
  platforms: [linux]
  for: [python]
composite_rules:
  - id: python-proc-environ-encrypted-upload
    desc: Process environments in encrypted secret upload
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/read/file/full::python-proc-environ-json-bundle
      - id: micro-behaviors/communications/http/upload::python-credential-dictionary-encrypted-post
