defaults:
  platforms: [windows, unix]
  for: [perl]
  attack: T1041

composite_rules:
  - id: perl-env-lwp-http-exfil
    desc: Perl env LWP HTTP exfil
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-useragent
      - id: objectives/credential-access/env/secrets/filtered-access::perl-env-credential-harvest
      - id: micro-behaviors/communications/http/post::perl-post-http-url
