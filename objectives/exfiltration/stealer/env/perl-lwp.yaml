defaults:
  platforms: [windows, unix]
  for: [perl]
  attack: T1041

composite_rules:
  - id: perl-env-lwp-http-exfil
    desc: Perl env LWP HTTP exfil
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    # The harvest leg alone only proves credential-named variables were read;
    # a file that computes a secrets mapping but posts unrelated host/user
    # telemetry never moves credentials. Require the harvested kind of content
    # to actually reach the POST sink so the verdict means exfiltration, not
    # co-occurrence of a grep and a request.
    all:
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-useragent
      - id: objectives/credential-access/env/secrets/filtered-access::perl-env-credential-harvest
      - id: micro-behaviors/communications/http/post::perl-post-http-url
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-post-env-content
