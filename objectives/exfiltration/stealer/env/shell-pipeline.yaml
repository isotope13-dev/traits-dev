# Transport and credential selection must overlap an actual source node.
# Zero-distance joining excludes separate pipelines, including separate
# commands on the same line. File-wide co-occurrence does not prove upload.
defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001,T1041"
  mbc: E1020

composite_rules:
  - id: env-secret-dump-piped-to-network-client
    desc: Uploads credential-filtered environment over HTTP
    crit: hostile
    conf: 0.96
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/request/credentials::shell-filtered-env-stdin-http-upload
      - id: micro-behaviors/os/env/pipeline::shell-env-credential-name-filter
    unless:
      - id: well-known/tool/detection/
      - id: metadata/build/ci/github-actions::action-testdata-path
      - id: metadata/file/naming::test-directory-component
      - id: metadata/package/testing/
  # Workflow `run:` steps are analysed as shell members, so the hostile
  # verdict for a CI step comes from env-secret-dump-piped-to-network-client
  # above, on the parsed pipeline. The former workflow-level rule matched
  # regexes over whole run scalars and fired on printed, heredoc'd and
  # redirected text; it was removed rather than kept alongside.

  # The sibling above requires a credential-name grep filter. This one covers
  # the unfiltered dump. The parsed pipeline must feed env/printenv directly
  # into curl's @- request body. Curl ignores stdin without that option.
  # A remote URL must overlap that pipeline, keeping unrelated commands and
  # loopback diagnostics out of the conviction.
  - id: env-full-dump-piped-to-network-client
    desc: Uploads entire environment as remote HTTP body
    crit: hostile
    conf: 0.95
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/request/credentials::shell-env-stdin-curl-upload
    any:
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
