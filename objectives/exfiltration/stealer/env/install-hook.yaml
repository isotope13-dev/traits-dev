# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


traits:
  - id: postinstall-proc-init-environ-read
    desc: postinstall reads init environment
    crit: suspicious
    conf: 0.96
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      substr: /proc/1/environ

