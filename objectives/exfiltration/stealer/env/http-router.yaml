defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  attack: T1041,T1071.001

composite_rules:
  # The source in either branch is environment data; `/router` is the channel.
  - id: credential-router-exfil
    desc: Credential harvest is sent to an HTTP router endpoint
    crit: hostile
    conf: 0.98
    attack: T1041,T1071.001,T1552.001
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/endpoint::router-endpoint-url
    any:
      - id: objectives/supply-chain/credential-theft/env::javascript-filtered-environment-exfil
      - id: objectives/exfiltration/stealer/env::python-environ-json-requests-exfil
