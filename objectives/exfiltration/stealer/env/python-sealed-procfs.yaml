# Local process-environment scraping is a distinct source from credential
# files. Require an established encrypted credential uploader in the same
# file; a procfs reader or a normal credential client alone cannot qualify.
defaults:
  platforms: [linux]
  for: [python]
  attack: T1552.001,T1041

composite_rules:
  - id: python-procfs-environ-sealed-secret-upload
    desc: Procfs environment read with RSA-sealed secret upload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/read/file/full::python-formatted-proc-environ-read
      - id: objectives/exfiltration/stealer/dev-secret::python-rsa-wrapped-dev-secret-upload
