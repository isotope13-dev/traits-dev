defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1041

composite_rules:
  - id: native-http-host-profile-exfil
    for: [elf, c]
    desc: Native HTTP host profile exfil
    all:
      - id: micro-behaviors/os/env/read::native-environ-reference
      - id: micro-behaviors/communications/http/upload::native-octet-stream-post

  - id: native-getenv-secrets-json-http-oob-exfil
    desc: Native secret env reads with JSON POST to OOB
    conf: 0.98
    for: [elf]
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/read::native-getenv
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/header/content-type::json-content-type-reference
      - id: micro-behaviors/communications/url/host::oob-dot-subdomain-host
    any:
      - id: micro-behaviors/os/env/cloud::aws-env-secret-vars
      - id: micro-behaviors/os/env/vcs::github-token-name-reference
      - id: micro-behaviors/os/env/secret-name::npm-docker-credential-var-name
      - id: micro-behaviors/os/env/cicd::github-actions-oidc-token-request-env
    needs: 2
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/cloud/aws-crt/
