defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1041

composite_rules:
  # Require native addon activation, detachment, credential sources and
  # serialized upload evidence in the same ELF; co-occurrence is not proven
  # data flow. Collector spelling is deliberately not required.
  - id: native-detached-addon-env-http-exfil
    desc: Detached Node addon pairs environment secrets with JSON HTTP upload
    for: [elf]
    scope: file
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/daemonize/detach::setsid-import
      - id: micro-behaviors/os/env/read::native-getenv
      - id: micro-behaviors/data/serialize/json::printf-json-string-member
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/message::printf-http-post-body
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/send::send-symbol
    needs: 2
    any:
      - id: micro-behaviors/os/env/secret-name::aws-env-secret-vars
      - id: micro-behaviors/os/env/secret-name::github-token-name-reference
      - id: micro-behaviors/os/env/secret-name::npm-docker-credential-var-name
      - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env

  - id: native-http-host-profile-exfil
    for: [elf, c]
    desc: Native HTTP host profile exfil
    all:
      - id: micro-behaviors/os/env/read::native-environ-reference
      - id: micro-behaviors/communications/http/upload::native-octet-stream-post

  - id: native-forked-node-addon-form-profile-exfil
    desc: Forked Node addon POSTs URL-encoded install profile to a direct IPv4
    for: [elf]
    scope: file
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/os/env/read::native-getenv
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
    any:
      - id: micro-behaviors/communications/ip/direct::external-ipv4-http-host-endpoint
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary

  - id: native-getenv-secrets-json-http-oob-exfil
    desc: Native getenv and multiple secret names with JSON POST and OOB host
    conf: 0.98
    for: [elf]
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/read::native-getenv
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/url/host::oob-dot-subdomain-host
    any:
      - id: micro-behaviors/os/env/secret-name::aws-env-secret-vars
      - id: micro-behaviors/os/env/secret-name::github-token-name-reference
      - id: micro-behaviors/os/env/secret-name::npm-docker-credential-var-name
      - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
    needs: 2
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/cloud/aws-crt/
      - id: native-detached-addon-env-http-exfil

  - id: native-forked-node-addon-form-env-http-exfil
    desc: Forked Node addon posts install context as form-urlencoded HTTP
    conf: 0.98
    for: [elf]
    scope: file
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/os/env/read::native-getenv
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    any:
      - id: micro-behaviors/os/env/secret-name::aws-env-secret-vars
      - id: micro-behaviors/os/env/secret-name::github-token-name-reference
      - id: micro-behaviors/os/env/secret-name::npm-docker-credential-var-name
      - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
      - id: micro-behaviors/os/env/package-manager::npm-install-profile-getenv-key-pair
    needs: 1
