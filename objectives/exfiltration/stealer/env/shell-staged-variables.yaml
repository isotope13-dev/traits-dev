defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: shell-credential-dump-encoded-file-upload
    desc: Credential variable dumps with encoded file upload
    crit: suspicious
    conf: 0.94
    attack: T1552.001,T1027,T1041
    # These operations share one shell script; file/path identity is not
    # established. Keep the co-occurrence claim suspicious, not hostile.
    all:
      - id: micro-behaviors/fs/write/credential::shell-multiple-credential-variable-writes
      - id: micro-behaviors/data/encode/base64::shell-base64-output-file
      - id: micro-behaviors/communications/http/upload::curl-named-file-body-upload-command

  # The analyzer joins only one shell step's explicit secrets.* bindings and
  # identical literal file paths across writes, Base64, and curl's @file body.
  # It rejects unrecognized commands and control-flow boundaries rather than
  # joining unrelated steps, paths or ordinary environment variables.
  - id: ci-secret-bound-encoded-upload
    desc: CI secret bindings are staged, encoded and uploaded through matched files
    crit: hostile
    conf: 0.99
    for: [github-actions]
    attack: T1552.001,T1041
    all:
      - id: metadata/build/ci/secret::step-environment-secret-reference
      - id: micro-behaviors/communications/http/upload::ci-secret-encoded-file-upload-flow
