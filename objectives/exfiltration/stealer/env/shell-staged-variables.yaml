defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: shell-credential-dump-encoded-file-upload
    desc: Credential variable dumps with encoded file upload
    crit: suspicious
    conf: 0.94
    attack: T1552.001,T1027,T1041
    # These operations share one shell script; file/path identity is not
    # established. Keep the co-occurrence claim suspicious, not hostile.
    all:
      - id: micro-behaviors/fs/write/credential::shell-multiple-credential-variable-writes
      - id: micro-behaviors/data/encode/base64::shell-base64-output-file
      - id: micro-behaviors/communications/http/upload::curl-named-file-body-upload-command
