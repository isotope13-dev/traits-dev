defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-base64-json-exfil-body
    desc: Base64-encoded JSON data field
    crit: notable
    conf: 0.92
    near_bytes: 512
    all:
      - id: micro-behaviors/data/format/json::node-json-data-field
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
  - id: node-full-environment-base64-http-exfil
    desc: Uploads full process.env as Base64 JSON over HTTP
    crit: hostile
    conf: 0.99
    attack: "T1552.001,T1041,T1132.001"
    mbc: "E1552,E1041"
    for: [javascript, typescript, npm, tar]
    all:
      - id: micro-behaviors/os/env/read::node-process-env-object-copy
      - id: node-base64-json-exfil-body
      - id: objectives/exfiltration/http/upload::node-upload-sink
  - id: node-process-env-http-exfil
    desc: Node process environment HTTP exfil
    crit: hostile
    conf: 0.98
    attack: "T1552.001, T1041"
    mbc: "E1552, E1041"
    all:
      - id: micro-behaviors/os/env/modify::node-process-env-object-assignment
      - id: objectives/exfiltration/stealer/dev-secret::node-custom-exfil-sink
