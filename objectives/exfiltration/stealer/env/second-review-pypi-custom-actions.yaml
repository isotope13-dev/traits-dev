composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  attack: T1020
  id: pypi-custom-install-env-exfil
  desc: PyPI custom install exfiltrates environment
  crit: hostile
  conf: 0.95
  mbc: E1041
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: micro-behaviors/communications/http/request/client::request-python
  any:
  - id: objectives/supply-chain/install-hook/dropper/setup::setup-computername-access
  - id: micro-behaviors/os/env/enumeration::python-environ-dict
