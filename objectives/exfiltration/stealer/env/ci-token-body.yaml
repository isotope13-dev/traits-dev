defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: ci-token-body-oob-upload
    desc: CI token, secret HTTP body, OOB endpoint
    crit: hostile
    conf: 0.98
    attack: T1041
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/ci-credentials::javascript-ci-token-env-access
      - id: micro-behaviors/communications/http/request/credentials::secret-http-request-flow
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/
