defaults:
  platforms: [unix, windows]
  for: [class]
composite_rules:
  - id: jagex-environment-credential-http-report
    desc: Jagex environment credentials serialized for HTTP export
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/os/env/secret-name::jagex-session-token-variable
      - id: micro-behaviors/os/env/read::jvm-getenv-method
      - id: micro-behaviors/os/security/auth/secret::env-credential-report-field
      - id: micro-behaviors/communications/http/post::java-post-method
      - id: micro-behaviors/communications/http/post::jvm-bytecode-do-output
      - id: micro-behaviors/os/security/auth/password::password-report-value
