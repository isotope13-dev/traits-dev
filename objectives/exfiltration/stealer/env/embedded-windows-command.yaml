defaults:
  platforms: [windows]
  for: [class, batch]
  attack: T1552.001,T1041
composite_rules:
  - id: jvm-secret-env-dump-http-upload
    desc: JVM executes an environment-secret dump and HTTP upload
    crit: hostile
    conf: 0.99
    for: [class]
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/env/enumeration::windows-shell-secret-env-filter
      - id: micro-behaviors/communications/http/upload::curl-temp-file-body-reference
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/process/create/shell/spawn::java-cmd-exe-c-arguments
