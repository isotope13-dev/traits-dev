defaults:
  platforms: [unix]
  for: [javascript]

traits:
  # Track the same key and report identifiers through the callback and the
  # immediately following upload. An unrelated curl or a different input
  # buffer cannot satisfy the relationship. No hostname or campaign token.
  - id: node-filtered-env-curl-stdin
    desc: Filtered environment reaches curl upload
    crit: suspicious
    conf: 0.98
    attack: T1552.001,T1048.003
    if:
      type: tree-sitter
      language: javascript
      query: |
        (statement_block
          (expression_statement
            (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression
                    object: (identifier) @object
                    property: (property_identifier) @keys)
                  arguments: (arguments . (member_expression
                    object: (identifier) @process
                    property: (property_identifier) @env) .))
                property: (property_identifier) @foreach)
              arguments: (arguments . (function_expression
                parameters: (formal_parameters . (identifier) @key .)
                body: (statement_block . (if_statement
                  condition: (parenthesized_expression (call_expression
                    function: (member_expression
                      object: (regex pattern: (regex_pattern) @filter)
                      property: (property_identifier) @test)
                    arguments: (arguments . (identifier) @tested .)))
                  consequence: (expression_statement
                    (augmented_assignment_expression
                      left: (identifier) @report
                      operator: "+="
                      right: (binary_expression
                        operator: "+"
                        right: (subscript_expression
                          object: (member_expression
                            object: (identifier) @process2
                            property: (property_identifier) @env2)
                          index: (identifier) @selected))))) .)) .)))
          . (try_statement body: (statement_block . (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier)
                property: (property_identifier) @exec)
              arguments: (arguments
                . (string (string_fragment) @command)
                . (object (pair
                  key: (property_identifier) @input
                  value: (identifier) @body)) .))) .))
          (#eq? @object "Object")
          (#eq? @keys "keys")
          (#eq? @process "process")
          (#eq? @env "env")
          (#eq? @foreach "forEach")
          (#eq? @test "test")
          (#match? @filter "TOKEN|SECRET|API_KEY|AWS_")
          (#eq? @key @tested)
          (#eq? @key @selected)
          (#eq? @process2 "process")
          (#eq? @env2 "env")
          (#eq? @exec "execSync")
          (#match? @command "^curl\\s+[^;|\\n]*--data-binary\\s+@-\\s+https?://")
          (#eq? @input "input")
          (#eq? @report @body))
