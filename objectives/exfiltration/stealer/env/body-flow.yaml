defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, go]
composite_rules:
  - id: credential-environment-http-body
    desc: Credential-bearing environment HTTP body flow
    crit: suspicious
    conf: 0.94
    attack: T1041
    all:
      - id: micro-behaviors/communications/http/request/body::environment-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::secret-http-request-flow
    any:
      - id: micro-behaviors/os/env/secret-name::javascript-credential-env-read
      - id: micro-behaviors/os/env/enumeration::os-environ
    unless:
      - id: micro-behaviors/os/env/cicd::go-hashed-ci-repo-telemetry
      # First-party GitHub API authentication: the workflow token goes
      # in the Authorization header to api.github.com and the body
      # carries only repository coordinates (the Python sibling leg
      # already excludes this host); no credential enters the body.
      - id: micro-behaviors/communications/http/services/github::github-api-host
      # A release tool installs its own provider tokens as CI variables on
      # that provider's API. The destination is the account those tokens
      # already administer.
      - id: micro-behaviors/communications/http/services/cloudflare::cloudflare-api-host
      # Telegram Bot API client sending bot notifications: the bot token
      # authenticates to api.telegram.org and the body carries notification text.
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
