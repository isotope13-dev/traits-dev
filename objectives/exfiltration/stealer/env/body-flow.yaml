defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, go]
composite_rules:
  - id: credential-environment-http-body
    desc: Credential-bearing environment HTTP body flow
    crit: suspicious
    conf: 0.94
    attack: T1041
    all:
      - id: micro-behaviors/communications/http/request/body::environment-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::secret-http-request-flow
    any:
      - id: micro-behaviors/os/env/secret-name::javascript-credential-env-read
      - id: micro-behaviors/os/env/enumeration::os-environ
