defaults:
  attack: T1567
  platforms: [unix, windows, macos]
  for: [php]

composite_rules:
  - id: php-filtered-env-curl-exfil
    desc: PHP sends filtered environment secrets by cURL
    crit: hostile
    conf: 0.99
    attack: T1041,T1552.001
    mbc: E1041
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::php-env-credential-harvest
      - id: micro-behaviors/data/serialize/json::php-json-encode
      - id: micro-behaviors/communications/http/curl::post-data
      - id: micro-behaviors/communications/http/curl::exec
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
  - id: aws-credential-access-exfil-file-get-contents
    desc: Exfiltration of AWS credentials via file_get_contents
    crit: hostile
    conf: 1.0
    all:
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
      - id: objectives/credential-access/env/secrets/cloud-access::aws-access-key-dup
      - id: objectives/credential-access/env/secrets/cloud-access::aws-secret
      # micro-behaviors/os/env/read::getenv is the C symbol/function-call
      # match (for: [c, cpp, elf, pe]); php-getenv-call is this file's own
      # already-used PHP equivalent (env-exfil-via-http-interpolation below).
      - id: micro-behaviors/os/env/read::php-getenv-call
  - id: env-exfil-via-http-interpolation
    desc: Potential exfiltration of environment variables via HTTP URL interpolation
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url-interpolation
      - id: micro-behaviors/os/env/read::php-getenv-call
  # php-env-curl-exfil lived here as a second hostile with the same four legs
  # (narrower window, lower conf, no scope): every file it matched also
  # matched php-filtered-env-curl-exfil above, so it was pure duplication.
  # Removed; the survivor carries the testing/signed carve-outs.
