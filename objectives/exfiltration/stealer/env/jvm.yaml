defaults:
  platforms: [unix]
  for: [java, kotlin, class, java_class, jar]
  attack: T1041

composite_rules:
  - id: jvm-env-secret-http-exfil
    desc: JVM env secret HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::jvm-env-secret-key-filter
      - id: objectives/exfiltration/http/collect::jvm-collect-octet-post
