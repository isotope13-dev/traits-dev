defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1041

composite_rules:
  - id: php-submitted-password-file-dump
    desc: PHP stores submitted password data
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/credential::php-file-dumps-submitted-password
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field

  - id: php-mail-credential-phish
    desc: PHP mails captured credentials
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: micro-behaviors/communications/email/send/mail-func::mail-call
    any:
      - id: objectives/credential-access/phishing/kit/source::php-post-challenge-response-fields
      - id: objectives/credential-access/phishing/kit/source::php-phish-result-banner
  - id: php-redirecting-credential-phish
    desc: PHP credential phish redirect
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: micro-behaviors/communications/http/response::php-location-redirect
    any:
      - id: objectives/credential-access/phishing/kit/source::php-post-challenge-response-fields
      - id: objectives/credential-access/phishing/kit/source::php-phish-result-banner

  - id: php-archives-target-credentials
    desc: PHP archives submitted password data
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/credential::php-file-dumps-submitted-password
      - id: micro-behaviors/data/archive/create/zip::php-ziparchive-create
    near_bytes: 4096
    unless:
      - id: well-known/app/publishing/mainwp::child-plugin-archive-context

  - id: php-credential-dump-remote-unserialize
    desc: PHP credential dump also deserializes remote data
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/write/credential::php-file-dumps-submitted-password
      - id: micro-behaviors/data/serialize/object::remote-unserialize

  - id: php-credentials-zipped-for-download
    desc: PHP serves archived passwords for download
    crit: hostile
    conf: 0.99
    all:
      - id: php-archives-target-credentials
      - id: micro-behaviors/communications/http/download/handler::php-content-disposition-readfile

  - id: php-card-mail-phish
    desc: PHP mails captured payment card data
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/financial/credit-card/form-capture::php-post-card-number-fields
      - id: objectives/credential-access/financial/credit-card/form-capture::php-post-card-secret-fields
      - id: objectives/exfiltration/messaging/email::php-card-info-mail-subject
      - id: micro-behaviors/communications/email/send/mail-func::mail-call
    any:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: objectives/credential-access/phishing/credential::three-ds-password-field
      - id: objectives/credential-access/financial/credit-card/form-field::credit-card-form-fields
  - id: php-card-filedump-phish
    desc: PHP stores captured payment card data
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/financial/credit-card/form-capture::php-post-card-number-fields
      - id: objectives/credential-access/financial/credit-card/form-capture::php-post-card-secret-fields
      - id: objectives/credential-access/phishing/kit/source::php-card-dump-result-file
    any:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
