defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1041
composite_rules:
  - id: js-emailjs-credential-exfil
    desc: Password exfiltration through EmailJS
    crit: hostile
    conf: 0.98
    mbc: E1056
    all:
      - id: micro-behaviors/communications/http/services/emailjs::emailjs-send
      - id: micro-behaviors/communications/http/services/emailjs::js-emailjs-password-field
      - id: micro-behaviors/communications/http/services/emailjs::js-emailjs-email-field
    any:
      - id: micro-behaviors/communications/http/services/emailjs::js-emailjs-ip-field
      - id: objectives/discovery/host/geo::ip-geolocation-lookup
