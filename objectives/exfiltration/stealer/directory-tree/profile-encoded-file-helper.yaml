defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

traits:
- id: fullpath-base64-exfil
  desc: Exfiltred helper with path and Base64 names
  crit: component
  conf: 0.99
  if:
    type: text
    substr: exfiltred(fullPath + "/" + base64Content);
- id: fullpath-fileskipped-exfil
  desc: Exfiltred helper with skipped-file path
  crit: component
  conf: 0.97
  if:
    type: text
    substr: exfiltred(fullPath + "/FILESKIPPED");
