defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

  mbc: E1041
composite_rules:
- id: js-opt-recursive-content-exfil
  for:
  - javascript
  desc: JS recursively exfiltrates /opt content
  crit: hostile
  conf: 0.995
  attack: T1005
  all:
  - id: micro-behaviors/fs/directory/readdir/target::opt-root-explore-call
  - id: micro-behaviors/fs/directory/readdir/profile::async-recursive-opt-enum
  - id: metadata/file/profile/text-shape::challenge-word-extension-context
  - id: metadata/file/profile/transfer/http-upload/reference::fullpath-base64-exfil
  - id: micro-behaviors/communications/url/resource-path::xmasrootme-path
  any:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/read/file/full::read-text-utf8
  - id: micro-behaviors/data/encode/base64/primitive::tostring-base64
  needs: 2
- id: js-opt-path-and-content-exfil
  for:
  - javascript
  desc: JS exfils /opt paths and content
  crit: hostile
  conf: 0.995
  attack: T1041
  all:
  - id: micro-behaviors/fs/directory/readdir/target::opt-root-explore-call
  - id: micro-behaviors/fs/directory/readdir/profile::async-recursive-opt-enum
  - id: micro-behaviors/communications/url/resource-path::xmasrootme-path
  - id: metadata/file/profile/transfer/http-upload/reference::fullpath-base64-exfil
  - id: metadata/file/profile/transfer/http-upload/reference::fullpath-fileskipped-exfil
  any:
  - id: metadata/file/profile/text-shape::challenge-word-extension-context
  - id: metadata/lang/source/literal/string/label::scan-lifecycle-markers
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  needs: 2
