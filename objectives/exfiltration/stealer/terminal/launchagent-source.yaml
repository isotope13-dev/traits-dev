defaults:
  platforms: [macos]
  for: [scripts, source, class, java_class]
  attack: T1041,T1543.004

composite_rules:
  - id: launchagent-shell-history-upload
    desc: LaunchAgent uploads shell history periodically
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
      - id: objectives/credential-access/files/config::login-secret-file-paths--rx-7
      - id: micro-behaviors/communications/http/upload::curl-data-binary
