# Public file-host upload used as stealer loot drop, then the resulting
# download link is POSTed over cleartext HTTP to an operator webhook.
defaults:
  platforms: [unix, windows]
  for: [go, pe, scripts, source]
  attack: T1567.002,T1041
  mbc: E1010

traits:
  - id: gofile-uploadfile-endpoint
    desc: Gofile uploadfile API endpoint
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)upload\.gofile\.io/uploadfile'

  - id: gofile-download-link-prefix
    desc: Gofile public download-link prefix
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://gofile\.io/d/'

  - id: extract-keys-with-abe-symbol
    desc: Stealer symbol ExtractKeysWithABE
    crit: suspicious
    conf: 0.96
    if:
      type: text
      word: ExtractKeysWithABE

  - id: upload-gofile-bytes-symbol
    desc: Stealer symbol UploadGofileBytes
    crit: suspicious
    conf: 0.95
    if:
      type: text
      word: UploadGofileBytes

  - id: send-log-webhook-symbol
    desc: Stealer symbol SendLogWebhook
    crit: suspicious
    conf: 0.94
    if:
      type: text
      word: SendLogWebhook

composite_rules:
  - id: gofile-upload-cleartext-webhook
    desc: Uploads loot to Gofile then POSTs the link over HTTP
    crit: hostile
    conf: 0.98
    all:
      - id: gofile-uploadfile-endpoint
      - id: gofile-download-link-prefix
      - id: micro-behaviors/communications/http/post::http-post
    any:
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url-code-literal

  - id: abe-stealer-gofile-exfil
    desc: ABE key theft symbols with Gofile upload exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: extract-keys-with-abe-symbol
      - id: upload-gofile-bytes-symbol
      - id: gofile-uploadfile-endpoint
    any:
      - id: send-log-webhook-symbol
      - id: objectives/credential-access/browser/chromium::abe-helper-dll-patch-template
