defaults:
  platforms:
  - unix
  attack: T1195.002,T1041,T1083
traits:
- id: npm-postinstall-decodes-node-destination
  desc: Postinstall decodes upload destination
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /["']postinstall["']\s*:\s*["'][^"\n]{0,300}base64\s+-d\s*\|\s*xargs\s*-I\{\}\s+node\s+[^\s"']+/
        condition:
          (
            $b0_0
          )
      }
- id: node-argument-curl-package-upload
  desc: Uploads package to argument-supplied endpoint
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /process\.argv\s*\[\s*2\s*\]/s
          $b0_1 = /package\.json/s
          $b0_2 = /curl\s+-X\s+POST/s
          $b0_3 = /file[^\n]{0,200}@/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1500 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 2000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 200 and
                    true
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-decoded-destination-package-upload
  desc: Postinstall sends package manifests to encoded destination
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: npm-postinstall-decodes-node-destination
  - id: node-argument-curl-package-upload
