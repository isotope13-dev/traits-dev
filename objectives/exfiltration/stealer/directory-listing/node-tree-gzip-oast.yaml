defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1083,T1041

traits:
  - id: node-tree-gzip-oast-post
    desc: Streams home tree listing to callback
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (object_pattern (shorthand_property_identifier_pattern) @spawn)
            value: (call_expression function: (identifier) @require_spawn arguments: (arguments (string (string_fragment) @child_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @https
            value: (call_expression function: (identifier) @require_https arguments: (arguments (string (string_fragment) @https_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @zlib
            value: (call_expression function: (identifier) @require_zlib arguments: (arguments (string (string_fragment) @zlib_module)))))
          (function_declaration name: (identifier) @fn body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @tree_process value: (call_expression function: (identifier) @spawn_use
              arguments: (arguments (string (string_fragment) @tree) (array (string (string_fragment) @home) (string (string_fragment) @all))))))
            (lexical_declaration (variable_declarator name: (identifier) @gzip value: (call_expression
              function: (member_expression object: (identifier) @zlib_use property: (property_identifier) @create_gzip))))
            (lexical_declaration (variable_declarator name: (identifier) @options value: (object
              (pair key: (property_identifier) @host_key value: (string (string_fragment) @host))
              (pair key: (property_identifier) @method_key value: (string (string_fragment) @method)))))
            (lexical_declaration (variable_declarator name: (identifier) @req value: (call_expression
              function: (member_expression object: (identifier) @https_use property: (property_identifier) @request)
              arguments: (arguments (identifier) @options_use))))
            (expression_statement (call_expression function: (member_expression
              object: (call_expression function: (member_expression
                object: (member_expression object: (identifier) @tree_use property: (property_identifier) @stdout)
                property: (property_identifier) @pipe1) arguments: (arguments (identifier) @gzip_use))
              property: (property_identifier) @pipe2) arguments: (arguments (identifier) @req_use)))))
          (expression_statement (call_expression function: (identifier) @fn_use)))
          (#eq? @require_spawn "require")
          (#eq? @child_module "child_process")
          (#eq? @require_https "require")
          (#eq? @https_module "https")
          (#eq? @require_zlib "require")
          (#eq? @zlib_module "zlib")
          (#eq? @spawn "spawn")
          (#eq? @spawn @spawn_use)
          (#eq? @tree "tree")
          (#eq? @home "/home")
          (#eq? @all "-a")
          (#eq? @zlib @zlib_use)
          (#eq? @create_gzip "createGzip")
          (#eq? @host_key "hostname")
          (#match? @host "[.]oastify[.]com$")
          (#eq? @method_key "method")
          (#eq? @method "POST")
          (#eq? @https @https_use)
          (#eq? @request "request")
          (#eq? @options @options_use)
          (#eq? @tree_process @tree_use)
          (#eq? @stdout "stdout")
          (#eq? @pipe1 "pipe")
          (#eq? @pipe2 "pipe")
          (#eq? @gzip @gzip_use)
          (#eq? @req @req_use)
          (#eq? @fn @fn_use))

composite_rules:
  - id: npm-preinstall-tree-gzip-oast-post
    desc: Install streams home listing to callback
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-tree-gzip-oast-post
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
