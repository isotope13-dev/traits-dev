defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1083
  mbc: E1041

traits:
  - id: python-directory-listing-payload-label
    desc: Directory listing label in source text
    crit: component
    conf: 0.95
    if:
      type: text
      substr: 'Files in directory:'

  - id: python-directory-listing-message-label
    desc: Directory listing phrase in literal
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '(?i)(directory|folder) (list|content)|files in (the )?(directory|folder)'
      exclude_docstrings: true

  # Generic "list of files" wording appears in CLI help strings (e.g., argparse).
  # Keep it as a component so it only contributes inside the raw-socket composite.
  - id: python-file-list-phrase
    desc: File list phrase in string literal
    crit: component
    conf: 0.85
    attack: none
    mbc: none
    if:
      type: literal
      substr: list of files
      case_insensitive: true
      exclude_docstrings: true

composite_rules:
  - id: python-directory-listing-loopback-report
    desc: Reports a directory listing to a loopback socket
    crit: exception
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/ip/construct::loopback-address-call-argument

  - id: python-directory-listing-near-socket
    desc: Reports a directory listing near a socket connection
    crit: suspicious
    conf: 0.9
    scope: file
    near_bytes: 900
    unless:
      - id: python-directory-listing-loopback-report
    all:
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: python-directory-listing-message-label

  - id: python-directory-listing-socket-exfil
    desc: Sends a directory listing over a socket
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 900
    all:
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/socket/send/message::python-sendall
    any:
      - id: python-directory-listing-payload-label
      - id: python-directory-listing-message-label
      - id: python-file-list-phrase
