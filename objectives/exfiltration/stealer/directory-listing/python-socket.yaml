defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1005,T1041,T1083
  mbc: E1005,E1041

traits:
  # This label marks the content of the raw-socket payload. It is only a
  # component; the hostile finding also requires directory enumeration and
  # socket transmission in the same source file.
  - id: python-directory-listing-payload-label
    desc: Labels an outgoing directory listing
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: 'Files in directory:'

composite_rules:
  - id: python-directory-listing-socket-exfil
    desc: Sends a directory listing over a raw socket
    crit: hostile
    conf: 0.98
    for: [python]
    scope: file
    near_bytes: 700
    all:
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/socket/send/message::python-sendall
      - id: python-directory-listing-payload-label
