defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

composite_rules:
- id: meta-oastify-data-logs-exfil
  desc: Lifecycle hook exfils /data/logs to OASTify
  crit: hostile
  conf: 0.99
  attack: T1041
  mbc: E1041
  all:
  - id: micro-behaviors/fs/directory/readdir/command::package-data-logs-list-substitution
  - id: micro-behaviors/communications/url/host/oob/package::oastify-url
  any:
  - id: micro-behaviors/communications/http/curl/command::postinstall-curl-command-text
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/communications/http/request/package::meta-install-curl
  - id: micro-behaviors/communications/http/request/package::npm-test-script-curl
