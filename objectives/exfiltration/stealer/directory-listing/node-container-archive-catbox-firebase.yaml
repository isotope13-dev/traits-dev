defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1005,T1560.001,T1041
  mbc: E1041
traits:
- id: node-container-firebase-report
  desc: Posts container archive to Firebase
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: db-node-dmp-default-rtdb.asia-southeast1.firebasedatabase.app
composite_rules:
- id: node-container-archive-catbox-firebase-exfil
  desc: Uploads a container directory archive and reports its link and host IP
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - npm
  - zip
  - tar
  - javascript
  all:
  - id: micro-behaviors/fs/path/application/prefix::node-container-app-root-reference
  - id: micro-behaviors/data/archive/create/zip::node-container-files-added-to-zip
  - id: micro-behaviors/communications/http/services/file-hosting::catbox-moe
  - id: node-container-firebase-report
