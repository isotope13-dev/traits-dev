# Collects a container application's source and data, uploads an archive to
# Catbox, then reports the result to Firebase Realtime Database.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1005,T1560.001,T1041
  mbc: E1041

traits:
  - id: node-container-root-collection
    desc: References the container application root
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: /home/container

  - id: node-container-files-added-to-zip
    desc: Adds local files to zip archive
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'archive\.(file|glob)\s*\(|zip\.addFile\s*\('

  - id: node-container-firebase-report
    desc: Hardcoded Firebase Realtime Database host
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: db-node-dmp-default-rtdb.asia-southeast1.firebasedatabase.app

composite_rules:
  - id: node-container-archive-catbox-firebase-exfil
    desc: Uploads a container directory archive and reports its link and host IP
    crit: hostile
    conf: 0.995
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: node-container-root-collection
      - id: node-container-files-added-to-zip
      - id: micro-behaviors/communications/http/services/file-hosting::catbox-moe
      - id: node-container-firebase-report
