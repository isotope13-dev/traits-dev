defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1083,T1041
  mbc: E1041

traits:
  - id: python-directory-listing-message-label
    desc: Labels payload as a directory listing
    crit: suspicious
    conf: 0.9
    if:
      type: literal
      regex: '(?i)(directory|folder) (list|content)|list of files|files in (the )?(directory|folder)'
      exclude_docstrings: true

composite_rules:
  - id: python-directory-listing-raw-socket-exfil
    desc: Sends directory listing over raw TCP
    crit: hostile
    conf: 0.96
    scope: file
    near_bytes: 900
    all:
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/socket/send/message::python-sendall
      - id: python-directory-listing-message-label
