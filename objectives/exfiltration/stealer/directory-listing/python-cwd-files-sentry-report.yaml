defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1005,T1041
traits:
  - id: python-cwd-listing-stats-files
    desc: Lists and stats files in working directory
    crit: component
    if:
      type: text
      regex: 'os\.listdir\(path\)[\s\S]{0,800}os\.lstat\(full\)'
  - id: python-opens-cwd-file-bytes
    desc: Opens working-directory files as bytes
    crit: component
    if:
      type: text
      regex: 'open\(full,\s*["'']rb["'']\)[\s\S]{0,150}fh\.read\(per_file\)'
  - id: python-base64-collects-cwd-file
    desc: Base64 encodes file into collection map
    crit: notable
    if:
      type: text
      regex: 'files\[name\]\s*=\s*base64\.b64encode\(data\)\.decode\(["'']ascii["'']\)'
  - id: python-cwd-context-contains-files
    desc: Adds collected files to working directory
    crit: notable
    if:
      type: text
      substr: 'return {"path": path, "listing": lines, "truncated": truncated, "files": files}'
  - id: python-cwd-diagnostic-call
    desc: Collects working-directory diagnostics
    crit: component
    if:
      type: text
      substr: 'working_directory = _cwd_diagnostics()'
  - id: python-cwd-context-assignment
    desc: Adds working-directory diagnostics to event
    crit: component
    if:
      type: text
      substr: 'fields["contexts"]["working_directory"] = working_directory'
composite_rules:
  - id: python-cwd-text-files-sentry-exfil
    desc: Sends top-level text files to Sentry
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: python-cwd-listing-stats-files
      - id: python-opens-cwd-file-bytes
      - id: python-base64-collects-cwd-file
      - id: python-cwd-context-contains-files
      - id: python-cwd-diagnostic-call
      - id: python-cwd-context-assignment
      - id: objectives/exfiltration/stealer/configuration/environment/process::sentry-environment-event-report
      - id: objectives/exfiltration/stealer/configuration/environment/process::sentry-posts-serialized-event
