defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1005,T1041
traits:
  - id: python-cwd-listing-stats-files
    desc: Lists and stats files in working directory
    crit: notable
    if:
      type: text
      regex: 'os\.listdir\(path\)[\s\S]{0,800}os\.lstat\((full|os\.path\.join\(path,\s*name\))\)'
  - id: python-opens-cwd-file-bytes
    desc: Opens working-directory files as bytes
    crit: component
    if:
      type: text
      regex: 'open\(full,\s*["'']rb["'']\)[\s\S]{0,150}fh\.read\(per_file\)'
  - id: python-base64-collects-cwd-file
    desc: Base64 encodes file into collection map
    crit: notable
    if:
      type: text
      regex: 'files\[name\]\s*=\s*base64\.b64encode\(data\)\.decode\(["'']ascii["'']\)'
  - id: python-cwd-context-contains-files
    desc: Adds collected files to working directory
    crit: notable
    if:
      type: text
      substr: 'return {"path": path, "listing": lines, "truncated": truncated, "files": files}'
  - id: python-cwd-diagnostic-call
    desc: Collects working-directory diagnostics
    crit: component
    if:
      type: text
      substr: 'working_directory = _cwd_diagnostics()'
  - id: python-cwd-context-assignment
    desc: Adds working-directory diagnostics to event
    crit: notable
    if:
      type: text
      substr: 'fields["contexts"]["working_directory"] = working_directory'
  - id: python-process-tree-snapshot
    desc: Enumerates process names and parent IDs
    crit: notable
    if:
      type: text
      regex: 'os\.listdir\(proc_dir\)[\s\S]{0,700}open\(os\.path\.join\(proc_dir,\s*entry,\s*"stat"\)'
  - id: python-process-inventory-event-field
    desc: Adds process inventory to event context
    crit: notable
    if:
      type: text
      substr: 'fields["contexts"]["process_tree"] = process_tree'
  - id: python-report-environment-import
    desc: Reports diagnostics during package import
    crit: notable
    if:
      type: text
      substr: "report_environment()\nexcept Exception:"
composite_rules:
  - id: python-cwd-inventory-sentry-exfil
    desc: Sends working-directory inventory to Sentry
    crit: hostile
    conf: 0.98
    scope: file
    attack: T1083,T1041
    all:
      - id: python-cwd-listing-stats-files
      - id: python-cwd-diagnostic-call
      - id: python-cwd-context-assignment
      - id: objectives/exfiltration/stealer/configuration/environment/process::sentry-environment-event-report
      - id: objectives/exfiltration/stealer/configuration/environment/process::sentry-posts-serialized-event
  - id: python-import-process-and-directory-inventory-sentry
    desc: Import reports process and directory inventories to Sentry
    crit: hostile
    conf: 0.98
    scope: archive
    for: [whl, python]
    attack: T1083,T1057,T1041
    all:
      - id: python-cwd-listing-stats-files
      - id: python-cwd-context-assignment
      - id: python-process-tree-snapshot
      - id: python-process-inventory-event-field
      - id: python-report-environment-import
      - id: objectives/exfiltration/stealer/configuration/environment/process::sentry-posts-serialized-event
  - id: python-cwd-text-files-sentry-exfil
    desc: Sends top-level text files to Sentry
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: python-cwd-listing-stats-files
      - id: python-opens-cwd-file-bytes
      - id: python-base64-collects-cwd-file
      - id: python-cwd-context-contains-files
      - id: python-cwd-diagnostic-call
      - id: python-cwd-context-assignment
      - id: objectives/exfiltration/stealer/configuration/environment/process::sentry-environment-event-report
      - id: objectives/exfiltration/stealer/configuration/environment/process::sentry-posts-serialized-event
