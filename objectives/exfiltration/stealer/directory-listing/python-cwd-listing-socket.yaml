defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-directory-listing-in-report
    desc: Names directory listing in a report
    crit: component
    if:
      type: text
      case_insensitive: true
      exclude_comments: true
      regex: 'directory[^\n]{0,90}\{[A-Za-z_]\w*\}'

composite_rules:
  - id: python-cwd-listing-sent-over-socket
    desc: Sends a current-directory listing to a remote socket
    crit: hostile
    conf: 0.96
    attack: T1083,T1041
    scope: file
    all:
      - id: python-directory-listing-in-report
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/socket/send/message::python-sendall
