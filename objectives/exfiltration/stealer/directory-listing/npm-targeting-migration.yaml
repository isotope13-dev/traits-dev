defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  mbc: E1041
  attack: T1041
traits:
- id: node-home-tree-start-directory
  desc: Recursively targets the Node home tree
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: const START_DIR = '/home/node'
- id: node-recursive-listing-call
  desc: Directory listing recurses into children
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: await listDir(full, depth + 1, result)
- id: node-recursive-listing-call-results
  desc: Recurses while sharing results
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: await listDir(full, results)
- id: js-htb-flag-content-search
  desc: Searches for Hack The Box flags
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: HTB\{
- id: js-root-filesystem-ctf-search
  desc: Searches filesystem root for flags
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: const root = "/"
- id: js-json-object-post-end
  desc: Posts a JSON object
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: req\.end\(\s*JSON\.stringify\(\s*obj\s*\)\s*\)
- id: js-hardcoded-node-home-file-list
  desc: Targets fixed list of Node home files
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: 'const PATHS = \[[^\]]{0,400}\.(npmrc|git-credentials|ssh|bash_history)\b'
- id: js-spawn-ps-process-table
  desc: Spawns ps to collect process details
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: spawn('ps', ['-eo'
- id: node-package-source-enum-roots
  desc: Scans common Node project roots
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: const ROOTS = ['/home/node', '/home', '/usr/src/app']
- id: node-walk-and-extract-function
  desc: Defines project walk and extract function
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: function walkAndExtract(
- id: node-send-payload-function
  desc: Defines inventory payload sender
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: function send(payload)
- id: node-json-stringify-payload
  desc: Serializes payload with JSON.stringify
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: JSON.stringify(payload)
composite_rules:
- id: node-directory-profile-discord-webhook-exfil
  desc: Posts working-directory listing to Discord
  crit: hostile
  conf: 0.99
  for: [javascript]
  scope: file
  all:
  - id: micro-behaviors/fs/directory/readdir/language::node-cwd-query-near-sync-readdir
  - id: objectives/exfiltration/messaging/discord::node-discord-webhook-endpoint
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: objectives/exfiltration/stealer/directory-listing::node-json-stringify-payload

- id: node-package-source-enumerator
  desc: Walks projects to inventory imports
  crit: suspicious
  conf: 0.98
  near_bytes: 3200
  all:
  - id: node-walk-and-extract-function
  - id: metadata/lang/source/naming/module::node-require-pattern-name
  - id: metadata/lang/source/naming/module::node-import-pattern-name
