defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

  mbc: E1041
  attack: T1041
traits:
- id: node-home-tree-start-directory
  desc: Recursively targets the Node home tree
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "const START_DIR = '/home/node'"
- id: node-recursive-readdir-listing
  desc: Recursively enumerates directory entries
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: 'fsp.readdir(dir, { withFileTypes: true })'
- id: node-recursive-listing-call
  desc: Directory listing recurses into children
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: 'await listDir(full, depth + 1, result)'
- id: node-recursive-listing-call-results
  desc: Recurses while sharing results
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: 'await listDir(full, results)'
- id: js-home-tree-start-directory
  desc: Starts recursive scan at the home directory
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'const root = "/home"'
- id: js-htb-flag-content-search
  desc: Searches for Hack The Box flags
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: 'HTB\{'
- id: js-sync-node-home-tree-root
  desc: Scans inside the Node home directory
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: '/home/node'
- id: js-root-filesystem-ctf-search
  desc: Searches filesystem root for flags
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'const root = "/"'
- id: js-sync-recursive-directory-read
  desc: Reads directories synchronously
  crit: notable
  conf: 0.96
  if:
    type: symbol
    exact: fs.readdirSync
- id: js-stream-file-content-read
  desc: Streams local files
  crit: notable
  conf: 0.94
  if:
    type: symbol
    exact: fs.createReadStream
- id: js-json-object-post-end
  desc: Posts a JSON object
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "req\\.end\\(\\s*JSON\\.stringify\\(\\s*obj\\s*\\)\\s*\\)"
- id: js-build-recursive-filesystem-tree
  desc: Builds a recursive filesystem tree
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: 'function buildTree('
- id: js-hardcoded-node-home-file-list
  desc: Targets fixed list of Node home files
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'const PATHS = ['
- id: js-spawn-ps-process-table
  desc: Spawns ps to collect process details
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "spawn('ps', ['-eo'"
- id: node-package-source-enum-roots
  desc: Scans common Node project roots
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "const ROOTS = ['/home/node', '/home', '/usr/src/app']"
- id: node-walk-and-extract-function
  desc: Defines project walk and extract function
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'function walkAndExtract('
- id: node-package-dependency-keys
  desc: Enumerates manifest dependency keys
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'Object.keys(json.dependencies'
- id: node-send-payload-function
  desc: Defines inventory payload sender
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'function send(payload)'
- id: node-json-stringify-payload
  desc: Serializes payload with JSON.stringify
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: 'JSON.stringify(payload)'
composite_rules:
- id: node-package-source-enumerator
  for: [javascript]
  desc: Walks projects to inventory imports
  crit: suspicious
  conf: 0.98
  near_bytes: 3200
  all:
  - id: node-walk-and-extract-function
  - id: metadata/lang/source/syntax/declaration::js-require-or-pattern-text
  - id: metadata/lang/source/syntax/declaration::js-import-or-pattern-text
- id: node-package-dependency-inventory
  for: [javascript]
  desc: Collects package dependency and script data
  crit: suspicious
  conf: 0.98
  near_bytes: 300
  all:
  - id: node-package-dependency-keys
  - id: metadata/lang/source/syntax/declaration::pkg-devdependencies-word
- id: node-enumerator-webhook-json-send
  for: [javascript]
  desc: Sends collected inventory JSON to a webhook
  crit: suspicious
  conf: 0.98
  near_bytes: 3400
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
  - id: node-send-payload-function
  - id: node-json-stringify-payload
