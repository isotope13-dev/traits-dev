defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

  mbc: E1041
  attack: T1041
composite_rules:
- id: js-opt-recursive-filemap-exfil
  for:
  - javascript
  desc: JS exfiltrates /opt file map
  crit: hostile
  conf: 0.992
  all:
  - id: micro-behaviors/fs/directory/readdir/target::opt-root-explore-call
  - id: micro-behaviors/fs/directory/readdir/profile::async-recursive-opt-enum
  - id: metadata/lang/source/literal/string/label::fileskipped-path-marker
  - id: micro-behaviors/communications/url/resource-path/content::xmasrootme-path
  any:
  - id: metadata/lang/source/literal/string/label::scan-lifecycle-markers
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/path/filter::challenge-word-extension-context
  needs: 2
- id: npm-preinstall-dirlist-webhook-exfil
  desc: npm preinstall exfils directory listing
  crit: hostile
  conf: 0.995
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: metadata/import/builtin::require-child-process
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/fs/directory/readdir/command::ls-la-command-literal
  - id: micro-behaviors/data/serialize/json::json-content-exfil-body
  any:
  - id: micro-behaviors/process/create/shell/command-string::exec-cmd-timeout
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
  needs: 2
- id: js-dirlist-webhook-exfil
  desc: JavaScript exfils directory listing
  crit: hostile
  conf: 0.99
  for:
  - javascript
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: metadata/import/builtin::require-child-process
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/fs/directory/readdir/command::ls-la-command-literal
  - id: micro-behaviors/data/serialize/json::json-content-exfil-body
  any:
  - id: micro-behaviors/process/create/shell/command-string::exec-cmd-timeout
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
  needs: 2
- id: js-root-dirlist-http-exfil
  desc: JavaScript exfiltrates root directory listing over HTTP
  crit: hostile
  conf: 0.98
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
  - id: micro-behaviors/fs/path/reference::root-path-pair-array
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/post::request-options-post-method
  - id: micro-behaviors/communications/http/request/body/construction::req-write-postdata
