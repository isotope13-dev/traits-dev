defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-oob-recon-exfil-hostile
  desc: NPM package exfils recon data to OOB callback service
  crit: hostile
  conf: 0.95
  attack: T1041
  mbc: E1041
  all:
  - id: objectives/collection/file-targeting/enumeration::npm-oob-callback-recon
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  unless:
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-benign-bundle-context
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-cli-bundle-path
  - id: well-known/app/system/vsmux::vsmux-benign-bundle-context
  - id: well-known/app/system/vsmux::vsmux-vscode-extension
  - id: well-known/app/system/vsmux::vsmux-bundle-text
