# Detect Actions workflows that collect CI credentials and runner memory, then
# ship the staged data to a Telegram bot.
defaults:
  platforms: [unix, windows]
  for: [shell, github-actions]
  attack: T1552.001,T1003.007,T1041

traits:
  - id: actions-secrets-json-expression
    desc: Serializes all Actions secrets
    crit: notable
    if:
      type: text
      substr: 'toJSON(secrets)'
  - id: runner-process-memory-scan
    desc: Scans process memory through procfs
    crit: notable
    if:
      type: text
      substr: '/proc/%s/mem'
  - id: telegram-document-upload-endpoint
    desc: Targets Telegram document upload
    crit: component
    if:
      type: text
      substr: 'api.telegram.org/bot'

composite_rules:
  - id: actions-secret-runner-dump-telegram-exfil
    desc: Exfiltrates Actions secrets and runner memory
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/ci/github-actions::workflow-definition-path
      - id: actions-secrets-json-expression
      - id: runner-process-memory-scan
      - id: telegram-document-upload-endpoint
