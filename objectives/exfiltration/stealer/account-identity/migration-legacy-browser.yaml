defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
composite_rules:
- id: extension-verification-email-upload
  desc: Uploads verification email address
  crit: suspicious
  conf: 0.99
  attack: T1041,T1056.002
  scope: archive
  for:
  - crx
  - xpi
  - zip
  - chrome-manifest
  - javascript
  all:
  - id: metadata/file/format/browser-extension::web-extension-root-manifest
  - id: metadata/permission/host::broad-host-access
  - id: objectives/credential-access/phishing/mfa::extension-email-pin-verification-lure
  - id: objectives/credential-access/phishing/mfa::extension-verification-email-request
- id: extension-account-email-offsite-upload
  for:
  - javascript
  - typescript
  - crx
  - xpi
  - zip
  desc: Extension stages account email for encoded remote export
  crit: suspicious
  conf: 0.95
  attack: T1041,T1589.002
  scope: archive
  all:
  - id: metadata/lang/source/naming/account::account-email-field-reference
  - id: micro-behaviors/data/serialize/schema-object::passes-email-and-install-identity-payload
  - id: micro-behaviors/communications/http/request/body/construction::base64-post-carries-service-tagged-record
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  any:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
  - id: micro-behaviors/data/db/web-storage::chrome-storage-api
