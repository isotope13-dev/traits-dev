defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: objectives/exfiltration/stealer/account-identity::browser-intercepted-identity-http-exfil
  desc: Exfiltrates identity harvested from browser authentication responses
  crit: hostile
  conf: 0.99
  attack: "T1119,T1041"
  scope: archive
  for: [crx, xpi, zip, javascript]
  all:
  - id: objectives/credential-access/browser/account-page::browser-auth-response-identity-interception
  - id: micro-behaviors/data/property/assign::user-identity-field-assignment
  - id: micro-behaviors/communications/url/resource-path/collection::activity-api-route
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  unless:
  - id: metadata/path/directory::test-directory-component
- id: objectives/exfiltration/stealer/account-identity::browser-response-identity-http-exfil-file
  desc: Exfiltrates identity from hooked browser responses
  crit: hostile
  conf: 0.99
  attack: "T1119,T1041"
  scope: file
  all:
  - id: micro-behaviors/communications/http/intercept::fetch-hook
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/data/property/assign::user-identity-field-assignment
  - id: micro-behaviors/communications/url/resource-path/collection::activity-api-route
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  unless:
  - id: metadata/path/directory::test-directory-component
- id: objectives/exfiltration/stealer/account-identity::browser-response-identity-with-token-reference-http-exfil
  desc: Response identity export with access-token reference
  crit: hostile
  conf: 0.99
  attack: "T1119,T1041"
  scope: file
  all:
  - id: micro-behaviors/communications/http/token-auth::access-token
  - id: micro-behaviors/communications/http/intercept::fetch-hook
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/data/property/assign::user-identity-field-assignment
  - id: micro-behaviors/communications/url/resource-path/collection::activity-api-route
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  unless:
  - id: metadata/path/directory::test-directory-component
- id: objectives/exfiltration/stealer/account-identity::browser-auth-storage-identity-http-exfil
  desc: Exfiltrates identity harvested from browser auth stores
  crit: hostile
  conf: 0.99
  attack: "T1119,T1041"
  all:
  - id: objectives/credential-access/browser/account-page::browser-auth-storage-identity-scan
  - id: micro-behaviors/data/property/assign::user-identity-field-assignment
  - id: micro-behaviors/communications/url/resource-path/collection::activity-api-route
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  unless:
  - id: metadata/path/directory::test-directory-component
