defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: postinstall-source-rewrite-browser-identity-exfil
    for: [npm, package.json, javascript, typescript]
    desc: Postinstall source rewrite and browser identity exfiltration
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1119,T1041"
    scope: archive
    all:
      - id: micro-behaviors/fs/write/file/unspecified::postinstall-source-rewrite-clues
      - id: objectives/credential-access/browser/account-page::browser-auth-response-identity-interception
      - id: micro-behaviors/data/property/assign::user-identity-field-assignment
      - id: micro-behaviors/communications/url/resource-path/collection::activity-api-route
      - id: micro-behaviors/communications/http/request/verb::post-method-text
