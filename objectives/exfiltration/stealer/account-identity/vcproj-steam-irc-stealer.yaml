# Visual Studio project that builds a Steam account-info module next to an
# IRC client. Both legs come from the project manifest, not compiled code.
defaults:
  for: [xml]
  platforms: [windows]
  attack: T1041

traits:
  - id: vcproj-steam-info-module
    desc: Project builds a Steam account info module
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'steaminfo.cpp'

composite_rules:
  - id: vcproj-steam-irc-account-stealer
    desc: Steam account info module built with IRC client
    crit: hostile
    conf: 0.85
    mbc: B0030
    all:
      - id: vcproj-steam-info-module
      - id: micro-behaviors/communications/irc/client::vcproj-irc-client-module
