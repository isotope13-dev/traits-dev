defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: national-identity-number-field
    desc: Script names a national identity number field
    crit: notable
    conf: 0.85
    if:
      type: text
      # A quote or pipe before the name marks a field-name list or a regex
      # alternation (PII classifier tables), not a value holding a number.
      regex: '[^$\w"''|](userNIN|nationalId|national_id)\b|[{,]\s*nin\s*:|\{\s*nin\s*[,}]|\.nin\b'
  - id: national-identity-number-quoted-key
    desc: Object key names a national identity number
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '["''](national_id|nationalId)["'']\s*:'

composite_rules:
  # A browser extension that holds a national identity number and POSTs it in a
  # JSON body to a third-party API. Government-form autofill keeps the number local.
  - id: national-identity-number-json-post
    desc: Posts a national identity number to a remote JSON API
    crit: hostile
    conf: 0.95
    near_lines: 6
    all:
      - id: micro-behaviors/communications/http/request/json::json-body-post
    any:
      - id: objectives/exfiltration/stealer/account-identity::national-identity-number-field
      - id: objectives/exfiltration/stealer/account-identity::national-identity-number-quoted-key
    needs: 1
    unless:
      - id: metadata/path/directory::test-directory-component
    # Scanner packages hold national-ID field tables for PII classification and
    # post findings to user-configured webhooks; the package identity lowers
    # the composite one step instead of convicting it as a stealer.
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/detection/security-scanner-identity::agentic-security-package-context
