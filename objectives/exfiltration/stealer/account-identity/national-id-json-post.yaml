defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: national-identity-number-field
    desc: Script names a national identity number field
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(userNIN|nin|nationalId|national_id)\b'

composite_rules:
  # A browser extension that holds a national identity number and POSTs it in a
  # JSON body to a third-party API. Government-form autofill keeps the number local.
  - id: national-identity-number-json-post
    desc: Posts a national identity number to a remote JSON API
    crit: hostile
    conf: 0.95
    near_lines: 6
    all:
      - id: objectives/exfiltration/stealer/account-identity::national-identity-number-field
      - id: micro-behaviors/communications/http/request/json::json-body-post
    unless:
      - id: metadata/path/directory::test-directory-component
