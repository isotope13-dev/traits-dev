defaults:
  platforms: [qnx, unix]
  for: [python, pyc]
  attack: T1041

composite_rules:
  - id: qnx-pyc-host-profile-exfil
    desc: QNX pyc host profile exfil
    crit: hostile
    conf: 0.98
    for: [pyc]
    all:
      - id: micro-behaviors/os/sysinfo/network::pyc-network-connections-identifier
      - id: micro-behaviors/os/network/interface::ifconfig
      - id: objectives/exfiltration/http/report::qnx-pyc-sha256-exfil-header
      - id: micro-behaviors/communications/socket/send::python-sendall-pyc-name
