defaults:
  platforms: [freebsd, netbsd, unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-network-info-http-exfil
    desc: Swift network info HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/network/enumeration::swift-network-recon-payload
      - id: objectives/exfiltration/http/collect::rust-exfil-path-marker
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
  - id: swift-shell-route-exfil
    desc: Shell route dump posted over HTTP
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/network/interface::ifconfig
      - id: micro-behaviors/os/network/interface::ip-route-show
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/process/create/shell/runner::swift-shell-command-exec
