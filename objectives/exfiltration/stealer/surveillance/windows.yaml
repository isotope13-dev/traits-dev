# Windows PE Reconnaissance + Exfiltration Composites
# Combines system reconnaissance + data collection + exfiltration
# Covers native C/C++ recon modules (Aeternum, AgentTesla DLLs, etc.)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1041
composite_rules:
  - id: tor-proxy-screenshot-stealer
    desc: Screenshot stealer with Tor proxy exfil
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/data/encode/image/gdiplus::create-bitmap-from-hbitmap
      - id: micro-behaviors/dylib/library/family::libcurl-ref
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
      - id: micro-behaviors/communications/proxy/socks::socks5-string
    unless:
      - id: metadata/signed/platform/
  - id: tor-proxy-minidump-stealer
    desc: MiniDump stealer with screenshot and Tor
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/dump/process::minidump-admin-process-dump
      - id: tor-proxy-screenshot-stealer
    unless:
      - id: metadata/signed/platform/
  # Telegram-specific: screenshot + recon + Telegram bot.
  #
  # Hardened for the same reason as `recon-telegram-exfil` below, which it had
  # not inherited. The legs used to be `telegram-api-host` — a bare host string
  # that a URL validator or a user-configured notifier carries — plus
  # `gdi-bitblt`, a `baseline` text match on the word "BitBlt" that every
  # Windows GUI binary contains, plus a hostname lookup. Three things an
  # ordinary desktop application has for three unrelated reasons.
  #
  # A signed Electron IDE scored hostile on exactly that: the host string came
  # from the bundled grammY bot library under `resources/app.asar`, "BitBlt"
  # from the Chromium runtime in a different PE entirely, and the computer-name
  # lookup from a third file. Nothing in the composite required the collection
  # and the exfiltration to have anything to do with each other.
  #
  # So require a real send endpoint instead of the host string, a real encoded
  # capture instead of the raw blit, and `near_bytes` locality — a stealer
  # grabs the screen and ships it from the same routine, so those strings sit
  # together; unrelated subsystems spread across an application bundle do not.
  - id: recon-screenshot-telegram
    desc: System recon with screenshot and Telegram exfiltration
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
      - id: telegram-send-operation
      - id: objectives/collection/screenshot/capture::gdi-gdiplus-capture
    any:
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name
      - id: micro-behaviors/os/network/interface/
  # Generic: screenshot + recon + any HTTP exfil
  - id: recon-screenshot-exfil
    desc: System recon with screenshot and HTTP exfiltration
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/collection/screenshot/capture::gdi-gdiplus-capture
      - id: micro-behaviors/communications/http/post/
    any:
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name
      - id: micro-behaviors/os/network/interface/
      - id: micro-behaviors/process/enumerate/psapi/
    unless:
      - id: metadata/library/automation/
      - id: metadata/library/automation/
      - id: well-known/app/productivity/winmerge/
  - id: recon-screenshot-socket-exfil
    desc: System recon with screenshot and socket exfiltration
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/collection/screenshot/capture::gdi-gdiplus-capture
      - id: micro-behaviors/communications/socket/init::winsock-client-symbol-lifecycle
    any:
      - id: objectives/discovery/host/system::windows-binary-stealer-recon
      - id: objectives/discovery/host/geo::geo-api
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
    unless:
      - id: metadata/signed/platform/
  # Telegram text-only: recon + Telegram (no screenshot needed)
  #
  # `near_bytes` is what separates a stealer from an ordinary application that
  # merely offers Telegram notifications. Sending a message and querying the OS
  # are both legitimate on their own: media managers, backup tools and CI agents
  # all ship a user-configured Telegram notifier AND enumerate volumes, network
  # interfaces and processes as part of their normal job. Without a locality
  # constraint this composite fired hostile on any large binary that happened to
  # contain both subsystems anywhere in the same file (observed on the shipped
  # Sonarr.Common.dll of the official Sonarr installer, VT 0/67). A real stealer
  # collects the recon and ships it from the same routine, so the strings sit
  # together; unrelated subsystems in a multi-megabyte library do not.
  - id: recon-telegram-exfil
    desc: System reconnaissance with Telegram exfiltration
    crit: hostile
    conf: 0.93
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: telegram-send-operation
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/
      - id: micro-behaviors/os/network/interface/
      - id: micro-behaviors/process/enumerate/psapi/
      - id: micro-behaviors/fs/enumerate/volume::get-volume-info
  # A host string alone can be a URL validator or notification configuration.
  # Require an explicit Telegram message/file endpoint before treating recon
  # plus Telegram as exfiltration.
  - id: telegram-send-operation
    desc: Telegram API message or file send operation
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    any:
      - id: micro-behaviors/communications/messaging/send::chat-send-message
      - id: micro-behaviors/communications/messaging/send::chat-send-document
      - id: micro-behaviors/communications/messaging/send::chat-send-photo
  # A GUI tool can capture a screen while enumerating processes without being
  # a stealer. Require both image encoding and an upload here so this objective
  # represents actual screenshot exfiltration rather than framework imports.
  - id: surveillance-capture
    desc: Encoded screenshot with process enumeration and upload
    crit: notable
    conf: 0.9
    attack: T1113
    all:
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/process/enumerate/psapi/
      - id: micro-behaviors/data/encode/image/gdiplus::gdiplus-image-encode
      - id: micro-behaviors/communications/http/upload/
  - id: browser-focused-injection-surveillance
    desc: Browser-focused native injection with screenshot surveillance
    crit: hostile
    conf: 0.96
    attack: T1113
    all:
      - id: surveillance-capture
      - id: objectives/evasion/process/injection/dll::remote-thread-dll-injection-chain
      - id: objectives/anti-analysis/debugger-detect/hardware-breakpoints::suspect-browser-snapshot
    unless:
      - id: metadata/signed/platform/
      - id: metadata/library/automation/
      - id: well-known/lib/runtime/electron/

  # A custom raw-TCP stream protocol paired with screen encoding, process
  # inventory, locale profiling, and admin relaunch is a remote-surveillance
  # channel.  The protocol markers are structural lifecycle markers rather
  # than sample-specific URLs.
  - id: native-screen-streaming-surveillance-channel
    desc: Native screen streaming channel with host inventory and elevation
    crit: hostile
    conf: 0.99
    for: [pe]
    attack: T1041,T1057,T1113,T1548.002
    all:
      - id: objectives/command-and-control/backdoor/rat/control::stream-start-event-marker
      - id: objectives/command-and-control/backdoor/rat/control::server-approval-control-marker
      - id: micro-behaviors/hardware/display/screen::gdi-screen-capture-primitives
      - id: micro-behaviors/data/encode/image/gdiplus::gdiplus-image-encode
      - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
      - id: micro-behaviors/communications/socket/init::socket-api-ordinal
      - id: micro-behaviors/communications/socket/init::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::send-api-ordinal
      - id: micro-behaviors/communications/socket/init::recv-api-ordinal
      - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
      - id: objectives/discovery/system/locale::locale-and-environment-profiling
      - id: objectives/privilege-escalation/elevation-control/uac-bypass/relaunch::shell-execute-runas
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/

  # API hashing plus an opaque writable payload, clipboard access, temporary
  # staging, and GDI capture is a collection-loader profile. Requiring all
  # five legs keeps ordinary clipboard utilities and GUI applications below
  # hostile criticality.
  - id: windows-opaque-clipboard-surveillance-loader
    desc: Obfuscated Windows clipboard and screen surveillance loader
    crit: hostile
    conf: 0.98
    for: [pe]
    attack: T1027.007,T1113,T1115
    all:
      - id: objectives/anti-static/obfuscation/instruction/junk::dead-register-xor-churn
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
      - id: metadata/binary/section/metrics::large-high-entropy-writable-data-section
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/os/clipboard/access::win32-clipboard-access
      - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/
