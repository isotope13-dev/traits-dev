defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

composite_rules:
  - id: browser-av-recording-form-upload
    desc: Browser camera and microphone recording is uploaded as WebM form data
    crit: suspicious
    conf: 0.96
    attack: T1125,T1123,T1041
    mbc: B0028
    all:
      - id: micro-behaviors/hardware/display/camera::browser-media-capture-api
      - id: micro-behaviors/hardware/display/record::media-stream-recorder
      - id: micro-behaviors/hardware/display/record::media-recorder-data-handler
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/upload::media-webm-form-field
    any:
      - id: micro-behaviors/communications/http/body::js-fetch-post-body-variable
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_bytes: 4096
