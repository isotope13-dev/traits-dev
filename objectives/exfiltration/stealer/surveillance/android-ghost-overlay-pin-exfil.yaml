# The GhostX ghost-overlay buffers the intercepted UPI PIN and POSTs it to the
# C2 (api.cloudsettle[.]org/pin-data, tagged ghost_overlay). Pairing the
# capture mechanism with an HTTP request-body POST is the exfiltration leg:
# distinct from the collection objective, and keyed on the HTTP client, not the
# (dynamically swapped) destination host.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: "T1417.001,T1041"
  mbc: F0005

composite_rules:
  - id: ghost-overlay-pin-exfiltration
    desc: Ghost overlay PIN capture exfiltrated over HTTP
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/collection/keylog/capture::ghost-overlay-tap-interception
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
