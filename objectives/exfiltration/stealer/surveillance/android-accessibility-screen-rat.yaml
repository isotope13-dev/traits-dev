defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-call-log-socket-projection-rat
    desc: Call-log implant sockets captured screens
    crit: hostile
    conf: 0.95
    for: [dex]
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
      - id: micro-behaviors/os/user/lookup::android-dex-call-log-provider
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-manager
