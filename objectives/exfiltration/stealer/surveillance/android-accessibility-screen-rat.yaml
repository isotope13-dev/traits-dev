defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-a11y-screen-socket-rat
    desc: Accessibility RAT sockets captured screens
    crit: hostile
    conf: 0.95
    scope: outer
    for: [android_apk, zip, dex]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-screen-capture
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: android-accessibility-transaction-spyware
    desc: Android accessibility transaction spyware
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/collection/screenshot/capture::android-accessibility-screen-capture
      - id: objectives/command-and-control/backdoor/rat/control::android-transaction-control-protocol
    any:
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-persistent-id-collection
      - id: micro-behaviors/process/interpreter/webview::webview-js-bridge
  - id: android-transaction-account-spyware
    desc: Accessibility spyware reads accounts and transactions
    crit: hostile
    conf: 0.97
    for: [apk, zip, dex, xml]
    all:
      - id: objectives/collection/screenshot/capture::android-accessibility-screen-capture
      - id: objectives/command-and-control/backdoor/rat/control::android-transaction-control-protocol
      - id: objectives/credential-access/theft/file::android-account-store-path
  # A recording API can be legitimate. The combination below additionally
  # exposes paired SMS-operation tokens and dedicated remote-screen sender
  # fields inside a heavily randomized DEX namespace.
  - id: android-obfuscated-screen-sms-surveillance-rat
    desc: Obfuscated Android RAT captures screen/audio and controls SMS
    crit: hostile
    conf: 0.995
    for: [apk, zip, dex]
    attack: T1027,T1113,T1123,T1636.004
    all:
      - id: micro-behaviors/hardware/input/audio::android-media-recorder-reference
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-screen-capture
      - id: objectives/collection/messaging/sms::android-compact-sms-tokens
      - id: micro-behaviors/os/privilege/manifest::sms-manager-class
      - id: objectives/command-and-control/backdoor/rat/control::android-screen-sender-fields
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-wide-random-package-namespace
  # DEX string-pool copies of SEND_SMS are permission catalogs, not grants.
  # Pair real call-log / SmsManager APIs with sockets instead of that name.
  - id: android-call-log-socket-projection-rat
    desc: Call-log implant sockets captured screens
    crit: hostile
    conf: 0.95
    for: [dex]
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
      - id: micro-behaviors/os/user/lookup::android-dex-call-log-provider
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-manager
