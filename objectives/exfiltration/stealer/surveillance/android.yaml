defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1041,T1113

composite_rules:
  # Base64 is the transport encoding used by this profile. Requiring the
  # Accessibility screenshot API, a WebSocket client, and the strong namespace
  # anomaly avoids treating ordinary Base64 or screen-sharing code as theft.
  - id: android-obfuscated-accessibility-screen-channel
    desc: Accessibility screenshot WebSocket channel
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/hardware/display/screenshot::android-accessibility-screenshot-api
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-deep-long-package-namespace

  - id: android-dump-screenshot-obfuscated
    desc: Obfuscated APK dumps screen via accessibility
    crit: hostile
    conf: 0.96
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/display/screenshot::android-accessibility-screenshot-api
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-deep-long-package-namespace

  - id: android-admin-dump-screenshot
    desc: Device-admin APK dumps accessibility screenshots
    crit: hostile
    conf: 0.97
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::bind-device-admin
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/display/screenshot::android-accessibility-screenshot-api

  - id: android-obfuscated-accessibility-gesture-channel
    desc: Obfuscated accessibility gestures over WebSocket
    crit: hostile
    conf: 0.96
    for: [apk, zip, dex, xml]
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-api
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference

  - id: android-dump-accessibility-socket
    desc: DUMP permission with accessibility and sockets
    crit: hostile
    conf: 0.96
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference

  - id: android-dump-accessibility-gestures
    desc: DUMP permission with accessibility gesture APIs
    crit: hostile
    conf: 0.95
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-api
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
