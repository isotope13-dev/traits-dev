defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1041,T1113

composite_rules:
  # Base64 is the transport encoding used by this profile. Requiring the
  # Accessibility screenshot API, a WebSocket client, and the strong namespace
  # anomaly avoids treating ordinary Base64 or screen-sharing code as theft.
  - id: android-obfuscated-accessibility-screen-channel
    desc: Accessibility screenshot WebSocket channel
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/hardware/display/screen::android-accessibility-screenshot-api
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-deep-long-package-namespace
