defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1041,T1113

composite_rules:
  # Streaming both the rendered screen and its machine-readable Accessibility
  # tree, while accepting injected UI actions, is a remote-control implant
  # rather than ordinary screen sharing or an assistive reader.
  - id: android-obfuscated-accessibility-gesture-channel
    desc: Obfuscated accessibility gestures over WebSocket
    crit: hostile
    conf: 0.96
    for: [apk, zip, dex, xml]
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-api
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference

  - id: android-dump-accessibility-socket
    desc: DUMP permission with accessibility and sockets
    crit: hostile
    conf: 0.96
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference

  - id: android-dump-accessibility-gestures
    desc: DUMP permission with accessibility gesture APIs
    crit: hostile
    conf: 0.95
    for: [apk, zip, xml, dex]
    scope: archive
    all:
      - id: micro-behaviors/os/privilege/manifest::dump-permission
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-api
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
