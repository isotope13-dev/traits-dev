composite_rules:
- platforms:
  - freebsd
  - netbsd
  - unix
  for:
  - objc
  attack: T1041
  id: objc-bsd-credential-http-exfil
  desc: ObjC BSD credential HTTP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/files/config::objc-bsd-credential-sweep
  - id: micro-behaviors/communications/http/request/collect::objc-http-collect-post
  - id: micro-behaviors/communications/socket/send/content::objc-socket-body-buffer-send
  any:
  - id: micro-behaviors/data/format/json::nsjsonserialization-text
  - id: micro-behaviors/data/codec::nspropertylistserialization-text
  - id: micro-behaviors/communications/http/header/content-length::content-length-template
  - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
  - id: micro-behaviors/communications/socket/send/reference::send-symbol
  needs: 1
