defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: "T1041"

composite_rules:
- id: encoded-browser-surveillance-exfil
  desc: Encoded browser stealer with surveillance exfil
  crit: hostile
  conf: 0.99
  for: [data, whl, python-sdist]
  scope: archive
  attack: T1555.003,T1113,T1056.001,T1567.002,T1027.009
  all:
  - id: objectives/credential-access/browser/multi-target::encoded-browser-credential-targets
  - id: objectives/exfiltration/messaging/telegram::encoded-telegram-exfiltration
  any:
  - id: objectives/collection/monitor/capture::encoded-surveillance-collection
  - id: objectives/collection/clipboard/capture::encoded-clipboard-monitoring
- id: encoded-browser-credential-telegram-clipboard
  desc: Encoded browser credential stealer exfiltrates with clipboard monitoring
  crit: hostile
  conf: 0.99
  for: [data]
  scope: file
  attack: T1555.003,T1115,T1567.002,T1027.009
  all:
  - id: objectives/credential-access/browser/multi-target::encoded-browser-credential-targets
  - id: objectives/exfiltration/messaging/telegram::encoded-telegram-exfiltration
  - id: objectives/collection/monitor/capture::encoded-surveillance-collection
  - id: objectives/collection/clipboard/capture::encoded-clipboard-monitoring
