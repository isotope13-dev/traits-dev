defaults:
  crit: hostile
  platforms: [unix, netbsd]
  for: [javascript, typescript]
  attack: T1552.004

composite_rules:
- id: node-ssh-env-json-http-exfil
  desc: Node sends SSH files and filtered environment data over HTTP
  conf: 0.99
  attack: T1552.001,T1552.004,T1041
  mbc: E1552,E1041
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/directory/readdir/language::node-dot-ssh-readdir
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
  - id: micro-behaviors/communications/http/request/body/construction::node-request-payload-serialization
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-body

  # Package-wide source unions are appropriate here: a loop over several SSH
  # private-key names, readFile(), and an HTTPS POST are a credential-theft
  # constellation even when the TypeScript source is split across modules.
  - id: micro-behaviors/os/env/read::js-env-index-copy-to-object
