defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-encrypted-firefox-env-http-export
  desc: Encrypted Firefox stores and environment upload
  crit: hostile
  conf: 0.99
  attack: T1555.003,T1552.001,T1041
  near_bytes: 1
  scope: leaf
  all:
  - id: micro-behaviors/crypto/encrypt::python-firefox-logins-encryption
  - id: micro-behaviors/crypto/encrypt::python-firefox-key-store-encryption
  - id: micro-behaviors/crypto/encrypt::python-aes-encrypt-call
  - id: micro-behaviors/communications/http/upload::python-tar-buffer-http-helper
  - id: micro-behaviors/crypto/encrypt::python-environment-report-encryption
  unless:
  - id: metadata/lang/source/origin::plain-source-layer-path
