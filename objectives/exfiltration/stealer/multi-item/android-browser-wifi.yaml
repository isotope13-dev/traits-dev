defaults:
  platforms: [android, unix]
  for: [c, cpp, javascript, typescript, python, go]
  attack: T1555.003,T1552.001,T1041
  crit: hostile
  conf: 0.97

composite_rules:
  - id: android-browser-and-wifi-store-exfiltration
    desc: Uploads Android Chrome and Wi-Fi stores
    near_bytes: 4096
    all:
      - id: objectives/exfiltration/stealer/credential/browser-record::android-chromium-credential-store-read-upload
      - id: objectives/exfiltration/stealer/configuration::android-wifi-store-read-upload
      - id: micro-behaviors/fs/path/application/browser/storage::android-chromium-history-store-path
