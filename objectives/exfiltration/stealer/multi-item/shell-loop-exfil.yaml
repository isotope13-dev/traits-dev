defaults:
  platforms: [unix]
  for: [shell]
  attack: T1552.001,T1041

composite_rules:
  - id: shell-dotenv-ssh-key-loop-exfil
    desc: Shell exfiltrates dotenv and SSH private keys
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/exfiltration/stealer/configuration::shell-dotenv-loop-http-upload
      - id: objectives/exfiltration/stealer/credential/value/key::shell-private-key-loop-http-upload
