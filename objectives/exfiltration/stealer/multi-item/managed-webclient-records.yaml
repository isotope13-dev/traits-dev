  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
  - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
  - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
  - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
  - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
  - id: micro-behaviors/hardware/display/screen::screen-data-record-prefix
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
  - id: micro-behaviors/os/clipboard/reference::clipboard-data-record-prefix
  - id: micro-behaviors/data/format/string::file-data-record-prefix
  - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
