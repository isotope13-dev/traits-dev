defaults:
  platforms: [macos]
  for: [applescript, shell, javascript, typescript, python]

composite_rules:
  - id: phished-secret-staging-archive-upload
    # Required source classes and transport are separate roles. This is a
    # co-occurrence signature; it does not prove identical staging paths or
    # that the prompted password itself was saved or transmitted.
    desc: Password phish, secret copies and archive upload
    crit: hostile
    conf: 0.98
    attack: T1555.001,T1552.001,T1552.004,T1041
    all:
      - id: objectives/collection/file-copy/sensitive::phished-secret-store-copies
      - id: micro-behaviors/communications/http/upload::macos-archive-curl-upload-context
