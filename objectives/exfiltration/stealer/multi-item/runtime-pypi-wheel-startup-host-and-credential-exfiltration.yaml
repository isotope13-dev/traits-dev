defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: pypi-wheel-startup-host-and-credential-exfiltration
    desc: PyPI wheel startup hook exports environment and cloud credentials
    conf: 0.995
    for: [whl, python]
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/os/env/enumerate::python-environ-dict
      - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
      - id: micro-behaviors/communications/http/request/json::urllib-request-json-keyword-body
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/socket/send/message::python-sendall
      - id: micro-behaviors/data/serialize/json::json-dumps-call
