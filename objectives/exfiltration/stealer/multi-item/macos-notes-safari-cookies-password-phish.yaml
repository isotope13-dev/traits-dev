defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - binaries
  attack: T1041
composite_rules:
- id: macos-sensitive-store-password-exfil
  for:
  - source
  - applescript
  - javascript
  - lua
  - macho
  - perl
  - php
  - python
  - ruby
  - shell
  desc: macOS sensitive-store theft after password phishing
  crit: hostile
  conf: 0.99
  attack: T1005,T1041,T1056.002,T1555.003
  all:
  - id: objectives/credential-access/phishing/lure::password-phishing-comp
  - id: micro-behaviors/fs/path/personal::apple-notes-store
  - id: micro-behaviors/fs/path/cookie::safari-binary-cookies
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/fs/read/file/
