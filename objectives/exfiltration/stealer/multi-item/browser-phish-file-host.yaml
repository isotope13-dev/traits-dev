defaults:
  for: [binaries, scripts]
  platforms: [unix, windows]

composite_rules:
  # The findings co-occur in a file; they do not establish which bytes were sent.
  - id: phishing-browser-harvest-file-host-upload
    desc: Password phishing, browser theft, upload clues
    crit: hostile
    conf: 0.93
    attack: T1056.002,T1555.003,T1567.002
    scope: file
    all:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: objectives/credential-access/browser/multi-target::browser-cred-harvest
      - id: micro-behaviors/communications/http/form::multipart-form
    any:
      - id: micro-behaviors/communications/http/services/file-hosting::gofile-uploadfile-endpoint
      - id: micro-behaviors/communications/http/services/file-hosting::public-file-hosting-with-upload-evidence
