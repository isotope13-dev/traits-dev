defaults:
  platforms: [macos]
  for: [python]
  attack: T1552.004,T1555.001,T1041
composite_rules:
  - id: python-keychain-ssh-copies-curl-upload
    desc: Python copies SSH and login-keychain stores alongside a curl file upload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/copy::python-keychain-db-copy-binding
      - id: micro-behaviors/fs/write/file/copy::python-ssh-directory-copy-binding
      - id: micro-behaviors/process/create/shell/command-string::python-system-curl-file-upload-binding
