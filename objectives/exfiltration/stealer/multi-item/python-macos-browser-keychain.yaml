defaults:
  platforms: [macos]
  for: [python]
  attack: T1555.001,T1555.003,T1552.004,T1041

composite_rules:
  - id: python-macos-browser-keychain-http-stealer
    desc: Harvests macOS Keychain, browser, and SSH/cloud secrets via HTTP POST
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/fs/path/credential/password-store::macos-keychain-db-reference
      - id: micro-behaviors/fs/path/credential/password-store::browser-cookie-database-reference
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
      - id: micro-behaviors/communications/http/post::requests-post
    needs: 1
    any:
      - id: micro-behaviors/fs/path/credential/ssh::ssh-directory-literal
      - id: micro-behaviors/fs/path/credential/cloud::aws-config-directory-literal
      - id: micro-behaviors/fs/path/credential/cloud::gcloud-credentials
      - id: micro-behaviors/fs/path/credential/container::kube-config-path-components
