defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-host-identity-with-environment-export
  desc: Hostname sent with environment to OOB collector
  crit: hostile
  conf: 0.99
  attack: T1041,T1082
  mbc: E1041
  all:
  - id: objectives/exfiltration/stealer/configuration/environment::python-env-harvest
  - id: micro-behaviors/communications/http/telemetry::python-hostname-post-json-flow
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
