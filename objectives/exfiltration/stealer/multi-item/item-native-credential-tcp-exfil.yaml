defaults:
  platforms: [unix, appliance]
  for: [c, cpp, objc, elf]
  attack: T1041

composite_rules:
- id: native-credential-tcp-exfil
  for: [elf, c]
  desc: Native credential TCP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/serialize/envelope::native-exfil-value-length-frame
  - id: micro-behaviors/fs/proc/info/path::process-self-environ
  - id: micro-behaviors/os/privilege/paths::etc-shadow
  any:
  - id: micro-behaviors/communications/socket/send/reference::send-symbol
  - id: micro-behaviors/communications/socket/connect/attempt::connect
