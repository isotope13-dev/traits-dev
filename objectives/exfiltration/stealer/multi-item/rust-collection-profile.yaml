# These are source call names and configuration co-occurrences, rather than
# a proof that particular credentials reach an HTTP request body.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: suspicious
composite_rules:
  - id: rust-collection-embedded-key-profile
    desc: Rust collector calls with embedded SSH key
    conf: 0.96
    all:
      - id: micro-behaviors/communications/transfer::rust-collection-send-calls
      - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
