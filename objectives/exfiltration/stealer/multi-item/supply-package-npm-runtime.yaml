# NPM install-hook credential theft.
#
# Archive membership alone does not connect a lifecycle script to a payload.
# Environment exfiltration is reported by the canonical file-level traits in
# objectives/exfiltration/stealer/env, without duplicate hook wrappers.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, linux]
  for: [npm]
  attack: "T1195.002,T1552.001,T1552.004,T1041"
  mbc: E1552,E1041

composite_rules:
  - id: objectives/exfiltration/stealer/multi-item::npm-install-hook-multi-source-credential-exfil
    desc: NPM install hook exfiltrates files and filtered environment secrets
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/exfiltration/stealer/credential/file::credential-file-content-http-export
      - id: micro-behaviors/os/env/enumerate::js-object-entries-env
      - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/body/construction::request-end-body-call

  # The carrier archive holds the credential stealer while a lone, scoped,
  # commit-pinned optional dependency supplies the install-time trigger. The
  # dependency may fail and disappear after execution, so neither its alias nor
  # repository is stable enough to anchor detection.
  - id: objectives/exfiltration/stealer/multi-item::npm-install-hook-ssh-env-credential-exfil
    desc: NPM install hook exfiltrates SSH and environment credentials
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: objectives/exfiltration/stealer/multi-item::node-ssh-env-json-http-exfil
    any:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script

  # A package install hook that reads several developer/CI credential stores
  # and writes the result to a GitHub repository is the repository-backed
  # exfiltration shape described by the Mini Shai-Hulud article.  Keep the
  # credential-store legs generic so this remains useful when the targeted
  # npm/PyPI/cloud files or package names change.
  - id: objectives/exfiltration/stealer/multi-item::npm-install-hook-github-credential-exfil
    desc: NPM install hook uploads multiple credential stores to GitHub
    scope: archive
    attack: "T1195.002,T1552.001,T1041"
    for: [binaries, '!dex', scripts, '!jcl', c, go, java, kotlin, npm, package.json, rust]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/fs/read/file/content/unspecified::read-node
      - id: micro-behaviors/communications/http/services/github/repository::github-contents-api-write-flow
    any:
      - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
      - id: micro-behaviors/fs/path/token::cloud-credentials
      - id: micro-behaviors/fs/path/secret-config::orchestration-credentials
    needs: 2
    near_bytes: 8192

  # Retired npm-postinstall-chromium-gemini-web-cookie-hijack: archive-wide
  # cookie-client indicators do not establish theft or execution by the hook.
  # The lifecycle declaration and neutral cookie-client capability remain
  # separately visible; requiring both never supplied the missing call chain.
