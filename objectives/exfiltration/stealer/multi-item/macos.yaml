# A global event tap, pasteboard polling, screen capture, and a network upload
# form a macOS surveillance collector. The full set matters: Accessibility,
# screen recording, clipboard monitoring, and event taps each have legitimate
# uses in isolation.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1056.001,T1113,T1115,T1041

composite_rules:
  - id: macos-keyboard-clipboard-screen-exfiltration
    desc: macOS key, clipboard, and screen collection sent over the network
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/event::macos-cgevent-tap-create
      - id: micro-behaviors/os/clipboard/monitor::macos-pasteboard-change-count
      - id: micro-behaviors/hardware/display/screenshot::macos-screen-capture-api-import
    any:
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlsession-class
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: well-known/app/
      - id: well-known/tool/
      - id: metadata/signed/platform/
