# Each role requires an outbound body, not just a source name next to a POST.
# A full environment snapshot alone can be diagnostic reporting; combining it
# with an independently detected credential-file export supports theft.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
composite_rules:
  - id: environment-snapshot-and-credential-file-export
    desc: Exports full environment and credential-file contents
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041
    all:
      - id: objectives/exfiltration/stealer/credential/file::credential-file-content-http-export
    any:
      - id: objectives/exfiltration/stealer/configuration/environment::fetch-full-environment-direct
      - id: objectives/exfiltration/stealer/configuration/environment::fetch-full-environment-object-field
      - id: micro-behaviors/communications/http/request/body/environment::python-import-bound-environment-json-body
