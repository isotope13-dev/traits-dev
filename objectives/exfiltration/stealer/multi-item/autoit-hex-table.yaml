defaults:
  platforms:
  - windows
  for:
  - text
traits:
- id: autoit-hex-browser-wallet-telegram-profile
  desc: Encoded browser/wallet Telegram theft profile
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      rule autoit_hex_browser_harvest_telegram_profile {
        strings:
          $dpapi = "_CRYPTUNPROTECTDATA (" nocase
          $sqlite = "_SQLITE_GETTABLE2D" nocase
          $sql_password = "70617373776F72645F76616C7565" nocase
          $sql_from = "46524F4D206C6F67696E733B" nocase
          $telegram = "68747470733A2F2F6170692E74656C656772616D2E6F72672F626F74" nocase
          $document = "2F73656E64446F63756D656E74" nocase
          $write = "FileWrite" nocase
          $wallet = "5C456C65637472756D5C77616C6C657473" nocase
          $copy = "FileCopy" nocase
        condition:
          all of them
      }
  attack: T1555.003,T1567
composite_rules:
- id: autoit-decoded-browser-wallet-telegram-theft
  desc: Hex-decoding browser/wallet Telegram stealer
  crit: hostile
  conf: 0.99
  all:
  - id: autoit-hex-browser-wallet-telegram-profile
  - id: micro-behaviors/data/decode/hex::autoit-chr-dec-stringmid
