# A manifest that simultaneously declares a Windows credential decryptor,
# browser store readers, screen capture, archive staging, and multipart HTTP
# upload is a multi-source stealer stack, not ordinary tooling. Each declared
# role is individually dual-use, but their conjunction in one install unit has
# no legitimate purpose: nothing benign needs DPAPI decryption beside LevelDB
# and SQLite stores, screenshots, archiving, and file upload together.
# Dependency names are attacker-chosen, so the Steam, websocket, and Electron
# store legs corroborate in `any:` rather than gate in `all:`.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1552.001,T1113,T1560.001,T1041
  mbc: E1552,E1041

composite_rules:
  - id: npm-dpapi-browser-capture-archive-upload-stack
    desc: Manifest declares decryptor, browser stores, capture, staging, and upload deps
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/dependencies/crypto::npm-dep-primno-dpapi
      - id: metadata/package/dependencies/composition::npm-sqlite-dependency
      - id: metadata/package/dependencies/storage::npm-dep-level
      - id: metadata/package/dependencies/system::npm-dep-screenshot-desktop
      - id: metadata/package/dependencies/archive::npm-dep-archiver
      - id: metadata/package/dependencies/declaration::npm-form-data-dependency
      - id: metadata/package/dependencies/network::npm-dep-axios
    any:
      - id: metadata/package/dependencies/serialization::npm-dep-vdf-parser
      - id: metadata/package/dependencies/network::npm-dep-ws
      - id: metadata/package/dependencies/archive::npm-dep-asar
