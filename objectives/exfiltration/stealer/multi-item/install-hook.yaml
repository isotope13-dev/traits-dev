# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


composite_rules:
- for:
  - package.json
  attack: T1195.002,T1552.001,T1041
  id: postinstall-dev-secret-oob-exfil
  desc: postinstall exfils developer secrets
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/fs/read/file/target::postinstall-npmrc-file-read
  - id: micro-behaviors/fs/path/proc::postinstall-init-environment-reference
  - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  - id: micro-behaviors/communications/url/host/oob::pipedream-npm-script
  unless:
  - id: metadata/package/testing/harness/runtime/

