defaults:
  platforms: [unix, windows, macos]
  for: [vsix-archive, javascript, typescript, package.json]
  attack: "T1195.002,T1041,T1082"
  mbc: E1041
composite_rules:
- id: vscode-startup-config-and-environment-exfil
  desc: VS Code startup extension exfiltrates config files and environment
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/permission/activation::on-startup-finished
  - id: metadata/permission/activation::main-extension-js
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/os/env/enumerate::js-base64-environment-snapshot
  - id: micro-behaviors/fs/path/wallet::node-user-solana-config-directory
  - id: micro-behaviors/data/archive/create/zip::node-zip-cli-quiet-create
  - id: micro-behaviors/communications/http/upload/file::formdata-blob-file-fetch-upload

