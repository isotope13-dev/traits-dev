defaults:
  platforms: [unix, appliance]
  for: [typescript, javascript]
  attack: T1041

composite_rules:
- id: ts-http-host-profile-exfil
  desc: Process and environment collection accompany HTTP export
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/serialize/schema-object::host-platform-arch-text-sequence
  - id: objectives/discovery/system/profile::ts-process-env-collection
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body::request-write-call
