defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1056.001,T1113,T1567

composite_rules:
  - id: pyc-keylog-screenshot-webhook
    desc: Bytecode combines keylogging and webhook upload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::pyc-pynput-keyboard-reference
      - id: metadata/binary/code/bytecode::pyc-on-press-token
      - id: metadata/binary/code/bytecode::pyc-screenshot-token
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/post::pyc-post-identifier
