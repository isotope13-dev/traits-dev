defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: pypi-env-fs-snapshot-exfil
  desc: PyPI setup exfiltrates env and directory snapshots
  crit: hostile
  conf: 0.99
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/os/env/enumerate::setup-py-bin-env-dump
  - id: micro-behaviors/data/serialize/schema-object::recon-environment-field-key
  - id: metadata/lang/source/literal/string/property::setup-py-urlencode-fs-snapshot
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlencode
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
- id: pypi-system-env-exfil
  desc: PyPI install-time system and environment exfiltration
  crit: hostile
  conf: 0.98
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/os/env/read/variable::os-environ-symbol
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlencode
  - id: micro-behaviors/communications/http/request/client::request-python
  any:
  - id: micro-behaviors/os/privilege/check::os-getuid-admin
  - id: micro-behaviors/os/privilege/check::ctypes-is-admin
  - id: objectives/discovery/system/fingerprint/network::geo-lookup-service
- id: pypi-traktrain-env-fs-exfil
  desc: PyPI setup exfiltrates env and file listings to Traktrain
  crit: hostile
  conf: 0.995
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/os/env/enumerate::setup-py-bin-env-dump
  - id: micro-behaviors/data/serialize/schema-object::recon-environment-field-key
  - id: metadata/lang/source/literal/string/property::setup-py-urlencode-fs-snapshot
  - id: well-known/app/media/traktrain::req-php-url
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
- id: pypi-setup-host-profile-post-exfil
  desc: Setup hook posts host profile and account files
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082,T1552.001
  scope: leaf
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/env/enumerate::python-environ-items-loop
  - id: micro-behaviors/fs/path/account-db::unix-account-database-path-reference
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
