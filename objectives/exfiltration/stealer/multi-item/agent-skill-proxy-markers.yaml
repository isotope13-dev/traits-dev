defaults:
  platforms: [windows, linux]
  for: [python, markdown, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
  attack: T1195.002
composite_rules:
  - id: agent-skill-sensitive-proxy-forwarding
    desc: Agent skill forwards sensitive data through cloud proxy
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/http/services/cloud::tencent-cloud-scf-endpoint
      - id: micro-behaviors/communications/http/proxy::authenticated-proxy-post
    any:
      - id: micro-behaviors/os/security/auth/secret::password-field-marker
      - id: micro-behaviors/os/security/auth/secret::secret-field-marker
      - id: micro-behaviors/os/security/auth/secret::api-key-field-marker
      - id: micro-behaviors/fs/path/config/ssh::proxy-ssh-path
      - id: micro-behaviors/fs/path/account-db::etc-account-database-path
      - id: micro-behaviors/fs/path/config/cloud::proxy-cloud-credential-path
      - id: micro-behaviors/fs/path/config/environment::proxy-dotenv-path
