defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

composite_rules:
- id: postinstall-host-profile-ngrok-post
  desc: postinstall posts host profile
  crit: hostile
  conf: 0.985
  attack: "T1195.002,T1041,T1082"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/command::postinstall-inline-node-const-reference
  - id: micro-behaviors/os/sysinfo/report::postinstall-host-env-object
  - id: micro-behaviors/os/sysinfo/report::postinstall-host-file-profile-object
  - id: micro-behaviors/communications/http/request/verb::npm-script-node-http-post
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
