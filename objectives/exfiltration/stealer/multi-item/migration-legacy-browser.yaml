defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
composite_rules:
# Same-file proximity and an absolute remote host keep an extension's own
# account login from being pooled with unrelated page-text analysis.
- id: page-text-with-credential-post
  desc: Single script reads page text and posts credentials
  crit: suspicious
  conf: 0.94
  attack: T1041,T1056.003
  scope: file
  near_bytes: 1500
  all:
  - id: micro-behaviors/data/serialize/schema-credential::email-password-json-body
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/ui/window/enumerate::browser-body-innertext-read
- id: extension-page-text-with-credential-upload
  desc: Extension uploads page text with login credentials
  crit: hostile
  conf: 0.99
  attack: T1041,T1056.003
  scope: archive
  for:
  - crx
  - xpi
  - zip
  - javascript
  - chrome-manifest
  all:
  - id: metadata/file/format/browser-extension::web-extension-root-manifest
  - id: metadata/permission/host::broad-host-access
  - id: objectives/exfiltration/stealer/multi-item::page-text-with-credential-post
