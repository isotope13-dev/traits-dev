# Keylogger Behavioral Composites
# Generic keylogger detection patterns (not family-specific)
# ATT&CK: T1056.001 (Keylogging)
defaults:
  attack: T1056.001
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: windows-surveillance-http-post
    desc: Windows surveillance profile with HTTP POST
    crit: hostile
    conf: 0.92
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/collection/keylog/capture::surv-keylog-present
      - id: micro-behaviors/hardware/display/screenshot/unspecified::gdi-screen-capture-primitives
      - id: micro-behaviors/communications/http/client/managed::httpclient
    any:
      - id: micro-behaviors/communications/http/post::postasync
      - id: micro-behaviors/communications/http/client/managed::webrequest-post-method
