defaults:
  platforms: [unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-shadow-collect-upload
    desc: Uploads shadow and SSH secrets
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/url/resource-path/collection::swift-collect-endpoint-literal
      - id: micro-behaviors/fs/path/account-db::unix-shadow-root-ssh-paths
      - id: micro-behaviors/fs/path/activity-history::shell-history-file-reference
