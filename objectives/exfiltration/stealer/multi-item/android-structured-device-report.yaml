defaults:
  platforms: [android]
  for: [dex]
  attack: T1636.004,T1636.002,T1041
traits:
  - id: dex-report-device-key-setter
    desc: DEX sets device key on payload
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '/(Payload|Report|Request)(Entity|Model|Data)?;->setDeviceKey$'
  - id: dex-report-function-setter
    desc: DEX sets function name on payload
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '/(Payload|Report|Request)(Entity|Model|Data)?;->setFunctionName$'
  - id: dex-report-content-setter
    desc: DEX sets payload content
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '/(Payload|Report|Request)(Entity|Model|Data)?;->setPayload$'
composite_rules:
  # The nearby calls form a structural signal; they do not independently
  # establish which records were serialized or transmitted.
  - id: dex-keyed-function-payload-json-cluster
    desc: Device key, function and JSON payload call cluster
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: dex-report-device-key-setter
      - id: dex-report-function-setter
      - id: dex-report-content-setter
      - id: micro-behaviors/data/serialize/json::dex-gson-to-json-call
  - id: android-keyed-report-sensitive-data-clues
    desc: Keyed reports with SMS, call-log and contacts references
    crit: hostile
    conf: 0.96
    for: [android_apk, apk, zip, dex]
    scope: archive
    all:
      - id: dex-keyed-function-payload-json-cluster
      - id: objectives/collection/multi-source::android-call-log-socket-contact-references
      - id: objectives/collection/messaging/sms::android-accessibility-sms-socket-references
