# Session-hijack bundle: access and refresh tokens read from localStorage,
# whole localStorage and sessionStorage copies, and a cookie snapshot built
# beside a fetch whose body is JSON-serialized. Applications send their own
# bearer token, not a refresh token plus every stored key and cookie.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, text]
composite_rules:
- id: browser-auth-fields-near-json-fetch-body
  desc: Browser tokens, storage and cookies near fetch body
  crit: hostile
  conf: 0.98
  attack: "T1528,T1539,T1041"
  mbc: "B0028"
  near_bytes: 3072
  all:
  - id: micro-behaviors/data/db/read/key-value::access-and-refresh-tokens-from-local-storage
  - id: micro-behaviors/data/db/access::both-web-stores-in-snapshot-object
  - id: micro-behaviors/communications/http/request/body/construction::fetch-json-bracket-body-text
  any:
  - id: micro-behaviors/data/serialize/schema-cookie::cookies-field
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
