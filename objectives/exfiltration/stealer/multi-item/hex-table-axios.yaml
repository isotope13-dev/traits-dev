# Bind an os.platform() result to the concealed Axios POST body.
# Field names, endpoint, decoder and record identifiers are unconstrained.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: js-concealed-platform-post
  desc: Concealed POST chains export platform and environment data
  crit: hostile
  conf: 0.99
  attack: T1041,T1027
  all:
  - id: objectives/exfiltration/stealer/system-info/platform::hex-table-axios-platform-post
      # Covert whole-environment export supplies the attack context;
      # an obfuscated platform/telemetry request alone stays suspicious.
  - id: objectives/exfiltration/stealer/configuration/environment::js-hex-table-env-post
