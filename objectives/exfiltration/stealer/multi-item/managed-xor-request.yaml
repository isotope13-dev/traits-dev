defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # A surveillance profile, not a claim that the HTTP URL is valid or that
  # recorded buffers were delivered. The reviewed IL routes these sources
  # through a modulo-key XOR loop, URI escaping and WebRequest.GetResponse.
  - id: managed-surveillance-xor-http-request-profile
    desc: Surveillance records with XOR and HTTP request code
    crit: hostile
    conf: 0.94
    attack: T1041
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/screenshot::managed-screen-recording
      - id: objectives/collection/file-targeting/enumeration::managed-keylogger-file-targeting-records
      - id: micro-behaviors/crypto/symmetric/xor/loop::cil-modulo-key-byte-array-xor
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::getresponsestream
      - id: micro-behaviors/data/encode/url::dotnet-escape-data-string-reference
