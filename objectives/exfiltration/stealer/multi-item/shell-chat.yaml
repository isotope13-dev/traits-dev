defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
composite_rules:
  - id: shell-env-config-keys-to-telegram
    desc: Sends env and config token sweep to Telegram
    conf: 0.99
    attack: T1552,T1567
    all:
      - id: micro-behaviors/communications/http/request/credentials::shell-env-config-result-curl-form
      - id: micro-behaviors/os/env/ai-provider::ai-provider-key-env-reference
      - id: micro-behaviors/os/security/auth/secret::ai-cloud-token-prefix-reference
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
