# leg resolves calls from that collector through helpers to HTTP construction
# and sending. No live C2 success or every archive member is implied.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-browser-surveillance-collector-http-upload
    desc: Go credential and surveillance collector calls HTTP
    crit: hostile
    conf: 0.98
    attack: T1041
    all:
      - id: objectives/collection/multi-source::go-keylogger-screen-browser-stealer-suite
      - id: micro-behaviors/communications/http/client/exchange::go-collector-http-call-chain
