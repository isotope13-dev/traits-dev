defaults:
  platforms: [windows, unix]
  for: [pyc]
  conf: 0.98
traits:
  # These literal statements describe a logging sink; they are not inferred
  # from a generic Discord import or the enclosing executable's reputation.
  - id: pyc-keystroke-channel-announcement
    desc: Bytecode announces channel keystroke delivery
    crit: notable
    if:
      type: text
      substr: This channel will receive keystroke logs
  - id: pyc-keylog-channel-name
    desc: Bytecode names a key-log channel
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: key_log_channel
  - id: pyc-buffered-keylog-start-message
    desc: Bytecode announces buffered keystroke collection
    crit: notable
    if:
      type: text
      regex: 'Starting key logging with [0-9]+-second batching'
composite_rules:
  # The keyboard/channel legs are exact name tokens: deployed engines expose
  # bytecode names as raw tokens, while identifier-fact spellings stay in the
  # referenced micro-behaviors atoms for engines with name-table extraction.
  # The shell-execution leg separates a live agent from a bare constants blob
  # carrying the same vocabulary.
  - id: pyc-discord-buffered-keystroke-exfiltration
    desc: Keyboard and channel names accompany buffered keylogging delivery statements
    crit: hostile
    attack: T1056.001,T1567
    all:
      - id: metadata/binary/code/bytecode::pyc-on-press-token
      - id: metadata/binary/code/bytecode::pyc-discord-create-channel-token
      - id: pyc-keystroke-channel-announcement
      - id: metadata/binary/code/bytecode::pyc-keylog-channel-name-token
      - id: pyc-buffered-keylog-start-message
      - id: micro-behaviors/process/create/shell-subprocess::subprocess-shell-pyc
