defaults:
  for: [markdown]
  platforms: [android]
  attack: T1041,T1113,T1430,T1432

traits:
  - id: markdown-prefixed-dex-monitor-report
    desc: Prefixed DEX asset reports captured host data
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule prefixed_dex_monitor_report {
          strings:
            $dex = { 64 65 78 0A 30 33 35 00 }
            $contacts = "DexContactsMgr" ascii
            $sms = "DexSmsMgr" ascii
            $screen = "DexScreenRecorderMgr" ascii
            $send = "SendDataToServer" ascii
            $send_contacts = "send_contacts" ascii
            $send_messages = "send_messages" ascii
          condition:
            $dex at 10 and all of ($contacts, $sms, $screen, $send, $send_contacts, $send_messages)
        }
