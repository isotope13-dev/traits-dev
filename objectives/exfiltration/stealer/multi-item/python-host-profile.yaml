defaults:
  crit: hostile
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
composite_rules:
- id: python-host-profile-ssh-http-exfil
  desc: Host profiling accompanies an environment-or-SSH credential exporter
  conf: 0.99
  attack: T1082,T1552.004,T1041
  mbc: E1082,E1057
  near_bytes: 6000
  all:
  - id: objectives/exfiltration/stealer/credential::python-unix-secret-http-exfil
  - id: micro-behaviors/os/sysinfo/profile::python-device-host-query-set
  - id: micro-behaviors/data/decode/base64::b64decode-call
