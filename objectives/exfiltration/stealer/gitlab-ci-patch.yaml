defaults:
  platforms:
  - unix
  - windows
  for:
  - text
  - scripts
  - source
composite_rules:
- id: gitlab-ci-pipeline-data-exfil
  desc: GitLab CI patch adds an environment or token upload
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: metadata/file/format/markup::gitlab-ci-unified-diff-target
  - id: metadata/file/format/markup::unified-diff-adds-job-script
  - id: metadata/file/format/markup::unified-diff-adds-url
  any:
  - id: micro-behaviors/communications/http/request/credentials/environment::environment-stdin-curl-command-text
  - id: micro-behaviors/communications/http/request/credentials/ci-credential::curl-ci-token-body-command
