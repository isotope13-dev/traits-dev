defaults:
  platforms:
  - unix
  crit: hostile
composite_rules:
- for:
  - class
  - java_class
  attack: T1552.004,T1041,T1567.004
  id: jvm-dotssh-files-discord-exfiltration
  desc: JVM uploads files from the user's .ssh directory to Discord
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/location::jvm-dotssh-directory-path
  - id: micro-behaviors/fs/directory/readdir::jvm-file-listfiles
  - id: micro-behaviors/communications/http/form::jvm-okhttp-multipart-builder-class-ref
  - id: micro-behaviors/communications/http/post::jvm-okhttp-post-method-reference
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path
- for:
  - java
  - kotlin
  - class
  - java_class
  - jar
  attack: T1041
  id: jvm-home-credential-http-exfil
  desc: JVM home credential exfil
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/credential::jvm-home-credential-files
  - id: objectives/exfiltration/http/collect::jvm-collect-octet-post
