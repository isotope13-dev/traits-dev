  - id: micro-behaviors/data/serialize/schema-object::repo-key-field
  - id: micro-behaviors/data/serialize/schema-object::relative-path-field
  - id: micro-behaviors/fs/path/traversal::java-webroot-parent-traversal
  any:
  - id: micro-behaviors/communications/http/curl/
  - id: micro-behaviors/communications/http/lib/requests
  - id: micro-behaviors/communications/http/response::raise-for-status
  - id: micro-behaviors/communications/http/get/
  - id: micro-behaviors/communications/http/request/get::arm-static-direct-syscall-get-context
  - id: micro-behaviors/communications/http/request/get::tiny-elf-bins-get-context
  - id: micro-behaviors/communications/http/request/get::static-elf-bins-get-context
  - id: micro-behaviors/communications/http/request/get::tiny-static-elf-bins-get-context
  - id: micro-behaviors/communications/http/download/webclient::powershell-image-url-get
  - id: micro-behaviors/communications/http/download/webclient::python-webclient-cloud-api-get
  - id: micro-behaviors/communications/http/download/webclient::python-webclient-http-get
  - id: micro-behaviors/communications/http/request/executable-resource::python-helper-get-discord-executable-url
  - id: micro-behaviors/communications/http/request/package::npm-postinstall-node-http-get
  - id: micro-behaviors/communications/http/request/package::npm-postinstall-hostname-oast-get-url
  - id: micro-behaviors/communications/http/request/account::dahua-account-config-request
  - id: micro-behaviors/communications/http/request/verb::python-request-get-method
  - id: micro-behaviors/communications/http/request/verb::python-request-get-keyword
  - id: micro-behaviors/communications/http/request/verb::python-primp-client-get
  - id: micro-behaviors/communications/http/post
  needs: 1
  near_bytes: 1200
- id: artifactory-auth-bypass-artifact-theft
  desc: JFrog Artifactory auth-bypass artifact theft
  conf: 0.99
  all:
  - id: objectives/evasion/security-bypass/policy/web-admin::aws-token-trailing-slash-bypass
  - id: artifactory-stash-authz-traversal
  - id: objectives/evasion/security-bypass/policy/web-admin::artifactory-router-semicolon-bypass
