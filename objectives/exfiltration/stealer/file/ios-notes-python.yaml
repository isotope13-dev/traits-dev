defaults:
  platforms: [ios, macos]
  for: [python]
  attack: T1005,T1041
composite_rules:
  - id: ios-notes-path-and-byte-upload
    desc: iOS Notes path with file-byte HTTP upload
    crit: suspicious
    conf: 0.93
    # Co-occurrence, not proof that the referenced database reaches the sink.
    all:
      - id: micro-behaviors/fs/path/personal::ios-notes-database
      - id: micro-behaviors/communications/http/request/body::python-post-path-read-bytes
