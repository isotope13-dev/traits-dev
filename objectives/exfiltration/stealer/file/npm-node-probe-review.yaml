defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-remote-ssh-key-file-exfil-package
    desc: File upload and SSH key-write clues
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1041,T1098.004"
    all:
      - id: micro-behaviors/communications/http/url/api-path/resource::key-scan-block-api-path-text
      - id: micro-behaviors/communications/http/upload/file::node-local-file-formdata-stream
      - id: micro-behaviors/fs/write/file/target::authorized-keys-near-node-write
