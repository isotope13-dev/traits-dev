# The published payload packs a file into gzip/base64 and uses die with
# substr to fit the tool's stderr limit. Paths, offsets and delimiters vary.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, json]

traits:
  - id: perl-file-gzip-error-chunks
    desc: File read, gzip and error-message slices
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '<\w+>[^}]{0,200}memGzip[^}]{0,100}\bdie\b[^}]{0,80}substr\('
