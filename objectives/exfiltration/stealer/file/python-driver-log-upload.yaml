defaults:
  platforms: [windows]
  for: [python, whl, python-sdist, zip]
  attack: T1005,T1041
  mbc: B0030

composite_rules:
  - id: python-driver-log-content-upload
    desc: Uploads recursively collected Windows driver text and log contents
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/system/driver::python-system32-drivers-join
      - id: micro-behaviors/fs/directory/readdir/language::python-text-and-log-globs
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/read/file/content/unspecified::python-pathlib-read-text
      - id: micro-behaviors/communications/http/request/body/construction::python-post-content-field
      - id: micro-behaviors/communications/http/request/json::python-post-json-method
