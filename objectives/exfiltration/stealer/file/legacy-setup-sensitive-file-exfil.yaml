defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002
composite_rules:
  - id: setup-sensitive-file-exfil
    desc: setup.py install hook exfiltrates file
    crit: hostile
    conf: 0.98
    mbc: E1041
    attack: T1020
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: micro-behaviors/fs/read/file/handle::file-open-content
      - id: micro-behaviors/fs/read/file/content/unspecified::file-read-content
      - id: objectives/exfiltration/oob/callback::webhook-file-post
    any:
      - id: micro-behaviors/fs/path/challenge-flag::ctf-flag-target
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
