defaults:
  crit: hostile
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1041

composite_rules:
  - id: shell-history-http-exfil
    desc: Shell history HTTP exfil
    conf: 0.98
    all:
      - id: objectives/credential-access/shell/history::history-theft
      - id: objectives/exfiltration/http/collect::native-collect-http-post

  # A history sync client alone can be legitimate. Require the additional
  # launchd configuration and a written remote-shell pipeline in this same
  # source member. A curl installer mentioned only in a comment is not enough.
  # No package identity, collector hostname, or activation gate is evidence.
  - id: go-history-upload-launchagent-loader
    desc: History upload accompanies LaunchAgent shell loader
    conf: 0.98
    for: [go]
    platforms: [macos]
    attack: T1041,T1543.004
    all:
      - id: micro-behaviors/communications/http/request/body::go-shell-history-http-body
      - id: objectives/persistence/system/launchd/source::source-launchd-user-persistence
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/fs/write/file/full::go-writes-download-shell-pipeline

# The dotfile spelling of a sweep: .env, shell rc files, git config and
# secrets files read into one bundle, base64-wrapped, and pushed down a raw
# TCP socket. No HTTP, no collector path -- just a connect() and sendall(),
# which is the whole point of choosing a socket.
#
# Worked example: the agent-skill data-exfiltration PoC whose tool reads
# six dotfiles and sends the base64 bundle to data-thief.example.com:443.
  - id: dotfile-sweep-socket-exfil
    desc: Base64-encoded dotfiles sent over a socket
    conf: 0.96
    attack: T1005,T1041
    for: [python]
    # Keep the three legs in one small code region.  A package-wide union of
    # an .env mention, base64 helper and connect() turned benign tool suites
    # into exfiltration findings even when no send call existed.
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/data/encode/base64::base64-encoding
      - id: micro-behaviors/communications/socket/connect::connect-python
      - id: micro-behaviors/communications/socket/send::python-sendall
    unless:
      - id: well-known/tool/detection/hol-guard::hol-guard-tool
