defaults:
  crit: hostile
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1041

composite_rules:
  - id: launchagent-loader-history-http-post
    desc: LaunchAgent loader posts shell history
    crit: hostile
    conf: 0.98
    for: [scripts, source]
    platforms: [linux, macos, windows]
    attack: T1552.003,T1041
    # The history read and POST atoms are broad capabilities. The recurring
    # LaunchAgent and embedded remote-shell pipeline make the whole file
    # sufficiently specific to allow a function-sized window.
    near_bytes: 4096
    all:
      - id: objectives/credential-access/shell/history::shell-history-file-read
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/client/managed::postasync
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body

  # Constant-pool values do not preserve source adjacency. Keep bytecode
  # separate and require the exact read-plus-POST API constellation in one
  # class instead of weakening the source proximity bound.
  - id: jvm-shell-history-http-post
    desc: JVM sends shell history by HTTP POST
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    platforms: [linux, macos, windows]
    attack: T1552.003,T1041
    all:
      - id: objectives/credential-access/shell/history::shell-history-file-reference
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
      - id: micro-behaviors/os/service/launchagent::jvm-runatload-enabled-string
      - id: micro-behaviors/os/service/launchagent::jvm-startinterval-string
      - id: micro-behaviors/process/create/shell/pipeline::jvm-curl-pipe-shell-string

  - id: perl-launchagent-history-http-post
    desc: Perl package posts shell history from a LaunchAgent
    crit: hostile
    conf: 0.98
    for: [perl, tar]
    scope: archive
    all:
      - id: objectives/credential-access/shell/history::shell-history-file-read
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: micro-behaviors/communications/http/post::perl-post-method-call
      - id: objectives/privilege-escalation/exploit/format-string::plist-runatload-key

  - id: shell-history-http-exfil
    desc: Shell history HTTP exfil
    conf: 0.98
    all:
      - id: objectives/credential-access/shell/history::history-theft
      - id: objectives/exfiltration/http/collect::native-collect-http-post

  # A history sync client alone can be legitimate. Require the additional
  # launchd configuration and a written remote-shell pipeline in this same
  # source member. A curl installer mentioned only in a comment is not enough.
  # No package identity, collector hostname, or activation gate is evidence.
  - id: go-history-upload-launchagent-loader
    desc: History upload accompanies LaunchAgent shell loader
    conf: 0.98
    for: [go]
    platforms: [macos]
    attack: T1041,T1543.004
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/request/body::go-shell-history-http-body
      - id: objectives/persistence/system/launchd/source::source-launchd-user-persistence
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/fs/write/file/full::go-writes-download-shell-pipeline

  - id: node-prepare-shell-history-http-exfil
    desc: Node prepare hook exfils shell history over HTTP
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, package.json]
    platforms: [unix, macos]
    scope: archive
    attack: T1552.003,T1041
    all:
      - id: objectives/supply-chain/install-hook/scripts/prepare::has-prepare
      - id: objectives/credential-access/shell/history::shell-history-file-read
      - id: micro-behaviors/communications/http/request/body::request-end-body-call
      - id: micro-behaviors/process/create/system::js-execfile-call
    any:
      - id: micro-behaviors/communications/http/post::node-https-request-post
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/communications/http/post::request-options-post-method

# The dotfile spelling of a sweep: .env, shell rc files, git config and
# secrets files read into one bundle, base64-wrapped, and pushed down a raw
# TCP socket. No HTTP, no collector path -- just a connect() and sendall(),
# which is the whole point of choosing a socket.
#
# Worked example: the agent-skill data-exfiltration PoC whose tool reads
# six dotfiles and sends the base64 bundle to data-thief.example.com:443.
  - id: dotfile-sweep-socket-exfil
    desc: Base64-encoded dotfiles sent over a socket
    conf: 0.96
    attack: T1005,T1041
    for: [python]
    # Keep the three legs in one small code region.  A package-wide union of
    # an .env mention, base64 helper and connect() turned benign tool suites
    # into exfiltration findings even when no send call existed.
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/data/encode/base64::base64-encoding
      - id: micro-behaviors/communications/socket/connect::connect-python
      - id: micro-behaviors/communications/socket/send::python-sendall
    unless:
      - id: well-known/tool/detection/hol-guard::hol-guard-tool
