defaults:
  for: [groovy]
  platforms: [unix, windows]
  attack: T1041

composite_rules:
  - id: groovy-http-file-upload
    desc: Groovy HTTP file upload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/read/file/full::groovy-file-text-read
      - id: micro-behaviors/communications/http/request/body::groovy-http-post-output
      - id: micro-behaviors/communications/http/url/endpoint::groovy-upload-url-construction
