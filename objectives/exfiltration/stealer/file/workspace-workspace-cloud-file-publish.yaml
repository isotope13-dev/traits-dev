defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
- id: workspace-cloud-file-publish
  desc: Workspace files published to cloud storage
  attack: T1041
  all:
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-stat-collect
  - id: micro-behaviors/communications/http/services/aws-s3::s3-upload-loop
  - id: micro-behaviors/communications/http/services/aws-s3::s3-upload-reads-file
  - id: well-known/app/storage/cloudflare-r2::cloudflare-r2-url
