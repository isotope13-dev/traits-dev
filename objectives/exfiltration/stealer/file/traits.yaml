defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  attack: T1567

composite_rules:
- id: file-search-telegram-send
  desc: id.json search evidence with Telegram send
  crit: hostile
  conf: 0.98
  for:
  - macho
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/search::id-json-search-options
  any:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  - id: micro-behaviors/communications/http/services/telegram::go-telegram-sendmessage-client
