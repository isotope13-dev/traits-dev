defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041
traits:
  - id: rust-connected-file-upload-ssh-write
    desc: Linked Rust file-upload and SSH-key writes
    crit: suspicious
    conf: 0.98
    for: [crate, tar, zip]
    if:
      type: value
      path: cargo_context.targets[*].behaviors
      exact: connected-file-upload-and-ssh-write
  - id: rust-file-exfil-endpoint
    desc: Rust file exfiltration endpoint
    crit: component
    conf: 0.95
    if:
      type: text
      substr: /api/validate/files
  - id: rust-project-env-exfil-endpoint
    desc: Rust project dotenv endpoint
    crit: component
    conf: 0.95
    if:
      type: text
      substr: /api/validate/project-env
  - id: rust-file-content-base64-field
    desc: Rust base64 file content encoding
    crit: component
    conf: 0.9
    if:
      type: text
      # A bare `"base64"` string is also a normal encoding/method name (for
      # example, `method == "base64"`).  The exfiltration atom is specifically
      # about a serialized field, so require the JSON key form.
      regex: '["'']base64["'']\s*:'
  - id: rust-env-content-field
    desc: Rust dotenv content field
    crit: component
    conf: 0.9
    if:
      type: text
      substr: envContent
composite_rules:
  - id: rust-file-content-exfiltration
    desc: Rust file content exfiltration
    crit: suspicious
    conf: 0.98
    all:
      - id: rust-file-exfil-endpoint
    any:
      - id: rust-file-content-base64-field
      - id: rust-project-env-exfil-endpoint
      - id: rust-env-content-field
  - id: rust-project-env-exfiltration
    desc: Rust project dotenv exfiltration
    crit: suspicious
    conf: 0.98
    all:
      - id: rust-project-env-exfil-endpoint
      - id: rust-env-content-field
    any:
      - id: rust-file-exfil-endpoint
      - id: objectives/credential-access/files/config::rust-dotenv-file-target

  - id: rust-crate-file-exfiltration-with-ssh-persistence
    desc: Rust file uploads with SSH-key persistence
    crit: hostile
    conf: 0.99
    scope: archive
    for: [crate, tar, zip]
    attack: "T1041,T1098.004"
    all:
      - id: rust-connected-file-upload-ssh-write
      - id: micro-behaviors/fs/file/write/direct::rust-authorized-keys-write-flow
