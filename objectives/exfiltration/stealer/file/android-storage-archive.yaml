defaults:
  platforms: [android, unix, windows]
  for: [python, scripts]
  attack: T1005,T1041,T1083
  mbc: E1005,E1041

composite_rules:
  # Walking Android shared storage and sending a multipart file upload in the
  # same file. Co-occurrence: the rule does not bind a walked path to the
  # uploaded handle. Archive staging is claimed separately under
  # collection/archive/stage.
  - id: android-storage-walk-file-upload
    desc: Walks Android shared storage and uploads files
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/fs/path/personal::android-storage-emulated
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
    any:
      - id: micro-behaviors/communications/http/upload::python-http-files-parameter
      # Text form of the same upload; the call-node form can miss calls whose
      # argument list carries non-ASCII comments.
      - id: micro-behaviors/communications/http/upload::requests-post-files-parameter
