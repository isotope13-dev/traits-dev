defaults:
  platforms: [android, unix, windows]
  for: [python, scripts]
  attack: T1005,T1041,T1560.001
  mbc: E1005,E1041

composite_rules:
  - id: android-storage-archive-exfiltration
    desc: Android storage harvested into archive and uploaded
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/fs/path/personal::android-storage-emulated
      - id: micro-behaviors/communications/http/upload::python-http-files-parameter
    any:
      - id: micro-behaviors/communications/messaging/send::chat-send-document
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/fs/delete/file/library::python-short-alias-remove
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
