# The chunk helper's implementation opens and Base64-encodes local files.
# The transfer block assigns that result to a response record and submits the
# record through the agent's packet callback. The encrypted task-channel leg
# admits the objective; file I/O and encoding alone do not.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
  attack: T1041

composite_rules:
  - id: powershell-agent-file-chunk-transfer
    desc: Task agent sends local file chunks as responses
    crit: hostile
    all:
      - id: objectives/command-and-control/remote-command/dispatch::powershell-agent-encrypted-task-channel
      - id: micro-behaviors/fs/file/open::powershell-file-openread
      - id: micro-behaviors/data/encode/base64::to-base64-string
      - id: micro-behaviors/communications/transfer::powershell-file-chunk-response-block
    
