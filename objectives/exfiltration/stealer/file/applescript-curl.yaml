defaults:
  platforms: [macos]
  for: [applescript, php]
  attack: T1041

composite_rules:
  - id: macos-curl-tmp-upload-signal
    desc: curl uploads a file staged in macOS temporary storage
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/upload::curl-upload-file
      - id: micro-behaviors/communications/http/upload::curl-at-tmp
  - id: macos-stealer-curl-tmp-form-upload
    desc: macOS stealer curl uploads staged tmp archive
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/theft/multi-app::browser-wallet-stealer
      - id: macos-curl-tmp-upload-signal
    any:
      - id: objectives/collection/app-data/notes/app::notes-theft
      - id: objectives/collection/stealer/tactics::office-secret-extension-list
      - id: objectives/credential-access/wallet/desktop::stealer
    needs: 1
