# Require the collection -> encoding -> callback argument chain in one hook.
# Archive scope could join documentation or unrelated dependency manifests.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1005,T1041
  mbc: E1041

composite_rules:
  - id: npm-preinstall-target-list-oob-exfil
    desc: Preinstall encodes target-list files for OAST POST
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/eval::npm-preinstall-python-inline-command
      - id: micro-behaviors/fs/read/file/target::npm-preinstall-python-target-list-file-read
      - id: micro-behaviors/communications/url/host/oob::npm-preinstall-python-post-oastify-target
    any:
      - id: micro-behaviors/communications/http/request/body/command-output::npm-preinstall-httpx-base64-results-body
      - id: micro-behaviors/communications/http/request/body/command-output::npm-preinstall-requests-base64-results-body
