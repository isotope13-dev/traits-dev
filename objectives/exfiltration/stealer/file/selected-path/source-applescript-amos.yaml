defaults:
  platforms:
  - macos
  for:
  - applescript
  - shell
  attack: T1005
  mbc: B0028
composite_rules:
- id: applescript-complete-infostealer
  desc: AppleScript staged file export after phishing
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/credential/collection::multi-sensitive-store-references
  - id: objectives/collection/archive/stage::applescript-staging-layout
  - id: objectives/credential-access/phishing/lure::applescript-password-phishing
  - id: objectives/exfiltration/http/archive::applescript-exfiltration
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/cleave::cleave-traits-package-identity
