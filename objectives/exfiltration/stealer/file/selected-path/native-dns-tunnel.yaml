defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf
  attack: T1048.003
  mbc: B0030
composite_rules:
- id: native-dns-tunnel-identity-exfil
  desc: Native DNS tunnel exfiltrates identity files
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/dns/raw::native-dns-packet-tunnel-client
  any:
  - id: micro-behaviors/fs/path/config/git::gitconfig-file
  - id: micro-behaviors/fs/path/credential/account-db::etc-passwd
  - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
  unless:
  - id: metadata/path/directory::test-directory-component
