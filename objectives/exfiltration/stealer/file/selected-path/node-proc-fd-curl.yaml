defaults:
  platforms:
  - linux
  for:
  - javascript
  attack: T1005,T1041
traits:
- id: node-proc-fd-curl
  desc: Uploads contents of process file descriptors
  crit: hostile
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((statement_block
        (lexical_declaration (variable_declarator name: (identifier) @fd_path
          value: (template_string (string_fragment) @proc
            (template_substitution (identifier)) (string_fragment) @fd)))
        (for_in_statement body: (statement_block
          (if_statement consequence: (statement_block
            (if_statement consequence: (statement_block
              (try_statement body: (statement_block
                (expression_statement (augmented_assignment_expression
                  left: (identifier) @output
                  right: (call_expression function: (member_expression
                    object: (identifier) @fs property: (property_identifier) @read)
                    arguments: (arguments (template_string
                      (template_substitution (identifier) @fd_used))))))))))))))
        (lexical_declaration (variable_declarator name: (identifier) @payload
          value: (call_expression function: (member_expression
            object: (identifier) @json property: (property_identifier) @stringify)
            arguments: (arguments (object (pair value: (identifier) @output_used))))))
        (expression_statement (call_expression function: (identifier) @exec
          arguments: (arguments (template_string (string_fragment) @curl
            (template_substitution (identifier) @payload_used))))))
        (#eq? @proc "/proc/")
        (#eq? @fd "/fd")
        (#eq? @fd_path @fd_used)
        (#eq? @fs "fs")
        (#eq? @read "readFileSync")
        (#eq? @output @output_used)
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @exec "execSync")
        (#match? @curl "^curl .*(-d|--data) ")
        (#eq? @payload @payload_used))
