defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1005,T1041,T1083
traits:
- id: node-elf-recursive-opt-search
  desc: Recursively searches opt for files
  crit: notable
  if:
    type: text
    substr: searchDirectory('/opt')
composite_rules:
- id: node-elf-recursive-file-upload
  desc: Uploads contents of files found under opt
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/stealer/file/selected-path::node-elf-recursive-opt-search
  - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
  - id: micro-behaviors/data/serialize/object::same-name-content-field
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-request-write-variable
