defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1005,T1041,T1083
traits:
- id: node-opt-command-base64-curl
  desc: Sends encoded opt command output over HTTP
  crit: hostile
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((program
        (try_statement body: (statement_block
          (expression_statement (assignment_expression
            left: (identifier) @data
            right: (call_expression function: (member_expression
              object: (call_expression function: (identifier) @read_exec
                arguments: (arguments (string (string_fragment) @command)))
              property: (property_identifier) @to_string))))))
        (expression_statement (call_expression
          function: (identifier) @send_exec
          arguments: (arguments (template_string
            (string_fragment) @curl
            (template_substitution (call_expression
              function: (member_expression
                object: (call_expression function: (member_expression
                  object: (identifier) @buffer property: (property_identifier) @from)
                  arguments: (arguments (identifier) @sent_data))
                property: (property_identifier) @encode)
              arguments: (arguments (string (string_fragment) @encoding)))))))))
        (#eq? @read_exec "execSync")
        (#eq? @send_exec "execSync")
        (#eq? @to_string "toString")
        (#eq? @buffer "Buffer")
        (#eq? @from "from")
        (#eq? @encode "toString")
        (#eq? @encoding "base64")
        (#eq? @data @sent_data)
        (#match? @command "^(cat|ls) [^\\n]*?/opt(?:/|[[:space:]]|$)")
        (#match? @curl "^curl [^\\n]*https?://[^\\n]*--data"))
