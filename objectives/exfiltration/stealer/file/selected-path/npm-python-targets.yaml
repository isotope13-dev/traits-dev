defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1005,T1041
  mbc: E1041
composite_rules:
- id: npm-preinstall-inline-file-collection-post
  desc: Inline install script collects files and posts data
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/package/scripts/inline::npm-preinstall-python-inline-command
  - id: micro-behaviors/fs/read/file/target::npm-preinstall-python-target-list-file-read
  - id: micro-behaviors/data/encoding/base64::preinstall-base64-word
  - id: micro-behaviors/communications/http/request/inline::npm-preinstall-python-http-post
- id: npm-preinstall-target-list-oob-exfil
  desc: Preinstall encodes target-list files for OAST POST
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/package/scripts/inline::npm-preinstall-python-inline-command
  - id: micro-behaviors/fs/read/file/target::npm-preinstall-python-target-list-file-read
  - id: micro-behaviors/communications/url/host/oob/request::npm-preinstall-python-post-oastify-target
  any:
  - id: micro-behaviors/communications/http/request/body/command-output::npm-preinstall-httpx-base64-results-body
  - id: micro-behaviors/communications/http/request/body/command-output::npm-preinstall-requests-base64-results-body
