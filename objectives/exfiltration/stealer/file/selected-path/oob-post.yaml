defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
composite_rules:
- id: oob-endpoint-file-exfil
  desc: File content sent to OOB POST endpoint
  crit: hostile
  conf: 0.95
  attack: T1567
  mbc: E1041
  near_lines: 120
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/body/file-read::file-content-http-body
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::request-post-option
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  - id: micro-behaviors/communications/http/post::powershell-post-method
  unless:
  - id: metadata/package/testing/harness/benchmark::python-benchmark-fixture-harness
  - id: micro-behaviors/os/security/scan/documentation/
  - id: micro-behaviors/fs/path/credential/account-db::unix-account-database-path-reference
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: micro-behaviors/communications/http/request/verb::python-inbound-method-post-check
  - id: metadata/file/catalog/network::embedded-domain-blocklist-context
