defaults:
  platforms:
  - macos
  for:
  - applescript
  - shell
  mbc: B0028
composite_rules:
- id: applescript-buildid-databinary-exfil
  for:
  - applescript
  - shell
  - macho
  desc: Password phishing with BuildID-tagged curl file upload
  crit: hostile
  conf: 0.96
  attack: T1041
  all:
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  - id: micro-behaviors/communications/http/request/body/source::curl-data-binary-at-source
  - id: objectives/credential-access/phishing/lure::password-phishing-comp
  any:
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  - id: micro-behaviors/communications/ip/literal::http-ip-url
