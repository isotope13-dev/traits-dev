  - windows
  for:
  - javascript
  - typescript
  conf: 0.96
  attack: T1041
composite_rules:
- id: http-selected-file-read-and-upload
  desc: HTTP-selected file reads alongside file upload
  crit: suspicious
  scope: file
  all:
  - id: micro-behaviors/communications/http/upload/file::fetch-file-read-body
  - id: micro-behaviors/fs/read/file/content/request-path::http-response-file-path-read
- id: http-task-file-upload-and-code-execution
  desc: Remote-code evaluation alongside HTTP-selected reads and uploads
  crit: hostile
  attack: T1041,T1059.007
  scope: file
  all:
  - id: objectives/exfiltration/stealer/file/selected-path::http-selected-file-read-and-upload
  - id: objectives/execution/payload/script-eval/network/in-process::http-response-eval
