defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  mbc: E1041
  attack: T1005
composite_rules:
- id: node-webhook-file-content-exfil
  desc: Reads targeted source or flag files and sends their content to a webhook
  crit: hostile
  conf: 0.995
  attack: T1005,T1041,T1567.002
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
  if:
    type: text
    regex: (?i)(/home/node/aspect-node/|/tmp/flag(?:\.txt)?|HTB\{)
  any:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/download/cli/curl-wget::node-execsync-curl-command
- id: npm-install-opt-file-theft
  desc: Install hook steals /opt file data
  crit: hostile
  conf: 0.995
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: objectives/collection/file-targeting/filter::opt-santa-file-targeting
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  any:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: metadata/lang/source/syntax/call/member::req-write-call-prefix-text-reference
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
- id: js-opt-file-theft-exfil
  desc: JS steals /opt file data
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/collection/file-targeting/filter::opt-santa-file-targeting
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  any:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: metadata/lang/source/syntax/call/member::req-write-call-prefix-text-reference
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
- id: js-shell-opt-file-post-exfil
  desc: JS shell POSTs /opt file content
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/reference::santa-list-path
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: objectives/exfiltration/stealer/file/selected-path::js-shell-curl-file-exfil
