defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1005,T1041

traits:
  - id: esm-passwd-entry
    desc: Declares ESM module entry
    crit: notable
    for: [package.json]
    if:
      type: value
      path: exports.default
      regex: '^(\./)?index[.]js$'
  - id: esm-passwd-module
    desc: Declares ESM package
    crit: notable
    for: [package.json]
    if:
      type: value
      path: type
      exact: module
  - id: esm-passwd-read
    desc: Reads system account file
    crit: notable
    if:
      type: text
      substr: "fs.readFileSync('/etc/passwd')"
  - id: esm-passwd-host
    desc: Selects fixed HTTP recipient
    crit: notable
    if:
      type: text
      substr: "host: 'hello.com'"
  - id: esm-passwd-request
    desc: Creates HTTP request
    crit: notable
    if:
      type: text
      substr: 'http.request(post_options)'
  - id: esm-passwd-body
    desc: Writes file content to request
    crit: notable
    if:
      type: text
      substr: 'post_req.write(secret)'
  - id: esm-passwd-trigger
    desc: Calls data sending function on module load
    crit: notable
    if:
      type: text
      substr: 'add(1, 2)'

composite_rules:
  - id: esm-passwd-post-module
    desc: Posts account file on module load
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: esm-passwd-read
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: esm-passwd-host
      - id: esm-passwd-request
      - id: esm-passwd-body
      - id: esm-passwd-trigger
  - id: npm-esm-passwd-post
    desc: Package import posts system account file
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: esm-passwd-entry
      - id: esm-passwd-module
      - id: esm-passwd-post-module
