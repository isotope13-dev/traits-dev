defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1005,T1041,T1195.002
traits:
- id: npm-preinstall-cat-devtcp-upload
  desc: Sends local files over Bash TCP redirection
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.preinstall
    regex: cat\s+/[^\s]{1,100}\s+&>\s*/dev/tcp/[^/\s]{1,150}/[0-9]{1,5}
