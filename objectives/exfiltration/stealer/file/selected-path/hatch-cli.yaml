defaults:
  for: [elf]
  platforms: [linux]

traits:
  - id: hatch-binary-path-reference
    desc: Names the hatch executable path
    crit: notable
    attack: T1005
    if:
      type: text
      substr: /opt/hatch/bin/hatch

  - id: hatch-binary-tar-netcat-upload
    desc: Pipes the hatch executable into netcat
    crit: notable
    attack: T1041
    if:
      type: text
      substr: 'tar -c /opt/hatch/bin/hatch | nc '

composite_rules:
  - id: hatch-binary-exfiltration
    desc: Exfiltrates the hatch executable
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    all:
      - id: hatch-binary-path-reference
    any:
      - id: micro-behaviors/communications/http/curl/body::curl-multipart-form-option
      - id: hatch-binary-tar-netcat-upload
