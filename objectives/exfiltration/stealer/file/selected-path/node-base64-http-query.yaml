defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1005,T1041
traits:
- id: node-base64-file-query-flow
  desc: Encodes files into remote request paths
  crit: notable
  if:
    type: tree-sitter
    query: |
      ((program
        (lexical_declaration (variable_declarator name: (identifier) @host_var value: (string (string_fragment) @ip)))
        (function_declaration name: (identifier) @send
          parameters: (formal_parameters (identifier) @payload)
          body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @path
              value: (binary_expression right: (call_expression function: (identifier) @encode_uri
                arguments: (arguments (identifier) @payload_used)))))
            (lexical_declaration (variable_declarator name: (identifier) @options
              value: (object (pair key: (property_identifier) @host_key value: (identifier) @host_used) (pair key: (property_identifier) @path_key value: (identifier) @path_used))))
            (lexical_declaration (variable_declarator
              value: (call_expression function: (member_expression object: (identifier) @http property: (property_identifier) @request)
                arguments: (arguments (identifier) @options_used))))))
        (for_in_statement body: (statement_block
          (try_statement body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @content
              value: (call_expression function: (member_expression object: (identifier) @fs property: (property_identifier) @read))))
            (lexical_declaration (variable_declarator name: (identifier) @encoded
              value: (call_expression function: (member_expression object: (call_expression
                function: (member_expression object: (identifier) @buffer property: (property_identifier) @from)
                arguments: (arguments (identifier) @content_used)) property: (property_identifier) @to_string)
                arguments: (arguments (string (string_fragment) @encoding)))))
            (try_statement body: (statement_block (expression_statement (call_expression function: (identifier) @send_used
              arguments: (arguments (identifier) @encoded_used))))))))))
        (#eq? @host_key "host")
        (#eq? @host_var @host_used)
        (#match? @ip "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$")
        (#not-match? @ip "^(0|10|127|169\\.254|192\\.168|172\\.(1[6-9]|2[0-9]|3[01]))\\.")
        (#eq? @encode_uri "encodeURIComponent")
        (#eq? @payload @payload_used)
        (#eq? @path_key "path")
        (#eq? @path @path_used)
        (#eq? @http "http")
        (#eq? @request "request")
        (#eq? @options @options_used)
        (#eq? @fs "fs")
        (#eq? @read "readFileSync")
        (#eq? @buffer "Buffer")
        (#eq? @from "from")
        (#eq? @to_string "toString")
        (#eq? @encoding "base64")
        (#eq? @content @content_used)
        (#eq? @send @send_used)
        (#eq? @encoded @encoded_used))
composite_rules:
- id: npm-install-base64-file-query
  desc: Install hook sends encoded files remotely
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  scope: archive
  all:
  - id: objectives/exfiltration/stealer/file/selected-path::node-base64-file-query-flow
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
