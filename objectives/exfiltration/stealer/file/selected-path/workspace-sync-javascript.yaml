defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041

traits:
  - id: recursive-sync-readdir
    desc: Enumerates directories during workspace sync
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'readdirSync\(\w+\)'

  - id: recursive-sync-self-call
    desc: Recurses into discovered workspace directories
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\w+\(fullPath\)'

  - id: workspace-file-content-array
    desc: Adds file contents to workspace upload array
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'files\.push\(\{\s*filename:\s*\w+,\s*content\s*\}\)'

  - id: axios-post-workspace-files
    desc: Axios POST body includes workspace files
    crit: component
    conf: 0.94
    if:
      type: text
      regex: 'axios[\s\S]{0,200}\.post\([\s\S]{0,120}\bfiles\s*,'

composite_rules:
  - id: recursive-workspace-content-http-upload
    desc: Uploads recursively collected workspace file contents
    crit: suspicious
    conf: 0.98
    for: [npm, javascript]
    scope: package
    near_lines: 90
    all:
      - id: recursive-sync-readdir
      - id: recursive-sync-self-call
      - id: workspace-file-content-array
      - id: axios-post-workspace-files
