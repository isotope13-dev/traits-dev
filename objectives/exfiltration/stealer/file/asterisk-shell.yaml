defaults:
  platforms: [unix]
  for: [shell, php]
  attack: T1041,T1552.001

composite_rules:
  - id: encoded-asterisk-config-upload-to-ip
    desc: Encoded curl uploads Asterisk authentication configs to a raw IP
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/upload::encoded-curl-form-file-attachment
      - id: objectives/credential-access/files/config::encoded-asterisk-auth-config-target
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-encoded
