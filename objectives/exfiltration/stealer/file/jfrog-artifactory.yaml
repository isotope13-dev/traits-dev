# JFrog Artifactory private-artifact theft: an auth bypass mints a token, the
# deprecated stash API copies an ACL-protected artifact into a traversed webroot
# path, and a router-normalization bypass retrieves it without authorization.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190,T1041
  mbc: E1190

composite_rules:
  - id: artifactory-stash-authz-traversal
    desc: Artifactory artifact staged through webroot traversal
    crit: hostile
    conf: 0.97
    attack: T1190
    all:
      - id: micro-behaviors/communications/http/services/artifactory::stash-results-route
      - id: micro-behaviors/data/serialize/json::repo-key-field
      - id: micro-behaviors/data/serialize/json::relative-path-field
      - id: objectives/evasion/security-bypass/policy/web-admin::java-webroot-parent-traversal
    any:
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/lib/requests/
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/post/
    needs: 1
    near_bytes: 1200

  - id: artifactory-auth-bypass-artifact-theft
    desc: JFrog Artifactory auth-bypass artifact theft
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/security-bypass/policy/web-admin::aws-token-trailing-slash-bypass
      - id: artifactory-stash-authz-traversal
      - id: objectives/evasion/security-bypass/policy/web-admin::artifactory-router-semicolon-bypass
      - id: micro-behaviors/communications/http/
    near_bytes: 4096
