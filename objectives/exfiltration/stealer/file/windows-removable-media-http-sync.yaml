defaults:
  platforms: [windows]
  for: [pe, c, cpp, csharp, source]
  attack: T1005
  mbc: B0030
composite_rules:
  - id: removable-media-http-sync
    desc: Removable media synchronized over HTTP
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/traversal/drives::media-sync-state-token
      - id: micro-behaviors/fs/traversal/drives::drive-enumeration-context
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/communications/http/request/
      - id: micro-behaviors/communications/socket/create/
  - id: remote-file-table-drive-sync
    desc: C2 file table drives synchronization
    crit: hostile
    conf: 0.96
    all:
      - id: removable-media-http-sync
      - id: objectives/collection/file-targeting/remote-list::server-file-table-token
    any:
      - id: micro-behaviors/communications/http/download/write::downloaded-file-writeback
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/upload/
