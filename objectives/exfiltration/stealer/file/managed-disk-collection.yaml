# CIL confirms extension-filtered drive enumeration, disk-arrival staging,
# then UploadFileTaskAsync. Bind this profile to the image's own CLR heaps.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: managed-infection-document-disk-upload-references
    desc: Infection disk-search and upload references
    crit: suspicious
    conf: 0.98
    attack: T1041
    if:
      type: yara
      source: |
        import "dotnet"
        rule managed_infection_document_disk_upload {
          strings:
            $m_enum = "EnumerateFiles" ascii fullword
            $m_ext = "get_Extension" ascii fullword
            $m_drive = "DriveInfo" ascii fullword
            $m_watch = "ManagementEventWatcher" ascii fullword
            $m_upload = "UploadFileTaskAsync" ascii fullword
            $u_doc = ".docx" wide fullword
            $u_ppt = ".pptx" wide fullword
            $u_disk = "TargetInstance ISA 'Win32_LogicalDisk'" wide
            $u_event = "__InstanceCreationEvent" wide fullword
            $u_infection = "INFECTIONTYPE" wide fullword
          condition:
            for all of ($m_*) : (
              for any s in dotnet.streams : (
                s.name == "#Strings" and
                $ in (s.offset..s.offset + s.size - 1)
              )
            ) and
            for all of ($u_*) : (
              for any s in dotnet.streams : (
                s.name == "#US" and
                $ in (s.offset..s.offset + s.size - 1)
              )
            )
        }
composite_rules:
  - id: managed-infection-document-disk-upload
    desc: Implant collects and uploads disk documents
    crit: hostile
    conf: 0.98
    all:
      - id: managed-infection-document-disk-upload-references
      - id: objectives/exfiltration/stealer/system-info/identity::managed-infection-domain-report-upload
