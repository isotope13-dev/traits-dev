defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows]
  for: [powershell]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: ps-sweep-archive-http-exfil
    desc: PowerShell sweeps key files, archives, and uploads them
    all:
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
      - id: micro-behaviors/data/archive/create/zip::powershell-compress-archive
      - id: objectives/collection/file-targeting/filter::credential-files
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post
      - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
    needs: 1
