defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: discord-extortion-file-upload-task
    desc: Discord extortion file retrieval and upload
    crit: hostile
    conf: 0.99
    attack: T1041
    all:
      - id: objectives/command-and-control/remote-command/tasking::discord-extortion-shell-tasking
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/file/stat::getfilesizeex-import
      - id: micro-behaviors/communications/http/upload::multipart-http-upload
    any:
      - id: objectives/command-and-control/remote-command/tasking::bang-download-command
      - id: objectives/command-and-control/remote-command/tasking::fnv1a-download-command
      - id: micro-behaviors/communications/http/request/body/file::x64-task-file-read-post-body
