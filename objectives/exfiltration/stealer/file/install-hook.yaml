defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  - shell
  attack: T1195.002
  mbc: E1041
composite_rules:
- id: python-install-hook-curl-file-exfil
  desc: Python install hook uploads a local file
  crit: hostile
  conf: 0.99
  for: [python, zip]
  scope: archive
  attack: T1005,T1041,T1195.002
  all:
  - id: metadata/build/pip::root-setup-py-path
  - id: metadata/build/pip::packaging-setup-api-import
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
  - id: micro-behaviors/communications/http/upload/file::curl-file-upload-option
  near_bytes: 1800
- id: preinstall-file-cleartext-oast-exfil
  desc: Preinstall sends local file to OAST over cleartext HTTP
  crit: hostile
  conf: 0.98
  attack: T1005,T1041,T1195.002
  for:
  - package.json
  all:
  - id: micro-behaviors/fs/read/file/target::shell-cat-root-or-home-path
  - id: metadata/package/scripts/command::npm-preinstall-cleartext-http-reference
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
- id: npm-postinstall-customer-record-exfil
  desc: npm postinstall exfiltrates customer-record file to remote endpoint
  crit: hostile
  conf: 0.97
  attack: T1005,T1041,T1195.002
  scope: archive
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: micro-behaviors/fs/path/personal::customer-record-file-reference
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-end-body
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
