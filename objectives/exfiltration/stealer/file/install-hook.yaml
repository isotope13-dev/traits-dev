# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


traits:
  - id: oastify-data-path
    desc: OASTify data exfil path
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: .oastify.com/data
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-documentation
      - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: curl-cat-temp-files-post
    desc: curl POSTs a temp file body
    crit: suspicious
    conf: 0.96
    # `date -d "$(cat /tmp/...)"` is a date string, not a curl body.
    # A semicolon ends the curl command, so a later date -d does not count.
    if:
      type: text
      regex: '\bcurl\b[^\n;]{0,160}-d\s*"?\$\(cat\s+/tmp/'
  - id: data-dir-listing-command-substitution
    desc: Shell substitution reads /data command output
    crit: notable
    conf: 0.97
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '\$\((ls\s+-[A-Za-z0-9]*R?\s+/data/?|cat\s+/data/[^)]{1,120})\)'

composite_rules:
  - id: curl-data-dir-oast-exfil
    desc: curl exfils /data command output to OASTify
    crit: hostile
    conf: 0.99
    attack: T1041
    for: [package.json]
    all:
      - id: objectives/supply-chain/recon-exfil/oast/secret::oastify-url
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
      - id: objectives/exfiltration/stealer/file::data-dir-listing-command-substitution
      - id: objectives/exfiltration/stealer/file::oastify-data-path
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: npm-postinstall-data-dir-oast-exfil
    desc: npm postinstall exfils /data directory listing to OASTify
    crit: hostile
    conf: 0.99
    scope: archive
    for: [javascript, package.json, tar, zip]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/exfiltration/stealer/file::curl-data-dir-oast-exfil
    unless:
      - id: metadata/package/testing/harness/runtime/
  # File-to-collaborator pipe: the preinstall cats an absolute-path file and
  # sends it to an OAST endpoint over cleartext HTTP. Reading local files
  # into a collaborator-bound request is theft with its transport attached.
  - id: preinstall-file-cleartext-oast-exfil
    desc: Preinstall sends local file to OAST over cleartext HTTP
    crit: hostile
    conf: 0.98
    attack: T1005,T1041,T1195.002
    for: [package.json]
    all:
      - id: micro-behaviors/fs/read/file/target::shell-cat-root-or-home-path
      - id: micro-behaviors/communications/http/url/endpoint::npm-preinstall-cleartext-http-reference
      - id: micro-behaviors/communications/url/host/oob::oastify
    unless:
      - id: metadata/package/testing/harness/runtime/
  # Customer-record harvester: the postinstall hook runs a Node script that
  # references a customer-record file and POSTs a request body to a hardcoded
  # remote URL. The hook supplies auto-execution at install time, the record
  # reference supplies the PII source, and the POST body plus remote URL
  # supply the transfer and destination. Benign install-time telemetry reads
  # its own manifest or version and reports to a vendor API; it names no
  # customer-record file, so the record leg is what keeps this hostile.
  - id: npm-postinstall-customer-record-exfil
    desc: npm postinstall exfiltrates customer-record file to remote endpoint
    crit: hostile
    conf: 0.97
    attack: T1005,T1041,T1195.002
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/fs/path/personal::customer-record-file-reference
      - id: micro-behaviors/communications/http/request/body::node-http-request-end-body
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: metadata/package/testing/harness/runtime/
