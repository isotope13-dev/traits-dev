defaults:
  platforms: [unix]
  for: [javascript]

composite_rules:
- id: js-file-archive-exfil
  desc: File enumeration with archive and FTP exfiltration
  crit: hostile
  conf: 0.95
  attack: T1560.001
  all:
  - id: micro-behaviors/fs/enumerate/directory::fs-readdir
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  any:
  - id: micro-behaviors/communications/ftp/client::ftp-require
  - id: micro-behaviors/communications/ftp/client::ftp-put
- id: js-sensitive-file-exfil
  desc: Sensitive file targeting with external IP exfiltration
  crit: hostile
  conf: 0.95
  attack: T1041
  all:
  - id: js-sensitive-file-target
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: js-shell-file-post-exfil
  desc: Shell reads local files and POSTs them
  crit: hostile
  conf: 0.99
  attack: T1041
  mbc: E1041
  all:
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
  - id: objectives/exfiltration/http/query::curl-user-agent-data-smuggling
  - id: objectives/exfiltration/oob/endpoint::requestrepo
  any:
  - id: objectives/collection/file-targeting/command::shell-find-cat-all-files
  - id: objectives/exfiltration/http/query::curl-post-command-sub-data
- id: js-shell-curl-file-exfil
  desc: Node shell curl file exfiltration
  crit: hostile
  conf: 0.98
  attack: T1041
  mbc: E1041
  all:
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  any:
  - id: objectives/exfiltration/http/query::curl-post-command-sub-data-any-order
  - id: objectives/exfiltration/http/query::curl-post-cats-local-file
  - id: objectives/exfiltration/http/query::curl-post-command-sub-url
  - id: objectives/exfiltration/http/query::curl-user-agent-data-smuggling
  - id: objectives/collection/file-targeting/identity-set::shell-base64-passwd-bundle
  - id: objectives/collection/file-targeting/identity-set::shell-base64-shadow-bundle
  - id: objectives/collection/file-targeting/identity-set::shell-base64-hosts-bundle
  needs: 2
