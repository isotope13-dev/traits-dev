# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-passwd-http-pipe
    desc: Cats passwd into an HTTP client
    crit: hostile
    conf: 0.96
    for: [swift]
    platforms: [unix]
    all:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-cat
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-http-client
      - id: objectives/credential-access/files/openssl::openssl-hardcoded-pass

