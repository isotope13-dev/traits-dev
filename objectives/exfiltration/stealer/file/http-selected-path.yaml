defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.96
  attack: T1041

composite_rules:
  # These are same-file capabilities, not proof that the uploaded file is
  # the one selected by the server. Keep the intermediate claim explicit.
  - id: http-selected-file-read-and-upload
    desc: HTTP-selected file reads alongside file upload
    crit: suspicious
    scope: file
    all:
      - id: micro-behaviors/communications/http/upload::fetch-file-read-body
      - id: micro-behaviors/fs/read/file/full::http-response-file-path-read

  # A file-transfer client can accept paths from a server. Combining that
  # channel with evaluation of server-provided code establishes a backdoor.
  # Same-file co-occurrence; the two operations need not share a response.
  - id: http-task-file-upload-and-code-execution
    desc: Remote-code evaluation alongside HTTP-selected reads and uploads
    crit: hostile
    attack: T1041,T1059.007
    scope: file
    all:
      - id: http-selected-file-read-and-upload
      - id: objectives/execution/payload/script-eval::http-response-eval
