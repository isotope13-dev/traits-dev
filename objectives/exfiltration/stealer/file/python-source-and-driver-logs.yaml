defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  - id: python-posts-system-driver-text
    desc: Posts System32 driver text logs
    crit: hostile
    conf: 0.96
    attack: T1005,T1041
    scope: file
    all:
      - id: micro-behaviors/fs/path/system::python-system32-drivers-join
      - id: micro-behaviors/fs/directory/readdir::python-text-and-log-globs
      - id: micro-behaviors/communications/http/request/body::python-post-content-field

  - id: python-source-upload-to-transform-service
    desc: Sends local Python source to a remote transform service
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    mbc: E1005
    all:
      - id: micro-behaviors/fs/read/file/handle::file-open-content
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/communications/http/url/domain::workers-dev-domain
      - id: micro-behaviors/communications/http/url/path::code-transform-endpoint-path
