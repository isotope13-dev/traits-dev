defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  - id: python-source-upload-to-transform-service
    desc: Sends local Python source to a remote transform service
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    mbc: E1005
    all:
      - id: micro-behaviors/fs/read/file/handle::file-open-content
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/communications/url/host/domain-http::workers-dev-domain
      - id: micro-behaviors/communications/url/http-path::code-transform-endpoint-path
