# The public form reflects the supplied email into outgoing mail. The required
# comment injection and external file selection support a file-exfiltration
# attempt only alongside a POST request or client operation. The static payload
# cannot prove delivery or a successful file read.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html]

composite_rules:
  - id: frappe-email-renderer-file-exfiltration
    desc: Frappe form payload smuggles local file into outgoing email
    crit: hostile
    conf: 0.99
    attack: T1190,T1048
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/services/frappe::web-form-accept-endpoint
      - id: micro-behaviors/communications/http/services/frappe::account-deletion-form-selector
      - id: objectives/evasion/security-bypass/input-validation::email-comment-embed-directive
      - id: objectives/collection/file-targeting/filter::renderer-embed-external-path
    any:
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/post::http-post-client-call
      - id: micro-behaviors/communications/http/post::powershell-post-method
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
