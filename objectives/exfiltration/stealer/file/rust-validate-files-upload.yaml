defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041

traits:
  - id: rust-connected-file-upload-ssh-write
    desc: Linked Rust file-upload and SSH-key writes
    crit: suspicious
    conf: 0.98
    for: [crate, tar, zip]
    if:
      type: value
      path: cargo_context.targets[*].behaviors
      exact: connected-file-upload-and-ssh-write
  - id: rust-file-exfil-endpoint
    desc: Rust file exfiltration endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /api/validate/files
composite_rules:
  - id: rust-file-content-exfiltration
    desc: Rust file content exfiltration
    crit: suspicious
    conf: 0.98
    all:
      - id: rust-file-exfil-endpoint
    any:
      - id: micro-behaviors/data/encode/base64::rust-file-content-base64-field
      - id: objectives/exfiltration/stealer/dev-secret::rust-project-env-exfil-endpoint
      - id: objectives/exfiltration/http/env::rust-env-content-field
  - id: rust-crate-file-exfiltration-with-ssh-persistence
    desc: Rust file uploads with SSH-key persistence
    crit: hostile
    conf: 0.99
    scope: archive
    for: [crate, tar, zip, rust]
    attack: "T1041,T1098.004"
    all:
      - id: rust-connected-file-upload-ssh-write
      - id: micro-behaviors/fs/write/file/target::rust-authorized-keys-write
