defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002
composite_rules:
  - id: init-sensitive-file-exfil
    desc: Import time file exfiltration
    crit: hostile
    conf: 0.97
    mbc: E1041
    attack: T1020
    near_lines: 30
    all:
      - id: metadata/file/size::init-py-file
      - id: micro-behaviors/fs/read/file/handle::file-open-content
      - id: micro-behaviors/fs/read/file/content/unspecified::file-read-content
      - id: objectives/exfiltration/oob/callback::webhook-file-post
    any:
      - id: micro-behaviors/fs/path/challenge-flag::ctf-flag-target
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
