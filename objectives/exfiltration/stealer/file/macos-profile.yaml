# Reading a browser's on-disk cookie store and transmitting it is credential
# exfiltration regardless of the source language or HTTP library. Keep the
# path atoms neutral; this objective supplies intent only when an outbound
# HTTP transfer capability is present in the same file or package.
defaults:
  platforms: [macos]
  for: [scripts, source, class, java_class, jar]
  attack: T1555.003,T1041

composite_rules:
  - id: macos-browser-cookie-store-http-exfil
    desc: Sends macOS browser cookie store over HTTP
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/communications/http/client/
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/download/curl::curl
      - id: micro-behaviors/communications/http/download/curl::curl-silent-fail-flags-embedded-text
    needs: 1
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
      - id: well-known/lib/development/browser-cookie3/
      - id: well-known/tool/media/yt-dlp/
      - id: well-known/tool/media/gallery-dl::package-context

  - id: jvm-macos-browser-cookie-http-exfil
    desc: JVM sends macOS browser cookie store
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    scope: archive
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path-class
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/communications/http/client/
    needs: 1
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/

  - id: perl-browser-cookie-safe-storage-http-exfil
    desc: Perl package reads browser cookies and posts them
    crit: hostile
    conf: 0.98
    for: [perl]
    scope: archive
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/password-store::chrome-safe-storage
      - id: micro-behaviors/communications/http/post::perl-post-method-call
    unless:
      - id: metadata/package/testing/
