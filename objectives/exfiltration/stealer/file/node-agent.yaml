defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1041
  mbc: B0030

composite_rules:
  - id: remote-host-profile-and-file-upload
    desc: Remote host profile with arbitrary file upload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/fs/directory/enumerate::node-dirent-directory-walk
      - id: micro-behaviors/communications/http/url/api-path/telemetry::telemetry-upload-download-endpoint
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
