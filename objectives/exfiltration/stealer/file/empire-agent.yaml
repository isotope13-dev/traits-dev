defaults:
  for: [python]
  platforms: [unix, windows]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: python-agent-file-chunks
    desc: Empire agent encodes local file chunks into task-response packets
    all:
      - id: well-known/tool/offensive/powershell-empire::empire-agent-protocol
      - id: well-known/tool/offensive/powershell-empire::python-file-chunk-read
      - id: well-known/tool/offensive/powershell-empire::python-file-response-packet
      - id: micro-behaviors/data/encode/base64::b64encode-call
