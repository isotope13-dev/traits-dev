defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

composite_rules:
  # GuardDog: Sensitive file exfiltration
  - id: js-sensitive-file-exfiltration
    desc: Sensitive file read and exfiltration (JS)
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
        # A credential/config read near an unrelated POST is not exfiltration;
        # require evidence that file-like data is placed into the request body.
    - id: objectives/exfiltration/sensitive-data/source::js-sensitive-file-request-body
    - id: micro-behaviors/communications/http/request/body::http-upload-or-body-sink
    unless:
      - id: micro-behaviors/communications/http/oauth/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/build/
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
      - id: well-known/app/ai/browser-agent/pi-web-access::gemini-video-upload-module
      # Local inference gateways read ~/.env for upstream API keys and forward
      # chat payloads to the configured base URL — not credential theft.
      - id: well-known/app/ai/gateway/inboost-ai-proxy::archive-context
    downgrade:
      any:
        - id: metadata/signed/platform/
