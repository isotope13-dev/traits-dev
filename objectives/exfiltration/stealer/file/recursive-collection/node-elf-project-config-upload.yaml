defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1005,T1041,T1083
traits:
- id: node-elf-project-walk
  desc: Traverses working directory for files
  crit: notable
  if:
    type: text
    substr: walkDir(process.cwd(), 'project')
- id: node-elf-project-env-target
  desc: Selects project environment files
  crit: notable
  if:
    type: text
    substr: lower === '.env'
- id: node-elf-project-request
  desc: Sends collected data in request
  crit: notable
  if:
    type: text
    substr: lib.request(options
composite_rules:
- id: node-elf-project-config-upload
  desc: Uploads files found in project directory
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-elf-project-walk
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-elf-project-env-target
  - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-elf-project-request
  - id: micro-behaviors/communications/http/request/body/construction::node-request-write-variable
