defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1083,T1041
traits:
- id: node-hex-env-key-filters
  desc: Selects env and key files by hex
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?s)["']2e656e76["'].{0,300}["']2e6b6579["']
- id: node-recursive-file-content-array
  desc: Recursively collects file contents into array
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /\.readdir\s*\(/s
          $b0_1 = /\.isDirectory\s*\(\s*\)/s
          $b0_2 = /\.isDirectory\s*\(\s*\)/s
          $b0_3 = /await\s+\w+\s*\(/s
          $b0_4 = /\.readFile\s*\(/s
          $b0_5 = /\.push\s*\(\s*\{\s*file\s*:[^}]+data\s*:/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 150 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 150 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 150 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
- id: node-encoded-url-posts-content
  desc: Posts content to a base64 encoded endpoint
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?s)["'']aHR0cHM6Ly9[A-Za-z0-9+/=]{16,}["''].{0,300}JSON\.stringify\s*\(\s*\{\s*content\s*:'
composite_rules:
- id: node-encoded-config-key-content-exfil
  desc: Sends recursively collected config and key files
  crit: hostile
  conf: 0.995
  scope: file
  near_bytes: 6000
  all:
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-hex-env-key-filters
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-recursive-file-content-array
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-encoded-url-posts-content
