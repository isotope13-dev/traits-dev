defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1555.005,T1041
  mbc: B0028,B0030
composite_rules:
- id: node-project-wallet-credential-post
  desc: Posts collected project and wallet credentials
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: micro-behaviors/fs/path/credential::secret-or-npm-config-and-wallet-paths
  - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  - id: micro-behaviors/communications/http/post::node-http-request-post
  any:
  - id: micro-behaviors/data/compress::gzip-writer-api-call
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  near_bytes: 5000
- id: node-wallet-key-config-post
  desc: Posts wallet keystore and its config after reading them
  crit: hostile
  conf: 0.96
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/wallet::wallet-key-config-pair
  - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  any:
  - id: micro-behaviors/communications/http/request/body/construction::node-http-json-end-body
  - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::js-fetch-post-request
- id: python-wallet-key-config-post
  desc: Posts wallet keystore and its config after reading them
  crit: hostile
  conf: 0.95
  for:
  - python
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/wallet::wallet-key-config-pair
  - id: micro-behaviors/fs/read/file/content/whole::file-read-content
  any:
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
  - id: micro-behaviors/communications/http/request/json::python-post-json-method
