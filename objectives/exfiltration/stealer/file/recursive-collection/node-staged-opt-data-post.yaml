defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1005,T1041,T1083
traits:
- id: node-opt-gather-directory
  desc: Gathers opt directory data
  crit: notable
  if:
    type: text
    substr: function gatherOptData()
- id: node-opt-gather-content
  desc: Puts gathered data in request content
  crit: notable
  if:
    type: text
    substr: 'content: gatherOptData()'
- id: node-opt-gather-http-request
  desc: Constructs HTTP request for gathered data
  crit: notable
  if:
    type: text
    substr: http.request(options
composite_rules:
- id: node-staged-opt-data-post
  desc: Stages opt file collection and HTTP upload
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-opt-gather-directory
  - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-opt-gather-content
  - id: objectives/exfiltration/stealer/file/recursive-collection::node-opt-gather-http-request
  - id: micro-behaviors/communications/http/post::request-options-post-method
