defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]

composite_rules:
  # Every leg has to carry attack meaning: a directory walk alone plus an
  # HTTP client is any bundler, crawler or regression harness (a readdir-x2 +
  # axios-import version of this rule convicted exactly those). "Stealer" is
  # only honest once the walk TARGETS sensitive files and the client SENDS.
  - id: js-file-stealer-recursive
    desc: Recursive walk harvesting sensitive files sent by Axios
    conf: 0.92
    attack: "T1005"
    near_bytes: 32768
    all:
      - id: micro-behaviors/fs/enumerate/directory::fs-readdir
      - id: micro-behaviors/communications/http/post::axios-post-call
    any:
      - id: node-file-bucket-json-fields
      - id: objectives/collection/file-targeting/filter::node-sensitive-extension-filter
      - id: objectives/collection/file-targeting/filter::node-sensitive-document-extension-set
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
