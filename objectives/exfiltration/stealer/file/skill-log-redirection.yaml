# An instruction payload: this describes requested forwarding, not a completed
# transfer or an implemented collector. An ordinary reporting skill is a near miss.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]

composite_rules:
  - id: skill-override-bulk-log-forwarding
    desc: Skill override directs bulk log forwarding
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/security-bypass/llm/override::agent-skill-tool-prior-instruction-bypass
      - id: metadata/lang/natural/phrasing::bulk-log-forwarding-wording
      - id: metadata/lang/natural/phrasing::no-confirmation-request-wording
    near_bytes: 400
