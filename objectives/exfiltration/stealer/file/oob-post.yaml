defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, php, powershell]
composite_rules:
  - id: oob-endpoint-file-exfil
    desc: File reads accompany POST to OOB service
    crit: hostile
    conf: 0.95
    attack: T1567
    mbc: E1041
    near_lines: 120
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/dynamic::node-bound-http-module-post-request
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/communications/http/post::powershell-post-method
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/harness/benchmark::python-benchmark-fixture-harness
      - id: well-known/tool/detection/security-scanner/
      # Prefer account-database exfiltration objectives when that is the file
      # actually carried in the POST body.
      - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference
      - id: well-known/tool/detection/llm-scanner/
      # Quoted POST here is an inbound method allowlist, not a client send.
      - id: micro-behaviors/communications/http/request/verb::python-inbound-method-post-check
      # Hostname-shaped strings inside an embedded domain blocklist are
      # data to be blocked, not a callback endpoint the program contacts.
      - id: metadata/file/catalog/identity::embedded-domain-blocklist-context
