defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1041
  mbc: E1041
composite_rules:
  - id: native-file-payload-exfil
    desc: Native file payload exfiltration
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/stat::cxx-get-file-size-symbol
      - id: objectives/command-and-control/backdoor/tasking/payload::cxx-send-payload-symbol
    any:
      - id: micro-behaviors/fs/read/file/descriptor::read
      - id: micro-behaviors/fs/read/file/handle::fread
      - id: micro-behaviors/fs/file/open::fopen
