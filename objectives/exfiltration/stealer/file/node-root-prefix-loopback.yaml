defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: node-fl-prefixed-file-loopback-http-exfil
  desc: Node sends fl-prefixed files to loopback HTTP
  crit: hostile
  conf: 0.99
  attack: T1005,T1041
  for: [npm, javascript]
  scope: file
  all:
  - id: micro-behaviors/fs/read/file/full::node-read-root-joined-file
  - id: micro-behaviors/communications/http/request/body/file::node-request-writes-json-file-content
  - id: micro-behaviors/fs/read/file/full::readfilesync-call
  - id: micro-behaviors/communications/ip/endpoint::javascript-loopback-hostname-property
  - id: micro-behaviors/communications/http/request/result::http-put-method
  - id: micro-behaviors/communications/http/request/body/construction::request-write-payload-variable
  - id: micro-behaviors/data/string/search::javascript-fl-string-prefix-check
  any:
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/client::node-http-imported-request-stream
  - id: micro-behaviors/communications/http/request/body/construction::node-bound-request-write-end

