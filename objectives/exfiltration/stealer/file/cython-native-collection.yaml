# The outer package scope joins the native scanner and publisher modules in a
# wheel. The function identifiers are native Cython metadata strings, while
# the IP-embedded sslip host is an endpoint embedded in the same package.
defaults:
  platforms: [windows]
  for: [whl, pe]
  attack: T1005,T1041
  mbc: B0030

composite_rules:
  - id: native-file-discovery-and-signed-upload
    desc: Native extension discovers data files and uploads them to an embedded endpoint
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/binary/symbols/name/qualified::cython-filesystem-root-discovery-name
      - id: metadata/binary/symbols/name/qualified::cython-selected-data-file-filter-name
      - id: metadata/binary/symbols/name/qualified::cython-filesystem-root-walk-name
      - id: metadata/binary/symbols/name/qualified::cython-file-publisher-name
      - id: metadata/binary/symbols/name/qualified::cython-single-file-upload-name
      - id: metadata/binary/symbols/name/qualified::cython-signed-url-request-name
      - id: micro-behaviors/communications/url/host/domain-http::sslip-io-ip-hostname


