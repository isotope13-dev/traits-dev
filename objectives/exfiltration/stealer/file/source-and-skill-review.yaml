composite_rules:
- id: admin-share-archive-cloud-exfiltration
  platforms:
  - unix
  - windows
  attack: T1560.001,T1567.002
  desc: Admin-share archive and cloud transfer co-occur
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/archive/create/utility::archive-with-network-share-reference
  - id: micro-behaviors/os/network/share::windows-admin-share-path
  - id: micro-behaviors/fs/path/personal::windows-documents-or-desktop-path
  any:
  - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
  - id: micro-behaviors/communications/transfer::backblaze-b2-upload-sync-command
- id: rar-share-staging-cloud-exfil
  platforms:
  - windows
  - unix
  desc: RAR, admin-share and cloud-copy commands co-occur
  crit: suspicious
  mbc: E1567.002
  attack: T1560.001,T1567.002
  conf: 0.98
  all:
  - id: micro-behaviors/data/archive/create/utility::rar-archive-command
  - id: micro-behaviors/os/network/share::windows-admin-share-path
  - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
  - id: micro-behaviors/communications/transfer::backblaze-b2-upload-sync-command
- id: admin-share-cloud-transfer-recovery-sabotage
  desc: Admin-share archive transfer accompanies recovery sabotage
  crit: hostile
  conf: 0.99
  platforms:
  - windows
  attack: T1560.001,T1567.002,T1490
  all:
  - id: objectives/impact/degrade/system/recovery::multi-mechanism-recovery-inhibition
  any:
  - id: admin-share-archive-cloud-exfiltration
  - id: rar-share-staging-cloud-exfil
defaults:
  for:
  - batch
  - powershell
