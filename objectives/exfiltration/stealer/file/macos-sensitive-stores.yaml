defaults:
  platforms: [macos]
  for: [scripts, source, binaries]
  attack: T1041

# A native or scripted macOS stealer can change languages and APIs while the
# workflow remains stable: prompt for the login password, read both Safari and
# Notes stores, then issue an HTTP request.  The individual reads and request
# are neutral capabilities; this combination is the attack pattern.
composite_rules:
  - id: macos-sensitive-store-password-exfil
    desc: macOS sensitive-store theft after password phishing
    crit: hostile
    conf: 0.99
    attack: T1005,T1041,T1056.002,T1555.003
    all:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: micro-behaviors/fs/path/sensitive/apple::apple-notes-store
      - id: micro-behaviors/fs/path/sensitive/apple::safari-binary-cookies
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/fs/file/read/
