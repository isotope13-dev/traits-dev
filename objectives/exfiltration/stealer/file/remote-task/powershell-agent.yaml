defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1041
composite_rules:
- id: powershell-agent-file-chunk-transfer
  desc: Task agent sends local file chunks as responses
  crit: hostile
  all:
  - id: objectives/command-and-control/remote-command/dispatch/eval::powershell-agent-encrypted-task-channel
  - id: micro-behaviors/fs/file/open/read::powershell-file-openread
  - id: micro-behaviors/data/encode/base64/primitive::to-base64-string
  - id: micro-behaviors/communications/transfer::powershell-file-chunk-response-block
