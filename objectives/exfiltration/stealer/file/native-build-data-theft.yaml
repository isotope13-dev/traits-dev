# A native build action is attacker-controlled JavaScript. These rules identify
# filesystem collection and environment harvesting sent to a remote HTTP sink.
defaults:
  platforms: [unix, windows]
  for: [gyp]
  attack: T1195.002,T1041

composite_rules:
  - id: native-build-filesystem-exfiltration
    desc: Native build action collects host files and posts them remotely
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, gyp]
    mbc: E1041
    all:
      - id: metadata/build/package/recipe/native::gyp-build-action
      - id: micro-behaviors/fs/search/command::shell-filesystem-collection
      - id: micro-behaviors/communications/http/webhook::webhook-http-post
      - id: micro-behaviors/communications/http/request/verb::post-method
