defaults:
  platforms: [windows]
  for: [whl, python-sdist, pkginfo, python]
composite_rules:
  - id: wallpaper-facade-remote-file-results
    desc: Wallpaper facade conceals HTTP file-read results
    crit: hostile
    conf: 0.99
    attack: T1036,T1005,T1041
    scope: archive
    all:
      - id: metadata/package/description/function::wallpaper-rotator-summary
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
      - id: micro-behaviors/communications/http/request/tasking::python-poll-shell-handler-result-profile
      - id: micro-behaviors/data/encode/base64::python-file-read-base64-result
