# C# source that searches local files and mails them as attachments.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1005,T1041
  mbc: E1041

composite_rules:
  - id: csharp-smtp-file-exfiltration
    desc: C# searches local files and emails them as attachments
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/traversal/drives::directory-get-logical-drives-source
      - id: micro-behaviors/fs/enumerate/directory::get-files
      - id: micro-behaviors/fs/enumerate/directory::get-directories
      - id: micro-behaviors/communications/email/send/smtp::smtp-client
      - id: micro-behaviors/communications/email/send/smtp::smtp-client-send-message
      - id: micro-behaviors/communications/email/send/smtp::smtp-dotnet-attachment-add
