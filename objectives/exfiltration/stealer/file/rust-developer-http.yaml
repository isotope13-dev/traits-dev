defaults:
  platforms: [windows, unix]
  for: [rust]

composite_rules:
  # Reads authentication configuration and pipes the collected contents to a
  # remote curl request body: credential export over HTTP.
  - id: rust-developer-credential-http-exfil
    desc: Rust uploads developer-auth file contents
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/credential::developer-auth-file-reference
      - id: micro-behaviors/fs/read/file/full::rust-read-to-string
      - id: micro-behaviors/communications/http/curl::curl-data-binary
      - id: micro-behaviors/communications/http/url/endpoint::explicit-http-request-destination
