defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

composite_rules:
- id: applescript-grabber-zip-exfil
  for: [applescript]
  desc: AppleScript zip archive grabber upload
  crit: hostile
  conf: 0.96
  attack: T1041
  all:
  - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
  - id: objectives/exfiltration/http/upload::grabber-endpoint
  - id: objectives/collection/archive/create::applescript-tmp-archive-create
  - id: objectives/credential-access/theft/multi-store::applescript-grabber-collection-signal
# Handler-independent full-infostealer verdict. The family composite above
# (applescript-macsync-style-stealer) requires helper-handler-bundle — three
# NAMED handler functions (filegrabber, chromium,
# uploadToC2 ...) that numerically-obfuscated variants rename out of reach. This
# capstone drops the function-name leg and rests on four independent behavioral
# clusters that all describe a stealer: mass app-data collection, /tmp staging
# layout, credential phishing, and exfiltration. Their co-occurrence in one
# script has no benign explanation regardless of how handlers are named.

# The same payload can be carried as an LCG-XOR-encrypted AppleScript inside a
# Mach-O launcher. stng decodes that stream only when its script markers match;
# these existing behavior rules then see the recovered body as text. Require
# independent wallet theft, a validated keychain phish, persistence, and an
# application replacement before calling the native carrier a full stealer.
- id: macho-amos-wallet-keychain-persistence
  desc: Persistent macOS wallet and keychain stealer
  crit: hostile
  conf: 0.99
  for: [macho]
  attack: T1555.001,T1547.015,T1204.001
  all:
  - id: objectives/credential-access/keychain/theft::login-keychain-phish-signal
  - id: micro-behaviors/fs/path/wallet::multi-desktop-wallet-targets
  - id: objectives/persistence/system/launchd/submit::wallet-launch-at-load
  - id: objectives/lateral-movement/trojanize/app::ledger-trojanize
