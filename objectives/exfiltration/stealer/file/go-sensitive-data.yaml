defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [binaries, scripts, source, manifests, documents, media, data]
  attack: T1041
  mbc: B0030

composite_rules:
  - id: go-file-http-exfiltration
    desc: Sensitive file read and HTTP exfiltration (Go)
    crit: hostile
    conf: 0.95
    all:
    - id: micro-behaviors/fs/read/file/handle::read-go
    - id: micro-behaviors/communications/http/post::http-post-methods
    any:
    - id: micro-behaviors/fs/path/credential::any-credential-path
    - id: micro-behaviors/fs/path/app-data/
    downgrade:
      any:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

