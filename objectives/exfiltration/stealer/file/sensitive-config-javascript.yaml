# Discord Credential Exfiltration - JavaScript
# Detects exfiltration of credentials to Discord webhooks
# ATT&CK: T1552.001 (Credentials In Files), T1567 (Exfiltration Over Web Service)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: js-sensitive-file-target
    desc: Targets sensitive configuration files
    crit: component
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/filename-credential::sensitive-file-name
    any:
      - id: micro-behaviors/fs/read/file/full::read-node
      - id: micro-behaviors/fs/enumerate/directory::fs-readdir
    unless:
      - id: well-known/lib/format/dotenv::recognized-dotenv-default-path
      - id: well-known/lib/format/dotenv::recognized-dotenv-env-population
