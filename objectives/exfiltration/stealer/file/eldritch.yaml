# Eldritch's report.file API sends a local host file to Tavern.
defaults:
  for: [text]
  platforms: [unix, windows]
  attack: T1041

traits:
  - id: eldritch-host-file-report
    desc: Eldritch reports host files to Tavern
    crit: suspicious
    if:
      type: text
      regex: '\breport\s*\.\s*file\s*\('
