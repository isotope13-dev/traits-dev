defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-shell-history-exfiltration
    desc: Node reads shell history and sends it over HTTP
    crit: hostile
    attack: "T1552.003,T1041"
    mbc: "E1552,E1041"
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/personal::shell-history-file-path
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    any:
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/body::request-write-call
      - id: micro-behaviors/communications/http/upload::node-local-file-formdata-stream
    unless:
      - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
