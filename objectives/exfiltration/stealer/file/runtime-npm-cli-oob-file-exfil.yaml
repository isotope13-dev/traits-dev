defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: npm-cli-oob-file-exfil
    for: [npm, package.json, javascript]
    desc: npm CLI performs OOB file exfiltration
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: objectives/exfiltration/stealer/file::oob-endpoint-file-exfil
