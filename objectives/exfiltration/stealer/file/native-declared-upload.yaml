defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.98
traits:
- id: declared-stealer-upload-header
  desc: Declares a stealer HTTP upload channel
  crit: notable
  if:
    type: text
    regex: (?i)\bX-(Info)?Stealer-Upload\s*:\s*true\b
composite_rules:
- id: native-declared-stealer-file-upload
  desc: Stealer file-read and HTTP-upload API profile
  crit: hostile
  attack: T1041
  all:
  - id: declared-stealer-upload-header
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/communications/http/client/wininet::http-send-request
  - id: micro-behaviors/communications/http/post::native-post-method-token
  - id: micro-behaviors/communications/http/header/custom::host-identity-header
