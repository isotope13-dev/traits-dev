# Stateful user-file collectors that use the GitHub Contents API as an
# exfiltration channel. The rules describe the collection and transfer shape;
# repository names, access tokens, state filenames, and folder-age constants
# are intentionally excluded so variants can change them freely.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1005,T1119,T1567.001

composite_rules:
  - id: powershell-recent-user-files-github-exfil
    desc: Recently modified user files are encoded and uploaded to GitHub
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/location::powershell-common-user-folders
      - id: objectives/collection/file-targeting/enumeration::powershell-recent-recursive-file-filter
      - id: micro-behaviors/fs/read/file/full::read-all-bytes
      - id: micro-behaviors/data/encode/base64::to-base64-string
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow

  - id: powershell-incremental-github-file-exfil
    desc: File modification state gates encoded uploads to GitHub
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/serialize/json::powershell-file-timestamp-state-map
      - id: micro-behaviors/fs/enumerate/directory::powershell-recursive-file-enumeration
      - id: micro-behaviors/fs/read/file/full::read-all-bytes
      - id: micro-behaviors/data/encode/base64::to-base64-string
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
