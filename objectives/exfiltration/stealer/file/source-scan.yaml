defaults:
  platforms: [unix, windows, macos]

composite_rules:
  - id: curl-with-file-targeting
    desc: HTTP client with sensitive file target
    crit: hostile
    conf: 0.95
    attack: T1041
    mbc: B0030
    for: [elf, pe]
    all:
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
    any:
      - id: objectives/collection/file-targeting/filter::sensitive-file-targeting
  - id: macos-file-copy-exfil
    desc: macOS file copying with sensitive file network context
    crit: suspicious
    conf: 0.9
    attack: T1041
    platforms:
      - macos
    for:
      - macho
    all:
      - id: micro-behaviors/fs/file/binary::fcopyfile-macos
      - id: objectives/collection/file-targeting/filter::sensitive-file-targeting
    any:
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
      - id: micro-behaviors/communications/socket/create/
    unless:
      - id: micro-behaviors/dylib/library/family/
      - id: well-known/lib/runtime/managed/jvm::runtime-network-library-basename
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports
        - id: metadata/lang/compiler/systems/
  - id: recursive-file-theft
    desc: Recursive directory scan with sensitive file targeting and network context
    crit: hostile
    conf: 0.95
    attack: T1005
    mbc: B0030
    for: [binaries, scripts]
    all:
      - id: micro-behaviors/fs/directory/traverse::directory-enumeration-or-traversal
      - id: objectives/collection/file-targeting/filter::sensitive-file-targeting
    any:
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
      - id: micro-behaviors/communications/socket/create/
    unless:
      - id: micro-behaviors/dylib/library/family/
      - id: metadata/signed/platform::apple
      - id: metadata/signed/id::com.apple.xpc.launchd
      - id: well-known/app/system/sq::go-module-path
      - id: well-known/app/system/remotepower::documented-rmm-release-context
    downgrade:
      any:
        - id: metadata/lang/compiler/systems/
