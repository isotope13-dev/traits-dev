# `bread <file> <off> <len> &bin` stages local file bytes and
# `sockwrite <sock> &bin` pushes the staging variable to the peer: a raw
# socket file upload with no DCC handshake, the backdoor's quiet exfil path.
defaults:
  platforms: [unix, windows]
  for: [mirc]
  attack: T1041
traits:
  # `.filter -wf <query> <outfile> *` copies the query window's lines into a
  # staging file: the harvest half of chat-log theft.
  - id: mirc-filter-query-to-file
    desc: mIRC filters query lines into file
    crit: notable
    conf: 0.9
    for: [mirc, text, data]
    if:
      type: text
      regex: '(?i)\.filter\s+-wf\s+\S+\s+\S+\s+\*'
  # `.timersend <n> 3 /sending`: a timer drips the staged lines to the owner
  # a few seconds apart, staying under flood limits.
  - id: mirc-timer-send-lines
    desc: mIRC timer drips staged lines out
    crit: notable
    conf: 0.9
    for: [mirc, text, data]
    if:
      type: text
      regex: '(?i)\.timer\w*\s+\S+\s+\d+\s+/send'
  # `.msg %owner $read -l <n> <file>`: one staged line walks to the operator.
  - id: mirc-msg-owner-read-line
    desc: mIRC messages owner a file line
    crit: notable
    conf: 0.9
    for: [mirc, text, data]
    if:
      type: text
      regex: '(?i)\.msg\s+%owner\s+\$read\b'
composite_rules:
  - id: mirc-socket-staged-file-upload
    desc: mIRC uploads file over raw socket
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-bread-binary-transfer
      - id: objectives/command-and-control/channel/irc/client::mirc-sockwrite-binary-var
  # Harvest, drip, deliver: filtered query lines staged to a file, a timer
  # pacing them out, and each line messaged to the operator is chat-log
  # theft over IRC, no DCC transfer in sight.
  - id: mirc-chat-log-line-theft
    desc: mIRC RAT exfiltrates chat logs line by line
    crit: hostile
    conf: 0.95
    for: [mirc, text, data]
    all:
      - id: mirc-filter-query-to-file
      - id: mirc-timer-send-lines
      - id: mirc-msg-owner-read-line
