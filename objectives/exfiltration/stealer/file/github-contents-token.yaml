defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1567.001

composite_rules:
  - id: github-repo-contents-token-exfil-rest
    desc: GitHub repository exfiltration with harvested npm token
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/github::github-create-repo
      - id: micro-behaviors/fs/read/file/target::node-file-content-record
      - id: micro-behaviors/data/format/credentials::npm-token-regex-format
