defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

  mbc: E1041
  attack: T1005
composite_rules:
- id: npm-install-opt-file-theft
  desc: Install hook steals /opt file data
  crit: hostile
  conf: 0.995
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: objectives/collection/file-targeting/filter::opt-santa-file-targeting
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  any:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: metadata/lang/source/syntax/call/member::req-write-call-prefix-text-reference
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
- id: js-opt-file-theft-exfil
  desc: JS steals /opt file data
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/collection/file-targeting/filter::opt-santa-file-targeting
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  any:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: metadata/lang/source/syntax/call/member::req-write-call-prefix-text-reference
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
- id: js-shell-opt-file-post-exfil
  for:
  - javascript
  desc: JS shell POSTs /opt file content
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/reference::santa-list-path
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: objectives/exfiltration/stealer/file::js-shell-curl-file-exfil
