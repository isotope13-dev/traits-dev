defaults:
  platforms: [windows]
  for: [whl, python-sdist, pkginfo, python]
composite_rules:
  - id: code-synthesis-facade-remote-file-results
    desc: Code synthesis facade conceals HTTP file-read results
    crit: hostile
    conf: 0.99
    attack: T1036,T1005,T1041
    scope: archive
    all:
      - id: metadata/package/description/function::summary-claims-code-synthesis
      - id: micro-behaviors/process/create/subprocess::pythonw-windowless-subprocess-code
      - id: micro-behaviors/communications/http/request/tasking::python-poll-shell-handler-result-profile
      - id: micro-behaviors/data/encode/base64::python-file-read-base64-result
