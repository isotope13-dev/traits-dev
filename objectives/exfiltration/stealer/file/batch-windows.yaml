defaults:
  platforms: [windows]
  for: [batch]
  attack: T1005,T1041,T1560.001

composite_rules:
  - id: batch-sensitive-archive-exfiltration
    desc: Batch uploads an archive from sensitive-data collection
    crit: hostile
    conf: 0.99
    near_lines: 140
    all:
      - id: objectives/collection/file-targeting/command::sensitive-collection-switch
      - id: micro-behaviors/fs/path/archive::windows-archive-path
      - id: micro-behaviors/communications/http/upload::curl-upload-file
