defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

traits:
- id: node-file-bucket-json-fields
  desc: File exfiltration JSON buckets
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: "envFiles.{0,80}jsonFiles.{0,80}docFiles"
- id: node-import-time-stealer-launch
  desc: Import-time stealer launch chain
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "exports\\[.{1,80}\\]\\)\\(\\)\\[.{1,40}\\]\\(_0x[0-9a-f]+=>__awaiter"
composite_rules:
- id: node-file-content-record
  desc: Node records paths and contents after reading files
  crit: suspicious
  conf: 0.84
  all:
  - id: micro-behaviors/fs/read/file/target::js-file-path-content-record
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  unless:
    - id: well-known/lib/development/vscode::require-vscode
    - id: well-known/lib/development/vscode::vscode-extension-marker
    - id: metadata/package/runtime::vscode-extension
    - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
- id: node-sensitive-file-fetch-exfil
  desc: Node sensitive files sent by fetch
  crit: hostile
  conf: 0.97
  all:
  - id: node-file-bucket-json-fields
  - id: micro-behaviors/communications/http/request/client::fetch-json-body
  any:
  - id: node-file-content-record
  - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
  - id: objectives/collection/file-targeting/filter::node-sensitive-extension-filter
  - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
- id: node-recursive-archive-upload
  desc: Recursive file archive uploaded by Node
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
  - id: micro-behaviors/data/compress/gzip::node-gzip-stream-archive
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  any:
  - id: micro-behaviors/process/hook/webextension::client-identity-headers
  - id: node-file-bucket-json-fields
- id: node-import-time-file-stealer
  desc: Import-time Node file stealer
  crit: hostile
  conf: 0.97
  all:
  - id: node-import-time-stealer-launch
  - id: node-sensitive-file-fetch-exfil
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
- id: node-sensitive-files-formdata-exfil
  desc: Node sensitive files uploaded by multipart FormData
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/form::node-formdata-file-stream-field
  - id: micro-behaviors/communications/http/lib/axios::node-axios-formdata-post
  - id: objectives/collection/file-targeting/filter::node-sensitive-document-extension-set
  any:
  - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
  - id: micro-behaviors/fs/enumerate/directory::fs-readdir
  - id: micro-behaviors/fs/traversal/drives::node-windows-drive-enumeration
  - id: objectives/supply-chain/recon-exfil/registry/probe::node-remote-tasking-pattern-endpoints
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
  - id: metadata/build/bundler/asset::js-large-module-bundle
