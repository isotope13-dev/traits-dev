defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-sensitive-file-fetch-exfil
  desc: Node sensitive files sent by fetch
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/data/serialize/schema-credential::node-file-bucket-json-fields
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  any:
  - id: micro-behaviors/fs/read/file/target::node-file-content-record
  - id: micro-behaviors/fs/directory/traverse::node-dirent-directory-walk
  - id: objectives/collection/file-targeting/filter::node-sensitive-extension-filter
  - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
- id: node-recursive-archive-upload
  desc: Recursive file archive uploaded by Node
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/directory/traverse::node-dirent-directory-walk
  - id: micro-behaviors/data/compress::node-gzip-stream-archive
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  any:
  - id: micro-behaviors/process/hook/webextension::client-identity-headers
  - id: micro-behaviors/data/serialize/schema-credential::node-file-bucket-json-fields
- id: node-import-time-file-stealer
  desc: Import-time Node file stealer
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/process/lifecycle/auto-exec::node-obfuscated-export-awaiter-invocation
  - id: node-sensitive-file-fetch-exfil
  - id: metadata/lang/source/declaration::hex-identifier-declarations
- id: node-sensitive-files-formdata-exfil
  desc: Node sensitive files uploaded by multipart FormData
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/form::node-formdata-file-stream-field
  - id: micro-behaviors/communications/http/lib/axios::node-axios-formdata-post
  - id: objectives/collection/file-targeting/filter::node-sensitive-document-extension-set
  any:
  - id: micro-behaviors/fs/directory/traverse::node-dirent-directory-walk
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-repeated
  - id: micro-behaviors/fs/enumerate/drives::node-windows-drive-enumeration
  - id: objectives/supply-chain/recon-exfil/registry/probe::node-remote-tasking-pattern-endpoints
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
  - id: metadata/build/bundler/asset::js-large-module-bundle
