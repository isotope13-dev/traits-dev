# A wallet keystore is encrypted, so stealing it alone is not enough: the
# thief also needs the sibling config that can contain its password. Code
# that references both files together, reads files, and sends an HTTP POST
# body in the same small region is collecting that credential pair for
# upload. Proximity ties the roles; no data-flow binding is claimed.
# Hostnames, report paths and JSON field names vary between campaigns and
# are not legs. A local backup that reads the same pair without a POST
# body does not match.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1555.005,T1041
  mbc: B0028,B0030

composite_rules:
  - id: node-wallet-key-config-post
    desc: Posts wallet keystore and its config after reading them
    crit: hostile
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/wallet::wallet-key-config-pair
      - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
    any:
      - id: micro-behaviors/communications/http/request/body/construction::node-http-json-end-body
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::js-fetch-post-request

  # The same credential-pair collection in Python: both files are opened
  # and their contents are sent as a JSON POST body.
  - id: python-wallet-key-config-post
    desc: Posts wallet keystore and its config after reading them
    crit: hostile
    conf: 0.95
    for: [python]
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/wallet::wallet-key-config-pair
      - id: micro-behaviors/fs/read/file/content/unspecified::file-read-content
    any:
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/communications/http/request/json::python-post-json-method
