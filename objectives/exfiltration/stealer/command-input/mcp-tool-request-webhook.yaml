defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1195.002
  mbc: E1041
traits:
- id: node-mcp-tool-request-and-host-profile-webhook
  desc: Sends MCP caller arguments to webhook
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /setRequestHandler\s*\(\s*["']tools\/call["']/is
          $b0_1 = /arguments\s*:\s*args/is
          $b0_2 = /(process\.env\.(HOME|USERPROFILE|USER|USERNAME)|os\.hostname\s*\(\)|process\.cwd\s*\(\))/is
          $b0_3 = /axios\.post\s*\(/is
          $b0_4 = /(webhook\.site|_getWebhook\s*\()/is
          $b1_0 = /setRequestHandler\s*\(\s*["']tools\/call["']/is
          $b1_1 = /request\.params/is
          $b1_2 = /arguments/is
          $b1_3 = /(process\.env\.(HOME|USERPROFILE|USER|USERNAME)|os\.hostname\s*\(\)|process\.cwd\s*\(\))/is
          $b1_4 = /axios\.post\s*\(/is
          $b1_5 = /(webhook\.site|_getWebhook\s*\()/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 3000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 3500 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 500 and
                      true
                    )
                  )
                )
              )
            )
          ) or
          (
            for any i0 in (1..#b1_0) : (
              for any i1 in (1..#b1_1) : (
                @b1_1[i1] >= (@b1_0[i0] + !b1_0[i0]) and
                @b1_1[i1] <= (@b1_0[i0] + !b1_0[i0]) + 1200 and
                for any i2 in (1..#b1_2) : (
                  @b1_2[i2] >= (@b1_1[i1] + !b1_1[i1]) and
                  @b1_2[i2] <= (@b1_1[i1] + !b1_1[i1]) + 300 and
                  for any i3 in (1..#b1_3) : (
                    @b1_3[i3] >= (@b1_2[i2] + !b1_2[i2]) and
                    @b1_3[i3] <= (@b1_2[i2] + !b1_2[i2]) + 3000 and
                    for any i4 in (1..#b1_4) : (
                      @b1_4[i4] >= (@b1_3[i3] + !b1_3[i3]) and
                      @b1_4[i4] <= (@b1_3[i3] + !b1_3[i3]) + 3500 and
                      for any i5 in (1..#b1_5) : (
                        @b1_5[i5] >= (@b1_4[i4] + !b1_4[i4]) and
                        @b1_5[i5] <= (@b1_4[i4] + !b1_4[i4]) + 500 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-mcp-tool-request-and-host-profile-exfil
  desc: MCP server exfiltrates tool inputs with local host profile data
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  scope: archive
  all:
  - id: micro-behaviors/communications/mcp/server::mcp-call-handler-forwards-tool-arguments
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
  any:
  - id: micro-behaviors/os/env/path::node-home-access
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/fs/directory/cwd::process-cwd-call
- id: npm-mcp-tool-input-webhook-exfil
  desc: MCP tool call arguments are forwarded to a webhook collector
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  scope: archive
  all:
  - id: micro-behaviors/communications/mcp/server::mcp-call-handler-forwards-tool-arguments
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
