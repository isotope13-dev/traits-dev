defaults:
  platforms: [unix, windows]
  for: [rust]
  conf: 0.98
  attack: T1552.001,T1041

composite_rules:
  - id: rust-wallet-private-key-curl-exfiltration
    desc: Posts environment wallet key through curl
    crit: hostile
    all:
      - id: micro-behaviors/os/env/secret-name::rust-wallet-private-key-env-read
      - id: objectives/exfiltration/serialization::rust-wallet-secret-json-template
      - id: micro-behaviors/communications/http/post::rust-curl-data-argument
      - id: micro-behaviors/process/create/direct::rust-command-curl-wget
      - id: micro-behaviors/process/create/direct::rust-spawn
