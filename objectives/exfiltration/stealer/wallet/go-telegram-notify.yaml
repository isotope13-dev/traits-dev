# Garble leaves the notification methods in the clear. The same type
# string also carries a Telegram update_id tag, which the string
# extractor drops because of the quotes.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.94

traits:
  - id: go-send-seed-notification-method
    desc: Go method sends a seed notification
    if:
      type: text
      substr: SendSeedNotification
  - id: go-send-clip-notification-method
    desc: Go method sends a clipboard notification
    if:
      type: text
      substr: SendClipNotification

composite_rules:
  - id: go-seed-clipboard-notifier
    desc: Go methods send seed and clipboard notifications
    crit: hostile
    conf: 0.97
    attack: T1041,T1115
    all:
      - id: go-send-seed-notification-method
      - id: go-send-clip-notification-method
