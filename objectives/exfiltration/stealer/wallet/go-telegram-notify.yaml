# Reversed implementation reads CF_UNICODETEXT, selects SEED_PHRASE,
# formats the seed and host report, and POSTs it to Telegram sendMessage.
# Require the clipboard-call and replacement profile, not notification names alone.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-obfuscated-clipboard-seed-notifier
    desc: Obfuscated seed and clipboard export profile
    crit: hostile
    conf: 0.98
    attack: T1041,T1115
    all:
      - id: micro-behaviors/communications/messaging/send::go-send-seed-notification-method
      - id: micro-behaviors/communications/messaging/send::go-send-clip-notification-method
      - id: metadata/binary/symbols/descriptor::go-telegram-payload-type-name
      - id: metadata/binary/symbols/descriptor::go-main-replace-method-name
      - id: metadata/binary/instruction/sequence::go-lazy-call-argument-thirteen
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
