# A Python wheel reads a wallet private key from the environment and sends
# JSON through urllib. Require the named secret, concrete POST body, and
# actual request sink in the same package.
defaults:
  platforms: [unix, windows]
  attack: T1552.001,T1041

composite_rules:
  - id: python-wallet-env-key-urllib-json-exfil
    desc: Python wheel posts a wallet private-key environment value as JSON
    crit: hostile
    conf: 0.98
    for: [python, whl]
    scope: archive
    near_lines: 120
    all:
      - id: objectives/credential-access/wallet/provider::polygon-private-key-env-name
      - id: micro-behaviors/os/env/read::python-os-getenv-call
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
