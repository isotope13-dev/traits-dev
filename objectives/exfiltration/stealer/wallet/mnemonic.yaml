# Wallet Mnemonic Exfiltration
# Mnemonic phrase theft with HTTP exfiltration
# ATT&CK: T1005 (Data from Local System) + T1041
defaults:
  platforms: [windows, unix]
  attack: "T1041"
traits: []
composite_rules:
  - id: stealer-pattern
    desc: Mnemonic phrase theft (extraction + HTTP exfil)
    crit: hostile
    conf: 0.95
    for: [python, javascript]
    all:
      - id: micro-behaviors/crypto/mnemonic::mnemonic-terms
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: objectives/credential-access/wallet/mnemonic::wallet-marker
    unless:
  - id: pe-clipboard-mnemonic-http-exfil
    desc: Windows mnemonic clipboard HTTP exfiltration
    crit: hostile
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/crypto/mnemonic::embedded-bip39-wordlist
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
  - id: pe-file-mnemonic-http-exfil
    desc: Windows mnemonic file HTTP exfiltration
    crit: hostile
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/crypto/mnemonic::embedded-bip39-wordlist
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
      - id: micro-behaviors/fs/enumerate/directory::find-first-file
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/communications/ip/literal::http-ip-url
    any:
      - id: objectives/collection/file-targeting/filter::mnemonic-extension-wide-glob
      - id: objectives/collection/file-targeting/filter::seed-extension-wide-glob
  - id: pe-wallet-seed-upload-exfil
    desc: Windows wallet seed file upload exfiltration
    crit: hostile
    conf: 0.97
    for: [pe, dll]
    all:
      - id: objectives/collection/file-targeting/filter::wallet-seed-keyword-glob-pe
      - id: micro-behaviors/communications/http/header/custom::pe-filename-header
    any:
      - id: micro-behaviors/communications/http/header/content-type::pe-octet-stream-content-type
      - id: micro-behaviors/communications/http/header/content-type::content-type-header
      - id: objectives/command-and-control/channel/http-beacon::chrome-spoof-user-agent-pe
  - id: ps-encoded-bip39-telegram-stealer
    desc: Encoded PowerShell mnemonic stealer
    crit: hostile
    conf: 0.97
    for: [powershell]
    all:
      - id: micro-behaviors/crypto/mnemonic::bip39-wordlist-encoded-fragments
      - id: objectives/exfiltration/messaging/telegram::telegram-bot-encoded-file-exfil
  - id: web-wallet-recovery-query-exfil
    desc: Web wallet recovery phrase exfiltration
    crit: hostile
    conf: 0.98
    for: [html, javascript, crx, xpi, zip]
    all:
      - id: micro-behaviors/ui/controls/wallet::web-mnemonic-entry-form
      - id: objectives/exfiltration/http/query::browser-query-data-exfil
  - id: web-wallet-recovery-json-post-exfil
    desc: Web wallet recovery phrase JSON POST exfiltration
    crit: hostile
    conf: 0.98
    for: [html, javascript, crx, xpi, zip]
    all:
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/ui/controls/wallet::seedword-input-name
      - id: micro-behaviors/communications/http/header/content-type::json-header
    any:
      - id: micro-behaviors/ui/controls/wallet::web-mnemonic-entry-form
      - id: micro-behaviors/ui/controls/wallet::web-seedword-entry-form
  - id: web-wallet-seed-json-post-exfil
    desc: Web wallet seed phrase JSON POST exfiltration
    crit: hostile
    conf: 0.99
    for: [html, javascript, crx, xpi, zip]
    all:
      - id: micro-behaviors/data/serialize/json::js-seed-json-field
      - id: micro-behaviors/crypto/mnemonic::assembled-seed-phrase-from-words
      - id: micro-behaviors/crypto/mnemonic::mnemonic-validate-check
    any:
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
      - id: micro-behaviors/communications/http/request/json::http-post-json
  # The evasive sibling of the JSON-post family above: the harvested secret
  # never appears in a seed-named field. Entered recovery material (recovery
  # words or a private key) is assembled, base64-encoded into an opaque
  # telemetry event property, and posted to a third-party analytics
  # collector, hiding it from secret scanners inside ordinary-looking
  # event traffic. The encoded-event property shape is the load-bearing leg:
  # real wallets validate mnemonics and run analytics, but they do not wrap
  # caller-supplied text in btoa() inside event properties.
  - id: web-wallet-secret-encoded-event-exfil
    desc: Wallet secret entry base64-posted as encoded telemetry event
    crit: hostile
    conf: 0.96
    for: [html, javascript, crx, xpi, zip]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/analytics::encoded-event-property
      - id: micro-behaviors/crypto/mnemonic::mnemonic-validate-check
    any:
      - id: micro-behaviors/ui/controls/credential::private-key-enter-label
      - id: micro-behaviors/ui/controls/wallet::wallet-mnemonic-entry-label
