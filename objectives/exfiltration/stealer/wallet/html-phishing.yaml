defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86

composite_rules:
  - id: wallet-seed-http-exfil
    desc: Collected wallet seed words sent to a remote HTTP endpoint
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    for: [javascript]
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/ui/controls/wallet::wallet-seed-word-field-code
      - id: micro-behaviors/data/property/access::js-value-property-read
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: bip39-autocomplete-seed-exfil
    desc: "Seed assembly with wordlist fetch and send"
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1041
    scope: file
    all:
      - id: micro-behaviors/crypto/mnemonic::bip39-wordlist-http-fetch
      - id: micro-behaviors/crypto/mnemonic::assembled-seed-phrase-from-words
    any:
      - id: objectives/exfiltration/sensitive-data/source::js-seed-phrase-request-field
      - id: objectives/exfiltration/sensitive-data/source::js-seed-request-field
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    needs: 1

  # Double-harvest lure from the same kit: the first submission is
  # exfiltrated, then a fake "Invalid seed" error prompts a second entry
  # that is also sent out. No comparison of the two entries happens, so the
  # error text beside a seed assembly and a seed-bearing POST is purely a
  # collection mechanism.
  - id: seed-export-invalid-message
    desc: "Seed export with invalid-seed error text"
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1041
    scope: file
    all:
      - id: micro-behaviors/ui/controls/wallet::invalid-seed-phrase-error
      - id: micro-behaviors/crypto/mnemonic::assembled-seed-phrase-from-words
    any:
      - id: objectives/exfiltration/sensitive-data/source::js-seed-phrase-request-field
      - id: objectives/exfiltration/sensitive-data/source::js-seed-request-field
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    needs: 1
