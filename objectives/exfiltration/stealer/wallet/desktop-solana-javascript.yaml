defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: desktop-crypto-stealer
    for: [javascript]
    desc: Iterates Desktop looking for Solana/BIP39 secrets
    conf: 0.95
    crit: hostile
    attack: T1552.004
    all:
      - id: objectives/credential-access/wallet/solana::solana-key-access
      - id: objectives/collection/file-targeting/enumeration::desktop-dir-search
      - id: micro-behaviors/communications/http/post::post
