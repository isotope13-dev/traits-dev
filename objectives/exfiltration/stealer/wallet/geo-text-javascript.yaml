defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.98
  attack: T1041,T1056.002

composite_rules:
  - id: wallet-phrase-geo-text-exfiltration
    desc: Wallet phrase forwarded beside location-bearing HTTP export
    crit: hostile
    scope: file
    near_bytes: 2200
    all:
      - id: micro-behaviors/crypto/mnemonic::stored-wallet-phrase-forwarded
      - id: micro-behaviors/data/serialize/envelope::geo-text-json-body
      - id: micro-behaviors/communications/http/ip-discovery::ip-geolocation-service
      - id: micro-behaviors/communications/http/request/client::fetch-json-geo-text-post
  # Same flow proven from the minified text when the AST legs are not
  # reported for a large bundle.
  - id: wallet-phrase-geo-text-exfiltration-minified
    desc: Imported wallet phrase forwarded to location-bearing fetch POST
    crit: hostile
    scope: file
    near_bytes: 2200
    all:
      - id: micro-behaviors/crypto/mnemonic::stored-wallet-phrase-forwarded-text
      - id: micro-behaviors/data/serialize/envelope::geo-text-json-body
      - id: micro-behaviors/communications/http/ip-discovery::ip-geolocation-service
      - id: micro-behaviors/communications/http/request/client::fetch-json-geo-text-post-text
  - id: generated-wallet-phrase-geo-export
    desc: Newly generated wallet phrase enters HTTP-exporting import flow
    crit: hostile
    scope: file
    near_bytes: 2600
    all:
      - id: micro-behaviors/crypto/mnemonic::generated-wallet-phrase-imported
    any:
      - id: wallet-phrase-geo-text-exfiltration
      - id: wallet-phrase-geo-text-exfiltration-minified
  - id: validated-seed-geo-text-export
    desc: Seed validation forwards input into location-bearing HTTP export
    crit: hostile
    conf: 0.99
    near_bytes: 2400
    all:
      - id: micro-behaviors/crypto/mnemonic::seed-validator-forwards-input
      - id: micro-behaviors/data/serialize/envelope::geo-text-json-body
      - id: micro-behaviors/communications/http/ip-discovery::ip-geolocation-service
      - id: micro-behaviors/communications/http/request/client::fetch-json-geo-text-post
