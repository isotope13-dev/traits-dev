defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.98
  attack: T1041,T1056.002

composite_rules:
  - id: wallet-phrase-geo-text-exfiltration
    desc: Imported wallet phrase exported with geolocation
    crit: hostile
    scope: file
    near_bytes: 2200
    all:
      - id: micro-behaviors/crypto/mnemonic::stored-wallet-phrase-forwarded
      - id: micro-behaviors/data/serialize/envelope::geo-text-json-body
      - id: micro-behaviors/communications/http/ip-discovery::ip-geolocation-service
  - id: generated-wallet-phrase-geo-export
    desc: Generated wallet phrase exported with geolocation
    crit: hostile
    scope: file
    near_bytes: 2600
    all:
      - id: micro-behaviors/crypto/mnemonic::generated-wallet-phrase-imported
      - id: wallet-phrase-geo-text-exfiltration
  - id: validated-seed-geo-text-export
    desc: Validated seed exported with geolocation
    crit: hostile
    conf: 0.99
    near_bytes: 2400
    all:
      - id: micro-behaviors/crypto/mnemonic::seed-validator-forwards-input
      - id: micro-behaviors/data/serialize/envelope::geo-text-json-body
      - id: micro-behaviors/communications/http/ip-discovery::ip-geolocation-service
      - id: micro-behaviors/communications/http/post::fetch-post-call
