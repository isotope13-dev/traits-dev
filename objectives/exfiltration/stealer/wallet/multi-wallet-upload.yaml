defaults:
  attack: T1041
  mbc: B0028
  platforms:
    - linux
    - unix
    - macos
    - windows
    - android
    - ios
  for: [scripts, binaries]
composite_rules:
  - id: multi-wallet-network-stealer
    for: [binaries, '!dex', scripts, '!jcl']
    desc: Multi-wallet stealer includes HTTP upload capability
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/wallet/desktop::stealer
    any:
      - id: micro-behaviors/communications/http/upload/
    unless:
      - id: well-known/tool/detection/
      - id: well-known/app/
      - id: objectives/exfiltration/stealer/sweep::macos-curl-tmp-upload-signal

  - id: multi-wallet-telegram-session-stealer
    desc: Multi-wallet stealer also copies Telegram tdata
    crit: hostile
    conf: 0.96
    attack: T1555,T1539
    for: [applescript, shell]
    all:
      - id: multi-wallet-network-stealer
      - id: objectives/credential-access/messaging/telegram::tdata-path
