defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041
composite_rules:
- id: vscode-hidden-config-zip-multipart-exfil
  desc: VS Code extension uploads shell and Solana config archive
  crit: hostile
  conf: 0.99
  for: [vsix, javascript, package.json]
  scope: archive
  attack: T1552.001,T1041,T1195.002
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: metadata/permission/activation::main-extension-js
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename-encoded
  - id: micro-behaviors/fs/path/config/shell::zshrc-filename-encoded
  - id: micro-behaviors/fs/path/config/app::id-json-filename-encoded
  - id: micro-behaviors/fs/path/wallet::node-user-solana-config-directory
  - id: micro-behaviors/data/archive/create/zip::node-zip-cli-quiet-create
  - id: micro-behaviors/communications/http/upload::formdata-blob-file-fetch-upload

- id: node-hidden-config-zip-multipart-exfil
  desc: Node archives hidden shell and Solana config for multipart upload
  crit: hostile
  conf: 0.99
  near_bytes: 4096
  attack: T1552.001,T1041
  all:
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename-encoded
  - id: micro-behaviors/fs/path/config/shell::zshrc-filename-encoded
  - id: micro-behaviors/fs/path/config/app::id-json-filename-encoded
  - id: micro-behaviors/fs/path/wallet::node-user-solana-config-directory
  - id: micro-behaviors/data/archive/create/zip::node-zip-cli-quiet-create
  - id: micro-behaviors/communications/http/upload::formdata-blob-file-fetch-upload
  unless:
  - id: metadata/package/testing/

- id: node-crypto-validation-exfil
  desc: Crypto facade validates generated values through external POST
  crit: hostile
  conf: 0.97
  attack: T1041,T1195.002
  all:
  - id: micro-behaviors/crypto/library/wrapper::exports-crypto-interface
  - id: micro-behaviors/os/random/crypto::node-random-bytes
  - id: micro-behaviors/data/encode/base64::btoa-symbol
  - id: micro-behaviors/communications/http/post::fetch-post-call
  unless:
  - id: metadata/package/testing/
- id: node-wallet-keyword-cluster
  desc: Node wallet credential keyword cluster
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: objectives/credential-access/wallet/keywords::wallet-token
  - id: objectives/credential-access/wallet/keywords::mnemonic-word
  - id: objectives/credential-access/wallet/solana::solana-keypair-reference
  - id: micro-behaviors/crypto/library/blockchain/wallet::bip39-wordlist-reference
- id: node-encrypted-wallet-file-exfil
  desc: Node encrypts wallet files before IPFS upload
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1041,T1027
  all:
  - id: node-wallet-keyword-cluster
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: micro-behaviors/crypto/library/provider::asymmetric-public-encrypt
  - id: micro-behaviors/communications/http/services/ipfs::public-ipfs-gateway-literal
  any:
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
