# Wallet-material collection followed by upload to public file hosts.
# Wallet paths and BIP-39 terms are useful analyst signals on their own, but
# the combination with a curl upload and a public file host is hostile.
defaults:
  platforms: [unix]
  for: [elf]
  attack: "T1555.003,T1041"
  mbc: "F1014"

composite_rules:
  - id: python-encoded-wallet-upload-exfil
    desc: Decoded payload uploads wallet material
    crit: hostile
    conf: 0.99
    for: [python]
    attack: "T1552.004,T1041,T1027.009"
    all:
      - id: objectives/credential-access/wallet/keywords::python-encoded-wallet-store-path
      - id: objectives/exfiltration/http/encoded::python-encoded-file-upload-command
      - id: objectives/exfiltration/http/encoded::python-encoded-public-upload-endpoint
    any:
      - id: objectives/credential-access/wallet/keywords::python-encoded-wallet-secret-terms
      - id: objectives/credential-access/wallet/keywords::python-encoded-wallet-recovery-terms

  - id: wallet-material-public-host-upload
    desc: Wallet material uploaded to public file hosts
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/library/blockchain/wallet::bip39-wordlist-reference
      - id: objectives/credential-access/wallet/desktop::doteth-keystore
      - id: micro-behaviors/communications/http/upload::curl-upload-file
    any:
      - id: micro-behaviors/communications/http/services/file-hosting::transfer-sh
      - id: micro-behaviors/communications/http/services/file-hosting::uguu-se

  - id: javascript-wallet-browser-upload
    desc: JavaScript uploads wallet and browser data
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1552.004,T1041
    for: [javascript, typescript]
    all:
      - id: objectives/credential-access/wallet/desktop::node-wallet-store-path
      - id: objectives/exfiltration/stealer/browser::javascript-browser-data-upload
