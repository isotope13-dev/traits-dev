defaults:
  platforms: [unix, windows]

composite_rules:
  - id: python-sui-wallet-targz-github-upload
    desc: Python steals Sui wallets and uploads tar.gz to GitHub API
    crit: hostile
    conf: 0.99
    attack: T1003,T1041,T1195.002
    for: [python, python_bytecode, pyc, whl, python-sdist]
    scope: archive
    all:
      - id: objectives/credential-access/wallet/blockchain::sui-wallet-keystore-path-ref
      - id: micro-behaviors/communications/http/services/github::github-rest-json-accept-header
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/os/env/cicd::multi-ci-provider-env-refs
