defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1041

traits:
  - id: php-server-env-json-post
    desc: PHP posts server environment as JSON
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'CURLOPT_POSTFIELDS\s*,\s*json_encode\s*\(\s*array[\s\S]{0,700}\$_SERVER'

composite_rules:
  - id: php-obfuscated-server-profile-exfil
    desc: Obfuscated PHP posts a server profile over cURL
    crit: hostile
    conf: 0.99
    attack: T1027,T1041,T1082
    scope: outer
    all:
      - id: php-server-env-json-post
      - id: metadata/lang/encoded/unicode-escape::dense-php-byte-escapes
      - id: micro-behaviors/communications/http/curl::php-curl-request
      - id: micro-behaviors/os/sysinfo/hostname::php-gethostname-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::phpversion-call

  - id: php-server-profile-remote-stage
    desc: PHP posts profile during remote staging
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/dropper/execution/http::php-curl-write-include-chain
      - id: php-server-env-json-post
      - id: micro-behaviors/os/sysinfo/hostname::php-gethostname-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::phpversion-call
