defaults:
  platforms: [openwrt]
  for: [c, cpp, objc, rust, elf]
  attack: T1041
  mbc: E1567

composite_rules:
  - id: openwrt-uci-host-profile-http-exfil
    desc: "Appliance network configuration HTTP export"
    crit: hostile
    conf: 0.95
    scope: outer
    for: [c, cpp, objc, rust, elf, tar, zip]
    all:
      - id: micro-behaviors/os/sysinfo/network::openwrt-uci-recon-command
      - id: micro-behaviors/communications/http/url/telemetry::ingest-api-path
    any:
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/get::get
      - id: micro-behaviors/communications/http/header/content-length::content-length-header
      - id: micro-behaviors/communications/socket/connect::connect-symbol
    needs: 2
