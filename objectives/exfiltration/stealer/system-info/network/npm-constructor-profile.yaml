defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: npm-obfuscated-profile-exec
    desc: Obfuscated IP profile, HTTP POST and eval
    crit: hostile
    conf: 0.99
    mbc: E1041
    all:
      - id: micro-behaviors/communications/http/ip-discovery::npm-public-ip-profiling
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/communications/url/construction/fragment::process-log-vercel-endpoint
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
    any:
      - id: objectives/anti-static/obfuscation/control-flow/retry::string-table-rotator-loop
      - id: objectives/anti-static/obfuscation/string/array::constructor-string-split
  - id: npm-constructor-telemetry-exec
    desc: Constructor helper and IP profile with eval
    crit: hostile
    conf: 0.995
    mbc: E1041
    all:
      - id: metadata/lang/source/naming/function/runtime::constructor-preparewriter-import-and-call
      - id: objectives/exfiltration/stealer/system-info/network::npm-obfuscated-profile-exec
  - id: npm-constructor-telemetry-camouflage
    desc: IP profile and eval with error messages
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/exfiltration/stealer/system-info/network::npm-constructor-telemetry-exec
    any:
      - id: metadata/lang/natural/phrasing/system::backend-cover-message
      - id: metadata/lang/natural/phrasing/system::backend-cover-message-obfuscated
      - id: metadata/lang/natural/phrasing/system::internet-cover-message
      - id: metadata/lang/natural/phrasing/system::internet-cover-message-obfuscated
  - id: browser-multi-provider-geo-panel-exfil
    desc: Queries multiple geolocation providers and POSTs visitor profile to PHP panel
    crit: hostile
    conf: 0.99
    attack: T1016,T1041
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ip-api-ipwho-ipinfo-cluster
      - id: micro-behaviors/communications/http/ip-discovery::geo-cookie-php-json-post
      - id: micro-behaviors/communications/http/intercept::fetch-hook-with-geo-cookie-fields
      - id: micro-behaviors/communications/http/url/api-path/resource::php-endpoints-directory-script
