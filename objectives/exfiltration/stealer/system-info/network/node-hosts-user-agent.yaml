defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1016,T1041

traits:
  - id: node-hosts-user-agent-flow
    desc: Sends encoded hosts data in user agent
    crit: hostile
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @hosts
            value: (await_expression (call_expression
              function: (member_expression property: (property_identifier) @read)
              arguments: (arguments (string) @host_path)))))
          (lexical_declaration (variable_declarator name: (identifier) @data
            value: (template_string (template_substitution (identifier) @hosts_used))))
          (lexical_declaration (variable_declarator name: (identifier) @encoded
            value: (call_expression function: (member_expression
              object: (call_expression function: (member_expression
                object: (call_expression function: (member_expression
                  object: (identifier) @buffer property: (property_identifier) @from)
                  arguments: (arguments (identifier) @data_used))
                property: (property_identifier) @to_string)
                arguments: (arguments (string (string_fragment) @base64)))
              property: (property_identifier) @replace))))
          (lexical_declaration (variable_declarator name: (identifier) @command
            value: (template_string (string_fragment) @curl
              (string_fragment) @agent
              (template_substitution (identifier) @encoded_used))))
          (expression_statement (call_expression function: (identifier) @exec
            arguments: (arguments (identifier) @command_used))))
          (#eq? @read "readFile")
          (#match? @host_path "(?i)windows.*system32.*drivers.*etc.*hosts")
          (#eq? @hosts @hosts_used)
          (#eq? @buffer "Buffer")
          (#eq? @from "from")
          (#eq? @to_string "toString")
          (#eq? @base64 "base64")
          (#eq? @replace "replace")
          (#eq? @data @data_used)
          (#eq? @encoded @encoded_used)
          (#eq? @exec "exec")
          (#eq? @command @command_used)
          (#match? @curl "^curl .*https?://")
          (#match? @agent "-A [^A-Za-z0-9]*$"))
