defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: preinstall-executes-public-ip-telemetry
  desc: Install hook runs public-IP telemetry code
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1016
  mbc: E1041
  for:
  - package.json
  - javascript
  - tar
  - zip
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: objectives/exfiltration/stealer/system-info/network::sentry-public-ip-profile-exfil
