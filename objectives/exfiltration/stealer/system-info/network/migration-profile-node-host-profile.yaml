defaults:
  crit: hostile
  conf: 0.97
  platforms: [unix, windows]
  for: [javascript, typescript, tar, zip]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  # The collection/transport legs describe ONE script. Held flat under
  # `scope: archive` they were satisfiable by unrelated members: OpenClaw (an
  # AI gateway whose postinstall only prunes its own dist tree) convicted on
  # hostname/networkInterface calls from its LAN-advertising and IMAP
  # extensions, an https.request from a vendored chrome-devtools-mcp bundle,
  # and a require.main guard from its updater — five files, one "beacon".
- id: node-https-encoded-host-profile-script
  desc: Script sends host identity in an encoded HTTPS request
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  scope: file
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/network/interface/query::node-network-interfaces-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
- id: npm-postinstall-lifecycle-https-host-profile-beacon
  desc: npm lifecycle script HTTPS beacons host profile
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: micro-behaviors/process/argument/lifecycle::node-require-main-module-guard
  - id: objectives/exfiltration/stealer/system-info/network::node-https-encoded-host-profile-script
