defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

composite_rules:
- id: obfuscated-package-host-profile-relay
  desc: Obfuscated MAC-address and remote URL clues
  crit: suspicious
  conf: 0.97
  attack: T1195.002,T1592.004,T1041
  for:
  - npm
  - tar
  - shell
  - javascript
  scope: archive
  all:
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
  - id: micro-behaviors/network/interface/query::node-mac-address-property
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  unless:
  - id: metadata/path/directory::test-directory-component
