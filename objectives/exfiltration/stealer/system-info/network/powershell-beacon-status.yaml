defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
- id: powershell-beacon-network-status-http-post
  desc: Beacon network status report submitted to an external HTTP endpoint
  crit: hostile
  conf: 0.93
  all:
  - id: micro-behaviors/data/format/log::powershell-beacon-commandline-report-label
  - id: micro-behaviors/network/status::netstat
  - id: metadata/lang/source/literal/string::quoted-post-token
  - id: micro-behaviors/communications/http/client/managed::webrequest-create
  - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
  - id: micro-behaviors/data/stream/write::powershell-stream-buffer-write
  - id: micro-behaviors/data/encode/charset::powershell-utf8-getbytes
  - id: micro-behaviors/communications/http/request/body/command-output::powershell-joined-output-post-body
