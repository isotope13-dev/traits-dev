defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # These are HTTP reachability/status results, not metadata response bodies
  # or credentials. The query binding is required; endpoint vocabulary alone
  # must not convict an ordinary SDK or a Markdown server.
  - id: mcp-startup-internal-probe-status-export
    desc: MCP exports internal HTTP survey at startup
    crit: hostile
    conf: 0.98
    attack: T1046,T1041
    all:
      - id: objectives/discovery/network/scan/internal-port::metadata-loopback-http-status-survey
      - id: micro-behaviors/communications/mcp::mcp-tools-call-method
      - id: micro-behaviors/communications/http/url/telemetry::beacon-path-token
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-script
