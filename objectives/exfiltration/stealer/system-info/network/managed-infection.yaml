# CIL: the received inventory task invokes netstat -a through the hidden
# command runner, then uploads its report via UploadManager -> Agent.UploadFile.
# The existing task and infection-report profiles supply attack admission.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-infection-network-report-upload
    desc: Infection-task implant uploads netstat inventory
    crit: hostile
    conf: 0.98
    attack: T1049,T1041
    all:
      - id: objectives/exfiltration/stealer/system-info/identity::managed-infection-domain-report-upload
      - id: objectives/command-and-control/remote-command/shell::managed-infection-task-command-output-references
      - id: micro-behaviors/os/network/status::netstat
