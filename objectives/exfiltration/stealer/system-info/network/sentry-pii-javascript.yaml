defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1119
  mbc: E1119

composite_rules:
- id: sentry-hardcoded-ip-pii-telemetry
  desc: Hardcoded Sentry collects public IP
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/telemetry::sentry-ingest-dsn
  - id: micro-behaviors/communications/http/telemetry::sentry-default-pii-enabled
  - id: well-known/lib/observability/sentry-js::sentry-set-user-call
  - id: micro-behaviors/communications/http/url/telemetry::cloudflare-trace-ip-endpoint
  # The PII binding reaches the SDK either directly
  # (`Sentry.setUser({ ip_address })`) or through a thin wrapper that calls
  # bare `setUser({ ...user, ip_address })` and forwards it.
  any:
  - id: micro-behaviors/communications/http/telemetry::sentry-ip-address-user-field
  - id: micro-behaviors/communications/http/telemetry::bare-setuser-ip-address-field
