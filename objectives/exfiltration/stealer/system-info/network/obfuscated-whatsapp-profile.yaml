# WhatsApp page patches that read the account's IP/geolocation alongside
# WhatsApp message construction. The co-occurrence alone does not establish an
# external recipient: the same shape also covers one-shot self-notifications
# (init receipts sent to the account's own chat), so it supports suspicion,
# not a stealer conviction.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: ip-result-destructure
    desc: JavaScript destructures an IP result
    conf: 0.9
    if:
      type: text
      regex: '\{\s*ip\s*:\s*[A-Za-z_$][\w$]*'

  - id: whatsapp-location-with-fragmented-coordinate
    desc: WhatsApp API uses a fragmented latitude field
    conf: 0.94
    if:
      type: text
      regex: "WAPI.{0,500}['\"]lat['\"]\\s*\\+\\s*['\"]itu['\"]\\s*\\+\\s*['\"]de"

  - id: whatsapp-message-with-fragmented-value
    desc: WhatsApp API appends encoded space and value
    conf: 0.92
    if:
      type: text
      regex: "WAPI.{0,500}\\\\x20.{0,80}\\+\\s*_0x[0-9a-f]+"

composite_rules:
  - id: obfuscated-whatsapp-ip-message-cooccurrence
    desc: IP lookup co-occurs with WhatsApp message construction
    crit: suspicious
    conf: 0.75
    attack: T1590
    near_bytes: 12000
    scope: leaf
    all:
      - id: ip-result-destructure
    any:
      - id: whatsapp-location-with-fragmented-coordinate
      - id: whatsapp-message-with-fragmented-value
    needs: 1
