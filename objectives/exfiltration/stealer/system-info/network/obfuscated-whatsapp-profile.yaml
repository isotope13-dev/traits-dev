# WhatsApp page patches that send the active account's network location.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041,T1590
  crit: notable

traits:
  - id: ip-result-destructure
    desc: JavaScript destructures an IP result
    conf: 0.9
    if:
      type: text
      regex: '\{\s*ip\s*:[A-Za-z_$][\w$]*'

  - id: whatsapp-location-with-fragmented-coordinate
    desc: WhatsApp API uses a fragmented latitude field
    conf: 0.94
    if:
      type: text
      regex: "WAPI.{0,500}['\"]lat['\"]\\s*\\+\\s*['\"]itu['\"]\\s*\\+\\s*['\"]de"

  - id: whatsapp-message-with-fragmented-value
    desc: WhatsApp API appends encoded space and value
    conf: 0.92
    if:
      type: text
      regex: "WAPI.{0,500}\\\\x20.{0,80}\\+\\s*_0x[0-9a-f]+"

composite_rules:
  - id: obfuscated-whatsapp-location-exfil
    desc: IP lookup feeds WhatsApp geolocation
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    scope: leaf
    all:
      - id: ip-result-destructure
      - id: whatsapp-location-with-fragmented-coordinate

  - id: obfuscated-whatsapp-public-ip-message
    desc: IP lookup feeds a WhatsApp message
    crit: hostile
    conf: 0.98
    near_bytes: 12000
    scope: leaf
    all:
      - id: ip-result-destructure
      - id: whatsapp-message-with-fragmented-value
