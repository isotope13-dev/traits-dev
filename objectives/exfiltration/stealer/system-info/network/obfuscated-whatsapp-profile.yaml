# WhatsApp page patches that read the account's IP/geolocation alongside
# WhatsApp message construction. The co-occurrence alone does not establish an
# external recipient: the same shape also covers one-shot self-notifications
# (init receipts sent to the account's own chat), so it supports suspicion,
# not a stealer conviction.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: whatsapp-location-with-fragmented-coordinate
    desc: WhatsApp API uses a fragmented latitude field
    conf: 0.94
    if:
      type: text
      regex: "WAPI.{0,500}['\"]lat['\"]\\s*\\+\\s*['\"]itu['\"]\\s*\\+\\s*['\"]de"

  - id: whatsapp-message-with-fragmented-value
    desc: WhatsApp API appends encoded space and value
    conf: 0.92
    if:
      type: text
      regex: "WAPI.{0,500}\\\\x20.{0,80}\\+\\s*_0x[0-9a-f]+"

  - id: whatsapp-recipient-derived-from-current-account
    desc: Recipient resolved from current WhatsApp account
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '_0x[0-9a-f]+\s*=\s*_0x[0-9a-f]+\[[^\]]{1,100}\]\(moi\)'

  - id: whatsapp-awaits-location-send-result
    desc: Awaits WhatsApp call with latitude
    crit: component
    conf: 0.86
    if:
      type: text
      regex: 'await\s+WAPI\s*\[[^\]]{1,100}\]\(_0x[0-9a-f]+,_0x[0-9a-f]+\[''lat'''

composite_rules:
  - id: obfuscated-whatsapp-ip-message-cooccurrence
    desc: IP lookup co-occurs with WhatsApp message construction
    crit: suspicious
    conf: 0.75
    attack: T1590
    near_bytes: 12000
    scope: leaf
    all:
      - id: micro-behaviors/data/property/assign::ip-object-field
    any:
      - id: whatsapp-location-with-fragmented-coordinate
      - id: whatsapp-message-with-fragmented-value
    needs: 1
    # The full self-chat chain below is the same flow with a resolved
    # recipient. Keep this co-occurrence for partial matches only.
    unless:
      - id: public-ip-geolocation-disclosed-to-whatsapp-self-chat

  # Recipient is the current WhatsApp account (self-chat), not an external
  # address. That is the open-wa session notice: public-IP geolocation is
  # sent to the linked account. Legitimate automation use remains plausible,
  # so this is suspicion rather than a stealer conviction.
  - id: public-ip-geolocation-disclosed-to-whatsapp-self-chat
    desc: IP geolocation sent to WhatsApp self-chat
    crit: suspicious
    conf: 0.9
    attack: T1590
    scope: leaf
    near_bytes: 12000
    all:
      - id: micro-behaviors/data/property/assign::ip-object-field
      - id: whatsapp-location-with-fragmented-coordinate
      - id: whatsapp-message-with-fragmented-value
      - id: whatsapp-recipient-derived-from-current-account

  # The more specific finding requires an awaited WhatsApp API call with a
  # latitude argument, alongside the IP message and current-account recipient.
  # The call evidence distinguishes a location send from nearby API references
  # or a one-shot status message.
  - id: public-ip-and-location-sent-to-whatsapp-self-chat
    desc: Public IP and fetched location sent to WhatsApp self-chat
    crit: suspicious
    conf: 0.91
    attack: T1590
    scope: leaf
    near_bytes: 12000
    all:
      - id: micro-behaviors/data/property/assign::ip-object-field
      - id: whatsapp-location-with-fragmented-coordinate
      - id: whatsapp-message-with-fragmented-value
      - id: whatsapp-recipient-derived-from-current-account
      - id: whatsapp-awaits-location-send-result

  # The transfer above is more than routine telemetry when the complete
  # collection-and-send chain is hidden behind a rotating string table and a
  # runtime arithmetic decoder. Require both obfuscation mechanisms as
  # additional evidence before classifying the disclosure as hostile.
  - id: obfuscated-public-ip-geolocation-exfiltration-to-whatsapp-self-chat
    desc: Obfuscated public IP and fetched location exfiltrated to WhatsApp self-chat
    crit: hostile
    conf: 0.9
    attack: T1041
    scope: leaf
    near_bytes: 75000
    all:
      - id: micro-behaviors/data/property/assign::ip-object-field
      - id: whatsapp-location-with-fragmented-coordinate
      - id: whatsapp-message-with-fragmented-value
      - id: whatsapp-recipient-derived-from-current-account
      - id: whatsapp-awaits-location-send-result
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
      - id: objectives/anti-static/obfuscation/string/dynamic::arithmetic-decoder-wrapper-call
