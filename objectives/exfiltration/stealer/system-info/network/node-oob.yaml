defaults:
  platforms: [linux, macos]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: node-loopback-network-recon-oob-post
    desc: Local network reconnaissance accompanies OOB JSON POST
    attack: T1041,T1016
    mbc: E1041
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/network/interface::node-network-interfaces-call
      - id: micro-behaviors/fs/read/file/target::node-read-resolver-config
      - id: micro-behaviors/communications/socket/connect::javascript-connect-loopback-argument
      - id: micro-behaviors/communications/socket/create::net-socket-connect-method
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
