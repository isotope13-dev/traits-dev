# Interface data passed into a hex encoder, co-occurring with an outbound
# DNS lookup or HTTP body write. The hex leg is the source; the channel
# legs are the send. Proximity is not a proven data-flow.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.95
  mbc: E1082
composite_rules:
  - id: js-encoded-recon-beacon
    desc: Hex-encoded interfaces near an outbound send
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/encode/hex::js-os-networkinterfaces-to-hex
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
      - id: micro-behaviors/communications/http/request/body::request-write-call
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
    unless:
      - id: well-known/lib/network/node-edge/
