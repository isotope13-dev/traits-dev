defaults:
  platforms: ["unix", "windows"]
  for: ["javascript", "typescript"]

composite_rules:
  - id: npm-public-ip-webhook-beacon
    mbc: E1041
    attack: T1041
    crit: suspicious
    desc: Nearby public IP service and chat webhook references
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
