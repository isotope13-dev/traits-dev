# Host fingerprint shipped to a Loggly log service from a single script: the
# file collects hostname plus OS user identity, decodes chunked log-service
# credentials, and constructs the Loggly transport that carries the payload
# out. A production service logging host context uses plaintext or
# environment-provided credentials; the chunked-credential leg is what makes
# this concealment rather than ordinary telemetry.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1082
  mbc: E1041

composite_rules:
- id: loggly-host-fingerprint-exfil
  desc: Ships host fingerprint to Loggly log service
  crit: hostile
  conf: 0.96
  scope: file
  near_bytes: 4000
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: micro-behaviors/communications/http/telemetry::loggly-transport-construct
  - id: micro-behaviors/communications/http/telemetry::log-service-chunked-credential
