defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - npm
  attack: T1016,T1041
  mbc: E1041
composite_rules:
- id: npm-postinstall-hosts-oob-post
  desc: Hosts-file read and Base64 accompany install-time OOB POST
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/file/target::npm-postinstall-python-hosts-read
  - id: micro-behaviors/data/encode/base64::npm-postinstall-python-b64encode
  - id: micro-behaviors/communications/url/host/oob::npm-postinstall-oastify-url
- id: npm-postinstall-config-targets-oob-post
  desc: Target-list file data is Base64 POSTed to OAST
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/file/target::npm-postinstall-target-list-contains-hosts-path
  - id: micro-behaviors/fs/read/file/target::npm-postinstall-python-target-list-file-read
  - id: micro-behaviors/data/encode/base64::npm-postinstall-base64-config-result-body
  - id: micro-behaviors/communications/http/request/httpx::npm-postinstall-httpx-oast-body-post
