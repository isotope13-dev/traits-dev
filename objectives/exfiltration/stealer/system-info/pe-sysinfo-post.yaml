# System info exfiltration via URL-encoded POST body in PE binaries
# Detects format strings used to build system fingerprint POST data
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1082
composite_rules:
- id: sysinfo-url-encoded-post
  desc: System info URL-encoded POST exfiltration
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/communications/socket/init::wsa-startup
  any:
  - id: objectives/discovery/system/profile::sysinfo-post-cpuarch
  - id: objectives/discovery/system/profile::sysinfo-post-cpunum
  - id: objectives/command-and-control/botnet/keywords::botversion-field
- id: bot-c2-tracking
  desc: Bot C2 tasking and tracking fields
  crit: suspicious
  conf: 0.92
  any:
  - id: objectives/command-and-control/botnet/keywords::botversion-field
  - id: objectives/command-and-control/botnet/keywords::taskid-field
  needs: 2
