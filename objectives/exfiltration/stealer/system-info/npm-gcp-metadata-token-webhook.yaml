defaults:
  platforms: [unix, linux]
  for: [package.json, npm, tar, zip]
  attack: T1552.005,T1041,T1195.002
  mbc: E1041

traits:
  - id: npm-preinstall-posts-gcp-metadata-token
    desc: npm preinstall reads a Google Cloud service-account token and posts it to a webhook
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)"preinstall"\s*:[\s\S]{0,700}metadata\.google\.internal/computeMetadata/v1/instance/service-accounts/[^\s"'']+/token[\s\S]{0,700}curl\s+-X\s+POST\s+-d\s+\$access_token\s+https?://(?:[^\s"'']+/)?webhook(?:\.com|\.site|\.fun)'

composite_rules:
  - id: npm-preinstall-exfiltrates-gcp-service-account-token
    desc: npm preinstall exfiltrates a Google Cloud service-account token
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: npm-preinstall-posts-gcp-metadata-token
