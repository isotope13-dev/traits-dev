defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: node-host-user-json-fields
  desc: Node whoami JSON field
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '["'']?whoami["'']?\s*:'
- id: node-package-version-json-fields
  desc: Node package version field marker
  crit: component
  conf: 0.82
  if:
    type: text
    word: packageVersion
- id: node-system-profile-json
  desc: Node system profile JSON fields
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "operatingSystem.{0,80}ipAddress.{0,80}username"
- id: node-compact-telemetry-fields
  desc: Compact host telemetry fields
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: \{['"]ts['"]:\w+,['"]type['"]:\w+,['"]hid['"]:\w+,['"]ss['"]:\w+,['"]cc['"]:\w+\}
  unless:
  - id: metadata/package/testing/
- id: node-encoded-post-form-fields
  desc: Encoded post form fields
  crit: component
  conf: 0.92
  if:
    type: text
    regex: fcG9z['"]\s*\+\s*['"]dA|kZm9y['"][\s\S]{0,40}GE|vdXJs
- id: node-relay-status-envelope
  desc: Node relay status message marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: agent_status
composite_rules:
- id: node-multifield-profile-json-post
  desc: Multi-field Node profile near JSON POST
  crit: suspicious
  conf: 0.9
  attack: T1020
  mbc: E1082
  near_bytes: 8192
  all:
  - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  unless:
  - id: metadata/library/structure/
  - id: metadata/library/github-actions/
- id: node-runtime-identity-json-post
  desc: Node identity fingerprint near JSON POST
  crit: suspicious
  conf: 0.9
  attack: T1020
  mbc: E1041
  near_bytes: 8192
  all:
  - id: objectives/discovery/system/fingerprint/hardware::js-victim-id
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-property-fingerprint
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  unless:
  - id: metadata/library/structure/
- id: node-profile-external-ip-http-exfil
  desc: Node host-profile exfiltration to public IP
  crit: hostile
  conf: 0.99
  attack: T1020,T1041
  mbc: E1041
  near_bytes: 8192
  all:
  - id: objectives/discovery/system/fingerprint/hardware::small-js-victim-id
  - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
  - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
  - id: micro-behaviors/communications/http/request/client::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: env-vars
  desc: Encoded environment-secret HTTP exfiltration
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/credentials::js-env-http-send
  - id: objectives/credential-access/env/secrets/filtered-access::node-filtered-secret-scan
  - id: micro-behaviors/data/encode/base64/
  unless:
  - id: well-known/lib/network/node-edge/
  - id: well-known/lib/development/npm-semver::semver-class
  - id: micro-behaviors/os/env/vars/access::node-debug-check
  - id: metadata/library/structure::vscode-extension-generated-asset
- id: node-system-info-fetch-exfil
  desc: Node system info JSON exfiltration
  crit: hostile
  conf: 0.96
  all:
  - id: node-system-profile-json
  - id: micro-behaviors/communications/http/request/client::fetch-json-body
  any:
  - id: micro-behaviors/communications/ip/parse::ip-address-camel
  - id: micro-behaviors/communications/http/headers::client-identity-headers
- id: node-systeminformation-fetch-exfil
  desc: Node systeminformation fingerprint HTTP exfiltration
  crit: hostile
  conf: 0.97
  attack: T1041,T1082
  mbc: E1041
  for: [npm]
  all:
  - id: objectives/discovery/system/fingerprint/hardware::si-uuid-call
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: micro-behaviors/data/source/syntax/schema::hardware-macs-field-pair
- id: node-windows-cli-http-exfil
  desc: Node Windows CLI HTTP exfil
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: objectives/discovery/system/fingerprint/runtime::node-windows-cli-inventory
  - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/request/client::post-method-text
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: node-host-user-ip-post-exfil
  desc: Node package host user exfiltration
  crit: hostile
  conf: 0.97
  attack: T1041
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/client::post-method-text
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: node-host-user-json-fields
  - id: node-package-version-json-fields
  any:
  - id: metadata/import/builtin::require-http
  - id: metadata/import/builtin::require-https
  - id: micro-behaviors/communications/http/request/client::http-client-usage
- id: obfuscated-node-telemetry-exfil
  desc: Obfuscated Node telemetry exfiltration
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: node-compact-telemetry-fields
  - id: node-encoded-post-form-fields
  - id: micro-behaviors/data/source/dynamic/load::node-dynamic-require-call
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::advanced-array-shuffling
  - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
  - id: micro-behaviors/data/decode/base64::buffer-computed-base64-string-decoder
- id: node-websocket-command-relay-host-profile
  desc: Remote command relay sends a Node host profile
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1059.007,T1071.001
  scope: archive
  all:
  - id: node-relay-status-envelope
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-member
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-version-access
  - id: objectives/command-and-control/backdoor/dispatch/websocket::remote-fix-command-exec
  - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
  - id: micro-behaviors/communications/http/websocket::wss-scheme
