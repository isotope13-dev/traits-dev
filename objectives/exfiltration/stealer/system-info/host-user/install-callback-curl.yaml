defaults:
  platforms: ["unix", "windows"]
  for: ["javascript"]

composite_rules:
  - id: node-curl-host-profile-beacon
    attack: T1195.002,T1041
    desc: Node curl-POSTs hostname whoami host profile
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/discovery/system/profile::js-hostname-whoami-json-object
      - id: micro-behaviors/communications/http/curl/body::curl-post-flag
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
