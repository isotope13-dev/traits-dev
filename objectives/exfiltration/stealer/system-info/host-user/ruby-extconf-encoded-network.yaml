defaults:
  platforms: [unix]
  for: [ruby]
composite_rules:
  - id: ruby-extconf-encoded-host-profile-network
    desc: Extension hook sends encoded host profile
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082
    mbc: E1041
    all:
      - id: micro-behaviors/process/create/shell/command-mode::extconf-host-profile-shell-callback
    any:
      - id: micro-behaviors/communications/http/curl/command::ruby-curl-program-invocation
      - id: micro-behaviors/communications/dns/lookup::nslookup-command-literal
