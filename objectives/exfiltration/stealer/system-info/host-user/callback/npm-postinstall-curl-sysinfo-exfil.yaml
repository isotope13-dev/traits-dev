defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-curl-oast-domain
  desc: Postinstall curl targets an OAST domain
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: scripts.postinstall
    substr: ".oast."
- id: postinstall-curl-post-option
  desc: Postinstall curl uses POST
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.postinstall
    regex: '(?i)\bcurl\b[^;\r\n]{0,100}-X\s+POST'
- id: postinstall-curl-user-agent-uname
  desc: Postinstall curl sends uname in User-Agent
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: '(?i)-H\s+["'']User-Agent:\s*\$\(\s*uname\s+-a\s*\)'
- id: postinstall-curl-path-header
  desc: Postinstall curl sends current path
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: '(?i)-H\s+["'']X-Pwd:\s*\$PWD'
composite_rules:
- id: postinstall-curl-oast-host-profile-exfil
  desc: Postinstall sends host profile to OAST
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082,T1016
  mbc: E1041
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: postinstall-curl-oast-domain
  - id: postinstall-curl-post-option
  - id: postinstall-curl-user-agent-uname
  - id: postinstall-curl-path-header

- id: postinstall-curl-sysinfo-exfil
  desc: postinstall exfiltrates system or path information via curl POST
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002
  mbc: E1041
  all:
  - id: micro-behaviors/communications/http/curl/body::curl-http-post
  any:
  - id: micro-behaviors/fs/directory/cwd::package-script-pwd-substitution
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  unless:
  # RFC 2606 documentation domains are non-routable: a POST there reaches no
  # attacker, so the exfiltration claim does not hold.
  - id: metadata/package/scripts/reference::reserved-docs-domain-npm-script
