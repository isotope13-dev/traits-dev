defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1041,T1082,T1033

traits:
  - id: raw-ip-callback-constant
    desc: Script sets raw IP callback host
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'CALLBACK_HOST\s*=\s*["\x27]([0-9]{1,3}\.){3}[0-9]{1,3}["\x27]'

  - id: callback-json-post
    desc: Script posts JSON to callback host
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)JSON\.stringify\(data\).{0,100}http\.request\(\{.{0,50}hostname:\s*CALLBACK_HOST'

  - id: callback-post-body
    desc: Script writes callback request body
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)method:\s*["\x27]POST["\x27].{0,250}req\.write\(body\)'

  - id: host-user-profile-object
    desc: Script builds host and user profile
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)host:\s*os\.hostname\(\).{0,80}user:\s*os\.userInfo\(\)\.username'

  - id: external-ip-profile-dispatch
    desc: Script sends profile after IP lookup
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)api\.ipify\.org.{0,200}data\.extip\s*=\s*d\.trim\(\);\s*send\(data\)'

composite_rules:
  - id: node-raw-ip-host-user-post
    desc: Script posts host and user profile to raw IP
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: raw-ip-callback-constant
      - id: callback-json-post
      - id: callback-post-body
      - id: host-user-profile-object
      - id: external-ip-profile-dispatch
