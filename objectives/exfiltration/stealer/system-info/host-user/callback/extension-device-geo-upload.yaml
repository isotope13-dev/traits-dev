# A browser extension that looks up the user's public IP and geolocation, attaches
# a device identity object, and POSTs the JSON to a non-loopback backend. Each
# leg is ordinary alone: geolocation widgets, device identifiers in analytics,
# and JSON POSTs to a SaaS backend are common. The three together in one archive
# describe a profile upload that tracks where a device and its user are.
#
# Archive scope: the legs sit in different members of an extension (the IP
# lookup and identity in background, the POST in a popup or service module).
defaults:
  platforms: [windows, unix]
  attack: T1041,T1082,T1033

composite_rules:
  - id: extension-device-geo-upload
    desc: Extension uploads device identity and IP geolocation as JSON
    crit: hostile
    conf: 0.9
    for: [crx, xpi, zip, javascript]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ipwho-is
      - id: micro-behaviors/data/serialize/schema-object::device-identity-field
      - id: micro-behaviors/communications/http/request/json::js-non-loopback-json-post
