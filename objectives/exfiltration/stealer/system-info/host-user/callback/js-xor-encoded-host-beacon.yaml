# A script that reads the machine hostname, XORs a JSON profile with a repeating
# key, base64-encodes it, and POSTs it. The XOR-plus-base64 wrapper is what sets
# this apart from a plain host report: it hides the profile from a network
# observer that does not know the key. Each leg alone is ordinary (a telemetry
# client sends a hostname; an encoder XORs a buffer), so the composite needs all
# four in one file.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1082,T1041,T1027

composite_rules:
  - id: js-xor-encoded-host-beacon
    desc: Script XORs and base64-encodes a host profile, then POSTs it
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/sysinfo/hostname/reference::hostname-field-token
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-byte-array-xor-modulo-key-loop
      - id: micro-behaviors/data/encode/base64/primitive::tostring-base64
    near_bytes: 8192
