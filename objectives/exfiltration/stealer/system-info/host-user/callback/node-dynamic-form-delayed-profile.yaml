defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1082,T1033
traits:
- id: node-dynamic-form-encoded-host
  desc: Encodes profile receiver in split hex
  crit: suspicious
  if:
    type: text
    substr: 2e3232382e3230362e3138333a383434332f
- id: node-dynamic-form-random-delay
  desc: Delays staged profile upload
  crit: notable
  if:
    type: text
    substr: 30000 + Math.floor(Math.random() * 90000)
- id: node-dynamic-form-host-profile
  desc: Collects hostname and user identity
  crit: notable
  if:
    type: text
    substr: 'u: os.userInfo().username'
- id: node-dynamic-form-upload
  desc: Writes collected profile to request
  crit: suspicious
  if:
    type: text
    substr: req.write(JSON.stringify(payload))
composite_rules:
- id: node-dynamic-form-staged-profile-upload
  desc: Stages delayed host profile upload
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/stealer/system-info/host-user/callback::node-dynamic-form-encoded-host
  - id: objectives/exfiltration/stealer/system-info/host-user/callback::node-dynamic-form-random-delay
  - id: objectives/exfiltration/stealer/system-info/host-user/callback::node-dynamic-form-host-profile
  - id: objectives/exfiltration/stealer/system-info/host-user/callback::node-dynamic-form-upload
