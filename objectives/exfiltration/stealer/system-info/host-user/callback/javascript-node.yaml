defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
composite_rules:
- id: node-analytics-host-home-profile-exfil
  desc: Posts hostname and home directory to Google Analytics
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1033
  mbc: E1041
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/sysinfo/profile::os-hostname-device-json-field
  - id: micro-behaviors/os/sysinfo/profile::os-homedir-json-field
  - id: micro-behaviors/os/sysinfo/profile::os-platform-json-field
  - id: micro-behaviors/communications/http/services/analytics::google-analytics-mp-collect-endpoint
  - id: micro-behaviors/communications/http/request/json::fetch-flow-json-post-body

- id: node-host-profile-discord-webhook-exfil
  desc: Posts host identity profile to Discord
  crit: hostile
  conf: 0.99
  for: [javascript]
  scope: file
  all:
  - id: micro-behaviors/process/identity/query/principal::process-user-identity-api-set
  - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
  - id: micro-behaviors/os/sysinfo/platform/runtime/version::os-release-call
  - id: objectives/exfiltration/stealer/credential/environment/current-process::discord-login-webhook
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/data/serialize/json::json-stringify-call

- id: node-host-user-json-http-exfil
  desc: Node exfiltrates host and user via JSON POST
  conf: 0.98
  attack: T1041,T1082,T1033
  mbc: E1041
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-query
  - id: objectives/discovery/system/profile::js-hostname-whoami-json-object
  - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
  - id: micro-behaviors/communications/http/request/json::json-body-post
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  unless:
  - id: metadata/path/directory::test-directory-component
- id: javascript-xor-host-profile-http-exfil
  desc: XOR-hidden HTTP exfiltrates host and user
  conf: 0.99
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
  - id: micro-behaviors/data/stream/write::javascript-write-then-end-stream
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-byte-array-xor-modulo-key-loop
