# A PHP component that reads the operating system and the process user and
# posts them over HTTP. Telemetry plugins can send similar fields, so the
# finding stays suspicious. The claim needs the OS read, the account lookup,
# and the request in one file.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1082

composite_rules:
  - id: php-host-user-http-post
    desc: PHP posts OS and process-user identity over HTTP
    crit: suspicious
    conf: 0.88
    near_lines: 120
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::php-uname-call
      - id: micro-behaviors/os/user/lookup::php-user-record-query
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
