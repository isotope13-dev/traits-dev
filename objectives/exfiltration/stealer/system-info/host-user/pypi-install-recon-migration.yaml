defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
  mbc: E1041
composite_rules:
- id: pypi-egg-info-oob-host-profile
  desc: PyPI egg_info hook exfiltrates a host profile to OOB
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1552.001,T1041
  scope: leaf
  all:
  - id: metadata/build/pip::root-setup-py
  - id: metadata/build/package/recipe/setup-hooks::setuptools-egg-info-run-override
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlencode
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
# Module-scope code in setup.py/install.py runs during installation without
# any build-hook override. A host-identity JSON body posted to an OOB capture
# service from that scope is an install-time beacon, whatever the package
# claims about authorized testing.
- id: pypi-setup-module-oob-host-identity-beacon
  desc: setup.py module scope posts host identity to an OOB service
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1082,T1041
  scope: leaf
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  - id: objectives/exfiltration/stealer/system-info/identity::python-urllib-oob-host-identity-body
