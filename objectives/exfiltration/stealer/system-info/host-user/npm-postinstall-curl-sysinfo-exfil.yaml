defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-curl-sysinfo-exfil
  desc: postinstall exfiltrates system or path information via curl POST
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002
  mbc: E1041
  all:
  - id: micro-behaviors/communications/http/curl/body::curl-http-post
  any:
  - id: micro-behaviors/fs/directory/cwd::package-script-pwd-substitution
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  unless:
  # RFC 2606 documentation domains are non-routable: a POST there reaches no
  # attacker, so the exfiltration claim does not hold.
  - id: metadata/package/scripts/reference::reserved-docs-domain-npm-script
