defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-host-identity-get-with-oob-reference
    desc: Host identity GET beside OOB service reference
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::node-host-identity-get-url
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
    unless:
      - id: objectives/exfiltration/stealer/system-info/hostname::node-host-identity-oob-request-exfiltration

  - id: node-host-user-ip-get-exfil
    desc: Node script sends host and user identity to external IP via HTTP GET
    crit: hostile
    conf: 0.98
    attack: T1041,T1082,T1033
    mbc: E1041
    scope: file
    all:
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-query
    unless:
      - id: objectives/discovery/cloud/metadata
      - id: micro-behaviors/communications/http/services/aws::native-imds-endpoint-reference
      - id: micro-behaviors/communications/http/services/gcp::native-metadata-host-and-flavor-header
      - id: metadata/path/directory::test-directory-component
