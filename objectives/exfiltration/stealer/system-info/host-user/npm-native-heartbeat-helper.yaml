defaults:
  platforms: [windows]
  attack: T1195.002,T1041,T1082,T1033

traits:
  - id: npm-postinstall-spawns-bundled-helper
    desc: Postinstall spawns bundled helper executable
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?s)helper\.exe.{0,400}\bspawn\s*\(\s*src\s*,'

  - id: pe-heartbeat-host-profile-json
    desc: Native heartbeat includes host and user profile
    crit: suspicious
    conf: 0.99
    for: [pe]
    if:
      type: text
      regex: '(?i)heartbeat.{0,120}hostname.{0,60}user.{0,60}os_sysname.{0,100}os_release'

  - id: pe-tds-heartbeat-agent
    desc: Native helper identifies TDS heartbeat traffic
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      substr: TDS-PT-Heartbeat/1.0

composite_rules:
  - id: pe-tds-heartbeat-host-profile
    desc: Native heartbeat posts host user profile
    crit: suspicious
    conf: 0.99
    for: [pe]
    scope: file
    all:
      - id: pe-heartbeat-host-profile-json
      - id: micro-behaviors/communications/http/post::post-template-pe
      - id: pe-tds-heartbeat-agent

  - id: npm-install-native-heartbeat-host-profile
    desc: npm install runs native host profile beacon
    crit: hostile
    conf: 0.995
    for:
    - zip
    - npm
    - tar
    - package.json
    - pe
    scope: archive
    all:
    - id: npm-postinstall-spawns-bundled-helper
    - id: pe-tds-heartbeat-host-profile

