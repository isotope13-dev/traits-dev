defaults:
  platforms: [unix, windows]
  for: [package.json]
  mbc: E1041
composite_rules:
- id: preinstall-node-https-system-profile-exfil
  desc: preinstall exfiltrates host user info via HTTPS
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
    # hostname + username + https.get inside an inline node -e preinstall is
    # already a conclusive host-profile beacon. os.platform is one of several
    # corroborating signals, not a hard requirement — real beacons (e.g. the
    # OAST dependency-confusion variant) read only hostname+username and add a
    # profile query key or a DNS-exfil channel instead.
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/command::npm-lifecycle-node-inline-reference
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: micro-behaviors/os/sysinfo/hostname/query::preinstall-node-os-hostname
  - id: micro-behaviors/process/identity/query/principal::preinstall-node-os-userinfo
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::preinstall-node-os-platform
  - id: micro-behaviors/communications/url/query/structure::preinstall-url-query-profile-keys
  - id: micro-behaviors/communications/dns/lookup::preinstall-node-dns-lookup

- id: preinstall-webhook-system-profile-exfil
  desc: preinstall sends host user platform to webhook.site
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/communications/url/host/oob/endpoint::preinstall-webhook-site-url
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: micro-behaviors/os/sysinfo/hostname/query::preinstall-node-os-hostname
  - id: micro-behaviors/process/identity/query/principal::preinstall-node-os-userinfo
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::preinstall-node-os-platform
  - id: micro-behaviors/communications/url/query/structure::preinstall-url-query-profile-keys

- id: preinstall-depconf-webhook-profile-exfil
  desc: dependency-confusion preinstall phones host profile home
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/communications/url/host/oob/endpoint::preinstall-webhook-site-url
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: micro-behaviors/os/sysinfo/hostname/query::preinstall-node-os-hostname
  - id: micro-behaviors/process/identity/query/principal::preinstall-node-os-userinfo
  - id: metadata/package/description/disclosure::npm-description-dependency-confusion-variants
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::preinstall-node-os-platform
  - id: micro-behaviors/communications/url/query/structure::preinstall-url-query-profile-keys
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: metadata/package/description/security::research-claim-with-install-hook

- id: preinstall-webhook-curl-shell-profile-exfil
  desc: preinstall curl exfiltrates shell host user to webhook.site
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
  for: [package.json, npm]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/communications/url/host/oob/endpoint::preinstall-webhook-site-url
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami

- id: preinstall-depconf-webhook-curl-shell-exfil
  desc: Disclosed depconf preinstall curls host user to webhook
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
  for: [package.json, npm]
  scope: archive
  all:
  - id: objectives/exfiltration/stealer/system-info/host-user::preinstall-webhook-curl-shell-profile-exfil
  - id: metadata/package/description/disclosure::npm-description-dependency-confusion-variants
# Bundled-script variant. Every host-profile composite above reads the recon and
# the callback URL straight out of `scripts.preinstall` -- the inline `node -e`
# / webhook.site shape. The dependency-confusion PoC that ships the beacon as a
# separate `index.js` and only writes `"preinstall": "node index.js"` in the
# manifest slips past all of them: the manifest holds no recon, and the JS file
# is not a manifest. This pairs the install hook (any lifecycle) with the OOB
# host-recon POST wherever it lands in the same package, across archive scope.
