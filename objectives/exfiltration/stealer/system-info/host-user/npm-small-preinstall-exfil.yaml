defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: small-preinstall-host-exfil
    desc: Small preinstall manifest and host exfiltration
    crit: hostile
    conf: 0.995
    mbc: "E1041"
    all:
      - id: metadata/package/completeness::small-no-deps-preinstall-manifest
    any:
      - id: objectives/exfiltration/stealer/system-info/host-user::curl-host-user-oob-exfil
      - id: objectives/exfiltration/stealer/system-info/host-user::curl-host-profile-oob-exfil
      - id: objectives/exfiltration/stealer/system-info/host-user::npm-preinstall-urlencoded-host-profile-oob
      - id: objectives/exfiltration/stealer/system-info/host-user::npm-preinstall-host-profile-oob
      - id: objectives/exfiltration/stealer/system-info/host-user::npm-preinstall-node-oast-host-profile-exfil
