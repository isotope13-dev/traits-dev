defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1033
traits:
- id: node-socket-user-profile-reconnect
  desc: Sends user profile over reconnecting socket
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /os\.userInfo\s*\(\s*\)/s
          $b0_1 = /sendToServer\s*\(\s*JSON\.stringify\s*\(/s
          $b0_2 = /\.write\s*\(/s
          $b0_3 = /new\s+net\.Socket\s*\(\s*\)/s
          $b0_4 = /\.connect\s*\(/s
          $b0_5 = /reconnectToServer\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 500 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 800 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 800 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 200 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 800 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-install-socket-user-profile-reconnect
  desc: npm install sends user profile over reconnecting socket
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: node-socket-user-profile-reconnect
