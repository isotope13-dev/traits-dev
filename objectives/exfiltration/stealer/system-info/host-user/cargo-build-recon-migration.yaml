defaults:
  mbc: E1041
  platforms: [unix, windows]

composite_rules:
  - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-supabase-recon-exfil
    desc: Rust build.rs recons host then exfils to Supabase
    crit: hostile
    conf: 0.995
    attack: T1195.002
    all:
      - id: micro-behaviors/os/sysinfo/report::rust-build-host-user-command-recon
      - id: micro-behaviors/communications/http/services/supabase::rust-supabase-webhook-function-url
      - id: micro-behaviors/data/encode/base64/primitive::to-base64-string
      - id: micro-behaviors/data/encode/charset::powershell-utf8-getbytes
      - id: micro-behaviors/communications/http/request/header/user-agent::rust-restmethod-useragent-template
      - id: micro-behaviors/process/create/subprocess/configure::rust-command-new-call
      - id: metadata/lang/source/syntax/argument::rust-command-powershell
  - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-dual-channel-telemetry-exfil
    desc: Rust build.rs sends encoded telemetry in URL and user-agent
    crit: hostile
    conf: 0.99
    attack: T1041
    all:
      - id: micro-behaviors/os/sysinfo/report::rust-build-host-user-command-recon
      - id: micro-behaviors/communications/http/services/supabase::rust-supabase-webhook-function-url
      - id: micro-behaviors/data/encode/base64/primitive::to-base64-string
      - id: micro-behaviors/data/encode/charset::powershell-utf8-getbytes
      - id: micro-behaviors/communications/http/request/header/user-agent::rust-restmethod-useragent-template
      - id: metadata/lang/source/syntax/argument::rust-command-powershell
  - id: objectives/exfiltration/stealer/system-info/host-user::cargo-build-hook-supabase-recon-exfil
    desc: Cargo build hook recons host and exfils telemetry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-supabase-recon-exfil
  - id: objectives/exfiltration/stealer/system-info/host-user::cargo-archive-build-rs-supabase-recon-exfil
    desc: Cargo archive build.rs recons host and exfils telemetry
    crit: hostile
    conf: 0.995
    attack: T1195.002
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-supabase-recon-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
  - id: objectives/exfiltration/stealer/system-info/host-user::cargo-build-hook-masked-telemetry-exfil
    desc: Cargo build hook masks telemetry as security validation
    crit: hostile
    conf: 0.99
    attack: T1195.002
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-dual-channel-telemetry-exfil
  - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-telegram-recon-exfil
    desc: Rust build.rs exfils host profile to Telegram
    crit: hostile
    conf: 0.995
    attack: T1195.002
    for: [rust]
    all:
      - id: micro-behaviors/os/sysinfo/report::rust-build-host-user-command-recon
      - id: micro-behaviors/communications/http/services/telegram::rust-telegram-bot-api-client
      - id: micro-behaviors/process/create/subprocess/configure::rust-command-curl-wget
    any:
      - id: micro-behaviors/communications/http/ip-discovery::ifconfig-me
      - id: micro-behaviors/process/create/subprocess/capture::rust-build-rs-command-output
  - id: objectives/exfiltration/stealer/system-info/host-user::cargo-archive-build-rs-telegram-recon-exfil
    desc: Cargo archive build.rs exfils host profile
    crit: hostile
    conf: 0.995
    attack: T1195.002
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-telegram-recon-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
  - id: objectives/exfiltration/stealer/system-info/host-user::cargo-archive-build-rs-masked-telemetry-exfil
    desc: Cargo archive build.rs masks telemetry as security validation
    crit: hostile
    conf: 0.99
    attack: T1195.002
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-dual-channel-telemetry-exfil
    unless:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
  - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-raw-socket-profile-exfil
    desc: Rust build.rs sends host profile over a fixed raw socket
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1041,T1082
    for: [rust]
    all:
      - id: micro-behaviors/os/sysinfo/report::rust-build-host-user-command-recon
      - id: objectives/exfiltration/stealer/system-info/host-user::rust-http-profile-raw-socket-exfil
  - id: objectives/exfiltration/stealer/system-info/host-user::cargo-build-hook-raw-socket-profile-exfil
    desc: Cargo build hook exfils host profile over a raw socket
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1041,T1082
    for: [rust, crate, tar, zip, cargo-toml]
    scope: archive
    all:
      - id: "metadata/package/scripts/build::cargo-build-script-declared"
      - id: objectives/exfiltration/stealer/system-info/host-user::rust-build-raw-socket-profile-exfil
  - id: objectives/exfiltration/stealer/system-info/host-user::cargo-archive-build-rs-env-snapshot-upload
    desc: Cargo archive build.rs uploads full environment snapshot
    crit: hostile
    conf: 0.97
    attack: T1041,T1195.002
    for: [rust, crate, tar, cargo-toml]
    scope: archive
    all:
      - id: metadata/build/archive::archive-cargo-crate-build-script
      - id: objectives/exfiltration/http/env::rust-build-script-env-curl-exfil
