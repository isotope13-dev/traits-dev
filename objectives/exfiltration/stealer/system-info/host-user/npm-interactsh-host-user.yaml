defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: curl-host-user-oob-exfil
  desc: Curl exfiltrates host user to OOB
  crit: suspicious
  conf: 0.96
  attack: "T1041"
  all:
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/process/identity/query/command::host-user-chain
  - id: metadata/package/scripts/reference::interactsh-oast-domain
- id: curl-host-profile-oob-exfil
  desc: Curl exfiltrates host profile to OOB
  crit: hostile
  conf: 0.98
  attack: "T1041"
  all:
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: metadata/package/scripts/reference::interactsh-oast-domain
  - id: micro-behaviors/communications/http/curl/body::curl-data-urlencode-info-field
  - id: micro-behaviors/process/identity/query/command::host-user-pwd-chain
- id: npm-preinstall-interactsh-host-recon
  desc: Preinstall OOB and host identity clues
  crit: suspicious
  conf: 0.995
  all:
  - id: metadata/package/scripts/reference::interactsh-oast-domain
  - id: micro-behaviors/process/identity/query/command::host-user-chain
  any:
  - id: curl-host-user-oob-exfil
  - id: objectives/exfiltration/http/hostname::powershell-host-user-post-exfil
  - id: metadata/package/scripts/command::powershell-fallback
- id: npm-preinstall-urlencoded-host-profile-oob
  desc: npm preinstall exfiltrates host profile to OOB
  crit: hostile
  conf: 0.998
  attack: "T1195.002"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/package/scripts/reference::interactsh-oast-domain
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  any:
  - id: micro-behaviors/communications/http/curl/body::curl-data-urlencode-hostname-field
  - id: micro-behaviors/communications/http/curl/body::curl-data-urlencode-user-field
  - id: micro-behaviors/communications/http/curl/body::curl-data-urlencode-pwd-field
  - id: micro-behaviors/communications/http/curl/body::curl-data-urlencode-fqdn-field
  - id: micro-behaviors/communications/http/curl/body::curl-data-urlencode-domain-field
  needs: 4
- id: npm-preinstall-cross-platform-oob-exfil
  desc: npm preinstall uses shell and PowerShell exfil
  crit: hostile
  conf: 0.995
  attack: "T1195.002"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/reference::interactsh-oast-domain
  - id: micro-behaviors/process/identity/query/command::host-user-chain
  - id: micro-behaviors/communications/http/request/package::cross-platform-preinstall-http-exfil
  - id: objectives/exfiltration/http/hostname::powershell-host-user-post-exfil
  any:
  - id: micro-behaviors/communications/http/curl/command::curl-stderr-devnull
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::powershell-usebasicparsing
- id: npm-preinstall-host-profile-oob
  desc: npm preinstall exfiltrates hostname username and cwd to OOB
  crit: hostile
  conf: 0.998
  attack: "T1195.002"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/reference::interactsh-oast-domain
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/communications/http/curl/body::curl-data-urlencode-info-field
  - id: micro-behaviors/process/identity/query/command::host-user-pwd-chain
  - id: curl-host-profile-oob-exfil
- id: npm-preinstall-node-oast-host-profile-exfil
  desc: npm preinstall exfiltrates host user to OAST via Node
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041, T1082, T1033"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/reference::interactsh-oast-domain
  - id: micro-behaviors/os/sysinfo/hostname/query::preinstall-node-os-hostname
  - id: micro-behaviors/process/identity/query/principal::preinstall-node-os-userinfo
  any:
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: micro-behaviors/communications/dns/lookup::preinstall-node-dns-lookup
