defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1041,T1082
traits:
- id: npm-depconf-poc-description
  desc: Describes dependency confusion proof
  crit: suspicious
  for:
  - package.json
  if:
    type: value
    path: description
    regex: (?i)dependency confusion (poc|proof)
- id: node-depconf-public-ip-api
  desc: Fetches public IP from ipify
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: api.ipify.org
- id: node-depconf-user-profile
  desc: Collects user and host details
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: (?s)os\.userInfo\(\)\.username.{0,120}os\.hostname\(\).{0,120}os\.platform\(\)
- id: node-depconf-post-json
  desc: Posts JSON payload over HTTPS
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: (?s)method:\s*['"]POST['"].{0,400}https\.request\(options.{0,400}req\.write\(payload\)
composite_rules:
- id: npm-depconf-public-ip-profile-post
  desc: Dependency confusion install posts host profile
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/exfiltration/stealer/system-info/host-user::npm-depconf-poc-description
  - id: objectives/exfiltration/http/webhook::npm-index-postinstall
  - id: objectives/exfiltration/stealer/system-info/host-user::node-depconf-public-ip-api
  - id: objectives/exfiltration/stealer/system-info/host-user::node-depconf-user-profile
  - id: objectives/exfiltration/stealer/system-info/host-user::node-depconf-post-json
