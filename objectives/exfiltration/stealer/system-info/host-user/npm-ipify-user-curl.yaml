defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1033
traits:
- id: postinstall-ipify-whoami-curl
  desc: Postinstall sends user and public IP
  crit: hostile
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    regex: (?s)whoami.{0,250}api\.ipify\.org.{0,250}user=\$USER.{0,100}ip=\$PUBIP
- id: node-ipify-user-curl-query
  desc: Sends username and ipify address through curl
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /os\.userInfo\s*\(\s*\)\.username/s
          $b0_1 = /https\.get\s*\(\s*["']https:\/\/api\.ipify\.org["']/s
          $b0_2 = /https?:\/\/[^\s`]+[?&]user=\$\{encodeURIComponent\(user\)\}[^\s`]*[&]ip=\$\{encodeURIComponent\(ip\)\}/s
          $b0_3 = /execSync\s*\(\s*`curl\b/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 400 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1200 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 250 and
                    true
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-postinstall-node-ipify-user-curl
  desc: npm install sends user and public IP through curl
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: node-ipify-user-curl-query
