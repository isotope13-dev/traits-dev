defaults:
  platforms: [freebsd, netbsd, unix]
  for: [swift]
  attack: T1041

traits:
  - id: swift-process-report-marker
    desc: Swift process discovery report marker
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: PROCESS_DISCOVERY_REPORT

  - id: swift-urlsession-collect-post
    desc: Swift URLSession POST collect
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'URLComponents\(string:[\s\S]{0,160}/collect[\s\S]{0,260}request\.httpMethod = "POST"'
  - id: swift-system-process-inventory
    desc: Swift system process inventory
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'querySystemInfo[\s\S]{0,400}enumerateProcesses[\s\S]{0,400}enumerateNetworkInterfaces'
  - id: swift-network-recon-payload
    desc: Swift network recon payload
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'interfaces[\s\S]{0,500}routes[\s\S]{0,500}arp[\s\S]{0,500}dns'
  - id: swift-exfil-url-path
    desc: Swift exfil URL path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /exfil
  - id: swift-wmi-analog-marker
    desc: Swift WMI analog marker
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "WMI Analog: Win32_Process"
  - id: swift-netbsd-rc-service-enum
    desc: Swift NetBSD rc service enum
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: let svcDir = "/etc/rc.d"

composite_rules:
  - id: swift-process-report-http-exfil
    desc: Swift exfiltrates process report
    crit: hostile
    conf: 0.98
    all:
      - id: swift-process-report-marker
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
  - id: swift-inventory-http-exfil
    desc: Swift inventory HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: swift-system-process-inventory
      - id: swift-urlsession-collect-post
  - id: swift-network-info-http-exfil
    desc: Swift network info HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: swift-network-recon-payload
      - id: swift-exfil-url-path
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
  - id: swift-wmi-analog-http-exfil
    desc: Swift WMI analog HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: swift-wmi-analog-marker
      - id: swift-netbsd-rc-service-enum
      - id: swift-urlsession-collect-post

  - id: swift-nc-credential-exfil
    desc: Netcat shell with credential exfil URL
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/reverse-shell/netcat::nc-exec-sh
      - id: swift-exfil-url-path
      - id: objectives/credential-access/ssh/key::swift-ssh-dir-enumeration

  - id: swift-log-clear-exfil
    desc: Log wipe paired with an exfil URL
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/indicator-removal/logs::swift-netbsd-log-list
      - id: swift-exfil-url-path
      - id: micro-behaviors/communications/http/post::swift-urlsession-data-task

  - id: swift-nc-password-recon
    desc: Netcat shell with password file recon
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/reverse-shell/netcat::nc-exec-sh
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: objectives/exfiltration/stealer/credential/http::swift-messages-endpoint

  - id: swift-shell-route-exfil
    desc: Shell route dump posted over HTTP
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/network/interface::ifconfig
      - id: micro-behaviors/os/network/interface::ip-route-show
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/process/create/shell/runner::swift-shell-command-exec

  - id: swift-host-release-post
    desc: Posts OS release and account paths
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/os::linux-release-file-reference
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
