defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1041,T1071.001,T1195.002
  mbc: E1041

traits:
  - id: node-install-profile-http-dns-beacons-with-killswitch
    desc: Sends package, host, user and CI environment details through HTTP and DNS with a remote kill switch
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)COLLABORATOR_URL\s*=\s*["'']https?://[^"'']+\.collab\.invokeshell\.net["''][\s\S]{0,1200}KILLSWITCH_DOMAIN[\s\S]{0,2200}nslookup\s+\$\{KILLSWITCH_DOMAIN\}[\s\S]{0,7000}env\s*:\s*\{[\s\S]{0,1200}process\.env\.[A-Z_]+[\s\S]{0,5000}sendDnsBeacon\s*\([\s\S]{0,1800}sendPostBeacon\s*\('

composite_rules:
  - id: npm-postinstall-profile-exfiltration-dual-beacon-killswitch
    desc: npm postinstall fingerprints the host and sends it through DNS and HTTP unless remotely disabled
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: node-install-profile-http-dns-beacons-with-killswitch
