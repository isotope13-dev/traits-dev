# CIL: the service inventory task calls ServiceController.GetServices,
# formats service names and properties into a report, then uploads that file.
# A legitimate service diagnostic lacking infection tasking does not qualify.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-infection-service-report-upload
    desc: Infection-task implant uploads service inventory
    crit: hostile
    conf: 0.98
    attack: T1007,T1041
    all:
      - id: objectives/exfiltration/stealer/system-info/identity::managed-infection-domain-report-upload
      - id: objectives/command-and-control/remote-command/shell::managed-infection-task-command-output-references
      - id: metadata/binary/symbols/name/token::dotnet-getservices-member-name
      - id: micro-behaviors/data/format/string::service-name-report-label
