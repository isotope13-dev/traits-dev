defaults:
  platforms: [windows]
  for: [batch]
  attack: T1518.001,T1070.004,T1041

composite_rules:
  - id: av-inventory-curl-upload-cleanup
    desc: Queries WMI antivirus inventory, uploads file via curl, and deletes stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/wmi/query::query-antivirus
      - id: micro-behaviors/communications/http/upload/file::curl-form-file-attachment
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
