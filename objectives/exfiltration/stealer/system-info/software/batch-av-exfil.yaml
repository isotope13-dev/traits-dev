defaults:
  platforms: [windows]
  for: [batch]
  attack: T1518.001,T1070.004,T1041

composite_rules:
  - id: av-inventory-curl-upload-cleanup
    desc: Antivirus inventory query with command-output upload and file deletion
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/wmi/query::query-antivirus
      - id: micro-behaviors/communications/http/upload/file::batch-command-output-form-file-upload
      - id: micro-behaviors/fs/delete/file/command::batch-del-call
