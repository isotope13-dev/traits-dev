# Android package inventory is assembled from installed package names and
# posted to a remote inventory endpoint.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1041

traits:
- id: android-package-inventory-post-call
  desc: Posts a package inventory string
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'post\s*\(\s*"/(inventory|applications|packages)"\s*,\s*\w+\.toString\s*\(\s*\)'

composite_rules:
- id: android-installed-package-inventory-exfil
  desc: Exfiltrates installed app inventory
  crit: hostile
  conf: 0.98
  scope: file
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/package-manager/management::android-installed-apps-enumeration
  - id: micro-behaviors/os/package-manager/management::android-package-name-list-builder
  - id: android-package-inventory-post-call
  - id: micro-behaviors/communications/http/post::jvm-post-method-source
  - id: metadata/lang/source/shape::jvm-do-output-configuration
