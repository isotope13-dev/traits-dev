# Server-wide CMS inventory: recursively enumerate the filesystem for the config
# files of several different web products, and POST from the same code region.
# A WordPress plugin has no reason to look for Magento, Drupal and PrestaShop
# installs on its host; on a shared server the list maps neighbouring sites.
# Co-location of the search and the POST, not a proven flow of the result.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1083,T1518,T1041

composite_rules:
  - id: php-multi-cms-config-search-post
    desc: Searches for several CMS configs and POSTs
    crit: suspicious
    conf: 0.9
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/config/web::multi-cms-config-paths
      - id: micro-behaviors/fs/directory/readdir/language::php-directory-enumeration
    any:
      - id: micro-behaviors/communications/http/curl/binding::post-data
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-post
      - id: micro-behaviors/communications/http/post::php-request-options-post-method
