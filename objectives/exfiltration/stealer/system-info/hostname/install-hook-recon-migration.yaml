defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-preinstall-axios-webhook-hostname-profile-exfil
  desc: npm preinstall posts hostname profile to webhook.site
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  for: [package.json, npm, zip, javascript]
  scope: package
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/data/serialize/schema-object::javascript-hostname-or-port-object-fields
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
- id: npm-preinstall-oastify-hostname-query-exfil
  desc: npm preinstall sends the machine hostname to an OASTify endpoint
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  for: [package.json, npm, zip]
  scope: package
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/process/interpreter/node::scripts-preinstall-node-e
  - id: micro-behaviors/communications/url/host/oob/package::js-oastify-host
  - id: micro-behaviors/os/sysinfo/hostname/query::preinstall-node-os-hostname
  any:
  - id: micro-behaviors/communications/http/request/package::npm-preinstall-oastify-hostname-query-url
  - id: micro-behaviors/communications/http/request/package::npm-preinstall-curl-oastify-hostname-query-url
  needs: 1
- id: npm-preinstall-dns-hostname-exfil
  desc: NPM preinstall exfils hostname via DNS
  crit: hostile
  conf: 0.995
  attack: T1048.003
  mbc: E1041
  all:
  - id: micro-behaviors/communications/dns/cli::npm-preinstall-nslookup
  - id: micro-behaviors/os/sysinfo/hostname/transform::npm-preinstall-hostname-base64
  - id: micro-behaviors/communications/url/host/oob/package::npm-preinstall-collaborator-tempest
