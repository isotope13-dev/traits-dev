defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-preinstall-dns-hostname-exfil
  desc: NPM preinstall exfils hostname via DNS
  crit: hostile
  conf: 0.995
  attack: T1048.003
  mbc: E1041
  all:
  - id: micro-behaviors/communications/dns/cli::npm-preinstall-nslookup
  - id: micro-behaviors/os/sysinfo/hostname/transform::npm-preinstall-hostname-base64
  - id: micro-behaviors/communications/url/host/oob/package::npm-preinstall-collaborator-tempest
