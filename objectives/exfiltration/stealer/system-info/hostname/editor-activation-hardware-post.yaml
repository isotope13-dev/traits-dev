# An editor extension's activation module that writes the machine's hostname
# into an outbound request body alongside CPU and memory inventory. The
# hostname names the workstation; the hardware inventory distinguishes it
# from others of the same name. Editor features never need either on a
# remote server, and the marketplace telemetry module reports neither.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1082,T1041
composite_rules:
  - id: editor-activation-host-hardware-post
    desc: Extension activation posts hostname with CPU and memory inventory
    crit: hostile
    conf: 0.92
    all:
      - id: well-known/lib/development/vscode::activate-export
      - id: micro-behaviors/communications/http/telemetry::node-request-body-host-identity-origin
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: micro-behaviors/os/sysinfo/performance::node-os-totalmem
