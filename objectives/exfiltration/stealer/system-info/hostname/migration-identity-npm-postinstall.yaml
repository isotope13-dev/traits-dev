defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-postinstall-oast-hostname-get
  desc: Postinstall GET exports hostname to OAST
  crit: hostile
  conf: 0.98
  attack: T1048.003
  mbc: E1048
