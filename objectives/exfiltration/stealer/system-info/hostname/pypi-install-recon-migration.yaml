defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: pypi-install-host-cwd-exfil
  desc: Setup host query and encoded POST clues
  crit: hostile
  conf: 0.96
  attack: T1020
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/post::requests-post
  any:
  - id: micro-behaviors/process/create/exec::python-subprocess-check-call-text
  - id: objectives/anti-analysis/sandbox-detect/script::cwd-sandbox-keyword-check
- id: pypi-install-beacon
  desc: PyPI install-time system beacon
  crit: hostile
  conf: 0.95
  attack: T1020
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/communications/url/query/endpoint::php-live-query-fragment
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/os/env/read/variable::windows-computername-env
