defaults:
  platforms: [windows, unix]
  for: [xml]
  attack: T1195.002,T1041
composite_rules:
  - id: nuget-build-hook-hostname-beacon-download
    desc: NuGet build hook downloads a hostname-bearing URL pre-build
    crit: hostile
    conf: 0.97
    for: [nupkg, xml]
    scope: package
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: metadata/build/msbuild::msbuild-before-build-target
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-task
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-computername-source

  # A NuGet package whose build targets hook executes an interactive or
  # demonstration application (such as notepad or calc). Restoring the package
  # executes the hook on every build of the consuming project.
