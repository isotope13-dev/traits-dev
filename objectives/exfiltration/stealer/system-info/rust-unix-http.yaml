defaults:
  platforms: [unix]
  for: [rust, elf]
  attack: T1041

composite_rules:
  - id: rust-octet-exfil-transport
    desc: Rust octet exfil transport
    crit: suspicious
    conf: 0.94
    any:
      - id: objectives/exfiltration/http/collect::rust-ureq-octet-stream-post
      - id: objectives/exfiltration/http/collect::rust-elf-octet-stream-exfil

  - id: rust-host-profile-http-exfil
    desc: Rust host profile HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/fingerprint/runtime::rust-system-info-discovery
      - id: objectives/exfiltration/http/collect::rust-exfil-path-marker
      - id: rust-octet-exfil-transport
