defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-setup-gcp-account-metadata-webhook-post
    desc: Setup posts GCP account metadata to webhook
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041,T1526
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (call function: (attribute object: (identifier) @os attribute: (identifier) @system)
              arguments: (argument_list (concatenated_string) @command)))))
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (call function: (identifier) @invoke))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @cmdclass
              value: (dictionary (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @os "os") (#eq? @system "system") (#eq? @helper @invoke)
          (#eq? @install "install") (#eq? @run "run") (#eq? @setup "setup")
          (#eq? @cmdclass "cmdclass") (#eq? @hook @registered)
          (#match? @installkey "^.install.$")
          (#match? @command "access_token=[$][(]curl")
          (#match? @command "metadata[.]google[.]internal/computeMetadata/v1/instance/service-accounts/")
          (#match? @command "curl -X POST -d.{0,8}[$]access_token")
          (#match? @command "https?://webhook[.]site/"))
