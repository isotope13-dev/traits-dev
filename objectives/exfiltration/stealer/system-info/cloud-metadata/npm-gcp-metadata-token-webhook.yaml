defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1552.005,T1041,T1195.002
  mbc: E1041
traits:
- id: npm-preinstall-posts-gcp-metadata-token
  desc: Preinstall uploads GCP metadata token
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /"preinstall"\s*:/is
          $b0_1 = /metadata\.google\.internal\/computeMetadata\/v1\/instance\/service-accounts\/[^\s"']+\/token/is
          $b0_2 = /curl\s+-X\s+POST\s+-d\s+\$access_token\s+https?:\/\/([^\s"']+\/)?webhook(\.com|\.site|\.fun)/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 700 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 700 and
                  true
                )
              )
            )
          )
      }
composite_rules:
- id: npm-preinstall-exfiltrates-gcp-service-account-token
  desc: npm preinstall exfiltrates a Google Cloud service-account token
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/stealer/system-info/cloud-metadata::npm-preinstall-posts-gcp-metadata-token
