defaults:
  for:
  - package.json
  crit: suspicious
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios

composite_rules:
- id: npm-ecs-container-metadata-ngrok-exfil
  desc: ECS metadata reference with ngrok POST
  conf: 0.995
  all:
  - id: micro-behaviors/os/env/cloud::postinstall-ecs-metadata-uri-reference
  - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/file/profile/test-indications::fixture-evidence
