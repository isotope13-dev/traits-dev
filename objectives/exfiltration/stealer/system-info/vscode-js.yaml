defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: E1041

composite_rules:
- id: host-user-identity-http-query
  desc: Host user identity HTTP query exfiltration
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: objectives/discovery/system/fingerprint/user::node-host-user-query
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/get::javascript-get-method-text
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/fs/path/secret-config::git-configuration-path
  any:
  - id: metadata/file/string/account::account-email-label
  - id: metadata/file/string/identity::client-uuid-label
  - id: micro-behaviors/os/module/export::commonjs-domain-like-export
  - id: metadata/file/string/account::customer-contact-field
  - id: metadata/file/string/identity::flags-identifier
  - id: micro-behaviors/data/serialize/schema-object::host-user-object-fields
  - id: micro-behaviors/data/serialize/schema-object::machine-id-object-field
  - id: metadata/file/string/account::postal-address-field
  - id: micro-behaviors/data/serialize/schema-object::repository-object-fields
  - id: micro-behaviors/data/property/access::result-code-script-property
  - id: micro-behaviors/data/property/access::socket-session-id-member
  - id: metadata/file/string/identity::code-snippet-identifier
  - id: metadata/file/string/device::turbine-speed-field

- id: obfuscated-node-host-profile-http-beacon
  desc: Obfuscated Node host-profile HTTP beacon
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1033
  all:
  - id: objectives/discovery/system/profile::js-host-profile-fields
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  any:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
