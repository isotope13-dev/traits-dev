defaults:
  platforms: [windows]
  for: [batch]
  attack: T1082,T1057,T1041

composite_rules:
  - id: staged-host-recon-curl-form-exfil
    desc: Host inventory commands accompany command-output file upload
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/upload/file::batch-command-output-form-file-upload
      - id: micro-behaviors/fs/write/file/redirect::batch-append-redirect
    needs: 2
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/os/wmi/query::query-antivirus
      - id: micro-behaviors/fs/path/user-directory::windows-user-folder-path-reference
      - id: micro-behaviors/os/env/system-info::computer-user-environment-references
