defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1041

traits: []
composite_rules:
- id: php-obfuscated-server-profile-exfil
  for: [php, zip]
  desc: Obfuscated PHP posts a server profile over cURL
  crit: hostile
  conf: 0.99
  attack: T1027,T1041,T1082
  scope: outer
  all:
  - id: micro-behaviors/communications/http/request/body/construction::php-server-env-json-body
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-dense-php-byte-escapes
  - id: micro-behaviors/communications/http/curl/binding::php-curl-request
  - id: micro-behaviors/os/sysinfo/hostname/query::php-gethostname-call
  - id: micro-behaviors/os/sysinfo/platform/runtime/version::phpversion-call
- id: php-server-profile-remote-stage
  desc: PHP posts profile during remote staging
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/lifecycle/auto-exec::php-curl-write-include-chain
  - id: micro-behaviors/communications/http/request/body/construction::php-server-env-json-body
  - id: micro-behaviors/os/sysinfo/hostname/query::php-gethostname-call
  - id: micro-behaviors/os/sysinfo/platform/runtime/version::phpversion-call
