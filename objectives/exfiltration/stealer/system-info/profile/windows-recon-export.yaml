defaults:
  attack: T1082,T1041
  platforms: [windows]

composite_rules:
  - id: windows-recon-http-exfil
    desc: Mixed Windows reconnaissance sent over HTTP
    crit: hostile
    conf: 0.98
    for: [batch, powershell]
    all:
      - id: objectives/discovery/system/profile::windows-basic-recon-cluster
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
  - id: windows-recon-paste-exfil
    desc: Mixed Windows reconnaissance sent to paste service
    crit: hostile
    conf: 0.97
    for: [batch, powershell, shell, binaries]
    all:
      - id: objectives/discovery/system/profile::windows-basic-recon-cluster
      - id: objectives/discovery/system/profile::windows-recon-command-markers
      # Was the objectives/exfiltration/oob/tunnel directory, whose only
      # batch/shell members were these curl upload atoms (now micro-behaviors).
      - id: micro-behaviors/communications/http/curl::curl-upload-command
      - id: objectives/command-and-control/infrastructure/paste
