defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041

composite_rules:
  - id: node-host-profile-socket-exfil
    desc: Host profile collection accompanies socket sending
    crit: hostile
    conf: 0.98
    for: [javascript]
    scope: file
    near_bytes: 2400
    all:
      - id: objectives/discovery/system/fingerprint/hardware::cross-platform-display-fingerprint
      - id: micro-behaviors/communications/socket/send/content::node-socket-connects-and-writes-json
      - id: metadata/lang/source/syntax/object::host-identity-field-pair
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/process/enumerate/shell::ps-list-command
      - id: micro-behaviors/process/enumerate/shell::tasklist

  - id: npm-install-socket-host-profile-exfil
    desc: Install hook ships host-profile socket exfil
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/exfiltration/stealer/system-info/profile/network-inventory::node-host-profile-socket-exfil
