defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: setup-reverse-shell-host-report
  desc: Setup reverse shell uploads a host report
  crit: hostile
  conf: 0.97
  attack: T1041,T1082
  all:
  - id: metadata/build/pip::root-setup-py
  - id: objectives/command-and-control/reverse-shell/stream-bridge::python-select-interactive-shell-relay
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
