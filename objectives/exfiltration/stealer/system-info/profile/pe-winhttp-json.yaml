defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

traits:
- id: ngrok-systeminfo-report-protocol
  desc: ngrok system inventory report protocol
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: ngrok-free\.dev.{0,120}/api/report.{0,64}SystemInfo Client/1\.0
composite_rules:
- id: tunnel-host-inventory-exfil
  desc: Host inventory exfiltration to tunnel
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/os/sysinfo/profile::win32-system-info-api-set
  - id: micro-behaviors/communications/http/telemetry::winhttp-json-report-flow
  - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tunnel
  any:
  - id: micro-behaviors/communications/http/user-agent::systeminfo-client-user-agent
  - id: micro-behaviors/communications/http/url/telemetry::api-report-path
  - id: objectives/exfiltration/stealer/system-info/profile::ngrok-systeminfo-report-protocol
  needs: 2
