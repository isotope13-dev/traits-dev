defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: hostile-recon-upload-client
    desc: Host information and multipart upload API references
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/client/reference::multipart-wininet-api-inventory
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
    any:
      - id: micro-behaviors/network/interface/query::get-adapters-info
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
      - id: micro-behaviors/os/sysinfo/hardware::get-memory-status
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-lang-id
      - id: micro-behaviors/os/sysinfo/profile::win32-system-info-api-set
    needs: 2
