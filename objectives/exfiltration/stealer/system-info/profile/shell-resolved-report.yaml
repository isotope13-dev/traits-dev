defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  attack: T1041,T1082

composite_rules:
  - id: concealed-shell-resolved-local-profile-post
    desc: Encoded resolver directs local profile to unverified HTTPS host
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/configuration::node-request-host-from-shell-output
      - id: micro-behaviors/communications/http/request/body/construction::node-request-writes-local-path-json
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
