defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  attack: T1041,T1082

composite_rules:
  - id: concealed-shell-resolved-local-profile-post
    desc: Encoded URL beside shell-host profile upload
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/configuration::node-request-host-from-shell-output
      - id: micro-behaviors/communications/http/request/body/construction::node-request-writes-local-path-json
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64

  # The collector can be fetched in plaintext too. Bind the curl result and
  # POST method to one HTTP request, and local-path JSON to an HTTP stream.
  # Certificate-bypass and census calls provide additional file context.
  - id: shell-resolved-load-time-host-census-post
    desc: Startup host survey POST to fetched collector
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/configuration::node-post-host-from-curl-response
      - id: micro-behaviors/communications/http/request/body/construction::node-request-writes-local-path-json
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
      - id: micro-behaviors/os/sysinfo/hostname/query::execsync-quoted-hostname
      - id: micro-behaviors/communications/http/request/client::node-module-level-http-request
