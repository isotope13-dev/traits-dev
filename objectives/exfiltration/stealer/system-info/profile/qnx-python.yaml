defaults:
  platforms: [qnx, unix]
  for: [python, pyc]
  attack: T1041

composite_rules:
  - id: qnx-python-host-profile-exfil
    desc: QNX Python host profile exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/fingerprint/info::qnx-python-host-discovery-bundle
      - id: objectives/exfiltration/http/collect::qnx-python-collect-post
      - id: objectives/exfiltration/http/collect::qnx-python-sha256-exfil-header
