defaults:
  platforms: [unix]
  for: [makefile]
  attack: T1082,T1195.002
  mbc: B0024

composite_rules:
  - id: build-mails-host-identity
    desc: Build recipe mails the builder's identity
    crit: hostile
    conf: 0.96
    near_lines: 2
    all:
      - id: micro-behaviors/communications/email/send/pipe::pipes-to-mail-transport
    any:
      - id: micro-behaviors/process/identity/query/command::identity-command-substitution
      - id: micro-behaviors/process/identity/query/command::shell-whoami-command
      - id: micro-behaviors/os/sysinfo/hostname/command::sh-hostname-command
      - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
    unless:
      - id: metadata/path/directory::test-directory-component
