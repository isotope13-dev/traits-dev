# Collecting a host profile and sending it to a beacon endpoint is
# reconnaissance exfiltration; extension delivery is separate provenance.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1082,T1033,T1041

composite_rules:
  - id: node-extension-host-profile-beacon
    desc: Beacons host profile alongside SSH backdoor
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/telemetry::node-host-profile-json-http-send
      - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
      # Service enablement can fail while the key, tunnel, and report remain.
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access

