# Collecting a host profile and sending it to a beacon endpoint is
# reconnaissance exfiltration; extension delivery is separate provenance.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1082,T1033,T1041

composite_rules:
  - id: node-host-profile-with-ssh-backdoor
    desc: Sends host profile alongside SSH backdoor
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/telemetry::node-request-body-host-identity-origin
      - id: micro-behaviors/os/env/enumerate::js-env-name-credential-regex-filter
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: objectives/command-and-control/backdoor/ssh::cross-platform-sshd-key-backdoor
      # Single-platform builds keep the same planted-key access without the
      # multi-OS branch or a host-key bypass.
      - id: objectives/command-and-control/backdoor/ssh::node-embedded-key-ssh-backdoor
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-local-sshd-reverse-forward

