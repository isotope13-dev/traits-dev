defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, crx, xpi, zip]
  attack: T1119,T1041

composite_rules:
  - id: browser-identity-network-profile-exfiltration
    desc: Extension uploads browser and network identity data
    crit: hostile
    conf: 0.99
    attack: T1119,T1041,T1016
    scope: archive
    for: [crx, xpi, zip, scripts, elf, pe, rust]
    all:
      - id: metadata/file/string/telemetry::browser-identity-field
      - id: metadata/file/string/telemetry::network-address-profile-field
      - id: metadata/file/string/telemetry::geo-system-profile-field
      - id: micro-behaviors/communications/http/request/client::jquery-ajax-call
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-set
      - id: micro-behaviors/communications/http/ip-discovery::geo-endpoint-with-fields
      - id: micro-behaviors/communications/proxy/turn::webrtc-local-ip-discovery
