defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: host-profiled-upload-stealer
    desc: Host profiling with encrypted upload
    crit: hostile
    conf: 0.985
    all:
      - id: objectives/exfiltration/http/encrypted::encrypted-http-upload-client
    any:
      - id: micro-behaviors/process/identity/query/reference::dotnet-user-name
      - id: micro-behaviors/os/sysinfo/hostname/query::dotnet-user-domain-name
      - id: micro-behaviors/os/sysinfo/disk::get-volume-info
      - id: micro-behaviors/os/sysinfo/directories::dotnet-system-directory
    needs: 3
