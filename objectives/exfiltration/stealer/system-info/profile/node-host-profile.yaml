# The generic host-query/POST co-occurrence clue is not install-hook evidence:
# it can combine a host lookup in one function with an unrelated JSON request
# elsewhere in a vendored runtime. The fixed-host profile matcher below is
# file-scoped and proximity-bounded; its JSON-call leg accepts object literals
# as well as identifiers, preserving the actual postinstall beacon pattern.
defaults:
  crit: hostile
  conf: 0.97
  platforms: [unix, windows]
  for: [javascript, typescript, tar, zip]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
- id: npm-install-hook-host-profile-post-hardcoded-host
  desc: Install hook host-profile beacon to fixed host
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  any:
  - id: micro-behaviors/communications/http/request/json::node-host-profile-hardcoded-post-script
  - id: micro-behaviors/communications/http/request/json::node-host-user-hardcoded-post-script
  needs: 1

  # URL-parsed workers.dev destinations may assign u.hostname rather than a
  # quoted hostname directly in the request options. Keep that equivalent
  # destination form in a full install-hook composite instead of surfacing a
  # generic remote-host atom as an install beacon by itself.

- id: npm-install-hook-host-profile-post-workers-host
  desc: Install hook host-profile beacon to workers.dev
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/request/json::node-host-profile-workers-post-script

  # CI/sandbox skip + Desktop/Documents/Downloads "real machine" gate before
  # posting a host profile — fake-telemetry install trojans (hex-encode-utils).
  # Do not unless: metadata/package/testing/ — .d.ts members fire that directory
  # and would suppress this on every typed npm package.
- id: npm-install-sandbox-gated-host-exfil
  desc: Sandbox-gated install hook host-profile exfil
  attack: T1497.001,T1195.002,T1041,T1082
  mbc: B0007,E1041
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/os/env/cicd/runner::isci-property-access
  - id: micro-behaviors/fs/path/user-directory::common-user-folders
  - id: micro-behaviors/os/sysinfo/platform/host::host-platform-arch-text-sequence
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/client::https-request

  # Free CF Workers sink + TLS verification disabled on an install-time host
  # profile POST — not legitimate product telemetry.
- id: npm-workers-dev-tls-bypass-host-beacon
  desc: Install host beacon to workers.dev with TLS off
  attack: T1195.002,T1041,T1082,T1553.004,T1583.006
  mbc: E1041,B0030
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/url/host/domain-http::workers-dev-url
  - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
  - id: micro-behaviors/os/sysinfo/platform/host::host-platform-arch-text-sequence
  - id: micro-behaviors/communications/http/request/verb::post-method-text
