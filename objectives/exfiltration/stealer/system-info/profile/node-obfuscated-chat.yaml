# Host acquisition is bound to the sender parameter, not merely a host token
# near a chat API. Hidden host reporting with an embedded bot credential and
# a second bot channel supplies the abuse context absent in ordinary telemetry.
defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: obfuscated-host-report-dual-chat-export
    desc: Obfuscated host-report bot-channel export
    crit: hostile
    conf: 0.98
    attack: T1082,T1041
    all:
      - id: micro-behaviors/communications/messaging/send::node-os-report-chat-envelope
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/credential-access/env/token::slack-xoxb-token
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
