defaults:
  platforms: [openbsd, bsd, unix]
  for: [csharp]
  attack: T1041

composite_rules:
  - id: dotnet-host-recon-http-exfil
    desc: .NET host recon HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::dotnet-collect-post
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::dotnet-runtime-info
      - id: micro-behaviors/process/enumerate/managed::dotnet-get-processes-call
      - id: micro-behaviors/os/sysinfo/network::dotnet-network-interface-enumeration
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-read
