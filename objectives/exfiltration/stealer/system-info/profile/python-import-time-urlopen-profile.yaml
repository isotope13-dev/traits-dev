---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1041,T1082,T1033,T1195.002
  mbc: E1041
composite_rules:
- id: import-time-urlopen-posts-host-profile
  desc: Import posts a serialized host profile
  crit: hostile
  conf: 0.98
  scope: file
  near_lines: 90
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::platform-node
  - id: micro-behaviors/os/sysinfo/platform/host::platform-full
  - id: micro-behaviors/os/sysinfo/platform/host::platform-uname
  - id: micro-behaviors/os/sysinfo/platform/host::os-uname-call
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/network/interface/query::python-getsockname-local-ip
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: micro-behaviors/process/identity/query/principal::python-imported-getpass-user
  - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
  - id: micro-behaviors/data/serialize/schema-system::python-platform-object-fields
  - id: metadata/lang/source/syntax/identity-field::python-platform-host-user-field-pair
