# Build-time telemetry that reads the hardware UUID, POSTs it to a fixed host
# and terminates the build on the reply. The required evidence is the identity
# read, the POST and the reply-driven exit; a split endpoint scheme or the
# Windows user-domain variable corroborates it. A status check without the
# identity read or without the exit does not match.
#
# Worked example: vite-plugin-bar-plus@1.0.47 (`dist/index.js` `config` hook:
# `si.system()` uuid, `process.env` user/domain, POST to a split-literal
# `http://api.wi-ui.com/check.php`, `process.exit()` when the reply has ret 0).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1082,T1041,T1195.002

composite_rules:
  - id: node-build-hook-identity-post-killswitch
    desc: Build plugin posts machine UUID then exits
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/hardware::si-system-call
      - id: micro-behaviors/communications/http/request/verb::mutating-method-option
      - id: micro-behaviors/process/exit/terminate::node-process-exit-call
    any:
      - id: micro-behaviors/communications/url/construction/fragment::js-fragmented-url-protocol-ht-tp
      - id: micro-behaviors/communications/url/construction/fragment::concat-two-part-http-scheme
      - id: micro-behaviors/process/identity/query/principal::node-env-user-domain
