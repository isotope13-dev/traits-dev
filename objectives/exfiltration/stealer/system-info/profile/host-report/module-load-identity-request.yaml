defaults:
  platforms:
  - unix
  - windows
  attack: T1082,T1033,T1041
composite_rules:
- id: node-module-load-host-user-request
  desc: Module sends host and user identity in a request
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  near_bytes: 1500
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: micro-behaviors/communications/http/request/client::module-level-fixed-host-request
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
- id: python-setup-ip-lookup-base64-request
  desc: Setup sends Base64 IP lookup in a request URL
  crit: suspicious
  conf: 0.85
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/ip-discovery::ipinfo-io
  - id: micro-behaviors/communications/http/request/url-computed::python-fstring-url-get
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
