defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1059.007,T1195.002
  mbc: E1041
traits:
- id: node-xpack-install-gate-uploads-github-device-profile
  desc: Uploads GitHub and device install profile
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /getGitHubIdentity\s*\(/is
          $b0_1 = /ssh\s+-T\s+git@github\.com/is
          $b0_2 = /apiKey/is
          $b0_3 = /deviceId/is
          $b0_4 = /githubUsername/is
          $b0_5 = /\/api\/install\/start/is
          $b0_6 = /method\s*:\s*["']POST/is
          $b0_7 = /JSON\.stringify\s*\(\s*payload/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 4500 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 7000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 800 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 800 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 3500 and
                        for any i6 in (1..#b0_6) : (
                          @b0_6[i6] >= (@b0_5[i5] + !b0_5[i5]) and
                          @b0_6[i6] <= (@b0_5[i5] + !b0_5[i5]) + 700 and
                          for any i7 in (1..#b0_7) : (
                            @b0_7[i7] >= (@b0_6[i6] + !b0_6[i6]) and
                            @b0_7[i7] <= (@b0_6[i6] + !b0_6[i6]) + 900 and
                            true
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-preinstall-xpack-payment-identity-collection
  desc: npm preinstall sends GitHub and device profile for payment gate
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/stealer/system-info/profile/host-report::node-xpack-install-gate-uploads-github-device-profile
