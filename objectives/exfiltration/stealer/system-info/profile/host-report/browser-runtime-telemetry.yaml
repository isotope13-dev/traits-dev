defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # This worker belongs to a different game site and is used here as a
  # specimen-specific sink indicator. The composite below requires the
  # accompanying browser-context upload before classifying it as hostile.
  - id: drift-hunters-game-worker-endpoint
    desc: References Drift Hunters game Worker endpoint
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://webgl.drifthuntersgame.workers.dev/

composite_rules:
  # General behavior coverage remains useful when copies change the collector
  # host. It stays suspicious because first-party analytics can use the same
  # fields; the sink-specific rule below supplies the attribution here.
  - id: browser-page-device-profile-json-post
    desc: Posts browser page and device profile remotely
    crit: suspicious
    conf: 0.94
    attack: T1041,T1082,T1033
    near_bytes: 2400
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-direct-json-post-body
      - id: micro-behaviors/communications/http/request/privacy::fetch-no-cors-mode
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
      - id: micro-behaviors/communications/url/navigation-http::browser-page-url-referrer-read
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-screen-dimensions-read

  - id: browser-profile-drifthunters-worker-exfil
    desc: Posts browser profile to Drift Hunters Worker
    crit: hostile
    conf: 0.99
    attack: T1041,T1082,T1033
    mbc: E1041
    for: [javascript]
    near_bytes: 2400
    all:
      - id: drift-hunters-game-worker-endpoint
      - id: browser-page-device-profile-json-post
