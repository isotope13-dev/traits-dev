defaults:
  for: [powershell]
  platforms: [windows]

composite_rules:
  # Inventory plus Telegram posting can also occur in administrative telemetry.
  # This co-occurrence alone does not prove which values the body carries.
  - id: powershell-host-inventory-telegram-post
    desc: PowerShell host inventory with hardcoded Telegram bot and POST body
    crit: suspicious
    conf: 0.96
    near_lines: 60
    all:
      - id: micro-behaviors/os/env/system-info::computer-user-environment-references
      - id: micro-behaviors/os/sysinfo/hostname/query::cim-computer-system-query
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/http/auth::powershell-telegram-bot-token-literal
      - id: micro-behaviors/communications/http/request/payload::powershell-http-post-body
