defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1195.002,T1082,T1041

traits:
  - id: python-queue-item-string-sendall
    desc: Sends queued item through socket
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (identifier) @info right: (call
            function: (attribute object: (identifier) @queue attribute: (identifier) @get))))
          (try_statement body: (block
            (expression_statement (call function: (attribute object: (identifier) @sock attribute: (identifier) @sendall)
              arguments: (argument_list (call function: (attribute object: (call function: (identifier) @str
                arguments: (argument_list (identifier) @info2)) attribute: (identifier) @encode)))))))))
          (#eq? @get "get") (#eq? @sendall "sendall") (#eq? @str "str") (#eq? @encode "encode") (#eq? @info @info2))

composite_rules:
  - id: python-install-queued-host-profile-tcp
    desc: Install hook profiles host and sends queued data over TCP
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: python-queue-item-string-sendall
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/communications/socket/connect/attempt::python-created-socket-connect
      - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
      - id: micro-behaviors/os/user/lookup::python-getpass-getuser
      - id: micro-behaviors/process/thread/create::thread-chained-start-call
