defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
traits:
- id: pypi-version-reads-platform-node
  desc: Reads platform node name
  crit: notable
  conf: 0.98
  for:
  - python
  - source
  - scripts
  if:
    type: text
    substr: platform.node()
- id: pypi-version-reads-platform-uname
  desc: Reads platform uname details
  crit: notable
  conf: 0.98
  for:
  - python
  - source
  - scripts
  if:
    type: text
    substr: platform.uname()
- id: pypi-version-reads-working-directory
  desc: Reads current working directory
  crit: notable
  conf: 0.98
  for:
  - python
  - source
  - scripts
  if:
    type: text
    substr: os.getcwd()
- id: pypi-version-requests-raw-ip-path
  desc: Requests a version path from raw IP
  crit: suspicious
  conf: 0.99
  for:
  - python
  - source
  - scripts
  if:
    type: text
    regex: requests\.get.{0,100}http://[0-9.]+/v/%s
composite_rules:
- id: pypi-version-script-system-profile-raw-ip-exfil
  desc: Version script encodes host profile for raw IP
  crit: hostile
  conf: 0.99
  scope: file
  near_bytes: 2300
  all:
  - id: objectives/exfiltration/stealer/system-info/profile/host-report::pypi-version-requests-raw-ip-path
  - id: micro-behaviors/data/encode/base64/primitive::python-b64encode-text
  - id: micro-behaviors/communications/dns/client::google-public-dns-address
  needs: 3
  any:
  - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
  - id: objectives/exfiltration/stealer/system-info/profile/host-report::pypi-version-reads-platform-node
  - id: objectives/exfiltration/stealer/system-info/profile/host-report::pypi-version-reads-platform-uname
  - id: objectives/exfiltration/stealer/system-info/profile/host-report::pypi-version-reads-working-directory
- id: pypi-setup-runs-host-profile-version-script
  desc: setup.py executes an adjacent script that exfiltrates a host profile
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1082,T1033,T1041
  scope: archive
  for:
  - python_sdist
  - python
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: objectives/exfiltration/stealer/system-info/profile/system-inventory::pypi-setup-launches-version-script
  - id: objectives/exfiltration/stealer/system-info/profile/host-report::pypi-version-script-system-profile-raw-ip-exfil
- id: pypi-setup-system-profile-base64-raw-ip-exfil
  desc: PyPI setup sends an encoded host profile to a raw IP collector
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1082,T1033,T1041
  scope: file
  all:
  - id: metadata/build/pip::root-setup-py
  - id: objectives/exfiltration/stealer/system-info/profile/network-inventory::pypi-setup-base64-system-profile-to-raw-ip
