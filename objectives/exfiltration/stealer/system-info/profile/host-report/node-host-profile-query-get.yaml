# A Node process collects host identity and hardware facts, encodes them into
# URL query parameters, and sends the resulting URL with fetch.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1082,T1033

traits:
  - id: encoded-host-profile-query-value
    desc: Encodes host profile value in query
    crit: component
    if:
      type: text
      regex: '&(dev|device|host)=\$\{encodeURIComponent\([^)]{1,60}\)\}'
      exclude_comments: true

  - id: encoded-system-profile-query-value
    desc: Encodes system details in a query
    crit: component
    if:
      type: text
      regex: '&(spec|hardware|system)=\$\{encodeURIComponent\([^)]{1,60}\)\}'
      exclude_comments: true

composite_rules:
  - id: node-host-profile-query-fetch-exfil
    desc: Node sends host and system profile in a fetch URL
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-comprehensive-host-query-set
      - id: encoded-host-profile-query-value
      - id: encoded-system-profile-query-value
      - id: micro-behaviors/communications/http/request/client/target::fetch-url-variable-or-literal
