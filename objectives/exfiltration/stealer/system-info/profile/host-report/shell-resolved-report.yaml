defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: hostile
  attack: T1041,T1082
# TLS verification is not a discriminator: a verified connection to a
# collector exfiltrates the same data.
composite_rules:
- id: concealed-shell-resolved-local-profile-post
  desc: Encoded URL beside shell-host profile upload
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/request/configuration::node-request-host-from-shell-output
  - id: micro-behaviors/communications/http/request/body/construction::node-request-writes-local-path-json
  - id: micro-behaviors/communications/http/post::request-options-post-method
  - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
  - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
# Concealed strings and a local-path profile POSTed to a fixed host.
- id: concealed-local-profile-post-fixed-host
  desc: Concealed local profile POST to fixed host
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/communications/http/request/body/construction::node-request-writes-local-path-json
  - id: micro-behaviors/communications/http/post::request-options-post-method
  - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
  - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
  - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
