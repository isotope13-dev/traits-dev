defaults:
  platforms: [windows]

composite_rules:
  - id: wsh-xhr-host-profile-post
    desc: WSH XHR POST carries host-profile fields
    crit: suspicious
    conf: 0.95
    attack: T1071.001
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/data/format/host-profile::machine-user-field-pair
      - id: micro-behaviors/os/env/read::wsh-expand-environment-strings-call
