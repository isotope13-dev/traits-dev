---
defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
traits:
- id: pypi-setup-base64-system-profile-to-raw-ip
  desc: Encoded host profile sent to raw IP
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1082,T1033,T1041
  if:
    type: yara
    source: |
      rule pypi_setup_base64_system_profile_to_raw_ip {
        strings:
          $s0 = /8\.8\.8\.8/s
          $s1 = /socket\.socket\(socket\.AF_INET,\s*socket\.SOCK_DGRAM\)/s
          $s2 = /os\.getlogin\(\)/s
          $s3 = /platform\.node\(\)/s
          $s4 = /platform\.uname\(\)/s
          $s5 = /os\.getcwd\(\)/s
          $s6 = /base64\.b64encode/s
          $s7 = /requests\.get\s*\([^)]{0,80}http:\/\/[0-9.]+\/v\/%s/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 300 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 500 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 300 and (for any i4 in (1..#s4) : (@s4[i4] >= @s3[i3] + !s3[i3] and @s4[i4] <= @s3[i3] + !s3[i3] + 300 and (for any i5 in (1..#s5) : (@s5[i5] >= @s4[i4] + !s4[i4] and @s5[i5] <= @s4[i4] + !s4[i4] + 300 and (for any i6 in (1..#s6) : (@s6[i6] >= @s5[i5] + !s5[i5] and @s6[i6] <= @s5[i5] + !s5[i5] + 300 and (for any i7 in (1..#s7) : (@s7[i7] >= @s6[i6] + !s6[i6] and @s7[i7] <= @s6[i6] + !s6[i6] + 300 and (true))))))))))))))))
      }
- id: pypi-setup-launches-version-script
  desc: setup.py launches adjacent version script
  crit: suspicious
  conf: 0.96
  if:
    type: yara
    source: |
      rule pypi_setup_launches_version_script {
        strings:
          $s0 = /def\s+read_version\s*\(/s
          $s1 = /subprocess\.Popen\s*\(\[\s*sys\.executable\s*,\s*ver/s
          $s2 = /version\s*=\s*read_version\s*\(/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 1200 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 500 and (true))))))
      }
- id: pypi-version-public-dns-check
  desc: References Google Public DNS
  crit: notable
  conf: 0.9
  for:
  - python
  - source
  - scripts
  - text
  if:
    type: text
    substr: 8.8.8.8
- id: pypi-version-gets-login-name
  desc: Reads current login name
  crit: notable
  conf: 0.98
  for: [python, source, scripts]
  if:
    type: text
    substr: os.getlogin()
- id: pypi-version-reads-platform-node
  desc: Reads platform node name
  crit: notable
  conf: 0.98
  for: [python, source, scripts]
  if:
    type: text
    substr: platform.node()
- id: pypi-version-reads-platform-uname
  desc: Reads platform uname details
  crit: notable
  conf: 0.98
  for: [python, source, scripts]
  if:
