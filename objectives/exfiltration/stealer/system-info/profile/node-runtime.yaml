defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: dualmessenger-sysinfo-exfiltration
    desc: Posts host profile to Slack and Telegram
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-post
      - id: micro-behaviors/os/sysinfo/profile::node-host-query-json-post-clues
      - id: micro-behaviors/communications/messaging/send::telegram-bot-token-sendmessage-path
    unless:
    - id: metadata/package/testing/corpus/
