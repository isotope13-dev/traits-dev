defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: encoded-shell-output-fetch
    desc: Encoded shell reconnaissance sends captured output via fetch
    crit: hostile
    conf: 0.99
    attack: T1041,T1082,T1033
    all:
      - id: objectives/anti-static/obfuscation/encoding/base64::whoami-base64
      - id: micro-behaviors/process/create/shell/bridge::base64-child-process-name
      - id: micro-behaviors/process/create/shell/bridge::base64-execsync-name
      - id: micro-behaviors/data/control-flow/dispatch::computed-method-receiver-bind
      - id: micro-behaviors/data/encode/url::bound-output-fetch-uri
