defaults:
  platforms: [windows]
  for: [pe]
  attack: T1497.001,T1082,T1041

composite_rules:
  # Environment fingerprinting that is reported out: a binary that catalogs
  # hypervisor vendor strings and guest-agent process names, then sends to a
  # bare IP address over HTTP, is mapping analysis environments for an
  # operator. Hostname-based vendor backends and licensing checks do not
  # report their VM probes to a literal address.
  - id: vm-fingerprint-raw-ip-report
    desc: VM and sandbox fingerprint sent to a raw IP
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/anti-analysis/emulator-detect/vendor-strings::comprehensive
      - id: objectives/anti-analysis/vm-detect/process::vm-guest-agent-process-blacklist
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
      - id: micro-behaviors/communications/http/post/
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
