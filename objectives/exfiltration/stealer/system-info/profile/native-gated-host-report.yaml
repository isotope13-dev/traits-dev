defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1041,T1082

traits:
  - id: gated-native-host-report-http-post
    desc: Gated native program posts host inventory
    crit: hostile
    conf: 0.96
    if:
      type: yara
      source: |
        rule gated_native_host_report_http_post {
          strings:
            $host = /gethostname[ \t]*\(/
            $system = /uname[ \t]*\(/
            $interfaces = /getifaddrs[ \t]*\(/
            $user = /getpwuid[ \t]*\(/
            $gate = /getenv[ \t]*\([ \t]*"HOME"[ \t]*\)/
            $stat = /stat[ \t]*\(/
            $dns = /getaddrinfo[ \t]*\(/
            $send = /send[ \t]*\(/
            $post = "POST /collect HTTP/1.1"
          condition:
            all of them
        }
