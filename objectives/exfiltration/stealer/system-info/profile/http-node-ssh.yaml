defaults:
  crit: hostile
  platforms: [unix, netbsd]
  for: [javascript, typescript]
  attack: T1552.004

composite_rules:
- id: node-ssh-dir-profile-http-exfil
  desc: Node exfils SSH directory profile over HTTP
  conf: 0.99
  attack: "T1552.004, T1041"
  mbc: "E1552, E1041"
  all:
  - id: micro-behaviors/fs/directory/readdir/language::node-dot-ssh-readdir
  - id: micro-behaviors/communications/http/telemetry::node-host-profile-json-http-context
  - id: micro-behaviors/communications/ip/literal::direct-ip-http-client

