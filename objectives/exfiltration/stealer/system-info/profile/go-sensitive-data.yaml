defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [binaries, scripts, source, manifests, documents, media, data]
  attack: T1041
  mbc: B0030

composite_rules:
  - id: go-sysinfo-http-exfiltration
    desc: System information discovery and HTTP exfiltration (Go)
    crit: hostile
    conf: 0.93
    # Keep the discovery and POST in the same small code region. A Go daemon
    # commonly contains both routine host introspection and unrelated local/API
    # POSTs; file-wide correlation mislabels those management and telemetry
    # paths as exfiltration.
    near_bytes: 1024
    all:
    - id: micro-behaviors/os/sysinfo/platform/runtime::go-host-and-platform-query
    - id: micro-behaviors/communications/http/post::http-post-methods
    unless:
    # Hostname/GOOS + POST is normal for OAuth device/PKCE CLIs and for vendor
    # clients that report themselves under the user's stored API key.
    - id: micro-behaviors/communications/http/authorization-header::go-user-authorized-client-context
    - id: well-known/lib/development/golang-x-tools/
    - id: well-known/app/ai/agent-runtime/cortex-ia/
    - id: well-known/lib/observability/rollbar/
    downgrade:
      any:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

      - id: "metadata/file/naming::test-directory-component"
