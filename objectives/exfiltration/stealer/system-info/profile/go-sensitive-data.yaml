# Require a bound identity-to-request-body path, not query/POST proximity.
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  attack: T1041
composite_rules:
- id: go-sysinfo-http-exfiltration
  desc: Host/user JSON sent by encrypted command agent
  crit: hostile
  conf: 0.93
  near_bytes: 1024
  all:
  - id: micro-behaviors/os/sysinfo/platform/runtime::go-host-and-platform-query
  - id: micro-behaviors/communications/http/post::http-post-methods
  - id: micro-behaviors/communications/http/request/json::go-host-user-json-body
  any:
  - id: objectives/command-and-control/backdoor/control/slack::go-slack-decrypted-code-tasking
  - id: objectives/command-and-control/channel/deaddrop/blockchain::go-contract-storage-command-execution
  unless:
  - id: micro-behaviors/communications/http/authorization-header::go-user-authorized-client-context
  - id: well-known/lib/development/golang-x-tools/
  - id: well-known/app/ai/agent-runtime/cortex-ia/
  - id: well-known/lib/observability/rollbar/
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: metadata/file/naming::test-directory-component
