composite_rules:
  - id: postinstall-system-profile-oob-exfil
    desc: Install hook sends a system profile to an out-of-band endpoint
    crit: hostile
    conf: 0.98
    platforms: [unix, windows]
    for: [javascript]
    attack: T1195.002,T1041,T1082,T1033,T1057
    mbc: E1041
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: objectives/discovery/system/profile::js-shell-sysinfo-commands
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    any:
      - id: micro-behaviors/communications/http/upload::curl-post-temp-json-file
      - id: micro-behaviors/communications/http/curl::curl-post-custom-header
      - id: micro-behaviors/communications/http/curl::curl-variable-query-data
    unless:
      - id: metadata/package/testing/harness/runtime/
