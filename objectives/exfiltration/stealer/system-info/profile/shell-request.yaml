defaults:
  platforms: [linux, unix, macos, android, ios]
  for: [shell]
  crit: suspicious
composite_rules:
  - id: shell-fingerprint-exfil
    desc: Host identity commands near HTTP request data
    conf: 0.90
    attack: "T1082"
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/sysinfo/process::shell-host-identity-commands
    any:
      - id: micro-behaviors/communications/http/curl::curl-short-data-option
      - id: micro-behaviors/communications/http/curl::curl-data-option
      - id: micro-behaviors/communications/http/curl::curl-post-flag
    unless:
      - id: well-known/app/data/siglens::siglens-install-telemetry
      - id: metadata/package/documentation/
      - id: metadata/package/testing/
      - id: micro-behaviors/communications/http/url/path::loopback-http-url-reference
      - id: "metadata/file/naming::test-directory-component"
