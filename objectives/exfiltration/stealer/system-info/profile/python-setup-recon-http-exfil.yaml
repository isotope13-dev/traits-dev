# A Python package setup script that collects system reconnaissance and transmits
# the host profile via HTTP client during package build or installation.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041,T1082

composite_rules:
  - id: python-setup-recon-http-post-exfil
    desc: setup.py gathers host profiling information and posts it via HTTP client
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
      - id: micro-behaviors/communications/http/post::source-post-method-literal
    any:
      - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
      - id: micro-behaviors/os/sysinfo/gpu::nvidia-smi-query-gpu
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline
      - id: micro-behaviors/fs/proc/info/pid::init-process-metadata-procfs-access
      - id: micro-behaviors/communications/http/ip-discovery::ip-sb-geoip
    needs: 2
