defaults:
  platforms: [windows]
  for: [pe, javascript]
  attack: T1106
composite_rules:
  - id: bun-desktop-profile-http-post
    for: [pe]
    desc: Bun desktop profile and HTTP POST
    crit: hostile
    conf: 0.98
    attack: T1082,T1041,T1105
    all:
      - id: micro-behaviors/fs/path/application/interpreter::bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/ffi::bun-ffi-module
      - id: micro-behaviors/os/sysinfo/report::desktop-recon-report-field-cluster
      - id: metadata/lang/source/syntax/object::success-timestamp-object-fields
      - id: micro-behaviors/communications/http/post::client-wrapper-post-call

