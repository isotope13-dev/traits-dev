# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


composite_rules:
- id: npm-postinstall-ecs-metadata-oob-exfil
  desc: npm postinstall exfils ECS container metadata to OOB
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1552.005,T1041,T1567.002
  for: [package.json]
  all:
  - id: micro-behaviors/os/env/cloud::postinstall-ecs-metadata-uri-reference
  - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture/

