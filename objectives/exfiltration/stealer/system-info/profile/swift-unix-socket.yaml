defaults:
  platforms: [unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-socket-profile-exfil
    desc: Host profile fields with an EXFIL label
    crit: notable
    conf: 0.92
    all:
      - id: metadata/lang/source/literal/string/label::exfil-prefix-label
      - id: objectives/discovery/system/profile::swift-unix-profile-fields
  - id: swift-urlsession-profile-checkin
    desc: HTTP body with status and profile naming clues
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/request/route::status-checkin-route
      - id: metadata/lang/source/syntax/declaration::swift-system-info-string-function
      - id: micro-behaviors/communications/http/request/body/construction::swift-urlrequest-http-body
