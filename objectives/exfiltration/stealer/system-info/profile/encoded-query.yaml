defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: base64-env-profile-fetch-query
    desc: Host-user profile encoding accompanies fetch query construction
    crit: suspicious
    conf: 0.91
    attack: T1041,T1082,T1033
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-env-profile
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/communications/url/http-query::js-urlsearchparams-construction
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: well-known/lib/development/vscode::machine-id
