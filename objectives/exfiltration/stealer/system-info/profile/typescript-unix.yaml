defaults:
  platforms: [unix, appliance]
  for: [typescript, javascript]
  attack: T1041

composite_rules:
- id: ts-http-host-profile-exfil
  desc: TS HTTP host profile exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
  - id: objectives/discovery/system/profile::ts-process-env-collection
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body::request-write-call
- id: js-http-get-host-profile-exfil
  desc: JS HTTP GET host profile exfil
  crit: hostile
  conf: 0.98
  mbc: E1041
  near_bytes: 2500
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
  - id: micro-behaviors/os/sysinfo/platform/runtime::os-arch-call
  - id: micro-behaviors/communications/http/request/client::http-get-dup
  - id: micro-behaviors/communications/http/url/build::http-url-template-literal
  any:
  - id: metadata/import/builtin::require-http
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
