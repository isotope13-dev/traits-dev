# Host and user profile data remains the defining source when the transfer uses
# Telegram. The package-level composite adds npm preinstall context without
# creating a second supply-chain home for the same exfiltration result.
defaults:
  platforms: [windows, unix]
  mbc: E1041

composite_rules:
  - id: telegram-system-profile-exfil
    desc: Telegram sends collected host and user profile
    crit: hostile
    conf: 0.94
    for: [javascript, typescript]
    attack: T1041,T1082
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: npm-preinstall-telegram-host-profile-exfil
    desc: npm preinstall sends host profile to Telegram
    crit: hostile
    conf: 0.99
    for: [npm, javascript, package.json]
    attack: T1195.002,T1041,T1082
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::preinstall-runs-node-local-script
      - id: telegram-system-profile-exfil
