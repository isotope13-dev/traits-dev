defaults:
  platforms: [netscaler, appliance, unix]
  for: [c, elf]
  attack: T1041

traits: []

composite_rules:
  - id: native-netscaler-system-http-exfil
    desc: Native NetScaler system HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/beacon/network/periodic::python-post-beacon-request
      - id: micro-behaviors/communications/http/header/content-type::octet-stream-content-type
    any:
      - id: micro-behaviors/os/env/read::native-environ-reference
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-cmdline-template
