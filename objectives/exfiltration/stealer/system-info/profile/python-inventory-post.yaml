# A host census that includes locally enumerated software and is sent as the
# JSON request body. This catches the behavior without relying on package,
# product, or collector names; generic host-profile POSTs remain unclassified.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1082
  mbc: E1041

composite_rules:
  - id: python-command-inventory-host-profile-json-post
    desc: Python posts a shell-collected inventory with host identity
    crit: suspicious
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/profile::python-device-host-query-set
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
      - id: micro-behaviors/communications/http/request/json::urllib-request-json-dumps-body
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/communications/http/post::source-post-method-literal
