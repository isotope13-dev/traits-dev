defaults:
  platforms: [unix]
  for: [shell]
  attack: T1041

composite_rules:
  - id: shell-macos-host-http-exfil
    desc: Shell macOS host HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::shell-curl-stdin-collect
      - id: micro-behaviors/os/network/status::shell-macos-root-listeners
      - id: micro-behaviors/os/env/enumeration::shell-env-temp-dump
      - id: micro-behaviors/os/sysinfo/cpu::sysctl-cpu-brand-string
      - id: micro-behaviors/os/sysinfo/config::sw-vers-command
