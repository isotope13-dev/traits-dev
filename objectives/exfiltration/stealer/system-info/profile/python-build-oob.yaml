defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.96
  attack: T1041,T1082
  mbc: E1041
composite_rules:
  - id: python-build-background-host-profile-oob-post
    desc: Build startup host-profile OOB POST pattern
    scope: file
    all:
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/process/create/thread::python-module-try-starts-daemon-thread
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/data/serialize/json::json-dumps-call
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  - id: python-build-background-encoded-profile-oob-path
    desc: Build startup encoded-profile OOB path pattern
    scope: file
    all:
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/process/create/thread::python-module-try-starts-daemon-thread
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
      - id: micro-behaviors/data/serialize/json::json-dumps-call
      - id: micro-behaviors/data/encode/base64::urlsafe-b64encode-call
      - id: micro-behaviors/communications/url/construction/template::python-https-host-and-path-format
      - id: micro-behaviors/communications/url/host::oob-dns-capable-endpoint
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
