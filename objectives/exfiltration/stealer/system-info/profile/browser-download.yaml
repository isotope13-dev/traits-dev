defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.93
  attack: T1082,T1041

composite_rules:
  - id: telegram-browser-profile-automatic-download
    desc: Telegram send co-occurs with browser profiling and hidden automatic download
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-screen-dimensions-read
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
      - id: micro-behaviors/ui/window/visibility::display-none-style
