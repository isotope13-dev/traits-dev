defaults:
  platforms: [unix, appliance]
  for: [rust, elf]
  attack: T1041


composite_rules:
- id: native-host-profile-exfil
  desc: Linux profile paths and an EXFIL label
  crit: notable
  conf: 0.92
  for: [elf]
  all:
  - id: micro-behaviors/fs/path/os/identity::linux-proc-system-profile-paths
  - id: metadata/lang/source/literal/string/label::exfil-prefix-label
- id: rust-socket-profile-exfil
  desc: Rust socket profile exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/proc/system::linux-system-profile-path-set
  - id: micro-behaviors/data/stream/write::rust-write-all
  any:
  - id: micro-behaviors/network/interface/command::rust-interface-command
  - id: objectives/command-and-control/backdoor/tasking/socket::rust-binary-beacon-magic
