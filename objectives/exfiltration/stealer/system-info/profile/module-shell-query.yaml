defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: module-shell-recon-callback
    desc: Module IIFE silently reports shell reconnaissance to a fixed callback
    crit: hostile
    conf: 0.98
    attack: T1041,T1082,T1059.007
    all:
      - id: micro-behaviors/communications/http/query::module-iife-shell-output-fetch-query
      - id: micro-behaviors/communications/http/url/php-endpoint::php-callback-path-url
      - id: micro-behaviors/data/control-flow/error-handling::fetch-function-empty-catch-handler
