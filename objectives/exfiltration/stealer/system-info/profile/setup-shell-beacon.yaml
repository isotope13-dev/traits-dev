defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  # A build-time reverse shell gives this reporting chain its hostile context.
  # Body uploads or hostname queries on their own remain neutral capabilities.
  - id: setup-reverse-shell-host-report
    desc: Setup reverse shell uploads a host report
    crit: hostile
    conf: 0.97
    attack: T1041,T1082
    all:
      - id: metadata/build/pip::root-setup-py
      - id: objectives/command-and-control/reverse-shell/stream-bridge::python-select-interactive-shell-relay
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
