defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: hostile
  attack: T1552.001,T1041

composite_rules:
  - id: python-host-profile-urllib-exfil
    desc: Python POSTs host and user profile via urllib
    conf: 0.98
    near_lines: 60
    # A profile object (two of platform/host/user fields) plus a query for the
    # logged-in user. Device enrollment that POSTs hostname and platform to the
    # product's own API (ClawMetry's register call) never asks who the user is.
    all:
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
      - id: micro-behaviors/data/serialize/schema-object::python-host-profile-object-fields
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
    any:
      - id: micro-behaviors/process/user/query::python-getpass-user
      - id: micro-behaviors/process/user/query::python-imported-getpass-user
      - id: micro-behaviors/process/user/query::os-getlogin-python
