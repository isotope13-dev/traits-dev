defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
  attack: T1041,T1082
  mbc: E1041

composite_rules:
  # A compact platform and user identity record is encoded and staged in an
  # HTTP POST body for a literal external callback. The body assignment is
  # explicit evidence that the collected profile is prepared for transfer;
  # this rule does not claim the request was sent or executed.
  - id: ruby-encoded-user-profile-post-staging
    desc: Stages encoded user/platform in IP POST body
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/encoded::ruby-base64-user-platform-post-body-flow
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  # Encoded user/platform identity is staged in a POST body addressed to a
  # literal external-IP URL. The tree-sitter flow binds the collection
  # (RUBY_PLATFORM plus ENV USER/USERNAME), the Base64 encoding, and the
  # body assignment to one request object; the raw-IP URL and the
  # Net::HTTP POST construction supply the exfiltration channel. Together
  # they establish system-profile exfiltration, not merely staging: the
  # body assignment prepares the transfer and the request object names
  # the operator infrastructure. This rule does not claim the request ran.
  - id: ruby-system-info-http-exfil
    desc: Ruby system info HTTP exfil
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/encoded::ruby-base64-user-platform-post-body-flow
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/post::net-http-post

  # A host identity profile sent in a GET query to an external numeric IP is
  # an exfiltration channel even when the fields or URL path change. This
  # detects the channel and collected profile; it does not claim import-time
  # execution or a successful request.
  - id: ruby-host-profile-external-ip-get
    desc: Ruby identity profile GET to external IP
    crit: hostile
    conf: 0.98
    attack: T1041,T1082,T1033
    near_bytes: 1600
    all:
      - id: micro-behaviors/os/sysinfo/profile::ruby-system-identity-queries
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
      - id: micro-behaviors/communications/http/lib/netlib::ruby-net-http-get-request-object
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
