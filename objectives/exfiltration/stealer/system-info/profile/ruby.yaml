defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows

composite_rules:
  # A compact platform and user identity record is encoded and staged in an
  # HTTP POST body for a literal external callback. The body assignment is
  # explicit evidence that the collected profile is prepared for transfer;
  # this rule does not claim the request was sent or executed.
  - id: ruby-encoded-user-profile-post-staging
    desc: Ruby identity and Base64 accompany an external HTTP POST body
    crit: hostile
    conf: 0.96
    attack: T1041,T1082
    mbc: E1041
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/user-info::ruby-user-identity-env-reference
      - id: micro-behaviors/os/sysinfo/platform/runtime::ruby-platform-const
      - id: micro-behaviors/data/encode/base64::ruby-base64-urlsafe-encode
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/http/post::ruby-request-body-assignment
      - id: micro-behaviors/communications/http/url/host::ruby-numeric-host-url-reference

  - id: ruby-system-info-http-exfil
    desc: Ruby system info HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::ruby-system-info-payload
      - id: objectives/exfiltration/http/collect::ruby-exfil-upload-post
      - id: micro-behaviors/communications/http/post::net-http-post
