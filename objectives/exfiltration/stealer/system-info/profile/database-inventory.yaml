# Attack Surface Analyzer collection helpers that export collected host
# inventory to a remote database. A remote destination is explicit, but the
# archive alone does not establish whether its operator is authorized.
defaults:
  platforms: [linux, windows]
  for: [shell, powershell]
  attack: T1041

traits:
  - id: asa-collect-command
    desc: Attack Surface Analyzer collection command
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)AttackSurfaceAnalyzerCli.{0,100}\bcollect\b'

  - id: mongoimport-remote-host
    desc: MongoDB import targets a remote host
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bmongoimport\b[^\r\n]{0,160}\s-h\s+\S+'

  - id: mongoimport-json-array
    desc: MongoDB import uploads JSON array data
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: '--jsonArray'

  - id: sql-bcp-remote-import
    desc: SQL bulk copy sends data remotely
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bbcp\.exe[^\r\n]{0,180}\bin\b[^\r\n]{0,180}\s-S\s+\S+'

composite_rules:
  - id: asa-inventory-mongo-exfil
    desc: ASA collection uploaded to remote MongoDB
    crit: suspicious
    conf: 0.97
    all:
      - id: asa-collect-command
      - id: mongoimport-remote-host
      - id: mongoimport-json-array

  - id: asa-inventory-sql-exfil
    desc: ASA inventory uploaded to remote SQL server
    crit: suspicious
    conf: 0.97
    all:
      - id: asa-collect-command
      - id: sql-bcp-remote-import
