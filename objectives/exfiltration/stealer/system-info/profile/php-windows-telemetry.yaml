defaults:
  platforms: [windows]
  for: [php]
  attack: T1041

composite_rules:
  - id: php-windows-sysinfo-telemetry-exfil
    desc: PHP Windows sysinfo sent to a telemetry endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/temp::php-sysinfo-temp-path
      - id: micro-behaviors/communications/http/request/wordpress::wp-telemetry-endpoint-post
