defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: node-host-profile-http-post-clues
  desc: Node host profile and HTTP POST clues
  crit: notable
  conf: 0.85
  attack: T1082,T1033
  needs: 2
  all:
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/fs/directory/cwd::process-cwd-call
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-member
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-arch-content
  - id: micro-behaviors/os/sysinfo/platform/runtime/version::process-version-access
- id: node-runtime-inventory-uuid-post-exfil
  desc: Node runtime inventory sent with unique ID
  crit: hostile
  conf: 0.98
  attack: T1041,T1082
  mbc: E1041
  needs: 3
  all:
  - id: micro-behaviors/os/random/crypto::webcrypto-random-uuid
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-member
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-arch-content
  - id: micro-behaviors/os/sysinfo/platform/runtime/version::process-version-access
- id: node-systeminformation-pipedream-profile-exfil
  desc: Node uploads systeminformation profile to Pipedream
  crit: hostile
  conf: 0.99
  attack: T1041,T1082
  mbc: E1041
  for:
  - javascript
  all:
  - id: metadata/import/package::systeminformation-import
  - id: micro-behaviors/os/sysinfo/profile::node-systeminformation-profile-query-set
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/url/host/oob/endpoint::pipedream
- id: node-host-ci-profile-get
  desc: Node sends host and CI profile via HTTP GET
  crit: suspicious
  conf: 0.97
  attack: T1041,T1082,T1033
  near_bytes: 1200
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/fs/directory/cwd::process-cwd-call
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/http/services/cloud::aws-api-gateway
  any:
  - id: micro-behaviors/os/env/cicd/runner::process-env-ci
  - id: micro-behaviors/os/env/cicd/runner::process-env-runner-name
  - id: micro-behaviors/os/env/cicd/pipeline::process-env-github-repository
  needs: 2
- id: node-windows-cli-http-exfil
  desc: Node Windows CLI HTTP exfil
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: objectives/discovery/system/fingerprint/runtime::node-windows-cli-inventory
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  unless:
  - id: metadata/path/directory::test-directory-component
