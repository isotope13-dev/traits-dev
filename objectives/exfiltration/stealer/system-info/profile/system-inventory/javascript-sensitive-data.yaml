defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
composite_rules:
- id: js-system-info-exfiltration
  desc: Explicit host profile accompanies an HTTP JSON POST
  crit: hostile
  conf: 0.93
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  - id: micro-behaviors/communications/http/request/json::http-post-json
  any:
  - id: objectives/discovery/system/profile::host-process-software-locale-form
  downgrade:
    any:
    - id: micro-behaviors/communications/http/oauth/
    - id: micro-behaviors/communications/http/authorization-header::bearer-auth-header-template
    - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: js-form-encoded-host-profile-post-to-ip
  desc: Host profile and form POST with external IP references
  crit: suspicious
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: micro-behaviors/process/identity/query/principal::node-os-alias-homedir-call
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
  - id: micro-behaviors/communications/http/post::request-options-post-method
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-host-port-fields
  downgrade:
    any:
    - id: micro-behaviors/communications/http/oauth/
    - id: micro-behaviors/communications/http/authorization-header::bearer-auth-header-template
    - id: metadata/package/testing/presence/fixture::test-filename-pattern
