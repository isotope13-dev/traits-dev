defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
traits:
- id: pypi-setup-launches-version-script
  desc: setup.py launches adjacent version script
  crit: suspicious
  conf: 0.96
  if:
    type: yara
    source: |
      rule pypi_setup_launches_version_script {
        strings:
          $s0 = /def\s+read_version\s*\(/s
          $s1 = /subprocess\.Popen\s*\(\[\s*sys\.executable\s*,\s*ver/s
          $s2 = /version\s*=\s*read_version\s*\(/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 1200 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 500 and (true))))))
      }
- id: pypi-ttensorflow-setup-executes-version-script
  desc: ttensorflow-gpu runs adjacent version script
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule pypi_ttensorflow_setup_executes_version_script {
        strings:
          $s0 = /def\s+read_version/s
          $s1 = /subprocess\.Popen\s*\(\[\s*sys\.executable\s*,\s*ver/s
          $s2 = /name\s*=\s*/s
          $s3 = /ttensorflow-gpu/s
          $s4 = /version\s*=\s*read_version/s
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 1000 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 700 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 12 and (for any i4 in (1..#s4) : (@s4[i4] >= @s3[i3] + !s3[i3] and @s4[i4] <= @s3[i3] + !s3[i3] + 100 and (true))))))))))
      }
