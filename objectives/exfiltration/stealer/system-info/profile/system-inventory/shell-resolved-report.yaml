defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: hostile
  attack: T1041,T1082
# TLS verification is not a discriminator: a verified connection to a
# collector exfiltrates the same data.
composite_rules:
- id: shell-resolved-load-time-host-census-post
  desc: Startup host survey POST to fetched collector
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/request/configuration::node-post-host-from-curl-response
  - id: micro-behaviors/communications/http/request/body/construction::node-request-writes-local-path-json
  - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
  - id: micro-behaviors/os/sysinfo/hostname/query::execsync-quoted-hostname
  - id: micro-behaviors/communications/http/request/client/exchange::node-module-level-http-request
# Surveys the host, then contacts a collector whose name came from a curl
# response, without proving the survey is sent: a confirmation beacon.
- id: shell-resolved-host-survey-beacon
  desc: Host survey then fetched-collector contact
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/communications/http/request/configuration::node-post-host-from-curl-response
  - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
  - id: micro-behaviors/os/sysinfo/hostname/query::execsync-quoted-hostname
  - id: micro-behaviors/communications/http/request/client/exchange::node-module-level-http-request
