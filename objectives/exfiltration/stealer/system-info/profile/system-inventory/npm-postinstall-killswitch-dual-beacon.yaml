defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1071.001,T1195.002
  mbc: E1041
traits:
- id: node-install-profile-http-dns-beacons-with-killswitch
  desc: Beacons profile with DNS killswitch
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /COLLABORATOR_URL\s*=\s*["']https?:\/\/[^"']+\.collab\.invokeshell\.net["']/is
          $b0_1 = /KILLSWITCH_DOMAIN/is
          $b0_2 = /nslookup\s+\$\{KILLSWITCH_DOMAIN\}/is
          $b0_3 = /env\s*:\s*\{/is
          $bad_0_4 = /[^A-Z_]/is
          $b0_4 = /process\.env\./is
          $b0_5 = /sendDnsBeacon\s*\(/is
          $b0_6 = /sendPostBeacon\s*\(/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 2200 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 7000 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 1200 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) + 1 and
                        not $bad_0_4 in ((@b0_4[i4] + !b0_4[i4]) .. (@b0_4[i4] + !b0_4[i4]) + 0) and
                        (@b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 5001 or not $bad_0_4 in ((@b0_4[i4] + !b0_4[i4]) .. @b0_5[i5] - 5001)) and
                        for any i6 in (1..#b0_6) : (
                          @b0_6[i6] >= (@b0_5[i5] + !b0_5[i5]) and
                          @b0_6[i6] <= (@b0_5[i5] + !b0_5[i5]) + 1800 and
                          true
                        )
                      )
                    )
                  )
                )
              )
            )
          )
      }
