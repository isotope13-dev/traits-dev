# Windows PE Reconnaissance + Exfiltration Composites
# Combines system reconnaissance + data collection + exfiltration
# Covers native C/C++ recon modules (Aeternum, AgentTesla DLLs, etc.)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1041

composite_rules:
  - id: recon-telegram-exfil
    desc: System reconnaissance with Telegram exfiltration
    crit: hostile
    conf: 0.93
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/
      - id: micro-behaviors/network/interface/
      - id: micro-behaviors/os/network/tunnel::android-add-route-method
      - id: micro-behaviors/os/network/tunnel::android-vpn-add-route-source
