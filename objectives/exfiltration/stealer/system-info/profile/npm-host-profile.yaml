# Host-profile exfiltration, with package lifecycle as referenced context.

defaults:
  platforms: [unix, windows]
  mbc: E1041

composite_rules:
  - id: npm-postinstall-host-profile-exfiltration
    desc: NPM postinstall exfiltrates host and CI profile
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-node-script-error-ignored
      - id: objectives/discovery/system/profile::js-host-profile-query-set
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: npm-postinstall-host-profile-beacon
    desc: Suppressed npm postinstall sends host profile
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1082,T1041"
    for: [package.json, javascript, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-node-script-error-ignored
      - id: objectives/discovery/system/profile::js-host-profile-query-set
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script

  - id: npm-postinstall-bare-ip-host-profile-beacon
    desc: npm postinstall POSTs JSON host profile to bare IPv4
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1082,T1041"
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: objectives/discovery/system/profile::js-host-profile-query-set
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
