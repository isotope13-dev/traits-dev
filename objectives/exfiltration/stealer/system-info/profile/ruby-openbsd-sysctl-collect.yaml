defaults:
  platforms: [openbsd, bsd, unix]
  for: [ruby]
  attack: T1041

composite_rules:
  - id: ruby-openbsd-system-http-exfil
    desc: Ruby system HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/fingerprint/info::ruby-openbsd-system-probe-set
      - id: micro-behaviors/communications/http/url/endpoint::ruby-openbsd-collect-path
      - id: micro-behaviors/communications/http/post::net-http-post
