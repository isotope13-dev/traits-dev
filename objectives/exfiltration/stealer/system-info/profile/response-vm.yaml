defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: host-profile-post-response-vm-loader
    desc: Host profile accompanies HTTP response VM execution
    crit: hostile
    conf: 0.96
    attack: T1082,T1041,T1059.007
    near_bytes: 4096
    all:
      - id: objectives/command-and-control/dropper/script-eval/response-eval/module-response::node-http-response-executed-in-vm
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
      - id: micro-behaviors/communications/http/request/body::node-module-bound-request-write-end
      - id: micro-behaviors/data/serialize/json::json-stringify-call
