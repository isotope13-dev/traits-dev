defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  # Compiled implementation signature for a TLV host-profile export chain.
  # The reviewed path collects CPUID/hardware/user/software details, packs
  # the profile, transforms its bytes, stores the returned pointer/length in
  # stack locals 130h/70h, then passes those SAME locals as the HTTP body.
  # Relative call targets bind the packer and HTTP implementation to their
  # callers. This is deliberately stronger than CPU + crypto + HTTP anywhere.
  # Campaign hosts, keys, absolute addresses and prompt text are not required.
  - id: concealed-native-tlv-profile-https-export
    desc: Concealed native client exports TLV host profile
    crit: hostile
    conf: 0.98
    attack: T1041,T1082
    all:
      - id: objectives/anti-static/obfuscation/encoding/buffer::flattened-table-stream-string-decoding
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/sysinfo/cpu::x64-extended-cpuid-brand-range-check
      - id: micro-behaviors/communications/http/client/winhttp::native-tlv-profile-https-body-handoff
