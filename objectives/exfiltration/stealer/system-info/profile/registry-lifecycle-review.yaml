defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

composite_rules:
- id: meta-postinstall-curl-path-exfil
  desc: Postinstall hook exfiltrates working directory or host info via curl
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002
  mbc: E1041
  for: [manifests]
  all:
  - id: micro-behaviors/communications/http/curl/command::postinstall-curl-command-text
  any:
  - id: micro-behaviors/fs/directory/cwd::package-script-pwd-substitution
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  unless:
  - id: metadata/package/scripts/reference::reserved-docs-domain-npm-script
