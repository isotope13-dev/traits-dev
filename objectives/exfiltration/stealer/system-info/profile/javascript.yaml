defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: node-host-ci-profile-get
  desc: Node sends host and CI profile via HTTP GET
  crit: suspicious
  conf: 0.97
  attack: T1041,T1082,T1033
  near_bytes: 1200
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/fs/directory/cwd::process-cwd-call
  - id: micro-behaviors/communications/http/request/beacon::embedded-node-https-get
  - id: micro-behaviors/communications/http/services/cloud::aws-api-gateway
  any:
  - id: micro-behaviors/os/env/cicd::process-env-ci
  - id: micro-behaviors/os/env/cicd::process-env-runner-name
  - id: micro-behaviors/os/env/cicd::process-env-github-repository
  needs: 2
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: well-known/lib/cloud/
  - id: "metadata/file/naming::test-directory-component"
- id: npm-eslint-config-host-ci-get-exfil
  desc: ESLint config sends host and CI profile on import
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082,T1033
  scope: archive
  for: [npm, package.json, javascript]
  all:
  - id: objectives/exfiltration/stealer/system-info/profile::node-host-ci-profile-get
  - id: metadata/package/completeness::has-eslint-config-package
  - id: metadata/package/entrypoint::npm-root-javascript-source-member
  - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
- id: node-multifield-profile-json-post
  desc: Multi-field Node profile near JSON POST
  crit: suspicious
  conf: 0.9
  attack: T1020
  mbc: E1082
  near_bytes: 8192
  all:
  - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  unless:
  - id: metadata/build/
- id: node-runtime-identity-json-post
  desc: Node identity fingerprint near JSON POST
  crit: suspicious
  conf: 0.9
  attack: T1020
  mbc: E1041
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-property-fingerprint
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  unless:
  - id: metadata/build/
- id: node-profile-external-ip-http-exfil
  desc: Node host-profile exfiltration to public IP
  crit: hostile
  conf: 0.99
  attack: T1020,T1041
  mbc: E1041
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-query
  - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
  - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: node-system-info-fetch-exfil
  desc: Node system info JSON exfiltration
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/discovery/system/profile::node-system-profile-json
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  any:
  - id: micro-behaviors/communications/ip/parse::ip-address-camel
  - id: micro-behaviors/process/hook/webextension::client-identity-headers
- id: node-windows-cli-http-exfil
  desc: Node Windows CLI HTTP exfil
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: objectives/discovery/system/fingerprint/runtime::node-windows-cli-inventory
  - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: obfuscated-node-telemetry-exfil
  desc: Obfuscated Node telemetry exfiltration
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: micro-behaviors/data/serialize/schema-object::node-compact-telemetry-fields
  - id: micro-behaviors/data/encode/base64::node-encoded-post-form-fields
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::advanced-array-shuffling
  - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
  - id: micro-behaviors/data/control-flow/dispatch::buffer-computed-method-chain
