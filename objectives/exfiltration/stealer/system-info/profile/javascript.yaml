defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: node-host-ci-profile-get
  desc: Node sends host and CI profile via HTTP GET
  crit: suspicious
  conf: 0.97
  attack: T1041,T1082,T1033
  near_bytes: 1200
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/fs/directory/cwd::process-cwd-call
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/http/services/cloud::aws-api-gateway
  any:
  - id: micro-behaviors/os/env/cicd/runner::process-env-ci
  - id: micro-behaviors/os/env/cicd/runner::process-env-runner-name
  - id: micro-behaviors/os/env/cicd/pipeline::process-env-github-repository
  needs: 2
- id: npm-eslint-config-host-ci-get-exfil
  desc: ESLint config sends host and CI profile on import
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082,T1033
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  all:
  - id: objectives/exfiltration/stealer/system-info/profile::node-host-ci-profile-get
  - id: metadata/package/completeness::has-eslint-config-package
  - id: metadata/package/entrypoint/module::npm-root-javascript-source-member
  - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
# Host queries, a POST token and JSON serialization alone do not establish
# exfiltration. Neutral request context is already represented by
# micro-behaviors/communications/http/telemetry::node-host-profile-json-http-context.
- id: node-profile-external-ip-http-exfil
  desc: Node host-profile exfiltration to public IP
  crit: hostile
  conf: 0.99
  attack: T1020,T1041
  mbc: E1041
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-query
  - id: micro-behaviors/os/sysinfo/hardware::js-sysinfo-multi
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: node-system-info-fetch-exfil
  desc: Node system info JSON exfiltration
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/discovery/system/profile::node-system-profile-json
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  any:
  - id: micro-behaviors/communications/ip/parse::ip-address-camel
  - id: micro-behaviors/communications/http/header/modify::client-identity-headers
- id: node-windows-cli-http-exfil
  desc: Node Windows CLI HTTP exfil
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: objectives/discovery/system/fingerprint/runtime::node-windows-cli-inventory
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  unless:
  - id: metadata/path/directory::test-directory-component
- id: obfuscated-node-telemetry-exfil
  desc: Obfuscated Node telemetry exfiltration
  crit: hostile
  conf: 0.98
  attack: T1041
  all:
  - id: micro-behaviors/data/serialize/schema-object::node-compact-telemetry-fields
  - id: micro-behaviors/data/encode/base64/transport::node-encoded-post-form-fields
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  any:
  - id: micro-behaviors/data/collection/array::advanced-array-shuffling
  - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
  - id: micro-behaviors/data/control-flow/dispatch/computed::buffer-computed-method-chain
# Host inventory (hostname, user, OS, network) POSTed with Axios to a
# hardcoded remote URL alongside public-IP discovery: a stealer profile
# beacon. Each leg already tolerates obfuscated spellings.
- id: node-host-profile-axios-post-exfil
  desc: Node Axios posts host profile and public IP to remote URL
  crit: hostile
  conf: 0.98
  attack: T1041, T1082
  mbc: E1041
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-comprehensive-host-query-set
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/communications/http/ip-discovery::multi-ip-discovery
