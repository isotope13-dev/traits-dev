defaults:
  platforms: [windows]
  for: [rust]
  attack: T1041

composite_rules:
  - id: rust-windows-profile-http-exfil
    desc: Rust Windows profile HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::rust-windows-host-profile-fields
      - id: micro-behaviors/os/env/block::rust-windows-env-data-marker
      - id: objectives/command-and-control/beacon/poll::rust-agent-http-beacon
