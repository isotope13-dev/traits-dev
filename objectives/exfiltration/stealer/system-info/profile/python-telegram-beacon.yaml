# Import-time Telegram install beacon (stdid-nyxprobe pattern): a Python
# module ships collected host identity to a hardcoded Telegram bot chat as
# soon as it is imported. The wheel's .pth runs this at every interpreter
# startup; renaming the token, chats, function, or sysinfo fields preserves
# the shape. A Telegram notifier that sends only inside an explicit handler
# or command stays out: the module-level call is the side-effect leg that
# makes this an install beacon rather than a notifier.
#
# The host-profile leg must prove host data reaches an HTTP request body:
# urllib-json-body-host-identity traces gethostname/getuser through
# json.dumps into a Request. Merely querying host facts somewhere in the
# same file also matches observability dashboards that alert an operator
# over a user-configured Telegram bot (clawmetry pairs a credential-gated
# alert sender with its own host inventory), so co-occurrence alone cannot
# carry this hostile verdict.
#
# Known gaps: the data-flow leg only sees non-aliased urllib calls (an
# import urllib.request as _u form yields no observable symbol-call
# record), and there is no requests/httpx-based host-identity flow leg, so
# beacons using those transports evade this composite. Both gaps need
# engine-visible call records or new precise flow legs, not a return to
# co-occurrence.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1082,T1041
  mbc: E1041

composite_rules:
  - id: python-import-time-telegram-host-beacon
    desc: Import-time Telegram beacon sends host profile
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/request/json::urllib-json-body-host-identity
