composite_rules:
- id: node-module-recon-export
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1059.007
  desc: Module initialization reports shell reconnaissance to OOB collector
  conf: 0.98
  scope: file
  all:
  - id: micro-behaviors/communications/http/request/client::module-execution-http-call
  - id: objectives/exfiltration/stealer/system-info/profile::js-execsync-oob-recon-export
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: js-execsync-oob-recon-export
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  desc: Shell host reconnaissance exported to OOB callback
  conf: 0.995
  attack: T1041,T1059.004,T1082
  scope: file
  near_bytes: 2500
  all:
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: micro-behaviors/data/encode/url::oob-callback-uri-payload-encoding
  any:
  - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
  - id: micro-behaviors/fs/path/config/system::config-hosts
  - id: micro-behaviors/process/user/query::node-shell-id-command
  - id: micro-behaviors/process/user/query::node-runs-id
  needs: 1
defaults:
  for:
  - javascript
  - typescript
  crit: hostile
  mbc: E1041
