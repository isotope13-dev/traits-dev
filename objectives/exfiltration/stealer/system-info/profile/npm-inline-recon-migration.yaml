defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  mbc: E1041

composite_rules:
- id: node-cross-platform-recon-exfil
  desc: Cross-platform system recon with OOB exfiltration
  crit: hostile
  conf: 0.97
  attack: "T1041"
  all:
  - id: metadata/package/scripts/command::preinstall-inline-node-const-reference
  - id: metadata/package/scripts/reference::js-require-child-process
  - id: metadata/package/scripts/reference::js-require-https
  - id: micro-behaviors/os/sysinfo/platform/branch::npm-preinstall-platform-win32-check
  - id: micro-behaviors/communications/http/request/inline::js-https-request
  - id: micro-behaviors/communications/url/host/oob/package::js-oastify-host
  any:
  - id: micro-behaviors/os/sysinfo/command::js-execsync-systeminfo
  - id: micro-behaviors/fs/read/file/account::js-execsync-passwd
  - id: micro-behaviors/process/identity/query/principal::js-execsync-whoami
- crit: hostile
  conf: 0.995
  id: postinstall-docker-host-profile-exfil
  desc: postinstall exfils Docker host filesystem probe results
  attack: T1195.002,T1611,T1041
  all:
  - id: metadata/package/scripts/command::postinstall-inline-node-const-reference
  - id: micro-behaviors/fs/volume/mount::postinstall-docker-root-host-mount
  - id: micro-behaviors/fs/path/account-db::postinstall-host-root-file-probes
  - id: micro-behaviors/communications/http/request/verb::npm-script-node-http-post
  - id: micro-behaviors/communications/url/host/oob/package::pipedream-npm-script
