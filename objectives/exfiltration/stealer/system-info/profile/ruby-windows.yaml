defaults:
  platforms: [windows]
  for: [ruby]
  attack: T1041

composite_rules:
  - id: ruby-oob-system-info-exfil
    desc: Ruby OOB system info exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::ruby-windows-inventory-commands
      - id: micro-behaviors/os/registry/read::ruby-registry-runkey-query
      - id: micro-behaviors/data/encode/base64::ruby-base64-urlsafe-encode
      - id: micro-behaviors/communications/http/url/telemetry::ruby-oob-api-data-path
      - id: micro-behaviors/communications/http/header/custom::ruby-http-chunk-headers
