defaults:
  platforms: [windows, unix]
  for: [pyc]

composite_rules:
  - id: ransomware-host-profile-http-exfil
    desc: Python ransomware reports host and public IP over HTTP
    crit: hostile
    conf: 0.99
    attack: T1082,T1016.001,T1041,T1486
    all:
      - id: objectives/impact/ransom/encrypt/bytecode::encrypt-walk-ransom
      - id: micro-behaviors/os/sysinfo/hostname::python-bytecode-gethostname-name
      - id: micro-behaviors/communications/http/ip-discovery::ifconfig-me
      - id: micro-behaviors/communications/http/post-bytecode::python-http-post-helper
