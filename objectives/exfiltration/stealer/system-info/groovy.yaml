defaults:
  platforms: [unix, windows]
  for: [groovy]
  attack: T1041


composite_rules:
  - id: groovy-host-user-urlconnection-exfil
    desc: Groovy sends host and user profile in an HTTP POST
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/lib/httpclient::java-url-openconnection
      - id: micro-behaviors/communications/http/lib/urlconnection::groovy-urlconnection-post-body
      - id: micro-behaviors/data/format/json::java-json-host-field-prefix
      - id: micro-behaviors/data/format/json::java-json-user-field-separator
