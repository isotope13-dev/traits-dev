defaults:
  platforms: [unix, appliance]
  for: [rust, elf]
  attack: T1041

traits:


composite_rules:
  - id: native-host-profile-exfil
    desc: Native host profile exfiltration
    crit: hostile
    conf: 0.96
    for: [elf]
    all:
      - id: micro-behaviors/fs/path/os/identity::linux-proc-system-profile-paths
      - id: objectives/command-and-control/backdoor/tasking/socket::rust-exfil-command-token

  - id: rust-socket-profile-exfil
    desc: Rust socket profile exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/system::linux-system-profile-path-set
      - id: micro-behaviors/communications/socket/send::rust-write-all
    any:
      - id: micro-behaviors/os/network/interface::rust-interface-command
      - id: objectives/command-and-control/backdoor/tasking/socket::rust-binary-beacon-magic

  - id: rust-http-profile-raw-socket-exfil
    desc: Rust sends a host profile as raw HTTP over a fixed socket
    crit: hostile
    conf: 0.99
    attack: T1041,T1082
    for: [rust]
    all:
      - id: micro-behaviors/os/sysinfo/hostname::rust-command-hostname
      - id: micro-behaviors/process/user/query::rust-command-whoami
      - id: micro-behaviors/fs/directory/cwd::rust-current-directory
      - id: micro-behaviors/communications/ip/direct::external-ipv4-host-header
      - id: micro-behaviors/communications/socket/connect::tcpstream-connect-host-literal
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line-source
      - id: micro-behaviors/communications/http/header/content-type::native-json-content-type
      - id: micro-behaviors/communications/socket/send::rust-write-all
