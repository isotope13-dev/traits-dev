defaults:
  for: [shell]
  platforms: [unix]
composite_rules:
  - id: uname-group-public-netcat-export
    desc: Sends uname command-group output to a public netcat endpoint
    crit: suspicious
    conf: 0.96
    attack: T1041
    near_lines: 0
    all:
      - id: micro-behaviors/communications/socket/netcat::uname-group-netcat-export
      - id: micro-behaviors/communications/socket/netcat::nc-public-ip-endpoint
