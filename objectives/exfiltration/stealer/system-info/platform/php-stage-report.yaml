defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: php-stage-uname-url-report
    desc: PHP decoder write beside Base64 uname callback
    crit: suspicious
    conf: 0.98
    attack: T1082,T1041
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/url/build::shell-uname-base64-http-path
      - id: micro-behaviors/fs/write/file/redirect::base64-output-to-php-file
