defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: node-websocket-command-relay-host-profile
  for: [npm, javascript, typescript]
  desc: Remote command relay sends a Node host profile
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1059.007,T1071.001
  scope: archive
  all:
  - id: micro-behaviors/os/telemetry/logging/event::agent-status-label
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-member
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-version-access
  - id: objectives/command-and-control/backdoor/dispatch/websocket::remote-fix-command-exec
  - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
  - id: micro-behaviors/communications/http/websocket::wss-scheme
