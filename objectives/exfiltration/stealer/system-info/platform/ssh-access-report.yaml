defaults:
  platforms: [unix]
  for: [whl, python-sdist, python]
composite_rules:
  - id: default-ssh-collector-uname-report
    desc: Posts uname in default SSH access report
    crit: hostile
    conf: 0.98
    attack: T1041
    scope: archive
    all:
      - id: objectives/command-and-control/backdoor/ssh::published-anonymous-ssh-shell
      - id: micro-behaviors/os/sysinfo/platform/host::python-uname-report-field
