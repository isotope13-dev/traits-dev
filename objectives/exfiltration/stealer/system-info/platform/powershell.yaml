defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: ps-recon-curl-upload
    desc: PowerShell inventory curl upload
    crit: hostile
    conf: 0.95
    attack: T1041
    all:
      - id: objectives/discovery/system/profile::ps-system-profile-recon
      - id: micro-behaviors/communications/http/upload::curl-upload
    any:
      - id: micro-behaviors/fs/write/file/full::out-file
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-any
  - id: ps-recon-defender-upload
    desc: PowerShell recon after Defender tampering
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: objectives/exfiltration/stealer/system-info/platform::ps-recon-curl-upload
      - id: objectives/evasion/anti-av/platform/defender::defender-disable
