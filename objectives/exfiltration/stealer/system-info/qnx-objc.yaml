defaults:
  platforms: [qnx, unix]
  for: [objc]
  attack: T1041

composite_rules:
  - id: qnx-objc-host-profile-exfil
    desc: QNX ObjC host profile exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::qnx-objc-host-report
      - id: objectives/discovery/system/profile::qnx-objc-process-env-report
      - id: objectives/exfiltration/http/collect::qnx-objc-http-collect-post

  - id: qnx-objc-octet-host-exfil
    desc: QNX ObjC octet host exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::qnx-objc-http-collect-post
      - id: micro-behaviors/communications/email/mime::mime-octet-stream
      - id: objectives/discovery/system/profile::qnx-objc-host-report

  - id: qnx-objc-inventory-http-exfil
    desc: QNX ObjC inventory HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::qnx-objc-interface-report
      - id: objectives/discovery/system/profile::qnx-objc-process-env-report
      - id: objectives/exfiltration/http/collect::qnx-objc-http-collect-post
