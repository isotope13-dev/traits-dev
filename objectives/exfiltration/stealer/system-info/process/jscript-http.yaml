defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: jscript-host-profile-http-reporting
    desc: Windows host and AV profiling with HTTP identity reporting clues
    crit: suspicious
    conf: 0.95
    attack: T1082,T1518.001
    all:
      - id: micro-behaviors/os/wmi/query::query-os-info
      - id: micro-behaviors/os/wmi/query::query-antivirus
      - id: micro-behaviors/communications/url/query/profile::encoded-identity-query-field
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/os/com/automation::windows-com-scriptlet-element
