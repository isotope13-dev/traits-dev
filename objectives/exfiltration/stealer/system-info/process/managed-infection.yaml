# CIL review: server task -> process enumeration -> report file -> UploadManager
# -> UploadFileTaskAsync. Require the infection/task context independently of
# ordinary process inventory and HTTP uploads in legitimate diagnostic tools.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-infection-process-report-upload
    desc: Infection-task implant process-report upload profile
    crit: hostile
    conf: 0.98
    attack: T1057,T1041
    all:
      - id: objectives/exfiltration/stealer/system-info/identity::managed-infection-domain-report-upload
      - id: objectives/command-and-control/remote-command/shell::managed-infection-task-command-output-references
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
      - id: micro-behaviors/data/format/string::process-name-report-template
      - id: micro-behaviors/data/serialize/schema-object::machinename-label
