# Python recon agent that surveys security products and ships the host
# inventory to a WebSocket endpoint. Each leg alone is common (psutil-based
# inventory, websocket clients); the composite needs the survey and the send
# close together.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1518.001,T1041

composite_rules:
  - id: python-security-inventory-websocket-exfil
    desc: Python ships AV process survey over WebSocket
    crit: hostile
    conf: 0.95
    near_lines: 60
    all:
      - id: objectives/discovery/host/security::python-security-process-survey
      - id: micro-behaviors/communications/websocket/send::python-websocket-send-method
      - id: micro-behaviors/data/serialize/json::json-dumps-call
