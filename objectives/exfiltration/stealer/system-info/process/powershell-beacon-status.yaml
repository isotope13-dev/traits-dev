defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  # Required operations and an intrusion-specific report caption support
  # a hostile finding only when the report variable is passed to the POST.
- id: powershell-beacon-process-query-http-post
  desc: Beacon process status report submitted to an external HTTP endpoint
  crit: hostile
  conf: 0.93
  all:
  - id: micro-behaviors/data/format/log::powershell-beacon-commandline-report-label
  - id: micro-behaviors/process/info/commandline::powershell-wmic-commandline-query
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/communications/http/client/managed::webrequest-create
  - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
  - id: micro-behaviors/process/io/stream::powershell-stream-buffer-write
  - id: micro-behaviors/data/encode/charset::powershell-utf8-getbytes
  - id: micro-behaviors/communications/http/request/body/command-output::powershell-joined-output-post-body
