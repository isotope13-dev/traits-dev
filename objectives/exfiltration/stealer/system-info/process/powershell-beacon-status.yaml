defaults:
  platforms: [windows]
  for: [powershell]

traits:
  # A report caption is context, not proof that a beacon ran or data left.
  - id: powershell-beacon-commandline-report-label
    desc: Beacon command-line report caption
    crit: component
    conf: 0.98
    if:
      type: literal
      regex: '(?i)\bbeacon\b[^\r\n]{0,32}\b(cmdline|command.?line)\b'

composite_rules:
  # Required operations and an intrusion-specific report caption support
  # investigation. File-wide co-occurrence does not prove source-to-body flow.
  - id: powershell-beacon-process-query-http-post
    desc: Beacon process query and external HTTP POST
    crit: suspicious
    conf: 0.93
    all:
      - id: powershell-beacon-commandline-report-label
      - id: micro-behaviors/process/info/commandline::powershell-wmic-commandline-query
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/communications/http/client/managed::webrequest-create
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/data/buffer/transfer::powershell-stream-buffer-write
      - id: micro-behaviors/data/encode/charset::powershell-utf8-getbytes
