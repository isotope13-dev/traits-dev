defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  - typescript
  attack: T1195.002,T1048.003
composite_rules:
- id: npm-install-cwd-dns-exfil
  desc: Install hook exports working directory through encoded OOB DNS
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
  - id: objectives/exfiltration/dns/encoded::node-hex-cwd-oob-dns-query
- id: npm-install-host-user-dns-exfil
  desc: Install hook exports host and user names through DNS
  crit: hostile
  conf: 0.97
  scope: archive
  all:
  - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
  - id: metadata/package/scripts/discovery::preinstall-hostname
  - id: metadata/package/scripts/discovery::preinstall-username
  - id: metadata/package/scripts/discovery::preinstall-dns-resolve
