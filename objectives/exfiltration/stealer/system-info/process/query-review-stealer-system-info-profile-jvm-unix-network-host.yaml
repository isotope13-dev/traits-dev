---
defaults:
  platforms:
  - unix
  for:
  - java
  - kotlin
  - class
  - java_class
  - jar
composite_rules:
- id: jvm-profile-base64-collect-clues
  desc: JVM profile, Base64 and collect clues
  crit: notable
  conf: 0.98
  all:
  - id: objectives/discovery/system/profile::jvm-profile-temp-files
  - id: micro-behaviors/data/encode/base64/transport::jvm-exfil-base64-text
  - id: micro-behaviors/communications/http/request/route::jvm-collect-octet-text
- id: jvm-solaris-profile-collect-clues
  desc: JVM Solaris profile and collect clues
  crit: notable
  conf: 0.98
  all:
  - id: objectives/discovery/system/profile::jvm-solaris-profile-headers
  - id: micro-behaviors/communications/http/request/route::jvm-collect-octet-text
- id: jvm-host-form-exfil-path-clues
  desc: JVM host form and exfil path clues
  crit: notable
  conf: 0.98
  all:
  - id: objectives/discovery/system/profile::jvm-form-host-profile
  - id: micro-behaviors/communications/http/request/route::jvm-exfil-post-text
