defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1041,T1082
  mbc: E1041
  for: [package.json, javascript, tar, zip]
composite_rules:
- id: npm-preinstall-cwd-query-exfil
  desc: NPM preinstall sends identity or working directory in an HTTP query
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/http/query::npm-preinstall-shell-query-identity
  - id: metadata/package/scripts/command::npm-preinstall-cleartext-http-reference
- id: npm-preinstall-node-query-exfil
  desc: NPM preinstall sends command output in HTTP query
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/http/query::npm-preinstall-node-eval
  - id: objectives/exfiltration/http/query::npm-preinstall-node-query-argument
  - id: objectives/exfiltration/http/query::npm-preinstall-node-encodes-query-output
  - id: metadata/package/scripts/command::npm-preinstall-cleartext-http-reference
