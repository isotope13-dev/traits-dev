defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-preinstall-cwd-query-exfil
  desc: NPM preinstall sends identity or working directory in an HTTP query
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  mbc: E1041
  for: [package.json, javascript, tar, zip]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/http/query::npm-preinstall-shell-query-identity
  - id: metadata/package/scripts/command::npm-preinstall-cleartext-http-reference
