defaults:
  platforms: [windows]
  for: [ruby]
  attack: T1041

traits:
  - id: ruby-oob-api-data-path
    desc: Ruby OOB API data path
    crit: component
    conf: 0.9
    if:
      type: text
      substr: /api/data/

composite_rules:
  - id: ruby-windows-inventory-commands
    desc: Ruby Windows inventory commands
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/enumerate/shell::ruby-tasklist-command
      - id: micro-behaviors/os/network/status::netstat
      - id: micro-behaviors/os/autorun/control::ruby-schtasks-query-command

  - id: ruby-oob-system-info-exfil
    desc: Ruby OOB system info exfil
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-windows-inventory-commands
      - id: micro-behaviors/os/registry/read::ruby-registry-runkey-query
      - id: micro-behaviors/data/encode/base64::ruby-base64-urlsafe-encode
      - id: ruby-oob-api-data-path
      - id: micro-behaviors/communications/http/header/custom::ruby-http-chunk-headers
