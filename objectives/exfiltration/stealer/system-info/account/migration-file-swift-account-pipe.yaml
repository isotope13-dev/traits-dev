defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: swift-passwd-http-pipe
  desc: Cats passwd into an HTTP client
  crit: hostile
  conf: 0.96
  for:
  - swift
  platforms:
  - unix
  all:
  - id: micro-behaviors/fs/read/file/target::etc-passwd-cat
  - id: micro-behaviors/process/create/shell/pipeline::pipe-to-http-client
  - id: micro-behaviors/crypto/key/representation::openssl-hardcoded-pass
