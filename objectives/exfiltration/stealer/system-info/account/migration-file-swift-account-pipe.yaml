defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: swift-passwd-http-pipe
  desc: Cats passwd into an HTTP client
  crit: hostile
  conf: 0.96
  for:
  - swift
  platforms:
  - unix
  all:
  - id: micro-behaviors/fs/read/file/account::etc-passwd-cat
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-http-client
  - id: micro-behaviors/crypto/key/representation/material::openssl-hardcoded-pass
