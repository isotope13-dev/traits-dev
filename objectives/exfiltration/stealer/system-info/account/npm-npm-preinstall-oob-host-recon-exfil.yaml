defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-preinstall-oob-host-recon-exfil
  desc: Preinstall account query and OOB endpoint
  crit: hostile
  conf: 0.99
  mbc: "C0011"
  attack: "T1195.002,T1041,T1082"
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
