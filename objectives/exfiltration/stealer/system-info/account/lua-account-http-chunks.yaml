defaults:
  platforms: [unix]
  for: [lua]
  attack: T1041

traits:
  - id: lua-reads-passwd-command
    desc: Lua reads the local passwd file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\brun\(["'']cat\s+/etc/passwd["'']\)'

  - id: lua-formats-sequenced-exfil-path
    desc: Builds a sequenced HTTP exfil path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'string\.format\(["'']/exfil/%s/%d/%s["''],\s*\w+,\s*\w+,\s*\w+'

composite_rules:
  - id: lua-passwd-file-http-chunk-exfil
    desc: Lua reads local account records and sends chunks through HTTP paths
    crit: hostile
    conf: 0.99
    all:
      - id: lua-reads-passwd-command
      - id: lua-formats-sequenced-exfil-path
      - id: micro-behaviors/communications/socket/connect/attempt::lua-tcp-connect
      - id: micro-behaviors/communications/socket/send/message::lua-socket-send
