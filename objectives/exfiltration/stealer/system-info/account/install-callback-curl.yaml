defaults:
  platforms: ["unix", "windows"]
  for: ["javascript"]

  attack: T1195.002,T1033,T1041
composite_rules:
  - id: npm-postinstall-user-query-stdin-curl
    desc: Postinstall pipes user identity into curl
    crit: suspicious
    conf: 0.99
    for: [package.json]
    near_bytes: 640
    all:
      - id: micro-behaviors/process/identity/query/command::npm-postinstall-user-source-pipe-curl
      - id: micro-behaviors/communications/http/curl/command::npm-postinstall-piped-curl-http-url
      - id: micro-behaviors/communications/http/curl/body::curl-stdin-body-post
  - id: npm-postinstall-shell-user-identity-exfil
    desc: npm postinstall sends the installing user's identity to an HTTP endpoint
    crit: hostile
    conf: 0.995
    mbc: E1041
    for: [package.json, npm, tar, zip]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/exfiltration/stealer/system-info/account::npm-postinstall-user-query-stdin-curl
      - id: micro-behaviors/communications/http/curl/body::curl-stdin-body-post
  - id: npm-postinstall-user-identity-curl-exfil
    desc: npm postinstall exfiltrates user identity via curl
    crit: hostile
    conf: 0.995
    mbc: E1041
    for: [package.json, npm, tar, zip]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/env/user-info::npm-postinstall-user-env
      - id: micro-behaviors/process/identity/query/principal::npm-postinstall-os-userinfo-call
      - id: micro-behaviors/communications/http/curl/body::curl-stdin-body-post
