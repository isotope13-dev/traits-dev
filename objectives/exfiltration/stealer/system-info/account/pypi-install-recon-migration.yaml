defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: username-hex-header-exfil
  desc: Username hex exfil over HTTP header
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/discovery/account/enum::whoami-via-rot13-subprocess
  - id: micro-behaviors/data/encode/hex::string-encode-hex
  - id: micro-behaviors/communications/http/header/implant-id::x-header-single-letter
  - id: micro-behaviors/communications/http/request/client::request-python
- id: python-sysinfo-exfil
  desc: Python install hook sends the current login name to an HTTP server
  crit: hostile
  conf: 0.92
  mbc: E1041
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/request/params::urllib-urlopen-b64-login-query
  near_bytes: 1024
- id: pypi-oob-user-exfil
  desc: PyPI OOB callback exfiltrating user info
  crit: hostile
  conf: 0.95
  mbc: E1041
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-domains
  - id: micro-behaviors/communications/http/post::requests-post
  - id: objectives/discovery/account/enum::username-env
- id: pypi-install-username-exfil
  desc: PyPI install-time username exfiltration
  crit: hostile
  conf: 0.98
  mbc: E1041
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: objectives/discovery/account/enum::whoami-via-rot13-subprocess
  - id: micro-behaviors/data/encode/hex::string-encode-hex
  - id: micro-behaviors/communications/http/client/library::setup-py-dns-http-cooccurrence
  any:
  - id: objectives/exfiltration/stealer/system-info/account::username-hex-header-exfil
- id: pypi-install-obfuscated-network-exfil
  desc: Obfuscated PyPI install-time network exfiltration
  crit: hostile
  conf: 0.97
  mbc: E1041
  attack: T1020
  all:
  - id: objectives/exfiltration/stealer/system-info/account::pypi-install-username-exfil
  - id: micro-behaviors/data/encode/rot13::python-rot13-decoder
  any:
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-socket-error-pass
