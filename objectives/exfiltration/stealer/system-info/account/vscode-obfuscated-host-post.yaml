defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  attack: T1082,T1041,T1027

traits:
  - id: vscode-obfuscated-host-post
    desc: Extension conceals host inventory POST
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule vscode_obfuscated_host_post {
          strings:
            $extension = "context.extensionPath" ascii
            $host = "os.hostname()" ascii
            $os = "os.release()" ascii
            $post = /method:\s*['"]POST['"]/
            $request = "https.request(" ascii
            $hex = /fromCharCode\(parseInt\([^\r\n]{1,100},16\)\)/
            $reverse = ".reverse().join('')" ascii
            $write = /\.write\([^\r\n]{1,80}\)/
          condition:
            all of them
        }
