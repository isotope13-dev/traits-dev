defaults:
  platforms: [windows]
  for: [powershell, batch, javascript, typescript, python, vbs, lnk, pe]
composite_rules:
  - id: concealed-powershell-account-report
    desc: Concealed downloader reports domain and username
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/request/report::encoded-downloadstring-domain-url
      - id: micro-behaviors/communications/http/request/params::powershell-domain-query-value
      - id: micro-behaviors/communications/http/request/params::powershell-username-query-value
