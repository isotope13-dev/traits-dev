defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - package.json
  - javascript
  - typescript
  attack: T1195.002,T1048.003
composite_rules:
- id: npm-install-user-dns-exfil
  desc: Install hook exports user name through encoded OOB DNS
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
  - id: objectives/exfiltration/dns/encoded::node-hex-user-oob-dns-query
