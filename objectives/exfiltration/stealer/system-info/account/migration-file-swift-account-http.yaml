defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: swift-password-key-http-post
  desc: Account-file read and key paths with HTTP POST
  crit: suspicious
  conf: 0.96
  for:
  - swift
  platforms:
  - unix
  all:
  - id: micro-behaviors/fs/read/file/content/unspecified::swift-direct-file-read-api
  - id: micro-behaviors/communications/http/request/body/construction::swift-urlrequest-http-body
  - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
  - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path
  - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
- id: swift-shadow-ssh-http-post
  desc: Posts account data with shadow and SSH keys
  crit: hostile
  conf: 0.97
  for: [swift]
  platforms: [unix]
  all:
  - id: swift-password-key-http-post
  - id: micro-behaviors/fs/path/credential::authorized-keys-or-shadow-path
  - id: micro-behaviors/fs/path/private-key::swift-ssh-rsa-key-path
