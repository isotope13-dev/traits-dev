defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

  mbc: E1041
composite_rules:
- id: meta-preinstall-sysinfo-exfil
  desc: Preinstall hook exfils sysinfo via curl
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: metadata/package/scripts/reference::meta-hook-pipedream
- id: meta-preinstall-wget-sysinfo-exfil
  desc: Preinstall hook exfils sysinfo via wget
  crit: hostile
  conf: 0.99
  attack: T1041
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: metadata/package/scripts/reference::meta-hook-pipedream
- id: meta-preupdate-sysinfo-exfil
  desc: Preupdate hook exfils sysinfo via curl
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-curl
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
- id: meta-preupdate-wget-sysinfo-exfil
  desc: Preupdate hook exfils sysinfo via wget
  crit: hostile
  conf: 0.99
  attack: T1041
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-wget
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
- id: meta-multi-hook-redundant-exfil
  desc: Multiple lifecycle hooks repeat same curl exfil
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: metadata/package/scripts/reference::versioned-preupdate-hook
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/communications/http/request/package::npm-test-script-curl
  - id: metadata/package/scripts/reference::meta-hook-pipedream
  - id: metadata/package/empty::versioned-readme-error
- id: meta-multi-hook-redundant-wget-exfil
  desc: Multiple lifecycle hooks repeat same wget exfil
  crit: hostile
  conf: 0.995
  attack: T1041
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget
  - id: metadata/package/scripts/reference::versioned-preupdate-hook
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/communications/http/request/package::npm-test-script-wget
  - id: metadata/package/scripts/reference::meta-hook-pipedream
  - id: metadata/package/empty::versioned-readme-error
- id: meta-postinstall-sysinfo-exfil
  desc: Postinstall hook exfils sysinfo via curl
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/http/curl/command::postinstall-curl-command-text
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: micro-behaviors/fs/directory/cwd::package-script-pwd-substitution
- id: meta-test-hook-exfil
  desc: Test script abused to exfil sysinfo
  crit: hostile
  conf: 0.97
  attack: T1041
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/http/request/package::npm-test-script-curl
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: metadata/package/scripts/reference::meta-hook-pipedream
- id: meta-wget-webhook-sysinfo-exfil
  desc: Wget exfils sysinfo to webhook/OOB service
  crit: hostile
  conf: 0.98
  attack: T1041
  for: [package.json]
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/process/identity/query/command::whoami-command-substitution
  any:
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-wget
  - id: micro-behaviors/communications/http/request/package::npm-test-script-wget
  - id: micro-behaviors/os/sysinfo/hostname/command::package-hostname-substitution
  - id: metadata/package/scripts/reference::meta-hook-pipedream
  - id: micro-behaviors/communications/url/query/profile::package-user-path-host-query-text
  needs: 2
