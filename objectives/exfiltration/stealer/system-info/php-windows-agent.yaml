defaults:
  platforms: [windows]
  for: [php]
  attack: T1041

composite_rules:
  - id: php-windows-systeminfo-http-exfil
    desc: PHP Windows sysinfo HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/fingerprint/info::php-windows-profile-commands
      - id: objectives/discovery/system/profile::php-env-profile-fields
      - id: objectives/discovery/system/profile::php-system-info-report
      - id: objectives/command-and-control/remote-command/tasking::php-api-v1-report-path
