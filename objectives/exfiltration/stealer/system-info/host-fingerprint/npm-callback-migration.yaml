defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-postinstall-host-install-metadata-beacon
  desc: npm postinstall sends host and install metadata to a literal IP
  crit: suspicious
  conf: 0.96
  attack: "T1195.002,T1082,T1041"
  for: [npm, tar, zip, package.json, javascript, markdown]
  scope: archive
  all:
  - id: metadata/package/scripts/command::postinstall-runs-node-script
  - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
  - id: micro-behaviors/os/sysinfo/hostname/query::node-inline-os-hostname-call
  - id: micro-behaviors/fs/path/self::script-directory-install-path-field
  - id: micro-behaviors/communications/http/request/client::node-http-alias-request-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
- id: npm-import-time-host-install-metadata-beacon
  desc: npm module import sends host and install metadata to a literal IP
  crit: suspicious
  conf: 0.96
  attack: "T1195.002,T1082,T1041"
  for: [npm, tar, zip, package.json, javascript, markdown]
  scope: archive
  all:
  - id: micro-behaviors/os/module/require::cjs-caught-local-require
  - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
  - id: micro-behaviors/os/sysinfo/hostname/query::node-inline-os-hostname-call
  - id: micro-behaviors/fs/path/self::script-directory-install-path-field
  - id: micro-behaviors/communications/http/request/client::node-http-alias-request-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
- id: depconf-preinstall-base64-host-profile
  desc: Dependency-confusion npm preinstall exfiltrates base64 host profile
  crit: hostile
  conf: 0.995
  attack: "T1195.002, T1041, T1082, T1033"
  mbc: E1041
  for: [npm, tgz, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/command::preinstall-runs-node-local-script
  - id: micro-behaviors/data/encode/base64/structured::node-json-base64-with-host-query
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  any:
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: objectives/supply-chain/install-hook/package/manifest::fake-security-research
- id: npm-postinstall-hostname-json-beacon
  desc: Postinstall hostname JSON POST plus sink signal
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  mbc: E1041
  for: [npm, tar, package.json, javascript, markdown]
  scope: archive
  all:
  - id: metadata/package/scripts/command::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  any:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/documentation/disclosure::readme-authorized-dependency-confusion-test
  needs: 2
  unless:
  - id: metadata/path/directory::test-directory-component
- id: npm-accenture-host-identity-callback
  desc: Host-identity GET to known campaign callback
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041
  for: [npm, tar, tgz, package.json, javascript]
  scope: archive
  all:
  - id: micro-behaviors/communications/http/telemetry::node-accenture-npm-host-identity-get-query
  - id: metadata/package/versioning/scheme::package-version-shape-profile
