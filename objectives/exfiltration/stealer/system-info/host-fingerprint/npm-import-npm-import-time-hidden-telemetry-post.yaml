defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, zip, tar]
composite_rules:
  # Side-effect modules can report runtime identity through Node's HTTPS
  # request API instead of the older CommonJS local-require shape below. The
  # unref'ed request and silent error handler identify background reporting,
  # which can also be ordinary opt-out telemetry.
  # Keep all evidence in one source file to prevent package-wide pooling.
  - id: node-background-runtime-profile-post
    desc: Unrefed Node runtime profile POST
    crit: suspicious
    conf: 0.98
    attack: T1041,T1082
    for: [javascript, typescript, tar, zip, npm]
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime/version::process-version-access
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::node-platform-method-call
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-arch-call
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-body
      - id: micro-behaviors/process/control/wait::node-unref-handle
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
    near_bytes: 3000

  - id: npm-import-time-hidden-telemetry-post
    desc: Caught require, POST body and runtime telemetry clues
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-end-body
      - id: micro-behaviors/os/sysinfo/platform/runtime/version::process-version-access
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::node-platform-method-call
    unless:
      - id: metadata/path/directory::test-directory-component
