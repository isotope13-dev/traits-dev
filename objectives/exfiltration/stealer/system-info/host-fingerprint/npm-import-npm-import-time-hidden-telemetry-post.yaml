defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, zip, tar]
composite_rules:
- id: npm-import-time-hidden-telemetry-post
  desc: Caught require, POST body and runtime telemetry clues
  conf: 0.97
  scope: archive
  all:
  - id: micro-behaviors/os/module/require::cjs-caught-local-require
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-end-body
  - id: micro-behaviors/os/sysinfo/platform/runtime/version::process-version-access
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::node-platform-method-call
  unless:
  - id: metadata/path/directory::test-directory-component
