defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
composite_rules:
- id: init-encoded-url-host-identity-callback
  for:
  - python
  desc: Init file sends host identity to an encoded URL
  crit: hostile
  conf: 0.96
  mbc: E1041
  attack: T1195.002,T1082,T1041
  all:
  - id: micro-behaviors/communications/http/request/url::init-encoded-url-callback
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
