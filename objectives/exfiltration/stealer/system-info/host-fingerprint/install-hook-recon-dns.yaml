defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-preinstall-sysinfo-dns-exfil
  desc: NPM preinstall references system identity and a dynamic subdomain
  crit: hostile
  conf: 0.98
  attack: T1048.003
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami-pwd
  - id: metadata/package/scripts/network::preinstall-curl-dynamic-subdomain
- id: npm-js-recon-dns-oast-exfil
  desc: Node exec recons host and exfils via OAST DNS
  crit: hostile
  conf: 0.995
  attack: T1048.003
  mbc: E1041
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/os/sysinfo/report::js-hostname-pwd-whoami-chain
  - id: micro-behaviors/communications/http/ip-discovery::js-curl-ifconfig-me
  - id: objectives/exfiltration/dns/encoded::js-xxd-nslookup-loop
  - id: objectives/exfiltration/oob/oast::js-nslookup-oast-site
- id: npm-preinstall-nslookup-dns-exfil
  desc: NPM preinstall exfils recon via nslookup DNS tunnel
  crit: hostile
  conf: 0.98
  attack: T1048.003
  mbc: E1041
  near_lines: 120
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/communications/dns/cli::nslookup-exec
  - id: micro-behaviors/data/encode/hex::xxd-hex-encode
  any:
  - id: micro-behaviors/os/sysinfo/report::js-hostname-pwd-whoami-chain
  - id: micro-behaviors/os/sysinfo/report::js-host-profile-command-sequence
  - id: micro-behaviors/os/sysinfo/hostname/command::hostname-cmd
- id: npm-preinstall-nslookup-host-profile-exfil
  desc: npm preinstall exfils host profile via nslookup DNS
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1048.003,T1082,T1033
  mbc: E1041
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - zip
  - tar
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: objectives/exfiltration/stealer/system-info/identity::js-nslookup-host-profile-dns-exfil
- id: npm-preinstall-silenced-recon-dns-exfil
  desc: Silenced preinstall exfils recon via DNS
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1048.003,T1082
  mbc: E1041
  for:
  - javascript
  - package.json
  - tar
  - zip
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: metadata/package/scripts/command::npm-lifecycle-runtime-stdout-to-null
  - id: metadata/import/builtin::child-process-api-destructure
  - id: objectives/exfiltration/dns/encoded::js-xxd-nslookup-loop
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
  any:
  - id: micro-behaviors/os/sysinfo/report::js-host-profile-command-sequence
  - id: objectives/collection/file-targeting/enumeration::node-exec-account-file-command
