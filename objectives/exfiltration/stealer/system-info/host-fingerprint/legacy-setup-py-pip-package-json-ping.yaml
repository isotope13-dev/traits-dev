defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002
composite_rules:
  - id: setup-py-pip-package-json-ping
    desc: setup.py POSTs pip package install ping
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1041,T1082
    mbc: E1041
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/communications/http/request/body/form-field::post-data-package-key
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
