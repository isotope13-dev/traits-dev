defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

  mbc: E1041
  attack: T1041
composite_rules:
- id: meta-hook-triple-exfil
  desc: Hook exfils user/path/hostname via URL params
  crit: hostile
  conf: 0.999
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/url/query/profile::package-user-path-host-query-text
  any:
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-curl
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-wget
  - id: micro-behaviors/communications/http/request/package::npm-test-script-curl
  - id: micro-behaviors/communications/http/request/package::npm-test-script-wget
  - id: micro-behaviors/communications/http/curl/command::postinstall-curl-command-text
- id: meta-triple-hook-wget-query-exfil
  desc: Three hooks reuse wget query exfil
  crit: hostile
  conf: 0.999
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget-quiet-kv
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-wget-quiet-kv
  - id: micro-behaviors/communications/http/request/package::meta-test-wget-quiet-kv
  - id: micro-behaviors/communications/url/query/profile::preinstall-user-path-host-query
  - id: micro-behaviors/communications/url/query/profile::preupdate-user-path-host-query
  - id: micro-behaviors/communications/url/query/profile::test-user-path-host-query
  any:
  - id: metadata/package/publishing::meta-versioned-small-single-file
  - id: metadata/package/empty::versioned-readme-error
- id: meta-package-hook-triple-exfil
  desc: Hook exfils user/path/hostname via URL params
  crit: hostile
  conf: 0.999
  for: [package.json]
  all:
  - id: micro-behaviors/communications/url/query/profile::package-user-path-host-query-text
  any:
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget
  - id: micro-behaviors/communications/http/request/package::meta-preupdate-wget
  - id: micro-behaviors/communications/http/request/package::npm-test-script-wget
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/communications/http/curl/command::postinstall-curl-command-text
  - id: micro-behaviors/communications/http/request/package::npm-test-script-curl
