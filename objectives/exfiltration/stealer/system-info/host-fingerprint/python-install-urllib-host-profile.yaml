defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041

composite_rules:
- id: python-install-urllib-host-profile-json-exfil
  desc: Install hook posts hostname and user profile as JSON
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/communications/http/request/json::urllib-json-body-host-identity
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
