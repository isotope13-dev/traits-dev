defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
composite_rules:
  - id: postinstall-curl-ip-recon-exfil
    desc: Host and user URL query with IP clues
    crit: suspicious
    conf: 0.98
    attack: T1041
    mbc: E1041
    all:
      - id: micro-behaviors/communications/url/construction/query::url-query-whoami-subshell
      - id: micro-behaviors/communications/url/construction/query::url-query-hostname-subshell
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/request/verb::curl-post-ssilent

