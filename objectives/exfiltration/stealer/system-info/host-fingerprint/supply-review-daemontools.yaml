defaults:
  platforms: [windows]
  for: [pe]
  mbc: "B0030"
  size_max: 524288

composite_rules:
  - id: infocollector-fingerprint-and-exfil-chain
    desc: InfoCollector fingerprint + RC4-base64 POST exfil
    crit: hostile
    conf: 0.99
    attack: "T1041"
    all:
      - id: objectives/discovery/host/fingerprint::multi-source-victim-fingerprint
      - id: micro-behaviors/communications/http/client/reference::rc4-key-method-uploadstring-clues
  - id: infocollector-spoofed-browser-recon-exfil
    desc: Browser UA on non-browser .NET recon stub
    crit: hostile
    conf: 0.985
    attack: "T1071.001"
    all:
      - id: micro-behaviors/os/sysinfo/query::host-recon-method-name-cluster
      - id: micro-behaviors/communications/http/header/value::browser-mozilla-5-0
      - id: micro-behaviors/communications/http/client/managed::uploadstring
