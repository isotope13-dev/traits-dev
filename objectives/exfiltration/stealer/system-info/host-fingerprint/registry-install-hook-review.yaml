defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: install-hook-recon-exfil
    desc: Lifecycle hook fingerprints and exfiltrates host
    crit: hostile
    conf: 0.98
    attack: "T1041"
    mbc: "E1041"
    # registry-metadata-json/versioned-lifecycle-* only ever resolve on the
    # separately-fetched pkginfo registry snapshot, while registry-recon-*
    # reads the raw lifecycle-hook text out of package.json -- two different
    # nodes of the same npm package, so this needs archive pooling.
    scope: archive
    for: [npm, package.json, pkginfo]
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: micro-behaviors/process/interpreter/node::versioned-lifecycle-node-e
      - id: metadata/package/scripts/command::versioned-lifecycle-child-process-exec
      - id: micro-behaviors/os/sysinfo/report::registry-recon-user-host-cwd
    any:
      - id: micro-behaviors/communications/url/construction/query::versioned-encoded-query-parameter
      - id: micro-behaviors/communications/url/query/endpoint::registry-http-get-query-exfil
      - id: micro-behaviors/communications/http/download/wget::versioned-lifecycle-wget-quiet
      - id: metadata/package/publishing::versioned-http-ip-url
  - id: repeated-install-hook-recon-exfil
    desc: Multiple lifecycle hooks repeat recon exfil
    crit: hostile
    conf: 0.98
    attack: "T1195.002"
    scope: archive
    for: [npm, package.json, pkginfo]
    all:
      - id: objectives/supply-chain/impersonation/registry/snapshot::lifecycle-hook-registry-metadata
      - id: objectives/exfiltration/stealer/system-info/host-fingerprint::install-hook-recon-exfil
