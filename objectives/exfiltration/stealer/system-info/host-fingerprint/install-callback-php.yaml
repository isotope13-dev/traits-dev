defaults:
  platforms: ["unix", "windows"]
  for: ["php", "composer.json"]

composite_rules:
  - id: composer-hook-host-profile-oob-exfil
    mbc: E1041
    desc: Composer hook exfiltrates a PHP host profile
    crit: hostile
    conf: 0.995
    attack: "T1195.002, T1041, T1082, T1033"
    for: [php, composer.json, zip, tar, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::composer-lifecycle-hook
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/data/serialize/json::php-json-encode
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::php-uname-call
      - id: micro-behaviors/fs/directory/cwd::php-getcwd
      - id: micro-behaviors/fs/file/stat::php-get-current-user
    needs: 2
