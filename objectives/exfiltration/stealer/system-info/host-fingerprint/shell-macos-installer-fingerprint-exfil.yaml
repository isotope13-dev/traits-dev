# A macOS package installer hook (postinstall/preinstall) runs with elevated
# privileges at install time. A hook that collects persistent hardware
# identifiers (serial number plus MAC address) and issues an HTTP request
# carrying the resulting device identifier exfiltrates a host fingerprint
# under install-time cover. This is the PPI-dropper shape previously seen
# only with LaunchAgent persistence (see
# objectives/persistence/login/startup/launchagent::fingerprinted-affiliate-agent-dropper):
# the same fingerprint collection and beaconing, delivering a fetched
# system package instead of a LaunchAgent. Product names, endpoints,
# version strings and variable spellings are deliberately not legs.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1195.002,T1082,T1041
  mbc: E1041

composite_rules:
  - id: shell-macos-installer-fingerprint-exfil
    desc: Installer hook exfiltrates hardware fingerprint
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
      - id: micro-behaviors/os/sysinfo/network::networksetup-mac-address-query
      - id: micro-behaviors/communications/http/telemetry::device-id-request-parameter
      - id: micro-behaviors/communications/http/curl/body::curl-data-option
    any:
      - id: micro-behaviors/os/sysinfo/machine-id::shell-hardware-serial-query
      - id: micro-behaviors/os/sysinfo/machine-id::shell-ioreg-serial-query
      - id: micro-behaviors/os/sysinfo/machine-id::macos-ioreg-platform-expert-query
    needs: 1
