defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
composite_rules:
  - id: npm-exec-whoami-oast-callback
    desc: npm exec sends whoami to OAST service
    crit: suspicious
    conf: 0.96
    attack: T1033
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/identity/query/command::whoami-cmd
    any:
      - id: objectives/exfiltration/oob
      - id: micro-behaviors/communications/url/host/oob/execution::node-child-process-webhook-site-reference
