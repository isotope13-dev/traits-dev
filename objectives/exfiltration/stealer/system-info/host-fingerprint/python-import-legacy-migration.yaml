defaults:
  platforms: [unix, windows]
  for: [python]
  mbc: E1041
composite_rules:
- id: init-base64-http-profile-exfil
  desc: Import-time base64 host profile exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/data/serialize/schema-system::compact-host-profile-fields
  - id: micro-behaviors/data/encode/base64/primitive::base64-encoding
  - id: micro-behaviors/communications/http/request/client::request-python
- id: init-host-header-profile-exfil
  desc: Import-time host-header profile exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/data/serialize/schema-system::compact-host-profile-fields
  - id: micro-behaviors/communications/http/header/host::host-header-override
  - id: micro-behaviors/communications/http/request/client::request-python
- id: init-pypi-fastly-profile-exfil
  desc: Import-time PyPI Fastly exfiltration
  crit: hostile
  conf: 0.995
  all:
  - id: init-host-header-profile-exfil
  - id: well-known/app/infrastructure/fastly::pypi-fastly-host-override
- id: init-env-command-http-exfil
  desc: Import-time env command HTTP exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/os/env/enumerate::python-env-command-reference
  - id: micro-behaviors/communications/http/request/client::request-python
- id: init-fastly-env-command-exfil
  desc: Import-time Fastly env command exfiltration
  crit: hostile
  conf: 0.99
  all:
  - id: init-env-command-http-exfil
  - id: well-known/app/infrastructure/fastly::pypi-fastly-host-override
- id: import-install-host-profile-curl-beacon
  desc: Import/install host profile sent via curl
  crit: suspicious
  conf: 0.9
  attack: T1195.002,T1082,T1041
  all:
  - id: micro-behaviors/os/package-manager/hook-install::runs-at-import-or-install
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
- id: init-requests-host-profile-post
  desc: Import posts host profile via requests
  crit: hostile
  conf: 0.95
  attack: T1195.002,T1041,T1082
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  any:
  - id: micro-behaviors/communications/http/post::python-module-post-url-body
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
- id: import-time-urllib-json-host-profile-ip-beacon
  desc: Import POSTs JSON host profile to external IP
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1041,T1082
  all:
  - id: micro-behaviors/os/package-manager/hook-install::runs-at-import-or-install
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/data/serialize/schema-system::python-host-id-object-fields
- id: init-curl-user-host-cwd-beacon
  desc: Import curls host user and cwd
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1041,T1082
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
