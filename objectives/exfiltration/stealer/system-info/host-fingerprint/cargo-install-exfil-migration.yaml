defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
  mbc: E1041
composite_rules:
- id: setup-py-install-host-profile-beacon
  desc: Install hook with host and HTTP clues
  crit: suspicious
  conf: 0.97
  scope: leaf
  attack: T1195.002,T1082,T1033,T1041
  all:
  - id: micro-behaviors/communications/http/client/library::setup-command-http-api-cooccurrence
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  any:
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: micro-behaviors/os/sysinfo/platform/host::platform-system
  unless:
  - id: metadata/build/recognized-contexts::python-setup-network-benign-context
- id: setup-py-install-host-profile-oob-exfil
  desc: Install hook exfiltrates host profile to OOB
  crit: hostile
  conf: 0.99
  scope: leaf
  attack: T1195.002,T1082,T1033,T1041
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: micro-behaviors/communications/http/get::requests-get
  any:
  - id: micro-behaviors/communications/url/host/oob/endpoint::burpcollaborator
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  unless:
  - id: metadata/build/recognized-contexts::python-setup-network-benign-context
