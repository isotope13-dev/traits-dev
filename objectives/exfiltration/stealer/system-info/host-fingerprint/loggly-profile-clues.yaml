# User, cwd and Loggly transport clues.
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1082,T1033
composite_rules:
  - id: plugin-register-user-cwd-loggly-beacon
    desc: Loggly, user, cwd and decoded text clues
    conf: 0.96
    scope: archive
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/process/info/current::node-process-pid-access
      - id: micro-behaviors/communications/http/services/loggly::loggly-transport-construction
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64-to-utf8
    unless:
      - id: metadata/path/directory::test-directory-component
