defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: python-module-host-profile-posts-to-private-collector
  desc: Python posts user and host data to private endpoint
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1033,T1195.002
  scope: file
  all:
  - id: micro-behaviors/communications/ip/literal::private-192-http-url-source-literal
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
  - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
  - id: micro-behaviors/data/serialize/schema-system::host-user-field-pair

- id: python-install-hook-host-profile-json-post
  desc: Install hook posts user and host profile data
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1082,T1033,T1041
  scope: file
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/data/serialize/schema-system::host-user-field-pair

- id: import-time-host-profile-beacon
  desc: Import-time POST carries host identity
  crit: hostile
  conf: 0.96
  scope: file
  mbc: E1041
  attack: T1195.002,T1082,T1033,T1041
  all:
  - id: micro-behaviors/communications/http/post::python-module-post-url-body
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user

- id: import-time-requests-host-profile-get
  desc: Import sends host profile in GET URL
  crit: hostile
  conf: 0.97
  mbc: E1041
  attack: T1195.002,T1082,T1033,T1041
  scope: archive
  for: [python, python_sdist, whl, zip, tar]
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/request/url::python-host-identity-in-client-url
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination

- id: python-install-hook-host-profile-webhook-get
  desc: Install hook sends host profile through a remote GET webhook
  crit: hostile
  conf: 0.97
  mbc: E1041
  attack: T1195.002,T1082,T1033,T1041
  scope: archive
  for: [python, python_sdist, whl, zip, tar]
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/request/url::python-host-identity-in-client-url
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
