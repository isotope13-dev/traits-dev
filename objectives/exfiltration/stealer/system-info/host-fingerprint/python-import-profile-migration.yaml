defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: import-time-host-profile-beacon
  desc: Import-time POST carries host identity
  crit: hostile
  conf: 0.96
  mbc: E1041
  attack: T1195.002,T1082,T1033,T1041
  all:
  - id: micro-behaviors/communications/http/post::python-module-post-url-body
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
