defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: npm-import-time-system-telemetry-post
    desc: Import-time npm system telemetry POST
    crit: hostile
    conf: 0.96
    attack: T1041
    mbc: E1041
    size_max: 20000
    all:
      - id: micro-behaviors/communications/http/telemetry::npm-package-json-telemetry-post
      - id: micro-behaviors/communications/url/resource-path/collection::telemetry-api-path
      - id: objectives/discovery/system/fingerprint/hardware::node-short-os-alias-host-user
      - id: objectives/discovery/system/fingerprint/hardware::node-short-os-alias-profile
      - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: objectives/anti-static/obfuscation/eval/dynamic::loader-iife-tail
      - id: micro-behaviors/data/control-flow/error-handling/suppress::from-str-empty-catch
  - id: npm-disguised-analytics-host-beacon
    desc: npm archive pairs a concealed sidecar with host telemetry code
    crit: suspicious
    conf: 0.94
    attack: T1195.002,T1082
    scope: archive
    for:
      - npm
      - tar
      - javascript
    all:
      - id: micro-behaviors/os/env/reference::npm-disable-telemetry-env-gate
      - id: micro-behaviors/data/property/access::js-fragmented-property-access
      - id: micro-behaviors/communications/url/resource-path/collection::analytics-collect-v2-path
      - id: micro-behaviors/os/sysinfo/hostname/query::os-bracket-split-hostname-access
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/os/module/require::caught-local-require-swallowed-catch
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
    unless:
      - id: well-known/tool/development/vscode-extension/tencent-codebuddy::tencent-codebuddy
