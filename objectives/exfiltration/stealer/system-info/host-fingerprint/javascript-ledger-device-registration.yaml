defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  # Hardware UUID read through ioreg output, as macOS device-identity code does.
  - id: ledger-hardware-uuid-read
    desc: Reads the macOS IOPlatformUUID device identifier
    if:
      type: text
      substr: IOPlatformUUID

  - id: ledger-account-signup-path
    desc: Posts to an account signup API path
    if:
      type: text
      regex: '(?i)/account/signup\b'

  - id: ledger-receipt-submit-path
    desc: Submits activity receipts to a ledger endpoint
    if:
      type: text
      regex: '(?i)/(receipts|interactions)\b'

composite_rules:
  # Device identity registers an account, then activity receipts stream out.
  - id: ledger-device-registration-telemetry
    desc: Device UUID registers an account and streams activity receipts
    crit: hostile
    conf: 0.9
    attack: T1041
    all:
      - id: ledger-hardware-uuid-read
      - id: ledger-account-signup-path
      - id: ledger-receipt-submit-path
