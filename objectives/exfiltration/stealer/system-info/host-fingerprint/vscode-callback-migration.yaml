defaults:
  platforms: [unix, windows, macos]
  for: [vsix-archive, javascript, typescript, package.json]
  attack: "T1195.002,T1041,T1082"
  mbc: E1041
composite_rules:
- id: vscode-startup-obfuscated-host-profile-beacon
  desc: VS Code startup, obfuscation and host-network clues
  crit: suspicious
  conf: 0.99
  scope: outer
  all:
  - id: metadata/permission/activation::activate-all-events
  - id: metadata/permission/activation::main-extension-js
  - id: objectives/anti-static/obfuscation/obfuscator-supply-chain::obfuscated-vscode-host-network-argument-vector
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/os/module/require::node-global-os-module-exposure
  - id: micro-behaviors/communications/http/module/load::node-global-https-module-exposure
  - id: micro-behaviors/process/create/exec::node-spawnsync-call
  - id: metadata/file/encoding/shape::large-base64-like-literal

- id: vscode-startup-hardcoded-post-beacon
  desc: VS Code startup extension POSTs beacon to hardcoded host
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002
  scope: archive
  unless:
  - id: well-known/tool/development/vscode-extension/auto-retry-agent::disclosed-summary-backend
  - id: well-known/tool/development/vscode-extension/auto-retry-agent::auto-retry-package-identity
  all:
  - id: metadata/permission/activation::on-startup-finished
  - id: micro-behaviors/communications/http/client/reference::vscode-extension-source-hardcoded-post
    # Version/publisher telemetry to a collector is not host profiling. Require
    # at least one forbidden identity field the editor's own telemetry omits.
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  - id: well-known/lib/development/vscode::machine-id
  needs: 1
- id: vscode-git-ci-identity-http-exfil
  desc: VS Code extension POSTs git remotes and CI project identity
  crit: hostile
  conf: 0.98
  attack: "T1041,T1082,T1195.002"
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/fs/path/secret-config::git-repository-config-file
  - id: micro-behaviors/os/env/cicd/pipeline::node-multi-ci-project-identity
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  any:
  - id: micro-behaviors/fs/path/config/git::git-repository-head-path
  - id: well-known/lib/development/vscode::machine-id
  - id: micro-behaviors/communications/http/user-agent::vscode-ext-metrics-user-agent
  unless:
  - id: metadata/build/ci/github-actions::actions-sdk

- id: vscode-metrics-ua-host-beacon
  desc: VS Code extension beacons hostname with vscode-ext-metrics User-Agent
  crit: suspicious
  conf: 0.96
  attack: "T1041,T1082,T1195.002"
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/communications/http/user-agent::vscode-ext-metrics-user-agent
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  any:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
