defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082

composite_rules:
  - id: npm-install-oob-object-profile-query
    desc: npm lifecycle ships OOB host-profile query
    scope: package
    all:
      - id: objectives/exfiltration/http/query::node-oob-object-profile-query-exfil
    any:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::has-install-script
