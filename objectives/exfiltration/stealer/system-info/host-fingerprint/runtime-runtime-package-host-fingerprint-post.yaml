defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1082
  mbc: E1041

composite_rules:
  - id: runtime-package-host-fingerprint-post
    desc: Runtime package posts a hashed host fingerprint
    crit: suspicious
    conf: 0.92
    scope: file
    near_bytes: 12000
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/crypto/hash/digest/sha2::node-createhash-sha256-call
      - id: micro-behaviors/os/sysinfo/platform/host::host-platform-arch-text-sequence
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/data/serialize/json::json-stringify-package-named-argument
