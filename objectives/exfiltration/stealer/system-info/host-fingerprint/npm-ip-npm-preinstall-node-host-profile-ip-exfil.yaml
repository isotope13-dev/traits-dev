defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
composite_rules:
  - id: npm-preinstall-node-host-profile-ip-exfil
    desc: npm preinstall sends user and host profile to a raw IP
    crit: hostile
    conf: 0.99
    for: [package.json]
    attack: "T1195.002,T1041,T1082,T1033"
    mbc: "E1041"
    near_bytes: 2000
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/communications/http/request/get::preinstall-node-http-get
      - id: micro-behaviors/os/env/read/variable::preinstall-user-env
      - id: micro-behaviors/fs/directory/cwd::preinstall-cwd-query
      - id: metadata/package/scripts/discovery::preinstall-hostname
      - id: micro-behaviors/communications/ip/ipv4::preinstall-external-ipv4-url
