defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: python-obfuscated-urlencode-recon-exfil
  desc: Obfuscated Python system recon exfiltration
  crit: hostile
  conf: 0.97
  attack: T1020
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: objectives/discovery/system/fingerprint/hardware::python-mac-discovery
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlencode
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/communications/url/encoded::python-base64-http-prefix
  any:
  - id: micro-behaviors/data/serialize/schema-system::urlencode-recon-params
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
- id: pypi-install-obfuscated-host-profile-exfil
  desc: PyPI install hook exfils host profile via decoded URL
  crit: hostile
  conf: 0.98
  attack: T1020
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: objectives/discovery/system/fingerprint/hardware::python-mac-discovery
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/communications/url/encoded::python-base64-http-prefix
  any:
  - id: micro-behaviors/data/serialize/schema-system::urlencode-recon-params
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-domains
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
- id: setup-py-ip-url-query-host-identity-exfil
  desc: setup.py exfiltrates user, hostname, and cwd to hardcoded IP URL
  crit: hostile
  conf: 0.98
  attack: T1020
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
  - id: micro-behaviors/communications/ip/literal::public-or-shared-ipv4-http-url
  - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
