  crit: hostile
  conf: 0.99
  attack: T1195.002,T1082,T1033,T1041
  scope: archive
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: objectives/exfiltration/stealer/system-info/host-fingerprint::pypi-setup-launches-version-script
  - id: objectives/exfiltration/stealer/system-info/host-fingerprint::pypi-version-script-system-profile-raw-ip-exfil
- id: pypi-ttensorflow-adjacent-version-script-execution
