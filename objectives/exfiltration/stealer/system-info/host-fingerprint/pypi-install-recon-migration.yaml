defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
traits:
- id: pypi-setup-base64-system-profile-to-raw-ip
  desc: setup.py encodes a host profile and sends it to a raw IP address
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1082,T1033,T1041
  if:
    type: text
    regex: '(?s)8\.8\.8\.8.{0,300}socket\.socket\(socket\.AF_INET,\s*socket\.SOCK_DGRAM\).{0,500}os\.getlogin\(\).{0,300}platform\.node\(\).{0,300}platform\.uname\(\).{0,300}os\.getcwd\(\).{0,300}base64\.b64encode.{0,300}requests\.get\s*\([^)]{0,80}http://[0-9.]+/v/%s'
- id: pypi-setup-launches-version-script
  desc: setup.py runs an adjacent version script while building metadata
  crit: suspicious
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: '(?s)def\s+read_version\s*\(.{0,1200}subprocess\.Popen\s*\(\[\s*sys\.executable\s*,\s*ver.{0,500}version\s*=\s*read_version\s*\('
- id: pypi-version-script-system-profile-raw-ip-exfil
  desc: Adjacent version script encodes a host profile for a raw-IP GET
  crit: hostile
  conf: 0.99
  for: [python, source, scripts, text]
  if:
    type: text
    regex: '(?s)8\.8\.8\.8.{0,300}os\.getlogin\(\).{0,300}platform\.node\(\).{0,300}platform\.uname\(\).{0,300}os\.getcwd\(\).{0,500}base64\.b64encode.{0,300}requests\.get.{0,100}http://[0-9.]+/v/%s'
- id: pypi-ttensorflow-setup-executes-version-script
  desc: TensorFlow typosquat executes an adjacent script to compute package version
  crit: hostile
  conf: 0.99
  for: [python]
  if:
    type: text
    regex: '(?s)def\s+read_version.{0,1000}subprocess\.Popen\s*\(\[\s*sys\.executable\s*,\s*ver.{0,700}name\s*=\s*.{0,12}ttensorflow-gpu.{0,100}version\s*=\s*read_version'
composite_rules:
- id: pypi-setup-runs-host-profile-version-script
