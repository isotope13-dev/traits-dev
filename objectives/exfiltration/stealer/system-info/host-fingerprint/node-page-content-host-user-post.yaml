defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1082,T1041
composite_rules:
  - id: node-host-user-page-content-post
    desc: Posts host and user profile in page-content payload
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/communications/http/request/json::fetch-direct-json-post-body
      - id: micro-behaviors/communications/http/request/client::module-execution-http-call
      - id: micro-behaviors/data/format/json::page-content-payload-field
