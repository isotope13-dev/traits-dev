defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1041,T1082

traits:
  - id: node-profile-base64-host
    desc: Decodes callback hostname from base64
    crit: notable
    if:
      type: text
      regex: '_target\s*=\s*Buffer\.from\(["''][A-Za-z0-9+/=]{24,160}["''],\s*["'']base64["'']'
  - id: node-profile-workdir-name
    desc: Collects working directory name
    crit: notable
    if:
      type: text
      substr: 'process.cwd().split('
  - id: node-profile-host-user-path
    desc: Combines host and username for callback
    crit: notable
    if:
      type: text
      regex: 'hostname\(\)\}[_-]\$\{_os\.userInfo\(\)\.username\}'
  - id: node-profile-https-path-get
    desc: Sends profile in HTTPS path
    crit: notable
    if:
      type: text
      regex: '(?s)_https\.get\(\s*\{.{0,100}hostname:\s*_target.{0,100}path:\s*["'']/["'']\s*\+\s*_data'
  - id: node-profile-delay-one-minute
    desc: Delays callback one minute
    crit: notable
    if:
      type: text
      regex: '(?s)setTimeout\(\(\)\s*=>.{0,1000}\},\s*60000\)'

composite_rules:
  - id: node-delayed-encoded-host-profile-callback
    desc: Sends host profile to encoded callback
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: node-profile-base64-host
      - id: node-profile-workdir-name
      - id: node-profile-host-user-path
      - id: node-profile-https-path-get
      - id: node-profile-delay-one-minute
