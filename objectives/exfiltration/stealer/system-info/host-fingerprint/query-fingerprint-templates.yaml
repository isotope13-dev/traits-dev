  platforms: [windows]
  attack: T1041
composite_rules:
  - id: stacked-host-fingerprint-c2-templates
    desc: Multiple stacked host fingerprint C2 templates
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/query/profile::pin-mac-query-exfil-template
      - id: micro-behaviors/communications/url/query/profile::numbered-query-fingerprint-template
