# Importing this package reads machine identity and user paths, then places the
# values in a URL query sent to a hardcoded raw-IP endpoint.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-import-host-profile-raw-ip-exfil
  desc: Import sends host profile to raw IP
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1082,T1041
  scope: archive
  for: [python, python_sdist, whl, zip, tar]
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/communications/url/construction/query::query-serializer-call
  - id: micro-behaviors/communications/ip/literal::public-or-shared-ipv4-http-url
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
  - id: micro-behaviors/fs/path/user-directory::python-expanduser-tilde
