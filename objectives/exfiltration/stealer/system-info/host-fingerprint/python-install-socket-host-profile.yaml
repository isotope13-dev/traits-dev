defaults:
  platforms: [unix]
  for: [python]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
- id: python-install-socket-host-profile-exfil
  desc: Install hook sends host and uptime details over raw TCP
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/socket/connect/attempt::python-created-socket-connect
  - id: micro-behaviors/communications/socket/send/message::python-local-socket-send
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/platform/kernel::python-uptime-check
  - id: micro-behaviors/os/sysinfo/profile::systeminfo-command-reference
