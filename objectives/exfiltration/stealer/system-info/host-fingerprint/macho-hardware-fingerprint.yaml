# macOS Credential Exfiltration
# macOS credential theft with network exfiltration
# ATT&CK: T1555 (Credentials from Password Stores) + T1041
defaults:
  platforms: [macos]
  attack: "T1041"
  for: [macho]

composite_rules:
  - id: fingerprint-with-exfil
    desc: macOS hardware identifiers and network APIs
    crit: suspicious
    conf: 0.8
    attack: "T1082"
    mbc: "B0001.009"
    all:
      - id: objectives/discovery/system/fingerprint/machine-id::hardware-fingerprint-macos
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-and-connect-syscalls
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect
      - id: micro-behaviors/communications/http/download/curl/
      - id: micro-behaviors/communications/http/client/reference::curl-fail-silent-url-reference
      - id: micro-behaviors/communications/http/client/curl::curl-easy-init
      - id: micro-behaviors/communications/http/client/curl::curl-easy-setopt
      - id: micro-behaviors/communications/http/client/curl::curl-easy-perform
      - id: micro-behaviors/communications/http/client/curl::curl-easy-perform-error-string
      - id: micro-behaviors/communications/http/client/curl::curl-easy-cleanup
      - id: micro-behaviors/communications/http/client/curl::curl-slist-append
      - id: micro-behaviors/communications/http/client/curl::curl-slist-free
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve
      - id: micro-behaviors/communications/http/curl/command::curl-silent-short-flag-url
      - id: micro-behaviors/communications/http/curl/command::curl-silent-long-flag-url
      - id: micro-behaviors/communications/http/curl/command::curl-silent-stdout
      - id: micro-behaviors/communications/http/curl/command::curl-command-url-or-option
      - id: micro-behaviors/communications/http/curl/command::curl-silent-fail-flags-text
      - id: micro-behaviors/communications/http/curl/command::curl-silent-or-fail
    unless:
      - id: metadata/signature/verified/platform::apple
