# Node.js / Electron loader reconnaissance exfiltration combining comprehensive
# OS/hardware profiling, installed antivirus enumeration, external GeoIP/IP
# discovery, and JSON check-in reporting over HTTP(S).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1082,T1518.001,T1016,T1041
  mbc: B0030

composite_rules:
  - id: node-host-av-geoip-fingerprint-exfil
    desc: Exfiltrates host, AV, and GeoIP fingerprint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-comprehensive-host-query-set
      - id: micro-behaviors/communications/http/ip-discovery::multi-ip-discovery
      - id: micro-behaviors/communications/http/request/route::status-checkin-route
      - id: micro-behaviors/communications/http/request/client::node-http-imported-request-stream
    any:
      - id: objectives/discovery/host/security::installed-security-product-survey
      - id: objectives/discovery/host/security::node-wmi-antivirus-enumeration
      - id: objectives/discovery/host/security::node-registry-antivirus-enumeration
  # Concealed device enrollment: a Node client that hides its imports with
  # ASCII escapes while executing system commands, harvests stable hardware
  # identifiers from several OS-specific sources, and enrolls the fingerprinted
  # device with a remote service over HTTP(S)/WebSocket with session binding
  # and periodic heartbeats. The concealment plus breadth of stable-identifier
  # collection plus enrollment transfer is the attack pattern; transparent
  # device management or single-source inventory does not reach this rule.
  - id: node-concealed-device-enrollment-exfil
    desc: Concealed hardware-fingerprint device enrollment
    crit: hostile
    conf: 0.97
    attack: T1082,T1041
    all:
      - id: micro-behaviors/os/sysinfo/hardware::js-multisource-hardware-identifier-collection
      - id: objectives/anti-static/obfuscation/imports/concealment::escaped-import-command-execution
    needs: 2
    any:
      - id: micro-behaviors/communications/http/request/route::device-register-path
      - id: micro-behaviors/communications/http/authorization-header::x-session-id-header-map-entry
      - id: micro-behaviors/communications/http/header/client::x-device-header-reference
      - id: micro-behaviors/communications/websocket/send::member-ws-send-call
      - id: micro-behaviors/time/schedule/interval::interval-call-text
      - id: micro-behaviors/communications/http/login::http-login-path
  # Proximity reduces accidental combinations across unrelated bundled code;
  # it does not establish that a fingerprint reaches a network destination.
  - id: node-device-enrollment-fingerprint-exfil
    desc: Hardware identifier and messaging or session indicators nearby
    crit: suspicious
    conf: 0.9
    near_bytes: 8192
    attack: T1082,T1041
    all:
      - id: micro-behaviors/os/sysinfo/hardware::js-multisource-hardware-identifier-collection
    needs: 2
    any:
      - id: micro-behaviors/communications/http/request/route::device-register-path
      - id: micro-behaviors/communications/http/authorization-header::x-session-id-header-map-entry
      - id: micro-behaviors/communications/http/header/client::x-device-header-reference
      - id: micro-behaviors/communications/websocket/send::member-ws-send-call
      - id: micro-behaviors/time/schedule/interval::interval-call-text
      - id: micro-behaviors/communications/http/login::http-login-path
