# Node.js / Electron loader reconnaissance exfiltration combining comprehensive
# OS/hardware profiling, installed antivirus enumeration, external GeoIP/IP
# discovery, and JSON check-in reporting over HTTP(S).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1082,T1518.001,T1016,T1041
  mbc: B0030

composite_rules:
  - id: node-host-av-geoip-fingerprint-exfil
    desc: Exfiltrates host, AV, and GeoIP fingerprint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-comprehensive-host-query-set
      - id: micro-behaviors/communications/http/ip-discovery::multi-ip-discovery
      - id: micro-behaviors/communications/http/request/route::status-checkin-route
      - id: micro-behaviors/communications/http/request/client::node-http-imported-request-stream
    any:
      - id: objectives/discovery/host/security::installed-security-product-survey
      - id: objectives/discovery/host/security::node-wmi-antivirus-enumeration
      - id: objectives/discovery/host/security::node-registry-antivirus-enumeration
