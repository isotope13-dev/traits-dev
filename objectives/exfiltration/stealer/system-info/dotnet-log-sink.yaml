defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, nupkg]
  crit: hostile
  conf: 0.99
  attack: T1082,T1041,T1552.001

composite_rules:
  - id: dotnet-environment-inventory-default-remote-sink
    desc: Environment inventory flows to default remote sink
    scope: archive
    all:
      - id: micro-behaviors/os/env/read::getenv-profiling-api
      - id: micro-behaviors/os/env/read::dotnet-environment-variable-log-template
      - id: micro-behaviors/communications/http/log-sink::dotnet-hardcoded-default-log-endpoint
      - id: micro-behaviors/communications/http/log-sink::dotnet-embedded-default-api-key

  - id: dotnet-startup-network-profile-remote-sink
    desc: Startup service sends discovered network profile
    scope: archive
    all:
      - id: micro-behaviors/process/daemonize/service-path::dotnet-hosted-startup-service
      - id: micro-behaviors/os/network/interface::dotnet-get-all-interfaces
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/log-sink::dotnet-hardcoded-default-log-endpoint

  - id: dotnet-default-authenticated-log-exfil-sink
    desc: Application logs default to embedded remote collector
    scope: archive
    all:
      - id: micro-behaviors/communications/http/log-sink::dotnet-http-log-entry-sender
      - id: micro-behaviors/communications/http/log-sink::dotnet-hardcoded-default-log-endpoint
      - id: micro-behaviors/communications/http/log-sink::dotnet-embedded-default-api-key
