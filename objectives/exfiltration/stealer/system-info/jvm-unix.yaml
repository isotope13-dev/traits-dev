defaults:
  platforms: [unix]
  for: [java, kotlin, class, java_class, jar]
  attack: T1041

traits:
  - id: jvm-exfil-base64-marker
    desc: JVM exfil base64 marker
    crit: suspicious
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: 'EXFIL:[\s\S]{0,120}Base64\.getEncoder'

composite_rules:
  - id: jvm-base64-profile-http-exfil
    desc: JVM profile HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::jvm-profile-temp-files
      - id: jvm-exfil-base64-marker
      - id: objectives/exfiltration/http/collect::jvm-collect-octet-post

  - id: jvm-solaris-profile-http-exfil
    desc: JVM Solaris profile exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::jvm-solaris-profile-headers
      - id: objectives/exfiltration/http/collect::jvm-collect-octet-post

  - id: jvm-bytecode-profile-http-exfil
    desc: JVM bytecode profile exfil
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: objectives/discovery/system/profile::jvm-profile-temp-files-bytes
      - id: micro-behaviors/communications/email/mime::mime-octet-stream
      - id: objectives/command-and-control/backdoor/tasking/socket::rust-exfil-command-token

  - id: jvm-bytecode-solaris-profile-exfil
    desc: JVM bytecode Solaris profile exfil
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: objectives/discovery/system/profile::jvm-solaris-profile-bytes
      - id: micro-behaviors/communications/email/mime::mime-octet-stream

  - id: jvm-form-host-profile-exfil
    desc: JVM form host profile exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::jvm-form-host-profile
      - id: objectives/exfiltration/http/collect::jvm-exfil-endpoint-post

  - id: jvm-process-profile-exfil
    desc: JVM process profile exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/profile::jvm-form-profile-field-names
      - id: objectives/discovery/system/profile::jvm-process-profile-field
      - id: objectives/exfiltration/http/collect::jvm-exfil-endpoint-post

  - id: jvm-bytecode-form-profile-exfil
    desc: JVM bytecode form profile exfil
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: objectives/exfiltration/http/collect::jvm-exfil-path-bytecode
      - id: objectives/discovery/system/profile::jvm-env-host-profile-bytes
