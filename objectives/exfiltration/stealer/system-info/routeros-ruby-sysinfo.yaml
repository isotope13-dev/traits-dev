defaults:
  platforms: [routeros, appliance, unix]
  for: [ruby]
  attack: T1041

composite_rules:
  - id: ruby-routeros-sysinfo-exfil
    desc: Ruby RouterOS sysinfo exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/fingerprint/info::ruby-routeros-sysinfo-commands
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/http/url/api-path::ruby-sysinfo-path
