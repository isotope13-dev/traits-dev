# Host-profile exfiltration, with package lifecycle as referenced context.

defaults:
  platforms: [unix, windows]
  mbc: E1041

composite_rules:
  - id: npm-postinstall-host-profile-exfiltration
    desc: NPM postinstall exfiltrates host and CI profile
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-node-script-suppressed
      - id: objectives/discovery/system/profile::js-host-profile-query-set
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call

  - id: npm-postinstall-host-profile-beacon
    desc: Suppressed npm postinstall sends host profile
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1082,T1041"
    for: [package.json, javascript, npm]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::postinstall-node-script-suppressed
      - id: objectives/discovery/system/profile::js-host-profile-query-set
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script

  - id: js-public-ip-beacon
    desc: npm install hook POSTs public IP to a literal IPv4 endpoint
    crit: hostile
    conf: 0.96
    attack: T1041
    scope: archive
    for: [binaries, '!dex', scripts, '!jcl', manifests, '!desktop-entry', '!systemd-service', json, npm, rust, tar, text, zip]
    all:
      - id: objectives/exfiltration/http/report::js-public-ip-literal-post
    any:
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
    unless:
      - id: metadata/package/testing/harness/runtime/
