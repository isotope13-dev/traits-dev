# Laravel package host profiling and remote control.
#
# A license client may contact a service, but a package that hashes a broad
# server profile, sends that profile during activation, and separately gates
# every web request on remote validation has a materially different risk shape
# from an ordinary HTTP client.  Keep the individual observations precise so
# this conclusion requires the complete package behavior.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1005,T1041
  mbc: B0010,E1041

traits:
  - id: php-laravel-host-profile-activation-payload
    desc: Laravel activation POST carries host metadata
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: "->post\\s*\\([\\s\\S]{0,900}['\"]device_hash['\"][\\s\\S]{0,700}['\"]metadata['\"]"

composite_rules:
  - id: php-laravel-host-profile-remote-registration
    desc: Laravel package remotely registers host profile
    crit: hostile
    conf: 0.98
    attack: T1005,T1041,T1195.002
    for: [archives]
    scope: archive
    all:
      - id: objectives/discovery/system/fingerprint/info::system-fingerprint-comp
      - id: micro-behaviors/communications/http/client/library::php-laravel-http-facade-post
      - id: php-laravel-host-profile-activation-payload
