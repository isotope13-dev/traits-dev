defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  - id: php-webshell-json-environment-output
    desc: PHP webshell outputs the process environment as JSON
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1505.003
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-command-webshell
      - id: micro-behaviors/os/env/output::php-echo-json-environment
