# A YARD build-registry override plus a bound hostname/path form exporter
# identifies the documentation-build survey. No campaign name or destination
# is required. The neutral body-flow atom alone remains telemetry capability.
defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  # Both atoms emit the actual POST site. Equal offsets require the same call
  # to carry the host profile/source path and use the OOB collector URI.
  - id: ruby-hostname-source-path-webhook-post
    desc: Exports hostname and script path to webhook.site
    crit: hostile
    conf: 0.98
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/request/body/environment::ruby-json-hostname-path-form-post
      - id: micro-behaviors/communications/http/request/oob::ruby-form-post-webhook-destination

  - id: ruby-source-stamp-host-profile-post
    desc: Source execution stamp accompanies hostname/path POST
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/transform::ruby-source-runtime-stamp
      - id: micro-behaviors/communications/http/request/body/environment::ruby-json-hostname-path-form-post

  - id: yard-build-workspace-profile-export
    desc: YARD build override accompanies hostname/path export
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/body/environment::ruby-json-hostname-path-form-post
      - id: micro-behaviors/data/config/write::ruby-yard-registry-path-assignment
      - id: micro-behaviors/fs/path/config/app::yard-options-file-path
      - id: micro-behaviors/fs/path/self::ruby-expand-file-path
