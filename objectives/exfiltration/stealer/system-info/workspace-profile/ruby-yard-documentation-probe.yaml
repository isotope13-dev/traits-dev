# A documentation build option loads a Ruby script that alters its shipped
# source and sends build-host context to an external endpoint.
defaults:
  platforms: [unix, windows]

traits:
  - id: yard-options-loads-script
    desc: YARD options load a Ruby script
    crit: suspicious
    conf: 0.93
    for: [ruby]
    if:
      type: text
      regex: '(?m)^\s*--load\s+.{1,120}'

  - id: build-script-rewrites-sibling-source
    desc: Build script reads and writes source code
    crit: notable
    conf: 0.90
    for: [ruby]
    if:
      type: text
      regex: 'File\.read[\s\S]{0,300}__FILE__[\s\S]{0,300}File\.write'

  - id: build-reads-host-identifiers
    desc: Build script reads host identifiers
    crit: notable
    conf: 0.96
    for: [ruby]
    if:
      type: text
      regex: '(hostname|Process\.uid|RUBY_VERSION)'

  - id: build-http-post
    desc: Build script posts with Ruby HTTP
    crit: notable
    conf: 0.96
    for: [ruby]
    if:
      type: text
      regex: 'Net::HTTP\.(post_form|Post)'

composite_rules:
  - id: build-host-context-to-http-post
    desc: Build script posts host data and source path
    crit: hostile
    conf: 0.96
    all:
      - id: build-reads-host-identifiers
      - id: build-http-post
      - id: micro-behaviors/fs/path/self::ruby-expand-file-path

  - id: ruby-documentation-build-recon-exfil
    desc: Documentation build loads a source-changing host-information beacon
    crit: hostile
    conf: 0.97
    all:
      - id: yard-options-loads-script
      - id: build-script-rewrites-sibling-source
      - id: build-host-context-to-http-post
