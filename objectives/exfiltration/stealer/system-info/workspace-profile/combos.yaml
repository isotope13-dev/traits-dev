defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"

composite_rules:
  # A credential-bearing environment value is serialized into a native Node
  # request body and sent to a public callback collector. This models the data
  # path rather than a Twilio-only name: ACCOUNT_SID/AUTH_TOKEN is one instance,
  # while future packages can substitute any token, secret, key, or password.
- id: npm-install-profile-near-raw-ip-http-get
  desc: Npm install host-profile references near an HTTP GET to a raw IP
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  scope: file
  near_bytes: 900
  attack: T1195.002,T1041,T1082
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: metadata/import/builtin::require-http
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/os/env/package-manager::npm-package-name-process-env-read
  - id: micro-behaviors/os/env/package-manager::npm-config-registry-env-access
