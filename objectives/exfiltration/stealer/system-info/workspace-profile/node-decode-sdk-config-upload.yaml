defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1041
traits:
- id: node-decode-sdk-encoded-env
  desc: Encodes environment file name
  crit: notable
  if:
    type: text
    substr: LmVudg==
- id: node-decode-sdk-encoded-config
  desc: Encodes configuration file name
  crit: notable
  if:
    type: text
    substr: Y29uZmlnLnRvbWw=
- id: node-decode-sdk-authorization-export
  desc: Exports decode SDK authorization function
  crit: notable
  if:
    type: text
    substr: authrizeClob
- id: node-decode-sdk-upload-fields
  desc: Packages file and user identity for upload
  crit: suspicious
  if:
    type: text
    substr: content:f,filename:u,user:c,ip:a
composite_rules:
- id: node-decode-sdk-config-upload
  desc: Uploads environment and configuration files
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/encoding/base64::node-base64-sdk-endpoint-literal
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-decode-sdk-encoded-env
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-decode-sdk-encoded-config
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-decode-sdk-authorization-export
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-decode-sdk-upload-fields
  - id: micro-behaviors/communications/http/post::request-options-post-method
