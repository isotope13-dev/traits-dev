defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1005,T1041,T1083
traits:
- id: node-ecto-sensitive-source
  desc: Targets local credential or environment data
  crit: notable
  if:
    type: text
    regex: /proc/1/environ|/root/\.npmrc|/var/run/secrets/kubernetes\.io/serviceaccount/token
- id: node-ecto-report-call
  desc: Reports collected variable to module
  crit: notable
  if:
    type: text
    regex: await\s+report\(\s*['"][^'"]{1,128}['"]\s*,\s*[A-Za-z_$][\w$]*\s*\)
- id: node-ecto-manifest-cargo
  desc: Stores collected data in manifest cargo
  crit: notable
  if:
    type: text
    substr: 'cargo_hold:'
- id: node-ecto-put-report
  desc: Uploads manifest with HTTP PUT
  crit: notable
  if:
    type: text
    substr: 'path: `/api/modules/${moduleId}`, method: ''PUT'''
- id: node-ecto-report-write
  desc: Writes report body to request
  crit: notable
  if:
    type: text
    substr: req.write(body)
- id: node-ecto-local-read
  desc: Reads local file for collection
  crit: notable
  if:
    type: text
    substr: fs.readFileSync(
composite_rules:
- id: node-ecto-manifest-file-recon
  desc: Uploads local reconnaissance in manifest
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-ecto-sensitive-source
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-ecto-report-call
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-ecto-manifest-cargo
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-ecto-put-report
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-ecto-report-write
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-ecto-local-read
