defaults:
  platforms: [windows, linux]
  for: [javascript, typescript, tar, zip]
  attack: T1195.002,T1041,T1082,T1552.005
  mbc: E1041

composite_rules:
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::npm-skeleton-install-profile-http-get-beacon
    desc: Hollow npm package GET beacons install context
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1082"
    for: [npm, tar, zip, javascript, package.json]
    scope: archive
    all:
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
      - id: objectives/exfiltration/stealer/system-info/workspace-profile::js-npm-install-profile-http-get-exfil
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::npm-inflated-depconf-entry-http-install-beacon
    desc: Inflated depconf npm entry script GET beacons install context
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1082"
    for: [npm, tar, zip, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
      - id: objectives/exfiltration/stealer/system-info/workspace-profile::js-npm-install-profile-http-get-exfil
