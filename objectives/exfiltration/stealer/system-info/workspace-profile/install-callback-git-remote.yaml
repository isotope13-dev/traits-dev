defaults:
  platforms: ["unix", "windows"]
  for: ["ruby"]

composite_rules:
  - id: extconf-git-remote-callback
    mbc: E1041
    attack: T1195.002,T1082,T1041
    desc: Gem build recipe reads git remote and calls out
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/revision-control/git/read::git-remote-url-capture
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
    # A recipe that genuinely compiles an extension may shell out to git for a
    # submodule or version stamp; those call mkmf/create_makefile.
    unless:
      - id: metadata/build/package/recipe/gemspec::extconf-native-build-helper
