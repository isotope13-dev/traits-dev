defaults:
  platforms: [unix, windows]
  crit: hostile
  for: [javascript, typescript]
composite_rules:
  - id: npm-postinstall-github-contents-ci-snapshot
    desc: npm postinstall commits CI host snapshot via GitHub API
    conf: 0.98
    attack: "T1195.002,T1041,T1082"
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    near_bytes: 12000
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/env/cicd/runner::process-env-ci
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-github-workspace
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-github-repository
      - id: micro-behaviors/os/env/vcs::node-github-token-member
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/communications/url/resource-path/file::node-repository-contents-path-template
      - id: micro-behaviors/communications/http/request/verb::node-fetch-repo-contents-put
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: metadata/build/ci/github-actions::actions-sdk
