defaults:
  platforms: [unix, windows]
  for: [jar]
  attack: T1041

composite_rules:
  - for:
    - jar
    - pe
    - scripts
    - source
    - package.json
    id: build-oob-pingback
    desc: Build-time OOB beacon callback
    crit: hostile
    conf: 0.998
    all:
    - id: micro-behaviors/process/lifecycle/auto-exec::auto-loaded-annotation-processor
    - id: micro-behaviors/process/lifecycle/initialize::build-static-init-name-clues
    - id: micro-behaviors/process/lifecycle/initialize::build-classload-delay
    - id: micro-behaviors/communications/http/request/report::build-reporting-name-clues
    - id: micro-behaviors/communications/http/lib/urlconnection::build-google-endpoint-probe-context
    - id: micro-behaviors/communications/url/query/endpoint::build-callback-query-fields
    - id: micro-behaviors/communications/url/host/oob/endpoint::pipedream
  - for:
    - jar
    - pe
    - scripts
    - source
    - package.json
    id: java-build-recon-exfil
    desc: Java build processor recon exfiltration
    crit: hostile
    conf: 0.995
    all:
    - id: micro-behaviors/process/lifecycle/auto-exec::auto-loaded-annotation-processor
    - id: micro-behaviors/process/lifecycle/initialize::build-static-init-name-clues
    - id: micro-behaviors/communications/http/lib/urlconnection::build-google-endpoint-probe-context
    - id: micro-behaviors/communications/url/query/endpoint::build-callback-query-fields
    - id: micro-behaviors/communications/url/host/oob/endpoint::pipedream
