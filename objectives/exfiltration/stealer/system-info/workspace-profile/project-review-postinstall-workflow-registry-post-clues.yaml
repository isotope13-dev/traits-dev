defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: postinstall-workflow-registry-post-clues
    for: [npm, package.json, javascript, typescript]
    desc: Postinstall has workflow write and registry POST clues
    crit: suspicious
    conf: 0.98
    attack: "T1195.002,T1041"
    mbc: E1041
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/fs/write/file/target::node-writes-github-config-path
      - id: micro-behaviors/communications/http/url/api-path/route::package-registry-api-path-text
      - id: micro-behaviors/communications/http/curl/body::curl-post-flag
