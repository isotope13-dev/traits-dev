defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: node-workspace-profile-exfiltration
  desc: CLI sends a marker-matched workspace profile to an HTTP endpoint
  crit: hostile
  conf: 0.98
  attack: T1041,T1005
  all:
  - id: micro-behaviors/communications/http/post::node-marker-gated-post
  - id: micro-behaviors/fs/read/file/full::node-feature-gated-file-read
  - id: micro-behaviors/communications/http/post::node-http-request-post
