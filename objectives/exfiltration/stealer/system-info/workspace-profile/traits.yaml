defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-workspace-profile-marker-gated-post
    desc: Profile marker check precedes POST
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)trackingId\s*!==\s*EXPECTED_MARKER.{0,900}method\s*:\s*[\x27"]POST[\x27"]'
  - id: node-workflow-sync-feature-gate
    desc: Workflow sync gates local profile read
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)WORKFLOW_SYNC_ENABLED\s*!==\s*[\x27"]1[\x27"].{0,300}readFileSync\s*\('
composite_rules:
  - id: node-workspace-profile-exfiltration
    desc: CLI sends a marker-matched workspace profile to an HTTP endpoint
    crit: hostile
    conf: 0.98
    attack: T1041,T1005
    all:
      - id: node-workspace-profile-marker-gated-post
      - id: node-workflow-sync-feature-gate
      - id: micro-behaviors/communications/http/post::node-http-request-post
