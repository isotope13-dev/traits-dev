defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1041
traits:
- id: json-javascript-env-serialization
  desc: JSON-named file serializes process environment
  crit: notable
  for: [json]
  if:
    type: text
    regex: '(?s)JSON\.stringify\s*\([^;]{0,300}?\bprocess\.env\b'
- id: json-javascript-webhook-reference
  desc: JSON-named file references webhook service
  crit: notable
  for: [json]
  if:
    type: text
    regex: 'webhook\.site/[a-zA-Z0-9-]{8,64}'
- id: json-javascript-https-request-write
  desc: JSON-named file writes HTTPS request body
  crit: notable
  for: [json]
  if:
    type: text
    regex: '(?s)https\.request\s*\(.{0,400}req\.write\s*\('
- id: json-misnamed-db-webhook
  desc: Contains database template webhook endpoint
  crit: suspicious
  if:
    type: text
    substr: webhook.site/84049d01-f0ad-474b-b34a-062da4dc7281
- id: json-misnamed-https-request
  desc: Constructs HTTPS request to webhook
  crit: notable
  if:
    type: text
    substr: https.request(webhook
composite_rules:
- id: json-javascript-environment-webhook-post
  desc: JSON-named JavaScript posts environment to webhook
  crit: hostile
  conf: 0.98
  for: [json]
  all:
  - id: objectives/evasion/masquerade/config-insert::json-file-holds-js-declaration
  - id: json-javascript-env-serialization
  - id: json-javascript-webhook-reference
  - id: json-javascript-https-request-write
- id: json-misnamed-db-env-upload-attempt
  desc: Stages environment upload as misnamed JSON file
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::json-misnamed-db-webhook
  - id: micro-behaviors/os/env/enumerate/entries::node-process-env-object-field
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::json-misnamed-https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-request-write-variable
