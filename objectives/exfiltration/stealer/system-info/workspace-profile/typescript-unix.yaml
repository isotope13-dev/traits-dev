defaults:
  platforms: [unix, appliance]
  for: [typescript, javascript]
  attack: T1041

composite_rules:
- id: js-npm-install-profile-http-get-exfil
  desc: Npm installation context appears near an HTTP GET
  crit: suspicious
  conf: 0.98
  mbc: E1041
  near_bytes: 2500
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/os/env/package-manager::npm-install-profile-javascript-env-pair
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  any:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: metadata/import/builtin::require-http
