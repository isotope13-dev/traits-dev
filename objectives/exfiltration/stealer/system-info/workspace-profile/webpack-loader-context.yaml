defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1041,T1195.002,T1592.004"
  mbc: E1041

composite_rules:
- id: npm-loader-context-http-beacon
  desc: npm loader reports build context over HTTP
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/os/sysinfo/report::loader-context-report-fields
  - id: metadata/import/builtin::require-http
  - id: micro-behaviors/communications/http/request/dynamic::node-http-module-get-url-call
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
