defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

  mbc: E1041
  attack: T1041
composite_rules:
- id: npm-install-container-recon-exfil
  desc: Install hook exfils container recon
  crit: hostile
  conf: 0.995
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/webhook::webhook-get-type-data
  - id: micro-behaviors/fs/path/application/prefix::usr-src-app-target
  any:
  - id: micro-behaviors/fs/search/command::target-dir-file-inventory
  - id: micro-behaviors/fs/search/name::dockerfile-hunt-root
  - id: metadata/lang/source/naming/target::typed-recon-callback-labels
- id: js-container-recon-exfil
  for:
  - javascript
  desc: JS exfils container recon
  crit: hostile
  conf: 0.995
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/fs/search/name::dockerfile-hunt-root
  - id: metadata/lang/source/naming/target::typed-recon-callback-labels
  any:
  - id: micro-behaviors/fs/path/application/prefix::usr-src-app-target
  - id: micro-behaviors/fs/search/name::flag-file-hunt
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
