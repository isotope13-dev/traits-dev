defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1082
traits:
- id: node-identitymaxx-domain-parts
  desc: Reassembles destination from endpoint path
  crit: suspicious
  if:
    type: text
    substr: path[1] + path[2] + '.' + path[5]
- id: node-identitymaxx-hex-principal
  desc: Encodes user principal in hostname
  crit: notable
  if:
    type: text
    substr: '`${userHex}.${domain}`'
- id: node-identitymaxx-principal-construction
  desc: Constructs user principal from user and hostname
  crit: notable
  if:
    type: text
    substr: '`${username}@${hostname}.com`'
- id: node-identitymaxx-verification-test
  desc: Collects identity in verification test
  crit: notable
  if:
    type: text
    substr: const raw = collectIdentity()
composite_rules:
- id: npm-identitymaxx-test-identity-beacon
  desc: Sends collected identity to disguised verification host
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - npm
  - tar
  - zip
  - javascript
  all:
  - id: micro-behaviors/communications/url/host/domain-http::identitymaxx-verification-endpoint
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-identitymaxx-domain-parts
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-identitymaxx-hex-principal
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-identitymaxx-principal-construction
  - id: objectives/exfiltration/stealer/system-info/workspace-profile::node-identitymaxx-verification-test
