defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: hostile
  attack: T1552.001,T1041

composite_rules:
  - id: python-host-profile-urllib-exfil
    desc: Python sends host profile in urllib POST
    conf: 0.98
    near_lines: 60
    all:
      - id: objectives/discovery/system/fingerprint/hardware::python-sysinfo-multi
      - id: objectives/exfiltration/oob/system-profile::python-platform-profile-fields
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
