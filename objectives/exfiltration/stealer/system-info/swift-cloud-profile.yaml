defaults:
  platforms: [windows, unix]
  for: [swift]
  attack: T1041

traits:
  - id: swift-exfil-source-host-field
    desc: Swift exfil source host field
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: source_host

composite_rules:
  - id: swift-host-profile-http-exfil
    desc: Swift host profile HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/stealer/cloud::swift-cloud-credential-http-exfil
      - id: objectives/discovery/system/profile::swift-host-identity-fields
      - id: objectives/discovery/system/profile::swift-system-profile-fields
      - id: swift-exfil-source-host-field
