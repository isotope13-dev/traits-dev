defaults:
  platforms: [windows]
  for: [batch, powershell, shell, binaries]
  attack: T1082,T1041
traits:
composite_rules:
- id: windows-basic-recon-cluster
  desc: Windows network/system recon command cluster
  crit: notable
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/os/network/status::netstat
  - id: micro-behaviors/process/enumerate/shell::tasklist
  - id: micro-behaviors/process/user/query::windows-whoami-command
  - id: micro-behaviors/os/sysinfo/process::windows-systeminfo-command
  unless:
  - id: well-known/app/storage/peazip::peazip-main-executable
- id: windows-recon-http-exfil
  for: [batch, powershell]
  desc: Windows host reconnaissance sent to external HTTP
  crit: hostile
  conf: 0.98
  all:
  - id: windows-basic-recon-cluster
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
- id: windows-domain-recon-http-exfil
  for: [batch, powershell]
  desc: Windows domain reconnaissance sent to external HTTP
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/discovery/system/domain-admin-prep::nltest-dclist
  - id: objectives/discovery/system/domain-admin-prep::ipconfig-all
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
- id: windows-recon-paste-exfil
  desc: Windows recon uploaded to paste service
  crit: hostile
  conf: 0.97
  all:
  - id: windows-basic-recon-cluster
  - id: windows-recon-output-file
  - id: objectives/exfiltration/oob/tunnel
  - id: objectives/command-and-control/infrastructure/paste
- id: windows-recon-output-file
  desc: Windows recon command output marker
  crit: component
  conf: 0.86
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/process::systeminfo-token
  - id: micro-behaviors/process/enumerate/shell::tasklist
  - id: micro-behaviors/os/network/status::netstat
  - id: micro-behaviors/process/user/query::windows-whoami-command
  - id: micro-behaviors/os/env/user-paths::temp-var
