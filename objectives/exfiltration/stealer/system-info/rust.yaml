# Rust host-profile reporter.
#
# A Rust program that shells out for the account name and machine name, looks
# up its public IP at a third-party echo service, and holds a baked-in Telegram
# bot token plus a fixed chat id is a victim reporter: the destination inbox is
# the author's, not the user's, and the three collected fields exist only to
# identify the host running the code.
#
# Each leg alone is legitimate (cluster tooling logs hostnames; bots talk to
# the Bot API). The join is what convicts: profile fields + an operator-owned
# out-of-band inbox with no configuration path.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: rust-host-profile-telegram-exfil
    desc: Rust collects a host profile for a hardcoded Telegram bot
    crit: hostile
    conf: 0.97
    attack: T1041,T1082
    all:
      - id: objectives/exfiltration/messaging/telegram::telegram-hardcoded-bot-config
      - id: micro-behaviors/os/sysinfo/hostname::rust-command-hostname
      - id: micro-behaviors/process/user/query::rust-command-whoami
    any:
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/ip-discovery::ifconfig-me
