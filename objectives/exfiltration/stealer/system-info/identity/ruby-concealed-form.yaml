# Ordinary identity telemetry remains notable. Here the command output is in
# the POST form itself, its destination is decoded, and its errors are swallowed.
# All three observations emit the same call site; unrelated neighboring calls
# or rescue blocks cannot supply an export's missing role.
defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-silent-encoded-identity-post
    desc: Ruby silently POSTs identity to hidden endpoint
    crit: hostile
    conf: 0.97
    attack: T1041
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/request/body/command-output::ruby-form-post-identity-command
      - id: micro-behaviors/communications/http/request/encoded::ruby-form-post-base64-destination
      - id: micro-behaviors/data/control-flow/error-handling/suppress::ruby-form-post-empty-rescue
