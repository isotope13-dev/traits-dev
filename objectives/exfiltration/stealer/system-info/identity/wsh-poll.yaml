defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  - id: wsh-command-poller-identity-report
    desc: Remote-eval poller sends Windows logon identity
    crit: hostile
    conf: 0.99
    attack: T1041,T1033
    all:
      - id: objectives/command-and-control/remote-command/http-poll::wsh-timed-http-response-eval-loop
      - id: micro-behaviors/os/com/automation::wscript-network-progid
      - id: micro-behaviors/communications/http/request/report::script-client-send-user-domain
