defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: xor-host-profile-query
  desc: Host-user queries accompany XOR-encoded URL parameter construction
  crit: suspicious
  conf: 0.93
  attack: T1041,T1082,T1033,T1027
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: micro-behaviors/data/string/conversion::js-repeating-key-xor-character-reconstruction
  - id: micro-behaviors/communications/http/url/query::function-encoded-template-query-parameter
  - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
  - id: metadata/import/builtin::require-https
  - id: micro-behaviors/communications/http/request/dynamic::http-client-get-options
  - id: micro-behaviors/communications/http/url/scheme::http-url-literal
