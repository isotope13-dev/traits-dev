# System Information Exfiltration - Python
# Detects collection and exfiltration of system information
# MBC: E1082 (System Information Discovery) + T1041 (Exfiltration Over C2 Channel)
# ATT&CK: T1082, T1041
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: suspicious
  for: [python]
  mbc: "E1082+T1041"
  attack: "T1082+T1041"

composite_rules:
  # Upgini's hosted-notebook tracking path combines a remote browser
  # fingerprint result with a serialized tracking-metrics upload. Require
  # the explicit host profile as well so ordinary notebook fingerprinting
  # or SDK telemetry alone does not establish identity exfiltration.
  - id: python-notebook-host-identity-tracking-upload
    desc: Uploads host identity with a remote notebook fingerprint
    crit: hostile
    conf: 0.95
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/telemetry::python-host-profile-post-context
      - id: micro-behaviors/communications/http/telemetry::notebook-js-tracking-upload-context

  - id: python-system-info-exfil
    desc: "Exfiltration of system information (User, Host, OS)"
    crit: hostile
    conf: 0.95
    near_lines: 60
    all:
      - id: micro-behaviors/process/identity/query::python-current-username
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/data/encode/base64::base64-encoding
      - id: micro-behaviors/communications/http/request/client::request-python

  # Host/MAC/IP queries beside a POST have neutral coverage in
  # micro-behaviors/communications/http/telemetry::python-host-profile-post-context.
  # That co-occurrence alone does not establish an unauthorized transfer.

  # uuid.getnode() is interpolated into a URL and fetched while a decoded
  # archive is launched. The MAC is the machine id on the check-in.
  - id: python-mac-checkin-decoded-launch
    desc: MAC check-in rides a decoded launch
    crit: hostile
    conf: 0.97
    platforms: [windows]
    all:
      - id: micro-behaviors/os/sysinfo/network::python-uuid-getnode-call
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: objectives/execution/payload/file-exec::zone-cleared-decoded-zip-forfiles
