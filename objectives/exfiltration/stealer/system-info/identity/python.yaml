# System Information Exfiltration - Python
# Detects collection and exfiltration of system information
# MBC: E1082 (System Information Discovery) + T1041 (Exfiltration Over C2 Channel)
# ATT&CK: T1082, T1041
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: suspicious
  for: [python]
  mbc: "E1082+T1041"
  attack: "T1082+T1041"

composite_rules:
  - id: python-mac-checkin-decoded-launch
    desc: MAC check-in rides a decoded launch
    crit: hostile
    conf: 0.97
    platforms: [windows]
    all:
      - id: micro-behaviors/communications/http/get::python-node-id-url-to-get-helper
      - id: objectives/execution/payload/file-exec/detached::zone-cleared-decoded-zip-forfiles
