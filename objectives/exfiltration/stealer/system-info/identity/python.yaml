# System Information Exfiltration - Python
# Detects collection and exfiltration of system information
# MBC: E1082 (System Information Discovery) + T1041 (Exfiltration Over C2 Channel)
# ATT&CK: T1082, T1041
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: suspicious
  for: [python]
  mbc: "E1082+T1041"
  attack: "T1082+T1041"

traits:
  - id: python-remote-browser-visitor-id
    desc: Gets visitor ID from remote fingerprint code
    crit: notable
    conf: 0.96
    platforms: [unix, windows]
    if:
      type: text
      regex: 'FingerprintJS\.load\(\)[\s\S]{0,120}visitorId'

composite_rules:
  # A remote browser fingerprint is joined to the package's host-identity
  # collection and serialized tracking upload. The full chain distinguishes
  # actual identity transfer from a remote-import capability by itself.
  - id: python-remote-fingerprint-host-profile-upload
    desc: Uploads host identity alongside a remote browser fingerprint
    crit: notable
    conf: 0.98
    for: [python, whl, python-sdist, zip]
    scope: archive
    attack: T1041,T1589.001
    all:
      - id: micro-behaviors/os/module/require::python-remote-es-module-import
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload
      - id: micro-behaviors/communications/http/telemetry::python-host-profile-post-context
      - id: python-remote-browser-visitor-id

  # A stable browser visitor ID is uploaded together with the host's public IP
  # and MAC-derived identifier. Requiring the existing serialized tracking
  # path and both network/hardware identifiers distinguishes this from merely
  # embedding a remote browser library or collecting a local host profile.
  - id: python-remote-browser-and-host-identifiers-upload
    desc: Uploads remote browser fingerprint with public IP and hardware identifier
    crit: hostile
    conf: 0.97
    for: [python, whl, python-sdist, zip]
    scope: archive
    attack: T1041,T1589.001
    all:
      - id: python-remote-fingerprint-host-profile-upload
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/os/sysinfo/network::python-uuid-getnode-call

  - id: python-system-info-exfil
    desc: "Exfiltration of system information (User, Host, OS)"
    crit: hostile
    conf: 0.95
    near_lines: 60
    all:
      - id: micro-behaviors/process/identity/query::python-current-username
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/data/encode/base64::base64-encoding
      - id: micro-behaviors/communications/http/request/client::request-python

  # Host/MAC/IP queries beside a POST have neutral coverage in
  # micro-behaviors/communications/http/telemetry::python-host-profile-post-context.
  # That co-occurrence alone does not establish an unauthorized transfer.

  # uuid.getnode() is interpolated into a URL and fetched while a decoded
  # archive is launched. The MAC is the machine id on the check-in.
  - id: python-mac-checkin-decoded-launch
    desc: MAC check-in rides a decoded launch
    crit: hostile
    conf: 0.97
    platforms: [windows]
    all:
      - id: micro-behaviors/os/sysinfo/network::python-uuid-getnode-call
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: objectives/execution/payload/file-exec::zone-cleared-decoded-zip-forfiles
