defaults:
  platforms: [windows, unix]
  mbc: E1041

composite_rules:
- id: telegram-system-profile-exfil
  desc: Telegram sends collected host and user profile
  crit: hostile
  conf: 0.94
  for: [javascript, typescript]
  attack: T1041,T1082
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query

- id: npm-preinstall-telegram-host-profile-exfil
  desc: npm preinstall sends host profile to Telegram
  crit: hostile
  conf: 0.99
  for: [npm, javascript, package.json]
  attack: T1195.002,T1041,T1082
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: objectives/exfiltration/stealer/system-info/identity::telegram-system-profile-exfil

- id: npm-inline-preinstall-ipify-telegram-identity-report
  desc: npm inline preinstall sends host identity and public IP to Telegram
  crit: hostile
  conf: 0.99
  for: [zip, npm, package.json]
  attack: T1195.002,T1041,T1082,T1033
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/command::npm-preinstall-http-url
  - id: micro-behaviors/os/sysinfo/hostname/command::script-sysinfo-cmd-1--hostname
  - id: metadata/package/scripts/discovery::preinstall-username
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/communications/http/services/telegram::telegram-service-name-reference
