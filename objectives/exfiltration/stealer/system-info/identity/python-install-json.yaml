defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: hostile
  conf: 0.98
composite_rules:
- id: python-install-hostname-json-oob-exfil
  desc: Install hook exports hostname JSON to OOB
  attack: T1041,T1082
  mbc: E1041
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/http/request/json::python-urllib-hostname-json-oob-send
  - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
