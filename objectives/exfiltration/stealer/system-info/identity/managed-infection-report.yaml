# This admission is the explicit infection-report field, not ordinary host
# telemetry. CIL review confirms that the report is passed to UploadValues.
defaults:
  for: [pe, dll]
  platforms: [windows]
  conf: 0.98
composite_rules:
- id: managed-infection-domain-report-upload
  desc: Infection report and logon-domain HTTP upload
  crit: hostile
  attack: T1041
  all:
  - id: metadata/binary/symbols/name/token::managed-infection-type-report-field
  - id: micro-behaviors/os/sysinfo/hostname::dotnet-user-domain-name
  - id: micro-behaviors/communications/http/client/managed::uploadvalues
  - id: micro-behaviors/communications/http/post::native-post-method-token
  - id: metadata/binary/framework::dotnet-assembly
