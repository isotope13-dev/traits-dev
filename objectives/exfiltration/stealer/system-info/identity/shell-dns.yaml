defaults:
  platforms: [linux, macos]
  for: [shell]
  attack: T1048.003

composite_rules:
  - id: shell-dns-username-export
    desc: Exports hex-encoded username in DNS query
    crit: suspicious
    conf: 0.99
    near_bytes: 100
    all:
      - id: micro-behaviors/communications/dns/cli::nslookup-hex-username-subdomain
      - id: micro-behaviors/data/encode/hex::hex-encode-xxd
    unless:
      - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
