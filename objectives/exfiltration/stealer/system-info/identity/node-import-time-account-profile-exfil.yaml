defaults:
  crit: hostile
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1005,T1033,T1041,T1059.007,T1082

composite_rules:
  - id: node-import-time-account-profile-http-exfil
    desc: Sends account and command output over HTTP at startup
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-import-time-network-call
      - id: micro-behaviors/fs/read/file/account::read-node-etc-passwd
      - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
