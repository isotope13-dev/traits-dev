# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


composite_rules:
  # An install script that fingerprints the machine (hashed hostname), probes
  # the developer's GitHub identity, and POSTs both to a remote gate that can
  # refuse the install. License checks explain the shape, so this stays
  # suspicious: the telemetry is real and coercive, but credential theft is
  # not in evidence.
- id: install-hook-fingerprint-identity-exfil
  desc: Install hook sends fingerprint and identity to remote
  crit: suspicious
  conf: 0.88
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: "metadata/lang/source/naming/resource::device-id-identifier-reference"
  - id: micro-behaviors/process/create/shell/git::git-remote-url-capture
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: metadata/package/scripts/lifecycle::has-install-script
