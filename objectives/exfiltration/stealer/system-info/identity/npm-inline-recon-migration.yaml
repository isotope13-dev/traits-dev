defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  mbc: E1041

composite_rules:
- id: node-inline-host-user-oob-exfil
  desc: Inline node preinstall exfiltrates hostname and username to OOB callback
  crit: hostile
  conf: 0.985
  attack: "T1195.002, T1041, T1082, T1033"
  all:
  - id: metadata/package/scripts/command::preinstall-inline-node-const-reference
  - id: micro-behaviors/os/sysinfo/hostname/query::preinstall-node-os-hostname
  - id: micro-behaviors/process/identity/query/principal::preinstall-node-os-userinfo
  any:
  - id: micro-behaviors/communications/url/host/oob/package::js-oastify-host
  - id: metadata/package/scripts/reference::interactsh-oast-domain
  - id: micro-behaviors/communications/url/host/oob/endpoint::preinstall-webhook-site-url
- id: npm-postinstall-inline-host-profile-exfil
  desc: npm postinstall sends host identity in encoded URL
  crit: hostile
  conf: 0.995
  attack: "T1195.002,T1082,T1033,T1041"
  for: [package.json, npm, tar, zip]
  scope: archive
  all:
  - id: objectives/execution/trigger/package/lifecycle::scripts-postinstall-node-e
  - id: micro-behaviors/communications/http/request/inline::npm-postinstall-https-get
  - id: micro-behaviors/data/encode/url::npm-postinstall-json-url-encoding
  - id: micro-behaviors/os/sysinfo/hostname/query::npm-postinstall-os-hostname-call
  - id: micro-behaviors/process/identity/query/principal::npm-postinstall-os-userinfo-call
  - id: micro-behaviors/os/sysinfo/platform/runtime/environment::npm-postinstall-cwd-call
