defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-keylogger-host-identity-report
    desc: Keylogger identity handoff with HTTP upload APIs
    crit: hostile
    conf: 0.96
    attack: T1041
    # The identity report is additional to captured input. Admission comes
    # from the recorder, rather than treating ordinary telemetry as theft.
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/communications/http/request/report::managed-identity-report-field-handoff
      - id: micro-behaviors/os/sysinfo/hostname::dotnet-machine-name-getter-reference
      - id: micro-behaviors/os/user/lookup::dotnet-user-name-getter-reference
      - id: micro-behaviors/communications/http/client/managed::uploadstring
