defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  # Admission is the silent identity sender in a packaging entry point,
  # combined with a decoded request destination and OOB collector evidence.
  # The research/authorization claims in comments do not establish consent.
  # Do not infer environment-secret theft: the probe may send names only.
  - id: setup-py-silent-encoded-host-report
    desc: Setup silently reports identity with OOB clues
    crit: hostile
    conf: 0.97
    attack: T1041,T1027
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/pip::packaging-setuptools-import
      - id: micro-behaviors/communications/http/client/exchange::python-urllib-json-host-identity-send
      - id: micro-behaviors/communications/http/client/initialize::python-urllib-base64-decoded-target
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
