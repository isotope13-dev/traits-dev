defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1041

composite_rules:
  - id: applescript-host-profile-exfil
    desc: AppleScript exfiltrates host profile
    crit: hostile
    conf: 0.98
    attack: T1041,T1082
    all:
      - id: objectives/discovery/system/fingerprint/machine-id::applescript-profile-message-envelope
      - id: micro-behaviors/communications/http/request/body::applescript-message-curl-post
      - id: objectives/discovery/system/fingerprint/machine-id::macos-command-hardware-serial
    any:
      - id: micro-behaviors/os/sysinfo/cpu::sysctl-cpu-brand-string
      - id: micro-behaviors/fs/path/app-data::telegram-keepcoder-path
