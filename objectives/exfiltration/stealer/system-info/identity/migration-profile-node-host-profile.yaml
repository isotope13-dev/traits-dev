defaults:
  crit: hostile
  conf: 0.97
  platforms: [unix, windows]
  for: [javascript, typescript, tar, zip]
  attack: T1195.002,T1041,T1082
  mbc: E1041

composite_rules:
  # Dependency-confusion probe that reports the victim twice: a dns.lookup()
  # of a computed name (host and user identity hex-encoded into the labels)
  # and an HTTPS POST of the JSON-serialized profile to the same operator
  # domain. The install hook runs it with no user action. A package that
  # queries host and user identity at runtime lacks the install hook; an
  # installer that resolves a fixed hostname lacks the computed lookup.
- id: npm-install-hook-dns-and-https-host-profile-exfil
  desc: Install hook sends host profile over DNS, HTTPS
  for: [npm, tar, zip, package.json, javascript]
  scope: archive
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-variable-or-expression
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
