defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-host-profile-socket-exfil
    desc: Node host profiling sent over a socket
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/hostname/command::node-shell-hostname-command
      - id: micro-behaviors/process/identity/query/principal::node-runs-id
      - id: micro-behaviors/os/sysinfo/network::node-runs-hostname-i
      - id: micro-behaviors/communications/socket/dial::javascript-dial
      - id: micro-behaviors/communications/socket/send/content::node-socket-json-write
    near_bytes: 2400
