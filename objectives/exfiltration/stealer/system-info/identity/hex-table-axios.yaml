# Resolve the concealed client and bind its POST body to a single object
# containing hostname and user results. Field labels, endpoint, decoder,
# client table and object identifiers are unconstrained.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: hex-table-axios-host-identity-post
    desc: Hex-concealed POST carries host and user queries
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
        (lexical_declaration (variable_declarator name: (identifier) @os
         value: (call_expression function: (identifier) @os_require
          arguments: (arguments . (string) @os_module .))))
        (lexical_declaration "const" (variable_declarator name: (identifier) @environment
         value: (object
          (pair value: (call_expression function: (member_expression
           object: (identifier) @os_host property: (property_identifier) @hostname)
           arguments: (arguments)))
          (pair value: (member_expression object: (call_expression
           function: (member_expression object: (identifier) @os_user
            property: (property_identifier) @userinfo) arguments: (arguments))
           property: (property_identifier) @username)))))
        (function_declaration name: (identifier) @decoder
         parameters: (formal_parameters . (identifier) @hex .)
         body: (statement_block . (return_statement (call_expression
          function: (member_expression object: (identifier) @input property: (property_identifier) @replace)
          arguments: (arguments . (regex) @pairs . (arrow_function parameter: (identifier) @byte
           body: (call_expression function: (member_expression object: (identifier) @String property: (property_identifier) @charcode)
            arguments: (arguments . (call_expression function: (identifier) @parse
             arguments: (arguments . (identifier) @parsed . (number) @radix .)) .))) .))) .))
        (lexical_declaration (variable_declarator name: (identifier) @table
         value: (array . (_)
          . (call_expression function: (identifier) @decode_module arguments: (arguments . (string) @axios .))
          . (call_expression function: (identifier) @decode_method arguments: (arguments . (string) @post .))
          . (call_expression function: (identifier) @decode_url arguments: (arguments . (string) @url .))
          . (_) . (_) . (_)
          . (call_expression function: (identifier) @decode_then arguments: (arguments . (string) @then .)))))
        (expression_statement (assignment_expression right: (arrow_function
         body: (call_expression function: (member_expression
          object: (call_expression function: (subscript_expression
           object: (call_expression function: (subscript_expression
         object: (call_expression function: (identifier) @require
          arguments: (arguments . (subscript_expression object: (identifier) @table_module index: (number) @idx_module) .))
         index: [(subscript_expression object: (identifier) @table_method index: (number) @idx_method) (array . (subscript_expression object: (identifier) @table_method index: (number) @idx_method) .)])
         arguments: (arguments . (subscript_expression object: (identifier) @table_url index: (number) @idx_url) . (identifier) @posted))
           index: [(subscript_expression object: (identifier) @table_then index: (number) @idx_then) (array . (subscript_expression object: (identifier) @table_then index: (number) @idx_then) .)])
           arguments: (arguments . (_) .))
          property: (property_identifier)) arguments: (arguments)))))) @operation
        (#eq? @hex @input) (#eq? @replace "replace") (#eq? @pairs "/../g")
        (#eq? @String "String") (#eq? @charcode "fromCharCode")
        (#eq? @parse "parseInt") (#eq? @parsed @byte) (#eq? @radix "16")
        (#eq? @decoder @decode_module) (#eq? @decoder @decode_method)
        (#eq? @decoder @decode_url) (#eq? @decoder @decode_then)
        (#match? @axios "^[\"']6178696[fF]73[\"']$")
        (#match? @post "^[\"']706[fF]7374[\"']$")
        (#match? @url "^[\"']68747470733[aA]2[fF]2[fF][0-9A-Fa-f]+[\"']$")
        (#match? @then "^[\"']7468656[eE][\"']$")
        (#eq? @require "require")
        (#eq? @table @table_module) (#eq? @table @table_method)
        (#eq? @table @table_url) (#eq? @table @table_then)
        (#eq? @idx_module "1") (#eq? @idx_method "2")
        (#eq? @idx_url "3") (#eq? @idx_then "7")
        (#eq? @environment @posted)
        (#eq? @os_require "require") (#match? @os_module "^[\"']os[\"']$")
        (#eq? @os @os_host) (#eq? @os @os_user)
        (#eq? @hostname "hostname")
        (#eq? @userinfo "userInfo") (#eq? @username "username"))


composite_rules:
  - id: js-concealed-host-identity-post
    desc: Concealed Axios exports host and user identity
    crit: hostile
    conf: 0.99
    attack: T1041,T1027
    all:
      - id: hex-table-axios-host-identity-post
      - id: micro-behaviors/data/decode/hex::hex-pair-regex-byte-parser
    any:
      - id: objectives/exfiltration/stealer/env::js-hex-table-env-post
      - id: objectives/execution/payload/script-eval::concealed-client-eval-response-data
