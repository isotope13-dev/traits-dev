defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-hostname-bound-to-oob-request-path
    desc: Hostname bound into OOB HTTP request path
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @hostname
            value: (call_expression function: (member_expression property: (property_identifier) @hostcall))))
          (lexical_declaration (variable_declarator name: (identifier) @domain
            value: (string (string_fragment) @oob)))
          (lexical_declaration (variable_declarator name: (identifier) @path
            value: (template_string (template_substitution
              (call_expression function: (identifier) @encode arguments: (arguments (identifier) @senthost))))))
          (lexical_declaration (variable_declarator value: (call_expression
            function: (member_expression property: (property_identifier) @request)
            arguments: (arguments (object
              (pair key: (property_identifier) @hostkey value: (identifier) @requestdomain)
              (pair key: (property_identifier) @pathkey value: (identifier) @requestpath)))))))
          (#eq? @hostcall "hostname") (#eq? @hostname @senthost)
          (#eq? @encode "encodeURIComponent")
          (#match? @oob "[.](oast[.](fun|pro|live|site|online|me)|interactsh[.]com|burpcollaborator[.]net)$")
          (#eq? @request "request") (#eq? @domain @requestdomain) (#eq? @path @requestpath)
          (#eq? @hostkey "hostname") (#eq? @pathkey "path"))
composite_rules:
  - id: node-host-identity-oob-request-exfiltration
    desc: Sends local hostname to OOB collector
    crit: hostile
    conf: 0.99
    attack: T1041,T1082
    all:
      - id: node-hostname-bound-to-oob-request-path
      - id: micro-behaviors/communications/http/get::node-host-identity-get-url
