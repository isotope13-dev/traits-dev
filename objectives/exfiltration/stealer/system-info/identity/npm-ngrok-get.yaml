defaults:
  platforms: [unix, windows]
  crit: hostile

composite_rules:
- id: npm-postinstall-ngrok-host-identity-get
  desc: Postinstall GET exports host identity to ngrok
  conf: 0.98
  attack: T1195.002,T1041,T1082
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/get::node-host-identity-get-url
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/

