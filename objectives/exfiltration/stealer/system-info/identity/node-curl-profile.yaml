defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: executed-curl-host-account-url
    desc: Executes curl URL containing host and account
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @command
            value: (template_string) @template))
          (expression_statement (call_expression function: (identifier) @exec
            arguments: (arguments (identifier) @argument))))
          (#eq? @command @argument) (#match? @exec "^exec(Sync)?$")
          (#match? @template "curl[ \\t]+-X[ \\t]+POST[ \\t]+[\\\"']?https?://")
          (#match? @template "\\$\\(whoami\\)") (#match? @template "\\$\\(hostname\\)"))
composite_rules:
  - id: node-shell-host-account-url-exfiltration
    desc: Shell sends host and account in URL
    crit: hostile
    conf: 0.99
    attack: T1041,T1082,T1033
    all:
      - id: executed-curl-host-account-url
      - id: metadata/import/builtin::require-child-process
