defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1041

composite_rules:
  - id: java-host-user-http-exfil
    desc: Java sends host and user profile in an HTTP POST
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/sysinfo/hostname::java-local-host-name-source
      - id: micro-behaviors/os/user/lookup::java-current-user-property
      - id: micro-behaviors/data/format/json::java-host-user-json-fields
      - id: micro-behaviors/communications/http/client/library::java-httpclient-send-source
      - id: micro-behaviors/communications/http/client/library::java-httpclient-post-string-source
