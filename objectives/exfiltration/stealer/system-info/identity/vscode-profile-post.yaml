# An editor extension that collects several host identity fields and silently
# POSTs them to a fixed remote endpoint is exfiltrating the local profile.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1082,T1195.002
  mbc: E1041

composite_rules:
  - id: vscode-extension-host-profile-https-post
    desc: VS Code extension POSTs a collected host profile
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/profile::vscode-extension-user-home-workdir-platform-profile
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
