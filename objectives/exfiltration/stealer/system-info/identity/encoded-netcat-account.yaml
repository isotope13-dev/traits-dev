defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: base64-passwd-netcat-pipeline
    desc: Encoded account file sent through netcat
    crit: hostile
    conf: 0.96
    attack: T1041,T1087
    if:
      type: encoded
      encoding: base64
      regex: 'cat\s+/etc/passwd\s*\|\s*(nc|ncat|netcat)\s+\S+'
