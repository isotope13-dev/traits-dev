    desc: Speed check leaks hex OS identity to OOB host
    crit: hostile
    conf: 0.99
    attack: T1048.003
    mbc: E1041
    all:
      - id: node-hex-identity-benchmark-url-flow
      - id: micro-behaviors/data/encode/hex::js-to-string-hex
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: npm-preinstall-hex-identity-oob-benchmark-exfil
    desc: Hex identity OOB leak packaged with npm preinstall
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    attack: T1048.003
    mbc: E1041
    all:
      - id: node-hex-identity-oob-benchmark-exfil
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
