defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1048.003
  mbc: E1041
# URL construction alone is neutral. Require a recognized network benchmark
# invocation; logging or storing the same URL does not establish exfiltration.
composite_rules:
  - id: node-hex-identity-oob-benchmark-exfil
    desc: Speed check leaks hex OS identity to OOB host
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/build::node-hex-os-identity-benchmark-url-argument
      - id: micro-behaviors/communications/benchmark/bandwidth::network-speed-download-check
  - id: npm-preinstall-hex-identity-oob-benchmark-exfil
    desc: Hex identity OOB leak packaged with npm preinstall
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript, typescript]
    scope: archive
    all:
      - id: node-hex-identity-oob-benchmark-exfil
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
