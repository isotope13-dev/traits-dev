defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: node-systeminformation-fetch-exfil
  desc: Node systeminformation fingerprint HTTP exfiltration
  crit: hostile
  conf: 0.97
  attack: T1041,T1082
  mbc: E1041
  for: [npm, javascript]
  all:
  - id: objectives/discovery/system/fingerprint/hardware::si-uuid-call
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: micro-behaviors/data/source/syntax/schema::hardware-macs-field-pair
- id: node-host-user-ip-post-exfil
  desc: Node package host user exfiltration
  crit: hostile
  conf: 0.97
  attack: T1041
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/data/serialize/schema-object::user-field-key
  - id: micro-behaviors/data/source/syntax/schema::node-package-version-field
  any:
  - id: metadata/import/builtin::require-http
  - id: metadata/import/builtin::require-https
  - id: micro-behaviors/communications/http/request/client::http-client-usage
- id: node-flag-sweep-identity-rawip-exfil
  desc: Host identity and flag-file sweep sent to raw IP
  # The joined payload is one string built from the collected identifiers and
  # the first non-empty flag file, so source and transport bind at the single
  # request; the raw-IP:port endpoint and discarded error handler are the
  # install-and-vanish shape of the send.
  crit: hostile
  conf: 0.98
  attack: T1041,T1005
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
  - id: micro-behaviors/fs/path/secret-config::ctf-flag-file-path-list
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/body::request-write-call
  - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-js-ip-port-endpoint
- id: npm-preinstall-flag-sweep-exfil
  desc: npm preinstall sweeps flag files and reports host
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  scope: archive
  for: [npm, javascript, package.json]
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: node-flag-sweep-identity-rawip-exfil
