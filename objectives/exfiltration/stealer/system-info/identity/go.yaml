# Host-profile collection sent through a Go HTTP agent.  This is intentionally
# family-agnostic: the signal is the combination of multiple host sources,
# input-device state, serialization/encoding, and an outbound request.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1082,T1033,T1016,T1056.001,T1041
  mbc: E1082,E1033,E1016,E1056.001,E1041

composite_rules:
  - id: go-account-workdir-http-exfil
    desc: Go sends user and working-directory profile via HTTP POST
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/system/fingerprint/user::go-account-workdir-profile
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-instance-do
      - id: micro-behaviors/communications/http/header/custom::go-content-type-set
    near_bytes: 3200
