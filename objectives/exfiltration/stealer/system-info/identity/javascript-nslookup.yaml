defaults:
  crit: hostile
  platforms: [unix, windows, macos]
  for: [javascript, typescript]
  mbc: E1041

composite_rules:
  # Host identity (whoami + hostname) is the required source; nslookup labels
  # are only the transport and do not determine the source category.
  - id: js-nslookup-host-profile-dns-exfil
    desc: Host identity exfiltrated via nslookup DNS labels
    conf: 0.97
    attack: "T1048.003,T1082,T1033"
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/cli::nslookup-exec
      - id: micro-behaviors/data/string/concat::leading-variable-dotted-name
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/os/sysinfo/hostname::node-shell-hostname-command
    any:
      - id: metadata/import/builtin::child-process-api-destructure
      - id: metadata/import/builtin::require-child-process

  - id: js-nslookup-custom-resolver-host-exfil
    desc: Host identity DNS exfil via custom nslookup resolver
    conf: 0.98
    attack: "T1048.003,T1071.004,T1082,T1033"
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/cli::nslookup-custom-resolver-exec
      - id: micro-behaviors/data/string/concat::leading-variable-dotted-name
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/os/sysinfo/hostname::node-shell-hostname-command
