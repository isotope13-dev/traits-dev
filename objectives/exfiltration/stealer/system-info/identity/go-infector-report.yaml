# Native tracing: main formats the self hash and os.getModuleFileName path
# into this query and passes the resulting URL to HTTP Client.Get. Require
# infection context; a diagnostic HTTP query alone is not theft.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-infector-execution-path-http-report
    desc: Go infector HTTP report includes self hash and execution path
    crit: hostile
    conf: 0.98
    attack: T1041
    all:
      - id: objectives/impact/infect/binary/rewrite::go-polymorphic-overwrite-infector
      - id: micro-behaviors/communications/http/query::self-image-hash-execution-path-template
      - id: micro-behaviors/communications/http/get::go-native-http-get-reference
