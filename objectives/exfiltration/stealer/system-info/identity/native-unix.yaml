defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1041

composite_rules:
  # Require a native addon export, host/user lookups and serialized upload
  # evidence in the same ELF; co-occurrence alone does not prove data flow.
  # Collector spelling is deliberately not required.
- id: native-forked-node-addon-form-profile-exfil
  desc: Forked Node addon POSTs URL-encoded install profile to a direct IPv4
  for: [elf]
  scope: file
  all:
  - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: micro-behaviors/process/create/fork::fork
  - id: micro-behaviors/os/env/read::native-getenv
  - id: micro-behaviors/os/sysinfo/hostname::gethostname
  - id: micro-behaviors/os/user/lookup::getpwuid
  - id: micro-behaviors/communications/http/post::post-request-line
  - id: micro-behaviors/communications/socket/connect::connect-import
  - id: micro-behaviors/communications/socket/send::send-symbol
  - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
  - id: micro-behaviors/communications/http/message::urlencoded-host-user-registry-form
  any:
  - id: micro-behaviors/communications/ip/direct::external-ipv4-http-host-endpoint
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary

# Some native Node install-time collectors use getenv for both host identity
# and npm package context, rather than gethostname/getpwuid. Keep this distinct
# from the direct host/user API profile above and require the matching form
# template plus socket send path and external IPv4 endpoint.
- id: native-forked-node-addon-npm-env-form-profile-exfil
  desc: Forked Node addon sends npm environment profile in URL-encoded HTTP form
  for: [elf]
  scope: file
  all:
  - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: micro-behaviors/process/create/fork::fork
  - id: micro-behaviors/os/env/read::native-getenv
  - id: micro-behaviors/os/env/system-info::hostname-var
  - id: micro-behaviors/os/env/user-info::user-var
  - id: micro-behaviors/os/env/package-manager::npm-install-profile-getenv-key-pair
  - id: micro-behaviors/communications/http/post::post-request-line
  - id: micro-behaviors/communications/socket/connect::connect-import
  - id: micro-behaviors/communications/socket/send::send-symbol
  - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
  - id: micro-behaviors/communications/http/message::urlencoded-host-package-user-registry-form
  any:
  - id: micro-behaviors/communications/ip/direct::external-ipv4-http-host-endpoint
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary

