defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1041,T1059.007
traits:
- id: node-pino-env-profile-spread
  desc: Includes environment in host profile
  crit: notable
  if:
    type: text
    substr: '...process.env'
- id: node-pino-hex-post-eval
  desc: Posts profile and evaluates response
  crit: suspicious
  if:
    type: text
    substr: require(hl[1])[[hl[2]]](hl[3], data
- id: node-pino-profile-response-eval
  desc: Evaluates returned profile response
  crit: notable
  if:
    type: text
    substr: r => eval(r.data)
composite_rules:
- id: node-hex-pino-profile-upload-eval
  desc: Uploads environment and evaluates remote response
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/encoding/hex::node-hex-ipcheck-endpoint-literal
  - id: node-pino-env-profile-spread
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-username-read
  - id: node-pino-hex-post-eval
  - id: node-pino-profile-response-eval
