defaults:
  platforms: [unix]
  for: [shell]
  attack: T1041,T1082,T1033

composite_rules:
  - id: shell-identity-oob-curl-beacon
    desc: Shell beacons host identity to OOB endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/profile::shell-user-host-cwd-queries
      - id: micro-behaviors/communications/http/curl::curl-command-call
