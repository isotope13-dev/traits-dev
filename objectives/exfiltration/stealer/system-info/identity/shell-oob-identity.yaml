defaults:
  platforms: [unix]
  for: [shell]
  attack: T1041,T1082,T1033

composite_rules:
  - id: shell-identity-oob-curl-beacon
    desc: Shell beacons host identity to OOB endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/profile::shell-user-host-cwd-queries
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-documentation
      - id: metadata/package/documentation/security-testing::pentest-skill-methodology
