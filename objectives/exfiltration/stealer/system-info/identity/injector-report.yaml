defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: system-process-injector-host-report
    desc: System-process injector reports host identity over HTTP
    crit: hostile
    conf: 0.98
    attack: T1041,T1016
    # Reviewed code formats the username/MAC identity report, puts it into the
    # report.php data argument and passes the resulting URL to InternetOpenUrl.
    # The attack-specific injection profile provides admission, independent
    # of mutable campaign domains and family attribution.
    all:
      - id: objectives/evasion/process/injection/staged::host-report-system-process-injector
      - id: micro-behaviors/communications/http/request/report::host-profile-form-template
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/network/interface::get-adapters-info
