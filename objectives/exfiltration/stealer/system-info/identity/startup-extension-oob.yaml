# Hostname callbacks to research/OOB infrastructure warrant quarantine, but
# startup activation and a callback alone do not establish supply-chain abuse.
defaults:
  platforms: [unix, windows, macos]
  for: [vsix-archive, javascript, typescript, package.json]
composite_rules:
- id: startup-extension-hostname-oob-beacon
  desc: Startup extension beacons hostname to OOB service
  crit: suspicious
  conf: 0.99
  scope: outer
  all:
  - id: micro-behaviors/communications/http/get::node-host-identity-get-url
  - id: metadata/permission/activation::on-startup-finished
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  any:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/url-computed::node-https-get-concatenated-url
  - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
