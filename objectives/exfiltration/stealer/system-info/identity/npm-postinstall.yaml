# The hostname must enter the GET URL itself. Merely reading a hostname and
# mentioning a collaborator elsewhere in a hook does not establish export.
# Keep both the HTTP-module call and the hostname-to-URL relationship.
defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: npm-postinstall-oast-hostname-get
    desc: Postinstall GET exports hostname to OAST
    crit: hostile
    conf: 0.98
    attack: T1048.003
    mbc: E1048
    all:
      - id: micro-behaviors/communications/http/get::npm-postinstall-node-http-get
      - id: micro-behaviors/communications/http/get::npm-postinstall-hostname-oast-get-url
      - id: micro-behaviors/os/sysinfo/hostname::npm-postinstall-os-hostname-call
