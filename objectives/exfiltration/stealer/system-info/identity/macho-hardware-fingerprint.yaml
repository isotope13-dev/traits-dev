# macOS Credential Exfiltration
# macOS credential theft with network exfiltration
# ATT&CK: T1555 (Credentials from Password Stores) + T1041
defaults:
  platforms: [macos]
  attack: "T1041"
  for: [macho]

composite_rules:
  - id: fingerprint-with-exfil
    desc: "macOS hardware fingerprinting network exfiltration"
    crit: suspicious
    conf: 0.8
    attack: "T1082"
    mbc: "B0001.009"
    all:
      - id: objectives/discovery/system/fingerprint/machine-id::hardware-fingerprint-macos
    any:
      - id: micro-behaviors/communications/socket/connect::socket-create-and-connect-syscalls
      - id: micro-behaviors/communications/socket/connect::socket-connect
      - id: micro-behaviors/communications/http/download/curl/
      - id: micro-behaviors/communications/http/curl::curl-silent-short-flag-url
      - id: micro-behaviors/communications/http/curl::curl-silent-long-flag-url
      - id: micro-behaviors/communications/http/curl::curl-silent-stdout
      - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
      - id: micro-behaviors/communications/http/curl::curl-silent-fail-flags-text
      - id: micro-behaviors/communications/http/curl::curl-silent
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
