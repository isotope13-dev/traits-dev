defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
traits:
- id: npm-host-command-output-marker
  desc: Contains the host_intel marker
  crit: component
  conf: 0.98
  if:
    type: text
    substr: host_intel
- id: npm-package-identity-upload-marker
  desc: Contains the packageInfo marker
  crit: component
  conf: 0.9
  if:
    type: text
    substr: packageInfo
- id: npm-engagement-gate-marker
  desc: Contains the engagement_check marker
  crit: component
  conf: 0.96
  if:
    type: text
    substr: engagement_check
- id: npm-hardcoded-github-classic-token
  desc: Embeds a GitHub classic access token
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: ghp_[A-Za-z0-9]{20,}
  unless:
  - id: metadata/package/testing/corpus/security-tests::github-token-url-regression-test
composite_rules:
- id: npm-host-ip-upload-marker
  desc: Host IP field, JSON serialization, and POST co-occur
  crit: suspicious
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/serialize/schema-system::host-ip-field-name
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/post::node-http-request-post
- id: node-hardcoded-github-token-gist-exfil
  desc: GitHub token posts runtime data to Gist
  crit: hostile
  conf: 0.995
  attack: T1041,T1552.001
  all:
  - id: npm-hardcoded-github-classic-token
  - id: micro-behaviors/communications/http/services/github/repository::github-gist-api-url
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/patch::axios-patch-call
  - id: micro-behaviors/communications/http/request/client::https-request
- id: npm-obfuscated-host-command-profile-upload
  desc: Executes a host command and posts its output with a host profile
  crit: hostile
  conf: 0.995
  attack: T1016,T1033,T1041,T1059.007,T1082
  mbc: E1041
  near_bytes: 4096
  all:
  - id: npm-host-command-output-marker
  - id: micro-behaviors/process/create/shell/variable-command::node-exec-command-variable
  - id: npm-host-ip-upload-marker
  - id: npm-package-identity-upload-marker
  - id: npm-engagement-gate-marker
  - id: metadata/lang/source/naming/server-url-field::server-url-field-name
- id: npm-whatsapp-registration-writes-host-data
  desc: Uploads WhatsApp user identity and host IP
  crit: hostile
  conf: 0.995
  attack: T1041,T1033
  all:
  - id: npm-hardcoded-github-classic-token
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-write-method-reference
  - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-user-address-suffix
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
- id: npm-preinstall-obfuscated-network-profile-upload
  desc: Uploads a Node network interface profile
  crit: hostile
  conf: 0.99
  attack: T1016,T1041
  near_bytes: 4096
  all:
  - id: micro-behaviors/network/interface/query::node-network-interfaces-reference
  - id: micro-behaviors/communications/http/content-length::raw-content-length-header
  - id: micro-behaviors/data/serialize/schema-system::host-field-key
