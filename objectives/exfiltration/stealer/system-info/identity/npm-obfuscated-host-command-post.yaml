defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1059,T1033,T1082,T1041
  mbc: E1041

traits:
- id: npm-host-command-output-marker
  desc: Labels shell output as host intelligence
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: host_intel
- id: npm-host-ip-upload-marker
  desc: Labels host IP for upload
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: host_ip
- id: npm-package-identity-upload-marker
  desc: Labels package identity for upload
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: packageInfo
- id: npm-engagement-gate-marker
  desc: Checks a remote engagement date
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: engagement_check
- id: npm-host-profile-server-marker
  desc: Configures a host profile upload endpoint
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: serverUrl
- id: npm-hardcoded-github-classic-token
  desc: Embeds a GitHub classic access token
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: 'ghp_[A-Za-z0-9]{20,}'
- id: npm-octokit-repository-file-write
  desc: Writes repository files through Octokit
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: createOrUpdateFileContents
- id: npm-whatsapp-number-identifier
  desc: Handles WhatsApp user numbers
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '@s.whatsapp.net'
composite_rules:
- id: node-hardcoded-github-token-gist-exfil
  desc: GitHub token posts runtime data to Gist
  crit: hostile
  conf: 0.995
  attack: T1041,T1552.001
  all:
  - id: npm-hardcoded-github-classic-token
  - id: micro-behaviors/communications/http/services/github/repository::github-gist-api-url
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/patch::axios-patch-call
  - id: micro-behaviors/communications/http/request/client::https-request
- id: npm-obfuscated-host-command-profile-upload
  desc: Uploads command output and host identity
  crit: hostile
  conf: 0.995
  all:
  - id: npm-host-command-output-marker
  - id: npm-host-ip-upload-marker
  - id: npm-package-identity-upload-marker
  - id: npm-engagement-gate-marker
  - id: npm-host-profile-server-marker
- id: npm-whatsapp-registration-writes-host-data
  desc: Uploads WhatsApp user identity and host IP
  crit: hostile
  conf: 0.995
  attack: T1041,T1033
  all:
  - id: npm-hardcoded-github-classic-token
  - id: npm-octokit-repository-file-write
  - id: npm-whatsapp-number-identifier
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
- id: npm-preinstall-obfuscated-network-profile-upload
  desc: Uploads a Node network interface profile
  crit: hostile
  conf: 0.99
  attack: T1016,T1041
  all:
  - id: micro-behaviors/network/interface/query::node-network-interfaces-reference
  - id: micro-behaviors/communications/http/content-length::raw-content-length-header
  - id: micro-behaviors/data/serialize/schema-system::host-field-key
