defaults:
  platforms: [unix]
  for: [npm, tar, package.json, javascript]
composite_rules:
- id: npm-postinstall-base64-passwd-get
  desc: Postinstall GET exports Base64 passwd data
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1087.001
  mbc: E1041
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/get::node-base64-buffer-get-url
  - id: micro-behaviors/communications/http/get::node-passwd-file-get-url
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
