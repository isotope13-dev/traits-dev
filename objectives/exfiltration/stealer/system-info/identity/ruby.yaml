defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows

composite_rules:
  - id: info-stealer
    desc: System info stealer with HTTP exfil
    crit: hostile
    conf: 0.95
    attack: T1041
    all:
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
      - id: micro-behaviors/network/interface::socket-ip-address
      - id: micro-behaviors/communications/http/lib/netlib::net-http
      - id: micro-behaviors/communications/http/lib/netlib::hardcoded-ip-url
