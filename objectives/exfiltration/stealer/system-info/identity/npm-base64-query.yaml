defaults:
  platforms: [unix, windows]
  crit: hostile

composite_rules:
- id: npm-postinstall-base64-host-identity-get
  desc: Postinstall GET exports Base64 host data
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041
  mbc: E1041
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/data/encode/base64::node-json-base64-with-host-query
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: micro-behaviors/communications/http/get::node-base64-buffer-get-url
  - id: micro-behaviors/communications/http/get::node-host-identity-get-url
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/file/naming::test-directory-component
