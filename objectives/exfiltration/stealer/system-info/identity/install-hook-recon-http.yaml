defaults:
  mbc: E1041
  for: [javascript, package.json, tar, zip]
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-preinstall-host-profile-http-exfil
  desc: NPM preinstall exfils host profile over HTTP
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082,T1016
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/os/sysinfo/report::js-hostname-pwd-whoami-chain
  - id: objectives/exfiltration/http/query::js-http-query-exfil
- id: npm-preinstall-host-profile-ip-query-exfil
  desc: NPM preinstall exfils host profile and public IP
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1016,T1041
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/os/sysinfo/report::js-hostname-pwd-whoami-chain
  - id: micro-behaviors/communications/http/ip-discovery::js-curl-ifconfig-me
  - id: objectives/exfiltration/http/query::js-http-query-exfil
- id: npm-preinstall-host-profile-post-insecure-tls
  desc: NPM preinstall posts collected host identity with TLS checks disabled
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082,T1033
  scope: archive
  near_bytes: 8192
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/os/sysinfo/hostname/command::node-shell-hostname-command
  - id: micro-behaviors/process/identity/query/principal::os-homedir-call
  - id: micro-behaviors/fs/directory/cwd::process-cwd-call
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
