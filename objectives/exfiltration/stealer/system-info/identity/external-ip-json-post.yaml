# A collected bundle posted as JSON to a bare external IP. The container
# rules under lateral-movement convict the reconnaissance (service-account
# secrets, pod environments); this one states the channel -- a hardcoded
# IP literal with no domain behind it is operator infrastructure, and the
# JSON body is everything the recon gathered.
#
# Worked example: the b10connoisseur kube-recon variant, whose module POSTs
# the collected /proc, capabilities and route tables as JSON to a hardcoded
# external IPv4.
defaults:
  crit: hostile
  conf: 0.96
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1071.001
  mbc: E1041

composite_rules:
  - id: import-host-profile-json-ip-post
    desc: Import posts host identity JSON to an IP
    all:
      - id: micro-behaviors/os/package-manager/hook-install::runs-at-import-or-install
      - id: micro-behaviors/data/serialize/schema-system::python-host-id-object-fields
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
  - id: urlopen-host-profile-to-external-ip
    desc: urlopen posts host profile to an IP
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
      - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: python-b64-host-profile-http-post
    desc: Posts base64 host profile over HTTP
    near_lines: 40
    all:
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
      - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: daemon-thread-host-profile-json-post
    desc: Daemon thread posts JSON host profile to an external IP
    scope: leaf
    near_lines: 30
    all:
      - id: micro-behaviors/process/thread/create::python-daemon-thread
      - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: python-posts-host-field-to-raw-ip
    desc: Posts host identity to a raw IP
    scope: file
    all:
      - id: micro-behaviors/data/serialize/schema-system::host-field-key
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: node-host-identity-json-ip-post
    desc: Node posts host identity JSON to an external IP
    conf: 0.98
    for: [javascript, typescript]
    attack: T1041,T1082,T1033
    scope: file
    all:
      - id: micro-behaviors/communications/http/telemetry::node-request-body-host-identity-origin
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/data/serialize/json::json-stringify-call
