defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, javascript]
  attack: T1041

composite_rules:
  - id: routeros-host-profile-http-exfil
    desc: RouterOS host profile HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/system/fingerprint/info::routeros-system-profile-read
      - id: objectives/discovery/system/fingerprint/info::routeros-interface-inventory
    any:
      - id: objectives/exfiltration/http/collect::routeros-http-data-upload
      - id: objectives/exfiltration/http/collect::routeros-fetch-collect-url
