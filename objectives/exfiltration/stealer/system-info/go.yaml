# Host-profile collection sent through a Go HTTP agent.  This is intentionally
# family-agnostic: the signal is the combination of multiple host sources,
# input-device state, serialization/encoding, and an outbound request.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1082,T1033,T1016,T1056.001,T1041
  mbc: E1082,E1033,E1016,E1056.001,E1041

composite_rules:
  - id: go-account-workdir-profile
    desc: Go collects redundant user and working-directory identity
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/process/user/query::logname-exec-argument
      - id: micro-behaviors/os/sysinfo/hostname::user-current
      - id: micro-behaviors/fs/read/directory::getwd-call
    near_bytes: 1600

  - id: go-account-workdir-http-exfil
    desc: Go sends user and working-directory profile via HTTP POST
    crit: hostile
    conf: 0.99
    all:
      - id: go-account-workdir-profile
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-instance-do
      - id: micro-behaviors/communications/http/headers::go-content-type-set
    near_bytes: 3200

  - id: go-host-profile-collection
    desc: Go collects host and network identity
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/discovery/system/fingerprint/runtime::go-system-info-discovery
      - id: micro-behaviors/os/sysinfo/hostname::user-current
      - id: micro-behaviors/os/network/interface::net-interfaces

  - id: go-host-profile-http-exfil
    desc: Go sends a host profile via encoded HTTP POST
    crit: hostile
    conf: 0.99
    all:
      - id: go-host-profile-collection
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do
    any:
      - id: micro-behaviors/data/encode/base64::go-base64-encode-call
      - id: micro-behaviors/communications/http/headers::go-content-type-set
    near_bytes: 5000

  - id: go-input-surveillance-http-exfil
    desc: Go sends global input state via HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: go-host-profile-collection
      - id: micro-behaviors/hardware/input/keyboard/poll::go-global-input-api-cluster
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do
    any:
      - id: micro-behaviors/data/encode/base64::go-base64-encode-call
      - id: micro-behaviors/communications/http/headers::go-content-type-set
    near_bytes: 7000

  - id: go-anti-debug-input-profile-agent
    desc: Go anti-debugging host-profile agent
    crit: hostile
    conf: 0.995
    attack: T1056.001,T1082,T1041,T1622
    all:
      - id: objectives/anti-analysis/debugger-detect/check::go-ptrace-traceme
      - id: go-input-surveillance-http-exfil
