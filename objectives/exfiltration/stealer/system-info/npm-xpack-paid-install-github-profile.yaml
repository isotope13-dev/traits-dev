defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1041,T1059.007,T1195.002
  mbc: E1041

traits:
  - id: node-xpack-install-gate-uploads-github-device-profile
    desc: Install gate sends package API key, device fingerprint and GitHub identity to a payment service
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)getGitHubIdentity\s*\([\s\S]{0,4500}ssh\s+-T\s+git@github\.com[\s\S]{0,7000}apiKey[\s\S]{0,800}deviceId[\s\S]{0,800}githubUsername[\s\S]{0,3500}/api/install/start[\s\S]{0,700}method\s*:\s*["'']POST[\s\S]{0,900}JSON\.stringify\s*\(\s*payload'

composite_rules:
  - id: npm-preinstall-xpack-payment-identity-collection
    desc: npm preinstall profiles GitHub identity and device data for a remote payment gate
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: node-xpack-install-gate-uploads-github-device-profile
