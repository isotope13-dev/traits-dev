defaults:
  for: [python, whl, python-sdist, zip]

composite_rules:
- platforms:
  - unix
  attack: T1573.002
  id: python-hybrid-encrypted-secret-exfil
  desc: Python hybrid encrypted secret exfiltration over HTTP
  crit: hostile
  conf: 0.985
  scope: archive
  all:
  - id: objectives/credential-access/cloud/container::python-cloud-kube-secret-harvest
  - id: micro-behaviors/data/compress::gzip-compress-call
  - id: micro-behaviors/crypto/symmetric/aes/mode::python-aes-gcm-references
  - id: micro-behaviors/crypto/asymmetric/rsa::rsa-oaep-public-encrypt
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  any:
  - id: objectives/exfiltration/http/encrypted::python-hybrid-encrypted-http-upload
  - id: micro-behaviors/communications/http/post::source-post-method-literal
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
  - id: objectives/exfiltration/stealer/credential/value::python-env-json-urllib-exfil
# Tarfile/CBC spelling of the same hybrid bundle: harvested credential paths
# packed into a tar.gz, bulk-encrypted with a constructed AES cipher, the
# session key wrapped by RSA-OAEP to an embedded PEM public key, and the
# bundle sent in an outbound POST. Each leg is library-spelling independent;
# no destination, header name, or archive member name is required.
- platforms:
  - unix
  - windows
  attack: T1041,T1573.002
  id: python-hybrid-encrypted-tar-secret-exfil
  desc: Hybrid-encrypted secret tar posted over HTTP
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: objectives/credential-access/cloud/container::python-secret-tar-archive
  - id: micro-behaviors/crypto/encrypt/unspecified::python-aes-bulk-encrypt
  - id: micro-behaviors/crypto/key/representation/encoded::pem-public-key-header
  - id: micro-behaviors/crypto/asymmetric/rsa::python-rsa-oaep-encrypt
  - id: micro-behaviors/communications/http/request/client::python-post-transport
