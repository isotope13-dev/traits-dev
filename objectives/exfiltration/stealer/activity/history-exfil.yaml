# Browser navigation/history sources with probable remote transfer.
# The stronger interception signatures also require local storage interfaces.
# Encryption alone is not storage; source/record construction and channel
# observations are required independently. These are static capability inferences.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

composite_rules:
- id: extension-visited-domain-history-exfil
  desc: Extension exfiltrates visited-domain history
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/url/navigation-http::url-object-host-read
  - id: micro-behaviors/process/hook/webextension::chrome-webrequest-pre-request
  - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
  - id: micro-behaviors/data/db/web-storage::browser-local-storage-interfaces
  unless:
  - id: micro-behaviors/process/hook/webextension::content-filter-request-blocking
  - id: well-known/app/ai/browser-agent/webbrain::webbrain-ai-agent-context
  - id: well-known/dual-use/tunnel/vpn-browser::vpn-browser-extension-context
    # A download-manager companion hands the media URL to an app on
    # 127.0.0.1. That hop is not a remote history upload.
  - id: micro-behaviors/communications/ip/endpoint::fetch-loopback-http-url
  - id: micro-behaviors/communications/url/host/http::loopback-client-url-cooccurrence
  any:
  - id: micro-behaviors/data/serialize/json::visited-url-before-json-serialization
  - id: micro-behaviors/data/serialize/json::json-serialization-before-visited-url
  - id: micro-behaviors/communications/http/request/body/application-state::visited-url-before-request-body
  - id: micro-behaviors/communications/http/request/body/application-state::request-body-before-visited-url
- id: extension-history-transfer-cooccurrence
  desc: History, storage and HTTP client co-occur
    # A history-search extension may intentionally send user-selected records
    # to a user-configured AI service. The collection and upload remain
    # security-relevant, but this shape alone does not establish theft.
  crit: suspicious
  conf: 0.9
  attack: T1217
  near_bytes: 16384
  all:
  - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
  - id: micro-behaviors/data/db/web-storage::browser-local-storage-interfaces
  any:
  - id: micro-behaviors/data/db/access::history-search
  - id: micro-behaviors/data/db/access::history-get-visits
  - id: micro-behaviors/data/db/access::top-sites-get
  unless:
- id: all-url-pageview-record-upload
  desc: All-URL extension uploads recorded pageview URLs and referrers
  crit: suspicious
  conf: 0.97
  attack: T1119,T1041
  scope: archive
  for: [crx, xpi, zip, chrome-manifest, javascript]
  all:
  - id: metadata/permission/host::permission-all-urls
  - id: micro-behaviors/os/telemetry/activity::pageview-record-fields
  - id: micro-behaviors/process/hook/webextension::webrequest-completed-listener
  - id: micro-behaviors/communications/http/request/client::js-fetch-call

  # Require a navigation listener as well as the content-script relay.  A
  # content script may read its own host for ordinary site-specific UI; the
  # listener is the evidence that the extension observes navigation events.

- id: extension-history-post-exfil
  desc: Extension exfiltrates history via POST body
  crit: hostile
  conf: 0.98
  for: [javascript, typescript, crx, xpi]
  scope: archive
  attack: T1041,T1555
  mbc: E1041
  all:
  - id: micro-behaviors/data/db/access::history-search
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/communications/http/post::fetch-direct-json-post-body
