defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.003,T1041
composite_rules:
  - id: python-shell-history-gzip-direct-ip-request
    desc: Shell history read and direct-IP HTTP POST
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/fs/read/file/history::python-shell-history-read-accumulate
      - id: micro-behaviors/data/compress::gzip-compress-call
      - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
      - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
