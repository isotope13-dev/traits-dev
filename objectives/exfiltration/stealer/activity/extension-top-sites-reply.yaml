defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1217

traits:
  # Bind the reply parameter to the callback passed to the top-sites API.
  # This includes handler objects shared by service workers across modules.
  - id: webextension-top-sites-reply-handler
    desc: External message handler returns top sites
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((pair
           key: (_) @handler
           value: (_
             parameters: (formal_parameters . (_) . (_) . (_) @reply)
             body: (statement_block
               [
                 (expression_statement
                   (call_expression function: (_) @api
                     arguments: (arguments . (identifier) @callback .)) @evidence)
                 (if_statement consequence: (statement_block
                   (expression_statement
                     (call_expression function: (_) @api
                       arguments: (arguments . (identifier) @callback .)) @evidence)))
               ])))
         (#match? @handler "^['\"]?onMessageExternal['\"]?$")
         (#match? @api "^(chrome|browser)\\.topSites\\.get$")
         (#eq? @reply @callback)
         (#set! cleave.ignore-comments "true"))

  - id: webextension-top-sites-registered-reply
    desc: External listener replies with browser top sites
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
           function: (_) @listener
           arguments: (arguments
             (_
               parameters: (formal_parameters . (_) . (_) . (_) @reply)
               body: (statement_block
                 (expression_statement
                   (call_expression function: (_) @api
                     arguments: (arguments . (identifier) @callback .)) @evidence)))))
         (#match? @listener "^(chrome|browser)\\.runtime\\.onMessageExternal\\.addListener$")
         (#match? @api "^(chrome|browser)\\.topSites\\.get$")
         (#eq? @reply @callback)
         (#set! cleave.ignore-comments "true"))

  - id: webextension-top-sites-promise-reply
    desc: External listener forwards top sites promise
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
           function: (_) @listener
           arguments: (arguments
             (_
               parameters: (formal_parameters . (_) . (_) . (_) @reply)
               body: (statement_block
                 (expression_statement
                   (call_expression
                     function: (member_expression
                       object: (call_expression function: (_) @api arguments: (arguments))
                       property: (property_identifier) @continuation)
                     arguments: (arguments . (identifier) @callback .)) @evidence)))))
         (#match? @listener "^(chrome|browser)\\.runtime\\.onMessageExternal\\.addListener$")
         (#match? @api "^(chrome|browser)\\.topSites\\.get$")
         (#eq? @continuation "then")
         (#eq? @reply @callback)
         (#set! cleave.ignore-comments "true"))

composite_rules:
  - id: extension-exposes-top-sites-to-web-pages
    desc: External web page can request the browser's most-visited sites
    crit: suspicious
    conf: 0.98
    for: [crx, xpi, zip, chrome-manifest, javascript, typescript]
    scope: archive
    all:
      - id: metadata/permission/manifest::externally-connectable-web-sites
      - id: metadata/permission/manifest::permission-top-sites
      - id: micro-behaviors/communications/ipc/extension-message::webextension-external-listener-registration
    any:
      - id: webextension-top-sites-reply-handler
      - id: webextension-top-sites-registered-reply
      - id: webextension-top-sites-promise-reply
