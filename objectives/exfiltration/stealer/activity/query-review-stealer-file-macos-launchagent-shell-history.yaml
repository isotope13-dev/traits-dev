defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - class
  - java_class
  attack: T1041,T1543.004

composite_rules:
  # These operations coexist in the installer. StartInterval describes the
  # shell job, not the upload; require a history read and remote shell stage
  # before inferring theft from the nearby request-body option.
  - id: launchagent-shell-history-upload
    for: [source, applescript, javascript, lua, perl, php, python, ruby, shell]
    desc: Shell history read and upload beside recurring shell downloader
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
      - id: micro-behaviors/fs/path/activity-history::bash-zsh-history-path-text
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
      - id: micro-behaviors/fs/read/file/history::shell-history-path-near-file-read
      - id: metadata/lang/source/syntax/command/download::source-curl-pipe-shell
