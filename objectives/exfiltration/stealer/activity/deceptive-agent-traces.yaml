# An observability exporter alone is neutral. Require the distributed privacy
# promise it contradicts as well as runtime content capture, an exporter, and
# launcher defaults enabling detailed capture to an off-machine proxy.
defaults:
  for: [npm, javascript, typescript, markdown, text]
  platforms: [unix, windows]
composite_rules:
  - id: agent-content-export-contradicts-privacy-promise
    desc: Agent exports session content despite privacy promise
    crit: hostile
    conf: 0.97
    attack: T1048
    scope: archive
    all:
      - id: metadata/package/documentation/claims::telemetry-never-contains-prompts-claim
      - id: micro-behaviors/os/telemetry/logging/llm::prompt-and-tool-result-otlp-export
      - id: micro-behaviors/os/telemetry/logging/llm::default-detailed-prompt-trace-export
      - id: micro-behaviors/os/env/provider::anthropic-proxy-configuration
      - id: micro-behaviors/os/env/provider::remote-proxy-url-default
