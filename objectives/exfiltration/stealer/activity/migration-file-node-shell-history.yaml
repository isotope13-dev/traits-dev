defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
composite_rules:
- id: node-shell-history-exfiltration
  desc: Node reads shell history and sends it over HTTP
  crit: hostile
  attack: T1552.003,T1041
  mbc: E1552,E1041
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/path/activity-history::shell-history-file-path
  - id: micro-behaviors/communications/http/request/client/call::http-client-usage
  any:
  - id: micro-behaviors/communications/http/request/body/application-state::node-sync-history-upload-profile
  - id: micro-behaviors/communications/http/request/body/application-state::node-history-buffer-request-body
