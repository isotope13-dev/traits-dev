defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: browser-page-url-referrer-reporting
  desc: Extension sends all-site page URLs and referrers to Google Analytics
  crit: hostile
  conf: 0.99
  attack: T1041,T1119,T1176
  for: [crx, xpi, zip, chrome-manifest, javascript]
  scope: archive
  all:
  - id: metadata/permission/host::host-permission-all-urls
  - id: metadata/permission/host::content-script-web-wildcard
  - id: micro-behaviors/communications/http/url/navigation::identified-page-referrer-access
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
  - id: micro-behaviors/communications/http/services/analytics::google-analytics-g-collect-endpoint

  # Archive scope proves only that these features are packaged together. It
  # cannot prove that Replay runs inside the all-URL content script: an
  # extension may enable Replay solely for its own popup or dashboard UI.
