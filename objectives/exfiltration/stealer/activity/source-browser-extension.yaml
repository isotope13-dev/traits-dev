defaults:
  platforms: [unix, windows]
  for: [javascript, crx, zip]
  attack: T1041

composite_rules:
  - id: extension-proxy-request-history-upload
    desc: Uploads buffered browser request history
    crit: suspicious
    conf: 0.97
    for: [crx, xpi, zip, javascript]
    scope: archive
    all:
      - id: objectives/collection/activity/browser::extension-proxy-request-history-buffer
      - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
      - id: micro-behaviors/communications/url/resource-path/collection::browser-anal-endpoint-url
      - id: micro-behaviors/os/telemetry/activity::stored-anal-json-post-body
