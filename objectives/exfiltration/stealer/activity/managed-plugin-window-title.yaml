defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-plugin-backdoor-window-title-reporting
    desc: Plugin backdoor combines window-title queries and serialized sends
    crit: hostile
    conf: 0.96
    attack: T1010,T1041
    # Coherent backdoor-client reporting profile, not proof that an arbitrary
    # Stream.Write receives the queried title. Ordinary telemetry clients
    # lack the remote plugin task/activation contract required for admission.
    all:
      - id: objectives/command-and-control/backdoor/dispatch/module::messagepack-managed-plugin-tasking
      - id: micro-behaviors/ui/window/enumerate::managed-active-window-title-api-set
      - id: micro-behaviors/data/serialize/msgpack::managed-messagepack-encode-call
      - id: micro-behaviors/data/stream/write::managed-stream-write-call
      - id: micro-behaviors/communications/tls/initialize::managed-tls-client-authenticate-call
