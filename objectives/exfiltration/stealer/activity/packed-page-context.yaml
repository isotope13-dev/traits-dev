# A packed browser redirect that selects search visitors and forwards both the
# referring page and current page URL in an encoded query parameter discloses
# browsing activity to the remote destination.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1189,T1041

composite_rules:
  - id: packed-search-redirect-reports-page-urls
    desc: Packed search redirect sends page and referrer URLs remotely
    crit: hostile
    conf: 0.94
    near_bytes: 6000
    all:
      - id: micro-behaviors/communications/http/url/navigation::charcode-concealed-referrer
      - id: micro-behaviors/communications/http/url/navigation::charcode-concealed-document-location
      - id: metadata/file/encoding::decimal-search-engine-labels
      - id: micro-behaviors/communications/http/url/navigation::charcode-concealed-remote-url
      - id: micro-behaviors/ui/window/navigation::charcode-concealed-location-assignment
