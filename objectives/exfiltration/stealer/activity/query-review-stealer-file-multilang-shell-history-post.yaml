defaults:
  crit: hostile
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf
  attack: T1041

composite_rules:
# Go uses the data-flow rule below; nearby reads and POSTs alone do not
# prove that shell-history bytes enter the request.
- id: launchagent-loader-history-http-post
  desc: LaunchAgent loader posts shell history
  conf: 0.98
  for:
  - scripts
  - source
  - "!go"
  platforms:
  - linux
  - macos
  - windows
  attack: T1552.003,T1041
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/read/file/history::shell-history-path-near-file-read
  - id: micro-behaviors/os/service/launchd/config::source-runatload-key
  - id: micro-behaviors/os/service/launchagent::source-startinterval-key
  - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
  any:
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
- id: jvm-shell-history-http-post
  desc: JVM sends shell history by HTTP POST
  conf: 0.99
  for:
  - class
  - java_class
  platforms:
  - linux
  - macos
  - windows
  attack: T1552.003,T1041
  all:
  - id: micro-behaviors/fs/path/activity-history::shell-history-file-reference
  - id: micro-behaviors/fs/read/file/content/whole::java-readallbytes
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
  - id: micro-behaviors/os/service/launchagent::jvm-runatload-enabled-string
  - id: micro-behaviors/os/service/launchagent::jvm-startinterval-string
  - id: metadata/binary/code/bytecode::jvm-curl-pipe-shell-string
- id: perl-launchagent-history-http-post
  desc: Perl shell-history reads accompany HTTP POST and LaunchAgent code
  conf: 0.98
  for: [perl]
  platforms: [macos]
  attack: T1552.003,T1041
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/read/file/history::shell-history-path-near-file-read
  - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
  - id: micro-behaviors/data/control-flow/dispatch/named::post-named-call
  - id: micro-behaviors/os/service/launchd/config::embedded-runatload-key
  any:
  - id: micro-behaviors/communications/http/client/initialize::perl-http-tiny-client
  - id: micro-behaviors/communications/http/request/body/construction::perl-http-post-content-map
- id: shell-history-http-exfil
  desc: Shell history HTTP exfil
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/file/history::history-reference-with-file-read
  - id: objectives/exfiltration/http/collect::native-collect-http-post
- id: go-history-upload-launchagent-loader
  desc: History upload accompanies LaunchAgent shell loader
  conf: 0.98
  for:
  - go
  platforms:
  - macos
  attack: T1041,T1543.004
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/request/body/application-state::go-shell-history-http-body
  - id: micro-behaviors/os/service/launchagent::source-launchagent-load
  - id: micro-behaviors/os/service/launchd/config::source-runatload-key
  - id: micro-behaviors/fs/write/file/full/string::go-writes-download-shell-pipeline
