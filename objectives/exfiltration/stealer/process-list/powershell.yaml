defaults:
  platforms: [unix, netbsd, windows]
  for: [powershell]
  attack: T1041

composite_rules:
  - id: ps-process-monitor-http-exfil
    desc: PS process monitor exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/discovery/host/process::ps-process-monitor-function
      - id: objectives/discovery/host/inventory::ps-json-stage-output
      - id: objectives/exfiltration/http/report::ps-collect-post-exfil
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-or-upload
