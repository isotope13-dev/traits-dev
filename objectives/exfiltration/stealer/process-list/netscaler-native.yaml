defaults:
  platforms: [netscaler, appliance, unix]
  for: [c, elf]
  attack: T1041

traits:

composite_rules:
  - id: native-proc-cmdline-enum
    for: [elf]
    desc: Native proc cmdline enum
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-cmdline-template
    any:
      - id: micro-behaviors/os/env/read::native-environ-reference
      - id: objectives/command-and-control/beacon/network/periodic::python-post-beacon-request
  - id: native-netscaler-system-http-exfil
    desc: Native NetScaler system HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/beacon/network/periodic::python-post-beacon-request
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header
    any:
      - id: micro-behaviors/os/env/read::native-environ-reference
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-cmdline-template
  - id: native-netscaler-proc-http-exfil
    for: [elf]
    desc: Native NetScaler proc HTTP exfil
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-cmdline-template
      - id: objectives/command-and-control/beacon/network/periodic::python-post-beacon-request
