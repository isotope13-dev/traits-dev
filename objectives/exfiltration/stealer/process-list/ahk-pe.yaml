defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

traits:

- id: ahk-processlist-send
  desc: AutoHotkey process list exfil send
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: 'http.Send("v=" processList)'

- id: ahk-processlist-error-send
  desc: AutoHotkey process enum error beacon
  crit: suspicious
  conf: 0.98
  if:
    type: text
    exact: 'http.Send("v=e!")'

composite_rules:
- id: ahk-process-inventory-http-exfil
  desc: AutoHotkey process inventory HTTP exfiltration
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/discovery/host/process::ahk-wmi-process-inventory
  - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
  - id: micro-behaviors/communications/http/post::url-encoded-content-type
  - id: ahk-processlist-send
  any:
  - id: objectives/exfiltration/http/report::ahk-process-post-open
  - id: objectives/command-and-control/infrastructure/domain/malicious::short-domain-url-pattern
- id: ahk-process-inventory-failure-beacon
  desc: AutoHotkey process recon failure beacon
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/discovery/host/process::ahk-wmi-process-inventory
  - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
  - id: objectives/exfiltration/http/report::ahk-process-post-open
  - id: micro-behaviors/communications/http/post::url-encoded-content-type
  - id: ahk-processlist-error-send
