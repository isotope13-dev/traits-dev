defaults:
  platforms: [unix]
  for: [shell]
  attack: T1041

composite_rules:
  - id: shell-macos-process-http-exfil
    desc: Shell macOS process HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::shell-curl-stdin-collect
    any:
      - id: micro-behaviors/process/enumerate/shell::shell-macos-process-inventory
      - id: objectives/discovery/host/software::shell-macos-kext-launch-list
    needs: 1
