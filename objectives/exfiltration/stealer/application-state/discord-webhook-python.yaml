# Browser and wallet collection sent to a Discord webhook in script languages.
# The endpoint is deliberately modeled as a transport shape, not as any one
# campaign domain: future stealers can change hosting while retaining the flow.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, unix]
  for: [python]
  attack: "T1555.003,T1041,T1567.002"
  mbc: "B0028"

composite_rules:
  - id: python-browser-discord-webhook-exfiltration
    desc: Python browser data sent to Discord webhook
    all:
      - id: micro-behaviors/os/application/target/browser::browser-store-or-card-collection-references
      - id: micro-behaviors/fs/file/open/read::file-read-call
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-api-path
      - id: micro-behaviors/communications/http/post::requests-post


