    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: js-sessionstorage-webhookrelay-exfil
  for: [javascript]
  desc: Browser sessionStorage WebhookRelay exfil
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/exfiltration/oob/callback::browser-sessionstorage-webhookrelay-exfil
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-local-storage
  - id: micro-behaviors/data/parse/html::dom-body-text-substring
  - id: micro-behaviors/os/env/config::browser-app-config-global
  needs: 1
- id: html-android-bridge-callback-exfil
  for: [html]
  desc: HTML abuses Android JS bridge and exfiltrates callback data
  crit: hostile
  conf: 0.96
  attack: T1411,T1041
  near_lines: 40
  all:
  - id: micro-behaviors/process/interpreter/webview::javascript-android-bridge-call
  - id: micro-behaviors/communications/http/request/html::html-fetch-call
  - id: micro-behaviors/data/encode/url::encode-uri-component-text-call
  unless:
  - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: js-csp-prefetch-skimmer
  for: [javascript]
  desc: CSP-aware browser skimmer steals cookies and exfiltrates
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/header/security::csp-response-header-read
  - id: micro-behaviors/ui/window/dom/create::document-head-append
  - id: micro-behaviors/data/encode/base64::btoa-utf8-safe-encode
  any:
  - id: micro-behaviors/data/control-flow/branch::activation-hour-gate
  - id: micro-behaviors/communications/ip/literal::local-ip-or-localhost-guard
  - id: objectives/anti-static/obfuscation/obfuscator/signature::obfuscated-char-map-pool
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
# The XHR spelling of the skimmer: every cookie swept and handed to a
# ready-state-callback transport. The fetch-based skimmer above requires a
# POST body; trackers built on XMLHttpRequest never show one, so the harvest
# rides an XHR that fires on state change.
#
# Worked example: the trojanized Great Suspender build, whose injected
# tracker sweeps document.cookie and beacons it home from an XHR handler
# while it also records keystrokes.
#
# The sweep and the transport must be the same code (near_bytes), or the rule
# is a file-wide coincidence between two idioms that every web bundle
# contains: `document.cookie.split(';')` is the body of every hand-rolled
# `getCookie`, and `.onreadystatechange` is set by every hand-rolled XHR
# wrapper (see that trait's own note). Paddle's checkout library, vendored as
# ameliabooking's public/js/paddle/paddle.js, has its `getCookie` helper 11 KB
# away from the nearest readystatechange handler.
    - id: "metadata/file/naming::test-directory-component"
