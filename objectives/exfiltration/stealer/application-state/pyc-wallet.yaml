defaults:
  for: [pyc]
  platforms: [windows, unix]
composite_rules:
  - id: pyc-wallet-browser-webhook-collector
    desc: Wallet and file-upload references in credential webhook collector
    crit: hostile
    conf: 0.98
    attack: T1005,T1567.002
    all:
      - id: micro-behaviors/fs/path/wallet::exodus-wallet-file-reference
      - id: micro-behaviors/communications/http/upload::gofile-upload-api-path
      - id: objectives/credential-access/browser/chromium::pyc-password-query-decrypt-webhook-client
