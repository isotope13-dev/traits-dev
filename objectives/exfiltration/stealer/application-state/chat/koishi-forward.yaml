traits:
  - id: bot-forwards-incoming-content-to-fixed-peer
    desc: Forwards incoming chat to hardcoded peer
    crit: suspicious
    conf: 0.99
    platforms: [unix, windows]
    for: [javascript, typescript]
    attack: T1114,T1041
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression function: (member_expression property: (property_identifier) @on)
          arguments: (arguments (string (string_fragment) @event)
            (arrow_function parameters: (formal_parameters (identifier) @session)
              body: (statement_block
                (_ (variable_declarator name: (identifier) @content
                  value: (call_expression function: (member_expression
                    object: (member_expression object: (identifier) @source
                      property: (property_identifier) @content_field)
                    property: (property_identifier) @replace))))
                (if_statement consequence: (statement_block
                  (expression_statement (call_expression function: (member_expression
                    object: (member_expression object: (identifier) @forwarder
                      property: (property_identifier) @bot)
                    property: (property_identifier) @send)
                    arguments: (arguments (string (string_fragment) @peer)
                      (identifier) @sent))))))))
          (#eq? @on "on") (#eq? @event "message")
          (#eq? @session @source) (#eq? @session @forwarder)
          (#eq? @content_field "content") (#eq? @replace "replace")
          (#eq? @bot "bot") (#eq? @send "sendPrivateMessage")
          (#match? @peer "^[0-9]{7,}$") (#eq? @content @sent))
