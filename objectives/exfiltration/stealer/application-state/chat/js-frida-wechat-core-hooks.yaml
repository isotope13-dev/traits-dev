# A Frida JavaScript agent that hooks the WeChat core DLL while it loads. The
# agent sits in the instrumented client, so its hooks can read login and session
# material. The composite reads only the same JavaScript file.
defaults:
  for: [javascript]
  platforms: [windows]
  crit: notable
  conf: 0.9

composite_rules:
  - id: frida-agent-wechat-core-hooks
    desc: Frida agent hooks WeChat core module exports on load
    crit: hostile
    conf: 0.9
    attack: T1528
    scope: file
    all:
      - id: micro-behaviors/process/hook/instrumentation::frida-native-interceptor-hook
      - id: micro-behaviors/process/hook/instrumentation::frida-module-observer
      - id: micro-behaviors/os/application/target/network::wechat-core-module-literal
