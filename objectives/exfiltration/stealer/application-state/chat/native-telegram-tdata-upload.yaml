# Compiled counterpart of rust-telegram-session-archive-upload: a native
# module that embeds the Telegram Desktop tdata session path, a ZIP writer
# and a Telegram bot document upload packages the session store and sends it
# to a bot chat. Holding tdata lets the receiver open the victim's account.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, so, dylib, dll]
  attack: T1539,T1560.001,T1567

composite_rules:
  - id: native-telegram-tdata-zip-bot-upload
    desc: Native code zips Telegram tdata and uploads to bot
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/token::compiled-telegram-support-tdata-path
      - id: micro-behaviors/data/archive/zip::rust-zipwriter-compiled-reference
      - id: micro-behaviors/communications/http/services/telegram::teloxide-compiled-document-upload
