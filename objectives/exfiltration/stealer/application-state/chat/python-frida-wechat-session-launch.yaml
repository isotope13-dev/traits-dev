# A script that launches the WeChat desktop client suspended, attaches Frida
# before the client runs, and then resumes it. The attach-and-resume capability
# is suspicious on its own; the WeChat target turns it into a messaging-session
# access path. The composite reads only the same Python file.
defaults:
  for: [python]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: wechat-client-executable-literal
    desc: Python source names WeChat.exe
    if:
      type: text
      substr: WeChat.exe

composite_rules:
  - id: frida-wechat-suspended-session-launch
    desc: Frida instruments a suspended WeChat client launch
    crit: hostile
    conf: 0.9
    attack: T1528
    scope: file
    all:
      - id: micro-behaviors/process/attach/debugger::frida-attach-suspended-launch-resume
      - id: wechat-client-executable-literal
      - id: micro-behaviors/process/debug/tool-markers::python-frida-reference
