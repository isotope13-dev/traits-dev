defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: obfuscated-node-telegram-session-multipart-collector
    desc: Obfuscated credential uploader also collects Telegram session data
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    for: [javascript]
    all:
      - id: micro-behaviors/fs/path/application/messaging::telegram-desktop-data-path
      - id: micro-behaviors/communications/url/encoded::lower-first-telegram-document-api-fragments
      - id: objectives/exfiltration/stealer/credential/sweep::obfuscated-credential-tree-multipart-collector

  # A Telegram Desktop session store can be identified from its tdata
  # directory and key_datas/hex-named session-file selectors even when the
  # collector walks drive roots instead of spelling the application path.
  # Requiring filesystem enumeration, archive creation and Telegram's bot
  # document-upload API distinguishes session theft from ordinary backups.
  - id: node-telegram-tdata-session-archive-upload
    desc: Archives Telegram sessions and uploads them to a bot
    crit: hostile
    conf: 0.99
    attack: T1539,T1560.001,T1041
    all:
      - id: micro-behaviors/fs/path/application/messaging::node-telegram-session-file-selector
      - id: micro-behaviors/fs/directory/async-enumeration::node-readdir-async-call
      - id: objectives/collection/archive/create::archiver-zip-string-table-writer
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload

  - id: node-telegram-session-archive-secret-uploader
    desc: Secret uploader also sends Telegram session archives
    crit: hostile
    conf: 0.99
    attack: T1555,T1041
    all:
      - id: micro-behaviors/fs/path/credential/application::telegram-tdata-path-parts
      - id: micro-behaviors/communications/http/request/body/file::node-file-bytes-as-gzip-post-body
      - id: objectives/exfiltration/stealer/configuration/environment/file-source::node-dotenv-contents-external-upload
