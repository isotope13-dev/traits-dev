# A remote-directed agent logs into a site with supplied credentials, reads the
# resulting browser storage state, and sends it back over its message channel.
# Each leg is dual-use alone; the file-scope conjunction is the session relay.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1539,T1041

composite_rules:
  - id: js-browser-session-state-relay
    desc: Relays browser session state after automated password login
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/communications/http/browser-automation::browser-storage-state-read
      - id: micro-behaviors/communications/http/browser-automation::storage-state-sent-via-message
      - id: micro-behaviors/ui/window/password-field::browser-password-entry
