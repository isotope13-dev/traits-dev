defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - whl
  - python-sdist
  - zip
  conf: 0.95
composite_rules:
- id: browser-storage-discord-webhook-clues
  desc: Browser storage and Discord webhook references
  conf: 0.96
  scope: archive
  all:
  - id: micro-behaviors/communications/http/webhook::discord-webhook-api
  any:
  - id: micro-behaviors/fs/path/app-data/browser::chromium-leveldb-local-storage
  - id: micro-behaviors/fs/path/app-data/platform::local-storage-ref
  crit: suspicious
