defaults:
  platforms: [unix, windows]
  for: [javascript, crx, zip]
  attack: T1041

composite_rules:
  - id: all-site-pageview-exfiltration
    desc: All-site extension uploads pageview telemetry
    crit: hostile
    conf: 0.99
    for: [crx, zip, chrome-manifest, javascript, html]
    scope: archive
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: micro-behaviors/communications/url/navigation-http::browser-page-url-referrer-read
      - id: objectives/collection/monitor/tracking::pageview-runtime-dispatch
      - id: micro-behaviors/os/telemetry/activity::pageview-report-fields
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
  - id: all-url-browsing-activity-report
    desc: All-URL extension relays data with an embedded credential
    crit: hostile
    conf: 0.98
    attack: T1041,T1217
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/dom::content-script-all-urls
      - id: micro-behaviors/os/telemetry/activity::browsing-activity-record-fields
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/decode/jwt::jwt-token-prefix

