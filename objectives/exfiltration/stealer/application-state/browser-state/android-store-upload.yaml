defaults:
  platforms: [android, unix]
  for: [c, cpp, javascript, typescript, python, go]
  crit: suspicious
  conf: 0.94

composite_rules:
  - id: android-browser-store-read-upload
    desc: Android browser-store path near file reads and HTTP bodies
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/application/browser/storage::android-chromium-store-path
      - id: micro-behaviors/fs/read/file/content/unspecified::source-file-content-read-api
      - id: micro-behaviors/communications/http/upload/body::source-http-body-send
