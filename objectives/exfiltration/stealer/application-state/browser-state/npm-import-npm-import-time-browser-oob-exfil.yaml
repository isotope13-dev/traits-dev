defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, zip, tar]
composite_rules:
- id: npm-import-time-browser-oob-exfil
  desc: npm entry module exfiltrates browser data on import
  conf: 0.995
  attack: T1195.002,T1041
  scope: archive
  all:
  - id: metadata/package/entrypoint/module::npm-root-javascript-source-member
  - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/communications/http/request/client::module-execution-http-call
  any:
  - id: objectives/exfiltration/stealer/application-state/cookie/browser-api::js-browser-cookie-oob-navigation-exfil
  - id: objectives/exfiltration/http/report::authenticated-response-oob-navigation-exfil
  needs: 1
