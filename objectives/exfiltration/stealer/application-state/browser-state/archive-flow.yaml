# Browser profile archive export, not proof that a password was decrypted or
# that every cookie authenticates a session. Destination and output name vary.
defaults:
  for: [python]
  platforms: [linux, macos, windows]
  attack: T1005,T1560.001,T1041
traits:
  - id: python-browser-profile-archive-multipart-export
    desc: Uploads an archive made from browser profiles
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(post|put)$'
      arg:
        from:
          field: files
          call: '^shutil\.make_archive$'
          argument: 2
          literal: '(?i)[/\\](Chrome|Chromium|Edge)[/\\]+User Data([/\\]|$)'
          through:
            - call: '^open$'
              arguments: [0]
  - id: python-firefox-profile-archive-multipart-export
    desc: Uploads an archive made from Firefox profiles
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(post|put)$'
      arg:
        from:
          field: files
          call: '^shutil\.make_archive$'
          argument: 2
          literal: '(?i)(^|[/\\])Mozilla[/\\]+Firefox[/\\]+Profiles([/\\]|$)'
          through:
            - call: '^open$'
              arguments: [0]
