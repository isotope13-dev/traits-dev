# Browser cookie or history query indicators, WinHTTP flow, and an outbound
# MAC-address field co-occur in a compiled Windows binary.
#
# Two halves, both required:
#
#   source    -- Firefox cookie-query or browsing-history-query indicators.
#   transport -- a complete WinHTTP request/response flow, plus a host
#                fingerprint (MAC address) placed in the outbound query string.
#
# The fingerprint parameter is what separates this from a browser-import or
# migration utility: an importer moves cookies into local storage and has no
# reason to identify the machine to a server. Collection plus transport plus
# host identity is the stealer shape.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1539,T1041
  mbc: B0028

composite_rules:
  - id: native-browser-cookie-or-history-http-exfil
    desc: Native HTTP client with browser cookie or history query
    crit: hostile
    conf: 0.96
    attack: T1539,T1041,T1555.003
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/communications/http/message::urlencoded-mac-address-field
    any:
      - id: micro-behaviors/data/db/read/records::firefox-profile-cookie-query
      - id: micro-behaviors/data/db/read/records::firefox-history-query-context
