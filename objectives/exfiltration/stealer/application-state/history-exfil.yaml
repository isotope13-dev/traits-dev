# Browser navigation/history sources with probable remote transfer.
# The stronger interception signatures also require local storage interfaces.
# Encryption alone is not storage; source/record construction and channel
# observations are required independently. These are static capability inferences.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

composite_rules:
- id: extension-tab-visited-url-exfil
  desc: Exfiltrates visited URLs from tab events
  crit: hostile
  conf: 0.93
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/url/navigation::url-object-host-read
  - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
  - id: micro-behaviors/data/db/web-storage::browser-local-storage-interfaces
  - id: micro-behaviors/browser-extension/tabs::tab-event-host-read
  any:
  - id: micro-behaviors/data/serialize/json::visited-url-before-json-serialization
  - id: micro-behaviors/data/serialize/json::json-serialization-before-visited-url
  - id: micro-behaviors/communications/http/request/body::visited-url-before-request-body
  - id: micro-behaviors/communications/http/request/body::request-body-before-visited-url
  unless:
  - id: micro-behaviors/process/hook/webextension::content-filter-request-blocking
  - id: well-known/app/ai/browser-agent/webbrain::webbrain-ai-agent-context
  - id: well-known/dual-use/tunnel/vpn-browser::vpn-browser-extension-context
- id: extension-request-host-upload
  desc: Uploads intercepted visited hosts
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/url/navigation::url-object-host-read
  - id: micro-behaviors/process/hook/webextension::chrome-webrequest-pre-request
  - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
  unless:
  - id: micro-behaviors/process/hook/webextension::content-filter-request-blocking
  - id: well-known/dual-use/tunnel/vpn-browser::vpn-browser-extension-context
  - id: micro-behaviors/communications/ip/endpoint::fetch-loopback-http-url
  - id: micro-behaviors/communications/http/url/host::loopback-client-url-cooccurrence
  any:
  - id: micro-behaviors/data/serialize/json::visited-url-before-json-serialization
  - id: micro-behaviors/data/serialize/json::json-serialization-before-visited-url
  - id: micro-behaviors/communications/http/request/body::visited-url-before-request-body
  - id: micro-behaviors/communications/http/request/body::request-body-before-visited-url
- id: extension-all-urls-surveillance-package
  desc: All-URL extension intercepts and uploads visited domains
  crit: hostile
  conf: 0.95
  scope: archive
  for:
  - crx
  - xpi
  - zip
  - chrome-manifest
  - javascript
  all:
  - id: metadata/permission/manifest::permission-all-urls
  - id: objectives/exfiltration/stealer/activity::extension-visited-domain-history-exfil
  unless:
  - id: micro-behaviors/process/hook/webextension::content-filter-request-blocking
  - id: well-known/app/ai/browser-agent/webbrain::webbrain-ai-agent-context
  - id: well-known/dual-use/tunnel/vpn-browser::vpn-browser-extension-context
- id: extension-all-urls-browsing-activity-upload
  desc: All-URL extension uploads recorded browsing activity
  crit: hostile
  conf: 0.98
  attack: T1041,T1217
  scope: archive
  for: [crx, xpi, zip, chrome-manifest, javascript]
  all:
  - id: metadata/permission/manifest::host-permission-all-urls
  - id: micro-behaviors/os/telemetry/activity::browsing-activity-record-fields
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
