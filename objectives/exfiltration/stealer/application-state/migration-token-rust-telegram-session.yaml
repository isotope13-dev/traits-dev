defaults:
  platforms: [unix, windows]
  for: [rust, crate]
  crit: hostile
  conf: 0.97
  attack: T1041,T1567
composite_rules:
# Some implementations recurse with std::fs instead of walkdir. This describes
# an upload facility beside collection without binding the archive to the sink.
- id: rust-appdata-archive-fixed-multipart-upload
  desc: App-data archive beside fixed bot file uploader
  scope: file
  all:
  - id: objectives/collection/archive/create::rust-sensitive-appdata-zip-staging
  - id: micro-behaviors/fs/file/open/unspecified::rust-file-open
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
  - id: micro-behaviors/communications/http/services/telegram::telegram-send-document-url
  - id: micro-behaviors/communications/http/request/body/multipart::rust-multipart-file-field
  - id: micro-behaviors/communications/http/post::rust-reqwest-post-call

