# setup.py install override that uploads a found Telegram userbot .session as
# a multipart file (zenomenallib).
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: setup-install-telegram-session-file-upload
    desc: setup.py install hook uploads Telegram session file
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    all:
      - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
      - id: micro-behaviors/fs/path/token::hikka-userbot-directory-literal
      - id: micro-behaviors/data/string/compare::python-session-suffix-test
      - id: micro-behaviors/communications/http/upload/file::python-http-files-parameter
