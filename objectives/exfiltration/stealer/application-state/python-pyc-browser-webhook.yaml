defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1555.003,T1539,T1567

traits:
  - id: pyc-browser-cookie-collector
    desc: Bytecode names browser cookie collection
    crit: notable
    if:
      type: symbol
      kind: identifier
      # extract_cookies is the stdlib http.cookiejar.CookieJar method that
      # requests and urllib call on every response; it is not collection.
      regex: '^(get|collect)_cookies$'
  - id: pyc-browser-login-collector
    desc: Bytecode names browser login collection
    crit: notable
    if:
      type: symbol
      kind: identifier
      regex: '^(get|extract|collect)_login_data$'
  - id: pyc-discord-sync-webhook
    desc: Bytecode references Discord sync webhook
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: SyncWebhook

composite_rules:
  - id: pyc-browser-secrets-discord-webhook
    desc: Bytecode combines browser secret collection and webhook
    crit: hostile
    conf: 0.98
    all:
      - id: pyc-browser-cookie-collector
      - id: pyc-browser-login-collector
      - id: pyc-discord-sync-webhook
      - id: micro-behaviors/data/archive/zip::pyc-zipfile-identifier
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: metadata/lang/source/naming/resource::credit-cards-collection-token
