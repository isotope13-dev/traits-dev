defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-send-gettext-result
    desc: Passes a getText result to send
    crit: component
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: send
      arg:
        index: 0
        from:
          call: '^getText$'

composite_rules:
  # The argument provenance excludes status-only sends beside a local text
  # read. Proximity to the accessibility getter identifies the UI context,
  # without claiming that every getText result came from the active tree.
  - id: android-accessibility-websocket-text-export
    desc: Accessibility reads near WebSocket text export
    crit: suspicious
    conf: 0.96
    attack: T1041,T1513
    near_lines: 14
    all:
      - id: android-send-gettext-result
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-tree-root-method
      - id: micro-behaviors/communications/websocket/send::android-source-websocket-send-call
