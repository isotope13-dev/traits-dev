defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  attack: T1041
  mbc: B0028
composite_rules:
- id: js-etherhiding-chromium-json-exfil
  desc: Chromium credentials sent to Ethereum-resolved endpoint
  crit: hostile
  conf: 0.995
  attack: T1555.003,T1041
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  near_bytes: 1400
  all:
  - id: objectives/credential-access/browser/chromium::chromium-profile-credential-query
  - id: objectives/command-and-control/channel/deaddrop/blockchain::ethereum-eth-call-c2-routing
- id: js-stealer
  desc: Chromium browser credential stealer (SQLite + HTTP POST)
  crit: suspicious
  conf: 0.98
  attack: T1555.003
  for:
  - javascript
  all:
  - id: micro-behaviors/data/db/read/column::chromium-login-sql
  - id: micro-behaviors/communications/http/post::axios-post-call
- id: js-obfuscated-oauth-storage-fetch-exfil
  desc: Obfuscated browser token snapshot beside authenticated fetch
  crit: hostile
  conf: 0.98
  attack: T1555.003,T1041
  # Obfuscated scripts hidden under data suffixes (.pbf, .dat) classify as text.
  for:
  - javascript
  - typescript
  - text
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
  - id: micro-behaviors/communications/http/request/credentials/application-state::browser-token-snapshot-beside-authenticated-fetch
  unless:
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
- id: telegram-web-localstorage-stringify-exfil
  desc: Serializes Telegram Web localStorage state and POSTs it before clearing storage
  crit: hostile
  conf: 0.99
  attack: T1539,T1041
  for:
  - javascript
  all:
  - id: micro-behaviors/data/serialize/json::json-stringify-local-storage
  - id: micro-behaviors/communications/http/post::xhr-post-open-send
  - id: objectives/credential-access/messaging::telegram-web-storage-clear
