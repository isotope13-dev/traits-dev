defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1555.003,T1539,T1567

traits:
  - id: pyc-sqlite-identifier
    desc: Bytecode references sqlite3
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: sqlite3
  - id: pyc-fetchall-identifier
    desc: Bytecode references fetchall
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: fetchall

composite_rules:
  - id: pyc-chromium-credential-webhook
    desc: Bytecode combines browser secrets and webhook
    crit: hostile
    conf: 0.98
    all:
      - id: pyc-sqlite-identifier
      - id: pyc-fetchall-identifier
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/post::pyc-post-identifier
