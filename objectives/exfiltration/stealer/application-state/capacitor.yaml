# WebView and browser origin-confusion / XSS state and native-bridge exfiltration.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript, html]

composite_rules:
  - id: capacitor-proxy-delivery-storage-export
    desc: Capacitor proxy delivery exports Web Storage
    crit: suspicious
    conf: 0.96
    attack: T1203,T1041
    all:
      - id: micro-behaviors/communications/http/request/body/application-state::off-origin-web-storage-json-post
    any:
      - id: objectives/execution/exploit/origin-confusion::capacitor-deeplink-proxy-origin-bypass
      - id: objectives/execution/exploit/origin-confusion::capacitor-document-proxy-origin-bypass

  # Multi-store DOM origin + cookie + Web Storage harvesting posted off-origin as JSON.
  # Legitimate apps rely on browser Cookie headers or Authorization headers rather than
  # bundling location.origin, document.cookie, and Web Storage into a JSON POST body.
  - id: browser-origin-cookie-storage-post
    desc: Origin, cookie, and storage posted off-origin
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    all:
      - id: micro-behaviors/communications/url/navigation-http::browser-location-origin-read
      - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
      - id: micro-behaviors/communications/http/request/body/application-state::off-origin-web-storage-json-post
    unless:
      - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus

  # Hybrid WebView JS-to-native plugin bridge access (Capacitor, WKWebView, Cordova,
  # React Native WebView, WebView2, Android JavascriptInterface) paired with off-origin
  # JSON POST exfiltration alongside session cookies, private/OOB collector, or proxy delivery.
  - id: webview-bridge-state-http-exfil
    desc: Hybrid WebView bridge data posted off-origin
    crit: hostile
    conf: 0.97
    attack: T1411,T1041
    all:
      - id: micro-behaviors/communications/ipc/bridge::hybrid-webview-js-bridge
      - id: micro-behaviors/communications/http/request/body/application-state::off-origin-http-json-post
    any:
      - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
      - id: micro-behaviors/communications/ip/literal::private-ipv4-http-url
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: objectives/execution/exploit/origin-confusion::capacitor-deeplink-proxy-origin-bypass
      - id: objectives/execution/exploit/origin-confusion::capacitor-document-proxy-origin-bypass
    unless:
      - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus

  # Origin-confusion pages harvest host-native data through the victim app's
  # registered Capacitor plugins: standard Geolocation, Device and Filesystem
  # plugin calls returning location, device profile and app-private file
  # contents to the WebView. Those results posted off-origin over cleartext
  # HTTP, beside a collector/delivery marker, extend the bridge exfil above to
  # the sensing surface a real victim app exposes (the PulseDesk reproduction
  # traced device profile, assignment, location and attachment plugins).
  - id: webview-bridge-native-plugin-exfil
    desc: Native plugin data posted off-origin
    crit: hostile
    conf: 0.97
    attack: T1005,T1041
    all:
      - id: micro-behaviors/communications/ipc/bridge::capacitor-native-data-plugin-call
      - id: micro-behaviors/communications/http/request/body/application-state::off-origin-http-json-post
    any:
      - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
      - id: micro-behaviors/communications/ip/literal::private-ipv4-http-url
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: objectives/execution/exploit/origin-confusion::capacitor-deeplink-proxy-origin-bypass
      - id: objectives/execution/exploit/origin-confusion::capacitor-document-proxy-origin-bypass
    unless:
      - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus
