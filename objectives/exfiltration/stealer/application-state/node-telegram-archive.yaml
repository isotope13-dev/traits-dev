defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-telegram-session-archive-secret-uploader
    desc: Secret uploader also sends Telegram session archives
    crit: hostile
    conf: 0.99
    attack: T1555,T1041
    all:
      - id: micro-behaviors/fs/path/token::telegram-tdata-path-parts
      - id: micro-behaviors/communications/http/request/body/file::node-file-bytes-as-gzip-post-body
      - id: objectives/exfiltration/stealer/configuration/environment::node-dotenv-contents-external-upload
