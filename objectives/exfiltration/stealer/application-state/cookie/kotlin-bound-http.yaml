defaults:
  platforms:
  - macos
  for:
  - kotlin
  crit: hostile
  conf: 0.99
  attack: T1539,T1041
composite_rules:
- id: kotlin-browser-cookie-http-exfil
  desc: Kotlin exports Chrome cookie-store bytes
  all:
  - id: kotlin-cookie-bytes-http-body
  - id: micro-behaviors/communications/url/host/name::dynamic-routing-host-reference
  near_bytes: 4096
traits:
- id: kotlin-cookie-bytes-http-body
  desc: Kotlin cookie bytes bound to HTTP body
  crit: suspicious
  size_max: 200000
  if:
    type: yara
    source: |
      rule kotlin_cookie_bound_http_body {
       strings:
        $shadow = /\b(val|var)[ \t]+/
        $routine = /\bfun[ \t]+[A-Za-z_][A-Za-z0-9_]{0,63}[ \t]*\(/
        $decl = /\bval [A-Za-z_][A-Za-z0-9_]{0,63} = /
        $connection = /\bval [A-Za-z_][A-Za-z0-9_]{0,63} = java\.net\.URL\([^)\r\n]{1,180}\)\.openConnection\(\)[ \t\r\n]*as java\.net\.HttpURLConnection/
        $post = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.requestMethod = \x22POST\x22/
        $out = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.doOutput = true/
        $send_name = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.outputStream/
        $send = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.outputStream\.use[ \t\r\n]*\{[ \t\r\n]*/
        $write = /\bit\.write\(\x22[^)\r\n]{1,1000}\x22\.toByteArray\(\)\)/
        $value = /\$[A-Za-z_][A-Za-z0-9_]{0,63}/
        $source = /if[ \t\r\n]*\(Files\.exists\([A-Za-z_][A-Za-z0-9_]{0,63}\)\)[ \t\r\n]*\{[ \t\r\n]*java\.util\.Base64\.getEncoder\(\)\.encodeToString\([ \t\r\n]*Files\.readAllBytes\([A-Za-z_][A-Za-z0-9_]{0,63}\)(\.copyOfRange\([ \t\r\n]*0,[ \t\r\n]*minOf\([0-9]{1,9},[ \t\r\n]*Files\.size\([A-Za-z_][A-Za-z0-9_]{0,63}\)\.toInt\(\)\)\))?\)[ \t\r\n]*\}[ \t]*else[ \t]*\x22\x22/
        $path = /\bval [A-Za-z_][A-Za-z0-9_]{0,63} = Paths\.get\(System\.getProperty\(\x22user\.home\x22\),[ \t\r\n]*\x22Library\/Application Support\/Google\/Chrome\/[^"\r\n]{1,160}\/Cookies\x22\)/
        $read = /Files\.readAllBytes\([A-Za-z_][A-Za-z0-9_]{0,63}\)/
       condition:

      all of them and
      for any s in (1..#source) : (
       for any d in (1..#decl) : (
        @decl[d]+!decl[d] == @source[s] and
        for any c in (1..#connection) : (
         @connection[c] > @source[s]+!source[s] and
         @connection[c] - @source[s] < 4096 and
         for any cd in (1..#decl) : (
          @decl[cd] == @connection[c] and
          for any sn in (1..#send_name) : (
           @send_name[sn] > @connection[c]+!connection[c] and
           @send_name[sn] - @connection[c] < 2048 and
           !decl[cd]-7 == !send_name[sn]-13 and
      for all n in (0..!decl[cd]-7-1) : (
       uint8(@decl[cd]+4+n) == uint8(@send_name[sn]+0+n)
      ) and
           for any se in (1..#send) : (
            @send[se] == @send_name[sn] and
            for any w in (1..#write) : (
             @write[w] == @send[se]+!send[se] and
      for all sd in (1..#shadow) : (
       not (@shadow[sd] > @source[s] and @shadow[sd] < @write[w] and
        for all z in (0..!decl[d]-7-1) : (
         uint8(@shadow[sd]+!shadow[sd]+z) == uint8(@decl[d]+4+z)
        ) and (
         uint8(@shadow[sd]+!shadow[sd]+!decl[d]-7) == 0x20 or
         uint8(@shadow[sd]+!shadow[sd]+!decl[d]-7) == 0x09 or
         uint8(@shadow[sd]+!shadow[sd]+!decl[d]-7) == 0x3d or
         uint8(@shadow[sd]+!shadow[sd]+!decl[d]-7) == 0x3a
        )
       )
      ) and
      for all sc in (1..#shadow) : (
       not (@shadow[sc] > @connection[c] and @shadow[sc] < @write[w] and
        for all z in (0..!decl[cd]-7-1) : (
         uint8(@shadow[sc]+!shadow[sc]+z) == uint8(@decl[cd]+4+z)
        ) and (
         uint8(@shadow[sc]+!shadow[sc]+!decl[cd]-7) == 0x20 or
         uint8(@shadow[sc]+!shadow[sc]+!decl[cd]-7) == 0x09 or
         uint8(@shadow[sc]+!shadow[sc]+!decl[cd]-7) == 0x3d or
         uint8(@shadow[sc]+!shadow[sc]+!decl[cd]-7) == 0x3a
        )
       )
      ) and
             for any fn in (1..#routine) : (
              @routine[fn] < @decl[d] and @decl[d] - @routine[fn] < 4096
             ) and
             for all fn in (1..#routine) : (
              @routine[fn] < @decl[d] or @routine[fn] > @write[w]+!write[w]
             ) and
             for all cc in (1..#decl) : (
              not (@decl[cc] > @connection[c] and @decl[cc] < @write[w] and
               !decl[cc] == !decl[cd] and
               for all z in (0..!decl[cd]-8) : (
                uint8(@decl[cc]+4+z) == uint8(@decl[cd]+4+z)
               )
              )
             ) and
             for any v in (1..#value) : (
              @value[v] > @write[w] and @value[v]+!value[v] < @write[w]+!write[w] and
              uint8(@value[v]-1) != 0x5c and
              !decl[d]-7 == !value[v]-1 and
      for all n in (0..!decl[d]-7-1) : (
       uint8(@decl[d]+4+n) == uint8(@value[v]+1+n)
      ) and
              for all dd in (1..#decl) : (
               not (@decl[dd] > @source[s] and @decl[dd] < @write[w] and
                !decl[dd] == !decl[d] and
                for all z in (0..!decl[d]-8) : (
                 uint8(@decl[dd]+4+z) == uint8(@decl[d]+4+z)
                )
               )
              )
             )
            )
           ) and
           for any po in (1..#post) : (
            @post[po] > @connection[c] and @post[po] < @send_name[sn] and
            !decl[cd]-7 == !post[po]-23 and
      for all n in (0..!decl[cd]-7-1) : (
       uint8(@decl[cd]+4+n) == uint8(@post[po]+0+n)
      )
           ) and
           for any o in (1..#out) : (
            @out[o] > @connection[c] and @out[o] < @send_name[sn] and
            !decl[cd]-7 == !out[o]-16 and
      for all n in (0..!decl[cd]-7-1) : (
       uint8(@decl[cd]+4+n) == uint8(@out[o]+0+n)
      )
           )
          )
         )
        )
       )
      and for any p in (1..#path) : (
       @path[p] < @source[s] and @source[s] - @path[p] < 2048 and
       for any pd in (1..#decl) : (
        @decl[pd] == @path[p] and
        for any r in (1..#read) : (
         @read[r] > @source[s] and @read[r]+!read[r] <= @source[s]+!source[s] and
         !decl[pd]-7 == !read[r]-20 and
      for all n in (0..!decl[pd]-7-1) : (
       uint8(@decl[pd]+4+n) == uint8(@read[r]+19+n)
      )
        )
       )
      )
      )
      }
