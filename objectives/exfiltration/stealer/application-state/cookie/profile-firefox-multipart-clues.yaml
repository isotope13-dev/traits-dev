composite_rules:
  - platforms:
      - windows
    for:
      - pe
    id: firefox-cookie-path-multipart-api-cooccurrence
    desc: Firefox cookie paths beside multipart HTTP APIs
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/application/browser/profile::firefox-profile-directory
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/communications/http/upload/multipart::multipart-form-data-upload
    any:
      - id: micro-behaviors/communications/http/cookies::domain-attribute
      - id: micro-behaviors/communications/socket/send/reference::send-api-ordinal
      - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
    needs: 2
