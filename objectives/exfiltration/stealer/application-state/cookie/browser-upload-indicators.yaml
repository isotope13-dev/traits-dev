# Correlated indicators warrant review; they do not prove a bound upload.
defaults:
  platforms: [unix, windows]
  for: [c, csharp, zig]
composite_rules:
  - id: macos-multiple-browser-stores-http-indicators
    desc: Browser stores, HTTP and dynamic DNS indicators
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path
      - id: micro-behaviors/fs/path/cookie::safari-binary-cookies
      - id: micro-behaviors/communications/url/host/name::dynamic-dns-hostname
    any:
      - id: micro-behaviors/communications/http/client/managed::dotnet-streamcontent
      - id: micro-behaviors/communications/http/download/curl::curl-silent-fail-flags-embedded-text
