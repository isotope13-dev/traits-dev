# Browser migration tools may read Chrome's Safe Storage item and applications
# may upload unrelated telemetry. These verdicts require the keychain read to
# sit in the same small routine as an actual upload of the captured material.
# The activation condition is deliberately irrelevant.
defaults:
  platforms: [macos]
  attack: T1555.003,T1041
  mbc: B0028

composite_rules:
  - id: swift-safe-storage-cookie-http-exfil
    desc: Swift uploads Chrome Safe Storage data and cookies
    crit: hostile
    conf: 0.99
    for: [swift]
    near_lines: 80
    all:
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-command-reference
      - id: micro-behaviors/fs/path/password-store::chromium-safe-storage-service-name
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/http/request/body/construction::swift-urlrequest-http-body
      - id: micro-behaviors/communications/http/request/client::swift-urlsession-data-task

  - id: native-safe-storage-cookie-http-exfil
    desc: Native Chrome key and cookies uploaded
    crit: hostile
    conf: 0.99
    for: [c, cpp]
    near_lines: 40
    all:
      - id: micro-behaviors/os/security/keychain::safe-storage-command-reference
      - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path
      - id: micro-behaviors/communications/http/curl::curl-data-binary
      - id: micro-behaviors/process/create/shell/native::c-system-identifier-input

  - id: dotnet-safe-storage-cookie-http-exfil
    desc: .NET Chrome key and cookies uploaded
    crit: hostile
    conf: 0.99
    for: [csharp]
    near_lines: 60
    all:
      - id: micro-behaviors/os/security/keychain::safe-storage-command-reference
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
      - id: micro-behaviors/fs/path/cookie::chrome-cookies
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string
      - id: micro-behaviors/communications/http/post::postasync
