defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
    - macos
  for:
    - shell
    - applescript
    - macho

composite_rules:
  - id: facebook-session-cookie-tls-export
    desc: "Facebook session-cookie export over TLS"
    crit: hostile
    conf: 0.995
    attack: T1539
    platforms: [macos]
    for: [objectivec]
    all:
      - id: micro-behaviors/fs/path/cookie::objectivec-binarycookies-path
      - id: objectives/credential-access/browser/safari::objectivec-facebook-session-cookie-fields
      - id: micro-behaviors/communications/socket/ssl::objectivec-ssl-write-reference
