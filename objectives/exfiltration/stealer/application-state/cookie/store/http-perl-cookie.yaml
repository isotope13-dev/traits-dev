defaults:
  platforms: [unix, netbsd]
  for: [perl]
  attack: T1552.001

composite_rules:
  - id: perl-browser-cookie-http-exfil
    desc: Perl browser cookies and passwords sent over HTTP
    crit: hostile
    conf: 0.99
    platforms: [unix]
    scope: file
    attack: T1555.003,T1552.001,T1041
    all:
      - id: micro-behaviors/fs/path/credential/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/credential/password-store::login-data
      - id: micro-behaviors/communications/http/request/credentials/file::perl-file-body-variable-upload
      - id: micro-behaviors/communications/http/request/body/construction::perl-http-post-content-map
      - id: micro-behaviors/communications/http/client/initialize
