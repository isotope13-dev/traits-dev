defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-roblox-browser-webhook-builder
    desc: Browser cookie and Roblox webhook builder
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (identifier) @hook right: (call function: (identifier) @webhook)))
          (expression_statement (assignment right: (list (string) @cookie)))
          (expression_statement (assignment left: (identifier) @cookies right: (list)))
          (try_statement body: (block (expression_statement (call
            function: (attribute object: (identifier) @cookies2 attribute: (identifier) @extend)
            arguments: (argument_list (call function: (identifier) @list arguments: (argument_list
              (call function: (attribute object: (identifier) @browser attribute: (identifier) @chrome)))))))))
          (try_statement body: (block
            (expression_statement (assignment left: (identifier) @embed right: (call function: (identifier) @embedtype)))
            (expression_statement (call function: (attribute object: (identifier) @embed2 attribute: (identifier) @addfield)
              arguments: (argument_list (string) @field (identifier) @value)))))
          (try_statement body: (block (expression_statement (call
            function: (attribute object: (identifier) @hook2 attribute: (identifier) @send)
            arguments: (argument_list (keyword_argument name: (identifier) @embedkey value: (identifier) @embed3))))))))
          (#eq? @webhook "Webhook") (#eq? @hook @hook2) (#eq? @send "send")
          (#match? @cookie "[.]ROBLOSECURITY") (#eq? @cookies @cookies2) (#eq? @extend "extend")
          (#eq? @list "list") (#eq? @chrome "chrome") (#eq? @embedtype "Embed")
          (#eq? @embed @embed2) (#eq? @embed @embed3) (#eq? @addfield "add_field")
          (#eq? @embedkey "embed") (#match? @field "(?i)roblosecurity"))

  - id: python-roblox-cookie-requests-post-text
    desc: Source posts named Roblox cookie variable
    crit: suspicious
    if:
      type: text
      regex: 'requests[.]post\([^\n]{0,300}roblox_cookie'

  - id: python-post-webhook-variable-text
    desc: Source posts to webhook variable
    crit: notable
    if:
      type: text
      regex: 'requests[.]post\((url=)?webhook[[:alnum:]_]*'

composite_rules:
  - id: python-roblox-cookie-chromium-webhook-stealer
    desc: Targets Roblox cookies and Chromium credentials for webhook
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1539,T1041
    scope: file
    all:
      - id: python-roblox-browser-webhook-builder
      - id: objectives/credential-access/browser/chromium::chromium-profile-credential-query
  - id: python-roblox-cookie-requests-post-source
    desc: Source targets browser Roblox cookie in POST content
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1539,T1041
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential/value/token::roblox-session-cookie-reference
      - id: python-roblox-cookie-requests-post-text
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-chrome-call
      - id: python-post-webhook-variable-text
