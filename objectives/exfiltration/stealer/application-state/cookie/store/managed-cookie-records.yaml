defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # A record label is mutable. Retain the label-based positive set and also
  # recognize resolved profile-path arguments with the existing read/encode/
  # upload evidence. Matching is file-scoped and claims neither a bound
  # HTTP buffer nor successful delivery.
  - id: managed-keylogger-cookie-store-upload-profile
    desc: Keylogger cookie-source and HTTP-upload clues
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    all:
      - id: objectives/credential-access/browser/chromium::managed-keylogger-browser-store-read-references
      - id: micro-behaviors/data/encode/base64/primitive::dotnet-to-base64string-text
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::uploadstring
    any:
      - id: micro-behaviors/data/format/string::cookie-data-record-prefix
      - id: micro-behaviors/fs/path/cookie::managed-chromium-cookie-path-components

  - id: managed-chromium-cookie-store-path-clue
    desc: Chromium cookie-store path clue in PE
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/cookie::managed-chromium-cookie-path-components
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/cookie::chrome-cookies

  - id: managed-chromium-cookie-base64-http-upload
    desc: Managed Chromium cookie-store read, Base64 and HTTP POST clues
    crit: hostile
    conf: 0.96
    attack: T1539,T1041
    all:
      - id: managed-chromium-cookie-store-path-clue
      - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readallbytes-token
      - id: micro-behaviors/data/encode/base64/primitive::dotnet-to-base64string-text
      - id: micro-behaviors/communications/http/post::postasync
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: objectives/impact/ransom/extortion::pe-ransom-extortion-content
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
