defaults:
  platforms: [ios, macos]
  for: [c, cpp, javascript, typescript, python, go]
  crit: suspicious
  conf: 0.94

composite_rules:
  - id: apple-cookie-store-read-upload
    desc: Apple cookie-store path near file reads and HTTP bodies
    # Bounded co-occurrence supports hunting for export, not proof that the
    # referenced store supplies this request body. Backups can also match.
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/cookie::safari-binary-cookies
      - id: micro-behaviors/fs/read/file/content/unspecified::source-file-content-read-api
      - id: micro-behaviors/communications/http/upload/body::source-http-body-send
