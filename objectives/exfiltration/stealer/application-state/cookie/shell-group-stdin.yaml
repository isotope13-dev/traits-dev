# Retains the external Zig positive formerly covered only by an unbound
# cookie-path/read/HTTP co-occurrence. The head/base64/group/stdin chain is
# explicit in the command template; the second leg requires shell invocation.
defaults:
  platforms: [macos]
  for: [zig]
  conf: 0.98
  attack: T1539,T1041

traits:
  - id: shell-group-cookie-stdin-upload
    desc: Cookie-read group feeds curl request stdin
    crit: suspicious
    size_max: 200000
    if:
      type: yara
      source: |
        rule cookie_group_curl_stdin_template {
          strings:
            $flow = /head[ \t]+-c[ \t]+[0-9]{1,9}[ \t]+'[^'\r\n]{1,160}\/Library\/Application Support\/Google\/Chrome\/[^'\r\n]{1,80}\/Cookies'[ \t]+2>\/dev\/null[ \t]*\|[ \t]*base64;[ \t]*\}\}?[ \t]*\|[\x22+ \t\r\n]{1,40}curl[^;\r\n]{0,100}--data-binary[ \t]+@-/
          condition:
            $flow
        }

composite_rules:
  - id: zig-browser-cookie-group-http-exfil
    desc: Zig runs cookie-read group piped to HTTP
    crit: hostile
    all:
      - id: shell-group-cookie-stdin-upload
      - id: micro-behaviors/process/create/shell/command-string::zig-bin-sh-c
