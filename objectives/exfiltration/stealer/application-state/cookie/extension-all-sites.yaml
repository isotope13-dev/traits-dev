defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1539,T1041
composite_rules:
  - id: all-site-cookie-read-post-cooccurrence
    desc: All-site cookie reads and remote POST channel
    crit: suspicious
    conf: 0.90
    scope: archive
    for: [crx, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
    any:
      - id: micro-behaviors/communications/http/url/domain::js-hardcoded-remote-endpoint
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    needs: 1
    unless:
      - id: micro-behaviors/communications/http/cookies::same-origin-extension-cookie-request
    downgrade:
      scope: archive
      any:
        - id: well-known/app/browser-extension/notionhub::notionhub-extension-context

  - id: remote-controlled-extension-cookie-post
    desc: Browser controller reads cookies and POSTs
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, zip, chrome-manifest, javascript]
    all:
      - id: all-site-cookie-read-post-cooccurrence
      - id: objectives/command-and-control/remote-command/extension::extension-websocket-browser-remote-control
