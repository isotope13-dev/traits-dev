defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - class
  - java_class
  - jar
  attack: T1555.003,T1041
traits:
- id: macos-chrome-store-path-literal
  desc: Source contains a Chrome store path literal
  crit: notable
  conf: 0.98
  for: [c, csharp, elixir, go, ruby, javascript, typescript]
  if:
    type: literal
    regex: '(?i)Library/Application Support/Google/Chrome/Default/(Cookies|Login Data)'
- id: macos-safari-cookie-path-literal
  desc: Source contains a Safari cookie path literal
  crit: notable
  conf: 0.98
  for: [c, csharp, elixir, go, ruby, javascript, typescript]
  if:
    type: literal
    regex: '(?i)Library/Cookies/Cookies\.binarycookies'
- id: macos-cookie-stealer-collector-literal
  desc: Source contains a dynamic-DNS collector literal
  crit: notable
  conf: 0.98
  for: [c, csharp, elixir, go, ruby, javascript, typescript]
  if:
    type: literal
    regex: '(?i)(collect-edge\.hopto\.org|relay-pkg\.trycloudflare\.com)'
- id: macos-cookie-safe-storage-literal
  desc: Source requests Chrome Safe Storage
  crit: notable
  conf: 0.98
  for: [source, ruby, typescript]
  if:
    type: literal
    substr: Chrome Safe Storage
composite_rules:
- id: macos-cookie-store-source-literal
  desc: Source contains a browser cookie path
  crit: notable
  conf: 0.98
  for: [c, csharp, elixir, go, ruby, javascript, typescript]
  any:
  - id: macos-chrome-store-path-literal
  - id: macos-safari-cookie-path-literal
- id: typescript-keychain-cookie-http-exfil
  desc: TypeScript uploads cookie and keychain secrets
  crit: hostile
  conf: 0.99
  platforms: [macos, windows]
  for: [npm, typescript]
  scope: archive
  all:
  - id: macos-cookie-stealer-collector-literal
  - id: macos-cookie-safe-storage-literal
  - id: macos-chrome-store-path-literal
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/os/security/keychain::chrome-safe-storage-query
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-end-body
- id: macos-cookie-store-http-upload
  desc: Cookie-store paths and HTTP upload clues co-occur
  crit: suspicious
  conf: 0.98
  for: [tar, zip, tgz, npm, nupkg, gem, source, c, csharp, elixir, go, ruby, javascript, typescript]
  scope: archive
  all:
  - id: micro-behaviors/communications/http/cookie-store::macos-cookie-read-upload-cooccurrence
  - id: micro-behaviors/communications/url/host/name::dynamic-routing-host-reference
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
- id: rust-macos-browser-credential-curl-exfil
  desc: Rust uploads macOS browser credential stores to a dynamic DNS host
  crit: hostile
  conf: 0.98
  for:
  - crate
  - rust
  scope: archive
  all:
  - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/communications/http/upload::rust-curl-upload-args
  - id: micro-behaviors/communications/url/host/name::dynamic-dns-hostname
- id: jvm-macos-browser-cookie-http-exfil
  desc: JVM sends macOS browser cookie store
  crit: hostile
  conf: 0.98
  for:
  - class
  - java_class
  - jar
  scope: archive
  all:
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path-class
  any:
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/upload
  - id: micro-behaviors/communications/http/client/
  needs: 1
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: perl-browser-cookie-safe-storage-http-exfil
  desc: Perl package reads browser cookies and posts them
  crit: hostile
  conf: 0.98
  for:
  - perl
  - tar
  scope: archive
  all:
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/fs/path/password-store::chrome-safe-storage
  - id: metadata/lang/source/syntax/call/invocation::perl-post-method-call
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: python-macos-cookie-store-http-upload
  desc: Python uploads macOS browser cookies via HTTP
  crit: hostile
  conf: 0.98
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/cookie-store::macos-cookie-path-http-client
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
  any:
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/url/host/name::dynamic-routing-host-reference
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
