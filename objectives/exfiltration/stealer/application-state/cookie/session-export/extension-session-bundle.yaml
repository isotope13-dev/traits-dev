# Whole-session export: an extension reads a site's cookie jar through the
# cookies API (httpOnly session cookies included), sweeps the page's Web
# Storage, and posts both together to a remote API. Anyone holding that
# bundle can resume the user's logged-in session elsewhere. Disclosed
# "account sharing" tools do exactly this, so it stays suspicious.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1539,T1185

composite_rules:
  - id: extension-cookie-jar-and-web-storage-upload
    desc: Extension posts site cookie jar with httpOnly flags and Web Storage dump
    crit: suspicious
    conf: 0.85
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
      - id: micro-behaviors/data/serialize/schema-cookie::cookie-record-value-and-httponly-copy
      - id: micro-behaviors/data/db/enumerate::browser-storage-sweep-loop
      - id: micro-behaviors/communications/http/request/json::http-post-json

  # An empty getAll filter returns every cookie for every site in the
  # profile, not just the one account being shared.
  - id: extension-unscoped-cookie-read-with-record-export
    desc: Extension reads every browser cookie and exports full cookie records
    crit: suspicious
    conf: 0.8
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all-unscoped
      - id: micro-behaviors/data/serialize/schema-cookie::cookie-record-value-and-httponly-copy
      - id: micro-behaviors/communications/http/request/json::http-post-json
