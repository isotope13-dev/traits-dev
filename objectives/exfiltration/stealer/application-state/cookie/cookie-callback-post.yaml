# Bind the getAll callback parameter to JSON.stringify and the resulting
# variable to fetch's POST body. API co-occurrence alone is not cookie export.
# Suspicious: managed backup/migration tools can deliberately export a jar.
# This describes an attempted transfer, not effective host permissions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: extension-cookie-callback-json-post
    desc: POSTs cookie callback records to HTTP URL
    crit: suspicious
    conf: 0.98
    attack: T1539,T1041
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression
              object: (identifier) @browser
              property: (property_identifier) @store)
            property: (property_identifier) @get)
          arguments: (arguments
            . (object) @filter
            . (arrow_function
              parameters: (formal_parameters . (identifier) @jar .)
              body: (statement_block
                . (lexical_declaration
                  (variable_declarator
                    name: (identifier) @body
                    value: (call_expression
                      function: (member_expression
                        object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments . [
                        (identifier) @jar_use
                        (call_expression
                          function: (member_expression
                            object: (identifier) @jar_use
                            property: (property_identifier) @slice)
                          arguments: (arguments . (number) @start . (number) .))
                      ] .))))
                . (expression_statement
                  (call_expression
                    function: (identifier) @fetch
                    arguments: (arguments
                      . (string (string_fragment) @url)
                      . (object
                        . (pair key: (property_identifier) @method_key
                          value: (string (string_fragment) @method))
                        . [
                          (shorthand_property_identifier) @body_key @body_use
                          (pair key: (property_identifier) @body_key
                            value: (identifier) @body_use)
                        ] .)))))))) @export
          (#match? @browser "^(chrome|browser)$")
          (#match? @filter "^\\{\\s*\\}$")
          (#eq? @store "cookies")
          (#eq? @get "getAll")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @jar @jar_use)
          (#eq? @slice "slice")
          (#eq? @start "0")
          (#eq? @fetch "fetch")
          (#match? @url "^https?://")
          (#eq? @method_key "method")
          (#eq? @method "POST")
          (#eq? @body @body_use)
          (#eq? @body_key "body"))
