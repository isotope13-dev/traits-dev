defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  attack: T1041
  crit: hostile
composite_rules:
- id: js-browser-cookie-websocket-exfil
  desc: Browser session cookies sent over a WebSocket
  conf: 0.99
  attack: T1539,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/websocket/handler::websocket-library-api-reference
  - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
  - id: micro-behaviors/communications/http/cookies::cookie-json-send-call
  near_bytes: 2400
  unless:
  - id: well-known/tool/detection/
- id: js-browser-cookie-storage-oast-exfil
  desc: Browser cookies and storage exfiltrated to OAST endpoint
  conf: 0.98
  attack: T1555.003,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/url/host/oob::oastify
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/data/db/web-storage::browser-storage-sweep-loop
  any:
  - id: micro-behaviors/communications/http/request/configuration::no-cors-post-request
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/communications/http/request/client::image-src-network-request
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: js-browser-cookie-oob-navigation-exfil
  desc: Sends browser cookie to OOB callback via navigation
  conf: 0.99
  attack: T1539,T1041
  mbc: E1005,E1041
  near_bytes: 1600
  all:
  - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
  - id: objectives/exfiltration/oob/callback::browser-oob-encoded-navigation
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/harness/runtime/
- id: js-browser-cookie-auth-xhr-exfil
  desc: Browser cookie and auth token sent by XHR
  conf: 0.995
  attack: T1539,T1528,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/oauth::access-token
  - id: micro-behaviors/communications/http/post::xhr-post-open
  - id: micro-behaviors/data/decode/custom::js-charcode-mask-unescape-decoder
  near_bytes: 4096
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: well-known/app/infrastructure/openremote::manager-auth-context
  - id: metadata/path::test-directory-component
- id: browser-cookie-remote-xhr-exfil
  desc: Cookie value sent by XHR beside remote URL
  conf: 0.96
  attack: T1539,T1041
  mbc: E1005
  for:
  - javascript
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-send-cookie-value
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
- id: js-storage-regex-cookie-xhr-exfil
  desc: Storage keys matching a credential regex sent with the cookie
  conf: 0.97
  attack: T1555.003,T1539,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/data/db/web-storage::credential-regex-then-storage-read
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/post::xhr-post-open-send
  near_bytes: 1200
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: js-browser-cookie-fetch-post-exfil
  desc: Browser session cookie sent in fetch POST body
  conf: 0.98
  attack: T1539,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/post::fetch-post-call
  any:
  - id: micro-behaviors/communications/http/cookies::cookie-value-json-payload
  - id: micro-behaviors/communications/http/cookies::cookie-value-body-field
  - id: micro-behaviors/data/serialize/json::json-stringify-post-body-core
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
