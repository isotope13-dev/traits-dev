        rule extension_external_site_cookie_retrieval {
          strings:
            $external = "chrome.runtime.onMessageExternal.addListener((e,t,o)=>(console.log"
            $dispatch = "const o=m[e.action]"
            $return = "t({success:!0,data:s})"
            $route = "listCookies:h(function(e)"
            $get = "chrome.cookies.getAll({url:e.url})"
            $body = "Response.json({cookies:t})"
          condition:
            all of them
