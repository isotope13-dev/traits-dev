defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html

composite_rules:
- id: cookie-loop-remote-xhr-clues
  for: [javascript]
  desc: Cookie iteration with XHR handler and remote URL
  crit: suspicious
  conf: 0.95
  near_bytes: 1024
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-readystatechange-handler
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
