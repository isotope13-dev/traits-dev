defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: cookie-upload-page-snapshot
    desc: Cookie upload beside rendered page snapshot
    crit: suspicious
    conf: 0.95
    attack: T1539,T1113
    near_bytes: 2500
    all:
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-json-object
      - id: micro-behaviors/ui/graphics/image::html2canvas-document-body
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: cookie-json-variable-external-upload
