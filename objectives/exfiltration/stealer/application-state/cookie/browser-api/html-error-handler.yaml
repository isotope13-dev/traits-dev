defaults:
  platforms: [unix, windows]
  for: [markdown, text, html]
traits:
  - id: html-event-cookie-url-concat
    desc: Fetch URL concatenates browser cookies
    for: [html]
    crit: notable
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)fetch\s*\(\s*["'']https?://[^"''\s]{1,160}["'']\s*\+\s*document\s*\.\s*cookie'
  - id: html-error-handler-cookie-send
    desc: Cookie-send HTML error-handler text
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: (?i)onerror.{0,80}fetch\(["'`]https?://.{0,80}document\.cookie
    not:
    - regex: '(?i)https?://(attacker\.com|example\.(com|org|net))'
    unless:
    - id: metadata/package/documentation/security-exercise::ctf-technique-reference-documentation
    - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
    - id: metadata/package/documentation/agent-safety/security-examples::security-example-documentation
    - id: objectives/exfiltration/stealer/application-state/cookie/reference::cookie-explained-reference-contexts
    - id: metadata/file/format/structured::serialized-skill-documentation-catalog
    - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
    - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
composite_rules:
  - id: html-event-cookie-url-exfil
    desc: HTML event handler sends cookies in a network URL
    for: [html]
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    near_bytes: 300
    all:
    - id: html-event-cookie-url-concat
    - id: metadata/lang/source/syntax/attribute::html-fetch-event-attribute
    unless:
    - id: metadata/package/documentation/agent-safety/security-examples::security-example-documentation
    - id: metadata/package/documentation/security-exercise::pentest-witness-playbook-documentation
