# Adjacent declaration and upload bind the cookie JSON to the fetch body.
# Custom HTTP methods can carry bodies too; GET/HEAD and forbidden methods
# are rejected by fetch before any body is sent.
# AST is needed: proximity alone cannot distinguish an unrelated telemetry body.
# Quoted option keys are equivalent JS syntax; reject overwritten body options.
