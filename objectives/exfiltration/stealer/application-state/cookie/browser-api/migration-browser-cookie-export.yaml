defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030

composite_rules:
# Keep the cookie-bearing record distinct from the stronger email/install-ID
# finding. This reports same-file capabilities, without inventing interprocedural
# binding or allowing a product marker to suppress the cookie-read evidence.
- id: extension-cookie-record-with-encoded-export
  desc: Extension passes cookies beside encoded export
  for: [javascript, typescript, crx, xpi, zip]
  crit: suspicious
  conf: 0.9
  scope: file
  all:
  - id: micro-behaviors/communications/http/cookie-store::passes-document-cookie-record
  - id: micro-behaviors/communications/http/request/body/construction::base64-post-carries-service-tagged-record
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  any:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
  - id: micro-behaviors/data/db/web-storage::chrome-storage-api
