defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: extension-returns-whole-cookie-jar-to-socket
    desc: Sends all browser cookies in socket reply
    crit: hostile
    conf: 0.98
    attack: T1539,T1041
    if:
      type: tree-sitter
      query: |
        ((switch_case
          (_ (variable_declarator
            name: (identifier) @cookies
            value: (await_expression (call_expression
              function: (member_expression) @read
              arguments: (arguments . (object) @filter .)))))
          .
          (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @emit)
            arguments: (arguments
              . (string)
              . (object
                (pair key: [(property_identifier) (string)] @recipient
                      value: (member_expression) @requester)
                (pair value: (call_expression
                  function: (member_expression) @serialize
                  arguments: (arguments . (identifier) @sent .))))))))
          (#match? @read "^(chrome|browser)\\s*\\.\\s*cookies\\s*\\.\\s*getAll$")
          (#match? @filter "^\\{\\s*\\}$")
          (#eq? @emit "emit")
          (#match? @recipient "^['\"]?(to|recipient|clientId)['\"]?$")
          (#match? @requester "\\.\\s*(from|sender|clientId)$")
          (#match? @serialize "^JSON\\s*\\.\\s*stringify$")
          (#eq? @cookies @sent))
