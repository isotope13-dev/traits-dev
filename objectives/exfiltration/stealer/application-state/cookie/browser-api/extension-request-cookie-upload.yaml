defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-request-cookies-third-party-post
    desc: Posts captured request cookies to service
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule extension_request_cookies_third_party_post {
          strings:
            $capture = "const uploadUserCookie = (details) =>"
            $cookie = "temp.cookie = cookies.reduce"
            $trigger = "upRequest(temp.mallId)"
            $post = "await fetch(\"https://tm.zhikuangfuture.com/api/v1/temu/sp/csa\""
            $method = "method: \"POST\""
            $body = "cookie: _temp.cookie"
            $anti = "antiContent: _temp.antiContent"
            $user = "userId: _temp.userId"
            $device = "device: _temp.device"
          condition:
            all of them
        }
