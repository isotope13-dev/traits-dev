          (#eq? @fetch "fetch") (#eq? @method "method")
          (#match? @verb "^[\"']POST[\"']$") (#eq? @body "body")
          (#eq? @doc "document") (#eq? @cookie "cookie"))

        ((call_expression function: (identifier) @fetch
          arguments: (arguments . (_) .
            (object
