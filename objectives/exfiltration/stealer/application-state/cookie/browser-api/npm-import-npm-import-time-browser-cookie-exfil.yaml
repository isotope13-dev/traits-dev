defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, zip, tar]
composite_rules:
- id: npm-import-time-browser-cookie-exfil
  desc: npm entry module exfiltrates browser cookies on import
  conf: 0.99
  attack: T1195.002,T1539,T1041
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  - tar
  - tgz
  all:
  - id: metadata/package/entrypoint/module::npm-root-javascript-source-member
  - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/communications/http/request/client::module-execution-http-call
  any:
  - id: objectives/exfiltration/stealer/application-state/cookie/browser-api::js-browser-cookie-fetch-post-exfil
  - id: objectives/exfiltration/stealer/application-state/cookie/browser-api::browser-cookie-remote-xhr-exfil
  - id: objectives/exfiltration/stealer/application-state/cookie/browser-api::js-browser-cookie-websocket-exfil
  needs: 1
