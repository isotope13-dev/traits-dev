defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  attack: T1041
  crit: hostile
composite_rules:
- id: js-browser-cookie-websocket-exfil
  desc: Browser session cookies sent over a WebSocket
  conf: 0.99
  attack: T1539,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/websocket/handler::websocket-library-api-reference
  - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
  - id: micro-behaviors/communications/http/cookies::cookie-json-send-call
  near_bytes: 2400
- id: js-browser-cookie-storage-oast-exfil
  desc: Browser cookies and storage sent to OAST
  conf: 0.98
  attack: T1555.003,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/data/db/enumerate::browser-storage-sweep-loop
  any:
  - id: micro-behaviors/communications/http/request/configuration::no-cors-post-request
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/communications/http/request/client::image-src-network-request
  unless:
  - id: metadata/path/directory::test-directory-component
- id: js-browser-cookie-oob-navigation-exfil
  desc: Browser cookie sent via OOB navigation
  conf: 0.99
  attack: T1539,T1041
  mbc: E1005,E1041
  near_bytes: 1600
  all:
  - id: micro-behaviors/communications/http/cookie-store::browser-document-cookie-reference
  - id: objectives/exfiltration/oob/callback/http-get::browser-oob-encoded-navigation
- id: browser-cookie-remote-xhr-exfil
  desc: Cookie value sent by XHR beside remote URL
  conf: 0.96
  attack: T1539,T1041
  mbc: E1005
  for:
  - javascript
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-send-cookie-value
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
- id: js-storage-regex-cookie-xhr-exfil
  desc: Credential storage keys sent with cookie
  conf: 0.97
  attack: T1555.003,T1539,T1041
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/data/db/read/key-value::credential-regex-then-storage-read
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/post::xhr-post-open-send
  near_bytes: 1200
  unless:
  - id: metadata/path/directory::test-directory-component
- id: js-browser-cookie-discord-webhook-exfil
  desc: Browser cookies posted to Discord webhook
  conf: 0.99
  attack: T1539,T1041,T1567.002
  mbc: B0028
  for:
  - javascript
  - typescript
  near_bytes: 1600
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::xhr-post-open-send
  - id: micro-behaviors/communications/http/post::request-options-post-method
  unless:
  - id: metadata/path/directory::test-directory-component
