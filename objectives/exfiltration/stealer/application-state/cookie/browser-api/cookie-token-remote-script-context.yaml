defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html

composite_rules:
- id: cookie-token-remote-script-clues
  for: [javascript]
  desc: Cookie and token references with obfuscated remote script loading
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/token-auth::access-token-field-reference
  - id: micro-behaviors/communications/http/request/json::fetch-external-url
  - id: micro-behaviors/communications/http/client/script::js-remote-script-element
  - id: metadata/lang/source/naming/declaration::hex-identifier-declarations
