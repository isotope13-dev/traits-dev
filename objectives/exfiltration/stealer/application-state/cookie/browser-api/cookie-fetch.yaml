# Transmitting the entire browser cookie jar to a literal external URL is
# implemented theft even when the caller labels it a test or demonstration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
composite_rules:
  - id: document-cookie-external-fetch-url
    unless:
      - id: metadata/file/format/security-corpus::inline-detection-rule-corpus
    desc: Fetch sends cookies in an external URL
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    scope: file
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/request/get::fetch-url-appends-member-value
    any:
      # A doctype in quoted reference material can suppress the member atom.
      # The fetch AST still binds this cookie read to the outgoing URL; use
      # either representation of that same read, at the exact same location.
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
      - id: micro-behaviors/communications/http/cookie-store::html-document-cookie-reference
