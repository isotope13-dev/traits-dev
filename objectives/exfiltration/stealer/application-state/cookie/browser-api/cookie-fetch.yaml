# Transmitting the entire browser cookie jar to a literal external URL is
# implemented theft even when the caller labels it a test or demonstration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
composite_rules:
  - id: document-cookie-external-fetch-url
    desc: Fetch sends cookies in an external URL
    crit: hostile
    conf: 0.97
    attack: T1539,T1041
    scope: file
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/request/get::fetch-url-appends-member-value
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
