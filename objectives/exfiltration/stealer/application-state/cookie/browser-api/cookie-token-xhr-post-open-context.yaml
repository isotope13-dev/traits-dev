defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios

composite_rules:
- id: cookie-token-xhr-post-open-clues
  desc: Cookie and token references with XHR POST setup
  crit: suspicious
  conf: 0.995
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/token-auth::access-token
  - id: micro-behaviors/communications/http/post::xhr-post-open
  - id: micro-behaviors/data/decode/custom::js-charcode-mask-unescape-decoder
  near_bytes: 4096
  unless:
  - id: well-known/app/infrastructure/openremote::manager-auth-context
  - id: metadata/path/directory::test-directory-component
