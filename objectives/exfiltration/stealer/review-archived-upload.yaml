composite_rules:
- for:
  - scripts
  - source
  platforms:
  - unix
  id: npm-ssh-archive-upload
  desc: npm and SSH credentials archived for upload
  crit: hostile
  conf: 0.95
  attack: T1552.001,T1560.001,T1041
  near_lines: 25
  all:
  - id: micro-behaviors/fs/file/copy/source-destination::shell-copy-npmrc
  - id: micro-behaviors/fs/file/copy/source-destination::shell-copy-ssh-directory
  - id: micro-behaviors/data/archive/create/tar::tar-create
  - id: micro-behaviors/communications/http/upload::curl-at-source-body-command
