composite_rules:
- platforms:
  - netscaler
  - appliance
  - unix
  for:
  - swift
  attack: T1041
  id: swift-ssh-credential-http-exfil
  desc: Swift SSH credential HTTP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/transfer-path::exfil-path-marker
  - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
  - id: micro-behaviors/fs/read/file/content/unspecified::swift-direct-file-read-api
  any:
  - id: micro-behaviors/fs/path/private-key::swift-ssh-rsa-key-path
  - id: micro-behaviors/fs/path/private-key::swift-ssh-ed25519-key-path
  - id: micro-behaviors/fs/path/private-key::swift-ssh-ecdsa-key-path
  - id: micro-behaviors/fs/path/private-key::swift-ssh-dsa-key-path
