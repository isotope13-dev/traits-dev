defaults:
  platforms: [openwrt, windows]
  for: [powershell]
  attack: T1041

composite_rules:
  - id: openwrt-powershell-credential-http-exfil
    desc: OpenWrt PowerShell credential exfil
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/files/theft::openwrt-powershell-credential-config-harvest
      - id: "micro-behaviors/communications/http/post::powershell-post-method"
    any:
      - id: micro-behaviors/communications/http/request/payload::powershell-body-or-upload
      - id: micro-behaviors/communications/http/request/payload::powershell-http-body-value
    needs: 1
