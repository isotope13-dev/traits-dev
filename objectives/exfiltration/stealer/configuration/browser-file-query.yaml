# The article's minimal confirmation reads /etc/hosts and sends btoa(text)
# in a fetch query. This intentionally remains suspicious: ordered source
# matches do not bind the response variable to the encoded request operand.
# Config files choose this stolen-item home; ordinary arbitrary-file uploads
# belong in stealer/file instead. No product or attacker-chosen host gate.
defaults:
  for: [javascript, typescript, html]
  platforms: [linux, macos, windows]

traits:
  - id: browser-local-config-query-export
    desc: Local config read near encoded HTTP query
    crit: suspicious
    conf: 0.92
    if:
      type: yara
      source: |
        rule browser_local_config_query_export {
          strings:
            $read = /fetch\s*\(\s*["']file:\/\/\/[^"']{1,180}\/(hosts|\.env|\.npmrc)["']/
            $text = /\.text\s*\(\s*\)/
            $send = /fetch\s*\(\s*["']https?:\/\/[^"'\r\n]{1,200}[?&][^"'=]{1,30}=["']/
            $encode = /["']\s*\+\s*btoa\s*\(/
          condition:
            all of them and
            for any r in (1..#read) : (
              for any t in (1..#text) : (
                @text[t] > @read[r] and @text[t] - @read[r] < 1024 and
                for any s in (1..#send) : (
                  @send[s] > @text[t] and @send[s] - @read[r] < 2048 and
                  for any e in (1..#encode) : (
                    @encode[e] == @send[s] + !send[s] - 1
                  )
                )
              )
            )
        }
