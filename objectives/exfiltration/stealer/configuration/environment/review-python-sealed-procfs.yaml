composite_rules:
- platforms:
  - linux
  for:
  - python
  attack: T1552.001,T1041
  id: python-procfs-environ-sealed-secret-upload
  desc: Reads process environments and uploads collected secrets encrypted
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/env/procfs::python-formatted-proc-environ-read
  - id: micro-behaviors/fs/path/developer-credential::multiple-developer-credential-path-groups
  - id: micro-behaviors/crypto/asymmetric/rsa::loaded-pem-public-key-encrypt
  - id: micro-behaviors/crypto/key/representation/encoded::pem-public-key-header
  - id: micro-behaviors/crypto/symmetric/aes/reference::algorithms-aes-symbol
  any:
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/http/post::requests-post
