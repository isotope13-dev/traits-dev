defaults:
  platforms: [unix, windows]
  crit: hostile
  attack: T1041
  for: [javascript, typescript]
composite_rules:
  - id: npm-runner-profile-http
    for: [javascript, package.json, npm]
    desc: npm postinstall exfiltrates CI profile
    conf: 0.97
    size_max: 500000
    near_bytes: 4096
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/env/read/named::ci-env-reference-set
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/url/host/name::ngrok-io-endpoint
    unless:
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/build/ci/github-actions::actions-sdk
  - id: node-runner-profile-native-http
    desc: Node exfiltrates CI profile via HTTP
    conf: 0.98
    all:
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-github-repository
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/url/host/name::ngrok-io-endpoint
    unless:
      - id: metadata/build/ci/github-actions::actions-sdk
      - id: metadata/path/directory::test-directory-component
