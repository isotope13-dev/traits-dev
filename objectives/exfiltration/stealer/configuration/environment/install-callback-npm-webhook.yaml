defaults:
  platforms: ["unix", "windows"]
  for: ["javascript", "typescript"]

composite_rules:
  - id: npm-env-harvest-webhook-exfil
    mbc: E1041
    attack: T1041
    crit: hostile
    desc: Full process.env harvested and exfiltrated to a chat webhook
    conf: 0.97
    all:
      - id: micro-behaviors/os/env/read/collection::process-env-report-input
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
