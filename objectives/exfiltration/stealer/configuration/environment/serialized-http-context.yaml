defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: js-serialize-environment
  desc: Full environment JSON near an HTTP request
  crit: suspicious
  conf: 0.9
  scope: leaf
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/env/read/variable::javascript
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  downgrade:
    any:
    - id: metadata/build/ci/github-actions::action-output-env-file
