defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1552.001,T1041
traits:
- id: collect-env-files-loop
  desc: Script probes environment file names
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)for\s*\(const name of ENV_NAMES\).{0,100}readFile(Sync)?\(path\.join\(dir, name\)
- id: dotenv-name-list
  desc: Script lists dotenv file variants
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)ENV_NAMES\s*=\s*\[.{0,100}["\x27]\.env\.production["\x27]
- id: merge-env-file-and-process
  desc: Script combines process and file environment
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)\.\.\.process\.env.{0,200}\.\.\.(fileVars|collectEnvFiles\(\))
- id: encode-env-payload
  desc: Script base64 encodes environment payload
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: Buffer\.from\(payload\)\.toString\(["\x27]base64["\x27]\)
- id: get-env-query
  desc: Script sends environment query to subdomain
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: get(`http://${subdomain}/env?d=${
- id: helper-http-get
  desc: Script performs HTTP GET for supplied URL
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?s)function get\(url\).{0,200}mod\.get\(url
composite_rules:
- id: node-envfiles-process-base64-get
  desc: Script sends process and dotenv contents in encoded HTTP query
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/stealer/configuration/environment/file-source::collect-env-files-loop
  - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  - id: objectives/exfiltration/stealer/configuration/environment/file-source::dotenv-name-list
  - id: objectives/exfiltration/stealer/configuration/environment/file-source::merge-env-file-and-process
  - id: objectives/exfiltration/stealer/configuration/environment/file-source::encode-env-payload
  - id: objectives/exfiltration/stealer/configuration/environment/file-source::get-env-query
  - id: objectives/exfiltration/stealer/configuration/environment/file-source::helper-http-get
