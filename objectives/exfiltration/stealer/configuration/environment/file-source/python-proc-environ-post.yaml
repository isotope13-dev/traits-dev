defaults:
  for: [python]
  platforms: [linux]
  attack: T1552.001,T1041

traits:
  - id: python-proc-environ-requests-post
    desc: Posts a process environment file
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (identifier) @value right: (call
            function: (attribute object: (call function: (identifier) @open arguments: (argument_list (string) @path)) attribute: (identifier) @read))))
          (expression_statement (call function: (attribute object: (identifier) @requests attribute: (identifier) @post)
            arguments: (argument_list (string) @url (keyword_argument name: (identifier) @data value: (identifier) @value2))))))
          (#eq? @open "open") (#match? @path "/proc/.*environ") (#eq? @read "read")
          (#eq? @requests "requests") (#eq? @post "post") (#match? @url "https?://")
          (#eq? @data "data") (#eq? @value @value2))
