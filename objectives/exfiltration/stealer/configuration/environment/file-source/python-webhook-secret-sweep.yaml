defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-webhook-secret-sweep
  desc: Sends environment and secret files to webhook
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041
  scope: file
  all:
  - id: micro-behaviors/os/env/enumerate/copy::python-environ-dict
  - id: micro-behaviors/communications/http/request/body/construction::urllib-payload-argument
  - id: micro-behaviors/communications/url/host/oob/endpoint::pipedream
  any:
  - id: micro-behaviors/data/serialize/schema-credential::aws-access-key-field-reference
  - id: micro-behaviors/data/serialize/schema-credential::aws-secret-key-field-reference
  - id: micro-behaviors/fs/path/credential/ssh::ssh-directory-literal
  - id: micro-behaviors/fs/path/credential/container::kubernetes-secret-directory-text
