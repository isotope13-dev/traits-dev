defaults:
  platforms:
  - unix
  - windows
  for:
  - npm
  - zip
  - package.json
  - javascript
  - typescript
  attack: T1041,T1195.002
  mbc: E1041
composite_rules:
- id: node-obfuscated-file-content-raw-ip-post
  desc: Obfuscated package posts file content to a raw IP
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: micro-behaviors/data/decode/base64/unspecified::multiple-node-base64-decodes
  - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/header/content-type::application-json
  - id: micro-behaviors/communications/url/encoded::base64-decoded-ipv4-http-url
