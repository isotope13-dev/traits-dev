defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: rust-build-rs-post-exfil
  desc: build.rs posts host profile to external endpoint
  crit: hostile
  conf: 0.96
  mbc: E1041
  for:
  - rust
  all:
  - id: micro-behaviors/communications/http/request/body/environment::rust-build-rs-env-http-post
  - id: micro-behaviors/data/serialize/schema-system::rust-build-rs-host-profile-fields
  any:
  - id: "micro-behaviors/communications/http/request/verb::cargo-build-post-arguments"
  - id: micro-behaviors/process/create/subprocess/capture::rust-build-rs-command-output
- id: rust-build-rs-env-curl-upload
  desc: build.rs reads env var then sends data via curl
  crit: notable
  conf: 0.92
  for:
  - rust
  all:
  - id: micro-behaviors/process/create/subprocess/configure::rust-build-rs-env-curl-command
  - id: micro-behaviors/communications/http/upload/file::rust-curl-upload-argument
  near_bytes: 700
- id: rust-build-rs-env-wget-upload
  desc: build.rs reads env var then sends data via wget
  crit: notable
  conf: 0.92
  for:
  - rust
  all:
  - id: micro-behaviors/process/create/subprocess/configure::rust-build-rs-env-wget-command
  - id: micro-behaviors/communications/http/request/body/construction::rust-build-rs-wget-send-flag
  near_bytes: 700
- id: rust-build-rs-env-exfil
  desc: build.rs sends environment-linked data outward
  crit: suspicious
  conf: 0.9
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  any:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: objectives/exfiltration/stealer/configuration/environment::rust-build-rs-env-curl-upload
  - id: objectives/exfiltration/stealer/configuration/environment::rust-build-rs-env-wget-upload
- id: cargo-build-hook-post-exfil
  desc: Cargo build hook posts environment data
  crit: hostile
  conf: 0.97
  mbc: E1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  any:
  - id: objectives/exfiltration/stealer/configuration/environment::rust-build-rs-post-exfil
  - id: micro-behaviors/communications/http/request/body/environment::rust-build-rs-env-http-post
  - id: micro-behaviors/communications/http/request/body/environment::cargo-build-module-environment-upload
- id: cargo-archive-build-rs-post-exfil
  desc: Cargo archive build.rs posts environment data
  crit: hostile
  conf: 0.97
  mbc: E1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/archive::archive-cargo-crate-build-script
  any:
  - id: objectives/exfiltration/stealer/configuration/environment::rust-build-rs-post-exfil
  - id: micro-behaviors/communications/http/request/body/environment::rust-build-rs-env-http-post
  - id: micro-behaviors/communications/http/request/body/environment::cargo-build-module-environment-upload
  unless:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  - id: micro-behaviors/data/control-flow/branch::cargo-credential-http-false-branch
- id: cargo-proc-macro-compile-time-exfil
  desc: Cargo proc macro exfiltrates build environment
  crit: hostile
  conf: 0.98
  mbc: E1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/config::cargo-proc-macro-target
  - id: micro-behaviors/communications/http/request/body/environment::rust-proc-macro-env-http-post
