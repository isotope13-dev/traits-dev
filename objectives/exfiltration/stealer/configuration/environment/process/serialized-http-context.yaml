defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: npm-postinstall-workspace-environment-oast-get-exfil
  desc: npm postinstall sends workspace files and environment to OASTify
  crit: hostile
  conf: 0.995
  attack: T1005,T1041,T1195.002
  for:
  - npm
  - zip
  - package.json
  - javascript
  scope: package
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: objectives/exfiltration/stealer/configuration/environment/process::js-serialize-environment
  - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: micro-behaviors/communications/url/construction/query::encoded-template-query-parameter
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
- id: js-serialize-environment
  desc: Full environment JSON near an HTTP request
  crit: suspicious
  conf: 0.9
  scope: leaf
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/env/read/current::javascript
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  downgrade:
    any:
    - id: metadata/build/ci/github-actions::action-output-env-file
