defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1552.001,T1195.002
traits:
- id: node-base64-entire-environment
  desc: Script base64 encodes full environment
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)envBase64\s*=\s*Buffer\.from\s*\(.{0,60}JSON\.stringify\s*\(process\.env\)
- id: node-ngrok-fetch
  desc: Script fetches ngrok tunnel URL
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: fetch\s*\(["\x27]https://[a-z0-9-]+\.ngrok\.io/
- id: node-env-encoding-and-post
  desc: Script encodes data and selects POST
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)\.toString\s*\(["\x27]base64["\x27]\).{0,250}method:\s*["\x27]POST
- id: node-env-base64-body
  desc: Request body uses encoded environment
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: body\s*:\s*envBase64
composite_rules:
- id: node-base64-env-ngrok-post
  desc: Script posts full encoded environment to ngrok
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-base64-entire-environment
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-ngrok-fetch
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-env-encoding-and-post
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-env-base64-body
