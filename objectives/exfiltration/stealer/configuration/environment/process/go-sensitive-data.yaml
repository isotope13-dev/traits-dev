defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
  attack: T1041
  mbc: B0030
composite_rules:
- id: go-env-http-exfiltration
  desc: Environment variable exfiltration via HTTP (Go)
  crit: hostile
  conf: 0.95
  for:
  - go
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/http/post::http-post-methods
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  any:
  - id: micro-behaviors/os/env/enumerate/entries::go-environ-iteration
  - id: micro-behaviors/os/env/enumerate/entries::go-environ-joined
  unless:
  - id: well-known/app/network/skywire::skywire-distribution
  - id: well-known/tool/packaging/tiup::tiup-publisher-context
  - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
