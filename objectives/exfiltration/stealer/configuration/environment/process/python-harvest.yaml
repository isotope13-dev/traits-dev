defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-env-harvest
  desc: Python POSTs selected environment variables
  crit: hostile
  conf: 0.95
  mbc: E1552
  attack: T1552
  any:
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-dict
  - id: micro-behaviors/os/env/enumerate/copy::python-environ-copy
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-iteration
  - id: micro-behaviors/communications/http/request/body/environment::python-environ-alias-dict-post
  all:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: micro-behaviors/communications/http/request/body/environment::python-harvested-environment-http-body
  unless:
  - id: reserved-url-environment-fixture
- id: reserved-url-environment-fixture
  desc: Test fixture has one Requests call to a reserved URL
  crit: exception
  all:
  - id: metadata/package/testing/presence/path::python-tests-fixture-member
  - id: micro-behaviors/communications/http/request/client::single-requests-httpx-call
  - id: micro-behaviors/communications/http/post::python-reserved-url-post
