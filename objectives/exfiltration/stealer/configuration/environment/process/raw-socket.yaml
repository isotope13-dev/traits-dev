defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1041,T1132.001
composite_rules:
- id: python-install-hook-environment-ngrok-socket-exfil
  desc: Python install hook sends the process environment to an ngrok TCP listener
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - python
  - python_sdist
  - whl
  - zip
  - tar
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/os/env/enumerate/copy::python-environ-dict
  - id: micro-behaviors/communications/socket/connect/attempt::python-created-socket-connect
  - id: micro-behaviors/communications/socket/send/message::python-sendall
  - id: micro-behaviors/communications/url/host/name::ngrok-io-endpoint
- id: python-encoded-environment-raw-http-exfil
  desc: Encoded process environment over raw HTTP
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/proc/info/path::process-self-environ
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/socket/dial::python-dial
  - id: micro-behaviors/communications/socket/send/message::python-sendall
  - id: micro-behaviors/communications/http/message::raw-http-body-request-line
  near_bytes: 4096
