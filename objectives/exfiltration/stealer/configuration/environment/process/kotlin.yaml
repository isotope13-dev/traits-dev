defaults:
  platforms:
  - windows
  - unix
  for:
  - kotlin
  attack: T1041
composite_rules:
- id: kotlin-sensitive-env-http-exfil
  desc: Kotlin filters sensitive environment values into an HTTP request body
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1041
  all:
  - id: micro-behaviors/os/env/credential/secret::kotlin-sensitive-env-key-filter
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/communications/http/request/body/construction::jvm-http-body-write-source
- id: kotlin-env-http-exfil
  desc: Kotlin env HTTP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/env/output::kotlin-env-map-dump
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/communications/http/request/body/construction::jvm-http-body-write-source
