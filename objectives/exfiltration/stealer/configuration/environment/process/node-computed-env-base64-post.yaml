# Node code that enumerates the whole environment through computed property
# access, Base64-wraps the JSON and POSTs it to a literal remote host. Computed
# access (process["env"]) is a common way to avoid a plain process.env match.
defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1082,T1195.002
  for:
  - javascript
  - typescript
composite_rules:
- id: node-computed-env-base64-remote-post
  desc: Node posts Base64 environment JSON to remote host
  crit: hostile
  conf: 0.97
  near_bytes: 2000
  all:
  - id: micro-behaviors/os/env/enumerate/entries::node-computed-env-collection
  - id: micro-behaviors/communications/http/request/encoded::json-base64-post-context
  - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
