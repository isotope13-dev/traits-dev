defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1195.002
  mbc: B0030

traits:
  - id: node-oast-pro-domain
    desc: Node references OAST pro-like host
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '[a-z0-9]{8,64}\.oast\.proe?\b'

  - id: node-encodes-flag-in-data-query
    desc: Encodes flag into data query parameter
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?s)[?&]data=.{0,200}encodeURIComponent\(flag\)'

composite_rules:
  - id: node-ctf-flag-oast-exfiltration
    desc: Node exfiltrates CTF flag to OAST
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: node-encodes-flag-in-data-query
      - id: node-oast-pro-domain
    any:
      - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag
      - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag-bracket
