defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  crit: hostile
  attack: T1552.001,T1041
traits:
- id: sentry-posts-serialized-event
  desc: Posts serialized event to Sentry
  crit: component
  if:
    type: text
    regex: 'json\.dumps\(event,[\s\S]{0,900}data=body,'
- id: sentry-environment-event-report
  desc: Sends collected event to Sentry
  crit: component
  if:
    type: text
    regex: 'def (report_environment|capture_message)\([\s\S]{0,999}[\s\S]{0,101}_send\(event\)'
- id: sentry-environment-context-field
  desc: Adds telemetry diagnostics to event
  crit: notable
  if:
    type: text
    substr: 'fields["contexts"]["telemetry"] = telemetry'
- id: sentry-copies-environment-values
  desc: Copies every environment value to diagnostics
  crit: notable
  if:
    type: text
    regex: '(diagnostic_debug\.append|telemetry_real\s*\+=)\s*\(?f"\{key\}=\{value\}'
composite_rules:
- id: python-sentry-environment-exfil
  desc: Python sends full environment in Sentry event
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-iteration
  - id: sentry-copies-environment-values
  - id: sentry-environment-context-field
  - id: sentry-environment-event-report
  - id: sentry-posts-serialized-event
- id: python-full-environment-urllib-exfil
  desc: Python sends full environment to an OOB collector
  conf: 0.99
  near_lines: 12
  all:
  - id: micro-behaviors/communications/http/client/initialize::python-urllib-oob-request-target
  - id: micro-behaviors/communications/http/request/json::python-environ-json-request-send
- id: silent-python-environment-urllib-exfil
  desc: Python silently exfiltrates process environment
  conf: 0.99
  near_lines: 40
  all:
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-dict
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
  any:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/os/env/enumerate/entries::python-environment-snapshot-field
