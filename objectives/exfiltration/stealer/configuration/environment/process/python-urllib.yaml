defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  crit: hostile
  attack: T1552.001,T1041
composite_rules:
- id: python-full-environment-urllib-exfil
  desc: Python sends full environment to an OOB collector
  conf: 0.99
  near_lines: 12
  all:
  - id: micro-behaviors/communications/http/client/initialize::python-urllib-oob-request-target
  - id: micro-behaviors/communications/http/request/json::python-environ-json-request-send
- id: silent-python-environment-urllib-exfil
  desc: Python silently exfiltrates process environment
  conf: 0.99
  near_lines: 40
  all:
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
  any:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/os/env/enumerate::python-environment-snapshot-field
