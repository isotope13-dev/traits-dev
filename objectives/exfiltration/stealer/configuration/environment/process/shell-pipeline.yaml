defaults:
  platforms:
  - unix
  for:
  - shell
  attack: T1552.001,T1041
  mbc: E1020
composite_rules:
- id: env-full-dump-piped-to-network-client
  desc: Uploads entire environment as remote HTTP body
  crit: hostile
  conf: 0.95
  near_bytes: 0
  all:
  - id: micro-behaviors/communications/http/request/credentials/environment::shell-env-stdin-curl-upload
  any:
  - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
