defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - python-sdist
  - tar
  - zip
  crit: hostile
  attack: T1195.002,T1552.001,T1041
composite_rules:
- id: pypi-build-imports-environment-telemetry
  desc: PyPI build executes full-environment telemetry
  conf: 0.995
  scope: archive
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/os/telemetry/logging/analytics::telemetry-send
  - id: objectives/exfiltration/stealer/configuration/environment/process::python-full-environment-urllib-exfil
- id: python-import-time-environment-sentry-exfil
  desc: Import-time Sentry upload sweeps environment
  conf: 0.99
  scope: archive
  for:
  - whl
  - python-sdist
  - python
  all:
  - id: micro-behaviors/os/env/enumerate/entries::environ-items-loop-string-accumulate
  - id: micro-behaviors/communications/http/log-sink::sentry-ingest-auth-header
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
  - id: micro-behaviors/data/control-flow/module-exec::try-block-module-call
