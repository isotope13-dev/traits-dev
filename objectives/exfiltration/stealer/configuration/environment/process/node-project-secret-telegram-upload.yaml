# Identifier-independent form of node-project-env-session-telegram-exfil: the
# same collection (process.env sweep, dotenv-style project files, WhatsApp-style
# `tokens/*.json` session files) uploaded through a Telegram bot, without relying
# on the `targets`/`grab` names the wppconnect releases happened to use.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1005,T1041,T1552.001,T1567.001
  mbc: E1041

traits:
  - id: node-dotenv-variant-file-names
    desc: Lists several dotenv variant file names
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']\.env["''][\s\S]{0,200}["'']\.env\.(local|production|development|prod)["'']'
  - id: node-tokens-dir-json-file-read
    desc: Reads JSON files from tokens directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''][\w-]{0,40}tokens["''][\s\S]{0,700}\.json[\s\S]{0,700}readFileSync\('

composite_rules:
  - id: node-project-secret-telegram-upload
    desc: Uploads env, dotenv and session files via Telegram
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 12000
    all:
      - id: node-dotenv-variant-file-names
      - id: node-tokens-dir-json-file-read
      - id: micro-behaviors/os/env/enumerate/copy::node-enumerated-env-value-read
    any:
      - id: micro-behaviors/communications/http/services/telegram::encoded-telegram-document-upload-endpoint
      - id: micro-behaviors/communications/http/services/telegram::plaintext-telegram-document-upload-endpoint
    unless:
      - id: metadata/path/directory::test-directory-component
