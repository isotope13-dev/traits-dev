defaults:
  platforms:
  - windows
  - linux
  for:
  - javascript
  - typescript
  - tar
  - zip
  attack: T1195.002,T1041,T1082,T1552.005
  mbc: E1041
composite_rules:
- id: node-host-profile-http-post-file
  desc: Script shells out, reads env, and posts a JSON body
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  scope: file
  near_bytes: 3500
  all:
  - id: metadata/import/builtin::require-child-process
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/os/env/enumerate/copy::node-process-env-object-field
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/body/construction::request-write-call
  - id: micro-behaviors/communications/http/request/body/construction::request-end-call
  - id: micro-behaviors/data/serialize/json::json-stringify-call
- id: npm-preinstall-profile-http-post
  desc: npm preinstall profiles host and posts data
  crit: hostile
  conf: 0.99
  for:
  - npm
  - tar
  - zip
  - pe
  - deb
  - asar
  - javascript
  - csharp
  - manifests
  scope: package
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-host-profile-http-post-file
- id: environment-names-json-post-source
  desc: Environment names and JSON POST in source
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  scope: file
  all:
  - id: micro-behaviors/os/env/enumerate/list::js-object-keys-env
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  any:
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-body
  - id: micro-behaviors/communications/http/request/body/construction::request-write-payload-variable
  needs: 1
- id: npm-postinstall-environment-names-json-post
  desc: npm hook with env names and HTTPS POST
  crit: suspicious
  conf: 0.9
  attack: T1195.002,T1041,T1082
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  - typescript
  scope: package
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: objectives/exfiltration/stealer/configuration/environment/process::environment-names-json-post-source
