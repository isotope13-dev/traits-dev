defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1195.002,T1552.001

traits:
  - id: python-setup-print-env-build-tunnel-request
    desc: Prints environment and prepares tunnel request
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @func body: (block
            (expression_statement (assignment left: (identifier) @env right: (call function: (identifier) @dict
              arguments: (argument_list (attribute object: (identifier) @os attribute: (identifier) @environ)))))
            (expression_statement (call function: (identifier) @print arguments: (argument_list (identifier) @env2)))
            (expression_statement (assignment left: (identifier) @encoded right: (call
              function: (attribute object: (call function: (attribute object: (attribute object: (identifier) @urllib attribute: (identifier) @parse) attribute: (identifier) @urlencode)
                arguments: (argument_list (identifier) @env3)) attribute: (identifier) @encode))))
            (expression_statement (assignment left: (identifier) @url right: (string) @address))
            (expression_statement (assignment right: (call
              function: (attribute object: (attribute object: (identifier) @urllib2 attribute: (identifier) @requestmod) attribute: (identifier) @request)
              arguments: (argument_list (identifier) @url2 (keyword_argument name: (identifier) @data value: (identifier) @encoded2)))))))
          (expression_statement (call function: (identifier) @called)))
          (#eq? @func @called) (#eq? @dict "dict") (#eq? @os "os") (#eq? @environ "environ")
          (#eq? @print "print") (#eq? @env @env2) (#eq? @env @env3)
          (#eq? @urllib "urllib") (#eq? @urllib2 "urllib") (#eq? @parse "parse")
          (#eq? @urlencode "urlencode") (#eq? @encode "encode") (#eq? @encoded @encoded2)
          (#eq? @url @url2) (#eq? @requestmod "request") (#eq? @request "Request") (#eq? @data "data")
          (#match? @address "https?://[^/ ]+[.]ngrok-free[.]app"))
