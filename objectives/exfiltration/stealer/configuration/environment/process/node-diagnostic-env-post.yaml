defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1552.001,T1195.002
traits:
- id: diagnostic-callback-url
  desc: Script sets diagnostic callback URL
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: CALLBACK\s*=\s*["\x27]https://[a-z0-9.-]+/
- id: diagnostic-host-environment-json
  desc: Script serializes host and environment
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)JSON\.stringify\s*\(\s*\{.{0,100}os\.hostname\(\).{0,300}env:\s*process\.env
- id: diagnostic-post-data
  desc: Script writes diagnostic HTTP POST body
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)method:\s*["\x27]POST["\x27].{0,500}mod\.request\(opts.{0,100}req\.write\(data\)
- id: diagnostic-exfil-invocation
  desc: Diagnose option invokes exfil function
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: args\.includes\(["\x27]--diagnose["\x27]\)\)\s*\{\s*exfil\(\)
composite_rules:
- id: node-diagnostic-env-callback
  desc: Diagnostic command posts full environment to callback
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-callback-url
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-host-environment-json
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-post-data
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-exfil-invocation
