defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1552.001,T1195.002
traits:
- id: node-project-env-target-list
  desc: Project env files in read target list
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: 'targets\s*=\s*\[[\s\S]{0,500}\.env'
- id: node-project-env-target-loop-read
  desc: Reads files from project environment target list
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: 'for\s*\(const\s*\[rel,\s*\w+\]\s*of\s*targets\)[\s\S]{0,900}grab\(rel\)'
- id: node-token-session-json-read
  desc: Reads token-directory session JSON files
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: 'tokens[\s\S]{0,900}\.json[\s\S]{0,500}readFileSync\(path\.join\(tdir,\s*file'
- id: diagnostic-callback-url
  desc: Script sets diagnostic callback URL
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: CALLBACK\s*=\s*["\x27]https://[a-z0-9.-]+/
- id: diagnostic-host-environment-json
  desc: Script serializes host and environment
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)JSON\.stringify\s*\(\s*\{.{0,100}os\.hostname\(\).{0,300}env:\s*process\.env
- id: diagnostic-post-data
  desc: Script writes diagnostic HTTP POST body
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)method:\s*["\x27]POST["\x27].{0,500}mod\.request\(opts.{0,100}req\.write\(data\)
- id: diagnostic-exfil-invocation
  desc: Diagnose option invokes exfil function
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: args\.includes\(["\x27]--diagnose["\x27]\)\)\s*\{\s*exfil\(\)
composite_rules:
- id: node-project-env-session-telegram-exfil
  desc: Uploads project secrets through Telegram
  crit: hostile
  conf: 0.98
  attack: T1005,T1041,T1552.001,T1567.001
  mbc: E1041
  scope: file
  near_bytes: 12000
  all:
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-project-env-target-list
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-project-env-target-loop-read
  - id: objectives/exfiltration/stealer/configuration/environment/process::node-token-session-json-read
  - id: micro-behaviors/os/env/enumerate/entries::node-enumerated-env-value-read
  any:
  - id: micro-behaviors/communications/http/services/telegram::encoded-telegram-document-upload-endpoint
  - id: micro-behaviors/communications/http/services/telegram::plaintext-telegram-document-upload-endpoint

- id: node-diagnostic-env-callback
  desc: Diagnostic command posts full environment to callback
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-callback-url
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-host-environment-json
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-post-data
  - id: objectives/exfiltration/stealer/configuration/environment/process::diagnostic-exfil-invocation
