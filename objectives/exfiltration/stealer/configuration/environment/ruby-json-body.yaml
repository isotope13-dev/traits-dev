defaults:
  for: [ruby]
  platforms: [unix, windows]
composite_rules:
  - id: ruby-filtered-secret-env-json-post
    desc: Secret-filtered environment sent as JSON POST
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/enumerate::ruby-env-hash-sensitive-filter
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-filtered-env-json-net-http-request-body
