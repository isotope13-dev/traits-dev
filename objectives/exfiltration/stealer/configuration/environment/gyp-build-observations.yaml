defaults:
  platforms: [unix, windows]
  for: [gyp]
  attack: T1195.002,T1041

composite_rules:
  - id: native-build-environment-exfiltration
    desc: Native build action dumps environment variables to a remote sink
    crit: hostile
    conf: 0.99
    scope: archive
    for: [npm, gyp]
    mbc: E1041
    all:
      - id: metadata/build/package/recipe/native::gyp-build-action
      - id: micro-behaviors/os/env/report::build-action-environment-dump
      - id: micro-behaviors/communications/http/webhook::webhook-http-post
      - id: micro-behaviors/communications/http/request/verb::post-method
