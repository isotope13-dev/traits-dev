defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-full-environment-base64-http-exfil
  desc: Uploads full process.env as Base64 JSON over HTTP
  crit: hostile
  conf: 0.99
  attack: "T1552.001,T1041,T1132.001"
  mbc: "E1552,E1041"
  for: [javascript, typescript, npm, tar]
  all:
  - id: micro-behaviors/os/env/read::node-process-env-object-copy
  - id: micro-behaviors/data/encode/base64::node-base64-json-data-field
  - id: micro-behaviors/communications/http/request/body::node-upload-sink
