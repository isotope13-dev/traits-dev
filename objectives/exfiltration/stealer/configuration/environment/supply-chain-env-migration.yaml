defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1552.001
composite_rules:
- id: npm-postinstall-filtered-identity-env-exfil
  desc: npm hook exfiltrates filtered developer environment fields
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - package.json
  all:
  - id: micro-behaviors/os/env/enumerate::npm-postinstall-env-iteration
  - id: metadata/package/scripts/reference::npm-postinstall-env-identity-filter
  - id: micro-behaviors/communications/http/curl/body::curl-http-post
  - id: micro-behaviors/communications/http/curl/body::curl-stdin-body-post
