# Environment contents leave the host from a background daemon thread whose
# network errors are swallowed, alongside a public-IP lookup. The caller of
# the library function never sees the transfer or its failures.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1041

composite_rules:
  - id: python-daemon-thread-env-ip-post
    desc: Daemon thread posts env listing with public-IP lookup
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/os/env/enumerate::python-environ-iteration
      - id: micro-behaviors/process/thread/create::python-daemon-thread
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
      - id: micro-behaviors/communications/http/ip-discovery
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/request/verb::python-post-method-keyword
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/post::python-http-post-client-call
