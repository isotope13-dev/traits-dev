defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: python-envvar-exfil
  desc: Python environment variable exfiltration
  crit: hostile
  conf: 0.95
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/os/env/read/variable::os-environ-symbol
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/request/client::request-python
- id: pypi-install-full-environment-exfil
  desc: PyPI install hook sends the full process environment over HTTP
  crit: hostile
  conf: 0.95
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: objectives/exfiltration/stealer/configuration/environment::python-full-environment-http-exfil
