composite_rules:
- platforms:
  - windows
  - unix
  for:
  - python
  attack: T1195.002,T1552.001,T1041
  mbc: E1552,E1041
  id: pypi-setup-full-environment-oob-exfil
  desc: setup.py posts the full process environment to an OOB collector
  crit: hostile
  conf: 0.99
  scope: leaf
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/body/environment::python-environment-http-body-flow
