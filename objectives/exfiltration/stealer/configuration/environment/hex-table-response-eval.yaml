# Concealed environment export co-occurs with a bound HTTP response evaluator.
# Each primitive binds its own operands; this does not join distinct requests.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030
composite_rules:
- id: js-concealed-env-post-with-response-eval
  desc: Concealed environment POST with response evaluation
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/exfiltration/stealer/configuration/environment::js-hex-table-env-post
  - id: micro-behaviors/process/deploy/script-eval::hex-table-axios-response-eval
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
