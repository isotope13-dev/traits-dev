# Credential theft from Python packages that execute during installation or
# import.  The source incident involved a package published under a requested
# dependency name; the package identity is intentionally not part of this
# rule.  The useful static signal is the package execution boundary combined
# with credential collection and an outbound structured request.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python_sdist]
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1041

composite_rules:
  - id: objectives/exfiltration/stealer/configuration/environment::pypi-dist-env-sweep-exfil
    desc: Published package exfiltrates swept environment
    crit: hostile
    conf: 0.97
    scope: archive
    for: [whl, python-sdist, python]
    all:
      - id: metadata/build/archive::wheel-contains-python-source
    any:
      - id: objectives/exfiltration/http/env::python-environment-encoded-http-exfil
      - id: objectives/exfiltration/http/env::python-credential-env-url-path-exfil
    unless:
      - id: metadata/path/directory::test-directory-component
