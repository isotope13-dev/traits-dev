composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - go
  id: credential-environment-http-body
  desc: Credential environment material with HTTP body
  crit: suspicious
  conf: 0.94
  attack: T1041
  all:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::secret-http-request-flow
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-env-access-body
  - id: micro-behaviors/os/env/secret-name::javascript-returned-credential-env-object
  - id: micro-behaviors/os/env/enumeration::os-environ
  unless:
  - id: micro-behaviors/os/env/cicd::go-hashed-ci-repo-telemetry
  - id: micro-behaviors/communications/http/services/github::github-api-host
  - id: micro-behaviors/communications/http/services/cloudflare::cloudflare-api-host
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
