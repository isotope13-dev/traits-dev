defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1552.001,T1567.002
  mbc: E1041,E1552

composite_rules:
  - id: node-cli-args-and-artifactory-credentials-webhook-exfil
    desc: Sends CLI args and credentials to an Artifactory webhook
    crit: hostile
    conf: 0.995
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/info/commandline::check-argv
      - id: micro-behaviors/os/env/secret-name::javascript-credential-env-reference
      - id: micro-behaviors/os/env/secret-name::javascript-artifactory-reader-credential-env-reference
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/services/artifactory::go-api-route
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
    any:
      - id: micro-behaviors/communications/http/client/script::fetch-call
      - id: micro-behaviors/communications/http/request/client::https-request
