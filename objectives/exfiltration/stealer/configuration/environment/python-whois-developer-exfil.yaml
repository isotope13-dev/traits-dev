# A WHOIS contact field supplies the destination while selected process
# secrets and developer credential files are assembled into an HTTP POST.
defaults:
  platforms: [linux, macos, windows]
  for: [python, whl, python-sdist]
  attack: T1041,T1552.001

composite_rules:
  - id: python-whois-developer-credential-exfil
    desc: Uploads environment secrets and developer credentials to WHOIS relay
    crit: hostile
    conf: 0.98
    scope: archive
    near_lines: 60
    all:
      - id: objectives/command-and-control/channel/deaddrop/public-service::source-whois-ipv4-dead-drop
      - id: objectives/credential-access/env/secrets/filtered-access::python-bulk-secret-env-harvest
      - id: micro-behaviors/fs/path/developer-credential::developer-auth-file-reference
      - id: micro-behaviors/fs/read/file/content/unspecified::python-file-content-read-operation
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
