defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1552.001,T1041
composite_rules:
- id: python-dotenv-env-cookie-request-exfil
  desc: Exfiltrates dotenv secret in an HTTP Cookie
  crit: hostile
  conf: 0.97
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/directory/traverse::python-dotenv-walk-load-context
  - id: micro-behaviors/communications/http/cookies::python-env-value-in-cookie-header
  - id: micro-behaviors/communications/http/get::requests-get
  # The secret only leaves for a destination the author fixed. A helper that
  # sends the user's own session cookie to a caller-supplied URL (an API or
  # puzzle-input fetcher) is ordinary authenticated client code.
  - id: micro-behaviors/communications/http/request/url::requests-get-url-literal
- id: python-dotenv-bidirectional-harvest-cookie-request
  desc: Bidirectional .env harvest sends secret in Cookie via GET
  crit: hostile
  conf: 0.94
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/directory/traverse::python-dotenv-walk-load-context
  - id: micro-behaviors/communications/http/cookies::python-env-value-in-cookie-header
  - id: micro-behaviors/communications/http/get::requests-get
  # The harvest is exhaustive in both directions: a recursive downward walk
  # for secret files plus an upward parent-directory climb to the filesystem
  # root. Ordinary clients load a known config path or climb to the project
  # root; sweeping the whole subtree and every parent for secrets before
  # transmitting one in an authentication header is harvester behavior, even
  # when the GET destination is a caller-supplied parameter.
  any:
  - id: micro-behaviors/fs/directory/traverse::python-dirname-root-break-walk
  - id: micro-behaviors/fs/directory/traverse::python-dirname-while-ne-walk
  - id: micro-behaviors/fs/directory/traverse::python-pathlib-parent-directory-walk
