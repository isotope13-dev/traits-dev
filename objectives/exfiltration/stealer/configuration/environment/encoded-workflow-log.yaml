# Encoded bulk CI log output bypasses verbatim masking, but the environment
# is not guaranteed to contain secrets. The exported item is an environment
# snapshot; the separate secrets expression supplies context, not a binding.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: suspicious
  conf: 0.94
  attack: T1567

composite_rules:
  - id: gha-encoded-environment-log
    desc: Encoded environment log with Actions secrets
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
    any:
      - id: micro-behaviors/os/env/enumerate::gha-shell-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-shell-hex-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-python-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-node-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-powershell-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-ruby-encoded-environment-output
