# A workflow step that writes the runner environment and the serialized
# github context (which includes github.token) to a file and posts it to a
# chat bot API hands the job's credentials and repository metadata to whoever
# holds the bot. Injected as a "Code Quality" workflow into repositories
# hijacked during the 2026 TrojanPony campaign (Telegram sendDocument).
#
# The step env binding lives in the workflow; the dump and upload live in the
# decoded run script, so each layer gets its own rule.
defaults:
  platforms: [unix, windows]
  attack: T1552.001,T1567

composite_rules:
  - id: gha-github-context-to-telegram-bot
    desc: Workflow binds the whole github context and calls a Telegram bot API
    crit: hostile
    conf: 0.95
    for: [github-actions]
    all:
      - id: micro-behaviors/os/env/credential/ci::step-env-complete-github-context-json
      - id: micro-behaviors/communications/messaging/telegram::workflow-telegram-bot-token-url

  - id: shell-env-and-dotenv-chat-upload
    desc: Shell dumps the environment and .env file, then uploads a file to a chat bot
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/os/env/output::shell-env-pipe
      - id: micro-behaviors/fs/read/file/target::shell-cat-dotenv-file
    any:
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
      - id: micro-behaviors/communications/messaging/send::chat-send-document
