defaults:
  platforms:
  - unix
  - windows
  for:
  - github-actions
  crit: suspicious
  conf: 0.94
  attack: T1567
composite_rules:
- id: gha-encoded-environment-log
  desc: Encoded environment log with Actions secrets
  all:
  - id: micro-behaviors/os/env/secret/ci::complete-secrets-json-expression
  any:
  - id: micro-behaviors/os/env/enumerate/output::gha-shell-encoded-environment-output
  - id: micro-behaviors/os/env/enumerate/output::gha-shell-hex-environment-output
  - id: micro-behaviors/os/env/enumerate/output::gha-python-encoded-environment-output
  - id: micro-behaviors/os/env/enumerate/output::gha-node-encoded-environment-output
  - id: micro-behaviors/os/env/enumerate/output::gha-powershell-encoded-environment-output
  - id: micro-behaviors/os/env/enumerate/output::gha-ruby-encoded-environment-output
