defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [binaries, scripts, source, manifests, documents, media, data]
  attack: T1041
  mbc: B0030

composite_rules:
- id: go-env-http-exfiltration
  desc: Environment variable exfiltration via HTTP (Go)
  crit: hostile
  conf: 0.95
  for: [go]
  near_bytes: 512
    # Bare os.Environ() next to a POST is not exfiltration: process managers
    # copy the environment into a child while a different branch posts an
    # empty wake or health request. The environment has to be walked or
    # joined into one string in the same window as the POST.
  all:
  - id: micro-behaviors/communications/http/post::http-post-methods
  any:
  - id: micro-behaviors/os/env/enumeration::go-environ-iteration
  - id: micro-behaviors/os/env/enumeration::go-environ-joined
  unless:
    # Skywire's rewards tooling passes config paths to the localhost-only
    # child nodes it orchestrates; environment-plus-HTTP there is local
    # process management, not exfiltration.
  - id: well-known/app/network/skywire::skywire-distribution
    # TiUP publisher service manages subprocess environment for tiup mirror publish
    # while notifying build/publish status via webhooks.
  - id: well-known/tool/packaging/tiup::tiup-publisher-context
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
    # Local worker process management and health/control pings to loopback endpoints
    # are not external environment exfiltration.
  - id: micro-behaviors/communications/http/url/host::loopback-http-url-reference
  downgrade:
    any:
    - id: metadata/signed/platform/

