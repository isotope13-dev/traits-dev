defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-env-harvest
  desc: Python harvests and sends env vars
  crit: hostile
  conf: 0.95
  mbc: "E1552"
  attack: T1552.001
  any:
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: micro-behaviors/os/env/read/collection::python-environ-copy
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/os/env/enumerate::python-environ-iteration
  all:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: micro-behaviors/communications/http/request/body/environment::python-harvested-environment-http-body
