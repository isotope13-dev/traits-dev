defaults:
  platforms: [unix, windows]

composite_rules:
- id: python-env-harvest
  desc: Python harvests and sends env vars
  crit: hostile
  conf: 0.95
  mbc: "E1552"
  attack: T1552.001
  for: [python]
  any:
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/os/env/enumerate::python-environ-iteration
  all:
  - id: micro-behaviors/communications/http/request/body/environment::python-environment-http-body-flow
  unless:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::byok-llm-chat-client-context
  - id: well-known/app/ai/agent-runtime/
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
