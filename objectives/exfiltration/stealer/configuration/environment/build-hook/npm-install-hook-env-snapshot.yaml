# A package install hook that sends a whole-environment snapshot to a remote
# host. The payload is the environment (configuration), and the install hook
# is the trigger that runs it at install time. This mirrors the
# system-info/host-user/build-hook grouping for build-time transfers. The
# process leaf is at its rule ceiling, so the install-time transfer lives here.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1041
  mbc: E1041
composite_rules:
- id: npm-install-hook-env-snapshot-post
  desc: Install hook POSTs an encoded full environment snapshot
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  - id: micro-behaviors/os/env/enumerate/entries::npm-script-shell-env-snapshot
  - id: micro-behaviors/communications/http/request/verb::npm-script-http-post
  any:
  - id: micro-behaviors/communications/url/host/port-http::preinstall-ip-port-url
  - id: metadata/package/scripts/command::preinstall-curl-http-url
