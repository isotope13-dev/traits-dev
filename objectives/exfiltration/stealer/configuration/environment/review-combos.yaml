defaults:
  for:
  - javascript
  - typescript
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  crit: hostile
  attack: T1552.001,T1041
composite_rules:
- id: javascript-env-credential-oob-http-exfil
  desc: Node sends serialized environment credentials to an OOB collector
  conf: 0.99
  scope: file
  near_bytes: 4096
  mbc: E1552,E1041
  all:
  - id: micro-behaviors/data/serialize/json::json-stringify-env-access-body
  - id: micro-behaviors/os/env/secret-name::javascript-credential-env-reference
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
- id: javascript-xor-env-http-exfil
  desc: XOR-hidden HTTP exfiltrates filtered environment
  conf: 0.99
  scope: file
  near_bytes: 4096
  mbc: E1041
  all:
  - id: micro-behaviors/os/env/read::js-filtered-env-copy
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
  - id: micro-behaviors/process/io/stream::javascript-write-then-end-stream
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
  unless:
  - id: metadata/package/testing/
  - id: metadata/signed/platform/
  - id: metadata/path::test-directory-component
- id: javascript-fetch-json-ai-env-keys-exfil
  desc: Fetch POST JSON body with AI provider env keys
  conf: 0.98
  scope: file
  near_bytes: 2048
  mbc: E1552,E1041
  all:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/data/serialize/json::json-stringify-env-access-body
  - id: micro-behaviors/os/env/ai-provider::ai-provider-key-env-reference
  unless:
  - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
