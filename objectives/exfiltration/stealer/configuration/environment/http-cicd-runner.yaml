# CI runner process-memory secret exfiltration. TeamPCP's Trivy and KICS
# payloads used Python, but these mechanics are language-neutral: select the
# Runner.Worker process, read its procfs memory, locate isSecret records, and
# send the recovered values in an outbound HTTP request.
defaults:
  crit: hostile
  platforms: [unix]
  for: [python, javascript, typescript, shell, go]
  attack: T1003.007,T1041,T1552.001

composite_rules:
- id: cicd-environ-trycloudflare-exfil
  for: [python, javascript]
  desc: Harvests CI process environ and posts via Cloudflare tunnel
  conf: 0.97
  attack: T1003.007,T1041,T1090
  scope: file
    # The environ read, the tunnel host, and the POST are one harvest.
    # A remote-terminal daemon can read HOP_SESSION from /proc, parse its
    # own cloudflared URL, and serve an unrelated fetch far from either.
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/proc/info/path::process-environ-targeting
  - id: micro-behaviors/communications/proxy/tunnel::trycloudflare-domain
  any:
  - id: micro-behaviors/communications/http/request/client::python-http-post-any
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  unless:
  - id: well-known/app/ai/agent-runtime/launchsecure/
  - id: well-known/app/ai/agent-runtime/agentproto/
  - id: well-known/app/ai/agent-runtime/tesseract/
  - id: well-known/app/ai/agent-runtime/openmausbot/


