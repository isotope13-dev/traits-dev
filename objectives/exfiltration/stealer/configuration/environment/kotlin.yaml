defaults:
  platforms: [windows, unix]
  for: [kotlin]
  attack: T1041

# The destructuring for-loop and the `appendLine("$k=$v")` assembly are plain
# Kotlin syntax with no credential meaning of their own; they now live in
# micro-behaviors/data/. Keeping them here made every Kotlin package that
# iterates a Map a standalone member of this exfiltration directory, which
# composites that reference the directory wholesale then treated as evidence.
composite_rules:
- id: kotlin-env-http-exfil
  desc: Kotlin env HTTP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/env/dump::kotlin-env-map-dump
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/communications/http/post::jvm-http-body-write-source
