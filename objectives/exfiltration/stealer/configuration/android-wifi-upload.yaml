defaults:
  platforms: [android, unix]
  for: [c, cpp, javascript, typescript, python, go]
  crit: suspicious
  conf: 0.94

composite_rules:
  - id: android-wifi-store-read-upload
    desc: Android Wi-Fi store path near file reads and HTTP bodies
    # A whole configuration container, not an extracted PSK value. Reading a
    # path and sending data nearby does not establish a source-to-body binding.
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/config/network::android-wifi-config-store
      - id: micro-behaviors/fs/read/file/content/unspecified::source-file-content-read-api
      - id: micro-behaviors/communications/http/upload/body::source-http-body-send
