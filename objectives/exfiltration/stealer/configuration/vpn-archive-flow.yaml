# The archive source argument, returned archive path, opened file, and HTTP
# multipart field are connected by source-local value flow. Backups can do
# this too: report suspicious export, without asserting unauthorized theft.
defaults:
  for: [python]
  platforms: [linux, macos, windows]
  attack: T1005,T1560.001,T1041
traits:
  - id: python-vpn-archive-multipart-export
    desc: Uploads an OpenVPN configuration archive
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(post|put)$'
      arg:
        from:
          field: files
          call: '^shutil\.make_archive$'
          argument: 2
          literal: '(?i)((^|[/\\])OpenVPN[/\\]+config([/\\]|$)|/etc/openvpn/?$)'
          through:
            - call: '^open$'
              arguments: [0]
