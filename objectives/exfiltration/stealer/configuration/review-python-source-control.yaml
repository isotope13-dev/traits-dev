composite_rules:
- platforms:
  - unix
  - windows
  id: python-source-control-credential-post
  desc: Source-control credential reads with HTTP POST
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041
  mbc: E1552
  for:
  - python
  near_bytes: 32768
  all:
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: objectives/credential-access/files/config::python-source-control-file-read
  - id: micro-behaviors/communications/http/post::requests-post
