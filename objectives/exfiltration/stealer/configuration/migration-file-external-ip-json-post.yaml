defaults:
  crit: hostile
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1041,T1071.001
  mbc: E1041
composite_rules:
- id: python-posts-ssh-files-to-raw-ip
  desc: Posts SSH files to a raw IP
  attack: T1552.004,T1041
  scope: file
  for:
  - python
  - python-sdist
  all:
  - id: micro-behaviors/fs/path/config/ssh::ssh-directory-literal
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
