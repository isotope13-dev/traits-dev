composite_rules:
- for:
  - tar
  - zip
  - go
  platforms:
  - unix
  - windows
  attack: T1552.001,T1041
  id: go-package-credential-upload
  desc: Go helpers upload developer credentials
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/http/request/credentials::go-package-credential-file-body
