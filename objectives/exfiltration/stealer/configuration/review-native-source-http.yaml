defaults:
  platforms:
  - windows
  - unix
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1041
composite_rules:
- for:
  - swift
  id: swift-package-auth-file-http-post
  desc: Swift reads package authentication files and posts their contents
  all:
  - id: micro-behaviors/fs/path/secret-config::package-auth-config-path-reference
  - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api
  - id: micro-behaviors/communications/http/request/body::swift-urlrequest-http-body
  - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
- for:
  - perl
  id: perl-package-auth-file-http-post
  desc: Perl reads package authentication files and posts collected contents
  all:
  - id: micro-behaviors/fs/path/secret-config::package-auth-config-path-reference
  - id: micro-behaviors/fs/read/file/full::perl-slurp-local-record-separator
  - id: micro-behaviors/communications/http/request/body::perl-http-post-content-map
  - id: metadata/lang/source/syntax/call/invocation::perl-post-method-call
