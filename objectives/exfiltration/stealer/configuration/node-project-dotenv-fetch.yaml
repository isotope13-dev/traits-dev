defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-project-secret-fetch-exfil
  desc: Node secret paths, reads, and JSON fetch
  crit: hostile
  conf: 0.98
  # Keep file-target evidence close to the POST. A large legitimate bundle can
  # contain project-inspection code, credential names, and unrelated registry
  # POSTs in separate modules without transferring those files.
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  - id: micro-behaviors/fs/read/file/content/unspecified::file-content-read-operation
  any:
  - id: micro-behaviors/fs/read/file/target::node-file-content-record
  - id: micro-behaviors/fs/directory/enumerate::node-dirent-directory-walk
