defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1041
traits:
- id: hardhat-encrypted-network-config-post
  desc: Encrypts and posts Hardhat network configuration
  crit: suspicious
  conf: 0.995
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /networksFilter\s*\(\s*hre\s*\)/s
          $b0_1 = /aesEncrypt\s*\(\s*info\s*,\s*AES_KEY\s*\)/s
          $b0_2 = /axios\.post\s*\(\s*API_URL\s*\+\s*["']\/projects\/setData["']/s
          $b0_3 = /info\s*:\s*encodedInfo/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 250 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 200 and
                    true
                  )
                )
              )
            )
          )
      }
- id: hardhat-network-config-serialization
  desc: Serializes Hardhat network configuration
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /function\s+networksFilter\s*\(\s*hre\s*\)/s
          $b0_1 = /hre\.config\.networks/s
          $b0_2 = /JSON\.stringify\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 500 and
                  true
                )
              )
            )
          )
      }
composite_rules:
- id: hardhat-network-config-exfil
  desc: Hardhat network configuration encrypted and posted
  crit: hostile
  conf: 0.995
  scope: file
  all:
  - id: hardhat-encrypted-network-config-post
  - id: hardhat-network-config-serialization
  - id: micro-behaviors/data/embedded/hardhat::hardhat-config-stealer-heuristics
