defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041
composite_rules:
- id: rust-project-env-exfiltration
  desc: Rust project dotenv exfiltration
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/resource-path/collection::rust-project-env-api-path
  - id: metadata/lang/source/naming/variable::rust-env-content-reference
  any:
  - id: micro-behaviors/communications/url/resource-path/file::rust-file-api-path
  - id: micro-behaviors/fs/path/config/environment::rust-dotenv-file-target
