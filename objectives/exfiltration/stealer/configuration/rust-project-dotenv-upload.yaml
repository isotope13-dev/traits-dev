defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041
composite_rules:
- id: rust-project-env-exfiltration
  desc: Rust project dotenv exfiltration
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/http-path::rust-project-env-api-path
  - id: objectives/exfiltration/http/env::rust-env-content-field
  any:
  - id: micro-behaviors/communications/url/http-path::rust-file-api-path
  - id: objectives/credential-access/files/config::rust-dotenv-file-target
