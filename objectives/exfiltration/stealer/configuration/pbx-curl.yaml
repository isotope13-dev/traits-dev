# Bind the local configuration path to curl's multipart file argument. A bare
# PBX path elsewhere beside an HTTP client is insufficient. Routine support
# uploads remain possible, so these observations are suspicious, not hostile.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.96
  attack: T1552.001

traits:
  - id: curl-asterisk-config-upload
    desc: curl attaches an Asterisk configuration file
    if:
      type: text
      regex: '\bcurl\b[^\n;|]{0,40}(-F|--form)[ =]+["'']?[\w.-]+=@/etc/asterisk/[\w.]+\.conf'

