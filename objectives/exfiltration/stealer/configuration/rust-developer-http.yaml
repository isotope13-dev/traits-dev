defaults:
  platforms: [windows, unix]
  for: [rust]

composite_rules:
  # Reads authentication configuration and pipes the collected contents to a
  # remote curl request body: credential export over HTTP.
  - id: rust-developer-auth-config-http-exfil
    desc: Rust auth-config aggregate sent via curl stdin
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/developer-credential::developer-auth-file-reference
      - id: micro-behaviors/fs/read/file/content/unspecified::rust-read-to-string
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
      - id: micro-behaviors/process/stdio/write::rust-read-aggregate-to-child-stdin
    any:
      - id: micro-behaviors/communications/url/reference::explicit-http-request-destination
      - id: micro-behaviors/communications/url/scheme::http-url-literal
