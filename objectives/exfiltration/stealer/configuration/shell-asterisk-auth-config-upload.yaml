defaults:
  platforms: [unix]
  for: [scripts, source, binaries]
  attack: T1041,T1552.001

composite_rules:
  - id: encoded-asterisk-config-upload-to-ip
    desc: Encoded curl uploads Asterisk authentication configs to a raw IP
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/upload::encoded-curl-form-file-attachment
      - id: micro-behaviors/fs/path/secret-config::encoded-asterisk-auth-config-path
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-encoded
