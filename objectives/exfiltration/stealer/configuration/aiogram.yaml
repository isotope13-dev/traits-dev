defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: dotenv-enumeration-upload-handler
    desc: Enumerated .env files sent as documents
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition) @handler
          (#match? @handler "(?s)\\w+\\.name == [\"']\\.env[\"'].{0,500}reply_document\\(\\w+\\(\\w+\\)"))
composite_rules:
  - id: concealed-telegram-dotenv-theft
    for: [python, whl, zip, python-sdist]
    desc: Concealed Telegram bot steals .env files
    crit: hostile
    conf: 0.99
    attack: T1041
    all:
      - id: objectives/command-and-control/channel/messaging::concealed-threaded-telegram-polling
      - id: dotenv-enumeration-upload-handler
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-reply-document
