defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1005,T1041,T1195.002
  mbc: E1041

traits:
  - id: ipfs-url-validator-project-collector
    desc: References IPFS URL validator endpoint
  - id: ipfs-url-validator-endpoint
    desc: References IPFS URL validator collector
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'ipfs-url-validator\.vercel\.app/(fetchbs58|verify)'
composite_rules:
  - id: node-project-config-ipfs-validator-exfil
    desc: Crawls project configuration and uploads it to an IPFS validator endpoint
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/json::encoded-filesystem-name-and-json-post
    any:
      - id: ipfs-url-validator-endpoint
      - id: ipfs-url-validator-b64-prefix
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
