defaults:
  platforms: [unix]
  for: [groovy]
  attack: T1552.001,T1041

traits:
  - id: groovy-gradle-properties-curl-pipe
    desc: Groovy pipes Gradle properties into curl
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'cat\s+~/\.gradle/gradle\.properties\s*\|\s*curl\b'
  - id: groovy-curl-stdin-upload
    desc: Curl uploads data read from stdin
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'curl\s+-X\s+POST\s+--data-binary\s+@-'

composite_rules:
  - id: groovy-gradle-properties-upload
    desc: Groovy attempts Gradle properties upload
    crit: hostile
    conf: 0.99
    all:
      - id: groovy-gradle-properties-curl-pipe
      - id: groovy-curl-stdin-upload
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
