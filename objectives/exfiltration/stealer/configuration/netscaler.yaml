defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift, zig, elf]
  attack: T1041

composite_rules:

- id: netscaler-dns-exfil-label
  desc: NetScaler DNS exfil label
  crit: suspicious
  conf: 0.93
  near_bytes: 400
  all:
  - id: micro-behaviors/communications/url/host/label::exfil-label-reference
  any:
  - id: micro-behaviors/communications/url/http-path::netscaler-collect-route-reference
  - id: micro-behaviors/communications/url/http-path::exfil-api-agent-route-context
  - id: objectives/exfiltration/http/report::netscaler-data-chunk-header
  - id: micro-behaviors/fs/path/secret-config::netscaler-nsconfig-path

- id: netscaler-config-http-exfil
  desc: Config archive upload alongside PHP webshell
  crit: hostile
  conf: 0.98
  for: [perl]
  all:
  - id: micro-behaviors/data/archive/create/tar::perl-nsconfig-tar-command
  - id: micro-behaviors/communications/http/upload::curl-upload-or-form-option
  - id: objectives/command-and-control/backdoor/webshell/embedded::embedded-php-request-command

- id: netscaler-config-tar-external-exfil
  desc: Tar-staged config with raw upload to external IP
  crit: hostile
  conf: 0.98
  for: [perl]
  all:
  - id: micro-behaviors/data/archive/create/tar::perl-nsconfig-tar-argv-command
  - id: micro-behaviors/communications/http/curl::curl-data-binary
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script

- id: netscaler-config-dns-exfil
  desc: NetScaler config DNS exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/secret-config::netscaler-nsconfig-path
  - id: netscaler-dns-exfil-label
  any:
  - id: micro-behaviors/data/encode/payload::printf-hex-byte-format
  - id: micro-behaviors/fs/path/private-key::netscaler-ssl-material-path
