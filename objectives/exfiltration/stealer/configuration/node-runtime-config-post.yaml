defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, tgz]
  attack: T1041

composite_rules:
  - id: node-runtime-config-base64-query-post
    desc: Node sends serialized runtime configuration in a Base64 query and POST
    crit: suspicious
    conf: 0.94
    scope: archive
    near_bytes: 1800
    all:
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/url/construction/query::urlsearchparams-buffer-base64-value
      - id: micro-behaviors/communications/http/post::node-http-request-post
      - id: micro-behaviors/communications/http/request/body/construction::request-end-body-call
