defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-runtime-config-base64-query-post
    desc: Signing configuration export accompanies Base64 query and POST
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/data/serialize/json::javascript-serialized-hmac-config
      - id: micro-behaviors/communications/url/construction/query::urlsearchparams-buffer-base64-value
      - id: micro-behaviors/communications/http/post::request-post-option
      - id: micro-behaviors/communications/http/request/body/construction::node-http-json-end-body

  - id: node-silent-signing-config-export
    desc: Silently exports configuration containing the local HMAC key
    crit: hostile
    conf: 0.98
    near_bytes: 1
    all:
      - id: micro-behaviors/data/serialize/json::javascript-serialized-hmac-config
      - id: micro-behaviors/communications/http/request/body/construction::node-http-json-end-body
    # The source relationships meet at the same end() call. The shape also
    # requires an empty catch around the send; the separate finding records
    # the mirrored Base64 query without making encoding an attack prerequisite.
