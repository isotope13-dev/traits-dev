composite_rules:
- platforms:
  - unix
  - macos
  for:
  - swift
  - zip
  - tar
  id: swift-cloud-file-content-http-exfil
  desc: Swift exfils cloud credentials over HTTP
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: objectives/credential-access/cloud/local-credentials::swift-cloud-sensitive-paths
  - id: micro-behaviors/communications/http/request/body/construction::swift-urlrequest-http-body
  - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
