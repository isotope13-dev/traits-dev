defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041
composite_rules:
- id: vscode-hidden-config-zip-multipart-exfil
  desc: VS Code extension uploads shell and Solana config archive
  crit: hostile
  conf: 0.99
  for: [vsix, javascript, package.json]
  scope: archive
  attack: T1552.001,T1041,T1195.002
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: metadata/permission/activation::main-extension-js
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename-encoded
  - id: micro-behaviors/fs/path/config/shell::zshrc-filename-encoded
  - id: micro-behaviors/fs/path/config/app::id-json-filename-encoded
  - id: micro-behaviors/fs/path/wallet::node-user-solana-config-directory
  - id: micro-behaviors/data/archive/create/zip::node-zip-cli-quiet-create
  - id: micro-behaviors/communications/http/upload::formdata-blob-file-fetch-upload

- id: node-hidden-config-zip-multipart-exfil
  desc: Node archives hidden shell and Solana config for multipart upload
  crit: hostile
  conf: 0.99
  near_bytes: 4096
  attack: T1552.001,T1041
  all:
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename-encoded
  - id: micro-behaviors/fs/path/config/shell::zshrc-filename-encoded
  - id: micro-behaviors/fs/path/config/app::id-json-filename-encoded
  - id: micro-behaviors/fs/path/wallet::node-user-solana-config-directory
  - id: micro-behaviors/data/archive/create/zip::node-zip-cli-quiet-create
  - id: micro-behaviors/communications/http/upload::formdata-blob-file-fetch-upload
  unless:
  - id: metadata/package/testing/

  - id: "metadata/file/naming::test-directory-component"
