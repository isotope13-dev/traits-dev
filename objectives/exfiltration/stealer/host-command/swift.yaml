defaults:
  platforms: [unix]
  for: [swift]
  attack: T1041

traits:
  - id: swift-bin-uname-recon
    desc: Swift runs uname for host recon
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /bin/uname

  - id: swift-sbin-netstat-recon
    desc: Swift runs netstat for host recon
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /sbin/netstat

composite_rules:
  - id: swift-release-netstat-post
    desc: Posts OS release and netstat
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/os/identity::linux-release-file-reference
      - id: micro-behaviors/os/network/status::netstat
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body

  - id: swift-uname-netstat-post
    desc: Posts uname and netstat output
    crit: hostile
    conf: 0.96
    all:
      - id: swift-bin-uname-recon
      - id: swift-sbin-netstat-recon
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method

  - id: swift-ps-file-enum
    desc: Reads files and runs ps
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/enumerate/ps::ps-command-path-reference
      - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api
      - id: micro-behaviors/process/create/direct::swift-source-process-run
