defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: hostile
  conf: 0.97
  attack: T1041
  mbc: E1041
composite_rules:
- id: powershell-browser-and-wallet-store-http-post
  desc: PowerShell collects browser and wallet stores for HTTP POST
  near_bytes: 16384
  all:
  - id: micro-behaviors/fs/path/credential::browser-store-reference
  - id: micro-behaviors/fs/directory/traverse::powershell-recursive-file-enumeration
  - id: micro-behaviors/fs/read/file/full::powershell-file-readallbytes
  - id: micro-behaviors/communications/http/client/managed::httpwebrequest
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/process/io/stream::powershell-stream-buffer-write
  any:
  - id: objectives/credential-access/browser/chromium::chromium-extension-storage-collection
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/fs/path/password-store::firefox-logins-json-target
  - id: micro-behaviors/os/application/target::wallet-brand-metamask
  - id: micro-behaviors/os/application/target::wallet-brand-rabby
  - id: micro-behaviors/os/application/target::wallet-brand-solflare
- id: powershell-private-and-secret-file-sweep-http-post
  desc: PowerShell sweeps private keys and secret files for HTTP POST
  near_bytes: 16384
  all:
  - id: micro-behaviors/fs/directory/traverse::powershell-recursive-file-enumeration
  - id: micro-behaviors/fs/read/file/full::powershell-file-readallbytes
  - id: micro-behaviors/communications/http/client/managed::httpwebrequest
  - id: micro-behaviors/communications/http/post::post
  - id: micro-behaviors/process/io/stream::powershell-stream-buffer-write
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
  - id: micro-behaviors/fs/path/secret-config::git-or-github-credential-file-reference
  - id: micro-behaviors/fs/path/secret-config::npm-pypi-credential-file-reference
  - id: micro-behaviors/fs/path/secret-config::kube-config
  - id: micro-behaviors/fs/path/credential::container-credentials
