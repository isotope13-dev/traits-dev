defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: suspicious
  conf: 0.94

traits:
  # This requires the SMS body accessor inside the send expression, rather
  # than unrelated read/send APIs in the same file. Legitimate SMS relays
  # can do this too; static code alone does not establish authorization.
  - id: android-sms-body-forwarded
    desc: SMS send expression includes SMS body
    if:
      type: text
      regex: '\.sendTextMessage\s*\([^;\n]{0,180}\.getMessageBody\s*\(\s*\)'

composite_rules:
  # Sender/body acquisition and a nearby SDK write support suspicion, but
  # proximity does not establish a data-flow binding or unauthorized theft.
  - id: android-sms-firebase-report
    desc: Received SMS collection near Firebase value writes
    conf: 0.9
    near_bytes: 1400
    all:
      - id: micro-behaviors/os/message/intent::android-sms-message-collection-source
      - id: micro-behaviors/data/db/access::android-firebase-set-value-sequence
