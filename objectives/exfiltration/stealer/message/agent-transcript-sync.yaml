# A locally read coding-agent conversation is sent as messages to an HTTP
# transcript route. The flow may be a disclosed, user-enabled sync feature, so
# report it as suspicious rather than infer covert theft.
defaults:
  platforms: [unix, windows]
  attack: T1041

composite_rules:
  - id: agent-session-transcript-service-sync
    desc: Local agent transcripts sent to a remote service
    crit: suspicious
    conf: 0.94
    for: [npm, javascript]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/body/agent-transcript::agent-chat-transcript-request
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
    any:
      - id: micro-behaviors/fs/path/personal::claude-session-artifact-path
      - id: micro-behaviors/fs/path/personal::codex-rollout-transcript-artifact-path
    needs: 1
