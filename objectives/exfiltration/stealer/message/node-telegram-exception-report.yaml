defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1567.002

traits:
  - id: telegram-error-endpoint-from-environment
    desc: Uses configured Telegram error endpoint
    crit: notable
    if:
      type: text
      substr: 'axios_1.default.post(process.env.TELEGRAM_SEND_ERROR_API'
  - id: serializes-incoming-request-body
    desc: Serializes incoming request body
    crit: notable
    if:
      type: text
      substr: 'JSON.stringify(request.body, null, 2)'
  - id: includes-request-url-in-error-report
    desc: Includes request URL in error report
    crit: notable
    if:
      type: text
      substr: '<b>Request URL</b>: ${request.url}'
composite_rules:
  - id: exception-body-telegram-exfiltration
    desc: Sends request details to Telegram on errors
    crit: hostile
    conf: 0.98
    all:
      - id: telegram-error-endpoint-from-environment
      - id: serializes-incoming-request-body
      - id: includes-request-url-in-error-report
