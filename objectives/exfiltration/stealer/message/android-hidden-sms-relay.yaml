defaults:
  platforms: [android]
  for: [dex]
  crit: notable

traits:
  - id: dex-incoming-sms-pdu-decode
    desc: DEX decodes an incoming SMS PDU
    if:
      type: symbol
      kind: call
      exact: 'Landroid/telephony/SmsMessage;->createFromPdu'

  - id: dex-multipart-sms-relay-call
    desc: DEX sends multipart SMS
    if:
      type: symbol
      kind: call
      exact: 'Landroid/telephony/SmsManager;->sendMultipartTextMessage'

  - id: android-sms-otp-filter-keyword
    desc: App carries SMS verification filter words
    for: [dex, java, kotlin]
    if:
      type: string_literal
      regex: '(?i)^(otp|verification code|one[ -]time (code|password))$'

  - id: android-source-multipart-sms-call
    desc: Source sends multipart SMS
    for: [java, kotlin]
    if:
      type: text
      exclude_comments: true
      regex: '\.sendMultipartTextMessage\s*\('

  # Every app that unwraps a Keystore secret does this (kiln's Credentials.kt);
  # only the SMS-relay composite gives it a stealer meaning.
  - id: android-source-cipher-decrypt-mode
    desc: Source initializes cipher decryption mode
    crit: component
    for: [java, kotlin]
    if:
      type: text
      exclude_comments: true
      regex: '\.init\s*\(\s*Cipher\.DECRYPT_MODE\s*,'

composite_rules:
  - id: android-hidden-decrypting-sms-relay
    desc: Android reads and resends SMS codes while disabling a component
    crit: hostile
    conf: 0.96
    attack: T1636.004,T1517
    all:
      - id: dex-incoming-sms-pdu-decode
      - id: micro-behaviors/communications/messaging/send::dex-sms-body-call
      - id: micro-behaviors/os/application/config::dex-component-disable-call
      - id: micro-behaviors/crypto/decrypt/initialize::dex-cipher-decrypt-mode-init-call
      - id: android-sms-otp-filter-keyword
    any:
      - id: dex-multipart-sms-relay-call
      - id: micro-behaviors/communications/messaging/send::dex-sms-send-text-call

  - id: android-source-hidden-decrypting-sms-relay
    desc: Android source reads and resends SMS codes while disabling a component
    crit: hostile
    conf: 0.94
    attack: T1636.004,T1517
    for: [java, kotlin]
    all:
      - id: micro-behaviors/os/message/intent::android-sms-message-collection-source
      - id: micro-behaviors/os/package-manager/config::android-component-disable
      - id: android-source-cipher-decrypt-mode
      - id: android-sms-otp-filter-keyword
    any:
      - id: android-source-multipart-sms-call
      - id: micro-behaviors/communications/messaging/send::android-sms-manager-send-text
