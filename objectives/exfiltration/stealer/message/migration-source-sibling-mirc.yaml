defaults:
  platforms:
  - unix
  - windows
  for:
  - mirc
  attack: T1041
composite_rules:
# Query-window lines are staged to a file, then a timer and owner-directed
# message support the chat-log transfer inference.
- id: mirc-chat-log-line-theft
  desc: mIRC RAT exfiltrates chat logs line by line
  crit: hostile
  conf: 0.95
  for:
  - mirc
  - text
  - data
  all:
  - id: micro-behaviors/fs/write/file/full/unspecified::mirc-filter-query-to-file
  - id: micro-behaviors/time/schedule/interval::mirc-command-interval-timer
  - id: objectives/exfiltration/stealer/file::mirc-msg-owner-read-line
