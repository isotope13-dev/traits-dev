defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1020
composite_rules:
- id: webmail-eml-exfiltration
  desc: Webmail message exfiltration as .eml
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/collection/email-harvest::webmail-mailbox-harvest
  - id: micro-behaviors/communications/email/mime::eml-file-construction
  any:
  - id: objectives/collection/email-harvest::formdata-mail-append
  - id: micro-behaviors/communications/http/body::no-cors-post-request
  - id: micro-behaviors/communications/http/form::formdata-class
  unless:
  - id: well-known/lib/web/d3::svg-path-append-recognized
