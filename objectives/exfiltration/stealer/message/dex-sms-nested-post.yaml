defaults:
  platforms: [android]
  for: [dex]
  attack: T1636.004,T1041
traits:
  - id: dex-sms-nested-post-dispatch
    desc: DEX starts SMS-named nested POST task
    crit: notable
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '/(Sms|SMS|SmsReceiver)\$[^;]*[Pp]ost[^;]*;->execute$'
  - id: dex-sms-sender-call
    desc: DEX calls SMS sender accessor
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^Landroid/telephony/(gsm/)?SmsMessage;->get(Display)?OriginatingAddress$'
  - id: dex-sms-body-call
    desc: DEX calls SMS body accessor
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^Landroid/telephony/(gsm/)?SmsMessage;->get(Display)?MessageBody$'
  - id: dex-http-output-call
    desc: DEX calls HTTP connection output stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/HttpURLConnection;->getOutputStream'
composite_rules:
  # The task is nested in an SMS-named class, and these call sites are nearby
  # in the DEX. This is a structural signal, not proof of runtime data flow.
  - id: android-sms-receiver-nested-http-cluster
    desc: SMS class and nested HTTP task call cluster
    crit: suspicious
    conf: 0.95
    near_bytes: 2048
    all:
      - id: dex-sms-nested-post-dispatch
      - id: dex-sms-sender-call
      - id: dex-sms-body-call
      - id: dex-http-output-call
      - id: micro-behaviors/data/serialize/json::dex-json-object-put-call
  - id: android-sms-receiver-nested-http-post
    desc: SMS-named class with nested HTTP POST task
    crit: hostile
    conf: 0.96
    all:
      - id: android-sms-receiver-nested-http-cluster
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-dex-communication-features
      - id: well-known/app/communication/mobilego::mobilego-dex-identity
