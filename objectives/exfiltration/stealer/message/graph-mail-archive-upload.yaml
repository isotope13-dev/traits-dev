# Graph mail content staged into a local archive and uploaded over HTTP: the
# office-cli batch shape from AA26-281A. Detects co-occurrence of the mail
# source, the local staging, and the upload sink, not proof of an
# unauthorized destination.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.9
  attack: T1041
composite_rules:
  - id: graph-mail-archive-http-upload
    desc: Graph mail content archived locally and uploaded over HTTP
    all:
      - id: micro-behaviors/communications/http/oauth::microsoft-graph-mail-api
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/communications/http/post::requests-post
    near_bytes: 8192
