defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-a11y-sms-socket-rat
    desc: Accessibility RAT sockets SMS traffic
    crit: hostile
    conf: 0.94
    scope: outer
    for: [android_apk, zip, dex, xml]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: android-sms-manager-socket-contacts
    desc: SMS manager sockets harvested contacts
    crit: hostile
    conf: 0.95
    for: [dex]
    all:
      - id: micro-behaviors/os/privilege/manifest::sms-manager-class
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
      - id: micro-behaviors/os/user/lookup::android-dex-contacts-phone-descriptor
