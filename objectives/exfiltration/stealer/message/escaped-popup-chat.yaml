# Exfiltrating structured chat/assistant conversation records (`{ role, content|message }`)
# by escaping a sandboxed preview frame into an unsandboxed popup and transmitting
# the serialized JSON payload over HTTP or `navigator.sendBeacon`.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1041,T1562.001

composite_rules:
  - id: escaped-popup-chat-transcript-exfiltration
    desc: Escaped sandbox popup exfiltrates serialized chat messages
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 6144
    all:
      - id: objectives/evasion/security-bypass/policy/browser::nested-iframe-popup-escape
      - id: metadata/lang/source/syntax/object::chat-role-message-record
      - id: micro-behaviors/data/serialize/json::json-stringify-text-call
      - id: micro-behaviors/communications/http/request/target::browser-outbound-http-client-call
