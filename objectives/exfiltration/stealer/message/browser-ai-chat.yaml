composite_rules:
- for:
  - crx
  - xpi
  - zip
  - javascript
  attack: T1119,T1041
  id: encrypted-ai-chat-context-exfiltration
  desc: Forced-consent collection uploads encrypted AI chats
  crit: hostile
  conf: 0.995
  scope: archive
  all:
  - id: objectives/collection/monitor/telemetry::ai-chat-context-capture-dispatch
  - id: metadata/lang/source/syntax/object::chat-capture-content-role-record
  - id: micro-behaviors/crypto/symmetric/aes/initialize::context-encryption-configuration-references
  - id: metadata/lang/source/syntax/call/arguments::context-json-post-helper-call
  - id: micro-behaviors/communications/http/post::request-options-post-method
  - id: objectives/evasion/security-bypass/policy/access-control::forced-collection-consent-storage-override
- id: chat-input-sent-to-public-ip
  desc: Exfiltrates chat input to a public IP
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/data/collection/dom::chat-input-selector
  - id: micro-behaviors/data/collection/dom::chat-input-value-forwarded-to-json
  - id: micro-behaviors/communications/http/request/body/construction::chat-input-json-post-body
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url

defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1056.001,T1041
