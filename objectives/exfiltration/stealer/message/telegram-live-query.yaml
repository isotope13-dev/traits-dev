# Reconstructed from the request/response and AbstractUcRawDbRequest
# screenshots in the linked uCreator technical report. The matching claim is
# operator-provided SQL -> live message store -> response, with bound names.
defaults:
  platforms: [android]
  for: [java]
  attack: T1005,T1041

traits:
  - id: request-sql-message-store-response
    desc: Request SQL returns live message-store rows
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |-
        ((method_declaration
         name: (identifier) @handler
         parameters: (formal_parameters
          (_)*
          (formal_parameter name: (identifier) @request)
          (formal_parameter name: (identifier) @response))
         body: (block
          (local_variable_declaration declarator: (variable_declarator
           name: (identifier) @params
           value: (object_creation_expression type: (type_identifier) @json
            arguments: (argument_list (field_access
             object: (identifier) @input field: (identifier) @param)))))
          (local_variable_declaration declarator: (variable_declarator
           name: (identifier) @sql
           value: (method_invocation object: (identifier) @params2
            name: (identifier) @get arguments: (argument_list (string_literal) @key))))
          (local_variable_declaration declarator: (variable_declarator
           name: (identifier) @cursor
           value: (method_invocation
            object: (method_invocation
             object: (method_invocation object: (identifier) @storage name: (identifier) @instance)
             name: (identifier) @database)
            name: (identifier) @query
            arguments: (argument_list (identifier) @querysql (_)))))
          (local_variable_declaration declarator: (variable_declarator
           name: (identifier) @rows value: (object_creation_expression type: (type_identifier) @array)))
          (try_statement body: (block
           (while_statement
            condition: (parenthesized_expression (method_invocation object: (identifier) @cursor2 name: (identifier) @next))
            body: (block (expression_statement
             (method_invocation object: (identifier) @rows2 name: (identifier) @put
              arguments: (argument_list (method_invocation object: (identifier) @cursor3 name: (identifier) @value))))))))
          (expression_statement (assignment_expression
           left: (field_access object: (identifier) @output field: (identifier) @body)
           right: (method_invocation object: (identifier) @rows3 name: (identifier) @serialize))))) @export
         (#eq? @handler "handleRequest")
         (#eq? @request @input)
         (#eq? @response @output)
         (#eq? @param "param")
         (#eq? @body "body")
         (#eq? @json "JSONObject")
         (#eq? @params @params2)
         (#eq? @get "getString")
         (#eq? @key "\"sql\"")
         (#eq? @sql @querysql)
         (#eq? @storage "MessagesStorage")
         (#eq? @instance "getInstance")
         (#eq? @database "getDatabase")
         (#eq? @query "queryFinalized")
         (#eq? @array "JSONArray")
         (#eq? @cursor @cursor2)
         (#eq? @cursor @cursor3)
         (#eq? @next "next")
         (#eq? @value "stringValue")
         (#eq? @rows @rows2)
         (#eq? @rows @rows3)
         (#eq? @put "put")
         (#eq? @serialize "toString"))

composite_rules:
  - id: telegram-request-sql-message-export
    desc: Remote SQL exports live Telegram message rows
    crit: hostile
    conf: 0.99
    all:
      - id: request-sql-message-store-response
      - id: micro-behaviors/data/db/query::string-field-sql-query
      - id: metadata/import/java/org/telegram/messenger/messagesstorage
