# SMTP combo checkers commonly notify an operator when a credential works.
# This is exfiltration when the alert payload contains the verified account
# fields, not merely a generic success log.
defaults:
  platforms: [android, unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: E1041

composite_rules:
  # Complete steal-and-send chain: a *working* mail client -- one that builds
  # IMAP/SMTP clients from the stored account records -- ships those records,
  # password included, to a remote log endpoint. The mail-client leg is what
  # separates this from a type stub, a test fixture or a config linter that
  # merely mentions an `imap.password` field: the credential is read out of a
  # live account store that the same file uses to log in.
  - id: mail-client-account-credential-report-chain
    desc: Mail client reports stored account passwords remotely
    crit: hostile
    conf: 0.97
    attack: T1041,T1552,T1114
    all:
      - id: objectives/exfiltration/http/report::imap-credential-config-http-report
    any:
      - id: micro-behaviors/communications/email/access/imap::imap-client-provider-construction
      - id: micro-behaviors/communications/email/access/imap::imapflow-library-import
      - id: micro-behaviors/communications/email/send/smtp::smtp-client-construction

  # Do not elevate "working mail client logs JSON.stringify(account.imap)" to a
  # stealer. That is how a real client debug-logs account setup; the password
  # rides along only because the object was not redacted. The suspicious
  # report trait imap-config-object-in-log-url already records that disclosure.
  # Hostile stays on the route that puts the password token inside the URL
  # (mail-client-account-credential-report-chain).

  - id: obfuscated-smtp-credential-exfiltration
    desc: Exfiltrates verified SMTP credentials by alert email
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/exfiltration/messaging/email::smtp-credential-alert-sender
      - id: objectives/exfiltration/messaging/email::smtp-alert-recipient-field
      - id: objectives/credential-access/theft/harvested-store::obfuscated-smtp-valid-credential-store
