defaults:
  platforms: [android]
  for: [android_apk, zip, dex]

composite_rules:
  - id: android-sms-telegram-relay-clues
    desc: Incoming SMS reads with Telegram message submission
    crit: suspicious
    conf: 0.96
    attack: T1636.004,T1041
    # Multidex apps commonly separate the receiver from the network sender.
    # This is co-occurrence, not proven data flow or proof of unauthorized
    # forwarding: consent-based forwarders can have the same capabilities.
    scope: archive
    all:
      - id: micro-behaviors/os/message/intent::android-dex-sms-pdu-message-read
      - id: micro-behaviors/communications/messaging/send::dex-sms-sender-call
      - id: micro-behaviors/communications/messaging/send::dex-sms-body-call
      - id: micro-behaviors/communications/messaging/telegram::dex-telegram-message-send
