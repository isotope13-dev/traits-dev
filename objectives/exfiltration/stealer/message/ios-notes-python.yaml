defaults:
  platforms: [ios, macos]
  for: [python]
  attack: T1005,T1041
composite_rules:
  - id: ios-notes-path-and-byte-upload
    desc: iOS Notes database bytes uploaded over HTTP
    crit: hostile
    conf: 0.93
    # Notes path plus byte-body upload establishes the theft on its own.
    # Remote-execution legs belong to the tasking composite; requiring them
    # here blinds this rule to stealers that execute nothing.
    all:
      - id: micro-behaviors/fs/path/personal::ios-notes-database
      - id: micro-behaviors/communications/http/upload::python-ios-notes-path-byte-post
