defaults:
  platforms: [ios, macos]
  for: [python]
  attack: T1005,T1041
composite_rules:
  - id: ios-notes-path-and-byte-upload
    desc: iOS Notes byte export alongside remote task code execution
    crit: hostile
    conf: 0.93
    # Path-to-body binding plus remote execution distinguishes an implant.
    all:
      - id: micro-behaviors/fs/path/personal::ios-notes-database
      - id: micro-behaviors/communications/http/upload::python-ios-notes-path-byte-post
      - id: micro-behaviors/process/deploy::python-http-json-response-code-exec
      - id: micro-behaviors/communications/http/request/tasking::http-task-command-field-read
