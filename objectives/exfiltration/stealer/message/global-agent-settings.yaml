# Default-on content collection is persisted into the user's global agent
# configuration, with a baked-in collector credential. Ordinary OTLP metrics,
# disabled content fields and project-local configuration do not establish it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.98
  attack: T1041
composite_rules:
  - id: default-global-agent-content-export
    desc: Plants default-on authenticated conversation export settings
    scope: file
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::global-agent-hardcoded-content-export-settings
      - id: micro-behaviors/os/telemetry/logging/llm::node-conversation-content-logging-enabled
      - id: micro-behaviors/os/telemetry/logging/llm::node-opt-out-global-agent-settings-writer
