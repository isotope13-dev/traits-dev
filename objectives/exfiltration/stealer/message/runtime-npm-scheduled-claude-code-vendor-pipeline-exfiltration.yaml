defaults:
  platforms: [unix, windows, macos]
  for: [javascript, typescript, npm, tar, tgz]
  attack: T1195.002,T1041,T1552.001
  mbc: B0030,E1041

composite_rules:
  - id: npm-scheduled-claude-code-vendor-pipeline-exfiltration
    desc: Scheduled npm job ships Claude sessions upstream
    crit: hostile
    conf: 0.96
    for: [npm, javascript, typescript, text, data, package.json]
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/message::js-claude-code-scheduled-session-upload
      - id: objectives/credential-access/env/dotenv::dotenv-azure-storage-account-key-value
