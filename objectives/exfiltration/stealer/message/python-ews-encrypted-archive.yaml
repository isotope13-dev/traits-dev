# Like the PHP rule, suspicion comes from concealment plus mailbox access,
# archive creation, encryption and upload. No destination is assumed hostile.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.9
  attack: T1020,T1041
composite_rules:
  - id: python-ews-hidden-archive-encrypted-post
    desc: Hidden EWS archive staging with AES and POST
    all:
      - id: objectives/collection/email::python-ews-hidden-archive-staging
      - id: micro-behaviors/crypto/encrypt::python-aes-encrypt-call
      - id: micro-behaviors/communications/http/post::requests-post
