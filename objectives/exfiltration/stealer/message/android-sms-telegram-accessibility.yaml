defaults:
  platforms: [android]
  for: [dex]
  attack: T1636.004,T1041
traits:
  - id: dex-sms-telegram-alert-url
    desc: Telegram bot URL includes SMS alert
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)api\.telegram\.org/bot[^\x00]{1,100}/sendMessage\?[^\x00]{0,100}SMS[ +%0-9]+RECEIVED'
  - id: dex-many-banking-package-names
    desc: DEX contains many banking package names
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dex_many_banking_package_names {
          meta:
            filetypes = "dex"
          strings:
            $bank = /[a-z][a-z0-9_]{1,25}\.[a-z0-9_.]{0,70}(bank|banca|banking)[a-z0-9_.]{0,50}/ ascii nocase
          condition:
            #bank >= 8
        }
composite_rules:
  # Each observation is independent: this cluster does not itself establish
  # that a particular message was delivered or a bank account was accessed.
  - id: android-sms-telegram-banking-accessibility
    desc: SMS Telegram alert with banking package list and accessibility service
    crit: hostile
    conf: 0.97
    all:
      - id: dex-sms-telegram-alert-url
      - id: dex-many-banking-package-names
      - id: micro-behaviors/communications/messaging/send::dex-sms-body-call
      - id: metadata/binary/symbols/descriptor::android-accessibility-service-descriptor
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-dex-communication-features
