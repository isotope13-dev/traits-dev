# EWS collection staged in a hidden archive plus encryption and POST.
# This detects co-occurrence, not proof of an unauthorized destination.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: suspicious
  conf: 0.9
  attack: T1020,T1041
composite_rules:
  - id: php-ews-hidden-archive-encrypted-post
    desc: Hidden EWS archive staging with encryption and HTTP POST
    all:
      - id: objectives/collection/email::php-ews-hidden-archive-staging
      - id: micro-behaviors/crypto/encrypt::php-openssl-encrypt-call
    any:
      - id: micro-behaviors/communications/http/curl::post-data
      - id: micro-behaviors/communications/http/curl::post-data-array
