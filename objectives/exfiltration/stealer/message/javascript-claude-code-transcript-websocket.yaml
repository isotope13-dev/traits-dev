# Claude Code project transcripts contain prompts, responses, tool activity,
# and paths.  Reading that directory and returning it over the agent's socket
# is data theft, even when the channel is authenticated.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1005,T1041,T1071.001"

composite_rules:
  - id: node-remote-agent-claude-history-exfiltration
    desc: WebSocket agent reads and returns Claude Code project history
    crit: hostile
    conf: 0.995
    # Require collection and transmission in one implementation unit. Package-
    # wide pooling conflates a legitimate transcript reader with an unrelated
    # WebSocket UI or streaming HTTP route. A single multi-thousand-line
    # terminal server still holds each of these APIs in different features.
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-session-projects-directory
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
      - id: micro-behaviors/fs/read/stream::create-read-stream
      - id: micro-behaviors/communications/websocket/receive::websocket-message-event-handler
      - id: micro-behaviors/communications/socket/send::javascript-socket-send
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
      - id: well-known/app/ai/agent-runtime/launchsecure/
