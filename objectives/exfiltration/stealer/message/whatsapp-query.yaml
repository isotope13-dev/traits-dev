# Bind the query result to the outbound body; unrelated HTTP calls are insufficient.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: whatsapp-query-results-upload
    desc: Uploads results of a WhatsApp message query
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    all:
      - id: micro-behaviors/data/db/sqlite::python-sqlite3-import
      - id: micro-behaviors/data/db/sqlite::whatsapp-message-query
      - id: micro-behaviors/communications/http/request/body::python-post-whatsapp-query-results

