# These source observations establish co-occurrence, not a proven data flow.
# Keep suspicious: legitimate SMS backup software may post received records.
defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: llm-sms-otp-keyword
    desc: Prompt references OTP or verification codes
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(otp([ _-]*codes?)?|verification[ _-]+codes?)\b'

  - id: llm-sms-financial-keyword
    desc: Prompt references financial SMS alerts
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(transactions?|balance([ _-]+updates?)?|card[ _-]+alerts?|password[ _-]+reset)\b'

composite_rules:
  - id: llm-financial-sms-otp-prompt
    desc: Prompt targets OTP and financial SMS
    crit: notable
    conf: 0.95
    attack: T1636.004
    near_lines: 10
    all:
      - id: llm-sms-otp-keyword
      - id: llm-sms-financial-keyword
  - id: android-sms-http-report
    desc: Received SMS reads coexist with HTTP POST
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/message/intent::android-sms-message-collection-source
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source

  - id: android-sms-provider-socket-exfil
    desc: Android spyware streams SMS provider rows over socket
    crit: hostile
    conf: 0.98
    attack: T1636.004,T1041
    all:
      - id: micro-behaviors/communications/ipc/content-provider::android-sms-content-provider-query
      - id: micro-behaviors/communications/socket/connect/tcp::java-address-socket-connect
      - id: micro-behaviors/data/stream/write::jvm-output-stream-write-or-access
    any:
      - id: objectives/evasion/anti-av/platform/removal-guard::android-removal-screen-back-navigation
      - id: micro-behaviors/os/privilege/grant::android-pm-grant-command
      - id: micro-behaviors/os/application/desktop-settings::android-shell-accessibility-settings-enable
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package

  - id: android-sms-llm-otp-extraction
    desc: Extracts OTP and financial SMS via LLM API
    crit: hostile
    conf: 0.99
    attack: T1636.004,T1041
    all:
      - id: micro-behaviors/communications/ipc/content-provider::android-sms-content-provider-query
      - id: micro-behaviors/communications/http/model::model-generation-request
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-variable
      - id: llm-financial-sms-otp-prompt
    any:
      - id: micro-behaviors/data/stream/write::jvm-output-stream-write-or-access
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package

