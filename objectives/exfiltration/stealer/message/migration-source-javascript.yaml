defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
composite_rules:
# Session export is also used by disclosed observability tools; this pattern
# does not establish who controls the destination, so it remains suspicious.
- id: js-agent-session-telemetry-http-upload
  desc: Agent session transcript uploaded over HTTP
  crit: suspicious
  conf: 0.9
  near_lines: 180
  all:
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-telemetry-record
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
# Require the session-path upload evidence in one file to avoid combining
# unrelated bundle components into a transcript-export claim.
- id: js-claude-code-session-blob-and-api-upload
  desc: Claude JSONL discovery near session file-path upload
  crit: suspicious
  conf: 0.94
  for:
  - npm
  - javascript
  scope: file
  near_lines: 180
  all:
  - id: micro-behaviors/communications/http/upload/file::upload-session-file-path-call
  - id: micro-behaviors/fs/path/agent-config/directory::claude-session-projects-directory
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
  - id: micro-behaviors/fs/search/content::javascript-jsonl-filename-suffix-filter
  - id: micro-behaviors/communications/http/upload/file::upload-file-js-method-call
  - id: micro-behaviors/communications/http/request/json::http-post-json
- id: js-claude-code-scheduled-session-upload
  desc: Scheduled job uploads Claude Code session files
  crit: suspicious
  conf: 0.93
  for:
  - npm
  - javascript
  scope: archive
  all:
  - id: js-claude-code-session-blob-and-api-upload
  - id: micro-behaviors/os/service/config::systemctl-user-enable
# The coordinator supports a package-level inference without requiring proof
# of interprocedural data flow.
- id: js-modular-claude-code-session-blob-and-api-upload
  desc: Package pairs Claude JSONL discovery and transcript upload
  crit: suspicious
  conf: 0.94
  for:
  - npm
  - javascript
  scope: archive
  all:
  - id: micro-behaviors/communications/http/upload/file::transcript-session-file-upload-coordinator
  - id: micro-behaviors/fs/path/agent-config/directory::claude-session-projects-directory
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
  - id: micro-behaviors/fs/search/content::javascript-jsonl-filename-suffix-filter
  - id: micro-behaviors/communications/http/upload/file::upload-file-js-method-call
  - id: micro-behaviors/communications/http/request/json::http-post-json
- id: npm-packaged-dotenv-claude-transcript-upload
  desc: npm ships dotenv and uploads Claude transcripts
  crit: suspicious
  conf: 0.95
  for:
  - npm
  - package.json
  scope: archive
  all:
  - id: metadata/package/files/package-json::files-includes-dotenv
  - id: js-claude-code-session-blob-and-api-upload
- id: npm-packaged-vendor-azure-claude-session-exfiltration
  desc: npm tarball embeds vendor Azure and Claude sessions
  crit: hostile
  conf: 0.97
  attack: T1041,T1195.002,T1552.001
  for:
  - npm
  - package.json
  - javascript
  - text
  scope: archive
  all:
  - id: metadata/package/files/package-json::files-includes-dotenv
  - id: objectives/credential-access/env/dotenv::dotenv-azure-storage-account-key-value
  any:
  - id: js-claude-code-session-blob-and-api-upload
  - id: js-modular-claude-code-session-blob-and-api-upload
- id: js-agent-session-rollout-http-upload
  desc: Agent rollout record sent over HTTP
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  scope: leaf
  all:
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-record
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-post-call
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-json-body
