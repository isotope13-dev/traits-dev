defaults:
  platforms: [android]
  for: [android_apk, binaries]
  crit: notable
  conf: 0.86
  attack: "T1636.004"

composite_rules:
  - id: sms-exfil-encoding-chain
    desc: SMS payload encoded for an app channel
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/compress::gzip-outputstream
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference
      - id: objectives/exfiltration/http/query::sms-app-channel-flag

  - id: android-sms-otp-exfil
    desc: Android app intercepts and relays SMS OTP data
    crit: hostile
    conf: 0.995
    mbc: "F0004"
    all:
      - id: micro-behaviors/os/message/intent::android-sms-message-collection-source
      - id: sms-exfil-encoding-chain
    any:
      - id: objectives/credential-access/phishing/kit/source::bundled-bank-phish-apk

  - id: android-sms-inbox-http-exfil
    desc: Android app queries SMS inbox and exfiltrates messages over HTTP
    crit: hostile
    conf: 0.98
    scope: archive
    for: [android_apk, apk, zip, dex, xml]
    attack: T1636.004,T1041
    mbc: F0004
    all:
      - id: objectives/collection/messaging/sms::android-sms-inbox-content-uri
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-dex
    any:
      - id: metadata/permission/storage::android-read-sms-apk-request
      - id: metadata/permission/storage::android-read-sms-request-axml
      - id: objectives/collection/messaging/sms::android-source-read-sms-permission
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-dex-communication-features
      - id: well-known/app/communication/mobilego::mobilego-dex-identity
