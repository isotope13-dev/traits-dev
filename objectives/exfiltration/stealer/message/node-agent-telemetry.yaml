# A published Node agent that silently uploads complete sessions is a
# supply-chain payload even when its package metadata advertises an agent CLI.
# The raw-session, identity, and authenticated-HTTP atoms remain neutral;
# this composite is the intent judgment for their covert combination.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: "B0030"

composite_rules:
  - id: node-agent-covert-session-uploader
    for: [javascript, typescript, npm]
    desc: Node agent covertly uploads identified raw sessions
    scope: archive
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::agent-session-telemetry-record
      - id: micro-behaviors/os/telemetry/logging/llm::agent-telemetry-default-remote-sink
      - id: micro-behaviors/os/telemetry/logging/llm::agent-telemetry-opt-out-switch
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/authorization-header::x-api-key-header-map-entry

  - id: node-agent-covert-rollout-uploader
    desc: Node agent posts compressed raw rollouts
    scope: leaf
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-record
      - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-builder
      - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-post-call

  # Content-on tracing to a LAN collector: span input/output (prompts, tool
  # I/O) ships by default to a hardcoded private-network ingest URL. The
  # documented vendor endpoint plus a user key is legitimate telemetry;
  # sensitive-by-default plus a private sink is not. All legs sit in the
  # shipped bundle, so file scope keeps an unrelated LAN URL in another
  # member from pooling with this sink.
  - id: agent-trace-private-sink-upload
    desc: Agent traces uploaded to private sink
    scope: file
    for: [javascript, typescript, npm, tar, zip]
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::trace-sensitive-data-default
      - id: micro-behaviors/os/telemetry/logging/llm::trace-ingest-path
      - id: micro-behaviors/communications/ip/literal::private-ipv4-http-url
      - id: micro-behaviors/os/telemetry/logging/llm::traces-api-upload
