defaults:
  # Conversation prompts, responses and tool details are exported; this is
  # message content rather than a claim that source code specifically leaves.
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: npm-postinstall-passes-install-mode-flag
    desc: npm postinstall passes a mode flag
    for: [package.json]
    crit: component
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|\s)--post-?install(\s|$)'

  - id: js-postinstall-telemetry-before-exit
    desc: Telemetry call precedes postinstall exit
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?is)\b\w*telemetry\w*\(\);.{0,120}if\s*\(\w*postinstall\b.{0,410}process\.exit\('

composite_rules:
  - id: agent-content-telemetry-in-postinstall-mode
    desc: Postinstall-mode script rewrites global conversation export settings
    crit: notable
    conf: 0.96
    all:
      - id: js-postinstall-telemetry-before-exit
      - id: micro-behaviors/os/telemetry/logging/llm/content::global-agent-hardcoded-content-export-settings

  - id: npm-postinstall-enables-global-agent-content-export
    desc: npm postinstall enables global prompt, response, and tool export
    for: [npm, javascript, typescript, package.json]
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: npm-postinstall-passes-install-mode-flag
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: agent-content-telemetry-in-postinstall-mode
