  # Generic: screenshot + recon + any HTTP exfil
  - id: recon-image-socket-exfil
    desc: "Host reconnaissance with image and socket export"
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/graphics/image::gdi-raster-copy-image-save
      - id: micro-behaviors/communications/socket/connect::winsock-client-symbol-lifecycle
    any:
      - id: micro-behaviors/os/sysinfo/profile::windows-host-profile-api-set
      - id: micro-behaviors/communications/http/ip-discovery::geo-api
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
    unless:
      - id: metadata/signed/platform/
  - id: browser-focused-injection-image-export
    desc: "Browser-focused injection with image export evidence"
    crit: hostile
    conf: 0.96
    attack: T1113
    all:
      - id: micro-behaviors/ui/graphics/image::image-process-upload-api-profile
      - id: micro-behaviors/process/inject/remote-thread::enumerated-remote-thread-api-profile
      - id: micro-behaviors/process/enumerate/snapshot::snapshot-with-chromium-library-reference
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/browser-automation/
      - id: well-known/lib/runtime/scripted/electron/
  # A custom raw-TCP stream protocol paired with screen encoding, process
  # inventory, locale profiling, and admin relaunch is a remote-surveillance
  # channel.  The protocol markers are structural lifecycle markers rather
  # than sample-specific URLs.
