defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1041

composite_rules:
  - id: tor-proxy-image-stealer
    desc: "Bitmap processing with Tor proxy export evidence"
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/data/encode/image/gdiplus::create-bitmap-from-hbitmap
      - id: micro-behaviors/dylib/library/family::libcurl-ref
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
      - id: micro-behaviors/communications/proxy/socks::socks5-string
    unless:
      - id: metadata/signed/platform/
  - id: recon-image-telegram
    desc: "Host reconnaissance with image and Telegram export"
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
      - id: micro-behaviors/ui/graphics/image::gdi-raster-copy-image-save
    any:
