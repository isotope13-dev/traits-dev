# Windows Screenshot Capture via GDI + GDI+ Encoding
# Full screenshot pipeline: GDI capture -> GDI+ PNG encode -> exfil
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: "C0014"

composite_rules:
- id: gdi-image-exfil
  desc: "GDI image saving with network export evidence"
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/ui/graphics/image::gdi-raster-copy-image-save
  any:
  - id: micro-behaviors/communications/http/post/
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/http/upload/
  unless:
  - id: well-known/lib/platform/browser-automation/
  - id: well-known/app/productivity/winmerge/
  - id: well-known/app/productivity/sumatrapdf/
  - id: metadata/binary/installer/
- id: raw-gdi-image-exfil
  desc: "GDI image readback with HTTP and TLS-bypass evidence"
  crit: hostile
  conf: 0.98
  attack: T1113,T1041,T1573
  all:
  - id: micro-behaviors/ui/graphics/image::raw-gdi-bitmap-readback-primitives
  - id: objectives/evasion/security-bypass/tls::reject-unauthorized-false-native
  - id: micro-behaviors/communications/http/content-length::raw-content-length-header
  unless:
  - id: well-known/lib/platform/browser-automation/
  # Official Bun runtime bundles Chromium/HTTP stacks that trip this triad.
  - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
- id: directx-tor-image-exfil
  desc: "DirectX image encoding with Tor channel"
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/ui/graphics/image::directx-gdiplus-image-encoding
  - id: objectives/command-and-control/channel/tor/client::native-libcurl-onion-socks
