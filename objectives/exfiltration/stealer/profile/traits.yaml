defaults:
  for: [javascript, typescript]
  platforms: [linux, macos, windows]

traits:
  - id: account-identity-field
    desc: Account identity field in source
    crit: component
    if:
      type: text
      regex: '\b(email|username|userId|user_id)\b'
  - id: financial-profile-field
    desc: Financial profile field in source
    crit: component
    if:
      type: text
      regex: '\b(earnings|payout|paidTotal|pendingTotal|lifetimeAccepted)\b'
  - id: outbound-post-operation
    desc: HTTP POST operation in source
    crit: component
    if:
      type: text
      regex: '\bfetch\s*\(|\.post\s*\(|method\s*:\s*["\x27]POST'

composite_rules:
  - id: source-profile-data-http-post
    desc: Posts account and financial profile data
    crit: hostile
    conf: 0.94
    attack: T1041,T1005
    all:
      - id: account-identity-field
      - id: financial-profile-field
      - id: outbound-post-operation
      - id: micro-behaviors/communications/http/client/script::fetch-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
    near_bytes: 5200
