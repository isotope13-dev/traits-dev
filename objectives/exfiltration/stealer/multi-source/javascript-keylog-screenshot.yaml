defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]

composite_rules:
  - id: js-keyboard-screen-http-collector
    desc: "Keyboard and screenshot capabilities with HTTP client"
    crit: hostile
    conf: 0.95
    attack: "T1056"
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::global-keyboard-listener
      - id: micro-behaviors/hardware/display/screenshot::node-screenshots-import
      - id: micro-behaviors/communications/http/lib/axios::axios
