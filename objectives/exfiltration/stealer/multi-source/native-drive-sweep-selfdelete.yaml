# A native Windows binary that enumerates every drive, traverses the
# file tree hunting credential stores (seed phrases, KeePass databases,
# VPN/SSH configs), dumps Wi-Fi keys and screenshots, and deletes itself
# with a ping-delayed cmd command is a file-sweeping stealer, whatever
# upload channel the companion traits describe.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1005,T1552.001,T1113,T1070.004
  mbc: B0028

composite_rules:
  - id: native-drive-sweep-credential-stealer
    desc: Native stealer sweeps drives for credential files and self-deletes
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/traversal/drives::drive-and-file-tree-traversal
      - id: micro-behaviors/fs/delete/file/command::embedded-ping-delete-command
      - id: micro-behaviors/hardware/wireless/network::netsh-profile-query-command-text
    any:
      - id: micro-behaviors/fs/path/filename-credential::seed-text-file
      - id: micro-behaviors/fs/path/password-store::kdbx-extension-reference
      - id: micro-behaviors/fs/path/app-data::openvpn-config-dir
      - id: micro-behaviors/fs/path/credential::ssh-or-cloud-credential-path-references
      - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
