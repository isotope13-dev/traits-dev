# Migrated from the mixed Cargo package profile; the destination names the required claim.
defaults:
  platforms: [unix, windows]
  for: [cargo.toml]

composite_rules:
- id: cargo-stealer-dependency-cluster
  desc: Cargo stealer dependency cluster
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-dpapi
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-rusqlite
  - id: metadata/import/package::dep-reqwest
  any:
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-screenshots
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-nokhwa
- id: cargo-stealer-with-encrypt-macro
  desc: Cargo stealer uses encrypt macro
  crit: suspicious
  conf: 0.86
  all:
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-encrypt-macro
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-dpapi
  any:
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-screenshots
  - id: metadata/package/dependencies/manifest/presence::cargo-dep-nokhwa
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-rusqlite
