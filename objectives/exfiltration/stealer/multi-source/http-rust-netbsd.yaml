defaults:
  platforms: [netbsd, unix]
  for: [rust, elf]
  attack: T1552.001

composite_rules:
  - id: rust-netbsd-credential-upload
    desc: Rust NetBSD credential upload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/post::post-request-line
    any:
      - id: micro-behaviors/fs/path/credential::rust-netbsd-secret-file-bundle
      - id: objectives/credential-access/theft/multi-store::rust-collector-functions
    needs: 1
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/presence/harness::rust-tests-path-filename
      - id: metadata/package/testing/presence/harness::rust-tests-directory-path
  - id: rust-netbsd-credential-upload-elf
    for: [elf]
    desc: Rust NetBSD credential ELF upload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/fs/path/config/accounts::bsd-master-passwd-path
      - id: objectives/credential-access/ssh/key::native-ssh-private-key-paths
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/presence/harness::rust-tests-path-filename
      - id: metadata/package/testing/presence/harness::rust-tests-directory-path
