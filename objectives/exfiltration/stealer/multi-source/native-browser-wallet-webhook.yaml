# One native binary that queries Chromium's encrypted cookie and login
# tables, targets desktop-wallet and browser-wallet storage, and carries a
# Discord webhook for delivery: the multi-store stealer shape.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1005,T1567
composite_rules:
  - id: native-browser-wallet-discord-webhook-stealer
    desc: Native binary targets browser SQL, wallets and a webhook
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/db/access::chromium-encrypted-cookie-sql
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/fs/path/app-data::browser-wallet-storage-references
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
