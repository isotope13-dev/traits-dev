defaults:
  platforms: [windows, unix]
  for: [rust]

composite_rules:
  - id: rust-dual-stream-surveillance
    desc: Rust desktop and webcam streaming
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/exfiltration/stealer/screen::rust-http-desktop-stream
      - id: objectives/exfiltration/stealer/camera::rust-http-webcam-stream
  - id: rust-ngrok-surveillance-stream
    desc: Rust ngrok tunnel for live surveillance stream
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/tunnel::rust-ngrok-http-tunnel
      - id: objectives/exfiltration/stealer/multi-source::rust-dual-stream-surveillance
    any:
      - id: micro-behaviors/communications/http/server/route::stream-handler-route
      - id: micro-behaviors/process/io/stream::stream-stop-function
  - id: rust-tunneled-dual-stream-dispatch
    desc: Rust tunneled desktop and webcam streaming
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/stealer/screen::rust-tunneled-desktop-stream-dispatch
      - id: objectives/exfiltration/stealer/camera::rust-tunneled-webcam-stream-dispatch
