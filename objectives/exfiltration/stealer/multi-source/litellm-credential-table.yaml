# LiteLLM proxy stores provider API keys in LiteLLM_CredentialsTable. Reading
# that table with raw SQL alongside developer credential files and an HTTP
# upload is a credential stealer (LiteLLM 1.107.0 privcollect, Oct 2026).
# LiteLLM itself reaches the table through its Prisma client, not FROM text.
defaults:
  platforms: [unix, windows]
  attack: T1552.001,T1555,T1041

composite_rules:
  - id: python-litellm-credential-table-dev-secret-upload
    desc: LiteLLM stored keys and dev secrets uploaded
    crit: hostile
    conf: 0.96
    for: [python]
    all:
      - id: micro-behaviors/data/db/sql::litellm-credentials-from-clause
      - id: micro-behaviors/fs/path/credential::multiple-developer-credential-path-groups
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/post::requests-post
