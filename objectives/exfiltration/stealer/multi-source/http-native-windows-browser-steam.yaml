defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1041

composite_rules:
  - id: native-windows-browser-steam-http-exfil
    for: [pe]
    desc: Browser and Steam reads alongside HTTP requests
    crit: suspicious
    conf: 0.98
    attack: T1555,T1041
    all:
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: micro-behaviors/fs/path/account-db::steam-account-config-references
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
