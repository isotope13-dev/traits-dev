defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1041

composite_rules:
  - id: native-windows-browser-steam-http-exfil
    for: [pe]
    desc: Native browser and Steam credential HTTP exfiltration
    crit: hostile
    conf: 0.98
    attack: T1555,T1041
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: objectives/credential-access/gaming/steam/profile::steam-cred-theft
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
