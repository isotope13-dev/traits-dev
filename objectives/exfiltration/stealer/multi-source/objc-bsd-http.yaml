defaults:
  platforms: [freebsd, netbsd, unix]
  for: [objc]
  attack: T1041

composite_rules:
  - id: objc-bsd-credential-http-exfil
    desc: ObjC BSD credential HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/files/config::objc-bsd-credential-sweep
      - id: micro-behaviors/communications/http/url/telemetry::objc-http-collect-post
      - id: micro-behaviors/communications/socket/send::objc-socket-body-buffer-send
    any:
      - id: micro-behaviors/data/serialize/json::nsjsonserialization-text
      - id: micro-behaviors/data/serialize/object::nspropertylistserialization-text
      - id: micro-behaviors/communications/http/header/custom::content-length-template
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/communications/socket/send::send-symbol
    needs: 1
