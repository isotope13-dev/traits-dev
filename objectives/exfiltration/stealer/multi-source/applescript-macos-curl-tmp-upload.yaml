defaults:
  platforms: [macos]
  for: [applescript, php]
  attack: T1041

composite_rules:
  - id: macos-stealer-curl-tmp-form-upload
    desc: macOS stealer curl uploads staged tmp archive
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/app-data::browser-wallet-storage-references
      - id: micro-behaviors/communications/http/upload::macos-curl-tmp-upload-signal
    any:
      - id: objectives/collection/app-data/notes/app::notes-theft
      - id: objectives/collection/file-targeting/filter::office-secret-extension-list
      - id: micro-behaviors/os/application/target::multiple-desktop-wallet-references
    needs: 1
