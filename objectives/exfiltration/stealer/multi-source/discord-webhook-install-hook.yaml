# Host recon posted to a Discord webhook from an npm install hook. The package
# fingerprints the machine (two or more user/host/cwd queries in a bundled
# shell script) and carries a Discord webhook endpoint while declaring an
# auto-running install hook -- the install-time exfiltration flow. The legs
# are pooled at archive scope, matching the install-hook host-recon
# convention: the webhook literal and the recon queries live in the bundled
# script the manifest hook runs.
defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, shell]
  attack: "T1033,T1082,T1041,T1567.002"
  mbc: "B0028"

composite_rules:
  - id: install-hook-recon-discord-webhook
    desc: Host recon and Discord webhook in install-hook package
    scope: archive
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-split
      - id: micro-behaviors/os/sysinfo/profile::shell-user-host-cwd-queries
    any:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::has-install-script
    needs: 1
