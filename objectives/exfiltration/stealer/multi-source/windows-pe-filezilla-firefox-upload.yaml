defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: multi-store-credential-upload
    desc: Multi-store credential upload
    crit: hostile
    conf: 0.98
    attack: "T1041,T1552.001,T1555.003"
    for: [pe, dll]
    all:
      - id: objectives/credential-access/ftp/filezilla::filezilla-stealer
      - id: objectives/credential-access/browser/firefox::pk11-decrypt
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: micro-behaviors/communications/http/post::wininet-post
    unless:
      - id: metadata/signed/platform/
