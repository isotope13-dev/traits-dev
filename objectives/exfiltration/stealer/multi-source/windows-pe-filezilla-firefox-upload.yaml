defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: multi-store-credential-upload
    desc: Multi-store credential upload
    crit: hostile
    conf: 0.98
    attack: "T1041,T1552.001,T1555.003"
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/path/password-store::filezilla-configuration-path-references
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: micro-behaviors/communications/http/post::wininet-post
    unless:
      - id: metadata/signed/platform/
