traits:
- id: node-ssh-env-curl-stdin-flow
  desc: SSH key and environment feed curl stdin
  crit: suspicious
  conf: 0.99
  platforms:
  - unix
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((program
        (lexical_declaration
          (variable_declarator
            name: (identifier) @key
            value: (call_expression
              function: (member_expression
                object: (identifier) @fs
                property: (property_identifier) @read)
              arguments: (arguments
                . (binary_expression) @path
                . (string)))))
        (_)*
        (lexical_declaration
          (variable_declarator
            name: (identifier) @envjson
            value: (call_expression
              function: (member_expression
                object: (identifier) @json
                property: (property_identifier) @stringify)
              arguments: (arguments
                . (member_expression
                  object: (identifier) @process
                  property: (property_identifier) @env)))))
        (_)*
        (expression_statement
          (call_expression
            function: (identifier) @exec
            arguments: (arguments
              . (string (string_fragment) @command)
              . (object
                (pair
                  key: (property_identifier) @input
                  value: (binary_expression
                    left: (identifier) @key_use
                    right: (identifier) @env_use)))))))
      (#eq? @fs "fs")
      (#eq? @read "readFileSync")
      (#match? @path "(?s)homedir\\(\\)\\s*\\+\\s*['\"]/\\.ssh/id_(rsa|ed25519|ecdsa)")
      (#eq? @json "JSON")
      (#eq? @stringify "stringify")
      (#eq? @process "process")
      (#eq? @env "env")
      (#eq? @exec "execSync")
      (#match? @command "^curl\\b[^;|\\n]*--data-binary\\s+@-\\s+https?://")
      (#eq? @input "input")
      (#eq? @key @key_use)
      (#eq? @envjson @env_use))
  for:
  - javascript
composite_rules:
- id: npm-postinstall-ssh-env-curl-exfil
  desc: Install hook with SSH and environment export
  crit: hostile
  conf: 0.99
  for:
  - npm
  - package.json
  - javascript
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/stealer/multi-source::node-ssh-env-curl-stdin-flow
  platforms:
  - unix
  - windows
defaults:
  attack: T1552.004,T1552.001,T1041
