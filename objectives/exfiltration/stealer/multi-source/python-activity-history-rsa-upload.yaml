# These collection routines read user activity records and package them into
# an upload encrypted to an embedded RSA public key. Keep the source claims
# separate so command history and Chromium browsing history remain visible.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  - id: python-shell-history-rsa-upload
    desc: Python uploads shell histories with embedded RSA encryption
    crit: hostile
    conf: 0.97
    attack: T1552.003,T1041
    near_bytes: 32768
    all:
      - id: micro-behaviors/fs/path/personal::bash-zsh-history-path-text
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: objectives/exfiltration/stealer/dev-secret::python-rsa-wrapped-dev-secret-upload

  - id: python-chromium-history-rsa-upload
    desc: Python uploads Chromium visit history with embedded RSA encryption
    crit: hostile
    conf: 0.97
    attack: T1217,T1041
    near_bytes: 32768
    all:
      - id: micro-behaviors/data/db/sql::python-chromium-visited-url-query
      - id: micro-behaviors/data/db/sqlite::python-sqlite3-import
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: objectives/exfiltration/stealer/dev-secret::python-rsa-wrapped-dev-secret-upload
