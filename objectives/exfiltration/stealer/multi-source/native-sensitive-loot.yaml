defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  # These static observations do not bind the source to the HTTP body. Keep
  # the compound finding suspicious, even though this specimen's disassembly
  # confirms fopen/fread -> read_and_send -> send_loot -> socket send.
  - id: native-sensitive-path-loot-report
    desc: Sensitive paths with reporting clues and POST
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/credential::private-key-sensitive-path-cluster
      - id: micro-behaviors/communications/http/message::printf-http-post-body
    any:
      - id: metadata/binary/symbols/count::file-to-loot-helper-name-pair
      - id: metadata/binary/instruction::x64-sized-buffer-call-forward-layout
