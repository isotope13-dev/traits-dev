defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows]
  for: [pyc]
  attack: T1555.003,T1041,T1567.002

composite_rules:
  # PyInstaller can preserve the script as bytecode while compressing away
  # source strings from the outer PE. Browser login/cookie access with
  # DPAPI/GCM handling and a Discord HTTP request form the exfiltration chain.
  - id: python-pyc-browser-credentials-discord-exfiltration
    desc: Python bytecode stages browser credentials for Discord upload
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/data/db/access::pyc-encrypted-cookie-query-dpapi-gcm
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-pyc-symbol
      - id: micro-behaviors/communications/http/form::multipart-form
