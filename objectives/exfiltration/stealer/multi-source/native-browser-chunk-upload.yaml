# Native Windows browser stealer: database queries target credentials, cookies,
# and payment data across Chromium and Firefox, while an HTTP POST/chunk route
# and upload client provide a matching outbound transfer path.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1041

composite_rules:
  - id: native-multi-browser-chunked-http-exfiltration
    desc: Multi-browser credential collection with chunked HTTP upload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/data/db/access::chromium-encrypted-cookie-sql
      - id: micro-behaviors/data/db/access::chromium-credit-card-sql
      - id: micro-behaviors/data/db/access::moz-cookies-sql
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: micro-behaviors/communications/http/url/api-path::upload-chunk-route
