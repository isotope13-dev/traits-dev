# Browser and wallet collection sent to a Discord webhook in script languages.
# The endpoint is deliberately modeled as a transport shape, not as any one
# campaign domain: future stealers can change hosting while retaining the flow.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, unix]
  for: [python]
  attack: "T1555.003,T1041,T1567.002"
  mbc: "B0028"

composite_rules:
  - id: python-browser-discord-screenshot-exfiltration
    desc: Python browser data and screenshot sent to Discord
    attack: "T1555.003,T1113,T1041,T1567.002"
    all:
      - id: objectives/exfiltration/stealer/browser::python-browser-discord-webhook-exfiltration
      - id: micro-behaviors/hardware/display/screenshot::pyautogui-screenshot
