# This chain combines credential sources, writes extracted values to a file,
# and uploads that file. The role-specific requirements keep an ordinary
# provider client (which uses a key as request authentication) out of scope.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9
  attack: T1552.001,T1041
  mbc: E1552,E1041

composite_rules:
  - id: shell-ai-provider-key-harvest-upload
    desc: Shell collects and uploads AI provider keys
    crit: hostile
    conf: 0.97
    near_bytes: 600
    all:
      - id: micro-behaviors/os/env/ai-provider::ai-provider-key-env-reference
      - id: micro-behaviors/os/env/enumeration::printenv
      - id: micro-behaviors/fs/write/file/redirect::shell-echo-file-write
      - id: micro-behaviors/os/security/auth/secret::ai-cloud-token-prefix-reference
      - id: micro-behaviors/communications/http/upload::curl-file-upload-exfil
