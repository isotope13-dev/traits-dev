defaults:
  platforms: [windows]
  for: [go]
  attack: T1041

composite_rules:
  - id: go-windows-collect-credential-exfil
    desc: Go Windows collect credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/telemetry::collect-path
      - id: micro-behaviors/communications/http/post::http-newrequest-post
    any:
      - id: objectives/credential-access/env/harvesting::go-env-credential-harvest
      - id: objectives/credential-access/wifi::go-netsh-wifi-password-extraction
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
      - id: objectives/credential-access/credential-manager/cli::go-exec-cmdkey-list
    needs: 2
