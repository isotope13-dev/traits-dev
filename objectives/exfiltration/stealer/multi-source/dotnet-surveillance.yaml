# A managed stealer that combines browser credential collection with keyboard
# capture and SMTP delivery. Each source and the delivery context are
# required, so browser importers and keyboard utilities remain near misses.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-chromium-surveillance-stealer
    desc: Chromium theft with keylogging and SMTP exfiltration
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1555.003,T1048.003
    all:
      - id: micro-behaviors/fs/path/app-data::chromium-profile-user-data-path
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: micro-behaviors/hardware/input/keyboard/layout::to-unicode-ex-str
      - id: micro-behaviors/communications/email/send/smtp::dotnet-smtpclient-type
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/detection/
      - id: well-known/app/security/
  - id: managed-chromium-appbound-http-export
    desc: Chromium credentials collected with a managed multipart HTTP upload
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1041
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-reference
      - id: objectives/credential-access/browser/app-bound::app-bound-key-remote-injection-apis
      - id: micro-behaviors/communications/http/client/managed::multipart-form-data-content
      - id: micro-behaviors/communications/http/post::postasync
    unless:
      - id: well-known/tool/detection/
