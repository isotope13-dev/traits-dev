# Go browser-data collectors in a binary that also carries desktop
# software-wallet brand references: the multi-target stealer shape
# (browser credentials plus wallets). Either leg alone is dual-use —
# wallet software names its own brands, browser methods can automate —
# but one PE collecting browser data while enumerating wallet brands
# (Exodus and the native wallet-brand family) is stealer targeting.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1552.004,T1041
composite_rules:
  - id: go-browser-collector-wallet-targets
    desc: Go browser collectors with wallet targets
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-data-collector-methods
    any:
      - id: micro-behaviors/os/application/target::native-software-wallet-brand-family
      - id: micro-behaviors/os/application/target::exodus-word
