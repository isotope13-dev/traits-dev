defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113

composite_rules:
- id: go-session-multi-sensor-stream
  desc: Go session streams multiple surveillance sensors
  crit: suspicious
  conf: 0.99
  needs: 2
  any:
  - id: micro-behaviors/hardware/display/screen::go-session-tcp-screen-stream
  - id: micro-behaviors/hardware/input/audio::go-session-tcp-microphone-stream
  - id: micro-behaviors/hardware/display/camera::go-session-tcp-camera-stream
