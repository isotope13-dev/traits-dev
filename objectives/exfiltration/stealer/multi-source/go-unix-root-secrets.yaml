defaults:
  platforms: [unix]
  for: [go, elf]
  attack: T1041

composite_rules:
  - id: go-root-secret-tcp-exfil
    desc: Go root secret TCP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/theft/multi-store::go-root-credential-path-list
      - id: objectives/collection/archive/stage::go-hidden-dir-file-stash
      - id: objectives/exfiltration/serialization::go-file-exfil-tcp
  - id: go-root-credential-http-exfil
    desc: Go root credential HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/theft/multi-store::go-root-credential-path-list
    any:
      - id: objectives/exfiltration/http/collect::go-http-collect-post
      - id: micro-behaviors/communications/http/url/telemetry::go-format-collect-url
