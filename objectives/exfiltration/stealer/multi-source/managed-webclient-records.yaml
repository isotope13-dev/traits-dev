defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Each required source is independently recorded. The virtual-call shape
  # supplies code evidence beyond a dormant UploadString metadata name.
  # File scope does not bind the wildcarded call token to UploadString or
  # prove that every recorded buffer reaches that call; describe the profile.
  - id: managed-records-webclient-send-profile
    desc: Keylog, screen and file records with HTTP-send code clues
    crit: hostile
    conf: 0.94
    attack: T1041
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/screenshot::managed-screen-recording
      - id: objectives/collection/file-targeting/enumeration::managed-keylogger-file-targeting-records
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::uploadstring
      - id: metadata/binary/instruction/sequence::cil-local-literal-argument-virtual-call
