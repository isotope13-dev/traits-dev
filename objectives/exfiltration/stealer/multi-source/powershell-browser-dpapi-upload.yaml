# Browser Local State decryption and HTTP PUT upload in one PowerShell
# collection script. The bounded co-occurrence indicates credential theft;
# it does not assert that a particular decrypted value is the request body.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1555.003,T1041

composite_rules:
  - id: powershell-browser-dpapi-http-put
    desc: Browser DPAPI decryption with HTTP PUT upload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/application/browser::local-state
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-unprotect
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::powershell-put-client-call
      - id: micro-behaviors/communications/http/request/payload::powershell-http-body-value
    near_lines: 300
