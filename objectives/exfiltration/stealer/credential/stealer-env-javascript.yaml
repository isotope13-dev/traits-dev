defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: js-secret-env-http-query-exfil
  desc: TLS-disabled env credential query to IP host
  crit: hostile
  conf: 0.98
  attack: T1041,T1552.001
  near_bytes: 4096
  all:
  # Require a bound source-to-query chain, not an unrelated environment read
  # beside ordinary URL encoding and telemetry.
  - id: micro-behaviors/communications/http/query::node-env-credential-numeric-host-query
  - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
