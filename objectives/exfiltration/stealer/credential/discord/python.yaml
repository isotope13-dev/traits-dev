defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  # Credential input, an outbound requests POST, a Discord API destination,
  # and a hardcoded bot token jointly establish credential exfiltration.
  - id: python-discord-credential-exfiltration
    desc: Python exfiltrates prompted credentials to Discord
    crit: hostile
    conf: 0.99
    attack: T1041,T1567.002,T1552.001
    mbc: E1041
    all:
      - id: micro-behaviors/ui/dialog/prompt::python-credential-input-pair
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/services/discord::api-url
      - id: objectives/command-and-control/channel/discord::discord-bot-token-literal
    near_lines: 30
