defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1041,T1056.003,T1539
  mbc: B0030

traits:
  - id: embedded-discord-token-webhook-call
    desc: Captured Discord token passed to webhook
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)\bsendWebhook\s*\([^)]{0,180}\b(capturedToken|token|tok)\b'

composite_rules:
  - id: embedded-discord-debugger-token-exfiltration
    desc: Electron interceptor exfiltrates Discord tokens
    crit: hostile
    conf: 0.995
    all:
      - id: embedded-discord-token-webhook-call
      - id: micro-behaviors/process/attach/debugger::electron-webcontents-debugger-attachment
      - id: objectives/credential-access/discord/token::api-payment-sources
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
