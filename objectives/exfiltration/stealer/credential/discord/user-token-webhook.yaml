# Discord user-token theft via webhook POST (selfbot/voice “modules”).
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

traits:
  - id: discord-user-token-config-field
    desc: Discord USER_TOKEN configuration field
    if:
      type: text
      regex: '\b(USER_TOKEN|config\.USER_TOKEN)\b'

  - id: discord-users-me-auth-get
    desc: Discord /users/@me Authorization GET
    if:
      type: text
      regex: '(?s)discord\.com/api/v\d+/users/@me.{0,200}Authorization'

  - id: discord-token-webhook-payload-field
    desc: Webhook payload embeds Discord user token
    if:
      type: text
      regex: '(?s)(config\.USER_TOKEN|USER_TOKEN).{0,600}axios\.post'

composite_rules:
  - id: discord-user-token-webhook-exfil
    desc: Posts Discord user tokens to a webhook
    crit: hostile
    conf: 0.98
    all:
      - id: discord-user-token-config-field
      - id: micro-behaviors/communications/http/post::axios-post-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-configuration
      - id: discord-token-webhook-payload-field
