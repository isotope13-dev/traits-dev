# Python Discord bots that harvest OAuth refresh tokens and beacon via webhooks.
defaults:
  platforms: [unix, windows]
  for: [python, whl, archives]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

traits:
  - id: python-discord-token-webhook-url
    desc: Python assigns Discord token webhook URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)token_webhook\s*=\s*[''"]https?://discord(app)?\.com/api/webhooks/'

  - id: python-discord-create-invite-call
    desc: Python discord.py create_invite call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.create_invite\s*\('

  - id: python-discord-token-json-store
    desc: Python saves token and refresh_token pair
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["'']token["'']\s*:\s*token.{0,400}["'']refresh_token["'']\s*:\s*refresh_token'

composite_rules:
  - id: python-discord-webhook-oauth-token-stealer
    desc: Python Discord OAuth token webhook exfil
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/oauth::refresh-token-snake-assign
      - id: micro-behaviors/communications/http/webhook::python-webhook-post
      - id: python-discord-token-webhook-url

  - id: python-discord-guild-invite-webhook-beacon
    desc: Python Discord guild invite webhook beacon
    crit: hostile
    conf: 0.97
    attack: T1041,T1195.002
    scope: archive
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::python-webhook-post
      - id: python-discord-create-invite-call

  - id: python-discord-harvested-token-json-store
    desc: Python Discord bot stores harvested token JSON
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: python-discord-token-json-store
      - id: python-discord-token-webhook-url
      - id: micro-behaviors/communications/http/webhook::python-webhook-post
