defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [npm, javascript, typescript, html]
  attack: T1041

composite_rules:
  - id: antiforgery-token-to-webhook-collector
    desc: Anti-forgery token posted to UUID webhook
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/security/csrf::anti-forgery-token-form-post
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
