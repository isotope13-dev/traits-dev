defaults:
  platforms:
  - unix
  for:
  - shell
composite_rules:
- id: ci-credential-result-loop-http-upload
  desc: CI uploads credential-result file chunks
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/filename-credential::credential-result-textfile
  - id: micro-behaviors/communications/http/curl::shell-file-chunk-urlencoded-body
  - id: micro-behaviors/communications/http/post::http-curl-post-request
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-assignment
  - id: micro-behaviors/os/env/cicd::sh-github-repository
  - id: micro-behaviors/data/control-flow/loop::shell-nested-value-loops
  attack: T1041,T1020
