defaults:
  platforms: [android]
  for: [kotlin, java, class, jar, elf, so]
  attack: T1041

traits:

composite_rules:
  - id: android-deeplink-bearer-network-forwarder
    desc: Deep-link input with Bearer-authenticated dynamic URL
    crit: suspicious
    conf: 0.97
    for: [java, kotlin]
    all:
      - id: micro-behaviors/os/message/intent::android-deeplink-query-input
      - id: micro-behaviors/communications/http/request/computed-url::jvm-dynamic-url-construction
      - id: micro-behaviors/communications/http/authorization-header::jvm-bearer-request-property

  - id: android-deeplink-session-query-forwarder
    desc: Deep-link input with session-token dynamic URL
    crit: suspicious
    conf: 0.98
    for: [java, kotlin]
    all:
      - id: micro-behaviors/os/message/intent::android-deeplink-query-input
      - id: micro-behaviors/communications/http/request/computed-url::jvm-dynamic-url-construction
      - id: micro-behaviors/communications/http/query::jvm-session-token-query-construction

  - id: android-exported-deeplink-bearer-token-exfil
    desc: Exported deep link with Bearer-token forwarding
    crit: hostile
    conf: 0.99
    for: [apk, zip]
    scope: outer
    all:
      - id: micro-behaviors/os/message/intent::android-exported-browsable-deeplink
      - id: android-deeplink-bearer-network-forwarder

  - id: android-exported-deeplink-session-query-exfil
    desc: Exported Android deep link forwards a session token in a dynamic URL query
    crit: hostile
    conf: 0.99
    for: [apk, zip]
    scope: outer
    all:
      - id: micro-behaviors/os/message/intent::android-exported-browsable-deeplink
      - id: android-deeplink-session-query-forwarder

  # `android-upload-transport` is only meaningful inside the Android stealer
  # context — it is the transport half of android-credential-upload-exfil.
  # Scoped to Android app/native types (kotlin/java/class/jar + native
  # elf/so), NOT POSIX shell/perl/c, so a desktop doc/release upload script
  # using `curl --data-binary @file` cannot trip an Android-stealer trait.
  - id: android-upload-transport
    desc: Upload transport primitive for Android stealer composites
    crit: component
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/upload::curl-data-binary
      - id: micro-behaviors/communications/http/curl::post-data
      - id: objectives/exfiltration/http/upload::raw-exfil-post-path
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header

  - id: android-credential-http-exfil
    desc: Android credential HTTP exfiltration
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/theft/file::android-credential-store-targeting
    any:
      - id: objectives/exfiltration/http/upload::exfil-beacon-http-endpoint

  - id: android-credential-upload-exfil
    desc: Android credential upload exfiltration
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/theft/file::android-credential-store-targeting
      - id: android-upload-transport

  - id: android-discord-http-exfil
    desc: Android Discord token exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/theft/file::android-discord-token-harvest
      - id: objectives/exfiltration/http/upload::exfil-beacon-http-endpoint
