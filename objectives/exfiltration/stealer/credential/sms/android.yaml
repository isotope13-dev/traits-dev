defaults:
  platforms: [android]
  for: [apk, binaries]
  crit: notable
  conf: 0.86
  attack: "T1636.004"

traits:
  - id: sms-app-channel-flag
    desc: SMS payload app-channel marker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "&from=app"

composite_rules:
  - id: sms-exfil-encoding-chain
    desc: SMS payload encoded for an app channel
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/compress/library::gzip-outputstream
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference
      - id: sms-app-channel-flag

  - id: android-sms-otp-exfil
    desc: Android app intercepts and relays SMS OTP data
    crit: hostile
    conf: 0.995
    mbc: "F0004"
    all:
      - id: micro-behaviors/os/message/intent::android-sms-message-collection-source
      - id: sms-exfil-encoding-chain
    any:
      - id: objectives/credential-access/phishing/tactics::bundled-bank-phish-apk
