# Shell-side credential egress over rsync. A remote token transfer is suspicious
# but can be intentional fleet administration. It becomes hostile here only
# when an npm install-hook package also supplies a hardcoded external SSH sink.
defaults:
  platforms: [unix]
  for: [shell, npm, tar, tgz, package.json, javascript]
  attack: T1552.001,T1041

composite_rules:
  - id: shell-rsync-token-file-push
    desc: Script pushes a token file to a remote rsync target
    crit: suspicious
    conf: 0.96
    for: [shell]
    near_lines: 1
    all:
      - id: micro-behaviors/fs/path/token::secret-token-file-path
      - id: micro-behaviors/fs/file/copy::rsync-remote-variable-target

  - id: npm-hardcoded-ssh-token-egress
    desc: Install-hook package sends token files to a hardcoded SSH host
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: shell-rsync-token-file-push
      - id: micro-behaviors/communications/ip/literal::external-ipv4-ssh-user-assignment
      - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
