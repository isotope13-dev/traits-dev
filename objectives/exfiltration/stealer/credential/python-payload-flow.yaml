# The source alternatives include cloud files, SSH keys and arbitrary secret
# environment variables; they do not require developer-owned credential stores.
# Keep the existing evidence and exclusions while naming the broader source.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1041

composite_rules:
  # Python test helpers commonly authenticate to the service under test with
  # configured environment credentials. Keep that distinct context on the
  # Python flow rule so it does not expand the cross-language suppressor set.
  - id: python-credential-http-upload
    desc: Python sends credential contents via HTTP
    crit: hostile
    conf: 0.95
    scope: leaf
    all:
      - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
    any:
      - id: micro-behaviors/communications/http/request/credentials::python-secret-env-json-body
      - id: micro-behaviors/communications/http/request/credentials::go-secret-env-reader-body
      - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
      - id: micro-behaviors/communications/http/upload::python-credential-dictionary-encrypted-post
      - id: micro-behaviors/communications/http/request/credentials::cargo-credential-http-body-flow
      - id: micro-behaviors/communications/http/upload::curl-named-file-body-upload-command
    unless:
      - id: well-known/app/ai/agent-runtime/
      - id: well-known/app/ai/coding-agent/
      - id: micro-behaviors/communications/http/services/github/
      - id: metadata/build/recognized-contexts::developer-credential-tooling-context
      - id: metadata/package/testing/presence/harness::verified-python-test-file
      - id: well-known/tool/detection/
      - id: metadata/file/naming::test-directory-component
      # Definitions without an in-file invocation retain capability findings;
      # this rule must not infer that the declared transfer executes.
      - id: "metadata/lang/source/shape::python-imports-and-function-module"
