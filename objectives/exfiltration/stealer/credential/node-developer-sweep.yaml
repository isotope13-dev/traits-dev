defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1555
  mbc: E1552
composite_rules:
- id: node-developer-credential-sweep
  desc: Credential upload with multiple store path references
  crit: hostile
  conf: 0.94
  attack: "T1555, T1552.001, T1041"
  mbc: "E1552, E1041"
  near_bytes: 16384
  all:
  - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
  - id: micro-behaviors/fs/path/credential::multiple-credential-path-kinds
  any:
  - id: objectives/exfiltration/stealer/credential::node-encode-exfil
  - id: objectives/exfiltration/http/upload::node-stealthy-exfil
  - id: objectives/exfiltration/stealer/file::oob-endpoint-file-exfil
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: micro-behaviors/os/package-manager/installer-script::package-manager
  - id: micro-behaviors/os/package-manager/installer-script::ci-cd-pipeline
  - id: well-known/app/ai/coding-agent/
  # Fake "SDK telemetry" modules read ~/.npmrc, kubeconfig, .env and similar
  # stores then JSON-POST to a hardcoded IP. Direct-IP plus an actual
  # readFileSync is the stealer tell that a vendor API client does not have.
  - id: "metadata/file/naming::test-directory-component"
- id: node-developer-store-direct-ip-exfil
  desc: Reads developer credential stores and POSTs to a direct-IP HTTP endpoint
  crit: hostile
  conf: 0.97
  attack: "T1555,T1552.001,T1041"
  mbc: "E1552,E1041"
  near_bytes: 16384
  all:
  - id: micro-behaviors/fs/path/credential::multiple-credential-path-kinds
  - id: micro-behaviors/fs/read/file/full::readfilesync-call
  - id: micro-behaviors/communications/http/url/external-ip::direct-ip-http-url-reference
  - id: micro-behaviors/communications/http/request/json::http-post-json
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: "metadata/file/naming::test-directory-component"
