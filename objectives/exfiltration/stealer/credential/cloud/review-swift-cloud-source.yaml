composite_rules:
- platforms:
  - unix
  - macos
  for:
  - swift
  id: swift-cloud-file-content-http-exfil
  desc: Swift credential-file reads with HTTP upload
  crit: hostile
  conf: 0.99
  scope: file
  near_lines: 40
  all:
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: micro-behaviors/fs/path/credential/collection::swift-cloud-config-path-reference
  - id: micro-behaviors/communications/http/request/body/construction::swift-urlrequest-http-body
  - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
  - id: micro-behaviors/communications/http/request/client::swift-urlsession-data-task
