defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
- id: ruby-imds-credentials-in-webhook-query
  desc: Places fetched IAM credentials in webhook query
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: 'exfil\(\{stage:\s*''[^'']{1,40}'',\s*role:\s*rolename,\s*creds:\s*cred\.to_s\}\)'

composite_rules:
- platforms:
  attack: T1041
  id: ruby-cloud-credential-exfil
  desc: Ruby cloud credential exfil
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/credential-access/cloud/local-credentials::ruby-cloud-credential-path-list
  - id: objectives/credential-access/cloud/local-credentials::ruby-orchestration-credential-paths
  - id: objectives/exfiltration/http/report::ruby-json-exfil-post
  any:
  - id: objectives/command-and-control/backdoor/tasking/command-polling::ruby-c2-command-poll
  - id: micro-behaviors/fs/path/credential::login-auth-or-history-file-reference
  - id: micro-behaviors/fs/path/secret-config::gcp-default-credentials
- id: ruby-imds-role-credentials-webhook-exfil
  desc: Ruby sends fetched AWS role credentials to a webhook
  crit: hostile
  conf: 0.99
  attack: T1552.005,T1041
  mbc: E1552,E1041
  scope: file
  all:
  - id: ruby-imds-credentials-in-webhook-query
  - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
