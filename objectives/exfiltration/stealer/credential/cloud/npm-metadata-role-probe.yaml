defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1552.005,T1041

traits:
  - id: metadata-probe-role
    desc: Retrieves role name with curl
    crit: notable
    if:
      type: text
      regex: '\bcurl\b[^`\n]{0,80}\$\{metadataUrl\}`'
  - id: metadata-probe-creds
    desc: Retrieves role credentials with curl
    crit: notable
    if:
      type: text
      regex: '\bcurl\b[^`\n]{0,80}\$\{metadataUrl\}\$\{roleName\}`'
  - id: metadata-probe-report
    desc: Adds parsed credentials to report
    crit: notable
    if:
      type: text
      substr: "report('CLOUD_IAM_LEAK', { role: roleName, credentials: JSON.parse(creds) })"
  - id: metadata-probe-oast
    desc: Selects fixed OAST receiver
    crit: notable
    if:
      type: text
      substr: 'cbrgum2pmg7tuobixmhfonfxyo4fscg1.oastify.com'
  - id: metadata-probe-send
    desc: Posts report payload
    crit: notable
    if:
      type: text
      regex: '(?s)http[.]request\(\{.{0,100}method: ''POST''.{0,80}req[.]write\(payload\)'
  - id: metadata-probe-start
    desc: Starts metadata collection
    crit: notable
    if:
      type: text
      substr: 'checkMetadata();'

composite_rules:
  - id: metadata-role-probe
    desc: Fetches and posts cloud role credentials
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::preinstall-js-basename
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
      - id: metadata-probe-role
      - id: metadata-probe-creds
      - id: metadata-probe-report
      - id: metadata-probe-oast
      - id: metadata-probe-send
      - id: metadata-probe-start
  - id: npm-metadata-role-probe
    desc: Install fetches and posts cloud credentials
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: metadata-role-probe
