defaults:
  attack: T1041
  mbc: B0028
  platforms:
    - linux
    - unix
    - macos
    - windows
    - android
    - ios
  for: [scripts, binaries]
composite_rules:
  - id: multi-wallet-network-stealer
    for: [elf, macho, pe, class, pyc, beam, wasm, shell, batch, python, javascript, ruby, php, lua, perl, powershell, applescript, vbs, staticlib]
    desc: Multi-wallet stealer includes HTTP upload capability
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/wallet/desktop::stealer
    any:
      - id: micro-behaviors/communications/http/upload/
    unless:
      - id: well-known/tool/detection/
      - id: well-known/app/
      - id: objectives/exfiltration/stealer/file::macos-curl-tmp-upload-signal
