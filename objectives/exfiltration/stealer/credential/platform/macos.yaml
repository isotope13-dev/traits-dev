# macOS Credential Exfiltration
# macOS credential theft with network exfiltration
# ATT&CK: T1555 (Credentials from Password Stores) + T1041
defaults:
  platforms: [macos]
  attack: "T1041"
  for: [macho]
traits:
  # objectives/collection/file-targeting/filter::credential-files (an `any:`
  # composite, needs: 2) has no own `for:` override, so it inherits its
  # file's [python, javascript, powershell, perl, pe] default -- macho was
  # never added -- so it structurally cannot fire on Macho (ft-impossible).
  # Two of its four alternatives (ppk/asc extension) are plain generic
  # text regexes with the same gap; local macho-scoped copies below. The
  # other two, pem-file-extension-reference and rdp-extension, already
  # support macho and are reused directly.
  - id: macho-ppk-extension
    desc: PuTTY private key (.ppk) extension
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: \.ppk\b|["']\.ppk["']
  - id: macho-asc-extension
    desc: .asc filename extension fragment
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|[/*"''])[\w.-]*\.asc\b'
composite_rules:
  - id: macos-credential-file-targeting
    desc: Targets credential and remote-access files
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: macho-ppk-extension
      - id: micro-behaviors/fs/path/private-key::pem-file-extension-reference
      - id: macho-asc-extension
      - id: objectives/collection/file-targeting/filter::rdp-extension
  # Hardware fingerprint + network = tracking/identification
  - id: fingerprint-with-exfil
    desc: "macOS hardware fingerprinting network exfiltration"
    crit: suspicious
    conf: 0.8
    attack: "T1082"
    mbc: "B0001.009"
    all:
      - id: objectives/discovery/system/fingerprint/machine-id::hardware-fingerprint-macos
    any:
      - id: micro-behaviors/communications/socket/create::macos-network-client
      - id: micro-behaviors/communications/socket/create::socket-connect
      - id: micro-behaviors/communications/http/download/curl/
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
  # Credential targeting + hardware fingerprinting + network = stealer
  - id: credential-stealer-macos
    desc: "macOS credential stealer"
    crit: hostile
    conf: 0.95
    attack: "T1555"
    mbc: "B0028"
    all:
      - id: objectives/discovery/system/fingerprint/machine-id::macos-hardware-uuid
      - id: objectives/credential-access/validation/check::csidentity-password-auth
      - id: macos-credential-file-targeting
      - id: micro-behaviors/communications/socket/create/
