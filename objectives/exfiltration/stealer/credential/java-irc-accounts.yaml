# Account lines leave the process through an IRC sendMessage call.
defaults:
  platforms: [windows, unix]
  for: [java_class, class]
  attack: T1041
composite_rules:
  - id: rsbot-accounts-sent-over-irc
    desc: Sends RSBot accounts over IRC
    crit: hostile
    conf: 0.94
    near_bytes: 4000
    all:
      - id: objectives/credential-access/theft/keywords::rsbot-accounts-ini-path
      - id: objectives/credential-access/theft/keywords::irc-class-reference
      - id: objectives/credential-access/theft/keywords::sendmessage-method-name
      - id: objectives/credential-access/theft/keywords::username-report-label
