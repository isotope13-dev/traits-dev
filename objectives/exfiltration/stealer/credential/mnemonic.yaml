# Wallet Mnemonic Exfiltration
# Mnemonic phrase theft with HTTP exfiltration
# ATT&CK: T1005 (Data from Local System) + T1041
defaults:
  platforms: [windows, unix]
  attack: "T1041"
composite_rules:
- id: web-wallet-secret-encoded-event-exfil
  desc: Wallet secret entry base64-posted as encoded telemetry event
  crit: hostile
  conf: 0.96
  for: [javascript, crx, xpi, zip]
  scope: file
  all:
  - id: micro-behaviors/data/encode/base64::btoa-object-field
  - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
  - id: micro-behaviors/communications/http/post::request-options-post-method
  - id: micro-behaviors/crypto/mnemonic::mnemonic-validate-check
  - id: micro-behaviors/data/control-flow/error-handling::joined-words-forwarded-then-error
  any:
  - id: micro-behaviors/ui/controls/credential::private-key-enter-label
  - id: micro-behaviors/ui/controls/wallet::wallet-mnemonic-entry-label
