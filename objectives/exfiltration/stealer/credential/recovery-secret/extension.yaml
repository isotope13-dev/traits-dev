defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, xpi, crx]
  attack: T1041
  mbc: B0028

composite_rules:
  # This detects stealers reading the installed wallet stores, rather than a
  # malicious browser extension. Stable extension IDs identify the targeted
  # products; the profile path, archive creation, and upload establish theft.
- id: wallet-seed-callback-concealed-json-post
  desc: Wallet seed input is forwarded to concealed JSON POST
  crit: hostile
  conf: 0.99
  attack: T1056.003,T1041,T1036
  for: [xpi, crx, zip, javascript, html, json, chrome-manifest]
  scope: archive
  all:
  - id: micro-behaviors/ui/controls/wallet::wallet-phrase-entry-surface
  - id: micro-behaviors/data/property/access::value-alias-timer-reporting-call
  - id: metadata/lang/source/naming/function::telemetry-handler-function
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-numeric-endpoint-json-post
  - id: metadata/permission/telemetry::gecko-no-data-collection-claim

  # File relationships and runtime success are not proven. These observations
  # support the wallet-theft pattern even when a kit's input binding is broken.
- id: wallet-seed-field-concealed-post-pattern
  desc: Seed collection beside concealed input POST
  conf: 0.97
  for: [xpi, crx, zip, javascript, html, json]
  scope: archive
  all:
  - id: micro-behaviors/ui/controls/wallet::wallet-phrase-entry-surface
  - id: micro-behaviors/ui/controls/wallet::seed-field-values-collector-call
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-numeric-endpoint-json-post

- id: wallet-seed-phrase-http-exfiltration
  desc: Browser extension sends wallet seed phrase over HTTP
  conf: 0.99
  scope: archive
  all:
  - id: metadata/file/format/browser-extension::xpi-member-path
  - id: micro-behaviors/data/serialize/json::js-seed-phrase-json-field
  - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction

- id: wallet-seed-phrase-xhr-fallback-exfiltration
  desc: Browser extension sends wallet seed through XHR fallback
  conf: 0.98
  scope: archive
  all:
  - id: metadata/file/format/browser-extension::xpi-member-path
  - id: micro-behaviors/data/serialize/json::js-seed-phrase-json-field
  - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction

  # The captured-secret half is now required, not optional. As written this was
  # `fetch()` + the text "POST" + a JSON content-type header — which every
  # wallet extension satisfies by existing — plus an `any:` that accepted a
  # *wallet identity marker* (`wallet-id-rabby`, tronlink, trust) as if being a
  # given wallet were evidence of stealing from it. The only thing standing
  # between the genuine article and a hostile verdict was a one-vendor
  # allowlist for MetaMask, so every other real wallet — Rabby, Trust,
  # TronLink, Coinbase — was convicted. A repackaged Rabby build scored hostile
  # here on nothing but its own runtime.
  #
  # Now the secret field or seed-word field must be present (it moved from
  # `any:` into `all:` as its own `any:` group of two), and `near_bytes` keeps
  # the POST and the secret in one routine rather than one archive. The wallet
  # identity markers are gone: they said what the extension *is*, never what it
  # does with the key material. Detecting a *repackaged* wallet is the job of
  # the impersonation rules, not of an exfiltration composite.
