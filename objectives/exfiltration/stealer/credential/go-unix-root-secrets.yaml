defaults:
  platforms: [unix]
  for: [go, elf]
  attack: T1041

composite_rules:
  - id: go-macos-credential-http-exfil
    desc: Go macOS credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::go-http-collect-post
    any:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
    needs: 1
  - id: go-macho-credential-http-exfil
    desc: Go Mach-O credential exfil
    crit: hostile
    conf: 0.98
    for: [macho]
    all:
      - id: micro-behaviors/communications/http/url/endpoint::go-macho-http-collect-url
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/password-store::login-data
    needs: 1
