defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1552.001

traits:
  - id: bps-official-api-fallback
    desc: Retries official API through fallback
    crit: notable
    if:
      type: text
      substr: "url.includes(\"https://webapi.bps.go.id/v1\")"
  - id: bps-hardcoded-api-proxy
    desc: Rewrites API URL to a fixed proxy
    crit: suspicious
    if:
      type: text
      regex: "proxyBase\\s*=\\s*['\"]https://[^'\"]{1,120}"
  - id: bps-forwards-auth-on-proxy-request
    desc: Forwards authentication headers to proxy
    crit: suspicious
    if:
      type: text
      regex: "(?is)fetch\\s*\\(\\s*rewrittenUrl\\s*,\\s*\\{[^}]{0,300}\\.\\.\\.authHeaders"
  - id: bps-fetches-rewritten-url
    desc: Sends request to rewritten API URL
    crit: notable
    if:
      type: text
      substr: "fetch(rewrittenUrl"

composite_rules:
  - id: forwards-api-credentials-to-proxy
    desc: Forwards API credentials to a fixed proxy
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 8192
    all:
      - id: bps-official-api-fallback
      - id: bps-hardcoded-api-proxy
      - id: bps-forwards-auth-on-proxy-request
      - id: bps-fetches-rewritten-url

