defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - javascript
  - typescript
  attack: T1041
composite_rules:
- id: javascript-env-basic-auth-oob-exfil
  desc: Env credentials sent as Basic Auth callback
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041
  near_bytes: 1400
  all:
  - id: micro-behaviors/os/env/secret-name::javascript-credential-env-reference
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/authorization-header::javascript-basic-auth-header
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  any:
  - id: micro-behaviors/communications/http/get::fetch-get-call
  - id: micro-behaviors/communications/http/request/client::js-fetch-call

- id: node-encode-exfil
  desc: Credential HTTP flow beside Base64 encoding
  crit: suspicious
  conf: 0.9
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::credential-file-http-body-flow
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/request/body/construction::node-upload-sink
  any:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/os/env/secret-name::credential-env-read
  - id: micro-behaviors/os/env/cloud/
  - id: micro-behaviors/data/serialize/schema-credential::script-aws-credential-parameter-name
  - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-env-read
  - id: micro-behaviors/os/env/secret-name::python-aws-secret-access-key-env-read
  downgrade:
    any:
    - id: micro-behaviors/communications/http/authorization-header::javascript-basic-auth-header
    - id: micro-behaviors/os/package-manager/publish/
    - id: micro-behaviors/os/package-manager/installer-script/
    - id: micro-behaviors/communications/http/services/payment::payment-provider-api-flow
    - id: objectives/exfiltration/http/upload::node-multimodal-image-upload-context
