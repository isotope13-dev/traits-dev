# Wallet-source credential collection and HTTP exfiltration signals.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1041"
  mbc: "B0030"
composite_rules:
- id: js-wallet-private-key-env-sent-in-header
  desc: Wallet private key env value sent in header
  crit: hostile
  conf: 0.93
  attack: "T1041,T1552.001"
  all:
  - id: objectives/credential-access/env/secrets/wallet::env-wallet-private-key
  - id: micro-behaviors/communications/http/header/custom::js-header-assigned-wallet-key-variable
  - id: micro-behaviors/communications/http/request/client::http-client-usage
