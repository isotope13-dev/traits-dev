# Paste-bin (JSONBin) upload of validated wallet private keys from obfuscated
# npm helpers. Distinct from extension wallet stealers and Dropbox loot paths.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1555,T1041,T1102.001"
  mbc: "B0028"

composite_rules:
  - id: dual-format-key-jsonbin-https-exfil
    desc: Dual wallet-key format validators exfiltrate via JSONBin HTTPS
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/wallet/key-format::dual-wallet-private-key-validators
      - id: objectives/command-and-control/infrastructure/paste::jsonbin
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jsjiami-watermark
      - id: metadata/lang/source/declaration::hex-identifier-declarations
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
