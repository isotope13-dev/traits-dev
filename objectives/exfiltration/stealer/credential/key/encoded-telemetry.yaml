defaults:
  platforms: [unix, windows]
  attack: T1041
  mbc: B0030
composite_rules:
  # The private-key sibling of the wallet-mnemonic encoded-event stealer: an
  # entered private key is labeled (`[Coin]: <key>`), wrapped in btoa() inside
  # an analytics-shaped event property, POSTed as JSON, and the UI lands on
  # an error screen instead of importing -- the wallet never imports, it only
  # harvests. The error-navigation leg is what separates theft from a wallet
  # that merely ships analytics beside an import form.
  - id: web-private-key-encoded-event-exfil
    desc: Private-key entry sent as Base64 telemetry
    crit: hostile
    conf: 0.95
    for: [javascript, crx, xpi, zip]
    scope: file
    all:
      - id: micro-behaviors/data/encode/base64::btoa-object-field
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/data/control-flow/error-handling::forwarded-text-then-error
    any:
      - id: micro-behaviors/ui/controls/credential::private-key-enter-label

