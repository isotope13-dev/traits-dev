defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86

composite_rules:
- id: private-key-input-http-export
  desc: "Private-key input and remote HTTP request"
  crit: hostile
  conf: 0.99
  attack: T1056.002,T1041
  for: [javascript]
  scope: file
  all:
  - id: micro-behaviors/data/serialize/schema-credential::js-private-key-input-request-field
  - id: micro-behaviors/data/property/access::js-value-property-read
  - id: objectives/exfiltration/sensitive-data/source::js-remote-http-post-json
