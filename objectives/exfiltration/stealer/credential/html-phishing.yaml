defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86

composite_rules:
  - id: private-key-input-http-export
    desc: "Private-key input and remote HTTP request"
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    for: [javascript]
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential::js-private-key-input-and-request-field
      - id: micro-behaviors/data/property/access::js-value-property-read
      - id: objectives/exfiltration/sensitive-data/source::js-remote-http-post-json
  - id: secret-entry-encoded-http-export
    desc: "Secret-entry UI with encoded HTTP export"
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1027
    for: [crx, xpi, zip, javascript]
    scope: archive
    all:
      - id: micro-behaviors/ui/controls/credential::credential-input-surface
      - id: objectives/exfiltration/http/encoded::js-xor-base64-http-post
