defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1041

composite_rules:
  - id: native-windows-cloud-secret-http-exfil
    desc: Native Windows cloud secret exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/env/secrets/bulk-access::native-windows-cloud-env-secret-access-indicator
      - id: objectives/exfiltration/http/report::winhttp-json-exfil-path
      - id: objectives/exfiltration/http/report::json-credential-payload-fields
    any:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request-text
