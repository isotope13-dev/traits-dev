defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
composite_rules:
- id: node-ai-tool-secret-exfil
  desc: Node exfiltrates AI tool secrets
  conf: 0.98
  near_bytes: 4096
  all:
  - id: objectives/credential-access/dev-tools/ai::ai-coding-tool-secret-harvest
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/form::formdata-file-stream
  - id: micro-behaviors/communications/http/form::form-data-append
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  unless:
  - id: well-known/tool/detection/sast/
  - id: well-known/app/ai/coding-agent/

- id: node-credential-file-curl-exfil
  desc: Reads a known credential file and stages it for HTTP upload
  conf: 0.96
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/read/file/full::read-node
  any:
  - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
  - id: micro-behaviors/communications/http/form::formdata-file-stream
  unless:
  - id: well-known/tool/detection/sast/
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/lib/development/swagger-typescript-api::swagger-typescript-api-banner
  - id: well-known/app/ai/tool-server/kie-mcp::official-package
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
