defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1567.001
composite_rules:
- id: github-repo-credential-exfil
  desc: Uploads harvested secrets to a GitHub repository
  crit: hostile
  conf: 0.96
  mbc: E1041
  all:
  - id: micro-behaviors/communications/http/request/credentials::credential-file-upload-evidence
  any:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
  - id: micro-behaviors/communications/http/services/github::github-create-or-update-file-contents
  unless:
  - id: metadata/build
