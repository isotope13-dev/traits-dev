defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-cloud-credential-http-exfil
  desc: Node cloud credentials HTTP exfil
  crit: hostile
  conf: 0.98
  attack: "T1552.005, T1528, T1041"
  mbc: "E1552, E1041"
  all:
  - id: micro-behaviors/os/security/auth/cloud::node-cloud-credential-source-reference
  - id: micro-behaviors/communications/http/request/body::node-body-with-export-endpoint

- id: detached-node-aws-metadata-json-post-pair
  desc: Detached Node queries AWS metadata near a credential JSON POST
  crit: hostile
  conf: 0.97
  attack: "T1552.005,T1041"
  mbc: "E1552,E1041"
  near_bytes: 4000
  all:
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
  - id: micro-behaviors/communications/http/post::fetch-flow-json-post-body
  - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
  - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
