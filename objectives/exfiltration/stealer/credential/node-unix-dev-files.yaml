defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

  mbc: "E1552, E1041"
composite_rules:
- id: node-developer-secret-files-http-exfil
  desc: Node developer secret files HTTP exfil
  crit: hostile
  conf: 0.98
  attack: "T1552.001, T1552.004, T1041"
  all:
  - id: objectives/credential-access/files/config::node-developer-secret-file-sources
  - id: micro-behaviors/communications/http/request/body::node-body-with-export-endpoint
  any:
  - id: "micro-behaviors/fs/read/file/target::node-file-read-near-resource-path"
  - id: objectives/collection/file-targeting/command::node-sensitive-find-command
- id: node-dynamic-credential-list-http-exfil
  desc: Node sends dynamically collected developer credentials over HTTP
  crit: hostile
  conf: 0.98
  attack: "T1552.001, T1552.004, T1041"
  near_bytes: 16384
  all:
  - id: micro-behaviors/fs/path/filename-credential::developer-credential-path-list
  - id: micro-behaviors/fs/read/file/full::read-node
  any:
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: micro-behaviors/communications/http/request/body::request-write-call
