defaults:
  platforms: [linux]
  for: [javascript, typescript]
  attack: T1555,T1041

composite_rules:
  - id: glib-keyring-http-pipeline
    desc: Uploads keyring search output over HTTP
    crit: hostile
    conf: 0.97
    # Both observations must describe the same command invocation.
    near_bytes: 0
    all:
      - id: micro-behaviors/os/security/keyring::glib-secret-tool-search
      - id: micro-behaviors/communications/http/request/body::glib-command-pipeline-upload
