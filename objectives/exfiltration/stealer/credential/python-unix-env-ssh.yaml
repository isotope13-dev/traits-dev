defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1041

composite_rules:
  - id: python-unix-secret-http-exfil
    for: [python]
    desc: Python Unix secret exfil
    crit: hostile
    conf: 0.98
    near_bytes: 3000
    unless:
      - id: metadata/build/recognized-contexts::developer-credential-tooling-context
      - id: metadata/package/testing/
    all:
      - id: micro-behaviors/communications/http/request/json::python-json-request-call
      - id: micro-behaviors/communications/http/post::python-post-method-literal
    any:
      - id: micro-behaviors/os/env/secret-name::python-env-secret-key-list
      - id: micro-behaviors/fs/path/private-key::python-ssh-secret-files
    needs: 1
