defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  # This used to require only a token variable somewhere near a curl stdin
  # upload, under supply-chain/trojanized/build-pipeline. Neither CI nor
  # modification of a trusted build input followed from those conditions.
  # Bind the token selection and raw-body upload through the same shell pipe.
  # Text intentionally also sees staged shell source in quoted heredocs.
  - id: shell-registry-token-curl-stdin-upload
    desc: Registry tokens sent as HTTP body
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041
    # Both patterns start at the source command. Zero-distance joining keeps
    # a token selection from supplying a different pipeline's upload body.
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/upload::shell-pipeline-curl-stdin-body
      # A generic service token can legitimately authenticate to its own API.
      # Require publishing-token source names before this same pipe. The
      # neutral source/transport observations remain for other credentials.
      - id: micro-behaviors/os/env/pipeline::shell-registry-token-pipe-source-reference
    any:
      - id: micro-behaviors/os/env/pipeline::shell-printenv-token-curl-pipe
      - id: micro-behaviors/os/env/pipeline::shell-echo-token-curl-pipe
      - id: micro-behaviors/os/env/pipeline::shell-printf-token-curl-pipe
    unless:
      - id: well-known/tool/development/ci/codecov::official-bash-uploader
