defaults:
  platforms: [unix, windows]
  for:
    - java
    - class
    - java_class
    - jar
    - zip
traits:
  - id: gson-config-jar-string
    desc: Gson config JAR staging path
    crit: suspicious
    conf: 0.95
    for: [class, java_class, jar, zip]
    if:
      type: text
      exact: gson-2.10.1.jar
  - id: forge-eventhandler-ref
    desc: Forge event handler annotation reference
    crit: component
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: text
      substr: Mod$EventHandler
  - id: forge-preinit-ref
    desc: Forge preinit event reference
    crit: component
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: text
      substr: FMLPreInitializationEvent
  # The client singleton reference itself is Minecraft mod identity, not
  # credential access -- it lives in well-known/game/mod and is referenced from
  # the session composites below.
  #
  # Java class files expose constant-pool refs as imports / class.strings, not
  # as `type: text` runs (text extraction is empty for java_class). Match the
  # intermediary-mapped session API through the symbol table.
  - id: minecraft-session-ref
    desc: Minecraft session object reference
    crit: notable
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: import
      exact: net/minecraft/class_320
  - id: minecraft-name-getter-ref
    desc: Minecraft name getter reference
    crit: notable
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: import
      exact: net/minecraft/class_320.method_1676
  - id: minecraft-token-getter-ref
    desc: Minecraft access token getter
    crit: notable
    conf: 0.92
    for: [class, java_class, jar, zip]
    if:
      type: import
      exact: net/minecraft/class_320.method_1674
  - id: minecraft-uuid-getter-ref
    desc: Minecraft UUID getter reference
    crit: notable
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: import
      exact: net/minecraft/class_320.method_44717
  - id: minecraft-profile-json-fields
    desc: Minecraft profile JSON credential fields
    crit: notable
    conf: 0.96
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: 'executionEnvironment.{0,220}accessToken'
  # Alternate profile JSON shape seen in dupe/flex Fabric stealers that POST
  # username/uuid/accessToken without the executionEnvironment wrapper.
  - id: minecraft-access-token-json-fields
    desc: Minecraft accessToken JSON credential fields
    crit: notable
    conf: 0.95
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '"accessToken"\s*:\s*"'
  - id: reversed-weedhack-module-url
    desc: Reversed Weedhack module URL
    crit: component
    conf: 0.99
    for: [class, jar, zip]
    if:
      type: text
      substr: "#eludom/raj/selif/ur.kcahdeew//:ptth"
  - id: initialize-weedhack-callback
    desc: Weedhack payload init callback
    crit: component
    conf: 0.99
    for: [class, jar, zip, java]
    if:
      type: text
      substr: initializeWeedhack
composite_rules:
  - id: fabric-reflective-remote-loader
    desc: Fabric mod reflective remote loader
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1129
    for: [jar, zip]
    all:
      - type: trait
        id: metadata/package/config::fabric-mod-metadata
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
      - type: trait
        id: minecraft-session-access
  - id: forge-mod-entrypoint
    desc: Forge mod event entrypoint
    crit: suspicious
    conf: 0.9
    for: [class, jar, zip]
    all:
      - type: trait
        id: forge-eventhandler-ref
      - type: trait
        id: forge-preinit-ref
  - id: minecraft-session-access
    desc: Minecraft session name access
    crit: notable
    conf: 0.91
    for: [class, java_class, jar, zip]
    all:
      - type: trait
        id: well-known/game/mod::minecraft-client-class-ref
      - type: trait
        id: minecraft-session-ref
      - type: trait
        id: minecraft-name-getter-ref
  - id: minecraft-session-token-access
    desc: Minecraft session token and UUID access
    crit: suspicious
    conf: 0.96
    mbc: B0006
    attack: T1528
    for: [class, java_class, jar, zip]
    all:
      - type: trait
        id: minecraft-session-access
      - type: trait
        id: minecraft-token-getter-ref
      - type: trait
        id: minecraft-uuid-getter-ref
  - id: minecraft-token-child-process-stage
    desc: Minecraft session token collector launches a redirected child stage
    crit: hostile
    conf: 0.99
    mbc: E1203
    attack: "T1528, T1059"
    for: [class, java_class]
    scope: leaf
    unless:
      - id: metadata/package/config::fabric-mod-metadata
    all:
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: micro-behaviors/data/encode/base64::jvm-base64-encode-bytecode
      - type: trait
        id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - type: trait
        id: micro-behaviors/process/io/stream::java-processbuilder-redirected-stdio
  - id: minecraft-token-http-body-exfil
    desc: Minecraft session token access paired with HTTP request-body write
    crit: suspicious
    conf: 0.98
    mbc: E1041
    attack: T1041
    for: [jar, zip]
    all:
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: micro-behaviors/data/buffer::jvm-outputstream-write

  - id: minecraft-token-encrypted-dropper
    desc: Minecraft session token access paired with encrypted payload drop and launch
    crit: hostile
    conf: 0.98
    mbc: E1027
    attack: "T1528, T1027, T1059"
    for: [class, java_class]
    scope: leaf
    all:
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - type: trait
        id: micro-behaviors/crypto/library/provider::secretkeyspec
      - type: trait
        id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
    any:
      - type: trait
        id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - type: trait
        id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode
  - id: minecraft-token-encrypted-http-exfil-dropper
    desc: Minecraft token access with encrypted dropper and HTTP request-body write
    crit: hostile
    conf: 0.98
    mbc: E1041
    attack: "T1528, T1027, T1041"
    for: [jar, zip]
    all:
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - type: trait
        id: micro-behaviors/crypto/library/provider::secretkeyspec
      - type: trait
        id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
    any:
      - type: trait
        id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - type: trait
        id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode
      - type: trait
        id: minecraft-token-http-body-exfil
  - id: forge-reflective-session-access
    desc: Forge reflective session token access
    crit: suspicious
    conf: 0.96
    mbc: B0006
    attack: T1003
    for: [jar, zip]
    all:
      - type: trait
        id: metadata/package/config::forge-mcmod-info
      - type: trait
        id: forge-mod-entrypoint
      - type: trait
        id: minecraft-session-ref
      - type: trait
        id: minecraft-token-getter-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-class-getmethod-bytecode
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
    any:
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-class-forname-bytecode
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-class-forname-bytecode
  - id: fabric-account-forwarding-loader
    desc: Fabric mod account forwarding loader
    crit: hostile
    conf: 0.98
    mbc: B0032
    attack: T1129
    for: [jar, zip]
    all:
      - type: trait
        id: fabric-reflective-remote-loader
      - type: trait
        id: minecraft-session-access
  # NOTE: the "mod JAR downloads a JAR and defines its classes in memory" chain
  # is not restated here. It is remote code staging, not credential theft, and
  # it already has a home that describes it:
  # objectives/command-and-control/backdoor/loader/classloader::java-http-jar-bytecode-stage.
  # Rules that need the mod context reference that composite, as the Weedhack
  # loader below does.
  - id: minecraft-token-remote-jar-stage
    desc: Minecraft token access accompanies remote JAR class staging
    # Archive correlation; avoid stacking with class-level POST exfil.
    crit: suspicious
    conf: 0.99
    mbc: B0032
    attack: T1105,T1129,T1528
    for: [jar, zip]
    scope: archive
    all:
      - type: trait
        id: metadata/package/config::fabric-mod-metadata
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::in-memory-jar-entry-classload
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
  - id: minecraft-session-http-post-exfil
    desc: Minecraft session token sent in Java HTTP POST
    crit: hostile
    conf: 0.99
    mbc: E1041
    attack: T1041,T1528
    for: [class, java_class]
    # Obfuscated sibling restates this POST with the int-array decrypt leg;
    # suppress the clear variant so the same class does not report twice.
    unless:
      - type: trait
        id: minecraft-session-obfuscated-http-post
    all:
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
  # NOTE: there is no archive-level "...but inside a Fabric mod" restatement of
  # the rule above. Wrapping a firing hostile in `fabric.mod.json exists` adds
  # no new objective and reports the same POST twice. The mod-trojanization
  # angle -- a branded mod whose manifest gained a second, foreign entrypoint --
  # is its own finding in objectives/supply-chain/trojanized/app/game-mod/.
  - id: minecraft-profile-json-post-exfil
    desc: Minecraft account profile JSON sent in Java HTTP POST
    crit: hostile
    conf: 0.99
    mbc: E1041
    attack: T1041,T1528
    for: [class, java_class]
    all:
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
    any:
      - type: trait
        id: minecraft-profile-json-fields
      - type: trait
        id: minecraft-access-token-json-fields
  - id: minecraft-session-obfuscated-http-post
    desc: Minecraft session HTTP POST with int-array string decrypt
    crit: hostile
    conf: 0.98
    mbc: E1041
    attack: T1041,T1528,T1027
    for: [class, java_class]
    all:
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
      - type: trait
        id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
  - id: weedhack-fabric-account-loader
    desc: Weedhack Fabric account loader
    crit: hostile
    conf: 0.99
    mbc: B0032
    attack: T1129
    for: [jar, zip]
    scope: archive
    all:
      - type: trait
        id: metadata/package/config::fabric-mod-metadata
      - type: trait
        id: minecraft-session-token-access
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::java-http-jar-bytecode-stage
      - type: trait
        id: reversed-weedhack-module-url
      - type: trait
        id: initialize-weedhack-callback
  - id: minecraft-account-forwarding-classloader
    desc: Minecraft account forwarding classloader
    crit: hostile
    conf: 0.98
    mbc: B0032
    attack: T1129
    for: [class]
    all:
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-loadclass
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-class-getmethod-bytecode
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
      - type: trait
        id: minecraft-session-access
  - id: forge-staged-account-loader
    desc: Forge mod staged account loader
    crit: hostile
    conf: 0.98
    mbc: B0032
    attack: T1129
    for: [jar, zip]
    all:
      - type: trait
        id: metadata/package/config::forge-mcmod-info
      - type: trait
        id: forge-mod-entrypoint
      - type: trait
        id: micro-behaviors/communications/socket/create::java-socket-slash-reference
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-ref
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - type: trait
        id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
  - id: forge-reflective-session-stage-loader
    desc: Forge session stealer staged loader
    crit: hostile
    conf: 0.99
    mbc: B0032
    attack: T1129
    for: [jar, zip]
    all:
      - type: trait
        id: forge-reflective-session-access
      - type: trait
        id: micro-behaviors/communications/socket/create::java-socket-slash-reference
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-ref
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - type: trait
        id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
    any:
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::staged-loader-variant
      - type: trait
        id: gson-config-jar-string
  - id: forge-gson-staged-classloader
    desc: Forge mod staged bytecode loader
    crit: hostile
    conf: 0.98
    mbc: B0032
    attack: T1129
    for: [jar, zip]
    all:
      - type: trait
        id: metadata/package/config::forge-mcmod-info
      - type: trait
        id: forge-mod-entrypoint
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::gson-loader-string
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-ref
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - type: trait
        id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
