defaults:
  platforms: [android]
  for: [kotlin, java, class, jar, elf, so]
  attack: T1041

composite_rules:
  - id: android-deeplink-bearer-network-forwarder
    desc: Deep-link input with Bearer-authenticated dynamic URL
    crit: suspicious
    conf: 0.97
    for: [java, kotlin]
    all:
      - id: micro-behaviors/os/message/intent::android-deeplink-query-input
      - id: micro-behaviors/communications/http/request/url-computed::jvm-dynamic-url-construction
      - id: micro-behaviors/communications/http/authorization-header::jvm-bearer-request-property
  - id: android-deeplink-session-query-forwarder
    desc: Deep-link input with session-token dynamic URL
    crit: suspicious
    conf: 0.98
    for: [java, kotlin]
    all:
      - id: micro-behaviors/os/message/intent::android-deeplink-query-input
      - id: micro-behaviors/communications/http/query::jvm-session-token-query-construction
  - id: android-exported-deeplink-bearer-token-exfil
    desc: Exported deep link with Bearer-token forwarding
    crit: hostile
    conf: 0.99
    for: [android_apk, zip, java, kotlin]
    scope: outer
    all:
      - id: micro-behaviors/os/message/intent::android-exported-browsable-deeplink
      - id: android-deeplink-bearer-network-forwarder
  - id: android-exported-deeplink-session-query-exfil
    desc: Exported Android deep link forwards a session token in a dynamic URL query
    crit: hostile
    conf: 0.99
    for: [android_apk, zip, java, kotlin]
    scope: outer
    all:
      - id: micro-behaviors/os/message/intent::android-exported-browsable-deeplink
      - id: android-deeplink-session-query-forwarder
  - id: android-discord-http-exfil
    desc: Android Discord token exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/theft/file::android-discord-token-harvest
      - id: objectives/exfiltration/http/upload::exfil-beacon-http-endpoint
