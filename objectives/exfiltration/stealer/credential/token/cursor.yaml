defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
- id: cursor-auth-send-log
  desc: Cursor auth sent log
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: Cursor auth sent to bridge

composite_rules:
- id: cursor-auth-sqlite-http-exfil
  desc: Exfiltrates Cursor authentication records over HTTP
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1005,T1041,T1071.001
  for: [scripts, source]
  near_bytes: 4096
  all:
  - id: objectives/credential-access/dev-tools/cursor::cursor-auth-namespace-sqlite-extraction
  any:
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: micro-behaviors/communications/http/lib/requests::requests-post
  - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
  - id: micro-behaviors/communications/http/request/result::http-curl-post-request
  - id: micro-behaviors/communications/http/curl::native-post-fields-option
  unless:
  - id: well-known/lib/vendor-sdk/openchamber::openchamber-credential-import-context
  - id: well-known/lib/vendor-sdk/openchamber::openchamber-extension-manager-context
  - id: well-known/app/ai/usage/claude-code-exporter::claude-code-exporter-cursor-context
  - id: well-known/app/ai/usage/cursor-token-monitor::cursor-token-monitor-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cli-archive-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cursor-plugin-context
  - id: well-known/app/ai/usage/ai-box::ai-box-extension-context

- id: cursor-auth-websocket-exfil
  desc: Cursor auth token WebSocket exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/dev-tools/cursor::cursor-auth-access-token-key
  - id: objectives/credential-access/dev-tools/cursor::cursor-auth-refresh-token-key
  - id: micro-behaviors/communications/http/websocket::wss-scheme
  any:
  - id: objectives/credential-access/dev-tools/cursor::cursor-itemtable-value-query
  - id: cursor-auth-send-log
  - id: micro-behaviors/data/serialize/envelope::auth-message-type-field

- id: cursor-auth-hardcoded-ip-http-exfil
  desc: Cursor auth SQLite read exfiltrated via hardcoded IP HTTP POST
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041,T1071.001
  all:
  - id: objectives/credential-access/dev-tools/cursor::cursor-auth-access-token-key
  - id: objectives/credential-access/dev-tools/cursor::cursor-state-vscdb-path
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
  - id: micro-behaviors/communications/http/request/client::http-post-json
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  unless:
  - id: well-known/app/ai/usage/claude-code-exporter::claude-code-exporter-cursor-context
