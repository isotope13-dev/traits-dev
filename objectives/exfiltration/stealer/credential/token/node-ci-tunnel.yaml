defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-ci-token-tunnel-post-cooccurrence
    desc: CI token collection and tunnel POST co-occur
    crit: suspicious
    conf: 0.98
    attack: "T1552.001,T1041"
    all:
      - id: micro-behaviors/communications/proxy/tunnel::trycloudflare-domain
      - id: micro-behaviors/communications/http/post::request-post-option
      - id: micro-behaviors/os/env/ci-credentials::javascript-ci-token-env-access
      - id: micro-behaviors/communications/http/request/body::request-end-body-call
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
    any:
      - id: objectives/supply-chain/recon-exfil/registry/probe::node-ci-token-map-capture
      - id: objectives/supply-chain/recon-exfil/registry/probe::node-ci-credential-payload-map

