defaults:
  platforms: [windows, macos, linux]
  for: [binaries, scripts]
  attack: T1528
traits:
  # Vim/Neovim compile the credential paths into their filetype-detection
  # table as vim-escaped regexes (e.g. "/%.aws/credentials$", "/%.kube/config$").
  # The "%." escaped-dot + "$" anchor form is unique to the editor's ftdetect
  # table — a real stealer references "~/.aws/credentials", never this regex.
  # Requiring a neovim filetype-API symbol alongside it makes a malware match
  # impossible while pinning this to the editor binary.
  - id: neovim-ftdetect-table-path
    desc: Vim ftdetect credential regex
    crit: component
    conf: 1.0
    if:
      type: text
      regex: '/%\.(aws|kube)/[A-Za-z]+\$'
  - id: neovim-filetype-api-symbol
    desc: Neovim filetype API symbol
    crit: component
    conf: 1.0
    for: [elf, macho, pe]
    if:
      type: symbol
      regex: 'did_set_filetype_or_syntax'
composite_rules:
  - id: neovim-ftdetect-table-marker
    desc: Neovim ftdetect table marker
    crit: baseline
    conf: 1.0
    all:
      - id: neovim-ftdetect-table-path
      - id: neovim-filetype-api-symbol

  # An outbound channel that can carry a file body. Kept local to this rule so
  # the theft claim below names a specific egress path rather than "the file
  # mentions a URL somewhere".
  - id: cloud-credential-upload-channel
    desc: Outbound HTTP channel carrying a body
    crit: component
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post

  # Naming two of these path groups is not theft. Cloud SDKs, deployment
  # tooling, backup utilities and gateway admin consoles all know where
  # ~/.aws/credentials, ~/.kube/config and /run/secrets live -- a LiteLLM
  # proxy UI shipping a guardrail prompt catalogue ("Try `cat
  # /var/run/secrets/...`") named two of them and was called a stealer. The
  # theft shape is that inventory plus an actual local-file read and an
  # outbound upload, matching the reasoning on the dev-file sibling
  # (encoded-multi-developer-secret-exfil).
  - id: cloud-config-stealer
    desc: Reads and uploads multi-service cloud credential files
    crit: hostile
    conf: 0.98
    needs: 2
    # The read, the upload and the credential paths have to be part of one
    # routine. Without a bound, any single-file application bundle satisfies
    # all three from unrelated modules megabytes apart -- a Bun-compiled CLI
    # did. Same window the dev-file sibling uses.
    near_bytes: 32768
    unless:
      # RFC 5737 sets aside 192.0.2/24, 198.51.100/24 and 203.0.113/24 so that
      # examples cannot route anywhere. A file that lists credential paths and
      # an upload channel beside those addresses is building attack fixtures,
      # not collecting: agent-glovebox's `evals/generate.py` emits a labelled
      # benign/malicious corpus for its own classifier.
      - id: micro-behaviors/communications/ip/literal::rfc5737-documentation-ipv4-literal
      - id: well-known/tool/sysadmin/alpine-packages::telegraf-binary-name
      - id: well-known/tool/sysadmin/alpine-packages::alpine-telegraf-member-binary
    all:
      - id: micro-behaviors/fs/file/read::file-content-read-operation
      - id: cloud-credential-upload-channel
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::cloud-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::container-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::orchestration-credentials

  - id: cloud-config-recognized-marker
    desc: Recognized cloud config marker
    crit: baseline
    conf: 0.95
    any:
      - id: well-known/tool/sysadmin/kubernetes
      - id: well-known/tool/sysadmin/container/
      - id: well-known/tool/detection/security-scanner::defensive-scanner-tool-context
      - id: well-known/tool/detection/threat-intel::signatures-db
      - id: metadata/library/data::rust-cloud-object-store-sdk
      - id: well-known/tool/detection/agent-sentry::nhi-auditor-context
      - id: neovim-ftdetect-table-marker
      - id: well-known/tool/sysadmin/alpine-packages::alpine-cloud-native-tool-binary
      - id: well-known/lib/format/conda-package::google-auth-mtls-helper
      - id: well-known/app/data/vector::vector-observability-agent
