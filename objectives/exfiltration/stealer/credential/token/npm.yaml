# NPM Token Exfiltration
# NPM authentication token theft with network exfiltration
# ATT&CK: T1552.001 (Unsecured Credentials: Credentials In Files) + T1041
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"
composite_rules:
  - id: npm-token-stealer
    desc: NPM authentication token stealer
    crit: hostile
    conf: 1.0
    attack: "T1552.001"
    mbc: E1059
    for: [javascript, typescript]
    all:
      - id: objectives/credential-access/env/secrets/file::npm-auth-token-extraction
    any:
      - id: micro-behaviors/communications/http/services/analytics::suspicious-analytics-usage
      - id: micro-behaviors/communications/http/headers::referer-dynamic-concatenation
      - id: micro-behaviors/communications/http/headers::referer-dummy-url-pattern
      - id: objectives/command-and-control/channel/http/uri::uri-fragment-counter-path-unte
  - id: npm-token-stealer-fallback
    desc: NPM token key string with suspicious exfiltration indicators
    crit: hostile
    conf: 0.9
    attack: "T1552.001"
    mbc: E1059
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/package-manager/config::npmrc-registry-authtoken-line
    any:
      - id: micro-behaviors/communications/http/services/analytics::suspicious-analytics-usage
      - id: micro-behaviors/communications/http/headers::referer-dynamic-concatenation
      - id: micro-behaviors/communications/http/headers::referer-dummy-url-pattern
      - id: objectives/command-and-control/channel/http/uri::uri-fragment-counter-path-unte
  - id: gh-cli-token-webhook-exfil
    desc: GH CLI token exfiltration
    crit: hostile
    conf: 0.99
    attack: "T1528"
    mbc: "C0027"
    for: [package.json, shell]
    all:
      - id: objectives/supply-chain/credential-theft/cli/token::gh-auth-token
      - id: objectives/supply-chain/credential-theft/cli/webhook::curl-webhook-post
      - id: objectives/execution/interpreter/script/npm::npm-preinstall-script

  - id: npm-aws-ecs-credential-http-exfil
    desc: npm lifecycle hook sends AWS ECS credentials
    crit: hostile
    conf: 0.995
    attack: T1552.005,T1041,T1195.002
    mbc: E1041
    for: [package.json]
    all:
      - id: objectives/credential-access/cloud/token/metadata::npm-lifecycle-aws-ecs-credential-access
      - id: objectives/supply-chain/recon-exfil/install-hook::npm-lifecycle-aws-ecs-node-credential-post
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture/

  - id: npm-aws-ecs-credential-ngrok-exfil
    desc: npm lifecycle hook curls AWS ECS credentials to ngrok
    crit: hostile
    conf: 0.995
    attack: T1552.005,T1041,T1567.002,T1195.002
    mbc: E1041
    for: [package.json]
    all:
      - id: objectives/credential-access/cloud/token/metadata::npm-lifecycle-aws-ecs-credential-access
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
      - id: well-known/dual-use/tunnel/ngrok::ngrok-free-domain
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture/

  - id: npm-ecs-container-metadata-ngrok-exfil
    desc: npm postinstall sends ECS container metadata to ngrok
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1552.005,T1041,T1567.002
    for: [package.json]
    all:
      - id: objectives/supply-chain/recon-exfil/install-hook::npm-postinstall-ecs-container-metadata-url
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
      - id: well-known/dual-use/tunnel/ngrok::ngrok-free-domain
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture/
