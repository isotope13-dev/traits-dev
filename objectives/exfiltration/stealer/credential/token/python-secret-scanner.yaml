defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1552,T1041

composite_rules:
  - id: verified-secret-scanner-telegram-exfil
    desc: Verified secret scanner findings sent to Telegram
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: well-known/tool/detection/sast::trufflehog-verified-result-option
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/data/serialize/json::json-loads-call
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
