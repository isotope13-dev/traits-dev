defaults:
  platforms: [unix, windows]
  for: [archives]
  attack: T1041,T1528

composite_rules:
  - id: remote-oauth-token-pool-upload
    desc: Remote pool receives OAuth token pair
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/http/auth::oauth-access-refresh-token-fields
      - id: micro-behaviors/communications/http/upload::token-upload-operation
      - id: micro-behaviors/communications/http/upload::remote-token-pool-context
    unless:
      - id: well-known/app/development/vscode-extension/antiknife::antiknife-vscode-extension
