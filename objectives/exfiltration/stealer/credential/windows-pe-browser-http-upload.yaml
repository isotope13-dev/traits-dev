defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: credential-stealer-http-post
    desc: Credential stealer targets with HTTP POST
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/post::post-string-pe
    any:
      - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
      - id: objectives/credential-access/discord/token::local-state-path
      - id: micro-behaviors/fs/path/token::steam-tokens-artifact
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
    needs: 2
    unless:
      - id: metadata/signed/platform/
