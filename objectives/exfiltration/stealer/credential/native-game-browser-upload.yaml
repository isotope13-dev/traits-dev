# Native Windows payloads that gather browser and game account stores and
# provide a WinHTTP POST upload path.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1041

composite_rules:
  - id: native-game-browser-credential-http-exfiltration
    desc: Native browser and game credential collection with HTTP upload
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/gaming/launcher::native-game-browser-credential-collection
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/communications/http/form::multipart-form
