defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001, T1041"

traits:
- id: nohup-hidden-tmp-script
  desc: Hidden /tmp shell script via nohup
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: 'nohup\s+sh\s+/tmp/\.[A-Za-z0-9]{6,16}\.sh\s+>/dev/null\s+2>&1'
- id: nexus-phase-callback-url--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: 'https?://[^"''\s]{3,120}:8080/h=[^&"''\s]{1,120}&l=(info|jsenv)&id='
  count_max: 1019058
- id: nexus-phase-callback-url--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: 'https?://[^"''\s]{3,120}:8080/h=[^&"''\s]{1,120}&l=(k8s|crontab)&id='
  count_max: 1019059
- id: nexus-phase-callback-url--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: 'https?://[^"''\s]{3,120}:8080/h=[^&"''\s]{1,120}&l=(cloud_meta|ssh)&id='
  count_max: 1019060
- id: nexus-phase-callback-url--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: 'https?://[^"''\s]{3,120}:8080/h=[^&"''\s]{1,120}&l=(docker|cmdline)&id='
  count_max: 1019061
- id: nexus-phase-callback-url--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: 'https?://[^"''\s]{3,120}:8080/h=[^&"''\s]{1,120}&l=(proc_all|tokens)&id='
  count_max: 1019062
- id: nexus-phase-callback-url--rx-6
  desc: Regex component marker
  crit: component
  conf: 0.92
  if:
    type: text
    regex: 'https?://[^"''\s]{3,120}:8080/h=[^&"''\s]{1,120}&l=(history)&id='
  count_max: 1019063
- id: harvest-phase-env
  desc: Environment harvest phase names
  crit: component
  conf: 0.9
  if:
    type: text
    regex: 'l=(environ|jsenv)&id='
- id: harvest-phase-cloud
  desc: Cloud metadata harvest phase names
  crit: component
  conf: 0.9
  if:
    type: text
    regex: 'l=(cloud_meta|proc_all)&id='
- id: harvest-phase-package-auth
  desc: Package auth harvest phase name
  crit: component
  conf: 0.9
  if:
    type: text
    substr: 'l=pkgauth&id='
- id: harvest-phase-ssh-token
  desc: SSH and token harvest phase names
  crit: component
  conf: 0.9
  if:
    type: text
    regex: 'l=(ssh|tokens)&id='
- id: harvest-phase-history-container
  desc: "Shell history & container harvest phase names"
  crit: component
  conf: 0.9
  if:
    type: text
    regex: 'l=(history|docker)&id='
- id: harvest-phase-command-line
  desc: Command line harvest phase name
  crit: component
  conf: 0.9
  if:
    type: text
    substr: 'l=cmdline&id='
# Two *different* history files close together. As with the registry-credential
# atoms below, the alternation used to repeat the same names on both sides, so a
# dotfile installer or a `HISTFILE`-hardening script that named `.bash_history`
# twice matched a credential-harvest sweep on its own.
- id: shell-history-then-other-shell-history
  desc: .bash_history named ahead of .zsh_history
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.bash_history\b[\s\S]{0,500}\.zsh_history\b'
- id: other-shell-history-then-shell-history
  desc: .zsh_history named ahead of .bash_history
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.zsh_history\b[\s\S]{0,500}\.bash_history\b'
- id: shell-history-then-db-history
  desc: Shell history named ahead of database history
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.(bash|zsh)_history\b[\s\S]{0,500}\.(mysql|psql)_history\b'
- id: db-history-then-shell-history
  desc: Database history named ahead of shell history
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.(mysql|psql)_history\b[\s\S]{0,500}\.(bash|zsh)_history\b'
- id: db-history-then-other-db-history
  desc: .mysql_history named ahead of .psql_history
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.mysql_history\b[\s\S]{0,500}\.psql_history\b'
- id: other-db-history-then-db-history
  desc: .psql_history named ahead of .mysql_history
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.psql_history\b[\s\S]{0,500}\.mysql_history\b'
# Two *different* package-client credential files close together — the sweep a
# registry-token harvester performs across ecosystems. Each direction is its own
# atom because the pattern is order-independent; `package-auth-file-harvest` ORs
# them. The earlier alternation listed the same filenames on both sides, so a
# single file that merely named `.npmrc` twice satisfied it: the Borales
# actions-yarn entrypoint (default `NPM_CONFIG_USERCONFIG` to `$HOME/.npmrc`,
# then write that file) matched and convicted a legitimate release action.
- id: npmrc-then-pypirc-or-netrc
  desc: .npmrc named ahead of .pypirc or .netrc
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.npmrc\b[\s\S]{0,500}\.(pypirc|netrc)\b'
- id: pypirc-or-netrc-then-npmrc
  desc: .pypirc or .netrc named ahead of .npmrc
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.(pypirc|netrc)\b[\s\S]{0,500}\.npmrc\b'
- id: pypirc-then-netrc
  desc: .pypirc named ahead of .netrc
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.pypirc\b[\s\S]{0,500}\.netrc\b'
- id: netrc-then-pypirc
  desc: .netrc named ahead of .pypirc
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\.netrc\b[\s\S]{0,500}\.pypirc\b'
composite_rules:
- id: node-proc-env-aws-exfil
  desc: Node.js reads AWS credentials from /proc and exfiltrates
  crit: hostile
  conf: 0.98
  attack: T1552.007
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/fs/proc/info/path::process-var-environ
  any:
  - id: micro-behaviors/communications/http/url/domain::workers-dev-domain
  - id: objectives/supply-chain/recon-exfil/oast/env::oast-fun-url
  - id: micro-behaviors/communications/http/endpoints::aws-api-endpoint
- id: automated-webapp-secret-harvester
  desc: Automated webapp credential harvesting script
  crit: hostile
  conf: 0.99
  all:
  - id: nohup-hidden-tmp-script
  - id: harvest-phase-names
  any:
  - id: nexus-phase-callback-url
  - id: micro-behaviors/fs/proc/info/path::process-var-environ
  - id: shell-history-harvest-files
  - id: package-auth-file-harvest
  - id: micro-behaviors/os/container/runtime::serviceaccount-token
  - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
  needs: 2
- id: cloud-kube-webapp-secret-sweep
  desc: Webapp cloud Kubernetes secret sweep
  crit: hostile
  conf: 0.98
  all:
  - id: harvest-phase-names
  any:
  - id: micro-behaviors/os/container/runtime::serviceaccount-token
  - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
  - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
  - id: package-auth-file-harvest
  - id: micro-behaviors/fs/proc/info/path::process-var-environ
  - id: shell-history-harvest-files
  needs: 4
- id: nexus-phase-callback-url
  desc: Phase callback with host and id
  crit: suspicious
  conf: 0.92
  any:
  - id: nexus-phase-callback-url--rx-1
  - id: nexus-phase-callback-url--rx-2
  - id: nexus-phase-callback-url--rx-3
  - id: nexus-phase-callback-url--rx-4
  - id: nexus-phase-callback-url--rx-5
  - id: nexus-phase-callback-url--rx-6
- id: harvest-phase-names
  desc: Credential harvest phase name set
  crit: suspicious
  conf: 0.9
  any:
  - id: harvest-phase-env
  - id: harvest-phase-cloud
  - id: harvest-phase-package-auth
  - id: harvest-phase-ssh-token
  - id: harvest-phase-history-container
  - id: harvest-phase-command-line
  needs: 2
  near_bytes: 1200
# Pairing two history (or package-auth) paths is incomplete alone — fuzzy
# history finders and shell setup scripts name both `.bash_history` and
# `.zsh_history` without harvesting. These stay components for the webapp
# harvester composites above; they are not standalone env-exfil signals.
- id: shell-history-harvest-files
  desc: Two shell or database history files named together
  crit: component
  conf: 0.9
  any:
    - id: shell-history-then-other-shell-history
    - id: other-shell-history-then-shell-history
    - id: shell-history-then-db-history
    - id: db-history-then-shell-history
    - id: db-history-then-other-db-history
    - id: other-db-history-then-db-history
- id: package-auth-file-harvest
  desc: Two package registry credential files named together
  crit: component
  conf: 0.9
  any:
    - id: npmrc-then-pypirc-or-netrc
    - id: pypirc-or-netrc-then-npmrc
    - id: pypirc-then-netrc
    - id: netrc-then-pypirc
