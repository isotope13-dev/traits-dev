# Stolen mail-account credentials leaving over a templated HTTP POST.
# The source side is the Outlook Express registry harvest; the transport
# side is the raw printf-built POST upload template. Recovery utilities
# read the same store, so the chain requires the upload template before
# it convicts.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1041,T1555
composite_rules:
  - id: mail-account-harvest-multipart-post
    desc: Mail-account credential harvest with a multipart POST upload template
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/credential-access/registry/access::outlook-express-account-password-harvest
      - id: micro-behaviors/communications/http/message::printf-http-post-body
      - id: micro-behaviors/communications/http/form::multipart-form
    unless:
      - id: well-known/tool/sysadmin/nirsoft/
      - id: well-known/lib/platform/wine/
