# Source-local flow, rather than a credential path next to an unrelated send.
# Transform models preserve only the documented data argument/receiver. No
# destination, variable name, campaign marker, or encoding constant is required.
# The selected data may be a whole authentication file or an extracted field,
# so these belong at credential, not file or value/token.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041

traits:
  - id: npmrc-data-dns-export
    desc: .npmrc contents enter DNS query
    attack: T1552.001,T1048.003
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(resolve[46]?|lookup)$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
          literal: '(^|[/\\])\.npmrc$'
          through:
            - call: '(^|\.)(join|resolve)$'
              arguments: [0, 1, 2, 3]
            - call: '\.(match|trim|slice|substring|toString)$'
              receiver: true
            - call: '^Buffer\.from$'
              arguments: [0]
            - call: '^Buffer\.from\.toString$'
              receiver: true
            - call: '^encodeURIComponent$'
              arguments: [0]

  - id: npmrc-data-http-body-export
    desc: .npmrc contents enter HTTP request body
    if:
      type: symbol
      kind: call
      regex: '\.(end|write)$'
      receiver:
        from:
          call: '\.request$'
          literal: '^https?://'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
          literal: '(^|[/\\])\.npmrc$'
          through:
            - call: '(^|\.)(join|resolve)$'
              arguments: [0, 1, 2, 3]
            - call: '\.(match|trim|slice|substring|toString)$'
              receiver: true
            - call: '^Buffer\.from$'
              arguments: [0]
            - call: '^Buffer\.from\.toString$'
              receiver: true
            - call: '^(JSON\.stringify|encodeURIComponent)$'
              arguments: [0]
