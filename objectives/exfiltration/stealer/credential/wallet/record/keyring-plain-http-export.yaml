defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1555
composite_rules:
# Wallet keyring serialization yields plaintext secrets (mnemonic or private
# keys). A POST body built beside that serialization, without the eval
# indirection of eval-literal-keyring-http-export, is a weaker but distinct
# variant of the same exfiltration shape; keep it suspicious so the sink is
# reviewed rather than convicted on proximity alone.
- id: keyring-plain-http-export
  desc: Keyring serialization beside a JavaScript HTTP POST body
  crit: suspicious
  conf: 0.9
  near_bytes: 1800
  all:
  - id: micro-behaviors/data/serialize/schema-credential::keyring-map-serialize-calls
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::xhr-post-open
  needs: 1
