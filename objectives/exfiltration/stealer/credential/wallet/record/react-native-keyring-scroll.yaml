defaults:
  for: [javascript]
  platforms: [android, ios]
  attack: T1552.001,T1041

traits:
  - id: rn-keyring-scroll-package
    desc: Is affected React Native scroll package
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: react-native-scrollpageviewtest
  - id: rn-keyring-scroll-path
    desc: Is scroll helper component
    crit: notable
    if:
      type: path
      regex: "(^|[/\\\\])GestureCommon[/\\\\]CommonLottieScroller[.]js$"
  - id: rn-keyring-scroll-activate
    desc: Loads helper when scrolling disabled
    crit: notable
    if:
      type: text
      substr: "loadLottieJson();"
  - id: rn-keyring-scroll-devgate
    desc: Runs keyring routine in development mode
    crit: notable
    if:
      type: text
      substr: "if (!__DEV__ )"
  - id: rn-keyring-scroll-engine
    desc: Targets host application keyring
    crit: notable
    if:
      type: text
      substr: "//KeyringController"
  - id: rn-keyring-scroll-pass
    desc: Gets keyring password
    crit: notable
    if:
      type: text
      substr: "//kkk['getPassword']; //getPassword"
  - id: rn-keyring-scroll-account
    desc: Exports account using password
    crit: notable
    if:
      type: text
      substr: "pri = await kkk[strin(json.x6)](darw, aco[0])"
  - id: rn-keyring-scroll-seed
    desc: Exports seed phrase using password
    crit: notable
    if:
      type: text
      substr: "spf = await kkk[strin(json.x7)](darw, i)"
  - id: rn-keyring-scroll-encode
    desc: Encodes exported key material
    crit: notable
    if:
      type: text
      substr: "ecy(pri)"
  - id: rn-keyring-scroll-build
    desc: Builds outbound credential data
    crit: notable
    if:
      type: text
      substr: "ecy(spf)"
  - id: rn-keyring-scroll-send
    desc: Posts assembled data
    crit: notable
    if:
      type: text
      substr: "loadJson(ssss);"
  - id: rn-keyring-scroll-fetch
    desc: Sends to decoded destination
    crit: notable
    if:
      type: text
      substr: "fetch(strin(json.y9), ccc)"
  - id: rn-keyring-scroll-resource
    desc: Loads obfuscated strings from resource
    crit: notable
    if:
      type: text
      substr: "require('./res/refresh/refreshing3.json')"

composite_rules:
  - id: rn-keyring-scroll-collector
    desc: Scroll helper exports keyring secrets for transmission
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: rn-keyring-scroll-path
      - id: rn-keyring-scroll-activate
      - id: rn-keyring-scroll-devgate
      - id: rn-keyring-scroll-engine
      - id: rn-keyring-scroll-pass
      - id: rn-keyring-scroll-account
      - id: rn-keyring-scroll-seed
      - id: rn-keyring-scroll-encode
      - id: rn-keyring-scroll-build
      - id: rn-keyring-scroll-send
      - id: rn-keyring-scroll-fetch
      - id: rn-keyring-scroll-resource
  - id: rn-keyring-scroll-credential-exfiltration
    desc: Scroll package exports wallet keys in development mode
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: rn-keyring-scroll-package
      - id: rn-keyring-scroll-collector
