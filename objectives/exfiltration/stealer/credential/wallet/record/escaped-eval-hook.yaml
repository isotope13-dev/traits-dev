defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: eval-literal-keyring-http-export
  desc: Keyring serialization beside HTTP POST eval
  crit: hostile
  conf: 0.98
  attack: T1041,T1555
  scope: leaf
  near_bytes: 1800
  all:
  - id: micro-behaviors/data/serialize/schema-credential::keyring-map-serialize-calls
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  # The POST transport may be fetch or an XMLHttpRequest open("POST", url); the
  # eval indirection is what conceals either one, so both are read as literals.
  any:
  - id: micro-behaviors/communications/http/request/body/construction::literal-fetch-post-json-variable-record
  - id: micro-behaviors/communications/http/request/target::literal-xhr-open-post-url
  needs: 1
