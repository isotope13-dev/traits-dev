defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1552.004,T1567.002
  mbc: E1041

traits:
  - id: wallet-constructor-private-key-posted-to-telegram
    desc: Wallet constructor posts private key to Telegram
    crit: hostile
    conf: 0.995
    if:
      type: yara
      source: |
        rule wallet_constructor_private_key_telegram_exfil {
          strings:
            $constructor = /(?:function\s+\w+|constructor)\s*\([^)]*(?:privateKey|secretKey)/is
            $post = /fetch\s*\(.{0,700}POST/is
            $endpoint = /api\.telegram\.org\/bot[0-9]+:[A-Za-z0-9_-]+\/sendMessage/is
            $body = /['"]text['"]\s*:\s*(?:privateKey|secretKey)(?:\[[^\]]{1,80}\])?(?:\.[\w$]+)?\s*\(/is
          condition:
            $constructor and $post and $endpoint and $body
        }
