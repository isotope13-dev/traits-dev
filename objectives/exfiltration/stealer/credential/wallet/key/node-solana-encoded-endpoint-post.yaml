defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.004,T1041,T1195.002

traits:
  - id: node-wallet-encoded-host-bytes
    desc: Encodes wallet upload hostname as bytes
    crit: notable
    if:
      type: text
      substr: '[98,108,120,114,98,110]'
  - id: node-wallet-secret-encoding
    desc: Encodes wallet secret key
    crit: notable
    if:
      type: text
      regex: '\w+\.encode\(\w+\.secretKey\)'
  - id: node-wallet-main-and-destination-body
    desc: Serializes main and destination wallets
    crit: notable
    if:
      type: text
      regex: 'JSON\.stringify\(\{mainWallet:\w+,destWallets:\w+\}\)'
  - id: node-wallet-fetch-body
    desc: Sends constructed wallet payload
    crit: notable
    if:
      type: text
      regex: 'fetch\(\w+,\{method:\w+,.{0,100}body:\w+\}\)'
  - id: node-wallet-two-secret-key-encodings
    desc: Encodes source and destination secret keys
    crit: notable
    if:
      type: text
      regex: '\w+\.encode\(\w+\.secretKey\).{0,100}\w+\.encode\(\w+\.secretKey\)'
  - id: node-wallet-distributor-export
    desc: Exports wallet distribution function
    crit: notable
    if:
      type: text
      substr: 'export { distributeSol }'

composite_rules:
  - id: node-solana-secret-keys-encoded-endpoint-post
    desc: Posts wallet secret keys to encoded endpoint
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: node-wallet-encoded-host-bytes
      - id: micro-behaviors/data/encode/char-code::fromcharcode-source-token
      - id: node-wallet-secret-encoding
      - id: node-wallet-main-and-destination-body
      - id: node-wallet-fetch-body
  - id: node-solana-source-destination-keys-post
    desc: Posts source and destination secret keys
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: node-wallet-encoded-host-bytes
      - id: node-wallet-two-secret-key-encodings
      - id: node-wallet-main-and-destination-body
      - id: node-wallet-fetch-body
  - id: npm-solana-distributor-key-exfiltration
    desc: Wallet distribution package sends private keys
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript]
    scope: archive
    all:
      - id: node-wallet-distributor-export
      - id: node-solana-source-destination-keys-post
