# A wallet private key written to console output leaves the wallet's trust
# boundary and may be retained by captured logs. Require the existing exact
# console/private-key observation rather than wallet vocabulary alone.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]
  attack: T1552.004

composite_rules:
  - id: wallet-private-key-console-disclosure
    desc: Logs wallet private key to console
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: micro-behaviors/os/console/io::js-console-log-near-private-key
      - id: micro-behaviors/data/parse/vocabulary::wallet-credential-term-cluster
