defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1552.001
traits:
- id: snap-bip44-entropy-request
  desc: Snap requests BIP44 entropy
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: method:\s*["\x27]snap_getBip44Entropy["\x27]
- id: backend-json-post
  desc: Script posts JSON to backend endpoint
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)fetch\(`\$\{BACKEND_URL\}\$\{endpoint\}`.{0,200}JSON\.stringify\(body\)
- id: derive-evm-entropy
  desc: Script derives EVM entropy
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: entropy\s*=\s*await deriveEntropy\(60\)
- id: send-derived-private-key
  desc: Backend receives derived private key
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)backendCall\(["\x27]/(sync|register)["\x27].{0,100}privateKey:\s*entropy\.privateKey
composite_rules:
- id: snap-entropy-private-key-backend-post
  desc: Snap sends derived BIP44 private key to backend
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/stealer/credential/wallet/entropy::snap-bip44-entropy-request
  - id: objectives/exfiltration/stealer/credential/wallet/entropy::backend-json-post
  - id: objectives/exfiltration/stealer/credential/wallet/entropy::derive-evm-entropy
  - id: objectives/exfiltration/stealer/credential/wallet/entropy::send-derived-private-key
