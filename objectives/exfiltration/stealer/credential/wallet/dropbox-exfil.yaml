# Native stealers that enumerate browser wallet extensions and upload loot
# through Dropbox's content API (/2/files/upload). Distinct from SDK backup
# tools: wallet-extension targeting plus Dropbox upload is the exfil pattern.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1555.003,T1567.002"
  mbc: "E1567.002,B0028"

composite_rules:
  - id: wallet-extension-dropbox-exfil
    desc: Browser wallet targets uploaded via Dropbox
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/wallet/extension::multi-wallet-targeting
      - id: micro-behaviors/communications/http/services/dropbox::content-upload-client

  - id: wallet-extension-dropbox-api-exfil
    desc: Multi-wallet harvest with Dropbox API upload
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/wallet/extension::multi-wallet-targeting
      - id: micro-behaviors/communications/http/services/dropbox::api-access
    any:
      - id: objectives/collection/file-targeting/filter::credential-files
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
