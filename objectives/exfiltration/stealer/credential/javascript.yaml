defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"
  mbc: B0028

composite_rules:
  - id: js-browser-wallet-upload-exfil
    desc: Browser or wallet data uploaded over HTTP
    crit: hostile
    conf: 0.96
    attack: "T1555.003,T1041"
    for: [javascript]
    # Keep the credential source and transport in one implementation region;
    # large web bundles routinely contain unrelated wallet and POST modules.
    near_bytes: 4096
    all:
      - id: objectives/credential-access/theft/multi-app::js-browser-wallet-credential-source
    any:
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/communications/http/post/
    unless:
  - id: js-credential-discord-webhook-exfiltration
    desc: "Browser or wallet credentials sent to Discord"
    crit: suspicious
    conf: 0.97
    attack: "T1555.003,T1041,T1567.002"
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: objectives/credential-access/theft/multi-app::js-browser-wallet-credential-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-request-builder
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
  - id: js-electron-credential-discord-stealer
    desc: "Electron app sends credentials to Discord"
    crit: hostile
    conf: 0.99
    attack: "T1555.003,T1041,T1567.002"
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/interpreter/node::js-electron-main-require
      - id: objectives/exfiltration/stealer/credential::js-credential-discord-webhook-exfiltration
  - id: obfuscated-discord-telegram-infostealer
    desc: Obfuscated script harvests Discord tokens and sends via Telegram
    crit: hostile
    conf: 0.98
    attack: "T1555.003,T1041,T1567"
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix
      - id: micro-behaviors/communications/messaging/send::telegram-send-channel
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
    needs: 1
