defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
composite_rules:
- id: desktop-crypto-stealer
  for:
  - javascript
  desc: Desktop search, key handling and HTTP POST clues
  conf: 0.95
  crit: hostile
  attack: T1552.004
  all:
  - id: objectives/collection/file-targeting/enumeration::desktop-dir-search
  - id: micro-behaviors/communications/http/post::post
  any:
  - id: micro-behaviors/crypto/key/import::solana-keypair-from-secret-key
  - id: micro-behaviors/crypto/mnemonic::bip39-mnemonic-validation
  - id: micro-behaviors/data/decode/base58::bs58-decode
