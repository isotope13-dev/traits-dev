defaults:
  platforms: [ios, macos]
  for: [html, javascript, typescript]
composite_rules:
  # Two distinct sensitive-store roles, combined with browser fingerprinting,
  # external script staging, eval, and external HTTP. No family strings,
  # hostnames, module hashes, version numbers, or collector filenames gate it.
  # On saved view-source documents this identifies the represented code,
  # not execution of the outer HTML document.
- id: browser-staged-keychain-wallet-collector
  desc: Staged browser collector targets keychain and wallets
  crit: hostile
  conf: 0.96
  attack: T1555.001,T1552.001,T1041
  all:
  - id: objectives/exfiltration/stealer/credential::browser-keychain-export-evidence
  - id: objectives/exfiltration/stealer/credential::browser-wallet-export-evidence
  - id: micro-behaviors/communications/http/user-agent::navigator-useragent-assigned
  - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
  - id: micro-behaviors/communications/http/request/client::fetch-literal-https-url
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
