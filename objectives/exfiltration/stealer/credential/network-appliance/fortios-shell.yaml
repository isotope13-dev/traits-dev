defaults:
  platforms: [fortios, unix]
  for: [shell]
  attack: T1041,T1552.001

composite_rules:
  - id: fortios-admin-password-slack-exfil
    desc: FortiOS admin password sent to Slack
    crit: hostile
    conf: 0.99
    near_lines: 24
    all:
      - id: objectives/credential-access/files/config::fortios-admin-encrypted-password-query
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-post
