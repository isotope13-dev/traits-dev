# Pairing the FortiOS administrator-password query with a Slack incoming
# webhook is the complete exfiltration path: appliance secret material in,
# attacker-controlled chat channel out.  Kept language-agnostic so a Python or
# Perl wrapper that shells out the same CLI is caught alongside a plain script.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts]
  attack: T1041,T1552.001

composite_rules:
  - id: fortios-admin-password-slack-exfil
    desc: FortiOS admin password sent to Slack
    crit: hostile
    conf: 0.99
    near_lines: 24
    all:
      - id: objectives/credential-access/files/config::fortios-admin-encrypted-password-query
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-post
