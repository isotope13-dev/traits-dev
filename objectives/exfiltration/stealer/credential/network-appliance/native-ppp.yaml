defaults:
  platforms: [unix, appliance]
  for: [c, cpp]
  attack: T1041,T1555

traits:
  - id: native-ppp-secret-read
    desc: C opens PPP secrets for reading
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'fopen\s*\(\s*"/etc/ppp/(chap|pap)-secrets"\s*,\s*"r[b]?"\s*\)'

composite_rules:
  - id: native-ppp-secret-socket-exfil
    desc: PPP secrets sent over raw socket
    crit: hostile
    conf: 0.995
    all:
      - id: native-ppp-secret-read
      - id: micro-behaviors/communications/socket/send::sendto-symbol
    near_lines: 8
