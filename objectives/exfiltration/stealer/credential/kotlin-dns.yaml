defaults:
  platforms: [unix, windows]
  for: [kotlin]
  attack: T1048.003,T1552.001
  mbc: E1552,B0030
  crit: hostile
  conf: 0.98

composite_rules:
  - id: kotlin-developer-credential-dns-exfil
    desc: Kotlin exfiltrates developer credentials over DNS
    all:
      - id: micro-behaviors/fs/path/credential::kotlin-ssh-aws-path-cluster
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
    any:
      - id: micro-behaviors/communications/dns/cli::nslookup-command-name
      - id: micro-behaviors/communications/dns/lookup::nslookup-command-literal
      - id: micro-behaviors/communications/dns/cli::nslookup
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
      - id: well-known/tool/detection/
