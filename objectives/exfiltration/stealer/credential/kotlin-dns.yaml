defaults:
  platforms:
    - unix
    - windows
  for:
    - kotlin
  crit: hostile
  conf: 0.99
  attack: T1048.003,T1552.001
composite_rules:
  - id: kotlin-developer-credential-dns-exfil
    desc: Credential file text feeds DNS query
    all:
      - id: kotlin-inline-credential-dns-expression
      - id: metadata/lang/source/syntax/call/construction::jvm-processbuilder-constructor-call
traits:
  - id: kotlin-inline-credential-dns-expression
    desc: Inline credential-file DNS query expression
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule kotlin_inline_credential_dns {
          strings:
            $begin = /\bProcessBuilder\s*\(\s*"nslookup"\s*,\s*/
            $file_aws = /File\s*\(\s*(\w+\s*,\s*)?"\.aws\/credentials"\s*\)/
            $file_ssh = /File\s*\(\s*(\w+\s*,\s*)?"\.ssh\/id_[a-z0-9_]+"\s*\)/
            $end = /\.readText\(\)\s*\+\s*"\.[a-zA-Z0-9.-]+"\s*\)\.start\(\)/
          condition:
            for any b in (1..#begin) : (
              for any a in (1..#file_aws) : (
                @file_aws[a] == @begin[b] + !begin[b] and
                $end at (@file_aws[a] + !file_aws[a])
              ) or
              for any k in (1..#file_ssh) : (
                @file_ssh[k] == @begin[b] + !begin[b] and
                $end at (@file_ssh[k] + !file_ssh[k])
              )
            )
        }
  - id: kotlin-credential-file-hex-dns-flow
    desc: Hex encodes credentials into DNS labels
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule kotlin_credential_file_hex_dns_flow {
          strings:
            $cred = /"\.aws\/credentials"|"\.netrc"|"\.ssh\/id_[a-z0-9_]+"/
            $read = /Files\.readAllBytes\s*\(/
            $hex = /\.joinToString\s*\(\s*["']["']\s*\)\s*\{[^}]{0,160}%02x/
            $chunks = /\.chunked\s*\(\s*[A-Z_a-z][A-Za-z0-9_]*\s*\)\s*\.forEach/
            $dns = /InetAddress\.getAllByName\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\+\s*["']\.[A-Za-z0-9.-]+["']\s*\)/
          condition:
            all of them
        }
