# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-cloud-credential-http-exfil
    desc: Swift exfils cloud credentials over HTTP
    crit: hostile
    conf: 0.99
    for: [swift, zip, tar]
    platforms: [unix, macos]
    scope: archive
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: objectives/credential-access/cloud/local-credentials::swift-cloud-sensitive-paths
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method

