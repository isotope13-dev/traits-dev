# Secret-phrase label paired with Telegram send evidence.
# Wallet and Electron context are optional, so the source is generic credentials.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, scripts, asar, dmg, pkg, zip]
  attack: T1185,T1567,T1555

composite_rules:
  - id: secret-phrase-telegram-send
    desc: "Secret-phrase label with Telegram send"
    crit: hostile
    conf: 0.99
    attack: T1555,T1567,T1102
    all:
      - id: micro-behaviors/ui/dialog/prompt::secret-phrase-label
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
    any:
      - id: micro-behaviors/communications/messaging/send::telegram-send-channel
      - id: objectives/command-and-control/channel/messaging::hardcoded-telegram-bot-token-literal
      - id: objectives/exfiltration/messaging/telegram::bot-token-pattern
    needs: 1
