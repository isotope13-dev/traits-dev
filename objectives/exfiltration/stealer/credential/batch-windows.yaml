defaults:
  platforms: [windows]
  for: [batch, vbs, text]
  attack: T1555

composite_rules:
  - id: batch-credential-archive-upload
    desc: "Archives browser or mail-client credentials for upload"
    crit: hostile
    conf: 0.98
    attack: T1555, T1041
    all:
      - id: credential-sources
      - id: archive-step
      - id: upload-step

  - id: credential-sources
    desc: Credential store references in batch
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/password-store::batch-firefox-credential-store-locations
      - id: objectives/credential-access/email/thunderbird::batch-thunderbird-profile-copy
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
      - id: micro-behaviors/fs/path/application/browser::local-state

  - id: archive-step
    desc: Archive creation in batch
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/data/archive/create/utility::batch-passworded-rar-archive
      - id: micro-behaviors/data/archive/create/utility::archive-utility-create
      - id: micro-behaviors/data/archive/create/utility::windows-archive-create

  - id: upload-step
    desc: Upload command in batch
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-curl-infile-upload
      - id: micro-behaviors/communications/http/download/curl::batch-curl-form-flag
