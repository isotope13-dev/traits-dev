defaults:
  platforms: [windows]
  for: [batch, vbs, text]
  attack: T1555

composite_rules:
  - id: batch-credential-archive-upload
    desc: "Archives browser or mail-client credentials for upload"
    crit: hostile
    conf: 0.98
    attack: T1555, T1041
    all:
      - id: micro-behaviors/data/archive/create/utility::batch-passworded-rar-archive
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-curl-infile-upload
    any:
      - id: micro-behaviors/fs/path/password-store::batch-firefox-credential-store-locations
      - id: objectives/credential-access/email/thunderbird::batch-thunderbird-profile-copy
