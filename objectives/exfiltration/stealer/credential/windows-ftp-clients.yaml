defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1041

composite_rules:
  # A program that is not any of these FTP clients reads several clients'
  # saved-session stores, formats the recovered host, user and password as
  # a credential-bearing FTP URL, and holds a WinInet HTTP channel to report
  # them. One client's own store in its own binary is ordinary operation;
  # the sweep across unrelated clients is the theft signal.
  - id: ftp-client-credential-store-sweep
    desc: Sweeps FTP client credentials for HTTP report
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-credential-url-format
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
    any:
      - id: micro-behaviors/os/registry/credential/reference::smartftp-client-settings-key
      - id: micro-behaviors/os/registry/credential/reference::winscp-sessions-key
      - id: micro-behaviors/os/registry/credential/reference::far-manager-ftp-hosts-key
      - id: micro-behaviors/os/registry/credential/reference::flashfxp-client-key
      - id: micro-behaviors/os/registry/credential/reference::total-commander-client-key
      - id: micro-behaviors/fs/path/password-store::filezilla-configuration-path-references
    needs: 3
