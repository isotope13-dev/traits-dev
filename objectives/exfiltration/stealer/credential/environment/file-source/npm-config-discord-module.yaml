defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: node-config-discord-file-list
    desc: Selects environment and config files
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'const FILES = \[[^\]]{0,160}[.]env[^\]]{0,160}\]'
  - id: node-config-discord-webhook
    desc: Defines Discord webhook target
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'https://discord.com/api/webhooks/'
  - id: node-config-discord-resolve
    desc: Resolves target file path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const fullPath = path.resolve(filePath)'
  - id: node-config-discord-read
    desc: Reads selected file content
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const content = fs.readFileSync(fullPath, "utf-8")'
  - id: node-config-discord-message
    desc: Interpolates content in a template
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'const message = `[^`]{0,300}\$\{content\}'
  - id: node-config-discord-fetch
    desc: Posts message to webhook
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'await fetch(WEBHOOK_URL, {'
  - id: node-config-discord-body
    desc: Serializes message into request body
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'body: JSON.stringify({ content: message })'
  - id: node-config-discord-iterate
    desc: Sends each selected file on import
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'FILES.forEach((file) => sendToWebhook(file))'

composite_rules:
  - id: node-config-discord-send
    desc: Posts local environment and config files
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: node-config-discord-file-list
      - id: node-config-discord-webhook
      - id: node-config-discord-resolve
      - id: node-config-discord-read
      - id: node-config-discord-message
      - id: node-config-discord-fetch
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: node-config-discord-body
      - id: node-config-discord-iterate
  - id: npm-main-config-discord-send
    desc: Package import posts environment and config
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-config-discord-send
      - id: metadata/package/entrypoint/module::has-index-entry
