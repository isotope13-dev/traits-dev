defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1552.001,T1041

traits:
  - id: phantom-probe-hook
    desc: Runs targeted probe during install
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '^node\s+(\./)?payload[.]js\s*\|\|\s*true$'
  - id: phantom-probe-guard
    desc: Checks for targeted application directory
    crit: notable
    if:
      type: text
      substr: "fs.existsSync('/home/node/aspect-node')"
  - id: phantom-probe-host
    desc: Selects fixed report host
    crit: notable
    if:
      type: text
      substr: "const REPORT_HOST = '154.57.164.64'"
  - id: phantom-probe-port
    desc: Selects fixed report port
    crit: notable
    if:
      type: text
      substr: 'const REPORT_PORT = 31205'
  - id: phantom-probe-manifest
    desc: Embeds collected data in module manifest
    crit: notable
    if:
      type: text
      substr: 'cargo_hold: "${safeData}"'
  - id: phantom-probe-request
    desc: Posts manifest to remote module endpoint
    crit: notable
    if:
      type: text
      substr: "method: 'PUT'"
  - id: phantom-probe-npmrc
    desc: Reads target npm configuration
    crit: notable
    if:
      type: text
      substr: '/home/node/aspect-node/.npmrc'
  - id: phantom-probe-env
    desc: Reads process environment bytes
    crit: notable
    if:
      type: text
      substr: "fs.readFileSync('/proc/self/environ', 'utf8')"
  - id: phantom-probe-subnet
    desc: Scans container network range
    crit: notable
    if:
      type: text
      substr: "const base = '172.17.0'"
  - id: phantom-probe-connect
    desc: Connects to hosts and ports
    crit: notable
    if:
      type: text
      substr: 'sock.connect(port, host)'
  - id: phantom-probe-registry
    desc: Probes registry package listing
    crit: notable
    if:
      type: text
      substr: '`${foundTarget}/-/all`'

composite_rules:
  - id: phantom-probe-config
    desc: Reads target package configuration
    crit: notable
    scope: file
    all:
      - id: phantom-probe-npmrc
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  - id: phantom-probe-network
    desc: Scans network and probes package registry
    crit: notable
    scope: file
    all:
      - id: phantom-probe-subnet
      - id: phantom-probe-connect
      - id: phantom-probe-registry
  - id: phantom-probe-collector
    desc: Sends targeted configuration or network data
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::javascript-payload-basename
      - id: phantom-probe-guard
      - id: phantom-probe-host
      - id: phantom-probe-port
      - id: phantom-probe-manifest
      - id: phantom-probe-request
      - id: micro-behaviors/communications/http/request/body/construction::node-request-write-variable
    any:
      - id: phantom-probe-config
      - id: phantom-probe-env
      - id: phantom-probe-network
  - id: npm-phantom-targeted-probe
    desc: Install sends targeted environment or network data
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: phantom-probe-hook
      - id: phantom-probe-collector
