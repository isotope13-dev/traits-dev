defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: dotenv-project-root
    desc: Selects installing project directory
    crit: notable
    if:
      type: text
      substr: 'process.env.INIT_CWD || process.cwd()'
  - id: dotenv-project-file
    desc: Selects project environment file
    crit: notable
    if:
      type: text
      substr: 'path.join(root, ".env")'
  - id: dotenv-project-read
    desc: Reads project environment file
    crit: notable
    if:
      type: text
      substr: 'fs.readFileSync(envPath, "utf8")'

composite_rules:
  - id: dotenv-project-webhook-loader
    desc: Posts project environment file
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::scripts-postinstall-js-path
      - id: dotenv-project-root
      - id: dotenv-project-file
      - id: dotenv-project-read
      - id: micro-behaviors/data/serialize/object::same-name-content-field
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: objectives/exfiltration/stealer/credential/environment/current-process::discord-login-send
  - id: npm-project-dotenv-webhook
    desc: Install hook posts project environment file
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: objectives/execution/payload/file-exec/detached/remote-download::npm-public-exe-postinstall
      - id: dotenv-project-webhook-loader
