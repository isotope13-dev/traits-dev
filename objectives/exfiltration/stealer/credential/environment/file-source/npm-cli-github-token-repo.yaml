defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1567.002

# Matchers are regexes, not literal substrings: variants spell the credential
# names as strings (npm_token, aws_secret_access_key) rather than as the source
# text of a regex literal, and rename the path and directory identifiers. The
# hostile composite is file-scoped and does not require a package.json bin
# entry or a specific command name.
traits:
  - id: github-token-regex
    desc: Searches for cloud secret keys
    crit: notable
    if:
      type: text
      regex: '(?i)aws[\W_]{0,8}secret[\W_]{0,8}access[\W_]{0,8}key'
  - id: github-token-npm
    unless:
      - id: micro-behaviors/os/security/scan/credential::secret-pattern-scanner-db
    desc: Searches for npm tokens
    crit: notable
    if:
      type: text
      regex: '(?i)npm[\W_]{0,8}token'
  - id: github-token-walk
    desc: Reads a directory listing with readdirSync
    crit: component
    if:
      type: text
      regex: '\breaddirSync\(\w+\)'
  - id: github-token-file
    desc: Writes joined lines to output file
    # This generic write pattern also matches harmless log assembly. It is
    # useful only as one leg of the credential collector composite below.
    crit: component
    if:
      type: text
      regex: '\bwriteFileSync\(\w+,\s*\w+\.join\('
  - id: github-token-npmrc
    desc: Copies npm configuration into output
    crit: notable
    if:
      type: text
      regex: 'copyFileSync\(\w+,\s*path\.join\(\w+,\s*[''"]\.npmrc[''"]\)\)'
  # A bare process.cwd() binding is common in CLIs and tests. It is only a
  # leg of the collector, so it stays a component instead of a standalone finding.
  - id: github-token-cwd
    desc: Binds the current working directory
    crit: component
    if:
      type: text
      regex: '\w+\s*=\s*process\.cwd\(\)'

composite_rules:
  - id: github-token-repo-collector
    desc: Collects credential files into a repository
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: github-token-regex
      - id: github-token-npm
      - id: github-token-walk
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: github-token-file
      - id: github-token-npmrc
      - id: github-token-cwd
      - id: micro-behaviors/process/argument/lifecycle::node-require-main-module-guard
  - id: npm-cli-github-token-repo
    desc: Publishes collected npm credentials to a public repo
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: github-token-repo-collector
      - id: micro-behaviors/communications/http/services/github/release::github-public-repo-cli-create
