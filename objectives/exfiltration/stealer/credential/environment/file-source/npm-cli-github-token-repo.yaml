defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1567.002

traits:
  - id: github-token-cli
    desc: Declares package command entry
    crit: notable
    for: [package.json]
    if:
      type: value
      path: bin.create-purple
      regex: '^(\./)?index[.]js$'
  - id: github-token-regex
    desc: Searches for cloud secret keys
    crit: notable
    if:
      type: text
      substr: 'aws[_-]?secret[_-]?access[_-]?key'
  - id: github-token-npm
    desc: Searches for npm tokens
    crit: notable
    if:
      type: text
      substr: 'npm[_-]?token'
  - id: github-token-walk
    desc: Recursively walks project directories
    crit: notable
    if:
      type: text
      substr: 'const items = fs.readdirSync(dir)'
  - id: github-token-file
    desc: Writes tokens to output file
    crit: notable
    if:
      type: text
      substr: "fs.writeFileSync(tokensPath, tokens.join('\\n'), 'utf8')"
  - id: github-token-npmrc
    desc: Copies npm configuration into output
    crit: notable
    if:
      type: text
      substr: "fs.copyFileSync(npmrcPath, path.join(REPO_NAME, '.npmrc'))"
  - id: github-token-public
    desc: Creates and pushes public GitHub repository
    crit: notable
    if:
      type: text
      substr: 'gh repo create ${REPO_NAME} --public --push --source=. --remote=origin'
  - id: github-token-cwd
    desc: Selects current directory for scanning
    crit: notable
    if:
      type: text
      substr: 'const repoPath = process.cwd()'

composite_rules:
  - id: github-token-repo-collector
    desc: Collects credential files into a repository
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: github-token-regex
      - id: github-token-npm
      - id: github-token-walk
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: github-token-file
      - id: github-token-npmrc
      - id: github-token-cwd
      - id: micro-behaviors/process/argument/lifecycle::node-require-main-module-guard
  - id: npm-cli-github-token-repo
    desc: Package command publishes collected credentials
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: github-token-cli
      - id: github-token-repo-collector
      - id: github-token-public
