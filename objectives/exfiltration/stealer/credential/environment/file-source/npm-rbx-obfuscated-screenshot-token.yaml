defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1552.001,T1113,T1041

traits:
  - id: rbx-obfuscated-hook
    desc: Runs bundled postinstall script
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node\s+(\./)?postinstall([.]js)?\s*$'
  - id: rbx-obfuscated-screenshot
    desc: Loads screenshot module
    crit: notable
    if:
      type: text
      substr: 'screenshot=require('
  - id: rbx-obfuscated-dpapi
    desc: Loads Windows DPAPI module
    crit: notable
    if:
      type: text
      substr: 'dpapi=require('
  - id: rbx-obfuscated-scanner
    desc: Defines local token scanner
    crit: notable
    if:
      type: text
      substr: 'async function pdr(R,Z)'
  - id: rbx-obfuscated-canary
    desc: Selects Discord Canary storage
    crit: notable
    if:
      type: text
      substr: 'Discord\x20Canary'
  - id: rbx-obfuscated-ptb
    desc: Selects Discord PTB storage
    crit: notable
    if:
      type: text
      substr: 'Discord\x20PTB'
  - id: rbx-obfuscated-report
    desc: Defines screenshot and token sender
    crit: notable
    if:
      type: text
      substr: 'async function stwk(R,Z,o,N)'
  - id: rbx-obfuscated-blob
    desc: Adds screenshot bytes to report
    crit: notable
    if:
      type: text
      substr: 'new Blob([O])'
  - id: rbx-obfuscated-post
    desc: Posts report using Axios
    crit: notable
    if:
      type: text
      substr: 'await axios[RI(0x6b6,0x5e8,0x57d,0x5bd,0x6fd)](o,V)'
  - id: rbx-obfuscated-start
    desc: Starts installer collection routine
    crit: notable
    if:
      type: text
      substr: 'main();'

composite_rules:
  - id: rbx-obfuscated-discord-collector
    desc: Collects Discord tokens and screenshot
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::postinstall-js-basename
      - id: rbx-obfuscated-screenshot
      - id: rbx-obfuscated-dpapi
      - id: rbx-obfuscated-scanner
      - id: rbx-obfuscated-canary
      - id: rbx-obfuscated-ptb
      - id: micro-behaviors/data/format/discord-token::discord-encrypted-token-prefix-source
      - id: rbx-obfuscated-blob
      - id: rbx-obfuscated-start
  - id: npm-rbx-obfuscated-discord-collector
    desc: Install collects Discord tokens and screenshot
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: rbx-obfuscated-hook
      - id: rbx-obfuscated-discord-collector
      - id: rbx-obfuscated-report
      - id: rbx-obfuscated-post
