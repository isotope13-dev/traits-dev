defaults:
  for: [package.json]
  platforms: [unix]
  attack: T1552.001,T1041

traits:
  - id: kube-hook-path
    desc: Selects Kubernetes service account directory
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      substr: '/var/run/secrets/kubernetes.io/serviceaccount/'
  - id: kube-hook-files
    desc: Selects service account token and metadata
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      substr: "['token', 'namespace', 'ca.crt']"
  - id: kube-hook-read
    desc: Reads selected service account files
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      substr: 'open(path+f).read()'
  - id: kube-hook-encode
    desc: Encodes collected data
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      substr: 'base64.b64encode(str(results).encode()).decode()'
  - id: kube-hook-post
    desc: Posts collected data to OAST endpoint
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: 'httpx[.]post\(''http://[a-z0-9-]+[.]oastify[.]com/k8s_creds'',\s*content=body\)'

composite_rules:
  - id: npm-python-kube-token-post
    desc: Install posts Kubernetes service account data
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/scripts/inline::npm-preinstall-python-inline-command
      - id: kube-hook-path
      - id: kube-hook-files
      - id: kube-hook-read
      - id: kube-hook-encode
      - id: kube-hook-post
