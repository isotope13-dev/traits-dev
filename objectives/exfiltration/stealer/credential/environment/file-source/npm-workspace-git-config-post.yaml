defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1552.001,T1041

traits:
  - id: workspace-git-hook
    desc: Runs bundled installer script
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node\s+(\./)?exp[.]js\s*\|\|\s*true$'
  - id: workspace-git-file
    desc: Is installer script
    crit: notable
    if:
      type: path
      regex: '(^|[/\\])exp[.]js$'
  - id: workspace-git-exec
    desc: Executes the workspace collection command
    crit: notable
    if:
      type: text
      regex: 'exec\(''cat \$GITHUB_WORKSPACE/[.]git/config \| curl -X POST'

composite_rules:
  - id: workspace-git-config-post
    desc: Posts CI Git configuration
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: workspace-git-file
      - id: micro-behaviors/communications/http/curl/body::curl-post-flag
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
      - id: workspace-git-exec
  - id: npm-workspace-git-config-post
    desc: Install posts CI Git configuration
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: workspace-git-hook
      - id: workspace-git-config-post
