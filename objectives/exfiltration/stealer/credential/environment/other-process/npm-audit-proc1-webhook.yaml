defaults:
  for: [shell]
  platforms: [unix]
  attack: T1552.001,T1041

traits:
  - id: npm-audit-proc1-env
    desc: Reads process one environment
    crit: notable
    if:
      type: text
      substr: 'cat /proc/1/environ'
  - id: npm-audit-proc1-field
    desc: Sends environment data
    crit: notable
    if:
      type: text
      regex: '(file=@sandbox_core[.]txt|ENVIRONMENT_RAW|START_SESSION)'

composite_rules:
  - id: npm-audit-proc1-script-pattern
    desc: Posts process environment to webhook
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::shell-audit-script-basename
      - id: npm-audit-proc1-env
      - id: micro-behaviors/communications/http/curl/command::curl-post-method-command
      - id: micro-behaviors/communications/url/host/oob/callback-url::webhook-site-url-literal
      - id: npm-audit-proc1-field
  - id: npm-audit-proc1-install
    desc: Install hook posts process environment to webhook
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, shell, package.json]
    all:
      - id: metadata/package/scripts/command::shell-ms-audit-preinstall
      - id: npm-audit-proc1-script-pattern
