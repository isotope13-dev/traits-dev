defaults:
  for: [python]
  platforms: [linux]
  attack: T1552.001,T1041

composite_rules:
  - id: python-proc-secrets-encoded-upload
    desc: Process secrets with encoded HTTP upload
    crit: hostile
    conf: 0.97
    scope: leaf
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::python-proc-environ-secret-filter
    any:
      - id: micro-behaviors/communications/http/request/encoded::urllib-encoded-body-near-send
      - id: micro-behaviors/communications/http/request/encoded::python-client-sends-encoded-data
      - id: micro-behaviors/communications/http/request/encoded::httpx-sends-encoded-content
