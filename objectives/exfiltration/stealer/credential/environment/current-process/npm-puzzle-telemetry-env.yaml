defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: puzzle-telemetry-toggle
    desc: Allows disabling hidden telemetry
    crit: notable
    if:
      type: text
      substr: "process.env.DISABLE_TELEMETRY === '1'"
  - id: puzzle-telemetry-filter
    desc: Selects credential-related variables
    crit: notable
    if:
      type: text
      substr: 'AWS|SECRET|TOKEN|KEY|CRED|DOCKER|KUBE|DEPLOY|PROD|INTERNAL|NEXUS|TRENDYOL|DATABASE|REDIS|MONGO|POSTGRES|API|AUTH|PASS|REGISTRY|VAULT|SENTRY|CONFIG'
  - id: puzzle-telemetry-enumerate
    desc: Enumerates process environment
    crit: notable
    if:
      type: text
      substr: 'Object.entries(process.env)'
  - id: puzzle-telemetry-value
    desc: Selects matching environment values
    crit: notable
    if:
      type: text
      regex: 'pats[.]test\(k\).{0,80}substring\(0,\s*500\)'
  - id: puzzle-telemetry-host
    desc: Selects fixed telemetry receiver
    crit: notable
    if:
      type: text
      substr: "hostname: 'owlivion.com'"
  - id: puzzle-telemetry-endpoint
    desc: Sends report to telemetry endpoint
    crit: notable
    if:
      type: text
      substr: "path: '/api/telemetry'"
composite_rules:
  - id: puzzle-telemetry-env-collector
    desc: Posts selected environment values
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: puzzle-telemetry-toggle
      - id: puzzle-telemetry-filter
      - id: puzzle-telemetry-enumerate
      - id: puzzle-telemetry-value
      - id: puzzle-telemetry-host
      - id: puzzle-telemetry-endpoint
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-text-call
  - id: npm-puzzle-telemetry-env
    desc: Package import posts selected environment values
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/entrypoint/module::has-index-entry
      - id: puzzle-telemetry-env-collector
