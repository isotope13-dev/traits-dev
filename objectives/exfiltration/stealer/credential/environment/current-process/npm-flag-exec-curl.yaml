defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: npm-flag-hook
    desc: Runs flag collection script after install
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node\s+(\./)?pwn[.]js\s*$'
  - id: npm-flag-script-path
    desc: Is postinstall collection script
    crit: notable
    if:
      type: path
      regex: '(^|[/\\])pwn[.]js$'
  - id: npm-flag-env-fallback
    desc: Reads flag or uses shell output
    crit: notable
    if:
      type: text
      regex: 'process[.]env[.]FLAG\s*\|\|\s*execSync\('
  - id: npm-flag-webhook-curl
    desc: Posts to webhook using curl
    crit: notable
    if:
      type: text
      regex: 'execSync\(`curl\s+-X\s+POST\s+https://webhook[.]site/'
  - id: npm-flag-json-body
    desc: Serializes variable named flag as JSON
    crit: component
    if:
      type: text
      regex: 'JSON[.]stringify\((flag|\{data:\s*flag\})\)'

  - id: npm-flag-preinstall-hook
    desc: Runs collection script before install
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '^node\s+(\./)?pwn[.]js\s*$'
  - id: npm-flag-https-source
    desc: Reads flag environment variable
    crit: notable
    if:
      type: text
      regex: 'const\s+flag\s*=\s*process[.]env[.]FLAG'
  - id: npm-flag-https-body
    desc: Serializes flag in JSON body
    crit: notable
    if:
      type: text
      regex: 'JSON[.]stringify\(\{\s*flag:\s*flag\s*\}\)'
  - id: npm-flag-https-host
    desc: Selects webhook host and POST
    crit: notable
    if:
      type: text
      regex: '(?s)hostname:.{0,3}(webhook[.]site|[a-z0-9-]+[.]oastify[.]com).{0,100}method:.{0,3}POST'
  - id: npm-flag-https-request
    desc: Writes body to HTTPS request
    crit: notable
    if:
      type: text
      regex: '(?s)https[.]request\(options\).{0,100}req[.]write\(data\).{0,100}req[.]end\(\)'

composite_rules:
  - id: npm-flag-shell-webhook
    desc: Posts environment flag or command output
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: npm-flag-script-path
      - id: npm-flag-env-fallback
      - id: npm-flag-webhook-curl
      - id: npm-flag-json-body
  - id: npm-install-flag-shell-webhook
    desc: Install hook posts flag or shell output
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: npm-flag-hook
      - id: npm-flag-shell-webhook
  - id: npm-flag-https-webhook
    desc: Posts environment flag to webhook
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: npm-flag-script-path
      - id: npm-flag-https-source
      - id: npm-flag-https-body
      - id: npm-flag-https-host
      - id: npm-flag-https-request
  - id: npm-install-flag-https-webhook
    desc: Install hook posts flag using HTTPS
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: npm-flag-https-webhook
    any:
      - id: npm-flag-hook
      - id: npm-flag-preinstall-hook
