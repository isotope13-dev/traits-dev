defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1041

composite_rules:
  - id: python-env-sweep-concealed-upload
    desc: Secret env sweep with concealed HTTP upload
    crit: hostile
    conf: 0.97
    scope: leaf
    all:
      - id: micro-behaviors/os/env/credential/secret::python-environ-credential-name-filter
    any:
      - id: urllib-concealed-target-and-body
      - id: micro-behaviors/communications/http/request/encoded::httpx-encoded-target-and-content
      - id: micro-behaviors/communications/http/request/encoded::python-client-encoded-target-and-data

  - id: urllib-concealed-target-and-body
    desc: Decoded urllib URL near encoded request body
    crit: notable
    scope: leaf
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/client/initialize::python-urllib-base64-decoded-target
      - id: micro-behaviors/communications/http/request/encoded::urllib-encoded-body-near-send
