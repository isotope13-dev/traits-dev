defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: yolo-audit-hook
    desc: Runs diagnostic audit during install
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '^node\s+(\./)?scripts/audit[.]js\s*$'
  - id: yolo-audit-path
    desc: Is installation audit script
    crit: notable
    if:
      type: path
      regex: 'scripts[/\\]audit[.]js$'
  - id: yolo-oob-host
    desc: Selects fixed diagnostic receiver
    crit: notable
    if:
      type: text
      substr: 'baoreqygjveumkkxydcd.supabase.co'
  - id: yolo-oob-path
    desc: Places diagnostic data in webhook query
    crit: notable
    if:
      type: text
      substr: '/functions/v1/Webhook_OOB?data=npm_'
  - id: yolo-oob-base64
    desc: Encodes diagnostic report
    crit: notable
    if:
      type: text
      substr: "Buffer.from(report).toString('base64')"
  - id: yolo-env-prefix-collect
    desc: Selects company environment variables
    crit: notable
    if:
      type: text
      substr: "key.startsWith('TMO_') || key.startsWith('TMUS_') || key.startsWith('TELEKOM_')"
  - id: yolo-env-prefix-report
    desc: Includes variable values in report
    crit: notable
    if:
      type: text
      substr: '.map(key => `${key}:${process.env[key]}`)'
  - id: yolo-env-keyword-collect
    desc: Filters env for company and cloud terms
    crit: notable
    if:
      type: text
      substr: "['tmo', 'tmus', 'telekom', 'corp', 'internal', 'azure', 'aws']"
  - id: yolo-env-keyword-report
    desc: Collects environment variable values
    crit: notable
    if:
      type: text
      substr: 'envHits.push(`${k}=${String(v).substring(0, 30)}`)'
  - id: yolo-git-remote-collect
    desc: Reads Git remote URLs
    crit: notable
    if:
      type: text
      substr: "execSync('git remote -v'"
  - id: yolo-git-remote-report
    desc: Adds remote URL to diagnostic report
    crit: notable
    if:
      type: text
      substr: '|git_remote:${gitRemote}|proj:${projectName}'

composite_rules:
  - id: yolo-oob-prefix-env
    desc: Collects targeted environment values
    crit: notable
    scope: file
    all:
      - id: yolo-env-prefix-collect
      - id: yolo-env-prefix-report
  - id: yolo-oob-keyword-env
    desc: Collects matching environment values
    crit: notable
    scope: file
    all:
      - id: yolo-env-keyword-collect
      - id: yolo-env-keyword-report
  - id: yolo-oob-git-remote
    desc: Collects Git remote information
    crit: notable
    scope: file
    all:
      - id: yolo-git-remote-collect
      - id: yolo-git-remote-report
  - id: yolo-oob-collector
    desc: Posts targeted information to diagnostic receiver
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: yolo-audit-path
      - id: yolo-oob-host
      - id: yolo-oob-path
      - id: yolo-oob-base64
      - id: micro-behaviors/communications/http/request/client::https-request
    any:
      - id: yolo-oob-prefix-env
      - id: yolo-oob-keyword-env
      - id: yolo-oob-git-remote
  - id: npm-yolo-oob-collector
    desc: Install hook sends targeted information
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: yolo-audit-hook
      - id: yolo-oob-collector
