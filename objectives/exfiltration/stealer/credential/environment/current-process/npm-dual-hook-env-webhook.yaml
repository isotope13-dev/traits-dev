defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: dual-hook-env-write
    desc: Writes collected data to local file
    crit: notable
    if:
      type: text
      substr: "fs.writeFileSync(path.join(__dirname, 'exfil.txt'), JSON.stringify(data"
  - id: dual-hook-send-file
    desc: Selects collected environment file
    crit: notable
    if:
      type: text
      substr: "path.join(__dirname, 'exfil.txt')"
  - id: dual-hook-send-read
    desc: Reads collected environment data
    crit: notable
    if:
      type: text
      substr: "JSON.parse(fs.readFileSync(exfilPath, 'utf8'))"
  - id: dual-hook-send-post
    desc: Sends collected data using Axios
    crit: notable
    if:
      type: text
      substr: 'axios.post(webhookURL, { data })'
  - id: dual-hook-send-ip
    desc: Selects private-network report host
    crit: notable
    if:
      type: text
      regex: "'http://10[.]0[.]15[.][0-9]{1,3}/'"

composite_rules:
  - id: dual-hook-env-collector
    desc: Writes full environment to report file
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::preinstall-js-basename
      - id: micro-behaviors/os/env/read/collection::node-process-env-object-field
      - id: dual-hook-env-write
  - id: dual-hook-env-sender
    desc: Posts collected environment report
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::postinstall-js-basename
      - id: dual-hook-send-file
      - id: dual-hook-send-read
      - id: dual-hook-send-post
      - id: dual-hook-send-ip
  - id: npm-dual-hook-env-webhook
    desc: Install hooks collect and post environment
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: dual-hook-env-collector
      - id: dual-hook-env-sender
