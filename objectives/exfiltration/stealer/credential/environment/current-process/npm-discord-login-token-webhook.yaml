defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: discord-login-env
    desc: Reads Discord bot token environment variables
    crit: notable
    if:
      type: text
      substr: 'process.env.TOKEN || process.env.DISCORD_TOKEN || process.env.BOT_TOKEN'
  - id: discord-login-hook
    desc: Replaces Discord client login method
    crit: notable
    if:
      type: text
      substr: 'Discord.Client.prototype.login = function(tokenArg)'
  - id: discord-login-hook-send
    desc: Sends token supplied to login
    crit: notable
    if:
      type: text
      substr: 'sendToWebhook({ token: tokenArg })'
  - id: discord-login-env-send
    desc: Sends token obtained from environment
    crit: notable
    if:
      type: text
      substr: 'sendToWebhook({ token: token })'
  - id: discord-login-send
    desc: Sends token payload in HTTPS request
    crit: notable
    if:
      type: text
      regex: '(?s)https[.]request\(options.{0,250}req[.]write\(payload\).{0,100}req[.]end\(\)'
  - id: discord-login-start
    desc: Starts token extraction on import
    crit: notable
    if:
      type: text
      substr: 'extractToken();'

composite_rules:
  - id: discord-login-token-exfil
    desc: Hooks bot login and posts token
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
      - id: discord-login-env
      - id: discord-login-hook
      - id: discord-login-hook-send
      - id: discord-login-env-send
      - id: discord-login-send
      - id: discord-login-start
  - id: npm-discord-login-token-exfil
    desc: Package import captures and posts bot tokens
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/entrypoint/module::has-index-entry
      - id: discord-login-token-exfil
