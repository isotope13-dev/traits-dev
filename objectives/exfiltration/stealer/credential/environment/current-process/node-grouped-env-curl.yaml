defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1552.001,T1041

traits:
  - id: node-grouped-env-curl
    desc: Posts grouped shell environment output
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator
            name: (identifier) @command_var
            value: (string (string_fragment) @command)))
          (expression_statement (call_expression
            function: (identifier) @exec
            arguments: (arguments (identifier) @command_arg))))
          (#eq? @exec "exec")
          (#eq? @command_var @command_arg)
          (#match? @command "\\([^\\n]{0,300}(?:^|[;&|]\\s*)(?:env|printenv)\\s*(?:[;&]|\\))[^\\n]{0,300}\\)\\s*\\|\\s*curl\\s+[^\\n]{0,200}(?:-d|--data(?:-binary)?)\\s+@-\\s+https?://"))
