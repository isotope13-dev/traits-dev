defaults:
  platforms: [linux]
  for: [javascript]
  attack: T1552.001,T1041

traits:
  - id: node-proc-env-curl-flow
    desc: Sends process environment through curl
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @command
            value: (template_string (string_fragment) @read_command)))
          (lexical_declaration (variable_declarator name: (identifier) @env
            value: (call_expression function: (member_expression
              object: (call_expression function: (identifier) @read_exec
                arguments: (arguments (identifier) @command_used))
              property: (property_identifier) @to_string))))
          (lexical_declaration (variable_declarator name: (identifier) @payload
            value: (call_expression function: (member_expression
              object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments (object (pair value: (identifier) @env_used))))))
          (expression_statement (call_expression function: (identifier) @send_exec
            arguments: (arguments (template_string (string_fragment) @curl
              (template_substitution (identifier) @payload_used))))))
          (#match? @read_command "^cat /proc/[0-9]+/environ([ |;]|$)")
          (#eq? @command @command_used)
          (#eq? @read_exec "execSync")
          (#eq? @to_string "toString")
          (#eq? @env @env_used)
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @send_exec "execSync")
          (#match? @curl "^curl .*(-d|--data) ")
          (#eq? @payload @payload_used))
