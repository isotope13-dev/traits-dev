defaults:
  for: [package.json]
  platforms: [unix]
  attack: T1552.001,T1041

traits:
  - id: npm-shell-profile-env
    desc: Includes full environment in install profile
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;[:space:]])env[;[:space:]]'
  - id: npm-shell-profile-id
    desc: Includes user identity in install profile
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;([:space:]])id[;[:space:]]'
  - id: npm-shell-profile-uname
    desc: Includes OS details in install profile
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: 'uname[[:space:]]+-a'
  - id: npm-shell-profile-resolver
    desc: Includes resolver configuration
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: 'cat[[:space:]]+/etc/resolv[.]conf'
  - id: npm-shell-profile-processes
    desc: Includes process listing
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: 'ps[[:space:]]+-aux\s*\|\s*head'
  - id: npm-shell-profile-base64-post
    desc: Encodes and posts profile through curl
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '\)\s*\|\s*base64\s*\|\s*curl\s+-X\s+POST'
  - id: npm-shell-profile-stdin
    desc: Sends piped bytes as request body
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '--data-binary[[:space:]]+@-[[:space:]]+https://'

composite_rules:
  - id: npm-postinstall-base64-env-profile-post
    desc: Install posts encoded environment and system profile
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: npm-shell-profile-env
      - id: npm-shell-profile-id
      - id: npm-shell-profile-uname
      - id: npm-shell-profile-resolver
      - id: npm-shell-profile-processes
      - id: npm-shell-profile-base64-post
      - id: npm-shell-profile-stdin
