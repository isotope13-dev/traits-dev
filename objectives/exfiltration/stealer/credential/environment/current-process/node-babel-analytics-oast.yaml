defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: npm-postinstall-dist-analytics
    desc: Install runs compiled analytics entry
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node[[:space:]]+(\./)?dist/index[.]js([[:space:]]|$)'
  - id: node-babel-analytics-env-assignment
    desc: Analytics profile includes full environment
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'data.is_jboss = process.env.JBOSS ? process.env : process.env'
  - id: node-babel-analytics-resolve-profile
    desc: Analytics returns collected profile
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'return resolve(data)'
  - id: node-babel-analytics-get-profile
    desc: Analytics invokes profile collection
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'return getInfos()'
  - id: node-babel-analytics-await-profile
    desc: Analytics captures collected profile
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'data = _context.sent'
  - id: node-babel-analytics-send-spread
    desc: Analytics sends collected profile object
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'return collectAnalytics(_objectSpread(_objectSpread({}, data)'
  - id: node-babel-analytics-post
    desc: Analytics posts profile using Axios
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '_axios["default"].post(TRACKING_URI, data)'
  - id: node-babel-analytics-callback
    desc: Analytics target uses callback service
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'TRACKING_URI\s*=\s*"https://[A-Za-z0-9.-]+[.](oast[.](fun|live|site)|pipedream[.]net)"'
  - id: node-babel-analytics-log-call
    desc: Runs analytics on module execution
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^log\(\);\s*$'

composite_rules:
  - id: node-babel-analytics-env-oast-post
    desc: Analytics posts environment to callback
    crit: suspicious
    conf: 0.99
    scope: file
    near_bytes: 6000
    all:
      - id: metadata/package/files/runtime::npm-dist-index-entry
      - id: node-babel-analytics-env-assignment
      - id: node-babel-analytics-resolve-profile
      - id: node-babel-analytics-get-profile
      - id: node-babel-analytics-await-profile
      - id: node-babel-analytics-send-spread
      - id: node-babel-analytics-post
      - id: node-babel-analytics-callback
      - id: node-babel-analytics-log-call
  - id: npm-install-babel-analytics-env-oast-post
    desc: Install sends environment to callback
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-babel-analytics-env-oast-post
      - id: npm-postinstall-dist-analytics
