defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1041

traits:
  - id: serialized-credential-env-request-body
    desc: Serializes credential values into content
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @selected
            right: (dictionary_comprehension
              body: (pair key: (identifier) @stored_key value: (identifier) @stored_value)
              . (for_in_clause left: [(pattern_list (identifier) @key (identifier) @value)
                                      (tuple_pattern (identifier) @key (identifier) @value)]
                 right: (call function: (attribute
                   object: (attribute object: (identifier) @os attribute: (identifier) @environ)
                   attribute: (identifier) @items)))
              . (if_clause (comparison_operator
                . (string) @marker "in" . (call function: (attribute
                  object: (identifier) @checked_key attribute: (identifier) @normalize)))))))
          . (expression_statement (assignment left: (identifier) @destination
            right: (call function: (attribute
              object: (call arguments: (argument_list . (string) .))
              attribute: (identifier) @decode_target))))
          . (expression_statement (call arguments: (argument_list
            . (identifier) @target
            . (keyword_argument name: (identifier) @content
              value: (call arguments: (argument_list . (call
                function: (attribute object: (call
                  function: (attribute object: (identifier) @json attribute: (identifier) @dumps)
                  arguments: (argument_list . (identifier) @serialized))
                  attribute: (identifier) @encode))))))) @evidence))
          (#eq? @os "os") (#eq? @environ "environ") (#eq? @items "items")
          (#eq? @key @stored_key) (#eq? @key @checked_key) (#eq? @value @stored_value)
          (#match? @normalize "^(upper|lower|casefold)$")
          (#match? @marker "(?i)^['\"](token|secret|password|api_key)['\"]$")
          (#eq? @selected @serialized) (#not-eq? @selected @destination)
          (#eq? @destination @target) (#eq? @content "content")
          (#eq? @decode_target "decode")
          (#eq? @json "json") (#eq? @dumps "dumps") (#eq? @encode "encode"))

composite_rules:
  - id: httpx-credential-env-values-concealed-upload
    desc: Sends encoded credential environment values to decoded HTTPX URL
    crit: hostile
    conf: 0.99
    scope: leaf
    # Both matchers cite the call itself. Join by the same byte offset.
    near_bytes: 1
    all:
      - id: serialized-credential-env-request-body
      - id: micro-behaviors/communications/http/request/encoded::httpx-encoded-target-and-content
