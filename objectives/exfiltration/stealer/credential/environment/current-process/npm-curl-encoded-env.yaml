defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: npm-curl-env-preinstall
    desc: Preinstall runs collection script
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '^node[[:space:]]+(\./)?preinstall[.]js([[:space:]]|$)'
  - id: node-curl-env-exec
    desc: Executes command in collector
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'return execSync(cmd, { timeout: 5000 }).toString().trim()'
  - id: node-curl-env-read-unix
    desc: Collects full Unix environment
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const envData = safeExec('env')"
  - id: node-curl-env-read-win
    desc: Collects full Windows environment
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const envData = safeExec('set')"
  - id: node-curl-env-encoded-payload
    desc: Encodes environment into request body
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'payload = `env=${encodeURIComponent(envData)}&'
  - id: node-curl-env-post-command
    desc: Builds curl POST with collected body
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const cmd = `curl -X POST -d "${payload}" ${url}`'
  - id: node-curl-env-post-exec
    desc: Executes curl command
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "execSync(cmd, { stdio: 'inherit' })"
  - id: node-curl-env-url
    desc: Defines remote HTTP target
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "const url = 'http://[0-9.]+:[0-9]+'"

composite_rules:
  - id: node-curl-encoded-env-post
    desc: Posts URL-encoded full environment
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::preinstall-js-basename
      - id: node-curl-env-exec
      - id: node-curl-env-read-unix
      - id: node-curl-env-read-win
      - id: node-curl-env-encoded-payload
      - id: node-curl-env-post-command
      - id: node-curl-env-post-exec
      - id: node-curl-env-url
  - id: npm-preinstall-curl-encoded-env-post
    desc: Install posts full environment
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-curl-encoded-env-post
      - id: npm-curl-env-preinstall
