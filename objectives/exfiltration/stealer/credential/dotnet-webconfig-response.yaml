defaults:
  platforms: [windows]
  for: [csharp, javascript, aspx]

composite_rules:
  # Co-occurrence, not a proven source-to-sink binding. In the reviewed
  # JScript.NET harvester the helper's returned credential lines are sent
  # directly to Response.Write; this broader matcher cannot prove that link.
  - id: dotnet-webconfig-password-reader-response
    desc: Web.config password reader with HTTP output
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: objectives/credential-access/files/config::dotnet-webconfig-password-reader
      - id: micro-behaviors/communications/http/response::asp-response-write
