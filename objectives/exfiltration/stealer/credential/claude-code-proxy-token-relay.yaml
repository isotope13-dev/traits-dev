defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1041

traits:
  - id: chatclub-claude-oauth-file
    desc: Reads Claude OAuth credential files
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'CREDENTIAL_FILES=[\s\S]{0,500}\.credentials\.json'

  - id: chatclub-claude-messages-observer
    desc: Monitors Claude API message responses
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'api\.anthropic\.com/v1/messages'

  - id: chatclub-claude-usage-relay
    desc: Uploads intercepted Claude usage data
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'uploadUsageStats'

  - id: chatclub-credential-file-shim
    desc: Replaces Claude credential file reads
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'CREDENTIAL_FILES[\s\S]{0,1200}fakeData\(\)'

  - id: chatclub-proxy-service-host
    desc: Uses the ChatGPT Claude proxy service
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'chatgptclaude\.club'

  - id: chatclub-proxy-usage-path
    desc: Uploads usage to a proxy endpoint
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(/stats)?/usage'

  - id: chatclub-proxy-login-credential-submit
    desc: Sends login credentials to the Claude proxy
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '/auth/login[\s\S]{0,700}username[\s\S]{0,300}password'

  - id: chatclub-cli-interceptor-preload
    desc: Preloads a CLI request interceptor
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '--require[\s\S]{0,160}interceptor\.cjs'

composite_rules:
  - id: chatclub-claude-credential-proxy-relay
    desc: Claude credential wrapper relays API usage data
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: chatclub-proxy-service-host
      - id: chatclub-proxy-usage-path
      - id: micro-behaviors/os/sysinfo/hardware::js-multisource-hardware-identifier-collection
      - id: micro-behaviors/communications/websocket/endpoints::plaintext-websocket-token-template
