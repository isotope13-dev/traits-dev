# Complete browser-extension steal-and-send chain: cookie material is uploaded
# to object storage together with the user's open-tab inventory.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip, archives]
  attack: T1539,T1119,T1041

composite_rules:
  - id: extension-cookie-tab-azure-exfil
    desc: Extension exfiltrates cookies and open tabs to Azure
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/exfiltration/cloud/object-store::extension-cookie-azure-blob-exfil
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-query
  # Credential-relay session hijack: the extension reads the site's cookies,
  # talks to a bare-IP login API, then deletes the local session and implants
  # server-issued cookie values. Axios Basic-auth encoding is not a leg —
  # every HTTP client bundle carries encodeURIComponent(password).
  - id: extension-login-relay-cookie-implant
    desc: Extension relays logins to IP server, implants session cookies
    crit: hostile
    conf: 0.98
    attack: T1539,T1041,T1078
    for: [javascript, typescript, crx]
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-set
      - id: micro-behaviors/communications/http/url/endpoint::login-pwd-endpoint-path
      - id: objectives/command-and-control/infrastructure/ip::ip-address-url
