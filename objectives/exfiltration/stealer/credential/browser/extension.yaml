# Complete browser-extension steal-and-send chain: cookie material is uploaded
# to object storage together with the user's open-tab inventory.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip, archives]
  attack: T1539,T1119,T1041

composite_rules:
  - id: extension-cookie-tab-azure-exfil
    desc: Extension exfiltrates cookies and open tabs to Azure
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/exfiltration/cloud/object-store::extension-cookie-azure-blob-exfil
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-query
