defaults:
  platforms: [windows]
  for: [iso]
  attack: T1555.004,T1041

composite_rules:
  - id: iso-dotnet-vault-exfil
    desc: ISO embeds Vault-targeting .NET exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::iso-dotnet-metadata-sig
      - id: metadata/file/format/iso/payload::iso-dotnet-vault-access-cluster
      - id: metadata/file/format/iso/payload::iso-dotnet-network-output-cluster
