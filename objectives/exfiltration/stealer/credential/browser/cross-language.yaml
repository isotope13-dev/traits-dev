# Browser and wallet collection sent to a Discord webhook in script languages.
# The endpoint is deliberately modeled as a transport shape, not as any one
# campaign domain: future stealers can change hosting while retaining the flow.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1555.003,T1041,T1567.002"
  mbc: "B0028"

composite_rules:
  - id: python-browser-discord-webhook-exfiltration
    desc: Python browser data sent to Discord webhook
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/sensitive/browser::browser-sensitive-data
      - id: micro-behaviors/fs/file/open::file-read-call
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-api-path
      - id: micro-behaviors/communications/http/lib/requests::requests-post

  - id: python-browser-discord-screenshot-exfiltration
    desc: Python browser data and screenshot sent to Discord
    crit: hostile
    conf: 0.99
    attack: "T1555.003,T1113,T1041,T1567.002"
    all:
      - id: python-browser-discord-webhook-exfiltration
      - id: micro-behaviors/hardware/display/screen::pyautogui-screenshot
