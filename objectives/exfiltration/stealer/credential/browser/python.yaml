# Browser-session credential access and use. The combination below is
# specific to code that reads a browser context's cookies, evaluates page
# state, and sends requests through that authenticated context.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1539
composite_rules:
  # A dependency that reads a browser credential database and immediately
  # sends the records to an external HTTP service is the reusable ChocoPoC
  # technique. Keep the conclusion on structural evidence (database/table,
  # transport, and import-time execution), not on a package or family name.
  # The browser-store path is an alternative because Chromium and compatible
  # browsers use different profile layouts across Unix and Windows.
  - id: python-browser-store-http-exfil
    desc: Python browser credential store HTTP exfiltration
    crit: hostile
    conf: 0.99
    mbc: B0028
    attack: T1555.003,T1041,T1195.002
    all:
      - id: objectives/credential-access/browser/chromium::browser-creds-table-sql
      - id: micro-behaviors/communications/http/request/client::python-structured-post-transport
      - id: micro-behaviors/data/control-flow/module-exec::try-wrapped-module-call
    any:
      - id: micro-behaviors/fs/path/sensitive/browser::login-data
      - id: micro-behaviors/fs/path/sensitive/browser::browser-cookies-file-path

  # General-purpose Windows stealers normally run as applications rather than
  # import-time package hooks. Reading Chromium's credential tables, unsealing
  # the profile key with DPAPI, and sending a structured POST is a complete
  # steal-and-send chain without relying on a family name or destination IOC.
  - id: python-dpapi-browser-secret-http-exfil
    desc: Python exfiltrates DPAPI-decrypted browser secrets
    crit: hostile
    conf: 0.99
    mbc: B0028
    attack: T1555.003,T1539,T1041
    platforms: [windows]
    all:
      - id: objectives/credential-access/browser/chromium::browser-creds-table-sql
      - id: objectives/credential-access/browser/chromium::python-dpapi-browser-decrypt
      - id: micro-behaviors/communications/http/request/client::python-structured-post-transport

  # The article describes a RAT rather than a one-shot dumper. Shell=True
  # with a variable command is the precise command-execution primitive; the
  # browser-store and outbound-transport legs above supply the malicious
  # context needed for a hostile conclusion.
  - id: python-browser-rat-command-channel
    desc: Python browser stealer with shell command execution
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1555.003,T1041
    all:
      - id: python-browser-store-http-exfil
      - id: micro-behaviors/process/create/subprocess::variable-command-shell-true
      - id: micro-behaviors/process/create/subprocess::process-execution

  # Reading cookies from a Playwright context the script itself drives, reusing
  # them via context.request, and evaluating JS on the page is ordinary
  # session-aware automation (QA suites, scrapers, AI-agent browsers) — the
  # script already owns that browser. Credential THEFT means harvesting another
  # browser's on-disk store (Chrome Cookies/Login Data + DPAPI/keychain) or
  # shipping the cookies to an external endpoint; those legs carry the hostile
  # verdict. On its own this is a notable session-handling capability.
  - id: python-browser-session-cookie-transport
    desc: Uses browser session cookies for authenticated HTTP transport
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/cookies::playwright-browser-context-cookie-read
      - id: micro-behaviors/communications/http/request/client::python-browser-context-request
      - id: micro-behaviors/process/create/script/automation::playwright-page-evaluate
    near_bytes: 8192
  - id: python-cookie-material-telegram-export
    desc: Exports session-cookie material through Telegram messaging
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [whl, python-sdist]
    attack: "T1539,T1567.002"
    all:
      - id: micro-behaviors/communications/messaging/send::python-cookie-material-to-telegram-call
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/messaging/send::chat-send-message
