# Compiled Windows stealers that read another browser's cookie store and ship
# what they find over HTTP.
#
# Every other file in this directory covers a scripted stealer -- batch, shell,
# Python, Java, JavaScript -- but the commodity families (Vidar, Raccoon,
# RedLine, Lumma, and the OutBrowse-era bundlers before them) are native PEs,
# and a compiled binary doing the same thing had no rule here at all.
#
# Two halves, both required:
#
#   source    -- Firefox's cookies.sqlite or places.sqlite opened out of a
#                profile directory and queried with SQL. A program reading a
#                *different* product's cookie database is already outside its
#                own data; a password manager reads its own store, and a
#                browser reads its own profile without SQL string constants
#                for moz_cookies.
#   transport -- a complete WinHTTP request/response flow, plus a host
#                fingerprint (MAC address) placed in the outbound query string.
#
# The fingerprint parameter is what separates this from a browser-import or
# migration utility: an importer moves cookies into local storage and has no
# reason to identify the machine to a server. Collection plus transport plus
# host identity is the stealer shape.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1539,T1041
  mbc: B0028

composite_rules:
  - id: native-browser-cookie-http-exfil
    desc: Native binary sends browser cookie data over HTTP
    crit: hostile
    conf: 0.96
    attack: T1539,T1041,T1555.003
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow
      - id: micro-behaviors/communications/http/telemetry::hardware-address-report-parameter
    any:
      - id: objectives/credential-access/browser/firefox::cookie-query-comp
      - id: objectives/collection/activity/browser::firefox-history-harvest
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/browser/
