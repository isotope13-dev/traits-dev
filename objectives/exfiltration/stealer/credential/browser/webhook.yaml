defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, unix]
  for: [pe, python, pyc, javascript]
  attack: T1041

traits:
composite_rules:
  - id: copied-browser-store-discord-webhook-exfiltration
    desc: Copied browser credential stores exfiltrated to Discord webhook
    all:
      - id: objectives/collection/stealer/browser::browser-store-copy-operation
      - id: objectives/exfiltration/messaging/webhook::discord-exfiltration
  - id: browser-credentials-discord-webhook
    for: [pe, python, javascript]
    desc: Browser credentials exfiltrated to Discord webhook
    all:
      - id: objectives/credential-access/browser/multi-target::hostile-browser-stealer
      - id: objectives/exfiltration/messaging/webhook::discord-exfiltration
  - id: llm-directed-browser-credential-webhook-exfiltration
    for: [go]
    desc: Autonomous LLM implant exfiltrates browser credentials by webhook
    crit: hostile
    conf: 0.995
    attack: T1555.003,T1041,T1567.004
    all:
      - id: objectives/execution/automation/autonomous::autonomous-offensive-llm-capability-dispatch
      - id: objectives/credential-access/browser/chromium::logins-table
      - id: micro-behaviors/communications/http/webhook::generic-webhook-url
      - id: micro-behaviors/communications/http/post::http-post
    any:
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/data/encode/base64::go-base64-encode-call
    near_bytes: 7000
