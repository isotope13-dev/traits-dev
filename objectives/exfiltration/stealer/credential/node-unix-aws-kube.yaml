defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-keychain-aws-exfil
  desc: Node keychain AWS exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/url/endpoint::node-exfil-endpoint
  any:
  - id: micro-behaviors/os/security/keychain::macos-keychain-dump-command
  - id: objectives/credential-access/cloud/aws-token::node-aws-credential-file-read
  needs: 1
- id: node-multi-credential-collection-webhook
  desc: Node collects cloud and SSH credentials for webhook exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/cloud/aws-token::node-aws-credential-file-read
  - id: objectives/credential-access/cloud/token/files::azure-config
  - id: objectives/credential-access/cloud/container::node-kubeconfig-readfile
  - id: objectives/credential-access/ssh/key::node-ssh-key-read-loop
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
