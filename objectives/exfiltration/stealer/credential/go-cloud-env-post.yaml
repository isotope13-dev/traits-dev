defaults:
  platforms: [unix]
  for: [go, elf]
  attack: T1552.001

composite_rules:
  - id: go-cloud-env-credential-exfil
    desc: Go cloud env credential exfil
    crit: hostile
    conf: 0.98
    for: [go]
    all:
      - id: micro-behaviors/os/env/cloud::azure-tenant-client-secret-env-names
      - id: objectives/exfiltration/http/report::go-postdata-credential
    any:
      - id: objectives/credential-access/cloud/local-credentials::go-root-cloud-cred-files
      - id: objectives/credential-access/env/harvesting::go-proc-environ-token-scan
  - id: go-binary-cloud-env-credential-exfil
    desc: Go binary cloud credential exfiltration
    crit: hostile
    conf: 0.98
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: micro-behaviors/os/env/cloud::azure-tenant-client-secret-env-names
      - id: objectives/exfiltration/http/report::go-postdata-credential
    any:
      - id: objectives/credential-access/cloud/local-credentials::go-root-cloud-cred-files
      - id: objectives/credential-access/env/harvesting::go-proc-environ-token-scan
