defaults:
  platforms: [unix]
  for: [kotlin]

composite_rules:
  - id: kotlin-env-filter-collect-cooccurrence
    desc: Password env filter and binary collect endpoint
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/env/secret-name::kotlin-password-env-key-filter
      - id: objectives/exfiltration/http/collect::jvm-collect-octet-post
