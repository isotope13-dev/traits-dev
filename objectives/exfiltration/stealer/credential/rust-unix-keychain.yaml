defaults:
  platforms: [unix]
  for: [rust, macho, elf]
  attack: T1041

composite_rules:
  - id: rust-secrets-with-ingest-endpoint
    desc: "Rust secrets with ingest endpoint"
    crit: hostile
    conf: 0.98
    # rust-ureq-post-call is `type: text` on ureq API-call *syntax*, which
    # doesn't survive compilation -- it can never co-occur with rust-binary
    # (a compiled-artifact-only fact) on one node. Dropped in favor of the
    # already-compiled-binary-proven ingest-api-path leg (same shape as the
    # working sibling rust-monitor-credential-exfil below).
    for: [elf, macho]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: micro-behaviors/communications/http/url/telemetry::ingest-api-path
    any:
      - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-var
      - id: micro-behaviors/fs/path/credential::rust-platform-secret-files
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-command-reference
    needs: 1
  - id: rust-ureq-secret-http-export
    desc: "HTTP POST with secret-source clues"
    crit: hostile
    conf: 0.98
    # rust-ureq-post-call only matches Rust source syntax, and no compiled-
    # binary equivalent exists for ureq specifically (unlike the generic
    # ingest-api-path atom used elsewhere in this file) -- rust-binary (a
    # compiled-artifact-only fact) can never co-occur with it, so this stays
    # a source-level (crate/tarball) detection.
    for: [rust]
    all:
      - id: micro-behaviors/communications/http/post::rust-ureq-post-call
    any:
      - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-var
      - id: micro-behaviors/fs/path/credential::rust-platform-secret-files
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-command-reference
      - id: micro-behaviors/os/security/keychain::rust-dump-keychain-command
    needs: 1
  - id: rust-secret-stores-with-ingest-endpoint
    for: [elf]
    desc: "Rust secret stores with ingest endpoint"
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: micro-behaviors/communications/http/url/telemetry::ingest-api-path
    any:
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-command-reference
      - id: micro-behaviors/os/security/keychain::rust-dump-keychain-command
      - id: micro-behaviors/fs/path/password-store::login-data
    needs: 1
    unless:
      - id: well-known/app/browser/microsoft-edge::microsoft-edge-package-context
