defaults:
  for:
  - javascript
  attack: T1539,T1552.001,T1041
  platforms:
  - unix
  - windows
traits:
- id: browser-auth-storage-cookie-capture
  desc: Collects cookies and local storage tokens
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /document\.cookie/s
          $b0_1 = /Object\.keys\s*\(\s*localStorage\s*\)/s
          $b0_2 = /localStorage\.getItem\s*\(/s
          $b0_3 = /(auth0|token)/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 500 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 500 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 300 and
                    true
                  )
                )
              )
            )
          )
      }
- id: browser-base64-evidence-navigation
  desc: Navigates to URL with encoded evidence
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /https?:\/\/[^"'\s]+\?data=["']\s*\+\s*encodeURIComponent\s*\(\s*btoa\s*\(\s*JSON\.stringify\s*\(/s
          $b0_1 = /window\.location\.href\s*=/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 500 and
                true
              )
            )
          )
      }
composite_rules:
- id: browser-auth-evidence-callback-navigation
  desc: Sends browser cookies and tokens through callback navigation
  crit: hostile
  conf: 0.99
  scope: file
  near_bytes: 4000
  all:
  - id: objectives/exfiltration/stealer/credential/browser-record::browser-auth-storage-cookie-capture
  - id: objectives/exfiltration/stealer/credential/browser-record::browser-base64-evidence-navigation
