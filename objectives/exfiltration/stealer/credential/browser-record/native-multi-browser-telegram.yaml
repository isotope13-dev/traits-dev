# The sensitive source, recovery operation and outbound upload each have a
# required role. A Telegram bot or local browser importer alone cannot match.
# References indicate the exfiltration chain, not a successful transmission.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-multi-browser-telegram-upload
    desc: Multi-browser credential decryption with Telegram file-upload APIs
    crit: hostile
    conf: 0.96
    attack: T1555.003,T1567
    all:
      - id: objectives/credential-access/browser/recovery::multi-browser-store-decryption
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
      - id: micro-behaviors/communications/http/upload/multipart::multipart-form-data-upload
