# Cross-platform and native Chromium Login Data + Local State key access
# paired with outbound HTTP POST exfiltration (covers stealers that upload
# raw Login Data + decrypted DPAPI/key material for server-side parsing as
# well as inline decryptors).
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, pe, dll, elf, macho]
  size_max: 25000000
  attack: T1555.003,T1041

composite_rules:
  - id: chromium-login-key-material-access
    desc: Accesses Chromium Login Data alongside Local State key material
    crit: component
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/application/browser/profile::local-state
      - id: micro-behaviors/fs/read/file
    any:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/os/security/dpapi::dpapi-with-chromium-login-data-reference
      - id: micro-behaviors/data/config/schema::encrypted-key-field-reference

  - id: chromium-login-http-post-channel
    desc: Outbound HTTP POST channel with JSON or binary request flow
    crit: component
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/request/client::http-client-capability
      - id: native-winhttp-post-flow

  - id: native-winhttp-post-flow
    desc: Native WinHTTP client flow with HTTP POST method
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [pe, dll, c, cpp]
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
    any:
      - id: micro-behaviors/communications/http/post::post-string-pe-wide
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token

  - id: chromium-login-key-http-post-exfil
    desc: Reads Chromium Login Data and Local State key material with HTTP POST upload
    crit: hostile
    conf: 0.98
    all:
      - id: chromium-login-key-material-access
      - id: chromium-login-http-post-channel
    any:
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
    unless:
      - id: well-known/lib/ui/cef::cef-browser-engine
      - id: well-known/app/system/microsoft/platform::microsoft-signed-edge-runtime-context
      - id: well-known/tool/detection/tirith::tirith-cli-binary-marker
