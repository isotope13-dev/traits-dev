# Native imports and decoded paths establish coherent acquisition/upload clues,
# not a proven binding between a copied credential database and the request.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-browser-record-upload-cleanup-clues
    desc: Browser-store APIs beside Telegram upload and self-delete references
    crit: suspicious
    conf: 0.94
    attack: T1567,T1070.004
    all:
      - id: objectives/credential-access/browser/multi-target::native-browser-store-copy-dpapi-clues
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
      - id: micro-behaviors/fs/delete/file/self::batch-self-delete
