defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]
  attack: T1555.003

composite_rules:
- id: java-browser-credential-exfil
  desc: Java browser credential exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/password-store::java-browser-login-stores
  - id: micro-behaviors/fs/read/file/full::java-readallbytes
  any:
  - id: micro-behaviors/communications/http/url/endpoint::raw-exfil-post-path
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source

