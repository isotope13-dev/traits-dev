defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]
  attack: T1555.003

composite_rules:
- id: java-browser-credential-exfil
  desc: Java browser credential exfil
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/fs/path/password-store::jvm-browser-login-store-path
  - id: micro-behaviors/fs/read/file/content/unspecified::java-readallbytes
  any:
  - id: micro-behaviors/communications/http/request/collect::raw-exfil-post-path
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode

