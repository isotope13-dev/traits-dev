composite_rules:
- platforms:
  - unix
  for:
  - shell
  attack: T1555.003
  id: shell-browser-credential-exfil
  desc: Shell browser credential exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/application/browser::shell-legacy-browser-profiles
  - id: micro-behaviors/fs/path/password-store::shell-browser-secret-files
  - id: objectives/exfiltration/http/report::shell-browser-creds-post
