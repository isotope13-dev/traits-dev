# Infostealers often extract Chrome saved-login rows with SQL, write them to a
# report or archive, and send that file to an operator's Telegram bot. The raw
# store never appears in the request body, so the store-upload flow rule does
# not see it. Forensic and migration tools query the same tables but have no
# reason to push documents to a Telegram bot. Co-occurrence in one file, not
# proven data flow; no token, chat ID, filename or archive format is required.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1555.003,T1567

composite_rules:
  - id: python-chromium-login-query-telegram-upload
    desc: Queries Chrome logins; uploads files to Telegram
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: objectives/credential-access/browser/chromium::chromium-profile-credential-query
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
