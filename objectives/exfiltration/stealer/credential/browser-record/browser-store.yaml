defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-browser-store-multipart-upload
    desc: Uploads browser credential store over HTTP
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1041
    all:
      - id: micro-behaviors/communications/http/request/credential-body-flow::python-browser-store-multipart-upload
    any:
      - id: micro-behaviors/fs/path/password-store::firefox-logins-json-target
      - id: micro-behaviors/fs/path/password-store::login-data
