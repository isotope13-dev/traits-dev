defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  attack: T1059.004,T1555.003,T1041
  mbc: E1055,E1041
traits:
- id: bip40-remote-run-command
  desc: Contains quoted !run text
  crit: component
  conf: 0.99
  if:
    type: text
    regex: '["'']!run\b'
- id: bip40-remote-file-command
  desc: Contains quoted !sendfile text
  crit: component
  conf: 0.99
  if:
    type: text
    regex: '["'']!sendfile\b'
composite_rules:
- id: discord-command-browser-collection
  desc: Discord bot runs commands and collects browser data
  crit: hostile
  conf: 0.98
  for: [javascript]
  scope: file
  all:
  - id: micro-behaviors/communications/http/services/discord::discord-js-library-reference
  - id: micro-behaviors/communications/messaging/receive::discord-message-create-handler
  - id: bip40-remote-run-command
  - id: bip40-remote-file-command
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/fs/path/credential/password-store::chrome-browser-data-reference
  - id: micro-behaviors/hardware/display/screenshot/reference::screenshot-desktop-call
- id: npm-bip40-discord-browser-rat
  desc: Postinstall Discord RAT steals browser and environment data
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - npm
  - zip
  - tar
  - javascript
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/http/services/discord::discord-js-library-reference
  - id: micro-behaviors/communications/messaging/receive::discord-message-create-handler
  - id: objectives/exfiltration/stealer/credential/browser-record::bip40-remote-run-command
  - id: objectives/exfiltration/stealer/credential/browser-record::bip40-remote-file-command
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/fs/path/credential/password-store::chrome-browser-data-reference
  - id: micro-behaviors/fs/path/credential/collection::any-credential-path
  - id: well-known/lib/media/screenshot::screenshot-desktop-require-path
