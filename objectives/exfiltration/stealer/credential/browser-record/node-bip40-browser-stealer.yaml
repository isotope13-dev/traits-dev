defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  attack: T1059.004,T1555.003,T1041
  mbc: E1055,E1041
traits:
- id: bip40-remote-run-command
  desc: Contains a remote command-execution bot command
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '!run\b'
- id: bip40-remote-file-command
  desc: Contains a remote file-transfer bot command
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '!sendfile\b'
- id: bip40-discord-message-command-handler
  desc: Handles incoming Discord bot messages
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((call_expression
        function: (member_expression property: (property_identifier) @method)
        arguments: (arguments
          . (string (string_fragment) @event)
          . (_)))
        (#eq? @method "on")
        (#eq? @event "messageCreate"))
composite_rules:
- id: discord-command-browser-collection
  desc: Discord bot runs commands and collects browser data
  crit: hostile
  conf: 0.98
  for: [javascript]
  scope: file
  all:
  - id: micro-behaviors/communications/http/services/discord::discord-js-library-reference
  - id: bip40-discord-message-command-handler
  - id: bip40-remote-run-command
  - id: bip40-remote-file-command
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/fs/path/password-store::chrome-browser-data-reference
  - id: micro-behaviors/hardware/display/screenshot/unspecified::screenshot-desktop-call
- id: npm-bip40-discord-browser-rat
  desc: Postinstall Discord RAT steals browser and environment data
  crit: hostile
  conf: 0.995
  scope: archive
  for:
  - npm
  - zip
  - tar
  - javascript
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/http/services/discord::discord-js-library-reference
  - id: objectives/exfiltration/stealer/credential/browser-record::bip40-discord-message-command-handler
  - id: objectives/exfiltration/stealer/credential/browser-record::bip40-remote-run-command
  - id: objectives/exfiltration/stealer/credential/browser-record::bip40-remote-file-command
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/fs/path/password-store::chrome-browser-data-reference
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: well-known/lib/media/screenshot::screenshot-desktop-import
