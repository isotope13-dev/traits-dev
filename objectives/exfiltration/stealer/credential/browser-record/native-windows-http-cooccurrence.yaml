defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003

composite_rules:
  - id: native-chromium-login-and-winhttp
    desc: Chromium login decryption co-occurs with WinHTTP
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/credential-access/browser/chromium::browser-credential-store-decryption-api-set
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
