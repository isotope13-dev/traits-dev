defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003

composite_rules:
  - id: native-chromium-login-and-winhttp
    desc: Chromium login decryption co-occurs with WinHTTP
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/credential-access/browser/chromium::browser-credential-store-decryption-api-set
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table

  - id: native-multi-store-credential-http-post-exfil
    desc: Native PE harvests browser, mail, and FTP credentials with HTTP POST
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1552.001,T1041
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/header/content-type::pe-octet-stream-content-type
      - id: objectives/credential-access/browser/firefox::native-nss-mozilla-filezilla-store-targets
    any:
      - id: objectives/credential-access/registry/access::outlook-express-account-password-harvest
      - id: micro-behaviors/os/security/protected-storage::pstore-password-category-factory
      - id: micro-behaviors/os/registry/credential/reference::far-manager-ftp-hosts-key
      - id: micro-behaviors/os/registry/credential/reference::flashfxp-client-key
      - id: micro-behaviors/os/registry/credential/reference::total-commander-client-key
    needs: 2
    unless:
      - id: metadata/signature/verified/platform/
