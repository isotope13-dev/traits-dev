# The Android Chrome cookie and login containers are credential stores of
# another app's private storage; collecting them and shipping the reads is
# the credential-stealer shape. Proximity ties the store list to the upload;
# it does not prove which bytes the POST body carried.
defaults:
  platforms: [android, unix]
  for: [c, cpp, javascript, typescript, python, go]
  attack: T1555.003,T1041

composite_rules:
  - id: android-chromium-credential-store-read-upload
    desc: Android Chrome credential stores read near an HTTP POST body
    crit: hostile
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/application/browser/storage::android-chromium-secret-store-path
      - id: micro-behaviors/fs/read/file/content/unspecified::source-file-content-read-api
      - id: micro-behaviors/communications/http/upload/body::source-http-body-send
