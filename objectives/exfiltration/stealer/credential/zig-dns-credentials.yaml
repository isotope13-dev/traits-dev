# Encoded bytes are only called DNS exfiltration here when the same source file
# reads a credential artifact, hex-encodes bytes, constructs a dotted label,
# and submits that label to a resolver. None of those capabilities alone is an
# objective.
defaults:
  platforms: [linux, macos, windows]
  for: [zig]
  attack: T1048.003

composite_rules:
- id: zig-text-credential-dns-exfil
  for: [zig, tar, gz, zip]
  desc: Zig package hex-encodes credentials into DNS labels
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: micro-behaviors/fs/path/credential::zig-resolver-credential-path-proximity
  - id: micro-behaviors/data/format/string::zig-hex-label-format-reference
  any:
  - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  needs: 1

- id: source-hex-credential-dns-exfil
  desc: Hex-encoded credentials leave through DNS labels
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/communications/dns/resolver::zig-get-address-list
  - id: micro-behaviors/communications/dns/label::zig-dotted-pair-format
  - id: micro-behaviors/data/encode/hex::manual-lowercase-byte-hex-encoder
  - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
