# Generic private-key credential collection and HTTP exfiltration signals.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1041"
  mbc: "B0030"
traits: []
composite_rules:
  - id: js-private-key-env-http-exfiltration
    desc: Private-key environment value in HTTP body
    crit: hostile
    conf: 0.98
    near_lines: 120
    all:
    - id: micro-behaviors/os/env/ssh::javascript-private-key-environment-variable
    - id: micro-behaviors/data/serialize/json::js-private-key-json-field
    - id: micro-behaviors/communications/http/request/client::http-client-usage
    any:
    - id: micro-behaviors/communications/http/request/verb::post-method-text
    - id: micro-behaviors/communications/http/post/
    - id: micro-behaviors/communications/http/request/body::request-write-call
    unless:
      - id: micro-behaviors/communications/http/services/github::github-app-installation-token-api
      - id: objectives/credential-access/env/secrets/source-control::github-app-private-key
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/

        - id: "metadata/file/naming::test-directory-component"
  - id: js-private-key-input-and-request-field
    desc: Private-key input paired with a request field
    crit: notable
    conf: 0.98
    all:
    - id: micro-behaviors/ui/controls/credential::private-key-entry-label
    - id: micro-behaviors/data/serialize/json::js-private-key-json-field

  - id: js-private-key-http-exfiltration
    desc: User-entered private key sent to a remote HTTP endpoint
    crit: hostile
    conf: 0.99
    near_lines: 120
    all:
    - id: js-private-key-input-and-request-field
    - id: objectives/exfiltration/sensitive-data/source::js-remote-http-post-json
