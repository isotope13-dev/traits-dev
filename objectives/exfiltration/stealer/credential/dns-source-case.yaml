defaults:
  platforms: [linux, macos, windows]
  for: [csharp, java, kotlin, elixir, ruby, zig, c, cpp, swift]
  attack: T1048.003
  conf: 0.97

composite_rules:
  - id: source-dns-case-credential-exfil
    desc: Source encodes credentials in DNS casing
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/dns/lookup::source-dns-query-api
      - id: micro-behaviors/data/string/case::source-case-transform
      - id: micro-behaviors/data/arithmetic::lsb-bit-mask-source
    any:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
      - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/credential::credential-path-segment
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: micro-behaviors/process/create/spawn::start
