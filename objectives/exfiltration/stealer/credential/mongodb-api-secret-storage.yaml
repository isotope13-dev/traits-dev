defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: mongoose-remote-database-connect
    desc: Connects to package-configured MongoDB URI
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.connect\s*\(\s*mongo\w+'

  - id: charcode-decoded-database-endpoint
    desc: Decodes numeric characters into a string
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'String\.fromCharCode\s*\('

  - id: client-api-secrets-in-database-record
    desc: Stores caller API credentials in a record
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'apiuser\s*:\s*this\.\w+.{0,100}key\s*:\s*this\.\w+'

composite_rules:
  - id: embedded-mongodb-api-credential-exfiltration
    desc: Stores client API credentials in an embedded remote MongoDB
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential::mongoose-remote-database-connect
      - id: objectives/exfiltration/stealer/credential::client-api-secrets-in-database-record
      - id: objectives/exfiltration/stealer/credential::charcode-decoded-database-endpoint
