# Client API credential harvesting into an embedded MongoDB endpoint.
#
# The family shape collects caller credentials into a record literal, then
# persists them into a MongoDB the package reaches by its own embedded
# (often charcode-obfuscated) URI. The composite therefore requires the
# harvested record AND evidence that a destination exists: a MongoDB write
# of the record, or an embedded remote MongoDB URI in the same file. A bare
# `mongoose.connect(mongoURI)` beside the record names no destination and
# is ordinary application code; it does not satisfy this composite.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: caller-apiuser-key-credential-record
    desc: Caller apiuser and key record literal
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'apiuser\s*:\s*this\.\w+.{0,100}key\s*:\s*this\.\w+'

composite_rules:
  - id: embedded-mongodb-api-credential-exfiltration
    desc: Client API keys stored in embedded MongoDB
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential::caller-apiuser-key-credential-record
      # The package connects to the MongoDB endpoint it stores into; the
      # driver-level connect alongside the harvested record is the family's
      # runtime shape.
      - id: micro-behaviors/data/db/mongodb::mongoose-client-connect
    any:
      # The store and the destination. insertOne/insertMany and the
      # update/replace calls are the Mongo driver writes; the URI schemes are
      # the embedded remote endpoint the harvested record is sent to.
      - id: micro-behaviors/data/db/mongodb::mongodb-insert-write
      - id: micro-behaviors/data/db/mongodb::mongodb-update-write
      - id: micro-behaviors/data/db/mongodb::mongodb-replace-write
      - id: micro-behaviors/data/db/mongodb::mongodb-url
      - id: micro-behaviors/data/db/mongodb::mongodb-srv-url
      - id: micro-behaviors/data/db/mongodb::credentialed-mongodb-url
