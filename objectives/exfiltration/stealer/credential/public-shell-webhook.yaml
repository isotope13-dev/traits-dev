defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041
composite_rules:
  - id: python-public-shell-credentials-webhook
    desc: Build hook sends public-shell access credentials
    crit: hostile
    conf: 0.98
    # Credential sharing can be intentional in a debugging utility. The
    # build-hook trigger supplies the unauthorized installation context.
    all:
      - id: metadata/build/package/recipe/setup-hooks::hatch-build-hook-interface
      - id: metadata/build/package/recipe/setup-hooks::hatch-build-hook-initialize
      - id: objectives/command-and-control/channel/tunnel/relay::python-ttyd-quick-tunnel-remote-shell
      - id: micro-behaviors/communications/http/request/json::python-url-credentials-json-send
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/verb::python-post-method-keyword
