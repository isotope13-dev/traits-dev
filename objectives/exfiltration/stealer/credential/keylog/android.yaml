# Android Accessibility keylogging becomes exfiltration when contextualized
# text-change records are sent over a live WebSocket channel. This uses Android
# APIs and transport mechanics rather than malware-family command names.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1056.001,T1041,T1417.001
  mbc: B0015

composite_rules:
  - id: android-accessibility-keylog-websocket-exfil
    desc: Accessibility keylogger sends contextualized input over WebSocket
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/collection/keylog/capture::android-accessibility-text-event-keylogging
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-send
