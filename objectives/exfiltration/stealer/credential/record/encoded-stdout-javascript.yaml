defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1552,T1027

traits:
  - id: javascript-encoded-secret-records-to-stdout
    desc: Logs encoded regex-selected secret records
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((_ (lexical_declaration
              (variable_declarator name: (identifier) @records
                value: (call_expression function: (member_expression
                  property: (property_identifier) @match)
                  arguments: (arguments . (regex) @pattern .))))
            . (comment)*
            . (expression_statement
                (call_expression function: (member_expression
                  object: (identifier) @console property: (property_identifier) @log)
                  arguments: (arguments .
                    (call_expression function: (member_expression
                      object: (call_expression function: (member_expression
                        object: (identifier) @buffer property: (property_identifier) @from)
                        arguments: (arguments .
                          (call_expression function: (member_expression
                            object: (identifier) @used property: (property_identifier) @join)
                            arguments: (arguments . (string) .)) .))
                      property: (property_identifier) @encode)
                      arguments: (arguments . (string (string_fragment) @base64) .)) .)))) @evidence
          (#eq? @match "match")
          (#match? @pattern "value.{1,60}isSecret[^a-zA-Z0-9]{1,12}true")
          (#eq? @records @used)
          (#eq? @console "console") (#eq? @log "log")
          (#eq? @buffer "Buffer") (#eq? @from "from")
          (#eq? @join "join") (#eq? @encode "toString")
          (#eq? @base64 "base64"))
