# A PHP plugin that selects WordPress account password hashes from the users
# table and also sends HTTP requests. The read is a credential record and the
# request is the carrier, but this file does not show that the hashes reach
# the request, so the finding stays suspicious. Plugins that manage accounts
# can select the same column for a benign check.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552

composite_rules:
  - id: php-wordpress-user-hash-with-request
    desc: PHP reads WordPress password hashes beside an HTTP request
    crit: suspicious
    conf: 0.9
    near_lines: 200
    all:
      - id: micro-behaviors/data/db/query::wordpress-password-hash-column-reference
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
