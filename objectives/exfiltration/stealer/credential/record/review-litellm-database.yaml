composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  id: litellm-provider-database-http-export
  desc: Exports queried LiteLLM provider secrets
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1041
  all:
  - id: micro-behaviors/data/db/query::litellm-credential-values-query
  any:
  - id: micro-behaviors/communications/http/request/credential-body-flow::python-litellm-credentials-json-body
  - id: micro-behaviors/communications/http/request/credential-body-flow::node-litellm-credentials-fetch-body
  - id: micro-behaviors/communications/http/request/credential-body-flow::python-litellm-credentials-data-body
  - id: micro-behaviors/communications/http/request/credential-body-flow::node-litellm-credentials-axios-body
