defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
- id: vm-gated-pstore-password-report-post
  desc: VM-gated PStore reports beside HTTP POST sender
  crit: hostile
  conf: 0.98
  attack: T1555,T1041,T1497.001
  # A recovery utility may enumerate PStore and format credentials. This
  # additional profile requires VM probes that gate an early return and a
  # native formatted POST sender, as well as three credential report formats.
  # These are co-occurring capabilities, not a proved network dataflow.
  all:
  - id: micro-behaviors/os/security/protected-storage::x86-pstore-enumerate-read-wrappers
  - id: micro-behaviors/data/format/credentials::pstore-pass-sites-report-label
  - id: micro-behaviors/data/format/credentials::pstore-autocomplete-password-report-label
  - id: micro-behaviors/data/format/credentials::username-password-report-format
  - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
  - id: micro-behaviors/communications/http/direct-socket::x86-formatted-post-buffer-send
  - id: objectives/anti-analysis/vm-detect/instruction::x86-virtualpc-vmware-early-return
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/siw::siw-family-identity
- id: pstore-form-post-exfil
  desc: PStore report co-occurs with form POST sender
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/keychain/extract::pstore-password-report-acquisition
  - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
  - id: micro-behaviors/communications/http/direct-socket::x86-formatted-post-buffer-send
  any:
  - id: micro-behaviors/communications/url/http-scheme::http-url-shaped-text
  - id: micro-behaviors/communications/http/client/wininet::internet-open-url-a-name
  - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe-with-networking
  unless:
  - id: metadata/signed/platform/
  - id: objectives/exfiltration/stealer/credential/record::pstore-password-report-form-post-exfil
- id: pstore-password-report-form-post-exfil
  desc: Autorun worm PStore reports co-occur with POST sender
  crit: hostile
  conf: 0.99
  attack: T1041,T1555
  all:
  - id: objectives/credential-access/keychain/extract::pstore-password-report-acquisition
  - id: micro-behaviors/data/format/credentials::username-password-report-format
  - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
  - id: micro-behaviors/communications/http/direct-socket::x86-formatted-post-buffer-send
  any:
  - id: micro-behaviors/communications/url/http-scheme::http-url-shaped-text
  - id: micro-behaviors/communications/http/client/wininet::internet-open-url-a-name
  - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/siw::siw-family-identity
