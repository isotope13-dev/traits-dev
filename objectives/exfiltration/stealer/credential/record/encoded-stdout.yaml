# Bind the secret selector, encoder and printed substitution result. A literal
# URL, script filename, variable name or workflow annotation is not required.
defaults:
  for: [shell]
  platforms: [unix, windows]
  attack: T1552,T1027

traits:
  - id: shell-encoded-secret-records-to-stdout
    desc: Prints Base64-encoded secret records to stdout
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (variable_assignment
              name: (variable_name) @assigned
              value: (command_substitution
                (pipeline
                  (command name: (command_name (word) @filter)
                    . argument: (word) @options
                    . argument: [(raw_string) (string)] @pattern !redirect .)
                  . (command name: (command_name (word) @sort)
                      argument: (word) @unique !redirect)?
                  . (command name: (command_name (word) @encoder) !redirect) @encode
                  . (command name: (command_name (word) @outer) !redirect)? @second
                  .)))
            . (comment)*
            . [
              (command name: (command_name (word) @output)
                . argument: [
                    (simple_expansion (variable_name) @used)
                    (expansion (variable_name) @used)
                    (string . [(simple_expansion (variable_name) @used)
                               (expansion (variable_name) @used)] .)]
                !redirect .)
              (command name: (command_name (word) @formatted_output)
                . argument: [(raw_string) (string)] @format
                . argument: [
                    (simple_expansion (variable_name) @used)
                    (expansion (variable_name) @used)
                    (string . [(simple_expansion (variable_name) @used)
                               (expansion (variable_name) @used)] .)]
                !redirect .)]) @evidence
          (#eq? @filter "grep")
          (#match? @options "^-[a-zA-Z]*o[a-zA-Z]*$")
          (#not-match? @options "[vfqclL]")
          (#match? @pattern "value.{1,60}isSecret[^a-zA-Z0-9]{1,12}true")
          (#eq? @sort "sort") (#eq? @unique "-u")
          (#eq? @encoder "base64") (#eq? @outer "base64")
          (#match? @encode "^base64(\\s+(-[wb]\\s*[0-9]+|--wrap[= ][0-9]+))?\\s*$")
          (#match? @second "^base64(\\s+(-[wb]\\s*[0-9]+|--wrap[= ][0-9]+))?\\s*$")
          (#eq? @assigned @used)
          (#match? @output "^(echo|printf)$")
          (#eq? @formatted_output "printf")
          (#match? @format "^[\"']%[sb](\\\\n)?[\"']$"))
    unless:
      - type: symbol
        kind: function
        exact: echo
      - id: metadata/lang/source/declaration::shell-printf-function
      - id: metadata/file/function::shell-grep-function-name-symbol
      - id: metadata/file/function::shell-base64-function-name-symbol
