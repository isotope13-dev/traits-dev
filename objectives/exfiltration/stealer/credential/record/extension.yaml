defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, xpi, crx]
  attack: T1041
  mbc: B0028

composite_rules:
  # This detects stealers reading the installed wallet stores, rather than a
  # malicious browser extension. Stable extension IDs identify the targeted
  # products; the profile path, archive creation, and upload establish theft.
- id: wallet-extension-archive-http-exfiltration
  desc: Archives multiple browser wallet extension stores and uploads them
  conf: 0.99
  attack: "T1555.003,T1560.001,T1041"
  for: [scripts, binaries]
  scope: file
  near_lines: 240
  all:
  - id: micro-behaviors/browser-extension/lifecycle::wallet-extension-id-cluster
  - id: micro-behaviors/fs/path/app-data::chromium-local-extension-settings-path
  - id: micro-behaviors/data/archive/create/
  - id: micro-behaviors/communications/http/upload/

- id: wallet-extension-store-http-exfiltration
  desc: Multiple browser wallet extension stores targeted with HTTP upload
  conf: 0.98
  attack: "T1555.003,T1041"
  for: [scripts, binaries]
  scope: file
  all:
  - id: micro-behaviors/browser-extension/lifecycle::wallet-extension-id-cluster
  - id: micro-behaviors/fs/path/app-data::chromium-local-extension-settings-path
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  any:
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
  - id: micro-behaviors/communications/http/post/
  - id: micro-behaviors/communications/http/upload/
  unless:
  - id: well-known/tool/detection/
  - id: well-known/app/security/
  - id: metadata/package/testing/

  # Wallet-secret entry and a bound value-to-reporting call claiming no
  # collection, corroborated by a concealed JSON POST, a veiled-domain JSON
  # POST, or a JSON beacon to a literal external-IP URL builder. The sinks
  # bind the builder to the URL. The numeric and veiled POST legs also bind
  # handler input to the serialized body. Require the concealed sink in one
  # file; unrelated ordinary RPC elsewhere in the archive cannot satisfy the
  # transport leg. Manifest naming is not evidence of theft and must not
  # gate this finding. The report channel accepts aggregation because the
  # newest kit scrapes password inputs into one joined bulk report instead
  # of passing each value straight to the collection callback. Generic
  # parameter .value reporting alone supplies no browser-input source:
  # require a DOM edit/submit listener or actual password-input aggregation.
