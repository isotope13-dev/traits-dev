defaults:
  platforms:
  - windows
  - unix
  crit: hostile
  conf: 0.99
  attack: T1048.003,T1552.001
  mbc: B0030,E1552
composite_rules:
- for:
  - scripts
  - source
  id: hex-developer-credential-dns-exfil
  desc: Hex-encoded developer credentials leave through DNS queries
  scope: file
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  - id: micro-behaviors/fs/path/secret-config::netrc
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  - id: micro-behaviors/data/encode/hex::byte-to-hex-encoding-operation
  - id: micro-behaviors/communications/dns/lookup::source-resolver-query
- for:
  - class
  - java_class
  id: jvm-hex-developer-credential-dns-exfil
  desc: JVM bytecode hex-encodes developer credentials for DNS queries
  scope: file
  all:
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  - id: micro-behaviors/fs/path/secret-config::netrc
  - id: micro-behaviors/fs/read/file/full::java-readallbytes
  - id: micro-behaviors/data/encode/hex::jvm-hex-byte-format-class
  - id: micro-behaviors/communications/dns/lookup::source-resolver-query
- for:
  - kotlin
  id: kotlin-developer-credential-case-dns-exfil
  desc: Kotlin sends credential bits via DNS case
  scope: leaf
  near_lines: 80
  all:
  - id: micro-behaviors/fs/path/credential::kotlin-ssh-aws-path-cluster
  - id: micro-behaviors/fs/read/file/full::kotlin-file-read-call
  - id: metadata/lang/source/syntax/operator::low-bit-mask-expression-text
  - id: micro-behaviors/communications/dns/cli::jvm-nslookup-variable-name-helper
  any:
  - id: micro-behaviors/data/string/case::source-case-transform
  - id: micro-behaviors/data/string/case::kotlin-char-case-transform
