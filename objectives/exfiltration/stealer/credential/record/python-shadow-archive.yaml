# Require both resource bindings: the archive receiving shadow is opened for
# reading and that handle is the HTTP request body. Names and URLs are free.
defaults:
  platforms: [linux]
  for: [python]
  attack: T1003.008,T1560.001,T1041
traits:
  - id: python-shadow-archive-http-upload
    desc: Uploads shadow-containing archive over HTTP
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((_
          (with_statement
            (with_clause (with_item value: (as_pattern
              (call function: (attribute) @taropen
                arguments: (argument_list . (string (string_content) @archive)
                  . (string (string_content) @mode) .))
              alias: (as_pattern_target (identifier) @writer))))
            body: (block . (expression_statement
              (call function: (attribute object: (identifier) @used_writer
                attribute: (identifier) @add)
                arguments: (argument_list . (string (string_content) @secret) .))) .)) .
          (with_statement
            (with_clause (with_item value: (as_pattern
              (call function: (identifier) @open
                arguments: (argument_list . (string (string_content) @uploaded)
                  . (string (string_content) @readmode) .))
              alias: (as_pattern_target (identifier) @reader))))
            body: (block . (expression_statement
              (call function: (attribute) @post
                arguments: (argument_list . (string (string_content) @url)
                  . (keyword_argument name: (identifier) @data
                    value: (identifier) @sent) .))) .)))
          (#eq? @taropen "tarfile.open") (#match? @mode "^w(:[a-z0-9]+)?$")
          (#eq? @writer @used_writer) (#eq? @add "add")
          (#eq? @secret "/etc/shadow")
          (#eq? @archive @uploaded) (#eq? @open "open") (#eq? @readmode "rb")
          (#match? @post "^(requests|httpx)\\.post$")
          (#match? @url "^https?://") (#eq? @data "data") (#eq? @reader @sent))
