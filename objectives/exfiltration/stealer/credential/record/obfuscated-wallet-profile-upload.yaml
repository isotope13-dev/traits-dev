defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  # These short strings are shuffled table fragments, not a recovered flow.
  - id: shuffled-wallet-login-upload-fragments
    desc: Shuffled wallet, login and upload fragments
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule shuffled_wallet_login_upload_fragments {
          strings:
            $wallet_a = "nkbih" ascii
            $wallet_b = "fbeog" ascii
            $wallet_c = "fgpgk" ascii
            $login = "/Logi" ascii
            $data = "Data" ascii
            $upload = "/uplo" ascii
            $form = "formD" ascii
            $stream = "Strea" ascii
          condition:
            all of them
        }
composite_rules:
  # A fragmented string table is only a static profile. The individual matches
  # do not by themselves establish a call graph or a successful upload.
  - id: obfuscated-wallet-login-upload-clues
    desc: Obfuscated wallet and login upload clues
    crit: hostile
    conf: 0.97
    attack: T1027,T1555.003,T1041
    all:
      - id: shuffled-wallet-login-upload-fragments
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
      - id: metadata/import/builtin::require-fs
      - id: metadata/import/builtin::require-os
      - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
