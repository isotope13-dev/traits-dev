                     !decl[hd]-7 == !root[ro]-9 and
       for all z in (0..!decl[hd]-7-1) : (
        uint8(@decl[hd]+4+z) == uint8(@root[ro]+0+z)
       ) and
                     for any ar in (1..#resolve_arg) : (
                      @resolve_arg[ar] == @root[ro]+!root[ro]-9 and
                      !entry[en]-9 == !resolve_arg[ar]-10 and
       for all z in (0..!entry[en]-9-1) : (
        uint8(@entry[en]+5+z) == uint8(@resolve_arg[ar]+9+z)
       ) and
                      for any sk in (1..#skip) : (
                       @skip[sk] == @resolve[re]+!resolve[re] and
                       for any tr in (1..#transfer) : (
                        @transfer[tr] == @skip[sk]+!skip[sk] and
                        for any cd in (1..#decl) : (
                         @decl[cd] == @transfer[tr] and
                         for any ur in (1..#url_arg) : (
                          @url_arg[ur] == @decl[cd]+!decl[cd] and
                          !decl[rd]-7 == !url_arg[ur]-15 and
       for all z in (0..!decl[rd]-7-1) : (
        uint8(@decl[rd]+4+z) == uint8(@url_arg[ur]+13+z)
       ) and
                          for any po in (1..#post) : (
                           @post[po] > @url_arg[ur] and @post[po]+!post[po] < @transfer[tr]+!transfer[tr] and
                           !decl[cd]-7 == !post[po]-23 and
       for all z in (0..!decl[cd]-7-1) : (
        uint8(@decl[cd]+4+z) == uint8(@post[po]+0+z)
       ) and
                           for any ou in (1..#out) : (
                            @out[ou] > @post[po] and @out[ou]+!out[ou] < @transfer[tr]+!transfer[tr] and
                            !decl[cd]-7 == !out[ou]-16 and
       for all z in (0..!decl[cd]-7-1) : (
        uint8(@decl[cd]+4+z) == uint8(@out[ou]+0+z)
