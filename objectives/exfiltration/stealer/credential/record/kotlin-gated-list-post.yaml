        $resolve = /\bval [A-Za-z_][A-Za-z0-9_]{0,63} = [A-Za-z_][A-Za-z0-9_]{0,63}\.resolve\([A-Za-z_][A-Za-z0-9_]{0,63}\)/
        $root = /[A-Za-z_][A-Za-z0-9_]{0,63}\.resolve\(/
        $resolve_arg = /\.resolve\([A-Za-z_][A-Za-z0-9_]{0,63}\)/
        $skip = /[ \t\r\n]+if \(!Files\.exists\([A-Za-z_][A-Za-z0-9_]{0,63}\)\) continue[ \t\r\n]+runCatching \{[ \t\r\n]+/
        $transfer = /\bval [A-Za-z_][A-Za-z0-9_]{0,63} = java\.net\.URL\([A-Za-z_][A-Za-z0-9_]{0,63} \+ \x22[^\x22\r\n]{0,80}\x22 \+ [A-Za-z_][A-Za-z0-9_]{0,63}\.fileName\)[ \t\r\n]*\.openConnection\(\) as java\.net\.HttpURLConnection[ \t\r\n]+[A-Za-z_][A-Za-z0-9_]{0,63}\.requestMethod = \x22POST\x22[ \t\r\n]+([A-Za-z_][A-Za-z0-9_]{0,63}\.connectTimeout = [0-9]{1,9}[ \t\r\n]+)?[A-Za-z_][A-Za-z0-9_]{0,63}\.doOutput = true[ \t\r\n]+[A-Za-z_][A-Za-z0-9_]{0,63}\.outputStream\.use[ \t\r\n]*\{[ \t\r\n]*it\.write\(Files\.readAllBytes\([A-Za-z_][A-Za-z0-9_]{0,63}\)\)[ \t\r\n]*\}/
        $url_arg = /java\.net\.URL\([A-Za-z_][A-Za-z0-9_]{0,63} \+/
        $post = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.requestMethod = \x22POST\x22/
        $out = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.doOutput = true/
        $send = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.outputStream/
        $read = /Files\.readAllBytes\([A-Za-z_][A-Za-z0-9_]{0,63}\)/
        $line_comment = /\/\/[^\r\n]*/
        $block_open = /\/\*/
        $block_close = /\*\//
        $triple = /\x22\x22\x22/
        $target = /\x22Library\/Application Support\/Google\/(Chrome|Chromium)\/[^\x22\r\n]{1,160}\/Login Data\x22/
       condition:

       $relay and $list and $setup and $resolve and $skip and $transfer and $target and
       for any rl in (1..#relay) : (
        (#line_comment == 0 or for all lc in (1..#line_comment) : (not (@line_comment[lc] <= @relay[rl] and @relay[rl] < @line_comment[lc]+!line_comment[lc]))) and
