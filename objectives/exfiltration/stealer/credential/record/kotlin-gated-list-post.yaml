        $list = /\bprivate val [A-Za-z_][A-Za-z0-9_]{0,63} = listOf\([^)]{1,1000}\)/
        $list_head = /\bprivate val [A-Za-z_][A-Za-z0-9_]{0,63} = listOf\(/
        $setup = /\bfun [A-Za-z_][A-Za-z0-9_]{0,63}\(\): Long \{[ \t\r\n]+if \(System\.getenv\(\x22[A-Za-z_][A-Za-z0-9_]{0,63}\x22\) == null\) return 0[ \t\r\n]+val [A-Za-z_][A-Za-z0-9_]{0,63} = Paths\.get\(System\.getProperty\(\x22user\.home\x22\)\)[ \t\r\n]+var [A-Za-z_][A-Za-z0-9_]{0,63} = 0L[ \t\r\n]+for \([A-Za-z_][A-Za-z0-9_]{0,63} in [A-Za-z_][A-Za-z0-9_]{0,63}\) \{[ \t\r\n]+/
        $home = /\bval [A-Za-z_][A-Za-z0-9_]{0,63} = Paths\.get\(System\.getProperty\(\x22user\.home\x22\)\)/
        $loop = /for \([A-Za-z_][A-Za-z0-9_]{0,63} in [A-Za-z_][A-Za-z0-9_]{0,63}\) \{[ \t\r\n]+/
        $entry = /for \([A-Za-z_][A-Za-z0-9_]{0,63} in /
