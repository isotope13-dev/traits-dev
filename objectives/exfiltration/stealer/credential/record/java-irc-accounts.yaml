# Account lines leave the process through an IRC sendMessage call.
defaults:
  platforms: [windows, unix]
  for: [java_class, class]
  attack: T1041
composite_rules:
  - id: rsbot-accounts-sent-over-irc
    desc: Sends RSBot accounts over IRC
    crit: hostile
    conf: 0.94
    near_bytes: 4000
    all:
      - id: micro-behaviors/fs/path/account-db::accounts-ini-settings-path
      - id: metadata/import/jvm::irc-class-reference
      - id: metadata/import/jvm::sendmessage-member-reference
      - id: metadata/lang/natural/credential::username-report-label
