defaults:
  platforms: [unix]
  for: [perl, tar]
  crit: hostile
  conf: 0.98
  attack: T1048.003
composite_rules:
  - id: perl-credential-nibbles-over-icmp
    desc: Credential reads accompany ICMP nibble transmission
    scope: archive
    all:
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/data/buffer/integer-codec::perl-byte-high-nibble-call
      - id: micro-behaviors/data/buffer/integer-codec::perl-byte-low-nibble-call
      - id: micro-behaviors/communications/icmp::perl-ping-size-nibble
      - id: micro-behaviors/data/buffer/integer-codec::perl-unpack-byte-iteration
