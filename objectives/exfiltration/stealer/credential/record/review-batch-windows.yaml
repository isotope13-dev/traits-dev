composite_rules:
- platforms:
  - windows
  for:
  - batch
  - vbs
  - text
  attack: T1555, T1041
  id: batch-credential-archive-upload
  desc: Archives browser or mail-client credentials for upload
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/credential-manager/secret-storage::batch-credential-store-indicators
  - id: micro-behaviors/data/archive/create/utility::batch-archive-create-step
  - id: micro-behaviors/communications/http/upload::batch-upload-command-step
