defaults:
  platforms: [openbsd, bsd, unix]
  for: [objc, elf]
  attack: T1048.003

composite_rules:
- id: objc-openbsd-dns-account-exfil
  desc: ObjC DNS account exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/construction/template::export-subdomain-format
  - id: metadata/lang/source/naming/function::objc-account-dns-export-name-reference
  - id: micro-behaviors/fs/path/config/accounts::bsd-master-passwd-path

- id: objc-openbsd-passwd-copy-dns-exfil
  desc: ObjC passwd DNS exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/credential::master-passwd-cache-backup-path-pair
  - id: micro-behaviors/communications/url/construction/template::export-subdomain-format
