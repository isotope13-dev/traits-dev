defaults:
  for: [scripts, source]
  platforms: [macos]
composite_rules:
  - id: login-keychain-developer-archive-upload
    desc: Login keychain archive exported with secrets
    crit: hostile
    conf: 0.95
    attack: T1555.001,T1552.001,T1560.001,T1041
    near_lines: 25
    all:
      - id: keychain-archive-upload-command-flow
      - id: micro-behaviors/fs/file/copy::shell-copy-login-keychain
      - id: micro-behaviors/data/archive/create/tar::tar-create
      - id: micro-behaviors/communications/http/upload::curl-at-source-body-command
    any:
      - id: micro-behaviors/fs/file/copy::shell-copy-npmrc
      - id: micro-behaviors/fs/file/copy::shell-copy-ssh-directory
