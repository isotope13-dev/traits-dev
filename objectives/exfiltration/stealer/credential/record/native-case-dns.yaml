defaults:
  platforms: [unix, windows, macos]
  for: [c, cpp, source, tar, tgz]
  crit: hostile
  conf: 0.98
  attack: T1048.003,T1552.001
  mbc: B0030,E1552

composite_rules:
  - id: native-developer-credential-bit-case-dns-exfiltration
    desc: Developer credentials are hex encoded and sent through DNS letter casing
    scope: archive
    near_lines: 100
    all:
      - id: micro-behaviors/fs/path/config/app::ssh-config-path-reference
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/data/encode/hex::piped-hex-encode-shell-output
      - id: micro-behaviors/data/string/case::source-case-transform
      - id: metadata/lang/source/syntax/operator::low-bit-mask-expression-text
      - id: micro-behaviors/communications/dns/lookup::nslookup-command-literal
