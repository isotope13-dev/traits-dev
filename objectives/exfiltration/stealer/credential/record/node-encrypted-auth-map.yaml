# Bind hidden-app authentication paths (agent or cloud stores) through
# file-map collection, ZIP creation,
# encryption and the fetch body. The source class can vary, so credential
# owns this chain rather than the narrower dev-secret or cloud subjects.
# FileFacts does not model mutations of the map.
# Adjacency after ZIP creation rejects intervening statements.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.99
  attack: T1552.001,T1560.001,T1041
traits:
  - id: node-auth-files-encrypted-zip-upload
    desc: Hidden-app auth files enter encrypted ZIP upload
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @targets value: (array
              (string (string_fragment) @credential_one)
              (string (string_fragment) @credential_two))))
          . (lexical_declaration (variable_declarator
            name: (identifier) @files value: (object)))
          . (lexical_declaration (variable_declarator name: (identifier) @roots))
          . (for_in_statement left: (identifier) @root right: (identifier) @used_roots
            body: (statement_block
              . (for_in_statement left: (identifier) @target right: (identifier) @used_targets
                body: (statement_block
                  . (lexical_declaration (variable_declarator
                    name: (identifier) @file
                    value: (call_expression
                      function: (member_expression object: (identifier) @path
                        property: (property_identifier) @join)
                      arguments: (arguments . (identifier) @joined_root
                        . (identifier) @joined_target .))))
                  . (try_statement body: (statement_block
                    . (expression_statement (assignment_expression
                      left: (subscript_expression object: (identifier) @stored_files)
                      right: (new_expression constructor: (identifier) @uint8
                        arguments: (arguments . (call_expression
                          function: (member_expression object: (identifier) @fs
                            property: (property_identifier) @read)
                          arguments: (arguments . (identifier) @read_file .)) .)))) .)) .)) .))
          . (lexical_declaration (variable_declarator
            name: (identifier) @archive value: (call_expression
              function: (identifier) @zip
              arguments: (arguments . (identifier) @zipped_files .))))
          . (lexical_declaration (variable_declarator name: (identifier) @nonce))
          . (expression_statement (call_expression
            function: (member_expression object: (identifier) @written_nonce)))
          . (lexical_declaration (variable_declarator
            name: (identifier) @cipher value: (call_expression
              function: (member_expression property: (property_identifier) @factory))))
          . (lexical_declaration (variable_declarator
            name: (identifier) @body value: (call_expression
              function: (member_expression object: (identifier) @buffer
                property: (property_identifier) @concat)
              arguments: (arguments . (array
                . (identifier) @packed_nonce
                . (call_expression function: (member_expression
                    object: (identifier) @updating_cipher property: (property_identifier) @update)
                  arguments: (arguments . (identifier) @encrypted_archive .))
                . (call_expression function: (member_expression
                    object: (identifier) @final_cipher property: (property_identifier) @final))
                . (call_expression function: (member_expression
                    object: (identifier) @tag_cipher property: (property_identifier) @tag)) .) .))))
          . (expression_statement (await_expression (call_expression
            function: (identifier) @fetch
            arguments: (arguments . (_) . (object
              (shorthand_property_identifier) @sent_body) .))))) @transfer
          (#match? @credential_one "^\\.[a-z]+/(\\.?credentials(\\.json)?|auth\\.json|hosts\\.json)$")
          (#match? @credential_two "^\\.[a-z]+/(\\.?credentials(\\.json)?|auth\\.json|hosts\\.json)$")
          (#not-eq? @credential_one @credential_two)
          (#eq? @targets @used_targets) (#eq? @roots @used_roots)
          (#eq? @root @joined_root) (#eq? @target @joined_target)
          (#eq? @path "path") (#eq? @join "join")
          (#eq? @files @stored_files) (#eq? @files @zipped_files)
          (#eq? @uint8 "Uint8Array") (#eq? @fs "fs")
          (#eq? @read "readFileSync") (#eq? @file @read_file)
          (#eq? @zip "zipSync") (#eq? @archive @encrypted_archive)
          (#eq? @factory "createCipheriv") (#eq? @cipher @updating_cipher)
          (#eq? @cipher @final_cipher) (#eq? @cipher @tag_cipher)
          (#eq? @update "update") (#eq? @final "final") (#eq? @tag "getAuthTag")
          (#eq? @buffer "Buffer") (#eq? @concat "concat")
          (#eq? @nonce @written_nonce) (#eq? @nonce @packed_nonce)
          (#eq? @body "body") (#eq? @body @sent_body) (#eq? @fetch "fetch"))

composite_rules:
  - id: cross-agent-auth-encrypted-zip-upload
    desc: Cross-agent auth catalogs with encrypted ZIP send
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: node-auth-files-encrypted-zip-upload
      - id: objectives/credential-access/dev-tools/ai::multi-ai-agent-auth-artifact-catalog
      - id: objectives/credential-access/dev-tools/ai::multi-ai-agent-config-artifact-catalog
