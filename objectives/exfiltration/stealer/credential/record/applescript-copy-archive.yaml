# The required phishing, sensitive-source copy scaffold, ZIP and upload are
# file-scoped evidence. This does not prove a source-to-upload variable binding.
defaults:
  platforms: [macos]
  for: [applescript, shell]
composite_rules:
  - id: phished-keychain-copy-zip-upload-profile
    desc: Phished Keychain copy with ZIP/upload references
    crit: hostile
    conf: 0.96
    attack: T1555.001,T1560.001,T1041
    all:
      - id: objectives/credential-access/keychain/theft::phished-keychain-db-acquisition
      - id: micro-behaviors/data/archive/create/utility::macos-ditto-compress-flags
      - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
