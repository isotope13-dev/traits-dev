# A nearby archive and HTTP client do not establish export. Bind tar's output
# operand to curl's upload operand and require shadow as an archived input.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1003.008,T1560.001,T1041
traits:
  - id: shell-shadow-http-upload
    desc: Uploads shadow records directly or archived
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        ((_
          (command name: (command_name) @tar
            . argument: (word) @flags . argument: (_) @archive
            argument: (_) @secret) .
          (command name: (command_name) @curl
            argument: (word) @upload_flag . argument: (_) @uploaded
            . argument: (_) @url .))
          (#match? @tar "^(/(usr/)?bin/)?tar$")
          (#match? @flags "^-c[zjJav]*f$")
          (#match? @secret "^[\"']?/etc/shadow[\"']?$")
          (#match? @curl "^(/(usr/)?bin/)?curl$")
          (#match? @upload_flag "^(-T|--upload-file)$")
          (#match? @url "^[\"']?https?://")
          (#eq? @archive @uploaded))
        ((command name: (command_name) @curl
          argument: (word) @flag . argument: (_) @secret
          . argument: (_) @url .)
          (#match? @curl "^(/(usr/)?bin/)?curl$")
          (#match? @flag "^(-d|--data|--data-binary)$")
          (#match? @secret "^[\"']?@/etc/g?shadow[\"']?$")
          (#match? @url "^[\"']?https?://"))
        ((command name: (command_name) @curl
          . argument: (_) @url
          argument: (word) @flag . argument: (_) @secret)
          (#match? @curl "^(/(usr/)?bin/)?curl$")
          (#match? @flag "^(-d|--data|--data-binary)$")
          (#match? @secret "^[\"']?@/etc/g?shadow[\"']?$")
          (#match? @url "^[\"']?https?://"))

composite_rules:
  # File types are exclusive: a shell file can contribute the shell export and
  # shell installation only; Python contributes the corresponding Python pair.
  # Thus two matches require both export and the independently hostile implant.
  - id: shadow-export-with-hidden-root-shell
    desc: Shadow upload with hidden root shell
    crit: hostile
    conf: 0.99
    platforms: [unix]
    for: [shell, python]
    near_lines: 24
    needs: 2
    any:
      - id: shell-shadow-http-upload
      - id: python-shadow-archive-http-upload
      - id: objectives/privilege-escalation/elevation-control/setuid/shell::root-owned-hidden-temp-shell-install
      - id: objectives/privilege-escalation/elevation-control/setuid/shell::hidden-temp-setuid-shell-install-command
      - id: objectives/privilege-escalation/elevation-control/setuid/shell::python-root-owned-hidden-temp-shell-install
