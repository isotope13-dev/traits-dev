defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # A source/copy/archive/upload profile, not a session path or a POST alone.
  # Require separate browser-theft evidence to distinguish backup utilities.
  - id: native-telegram-session-archive-upload
    desc: Telegram authentication-store copy/archive/upload profile
    crit: hostile
    conf: 0.97
    attack: T1555,T1567
    all:
      - id: objectives/credential-access/browser/multi-target::hostile-browser-stealer
      - id: micro-behaviors/fs/path/credential::telegram-session-data-location
      - id: micro-behaviors/fs/file/copy/command::powershell-copy-item-command
      - id: micro-behaviors/data/archive/create/zip::powershell-compress-archive
      - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
