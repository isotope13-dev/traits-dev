defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1041,T1567.002
  mbc: E1041

composite_rules:
  - id: feishu-application-record-webhook-exfil
    desc: Sensitive record posted to an embedded Feishu webhook
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-hardcoded-incoming-webhook
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-record-body-builder
