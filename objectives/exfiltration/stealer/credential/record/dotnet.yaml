defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  attack: T1041

composite_rules:
  - id: dotnet-unix-account-http-exfil
    for: [pe]
    desc: .NET Unix account HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: micro-behaviors/communications/url/resource-path/collection::data-collection-route-reference
    any:
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-octet-post
      - id: micro-behaviors/communications/url/transfer-path::exfil-path-marker
  - id: dotnet-pe-account-http-exfil
    for: [pe]
    desc: .NET PE account HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: metadata/lang/compiler/managed::clr-runtime-header
      - id: micro-behaviors/communications/url/resource-path/collection::data-collection-route-reference
    any:
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-octet-post
      - id: micro-behaviors/communications/url/transfer-path::exfil-path-marker
  - id: dotnet-account-collect-exfil
    for: [pe]
    desc: .NET account paths and collection route
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: metadata/lang/compiler/managed::clr-runtime-header
      - id: micro-behaviors/communications/url/resource-path/collection::data-collection-route-reference
