defaults:
  platforms: [macos]
  for: [php]
  attack: T1555.003,T1041
  mbc: B0030,E1555

composite_rules:
  - id: php-browser-credential-file-http-exfil
    desc: PHP uploads browser credential databases over HTTP
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/communications/http/curl::file-upload
      - id: micro-behaviors/communications/http/curl::exec
