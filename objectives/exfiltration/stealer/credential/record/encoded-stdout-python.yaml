defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1552,T1027

traits:
  - id: python-encoded-secret-records-to-stdout
    desc: Prints encoded regex-selected secret records
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((_ (expression_statement
              (assignment left: (identifier) @records
                right: (call function: (attribute object: (identifier) @regex_module
                  attribute: (identifier) @find)
                  arguments: (argument_list . (string) @pattern))))
            . (comment)*
            . (expression_statement
                (call function: (identifier) @print
                  arguments: (argument_list .
                    (call function: (attribute
                      object: (call function: (attribute
                        object: (identifier) @encoding_module
                        attribute: (identifier) @encode)
                        arguments: (argument_list .
                          (call function: (attribute object: (string) @separator
                            attribute: (identifier) @join)
                            arguments: (argument_list . (identifier) @used .)) .))
                      attribute: (identifier) @decode)
                      arguments: (argument_list)) .)))) @evidence
          (#eq? @regex_module "re") (#eq? @find "findall")
          (#match? @pattern "value.{1,60}isSecret[^a-zA-Z0-9]{1,12}true")
          (#eq? @records @used)
          (#eq? @encoding_module "base64") (#eq? @encode "b64encode")
          (#eq? @join "join") (#eq? @decode "decode")
          (#eq? @print "print"))
