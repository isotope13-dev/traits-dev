defaults:
  for:
  - package.json
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  crit: hostile
  conf: 0.995
  mbc: E1041
composite_rules:
- attack: T1552.005,T1041,T1195.002
  id: npm-aws-ecs-credential-http-exfil
  desc: npm lifecycle hook sends AWS ECS credentials
  all:
  - id: objectives/credential-access/cloud/token/metadata::npm-lifecycle-aws-ecs-credential-access
  - id: objectives/exfiltration/stealer/credential/record::npm-lifecycle-aws-ecs-node-credential-post
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture/
- attack: T1552.005,T1041,T1567.002,T1195.002
  id: npm-aws-ecs-credential-ngrok-exfil
  desc: npm lifecycle hook curls AWS ECS credentials to ngrok
  all:
  - id: objectives/credential-access/cloud/token/metadata::npm-lifecycle-aws-ecs-credential-access
  - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture/
