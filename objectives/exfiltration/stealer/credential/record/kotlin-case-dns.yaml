defaults:
  platforms:
  - unix
  - windows
  for:
  - kotlin
  crit: hostile
  conf: 0.99
  attack: T1048.003,T1552.001
composite_rules:
- id: kotlin-developer-credential-case-dns-exfil
  desc: Credential bit selects cased DNS query
  all:
  - id: kotlin-inline-credential-case-dns-expression
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
traits:
- id: kotlin-inline-credential-case-dns-expression
  desc: Inline credential-bit DNS casing expression
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: |
      rule kotlin_inline_credential_case_dns {
        strings:
          $begin = /\bProcessBuilder\s*\(\s*"nslookup"\s*,\s*if\s*\(\s*\(\s*/
          $file_aws = /File\s*\(\s*(\w+\s*,\s*)?"\.aws\/credentials"\s*\)/
          $file_ssh = /File\s*\(\s*(\w+\s*,\s*)?"\.ssh\/id_[a-z0-9_]+"\s*\)/
          $bit = /\.readBytes\(\)\[[0-9]+\]\.toInt\(\) and 1\) == 1\)\s*/
          $upper = /"[a-zA-Z][a-zA-Z0-9.-]+"\.uppercase\(\)\s*else\s*/
          $lower = /"[a-zA-Z][a-zA-Z0-9.-]+"\.lowercase\(\)\)\.start\(\)/
        condition:
          for any b in (1..#begin) : (
            for any t in (1..#bit) : (
              (for any a in (1..#file_aws) : (
                @file_aws[a] == @begin[b] + !begin[b] and
                @bit[t] == @file_aws[a] + !file_aws[a]
              ) or for any k in (1..#file_ssh) : (
                @file_ssh[k] == @begin[b] + !begin[b] and
                @bit[t] == @file_ssh[k] + !file_ssh[k]
              )) and
              for any u in (1..#upper) : (
                @upper[u] == @bit[t] + !bit[t] and
                $lower at (@upper[u] + !upper[u])
              )
            )
          )
      }
