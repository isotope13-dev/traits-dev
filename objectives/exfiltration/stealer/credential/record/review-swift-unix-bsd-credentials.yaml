composite_rules:
- platforms:
  - unix
  for:
  - swift
  attack: T1041
  id: swift-bsd-credential-http-exfil
  desc: Swift BSD credential HTTP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/config/accounts::bsd-master-passwd-path
  - id: objectives/exfiltration/http/collect::swift-curl-form-collect-post
  any:
  - id: micro-behaviors/fs/path/token::git-credentials
  - id: micro-behaviors/fs/path/secret-config::swift-package-secret-paths
  - id: micro-behaviors/fs/path/credential::swift-container-aws-paths
  - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
