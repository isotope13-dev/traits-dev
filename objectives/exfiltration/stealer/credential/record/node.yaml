defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
- id: node-shadow-discovery-post
  desc: Node posts shadow discovery data
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'postC2\(`discovery:[\s\S]{0,260}info\.shadow'
composite_rules:
- id: node-passwd-shadow-http-exfil
  desc: Node passwd shadow HTTP exfil
  crit: hostile
  unless:
  - id: well-known/tool/offensive/pentestkit/
  conf: 0.98
  all:
  - id: objectives/credential-access/files/password-database::node-passwd-shadow-read
  any:
  - id: objectives/exfiltration/http/report::node-state-exfil-post
  - id: node-shadow-discovery-post
  - id: micro-behaviors/communications/http/post::post-request-line
- id: node-passwd-shadow-curl-exfil
  desc: Node passwd shadow curl exfil
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/files/password-database::node-passwd-shadow-read
  - id: objectives/exfiltration/stealer/file::js-shell-curl-file-exfil
- id: web-auth-accounts-endpoint-exfiltration
  desc: Exfiltrates authentication records to endpoint
  crit: hostile
  conf: 0.98
  attack: T1041,T1552.001
  all:
  - id: micro-behaviors/communications/http/url/php-endpoint::js-accounts-endpoint-identifier
  - id: micro-behaviors/ui/controls/credential::auth-handler-object
  - id: micro-behaviors/communications/http/request/computed::js-fetch-computed-helper-argument
