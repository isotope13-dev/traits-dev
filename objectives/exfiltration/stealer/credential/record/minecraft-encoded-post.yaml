defaults:
  platforms: [unix, windows]
  for: [class]

traits:
  - id: jvm-base64-https-endpoint
    desc: JVM contains Base64 encoded HTTPS URL
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: 'https://[a-zA-Z0-9.-]+\.[a-z]{2,}(/|$)'

composite_rules:
  - id: minecraft-token-encoded-endpoint-post
    desc: Minecraft token access with POST to encoded HTTPS endpoint
    crit: hostile
    attack: T1528,T1041,T1027
    all:
      - id: objectives/credential-access/gaming/minecraft::minecraft-named-session-token-access
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
      - id: micro-behaviors/data/buffer/transfer::jvm-outputstream-write
      - id: jvm-base64-https-endpoint
