defaults:
  platforms: [unix]
  for: [php, composer, zip]
  crit: hostile
  conf: 0.98
  attack: T1048.003,T1552.001
  mbc: B0030,E1552

composite_rules:
  # The byte loop and packet-size implementation can occupy separate members.
  # An unrelated byte-in-destination helper and shell escaping prove no export.
  - id: php-developer-credential-bytes-over-icmp
    desc: Credential reads with paired ICMP byte-nibble calls and packet-size encoding
    scope: archive
    all:
      - id: micro-behaviors/fs/path/credential/registry::netrc
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/data/string/split::php-str-split-call
      - id: micro-behaviors/communications/icmp::php-paired-icmp-byte-nibbles
      - id: micro-behaviors/communications/icmp::php-ping-size-nibble-channel
