defaults:
  platforms: [unix]
  for: [php, source, zip]
  crit: hostile
  conf: 0.98
  attack: T1048.003,T1552.001
  mbc: B0030,E1552

composite_rules:
  - id: php-developer-credential-bytes-over-icmp
    desc: PHP reads developer credentials and sends their byte values in ICMP probes
    scope: archive
    all:
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/data/string/conversion::ord-call
      - id: micro-behaviors/data/string/split::php-str-split-call
      - id: micro-behaviors/communications/icmp::php-ping-command-reference
      - id: micro-behaviors/communications/icmp::php-ping-target-concatenates-values
