# Archiving Check Point's SIC/Internal CA material and pushing it to a raw
# IP literal over HTTP is exfiltration of the harvested trust store, distinct
# from the collection claim made at the point of copying the files.
defaults:
  platforms: [linux]
  for: [python, shell, text]
  attack: T1560.001,T1041

traits:
  - id: archive-post-raw-ip-exfil
    desc: Archives and POSTs directory to an IP
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'tar -czf[\s\S]{0,80}curl -s[\s\S]{0,40}-X POST http://\d{1,3}(\.\d{1,3}){3}'

composite_rules:
  - id: checkpoint-sic-archive-raw-ip-exfil
    desc: Exfiltrates Check Point credential material to a raw IP
    crit: hostile
    conf: 0.98
    near_lines: 25
    all:
      - id: objectives/credential-access/files/appliance::checkpoint-sic-internal-ca-reference
      - id: archive-post-raw-ip-exfil
