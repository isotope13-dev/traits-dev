composite_rules:
- crit: hostile
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  id: node-ai-assistant-credential-store-exfil
  desc: Attempts to upload AI coding assistant credentials
  conf: 0.99
  near_bytes: 4096
  all:
  - id: objectives/credential-access/dev-tools/ai::ai-coding-assistant-credential-store-read
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/form::formdata-file-stream
  - id: micro-behaviors/communications/http/form::form-data-append
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  unless:
  - id: well-known/tool/detection/sast/
  - id: well-known/app/ai/coding-agent/
