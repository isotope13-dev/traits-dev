composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1552.001,T1041
  id: coding-agent-auth-files-http-export
  desc: Coding-agent authentication files exported by HTTP
  crit: hostile
  conf: 0.94
  near_bytes: 12000
  all:
  - id: micro-behaviors/fs/read/file/target::agent-auth-json-raw-read
  - id: micro-behaviors/data/serialize/schema-credential::credentials-call-json-payload-context
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
  unless:
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
  - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
