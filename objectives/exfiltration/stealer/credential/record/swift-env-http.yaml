defaults:
  platforms: [unix, macos]
  for: [swift]
  attack: T1041,T1552.001
  mbc: B0030,E1552

composite_rules:
  - id: swift-filtered-env-secret-http-exfil
    desc: Swift sends filtered secret environment values by HTTP
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::swift-filtered-env-secrets
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/http/request/body/construction::swift-urlrequest-http-body
      - id: micro-behaviors/communications/http/request/client::swift-urlsession-data-task
