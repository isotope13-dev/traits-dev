defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-aws-env-native-http-exfil
  desc: Node AWS env credential HTTP exfil
  conf: 0.98
  all:
  - id: micro-behaviors/os/env/secret-name::node-aws
  - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  any:
  - id: micro-behaviors/communications/url/host/oob::webhook-site
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: "metadata/file/naming::test-directory-component"
