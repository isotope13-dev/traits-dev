composite_rules:
- crit: hostile
  conf: 0.995
  platforms:
  - windows
  - unix
  for:
  - go
  attack: T1555.003,T1041,T1567.004
  id: llm-directed-browser-credential-webhook-exfiltration
  desc: Autonomous LLM implant exfiltrates browser credentials by webhook
  all:
  - id: objectives/execution/automation/autonomous::autonomous-offensive-llm-capability-dispatch
  - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
  - id: micro-behaviors/communications/http/webhook::generic-webhook-url
  - id: micro-behaviors/communications/http/post::http-post
  any:
  - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
  - id: micro-behaviors/data/encode/base64::go-base64-encode-call
  near_bytes: 7000
