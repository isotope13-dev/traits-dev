# References to copying, credential stores, archiving and sending coexist.
# Runtime variables are unresolved; this does not prove a bound transfer.
defaults:
  for: [applescript]
  platforms: [macos]
composite_rules:
  - id: scpt-concealed-keychain-copy-upload-references
    desc: Concealed Keychain copy and archive-upload references
    crit: suspicious
    conf: 0.97
    attack: T1555.001,T1041
    all:
      - id: micro-behaviors/fs/path/password-store::macos-keychain-db-reference
      - id: micro-behaviors/fs/file/copy::cp-command-text
      - id: objectives/anti-static/obfuscation/string/conceal::scpt-concealed-password-keychain-query
      - id: micro-behaviors/data/archive/create/utility::macos-ditto-compress-flags
      - id: micro-behaviors/communications/http/curl::curl-post
      - id: micro-behaviors/communications/http/upload::multipart-file-prefix
