defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

composite_rules:
- crit: hostile
  conf: 0.995
  id: postinstall-docker-shadow-exfil
  desc: postinstall sends shadow-file results after Docker host access
  attack: T1005,T1611,T1041
  mbc: E1041
  all:
  - id: metadata/package/scripts/command::postinstall-inline-node-const-reference
  - id: micro-behaviors/fs/path/account-db::postinstall-local-shadow-file-read
  - id: micro-behaviors/fs/volume/mount::postinstall-docker-root-host-mount
  - id: micro-behaviors/communications/http/request/verb::npm-script-node-http-post
  - id: micro-behaviors/communications/url/host/oob/package::pipedream-npm-script
