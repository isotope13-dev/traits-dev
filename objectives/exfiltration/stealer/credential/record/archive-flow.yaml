defaults:
  for: [shell]
  platforms: [macos]
traits:
  - id: shell-keychain-archive-upload-flow
    desc: Copied login keychain archived then uploaded
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        (program
          (command name: (command_name (word) @copy)
            argument: (string) @source
            argument: (string (simple_expansion (variable_name) @stage)
              (string_content) @destination))
          (command name: (command_name (word) @tar)
            argument: (word) @create
            argument: (string (simple_expansion (variable_name) @archive_root)
              (string_content) @archive_name)
            argument: (word) @directory_flag
            argument: (string (simple_expansion (variable_name) @directory))
            argument: (word) @member)
          (command name: (command_name (word) @curl)
            argument: (word) @binary_flag
            argument: (string (string_content) @prefix
              (simple_expansion (variable_name) @uploaded_root)
              (string_content) @uploaded_name))
          (#eq? @copy "cp")
          (#match? @source "/login[.]keychain-db")
          (#match? @destination "^/(login[.]keychain-db)?$")
          (#eq? @tar "tar")
          (#match? @create "^-[a-zA-Z]*c[a-zA-Z]*f$")
          (#eq? @directory_flag "-C")
          (#eq? @directory @stage)
          (#match? @member "^([.]|login[.]keychain-db)$")
          (#eq? @curl "curl")
          (#eq? @binary_flag "--data-binary")
          (#eq? @prefix "@")
          (#eq? @uploaded_root @archive_root)
          (#eq? @uploaded_name @archive_name))
    unless:
      - type: symbol
        kind: function
        exact: cp
      - type: symbol
        kind: function
        exact: tar
      - id: metadata/lang/source/naming/action/function-name::shell-curl-function-definition
  - id: javascript-shell-keychain-copy-upload-command
    desc: Shell keychain copy and upload command
    for: [javascript]
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: execFileSync
      args:
        - index: 0
          regex: '(^|/)sh$'
        - index: 1
          from:
            value: '(?s)cp [^\n]{0,150}/login[.]keychain-db.{0,500}curl --data-binary'
composite_rules:
  - id: keychain-archive-upload-command-flow
    desc: Keychain staging and upload command linkage
    for: [shell, javascript]
    crit: suspicious
    conf: 0.97
    any:
      - id: shell-keychain-archive-upload-flow
      - id: javascript-shell-keychain-copy-upload-command
