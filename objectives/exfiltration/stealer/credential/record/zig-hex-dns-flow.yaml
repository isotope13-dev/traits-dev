defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - zig
  attack: T1552.001,T1048.003
traits:
- id: zig-credential-record-hex-dns-flow
  desc: Hex-encoded credential records sent through DNS
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((source_file
         (variable_declaration (identifier) @suffix (string (string_content) @domain))
         (function_declaration name: (identifier) @resolver
           (parameters (parameter name: (identifier) @hostname_arg))
           body: (block
             (variable_declaration
               (catch_expression
                 (call_expression function: (field_expression member: (identifier) @get_address_list)
                   (identifier) @hostname_arg_use)))))
         (function_declaration body: (block
           (labeled_statement (for_statement
             (struct_initializer (initializer_list (string (string_content) @credential)))
             (payload (identifier) @relative)
             body: (block_expression (block
               (variable_declaration (identifier) @path
                 (try_expression (call_expression
                   (anonymous_struct_initializer (initializer_list (identifier) (identifier) @relative_use)))))
               (variable_declaration (identifier) @data
                 (catch_expression (call_expression
                   function: (field_expression member: (identifier) @read)
                   (identifier) @path_use)))
               (expression_statement (try_expression (call_expression
                 function: (field_expression object: (identifier) @buffer member: (identifier) @append)
                 (identifier) @data_use)))))))
           (variable_declaration (identifier) @charset (string (string_content) @alphabet))
           (labeled_statement (for_statement
             (field_expression object: (identifier) @buffer_use member: (identifier) @items)
             (payload (identifier) @byte (identifier))
             body: (block_expression (block
               (variable_declaration (index_expression object: (identifier) @hex)
                 (index_expression object: (identifier) @charset_use
                   index: (binary_expression left: (identifier) @byte_use right: (integer) @shift)))))))
           (labeled_statement (while_statement body: (block_expression (block
             (variable_declaration (identifier) @host
               (try_expression (call_expression
                 function: (field_expression member: (identifier) @format)
                 (string (string_content) @format_string)
                 (anonymous_struct_initializer (initializer_list (index_expression object: (identifier) @hex_use) (identifier) @suffix_use)))))
             (variable_declaration (identifier) (call_expression function: (identifier) @resolver_use (identifier) @host_use))))))))) @flow
       (#eq? @get_address_list "getAddressList")
       (#eq? @hostname_arg @hostname_arg_use)
       (#match? @domain "^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$")
       (#eq? @suffix @suffix_use)
       (#match? @credential "^(\\.aws/credentials|\\.netrc)$")
       (#eq? @relative @relative_use)
       (#eq? @path @path_use)
       (#eq? @read "readFileAlloc")
       (#eq? @data @data_use)
       (#eq? @append "appendSlice")
       (#eq? @buffer @buffer_use)
       (#eq? @items "items")
       (#eq? @alphabet "0123456789abcdef")
       (#eq? @charset @charset_use)
       (#eq? @byte @byte_use)
       (#eq? @shift "4")
       (#eq? @hex @hex_use)
       (#eq? @format "bufPrint")
       (#eq? @format_string "{s}.{s}")
       (#eq? @resolver @resolver_use)
       (#eq? @host @host_use))
composite_rules:
- id: zig-credential-record-dns-with-env-gate
  desc: Environment-gated credential record DNS exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/exfiltration/stealer/credential/record::zig-credential-record-hex-dns-flow
  - id: micro-behaviors/os/env/read::zig-posix-getenv
