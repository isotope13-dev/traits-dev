defaults:
  platforms: [unix]
  for: [python]
  attack: "T1552.001, T1041"
  mbc: E1552

composite_rules:
- id: pypi-aws-shared-credentials-http-theft
  desc: PyPI package exfiltrates AWS shared credentials
  crit: hostile
  conf: 0.99
  # Source distributions may be tar.gz containers; include that outer scope so
  # the Python member's credential-exfiltration finding can reach this rule.
  for: [python, pkginfo, zip, whl, tar, pyproject.toml, text]
  platforms: [unix, windows]
  all:
  - id: objectives/exfiltration/stealer/credential/record::aws-shared-credentials-http-exfil
  any:
  - id: metadata/build/pip::setup-py
  - id: metadata/filename/identity::pyproject-toml-basename
  - id: "metadata/package/scripts/entrypoint::console-header-in-entry-points-file"
  scope: archive
