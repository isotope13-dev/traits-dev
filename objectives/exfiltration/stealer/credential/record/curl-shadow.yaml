defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: hostile
  conf: 0.97
  attack: T1041,T1003.008
traits:
  - id: curl-shadow-data-before-http-url
    desc: curl uploads shadow file over HTTP
    if:
      type: text
      regex: 'curl[^;\n]{0,80}(-d|--data(-binary)?)\s+@/etc/(g?shadow)\b[^;\n]{0,80}https?://'
  - id: curl-http-url-before-shadow-data
    desc: curl uploads shadow file over HTTP
    if:
      type: text
      regex: 'curl[^;\n]{0,80}https?://[^;\n]{0,80}(-d|--data(-binary)?)\s+@/etc/(g?shadow)\b'
