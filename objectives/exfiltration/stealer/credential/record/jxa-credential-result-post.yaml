defaults:
  platforms: [macos, windows]
  for: [asp, javascript]
  crit: notable
  conf: 0.97
traits:
  - id: jxa-credential-result-fields
    desc: JXA user and credential-result fields
    if:
      type: yara
      source: |
        rule jxa_credential_result_fields {
          strings:
            $user = "&user=" ascii
            $pass = "'pass'" ascii
            $wrong = "'wrong'" ascii
            $valid = ".valid" ascii
            $invalid = ".invalid" ascii
          condition:
            all of them
        }
  - id: jxa-curl-post-shell
    desc: JXA shell invokes curl with POST
    if:
      type: yara
      source: |
        rule jxa_curl_post_shell {
          strings:
            $post = "'POST'" ascii
            $curl = "curl -s -N --fail-early -X " ascii
            $shell = ".doShellScript(" ascii
            $jxa = "ObjC.import('Foundation')" ascii
          condition:
            all of them
        }
composite_rules:
  # This profile describes the uploader, not the source of the credentials or
  # a claim that a request succeeded.
  - id: jxa-valid-invalid-credential-uploader
    desc: JXA posts user and credential-result clues
    crit: hostile
    attack: T1059.007,T1041
    all:
      - id: jxa-credential-result-fields
      - id: jxa-curl-post-shell
