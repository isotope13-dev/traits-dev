# A script that names credential stores and a raw-IP URL may be a harvester,
# but these strings alone do not establish reads or transmission. For example,
# @rspack/core 1.1.7 (2024) read the Aliyun, Huawei Cloud and
# Tencent Cloud CLI configs, base64-joined them and POSTed the blob to
# http://80.78.28.72/tokens from its postinstall script. The obfuscator's
# string table scatters the paths and the URL across the file, so no
# proximity bound is set; the endpoint and paths are attacker-chosen.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1552.001,T1041

composite_rules:
  - id: multi-cloud-cli-credentials-raw-ip-endpoint
    unless:
      - id: metadata/file/format/security-corpus::inline-detection-rule-corpus
    desc: Script names several cloud CLI credential stores and a raw-IP HTTP endpoint
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    any:
      - id: micro-behaviors/fs/path/credential/cloud::aliyun-cli-config-path
      - id: micro-behaviors/fs/path/credential/cloud::huawei-cloud-cli-config-path
      - id: micro-behaviors/fs/path/credential/cloud::tencent-cloud-cli-credential-path
      - id: micro-behaviors/fs/path/credential/cloud::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/credential/cloud::gcloud-credentials
      - id: micro-behaviors/fs/path/credential/cloud::azure-credentials
    needs: 2
