# A script that names the credential stores of two or more cloud CLIs and
# holds an HTTP URL on a bare public IP is a cloud-key harvester with its
# drop server inline: no SDK or deployment tool sends provider keys to an
# unnamed host. @rspack/core 1.1.7 (2024) read the Aliyun, Huawei Cloud and
# Tencent Cloud CLI configs, base64-joined them and POSTed the blob to
# http://80.78.28.72/tokens from its postinstall script. The obfuscator's
# string table scatters the paths and the URL across the file, so no
# proximity bound is set; the endpoint and paths are attacker-chosen.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1552.001,T1041

composite_rules:
  - id: multi-cloud-cli-credentials-raw-ip-endpoint
    desc: Script names several cloud CLI credential stores and a raw-IP HTTP endpoint
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    any:
      - id: micro-behaviors/fs/path/token::aliyun-cli-config-path
      - id: micro-behaviors/fs/path/token::huawei-cloud-cli-config-path
      - id: micro-behaviors/fs/path/token::tencent-cloud-cli-credential-path
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/token::gcloud-credentials
      - id: micro-behaviors/fs/path/token::azure-credentials
    needs: 2
