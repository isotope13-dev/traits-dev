# Browser-session credential access and use. The combination below is
# specific to code that reads a browser context's cookies, evaluates page
# state, and sends requests through that authenticated context.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1539
traits:
- id: python-chromium-login-query-file-upload
  desc: Chromium login query reaches multipart upload
  crit: suspicious
  conf: 0.98
  attack: T1041,T1555.003
  platforms: [windows]
  if:
    type: symbol
    kind: call
    regex: '^(requests|httpx)\.(post|put)$'
    arg:
      from:
        field: files
        call: '\.execute$'
        literal: '(?i)^SELECT\b.{0,100}\bpassword_value\b.{0,80}\bFROM\s+logins\b'
        through:
        - call: '\.fetch(all|one)$'
          receiver: true
        - call: '^repr$'
          arguments: [0]
