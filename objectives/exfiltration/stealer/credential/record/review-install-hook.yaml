defaults:
  for:
  - package.json
  platforms:
  - unix
  - windows
  mbc: E1041
composite_rules:
- attack: T1041,T1552.005,T1195.002
  id: npm-lifecycle-aws-ecs-node-credential-post
  desc: Node POST follows ECS credential query
  crit: suspicious
  conf: 0.99
  all:
  - id: objectives/credential-access/cloud/token/metadata::npm-lifecycle-aws-ecs-credential-query
  - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  near_bytes: 900
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture/
- attack: T1195.002,T1552.005,T1041
  id: postinstall-aws-iam-metadata-oob-exfil
  desc: postinstall exfils AWS IAM metadata
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/credential-access/cloud/token/metadata::postinstall-aws-iam-metadata-script
  - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  - id: micro-behaviors/communications/url/host/oob::pipedream-npm-script
  unless:
  - id: metadata/package/testing/harness/runtime/
- attack: T1195.002,T1552.005,T1041
  id: postinstall-aws-imdsv2-oob-exfil
  desc: postinstall exfils AWS IMDSv2 credentials
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/credential-access/cloud/token/metadata::postinstall-aws-iam-metadata-script
  - id: objectives/credential-access/cloud/token/metadata::postinstall-aws-imdsv2-token-script
  - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  - id: micro-behaviors/communications/url/host/oob::pipedream-npm-script
  unless:
  - id: metadata/package/testing/harness/runtime/
- attack: T1195.002,T1552.005,T1041
  id: postinstall-aws-imdsv2-ngrok-exfil
  desc: postinstall exfils AWS metadata via OOB
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/credential-access/cloud/token/metadata::postinstall-aws-imdsv2-token-script
  - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
  any:
  - id: objectives/credential-access/cloud/token/metadata::postinstall-aws-iam-metadata-script
  - id: objectives/credential-access/cloud/token/metadata::npm-postinstall-aws-ecs-task-credential-query
  - id: objectives/credential-access/cloud/token/metadata::npm-postinstall-aws-ecs-iam-credential-query
  unless:
  - id: metadata/package/testing/harness/runtime/
- attack: T1552.005,T1041
  id: npm-aws-credential-oob-post
  desc: AWS metadata posted to OOB endpoint
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/post::npm-script-node-http-post
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
  any:
  - id: objectives/credential-access/cloud/token/metadata::postinstall-aws-iam-metadata-script
  - id: objectives/credential-access/cloud/token/metadata::npm-postinstall-aws-ecs-task-credential-query
  - id: objectives/credential-access/cloud/token/metadata::npm-postinstall-aws-ecs-iam-credential-query
  unless:
  - id: metadata/package/testing/harness/runtime/
