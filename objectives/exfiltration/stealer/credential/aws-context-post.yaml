defaults:
  platforms: [unix]
composite_rules:
  - id: aws-key-context-raw-ip-post
    desc: AWS key context exported in public-IP POST
    crit: hostile
    conf: 0.98
    for: [shell]
    attack: T1552.001,T1041
    mbc: "E1552,E1041"
    all:
      - id: micro-behaviors/communications/http/request/credentials::shell-aws-context-result-curl-body
      - id: micro-behaviors/data/parse/regex::aws-key-context-harvest
      - id: micro-behaviors/communications/http/url/external-ip::curl-external-ip-request
      - id: micro-behaviors/communications/http/upload::curl-data-binary
