# Both acquisition classes are required. Co-occurrence does not bind every
# queried row to the upload body; describe the supported capability set.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1555.003,T1552.001,T1041

composite_rules:
- id: python-browser-decryption-with-sealed-dev-secret-upload
  desc: Browser login decryption with RSA-sealed dev-secret upload
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/exfiltration/stealer/credential::python-rsa-wrapped-dev-secret-upload
  any:
  - id: objectives/credential-access/browser/chromium::python-dpapi-chromium-login-decrypt
  - id: objectives/credential-access/browser/chromium::python-os-crypt-chromium-login-decrypt
