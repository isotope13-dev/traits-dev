defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: token-message-assembly-with-repository-writes
    desc: Token assembly with GitHub content uploads
    crit: suspicious
    conf: 0.95
    # No assumed interprocedural flow from the token into the commit.
    all:
      - id: micro-behaviors/data/string/concat::token-field-colon-string-assembly
      - id: micro-behaviors/communications/http/put::javascript-content-commit-put-options
      - id: micro-behaviors/communications/http/services/github::github-api-host
