defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  # Storage APIs and binary request bodies are routine CI operations. The
  # credential scraper supplies attack evidence. Co-occurrence does not prove
  # that a storage path ran or that a particular upload carried the secrets.
  - id: runner-secret-scraper-actions-storage
    desc: Runner secret scraper with Actions storage upload clues
    crit: hostile
    conf: 0.97
    attack: T1003.007,T1567
    all:
      - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
      - id: micro-behaviors/communications/http/services/github/automation::actions-storage-upload-paths
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
