# CI runner process-memory secret exfiltration. TeamPCP's Trivy and KICS
# payloads used Python, but these mechanics are language-neutral: select the
# Runner.Worker process, read its procfs memory, locate isSecret records, and
# send the recovered values in an outbound HTTP request.
defaults:
  crit: hostile
  platforms: [unix]
  for: [python, javascript, typescript, shell, go]
  attack: T1003.007,T1041,T1552.001

composite_rules:
- id: github-runner-memory-secret-http-exfil
  desc: Runner memory secret scraper with HTTP POST clues
  conf: 0.995
  scope: file
  all:
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
  any:
  - id: micro-behaviors/communications/http/request/verb::python-http-post-any
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  - id: micro-behaviors/communications/http/post::http-post-methods

- id: github-runner-memory-secret-workflow-log-exfil
  desc: Exfiltrates GitHub runner memory secrets to workflow logs
  conf: 0.995
  scope: file
  all:
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
  - id: micro-behaviors/os/env/cicd/pipeline::github-workflow-log-command

# Covers campaigns that drop the collection-server IP entirely and upload
# only to a Telegram bot (wfx's Nov-12 05:30 UTC switch): a curl multipart
# upload to Telegram carries no literal POST/-X flag, so the HTTP-post sink
# above misses it without this leg.
- id: github-runner-memory-secret-telegram-exfil
  desc: Runner memory secret scraper with Telegram upload clues
  conf: 0.995
  for: [python, shell]
  scope: file
  all:
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
  - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
  # CI payloads that scrape runner environ and beacon via Cloudflare quick tunnels.
