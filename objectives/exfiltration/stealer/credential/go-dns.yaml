defaults:
  platforms: [windows]
  for: [go, pe]
  attack: T1048.003

composite_rules:
  - id: go-ssh-credential-dns-exfil
    desc: Go SSH credential DNS exfil
    crit: hostile
    conf: 0.98
    for: [go]
    all:
      - id: objectives/exfiltration/dns/tunnel::go-ssh-dns-exfil-labels
      - id: objectives/exfiltration/dns/tunnel::go-dns-txt-mx-c2-lookups
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: objectives/credential-access/credential-manager/cli::go-exec-cmdkey-list
