defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1005,T1041
traits:
- id: npm-tnactgfds-flag-search
  desc: Install hook searches workspace for flags
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (find\s+/usr/src/app\s+-name\s+flag|grep\s+-r[^\n]{0,40}flag[^\n]{0,80}/usr/src/app)
- id: npm-tnactgfds-flag-upload
  desc: Install hook uploads workspace data
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: bin\.graversen\.io/api/[a-f0-9-]+
- id: npm-tss12111-mcp-config-upload
  desc: Install hook encodes and uploads MCP config
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: find\s+/home\s+/root\s+/etc[^\n]{0,120}mcp\.json[^\n]{0,300}base64[^\n]{0,200}curl
- id: npm-tss12111-oast-collector
  desc: Install hook targets OAST config collector
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    substr: oastify.com/config_leak
- id: npm-ts-form-helpers-git-credential-harvest
  desc: Git credential text near curl text
  crit: notable
  conf: 0.99
  for:
  - shell
  if:
    type: text
    regex: '(?ms)(git credential fill|(^|[;&|])\s*cat\s+.{0,60}\.git-credentials).{0,600}curl\b'
    exclude_comments: true
- id: npm-ts-form-helpers-credential-endpoint
  desc: Uploads data to credential collector
  crit: suspicious
  conf: 0.99
  for:
  - shell
  if:
    type: text
    regex: aaronstack\.com/poc/(env|token)
    exclude_comments: true
- id: npm-ts-form-helpers-package-name
  desc: Identifies the ts-form-helpers package
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: name
    exact: ts-form-helpers
composite_rules:
- id: npm-tnactgfds-preinstall-flag-exfil
  desc: npm preinstall searches a workspace for flags and uploads results
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - package.json
  scope: archive
  all:
  - id: objectives/exfiltration/stealer/credential/developer::npm-tnactgfds-flag-search
  - id: objectives/exfiltration/stealer/credential/developer::npm-tnactgfds-flag-upload
- id: npm-tss12111-preinstall-mcp-exfil
  desc: npm preinstall reads and uploads an MCP configuration file
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - package.json
  scope: archive
  all:
  - id: objectives/exfiltration/stealer/credential/developer::npm-tss12111-mcp-config-upload
  - id: objectives/exfiltration/stealer/credential/developer::npm-tss12111-oast-collector
- id: npm-ts-form-helpers-git-token-exfil
  desc: npm package launches a shell hook that uploads Git credentials
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - package.json
  - shell
  scope: archive
  all:
  - id: objectives/exfiltration/stealer/credential/developer::npm-ts-form-helpers-package-name
  - id: metadata/package/scripts/entrypoint::postinstall-runs-shell-local-script
  - id: objectives/exfiltration/stealer/credential/developer::npm-ts-form-helpers-git-credential-harvest
  - id: objectives/exfiltration/stealer/credential/developer::npm-ts-form-helpers-credential-endpoint
