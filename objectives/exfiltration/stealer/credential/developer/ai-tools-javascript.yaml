defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
composite_rules:
- id: oauth-account-api-token-upload
  desc: Posts OAuth token pair to account API
  crit: suspicious
  conf: 0.97
  scope: file
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/token-auth::oauth-access-refresh-token-fields
  - id: micro-behaviors/communications/http/token-auth::post-accounts-api-call
- id: node-ai-tool-secret-exfil
  desc: Node exfiltrates AI tool secrets
  conf: 0.98
  near_bytes: 4096
  all:
  - id: objectives/credential-access/dev-tools/ai::ai-coding-tool-secret-harvest
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/form::formdata-file-stream
  - id: micro-behaviors/communications/http/form::form-data-append
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  - id: micro-behaviors/communications/http/curl/command::curl-command-url-or-option
- id: node-credential-file-curl-exfil
  desc: Reads a known credential file and stages it for HTTP upload
  conf: 0.96
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/credential/collection::any-credential-path
  - id: micro-behaviors/fs/read/file/content/whole::read-node
  any:
  - id: micro-behaviors/communications/http/upload/file::curl-form-file-attachment
  - id: micro-behaviors/communications/http/form::formdata-file-stream
  unless:
  - id: well-known/lib/development/swagger-typescript-api::swagger-typescript-api-banner
  - id: well-known/app/ai/tool-server/kie-mcp::official-package
