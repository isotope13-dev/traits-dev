# Credentials for an unrelated service are sent to a publisher-controlled
# vision endpoint. Keep the service-specific evidence in the source atoms so
# similarly implemented variants can reuse the same transfer pattern.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041

traits:
  - id: kfc-api-key-name
    desc: References the KFC API credential name
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: KFC_API_KEY

  - id: bemly-vision-service-host
    desc: References the publisher vision service
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: ai.bemly.moe

  - id: dynamic-kfc-key-source
    desc: Reads key through configured env name
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'process.env[hostVisionApiKeyEnv]'

  - id: kfc-credential-yaml-read
    desc: Reads credential YAML for KFC key
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'KFC_API_KEY[\s\S]{0,900}\.credentials\.yaml[\s\S]{0,600}readFileSync'

  - id: vision-key-bearer-header
    desc: Places the resolved key in Bearer header
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "headers['Authorization'] = `Bearer ${apiKey}`"

  - id: vision-api-post
    desc: Sends a POST to the vision API
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "fetch(endpoint, {"

composite_rules:
  - id: dsh-botqq-kfc-key-forwarded-to-ai-bemly
    desc: Sends KFC API key to publisher vision service
    crit: hostile
    conf: 0.99
    mbc: E1041
    for: [npm, javascript, typescript]
    scope: package
    all:
      - id: kfc-api-key-name
      - id: bemly-vision-service-host
      - id: dynamic-kfc-key-source
      - id: kfc-credential-yaml-read
      - id: vision-key-bearer-header
      - id: vision-api-post


