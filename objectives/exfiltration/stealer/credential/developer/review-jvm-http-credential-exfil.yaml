defaults:
  platforms:
  - unix
  - windows
  crit: hostile
  attack: T1041
composite_rules:
- for:
  - class
  id: jvm-agent-credential-http-exfil
  desc: Java agent uploads developer credentials
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/process/hook/instrumentation::java-agent-premain-entrypoint
  - id: micro-behaviors/fs/path/credential/collection::jvm-authentication-path-reference
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
  - id: micro-behaviors/fs/read/file/content/whole::java-readallbytes
- for:
  - kotlin
  id: kotlin-developer-credential-http-exfil
  desc: Kotlin package uploads developer credentials
  conf: 0.99
  # Archive aggregation already retains this member finding. Do not join a
  # local credential reader with an unrelated member's diagnostic HTTP client.
  scope: file
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/request/body/construction::jvm-http-body-write-source
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/fs/read/file/content/whole::java-readallbytes
  - id: micro-behaviors/communications/http/client/library::java-http-url-connection
- for:
  - class
  - java_class
  id: jvm-developer-credential-curl-exfil
  desc: JVM uploads developer credentials with curl
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/credential/collection::jvm-authentication-path-reference
  - id: micro-behaviors/fs/read/file/content/whole::java-readallbytes
  - id: micro-behaviors/communications/http/upload/file::jvm-curl-data-binary-string
