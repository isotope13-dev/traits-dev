defaults:
  platforms:
  - unix
  attack: T1552.004,T1005
  for:
  - python
composite_rules:
- id: python-ssh-key-and-history-collection
  desc: Python reads SSH private key and shell history
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/read/file/private-key::python-ssh-private-key-read-accumulate
  - id: micro-behaviors/fs/read/file/history::python-shell-history-read-accumulate
