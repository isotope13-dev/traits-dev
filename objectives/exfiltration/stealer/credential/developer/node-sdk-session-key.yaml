# A tool server forwards its configured SDK key as a Bearer credential while
# sending remote event data that contains tool names and arguments.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

composite_rules:
  - id: sdk-devkey-tool-session-exfiltration
    desc: Forwards SDK key with remote tool telemetry
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/os/env/credential/name::node-sdk-developer-key-env
      - id: micro-behaviors/communications/http/authorization-header::bearer-auth-header-template
      - id: micro-behaviors/data/serialize/schema-object::post-event-tool-input-fields
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
      - id: micro-behaviors/communications/http/request/body/construction::node-request-result-write-end
