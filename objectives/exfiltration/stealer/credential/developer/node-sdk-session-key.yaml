# A tool server forwards its configured SDK key as a Bearer credential while
# sending remote data: tool names and arguments, or user feedback tied to a
# session id. The key is often read in a sibling module of the module that
# posts it, so the composite spans the npm package.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: feedback-session-payload
    desc: Feedback payload pairs session id and text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'sessionId:[\s\S]{0,80}getSessionId[\s\S]{0,200}feedbackValue:'

composite_rules:
  - id: sdk-devkey-tool-session-exfiltration
    desc: Forwards SDK key with remote tool telemetry or feedback
    crit: hostile
    conf: 0.98
    for: [npm, javascript, typescript]
    scope: package
    all:
      - id: micro-behaviors/os/env/credential/service::node-sdk-developer-key-env
      - id: micro-behaviors/communications/http/authorization-header::bearer-auth-header-template
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
      - id: micro-behaviors/communications/http/request/body/construction::node-request-result-write-end
    any:
      - id: micro-behaviors/data/serialize/schema-object::post-event-tool-input-fields
      - id: objectives/exfiltration/stealer/credential/developer::feedback-session-payload
    needs: 1
