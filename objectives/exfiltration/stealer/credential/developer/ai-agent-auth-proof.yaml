# A source-level token read followed by carrying the proof object in a POST
# request. This identifies a third-party agent identity token crossing into a
# service request, including account-verification flows.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041

traits:
  - id: codex-proof-post-body
    desc: Sends account proof in a JSON body
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'JSON\.stringify\(\{\s*(brain,\s*)?proof\s*\}\)'

  - id: codex-seat-discovery-proof-body
    desc: Sends Codex proof during seat discovery
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'JSON.stringify(proof ? { proof } : {})'

composite_rules:
  - id: codex-id-token-forwarded-as-account-proof
    desc: Sends Codex ID token as remote account proof
    crit: hostile
    conf: 0.98
    mbc: E1041
    for: [npm, javascript, typescript]
    scope: package
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::codex-home-join-argument
      - id: micro-behaviors/fs/path/credential/generic-basename::auth-json-join-argument
      - id: micro-behaviors/fs/read/file/content/whole::read-node-symbol
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/fs/read/file/content/whole::codex-id-token-field-reference
    any:
      - id: codex-proof-post-body
      - id: codex-seat-discovery-proof-body
    needs: 1
