# A source-level token read followed by carrying the proof object in a POST
# request. This identifies a third-party agent identity token crossing into a
# service request, including account-verification flows.
# Keep the read and transfer evidence in one source file: a package-wide join
# can combine an unrelated login reader with another module's proof POST.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041

traits:
  - id: codex-proof-post-body
    desc: Serializes account proof as JSON
    crit: notable
    conf: 0.99
    attack: none
    if:
      type: text
      regex: 'JSON\.stringify\(\{\s*(brain,\s*)?proof\s*\}\)'

  - id: codex-seat-discovery-proof-body
    desc: Serializes optional account proof as JSON
    crit: notable
    conf: 0.99
    attack: none
    if:
      type: text
      substr: 'JSON.stringify(proof ? { proof } : {})'

composite_rules:
  - id: codex-id-token-forwarded-as-account-proof
    desc: Sends Codex ID token as remote account proof
    crit: hostile
    conf: 0.98
    mbc: E1041
    scope: file
    all:
      - id: objectives/credential-access/dev-tools/ai::codex-id-token-read-from-auth-file
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: codex-proof-post-body
      - id: codex-seat-discovery-proof-body
    needs: 1
