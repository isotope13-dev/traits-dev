defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  attack: T1041,T1552.001
composite_rules:
- id: python-whois-developer-credential-exfil
  desc: WHOIS resolver accompanies credential collection and HTTP POST
  crit: hostile
  conf: 0.98
  scope: file
  near_lines: 60
  all:
  - id: objectives/command-and-control/channel/deaddrop/public-service::source-whois-ipv4-dead-drop
  - id: objectives/credential-access/env/secrets/filtered-access::python-bulk-secret-env-harvest
  - id: micro-behaviors/fs/path/credential/collection::developer-auth-file-reference
  - id: micro-behaviors/fs/read/file/content/whole::python-file-content-read-operation
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
