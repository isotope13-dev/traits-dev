defaults:
  platforms: [unix, windows]
  for: [go]
composite_rules:
  # The flow graph tracks ReadFile -> Write and NewReader -> Post, but
  # does not yet track mutations of bytes.Buffer. Report the relationship
  # we can establish rather than claiming end-to-end credential flow.
  - id: go-credential-read-buffered-post
    desc: Credential-file reads beside buffered HTTP upload
    crit: suspicious
    conf: 0.95
    attack: T1552.001,T1041
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/credential/registry::package-manager-config-path-marker
      - id: micro-behaviors/data/buffer/transfer::go-file-content-write
      - id: micro-behaviors/communications/http/request/body/source::go-http-post-buffer-reader
