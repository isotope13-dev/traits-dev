defaults:
  platforms:
  - unix
  attack: T1552.001,T1041
  for:
  - shell
composite_rules:
- id: shell-git-credentials-curl-post
  desc: Shell posts Git credentials with curl
  crit: hostile
  conf: 0.95
  near_lines: 2
  all:
  - id: micro-behaviors/fs/read/file/credential::shell-cat-git-credentials
  - id: micro-behaviors/communications/http/request/body/construction::curl-data-binary-stdin
# `git credential fill` returns stored host credentials. Piping that output
# into a curl stdin upload is the exfiltration handoff, with no .git-credentials
# file read needed. The helper leg matches fill or get on the same two lines.
- id: shell-git-credential-fill-curl-post
  desc: Shell pipes git credential fill output to curl POST
  crit: hostile
  conf: 0.95
  near_lines: 2
  all:
  - id: micro-behaviors/os/security/credential-manager::git-credential-helper-invocation
  - id: micro-behaviors/communications/http/request/body/construction::curl-data-binary-stdin
