defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1041
traits:
- id: chatclub-claude-oauth-file
  desc: Reads Claude OAuth credential files
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: CREDENTIAL_FILES=[\s\S]{0,500}\.credentials\.json
- id: chatclub-claude-usage-relay
  desc: Uploads intercepted Claude usage data
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: uploadUsageStats
- id: chatclub-credential-file-shim
  desc: Replaces Claude credential file reads
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /CREDENTIAL_FILES/
          $b0_1 = /fakeData\(\)/
        condition:
          (for any i0 in (1..#b0_0) : ( for any i1 in (1..#b0_1) : ( @b0_1[i1] >= @b0_0[i0] + !b0_0[i0] + 0 and @b0_1[i1] <= @b0_0[i0] + !b0_0[i0] + 1200 and true ) ))
      }
- id: chatclub-proxy-service-host
  desc: Uses the ChatGPT Claude proxy service
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: chatgptclaude.club
- id: chatclub-cli-interceptor-preload
  desc: Preloads a CLI request interceptor
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: --require[\s\S]{0,160}interceptor\.cjs
composite_rules:
- id: chatclub-claude-credential-proxy-relay
  desc: Claude credential wrapper relays API usage data
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  scope: archive
  all:
  - id: objectives/exfiltration/stealer/credential/developer::chatclub-proxy-service-host
  - id: micro-behaviors/communications/http/request/url::claude-proxy-usage-upload-path
  - id: micro-behaviors/os/sysinfo/hardware::js-multisource-hardware-identifier-collection
  - id: micro-behaviors/communications/websocket/endpoints::plaintext-websocket-token-template
