defaults:
  platforms: [unix]
  for: [perl]
  attack: T1041
  mbc: E1020

composite_rules:
  - id: perl-env-cloud-http-exfil
    desc: Perl env cloud HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/json::perl-http-json-socket-post
      - id: objectives/credential-access/env/secrets/filtered-access::perl-sensitive-env-loop
    any:
      - id: micro-behaviors/fs/path/token::aws-credentials
      - id: micro-behaviors/communications/http/post::post-request-line
