defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1041

traits:
  - id: native-token-post-endpoint
    desc: Token processing endpoint query
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'type=tknsprc&security=2'
  - id: native-encrypted-token-body
    desc: Encrypted token data used as HTTP body
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'wrap::Body\s*\{\s*TKNdataEncrypted\s*\}'
  - id: native-token-data-assembly
    desc: Token data assembled with Tokenno value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'TKNdata\s*=[^;\nT]{0,200}\bTokenno\b'

composite_rules:
  - id: native-encrypted-token-post
    desc: Token endpoint and encrypted token body in HTTPS request
    crit: hostile
    conf: 0.97
    near_lines: 12
    all:
      - id: native-token-post-endpoint
      - id: native-encrypted-token-body
      - id: native-token-data-assembly
      - id: micro-behaviors/communications/http/client/library::native-wrap-https-request
