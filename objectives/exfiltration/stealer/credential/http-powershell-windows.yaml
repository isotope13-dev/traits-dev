defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows]
  for: [powershell]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: ps-credential-collect-http-exfil
    desc: PowerShell credential HTTP exfil
    all:
      - id: objectives/exfiltration/http/collect::ps-send-exfil-function
      - id: micro-behaviors/communications/http/client/library::irm-name
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-post-method
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-param
    any:
      - id: micro-behaviors/os/security/credential-manager::ps-windows-credential-manager-list
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: objectives/credential-access/shell/history::powershell-history-theft
      - id: objectives/credential-access/env/secrets/bulk-access::ps-bulk-env-secret-harvest
      - id: objectives/credential-access/ssh/key::powershell-ssh-private-key-harvest
      - id: objectives/credential-access/windows-registry/security-keys::ps-lsa-secrets-registry-access
      - id: micro-behaviors/os/registry/keys::ps-winlogon-autologon-secrets
    needs: 2
  - id: ps-credential-archive-http-exfil
    desc: PowerShell credential archive exfil
    all:
      - id: objectives/exfiltration/http/archive::ps-zip-body-upload
    needs: 2
    any:
      - id: micro-behaviors/os/security/credential-manager::ps-cmdkey-list-command
      - id: objectives/credential-access/wifi::netsh-wifi-password-extraction
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/token::aws-credentials
      - id: micro-behaviors/fs/path/secret-config::aws-config
  # Document-and-key stealer shape: a recursive file sweep that explicitly
  # targets private-key material, staged into an archive and uploaded over
  # HTTP. Backup tools sweep and upload too, but they do not hunt pem/ppk
  # keys; the credential-files leg is what separates theft from backup.
