defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: encoded-wallet-secret-forwarded-to-logger
    desc: Encodes secret and sends it to logger
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'bs58_\w+\.default\.encode\s*\(\s*\w+\.secretKey'

  - id: encoded-secret-in-log-message
    desc: Includes encoded keypair in log message
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'log\s*\)\s*\([^)]{0,100}\$\{keypair\}'

  - id: hardcoded-telegram-bot-client-construction
    desc: Instantiates bot client with hardcoded token
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'new\s+Console\s*\(exports\.CONSOLE_ID'

  - id: telegram-bot-sendmessage-call
    desc: Sends message through bot client
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'console\.sendMessage\s*\('

composite_rules:
  - id: wallet-private-key-logged
    desc: Logs a base58-encoded wallet private key
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential::encoded-wallet-secret-forwarded-to-logger
      - id: objectives/exfiltration/stealer/credential::encoded-secret-in-log-message

  - id: node-telegram-wallet-secret-exfiltration
    for: [npm, tar, javascript]
    desc: Sends an encoded wallet secret to a Telegram bot
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/credential::encoded-wallet-secret-forwarded-to-logger
      - id: objectives/exfiltration/stealer/credential::encoded-secret-in-log-message
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
      - id: objectives/exfiltration/stealer/credential::hardcoded-telegram-bot-client-construction
      - id: objectives/exfiltration/stealer/credential::telegram-bot-sendmessage-call
