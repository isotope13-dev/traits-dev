defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
  attack: "T1555.003"

composite_rules:
  - id: js-discord-credential-stealer
    desc: Credential-store traversal with a Discord webhook
    conf: 0.98
    all:
    - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
    - id: objectives/exfiltration/messaging/webhook::discord-webhook-pattern
    any:
    - id: objectives/credential-access/browser/chromium/
    - id: objectives/credential-access/browser/app-bound/
    - id: objectives/credential-access/browser/devtools/
    - id: objectives/credential-access/browser/loot::browsers-info-artifact
    - id: objectives/credential-access/browser/loot::appbound-key-artifact
    - id: objectives/credential-access/browser/loot::decrypted-browser-key-artifact
    - id: objectives/credential-access/browser/loot::browser-secret-record-tags
    - id: objectives/credential-access/cloud/token/files::js-recursive-cloud-credential-scan
