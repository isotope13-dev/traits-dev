# Exfiltration to a code-repository drop: harvested secrets pushed through
# the GitHub repository contents API. The Shai-Hulud / keyv-family worm
# uploaded RSA-encrypted credential bundles to attacker-created public GitHub
# repos ("drop repos"), leaning on github.com as trusted infrastructure —
# only the repo name changes between waves, which is exactly why the rule
# keys on the write flow plus a secret-bearing source path, never on a repo
# or account name.
defaults:
  platforms: [unix, windows]
  attack: "T1041,T1567.001"

composite_rules:
  # One or more secret-bearing path references: developer credential files,
  # cloud provider configs, or SSH key material. A single leg of the hostile
  # composite below; naming a path is dual-use until paired with the upload.
  - id: sensitive-secret-path-any
    desc: References a credential or key file path
    crit: component
    conf: 0.9
    for: [scripts, source]
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials/
      - id: micro-behaviors/fs/path/sensitive/cloud/
      - id: micro-behaviors/fs/path/sensitive/ssh/

  - id: github-repo-credential-exfil
    desc: Uploads harvested secrets to a GitHub repository
    crit: hostile
    conf: 0.96
    mbc: "E1041"
    all:
      - id: sensitive-secret-path-any
    any:
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
      - id: micro-behaviors/communications/http/services/github::github-create-or-update-file-contents
    unless:
      # Bundled SDKs pool an unrelated credentials-path string and a GitHub
      # client's contents-write descriptor into one file; that is not a steal.
      - id: metadata/library/structure/
