# The archive contains a startup import, cloud credential references, a file
# read, and a JSON HTTP body. These are archive-level co-occurrences; they do
# not establish that the startup import reaches the reader or the request.
defaults:
  platforms: [unix, windows, macos]
  for: [whl, python]
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1552.004,T1041
  mbc: E1552

composite_rules:
  - id: wheel-startup-hook-credential-store-sweep
    desc: Wheel hook and cloud-store read/HTTP references
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/os/env/cloud::gcp-application-credentials-env-name
      - id: micro-behaviors/fs/path/secret-config::docker-config-path-reference
      - id: micro-behaviors/fs/path/secret-config::gcp-default-credentials
      - id: micro-behaviors/data/serialize/json::json-dumps-call
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: micro-behaviors/communications/http/request/json::python-json-body-transport
