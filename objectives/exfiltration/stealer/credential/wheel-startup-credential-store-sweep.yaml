# A published wheel that installs an interpreter startup hook and, from that
# hook's module, collects the standard cloud and container credential stores
# into one serialized event payload: GOOGLE_APPLICATION_CREDENTIALS, the
# Docker registry auth config (including DOCKER_CONFIG and the /builder,
# /workspace, /root and /home/cnb locations used by Google Cloud Build), and
# gcloud application-default credentials. Client libraries read one of these
# lazily to authenticate; a startup hook that sweeps all of them into an
# outbound JSON document is harvesting credentials.
defaults:
  platforms: [unix, windows, macos]
  for: [whl, python]
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1552.004,T1041
  mbc: E1552

composite_rules:
  - id: wheel-startup-hook-credential-store-sweep
    desc: Wheel startup hook sweeps cloud and registry credential stores
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/os/env/cloud::gcp-application-credentials-env-name
      - id: micro-behaviors/fs/path/secret-config::docker-config-path-reference
      - id: micro-behaviors/fs/path/secret-config::gcp-default-credentials
      - id: micro-behaviors/data/serialize/json::json-dumps-call
    unless:
      - id: metadata/package/testing/
