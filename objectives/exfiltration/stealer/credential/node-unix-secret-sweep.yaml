defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-unix-secret-http-exfil
    desc: Node Unix secret HTTP exfil
    crit: hostile
    conf: 0.98
    # Source and destination are separate roles. Two endpoints, or two local
    # credential stores, must not satisfy a completed export by themselves.
    all:
      - id: micro-behaviors/communications/http/url/endpoint::node-collect-or-exfil-endpoint
    any:
      - id: micro-behaviors/fs/path/config/accounts::node-bsd-password-stores
      - id: micro-behaviors/fs/path/public-key::node-root-ssh-targets
      - id: micro-behaviors/fs/path/password-store::chromium-firefox-login-file-references
      - id: micro-behaviors/os/env/secret-name::node-env-secret-filter
