# Wallet keyring exfiltration before local encryption.
#
# Malicious wallet extensions have patched otherwise legitimate persistence
# routines so the complete serialized keyring is uploaded before the original
# encryption-and-storage path continues.  Match the data flow rather than a
# campaign hostname, request field name, or wallet-specific function name so
# the same technique remains visible across source languages and platforms.
defaults:
  platforms: [unix, windows]
  # The structural forms below cover JavaScript/TypeScript object bodies and
  # Python requests keyword arguments without relying on wallet vendor names.
  for: [javascript, typescript, python]
  attack: T1041,T1555

traits:
- id: wallet-keyring-send-before-encryption-order
  desc: Sends keyrings before local encryption
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: '(?is)(fetch|post|request)\s*\(.{0,700}keyring.{0,700}encrypt\s*\(.{0,300}keyring'

- id: wallet-keyring-send-before-sealing-order
  desc: Sends keyrings before local sealing
  crit: suspicious
  conf: 0.99
  if:
    type: text
    # The keyring has to be an argument of the send call. A later
    # `keyring.seal(...)` in the same file is local storage, and a
    # case-insensitive `request` also matches the Request constructor.
    regex: '(?s)(\bfetch|\.post)\([^)]{0,240}keyring[^)]{0,80}\).{0,200}seal\([^)]{0,80}keyring'

composite_rules:
- id: serialized-wallet-keyring-http-exfiltration
  desc: Exfiltrates serialized wallet keyrings over HTTP
  crit: hostile
  conf: 0.99
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/serialize/schema-credential::serialized-wallet-keyring-assignment
  - id: micro-behaviors/communications/http/request/body/application-state::serialized-wallet-keyring-payload-field
  - id: micro-behaviors/communications/http/client/exchange::script-http-client-send

- id: pre-encryption-wallet-keyring-http-exfiltration
  desc: Uploads wallet keyrings before local encryption
  crit: hostile
  conf: 0.995
  scope: file
  near_bytes: 4096
  all:
  - id: serialized-wallet-keyring-http-exfiltration
  any:
  - id: wallet-keyring-send-before-encryption-order
  - id: wallet-keyring-send-before-sealing-order
