# The observed persistence hook serializes every keyring, evaluates a cooked
# string that POSTs that local array, then continues the original encryption.
# These predicates identify that strong local profile; they do not claim a
# general cross-parser binding proof between the source and the string's code.
# No hostname, request-field name, publisher or outer filename gates it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: eval-literal-keyring-http-export
    desc: Keyring serialization beside HTTP POST eval
    crit: hostile
    conf: 0.98
    attack: T1041,T1555
    scope: leaf
    near_bytes: 1800
    all:
      - id: micro-behaviors/data/serialize/schema-credential::keyring-map-serialize-calls
      - id: micro-behaviors/communications/http/request/body/construction::literal-fetch-post-json-variable-record
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
