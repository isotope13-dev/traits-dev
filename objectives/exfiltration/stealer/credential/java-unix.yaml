defaults:
  platforms: [unix]
  for: [java, class, jar]
  attack: T1041

composite_rules:
  - id: java-command-sensitive-exfil
    desc: Java command sensitive exfil
    crit: hostile
    conf: 0.98
    for: [shell, java, class, jar]
    all:
      - id: micro-behaviors/fs/path/credential::account-and-root-ssh-path-pair
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: jvm-netbsd-sensitive-exfil
    desc: JVM NetBSD sensitive exfil
    crit: hostile
    conf: 0.98
    for: [class, jar]
    all:
      - id: micro-behaviors/fs/path/config/accounts::bsd-master-passwd-path
      - id: micro-behaviors/fs/path/private-key::jvm-root-id-rsa-hex
      - id: micro-behaviors/communications/http/url/telemetry::jvm-collect-path
