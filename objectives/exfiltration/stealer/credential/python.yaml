# Browser-session credential access and use. The combination below is
# specific to code that reads a browser context's cookies, evaluates page
# state, and sends requests through that authenticated context.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1539
composite_rules:
- id: slash-encoded-browser-credential-telegram-exfil
  desc: Custom-encoded browser credentials are uploaded through Telegram
  crit: hostile
  conf: 0.99
  mbc: E1041
  attack: T1555.003,T1567.001,T1027
  for: [pyc]
  platforms: [windows]
  all:
  - id: objectives/credential-access/browser/chromium::slash-encoded-password-value-field
  - id: micro-behaviors/os/security/dpapi::slash-encoded-crypt-unprotect-data
  - id: micro-behaviors/communications/http/services/telegram::slash-encoded-telegram-api-host
  - id: micro-behaviors/communications/messaging/send::slash-encoded-send-document
  - id: objectives/anti-static/obfuscation/encoding/custom::slash-delimited-utf8-hex

  # Reading a password or cookie query, sending a structured POST, and invoking
  # the collector at module load is a complete steal-and-send chain. Requiring
  # the column-specific SQL avoids cross-pairing a generic table query with an
  # unrelated browser path elsewhere in the file.
