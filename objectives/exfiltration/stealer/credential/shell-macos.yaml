defaults:
  platforms: [unix]
  for: [shell]
  attack: T1041

composite_rules:
  - id: shell-macos-cloud-info-exfil
    desc: Shell macOS cloud info exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/encoded::shell-compressed-cloud-upload
    any:
      - id: micro-behaviors/os/security/keychain::macos-keychain-dump-command
      - id: micro-behaviors/fs/path/application/browser::chrome-profile-path
      - id: micro-behaviors/fs/path/secret-config::ssh-dir
    needs: 1
