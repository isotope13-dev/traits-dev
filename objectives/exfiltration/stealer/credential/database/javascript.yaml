defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1005
  mbc: E1041

composite_rules:
  - id: js-secret-database-rows-oob-exfil
    desc: Secret-bearing database rows posted to OOB endpoint
    crit: hostile
    conf: 0.99
    near_bytes: 900
    all:
      - id: objectives/collection/database/secret-records::sql-selects-encrypted-key-fields
      - id: micro-behaviors/data/serialize/json::json-stringify-result-rows
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
