# Clipboard Exfiltration - JavaScript/Node.js
# Clipboard capture with network exfiltration (collection + network = exfiltration)
# ATT&CK: T1115 (Clipboard Data) + T1041 (Exfiltration Over C2 Channel)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
traits:
  - id: clipboard-chunk-order-marker
    desc: Ordered chunk upload query fields
    crit: suspicious
    conf: 0.95
    platforms: [windows, unix]
    if:
      type: text
      regex: '[\"'']uid[\"'']\s*,\s*[\"'']part[\"'']\s*,\s*[\"'']total[\"'']\s*,\s*[\"'']data[\"'']'

composite_rules:
  # A browser extension that periodically reads clipboard text, URL-encodes
  # it, and sends it with fetch is an exfiltration workflow. Evaluate this
  # only on parsed JavaScript; compressed package bytes are not a valid
  # evidence surface for JavaScript behavior.
  - id: browser-clipboard-http-exfil
    desc: Browser clipboard data sent over HTTP
    crit: hostile
    conf: 0.98
    attack: T1041,T1115
    scope: file
    # Polling plus encodeURIComponent+fetch is the steal loop. A one-shot
    # paste-to-search GET is not this workflow; keep the window wide enough
    # to cover the timer, the clipboard read, and the request together.
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/clipboard/monitor::javascript-clipboard-polling
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::fetch-get-call

  - id: js-clipboard-monitor-command
    desc: "JavaScript clipboard command access"
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/os/clipboard/access::node-pbpaste-read
      - id: micro-behaviors/os/clipboard/access::node-powershell-get-clipboard
      - id: micro-behaviors/os/clipboard/access::node-xclip-read
  - id: js-clipboard-exfil
    desc: "JavaScript clipboard capture exfiltration"
    crit: hostile
    conf: 0.95
    mbc: "B0014"
    attack: "T1041"
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    any:
      - id: micro-behaviors/os/clipboard/access::node-pbpaste-read
      - id: micro-behaviors/os/clipboard/access::node-powershell-get-clipboard
      - id: micro-behaviors/os/clipboard/access::node-xclip-read
  - id: js-clipboard-exfil-external-ip
    desc: "JavaScript clipboard exfiltrates to IP"
    crit: hostile
    conf: 0.97
    mbc: "B0014"
    attack: "T1041"
    near_bytes: 32768
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: js-clipboard-monitor-command
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/lib/axios::axios
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    needs: 1

  - id: browser-clipboard-chunked-http-exfil
    desc: Browser clipboard chunks sent over HTTP
    crit: hostile
    conf: 0.99
    attack: T1041,T1115
    mbc: B0014
    platforms: [windows, unix]
    # Keep this correlation within one parsed JavaScript file.  Archive scope
    # would promote a child-file match back onto a compressed package root,
    # where unrelated archive bytes can inherit the hostile verdict.
    scope: file
    all:
      - id: browser-clipboard-http-exfil
      - id: clipboard-chunk-order-marker
