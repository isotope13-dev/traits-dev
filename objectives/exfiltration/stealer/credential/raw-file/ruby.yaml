# Ruby script reads several cloud, container, SSH or account credential
# stores and posts over HTTPS with certificate verification disabled.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1552.001,T1041

composite_rules:
  - id: ruby-credential-store-read-unverified-post
    desc: Reads credential stores and posts them out
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
    any:
      - id: micro-behaviors/fs/path/secret-config::aws-config-directory-literal
      - id: micro-behaviors/fs/path/secret-config::docker-config-path-reference
      - id: micro-behaviors/fs/path/secret-config::gcp-default-credentials
      - id: micro-behaviors/fs/path/secret-config::kube-config
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-rsa
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-ed25519
      - id: micro-behaviors/fs/path/account-db::ruby-shadow-path-literal
    needs: 3
