defaults:
  for: [lua]
  platforms: [unix, windows]
traits:
  - id: lua-secret-file-http-upload
    desc: Lua uploads data from a secret-file loop
    crit: hostile
    conf: 0.98
    if:
      type: tree-sitter
      language: lua
      query: |
        ((function_declaration body: (block
          (variable_declaration (assignment_statement
            (variable_list (identifier) @sources)
            (expression_list (table_constructor
              (field value: (table_constructor
                (field name: (identifier) @pathfield value:
                  [(string) @secret (binary_expression right: (string) @secret)])))))))
          (for_statement
            clause: (for_generic_clause
              (variable_list . (identifier) . (identifier) @entry .)
              (expression_list (function_call name: (identifier) @iter
                arguments: (arguments . (identifier) @iterable .))))
            body: (block
              (variable_declaration (assignment_statement
                (variable_list . (identifier) @file .)
                (expression_list (function_call name: (dot_index_expression) @open
                  arguments: (arguments . (dot_index_expression table: (identifier) @usedentry
                    field: (identifier) @usedfield) . (string) @mode .)))))
              . (if_statement condition: (identifier) @checked consequence: (block
                . (variable_declaration (assignment_statement
                  (variable_list . (identifier) @body .)
                  (expression_list (function_call name: (method_index_expression
                    table: (identifier) @reader method: (identifier) @read)
                    arguments: (arguments . (string) @all .)))))
                . (function_call name: (method_index_expression
                  table: (identifier) @closer method: (identifier) @close))
                . (if_statement consequence: (block
                  . (variable_declaration (assignment_statement
                    (variable_list . (identifier) @headers .)
                    (expression_list (table_constructor))))
                  . (variable_declaration (assignment_statement
                    (expression_list (function_call name: (dot_index_expression) @request
                      arguments: (arguments . (_) . (identifier) @sent . (identifier) @sentheaders .)))))))))))))
          (#eq? @sources @iterable) (#eq? @iter "ipairs")
          (#eq? @entry @usedentry) (#eq? @pathfield @usedfield)
          (#eq? @open "io.open") (#match? @secret "/(\\.netrc|\\.ssh/id_(rsa|ed25519))[\"']$")
          (#match? @mode "[\"']rb?[\"']") (#match? @all "[\"']\\*a[\"']")
          (#eq? @file @checked) (#eq? @file @reader) (#eq? @file @closer)
          (#eq? @read "read") (#eq? @close "close")
          (#eq? @request "http.request") (#eq? @body @sent) (#eq? @headers @sentheaders)
          (#set! cleave.ignore-comments "true"))
