# Bound process-secret observations; hostile verdict also requires build activation.
# Variable bindings and adjacent scopes reject unrelated/shadowed collectors.
# No package name, hash, credential value or fixed remote endpoint.
defaults:
  platforms:
  - unix
  for:
  - rust
traits:
- id: rust-proc-secret-buffer-post-source
  desc: Posts a bound process-secret collection buffer
  crit: suspicious
  conf: 0.98
  attack: T1041,T1552
  if:
    type: tree-sitter
    language: rust
    query: |
      ((function_item body: (block (expression_statement (if_expression condition: (let_condition pattern: (tuple_struct_pattern type: (identifier) @ok_entries (identifier) @entries) value: (call_expression function: (scoped_identifier) @read_dir arguments: (arguments (string_literal) @proc))) consequence: (block . (expression_statement (for_expression pattern: (identifier) @entry value: (call_expression function: (field_expression value: (identifier) @entries_used field: (field_identifier) @flatten) arguments: (arguments )) body: (block . (let_declaration pattern: (identifier) @path value: (call_expression function: (field_expression value: (call_expression function: (field_expression value: (identifier) @entry_used field: (field_identifier) @path_method) arguments: (arguments )) field: (field_identifier) @join) arguments: (arguments (string_literal) @cmdline))) . (expression_statement (if_expression condition: (let_condition pattern: (tuple_struct_pattern type: (identifier) @ok_data (identifier) @data) value: (call_expression function: (scoped_identifier) @read arguments: (arguments (reference_expression value: (identifier) @path_used)))) consequence: (block . (let_declaration pattern: (identifier) @line value: (call_expression function: (scoped_identifier) @utf8 arguments: (arguments (reference_expression value: (identifier) @data_used)))) . (expression_statement (if_expression condition: (call_expression function: (field_expression value: (identifier) @line_filter field: (field_identifier) @contains_line) arguments: (arguments (string_literal) @secret_line)) consequence: (block . (let_declaration pattern: (identifier) @argv value: (call_expression function: (field_expression value: (call_expression function: (field_expression value: (identifier) @line_split field: (field_identifier) @split) arguments: (arguments (char_literal) @nul)) field: (field_identifier) @collect) arguments: (arguments ))) . (expression_statement (for_expression pattern: (identifier) @index_loop value: (_) @range body: (block . (expression_statement (if_expression condition: (call_expression function: (field_expression value: (index_expression (identifier) @args_filter (identifier) @index_filter) field: (field_identifier) @contains_arg) arguments: (arguments (string_literal) @secret_arg)) consequence: (block . (expression_statement (call_expression function: (field_expression value: (identifier) @collector field: (field_identifier) @append) arguments: (arguments (reference_expression value: (macro_invocation macro: (identifier) @formatter (token_tree (string_literal) @label (identifier) @args_next (token_tree (identifier) @index_next "+" (integer_literal) @one))))))) .))) .))) .))) .))) .))) .))) . (let_declaration value: (call_expression function: (field_expression value: (call_expression function: (field_expression value: (call_expression function: (scoped_identifier) @constructor arguments: (arguments (string_literal) @tool)) field: (field_identifier) @args_method) arguments: (arguments (reference_expression value: (array_expression (string_literal) @data_flag . (reference_expression value: (identifier) @body_used) . (string_literal) @endpoint)))) field: (field_identifier) @run_method) arguments: (arguments ))))) @export
        (#eq? @ok_entries "Ok")
        (#eq? @ok_data "Ok")
        (#eq? @cmdline "\"cmdline\"")
        (#eq? @proc "\"/proc\"")
        (#eq? @one "1")
        (#eq? @formatter "format")
        (#eq? @append "push_str")
        (#eq? @join "join")
        (#eq? @path_method "path")
        (#eq? @flatten "flatten")
        (#eq? @split "split")
        (#eq? @collect "collect")
        (#eq? @contains_arg "contains")
        (#eq? @contains_line "contains")
        (#eq? @nul "'\\0'")
        (#eq? @entries @entries_used)
        (#eq? @entry @entry_used)
        (#eq? @path @path_used)
        (#eq? @data @data_used)
        (#eq? @line @line_filter)
        (#eq? @line @line_split)
        (#eq? @argv @args_filter)
        (#eq? @argv @args_next)
        (#eq? @index_loop @index_filter)
        (#eq? @index_loop @index_next)
        (#eq? @secret_line @secret_arg)
        (#match? @read_dir "^(std::)?fs::read_dir$")
        (#match? @read "^(std::)?fs::read$")
        (#match? @utf8 "^String::from_utf8_lossy$")
        (#match? @secret_arg "(?i)(private[-_]key|secret[-_]key|password|access[-_]token)")
        (#eq? @collector @body_used)
        (#eq? @tool "\"curl\"")
        (#eq? @args_method "args")
        (#match? @constructor "(^|::)Command::new$")
        (#match? @run_method "^(output|status)$")
        (#match? @data_flag "^\"(-d|--data|--data-raw|--data-binary)\"$")
        (#match? @endpoint "^\"https?://"))
composite_rules:
- id: rust-proc-secret-buffer-post
  desc: Posts harvested process-argument secrets
  crit: hostile
  conf: 0.98
  all:
  - id: rust-proc-secret-buffer-post-source
  - id: objectives/credential-access/dump/process::rust-proc-secret-argument-harvest
