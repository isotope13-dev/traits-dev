# DPAPI credential stealer
# Decrypting a DPAPI-sealed secret (win32crypt.CryptUnprotectData) and then
# shipping the cleartext to an attacker-controlled Discord webhook is a complete
# steal-and-send chain with no legitimate use.
# ATT&CK: T1555.003 (Credentials from Web Browsers) + T1567 (Exfil over Web Service)
defaults:
  for: [python, source]
  platforms: [windows]

composite_rules:
  - id: dpapi-secret-webhook-export
    for: [python]
    desc: "DPAPI secrets with Discord webhook"
    crit: hostile
    conf: 0.95
    attack: T1567.002
    all:
      - id: micro-behaviors/os/security/dpapi::python-dpapi-unprotect
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-split
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-api-path
      - id: micro-behaviors/communications/http/webhook::python-xor-discord-webhook-decoder
  - id: python-xor-webhook-stolen-data-upload
    desc: XOR-hidden webhook receives stolen data upload
    crit: hostile
    conf: 0.97
    attack: T1555.003,T1539,T1041,T1567.002
    scope: archive
    for: [python, whl, python-sdist]
    all:
      - id: micro-behaviors/communications/http/webhook::python-xor-discord-webhook-decoder
      - id: micro-behaviors/communications/http/upload::python-http-files-parameter
    any:
      - id: micro-behaviors/os/security/dpapi::python-dpapi-unprotect
      - id: objectives/credential-access/discord/token::python-leveldb-token-read-profile
      - id: objectives/credential-access/browser/chromium::python-dpapi-chromium-login-decrypt
