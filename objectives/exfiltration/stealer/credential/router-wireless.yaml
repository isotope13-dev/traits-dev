# Source-to-send Wi-Fi credential theft from a compromised Broadcom
# gateway: the network's own pre-shared key is read out of router NVRAM,
# hex-encoded, and carried off inside 802.11 action frames, letting the
# attacker simply join the WLAN with the stolen key afterwards.
defaults:
  platforms: [unix, appliance]
  for: [shell, python, c, cpp, go, rust]
  attack: T1048
  crit: hostile
  conf: 0.98

composite_rules:
  - id: router-wifi-psk-wireless-theft
    desc: Steals router Wi-Fi PSK over 802.11 frames
    crit: hostile
    conf: 0.98
    near_lines: 60
    all:
      - id: micro-behaviors/hardware/wireless/network::nvram-wifi-psk-read
      - id: micro-behaviors/hardware/wireless/network::wl-actframe-hex-shell-output
