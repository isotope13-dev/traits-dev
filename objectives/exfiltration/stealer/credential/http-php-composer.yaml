defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001,T1041

composite_rules:
- id: composer-developer-credential-http-exfil
  desc: Composer package exfils developer credentials
  crit: hostile
  conf: 0.99
  # File scope: at archive scope this assembled a hostile verdict from
  # unrelated files (a test fixture's example POST plus another file's
  # legitimate composer-token GitHub auth). Co-occurrence is not data flow.
  scope: file
  all:
  - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  - id: micro-behaviors/data/serialize/json::php-json-encode
  any:
  - id: micro-behaviors/fs/path/secret-config::composer-auth-file
  - id: micro-behaviors/fs/path/secret-config::docker-config
  - id: micro-behaviors/fs/path/secret-config::netrc

- id: php-developer-credential-file-http-post
  desc: PHP reads developer credential files and posts collected contents
  crit: hostile
  conf: 0.98
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/path/developer-credential::developer-auth-file-reference
  - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  any:
  - id: micro-behaviors/communications/http/request/body/credential::php-body-file-content-post-flow
  - id: micro-behaviors/communications/http/request/body/credential::php-payload-file-content-post-flow
  - id: micro-behaviors/communications/http/request/body/credential::php-data-file-content-post-flow
  - id: micro-behaviors/communications/http/request/body/credential::php-request-body-file-content-post-flow
  - id: micro-behaviors/communications/http/request/body/credential::php-post-data-file-content-post-flow
  - id: micro-behaviors/communications/http/request/body/credential::php-report-file-content-post-flow
  needs: 1
