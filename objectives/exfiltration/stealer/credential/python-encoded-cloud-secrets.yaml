defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: "T1041"

composite_rules:
- id: encoded-python-cloud-secret-exfil
  desc: Encoded Python cloud secret exfiltration
  crit: hostile
  conf: 0.98
  platforms: [unix]
  all:
  - id: micro-behaviors/communications/http/upload::encoded-curl-file-upload
  - id: micro-behaviors/fs/path/credential::encoded-cloud-or-registry-path-cluster
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::python-exec-base64-result
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: metadata/file/line::single-long-line-outlier
- id: base64-python-cloud-secret-exfil
  desc: Base64 cloud secret upload
  crit: hostile
  conf: 0.98
  platforms: [unix]
  all:
  - id: objectives/exfiltration/http/encoded::b64-curl-data-binary-upload
  - id: micro-behaviors/process/interpreter/eval/direct::python-exec-base64-result
  needs: 2
  any:
  - id: objectives/credential-access/cloud/container::b64-aws-container-credentials
  - id: micro-behaviors/fs/path/credential::base64-kubernetes-serviceaccount-directory
  - id: objectives/credential-access/files/config::encoded-package-credential-file-references
