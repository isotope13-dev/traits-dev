defaults:
  for: [html, javascript, vbs, mirc]
  platforms: [windows]
traits:
  - id: mirc-nickserv-password-disclosure
    desc: mIRC discloses NickServ password via PRIVMSG
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\.sockwrite[^\r\n]{1,80}PRIVMSG[^\r\n]{1,140}ns pass[^\r\n]{1,120}%[a-z0-9_.]*pass'
composite_rules:
  - id: mirc-nickserv-password-disclosure-applet
    desc: Java bridge with NickServ password theft
    for: [html, javascript]
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-nickserv-password-disclosure
      - id: micro-behaviors/os/com/automation::microsoft-java-activex-bridge-reference
      - id: micro-behaviors/os/com/automation::com-create-instance-call
