defaults:
  platforms: [unix, android, ios]
  attack: "T1041"
  mbc: B0028

composite_rules:
- id: social-login-password-response-exfiltration
  desc: Social login password and result sent in a second HTTP POST
  crit: hostile
  conf: 0.97
  attack: T1041,T1056.003
  for: [javascript, typescript]
  near_bytes: 12000
  all:
  - id: micro-behaviors/data/serialize/schema-credential::password-login-result-record
  - id: metadata/lang/source/syntax/call/arguments::post-username-data-argument-form
  - id: micro-behaviors/communications/http/login::http-login-path

