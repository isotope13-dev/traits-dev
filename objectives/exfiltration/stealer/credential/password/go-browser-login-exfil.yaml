# Go stealer that collects browser data through GetCookies/GetHistory
# methods and serializes decrypted Chromium Login Data rows with
# json:"encryptedUsername"/json:"encryptedPassword" struct tags. Method
# collection alone could be a benign automation library; the struct tags
# alone could be test data. The combination is a credential-exfil schema:
# no legitimate program ships both browser-data collectors and a
# hostname/encrypted-username/encrypted-password JSON shape.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1041
composite_rules:
  - id: go-browser-login-data-exfil-schema
    desc: Go collectors with login JSON exfil schema
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-data-collector-methods
      - id: micro-behaviors/data/serialize/schema-credential::json-tagged-encrypted-username
      - id: micro-behaviors/data/serialize/schema-credential::json-tagged-encrypted-password
