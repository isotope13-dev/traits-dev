defaults:
  platforms: [unix]
  for: [shell]
  attack: T1555.001

composite_rules:
  - id: shell-safe-storage-http-upload
    desc: Uploads a browser Safe Storage password over HTTP
    crit: hostile
    conf: 0.97
    attack: T1555.001,T1041
    near_bytes: 0
    all:
      - id: micro-behaviors/os/security/keychain::shell-safe-storage-password-stdout
      - id: micro-behaviors/communications/http/request/body::shell-command-result-http-body
