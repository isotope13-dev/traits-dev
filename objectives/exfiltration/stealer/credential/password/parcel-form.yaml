defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.98
composite_rules:
  - id: parcel-password-absolute-post
    desc: Parcel password phish with absolute POST target
    crit: hostile
    all:
      - id: objectives/credential-access/phishing/lure::parcel-recipient-password-phishing
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
