defaults:
  for: [shell]
  platforms: [unix]
  attack: T1115,T1041,T1056.002
composite_rules:
  - id: shell-validated-password-clipboard-exfil
    desc: Password capture with clipboard HTTP transfer
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/phishing/ui::shell-validated-dialog-input-file
      - id: micro-behaviors/communications/http/request/body::shell-clipboard-http-form-body
