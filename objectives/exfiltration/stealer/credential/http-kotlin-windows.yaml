defaults:
  platforms:
  - windows
  for:
  - kotlin
  - class
  - java_class
  - jar
  attack: T1041
  crit: hostile
  conf: 0.98
composite_rules:
- id: kotlin-windows-credential-http-exfil
  desc: Kotlin Windows credential HTTP exfil
  all:
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/communications/http/request/body::jvm-http-body-write-source
  # Preserve the former selector's alternatives without presenting ordinary
  # path references as a separate credential-sweeping finding.
  any:
  - id: micro-behaviors/fs/path/credential::kotlin-ssh-aws-path-cluster
  - id: objectives/credential-access/credential-manager/cli::kotlin-cmdkey-wifi-cluster
  - id: micro-behaviors/fs/path/credential::kotlin-gcloud-browser-cluster
  - id: micro-behaviors/fs/path/credential::developer-auth-file-reference
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
- id: kotlin-windows-bytecode-credential-exfil
  desc: Kotlin bytecode credential exfil
  for:
  - class
  - java_class
  - jar
  all:
  - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
  - id: micro-behaviors/communications/http/post::jvm-post-token
  - id: metadata/binary/symbols/name/token::jvm-set-do-output-member
  - id: micro-behaviors/data/buffer/transfer::jvm-outputstream-write
  needs: 1
  any:
  - id: objectives/credential-access/credential-manager/cli::jvm-cmdkey-list-bytes
  - id: objectives/credential-access/wifi::jvm-netsh-wlan-keyclear-bytes
  - id: micro-behaviors/fs/path/token::jvm-gcloud-credentials-bytes
  - id: micro-behaviors/fs/path/password-store::jvm-login-data-bytes
  - id: micro-behaviors/fs/path/password-store::jvm-firefox-logins-bytes
  unless:
  - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path-class
