# Simple developer-credential stealers: read cloud/SSH/registry/CI secrets
# and ship them over the network. Thin cross-language composite for the
# classic supply-chain shapes (postinstall Discord webhook, Telegram bot
# drop, Slack hooks, SMTP, libcurl POSTFIELDS, etc.).
#
# Exfil legs stay component/notable alone — only the hostile composite
# (secret source + exfil, near each other) is an intent signal.
defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  attack: "T1552.001,T1041"
  mbc: E1552

traits:
  # Path/env atoms that are not already covered (or not covered for go/rust/c)
  # by micro-behavior defaults. Do not restate CURLOPT_POSTFIELDS / axios.post /
  # discord webhook / slack / telegram URL atoms — reference those below.
  - id: aws-credentials-path-ref
    desc: References AWS credentials file path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.aws[/\\]credentials'

  - id: ssh-id-rsa-path-ref
    desc: References SSH id_rsa private key path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.ssh[/\\]id_rsa\b'

  - id: docker-config-path-ref
    desc: References Docker registry auth config
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.docker[/\\]config\.json'

  - id: kube-config-path-ref
    desc: References Kubernetes kubeconfig path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.kube[/\\]config\b'

  - id: netrc-path-ref
    desc: References .netrc credentials file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])\.netrc\b'

  - id: gcloud-config-path-ref
    desc: References gcloud application credentials path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.config[/\\]gcloud'

  - id: azure-credentials-path-ref
    desc: References Azure credentials file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.azure[/\\]credentials'

  - id: terraform-creds-path-ref
    desc: References Terraform Cloud credentials file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.terraform\.d[/\\]credentials\.tfrc\.json'

  - id: github-token-name-ref
    desc: Mentions GITHUB_TOKEN secret name
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[^A-Z0-9_])GITHUB_TOKEN([^A-Z0-9_]|$)'

  - id: npm-token-name-ref
    desc: Mentions NPM_TOKEN or NODE_AUTH_TOKEN
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[^A-Z0-9_])(NPM_TOKEN|NODE_AUTH_TOKEN)([^A-Z0-9_]|$)'

  - id: aws-secret-env-name-ref
    desc: Mentions AWS_SECRET_ACCESS_KEY env name
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bAWS_SECRET_ACCESS_KEY\b'

  - id: curl-post-data-exfil
    desc: curl posts a request body
    crit: component
    conf: 0.85
    for: [shell, python, javascript, typescript, go, perl, rust, c, cpp]
    if:
      type: text
      regex: 'curl\b[^\n]{0,120}(--data-binary|-d|--data|-X\s*POST)'

  - id: nc-network-exfil
    desc: netcat used as an exfil sink
    crit: component
    conf: 0.8
    for: [shell]
    if:
      type: text
      regex: '\|\s*nc\s+\S+'

  - id: python-requests-post-exfil
    desc: Python requests.post call site
    crit: component
    conf: 0.8
    for: [python]
    if:
      type: text
      substr: 'requests.post('

  - id: python-httpx-post-exfil
    desc: Python httpx.post call site
    crit: component
    conf: 0.8
    for: [python]
    if:
      type: text
      substr: 'httpx.post('

  - id: python-smtp-send-exfil
    desc: Python smtplib sendmail call site
    crit: component
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: 'smtplib\.SMTP|smtp\.sendmail\('

  - id: node-https-post-exfil
    desc: Node https.request with POST method
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https\.request\([\s\S]{0,160}method:\s*"POST"'

  - id: go-http-post-exfil
    desc: Go http.Post call site
    crit: component
    conf: 0.8
    for: [go]
    if:
      type: text
      substr: 'http.Post('

  - id: rust-reqwest-post-exfil
    desc: Rust reqwest POST call site
    crit: component
    conf: 0.8
    for: [rust]
    if:
      type: text
      regex: '\.post\(\s*"https?://'

  - id: perl-lwp-post-exfil
    desc: Perl LWP POST call site
    crit: component
    conf: 0.8
    for: [perl]
    if:
      type: text
      regex: '->post\([^\n]{0,80}https?://'

  - id: powershell-iwr-post-exfil
    desc: PowerShell Invoke-WebRequest POST
    crit: component
    conf: 0.85
    for: [powershell]
    if:
      type: text
      regex: '(?i)Invoke-WebRequest\b[^\n]{0,120}-Method\s+POST'

composite_rules:
  - id: developer-secret-source
    desc: Targets developer cloud or SSH secrets
    crit: notable
    conf: 0.92
    any:
      - id: aws-credentials-path-ref
      - id: ssh-id-rsa-path-ref
      - id: docker-config-path-ref
      - id: kube-config-path-ref
      - id: netrc-path-ref
      - id: gcloud-config-path-ref
      - id: azure-credentials-path-ref
      - id: terraform-creds-path-ref
      - id: github-token-name-ref
      - id: npm-token-name-ref
      - id: aws-secret-env-name-ref
      - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::npmrc-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::pypirc-credentials-file
      - id: micro-behaviors/fs/path/sensitive/credentials::git-credentials
      - id: micro-behaviors/os/env/vars/credentials::aws-secret-access-key-var
      - id: objectives/credential-access/env/secrets/source-control::github-token-var
      - id: objectives/credential-access/env/secrets/cloud-access::env-aws-secret
      - id: objectives/credential-access/env/secrets/cloud-access::env-aws-access-key
      - id: objectives/credential-access/env/secrets/bulk-access::vcs-registry-secret-env-name
      - id: objectives/credential-access/env/harvesting::env-dump-grep-cloud-secrets
      - id: objectives/credential-access/cloud/token/files::go-aws-secret-env-var

  - id: simple-developer-secret-stealer
    desc: Developer secret read and network exfil
    crit: hostile
    conf: 0.95
    near_lines: 20
    all:
      - id: developer-secret-source
    any:
      - id: curl-post-data-exfil
      - id: nc-network-exfil
      - id: python-requests-post-exfil
      - id: python-httpx-post-exfil
      - id: python-smtp-send-exfil
      - id: node-https-post-exfil
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: go-http-post-exfil
      - id: rust-reqwest-post-exfil
      - id: perl-lwp-post-exfil
      - id: powershell-iwr-post-exfil
      - id: micro-behaviors/communications/http/curl::native-post-fields-option
      - id: micro-behaviors/communications/http/post::axios-post-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-post
      - id: objectives/exfiltration/messaging/webhook::telegram-bot-api
      - id: objectives/exfiltration/stealer/credential/env::env-dump-piped-to-network-client
    unless:
      - id: well-known/tool/detection/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
      # GITHUB_TOKEN (etc.) posted to GitHub's own API is authentication, not
      # theft — same carve-out as npm-token-theft / gem-credential-theft.
      - id: micro-behaviors/communications/http/services/github/
