# Developer-secret harvesting that the plain-text rules in traits.yaml cannot
# see, because the script was run through a JavaScript obfuscator first.
#
# `simple-developer-secret-stealer` and `encoded-multi-developer-secret-exfil`
# both require a recognizable exfil call -- `https.request(..., {method:
# 'POST'})`, `requests.post`, `curl -d`. Obfuscator output reaches the same
# APIs through computed properties (`m['request']`, `m['get']`) and keeps the
# collector URL as a Base64 literal, so every one of those legs misses while
# the credential-store paths themselves stay in the string table and remain
# readable. This composite joins what is left: a broad credential-store target
# list, machine-mangled identifiers, and an outbound endpoint that only exists
# after decoding.
#
# Requiring all three keeps ordinary tooling out. Credential helpers know the
# same paths but do not mangle their identifiers; obfuscated bundles are
# common but do not enumerate three separate developer secret stores; and
# neither hides its endpoint inside Base64.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1552.005,T1041,T1027.013
  mbc: E1552

composite_rules:
  - id: obfuscated-developer-secret-exfil
    desc: Mangled script ships developer secrets offsite
    crit: hostile
    conf: 0.95
    near_bytes: 32768
    all:
      - id: multi-developer-secret-source
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
    any:
      # The transport, in whichever form survived the obfuscation pass.
      - id: micro-behaviors/communications/http/request/dynamic::node-computed-get-call
      - id: node-https-post-exfil
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
    unless:
      - id: well-known/tool/detection/
      - id: well-known/app/security/
