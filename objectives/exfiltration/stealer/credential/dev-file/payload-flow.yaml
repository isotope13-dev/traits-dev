defaults:
  platforms: [unix, windows]
  for: [rust, python, javascript, typescript, go]
  attack: T1552.001,T1041

composite_rules:
  - id: credential-http-upload
    desc: Uploads credential contents via HTTP
    crit: hostile
    conf: 0.95
    scope: leaf
    all:
      - id: developer-secret-source
    any:
      - id: micro-behaviors/communications/http/request/credentials::secret-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::cargo-credential-http-body-flow
