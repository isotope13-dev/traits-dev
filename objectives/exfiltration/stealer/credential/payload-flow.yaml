# The required source includes SSH/cloud files and arbitrary secret environment
# names. It does not require a developer-owned credential store.
defaults:
  platforms: [unix, windows]
  for: [rust, javascript, typescript, go, shell, powershell]
  attack: T1552.001,T1041

composite_rules:
  - id: credential-http-upload
    desc: Uploads credential contents via HTTP
    crit: hostile
    conf: 0.95
    scope: leaf
    all:
      - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
    any:
      - id: micro-behaviors/communications/http/request/credentials/environment::go-secret-env-reader-body
      - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::credential-file-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::cargo-credential-http-body-flow
      - id: metadata/file/profile/http-upload::curl-named-file-body-upload-command
    unless:
      # Source-local dataflow facts do not prove reachability. This exception
      # requires the Cargo credential and HTTP path to share a false branch.
      - id: micro-behaviors/data/control-flow/branch::literal-false-credential-http-context
      - id: well-known/app/development/cloudflare::cloudflare-github-jira-sync-context
      - id: metadata/package/testing/presence/path::scanner-attack-fixture-context
