composite_rules:
- platforms:
  - linux
  - unix
  - macos
  - android
  - ios
  - windows
  mbc: E1041
  attack: T1041,T1552.001
  for:
  - shell
  id: ci-token-curl-upload
  desc: Evaluated CI environment data in curl upload
  crit: hostile
  conf: 0.96
  near_lines: 60
  all:
  - id: micro-behaviors/os/env/cicd::ci-provider-env-reference-set
  - id: micro-behaviors/process/interpreter/eval/direct::shell-evaluates-variable-command
  - id: micro-behaviors/communications/http/curl::curl-data-binary
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  - id: metadata/lang/source/syntax/command/invocation::curl-sensitive-variable-data-syntax
  unless:
  - id: well-known/tool/development/ci/codecov::official-bash-uploader
  - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
