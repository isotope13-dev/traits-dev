defaults:
  platforms: [unix, windows]
  crit: hostile
  for: [javascript, typescript]
composite_rules:
  - id: npm-runner-recon-webhook
    desc: CI/CD token embedded in a webhook request payload
    conf: 0.95
    attack: "T1567"
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/env/ci-credentials::javascript-ci-token-env-access
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
    any:
      - id: micro-behaviors/communications/http/webhook::generic-webhook-url
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-url
