defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

composite_rules:
- id: postinstall-inline-node-oidc-webhook-exfil
  desc: postinstall inline Node steals CI OIDC token
  crit: hostile
  conf: 0.99
  attack: "T1195.002,T1552.001,T1041"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/command::postinstall-inline-node-const-reference
  - id: micro-behaviors/os/sysinfo/report::postinstall-host-env-object
  - id: metadata/package/scripts/reference::js-require-https-postinstall
  - id: micro-behaviors/communications/http/request/inline::js-https-request-postinstall
  - id: objectives/credential-access/env/secrets/cicd::npm-script-github-actions-oidc-request
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
