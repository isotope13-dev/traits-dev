defaults:
  platforms:
  - unix
  - windows
  for:
  - github-actions
  attack: T1552.001
  crit: suspicious
  conf: 0.95
traits:
- id: curl-token-before-url
  desc: curl token and URL arguments co-occur
  crit: notable
  if:
    type: text
    regex: '\bcurl\b.{0,25}--?(d|data|H|header).{0,25}(GITHUB_TOKEN|github\.\s*token).{0,25}https?://'
  # unless: rather than not: — not: filters matched strings, it does not
  # suppress the trait, and these guards must (verified against the current
  # engine; see wget-github-token for the working unless: pattern).
  # The run step authenticating to the Actions-provided API/server URL with
  # the workflow token is the legitimate GitHub API pattern. The authority
  # terminator `([^. \w]|$)` ends the suppression at the expression, so
  # `https://${{ github.api_url }}.attacker.example/` still counts as external.
  unless:
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
  - type: text
    regex: 'https?://(api\.|uploads\.)?github\.com/'
  - type: text
    regex: '(?m)https?://\$\{\{\s*github\.(api_url|server_url)\s*\}\}([^. \w]|$)'
  - type: text
    regex: '(?m)https?://\$GITHUB_API_URL([^. \w]|$)'
  - type: text
    regex: 'coveralls\.io/webhook\?[^ \t"\n]*repo_token='
- id: curl-url-before-token
  desc: curl token follows its HTTP URL
  crit: notable
  if:
    type: text
    regex: '\bcurl\b.{0,56}https?://.{0,40}--?(d|data|H|header).{0,26}(GITHUB_TOKEN|github\.\s*token)'
  unless:
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
  - type: text
    regex: 'https?://(api\.|uploads\.)?github\.com/'
  - type: text
    regex: '(?m)https?://\$\{\{\s*github\.(api_url|server_url)\s*\}\}([^. \w]|$)'
  - type: text
    regex: '(?m)https?://\$GITHUB_API_URL([^. \w]|$)'
  - type: text
    regex: 'coveralls\.io/webhook\?[^ \t"\n]*repo_token='
- id: curl-token-continued-url
  desc: curl continues a GitHub token request
  crit: notable
  if:
    type: text
    regex: '\bcurl\b.{0,30}(-H|--header).{0,30}github\.\s*token.{0,10}\\\s*[\s\S]{0,40}https?://'
  unless:
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
  - type: text
    regex: 'https?://(api\.|uploads\.)?github\.com/'
  - type: text
    regex: '(?m)https?://\$\{\{\s*github\.(api_url|server_url)\s*\}\}([^. \w]|$)'
  - type: text
    regex: '(?m)https?://\$GITHUB_API_URL([^. \w]|$)'
  - type: text
    regex: 'coveralls\.io/webhook\?[^ \t"\n]*repo_token='
composite_rules:
- id: curl-github-token
  desc: curl sends GITHUB_TOKEN outside GitHub
  crit: suspicious
  any:
  - id: curl-token-before-url
  - id: curl-url-before-token
  - id: curl-token-continued-url
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish
- id: github-token-exfil
  desc: GITHUB_TOKEN sent to external URL
  any:
  - id: objectives/exfiltration/stealer/credential/value/ci-token::curl-github-token
  - id: objectives/exfiltration/stealer/credential/value/ci-token::wget-github-token
  - id: objectives/exfiltration/stealer/credential/value/ci-token::fetch-github-token
  - id: objectives/exfiltration/stealer/credential/value/ci-token::http-github-token
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
