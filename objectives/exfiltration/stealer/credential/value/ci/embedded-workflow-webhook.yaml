defaults:
  platforms: [unix, windows]
  for: [shell, javascript, typescript]

composite_rules:
  # Proximity cannot prove that the curl variable is the secrets binding.
  # Report the suspicious template combination, preserving that distinction.
  - id: embedded-secrets-webhook-template
    desc: Workflow template pairs complete secrets and webhook POST
    crit: suspicious
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/os/env/credential/ci::complete-secrets-json-expression
      - id: micro-behaviors/communications/http/curl/body::curl-data-shell-variable-arg
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
