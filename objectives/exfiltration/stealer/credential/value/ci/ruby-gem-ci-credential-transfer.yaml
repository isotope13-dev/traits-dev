# A package declaration plus bound credential-to-HTTP-body flow establishes
# the supply-chain theft claim. CI variable names beside unrelated networking
# do not establish exfiltration or CI targeting.
defaults:
  conf: 0.95
  platforms: [unix, windows]
  crit: hostile
  attack: T1195.001
  for: [ruby]
composite_rules:
  - id: ruby-gem-private-file-and-secret-post
    desc: Ruby script collects credential files and posts a JSON payload
    conf: 0.98
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/fs/file/read-write::ruby-sensitive-path-file-operation-clues
      - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/credential/cloud::aws-credentials-text-reference
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: micro-behaviors/communications/http/request/body/construction::ruby-net-http-json-body-assignment
      - id: micro-behaviors/communications/http/request/body/construction::ruby-json-body-through-local-variable

  - id: gem-credential-theft
    for: [ruby, gem]
    desc: Ruby gem sends CI/CD credentials off-service
    attack: "T1552.001"
    scope: outer
    all:
      - id: micro-behaviors/os/env/secret/ci::ruby-ci-credential-env-references
      - id: metadata/package/config/manifest::gemspec-name-assignment
    any:
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-sensitive-env-json-net-http-post-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-filtered-env-json-net-http-request-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-marker-filtered-env-json-net-http-post-body
