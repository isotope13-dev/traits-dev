defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1552.001
traits:
  - id: node-complete-environment-form-post
    desc: POSTs Base64-encoded process environment
    crit: suspicious
    conf: 0.99
    size_max: 20000
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
          (_ (variable_declarator name: (identifier) @host
            value: (string (string_fragment) @destination)))
          (_ (variable_declarator name: (identifier) @environment
            value: (call_expression function: (member_expression
              object: (identifier) @json property: (property_identifier) @serialize)
              arguments: (arguments (member_expression
                object: (identifier) @process property: (property_identifier) @env)))))
          (_ (variable_declarator name: (identifier) @encoded
            value: (call_expression function: (member_expression
              object: (new_expression constructor: (identifier) @buffer
                arguments: (arguments (identifier) @env_value))
              property: (property_identifier) @to_string)
              arguments: (arguments (string (string_fragment) @encoding)))))
          (_ (variable_declarator name: (identifier) @body
            value: (call_expression function: (member_expression
              property: (property_identifier) @form_encode)
              arguments: (arguments (object
                (shorthand_property_identifier) @encoded_field)))))
          (_ (variable_declarator name: (identifier) @options
            value: (object
              (pair key: (property_identifier) @hostname_key
                value: (identifier) @used_host)
              (pair key: (property_identifier) @method_key
                value: (string (string_fragment) @method)))))
          (_ (variable_declarator name: (identifier) @request
            value: (call_expression function: (member_expression
              property: (property_identifier) @request_method)
              arguments: (arguments (identifier) @used_options))))
          (expression_statement (call_expression function: (member_expression
            object: (identifier) @writer property: (property_identifier) @write)
            arguments: (arguments (identifier) @sent)))
          (#eq? @json "JSON") (#eq? @serialize "stringify")
          (#eq? @process "process") (#eq? @env "env")
          (#eq? @environment @env_value) (#eq? @buffer "Buffer")
          (#eq? @to_string "toString") (#eq? @encoding "base64")
          (#eq? @form_encode "stringify") (#eq? @encoded @encoded_field)
          (#eq? @method_key "method") (#match? @method "(?i)^POST$")
          (#eq? @hostname_key "hostname") (#eq? @host @used_host)
          (#not-match? @destination "(?i)^(localhost|127\\.|0\\.0\\.0\\.0|::1)")
          (#eq? @request_method "request") (#eq? @options @used_options)
          (#eq? @request @writer) (#eq? @write "write") (#eq? @body @sent))
composite_rules:
  - id: node-entire-environment-http-exfiltration
    desc: Exfiltrates complete process environment
    crit: hostile
    conf: 0.99
    all:
      - id: node-complete-environment-form-post
      - id: micro-behaviors/data/serialize/json::process-env-json-stringify
