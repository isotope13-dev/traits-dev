composite_rules:
- platforms:
  - windows
  for:
  - class
  attack: T1552.001,T1041
  id: jvm-secret-env-dump-http-upload
  desc: JVM executes an environment-secret dump and HTTP upload
  crit: hostile
  conf: 0.99
  near_bytes: 1024
  all:
  - id: micro-behaviors/os/env/enumerate::windows-shell-secret-env-filter
  - id: micro-behaviors/communications/http/upload/file::curl-temp-file-body-reference
  - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
  - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
  - id: micro-behaviors/process/argument/interpreter::java-cmd-exe-c-bytecode-clues
