defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: init-background-credential-archive-exfil
  desc: Import-time background credential archive exfiltration
  crit: hostile
  conf: 0.99
  mbc: E1041
  attack: T1195.002,T1005,T1041
  scope: file
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/process/thread/create::python-daemon-thread
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/data/encode/base64/primitive::base64-encoding
  any:
  - id: micro-behaviors/fs/path/developer-credential::developer-cloud-credential-path-cluster
  - id: micro-behaviors/fs/path/wallet::doteth-keystore
  - id: micro-behaviors/fs/path/config/ssh::ssh-directory-slash-reference
  - id: micro-behaviors/fs/path/credential::container-credentials
  unless:
  - id: metadata/package/config/exclusion::sensitive-file-exclusion-list
