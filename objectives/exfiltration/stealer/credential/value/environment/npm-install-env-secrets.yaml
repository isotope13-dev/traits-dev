defaults:
  platforms: ["unix"]
  for: ["npm"]
  attack: "T1195.002,T1552.001,T1041"
  mbc: "E1020"
composite_rules:
  - id: install-hook-env-secret-exfiltration
    for: [npm, package.json, shell]
    desc: Install hook exfiltrates environment secrets
    crit: hostile
    conf: 0.97
    # archive scope: the hook is declared in package.json, the pipeline lives
    # in the script it runs.
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: objectives/exfiltration/stealer/credential/value::env-secret-dump-piped-to-network-client
