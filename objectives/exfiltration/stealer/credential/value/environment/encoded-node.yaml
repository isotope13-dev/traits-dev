defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - javascript
  - typescript
  attack: T1041
composite_rules:
- id: javascript-env-basic-auth-oob-exfil
  desc: Env credentials sent as Basic Auth callback
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041
  near_bytes: 1400
  all:
  - id: micro-behaviors/os/env/credential/secret::javascript-credential-env-reference
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/authorization-header::javascript-basic-auth-header
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  any:
  - id: micro-behaviors/communications/http/get::fetch-get-call
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
- id: node-encode-exfil
  desc: Credential HTTP flow beside Base64 encoding
  crit: suspicious
  conf: 0.9
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::credential-file-http-body-flow
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/communications/http/request/body/construction::node-upload-sink
  any:
  - id: micro-behaviors/fs/path/credential/collection::any-credential-path
  - id: micro-behaviors/os/env/credential/secret::credential-env-read
  - id: micro-behaviors/os/env/config/cloud/
  - id: micro-behaviors/os/env/credential/cloud::aws-access-key-pair-names-binary
  - id: micro-behaviors/os/env/credential/cloud::aws-access-key-source-example
  - id: micro-behaviors/os/env/credential/cloud::aws-credential-env-name
  - id: micro-behaviors/os/env/credential/cloud::aws-env-secret-vars
  - id: micro-behaviors/os/env/credential/cloud::aws-secret-access-key-var
  - id: micro-behaviors/os/env/credential/cloud::aws-secret-access-key-var-encoded
  - id: micro-behaviors/os/env/credential/cloud::aws-secret-source-example
  - id: micro-behaviors/os/env/credential/cloud::azure-cloud-credential-env-read
  - id: micro-behaviors/os/env/credential/cloud::azure-credentials-dup
  - id: micro-behaviors/os/env/credential/cloud::azure-tenant-client-secret-env-names
  - id: micro-behaviors/os/env/credential/cloud::cloud-secret-environment-name-set
  - id: micro-behaviors/os/env/credential/cloud::docker-credentials
  - id: micro-behaviors/os/env/credential/cloud::gcp-application-credentials-env-name
  - id: micro-behaviors/os/env/credential/cloud::gcp-cloud-keyfile-env-name
  - id: micro-behaviors/os/env/credential/cloud::gcp-credential-env-name
  - id: micro-behaviors/os/env/credential/cloud::go-aws-secret-env-var
  - id: micro-behaviors/os/env/credential/cloud::google-cloud-credential-env-read
  - id: micro-behaviors/os/env/credential/cloud::google-credentials
  - id: micro-behaviors/os/env/credential/cloud::js-aws-access-key-id-literal
  - id: micro-behaviors/os/env/credential/cloud::js-aws-session-token-literal
  - id: micro-behaviors/os/env/credential/cloud::native-aws-access-key-id-name
  - id: micro-behaviors/os/env/credential/cloud::native-aws-secret-access-key-name
  - id: micro-behaviors/os/env/credential/cloud::native-aws-session-token-name
  - id: micro-behaviors/os/env/credential/cloud::native-azure-client-secret-name
  - id: micro-behaviors/os/env/credential/cloud::native-gcp-credentials-name
  - id: micro-behaviors/os/env/credential/cloud::native-service-account-key-name
  - id: micro-behaviors/os/env/credential/cloud::node-cloudflare-r2-credential-env-read
  - id: micro-behaviors/os/env/credential/cloud::node-r2-credential-env-access
  - id: micro-behaviors/os/env/credential/cloud::node-r2-credential-env-read
  - id: micro-behaviors/os/env/credential/cloud::php-aws-secret-env-read
  - id: micro-behaviors/os/env/credential/cloud::php-azure-secret-env-read
  - id: micro-behaviors/os/env/credential/cloud::php-cloud-secret-env-list
  - id: micro-behaviors/os/env/credential/cloud::php-cloud-secret-key-list
  - id: micro-behaviors/os/env/credential/cloud::python-aws-secret-access-key-environ-read
  - id: micro-behaviors/os/env/credential/cloud::python-azure-client-secret-env-read
  - id: micro-behaviors/os/env/credential/cloud::python-cloud-credential-env-read
  - id: micro-behaviors/os/env/credential/cloud::python-cloud-creds
  - id: micro-behaviors/os/env/credential/cloud::python-gcp-app-creds-env-read
  - id: micro-behaviors/os/env/credential/cloud::python-gcp-service-account-env-read
  - id: micro-behaviors/os/env/credential/cloud::r2-credential-env-name
  - id: micro-behaviors/os/env/credential/cloud::windows-cloud-env-name-cluster
  - id: micro-behaviors/data/serialize/schema-credential::script-aws-credential-parameter-name
  - id: micro-behaviors/os/env/credential/cloud::aws-secret-access-key-env-read
  - id: micro-behaviors/os/env/credential/cloud::python-aws-secret-access-key-env-read
  downgrade:
    any:
    - id: micro-behaviors/communications/http/authorization-header::javascript-basic-auth-header
    - id: micro-behaviors/os/package-manager/publish/
    - id: micro-behaviors/os/package-manager/installer-script/
    - id: micro-behaviors/communications/http/services/payment::payment-provider-api-flow
    - id: objectives/exfiltration/http/upload::node-multimodal-image-upload-context
