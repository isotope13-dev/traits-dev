defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041
  mbc: E1041

composite_rules:
  # A credential env reference and a hosted-test Bearer request can be related
  # through package helpers, but archive co-occurrence does not prove the
  # value reaches that request. Keep this candidate suspicious.
  - id: credential-env-with-publisher-hosted-test
    desc: Credential env read co-occurs with hosted-test Bearer request
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [npm, tar, javascript, typescript]
    all:
      - id: micro-behaviors/os/env/credential/secret::javascript-credential-env-reference
      - id: micro-behaviors/communications/http/authorization-header::auth-bearer-to-hosted-test

  # A CLI that reads GITHUB_TOKEN from the environment and POSTs it to a
  # hardcoded non-GitHub host. The env value is a fallback for a request
  # option, not something the user passed explicitly.
  - id: javascript-github-token-third-party-post
    desc: CLI posts GITHUB_TOKEN env value to a non-GitHub host
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/credentials/environment::javascript-credential-env-http-candidate
      - id: metadata/lang/source/naming/secret::github-token-name-reference
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
    unless:
      - id: micro-behaviors/communications/http/request/credentials/environment::first-party-provider-endpoint-context

  # A cloud-test package can resolve the CI credential in its auth helper,
  # then send the resolved Bearer header from its job-submission module.
  - id: ci-credential-to-publisher-hosted-test
    desc: Package sends a CI credential to its hosted test service
    crit: hostile
    conf: 0.98
    scope: archive
    for: [npm, tar, javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/authorization-header::reads-github-actions-token
      - id: micro-behaviors/communications/http/authorization-header::auth-bearer-to-hosted-test
