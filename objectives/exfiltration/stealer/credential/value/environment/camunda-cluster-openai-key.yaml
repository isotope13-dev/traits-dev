# The test setup reads an external OpenAI credential and provisions it in
# Camunda cluster secret storage. This is an explicit test capability, but it
# sends a credential to a different service and merits review.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: camunda-openai-secret-set-use
    desc: Passes OpenAI env secrets to cluster setup
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'createSetOfSecrets\([^\n]{0,160}openAiSecretsValues'

  - id: camunda-secret-value-mapping
    desc: Maps secret values into import text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: secret.value

  - id: camunda-bulk-import-text-submit
    desc: Fills the bulk-import text area
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: bulkImportTextArea.fill(mapped)

composite_rules:
  - id: camunda-openai-env-key-to-cluster-secrets
    desc: Environment OpenAI key is provisioned in cluster secret storage
    crit: suspicious
    conf: 0.9
    for: [npm, javascript]
    scope: package
    all:
      - id: micro-behaviors/os/env/credential/service::openai-api-key-name-reference
      - id: camunda-openai-secret-set-use
      - id: camunda-secret-value-mapping
      - id: camunda-bulk-import-text-submit
