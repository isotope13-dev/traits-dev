defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-private-key-read-http-post-flow
    desc: Read SSH private key reaches POST argument
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @key
              right: (call receiver: (constant) @file method: (identifier) @read
                arguments: (argument_list (string) @path)))
            (call receiver: (scope_resolution) @http method: (identifier) @post
              arguments: (argument_list (_) (string (interpolation (identifier) @sent)))))
          (#eq? @file "File") (#eq? @read "read")
          (#match? @path "/[.]ssh/id_(rsa|ed25519|ecdsa)")
          (#eq? @http "Net::HTTP") (#eq? @post "post") (#eq? @key @sent))
composite_rules:
  - id: ruby-private-key-content-http-export
    desc: Exports read SSH private key over HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-private-key-read-http-post-flow
      - id: micro-behaviors/communications/http/request/netlib::net-http-post
