defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-sends-private-key-to-fixed-endpoint
    desc: Sends private key to fixed HTTP endpoint
    crit: hostile
    conf: 0.98
    attack: T1552,T1041
    if:
      type: tree-sitter
      query: |
        ((function_definition
          parameters: (parameters
            [(identifier) @parameter
             (typed_parameter (identifier) @parameter)])
          body: (block
            (expression_statement
              (assignment
                left: (identifier) @body
                right: [
                  (dictionary (pair value: (identifier) @key))
                  (list [(set (identifier) @key)
                         (tuple (identifier) @key)
                         (dictionary (pair value: (identifier) @key))])
                  (tuple (identifier) @key)
                  (identifier) @key]))
            (_
              (call
                function: (_) @post
                arguments: (argument_list . (string) @url .
                  [(identifier) @sent
                   (keyword_argument name: (identifier) @keyword value: (identifier) @sent)])))))
          (#match? @parameter "(?i)^(wallet_?)?(private_?key|seed_?phrase|mnemonic)$")
          (#eq? @parameter @key)
          (#eq? @body @sent)
          (#match? @post "^(requests|httpx)\\.post$")
          (#match? @keyword "^(data|json)$")
          (#match? @url "^['\"]https?://[a-zA-Z0-9]")
          (#not-match? @url "(?i)^['\"]https?://(localhost|127\\.|0\\.0\\.0\\.0)"))
