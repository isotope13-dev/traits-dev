defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
  crit: hostile
composite_rules:
- id: js-private-key-env-http-exfiltration
  desc: Private-key environment value in HTTP body
  conf: 0.98
  near_lines: 120
  all:
  - id: micro-behaviors/os/env/secret-name::javascript-private-key-environment-variable
  - id: micro-behaviors/data/serialize/json::js-private-key-json-field
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  any:
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/request/body/construction::request-write-call
  unless:
  - id: micro-behaviors/communications/http/services/github::github-app-installation-token-api
  - id: metadata/lang/source/syntax/member::github-app-private-key-env-access-text
  - id: micro-behaviors/fs/write/file/full::json-stringify-write-sync
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: metadata/path::test-directory-component
- id: js-private-key-http-exfiltration
  desc: User-entered private key sent to a remote HTTP endpoint
  conf: 0.99
  near_lines: 120
  all:
  - id: micro-behaviors/data/serialize/schema-credential::js-private-key-input-request-field
  - id: objectives/exfiltration/sensitive-data/source::js-remote-http-post-json
