defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
  crit: hostile
composite_rules:
- id: js-private-key-env-http-exfiltration
  desc: Private-key environment value in HTTP body
  conf: 0.98
  near_lines: 120
  all:
  - id: micro-behaviors/os/env/secret-name::javascript-private-key-environment-variable
  - id: micro-behaviors/data/serialize/json::js-private-key-json-field
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  any:
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/request/body/construction::request-write-call
  unless:
  - id: micro-behaviors/communications/http/services/github/security::github-app-installation-token-api
  - id: metadata/lang/source/syntax/member::github-app-private-key-env-access-text
  - id: micro-behaviors/fs/write/file/content::json-stringify-write-sync
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
- id: js-private-key-http-exfiltration
  desc: User-entered private key sent to a remote HTTP endpoint
  conf: 0.99
  near_lines: 120
  all:
  - id: micro-behaviors/data/serialize/schema-credential::js-private-key-input-request-field
  - id: micro-behaviors/communications/http/request/json::js-remote-http-post-json
- id: js-wallet-private-key-discord-webhook-exfil
  desc: Wallet WIF or private key exfiltrated to Discord webhook
  conf: 0.99
  for:
  - npm
  - tar
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/services/discord::js-axios-post-discord-webhook
  any:
  - id: micro-behaviors/crypto/key/representation/encoded::js-bitcore-private-key-wif
  - id: micro-behaviors/crypto/key/representation/encoded::js-wallet-private-key-content-template
  - id: micro-behaviors/crypto/key/representation/encoded::js-wallet-validator-log-backdoor-param
  - id: micro-behaviors/crypto/key/representation/reference::privatekey-identifier

- id: js-wif-passed-to-covert-address-validator
  desc: Wallet constructor passes WIF private key into covert address validator
  conf: 0.99
  all:
  - id: micro-behaviors/crypto/key/representation/encoded::js-wallet-constructor-passes-wif-to-validator
  any:
  - id: micro-behaviors/crypto/key/representation/encoded::js-bitcore-private-key-wif
  - id: micro-behaviors/crypto/key/representation/reference::privatekey-identifier
