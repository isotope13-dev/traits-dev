defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-encrypted-account-key-signed-transaction
    desc: Sends encrypted account key in transaction
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1041
    if:
      type: tree-sitter
      query: |
        ((function_definition name: (identifier) @function parameters: (parameters (identifier) @account)
          body: (block (try_statement body: (block
            (expression_statement (assignment left: (identifier) @transaction right: (dictionary
              (pair key: (string) @datakey value: (call function: (attribute object: (identifier) @cipher attribute: (identifier) @encrypt)
                arguments: (argument_list (attribute object: (identifier) @account2 attribute: (identifier) @key)))))))
            (expression_statement (assignment left: [
              (pattern_list (identifier) @signed .)
              (tuple_pattern (identifier) @signed .)] right: (call function: (identifier) @sign
              arguments: (argument_list (attribute object: (identifier) @account3 attribute: (identifier) @keyobj)
                (identifier) @transaction2))))
            (expression_statement (assignment right: (call function: (attribute
              object: (attribute object: (identifier) @web3 attribute: (identifier) @eth)
              attribute: (identifier) @send)
              arguments: (argument_list (call function: (identifier) @hexbytes
                arguments: (argument_list (identifier) @signed2))))))))))
          (#eq? @account @account2) (#eq? @account @account3) (#eq? @key "key") (#eq? @keyobj "_key_obj")
          (#eq? @encrypt "encrypt") (#match? @datakey "^.data.$") (#eq? @transaction @transaction2)
          (#eq? @sign "sign_transaction_dict") (#eq? @eth "eth") (#eq? @send "send_raw_transaction")
          (#eq? @hexbytes "HexBytes") (#eq? @signed @signed2))
