defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.004,T1041

composite_rules:
  - id: private-key-handoff-post
    desc: Private-key handoff beside concealed or known-host POST
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/key/export::javascript-secret-key-helper-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
    # The endpoint corroborates key theft; it never gates the conviction.
    # Concealed transport survives a changed hostname or helper name.
    any:
      - id: objectives/command-and-control/infrastructure/domain/known::solana-key-theft-endpoint
      - id: objectives/exfiltration/http/header::reversed-value-in-cloudfront-request-headers
