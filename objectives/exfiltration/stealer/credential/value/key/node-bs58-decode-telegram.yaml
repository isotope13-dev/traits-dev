defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1195.002
  mbc: E1041

traits:
  - id: base58-decode-input-forwarded-to-message
    desc: Forwards Base58 decode input to sender
    crit: component
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration
            name: (identifier) @function
            parameters: (formal_parameters (identifier) @input)
            body: (statement_block
              (expression_statement
                (call_expression function: (identifier) @sender
                  arguments: (arguments (identifier) @sent)))
              (return_statement
                (call_expression function: (member_expression
                  object: (identifier) @library
                  property: (property_identifier) @decoder)
                  arguments: (arguments (identifier) @decoded)))))
          (#eq? @function "decode")
          (#eq? @sender "sendMessage")
          (#eq? @library "bs58")
          (#eq? @decoder "decode")
          (#eq? @input @sent)
          (#eq? @input @decoded)))

composite_rules:
  - id: node-bs58-decode-input-telegram-exfiltration
    desc: Sends Base58 decode input to Telegram
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: base58-decode-input-forwarded-to-message
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
      - id: micro-behaviors/communications/http/services/telegram::telegram-send-message-url
