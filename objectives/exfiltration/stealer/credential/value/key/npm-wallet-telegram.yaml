defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1005,T1041,T1195.002
  mbc: E1041
traits:
- id: node-wallet-project-key-files-telegram-upload
  desc: Sends project private keys through Telegram
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(readdir|readdirSync)\s*\(/is
          $b0_1 = /readFile(Sync)?\s*\(/is
          $b0_2 = /0x\?\[a-fA-F0-9\]\{64\}/is
          $b0_3 = /api\.telegram\.org\/bot/is
          $b0_4 = /(sendMessage|sendDocument)/is
          $b1_0 = /(readdir|readdirSync)\s*\(/is
          $b1_1 = /readFile(Sync)?\s*\(/is
          $b1_2 = /a-fA-F0-9/is
          $b1_3 = /64/is
          $b1_4 = /api\.telegram\.org\/bot/is
          $b1_5 = /(sendMessage|sendDocument)/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1800 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1800 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1800 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 1200 and
                      true
                    )
                  )
                )
              )
            )
          ) or
          (
            for any i0 in (1..#b1_0) : (
              for any i1 in (1..#b1_1) : (
                @b1_1[i1] >= (@b1_0[i0] + !b1_0[i0]) and
                @b1_1[i1] <= (@b1_0[i0] + !b1_0[i0]) + 1800 and
                for any i2 in (1..#b1_2) : (
                  @b1_2[i2] >= (@b1_1[i1] + !b1_1[i1]) and
                  @b1_2[i2] <= (@b1_1[i1] + !b1_1[i1]) + 1800 and
                  for any i3 in (1..#b1_3) : (
                    @b1_3[i3] >= (@b1_2[i2] + !b1_2[i2]) and
                    @b1_3[i3] <= (@b1_2[i2] + !b1_2[i2]) + 30 and
                    for any i4 in (1..#b1_4) : (
                      @b1_4[i4] >= (@b1_3[i3] + !b1_3[i3]) and
                      @b1_4[i4] <= (@b1_3[i3] + !b1_3[i3]) + 1800 and
                      for any i5 in (1..#b1_5) : (
                        @b1_5[i5] >= (@b1_4[i4] + !b1_4[i4]) and
                        @b1_5[i5] <= (@b1_4[i4] + !b1_4[i4]) + 1200 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
- id: node-wallet-monitor-key-file-telegram-upload
  desc: Monitors and sends keys through Telegram
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /chokidar\.watch\(/is
          $b0_1 = /readFile(Sync)?\s*\(/is
          $b0_2 = /private.?key/is
          $b0_3 = /api\.telegram\.org\/bot/is
          $b0_4 = /(sendMessage|sendDocument)/is
          $b1_0 = /chokidar\.watch\(/is
          $b1_1 = /readFile(Sync)?\s*\(/is
          $b1_2 = /a-fA-F0-9/is
          $b1_3 = /64/is
          $b1_4 = /api\.telegram\.org\/bot/is
          $b1_5 = /(sendMessage|sendDocument)/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 2500 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1500 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1200 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 1500 and
                      true
                    )
                  )
                )
              )
            )
          ) or
          (
            for any i0 in (1..#b1_0) : (
              for any i1 in (1..#b1_1) : (
                @b1_1[i1] >= (@b1_0[i0] + !b1_0[i0]) and
                @b1_1[i1] <= (@b1_0[i0] + !b1_0[i0]) + 2500 and
                for any i2 in (1..#b1_2) : (
                  @b1_2[i2] >= (@b1_1[i1] + !b1_1[i1]) and
                  @b1_2[i2] <= (@b1_1[i1] + !b1_1[i1]) + 1500 and
                  for any i3 in (1..#b1_3) : (
                    @b1_3[i3] >= (@b1_2[i2] + !b1_2[i2]) and
                    @b1_3[i3] <= (@b1_2[i2] + !b1_2[i2]) + 40 and
                    for any i4 in (1..#b1_4) : (
                      @b1_4[i4] >= (@b1_3[i3] + !b1_3[i3]) and
                      @b1_4[i4] <= (@b1_3[i3] + !b1_3[i3]) + 1200 and
                      for any i5 in (1..#b1_5) : (
                        @b1_5[i5] >= (@b1_4[i4] + !b1_4[i4]) and
                        @b1_5[i5] <= (@b1_4[i4] + !b1_4[i4]) + 1500 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
- id: node-wallet-private-key-scanner-telegram-send
  desc: Scans and sends private keys through Telegram
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(isValidPrivateKeyFile|hasPotentialPrivateKey|autoSendAllEvmPrivateKeysFromRoot)/is
          $b0_1 = /(api\.telegram\.org\/bot|sendLongMessage)/is
          $b0_2 = /(sendMessage|sendDocument|sendLongMessage)/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 9000 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 2500 and
                  true
                )
              )
            )
          )
      }
- id: npm-wallet-configured-pkfile-telegram-exfiltration
  desc: Uploads configured key file through Telegram
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /this\.filePath\s*=\s*config\.filePath\s*\|\|/is
          $b0_1 = /pk\.txt/is
          $b0_2 = /fs\.promises\.readFile\s*\(\s*this\.filePath/is
          $b0_3 = /api\.telegram\.org\/bot/is
          $b0_4 = /axios[^;]{0,200}\.post\s*\(/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1800 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1600 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 800 and
                      true
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-wallet-private-key-telegram-exfiltration
  desc: NPM wallet package sends project private keys to Telegram
  crit: suspicious
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  scope: archive
  any:
  - id: node-wallet-project-key-files-telegram-upload
  - id: node-wallet-monitor-key-file-telegram-upload
  - id: node-wallet-private-key-scanner-telegram-send
  - id: objectives/exfiltration/stealer/credential/value/key::npm-wallet-configured-pkfile-telegram-exfiltration
