defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1005,T1041,T1195.002
  mbc: E1041

traits:
  - id: node-wallet-project-key-files-telegram-upload
    desc: Scans project files for EVM keys and sends matching contents to Telegram
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:readdir|readdirSync)\s*\([\s\S]{0,1800}readFile(?:Sync)?\s*\([\s\S]{0,1800}(?:0x\?\[a-fA-F0-9\]\{64\}|a-fA-F0-9.{0,30}64)[\s\S]{0,1800}api\.telegram\.org/bot[\s\S]{0,1200}(?:sendMessage|sendDocument)'
  - id: node-wallet-monitor-key-file-telegram-upload
    desc: Monitors files for cryptocurrency private keys and sends file contents to Telegram
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)chokidar\.watch\([\s\S]{0,2500}readFile(?:Sync)?\s*\([\s\S]{0,1500}(?:private.?key|a-fA-F0-9.{0,40}64)[\s\S]{0,1200}api\.telegram\.org/bot[\s\S]{0,1500}(?:sendMessage|sendDocument)'
  - id: node-wallet-private-key-scanner-telegram-send
    desc: Wallet package validates private key files and sends their contents to Telegram
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:isValidPrivateKeyFile|hasPotentialPrivateKey|autoSendAllEvmPrivateKeysFromRoot)[\s\S]{0,9000}(?:api\.telegram\.org/bot|sendLongMessage)[\s\S]{0,2500}(?:sendMessage|sendDocument|sendLongMessage)'
  - id: node-wallet-pkfile-telegram-upload
    desc: Automatically uploads a configured pk.txt file to a Telegram bot
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)this\.filePath\s*=\s*config\.filePath\s*\|\|[\s\S]{0,300}pk\.txt[\s\S]{0,1800}fs\.promises\.readFile\s*\(\s*this\.filePath[\s\S]{0,1600}api\.telegram\.org/bot[\s\S]{0,800}axios[^;]{0,200}\.post\s*\('

composite_rules:
  - id: npm-wallet-private-key-telegram-exfiltration
    desc: NPM wallet package searches project files and exfiltrates private keys to Telegram
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    any:
      - id: node-wallet-project-key-files-telegram-upload
      - id: node-wallet-monitor-key-file-telegram-upload
      - id: node-wallet-private-key-scanner-telegram-send
      - id: node-wallet-pkfile-telegram-upload
  - id: npm-wallet-configured-pkfile-telegram-exfiltration
    desc: NPM wallet package uploads a local pk.txt file to a Telegram bot
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-wallet-pkfile-telegram-upload
