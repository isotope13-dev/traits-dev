defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-private-key-http-export
    desc: Exports SSH private-key bytes over HTTP
    crit: suspicious
    conf: 0.98
    attack: T1552.004,T1041
    all:
      - id: micro-behaviors/communications/http/post::http-post-client-call
    any:
      - id: micro-behaviors/communications/http/request/credential-body-flow::python-ssh-key-requests-data-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::python-ssh-key-httpx-data-body
