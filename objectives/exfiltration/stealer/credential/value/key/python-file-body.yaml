defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  # A wallet tracking package can collect the secret as a function argument
  # rather than reading it from a file or environment variable. Requiring the
  # key field, JSON POST, and Discord webhook ties the value to the outbound
  # notification channel without relying on package names or URL tokens.
  - id: python-wallet-private-key-discord-export
    desc: Sends an imported wallet private key to a Discord webhook
    crit: hostile
    conf: 0.98
    attack: T1041,T1567.004
    scope: file
    all:
      - id: micro-behaviors/data/parse/vocabulary::private-key-field-name
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
