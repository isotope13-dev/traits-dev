defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: node-encoded-parent-wallet-key-post
    desc: Encoded script posts parent wallet keys
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @axios value: (call_expression
            function: (identifier) @require_axios arguments: (arguments (string (string_fragment) @axios_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @base64 value: (call_expression
            function: (identifier) @require_base64 arguments: (arguments (string (string_fragment) @base64_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @bs58 value: (call_expression
            function: (identifier) @require_bs58 arguments: (arguments (string (string_fragment) @bs58_module)))))
          (function_declaration name: (identifier) @fn body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @parent value: (member_expression
              object: (member_expression object: (identifier) @module property: (property_identifier) @module_parent)
              property: (property_identifier) @exports)))
            (expression_statement (call_expression function: (identifier) @eval arguments: (arguments
              (call_expression function: (member_expression object: (identifier) @base64_use property: (property_identifier) @atob)
                arguments: (arguments (string (string_fragment) @encoded))))))))
          (expression_statement (assignment_expression left: (member_expression object: (identifier) @module_use property: (property_identifier) @exports_use)
            right: (identifier) @fn_use)))
          (#eq? @require_axios "require")
          (#eq? @axios_module "axios")
          (#eq? @axios "axios")
          (#eq? @require_base64 "require")
          (#eq? @base64_module "Base64")
          (#eq? @base64 @base64_use)
          (#eq? @atob "atob")
          (#eq? @require_bs58 "require")
          (#eq? @bs58_module "bs58")
          (#eq? @bs58 "bs58")
          (#eq? @module "module")
          (#eq? @module_parent "parent")
          (#eq? @exports "exports")
          (#eq? @parent "parentExports")
          (#eq? @eval "eval")
          (#match? @encoded "bWV0aG9kOiAicG9z")
          (#match? @encoded "ZShwYXJlbnRFeHBvcnRzLndhbGxldC5zZWNyZXRL")
          (#match? @encoded "ZShwYXJlbnRFeHBvcnRzLnBheWVyLnNlY3JldEtl")
          (#eq? @module @module_use)
          (#eq? @exports @exports_use)
          (#eq? @fn @fn_use))
