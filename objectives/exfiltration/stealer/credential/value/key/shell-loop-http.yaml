# Inspired by ProjectDiscovery's abliterated-model credential payload.
# The loop's selected file must supply the complete curl request body. This
# catches renamed variables and collectors; mere path/POST co-occurrence does
# not establish this transfer. Public-key suffixes and variable reassignment
# are excluded by the anchored AST shape. A body with additional statements
# is deliberately outside this rule's scope.
defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  conf: 0.98
  attack: T1552.001,T1041

traits:
  - id: shell-private-key-loop-http-upload
    desc: Posts enumerated SSH private keys over HTTP
    if:
      type: tree-sitter
      language: shell
      query: |
        ((for_statement variable: (variable_name) @selected
          value: [(word) (raw_string) (string)] @target
          body: (do_group . [
        (command name: (command_name (word) @curl) !redirect
          argument: (_) @url
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .) .)
        (list . (test_command) "&&" (command name: (command_name (word) @curl) !redirect
          argument: (_) @url
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .) .) .)
        (redirected_statement body: (command name: (command_name (word) @curl) !redirect
          argument: (_) @url
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .) .))
        (redirected_statement body: (list . (test_command) "&&" (command name: (command_name (word) @curl) !redirect
          argument: (_) @url
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .) .) .))
        (command name: (command_name (word) @curl) !redirect
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .)
          argument: (_) @url .)
        (list . (test_command) "&&" (command name: (command_name (word) @curl) !redirect
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .)
          argument: (_) @url .) .)
        (redirected_statement body: (command name: (command_name (word) @curl) !redirect
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .)
          argument: (_) @url .))
        (redirected_statement body: (list . (test_command) "&&" (command name: (command_name (word) @curl) !redirect
          argument: (word) @data
          . argument: (string . (command_substitution .
            (command name: (command_name (word) @cat) !redirect
              . argument: (string [
                (simple_expansion (variable_name) @used)
                (expansion . (variable_name) @used .)
              ] .) @path .) .) .)
          argument: (_) @url .) .))] .)) @transfer
          (#eq? @curl "curl")
          (#eq? @cat "cat")
          (#eq? @selected @used)
          (#match? @target "^[\"']?id_(rsa|ed25519|ecdsa|dsa)[\"']?$")
          (#match? @url "^['\"]?https?://")
          (#match? @data "^(-d|--data(-raw|-binary)?)$")
          (#match? @path "[\"/]\\.ssh/"))

composite_rules:
  - id: shell-ssh-private-key-http-exfil
    desc: Shell loops to exfiltrate SSH private keys over HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: shell-private-key-loop-http-upload
      - id: micro-behaviors/fs/path/config/ssh::ssh-directory-literal
      - id: micro-behaviors/communications/http/curl::curl-short-data-option
