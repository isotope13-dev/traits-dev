defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1056,T1041

traits:
  - id: cli-private-key-argument-to-callback
    desc: Sends private-key argument to callback
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration
            name: (identifier) @send_def
            parameters: (formal_parameters (identifier) @data)
            body: (statement_block
              (lexical_declaration
                (variable_declarator
                  value: (template_string
                    (template_substitution
                      (call_expression
                        function: (identifier) @encode
                        arguments: (arguments (identifier) @data_use)))) @url))))
          (lexical_declaration
            (variable_declarator
              name: (identifier) @idx
              value: (call_expression
                function: (member_expression object: (identifier) @args property: (property_identifier) @indexof)
                arguments: (arguments (string (string_fragment) @flag)))))
          (if_statement
            consequence: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @send
                  arguments: (arguments
                    (template_string
                      (template_substitution
                        (subscript_expression
                          object: (identifier) @args_use
                          index: (binary_expression left: (identifier) @idx_use right: (number) @one))))))))))
          (#eq? @indexof "indexOf")
          (#eq? @send @send_def)
          (#eq? @data @data_use)
          (#eq? @encode "encodeURIComponent")
          (#match? @url "api\\.telegram\\.org/bot")
          (#eq? @flag "--private-key")
          (#eq? @args @args_use)
          (#eq? @idx @idx_use)
          (#eq? @one "1"))
  - id: cli-private-key-local-to-callback
    desc: Sends extracted private key to callback
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration
            name: (identifier) @send_def
            parameters: (formal_parameters (identifier) @data)
            body: (statement_block
              (lexical_declaration
                (variable_declarator
                  value: (template_string
                    (template_substitution
                      (call_expression
                        function: (identifier) @encode
                        arguments: (arguments (identifier) @data_use)))) @url))))
          (lexical_declaration
            (variable_declarator
              name: (identifier) @idx
              value: (call_expression
                function: (member_expression object: (identifier) @args property: (property_identifier) @indexof)
                arguments: (arguments (string (string_fragment) @flag)))))
          (if_statement
            consequence: (statement_block
              (lexical_declaration
                (variable_declarator
                  name: (identifier) @key
                  value: (subscript_expression object: (identifier) @args_use
                    index: (binary_expression left: (identifier) @idx_use right: (number) @one))))
              (expression_statement
                (call_expression function: (identifier) @send
                  arguments: (arguments (template_string (template_substitution (identifier) @key_use))))))))
          (#eq? @send @send_def)
          (#eq? @data @data_use)
          (#eq? @encode "encodeURIComponent")
          (#match? @url "api\\.telegram\\.org/bot")
          (#eq? @indexof "indexOf")
          (#eq? @flag "--private-key")
          (#eq? @args @args_use)
          (#eq? @idx @idx_use)
          (#eq? @key @key_use)
          (#eq? @one "1"))
  - id: cli-all-arguments-to-callback
    desc: Sends joined CLI arguments to callback
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration
            name: (identifier) @send_def
            parameters: (formal_parameters (identifier) @data)
            body: (statement_block
              (lexical_declaration
                (variable_declarator
                  value: (template_string
                    (template_substitution
                      (call_expression
                        function: (identifier) @encode
                        arguments: (arguments (identifier) @data_use)))) @url))))
          (lexical_declaration
            (variable_declarator
              name: (identifier) @args
              value: (call_expression
                function: (member_expression
                  object: (member_expression object: (identifier) @process property: (property_identifier) @argv)
                  property: (property_identifier) @slice))))
          (lexical_declaration
            (variable_declarator
              name: (identifier) @joined
              value: (call_expression
                function: (member_expression object: (identifier) @args_use property: (property_identifier) @join))))
          (expression_statement
            (call_expression function: (identifier) @send
              arguments: (arguments (template_string (template_substitution (identifier) @joined_use))))))
          (#eq? @send @send_def)
          (#eq? @data @data_use)
          (#eq? @encode "encodeURIComponent")
          (#match? @url "api\\.telegram\\.org/bot")
          (#eq? @process "process")
          (#eq? @argv "argv")
          (#eq? @slice "slice")
          (#eq? @join "join")
          (#eq? @args @args_use)
          (#eq? @joined @joined_use))
  - id: cli-private-key-output-regex
    desc: Matches private-key text in command output
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @match)
          arguments: (arguments (regex pattern: (regex_pattern) @pattern)))
          (#eq? @match "match")
          (#match? @pattern "(?i)private.?key"))

composite_rules:
  - id: cli-wallet-arguments-to-callback
    desc: Sends CLI arguments and matches private-key output
    crit: suspicious
    conf: 0.97
    all:
      - id: cli-all-arguments-to-callback
      - id: cli-private-key-output-regex
  - id: cli-arguments-telegram-callback
    desc: CLI arguments sent to Telegram callback
    crit: hostile
    conf: 0.98
    scope: file
    any:
      - id: cli-private-key-argument-to-callback
      - id: cli-private-key-local-to-callback
      - id: cli-wallet-arguments-to-callback
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-send-message-url
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: metadata/import/builtin::child-process-api-destructure
