# This obfuscated helper puts String(input) into a serialized body, creates a
# request through an object that binds Node HTTPS, and passes that body to the
# returned object's method. Property names remain computed; the request/write
# interpretation follows from this local data flow, not a decoded destination.
defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041,T1027

traits:
  - id: key-body-function
    desc: Obfuscated helper accepts input
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'function $([input],m)'
  - id: key-body-stringify
    desc: Helper embeds input in body
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'm[eWE](l(l({},lWE,String(input)),qWE,O))'
  - id: key-request-create
    desc: Helper creates transport request
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'c=m[dWE][bWE](options,'
  - id: key-request-write
    desc: Helper writes assembled body
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'c[YWE]($)'
  - id: key-transport-function
    desc: Obfuscated private-key helper
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'function sendPrivateKey(...m)'
  - id: key-https-binding
    desc: Helper binds HTTPS module
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'get [dWE](){return https}'
  - id: key-buffer-binding
    desc: Helper binds buffer object
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'get [iWE](){return Buffer}'
  - id: key-delegate-call
    desc: Helper invokes body builder
    crit: component
    conf: 0.99
    if:
      type: text
      substr: '$(m,O)'
  - id: key-session-function
    desc: Obfuscated session helper
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'async function initializeSession(...m)'
  - id: key-session-delegate
    desc: Session delegates to key helper
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'return sendPrivateKey(...m)'
  - id: key-session-await
    desc: Session awaits indirect delegate
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'await O(m,y)'
  - id: key-session-export
    desc: Session helper is exported
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'l(module,TWE,$ZE({},uWE,initializeSession))'

composite_rules:
  - id: node-obfuscated-key-input-body
    desc: Obfuscated helper serializes supplied input
    crit: suspicious
    conf: 0.99
    scope: file
    near_bytes: 300
    all:
      - id: key-body-function
      - id: key-body-stringify
  - id: node-obfuscated-https-body-write
    desc: Obfuscated helper writes body to request
    crit: suspicious
    conf: 0.99
    scope: file
    near_bytes: 3500
    all:
      - id: key-request-create
      - id: key-request-write
  - id: node-obfuscated-key-transport-binding
    desc: Key helper binds HTTPS and buffer objects
    crit: suspicious
    conf: 0.99
    scope: file
    near_bytes: 3500
    all:
      - id: key-transport-function
      - id: key-https-binding
      - id: key-buffer-binding
      - id: key-delegate-call
  - id: node-obfuscated-session-export
    desc: Exported session routes key to helper
    crit: suspicious
    conf: 0.99
    scope: file
    near_bytes: 1000
    all:
      - id: key-session-function
      - id: key-session-delegate
      - id: key-session-await
      - id: key-session-export
  - id: node-obfuscated-key-https-upload
    desc: Obfuscated helper sends key through HTTPS
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 8192
    all:
      - id: node-obfuscated-key-input-body
      - id: node-obfuscated-https-body-write
      - id: node-obfuscated-key-transport-binding
      - id: node-obfuscated-session-export
