defaults:
  platforms: [zos]
  for: [shell]
  attack: T1041

composite_rules:
  - id: shell-zos-credential-http-exfil
    desc: Shell z/OS credential HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/auth/secret::shell-harvest-credentials-func
      - id: micro-behaviors/fs/path/private-key::shell-ssh-private-key-path-pair
      - id: micro-behaviors/communications/http/url/api-path::api-v1-exfil-endpoint
