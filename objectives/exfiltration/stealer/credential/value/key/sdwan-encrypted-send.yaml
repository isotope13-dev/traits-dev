defaults:
  platforms: [linux, macos]
  for: [c, cpp]

composite_rules:
  # A bounded same-file candidate, not a proven source-to-socket flow. Keep
  # suspicious: a control-plane diagnostic collector can share these APIs.
  - id: sdwan-key-interposer-rsa-send-cooccurrence
    desc: SD-WAN key interposer with RSA/sendto calls
    crit: suspicious
    conf: 0.93
    size_max: 65536
    near_bytes: 8192
    all:
      - id: objectives/credential-access/capture/network::sdwan-control-key-interposition
      - id: micro-behaviors/crypto/encrypt::rsa-public-encrypt-call
      - id: micro-behaviors/communications/socket/send::sendto-symbol
