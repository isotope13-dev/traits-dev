defaults:
  crit: hostile
  platforms: [unix, netbsd]
  for: [javascript, typescript]
  attack: T1552.004

traits:
- id: node-ssh-key-curl-input-flow
  desc: SSH key feeds curl stdin upload
  crit: suspicious
  conf: 0.99
  attack: T1552.004,T1041
  if:
    type: symbol
    kind: call
    args:
    - index: 0
      kind: string
      regex: ^curl\b[^;|\n]{0,160}--data-binary\s+@-\s+https?://
    - index: 1
      from:
        field: input
        call: (^|\.)readFileSync$
        argument: 0
        literal: /\.ssh/id_(rsa|ed25519|ecdsa)
    regex: (^|\.)execSync$

composite_rules:
- id: node-ssh-key-http-exfil
  desc: Node SSH key HTTP exfil
  conf: 0.98
  all:
  - id: objectives/credential-access/ssh/key::node-ssh-key-read-loop
  - id: micro-behaviors/communications/http/telemetry::node-host-profile-json-http-context
- id: node-ssh-private-key-post-exfil
  for: [javascript, typescript, npm]
  desc: Node package reads SSH private keys and posts them
  crit: hostile
  conf: 0.99
  platforms: [unix]
  scope: archive
  attack: T1552.004,T1041
  all:
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
  - id: micro-behaviors/communications/http/post::node-http-request-post
  - id: micro-behaviors/communications/http/request/body::request-end-body-call
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-rsa
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-ecdsa
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-ed25519
  unless:
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/app/infrastructure/

  # Sibling variant of the rule above for stealers that never touch the fs
  # API: keys are catted through a spawned shell (`sh -c`) and the loot goes
  # out over cleartext http.request with a written body to a literal-IP
  # collector. Multiple key filenames plus a direct-IP body sink plus sync
  # shell execution is the combination a backup or deploy tool has no reason
  # to exhibit.
- id: node-shell-read-ssh-key-http-body-exfil
  desc: Shell-read SSH keys exfiltrated over HTTP
  crit: hostile
  conf: 0.98
  attack: T1552.004,T1041
  mbc: "E1552, E1041"
  all:
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
  - id: micro-behaviors/communications/http/request/body::node-http-request-body
  - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-posix-interpreter
  - id: micro-behaviors/process/create/exec::node-spawnsync-call
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  needs: 1
  unless:
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/app/infrastructure/

- id: node-read-ssh-key-curl-stdin-post
  desc: Node uploads SSH private key through curl
  crit: hostile
  conf: 0.99
  attack: T1552.004,T1041
  all:
  - id: objectives/exfiltration/stealer/credential/value/key::node-ssh-key-curl-input-flow
  - id: metadata/import/builtin::require-child-process
  - id: metadata/import/builtin::require-fs
