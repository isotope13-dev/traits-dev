defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]

composite_rules:
  - id: private-key-aia-client-auth
    desc: Private-key AIA carrier beside mTLS request
    # Certificate reload and the remote validator's fetch are not statically
    # bound here. Report co-occurrence, not a proven successful sandbox escape.
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/certificate/extensions::private-key-aia-carrier
      - id: micro-behaviors/communications/http/tls::client-certificate-request
