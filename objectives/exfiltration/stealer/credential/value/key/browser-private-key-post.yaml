defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056,T1041
composite_rules:
  - id: browser-private-key-input-http-post
    desc: Private-key input and field alongside HTTP POST
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/data/serialize/schema-credential::js-private-key-input-request-field
      - id: micro-behaviors/data/property/access::form-named-value-member
      - id: micro-behaviors/communications/http/request/json::fetch-direct-json-post-body
      - id: micro-behaviors/communications/url/host/http::fetch-absolute-url-target
