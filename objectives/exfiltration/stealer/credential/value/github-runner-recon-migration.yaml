defaults:
  platforms: [unix, windows]
composite_rules:
  - id: github-actions-memdump-webhook-exfil
    desc: Memory-dump script and webhook POST clues
    crit: hostile
    conf: 0.99
    attack: "T1003, T1041"
    for:
      - shell
    all:
      - id: micro-behaviors/communications/http/download/curl::memdump-script-download-command
      - id: metadata/lang/source/syntax/command/pipeline::sudo-interpreter-pipeline-text
      - id: micro-behaviors/communications/http/request/oob::curl-webhook-post
      - id: micro-behaviors/data/decode/command::double-base64-decode
