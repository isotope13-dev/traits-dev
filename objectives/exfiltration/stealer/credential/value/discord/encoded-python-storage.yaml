defaults:
  for: [python]
  platforms: [windows]
traits:
  - id: encoded-discord-token-request-expression
    desc: Encoded request reads Discord tokens
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: 'urlopen\(.{0,500}discord.{0,400}\.read\(\).{0,100}\.split\([''\"]token'
composite_rules:
  - id: decoded-discord-token-request-exec
    desc: Executes encoded Discord token HTTP export
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1041,T1027
    all:
      - id: encoded-discord-token-request-expression
      - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-base64-result
