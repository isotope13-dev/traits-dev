# Browser extension that reads Steam's authentication cookies and serializes
# them into a JSON body POSTed with fetch. steamLoginSecure (with sessionid)
# is the Steam web session credential, so a remote copy permits account
# takeover without the password. The extension API receiver may be minified
# to an alias (X.cookies.get), hence the receiver-agnostic cookie read leg.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1539,T1041

composite_rules:
  - id: extension-steam-login-cookie-json-post
    desc: Reads Steam login cookie and POSTs it as JSON
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/cookie-store::cookie-retrieval-api
      - id: micro-behaviors/communications/http/services/steam::steam-login-cookie-json-body-field
    any:
      - id: micro-behaviors/communications/http/request/json::fetch-flow-json-post-body
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
