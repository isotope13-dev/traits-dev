# Credential theft from Python packages that execute during installation or
# import.  The source incident involved a package published under a requested
# dependency name; the package identity is intentionally not part of this
# rule.  The useful static signal is the package execution boundary combined
# with credential collection and an outbound structured request.
defaults:
  platforms: [windows, unix]
  for: [python, whl, python_sdist]
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1041

composite_rules:
  - id: objectives/exfiltration/stealer/credential/value::pypi-setup-env-credential-exfil
    desc: setup.py filters credential-named environment values for a POST
    crit: hostile
    conf: 0.99
    mbc: E1552,E1041
    for: [python]
    near_bytes: 8192
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/os/env/secret-name::python-environ-credential-name-filter
      - id: micro-behaviors/communications/http/request/client::python-post-transport

  # `dict(os.environ)` captures every process variable, including credentials
  # whose names the attacker did not predict.  An OOB collector plus an HTTP
  # POST makes the destination and transfer explicit; setup.py makes this run
  # merely because pip inspects or installs the source distribution.  Keep the
  # matcher independent of any campaign package name or collector UUID.
