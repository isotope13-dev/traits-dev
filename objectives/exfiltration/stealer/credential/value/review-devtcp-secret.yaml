defaults:
  for:
  - shell
  platforms:
  - unix
  attack: T1552,T1048
  mbc: E1020
traits:
- id: shell-secret-output-to-devtcp
  desc: Secret variable output redirected to TCP
  crit: suspicious
  conf: 0.97
  if:
    type: tree-sitter
    query: |
      ((redirected_statement
        body: (command name: (command_name (word) @sender) !redirect
          . argument: [(raw_string) (string . (string_content) .)] @format
          argument: [
            (simple_expansion (variable_name) @secret)
            (expansion (variable_name) @secret)
            (string [(simple_expansion (variable_name) @secret)
                     (expansion (variable_name) @secret)])])
        . redirect: (file_redirect ">" destination: (word) @endpoint) @redirect .) @export
       (#eq? @sender "printf")
       (#match? @format "(^|[^%])(%%)*%[-+0-9.]*[sbq]")
       (#match? @secret "(?i)(^|_)(SECRET|PASSWORD|TOKEN|API_KEY)(_|$)")
       (#match? @endpoint "^/dev/tcp/([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,5}$")
       (#match? @redirect "^1?>"))
  unless:
  - id: metadata/lang/source/declaration::shell-printf-function
composite_rules:
- id: secret-env-var-to-devtcp-endpoint
  desc: Sends secret variable to external TCP socket
  crit: hostile
  conf: 0.98
  near_bytes: 0
  all:
  - id: objectives/exfiltration/stealer/credential/value::shell-secret-output-to-devtcp
  - id: micro-behaviors/communications/socket/tcp::dev-tcp-external-ip
