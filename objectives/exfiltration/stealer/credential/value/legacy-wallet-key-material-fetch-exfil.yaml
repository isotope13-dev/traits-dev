defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: wallet-key-material-fetch-exfil
    desc: Exfiltrates wallet key material through fetch in a request header
    conf: 0.995
    scope: file
    all:
      - id: micro-behaviors/crypto/key/representation/reference::wallet-key-reference-profile
      - id: metadata/lang/source/syntax/call/invocation::key-material-reporting-name-set
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/os/telemetry/logging/analytics::x-request-id-header-map-entry
      - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
    any:
      - id: micro-behaviors/data/encode/base64/primitive::tostring-base64
      - id: micro-behaviors/communications/http/header/content-type::grpc-web-protobuf-content-type

