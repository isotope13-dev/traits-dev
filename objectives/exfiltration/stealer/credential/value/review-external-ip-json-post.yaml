composite_rules:
- crit: hostile
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1552.001,T1041
  mbc: E1041
  id: credential-sweep-posted-out
  desc: Credential sweep posted to collector
  all:
  - id: micro-behaviors/communications/http/request/client::python-http-post-any
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  any:
  - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-env-read
  - id: micro-behaviors/os/env/ai-provider::python-openai-anthropic-key-env-read
  - id: micro-behaviors/os/env/vcs::python-github-token-env-read
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
  needs: 2
  unless:
  - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
  - id: objectives/credential-access/env/harvesting::llm-and-aws-sdk-client-context
