defaults:
  for: [ruby]
  platforms: [unix]
traits:
  - id: ruby-shadow-data-encoded-message-dispatch
    desc: Shadow data encoded and passed to sender
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((method body: (body_statement
          (assignment left: (identifier) @secret right: (hash
            (pair value: (conditional consequence: (call arguments: (argument_list
              (string (string_content) @shadow)))))))
          (assignment left: (identifier) @message right: (hash (pair value: (identifier) @embedded)))
          (assignment left: (identifier) @encoded right: (call receiver: (constant) @b64 method: (identifier) @encode
            arguments: (argument_list (call receiver: (constant) @json method: (identifier) @generate
              arguments: (argument_list (identifier) @input)))))
          (begin (assignment right: (call method: (identifier) @send
            arguments: (argument_list (string) (identifier) @sent))))))
          (#eq? @shadow "cat /etc/shadow") (#eq? @secret @embedded)
          (#eq? @message @input) (#eq? @b64 "Base64") (#eq? @encode "strict_encode64")
          (#eq? @json "JSON") (#eq? @generate "generate") (#eq? @encoded @sent))
composite_rules:
  - id: ruby-shadow-encoded-http-exporter
    desc: Encoded shadow data with HTTP POST helper
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-shadow-data-encoded-message-dispatch
      - id: micro-behaviors/communications/http/request/body/construction::ruby-parameter-body-http-post-sender
