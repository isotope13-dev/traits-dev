defaults:
  platforms: [unix, appliance]
  for: [perl]
  attack: T1041

composite_rules:
  - id: perl-multipart-credential-exfil
    desc: Perl multipart credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: objectives/exfiltration/http/collect::perl-harvest-dat-filename
      - id: objectives/exfiltration/http/collect::perl-socket-http-send
    any:
      - id: micro-behaviors/os/security/auth/password::perl-password-assignment
      - id: micro-behaviors/os/security/auth/password::perl-passwd-assignment
      - id: micro-behaviors/os/security/auth/secret::perl-secret-assignment
      - id: micro-behaviors/os/security/auth/secret::perl-token-assignment
      - id: micro-behaviors/os/security/auth/secret::perl-api-key-assignment
