# Live page fields are input, not browser-owned credential databases.
# Both rules require a password value bound to the outgoing JSON POST.
defaults:
  platforms: [unix, windows]
  attack: T1056.003,T1041

composite_rules:
- id: extension-posts-saved-password-record-to-remote-script
  desc: Extension attempts to POST a saved password to a remote script
  crit: hostile
  conf: 0.99
  attack: T1041,T1056.003
  scope: archive
  for: [crx, xpi, zip, chrome-manifest, javascript, typescript]
  all:
  - id: objectives/credential-access/capture/input::saved-login-password-forwarded-to-runtime
  - id: micro-behaviors/communications/http/request/client::fetch-posts-runtime-message-to-google-script

- id: extension-browser-password-remote-forwarding
  desc: Browser extension forwards captured login credentials to a hardcoded remote host
  crit: hostile
  conf: 0.99
  scope: archive
  for: [javascript, crx, zip, chrome-manifest]
  all:
  - id: metadata/file/format/browser-extension::web-extension-root-manifest
  - id: micro-behaviors/communications/http/request/credentials/application-state::page-password-fields-remote-json-post
  any:
  - id: metadata/permission/host::broad-host-access
  - id: metadata/permission/host::permission-all-urls
