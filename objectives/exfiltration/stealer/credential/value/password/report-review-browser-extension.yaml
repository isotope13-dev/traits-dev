defaults:
  platforms: [unix, windows]
  for: [javascript, crx, zip]
  attack: T1041

composite_rules:
  - id: extension-credential-forwarding-to-auth-service
    desc: Extension forwards credentials remotely
    crit: hostile
    conf: 0.99
    attack: T1041,T1056.003
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/file/format/browser-extension::is-chrome-manifest
      - id: objectives/credential-access/phishing/mfa::extension-remote-auth-endpoint
      - id: micro-behaviors/data/serialize/schema-credential::username-password-json-body
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
