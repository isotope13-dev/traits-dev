defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, javascript, typescript, zip]
  attack: T1056.003,T1041
composite_rules:
  - id: all-site-password-capture-post-cooccurrence
    desc: All-site password capture and remote POST
    crit: suspicious
    conf: 0.90
    scope: archive
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/communications/ipc/message::content-script-password-capture-message
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
    any:
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    needs: 1
    unless:
      - id: well-known/app/browser-extension/keepassxc-browser::source-extension
      - id: well-known/app/finance/myetherwallet/
      - id: objectives/exfiltration/http/browser-extension::supabase-auth-password-login
      - id: objectives/credential-access/browser/extension::first-party-account-auth-signin


  - id: remote-controlled-extension-password-post
    desc: Browser controller captures passwords and POSTs
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: all-site-password-capture-post-cooccurrence
      - id: objectives/command-and-control/remote-command/extension::extension-websocket-browser-remote-control
