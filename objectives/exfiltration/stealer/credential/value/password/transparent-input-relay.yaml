# Kit A's invisible credential controls, input capture and encrypted WebSocket
# relay are described on pp. 5-9 of the Material Security whitepaper. Require
# the concealment and anti-inspection context, not Google branding, names,
# receiving domains, crypto keys or the historical WebSocket path.
# This is bounded co-occurrence, not a proof of a password-to-socket binding.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: transparent-password-websocket-capture
    desc: Transparent password markup, input capture, WebSocket send and anti-debugging
    crit: suspicious
    conf: 0.9
    attack: T1056.003
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/password-field::transparent-password-input-markup
      - id: micro-behaviors/ui/window/form-input::edit-listener-with-form-value-read
      - id: micro-behaviors/communications/websocket/send::websocket-instance-send-call
    any:
      - id: objectives/anti-analysis/debugger-detect/browser::js-function-constructor-debugger
      - id: objectives/anti-analysis/debugger-detect/browser::js-id-getter-blank-navigation
