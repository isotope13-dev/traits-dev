defaults:
  for: [ne]
  platforms: [windows]
  attack: T1041

traits:
  - id: aol-password-change-dialog
    desc: References AOL Change Your Password dialog
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Change Your Password

  # The AOL password box caption "Pass Word" in a Win16 sign-on form.
  - id: aol-password-field-label
    desc: AOL sign-on form labels Pass Word
    crit: notable
    conf: 0.88
    if:
      type: text
      case_insensitive: true
      substr: 'Pass Word'

  - id: aol-password-prompt-text
    desc: References AOL password prompt
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: Please enter a password.

composite_rules:
  - id: win16-aol-password-mail-exfil
    desc: Win16 AOL automation steals passwords via mail
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
      - id: objectives/impact/spam/chat::aol-compose-mail-menu
    any:
      - id: aol-password-change-dialog
      - id: aol-password-prompt-text
      - id: aol-password-field-label
      - id: objectives/credential-access/files/password-database::aol-stored-password-dialog-text
      - id: objectives/credential-access/phishing/prompt::win16-aol-billing-card-phish
      - id: objectives/credential-access/phishing/prompt::win16-aol-billing-password-phish
      - id: objectives/credential-access/phishing/prompt::win16-aol-signon-password-label
