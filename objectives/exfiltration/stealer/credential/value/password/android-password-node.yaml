# Bind the tested node to the text read, and the populated record to the send.
# A socket elsewhere in an accessibility service is insufficient evidence.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1417.001,T1041

traits:
  - id: java-password-node-record-send
    for: [java]
    desc: Sends text records from password nodes
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((class_declaration body: (class_body
          (field_declaration type: (type_identifier) @socket_type
            declarator: (variable_declarator name: (identifier) @socket_field))
          (method_declaration body: (block (if_statement
          condition: (parenthesized_expression [
            (method_invocation object: (identifier) @guard name: (identifier) @test)
            (binary_expression
              right: (method_invocation object: (identifier) @guard name: (identifier) @test))
          ])
          consequence: (block
            (expression_statement (method_invocation
              object: (identifier) @record name: (identifier) @put
              arguments: (argument_list
                (string_literal)
                (method_invocation
                  object: (method_invocation
                    object: (identifier) @node name: (identifier) @text)
                  name: (identifier) @stringify))))
            (expression_statement (method_invocation
              object: (identifier) @channel name: (identifier) @send
              arguments: (argument_list (method_invocation
                object: (identifier) @sent name: (identifier) @serialize)))))) @capture))))
          (#eq? @test "isPassword") (#eq? @guard @node)
          (#eq? @put "put") (#eq? @text "getText")
          (#eq? @stringify "toString") (#eq? @serialize "toString")
          (#eq? @send "send") (#eq? @record @sent)
          (#eq? @socket_type "WebSocket") (#eq? @socket_field @channel))

  # Kotlin receiver calls are absent from call facts, and the rule engine
  # has no Kotlin tree-sitter condition backend. Compare identifier bytes in
  # one positive password branch: tested node == read node, populated record
  # == serialized record, sender == declared WebSocket. No specimen names.
  - id: kotlin-password-node-record-send
    desc: Sends password-node JSON through typed WebSocket
    crit: suspicious
    conf: 0.98
    for: [kotlin]
    size_max: 200000
    if:
      type: yara
      source: |
        rule kotlin_password_record_websocket_send {
          strings:
            $socket = /\b[A-Za-z_][A-Za-z0-9_]*:[ \t]*WebSocket\b/
            $branch = /if\s*\(\s*([A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*\(\)\s*&&\s*)?[A-Za-z_][A-Za-z0-9_]*\.isPassword\(\)\s*\)\s*\{[^{}]{1,600}\}/
            $test = /\b[A-Za-z_][A-Za-z0-9_]*\.isPassword\(\)/
            $put = /\b[A-Za-z_][A-Za-z0-9_]*\.put\("[^"\\\n]{1,32}",[ \t]*/
            $read = /\b[A-Za-z_][A-Za-z0-9_]*\.getText\(\)\.toString\(\)/
            $send = /\b[A-Za-z_][A-Za-z0-9_]*\.send\(/
            $serialized = /\b[A-Za-z_][A-Za-z0-9_]*\.toString\(\)\)/
          condition:
            all of them and
            for any b in (1..#branch) : (
              for any t in (1..#test) : (
                @test[t] >= @branch[b] and @test[t] < @branch[b] + !branch[b] and
                for any p in (1..#put) : (
                  @put[p] > @test[t] and
                  for any r in (1..#read) : (
                    @read[r] == @put[p] + !put[p] and
                    !test[t] - 13 == !read[r] - 21 and
                    for all n in (0..!test[t]-14) : (
                      uint8(@test[t]+n) == uint8(@read[r]+n)
                    ) and
                    for any s in (1..#send) : (
                      @send[s] > @read[r] + !read[r] and
                      for any j in (1..#serialized) : (
                        @serialized[j] == @send[s] + !send[s] and
                        @serialized[j] + !serialized[j] < @branch[b] + !branch[b] and
                        uint8(@put[p] + !serialized[j] - 12) == 0x2e and
                        for all n in (0..!serialized[j]-13) : (
                          uint8(@put[p]+n) == uint8(@serialized[j]+n)
                        ) and
                        for any w in (1..#socket) : (
                          @socket[w] < @branch[b] and
                          uint8(@socket[w] + !send[s] - 6) == 0x3a and
                          for all n in (0..!send[s]-7) : (
                            uint8(@socket[w]+n) == uint8(@send[s]+n)
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
        }

composite_rules:
  - id: android-accessibility-password-record-export
    desc: Accessibility exports password-node text records
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/capture/input::android-accessibility-password-node-read
      - id: micro-behaviors/communications/websocket/client::android-okhttp-websocket-import
    any:
      - id: objectives/exfiltration/stealer/credential/value/password::java-password-node-record-send
      - id: objectives/exfiltration/stealer/credential/value/password::kotlin-password-node-record-send
