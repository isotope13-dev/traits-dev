defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1552.004,T1041

traits:
  - id: vb-reflect-wifi-passwords-socket
    desc: Sends embedded Wi-Fi collector results by socket
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule vb_reflect_wifi_passwords_socket {
          strings:
            $load = "System.Reflection.Assembly.Load" nocase
            $collector = "GetWifiPasswords.Wifi" nocase
            $method = "GetPassword" nocase
            $invoke = ".Invoke(" nocase
            $packet = ".Misc =" nocase
            $send = /\.Send\s*\([^\r\n]{0,50}\.GetStream/ nocase
          condition:
            all of them
        }
