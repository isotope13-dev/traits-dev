defaults:
  platforms: [windows, unix]
  for: [html, rtf]
  crit: hostile
  conf: 0.98
  attack: T1041,T1056.003

composite_rules:
  - id: password-attempt-form-collector
    desc: Retained password input targets form collector
    all:
      - id: micro-behaviors/ui/controls/credential::password-input-field
      - id: micro-behaviors/ui/window/form-input::jquery-copy-value-before-cancel
      - id: micro-behaviors/communications/http/services/nocodeform::form-collection-fetch
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/request/body/construction::post-options-named-expression-body
