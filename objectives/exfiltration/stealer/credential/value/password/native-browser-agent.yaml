defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-browser-password-upload-agent
    desc: Native browser password decryption and upload workflow
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1041
    all:
      - id: micro-behaviors/data/db/query::chromium-login-query-reference
      - id: micro-behaviors/os/security/dpapi::dpapi-with-chromium-login-data-reference
      - id: micro-behaviors/communications/transfer::password-upload-status-diagnostic
      - id: micro-behaviors/communications/http/lib/crate::reqwest-crate
