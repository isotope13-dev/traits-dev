# A CLI password prompt followed by an HTTP request whose URL carries that
# password in a query parameter. The request construction and send must both
# be present; prompting or credentialed authentication alone is not theft.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056,T1041

traits:
  - id: cli-employee-password-prompt
    desc: CLI prompts for employee password
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(employee credentials|enter password)'
      exclude_comments: true

  - id: js-password-query-url-value
    desc: Password enters encoded URL query
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: encodeURIComponent(password)
      exclude_comments: true

  - id: js-password-query-parameter
    desc: URL query has pass parameter
    crit: component
    conf: 0.96
    if:
      type: text
      substr: '&pass='
      exclude_comments: true

  - id: js-auth-url-location-parameter
    desc: Auth URL includes location telemetry
    crit: component
    conf: 0.96
    if:
      type: text
      substr: '&loc='
      exclude_comments: true

  - id: js-auth-url-device-parameter
    desc: Auth URL includes device telemetry
    crit: component
    conf: 0.96
    if:
      type: text
      substr: '&dev='
      exclude_comments: true

  - id: js-fetch-sends-query-url
    desc: Fetch sends a constructed URL
    crit: component
    conf: 0.92
    if:
      type: text
      substr: fetch(url
      exclude_comments: true

