defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1056.003

traits:
  - id: encoded-password-query-field
    desc: Encodes a password in a URL query
    crit: notable
    if:
      type: text
      regex: '(?i)[?&](pass(word)?|passwd)=.{0,80}encodeURIComponent\('
  - id: encoded-identity-query-field
    desc: Encodes an identity in a URL query
    crit: notable
    if:
      type: text
      regex: '(?i)[?&](id|user(name)?|email|employee.?id)=.{0,80}encodeURIComponent\('
  - id: prompt-password-input-call
    desc: Calls password input helper
    crit: notable
    if:
      type: symbol
      kind: call
      exact: askPassword

composite_rules:
  - id: prompted-credentials-sent-in-query
    desc: Sends prompted credentials in an HTTP query
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: encoded-password-query-field
      - id: encoded-identity-query-field
      - id: prompt-password-input-call
      - id: micro-behaviors/communications/http/request/client::fetch-url-variable-or-literal
