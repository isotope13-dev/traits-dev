defaults:
  platforms: [unix, windows]
  for: [npm, javascript]
  attack: T1041,T1539

composite_rules:
  - id: facebook-appstate-forwarded-to-neokex-service
    desc: Forwards Facebook session cookies to a remote service
    crit: hostile
    conf: 0.99
    scope: package
    all:
      - id: objectives/credential-access/messaging::facebook-appstate-cookie-normalization
      - id: micro-behaviors/communications/http/request/credentials/application-state::node-session-create-appstate-post
      - id: micro-behaviors/communications/url/host/http::neokex-fca-session-service-url
