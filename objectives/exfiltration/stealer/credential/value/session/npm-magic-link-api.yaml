defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: bulk-account-generation-api
    desc: Requests bulk account generation
    crit: suspicious
    if:
      type: text
      substr: "bulkGenerate"
  - id: bulk-account-api-route
    desc: References bulk account API route
    crit: notable
    if:
      type: text
      substr: "/api/bulk"

composite_rules:
  - id: remote-magic-link-upload
    desc: Uploads email and login link to remote API
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/serialize/schema-credential::json-stringify-magic-link-field
      - id: micro-behaviors/data/serialize/schema-object::json-stringify-email-field
      - id: bulk-account-generation-api
      - id: bulk-account-api-route
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
