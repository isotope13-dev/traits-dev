# Session material forwarded by an extension through a callback navigation and
# an HTML form POST.  The atoms describe the transport; the hostile rule also
# requires credential collection from the companion extension files.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, crx, zip]
  attack: T1041,T1539

composite_rules:
  - id: telegram-web-session-state-websocket-exfiltration
    desc: Exfiltrates Telegram Web auth state
    crit: hostile
    conf: 0.995
    attack: T1041,T1539,T1528
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: objectives/credential-access/messaging::telegram-web-authenticated-storage-serialization
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/socket/send/message::javascript-socket-send
      - id: micro-behaviors/process/inject/webextension::extension-page-script-injection
      - id: metadata/permission/host::content-script-matches-im-web-app

  - id: extension-collected-session-callback-exfil
    desc: Extension forwards collected authenticated session data through a callback form
    crit: hostile
    conf: 0.995
    attack: T1041,T1539,T1528
    scope: archive
    for: [crx, zip, javascript, html, chrome-manifest]
    all:
      - id: micro-behaviors/data/db/enumerate::browser-storage-sweep-loop
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/data/encode/url::extension-session-data-url-forward
      - id: micro-behaviors/ui/window/form-input::extension-callback-action
      - id: micro-behaviors/ui/window/form-input::extension-callback-session-field
      - id: micro-behaviors/ui/window/form-input::browser-form-submit
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/token-auth::access-token
      - id: micro-behaviors/communications/http/token-auth::refresh-token
