defaults:
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.99
  mbc: B0028
composite_rules:
- for:
  - xpi
  - crx
  - zip
  - javascript
  - chrome-manifest
  - html
  - svg
  - json
  attack: T1056.002,T1041,T1036
  id: wallet-input-telemetry-http-exfiltration
  desc: Wallet entry and HTTP sink belie no-data claim
  scope: archive
  all:
  - id: micro-behaviors/ui/controls/credential::credential-input-surface
  - id: micro-behaviors/ui/controls/wallet::wallet-phrase-entry-surface
  - id: micro-behaviors/data/property/access::dom-value-report-channel
  - id: metadata/permission/telemetry::gecko-no-data-collection-claim
  any:
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-numeric-endpoint-json-post
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-veiled-domain-endpoint-json-post
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-xor-charcode-endpoint-post
  - id: micro-behaviors/communications/url/construction/build-http::external-ip-json-beacon-builder
- for:
  - javascript
  - xpi
  - crx
  attack: T1041
  id: wallet-secret-callback-http-exfiltration
  desc: Extension sends wallet input through callback JSON POST
  scope: archive
  all:
  - id: metadata/file/format/browser-extension::xpi-member-path
  - id: micro-behaviors/ui/controls/credential::credential-entry-label
  - id: micro-behaviors/data/property/access::js-value-property-read
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/header/content-type::json-header
  any:
  - id: micro-behaviors/data/serialize/schema-credential::secret-data-property
  - id: objectives/exfiltration/sensitive-data/source::js-input-value-data-field
