defaults:
  platforms: [android]
  for: [dex]
composite_rules:
  # The source is OCR over local images, the selector is mnemonic terminology,
  # and the sink packages recognized text and its source image together with
  # a device identifier. No family name or historical server is required.
  - id: android-mnemonic-image-ocr-upload
    desc: Mnemonic OCR and image upload chain
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/data/parse/ocr::dex-mlkit-recognized-text-read
      - id: micro-behaviors/data/parse/ocr::dex-mlkit-text-blocks-read
      - id: micro-behaviors/communications/http/request/body/multipart::android-photo-ocr-device-upload
      - id: micro-behaviors/fs/directory/readdir/language::dex-file-list-children-call
      - id: micro-behaviors/communications/http/request/verb::dex-http-urlconnection-post-method
      - id: metadata/lang/source/literal/string/credential::dex-mnemonic-selector-literal
