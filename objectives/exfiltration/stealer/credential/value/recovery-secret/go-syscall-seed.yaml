defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-clipboard-seed-telegram-export
    desc: Go clipboard seed-phrase Telegram export
    crit: hostile
    conf: 0.98
    attack: T1115,T1041
    all:
      - id: micro-behaviors/os/clipboard/read::go-clipboard-syscall-read-call
      - id: micro-behaviors/crypto/mnemonic::lowercase-twelve-to-twentyfour-word-regex
      - id: micro-behaviors/communications/messaging/send::go-send-seed-notification-call
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/post::http-post
