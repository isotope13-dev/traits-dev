defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript, go, rust]
  attack: T1555,T1041

composite_rules:
  - id: electron-hook-wallet-file-export
    desc: Wallet seed reads accompany credential-hook HTTP export
    crit: hostile
    conf: 0.98
    near_bytes: 10000
    all:
      - id: objectives/exfiltration/stealer/input::electron-hook-secret-http-export
      - id: objectives/credential-access/wallet/desktop::exodus-seed-file-read
      - id: micro-behaviors/fs/path/wallet::exodus-wallet-file-reference
