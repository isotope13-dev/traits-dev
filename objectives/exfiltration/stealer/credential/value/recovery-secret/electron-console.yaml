# Acquisition, UI suppression and body emission are required roles. These
# co-occurring code structures do not prove a specific runtime request value.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, typescript, go, rust]
  attack: T1056,T1041
composite_rules:
  - id: electron-hidden-recovery-ui-http-profile
    desc: Seed capture, window hiding and HTTP output
    crit: suspicious
    conf: 0.98
    near_bytes: 200000
    all:
      - id: objectives/credential-access/capture/input::electron-recovery-seed-console-capture
      - id: micro-behaviors/ui/window/visibility::electron-hide-enumerated-windows
      - id: micro-behaviors/communications/http/request/body::request-write-raw-data-variable
    any:
      - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
