defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86

composite_rules:
  - id: wallet-seed-http-exfil
    desc: Collected wallet seed words sent to a remote HTTP endpoint
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    for: [javascript]
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/ui/controls/wallet::wallet-seed-word-field-code
      - id: micro-behaviors/data/property/access::js-value-property-read
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  # Fetching a wordlist and assembling a phrase are normal wallet behavior.
  # Require the assembled variable itself in a POST body; the remote import
  # remains suspicious until the unconditional false-error workflow is present.
  - id: bip39-autocomplete-seed-exfil
    desc: Fetched wordlist with joined-seed JSON POST
    crit: suspicious
    conf: 0.97
    attack: T1056.003
    all:
      - id: micro-behaviors/crypto/mnemonic::bip39-wordlist-http-fetch
      - id: micro-behaviors/ui/controls/wallet::web-seedword-entry-form
      - id: micro-behaviors/communications/http/post::joined-mnemonic-json-post

  # The success callback takes no response and immediately reveals an error.
  # Actual validation callbacks and unrelated analytics must not convict.
  - id: seed-export-invalid-message
    desc: Seed POST with unconditional invalid error
    crit: hostile
    conf: 0.99
    attack: T1056.003
    all:
      - id: micro-behaviors/ui/controls/wallet::web-seedword-entry-form
      - id: micro-behaviors/ui/controls/wallet::invalid-seed-phrase-error
      - id: micro-behaviors/communications/http/post::joined-mnemonic-json-post
      - id: objectives/credential-access/phishing/operator-control::seed-post-unconditional-error
