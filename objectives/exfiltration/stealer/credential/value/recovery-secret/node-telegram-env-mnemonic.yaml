defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1041

traits:
  - id: telegram-bot-api-import
    desc: Imports the Node Telegram bot API
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'require\s*\(\s*["'']node-telegram-bot-api["'']\s*\)'

  - id: telegram-send-env-mnemonic
    desc: Sends environment mnemonic through Telegram
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: (?s)\.sendMessage\s*\([^;]{0,400}process\.env\.MNEMONIC\b

composite_rules:
  - id: node-telegram-env-mnemonic-exfil
    desc: Sends wallet recovery phrase to Telegram
    crit: hostile
    conf: 0.995
    near_bytes: 2000
    all:
      - id: telegram-send-env-mnemonic
    any:
      - id: telegram-bot-api-import
      - id: micro-behaviors/communications/http/services/telegram::node-telegram-bot-constructor