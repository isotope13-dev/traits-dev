defaults:
  platforms: [unix]
  for: [shell, python, javascript, typescript, rust, github-actions]
  attack: "T1195.002, T1552.001"
composite_rules:
- id: gha-log-token-exfil
  for: [shell]
  desc: GitHub token exfiltrated through logs
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/encode/output/base64::gha-env-gzip-base64-log
  - id: micro-behaviors/data/encode/output/base64::gha-extraheader-gzip-base64-log

