defaults:
  platforms: [unix, windows]
  for: [ruby]
  size_max: 262144

composite_rules:
  # Bound positive selection and send, not ENV.reject or a nearby HTTP API.
  # Runtime invocation is not required for a dedicated attack/PoC helper.
  - id: ruby-sensitive-env-json-host-post
    desc: Ruby env-secret POST with host/user context
    crit: hostile
    conf: 0.98
    attack: T1041,T1552.001
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
      - id: micro-behaviors/os/env/user-info::ruby-username-field-from-env-or-login
    any:
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-marker-filtered-env-json-net-http-post-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-sensitive-env-json-net-http-post-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-filtered-env-json-net-http-request-body
    needs: 1
