defaults:
  platforms: [unix]
  for: [rust]
  attack: T1552.001,T1041
traits:
  - id: rust-signer-private-key-argument
    desc: Rust checks signer private-key arguments
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'signer-private-key'
  - id: rust-curl-data-loot-buffer
    desc: Rust curl posts a loot buffer
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '"-d"\s*,\s*&loot\b'
composite_rules:
  - id: rust-build-git-proc-loot-post
    desc: Cargo hook posts process and credential loot
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/exfiltration/stealer/configuration/environment::rust-build-rs-env-exfil
      - id: micro-behaviors/fs/path/token::git-credentials
      - id: micro-behaviors/fs/proc/info/listing::rust-proc-directory-enumeration
      - id: rust-signer-private-key-argument
      - id: rust-curl-data-loot-buffer
