composite_rules:
- platforms:
  - windows
  - unix
  for:
  - perl
  attack: T1041
  id: perl-env-lwp-http-exfil
  desc: Perl env LWP HTTP exfil
  crit: hostile
  conf: 0.98
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-useragent
  - id: micro-behaviors/os/env/enumerate::perl-sensitive-name-env-filter
  - id: micro-behaviors/communications/http/post::perl-post-http-url
  - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-post-env-content
