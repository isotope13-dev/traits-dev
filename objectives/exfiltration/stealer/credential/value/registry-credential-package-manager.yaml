defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
  attack: T1552.001
composite_rules:
- id: cargo-credential-theft
  desc: Cargo credential theft
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::cargo-credential-http-body-flow
  unless:
  - id: micro-behaviors/data/control-flow/branch::literal-false-credential-http-context
  - id: well-known/tool/development/toolchain/deno::source-archive-context
- id: ci-credential-theft
  desc: CI credential values enter HTTP body
  crit: hostile
  conf: 0.97
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/os/env/ci-credentials
  any:
  - id: micro-behaviors/communications/http/request/credentials/environment::fetch-body-bound-ci-token
  - id: objectives/exfiltration/stealer/configuration/environment::credential-environment-http-body
  downgrade:
    any:
    - id: micro-behaviors/communications/http/oauth/
    - id: micro-behaviors/communications/http/authorization-header::bearer-auth-header-template
    - id: micro-behaviors/communications/http/login/
