defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: pypi-custom-install-credential-exfil
    desc: PyPI custom install exfiltrates credential-named environment values
    crit: hostile
    conf: 0.99
    attack: "T1552.001,T1041"
    mbc: E1041
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: objectives/exfiltration/stealer/credential/value::python-environ-json-urllib-exfil
