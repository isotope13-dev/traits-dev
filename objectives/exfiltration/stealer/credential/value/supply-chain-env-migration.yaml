defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1552.001
composite_rules:
- id: pypi-setup-environment-exfil
  desc: PyPI setup.py exfiltrates filtered environment credentials
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - python
  scope: leaf
  all:
  - id: metadata/build/pip::setup-py
  - id: objectives/exfiltration/stealer/credential/value::python-environ-json-urllib-exfil
- id: python-setup-environment-requests-exfil
  desc: Python setup.py exfiltrates filtered environment credentials via requests
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - python
  scope: leaf
  all:
  - id: metadata/build/pip::setup-py
  - id: objectives/exfiltration/stealer/credential/value::python-environ-json-requests-exfil
- id: python-import-time-environment-exfil
  desc: Python package module exfiltrates filtered environment credentials on import
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - python
  scope: leaf
  all:
  - id: metadata/file/size::init-py-file
  - id: objectives/exfiltration/stealer/credential/value::python-environ-json-urllib-exfil
- id: rubygems-extconf-environment-exfil
  desc: RubyGems extconf build hook exfiltrates filtered environment credentials
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - ruby
  scope: leaf
  all:
  - id: metadata/build/package/recipe/gemspec::filename-extconf
  any:
  - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-sensitive-env-json-net-http-post-body
  - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-filtered-env-json-net-http-request-body
  - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-marker-filtered-env-json-net-http-post-body
- id: cargo-build-rs-environment-exfil
  desc: Cargo build script exfiltrates environment credentials
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  any:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::rust-reqwest-post-exfil
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::secret-http-request-flow
- id: javascript-filtered-environment-exfil
  desc: JavaScript filters credential-named environment values into fetch POST
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1041
  mbc: E1041
  for:
  - javascript
  - typescript
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  any:
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  - id: micro-behaviors/communications/http/request/credential-body-flow::filtered-env-map-to-fetch-json-body
  unless:
  - id: well-known/app/ai/browser-agent/phi-code-browser/
- id: npm-postinstall-filtered-environment-exfil
  desc: npm postinstall exfiltrates filtered environment credentials
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - javascript
  - typescript
  - package.json
  - npm
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/stealer/credential/value::javascript-filtered-environment-exfil
- id: npm-preinstall-filtered-environment-exfil
  desc: npm preinstall exfiltrates filtered environment credentials
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  mbc: E1041
  for:
  - javascript
  - typescript
  - package.json
  - npm
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/stealer/credential/value::javascript-filtered-environment-exfil
- id: js-prefixed-env-http-exfil
  desc: JavaScript exfils prefixed env vars
  crit: hostile
  conf: 0.97
  attack: T1041
  mbc: E1041
  for:
  - javascript
  - typescript
  all:
  - id: objectives/credential-access/env/secrets/bulk-access
  - id: micro-behaviors/os/env/read/collection::js-env-index-copy-to-object
  - id: micro-behaviors/communications/http/request/credentials/environment::js-app-env-prefix-filter
  - id: micro-behaviors/communications/http/request/body/environment::axios-post-env-body
  - id: micro-behaviors/communications/http/authorization-header::bearer-token
  any:
  - id: micro-behaviors/communications/http/ip-discovery::ip-sb-geoip
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
- id: sh-lifecycle-secret-env-oast-exfil
  desc: Lifecycle hook harvests secret env vars to OAST endpoint
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  scope: archive
  for:
  - npm
  - package.json
  - shell
  all:
  - id: micro-behaviors/os/env/pipeline::shell-token-env-secret-filter
  - id: micro-behaviors/communications/url/host/oob/package::oastify-url
  - id: micro-behaviors/process/create/shell/command-mode::npm-install-shell-command-string
  - id: micro-behaviors/data/encoding/base64::script-base64-word
