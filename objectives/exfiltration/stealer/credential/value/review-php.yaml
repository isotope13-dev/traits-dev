defaults:
  for: [php]
composite_rules:
- attack: T1041,T1552.001
  platforms:
  - unix
  - windows
  - macos
  id: php-filtered-env-curl-exfil
  desc: PHP sends filtered environment secrets by cURL
  crit: hostile
  conf: 0.99
  mbc: E1041
  scope: file
  near_bytes: 4096
  all:
  - id: objectives/credential-access/env/secrets/filtered-access::php-env-credential-harvest
  - id: micro-behaviors/data/serialize/json::php-json-encode
  - id: micro-behaviors/communications/http/curl/binding::post-data
  - id: micro-behaviors/communications/http/curl/binding::exec
  unless:
  - id: metadata/path/directory::test-directory-component

# The AWS secret is read from the environment and interpolated into the URL of
# a PHP fetch: the request itself carries the key. phpass 0.3.x-dev (2022)
# did this in PasswordHash's constructor. AWS clients sign requests with the
# secret; none put it in a URL. Host and path are unconstrained.
- id: php-aws-secret-in-fetched-url
  desc: PHP puts the environment's AWS secret into a fetched URL
  crit: hostile
  conf: 0.96
  platforms: [unix, windows]
  attack: T1552.001,T1041
  near_bytes: 400
  all:
  - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-env-read
  - id: micro-behaviors/communications/url/construction/template::php-environment-read-near-url-interpolation
