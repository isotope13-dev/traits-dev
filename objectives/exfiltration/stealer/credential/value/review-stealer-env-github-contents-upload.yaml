composite_rules:
- for:
  - shell
  - python
  - javascript
  - typescript
  - github-actions
  platforms:
  - unix
  - windows
  attack: T1552.001,T1041,T1567.001
  id: github-contents-credential-fallback
  desc: Credential export accompanies an encoded GitHub contents write
  crit: hostile
  conf: 0.98
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-encoded-write
  any:
  - id: objectives/supply-chain/credential-theft/env::javascript-filtered-environment-exfil
  - id: objectives/exfiltration/stealer/credential/value::python-environ-json-requests-exfil
