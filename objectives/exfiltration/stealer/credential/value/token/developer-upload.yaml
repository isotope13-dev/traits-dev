defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  attack: T1552,T1041

composite_rules:
- id: developer-token-discord-webhook-export
  desc: Exports a developer token with GitHub repository context
  crit: suspicious
  conf: 0.99
  for: [javascript, typescript]
  near_lines: 20
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/url/reference::telegram-discord-slack-api-url
  - id: micro-behaviors/communications/http/request/credentials::javascript-fallback-token-axios-data
  - id: micro-behaviors/os/env/cicd::process-env-github-repository
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
  - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
