defaults:
  platforms: [unix]
  for: [python]
  crit: hostile
  attack: T1552.007,T1041

traits:
  - id: python-serviceaccount-token-exfil-post
    desc: Posts service account token to exfil URL
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)(exfil|cb)[-_]url[\s\S]{0,240}json\.dumps\([^\n]{0,80}token'
    unless:
      - id: metadata/path/directory::test-directory-component
composite_rules:
  - id: python-serviceaccount-token-oob-upload
    desc: Kubernetes token uploaded to OOB collector
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/request/credentials/application-state::python-serviceaccount-token-oob-request
      - id: micro-behaviors/communications/http/upload/file::python-urllib-file-upload

  - id: python-gcp-serviceaccount-token-callback-stealer
    desc: Steals GCP service account token and posts to callback or DNS tunnel
    crit: hostile
    conf: 0.99
    all:
      - id: python-serviceaccount-token-exfil-post
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-token-path-concatenation
      - id: objectives/exfiltration/dns/tunnel::python-dns-exfil-lookup
