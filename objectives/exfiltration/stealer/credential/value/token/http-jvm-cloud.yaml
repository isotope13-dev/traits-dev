defaults:
  platforms: [unix]
  for: [class, jar]
  attack: T1041

composite_rules:
  - id: jvm-cloud-token-http-exfil
    desc: JVM cloud token HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/cloud/token/files::jvm-aws-iam-credential-path
      - id: objectives/credential-access/cloud/token/files::jvm-gcp-metadata-host
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: objectives/exfiltration/http/report::jvm-api-exfiltrate-path
