defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1528,T1555,T1567

traits:
  - id: pyc-discord-token-regex-bytes
    desc: Bytecode embeds Discord token regex
    crit: notable
    if:
      type: hex
      pattern: '5B 5C 77 2D 5D 7B ?? ?? 7D 5C 2E 5B 5C 77 2D 5D 7B ?? 7D 5C 2E 5B 5C 77 2D 5D 7B ?? ?? 7D'

composite_rules:
  - id: pyc-discord-token-webhook-collection
    desc: Bytecode targets Discord tokens and webhook
    crit: hostile
    conf: 0.98
    all:
      - id: pyc-discord-token-regex-bytes
      - id: micro-behaviors/fs/path/app-data/browser::chromium-leveldb-local-storage
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/services/discord::discord-api-users-me-url
