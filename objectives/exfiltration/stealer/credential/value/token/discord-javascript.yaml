defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: hostile
  conf: 0.99
composite_rules:
- id: discord-token-http-query-exfiltration
  desc: Extension sends Discord token in an HTTP query
  attack: T1041,T1539,T1528
  scope: archive
  for:
  - crx
  - xpi
  - zip
  - javascript
  - chrome-manifest
  all:
  - id: micro-behaviors/data/db/web-storage::browser-storage-token-key-read
  - id: micro-behaviors/communications/http/request/credentials::token-variable-in-fetch-query
  - id: metadata/permission/host::host-permission-discord
- id: discord-credential-labeled-payload-exfiltration
  desc: Sends a labeled credential payload to a Discord webhook
  attack: T1041,T1552.001,T1567.002
  mbc: E1041
  all:
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: objectives/exfiltration/messaging/discord::credential-field-label
  near_lines: 80
- id: discord-leveldb-token-validate-webhook-exfiltration
  desc: Validates harvested Discord tokens and posts account data to a webhook
  attack: T1041,T1539,T1528,T1567.002
  mbc: E1041
  all:
  - id: micro-behaviors/data/format/credentials::discord-token-regex-source-variants
  - id: micro-behaviors/communications/http/services/discord::discord-api-users-me-url
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
- id: discord-leveldb-token-api-validation
  desc: Validates locally harvested Discord tokens
  attack: T1528,T1555.003
  all:
  - id: micro-behaviors/data/format/credentials::discord-token-regex-source-variants
  - id: micro-behaviors/communications/http/services/discord::discord-api-users-me-url
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
