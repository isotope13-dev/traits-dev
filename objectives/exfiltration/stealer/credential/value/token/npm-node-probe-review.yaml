defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

  attack: T1195.002,T1041
composite_rules:
  - id: node-trycloudflare-magic-link-phish
    desc: Node forwards magic-link token to trycloudflare backend
    crit: suspicious
    conf: 0.93
    all:
      - id: well-known/dual-use/tunnel/cloudflared::trycloudflare-domain
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/data/serialize/schema-object::json-stringify-email-field
      - id: micro-behaviors/data/serialize/schema-credential::json-stringify-magic-link-field

  # Activator lures that hide the exfil host behind a mutable GitHub raw JSON
  # config (apiBase) still POST email plus magic-link bearer tokens.
  - id: node-github-raw-config-magic-link-phish
    desc: GitHub raw config backs magic-link exfil POST
    crit: suspicious
    conf: 0.94
    near_bytes: 4096
    all:
      - id: well-known/app/development/code-forge/github::github-raw-url
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/data/serialize/schema-object::json-stringify-email-field
      - id: micro-behaviors/data/serialize/schema-credential::json-stringify-magic-link-field
