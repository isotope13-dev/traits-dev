defaults:
  crit: hostile
  for:
  - pe
  platforms:
  - windows
  attack: T1041
  mbc: C0014
composite_rules:
- id: dotnet-discord-token-stealer
  desc: .NET Discord token parser with crypto/HTTP
  conf: 0.99
  attack: T1555.003,T1041,T1140
  all:
  - id: objectives/credential-access/discord/token::discord-token-parser-symbol
  - id: micro-behaviors/communications/http/client/managed::webclient
  - id: micro-behaviors/crypto/decrypt::dotnet-rijndael-decryptor
  - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
- id: dotnet-multi-source-credential-stealer
  desc: .NET credential collector with clipboard and HTTP
  conf: 0.98
  attack: T1056.002,T1041,T1555
  all:
  - id: objectives/credential-access/discord/token::discord-token-parser-symbol
  - id: micro-behaviors/os/clipboard/reference::clipboard-resource-reference
  - id: micro-behaviors/communications/http/client/managed::webclient
  - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
- id: native-discord-token-runtime-http-exfil
  desc: Native Discord token stealer with runtime WinHTTP transfer
  conf: 0.99
  attack: T1555.003,T1041
  mbc: B0030
  all:
  - id: objectives/credential-access/discord/token::native-discord-local-token-harvester
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
- id: native-discord-token-file-exfil
  desc: Native Discord token harvester uploads loot to a pinned host
  conf: 0.99
  attack: T1555.003,T1041
  mbc: B0030,C0014
  all:
  - id: objectives/credential-access/discord/token::native-discord-dpapi-token-harvester
  - id: micro-behaviors/communications/http/header/custom::pe-filename-header
  - id: micro-behaviors/communications/http/message::raw-http-body-request-line
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
- id: native-discord-webhook-token-api-exfil
  desc: Discord token harvesting with webhook and HTTP-send APIs
  conf: 0.97
  attack: T1528,T1041
  mbc: B0030
  all:
  - id: objectives/credential-access/discord/token::native-discord-local-token-harvester
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  - id: micro-behaviors/communications/http/services/discord::discord-api-users-me-url
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
