defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-ci-token-tunnel-post-cooccurrence
    desc: CI token collection and tunnel POST co-occur
    crit: suspicious
    conf: 0.98
    attack: "T1552.001,T1041"
    all:
      - id: well-known/dual-use/tunnel/cloudflared::trycloudflare-domain
      - id: micro-behaviors/communications/http/post::request-post-option
      - id: micro-behaviors/os/env/ci-credentials::javascript-ci-token-env-access
      - id: micro-behaviors/communications/http/request/body/construction::request-end-body-call
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
    any:
      - id: micro-behaviors/data/serialize/schema-credential::ci-token-names-near-credential-payload
      - id: metadata/lang/source/naming/secret::ci-creds-payload-member-reference
