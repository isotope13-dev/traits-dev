defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - xpi
  - crx
  - zip
  attack: T1041
  crit: hostile
  conf: 0.99
traits:
- id: whatsapp-session-credential-post-flow
  desc: Posts extracted session data as JSON
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?s)await extractSession.*?fetch.*?POST.*?body.*?JSON\.stringify.*?credentials'
composite_rules:
- id: whatsapp-session-material-exfiltration
  desc: Uploads extracted WhatsApp Web session material
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: objectives/credential-access/messaging::whatsapp-web-session-material-extraction
  - id: objectives/exfiltration/stealer/credential/value/token::whatsapp-session-credential-post-flow
  any:
  - id: objectives/credential-access/messaging::whatsapp-session-migration-endpoint
  - id: objectives/credential-access/messaging::nexttrack-session-import-endpoint
  unless:
  - id: well-known/app/system/vendora-connect::disclosed-integration-context
  - id: well-known/app/system/vendora-connect::bridge-script-context
  - id: well-known/app/communication/leona-session-connector::disclosed-integration-context
  - id: well-known/app/communication/leona-session-connector::bridge-script-context
  - id: well-known/app/communication/letalk-whatsapp-bridge::disclosed-integration-context
  - id: well-known/app/communication/letalk-whatsapp-bridge::bridge-script-context
- id: whatsapp-session-chunk-upload
  desc: Uploads extracted WhatsApp session chunks
  scope: archive
  all:
  - id: objectives/credential-access/messaging::whatsapp-web-session-material-extraction
  - id: objectives/credential-access/messaging::whatsapp-session-migration-endpoint
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
  unless:
  - id: well-known/app/system/vendora-connect::disclosed-integration-context
  - id: well-known/app/system/vendora-connect::bridge-script-context
  - id: well-known/app/communication/leona-session-connector::disclosed-integration-context
  - id: well-known/app/communication/leona-session-connector::bridge-script-context
  - id: well-known/app/communication/letalk-whatsapp-bridge::disclosed-integration-context
  - id: well-known/app/communication/letalk-whatsapp-bridge::bridge-script-context
