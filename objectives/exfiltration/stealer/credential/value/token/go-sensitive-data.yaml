defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [binaries, scripts, source, manifests, documents, media, data]
  attack: T1041
  mbc: B0030

composite_rules:
- id: go-sweetcrypto-bearer-api-key-client
  desc: Go client authenticates to SweetCrypto API
  crit: suspicious
  conf: 0.98
  scope: archive
  for: [go, zip]
  all:
  - id: objectives/command-and-control/infrastructure/domain/malicious::sweetcrypto-api-host
  - id: micro-behaviors/communications/http/authorization-header::go-authorization-set
  - id: micro-behaviors/os/env/read/variable::os-getenv
# A published banking-integration module that harvests the pattern future fake
# SDKs reuse: it reads a service API key from the environment, authenticates a
# JSON HTTP client with it, retrieves bank account records, and POSTs fund
# transfers naming an external wallet as the recipient. Each leg alone is an
# ordinary client capability, which is why the verdict additionally requires
# corroboration that the declared service is untrusted: the package's own
# documentation admits the endpoints are placeholders, its comments mark the
# routes assumed, or the hardcoded host is the untrusted banking host. An
# ordinary provider client (documented endpoints, no wallet transfers) stays
# out of scope; a renamed-host variant without placeholder admissions keeps
# the notable legs and needs its own host IOC in the any: list.
- id: go-banking-key-transfer-harvest
  desc: Go banking client sends key, accounts and wallet transfers to untrusted endpoint
  crit: hostile
  conf: 0.97
  scope: archive
  for: [go, zip, markdown, text]
  all:
  - id: micro-behaviors/os/env/read/named::go-getenv-service-api-key
  - id: micro-behaviors/os/env/secret-name::credential-env-var-assignment
  - id: micro-behaviors/communications/http/authorization-header::go-authorization-set
  - id: micro-behaviors/communications/url/resource-path/identity::accounts-endpoint-path
  - id: micro-behaviors/communications/url/resource-path/commerce::fund-transfer-route-path
  - id: micro-behaviors/communications/blockchain/wallet::transfer-wallet-destination-field
  any:
  - id: metadata/package/placeholder::placeholder-endpoints-doc
  - id: metadata/package/placeholder::go-assumed-endpoint-comment
  - id: objectives/command-and-control/infrastructure/domain/malicious::sweetcrypto-api-host
