defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [binaries, scripts, source, manifests, documents, media, data]
  attack: T1041
  mbc: B0030

composite_rules:
- id: go-sweetcrypto-bearer-api-key-client
  desc: Go client sends env bearer creds to sweetcrypto API host
  crit: hostile
  conf: 0.98
  scope: archive
  for: [go, zip]
  all:
  - id: objectives/command-and-control/infrastructure/domain/malicious::sweetcrypto-api-host
  - id: micro-behaviors/communications/http/authorization-header::go-authorization-set
  - id: micro-behaviors/os/env/read::os-getenv
