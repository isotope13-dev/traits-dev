defaults:
  platforms:
  - unix
  - android
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -pyc
  - -staticlib
  - -elixir
  - -clojure
  attack: T1041,T1003.007
composite_rules:
- id: process-memory-token-exfil
  desc: Exfiltrates tokens scraped from process memory
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/memory::process-memory-bearer-token-scrape
  any:
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/curl
  - id: micro-behaviors/communications/http/request/verb
