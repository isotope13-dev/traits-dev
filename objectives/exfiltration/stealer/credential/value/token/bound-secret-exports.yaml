defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1041
composite_rules:
- id: rust-developer-token-chat-body
  desc: Developer env token exported as chat body
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/http/request/credentials/literal::rust-developer-token-chat-body
  for:
  - rust
- id: npm-token-native-chat-body
  desc: Registry token exported as chat message
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/http/request/credentials/file::javascript-env-token-native-chat-body
