defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - whl
  - python-sdist
  - zip
  attack: T1528,T1041,T1567.002
  crit: hostile
  conf: 0.95
composite_rules:
- id: python-discord-webhook-oauth-token-stealer
  desc: Python Discord OAuth token webhook exfil
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path
  - id: micro-behaviors/communications/http/oauth::refresh-token-snake-assign
  - id: micro-behaviors/communications/http/webhook::python-webhook-post
  - id: objectives/exfiltration/messaging/discord::python-discord-token-webhook-url
- id: python-discord-harvested-token-json-store
  desc: Python Discord bot stores harvested token JSON
  conf: 0.97
  scope: archive
  all:
  - id: micro-behaviors/data/serialize/schema-credential::python-token-refresh-record
  - id: objectives/exfiltration/messaging/discord::python-discord-token-webhook-url
  - id: micro-behaviors/communications/http/webhook::python-webhook-post
- id: python-browser-store-discord-webhook-stealer
  desc: Browser store read exfiltrated to Discord webhook
  conf: 0.96
  attack: T1539,T1552.001,T1041,T1567.002
  scope: archive
  all:
  - id: micro-behaviors/communications/http/webhook::discord-webhook-api
  any:
  - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
  - id: micro-behaviors/fs/path/app-data::local-storage-ref
- id: python-discord-token-regex-webhook
  desc: Discord token regex posted to webhook
  conf: 0.96
  attack: T1552.001,T1041
  scope: file
  all:
  - id: micro-behaviors/data/format/credentials::discord-token-regex-source
  - id: micro-behaviors/communications/http/webhook::discord-webhook-api
- id: python-encrypted-token-fernet-webhook-stealer
  desc: Encrypted tokens sent to Fernet-hidden webhook
  conf: 0.98
  attack: T1555.003,T1528,T1041,T1567.002
  scope: file
  all:
  - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix-source
  - id: micro-behaviors/crypto/symmetric/fernet::decrypt
  - id: micro-behaviors/communications/http/request/json::python-urllib-json-body-urlopen
