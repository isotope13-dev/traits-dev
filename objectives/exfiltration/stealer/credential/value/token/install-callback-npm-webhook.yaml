defaults:
  platforms: ["unix", "windows"]
  for: ["javascript", "typescript"]

composite_rules:
  - id: npm-postinstall-jwt-env-http-exfil
    mbc: E1041
    crit: hostile
    desc: npm postinstall sends JWT-shaped env secrets over HTTP
    conf: 0.99
    attack: "T1195.002,T1552.001,T1041"
    for: [package.json]
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::npm-postinstall-jwt-env-harvest
      - id: micro-behaviors/communications/http/request/verb::npm-script-node-http-post
