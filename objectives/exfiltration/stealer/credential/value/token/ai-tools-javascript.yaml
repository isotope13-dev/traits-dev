defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
composite_rules:
- id: node-claude-oauth-profile-exfil
  desc: Node reports Claude OAuth profile after accessing credential data
  conf: 0.99
  for: [npm, javascript]
  scope: archive
  attack: "T1552.001,T1041"
  all:
  - id: micro-behaviors/fs/path/token::claude-cli-oauth-credentials-file
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: micro-behaviors/communications/http/url/endpoint::anthropic-oauth-profile-endpoint
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
