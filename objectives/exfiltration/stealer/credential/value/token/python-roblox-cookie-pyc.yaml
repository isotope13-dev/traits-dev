defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1539,T1555.003,T1567

traits:
  - id: pyc-roblox-session-cookie
    desc: Bytecode references Roblox session cookie
    crit: notable
    if:
      type: text
      substr: '.ROBLOSECURITY'

composite_rules:
  - id: pyc-roblox-cookie-discord-webhook
    desc: Bytecode targets Roblox cookie and webhook
    crit: hostile
    conf: 0.98
    all:
      - id: pyc-roblox-session-cookie
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-module-reference
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/post::pyc-post-identifier
