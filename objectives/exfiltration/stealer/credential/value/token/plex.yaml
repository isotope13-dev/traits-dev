# The loopback-prefix check attaches the owner token to an off-host request.
# The exfiltrated application token owns this composite; the agent SSRF is a leg.
defaults:
  for: [scripts, source, binaries, data, text]
  platforms: [unix, windows]
  crit: hostile
  conf: 0.99
  attack: T1190
composite_rules:
  - id: plex-agent-loopback-prefix-token-leak
    desc: Plex plugin request pattern targets loopback-prefix token leak
    all:
      - id: micro-behaviors/communications/url/resource-path/automation::loopback-agent-search-url
      - id: micro-behaviors/communications/url/host/name::loopback-prefix-dns-host
    any:
      - id: well-known/app/media/plex::plex-plugin-network-function-route
      - id: well-known/app/media/plex::plex-plugin-network-function-route-binary
