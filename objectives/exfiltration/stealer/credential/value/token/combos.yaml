defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"

  for: [python]
composite_rules:
  # A credential-bearing environment value is serialized into a native Node
  # request body and sent to a public callback collector. This models the data
  # path rather than a Twilio-only name: ACCOUNT_SID/AUTH_TOKEN is one instance,
  # while future packages can substitute any token, secret, key, or password.
- id: vault-env-http-exfiltration
  desc: Vault env credentials sent by HTTP POST
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/credential-manager/store-api::vault-env-targeting
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
  any:
  - id: micro-behaviors/data/serialize/schema-credential::credential-var-in-dict
  - id: micro-behaviors/os/env/read::os-environ-symbol
- id: metadata-url-vault-exfiltration
  desc: Metadata URL drives Vault env exfiltration
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/exfiltration/stealer/credential/value/token::vault-env-http-exfiltration
  - id: micro-behaviors/process/interpreter/eval/direct::exec-file-read-result
  - id: micro-behaviors/communications/http/request/client::requests-post-metadata-url
