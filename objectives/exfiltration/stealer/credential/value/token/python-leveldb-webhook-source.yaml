defaults:
  for:
  - python
  platforms:
  - windows
  attack: T1555,T1567
composite_rules:
- id: discord-leveldb-token-webhook-source
  desc: Discord token theft and webhook request source
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/app-data/browser::chromium-leveldb-local-storage
  - id: micro-behaviors/data/format/discord-token::discord-token-regex-source
  - id: micro-behaviors/communications/http/webhook::discord-webhook-api
  - id: metadata/import/python/urllib/request
  - id: micro-behaviors/communications/http/request/body/construction::python-encoded-body-request-with-headers
  unless:
  - id: metadata/lang/source/origin::heuristic-quoted-source
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: well-known/tool/detection/agent/agentskillmap::cli-context
