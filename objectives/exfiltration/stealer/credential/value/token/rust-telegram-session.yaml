defaults:
  platforms: [unix, windows]
  for: [rust, crate]
  crit: hostile
  conf: 0.97
  attack: T1539,T1567
composite_rules:
  - id: rust-telegram-session-archive-upload
    desc: Telegram session ZIP collection with bot upload
    scope: file
    all:
      - id: micro-behaviors/fs/path/credential::telegram-session-data-location
      - id: micro-behaviors/fs/file/open::rust-file-open
      - id: micro-behaviors/fs/directory/traverse::rust-walkdir-capability
      - id: micro-behaviors/data/archive/zip::rust-zipwriter-capability
      - id: micro-behaviors/communications/http/services/telegram::teloxide-rust-bot-client
      - id: micro-behaviors/communications/messaging/send::chat-send-document-method
      - id: micro-behaviors/communications/messaging/send::rust-memory-document-input
  - id: rust-fixed-bot-session-archive-upload
    desc: Session collection with hardcoded bot upload
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential/value/token::rust-telegram-session-archive-upload
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
      - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
  - id: rust-xor-bot-session-archive-upload
    desc: XOR-concealed bot credential with session upload
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential/value/token::rust-telegram-session-archive-upload
      - id: objectives/anti-static/obfuscation/string/encoding::rust-xor-macro-bot-credential
      - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal

  # Some implementations recurse with std::fs instead of walkdir. These rules
  # describe an upload facility beside collection, not a proven archive->sink
  # binding: an early variant passes the wrong archive filename to its helper.
  - id: rust-session-archive-fixed-multipart-upload
    desc: Session archive with fixed bot file uploader
    scope: file
    all:
      - id: objectives/collection/archive/create::rust-sensitive-appdata-zip-staging
      - id: micro-behaviors/fs/file/open::rust-file-open
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
      - id: micro-behaviors/communications/http/services/telegram::telegram-send-document-url
      - id: micro-behaviors/communications/http/request/body/multipart::rust-multipart-file-field
      - id: micro-behaviors/communications/http/post::rust-reqwest-post-call

  - id: rust-concealed-bot-file-archive-upload
    desc: File archive upload with XOR bot credential
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::rust-xor-macro-bot-credential
      - id: micro-behaviors/fs/directory/traverse::rust-directory-enumeration-capability
      - id: micro-behaviors/fs/file/open::rust-file-open
      - id: micro-behaviors/data/archive/zip::rust-zipwriter-capability
      - id: micro-behaviors/communications/messaging/send::chat-send-document-method
      - id: micro-behaviors/communications/messaging/send::rust-memory-document-input
      - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
