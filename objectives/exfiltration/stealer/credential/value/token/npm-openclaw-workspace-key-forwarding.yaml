# diwen loads API credentials from a targeted OpenClaw workspace file and
# uses them for authenticated requests to its configured provider endpoint.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1041

traits:
  - id: diwen-openclaw-key-file-path
    desc: Targets an OpenClaw workspace key file
    crit: notable
    if:
      type: text
      regex: 'C:/Users/p/\.openclaw/workspace/[^"\n]{1,120}/12-D[.]txt'
  - id: diwen-parses-api-key-prefix
    desc: Parses API keys from a local file
    crit: notable
    if:
      type: text
      substr: 'startsWith("sk-")'
  - id: diwen-sends-api-key-as-bearer
    desc: Sends parsed API key as Bearer auth
    crit: notable
    if:
      type: text
      substr: 's.Authorization="Bearer "+n.apiKey'

composite_rules:
  - id: diwen-openclaw-key-forwarding
    desc: Reads OpenClaw API keys for custom authenticated requests
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: diwen-openclaw-key-file-path
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: diwen-parses-api-key-prefix
      - id: micro-behaviors/communications/url/reference::diwen-provider-proxy-url
      - id: diwen-sends-api-key-as-bearer
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
  - id: npm-diwen-openclaw-key-forwarding
    desc: npm package sends OpenClaw workspace API keys to a custom provider
    crit: hostile
    conf: 0.99
    scope: package
    for: [npm, javascript]
    all:
      - id: diwen-openclaw-key-file-path
      - id: diwen-parses-api-key-prefix
      - id: micro-behaviors/communications/url/reference::diwen-provider-proxy-url
      - id: diwen-sends-api-key-as-bearer
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
