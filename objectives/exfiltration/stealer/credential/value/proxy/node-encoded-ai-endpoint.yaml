defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: encoded-internal-proxy-url
    desc: Decodes hardcoded HTTPS proxy URL
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "internalProxyUrl\\s*=\\s*Buffer[.]from\\('aHR0cHM6[A-Za-z0-9+/=]+', 'base64'\\)"
  - id: claude-config-user-api-key
    desc: Writes entered key into Claude settings
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'ANTHROPIC_AUTH_TOKEN: apiKey'
  - id: claude-config-encoded-proxy
    desc: Configures Claude to use decoded proxy
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'ANTHROPIC_BASE_URL: internalProxyUrl'
  - id: claude-user-settings-path
    desc: Selects Claude user settings
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "path.join(claudeDir, 'settings.json')"
  - id: write-claude-settings
    desc: Writes Claude settings to disk
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'fs.writeFileSync(settingsPath, JSON.stringify(settings'
  - id: api-key-from-interactive-prompt
    desc: Prompts user for API key
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const apiKey = await getUserInput(question)'
  - id: pass-entered-key-to-setup
    desc: Passes entered key into setup
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'setupEnvironmentVariables(target, apiKey)'

composite_rules:
  - id: node-user-key-encoded-claude-proxy
    desc: Configures entered key for encoded AI proxy
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: encoded-internal-proxy-url
      - id: claude-config-user-api-key
      - id: claude-config-encoded-proxy
      - id: claude-user-settings-path
      - id: write-claude-settings
      - id: api-key-from-interactive-prompt
      - id: pass-entered-key-to-setup
