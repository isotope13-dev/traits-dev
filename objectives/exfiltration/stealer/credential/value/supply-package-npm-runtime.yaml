# NPM install-hook credential theft.
#
# Archive membership alone does not connect a lifecycle script to a payload.
# Environment exfiltration is reported by the canonical file-level traits in
# objectives/exfiltration/stealer/env, without duplicate hook wrappers.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, linux]
  for: [npm]
  attack: "T1195.002,T1552.001,T1552.004,T1041"
  mbc: E1552,E1041

composite_rules:
  - id: objectives/exfiltration/stealer/credential/value::npm-optional-vcs-trigger-credential-stealer
    desc: NPM optional VCS trigger accompanies a credential stealer
    scope: archive
    # Names the members it mixes: the trigger leg comes from the package
    # manifest, the stealer leg from a script or source member.
    for: [npm, package.json, scripts, source]
    all:
      - id: metadata/package/dependencies/source::npm-optional-scoped-commit-vcs
      - id: objectives/exfiltration/stealer/credential::developer-credential-network-upload
  # Source-only stealers need their own rule. Do not route them through the
  # native-loader family: a JavaScript package can collect several application
  # credential stores without shipping any compiled member.
