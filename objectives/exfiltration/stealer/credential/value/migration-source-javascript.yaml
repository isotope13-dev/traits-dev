defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041
  mbc: B0030
composite_rules:
- id: wallet-secret-filter-encryption-http
  desc: Wallet secret filter, AES and HTTP client
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/env/secrets/wallet::env-wallet-regex-secret-filter
  - id: micro-behaviors/crypto/encrypt/unspecified::createCipheriv
  any:
  - id: micro-behaviors/communications/http/get::axios-get-call
  - id: micro-behaviors/communications/http/post::axios-post-call
- id: secret-field-and-upload-sink
  desc: Secret-field text with HTTP upload/body sink
  crit: suspicious
  conf: 0.98
  near_bytes: 4096
  all:
  - id: metadata/lang/source/naming/secret::secret-value-colon-token
  - id: micro-behaviors/communications/url/resource-path/automation::extension-analysis-feedback-path-text
  - id: micro-behaviors/communications/http/request/body/construction::http-upload-or-body-sink
