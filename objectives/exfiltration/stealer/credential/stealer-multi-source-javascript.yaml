defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"

composite_rules:
- id: obfuscated-credential-harvest-authenticated-api-dispatch
  desc: Obfuscated credential harvest uses authenticated GitHub API dispatch
  crit: hostile
  conf: 0.95
  attack: T1552.001,T1041
  all:
  - id: objectives/credential-access/theft/multi-store::obfuscated-multi-source-credential-harvester
  - id: micro-behaviors/communications/http/services/github::github-rest-api-version-header
  - id: micro-behaviors/communications/http/request/json::fetch-json-body
  any:
  - id: micro-behaviors/communications/http/auth::access-token-field-reference
  - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/

- id: js-credential-discord-screenshot-exfiltration
  desc: "Credential export accompanies a screenshot-module import"
  crit: hostile
  conf: 0.99
  attack: "T1555.003,T1113,T1041,T1567.002"
  mbc: "B0028"
  for: [javascript, typescript]
  near_bytes: 8192
  all:
  - id: objectives/exfiltration/stealer/credential::js-credential-discord-webhook-exfiltration
  - id: micro-behaviors/hardware/display/screenshot::desktop-screenshot-import
  unless:
