# Transport and credential selection must overlap an actual source node.
# Zero-distance joining excludes separate pipelines, including separate
# commands on the same line. File-wide co-occurrence does not prove upload.
defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001,T1041"
  mbc: E1020

traits:
  # The secret as *credential*, not as payload. `--oauth2-bearer $TOKEN`,
  # `-u`/`--user` and an Authorization header are how a workflow authenticates
  # to a service it is allowed to use; exfiltration is when the secret is the
  # thing being sent. Bevy's send-screenshots-to-pixeleagle.yml curls its own
  # pixel-eagle instance with `--oauth2-bearer ${{ secrets.PIXELEAGLE_TOKEN }}`
  # to upload screenshots, and gates the job on `env.PIXELEAGLE_TOKEN_EXISTS`.
  - id: workflow-curl-credential-auth
    desc: Workflow curl authenticates with a token
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: text
      regex: '(?i)(--oauth2-bearer|--user\b|-H\s+["'']?Authorization:)'

  - id: workflow-env-secret-filter
    # Presence, not proof of selection: this also matches a secret passed in
    # as process environment (`env DD_API_KEY=... ./tool`). The filtering
    # reading comes from the upload leg it pairs with in the composite below.
    desc: Workflow handles environment secrets
    crit: notable
    conf: 0.94
    for: [github-actions]
    unless:
      - id: metadata/build/ci/github-actions::action-testdata-path
    if:
      type: text
      regex: '\benv\b[^\n]{0,120}(TOKEN|KEY|SECRET)'

composite_rules:
  - id: env-secret-dump-piped-to-network-client
    desc: Uploads credential-filtered environment over HTTP
    crit: hostile
    conf: 0.96
    near_bytes: 0
    all:
      - id: micro-behaviors/communications/http/request/credentials::shell-filtered-env-stdin-http-upload
      - id: micro-behaviors/os/env/pipeline::shell-env-credential-name-filter
  - id: workflow-env-http-upload
    desc: Workflow uploads environment secrets
    crit: hostile
    conf: 0.96
    for: [github-actions]
    unless:
      - id: metadata/build/ci/github-actions::action-testdata-path
      - id: workflow-curl-credential-auth
    # No near_bytes: value findings carry no span, and the transport legs
    # already pin the whole pipeline inside one run scalar -- that scalar
    # scoping IS the proximity. A curl that fetches a vendor CLI in one step
    # while a later step passes a key to that CLI via `env` (Datadog's
    # dd-ci-upload action) never matches a leg, however close the steps are.
    all:
      - id: workflow-env-secret-filter
    any:
      - id: micro-behaviors/communications/http/request/credentials::workflow-env-filtered-upload
      - id: micro-behaviors/communications/http/request/credentials::action-env-filtered-upload
