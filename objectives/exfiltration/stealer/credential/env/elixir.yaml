# Elixir package-load credential theft.  An @on_load callback that selects
# secret environment variables, reads developer credential files, and posts
# the result is an automatic package-import exfiltration path; each atom
# remains a reusable capability elsewhere in the taxonomy.
defaults:
  platforms: [linux, macos, unix]
  for: [elixir]
  attack: T1552.001,T1041,T1195.002

composite_rules:
  - id: elixir-onload-env-file-http-exfil
    desc: Elixir load hook exfiltrates developer secrets
    crit: hostile
    conf: 0.99
    scope: file
    near_lines: 60
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::elixir-module-load-callback
      - id: micro-behaviors/os/env/secret-name::elixir-secret-environment-selection
      - id: micro-behaviors/fs/read/file/full::elixir-file-read
      - id: micro-behaviors/communications/http/post::elixir-httpc-post
    any:
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: micro-behaviors/fs/path/secret-config::docker-config
