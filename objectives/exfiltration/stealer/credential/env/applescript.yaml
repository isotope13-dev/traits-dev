defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1041,T1552.001

composite_rules:
  - id: applescript-env-credential-exfil
    desc: AppleScript POSTs credential-named environment variables
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::applescript-env-credential-harvest
      - id: micro-behaviors/communications/http/request/payload::applescript-env-form-field
      - id: micro-behaviors/communications/http/curl::curl-post-flag
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
