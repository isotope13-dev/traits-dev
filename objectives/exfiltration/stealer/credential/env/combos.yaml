# Environment Credential Exfiltration
# Environment variable / dotenv credential theft with network exfiltration
# ATT&CK: T1552.001 (Unsecured Credentials) + T1041
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"
composite_rules:
  - id: python-multiple-provider-env-secret-reads
    desc: Python reads secrets for multiple service providers
    crit: suspicious
    conf: 0.97
    for: [python]
    needs: 2
    any:
      - id: micro-behaviors/os/env/vars/credentials::python-openai-anthropic-key-env-read
      - id: micro-behaviors/os/env/vars/credentials::python-github-token-env-read
      - id: micro-behaviors/os/env/vars/credentials::python-aws-secret-access-key-env-read

  - id: python-fixed-env-secrets-json-urllib-exfil
    desc: Python posts multiple providers' environment secrets through urllib
    crit: hostile
    conf: 0.99
    attack: "T1552.001,T1041"
    for: [python]
    near_bytes: 4096
    all:
      - id: python-multiple-provider-env-secret-reads
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
    unless:
      - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request

  - id: vscode-base64-environment-https-exfil
    desc: VS Code extension POSTs a Base64 environment snapshot
    crit: hostile
    conf: 0.99
    for: [vsix-archive]
    scope: archive
    attack: "T1552.001,T1041,T1195.002"
    mbc: E1041
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: metadata/permission/activation::main-extension-js
      - id: micro-behaviors/os/env/dump::js-base64-environment-snapshot
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::application-json
      - id: micro-behaviors/communications/url/encoded::https-b64-protocol-fragment

  - id: javascript-base64-environment-https-exfil
    desc: JavaScript sends a Base64 snapshot of all environment variables
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    near_bytes: 4096
    attack: "T1552.001,T1041"
    mbc: E1041
    all:
      - id: micro-behaviors/os/env/dump::js-base64-environment-snapshot
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::application-json
      - id: micro-behaviors/communications/url/encoded::https-b64-protocol-fragment
    unless:
      - id: metadata/package/testing/

  - id: container-env-external-ip-http-exfil
    desc: Container environment sent by HTTP to an external IP
    crit: hostile
    conf: 0.99
    for: [scripts, source]
    scope: file
    near_bytes: 8192
    attack: "T1552.001,T1041"
    mbc: E1041
    all:
      - id: objectives/credential-access/cloud/container::docker-socket-api-env-harvest
      - id: micro-behaviors/communications/http/request/result::http-write-request-method
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script

  # A compact Node payload may hide both the transport module and credential
  # labels behind a repeating-key decoder. Require the concrete environment
  # copy, JSON serialization, configured request, and stream-body sequence so
  # ordinary SDK clients and environment redactors do not match.
  - id: javascript-xor-env-http-exfil
    desc: XOR-hidden HTTP exfiltrates filtered environment
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    near_bytes: 4096
    attack: "T1552.001,T1041"
    mbc: E1041
    all:
      - id: micro-behaviors/os/env/access::js-filtered-env-copy
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/buffer::javascript-write-then-end-stream
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

  - id: js-filtered-env-http-exfil
    desc: JavaScript sends filtered environment secrets over HTTP
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: "T1552.001,T1041"
    mbc: "E1552,E1041"
    near_bytes: 900
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::env-secret-filter-keyword-list
      - id: micro-behaviors/os/env/vars/access::js-object-keys-env
      - id: micro-behaviors/os/env/vars/access::js-env-index-copy-to-object
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/client::h-request-call
      - id: micro-behaviors/communications/http/request/client::request-write-call
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

  - id: javascript-denylist-environment-http-exfil
    desc: Denylist-filtered environment near external-IP HTTP body
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    scope: file
    near_bytes: 8192
    attack: "T1552.001,T1041"
    mbc: E1041
    all:
      - id: micro-behaviors/os/env/dump::denylist-filtered-snapshot
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  # A package-side JavaScript payload can avoid dedicated exfiltration
  # libraries by enumerating process.env, retaining credential-named entries,
  # and writing the result to a built-in HTTPS request.  Keep this file-scoped
  # and require the complete data path so ordinary telemetry that merely reads
  # one environment variable does not match.
  - id: javascript-environ-json-http-exfil
    desc: JavaScript sends filtered environment secrets over HTTPS
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    scope: file
    near_bytes: 2048
    attack: "T1552.001,T1041"
    mbc: E1041
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::js-secret-keyword-list
      - id: micro-behaviors/communications/http/request/client::node-http-request-body
      - id: micro-behaviors/communications/http/request/client::http-post-json

  # A compact package payload can bypass HTTP libraries entirely: retain only
  # credential-named process.env entries, serialize that mapping, and write it
  # through a raw Node socket.  Require the actual env-value copy, outbound
  # dial, and JSON socket write in one tight region so ordinary socket clients
  # and secret-redaction helpers do not match by file-wide coincidence.
  - id: javascript-filtered-env-socket-exfil
    desc: JavaScript sends filtered environment secrets by socket
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    near_bytes: 1024
    attack: "T1552.001,T1041"
    mbc: "E1552,E1041"
    all:
      - id: objectives/credential-access/env/secrets/filtered-access::js-secret-keyword-list
      - id: micro-behaviors/os/env/vars/access::js-env-index-copy-to-object
      - id: micro-behaviors/communications/socket/dial::javascript-dial
      - id: micro-behaviors/communications/socket/send::node-socket-json-write
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

  # Dotenv secrets staged for callback exfiltration
  - id: dotenv-to-callback
    desc: Dotenv secrets staged for callback exfiltration
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: objectives/credential-access/env/dotenv::js-dotenv-read
      - id: objectives/exfiltration/oob/endpoint::webhook-site
  # Proximity-gated: a real dotenv exfil wires the .env read and the POST body
  # together within a few statements. Without a distance bound, any large
  # multi-feature bundle that calls dotenv.config() at startup AND issues an
  # unrelated POST elsewhere (e.g. a hub/API client) matches by mere
  # co-occurrence. near_bytes keeps the read+POST tightly coupled (also robust
  # to minified single-line payloads).
  - id: dotenv-http-post-exfil
    desc: Dotenv secrets sent by HTTP POST
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 2048
    all:
      - id: objectives/credential-access/env/dotenv::js-dotenv-read
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: micro-behaviors/process/interpreter/vm/
  # dotenv.config() populates process.env from the selected file. Combining
  # that explicit load with a proven full-environment POST establishes that
  # dotenv credentials are included, even when no readFileSync call is visible.
  - id: dotenv-full-environment-http-exfil
    desc: Loads dotenv then posts full environment
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: "T1552.001,T1041"
    mbc: "E1552,E1041"
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/config/environment::dotenv-config-path
      - id: objectives/exfiltration/http/env::js-full-environment-axios-post
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
  # Ruby environment variable exfiltration
  - id: ruby-env-exfiltration
    desc: Environment variable exfiltration
    crit: suspicious
    conf: 0.88
    attack: "T1018"
    for: [ruby]
    platforms: [unix, windows]
    needs: 2
    any:
      - id: objectives/credential-access/env/secrets/
      - id: objectives/command-and-control/backdoor/rat/multi::faraday-http
  - id: vault-env-http-exfiltration
    desc: Vault env credentials sent by HTTP POST
    crit: hostile
    conf: 0.98
    for: [python]
    all:
      - id: objectives/credential-access/credential-manager/store-api::vault-env-targeting
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
    any:
      - id: objectives/exfiltration/http/upload::credential-var-in-dict
      - id: micro-behaviors/os/env/access::os-environ-symbol
  - id: metadata-url-vault-exfiltration
    desc: Metadata URL drives Vault env exfiltration
    crit: suspicious
    conf: 0.96
    for: [python]
    all:
      - id: vault-env-http-exfiltration
      - id: micro-behaviors/process/interpreter/python::exec-file-read-namespace
      - id: micro-behaviors/communications/http/request/client::requests-post-metadata-url
  - id: python-env-json-urllib-exfil
    desc: Python serializes credential-named environment data in a urllib request
    crit: hostile
    conf: 0.97
    for: [python]
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
      - id: micro-behaviors/os/env/vars/credentials::python-environ-credential-name-filter
    any:
      # Require the environment value itself to enter JSON. A token used as
      # an HTTP authentication header or mentioned in CLI help is not an
      # exfiltration path merely because the same file makes a urllib request.
      - id: micro-behaviors/data/serialize/json::python-env-json-value
      - id: micro-behaviors/data/serialize/json::python-environ-json
      - id: micro-behaviors/data/serialize/json::python-filtered-environ-json-value
    unless:
      - id: well-known/tool/development/gitcode::gitcode-release-helper
      - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
      - id: objectives/exfiltration/http/upload::hashicorp-infra-api-authenticated-request
      - id: objectives/exfiltration/http/upload::browser-use-cloud-authenticated-api
      - id: micro-behaviors/communications/http/services/hugpy::hugpy-authenticated-token-post-context
      - id: micro-behaviors/communications/http/llm::a2a-sweep-request
      - id: well-known/app/communication/acedatacloud::personal-wechat-byoc-context
      - id: well-known/app/communication/acedatacloud::personal-wechat-byoc-file-context
  - id: python-direct-env-json-urllib-exfil
    desc: Python posts serialized secret env value
    crit: hostile
    conf: 0.98
    for: [python]
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
      - id: micro-behaviors/os/env/vars/credentials::python-sensitive-env-read
      - id: micro-behaviors/data/serialize/json::python-env-json-value
    unless:
      - id: well-known/tool/development/gitcode::gitcode-release-helper
      - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
      - id: objectives/exfiltration/http/upload::hashicorp-infra-api-authenticated-request
      - id: objectives/exfiltration/http/upload::browser-use-cloud-authenticated-api
      - id: micro-behaviors/communications/http/services/hugpy::hugpy-authenticated-token-post-context
      - id: micro-behaviors/communications/http/llm::a2a-sweep-request
      - id: well-known/app/communication/acedatacloud::personal-wechat-byoc-context
      - id: well-known/app/communication/acedatacloud::personal-wechat-byoc-file-context

  # Raw sockets are also sufficient for exfiltration. Require the complete
  # flow: a credential-keyword filtered environment sweep, construction of a
  # Python socket, and transmission of the resulting mapping. This avoids
  # promoting ordinary socket clients or environment configuration readers.
  - id: python-filtered-env-raw-socket-exfil
    desc: Sends filtered environment secrets by socket
    crit: hostile
    conf: 0.99
    for: [python]
    scope: file
    near_lines: 40
    attack: "T1552.001,T1041"
    mbc: "E1552,E1041"
    all:
      - id: objectives/credential-access/env/secrets/bulk-access::python-env-bulk-secret-harvest
      - id: micro-behaviors/communications/socket/connect::socket-socket-call
      - id: micro-behaviors/communications/socket/send::python-send-environment-mapping
    unless:
      - id: metadata/package/testing/

  - id: python-environ-json-urllib-exfil
    desc: Python sends credential-named environment entries in JSON over urllib
    crit: hostile
    conf: 0.98
    for: [python]
    attack: "T1552.001,T1041"
    mbc: E1041
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
      - id: micro-behaviors/os/env/vars/credentials::python-environ-credential-name-filter

  - id: python-environ-json-requests-exfil
    desc: Python sends credential-named environment entries in JSON via requests
    crit: hostile
    conf: 0.98
    for: [python]
    attack: "T1552.001,T1041"
    mbc: E1041
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
      - id: micro-behaviors/os/env/vars/credentials::python-environ-credential-name-filter

  - id: ruby-environ-json-net-http-exfil
    desc: Ruby sends filtered environment credentials as JSON over Net::HTTP
    crit: hostile
    conf: 0.98
    for: [ruby]
    attack: "T1552.001,T1041"
    mbc: E1041
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/dump::ruby-env-iteration
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/data/serialize/object::json-generate
    any:
      - id: micro-behaviors/os/env/dump::ruby-env-sensitive-filter
      - id: micro-behaviors/os/env/dump::ruby-env-key-filter
