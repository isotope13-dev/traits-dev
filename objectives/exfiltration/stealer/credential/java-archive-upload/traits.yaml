defaults:
  platforms: [unix, windows]
  for: [jar, zip]
  attack: T1041

composite_rules:
  - id: obfuscated-java-database-upload-bundle
    desc: Obfuscated Java archive bundles database and HTTP upload stacks
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::java-archive-lookalike-class-tree
      - id: metadata/package/dependencies/archive::bundled-okhttp-multipart
      - id: metadata/package/dependencies/archive::bundled-xerial-sqlite-jdbc

  - id: obfuscated-java-capture-archive-upload
    desc: Obfuscated Java capture data is archived and uploaded over HTTP
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-name::java-deep-lookalike-identifier-namespace
      - id: micro-behaviors/hardware/input/robot::jvm-awt-robot-class-ref
      - id: micro-behaviors/data/archive/create/zip::jvm-zip-output-stream-class-ref
      - id: micro-behaviors/communications/http/upload::jvm-okhttp-multipart-builder-class-ref
