defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # A credential-source role, report-label role and upload role must all
  # be present. This is an extraction/report/upload API profile: static
  # co-occurrence does not prove that a particular credential reached FTP.
  - id: managed-vault-credential-report-ftp-profile
    desc: Vault extraction, credential report labels and FTP upload references
    crit: hostile
    conf: 0.96
    attack: T1555.004,T1048.003
    all:
      - id: objectives/credential-access/credential-manager/store-api::vault-authenticator-extraction
      - id: objectives/credential-access/files/config::managed-multi-client-credential-store-access
      - id: micro-behaviors/data/format/credentials::html-credential-report-labels
      - id: micro-behaviors/communications/ftp/upload::dotnet-ftp-stor-profile
