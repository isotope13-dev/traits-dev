defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
composite_rules:
- id: js-secret-file-payload-beacon
  desc: Credential/file payload with nearby HTTP beacon
  crit: suspicious
  conf: 0.9
  attack: T1041
  scope: leaf
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/serialize/schema-credential::json-serializes-secrets-and-files
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
- id: js-npmrc-http-post
  desc: npm credentials serialized into Node HTTP POST
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1041
  all:
  - id: micro-behaviors/data/serialize/schema-credential::json-serializes-npmrc-content
  - id: micro-behaviors/fs/read/file/target::node-sensitive-auth-file-read
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-end-body
  - id: micro-behaviors/communications/http/request/verb::post-method-text
