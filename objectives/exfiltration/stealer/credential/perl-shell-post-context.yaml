# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: perl-powershell-credential-loader
    desc: Perl credential reads with POST and PowerShell
    crit: suspicious
    conf: 0.99
    for: [perl, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/process/create/system::system-process-call
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/communications/http/post::perl-post-method-call

