# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-staged-ssh-session
    desc: SSH-key file read with HTTP body and POST
    crit: suspicious
    conf: 0.95
    for: [swift]
    platforms: [unix]
    all:
      - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/fs/path/temp::swift-hidden-system-logs-path-reference
      - id: objectives/credential-access/ssh/path::swift-ssh-rsa-key-path
      - id: micro-behaviors/communications/http/post::swift-urlsession-data-task

