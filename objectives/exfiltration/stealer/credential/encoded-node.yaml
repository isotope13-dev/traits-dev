# Node.js Data Encoding for Exfiltration
# Behavioral composites that combine encoding with exfiltration indicators
# ATT&CK: T1041 (Exfiltration Over C2 Channel), T1132 (Data Encoding)
#
# Note: Atomic encoding traits moved to data/encoding/node.yaml
# This file contains only behavioral composites that indicate exfiltration
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
  attack: "T1041"

composite_rules:
  - id: node-encode-exfil
    desc: Credential HTTP flow beside Base64 encoding
    crit: suspicious
    conf: 0.9
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
      - id: micro-behaviors/communications/http/request/body::node-upload-sink
    any:
      - id: micro-behaviors/fs/path/credential::any-credential-path
      - id: micro-behaviors/os/env/secret-name::credential-env-read
      - id: micro-behaviors/os/env/cloud/
      - id: micro-behaviors/os/env/secret-name::aws-env-secret-vars
      - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-var
      - id: micro-behaviors/os/env/secret-name::aws-access-key-pair-names-binary
    unless:
      - id: micro-behaviors/communications/http/authorization-header::javascript-basic-auth-header
      - id: micro-behaviors/os/package-manager/publish/
      - id: micro-behaviors/os/package-manager/installer-script/
      - id: well-known/lib/
      - id: micro-behaviors/process/interpreter/vm/
      - id: micro-behaviors/communications/http/services/payment::payment-provider-api-flow
      - id: objectives/exfiltration/http/upload::node-multimodal-image-upload-context
