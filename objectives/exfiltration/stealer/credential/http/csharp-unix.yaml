defaults:
  platforms: [netbsd, unix, windows]
  for: [csharp, pe]
  attack: T1552.001

traits:
  - id: csharp-netbsd-sensitive-files
    desc: C# NetBSD sensitive files
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/etc/master\.passwd[\s\S]{0,260}/root/\.ssh/id_rsa'

  - id: csharp-aes-http-exfil
    desc: C# AES HTTP exfil
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'CreateEncryptor[\s\S]{0,900}HttpWebRequest[\s\S]{0,260}/exfil'

  - id: csharp-http-exfil-endpoint
    desc: C# HTTP exfil endpoint
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: /exfil

composite_rules:
  - id: csharp-netbsd-credential-exfil
    desc: C# NetBSD credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: csharp-netbsd-sensitive-files
      - id: csharp-http-exfil-endpoint
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
    any:
      - id: csharp-aes-http-exfil
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-create
      - id: micro-behaviors/crypto/symmetric/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/communications/socket/create::dotnet-tcpclient-channel

  # csharp-netbsd-credential-exfil-pe removed: its two required legs
  # (bsd-master-passwd-path, ssh-credentials) were unreachable on both of
  # this composite's declared types -- bsd-master-passwd-path's own
  # `platforms: [unix]` silently drops Pe from its `binaries` group expansion
  # (Pe requires a windows platform tag), and ssh-credentials' explicit
  # `for:` list never included csharp at all (ft-impossible on both). It was
  # also fully redundant: csharp-netbsd-credential-exfil above already
  # inherits for: [csharp, pe] from this file's defaults, requires the same
  # combined /etc/master.passwd + id_rsa evidence via csharp-netbsd-sensitive-
  # files, and its `any:` list is a superset of this one's -- so anything
  # that satisfied this composite already satisfied that one.
