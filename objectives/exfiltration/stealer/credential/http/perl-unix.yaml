defaults:
  platforms: [unix, netbsd]
  for: [perl]
  attack: T1552.001

traits:
  - id: perl-netbsd-pki-private-path
    desc: Perl NetBSD PKI private path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: /usr/pkg/etc/ssl/private

  - id: perl-base64-json-exfil
    desc: Perl base64 JSON exfil
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'JSON::PP[\s\S]{0,260}encode_base64'

composite_rules:
  - id: perl-netbsd-secret-http-exfil
    desc: Perl NetBSD secret exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/privilege/paths::etc-shadow
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: perl-base64-json-exfil
    any:
      - id: perl-netbsd-pki-private-path
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: objectives/exfiltration/http/upload::exfil-beacon-http-endpoint

  - id: perl-browser-cookie-http-exfil
    desc: Perl browser cookies and passwords sent over HTTP
    crit: hostile
    conf: 0.99
    platforms: [macos, unix]
    scope: archive
    attack: T1555.003,T1552.001,T1041
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/communications/http/post::perl-post-method-call
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname
