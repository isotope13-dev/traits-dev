# CI runner process-memory secret exfiltration. TeamPCP's Trivy and KICS
# payloads used Python, but these mechanics are language-neutral: select the
# Runner.Worker process, read its procfs memory, locate isSecret records, and
# send the recovered values in an outbound HTTP request.
defaults:
  platforms: [unix]
  for: [python, javascript, typescript, shell]
  attack: T1003.007,T1041,T1552.001

composite_rules:
  - id: github-runner-memory-secret-http-exfil
    desc: Posts GitHub runner memory secrets over HTTP
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: objectives/credential-access/dump/process::github-runner-process-memory-secret-dump
    any:
      - id: micro-behaviors/communications/http/request/client::python-http-post-any
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/curl::curl-post-flag
