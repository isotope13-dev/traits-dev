defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix]
  for: [c, cpp, objc, rust, go, elf]
  attack: T1041

composite_rules:
  - id: native-unix-secret-http-exfil
    for: [elf, c, objectivec]
    desc: Native Unix secret HTTP exfil
    all:
      - id: objectives/credential-access/files/config::native-unix-secret-path-bundle
    any:
      - id: objectives/exfiltration/http/collect::native-collect-http-post
      - id: objectives/exfiltration/http/collect::native-exfil-http-post

  - id: native-libcurl-credential-exfil
    desc: Native binary exfiltrates credentials via libcurl POST
    attack: T1552,T1041
    mbc: E1552,E1041
    for: [c]
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/http/curl::native-post-fields-option
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
