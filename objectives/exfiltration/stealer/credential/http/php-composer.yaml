defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001,T1041

composite_rules:
- id: composer-developer-credential-http-exfil
  desc: Composer package exfils developer credentials
  crit: hostile
  conf: 0.99
  for: [php, zip]
  scope: archive
  all:
  - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  - id: micro-behaviors/data/serialize/json::php-json-encode
  any:
  - id: micro-behaviors/fs/path/secret-config::composer-auth-file
  - id: micro-behaviors/fs/path/secret-config::docker-config
  - id: micro-behaviors/fs/path/secret-config::netrc

- id: composer-run-key-node-beacon
  desc: Composer package persists a Node beacon
  crit: hostile
  conf: 0.99
  for: [php, zip]
  scope: archive
  all:
  - id: micro-behaviors/os/registry/keys::currentversion-run
  - id: micro-behaviors/os/registry/manipulate::php-reg-variable-command
  - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
  - id: objectives/command-and-control/dropper/standalone::node-exe

- id: php-base64-shell-loader
  desc: PHP decodes base64 before shell execution
  crit: hostile
  conf: 0.99
  for: [php, zip]
  scope: archive
  all:
  - id: micro-behaviors/data/decode/symbol-base64::php-base64-decode-call
  - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
  - id: objectives/anti-static/obfuscation/payload/encoded::base64-exec-proximity
