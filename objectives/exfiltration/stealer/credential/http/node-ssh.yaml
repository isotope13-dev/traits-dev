defaults:
  crit: hostile
  platforms: [unix, netbsd]
  for: [javascript, typescript]
  attack: T1552.004

composite_rules:
  - id: node-ssh-key-http-exfil
    desc: Node SSH key HTTP exfil
    conf: 0.98
    all:
      - id: objectives/credential-access/ssh/key::node-ssh-key-read-loop
      - id: objectives/exfiltration/http/upload::node-collect-exfil
  - id: node-ssh-dir-profile-http-exfil
    desc: Node exfils SSH directory profile over HTTP
    conf: 0.99
    attack: "T1552.004, T1041"
    mbc: "E1552, E1041"
    all:
      - id: micro-behaviors/fs/enumerate/directory::node-dot-ssh-readdir
      - id: objectives/exfiltration/http/upload::node-collect-exfil
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client

  - id: node-ssh-env-json-http-exfil
    desc: Node sends SSH files and filtered environment data over HTTP
    conf: 0.99
    attack: T1552.001,T1552.004,T1041
    mbc: E1552,E1041
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/enumerate/directory::node-dot-ssh-readdir
      - id: micro-behaviors/fs/read/file/full::read-node
      - id: objectives/credential-access/env/secrets/filtered-access::js-secret-keyword-list
      - id: micro-behaviors/communications/http/request/client::node-request-payload-serialization
      - id: micro-behaviors/communications/http/request/client::node-http-request-body

  # Package-wide source unions are appropriate here: a loop over several SSH
  # private-key names, readFile(), and an HTTPS POST are a credential-theft
  # constellation even when the TypeScript source is split across modules.
  - id: node-ssh-private-key-post-exfil
    desc: Node package reads SSH private keys and posts them
    crit: hostile
    conf: 0.99
    platforms: [unix]
    scope: archive
    attack: T1552.004,T1041
    all:
      - id: micro-behaviors/fs/read/file/full::read-node
      - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
      - id: micro-behaviors/communications/http/post::node-https-request-post
      - id: micro-behaviors/communications/http/request/body::request-end-body-call
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-rsa
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-ecdsa
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-ed25519
