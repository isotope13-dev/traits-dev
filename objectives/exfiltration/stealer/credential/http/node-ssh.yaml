defaults:
  platforms: [unix, netbsd]
  for: [javascript, typescript]
  attack: T1552.004

composite_rules:
  - id: node-ssh-key-http-exfil
    desc: Node SSH key HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/ssh/key::node-ssh-key-read-loop
      - id: objectives/exfiltration/http/upload::node-collect-exfil
  - id: node-ssh-dir-profile-http-exfil
    desc: Node exfils SSH directory profile over HTTP
    crit: hostile
    conf: 0.99
    attack: "T1552.004, T1041"
    mbc: "E1552, E1041"
    all:
      - id: objectives/credential-access/ssh/key::node-dot-ssh-readdir
      - id: objectives/exfiltration/http/upload::node-collect-exfil
      - id: objectives/command-and-control/beacon/network/http::direct-http-c2-script-ip

  - id: node-ssh-env-json-http-exfil
    desc: Node sends SSH files and filtered environment data over HTTP
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1552.004,T1041
    mbc: E1552,E1041
    near_bytes: 8192
    all:
      - id: objectives/credential-access/ssh/key::node-dot-ssh-readdir
      - id: micro-behaviors/fs/file/read::read-node
      - id: objectives/credential-access/env/secrets/filtered-access::js-secret-keyword-list
      - id: micro-behaviors/communications/http/request/client::node-request-payload-serialization
      - id: micro-behaviors/communications/http/request/client::node-http-request-body
