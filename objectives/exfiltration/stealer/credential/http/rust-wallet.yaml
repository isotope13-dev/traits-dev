defaults:
  platforms: [unix, windows]
  for: [rust]
  conf: 0.98
  attack: T1552.001,T1041

traits:
  - id: rust-wallet-secret-json-template
    desc: Serializes private key with proxy address
    crit: suspicious
    if:
      type: literal
      regex: '"(pk|privateKey)"\s*:\s*"\{\}".{0,80}"proxyAddress"'

composite_rules:
  - id: rust-wallet-private-key-curl-exfiltration
    desc: Posts environment wallet key through curl
    crit: hostile
    all:
      - id: objectives/credential-access/env/secrets/wallet::rust-wallet-private-key-env-read
      - id: rust-wallet-secret-json-template
      - id: micro-behaviors/communications/http/post::rust-curl-data-argument
      - id: micro-behaviors/process/create/direct::rust-command-curl-wget
      - id: micro-behaviors/process/create/direct::rust-spawn
