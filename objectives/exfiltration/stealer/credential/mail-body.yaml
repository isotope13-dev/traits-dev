defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: developer-credential-smtp-message-export
    desc: Developer credential file sent by SMTP
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/email/send/smtp::python-smtp-client-and-message-send
      - id: micro-behaviors/communications/email/send/smtp::python-credential-file-smtp-message
      - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
    unless:
      - id: well-known/tool/detection/
      - id: metadata/build/recognized-contexts::developer-credential-tooling-context
      - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
      - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
