defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: discord-credential-file-content-export
    desc: Credential file sent as Discord webhook content
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1567.004
    all:
      - id: micro-behaviors/communications/http/request/credentials::javascript-file-credential-webhook-content
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
