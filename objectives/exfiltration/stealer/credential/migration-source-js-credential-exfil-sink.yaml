defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - javascript
  - typescript
composite_rules:
- id: credential-exfiltration-network-sink
  desc: Credential exfiltration transport evidence
  crit: component
  conf: 0.94
  any:
  - id: objectives/exfiltration/http/collect::js-wallet-secret-header-transport
  - id: objectives/exfiltration/stealer/configuration/environment::credential-environment-http-body
  - id: objectives/exfiltration/http/collect::js-credential-secret-transport
  - id: objectives/exfiltration/stealer/credential/record::raw-aws-keypair-native-http-body
  - id: objectives/exfiltration/stealer/credential::node-encode-exfil
- id: concealed-credential-exfiltration-channel
  desc: Credential exfiltration through a concealed C2 channel
  crit: suspicious
  conf: 0.85
  all:
  - id: objectives/command-and-control/channel
  - id: objectives/exfiltration/stealer/credential::credential-exfiltration-network-sink
  any:
  - id: objectives/supply-chain/hidden-payload
  - id: objectives/anti-static/obfuscation
