# Unsigned "update manager" masquerade with a large encrypted overlay and
# in-process credential-theft primitives (certificate store, WinHTTP, AES).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027.009,T1539
  mbc: B0028

composite_rules:
  - id: fake-canonical-overlay-credential-stealer-loader
    desc: Fake Canonical Update Manager hosts overlay staged credential theft
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/version-resource/claim::fake-canonical-update-manager-version-identity
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/crypto/certificate/store::cert-open-system-store
    any:
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes-pe-rdata
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-connect
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-open-request
