# Relocated from credential-access/files/config: HTTP transfer is required,
# and both source alternatives are developer-owned source-control stores.
# Preserve the legacy evidence, severity and proximity; this is co-occurrence,
# not a claim that the matcher establishes source-to-body data flow.
defaults:
  platforms: [unix, windows]
composite_rules:
  - id: python-source-control-credential-post
    desc: Source-control credential reads with HTTP POST
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1041"
    mbc: "E1552"
    for: [python]
    near_bytes: 32768
    all:
    - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
    - id: objectives/credential-access/files/config::python-source-control-file-read
    - id: micro-behaviors/communications/http/post::requests-post

