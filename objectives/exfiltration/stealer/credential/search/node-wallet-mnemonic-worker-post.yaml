defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1041,T1195.002

traits:
  - id: node-wallet-secret-key-line-search
    desc: Searches lines for wallet secret keys
    crit: notable
    if:
      type: text
      substr: 'Keypair.fromSecretKey(Uint8Array.from(['
  - id: node-wallet-mnemonic-validation
    desc: Validates recovered mnemonic phrases
    crit: notable
    if:
      type: text
      substr: 'b39.validateMnemonic(arrjoin)'
  - id: node-wallet-recursive-read
    desc: Recurses through files for secrets
    crit: notable
    if:
      type: text
      regex: '(?s)fs\.readdir\(dir,.{0,400}await iter\(fullPath\)'
  - id: node-wallet-worker-post
    desc: Posts recovered material to worker
    crit: notable
    if:
      type: text
      regex: 'fetch\(["'']https://helius\.beta-mainnet\.workers\.dev/["''],\s*\{method:\s*["'']POST'
  - id: npm-wallet-unhook-preinstall
    desc: Runs wallet scanner on installation
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      exact: 'node ./src/unhook'

composite_rules:
  - id: node-attempted-wallet-mnemonic-worker-harvest
    desc: Attempts wallet phrase and key harvesting
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: node-wallet-secret-key-line-search
      - id: node-wallet-mnemonic-validation
      - id: node-wallet-recursive-read
      - id: node-wallet-worker-post
  - id: npm-install-attempted-wallet-harvest
    desc: Install attempts wallet phrase and key harvest
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: npm-wallet-unhook-preinstall
      - id: node-attempted-wallet-mnemonic-worker-harvest
