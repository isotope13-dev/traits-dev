defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1195.002,T1552.001,T1041

traits:
  - id: js-proc-environ-secret-grep
    desc: Searches process environments for secrets
    crit: suspicious
    if:
      type: text
      regex: 'grep\s+-oaE[^\n]{0,120}/proc/\[0-9\]\*/environ'

  - id: js-docker-socket-container-query
    desc: Queries containers through Docker socket
    crit: notable
    if:
      type: text
      substr: '--unix-socket /var/run/docker.sock http://localhost/containers/json'

  - id: js-proc-docker-profile-payload
    desc: Includes process and Docker data in payload
    crit: suspicious
    if:
      type: text
      regex: '(?s)memory_env:\s*getProcSecrets\(\).{0,100}docker_engine:\s*getDockerSocketInfo\(\)'

composite_rules:
  - id: js-proc-docker-profile-oast-upload
    desc: Uploads process secrets and Docker profile
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-proc-environ-secret-grep
      - id: js-docker-socket-container-query
      - id: js-shell-target-oastify
      - id: js-token-scan-post-payload
      - id: js-proc-docker-profile-payload
