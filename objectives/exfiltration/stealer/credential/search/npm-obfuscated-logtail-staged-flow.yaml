defaults:
  platforms: [unix, windows]
  attack: T1552.001,T1041,T1027

traits:
  - id: npm-logtail-declared-dependency
    desc: Declares Logtail Node dependency
    crit: notable
    for: [package.json]
    if:
      type: value
      path: dependencies.@logtail/node
      regex: '.+'
  - id: node-dynamic-constructor-process-flow
    desc: Stages process data for dynamic component
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator name: (identifier) @constructor
              value: (call_expression function: (identifier) @require
                arguments: (arguments (binary_expression)))))
          (lexical_declaration
            (variable_declarator name: (identifier) @token
              value: (binary_expression)))
          (lexical_declaration
            (variable_declarator name: (identifier) @logger
              value: (new_expression constructor: (identifier) @constructor_use
                arguments: (arguments (identifier) @token_use))))
          (function_declaration
            body: (statement_block
              (lexical_declaration
                (variable_declarator name: (identifier) @snapshot
                  value: (object (spread_element
                    (subscript_expression object: (identifier) @process)))))
              (lexical_declaration
                (variable_declarator name: (identifier) @copy
                  value: (identifier) @snapshot_use)
                (variable_declarator name: (identifier) @payload value: (object)))
              (expression_statement
                (assignment_expression
                  left: (subscript_expression object: (identifier) @payload_write)
                  right: (identifier) @copy_use))
              (expression_statement
                (await_expression
                  (call_expression
                    function: (subscript_expression object: (identifier) @logger_use)
                    arguments: (arguments (_) (identifier) @payload_arg))))))) @flow
          (#eq? @require "require")
          (#eq? @constructor @constructor_use)
          (#eq? @token @token_use)
          (#eq? @process "process")
          (#eq? @snapshot @snapshot_use)
          (#eq? @copy @copy_use)
          (#eq? @payload @payload_write)
          (#eq? @payload @payload_arg)
          (#eq? @logger @logger_use))

composite_rules:
  - id: npm-obfuscated-logtail-staged-process-flow
    desc: Stages obfuscated process data for Logtail
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: npm-logtail-declared-dependency
      - id: node-dynamic-constructor-process-flow
      - id: objectives/anti-static/obfuscation/imports/concealment::escaped-require-module
