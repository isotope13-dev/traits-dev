defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1027,T1041

traits:
  - id: node-computed-input-hash-payload
    desc: Packages input alongside computed digest
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
          (variable_declarator name: (identifier) @digest
            value: (call_expression function: (subscript_expression
              object: (call_expression function: (subscript_expression
                object: (call_expression function: (subscript_expression
                  object: (subscript_expression object: (identifier) @context_hash))))
                arguments: (arguments
                (call_expression function: (identifier) @string_hash
                  arguments: (arguments (identifier) @input_hash)))))))
          (variable_declarator name: (identifier) @body
            value: (call_expression arguments: (arguments
              (call_expression arguments: (arguments
                (call_expression arguments: (arguments (object) (_)
                  (call_expression function: (identifier) @string_body
                    arguments: (arguments (identifier) @input_body))))
                (_) (identifier) @digest_used)))))
          (variable_declarator name: (identifier) @request
            value: (call_expression function: (subscript_expression
              object: (subscript_expression object: (identifier) @context_request)))))
          (expression_statement (binary_expression
            left: (binary_expression left: (binary_expression
              right: (call_expression function: (subscript_expression object: (identifier) @request_used)
                arguments: (arguments (identifier) @body_used)))))))
          (#eq? @string_hash "String")
          (#eq? @string_body "String")
          (#eq? @input_hash @input_body)
          (#eq? @digest @digest_used)
          (#eq? @context_hash @context_request)
          (#eq? @request @request_used)
          (#eq? @body @body_used))
  - id: node-computed-http-request-write
    desc: Writes computed payload to computed request
    crit: notable
    if:
      type: text
      regex: '\bBuffer\[\w+\]\(\w+\)[\s\S]{0,400}\[\w+\]\(\w+\)[\s\S]{0,160}\[\w+\]\(\)'
  - id: node-computed-crypto-require
    desc: Loads crypto via computed module name
    crit: notable
    if:
      type: text
      regex: '\bcrypto\s*=\s*require\(\w+\)'

composite_rules:
  - id: node-computed-input-hash-upload
    desc: Stages input and hash for computed upload
    crit: hostile
    conf: 0.97
    all:
      - id: node-computed-input-hash-payload
      - id: node-computed-http-request-write
      - id: node-computed-crypto-require
