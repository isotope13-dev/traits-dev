defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1195.002,T1552.001,T1041

traits:
  - id: js-grep-db-password-config
    desc: Searches files for database passwords
    crit: suspicious
    if:
      type: text
      regex: 'grep\s+-rE\s+["'']DB_PASSWORD\|MYSQL_ROOT_PASSWORD["'']'

  - id: js-send-db-password-results
    desc: Sends matching database passwords
    crit: suspicious
    if:
      type: text
      regex: 'send\s*\(\s*["'']HOST_DB_PASSWORDS["'']\s*,\s*dbConfigs\s*\)'

  - id: js-shell-base64-curl-path
    desc: Sends base64 output in curl URL
    crit: notable
    if:
      type: text
      regex: '(?s)data\.substring\(0,\s*1000\).{0,80}toString\(["'']base64["'']\).{0,200}curl'

  - id: js-shell-target-oastify
    desc: Configures OASTify callback target
    crit: notable
    if:
      type: text
      regex: 'target\s*=\s*["''][a-z0-9-]{12,63}\.oastify\.com["'']'

  - id: js-shell-send-helper
    desc: Encodes data in OAST callback path
    crit: suspicious
    if:
      type: text
      regex: '(?s)function\s+send\(label,\s*data\).{0,180}Buffer\.from\(data'

  - id: js-shell-encoded-callback-path
    desc: Places encoded data in callback path
    crit: notable
    if:
      type: text
      substr: '${target}/${label}/${encoded}'

  - id: js-shell-send-command-output
    desc: Sends collected shell command output
    crit: suspicious
    if:
      type: text
      regex: '(?s)execSync\(.{1,300}\)\.toString\(\);\s*send\(["''][A-Za-z_]+["''],\s*\w+\)'

composite_rules:
  - id: js-db-password-grep-oast-upload
    desc: Sends database password matches to OASTify
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-grep-db-password-config
      - id: js-send-db-password-results
      - id: js-shell-base64-curl-path
      - id: js-shell-target-oastify

  - id: js-shell-command-output-oast-upload
    desc: Sends shell command output to OASTify
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-shell-target-oastify
      - id: js-shell-send-helper
      - id: js-shell-encoded-callback-path
      - id: js-shell-send-command-output
