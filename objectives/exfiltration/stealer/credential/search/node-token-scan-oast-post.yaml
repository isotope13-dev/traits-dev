defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1552.004,T1041

traits:
  - id: js-token-scan-project-env
    desc: Scans project files and environment
    crit: notable
    if:
      type: text
      regex: '(?s)scanDirectory\(ROOT_DIR\);\s*scanEnvVars\(\);'

  - id: js-token-scan-results-json
    desc: Serializes collected token results
    crit: suspicious
    if:
      type: text
      regex: 'JSON\.stringify\(\s*\{[^}]{0,120}results:\s*found'

  - id: js-token-scan-oast-host
    desc: Uses OASTify token scan endpoint
    crit: notable
    if:
      type: text
      regex: 'OASTIFY_HOST\s*=\s*["''][a-z0-9-]{12,63}\.oastify\.com["'']'

  - id: js-token-scan-path
    desc: Posts results to token scan path
    crit: notable
    if:
      type: text
      substr: '/?token_scan'

composite_rules:
  - id: js-project-env-token-scan-oast-upload
    desc: Uploads project and environment token scan
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-token-scan-project-env
      - id: js-token-scan-results-json
      - id: js-token-scan-oast-host
      - id: js-token-scan-path
      - id: micro-behaviors/communications/http/request/body/construction::request-write-payload-variable
