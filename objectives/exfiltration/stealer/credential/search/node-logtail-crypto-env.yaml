defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1041,T1053
traits:
- id: node-logtail-crypto-token
  desc: Uses hardcoded Logtail collection token
  crit: notable
  if:
    type: text
    substr: HNt2fxAc1mCqCJ6zCzGDixt5
- id: node-logtail-crypto-env-copy
  desc: Copies full process environment
  crit: notable
  if:
    type: text
    substr: const sanitizedEnv = { ...process.env }
- id: node-logtail-crypto-env-upload
  desc: Includes sanitized environment in payload
  crit: notable
  if:
    type: text
    substr: 'environment: sanitizedEnv'
- id: node-logtail-crypto-init
  desc: Starts MongoDB connection on module load
  crit: notable
  if:
    type: text
    substr: connectToMongoDB().then(async () =>
composite_rules:
- id: node-logtail-crypto-environment-exfil
  desc: Sends full environment to hardcoded log destination
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/telemetry::logtail-hardcoded-collection-endpoint
  - id: node-logtail-crypto-token
  - id: node-logtail-crypto-env-copy
  - id: node-logtail-crypto-env-upload
  - id: node-logtail-crypto-init
