defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1041

traits:
  - id: js-credential-scan-root-env
    desc: Scans root directories and environment
    crit: notable
    if:
      type: text
      regex: '(?s)scanRootDirectories\(\);\s*scanEnvVars\(\);'

  - id: js-credential-scan-captures-env-value
    desc: Adds environment credential values to results
    crit: notable
    if:
      type: text
      regex: 'addResult\(\{\s*source:\s*["'']env["''].{0,100}EnvCredential.{0,50}value\s*\}'

  - id: js-credential-scan-results-payload
    desc: Includes findings in credential scan payload
    crit: notable
    if:
      type: text
      regex: '(?s)JSON\.stringify\(\s*\{.{0,220}total_credentials_found:.{0,80}(findings|entries)'

  - id: js-credential-scan-status-path
    desc: Uses credential scan callback path
    crit: notable
    if:
      type: text
      regex: '/\?credential_scan_(status|chunk)'

composite_rules:
  - id: js-credential-scan-findings-oast-upload
    desc: Uploads collected credential scan findings
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-credential-scan-root-env
      - id: js-credential-scan-captures-env-value
      - id: js-credential-scan-results-payload
      - id: js-token-scan-oast-host
      - id: js-credential-scan-status-path
      - id: micro-behaviors/communications/http/request/body/construction::request-write-payload-variable
