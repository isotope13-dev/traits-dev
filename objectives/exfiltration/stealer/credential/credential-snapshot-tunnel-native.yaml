defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  attack: T1555,T1041

composite_rules:
  - id: native-credential-snapshot-tunnel
    desc: Secret export via Cloudflare tunnel
    crit: hostile
    conf: 0.99
    attack: T1555,T1041,T1572
    mbc: B0030
    near_bytes: 128
    all:
      - id: micro-behaviors/communications/transfer::native-snapshot-upload-language
      - id: objectives/command-and-control/infrastructure/domain/tunnel::cloudflare-tunnel
    any:
      - id: micro-behaviors/os/security/auth/secret::native-credential-snapshot-language
      - id: micro-behaviors/os/security/auth/secret::native-token-capture-language
