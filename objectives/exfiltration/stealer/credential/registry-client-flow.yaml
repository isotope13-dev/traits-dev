defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
- id: credential-file-http-flow-with-client-clues
  desc: Credential-file HTTP flow with client clues
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
  any:
  - id: micro-behaviors/communications/http/request/credentials::npmrc-path-near-fetch
  - id: micro-behaviors/fs/read/file/target::npmrc-readfile-near-axios-request
  - id: micro-behaviors/fs/read/file/target::npmrc-readfilesync-near-axios-request
  - id: micro-behaviors/fs/read/file/target::npmrc-stream-near-axios-request
  - id: objectives/supply-chain/credential-theft/registry::js-npmrc-to-http
  - id: objectives/supply-chain/credential-theft/registry::js-netrc-to-axios
  - id: objectives/supply-chain/credential-theft/registry::js-netrc-to-http
  - id: objectives/supply-chain/credential-theft/registry::js-creds-to-fetch
  - id: objectives/supply-chain/credential-theft/registry::js-creds-to-axios
  - id: objectives/exfiltration/stealer/credential::package-credential-http-body-with-client
- id: package-credential-http-body-with-client
  desc: Package credential file HTTP body flow candidate
  crit: suspicious
  conf: 0.97
  for: [javascript, typescript]
  attack: T1041
  all:
  - id: micro-behaviors/fs/path/credential::package-manager-credential-path
  - id: micro-behaviors/communications/http/request/client::http-request
  any:
  - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
  - id: micro-behaviors/communications/http/request/credentials::cargo-credential-http-body-flow
  - id: micro-behaviors/communications/http/request/credentials::node-request-credential-file-body
