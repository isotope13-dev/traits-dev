defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
- id: credential-file-http-flow-with-client-clues
  desc: Credential-file HTTP flow with client clues
  crit: suspicious
  conf: 0.9
  unless:
  - id: micro-behaviors/data/control-flow/branch::literal-false-credential-http-context
  all:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::credential-file-http-body-flow
  any:
  - id: micro-behaviors/communications/http/request/credentials/file::npmrc-path-near-fetch
  - id: micro-behaviors/fs/read/file/credential::npmrc-readfile-near-axios-request
  - id: micro-behaviors/fs/read/file/credential::npmrc-readfilesync-near-axios-request
  - id: micro-behaviors/fs/read/file/credential::npmrc-stream-near-axios-request
  - id: objectives/exfiltration/stealer/credential/file::js-npmrc-to-http
  - id: objectives/exfiltration/stealer/credential/file::js-netrc-to-axios
  - id: objectives/exfiltration/stealer/credential/file::js-netrc-to-http
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::js-creds-to-axios
  - id: objectives/exfiltration/stealer/credential::package-credential-http-body-with-client
- id: package-credential-http-body-with-client
  desc: Package credential file HTTP body flow candidate
  crit: suspicious
  conf: 0.97
  for: [javascript, typescript]
  attack: T1041
  all:
  - id: micro-behaviors/fs/path/developer-credential::package-manager-credential-path
  - id: micro-behaviors/communications/http/request/client::http-request
  any:
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::credential-file-http-body-flow
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::cargo-credential-http-body-flow
  - id: micro-behaviors/communications/http/request/credentials/file::node-request-credential-file-body
