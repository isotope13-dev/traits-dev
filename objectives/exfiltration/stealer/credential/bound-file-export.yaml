defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - go
  - rust
  - perl
  - powershell
  crit: hostile
  conf: 0.96
  attack: T1552.001,T1041
composite_rules:
- id: credential-file-content-http-export
  desc: Credential-file contents sent to HTTP host
  scope: file
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  - id: micro-behaviors/communications/http/request/credentials::credential-file-content-http-send
  unless:
  - id: metadata/package/testing/presence/path::scanner-attack-fixture-context
  - id: metadata/build/recognized-contexts::developer-credential-tooling-context
  - id: micro-behaviors/communications/http/services/github/
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
  - id: well-known/tool/detection/
  - id: metadata/lang/source/declaration::python-imports-and-function-module
  any:
  - id: micro-behaviors/communications/http/url/endpoint::literal-http-call-target
  - id: micro-behaviors/communications/http/url/endpoint::javascript-request-explicit-destination
  - id: micro-behaviors/communications/http/url/scheme::powershell-http-url-literal
