defaults:
  platforms: [android]
  for: [kotlin, java, class, jar, elf, so]
  attack: T1041

composite_rules:
  - id: android-credential-http-exfil
    desc: Android credential HTTP exfiltration
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/theft/file::android-credential-store-targeting
    any:
      - id: objectives/exfiltration/http/upload::exfil-beacon-http-endpoint
  - id: android-credential-upload-exfil
    desc: Android credential upload exfiltration
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/theft/file::android-credential-store-targeting
    # These alternatives support transfer context for this source-specific
    # inference. A content-type or endpoint alone is not an upload capability.
    any:
      - id: micro-behaviors/communications/http/upload::curl-data-binary
      - id: micro-behaviors/communications/http/url/endpoint::raw-exfil-post-path
      - id: micro-behaviors/communications/http/header/content-type::octet-stream-content-type
