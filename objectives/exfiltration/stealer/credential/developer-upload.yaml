defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  attack: T1552,T1041

composite_rules:
  - id: developer-credential-network-upload
    for: [javascript, typescript]
    desc: Developer credential sent as webhook content
    crit: hostile
    conf: 0.95
    near_lines: 20
    all:
    - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
    - id: micro-behaviors/communications/url/reference::oob-or-chat-api-reference
    - id: micro-behaviors/communications/http/request/credentials::bound-credential-webhook-content
    unless:
    - id: well-known/tool/detection/
    - id: "metadata/file/naming::test-directory-component"
    - id: micro-behaviors/communications/http/services/github/
    - id: metadata/build/recognized-contexts::developer-credential-tooling-context
    - id: objectives/supply-chain/credential-theft/registry::project-snapshot-npmrc-text-branch
    - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
    - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
