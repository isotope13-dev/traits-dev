defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1005,T1041

traits:
  - id: npm-tnactgfds-flag-search
    desc: npm install hook searches the workspace for challenge flags
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '(find\s+/usr/src/app\s+-name\s+flag|grep\s+-r[^\n]{0,40}flag[^\n]{0,80}/usr/src/app)'

  - id: npm-tnactgfds-flag-upload
    desc: npm install hook uploads workspace data to its collection endpoint
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'bin\.graversen\.io/api/[a-f0-9-]+'

  - id: npm-tss12111-mcp-config-upload
    desc: npm install hook encodes and uploads an MCP configuration file
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'find\s+/home\s+/root\s+/etc[^\n]{0,120}mcp\.json[^\n]{0,300}base64[^\n]{0,200}curl'

  - id: npm-tss12111-oast-collector
    desc: npm install hook targets its OAST configuration collector
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      substr: oastify.com/config_leak

  - id: npm-ts-form-helpers-git-credential-harvest
    desc: Shell script reads Git credentials and token sources
    crit: suspicious
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: 'git credential fill[\s\S]{0,1200}(\.git-credentials|GITHUB_TOKEN)[\s\S]{0,1200}curl'
      exclude_comments: true

  - id: npm-ts-form-helpers-credential-endpoint
    desc: Shell script uploads data to the credential collection endpoint
    crit: suspicious
    conf: 0.99
    for: [shell]
    if:
      type: text
      regex: 'aaronstack\.com/poc/(env|token)'
      exclude_comments: true

  - id: npm-ts-form-helpers-package-name
    desc: Identifies the ts-form-helpers package
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: ts-form-helpers

composite_rules:
  - id: npm-tnactgfds-preinstall-flag-exfil
    desc: npm preinstall searches a workspace for flags and uploads results
    crit: hostile
    conf: 0.995
    for: [zip, npm, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::npm-preinstall-script
      - id: npm-tnactgfds-flag-search
      - id: npm-tnactgfds-flag-upload

  - id: npm-tss12111-preinstall-mcp-exfil
    desc: npm preinstall reads and uploads an MCP configuration file
    crit: hostile
    conf: 0.995
    for: [zip, npm, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::npm-preinstall-script
      - id: npm-tss12111-mcp-config-upload
      - id: npm-tss12111-oast-collector

  - id: npm-ts-form-helpers-git-token-exfil
    desc: npm package launches a shell hook that uploads Git credentials
    crit: hostile
    conf: 0.995
    for: [zip, npm, package.json, shell]
    scope: archive
    all:
      - id: npm-ts-form-helpers-package-name
      - id: metadata/package/scripts/entrypoint::postinstall-runs-shell-local-script
      - id: npm-ts-form-helpers-git-credential-harvest
      - id: npm-ts-form-helpers-credential-endpoint
