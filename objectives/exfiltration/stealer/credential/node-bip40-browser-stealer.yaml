# Obfuscated Discord bot shipped by bip40. It opens a command channel, runs
# remote shell commands, and sends browser, wallet, and environment files.
defaults:
  platforms: [unix, windows, macos]
  for: [javascript, package.json]
  attack: T1059.004,T1555.003,T1041
  mbc: E1055,E1041

traits:
  - id: bip40-discord-runtime-marker
    desc: References the Discord.js client library
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: discord.js

  - id: bip40-remote-run-command
    desc: Contains a remote command-execution bot command
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '!run'

  - id: bip40-remote-file-command
    desc: Contains a remote file-transfer bot command
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '!sendfile'

  - id: bip40-discord-message-command-handler
    desc: Handles incoming Discord bot messages
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments
            . (string (string_fragment) @event)
            . (_)))
          (#eq? @method "on")
          (#eq? @event "messageCreate"))

composite_rules:
  - id: npm-bip40-discord-browser-rat
    desc: Postinstall Discord RAT steals browser and environment data
    crit: hostile
    conf: 0.995
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: bip40-discord-runtime-marker
      - id: bip40-discord-message-command-handler
      - id: bip40-remote-run-command
      - id: bip40-remote-file-command
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/fs/path/password-store::chrome-browser-data-reference
      - id: micro-behaviors/fs/path/credential::any-credential-path
      - id: well-known/lib/media/screenshot::screenshot-desktop-import
