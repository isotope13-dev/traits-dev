# Coding-agent authentication files read as raw text and placed in an
# outbound JSON request are credential export, even when the endpoint is a
# product's own synchronization service.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041

traits:
  - id: agent-auth-file-raw-read
    desc: Reads raw agent authentication file contents
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'safeRead.{0,200}(auth\.json|credentials\.json)'

  - id: credentials-collector-in-json-http-payload
    desc: Credentials collector in JSON payload
    crit: component
    conf: 0.94
    if:
      type: text
      regex: 'credentials\s*:\s*\w+\s*\([\s\S]{0,800}JSON\.stringify\s*\('

composite_rules:
  - id: coding-agent-auth-files-http-export
    desc: Coding-agent authentication files exported by HTTP
    crit: hostile
    conf: 0.94
    near_bytes: 12000
    all:
      - id: agent-auth-file-raw-read
      - id: credentials-collector-in-json-http-payload
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
    unless:
      - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
      - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
