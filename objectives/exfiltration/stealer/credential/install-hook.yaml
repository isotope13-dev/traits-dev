defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  - shell
  attack: T1041
  mbc: E1041
  crit: hostile
composite_rules:
- id: curl-cloud-metadata-oast-exfil
  desc: curl exfils cloud metadata to OASTify
  conf: 0.995
  for:
  - javascript
  - shell
  all:
  - id: micro-behaviors/communications/http/services/cloud::curl-aws-metadata-query
  - id: micro-behaviors/communications/http/services/cloud::cloud-metadata-endpoint-reference
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  any:
  - id: well-known/tool/offensive/burp-collaborator::oastify-metadata-route-reference
  - id: micro-behaviors/communications/http/upload/file::curl-temp-file-body-post
- id: curl-cloud-metadata-oob-exfil
  desc: curl exfils cloud metadata to OOB
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/services/cloud::curl-aws-metadata-query
  - id: micro-behaviors/communications/http/services/cloud::cloud-metadata-endpoint-reference
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  any:
  - id: micro-behaviors/communications/http/upload/file::curl-post-temp-json-file
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  - id: micro-behaviors/communications/http/request/verb::curl-post-custom-header
  unless:
  - id: well-known/tool/offensive/pentestkit/
  - id: metadata/package/documentation/security-testing::validator-string-unit-test
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/offensive/payload-corpus::scanner-request-payload-context
