defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1555,T1041

composite_rules:
  - id: remote-access-and-ftp-secret-targets
    desc: Targets mRemoteNG and FTPInfo credential configs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/secret-config::mremoteng-confcons-path
      - id: micro-behaviors/fs/path/secret-config::ftpinfo-appdata-path

  - id: lznt1-xor-credential-exfil
    desc: Exfiltrates XOR and LZNT1-compressed credential configs
    crit: hostile
    conf: 0.98
    platforms: [windows]
    for: [c, cpp, rust]
    all:
      - id: remote-access-and-ftp-secret-targets
      - id: micro-behaviors/data/codec::rtl-compress-buffer-source
    any:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-send-request-src
      - id: micro-behaviors/communications/socket/receive::rust-stream-receive-call
