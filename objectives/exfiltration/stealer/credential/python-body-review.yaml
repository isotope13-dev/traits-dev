# Reviewed observations: capability, source shape, and intent stay distinct.
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-credential-http-upload
  desc: Uploads Python credential contents via HTTP
  crit: hostile
  conf: 0.95
  scope: leaf
  all:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
  any:
  - id: micro-behaviors/communications/http/request/credentials::python-secret-env-json-body
  - id: micro-behaviors/communications/http/request/credentials::go-secret-env-reader-body
  - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
  - id: micro-behaviors/communications/http/request/credentials::cargo-credential-http-body-flow
  - id: micro-behaviors/communications/http/upload::curl-named-file-body-upload-command
  unless:
  - id: well-known/app/ai/agent-runtime/
  - id: well-known/app/ai/coding-agent/
  - id: micro-behaviors/communications/http/services/github/
  - id: metadata/build/recognized-contexts::developer-credential-tooling-context
  - id: metadata/package/testing/presence/harness::verified-python-test-file
  - id: well-known/tool/detection/
  - id: metadata/file/naming::test-directory-component
  - id: metadata/lang/source/declaration::python-imports-and-function-module
  attack: T1552.001,T1041
