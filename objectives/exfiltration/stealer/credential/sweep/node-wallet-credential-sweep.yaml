defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1005,T1552.001
  mbc: E1005

composite_rules:
  - id: node-wallet-extension-credential-target-catalog
    desc: Node lists wallet, browser-extension and credential paths
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/fs/path/application/extensions::chromium-local-extension-settings-path
      - id: micro-behaviors/fs/path/credential/collection::private-key-and-wallet-paths
      - id: micro-behaviors/fs/path/credential/collection::service-credential-path

  - id: node-wallet-cloud-history-collector
    desc: Node collector reads wallet, cloud and shell-history paths
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/fs/path/credential/collection::private-key-and-wallet-paths
      - id: micro-behaviors/fs/path/credential/collection::developer-cloud-credential-path-cluster
      - id: micro-behaviors/fs/path/activity-history::shell-history-file-path
      - id: micro-behaviors/data/parse/vocabulary::wallet-credential-term-cluster

  - id: install-hook-wallet-credential-sweep-upload
    desc: Install hook ships a package that sweeps wallets and posts data
    crit: hostile
    conf: 0.92
    for: [npm, tar, javascript, typescript, package.json]
    scope: package
    all:
      - id: micro-behaviors/os/package-manager/hook-install::lifecycle-hook-runs-node-script
      - id: micro-behaviors/communications/http/post/
    any:
      - id: node-wallet-extension-credential-target-catalog
      - id: node-wallet-cloud-history-collector
