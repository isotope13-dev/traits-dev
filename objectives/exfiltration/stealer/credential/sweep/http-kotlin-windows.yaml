defaults:
  platforms:
  - windows
  for:
  - kotlin
  - class
  - java_class
  - jar
  attack: T1041
  crit: hostile
  conf: 0.98
composite_rules:
- id: kotlin-windows-credential-http-exfil
  desc: Windows credential commands with Kotlin HTTP output
  for: [kotlin]
  # Cross-platform credential paths do not establish Windows credential access.
  # Actual file reads plus HTTP output are covered by credential/developer.
  all:
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/communications/http/request/body/construction::jvm-http-body-write-source
  - id: objectives/credential-access/credential-manager/cli::kotlin-cmdkey-wifi-cluster
- id: kotlin-windows-bytecode-credential-exfil
  desc: Kotlin bytecode credential exfil
  for:
  - class
  - java_class
  - jar
  all:
  - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
  - id: micro-behaviors/communications/http/post::jvm-post-token
  - id: metadata/lang/source/naming/function/communication::jvm-set-do-output-member
  - id: micro-behaviors/data/buffer/transfer::jvm-outputstream-write
  needs: 1
  any:
  - id: objectives/credential-access/credential-manager/cli::jvm-cmdkey-list-bytes
  - id: objectives/credential-access/wifi::jvm-netsh-wlan-keyclear-bytes
  - id: micro-behaviors/fs/path/credential/password-store::jvm-login-data-bytes
  - id: micro-behaviors/fs/path/credential/password-store::jvm-logins-json-bytes
  unless:
  - id: micro-behaviors/fs/path/application/browser/profile::chrome-macos-support-path-class
