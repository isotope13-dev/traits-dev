defaults:
  for: [javascript]
  platforms: [windows, unix]
composite_rules:
  - id: obfuscated-credential-tree-multipart-collector
    desc: Obfuscated credential-tree collector prepares binary multipart uploads
    crit: hostile
    conf: 0.95
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/fs/path/credential/collection::multiple-developer-credential-path-groups
      - id: micro-behaviors/fs/directory/async-enumeration::node-readdir-async-call
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/data/buffer/alloc::blob-construction
      - id: micro-behaviors/communications/http/request/reference::js-fetch-invocation-surface
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
