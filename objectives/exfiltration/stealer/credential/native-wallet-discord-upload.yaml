# A native Windows binary that references browser cookie/login storage,
# a cluster of crypto-wallet browser-extension IDs, the Discord
# Local Storage token location and an HTTP upload endpoint is harvesting
# credentials and wallet data for exfiltration. Wallet extensions are
# referenced here as theft targets, not as the program's own identity,
# so no well-known/app suppression applies.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1567.002
  mbc: B0028

composite_rules:
  - id: native-wallet-discord-upload-stealer
    desc: Native stealer targets wallets, Discord tokens and HTTP upload
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/app-data::browser-wallet-storage-references
      - id: micro-behaviors/browser-extension/lifecycle::wallet-extension-id-cluster
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
      - id: micro-behaviors/communications/http/upload::http-upload-url-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
