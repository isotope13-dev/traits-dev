defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1552.001,T1041
traits:
# Any fn(fs.readFileSync(...)) (template precompile); the secret-post composite gives it meaning.
- id: node-read-file-into-collector
  desc: Passes file contents to a collector
  crit: component
  conf: 0.97
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (identifier) @collector
        arguments: (arguments
          (call_expression
            function: (member_expression object: (identifier) @fs property: (property_identifier) @read))
          _ (identifier) @found))
        (#eq? @fs "fs")
        (#eq? @read "readFileSync"))
- id: node-secret-pattern-regex
  desc: Regex matches wallet and environment secrets
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    query: |
      ((regex pattern: (regex_pattern) @pattern)
        (#match? @pattern "private_")
        (#match? @pattern "mnemonic")
        (#match? @pattern "secret"))
composite_rules:
- id: node-encrypted-project-secret-post
  desc: Scans project secrets and posts encrypted data
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: node-read-file-into-collector
  - id: node-secret-pattern-regex
  - id: micro-behaviors/communications/http/request/body/encoded::node-aes-gcm-json-fetch-post
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-gcm
  - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
