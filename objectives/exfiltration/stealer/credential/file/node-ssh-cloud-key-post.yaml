# A Node file that reads home-directory SSH private keys alongside cloud or
# registry credential files and posts a JSON body to a remote host is a
# credential harvester: no legitimate module reads id_rsa next to
# ~/.aws/credentials and ships them out in the same few kilobytes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-ssh-key-cloud-credential-json-post
    desc: Reads SSH key and cloud credentials, posts JSON
    crit: hostile
    conf: 0.93
    attack: T1552.004,T1552.001,T1041
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/communications/http/request/json::fetch-flow-json-post-body
      - id: micro-behaviors/communications/transfer::developer-credential-context-near-network-send
    any:
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/config/app::npmrc-user-config-path
