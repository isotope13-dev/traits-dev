# Account tampering supplies attack context beyond an ordinary support upload.
# The source and destination must belong to a parsed curl call. This also
# covers unpacked/cleartext variants; decoded layers need the same call facts.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: root-account-auth-config-export
    desc: UID-zero login with credential-file uploads
    crit: hostile
    conf: 0.99
    attack: T1041,T1552.001
    all:
      - id: micro-behaviors/os/user/modify::root-equivalent-useradd
    any:
      - id: micro-behaviors/communications/http/upload/file::curl-pbx-auth-config-upload
      - id: micro-behaviors/communications/http/upload/file::curl-postfix-password-map-upload
