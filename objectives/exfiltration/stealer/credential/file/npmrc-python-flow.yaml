# Tested language extension of the article's npm authentication-file export.
# This is not a claim that the reported AntV payload was written in Python.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041

traits:
  - id: python-npmrc-dns-export
    desc: .npmrc contents enter Python DNS query
    attack: T1552.001,T1048.003
    if:
      type: symbol
      kind: call
      # from-import aliases project their canonical function without a module.
      regex: '^(socket\.)?(getaddrinfo|gethostbyname|gethostbyname_ex)$'
      arg:
        index: 0
        from:
          call: '^open$'
          literal: '(^|[/\\])\.npmrc$'
          through:
            - call: '^os\.path\.expanduser$'
              arguments: [0]
            - call: '\.(read|encode|hex|decode)$'
              receiver: true
            - call: '^(base64\.)?(b64encode|urlsafe_b64encode|b32encode)$'
              arguments: [0]

