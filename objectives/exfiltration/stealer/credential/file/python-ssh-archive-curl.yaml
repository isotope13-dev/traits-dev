defaults:
  platforms: [unix, macos]
  for: [python]
  attack: T1552.004,T1041

composite_rules:
  - id: python-staged-ssh-archive-curl-exfil
    desc: SSH archive sent with insecure curl
    crit: hostile
    conf: 0.98
    near_bytes: 2500
    all:
      - id: micro-behaviors/fs/write/file/copy::python-ssh-directory-copy-binding
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/communications/http/upload/file::python-curl-form-file-upload-command
      - id: objectives/evasion/security-bypass/tls::tls-bypass-ip-target
