defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
  attack: T1041
  mbc: B0030
composite_rules:
- id: credential-file-socket-exfil
  desc: Credential-file read and socket send
  crit: hostile
  conf: 0.95
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/socket/dial::socket-dial
  - id: micro-behaviors/communications/socket/send/
  - id: micro-behaviors/fs/read/file/
  - id: micro-behaviors/fs/path/credential/collection::any-credential-path
  # The official Lark CLI reads its own app secret and tokens and sends them to
  # the Lark Open Platform API. Only that vendor binary is suppressed here.
  unless:
  - id: well-known/tool/development/cli/lark-cli::lark-cli-official-context
