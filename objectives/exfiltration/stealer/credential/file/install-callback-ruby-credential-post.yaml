defaults:
  platforms: [unix, windows]
  for: [ruby]

# Ruby collectors read several credential stores (package-manager tokens, git
# credentials, wallet keypairs, dotenv secrets, secret-named env vars) and
# POST them out. The paths are content literals, so the rules hold after a
# rename. A single credential file on its own stays a notable/suspicious
# client matter; these composites demand the read-and-POST pairing.
composite_rules:
  # Any Ruby file that reads at least two credential sources and POSTs bytes.
  - id: ruby-credential-file-post-exfil
    desc: Ruby reads several credential stores then POSTs them
    crit: hostile
    conf: 0.97
    attack: T1041
    scope: file
    all:
      - id: micro-behaviors/fs/read/file/content/bytes::ruby-file-binread-content
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
      - id: micro-behaviors/fs/path/config/security::ruby-netrc-path-reference
      - id: micro-behaviors/fs/path/token::git-credentials
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/fs/path/wallet::ruby-desktop-wallet-directory-a
      - id: micro-behaviors/fs/path/wallet::ruby-solana-keypair-path
      - id: micro-behaviors/os/env/secret-name::ruby-secret-env-list
    needs: 2

  # An extension build script (extconf.rb is the RubyGems native-extension
  # builder, so it runs at gem install) that reads one credential source and
  # POSTs bytes. A build step has no reason to upload a wallet, npm or git
  # credential, so one credential leg is enough beside the install hook.
  - id: ruby-extconf-credential-post
    desc: Gem extension build script uploads a credential store
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/fs/read/file/content/bytes::ruby-file-binread-content
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
      - id: micro-behaviors/fs/path/config/security::ruby-netrc-path-reference
      - id: micro-behaviors/fs/path/token::git-credentials
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/fs/path/wallet::ruby-desktop-wallet-directory-a
      - id: micro-behaviors/fs/path/wallet::ruby-solana-keypair-path
      - id: micro-behaviors/os/env/secret-name::ruby-secret-env-list
    needs: 1
