# Android Python uses Linux; the engine rejects Android-only Python scope.
# Raw credential-selected files; a parsed authentication-record format is not required.
defaults:
  for:
  - python
  platforms:
  - linux
  - android
composite_rules:
- id: python-tasked-telegram-auth-export
  desc: Tasked Telegram auth collection with binary HTTP upload clues
  crit: hostile
  conf: 0.97
  attack: T1041,T1555
  all:
  - id: objectives/command-and-control/remote-command/http-poll::python-telegram-auth-keyed-tasking
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
  - id: micro-behaviors/data/format/mime::mime-octet-stream
