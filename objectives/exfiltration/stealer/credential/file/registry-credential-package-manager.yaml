defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
  attack: T1552.001
composite_rules:
- id: postinstall-npmrc-http-exfil
  desc: Package postinstall exfiltrates npm credentials
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1552.001,T1041
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/stealer/credential::js-npmrc-http-post
- id: pypi-credential-theft
  desc: PyPI credential theft
  crit: hostile
  conf: 0.95
  mbc: E1552
  all:
  - id: micro-behaviors/fs/read/file/credential::pypirc-read
  - id: micro-behaviors/communications/http/request/credentials/literal::python-credential-file-near-http-upload
- id: npm-script-npmrc-token-theft
  desc: npm script exfiltrates .npmrc
  crit: hostile
  conf: 0.97
  for:
  - package.json
  mbc: E1552
  attack: T1195.002,T1552.001,T1041
  all:
  - id: micro-behaviors/fs/path/secret-config::npm-script-auth-config-dotfile
  - id: micro-behaviors/communications/http/request/verb::npm-script-node-http-post
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
