defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-ssh-aws-credential-post
    desc: Ruby SSH and AWS credential collection with HTTP POST
    crit: hostile
    conf: 0.98
    mbc: E1555
    attack: T1552.001
    all:
      - id: objectives/credential-access/ssh/key::ruby-home-private-key-post-collector
      - id: objectives/credential-access/cloud/account::ruby-home-aws-credential-post-collector
