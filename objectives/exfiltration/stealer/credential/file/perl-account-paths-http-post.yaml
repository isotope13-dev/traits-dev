defaults:
  platforms:
  - unix
  for:
  - perl

traits:
- id: perl-helper-derived-https-url
  desc: Perl helper supplies interpolated HTTPS host
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?is)\$\w+\s*=\s*[A-Za-z_]\w*\s*\(.{0,600}https://\$\w+'

composite_rules:
- id: perl-account-paths-http-post
  desc: Perl account-file paths with HTTP POST
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/request/json::perl-http-json-socket-post
  - id: micro-behaviors/fs/path/config/accounts::perl-passwd-shadow-sudoers-paths

- id: perl-helper-relayed-credential-config-upload
  desc: Perl sends developer credential files to a helper-derived HTTPS endpoint
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1041,T1071
  scope: file
  all:
  - id: micro-behaviors/process/create/subprocess/configure::perl-curl-open-pipe
  - id: micro-behaviors/communications/http/request/body/construction::perl-curl-data-binary-stdin
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: perl-helper-derived-https-url
