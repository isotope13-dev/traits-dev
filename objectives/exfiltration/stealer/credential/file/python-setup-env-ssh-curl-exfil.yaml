defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1552.001,T1041
  mbc: E1041

composite_rules:
- id: python-setup-env-ssh-curl-exfil
  desc: Python hook sends env and SSH secrets in curl queries
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-rsa
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-items-loop
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
  - id: micro-behaviors/communications/url/construction/query::interpolated-identifier-query-value
  - id: objectives/command-and-control/infrastructure/domain/hosting::webhostapp-domain
