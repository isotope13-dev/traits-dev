defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1041

composite_rules:
  - id: python-package-manager-config-http-export
    desc: Python reads npm or NuGet config and sends it by HTTP body
    crit: hostile
    conf: 0.96
    scope: file
    near_bytes: 1600
    all:
      - id: micro-behaviors/fs/path/credential/registry::package-manager-config-path-marker
      - id: micro-behaviors/fs/file/open/call::python-opens-named-path
      - id: micro-behaviors/communications/http/request/body/construction::python-request-data-argument
