defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002
composite_rules:
  - id: chocolatey-npmrc-credential-exfil
    desc: Chocolatey hook posts npm configuration contents
    crit: hostile
    conf: 0.99
    scope: archive
    platforms: [windows, linux, macos]
    for: [binaries, '!dex', scripts, '!jcl', c, go, java, kotlin, nupkg, rust]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
      - id: micro-behaviors/fs/read/file/content/unspecified::get-content
      - id: "micro-behaviors/communications/http/post::powershell-post-method"

