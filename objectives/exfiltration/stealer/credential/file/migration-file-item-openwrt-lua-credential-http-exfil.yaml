defaults:
  platforms:
  - openwrt
  for:
  - lua
  attack: T1041
composite_rules:
- id: openwrt-lua-credential-http-exfil
  desc: OpenWrt Lua credential HTTP exfiltration
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/credential-access/files/theft::openwrt-lua-credential-config-harvest
  any:
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  - id: micro-behaviors/fs/path/hidden::lua-hidden-temp-stage-name
  - id: micro-behaviors/communications/http/client/curl::lua-shell-curl-text
  needs: 2
