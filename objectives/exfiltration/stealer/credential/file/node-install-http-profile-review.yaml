defaults:
  platforms: [windows, linux]
  for: [javascript, typescript, tar, zip]
  attack: T1195.002,T1041,T1082,T1552.005
  mbc: E1041

composite_rules:
  - id: objectives/exfiltration/stealer/credential/file::postinstall-script-credential-exfil
    desc: Postinstall script harvests credentials and posts over HTTP
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1552,T1041"
    for: [javascript, typescript]
    scope: file
    all:
      - id: metadata/package/files/lifecycle::install-js-basename
      - id: objectives/exfiltration/stealer/configuration/environment::node-host-profile-http-post-file
    any:
      - id: micro-behaviors/fs/path/credential::browser-developer-ssh-store-paths
      - id: micro-behaviors/fs/read/file/content/configuration::node-npmrc-read-reference
      - id: micro-behaviors/fs/path/credential::ssh-key-or-host-store-reference
      - id: micro-behaviors/fs/path/credential::browser-store-reference
