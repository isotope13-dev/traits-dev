defaults:
  platforms: [windows]
  for: [csharp, source, class]
  attack: T1552.001,T1041
  mbc: B0022

composite_rules:
  - id: dotnet-package-manager-config-http-export
    desc: .NET reads package-manager configuration and uploads it by HTTP
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 1800
    all:
      - id: micro-behaviors/fs/path/secret-config::package-manager-config-path-marker
      - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readalltext-token
      - id: micro-behaviors/communications/http/post::postasync
      - id: micro-behaviors/communications/http/client/managed::httpclient-reference-or-construction
