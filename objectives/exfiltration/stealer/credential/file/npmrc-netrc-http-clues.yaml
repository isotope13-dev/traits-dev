---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: js-npmrc-to-http
  desc: npmrc reference near an HTTP request
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  unless:
  - id: well-known/tool/development/aube::aube-package-test-fixture
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
  if:
    type: text
    regex: "\\.npmrc[\\s\\S]{0,300}http\\.request"
- id: js-netrc-to-axios
  desc: netrc reference near Axios
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.netrc[\\s\\S]{0,300}axios"
- id: js-netrc-to-http
  desc: netrc reference near HTTP request
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.netrc[\\s\\S]{0,300}http\\.request"
