defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: node-panel-key-file-telegram
    desc: Sends panel-key files to Telegram
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @fs value: (call_expression function: (identifier) @require_fs
            arguments: (arguments (string (string_fragment) @fs_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @axios value: (call_expression function: (identifier) @require_axios
            arguments: (arguments (string (string_fragment) @axios_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @root value: (call_expression
            function: (member_expression object: (identifier) @process property: (property_identifier) @cwd))))
          (function_declaration name: (identifier) @send parameters: (formal_parameters (identifier) @filename (identifier) @sent_content)
            body: (statement_block (expression_statement (call_expression function: (member_expression
              object: (call_expression function: (member_expression object: (identifier) @axios_use property: (property_identifier) @post)
                arguments: (arguments (template_string (string_fragment) @url_prefix (template_substitution (identifier)) (string_fragment) @url_suffix)
                  (object (pair key: (property_identifier) @text_key value: (template_string
                    (template_substitution (identifier) @sent_filename) (template_substitution (identifier) @sent_use))))))
              property: (property_identifier) @catch)))))
          (function_declaration name: (identifier) @scan parameters: (formal_parameters (identifier) @folder)
            body: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @items value: (call_expression
                function: (member_expression object: (identifier) @fs_list property: (property_identifier) @readdir)
                arguments: (arguments (identifier) @folder_use))))
              (for_in_statement right: (identifier) @items_use body: (statement_block
                (if_statement consequence: (statement_block (expression_statement (call_expression function: (identifier) @scan_recurse)))
                  alternative: (else_clause (if_statement consequence: (statement_block (try_statement body: (statement_block
                    (lexical_declaration (variable_declarator name: (identifier) @content value: (call_expression
                      function: (member_expression object: (identifier) @fs_read property: (property_identifier) @read))))
                    (if_statement condition: (parenthesized_expression (call_expression function: (member_expression
                      object: (regex pattern: (regex_pattern) @key_pattern) property: (property_identifier) @test)
                      arguments: (arguments (identifier) @content_test)))
                      consequence: (statement_block (expression_statement (call_expression function: (identifier) @send_use
                        arguments: (arguments (_) (identifier) @content_send)))))))))))))))
          (expression_statement (call_expression function: (identifier) @scan_start arguments: (arguments (identifier) @root_use))))
          (#eq? @require_fs "require")
          (#eq? @fs_module "fs")
          (#eq? @require_axios "require")
          (#eq? @axios_module "axios")
          (#eq? @process "process")
          (#eq? @cwd "cwd")
          (#eq? @root @root_use)
          (#eq? @axios @axios_use)
          (#eq? @post "post")
          (#eq? @url_prefix "https://api.telegram.org/bot")
          (#eq? @url_suffix "/sendMessage")
          (#eq? @text_key "text")
          (#eq? @filename @sent_filename)
          (#eq? @sent_content @sent_use)
          (#eq? @catch "catch")
          (#eq? @fs @fs_list)
          (#eq? @fs @fs_read)
          (#eq? @readdir "readdirSync")
          (#eq? @read "readFileSync")
          (#eq? @folder @folder_use)
          (#eq? @items @items_use)
          (#eq? @scan @scan_recurse)
          (#eq? @scan @scan_start)
          (#eq? @test "test")
          (#eq? @key_pattern "plta_|pltc_")
          (#eq? @content @content_test)
          (#eq? @content @content_send)
          (#eq? @send @send_use))
