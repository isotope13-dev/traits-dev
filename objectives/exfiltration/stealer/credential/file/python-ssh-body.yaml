# Both alternatives already require a requests/httpx POST with the opened
# key file in its data body. A second raw-name POST check missed import aliases.
# The required exported object is a key file, not a parsed key value.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-ssh-private-key-http-export
    desc: Exports an SSH private-key file over HTTP
    crit: suspicious
    conf: 0.98
    attack: T1552.004,T1041
    all:
      - id: micro-behaviors/communications/http/post::python-http-post-client-call
    any:
      - id: micro-behaviors/communications/http/request/credential-body-flow::python-ssh-key-requests-data-body
      - id: micro-behaviors/communications/http/request/credential-body-flow::python-ssh-key-httpx-data-body

