# Copying several credential stores, staging them under a hidden writable
# path and sending a file over HTTP is a harvest-and-upload routine. Proximity
# does not bind the uploaded file to the copies; the hidden staging location
# and the multi-store selection carry the intent.
defaults:
  platforms: [linux]
  for: [shell]

composite_rules:
  - id: root-credential-bundle-hidden-stage-upload
    desc: Hidden-staged credential stores with file upload
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1074.001,T1048
    near_lines: 20
    all:
      - id: objectives/credential-access/files/secret-sweep::shell-multi-credential-store-copy
      - id: micro-behaviors/fs/path/hidden::hidden-writable-path
    any:
      - id: micro-behaviors/communications/http/upload/file::curl-file-upload-option
      - id: micro-behaviors/communications/http/upload/cli::wget-post-file-upload
