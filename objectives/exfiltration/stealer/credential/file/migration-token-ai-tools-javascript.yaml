defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
composite_rules:
- id: node-credential-file-oauth-profile-post
  desc: Credential file read, OAuth profile path and HTTP POST
  conf: 0.99
  for: [npm, javascript]
  scope: archive
  attack: "T1552.001,T1041"
  all:
  - id: micro-behaviors/fs/path/token::claude-cli-oauth-credentials-file
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
  - id: micro-behaviors/communications/url/resource-path/identity::oauth-profile-api-path
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
