defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-developer-secret-multipart-exfil
    desc: NPM package uploads collected developer secrets as multipart files
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1552.001,T1041"
    all:
      - id: micro-behaviors/communications/http/upload/file::node-local-file-formdata-stream
      - id: objectives/credential-access/files/config::node-dev-secret-source-cluster
    any:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/os/sysinfo/profile::node-host-information-query-set
      - id: objectives/credential-access/files/acquisition::node-dev-secret-report-file
