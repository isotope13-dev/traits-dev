defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
composite_rules:
- id: js-container-secret-oast-curl
  desc: Node curl exfils container secrets to OAST
  crit: suspicious
  conf: 0.97
  attack: T1041
  for:
  - javascript
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
  - id: micro-behaviors/fs/path/token::serviceaccount-token-path
  any:
  - id: micro-behaviors/fs/path/socket::docker-sock
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
- id: npm-preinstall-container-secret-exfil
  desc: NPM preinstall exfils container secrets
  crit: hostile
  conf: 0.99
  attack: T1195.002
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: objectives/exfiltration/stealer/credential/file::js-container-secret-oast-curl
