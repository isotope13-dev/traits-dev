defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: rust-build-script-credential-http-body
  desc: Cargo build script sends registry credentials
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  for: [rust]
  scope: leaf
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::cargo-credential-http-body-flow
  unless:
  - id: micro-behaviors/data/control-flow/branch::literal-false-credential-http-context

- id: cargo-archive-build-rs-credential-exfil
  desc: Cargo build.rs harvests developer credentials and uploads them
  crit: hostile
  conf: 0.995
  mbc: E1041
  attack: T1195.002,T1552.001,T1041
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/build/archive::archive-cargo-build-rs-entry
  - id: micro-behaviors/os/security/auth/secret::cargo-credential-source-read
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: micro-behaviors/communications/http/curl/body::curl-data-binary
