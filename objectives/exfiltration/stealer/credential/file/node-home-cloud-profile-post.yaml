defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1552.004,T1041

traits:
  - id: node-home-file-content-map
    desc: Reads home file contents into map
    crit: notable
    if:
      type: text
      regex: 'fileContents\[fileName\]\s*=\s*fs\.readFileSync\(filePath'
  - id: node-home-credential-file-list
    desc: Lists npm config and SSH key
    crit: notable
    if:
      type: text
      regex: '\.npmrc.{0,80}\.ssh/id_rsa'
  - id: node-home-cloud-profile-post
    desc: Posts home files and environment
    crit: notable
    if:
      type: text
      regex: '(?s)axios\.post\(trackingServiceUrl,\s*\{.{0,160}fileContents:.{0,100}environment:'
  - id: node-home-tracking-worker-url
    desc: Defines worker endpoint for tracking
    crit: notable
    if:
      type: text
      regex: 'trackingServiceUrl\s*=\s*["'']https://[a-z0-9.-]+\.workers\.dev/'
  - id: node-home-tracker-import-call
    desc: Imports and invokes tracker
    crit: notable
    if:
      type: text
      regex: '(?s)trackData\s*=\s*require\(["'']\./tracker["'']\).{0,120}trackData\(\)'

composite_rules:
  - id: node-home-cloud-credential-worker-post
    desc: Attempts to send home and cloud credentials
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: node-home-file-content-map
      - id: node-home-credential-file-list
      - id: node-home-cloud-profile-post
      - id: node-home-tracking-worker-url
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
      - id: micro-behaviors/fs/path/personal::bash-history-artifact
  - id: npm-install-home-cloud-credential-collector
    desc: Runs home and cloud credential collector on install
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-index-entry
      - id: node-home-tracker-import-call
      - id: node-home-cloud-credential-worker-post
