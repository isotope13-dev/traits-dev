defaults:
  for: [python]
  platforms: [windows, unix]
composite_rules:
  - id: python-gzip-urllib-ssh-history-collection
    desc: Gzip HTTP request with SSH and history collection clues
    crit: hostile
    conf: 0.98
    attack: T1552.004,T1552.003,T1041
    scope: file
    all:
      - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
      - id: micro-behaviors/fs/read/file/private-key::python-ssh-private-key-read-accumulate
      - id: micro-behaviors/fs/path/activity-history::bash-history-path-literal
      - id: micro-behaviors/communications/http/request/body/encoded::python-gzip-urllib-request-body
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
