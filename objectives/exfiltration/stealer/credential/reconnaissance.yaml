defaults:
  platforms: [unix, windows]
composite_rules:
  - id: credential-export-with-recon-or-ranking
    desc: Credential export with storage, recon or ranking
    crit: suspicious
    conf: 0.85
    for: [source, data, binaries, '!dex', scripts, '!jcl', asar, cab, chm, conda, cpio, crate, crx, deb, dmg, egg, gem, gentoo_binpkg, html, iso, jar, json, npm, nupkg, oci_image, pkg, python-sdist, rar, rpm, 7z, tar, text, vsix-archive, whl, xbps, xml, xpi, zip, apk, alpine_apk, ipa]
    scope: archive
    all:
      - id: objectives/exfiltration/stealer/credential::developer-credential-network-upload
      - id: objectives/exfiltration/sensitive-data/source::credential-exfiltration-network-sink
    any:
      - id: objectives/discovery
      # Preserve the Windows survey after its neutral capability relocation.
      - id: micro-behaviors/os/sysinfo/profile::windows-survey-command-cluster
      - id: micro-behaviors/fs/path/app-data::local-storage-or-leveldb-reference
      - id: metadata/lang/source/naming/setting::bucket-order-identifier-reference
    unless:
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
      - id: metadata/package/testing/

      - id: metadata/file/catalog/identity/
      - id: micro-behaviors/communications/http/oauth/
      - id: micro-behaviors/crypto/certificate/usage/
      - id: well-known/lib/format/abstract-bot-api::package-identity
      - id: "metadata/file/naming::test-directory-component"
    downgrade:
      any:
        - id: metadata/permission/telemetry::gecko-collects-website-content

