defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"

composite_rules:
  # A credential-bearing environment value is serialized into a native Node
  # request body and sent to a public callback collector. This models the data
  # path rather than a Twilio-only name: ACCOUNT_SID/AUTH_TOKEN is one instance,
  # while future packages can substitute any token, secret, key, or password.
- id: javascript-env-credential-oob-http-exfil
  desc: Node sends serialized environment credentials to an OOB collector
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  scope: file
  near_bytes: 4096
  attack: "T1552.001,T1041"
  mbc: "E1552,E1041"
  all:
  - id: micro-behaviors/data/serialize/json::json-stringify-env-access-body
  - id: micro-behaviors/os/env/secret-name::javascript-credential-env-reference
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
- id: python-fixed-env-secrets-json-urllib-exfil
  desc: Python posts multiple providers' environment secrets through urllib
  crit: hostile
  conf: 0.99
  attack: "T1552.001,T1041"
  for: [python]
  near_bytes: 4096
  needs: 2
  all:
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  any:
  - id: micro-behaviors/os/env/ai-provider::python-openai-anthropic-key-env-read
  - id: micro-behaviors/os/env/vcs::python-github-token-env-read
  - id: micro-behaviors/os/env/secret-name::python-aws-secret-access-key-env-read
  unless:
  - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
- id: javascript-fetch-json-ai-env-keys-exfil
  desc: Fetch POST JSON body with AI provider env keys
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  scope: file
  near_bytes: 2048
  attack: "T1552.001,T1041"
  mbc: "E1552,E1041"
  all:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/data/serialize/json::json-stringify-env-access-body
  - id: micro-behaviors/os/env/ai-provider::ai-provider-key-env-reference
  unless:
  - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
- id: javascript-xor-env-http-exfil
  desc: XOR-hidden HTTP exfiltrates filtered environment
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  scope: file
  near_bytes: 4096
  attack: "T1552.001,T1041"
  mbc: E1041
  all:
  - id: micro-behaviors/os/env/read::js-filtered-env-copy
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
  - id: micro-behaviors/process/io/stream::javascript-write-then-end-stream
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
  unless:
  - id: metadata/package/testing/
  - id: metadata/signed/platform/
  - id: "metadata/file/naming::test-directory-component"
- id: js-filtered-env-http-exfil
  desc: JavaScript sends filtered environment secrets over HTTP
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  attack: "T1552.001,T1041"
  mbc: "E1552,E1041"
  near_bytes: 900
  all:
  - id: objectives/credential-access/env/secrets/filtered-access::env-secret-filter-keyword-list
  - id: micro-behaviors/os/env/enumeration::js-object-keys-env
  - id: micro-behaviors/os/env/read::js-env-index-copy-to-object
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/client::h-request-call
  - id: micro-behaviors/communications/http/request/body::request-write-call
  unless:
  - id: metadata/package/testing/
  - id: metadata/signed/platform/
  - id: "metadata/file/naming::test-directory-component"
- id: javascript-filtered-env-socket-exfil
  desc: JavaScript sends filtered environment secrets by socket
  crit: hostile
  conf: 0.99
  for: [javascript, typescript]
  scope: file
  near_bytes: 1024
  attack: "T1552.001,T1041"
  mbc: "E1552,E1041"
  all:
  - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
  - id: micro-behaviors/os/env/read::js-env-index-copy-to-object
  - id: micro-behaviors/communications/socket/dial::javascript-dial
  - id: micro-behaviors/communications/socket/send::node-socket-json-write
  unless:
  - id: metadata/package/testing/
  - id: metadata/signed/platform/
  # dotenv.config() populates process.env from the selected file. Combining
  # that explicit load with a proven full-environment POST establishes that
  # dotenv credentials are included, even when no readFileSync call is visible.
  - id: "metadata/file/naming::test-directory-component"
- id: ruby-credential-env-http-request
  desc: Credential environment read near an outbound HTTP request
  crit: suspicious
  conf: 0.9
  attack: "T1552.001"
  for: [ruby]
  platforms: [unix, windows]
  near_bytes: 2048
  all:
  - id: objectives/credential-access/env/secrets/
  any:
  - id: micro-behaviors/communications/http/lib/faraday::faraday-post-call
  - id: micro-behaviors/communications/http/post::net-http-post
  unless:
  - id: objectives/credential-access/env/secrets/cicd::ruby-github-token-api-client-context

- id: python-env-json-urllib-exfil
  desc: Python serializes credential-named environment data in a urllib request
  crit: hostile
  conf: 0.97
  for: [python]
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: micro-behaviors/os/env/secret-name::python-environ-credential-name-filter
  any:
      # Require the environment value itself to enter JSON. A token used as
      # an HTTP authentication header or mentioned in CLI help is not an
      # exfiltration path merely because the same file makes a urllib request.
  - id: micro-behaviors/data/serialize/json::python-env-json-value
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/data/serialize/json::python-filtered-environ-json-value
  unless:
  - id: well-known/tool/development/vcs/gitcode::gitcode-release-helper
  - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
  - id: objectives/exfiltration/http/upload::hashicorp-infra-api-authenticated-request
  - id: objectives/exfiltration/http/upload::browser-use-cloud-authenticated-api
  - id: micro-behaviors/communications/http/services/hugpy::hugpy-authenticated-token-post-context
  - id: micro-behaviors/communications/http/llm::a2a-sweep-request
  - id: well-known/app/communication/acedatacloud/
  - id: micro-behaviors/communications/http/services/daft::daft-dashboard-authenticated-request
- id: python-direct-env-json-urllib-exfil
  desc: Python posts serialized secret env value
  crit: hostile
  conf: 0.98
  for: [python]
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: micro-behaviors/os/env/secret-name::python-sensitive-env-read
      # The secret-named value itself must enter the JSON body. The generic
      # env-in-dumps atom also matches an authenticated client whose key is
      # used as an auth header while an unrelated config value is serialized.
  - id: micro-behaviors/data/serialize/json::python-secret-env-json-value
  unless:
  - id: well-known/tool/development/vcs/gitcode::gitcode-release-helper
  - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
  - id: objectives/exfiltration/http/upload::hashicorp-infra-api-authenticated-request
  - id: objectives/exfiltration/http/upload::browser-use-cloud-authenticated-api
  - id: micro-behaviors/communications/http/services/hugpy::hugpy-authenticated-token-post-context
  - id: micro-behaviors/communications/http/llm::a2a-sweep-request
  - id: well-known/app/communication/acedatacloud/
  - id: micro-behaviors/communications/http/services/daft::daft-dashboard-authenticated-request
  # Raw sockets are also sufficient for exfiltration. Require the complete
  # flow: a credential-keyword filtered environment sweep, construction of a
  # Python socket, and transmission of the resulting mapping. This avoids
  # promoting ordinary socket clients or environment configuration readers.
- id: python-filtered-env-raw-socket-exfil
  desc: Sends filtered environment secrets by socket
  crit: hostile
  conf: 0.99
  for: [python]
  scope: file
  near_lines: 40
  attack: "T1552.001,T1041"
  mbc: "E1552,E1041"
  all:
  - id: objectives/credential-access/env/secrets/bulk-access::python-env-bulk-secret-harvest
  - id: micro-behaviors/communications/socket/create::socket-socket-call
  - id: micro-behaviors/communications/socket/send::python-send-environment-mapping
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: python-environ-json-urllib-exfil
  desc: Python sends credential-named environment entries in JSON over urllib
  crit: hostile
  conf: 0.98
  for: [python]
  attack: "T1552.001,T1041"
  mbc: E1041
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: micro-behaviors/os/env/secret-name::python-environ-credential-name-filter
- id: python-environ-json-requests-exfil
  desc: Python sends credential-named environment entries in JSON via requests
  crit: hostile
  conf: 0.98
  for: [python]
  attack: "T1552.001,T1041"
  mbc: E1041
  scope: file
  near_bytes: 4096
    # The corpus contains an executable exfiltration specimen. Retain its
    # behavior as suspicious within the corroborated scanner archive.
  downgrade:
    scope: archive
    all:
    - id: well-known/tool/detection/skillspector::skillspector-regression-corpus
  all:
  - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
  - id: micro-behaviors/os/env/secret-name::python-environ-credential-name-filter
