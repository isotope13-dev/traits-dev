defaults:
  for: [html, javascript, vbs, mirc]
  platforms: [windows]
traits:
  - id: mirc-dcc-password-cache-theft
    desc: mIRC sends Windows password-cache files
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\.?fdccsend\s+\$findfile\([^\r\n]{1,100}\*\.pwl'
composite_rules:
  - id: mirc-dcc-password-cache-theft-applet
    desc: Java bridge with mIRC password-cache theft
    for: [html, javascript]
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-dcc-password-cache-theft
      - id: micro-behaviors/os/com/automation::microsoft-java-activex-bridge-reference
      - id: micro-behaviors/os/com/automation::com-create-instance-call
