# Developer credential collection sealed for an embedded RSA public key and
# posted over HTTP: only the key holder can read what leaves (LiteLLM 1.107.0
# privcollect, Oct 2026). The PEM header leg requires a key shipped in the
# file rather than one fetched from a configured recipient.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1573.002,T1041

composite_rules:
  - id: python-rsa-wrapped-dev-secret-upload
    desc: Dev secrets posted under embedded RSA key
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/credential::multiple-developer-credential-path-groups
      - id: micro-behaviors/crypto/asymmetric/rsa::loaded-pem-public-key-encrypt
      - id: micro-behaviors/crypto/key/representation::pem-public-key-header
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aes-symbol
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/post::requests-post
