# Tokens scraped from another process's memory, then shipped off-host.
#
# Source plus transport: the credential-access objective establishes that the
# code reads another process's memory and sifts it for bearer credentials;
# this adds the outbound HTTP sink that turns collection into theft. The
# AgentCore Harness chain ends this way -- the recon script POSTs the harness's
# Cognito bearer token and the downstream MCP server URL to a webhook, which is
# enough for the attacker to call that server's tools from outside the sandbox.
#
# Transport is deliberately unpinned: the leg accepts any HTTP POST client, so
# a curl one-liner, a Python urllib request and a JavaScript fetch all land.
defaults:
  platforms: [unix, android]
  for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]
  attack: T1041,T1003.007

composite_rules:
  - id: process-memory-token-exfil
    desc: Exfiltrates tokens scraped from process memory
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/dump/process::process-memory-bearer-token-scrape
    any:
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/communications/http/curl
      - id: micro-behaviors/communications/http/request/verb
