# Managed collector that reads Discord desktop tokens and Telegram sessions,
# stages the captures as an archive and sends it with an HTTP
# multipart POST. The named routines are compiler-retained method identifiers;
# the archive and upload legs tie those sources to outbound collection.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: managed-discord-token-scan-routines
    desc: Managed Discord token scan routines
    crit: component
    conf: 0.92
    attack: T1528,T1539
    if:
      type: text
      regex: '\b(ScanDiscordDesktop|ExtractPlainTokens|ExtractSafeStorageTokens|AddToken)\b'

  - id: managed-telegram-session-capture-routines
    desc: Managed Telegram session capture routines
    crit: component
    conf: 0.92
    attack: T1539
    if:
      type: text
      regex: '\b(ScanTelegramDesktop|ScanTelegramWeb|EnumerateTelegramFiles|CaptureDirectory)\b'

composite_rules:
  - id: managed-messaging-app-session-archive-upload
    desc: Desktop app sessions sent in archive
    crit: hostile
    conf: 0.97
    attack: T1539,T1528,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: managed-discord-token-scan-routines
      - id: managed-telegram-session-capture-routines
      - id: micro-behaviors/data/archive/create/zip::dotnet-create-from-directory
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/communications/http/client/managed::multipart-form-data-content
      - id: micro-behaviors/communications/http/post::postasync
