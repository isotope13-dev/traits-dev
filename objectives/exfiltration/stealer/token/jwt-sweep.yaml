# Node JWT harvester: the install hook stringifies the process environment
# and lists processes, matches both against a JWT search pattern, stages the
# hits through base64, and GETs them to a collaborator endpoint. The Node twin
# of the shell root-grep harvester (shell-jwt-sweep-oast-exfil): telemetry
# stringifies event objects, never the whole environment for token patterns.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]
  crit: hostile
  conf: 0.97
  mbc: "E1041"

composite_rules:
  - id: node-jwt-sweep-oast-exfil
    desc: Node hook harvests env and process JWTs to OAST
    attack: "T1005,T1041,T1195.002"
    scope: archive
    all:
      - id: micro-behaviors/data/string/search::jwt-literal-prefix-search-pattern
      - id: objectives/supply-chain/recon-exfil/oast/secret::node-oastify-hostname
    any:
      - id: micro-behaviors/os/env/read::node-env-stringify-sweep
      - id: micro-behaviors/process/enumerate/shell::node-ps-exec-command
  # Hook-independent twin of the shell harvester above: a recursive root grep
  # for JWTs piped to a collaborator endpoint is credential theft wherever it
  # runs, not only in a lifecycle hook. The supply-chain composite keeps the
  # hook requirement for install-channel verdicts; this one covers the theft.
  - id: shell-jwt-sweep-oast-transfer
    desc: Shell sweeps filesystem for JWTs to OAST
    attack: "T1005,T1041"
    for: [npm, package.json, shell]
    scope: archive
    all:
      - id: micro-behaviors/data/string/search::jwt-literal-prefix-search-pattern
      - id: micro-behaviors/fs/search::shell-recursive-root-grep
      - id: objectives/supply-chain/recon-exfil/oast/secret::oastify-url
