# The token JSON is assembled in the Fabric entrypoint and passed to its
# hand-written TLS POST helper. Mojang-mapped clients expose named accessors,
# so require the concrete identity fields and both sides of that call chain.
defaults:
  platforms: [linux, macos, windows]
  for: [jar, zip, class]

composite_rules:
  - id: minecraft-token-handoff-raw-tls-post
    desc: Minecraft session JSON exfiltrated through raw TLS POST
    crit: hostile
    conf: 0.99
    attack: T1528,T1041,T1071.001
    scope: archive
    all:
      - id: objectives/credential-access/gaming/minecraft::minecraft-token-jar-handoff
      - id: objectives/credential-access/gaming/minecraft::minecraft-named-session-token-access
      - id: metadata/binary/symbols/name/token::jvm-username-name-constant
      - id: metadata/binary/symbols/name/token::jvm-uuid-name-constant
      - id: metadata/binary/symbols/name/token::jvm-access-token-name-constant
      - id: micro-behaviors/data/serialize/json::jvm-gson-serialization-method-reference
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-manual-http-post
