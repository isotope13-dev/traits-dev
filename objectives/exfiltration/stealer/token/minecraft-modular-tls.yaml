# The credential collector and hand-written transport can be separate classes.
# Archive co-occurrence does not bind the serialized object to the socket, so
# this records a suspicious transfer profile, not a proven source-to-send flow.
defaults:
  platforms: [linux, macos, windows]
  for: [jar, zip, class]

composite_rules:
  - id: minecraft-token-handoff-raw-tls-post
    desc: Token-handoff loader alongside raw TLS POST
    crit: suspicious
    conf: 0.95
    attack: T1528,T1041
    scope: archive
    all:
      - id: objectives/credential-access/gaming/minecraft::minecraft-token-jar-handoff
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-manual-http-post
