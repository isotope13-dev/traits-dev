# The loopback-prefix check attaches the owner token to an off-host request.
# The exfiltrated application token owns this composite; the SSRF is a leg.
defaults:
  for: [scripts, source, data, text]
  platforms: [unix, windows]
  crit: hostile
  conf: 0.99
  attack: T1190
composite_rules:
  - id: plex-agent-loopback-prefix-token-leak
    desc: Plex plugin fetch leaks owner token via loopback prefix
    all:
      - id: objectives/execution/exploit/access-control::plex-timeline-loopback-agent-ssrf
      - id: micro-behaviors/communications/http/services/plex::plugin-network-function-route
      - id: micro-behaviors/communications/url/host/name::loopback-prefix-dns-host
