defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.99
composite_rules:
- id: response-finish-unredacted-auth-header-export
  desc: Password reporting tap forwards unredacted request headers
  attack: T1041,T1539
  all:
  - id: micro-behaviors/communications/http/request/body::post-inbound-password-absolute-url
  - id: micro-behaviors/communications/http/request/body::post-inbound-username-absolute-url
  - id: micro-behaviors/communications/http/server/lifecycle::response-finish-post-hook
  - id: micro-behaviors/communications/http/request/body::post-inbound-headers-absolute-url
  near_bytes: 1800

