defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # Credentials are attached to the results batch, rather than used only as
  # API authorization. The repository write also selects a commit message
  # based on the batch's token. Require both shapes plus concealed daemon code.
  - id: obfuscated-auth-token-repository-batch
    desc: Obfuscated daemon writes token-bearing batches to GitHub
    crit: hostile
    conf: 0.98
    attack: T1048,T1550.001
    all:
      - id: micro-behaviors/communications/http/auth::auth-token-buffer-batch
      - id: micro-behaviors/communications/http/services/github::github-create-or-update-file-contents
      - id: micro-behaviors/communications/http/auth::token-conditional-commit-message
      - id: micro-behaviors/process/create/spawn::daemon-guarded-detached-child
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
