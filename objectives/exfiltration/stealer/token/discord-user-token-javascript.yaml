# Discord user-token theft via webhook POST (selfbot/voice “modules”).
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

composite_rules:
  - id: discord-user-token-webhook-exfil
    desc: Posts Discord user tokens to a webhook
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/discord/token::discord-user-token-config-field
      - id: micro-behaviors/communications/http/post::axios-post-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-configuration
      - id: objectives/exfiltration/messaging/discord::discord-token-webhook-payload-field
