# Roblox Cookie Exfiltration
# Roblox .ROBLOSECURITY session-cookie theft with Discord webhook exfiltration.
# Store access and cookie-format parsing are separate signals: a developer
# helper may parse a Roblox cookie without stealing it.
# ATT&CK: T1539 (Steal Web Session Cookie) + T1567 (Exfil over Web Service)
defaults:
  platforms: [windows, macos]
  for: [python, pyc, scripts, binaries]
  attack: "T1567"
composite_rules:
  - id: roblox-cookie-source
    for: [pyc, shell, batch, python, javascript, powershell]
    desc: Accesses a Roblox session-cookie store
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/data/parse/analysis::roblox-studio-cookie-parser
    any:
      - id: micro-behaviors/os/registry/keys::roblox-studio-registry-key
      - id: micro-behaviors/fs/path/cookie::roblox-cookie-file
  - id: roblox-cookie-stealer
    for: [pyc, shell, batch, python, javascript, powershell]
    desc: Steals Roblox cookies and exfiltrates via Discord
    crit: hostile
    conf: 0.97
    attack: T1539
    # The Discord transport legs are referenced directly. They used to sit
    # behind a standalone `exfil-indicators` composite ("Indicators of Discord
    # exfiltration", suspicious) that re-reported discord-exfiltration as a
    # second finding under stealer/token on every Discord-webhook script,
    # Roblox or not (a PowerShell clipboard stealer, 2026-09).
    all:
      - id: roblox-cookie-source
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-split
      - id: objectives/exfiltration/messaging/webhook::discord-exfiltration
  - id: roblox-cookie-upload-exfiltration
    desc: Roblox cookie file uploaded to a file host
    crit: hostile
    conf: 0.96
    attack: "T1539,T1567"
    all:
      - id: micro-behaviors/fs/path/cookie::roblox-cookie-file
      - id: micro-behaviors/communications/http/services/file-hosting::tmpfiles-org
    unless:
      - id: well-known/tool/detection/
