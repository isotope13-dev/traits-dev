defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

composite_rules:
  - id: python-discord-webhook-oauth-token-stealer
    desc: Python Discord OAuth token webhook exfil
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/oauth::refresh-token-snake-assign
      - id: micro-behaviors/communications/http/webhook::python-webhook-post
      - id: objectives/exfiltration/messaging/discord::python-discord-token-webhook-url
  - id: python-discord-harvested-token-json-store
    desc: Python Discord bot stores harvested token JSON
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/credentials::python-discord-token-json-store
      - id: objectives/exfiltration/messaging/discord::python-discord-token-webhook-url
      - id: micro-behaviors/communications/http/webhook::python-webhook-post
  # A package that reads a browser's Local Storage / token store and ships it to
  # a Discord webhook. Discord's own desktop token, and session cookies for
  # every logged-in site, live in Chromium's LevelDB Local Storage; a module
  # that opens that store and posts to a hardcoded discord.com/api/webhooks/
  # endpoint is a token/cookie stealer. Neither leg alone is a verdict -- apps
  # read their own Local Storage, and Discord webhooks have legitimate
  # notification uses -- but reading the browser credential store AND owning a
  # no-auth Discord exfil endpoint together has no benign reading. Generalizes
  # to the whole Discord-token-stealer family, whichever module the beacon sits
  # in (aliased imports and all -- the URL and the store path are text, not
  # symbols).
  - id: python-browser-store-discord-webhook-stealer
    desc: Browser store read exfiltrated to Discord webhook
    crit: hostile
    conf: 0.96
    attack: T1539,T1552.001,T1041,T1567.002
    scope: archive
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
    any:
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/fs/path/app-data::local-storage-ref
  - id: python-discord-token-regex-webhook
    desc: Discord token regex posted to webhook
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1041
    scope: file
    all:
      - id: objectives/collection/messaging/app::discord-token-regex-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
