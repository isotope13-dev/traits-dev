defaults:
  platforms: [unix, windows]
  for:
    - java
    - class
    - java_class
    - jar
    - zip
  mbc: E1041

composite_rules:
  - id: minecraft-token-http-body-exfil
    desc: Minecraft token access paired with raw socket request write
    crit: suspicious
    conf: 0.98
    attack: T1041
    for: [jar, zip, class]
    all:
      - type: trait
        id: objectives/credential-access/gaming/minecraft::minecraft-session-token-access
      - type: trait
        id: micro-behaviors/communications/socket/send::java-raw-socket-client-write
  - id: minecraft-token-encrypted-http-exfil-dropper
    desc: Minecraft token access with encrypted dropper and HTTP request-body write
    crit: hostile
    conf: 0.98
    attack: "T1528, T1027, T1041"
    for: [jar, zip, class]
    all:
      - type: trait
        id: objectives/credential-access/gaming/minecraft::minecraft-session-token-access
      - type: trait
        id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - type: trait
        id: micro-behaviors/crypto/library/provider::secretkeyspec
      - type: trait
        id: micro-behaviors/fs/write/file/handle::jvm-fileoutputstream-bytecode
    any:
      - type: trait
        id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - type: trait
        id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode
      - type: trait
        id: minecraft-token-http-body-exfil
  - id: minecraft-session-http-post-exfil
    desc: Minecraft session token sent in Java HTTP POST
    crit: hostile
    conf: 0.99
    attack: T1041,T1528
    for: [class, java_class]
    # Obfuscated sibling restates this POST with the int-array decrypt leg;
    # suppress the clear variant so the same class does not report twice.
    unless:
      - type: trait
        id: minecraft-session-obfuscated-http-post
    all:
      - type: trait
        id: objectives/credential-access/gaming/minecraft::minecraft-session-token-access
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
  # NOTE: there is no archive-level "...but inside a Fabric mod" restatement of
  # the rule above. Wrapping a firing hostile in `fabric.mod.json exists` adds
  # no new objective and reports the same POST twice. The mod-trojanization
  # angle -- a branded mod whose manifest gained a second, foreign entrypoint --
  # is its own finding in objectives/supply-chain/trojanized/app/game-mod/.
  - id: minecraft-profile-json-post-exfil
    desc: Minecraft account profile JSON sent in Java HTTP POST
    crit: hostile
    conf: 0.99
    attack: T1041,T1528
    for: [class, java_class]
    all:
      - type: trait
        id: objectives/credential-access/gaming/minecraft::minecraft-session-token-access
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
    any:
      - type: trait
        id: objectives/credential-access/gaming/minecraft::minecraft-profile-json-fields
      - type: trait
        id: objectives/credential-access/gaming/minecraft::minecraft-access-token-json-fields
  - id: minecraft-session-obfuscated-http-post
    desc: Minecraft session HTTP POST with int-array string decrypt
    crit: hostile
    conf: 0.98
    attack: T1041,T1528,T1027
    for: [class, java_class]
    all:
      - type: trait
        id: objectives/credential-access/gaming/minecraft::minecraft-session-token-access
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - type: trait
        id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
      - type: trait
        id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
  - id: minecraft-reflective-obfuscated-http-post
    desc: Reflectively collected Minecraft session sent through obfuscated Apache HTTP
    crit: hostile
    conf: 0.99
    attack: T1041,T1528,T1027
    for: [jar, zip, class]
    scope: archive
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: objectives/credential-access/gaming/minecraft::minecraft-named-client-ref
      - id: objectives/credential-access/gaming/minecraft::minecraft-session-getter-sess
      - id: objectives/credential-access/gaming/minecraft::minecraft-session-getter-tok
      - id: objectives/credential-access/gaming/minecraft::minecraft-session-getter-id
      - id: objectives/credential-access/gaming/minecraft::minecraft-gson-profile-builder
      - id: micro-behaviors/data/source/dynamic/reflect::java-class-forname-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-class-getmethod-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::set-accessible-reference
      - id: micro-behaviors/data/string/mutate::java-junk-padded-string-cleanup
      - id: micro-behaviors/data/string/mutate::java-obfuscated-httpclient-class-fragment
      - id: micro-behaviors/process/thread/lifecycle::jvm-thread-start-bytecode
