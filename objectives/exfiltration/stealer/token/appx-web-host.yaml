# A custom AppX host using Microsoft's public Office client ID and the legacy
# OOB callback receives the authorization response inside attacker-controlled
# JavaScript. Forwarding that broker response completes the token-theft chain.
defaults:
  platforms: [windows]
  for: [powershell, javascript, typescript, html, csharp, cpp]
  attack: T1528
  conf: 0.98

composite_rules:
  - id: winrt-first-party-oob-response-forwarding
    desc: First-party OOB OAuth response form forwarding
    crit: hostile
    for: [powershell, javascript, html]
    all:
      - id: micro-behaviors/communications/http/web-auth-broker::oauth-native-oob-redirect-uri
      - id: micro-behaviors/communications/http/oauth::office-desktop-client-id
      - id: micro-behaviors/communications/http/web-auth-broker::web-auth-broker-response-data-read
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/data/encode/url::uri-encoded-response-data-form-body

  - id: sideloaded-appx-oauth-response-forwarding
    desc: Remote AppX registration with OAuth forwarding
    crit: hostile
    conf: 0.995
    for: [powershell]
    all:
      - id: metadata/permission/runtime::appx-http-content-winrt-all
      - id: micro-behaviors/os/package-manager/management::appx-package-register-command
      - id: winrt-first-party-oob-response-forwarding
