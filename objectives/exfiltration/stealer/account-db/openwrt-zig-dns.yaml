defaults:
  platforms: [openwrt]
  for: [zig]
  attack: T1048.003

composite_rules:
  - id: openwrt-zig-account-dns-exfil
    desc: OpenWrt Zig account DNS exfil
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/exfiltration/dns/tunnel::zig-hex-dns-query-builder
      - id: objectives/exfiltration/dns/tunnel::zig-dns-base-constant
      - id: micro-behaviors/communications/ip/resolve::zig-getaddrinfo
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
