defaults:
  platforms: [freebsd, netbsd, unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-nc-password-recon
    desc: Netcat shell with password file recon
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/reverse-shell/netcat::nc-exec-sh
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: micro-behaviors/communications/http/url/api-path::swift-messages-endpoint
