defaults:
  platforms: [netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: native-bsd-credential-http-exfil
    desc: Native BSD credential HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/credential::native-bsd-credential-paths
      - id: objectives/exfiltration/http/collect::native-collect-http-post
  - id: native-bsd-credential-octet-exfil
    for: [c]
    desc: Native BSD credential octet exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/credential::native-bsd-credential-paths
      - id: micro-behaviors/communications/http/post::native-post-request-line
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header
