defaults:
  platforms: [freebsd, netbsd, unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-host-release-post
    desc: Posts OS release and account paths
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/os/identity::linux-release-file-reference
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
