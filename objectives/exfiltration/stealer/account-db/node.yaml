defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-shadow-discovery-post
    desc: Node posts shadow discovery data
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'postC2\(`discovery:[\s\S]{0,260}info\.shadow'
composite_rules:
  - id: node-passwd-shadow-read
    desc: Node reads passwd and shadow files
    crit: suspicious
    unless:
      - id: well-known/tool/offensive/pentestkit::local-storage-panel
      - id: well-known/app/system/freddie::benign-archive-context
      - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
    conf: 0.92
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/config/accounts::node-passwd-path-reference
      - id: micro-behaviors/fs/path/config/accounts::node-shadow-path-reference
      - id: micro-behaviors/fs/read/file/full::read-node

  - id: node-passwd-shadow-http-exfil
    desc: Node passwd shadow HTTP exfil
    crit: hostile
    unless:
      - id: well-known/tool/offensive/pentestkit/
    conf: 0.98
    all:
      - id: node-passwd-shadow-read
    any:
      - id: objectives/exfiltration/http/report::node-state-exfil-post
      - id: node-shadow-discovery-post
      - id: micro-behaviors/communications/http/post::post-request-line
  - id: node-passwd-shadow-curl-exfil
    desc: Node passwd shadow curl exfil
    crit: hostile
    conf: 0.98
    all:
      - id: node-passwd-shadow-read
      - id: objectives/exfiltration/stealer/file::js-shell-curl-file-exfil
