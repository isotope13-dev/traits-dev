defaults:
  platforms: [unix]
  for: [java, kotlin, class, java_class, jar]
  attack: T1041

composite_rules:
  - id: jvm-unix-secret-http-exfil
    desc: JVM Unix secret HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
    any:
      - id: objectives/collection/archive/stage::jvm-sensitive-dump-path
      - id: objectives/exfiltration/http/collect::jvm-collect-octet-post
  - id: jvm-hex-unix-account-ftp-exfil
    desc: JVM hex account FTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/accounts::jvm-hex-unix-account-paths
      - id: objectives/exfiltration/ftp::kotlin-ftp-hex-pasv-stor
  - id: jvm-bytecode-account-ftp-exfil
    desc: JVM bytecode account FTP exfil
    crit: hostile
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: micro-behaviors/fs/path/config/accounts::jvm-hex-unix-account-paths-bytes
      - id: objectives/exfiltration/ftp::kotlin-ftp-pasv-stor-hex
