defaults:
  platforms: [routeros, appliance, unix]
  for: [lua]
  attack: T1041



composite_rules:
  - id: lua-unix-secret-path-set
    desc: Lua Unix secret path set
    crit: suspicious
    conf: 0.92
    any:
      - id: micro-behaviors/os/privilege/paths::etc-shadow
      - id: objectives/credential-access/files/config::ssh-private-key-path
      - id: micro-behaviors/fs/path/personal::bash-history-artifact
    needs: 2

  - id: lua-unix-secret-http-exfil
    desc: Lua Unix secret HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: lua-unix-secret-path-set
      - id: micro-behaviors/communications/http/curl::lua-curl-data-post
      - id: objectives/command-and-control/backdoor/tasking/poll::lua-http-result-post-path
