# The source and encoded stdout expression must share one executable line.
# No branch, job, helper filename, campaign name or destination is required.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: hostile
  conf: 0.98
  attack: T1552,T1567

composite_rules:
  - id: gha-ruby-encoded-secrets-log
    desc: Ruby logs encoded complete Actions secrets
    near_lines: 0
    # The stdout matcher binds the encoder's argument to an Actions expression.
    # Require the complete-secrets source on that same line.
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: micro-behaviors/process/io/stdout::ruby-encoded-actions-expression-output
  - id: gha-shell-encoded-secrets-log
    desc: Shell logs encoded complete Actions secrets
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: micro-behaviors/os/env/ci-credentials::gha-shell-secrets-output-source
    any:
      - id: micro-behaviors/data/encode/base32::gha-shell-base32-stdout
      - id: micro-behaviors/data/encode/base64::gha-shell-base64-stdout
      - id: micro-behaviors/data/encode/hex::gha-shell-hex-stdout
      - id: micro-behaviors/data/encode/rot13::gha-shell-rot13-stdout
      - id: micro-behaviors/data/string/reverse::gha-shell-reversed-stdout

  - id: gha-python-encoded-secrets-log
    desc: Python logs encoded complete Actions secrets
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: micro-behaviors/os/env/ci-credentials::gha-python-secrets-encoder-input
    any:
      - id: micro-behaviors/data/encode/base32::gha-python-base32-stdout
      - id: micro-behaviors/data/encode/base64::gha-python-base64-stdout

  - id: gha-node-encoded-secrets-log
    desc: Node logs encoded complete Actions secrets
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: micro-behaviors/os/env/ci-credentials::gha-node-secrets-buffer-input
      - id: micro-behaviors/data/encode/base64::gha-node-base64-stdout

  - id: gha-powershell-encoded-secrets-log
    desc: Powershell logs encoded complete Actions secrets
    near_lines: 0
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: micro-behaviors/os/env/ci-credentials::gha-powershell-secrets-byte-input
      - id: micro-behaviors/data/encode/base64::to-base64-string
    unless:
      - id: micro-behaviors/fs/write/file/redirect::gha-powershell-output-file-redirect
