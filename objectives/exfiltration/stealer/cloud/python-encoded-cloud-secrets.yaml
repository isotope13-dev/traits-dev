defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: "T1041"

composite_rules:
- id: encoded-cloud-secret-collector
  desc: Encoded cloud secret collector
  crit: suspicious
  conf: 0.96
  platforms: [unix]
  needs: 2
  any:
  - id: objectives/credential-access/cloud/container::encoded-aws-secret-collector
  - id: objectives/credential-access/cloud/container::encoded-kubernetes-secret-collector
  - id: objectives/credential-access/files/config::encoded-package-secret-collector
- id: encoded-python-cloud-secret-exfil
  desc: Encoded Python cloud secret exfiltration
  crit: hostile
  conf: 0.98
  platforms: [unix]
  all:
  - id: objectives/exfiltration/http/encoded::encoded-curl-archive-upload
  - id: encoded-cloud-secret-collector
  any:
  - id: objectives/anti-static/obfuscation/payload/loader::py-base64-exec-inline
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: metadata/file/line::single-long-line-outlier
- id: base64-python-cloud-secret-exfil
  desc: Base64 cloud secret upload
  crit: hostile
  conf: 0.98
  platforms: [unix]
  all:
  - id: objectives/exfiltration/http/encoded::b64-curl-data-binary-upload
  - id: objectives/anti-static/obfuscation/payload/loader::py-base64-exec-inline-any
  needs: 2
  any:
  - id: objectives/credential-access/cloud/container::b64-aws-container-credentials
  - id: objectives/credential-access/cloud/container::b64-kubernetes-serviceaccount
  - id: b64-package-credential-files
- id: b64-package-credential-files
  desc: Base64 package credential files
  crit: suspicious
  conf: 0.93
  platforms: [unix]
  any:
  - id: objectives/credential-access/files/config::b64-package-credential-files--rx-1
  - id: objectives/credential-access/files/config::b64-package-credential-files--rx-2
  - id: objectives/credential-access/files/config::b64-package-credential-files--rx-3
  - id: objectives/credential-access/files/config::b64-package-credential-files--rx-4
