defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  # HTTP is the channel; the matched source is the AWS credential file.
  - id: aws-shared-credentials-http-exfil
    desc: AWS shared credentials enter HTTP payload
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/credentials::python-aws-file-http-data
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
