# NPM Token Exfiltration
# NPM authentication token theft with network exfiltration
# ATT&CK: T1552.001 (Unsecured Credentials: Credentials In Files) + T1041
defaults:
  for: [package.json]
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"
composite_rules:
  - id: npm-aws-ecs-credential-http-exfil
    desc: npm lifecycle hook sends AWS ECS credentials
    conf: 0.995
    attack: T1552.005,T1041,T1195.002
    mbc: E1041
    all:
      - id: objectives/credential-access/cloud/token/metadata::npm-lifecycle-aws-ecs-credential-access
      - id: objectives/supply-chain/recon-exfil/install-hook::npm-lifecycle-aws-ecs-node-credential-post
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture/

  - id: npm-aws-ecs-credential-ngrok-exfil
    desc: npm lifecycle hook curls AWS ECS credentials to ngrok
    conf: 0.995
    attack: T1552.005,T1041,T1567.002,T1195.002
    mbc: E1041
    all:
      - id: objectives/credential-access/cloud/token/metadata::npm-lifecycle-aws-ecs-credential-access
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
      - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture/

  - id: npm-ecs-container-metadata-ngrok-exfil
    desc: npm postinstall sends ECS container metadata to ngrok
    conf: 0.995
    attack: T1195.002,T1552.005,T1041,T1567.002
    all:
      - id: objectives/supply-chain/recon-exfil/install-hook::npm-postinstall-ecs-container-metadata-url
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
      - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture/
