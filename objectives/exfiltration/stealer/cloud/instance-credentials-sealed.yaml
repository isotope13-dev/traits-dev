# privcollect (LiteLLM 1.107.0 wheels, Oct 2026): one routine queries AWS
# IMDS role credentials, ECS task credentials, GCP service-account tokens and
# Azure IMDS, then seals the collection to an embedded RSA public key
# (cryptography OAEP, or an `openssl pkeyutl -encrypt` argv fallback) before
# uploading it. Cloud SDKs and agents fetch instance credentials for their own
# calls; they do not encrypt them to a key the operator does not hold.
defaults:
  platforms: [unix, windows]
  attack: T1552.005,T1573.002

composite_rules:
  - id: multi-cloud-instance-credentials-sealed-to-rsa
    desc: Cloud metadata credentials sealed to embedded RSA
    crit: hostile
    conf: 0.95
    for: [python, javascript, shell, php]
    all:
      - id: micro-behaviors/communications/http/services/cloud::multi-cloud-credential-endpoint-context
      - id: micro-behaviors/crypto/key/representation::pem-public-key-header
    any:
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-oaep-padding
      - id: micro-behaviors/crypto/asymmetric/rsa::pycryptodome-rsa-oaep-public-encrypt
      - id: micro-behaviors/crypto/asymmetric/rsa::node-crypto-public-encrypt
      - id: micro-behaviors/crypto/asymmetric/rsa::openssl-pkeyutl-encrypt
      - id: micro-behaviors/crypto/asymmetric/rsa::openssl-pkeyutl-encrypt-argv
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
