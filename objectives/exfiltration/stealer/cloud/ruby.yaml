defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1041

composite_rules:
  - id: ruby-cloud-credential-exfil
    desc: Ruby cloud credential exfil
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/cloud/local-credentials::ruby-cloud-credential-path-list
      - id: objectives/credential-access/cloud/local-credentials::ruby-orchestration-credential-paths
      - id: objectives/exfiltration/http/report::ruby-json-exfil-post
    any:
      - id: objectives/command-and-control/backdoor/tasking/command-polling::ruby-c2-command-poll
      - id: objectives/credential-access/files/config::login-secret-file-paths
      - id: metadata/file/string/cloud::gcp-default-credentials
