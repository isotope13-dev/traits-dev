defaults:
  platforms: [unix]
  for: [python]
  crit: hostile
  attack: T1552.007,T1041
composite_rules:
  - id: python-serviceaccount-token-oob-upload
    desc: Kubernetes token uploaded to OOB collector
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/request/credentials::python-serviceaccount-token-oob-request
      - id: micro-behaviors/communications/http/upload::python-urllib-file-upload
