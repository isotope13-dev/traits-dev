defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-cloud-credential-http-exfil
    desc: Node cloud credentials HTTP exfil
    crit: hostile
    conf: 0.98
    attack: "T1552.005, T1528, T1041"
    mbc: "E1552, E1041"
    all:
      - id: micro-behaviors/os/security/auth/cloud::node-cloud-credential-source-reference
      - id: objectives/exfiltration/stealer/dev-secret::node-custom-exfil-sink
