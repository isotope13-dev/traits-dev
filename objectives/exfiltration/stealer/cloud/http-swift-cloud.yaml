defaults:
  platforms: [windows, unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-cloud-credential-http-exfil
    desc: Swift cloud credential HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/http/post::swift-urlrequest-http-body
      - id: micro-behaviors/communications/http/post::swift-urlsession-data-task
      - id: micro-behaviors/data/serialize/json::swift-jsonserialization-data
    needs: 2
    any:
      - id: objectives/credential-access/env/secrets/cloud-access::swift-cloud-env-secret-harvest
      - id: objectives/credential-access/cloud/local-credentials::swift-cloud-file-secret-harvest
      - id: objectives/discovery/cloud/metadata::swift-cloud-metadata-harvest

  - id: swift-cloud-message-http-exfil
    desc: Swift cloud message HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: swift-cloud-credential-http-exfil
    any:
      - id: micro-behaviors/communications/http/url/api-path::swift-publish-endpoint
      - id: micro-behaviors/communications/http/url/api-path::swift-messages-endpoint

  - id: swift-cloud-path-collect-upload
    desc: Uploads harvested cloud files
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/cloud/local-credentials::swift-cloud-file-secret-harvest
      - id: objectives/exfiltration/http/upload::swift-http-collect-upload
      - id: objectives/credential-access/cloud/local-credentials::swift-cloud-sensitive-paths
  - id: swift-imds-env-secret-post
    desc: Posts IMDS and env cloud secrets
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/env/secrets/cloud-access::swift-cloud-env-secret-harvest
      - id: objectives/discovery/cloud/metadata::swift-aws-imds-iam-query
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method

  - id: swift-kube-container-message-exfil
    desc: Reads kube config and messages endpoint
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/cloud/local-credentials::swift-kube-config-read
      - id: objectives/credential-access/cloud/local-credentials::swift-container-config-read
      - id: micro-behaviors/communications/http/url/api-path::swift-messages-endpoint
