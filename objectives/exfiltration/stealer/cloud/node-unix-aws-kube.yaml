defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-aws-credential-file-read
    desc: Node reads AWS credential file
    crit: suspicious
    conf: 0.94
    any:
      - id: objectives/credential-access/cloud/aws-token::node-aws-credential-readfile
      - id: objectives/credential-access/cloud/aws-token::node-aws-credential-open
      - id: objectives/credential-access/cloud/aws-token::node-aws-credential-stream
  - id: node-keychain-aws-exfil
    desc: Node keychain AWS exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::node-exfil-endpoint
    any:
      - id: micro-behaviors/os/security/keychain::macos-keychain-dump-command
      - id: node-aws-credential-file-read
    needs: 1
  - id: node-multi-credential-collection-webhook
    desc: Node collects cloud and SSH credentials for webhook exfiltration
    crit: hostile
    conf: 0.98
    all:
      - id: node-aws-credential-file-read
      - id: objectives/credential-access/cloud/token/files::azure-config
      - id: objectives/credential-access/cloud/container::node-kubeconfig-readfile
      - id: objectives/credential-access/ssh/key::node-ssh-private-key-command
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
