defaults:
  platforms: [unix, appliance]
  for: [rust, elf]
  attack: T1041

composite_rules:
  - id: rust-cloud-credential-http-exfil
    desc: Rust cloud credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/cloud/local-credentials::rust-cloud-credential-file-set
      - id: objectives/exfiltration/http/upload::raw-exfil-post-path
    any:
      - id: objectives/credential-access/cloud/token/metadata::rust-cloud-metadata-paths
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
