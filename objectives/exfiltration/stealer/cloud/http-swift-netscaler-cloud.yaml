defaults:
  platforms: [netscaler, appliance, unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-cloud-secret-http-exfil
    desc: Swift cloud secret HTTP exfil
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/exfiltration/http/collect::rust-exfil-path-marker
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: objectives/credential-access/cloud/local-credentials::swift-cloud-sensitive-paths
