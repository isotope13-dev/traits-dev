defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-ecs-secret-tunnel-post-cooccurrence
    desc: ECS credential fetch and tunnel POST co-occur
    crit: suspicious
    conf: 0.98
    attack: "T1552.005,T1041"
    all:
      - id: micro-behaviors/communications/proxy/tunnel::trycloudflare-domain
      - id: micro-behaviors/communications/http/post::request-post-option
      - id: micro-behaviors/os/security/auth/cloud::node-aws-container-metadata-ip
      - id: micro-behaviors/data/serialize/schema-credential::iam-secret-payload-field

      - id: micro-behaviors/communications/http/get::node-ecs-credential-get
      - id: micro-behaviors/communications/http/request/body::request-end-body-call
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call
