# Developer-credential sweep + exfiltration (Node.js).
#
# A stealer that harvests secrets from multiple DISTINCT credential stores a
# developer workstation holds — cloud provider configs (~/.aws, ~/.gcp,
# ~/.azure), SSH private keys, dev-tool tokens (.env/.npmrc/.netrc), browser
# login databases, wallet files — and ships them off-host with an encoded or
# error-suppressed HTTP upload.
#
# Behavior over IOCs: no filename, host, or token literal is keyed. The signal
# is breadth-of-targeting (>=2 unrelated credential categories) paired with a
# concrete file-data upload, encoded upload, or error-suppressed upload. The
# existing multi-app aggregate counts app sessions
# (wallets/discord/steam) but not cloud-config or dev-token theft, so a
# developer-targeting supply-chain stealer slipped through; this covers it.
#
# FP boundary: a devops tool legitimately reading its own ~/.aws + ~/.ssh and
# POSTing to an API is excluded because the exfil leg requires a stealer tell —
# base64-of-file-bytes (node-encode-exfil), silenced network errors
# (node-stealthy-exfil), or a sensitive-file-to-request-body chain — not a
# plain POST.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1555
  mbc: E1552
composite_rules:
  - id: node-developer-credential-sweep
    desc: Harvests multiple credential stores and exfiltrates
    crit: hostile
    conf: 0.94
    attack: "T1555, T1552.001, T1041"
    mbc: "E1552, E1041"
    near_bytes: 16384
    all:
      - id: micro-behaviors/fs/path/credential::node-credential-store-targets
    any:
      - id: objectives/exfiltration/http/upload::node-encode-exfil
      - id: objectives/exfiltration/http/upload::node-stealthy-exfil
      - id: objectives/exfiltration/sensitive-data::js-sensitive-file-exfiltration
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-file-exfil
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      - id: micro-behaviors/os/package-manager/installer-script::package-manager
      - id: micro-behaviors/os/package-manager/installer-script::ci-cd-pipeline
  # Fake "SDK telemetry" modules read ~/.npmrc, kubeconfig, .env and similar
  # stores then JSON-POST to a hardcoded IP. Direct-IP plus an actual
  # readFileSync is the stealer tell that a vendor API client does not have.
  - id: node-developer-store-direct-ip-exfil
    desc: Reads developer credential stores and POSTs to a direct-IP HTTP endpoint
    crit: hostile
    conf: 0.97
    attack: "T1555,T1552.001,T1041"
    mbc: "E1552,E1041"
    near_bytes: 16384
    all:
      - id: micro-behaviors/fs/path/credential::node-credential-store-targets
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: objectives/command-and-control/channel/http/transport::direct-ip-http-channel
      - id: micro-behaviors/communications/http/request/client::http-post-json
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
