# These are file-local workflow observations. They do not bind an arbitrary
# upload path to the dump path, so keep the combined finding suspicious and
# describe co-occurrence rather than asserting a proven transfer.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
composite_rules:
  - id: gha-secrets-encoded-environment-artifact
    desc: CI secrets, encoded dump, and artifact upload
    crit: suspicious
    conf: 0.96
    attack: T1552.001,T1560.001
    all:
      - id: objectives/credential-access/env/secrets/cicd::complete-secrets-json-expression
      - id: micro-behaviors/os/env/dump::gha-base64-environment-file-pipeline
      - id: metadata/build/ci/step::actions-upload-artifact
