defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-wallet-secret-file-target-list
    desc: Node wallet secret file target list
    crit: suspicious
    conf: 0.94
    needs: 3
    any:
      - id: objectives/credential-access/wallet/keywords::node-wallet-json-target
      - id: objectives/credential-access/wallet/keywords::node-keypair-json-target
      - id: objectives/credential-access/wallet/keywords::node-mnemonic-file-target
      - id: micro-behaviors/fs/path/private-key::keystore-suffix
  - id: node-dev-secret-regex-list
    desc: Node developer secret regex list
    crit: suspicious
    conf: 0.94
    needs: 3
    near_bytes: 8192
    any:
      - id: micro-behaviors/crypto/asymmetric/key::private-key-identifier
      - id: objectives/credential-access/wallet/keywords::node-wallet-key-token
      - id: objectives/credential-access/wallet/keywords::node-mnemonic-token
      - id: objectives/credential-access/wallet/keywords::node-seed-phrase-token
      - id: micro-behaviors/os/package-manager/config::node-auth-token-token
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-var
  - id: node-dev-secret-source-cluster
    desc: Node developer secret source cluster
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: node-wallet-secret-file-target-list
      - id: node-dev-secret-regex-list
      - id: objectives/credential-access/dump/output-file::node-dev-secret-report-file
  - id: node-dev-secrets-clipboard-history-exfil
    desc: Node exfils developer secrets clipboard and history
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1552.003,T1115,T1041"
    mbc: "E1552,E1115,E1041"
    all:
      - id: micro-behaviors/communications/http/upload::node-local-file-formdata-stream
      - id: node-dev-secret-source-cluster
    any:
      - id: micro-behaviors/os/clipboard/write::node-cli-clipboard-readwrite
      - id: objectives/exfiltration/stealer/file::node-shell-history-exfiltration
  - id: node-developer-credential-stealer
    desc: Node collects developer credentials and clipboard
    crit: hostile
    conf: 0.97
    attack: "T1552.001,T1552.003,T1115"
    mbc: "E1552,E1115"
    all:
      - id: node-dev-secret-source-cluster
    any:
      - id: objectives/exfiltration/stealer/file::node-shell-history-exfiltration
      - id: micro-behaviors/os/clipboard/write::node-cli-clipboard-readwrite
  - id: node-developer-secret-multipart-exfil-archive
    for: [javascript, typescript, npm]
    desc: Package archive combines developer-secret collection with file upload
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1552.001,T1041"
    scope: archive
    all:
      - id: node-dev-secret-source-cluster
      - id: micro-behaviors/communications/http/upload::node-local-file-formdata-stream
