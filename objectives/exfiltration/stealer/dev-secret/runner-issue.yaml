# The source is a runner secret-record filter, with an issue POST as sink.
# This is an attempted theft chain; regex bugs or missing sudo/API privileges
# can prevent runtime success. Neither the Gist ID nor member name is required.
defaults:
  platforms: [unix, windows]
  for: [shell, javascript]
composite_rules:
  - id: runner-secret-filter-issue-post
    desc: Runner-secret filtering with GitHub issue POST
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1567
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin::curl-json-content-sudo-python
      - id: objectives/credential-access/dump/process::github-runner-secret-record-marker
      - id: micro-behaviors/data/parse/regex::grep-matching-substrings
      - id: micro-behaviors/os/env/secret-name::github-token-name-reference
      - id: micro-behaviors/communications/http/services/github::github-issues-api
      - id: micro-behaviors/communications/http/curl::curl-post-flag
