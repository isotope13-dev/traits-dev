defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
  - id: python-encoded-report-post
    desc: Encoded report posted over HTTP
    crit: notable
    conf: 0.96
    all:
      - id: objectives/exfiltration/http/encoded::python-encoded-sensitive-report
      - id: micro-behaviors/communications/http/lib/requests::requests-post

  - id: python-credential-collection-http-exfil
    desc: Credential sweep with encoded HTTP exfiltration
    crit: hostile
    conf: 0.99
    attack: T1005,T1552.001,T1041
    mbc: B0023
    all:
      - id: objectives/credential-access/cloud/devops-bundle::developer-credential-sweep
      - id: python-encoded-report-post
      - id: micro-behaviors/data/encode/base64::b64encode-call

  - id: python-credential-sweep-httpclient-exfil
    desc: Python credential sweep with encoded HTTP POST
    crit: hostile
    conf: 0.99
    attack: T1005,T1552.001,T1041
    mbc: B0023
    all:
      - id: objectives/credential-access/cloud/devops-bundle::developer-credential-sweep
      - id: micro-behaviors/data/encode/base64::base64-encoding
      - id: micro-behaviors/communications/http/post::python-httpclient-post-transport
