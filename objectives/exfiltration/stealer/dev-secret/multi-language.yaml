# Simple developer-credential stealers: read cloud/SSH/registry/CI secrets
# and ship them over the network. Thin cross-language composite for the
# classic supply-chain shapes (postinstall Discord webhook, Telegram bot
# drop, Slack hooks, SMTP, libcurl POSTFIELDS, etc.).
#
# Exfil legs stay component/notable alone — only the hostile composite
# (secret source + exfil, near each other) is an intent signal.
defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  attack: "T1552.001,T1041"
  mbc: E1552

composite_rules:
  - id: developer-secret-named-env-access
    desc: Reads a named developer credential from the environment
    crit: component
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/os/env/vcs::github-token-name-reference
    any:
      - id: micro-behaviors/os/env/read::os-getenv
      - id: micro-behaviors/os/env/read::std-env-var

  - id: developer-secret-env-access
    desc: Reads a developer credential from the environment
    crit: component
    conf: 0.92
    any:
      - id: micro-behaviors/os/env/package-manager::npm-token-name-ref
      - id: objectives/credential-access/env/secrets/cloud-access::aws-secret-env-access
      - id: objectives/credential-access/env/secrets/source-control::node-git-token
      - id: objectives/credential-access/env/secrets/source-control::github-token
      - id: objectives/credential-access/env/secrets/cicd::sh-github-token
      - id: micro-behaviors/os/env/vcs::python-github-token-env-read
      - id: developer-secret-named-env-access
      - id: micro-behaviors/os/env/package-manager::node-registry-token-env-read
      - id: objectives/credential-access/env/secrets/cloud-access::env-aws-secret
      - id: objectives/credential-access/env/secrets/cloud-access::env-aws-access-key
      - id: micro-behaviors/os/env/pipeline::shell-env-cloud-prefix-filter
      - id: objectives/credential-access/cloud/token/files::go-aws-secret-env-var

  - id: developer-secret-source
    desc: Reads a developer credential source
    crit: component
    conf: 0.92
    any:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: developer-secret-env-access
      - id: objectives/credential-access/env/secrets/package-registry::cargo-credential-source-read

  - id: simple-developer-secret-stealer
    desc: Developer credential target with network exfiltration
    crit: hostile
    conf: 0.95
    near_lines: 20
    all:
      - id: developer-secret-source
    any:
      # Structured shell-call traits distinguish an invoked curl command from
      # quoted examples and deny-list fixtures in general-purpose source.
      - id: micro-behaviors/communications/http/curl::curl-short-data-option
      - id: micro-behaviors/communications/http/curl::curl-data-option
      - id: micro-behaviors/communications/http/upload::curl-upload
      - id: micro-behaviors/communications/http/upload::curl-data-binary
      - id: micro-behaviors/communications/socket/netcat::nc-pipe
      - id: micro-behaviors/communications/email/send/smtp::python-smtp-send-exfil
      - id: micro-behaviors/communications/http/request/verb::https-post-option-source
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/credentials::python-aws-file-http-data
      - id: micro-behaviors/communications/http/request/credentials::python-credential-file-http-content
      - id: micro-behaviors/communications/http/request/credentials::secret-http-body-flow
      - id: micro-behaviors/communications/http/request/client::node-http-request-end-body
      - id: micro-behaviors/communications/http/request/credentials::rust-reqwest-post-exfil
      - id: micro-behaviors/communications/http/post::perl-post-http-url
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-powershell-iwr-post
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/curl::native-post-fields-option
      - id: micro-behaviors/communications/http/post::axios-post-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-post
      - id: objectives/exfiltration/messaging/webhook::telegram-bot-api
      - id: objectives/exfiltration/stealer/env::env-secret-dump-piped-to-network-client
    unless:
      # A release build may use its GitHub token to upload the artifact it just
      # created. Require the explicit GoReleaser/DMG build shape so generic
      # release scripts still receive the credential-flow finding.
      - id: metadata/build/recognized-contexts::goreleaser-dmg-artifact-upload
      - id: metadata/build/recognized-contexts::github-token-release-binary-upload
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: micro-behaviors/communications/http/services/github/
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      # A project snapshot reads .npmrc as text beside an unrelated
      # debug-port post in the same minified module.
      - id: objectives/supply-chain/credential-theft/registry::project-snapshot-npmrc-text-branch

  - id: zig-developer-secret-stealer
    desc: Zig source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [zig]
    near_lines: 20
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/http/upload::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: micro-behaviors/communications/http/services/aws::sigv4-algorithm-constant
      - id: well-known/lib/format/stacksjs-ts-cloud/
      - id: well-known/app/ai/agent-runtime/feral-ai/
      # A Travis wrapper may use GITHUB_TOKEN only to log the Travis CLI in,
      # then POST a non-secret build-request body with a Travis-issued token.
      - id: well-known/app/infrastructure/travis::authenticated-build-request-context

  - id: csharp-developer-secret-stealer
    desc: C# source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [csharp]
    near_lines: 20
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/http/upload::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: swift-developer-secret-stealer
    desc: Swift source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [swift]
    near_lines: 20
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/http/upload::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: elixir-developer-secret-stealer
    desc: Elixir source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [elixir]
    near_lines: 20
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/http/upload::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness::test-directory-path

  # A path inventory alone is not theft: backup tools, credential managers,
  # and defensive scanners may all know several of these locations.  The
  # attack shape is a broad, cross-ecosystem target list combined with an
  # actual local-file read, value encoding, and an outbound upload.  Keep the
  # source groups separate so several spellings of one store cannot satisfy
  # the breadth requirement.
  - id: multi-developer-secret-source
    desc: References three or more developer credential source groups
    crit: notable
    conf: 0.96
    needs: 3
    any:
      - id: micro-behaviors/fs/path/token::developer-credential-stores
      - id: objectives/credential-access/files/config::source-control-token-paths
      - id: objectives/credential-access/theft/multi-store::ssh-store-target
      - id: micro-behaviors/fs/path/credential::container-credentials
      - id: micro-behaviors/fs/path/token::vault-token-file

  - id: encoded-multi-developer-secret-exfil
    for: [python, javascript]
    desc: Reads, encodes, and uploads credentials from multiple developer stores
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1552.004,T1552.005,T1041"
    mbc: "E1552,E1041"
    near_bytes: 32768
    all:
      - id: multi-developer-secret-source
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: micro-behaviors/data/encode/base64::base64-encoding
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/request/verb::https-post-option-source
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::rust-reqwest-post-exfil
      - id: micro-behaviors/communications/http/post::perl-post-http-url
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-powershell-iwr-post
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/post::axios-post-source
    unless:
      - id: well-known/tool/detection/
      - id: well-known/app/security/
