# Simple developer-credential stealers: read cloud/SSH/registry/CI secrets
# and ship them over the network. Thin cross-language composite for the
# classic supply-chain shapes (postinstall Discord webhook, Telegram bot
# drop, Slack hooks, SMTP, libcurl POSTFIELDS, etc.).
#
# Source capabilities have canonical notable rules in micro-behaviors;
# reference them directly rather than duplicate their evidence here.
defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  attack: "T1552.001,T1041"
  mbc: E1552

composite_rules:
  - id: zig-developer-secret-stealer
    desc: Zig source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [zig]
    near_lines: 20
    all:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/communications/http/curl::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/communications/http/services/aws::sigv4-algorithm-constant
      - id: well-known/lib/format/stacksjs-ts-cloud/
      - id: well-known/app/ai/agent-runtime/feral-ai/
      # A Travis wrapper may use GITHUB_TOKEN only to log the Travis CLI in,
      # then POST a non-secret build-request body with a Travis-issued token.
      - id: well-known/app/infrastructure/travis::authenticated-build-request-context

  - id: csharp-developer-secret-stealer
    desc: C# source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [csharp]
    near_lines: 20
    all:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/communications/http/curl::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: "metadata/file/naming::test-directory-component"

  - id: swift-developer-secret-stealer
    desc: Swift source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [swift]
    near_lines: 20
    all:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/communications/http/curl::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: "metadata/file/naming::test-directory-component"

  - id: elixir-developer-secret-stealer
    desc: Elixir source uploads developer credentials
    crit: hostile
    conf: 0.95
    for: [elixir]
    near_lines: 20
    all:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/communications/http/curl::curl-data-binary
    unless:
      - id: well-known/tool/detection/
      - id: "metadata/file/naming::test-directory-component"

  # A path inventory alone is not theft: backup tools, credential managers,
  # and defensive scanners may all know several of these locations.  The
  # attack shape is a broad, cross-ecosystem target list combined with an
  # actual local-file read, value encoding, and an outbound upload.  Keep the
  # source groups separate so several spellings of one store cannot satisfy
  # the breadth requirement.
  - id: encoded-multi-developer-secret-exfil
    for: [python, javascript]
    desc: Reads, encodes, and uploads credentials from multiple developer stores
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1552.004,T1552.005,T1041"
    mbc: "E1552,E1041"
    near_bytes: 32768
    all:
      - id: micro-behaviors/fs/path/credential::multiple-developer-credential-path-groups
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: micro-behaviors/data/encode/base64::base64-encoding
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/request/verb::https-post-option-source
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::rust-reqwest-post-exfil
      - id: micro-behaviors/communications/http/post::perl-post-http-url
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-powershell-iwr-post
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/post::axios-post-call
    unless:
      - id: well-known/tool/detection/
      - id: well-known/app/security/
      - id: well-known/app/ai/coding-agent/

  - id: shell-developer-secret-stealer
    desc: Shell sends developer credentials to network
    for: [shell]
    crit: hostile
    conf: 0.98
    near_bytes: 200
    all:
      - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
    any:
      - id: micro-behaviors/communications/http/request/credentials::shell-secret-env-curl-body
      - id: micro-behaviors/communications/http/request/credentials::shell-sensitive-tar-curl-pipeline
      - id: micro-behaviors/communications/socket/netcat::shell-filtered-env-netcat-pipeline

  - id: shell-git-history-secret-stealer
    desc: Git credential results sent in public-IP POST
    for: [shell]
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/credentials::shell-credential-grep-result-curl-body
      - id: micro-behaviors/communications/http/url/external-ip::curl-external-ip-request
      - id: micro-behaviors/data/parse/regex::git-history-credential-pattern-scan
      - id: micro-behaviors/communications/http/curl::curl-data-binary
      - id: micro-behaviors/communications/http/curl::curl-post-flag
