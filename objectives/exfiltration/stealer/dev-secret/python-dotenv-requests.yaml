# Python packages that discover .env files then export secrets over HTTP.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1041

composite_rules:
  - id: python-dotenv-walk-discovery
    desc: Python walks tree to find dotenv files
    crit: hostile
    conf: 0.96
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/os/env/config::python-dotenv-load

  - id: python-dotenv-session-cookie-http-exfil
    desc: Python loads dotenv then GET with Cookie
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/config::python-dotenv-load
      - id: micro-behaviors/communications/http/cookies::cookie-header-construction
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/os/env/read::python-os-getenv-call

  - id: python-wheel-dotenv-session-stealer
    desc: Wheel ships dotenv walk and cookie GET
    crit: hostile
    conf: 0.97
    for: [whl, python]
    scope: archive
    all:
      - id: python-dotenv-walk-discovery
      - id: python-dotenv-session-cookie-http-exfil
