# Python packages that walk project configuration and POST a wallet secret.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001,T1041

composite_rules:
  # A helper that searches for project dotenv files, loads them, and places an
  # environment value directly into a Cookie header on requests.get exposes
  # the loaded secret to the URL supplied by its caller.
  - id: python-dotenv-env-cookie-request-exfil
    desc: Exfiltrates dotenv secret in an HTTP Cookie
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/directory/traverse::python-dotenv-walk-load-context
      - id: micro-behaviors/communications/http/cookies::python-env-value-in-cookie-header
      - id: micro-behaviors/communications/http/get::requests-get

  # Walks parent directories for a project .env, loads secrets, and POSTs one
  # field over urllib JSON (chalk-fancy / MAL-2026-3212-style wallet theft).
  - id: python-parent-dotenv-secret-urllib-exfil
    desc: Python walks parents for dotenv then POSTs env secret
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/directory/traverse::python-pathlib-parent-directory-walk
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/os/env/config::python-dotenv-into-os-environ
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/os/env/read::python-os-getenv-call
      - id: objectives/credential-access/wallet/provider::polygon-private-key-env-name
