defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1552.001
composite_rules:
# A run step that interpolates two or more distinct Actions secrets and posts
# to a hard-coded public IP. Legitimate workflows pass at most one secret per
# request (a webhook token, a bearer credential) and never address a bare IPv4
# literal; batching several unrelated CI secrets into a single curl body bound
# for a raw IP is the GhostAction harvest-and-post shape. Keying on the secret
# count plus the IP destination (not any provider name) keeps the
# `github_actions_security.yml` / `security-check.yml` / `security-audit.yml`
# variants and future rewrites visible. Pairs with gha-ip-secret-post, which
# catches the same dump when the secrets sit directly on the curl line.
- id: gha-bulk-secret-ip-exfil
  desc: Workflow posts multiple Actions secrets to a public IP
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1041
  mbc: "E1020,E1041"
  near_bytes: 1024
  all:
  - id: metadata/build/ci/secret::multiple-secret-references
  - id: metadata/build/ci/secret::run-secret-reference
  - id: micro-behaviors/communications/ip/literal::http-ip-url-text
  - id: micro-behaviors/communications/http/request/credentials::secrets-in-http-body
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish

- id: github-actions-secret-theft
  desc: GitHub Actions secret exfiltration
  crit: hostile
  conf: 0.95
  mbc: "E1020"
  all:
  - id: metadata/build/ci/secret::run-secret-reference
  any:
  - id: objectives/supply-chain/recon-exfil/secrets::github-token-exfil
  - id: objectives/supply-chain/recon-exfil/secrets::secrets-to-webhook
  - id: objectives/supply-chain/recon-exfil/secrets::discord-webhook-secrets
  - id: objectives/supply-chain/recon-exfil/secrets::secrets-tojson-http-post
  - id: objectives/supply-chain/recon-exfil/secrets::env-secret-json-to-webhook
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish

- id: gha-ip-secret-post
  desc: Actions secret body sent to public-IP HTTP host
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/request/credentials::workflow-secret-curl-public-ip
  any:
  - id: micro-behaviors/communications/http/request/credentials::secrets-in-curl
  - id: micro-behaviors/communications/http/request/credentials::secrets-in-http-body
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish
