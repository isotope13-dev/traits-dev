defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]

composite_rules:
  - id: ai-key-probe-before-origin-verification
    desc: Pre-origin key probe with lookalike API client
    crit: hostile
    conf: 0.95
    scope: archive
    # Stronger than the broad review signal: bind the stored-key use and the
    # origin comparison to one ordered function, and the header and model URL
    # to one request. The request helper may be in another archive member.
    # This remains static inference across modules, not a runtime trace.
    # Match no particular package, helper name, or attacker-selected hostname.
    all:
      - id: micro-behaviors/data/property/access::js-key-probe-before-origin-report
      - id: micro-behaviors/communications/http/token-auth::js-model-catalog-api-key-request
      - id: micro-behaviors/communications/http/url/domain::javascript-anthropic-branded-off-vendor-api-host
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
