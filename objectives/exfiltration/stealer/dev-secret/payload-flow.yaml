defaults:
  platforms: [unix, windows]
  for: [rust, python, javascript, typescript, go, shell, powershell]
  attack: T1552.001,T1041

composite_rules:
  - id: credential-http-upload
    desc: Uploads credential contents via HTTP
    crit: hostile
    conf: 0.95
    scope: leaf
    all:
      - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
    any:
      - id: micro-behaviors/communications/http/request/credentials::python-secret-env-json-body
      - id: micro-behaviors/communications/http/request/credentials::go-secret-env-reader-body
      - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::cargo-credential-http-body-flow
      - id: micro-behaviors/communications/http/upload::curl-named-file-body-upload-command
    unless:
      # The flow tracker records "secret reaches an HTTP call" without
      # distinguishing a literal body write from a value only consumed as a
      # SigV4 HMAC signing key -- @ts-cloud/core's STS GetCallerIdentity check
      # resolves the user's own AWS credentials (IMDS or ~/.aws/credentials)
      # and signs a fixed, non-secret request body with them; the secret
      # itself never appears in the body or headers, only a derived signature.
      - id: well-known/lib/format/stacksjs-ts-cloud/
      - id: well-known/app/development/cloudflare::cloudflare-github-jira-sync-context
      # AI agent runtimes and coding agents legitimately resolve LLM and cloud
      # provider keys to authenticate completions and tool executions.
      - id: well-known/app/ai/agent-runtime/
      - id: well-known/app/ai/coding-agent/
      # Requests to first-party developer service APIs (e.g. GitHub Gist/API)
      - id: micro-behaviors/communications/http/services/github/
      # Infrastructure provisioning and release tooling (Ansible modules,
      # SigV4 clients, the Stacks ecosystem) resolve the operator's own
      # credentials before calling the operator's own APIs.
      - id: metadata/build/recognized-contexts::developer-credential-tooling-context
      - id: metadata/package/testing/presence/path::scanner-attack-fixture-context
      - id: metadata/file/naming::test-directory-component
