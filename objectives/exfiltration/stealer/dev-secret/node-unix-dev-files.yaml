defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-custom-exfil-sink
    desc: Node custom HTTP exfil sink
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/exfiltration/http/collect::node-exfil-endpoint
    any:
      - id: objectives/exfiltration/stealer/env::node-base64-json-exfil-body
      - id: objectives/exfiltration/http/upload::node-upload-sink
      - id: micro-behaviors/communications/http/request/body::request-write-call
  - id: node-dev-container-config-files
    desc: Container credential path references
    crit: component
    conf: 0.94
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/read/file/full::read-node
    any:
      - id: micro-behaviors/fs/path/secret-config::docker-config
      - id: micro-behaviors/fs/path/secret-config::kube-config
  - id: node-dev-source-control-files
    desc: Node source control auth files
    crit: suspicious
    conf: 0.94
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/read/file/full::read-node
    any:
      - id: micro-behaviors/fs/path/token::git-credentials
      - id: micro-behaviors/fs/path/token::gh-cli-hosts
  - id: node-dev-vault-iac-files
    desc: Node vault and IaC files
    crit: suspicious
    conf: 0.94
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/read/file/full::read-node
    any:
      - id: micro-behaviors/fs/path/token::vault-token-file
      - id: micro-behaviors/fs/path/token::terraform-credentials
  - id: node-dev-login-cloud-files
    desc: Login credential path references
    crit: component
    conf: 0.94
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/read/file/full::read-node
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: metadata/file/string/cloud::gcp-default-credentials
  - id: node-developer-secret-file-sources
    desc: Multiple developer credential path groups
    crit: component
    conf: 0.95
    needs: 3
    any:
      - id: micro-behaviors/fs/read/file/target::node-sensitive-auth-file-read
      - id: node-dev-container-config-files
      - id: node-dev-source-control-files
      - id: node-dev-vault-iac-files
      - id: node-dev-login-cloud-files
  - id: node-developer-secret-files-http-exfil
    desc: Node developer secret files HTTP exfil
    crit: hostile
    conf: 0.98
    attack: "T1552.001, T1552.004, T1041"
    mbc: "E1552, E1041"
    all:
      - id: node-developer-secret-file-sources
      - id: node-custom-exfil-sink
    any:
      - id: objectives/exfiltration/sensitive-data::js-sensitive-file-read-source
      - id: objectives/exfiltration/stealer/sweep::node-sensitive-find-command
  - id: node-git-metadata-http-exfil
    desc: Node Git metadata HTTP exfil
    crit: hostile
    conf: 0.96
    attack: "T1213.003, T1041"
    mbc: "E1041"
    all:
      - id: micro-behaviors/process/create/vcs/git::node-git-config-remote-harvest
      - id: node-custom-exfil-sink
  - id: node-dynamic-credential-list-http-exfil
    desc: Node sends dynamically collected developer credentials over HTTP
    crit: hostile
    conf: 0.98
    attack: "T1552.001, T1552.004, T1041"
    mbc: "E1552, E1041"
    near_bytes: 16384
    all:
      - id: micro-behaviors/fs/path/filename-credential::developer-credential-path-list
      - id: micro-behaviors/fs/read/file/full::read-node
    any:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/body::request-write-call
