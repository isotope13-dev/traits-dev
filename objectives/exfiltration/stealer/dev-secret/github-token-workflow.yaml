defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1552.001
traits:
- id: curl-github-token
  desc: curl sends GITHUB_TOKEN outside GitHub
  crit: suspicious
  conf: 0.95
  if:
    type: text
    # Require curl as a standalone command token: a bare `curl` substring also
    # matches CLI flags such as `--curl` (e.g. a local tool's own flag receiving
    # the token for a legitimate GitHub API call), which is not a curl request.
    regex: '(^|[^\w-])curl\b.{0,100}(GITHUB_TOKEN|github\.token)'
  not:
  # Reserved documentation destinations cannot receive a token. Suppress this
  # atomic external-send claim there while retaining the curl and secret-body
  # capability findings.
  - regex: 'https?://[^/\s]+\.(test|example)(/|:|$)'
  - regex: 'https?://[^/\s]+\.(invalid|localhost)(/|:|$)'
  unless:
  - type: path
    # Gitea/Forgejo Actions provide GITHUB_TOKEN as the compatibility name for
    # the forge's own CI token. A workflow under .gitea/ or .forgejo/ sends it
    # to the self-hosted forge API its repository lives on — the token's actual
    # audience — so "outside GitHub" does not describe the flow.
    regex: '(^|[\\/])\.(gitea|forgejo)[\\/]'
  # Also covers api.github.com, which contains this host.
  - id: micro-behaviors/communications/http/services/github::workflow-github-com-slash-reference
  # GitHub Packages registries (ghcr, maven, npm, nuget, rubygems) are
  # GitHub-owned hosts, and the runner-provided GITHUB_API_URL always resolves
  # to GitHub's own API — the documented pattern for workflows that call the
  # GitHub API (e.g. the standard delete-old-artifacts recipe). A workflow
  # authenticating a download against these audiences is calling GitHub, not
  # an external server.
  - type: text
    regex: '(ghcr\.io/|\.pkg\.github\.com|GITHUB_API_URL)'
  # The Actions expression is the YAML equivalent of GITHUB_API_URL. Keep
  # the curl on the same line so an unrelated API reference cannot suppress
  # a separate request that sends the token elsewhere. Also permits repository
  # and event API URLs provided by the runner (e.g. github.event.pull_request.head.repo.url).
  - type: text
    regex: 'curl[^\n]{0,160}\$\{\{\s*github\.[a-z0-9_.]*url[^\n}]*\}\}'
  # The runner URL is stored in an env var and the next lines curl it with
  # the token. That is still GitHub's API (pull-request commits_url and kin).
  - type: text
    regex: 'github\.[a-z0-9_.]*url[\s\S]{0,160}curl[^\n]{0,100}GITHUB_TOKEN'
  - id: micro-behaviors/communications/http/token-auth::workflow-github-token-auth-header
  - id: micro-behaviors/communications/http/auth::workflow-secret-bearer-auth
  # Token used as the repo_token for a coverage service's own webhook (e.g.
  # the documented Coveralls parallel-build finish notification) is the tool's
  # integration transport, not exfiltration.
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish
composite_rules:
- id: github-token-exfil
  desc: GITHUB_TOKEN sent to external URL
  crit: suspicious
  conf: 0.95
  any:
  - id: curl-github-token
  - id: objectives/supply-chain/recon-exfil/secrets::wget-github-token
  - id: objectives/supply-chain/recon-exfil/secrets::fetch-github-token
  - id: objectives/supply-chain/recon-exfil/secrets::http-github-token
  unless:
  - id: well-known/tool/development/ci/coveralls::coveralls-webhook-finish
  - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
