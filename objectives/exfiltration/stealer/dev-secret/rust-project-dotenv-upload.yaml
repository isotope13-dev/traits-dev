defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041
traits:
  - id: rust-project-env-exfil-endpoint
    desc: Rust project dotenv endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /api/validate/project-env
composite_rules:
  - id: rust-project-env-exfiltration
    desc: Rust project dotenv exfiltration
    crit: suspicious
    conf: 0.98
    all:
      - id: rust-project-env-exfil-endpoint
      - id: objectives/exfiltration/http/env::rust-env-content-field
    any:
      - id: objectives/exfiltration/stealer/file::rust-file-exfil-endpoint
      - id: objectives/credential-access/files/config::rust-dotenv-file-target
