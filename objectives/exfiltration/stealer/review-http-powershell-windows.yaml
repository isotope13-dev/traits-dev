composite_rules:
- crit: hostile
  conf: 0.98
  platforms:
  - windows
  for:
  - powershell
  attack: T1041
  mbc: E1041
  id: ps-credential-collect-http-exfil
  desc: PowerShell credential HTTP exfil
  all:
  - id: objectives/exfiltration/http/collect::ps-send-exfil-function
  - id: micro-behaviors/communications/http/client/library::irm-name
  - id: metadata/lang/source/syntax/argument::powershell-post-method-option
  - id: micro-behaviors/communications/http/request/payload::powershell-http-body-value
  any:
  - id: micro-behaviors/os/security/credential-manager::ps-windows-credential-manager-list
  - id: micro-behaviors/data/db/access::chromium-login-sql
  - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
  - id: objectives/credential-access/shell/history::powershell-history-theft
  - id: objectives/credential-access/env/secrets/bulk-access::ps-bulk-env-secret-harvest
  - id: objectives/credential-access/ssh/key::powershell-ssh-private-key-harvest
  - id: objectives/credential-access/windows-registry/security-keys::ps-lsa-secrets-registry-access
  - id: micro-behaviors/os/registry/keys/credential::ps-winlogon-autologon-secrets
  needs: 2
