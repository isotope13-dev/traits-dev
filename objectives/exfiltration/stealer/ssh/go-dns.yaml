defaults:
  platforms: [windows]
  for: [go, pe]
  attack: T1048.003

composite_rules:
  - id: go-pe-ssh-dns-exfil
    desc: Go PE SSH DNS exfil
    crit: hostile
    conf: 0.97
    for: [pe]
    all:
      - id: objectives/exfiltration/dns/tunnel::go-ssh-dns-functions-pe
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
    any:
      - id: objectives/exfiltration/dns/tunnel::go-dns-c2-functions-pe
      - id: objectives/exfiltration/dns/tunnel::go-dns-txt-mx-c2-lookups
