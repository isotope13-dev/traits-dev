defaults:
  platforms: [openbsd, bsd, unix]
  for: [shell]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: shell-ssh-key-http-exfil
    desc: Shell exfiltrates SSH keys
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/curl::shell-curl-keys-endpoint
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
