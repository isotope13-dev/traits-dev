defaults:
  platforms: [netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: native-ssh-key-collect-exfil
    for: [elf, c]
    desc: Native SSH key collect exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/ssh/key::native-ssh-private-key-paths
      - id: micro-behaviors/communications/http/url/telemetry::native-http-collect-path
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header
