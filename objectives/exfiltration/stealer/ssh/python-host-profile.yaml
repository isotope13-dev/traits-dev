defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-host-profile-ssh-http-exfil
    desc: Python host profiling and SSH key enumeration sent over HTTP
    conf: 0.99
    attack: T1082,T1552.004,T1041
    mbc: E1082,E1057
    near_bytes: 6000
    all:
      - id: objectives/exfiltration/stealer/sweep::python-unix-secret-http-exfil
      - id: objectives/discovery/system/profile::python-device-host-profile-fields
      - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
