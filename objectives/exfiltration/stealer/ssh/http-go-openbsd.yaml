defaults:
  platforms: [openbsd, bsd, unix]
  for: [go, elf]
  attack: T1041



composite_rules:
  - id: go-ssh-key-http-ingest
    desc: Go SSH key HTTP ingest
    crit: hostile
    conf: 0.98
    for: [go]
    all:
      - id: micro-behaviors/communications/http/form::go-form-urlencoded-post
      - id: objectives/credential-access/ssh/key::go-ssh-key-harvest-post
    any:
      - id: micro-behaviors/communications/http/url/telemetry::ingest-api-path
