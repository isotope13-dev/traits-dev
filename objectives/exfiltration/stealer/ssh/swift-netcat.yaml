defaults:
  platforms: [freebsd, netbsd, unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-nc-credential-exfil
    desc: Netcat shell with credential exfil URL
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/reverse-shell/netcat::nc-exec-sh
      - id: micro-behaviors/communications/http/url/endpoint::rust-exfil-path-marker
      - id: objectives/credential-access/ssh/key::swift-ssh-dir-enumeration
