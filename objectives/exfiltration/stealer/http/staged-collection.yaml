# Stealer C2 protocols can report each collected data class in a separate HTTP
# stage. Requiring a metrics route, the stage event, and three distinct secret
# classes captures the behavior across languages and binaries while avoiding
# ordinary analytics endpoints that use a single generic stage value.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  attack: T1041,T1555
  crit: notable
  conf: 0.94

traits:
  - id: collection-stage-event-query
    desc: Collection stage event query parameter
    if:
      type: text
      regex: '(?i)[?&]event=stage&stage='

  - id: credentials-stage-query
    desc: Credentials collection stage query
    if:
      type: text
      regex: '(?i)[?&]stage=credentials\b'

  - id: browsers-stage-query
    desc: Browser-data collection stage query
    if:
      type: text
      regex: '(?i)[?&]stage=browsers\b'

  - id: wallets-stage-query
    desc: Wallet-data collection stage query
    if:
      type: text
      regex: '(?i)[?&]stage=wallets\b'

  - id: messengers-stage-query
    desc: Messenger-data collection stage query
    if:
      type: text
      regex: '(?i)[?&]stage=messengers\b'

composite_rules:
  - id: multi-store-staged-collection-protocol
    desc: Staged C2 protocol reports multiple stolen-data classes
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/url/path::metrics-run-api-path
      - id: collection-stage-event-query
    any:
      - id: credentials-stage-query
      - id: browsers-stage-query
      - id: wallets-stage-query
      - id: messengers-stage-query
    needs: 3
