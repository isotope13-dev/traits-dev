# Browser credential collection followed by the multipart HTTP transport
# described for Vidar. The transport match is structural, not prose-based.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1041,T1555.003
  mbc: B0028

composite_rules:
  - id: chromium-abe-multipart-post-scaffold
    desc: Chromium ABE theft with multipart HTTP POST scaffold
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/browser/chromium::chromium-browser-store-set
      - id: micro-behaviors/communications/http/post::native-post-request-line
      - id: micro-behaviors/communications/http/post::multipart-form
    any:
      - id: objectives/credential-access/browser/chromium::chromium-abe-memory-apc-bypass
      - id: objectives/credential-access/browser/chromium::chromium-abe-memory-remote-thread-bypass
    near_lines: 180
