defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1005,T1041

composite_rules:
  - id: node-passwd-http-post-exfil
    desc: Node reads passwd database and posts it over HTTPS
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      # Keep the read call and path evidence separate: this also catches a
      # package that assigns /etc/passwd to a variable before readFileSync.
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
