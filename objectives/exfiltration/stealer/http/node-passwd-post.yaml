defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1005,T1041

composite_rules:
  - id: node-passwd-http-post-exfil
    desc: Node reads passwd database and posts it over HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/file/read::read-node-etc-passwd
      - id: micro-behaviors/communications/http/request/client::http-request
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/data/buffer::javascript-write-then-end-stream
