defaults:
  platforms: [android]
  for: [kotlin, class]
  attack: T1041

composite_rules:
  - id: kotlin-login-credential-exfil
    for: [kotlin]
    desc: Kotlin login credential exfil
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/capture/input::kotlin-login-credential-capture
      - id: objectives/exfiltration/http/report::kotlin-credential-exfil-host
    any:
      - id: metadata/lang/source/syntax/call/invocation::jvm-post-method-source
      - id: micro-behaviors/communications/http/client/initialize::jvm-urlconnection-open-kotlin-source
      - id: micro-behaviors/data/buffer/transfer::jvm-outputstream-write
