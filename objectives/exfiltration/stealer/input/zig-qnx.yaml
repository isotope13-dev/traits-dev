defaults:
  platforms: [qnx, unix]
  for: [zig]
  attack: T1056.001

traits:
  - id: qnx-zig-keylog-send
    desc: "Keylog flush with socket-send reference"
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'flush_keylog[\s\S]{0,260}libc\.send'
composite_rules:
  - id: qnx-zig-keylog-stream
    desc: "Keyboard device collection with socket delivery"
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/device::qnx-zig-keyboard-device-list
      - id: micro-behaviors/hardware/input/keyboard/label::qnx-zig-keylog-buffer
      - id: objectives/exfiltration/stealer/input::qnx-zig-keylog-send
