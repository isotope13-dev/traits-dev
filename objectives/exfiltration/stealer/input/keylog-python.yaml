# Keylogger Exfiltration - Python
# Keylogger with network exfiltration (credential collection + network = exfiltration)
# ATT&CK: T1056.001 (Input Capture: Keylogging) + T1041 (Exfiltration Over C2 Channel)
defaults:
  platforms: [unix, windows, macos]
  for: [python]
  mbc: B0015
  attack: T1041
composite_rules:
  - id: python-keylogger-exfil
    desc: Python keylogger posts labeled captured keystrokes over HTTP
    conf: 0.98
    crit: hostile
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-listener-constructor
      - id: micro-behaviors/hardware/input/event::pynput-key-value-record
      - id: micro-behaviors/hardware/input/keyboard/label::python-keylog-result-label
      - id: micro-behaviors/communications/http/lib/requests::requests-post
