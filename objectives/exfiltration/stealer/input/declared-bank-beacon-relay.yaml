defaults:
  platforms: [unix, windows]
  for: [xpi, crx, zip, javascript, typescript, chrome-manifest, manifest.json]
  attack: T1056.003,T1041

composite_rules:
  - id: declared-bank-form-beacon-relay
    desc: Bank-form harvest claim with HTTP field relay
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: objectives/credential-access/browser/form-grab::bank-form-harvest-claim
      - id: metadata/permission/dom::content-script-bank-hostname-text
      - id: micro-behaviors/communications/http/request/beacon::json-fields-http-beacon
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-on-message
