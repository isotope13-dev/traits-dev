# Password Input Exfiltration - Go
# ATT&CK: T1056 (Input Capture) + T1041
#
# Removed password-exfil-http (hostile: go-readpassword-call +
# capture/input::http-exfil-operation). Its unless: named the whole
# capture/input/ directory, which holds its own http-exfil-operation leg, so
# it never fired. Revived with the intended registry-login carve-out it fired
# hostile on 6 of 8 benign Go login clients checked (pinterest/knox,
# Infisical agent-vault, k8s-ldap-auth, e2ecp, tank, itsabot): prompting for a
# password and POSTing it to the service being logged into is what a login
# command does, and nothing in the matcher separates that from theft. The
# capability stays visible through capture/input::credential-capture; the
# attack shape (a trojanized terminal package) is covered by
# supply-chain/impersonation/core-module::go-terminal-supply-chain.
defaults:
  platforms: [unix, windows, macos]
  for: [go]
  attack: "T1041"
composite_rules: []
