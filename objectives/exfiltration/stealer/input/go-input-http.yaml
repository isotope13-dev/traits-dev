defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1082,T1033,T1016,T1056.001,T1041
  mbc: E1082,E1033,E1016,E1056.001,E1041

composite_rules:
  - id: go-input-surveillance-http-exfil
    desc: Go sends global input state via HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/system/profile::go-host-profile-collection
      - id: micro-behaviors/hardware/input/keyboard/poll::go-global-input-api-cluster
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do
    any:
      - id: micro-behaviors/data/encode/base64::go-base64-encode-call
      - id: micro-behaviors/communications/http/header/custom::go-content-type-set
    near_bytes: 7000
  - id: go-anti-debug-input-profile-agent
    desc: Go anti-debugging host-profile agent
    crit: hostile
    conf: 0.995
    attack: T1056.001,T1082,T1041,T1622
    all:
      - id: objectives/anti-analysis/debugger-detect/check::go-ptrace-traceme
      - id: objectives/exfiltration/stealer/input::go-input-surveillance-http-exfil
