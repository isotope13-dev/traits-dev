defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Buffered KEYLOG records can use WebClient rather than HttpClient/form
  # content. These are file-scoped references, not a bound source/send pair.
  - id: managed-buffered-keylog-webclient-upload-cooccurrence
    desc: Buffered keylog with WebClient upload references
    crit: hostile
    conf: 0.96
    attack: T1056.001,T1041
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::uploadstring
