defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-a11y-touch-socket-rat
    desc: Accessibility RAT sockets captured touch events
    crit: hostile
    conf: 0.93
    scope: outer
    for: [android_apk, zip, dex]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/hardware/input/event::android-view-touch-coordinate-capture
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
