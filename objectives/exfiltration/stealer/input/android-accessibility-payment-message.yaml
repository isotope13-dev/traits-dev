defaults:
  platforms: [android]
  for: [dex]
  attack: T1417.001,T1041
traits:
  - id: dex-publish-remote-message-call
    desc: DEX calls remote-message publisher
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(?i);->publishremotemessage$'
composite_rules:
  # Calls are nearby in the DEX; the cluster does not itself prove data flow.
  - id: dex-accessibility-text-remote-message-cluster
    desc: Accessibility text, JSON and remote publish call cluster
    crit: notable
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-event-text-call
      - id: dex-publish-remote-message-call
      - id: micro-behaviors/data/serialize/json::dex-json-object-put-call
  - id: dex-payment-app-package-identifiers
    desc: DEX references multiple payment app packages
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: well-known/app/finance/phonepe::android-phonepe-package
      - id: well-known/app/finance/google-pay::android-google-pay-india-package
      - id: well-known/app/finance/bank-syariah-indonesia::android-bank-syariah-indonesia-package
  - id: android-payment-accessibility-remote-message-clues
    desc: Accessibility text remote-publish and payment-app clues
    crit: hostile
    conf: 0.97
    all:
      - id: dex-accessibility-text-remote-message-cluster
      - id: dex-payment-app-package-identifiers
      - id: metadata/binary/symbols/descriptor::android-accessibility-service-descriptor
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-password-flag-read
