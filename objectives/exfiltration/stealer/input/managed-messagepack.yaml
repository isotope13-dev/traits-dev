defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # The independent collection and remote-plugin profiles establish abuse context.
  # File scope supports a delivery inference, not binding of a particular log
  # buffer to a particular stream or proof of successful transmission.
  - id: managed-messagepack-keylog-delivery-profile
    desc: Plugin backdoor with keylog-read and MessagePack TLS send code
    crit: hostile
    conf: 0.96
    attack: T1056.001,T1041
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/command-and-control/backdoor/dispatch/module::messagepack-managed-plugin-tasking
      - id: micro-behaviors/fs/read/file/content/characters::dotnet-read-all-text
      - id: micro-behaviors/data/serialize/msgpack::managed-messagepack-encode-call
      - id: micro-behaviors/communications/tls/initialize::managed-tls-client-authenticate-call
      - id: micro-behaviors/data/stream/write::managed-stream-write-call
