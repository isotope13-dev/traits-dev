defaults:
  for: [php, markdown]
  platforms: [unix, windows]
  attack: T1056.001,T1041

traits:
  - id: keylogger-http-post-option
    desc: Document configures keylogger HTTP upload
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)logkeys[^\n]{0,100}--post-http='
  - id: php-upload-log-file-receiver
    desc: PHP moves uploaded files into a log
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'move_uploaded_file\s*\([^;]{0,120}["''][^"'']{1,60}\.log["'']'

composite_rules:
  - id: keylogger-http-upload-receiver-guide
    desc: Keylogger upload instructions include PHP log receiver
    crit: hostile
    conf: 0.98
    all:
      - id: keylogger-http-post-option
      - id: php-upload-log-file-receiver
    any:
      - id: micro-behaviors/communications/http/request/superglobal::files
      - id: micro-behaviors/communications/http/request/superglobal::markdown-php-upload-field-access
