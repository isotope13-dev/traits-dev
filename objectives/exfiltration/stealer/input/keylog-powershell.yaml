defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1056.001,T1048.002
composite_rules:
  - id: powershell-polling-keylog-mail
    desc: PowerShell keylogging with email and cleanup
    crit: hostile
    conf: 0.98
    near_lines: 45
    all:
      - id: objectives/collection/keylog/polling::ps-polling-keylogger
      - id: micro-behaviors/communications/email/send/smtp::powershell-send-mailmessage
      - id: micro-behaviors/communications/email/send/smtp::powershell-mail-variable-attachment
      - id: micro-behaviors/fs/delete/file/command::powershell-force-remove-variable-path
