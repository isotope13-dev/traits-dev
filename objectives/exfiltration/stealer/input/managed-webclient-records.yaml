defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Hook recording and polling are alternative acquisition mechanisms.
  # The text polling trait excludes imports; accept the canonical import
  # observation too. An input logger does not require a second source.
  # This profile identifies retained upload code, including disabled senders;
  # it does not establish runtime delivery or bind every record to a send.
  - id: managed-keylog-records-with-http-upload
    desc: Managed keylogger records with HTTP upload code
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::clr-runtime-header
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::uploadstring
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
