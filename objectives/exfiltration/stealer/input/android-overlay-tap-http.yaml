# The GhostX ghost-overlay buffers the intercepted UPI PIN and POSTs it to the
# C2 (api.cloudsettle[.]org/pin-data, tagged ghost_overlay). Pairing the
# capture mechanism with an HTTP request-body POST in the same file is the
# exfiltration leg (co-occurrence; the rule does not bind tap data to body):
# distinct from the collection objective, and keyed on the HTTP client, not the
# (dynamically swapped) destination host.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: "T1417.001,T1041"
  mbc: F0005

composite_rules:
  - id: overlay-tap-capture-http-post
    desc: Overlay tap capture co-occurs with HTTP POST
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/collection/touch::accessibility-overlay-tap-capture-replay
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
    # The keypad-mapping stealer in keylog-android.yaml makes the same
    # input-theft claim with stronger credential evidence; step down when it
    # fires so one theft is not convicted twice.
    downgrade:
      any:
        - id: android-touch-credential-http-exfil
