defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1552
  mbc: E1041

composite_rules:
  - id: python-intercepted-auth-credential-forwarding
    desc: Forwards intercepted credentials remotely
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/credentials/literal::python-request-auth-credential-extractor
      - id: micro-behaviors/communications/http/request/credentials/literal::python-credential-payload-request-forwarding
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
