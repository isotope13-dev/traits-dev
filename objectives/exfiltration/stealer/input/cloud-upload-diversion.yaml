# A Qiniu-upload command whose clipboard image is diverted to a hardcoded
# file-upload API while a secondary reporting path sends the uploaded image
# URL together with local interface information to another hardcoded host.
# The pasted image is authorized for the advertised Qiniu destination, not
# for the hardcoded endpoints; the interface telemetry is never part of
# pasting an image. Clipboard reads or ordinary uploads alone must remain
# neutral. No filename, publisher, sample hash or collector IOC is required:
# the data-routing relationships carry the detection. This mirrors the
# sibling hostile clipboard-to-webhook exfiltration: a clipboard read paired
# with an outbound body to an attacker-chosen drop.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, package.json, vsix-archive, zip]
composite_rules:
  - id: qiniu-command-diverts-clipboard-upload
    desc: Qiniu command diverts clipboard image and logs it
    crit: hostile
    conf: 0.98
    attack: T1115,T1041
    scope: outer
    all:
      - id: metadata/package/runtime::qiniu-upload-command-claim
      - id: micro-behaviors/communications/http/telemetry::node-file-upload-response-url-reported
      - id: micro-behaviors/communications/http/telemetry::node-interface-helper-result-in-post-log
    any:
      - id: micro-behaviors/os/clipboard/read::powershell-clipboard-read
      - id: micro-behaviors/os/clipboard/read::node-xclip-read
      - id: micro-behaviors/os/clipboard/read::clipboard-read-command
      - id: micro-behaviors/os/clipboard/read::applescript-clipboard-read
      - id: micro-behaviors/os/clipboard/read::pil-imagegrab-clipboard
