# Browser Credential Exfiltration - JavaScript
# Browser credential theft with network exfiltration
# ATT&CK: T1555.003 (Credentials from Web Browsers) + T1041
defaults:
  mbc: "B0028"
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"
composite_rules:
  - id: credit-card-websocket-stealer
    desc: Live payment-card input streamed over a WebSocket
    crit: hostile
    conf: 0.995
    attack: "T1056.002,T1041"
    for: [javascript, typescript, html]
    near_bytes: 3000
    all:
      - id: micro-behaviors/data/parse/payment::payment-card-field-set
      - id: micro-behaviors/ui/window/form-input::document-input-listener
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call

  - id: payment-card-otp-websocket-relay
    desc: Payment details and one-time code streamed over WebSocket
    crit: hostile
    conf: 0.995
    attack: "T1056.002,T1111,T1041"
    for: [javascript, typescript, html]
    near_bytes: 3400
    all:
      - id: credit-card-websocket-stealer
      - id: micro-behaviors/ui/window/otp-field::browser-verification-field-reference

  - id: cardholder-billing-websocket-stealer
    desc: Cardholder identity and billing data streamed over WebSocket
    crit: hostile
    conf: 0.995
    attack: "T1056.002,T1041"
    for: [javascript, typescript, html]
    near_bytes: 3400
    all:
      - id: credit-card-websocket-stealer
      - id: micro-behaviors/data/parse/payment::cardholder-billing-field-set

  - id: js-obfuscated-encrypted-checkout-pii-exfil
    desc: Obfuscated script encrypts checkout PII for remote upload
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1573.002,T1041
    for: [javascript, typescript, npm]
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/data/parse/payment::checkout-pii-field-set
      - id: objectives/exfiltration/http/encrypted::browser-webcrypto-hybrid-http-exfil

  - id: npm-obfuscated-checkout-analytics-skimmer
    desc: Obfuscated npm analytics package steals encrypted checkout data
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1056.002,T1041
    for: [npm, javascript, package.json]
    scope: archive
    near_bytes: 32768
    all:
      - id: js-obfuscated-encrypted-checkout-pii-exfil
      - id: metadata/package/keywords/identity::keywords-single-entry

  # Whole-document markup theft to an anonymous drop: documentElement
  # outerHTML harvests the full page (forms, tokens, embedded state) and a
  # fetch carries it to a webhook.site UUID endpoint. Archivers and error
  # reporters POST page content to their own product backends; a UUID-
  # addressed request bin is never a product backend, and the snapshot plus
  # the bin plus the transfer are three required roles.
  # Worked example: zxcvb90-utils-helper 1.0.1 index.js (142-byte root
  # module fetching outerHTML.slice(0,4000) to webhook.site/<uuid>).
  - id: whole-page-html-webhook-exfil
    desc: Whole page HTML sent to anonymous webhook drop
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    scope: file
    near_bytes: 3000
    all:
      - id: micro-behaviors/data/parse/html::browser-document-html-snapshot-read
      - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
