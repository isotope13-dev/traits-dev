# JavaScript wrappers around native global keyboard listeners.
defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript]
  attack: T1056.001
  mbc: B0015

composite_rules:
  - id: node-global-keyboard-event-exfil
    desc: Node global key hook sends captured text through a sync client
    crit: hostile
    conf: 0.99
    attack: T1056.001,T1041
    scope: file
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::uiohook-global-input-listener
      - id: micro-behaviors/hardware/input/event::keyboard-text-event-payload
      - id: micro-behaviors/data/string/concat::kbd-buffer-character-append
      - id: objectives/collection/keylog/capture::sync-client-event-send
