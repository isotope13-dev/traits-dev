defaults:
  platforms: [windows, unix]
  for: [rust, elf]
  attack: T1056.001
traits:
  - id: rust-keyboard-events-endpoint
    desc: Rust keyboard events endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /api/validate/keyboard-events
composite_rules:
  - id: rust-keyboard-clipboard-exfiltration
    desc: Rust keyboard clipboard exfiltration
    crit: hostile
    conf: 0.98
    all:
      - id: rust-keyboard-events-endpoint
      - id: micro-behaviors/data/serialize/schema-object::keystring-field
      - id: micro-behaviors/data/serialize/schema-object::clipstring-field
  - id: rust-evdev-keylog-http-exfil
    for: [rust]
    desc: Rust evdev keylog HTTP exfil
    crit: hostile
    conf: 0.98
    platforms: [unix]
    attack: T1041
    all:
      - id: micro-behaviors/hardware/input/device::rust-input-device-paths
      - id: micro-behaviors/communications/http/url/telemetry::collect-post-request
