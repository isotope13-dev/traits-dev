defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1056.001
  conf: 0.98
composite_rules:
  - id: objectives/exfiltration/stealer/input::jvm-global-keylog-discord-reporting
    desc: Global key capture reports through Discord
    crit: hostile
    for: [class, jar, zip]
    scope: nest
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::jvm-windows-keyboard-hook-reference
      - id: micro-behaviors/hardware/input/keyboard/listener::jvm-tounicode-member-reference
      - id: micro-behaviors/communications/http/services/discord::jda-message-channel-send-reference
      - id: metadata/lang/source/naming/input::jvm-keylogger-report-loop
  - id: objectives/exfiltration/stealer/input::jvm-native-keylog-socket-reporting
    desc: Native keylogging has socket control and reporting
    crit: hostile
    for: [class, jar, zip]
    scope: nest
    all:
      - id: metadata/lang/source/naming/input::jvm-keylogger-start-method
      - id: metadata/import/jvm::native-keylog-helper-class-reference
      - id: metadata/import/jvm::getchar-member-reference
      - id: metadata/import/jvm::socket-input-stream-reference
      - id: metadata/import/jvm::socket-output-stream-reference
