# Clipboard Exfiltration - Python
# Clipboard capture with network exfiltration (collection + network = exfiltration)
# ATT&CK: T1115 (Clipboard Data) + T1041 (Exfiltration Over C2 Channel)
defaults:
  platforms: [unix, windows, macos]
  for: [python]
  mbc: "E1510"
  attack: "T1041"
composite_rules:
  - id: python-clipboard-exfil
    desc: "Clipboard theft with exfiltration"
    conf: 0.95
    crit: hostile
    all:
      - id: objectives/collection/clipboard/monitor::python-clipboard-access-any
      - id: objectives/collection/clipboard/monitor::python-network-exfil
      - id: micro-behaviors/os/clipboard/monitor::python-clipboard-polling-loop
  # Polls clipboard in a loop and ships captures to a hardcoded Discord webhook
  # endpoint (often in a sibling config module). Generalizes stealers that hide
  # the webhook URL away from the monitor loop.
  - id: python-clipboard-discord-webhook-exfil
    desc: Clipboard polling exfiltrated to Discord webhook
    conf: 0.96
    crit: hostile
    for: [python, whl]
    scope: archive
    attack: T1115,T1041,T1567.002
    all:
      - id: micro-behaviors/os/clipboard/read::pyperclip-paste
      - id: micro-behaviors/os/clipboard/monitor::python-clipboard-polling-loop
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
