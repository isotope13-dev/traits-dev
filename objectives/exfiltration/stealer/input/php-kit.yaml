defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1041

composite_rules:
  - id: php-mail-credential-phish
    desc: PHP mails captured credentials
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: micro-behaviors/communications/email/send/mail-func::mail-call
    any:
      - id: objectives/credential-access/phishing/kit/source::php-post-challenge-response-fields
      - id: objectives/credential-access/phishing/kit/source::php-phish-result-banner
  - id: php-credentials-zipped-for-download
    desc: PHP serves archived passwords for download
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/collection/archive/stage::php-archives-target-credentials
      - id: micro-behaviors/communications/http/download/handler::php-content-disposition-readfile
  - id: php-card-mail-phish
    desc: PHP mails captured payment card data
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-card-number-fields
      - id: micro-behaviors/communications/http/request/superglobal::php-post-card-secret-fields
      - id: objectives/exfiltration/messaging/email::php-card-info-mail-subject
      - id: micro-behaviors/communications/email/send/mail-func::mail-call
    any:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: objectives/credential-access/phishing/ui::three-ds-password-field
      - id: objectives/credential-access/financial/credit-card/form-field::credit-card-form-fields
