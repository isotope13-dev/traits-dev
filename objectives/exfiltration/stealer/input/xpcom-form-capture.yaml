defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: xpcom-native-component
    desc: Browser script opens an XPCOM component
    if:
      type: text
      regex: '\bComponents\s*\.\s*classes\s*\[[^\]\r\n]{1,64}\]\s*\.(createInstance|getService)\s*\('
  - id: xpcom-native-data-submission
    desc: Privileged XPCOM script transfers collected data
    if:
      type: text
      regex: '\benablePrivilege\(["'']UniversalXPConnect["'']\)[\s\S]{0,512}\.SendData\s*\('

composite_rules:
  - id: browser-wide-form-capture-to-xpcom
    desc: Captures page forms on submit and transfers data through XPCOM
    crit: hostile
    conf: 0.96
    attack: T1056,T1176
    all:
      - id: micro-behaviors/ui/window/dom/access::browser-all-form-selector
      - id: micro-behaviors/ui/window/dom/access::browser-indexed-form-field-read
      - id: micro-behaviors/ui/window/form-input::browser-submit-hook-registration
      - id: xpcom-native-component
      - id: xpcom-native-data-submission
      - id: micro-behaviors/data/property/access::js-value-property-read
