defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: hostile
  conf: 0.99
  attack: T1056.001

composite_rules:
  # A fake recovery form can exfiltrate entered words through a document-wide
  # key listener without ever reading the form controls. The queued-key POST
  # is the secret collection path; the forced invalid response keeps the user
  # on the lure after the phrase has been typed.
  - id: deceptive-wallet-form-keylogging-exfil
    desc: Recovery phrase lure exports captured keystrokes
    attack: T1056.001,T1041
    all:
      - id: micro-behaviors/ui/controls/wallet::web-seedword-entry-form
      - id: micro-behaviors/ui/controls/wallet::invalid-seed-phrase-error
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener-any-form
      - id: micro-behaviors/communications/http/post::queued-key-buffer-json-post
  - id: deceptive-wallet-keystroke-export
    desc: Wallet phishing also exports queued keys
    all:
      - id: objectives/exfiltration/stealer/wallet::seed-export-invalid-message
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener-any-form
      - id: micro-behaviors/communications/http/post::queued-key-buffer-json-post
