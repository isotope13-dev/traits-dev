defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
composite_rules:
  # File-scoped source observations: this is not a general data-flow proof.
  # In the traced implementation the same interaction supplies its raw prompt
  # to beta enrichment after the ordinary logging attribute was redacted.
  - id: prompt-redaction-with-raw-trace-export
    desc: Prompt redaction beside raw trace export
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::prompt-logging-redaction-selection
      - id: micro-behaviors/os/telemetry/logging/llm::raw-prompt-trace-enrichment-call
      - id: micro-behaviors/os/telemetry/logging/llm::prompt-and-tool-result-otlp-export
