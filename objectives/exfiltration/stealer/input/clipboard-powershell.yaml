# Clipboard Exfiltration - PowerShell
# A script that reads the clipboard and posts it somewhere. Each rule pairs the
# read with an outbound request body and one more thing a clipboard tool has no
# reason to do: address a chat-service webhook, or watch the keyboard for the
# copy shortcut so it fires on every Ctrl+C.
# ATT&CK: T1115 (Clipboard Data) + T1567 (Exfiltration Over Web Service)
defaults:
  platforms: [windows]
  for: [powershell]
  mbc: "E1510"
  attack: "T1115,T1567"
composite_rules:
  # Chat webhooks are the stealer's drop box: no server to run, and the token
  # in the URL is the only credential. The destination leg is any chat
  # service, so a variant that swaps Discord for Telegram or Slack still fires.
  - id: powershell-clipboard-chat-webhook-exfil
    desc: PowerShell posts clipboard to a chat webhook
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/clipboard/read::powershell-clipboard-read
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-or-upload
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-split
      - id: micro-behaviors/communications/http/webhook::generic-webhook-url
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-url
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    # No test-directory suppressor: a script that reads the clipboard and POSTs
    # it to a webhook has no benign unit-test form to exempt, and the sibling
    # `discord-exfiltration` rule carries none either. Exempting test paths only
    # blinded the rule to its own committed fixture.
  # Destination-agnostic: polling key state, reading the clipboard and sending
  # a request body is a copy-triggered clipboard stealer whatever it posts to.
  - id: powershell-key-poll-clipboard-upload
    desc: PowerShell key poll triggers clipboard upload
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/clipboard/read::powershell-clipboard-read
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-or-upload
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::wpf-keyboard-is-key-down
      - id: micro-behaviors/hardware/input/keyboard/poll::forms-control-modifier-keys
      - id: micro-behaviors/hardware/input/keyboard/poll::pinvoke-async-key-state
