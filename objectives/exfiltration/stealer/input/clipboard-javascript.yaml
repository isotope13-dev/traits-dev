# Clipboard Exfiltration - JavaScript/Node.js
# Clipboard capture with network exfiltration (collection + network = exfiltration)
# ATT&CK: T1115 (Clipboard Data) + T1041 (Exfiltration Over C2 Channel)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
composite_rules:
  # Periodic clipboard export may also implement clipboard synchronization.
  # This source-bound export is suspicious; deception about data collection
  # supplies the hostile intent in the extension false-disclosure composite. Evaluate this
  # only on parsed JavaScript; compressed package bytes are not a valid
  # evidence surface for JavaScript behavior.
  - id: browser-clipboard-http-exfil
    desc: Browser clipboard data sent over HTTP
    crit: suspicious
    conf: 0.98
    attack: T1041,T1115
    scope: file
    # The neutral atom binds the read value through slicing, iteration,
    # encoding and the first fetch argument, including minified variables.
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/clipboard/monitor::javascript-clipboard-polling
      - id: micro-behaviors/os/clipboard/read::browser-clipboard-chunk-array
  # The opaque chunk transport supplies stronger evidence than clipboard
  # export alone: each clipboard slice is URL-encoded into a fire-and-forget
  # no-cors request. Keep this separate from the generic ordered-field atom;
  # the source-bound query matcher and chunk transport are both required.
  - id: browser-clipboard-chunked-opaque-get-exfil
    desc: Clipboard chunks sent through opaque HTTP GET requests
    crit: hostile
    conf: 0.98
    attack: T1041,T1115
    scope: file
    near_bytes: 4096
    all:
      - id: browser-clipboard-http-exfil
      - id: micro-behaviors/communications/http/query::chunked-no-cors-query-send
  # Moved from extension-deception: the distinguishing result is clipboard
  # export. Reuse that existing false-disclosure finding rather than adding
  # a second hostile verdict for the same source and claim.
  # Periodic export can implement clipboard sync. The manifest's explicit
  # claim of no collection contradicts this source-bound export and supplies
  # the hostile intent. Obfuscation by itself cannot establish that intent.
  - id: browser-clipboard-export-false-disclosure
    desc: Extension exports clipboard despite no-collection claim
    crit: hostile
    conf: 0.99
    attack: T1115,T1048
    for: [xpi, crx, zip, json, chrome-manifest, javascript]
    platforms: [windows, unix]
    scope: archive
    all:
      - id: metadata/permission/clipboard::permission-clipboard-read
      - id: browser-clipboard-http-exfil
      - id: metadata/permission/telemetry::gecko-no-data-collection-claim
  # Body-based export needs more than clipboard and HTTP API co-occurrence.
  - id: js-clipboard-exfil
    desc: "Clipboard text written into an HTTP body"
    crit: hostile
    conf: 0.95
    mbc: "B0014"
    attack: "T1041"
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/clipboard/read::node-cli-clipboard-read
    any:
      - id: micro-behaviors/communications/http/request/body::request-write-call
      - id: micro-behaviors/process/io/stream::req-write-call-prefix-text-reference
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/post::axios-with-data
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    unless:
      - id: micro-behaviors/communications/http/url/host::loopback-client-url-cooccurrence
  - id: js-clipboard-exfil-external-ip
    desc: "JavaScript clipboard exfiltrates to IP"
    crit: hostile
    conf: 0.97
    mbc: "B0014"
    attack: "T1041"
    near_bytes: 32768
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/os/clipboard/read::node-cli-clipboard-read
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/lib/axios::axios
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    needs: 1

  # `browser-clipboard-chunked-http-exfil` lived here: it re-fired the base
  # clipboard-http-exfil composite on the same evidence plus a generic
  # uid/part/total/data field list, double-counting one steal loop as two
  # hostile verdicts in the same directory. The field list now lives as the
  # neutral `micro-behaviors/communications/http/query::chunked-upload-order-fields`
  # capability for composites that need it.
