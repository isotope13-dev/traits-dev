defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: postinstall-source-rewrite-form-exfil
    for: [npm, package.json, javascript, typescript]
    desc: Postinstall source rewrite and browser form collection
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1056.001,T1041"
    scope: archive
    all:
      - id: micro-behaviors/fs/write/file/unspecified::postinstall-source-rewrite-clues
      - id: objectives/exfiltration/stealer/input::browser-form-values-remote-activity-api
