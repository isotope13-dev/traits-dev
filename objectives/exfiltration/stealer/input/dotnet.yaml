# .NET Polling Keylogger Composites
# Detects VB.NET/C# RATs using GetAsyncKeyState + ToUnicodeEx + window tracking
# ATT&CK: T1056.001 (Input Capture: Keylogging)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: dotnet-continuous-keylog-http-exfiltration
    desc: Managed hook-keylog records with HTTP POST APIs
    crit: hostile
    conf: 0.99
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/fs/write/file/append::dotnet-appendalltext-token
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
      - id: micro-behaviors/communications/http/client/managed::postasync
    unless:
      - id: metadata/signed/platform/
  - id: dotnet-keylog-http-post-profile
    desc: Managed polling-keylog writes with HTTP POST APIs
    crit: hostile
    conf: 0.99
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/fs/write/file/append::dotnet-appendalltext-token
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-word
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/communications/http/client/managed::postasync
    unless:
      - id: dotnet-continuous-keylog-http-exfiltration
      - id: metadata/signed/platform/
  - id: dotnet-hook-keylogger-http-upload
    desc: Managed keyboard-hook records co-occur with HTTP upload APIs
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1041
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
    any:
      - id: micro-behaviors/communications/http/client/managed::uploadstring
      - id: micro-behaviors/communications/http/client/managed::postasync
    unless:
      - id: metadata/signed/platform/
  # Hook chain + the full ToUnicodeEx/MapVirtualKey/GetKeyboardState decode
  # cluster is a keystroke capture-and-render pipeline, not a hotkey check: the
  # binary installs a hook AND translates raw virtual keys into text. Paired
  # with an explicit keylogger label and an outbound delivery channel, that is
  # the Snake Keylogger / Agent Tesla class of managed keylogger. Delivery is an
  # `any:` because these builders let the operator pick SMTP, FTP or a Telegram
  # bot per build, and the sibling rules below only recognise HTTP/TCP paths
  # that also stage keystrokes to a file or a `KEYLOG:` record.
  - id: dotnet-hook-keylogger-mail-bot-exfil
    desc: .NET hook keylogger exfiltrates over mail, FTP, or bot API
    crit: hostile
    conf: 0.96
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
    any:
      - id: micro-behaviors/communications/email/send/smtp::dotnet-smtpclient-type
      - id: micro-behaviors/communications/ftp/client::dotnet-ftpwebrequest
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    unless:
      - id: metadata/signed/platform/
      # An anti-keylogger or endpoint product names the technique it defends
      # against and can carry the same input APIs for its own hook inspection.
      - id: well-known/tool/detection/
      - id: well-known/app/security/
  - id: dotnet-hook-keylogger-network-exfil
    desc: .NET hook/keylog recording co-occurs with outbound client APIs
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/fs/write/file/append::dotnet-appendalltext-token
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
    any:
      - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/
  - id: dotnet-chromium-surveillance-stealer
    desc: Unsigned .NET Chromium theft with input logging
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1555.003,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
    any:
      - id: micro-behaviors/hardware/input/keyboard/label::dotnet-enable-keylogger-flag
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
    unless:
      - id: metadata/signed/platform/
  - id: dotnet-login-data-keylogger-stealer
    desc: Unsigned .NET Login Data theft with keylogging
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1555.003,T1041
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/path/password-store::login-data-string
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
    unless:
      - id: metadata/signed/platform/
      - id: dotnet-chromium-surveillance-stealer
