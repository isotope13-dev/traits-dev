defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1056.001

composite_rules:
  - id: css-input-character-log-service
    desc: "CSS input-value image oracle with character-log routes"
    crit: hostile
    conf: 0.97
    for: [javascript]
    all:
      - id: micro-behaviors/data/format/css::css-input-suffix-image-url
      - id: micro-behaviors/communications/http/server/route::character-log-route
      - id: micro-behaviors/communications/http/server/route::field-focus-route
      - id: micro-behaviors/data/property/access::ip-indexed-log-access
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
