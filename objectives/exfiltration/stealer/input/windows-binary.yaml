defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
- id: keyboard-hook-raw-socket-control
  desc: Keyboard hook keylogger with raw Winsock communications
  crit: hostile
  conf: 0.96
  attack: T1056.001,T1095
  all:
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
  - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
  any:
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/probe::get-desktop-window
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
