# Source-level keylogger: a global keyboard hook or key-state poll paired
# with an outbound delivery channel in the same file. The PE composites in
# windows-keyhook-http.yaml require WinINet/binary legs, so managed source
# that hooks WH_KEYBOARD_LL and posts over HttpClient fell through.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1056.001
  mbc: E1056.001

composite_rules:
  - id: csharp-hook-keylogger-network-delivery
    desc: C# keyboard hook keylogger with network delivery
    crit: hostile
    conf: 0.95
    attack: T1056.001,T1041
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-source
    any:
      - id: micro-behaviors/communications/http/post::postasync
      - id: micro-behaviors/communications/socket/connect/endpoint::tcpclient-host-port-constructor
      - id: micro-behaviors/communications/websocket/client::dotnet-client-websocket
