defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Reviewed CIL: WH_KEYBOARD_LL callback boxes the captured Keys value,
  # appends a timestamped record, and a worker reads the log into the JSON
  # payload passed to FormUrlEncodedContent/PostAsync. Required ransom
  # lockout supplies abuse context; keyboard hooks and HTTP APIs alone do not.
  # File-scoped matching describes code co-occurrence, not a bound POST buffer.
  - id: managed-ransom-hook-keylog-form-post
    desc: Ransom lockout with key-record and form-POST code
    crit: hostile
    conf: 0.96
    attack: T1056.001,T1041
    all:
      - id: objectives/impact/ransom/extortion::managed-ransom-input-lockout
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: micro-behaviors/hardware/input/keyboard/listener::windows-key-message-constants
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/data/control-flow/sequence::cil-boxed-array-string-call-layout
      - id: micro-behaviors/fs/write/file/append::dotnet-appendalltext-token
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/data/serialize/json::javascript-serializer-type-reference
      - id: micro-behaviors/communications/http/form::dotnet-form-url-encoded-content
      - id: micro-behaviors/communications/http/post::postasync
