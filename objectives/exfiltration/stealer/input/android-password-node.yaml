# Bind the tested node to the text read, and the populated record to the send.
# A socket elsewhere in an accessibility service is insufficient evidence.
defaults:
  platforms: [android]
  for: [java]
  attack: T1417.001,T1041

traits:
  - id: java-password-node-record-send
    desc: Sends text records from password nodes
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((class_declaration body: (class_body
          (field_declaration type: (type_identifier) @socket_type
            declarator: (variable_declarator name: (identifier) @socket_field))
          (method_declaration body: (block (if_statement
          condition: (parenthesized_expression [
            (method_invocation object: (identifier) @guard name: (identifier) @test)
            (binary_expression
              right: (method_invocation object: (identifier) @guard name: (identifier) @test))
          ])
          consequence: (block
            (expression_statement (method_invocation
              object: (identifier) @record name: (identifier) @put
              arguments: (argument_list
                (string_literal)
                (method_invocation
                  object: (method_invocation
                    object: (identifier) @node name: (identifier) @text)
                  name: (identifier) @stringify))))
            (expression_statement (method_invocation
              object: (identifier) @channel name: (identifier) @send
              arguments: (argument_list (method_invocation
                object: (identifier) @sent name: (identifier) @serialize)))))) @capture))))
          (#eq? @test "isPassword") (#eq? @guard @node)
          (#eq? @put "put") (#eq? @text "getText")
          (#eq? @stringify "toString") (#eq? @serialize "toString")
          (#eq? @send "send") (#eq? @record @sent)
          (#eq? @socket_type "WebSocket") (#eq? @socket_field @channel))

composite_rules:
  - id: android-accessibility-password-record-export
    desc: Accessibility exports password-node text records
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/capture/input::android-accessibility-password-node-read
      - id: java-password-node-record-send
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-import
