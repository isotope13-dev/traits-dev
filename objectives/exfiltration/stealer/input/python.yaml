defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious

composite_rules:
  - id: python-keylogger-file-with-smtp-exfil
    desc: File-backed Python keylogger sends data through SMTP
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: objectives/collection/keylog/capture::python-keylogger-file
      - id: micro-behaviors/communications/email/send/smtp::python-smtp-sendmail-call
  - id: python-keyboard-discord-webhook-exfil
    desc: Python keylogger exfils via Discord webhook
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1567.002
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::import-keyboard
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-on-release
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-import
  - id: python-keylog-discord-file-upload
    desc: Uploads keylog file to Discord webhook
    crit: hostile
    conf: 0.96
    attack: T1056.001,T1567.002
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-on-release
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-add-file
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-import
