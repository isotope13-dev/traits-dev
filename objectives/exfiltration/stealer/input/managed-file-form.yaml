defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Independently traced in the managed recorder: ReadAllText reads the key
  # and clipboard logs, their contents enter serialized records, and the send
  # helper uses FormUrlEncodedContent as PostAsync's body. This portable static
  # signature observes the source and transport references in one file; it
  # cannot bind an individual log value to the request. Keep it suspicious.
  - id: managed-file-keylog-form-post-cooccurrence
    desc: File keylogger with log-read and JSON/form POST references
    crit: suspicious
    conf: 0.95
    attack: T1041
    all:
      - id: objectives/collection/keylog/polling::managed-keylog-file-polling-profile
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/data/serialize/json::javascript-serializer-type-reference
      - id: micro-behaviors/communications/http/form::dotnet-form-url-encoded-content
      - id: micro-behaviors/communications/http/client/managed::postasync
