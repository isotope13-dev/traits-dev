defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # File scope establishes source and send capabilities, not a static binding
  # between a particular read buffer and a particular POST argument.
  - id: managed-file-keylog-form-post-cooccurrence
    desc: File keylogger with log-read and JSON form-POST APIs
    crit: hostile
    conf: 0.97
    attack: T1041,T1056.001
    all:
      - id: objectives/collection/keylog/polling::managed-keylog-file-polling-profile
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/data/serialize/json::javascript-serializer-type-reference
      - id: micro-behaviors/communications/http/form::dotnet-form-url-encoded-content
      - id: micro-behaviors/communications/http/client/managed::postasync
