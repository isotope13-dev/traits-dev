defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-repl-input-password-relay
  desc: REPL words reach HTTP password handler
  crit: suspicious
  conf: 0.99
  if:
    type: tree-sitter
    query: |-
      (module
       (function_definition name: (identifier) @transport body: (block) @http)
       (function_definition name: (identifier) @sender
        parameters: (parameters (identifier) (identifier) @secret)
        body: (block (return_statement (call function: (identifier) @transport_call
         arguments: (argument_list (identifier) (string)
          (dictionary (pair key: (string) @password value: (identifier) @value)))))))
       (class_definition superclasses: (argument_list (attribute
         object: (identifier) @code attribute: (identifier) @console))
        body: (block
         (function_definition name: (identifier) @push
          parameters: (parameters (identifier) (identifier) @line)
          body: (block
           (expression_statement (assignment left: (identifier) @word right: (call
            function: (attribute object: (identifier) @input attribute: (identifier) @strip))))
           (if_statement consequence: (block
            (if_statement consequence: (block
             (if_statement consequence: (block
              (expression_statement (assignment right: (call function: (identifier) @send
               arguments: (argument_list (identifier) (identifier) @sent))))
              (if_statement consequence: (block (raise_statement)))))))))))) @hook)
       (#eq? @transport @transport_call)
       (#match? @http "urllib[.]request[.]urlopen")
       (#match? @http "json[.]dumps")
       (#eq? @sender @send)
       (#eq? @secret @value)
       (#match? @password "^.password.$")
       (#eq? @code "code")
       (#eq? @console "InteractiveConsole")
       (#eq? @push "push")
       (#eq? @line @input)
       (#eq? @strip "strip")
       (#eq? @word @sent)
       (#match? @hook "def raw_input")
      )
composite_rules:
- id: python-covert-repl-input-export
  desc: Hidden REPL input sent as remote password
  crit: hostile
  conf: 0.99
  attack: T1056,T1041
  all:
  - id: python-repl-input-password-relay
  - id: micro-behaviors/process/tty/terminal::python-tty-cbreak-call
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
