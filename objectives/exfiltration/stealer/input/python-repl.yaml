defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-covert-repl-input-export
  desc: Silently sends Python console input as remote passwords
  crit: hostile
  conf: 0.99
  attack: T1056,T1041
  all:
  - id: objectives/exfiltration/stealer/credential/password::python-repl-input-password-relay
  - id: micro-behaviors/process/tty/terminal::python-tty-cbreak-call
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
