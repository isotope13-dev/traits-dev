defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

composite_rules:
- id: objectives/exfiltration/stealer/input::student-form-values-http-upload
  desc: Student selectors and form-value collection with HTTP upload
  crit: hostile
  conf: 0.99
  attack: T1041,T1119
  scope: archive
  for: [crx, xpi, zip, javascript]
  all:
  - id: micro-behaviors/ui/window/dom-access::student-learner-dom-selector-collection
  - id: micro-behaviors/ui/window/dom-access::textarea-batch-value-collection
  - id: micro-behaviors/data/serialize/schema-object::json-user-content-timestamp-payload
  - id: micro-behaviors/communications/url/host/domain-http::js-insecure-remote-http-url
  - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel

- id: objectives/exfiltration/stealer/input::form-values-fallback-upload
  desc: Form-value collection with fallback upload channels
  crit: hostile
  conf: 0.99
  attack: T1041,T1119
  scope: archive
  for: [crx, xpi, zip, javascript]
  all:
  - id: micro-behaviors/ui/window/dom-access::textarea-batch-value-collection
  - id: micro-behaviors/data/serialize/schema-object::json-user-content-timestamp-payload
  - id: micro-behaviors/communications/url/host/domain-http::js-insecure-remote-http-url
  - id: micro-behaviors/communications/http/request/beacon::browser-multi-channel-upload-fallback

