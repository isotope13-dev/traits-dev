defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: native-keyboard-clipboard-ftp-logger
    desc: Keystroke log formatting with clipboard and FTP
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1115,T1048.003
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::native-special-key-html-log-markers
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/communications/ftp/upload::wininet-ftp-put-file
