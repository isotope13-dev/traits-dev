defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript, go, rust]
  attack: T1056,T1041

composite_rules:
  - id: electron-hook-secret-http-export
    desc: Electron credential hooks accompany unverified HTTP export
    crit: hostile
    conf: 0.98
    # Admission is the combined replacement of module and IPC dispatch,
    # password/passphrase inspection, and HTTP body writing with TLS disabled.
    # Do not infer a data-flow edge from same-file evidence.
    near_bytes: 10000
    all:
      - id: micro-behaviors/process/hook/interception::node-module-load-hook
      - id: micro-behaviors/process/hook/interception::electron-ipc-registration-replacement
      - id: metadata/lang/source/syntax/operator::password-passphrase-fallback-expression
      - id: micro-behaviors/communications/http/request/body/construction::request-write-raw-data-variable
      - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
