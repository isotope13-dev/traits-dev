    desc: Wallet substituter exports clipboard text
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::similar-address-clipboard-hijacker
    any:
      - id: micro-behaviors/communications/http/request/body/input::python-post-clipboard-body
      - id: micro-behaviors/communications/http/request/body/input::browser-fetch-clipboard-body
