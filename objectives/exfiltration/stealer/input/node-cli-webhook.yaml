defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-cli-input-near-webhook-https
    desc: CLI input near webhook HTTPS request
    crit: hostile
    conf: 0.98
    attack: T1041
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/encode/url::node-cli-arguments-near-uri-encoding
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
      - id: micro-behaviors/communications/http/request/client/call::https-request
