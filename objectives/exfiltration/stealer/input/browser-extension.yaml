# Live page fields are input, not browser-owned credential databases.
# Both rules require a password value bound to the outgoing JSON POST.
defaults:
  platforms: [unix, windows]
  attack: T1056.003,T1041

composite_rules:
  - id: extension-dom-credential-harvest
    desc: All-URL content script exports captured page credentials
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: micro-behaviors/communications/http/request/credentials::page-password-fields-remote-json-post
      - id: metadata/permission/host::content-script-all-urls

  - id: extension-browser-password-remote-forwarding
    desc: Browser extension forwards captured login credentials to a hardcoded remote host
    crit: hostile
    conf: 0.99
    scope: archive
    for: [javascript, crx, zip, chrome-manifest]
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: micro-behaviors/communications/http/request/credentials::page-password-fields-remote-json-post
    any:
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/manifest::permission-all-urls
