defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-sensitive-find-command
    desc: Root file search targets credential paths
    crit: suspicious
    conf: 0.94
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/search::find-from-filesystem-root
    any:
      - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: node-sensitive-find-http-exfil
    desc: Node recursive secret file HTTP exfil
    crit: hostile
    conf: 0.98
    attack: "T1005, T1552.001, T1041"
    mbc: "E1005, E1552, E1041"
    all:
      - id: node-sensitive-find-command
      - id: objectives/exfiltration/stealer/dev-secret::node-custom-exfil-sink
  - id: node-multi-source-secret-http-exfil
    desc: Node multi-source secret HTTP exfil
    crit: hostile
    conf: 0.99
    attack: "T1552.001, T1552.004, T1552.005, T1041"
    mbc: "E1552, E1041"
    needs: 2
    any:
      - id: micro-behaviors/os/env/modify::node-process-env-object-assignment
      - id: micro-behaviors/os/security/auth/cloud::node-cloud-credential-source-reference
      - id: objectives/exfiltration/stealer/dev-secret::node-developer-secret-file-sources
      - id: node-sensitive-find-command
      - id: micro-behaviors/process/create/vcs/git::node-git-config-remote-harvest
    all:
      - id: objectives/exfiltration/stealer/dev-secret::node-custom-exfil-sink
