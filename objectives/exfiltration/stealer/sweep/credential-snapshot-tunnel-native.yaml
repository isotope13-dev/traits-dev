defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  attack: T1555,T1041

traits:
  - id: native-mcp-snapshot-upload-language
    desc: Snapshot/export upload phrase
    crit: notable
    conf: 0.95
    attack: T1041
    if:
      type: text
      regex: '(?i)\b(upload|send|post)\b.{0,40}\b(snapshot|export)\b'
