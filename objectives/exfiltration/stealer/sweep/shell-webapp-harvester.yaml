defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001, T1041"

composite_rules:
- id: automated-webapp-secret-harvester
  desc: Automated webapp credential harvesting script
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/create/local-exec::nohup-hidden-tmp-script
  - id: harvest-phase-names
  any:
  - id: nexus-phase-callback-url
  - id: micro-behaviors/fs/proc/info/path::process-var-environ
  - id: shell-history-harvest-files
  - id: package-auth-file-harvest
  - id: micro-behaviors/os/container/runtime::serviceaccount-token
  - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
  needs: 2
- id: cloud-kube-webapp-secret-sweep
  desc: Webapp cloud Kubernetes secret sweep
  crit: hostile
  conf: 0.98
  all:
  - id: harvest-phase-names
  any:
  - id: micro-behaviors/os/container/runtime::serviceaccount-token
  - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
  - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
  - id: package-auth-file-harvest
  - id: micro-behaviors/fs/proc/info/path::process-var-environ
  - id: shell-history-harvest-files
  needs: 4
- id: nexus-phase-callback-url
  desc: Phase callback with host and id
  crit: suspicious
  conf: 0.92
  any:
  - id: objectives/exfiltration/http/query::nexus-phase-callback-url--rx-1
  - id: objectives/exfiltration/http/query::nexus-phase-callback-url--rx-2
  - id: objectives/exfiltration/http/query::nexus-phase-callback-url--rx-3
  - id: objectives/exfiltration/http/query::nexus-phase-callback-url--rx-4
  - id: objectives/exfiltration/http/query::nexus-phase-callback-url--rx-5
  - id: objectives/exfiltration/http/query::nexus-phase-callback-url--rx-6
- id: harvest-phase-names
  desc: Credential harvest phase name set
  crit: suspicious
  conf: 0.9
  any:
  - id: objectives/exfiltration/http/query::harvest-phase-env
  - id: objectives/exfiltration/http/query::harvest-phase-cloud
  - id: objectives/exfiltration/http/query::harvest-phase-package-auth
  - id: objectives/exfiltration/http/query::harvest-phase-ssh-token
  - id: objectives/exfiltration/http/query::harvest-phase-history-container
  - id: objectives/exfiltration/http/query::harvest-phase-command-line
  needs: 2
  near_bytes: 1200
# Pairing two history (or package-auth) paths is incomplete alone — fuzzy
# history finders and shell setup scripts name both `.bash_history` and
# `.zsh_history` without harvesting. These stay components for the webapp
# harvester composites above; they are not standalone env-exfil signals.
- id: shell-history-harvest-files
  desc: Two shell or database history files named together
  crit: component
  conf: 0.9
  any:
    - id: micro-behaviors/fs/path/personal::shell-history-then-other-shell-history
    - id: micro-behaviors/fs/path/personal::other-shell-history-then-shell-history
    - id: micro-behaviors/fs/path/personal::shell-history-then-db-history
    - id: micro-behaviors/fs/path/personal::db-history-then-shell-history
    - id: micro-behaviors/fs/path/personal::db-history-then-other-db-history
    - id: micro-behaviors/fs/path/personal::other-db-history-then-db-history
- id: package-auth-file-harvest
  desc: Two package registry credential files named together
  crit: component
  conf: 0.9
  any:
    - id: micro-behaviors/fs/path/secret-config::npmrc-then-pypirc-or-netrc
    - id: micro-behaviors/fs/path/secret-config::pypirc-or-netrc-then-npmrc
    - id: micro-behaviors/fs/path/secret-config::pypirc-then-netrc
    - id: micro-behaviors/fs/path/secret-config::netrc-then-pypirc
