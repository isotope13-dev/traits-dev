defaults:
  platforms: [unix]
  for: [shell]
  attack: T1552.001


composite_rules:
  - id: shell-package-token-bundle
    desc: Shell copies or archives package credential files
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/secret-config::package-manager-credential-path-set
    any:
      - id: micro-behaviors/fs/shell-ops::cp-command
      - id: micro-behaviors/data/archive/create/tar::tar-create

  - id: shell-local-secret-collector
    desc: Shell local secret collector
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/ftp::shell-root-shadow-archive
      - id: objectives/credential-access/ssh/key::shell-ssh-key-copy-loop
      - id: objectives/credential-access/shell/history::shell-history-copy-loop

  - id: shell-credential-bundle-collector
    desc: Shell credential bundle collector
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/credential::shell-cloud-browser-token-bundle
      - id: shell-package-token-bundle
    any:
      - id: objectives/credential-access/ssh/key::shell-ssh-key-copy-loop
      - id: objectives/credential-access/shell/history::shell-history-copy-loop
