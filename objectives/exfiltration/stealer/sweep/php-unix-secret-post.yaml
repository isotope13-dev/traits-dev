defaults:
  platforms: [unix]
  for: [php]
  attack: T1041

composite_rules:
  - id: php-unix-secret-curl-exfil
    desc: PHP Unix secret curl exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/credential::php-unix-secret-file-list
      - id: objectives/exfiltration/http/collect::php-curl-collect-post
    any:
      - id: micro-behaviors/os/env/cloud::php-cloud-secret-key-list
      - id: micro-behaviors/os/env/secret-name::php-generic-secret-key-list

  - id: php-unix-secret-raw-http-exfil
    desc: PHP Unix raw HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::native-exfil-http-post
    any:
      - id: micro-behaviors/fs/path/credential::php-unix-secret-file-list
      - id: micro-behaviors/os/env/cloud::php-cloud-secret-key-list
      - id: micro-behaviors/os/env/secret-name::php-generic-secret-key-list
    needs: 1
