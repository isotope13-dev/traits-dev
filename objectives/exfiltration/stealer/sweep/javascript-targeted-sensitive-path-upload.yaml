defaults:
  platforms: [unix]
  for: [javascript]
composite_rules:
- id: js-external-http-upload-target
  desc: External HTTP upload target
  crit: component
  conf: 0.9
  platforms: [windows, unix]
  # Keep the upload operation and its external destination in the same code
  # region.  Large declaration/source catalogs often contain an upload example
  # and unrelated documentation IPs thousands of lines apart.
  near_lines: 200
  all:
  - id: micro-behaviors/communications/http/upload/
  any:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-source-literal
  - id: micro-behaviors/communications/http/url/external-ip/
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/file/format/structured::sourcemap-inline-base64
  - id: well-known/tool/development/luma::archive-member
- id: js-sensitive-target-file-marker
  desc: Two-plus sensitive-file directory signals in one unit
  crit: component
  conf: 0.6
  platforms: [windows, unix]
  near_lines: 200
  needs: 2
  any:
  - id: objectives/collection/file-targeting/filter/
  - id: objectives/credential-access/cloud/token/
  - id: objectives/credential-access/wallet/
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/path/config/app/
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/file/format/structured::sourcemap-inline-base64
- id: js-targeted-file-upload-exfil
  desc: Targeted file upload exfiltration
  crit: hostile
  conf: 0.97
  platforms: [windows, unix]
  attack: T1041
  mbc: B0030
  # Security regression suites intentionally place unrelated sensitive-path
  # and upload attack examples in the same test file.
  near_lines: 240
  all:
  - id: js-sensitive-target-file-marker
  - id: js-external-http-upload-target
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/file/format/structured::sourcemap-inline-base64
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
