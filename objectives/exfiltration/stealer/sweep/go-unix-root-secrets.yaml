defaults:
  platforms: [unix]
  for: [go, elf]
  attack: T1041

composite_rules:
  - id: go-root-credential-path-list
    desc: Go root credential path list
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/config/accounts::go-system-secret-paths
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/personal::go-root-history-paths
    needs: 2

  - id: go-root-secret-tcp-exfil
    desc: Go root secret TCP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: go-root-credential-path-list
      - id: objectives/collection/archive/stage::go-hidden-dir-file-stash
      - id: objectives/exfiltration/serialization::go-file-exfil-tcp

  - id: go-macos-credential-http-exfil
    desc: Go macOS credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::go-http-collect-post
    any:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
    needs: 1

  - id: go-root-credential-http-exfil
    desc: Go root credential HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: go-root-credential-path-list
    any:
      - id: objectives/exfiltration/http/collect::go-http-collect-post
      - id: micro-behaviors/communications/http/url/telemetry::go-format-collect-url

  - id: go-macho-credential-http-exfil
    desc: Go Mach-O credential exfil
    crit: hostile
    conf: 0.98
    for: [macho]
    all:
      - id: objectives/exfiltration/http/collect::go-macho-http-collect-url
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/password-store::login-data
    needs: 1
