defaults:
  platforms: [unix]
  for: [java, class]
  attack: T1552.001

composite_rules:
  - id: java-db-and-secret-harvest
    desc: Java DB and secret harvest
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/web::java-db-config-path-list
      - id: micro-behaviors/fs/path/credential::java-secret-file-find-list

  - id: java-sensitive-file-harvest
    desc: Java sensitive file harvest
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/account-db::unix-shadow-root-ssh-paths
    any:
      - id: micro-behaviors/fs/path/credential::java-secret-file-find-list
      - id: micro-behaviors/fs/path/config/web::java-db-config-path-list
