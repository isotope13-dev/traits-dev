defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  attack: T1552.001


composite_rules:
  - id: csharp-unix-credential-beacon
    desc: C# Unix credential beacon
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/query::csharp-beacon-creds-param
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-var
      - id: objectives/credential-access/files/password-database::unix-shadow-passwd-path-pair
