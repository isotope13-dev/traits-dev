defaults:
  platforms: [openbsd, bsd, unix]
  for: [shell]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: shell-sensitive-config-http-exfil
    desc: Shell exfiltrates sensitive config
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/upload::curl-post-upload-endpoint
    any:
      - id: micro-behaviors/fs/search::shell-find-etc-files
      - id: micro-behaviors/fs/search::shell-find-home-secrets
      - id: micro-behaviors/fs/search::shell-find-root-readable
      - id: micro-behaviors/os/env/pipeline::shell-vpn-env-secret-filter
      - id: objectives/credential-access/vpn/config::openbsd-shell-vpn-secret-harvest
