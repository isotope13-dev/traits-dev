defaults:
  platforms: [macos]
  attack: "T1041"
  for: [macho]

traits:

composite_rules:
  - id: macos-credential-file-targeting
    desc: Targets credential and remote-access files
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: objectives/collection/file-targeting/filter::ppk-extension
      - id: micro-behaviors/fs/path/private-key::pem-file-extension-reference
      - id: objectives/collection/file-targeting/filter::asc-extension
      - id: objectives/collection/file-targeting/filter::rdp-extension
  # Credential targeting + hardware fingerprinting + network = stealer
  - id: credential-stealer-macos
    desc: "macOS credential stealer"
    crit: hostile
    conf: 0.95
    attack: "T1555"
    mbc: "B0028"
    all:
      - id: objectives/discovery/system/fingerprint/machine-id::macos-hardware-uuid
      - id: objectives/credential-access/validation/check::csidentity-password-auth
      - id: macos-credential-file-targeting
      - id: micro-behaviors/communications/socket/create/
