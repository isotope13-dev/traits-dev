defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1041

composite_rules:
  - id: python-json-request-call
    for: [python]
    desc: Python urllib JSON request
    crit: component
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-symbol
      - id: micro-behaviors/communications/http/header/content-type::python-json-content-type
  - id: python-unix-secret-http-exfil
    for: [python]
    desc: Python Unix secret exfil
    crit: hostile
    conf: 0.98
    near_bytes: 3000
    all:
      - id: python-json-request-call
      - id: micro-behaviors/communications/http/post::python-post-method-literal
    any:
      - id: micro-behaviors/os/env/secret-name::python-env-secret-key-list
      - id: micro-behaviors/fs/path/private-key::python-ssh-secret-files
    needs: 1
