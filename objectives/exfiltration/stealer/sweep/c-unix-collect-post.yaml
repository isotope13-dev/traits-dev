defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: c-unix-credential-http-exfil
    desc: C Unix credential HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/collect::native-collect-http-post
      - id: micro-behaviors/fs/path/credential::c-unix-ssh-token-files
      - id: micro-behaviors/os/env/cloud::gcp-application-credentials-env-name
    any:
      - id: micro-behaviors/os/privilege/paths::etc-shadow
