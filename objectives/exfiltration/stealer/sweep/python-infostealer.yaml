defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: infostealer
    desc: "Python infostealer behavior"
    crit: suspicious
    conf: 0.95
    mbc: "OB0003"
    attack: "T1041"
    near_lines: 160
    needs: 3
    all:
      - id: objectives/discovery/system/
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
    any:
      - id: objectives/credential-access/browser/
      - id: objectives/credential-access/cloud/session/
      - id: objectives/credential-access/discord/
      - id: objectives/credential-access/files/config/
      - id: objectives/credential-access/keychain/
      - id: objectives/credential-access/ssh/key/
      - id: objectives/credential-access/wallet/
      # Every stealer source except sweep/ itself (a directory ref to
      # stealer/ would include this rule).
      - id: objectives/exfiltration/stealer/account-db/
      - id: objectives/exfiltration/stealer/appliance-config/
      - id: objectives/exfiltration/stealer/browser/
      - id: objectives/exfiltration/stealer/cloud/
      - id: objectives/exfiltration/stealer/dev-secret/
      - id: objectives/exfiltration/stealer/env/
      - id: objectives/exfiltration/stealer/file/
      - id: objectives/exfiltration/stealer/input/
      - id: objectives/exfiltration/stealer/keychain/
      - id: objectives/exfiltration/stealer/message/
      - id: objectives/exfiltration/stealer/network-config/
      - id: objectives/exfiltration/stealer/phish/
      - id: objectives/exfiltration/stealer/process-list/
      - id: objectives/exfiltration/stealer/ssh/
      - id: objectives/exfiltration/stealer/surveillance/
      - id: objectives/exfiltration/stealer/system-info/
      - id: objectives/exfiltration/stealer/token/
      - id: objectives/exfiltration/stealer/wallet/
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/proxy-sandbox
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      - id: well-known/app/infrastructure/kubeflow-community::notebook-scripts
      - id: well-known/app/ai/agent-runtime/feral-ai/
      - id: metadata/package/testing/
      # yt-dlp's site extractors log in to the site they download from, so a
      # module such as `extractor/tennistv.py` genuinely pairs a credential
      # POST with an HTTP request and a platform check. That is the
      # downloader's advertised job, not collection for exfiltration.
      - id: well-known/tool/media/yt-dlp::yt-dlp-package-context
