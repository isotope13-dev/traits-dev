defaults:
  platforms: [windows]
  for: [rust]
  attack: T1041

traits:


composite_rules:
  - id: rust-windows-collect-credential-exfil
    desc: Rust Windows collect credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/telemetry::collect-post-request
    any:
      - id: objectives/credential-access/theft/multi-store::rust-developer-credential-filename-cluster
      - id: micro-behaviors/fs/path/password-store::login-data
    needs: 1
