defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-unix-secret-http-exfil
    desc: Node Unix secret HTTP exfil
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: micro-behaviors/fs/path/config/accounts::node-bsd-password-stores
      - id: micro-behaviors/fs/path/public-key::node-root-ssh-targets
      - id: micro-behaviors/fs/path/password-store::node-browser-login-targets
      - id: micro-behaviors/os/env/secret-name::node-env-secret-filter
      - id: micro-behaviors/communications/http/url/endpoint::node-http-collect-post
      - id: objectives/exfiltration/http/collect::node-exfil-endpoint
