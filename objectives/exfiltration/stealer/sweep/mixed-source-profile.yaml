composite_rules:
  - id: windows-domain-recon-http-exfil
    desc: Windows domain and network profile HTTP exfiltration
    crit: hostile
    conf: 0.98
    attack: "T1082,T1041"
    platforms: [windows]
    for: [batch, powershell]
    all:
      - id: objectives/discovery/system/domain-admin-prep::nltest-dclist
      - id: objectives/discovery/system/domain-admin-prep::ipconfig-all
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
  - id: python-profiler
    desc: System profile with browser and wallet exfiltration
    crit: suspicious
    conf: 0.90
    mbc: B0028
    attack: T1555
    platforms: [unix, windows, macos, android, ios]
    for: [python]
    all:
      - id: objectives/discovery/system/
      - id: objectives/exfiltration/http/
    needs: 2
    any:
      - id: objectives/credential-access/browser/multi-target::system-info-with-browser
      - id: objectives/credential-access/wallet/crypto::system-info-with-wallet
