defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1041,T1082

traits:
  - id: read-cwd-package-file
    desc: Script reads current project manifest
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)\$\{systemInfo\.cwd\}/package\.json.{0,120}fs\.readFile\s*\(\s*packageFilePath'

  - id: base64-package-file
    desc: Script encodes manifest data as base64
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'base64File\s*=\s*Buffer\.from\(data\)\.toString\(["\x27]base64["\x27]\)'

  - id: manifest-query-field
    desc: Query includes encoded manifest field
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'file\s*:\s*base64File'

  - id: oast-query-url
    desc: Script interpolates query into OAST URL
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'https://[a-z0-9-]+\.(oast\.(fun|site)|oastify\.com)(/[^`?\s]{0,100})?\?\$\{queryParams\}'

  - id: https-get-query-url
    desc: Calls HTTPS GET with a URL variable
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'https\.get\s*\(\s*url\s*,'

composite_rules:
  - id: node-project-manifest-oast-query
    desc: Script sends encoded project manifest in OAST query
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: read-cwd-package-file
      - id: base64-package-file
      - id: manifest-query-field
      - id: oast-query-url
      - id: https-get-query-url
