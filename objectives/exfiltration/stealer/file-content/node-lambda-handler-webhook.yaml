defaults:
  for:
  - javascript
  platforms:
  - linux
  attack: T1005,T1041
traits:
- id: node-lambda-handler-webhook-post
  desc: Posts Lambda handler source to webhook
  crit: hostile
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((statement_block
        (lexical_declaration (variable_declarator name: (identifier) @report value: (object)))
        (expression_statement (assignment_expression
          left: (member_expression object: (identifier) @report_use)
          right: (call_expression arguments: (arguments (arrow_function body: (call_expression
            function: (member_expression object: (call_expression
              function: (member_expression object: (identifier) @fs property: (property_identifier) @read)
              arguments: (arguments (string (string_fragment) @path))) property: (property_identifier) @slice)))))))
        (lexical_declaration (variable_declarator name: (identifier) @body
          value: (call_expression function: (member_expression object: (identifier) @buffer property: (property_identifier) @from)
            arguments: (arguments (call_expression function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments (identifier) @report_serialized))))))
        (lexical_declaration (variable_declarator name: (identifier) @request
          value: (call_expression function: (member_expression object: (identifier) @https property: (property_identifier) @request_method)
            arguments: (arguments (object
              (pair key: (property_identifier) @host_key value: (string (string_fragment) @host))
              (pair key: (property_identifier) @method_key value: (string (string_fragment) @method)))))))
        (expression_statement (call_expression function: (member_expression object: (identifier) @request_write property: (property_identifier) @write)
          arguments: (arguments (identifier) @body_use)))
        (expression_statement (call_expression function: (member_expression object: (identifier) @request_end property: (property_identifier) @end))))
        (#eq? @report @report_use)
        (#eq? @report @report_serialized)
        (#eq? @fs "fs")
        (#eq? @read "readFileSync")
        (#match? @path "^/var/task/handlers/[^/]+[.]js$")
        (#eq? @slice "slice")
        (#eq? @buffer "Buffer")
        (#eq? @from "from")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @https "https")
        (#eq? @request_method "request")
        (#eq? @host_key "host")
        (#eq? @host "webhook.site")
        (#eq? @method_key "method")
        (#eq? @method "POST")
        (#eq? @request @request_write)
        (#eq? @request @request_end)
        (#eq? @write "write")
        (#eq? @body @body_use)
        (#eq? @end "end"))
composite_rules:
- id: npm-install-lambda-handler-webhook-post
  desc: Install hook sends Lambda handler source
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - zip
  - npm
  - javascript
  - package.json
  all:
  - id: node-lambda-handler-webhook-post
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
