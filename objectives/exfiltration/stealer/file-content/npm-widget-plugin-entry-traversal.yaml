defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1005,T1195.002
  mbc: E1055
traits:
- id: npm-widget-plugin-path-traversal-to-passwd
  desc: Widget plugin entry traverses to /etc/passwd
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /"aipage-widgets"/is
          $b0_1 = /"pluginEntry"\s*:\s*"(\.\.\/){3,}[^"\n]{0,200}\/etc\/passwd"/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 2000 and
                true
              )
            )
          )
      }
composite_rules: []
