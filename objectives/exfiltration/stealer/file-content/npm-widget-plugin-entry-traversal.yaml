defaults:
  platforms: [unix, windows]
  for: [package.json, npm, tar, zip]
  attack: T1005,T1195.002
  mbc: E1055

traits:
  - id: npm-widget-plugin-entry-targets-etc-passwd
    desc: Widget plugin metadata directs its entry point through traversal to /etc/passwd
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)"aipage-widgets"[\s\S]{0,2000}"pluginEntry"\s*:\s*"(?:\.\./){3,}[^"\n]{0,200}/etc/passwd"'

composite_rules:
  - id: npm-widget-plugin-path-traversal-to-passwd
    desc: NPM widget plugin metadata points its loader at /etc/passwd through path traversal
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, package.json]
    scope: archive
    all:
      - id: npm-widget-plugin-entry-targets-etc-passwd
