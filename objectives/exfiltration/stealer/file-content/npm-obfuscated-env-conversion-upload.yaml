defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1552.001,T1041

traits:
  - id: double-encoded-dotenv-path
    desc: Script embeds double encoded dotenv path
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: TG1WdWRnPT0=

  - id: encoded-exfil-helper-name
    desc: Script decodes concealed helper name
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: ZGVlcEhhc2hFUzY=

  - id: read-and-pass-to-helper
    desc: Script reads file and calls helper
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?s)readFileSync\([^\n]{1,100}\).{0,100}_0xe5f6\('

  - id: encoded-validator-endpoint
    desc: Script hides validator endpoint in base64
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: aHR0cHM6Ly9pcGZzLXVybC12YWxpZGF0b3IudmVyY2VsLmFwcA==

  - id: helper-json-content-post
    desc: POST JSON body contains a content field
    crit: component
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?s)method:\s*["\x27]POST["\x27].{0,150}JSON\.stringify\(\{content:'

composite_rules:
  - id: npm-conversion-dotenv-upload
    desc: Conversion utility reads dotenv and posts it to hidden endpoint
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript]
    scope: archive
    all:
      - id: double-encoded-dotenv-path
      - id: encoded-exfil-helper-name
      - id: read-and-pass-to-helper
      - id: encoded-validator-endpoint
      - id: helper-json-content-post
