defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1005,T1041
composite_rules:
  - id: python-cwd-file-gzip-direct-ip-request
    desc: Working-directory reads and direct-IP HTTP POST
    crit: suspicious
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/fs/read/file/content/unspecified::python-cwd-listing-and-binary-open
      - id: micro-behaviors/fs/read/file/content/unspecified::python-file-read-accumulator
      - id: micro-behaviors/data/compress::gzip-compress-call
      - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
      - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
