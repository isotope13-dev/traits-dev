defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1041,T1005
traits:
- id: node-file-post-read-contents
  desc: Reads each target file asynchronously
  crit: notable
  if:
    type: text
    regex: fs\.readFile\(file,\s*["']utf8["'],\s*\(err,\s*data\)
composite_rules:
- id: node-system-file-content-http-post
  desc: Reads system files alongside POST to IP or OAST
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/fs/path/account-db::node-passwd-path-reference
  - id: micro-behaviors/fs/path/config/network::config-hosts
  - id: node-file-post-read-contents
  - id: micro-behaviors/communications/http/request/body/construction::req-write-postdata
  - id: micro-behaviors/communications/http/post::request-options-post-method
  any:
  - id: micro-behaviors/communications/ip/endpoint::node-ipv4-or-oast-endpoint-reference
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
