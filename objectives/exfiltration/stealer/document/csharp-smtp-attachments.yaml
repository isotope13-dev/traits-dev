defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1005,T1041
  mbc: E1041

composite_rules:
  # Enumerating the Documents folder for Office files and attaching every hit
  # to an outbound SMTP message is a document-theft shape. A user-chosen
  # attachment has no enumeration call, so the legs are conjunctive.
  - id: csharp-documents-smtp-attachment-exfil
    desc: C# mails Office documents from the Documents folder
    crit: hostile
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/fs/directory/readdir/language::get-files-token
      - id: micro-behaviors/fs/path/filetype-list::office-document-extension-reference
      - id: micro-behaviors/fs/path/location::dotnet-documents-special-folder
      - id: micro-behaviors/communications/email/send/smtp::smtp-client-send-message
      - id: micro-behaviors/communications/email/send/smtp::smtp-dotnet-attachment-add
