defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: managed-infection-document-disk-upload-references
  desc: Infection disk-search and upload references
  crit: suspicious
  conf: 0.98
  attack: T1041
  if:
    type: yara
    source: "import \"dotnet\"\nrule managed_infection_document_disk_upload {\n  strings:\n    $m_enum = \"EnumerateFiles\"\
      \ ascii fullword\n    $m_ext = \"get_Extension\" ascii fullword\n    $m_drive = \"DriveInfo\" ascii fullword\n\
      \    $m_watch = \"ManagementEventWatcher\" ascii fullword\n    $m_upload = \"UploadFileTaskAsync\" ascii fullword\n\
      \    $u_doc = \".docx\" wide fullword\n    $u_ppt = \".pptx\" wide fullword\n    $u_disk = \"TargetInstance\
      \ ISA 'Win32_LogicalDisk'\" wide\n    $u_event = \"__InstanceCreationEvent\" wide fullword\n    $u_infection\
      \ = \"INFECTIONTYPE\" wide fullword\n  condition:\n    for all of ($m_*) : (\n      for any s in dotnet.streams\
      \ : (\n        s.name == \"#Strings\" and\n        $ in (s.offset..s.offset + s.size - 1)\n      )\n    )\
      \ and\n    for all of ($u_*) : (\n      for any s in dotnet.streams : (\n        s.name == \"#US\" and\n \
      \       $ in (s.offset..s.offset + s.size - 1)\n      )\n    )\n}\n"
composite_rules:
- id: managed-infection-document-disk-upload
  desc: Implant collects and uploads disk documents
  crit: hostile
  conf: 0.98
  all:
  - id: managed-infection-document-disk-upload-references
  - id: objectives/exfiltration/stealer/system-info/identity::managed-infection-domain-report-upload
