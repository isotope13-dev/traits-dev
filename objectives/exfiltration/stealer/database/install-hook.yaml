defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  - shell
  attack: T1195.002
  mbc: E1041
  crit: hostile
  conf: 0.99
composite_rules:
- id: curl-database-recon-oast-exfil
  desc: curl exfils database reconnaissance output to OASTify
  attack: T1041
  for:
  - package.json
  all:
  - id: micro-behaviors/communications/url/host/oob::oastify-url
  - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-http-post
  - id: micro-behaviors/communications/url/http-path::oastify-data-route-reference
  any:
  - id: objectives/discovery/host/software::database-client-root-discovery
  - id: micro-behaviors/fs/write/file/redirect::database-query-output-to-data
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: npm-postinstall-database-recon-oast-exfil
  desc: npm postinstall exfils database reconnaissance to OASTify
  scope: archive
  for:
  - javascript
  - package.json
  - tar
  - zip
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/stealer/database::curl-database-recon-oast-exfil
  unless:
  - id: metadata/package/testing/harness/runtime/
