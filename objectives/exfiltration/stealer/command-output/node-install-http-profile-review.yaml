defaults:
  platforms: [windows, linux]
  for: [javascript, typescript, tar, zip]
  attack: T1195.002,T1041,T1082,T1552.005
  mbc: E1041

composite_rules:
  - id: objectives/exfiltration/stealer/command-output::npm-preinstall-shell-curl-backtick-exfil
    desc: npm preinstall shell posts command output via curl
    crit: hostile
    conf: 0.99
    attack: "T1195.002,T1041,T1059.004"
    for: [npm, tar, zip, package.json, shell]
    # Per-package scope so fetched dependency tarballs pool manifest hooks
    # with the shell script they execute; archive scope missed pkg: subtrees.
    scope: package
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-shell-local-script
    any:
      - id: micro-behaviors/communications/http/curl/body::shell-curl-data-backtick-substitution
      - id: micro-behaviors/communications/http/curl/body::shell-interleaved-var-curl-data-post
