defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1005,T1041,T1059.004
composite_rules:
  - id: node-sensitive-command-and-http-post
    desc: Password-file commands and root search accompany HTTP POST
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/credential-access/files/password-database::node-passwd-shadow-read
      - id: objectives/collection/file-targeting/command::node-sensitive-find-command
      - id: micro-behaviors/process/create/shell/variable-command::js-execsync-cmd-arg
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/request/body/construction::node-module-bound-request-write-end
