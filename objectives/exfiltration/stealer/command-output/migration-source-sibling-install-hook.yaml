defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  - shell
  attack: T1195.002
  mbc: E1041
composite_rules:
- id: curl-data-dir-oast-exfil
  desc: curl exfils /data command output to OASTify
  crit: hostile
  conf: 0.99
  attack: T1041
  for:
  - package.json
  all:
  - id: micro-behaviors/communications/url/host/oob/package::oastify-url
  - id: micro-behaviors/communications/http/curl/body::curl-http-post
  - id: micro-behaviors/fs/directory/readdir/language::shell-data-directory-output-substitution
  - id: well-known/tool/offensive/burp-collaborator::oastify-data-route-reference
- id: npm-postinstall-data-dir-oast-exfil
  desc: npm postinstall exfils /data directory listing to OASTify
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - javascript
  - package.json
  - tar
  - zip
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/stealer/command-output::curl-data-dir-oast-exfil
