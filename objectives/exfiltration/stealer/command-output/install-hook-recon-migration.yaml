defaults:
  mbc: E1041
  for: [javascript, package.json, tar, zip]
  platforms:
  - unix
  - windows
composite_rules:
- id: npm-postinstall-command-output-http-exfil
  desc: NPM postinstall exfiltrates encoded shell command output
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1059.004
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: objectives/exfiltration/http/query::node-command-output-query-exfil
- id: npm-postinstall-encoded-command-beacon
  desc: npm postinstall encodes command output into HTTPS query
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1059.004,T1082
  scope: archive
  near_lines: 100
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/os/sysinfo/report::js-shell-host-identity-pair
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/tls/verify/disable::node-https-get-verification-disabled
