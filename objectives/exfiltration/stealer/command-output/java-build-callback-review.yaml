defaults:
  platforms: [unix, windows]
  for: [jar]

composite_rules:
  - id: java-processor-host-recon-exfil
    for: [jar, class]
    desc: Java processor executes recon and sends callback
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1059,T1041"
    all:
      - id: metadata/package/files/included::java-annotation-processor-service-descriptor
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-annotation-processor-api
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
      - id: objectives/command-and-control/backdoor/tasking/http::jvm-host-output-json-template
