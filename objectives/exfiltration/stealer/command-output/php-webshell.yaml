defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  - id: php-webshell-command-output-post
    desc: PHP webshell configures command-output POST and executes cURL
    crit: hostile
    conf: 0.98
    attack: T1041
    ref: https://www.ic3.gov/CSA/2026/261113.pdf
    near_lines: 12
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-command-webshell
      - id: micro-behaviors/communications/http/curl/binding::command-output-post-body
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
