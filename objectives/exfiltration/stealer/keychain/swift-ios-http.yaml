defaults:
  platforms: [ios]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-ios-keychain-http-exfil
    desc: Swift iOS Keychain HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/verb::swift-urlsession-post-method-reference
      - id: micro-behaviors/os/security/keychain::swift-keychain-output-field
