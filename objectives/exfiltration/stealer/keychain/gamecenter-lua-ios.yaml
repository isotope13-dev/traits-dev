defaults:
  crit: hostile
  platforms: [ios]
  for: [lua]
  attack: T1041,T1555.001

composite_rules:
  - id: lua-gamecenter-keychain-targeting
    desc: Lua GameCenter password extraction via keychain
    crit: suspicious
    conf: 0.92
    all:
      - id: objectives/credential-access/gaming/mobile::gamecenter-string
      - id: micro-behaviors/os/security/keychain::lua-find-generic-password-call
  - id: ios-keychain-credential-exfil
    desc: iOS keychain credentials exfiltration
    conf: 0.96
    all:
      - id: lua-gamecenter-keychain-targeting
    any:
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/post::lua-http-request
      - id: micro-behaviors/communications/socket/connect::lua-tcp-connect
