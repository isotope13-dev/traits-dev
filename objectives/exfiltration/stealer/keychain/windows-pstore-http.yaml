defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: pstore-form-post-exfil
    desc: PStore report co-occurs with form POST sender
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/keychain/extract::pstore-password-report-acquisition
      - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
      - id: micro-behaviors/communications/http/direct-socket::x86-formatted-post-buffer-send
    any:
      - id: micro-behaviors/communications/http/url/scheme::http-url-shaped-text
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url-a-name
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe-with-networking
    unless:
      - id: metadata/signed/platform/
      - id: objectives/exfiltration/stealer/keychain::pstore-password-report-form-post-exfil
  - id: pstore-password-report-form-post-exfil
    desc: Autorun worm PStore reports co-occur with POST sender
    crit: hostile
    conf: 0.99
    attack: T1041,T1555
    all:
      - id: objectives/credential-access/keychain/extract::pstore-password-report-acquisition
      - id: micro-behaviors/data/format/credentials::username-password-report-format
      - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
      - id: micro-behaviors/communications/http/direct-socket::x86-formatted-post-buffer-send
    any:
      - id: micro-behaviors/communications/http/url/scheme::http-url-shaped-text
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url-a-name
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/
      - id: well-known/app/utility/siw::siw-family-identity
