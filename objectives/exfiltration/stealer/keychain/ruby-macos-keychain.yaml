defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1041

composite_rules:
  - id: ruby-discord-keychain-exfil
    desc: Ruby Discord keychain exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: objectives/credential-access/discord/token::ruby-discord-leveldb-path
      - id: micro-behaviors/os/security/keychain::macos-keychain-dump-command
    needs: 1

  - id: ruby-keychain-ssh-harvest
    desc: Ruby keychain SSH harvest
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/keychain::macos-keychain-dump-command
      - id: objectives/credential-access/ssh/key::ruby-ssh-key-collection
