defaults:
  platforms: [unix]
  for: [shell]
  attack: T1555.001

composite_rules:
  - id: shell-safe-storage-http-upload
    desc: Uploads a browser Safe Storage password over HTTP
    crit: hostile
    conf: 0.97
    attack: T1555.001,T1041
    near_bytes: 0
    all:
      - id: micro-behaviors/os/security/keychain::shell-safe-storage-password-stdout
      - id: micro-behaviors/communications/http/request/body::shell-command-result-http-body

  - id: shell-macos-keychain-http-exfil
    desc: Shell macOS keychain exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/keychain/extract::shell-keychain-dump-command
    any:
      - id: objectives/credential-access/keychain/extract::shell-keychain-password-queries
      - id: objectives/credential-access/theft/multi-store::shell-macos-ssh-browser-secrets
    needs: 1

  - id: shell-macos-secret-http-exfil
    desc: Shell macOS secret HTTP exfil
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/upload::shell-curl-octet-upload
    any:
      - id: objectives/credential-access/keychain/extract::shell-keychain-dump-command
      - id: objectives/credential-access/theft/multi-store::shell-macos-ssh-browser-secrets
    needs: 1
