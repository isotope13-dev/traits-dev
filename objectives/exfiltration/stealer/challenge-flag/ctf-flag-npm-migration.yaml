defaults:
  platforms: [unix]
  for: [javascript]
  mbc: E1041

composite_rules:
  - id: node-ctf-env-flag-https-query-exfil
    desc: Node.js sends a CTF flag environment variable in an HTTPS query
    crit: hostile
    conf: 0.995
    for: [javascript, typescript]
    attack: T1041,T1552.001
    all:
      - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
    any:
      - id: micro-behaviors/communications/url/construction/query::encoded-dynamic-url-query-value
      - id: micro-behaviors/communications/url/construction/query::encoded-template-query-parameter
      - id: micro-behaviors/communications/url/construction/query::function-result-template-query-parameter
  - id: browser-ctf-page-flag-harvest-post
    desc: CTF flags scraped from page and posted
    crit: hostile
    conf: 0.98
    attack: T1005,T1041
    all:
      - id: objectives/execution/exploit/network-service/exploit-automation::ctf-flag-search-pattern
      - id: micro-behaviors/data/parse/html::browser-document-html-snapshot-read
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
    near_bytes: 4096
  - id: npm-temporary-flag-oob-exfil
    desc: JavaScript exfiltrates a temporary CTF flag to an OOB collector
    crit: hostile
    conf: 0.99
    attack: T1005,T1041,T1195.002
    all:
      - id: micro-behaviors/fs/path/challenge-flag::temporary-ctf-flag-path
      - id: objectives/exfiltration/stealer/file/selected-path::oob-endpoint-file-exfil
  - id: npm-flag-file-http-exfil
    desc: npm sidecar steals local file via HTTP
    crit: hostile
    conf: 0.995
    attack: T1041
    all:
      - id: objectives/collection/file-targeting/filter::local-file-fallback-targeting
      - id: micro-behaviors/communications/http/request/body/construction::node-direct-ip-http-body
    any:
      - id: metadata/package/files/lifecycle::small-postinstall-js-file
      - id: metadata/file/size::javascript-small-file-5k
  - id: npm-root-ctf-flag-webhook-exfil
    desc: npm package exfiltrates CTF flag search
    crit: hostile
    conf: 0.995
    attack: T1041
    all:
      - id: micro-behaviors/fs/search/content::recursive-root-ctf-flag-grep
      - id: metadata/lang/source/syntax/assignment/value::js-command-output-result-object
      - id: micro-behaviors/communications/http/request/body/construction::req-write-postdata
      - id: micro-behaviors/communications/url/host/oob/endpoint::requestcatcher
    any:
      - id: metadata/import/builtin::child-process-api-destructure
      - id: metadata/import/builtin::require-child-process
  - id: npm-install-root-flag-webhook-query-exfil
    desc: npm install reads a root flag path and sends command output to a webhook query
    crit: hostile
    conf: 0.995
    for: [npm, zip, package.json, javascript, data]
    scope: package
    attack: T1005,T1041,T1195.002
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/fs/read/file/target::shell-cat-root-or-home-path
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/url/construction/query::encoded-dynamic-url-query-value
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
      - id: micro-behaviors/communications/http/request/body/construction::node-http-module-require
      - id: micro-behaviors/communications/http/request/body/construction::node-https-module-require
  - id: npm-container-flag-exfil
    desc: npm postinstall exfiltrates container flag
    crit: hostile
    conf: 0.995
    attack: T1005
    all:
      - id: micro-behaviors/fs/path/challenge-flag::container-flag-path
      - id: micro-behaviors/communications/http/request/body/construction::node-direct-ip-http-body
    any:
      - id: metadata/package/files/lifecycle::small-postinstall-js-file
      - id: metadata/package/files/included::postinstall-js-basename
  - id: node-flag-file-webhook-query-exfil
    desc: Node reads flag files and sends their contents in a webhook query
    crit: hostile
    conf: 0.995
    for: [javascript, typescript]
    attack: T1005,T1041
    all:
      - id: micro-behaviors/fs/path/challenge-flag::flag-file-root-path
      - id: micro-behaviors/fs/read/file/target::node-file-read-near-resource-path
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
  - id: npm-postinstall-flag-file-webhook-query-exfil
    desc: npm postinstall reads flag files and exfiltrates them to a webhook
    crit: hostile
    conf: 0.995
    scope: archive
    for: [npm, package.json, javascript, zip, tar]
    attack: T1195.002,T1005,T1041
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: node-flag-file-webhook-query-exfil
  - id: node-root-flag-command-webhook-query-exfil
    desc: Node runs a root flag read and sends output to a webhook
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: T1005,T1041
    near_bytes: 2000
    all:
      - id: micro-behaviors/fs/read/file/target::shell-cat-root-or-home-path
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
