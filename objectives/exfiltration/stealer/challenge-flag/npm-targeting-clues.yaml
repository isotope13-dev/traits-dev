defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  mbc: E1041

traits:
- id: node-console-log-flag-variable
  desc: Node console logs a flag variable
  crit: suspicious
  conf: 0.97
  for: [javascript, typescript]
  if:
    type: text
    case_insensitive: true
    exclude_comments: true
    regex: 'console\.log\(\s*[^,\r\n]{1,82},\s*([\w$.]+\.)?(ctf_?|secret_?)?flag\s*[,)]'
- id: node-console-log-base64-value
  desc: Console logs a variable named Base64
  crit: notable
  conf: 0.97
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression) @callee
        arguments: (arguments (identifier) @value))
       (#eq? @callee "console.log")
       (#match? @value "(?i)^(raw_)?(b64|base64)$"))

composite_rules:
- id: npm-install-flag-harvest-exfil
  desc: Install hook exfils flag files
  crit: hostile
  conf: 0.995
  attack: T1005
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/fs/search/name::flag-file-hunt
  any:
  - id: metadata/lang/source/naming/target::callback-label-flag-file
  - id: micro-behaviors/fs/read/file/content/whole::read-node
  - id: micro-behaviors/communications/http/webhook::webhook-get-type-data
- id: npm-postinstall-prints-local-ctf-secret
  desc: Postinstall exposes a local CTF secret in logs
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1005,T1552.001
  for: [zip, npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/description/function::npm-ctf-description
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: micro-behaviors/fs/read/file/target::node-file-read-near-resource-path
  any:
  - id: node-console-log-flag-variable
  - id: node-console-log-base64-value
- id: js-flag-harvest-exfil
  desc: JS exfils flag file data
  crit: hostile
  conf: 0.995
  attack: T1005
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/fs/search/name::flag-file-hunt
  - id: metadata/lang/source/naming/target::callback-label-flag-file
  any:
  - id: micro-behaviors/fs/read/file/content/whole::read-node
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: metadata/lang/source/naming/target::typed-recon-callback-labels
- id: npm-postinstall-ctf-flag-exfil
  desc: npm postinstall exfiltrates CTF flag env var
  crit: hostile
  conf: 0.99
  attack: T1041
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag
  - id: micro-behaviors/communications/http/request/client::https-request
  any:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/request/verb::post-method-text
