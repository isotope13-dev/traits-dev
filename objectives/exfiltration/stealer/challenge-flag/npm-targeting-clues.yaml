defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  mbc: E1041

composite_rules:
- id: npm-install-flag-harvest-exfil
  desc: Install hook exfils flag files
  crit: hostile
  conf: 0.995
  attack: T1005
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/fs/search/name::flag-file-hunt
  any:
  - id: metadata/lang/source/naming/target::callback-label-flag-file
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
  - id: micro-behaviors/communications/http/webhook::webhook-get-type-data
- id: js-flag-harvest-exfil
  desc: JS exfils flag file data
  crit: hostile
  conf: 0.995
  attack: T1005
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/fs/search/name::flag-file-hunt
  - id: metadata/lang/source/naming/target::callback-label-flag-file
  any:
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: metadata/lang/source/naming/target::typed-recon-callback-labels
- id: npm-postinstall-ctf-flag-exfil
  desc: npm postinstall exfiltrates CTF flag env var
  crit: hostile
  conf: 0.99
  attack: T1041
  for:
  - npm
  - tar
  - zip
  - pe
  - scripts
  - source
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag
  - id: micro-behaviors/communications/http/request/client::https-request
  any:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/request/verb::post-method-text
