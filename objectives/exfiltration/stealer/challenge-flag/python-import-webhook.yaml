defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1005,T1041,T1195.002
  mbc: E1041

composite_rules:
- id: python-import-time-flag-webhook-exfil
  desc: Import-time CTF flag upload to webhook
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  - id: micro-behaviors/fs/path/challenge-flag::ctf-flag-open-path
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/url/host/oob/endpoint::python-webhook-site-uuid-literal
  - id: micro-behaviors/communications/http/upload/body::python-http-post-body
