defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  attack: T1041,T1552.001
composite_rules:
- id: ctf-flag-http-query-exfiltration
  desc: CTF flag sent to remote HTTP query
  crit: hostile
  conf: 0.98
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/construction/query::encoded-template-query-parameter
  - id: micro-behaviors/communications/http/request/client/call::https-request
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  any:
  - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag
  - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag-bracket
- id: ctf-flag-dynamic-http-query-exfiltration
  desc: CTF flag encoded into remote HTTP query
  crit: hostile
  conf: 0.98
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/construction/query::encoded-dynamic-url-query-value
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
  - id: micro-behaviors/communications/http/request/body/construction::request-end-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  any:
  - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag
  - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag-bracket
