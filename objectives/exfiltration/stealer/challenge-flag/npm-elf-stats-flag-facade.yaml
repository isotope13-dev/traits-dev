defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1005,T1083

traits:
  - id: node-elf-stats-flag-pattern
    desc: Searches file content for challenge flags
    crit: notable
    if:
      type: text
      substr: "content.includes('XMAS{')"
  - id: node-elf-stats-opt-search
    desc: Searches opt tree for a flag
    crit: notable
    if:
      type: text
      substr: "findFlag('/opt')"
  - id: node-elf-stats-gifts-facade
    desc: Places flag in gift statistics
    crit: suspicious
    if:
      type: text
      substr: 'giftsWrapped: flag'
  - id: node-elf-stats-proxy-export
    desc: Exports function and property stats facade
    crit: notable
    if:
      type: text
      substr: 'new Proxy(buildStats'
  - id: node-elf-stats-santa-file
    desc: Targets Santa challenge file
    crit: notable
    if:
      type: text
      substr: '/opt/santa-list.txt'
  - id: node-elf-stats-flag-read
    desc: Reads targeted challenge file
    crit: notable
    if:
      type: text
      substr: 'fs.readFileSync(FLAG_PATH'
  - id: node-elf-stats-efficiency-facade
    desc: Places file contents in efficiency statistic
    crit: suspicious
    if:
      type: text
      regex: 'efficiency:\s*flag\s*\|\|\s*[0-9]{1,6}'
  - id: node-elf-stats-directory-field
    desc: Exposes collected directory as statistics
    crit: suspicious
    if:
      type: text
      substr: "santa_list_info: exploreDir('/opt')"
  - id: node-elf-stats-directory-file-copy
    desc: Copies local file contents into results
    crit: notable
    if:
      type: text
      substr: 'result.files[e.name] = content.slice('
  - id: node-elf-stats-recursive-listing
    desc: Lists opt tree for statistics
    crit: notable
    if:
      type: text
      substr: "listDirRecursive('/opt', 2)"
  - id: node-elf-stats-message-content
    desc: Adds file contents to message
    crit: notable
    if:
      type: text
      substr: 'message += content'
  - id: node-elf-stats-message-export
    desc: Exports a message with statistics
    crit: notable
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[^}]{0,200}\bmessage\b[^}]{0,200}\bgiftsWrapped\b'
  - id: node-elf-stats-candidate-flag
    desc: Targets opt challenge flag file
    crit: notable
    if:
      type: text
      substr: '/opt/flag.txt'
  - id: node-elf-stats-candidate-read
    desc: Reads candidate challenge file
    crit: notable
    if:
      type: text
      substr: "fs.readFileSync(p, 'utf8')"
  - id: node-elf-stats-santas-list-field
    desc: Places flag in Santa list field
    crit: suspicious
    if:
      type: text
      substr: 'santasList: flag'
  - id: node-elf-stats-listing-field
    desc: Places file listing in gift statistic
    crit: suspicious
    if:
      type: text
      regex: 'giftsWrapped:\s*(listing|info)\b'
  - id: node-elf-stats-direct-opt-listing
    desc: Lists opt directory contents
    crit: notable
    if:
      type: text
      substr: "fs.readdirSync('/opt'"
  - id: node-elf-stats-walk-opt
    desc: Walks opt directory contents
    crit: notable
    if:
      type: text
      substr: "walk('/opt')"
  - id: node-elf-stats-build-export
    desc: Exports stats builder function
    crit: notable
    if:
      type: text
      substr: 'module.exports = buildStats'
  - id: node-staged-stats-file-value
    desc: Stages function result as gift statistic
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration name: (identifier) @source body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @candidates value: (array
              (string (string_fragment) @flag_path))))
            (for_in_statement left: (identifier) @file right: (identifier) @iterable body: (statement_block
              (try_statement body: (statement_block
                (return_statement (call_expression function: (member_expression
                  object: (identifier) @fs property: (property_identifier) @read)
                  arguments: (arguments (identifier) @file_used)))))))))
          (lexical_declaration (variable_declarator name: (identifier) @data
            value: (call_expression function: (identifier) @called)))
          (expression_statement (assignment_expression
            left: (member_expression object: (identifier) @module
              property: (property_identifier) @exports)
            right: (object (pair key: (property_identifier) @key
              value: (identifier) @result)))))
          (#eq? @source @called)
          (#eq? @flag_path "/opt/flag.txt")
          (#eq? @candidates @iterable)
          (#eq? @file @file_used)
          (#eq? @fs "fs")
          (#eq? @read "readFileSync")
          (#eq? @data @result)
          (#eq? @module "module")
          (#eq? @exports "exports")
          (#eq? @key "giftsWrapped"))

composite_rules:
  - id: node-staged-stats-flag-facade
    desc: Stages flag contents as gift statistics
    crit: hostile
    conf: 0.98
    all:
      - id: node-staged-stats-file-value
      - id: node-elf-stats-candidate-flag
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  - id: node-elf-stats-flag-facade
    desc: Exposes discovered flag as gift statistics
    crit: hostile
    conf: 0.99
    all:
      - id: node-elf-stats-flag-pattern
      - id: node-elf-stats-opt-search
      - id: node-elf-stats-gifts-facade
      - id: node-elf-stats-proxy-export
  - id: node-elf-stats-santa-file-facade
    desc: Exposes Santa file as efficiency statistic
    crit: hostile
    conf: 0.99
    all:
      - id: node-elf-stats-santa-file
      - id: node-elf-stats-flag-read
      - id: node-elf-stats-efficiency-facade
  - id: node-elf-stats-directory-facade
    desc: Exposes local file contents as statistics
    crit: hostile
    conf: 0.99
    all:
      - id: node-elf-stats-directory-field
      - id: node-elf-stats-directory-file-copy
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
  - id: node-elf-stats-message-facade
    desc: Exposes local file contents in stats message
    crit: hostile
    conf: 0.99
    all:
      - id: node-elf-stats-recursive-listing
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: node-elf-stats-message-content
      - id: node-elf-stats-message-export
  - id: node-elf-stats-candidate-flag-facade
    desc: Exposes candidate flag in Santa list field
    crit: hostile
    conf: 0.99
    all:
      - id: node-elf-stats-candidate-flag
      - id: node-elf-stats-candidate-read
      - id: node-elf-stats-santas-list-field
  - id: node-elf-stats-listing-facade
    desc: Exposes opt listing as gift statistics
    crit: hostile
    conf: 0.99
    all:
      - id: node-elf-stats-listing-field
      - id: node-elf-stats-build-export
    any:
      - id: node-elf-stats-direct-opt-listing
      - id: node-elf-stats-walk-opt
