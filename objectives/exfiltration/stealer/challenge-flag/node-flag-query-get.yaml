defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1005,T1041

traits:
  - id: node-flag-query-get
    desc: Sends local flag contents in HTTPS URL
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @data
            value: (call_expression function: (member_expression
              object: (identifier) @fs property: (property_identifier) @read)
              arguments: (arguments (string (string_fragment) @file)))))
          (lexical_declaration (variable_declarator name: (identifier) @url
            value: (binary_expression left: (string (string_fragment) @prefix)
              right: (call_expression function: (identifier) @encode
                arguments: (arguments (identifier) @data_used)))))
          (expression_statement (call_expression function: (member_expression
            object: (call_expression function: (member_expression
              object: (identifier) @https property: (property_identifier) @get)
              arguments: (arguments (identifier) @url_used))
            property: (property_identifier) @on))))
          (#eq? @fs "fs")
          (#eq? @read "readFileSync")
          (#match? @file "(?i)^/(tmp|opt)/[^/]*flag[^/]*$")
          (#match? @prefix "^https://")
          (#eq? @encode "encodeURIComponent")
          (#eq? @data @data_used)
          (#eq? @https "https")
          (#eq? @get "get")
          (#eq? @url @url_used)
          (#eq? @on "on"))
