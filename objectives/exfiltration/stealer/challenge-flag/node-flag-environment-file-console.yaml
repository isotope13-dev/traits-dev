defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1005,T1552.001
composite_rules:
  - id: node-environment-file-flag-console-report
    desc: Reads environment and container flag, then logs flag
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: objectives/credential-access/env/secrets/ctf::env-ctf-flag
      - id: micro-behaviors/fs/path/challenge-flag::container-flag-path
      - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
      - id: objectives/exfiltration/stealer/challenge-flag::node-console-log-flag-variable
