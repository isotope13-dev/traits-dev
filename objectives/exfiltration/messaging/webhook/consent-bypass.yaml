defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, xpi, crx, zip]

composite_rules:
  - id: discord-file-upload-empty-consent-check
    desc: Discord file upload bypasses empty consent check
    crit: hostile
    conf: 0.98
    attack: T1041,T1567.004
    scope: archive
    all:
      - id: objectives/evasion/security-bypass/policy/access-control::empty-consent-branch-before-upload
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/communications/http/form::javascript-formdata-file-field
