defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: objectives/exfiltration/messaging/webhook::discord-exfiltration-with-file-and-cookie-permission
  desc: Discord exfiltration with file form and cookie permission
  crit: hostile
  conf: 0.99
  attack: T1119,T1041,T1567.004
  scope: archive
  for: [xpi, crx, zip, json, chrome-manifest, javascript]
  unless:
  - id: well-known/app/browser-extension/quizfetch::gecko-addon-id
  - id: well-known/app/browser-extension/quizfetch::config-object
  all:
  - id: objectives/exfiltration/messaging/webhook::discord-exfiltration
  - id: metadata/permission/cookie::permission-cookies
  - id: micro-behaviors/communications/http/form::javascript-formdata-file-field

