defaults:
  for: [python]
  platforms: [windows, unix]

traits:
  # The env read supplies the operator's own webhook only when set. The `or`
  # fallback makes the embedded webhook the destination for every installer
  # who leaves the variable unset.
  - id: python-webhook-env-or-fallback
    desc: Python webhook env read with fallback
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getenv\(\s*["''][A-Z_]{0,40}WEBHOOK[A-Z_]{0,20}["'']\s*\)\s{0,40}or\b'

composite_rules:
  - id: python-builtin-discord-webhook-fallback
    desc: Python falls back to an embedded Discord webhook
    crit: hostile
    conf: 0.9
    attack: T1041,T1567.002
    near_lines: 3
    all:
      - id: python-webhook-env-or-fallback
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-credential
