defaults:
  platforms:
  - unix
  - windows
  - fortios
  crit: suspicious
  attack: T1041
  mbc: B0030
  for:
  - scripts
  - binaries
traits:
- id: builtin-http-transports-doc-marker
  desc: Built-in HTTP transports documentation marker
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: built-in HTTP transports
- id: webhook-channel-url-validation-marker
  desc: Webhook URL validation message marker
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: webhook channel requires 'webhook_url'
- id: script-hook-download-url-marker
  desc: Script hook download URL marker
  crit: baseline
  conf: 0.9
  if:
    type: string_literal
    regex: https?://.{1,160}/hooks/.{1,160}\.(sh|bash|ps1)\b
- id: systeminfo-result-to-request-body
  desc: getSystemInfo result enters request body
  crit: component
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |
      ((function_declaration
        body: (statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @origin
              value: (call_expression
                function: (identifier) @producer)))
          (try_statement
            body: (statement_block
              (lexical_declaration
                (variable_declarator
                  value: (await_expression
                    (call_expression
                      function: (_) @method
                      arguments: (arguments
                        (object
                          (pair
                            key: (_) @body_key
                            value: (object
                              (pair
                                key: (_) @profile_key
                                value: (identifier) @sink)))))))))))))
       (#eq? @producer "getSystemInfo")
       (#match? @method "request")
       (#match? @body_key "body")
       (#match? @profile_key "systemInfo")
       (#eq? @origin @sink))
- id: webhook-ip-field-forward
  desc: Webhook followed by IP payload field
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(webhook|hooks)[\s\S]{0,160}["'']ip["'']\s*:'
- id: webhook-ip-field-reverse
  desc: IP payload field followed by webhook
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '["'']ip["'']\s*:[\s\S]{0,160}(webhook|hooks)'
- id: python-default-webhook-url-constant
  desc: Python default webhook URL constant
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: DEFAULT_WEBHOOK_URL\s*=\s*["']https?://
