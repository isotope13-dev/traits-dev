defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1041,T1082,T1033

traits:
  - id: python-host-user-system-fields
    desc: Report names host, user and OS fields
    crit: notable
    if:
      type: text
      regex: '(?i)hostname\s*:.{0,100}whoami\s*:.{0,100}os_info\s*:'

composite_rules:
  - id: python-install-slack-host-report
    desc: Install hook posts host reconnaissance to Slack
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-post
      - id: micro-behaviors/os/sysinfo/profile::python-systeminfo-popen
      - id: micro-behaviors/process/stdio/read::python-os-popen-read
      - id: python-host-user-system-fields
