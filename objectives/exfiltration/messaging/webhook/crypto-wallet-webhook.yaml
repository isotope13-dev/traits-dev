defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1041,T1567.002

composite_rules:
  - id: js-wallet-key-axios-discord-webhook
    desc: Wallet key posted to Discord via Axios
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/discord::js-axios-post-discord-webhook
      - id: micro-behaviors/communications/http/request/body/credential::js-axios-post-wallet-key-body
  - id: js-wallet-key-https-discord-webhook
    desc: Wallet key posted to Discord via https.request
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/discord::js-https-request-post-discord-webhook
      - id: micro-behaviors/communications/http/request/body/credential::js-https-request-writes-wallet-key
    near_bytes: 1000
