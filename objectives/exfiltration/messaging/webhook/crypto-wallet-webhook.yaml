defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1041,T1567.002

composite_rules:
  - id: js-wallet-key-axios-discord-webhook
    desc: Wallet private key or WIF posted to Discord webhook via Axios
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/crypto/key/representation/encoded::js-axios-post-discord-webhook
    any:
      - id: micro-behaviors/crypto/key/representation/encoded::js-bitcore-private-key-wif
      - id: micro-behaviors/crypto/key/representation/encoded::js-wallet-private-key-content-template
      - id: micro-behaviors/crypto/key/representation/encoded::js-wallet-validator-log-backdoor-param
      - id: micro-behaviors/crypto/key/representation/reference::privatekey-identifier
