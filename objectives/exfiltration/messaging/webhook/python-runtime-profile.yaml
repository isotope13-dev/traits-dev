defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1041,T1082,T1567.002
  mbc: E1041

# This sample passes a Discord webhook URL to os.getenv as the key, then uses
# the returned value as the request destination. That likely breaks delivery
# unless the environment supplies that unusual key, so the composite describes
# an attempted profile export rather than claiming a successful transfer.
traits:
  - id: python-version-profile-field
    desc: Builds Python version profile field
    crit: notable
    if:
      type: text
      regex: 'Python Version[\s\S]{0,80}platform\.python_version\(\)'
  - id: python-os-profile-field
    desc: Builds OS name profile field
    crit: notable
    if:
      type: text
      regex: 'Operating System[\s\S]{0,80}platform\.system\(\)'

composite_rules:
  - id: python-discord-runtime-profile-export
    desc: Python telemetry attempts profile export to Discord
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-credential
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: python-version-profile-field
      - id: python-os-profile-field
