# A batch "cleaner" that posts a passwords archive to a Discord webhook.
# The webhook URL and the curl -F upload are different lines; the archive
# name is what makes the upload a credential theft rather than a status ping.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1041
  crit: notable
  conf: 0.9
traits:
  - id: batch-curl-passwords-archive
    desc: Curl uploads a passwords archive
    if:
      type: text
      regex: '(?i)\bcurl\b[^\r\n]{0,700}passwords\.zip'
  - id: batch-powershell-rest-method
    desc: Batch executes PowerShell Invoke-RestMethod
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Invoke-RestMethod.{0,60}-Method\s+Post'
  - id: batch-powershell-webclient-upload
    desc: Batch executes PowerShell UploadFile
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.UploadFile\s*\([^)\n]{1,60}\)'

composite_rules:
  - id: batch-powershell-webhook-post
    desc: Batch executes PowerShell webhook POST
    crit: component
    conf: 0.95
    any:
      - id: batch-powershell-rest-method
      - id: batch-powershell-webclient-upload
  - id: batch-discord-password-archive-exfil
    desc: Batch posts a password archive to Discord
    crit: hostile
    conf: 0.97
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: batch-curl-passwords-archive
  - id: batch-discord-webhook-credential-exfil
    desc: Batch exfiltrates credentials via Discord webhook
    crit: hostile
    conf: 0.98
    attack: T1041,T1567.002,T1059.001
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: batch-powershell-webhook-post
    any:
      - id: micro-behaviors/fs/path/password-store::batch-firefox-credential-store-locations
      - id: micro-behaviors/data/db/leveldb::leveldb-ref
      - id: objectives/credential-access/wifi::netsh-wlan-key-clear
