# A batch "cleaner" that posts a passwords archive to a Discord webhook.
# The webhook URL and the curl -F upload are different lines; the archive
# name is what makes the upload a credential theft rather than a status ping.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1041
  crit: notable
  conf: 0.9
traits:
  - id: batch-curl-passwords-archive
    desc: Curl uploads a passwords archive
    if:
      type: text
      regex: '(?i)\bcurl\b[^\r\n]{0,700}passwords\.zip'

composite_rules:
  - id: batch-discord-password-archive-exfil
    desc: Batch posts a password archive to Discord
    crit: hostile
    conf: 0.97
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: batch-curl-passwords-archive
