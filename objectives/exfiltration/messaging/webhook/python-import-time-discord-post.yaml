defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1041,T1567.002

# A Python module that calls one of its own functions at module scope, and that
# function JSON-encodes a body and POSTs it to a Discord webhook literal, reports
# to the webhook owner as soon as anything imports the package. Nothing else in
# the file has to be malicious for this to be an exfiltration beacon: the
# import-time call and the webhook POST are the whole behaviour. The three legs
# share one source file, so the composite is file-scoped.
#
# Worked example: bloomcredit_python 99.3.0 whose __init__.py builds a
# {"content": "Exploited"} payload, sends it with urllib.request.urlopen to a
# hardcoded discord.com/api/webhooks/<id>/<token> URL, and calls
# trigger_exploit() at module scope.
composite_rules:
  - id: python-import-time-discord-webhook-post
    desc: Module-scope call POSTs JSON to a Discord webhook
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/request/json::urllib-request-json-keyword-body
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-split
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
