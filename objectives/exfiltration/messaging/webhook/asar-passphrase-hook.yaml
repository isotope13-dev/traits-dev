defaults:
  platforms: [windows, unix]
  for: [c, cpp, pe, javascript, typescript]
  attack: T1041,T1567.002

composite_rules:
  - id: js-passphrase-capture-discord-webhook
    desc: Passphrase capture hook posts to Discord
    crit: hostile
    conf: 0.99
    near_bytes: 8000
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/ui/controls/wallet::wallet-passphrase-set-event-literal
      - id: objectives/credential-access/wallet/desktop::inserted-passphrase-event-hook
    any:
      - id: micro-behaviors/fs/path/application/bundle::app-asar-path-mention
      - id: micro-behaviors/data/archive/create/asar::asar-pickle-format-strings
      - id: micro-behaviors/fs/path/credential/wallet::wallet-app-directory-literal
