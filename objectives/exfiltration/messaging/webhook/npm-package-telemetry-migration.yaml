defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: E1041
  attack: T1041,T1567.002
composite_rules:
  - id: npm-default-feishu-record-webhook-exfil
    desc: Defaults sensitive app logs to an embedded Feishu webhook
    crit: hostile
    conf: 0.99
    scope: archive
    for:
      - npm
      - tar
      - javascript
    all:
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-hardcoded-incoming-webhook
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-record-body-builder
    any:
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-provider-fallback
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-import-provider-fallback
  - id: npm-feishu-error-hook-record-exfil
    desc: Sensitive record posted to an embedded Feishu error hook
    crit: hostile
    conf: 0.98
    scope: archive
    for:
      - npm
      - tar
      - javascript
    all:
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-hardcoded-error-hook
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/services/feishu-lark::feishu-record-body-builder
