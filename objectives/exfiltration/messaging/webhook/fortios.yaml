# FortiGate automation tasks expose the output of a preceding CLI script as
# `%%results%%`. Combining that output placeholder with a Slack incoming
# webhook and the administrator-password query captures the exfiltration path
# shown in the incident, without depending on task names or a specific account.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  attack: T1041,T1567.004

traits:
  - id: fortios-automation-results-placeholder
    desc: References FortiOS automation output
    crit: component
    conf: 0.95
    if:
      type: string_literal
      exact: "%%results%%"

composite_rules:
  - id: fortios-admin-password-slack-exfiltration
    desc: FortiOS automation sends queried administrator password data to Slack
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: objectives/credential-access/vpn/config::fortios-admin-encrypted-password-query
      - id: micro-behaviors/communications/http/services/slack::slack-incoming-webhook-url
      - id: fortios-automation-results-placeholder
