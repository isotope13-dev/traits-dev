defaults:
  platforms: [android]
  for: [java]

composite_rules:
  # Deliberately suspicious: static proximity establishes neither consent nor
  # data flow from the cursor into the request. A local SMS viewer or a model
  # client alone must not match. Destination and model names can change.
  - id: android-sms-query-model-upload
    desc: SMS collection near model API request-body writes
    crit: suspicious
    conf: 0.93
    attack: T1636.004
    ref: https://zimperium.com/blog/arcticrat-ai-powered-android-rat
    near_bytes: 1800
    all:
      - id: micro-behaviors/communications/ipc/content-provider::android-sms-content-provider-query
      - id: micro-behaviors/communications/http/model::chat-completions-endpoint
      - id: micro-behaviors/communications/http/request/body/write::java-urlconnection-body-stream-write

  # Co-occurrence does not establish unauthorized access or a data flow.
  - id: android-sms-model-upload-lock-change
    desc: SMS collection near model upload with screen-lock modification
    crit: suspicious
    conf: 0.97
    attack: T1636.004,T1041
    all:
      - id: android-sms-query-model-upload
      - id: objectives/evasion/security-bypass/policy/mobile::android-credential-check-and-lock-change
