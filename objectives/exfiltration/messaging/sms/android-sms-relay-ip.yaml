# Incoming SMS sender and body read from the PDU and posted to a server
# addressed by a hardcoded public IP: the relay half of an SMS stealer.
defaults:
  platforms: [android]
  for: [dex]
  crit: hostile
  attack: T1636.004,T1041

composite_rules:
  - id: android-incoming-sms-relayed-to-ip-server
    desc: Relays incoming SMS sender and body to a hardcoded IP server
    conf: 0.92
    all:
      - id: micro-behaviors/os/message/intent::android-dex-sms-pdu-message-read
      - id: micro-behaviors/communications/messaging/send::dex-sms-sender-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/request/client::dex-url-open-connection-call
