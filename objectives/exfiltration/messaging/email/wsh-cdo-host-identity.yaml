# A script reads the computer/user name and sends mail through CDO with
# SMTP credentials stored in the file: host identity leaves the machine by
# email without any client UI. Logon notifiers do this as well, which is why
# the finding is suspicious rather than hostile.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1048.003,T1082

composite_rules:
  - id: wsh-cdo-mails-host-identity
    desc: Emails host identity with stored SMTP login
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/communications/email/send/smtp::wsh-cdo-message-object
      - id: micro-behaviors/communications/email/send/smtp::wsh-cdo-smtp-password-field
      - id: micro-behaviors/os/env/system-info::wsh-expand-computer-or-user-name
