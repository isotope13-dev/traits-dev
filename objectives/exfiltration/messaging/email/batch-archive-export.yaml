defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-archive-email-and-cleanup
    desc: Emails collected archive and deletes staging directory
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/messaging/send::sendsmtp-file-attachment-command
      - id: micro-behaviors/data/archive/create/utility::rar-archive-command
      - id: micro-behaviors/fs/delete/directory::windows-rmdir-recursive
