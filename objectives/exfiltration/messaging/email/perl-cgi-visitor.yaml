defaults:
  platforms: [unix]
  for: [perl]
  attack: T1041
  mbc: E1020

composite_rules:
  - id: perl-sendmail-visitor-beacon
    desc: Mails the CGI visitor address
    crit: hostile
    conf: 0.94
    platforms: [unix, windows]
    for: [perl, static-lib, text]
    all:
      - id: micro-behaviors/communications/email/send/pipe::sendmail-header-mode
      - id: micro-behaviors/process/create/popen::perl-open-write-pipe
      - id: micro-behaviors/communications/http/request/cgi::remote-addr-server-var
