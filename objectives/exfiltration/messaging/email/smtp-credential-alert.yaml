defaults:
  platforms: [android, unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: E1041

traits:
  - id: smtp-credential-alert-sender
    desc: Sends verified SMTP credentials to alerts
    crit: suspicious
    conf: 0.94
    if:
      type: text
      word: sendSmtpAlert
  - id: smtp-alert-recipient-field
    desc: Configures SMTP credential alert recipients
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: alertEmails
