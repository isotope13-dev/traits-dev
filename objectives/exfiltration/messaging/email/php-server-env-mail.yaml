defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1041
  mbc: E1020

composite_rules:
  - id: php-mail-server-environment-beacon
    desc: Mails server environment details to external address
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/email/send/mail-func::hardcoded-recipient-mail
      - id: micro-behaviors/communications/http/request/superglobal::document-root-access
    any:
      - id: micro-behaviors/communications/http/request/cgi::remote-addr-server-var
      - id: micro-behaviors/communications/http/request/cgi::http-referer-server-var
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::server-software-access
