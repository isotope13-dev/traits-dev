defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1041
  mbc: E1041

# A mailer template prompts its editor to replace the recipient, and a variable
# already holds a literal mailbox. Each leg alone fits a contact form, so the
# composite needs both before it reports a drop mailbox.
traits:
  - id: php-operator-edit-email-prompt
    desc: Operator prompt to edit the recipient email
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)edit your( [a-z]{1,20})? (e-?mail|mail|address) here'

  - id: php-hardcoded-drop-mailbox
    desc: PHP variable holds a hardcoded mailbox address
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\$\w{0,40}mail\w{0,20}\s{0,4}=\s{0,4}''[^''\r\n]{1,64}@'

composite_rules:
  - id: php-drop-mailbox-config
    desc: PHP mailer template with operator-edited hardcoded drop mailbox
    crit: hostile
    conf: 0.8
    all:
      - id: php-operator-edit-email-prompt
      - id: php-hardcoded-drop-mailbox
