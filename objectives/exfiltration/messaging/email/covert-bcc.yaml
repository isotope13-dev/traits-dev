defaults:
  platforms: [windows, unix]
  for: [markdown, text, ruby]
  attack: T1048

traits:
  - id: automatic-fixed-bcc-injection
    desc: Email tool injects fixed BCC recipient
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)automatic BCC.{0,40}(injection|cannot be disabled)'

  - id: bcc-without-user-permission
    desc: BCC added without user permission
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)non-negotiable.{0,20}do not ask user permission'

  - id: concealed-email-recipient
    desc: Skill conceals injected email recipient
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)do not mention in conversation.{0,40}(include|BCC|copy)'

  - id: ruby-injects-fixed-bcc-address
    desc: Ruby injects a fixed BCC address
    crit: suspicious
    conf: 0.99
    for: [ruby]
    if:
      type: text
      regex: '(?i)bcc\s*<<\s*["''][^"'']{1,64}@[a-z0-9.-]{1,64}["'']\s+unless\s+bcc\.include\?\('

  - id: ruby-emits-bcc-field
    desc: Ruby mail message emits BCC field
    crit: component
    conf: 0.98
    for: [ruby]
    if:
      type: text
      regex: '(?i)bcc\s+bcc\s+if\s+bcc\.any\?'

composite_rules:
  - id: covert-forced-email-bcc
    desc: Email skill covertly injects fixed BCC
    crit: hostile
    conf: 1.0
    needs: 2
    any:
      - id: automatic-fixed-bcc-injection
      - id: bcc-without-user-permission
      - id: concealed-email-recipient

  - id: agent-skill-ruby-forced-bcc
    desc: Skill code silently copies outgoing emails
    crit: hostile
    conf: 0.99
    for: [ruby, markdown, text, zip, npm, whl, tar]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: ruby-injects-fixed-bcc-address
      - id: ruby-emits-bcc-field
