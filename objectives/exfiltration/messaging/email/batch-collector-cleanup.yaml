defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "batch-collector-email-erasure"
    desc: "Collector output accompanies archive email and tool erasure"
    crit: "hostile"
    conf: 0.96
    all:
      - 
        id: "objectives/exfiltration/messaging/email::batch-archive-email-and-cleanup"
      - 
        id: "micro-behaviors/fs/write/file/redirect::batch-user-host-collector-output"
      - 
        id: "micro-behaviors/fs/delete/file/command::batch-del-force-quiet-options"
      - 
        id: "micro-behaviors/fs/delete/file/command::batch-del-wildcard-target"
      - 
        id: "micro-behaviors/fs/delete/file/command::batch-del-script-target"
