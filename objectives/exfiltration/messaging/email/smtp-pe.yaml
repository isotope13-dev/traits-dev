# Unsigned PEs that speak SMTP HELO and attach MIME base64 are credential
# stealers mailing loot, not mail clients.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1048.003,T1555
  crit: hostile
  conf: 0.94

composite_rules:
  - id: smtp-helo-mime-exfil
    desc: SMTP HELO client attaches MIME base64 loot
    all:
      - id: micro-behaviors/communications/email/send/direct::pe-smtp-helo-format
      - id: micro-behaviors/communications/email/mime::mime-base64-attachment
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: smtp-helo-cached-password
    desc: SMTP client enumerates cached passwords
    all:
      - id: micro-behaviors/communications/email/send/direct::pe-smtp-helo-format
      - id: objectives/credential-access/dump/system::cached-password-enumeration-marker
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: smtp-helo-wininet
    desc: SMTP client also talks WinInet
    all:
      - id: micro-behaviors/communications/email/send/direct::pe-smtp-helo-format
      - id: micro-behaviors/communications/http/client/wininet::wininet-dll-name-reference
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
