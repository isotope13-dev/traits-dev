# An injected WhatsApp page patch collects public-IP and precise location
# data, then sends it through the authenticated WhatsApp session.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1614.001

composite_rules:
  - id: obfuscated-whatsapp-location-exfiltration
    desc: Sends IP and live location through the WhatsApp session
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/messaging/send::wapi-awaits-fragmented-latitude-call
      - id: micro-behaviors/communications/messaging/send::ip-field-near-wapi-coordinate-or-value
      - id: metadata/lang/source/syntax/assignment/name::indexed-helper-moi-assignment
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
