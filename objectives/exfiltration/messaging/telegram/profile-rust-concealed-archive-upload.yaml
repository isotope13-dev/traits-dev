defaults:
  platforms: [unix, windows]
  for: [rust, crate]
  conf: 0.97
composite_rules:
- id: rust-concealed-bot-archive-upload-clues
  desc: ZIP creation and file upload with concealed bot credential
  scope: file
  all:
  - id: objectives/anti-static/obfuscation/string/encoding::rust-xor-macro-bot-credential
  - id: micro-behaviors/fs/directory/enumerate::rust-directory-enumeration-capability
  - id: micro-behaviors/fs/file/open/unspecified::rust-file-open
  - id: micro-behaviors/data/archive/zip::rust-zipwriter-capability
  - id: micro-behaviors/communications/messaging/send::chat-send-document-method
  - id: micro-behaviors/communications/messaging/send::rust-memory-document-input
  - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
  crit: suspicious
