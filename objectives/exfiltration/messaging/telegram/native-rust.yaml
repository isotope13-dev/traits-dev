defaults:
  platforms: [unix, windows]
  for: [binaries]
composite_rules:
  - id: native-rust-sensitive-archive-telegram-upload
    desc: Sensitive archives accompany Telegram document uploads
    crit: hostile
    conf: 0.97
    attack: T1041,T1567.001,T1539
    all:
      - id: micro-behaviors/data/archive/zip::rust-zipwriter-compiled-reference
      - id: micro-behaviors/fs/directory/traverse::rust-walkdir-compiled-reference
      - id: micro-behaviors/communications/http/services/telegram::teloxide-compiled-document-upload
      - id: micro-behaviors/fs/path/token::telegram-session-data-location
      - id: micro-behaviors/fs/path/app-data::compiled-chromium-local-extension-settings-path
