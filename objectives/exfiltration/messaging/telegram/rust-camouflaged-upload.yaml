defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041,T1036

traits:
  - id: rust-telegram-data-uploader
    desc: Rust calls Telegram uploader with data
    crit: notable
    if:
      type: text
      regex: '(?is)TelegramUploader::new\s*\([^;]{1,200};[^}]{0,300}\.upload_data\s*\('
  - id: rust-harvest-upload-function
    desc: Rust exposes harvested-data upload function
    crit: notable
    if:
      type: text
      regex: '(?i)\bfn\s+upload_(harvest|collected|stolen)[a-z_]*\s*\('
  - id: rust-windows-update-startup-message
    desc: Rust source names Windows Update startup
    crit: notable
    if:
      type: text
      regex: '(?i)Windows Update Service (initialized|started)'
  - id: rust-randomized-async-delay
    desc: Rust adds randomized asynchronous delay
    crit: component
    if:
      type: text
      regex: '(?is)rand::random\s*::<[^>]{1,40}>\s*\(\).{0,200}tokio::time::sleep'

composite_rules:
  - id: rust-camouflaged-telegram-harvest-upload
    desc: Rust disguises harvested-data Telegram upload
    crit: hostile
    conf: 0.97
    all:
      - id: rust-telegram-data-uploader
      - id: rust-harvest-upload-function
      - id: rust-windows-update-startup-message
      - id: rust-randomized-async-delay
