# Telegram-backed Electron surveillance and staging.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1113,T1041,T1105
  mbc: B0002,C0002

traits:
  - id: electron-screenshot-routine
    desc: Electron screenshot capture routine
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: takeScreenshot
  - id: electron-payload-materialization-routines
    desc: Electron download routine
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      exact: downloadToFile
  - id: electron-payload-launch-routine
    desc: Electron executePayload routine
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      exact: executePayload
  - id: electron-process-payload-routine
    desc: Electron processOnePayload routine
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      exact: processOnePayload

composite_rules:
  - id: electron-telegram-surveillance-stager
    desc: Electron bundle sends surveillance data through Telegram and stages payloads
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: electron-screenshot-routine
      - id: electron-payload-materialization-routines
      - id: electron-payload-launch-routine
      - id: electron-process-payload-routine
      - id: micro-behaviors/process/create/shell/bridge::execsync-method-literal
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/telegram::telegram-desktop-signed-client-context
