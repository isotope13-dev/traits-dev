# Telegram-backed Electron surveillance and staging.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1113,T1041,T1105
  mbc: B0002,C0002

traits: []
composite_rules:
  - id: electron-telegram-surveillance-stager
    desc: Electron bundle sends surveillance data through Telegram and stages payloads
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/hardware/display/screenshot::take-screenshot-string
      - id: micro-behaviors/fs/write/file/copy::download-to-file-symbol
      - id: objectives/command-and-control/dropper/execution/payload::execute-payload-symbol
      - id: objectives/command-and-control/dropper/execution/payload::process-one-payload-symbol
      - id: micro-behaviors/process/create/shell/bridge::execsync-method-literal
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
