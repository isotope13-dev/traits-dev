defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  attack: T1567
composite_rules:
- id: telegram-hidden-node-system-report
  desc: Telegram hidden system report exfil
  crit: hostile
  conf: 0.96
  for:
  - javascript
  - typescript
  attack: T1041, T1082
  near_bytes: 8192
  all:
  - id: objectives/exfiltration/messaging/telegram/channel-control::telegram-hardcoded-bot-token
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/messaging/send::chat-send-message
  - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
  - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
  any:
  - id: micro-behaviors/os/sysinfo/hostname/command::hostname-cmd
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-content
- id: powershell-telegram-hardcoded-host-exfil
  desc: PowerShell sends host identity to a hardcoded Telegram bot
  crit: hostile
  conf: 0.97
  attack: T1041,T1082,T1567
  mbc: E1041
  for:
  - powershell
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
  - id: objectives/exfiltration/messaging/telegram/channel-control::powershell-telegram-hardcoded-bot-credential
  any:
  - id: micro-behaviors/os/env/system-info::env-computername
  - id: micro-behaviors/os/env/system-info::env-username
  - id: micro-behaviors/os/sysinfo/hostname/command::powershell-hostname-command
  needs: 1
- id: react-native-telegram-mobile-profile-channel
  desc: Hardcoded Telegram logger paired with mobile device profiling
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1614
  mbc: E1041
  for:
  - javascript
  - typescript
  near_bytes: 12000
  all:
  - id: micro-behaviors/os/sysinfo/platform/mobile::react-native-mobile-device-profile
  - id: micro-behaviors/communications/http/services/telegram::telegram-hardcoded-bot-config
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
- id: js-env-collection-for-telegram
  desc: Copies process.env by enumerating its keys
  crit: component
  conf: 0.95
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/os/env/read/collection::js-filtered-env-copy
  - id: micro-behaviors/os/env/read/collection::node-enumerated-env-value-read
- id: js-telegram-bot-credential
  desc: Telegram bot token, plain or base64
  crit: component
  conf: 0.95
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/communications/messaging/telegram::telegram-bot-api-token
  - id: micro-behaviors/communications/http/services/telegram::base64-telegram-bot-token
- id: javascript-telegram-host-environment-exfil
  desc: JavaScript host and environment data sent to Telegram
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1102
  mbc: E1041
  for:
  - javascript
  - typescript
  near_bytes: 8192
  all:
  - id: js-env-collection-for-telegram
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: js-telegram-bot-credential
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
  unless:
  - id: well-known/app/ai/gateway/opencode-router/
  - id: metadata/path/directory::test-directory-component
- id: javascript-telegram-shell-host-profile-exfil
  desc: Shell-collected host profile sent to Telegram
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1033,T1102
  mbc: E1041
  for:
  - javascript
  - typescript
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/hostname/command::node-shell-hostname-command
  - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/communications/http/services/telegram::telegram-hardcoded-bot-config
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  unless:
  - id: metadata/path/directory::test-directory-component
- id: javascript-telegram-shell-host-user-exfil
  desc: Shell-collected hostname and user sent to Telegram
  crit: hostile
  conf: 0.98
  attack: T1041,T1033,T1102
  mbc: E1041
  for:
  - javascript
  - typescript
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/hostname/command::node-shell-hostname-command
  - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
  - id: micro-behaviors/communications/http/services/telegram::telegram-hardcoded-bot-config
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  unless:
  - id: metadata/path/directory::test-directory-component
