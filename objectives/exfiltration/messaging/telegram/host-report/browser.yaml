defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1082
composite_rules:
  - id: browser-ip-profile-telegram
    desc: Public IP lookup and browser profile near Telegram JSON reporting
    crit: suspicious
    conf: 0.95
    near_bytes: 5000
    all:
      - id: micro-behaviors/communications/messaging/telegram::javascript-telegram-json-message
      - id: micro-behaviors/communications/http/ip-discovery/
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
