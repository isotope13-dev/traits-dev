# Batch victim check-in: a hardcoded bot token sends a message built from
# variables, and those variables were captured from hostname or whoami.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1041,T1082,T1102
traits:
  - id: batch-telegram-text-variable
    desc: Telegram text parameter embeds variable
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'sendMessage\?[^\s"]{1,100}text=[^\s"]{0,60}%[A-Za-z0-9_]{1,16}%'
composite_rules:
  - id: batch-telegram-host-identity-report
    desc: Batch sends captured host identity to Telegram bot
    crit: suspicious
    conf: 0.93
    near_lines: 12
    all:
      - id: objectives/exfiltration/messaging/telegram/channel-control::hardcoded-telegram-bot-message-channel
      - id: batch-telegram-text-variable
      - id: micro-behaviors/process/identity/query/command::batch-for-f-host-identity
  - id: batch-hidden-telegram-victim-report-msi-install
    desc: Hidden batch reports host to Telegram then installs remote MSI
    crit: hostile
    conf: 0.95
    attack: T1041,T1082,T1564.003,T1218.007
    all:
      - id: batch-telegram-host-identity-report
      - id: objectives/evasion/process/hidden/execution::batch-powershell-hidden-self-relaunch
      - id: objectives/execution/payload/file-exec/installer/invocation::remote-msi-download-install
