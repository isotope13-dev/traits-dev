defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1041,T1082
traits:
- id: js-report-home-cwd-hostname
  desc: Collects home directory and hostname
  crit: notable
  if:
    type: text
    regex: (?s)os\.homedir\(\).{0,100}process\.cwd\(\).{0,100}os\.hostname\(\)
- id: js-report-telegram-bot-path
  desc: Configures Telegram bot message request
  crit: notable
  if:
    type: text
    regex: (?s)hostname:\s*["']api\.telegram\.org["'].{0,100}/bot\$\{TOKEN\}/sendMessage
- id: js-report-telegram-message-post
  desc: Posts a report to Telegram chat
  crit: notable
  if:
    type: text
    regex: (?s)chat_id:\s*CHAT_ID.{0,60}text:\s*messageText
- id: js-report-https-request-data
  desc: Writes data to an https.request
  crit: notable
  if:
    type: text
    regex: (?s)https\.request\(options.{0,400}req\.write\(data\)
composite_rules:
- id: node-telegram-host-report-exfil
  desc: Sends host and user report to Telegram
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
  - id: js-report-home-cwd-hostname
  - id: js-report-telegram-bot-path
  - id: js-report-telegram-message-post
  - id: js-report-https-request-data
