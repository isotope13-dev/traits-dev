defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
composite_rules:
- id: native-rust-sensitive-archive-telegram-upload
  desc: Sensitive archives accompany Telegram document uploads
  crit: hostile
  conf: 0.97
  attack: T1041,T1567.001,T1539
  all:
  - id: micro-behaviors/data/archive/zip::rust-zipwriter-compiled-reference
  - id: micro-behaviors/fs/directory/traverse::rust-walkdir-compiled-reference
  - id: micro-behaviors/communications/http/services/telegram::teloxide-compiled-document-upload
  - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
  - id: micro-behaviors/fs/path/application/extensions::compiled-chromium-local-extension-settings-path
- id: rust-extension-storage-to-toxid-upload
  desc: Chromium extension storage sent to a Telegram bot
  crit: hostile
  conf: 0.99
  for:
  - rust
  scope: file
  attack: T1555.003,T1560.001,T1041,T1567.001
  all:
  - id: objectives/collection/archive/create::rust-sensitive-appdata-zip-staging
  - id: micro-behaviors/communications/messaging/send::rust-toxid-send-file
  - id: micro-behaviors/communications/messaging/send::rust-hardcoded-chat-id-constant
  near_bytes: 8192
