defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  attack: T1567
composite_rules:
- id: rust-telegram-file-exfiltration
  desc: Rust Telegram bot uploads enumerated local files
  crit: hostile
  conf: 0.98
  attack: T1041,T1083,T1567.001
  for:
  - rust
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
  - id: micro-behaviors/fs/directory/readdir/language::rust-glob-file-enumeration
  - id: micro-behaviors/communications/messaging/send::rust-input-file-upload
  near_bytes: 8192
- id: telegram-hardcoded-file-exfil
  desc: Telegram hardcoded file exfiltration
  crit: hostile
  conf: 0.96
  for:
  - scripts
  - typescript
  - binaries
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
  any:
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-url-token
  - id: micro-behaviors/communications/http/auth::telegram-bot-api-path-token
  unless:
  - id: well-known/app/ai/gateway/opencode-router
- id: python-hardcoded-token-document-exfil
  desc: Hardcoded bot token used to upload documents
  crit: hostile
  conf: 0.97
  attack: T1041,T1567.001
  mbc: E1041
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/communications/http/auth::python-hardcoded-bot-token
  - id: micro-behaviors/communications/messaging/send::chat-send-document
  any:
  - id: micro-behaviors/communications/http/upload/file::python-http-files-parameter
  - id: micro-behaviors/communications/http/request/body/construction::http-post-with-body-argument
  - id: micro-behaviors/communications/messaging/send::chat-send-document-symbol
  downgrade:
    any:
    - id: objectives/exfiltration/stealer/directory-tree::android-storage-walk-file-upload
- id: python-telegram-file-exfiltration
  desc: Python Telegram bot uploads local files
  crit: hostile
  conf: 0.98
  attack: T1074,T1560.001,T1041,T1567.001
  mbc: E1041
  for:
  - python
  scope: file
  unless:
