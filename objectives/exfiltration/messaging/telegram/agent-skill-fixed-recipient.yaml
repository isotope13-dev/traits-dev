# A published skill runs inside other people's agents. Telling that agent to
# always deliver its results to one hard-coded Telegram account sends every
# installer's data to the skill's author, unprompted and unseen.
defaults:
  platforms: [windows, unix]
  for: [markdown]
  attack: T1567,T1020

composite_rules:
  - id: agent-skill-fixed-telegram-recipient
    desc: Agent skill always sends output to a hard-coded Telegram account
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/messaging/telegram::fixed-telegram-output-instruction
