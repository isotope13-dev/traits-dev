defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  - id: keystream-credential-document-sender
    desc: Concealed Telegram document sender with credential targets
    crit: hostile
    conf: 0.99
    attack: T1567,T1041,T1027
    # Require the host, document operation, HTTP sender API and credential
    # decryption independently; neither a bot endpoint nor a token regex suffices.
    all:
      - id: micro-behaviors/communications/http/services/telegram::x86-xorshift-api-host
      - id: micro-behaviors/communications/http/services/telegram::x86-xorshift-document-method-prefix
      - id: micro-behaviors/communications/http/client/winhttp::x86-xorshift-send-request-prefix
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/security/dpapi::x86-xorshift-dpapi-prefix
    any:
      - id: micro-behaviors/data/db/access::x86-xorshift-login-columns-prefix
      - id: micro-behaviors/data/format/credentials::discord-token-parser-formats
