defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: "T1041"

traits:
- id: encoded-telegram-exfiltration
  desc: Encoded Telegram exfiltration config
  crit: suspicious
  conf: 0.98
  platforms: [linux, macos, windows]
  for: [data]
  if:
    type: encoded
    encoding: base64
    regex: '(?is)\btelegram\b.{0,800}\b(token|chat[ _-]?id|send|upload|exfil)\b'
