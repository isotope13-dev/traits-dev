defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1041,T1528,T1567.002

composite_rules:
  - id: telegram-raw-verified-secret-exfil
    desc: Sends serialized raw verified secret-scanner findings through Telegram
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: well-known/tool/detection/sast::trufflehog-verified-filesystem-command
      - id: objectives/exfiltration/serialization::trufflehog-raw-result-message-body
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message

  - id: telegram-decompiled-app-secret-exfil
    desc: Sends secrets harvested from decompiled Android packages through Telegram
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: objectives/credential-access/api-harvest/token::decompiled-android-package-secret-harvest
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message

  - id: telegram-fixed-bot-app-secret-exfil
    desc: Sends decompiled Android package secrets to a hardcoded Telegram bot
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: telegram-decompiled-app-secret-exfil
    any:
      - id: objectives/exfiltration/messaging/telegram::bot-token-pattern
      - id: objectives/exfiltration/messaging/telegram::python-hardcoded-bot-token
