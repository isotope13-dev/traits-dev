# Compiled stealers that conceal the Telegram Bot API host (for example via
# compile-time XOR/obfstr) still expose the /sendDocument and /sendMessage
# endpoints, multipart form-data upload, ZIP writer, and credential theft.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041,T1567.001
  mbc: E1041

composite_rules:
  - id: compiled-stealer-concealed-telegram-archive-exfil
    desc: Compiled stealer zips loot and uploads to concealed Telegram bot
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/messaging/send::chat-send-document
      - id: micro-behaviors/communications/messaging/send::chat-send-message
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/data/archive/zip::rust-zipwriter-compiled-reference
    any:
      - id: objectives/credential-access/browser/app-bound::chromium-app-bound-key-theft-binary
      - id: objectives/credential-access/browser/recovery::native-multi-browser-kill-and-dpapi-unwrap
      - id: objectives/credential-access/wifi::netsh-wifi-plaintext-key-harvest
      - id: objectives/credential-access/discord/leveldb::compiled-discord-leveldb-dpapi-stealer
