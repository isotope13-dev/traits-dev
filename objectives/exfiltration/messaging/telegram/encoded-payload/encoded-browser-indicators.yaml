defaults:
  for:
  - text
  - python
  platforms:
  - unix
  - windows
  attack: T1027,T1555.003,T1567
traits:
- id: encoded-firefox-logins-fragment
  desc: Encoded Firefox login filename fragment
  crit: notable
  if:
    type: text
    substr: xvZ2lucy5qc2
- id: encoded-firefox-cookies-fragment
  desc: Encoded Firefox cookies filename fragment
  crit: notable
  if:
    type: text
    substr: 29va2llcy5zcWxpdG
- id: encoded-telegram-document-fragment
  desc: Encoded document upload method fragment
  crit: notable
  if:
    type: text
    substr: 2VuZERvY3VtZW
- id: encoded-screenshot-field-fragment
  desc: Encoded screenshot field fragment
  crit: notable
  if:
    type: text
    substr: NjcmVlbnNob3
- id: text-exec-base64-call
  desc: Text contains a Python Base64 execution call
  for: [text]
  crit: suspicious
  if:
    type: text
    substr: exec(b64decode(
composite_rules:
- id: exec-base64-evidence
  desc: Python Base64 execution evidence
  crit: notable
  any:
  - id: text-exec-base64-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-base64-result
- id: encoded-firefox-telegram-stealer-indicators
  desc: Encoded browser and document-upload stealer indicators
  crit: hostile
  conf: 0.98
  scope: file
  near_bytes: 10000
  all:
  - id: encoded-firefox-logins-fragment
  - id: encoded-firefox-cookies-fragment
  - id: encoded-telegram-document-fragment
  - id: encoded-screenshot-field-fragment
  - id: exec-base64-evidence
