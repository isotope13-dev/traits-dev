defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  attack: T1567
composite_rules:
- id: python-exec-decoded-telegram-bot
  desc: Executes decoded code aimed at Telegram
  crit: hostile
  conf: 0.97
  attack: T1027,T1102
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-base64-result
  - id: micro-behaviors/communications/http/services/telegram::encoded-bot-api-endpoint
- id: python-impersonator-execs-decoded-blob
  desc: Impersonated package executes a decoded blob
  crit: hostile
  conf: 0.96
  attack: T1036.005,T1027
  scope: package
  for:
  - python
  - python-sdist
  - python_sdist
  - pkginfo
  all:
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-base64-result
  - id: metadata/package/name/convention::python-summary-repository-name-mismatch
- id: python-telegram-b64-exec-loader
  desc: Telegram token with base64 exec loader
  crit: hostile
  conf: 0.96
  attack: T1059.006,T1041
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/auth::python-hardcoded-bot-token
  - id: micro-behaviors/data/decode/base64/call::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
