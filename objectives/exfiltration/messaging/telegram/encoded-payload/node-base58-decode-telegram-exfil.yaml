defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - npm
  - zip
  - tar
  attack: T1041,T1567.002
  mbc: E1041
traits:
- id: function-input-posted-to-telegram
  desc: Sends a function argument to Telegram
  crit: suspicious
  conf: 0.999
  for:
  - javascript
  if:
    type: yara
    source: "rule function_input_posted_to_telegram {\n  strings:\n    $s0 = /function\\s+[A-Za-z_$][\\w$]*\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*\\)/is\n    $s1 = /fetch\\s*\\(/is\n    $s2 = /function\\s+decode\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*\\)/is\n    $s3 = /(?:sendMessage\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*\\)|fetch\\s*\\()/is\n    $s4 = /chat_id/is\n    $s5 = /text['\"]?\\s*:\\s*[A-Za-z_$][\\w$]*\\s*[,}]/is\n  condition:\n    (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 2500 and (for any i2 in (1..#s4) : (@s4[i2] >= @s1[i1] + !s1[i1] and @s4[i2] <= @s1[i1] + !s1[i1] + 500 and (for any i3 in (1..#s5) : (@s5[i3] >= @s4[i2] + !s4[i2] and @s5[i3] <= @s4[i2] + !s4[i2] + 200 and (true)))))))) or (for any i0 in (1..#s2) : (for any i1 in (1..#s3) : (@s3[i1] >= @s2[i0] + !s2[i0] and @s3[i1] <= @s2[i0] + !s2[i0] + 2500 and (for any i2 in (1..#s4) : (for any i3 in (1..#s5) : (@s4[i2] < @s5[i3] and @s5[i3] <= @s4[i2] + 200))))))\n}\n"
composite_rules:
- id: npm-function-input-telegram-exfil
  desc: Exfiltrates a function input or decode argument through Telegram
  crit: hostile
  conf: 0.999
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: function-input-posted-to-telegram
