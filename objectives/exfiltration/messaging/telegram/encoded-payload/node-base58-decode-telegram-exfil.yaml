defaults:
  platforms: [unix, windows]
  for: [javascript, npm, zip, tar]
  attack: T1041,T1567.002
  mbc: E1041
traits:
  - id: function-input-posted-to-telegram
    desc: Decoder input enters chat text field
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((function_declaration
          parameters: (formal_parameters (identifier) @input)
          body: (statement_block
            (expression_statement
              (call_expression
                function: (identifier) @fetch
                arguments: (arguments
                  (_)
                  (object
                    (pair
                      key: (property_identifier) @body
                      value: (call_expression
                        function: (member_expression
                          object: (identifier) @json
                          property: (property_identifier) @stringify)
                        arguments: (arguments
                          (object
                            (pair
                              key: (property_identifier) @text
                              value: (identifier) @sent)))))))))
            (return_statement
              (call_expression
                function: (_) @decoder
                arguments: (arguments (identifier) @decoded))))) @evidence
          (#eq? @fetch "fetch")
          (#eq? @body "body")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @text "text")
          (#match? @decoder "[Dd]ecode")
          (#eq? @input @sent)
          (#eq? @input @decoded))
composite_rules:
  - id: npm-function-input-telegram-exfil
    desc: Sends decoder input through a Telegram message body
    crit: hostile
    conf: 0.98
    scope: file
    for: [javascript]
    all:
      - id: micro-behaviors/communications/messaging/telegram::javascript-telegram-json-message
      - id: function-input-posted-to-telegram
