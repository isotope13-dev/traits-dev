defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
traits:
  - id: browser-plaintext-password-report-field
    desc: Password-labeled value concatenated into report
    crit: suspicious
    conf: 0.96
    # Require a label delimiter and the runtime value directly after its
    # string prefix. Generic password-related text concatenation includes
    # ordinary PasswordException messages and SOAP authentication envelopes.
    if:
      type: text
      regex: '(?i)\bpassword\s*:[^"''\r\n]{0,20}["'']\s*\+\s*[A-Za-z_$][\w$]*'
  - id: browser-current-email-password-demand
    desc: Page demands the current email password
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)enter your current email password'
composite_rules:
  - id: browser-password-report-telegram-post
    desc: Browser password report sent via Telegram POST
    crit: hostile
    conf: 0.98
    # No fixed token, chat ID, variable name, filename or campaign endpoint.
    all:
      - id: browser-plaintext-password-report-field
      - id: micro-behaviors/ui/controls/credential::browser-password-input-marker
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/request/json::json-chat-id-and-text-body
