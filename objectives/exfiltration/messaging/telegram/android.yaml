# Android spyware that harvests on-device personal data and exfiltrates it
# through a hardcoded Telegram bot inbox. The operator-inbox constants
# below (BOT_TOKEN, CHAT_ID, sendToTelegram helpers) are attacker-chosen
# field and method names: they corroborate in `any:` and never gate in
# `all:`. The conviction rests on content-derived platform-API legs — the
# call-log and contacts provider descriptors, the notification-listener
# service, and launcher icon hiding — which no consent-based forwarder
# combines with a hardcoded bot inbox.
defaults:
  platforms: [android]
  for: [apk, zip, dex]
  attack: T1041

traits:
  - id: android-dex-bot-token-field
    desc: DEX bot token inbox constant
    crit: component
    conf: 0.9
    for: [dex]
    if:
      type: text
      word: BOT_TOKEN

  - id: android-dex-chat-id-field
    desc: DEX chat identifier inbox constant
    crit: component
    conf: 0.9
    for: [dex]
    if:
      type: text
      word: CHAT_ID

  - id: android-dex-telegram-send-helper
    desc: DEX Telegram send helper method
    crit: component
    conf: 0.9
    for: [dex]
    if:
      type: text
      regex: 'send(ToTelegram|TelegramMessage)'

composite_rules:
  - id: android-telegram-harvest-exfil-spyware
    desc: Android spyware sends harvested data to Telegram
    crit: hostile
    conf: 0.97
    mbc: E1041
    # Harvest helpers live in the app DEX while the launcher-hiding call
    # sits in a different DEX member; pool evidence across the whole APK.
    scope: outer
    all:
      - id: micro-behaviors/os/user/lookup::android-dex-contacts-phone-descriptor
      - id: micro-behaviors/os/user/lookup::android-dex-call-log-provider
      - id: micro-behaviors/os/privilege/manifest::notification-listener-service
      - id: objectives/evasion/process/hidden/launcher::android-set-component-enabled-setting-reference
    any:
      - id: android-dex-bot-token-field
      - id: android-dex-chat-id-field
      - id: android-dex-telegram-send-helper
    needs: 2
