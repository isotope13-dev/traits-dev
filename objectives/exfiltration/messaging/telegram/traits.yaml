defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  attack: T1567
traits:
- id: common-password-dictionary-filename
  desc: Common-password dictionary filename
  crit: component
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: \bcommon-passwords\.txt
- id: sensitive-document-name-targets--rx-2
  desc: Sensitive doc filename targets (secrets/seed)
  crit: component
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: \b(secrets|seed[\w-]*)\.(txt|docx|xlsx)\b
- id: sensitive-document-name-targets--rx-3
  desc: Sensitive document filename targets (wallet)
  crit: component
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: \bwallet[\w-]*\.(txt|docx|xlsx)\b
- id: api-endpoint-b64-fragment
  desc: Base64 Telegram API endpoint fragment
  crit: component
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: YXBpL
- id: telegram-domain-b64-fragment
  desc: Base64 Telegram domain fragment
  crit: notable
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: nRlbGVnc
- id: telegram-bot-path-b64-fragment
  desc: Base64 Telegram bot path fragment
  crit: notable
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: m9yZy9ib3Q
- id: send-document-b64-fragment
  desc: Base64 sendDocument fragment
  crit: notable
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: VuZERvY3VtZW
- id: seeds-txt-b64-fragment
  desc: Base64 seeds.txt filename fragment
  crit: notable
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: lZHMudHh0YC
- id: clipboard-text-sent-to-telegram
  desc: Clipboard text is sent to Telegram
  crit: notable
  conf: 0.92
  for:
  - macho
  - elf
  - binaries
  if:
    type: text
    regex: (?i)clipboard[^\n.]{0,48}telegram
- id: twelve-or-twentyfour-word-phrase
  desc: Checks a 12 or 24 word phrase
  crit: notable
  conf: 0.9
  for:
  - macho
  - elf
  - binaries
  if:
    type: text
    regex: (?i)12\W{1,4}or\W{1,4}24\W{0,3}word
