- id: clipboard-text-sent-to-telegram
  desc: Clipboard text is sent to Telegram
  crit: notable
  conf: 0.92
  for:
  - macho
  - elf
  - binaries
  if:
    type: text
    regex: (?i)clipboard[^\n]{0,48}telegram
- id: twelve-or-twentyfour-word-phrase
  desc: Checks a 12 or 24 word phrase
  crit: notable
  conf: 0.9
  for:
  - macho
  - elf
  - binaries
  if:
    type: text
    regex: (?i)12\W{1,4}or\W{1,4}24\W{0,3}word
