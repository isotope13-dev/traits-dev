- id: telegram-hardcoded-bot-config
  desc: Telegram hardcoded bot configuration
  crit: suspicious
  conf: 0.96
  for: [binaries, scripts, source]
  # 512 bytes assumed all three constants sit in one config block. The common
  # layout declares `token` and `chat_id` at the top of the file and only
  # builds the api.telegram.org URL at the call site further down, which put
  # the host well outside a 512-byte window. The three legs are specific
  # enough (bot-token shape + chat-id constant + the Bot API host) that a
  # file-region window is what keeps them correlated, not a paragraph one.
  near_bytes: 4096
  all:
    - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    - id: objectives/command-and-control/channel/messaging::hardcoded-telegram-bot-token-literal
    - id: hardcoded-chat-id-literal
  unless:
    - id: well-known/app/ai/opencode-router
