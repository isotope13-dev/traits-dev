# A Go HTTP handler that reads a submitted password out of the decoded request
# and a Telegram sendMessage client in the same program: a phishing-kit
# backend that relays each victim's login to the operator's bot. Each leg is
# ordinary web code; a password is never a legitimate Telegram notification.
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1056.003,T1567
traits:
  - id: go-request-map-password-read
    desc: Go reads password key from map
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\[\s*"(password|passwd|pwd)"\s*\]'
composite_rules:
  - id: go-login-handler-telegram-credential-relay
    desc: Go login handler relays submitted passwords to Telegram
    crit: hostile
    conf: 0.95
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/server/handler::go-http-handler-signature
      - id: go-request-map-password-read
      - id: micro-behaviors/communications/http/services/telegram::go-telegram-sendmessage-client
    unless:
      - id: metadata/package/testing/harness/unit::go-test-source-file
