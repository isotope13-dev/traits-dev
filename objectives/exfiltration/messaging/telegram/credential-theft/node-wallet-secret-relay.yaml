defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041,T1567
  mbc: E1041

composite_rules:
  - id: node-wallet-secret-fields-sent-to-telegram-bot
    desc: Sends seed and private-key fields through Telegram bot
    crit: hostile
    conf: 0.93
    scope: file
    near_bytes: 12000
    all:
      - id: micro-behaviors/data/parse/vocabulary::node-seed-key-field-default
      - id: micro-behaviors/communications/http/services/telegram::telegram-send-message-url
      - id: micro-behaviors/communications/http/post/
