defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  attack: T1567
traits:
- id: python-telegram-login-host-port-fields
  desc: Python formats host and port in URL
  crit: suspicious
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: app\[['\"]host['\"]\][\s\S]{0,120}app\[['\"]port['\"]\]
- id: python-telegram-panel-login-route
  desc: Python formats a panel login route
  crit: suspicious
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: app\[['\"]panel_route['\"]\][\s\S]{0,100}/login
composite_rules:
- id: clipboard-seed-telegram-text-clues
  desc: Clipboard, seed phrase and Telegram text
  crit: suspicious
  conf: 0.97
  for:
  - macho
  - elf
  - binaries
  attack: T1115,T1567
  scope: file
  all:
  - id: micro-behaviors/communications/messaging/telegram::clipboard-telegram-text-cooccurrence
  - id: micro-behaviors/crypto/mnemonic::twelve-or-twentyfour-word-phrase
- id: python-aiohttp-telegram-application-login-url-exfil
  desc: Python sends an application login URL to Telegram
  crit: hostile
  conf: 0.99
  attack: T1041,T1567.001
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/communications/http/auth::telegram-bot-api-path-token
  - id: micro-behaviors/communications/http/services/telegram::python-aiohttp-sendmessage-get
  - id: python-telegram-login-host-port-fields
  - id: python-telegram-panel-login-route
- id: verified-secret-scan-telegram-routing
  desc: Verified secret scan results routed to Telegram
  crit: suspicious
  conf: 0.97
  for:
  - scripts
  - source
  near_bytes: 8192
  all:
  - id: well-known/tool/detection/sast::trufflehog-verified-filesystem-command
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
- id: apk-secret-findings-telegram-exfil
  desc: Exfiltrates live APK credentials through Telegram
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1041,T1567.001
  mbc: E1041
  for:
  - scripts
  - source
  near_bytes: 12288
  all:
  - id: objectives/credential-access/api-harvest/token::apk-decompile-verified-secret-scan
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
- id: powershell-telegram-hardware-wallet-beacon
  desc: PowerShell reports hardware wallet presence via Telegram
  crit: hostile
  conf: 0.96
  attack: T1082,T1567,T1555
  mbc: E1041
  for:
  - powershell
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  - id: objectives/exfiltration/messaging/telegram/channel-control::powershell-telegram-hardcoded-bot-credential
  - id: micro-behaviors/fs/path/check::test-path
  any:
  - id: well-known/app/finance/trezor::repeated-trezor-token
  - id: micro-behaviors/os/application/target/wallet::hardware-wallet-keyword-cluster--rx-7
  - id: micro-behaviors/os/application/target/wallet::hardware-wallet-keyword-cluster--rx-8
  - id: micro-behaviors/os/application/target/wallet::hardware-wallet-keyword-cluster--rx-9
  - id: micro-behaviors/os/application/target/wallet::hardware-wallet-keyword-cluster--rx-10
- id: credential-form-automation-telegram-channel
  desc: Credential form automation reports to Telegram
  crit: hostile
  conf: 0.97
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  any:
  - id: micro-behaviors/ui/window/banking-field::browser-sensitive-field-automation
  - id: micro-behaviors/ui/window/banking-field::browser-banking-credential-data-record
  unless:
  - id: well-known/app/ai/gateway/opencode-router
- id: telegram-remote-session-credential-exfil
  desc: Telegram receives remote-support session credentials from a form
  crit: hostile
  conf: 0.99
  attack: T1041,T1056,T1567.001
  for:
  - html
  - javascript
  - typescript
  - php
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  - id: objectives/credential-access/phishing/support-scam::remote-support-session-credential-form
  - id: objectives/credential-access/phishing/support-scam::remote-session-credential-record
  - id: micro-behaviors/data/serialize/schema-object::nested-json-text-body
- id: telegram-refund-scam-dossier-exfil
  desc: Telegram receives a refund-scam operator worksheet
  crit: hostile
  conf: 0.99
  attack: T1041,T1056,T1567.001
  for:
  - html
  - javascript
  - typescript
  - php
  near_bytes: 12288
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
  - id: objectives/credential-access/phishing/support-scam::operator-assisted-refund-scam-form
  - id: objectives/credential-access/phishing/support-scam::remote-session-credential-record
  - id: objectives/credential-access/phishing/support-scam::refund-profile-record-read
  - id: micro-behaviors/data/serialize/schema-object::nested-json-text-body
