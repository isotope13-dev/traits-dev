defaults:
  platforms:
  - macos
  for:
  - macho
  - swift
  - objc
  attack: T1567
composite_rules:
- id: swift-telegram-json-exfil
  desc: Swift Telegram JSON exfiltration
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlsession-swift-request
  - id: micro-behaviors/data/format/json::swift-json-object-serialization
  any:
  - id: objectives/exfiltration/messaging/telegram/channel-control::hardcoded-telegram-bot-message-channel
  - id: micro-behaviors/communications/messaging/configure::telegram-bot-token-config-field
  - id: micro-behaviors/communications/messaging/configure::native-telegram-channel-id-config-field
  - id: objectives/exfiltration/messaging/telegram/channel-control::telegram-message-success-string
  - id: objectives/exfiltration/messaging/telegram/channel-control::telegram-error-string
- id: macos-password-telegram-exfil
  desc: macOS password Telegram exfiltration
  crit: hostile
  conf: 0.995
  all:
  - id: swift-telegram-json-exfil
  - id: objectives/credential-access/phishing/prompt::macos-password-phishing-prompt
