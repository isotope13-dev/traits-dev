defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  attack: T1567
composite_rules:
- id: telegram-hardcoded-bot-token
  desc: Hardcoded Telegram bot token
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
  - id: micro-behaviors/communications/http/auth::telegram-bot-api-path-token
- id: test-mock-marker
  desc: Telegram API mock test fixture
  crit: component
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: metadata/package/testing/harness/fixture::nock-mock
  any:
  - id: metadata/package/testing/presence/fixture::describe-suite-test-file
  - id: metadata/package/testing/presence/fixture::expect-assertion-test-file
  - id: metadata/package/testing/harness/runtime::test-basename-prefix
  - id: metadata/package/testing/harness/runtime::test-basename-suffix
  - id: metadata/package/testing/harness/runtime::test-basename-spec
- id: hardcoded-telegram-bot-message-channel
  desc: Hardcoded Telegram bot message channel
  crit: suspicious
  conf: 0.92
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/http/auth::telegram-bot-api-path-token
  - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
- id: powershell-telegram-hardcoded-bot-credential
  desc: Hardcoded Telegram bot token in PowerShell script
  crit: notable
  conf: 0.96
  for:
  - powershell
  any:
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
  - id: micro-behaviors/communications/http/auth::powershell-telegram-bot-token-literal
- id: python-telegram-shutdown-channel
  desc: Python Telegram-controlled payload forces an immediate shutdown
  crit: hostile
  conf: 0.99
  attack: T1059.006,T1529,T1102
  mbc: B0029
  for:
  - whl
  - python
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/telegram::python-telegram-hardcoded-polling-config
  - id: objectives/impact/system/shutdown::subprocess-shutdown-argv
