# Trojanized base58x64 releases disclose each string passed to decode().
defaults:
  platforms: [unix, windows, macos]
  for: [javascript, npm, zip, tar]
  attack: T1041,T1567.002
  mbc: E1041

traits:
  - id: base58-hardcoded-telegram-bot-api
    desc: References a Telegram Bot API endpoint
    crit: suspicious
    conf: 0.999
    for: [javascript]
    if:
      type: text
      substr: api.telegram.org

  - id: base58-decode-input-posted-to-telegram
    desc: Places a decode argument in a Telegram message body
    crit: suspicious
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '(?is)function\s+decode\s*\(\s*string\s*\)[\s\S]{0,2500}fetch\s*\([\s\S]{0,500}chat_id[\s\S]{0,200}text[''"]?\s*:\s*string'

composite_rules:
  - id: npm-base58-decode-telegram-exfil
    desc: Exfiltrates every base58 decode input through a Telegram bot
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: base58-hardcoded-telegram-bot-api
      - id: base58-decode-input-posted-to-telegram
