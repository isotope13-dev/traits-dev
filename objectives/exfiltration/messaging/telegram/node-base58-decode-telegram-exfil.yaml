# Trojanized base58x64 releases disclose each string passed to decode().
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1567.002
  mbc: E1041

traits:
  - id: telegram-fetch-chat-id-string-body
    desc: Posts string argument in Telegram chat body
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)fetch\s*\(.{0,240}chat_id.{0,120}\btext[''"]?\s*:\s*string\b'

composite_rules:
  - id: base58-decode-input-posted-to-telegram
    desc: Places a decode argument in a Telegram message body
    crit: suspicious
    conf: 0.999
    near_bytes: 2600
    all:
      - id: metadata/lang/source/syntax/declaration::js-decode-string-function-header
      - id: telegram-fetch-chat-id-string-body

  - id: npm-base58-decode-telegram-exfil
    desc: Exfiltrates every base58 decode input through a Telegram bot
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: base58-decode-input-posted-to-telegram
