---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - npm
  - zip
  - tar
  attack: T1041,T1567.002
  mbc: E1041
traits:
- id: base58-decode-input-posted-to-telegram
  desc: Posts each base58 decode input to Telegram
  crit: suspicious
  conf: 0.999
  for:
  - javascript
  if:
    type: yara
    source: |
      rule base58_decode_input_posted_to_telegram {
        strings:
          $s0 = /function\s+decode\s*\(\s*string\s*\)/is
          $s1 = /fetch\s*\(/is
          $s2 = /chat_id/is
          $s3 = /text['"]?\s*:\s*string/is
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 2500 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 500 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 200 and (true))))))))
      }
composite_rules:
- id: npm-base58-decode-telegram-exfil
  desc: Exfiltrates every base58 decode input through a Telegram bot
  crit: hostile
  conf: 0.999
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: base58-decode-input-posted-to-telegram
