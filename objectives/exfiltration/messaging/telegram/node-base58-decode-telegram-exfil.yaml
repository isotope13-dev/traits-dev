defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - npm
  - zip
  - tar
  attack: T1041,T1567.002
  mbc: E1041
traits:
- id: function-input-posted-to-telegram
  desc: Posts a function input to Telegram
  crit: suspicious
  conf: 0.999
  for:
  - javascript
  if:
    type: yara
    source: |
      rule function_input_posted_to_telegram {
        strings:
          $s0 = /function\s+[A-Za-z_$][\w$]*\s*\(\s*[A-Za-z_$][\w$]*\s*\)/is
          $s1 = /fetch\s*\(/is
          $s2 = /chat_id/is
          $s3 = /text['"]?\s*:\s*[A-Za-z_$][\w$]*/is
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 2500 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 500 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 200 and (true))))))))
      }
composite_rules:
- id: npm-function-input-telegram-exfil
  desc: Exfiltrates a library function input through Telegram
  crit: hostile
  conf: 0.999
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: function-input-posted-to-telegram
