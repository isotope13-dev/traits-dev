defaults:
  platforms: [unix, windows]
  for: [package.json, zip]
  attack: T1195.002,T1041,T1082,T1033,T1567.002
  mbc: E1041

composite_rules:
  - id: npm-preinstall-host-profile-to-telegram
    desc: npm preinstall sends host identity to Telegram
    crit: hostile
    conf: 0.99
    scope: archive
    near_bytes: 4096
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/os/sysinfo/profile::preinstall-node-host-user-query
      - id: micro-behaviors/communications/http/services/telegram::preinstall-telegram-send-message-url
      - id: micro-behaviors/communications/http/services/telegram::preinstall-telegram-encoded-json-message
