# Telegram-channelled RATs that dump env and upload filesystem archives.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1041,T1082,T1102
  crit: notable
  conf: 0.95

composite_rules:
  - id: ptb-telegram-env-dump-exfil
    desc: PTB Telegram bot dumps process environment
    crit: hostile
    conf: 0.97
    attack: T1082,T1041,T1102
    scope: archive
    for: [python, whl, zip, archives]
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-application-builder
      - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
      - id: objectives/command-and-control/channel/messaging::telegram-printenv-command-literal

  - id: ptb-telegram-zip-backup-exfil
    desc: PTB Telegram bot zips and uploads files
    crit: hostile
    conf: 0.98
    attack: T1041,T1005,T1102
    scope: archive
    for: [python, whl, zip, archives]
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-application-builder
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-reply-document
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: objectives/command-and-control/channel/messaging::telegram-get-all-exfil-literal

  - id: ptb-telegram-stealth-shell-rat
    desc: PTB Telegram stealth-alias remote shell RAT
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1027,T1102
    scope: archive
    for: [whl, zip, archives]
    all:
      - id: objectives/command-and-control/channel/messaging::ptb-telegram-remote-shell
      - id: objectives/command-and-control/channel/messaging::telegram-stealth-shell-alias-map
