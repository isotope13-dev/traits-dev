# Operator-panel configs that watch banking/password keywords and
# declare a Telegram bot inbox. Field-name atoms live under
# micro-behaviors/data/config; this composite supplies exfil intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1567.002

traits:
  - id: bank-password-admin-keywords
    desc: Bank password admin watch keywords
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '"bank", "password", "admin"'

composite_rules:
  - id: operator-telegram-keyword-watch
    desc: Operator panel watches keywords via Telegram
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/config/schema::javascript-telegram-enabled-field
      - id: micro-behaviors/data/config/schema::javascript-telegram-bot-token-field
      - id: micro-behaviors/data/config/schema::javascript-telegram-chat-id-field
      - id: bank-password-admin-keywords
