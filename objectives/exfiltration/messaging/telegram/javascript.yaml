# Operator-panel configs that watch banking/password keywords and
# declare a Telegram bot inbox. Field-name atoms live under
# micro-behaviors/data/config; this composite supplies exfil intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1567.002

traits:
  - id: telegram-shell-output-in-message
    desc: Includes shell output in a Telegram message
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)stdout\.trim\(\).{0,800}api\.telegram\.org|api\.telegram\.org.{0,800}stdout\.trim\(\)'

  - id: telegram-host-file-command
    desc: Shell reads host account or package files
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '/etc/passwd[\s\S]{0,500}(package\.json|pwd)|(package\.json|pwd)[\s\S]{0,500}/etc/passwd'

  - id: telegram-encoded-shell-output-message
    desc: Encodes shell output for Telegram
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'stdout\.trim\(\)[\s\S]{0,700}encodeURIComponent\(message\)'

  - id: bank-password-admin-keywords
    desc: Bank password admin watch keywords
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '"bank", "password", "admin"'

  - id: save-my-telegram-fn
    desc: saveMyTelegram settings helper function
    crit: notable
    conf: 0.9
    if:
      type: text
      word: saveMyTelegram

  - id: load-my-telegram-fn
    desc: loadMyTelegram settings helper function
    crit: notable
    conf: 0.9
    if:
      type: text
      word: loadMyTelegram

composite_rules:
  - id: operator-telegram-keyword-watch
    desc: Operator panel watches keywords via Telegram
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/messaging/configure::javascript-telegram-enabled-field
      - id: micro-behaviors/communications/messaging/configure::telegram-bot-token-config-field
      - id: micro-behaviors/communications/messaging/configure::javascript-telegram-chat-id-field
      - id: bank-password-admin-keywords

  - id: operator-telegram-inbox-settings
    desc: Operator panel Telegram inbox settings
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/messaging/configure::javascript-telegram-chat-id-field
      - id: micro-behaviors/communications/http/panel::api-settings-telegram-path
      - id: save-my-telegram-fn
      - id: load-my-telegram-fn

  - id: node-shell-output-telegram-exfil
    desc: Sends host command output to a Telegram bot
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1082,T1005,T1041,T1567.002
    mbc: E1041
    near_bytes: 1800
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
      - id: telegram-shell-output-in-message
      - id: telegram-host-file-command

  - id: node-command-output-telegram-report
    desc: Sends Node shell output to a hardcoded Telegram bot
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1033,T1041,T1567.002
    mbc: E1041
    near_bytes: 1800
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/request/client::node-http
    any:
      - id: telegram-shell-output-in-message
      - id: telegram-encoded-shell-output-message
