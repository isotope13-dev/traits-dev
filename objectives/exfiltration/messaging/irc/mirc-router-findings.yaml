defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1041,T1018,T1552

traits:
  - id: mirc-router-telnet-scan
    desc: IRC script scans router Telnet port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.sockopen\s+cisco\.scan\.[^\n]{0,120}\s23\b'
  - id: mirc-router-enable-auth
    desc: Sends router enable credentials
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.sockwrite[^\n]{0,100}%cisco\.scan\.enable'
  - id: mirc-router-findings-message
    desc: IRC message reports router IP and password
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\.msg[^\n]{0,100}router found on\s+\$sock\(\$sockname\)\.ip\s+pass:'

composite_rules:
  - id: mirc-router-credential-findings-report
    desc: IRC scanner reports router addresses and passwords
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-router-telnet-scan
      - id: mirc-router-enable-auth
      - id: mirc-router-findings-message
