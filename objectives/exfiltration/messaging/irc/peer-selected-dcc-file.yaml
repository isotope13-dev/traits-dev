defaults:
  platforms: [unix, windows]
  for: [mirc, ircii]
  crit: notable
  conf: 0.95

traits:
  - id: mirc-peer-chat-or-ctcp-event
    desc: mIRC handles peer chat or CTCP
    if:
      type: text
      regex: '(?i)\b(on [^:\r\n]{1,12}:[ \t]*chat|ctcp [^:\r\n]{1,12})[ \t]*:'

  - id: mirc-dcc-send-peer-path
    desc: mIRC DCC sends a peer-selected path
    if:
      type: text
      regex: '(?i)\bdcc[ \t]+send[ \t]+\$nick[ \t]+\$[1-9]-([ \t|}\r\n]|$)'

composite_rules:
  - id: mirc-peer-selected-file-transfer
    desc: IRC peer chat or CTCP handler sends a file selected by the peer
    crit: hostile
    conf: 0.96
    near_lines: 1
    all:
      - id: mirc-peer-chat-or-ctcp-event
      - id: mirc-dcc-send-peer-path
