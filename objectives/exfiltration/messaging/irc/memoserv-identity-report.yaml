defaults:
  platforms: [windows, unix]
  for: [mirc]

traits:
  - id: mirc-connect-event-handler
    desc: Runs when the IRC client connects
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\r\n])[ \t]*on[ \t]+[^:\r\n]{1,20}:connect:'

  - id: mirc-memoserv-encoded-recipient
    desc: Sends IRC memo to an encoded recipient
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bMemoServ[ \t]+send[ \t]+\$decode\s*\('

  - id: mirc-ip-and-nickname-profile
    desc: Collects IRC client IP and nickname
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$ip\b[^\r\n]{0,60}\$nick\b'

composite_rules:
  - id: mirc-memoserv-connect-identity-exfil
    desc: IRC connect event sends client identity to an encoded MemoServ recipient
    crit: hostile
    conf: 0.97
    attack: T1041,T1082
    all:
      - id: mirc-connect-event-handler
      - id: mirc-memoserv-encoded-recipient
      - id: mirc-ip-and-nickname-profile
    near_bytes: 220
