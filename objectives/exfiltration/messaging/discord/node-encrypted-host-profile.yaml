defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1082,T1033,T1567.002
  mbc: E1041

traits:
  - id: discord-webhook-route-fragments
    desc: Discord webhook host and route fragments
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'discord\.com.{0,260}webhooks|webhooks.{0,260}discord\.com'
  - id: obfuscated-ipify-query-fragments
    desc: Obfuscated IPify host and query fragments
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'ipify\.org.{0,60}\?format=json|\?format=json.{0,60}ipify\.org'

composite_rules:
  - id: node-encrypted-host-profile-discord-webhook
    desc: Encrypts a host profile for Discord webhook exfiltration
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: discord-webhook-route-fragments
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
      - id: micro-behaviors/data/serialize/schema-system::host-field-key
      - id: micro-behaviors/communications/http/content-length::raw-content-length-header
    any:
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: obfuscated-ipify-query-fragments
