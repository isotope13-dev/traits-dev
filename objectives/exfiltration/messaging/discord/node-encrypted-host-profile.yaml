defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1082,T1033,T1567.002
  mbc: E1041
composite_rules:
- id: node-encrypted-host-profile-discord-webhook
  desc: Encrypts a host profile for Discord webhook exfiltration
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/communications/http/services/discord::discord-webhook-route-fragments
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
  - id: micro-behaviors/data/serialize/schema-system::host-field-key
  - id: micro-behaviors/communications/http/content-length::raw-content-length-header
  any:
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/communications/http/ip-discovery::ipify-json-query
