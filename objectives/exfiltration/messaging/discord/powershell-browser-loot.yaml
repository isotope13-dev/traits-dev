# PowerShell copies browser stores or Discord leveldb tokens and posts the
# result to a Discord webhook. The webhook id is often assigned on the next
# line, so the split-host leg is required alongside the contiguous URL.
defaults:
  crit: hostile
  conf: 0.96
  platforms: [windows]
  for: [powershell]
  attack: T1555.003,T1041,T1567.002

composite_rules:
  - id: powershell-discord-webhook-browser-loot
    desc: PowerShell posts browser loot to Discord
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::powershell-http-post-body
    any:
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
