defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1033,T1059.004
  mbc: E1041

traits:
  - id: node-discord-whoami-command-upload
    desc: Appends whoami output to Discord webhook URL
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(curl|wget)\b[^\n]{0,80}discord\.com/api/webhooks/[^\n]{0,80}\$\(\s*whoami\s*\)'

composite_rules:
  - id: node-whoami-curl-discord-webhook-exfil
    desc: Executes curl or wget to send whoami output to Discord
    crit: hostile
    conf: 0.99
    for: [javascript]
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: node-discord-whoami-command-upload
  - id: node-whoami-discord-webhook-exfil
    desc: Sends command-collected user identity to a Discord webhook
    crit: hostile
    conf: 0.98
    for: [javascript]
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
    any:
      - id: node-discord-whoami-command-upload
      - id: micro-behaviors/process/identity/query/command::whoami-exec-argument
    near_bytes: 4096
