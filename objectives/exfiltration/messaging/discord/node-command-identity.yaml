defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1033,T1059.004
  mbc: E1041

traits:
  - id: node-discord-whoami-command-upload
    desc: Sends whoami output in a Discord webhook URL
    crit: hostile
    conf: 0.99
    if:
      type: text
      exclude_comments: true
      regex: '(?is)\b(exec|spawn)\s*\([^;]{0,300}\b(curl|wget)\b.{0,160}discord\.com/api/webhooks/.{0,160}whoami=\$\(\s*whoami\s*\)'

composite_rules:
  - id: node-whoami-discord-webhook-exfil
    desc: Sends command-collected user identity to a Discord webhook
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/command-string/boundary-create-shell-bridge-javascript::js-exec
      - id: micro-behaviors/process/identity/query/command/subject-review-query-posix::whoami-cmd
      - id: micro-behaviors/communications/http/webhook/discord::discord-webhook-path-any
    near_bytes: 4096
