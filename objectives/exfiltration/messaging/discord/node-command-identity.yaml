defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1033,T1059.004
  mbc: E1041

traits:
  - id: node-exec-shell-curl-command
    desc: Executes curl or wget command
    crit: component
    conf: 0.99
    if:
      type: text
      exclude_comments: true
      regex: '(?is)\b(exec|spawn)\s*\([^;]{0,300}\b(curl|wget)\b'

  - id: node-whoami-query-parameter
    desc: Sends shell whoami in query string
    crit: suspicious
    conf: 0.99
    if:
      type: text
      exclude_comments: true
      regex: '(?i)whoami=\$\(\s*whoami\s*\)'

composite_rules:
  - id: node-discord-whoami-command-upload
    desc: Uploads whoami output through Discord webhook
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 650
    all:
      - id: node-exec-shell-curl-command
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
      - id: node-whoami-query-parameter
