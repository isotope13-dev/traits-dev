defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

traits:
  - id: discord-token-webhook-payload-field
    desc: Webhook payload embeds Discord user token
    if:
      type: text
      regex: '(?s)(config\.USER_TOKEN|USER_TOKEN).{0,600}axios\.post'
