# Trojanized bmath versions start a persistent VS Code tunnel and upload its
# local log through a Discord webhook as soon as the package is imported.
defaults:
  platforms: [macos]
  for: [javascript]
  attack: T1059.004,T1543.001,T1041
  mbc: F0012,E1041

traits:
  - id: bmath-launchctl-vscode-tunnel
    desc: Registers VS Code tunnel via launchctl
    crit: suspicious
    conf: 0.999
    if:
      type: text
      regex: '(?is)launchctl\s+submit.{0,80}code\.job.{0,140}/bin/code\s+tunnel'

  - id: bmath-tunnel-log-posted-to-discord
    desc: Reads tunnel log and calls sendMessage
    crit: suspicious
    conf: 0.999
    if:
      type: text
      regex: '(?is)fs\.readFile\(\s*filePath\s*,\s*["'']utf8["''].{0,160}sendMessage\(\s*data\s*\)'

  - id: bmath-main-entrypoint-call
    desc: Defines and invokes main tunnel routine
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)function\s+main\s*\(\s*\).{0,320}\bmain\s*\(\s*\)\s*;'

  - id: bmath-detached-init-respawn
    desc: Respawns current Node script with --init
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)\[__filename,\s*["'']--init["'']\].{0,180}detached:\s*true'

composite_rules:
  - id: npm-bmath-vscode-tunnel-discord-exfil
    desc: Package import starts a VS Code tunnel and exfiltrates its log
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: bmath-launchctl-vscode-tunnel
      - id: bmath-tunnel-log-posted-to-discord
      - id: micro-behaviors/communications/http/services/discord::js-discord-webhook-target
    any:
      - id: bmath-main-entrypoint-call
      - id: bmath-detached-init-respawn
