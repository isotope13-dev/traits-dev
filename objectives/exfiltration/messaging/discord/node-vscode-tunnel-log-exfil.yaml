# Trojanized bmath versions start a persistent VS Code tunnel and upload its
# local log through a Discord webhook as soon as the package is imported.
defaults:
  platforms: [macos]
  for: [javascript, package.json]
  attack: T1059.004,T1543.001,T1041
  mbc: F0012,E1041

traits:
  - id: bmath-launchctl-vscode-tunnel
    desc: Registers a VS Code tunnel through launchctl
    crit: suspicious
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '(?is)launchctl\s+submit[\s\S]{0,400}code\.job[\s\S]{0,300}Contents\/Resources\/app\/bin\/code[\s\S]{0,160}tunnel'

  - id: bmath-tunnel-log-posted-to-discord
    desc: Reads the VS Code tunnel log and posts its contents to Discord
    crit: suspicious
    conf: 0.999
    for: [javascript]
    if:
      type: text
      regex: '(?is)fs\.readFile\s*\(\s*filePath\s*,\s*["'']utf8["''][\s\S]{0,500}sendMessage\s*\(\s*data\s*\)'

  - id: bmath-import-starts-tunnel-routine
    desc: Calls the tunnel routine at module load
    crit: suspicious
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?is)(?:function\s+main\s*\(\s*\)[\s\S]{0,300}\bmain\s*\(\s*\)\s*;|process\.argv\[2\]\s*===\s*["'']--init["''][\s\S]{0,800}spawn\s*\(\s*["'']node["'']\s*,\s*\[__filename,\s*["'']--init["'']\][\s\S]{0,200}detached:\s*true)'

composite_rules:
  - id: npm-bmath-vscode-tunnel-discord-exfil
    desc: Package import starts a VS Code tunnel and exfiltrates its log
    crit: hostile
    conf: 0.999
    scope: archive
    for: [npm, zip, tar, javascript]
    all:
      - id: bmath-launchctl-vscode-tunnel
      - id: bmath-tunnel-log-posted-to-discord
      - id: micro-behaviors/communications/http/services/discord::js-discord-webhook-target
      - id: bmath-import-starts-tunnel-routine
