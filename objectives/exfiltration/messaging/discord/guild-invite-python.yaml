defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

traits:
  - id: python-discord-create-invite-call
    desc: Python discord.py create_invite call
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\.create_invite\s*\('

composite_rules:
  # One Python file: creating the invite and POSTing it to the webhook are
  # the same routine. Under `scope: archive` the legs pooled across a whole
  # distribution, and any tree carrying a Discord integration supplies all
  # three -- Home Assistant OS bundles one and scored hostile.
  - id: python-discord-guild-invite-webhook-beacon
    desc: Python Discord guild invite webhook beacon
    crit: hostile
    conf: 0.97
    attack: T1041,T1195.002
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::python-webhook-post
      - id: python-discord-create-invite-call
