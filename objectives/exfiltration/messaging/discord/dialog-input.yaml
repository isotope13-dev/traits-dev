defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: dialog-secret-webhook-call
    desc: Dialog credential passed with Discord webhook
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '.+'
      args:
        - index: 0
          from:
            value: '^https://(canary\.|ptb\.)?discord(app)?\.com/api/webhooks/'
        - index: 1
          regex: '(?i)(api.?key|password|token|credential|secret)'
          from:
            call: '(^|\.)showInputBox$'
composite_rules:
  - id: dialog-credential-discord-post
    desc: Dialog credential targets a Discord POST helper
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1567.004
    all:
      - id: dialog-secret-webhook-call
      - id: micro-behaviors/data/control-flow/direct-call::post-helper-forwards-content
      - id: metadata/import/npm/axios
