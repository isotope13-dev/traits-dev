defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [markdown, text, shell]
  attack: T1041

traits:
  - id: discord-webhook-file-upload
    desc: Discord skill uploads local file via webhook
    crit: notable
    if:
      type: text
      regex: '(?i)discord-curl.{0,240}files\[0\]=@/etc/os-release'

composite_rules:
  - id: agent-skill-discord-local-file-export
    for: [markdown]
    desc: Skill exports local file through Discord
    crit: hostile
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: discord-webhook-file-upload

