defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

traits:
- id: https-request-discord-webhook
  desc: https.request to Discord webhook
  crit: suspicious
  conf: 0.97
  attack: "T1041"
  mbc: "E1041"
  if:
    type: text
    regex: "require\\(['\"]https['\"]\\)\\.request\\([^)]{0,50}https://discord\\.com/api/webhooks"

  # HTTPS POST for exfiltration
- id: https-post-exfil
  desc: HTTPS POST data exfiltration
  crit: suspicious
  conf: 0.93
  attack: "T1041"
  if:
    type: text
    regex: "require\\(['\"]https['\"]\\)\\.request[^}]{0,50}method['\"]:\\s*['\"]POST"

composite_rules:
  # Hostile: Complete Discord exfiltration chain
- id: discord-http-exfil-chain
  desc: Discord webhook HTTPS exfiltration
  crit: hostile
  conf: 0.98
  attack: "T1567"
  mbc: "E1041"
  all:
  - id: https-request-discord-webhook
  any:
  - id: https-post-exfil
  - id: micro-behaviors/data/serialize/json::json-stringify-call
- id: discord-node-credential-parameter-exfiltration
  desc: Node HTTP client posts token and password parameters to Discord
  crit: hostile
  conf: 0.99
  attack: "T1041,T1552.001,T1567.002"
  mbc: "E1041"
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
  - id: micro-behaviors/communications/http/request/client::node-fetch-import
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: metadata/lang/source/naming/declaration::js-token-password-parameters
  near_lines: 80
