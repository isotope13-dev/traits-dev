defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1041,T1056.003,T1539
  mbc: B0030

traits:
  - id: embedded-discord-token-webhook-call
    desc: Captured Discord token passed to webhook
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)\bsendWebhook\s*\([^)]{0,180}\b(capturedToken|token|tok)\b'
