defaults:
  platforms: [unix, windows]
  for: [python, python-sdist, whl, zip]
  attack: T1195.002,T1041,T1567.002

traits:
  - id: python-discord-pip-install-notification
    desc: Setup hook sends a pip installation notice to a Discord webhook
    crit: hostile
    conf: 0.99
    if:
      type: text
      regex: '(?is)WEBHOOK_URL.{0,200}discord\.com/api/webhooks/.{0,300}class\s+\w+\s*\(install\).{0,1000}json\.dumps.{0,250}pip.{0,300}urlopen\s*\(\s*req'

composite_rules:
  - id: python-install-hook-discord-pip-notification
    desc: Install hook sends a package installation beacon to Discord
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: objectives/exfiltration/messaging/discord::python-discord-pip-install-notification
