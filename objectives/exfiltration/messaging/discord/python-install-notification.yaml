---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002,T1041,T1567.002
traits:
- id: python-discord-pip-install-notification
  desc: Setup sends pip install notice to Discord
  crit: hostile
  conf: 0.99
  if:
    type: yara
    source: |
      rule python_discord_pip_install_notification {
        strings:
          $s0 = /WEBHOOK_URL/is
          $s1 = /discord\.com\/api\/webhooks\//is
          $s2 = /class\s+\w+\s*\(install\)/is
          $s3 = /json\.dumps/is
          $s4 = /pip/is
          $s5 = /urlopen\s*\(\s*req/is
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 200 and (for any i2 in (1..#s2) : (@s2[i2] >= @s1[i1] + !s1[i1] and @s2[i2] <= @s1[i1] + !s1[i1] + 300 and (for any i3 in (1..#s3) : (@s3[i3] >= @s2[i2] + !s2[i2] and @s3[i3] <= @s2[i2] + !s2[i2] + 1000 and (for any i4 in (1..#s4) : (@s4[i4] >= @s3[i3] + !s3[i3] and @s4[i4] <= @s3[i3] + !s3[i3] + 250 and (for any i5 in (1..#s5) : (@s5[i5] >= @s4[i4] + !s4[i4] and @s5[i5] <= @s4[i4] + !s4[i4] + 300 and (true))))))))))))
      }
- id: python-discord-webhook-constant
  desc: Assigns Discord webhook URL in Python
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)WEBHOOK_URL\s*=\s*["'']https://discord\.com/api/webhooks/'
- id: python-pip-install-json-notice
  desc: Pip installation text near JSON encoding
  # Missing-dependency errors also serialize installation guidance.
  crit: component
  conf: 0.97
  if:
    type: text
    regex: '(?is)json\.dumps\([^)]{0,160}\binstalled\b[^)]{0,80}\bpip\b'

composite_rules:
  - id: python-install-hook-discord-pip-notification
    desc: Install hook sends a package installation beacon to Discord
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: python-discord-webhook-constant
      - id: python-pip-install-json-notice
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
