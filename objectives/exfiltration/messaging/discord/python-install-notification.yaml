defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041,T1567.002

traits:
  - id: python-discord-webhook-constant
    desc: Assigns Discord webhook URL in Python
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)WEBHOOK_URL\s*=\s*["'']https://discord\.com/api/webhooks/'
  - id: python-pip-install-json-notice
    desc: Serializes pip installation notice as JSON
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)json\.dumps\([^)]{0,160}\binstalled\b[^)]{0,80}\bpip\b'

composite_rules:
  - id: python-install-hook-discord-pip-notification
    desc: Install hook sends a package installation beacon to Discord
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: python-discord-webhook-constant
      - id: python-pip-install-json-notice
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
