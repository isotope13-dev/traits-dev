defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: credential-field-label
    desc: Credential field label
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bname\s*:\s*(["''])\s*(🔑\s*)?token\b.{0,180}\bvalue\s*:'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder
