defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

traits:
  - id: python-discord-token-webhook-url
    desc: Python assigns Discord token webhook URL
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)token_webhook\s*=\s*[''"]https?://discord(app)?\.com/api/webhooks/'

# Harvested secrets POSTed to an anonymous webhook sink is the standard
# Python infostealer exfil pattern (browser logins, tokens, cookies bundled
# into a report and delivered via urllib). Benign Discord integrations post
# notifications but never harvest browser credential stores in the same file,
# which is what the credential-source legs discriminate on.
composite_rules:
  - id: python-discord-webhook-credential-exfil
    desc: Python POSTs harvested credentials to Discord webhook
    crit: hostile
    conf: 0.98
    attack: T1041,T1552.001
    mbc: E1041
    for: [python, whl, python-sdist]
    all:
      - id: micro-behaviors/communications/http/webhook::python-discord-webhook-api-path
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-positional-body
    any:
      - id: objectives/credential-access/browser/chromium::chromium-profile-credential-query
      - id: micro-behaviors/fs/path/app-data/application::discord-local-storage-path

  - id: python-telegram-credential-source
    desc: Python Telegram credential source alternative
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: micro-behaviors/fs/path/token::telegram-session-hash-prefix
      - id: micro-behaviors/fs/path/token::telegram-map-location

  - id: python-discord-webhook-telegram-exfil
    desc: Posts Telegram session data to Discord webhook
    crit: hostile
    conf: 0.98
    attack: T1539,T1041,T1567.002
    mbc: E1041
    for: [python, whl, python-sdist]
    all:
      - id: python-telegram-credential-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path

  - id: python-geolocation-discovery-source
    desc: Python geolocation discovery source alternative
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/ip-discovery::geolocation-db-com
      - id: micro-behaviors/communications/http/ip-discovery::ipinfo-io
      - id: micro-behaviors/communications/http/ip-discovery::ip-api-com
      - id: micro-behaviors/communications/http/ip-discovery::geo-endpoint-with-fields

  - id: python-discord-webhook-geolocation-exfil
    desc: Posts geolocation discovery to Discord webhook
    crit: hostile
    conf: 0.98
    attack: T1082,T1041,T1567.002
    mbc: E1041
    for: [python, whl, python-sdist]
    all:
      - id: python-geolocation-discovery-source
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
