defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1082,T1195.002

traits:
  - id: dingtalk-webhook-constant
    desc: Script configures DingTalk robot webhook
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'DINGTALK_WEBHOOK\s*=\s*["\x27]https://oapi\.dingtalk\.com/robot/send\?access_token='

  # Every agent registry reports os.hostname()/os.platform(); only the DingTalk composite makes it a profile upload.
  - id: system-info-host-profile
    desc: System info includes hostname and platform
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(?s)hostname:\s*os\.hostname\(\).{0,80}platform:\s*os\.platform\(\)'

  - id: dingtalk-profile-format
    desc: Webhook message includes host and IP
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)\$\{info\.hostname\}.{0,200}\$\{info\.localIP\}.{0,100}\$\{info\.publicIP\}'

  - id: dingtalk-profile-dispatch
    desc: Script posts payload to DingTalk
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'axios\.post\(DINGTALK_WEBHOOK,\s*payload'

  - id: system-profile-send
    desc: Script sends collected system profile
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)getSystemInfo\(\).{0,100}sendToDingTalk\(info\)'

composite_rules:
  - id: node-dingtalk-system-profile
    desc: Script posts system profile to DingTalk robot
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: dingtalk-webhook-constant
      - id: system-info-host-profile
      - id: dingtalk-profile-format
      - id: dingtalk-profile-dispatch
      - id: system-profile-send
