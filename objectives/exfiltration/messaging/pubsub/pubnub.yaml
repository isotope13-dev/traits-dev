# The command-output -> HTTP URL transfer is bound. The PubNub publish route
# is same-file context, not proof that this particular request uses that route;
# retain suspicious severity and require proven subscription-fed execution.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: suspicious
  conf: 0.95
  attack: T1041

composite_rules:
  - id: python-pubnub-tasking-command-output-upload
    desc: Python PubNub tasking uploads command output
    for: [python]
    all:
      - id: micro-behaviors/communications/messaging/pubsub::pubnub-publish-url
      - id: micro-behaviors/communications/http/request/url::python-command-output-request-url
      - id: objectives/command-and-control/remote-command/dispatch/command::python-pubnub-response-command
    near_bytes: 4096

  - id: node-pubnub-tasking-command-output-upload
    desc: Node PubNub tasking uploads command output
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/messaging/pubsub::pubnub-publish-url
      - id: micro-behaviors/communications/http/request/url::node-execsync-result-request-url
      - id: objectives/command-and-control/remote-command/dispatch/command::node-pubnub-response-shell-command
    near_bytes: 4096
