defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1048,T1082,T1033
traits:
- id: node-hex-chunked-dns-host-profile
  desc: Sends hex host and user through DNS
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /function\s+sendDns\s*\(\s*data\s*,/s
          $b0_1 = /Buffer\.from\s*\(\s*data\s*\)\.toString\s*\(\s*["']hex["']\s*\)/s
          $b0_2 = /dns\.lookup\s*\(\s*`[^`]*\$\{hex\}[^`]*`/s
          $b0_3 = /sendDns\s*\(\s*os\.hostname\s*\(\s*\)/s
          $b0_4 = /os\.userInfo\s*\(\s*\)\.username/s
          $b0_5 = /sendDns\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 800 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 2500 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 500 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 200 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-preinstall-hex-chunked-dns-host-profile
  desc: npm install reports host and user through DNS labels
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/dns/encoded::node-hex-chunked-dns-host-profile
