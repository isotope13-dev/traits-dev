# Bind standard imports, hostname source and actual DNS-query argument.
# Import aliases, variable names, method variants and domains may vary.
#
# Value provenance, not tree shape: the resolver's argument derives from
# `Buffer.from(<hostname>).toString("hex")` through any binding, `.slice()`
# or concatenation. The former tree-sitter query unrolled each of those shapes
# by hand and walked every top-level statement for 5 s per minified bundle.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-hex-host-identifier-dns-query
    desc: Sends hex-encoded hostname in DNS queries
    crit: suspicious
    conf: 0.98
    attack: T1048.003,T1082
    all:
      - id: metadata/import/npm/os
      - id: metadata/import/npm/dns
      - id: micro-behaviors/os/sysinfo/hostname::node-hostname-buffer
      - id: micro-behaviors/communications/dns/resolver::node-hex-buffer-query
