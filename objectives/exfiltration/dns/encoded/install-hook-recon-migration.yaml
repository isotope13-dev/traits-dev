defaults:
  attack: T1048.003
  platforms:
  - unix
  - windows
traits:
- id: js-xxd-nslookup-loop
  desc: JS exec hex chunks into nslookup loop
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: text
    regex: xxd\s+-p.{0,40}\|\s*while\s+read\s+\w+;do\s+nslookup

composite_rules:
- id: npm-preinstall-path-segment-dns-exfil
  desc: NPM preinstall exfils path segments as DNS labels
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/package/scripts/lifecycle::preinstall-looped-path-segment-dns-exfil
