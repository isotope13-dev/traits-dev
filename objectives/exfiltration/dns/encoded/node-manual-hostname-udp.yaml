defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1048.003,T1082

traits:
  - id: encode-manual-dns-input
    desc: Script hex encodes DNS input
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'hexEncodedData\s*=\s*Buffer\.from\(data,\s*["\x27]utf8["\x27]\)\.toString\(["\x27]hex'

  - id: manual-dns-exfil-name
    desc: Script embeds encoded data in DNS name
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '${hexEncodedData}.exfl.${PINGBACK_DOMAIN}'

  - id: manual-dns-udp-packet
    desc: Script sends constructed DNS packet over UDP
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)createSocket\(["\x27]udp4["\x27]\).{0,100}client\.send\(packet'

  - id: manual-dns-hostname-input
    desc: Script sends hostname through DNS helper
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)secretData\s*=\s*os\.hostname\(\).{0,100}sendManualPingback\(secretData\)'

composite_rules:
  - id: node-manual-udp-hostname-dns-exfil
    desc: Script sends hex hostname in manually constructed DNS packet
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: encode-manual-dns-input
      - id: manual-dns-exfil-name
      - id: manual-dns-udp-packet
      - id: manual-dns-hostname-input
