defaults:
  platforms: [linux, macos, windows]
  attack: T1048.003,T1195.002
traits:
  - id: npm-host-profile-name-field
    desc: JavaScript host profile has OS name field
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '["\x27]?hn["\x27]?\s*:\s*os[.\[]'
  - id: npm-host-profile-user-field
    desc: JavaScript host profile has OS user field
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '["\x27]?un["\x27]?\s*:\s*os[.\[]'
  - id: npm-host-profile-path-field
    desc: JavaScript host profile includes module path
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: '["\x27]?c["\x27]?\s*:\s*__dirname'
composite_rules:
  - id: js-analysis-gated-dns-http-host-profile
    desc: JavaScript gates host profile and DNS exfiltration behind analysis check
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: objectives/anti-analysis/sandbox-detect/artifact/known::check-analysis-hostname
      - id: metadata/lang/source/syntax/object::http-request-options-object-shape
      - id: micro-behaviors/communications/dns/resolver::dns-require-bound-lookup
      - id: npm-host-profile-name-field
      - id: npm-host-profile-user-field
      - id: npm-host-profile-path-field

  - id: npm-analysis-gated-dns-http-host-profile
    desc: Install code gates host profile and DNS traffic
    crit: hostile
    conf: 0.96
    for: [alpine_apk, npm, tar, package.json, javascript]
    scope: outer
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: objectives/anti-analysis/sandbox-detect/artifact/known::check-analysis-hostname
      - id: metadata/lang/source/syntax/object::http-request-options-object-shape
      - id: micro-behaviors/communications/dns/resolver::dns-require-bound-lookup
      - id: npm-host-profile-name-field
      - id: npm-host-profile-user-field
      - id: npm-host-profile-path-field
