defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1048.003,T1082

traits:
  - id: js-canary-os-user-host-version
    desc: Builds user and host version profile
    crit: notable
    if:
      type: text
      regex: '(?s)os\.userInfo\(\)\.username.{0,60}os\.version\(\).{0,60}os\.hostname\(\)'

  - id: js-canary-base32-basic-info
    desc: Base32 encodes basic host information
    crit: notable
    if:
      type: text
      regex: 'base32\.encode\(\s*await\s+getBasicInfo\(\)\s*\)'

  - id: js-canary-dns-chunk-loop
    desc: Splits encoded profile into DNS labels
    crit: notable
    if:
      type: text
      regex: 'basic_info\.slice\(i,\s*i\s*\+\s*63\)'

  - id: js-canarytokens-array
    desc: Builds Canarytokens domain from labels
    crit: notable
    if:
      type: text
      regex: '["'']canarytokens["'']\s*,\s*["'']com["'']'

  - id: js-canary-exfil-domain-lookup
    desc: Resolves constructed exfiltration domain
    crit: notable
    if:
      type: text
      regex: 'dns\.lookup\(\s*exfil_domain\s*,'

composite_rules:
  - id: node-base32-canary-profile-dns
    desc: Sends encoded host profile to Canarytokens
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-canary-os-user-host-version
      - id: js-canary-base32-basic-info
      - id: js-canary-dns-chunk-loop
      - id: js-canarytokens-array
      - id: js-canary-exfil-domain-lookup
