defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1195.002,T1048.003,T1082

traits:
  - id: host-cwd-json-profile
    desc: Script serializes hostname and directory
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)h:\s*os\.hostname\(\).{0,100}c:\s*process\.cwd\(\).{0,100}JSON\.stringify\(data\)'

  - id: hex-json-chunks
    desc: Script hex encodes and chunks JSON
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)Buffer\.from\(jsonData\)\.toString\(["\x27]hex["\x27]\).{0,100}hexData\.match\('

  - id: oast-chunk-template
    desc: DNS name includes encoded chunk and suffix
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '${idx}.${chunk}.v2_e${suffix}'

  - id: resolve-constructed-hosts
    desc: Script resolves constructed hostnames
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)dns\.resolve4\(hostname.{0,700}chunks\.forEach.{0,500}resolveDns\(host1'

composite_rules:
  - id: node-chunked-host-json-dns
    desc: Script sends hex encoded host profile in DNS chunks
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: host-cwd-json-profile
      - id: hex-json-chunks
      - id: oast-chunk-template
      - id: resolve-constructed-hosts
