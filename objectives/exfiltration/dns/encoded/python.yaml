defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: hostile
composite_rules:
- id: python-b32-host-profile-dns-exfil
  desc: Host profile base32-encoded into a DNS label
  conf: 0.97
  near_lines: 60
  all:
  - id: micro-behaviors/data/encode/base32::python-b32encode-call
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
- id: python-b64-host-profile-dns-exfil
  desc: Host profile base64-encoded into a DNS label
  conf: 0.96
  near_lines: 60
  all:
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  any:
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
- id: python-b64-ping-dns-exfil
  desc: Ping resolves a base64 host-profile DNS label
  conf: 0.95
  near_lines: 60
  all:
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/icmp::python-ping-shell-call
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
- id: python-urlsafe-b64-env-dns-exfil
  desc: URL-safe base64 environment leaves via DNS
  conf: 0.96
  scope: file
  all:
  - id: micro-behaviors/data/encode/base64/primitive::urlsafe-b64encode-call
  - id: micro-behaviors/communications/dns/resolver::python-dns-cli-resolver
  - id: micro-behaviors/os/env/enumerate::python-environ-items-loop
- id: python-chunked-b32-dns-labels
  desc: Chunks a base32 payload into DNS labels
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/data/buffer/record::python-stepped-index-slice
  - id: micro-behaviors/data/encode/base32::python-b32encode-call
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
- id: python-hex-host-user-oob-dns-exfil
  desc: Hostname and username hex-encoded into an OOB DNS query
  conf: 0.98
  attack: T1048.003,T1082,T1033
  mbc: E1041
  all:
  - id: micro-behaviors/data/encode/hex::string-encode-hex
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/os/sysinfo/hostname/query::getfqdn
  - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
- id: python-b32-http-client-host-beacon
  desc: Host profile base32 leaves over HTTP
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/data/encode/base32::python-b32encode-call
  - id: micro-behaviors/communications/http/request/client::python-http-client-connection
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
