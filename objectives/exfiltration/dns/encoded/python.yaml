# Host identity base32-encoded into a DNS label and resolved.
#
# The sibling files describe this in Node; this is the Python spelling, which
# the corpus uses in `setup.py` install hooks. The mechanic is identical: the
# data never travels over a connection the victim can block or a proxy can
# read, only as the name being looked up, and the operator reads it off their
# own authoritative server.
#
# Base32 rather than base64 is the tell, and it is forced rather than chosen:
# DNS labels are case-insensitive and reject `+` and `/`, so base64 does not
# survive the round trip. Nothing else about encoding a username makes base32
# the sensible choice -- next to a resolver call it is the encoding picked
# because the sink is DNS.
#
# Worked example: an `Installer(install)` hook that base32-encodes
# `os.getlogin()` and `socket.gethostname()`, strips the `=` padding, joins
# them as `<user>.<host>.lib.<attacker domain>` and calls
# `socket.gethostbyname()` on the result.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: "T1048.003,T1082,T1033"
  mbc: "E1041"

composite_rules:
  - id: python-b32-host-profile-dns-exfil
    desc: Host profile base32-encoded into a DNS label
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/encode/base32::python-b32encode-call
      - id: micro-behaviors/communications/dns/lookup/resolver::gethostbyname
    any:
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/process/user/query::os-getlogin-python

  # Same landing report over DNS when the operator uses base64 labels instead
  # of base32. Resolution may be a libc lookup or `ping` of the constructed
  # name -- both cause the authoritative server to see the encoded identity.
  - id: python-b64-host-profile-dns-exfil
    desc: Host profile base64-encoded into a DNS label
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/process/user/query::python-getpass-user
    any:
      - id: micro-behaviors/communications/dns/lookup/resolver::gethostbyname
      - id: micro-behaviors/communications/dns/lookup/resolver::getaddrinfo
      - id: micro-behaviors/process/create/system::python-os-system

  - id: python-b64-ping-dns-exfil
    desc: Ping resolves a base64 host-profile DNS label
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/os/sysinfo/hostname::python-os-uname-nodename

  - id: python-silent-oob-dns-resolve
    desc: Silently resolves an OOB DNS name
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/dns/lookup/resolver::gethostbyname
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass

  # urlsafe base64 of the process environment, then dig/nslookup of the
  # labels. Base64's `+` and `/` are rewritten so the chunks survive DNS.
  - id: python-urlsafe-b64-env-dns-exfil
    desc: URL-safe base64 environment leaves via DNS
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/data/encode/base64::urlsafe-b64encode-call
      - id: micro-behaviors/communications/dns/lookup/resolver::python-dns-cli-resolver
      - id: micro-behaviors/os/env/enumeration::python-environ-items-loop

  # Same encoded identity, split into fixed-width labels and resolved.
  # One label is a beacon; a stepping slice is a tunnel.
  - id: python-chunked-b32-dns-labels
    desc: Chunks a base32 payload into DNS labels
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/data/encode/base64::python-stepped-index-slice
      - id: micro-behaviors/data/encode/base32::python-b32encode-call
      - id: micro-behaviors/communications/dns/lookup/resolver::gethostbyname

  - id: python-chunked-b64-dns-cli-labels
    desc: Chunks URL-safe base64 into DNS lookups
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/data/encode/base64::python-stepped-index-slice
      - id: micro-behaviors/data/encode/base64::urlsafe-b64encode-call
      - id: micro-behaviors/communications/dns/lookup/resolver::python-dns-cli-resolver

  - id: python-b32-http-client-host-beacon
    desc: Host profile base32 leaves over HTTP
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/data/encode/base32::python-b32encode-call
      - id: micro-behaviors/communications/http/request/client::python-http-client-connection
      - id: micro-behaviors/process/user/query::python-getpass-user

  - id: python-b64-identity-dns-and-http
    desc: Base64 identity leaves on DNS and HTTP
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/data/encode/base64::urlsafe-b64encode-call
      - id: micro-behaviors/communications/dns/lookup/resolver::python-dns-cli-resolver
      - id: micro-behaviors/communications/http/lib/requests::requests-get
