---
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - powershell
  - javascript
  - typescript
  - go
composite_rules:
- id: python-dns-a-record-output-exfil
  desc: Python Base32 encode and DNS lookup clues
  crit: suspicious
  conf: 0.97
  for:
  - python
  all:
  - id: micro-behaviors/data/encode/base32::python-b32encode-call
  any:
  - id: micro-behaviors/communications/dns/lookup::python-dnspython-resolve-a
  - id: micro-behaviors/communications/dns/lookup::python-dnspython-query-a
  near_bytes: 1024
