# npm hooks that hex-encode cwd, split it into legal DNS labels and resolve
# those labels as a query name. The per-sample domain is deliberately not part
# of the signature: any authoritative domain can receive the resolver query.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  attack: "T1048.003,T1082"
  mbc: "E1041"

composite_rules:
  - id: preinstall-hex-cwd-dns-exfil
    desc: Preinstall exfiltrates hex-encoded cwd through DNS
    crit: hostile
    conf: 0.99
    for: [package.json]
    attack: "T1195.002,T1048.003,T1082"
    all:
      - id: micro-behaviors/data/encode/hex::preinstall-hex-encodes-cwd
      - id: micro-behaviors/data/string/split::preinstall-splits-encoded-data-into-dns-labels
      - id: micro-behaviors/communications/dns/lookup::preinstall-queries-dns-with-joined-labels

  - id: npm-preinstall-hex-cwd-dns-exfil
    desc: npm preinstall exports cwd through encoded DNS labels
    crit: hostile
    conf: 0.99
    scope: package
    attack: "T1195.002,T1048.003,T1082"
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: preinstall-hex-cwd-dns-exfil
