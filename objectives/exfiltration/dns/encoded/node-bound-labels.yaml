defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1048.003,T1082,T1033
traits:
  - id: joined-data-to-charcode-lookup
    desc: Joined data reaches charcode lookup call
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @query
            value: (call_expression function: (member_expression object: (array)
              property: (property_identifier) @join))))
          (expression_statement (call_expression function: (subscript_expression
            index: (call_expression arguments: (arguments (array
              . (number) @l (number) @o1 (number) @o2 (number) @k (number) @u (number) @p .))))
            arguments: (arguments (identifier) @sent))))
          (#eq? @query @sent) (#eq? @join "join")
          (#match? @l "^(0x6[cC]|108)$") (#match? @o1 "^(0x6[fF]|111)$")
          (#match? @o2 "^(0x6[fF]|111)$") (#match? @k "^(0x6[bB]|107)$")
          (#match? @u "^(0x75|117)$") (#match? @p "^(0x70|112)$"))
composite_rules:
  - id: concealed-host-profile-label-lookup-exfiltration
    desc: Concealed host profile becomes DNS query labels
    crit: hostile
    conf: 0.99
    all:
      - id: joined-data-to-charcode-lookup
      - id: objectives/anti-static/obfuscation/encoding/numeric::node-charcode-host-profile-methods
