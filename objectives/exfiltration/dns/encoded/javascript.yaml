defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
traits:
- id: js-json-base64-dns-label
  desc: JSON data base64 encoded for DNS label
  crit: component
  conf: 0.94
  platforms: [unix, windows]
  attack: "T1048.003"
  if:
    type: text
    regex: 'Buffer\.from\(JSON\.stringify\(.{1,100}\)\)\.toString\(["'']base64'
- id: js-template-oast-pro-label
  desc: Template subdomain targets oast.pro
  crit: suspicious
  conf: 0.95
  platforms: [unix, windows]
  attack: "T1048.003"
  if:
    type: text
    regex: '`\$\{[A-Za-z0-9_]+\}\.[a-z0-9]{12,}\.oast\.pro`'
- id: js-template-oastify-payload-label
  desc: "Template subdomain sends payload field Oastify"
  crit: suspicious
  conf: 0.97
  platforms: [unix, windows]
  attack: "T1048.003"
  if:
    type: text
    regex: '`\$\{payload\.[A-Za-z0-9_]+\}\.\$\{[A-Z_]*HOST\}`'
- id: js-http-concat-subdomain-prefix
  desc: HTTP URL prefix concatenated with variable
  crit: component
  conf: 0.94
  platforms: [unix, windows]
  attack: "T1048.003"
  if:
    type: tree-sitter
    kind: binary_op
    regex: '[''"]https?://[''"]\s*\+\s*[A-Za-z_$][\w$]{0,40}\s*\+'
- id: js-oastify-subdomain-suffix
  desc: Concatenated Oastify hostname suffix
  crit: component
  conf: 0.94
  platforms: [unix, windows]
  attack: "T1048.003"
  if:
    type: text
    regex: '[''"](\.[a-z0-9-]{1,63}){1,4}\.oastify\.com[''"]'
composite_rules:
- id: npm-charcode-dns-profile-exfil
  desc: Install hook exfiltrates concealed host profile through DNS
  crit: hostile
  conf: 0.995
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
  scope: outer
  mbc: "E1041"
  attack: "T1048.003"
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: objectives/anti-static/obfuscation/imports::node-charcode-concealed-dns-resolution
  - id: objectives/anti-static/obfuscation/encoding/numeric::node-charcode-host-profile-methods
- id: js-concat-oastify-subdomain-fetch-target
  desc: Concatenated variable subdomain targets Oastify
  crit: suspicious
  conf: 0.97
  platforms: [unix, windows]
  attack: "T1048.003"
  near_lines: 3
  all:
  - id: js-http-concat-subdomain-prefix
  - id: js-oastify-subdomain-suffix
- id: js-oastify-hex-host-profile-subdomain
  desc: Prepares hex host identity in Oastify subdomain
  crit: suspicious
  conf: 0.995
  platforms: [unix, windows]
  attack: "T1048.003,T1082,T1033"
  near_bytes: 1200
  all:
  - id: js-concat-oastify-subdomain-fetch-target
  - id: micro-behaviors/data/encode/hex::js-to-string-hex
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-homedir-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
- id: js-dns-exfiltration-chunking
  desc: "DNS exfiltration via chunked subdomains"
  crit: hostile
  conf: 0.95
  mbc: "B0030"
  attack: "T1048.003"
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
  # A dotted template is ordinary hostname construction (for example an
  # identity resolver querying `_atproto.<handle>`). Require the stronger
  # regex-chunk-and-dot-join signal that actually assembles data-sized labels.
  - id: objectives/exfiltration/dns/prep::dns-regex-chunking
- id: js-dns-oast-json-profile-exfil
  desc: DNS OAST exfiltration of encoded host profile
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  mbc: "E1041"
  attack: "T1048.003"
  all:
  - id: metadata/import/builtin::require-dns
  - id: micro-behaviors/communications/dns/lookup/resolver::dns-lookup-call
  - id: objectives/exfiltration/oob/endpoint::interact-sh-pro-live
  - id: js-json-base64-dns-label
  - id: js-template-oast-pro-label
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-cwd-call
  - id: objectives/discovery/account/enum::username-env
- id: js-canarytokens-host-identity-dns-exfil
  desc: Canarytokens DNS exfiltration of host identity
  crit: hostile
  conf: 0.995
  platforms: [unix, windows]
  mbc: "E1041"
  attack: "T1048.003"
  all:
  - id: micro-behaviors/communications/dns/lookup/resolver::dns-lookup-call
  - id: objectives/exfiltration/oob/endpoint::canarytokens-com
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: micro-behaviors/data/encode/base32::rfc4648-lowercase-alphabet
- id: js-oastify-template-subdomain-exfil
  desc: Oastify DNS exfiltration via templated subdomain
  crit: hostile
  conf: 0.995
  platforms: [unix, windows]
  mbc: "E1041"
  attack: "T1048.003"
  all:
  - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
  - id: objectives/exfiltration/oob/endpoint::oastify
  - id: js-template-oastify-payload-label
- id: js-oastify-hex-host-user-subdomain-exfil
  desc: Node host/user/home identifiers exfiltrated as hex Oastify subdomains
  crit: hostile
  conf: 0.995
  platforms: [unix, windows]
  mbc: "E1041"
  attack: "T1048.003"
  all:
  - id: js-oastify-hex-host-profile-subdomain
  any:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/benchmark/speedtest::network-speed-download-check
- id: js-obfuscated-dns-label-exfil
  desc: Obfuscated DNS canary label exfiltration
  crit: hostile
  conf: 0.99
  attack: "T1027.007,T1048.003"
  mbc: "B0032,E1041"
  all:
  - id: objectives/supply-chain/recon-exfil/dns::encoded-dnshook-canary
  - id: micro-behaviors/data/source/property/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat::js-dotted-variable-concat
  - id: micro-behaviors/data/source/dynamic/load::node-computed-require-call
- id: js-hex-host-profile-resolve4-exfil
  desc: Hex-encoded host profile exfiltrated through DNS A queries
  crit: hostile
  conf: 0.998
  attack: "T1027.013,T1048.003,T1082"
  mbc: "B0032,E1041"
  near_bytes: 2048
  all:
  - id: objectives/anti-static/obfuscation/imports::node-hex-string-concealed-dns-resolution
  - id: objectives/anti-static/obfuscation/encoding/hex::node-hex-concealed-host-profile
  - id: micro-behaviors/data/encode/hex::buffer-hex
  - id: micro-behaviors/data/string/concat::dot-joined-array-values
# One DNS query per payload chunk. The loop never materialises the single
# dotted string `js-dns-exfiltration-chunking` looks for: each label-width
# piece is concatenated with an index and the listener zone and resolved on its
# own, so the reassembly happens at the nameserver. Chunk width capped below
# the 63-byte label limit plus dotted assembly plus a resolver call is the
# whole transport; the encoding leg keeps ordinary text-wrapping loops out.
- id: js-chunked-dns-label-payload-exfil
  desc: Encoded payload chunked into DNS labels and resolved
  crit: hostile
  conf: 0.97
  platforms: [unix, windows]
  mbc: "E1041"
  attack: "T1048.003"
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
  - id: objectives/exfiltration/dns/prep::dns-label-width-chunking
  - id: micro-behaviors/data/string/concat::js-dotted-variable-concat
  any:
  - id: micro-behaviors/data/encode/hex::buffer-hex
  - id: micro-behaviors/data/encode/base32::rfc4648-lowercase-alphabet
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  unless:
  - id: metadata/package/testing/presence/harness/
