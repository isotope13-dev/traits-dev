defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1048.003,T1082,T1033

traits:
  - id: node-digitalexp-dns-domain
    desc: Constructs digitalexp DNS beacon domain
    crit: suspicious
    if:
      type: text
      substr: "'dscl9']).join('.') + '.b0.rs'"
  - id: node-digitalexp-profile-fields
    desc: Collects hostname username and working directory
    crit: notable
    if:
      type: text
      substr: "[os.hostname(), (os.userInfo && os.userInfo().username) || '', process.cwd()]"
  - id: node-digitalexp-profile-hex
    desc: Encodes collected profile as hex
    crit: notable
    if:
      type: text
      substr: "Buffer.from(info).toString('hex')"
  - id: node-digitalexp-dns-lookup
    desc: Resolves constructed beacon hostname
    crit: notable
    if:
      type: text
      substr: "require('dns').lookup(host"

composite_rules:
  - id: node-digitalexp-hex-dns-profile
    desc: Sends host identity in DNS labels
    crit: hostile
    conf: 0.99
    all:
      - id: node-digitalexp-dns-domain
      - id: node-digitalexp-profile-fields
      - id: node-digitalexp-profile-hex
      - id: node-digitalexp-dns-lookup
