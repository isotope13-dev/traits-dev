defaults:
  platforms: [unix, appliance, windows]
  for: [javascript, typescript]
  attack: T1048.003

traits:
  # Some DNS exfiltrators issue one query per indexed payload chunk instead of
  # joining chunks into a dotted name. This text motif corroborates the query.
  - id: node-dns-query-indexed-payload-slice
    desc: Resolver call near payload segments
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'resolve.{0,80}segments'
  - id: node-base32-label-chunker
    desc: Node base32 DNS label chunker
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567[\s\S]{0,320}labelLen\s*=\s*48'

  - id: node-json-secret-file-payload
    desc: Node JSON secret file payload
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'JSON\.stringify\(\{[\s\S]{0,220}secrets:[\s\S]{0,120}files:'
    # Unit-test policy fixtures shape payloads the same way (and assert on
    # them); tests never exfiltrate.
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

composite_rules:
  - id: node-base32-host-user-dns-exfil
    desc: Exfiltrates a host and user profile through indexed Base32 DNS labels
    crit: hostile
    conf: 0.98
    attack: T1033,T1082,T1048.003
    mbc: E1041
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
      - id: micro-behaviors/data/encode/base32::rfc4648-lowercase-alphabet
      - id: micro-behaviors/data/encode/base32::node-five-bit-loop
      - id: micro-behaviors/data/buffer/chunk::js-slice-chunk-push
      - id: node-dns-query-indexed-payload-slice

  - id: node-base32-dns-secret-exfil
    desc: Node base32 DNS secret exfil
    crit: hostile
    conf: 0.98
    all:
      - id: node-base32-label-chunker
      - id: node-json-secret-file-payload
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
