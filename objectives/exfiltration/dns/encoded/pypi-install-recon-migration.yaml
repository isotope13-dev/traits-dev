defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- attack: T1020
  id: pypi-install-dns-oob-exfil
  desc: PyPI install hook DNS OOB exfiltration
  crit: hostile
  conf: 0.98
  mbc: E1041
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/package-manager/hook-install::install-scripts-class
  - id: micro-behaviors/communications/dns/server::hardcoded-dns-nameserver
  - id: micro-behaviors/communications/url/host/oob/endpoint::burpcollaborator
  - id: micro-behaviors/communications/url/host/label::long-alphanumeric-third-level-label
  any:
  - id: micro-behaviors/data/encode/hex::ord-hex-join-encode
  - id: objectives/supply-chain/impersonation/registry/entrypoint::pypi-pip3-entrypoint-hijack
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
