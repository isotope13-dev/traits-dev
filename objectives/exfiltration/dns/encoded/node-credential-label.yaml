defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1048.003
  mbc: E1041
  crit: hostile
  conf: 0.98

composite_rules:
  - id: node-encoded-credential-dns-label-exfil
    desc: Encoded credential resolved via module-load DNS
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
      - id: micro-behaviors/communications/dns/resolver::node-module-load-dns-request
    any:
      - id: micro-behaviors/communications/dns/resolver::node-hex-buffer-query
      - id: micro-behaviors/communications/dns/resolver::node-base64-buffer-query
