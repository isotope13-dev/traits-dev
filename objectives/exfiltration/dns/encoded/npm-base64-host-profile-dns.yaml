defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1048,T1082
traits:
- id: node-base64-host-profile-dns
  desc: Sends Base64 host profile through DNS
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /os\.hostname\s*\(\s*\)/s
          $b0_1 = /process\.cwd\s*\(\s*\)/s
          $b0_2 = /JSON\.stringify\s*\(/s
          $b0_3 = /Buffer\.from\s*\(/s
          $b0_4 = /\.toString\s*\(\s*["']base64["']\s*\)/s
          $b0_5 = /dns\.resolve4\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 3000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 200 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 100 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 1500 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-preinstall-base64-host-profile-dns
  desc: npm preinstall sends encoded host profile via DNS
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/dns/encoded::node-base64-host-profile-dns
