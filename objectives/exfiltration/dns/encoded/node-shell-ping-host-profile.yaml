defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1048.003,T1033,T1082
  mbc: E1041

traits:
- id: node-shell-id-hostname-chain
  desc: Shell chain queries user then hostname
  crit: notable
  conf: 0.99
  if:
    type: text
    exclude_comments: true
    regex: '(?i)\b(whoami|id)\b\s*(&&|;|\|\||\|)\s*(\w+\s*(&&|;|\|\|)\s*){0,3}hostname\b'
- id: node-shell-whoami-hostname-span
  desc: whoami followed closely by hostname
  crit: notable
  conf: 0.99
  if:
    type: text
    # Require shell sequencing between the commands. A loose span also fires
    # on comments that merely document an install hook.
    exclude_comments: true
    regex: '(?i)\bwhoami\b\s*(&&|;|\|\||\|)\s*(\w+\s*(&&|;|\|\|)\s*){0,3}hostname\b'
- id: node-shell-id-hostname-substitution
  desc: Command substitutions query user and hostname
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?i)\$\((whoami|id)\)[^\n]{0,60}\$\(hostname\)'
- id: node-shell-ip-and-working-directory
  desc: Shell queries public IP and working directory
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?is)(curl[^\n]{0,80}(ifconfig\.me|api\.ipify\.org)|ipconfig\.me).{0,220}pwd'
- id: node-shell-ping-hostname-domain
  desc: Pings hostname-derived domain
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)ping\s+\$[A-Za-z_$][\w$]*\.[A-Za-z0-9.-]{8,}'

composite_rules:
- id: node-shell-id-hostname-query
  desc: Shell queries user and hostname
  crit: notable
  conf: 0.99
  any:
  - id: node-shell-id-hostname-chain
  - id: node-shell-whoami-hostname-span
  - id: node-shell-id-hostname-substitution

- id: node-shell-host-profile-dns-ping-exfil
  desc: Exfiltrates command-collected host profile through DNS pings
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: node-shell-host-profile-ping-domain

- id: node-shell-host-profile-ping-domain
  desc: Sends host profile through DNS ping
  crit: suspicious
  conf: 0.99
  near_bytes: 1000
  all:
  - id: node-shell-id-hostname-query
  - id: node-shell-ip-and-working-directory
  - id: node-shell-ping-hostname-domain
