defaults:
  platforms: [unix, windows]
  for: [rust]
composite_rules:
  # The collector domain is spelled as a byte array and the lookup carries a
  # value in front of it. Spelling a hostname as bytes hides it from search.
  - id: rust-byte-array-resolver-dns-label-lookup
    desc: Rust looks up a value under a byte-array domain
    crit: hostile
    conf: 0.93
    attack: T1048.003,T1027
    scope: file
    near_bytes: 2500
    all:
      - id: micro-behaviors/data/string/encoding::rust-printable-byte-array-from-utf8
      - id: micro-behaviors/communications/dns/cli::rust-dns-cli-command-new
      - id: micro-behaviors/communications/dns/cli::rust-dns-query-value-dot-host-format
