defaults:
  platforms: [unix, windows, macos]
  for: [javascript, typescript]
composite_rules:
  - id: js-dns-tunneling-exfil
    desc: JavaScript DNS tunneling exfiltration of system metadata
    crit: hostile
    all:
      - id: objectives/command-and-control/dns/tunneling::js-dns-tunneling-construction
      - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
    any:
      - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
      - id: objectives/discovery/system/fingerprint/user::node-host-user-query
  - id: js-dns-tunneling-chunked-exfil
    desc: DNS exfiltration using regex chunking and template subdomains
    crit: hostile
    conf: 0.95
    attack: "T1071.004"
    all:
      - id: objectives/exfiltration/dns/prep::dns-regex-chunking
      - id: micro-behaviors/data/string/concat::js-dotted-template-string
      - id: micro-behaviors/data/encode/hex::buffer-hex
    any:
      - id: micro-behaviors/communications/dns/lookup/resolver::dns-resolve4
      - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
  - id: js-interactsh-recon-exfil
    desc: System reconnaissance exfiltrated via Interactsh DNS
    crit: hostile
    conf: 0.95
    attack: "T1567.002"
    all:
      - id: objectives/exfiltration/oob/endpoint::interact-sh-me-fun
      - id: micro-behaviors/os/sysinfo/
    any:
      - id: micro-behaviors/communications/dns/lookup/resolver::dns-resolve4
      - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
      - id: micro-behaviors/data/string/concat::js-dotted-template-string
  - id: js-nslookup-dns-tunnel-exfil
    desc: DNS tunnel exfiltration via nslookup exec
    crit: hostile
    conf: 0.95
    attack: "T1048.003"
    mbc: "E1041"
    all:
      - id: micro-behaviors/communications/dns/cli::nslookup-exec
      - id: micro-behaviors/data/encode/hex::xxd-hex-encode
    any:
      - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
      - id: metadata/import/builtin::require-child-process
  # Host-profile DNS exfil without hex chunking: whoami + hostname are sent as
  # DNS labels via nslookup (often through a custom resolver IP).
  - id: js-nslookup-host-profile-dns-exfil
    desc: Host identity exfiltrated via nslookup DNS labels
    crit: hostile
    conf: 0.97
    attack: "T1048.003,T1082,T1033"
    mbc: "E1041"
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/cli::nslookup-exec
      - id: micro-behaviors/data/string/concat::leading-variable-dotted-name
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/os/sysinfo/hostname::node-shell-hostname-command
    any:
      - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
      - id: metadata/import/builtin::require-child-process
  - id: js-nslookup-custom-resolver-host-exfil
    desc: Host identity DNS exfil via custom nslookup resolver
    crit: hostile
    conf: 0.98
    attack: "T1048.003,T1071.004,T1082,T1033"
    mbc: "E1041"
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/cli::nslookup-custom-resolver-exec
      - id: micro-behaviors/data/string/concat::leading-variable-dotted-name
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/os/sysinfo/hostname::node-shell-hostname-command
