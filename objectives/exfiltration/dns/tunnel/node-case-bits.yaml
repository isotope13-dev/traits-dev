# Case conversion and low-bit extraction near a one-way DNS query suggest
# a case-based channel. Proximity does not prove data flow or delivery.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-case-bit-dns-channel
    desc: Conditional casing and low-bit masks near discarded DNS queries
    crit: suspicious
    conf: 0.94
    attack: T1048.003
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/string/case::javascript-conditional-case-transform
      - id: micro-behaviors/data/bitwise/mask::javascript-low-bit-mask
      - id: micro-behaviors/communications/dns/resolver::node-dns-query-result-discarded
