# A native binary that reads local identity/credential files and moves them
# out over a hand-built DNS tunnel. This is the shape of the torchtriton PyPI
# backdoor (2022): a compromised dependency that won resolution over PyTorch's
# internal package, then read `/etc/passwd`, `~/.gitconfig`, `~/.ssh` and the
# environment and base62-encoded each into DNS query labels sent straight to
# the resolvers in `/etc/resolv.conf`.
#
# The per-language DNS rules key on label format strings (`%s.exfil.%s`); a
# C++ binary that implements the protocol itself carries none, so it needed a
# rule keyed on the packet-builder plus the files it collects.
defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1048.003
  mbc: B0030

composite_rules:
  - id: native-dns-tunnel-identity-exfil
    desc: Native DNS tunnel exfiltrates identity files
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/dns/raw::native-dns-packet-tunnel-client
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::gitconfig-file
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-private-key
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-authorized-keys
    unless:
      - id: metadata/package/testing/presence/harness/
