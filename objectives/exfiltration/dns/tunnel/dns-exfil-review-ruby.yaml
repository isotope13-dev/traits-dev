defaults:
  platforms: [unix, openwrt]
  for: [ruby]
  attack: T1048.003

composite_rules:
  - id: ruby-dns-subdomain-exfil
    desc: Ruby DNS subdomain exfiltration
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/dns/resolver::dns-resolve
      - id: micro-behaviors/data/encode/base64/primitive::ruby-base64-urlsafe-encode
    any:
      - id: metadata/lang/source/naming/function/communication::ruby-dns-exfiltrate-label
      - id: metadata/lang/source/literal/string/shape::ruby-exfil-subdomain-prefix
      - id: micro-behaviors/data/serialize/json::ruby-dns-json-secret-report
      - id: metadata/lang/natural/vocabulary/dns::dns-exfil
    needs: 1
