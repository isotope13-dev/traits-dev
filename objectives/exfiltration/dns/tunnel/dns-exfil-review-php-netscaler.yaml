defaults:
  platforms: [netscaler, appliance, unix]
  for: [php]
  attack: T1048.003

composite_rules:
  - id: php-dns-chunk-exfil
    desc: PHP DNS chunk exfil
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/function/communication::php-dns-exfil-function
      - id: micro-behaviors/data/string/split::php-base64-dns-chunks
    any:
      - id: micro-behaviors/communications/dns/lookup::php-netscaler-dns-get-record
