defaults:
  platforms: [unix]
  for: [zig, elf]
  attack: T1048.003

traits:
  - id: zig-dns-hex-chunk-loop
    desc: Zig DNS hex chunk loop
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'chunk_size: usize = 30[\s\S]{0,340}hex\[idx\.\.end\]'

  - id: zig-dns-txt-build
    desc: Zig builds DNS TXT query
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'Question type: TXT[\s\S]{0,120}Question class: IN'

  - id: zig-posix-dns-sendto
    desc: Zig sends DNS UDP packet
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'DNS_SERVER[\s\S]{0,900}posix\.sendto'
  - id: zig-dns-txt-type-comment
    desc: Zig DNS TXT query type bytes
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Type TXT (16), Class IN (1)'
  - id: zig-dns-udp-port-53
    desc: Zig UDP sendto port 53
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'htons\(53\)[\s\S]{0,220}sendto'

composite_rules:
  - id: zig-dns-sensitive-data-exfil
    desc: Zig DNS sensitive data exfil
    crit: hostile
    conf: 0.98
    all:
      - id: zig-dns-hex-chunk-loop
      - id: zig-dns-txt-build
      - id: micro-behaviors/fs/path/account-db::unix-shadow-root-ssh-paths
      - id: zig-posix-dns-sendto
  - id: zig-dns-exfil-txt-tunnel
    desc: Zig DNS TXT .exfil. tunnel
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/exfiltration/dns/prep::dns-exfil-label
      - id: zig-dns-txt-type-comment
      - id: zig-dns-udp-port-53
