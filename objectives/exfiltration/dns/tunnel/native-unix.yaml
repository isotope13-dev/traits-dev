defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1048.003

traits:
  - id: native-dns-exfil-label-template
    desc: DNS exfil label with printf substitution
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # Require a native format substitution, not an arbitrary hostname
      # containing .exfil. in bundled guides, examples, or captured traffic.
      regex: '(%s\.)?exfil\.%s'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename

  - id: native-dns-beacon-label-template
    desc: Native DNS beacon label template
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Format-string DNS labels only. Bare `.beacon.` matches Ethereum
      # client metric paths (consensus.engine.beacon.*).
      regex: '(%s\.)?beacon\.%s'

composite_rules:
  - id: native-dns-label-exfil
    desc: Native DNS label exfil
    crit: hostile
    conf: 0.98
    all:
      - id: native-dns-exfil-label-template
      - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
    any:
      - id: micro-behaviors/communications/ip/resolve::hex-format-hostname-resolution-profile
      - id: metadata/file/literal::dns-exfil

  - id: native-dns-beacon-c2
    desc: Native DNS beacon C2
    crit: hostile
    conf: 0.97
    all:
      - id: native-dns-beacon-label-template
      - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
    any:
      - id: metadata/file/literal::dns-c2
      - id: metadata/file/literal::dns-beacon
