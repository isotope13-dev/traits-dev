defaults:
  platforms: [netscaler, appliance, unix]
  for: [java, kotlin, class]
  attack: T1048.003

traits:

  - id: jvm-dns-chunk-query-format
    desc: JVM DNS chunk query format
    crit: suspicious
    conf: 0.92
    for: [java, kotlin]
    if:
      type: text
      substr: "%04d.%s.%s"

  - id: jvm-dns-format-bytecode
    desc: JVM DNS format bytecode
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: text
      substr: '%04d.%s.%s'

composite_rules:

  - id: jvm-netscaler-dns-bytecode
    desc: JVM NetScaler DNS bytecode
    crit: hostile
    conf: 0.97
    for: [class, jar]
    all:
      - id: jvm-dns-format-bytecode
      - id: micro-behaviors/communications/dns/lookup/resolver::jvm-inetaddress-getallbyname-bytecode
