defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1048.003,T1082,T1195.002
  mbc: E1041

composite_rules:
  # A build script that derives a DNS label from its collected profile and
  # invokes a resolver against an OOB suffix has a complete source-to-sink
  # chain. The HTTP POST is intentionally not required: this covers fallback
  # channels and DNS-only future variants.
  - id: rust-build-oob-dns-profile-exfil
    desc: Rust build hook sends host profile through an OOB DNS label
    crit: hostile
    conf: 0.99
    all:
    - id: micro-behaviors/os/sysinfo/report::rust-build-host-user-command-recon
    - id: micro-behaviors/communications/url/host/oob/endpoint::interact-sh-me-fun
    - id: micro-behaviors/communications/dns/cli::rust-nslookup-command-reference
    - id: micro-behaviors/process/create/subprocess/configure::rust-shell-command-runner

