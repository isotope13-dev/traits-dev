defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1048.003,T1082,T1195.002
  mbc: E1041

traits:
  # micro-behaviors/communications/dns/cli::nslookup is explicitly for:
  # [shell] (its file's [scripts, binaries] default is even narrower than
  # that), so it structurally cannot match Rust source (ft-impossible). This
  # local atom carries the same bare-keyword evidence for Rust build scripts,
  # which invoke it wrapped in Command::new / a spawned shell string.
  - id: rust-nslookup-command-reference
    desc: Rust source references nslookup command
    crit: notable
    conf: 0.9
    if:
      type: text
      word: nslookup

composite_rules:
  # A build script that derives a DNS label from its collected profile and
  # invokes a resolver against an OOB suffix has a complete source-to-sink
  # chain. The HTTP POST is intentionally not required: this covers fallback
  # channels and DNS-only future variants.
  - id: rust-build-oob-dns-profile-exfil
    desc: Rust build hook sends host profile through an OOB DNS label
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/supply-chain/recon-exfil/install-hook::rust-build-host-user-command-recon
      - id: objectives/exfiltration/oob/endpoint::interact-sh-me-fun
      - id: rust-nslookup-command-reference
      - id: micro-behaviors/process/create/shell/runner::rust-shell-command-runner
