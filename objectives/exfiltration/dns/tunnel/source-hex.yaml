# Encoded bytes are only called DNS exfiltration here when the same source file
# reads a credential artifact, hex-encodes bytes, constructs a dotted label,
# and submits that label to a resolver. None of those capabilities alone is an
# objective.
defaults:
  platforms: [linux, macos, windows]
  for: [zig]
  attack: T1048.003

traits:
  - id: zig-credential-dns-source-text
    desc: Zig resolver source reads credential files
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)getAddressList.{0,500}(\.aws/credentials|\.netrc)'
  - id: zig-hex-dns-source-text
    desc: Zig source hex-encodes resolver labels
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)hex_chars.{0,500}bufPrint.{0,180}\{s\}\.\{s\}'

composite_rules:
  - id: zig-text-credential-dns-exfil
    for: [zig, tar, gz, zip]
    desc: Zig package hex-encodes credentials into DNS labels
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/exfiltration/dns/tunnel::zig-credential-dns-source-text
      - id: objectives/exfiltration/dns/tunnel::zig-hex-dns-source-text
    any:
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
    needs: 1

  - id: source-hex-credential-dns-exfil
    desc: Hex-encoded credentials leave through DNS labels
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/dns/lookup/resolver::zig-get-address-list
      - id: micro-behaviors/communications/dns/label::zig-dotted-pair-format
      - id: micro-behaviors/data/encode/hex::manual-lowercase-byte-hex-encoder
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
