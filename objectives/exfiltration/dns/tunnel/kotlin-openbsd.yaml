defaults:
  platforms: [openbsd, bsd, unix]
  for: [kotlin, class]
  attack: T1048.003

traits:
  - id: kotlin-hex-data-exfil
    desc: Kotlin hex encodes exfil data
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: val hexData = toHex

  - id: kotlin-exfil-subdomain
    desc: Kotlin uses exfil subdomain
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "$chunk.exfil."

  - id: kotlin-dns-checkin-loop
    desc: Kotlin DNS checkin loop
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: dnsCheckin("$chunk.exfil.

composite_rules:
  - id: kotlin-dns-hex-exfil-channel
    desc: Kotlin DNS hex exfil channel
    crit: hostile
    conf: 0.98
    all:
      - id: kotlin-hex-data-exfil
      - id: kotlin-dns-checkin-loop
    any:
      - id: kotlin-exfil-subdomain
      - id: objectives/exfiltration/stealer/configuration::netscaler-dns-exfil-label
  - id: kotlin-dns-covert-channel-exfil
    desc: Kotlin exfiltrates data via DNS casing covert channel
    crit: hostile
    conf: 0.98
    platforms: [unix, windows]
    for: [kotlin]
    all:
      - id: micro-behaviors/data/string/case::source-case-transform
      - id: micro-behaviors/data/arithmetic::source-low-bit-mask
    any:
      - id: micro-behaviors/communications/dns/cli::nslookup-command-name
      - id: micro-behaviors/communications/dns/lookup::nslookup-command-literal
      - id: micro-behaviors/communications/dns/cli::nslookup
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
