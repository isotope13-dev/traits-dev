# A package that reads both common developer credential stores, converts byte
# content to hex, and performs DNS resolution in the same file has the complete
# source-and-channel shape of credential exfiltration. Each constituent fact
# is neutral; this objective deliberately ignores any inert environment gate.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, class, java_class]
  attack: T1048.003,T1552.001
  mbc: B0030,E1552

composite_rules:
  - id: hex-developer-credential-dns-exfil
    desc: Hex-encoded developer credentials leave through DNS queries
    crit: hostile
    conf: 0.99
    for: [scripts, source]
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: micro-behaviors/data/encode/hex::byte-to-hex-encoding-operation
      - id: micro-behaviors/communications/dns/lookup/query::source-resolver-query

  # Value-backed JVM constant-pool matches have no byte offset comparable to
  # bytecode symbol offsets, so a source-style proximity window would reject a
  # valid class even when all five facts come from that class.
  - id: jvm-hex-developer-credential-dns-exfil
    desc: JVM bytecode hex-encodes developer credentials for DNS queries
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    scope: file
    all:
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/data/encode/hex::jvm-hex-byte-format-class
      - id: micro-behaviors/communications/dns/lookup/query::source-resolver-query
