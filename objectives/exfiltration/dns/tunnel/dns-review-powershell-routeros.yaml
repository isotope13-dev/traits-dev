defaults:
  platforms: [routeros, appliance, windows]
  for: [powershell]
  attack: T1071.004

composite_rules:
  - id: ps-routeros-dns-c2-exfil
    desc: PowerShell DNS label exfiltration clues
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/tunnel/dns::dns-txt-query-flag
      - id: metadata/lang/source/naming/variable::ps-dns-c2-query-domain
      - id: micro-behaviors/communications/dns/label::ps-dns-exfil-chunk-label
      - id: micro-behaviors/data/encode/base64/primitive::ps-dns-label-base64-clean
      - id: metadata/lang/source/syntax/pattern-match::ps-dns-label-chunk-size
    any:
      - id: micro-behaviors/network/dns::resolve-dns-name
      - id: micro-behaviors/network/dns::dns-txt-query-fn
