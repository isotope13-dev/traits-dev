# Cross-language source rules for DNS TXT tasking.  These rules model the
# behavior described in the KATA article rather than any one tunnel domain:
# encoded data in changing left-most labels under a stable suffix, followed by
# command data returned in TXT records.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go]
  attack: T1071.004
  mbc: C0011

composite_rules:
  - id: python-dns-command-output-exfil
    desc: Python executes DNS TXT tasking and returns output through DNS labels
    crit: hostile
    conf: 0.99
    attack: T1059,T1071.004
    for: [python]
    all:
      - id: objectives/command-and-control/backdoor/tasking/dns::python-dns-txt-subprocess
      - id: objectives/exfiltration/dns/encoded::python-dns-a-record-output-exfil
    near_bytes: 8192

  # DNS tunnel framing makes the operator's receiver able to reassemble a
  # sequence of bounded payload labels. This combination is distinct from a
  # DNS lookup used to send one identity value or an ordinary hostname.
  - id: node-framed-chunked-dns-payload
    desc: Node sends framed payload chunks through DNS A queries
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: "T1071.004,T1048.003"
    mbc: "E1041"
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/dns/resolver::dns-resolve4
      - id: "micro-behaviors/data/encoding/base32::base32-lowercase-alphabet-literal"
      - id: objectives/exfiltration/dns/encoded::js-segmented-dns-label-payload
      - id: micro-behaviors/communications/dns/label::node-framed-dns-label-queries
