defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, pe, elf]
  mbc: C0001
  attack: T1071.004
traits:
  - id: dnscat-secret
    desc: dnscat2 secret environment variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: DNSCAT_SECRET
  - id: dnscat-name
    desc: dnscat2 tool name reference
    crit: suspicious
    conf: 0.7
    if:
      # Bounded on the right so the name is not matched inside a longer word.
      # As a bare substring this hit `DnsCates` and `Dnscater` in the
      # prefix-compressed surname dictionary Element bundles for password
      # strength checking -- the trie encodes a shared-prefix length per
      # entry, so `...Dns` + `Cates` reads as `dnscat` across the boundary.
      # `[^A-Za-z]` rather than `\b`: `dnscat_client` and `dnscat.exe` are
      # real spellings, and `_` is a word character.
      type: text
      regex: '(?i)\bdnscat2?([^A-Za-z]|$)'
  - id: dnscat-packet
    desc: dnscat2 packet debug message
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: MSG packet
    unless:
      - id: metadata/package/tooling::libbcc-library
  - id: iodine-name
    desc: Iodine DNS tunnel tool reference
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)\biodine\b.{0,40}\b(dns|tunnel)\b'
composite_rules:
  - id: dnscat
    desc: dnscat2 DNS tunneling tool
    crit: suspicious
    conf: 0.95
    any:
      - id: dnscat-secret
      - id: dnscat-name
      - id: well-known/dual-use/tunnel/dnscat2::dnscat-msg-packet
      - id: dnscat-packet
  - id: iodine
    desc: iodine DNS tunneling tool
    crit: suspicious
    conf: 0.95
    any:
      - id: metadata/file/literal::dns-tunnel-phrase
    all:
      - id: iodine-name
      - id: micro-behaviors/os/network/tunnel::dev-net-tun
  - id: generic-comp
    desc: DNS TXT query with tunneling vocabulary
    for: [python, shell]
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/communications/dns/txt::dns-txt-tool-query
    any:
      - id: metadata/file/literal::dns-c2
      - id: micro-behaviors/communications/dns/txt::dns-txt-tool-query
      - id: metadata/file/literal::dns-beacon
