defaults:
  platforms: [qnx]
  for: [elf]
  attack: T1048.003

traits:
  - id: qnx-zig-dns-lookup-marker
    desc: Zig DNS lookup marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Io.Threaded.lookupDns

  - id: qnx-zig-dns-query-marker
    desc: Zig DNS query writer marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: writeResolutionQuery

  - id: qnx-zig-txt-value-marker
    desc: Zig DNS TXT value marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: value_txt

composite_rules:
  - id: qnx-zig-elf-dns-lookup-symbols
    desc: QNX Zig ELF DNS lookup symbol
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: qnx-zig-dns-lookup-marker
    unless:
      - id: metadata/binary/linking/runtime::dynamic-loader-needed
      - id: metadata/binary/linking/runtime::glibc-needed

  - id: qnx-zig-elf-dns-query-writer
    desc: QNX Zig ELF DNS query writer
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: qnx-zig-dns-query-marker
    unless:
      - id: metadata/binary/linking/runtime::dynamic-loader-needed
      - id: metadata/binary/linking/runtime::glibc-needed

  - id: qnx-zig-elf-txt-value-symbol
    desc: QNX Zig ELF TXT value symbol
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: qnx-zig-txt-value-marker
    unless:
      - id: metadata/binary/linking/runtime::dynamic-loader-needed
      - id: metadata/binary/linking/runtime::glibc-needed

  - id: qnx-zig-elf-dns-payload-channel
    desc: QNX Zig ELF DNS payload channel
    crit: hostile
    conf: 0.96
    all:
      - id: qnx-zig-elf-dns-lookup-symbols
      - id: qnx-zig-elf-dns-query-writer
      - id: qnx-zig-elf-txt-value-symbol
