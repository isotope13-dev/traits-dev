defaults:
  platforms: [unix, netbsd]
  for: [shell]
  attack: T1048.003

traits:
  - id: shell-base64-fold-dns-labels
    desc: Shell base64 DNS labels
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'base64 "\$STAGING/payload\.tgz"[\s\S]{0,120}fold -w 30'

  - id: shell-host-txt-exfil-query
    desc: Shell host TXT exfil query
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/detection/lynis::lynis-project-script
    if:
      type: text
      substr: host -t txt

  - id: shell-base64-nslookup-labels
    desc: Shell base64 nslookup labels
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'base64 \S+[\s\S]{0,80}fold -w 30'

  - id: shell-nslookup-variable-label
    desc: Shell nslookup variable label
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'nslookup "\$\{?chunk\}?\.'

composite_rules:
  - id: shell-dns-txt-staging-exfil
    desc: Shell DNS TXT staging exfil
    crit: hostile
    conf: 0.98
    all:
      - id: shell-base64-fold-dns-labels
      - id: shell-host-txt-exfil-query

  - id: shell-nslookup-data-exfil
    desc: Shell nslookup data exfil
    crit: hostile
    conf: 0.98
    all:
      - id: shell-base64-nslookup-labels
      - id: shell-nslookup-variable-label

  # The dig/base64 form of the same technique, without the fixed `fold -w 30`
  # window the older rules key on. Local data piped through base64 in one place
  # and emitted as spliced DNS labels in another is exfiltration over DNS
  # regardless of the chunker or resolver binary used.
  - id: shell-base64-dns-label-exfil
    desc: Shell base64 data exfiltrated over DNS labels
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/encode/base64::base64-encode-command
      - id: micro-behaviors/communications/dns/cli::dns-cli-spliced-variable-label
