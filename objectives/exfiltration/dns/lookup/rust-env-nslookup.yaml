defaults:
  platforms: [unix, windows]
  for: [rust]
composite_rules:
  # An environment value becomes the first label of a name resolved through a
  # spawned resolver CLI whose output is discarded: the lookup carries the
  # value to whoever runs the zone, and nothing in the program uses a result.
  - id: rust-env-value-dns-label-lookup
    desc: Rust sends an environment value as a DNS label
    crit: hostile
    conf: 0.95
    attack: T1048.003
    scope: file
    near_bytes: 2500
    all:
      - id: micro-behaviors/os/env/read::std-env-var
      - id: micro-behaviors/communications/dns/cli::rust-dns-cli-command-new
      - id: micro-behaviors/communications/dns/cli::rust-dns-query-value-dot-host-format
      - id: micro-behaviors/process/fd/stdio::rust-child-stdout-null
