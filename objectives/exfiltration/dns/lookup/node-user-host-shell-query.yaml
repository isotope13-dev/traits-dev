defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1033,T1082,T1048.003

traits:
  - id: node-user-host-shell-dns
    desc: Shell DNS query embeds user and hostname
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator name: (identifier) @user
              value: (member_expression
                object: (call_expression function: (member_expression object: (identifier) @os1 property: (property_identifier) @userinfo))
                property: (property_identifier) @username)))
          (lexical_declaration
            (variable_declarator name: (identifier) @host
              value: (call_expression function: (member_expression object: (identifier) @os2 property: (property_identifier) @hostname))))
          (lexical_declaration
            (variable_declarator name: (identifier) @target
              value: (template_string
                (template_substitution (identifier) @user_use)
                (template_substitution (identifier) @host_use)) @target_text))
          (lexical_declaration
            (variable_declarator name: (identifier) @cmd
              value: (ternary_expression
                consequence: (template_string (template_substitution (identifier) @target_use)) @query)))
          (expression_statement
            (call_expression function: (identifier) @exec arguments: (arguments (identifier) @cmd_use))))
          (#eq? @os1 @os2)
          (#eq? @userinfo "userInfo")
          (#eq? @username "username")
          (#eq? @hostname "hostname")
          (#eq? @user @user_use)
          (#eq? @host @host_use)
          (#eq? @target @target_use)
          (#eq? @cmd @cmd_use)
          (#eq? @exec "exec")
          (#match? @query "nslookup")
          (#match? @target_text "\\.oast\\.live"))

composite_rules:
  - id: npm-user-host-oast-shell-dns
    desc: Install hook sends user and host in callback DNS
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-user-host-shell-dns
      - id: metadata/import/builtin::child-process-api-destructure
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
