defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
composite_rules:
  - id: exec-host-var-oast-dns-exfil
    desc: Shell exec, DNS variable and OAST clues
    crit: suspicious
    conf: 0.98
    attack: T1048.003
    mbc: E1041
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/communications/dns/cli::host-var-subdomain
    any:
      - id: objectives/exfiltration/oob
      - id: micro-behaviors/communications/url/host/oob/execution::node-child-process-webhook-site-reference

