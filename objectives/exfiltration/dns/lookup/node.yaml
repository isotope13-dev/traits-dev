defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1048.003,T1082

traits:
  - id: node-hostname-oob-dns-label-query
    desc: Hostname sent in OOB DNS query
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (statement_block
          [(lexical_declaration
             (variable_declarator
               name: (identifier) @host
               value: (call_expression
                 function: (member_expression
                   object: (call_expression
                     function: (identifier) @os_require
                     arguments: (arguments (string (string_fragment) @os_module)))
                   property: (property_identifier) @hostname)
                 arguments: (arguments))))
           (variable_declaration
             (variable_declarator
               name: (identifier) @host
               value: (call_expression
                 function: (member_expression
                   object: (call_expression
                     function: (identifier) @os_require
                     arguments: (arguments (string (string_fragment) @os_module)))
                   property: (property_identifier) @hostname)
                 arguments: (arguments))))]
          (expression_statement
            (call_expression
              function: (member_expression
                object: (call_expression
                  function: (identifier) @dns_require
                  arguments: (arguments (string (string_fragment) @dns_module)))
                property: (property_identifier) @resolver)
              arguments: (arguments
                (binary_expression
                  left: (identifier) @host_use
                  right: (string (string_fragment) @suffix))
                _)))
          (#eq? @os_require "require")
          (#eq? @os_module "os")
          (#eq? @hostname "hostname")
          (#eq? @host @host_use)
          (#eq? @dns_require "require")
          (#eq? @dns_module "dns")
          (#match? @resolver "^(resolve([46])?|lookup)$")
          (#match? @suffix "\\.(oob|oast|oastify|interactsh|dnslog|ceye)\\."))

composite_rules:
  - id: node-silent-delayed-hostname-oob-dns-exfil
    desc: Delayed silent hostname OOB DNS exfiltration
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: node-hostname-oob-dns-label-query
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-short-delay
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
