defaults:
  attack: T1048.003
  platforms:
  - windows
  - unix
  - android
  - ios
  for:
  - python
traits:
- id: ray-driver-ip-helper-marker
  desc: Ray driver IP helper marker
  crit: baseline
  conf: 0.95
  platforms:
  - unix
  if:
    type: text
    substr: '[ray] getting driver IP'
composite_rules:
- id: python-credential-hex-dns-exfil
  desc: Python package hex-encodes credentials into DNS
  crit: hostile
  conf: 0.99
  scope: leaf
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo
  - id: micro-behaviors/communications/dns/label::python-dns-query-reference
  - id: micro-behaviors/data/encode/hex::python-bytes-hex-call
  - id: micro-behaviors/data/arithmetic::source-low-bit-mask
  any:
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  needs: 1
- id: raw-socket-dns-exfil
  desc: Raw socket DNS exfiltration with system info
  crit: hostile
  conf: 0.95
  mbc: B0030
  all:
  - id: micro-behaviors/communications/dns/raw::python-dns-construction
  - id: micro-behaviors/communications/socket/connect::connect-python
  any:
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/os/sysinfo/platform/host::platform-uname
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
- id: cicd-dns-exfil
  desc: CI/CD environment exfiltrated via DNS
  crit: hostile
  conf: 0.95
  any:
  - id: micro-behaviors/os/env/cicd::ci-environment-reference-context
  - id: micro-behaviors/os/env/cicd::runner-name
  all:
  - id: micro-behaviors/communications/dns/raw::python-dns-construction
- id: python-identity-label-dns-beacon
  desc: Host identity leaves as DNS query labels
  crit: hostile
  conf: 0.95
  mbc: B0030
  near_lines: 30
  all:
  - id: micro-behaviors/communications/dns/label::python-dynamic-dns-label
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo
  any:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname::python-os-uname-nodename
  - id: micro-behaviors/process/user/query::python-getpass-user
  - id: micro-behaviors/process/user/query::os-getlogin-python
  - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/tool/detection/security-scanner/
- id: js-identity-label-dns-beacon
  desc: Host identity leaves as DNS query labels
  crit: hostile
  conf: 0.95
  mbc: B0030
  for:
  - javascript
  - typescript
  near_lines: 60
  all:
  - id: micro-behaviors/communications/dns/label::uuid-label-hostname
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
  unless:
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
- id: js-host-identity-dns-beacon
  desc: Host identity leaves as DNS query labels
  crit: hostile
  conf: 0.94
  mbc: B0030
  for:
  - javascript
  - typescript
  near_lines: 60
  all:
  - id: micro-behaviors/communications/dns/resolver::node-dns-joined-host-identity-argument
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-dynamic-name
