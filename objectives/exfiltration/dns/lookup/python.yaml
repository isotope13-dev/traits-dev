# DNS-based Data Exfiltration - Python
# GuardDog-inspired: Combines DNS lookup capability with sensitive data access
# ATT&CK: T1048.003 (Exfiltration Over Alternative Protocol - DNS)
defaults:
  attack: T1048.003
  platforms: [windows, unix, android, ios]
  for: [python]
traits:
  - id: ray-driver-ip-helper-marker
    desc: Ray driver IP helper marker
    crit: baseline
    conf: 0.95
    platforms: [unix]
    if:
      type: text
      substr: "[ray] getting driver IP"
composite_rules:
  # GuardDog: DNS exfiltration pattern. A hostname lookup is a neutral
  # networking capability; only the complete combination below is hostile.
  - id: dns-exfiltration
    desc: DNS-based data exfiltration pattern
    crit: hostile
    conf: 0.95
    mbc: "B0030"
    scope: leaf
    near_lines: 30
    all:
      - id: micro-behaviors/communications/dns/lookup/resolver::hostname-specific-lookup
      # A resolver call plus a sensitive path is not enough to establish DNS
      # exfiltration: service discovery and API clients do exactly that.  DNS
      # exfil requires evidence that data is being placed into the DNS channel.
      - id: dns-exfil-data-channel
    any:
      # Sensitive data sources
      - id: micro-behaviors/os/env/vars/credentials/
      - id: micro-behaviors/fs/path/sensitive/credentials/
      - id: micro-behaviors/fs/path/sensitive/browser/
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/harness/runtime::ci-lan-ip-helper-context
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/conda-package/
  # Raw socket DNS exfiltration (bypasses standard DNS libraries)
  - id: raw-socket-dns-exfil
    desc: Raw socket DNS exfiltration with system info
    crit: hostile
    conf: 0.95
    mbc: "B0030"
    all:
      - id: micro-behaviors/communications/dns/raw::python-dns-construction
      - id: micro-behaviors/communications/socket/connect::connect-python
    any:
      - id: objectives/discovery/system/fingerprint/hardware::python-sysinfo-multi
      - id: objectives/discovery/system/fingerprint/hardware::python-platform-uname
      - id: objectives/discovery/system/fingerprint/hardware::gethostname-call

  # Data must be encoded into, or manually assembled as, a DNS name.  Keep
  # this as a named component so the hostile rule above cannot be satisfied by
  # a plain lookup of a hostname or service endpoint.
  - id: dns-exfil-data-channel
    desc: Data encoded into a DNS query channel
    crit: component
    conf: 0.9
    any:
      - id: objectives/exfiltration/dns/ast::dns-label-manual-construction
      - id: objectives/exfiltration/dns/ast::subdomain-exfil-pattern
      - id: objectives/exfiltration/dns/prep::subdomain-data-encoding
  # TCP DNS exfiltration via subdomain encoding
  - id: tcp-dns-subdomain-exfil
    desc: TCP DNS exfiltration via subdomain encoding
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/dns/connect::tcp-dns-connect
      - id: objectives/exfiltration/dns/prep::subdomain-data-encoding
  # CI/CD targeted DNS exfiltration
  - id: cicd-dns-exfil
    desc: CI/CD environment exfiltrated via DNS
    crit: hostile
    conf: 0.95
    any:
      - id: objectives/discovery/system/fingerprint/cicd::runner-fingerprinting
      - id: micro-behaviors/os/env/vars/cicd::runner-name
    all:
      - id: micro-behaviors/communications/dns/raw::python-dns-construction

  # Host identity leaves as DNS query labels. The encoded spellings are
  # covered by exfiltration/dns/encoded; this is the cleartext one -- sanitized
  # `socket.gethostname()`/`$USER` fragments joined onto an operator domain
  # and resolved. Building a DNS label out of the machine's own name is a
  # channel choice, not a service lookup: the resolution IS the message.
  #
  # Worked example: vision_service_python_client's install hook, which
  # resolves `<host>.<user>.vspc.<attacker domain>` via getaddrinfo from both
  # the install and develop classes.
  - id: python-identity-label-dns-beacon
    desc: Host identity leaves as DNS query labels
    crit: hostile
    conf: 0.95
    mbc: B0030
    near_lines: 30
    all:
      - id: micro-behaviors/communications/dns/label::python-dynamic-dns-label
      - id: micro-behaviors/communications/dns/lookup/resolver::getaddrinfo
    any:
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/os/env/vars/access::python-os-getenv-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
