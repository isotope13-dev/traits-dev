defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1041,T1048.003
  mbc: E1041

traits:
  - id: npm-script-base64-host-profile-fields
    desc: npm hook base64 encodes host identity fields
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '$(whoami):$(hostname):$(pwd):$npm_package_name'
  - id: npm-script-callback-http-profile-path
    desc: npm hook posts profile to callback host
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'curl -sm5 https://$pkgsub.callback.'
  - id: npm-script-callback-dns-package-label
    desc: npm hook resolves package at callback host
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'nslookup $pkgdns.$pkgsub.callback.'

composite_rules:
  - id: npm-install-base64-host-profile-http-dns-exfil
    desc: npm hook sends host profile over HTTP and DNS
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1041,T1048.003,T1082,T1033
    all:
      - id: npm-script-base64-host-profile-fields
      - id: npm-script-callback-http-profile-path
      - id: npm-script-callback-dns-package-label
