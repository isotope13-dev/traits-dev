defaults:
  for:
  - javascript
  platforms:
  - unix
  - windows
  attack: T1082,T1048.003
traits:
- id: node-profile-oast-dns-queries
  desc: Sends host and user through DNS
  crit: hostile
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((program
        (import_statement (import_clause (identifier) @os) source: (string (string_fragment) @os_module))
        (lexical_declaration (variable_declarator name: (identifier) @domain
          value: (string (string_fragment) @domain_text)))
        (function_declaration name: (identifier) @collect body: (statement_block (try_statement body: (statement_block
          (lexical_declaration (variable_declarator name: (identifier) @hostname_var value: (call_expression
            function: (member_expression object: (identifier) @os_host property: (property_identifier) @hostname_call))))
          (lexical_declaration (variable_declarator name: (identifier) @username_var value: (member_expression
            object: (call_expression function: (member_expression object: (identifier) @os_user property: (property_identifier) @user_info))
            property: (property_identifier) @username_prop)))
          (return_statement (object (shorthand_property_identifier) @host_return (shorthand_property_identifier) @user_return))))))
        (function_declaration name: (identifier) @send parameters: (formal_parameters (identifier) @data)
          body: (statement_block (try_statement body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @queries value: (array
              (template_string (string_fragment) @host_prefix
                (template_substitution (call_expression function: (identifier) @sanitize
                  arguments: (arguments (member_expression object: (identifier) @host_data property: (property_identifier) @hostname))))
                (string_fragment) @host_dot (template_substitution (identifier) @host_domain))
              (template_string (string_fragment) @user_prefix
                (template_substitution (call_expression function: (identifier) @sanitize_user
                  arguments: (arguments (member_expression object: (identifier) @user_data property: (property_identifier) @username))))
                (string_fragment) @user_dot (template_substitution (identifier) @user_domain)))))
            (expression_statement (call_expression function: (member_expression object: (identifier) @queries_use property: (property_identifier) @foreach)
              arguments: (arguments (arrow_function parameter: (identifier) @query body: (statement_block
                (expression_statement (call_expression function: (member_expression object: (identifier) @dns property: (property_identifier) @lookup)
                  arguments: (arguments (identifier) @query_use))))))))))))
        (function_declaration body: (statement_block (try_statement body: (statement_block
          (lexical_declaration (variable_declarator name: (identifier) @result value: (call_expression function: (identifier) @collect_use)))
          (expression_statement (call_expression function: (identifier) @send_use arguments: (arguments (identifier) @result_use))))))))
        (#eq? @os_module "os")
        (#eq? @os @os_host)
        (#eq? @os @os_user)
        (#eq? @hostname_call "hostname")
        (#eq? @user_info "userInfo")
        (#eq? @username_prop "username")
        (#eq? @hostname_var @host_return)
        (#eq? @username_var @user_return)
        (#eq? @collect @collect_use)
        (#eq? @send @send_use)
        (#eq? @result @result_use)
        (#match? @domain_text "(^|[.])(oastify[.]com|oast[.](live|site|fun|online|pro|me))$")
        (#eq? @data @host_data)
        (#eq? @data @user_data)
        (#eq? @hostname "hostname")
        (#eq? @username "username")
        (#eq? @sanitize @sanitize_user)
        (#eq? @host_prefix "hostname-")
        (#eq? @user_prefix "username-")
        (#eq? @host_dot ".")
        (#eq? @user_dot ".")
        (#eq? @domain @host_domain)
        (#eq? @domain @user_domain)
        (#eq? @queries @queries_use)
        (#eq? @foreach "forEach")
        (#eq? @dns "dns")
        (#eq? @lookup "lookup")
        (#eq? @query @query_use))
composite_rules:
- id: npm-install-profile-oast-dns-queries
  desc: Install hook sends host and user
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - zip
  - npm
  - javascript
  - package.json
  all:
  - id: node-profile-oast-dns-queries
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
