defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- attack: T1048.003
  id: dns-secret-env-exfil
  desc: Secret env value exfiltrated via DNS
  crit: hostile
  conf: 0.995
  mbc: E1041
  size_max: 2048
  all:
  - id: metadata/import/builtin::require-dns
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
  - id: micro-behaviors/communications/url/host/oob/endpoint::collab-digi-ninja
  - id: objectives/credential-access/env/secrets/custom::env-my-secret-api-key
  any:
  - id: micro-behaviors/communications/dns/lookup::got-here-dns-beacon
  - id: micro-behaviors/time/query::unix-timestamp-expression
  - id: micro-behaviors/process/exit/terminate::exit-when-secret-missing
  - id: micro-behaviors/communications/dns/resolver::ipv4-address-selection
  needs: 2
  
