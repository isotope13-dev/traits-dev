# The shell command assigns the account name, then looks up a variable-labeled
# callback domain. The matcher describes both operations in the same command;
# it does not infer that arbitrary shell variable names are equal.
defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1033,T1048.003

traits:
  - id: exec-whoami-variable-host-command
    desc: Shell assigns whoami and queries a subdomain
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @exec
          arguments: (arguments (string (string_fragment) @command)))
          (#eq? @exec "exec")
          (#match? @command "[A-Za-z_][A-Za-z0-9_]*=\\$\\(whoami\\)\\s*&&\\s*host\\s+\\$[A-Za-z_][A-Za-z0-9_]*\\.")
          (#match? @command "\\.requestrepo\\.com"))

composite_rules:
  - id: exec-whoami-variable-callback-dns
    desc: Account discovery and callback DNS in one shell command
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: exec-whoami-variable-host-command
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/communications/url/host/oob/endpoint::requestrepo
