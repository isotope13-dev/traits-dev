defaults:
  platforms: [windows, unix]
  for: [package.json]
  mbc: E1041
composite_rules:
  - id: node-oastify-dns-profile-exfil
    desc: Node sends hostname in Oastify DNS query beside user collection
    crit: hostile
    conf: 0.99
    attack: "T1048.003,T1082,T1033"
    for: [javascript]
    all:
      - id: micro-behaviors/communications/dns/oob::node-oastify-dns-callback
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  - id: shell-oastify-dns-identity-exfil
    desc: Shell exfiltrates host identity through Oastify DNS
    crit: hostile
    conf: 0.99
    attack: "T1048.003,T1082,T1033"
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/dns/lookup::nslookup-command-literal
      - id: micro-behaviors/process/identity/query/command::js-shell-whoami-substitution
      - id: micro-behaviors/os/sysinfo/hostname/command::js-shell-hostname-substitution
  - id: npm-preinstall-oast-dns-hostname
    desc: npm preinstall sends hostname through OAST DNS callback
    crit: hostile
    conf: 0.995
    attack: "T1195.002, T1048.003, T1082"
    for: [npm, package.json, javascript]
    scope: archive
    all:
    - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
    - id: micro-behaviors/communications/dns/oob::node-oastify-dns-callback
    - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: npm-postinstall-node-oastify-dns-profile-exfil
    desc: npm postinstall sends hostname through Oastify DNS
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1071.004"
    scope: archive
    for: [javascript, package.json, npm]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/dns/oob::node-oastify-dns-callback
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  - id: npm-postinstall-oastify-dns-whoami-exfil
    desc: npm postinstall exfils whoami through Oastify DNS
    crit: hostile
    conf: 0.995
    attack: "T1048.003"
    for: [javascript]
    all:
      - id: metadata/package/files/included::postinstall-js-basename
      - id: objectives/exfiltration/dns/encoded::js-oastify-template-subdomain-exfil
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
    any:
      - id: micro-behaviors/os/sysinfo/profile::node-host-profile-payload-fields
      - id: micro-behaviors/os/env/read/named::ci-env-reference-set
  - id: node-hex-label-oastify-dns-exfil
    desc: Hex-truncated labels exfiltrated via Oastify DNS
    crit: hostile
    conf: 0.98
    attack: "T1048.003,T1071.004"
    for: [javascript]
    all:
      - id: micro-behaviors/data/encode/hex::js-hex-truncation-reference
      - id: micro-behaviors/communications/dns/oob::node-oastify-dns-callback
      - id: micro-behaviors/communications/dns/resolver::dns-resolve-call
  - id: node-hex-label-oastify-dns-http-exfil
    desc: Hex-truncated labels sent over Oastify DNS and HTTP
    crit: hostile
    conf: 0.99
    attack: "T1048.003,T1071.001,T1071.004"
    for: [javascript]
    all:
      - id: micro-behaviors/data/encode/hex::js-hex-truncation-reference
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/dns/resolver::dns-resolve-call
      - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: node-execsync-identity-oastify-hex-exfil
    desc: execSync identity probes hex-exfiltrated to Oastify
    crit: hostile
    conf: 0.995
    attack: "T1033,T1082,T1048.003"
    for: [javascript]
    all:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/data/encode/hex::js-hex-truncation-reference
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
      - id: micro-behaviors/os/sysinfo/hostname/query::execsync-quoted-hostname
