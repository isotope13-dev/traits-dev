defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1048.003,T1195.002

traits:
  - id: env-json-in-dns-hostname
    desc: Inserts serialized environment into URL host
    crit: notable
    if:
      type: text
      substr: JSON.stringify(envs)

  - id: env-json-url-hostname
    desc: Uses serialized environment in URL hostname
    crit: notable
    if:
      type: text
      substr: 'https://${limitedString}'

  - id: url-hostname-dns-lookup
    desc: Resolves hostname from constructed URL
    crit: notable
    if:
      type: text
      substr: dns.lookup(hostname)

composite_rules:
  - id: npm-postinstall-env-json-dns-exfil
    desc: npm install hook leaks environment data through DNS
    crit: hostile
    conf: 0.99
    for: [npm, javascript, package.json]
    scope: package
    all:
      - id: env-json-in-dns-hostname
      - id: env-json-url-hostname
      - id: url-hostname-dns-lookup
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
