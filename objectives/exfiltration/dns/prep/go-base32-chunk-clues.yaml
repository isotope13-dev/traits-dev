defaults:
  platforms: [windows, unix]
  for: [go]

composite_rules:
  - id: go-dns-base32-chunk-clues
    desc: Go DNS, Base32 and chunking clues
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/encode/base32::go-base32-encode-call
      - id: micro-behaviors/communications/dns/struct::go-dns-wire-message
      - id: micro-behaviors/data/collection/group::go-chunks-63-call
