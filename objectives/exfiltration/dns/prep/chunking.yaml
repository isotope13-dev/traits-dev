# DNS Exfil Preparations - Chunking
defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript, typescript]
traits:
  - id: dns-regex-chunking
    desc: Regex string chunking for DNS limits
    if:
      type: text
      regex: '\.match\(/.{1,10}\{\s*\d+\s*,\s*6[0-4]\s*\}.{0,5}/g\)\s*\.join\(\s*["'']\.["'']\s*\)'
  # A payload cut into pieces no wider than the 63-byte DNS label limit is the
  # defining preparation step of DNS tunnelling: the width is chosen by the
  # protocol, not by the data. `dns-regex-chunking` above only fires when the
  # pieces are immediately `.join('.')`-ed into one name; implants that iterate
  # the chunk array instead — one query per chunk, index-prefixed so the
  # listener can reassemble — never build that single dotted string.
  - id: dns-label-width-chunking
    desc: Splits data into DNS-label-width chunks
    conf: 0.9
    attack: "T1048.003"
    if:
      type: text
      regex: '\.match\(/\.\{1,\s?([1-9]|[1-5]\d|6[0-3])\}/g\)'
