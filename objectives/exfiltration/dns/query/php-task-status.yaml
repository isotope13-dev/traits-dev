defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: encoded-dns-task-report
    desc: Encodes status in DNS report name
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: "bin2hex\\s*\\(\\s*\\$[A-Za-z_][A-Za-z_0-9]*\\s*\\).{0,80}['\"]\\.report['\"]"
  - id: dns-task-query
    desc: Queries DNS for task responses
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'dns_get_record\s*\([^\r\n]{0,100}DNS_(TXT|A)'
  - id: wallet-and-exfil-task-names
    desc: Tasks target wallets and data exfiltration
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?s)scan_for_wallets.{0,120}prepare_exfil'

composite_rules:
  - id: php-dns-task-report-exfiltration
    desc: DNS tasking reports encoded status
    crit: hostile
    conf: 0.98
    attack: T1071.004,T1048.003
    all:
      - id: encoded-dns-task-report
      - id: dns-task-query
      - id: wallet-and-exfil-task-names
