defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
composite_rules:
  - id: "lua-sequenced-data-dns-queries"
    desc: "Lua hex-encodes bytes and sends sequenced chunk labels in DNS TXT queries"
    crit: "hostile"
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/concat/expression::lua-sequence-dot-concatenation
      - id: "micro-behaviors/communications/dns/query::lua-shell-txt-query-command"
      - id: "micro-behaviors/data/encode/hex::lua-byte-hex-format"
