defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1048,T1082

traits:
  - id: platform-oast-domain-template
    desc: Platform value in OAST DNS name
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '\$\{queryData\}\.[a-z0-9-]+\.oast\.fun'

  - id: platform-query-assignment
    desc: Script derives platform query value
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: '(?s)os\.platform\s*\(\s*\).{0,200}queryData\s*='

  - id: resolve-domain
    desc: Script resolves constructed domain
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'dns\.resolve\s*\(\s*domain\s*,'

composite_rules:
  - id: platform-oast-dns-callback
    desc: Script resolves OAST domain containing host platform
    crit: suspicious
    conf: 0.99
    for: [javascript]
    scope: file
    all:
      - id: platform-oast-domain-template
      - id: platform-query-assignment
      - id: resolve-domain

  - id: npm-import-platform-oast-dns
    desc: npm entrypoint sends host platform to OAST via DNS
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, package.json]
    scope: archive
    all:
      - id: platform-oast-dns-callback
      - id: metadata/package/entrypoint/module::main-root-javascript-entry
