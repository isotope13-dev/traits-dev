defaults:
  platforms: [panos, appliance, unix]
  for: [python]
  attack: T1041

traits:
  - id: python-panos-collection-tar
    desc: Python PAN-OS collection tar
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # Bare collection.tar.gz is a common Ansible Galaxy archive name.
      # Require adjacent PAN-OS / exfil staging context.
      regex: '(?is)(panos|EXFIL).{0,240}collection\.tar\.gz|collection\.tar\.gz.{0,240}(panos|EXFIL)'
    unless:
      - id: well-known/app/infrastructure/ansible::ansible-source-archive-context
      - id: well-known/app/infrastructure/ansible::ansible-module-utils-path
      - id: well-known/app/infrastructure/ansible::ansible-lib-tree-path
      - id: well-known/app/infrastructure/ansible::ansible-test-tree-path

