defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041
composite_rules:
  - id: python-header-archive-post
    for: [python]
    desc: Python base64 POST with archive filename header
    crit: hostile
    conf: 0.98
    unless:
      - id: micro-behaviors/communications/http/authorization-header::github-cli-download-auth-token-fragment
      - id: micro-behaviors/data/encode/base64/primitive::cicd-release-script-b64encode-marker
      - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
      # Documentation / fixture hosts (.invalid, .example, .test) are not live
      # exfil destinations — examples that POST placeholder bytes there must
      # not convict as hostile upload.
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
    all:
      - id: micro-behaviors/communications/http/header/custom::python-payload-header-map
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
    any:
      - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
      - id: micro-behaviors/data/compress::gzip-compress-call
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
      - id: metadata/file/extension/identity::archive-extension-reference
    near_bytes: 512
