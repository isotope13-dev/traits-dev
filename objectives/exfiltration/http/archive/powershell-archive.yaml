defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [powershell]
  attack: T1041

composite_rules:
  - id: ps-zip-body-upload
    desc: PowerShell ZIP body upload
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/header/content-type::zip-content-type
      - id: micro-behaviors/fs/read/file/target::ps-read-zip-variable
      - id: "micro-behaviors/communications/http/post::powershell-post-method"
      - id: micro-behaviors/communications/http/request/payload::powershell-http-body-value
  - id: powershell-base64-archive-http-exfil
    desc: PowerShell base64 archive HTTP exfil
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/archive/create/zip::powershell-base64-archive-body
      - id: micro-behaviors/communications/http/client/library::irm-name
      - id: metadata/lang/source/syntax/argument::powershell-post-method-option
