defaults:
  platforms: [macos]
  for: [macho]
composite_rules:
  - id: detached-zip-raw-http-terminal-close
    desc: Detached ZIP and raw HTTP with Terminal closure
    crit: hostile
    conf: 0.96
    attack: T1041,T1074.001,T1564.003
    all:
      - id: micro-behaviors/ui/window/terminal::osascript-close-first-window-text
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
      - id: micro-behaviors/fs/path/temporary-artifact::tmp-zip-path
      - id: micro-behaviors/fs/read/file/descriptor::read
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/http/header/content-length::large-content-length-header
      - id: micro-behaviors/communications/ip/direct::external-ipv4-http-host-endpoint
      - id: micro-behaviors/communications/socket/connect/attempt::connect-import
      - id: micro-behaviors/communications/socket/send/reference::send-symbol
