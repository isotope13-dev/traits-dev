# Shell-based Network Exfiltration
# Behavioral composites that combine shell tools with exfiltration indicators
# ATT&CK: T1041 (Exfiltration Over C2 Channel)
#
# Note: Atomic curl/wget/nc traits moved to communications/http/client/shell.yaml
# This file contains only behavioral composites that indicate exfiltration
defaults:
  platforms: [unix, android, ios, windows]
  mbc: "E1041"
  attack: "T1041"
  for: [shell, batch, powershell, vbs]

composite_rules:
  - id: npm-cli-native-directory-archive-exfil
    desc: npm CLI ships native directory exfiltration command
    crit: hostile
    conf: 0.98
    for: [npm, package.json, elf]
    scope: archive
    attack: T1195.002,T1041
    all:
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: elf-directory-archive-curl-upload

  - id: elf-directory-archive-curl-upload
    desc: Binary stages a directory archive for HTTP exfiltration
    crit: hostile
    conf: 0.98
    for: [elf]
    platforms: [linux]
    scope: file
    all:
      - id: micro-behaviors/data/archive/create/tar::binary-tar-stages-directory
      - id: micro-behaviors/communications/http/upload/file::curl-form-file-attachment
    near_bytes: 500

  - id: shell-staged-tar-http-upload
    desc: Shell staged tar HTTP upload
    crit: hostile
    conf: 0.98
    platforms: [unix]
    for: [shell]
    all:
      - id: micro-behaviors/data/archive/create/tar::shell-tar-create-file
      - id: micro-behaviors/communications/http/upload/file::curl-form-file-attachment
    any:
      - id: micro-behaviors/fs/path/temp::unix-temp
      - id: micro-behaviors/fs/path/hidden::hidden-dir-literal

  # macOS stealer shape: a FileGrabber-style loot tree under /tmp is zipped with
  # ditto and the archive is POSTed raw to a remote endpoint. Each leg alone is
  # ordinary; the staged-loot layout beside a ditto zip and a curl body upload
  # of a /tmp zip is the collection-to-exfiltration chain.
  - id: shell-staged-loot-ditto-zip-curl-upload
    desc: Shell zips staged loot with ditto and POSTs it
    crit: hostile
    conf: 0.97
    attack: T1560.001,T1041
    platforms: [macos]
    for: [shell]
    near_lines: 30
    all:
      - id: objectives/collection/archive/stage::tmp-infostealer-layout
      - id: micro-behaviors/data/archive/create/utility::macos-ditto-compress-flags
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
      - id: micro-behaviors/fs/path/temporary-artifact::tmp-zip-path

  - id: shell-chunked-archive-http-upload
    desc: Shell splits staged archive into chunks for HTTP upload
    crit: hostile
    conf: 0.98
    attack: T1041,T1030
    platforms: [unix]
    for: [shell]
    near_lines: 20
    all:
      - id: objectives/exfiltration/http/upload/chunked::split-temp-archive-chunks
      - id: micro-behaviors/fs/path/temp::temporary-directory-candidate-loop
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
