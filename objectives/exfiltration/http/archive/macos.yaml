defaults:
  platforms: [macos]
  for: [shell, applescript]
  attack: T1041

composite_rules:
  - id: macos-tmp-archive-curl-upload
    desc: Uploads a macOS temporary archive with curl
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/collection/archive/create::tmp-archive
    any:
      - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
      - id: micro-behaviors/communications/http/upload::encoded-curl-form-file-attachment
      - id: micro-behaviors/communications/http/curl::curl-data-binary-file
