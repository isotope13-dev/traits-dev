defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
composite_rules:
  - id: "lua-system-config-archive-upload"
    desc: "Lua archives system configuration and sends a multipart archive upload"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "micro-behaviors/data/archive/create/tar::lua-system-config-archive-command"
      - id: "micro-behaviors/data/archive/create/tar::lua-system-config-command-input"
      - id: "micro-behaviors/communications/http/upload/cli::lua-shell-archive-form-upload"
      - id: objectives/impact/ransom/encrypt/bulk-encryption::lua-ransom-file-rewrite
