defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041
  mbc: E1011

composite_rules:
  - id: python-remote-archive-stream-client
    desc: Python remote archive stream client
    crit: hostile
    conf: 0.97
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    all:
      - id: micro-behaviors/communications/url/resource-path/file::rest-archive-file-endpoints
      - id: micro-behaviors/fs/file/read-write::python-remote-archive-functions
      - id: micro-behaviors/communications/http/client/response-body::response-stream-python
      - id: micro-behaviors/communications/http/lib/requests::requests-session

  - id: telegram-archive-uploader
    desc: Telegram archive uploader alternative
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/upload/file::python-http-files-parameter
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/communications/http/header/content-disposition::multipart-form-upload-marker
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any

  - id: telegram-archive-builder
    desc: Telegram archive builder alternative
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive

  - id: python-telegram-tdata-archive-upload
    desc: Python uploads an archive of Telegram tdata
    crit: hostile
    conf: 0.99
    attack: T1005,T1539,T1560.001,T1041
    scope: file
    all:
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: telegram-archive-builder
      - id: telegram-archive-uploader
    near_bytes: 8192
