    desc: Python remote archive stream client
    crit: hostile
    conf: 0.97
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    all:
      - id: micro-behaviors/communications/http/url/endpoint::rest-archive-file-endpoints
      - id: micro-behaviors/fs/file/read-write::python-remote-archive-functions
      - id: micro-behaviors/communications/http/request/client::response-stream-python
      - id: micro-behaviors/communications/http/lib/requests::requests-session

  - id: python-telegram-tdata-archive-upload
    desc: Python uploads an archive of Telegram tdata
    crit: hostile
    conf: 0.99
    attack: T1005,T1539,T1560.001,T1041
    for: [python, whl, zip, archives]
    scope: file
    all:
      - id: objectives/collection/messaging/app::telegram-tdata-desktop-win
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
      - id: micro-behaviors/communications/http/upload::python-http-files-parameter
    near_bytes: 8192
