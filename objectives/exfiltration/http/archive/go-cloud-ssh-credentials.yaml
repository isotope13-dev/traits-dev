defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-credential-zip-http-post
    desc: Posts archived cloud and SSH credentials
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule go_credential_zip_http_post {
          strings:
            $buffer = "buf := new(bytes.Buffer)"
            $zip = "z := zip.NewWriter(buf)"
            $cloud = ".config/gcloud/credentials.db"
            $ssh = ".ssh/id_rsa"
            $copy = "io.Copy(w, r)"
            $close = "z.Close()"
            $post = "http.Post("
            $body = "\"image/jpeg\", buf)"
          condition:
            all of them and @buffer < @zip and @copy < @close and @close < @post
        }
