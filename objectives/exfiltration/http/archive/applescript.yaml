defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1041

composite_rules:
  # Replaces the supply-chain verdict based only on Safe Storage and Cookies.
  # Require archive creation, a multipart file directive and POST, plus both
  # credential targets and staging. Runtime paths need not be constants.
  - id: staged-browser-wallet-upload
    desc: Staged browser and wallet archive upload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/archive/create/utility::macos-ditto-compress-flags
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/upload::multipart-file-prefix
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: objectives/collection/stealer/staging::applescript-browser-wallet-collection
      - id: objectives/collection/stealer/staging::tmp-infostealer-layout
