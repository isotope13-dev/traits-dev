defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041

composite_rules:
  - id: python-targz-requests-post
    for: [python]
    desc: "Creates tar.gz archive with HTTP POST"
    crit: hostile
    conf: 0.98
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/testing/
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    any:
      - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
      - id: micro-behaviors/data/archive/create/tar::python-gzip-tar-archive
