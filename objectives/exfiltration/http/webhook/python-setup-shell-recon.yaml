defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-webhook-shell-inventory-post
    desc: Posts shell inventory commands to webhook
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call function: (identifier) @run
          arguments: (argument_list (string) @cmd))
          (#eq? @run "system")
          (#match? @cmd "curl[[:space:]]+https?://[^[:space:]]*webhook")
          (#match? @cmd "-d[[:space:]\\\\]*[\"']?\\$\\(")
          (#not-match? @cmd "curl[[:space:]]+https?://(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @cmd "https?://172[.](1[6-9]|2[0-9]|3[01])[.]")
          (#not-match? @cmd "https?://(169[.]254[.]|\\[::1\\])")
          (#match? @cmd "netstat[[:space:]]")
          (#match? @cmd "ps[[:space:]]+ax"))

composite_rules:
  - id: python-setup-webhook-shell-recon-post
    desc: Setup script posts shell network and process inventory to webhook
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041
    scope: file
    all:
      - id: python-webhook-shell-inventory-post
      - id: metadata/package/files/included::setup-py-basename
