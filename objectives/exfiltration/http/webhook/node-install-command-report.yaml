defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, zip, npm, tar]
  attack: T1195.002,T1041,T1082

traits:
  - id: npm-index-postinstall
    desc: Runs index on package installation
    crit: notable
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*node\s+(\./)?index\.js\s*$'
  - id: js-command-report-webhook
    desc: Defines webhook site endpoint
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'webhook\s*=\s*[''"]https://webhook\.site/[a-f0-9-]{36}[''"]'
  - id: js-command-report-curl
    desc: Sends report using curl POST
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'exec\(`curl\s+-X\s+POST.{0,200}\$\{webhook\}`\)'
  - id: js-command-report-stdout
    desc: Serializes shell command output
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: '(?s)exec\(cmd,.{0,150}stdout.{0,800}JSON\.stringify'
  - id: js-npm-access-inventory
    desc: Inventories scoped npm access
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'npm access (list packages|ls-packages)\s+@'
  - id: js-command-report-working-dir
    desc: Collects current working directory
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'process.cwd()'
  - id: js-network-profile-commands
    desc: Collects interfaces and network neighbors
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: '(?s)ipconfig /all.{0,80}ifconfig.{0,80}arp -a.{0,80}netstat -n'
  - id: js-append-dependency-readme
    desc: Appends to dependency README
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: '>> node_modules/${'
  - id: js-publish-dependency
    desc: Publishes installed dependency
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'npm publish node_modules/${'

composite_rules:
  - id: npm-command-profile-webhook
    desc: Sends install-time command inventory to webhook
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: npm-index-postinstall
      - id: js-command-report-webhook
      - id: js-command-report-curl
      - id: js-command-report-stdout
    any:
      - id: js-npm-access-inventory
      - id: js-network-profile-commands
  - id: npm-install-dependency-republish
    desc: Edits and republishes dependencies on install
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: npm-index-postinstall
      - id: js-command-report-webhook
      - id: js-command-report-curl
      - id: js-append-dependency-readme
      - id: js-publish-dependency
  - id: js-npm-access-webhook-report
    desc: Sends scoped npm access inventory to webhook
    crit: hostile
    conf: 0.99
    scope: file
    for: [javascript]
    all:
      - id: js-command-report-webhook
      - id: js-command-report-curl
      - id: js-command-report-stdout
      - id: js-npm-access-inventory
      - id: js-command-report-working-dir
