defaults:
  platforms:
  - unix
  - windows
  attack: T1567.004
  for:
  - python
composite_rules:
- id: python-discord-webhook-silent-post
  desc: Python posts to a Discord webhook and swallows errors
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/communications/http/webhook::discord-webhook-path
  - id: micro-behaviors/communications/http/webhook::python-webhook-post
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
