defaults:
  platforms: [unix]
  for: [package.json]
  attack: T1195.002,T1041,T1083

traits:
  - id: npm-recon-webhook
    desc: Sends install output to webhook
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      substr: 'webhook.site'
  - id: npm-recon-send-stdout
    desc: Sends captured command output
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '(?s)exec\(.{0,1000}stdout.{0,500}req\.write\(data\)'
  - id: npm-recon-search-data-paths
    desc: Searches system for data files
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      substr: 'find / -name'
  - id: npm-recon-neighbors-and-processes
    desc: Collects network and process inventory
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '(?s)arp -a.{0,200}/etc/resolv\.conf.{0,200}ps aux'

composite_rules:
  - id: npm-install-webhook-recon-output
    desc: Sends install-time system reconnaissance to webhook
    crit: hostile
    conf: 0.99
    all:
      - id: npm-recon-webhook
      - id: npm-recon-send-stdout
    any:
      - id: npm-recon-search-data-paths
      - id: npm-recon-neighbors-and-processes
