defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, package.json, npm]

composite_rules:
  - id: node-command-output-query-exfil
    desc: Compact Node command output HTTP exfiltration
    conf: 0.99
    attack: T1041,T1059.004
    for: [javascript, typescript]
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/fd/stdio::js-shell-output-uri-encoding
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/client::node-http

  - id: node-command-output-uri-http-exfil
    desc: Node execSync URI-encodes shell output over HTTP
    conf: 0.99
    attack: T1041,T1059.004
    for: [javascript, typescript]
    scope: file
    near_bytes: 1024
    unless:
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
    all:
      - id: micro-behaviors/process/fd/stdio::js-shell-output-uri-encoding
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::node-http
    needs: 1

  - id: js-host-profile-query-exfil
    desc: JavaScript profiles host and exfiltrates via HTTP
    conf: 0.995
    attack: T1041,T1016,T1082
    for: [javascript]
    all:
      - id: metadata/import/builtin::child-process-api-destructure
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::js-host-profile-command-sequence
      - id: objectives/supply-chain/recon-exfil/install-hook/recon::js-http-query-exfil

  - id: node-import-time-execsync-uri-fetch-exfil
    desc: Import-time execSync output in fetch URL
    conf: 0.995
    attack: T1041,T1059.007,T1195.002
    mbc: E1041
    for: [javascript, typescript]
    scope: file
    near_bytes: 4096
    unless:
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
    all:
      - id: micro-behaviors/communications/http/request/client::module-execution-http-call
      - id: micro-behaviors/process/fd/stdio::js-shell-output-uri-encoding
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script

  # Independent behavioral evidence for package impersonation consumers.
  # Do not depend on the suppressed generic rules above: that would make
  # recognizing a Wix facade erase the malicious behavior used to convict it.
  - id: node-module-load-command-output-http-exfil
    desc: Module initialization runs shell commands and URI-encodes output for HTTP
    conf: 0.995
    attack: T1041,T1059.007,T1195.002
    mbc: E1041
    for: [javascript, typescript]
    scope: file
    near_bytes: 4096
    unless:
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
    all:
      - id: micro-behaviors/communications/http/request/client::module-execution-http-call
      - id: micro-behaviors/process/fd/stdio::js-shell-output-uri-encoding
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::node-http
    needs: 1

  - id: node-obfuscated-dynamic-execsync-fetch-exfil
    desc: Obfuscated Node dynamic execSync fetch-exfils output
    conf: 0.995
    attack: T1041,T1059.007,T1027,T1195.002
    mbc: E1041
    for: [javascript, typescript]
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/query::cmd-out-query-encoded-output-text
      - id: micro-behaviors/process/create/shell/bridge::node-decoded-bracket-sync-shell-output
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/data/decode/custom::fromcharcode-map-array
      - id: micro-behaviors/data/decode/custom::fromcharcode-map-numeric-offset
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: micro-behaviors/data/control-flow/dispatch::computed-method-receiver-bind
      - id: micro-behaviors/process/create/shell/bridge::node-atob-base64-decoded-command-blobs
    needs: 1
