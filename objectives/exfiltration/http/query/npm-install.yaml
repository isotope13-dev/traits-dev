defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, archives]

composite_rules:
  - id: node-command-output-query-exfil
    desc: Compact Node command output HTTP exfiltration
    crit: hostile
    conf: 0.99
    attack: T1041,T1059.004
    for: [javascript, typescript]
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/client::node-http

  - id: js-host-profile-query-exfil
    desc: JavaScript profiles host and exfiltrates via HTTP
    crit: hostile
    conf: 0.995
    attack: T1041,T1016,T1082
    for: [javascript]
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
      - id: objectives/supply-chain/recon-exfil/install-hook::js-host-profile-command-sequence
      - id: objectives/supply-chain/recon-exfil/install-hook::js-http-query-exfil
