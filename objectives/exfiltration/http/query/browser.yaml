defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1041
  size_max: 524288
traits:
  - id: cookie-query-key
    desc: Cookie-like query key
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\?[A-Za-z0-9_-]*(cookie|session|sid)[A-Za-z0-9_-]*='
  - id: encodeURIComponent-query-concat
    desc: Encodes cookie or session data into query
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(cookie|session|sid)[\w-]{0,32}=.{0,40}encodeURIComponent\('
  - id: cookie-session-argument
    desc: Cookie/session encode argument
    crit: component
    conf: 0.86
    if:
      type: text
      regex: 'encodeURIComponent\([^)]{0,160}(document\.cookie|cookies?)'
  - id: session-id-argument
    desc: Session identifier encode argument
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'encodeURIComponent\([^)]{0,160}\b(session|sid)\b'
  # Query keys named stolen/captured/exfil are not ordinary analytics fields.
  # A sanitizer's own unit tests spell the attack out: `?exfil=` against
  # evil.example is the input the assertion expects to be stripped, not an
  # outbound URL the file builds.
  - id: theft-named-query-assignment
    desc: Theft-named URL query key
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '[?&](stolen|captured|exfil)='
    unless:
      - id: metadata/package/testing/harness/unit::node-test-runner-import
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
  - id: theft-named-query-get
    desc: Reads stolen or captured query parameter
    crit: suspicious
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\.get\s*\(\s*[''"](stolen|captured|exfil)[''"]'
    unless:
      - id: metadata/package/testing/harness/unit::node-test-runner-import
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
composite_rules:
  # A query sink is only exfiltration evidence when the same file also
  # handles a credential, cookie, or intentionally captured secret. Ordinary
  # analytics commonly sends encoded timing and event labels through ?data=.
  - id: browser-query-sensitive-source
    desc: Browser credential or secret prepared for query
    crit: component
    conf: 0.9
    any:
      - id: encoded-cookie-query-param
      - id: micro-behaviors/data/db/web-storage::browser-storage-credential-key
      - id: objectives/credential-access/wallet/mnemonic::web-mnemonic-entry-form
      - id: objectives/credential-access/wallet/mnemonic::web-seedword-entry-form
      - id: objectives/credential-access/phishing/credential::js-webmail-login-form
      - id: objectives/exfiltration/sensitive-data::js-private-key-request-field
      - id: objectives/exfiltration/sensitive-data::js-seed-phrase-request-field
      - id: objectives/exfiltration/sensitive-data::js-wallet-secret-data-field
  - id: encoded-cookie-query-param
    desc: Encoded cookie query parameter
    crit: notable
    conf: 0.88
    all:
      - id: cookie-query-key
      - id: encodeURIComponent-query-concat
    any:
      - id: cookie-session-argument
      - id: session-id-argument
    near_bytes: 240
  - id: browser-query-data-exfil
    desc: Sensitive browser data in encoded query request
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/url/query::encoded-query-parameter
      - id: browser-query-sensitive-source
    any:
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
    unless:
      - id: well-known/app/data/containarium::containarium-security-demo-context
  - id: browser-cookie-query-exfil
    desc: Browser cookie query exfiltration
    crit: hostile
    conf: 0.96
    attack: T1539
    mbc: E1005
    all:
      - id: encoded-cookie-query-param
      - id: micro-behaviors/communications/http/cookies::document-cookie-read
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: objectives/exfiltration/oob/endpoint::webhook-site

  # Dynamic <script src="https://…?param=" + btoa(secret)> beacons steal data
  # through a GET that looks like a CDN or library load (ORB/CORS bypass).
  - id: script-src-btoa-query-exfil
    desc: Script src query exfils Base64 payload
    crit: hostile
    conf: 0.96
    mbc: B0030
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/communications/http/client/resource::element-src-query-parameter
      - id: micro-behaviors/data/encode/base64::btoa-symbol
    any:
      - id: micro-behaviors/communications/http/url/query::btoa-query-parameter
      - id: micro-behaviors/communications/http/url/query::btoa-json-stringify-call
    unless:
      - id: metadata/library/structure::google-tag-manager-bundle

  - id: theft-named-query-atob-decode
    desc: Decodes a theft-named query parameter
    crit: hostile
    conf: 0.95
    near_bytes: 400
    all:
      - id: theft-named-query-get
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/ui/window/dom-access::current-script-src-read
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
