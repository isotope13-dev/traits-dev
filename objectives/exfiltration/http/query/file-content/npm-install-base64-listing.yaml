defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1041,T1083,T1195.002
traits:
- id: npm-preinstall-base64-listing-curl
  desc: Encodes directory listing into curl request
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.preinstall
    regex: \bls\s+[^|]{1,120}\|\s*base64\s*\|\s*xargs\s+[^|]{1,100}\bcurl\s+https?://
- id: npm-preinstall-curl-base64-listing
  desc: Posts encoded directory listing during install
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.preinstall
    regex: \bcurl\b[^\n]{0,300}\s--data\s+\$\(\s*ls\b[^|]{0,100}\|\s*base64\s*\)
- id: npm-preinstall-curl-base64-file
  desc: Sends encoded local file in install request
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.preinstall
    regex: \bcurl\s+https?://[^\s]{1,300}\$\(\s*cat\s+/opt/[^\s|]{1,160}\s*\|\s*base64\s*\)
