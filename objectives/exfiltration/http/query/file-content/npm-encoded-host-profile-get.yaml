defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1033,T1082,T1041,T1195.002
traits:
- id: npm-preinstall-encoded-profile-url
  desc: Builds request URL from encoded string
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: url\s*=\s*Buffer\.from\([^\n]{1,140}base64[^\n]{0,40}\.toString
- id: npm-preinstall-profile-identity
  desc: Adds user and path to URL
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: process\.env\.USER[^\n]{0,100}process\.cwd\(\)
- id: npm-preinstall-profile-host
  desc: Adds hostname to request
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: require\(["']os["']\)\.hostname\(\)
- id: npm-preinstall-profile-get
  desc: Sends constructed URL over HTTPS
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: https\.get\(\s*url\s*,
composite_rules:
- id: npm-encoded-host-profile-get
  desc: Sends host profile to encoded endpoint
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-encoded-profile-url
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-profile-identity
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-profile-host
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-profile-get
