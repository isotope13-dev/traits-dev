defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1041,T1003.008
traits:
- id: js-urlencode-passwd-content
  desc: Encodes passwd content as query data
  crit: notable
  if:
    type: text
    regex: extraData\s*=\s*["']&passwd=["']\s*\+\s*encodeURIComponent\(passwdContent\)
- id: js-host-profile-url-query
  desc: Builds host profile URL query
  crit: notable
  if:
    type: text
    regex: 'https?://[\w.-]{3,80}/[\w/.-]{0,40}\?user=\$\{\w{1,30}\}&host=\$\{\w{1,30}\}'
- id: js-extra-data-query-suffix
  desc: Appends collected data to request
  crit: notable
  if:
    type: text
    substr: ${platform}${extraData}
composite_rules:
- id: node-passwd-profile-oast-callback
  desc: Sends host profile and passwd in a URL query
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::js-read-etc-passwd-utf8
  - id: objectives/exfiltration/http/query/file-content::js-urlencode-passwd-content
  - id: objectives/exfiltration/http/query/file-content::js-host-profile-url-query
  - id: objectives/exfiltration/http/query/file-content::js-extra-data-query-suffix
  - id: micro-behaviors/process/create/exec::js-exec-cmd-argument
