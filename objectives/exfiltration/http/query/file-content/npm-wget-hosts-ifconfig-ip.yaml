defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1195.002,T1041,T1016
traits:
- id: npm-preinstall-wget-hosts-output
  desc: Adds hosts file to wget POST data
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: --post-data=["']hosts=\$\(cat\s+/etc/hosts\)
composite_rules:
- id: npm-wget-hosts-ifconfig-ip-post
  desc: Posts hosts file and interfaces to IP
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-wget-hosts-output
  - id: objectives/exfiltration/http/query/command-output::npm-preinstall-wget-ifconfig-output
  - id: objectives/exfiltration/http/query/application-data::npm-preinstall-wget-ip-endpoint
