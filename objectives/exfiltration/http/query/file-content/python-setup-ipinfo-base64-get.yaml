defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002,T1041,T1590.005
  mbc: E1041
composite_rules:
- id: python-setup-ipinfo-base64-query-exfil
  desc: Setup metadata evaluation sends encoded IP lookup response to a remote URL
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/ip-discovery::ipinfo-io
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/url/construction/query::interpolated-identifier-query-value
  - id: micro-behaviors/communications/http/request/url::requests-get-url-literal
