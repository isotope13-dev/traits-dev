defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1033
  mbc: E1041
composite_rules:
- id: oob-username-query-get-exfil
  desc: Username read beside a computed-path HTTP GET and an OOB host
  crit: hostile
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-username-read
  - id: micro-behaviors/communications/http/request/url-computed::node-request-options-computed-path
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
