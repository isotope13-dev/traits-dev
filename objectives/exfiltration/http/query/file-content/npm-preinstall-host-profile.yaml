defaults:
  platforms:
  - windows
  - linux
  for:
  - npm
  - tar
  crit: hostile
traits:
- id: npm-preinstall-oast-flag-query
  desc: Preinstall sends fetched flags in OAST query
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?is)/log\?[^;]{0,500}&f1=
- id: npm-preinstall-private-ip-flag-fetch-10
  desc: Fetches 10-range flag file
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?i)https?://10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/flag\.txt
- id: npm-preinstall-private-ip-flag-fetch-192
  desc: Fetches 192-range flag file
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?i)https?://192\.168\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/flag\.txt
- id: npm-preinstall-private-ip-flag-fetch-172
  desc: Fetches 172-range flag file
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?i)https?://172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}/flag\.txt
composite_rules:
- id: npm-install-host-user-profile-query-exfil
  desc: npm install hook sends encoded host profile
  conf: 0.995
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041
  scope: archive
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  near_bytes: 2000
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/get::javascript-get-method-text
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
- id: npm-preinstall-private-ip-flags-oast-exfil
  desc: Preinstall exports private-IP flag files to OAST
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1016,T1005,T1082,T1033
  for:
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/network::preinstall-oast-domain
  - id: metadata/package/scripts/discovery::preinstall-hostname
  - id: metadata/package/scripts/discovery::preinstall-username
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-oast-flag-query
  any:
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-private-ip-flag-fetch-10
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-private-ip-flag-fetch-192
  - id: objectives/exfiltration/http/query/file-content::npm-preinstall-private-ip-flag-fetch-172
- id: npm-preinstall-host-profile-query-exfil
  desc: npm hook profiles host and exfiltrates via HTTP
  conf: 0.995
  attack: T1041,T1016,T1082
  scope: archive
  for:
  - npm
  - tar
  - package.json
  - javascript
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/os/sysinfo/report::js-host-profile-command-sequence
  - id: objectives/exfiltration/http/query/application-data::js-http-query-exfil
- id: npm-preinstall-host-profile-raw-ip-query-exfil
  desc: npm preinstall sends shell-collected host identity to a raw-IP HTTP endpoint
  conf: 0.995
  attack: T1195.002,T1041,T1016,T1082,T1033
  scope: archive
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: metadata/import/builtin::child-process-api-destructure
  - id: micro-behaviors/os/sysinfo/report::js-host-profile-command-sequence
  - id: micro-behaviors/communications/ip/endpoint::node-raw-ip-http-endpoint
