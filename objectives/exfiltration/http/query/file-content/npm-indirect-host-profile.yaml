defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1033,T1082,T1041,T1195.002
traits:
- id: npm-script-oast-system-profile
  desc: Script sends host profile to OAST
  crit: notable
  if:
    type: value
    path: scripts.payload
    regex: (?i)hostname\)[^\n]{0,80}whoami\)[^\n]{0,80}pwd\)[^\n]{0,100}\.oast\.fun
composite_rules:
- id: npm-indirect-host-profile-oast
  desc: Install invokes host profile callback script
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/exfiltration/http/query/application-data::npm-indirect-preinstall-script
  - id: objectives/exfiltration/http/query/file-content::npm-script-oast-system-profile
