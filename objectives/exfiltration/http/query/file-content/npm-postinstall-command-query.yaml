defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1005,T1041,T1195.002
traits:
- id: npm-postinstall-home-listing-query
  desc: Sends home listing in install request
  crit: hostile
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\bcurl\s+-G\s+--data-urlencode\s+.{0,60}\$\(\s*ls\s+~\s*\).{0,160}https?://
  not:
  - regex: (?i)https?://(localhost|127\.0\.0\.1)([:/]|$)
- id: npm-postinstall-flag-file-query
  desc: Sends flag file in install request
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.postinstall
    regex: \bcurl\s+-G\s+--data-urlencode\s+.{0,60}\$\(cat\s+/[^\s)]*flag[^\s)]*\).{0,160}https?://
  not:
  - regex: (?i)https?://(localhost|127\.0\.0\.1)([:/]|$)
