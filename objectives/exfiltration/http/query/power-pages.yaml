# Public Power Pages / Dataverse extraction pattern described by VenariX and
# linked from the PNLD article. The article does not establish a PNLD-specific
# endpoint; these rules target the reusable access and extraction technique.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, json]
  attack: T1041,T1213

composite_rules:
  - id: power-pages-anonymous-table-read
    desc: Power Pages anonymous table read permission
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/server/authz::power-pages-anonymous-users-role
      - id: micro-behaviors/communications/http/server/authz::power-pages-read-table-permission

  - id: power-pages-legacy-odata-bulk-read
    desc: Power Pages legacy OData paginated record read
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/dataverse::power-pages-legacy-odata-route
      - id: micro-behaviors/communications/http/dataverse::dataverse-odata-annotation
      - id: micro-behaviors/communications/http/dataverse::dataverse-odata-pagination-link

  # The complete combination is an attack pattern: a portal API is used to
  # walk Dataverse pages and the resulting records are sent to a remote sink.
  # The individual HTTP and JSON mechanics remain neutral capabilities.
  - id: power-pages-dataverse-bulk-exfiltration
    desc: Power Pages Dataverse paginated record exfiltration
    crit: hostile
    conf: 0.99
    near_bytes: 700
    all:
      - id: micro-behaviors/communications/http/dataverse::power-pages-web-api-entity-route
      - id: micro-behaviors/communications/http/dataverse::dataverse-odata-pagination-link
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/endpoints::fetch-http-scheme-url

  # A source/config artifact that carries the access path itself is also a
  # strong signal when it binds anonymous read permissions to the Web API.
  - id: power-pages-anonymous-dataverse-api-exposure
    desc: Power Pages anonymous Dataverse API exposure
    crit: hostile
    conf: 0.99
    near_bytes: 700
    all:
      - id: power-pages-anonymous-table-read
      - id: micro-behaviors/communications/http/dataverse::power-pages-web-api-entity-route
      - id: micro-behaviors/communications/http/dataverse::power-pages-web-api-site-setting
      - id: micro-behaviors/communications/http/dataverse::dataverse-odata-pagination-link
