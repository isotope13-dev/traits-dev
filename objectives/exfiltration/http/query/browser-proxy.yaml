# SectopRAT's browser proxy uses one request to relay visited URLs and another
# to submit captured form fields. The endpoint shapes are kept in a capability
# file; these composites express the credential-exfiltration objective.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  attack: T1041,T1056.003
  mbc: B0030

composite_rules:
  - id: browser-form-password-exfiltration
    desc: Browser form password exfiltration endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/browser-proxy::browser-form-save-endpoint
    any:
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/communications/http/message::raw-http-control-request-line
    near_bytes: 256
