# Host and user identity exfiltrated in an HTTPS GET query string with a hex
# transport encoding. Unlike the OOB-gated query rules, this does not require
# the collector host to sit on the OOB endpoint list: the binding that earns
# the verdict is the full local chain -- named host/user environment reads,
# hex encoding of the assembled identity, and the GET call carrying it --
# all in one file. Ordinary telemetry reports to first-party hosts without
# hex-wrapping the machine owner, and test harnesses are excluded.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1033
  mbc: E1041

composite_rules:
  - id: node-env-hex-identity-query-exfil
    desc: Hex-encoded host and user identity in HTTPS GET query
    crit: hostile
    conf: 0.97
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
      - id: micro-behaviors/os/env/system-info::node-host-identity-env-reference
      - id: micro-behaviors/data/encode/hex::buffer-hex
      - id: micro-behaviors/communications/http/get::node-https-get-reference
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
