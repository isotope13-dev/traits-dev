defaults:
  platforms:
  - unix
  - windows
traits:
- id: npm-preinstall-node-eval
  desc: Preinstall launches inline Node code
  crit: notable
  conf: 0.98
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?i)\bnode\s+-e\b
- id: npm-preinstall-node-query-argument
  desc: Shell request builds URL query
  crit: notable
  conf: 0.98
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?is)\b(wget|curl)\b.{0,180}\?[A-Za-z0-9_-]+=["']?\s*\+
- id: js-http-query-exfil
  desc: Shell exec sends a variable with curl
  crit: suspicious
  conf: 0.97
  attack: T1041
  for:
  - javascript
  if:
    type: tree-sitter
    kind: call
    regex: '(?is)\A[^\n]{0,80}\bexec(Sync)?\s*\(.{0,400}curl.{0,200}\?\w+=\w*\$\w+'
