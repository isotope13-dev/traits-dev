defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1033,T1082,T1041,T1195.002
traits:
- id: npm-indirect-preinstall-script
  desc: Install hook invokes payload npm script
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: ^npm\s+run\s+payload\s*$
