defaults:
  platforms:
  - android
  for:
  - elf
  attack: T1041,T1430
  mbc: B0030
traits:
- id: sdk-callback-url
  desc: Callback-path HTTP URL in native binary
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: http://[A-Za-z0-9.-]+\.[A-Za-z]{2,24}/[A-Za-z0-9_./-]*callback/[A-Za-z0-9_.-]+
