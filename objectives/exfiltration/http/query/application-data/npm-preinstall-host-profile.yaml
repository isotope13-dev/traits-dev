defaults:
  platforms:
  - windows
  - linux
  for:
  - npm
  - tar
  crit: hostile
traits:
- id: npm-preinstall-https-request-get
  desc: Preinstall configures a Node HTTPS GET
  crit: notable
  conf: 0.96
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: require\(["']https["']\)\.request\s*\(\s*\{[^}]{0,300}method\s*:\s*["']GET["']
- id: npm-preinstall-node-http-get-alias
  desc: Preinstall calls Node HTTP GET alias
  crit: notable
  conf: 0.96
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: http\.get\s*\(
