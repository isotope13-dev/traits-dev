defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.98
  attack: T1041,T1082,T1033

composite_rules:
  - id: node-oob-object-profile-query-exfil
    desc: Host and user object query sent beside an OOB collector
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-object-query-request-path
      - id: micro-behaviors/communications/http/request/url-computed::node-request-options-object-query-path
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
