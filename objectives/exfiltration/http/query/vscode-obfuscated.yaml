defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: obfuscated-dynamic-url-query
  desc: Obfuscated dynamic URL query construction
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/control-flow/logic::js-tamper-checked-eval-unpacker
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
- id: obfuscated-dynamic-url-query-exfiltration
  desc: Obfuscated dynamic URL query exfiltration
  crit: hostile
  conf: 0.98
  attack: T1041
  mbc: E1041
  # Tamper-checked eval plus XOR and URLSearchParams is packing, not theft.
  # Require a host-network spawn the same way the VS Code host-profile beacon
  # does, so a research unpacker that only builds a query string is not hostile.
  all:
  - id: obfuscated-dynamic-url-query
  - id: objectives/anti-static/obfuscation/control-flow/logic::js-complex-obfuscation
  - id: micro-behaviors/data/encode/xor::js-charcode-xor-operation
  - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
