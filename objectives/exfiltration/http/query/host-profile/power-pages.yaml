defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - html
  - json
  attack: T1041,T1213
composite_rules:
- id: power-pages-dataverse-bulk-exfiltration
  for:
  - javascript
  desc: Power Pages Dataverse paginated record exfiltration
  crit: hostile
  conf: 0.99
  near_bytes: 700
  all:
  - id: micro-behaviors/communications/http/dataverse::power-pages-web-api-entity-route
  - id: micro-behaviors/communications/http/odata::odata-next-page-link
  - id: micro-behaviors/communications/http/request/json::fetch-json-response
  - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: micro-behaviors/communications/http/request/client/target::fetch-http-scheme-url
- id: power-pages-anonymous-dataverse-api-exposure
  desc: Power Pages anonymous Dataverse API exposure
  crit: hostile
  conf: 0.99
  near_bytes: 700
  all:
  - id: objectives/exfiltration/http/query/application-data::power-pages-anonymous-table-read
  - id: micro-behaviors/communications/http/dataverse::power-pages-web-api-entity-route
  - id: micro-behaviors/communications/http/dataverse::power-pages-web-api-site-setting
  - id: micro-behaviors/communications/http/odata::odata-next-page-link
