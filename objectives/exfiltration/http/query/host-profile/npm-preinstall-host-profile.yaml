defaults:
  platforms:
  - windows
  - linux
  for:
  - npm
  - tar
  crit: hostile
traits:
- id: npm-preinstall-oast-require-os-hostname-query
  desc: Preinstall queries hostname to OAST endpoint
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?is)\.oast\.[^?]{0,100}\?host=[^;]{0,160}require\(["']os["']\)\.hostname\s*\(
- id: npm-preinstall-oast-hostname-query
  desc: Preinstall puts hostname in OAST query
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: (?is)\.oast\.[^?]{0,100}\?host=[^;]{0,80}os\.hostname\s*\(
composite_rules:
- id: npm-preinstall-oast-hostname-get-exfil
  desc: Preinstall sends hostname to OAST over HTTP
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  for:
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/http/query/host-profile::npm-preinstall-oast-hostname-query
  - id: objectives/exfiltration/http/query/application-data::npm-preinstall-node-http-get-alias
- id: npm-preinstall-oast-hostname-https-request-exfil
  desc: Preinstall sends hostname to OAST with HTTPS
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  for:
  - package.json
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/http/query/host-profile::npm-preinstall-oast-require-os-hostname-query
  - id: objectives/exfiltration/http/query/application-data::npm-preinstall-https-request-get
