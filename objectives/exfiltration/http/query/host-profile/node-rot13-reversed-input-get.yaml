defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1027,T1041
traits:
- id: node-rot13-reversed-input-get
  desc: Sends input to concealed URL via GET
  crit: hostile
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((program
        (lexical_declaration
          (variable_declarator name: (identifier) @http
            value: (call_expression function: (identifier) @require
              arguments: (arguments (string (string_fragment) @module_name))))
          (variable_declarator name: (identifier) @chunks
            value: (call_expression function: (member_expression object: (array)
              property: (property_identifier) @chunk_join)))
          (variable_declarator name: (identifier) @base
            value: (call_expression function: (member_expression
              object: (call_expression function: (member_expression
                object: (call_expression function: (member_expression
                  object: (call_expression function: (member_expression
                    object: (identifier) @chunks_used property: (property_identifier) @replace)) @rotation
                  property: (property_identifier) @split))
                property: (property_identifier) @reverse))
              property: (property_identifier) @join))))
        (function_declaration name: (identifier) @function
          parameters: (formal_parameters (identifier) @input)
          body: (statement_block (try_statement
            body: (statement_block (expression_statement (await_expression
              (call_expression function: (member_expression object: (identifier) @http_used
                property: (property_identifier) @get)
                arguments: (arguments (binary_expression left: (identifier) @base_used
                  right: (identifier) @input_used))))))
            handler: (catch_clause body: (statement_block)))))
        (expression_statement (assignment_expression
          left: (member_expression object: (identifier) @module property: (property_identifier) @exports)
          right: (object (shorthand_property_identifier) @exported))))
        (#eq? @require "require")
        (#eq? @module_name "axios")
        (#eq? @chunk_join "join")
        (#eq? @chunks @chunks_used)
        (#eq? @replace "replace")
        (#eq? @split "split")
        (#eq? @reverse "reverse")
        (#eq? @join "join")
        (#match? @rotation "charCodeAt\\(0\\)\\s*\\+\\s*13")
        (#match? @rotation "-\\s*26")
        (#eq? @http @http_used)
        (#eq? @get "get")
        (#eq? @base @base_used)
        (#eq? @input @input_used)
        (#eq? @module "module")
        (#eq? @exports "exports")
        (#eq? @function @exported))
