defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  attack: T1041
  size_max: 524288
composite_rules:
- id: script-src-btoa-query-exfil
  for:
  - javascript
  desc: Script src query exfils Base64 payload
  crit: hostile
  conf: 0.96
  mbc: B0030
  near_bytes: 1200
  all:
  - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
  - id: micro-behaviors/communications/http/client/resource::element-src-query-parameter
  - id: micro-behaviors/data/encode/base64/primitive::btoa-symbol
  any:
  - id: micro-behaviors/communications/url/construction/query::btoa-query-parameter
  - id: micro-behaviors/data/encode/serialized-json::btoa-json-stringify-call
  unless:
  - id: metadata/build/bundler/asset::google-tag-manager-bundle
- id: theft-named-query-atob-decode
  for:
  - javascript
  desc: Decodes a theft-named query parameter
  crit: hostile
  conf: 0.95
  near_bytes: 400
  all:
  - id: objectives/exfiltration/http/query/application-data::theft-named-query-get
  - id: micro-behaviors/data/decode/base64/call::atob-decode
  - id: micro-behaviors/ui/window/dom-access::current-script-src-read
  - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
