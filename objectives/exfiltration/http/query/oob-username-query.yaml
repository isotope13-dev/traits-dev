# OS account identity carried out in an HTTP query string to an OOB
# collector. The host-profile census rule
# (objectives/exfiltration/oob/system-profile::node-manual-qs-host-profile-beacon)
# convicts the full hostname/user/platform/cwd profile; this convicts the
# narrower account-identity facet -- the os.userInfo().username read built
# into a concatenated request path and GET-sent to an OOB endpoint -- so a
# beacon that steals only the username still convicts. The OOB leg keeps
# ordinary telemetry (which reports to first-party hosts) out of scope.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1033
  mbc: E1041

composite_rules:
  - id: oob-username-query-get-exfil
    desc: Username read beside a computed-path HTTP GET and an OOB host
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/process/identity/query::os-userinfo-username-read
      - id: micro-behaviors/communications/http/request/url-computed::node-request-options-computed-path
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
