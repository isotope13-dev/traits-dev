defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1041
traits:
- id: test-script-exfil
  desc: Test hook sends host data in URL
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: "scripts.test"
    regex: '\b(curl|wget)\b[^;&|\r\n]*https?://[^"''\s]*\$\(\s*(hostname|whoami|pwd|env|printenv|id)\b'
  not:
  - regex: "'https?://[^']*\\$\\("
      # === Script Content Patterns ===
      # Detect dangerous commands in install scripts

- id: script-network-exfil-vars
  desc: Install hook sends host data in URL
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: "scripts.preinstall"
    # Platform/version selection in a download path is ordinary installation.
    # Require a transfer command whose URL embeds identity or environment data.
    regex: '\b(curl|wget)\b[^;&|\r\n]*https?://[^"''\s]*\$\(\s*(hostname|whoami|pwd|env|printenv|id)\b'
  not:
  - regex: "'https?://[^']*\\$\\("
