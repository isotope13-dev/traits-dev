# Android spyware that beacons device fingerprints to an SDK-styled callback
# endpoint. The URL carries a `/callback/` path while the query template
# formats subscriber and hardware identity (package, IMSI, brand, model)
# into one request. Analytics SDKs also use callback paths, but never with
# an IMSI/brand/model printf template, so both legs are required.
defaults:
  platforms: [android]
  for: [elf]
  attack: T1041,T1430
  mbc: B0030

traits:
  - id: sdk-callback-url
    desc: Callback-path HTTP URL in native binary
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'http://[A-Za-z0-9.-]+\.[A-Za-z]{2,24}/[A-Za-z0-9_./-]*callback/[A-Za-z0-9_.-]+'

  - id: device-fingerprint-exfil-query
    desc: MD5 package IMSI brand model exfil query
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'md5=%s&pkg=%s.{0,64}imsi=%s.{0,96}brand=%s.{0,24}model=%s'

composite_rules:
  - id: android-sdk-callback-device-exfil
    desc: Callback endpoint exfiltrates device profile
    crit: hostile
    conf: 0.97
    all:
      - id: sdk-callback-url
      - id: device-fingerprint-exfil-query
