defaults:
  platforms: [windows, linux]
  for: [npm, tar]
  crit: hostile
composite_rules:
  - id: npm-install-host-user-profile-query-exfil
    desc: npm install hook sends encoded host profile
    conf: 0.995
    attack: T1195.002,T1041,T1082,T1033
    mbc: E1041
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    near_bytes: 2000
    all:
      - id: metadata/package/scripts/lifecycle::npm-preinstall-script
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/get::javascript-get-method-text
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
  - id: npm-preinstall-oast-hostname-get-exfil
    desc: Preinstall sends hostname to OAST over HTTP
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041,T1082
    for: [package.json]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: npm-preinstall-oast-hostname-query
      - id: npm-preinstall-node-http-get-alias

  - id: npm-preinstall-host-profile-query-exfil
    desc: npm hook profiles host and exfiltrates via HTTP
    conf: 0.995
    attack: T1041,T1016,T1082
    scope: archive
    for: [npm, tar, package.json, javascript]
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/os/sysinfo/report::js-host-profile-command-sequence
      - id: objectives/exfiltration/http/query::js-http-query-exfil

traits:
  - id: npm-preinstall-oast-hostname-query
    desc: Preinstall puts hostname in OAST query
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '(?is)\.oast\.[^?]{0,100}\?host=[^;]{0,80}os\.hostname\s*\('

  - id: npm-preinstall-node-http-get-alias
    desc: Preinstall calls Node HTTP GET alias
    crit: notable
    conf: 0.96
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'http\.get\s*\('
