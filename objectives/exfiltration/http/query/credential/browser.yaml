defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  attack: T1041
  size_max: 524288
composite_rules:
- id: browser-query-sensitive-source
  desc: Browser credential or secret prepared for query
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/url/construction/query::cookie-session-query-encoding-cooccurrence
  - id: micro-behaviors/data/db/access::browser-storage-credential-key
  - id: micro-behaviors/ui/controls/wallet::web-mnemonic-entry-form
  - id: micro-behaviors/ui/controls/wallet::web-seedword-entry-form
  - id: objectives/credential-access/phishing/landing::js-webmail-login-form
  - id: micro-behaviors/data/serialize/json::js-private-key-json-field
  - id: micro-behaviors/data/serialize/json::js-seed-phrase-json-field
  - id: micro-behaviors/data/serialize/schema-credential::secret-data-property
- id: browser-cookie-query-exfil
  for:
  - javascript
  desc: Browser cookie query exfiltration
  crit: hostile
  conf: 0.96
  attack: T1539
  mbc: E1005
  all:
  - id: micro-behaviors/communications/url/construction/query::cookie-session-query-encoding-cooccurrence
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
