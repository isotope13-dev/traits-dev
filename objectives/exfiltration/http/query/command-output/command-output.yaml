defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - powershell
  attack: T1041
composite_rules:
- id: command-output-url-base64-exfil
  desc: Command output base64-wrapped into URL
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/data/encode/command-output/base64::command-output-base64-pipeline
  any:
  - id: micro-behaviors/communications/url/construction/build-http::shell-command-substitution-url-path
  - id: micro-behaviors/communications/url/construction/build-http::powershell-command-subexpression-url-path
  needs: 1
  near_bytes: 512
  unless:
  - id: metadata/package/documentation/security-testing::python-rule-exploit-example
  - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
  - id: metadata/package/documentation/security-testing::defensive-review-documentation
