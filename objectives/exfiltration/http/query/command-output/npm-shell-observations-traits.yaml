defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1041
traits:
- id: test-script-exfil
  desc: Test hook sends host data in URL
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: scripts.test
    regex: \b(curl|wget)\b[^;&|\r\n]*https?://[^"'\s]*\$\(\s*(hostname|whoami|pwd|env|printenv|id)\b
  not:
  - regex: '''https?://[^'']*\$\('
- id: script-network-exfil-vars
  desc: Install hook sends host data in URL
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    regex: \b(curl|wget)\b[^;&|\r\n]*https?://[^"'\s]*\$\(\s*(hostname|whoami|pwd|env|printenv|id)\b
  not:
  - regex: '''https?://[^'']*\$\('
