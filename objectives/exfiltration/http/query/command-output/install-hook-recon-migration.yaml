defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: npm-preinstall-shell-query-identity
  desc: Shell query includes host identity
  crit: suspicious
  conf: 0.99
  if:
    type: value
    path: scripts.preinstall
    regex: (?is)\b(wget|curl)\b.{0,160}\?[A-Za-z0-9_-]+=\$\((pwd|whoami|hostname)\)
- id: npm-preinstall-node-encodes-query-output
  desc: Encodes command output into URL
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.preinstall
    regex: (?i)encodeURIComponent\s*\(\s*out\s*\)
