# Obfuscated script that slices data into chunks and ships each one in the
# URL of a fire-and-forget `no-cors` GET. Analytics beacons send small fixed
# payloads in readable code; chunking an arbitrary value across many opaque
# GETs while hiding the code is exfiltration shaped to avoid request-body
# inspection, whatever the data source (clipboard, cookies, form input).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1030,T1041
composite_rules:
  - id: obfuscated-chunked-no-cors-query-exfil
    desc: Obfuscated script beacons data chunks via GET
    crit: hostile
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/communications/http/query::chunked-no-cors-query-send
    any:
      - id: objectives/anti-static/obfuscation/string/encoding::js-strong-obfuscation
      - id: objectives/anti-static/obfuscation/string/charcode-url::js-xor-pair-charcode-array
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-variable-names
