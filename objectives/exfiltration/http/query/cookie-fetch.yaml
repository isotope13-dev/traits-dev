defaults:
  platforms: [unix, windows]
  for: [scripts, html, text]
traits:
  - id: document-cookie-fetch-url
    desc: Browser cookies appended to fetch URL
    crit: suspicious
    conf: 0.97
    attack: T1539,T1041
    if:
      type: text
      regex: \bfetch\s*\([^();\r\n<>]{1,220}\+\s*document\s*\.\s*cookie\s*\)
    unless:
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: metadata/package/documentation/agent-safety::pentest-witness-playbook-documentation
    - id: well-known/tool/detection/
    - id: metadata/package/testing/
