defaults:
  platforms:
  - unix
  - windows
traits:
- id: npm-preinstall-shell-query-identity
  desc: Preinstall puts shell identity in URL query
  crit: suspicious
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: scripts.preinstall
    regex: '(?is)\b(wget|curl)\b.{0,160}\?[A-Za-z0-9_-]+=\$\((pwd|whoami|hostname)\)'
- id: js-http-query-exfil
  desc: Shell exec sends a variable with curl
  crit: suspicious
  conf: 0.97
  attack: T1041
  for:
  - javascript
  if:
    type: tree-sitter
    kind: call
    regex: (?is)\bexec(Sync)?\s*\(.{0,400}curl.{0,200}\?\w+=\w*\$\w+
