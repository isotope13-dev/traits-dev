defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: install-script-exfil
  desc: Preinstall sends host or account data in a URL
  crit: hostile
  conf: 0.95
  attack: "T1041"
  all:
  - id: objectives/exfiltration/http/query::script-network-exfil-vars
  - id: micro-behaviors/communications/http/download/package::preinstall-download-tool
        # Download tools

- id: test-hook-exfil
  desc: Test script abused for exfiltration
  crit: suspicious
  conf: 0.9
  attack: "T1059"
  all:
  - id: objectives/exfiltration/http/query::test-script-exfil
  - id: objectives/exfiltration/http/query::install-script-exfil
        # Redundancy pattern: multiple hooks all have network commands
