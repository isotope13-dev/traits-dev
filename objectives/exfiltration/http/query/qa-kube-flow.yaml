defaults:
  platforms: [linux]
  for: [javascript]
traits:
- id: node-exec-serviceaccount-recon-output-curl
  desc: Exec output reaches OOB curl POST
  crit: component
  conf: 0.99
  if:
    type: tree-sitter
    query: >-
      (program
        (_)*
        (lexical_declaration (variable_declarator name: (identifier) @url_name value: (string) @url_value))
        (_)*
        (lexical_declaration (variable_declarator name: (identifier) @cmd_name value: (template_string) @cmd_value))
        (_)*
        (expression_statement
          (call_expression function: (identifier) @outer
            arguments: (arguments
              (identifier) @cmd_ref
              (arrow_function body: (statement_block) @body))))
        (#eq? @outer "exec")
        (#eq? @cmd_name @cmd_ref)
        (#eq? @url_name "webhook")
        (#match? @url_value "https://webhook\\.site/[0-9a-f-]{36}")
        (#match? @cmd_value "whoami")
        (#match? @cmd_value "ip addr show")
        (#match? @cmd_value "ls -la /var/run/secrets/kubernetes\\.io/serviceaccount")
        (#match? @body "JSON\\.stringify")
        (#match? @body "evidence:\\s*stdout\\s*\\|\\|\\s*stderr")
        (#match? @body "const payload\\s*=\\s*JSON\\.stringify")
        (#match? @body "const safePayload\\s*=\\s*payload\\.replace")
        (#match? @body "curl -X POST.{0,100}-d\\s+'\\$\\{safePayload\\}'")
        (#match? @body "\\$\\{webhook\\}")
      )
composite_rules:
- id: node-index-js-host-serviceaccount-oob-exfil
  desc: Node index.js posts Kubernetes reconnaissance output to webhook.site
  crit: hostile
  conf: 0.99
  attack: T1041,T1059.004,T1082,T1033,T1016
  scope: file
  near_lines: 16
  all:
  - id: node-exec-serviceaccount-recon-output-curl
  - id: metadata/import/builtin::node-exec-require-destructure-binding
  - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path
