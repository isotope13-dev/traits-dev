defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  attack: T1041
composite_rules:
  - id: telemetry-query-params-quartet
    desc: Query adds timestamp host engine IP
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/query::urlsearchparams-timestamp-field
      - id: micro-behaviors/communications/http/query::urlsearchparams-instance-name-field
      - id: micro-behaviors/communications/http/query::urlsearchparams-ip-field
      - id: micro-behaviors/communications/http/query::urlsearchparams-engine-field
  - id: ip-telemetry-get-exfil
    desc: Local IP telemetry sent by GET webhook
    crit: hostile
    conf: 0.995
    mbc: E1041
    all:
      - id: micro-behaviors/network/interface::node-local-ip-selection
      - id: micro-behaviors/communications/http/webhook::public-webhook-capture-service
      - id: telemetry-query-params-quartet
      - id: micro-behaviors/communications/http/query::url-derived-http-get
