# The LiteLLM collector uses command argument vectors, not shell command
# strings, for its OpenSSL backend. This also covers implementations in other
# source languages. These are same-file capabilities, not proven data flow:
# encrypted credential backups can overlap, so retain suspicious criticality.
# AES cipher selection does not establish encryption direction; the RSA argv
# explicitly requires public-key encryption.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: openssl-hybrid-secret-upload-capabilities
    desc: Credential targets, AES-CBC/RSA and upload co-occur
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/credential::developer-credential-filename-catalog
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
      - id: micro-behaviors/crypto/symmetric/aes/mode::openssl-enc-aes-cbc-argv
      - id: micro-behaviors/crypto/asymmetric/rsa::openssl-pkeyutl-encrypt-argv
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/upload::curl-file-binary-body-command
