# Hybrid Encryption for Exfiltration
# Generates random AES key, encrypts data, RSA-wraps the session key.
# Classic pattern in CI/CD supply chain attacks (trivy-gha, codecov).
# ATT&CK: T1573.002 (Asymmetric Cryptography)
defaults:
  for: [shell]
  platforms: [unix]
  attack: T1573.002

composite_rules:
  - id: hybrid-encrypt-exfil
    desc: "Hybrid encryption with HTTP export clues"
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/hybrid::openssl-rsa-aes-hybrid-encryption
    any:
      - id: micro-behaviors/communications/http/upload::curl-post-binary-upload
      - id: micro-behaviors/communications/http/upload::curl-data-binary
      - id: micro-behaviors/communications/http/upload::github-uploads-api
      - id: objectives/exfiltration/http/upload::icp-canister-drop-endpoint
  - id: node-hybrid-encrypted-exfil
    desc: Node hybrid encrypted HTTP exfiltration
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc
      - id: micro-behaviors/os/random/crypto::node-random-32-byte-value
      - id: micro-behaviors/crypto/asymmetric/rsa::node-crypto-public-encrypt
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    near_lines: 80
  - id: node-gcm-rsa-encrypted-exfil
    desc: Node AES-GCM and RSA-OAEP HTTP exfiltration
    crit: hostile
    conf: 0.98
    attack: T1573.002,T1041
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm
      - id: micro-behaviors/data/decompress/gzip::node-gzip-functions
      - id: micro-behaviors/os/random/crypto::node-random-32-byte-value
      - id: micro-behaviors/crypto/asymmetric/rsa::node-crypto-public-encrypt
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    near_lines: 120
  - id: python-hybrid-encrypted-http-upload
    desc: "AES-GCM and RSA-OAEP with HTTP upload"
    crit: hostile
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-oaep-public-encrypt
      - id: micro-behaviors/data/compress/gzip::gzip-compress-call
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/communications/http/post::python-post-method-literal
    near_lines: 90
  - id: python-cbc-rsa-encrypted-http-upload
    desc: "AES-CBC and RSA-OAEP with HTTP upload"
    crit: hostile
    conf: 0.98
    attack: T1573.002,T1041
    for: [python]
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-cbc-mode
      - id: micro-behaviors/crypto/asymmetric/rsa::pycryptodome-rsa-oaep-public-encrypt
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
    near_lines: 90
  - id: browser-webcrypto-hybrid-http-exfil
    desc: "Hybrid encryption envelope with HTTP upload"
    crit: hostile
    conf: 0.98
    attack: T1573.002,T1041
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/crypto/hybrid::webcrypto-hybrid-payload-envelope
      - id: micro-behaviors/crypto/asymmetric/key::pem-public-key-header
      - id: micro-behaviors/communications/http/request/reference::js-fetch-reference
      - id: micro-behaviors/crypto/hybrid::webcrypto-rsa-oaep-aes-gcm-algorithm
