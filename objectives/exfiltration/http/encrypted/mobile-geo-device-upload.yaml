# Encrypted upload of precise location with device identity. Location
# apps legitimately post coordinates to first-party APIs, so the
# suspicious claim requires the paired coordinate payload, a dedicated
# geo-location upload route, and payload encryption or HMAC signing
# plus a second sensitive sink (device-profile upload or phone
# binding). The hostile claim requires that collection to run inside
# the code-forge-bootstrapped tiered resolver, which no first-party
# location feature needs.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  attack: T1041,T1430
  mbc: B0030

composite_rules:
  - id: encrypted-geolocation-device-upload
    desc: Encrypted precise location uploaded with device identity data
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/sysinfo/geolocation::latitude-longitude-payload-fields
      - id: micro-behaviors/communications/url/resource-path/collection::geo-location-upload-path
    any:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::mobile-aes-cipher-construction
      - id: micro-behaviors/crypto/hash/hmac::hmac-api-reference
      - id: micro-behaviors/communications/url/resource-path/collection::device-info-upload-path
      - id: micro-behaviors/communications/url/resource-path/identity::phone-bind-endpoint-path
    needs: 2

  - id: tiered-c2-encrypted-location-exfiltration
    desc: Tiered dead-drop resolver exfiltrates encrypted device location
    crit: hostile
    conf: 0.97
    attack: T1041,T1430,T1102.001
    all:
      - id: encrypted-geolocation-device-upload
      - id: objectives/command-and-control/infrastructure/dead-drop::tiered-dead-drop-device-registration
