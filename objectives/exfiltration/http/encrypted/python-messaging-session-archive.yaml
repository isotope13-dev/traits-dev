# Messaging-session theft that seals the stolen archive before upload: the
# collected session store is zipped in memory, masked with a home-made
# hash-counter keystream XOR under a fresh random nonce, and posted as an
# opaque octet-stream body. Encrypting a credential archive client-side keeps
# the session tokens out of TLS-terminating proxies and DLP inspection; a
# genuine backup tool for the user would not need to hide the bytes from the
# user's own network.
#
# Worked example: extera-plugin-runtime 1.0.x — exteraGram (Telegram fork)
# plugin helper that zips tgnet.dat / userconfig*.xml, XORs the ZIP with a
# SHA-256(key||nonce||counter) stream and POSTs it to /up on command.
# Android Python uses Linux; the engine rejects Android-only Python scope.
defaults:
  for: [python]
  platforms: [linux, android]
  attack: T1560.001,T1041,T1555

composite_rules:
  - id: python-encrypted-messaging-session-archive-upload
    desc: Encrypted messaging-session ZIP uploaded as opaque body
    crit: hostile
    conf: 0.97
    # The remote-tasking gate keeps an untriggered or locally keyed backup
    # (see testdata/suspicious/generated/telegram-auth-and-rigged-settlement)
    # below a conviction: the server must be able to start the upload.
    all:
      - id: objectives/command-and-control/remote-command/http-poll::python-telegram-auth-keyed-tasking
      - id: micro-behaviors/data/archive/zip::python-zipfile-writer
      - id: micro-behaviors/data/encoding/xor/unspecified-key::xor-bytes-zip-pairwise
      - id: micro-behaviors/os/random/crypto::os-urandom
      - id: micro-behaviors/data/format/mime::mime-octet-stream
      - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
