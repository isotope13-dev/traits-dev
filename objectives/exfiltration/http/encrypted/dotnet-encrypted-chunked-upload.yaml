defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: encrypted-http-upload-client
    desc: Encrypted HTTP upload client
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/encoded::dotnet-versioned-upload-api
      - id: objectives/exfiltration/http/encoded::encrypted-upload-schema
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-symmetric-crypto
    unless:
      - id: metadata/signed/platform/
