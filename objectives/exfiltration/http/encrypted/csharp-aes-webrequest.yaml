defaults:
  platforms: [netbsd, unix, windows]
  for: [csharp, pe]
  attack: T1552.001

traits:
  - id: csharp-aes-http-exfil
    desc: "Encryptor with HTTP exfil endpoint"
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'CreateEncryptor[\s\S]{0,900}HttpWebRequest[\s\S]{0,260}/exfil'
