# Covert screen capture paired with outbound HTTP multipart or file upload.
# Interactive `screencapture output.png` (without `-x`) and standalone HTTP
# upload clients remain below hostile; suppressing the macOS shutter cue while
# posting the captured image off-host establishes covert screenshot exfiltration.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  attack: T1113,T1041

composite_rules:
  - id: http-multipart-or-file-upload-body
    desc: Multipart form or file-upload HTTP body
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/header/content-disposition::multipart-form-upload-marker
      - id: micro-behaviors/communications/http/upload/multipart::multipart-http-upload
      - id: micro-behaviors/communications/http/upload/file/
      - id: micro-behaviors/communications/http/upload/cli/

  - id: silent-screenshot-http-upload
    desc: Captures silent macOS screenshot and uploads it
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/hardware/display/screenshot/unspecified::macos-silent-screencapture-flag
      - id: http-multipart-or-file-upload-body
    any:
      - id: micro-behaviors/communications/http/channel::script-http-upload-client
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
      - id: micro-behaviors/communications/http/request/client/
      - id: micro-behaviors/communications/http/upload/cli/
