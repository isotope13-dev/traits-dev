defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: ctf-flag-buffer-append-call
    desc: Appends flag to the instance flag buffer
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'self\.flags\.append\(\s*flag\s*\)'

composite_rules:
  - id: ctf-exploit-framework-flag-submission
    desc: CTF exploit runner queues and submits flags
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/exploit/network-service/exploit-automation::ctf-exploit-framework-target-dispatch
      - id: objectives/execution/exploit/network-service/exploit-automation::ctf-flag-submission-request
      - id: ctf-flag-buffer-append-call
