defaults:
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
  for:
    - binaries
    - scripts
    - source
    - manifests
    - documents
    - media
    - data
composite_rules:
  - id: encrypted-exfiltration-to-paste-site
    desc: Encrypted data exfiltration to a public paste service
    crit: hostile
    conf: 0.9
    near_lines: 80
    all:
    - id: objectives/command-and-control/infrastructure/paste::dpaste
    - id: micro-behaviors/communications/http/upload::curl-file-upload-exfil
    any:
    - id: micro-behaviors/crypto/library/
    - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
    - id: micro-behaviors/crypto/kdf/algorithm::scrypt-name-literal
    - id: micro-behaviors/crypto/symmetric/aes/library::rijndael-managed
    - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-cipher
    - id: metadata/import/go/crypto/cipher
    - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-import-source
    - id: micro-behaviors/crypto/decrypt::bcrypt-decrypt-source
    - id: micro-behaviors/crypto/decrypt::bcrypt-symmetric-crypto-source
    - id: micro-behaviors/crypto/cipher::commoncrypto-cccrypt
    - id: micro-behaviors/crypto/kdf/algorithm::commoncrypto-pbkdf
    - id: "micro-behaviors/data/encode"
    - id: metadata/file/comment::base64-like-comment-content
    - id: "metadata/file/magic/identity::gzip-prefix-bytes"
    - id: "metadata/import/go/encoding/base32"
    - id: "micro-behaviors/data/encoding/base32::base32-lowercase-alphabet-literal"
    - id: "micro-behaviors/data/encoding/base32::base32-lowercase-alphabet-text"
    - id: "micro-behaviors/data/encoding/base32::base32-uppercase-alphabet-text"
    - id: micro-behaviors/data/encoding/xor::xor-bytes-zip-pairwise
    - id: micro-behaviors/data/encoding/xor::c-xor-assign-modulo-operand
    - id: micro-behaviors/data/encoding/xor::python-literal-key-xor-bytes
    - id: "micro-behaviors/data/decompress/gzip::python-base64-gzip-decode"
    - id: micro-behaviors/crypto/hybrid::openssl-rsa-aes-hybrid-encryption
    - id: micro-behaviors/crypto/hybrid::webcrypto-hybrid-payload-envelope
    - id: micro-behaviors/crypto/hybrid::webcrypto-rsa-oaep-aes-gcm-algorithm
    - id: micro-behaviors/crypto/asymmetric/encrypt::asym-encrypt-string
