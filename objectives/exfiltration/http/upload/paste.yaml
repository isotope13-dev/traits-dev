defaults:
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
  for:
    - binaries
    - scripts
    - source
    - manifests
    - documents
    - media
    - data
composite_rules:
  - id: encrypted-exfiltration-to-paste-site
    desc: Encrypted data exfiltration to a public paste service
    crit: hostile
    conf: 0.9
    near_lines: 80
    all:
    - id: objectives/command-and-control/infrastructure/paste::dpaste
    - id: micro-behaviors/communications/http/upload/cli::curl-post-file-body-clues
    any:
    - id: metadata/binary/symbols/name/cryptoapi::crypt-import-public-key-info-string
    - id: micro-behaviors/crypto/provider/library::crypto-library-context
    - id: metadata/lang/source/naming/module::nip04-module-path-text
    - id: micro-behaviors/crypto/encrypt/reference::encrypt-sk-call-text
    - id: micro-behaviors/crypto/decrypt/transform/unspecified::decrypt-sk-call-text
    - id: metadata/lang/source/naming/function/cryptography::finalize-event-name
    - id: metadata/lang/source/naming/function/cryptography::verify-event-name
    - id: metadata/lang/source/syntax/call/relationship::nip04-package-and-sk-call-text
    - id: metadata/lang/source/naming/function/cryptography::event-key-name-pair
    - id: metadata/lang/source/naming/function/cryptography::go-keygen-helper-function
    - id: metadata/lang/source/naming/function/cryptography::go-byte-cipher-helper-function
    - id: metadata/import/builtin::go-crypto-rsa-import
    - id: metadata/import/builtin::go-crypto-aes-import
    - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
    - id: micro-behaviors/crypto/kdf/algorithm::scrypt-name-literal
    - id: micro-behaviors/crypto/symmetric/aes/reference::rijndael-managed
    - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-cipher
    - id: metadata/import/go/crypto/cipher
    - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-import-source
    - id: micro-behaviors/crypto/decrypt/transform/unspecified::bcrypt-decrypt-source
    - id: micro-behaviors/crypto/decrypt/transform/symmetric::bcrypt-symmetric-crypto-source
    - id: micro-behaviors/crypto/cipher/unspecified::commoncrypto-cccrypt
    - id: micro-behaviors/crypto/kdf/algorithm::commoncrypto-pbkdf
    - id: "micro-behaviors/data/encode"
    - id: metadata/lang/source/comment::base64-like-comment-content
    - id: "metadata/file/magic/identity::gzip-prefix-bytes"
    - id: "metadata/import/go/encoding/base32"
    - id: "micro-behaviors/data/encoding/base32::base32-lowercase-alphabet-literal"
    - id: "micro-behaviors/data/encoding/base32::base32-lowercase-alphabet-text"
    - id: "micro-behaviors/data/encoding/base32::base32-uppercase-alphabet-text"
    - id: micro-behaviors/data/encoding/xor/unspecified-key::xor-bytes-zip-pairwise
    - id: micro-behaviors/data/bitwise/xor-forms/indexed::c-xor-assign-modulo-operand
    - id: micro-behaviors/data/encoding/xor/fixed-key::python-literal-key-xor-bytes
    - id: "micro-behaviors/data/decompress/gzip::python-base64-gzip-decode"
    - id: micro-behaviors/crypto/hybrid::openssl-rsa-aes-hybrid-encryption
    - id: micro-behaviors/crypto/hybrid::webcrypto-hybrid-payload-envelope
    - id: micro-behaviors/crypto/hybrid::webcrypto-rsa-oaep-aes-gcm-algorithm
    - id: metadata/lang/source/naming/function/cryptography::asym-encrypt-string
