defaults:
  platforms: [android, unix]
  for: [shell, php, perl, c, cpp, elf, go, kotlin]
  attack: T1041

traits:
  - id: exfil-beacon-http-endpoint
    desc: HTTP exfiltration or beacon URL path
    crit: suspicious
    conf: 0.9
    if:
      # URL literals are evidence of a reachable endpoint; documentation and
      # comments containing the Beacon API URL are not exfiltration behavior.
      type: string_literal
      regex: 'https?://[^"''\s]{1,120}/(exfil(trate|tration)?|beacon)([/?#]|$)'
    not:
      - regex: 'w3c\.github\.io/beacon'
      # /cdn-cgi/ is Cloudflare's reserved edge path, where it serves its RUM
      # and Expect-CT reporting beacons. Cloudflare fronts a large share of the
      # web, so `https://report-uri.cloudflare.com/cdn-cgi/beacon/expect-ct`
      # turns up in any captured HTTP response used as test data — Boost.Beast's
      # websocket handshake test embeds a real Cloudflare response verbatim —
      # and likewise in HAR files, proxy fixtures and browser-automation goldens.
      - regex: '/cdn-cgi/beacon'
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      # Security tests commonly embed representative /exfil URLs as inert
      # fixtures; the Go test-file context is not executable exfiltration.
      # (directory ref covers test-directory / go-test-file / test-filename-pattern)
      - id: metadata/package/testing/presence/
      - id: well-known/tool/detection/clawker::source-tree
      - id: well-known/app/publishing/wordpress-plugins/
      - id: well-known/tool/detection/llm-scanner::mvar-security-context
      - id: well-known/app/infrastructure/k9x-satan::attack-fixture-context
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context

  - id: raw-exfil-post-path
    desc: Raw HTTP exfil POST path
    crit: component
    conf: 0.86
    if:
      type: text
      substr: 'POST /exfil'
