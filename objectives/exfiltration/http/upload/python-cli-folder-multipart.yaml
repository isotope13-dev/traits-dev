defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1039

composite_rules:
  - id: python-cli-folder-multipart-exfil
    desc: Python walks a folder and multipart-uploads it
    crit: hostile
    conf: 0.98
    scope: file
    near_lines: 512
    all:
      - id: micro-behaviors/communications/http/url/telemetry::python-cli-upload-api-path
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
