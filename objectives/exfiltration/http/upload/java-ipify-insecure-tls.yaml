defaults:
  for: [java_class]
  platforms: [unix, windows]
  attack: T1071.001,T1553

composite_rules:
  - id: java-ipify-insecure-tls-post
    desc: Java class disables TLS verification and posts to external endpoint
    crit: hostile
    conf: 0.95
    mbc: B0030
    scope: file
    all:
      - id: micro-behaviors/communications/tls
      - id: micro-behaviors/communications/http
      - id: micro-behaviors/data/serialize
      - id: micro-behaviors/communications/url
