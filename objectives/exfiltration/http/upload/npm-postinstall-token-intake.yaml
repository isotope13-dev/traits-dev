# A postinstall hook that delivers its payload to a token-addressed intake
# endpoint: the URL path carries an unguessable receiver token, so the drop
# needs no account and attributes to nobody. That is the anonymous-dropbox
# semantic (Discord webhooks are the known-host instance; the intake-token
# atom covers the unknown-host rest). Auto-execution at install time plus an
# account-less receiver plus an uploaded request body is the install-time
# stealer shape. Benign install pings report to authenticated vendor APIs,
# never to a path-token drop, so the token leg is what keeps this hostile.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
  attack: T1041,T1195.002
  mbc: E1041

composite_rules:
  - id: npm-postinstall-token-intake-upload
    desc: npm postinstall uploads to token-addressed intake endpoint
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/webhook::intake-token-path
      - id: micro-behaviors/communications/http/request/body::node-http-request-end-body
    unless:
      - id: metadata/package/testing/harness/runtime/
