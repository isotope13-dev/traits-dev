defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: npm-preinstall-curl-exfil
    desc: Preinstall sends data with curl
    crit: suspicious
    conf: 0.95
    all:
    - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
    - id: micro-behaviors/communications/http/curl::npm-preinstall-curl
    - id: metadata/package/scripts/lifecycle::preinstall-curl-data-urlencode
