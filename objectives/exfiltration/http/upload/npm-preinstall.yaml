defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-preinstall-pipes-file-to-curl
    desc: Preinstall pipes a local file to curl
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: '(?is)\b(type|cat)\s+[^|;]{1,120}\|\s*curl\b[^;]{0,120}--data-binary\s+@-'

composite_rules:
  - id: npm-preinstall-curl-oast-file-exfil
    desc: Npm preinstall uploads a local file to OAST
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1041,T1005
    mbc: E1041
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/network::preinstall-oast-domain
      - id: npm-preinstall-pipes-file-to-curl

  - id: npm-preinstall-host-profile-upload-to-ip
    desc: Preinstall attempts host profile upload to raw IP
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082,T1033
    mbc: E1041
    all:
    - id: npm-preinstall-curl-exfil
    - id: metadata/package/scripts/discovery::preinstall-hostname
    - id: metadata/package/scripts/discovery::preinstall-whoami
    - id: micro-behaviors/communications/ip/ipv4::preinstall-external-ipv4-url

  - id: npm-preinstall-curl-exfil
    desc: Preinstall sends data with curl
    crit: suspicious
    conf: 0.95
    all:
    - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
    - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
    - id: metadata/package/scripts/network::preinstall-curl-data-urlencode
