defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1528,T1567.002

composite_rules:
  - id: device-code-oauth-panel-upload
    desc: Uploads device-code OAuth tokens to panel
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/auth::oauth-token-collect-endpoint
      - id: micro-behaviors/communications/http/auth::access-refresh-token-pair
