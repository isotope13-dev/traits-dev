defaults:
  attack: T1041
  platforms:
  - unix
  - windows
  for: [scripts, binaries]
traits:
- id: curl-ua-smuggle
  desc: curl User-Agent carries host identity output
  crit: suspicious
  conf: 0.85
  attack: T1071.001
  unless:
  - id: well-known/app/infrastructure/pihole::pihole-artifact
  if:
    type: text
    regex: '(?i)\bcurl\b[^\n]{0,160}\s+-A\s+"\$\(\s*(id|whoami|hostname|uname|ifconfig|ipconfig)\b'
composite_rules:
- id: curl-exfil
  desc: Curl smuggles data via User-Agent while uploading a binary body
  crit: suspicious
  conf: 0.9
  # Bare --data-binary "@file" is ordinary API client usage (coverage charts,
  # release uploads). Suspicious only when combined with UA-header smuggling.
  all:
  - id: curl-ua-smuggle
  - id: micro-behaviors/communications/http/upload::curl-post-binary-upload
- id: curl-file-upload-exfil
  desc: curl uploads local file over HTTP
  crit: notable
  conf: 0.97
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  - id: micro-behaviors/communications/http/upload::curl-post-binary-upload
  any:
  - id: micro-behaviors/communications/http/upload::curl-upload-filename-header
  - id: micro-behaviors/communications/http/download/cli::curl-s-flag
  - id: micro-behaviors/os/console/io::stderr-to-dev-null
