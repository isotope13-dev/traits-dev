# Torrent-based leak distribution.  The article's distinctive technique is a
# per-release tracker plus an initial HTTP web seed for a staged data archive.
# The protocol atoms are neutral; intent is raised only for the complete release
# shape or when it accompanies a known cloud-portal record-extraction pattern.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data, javascript, typescript, python, shell, powershell, go, rust, java, csharp]
  attack: T1041

composite_rules:
  - id: cloud-portal-torrent-data-release
    for: [javascript]
    desc: Cloud-portal records released through a BitTorrent web seed
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    all:
      - id: objectives/exfiltration/http/query::power-pages-dataverse-bulk-exfiltration
      - id: micro-behaviors/data/serialize/bittorrent::bittorrent-web-seeded-archive-release
