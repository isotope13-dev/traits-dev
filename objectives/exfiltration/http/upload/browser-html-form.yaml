defaults:
  platforms: [windows]
  for: [batch]
  attack: T1041

composite_rules:
  - id: batch-command-output-browser-form-exfil
    desc: Browser form posts captured command output
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/script/file::batch-script-output-capture
      - id: micro-behaviors/fs/file/copy::cmd-html-wrapper-concatenation
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/communications/http/request/html::batch-html-onload-form-submit
      - id: micro-behaviors/communications/http/client/browser-cli::chromium-command-local-html
    near_lines: 20
