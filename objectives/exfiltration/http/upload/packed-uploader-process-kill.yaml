# A multipart self-submission utility is dual-use on its own, but one that
# also carries dynamically resolved Toolhelp module enumeration and process
# termination has no submission-utility purpose: it uploads files and kills
# processes. The Rifaien exemption in packed-cleartext-file-array covers the
# upload mechanics, not this combination.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1048.003,T1057
composite_rules:
  - id: packed-uploader-dynamic-process-kill
    desc: Packed uploader resolves process-kill APIs
    crit: hostile
    conf: 0.9
    all:
      - id: well-known/dual-use/transfer/rifaien::rifaien-self-submission-utility
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-module-enumeration-string
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    unless:
      - id: metadata/signed/platform/
