defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [java, class, kotlin]
  attack: T1041
composite_rules:
  - id: jvm-sensitive-http-post-exfil
    desc: Java/Kotlin sensitive HTTP exfil
    conf: 0.97
    for: [java, kotlin]
    near_lines: 260
    all:
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
      - id: micro-behaviors/communications/http/request/body::jvm-http-body-write-source
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-bytecode
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/path/credential::ssh-credentials
      - id: objectives/discovery/system/fingerprint/info::java-broad-host-fingerprint-source
      - id: objectives/credential-access/files/config::java-developer-credential-sweep
    needs: 1
  - id: jvm-bytecode-sensitive-http-post-exfil
    desc: JVM bytecode sensitive HTTP exfil
    conf: 0.97
    for: [class, java_class]
    # Class-level bytecode facts must be in one nearby code region; do not
    # pool across unrelated JVM classes in an archive.
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: micro-behaviors/communications/http/post::jvm-post-token
      - id: metadata/binary/symbols/name/token::jvm-set-do-output-member
      - id: micro-behaviors/data/buffer/transfer::jvm-outputstream-write
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-bytecode
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/os/privilege/paths::etc-shadow-path-bytes
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/path/credential::ssh-credentials
    needs: 1
    unless:
  - id: kotlin-sensitive-http-copy-exfil
    desc: Kotlin sensitive HTTP copy exfiltration
    conf: 0.97
    for: [kotlin]
    all:
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
      - id: micro-behaviors/communications/http/request/body::kotlin-http-body-copy-source
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/path/credential::ssh-credentials
    needs: 1
  - id: jvm-jar-host-recon-http-callback
    desc: JVM JAR pools recon with HTTP callback
    conf: 0.995
    attack: "T1041,T1082"
    for: [jar, class]
    scope: archive
    all:
      - id: objectives/discovery/system/fingerprint/info::jvm-host-recon-command-roster
      - id: objectives/command-and-control/backdoor/tasking/http::jvm-host-output-json-template
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
