defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [java, class, kotlin]
  attack: T1041
composite_rules:
  - id: jvm-agent-credential-http-exfil
    desc: Java agent uploads developer credentials
    conf: 0.99
    crit: hostile
    for: [jar]
    scope: archive
    all:
      - id: micro-behaviors/process/hook/instrumentation::java-agent-premain-entrypoint
      - id: objectives/credential-access/files/config::java-credential-path-table
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
      - id: micro-behaviors/fs/read/file/full::java-readallbytes

  - id: kotlin-developer-credential-http-exfil
    desc: Kotlin package uploads developer credentials
    conf: 0.99
    crit: hostile
    for: [kotlin]
    scope: archive
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/communications/http/client/library::java-http-url-connection
  - id: jvm-developer-credential-curl-exfil
    desc: JVM uploads developer credentials with curl
    conf: 0.98
    crit: hostile
    for: [class, java_class]
    all:
      - id: objectives/credential-access/files/config::java-credential-path-table
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/communications/http/upload::jvm-curl-data-binary-string
  - id: jvm-sensitive-http-post-exfil
    desc: Java/Kotlin sensitive HTTP exfil
    conf: 0.97
    for: [java, kotlin]
    near_lines: 260
    all:
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
      - id: micro-behaviors/communications/http/post::jvm-http-body-write-source
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-bytecode
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/path/credential::ssh-credentials
      - id: objectives/discovery/system/fingerprint/info::java-broad-host-fingerprint-source
      - id: objectives/credential-access/files/config::java-developer-credential-sweep
    needs: 1
  - id: jvm-bytecode-sensitive-http-post-exfil
    desc: JVM bytecode sensitive HTTP exfil
    conf: 0.97
    for: [class, jar, zip]
    # Archive-level facts must be in one nearby class/code region; do not
    # combine a shell template's known_hosts read with unrelated JVM classes.
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: metadata/file/string/identity::jvm-post-token
      - id: micro-behaviors/communications/http/post::jvm-bytecode-do-output
      - id: micro-behaviors/data/buffer::jvm-outputstream-write
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-bytecode
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/os/privilege/paths::etc-shadow-path-bytes
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/path/credential::ssh-credentials
    needs: 1
    unless:
  - id: kotlin-sensitive-http-copy-exfil
    desc: Kotlin sensitive HTTP copy exfiltration
    conf: 0.97
    for: [kotlin]
    all:
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
      - id: micro-behaviors/communications/http/post::kotlin-http-body-copy-source
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/path/credential::ssh-credentials
    needs: 1
  - id: kotlin-bytecode-sensitive-http-copy-exfil
    desc: Kotlin bytecode sensitive HTTP copy exfiltration
    conf: 0.97
    for: [class, jar, zip]
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: metadata/file/string/identity::jvm-post-token
      - id: micro-behaviors/communications/http/post::jvm-bytecode-do-output
      - id: micro-behaviors/data/buffer::kotlin-bytecode-copyto-default
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-bytecode
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/os/privilege/paths::etc-shadow-path-bytes
    needs: 1

  - id: jvm-host-recon-http-exfil
    desc: JVM host reconnaissance HTTP exfiltration
    conf: 0.995
    attack: "T1041,T1082"
    for: [class]
    all:
      - id: objectives/discovery/system/fingerprint/info::jvm-host-recon-command-roster
      - id: objectives/command-and-control/backdoor/tasking/http::jvm-host-output-json-template
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
      - id: micro-behaviors/data/buffer::jvm-outputstream-write

  - id: jvm-jar-host-recon-http-callback
    desc: JVM JAR pools recon with HTTP callback
    conf: 0.995
    attack: "T1041,T1082"
    for: [jar]
    scope: archive
    all:
      - id: objectives/discovery/system/fingerprint/info::jvm-host-recon-command-roster
      - id: objectives/command-and-control/backdoor/tasking/http::jvm-host-output-json-template
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-bytecode
