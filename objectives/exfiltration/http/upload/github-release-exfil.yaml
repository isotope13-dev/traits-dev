# GitHub API Abuse for Data Exfiltration
# Creates repos and uploads encrypted data as release assets.
# Observed in trivy-gha supply chain attack as fallback exfil channel.
# ATT&CK: T1567.001 (Exfiltration to Code Repository)
defaults:
  for: [shell, python, javascript, typescript, github-actions]
  platforms: [unix, windows]
  attack: T1567.001
composite_rules:
  - id: github-repo-exfil-chain
    desc: Creates repo then uploads data via releases
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/github::github-create-repo-api
      - id: micro-behaviors/communications/http/services/github::github-create-release-api
      - id: micro-behaviors/communications/http/upload::curl-data-binary
  - id: github-repo-contents-exfil
    desc: GitHub repo contents exfiltration workflow
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/github::github-create-repo
      - id: micro-behaviors/communications/http/services/github::github-create-or-update-file-contents
    any:
      - id: objectives/credential-access/api-harvest/token::github-token-pattern-harvest
      - id: objectives/credential-access/env/secrets/source-control::node-git-token
  - id: github-repo-contents-token-exfil-rest
    desc: GitHub repository exfiltration with harvested npm token
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/github::github-create-repo-rest-fields
      - id: objectives/exfiltration/stealer/file::node-file-content-record
      - id: objectives/credential-access/api-harvest/token::npm-token-regex-harvest
  - id: github-release-encrypted-archive-exfil
    desc: Encrypted archive uploaded to GitHub release
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/upload::github-release-asset-publisher
      - id: objectives/exfiltration/http/upload::hybrid-encrypt-exfil
    any:
      - id: micro-behaviors/data/archive/create/tar::tar-create
      - id: micro-behaviors/data/archive/create/tar::tar-current-dir
  - id: github-release-credential-fallback
    desc: Harvested credentials uploaded as a GitHub release asset
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041,T1567.001
    all:
      - id: micro-behaviors/communications/http/services/github::github-create-repo-api
      - id: micro-behaviors/communications/http/upload::github-release-asset-publisher
    any:
      - id: objectives/credential-access/cloud/token/cli::registry-token-theft
      - id: objectives/credential-access/files/config::developer-credential-sweep
      - id: objectives/supply-chain/credential-theft/env::supply-chain-env-theft
      - id: objectives/supply-chain/recon-exfil/secrets::github-actions-secret-theft
      - id: objectives/exfiltration/http/upload::node-hybrid-encrypted-exfil
      - id: objectives/exfiltration/http/upload::python-hybrid-encrypted-http-upload
  # `github-contents-write` (create repo + write contents) moved to
  # micro-behaviors/communications/http/services/github::
  # github-create-repo-and-contents-write. It is the ordinary Octokit
  # publishing workflow — it fired at `suspicious` on a VS Code extension that
  # publishes generated content to the user's own repository — so it belongs in
  # the neutral GitHub-API capability tree. The exfiltration intent lives in the
  # encoded-payload and credential legs below.
  - id: github-contents-encoded-write
    desc: Encoded data is written to GitHub contents
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/github::github-create-repo-and-contents-write
    any:
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
      - id: micro-behaviors/data/encode/base64::b64encode-call
  - id: github-contents-credential-fallback
    desc: Harvested credentials written to a GitHub repository
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1041,T1567.001
    near_bytes: 4096
    all:
      - id: github-contents-encoded-write
    any:
      - id: objectives/supply-chain/credential-theft/env::javascript-filtered-environment-exfil
      - id: objectives/exfiltration/stealer/credential/env::python-environ-json-requests-exfil
      - id: objectives/credential-access/env/secrets/filtered-access::js-secret-keyword-list
      - id: objectives/supply-chain/credential-theft/env::python-bulk-secret-env-harvest

  # Attacker-owned repository as the drop point: the payload creates a repo
  # under the victim's own account with a stolen token, then pushes the
  # harvested material into it Base64-encoded. The environment block and the
  # host profile are what separate this from a publishing integration.
  - id: github-repo-harvested-env-exfil
    desc: Harvested environment pushed to a GitHub repo
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/github::github-create-repo
      - id: micro-behaviors/os/env/access::node-process-env-object-field
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/fs/path/sensitive/credentials::npmrc-credentials
      - id: objectives/credential-access/env/secrets/source-control::github-token-var
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
