defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041
  mbc: B0028

composite_rules:
  # The Rifaien-cluster agent reads its own image path, builds a multipart
  # file upload through libcurl, and posts a per-run mutated copy of itself
  # (16 bytes randomized in the [[UNIQUE]] slot, clone deleted afterwards) to
  # a fixed upload endpoint. Suspicious, not hostile: the endpoint solicits
  # structured submissions (file[]/node/submit fields, node selection,
  # version banner), so self-upload alone does not establish unauthorized
  # exfiltration — but a self-replicating uploader with per-clone
  # polymorphism is genuinely weird behavior an analyst must see. Required
  # legs are endpoint-agnostic; the marker and endpoint corroborate in any:
  # (a host or marker rotates for free). The family banner lives in
  # well-known/malware/worm/snojan, which objectives may not reference.
  - id: self-image-http-upload
    desc: Uploads its own program image over HTTP
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::get-module-filename-a-resolved-name
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    any:
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
    needs: 1
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: metadata/signed/platform/
