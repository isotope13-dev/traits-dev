defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

composite_rules:
- id: curl-chunk-upload-endpoint
  desc: curl chunk upload endpoint
  crit: suspicious
  conf: 0.94
  attack: T1041
  any:
  - id: curl-contact-upload
  - id: curl-gate-chunk-upload
- id: applescript-upload-php-exfil
  desc: AppleScript upload.php archive exfiltration
  crit: hostile
  conf: 0.95
  attack: T1041
  all:
  - id: curl-upload-php
  any:
  - id: micro-behaviors/fs/path/temp::tmp-out-zip
  - id: objectives/collection/archive/create::ditto-staging
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  - id: uuid-upload-header
- id: applescript-exfiltration
  desc: AppleScript staged archive exfiltration
  crit: suspicious
  conf: 0.95
  attack: T1041
  any:
  - id: objectives/exfiltration/http/archive::applescript-profile-and-exfil
  - id: objectives/exfiltration/http/archive::applescript-chunked-curl-exfil
  - id: objectives/exfiltration/http/archive::applescript-direct-chunked-upload
  - id: objectives/exfiltration/http/archive::applescript-outzip-curl-exfil
  - id: applescript-upload-php-exfil
  - id: applescript-buildid-databinary-exfil
  - id: objectives/exfiltration/stealer/file::applescript-grabber-zip-exfil
- id: applescript-buildid-databinary-exfil
  for: [applescript, shell, macho]
  desc: Campaign-tagged curl upload of collected data
  crit: hostile
  conf: 0.96
  attack: T1041
  # Require credential capture alongside the tagged file upload; a custom
  # HTTP header and POST alone also occur in ordinary upload clients.
  all:
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  - id: "micro-behaviors/communications/http/curl::curl-data-binary-at-source"
  - id: objectives/credential-access/phishing/lure::password-phishing-comp
  any:
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  - id: micro-behaviors/communications/ip/literal::http-ip-url
