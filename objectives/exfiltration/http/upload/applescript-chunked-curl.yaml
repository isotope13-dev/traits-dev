defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

composite_rules:
- id: applescript-profile-and-exfil
  desc: AppleScript profiling and archive exfiltration
  crit: suspicious
  conf: 0.95
  attack: T1041
  all:
  - id: objectives/exfiltration/http/archive::macos-tmp-archive-curl-upload
  needs: 2
  any:
  - id: macos-stealer-upload-channel
  - id: objectives/collection/archive/create::ditto-staging
  - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
  - id: micro-behaviors/communications/http/url/endpoint::health-check-path
  - id: micro-behaviors/os/sysinfo/hardware::system-profiler-summary
  - id: micro-behaviors/os/sysinfo/hardware::system-profiler-uuid
- id: curl-chunk-upload-endpoint
  desc: curl chunk upload endpoint
  crit: suspicious
  conf: 0.94
  attack: T1041
  any:
  - id: curl-contact-upload
  - id: curl-gate-chunk-upload
- id: applescript-chunked-curl-exfil
  desc: AppleScript chunked curl archive exfiltration
  crit: hostile
  conf: 0.97
  attack: T1041
  all:
  - id: objectives/collection/archive/create::ditto-staging
  - id: split-outzip-chunks
  - id: curl-chunk-upload-endpoint
  needs: 2
  any:
  - id: x-chunk-headers
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  - id: tmp-chunk-upload
- id: applescript-direct-chunked-upload
  desc: AppleScript chunked curl upload
  crit: hostile
  conf: 0.96
  attack: T1041
  all:
  - id: split-outzip-chunks
  - id: curl-chunk-upload-endpoint
  - id: x-chunk-headers
  any:
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  - id: tmp-chunk-upload
- id: applescript-outzip-curl-exfil
  desc: AppleScript /tmp/out.zip curl exfiltration
  crit: hostile
  conf: 0.96
  attack: T1041
  all:
  - id: curl-outzip-data-binary
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  any:
  - id: uuid-upload-header
  - id: user-upload-header
  - id: micro-behaviors/fs/path/temp::tmp-out-zip
- id: applescript-upload-php-exfil
  desc: AppleScript upload.php archive exfiltration
  crit: hostile
  conf: 0.95
  attack: T1041
  all:
  - id: curl-upload-php
  any:
  - id: micro-behaviors/fs/path/temp::tmp-out-zip
  - id: objectives/collection/archive/create::ditto-staging
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  - id: uuid-upload-header
- id: applescript-exfiltration
  desc: AppleScript staged archive exfiltration
  crit: suspicious
  conf: 0.95
  attack: T1041
  any:
  - id: applescript-profile-and-exfil
  - id: applescript-chunked-curl-exfil
  - id: applescript-direct-chunked-upload
  - id: applescript-outzip-curl-exfil
  - id: applescript-upload-php-exfil
  - id: applescript-buildid-databinary-exfil
  - id: objectives/exfiltration/stealer/sweep::applescript-grabber-zip-exfil
- id: applescript-buildid-databinary-exfil
  for: [applescript]
  desc: Campaign-tagged curl upload of collected data
  crit: hostile
  conf: 0.96
  attack: T1041
  # AMOS C2 protocol: a curl request carrying the `buildid:` campaign header that
  # binary-uploads a staged file. The buildid header + --data-binary file upload
  # + (POST or a hardcoded-IP endpoint) is the exf* leg, independent of whether
  # the archive is chunked or named out.zip.
  all:
  - id: micro-behaviors/communications/http/header/custom::build-id-header
  - id: micro-behaviors/communications/http/curl::curl-data-binary-file
  any:
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  - id: micro-behaviors/communications/ip/literal::http-ip-url
