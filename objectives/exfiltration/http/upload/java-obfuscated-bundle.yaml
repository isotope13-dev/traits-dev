defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [jar, zip]
  attack: T1041

composite_rules:
  - id: obfuscated-java-database-upload-bundle
    desc: Obfuscated Java archive bundles database and HTTP upload stacks
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::java-archive-lookalike-class-tree
      - id: metadata/package/dependencies/archive::bundled-okhttp-multipart
      - id: metadata/package/dependencies/archive::bundled-xerial-sqlite-jdbc
