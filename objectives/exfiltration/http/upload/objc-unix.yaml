defaults:
  platforms: [unix]
  for: [objc, elf]
  attack: T1041

traits:
  - id: objc-libcurl-agent-header
    desc: ObjC libcurl agent header
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: "X-Source: agent"

composite_rules:
  - id: objc-libcurl-agent-upload
    desc: ObjC libcurl agent upload
    crit: hostile
    conf: 0.98
    all:
      - id: objc-libcurl-agent-header
      - id: micro-behaviors/communications/http/request/body::objc-libcurl-postfields
      - id: micro-behaviors/communications/http/header/content-type::image-ppm-content-type
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-easy-perform
