# Browser recording applications can legitimately capture or upload media.
# Requiring the capture source, MediaRecorder output handler, WebM multipart
# field, and POST body in one local region identifies the surveillance-style
# capture-and-forward implementation without relying on lure prose or brands.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: mediarecorder-before-network-sink
    desc: MediaRecorder precedes network transmission
    crit: component
    conf: 0.94
    if:
      type: text
      regex: 'MediaRecorder[\s\S]{0,700}(fetch|XMLHttpRequest|WebSocket)'

  - id: media-recording-upload-route
    desc: Media recording upload route
    crit: component
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '^/([A-Za-z0-9_-]+/){0,4}(upload|recording)$'

  - id: html-media-recording-upload-route
    desc: HTML media recording upload route
    crit: component
    conf: 0.94
    for: [html]
    if:
      type: text
      regex: '["''`]/((\$\{[A-Za-z_$][\w$]*\}|[A-Za-z0-9_-]+)/){0,4}(upload|recording)["''`]'

composite_rules:
  - id: mediarecorder-upload-loop
    desc: MediaRecorder output is sent to an upload or recording endpoint
    crit: suspicious
    conf: 0.94
    attack: T1041
    mbc: B0028
    near_bytes: 1200
    all:
      - id: mediarecorder-before-network-sink
    any:
      - id: media-recording-upload-route
      - id: html-media-recording-upload-route

  - id: browser-av-recording-form-upload
    desc: Browser camera and microphone recording is uploaded as WebM form data
    crit: suspicious
    conf: 0.96
    attack: T1125,T1123,T1041
    mbc: B0028
    all:
      - id: micro-behaviors/hardware/display/camera::browser-media-capture-api
      - id: micro-behaviors/hardware/display/record::media-stream-recorder
      - id: micro-behaviors/hardware/display/record::media-recorder-data-handler
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/communications/http/upload::media-webm-form-field
    any:
      - id: micro-behaviors/communications/http/post::js-fetch-post-body-variable
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_bytes: 4096
