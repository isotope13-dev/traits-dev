defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041
traits:
  - id: credential-var-in-dict
    desc: Credential variable used in dictionary
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["''](password|token|secret|key)["'']\s*:\s*\$'
  - id: github-cli-download-auth-token-fragment
    desc: "GitHub CLI download authz header fragment"
    crit: component
    conf: 0.8
    if:
      type: text
      substr: 'GH_CLI_DOWNLOAD_LINK=$(curl -H "Authorization:token $GITHUB_TOKEN"'
  - id: cicd-release-script-b64encode-marker
    desc: CI release script base64 encoding marker
    crit: component
    conf: 0.8
    if:
      type: text
      substr: "base64.b64encode((Path(__file__).parent / 'scripts' / 'cicd-release.sh')"
  - id: python-request-headers-json-field
    desc: JSON payload includes copied request headers
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: '"requestHeaders": dict(request.headers)'
composite_rules:
  - id: python-source-upload-to-transform-service
    desc: Sends local Python source to a remote transform service
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    mbc: E1005
    all:
      - id: micro-behaviors/fs/read/file::file-open-content
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
      - id: micro-behaviors/communications/http/url/domain::workers-dev-domain
      - id: micro-behaviors/communications/http/url/path::code-transform-endpoint-path
  - id: official-llm-provider-authenticated-request
    desc: Official LLM provider authenticated request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/llm::llm-official-provider-api-call
    any:
      - id: micro-behaviors/communications/http/headers::authorization-header-map-entry
      - id: micro-behaviors/communications/http/headers::x-api-key-header-map-entry
  - id: hashicorp-infra-api-authenticated-request
    desc: Authenticated HashiCorp infrastructure API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/hashicorp::hashicorp-infra-api-token-auth
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
  - id: browser-use-cloud-authenticated-api
    desc: Browser Use Cloud authenticated API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-cloud-api
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-api-key-header
  - id: aws-shared-credentials-http-exfil
    desc: AWS shared credentials exfiltrated over HTTP
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/cloud/aws-token::python-aws-shared-credentials-file-access
      - id: micro-behaviors/communications/http/client/library::urllib-request
  - id: python-targz-requests-post
    desc: Python script uploading tar.gz archive via requests
    crit: hostile
    conf: 0.98
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness::python-info-test-path
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    any:
      - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
      - id: micro-behaviors/data/archive/create/tar::python-gzip-tar-archive
  - id: python-header-archive-post
    desc: Python base64 POST with archive filename header
    crit: hostile
    conf: 0.98
    unless:
      - id: github-cli-download-auth-token-fragment
      - id: cicd-release-script-b64encode-marker
      - id: official-llm-provider-authenticated-request
      # Documentation / fixture hosts (.invalid, .example, .test) are not live
      # exfil destinations — examples that POST placeholder bytes there must
      # not convict as hostile upload.
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
    all:
      - id: micro-behaviors/communications/http/headers::python-payload-header-map
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/data/encode/base64::b64encode-call
    any:
      - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
      - id: micro-behaviors/data/compress/library::gzip-compress-call
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
      - id: metadata/file/extension/identity::archive-extension-reference
    near_bytes: 512
  - id: python-sui-wallet-targz-github-upload
    desc: Python steals Sui wallets and uploads tar.gz to GitHub API
    crit: hostile
    conf: 0.99
    attack: T1003,T1041,T1195.002
    for: [python, python_bytecode, pyc, whl, archives]
    scope: archive
    all:
      - id: objectives/credential-access/wallet/blockchain::sui-wallet-keystore-path-ref
      - id: micro-behaviors/communications/http/services/github::github-rest-json-accept-header
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/os/env/vars/cicd::multi-ci-provider-env-refs
  - id: python-copied-request-headers-remote-post
    desc: Python POSTs copied HTTP request headers remotely
    crit: hostile
    conf: 0.97
    for: [python, whl, zip, archives]
    # HTTP client libraries commonly copy request headers for compatibility
    # wrappers and also contain unrelated POST helpers. Keep the hostile
    # conclusion within one source file and ignore bundled dependency files;
    # package-root code remains eligible for this behavior.
    scope: file
    unless:
      - id: metadata/package/files/dependency::bundled-python-library-path
    all:
      - id: python-request-headers-json-field
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
  - id: python-middleware-request-header-export
    desc: Web middleware serializes request headers for upload
    crit: hostile
    conf: 0.97
    attack: T1041,T1552
    for: [python, whl, zip, archives]
    scope: archive
    all:
      - id: python-request-headers-json-field
      - id: micro-behaviors/communications/http/headers::python-request-header-map-copy
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
