defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041
composite_rules:
  - id: python-collects-shell-history-ssh-and-uploads-archive
    desc: Python archives shell history and SSH files for IP upload
    crit: hostile
    conf: 0.999
    attack: T1005,T1041,T1105,T1195.002
    scope: outer
    for: [python, python-sdist, whl, zip]
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/upload/file::curl-file-upload-option
      - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/fs/read/file/history::shell-history-path-near-file-read
      - id: micro-behaviors/fs/path/credential/ssh::ssh-directory-literal
      - id: micro-behaviors/fs/read/file/target::git-config-file-read
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: python-audit-hook-basic-auth-send
    desc: Audit hook sends with HTTP basic auth
    crit: hostile
    conf: 0.96
    attack: T1041,T1071.001
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/python::python-addaudithook
      - id: micro-behaviors/communications/http/basic-auth::python-http-basic-auth-handler
  - id: official-llm-provider-authenticated-request
    desc: Official LLM provider authenticated request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-official-provider-api-call
    any:
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
      - id: micro-behaviors/communications/http/authorization-header::x-api-key-header-map-entry
  # A multi-provider LLM backend module authenticates each request with the
  # key as the provider's own header: an OpenAI-compatible bearer header beside
  # the chat-completions path, or the x-api-key header beside the
  # anthropic-version header the Anthropic API requires. The provider base URL
  # often lives in a config module, so the official-provider rule above never
  # sees both in one file; these pair what the request module does show.
  - id: llm-chat-completions-bearer-request
    for: [python]
    desc: Bearer-authenticated chat completions request
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
  # Speech-to-text clients post the recording to /audio/transcriptions with
  # the same bearer header. The key authenticates that request.
  - id: openai-audio-transcriptions-bearer-request
    for: [python]
    desc: Bearer-authenticated audio transcriptions request
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-audio-transcriptions-path
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
  - id: anthropic-messages-api-key-request
    for: [python]
    desc: x-api-key request with anthropic-version header
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/authorization-header::x-api-key-header-map-entry
      - id: micro-behaviors/communications/http/authorization-header::anthropic-version-header-map-entry
  - id: hashicorp-infra-api-authenticated-request
    for: [python]
    desc: Authenticated HashiCorp infrastructure API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/hashicorp::hashicorp-infra-api-token-auth
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: browser-use-cloud-authenticated-api
    for: [python]
    desc: Browser Use Cloud authenticated API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-cloud-api
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-api-key-header

  # A Python client that posts a local file as multipart form data to a
  # public tunnel host. The tunnel subdomain is throwaway, so the endpoint is
  # the operator's, not a service's. A developer demo can do the same, so the
  # file-level pairing is only suspicious; the fixed key below makes it hostile.
  - id: python-files-upload-ephemeral-tunnel
    desc: Python posts files to an ephemeral tunnel host
    for: [python]
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/communications/http/form::multipart-file-field-disposition
      - id: well-known/dual-use/tunnel/ephemeral-host::ephemeral-tunnel-host-literal
    near_bytes: 1500

  # The same upload carries a fixed group key in its form data. A collector
  # that ships to a shared tunnel endpoint with one embedded key is a drop
  # point, not a service the user chose. Keep the key literal in the same file
  # and near the upload so unrelated config does not qualify.
  # Worked example: bhp_pro 1.7.3 bhp_pro.py upload_file() posts crawl output
  # to a telebit tunnel with api_key "GROUP_USERS" after each batch.
  - id: python-files-upload-ephemeral-tunnel-fixed-key
    desc: Python uploads collected files to tunnel with fixed key
    for: [python]
    crit: hostile
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/communications/http/form::multipart-file-field-disposition
      - id: well-known/dual-use/tunnel/ephemeral-host::ephemeral-tunnel-host-literal
      - id: micro-behaviors/communications/http/auth::python-api-key-literal
    near_bytes: 1500
