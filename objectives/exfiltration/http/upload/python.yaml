defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041
traits:
  - id: python-request-headers-json-field
    desc: JSON payload includes copied request headers
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: '"requestHeaders": dict(request.headers)'
composite_rules:
  - id: python-audit-hook-basic-auth-send
    desc: Audit hook sends with HTTP basic auth
    crit: hostile
    conf: 0.96
    attack: T1041,T1071.001
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/python::python-addaudithook
      - id: micro-behaviors/communications/http/authorization-header::python-http-basic-auth-handler
  - id: official-llm-provider-authenticated-request
    desc: Official LLM provider authenticated request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-official-provider-api-call
    any:
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
      - id: micro-behaviors/communications/http/authorization-header::x-api-key-header-map-entry
  - id: hashicorp-infra-api-authenticated-request
    for: [python]
    desc: Authenticated HashiCorp infrastructure API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/hashicorp::hashicorp-infra-api-token-auth
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: browser-use-cloud-authenticated-api
    for: [python]
    desc: Browser Use Cloud authenticated API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-cloud-api
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-api-key-header
  - id: python-header-archive-post
    for: [python]
    desc: Python base64 POST with archive filename header
    crit: hostile
    conf: 0.98
    unless:
      - id: micro-behaviors/communications/http/authorization-header::github-cli-download-auth-token-fragment
      - id: micro-behaviors/data/encode/base64::cicd-release-script-b64encode-marker
      - id: official-llm-provider-authenticated-request
      # Documentation / fixture hosts (.invalid, .example, .test) are not live
      # exfil destinations — examples that POST placeholder bytes there must
      # not convict as hostile upload.
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
    all:
      - id: micro-behaviors/communications/http/header/custom::python-payload-header-map
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/data/encode/base64::b64encode-call
    any:
      - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
      - id: micro-behaviors/data/compress/gzip::gzip-compress-call
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
      - id: metadata/file/extension/identity::archive-extension-reference
    near_bytes: 512
  - id: python-copied-request-headers-remote-post
    desc: Python POSTs copied HTTP request headers remotely
    crit: hostile
    conf: 0.97
    for: [python]
    # HTTP client libraries commonly copy request headers for compatibility
    # wrappers and also contain unrelated POST helpers. Keep the hostile
    # conclusion within one source file and ignore bundled dependency files;
    # package-root code remains eligible for this behavior.
    scope: file
    unless:
      - id: metadata/package/files/dependency::bundled-python-library-path
    all:
      - id: python-request-headers-json-field
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
  - id: python-middleware-request-header-export
    desc: Web middleware serializes request headers for upload
    crit: hostile
    conf: 0.97
    attack: T1041,T1552
    for: [python, whl, zip]
    scope: archive
    all:
      - id: python-request-headers-json-field
      - id: micro-behaviors/communications/http/header/custom::python-request-header-map-copy
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
