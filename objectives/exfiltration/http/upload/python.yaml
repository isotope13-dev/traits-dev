defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041
composite_rules:
  - id: python-audit-hook-basic-auth-send
    desc: Audit hook sends with HTTP basic auth
    crit: hostile
    conf: 0.96
    attack: T1041,T1071.001
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/python::python-addaudithook
      - id: micro-behaviors/communications/http/basic-auth::python-http-basic-auth-handler
  - id: official-llm-provider-authenticated-request
    desc: Official LLM provider authenticated request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-official-provider-api-call
    any:
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
      - id: micro-behaviors/communications/http/authorization-header::x-api-key-header-map-entry
  # A multi-provider LLM backend module authenticates each request with the
  # key as the provider's own header: an OpenAI-compatible bearer header beside
  # the chat-completions path, or the x-api-key header beside the
  # anthropic-version header the Anthropic API requires. The provider base URL
  # often lives in a config module, so the official-provider rule above never
  # sees both in one file; these pair what the request module does show.
  - id: llm-chat-completions-bearer-request
    for: [python]
    desc: Bearer-authenticated chat completions request
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
  # Speech-to-text clients post the recording to /audio/transcriptions with
  # the same bearer header. The key authenticates that request.
  - id: openai-audio-transcriptions-bearer-request
    for: [python]
    desc: Bearer-authenticated audio transcriptions request
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-audio-transcriptions-path
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
  - id: anthropic-messages-api-key-request
    for: [python]
    desc: x-api-key request with anthropic-version header
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/authorization-header::x-api-key-header-map-entry
      - id: micro-behaviors/communications/http/authorization-header::anthropic-version-header-map-entry
  - id: hashicorp-infra-api-authenticated-request
    for: [python]
    desc: Authenticated HashiCorp infrastructure API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/hashicorp::hashicorp-infra-api-token-auth
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: browser-use-cloud-authenticated-api
    for: [python]
    desc: Browser Use Cloud authenticated API request
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-cloud-api
      - id: micro-behaviors/communications/http/services/browser-use::browser-use-api-key-header
