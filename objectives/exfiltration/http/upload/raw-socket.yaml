defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1132.001

composite_rules:
  - id: python-encoded-environment-raw-http-exfil
    desc: Python encodes environment then raw HTTP exfil
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/proc/info/path::process-self-environ
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/communications/socket/dial::python-dial
      - id: micro-behaviors/communications/socket/send::python-sendall
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
    near_bytes: 4096
