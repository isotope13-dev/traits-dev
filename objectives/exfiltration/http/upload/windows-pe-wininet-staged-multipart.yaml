defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: staged-multipart-wininet-upload
    desc: Staged multipart upload over WinInet
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
      - id: micro-behaviors/communications/http/header/custom::file-upload-headers
    any:
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/os/network/interface::get-adapters-info
      - id: micro-behaviors/process/create/exec::cmd-shell-via-createprocess
      - id: micro-behaviors/communications/http/post::post-string-pe
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
  - id: mime-php-exfil
    desc: MIME base64 attachment posts to a PHP gate
    crit: hostile
    conf: 0.94
    attack: T1048.003,T1071.001
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/email/mime::mime-base64-attachment
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
