defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

traits:
  - id: x-upload-mode-header
    desc: X-*-Upload mode declaration header
    crit: notable
    conf: 0.9
    if:
      type: text
      # Stealer kits announce their channel (`X-Stealer-Upload: true`);
      # ordinary uploaders do not declare an upload mode header.
      regex: '(?i)\bX-[A-Za-z]{2,24}-Upload\s*:\s*true\b'
  - id: client-machine-id-header
    desc: Client machine identity header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bX-(Machine-ID|MachineId|HWID|Device-ID)\s*:'
composite_rules:
  - id: staged-multipart-wininet-upload
    desc: Staged multipart upload over WinInet
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
      - id: micro-behaviors/communications/http/form::multipart-header-context
    any:
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/network/interface::get-adapters-info
      - id: micro-behaviors/process/create/exec::cmd-shell-via-createprocess
      - id: micro-behaviors/communications/http/post::native-post-method-token
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
  - id: mime-php-exfil
    desc: MIME base64 attachment posts to a PHP gate
    crit: hostile
    conf: 0.94
    attack: T1048.003,T1071.001
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/email/mime::mime-base64-transfer-encoding
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    any:
      - id: micro-behaviors/data/format/mime::mime-content-disposition
      - id: micro-behaviors/communications/email/mime::mime-executable-filename
      - id: micro-behaviors/communications/email/mime::mime-msdownload-content-type
    unless:
      - id: metadata/signed/platform/
  - id: pe-stealer-upload-marker-channel
    desc: PE posts to stealer upload marker channel
    crit: hostile
    conf: 0.95
    attack: T1041,T1071.001
    # A declared `X-*-Upload: true` mode header plus a machine-identity
    # header on a POST is the stealer kit channel shape; ordinary uploaders
    # do not announce an upload mode.
    all:
      - id: x-upload-mode-header
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: client-machine-id-header
    unless:
      - id: metadata/signed/platform/
