defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

traits:
composite_rules:
  - id: mime-php-exfil
    desc: MIME base64 attachment posts to a PHP gate
    crit: hostile
    conf: 0.94
    attack: T1048.003,T1071.001
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/email/mime::mime-base64-transfer-encoding
      - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-binary
    any:
      - id: micro-behaviors/data/format/mime::mime-content-disposition
      - id: micro-behaviors/communications/email/mime::mime-executable-filename
      - id: micro-behaviors/data/format/mime::windows-executable-media-type
