defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  attack: T1041,T1071.001

composite_rules:
  # The `/router` URL atom is a neutral endpoint-path fact and lives in
  # micro-behaviors/communications/http/endpoints; the credential-harvest leg
  # below is what makes the pair exfiltration.
  - id: credential-router-exfil
    desc: Credential harvest is sent to an HTTP router endpoint
    crit: hostile
    conf: 0.98
    attack: T1041,T1071.001,T1552.001
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/path::router-endpoint-url
    any:
      - id: objectives/supply-chain/credential-theft/env::javascript-filtered-environment-exfil
      - id: objectives/exfiltration/stealer/credential/env::python-environ-json-requests-exfil
