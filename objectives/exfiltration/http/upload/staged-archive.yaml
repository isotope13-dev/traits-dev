# Archive staging and HTTP upload with campaign-specific branding removed.
# The article's Python stealer combines a collected ZIP, a PHP upload route,
# and a product-like User-Agent or temporary lockfile. These are structural
# signals; the campaign's name, domain, and filenames remain IOC data only.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1041
traits:
  - id: windows-archive-output-path
    desc: Windows path to staged archive
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)[A-Za-z]:[\\/][^"\r\n]{1,180}\.(zip|7z|rar)\b'
  - id: unix-archive-output-path
    desc: Unix temporary path to staged archive
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)[\\/](tmp|temp)[\\/][^"\r\n]{1,180}\.(zip|7z|rar)\b'
  - id: temporary-lockfile-path
    desc: Temporary lockfile path
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)(%TEMP%|\bTEMP\b|[\\/](temp|tmp)[\\/])[^"\r\n]{0,120}\.lock\b'
  - id: application-user-agent-header
    desc: Application-specific HTTP User-Agent header
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)["'']User-Agent["'']\s*:\s*["''][A-Za-z][A-Za-z0-9._-]{2,40}/[0-9]+(\.[0-9]+){0,3}["'']'
  - id: script-upload-endpoint
    desc: HTTP upload endpoint path
    crit: suspicious
    conf: 0.88
    if:
      type: literal
      kind: string
      regex: '(?i)https?://[^\s"''<>]{1,180}/upload[^\s"''<>]{0,40}\.php([?#]|$)'

composite_rules:
  - id: windows-staged-archive-http-upload
    desc: Windows staged archive sent to an HTTP upload endpoint
    crit: hostile
    conf: 0.97
    attack: T1041,T1560.001
    all:
      - id: script-upload-endpoint
      - id: windows-archive-output-path
    any:
      - id: application-user-agent-header
      - id: temporary-lockfile-path
  - id: unix-staged-archive-http-upload
    desc: Unix staged archive sent to an HTTP upload endpoint
    crit: hostile
    conf: 0.97
    attack: T1041,T1560.001
    all:
      - id: script-upload-endpoint
      - id: unix-archive-output-path
    any:
      - id: application-user-agent-header
      - id: temporary-lockfile-path
