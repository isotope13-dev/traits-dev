# Archive staging and HTTP upload with campaign-specific branding removed.
# The article's Python stealer combines a collected ZIP, a PHP upload route,
# and a product-like User-Agent or temporary lockfile. These are structural
# signals; the campaign's name, domain, and filenames remain IOC data only.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1041
composite_rules:
  - id: windows-staged-archive-http-upload
    desc: Windows staged archive sent to an HTTP upload endpoint
    crit: hostile
    conf: 0.97
    attack: T1041,T1560.001
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::php-upload-endpoint-url
      - id: micro-behaviors/fs/path/archive::windows-archive-path
    any:
      - id: micro-behaviors/communications/http/header/custom::application-user-agent
      - id: micro-behaviors/fs/path/temp::temporary-lockfile-path
  - id: unix-staged-archive-http-upload
    desc: Unix staged archive sent to an HTTP upload endpoint
    crit: hostile
    conf: 0.97
    attack: T1041,T1560.001
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::php-upload-endpoint-url
      - id: micro-behaviors/fs/path/archive::unix-temp-archive-path
    any:
      - id: micro-behaviors/communications/http/header/custom::application-user-agent
      - id: micro-behaviors/fs/path/temp::temporary-lockfile-path
