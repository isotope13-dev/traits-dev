defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: detached-script-stage-chunked-upload
    desc: Detached script loader uploads archive chunks
    crit: hostile
    conf: 0.97
    attack: T1041,T1059.002
    all:
      - id: objectives/command-and-control/dropper/script-eval/remote-code::daemonized-remote-script-loader
      - id: micro-behaviors/communications/http/upload::curl-data-binary-stdin
      - id: micro-behaviors/communications/http/url/query::upload-id-param
      - id: micro-behaviors/communications/http/url/query::chunk-index-param
      - id: micro-behaviors/communications/http/url/query::total-chunks-param
      - id: micro-behaviors/fs/path/temp::tmp-zip-path
