defaults:
  platforms: [unix]
  for: [java, class, jar]
  attack: T1041

composite_rules:
  - id: java-http-data-exfiltration
    for: [class, java, jar, tar]
    desc: Java HTTP data exfiltration
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/telemetry::jvm-collect-path
    any:
      - id: micro-behaviors/communications/http/post::octet-stream-body-write
      - id: micro-behaviors/communications/http/url/telemetry::java-collect-chunk-parameter
      - id: micro-behaviors/communications/http/url/telemetry::java-collect-upload-path
      - id: objectives/credential-access/theft/multi-store::java-db-and-secret-harvest
      - id: objectives/credential-access/theft/multi-store::java-sensitive-file-harvest
      - id: micro-behaviors/communications/http/post::jvm-http-body-write-source
    needs: 1
    unless:
      - id: well-known/app/infrastructure/logstash::logstash-container-archive
