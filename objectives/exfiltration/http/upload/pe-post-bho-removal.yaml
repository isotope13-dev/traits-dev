defaults:
  attack: T1041
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: post-exfil-c2-bho-removal
    desc: POST exfil with C2 URL and BHO removal
    # Exfil channel plus competitor-kill in one carrier: a URL-encoded POST
    # template aimed at an embedded C2 URL beside a forced wipe of the
    # shared Browser Helper Objects key.
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
      - id: micro-behaviors/communications/http/post::form-urlencoded-post-template
      - id: micro-behaviors/os/registry/delete::bho-delete-command
    unless:
      - id: metadata/signed/platform/
