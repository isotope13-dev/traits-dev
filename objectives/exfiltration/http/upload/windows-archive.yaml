# Windows archive-to-HTTP exfiltration.  The article's specific aircraft-data
# name and endpoint are not part of the rule: the reusable behavior is to
# package local data, Base64-wrap the resulting file, and send it in an HTTP
# POST body.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1560.001,T1041,T1132.001

composite_rules:
  - id: windows-archive-create
    desc: Windows command creates a data archive
    crit: notable
    conf: 0.92
    any:
      - id: objectives/collection/archive/compress::powershell-compress-archive
      - id: micro-behaviors/data/archive/create/utility::makecab-create

  - id: windows-file-base64-encode
    desc: Windows command Base64-encodes data
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/data/encode/command::certutil-base64-encode-command
      - id: micro-behaviors/data/encode/base64::to-base64-string

  - id: windows-encoded-archive-http-exfil
    desc: Windows archives data, Base64-encodes it, and posts it over HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: windows-archive-create
      - id: windows-file-base64-encode
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::windows-http-post-body
    near_lines: 40
