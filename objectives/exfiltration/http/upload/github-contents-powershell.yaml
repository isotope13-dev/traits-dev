# PowerShell system inventory sent through the GitHub Contents API.
# The report content, repository, and token are intentionally not part of the
# signature; the behavior is the collection-plus-write flow.
# ATT&CK: T1005, T1041, T1567.001
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1005,T1041,T1567.001

composite_rules:
  - id: powershell-github-contents-system-report
    desc: PowerShell uploads host inventory to GitHub
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
      - id: micro-behaviors/os/wmi/query::query-os-info
      - id: micro-behaviors/process/lifecycle/supervise::watchdog-powershell-query
      - id: micro-behaviors/data/encode/base64::to-base64-string
      - id: micro-behaviors/fs/write/file/direct::out-file
    near_bytes: 4096
