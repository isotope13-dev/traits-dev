defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  attack: T1082,T1041
  mbc: B0030

# These observations co-occur in one file (including recovered native strings).
# They do not bind the profiler output to the uploaded file, establish a
# repeating beacon, or identify the endpoint as a reusable command channel.
# Admission comes from the required password-phishing file-upload behavior.
composite_rules:
- id: password-phishing-upload-with-system-profiling
  desc: Phishing file upload beside system profiling
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/exfiltration/http/upload::applescript-buildid-databinary-exfil
  any:
  - id: micro-behaviors/os/sysinfo/hardware::system-profiler-summary
  - id: micro-behaviors/os/sysinfo/hardware::system-profiler-uuid
