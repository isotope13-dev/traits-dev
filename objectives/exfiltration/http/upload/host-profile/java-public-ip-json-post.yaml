# A JVM class that looks up the host's public address and builds a JSON POST
# is reporting where the machine is. Telemetry clients do this too, so the
# claim stays suspicious; a known application identity can raise it. The rule
# does not require TLS verification to be disabled or the destination to be
# external -- those were never part of the matcher.
defaults:
  for: [java_class]
  platforms: [unix, windows]
  attack: T1071.001,T1016.001

composite_rules:
  - id: java-public-ip-json-post
    desc: Java class looks up its public IP and builds a JSON POST
    crit: suspicious
    conf: 0.9
    mbc: B0030
    scope: file
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/request/json::java-json-post
