defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1041,T1195.002

composite_rules:
  - id: dotnet-enrolled-device-app-file-upload
    desc: .NET library uploads application files alongside MAC and login enrollment
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: objectives/supply-chain/trojanized/library/remote-control::http-login-username-query-param
      - id: objectives/supply-chain/trojanized/library/remote-control::http-login-password-query-param
      - id: objectives/supply-chain/trojanized/library/remote-control::http-device-mac-query-field
      - id: objectives/supply-chain/trojanized/library/remote-control::http-app-file-upload-api-path
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member

  - id: native-jni-minecraft-session-xor-c2-upload
    desc: Fabric mod native DLL harvests Minecraft session and profile name for XOR C2
    crit: hostile
    conf: 0.98
    attack: T1528,T1041,T1071.001
    for: [jar, zip, pe, dll]
    scope: archive
    all:
      - id: metadata/package/config/manifest::fabric-mod-metadata
      - id: metadata/binary/symbols/plugin::jni-onload-export
      - id: objectives/credential-access/gaming/minecraft::native-minecraft-profile-name-xor-exfil
      - id: well-known/lib/network/curl::embedded-schannel-backend

