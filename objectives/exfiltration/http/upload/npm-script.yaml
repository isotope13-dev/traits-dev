# An npm script handing curl a local file to send (`-d @/path`,
# `-F f=@/path`, `-T @/path`).
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-script-curl-file-upload
    desc: npm script uploads local file with curl
    crit: suspicious
    conf: 0.9
    attack: T1041
    if:
      type: value
      path: scripts.*
      regex: '\bcurl\b.{0,200}@/|@/.{0,200}\bcurl\b'
