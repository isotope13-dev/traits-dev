defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [powershell]
  attack: T1041

traits:
  - id: powershell-base64-archive-body
    desc: PowerShell base64 archive body
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Compress-Archive[\s\S]{0,420}ToBase64String'

composite_rules:
  - id: ps-zip-body-upload
    desc: PowerShell ZIP body upload
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/header/content-type::zip-content-type
      - id: micro-behaviors/fs/read/file/target::ps-read-zip-variable
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-param

  - id: powershell-base64-archive-http-exfil
    desc: PowerShell base64 archive HTTP exfil
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-base64-archive-body
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-name
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-post-method
