defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1041

traits:
  - id: ps-read-zip-variable
    desc: PowerShell reads ZIP variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)ReadAllBytes\(\$(zip|archive)[A-Za-z_]*\)'
    unless:
      - id: well-known/app/system/sysmanage::agent-package-context
      - id: well-known/app/system/sysmanage::windows-installer-script-path

composite_rules:
  - id: ps-zip-body-upload
    desc: PowerShell ZIP body upload
    crit: suspicious
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/header/content-type::zip-content-type
      - id: ps-read-zip-variable
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-param
