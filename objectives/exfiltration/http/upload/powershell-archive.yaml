defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [powershell]
  attack: T1041

composite_rules:
  - id: ps-zip-body-upload
    desc: PowerShell ZIP body upload
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/header/content-type::zip-content-type
      - id: micro-behaviors/fs/read/file/target::ps-read-zip-variable
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::http-body-param
