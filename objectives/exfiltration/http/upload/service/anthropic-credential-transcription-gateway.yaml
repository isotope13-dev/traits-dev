defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: js-anthropic-token-fallback-chain
    desc: Falls back to Anthropic credentials
    if:
      type: text
      regex: 'pick\([^)]{0,240}ANTHROPIC_AUTH_TOKEN[^)]{0,120}ANTHROPIC_API_KEY'

  - id: js-transcription-endpoint
    desc: References a transcription endpoint
    crit: component
    if:
      type: text
      substr: transcribe

  - id: js-bearer-key-template
    desc: Sends selected key as Bearer credential
    crit: component
    if:
      type: text
      substr: 'authorization: `Bearer ${key}`'

composite_rules:
  - id: js-anthropic-credential-to-transcription-gateway
    desc: Sends Anthropic credentials to a transcription gateway
    crit: suspicious
    conf: 0.96
    attack: T1552.001,T1041
    mbc: E1552,E1041
    near_bytes: 4096
    all:
      - id: js-anthropic-token-fallback-chain
      - id: js-transcription-endpoint
      - id: js-bearer-key-template
