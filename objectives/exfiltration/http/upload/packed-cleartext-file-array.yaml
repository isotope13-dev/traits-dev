# A UPX-packed PE that posts a multipart file array over plain HTTP hides
# what it uploads and sends it unprotected. Packing plus cleartext upload
# is worth triage; it does not by itself show theft.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1048.003,T1027.002
composite_rules:
  - id: upx-packed-cleartext-multipart-file-upload
    desc: UPX binary uploads file array over cleartext HTTP
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
  - id: cleartext-multipart-mutation-slot-pe-exfil
    desc: PE uploads a mutation-slot multipart copy over cleartext HTTP
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/os/api-resolution/dynamic::get-module-filename-a-resolved-name
    any:
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker-rsrc
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
