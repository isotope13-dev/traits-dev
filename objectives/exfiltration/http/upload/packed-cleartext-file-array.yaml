# A UPX-packed PE that posts a multipart file array over plain HTTP hides
# what it uploads and sends it unprotected. Packing plus cleartext upload
# is worth triage; it does not by itself show theft.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1048.003,T1027.002
composite_rules:
  - id: upx-packed-cleartext-multipart-file-upload
    desc: UPX binary uploads file array over cleartext HTTP
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
  # The same packed multipart upload, but the destination is the
  # Snojan Rifaien collection endpoint and the packed image carries
  # that family's banner: this is the self-upload carrier, not a
  # generic packed application sending a form.
  - id: snojan-rifaien-cleartext-self-upload
    desc: Snojan carrier uploads itself over cleartext HTTP
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
  # Unpacked variant of the same carrier: no UPX sections, but the
  # multipart file-array upload still goes to the Snojan collection
  # endpoint over cleartext HTTP through libcurl.
  - id: snojan-cleartext-multipart-self-upload
    desc: Snojan carrier uploads file array over cleartext HTTP
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
