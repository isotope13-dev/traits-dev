defaults:
  platforms: [unix]
  for: [package.json]
  attack: T1005,T1041,T1195.002

traits:
  - id: npm-postinstall-ctf-grep-pipe
    desc: Pipes challenge flag search into curl
    crit: notable
    if:
      type: value
      path: scripts.postinstall
      regex: 'grep\s+-r\s+["''][A-Za-z]{2,8}\{["'']\s+/[^|]{1,80}\|\s*curl\s+'

composite_rules:
  - id: npm-postinstall-ctf-grep-exfil
    desc: Posts challenge flag search at installation
    crit: hostile
    conf: 0.99
    all:
      - id: npm-postinstall-ctf-grep-pipe
      - id: micro-behaviors/communications/http/curl/body::curl-stdin-body-post
