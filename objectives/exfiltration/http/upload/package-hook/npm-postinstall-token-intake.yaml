# A postinstall hook that delivers its payload to a token-addressed intake
# endpoint: the URL path carries an unguessable receiver token, so the drop
# needs no account and attributes to nobody. That is the anonymous-dropbox
# semantic (Discord webhooks are the known-host instance; the intake-token
# atom covers the unknown-host rest). Auto-execution at install time plus an
# account-less receiver plus an uploaded request body is the install-time
# stealer shape. Benign install pings report to authenticated vendor APIs,
# never to a path-token drop, so the token leg is what keeps this hostile.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1041,T1195.002
  mbc: E1041

composite_rules:
  # A package's install hook and unrelated application networking can coexist
  # in one archive. First require the tokenized receiver and body send in one
  # source file, then join that behavior to the package install hook.
  - id: node-tokenized-receiver-body
    desc: Node sends a body to a tokenized intake path
    crit: suspicious
    conf: 0.94
    scope: file
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/url/resource-path/collection::receiver-style-long-segment
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-end-body

  - id: npm-postinstall-token-intake-upload
    desc: npm postinstall uploads to token-addressed intake endpoint
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: node-tokenized-receiver-body
