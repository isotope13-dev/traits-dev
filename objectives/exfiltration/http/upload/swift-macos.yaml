defaults:
  platforms: [unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-http-collect-upload
    desc: Swift HTTP collect upload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/telemetry::swift-collect-endpoint-literal
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method

  - id: swift-shadow-collect-upload
    desc: Uploads shadow and SSH secrets
    crit: hostile
    conf: 0.97
    all:
      - id: swift-http-collect-upload
      - id: micro-behaviors/fs/path/account-db::unix-shadow-root-ssh-paths
      - id: objectives/credential-access/shell/history::shell-history-file-reference

  - id: swift-key-collect-upload
    desc: Uploads collected SSH authorized keys
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/url/telemetry::swift-collect-endpoint-literal
      - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
