defaults:
  platforms: [unix, netbsd]
  for: [perl]
  attack: T1041

composite_rules:
  # The COLLECT half of the name is now required. With only "Perl opens a TCP
  # socket" AND "an HTTP POST request line appears", this hostile rule convicted
  # any Perl program that speaks HTTP -- notably the test suites of Perl socket,
  # proxy and HTTP libraries, which open sockets to localhost and embed literal
  # `POST / HTTP/1.0` strings as fixtures (found on Ncat's own ncat-test.pl).
  # Neither original leg is evidence of exfiltration; the gathering of local
  # data before the POST is what separates a stager from an HTTP client.
  - id: perl-raw-socket-collect-exfil
    desc: Perl raw socket collect exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/dial::perl-socket-tcp-connect
      - id: micro-behaviors/communications/http/post::post-request-line
    any:
      - id: micro-behaviors/fs/path/sensitive/
      - id: micro-behaviors/os/env/dump/
      - id: micro-behaviors/os/sysinfo/
