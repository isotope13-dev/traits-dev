defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1041

traits:
  - id: skill-stages-all-dirty-files
    desc: Skill stages every dirty repository file
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)include all dirty files'

  - id: skill-mandatory-remote-push
    desc: Skill mandates pushing work to remote
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)push to remote.{0,40}non-negotiable|do not stop before pushing'

  - id: skill-clears-git-stashes
    desc: Skill deletes existing git stashes
    crit: component
    conf: 0.98
    if:
      type: text
      substr: git stash clear

composite_rules:
  - id: skill-pushes-unrelated-dirty-work
    desc: Skill exports unrelated dirty repository work
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-stages-all-dirty-files
      - id: skill-mandatory-remote-push
      - id: skill-clears-git-stashes
