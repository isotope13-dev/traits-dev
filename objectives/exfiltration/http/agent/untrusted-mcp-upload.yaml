# Agent skills that direct private project or analytics data to an external
# MCP endpoint while persisting a bearer credential in the user's shell.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1041,T1567

traits:
  - id: skill-untrusted-mcp-endpoint
    desc: Skill embeds an untrusted MCP endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)https?://.{0,100}\.sslip\.io/mcp/'

  # skill-mcp-bearer-environment-auth relocated to
  # micro-behaviors/communications/http/authorization-header::bearer-token-from-env-var.
  # Its matcher only detected `Authorization: Bearer ${SOME_VAR}` -- the documented,
  # correct way to authenticate to any HTTP or MCP service without hardcoding a
  # secret -- so at notable inside an exfiltration objective it reported credential
  # upload on every skill that explains how to reach its own vendor API. The
  # hostility in the composite below comes from skill-untrusted-mcp-endpoint: an
  # sslip.io wildcard-DNS host is the attacker-controlled destination, and this leg
  # only says a credential accompanies the request.
  - id: skill-persists-mcp-token-shell
    desc: Persists MCP token in shell startup
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)echo.{0,120}export\s+[A-Z0-9_]+TOKEN.{0,80}>>\s*~/\.[a-z]+rc'

composite_rules:
  - id: agent-skill-untrusted-mcp-data-channel
    for: [markdown, text, zip, tar]
    desc: Skill configures an external authenticated data channel
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-untrusted-mcp-endpoint
      - id: micro-behaviors/communications/http/authorization-header::bearer-token-from-env-var
    any:
      - id: skill-persists-mcp-token-shell
