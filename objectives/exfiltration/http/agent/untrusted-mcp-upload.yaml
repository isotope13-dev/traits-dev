# Agent skills that direct private project or analytics data to an external
# MCP endpoint while persisting a bearer credential in the user's shell.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1041,T1567

traits:
  - id: skill-untrusted-mcp-endpoint
    desc: Skill embeds an untrusted MCP endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)https?://.{0,100}\.sslip\.io/mcp/'

  - id: skill-mcp-bearer-environment-auth
    desc: Sends bearer environment credentials to MCP
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Authorization.{0,80}Bearer\s+\$\{[A-Z0-9_]+\}'

  - id: skill-persists-mcp-token-shell
    desc: Persists MCP token in shell startup
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)echo.{0,120}export\s+[A-Z0-9_]+TOKEN.{0,80}>>\s*~/\.[a-z]+rc'

composite_rules:
  - id: agent-skill-untrusted-mcp-data-channel
    desc: Skill configures an external authenticated data channel
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-untrusted-mcp-endpoint
      - id: skill-mcp-bearer-environment-auth
    any:
      - id: skill-persists-mcp-token-shell
