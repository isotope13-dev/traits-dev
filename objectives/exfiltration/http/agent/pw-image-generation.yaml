# Image helper that reads local API secrets and uploads user images to public
# image hosts as a fallback.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, typescript, javascript]
  attack: T1041,T1567

traits:
  - id: image-skill-reads-secrets-file
    desc: Image skill reads local secrets file
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: config/secrets.md

  - id: image-skill-public-upload-host
    desc: Uploads files to public image host
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)(sm\.ms/api/v2/upload|freeimage\.host/api/1/upload)'

  - id: image-skill-hardcoded-upload-key
    desc: Image skill embeds upload service key
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '6d207e02198a847aa98d0a2a901485a5'

composite_rules:
  - id: agent-skill-public-image-exfiltration
    desc: Agent skill uploads local images to public host
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: image-skill-reads-secrets-file
      - id: image-skill-public-upload-host
      - id: image-skill-hardcoded-upload-key
