# Agent-mediated HTTP exfiltration.  AI agents can retrieve local information,
# invoke tools and APIs, and send the result to another service. These rules
# detect that combination in prompt-bearing content without naming a vendor,
# endpoint, or language.
defaults:
  platforms: [unix, windows]
  for: [scripts, html, markdown, text, json, go, rust]
  attack: T1041

traits:
  - id: llm-ai-agent-target
    desc: AI agent target phrase
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(tell|ask|instruct) (the )?AI agent\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-mcp-agent-target
    desc: MCP tool used for data access
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(call|use|invoke) (the )?MCP tool to (read|send)\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-agent-read-before-export
    desc: Sensitive data read before remote export
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(read|extract)\b.{0,48}\b(secret|token)\b.{0,48}\b(send|upload)\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: metadata/package/testing/harness/runtime/

  - id: llm-agent-read-before-forward
    desc: Sensitive data read before forwarding
    crit: notable
    conf: 0.92
    if:
      type: text
      # Exclude security-fix prose such as "post-realpath sensitive recheck".
      regex: '(?i)\b(read|extract)\b.{0,48}\b(secret|token)\b.{0,48}\b(post|forward)\b($|[^-])'
    unless:
      - id: well-known/app/ai/aui-agent-builder/

  - id: llm-sensitive-path-env
    desc: Environment path; agent context required
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])\.env(\b|[/\\])'
    not:
      - regex: '\.env/lib/'
    unless:
      - id: well-known/app/ai/aui-agent-builder/

  # Only export verbs: "read the token …" is ordinary prose that appears in
  # doc comments of any credential-handling code ("Read the token currently
  # installed for a provider"). The read-then-export chain is already covered
  # by llm-agent-read-before-export / -forward above.
  - id: llm-sensitive-term-secret
    desc: Instruction to send a secret or token
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(send|upload|forward) the (secret|token)\b'
    not:
      # Blockchain and API docs discuss forwarding token contracts or metadata,
      # not exfiltrating secrets to a remote agent.
      - regex: '(?i)\btoken contract'
    unless:
      - id: aui-agent-builder-package-context
      - id: well-known/app/ai/insforge-agent-skills::insforge-agent-skills-context

  - id: llm-sensitive-term-credential
    desc: Credential export instruction phrase
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(read|send|upload) (the )?credentials? to\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-http-destination
    desc: Remote HTTP destination
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(send|upload|post) (the )?data to https?://[^\s"''<>]{3,}'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-http-url-export-destination
    desc: Sensitive data sent to remote URL
    crit: notable
    conf: 0.92
    if:
      type: text
      # Require a whitespace-separated verb so hyphenated cmdlets like
      # Send-Token do not satisfy send+token on one identifier.
      regex: '(?i)\b(send|upload)\s.{0,48}\b(secret|token)\b.{0,48}https?://[^\s"''<>]{3,}'
    unless:
      - id: well-known/app/ai/aui-agent-builder/

  - id: llm-http-post-url-export-destination
    desc: Sensitive data posted to remote URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(post|forward)\b.{0,48}\b(secret|token)\b.{0,48}https?://[^\s"''<>]{3,}'
    unless:
      - id: well-known/app/ai/aui-agent-builder/

  - id: llm-tool-context-before
    desc: Agent context before webhook tool call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(MCP|agent|assistant|tool)\b.{0,48}\b(call|send) the (webhook|http_request)\b'
    not:
      - regex: '(?i)call the webhook interface'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-tool-context-after
    desc: Agent context after webhook tool call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(call|send) the (webhook|http_request)\b.{0,48}\b(MCP|agent|assistant|tool)\b'
    not:
      - regex: '(?i)call the webhook interface'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-bare-http-request-call
    desc: Direct http_request tool call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bcall http_request\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-forwarding-batch-result-verb
    desc: Forwards every or each tool result
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(forward|send|post)s?\b\s+(every|each)\s+tool[-_ ]result\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/

  - id: llm-forwarding-batch-output-verb
    desc: Forwards every or each tool output
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(forward|send|post)s?\b\s+(every|each)\s+tool[-_ ]output\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/

  - id: llm-autonomous-word
    desc: Autonomous operation word
    # The word alone is common in legitimate agent and automation software.
    # It remains a component for the composite below, which requires the
    # separate agent, forwarding, and remote-destination behaviors.
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bautonomously\b'
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/app/ai/aui-agent-builder/

  # The three `prohibitive-*` atoms moved to micro-behaviors/data/llm/
  # approval-policy.yaml: they match a safety guideline ("never act without
  # user approval"), which is the opposite of this file's objective, and here
  # they inherited its `attack: T1041`. The exception composite below still
  # assembles them, cross-directory.

  - id: llm-no-human-consent
    desc: Agent action bypasses human consent
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # A benchmark prompt can describe an unrelated botnet or other threat
      # without user consent.  Require an agent subject so that this atom
      # represents agent behavior rather than a phrase in threat-model data.
      regex: '(?i)\b(agent|assistant|model)\b[^\n]{0,160}\bwithout (human|user) consent\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: well-known/tool/detection/agent-audit-kit::scanner-context

  - id: llm-no-human-permission
    desc: Agent proceeds without user permission
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Require an explicit agent subject.  A bare permission phrase also
      # appears in ordinary safety guidance, for example "Do NOT auto-push
      # without user permission".
      regex: '(?i)\b(agent|assistant|model)\b.{0,40}\bwithout (human|user) permission\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: prohibitive-no-permission-guideline-context

  - id: python-environment-url-config
    desc: Python environment URL configuration
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: os.environ.get

  - id: python-agent-context-field
    desc: Python agent context field
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: rag_context

composite_rules:
  - id: llm-tool-destination
    desc: Remote tool destination marker
    crit: notable
    conf: 0.94
    any:
      - id: llm-tool-context-before
      - id: llm-tool-context-after
      - id: llm-bare-http-request-call

  - id: llm-sensitive-path-aws
    desc: Agent code opens AWS shared credentials path
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: well-known/tool/detection/vtk/
      - id: metadata/library/cloud-sdk::aws-python-sdk-source

  - id: prohibitive-no-permission-guideline-context
    desc: Prohibits acting without user permission
    crit: exception
    conf: 0.98
    any:
      - id: micro-behaviors/data/llm::prohibitive-dont-without-permission
      - id: micro-behaviors/data/llm::prohibitive-do-not-without-permission
      - id: micro-behaviors/data/llm::prohibitive-never-without-permission

  - id: aui-agent-builder-package-context
    desc: Recognized AUI Agent Builder package
    crit: exception
    conf: 0.99
    for: [scripts, source, manifests, data, markdown]
    scope: outer
    any:
      - id: well-known/app/ai/aui-agent-builder::package-name
      - id: well-known/app/ai/aui-agent-builder::package-member-context
      - id: well-known/app/ai/aui-agent-builder::source-archive-path

  - id: llm-agent-target
    desc: AI agent or MCP target
    crit: notable
    conf: 0.92
    any:
      - id: llm-ai-agent-target
      - id: llm-mcp-agent-target

  - id: llm-agent-env-path-target
    desc: AI agent targets .env path
    crit: notable
    conf: 0.95
    all:
      - id: llm-agent-target
      - id: llm-sensitive-path-env
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context

  - id: llm-agent-account-db-path-target
    desc: AI agent targets Unix account database path
    crit: notable
    conf: 0.95
    all:
      - id: llm-agent-target
      - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context

  - id: llm-sensitive-data-target
    desc: Agent sensitive-data target
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context
    any:
      - id: llm-sensitive-path-aws
      # Account DB and bare `.env` are ubiquitous outside agents; require an
      # AI-agent signal (same pattern as llm-agent-env-path-target).
      - id: llm-agent-account-db-path-target
      - id: llm-agent-env-path-target
      - id: llm-sensitive-term-secret
      - id: llm-sensitive-term-credential

  - id: llm-remote-tool-destination
    desc: Remote API or tool destination
    crit: notable
    conf: 0.94
    any:
      - id: llm-http-destination
      - id: llm-http-url-export-destination
      - id: llm-http-post-url-export-destination
      - id: llm-tool-destination

  - id: llm-agent-sensitive-network-export
    desc: AI agent exports sensitive data remotely
    crit: hostile
    conf: 0.99
    all:
      - id: llm-agent-target
      - id: llm-sensitive-data-target
      - id: llm-remote-tool-destination
    any:
      - id: micro-behaviors/data/llm::sensitive-data-collection-phrase
      - id: micro-behaviors/data/llm::sensitive-data-forwarding-phrase
      - id: micro-behaviors/data/llm::sensitive-item-transmission-phrase
      - id: llm-agent-read-before-export
      - id: llm-agent-read-before-forward
    needs: 1
    near_bytes: 1400
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: python-hidden-key-agent-export
    desc: Python agent exports context with hidden API key
    crit: hostile
    conf: 0.99
    attack: "T1027,T1552.001,T1041"
    mbc: "B0032,E1014,E1041"
    for: [python]
    all:
      - id: python-environment-url-config
      - id: python-agent-context-field
      - id: micro-behaviors/communications/http/request/client::python-request-data-argument
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/fs/path/sensitive/credentials::dotenv-filename-literal
      - id: objectives/credential-access/env/secrets/filtered-access::python-obfuscated-api-credential

  - id: llm-agent-http-tool-forwarding
    desc: Agent forwards tool results over HTTP
    crit: suspicious
    conf: 0.98
    all:
      - id: llm-agent-target
      - id: micro-behaviors/data/llm::tool-result-marker
    any:
      - id: micro-behaviors/data/llm::tool-result-forwarding-phrase
      - id: llm-forwarding-batch-result-verb
      - id: llm-forwarding-batch-output-verb
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: llm-remote-tool-destination
    needs: 2
    near_bytes: 1400
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/app/ai/aui-agent-builder/

  - id: llm-autonomous-api-abuse
    desc: Autonomous agent forwards tool activity
    crit: suspicious
    conf: 0.98
    all:
      - id: llm-agent-target
      - id: micro-behaviors/data/llm::tool-result-forwarding-phrase
      - id: micro-behaviors/data/llm::tool-result-marker
      - id: llm-remote-tool-destination
    any:
      - id: llm-autonomous-word
      - id: objectives/evasion/security-bypass/llm/override::llm-no-human-approval
      - id: llm-no-human-consent
      - id: llm-no-human-permission
      - id: micro-behaviors/data/llm::no-user-question-directive
    needs: 1
    near_bytes: 1400
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
