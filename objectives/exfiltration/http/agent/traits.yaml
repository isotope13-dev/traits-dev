# Agent-mediated HTTP exfiltration.  AI agents can retrieve local information,
# invoke tools and APIs, and send the result to another service. These rules
# detect that combination in prompt-bearing content without naming a vendor,
# endpoint, or language.
defaults:
  platforms: [unix, windows]
  for: [scripts, html, markdown, text, json, go, rust]
  attack: T1041

traits:
  - id: llm-ai-agent-target
    desc: AI agent target phrase
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(tell|ask|instruct) (the )?AI agent\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-mcp-agent-target
    desc: MCP tool used for data access
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(call|use|invoke) (the )?MCP tool to (read|send)\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-agent-export-verb-a
    desc: Agent data collection verb
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(read|collect|extract) (the )?sensitive (data|file)\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-agent-export-verb-b
    desc: Agent data forwarding verb
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(include|send|upload) (the )?(sensitive|secret) data\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-agent-export-verb-c
    desc: Agent sensitive transmission verb
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(transmit|post|forward) (the )?(sensitive|secret)\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-agent-read-before-export
    desc: Sensitive data read before remote export
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(read|extract)\b.{0,48}\b(secret|token)\b.{0,48}\b(send|upload)\b'
    unless:
      - id: well-known/app/aui-agent-builder/
      - id: metadata/package/testing/harness/runtime/

  - id: llm-agent-read-before-forward
    desc: Sensitive data read before forwarding
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(read|extract)\b.{0,48}\b(secret|token)\b.{0,48}\b(post|forward)\b'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-sensitive-path-aws
    desc: AWS credential path target
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)~?[/\\]\.aws[/\\]credentials'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-sensitive-path-system
    desc: Unix account database target
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\]etc[/\\](shadow|passwd)\b'
    unless:
      - id: well-known/app/aui-agent-builder/
      - id: metadata/package/testing/presence/harness::python-test-file

  - id: llm-sensitive-path-env
    desc: Environment path; agent context required
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])\.env(\b|[/\\])'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-sensitive-term-secret
    desc: Secret or token target
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(read|send|upload) the (secret|token)\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-sensitive-term-credential
    desc: Credential export instruction phrase
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(read|send|upload) (the )?credentials? to\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-http-destination
    desc: Remote HTTP destination
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(send|upload|post) (the )?data to https?://[^\s"''<>]{3,}'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-http-url-export-destination
    desc: Sensitive data sent to remote URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(send|upload)\b.{0,48}\b(secret|token)\b.{0,48}https?://[^\s"''<>]{3,}'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-http-post-url-export-destination
    desc: Sensitive data posted to remote URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(post|forward)\b.{0,48}\b(secret|token)\b.{0,48}https?://[^\s"''<>]{3,}'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-tool-destination
    desc: Remote tool destination marker
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(call|send) (the )?(webhook|http_request)\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-remote-api-destination
    desc: Remote API destination marker
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bremote API\b'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-forwarding-verb
    desc: Tool-result forwarding verb
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(forward|send|post) (the )?tool[-_ ](result|output)\b'
    unless:
      - id: aui-agent-builder-package-context

  - id: llm-forwarding-batch-result-verb
    desc: Forwards every or each tool result
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(forward|send|post)s?\b\s+(every|each)\s+tool[-_ ]result\b'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-forwarding-batch-output-verb
    desc: Forwards every or each tool output
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(forward|send|post)s?\b\s+(every|each)\s+tool[-_ ]output\b'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-autonomous-word
    desc: Autonomous operation word
    # The word alone is common in legitimate agent and automation software.
    # It remains a component for the composite below, which requires the
    # separate agent, forwarding, and remote-destination behaviors.
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bautonomously\b'
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/app/aui-agent-builder/

  - id: llm-no-human-approval
    desc: Agent bypasses human approval
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bwithout (human|user) approval\b'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: llm-no-human-consent
    desc: Agent action bypasses human consent
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # A benchmark prompt can describe an unrelated botnet or other threat
      # without user consent.  Require an agent subject so that this atom
      # represents agent behavior rather than a phrase in threat-model data.
      regex: '(?i)\b(agent|assistant|model)\b[^\n]{0,160}\bwithout (human|user) consent\b'
    unless:
      - id: well-known/app/aui-agent-builder/
      - id: metadata/package/quality/false-positives::agent-audit-kit-scanner-context

  - id: llm-no-human-permission
    desc: Agent bypasses user permission
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bwithout (human|user) permission\b'
    unless:
      - id: well-known/app/aui-agent-builder/

  - id: python-environment-url-config
    desc: Python environment URL configuration
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: os.environ.get

  - id: python-agent-context-field
    desc: Python agent context field
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: rag_context

composite_rules:
  - id: aui-agent-builder-package-context
    desc: Recognized AUI Agent Builder package
    crit: exception
    conf: 0.99
    for: [scripts, source, manifests, data, markdown]
    scope: outer
    any:
      - id: well-known/app/aui-agent-builder::package-name
      - id: well-known/app/aui-agent-builder::package-member-context
      - id: well-known/app/aui-agent-builder::source-archive-path

  - id: llm-agent-target
    desc: AI agent or MCP target
    crit: notable
    conf: 0.92
    any:
      - id: llm-ai-agent-target
      - id: llm-mcp-agent-target

  - id: llm-agent-export-verb
    desc: Agent data export verb
    crit: notable
    conf: 0.92
    any:
      - id: llm-agent-export-verb-a
      - id: llm-agent-export-verb-b
      - id: llm-agent-export-verb-c

  - id: llm-sensitive-data-target
    desc: Agent sensitive-data target
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/quality/false-positives::stacksjs-stx-framework-context
    any:
      - id: llm-sensitive-path-aws
      - id: llm-sensitive-path-system
      - id: llm-sensitive-path-env
      - id: llm-sensitive-term-secret
      - id: llm-sensitive-term-credential

  - id: llm-remote-tool-destination
    desc: Remote API or tool destination
    crit: notable
    conf: 0.94
    any:
      - id: llm-http-destination
      - id: llm-http-url-export-destination
      - id: llm-http-post-url-export-destination
      - id: llm-tool-destination
      - id: llm-remote-api-destination

  - id: llm-agent-sensitive-network-export
    desc: AI agent exports sensitive data remotely
    crit: hostile
    conf: 0.99
    all:
      - id: llm-agent-target
      - id: llm-sensitive-data-target
      - id: llm-remote-tool-destination
    any:
      - id: llm-agent-export-verb
      - id: llm-agent-read-before-export
      - id: llm-agent-read-before-forward
    needs: 1
    near_bytes: 1400
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: python-hidden-key-agent-export
    desc: Python agent exports context with hidden API key
    crit: hostile
    conf: 0.99
    attack: "T1027,T1552.001,T1041"
    mbc: "B0032,E1014,E1041"
    for: [python]
    all:
      - id: python-environment-url-config
      - id: python-agent-context-field
      - id: micro-behaviors/communications/http/request/client::python-request-data-argument
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/fs/path/sensitive/credentials::dotenv-filename-literal
      - id: objectives/credential-access/env/secrets/filtered-access::python-obfuscated-api-credential

  - id: llm-agent-http-tool-forwarding
    desc: Agent forwards tool results over HTTP
    crit: suspicious
    conf: 0.98
    all:
      - id: llm-agent-target
      - id: micro-behaviors/data/llm::tool-result-object-marker
    any:
      - id: llm-forwarding-verb
      - id: llm-forwarding-batch-result-verb
      - id: llm-forwarding-batch-output-verb
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: llm-remote-tool-destination
    needs: 2
    near_bytes: 1400
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/app/aui-agent-builder/

  - id: llm-autonomous-api-abuse
    desc: Autonomous agent forwards tool activity
    crit: suspicious
    conf: 0.98
    all:
      - id: llm-agent-target
      - id: llm-forwarding-verb
      - id: micro-behaviors/data/llm::tool-result-object-marker
      - id: llm-remote-tool-destination
    any:
      - id: llm-autonomous-word
      - id: llm-no-human-approval
      - id: llm-no-human-consent
      - id: llm-no-human-permission
      - id: micro-behaviors/data/llm::no-user-question-directive
    needs: 1
    near_bytes: 1400
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
