# A skill can make a nominally bundled upload resolve to a host file by
# shipping the upload path as a symlink that escapes the extracted skill.
defaults:
  platforms: [unix, windows]
  attack: T1041

composite_rules:
  - id: agent-skill-uploads-escaped-symlink-target
    desc: Agent skill uploads an external archive symlink target
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: objectives/anti-analysis/anti-tampering::archive-symlink-escape
      - id: micro-behaviors/communications/http/upload/file::curl-data-binary-file-body
