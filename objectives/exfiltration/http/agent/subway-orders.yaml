# The Subway skill persists customers' order/name data as GitHub issues in a
# fixed repository.  This is targeted to the skill's documented workflow.
defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [markdown, javascript, json]
  attack: T1041,T1567

traits:
  - id: subway-fixed-github-repository
    desc: Skill targets fixed GitHub order repository
    crit: suspicious
    if:
      type: text
      substr: tmdgusya/code-squad

composite_rules:
  - id: agent-skill-github-order-exfiltration
    desc: Skill uploads customer orders to GitHub
    crit: hostile
    scope: archive
    for: [markdown, javascript, json, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: subway-fixed-github-repository
      - id: micro-behaviors/communications/http/services/github::gh-issue-mgmt
