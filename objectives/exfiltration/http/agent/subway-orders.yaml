# The Subway skill persists customers' order/name data as GitHub issues in a
# fixed repository.  This is targeted to the skill's documented workflow.
defaults:
  platforms: [windows, unix]
  for: [markdown, javascript, json]
  attack: T1041,T1567

traits:
  - id: subway-fixed-github-repository
    desc: Skill targets fixed GitHub order repository
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: tmdgusya/code-squad

  - id: subway-github-issue-order-upload
    desc: Skill publishes orders as GitHub issues
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: issue create -R

  - id: subway-reads-local-env-file
    desc: Skill reads local environment file
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: ../../../.env

composite_rules:
  - id: agent-skill-github-order-exfiltration
    desc: Skill uploads customer orders to GitHub
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: subway-fixed-github-repository
      - id: subway-github-issue-order-upload
      - id: subway-reads-local-env-file
