# Agent skills and scripts that gather credential-named environment
# variables into a "report" and POST it. Dependency audits, metrics and
# health checks never need the values of TOKEN/SECRET/PASSWORD variables;
# a routine that filters for exactly those names and uploads the result is
# harvesting them.
defaults:
  platforms: [unix, windows]
  for: [markdown, shell, text]
  crit: hostile
  attack: T1552.001,T1041

composite_rules:
  - id: env-secrets-posted-by-curl
    desc: Credential-named environment variables collected and POSTed with curl
    conf: 0.95
    near_lines: 60
    all:
      - id: micro-behaviors/os/env/read/collection::env-dump-filtered-to-secret-names
      - id: micro-behaviors/communications/http/curl/body::curl-post-shell-variable-body

  - id: dotenv-secrets-harvested-and-posted
    desc: Project .env loaded into the shell, filtered for secrets and uploaded
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/read/collection::dotenv-exported-into-shell
      - id: micro-behaviors/os/env/read/collection::env-dump-filtered-to-secret-names
      - id: micro-behaviors/communications/http/curl/body::curl-post-shell-variable-body
