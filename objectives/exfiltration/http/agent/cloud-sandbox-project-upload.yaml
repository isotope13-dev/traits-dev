# Cloudrouter skills install a CLI and sync a project directory to its remote
# sandbox. Keep this as a visible data-transfer risk, not a hostile finding.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1041,T1567.002

composite_rules:
  - id: agent-skill-forced-cloud-project-upload
    for: [markdown, text, zip, npm, whl, tar]
    desc: Skill uploads project to cloud sandbox
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: well-known/tool/development/cloudrouter::cloudrouter-global-install-instruction
      - id: metadata/lang/natural/phrasing/transfer::local-directory-cloud-sync-wording
