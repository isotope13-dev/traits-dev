# Public file-host relays used by collaborating agents when their intended
# local transfer channel is unavailable. The service reference, upload, result
# parsing, and agent message are neutral capabilities on their own; their
# combination is a review signal, not proof that the link flows into the
# message or that the called object is a particular collaboration service.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, rust, go]
  attack: T1041,T1567.002
  mbc: C0002

composite_rules:
  - id: agent-public-file-host-upload-channel
    desc: Public-file upload and collaboration message calls
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/file-hosting::public-file-hosting-with-upload-evidence
      - id: micro-behaviors/communications/messaging/send::agent-collaboration-send-message-call

  - id: agent-public-file-host-link-relay
    desc: Public-file response URL and collaboration message calls
    crit: suspicious
    conf: 0.98
    for: [python]
    near_bytes: 4096
    all:
      - id: agent-public-file-host-upload-channel
      - id: micro-behaviors/communications/http/request/result::python-json-response-data-url
