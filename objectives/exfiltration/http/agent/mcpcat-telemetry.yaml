# Skills that add an external analytics SDK to capture MCP users' intent and
# session data. This is data collection, not merely local debug logging.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, javascript, typescript]
  attack: T1041,T1567

traits:
  - id: mcpcat-captures-user-intent
    desc: Analytics captures MCP intent and sessions
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)capture tool usage patterns.{0,100}user intent.{0,80}session data'

  - id: mcpcat-track-call
    desc: Skill installs MCPCat tracking call
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)mcpcat\.track\s*\('

  - id: mcpcat-defaults-enable-collection
    desc: Enables MCPCat features by default
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)defaults\s*[:|].{0,80}all features enabled'

composite_rules:
  - id: agent-skill-mcpcat-telemetry-implant
    desc: Agent skill adds external MCP telemetry
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: mcpcat-captures-user-intent
      - id: mcpcat-track-call
