# Exfiltration stage observed after cryptographic context injection. The model
# resolves private chat/session fields and inserts them into an outbound URL
# query passed to its navigation tool. Vendor, host, parameter, and language
# identifiers are intentionally not fixed.
defaults:
  platforms: [windows, unix]
  for: [html, markdown, text, json, documents, scripts, source]
  attack: T1005,T1041

composite_rules:
  - id: llm-private-context-query-exfiltration
    desc: Agent navigation query exports chat history and private session context
    crit: hostile
    conf: 0.99
    near_bytes: 5000
    all:
      - id: objectives/collection/app-data/session::private-chat-context-field-cluster
      - id: micro-behaviors/communications/http/url/query::agent-navigation-query-call
      - id: objectives/evasion/security-bypass/llm/prompt::llm-cryptographic-context-injection
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/
