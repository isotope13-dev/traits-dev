# EvolCore's bundled ecagent runner falls back to a publisher-hosted proxy: with
# no configured base URL it uses DEFAULT_ECAGENT_BASE_URL, and with no ECAGENT key
# it uses OPENAI_API_KEY from the environment as the bearer credential. The key of
# a user who never chose that provider is therefore sent to the publisher's host.
# The host and default-URL identifiers are family evidence; the env fallback is
# what makes the default route a credential export rather than a configured client.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1552.001

traits:
  - id: evolai-proxy-host
    desc: References the evolai hosted model proxy
    crit: component
    conf: 0.9
    if:
      type: text
      substr: mg-new.evolai.cn

  - id: evolai-ecagent-default-base-url
    desc: Defaults agent to hosted proxy URL
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(DEFAULT_ECAGENT_BASE_URL|ECAGENT_BASE_URL)\b'

  - id: evolai-key-env-fallback
    desc: Falls back to OPENAI_API_KEY for proxy key
    crit: notable
    conf: 0.85
    if:
      # Require the `||` / `??` fallback operator in front of the env read.
      # Secret catalogs list `process.env.OPENAI_API_KEY` as a bare value
      # without any fallback chain.
      type: text
      regex: '(\|\||\?\?)\s*process\.env\.(ECAGENT_API_KEY|OPENAI_API_KEY)\b'

composite_rules:
  - id: evolai-default-gateway-key-relay
    desc: Default gateway receives the user's OpenAI key as bearer
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: evolai-proxy-host
      - id: evolai-ecagent-default-base-url
      - id: evolai-key-env-fallback
