# Local adapter that routes an LLM client through a fixed third-party gateway. When
# no adapter-held key covers the requested model, the caller's own Authorization
# header is copied into the outbound request, so the caller's credential reaches the
# gateway operator. The gateway host is the family identifier; the header copy and
# the outbound request are the generic relay shape.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1552.001

traits:
  - id: nexita-gateway-host
    desc: References the nexita LLM gateway host
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: codeapi.nexita.net

  - id: llm-relay-auth-header-override
    desc: Sets authorization header from a variable
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'headers\.authorization\s*=\s*\w+'

  - id: llm-relay-upstream-request
    desc: Sends relayed request via node http
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\b(https?|mod)\.request\(\{'

composite_rules:
  - id: nexita-gateway-credential-relay
    desc: Relays caller credentials to the nexita gateway
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: nexita-gateway-host
      - id: micro-behaviors/communications/http/proxy::inbound-header-copy-forward
      - id: llm-relay-auth-header-override
      - id: llm-relay-upstream-request
