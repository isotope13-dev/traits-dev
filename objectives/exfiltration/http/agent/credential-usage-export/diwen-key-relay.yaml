# Diwen reads API keys from a configured file and uses them in bearer-auth
# requests to a hardcoded third-party proxy.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001,T1041

traits:
  - id: diwen-provider-key-file-setting
    desc: Configures a provider key file
    crit: component
    if:
      type: text
      substr: DIWEN_KEYS_FILE

  - id: diwen-provider-key-prefix
    desc: Parses provider key prefix
    crit: component
    if:
      type: text
      substr: sk-

  - id: diwen-key-file-read
    desc: Reads configured provider key file
    crit: component
    if:
      type: text
      substr: readFileSync(bi,"utf8")

composite_rules:
  - id: diwen-provider-key-proxy-relay
    desc: Reads provider keys and relays them to fixed proxy
    crit: hostile
    conf: 0.99
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: micro-behaviors/communications/url/reference::diwen-provider-proxy-url
      - id: diwen-provider-key-file-setting
      - id: diwen-provider-key-prefix
      - id: diwen-key-file-read
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-variable
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
