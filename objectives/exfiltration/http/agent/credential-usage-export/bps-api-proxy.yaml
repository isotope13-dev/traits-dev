defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: bps-api-url-rewritten-to-publisher-proxy
    desc: Rewrites BPS API URL to proxy base
    crit: suspicious
    if:
      type: text
      regex: 'url\.replace\(["'']https://webapi\.bps\.go\.id/v1["''],\s*proxyBase\)'
  - id: bps-publisher-proxy-endpoint
    desc: References publisher BPS API proxy
    crit: component
    if:
      type: text
      regex: '["'']https://bps-api\.murphi\.my\.id/v1["'']'
  - id: bps-api-key-query-parameter
    desc: Returns BPS API key query parameter
    crit: notable
    if:
      type: text
      regex: 'return\s*\{\s*key:\s*this\.apiKey\s*\}'
  - id: bps-request-merges-auth-parameters
    desc: Merges authentication into BPS request
    crit: notable
    if:
      type: text
      regex: 'const allParams\s*=\s*\{\s*\.\.\.baseParams,\s*\.\.\.auth\s*\}'
  - id: bps-auth-params-added-to-request
    desc: Adds BPS auth parameters to request
    crit: notable
    if:
      type: text
      regex: 'const auth\s*=\s*await this\.authParams\(\)'
  - id: bps-default-publisher-worker
    desc: Uses publisher hosted worker by default
    crit: suspicious
    if:
      type: text
      regex: 'DEFAULT_WORKER_URL\s*=\s*["'']https://bps-mcp-server\.murphi\.my\.id["'']'
  - id: bps-worker-url-defaults-to-publisher
    desc: Defaults worker URL to publisher host
    crit: notable
    if:
      type: text
      regex: 'BPS_WORKER_URL\s*\|\|\s*DEFAULT_WORKER_URL'
  - id: bps-key-sent-in-worker-header
    desc: Sends BPS key in custom header
    crit: notable
    if:
      type: text
      regex: '["'']x-bps-api-key["'']:\s*this\.apiKey'
  - id: bps-learned-entry-post-body
    desc: Serializes learned key and value
    crit: component
    if:
      type: text
      regex: 'JSON\.stringify\(\{\s*key,\s*value\s*\}\)'

composite_rules:
  # Keep the route rewrite and authenticated URL construction in the same
  # source file; this avoids unrelated archive members satisfying each leg.
  - id: bps-auth-routed-to-publisher-proxy
    desc: Routes BPS request auth to publisher proxy
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: bps-api-url-rewritten-to-publisher-proxy
      - id: bps-publisher-proxy-endpoint
      - id: bps-request-merges-auth-parameters
      - id: bps-auth-params-added-to-request

  # Older releases also enabled learned-data sync to the publisher by default.
  - id: learned-mappings-and-bps-key-sent-to-default-worker
    desc: Default sync sends BPS key, learned data
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: bps-default-publisher-worker
      - id: bps-worker-url-defaults-to-publisher
      - id: bps-key-sent-in-worker-header
      - id: bps-learned-entry-post-body
