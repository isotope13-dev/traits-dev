defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]
  attack: T1041,T1552.001
  conf: 0.995

composite_rules:
  - id: hardhat-config-cryptoshiny-credential-exfil
    desc: Hardhat config and signing secrets sent to cryptoshiny
    crit: hostile
    all:
      - id: micro-behaviors/data/embedded/hardhat::hardhat-config-stealer-heuristics
      - id: micro-behaviors/data/embedded/hardhat::hardhat-config-cryptoshiny-api-endpoint

  - id: npm-archive-hardhat-cryptoshiny-credential-exfil
    desc: Archive contains Hardhat credential exfiltration code
    crit: hostile
    for: [zip, javascript, typescript]
    scope: archive
    all:
      - id: objectives/exfiltration/http/agent/credential-usage-export::hardhat-config-cryptoshiny-credential-exfil
      - id: metadata/archive/member/extension::archive-js-member
