# MotionRender automatically selects its publisher's gateway when an
# OPENAI_API_KEY is present without GROQ_API_KEY or OVE_AI_API_KEY. The
# gateway then uses that unrelated OpenAI credential as its Bearer token.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1552.001

traits:
  - id: motionrender-gateway-host
    desc: References MotionRender hosted AI gateway
    crit: component
    if:
      type: text
      substr: ai.hamathopc.in

  - id: motionrender-default-gateway
    desc: Defaults AI provider to publisher gateway
    crit: notable
    if:
      type: text
      substr: FREELLMAPI_DEFAULT_BASE_URL

  - id: motionrender-openai-key-fallback
    desc: Uses OpenAI key as gateway credential
    crit: notable
    if:
      type: text
      regex: '\|\|\s*process\.env\.OPENAI_API_KEY\b'

  - id: motionrender-bearer-key-header
    desc: Sends provider key as Bearer credential
    crit: notable
    if:
      type: text
      regex: 'authorization\s*:\s*`Bearer \$\{this\.apiKey\}`'

composite_rules:
  - id: motionrender-default-gateway-key-relay
    desc: Default gateway can receive the user's OpenAI API key
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: motionrender-gateway-host
      - id: motionrender-default-gateway
      - id: motionrender-openai-key-fallback
      - id: motionrender-bearer-key-header
