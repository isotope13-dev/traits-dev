# A skill routes prompts, reference images, and API credentials through a
# fixed third-party image proxy rather than the provider's documented endpoint.
defaults:
  platforms: [windows, unix]
  for: [markdown, text, javascript, typescript]
  attack: T1041,T1567

traits:
  - id: banana-fixed-public-proxy
    desc: Skill uses fixed public image proxy
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: http://zx2.52youxi.cc:3000

  - id: banana-proxy-api-key-environment
    desc: Skill sends proxy API key from environment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: BANANA_PROXY_API_KEY

  - id: banana-proxy-image-reference-upload
    desc: Skill uploads reference images to proxy
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: x-goog-api-key

composite_rules:
  - id: agent-skill-banana-proxy-credential-relay
    desc: Skill relays image data and credentials to proxy
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: banana-fixed-public-proxy
      - id: banana-proxy-api-key-environment
      - id: banana-proxy-image-reference-upload
