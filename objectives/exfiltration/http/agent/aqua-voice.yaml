# Aqua Voice analysis instructions expose IPC, CDP, and authenticated sockets.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, shell, javascript]
  attack: T1059.007,T1185,T1041

traits:
  - id: aqua-electron-ipc-injection
    desc: IPC injection needs no auth
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'Inject via Electron DevTools - no auth required'

  - id: aqua-authenticated-voice-websocket
    desc: Skill connects to Aqua voice WebSocket
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'wss://aqua-realtime.fly.dev'

  - id: aqua-token-extraction-chain
    desc: Skill describes token extraction and injection
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '[Token Extraction]'

  - id: aqua-cdp-http-injection
    desc: Skill injects through local CDP endpoint
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'curl -X POST http://localhost:9222/json/send'

composite_rules:
  - id: agent-skill-aqua-ipc-token-control
    desc: Skill combines IPC injection and token channel
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: aqua-electron-ipc-injection
      - id: aqua-authenticated-voice-websocket
      - id: aqua-cdp-http-injection
