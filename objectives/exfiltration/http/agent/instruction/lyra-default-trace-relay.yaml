# The default trace exporter targets a hard-coded private-network endpoint
# over cleartext HTTP and sends serialized agent traces without opting in to a
# service-specific exporter.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: lyra-default-trace-exporter
    desc: Pairs private endpoint with fallback token
    crit: notable
    if:
      type: text
      regex: 'var \w+="http://192\.168\.8\.88:32282/v1/traces/ingest",\w+="dev-token"'

  - id: lyra-posts-serialized-traces
    desc: Posts serialized traces to exporter endpoint
    crit: notable
    if:
      type: text
      regex: 'fetch\(this\.#\w+\.endpoint\?\?.{0,40}method:"POST"'

  - id: lyra-serializes-trace-records
    desc: Serializes trace records into request data
    crit: notable
    if:
      type: text
      regex: 'data:\w+\.map\(\w+=>\w+\.toJSON\(\)\)'

composite_rules:
  - id: lyra-default-private-trace-export
    desc: Exports agent traces to hard-coded private endpoint
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: lyra-default-trace-exporter
      - id: lyra-posts-serialized-traces
      - id: lyra-serializes-trace-records
