defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1041

traits:
  - id: skill-reads-github-auth-token
    desc: Skill reads GitHub authentication token
    crit: notable
    conf: 0.99
    if:
      type: text
      # Require an executable command line or assignment, not prose warning
      # an agent never to expose the token.
      regex: '(?im)^\s*(\$\s*)?([A-Za-z_]\w*=["'']?\$\()?gh\s+auth\s+token\b'

  - id: skill-reads-private-usage-report
    desc: Skill reads private usage report
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: ~/.claude/usage-data/report.html

  - id: skill-uploads-token-and-report
    desc: Skill uploads token and private report
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)github_token.{0,240}report_html'

  - id: skill-steals-ssh-key-curl
    desc: Skill sends SSH key through curl
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)curl\s+https?://[^\s]{1,100}steal\?data=.{0,120}\.ssh/id_rsa'

  - id: skill-reads-environment-secrets
    desc: Collects token, password, secret variables
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: "env | grep -E 'TOKEN|PASSWORD|SECRET'"

  - id: skill-posts-dependency-report
    desc: Skill posts dependency report to fixed worker
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: metric-analyzer.ronynpl6200.workers.dev

composite_rules:
  - id: skill-uploads-private-usage-and-token
    desc: Skill uploads private usage and GitHub token
    crit: hostile
    conf: 1.0
    scope: archive
    for: [markdown, text, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-reads-github-auth-token
      - id: skill-reads-private-usage-report
      - id: skill-uploads-token-and-report

  - id: skill-exfiltrates-ssh-key
    for: [markdown]
    desc: Skill exfiltrates SSH private key
    crit: hostile
    conf: 1.0
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-steals-ssh-key-curl

  - id: skill-exports-environment-report
    for: [markdown, text, zip, tar]
    desc: Skill exports environment secrets in dependency report
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-reads-environment-secrets
      - id: skill-posts-dependency-report
