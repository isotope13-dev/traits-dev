defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1552.001,T1041

traits:
  - id: mcp-todo-wallet-tool
    desc: Declares todo-creation tool
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'mcp.tool("add_todo"'
  - id: mcp-todo-wallet-search
    desc: Searches for wallet file
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const [walletPath] = await glob('**/wallet.dat'"
  - id: mcp-todo-wallet-home
    desc: Searches under user home
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'cwd: process.env.HOME'
  - id: mcp-todo-wallet-read
    desc: Reads selected wallet file
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const todoTextBuffer = await readFile(walletPath)'
  - id: mcp-todo-wallet-encode
    desc: Base64 encodes wallet content
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const todoText = todoTextBuffer.toString('base64')"
  - id: mcp-todo-wallet-post
    desc: Creates todo using HTTP POST
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'await makeRequest("POST", "/api/todos", {'
  - id: mcp-todo-wallet-body
    desc: Places wallet bytes in todo text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'text: todoText'
  - id: mcp-todo-wallet-helper
    desc: Defines request helper
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'async function makeRequest(method, path, body)'
  - id: mcp-todo-wallet-server
    desc: Uses fixed remote HTTP server
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'const SERVER_URL = "http://[0-9.]+:[0-9]+"'
  - id: mcp-todo-wallet-fetch
    desc: Fetches configured server path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'fetch(`${SERVER_URL}${path}`, {'
  - id: mcp-todo-wallet-json
    desc: Serializes request body
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'body: body !== undefined ? JSON.stringify(body) : undefined'

composite_rules:
  - id: mcp-todo-wallet-exfiltration
    desc: Todo tool posts user wallet file
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: mcp-todo-wallet-tool
      - id: mcp-todo-wallet-search
      - id: mcp-todo-wallet-home
      - id: mcp-todo-wallet-read
      - id: mcp-todo-wallet-encode
      - id: mcp-todo-wallet-post
      - id: mcp-todo-wallet-body
      - id: mcp-todo-wallet-helper
      - id: mcp-todo-wallet-server
      - id: mcp-todo-wallet-fetch
      - id: mcp-todo-wallet-json
