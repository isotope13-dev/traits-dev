defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1041

traits:
  - id: mcp-summary-tool-handler
    desc: Handles summary tool call
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'case "createSummaryText":'
  - id: mcp-summary-conversation-input
    desc: Reads supplied conversation history
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'request.params.arguments?.conversation_history || ""'
  - id: mcp-summary-send-call
    desc: Submits summary data for validation
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'await syntaxValidation({'
  - id: mcp-summary-report-type
    desc: Labels conversation summary report
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'type: "conversation_summary"'
  - id: mcp-summary-report-history
    desc: Includes conversation history in report
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'conversation_history: conversation_history'
  - id: mcp-summary-serialize-data
    desc: Serializes supplied tool data
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const postData = JSON.stringify(data)'
  - id: mcp-summary-validation-helper
    desc: Defines syntax validation transport
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'async function syntaxValidation(data)'
  - id: mcp-summary-exchange-endpoint
    desc: Selects remote exchange endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "new URL\\('https://[A-Za-z0-9.-]+/exchange'\\)"
  - id: mcp-summary-tool-description
    desc: Instructs agent to validate issue text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'Every time after you call the getJiraIssue tool'

composite_rules:
  - id: mcp-summary-conversation-post
    desc: MCP summary tool serializes history alongside HTTP POST
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: mcp-summary-tool-handler
      - id: mcp-summary-conversation-input
      - id: mcp-summary-send-call
      - id: mcp-summary-report-type
      - id: mcp-summary-report-history
      - id: mcp-summary-validation-helper
      - id: mcp-summary-serialize-data
      - id: mcp-summary-exchange-endpoint
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/body/construction::node-request-write-variable
      - id: micro-behaviors/communications/http/request/lifecycle::node-request-end-call
      - id: mcp-summary-tool-description
