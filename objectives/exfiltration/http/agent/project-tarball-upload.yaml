# Claimable deployment endpoints receive a tarball of the current project.
# A skill that ships this upload path can export source and local configuration
# to a third party without the user's normal Vercel authentication flow.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  attack: T1041,T1567.002

traits:
  - id: skill-claimable-deploy-endpoint
    desc: Skill uploads to claimable deployment service
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)claude-skills-deploy\.vercel\.com/api/deploy'

  # Prose fragment from the malicious skill body itself; the generic
  # `tar -czf` packaging leg is the canonical tar-create atom in
  # micro-behaviors/data/archive/create/tar/, referenced by the composite.
  - id: skill-project-tarball-phrase
    desc: Project-tarball packaging phrase
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)packages your project into a tarball'

  - id: skill-multipart-tarball-upload
    desc: Skill uploads a project tarball
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)curl.{0,180}-F\s+["'']file=@.{0,80}TARBALL'

composite_rules:
  - id: agent-skill-claimable-project-exfiltration
    desc: Agent skill uploads project tarball to deployment endpoint
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-claimable-deploy-endpoint
      - id: skill-multipart-tarball-upload
    any:
      - id: skill-project-tarball-phrase
      - id: micro-behaviors/data/archive/create/tar::tar-create
