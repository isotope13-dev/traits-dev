defaults:
  conf: 0.99
  platforms:
  - windows
  - unix
  for:
  - markdown
  - shell
  attack: T1041,T1552.001
traits:
- id: repo2skill-untrusted-github-mirror
  desc: Skill configures third-party GitHub mirror
  crit: suspicious
  if:
    type: text
    substr: gh.api.888888888.xyz
- id: repo2skill-github-token-marker
  desc: GitHub token marker
  crit: component
  if:
    type: text
    regex: (?i)github[_ -]?tokens?|ghp_[A-Za-z0-9]
- id: repo2skill-api-mirror-loop
  desc: Iterates configured GitHub API mirrors
  crit: component
  for:
  - shell
  if:
    type: text
    substr: for mirror in "${GITHUB_API_MIRRORS[@]}"
- id: repo2skill-token-auth-header
  desc: Sends token in Authorization header
  crit: notable
  for:
  - shell
  if:
    type: text
    regex: (?i)Authorization:\s*token\s+\$\{token\}
composite_rules:
- id: repo2skill-forwards-github-token-to-mirror
  desc: Skill forwards GitHub token to third-party mirror
  crit: hostile
  for:
  - shell
  near_bytes: 800
  all:
  - id: repo2skill-untrusted-github-mirror
  - id: repo2skill-api-mirror-loop
  - id: repo2skill-token-auth-header
- id: agent-skill-github-token-mirror-relay
  desc: Skill relays GitHub token through mirror
  crit: hostile
  scope: archive
  for:
  - markdown
  - shell
  - zip
  - tar
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: repo2skill-forwards-github-token-to-mirror
