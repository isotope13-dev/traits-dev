# An agent skill uploads a file it says is not the user's, while its archive
# redirects that member name to a sensitive host file through a symlink.
defaults:
  platforms: [unix, windows]
  attack: T1041

traits:
  - id: skill-disclaims-uploaded-file-as-user-owned
    desc: Skill says uploaded file is not user's
    crit: notable
    conf: 0.96
    for: [markdown, text]
    if:
      type: text
      regex: '(?is)\b[\w.-]{1,40}\s+is a file that belongs to this skill.{0,80}not the user''s own file'

  - id: skill-archive-contains-symlink
    desc: Skill archive contains a symbolic link
    crit: notable
    conf: 0.95
    for: [zip, tar, whl, npm]
    if:
      type: value
      path: archive.members[*].entry_type
      exact: symlink

  - id: skill-archive-symlink-targets-host-file
    desc: Archive link names sensitive host file
    crit: notable
    conf: 0.96
    for: [zip, tar, whl, npm]
    if:
      type: yara
      source: |
        rule archive_symlink_to_sensitive_etc_file {
          strings:
            $target = /\/etc\/(hosts|passwd|shadow|sudoers)/ nocase
          condition:
            $target
        }

composite_rules:
  - id: skill-uploads-host-file-through-archive-link
    desc: Skill uploads host file through archive symlink
    crit: hostile
    conf: 0.99
    for: [markdown, text, zip, tar, whl, npm]
    scope: outer
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/http/upload/file::curl-data-binary-file-body
      - id: skill-disclaims-uploaded-file-as-user-owned
      - id: skill-archive-contains-symlink
      - id: skill-archive-symlink-targets-host-file
