# Require the upload instruction in the skill itself before joining archive
# evidence. An escaping link elsewhere still does not prove that the upload
# reads it, so the archive-level observation is suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  attack: T1041

composite_rules:
  - id: agent-skill-file-body-upload
    desc: Agent skill contains file upload instruction
    crit: notable
    conf: 0.98
    scope: file
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/http/upload/file::curl-data-binary-file-body

  - id: agent-skill-uploads-escaped-symlink-target
    desc: Archive combines skill file upload and escaping symlink
    crit: suspicious
    conf: 0.98
    scope: outer
    for: [zip, markdown]
    all:
      - id: agent-skill-file-body-upload
      - id: objectives/anti-analysis/anti-tampering::archive-symlink-escape
