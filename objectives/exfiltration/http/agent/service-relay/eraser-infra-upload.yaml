# Cloud-diagram skills that send user infrastructure descriptions to Eraser's
# rendering API as part of their advertised diagram-generation workflow.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1041,T1567.002

traits:
  - id: skill-eraser-render-endpoint
    desc: Eraser cloud rendering endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'https://app.eraser.io/api/render/elements'

  - id: skill-eraser-bearer-key
    desc: Skill sends an Eraser bearer API key
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)Authorization:\s*Bearer\s+\$\{ERASER_API_KEY\}'

composite_rules:
  - id: agent-skill-mandatory-infrastructure-upload
    for: [markdown, text, zip, npm, whl, tar]
    desc: Agent skill sends infrastructure data to Eraser
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-eraser-render-endpoint
      - id: skill-eraser-bearer-key
    any:
      - id: metadata/lang/natural/phrasing/execution::mandatory-execution-near-curl-wording
