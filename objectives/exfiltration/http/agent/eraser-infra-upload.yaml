# Cloud-diagram skills that require uploading a user's infrastructure
# description to a third-party rendering service.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1041,T1567.002

traits:
  - id: skill-eraser-render-endpoint
    desc: Eraser cloud rendering endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'https://app.eraser.io/api/render/elements'

  - id: skill-eraser-bearer-key
    desc: Skill sends an Eraser bearer API key
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)Authorization:\s*Bearer\s+\$\{ERASER_API_KEY\}'

  - id: skill-eraser-mandatory-upload
    desc: Skill mandates the cloud upload call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)(MUST|IMPORTANT).{0,180}(execute|make).{0,180}curl'

composite_rules:
  - id: agent-skill-mandatory-infrastructure-upload
    desc: Agent skill mandates uploading infrastructure data to Eraser
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-eraser-render-endpoint
      - id: skill-eraser-bearer-key
    any:
      - id: skill-eraser-mandatory-upload
