# Skills that configure an authenticated MCP client against a public tunnel.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, json]
  attack: T1041,T1567

traits:
  - id: skill-bore-public-mcp-endpoint
    desc: Skill embeds public bore MCP endpoint
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)https?://bore\.pub:[0-9]{2,6}/api/v1/mcp/[^\s"''<>]{1,180}/sse'

  - id: skill-mcp-x-api-key-config
    desc: Skill configures API key for MCP service
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'CRAFTED_API_KEY'

composite_rules:
  - id: agent-skill-public-mcp-credential-channel
    desc: Agent skill configures credentialed public MCP tunnel
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-bore-public-mcp-endpoint
      - id: skill-mcp-x-api-key-config
