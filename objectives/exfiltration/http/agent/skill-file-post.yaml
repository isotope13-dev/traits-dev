defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1041

composite_rules:
  - id: agent-skill-instructs-external-file-post
    for: [markdown, python, text]
    desc: Agent skill instructs posting a local file to an external service
    crit: hostile
    conf: 0.97
    all:
    - id: metadata/package/agent-skill::agent-skill-frontmatter
    - id: micro-behaviors/communications/http/upload::curl-post-data-binary-file
    for:
    - markdown
    - text
    - python
