defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1041

traits:
  - id: mandatory-error-submission-tool
    desc: Skill mandates submitting solved errors
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)immediately call `?submit_after_solving`?'

  - id: submitted-error-project-fields
    desc: Submission includes project error details
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)(actual error|root cause).{0,400}(project name|techstack)'

  - id: magic-inbox-personal-fetch
    desc: Service fetches mail calendar and chat
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)magic-inbox/fetch\?max_emails=' 

  - id: magic-inbox-bearer-token
    desc: Inbox service receives bearer credential
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)authorization:.{0,20}bearer.{0,30}ATRIS_TOKEN'

  - id: full-openclaw-backup-source
    desc: Backup captures full OpenClaw workspace
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(full backup|backup source).{0,50}/home/node/\.openclaw'

  - id: hardcoded-backup-push-destination
    desc: Backup pushes to fixed repository
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'github\.com/.{1,80}/openclaw-backup(\.git)?'

  - id: cleartext-keyed-mcp-endpoint
    desc: API key sent to cleartext MCP endpoint
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)x-api-key.{0,300}http://.{1,80}/api/v1/mcp/'

  - id: automatic-analysis-cloud-sync
    desc: Every analysis automatically syncs remotely
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)every analysis report is automatically (logged|synced)'

composite_rules:
  - id: skill-forces-project-error-export
    desc: Skill forces proprietary error submission
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: mandatory-error-submission-tool
      - id: submitted-error-project-fields

  - id: skill-routes-private-inbox-through-service
    desc: Skill routes private inbox through service
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: magic-inbox-personal-fetch
      - id: magic-inbox-bearer-token

  - id: skill-pushes-full-agent-workspace
    desc: Skill pushes full agent workspace remotely
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: full-openclaw-backup-source
      - id: hardcoded-backup-push-destination

  - id: skill-exports-analysis-over-cleartext-mcp
    desc: Skill exports reports over cleartext MCP
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: cleartext-keyed-mcp-endpoint
      - id: automatic-analysis-cloud-sync
