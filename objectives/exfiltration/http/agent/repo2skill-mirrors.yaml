# Repository-to-skill helpers that forward a user's GitHub token through a
# list of unrelated third-party mirrors create a credential relay.  The
# upstream API alone is not suspicious; the combination with mirror rotation
# and an Authorization header is.
defaults:
  platforms: [windows, unix]
  for: [markdown, shell]
  attack: T1041,T1552.001

traits:
  - id: repo2skill-untrusted-github-mirror
    desc: Skill configures third-party GitHub mirror
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: gh.api.888888888.xyz

  - id: repo2skill-github-token-marker
    desc: GitHub token marker
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(?i)github[_ -]?tokens?|ghp_[A-Za-z0-9]'

  - id: repo2skill-authorization-token-header-marker
    desc: Authorization token header marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)Authorization.{0,40}(token|Bearer)'

  - id: repo2skill-token-environment
    desc: Skill accepts GitHub token environment variable
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: GITHUB_TOKENS

composite_rules:
  - id: repo2skill-forwards-github-token
    desc: Skill forwards token in Authorization header
    crit: suspicious
    conf: 0.99
    near_bytes: 192
    all:
      - id: repo2skill-github-token-marker
      - id: repo2skill-authorization-token-header-marker

  - id: agent-skill-github-token-mirror-relay
    desc: Skill relays GitHub token through mirror
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: repo2skill-untrusted-github-mirror
      - id: repo2skill-forwards-github-token
      - id: repo2skill-token-environment
