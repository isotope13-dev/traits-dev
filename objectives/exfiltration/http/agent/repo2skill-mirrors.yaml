# Repository-to-skill helpers that forward a user's GitHub token through a
# list of unrelated third-party mirrors create a credential relay.  The
# upstream API alone is not suspicious; the combination with mirror rotation
# and an Authorization header is.
defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [markdown, shell]
  attack: T1041,T1552.001

traits:
  - id: repo2skill-untrusted-github-mirror
    desc: Skill configures third-party GitHub mirror
    crit: suspicious
    if:
      type: text
      substr: gh.api.888888888.xyz

  - id: repo2skill-github-token-marker
    desc: GitHub token marker
    crit: notable
    if:
      type: text
      regex: '(?i)github[_ -]?tokens?|ghp_[A-Za-z0-9]'

composite_rules:
  - id: repo2skill-forwards-github-token-to-mirror
    desc: Skill forwards GitHub token to third-party mirror
    crit: suspicious
    near_bytes: 192
    all:
      - id: repo2skill-untrusted-github-mirror
      - id: repo2skill-github-token-marker
      - id: micro-behaviors/communications/http/authorization-header::token-auth-header

  - id: agent-skill-github-token-mirror-relay
    desc: Skill relays GitHub token through mirror
    crit: hostile
    scope: archive
    for: [markdown, shell, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: repo2skill-forwards-github-token-to-mirror
