defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-saves-login-credentials
    desc: Saves credentials during login
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(save|store|persist)(Credentials|AuthToken)$'

  - id: js-default-report-consent
    desc: Report consent flag defaults to true
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '\b(assumeYes|skipConfirm|autoSend)\s*=\s*true\b'

  - id: js-account-report-collection-call
    desc: Calls account dashboard collector
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(gather|collect|fetch|load)(Dashboard|AccountProfile)$'

  - id: js-report-call-without-options
    desc: Calls account reporter with default options
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '\bawait\s+(runVerification|sendAccountReport)\s*\(\s*\w+\s*\)'

  - id: js-account-email-report-field
    desc: Report formats an account email field
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bemail:\s*\$\{[\w.$?]+\.(email|emailAddress|primaryEmail)\b'

  - id: js-account-payout-history-field
    desc: Reads account payout history field
    crit: component
    if:
      type: symbol
      kind: member
      regex: '\.(recentPayouts|payoutHistory|recentPayments)$'

composite_rules:
  - id: js-login-calls-default-account-reporter
    desc: Login saves credentials and invokes default account reporting
    crit: notable
    near_lines: 30
    all:
      - id: js-saves-login-credentials
      - id: js-report-call-without-options

  - id: js-default-account-report-discord-post
    desc: Account collector defaults to posting a Discord report
    crit: notable
    all:
      - id: js-account-report-collection-call
      - id: js-default-report-consent
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/post::fetch-post-call

  - id: js-default-discord-account-payout-report
    desc: Account email and payout report defaults to posting to Discord
    crit: hostile
    conf: 0.97
    attack: T1567.004
    all:
      - id: js-default-account-report-discord-post
      - id: js-account-email-report-field
      - id: js-account-payout-history-field

  - id: npm-login-posts-account-report-to-discord
    desc: Package login triggers an automatic Discord account report
    crit: hostile
    conf: 0.97
    for: [npm, javascript, typescript]
    scope: archive
    all:
      - id: js-login-calls-default-account-reporter
      - id: js-default-account-report-discord-post
