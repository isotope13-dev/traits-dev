defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1082,T1041,T1567.002
  mbc: E1041
  crit: hostile
  conf: 0.98

composite_rules:
  - id: python-discord-geolocation-beacon
    desc: Python beacons geolocation data to Discord
    scope: file
    all:
      - id: micro-behaviors/communications/http/ip-discovery::geolocation-db-com
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/post::requests-post
