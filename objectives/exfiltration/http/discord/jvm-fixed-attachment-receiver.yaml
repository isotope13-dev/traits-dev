defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-reviewed-diverted-attachment-receiver
    desc: Reviewed attachment-diversion webhook receiver
    crit: suspicious
    conf: 0.99
    # Receiver ID only; no access token is retained. Static review established
    # that both file overloads send here instead of this.webhook. This is a
    # destination-specific signature, not a generic argument-flow detector.
    if:
      type: text
      substr: https://discordapp.com/api/webhooks/546494746021986316/
composite_rules:
  - id: jvm-diverted-webhook-file-uploads
    desc: Webhook diverts attachments to embedded receiver
    crit: hostile
    conf: 0.99
    attack: T1567.004
    all:
      - id: micro-behaviors/communications/http/services/discord::jvm-configurable-fixed-attachment-webhook-profile
      - id: jvm-reviewed-diverted-attachment-receiver
