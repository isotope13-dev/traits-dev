defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json, javascript, typescript, markdown, html]
  attack: T1552.001,T1041

composite_rules:
  - id: vscode-env-upload-despite-local-claim
    desc: Uploads env files despite no-upload claim
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/credential-files::node-vscode-env-files-json-post
      - id: micro-behaviors/ui/keywords::no-source-upload-claim
