# Cargo build scripts that sweep the whole environment into a file and POST
# it off-host with curl. `cargo build` (and `cargo install` of a dependent)
# runs build.rs with the developer's full environment attached, so this is
# the Rust analogue of the npm postinstall / PyPI setup.py env-stealer shape.
#
# The three required roles are distinct: the artifact is a build script
# (execution context), it enumerates the entire environment rather than
# reading named variables (collection), and it sends a file body with a
# detached HTTP POST client (transmission). A build script that merely
# probes PATH or a toolchain variable, or that downloads with curl GET,
# satisfies at most one of them; the combination is the exfiltration shape.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: "T1195.002,T1552.001,T1041"
  mbc: E1041

composite_rules:
  - id: rust-build-script-env-curl-exfil
    desc: Cargo build script posts full environment via curl
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 8192
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/os/env/enumerate::rust-env-module-vars
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call
    unless:
      - id: metadata/path/directory::test-directory-component
