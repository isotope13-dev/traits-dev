# CI/CD runner secrets swept across providers, then shipped off-host.
#
# Code that steals build credentials cannot know which platform it landed on,
# so it reads the runner variables of several CI providers at once -- GitHub
# Actions, GitLab CI, Jenkins, CircleCI -- snapshots the surrounding
# environment, and puts the result in an outbound request body.
#
# The breadth is not by itself the tell: `ci-info`, `env-ci` and every build
# tool that adapts its output to a runner read exactly these variables. Those
# consumers *branch* on the values locally. What none of them do is serialize
# the whole environment object and hand it to an HTTP client, which is why the
# environment snapshot and the request body are required alongside the
# provider breadth rather than the provider names alone.
#
# PhantomRaven (CrowdStrike Counter Adversary Operations, September 2026) is
# the reference shape: a remote dynamic dependency fetched during `npm
# install` collected BUILD_TAG, CI_PROJECT_*, CIRCLE_*, GITHUB_* and
# JENKINS_URL into one object beside a host fingerprint and posted it to
# attacker infrastructure. The same collection was carried into the operator's
# PyPI port, so the shape is expressed per language rather than for npm alone.
defaults:
  platforms: [unix, windows]
  attack: "T1552.001,T1041"
  mbc: E1552

composite_rules:
  - id: js-cicd-provider-sweep-http-exfil
    desc: CI environment profile with JavaScript POST
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/cicd/runner::multi-ci-provider-env-refs-three-plus
      - id: micro-behaviors/os/env/read/collection::node-process-env-object-field
    any:
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
      - id: micro-behaviors/communications/http/request/body/construction::js-fetch-post-body-variable
      - id: micro-behaviors/communications/http/request/body/environment::axios-post-env-body

  - id: js-ci-provider-profile-http-exfil
    desc: CI provider profile with JavaScript HTTP POST
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/cicd/runner::multi-ci-provider-env-refs-three-plus
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-body
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any

  - id: python-cicd-provider-sweep-http-exfil
    desc: CI environment profile with Python JSON request
    crit: hostile
    conf: 0.97
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/os/env/cicd/runner::multi-ci-provider-env-refs-three-plus
      - id: micro-behaviors/os/env/enumerate::python-environ-dict
      - id: micro-behaviors/communications/http/request/json::python-json-body-transport
