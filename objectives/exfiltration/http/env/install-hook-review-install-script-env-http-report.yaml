defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-env-http-report
    desc: Install-named script has environment and HTTP report clues
    crit: suspicious
    conf: 0.98
    attack: T1552.001, T1041
    all:
      - id: micro-behaviors/os/env/read/collection::named-script-env-report-cooccurrence
      - id: micro-behaviors/communications/http/telemetry::node-host-profile-json-http-context
