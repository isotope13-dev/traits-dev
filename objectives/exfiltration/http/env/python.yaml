defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1552.001
  mbc: E1552
composite_rules:
- id: python-install-curl-hostname-exfil-url
  desc: Setup has install hook and hostname curl syntax
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1082,T1041
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/communications/http/curl/command::python-curl-hostname-exfil-url
- id: python-install-curl-host-secret-url
  desc: Setup has install hook and host-secret curl syntax
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001,T1041
  scope: file
  near_bytes: 512
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/communications/http/curl/command::python-curl-quoted-secret-url
  - id: micro-behaviors/communications/http/curl/command::python-curl-url-host-user-substitution
- id: python-install-hook-curl-base64-environment-exfil
  desc: Python install hook exfiltrates Base64 environment with curl
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/os/env/output::env-dump-base-encoded
  - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
  - id: micro-behaviors/communications/http/curl/command::curl-command-substitution-argument
- id: python-environment-encoded-http-exfil
  desc: Encodes whole environment to a remote host
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/os/env/enumerate/entries::environ-items-loop-string-accumulate
  unless:
  - id: metadata/path/directory::test-directory-component
- id: python-environment-snapshot-base64-post
  desc: Base64 POST sends whole environment snapshot
  crit: hostile
  conf: 0.99
  scope: file
  near_bytes: 512
  all:
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-string
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  unless:
  - id: metadata/path/directory::test-directory-component
- id: python-host-attributed-credential-url-beacon
  desc: Host identity and env credential share URL
  crit: suspicious
  conf: 0.96
  attack: T1552.001,T1041
  near_bytes: 64
  all:
  - id: micro-behaviors/communications/http/request/url::python-host-identity-in-url
  - id: micro-behaviors/communications/http/request/credentials/environment::python-credential-env-in-url
- id: python-credential-env-url-path-exfil
  desc: Credential env values sent in a URL path
  conf: 0.96
  attack: T1552.001,T1041
  all:
  - id: micro-behaviors/communications/url/scheme::http-url-literal
  any:
  - id: micro-behaviors/communications/http/request/credentials/environment::python-signing-secret-env-in-url
  - id: python-host-attributed-credential-url-beacon
  unless:
  - id: taskcluster-secret-retrieval-only
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/testing/corpus/labeled::python-labeled-attack-harness
- id: taskcluster-secret-retrieval-only
  desc: Sole HTTP request retrieves Taskcluster secret
  crit: exception
  all:
  - id: micro-behaviors/communications/http/request/client::taskcluster-secret-resource-get
  - id: micro-behaviors/communications/http/request/client::single-requests-httpx-call
- id: python-urlencoded-environment-urllib-post
  desc: Sends URL-encoded environment via urllib
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/body/environment::python-urlencoded-environ-urllib-post
  - id: micro-behaviors/communications/url/scheme::http-url-literal
- id: python-whole-environment-url-get
  desc: Sends whole environment in HTTP GET URL
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/url::python-get-whole-environment-url
  - id: micro-behaviors/communications/url/scheme::http-url-literal
traits: []
