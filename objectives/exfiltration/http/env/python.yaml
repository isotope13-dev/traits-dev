# Whole-environment exfiltration over HTTP, the PyPI credential-theft shape.
#
# `for _, value in environ.items(): s += value` collects every environment
# entry -- CI tokens, cloud keys, database URLs -- without naming any of them,
# base64 wraps it so the request looks opaque in a proxy log, and a single GET
# ships it. The 2022 `ctx` PyPI takeover is the canonical example, and the same
# three steps recur across PyPI and npm stealers because they need no knowledge
# of which secrets the victim happens to hold.
#
# Selecting *named* variables is ordinary configuration; sweeping all of them
# into one encoded blob addressed to a remote host is not.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001
  mbc: E1552

composite_rules:
  - id: python-environment-encoded-http-exfil
    desc: Encodes whole environment to a remote host
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/communications/http/request/client::request-python
    any:
      - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
      - id: micro-behaviors/os/env/vars/enumeration::environ-alias-items-loop
    needs: 1
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
