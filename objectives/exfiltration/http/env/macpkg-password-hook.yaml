defaults:
  platforms: [macos]
  for: [shell]
  attack: T1041,T1552.001
traits:
  - id: shell-password-variable-base64
    desc: Shell encodes password variable as Base64
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\$[A-Z_]*(passw(or)?d?|paswor)[A-Z_]*\s*\|\s*base64\b'
  - id: shell-post-password-variable
    desc: Curl posts password-named variable
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)--data\s+["'']?\$[A-Z_]*(passw(or)?d?|paswor)[A-Z_]*'
composite_rules:
  - id: macpkg-password-post-sudo-remote-script
    desc: Installer posts password and runs remote script
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: shell-password-variable-base64
      - id: shell-post-password-variable
      - id: micro-behaviors/communications/http/request/verb::macpkg-hook-post-ip-clues
      - id: objectives/execution/payload/remote-script::macpkg-hook-sudo-github-script-clues
