defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030
traits:
  - id: axios-post-env-spread
    desc: Environment dump via Axios POST
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @prop)
          arguments: (arguments
            (_)
            (object
              (spread_element
                (member_expression
                  object: (identifier) @src
                  property: (property_identifier) @env))))
          (#eq? @obj "axios")
          (#eq? @prop "post")
          (#eq? @src "process")
          (#eq? @env "env"))
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: "metadata/file/naming::test-directory-component"
  - id: js-environment-snapshot-source
    desc: Builds a filtered environment snapshot
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'Object\.entries\(process\.env\)[\s\S]{0,900}substring\(0,3\)'
composite_rules:
  # Some stealers hide the sink behind a wrapper method: one method builds a
  # complete NAME=value environment dump and another performs axios.post().
  # Requiring the dump, Axios identity, and POST in one tight file recognizes
  # the data path without depending on attacker-chosen method or field names.
  - id: js-full-environment-axios-post
    desc: Posts full environment dump through Axios
    crit: hostile
    conf: 0.99
    attack: "T1552.001,T1041"
    mbc: E1041
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/dump::js-env-key-value-line-dump
      - id: micro-behaviors/communications/http/request/client::axios-module-import
      - id: micro-behaviors/communications/http/post::axios-post-call
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

      - id: "metadata/file/naming::test-directory-component"
  - id: js-env-spread-http-post
    desc: Full environment dump via Axios POST
    crit: hostile
    conf: 0.99
    all:
      - id: axios-post-env-spread
      - id: micro-behaviors/communications/http/request/client::axios-module-import
  # Hex-concealed variant of the Axios env dump above: the client, the method
  # and the URL are hex-string table lookups invoked through a computed
  # require, so neither the import symbol nor any POST shape survives. The
  # full process.env spread, the concealed top-level client call, the encoded
  # URL and the eval of the reply in one tight file is the same theft plus
  # remote-execution chain with no literal client evidence.
  - id: js-concealed-client-env-post-eval
    desc: Concealed client posts env, evaluates reply
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1059.007,T1041"
    mbc: "E1552,E1041"
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/enumeration::js-process-env-spread
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/communications/url/encoded::encoded-https-url
      - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
      - id: "metadata/file/naming::test-directory-component"

  - id: js-obfuscated-environment-command-exfiltration
    desc: Posts output of an obfuscated environment command as JSON
    crit: hostile
    conf: 0.995
    attack: "T1552.001,T1059.007,T1041"
    mbc: "E1552,E1041"
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/create/exec::node-obfuscated-environment-command
      - id: micro-behaviors/process/fd/stdio::node-execfile-stdout-cooccurrence
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/data/serialize/json::json-stringify-payload-call

  - id: js-environment-snapshot-exfiltration
    desc: Sends a filtered environment snapshot remotely
    crit: hostile
    conf: 0.99
    attack: "T1041,T1552.001"
    all:
      - id: js-environment-snapshot-source
      - id: objectives/credential-access/env/secrets/filtered-access::js-env-entries-secret-keyword-sweep
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/os/env/enumeration::js-object-entries-env
