defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-full-environment-callback-post
    desc: Full environment mapping posted to callback service
    crit: suspicious
    conf: 0.96
    attack: T1041
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/request/body/environment::python-environment-value-http-body
      - id: python-bound-environment-callback
  - id: python-bound-environment-callback
    desc: Environment body beside callback request
    crit: component
    near_bytes: 32
    all:
      - id: micro-behaviors/communications/http/request/body/environment::python-bound-environ-http-body
      - id: micro-behaviors/communications/url/host/oob/request::python-webhook-site-call
