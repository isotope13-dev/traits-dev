# An npm package whose install hook runs local code that POSTs the entire
# process environment to an endpoint kept Base64-encoded in the source. The
# environment of an install carries CI and cloud credentials; encoding the
# destination only serves to hide where they go.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1552.001,T1041,T1195.002
  mbc: B0030

composite_rules:
  - id: install-hook-env-post-to-encoded-endpoint
    desc: Install hook posts environment to encoded URL
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: objectives/exfiltration/http/env::axios-post-env-spread
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
