defaults:
  for: [go]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.95
  attack: T1041

traits:
  - id: go-initialization-secret-upload
    desc: Go startup uploads secret-bearing payload
    if:
      type: value
      path: source.go.initialization_events[*].kind
      regex: '^(environment|secret|credential-file|cargo-credential)-http-body$'
  - id: go-package-initialization-data-upload
    desc: Go startup uploads environment or credentials
    for: [tar, zip]
    if:
      type: value
      path: go_context.packages[*].behaviors[*]
      # The package-level `secret` event can represent an Authorization header
      # passed through a request helper. Whole-environment and credential-file
      # bodies remain sufficiently specific to imply startup exfiltration.
      regex: '^initialization-(environment|credential-file|cargo-credential)-http-body$'
