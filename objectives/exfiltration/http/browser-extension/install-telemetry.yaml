# Bespoke browsing-behavior telemetry under a persistent install identity: a
# Web Crypto UUID written to extension local storage, timestamped behavior
# marks accumulated beside it, navigation observation, and an alarm-scheduled
# JSON POST upload. A randomUUID used only as a page token does not qualify.
# Ordinary crash reporting and version check-ins carry no install UUID, no
# behavior marks, and no heartbeat schedule; requiring the persisted UUID,
# navigation, a scheduled alarm, and an upload keeps those quiet while
# catching vendor telemetry that profiles browsing.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
  attack: T1041

composite_rules:
  - id: extension-install-telemetry-exfil
    desc: Extension uploads identified browsing telemetry on schedule
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/os/random/crypto::webcrypto-uuid-local-persist
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-committed
      - id: micro-behaviors/time/schedule/webextension::chrome-alarms-create
    # Endpoint-variable JSON POST (server-configurable exfil target) or a
    # hardcoded fetch-POST: both are the upload leg, and the literal form
    # keeps this composite pinnable from fixture paths, where the
    # endpoint-variable atom's test-harness exclusion suppresses it.
    any:
      - id: micro-behaviors/communications/http/request/payload::fetch-endpoint-post-json-body
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    unless:
      - id: micro-behaviors/process/hook/webextension::chrome-declarative-net-request
      - id: metadata/permission/network::permission-declarative-net-request

