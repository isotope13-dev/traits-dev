# Clickstream upload: page scripts send the current URL and the page's
# anchor targets to the worker, which POSTs them off-host under a stored
# random client id. Link scanning services exist, but bundling the visited
# URL with a durable per-browser id turns them into browsing history.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, crx, javascript, typescript, zip]
  attack: T1217,T1041

composite_rules:
  - id: page-url-links-client-id-upload
    desc: Visited URL and page links uploaded with persistent client ID
    crit: hostile
    conf: 0.87
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-page-url
      - id: micro-behaviors/ui/window/dom-access::browser-selects-anchor-hrefs
      - id: micro-behaviors/browser-extension/lifecycle::stored-random-client-id
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
