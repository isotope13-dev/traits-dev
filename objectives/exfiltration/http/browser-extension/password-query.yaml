composite_rules:
  - id: extension-sends-password-query
    desc: Browser extension sends a password field in an HTTP query
    crit: suspicious
    conf: 0.94
    platforms: [unix, windows]
    for: [javascript, chrome-manifest, crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/package/entrypoint/extension::extension-content-script-declaration
      - id: micro-behaviors/communications/http/request/url-computed::fetch-encoded-password-query
