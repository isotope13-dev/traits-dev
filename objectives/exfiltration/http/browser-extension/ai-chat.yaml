# Browser-extension theft of AI chat conversations (ChatGPT, DeepSeek, etc.):
# scrape page DOM, base64-encode the transcript, and POST it on a timer.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1119,T1041

composite_rules:
  # Marketplace AI-sidebar stealers (Netskope / OX "AI Sidebar" campaign) scrape
  # ChatGPT/DeepSeek DOM, wrap the transcript in btoa, and POST it. Pairing the
  # scrape with an extension API and an HTTP POST distinguishes this from a
  # page script that only styles a chat UI.
  - id: extension-ai-chat-b64-post-exfil
    desc: Extension scrapes AI chat and POSTs base64 content
    crit: hostile
    conf: 0.96
    near_bytes: 4096
    all:
      - id: objectives/collection/messaging/app::ai-chat-dom-scrape
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace-core
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-mutation-observer
      - id: micro-behaviors/time/schedule/interval::setInterval-http
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message

  # Same class without requiring a chrome.* API: a content script that watches
  # the chat DOM and periodically POSTs encoded transcripts is still rare in
  # benign first-party pages (those talk to their own origin without btoa+timer).
  - id: ai-chat-b64-periodic-post
    desc: Periodically POSTs base64 AI chat transcripts
    crit: suspicious
    conf: 0.94
    near_bytes: 4096
    all:
      - id: objectives/collection/messaging/app::ai-chat-dom-scrape
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/ui/window/manage/dom::browser-mutation-observer
    any:
      - id: micro-behaviors/time/schedule/interval::setInterval-http
      - id: micro-behaviors/communications/http/request/client::http-post-json
