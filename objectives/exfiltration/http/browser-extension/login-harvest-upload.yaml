# Bundled extension login harvest exfiltrated to a hard-coded remote server.
#
# A browser extension shipped inside an archive (here: an npm tarball) that
# injects a content script into every page, reads page form-credential values,
# serializes a password field into a JSON POST body, and carries a hard-coded
# remote https URL as its sync/upload destination is a login stealer with a
# vault facade -- not a first-party integration. Each leg alone is ordinary
# (password managers also read forms and POST JSON), but the full chain --
# all-URL injection authority plus credential read plus password POST plus a
# baked-in remote host -- has no benign shape when the bundle is a
# redistributed archive rather than the vendor's own store listing.
#
# The serialization leg requires a literal `password` field. The broader
# key-or-password atom also matches benign `.key` plumbing (map tile keys,
# translation keys), which convicted a commercial scraping extension whose
# only "password" evidence was a map address key.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, javascript, typescript, zip]
  attack: T1056,T1041

composite_rules:
  # Benign context: the password body is aimed at the app's own Supabase
  # GoTrue login route, which is first-party authentication. A stealer POSTs
  # to an attacker host, never to an authentication-grant endpoint.
  - id: supabase-auth-password-login
    desc: First-party Supabase password login flow
    crit: exception
    all:
      - id: micro-behaviors/data/serialize/json::json-stringify-password-body
      - id: micro-behaviors/communications/http/oauth::password-grant-login-endpoint

  # The code half of the chain must live in one script. Pooled across a whole
  # source tree it matches a web app's own password-reset form, a relative
  # `fetch`, and an unrelated remote URL in three different files.
  - id: form-credential-remote-post-code
    desc: One script reads form values and POSTs a password body to a remote host
    crit: notable
    conf: 0.9
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/property/access::form-named-value-member
      - id: micro-behaviors/data/serialize/json::json-stringify-password-body
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

  - id: extension-login-harvest-remote-upload
    desc: Extension harvests site logins and uploads to remote host
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: form-credential-remote-post-code
    unless:
      - id: well-known/app/browser-extension/keepassxc-browser::source-extension
      - id: well-known/app/finance/myetherwallet/
      - id: objectives/exfiltration/http/browser-extension::supabase-auth-password-login
      - id: objectives/credential-access/browser/extension::first-party-account-auth-signin

