composite_rules:
  - id: extension-jquery-password-post
    desc: Extension code posts a page password field to an absolute URL
    crit: suspicious
    conf: 0.94
    platforms: [unix, windows]
    for: [javascript, chrome-manifest, crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/package/entrypoint/extension::extension-content-script-declaration
      - id: micro-behaviors/communications/http/request/body/credential::jquery-password-value-absolute-post
