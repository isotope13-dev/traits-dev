defaults:
  platforms: [windows, unix]
  attack: T1056,T1041

composite_rules:
  - id: page-text-indexed-credentials-remote-post
    desc: Script reads page text and posts credentials
    crit: notable
    conf: 0.95
    scope: file
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/ui/window/enumerate::browser-body-innertext-read
      - id: micro-behaviors/data/property/access::indexed-value-variable-binding
      - id: micro-behaviors/data/serialize/schema-credential::email-password-json-body
      - id: micro-behaviors/communications/http/request/json::js-non-loopback-json-post

  - id: extension-page-text-credential-upload
    desc: Extension posts page text and credentials
    crit: hostile
    conf: 0.97
    scope: archive
    for: [zip, crx, xpi, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::broad-content-script-matches
      - id: page-text-indexed-credentials-remote-post
