defaults:
  platforms: [unix, windows]
  for: [crx, zip, chrome-manifest, javascript]
  attack: T1557,T1041

# An extension that wraps the page's own fetch or XHR to copy API responses,
# then ships the copies to a remote endpoint through its service worker. Some
# integrations (CRM sync, support tools) work this way, so the composite stays
# suspicious: the reviewer must confirm which host receives the captured data.
composite_rules:
  - id: extension-page-response-capture-relay
    desc: Extension copies page API responses and posts them out
    crit: suspicious
    conf: 0.8
    scope: archive
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
      - id: micro-behaviors/data/serialize/json::json-stringify-body-field-object
    any:
      - id: micro-behaviors/communications/http/intercept::window-fetch-eq
      - id: micro-behaviors/communications/http/intercept::xhr-prototype-send-eq
    needs: 1
