defaults:
  platforms: [unix, windows]
  for: [xpi, chrome-manifest, javascript]

composite_rules:
- id: extension-message-fields-beacon-exfil
  desc: Extension sends message-supplied fields to a remote host
  crit: hostile
  conf: 0.98
  scope: archive
  attack: T1041,T1176
  all:
  - id: "metadata/permission/host::content-script-url-match-pattern"
  - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: metadata/permission/host::permission-all-urls
  unless:
  - id: well-known/app/browser-extension/pendo/
