defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1528

# An extension that POSTs a copied access token in a JSON body hands the
# credential to a remote server. Many legitimate extensions do this for their
# own backend, so the composite stays suspicious and needs the extension API
# nearby in the same file to avoid matching unrelated regions of large CLI
# bundles. A session renewal that posts the current token to the extension's
# auth refresh route is ordinary token rotation, not a relay, so that route
# suppresses the finding.
composite_rules:
  - id: json-token-post-body
    desc: fetch POST serializes token or secret fields in JSON body
    crit: notable
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/data/serialize/json::json-stringify-token-secret-body

  - id: extension-token-json-post-relay
    desc: Extension posts a token field in a JSON body
    crit: suspicious
    conf: 0.85
    near_bytes: 8192
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
      - id: json-token-post-body
    unless:
      - id: micro-behaviors/communications/url/resource-path/identity::session-token-refresh-route
