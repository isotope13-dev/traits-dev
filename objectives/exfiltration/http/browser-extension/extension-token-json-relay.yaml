defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1528

# An extension that POSTs a copied access token in a JSON body hands the
# credential to a remote server. Many legitimate extensions do this for their
# own backend, so the composite stays suspicious and needs the extension API
# in the same file to avoid matching ordinary web apps.
composite_rules:
  - id: extension-token-json-post-relay
    desc: Extension posts a token field in a JSON body
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/data/serialize/json::json-stringify-token-secret-body
