defaults:
  platforms: [windows, unix]
  attack: T1041,T1176

composite_rules:
  - id: extension-storage-remote-post-exfil
    desc: Extension sends browser storage to remote host
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/db/web-storage::extension-startup-handler-storage-read
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/post::json-body-post
      - id: micro-behaviors/data/serialize/json::json-stringify-identifier

  - id: extension-broad-permission-storage-exfil
    desc: Broad-permission extension exfiltrates storage
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, zip, xpi, chrome-manifest, javascript]
    all:
      - id: objectives/supply-chain/hidden-payload/extensions/backdoor::xpi-startup-storage-upload
      - id: metadata/permission/manifest::permission-all-urls
      - id: metadata/permission/storage::permission-storage
