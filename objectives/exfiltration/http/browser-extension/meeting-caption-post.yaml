# Browser-extension relay of live meeting captions: a content script reads the
# caption DOM, relays the transcript to the extension worker, and the worker
# POSTs it to a remote host. Capture and transport usually sit in different
# members of one extension, so the composites join at archive scope.
#
# Two tiers. A worker that forwards each received message straight into the
# POST body relays every caption line without a user step, which is hostile.
# A worker that builds its own body (for example a transcript range the user
# picked in an in-page panel, sent to an assistant backend) is a disclosed
# product pattern: other participants' speech still reaches a third party, so
# it stays suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  for: [crx, xpi, javascript]
  attack: T1119,T1041

composite_rules:
  - id: extension-meeting-caption-upload
    desc: Extension sends scraped Meet captions in a POST
    crit: suspicious
    conf: 0.8
    scope: archive
    all:
      - id: micro-behaviors/data/collection/dom::meet-caption-dom-scrape
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message

  - id: extension-meeting-caption-post
    desc: Extension relays scraped Meet captions to a POST
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/data/collection/dom::meet-caption-dom-scrape
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
      - id: micro-behaviors/communications/ipc/extension-message::message-payload-json-body
