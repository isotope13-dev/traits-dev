# Browser-extension theft of live meeting captions: a content script reads the
# caption DOM, relays the transcript to the extension worker, and the worker
# POSTs it to a remote host. Capture and transport usually sit in different
# members of one extension, so the composite joins at archive scope.
defaults:
  platforms: [unix, windows]
  for: [crx, xpi, javascript]
  attack: T1119,T1041

composite_rules:
  - id: extension-meeting-caption-post
    desc: Extension relays scraped Meet captions to a POST
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/data/collection/dom::meet-caption-dom-scrape
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
