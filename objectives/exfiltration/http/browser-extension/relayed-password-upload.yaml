# Two-hop login theft: a content script reads the page password field and
# messages it to the background worker, which builds a JSON request body
# straight from the message's password member and POSTs it to a remote
# host. A popup sign-in form also posts a password from a message, but its
# source is the extension's own form, not a field on a third-party page.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, javascript, typescript, zip]
  attack: T1056.003,T1041

composite_rules:
  - id: page-password-relayed-remote-post
    desc: Page password field relayed to background and POSTed remotely
    crit: hostile
    conf: 0.92
    scope: archive
    all:
      - id: metadata/package/entrypoint/extension::extension-content-script-declaration
      - id: micro-behaviors/ui/controls/credential::password-input-value-read
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-password-member
      - id: micro-behaviors/communications/ipc/extension-message::message-password-into-json-body
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    unless:
      - id: well-known/app/browser-extension/keepassxc-browser::source-extension
