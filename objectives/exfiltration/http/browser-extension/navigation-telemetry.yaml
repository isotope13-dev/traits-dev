# Browser navigation surveillance sent through a self-hosted Sentry endpoint.
# Requiring all-site WebRequest authority, target/referrer/user identity fields,
# and an explicit Sentry request-context send avoids ordinary crash reporting.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip, archives]
  attack: T1041

composite_rules:
  - id: extension-navigation-sentry-exfil
    desc: Extension exfiltrates identified navigation through Sentry
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/process/hook/webextension::webrequest-before-send-headers-listener
      - id: objectives/collection/monitor/tracking::extension-target-referrer-userid-payload
      - id: micro-behaviors/os/telemetry/logging/analytics::sentry-request-context-message
      - id: objectives/collection/monitor/telemetry::sentry-self-hosted-dsn
