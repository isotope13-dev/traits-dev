defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: streaming-report-post-reference-clues
  for:
  - javascript
  - typescript
  - crx
  - xpi
  - zip
  desc: Report-name and POST text in extension
  crit: suspicious
  conf: 0.95
  scope: archive
  all:
  - id: micro-behaviors/browser-extension/lifecycle::extension-install-user-id-key
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  any:
  - id: metadata/lang/source/naming/function/communication::profile-history-report-name-text
  - id: metadata/lang/source/naming/function/communication::send-history-to-metriq-symbol
  unless:
  - id: well-known/unwanted/qvi::disclosed-qvi-panel-context
