defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1539,T1041,T1185
traits:
  - id: bank-credential-endpoint
    desc: Targets online banking login endpoints
    crit: notable
    if:
      type: text
      regex: '(?i)(internetbanking|netbanking|autoatendimento)[^"\x27\r\n]{0,80}\.[a-z]{2,}'
composite_rules:
  - id: extension-bank-session-ip-upload
    desc: Extension uploads intercepted bank sessions
    crit: hostile
    conf: 0.99
    all:
      - id: bank-credential-endpoint
      - id: metadata/lang/source/syntax/credential-field::cookie-token-field-proximity
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all-text
      - id: micro-behaviors/communications/http/intercept::webrequest-request-header-capture
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
