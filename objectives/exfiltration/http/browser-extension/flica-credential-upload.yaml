defaults:
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  - id: flica-password-automation-backend-query
    desc: Sends FLICA password in URL to automation backend
    crit: hostile
    conf: 0.98
    attack: T1041
    # The backend URL and matched request initializer begin at the same literal.
    near_bytes: 8
    all:
      - id: micro-behaviors/communications/url/resource-path/automation::flica-account-write-url
      - id: micro-behaviors/communications/http/request/url-computed::fetch-encoded-password-query
