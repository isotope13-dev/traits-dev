defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: source-variable-external-webdav
    desc: Source variable names external WebDAV share
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\$source\s*=\s*["'']\\\\[^\\\s"'']{1,100}\\DavWWWRoot'
  - id: copy-file-to-source-variable
    desc: Copies file to source variable
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Copy-Item\s+-Path\s+\$file\s+-Destination\s+\$source\b'

composite_rules:
  - id: desktop-files-repeated-webdav-copy
    desc: Repeatedly copies desktop files to WebDAV
    crit: hostile
    conf: 0.97
    attack: T1048,T1105
    all:
      - id: source-variable-external-webdav
      - id: copy-file-to-source-variable
      - id: micro-behaviors/data/control-flow/loop/unconditional::embedded-powershell-while-true
      - id: micro-behaviors/fs/path/personal::desktop-path-token
