defaults:
  for: [python]
  platforms: [unix, ios, android]
  crit: suspicious
  conf: 0.95
  attack: T1041
traits:
  - id: python-http-upload-apple-notes
    desc: HTTP POST body opens Notes database
    platforms: [unix, ios]
    if:
      type: text
      regex: 'requests\.post\([^\n]{0,180}data\s*=\s*open\([^\n]{0,160}/(NoteStore|notes)\.sqlite'
  - id: python-http-upload-mobile-photo
    desc: HTTP POST body opens mobile photo
    if:
      type: text
      regex: 'requests\.post\([^\n]{0,180}data\s*=\s*open\(["\x27]/[^"\x27\n]{1,100}/DCIM/'
  - id: javascript-http-upload-apple-notes
    desc: Fetch body opens Notes database
    for: [javascript, typescript]
    platforms: [unix, ios]
    if:
      type: text
      regex: 'fetch\([^\n]{0,120}body:\s*fs\.readFileSync\([^\n]{0,100}/(NoteStore|notes)\.sqlite'
  - id: javascript-http-upload-mobile-photo
    desc: Fetch body opens mobile photo
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\([^\n]{0,120}body:\s*fs\.readFileSync\(["\x27]/[^"\x27\n]{1,100}/DCIM/'
