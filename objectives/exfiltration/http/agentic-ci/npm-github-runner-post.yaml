defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: npm-github-path-profile-beacon
    desc: npm hook profiles GitHub runner then posts
    crit: hostile
    conf: 0.98
    for: [binaries, '!dex', go, javascript, npm, package.json, python, ruby, shell, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-node-script-error-ignored
      - id: micro-behaviors/os/env/cicd/startup::github-path-file
      - id: micro-behaviors/os/env/cicd/pipeline::github-ci-identity-fields
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
