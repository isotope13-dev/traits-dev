# Agentic CI runners expose attacker-controlled issue text to tools that can
# read process state and communicate externally. These composites recognize
# concrete procfs-to-channel primitives without matching prompt prose.
defaults:
  platforms: [linux]
  for: [shell, python, javascript, typescript, ruby, go]
  attack: T1041

composite_rules:
  - id: process-environ-github-issue-exfiltration
    desc: Process environment exfiltrated through GitHub
    crit: hostile
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/fs/proc/info/path::process-var-environ
      - id: micro-behaviors/communications/http/services/github::gh-issue-edit
      - id: micro-behaviors/communications/http/services/github::gh-issue-edit-body-flag

  - id: process-environ-http-exfiltration
    desc: Process environment exfiltrated over HTTP
    crit: hostile
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/fs/proc/info/path::process-var-environ
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/curl::curl-short-data-option

  - id: git-config-http-exfiltration
    desc: Git config sent over HTTP
    crit: hostile
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/fs/path/config/git::git-repository-config-path
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/curl::curl-short-data-option
