# Exfil collectors that decode a Base64 payload from the query string of the
# <script> tag that loaded them. The GET looks like a library load; the loot
# rides in `?d=` / similar and is recovered via currentScript + atob.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1041
  mbc: B0030

composite_rules:
  - id: script-url-query-atob-decode
    desc: Decodes Base64 from loading-script query
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/dom-access::current-script-src-query-split
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
      - id: micro-behaviors/data/decode/base64::atob-decode
