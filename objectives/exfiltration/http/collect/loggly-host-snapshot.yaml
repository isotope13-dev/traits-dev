# A host snapshot wired to a Loggly ingestion transport whose credentials are
# decoded from Base64 at runtime.
#
# Each leg is ordinary on its own: installers query the platform, loggers
# record the hostname, and servers decode stored secrets. What is not ordinary
# is the set in one module — four distinct host/user query kinds (hostname,
# user, home directory, platform) beside a third-party log-ingestion transport
# whose token never appears as plaintext. A legitimate Loggly user configures
# the transport from environment in the open; decoding the credential from an
# embedded blob hides the destination from static view while the snapshot
# supplies the payload. Scope stays `file`: every leg describes one module's
# own load path, so a large application bundle cannot satisfy the legs from
# unrelated modules.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1041,T1082
  mbc: E1041
composite_rules:
  - id: host-snapshot-to-loggly-transport
    desc: Host snapshot exfiltrated via Loggly
    conf: 0.97
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-four-host-query-kinds
      - id: micro-behaviors/communications/http/services/loggly::loggly-transport-construction
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
