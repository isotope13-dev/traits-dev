defaults:
  platforms: [unix]
  for: [c, cpp, objc, rust, go, elf]
  attack: T1041

traits:
  - id: native-collect-http-post
    desc: Native HTTP collect POST
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'POST /collect HTTP/1\.1[\s\S]{0,260}(Content-Length|application/octet-stream)'

  - id: native-exfil-http-post
    desc: Native HTTP exfil POST
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'POST /exfil HTTP/1\.1[\s\S]{0,260}(Content-Length|application/octet-stream)'

composite_rules:
  - id: native-wallet-seed-exfiltration
    desc: Native wallet seed phrase exfiltration
    crit: hostile
    conf: 0.99
    for: [pe]
    platforms: [windows]
    all:
      - id: objectives/credential-access/wallet/mnemonic::native-wallet-recovery-term
      - id: objectives/credential-access/wallet/mnemonic::native-wallet-seed-endpoint
      - id: objectives/credential-access/wallet/mnemonic::native-multi-wallet-brand-catalog
      - id: micro-behaviors/communications/http/auth::hardcoded-api-key-config
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
