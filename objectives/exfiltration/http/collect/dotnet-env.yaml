# Module-initializer SDKs that inventory dotenv files and POST the host
# profile. Complements the generic recon-exfil composite (network/interface
# inventory) with the env-file collection leg.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll]
  attack: T1552.001,T1041
  mbc: B0014

composite_rules:
  - id: dotnet-module-init-env-file-http-exfil
    desc: Module init HTTP env-file harvest
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::dotnet-module-initializer
      - id: micro-behaviors/fs/search::find-env-files-method
      - id: micro-behaviors/fs/search::parse-env-file-method
      - id: micro-behaviors/communications/http/client/managed::request
