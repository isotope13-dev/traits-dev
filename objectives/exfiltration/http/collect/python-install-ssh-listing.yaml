defaults:
  platforms: [unix]
  for: [python]
  attack: T1041,T1083,T1082

composite_rules:
  - id: python-install-ssh-listing-post
    desc: Install hook posts SSH directory listing context
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
      - id: micro-behaviors/communications/http/request/credentials/file::python-ssh-listing-upload-context
      - id: micro-behaviors/communications/http/request/body/construction::http-post-with-body-argument
      - id: micro-behaviors/fs/directory/readdir/target::python-os-ssh-list
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
