defaults:
  platforms: [unix, appliance]
  for: [perl]
  attack: T1041

traits:
  - id: perl-harvest-dat-filename
    desc: Perl harvest dat filename
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: harvest.dat

  - id: perl-socket-http-send
    desc: Perl socket HTTP send
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'IO::Socket::INET->new[\s\S]{0,260}->send\(\$http_req\)'

  - id: perl-password-assignment
    desc: Perl password assignment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*\$password\s*[=:]'

  - id: perl-passwd-assignment
    desc: Perl passwd assignment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*\$passwd\s*[=:]'

  - id: perl-secret-assignment
    desc: Perl secret assignment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*\$secret\s*[=:]'

  - id: perl-token-assignment
    desc: Perl token assignment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*\$token\s*[=:]'

  - id: perl-api-key-assignment
    desc: Perl API key assignment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*\$api_key\s*[=:]'

composite_rules:
  - id: perl-multipart-credential-exfil
    desc: Perl multipart credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/post::multipart-form
      - id: perl-harvest-dat-filename
      - id: perl-socket-http-send
    any:
      - id: perl-password-assignment
      - id: perl-passwd-assignment
      - id: perl-secret-assignment
      - id: perl-token-assignment
      - id: perl-api-key-assignment
