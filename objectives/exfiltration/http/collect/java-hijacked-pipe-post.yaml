defaults:
  for: [class, java_class]
  platforms: [windows, unix]
  attack: T1041

traits:
  - id: java-piped-input-read
    desc: Java class reads piped input
    crit: notable
    conf: 0.98
    if:
      type: import
      exact: java/io/PipedInputStream.read

  - id: java-capture-endpoint
    desc: Java class references a capture endpoint
    crit: notable
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      exact: /capture

  - id: java-execution-flow-hijack-method
    desc: Java execution flow hijack method
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: hijackExecutionFlow

composite_rules:
  - id: java-hijacked-output-post
    desc: Java execution flow hijack posts captured stream output
    crit: hostile
    conf: 0.96
    all:
      - id: java-piped-input-read
      - id: java-capture-endpoint
      - id: java-execution-flow-hijack-method
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
