defaults:
  platforms: [unix]
  for: [go, elf]
  attack: T1041

traits:
  - id: go-http-collect-post
    desc: Go HTTP collect POST
    crit: suspicious
    conf: 0.94
    for: [go, elf, macho]
    if:
      type: text
      regex: 'NewRequest\("POST"[\s\S]{0,160}/collect'
    not:
      - regex: '_api/collection'
