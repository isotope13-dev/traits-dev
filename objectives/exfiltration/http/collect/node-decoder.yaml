defaults:
  platforms: [unix, windows]
  for: [npm, tar]
  attack: T1041

composite_rules:
  # A decoder is expected to transform its argument locally. Sending caller
  # input in a JSON POST to a raw-IP endpoint is an exfiltration behavior. The
  # matcher establishes that behavior, not a trojanized-library provenance.
  - id: node-decoder-input-network-side-effect
    desc: Decoder sends caller input to raw-IP endpoint
    crit: hostile
    conf: 0.99
    scope: package
    near_bytes: 900
    all:
      - id: micro-behaviors/data/decode/custom::javascript-decode-function
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
      - id: micro-behaviors/data/serialize/schema-object::json-object-variable-field
