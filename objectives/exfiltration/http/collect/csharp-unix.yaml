defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  attack: T1041

traits:
  - id: csharp-unix-secret-file-list
    desc: C# Unix secret file list
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\.ssh/id_rsa[\s\S]{0,260}\.netrc[\s\S]{0,260}\.aws/credentials'

  # `csharp-env-secret-filter` lived here. A single enumeration-plus-keyword
  # regex is a capability, not an objective, so it now lives as the neutral
  # `micro-behaviors/os/env/enumeration::dotnet-env-secret-filter` atom that
  # the composites below reference cross-directory.
  - id: csharp-bytearray-content
    desc: C# byte array content
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: ByteArrayContent

  - id: csharp-raw-http-post-template
    desc: C# raw HTTP POST template
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(POST \{path\} HTTP/1\.1)'

composite_rules:
  - id: csharp-unix-file-secret-collect
    for: [csharp]
    desc: C# Unix file secret collect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/email/mime::mime-octet-stream
      - id: csharp-unix-secret-file-list
    any:
      - id: csharp-bytearray-content
      - id: csharp-raw-http-post-template

  - id: csharp-unix-env-secret-collect
    for: [csharp]
    desc: C# Unix env secret collect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/email/mime::mime-octet-stream
      - id: micro-behaviors/os/env/enumeration::dotnet-env-secret-filter
    any:
      - id: csharp-bytearray-content
      - id: csharp-raw-http-post-template
