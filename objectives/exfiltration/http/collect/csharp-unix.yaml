defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  attack: T1041

traits:
  - id: csharp-raw-http-post-template
    desc: C# raw HTTP POST template
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(POST \{path\} HTTP/1\.1)'

composite_rules:
  - id: csharp-unix-file-secret-collect
    for: [csharp]
    desc: C# Unix file secret collect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/mime::mime-octet-stream
      - id: micro-behaviors/fs/path/credential::csharp-unix-secret-file-list
    any:
      - id: micro-behaviors/communications/http/request/body::csharp-bytearray-content
      - id: csharp-raw-http-post-template

  - id: csharp-unix-env-secret-collect
    for: [csharp]
    desc: C# Unix env secret collect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/mime::mime-octet-stream
      - id: micro-behaviors/os/env/enumeration::dotnet-env-secret-filter
    any:
      - id: micro-behaviors/communications/http/request/body::csharp-bytearray-content
      - id: csharp-raw-http-post-template
