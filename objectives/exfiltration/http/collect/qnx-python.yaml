defaults:
  platforms: [qnx, unix]
  for: [python, pyc]
  attack: T1041

traits:
  - id: qnx-python-collect-post
    desc: QNX Python collect POST
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'POST /collect HTTP/1\.1[\s\S]{0,260}X-Checksum'
  - id: qnx-python-sha256-exfil-header
    desc: QNX Python sha256 exfil header
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # JFrog Artifactory clients use hyphenated X-Checksum-Sha256 headers;
      # QNX stealers assign the bare X-Checksum header to a sha256 digest.
      regex: '["'']X-Checksum["'']\s*=\s*[^"''\n]{0,80}sha256|X-Checksum:\s*[^\r\n]{0,80}sha256'
