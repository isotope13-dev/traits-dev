# An off-provider service receives social-login credentials and the same code
# handles returned session material. This is stronger evidence than a generic
# delegated login API because it exposes a second party to reusable account
# credentials and the resulting session.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: third-party-social-login-session-proxy
    desc: Sends social-login credentials and accepts session fields
    conf: 0.97
    scope: leaf
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/http/request/body/credential::social-login-secrets-third-party-relay
      - id: micro-behaviors/data/serialize/schema-credential::js-social-login-session-result
