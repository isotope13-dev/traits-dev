defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-exfil-endpoint
    desc: Node exfil endpoint
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["''`]/exfil(["''`/?#]|$)'
    unless:
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
  - id: node-http-collect-post
    desc: Node HTTP collect POST
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/api/v1/collect([/?#"''\s]|$)[\s\S]{0,400}POST'
