defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: javascript-decode-input-raw-ip-post
    desc: Decode API sends caller input to a raw-IP HTTP collector
    crit: hostile
    conf: 0.99
    near_bytes: 900
    all:
      - id: micro-behaviors/data/decode/custom::javascript-decode-function
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
      - id: micro-behaviors/data/serialize/json::json-object-variable-field
