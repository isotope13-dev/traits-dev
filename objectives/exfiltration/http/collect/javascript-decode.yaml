defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: javascript-decode-input-raw-ip-post
    desc: Decode API sends caller input to a raw-IP HTTP collector
    crit: hostile
    conf: 0.99
    near_bytes: 900
    all:
      - id: metadata/file/function::javascript-decode-function-declaration
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::json-body-post
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
      - id: micro-behaviors/data/serialize/json::json-stringify-variable-value
