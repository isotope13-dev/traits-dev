defaults:
  platforms: [unix]
  for: [ruby, shell]
  attack: T1005,T1041

traits:
  - id: passwd-copy-temp-command
    desc: Command copies passwd file into temporary path
    crit: notable
    if:
      type: text
      regex: '(?i)\bcat\s+/etc/passwd\s*>\s*/(var/)?tmp/'
  - id: curl-post-temp-file-command
    desc: Curl posts data from temporary file
    crit: notable
    if:
      type: text
      regex: '(?i)\bcurl\s+(-d|--data(-binary)?)@/(var/)?tmp/'

  - id: remove-temp-file-command
    desc: Command removes a temporary file
    crit: component
    if:
      type: text
      regex: '(?i)\brm\s+(-f\s+)?/(var/)?tmp/'

composite_rules:
  - id: passwd-copy-curl-post-cleanup
    desc: Passwd data staged for curl upload
    crit: hostile
    conf: 0.98
    all:
      - id: passwd-copy-temp-command
      - id: curl-post-temp-file-command
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: remove-temp-file-command
