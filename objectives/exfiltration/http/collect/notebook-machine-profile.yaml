# A hosted-notebook gate selects browser-reachable environments before a
# hardware-stable profile (MAC-derived id, username, hostname, and public IP)
# is uploaded. The gate and stable identifier make this active host tracking,
# not ordinary aggregate telemetry.
defaults:
  platforms: [linux, macos, windows, unix]
  for: [python]
  crit: hostile
  conf: 0.96
  attack: T1082,T1041

composite_rules:
  - id: notebook-gated-machine-profile-upload
    desc: Notebook-gated stable machine profile exfiltration
    all:
      - id: objectives/discovery/system/fingerprint/hardware::python-mac-discovery
      - id: objectives/discovery/system/fingerprint/hardware::python-username
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/request/client::py-post-generic
      - id: objectives/discovery/system/fingerprint/notebook::notebook-hosted-execution-gate
