# Browser watering-hole collection.  The individual APIs are useful in
# legitimate web applications; these composites identify their combination
# with a remote POST sink and a collected location/profile payload.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1041,T1614.001,T1123
  mbc: B0030,C0002

composite_rules:
  - id: mobile-geolocation-php-post
    desc: Mobile-gated browser geolocation is posted to a PHP endpoint
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/anti-analysis/geofencing/browser::mobile-user-agent-branch
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-geolocation-current-position
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
    near_bytes: 1024

  - id: geolocation-cookie-profile-post
    desc: Browser geolocation and a tracking cookie share a profile POST
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-geolocation-current-position
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-geolocation-coordinate-read
      - id: micro-behaviors/communications/http/cookies::document-cookie-match
      - id: micro-behaviors/communications/http/request/params::browser-device-profile-request-fields
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
    near_bytes: 1024

  - id: mobile-camera-location-profile-post
    desc: Mobile browser captures camera media and location with device profiling
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/anti-analysis/geofencing/browser::mobile-user-agent-branch
      - id: micro-behaviors/hardware/display/camera::browser-media-capture-api
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-geolocation-current-position
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-geolocation-coordinate-read
      - id: micro-behaviors/ui/graphics/draw::canvas-image-data-url
      - id: objectives/discovery/system/fingerprint/network::webrtc-local-ip-discovery
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-battery-read
      - id: micro-behaviors/communications/http/request/params::browser-device-profile-request-fields
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
    near_bytes: 2048

  - id: mobile-camera-image-php-post
    desc: Mobile browser camera image is posted to PHP
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-analysis/geofencing/browser::mobile-user-agent-branch
      - id: micro-behaviors/hardware/display/camera::browser-media-capture-api
      - id: micro-behaviors/ui/graphics/draw::canvas-image-data-url
      - id: micro-behaviors/communications/http/request/params::browser-device-profile-request-fields
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
    near_bytes: 2048
