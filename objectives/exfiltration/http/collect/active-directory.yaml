# A host-language implant carries an ADSI DirectorySearcher harvest as an
# embedded PowerShell command, launches it hidden, and POSTs over HTTP in
# the same small file (the Python stage of the Teams help-desk vishing
# chain). Each leg is a separate role: the directory source, the HTTP
# sink, and the concealed launch. An overt inventory script that reports
# to an internal collector lacks the hidden-launch leg.
defaults:
  platforms: [windows]
  for: [python, javascript, typescript, vbs, batch, csharp]
  attack: T1041,T1087.002

composite_rules:
  - id: embedded-ad-description-http-exfil
    desc: Hidden embedded AD harvest with HTTP POST
    crit: hostile
    conf: 0.95
    near_lines: 80
    all:
      - id: objectives/discovery/account/ad::embedded-adsisearcher-description-harvest
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/process/create/hidden
