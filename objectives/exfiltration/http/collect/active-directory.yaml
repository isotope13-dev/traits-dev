defaults:
  platforms:
  - windows
  for:
  - python
  - javascript
  - typescript
  - vbs
  - batch
  - csharp
  attack: T1041,T1087.002
composite_rules:
- id: embedded-ad-description-http-exfil
  desc: Hidden embedded AD harvest with HTTP POST
  crit: hostile
  conf: 0.95
  near_lines: 80
  all:
  - id: objectives/discovery/account/ad::embedded-adsisearcher-description-harvest
  - id: micro-behaviors/communications/http/post
  any:
  - id: micro-behaviors/process/create/hidden
  - id: micro-behaviors/process/argument/visibility::powershell-bypass-file-hidden-flags
  - id: micro-behaviors/process/argument/visibility::batch-hidden-policy-bypass-command
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-window-short
  - id: micro-behaviors/process/argument/visibility::powershell-windowstyle-1-option
  - id: micro-behaviors/process/argument/visibility::argv-array-windowstyle-hidden
  - id: micro-behaviors/process/config/window::python-powershell-w-hidden
  - id: micro-behaviors/process/config/window::conhost-split-headless-clues
  - id: micro-behaviors/process/create/wmi::wmi-startup-hidden-window-text
  - id: micro-behaviors/process/create/wmi::wmi-startup-hidden-create-clues
  - id: micro-behaviors/process/create/wmi::wmi-execmethod-hidden-startup-clues
  - id: micro-behaviors/process/create/wmi::wmi-hidden-startup-clues
  - id: micro-behaviors/process/create/wmi::wmi-getobject-hidden-create-clues
