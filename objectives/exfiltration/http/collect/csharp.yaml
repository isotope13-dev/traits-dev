defaults:
  platforms: [windows]
  for: [csharp]
  attack: "T1555.003,T1041"
  mbc: B0028

composite_rules:
  - id: csharp-browser-credential-http-exfil
    desc: C# collects Chromium credentials and posts them over HTTP
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/browser/chromium::browser-creds-table-sql
      - id: objectives/credential-access/browser/chromium::chromium-cookie-sql
      - id: micro-behaviors/communications/http/client/managed::postasync
    unless:
      - id: well-known/tool/detection/
      - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
  - id: csharp-multi-app-http-exfil
    desc: C# multi-app credential harvest posted over HTTP
    crit: hostile
    conf: 0.98
    attack: "T1555,T1041"
    all:
      - id: objectives/credential-access/theft/multi-app::multi-app-credential-stealer
      - id: micro-behaviors/communications/http/client/managed::postasync
    unless:
      - id: well-known/tool/detection/
      - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
