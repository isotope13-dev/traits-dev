# A collected bundle posted as JSON to a bare external IP. The container
# rules under lateral-movement convict the reconnaissance (service-account
# secrets, pod environments); this one states the channel -- a hardcoded
# IP literal with no domain behind it is operator infrastructure, and the
# JSON body is everything the recon gathered.
#
# Worked example: the b10connoisseur kube-recon variant, whose module POSTs
# the collected /proc, capabilities and route tables as JSON to a hardcoded
# external IPv4.
defaults:
  crit: hostile
  conf: 0.96
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1071.001
  mbc: E1041

composite_rules:
  - id: collected-json-posted-to-external-ip
    desc: Collected data posted as JSON to external IP
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body

  - id: daemon-thread-json-posted-to-external-ip
    desc: Daemon thread posts JSON to an external IP
    all:
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: import-host-profile-json-ip-post
    desc: Import posts host identity JSON to an IP
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: objectives/exfiltration/oob/system-profile::python-host-id-fields
      - id: micro-behaviors/communications/http/request/client::urllib-json-request-body

  - id: urlopen-host-profile-to-external-ip
    desc: urlopen posts host profile to an IP
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: objectives/exfiltration/oob/system-profile::urlopen-data-kwarg
      - id: micro-behaviors/process/user/query::python-getpass-user

  - id: python-b64-host-profile-http-post
    desc: Posts base64 host profile over HTTP
    all:
      - id: micro-behaviors/data/encode/base64::b64encode-call
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
      - id: micro-behaviors/process/user/query::python-getpass-user

  - id: python-wallet-key-posted-to-ip
    desc: Posts a wallet private key to an IP
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/crypto/library/blockchain/client::python-account-from-key

  - id: python-posts-private-key-field
    desc: Posts a private_key JSON field
    conf: 0.97
    near_lines: 4
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: objectives/credential-access/cloud/datastore::quoted-private-key-field

  # Every other rule in this file names the channel -- a bare external IP with
  # no domain behind it -- and this one has to as well. A background thread
  # that reads the hostname and calls `urlopen` is how ordinary telemetry,
  # heartbeat and deregistration code is written: the destination there is a
  # configured first-party URL reached with the install's own API key, which
  # is exactly the fact the IP-literal leg tests for.
  - id: daemon-thread-host-profile-json-post
    desc: Daemon thread posts JSON host profile to an external IP
    scope: leaf
    near_lines: 30
    all:
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: python-stack-source-posted-to-ip
    desc: Posts caller source matches to an IP
    scope: file
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::python-inspect-stack-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: python-long-token-regex-posted-to-ip
    desc: Posts token regex hits to an IP
    scope: file
    all:
      - id: objectives/credential-access/wallet/provider::python-long-token-character-run
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: python-bip39-words-posted-to-ip
    desc: Posts embedded BIP-39 words to an IP
    scope: file
    all:
      - id: micro-behaviors/crypto/library/blockchain/wallet::bip39-english-wordlist-prefix
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: python-import-home-walk-ip-post
    desc: Import walks home and posts out
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

# A credential sweep posted straight out. The credential-access rules
# convict the harvesting; this states the channel -- whatever keys were
# found leave in the same breath, so the tool is an exfiltrator that
# happens to harvest, not a harvester that might exfiltrate.
#
# A sweep means at least two distinct credential sources: one provider key
# read beside an outbound POST is how every legitimate AI/cloud/translation
# SDK authenticates, not exfiltration. The generic KEY/TOKEN/SECRET literal
# marker is deliberately not a leg -- it fires on ordinary identifiers such
# as `api_key` parameters (deep_translator, litellm) and cannot support a
# hostile conclusion on its own.
#
# Worked examples: the agent-skill credential-harvester PoCs whose tool
# collects AWS/GitHub/AI-provider keys and POSTs the bundle to a collector.
  - id: credential-sweep-posted-out
    desc: Credential sweep posted to collector
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/communications/http/request/client::python-http-post-any
    any:
      - id: objectives/credential-access/env/secrets/cloud-access::aws-secret-env-access
      - id: micro-behaviors/os/env/ai-provider::python-openai-anthropic-key-env-read
      - id: micro-behaviors/os/env/vcs::python-github-token-env-read
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
    needs: 2
    unless:
      - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
      - id: objectives/credential-access/env/harvesting::llm-and-aws-sdk-client-context

  - id: python-swallows-interpolated-get
    desc: Swallows a GET that embeds a value
    scope: file
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/request/client::python-fstring-url-get
      - id: micro-behaviors/communications/http/request/client::python-request-error-returns-none

  - id: python-posts-host-field-to-raw-ip
    desc: Posts host identity to a raw IP
    scope: file
    all:
      - id: micro-behaviors/data/serialize/schema-object::host-field-key
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: python-posts-ssh-files-to-raw-ip
    desc: Posts SSH files to a raw IP
    attack: T1552.004,T1041
    scope: package
    for: [python, python-sdist]
    all:
      - id: micro-behaviors/fs/path/secret-config::ssh-directory-literal
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: python-posts-aws-config-to-raw-ip
    desc: Posts AWS config to a raw IP
    attack: T1552.001,T1041
    scope: package
    for: [python, python-sdist]
    all:
      - id: objectives/credential-access/cloud/token/files::aws-config-dup
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
