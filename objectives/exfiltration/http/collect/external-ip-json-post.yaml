# A collected bundle posted as JSON to a bare external IP. The container
# rules under lateral-movement convict the reconnaissance (service-account
# secrets, pod environments); this one states the channel -- a hardcoded
# IP literal with no domain behind it is operator infrastructure, and the
# JSON body is everything the recon gathered.
#
# Worked example: the b10connoisseur kube-recon variant, whose module POSTs
# the collected /proc, capabilities and route tables as JSON to a hardcoded
# external IPv4.
defaults:
  crit: hostile
  conf: 0.96
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1071.001
  mbc: E1041

composite_rules:
  - id: daemon-thread-json-posted-to-external-ip
    desc: Daemon thread posts JSON to an external IP
    all:
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

  - id: python-stack-source-posted-to-ip
    desc: Posts caller source matches to an IP
    scope: file
    all:
      - id: "micro-behaviors/metaprogramming/reflection::python-inspect-stack-call"
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: python-long-token-regex-posted-to-ip
    desc: Posts token regex hits to an IP
    scope: file
    all:
      - id: objectives/credential-access/wallet/provider::python-long-token-character-run
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: python-bip39-words-posted-to-ip
    desc: Posts embedded BIP-39 words to an IP
    scope: file
    all:
      - id: micro-behaviors/crypto/mnemonic::bip39-english-wordlist-prefix
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: python-import-home-walk-ip-post
    desc: Import walks home and posts out
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

# A credential sweep posted straight out. The credential-access rules
# convict the harvesting; this states the channel -- whatever keys were
# found leave in the same breath, so the tool is an exfiltrator that
# happens to harvest, not a harvester that might exfiltrate.
#
# A sweep means at least two distinct credential sources: one provider key
# read beside an outbound POST is how every legitimate AI/cloud/translation
# SDK authenticates, not exfiltration. The generic KEY/TOKEN/SECRET literal
# marker is deliberately not a leg -- it fires on ordinary identifiers such
# as `api_key` parameters (deep_translator, litellm) and cannot support a
# hostile conclusion on its own.
#
# Worked examples: the agent-skill credential-harvester PoCs whose tool
# collects AWS/GitHub/AI-provider keys and POSTs the bundle to a collector.
  - id: python-swallows-interpolated-get
    desc: Swallows a GET that embeds a value
    scope: file
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/request/client::python-fstring-url-get
      - id: micro-behaviors/communications/http/request/client::python-request-error-returns-none
