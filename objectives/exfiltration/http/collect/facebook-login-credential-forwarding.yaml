defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:

  - id: default-remote-login-api
    desc: Sets remote API as login default
    crit: notable
    if:
      type: text
      regex: 'apiServer\s*\|\|\s*["'']https?://[A-Za-z0-9.-]+'

  - id: email-password-request-body
    desc: Builds body from email and password
    crit: notable
    if:
      type: text
      regex: 'const\s+\w+\s*=\s*\{\s*email\s*,\s*password\s*\}'

  - id: post-request-url-and-body
    desc: POST request supplies URL and body
    crit: notable
    if:
      type: text
      regex: 'method:\s*["'']POST["''][\s\S]{0,160}url:\s*\w+[\s\S]{0,160}data:\s*\w+'

  - id: login-response-session-material
    desc: References access-token or cookie fields
    crit: notable
    if:
      type: text
      regex: 'data\.(access_token|accessToken|cookie|cookies)\b'

composite_rules:
  - id: facebook-credentials-to-login-api
    desc: Sends Facebook credentials to a remote login API
    crit: hostile
    conf: 0.99
    attack: T1041
    mbc: B0030
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/api-path/route::social-network-login-api-path
      - id: default-remote-login-api
      - id: micro-behaviors/communications/http/client/configure::api-default-url-outside-social-provider-hosts
      - id: email-password-request-body
      - id: post-request-url-and-body
    any:
      - id: login-response-session-material

