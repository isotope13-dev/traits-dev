defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows

traits:
  - id: ruby-exfil-upload-post
    desc: Ruby exfil upload POST
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/exfil/upload[\s\S]{0,260}Net::HTTP::Post'
composite_rules:
  - id: ruby-base64-body-raw-ip-post
    desc: Base64 body posted to a raw IP
    crit: hostile
    conf: 0.95
    attack: T1041
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/http/lib/netlib::hardcoded-ip-url
      - id: micro-behaviors/data/encode/base64::ruby-base64-urlsafe-encode
