defaults:
  for: [python]
  platforms: [unix]
  attack: T1059.004,T1005,T1041

traits:
  - id: python-shell-runner-core-secret-post
    desc: Shell dumps CI runner and posts secrets
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute object: (identifier) @os attribute: (identifier) @system)
          arguments: (argument_list (string) @command))
          (#eq? @os "os") (#eq? @system "system")
          (#match? @command "gcore[[:space:]]+-o[[:space:]]+k[.]dump")
          (#match? @command "Runner[.]Listener")
          (#match? @command "curl[[:space:]]+-d[[:space:]]+[^\n]{0,300}token=[$][(]grep")
          (#match? @command "issecret") (#match? @command "k[.]dump")
          (#match? @command "https?://[^[:space:]\"']+"))
