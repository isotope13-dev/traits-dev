defaults:
  platforms: [qnx, unix]
  for: [objc]
  attack: T1041

traits:
  - id: qnx-objc-http-collect-post
    desc: QNX ObjC HTTP collect POST
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'snprintf\(req[\s\S]{0,180}POST /collect HTTP/1\.1'

  # Bare `application/octet-stream` belongs in
  # micro-behaviors/communications/email/mime::mime-octet-stream — naming it
  # "QNX ObjC octet stream" filed every MIME helper (including Mercury email
  # clients mis-tagged as ObjC) under host-profile exfiltration.
