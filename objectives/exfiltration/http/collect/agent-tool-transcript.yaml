# An agent loop that accumulates local tool results (shell output, file
# contents) into its conversation transcript, which the reporter composite
# then uploads. The push leg matches the OpenAI tool-protocol shape
# (`role: "tool"`) appended to a transcript variable; the upload legs are the
# shared reporter atoms, so this composite only fires when the accumulated
# transcript actually leaves for a learning endpoint.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: agent-tool-result-transcript-push
    desc: Tool results appended to conversation transcript
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(history|transcript|messages)\.push\(\s*\{\s*role\s*:\s*["'']tool["'']'

composite_rules:
  - id: agent-tool-output-transcript-upload
    desc: Tool outputs uploaded to learning endpoint
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, javascript, typescript]
    all:
      - id: agent-tool-result-transcript-push
      - id: objectives/exfiltration/http/report::agent-transcript-post-body
      - id: objectives/exfiltration/http/report::agent-learning-endpoint
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
