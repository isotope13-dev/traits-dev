defaults:
  platforms:
    - unix
    - windows
  attack: T1041
  crit: suspicious
  for: [scripts, binaries]
traits:
  - id: gate-var-http
    desc: gate = http variable
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: \bgate\s*=\s*["']http
  - id: c2-var-http
    desc: c2 = http variable
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: \bc2\s*=\s*["']http
  - id: panel-var-http
    desc: panel = http variable
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: \bpanel\s*=\s*["']http
composite_rules:
  - id: multipart-upload-comp
    for: [elf, pe, python, javascript, powershell]
    desc: Multipart upload with stealer context
    crit: suspicious
    conf: 0.75
    all:
      - id: micro-behaviors/communications/http/header/custom::multipart-upload
    any:
      - id: c2-var-http
      - id: dotnet-collect-post
      - id: micro-behaviors/process/create/start-process::dotnet-process-start-info
      - id: micro-behaviors/os/sysinfo/network::dotnet-ip-global-properties
      - id: dotnet-octet-collect-post
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-read
      - id: micro-behaviors/os/package-manager/management::dotnet-pkg-info-collect
      - id: micro-behaviors/os/sysinfo/platform/runtime::dotnet-runtime-info
      - id: gate-var-http
      - id: objectives/exfiltration/http/encoded::name-uploadkey-field
      - id: objectives/exfiltration/http/encoded::namehashed-field
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
      - id: objectives/discovery/system/profile::node-process-snapshot
      - id: panel-var-http
      - id: ruby-openbsd-collect-path
      - id: objectives/discovery/system/fingerprint/info::ruby-openbsd-system-probe-set
      - id: objectives/exfiltration/http/encoded::upload-v3-path
      - id: micro-behaviors/communications/http/header/custom::bot-headers
    unless:
      - id: metadata/file/magic/identity::pe-dos-stub
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/path::tests-path-basename
      - id: well-known/lib/network/axios-legacy::axios-class
  - id: stealer-exfil
    desc: Stealer data exfiltration pattern
    crit: suspicious
    conf: 0.95
    mbc: C0001
    for:
      - shell
    needs: 3
    any:
      - id: micro-behaviors/communications/http/curl::curl-post
      - id: micro-behaviors/communications/http/upload::curl-upload
      - id: micro-behaviors/communications/http/header/custom::bot-headers
      - id: c2-var-http
      - id: dotnet-collect-post
      - id: micro-behaviors/process/create/start-process::dotnet-process-start-info
      - id: micro-behaviors/os/sysinfo/network::dotnet-ip-global-properties
      - id: dotnet-octet-collect-post
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-read
      - id: micro-behaviors/os/package-manager/management::dotnet-pkg-info-collect
      - id: micro-behaviors/os/sysinfo/platform/runtime::dotnet-runtime-info
      - id: objectives/exfiltration/http/encoded::encrypted-message-field
      - id: gate-var-http
      - id: objectives/exfiltration/http/encoded::name-uploadkey-field
      - id: objectives/exfiltration/http/encoded::namehashed-field
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
      - id: objectives/discovery/system/profile::node-process-snapshot
      - id: panel-var-http
      - id: ruby-openbsd-collect-path
      - id: objectives/discovery/system/fingerprint/info::ruby-openbsd-system-probe-set
      - id: objectives/exfiltration/http/encoded::upload-v3-path
      - id: micro-behaviors/communications/http/upload::zip-upload
