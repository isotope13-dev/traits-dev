defaults:
  platforms:
  - unix
  - windows
  attack: T1041
  crit: suspicious
  for:
  - scripts
  - binaries
traits:
- id: gate-var-http
  desc: gate = http variable
  conf: 0.7
  if:
    type: string_literal
    regex: \bgate\s*=\s*["']http
- id: c2-var-http
  desc: c2 = http variable
  conf: 0.7
  if:
    type: string_literal
    regex: \bc2\s*=\s*["']http
  unless:
  - id: metadata/package/testing/harness/unit::vitest-import
- id: panel-var-http
  desc: panel = http variable
  conf: 0.7
  if:
    type: string_literal
    regex: \bpanel\s*=\s*["']http
composite_rules:
- id: multipart-account-database-upload
  desc: Multipart request sends local account database
  crit: suspicious
  conf: 0.96
  for: [javascript, typescript]
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/form::multipart-header-syntax
  - id: micro-behaviors/fs/read/file/account::read-node-etc-passwd
  - id: micro-behaviors/communications/http/upload/file::fetch-file-read-body
- id: multipart-upload-comp
  for:
  - elf
  - pe
  - python
  - powershell
  desc: Multipart header with collection indicators
  crit: notable
  conf: 0.75
  all:
  - id: micro-behaviors/communications/http/form::multipart-header-syntax
  any:
  - id: c2-var-http
  - id: dotnet-collect-post
  - id: micro-behaviors/process/create/subprocess/configure::dotnet-process-start-info
  - id: micro-behaviors/os/sysinfo/network::dotnet-ip-global-properties
  - id: dotnet-octet-collect-post
  - id: micro-behaviors/fs/read/file/account::etc-passwd-read
  - id: micro-behaviors/os/package-manager/management::dotnet-pkg-info-collect
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::dotnet-runtime-info
  - id: gate-var-http
  - id: objectives/exfiltration/http/encoded::name-uploadkey-field
  - id: objectives/exfiltration/http/encoded::namehashed-field
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
  - id: objectives/discovery/process::process-snapshot-path-reference
  - id: panel-var-http
  - id: micro-behaviors/communications/url/transfer-path::collect-api-path-literal
  - id: objectives/discovery/system/fingerprint/info::ruby-openbsd-system-probe-set
  - id: objectives/exfiltration/http/encoded::upload-v3-path
  - id: micro-behaviors/communications/http/header/custom::identity-or-x-prefixed-headers
  unless:
  - id: metadata/file/magic/identity::pe-dos-stub
- id: multipart-sensitive-script-cluster
  for:
  - javascript
  near_bytes: 2048
  desc: Multipart and sensitive indicators nearby
  crit: notable
  conf: 0.75
  all:
  - id: micro-behaviors/communications/http/form::multipart-header-syntax
  any:
  - id: c2-var-http
  - id: dotnet-collect-post
  - id: micro-behaviors/process/create/subprocess/configure::dotnet-process-start-info
  - id: micro-behaviors/os/sysinfo/network::dotnet-ip-global-properties
  - id: dotnet-octet-collect-post
  - id: micro-behaviors/fs/read/file/account::etc-passwd-read
  - id: micro-behaviors/os/package-manager/management::dotnet-pkg-info-collect
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::dotnet-runtime-info
  - id: gate-var-http
  - id: objectives/exfiltration/http/encoded::name-uploadkey-field
  - id: objectives/exfiltration/http/encoded::namehashed-field
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
  - id: objectives/discovery/process::process-snapshot-path-reference
  - id: panel-var-http
  - id: micro-behaviors/communications/url/transfer-path::collect-api-path-literal
  - id: objectives/discovery/system/fingerprint/info::ruby-openbsd-system-probe-set
  - id: objectives/exfiltration/http/encoded::upload-v3-path
  - id: micro-behaviors/communications/http/header/custom::identity-or-x-prefixed-headers
  unless:
  - id: metadata/file/magic/identity::pe-dos-stub
