defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript]

composite_rules:
  - id: js-wallet-secret-header-transport
    desc: Wallet secret sent in HTTP header
    crit: component
    any:
      - id: objectives/exfiltration/sensitive-data::js-wallet-seed-header-exfiltration
      - id: objectives/exfiltration/sensitive-data::js-wallet-mnemonic-header-exfiltration
      - id: objectives/exfiltration/sensitive-data::js-seed-validation-header-exfiltration

  - id: js-env-file-host-transport
    desc: Environment, file, or host data exfiltration
    crit: component
    any:
      - id: objectives/exfiltration/sensitive-data::js-env-exfiltration
      - id: objectives/exfiltration/sensitive-data::js-sensitive-file-exfiltration
      - id: objectives/exfiltration/sensitive-data::js-system-info-exfiltration

  - id: js-wallet-key-material-transport
    desc: Wallet key material sent over HTTP
    crit: component
    any:
      - id: objectives/exfiltration/sensitive-data::js-wallet-key-http-exfiltration
      - id: objectives/exfiltration/sensitive-data::js-private-key-http-exfiltration
      - id: objectives/exfiltration/sensitive-data::js-wallet-password-location-exfiltration
