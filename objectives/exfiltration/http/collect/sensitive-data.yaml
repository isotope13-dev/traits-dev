defaults:
  crit: component
  platforms: [linux, windows, macos]
  for: [javascript, typescript]

composite_rules:
  - id: js-wallet-secret-header-transport
    desc: Wallet secret sent in HTTP header
    any:
      - id: objectives/exfiltration/stealer/wallet::js-wallet-seed-header-exfiltration
      - id: objectives/exfiltration/stealer/wallet::js-wallet-mnemonic-header-exfiltration
      - id: objectives/exfiltration/stealer/wallet::js-seed-validation-header-exfiltration

  - id: js-env-file-host-transport
    desc: Environment, file, or host data exfiltration
    any:
      - id: objectives/exfiltration/stealer/env::js-env-exfiltration
      - id: objectives/exfiltration/stealer/file::js-sensitive-file-exfiltration
      - id: objectives/exfiltration/stealer/system-info/profile::js-system-info-exfiltration

  - id: js-credential-secret-transport
    desc: Credential secret material sent over HTTP
    any:
      - id: objectives/exfiltration/stealer/credential::js-private-key-env-http-exfiltration
      - id: objectives/exfiltration/stealer/credential::js-private-key-http-exfiltration
      - id: objectives/exfiltration/stealer/wallet::js-wallet-password-location-exfiltration
