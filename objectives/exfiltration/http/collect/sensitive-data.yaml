defaults:
  crit: component
  platforms:
  - linux
  - windows
  - macos
  for:
  - javascript
  - typescript
composite_rules:
- id: js-wallet-secret-header-transport
  desc: Wallet secret sent in HTTP header
  any:
  - id: objectives/exfiltration/stealer/credential/value/recovery-secret::js-wallet-seed-header-exfiltration
  - id: objectives/exfiltration/stealer/credential/value/recovery-secret::js-wallet-mnemonic-header-exfiltration
  - id: objectives/exfiltration/stealer/credential/value/recovery-secret::js-seed-validation-header-exfiltration
  - id: js-wallet-key-env-fetch-to-remote-host
- id: js-env-file-host-transport
  desc: Credential environment body or host export evidence
  any:
  - id: objectives/exfiltration/stealer/configuration/environment::credential-environment-http-body
  - id: objectives/exfiltration/stealer/system-info/profile::js-system-info-exfiltration
- id: js-credential-secret-transport
  desc: Credential secret material sent over HTTP
  any:
  - id: objectives/exfiltration/stealer/credential/value/key::js-private-key-env-http-exfiltration
  - id: objectives/exfiltration/stealer/credential/value/key::js-private-key-http-exfiltration
  - id: objectives/exfiltration/stealer/credential/value/password::js-wallet-password-location-exfiltration
- id: js-wallet-key-env-fetch-to-remote-host
  desc: Wallet key env var posted to remote host by fetch
  crit: hostile
  conf: 0.9
  attack: T1041,T1552.001
  all:
  - id: objectives/credential-access/env/secrets/wallet::env-wallet-private-key
  - id: micro-behaviors/communications/http/header/custom::js-header-assigned-wallet-key-variable
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
