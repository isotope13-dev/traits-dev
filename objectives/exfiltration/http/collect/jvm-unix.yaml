defaults:
  platforms: [unix]
  for: [java, kotlin, class, java_class, jar]
  attack: T1041

traits:
  - id: jvm-collect-octet-post
    desc: JVM collect octet POST
    crit: suspicious
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: '/collect[\s\S]{0,220}application/octet-stream'
  - id: jvm-exfil-endpoint-post
    desc: JVM exfil endpoint POST
    crit: suspicious
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: '/exfil[\s\S]{0,220}requestMethod = "POST"'
  - id: jvm-exfil-path-bytecode
    desc: JVM /exfil path constant
    crit: notable
    conf: 0.92
    for: [class, java_class]
    if:
      type: hex
      pattern: 2F 65 78 66 69 6C
    unless:
      - id: metadata/file/extension/identity::python-wheel-basename
      - id: metadata/package/files/bsd::freebsd-pkg-zstd-archive
