# Silent axios GET relays that append caller-supplied data onto a hardcoded
# PaaS base URL and swallow errors. Seen in npm packages that advertise as
# loggers/validators while shipping a one-line beacon to *.vercel.app.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, archives]
  attack: T1041,T1071.001
  mbc: E1041

composite_rules:
  # The computed method hides `get`, while the empty-string/base/data shape
  # carries a runtime value in the URL. Requiring swallowed errors and two
  # direct obfuscator atoms excludes ordinary computed Axios clients.
  - id: obfuscated-silent-axios-path-relay
    desc: Obfuscated silent Axios request relays data in URL path
    crit: hostile
    conf: 0.98
    attack: T1027,T1041,T1071.001
    mbc: E1041,B0024
    all:
      - id: micro-behaviors/communications/http/get::axios-computed-method-base-data-concat
      - id: micro-behaviors/communications/http/lib/axios::axios-module-import
      - id: micro-behaviors/data/control-flow/error-handling::empty-optional-catch-text
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-variable-names
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
    unless:
      - id: metadata/package/testing/

  - id: silent-axios-vercel-path-relay
    desc: Silent axios GET relays caller data to a Vercel endpoint
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/get::axios-get-template-base-concat
      - id: micro-behaviors/communications/http/endpoints::vercel-app
      - id: micro-behaviors/data/control-flow/error-handling::empty-optional-catch-text
    unless:
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/harness/
