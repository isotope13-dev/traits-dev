defaults:
  platforms: [windows]
  for: [go]
  attack: T1041

composite_rules:
  - id: go-windows-mail-or-credential-http-exfil
    desc: Go mailbox or credential HTTP collection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/endpoint::go-exfil-endpoint-path
      - id: micro-behaviors/communications/http/post::http-newrequest-post
    any:
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
      - id: objectives/credential-access/email/outlook::go-outlook-mail-harvest
      - id: objectives/credential-access/email/thunderbird::go-thunderbird-mail-harvest
      - id: objectives/credential-access/credential-manager/cli::go-exec-cmdkey-list
    needs: 2
