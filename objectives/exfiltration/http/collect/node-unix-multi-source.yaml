defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: node-development-data-http-collector
    desc: Node HTTP collection with developer-data clues
    crit: hostile
    conf: 0.99
    attack: "T1552.001, T1552.004, T1552.005, T1041"
    mbc: "E1552, E1041"
    needs: 2
    any:
      - id: micro-behaviors/os/env/modify::node-process-env-object-assignment
      - id: micro-behaviors/os/security/auth/cloud::node-cloud-credential-source-reference
      - id: objectives/exfiltration/stealer/dev-secret::node-developer-secret-file-sources
      - id: objectives/collection/file-targeting/command::node-sensitive-find-command
      - id: micro-behaviors/process/create/vcs/git::node-git-config-remote-harvest
    all:
      - id: objectives/exfiltration/stealer/dev-secret::node-custom-exfil-sink
