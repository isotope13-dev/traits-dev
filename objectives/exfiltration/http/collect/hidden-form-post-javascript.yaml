defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

composite_rules:
- id: js-hidden-form-post
  desc: Hidden form POST via iframe sink
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/ui/window/dom/create::browser-create-form-element
  - id: micro-behaviors/communications/http/form::dom-post-method
  - id: micro-behaviors/communications/http/form::dom-hidden-target
  - id: micro-behaviors/ui/window/navigation::browser-form-submit
  - id: micro-behaviors/ui/window/visibility::hidden-iframe
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
