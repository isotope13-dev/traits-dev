defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

traits:
- id: dom-post-method
  desc: Assigns POST form method
  crit: component
  conf: 0.82
  if:
    type: text
    regex: \.method\s*=\s*['"]POST['"]
- id: dom-hidden-target
  desc: Assigns invisible form target
  crit: suspicious
  conf: 0.86
  if:
    type: text
    regex: \.target\s*=\s*['"]invisible['"]

composite_rules:
- id: js-hidden-form-post
  desc: Hidden form POST via iframe sink
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/ui/window/dom/create::browser-create-form-element
  - id: dom-post-method
  - id: dom-hidden-target
  - id: micro-behaviors/ui/window/navigation::browser-form-submit
  - id: micro-behaviors/data/format/html::hidden-iframe
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
