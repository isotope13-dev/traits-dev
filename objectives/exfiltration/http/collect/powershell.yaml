defaults:
  platforms: [windows, unix, appliance]
  for: [powershell]
  attack: T1041

traits:
  - id: ps-send-exfil-function
    desc: PowerShell exfil send function
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: function Send-Exfiltration

composite_rules:
  - id: ps-http-collect-exfil
    desc: PowerShell HTTP collect exfil
    crit: hostile
    conf: 0.98
    all:
      - id: ps-send-exfil-function
    any:
      - id: micro-behaviors/communications/http/upload::powershell-binary-body-post
      - id: micro-behaviors/communications/http/url/telemetry::collect-post-request
