defaults:
  platforms: [windows, unix, appliance]
  for: [powershell]
  attack: T1041

traits:
  - id: ps-send-exfil-function
    desc: PowerShell exfil send function
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: function Send-Exfiltration

  - id: ps-http-collect-webrequest
    desc: PowerShell collect webrequest
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'Invoke-WebRequest[\s\S]{0,220}-Method POST[\s\S]{0,220}application/octet-stream'

composite_rules:
  - id: ps-http-collect-exfil
    desc: PowerShell HTTP collect exfil
    crit: hostile
    conf: 0.98
    all:
      - id: ps-send-exfil-function
    any:
      - id: ps-http-collect-webrequest
      - id: micro-behaviors/communications/http/url/telemetry::collect-post-request

  - id: powershell-process-commandline-http-exfil
    desc: PowerShell sends a process command line to an external HTTP endpoint
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/info/commandline::powershell-process-commandline-property
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal

  - id: powershell-network-status-http-exfil
    desc: PowerShell sends network connection status to an external HTTP endpoint
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/network/status::netstat
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
