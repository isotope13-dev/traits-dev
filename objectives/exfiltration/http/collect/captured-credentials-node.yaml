defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030
traits:
  - id: obfuscated-credential-payload
    desc: Obfuscates credential payload values
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: symbol
      kind: call
      exact: _obfuscatePayload
composite_rules:
  - id: node-captured-credentials-http-exfil
    desc: Captured credentials sent over HTTP
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/auth/secret::capture-all-credentials-call
      - id: micro-behaviors/communications/http/url/endpoint::credential-endpoint-literal
      - id: obfuscated-credential-payload
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/body::request-write-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/build/
