# This package's login helper forwards Facebook account credentials to its
# configured external API host, which returns Facebook session material.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

traits:
  - id: cexy-facebook-login-api-host
    desc: Contains a minhdong.site URL
    crit: notable
    if:
      type: text
      substr: https://minhdong.site

  - id: cexy-facebook-ios-login-route
    desc: References the Facebook iOS login route
    crit: notable
    if:
      type: text
      substr: /api/v1/facebook/login_ios

  - id: cexy-facebook-login-default-host
    desc: Sets minhdong as the default API host
    crit: notable
    if:
      type: text
      substr: 'apiBaseUrl || config2.apiServer || "https://minhdong.site"'

  - id: cexy-facebook-email-password-body
    desc: Builds a body from email and password
    crit: notable
    if:
      type: text
      regex: 'const body\s*=\s*\{\s*email\s*,\s*password\s*\}'

  - id: cexy-facebook-login-post
    desc: POSTs body to login API endpoint
    crit: notable
    if:
      type: text
      regex: 'method:\s*["'']POST["''][\s\S]{0,160}url:\s*endpoint[\s\S]{0,160}data:\s*body'

  - id: cexy-facebook-login-returns-session
    desc: Accepts an access token or cookie response
    crit: notable
    if:
      type: text
      regex: 'data\.(access_token|accessToken|cookie|cookies)\b'

composite_rules:
  - id: cexy-facebook-credentials-to-login-api
    desc: Sends Facebook email and password to a third-party login API
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: cexy-facebook-login-api-host
      - id: cexy-facebook-ios-login-route
      - id: cexy-facebook-login-default-host
      - id: cexy-facebook-email-password-body
      - id: cexy-facebook-login-post
    any:
      - id: cexy-facebook-login-returns-session

  - id: cexy-package-credential-forwarding
    desc: npm package forwards Facebook credentials to a remote API
    crit: hostile
    conf: 0.99
    for: [npm, javascript, typescript]
    scope: package
    near_bytes: 4096
    all:
      - id: cexy-facebook-login-api-host
      - id: cexy-facebook-ios-login-route
      - id: cexy-facebook-login-default-host
      - id: cexy-facebook-email-password-body
      - id: cexy-facebook-login-post
    any:
      - id: cexy-facebook-login-returns-session
