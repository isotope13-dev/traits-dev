defaults:
  platforms: [unix, windows]
  for: [perl]
  size_max: 262144

composite_rules:
  # A VM-aware guard plus host/user POST context does not claim that any
  # separately collected secret map reaches the body.
  - id: perl-vm-aware-host-user-post-profile
    desc: VM-aware Perl host/user POST profile
    crit: hostile
    conf: 0.95
    attack: T1041,T1082,T1497
    scope: file
    all:
      - id: objectives/anti-analysis/sandbox-detect/script::perl-hostname-vm-pattern
      - id: micro-behaviors/os/env/user-info::perl-user-env-field-reference
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-useragent
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-post-interpolated-host-user-fields
      - id: micro-behaviors/communications/http/post::perl-post-http-url
      - id: metadata/lang/source/syntax/control-flow::perl-postfix-call-return-guard-text
