defaults:
  platforms: [unix, macos, linux, windows]
  for: [ruby]
  crit: hostile
  conf: 0.96
  attack: T1041,T1082

composite_rules:
  - id: ruby-http-post-hostname-exfil
    desc: Ruby posts system hostname over HTTP
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
      - id: micro-behaviors/communications/http/post::net-http-post
