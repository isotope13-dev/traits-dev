defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - attack: T1041
    id: pypi-custom-install-identity-exfil
    desc: PyPI install exfils host identity webhook
    crit: hostile
    conf: 0.98
    mbc: E1041
    all:
    - id: metadata/package/files/included::setup-py-basename
    - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
    - id: micro-behaviors/communications/http/telemetry::python-host-user-get-call-text
    - id: micro-behaviors/communications/url/host/oob/endpoint::pipedream
