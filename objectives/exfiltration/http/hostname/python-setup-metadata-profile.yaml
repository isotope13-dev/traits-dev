defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-custom-egg-info-host-profile-get
    desc: Custom metadata hook sends hex-encoded host identity by HTTP GET
    crit: hostile
    conf: 0.98
    attack: T1041,T1082,T1195.002
    mbc: E1041
    scope: outer
    for: [python, python-sdist, zip, whl]
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-egg-info
      - id: metadata/build/package/recipe/setup-hooks::setuptools-egg-info-run-override
      - id: metadata/import/python/requests::requests
      - id: micro-behaviors/communications/url/scheme::python-cleartext-http-url-literal
      - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
      - id: micro-behaviors/data/encode/hex::python-bytes-hex-call
