composite_rules:
- platforms:
  - linux
  - unix
  - macos
  - android
  - ios
  for:
  - shell
  id: shell-hex-identity-transfer
  desc: Host identity sent in hex URL hostname
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/url::shell-identity-hex-hostname-request
  - id: micro-behaviors/data/encode/hex::hex-encode-xxd
