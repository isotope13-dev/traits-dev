defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1195.002,T1033,T1041

traits:
  - id: python-install-whoami-requests-post
    desc: Install posts whoami output to URL
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (assignment left: (identifier) @result right: (call
                function: (attribute object: (identifier) @subprocess attribute: (identifier) @subrun)
                arguments: (argument_list (list (string) @whoami)))))
              (expression_statement (assignment left: (identifier) @username right: (call
                function: (attribute object: (attribute object: (identifier) @result2 attribute: (identifier) @stdout) attribute: (identifier) @strip))))
              (expression_statement (assignment left: (identifier) @url right: (string) @urlvalue))
              (expression_statement (assignment left: (identifier) @data right: (dictionary
                (pair key: (string) @userkey value: (identifier) @username2))))
              (try_statement body: (block (expression_statement (assignment right: (call
                function: (attribute object: (identifier) @requests attribute: (identifier) @post)
                arguments: (argument_list (identifier) @url2 (keyword_argument name: (identifier) @dataarg value: (identifier) @data2)))))))))))
          (expression_statement (call function: (identifier) @setup arguments: (argument_list
            (keyword_argument name: (identifier) @cmdclass value: (dictionary
              (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @hook @registered) (#eq? @install "install") (#eq? @run "run")
          (#eq? @subprocess "subprocess") (#eq? @subrun "run") (#match? @whoami "^.whoami.$")
          (#eq? @result @result2) (#eq? @stdout "stdout") (#eq? @strip "strip")
          (#eq? @username @username2) (#match? @userkey "^.username.$")
          (#eq? @requests "requests") (#eq? @post "post") (#eq? @url @url2)
          (#match? @urlvalue "https?://") (#eq? @dataarg "data") (#eq? @data @data2)
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#match? @installkey "^.install.$"))
