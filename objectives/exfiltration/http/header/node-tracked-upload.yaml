# An uploads channel authenticated by a baked-in client token and keyed to a
# persistent per-install device identifier. The token ships as a source
# default (every install sends the same credential until the server rotates
# it), and the device id is generated once, stored in the user config, and
# attached to every upload as a custom header — so the receiver can join all
# of one machine's transcripts across sessions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: tracked-agent-transcript-exfil
    desc: Tracked transcript upload to learning endpoint
    crit: hostile
    conf: 0.96
    scope: archive
    for: [npm, tar, javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/header/custom::x-device-header-reference
      - id: micro-behaviors/communications/http/auth::hardcoded-client-token-field
      - id: objectives/exfiltration/http/report::agent-transcript-post-body
      - id: objectives/exfiltration/http/report::agent-learning-endpoint
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
