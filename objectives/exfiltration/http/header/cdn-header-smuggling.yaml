# A request that carries reversed slices of a value in CloudFront's own
# response headers is smuggling that value past inspection: the client has
# no reason to send CDN headers, and reversing the pieces only defeats
# pattern matching. @solana/web3.js 1.95.7 (2024) split every base58 secret
# key it saw across x-amz-cf-id, x-amz-cf-pop and x-session-id and POSTed
# it to sol-rpc.xyz. The value, host and header split are attacker-chosen.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1001.003

composite_rules:
  - id: reversed-value-in-cloudfront-request-headers
    desc: Request smuggles reversed value slices in spoofed CloudFront headers
    crit: hostile
    conf: 0.95
    near_bytes: 500
    all:
      - id: micro-behaviors/communications/http/header/custom::js-cloudfront-header-map-entry
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/post::request-options-post-method
