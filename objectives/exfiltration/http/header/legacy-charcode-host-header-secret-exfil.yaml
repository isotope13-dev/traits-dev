defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: charcode-host-header-secret-exfil
    desc: Char-code host, POST and encoded header clues
    conf: 0.99
    scope: file
    attack: T1027.010,T1552.004,T1041,T1071.001
    mbc: E1041
    all:
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/data/encode/char-code::long-numeric-array-literal
      - id: micro-behaviors/os/telemetry/logging/analytics::x-request-id-header-map-entry
      - id: micro-behaviors/communications/http/header/content-type::grpc-web-protobuf-content-type
      - id: micro-behaviors/data/encode/base64/primitive::node-buffer-base64-encode
    any:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/post::node-http-request-post

