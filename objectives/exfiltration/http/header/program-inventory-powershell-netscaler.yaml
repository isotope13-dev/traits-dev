defaults:
  platforms: [netscaler, appliance, windows]
  for: [powershell]
  attack: T1555.003

composite_rules:
  - id: ps-exfil-header-channel
    desc: "Exfiltration headers with credential or DNS context"
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/http/header::ps-exfil-http-headers
    any:
      - id: objectives/credential-access/browser/multi-target::ps-browser-login-data-read
      - id: objectives/credential-access/browser/firefox::ps-firefox-key4-read
      - id: objectives/exfiltration/dns/prep::ps-dns-exfil-query
