defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  attack: T1195.002
composite_rules:
  - id: npmrc-token-header-smuggler
    desc: npmrc token exfiltrated via HTTP header
    crit: hostile
    conf: 0.97
    mbc: E1555
    attack: T1555.003
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/string/replace::npm-auth-prefix-replacement
      - id: micro-behaviors/communications/http/header/referer::referer-dynamic-concatenation
    any:
      - id: micro-behaviors/communications/url/host/http::referer-dummy-url-pattern
      - id: micro-behaviors/communications/http/get::node-https-get-reference
