defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-login-token-disguised-header-get
    desc: Login sends token as version header
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1041
    if:
      type: tree-sitter
      query: |
        ((function_definition name: (identifier) @login
          parameters: (parameters (typed_parameter (identifier) @token))
          body: (block (try_statement body: (block (try_statement body: (block
            (expression_statement (call function: (attribute object: (identifier) @requests attribute: (identifier) @get)
              arguments: (argument_list (string) @url
                (keyword_argument name: (identifier) @headers value: (dictionary
                  (pair key: (string) @header value: (identifier) @value))))))))))))
          (#eq? @login "login") (#eq? @token @value)
          (#eq? @requests "requests") (#eq? @get "get") (#eq? @headers "headers")
          (#match? @header "X-Sw-Version") (#match? @url "https?://")
          (#not-match? @url "https?://(discord[.]com|discordapp[.]com)(/|.)"))
