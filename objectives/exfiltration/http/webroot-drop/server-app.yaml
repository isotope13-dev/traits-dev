# Loot parked inside a compromised server's own web-served directory.
#
# An attacker with command execution on an application server -- but no
# outbound channel, or none they want to use -- writes harvested data into a
# directory the compromised product already serves, then collects it with an
# ordinary HTTP GET. The exfiltration rides the victim's own listener, so it
# needs no C2 callback and blends into normal web traffic. The PaperCut
# print-server intrusions did this, dropping recon and credential output as
# "pcp_*.txt" under the server's `custom/web` content directory.
#
# A web-served data-file path is neutral on its own -- applications write
# reports and exports into their own content directories -- so these
# composites require it to co-occur with the harvesting that produced it.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]

composite_rules:
  - id: web-served-credential-loot-drop
    for: [binaries, '!dex', scripts, '!jcl']
    desc: Credential loot staged in web directory
    crit: hostile
    conf: 0.97
    attack: T1074.001,T1041
    all:
      - id: micro-behaviors/fs/path/webserver::web-served-data-file-path
    any:
      - id: objectives/credential-access/files/
      - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
      - id: objectives/credential-access/memory::mimilove-lsass-memory-credential-dump
      - id: objectives/credential-access/memory::mimikatz-credential-memory-dump
      - id: objectives/credential-access/memory::powershell-reflective-logonpasswords
      - id: objectives/credential-access/memory::rubeus-ticket-harvest-and-injection
      - id: objectives/credential-access/registry/access::powershell-sam-des-hash-decryption
      - id: objectives/collection/file-copy/sensitive::phished-secret-store-copies
    needs: 1
    unless:
      # An incident writeup quotes the dumped credentials.txt and its web path
      # as prose; documentation reports the staging, it does not perform it.
      - id: metadata/file/extension/identity::markdown-file-basename

  - id: web-served-recon-output-drop
    for: [pe, class, pyc, beam, wasm, batch, powershell, staticlib]
    desc: Recon output staged in web directory
    crit: suspicious
    conf: 0.93
    attack: T1074.001,T1082
    all:
      - id: micro-behaviors/os/sysinfo/profile::windows-survey-command-cluster
      - id: micro-behaviors/fs/path/webserver::web-served-data-file-path
