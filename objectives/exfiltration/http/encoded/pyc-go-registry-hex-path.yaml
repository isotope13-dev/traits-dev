# Version-independent bytecode counterpart of the Artifactory Go-path channel
# (artifactory-go.yaml): the module carries the Go API route, the /@v/list
# suffix that makes the request a module-version lookup, a hex encoder and
# an HTTP basic-auth handler. Data rides in the module path of a registry
# request so egress looks like dependency resolution.
defaults:
  platforms: [unix, windows]
  for: [pyc]
  attack: T1041,T1071.001
  mbc: E1041

composite_rules:
  - id: pyc-hex-go-registry-path-basic-auth
    desc: Bytecode hex-encodes data into Go registry paths
    # Name co-occurrence only: route-near-miss.pyc carries every name but
    # routes the username, not the encoded content. Hostile needs the
    # bound bytecode flow (python314-audit-registry-content-egress).
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/artifactory::pyc-go-registry-api-route
      - id: metadata/binary/code/bytecode::pyc-go-version-list-route
      - id: metadata/binary/code/bytecode::pyc-hex-encoder-name
      - id: metadata/binary/code/bytecode::pyc-basic-auth-handler-name
