# URL-path exfiltration: stolen data encoded (often base64) into an HTTP path
# segment such as /exfil/<payload>, then fetched by an assistant or client to
# an OOB webhook. CoSnitch-class AI fetch abuse is one consumer of this shape.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, html, markdown, text, shell]
  attack: T1567,T1041
  mbc: E1010

traits:
  - id: url-path-exfil-prefix
    desc: HTTP path uses /exfil/ payload prefix
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/offensive/bingo/
    if:
      type: text
      regex: '(?i)(/|%2[fF])exfil(/|%2[fF])'

composite_rules:
  - id: oob-url-path-base64-exfil
    desc: OOB webhook URL embeds base64 in /exfil path
    crit: hostile
    conf: 0.98
    # Copilot autorun prompts pack long instructions before the /exfil/<b64>
    # webhook URL; keep proximity wide enough for that single deep-link shape.
    near_bytes: 900
    all:
      - id: url-path-exfil-prefix
      - id: micro-behaviors/communications/http/url/encoded::long-base64-like-path-segment
      - id: objectives/exfiltration/oob/endpoint

  - id: assistant-autorun-oob-path-exfil
    desc: Assistant autorun URL with OOB path exfil
    crit: hostile
    conf: 0.99
    near_bytes: 900
    all:
      - id: micro-behaviors/communications/http/url/query::microsoft-copilot-autorun-prompt-url
      - id: url-path-exfil-prefix
      - id: objectives/exfiltration/oob/endpoint
