# Hex payloads stuffed into Artifactory Go-module API URL paths.
# Used by PyPI "telemetry" packages that abuse an internal registry proxy as
# a covert exfil channel (payload sits in the module path, Basic Auth is a
# stolen reader account, TLS verification is often disabled).
# ATT&CK: T1041, T1552.001, T1071.001
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: "T1041"
  mbc: "E1041"

composite_rules:
  - id: python-artifactory-go-hex-path-exfil
    desc: Hex payload exfiltrated via Artifactory Go API path
    crit: hostile
    conf: 0.97
    attack: "T1041,T1071.001"
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/artifactory::go-api-route
      - id: micro-behaviors/data/encode/hex::string-encode-hex
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object

  - id: python-tls-bypass-registry-basic-auth-exfil
    desc: TLS-disabled urllib uses harvested registry Basic Auth
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1041,T1573"
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/socket/ssl::tls-validation-fully-disabled
      - id: micro-behaviors/communications/http/basic-auth::python-basic-auth-b64-header
      - id: micro-behaviors/os/env/vars/credentials::python-reader-password-env-suffix
      - id: micro-behaviors/communications/http/client/library::urllib-request
    any:
      - id: micro-behaviors/os/env/vars/credentials::python-reader-username-env-suffix
      - id: micro-behaviors/communications/http/services/artifactory::go-api-route
