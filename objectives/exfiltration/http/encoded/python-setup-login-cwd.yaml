defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-install-encoded-login-cwd-url
    desc: Install sends encoded login and cwd
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1082,T1041
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (try_statement body: (block
              (expression_statement (call
                function: (attribute object: (call function: (identifier) @urlopen
                  arguments: (argument_list (binary_operator) @url)) attribute: (identifier) @read)))))))
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (call function: (identifier) @invoke))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @cmdclass
              value: (dictionary (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @urlopen "urlopen") (#eq? @read "read")
          (#eq? @helper @invoke) (#eq? @install "install") (#eq? @run "run")
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#eq? @hook @registered)
          (#match? @installkey "^.install.$") (#match? @url "https?://")
          (#match? @url "base64[.]urlsafe_b64encode") (#match? @url "os[.]getlogin")
          (#match? @url "os[.]getcwd")
          (#not-match? @url "https?://(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @url "https?://172[.](1[6-9]|2[0-9]|3[01])[.]"))
