defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-redundant-base64-host-profile-exfil
  desc: redundant npm hooks exfil host profile
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: objectives/exfiltration/http/encoded::npm-preinstall-base64-host-profile-exfil
  - id: metadata/package/scripts/lifecycle::multiple-install-hooks
# An install lifecycle hook that detaches a child and grants a remote Deno
# stage all permissions is an intent-level supply-chain dropper pattern. The
# runtime/IP and package names are deliberately not part of the signature.
