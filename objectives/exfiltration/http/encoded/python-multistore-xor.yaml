defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-multistore-credentials-xor-http
    desc: SSH/cloud credential collection accompanies XOR HTTP
    crit: hostile
    conf: 0.97
    attack: T1552.001,T1552.004,T1041
    all:
      - id: micro-behaviors/communications/http/request/credentials/file::python-ssh-listing-upload-context
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/secret-config::kube-config
      - id: micro-behaviors/data/encoding/xor::python-xor-bytes-comprehension
      - id: micro-behaviors/communications/http/request/json::urllib-request-json-keyword-body
