defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: setup-invokes-history-curl-function
    desc: Setup calls function posting shell history
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper
            body: (block
              (expression_statement (assignment left: (identifier) @cmd right: (string) @payload))
              (expression_statement (call function: (attribute object: (identifier) @sub attribute: (identifier) @run)
                arguments: (argument_list (identifier) @cmd_arg
                  (keyword_argument name: (identifier) @shell value: (true)))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument value: (call function: (identifier) @called))))))
          (#eq? @sub "subprocess") (#eq? @run "run") (#eq? @shell "shell")
          (#eq? @cmd @cmd_arg) (#eq? @setup "setup") (#eq? @helper @called)
          (#match? @payload "curl[[:space:]]+-X[[:space:]]+POST")
          (#match? @payload "cat[[:space:]]+~/[.]bash_history")
          (#match? @payload "https?://"))

composite_rules:
  - id: setup-posts-shell-history
    desc: Setup posts shell history via curl
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1552.003,T1041
    scope: file
    all:
      - id: setup-invokes-history-curl-function
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/fs/path/activity-history::bash-history-path-literal
