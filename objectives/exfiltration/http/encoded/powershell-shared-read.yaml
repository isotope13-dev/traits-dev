# Proximity records the upload pattern without claiming proven value flow.
# Vault and configuration paths distinguish this from a generic log uploader.
# Online vault backup agents can legitimately use this combination.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious

composite_rules:
  - id: powershell-shared-read-base64-post
    desc: KeePass paths accompany shared file opens, Base64 encoding and POST bodies
    near_lines: 30
    all:
      - id: micro-behaviors/fs/file/open/call::dotnet-file-open
      - id: micro-behaviors/fs/file/open/flags::powershell-readwrite-file-sharing
      - id: micro-behaviors/data/buffer/transfer::dotnet-copyto-call
      - id: micro-behaviors/data/encode/base64/primitive::to-base64-string
      - id: micro-behaviors/communications/http/request/payload::powershell-http-post-body
      - id: micro-behaviors/fs/path/credential/password-store::kdbx-extension-reference
      - id: micro-behaviors/fs/path/credential/password-store::keepass-config-path
