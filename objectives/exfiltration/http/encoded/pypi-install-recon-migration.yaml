defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1195.002
composite_rules:
- id: python-setup-exit-hook-base64-hostname-get
  desc: Setup exit hook sends encoded host name
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1195.002
  scope: file
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/process/exit/handler::atexit-register
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/os/sysinfo/hostname/query::getfqdn
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/services/file-hosting::herokuapp-com

- id: pypi-atexit-exfil
  desc: Setup file has exit handler and request
  crit: suspicious
  conf: 0.95
  mbc: E1041
  attack: T1020
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/process/exit/handler::atexit-register
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/request/client/call::request-python
- id: python-setup-atexit-host-profile-get-exfil
  desc: Setup exit hook sends host profile over HTTP
  crit: hostile
  conf: 0.99
  attack: T1041,T1082,T1195.002
  scope: file
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/process/exit/handler::atexit-register
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/get::requests-get
- id: python-b64-public-ip-query-get
  desc: Base64 GET and public IP clues
  crit: suspicious
  conf: 0.95
  attack: T1041,T1082
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
