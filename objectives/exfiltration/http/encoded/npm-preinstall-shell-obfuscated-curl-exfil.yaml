defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: preinstall-shell-obfuscated-curl-exfil
  desc: Preinstall shell script obfuscated curl POST exfil
  crit: hostile
  conf: 0.97
  attack: "T1195.002,T1041"
  mbc: "E1041"
  for: [npm, package.json, shell]
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-shell-local-script
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/communications/http/curl/command::sh-letter-var-http-client-rebuild
  - id: micro-behaviors/communications/http/curl/command::sh-curl-post-backtick-data
  - id: micro-behaviors/communications/url/reference::shell-http-url-reference
