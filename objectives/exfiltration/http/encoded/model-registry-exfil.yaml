# Command output leaves as registry records: the client encodes the result
# and registers it as one or more model names. The registry path plus an
# encoded POST body is the exfiltration; neither a plain registration nor a
# plain encoded upload is enough on its own.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041

composite_rules:
- id: model-registry-encoded-exfil
  desc: Posts encoded data as model registrations
  crit: hostile
  conf: 0.97
  scope: file
  near_lines: 80
  all:
  - id: micro-behaviors/communications/http/url/api-path/route::model-registrations-api-path
  - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
  any:
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/post/
