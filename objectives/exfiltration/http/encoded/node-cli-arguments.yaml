defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: node-cli-arguments-oob-path-exfil
    desc: Sends encoded CLI arguments to webhook
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/process/info/commandline::check-argv
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/url/construction/build-http::webhook-template-interpolated-path
    any:
      - id: micro-behaviors/communications/http/request/client/call::https-request
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
    unless:
      - id: micro-behaviors/os/security/scan/documentation/
