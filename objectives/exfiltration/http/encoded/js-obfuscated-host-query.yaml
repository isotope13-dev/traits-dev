defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1027,T1041,T1082
traits:
  - id: os-computed-hostname-assignment
    desc: Reads a computed OS hostname property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'hostname\s*=\s*os\['
  - id: os-computed-username-assignment
    desc: Reads a computed OS username property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'username\s*=\s*os\['
  - id: http-computed-get-call
    desc: Calls HTTP get using computed property
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'http\[["\x27]get["\x27]\]\('
composite_rules:
  - id: js-obfuscated-host-http-query
    desc: Obfuscated host profile sent as HTTP query
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::obfuscated-external-http-ip
      - id: os-computed-hostname-assignment
      - id: os-computed-username-assignment
      - id: http-computed-get-call
      - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
