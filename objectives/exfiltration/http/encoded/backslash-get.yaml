# Unit 42 describes a custom HTTP-like exfiltration request beginning with a
# literal backslash-GET and carrying a 250--666 character encoded payload.
# Match the wire shape, not prose or the article's sample payload.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  attack: T1041,T1027
  mbc: B0030

traits:
  - id: backslash-get-encoded-http-request
    desc: Long encoded backslash-GET HTTP request
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\\GET\s+[0-9A-Z]{4}[0-9A-F]{242,658}[0-9A-Z]{4}\s+HTTP/1\.[01]'
      case_insensitive: true

composite_rules:
  - id: backslash-get-direct-ip-exfiltration
    desc: Encoded backslash-GET direct-IP exfiltration
    crit: hostile
    conf: 0.99
    near_bytes: 1024
    all:
      - id: backslash-get-encoded-http-request
      - id: micro-behaviors/communications/ip/direct::external-ipv4-websocket-url
