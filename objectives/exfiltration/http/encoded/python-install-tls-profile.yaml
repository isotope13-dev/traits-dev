defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: install-tls-encoded-host-profile
    desc: Install sends encoded host profile over TLS
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1082,T1041
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (assignment left: (identifier) @target right: (string) @host))
              (try_statement body: (block
                (expression_statement (assignment left: (identifier) @hostname right: (call function: (attribute object: (identifier) @socket attribute: (identifier) @gethostname))))
                (expression_statement (assignment left: (identifier) @cwd right: (call function: (attribute object: (identifier) @os attribute: (identifier) @getcwd))))
                (expression_statement (assignment left: (identifier) @user right: (call function: (attribute object: (identifier) @getpass attribute: (identifier) @getuser))))
                (expression_statement (assignment left: (identifier) @payload right: (dictionary
                  (pair key: (string) @hostkey value: (identifier) @hostname2)
                  (pair key: (string) @cwdkey value: (identifier) @cwd2)
                  (pair key: (string) @userkey value: (identifier) @user2))))
                (expression_statement (assignment left: (identifier) @encoded right: (call function: (attribute
                  object: (call function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
                    arguments: (argument_list (call function: (attribute object: (call
                      function: (attribute object: (identifier) @json attribute: (identifier) @dumps)
                      arguments: (argument_list (identifier) @payload2)) attribute: (identifier) @encode))))
                  attribute: (identifier) @decode))))
                (expression_statement (assignment left: (identifier) @request right: (string
                  (interpolation expression: (identifier) @encoded2)
                  (interpolation expression: (identifier) @target2)) @http))
                (expression_statement (assignment left: (identifier) @wrapped right: (call
                  function: (attribute object: (identifier) @context attribute: (identifier) @wrap)
                  arguments: (argument_list (identifier) (keyword_argument name: (identifier) @servername value: (identifier) @target3)))))
                (expression_statement (call function: (attribute object: (identifier) @wrapped2 attribute: (identifier) @connect)
                  arguments: (argument_list (tuple (identifier) @target4 (integer)))))
                (expression_statement (call function: (attribute object: (identifier) @wrapped3 attribute: (identifier) @send)
                  arguments: (argument_list (call function: (attribute object: (identifier) @str attribute: (identifier) @encode2)
                    arguments: (argument_list (identifier) @request2)))))))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @cmdclass
              value: (dictionary (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @install "install") (#eq? @run "run") (#eq? @hook @registered) (#eq? @setup "setup")
          (#eq? @cmdclass "cmdclass") (#match? @installkey "^.install.$")
          (#eq? @socket "socket") (#eq? @gethostname "gethostname") (#eq? @hostname @hostname2)
          (#eq? @os "os") (#eq? @getcwd "getcwd") (#eq? @cwd @cwd2) (#eq? @getpass "getpass")
          (#eq? @getuser "getuser") (#eq? @user @user2) (#match? @hostkey "hostname")
          (#match? @cwdkey "cwd") (#match? @userkey "username") (#eq? @payload @payload2)
          (#eq? @base64 "base64") (#eq? @b64 "b64encode") (#eq? @json "json") (#eq? @dumps "dumps")
          (#eq? @encode "encode") (#eq? @decode "decode") (#eq? @encoded @encoded2) (#match? @http "GET /")
          (#eq? @target @target2) (#eq? @target @target3) (#eq? @target @target4) (#eq? @servername "server_hostname")
          (#eq? @wrap "wrap_socket") (#eq? @wrapped @wrapped2) (#eq? @wrapped @wrapped3) (#eq? @connect "connect")
          (#eq? @send "send") (#eq? @str "str") (#eq? @encode2 "encode") (#eq? @request @request2)
          (#match? @host "[.]")
          (#not-match? @host "^.(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @host "^.172[.](1[6-9]|2[0-9]|3[01])[.]")
          (#not-match? @host "^.(169[.]254[.]|0[.]0[.]0[.]0)")
          (#not-match? @host "[.](local|internal).$"))
