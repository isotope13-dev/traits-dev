defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-module-encodes-profile-into-request-url
    desc: Module call encodes host profile in URL
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (assignment left: (identifier) @data right: (_) @profile))
            (try_statement body: (block
              (expression_statement (assignment left: (identifier) @encoded
                right: (binary_operator right: (call function: (identifier) @str
                  arguments: (argument_list (call function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
                    arguments: (argument_list (call function: (attribute object: (identifier) @data2 attribute: (identifier) @encode)))))))))))
            (try_statement body: (block
              (expression_statement (call function: (identifier) @request
                arguments: (argument_list (keyword_argument name: (identifier) @url
                  value: (binary_operator left: (string) @endpoint right: (identifier) @encoded2)))))))))
          (expression_statement (call function: (identifier) @invoke)))
          (#eq? @helper @invoke) (#eq? @data @data2) (#eq? @encoded @encoded2)
          (#eq? @str "str") (#eq? @base64 "base64") (#eq? @b64 "b64encode")
          (#eq? @encode "encode") (#eq? @request "request") (#eq? @url "url")
          (#match? @profile "username") (#match? @profile "hostname")
          (#match? @endpoint "https?://")
          (#not-match? @endpoint "https?://(127[.]|localhost|0[.]0[.]0[.]0)"))

composite_rules:
  - id: python-setup-encoded-host-query-exfil
    desc: Setup sends encoded host profile in request URL
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1082,T1041
    scope: file
    all:
      - id: python-module-encodes-profile-into-request-url
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/os/sysinfo/platform/host::platform-node
