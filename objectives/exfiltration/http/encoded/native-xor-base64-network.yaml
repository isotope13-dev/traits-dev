defaults:
  platforms:
    - unix
    - windows
    - macos
composite_rules:
  - id: obfuscated-exfiltration
    desc: Multi-layer encoding with network (obfuscated)
    crit: hostile
    conf: 0.95
    attack: T1027
    mbc: B0032
    for: [elf, macho, pe]
    all:
      - id: micro-behaviors/data/encode/base64/custom::custom-implementation
      - id: micro-behaviors/data/bitwise/xor-forms/reference::xor-string-transform-clues
    any:
      - id: micro-behaviors/communications/http/client/curl::libcurl-http
      - id: micro-behaviors/communications/socket/create/
