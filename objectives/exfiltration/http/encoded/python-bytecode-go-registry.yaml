defaults:
  platforms: [unix, windows]
  for: [pyc]
composite_rules:
  - id: python-audit-registry-covert-upload
    desc: File audit and authenticated registry egress
    crit: hostile
    conf: 0.96
    attack: T1041,T1020
    all:
      - id: metadata/lang/source/literal/value::pyc-audit-registration-name
      - id: metadata/lang/source/literal/value::pyc-low-level-read-flag
      - id: micro-behaviors/data/serialize/json::json-dumps-pyc-name
      - id: metadata/lang/source/literal/value::pyc-hex-encoder-name
      - id: metadata/lang/source/literal/value::pyc-basic-auth-handler-name
      - id: metadata/lang/source/literal/value::pyc-registry-reader-user-suffix
      - id: metadata/lang/source/literal/value::pyc-registry-reader-password-suffix
      - id: metadata/lang/source/literal/value::pyc-go-registry-api-route
      - id: metadata/lang/source/literal/value::pyc-go-version-list-route
