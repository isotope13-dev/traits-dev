# Encoded JavaScript data sent in an HTTP POST.
#
# XOR and base64 are common implementation details on their own.  Require an
# actual POST sink as well as an explicit external fetch target before calling
# the combination exfiltration-like; this keeps API-key obfuscation and normal
# GET-based application traffic neutral.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

traits:
  - id: validator-action-payload
    desc: Validator action payload marker
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']?action["'']?\s*:\s*["'']validator["'']'

  - id: check-validator-helper
    desc: check_validator helper identifier
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: function
      exact: check_validator

  - id: validator-fetch-returns-true
    desc: Validator request returns true before completion
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'fetch\([\s\S]{0,500}\),!\w+\)return!0'

  - id: random-bytes-validation-hook
    desc: Cryptographic random bytes passed to validator
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'randomBytes\s*\([^)]{0,80}\)[\s\S]{0,220}check_validator\s*\('

  # b64encode(JSON.stringify(...)) packs structured browser state before upload.
  - id: b64encode-json-stringify-call
    desc: Base64-encodes JSON.stringify output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'b64encode\s*\(\s*JSON\.stringify\s*\('

composite_rules:
  - id: fire-and-forget-validator-input-exfil
    desc: Validator Base64-POSTs input then returns true
    crit: hostile
    conf: 0.995
    near_bytes: 900
    all:
      - id: check-validator-helper
      - id: validator-action-payload
      - id: validator-fetch-returns-true
      - id: micro-behaviors/data/encode/base64/structured::json-field-btoa-value
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url

  - id: js-xor-base64-http-post
    desc: JavaScript XOR/base64 payload sent via HTTP POST
    crit: suspicious
    conf: 0.94
    # btoa-symbol only proved the bundle mentions btoa somewhere; paired with
    # a 4 KB window it convicted any minified script that happened to carry an
    # XOR helper and a POST in the same neighbourhood. Require the encoder to
    # feed the request, and keep the legs inside one function's worth of text.
    # The XOR leg must carry a span: the previous file-level AST-metric leg
    # could never be localized, so near_bytes silently passed while the loop
    # sat half a megabyte from the POST (vendored-crypto XOR beside an
    # unrelated telemetry POST). The single-expression repeating-key loop is
    # span-bearing, so the window binds again.
    near_bytes: 400
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-byte-array-xor-modulo-key-loop
      - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-4
      - id: micro-behaviors/communications/http/request/client::fetch-http-scheme-url
      - id: micro-behaviors/communications/http/post::fetch-post-call
    # Google Tag Manager legitimately encodes analytics payloads before
    # sending them to its collection endpoints.  Its bundle fingerprint is
    # a benign context, not evidence of attacker-controlled exfiltration.
    unless:
      - id: metadata/build/bundler/asset::google-tag-manager-bundle
      - id: well-known/unwanted/qvi::disclosed-qvi-panel-context
      - id: well-known/unwanted/qvi/

  # A Base64-wrapped JSON POST body from a script that also reads
  # document.cookie. Wrapping telemetry in Base64 hides it from content
  # filters and casual inspection, which is why it is worth surfacing — but
  # the legs only co-occur, they do not prove the cookie value is what got
  # packed, and disclosed analytics/panel SDKs (well-known/unwanted/qvi) ship
  # exactly this shape. Suspicious, not hostile: cookie *theft* needs the
  # value-to-body join, a session-cookie name, or a cookies permission.
  - id: js-cookie-b64-json-post-exfil
    for: [javascript, typescript, crx, xpi, zip]
    desc: Base64-wrapped JSON POST beside a cookie read
    crit: suspicious
    conf: 0.93
    attack: T1539,T1041
    scope: archive
    all:
      - id: b64encode-json-stringify-call
      - id: micro-behaviors/communications/http/request/body/construction::fetch-post-b64encode-body
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    any:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
      - id: micro-behaviors/data/db/web-storage::chrome-storage-api
    unless:
      - id: metadata/build/bundler/asset::google-tag-manager-bundle
      - id: well-known/unwanted/qvi::disclosed-qvi-panel-context
