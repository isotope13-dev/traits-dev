defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-setup-encoded-network-profile-path
    desc: Uploads encoded setup host profile
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1082,T1041
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (assignment left: (identifier) @data right: (_) @profile))
            (expression_statement (call function: (attribute object: (identifier) @requests attribute: (identifier) @get)
              arguments: (argument_list (binary_operator left: (string) @url
                right: (call function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
                  arguments: (argument_list (call function: (attribute object: (identifier) @data2 attribute: (identifier) @encode))))))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @version
              value: (call function: (identifier) @invoke))))))
          (#eq? @helper @invoke) (#eq? @data @data2)
          (#eq? @requests "requests") (#eq? @get "get")
          (#eq? @base64 "base64") (#eq? @b64 "b64encode") (#eq? @encode "encode")
          (#eq? @setup "setup") (#eq? @version "version")
          (#match? @profile "platform[.]node") (#match? @profile "platform[.]uname")
          (#match? @profile "ifconfig") (#match? @url "https?://")
          (#not-match? @url "https?://(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @url "https?://172[.](1[6-9]|2[0-9]|3[01])[.]")
          (#not-match? @url "https?://(169[.]254[.]|\\[::1\\])"))
