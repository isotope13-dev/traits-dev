defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-preinstall-base64-host-profile-exfil
  desc: npm preinstall exfils base64 host profile
  crit: hostile
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/reference::preinstall-command-substitution-pairs
  - id: micro-behaviors/os/sysinfo/command::script-sysinfo-cmd
  - id: micro-behaviors/data/encoding/base64::script-base64
  - id: micro-behaviors/communications/http/download/package::preinstall-download-tool
  - id: metadata/package/scripts/command::npm-preinstall-http-url
