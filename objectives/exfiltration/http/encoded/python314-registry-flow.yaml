# CPython 3.14-specific marshal layout. The bounded signature ties local slots
# from os.read through JSON/hex encoding to the registry URL and opener call.
# The code length, tuple order and co_names indexes are deliberate: without
# these bindings, the same names can be inert constants in an unrelated file.
defaults:
  platforms: [unix, windows]
  for: [pyc]

traits:
  - id: python314-registry-content-flow
    desc: Python 3.14 read-to-registry URL bytecode
    crit: notable
    conf: 0.98
    if:
      type: hex
