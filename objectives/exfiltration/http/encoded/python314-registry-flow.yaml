composite_rules:
  - id: python314-audit-registry-content-egress
    desc: Python file data sent in registry URL
    crit: hostile
    conf: 0.98
    attack: T1041,T1020
    all:
      - id: python314-bytecode-magic
      - id: python314-registry-content-flow
      - id: micro-behaviors/communications/http/url/registry::pyc-registry-audit-name-cooccurrence
