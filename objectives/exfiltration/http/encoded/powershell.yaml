defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1041,T1132.001

traits:
  - id: chromium-browser-path-source
    desc: Reads Chromium browser credential path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(Chrome|Chromium|Brave).{0,100}(Local State|Network\\Cookies)'

  - id: edge-opera-browser-path-source
    desc: Reads Edge or Opera credential path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(Edge|Opera).{0,100}(Local State|Network\\Cookies)'

composite_rules:
  - id: sensitive-credential-source
    desc: Reads browser, cloud, or Wi-Fi credentials
    crit: suspicious
    conf: 0.94
    any:
      - id: chromium-browser-path-source
      - id: edge-opera-browser-path-source
      - id: micro-behaviors/fs/path/sensitive/browser::browser-cookies-file-path
      - id: objectives/credential-access/cloud/token/files::windows-token-broker-tbres-cache
      - id: objectives/credential-access/wifi::netsh-wlan-key-clear

  - id: powershell-encoded-credential-exfil
    desc: PowerShell compresses and encodes credentials for HTTP POST
    crit: hostile
    conf: 0.98
    attack: T1041,T1132.001,T1555.003,T1528
    all:
      - id: sensitive-credential-source
      - id: micro-behaviors/data/serialize/json::convertto-json
      - id: micro-behaviors/data/compress/library::powershell-gzipstream-compress
      - id: micro-behaviors/data/encode/base64::to-base64-string
      - id: micro-behaviors/communications/http/post::powershell-post-method
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
    near_lines: 40
