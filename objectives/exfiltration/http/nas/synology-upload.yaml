# Attacker-specific Synology NAS exfiltration chains
# A normal NAS client is only a notable API/upload capability. Hostile matches
# below require concealed credential provisioning or an attacker-specific auth
# path; a user-selected local file plus multipart upload is not exfiltration.
# ATT&CK: T1041 (Exfiltration Over C2 Channel), T1567 (Exfiltration Over Web Service)
defaults:
  platforms: [linux, macos, windows, unix]
  for: [javascript, typescript, python, shell]
  attack: T1041
  mbc: C0002
composite_rules:
# An uploader that reads its NAS session token from a concealed dead drop is
# not a NAS client with an awkward config story: the operator can rotate the
# credential of the receiving share without republishing the tool, and the
# published artifact never names the host that hands the credential out. That
# provisioning path, plus a local file streamed into the upload, is a
# file-theft channel wearing a file-manager interface.
- id: synology-nas-deaddrop-credentialed-upload
  desc: NAS upload authenticated from a concealed dead drop
  crit: hostile
  conf: 0.96
  attack: T1567,T1102.001
  unless:
  - id: micro-behaviors/communications/http/services/synology::synology-nas-cli-uploader
  all:
  - id: micro-behaviors/communications/http/services/synology::synology-nas-api
  - id: micro-behaviors/communications/http/upload::node-local-file-formdata-stream
  - id: objectives/command-and-control/channel/deaddrop/http-resolver::hex-obfuscated-endpoint-pool-resolver
- id: synology-nas-authenticated-exfil
  desc: Authenticated file exfiltration to Synology NAS
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/services/synology::synology-nas-api
  - id: micro-behaviors/communications/http/headers::file-upload-headers
  - id: micro-behaviors/communications/http/headers::basic-auth
  any:
  - id: micro-behaviors/os/env/access::javascript
  - id: micro-behaviors/os/env/vars/access::js-object-keys-env
