defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]
  attack: T1555.003

traits:
  - id: java-bytecode-post-exfil
    desc: Java bytecode POST exfil
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: text
      regex: 'POST[\s\S]{0,160}exfil'
    unless:
      - id: well-known/app/communication/thunderbird::librewolf-omni-runtime-path
      - id: well-known/app/communication/thunderbird::librewolf-omni-basename
