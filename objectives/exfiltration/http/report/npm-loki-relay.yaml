# npm packages that advertise as loggers but default to shipping caller logs to a
# remote Grafana Loki endpoint controlled by the maintainer (opt-out env, silent
# errors, hardcoded host fallback). Seen in lhisp-logger (MAL-2026-4598).
defaults:
  crit: hostile
  conf: 0.97
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1041,T1195.002
  mbc: E1041

composite_rules:
  - id: npm-pino-loki-silent-default-relay
    desc: Logger silently ships to remote Loki by default
    scope: archive
    all:
      - id: micro-behaviors/os/telemetry/logging/loki::pino-loki-default-remote-sink-config
      - id: micro-behaviors/os/env/cicd::ci-info-isci-property
    unless:
      - id: well-known/lib/observability/pino::pino-library-context
      - id: metadata/package/testing/presence/fixture/

  - id: npm-pino-loki-hostname-labeled-relay
    desc: Remote Loki relay labels logs with host identity
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/os/telemetry/logging/loki::pino-loki-default-remote-sink-config
      - id: objectives/supply-chain/recon-exfil/npm-install-targeting::linux-hostname-target
    unless:
      - id: well-known/lib/observability/pino::pino-library-context
      - id: metadata/package/testing/presence/fixture/

  - id: npm-loki-relay-ci-test-evasion
    desc: Remote Loki relay skips CI and test runtimes
    conf: 0.95
    attack: T1497,T1041
    scope: archive
    all:
      - id: micro-behaviors/os/telemetry/logging/loki::pino-loki-default-remote-sink-config
      - id: micro-behaviors/os/telemetry/logging/loki::loki-shipping-ci-jest-gated
    unless:
      - id: well-known/lib/observability/pino::pino-library-context
      - id: metadata/package/testing/presence/fixture/
