# A plaintext password embedded in a GET URL leaves the device in the clear
# (CWE-598): it is recorded verbatim by the receiving host, by every
# TLS-terminating proxy in front of it, and by any access log along the way.
# That is a credential disclosure to a third-party endpoint regardless of
# whether the author calls the channel "diagnostics".
#
# What this rule may NOT do is infer that link from co-location. An earlier
# revision paired "a password field is read somewhere in this file" with "a
# logger builds a URL somewhere in this file" and called the result an exfil
# chain. Every mail client matches that: it needs the password to authenticate
# and it needs a logger to be debuggable. It convicted a WebView mail bootstrap
# whose logger is called with an account id, host and port -- the password sits
# in an ImapWebProvider constructor 30 lines away and never reaches the URL.
#
# So the credential must be shown *inside* the encoded value. That is provable
# from the text; "some object in scope happens to hold a password" is not.
#
# The legs are deliberately kept free of any one project's identifiers -- an
# earlier revision keyed the serialization leg on a `vlog(` function name, which
# convicted exactly one codebase and generalized to nothing.
defaults:
  crit: hostile
  platforms: [android, windows, unix]
  for: [javascript, typescript]
  attack: T1552

composite_rules:
  # A whole IMAP config, including its password field, is passed into a
  # logger whose own body immediately sends the URL-encoded message remotely.
  # Unlike co-location of a password and logger, this binds both behaviors to
  # the same logging path and covers silent unconditional telemetry.
  - id: imap-config-unconditional-encoded-http-exfiltration
    desc: Sends serialized IMAP credentials through HTTP logger
    crit: hostile
    conf: 0.97
    attack: T1041,T1552
    all:
      - id: micro-behaviors/communications/email/access/imap::account-imap-config-in-log-call
      - id: micro-behaviors/communications/email/access/imap::account-password-field
      - id: micro-behaviors/communications/url/http-path::unconditional-vlog-encoded-http-sink

  - id: imap-credential-config-http-report
    desc: Mail account config with password sent in log URL
    conf: 0.97
    attack: T1041,T1552
    all:
      # The credential is inside the value being URL-encoded, not merely
      # somewhere else in the same file.
      - id: micro-behaviors/data/encode/url::password-value-encode-uri-component
      - id: micro-behaviors/communications/email/access/imap::account-password-field
    any:
      - id: micro-behaviors/communications/url/http-path::fetch-encoded-log-path
      - id: micro-behaviors/communications/url/construction/build-http::fetch-encoded-template-path

  # A serialized IMAP config reaches a logger in a file that also contains an
  # encoded HTTP log request. The matcher does not bind the logger definition
  # to that call: inspect the implementation before claiming credential export.
  # Keep suspicious emphasis because a complete config may include a password.
  # Diagnostic logging can produce the same signal as deliberate theft.
  - id: imap-config-logging-with-http-sink
    desc: IMAP config logging with encoded HTTP log path
    crit: suspicious
    conf: 0.95
    attack: T1041,T1552
    all:
      - id: micro-behaviors/communications/url/http-path::fetch-encoded-log-path
      - id: micro-behaviors/communications/email/access/imap::account-password-field
      - id: micro-behaviors/communications/email/access/imap::account-imap-config-in-log-call
