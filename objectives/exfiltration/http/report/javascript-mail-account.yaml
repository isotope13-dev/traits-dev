# A mail client's remote diagnostic logger transmits its messages by embedding
# them in a URL path, and one of the serialized values is the IMAP account
# configuration block -- which carries the account's plaintext password.
#
# The credential therefore leaves the device inside a GET URL (CWE-598): it is
# recorded verbatim by the receiving host, by every TLS-terminating proxy in
# front of it, and by any access log along the way. That is a credential
# disclosure to a third-party endpoint regardless of whether the author calls
# the channel "diagnostics".
#
# The legs are deliberately kept free of any one project's identifiers -- an
# earlier revision keyed the serialization leg on a `vlog(` function name, which
# convicted exactly one codebase and generalized to nothing.
defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]
  attack: T1552

composite_rules:
  - id: imap-credential-config-http-report
    desc: Mail account config with password sent in log URL
    crit: hostile
    conf: 0.97
    attack: T1041,T1552
    all:
      # The config object being serialized is known to carry a password because
      # the same file reads that field.
      - id: micro-behaviors/communications/email/access/imap::account-password-field
      - id: micro-behaviors/communications/email/access/imap::account-imap-config-serialization
    any:
      - id: micro-behaviors/communications/http/url/path::fetch-encoded-log-path
      - id: micro-behaviors/communications/http/url/path::fetch-encoded-template-path
