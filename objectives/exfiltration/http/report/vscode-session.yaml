# An IDE extension that ships the AI agent's session off the workstation.
#
# The conversation an agent holds in Cursor/Antigravity is the developer's
# source code, prompts, and terminal output. An extension that buffers that
# text alongside its own runtime log and POSTs both to a backend, keyed to an
# id it persists across installs, makes that work product leave the machine
# attributably rather than as anonymous crash telemetry.
#
# Scored `suspicious`, not hostile: shipping conversation content to a backend
# is how every AI coding assistant works, and a summarize-my-session button is
# an ordinary feature. What this composite names is the data flow — an analyst
# still has to check the extension's disclosure and destination to decide
# whether it is theft. Pairing it with a hostile leg (undisclosed harvesting,
# credential fields, a rehosted endpoint) is what a verdict needs.
#
# The field-name atoms live in micro-behaviors/os/telemetry/logging/llm/ (a
# transcript field is a neutral thing for a chat UI to have); what is scored
# here is transcript + log buffer + persistent id + outbound POST together, in
# one file, so the flow is real and not four unrelated files in a bundle.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  # `userId: <ctx>.globalState.get(...)` — the upload is keyed to an identifier
  # the extension persists across sessions, which is what makes the log stream
  # attributable to one developer rather than anonymous crash telemetry.
  - id: persistent-install-id-upload-field
    desc: Upload field from persisted extension state
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\buser_?id\s*:\s*\w{0,24}\.?globalState\.get\s*\('

composite_rules:
  # One composite, not two: the transcript and the log buffer travel in the
  # same POST body, so splitting them by data class reported one upload twice.
  - id: vscode-agent-session-upload
    desc: Extension uploads identified agent session data
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/os/telemetry/logging/llm::agent-conversation-transcript-field
      - id: micro-behaviors/os/telemetry/logging/llm::agent-session-log-buffer-field
      - id: persistent-install-id-upload-field
      - id: micro-behaviors/communications/http/request/client::post-method-text
