# Exfiltration of an IDE agent's visible conversation and session telemetry.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: agent-session-summary-endpoint
    desc: Agent session API endpoint
    crit: notable
    conf: 0.98
    if:
      type: string_literal
      substr: https://auto-accept-backend.onrender.com/api

  - id: visible-agent-conversation-field
    desc: Visible agent conversation upload field
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: visibleConversationText

  - id: buffered-agent-session-log-field
    desc: Buffered agent session log upload field
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(safeLogs|sessionLogBuffer)'

composite_rules:
  - id: vscode-agent-session-exfiltration
    desc: VS Code extension uploads agent session content
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, archives]
    scope: archive
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: agent-session-summary-endpoint
      - id: visible-agent-conversation-field
      - id: buffered-agent-session-log-field
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::json-header

  - id: vscode-agent-session-log-exfiltration
    desc: VS Code extension uploads buffered agent session logs
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, archives]
    scope: archive
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: agent-session-summary-endpoint
      - id: buffered-agent-session-log-field
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::json-header
