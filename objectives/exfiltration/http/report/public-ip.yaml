defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: js-public-ip-literal-post
    desc: JavaScript discovers public IP and POSTs to a literal IPv4 endpoint
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/post
    unless:
      - id: metadata/package/testing/harness/runtime/
