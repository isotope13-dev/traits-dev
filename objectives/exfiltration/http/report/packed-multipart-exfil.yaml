# Packed multipart file exfiltration with a per-build marker.
#
# A binary that performs a libcurl multipart upload of a file[] field to a
# hardcoded cleartext endpoint while carrying a per-build UNIQUE mutation
# slot in packed UPX data is an automated collection implant, not a plain
# uploader: legitimate crash reporters and file-sharing clients neither stamp
# per-build tracking slots into packed sections nor pair them with a
# concealed overlay executable. The endpoint corroborates in `any:`; the
# conviction rests on the upload machinery plus the build marker.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041
composite_rules:
  - id: packed-multipart-file-exfil-with-build-marker
    desc: Packed binary posts multipart files with a per-build marker
    crit: hostile
    conf: 0.9
    attack: T1041,T1020
    all:
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
    any:
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: metadata/binary/layout/overlay::upx-dominant-overlay-with-embedded-pe
    unless:
      - id: metadata/signed/platform/
