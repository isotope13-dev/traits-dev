# Authenticated browser response material forwarded through an OOB navigation.
# The transport composite establishes an encoded outbound callback; these legs
# establish that the same compact script first fetched and consumed data with
# the browser's credentials attached.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: authenticated-response-oob-navigation-exfil
    desc: Sends authenticated fetch response to OOB callback
    crit: hostile
    conf: 0.99
    mbc: E1005,E1041
    near_bytes: 1800
    all:
      - id: micro-behaviors/communications/http/request/credentials::fetch-credentials-include
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
      - id: objectives/exfiltration/oob/callback::browser-oob-encoded-navigation
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/harness/runtime/
