defaults:
  for: [javascript, typescript, html]
  platforms: [windows, unix]
  attack: T1041,T1027

traits:
  - id: obfuscated-delayed-image-context-beacon
    desc: Obfuscated image beacon sends page context
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule obfuscated_delayed_image_context_beacon {
          strings:
            $delay = "setTimeout" ascii
            $eval = /\beval\s*\(/ ascii
            $decode = "decodeURIComponent" ascii
            $window = "window[" ascii
            $document = "document[" ascii
            $location = "location[" ascii
            $image = /new[ \t]+(globalThis\.)?Image\s*\(/ ascii
            $encode = /encodeURI(Component)?\s*\(/ ascii
            $identifier = /_0x[0-9a-fA-F]{4,}/ ascii
          condition:
            $delay and $eval and $decode and $window and $document and $location and $image and #encode >= 2 and #identifier >= 20
        }
