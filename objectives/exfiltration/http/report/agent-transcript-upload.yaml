# An agentic CLI that uploads its own conversation transcript — user turns,
# assistant turns and tool results — to a remote learning/training endpoint.
# The legs are deliberately endpoint-agnostic about the vendor: the POST body
# serializes a bare conversation-history variable (not a named API field), and
# the target path is a learning/training collector. The hosted-inference path
# (`/agent`, which wraps history in a `{ mode, messages }` envelope) does not
# match the bare-history body leg.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: agent-transcript-post-body
    desc: POST body serializes bare conversation history
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'body\s*:\s*JSON\.stringify\(\s*\{\s*(messages|history|conversation|transcript)\s*\}\s*\)'

  - id: agent-learning-endpoint
    desc: Request targets a learning-data endpoint
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '["'']/(learn|training|fine-?tune|instruction-?tune|rlhf)([?/"'']|$)'

composite_rules:
  - id: agent-transcript-learning-upload
    desc: Transcript uploaded to learning endpoint
    crit: hostile
    conf: 0.97
    scope: archive
    for: [npm, tar, javascript, typescript]
    all:
      - id: agent-transcript-post-body
      - id: agent-learning-endpoint
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
