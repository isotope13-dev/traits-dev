defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift, zig, elf]
  attack: T1041

traits:
  - id: netscaler-data-chunk-header
    desc: NetScaler data chunk header
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: X-Data-Chunk
