# This source can be identified as JavaScript by deployed scanners; the
# conditions describe Nim syntax and do not depend on a new file type.
defaults:
  for: [javascript]
  platforms: [windows, unix]
  attack: T1041,T1018

traits:
  - id: nim-host-discovery-procedure
    desc: Nim source defines local host discovery
    crit: notable
    if:
      type: text
      regex: '\bproc\s+discoverLocalHosts\s*\('
  - id: nim-discovered-hosts-field
    desc: Nim JSON reports discovered host addresses
    crit: notable
    if:
      type: text
      regex: '"discovered_ips"\s*:\s*[A-Za-z_]\w*'
  - id: nim-portscan-result-field
    desc: Nim JSON reports port scan results
    crit: notable
    if:
      type: text
      regex: '"result_portscan"\s*:\s*[A-Za-z_]\w*'
  - id: nim-command-execution-helper
    desc: Nim executes an assembled shell command
    crit: notable
    if:
      type: text
      regex: '\bexecCmdEx\s*\(\s*cmd\s*\)'
  - id: nim-host-report-post
    desc: Nim posts JSON to command server
    crit: notable
    if:
      type: text
      regex: 'retryRequest\s*\([^\r\n]{0,180}C2_URL[^\r\n]{0,180}"POST"[^\r\n]{0,100}\$jsonData'

composite_rules:
  - id: nim-command-host-findings-post
    desc: Nim agent sends commands and host findings
    crit: hostile
    conf: 0.99
    all:
      - id: nim-host-discovery-procedure
      - id: nim-discovered-hosts-field
      - id: nim-portscan-result-field
      - id: nim-command-execution-helper
      - id: nim-host-report-post
