defaults:
  platforms: [unix, windows]
  for: [java]
composite_rules:
  - id: java-preprocessor-host-report-upload
    desc: Middleware preprocessor with host inventory and HTTP body writes
    crit: suspicious
    conf: 0.97
    attack: T1041
    all:
      - id: micro-behaviors/communications/http/server/middleware::java-request-preprocessor-implementation
      - id: micro-behaviors/os/sysinfo/hostname/query::java-local-host-name-source
      - id: micro-behaviors/os/user/lookup::java-current-user-property
      - id: objectives/discovery/system/fingerprint/info::java-network-interface-enum
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
      - id: micro-behaviors/communications/http/request/body/write::java-urlconnection-body-stream-write
