defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, nupkg]
  crit: hostile
  conf: 0.99
  attack: T1082,T1041,T1552.001

composite_rules:
  - id: dotnet-default-authenticated-log-exfil-sink
    desc: Application logs default to embedded remote collector
    scope: archive
    all:
      - id: micro-behaviors/communications/http/log-sink::dotnet-http-log-entry-sender
      - id: micro-behaviors/communications/http/log-sink::dotnet-hardcoded-default-log-endpoint
      - id: micro-behaviors/communications/http/log-sink::dotnet-embedded-default-api-key
