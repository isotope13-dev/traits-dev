defaults:
  for: [macho, elf, pe]
  platforms: [macos, linux, windows]
  attack: T1498,T1082,T1041

traits:
  - id: go-stress-agent-target-fetch
    desc: Go stress agent fetches targets from backend
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'go_stresser_20/models.GetTargets'
  - id: go-stress-agent-location
    desc: Go stress agent queries host location
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'go_stresser_20/models.GetMyLocation'
  - id: go-stress-agent-login
    desc: Go stress agent sends login details
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'go_stresser_20/models.Login'
  - id: go-stress-agent-send
    desc: Go stress agent sends backend messages
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'go_stresser_20/models._send'
  - id: go-stress-agent-http-job
    desc: Go stress agent runs HTTP jobs
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'go_stresser_20/workers.HttpJob'

composite_rules:
  - id: go-stress-agent-host-report
    desc: Backend-controlled HTTP stress agent reports host information
    crit: hostile
    conf: 0.98
    all:
      - id: go-stress-agent-target-fetch
      - id: go-stress-agent-location
      - id: go-stress-agent-login
      - id: go-stress-agent-send
      - id: go-stress-agent-http-job
