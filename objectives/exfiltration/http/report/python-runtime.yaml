defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1041

traits:
  - id: signed-payload-socketio-emit
    desc: Signed payload Socket.IO emit
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'secure_payload[\s\S]{0,180}\.emit\s*\('

  - id: python-source-json-dumps-raw
    desc: Serializes a Python source buffer
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'json\.dumps\s*\(\s*(raw_content|mod_code)\b'

  - id: python-source-json-dumps-named
    desc: Serializes a named Python source value
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'json\.dumps\s*\(\s*(source_text|source_code|strings)\b'

  - id: python-frame-local-json-dumps
    desc: Serializes Python frame locals
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'json\.dumps\s*\(\s*(f_locals|locals)\b'

  - id: python-frame-context-json-dumps
    desc: Serializes Python frame context
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'json\.dumps\s*\(\s*(crash_context|frame_data|locals_snapshot)\b'

composite_rules:
  - id: python-source-json-serialization
    desc: Serializes loaded Python source text
    crit: notable
    conf: 0.92
    any:
      - id: python-source-json-dumps-raw
      - id: python-source-json-dumps-named

  - id: python-frame-local-json-serialization
    desc: Serializes Python frame-local data
    crit: notable
    conf: 0.92
    any:
      - id: python-frame-local-json-dumps
      - id: python-frame-context-json-dumps

  - id: python-frame-local-socketio-exfil
    desc: Python frame-local data sent over Socket.IO
    crit: hostile
    conf: 0.96
    all:
      - id: python-frame-local-json-serialization
      - id: metadata/library/socketio::python-client-import
      - id: micro-behaviors/communications/websocket/send::python-socketio-connect-call
      - id: micro-behaviors/communications/websocket/send::python-socketio-emit-call
    near_lines: 60

  - id: python-source-socketio-exfil
    desc: Loaded Python source sent over Socket.IO
    crit: hostile
    conf: 0.97
    attack: "T1041,T1059.006"
    all:
      - id: micro-behaviors/fs/read/file::file-open-content
      - id: micro-behaviors/process/interpreter/python::exec-builtin
      - id: micro-behaviors/process/interpreter/python::compile-source-exec-mode
      - id: python-source-json-serialization
      - id: metadata/library/socketio::python-client-import
      - id: micro-behaviors/communications/websocket/send::python-socketio-connect-call
      - id: micro-behaviors/communications/websocket/send::python-socketio-emit-call
    near_lines: 100

  - id: mcp-forensic-telemetry-http-exfil
    desc: MCP forensic telemetry HTTP exfil
    crit: hostile
    conf: 0.96
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::mcp-forensic-event-telemetry
      - id: micro-behaviors/os/telemetry/logging/llm::config-expanded-telemetry-sinks
      - id: micro-behaviors/os/telemetry/logging/llm::http-post-telemetry-sink
      - id: micro-behaviors/data/serialize/json::json-dumps-call
