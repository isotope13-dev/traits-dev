# A phone number sent to an encoded external HTTP service is a report of
# user-linked data.  The destructive command leg makes this specific pattern
# an attack objective rather than ordinary pairing or verification telemetry.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

composite_rules:
  # A library's explicit phone-check API may be user-invoked, so this is a
  # suspicious data-flow fact rather than an automatic hostile verdict. The
  # endpoint is nevertheless outside WhatsApp and receives the number in a
  # GET query, which is useful triage context on its own.
  - id: js-phone-number-remote-report
    desc: Sends a phone number to a remote service
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/params::js-fetch-number-query-variable
      - id: micro-behaviors/communications/http/request/json::fetch-external-url

  - id: js-phone-report-with-destructive-trigger
    desc: Phone number reported to encoded HTTP service with destructive trigger
    crit: hostile
    conf: 0.99
    attack: T1041,T1059.007,T1485
    all:
      - id: micro-behaviors/communications/http/request/params::js-axios-request-phone-variable
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/communications/http/lib/axios::axios
      - id: micro-behaviors/process/create/shell/bridge::child-process-compiled-exec-call
      - id: micro-behaviors/fs/delete/directory::rm-rf
