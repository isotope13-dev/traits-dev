# Telemetry uploads authorized by a baked-in development credential. A
# publishable vendor key with a documented capture endpoint is ordinary
# analytics; a hardcoded dev bearer token aimed at a private-network sink
# authenticates nobody and discloses the upload to whoever holds the
# address. The legs sit in the shipped bundle, so file scope keeps a dev
# token string in tests or docs from pooling with the sink.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
  - id: telemetry-dev-credential-private-sink
    desc: Dev-credential telemetry to private sink
    crit: hostile
    conf: 0.96
    scope: file
    for: [javascript, typescript, npm, tar, zip]
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::telemetry-dev-token-default
      - id: micro-behaviors/os/telemetry/logging/llm::trace-ingest-path
      - id: micro-behaviors/communications/ip/literal::private-ipv4-http-url
      - id: micro-behaviors/os/telemetry/logging/llm::traces-api-upload
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
