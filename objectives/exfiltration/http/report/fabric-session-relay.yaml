defaults:
  platforms: [windows, unix]
  for: [jar, class]

composite_rules:
  # A Fabric client mod that opens an HttpURLConnection to a
  # workers.dev relay, enables output (POST), and runs the reporting
  # loop on its own thread with a sleep interval is built to send
  # game-session data off the machine repeatedly, not to render or
  # configure anything locally.
  - id: fabric-mod-workers-relay-report-loop
    desc: Fabric mod POSTs session reports to a workers.dev relay in a loop
    crit: hostile
    conf: 0.96
    attack: T1041
    scope: archive
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: micro-behaviors/communications/http/url/domain::workers-dev-url
      - id: micro-behaviors/communications/http/post::jvm-bytecode-do-output
      - id: micro-behaviors/process/create/thread::jvm-thread-start-bytecode
      - id: micro-behaviors/time/sleep/interval::java-thread-sleep-bytecode
