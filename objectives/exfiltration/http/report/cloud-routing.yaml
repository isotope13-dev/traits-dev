defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1041

composite_rules:
  - id: npm-cloud-log-routing-ngrok-exfil
    desc: Attempts AWS log-routing exfiltration via ngrok
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/telemetry/logging/provider::npm-script-prints-awslogs-routing-fields
      - id: micro-behaviors/communications/http/curl/command::npm-postinstall-piped-curl-http-url
      - id: micro-behaviors/communications/http/curl/body::curl-stdin-body-post
      - id: well-known/dual-use/tunnel/ngrok::npm-script-ngrok-free-domain
