defaults:
  for: [xml]
  platforms: [windows, unix]
  attack: T1195.002,T1033,T1041

traits:
  - id: nuget-build-user-command-callback
    desc: Build hook attempts user-name callback
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule nuget_build_user_command_callback {
          strings:
            $target = "BeforeTargets" ascii nocase
            $exec = "<Exec" ascii nocase
            $curl = /\bcurl\s+https?:\/\// ascii nocase
            $identity = /\$\(\s*whoami\s*\)/ ascii nocase
            $query = /[?&](user|username|whoami)=/ ascii nocase
          condition:
            all of them
        }
