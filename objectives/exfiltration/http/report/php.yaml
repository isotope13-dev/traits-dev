defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [python, javascript, powershell, pe, elf, macho, xml]
  mbc: C0002
  attack: T1041

traits:
- id: wordpress-remote-site-metadata
  desc: WordPress remote request includes site URL
  crit: suspicious
  conf: 0.95
  for: [php]
  if:
    type: text
    regex: 'wp_remote_\w{3,7}\s*\([\s\S]{0,600}\b(home_url|site_url|admin_url)\b'

- id: wordpress-remote-admin-metadata
  desc: WordPress remote request includes admin data
  crit: suspicious
  conf: 0.95
  for: [php]
  if:
    type: text
    regex: 'wp_remote_\w{3,7}\s*\([\s\S]{0,600}\b(user_login|user_email|administrator)\b'

- id: wordpress-urlencoded-field
  desc: URL-encodes a PHP variable for transmission
  crit: notable
  conf: 0.86
  for: [php]
  if:
    type: text
    regex: 'urlencode\s*\(\s*\$[A-Za-z_]\w*'

- id: php-report-dup
  desc: Hard-coded external PHP report endpoint URL
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: 'https?://[^\s"''<>]{1,240}/report\.php([?#\s]|$)'
  unless:
  - id: well-known/app/abacus-ai::abacus-ai-vscode-extension
  not:
  - regex: '(?i)https?://bugs\.php\.net/report\.php'

composite_rules:
- id: wordpress-admin-metadata-report
  desc: WordPress post sends site and admin data
  crit: suspicious
  conf: 0.95
  for: [php]
  all:
  - id: wordpress-remote-site-metadata
  - id: wordpress-remote-admin-metadata
  near_bytes: 1400

- id: wordpress-token-backdoor-report
  desc: WordPress token backdoor reports administrator session data
  crit: hostile
  conf: 0.99
  for: [php]
  all:
  - id: objectives/credential-access/validation/session::wp-token-authentication-bypass
  - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
  - id: wordpress-admin-metadata-report
  near_bytes: 4096

- id: wordpress-token-backdoor-encoded-report
  desc: Token backdoor sends URL-encoded fields remotely
  crit: hostile
  conf: 0.97
  for: [php]
  all:
  - id: objectives/credential-access/validation/session::wp-token-authentication-bypass
  - id: wordpress-urlencoded-field
  any:
  - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
  - id: micro-behaviors/communications/http/curl::php-curl-request
  - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
  near_bytes: 4096
