defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [python, javascript, powershell, pe, elf, macho, xml]
  mbc: C0002
  attack: T1041

traits:
- id: php-report-dup
  desc: PHP report endpoint URL template
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: 'https?://[^\s"''<>]{1,240}/report\.php([?#\s]|$)'
  unless:
  - id: well-known/app/ai/abacus-ai::abacus-ai-vscode-extension
  not:
  - regex: '(?i)https?://bugs\.php\.net/report\.php'

composite_rules:
- id: wordpress-contact-subscription-report
  desc: Silently posts store contacts to subscription service
  crit: hostile
  conf: 0.99
  for: [php]
  all:
  - id: objectives/collection/email-harvest::version-callback-invokes-subscription
  - id: micro-behaviors/communications/email/address::wordpress-admin-email-option
  - id: micro-behaviors/communications/email/address::woocommerce-order-recipient-option
  - id: micro-behaviors/communications/http/url/path::email-subscription-endpoint
  - id: micro-behaviors/communications/http/request/wordpress::wp-remote-post
  scope: archive

- id: wordpress-admin-metadata-report
  desc: WordPress post sends site and admin data
  crit: suspicious
  conf: 0.95
  for: [php]
  all:
  - id: micro-behaviors/communications/http/request/wordpress::wp-remote-request-site-url
  - id: micro-behaviors/communications/http/request/wordpress::wp-remote-request-admin-fields
  near_bytes: 1400

- id: wordpress-token-backdoor-report
  desc: WordPress token backdoor reports administrator session data
  crit: hostile
  conf: 0.99
  for: [php]
  all:
  - id: objectives/credential-access/validation/session::wp-token-authentication-bypass
  - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
  - id: wordpress-admin-metadata-report
  near_bytes: 4096

- id: wordpress-token-backdoor-encoded-report
  desc: Token backdoor sends URL-encoded fields remotely
  crit: hostile
  conf: 0.97
  for: [php]
  all:
  - id: objectives/credential-access/validation/session::wp-token-authentication-bypass
  - id: micro-behaviors/data/encode/url::urlencode-call
  any:
  - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
  - id: micro-behaviors/communications/http/curl::php-curl-request
  - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
  near_bytes: 4096
