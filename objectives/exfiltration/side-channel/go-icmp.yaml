defaults:
  platforms: [windows, unix]
  for: [go, go_module, zip, tar]
  attack: T1048.002,T1082,T1033
  conf: 0.99

composite_rules:
  - id: go-host-identity-byte-icmp-exfil
    desc: Go sends local host identity bytes in ICMP ping destinations
    crit: hostile
    scope: archive
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname
      - id: micro-behaviors/os/env/read/variable::os-getenv
      - id: micro-behaviors/communications/icmp::go-ping-destination-byte

  - id: go-credential-bytes-icmp-size-exfil
    desc: Go sends developer credential bytes as ICMP packet-size nibbles
    crit: hostile
    attack: T1048.002,T1552.001
    scope: archive
    all:
      - id: micro-behaviors/communications/icmp::go-ping-size-nibble
      - id: micro-behaviors/communications/icmp::go-two-arg-call-high-nibble
      - id: micro-behaviors/communications/icmp::go-two-arg-call-low-nibble
      - id: micro-behaviors/fs/read/file/content/unspecified::os-readfile
    any:
      - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
      - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
      - id: micro-behaviors/fs/path/developer-credential::developer-auth-file-reference
    needs: 1
