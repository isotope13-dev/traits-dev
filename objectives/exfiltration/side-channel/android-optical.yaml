# Build profile collection alongside an optical data transmitter is suspicious;
# user-triggered research demos do not establish unauthorized information theft.
defaults:
  for: [zip, java]
  platforms: [android]

composite_rules:
  - id: android-build-optical-profile
    desc: Android Build profiling with optical byte transmission
    crit: suspicious
    scope: archive
    all:
      - id: micro-behaviors/os/sysinfo/platform/mobile::build-device-profile
      - id: micro-behaviors/ui/window/display::screen-byte-transmitter

  - id: android-build-profile-optical-channel
    desc: Android Build profile collection with a Manchester screen transmitter
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-build-device-profile
      - id: micro-behaviors/ui/window/display::android-manchester-screen-signal
    # The first composite reports the same claim when both transmitter
    # matchers fire; this one still reports variants only it recognizes.
    unless:
      - id: android-build-optical-profile
