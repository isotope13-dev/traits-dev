defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - java
  - kotlin
  - elixir
  - ruby
  - swift
  - zig
  attack: T1048.002
  conf: 0.97
  crit: hostile
composite_rules:
- id: c-host-identity-ipv4-icmp-exfil
  desc: C source encodes host identity bytes in ICMP target addresses
  conf: 0.99
  for: [c, cpp]
  platforms: [windows]
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/icmp::c-icmp-helper-call
  - id: micro-behaviors/os/env/read/named::c-windows-identity-environment
  - id: micro-behaviors/communications/icmp::c-icmp-byte-identity-argument

- id: source-host-identity-icmp-exfil
  desc: Source host identity over ICMP
  scope: file
  all:
  - id: micro-behaviors/communications/icmp::source-icmp-helper-call
  - id: micro-behaviors/os/sysinfo/hostname/query::source-hostname-helper-call
- id: kotlin-host-identity-ipv4-icmp-exfil
  desc: Kotlin encodes local host identity in ICMP destination addresses
  crit: hostile
  conf: 0.99
  attack: T1048.002,T1082,T1033
  for: [kotlin, jar]
  scope: archive
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::java-local-host-name-source
  - id: micro-behaviors/os/env/read/variable::java-system-getenv
  - id: micro-behaviors/communications/icmp::source-icmp-helper-call
  - id: micro-behaviors/communications/icmp::kotlin-ping-destination-byte-helper
- id: source-credential-icmp-exfil
  desc: Source credentials over ICMP
  scope: file
  all:
  - id: micro-behaviors/communications/icmp::source-icmp-helper-call
  any:
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readallbytes-token
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
- id: kotlin-credential-icmp-size-exfil
  desc: Kotlin sends local credential-file bytes in ICMP packet sizes
  crit: hostile
  conf: 0.99
  attack: T1048.002,T1552.001
  for: [kotlin, jar]
  scope: archive
  all:
  - id: micro-behaviors/communications/icmp::source-icmp-helper-call
  - id: micro-behaviors/communications/icmp::kotlin-ping-size-nibble-helper
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/read/file/content/unspecified::kotlin-file-read-call
- id: python-host-identity-icmp-exfil
  desc: Python sends host identity through ICMP
  conf: 0.96
  for:
  - python
  near_bytes: 512
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/communications/icmp::python-ping-process-call
- id: python-credential-icmp-exfil
  desc: Python package sends credentials over ICMP
  conf: 0.98
  for:
  - python
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/icmp::python-ping-process-call
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  any:
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
  needs: 1
- id: javascript-host-identity-icmp-exfil
  desc: JavaScript sends host identity through ICMP
  conf: 0.96
  for:
  - javascript
  - typescript
  near_bytes: 512
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/communications/icmp::javascript-ping-interpolated-host
- id: php-host-identity-icmp-exfil
  desc: PHP sends host identity through ICMP
  conf: 0.96
  for:
  - php
  near_bytes: 512
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::php-gethostname-call
  - id: micro-behaviors/communications/icmp::ping
- id: powershell-host-identity-ipv4-icmp-exfil
  desc: PowerShell encodes host identity in ping target addresses
  conf: 0.99
  for:
  - powershell
  - zip
  platforms:
  - windows
  scope: archive
  all:
  - id: micro-behaviors/os/sysinfo/hostname/transform::powershell-host-identity-utf8-bytes
  - id: micro-behaviors/communications/icmp::powershell-ping-interpolated-address-byte
- id: npm-package-host-identity-icmp-exfil
  desc: NPM package exfiltrates host identity over ICMP
  conf: 0.98
  for:
  - npm
  - javascript
  - typescript
  - tar
  scope: archive
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/communications/icmp::javascript-ping-interpolated-host
- id: npm-package-credential-icmp-exfil
  desc: NPM package exfiltrates credentials over ICMP
  conf: 0.98
  attack: T1048.002,T1552.001
  for:
  - npm
  - javascript
  - typescript
  - tar
  scope: file
  all:
  - id: micro-behaviors/communications/icmp::javascript-ping-interpolated-host
  any:
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
  - id: micro-behaviors/fs/path/secret-config::netrc

- id: node-sensitive-file-case-coded-dns-exfil
  desc: Node.js file-to-DNS case encoding pattern
  crit: hostile
  conf: 0.99
  attack: T1048.003
  for: [npm, javascript, tar]
  scope: file
  near_lines: 8
  all:
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
  - id: micro-behaviors/data/string/case::javascript-conditional-case-transform
  - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
  - id: micro-behaviors/data/bitwise/mask::javascript-low-bit-mask
  - id: micro-behaviors/communications/dns/label::node-function-file-bit-case-dns-cluster
  any:
  - id: micro-behaviors/communications/dns/label::dns-resolver-variable-name-argument
  - id: micro-behaviors/communications/dns/label::dns-resolver-interpolated-name-argument
  - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  needs: 2

- id: rust-credential-icmp-exfil
  desc: Rust package sends local credential-file contents through ICMP ping sizes
  conf: 0.99
  for: [rust, crate, tar]
  platforms: [unix]
  scope: archive
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/icmp::source-icmp-helper-call
  - id: micro-behaviors/fs/read/file/content/unspecified::rust-fs-read
  - id: micro-behaviors/communications/icmp::rust-ping-size-nibble
  any:
  - id: micro-behaviors/fs/path/secret-config::netrc
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  needs: 1
