defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1048.003,T1082,T1033

composite_rules:
  - id: node-oob-hex-profile-http-dns-label
    desc: Hex host-user DNS label sent to OOB zone
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/url-computed::node-hex-profile-label-http-host
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: metadata/import/npm/os
      - id: metadata/import/npm/http
