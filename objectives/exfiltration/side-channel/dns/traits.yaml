# DNS Exfiltration Composites
# Detects DNS exfiltration patterns
# ATT&CK: T1048.003 (Exfiltration Over Alternative Protocol: Exfiltration Over Unencrypted/Obfuscated Non-C2 Protocol)
defaults:
  attack: T1048.003
  platforms: [linux, unix, macos, android, ios]
  for: [shell]
  mbc: E1041

composite_rules:
  - id: host-user-identity-dns-beacon
    desc: Host user identity DNS beacon
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    platforms: [unix, windows]
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: micro-behaviors/data/string/concat::named-fields-near-dot-join
    any:
      - id: micro-behaviors/fs/path/secret-config::gitconfig-file
      - id: micro-behaviors/fs/path/secret-config::git-repository-config-file

  # A single A-record lookup can carry a compact victim profile without the
  # chunking seen in full DNS tunnels. The adjacent sanitized user, hostname,
  # and cwd labels prove what is placed in the query; the resolver and suffix
  # legs prove that the constructed value is a DNS name rather than a log key.
  - id: js-host-profile-dns-query
    desc: JavaScript exfiltrates user host and path through a DNS query
    crit: hostile
    conf: 0.995
    attack: "T1048.003,T1082,T1033"
    for: [javascript, typescript]
    platforms: [unix, windows]
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/data/string/concat::js-user-host-path-dotted-call-template
      - id: micro-behaviors/communications/http/url/domain::js-leading-dot-dns-suffix
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup

  # The compact cousin of js-host-profile-dns-query: the hostname alone,
  # prefixed as a cleartext label onto an OOB callback zone and resolved.
  # The computed resolve() name is the carrier (no fixed service name is
  # queried), the OOB endpoint supplies the collector zone, and the hostname
  # query supplies the payload -- a single lookup hands the machine identity
  # to whoever runs the zone. The broader profile rule stays silent because
  # no user, cwd or encoded label is involved.
  - id: js-hostname-oob-dns-query
    desc: JavaScript exfiltrates the hostname through a DNS query to an OOB zone
    crit: hostile
    conf: 0.96
    attack: "T1048.003,T1082,T1033"
    for: [javascript, typescript]
    platforms: [unix, windows]
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/sysinfo/hostname/
      - id: micro-behaviors/communications/dns/resolver::dns-resolve-dynamic-name
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/documentation/disclosure::npm-config-diagnostic-research-beacon
      - id: well-known/tool/detection/security-scanner/
