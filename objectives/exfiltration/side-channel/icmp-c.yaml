# C code reads developer credential files, hex-encodes their bytes, and emits
# each byte as two ICMP packet-size nibbles. The address and helper names can
# change; the credential source plus paired high/low nibble calls is the signal.
defaults:
  platforms: [unix]
  for: [c, cpp, tar]
  attack: T1048.002
  crit: hostile
  conf: 0.99
composite_rules:
  - id: c-credential-pairs-over-icmp-size
    desc: C code transmits credential-file bytes as ICMP packet-size nibbles
    scope: file
    all:
      - id: micro-behaviors/communications/icmp::c-icmp-helper-call
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: c-icmp-high-nibble-call
      - id: c-icmp-low-nibble-call
traits:
  - id: c-icmp-high-nibble-call
    crit: notable
    desc: C passes high byte nibble to ICMP
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)ch_icmp_nibble\s*\(.{0,40},\s*\w+\s*>>\s*4\s*\)'
  - id: c-icmp-low-nibble-call
    crit: notable
    desc: C passes low byte nibble to ICMP
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)ch_icmp_nibble\s*\(.{0,40},\s*\w+\s*&\s*15\s*\)'
