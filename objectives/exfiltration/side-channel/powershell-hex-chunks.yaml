defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1048.003
composite_rules:
  - id: powershell-hex-oob-dns-transfer
    desc: Hex formatting and indexed DNS queries to an OOB collector
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/dns/label::powershell-hex-indexed-dns-query
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-dns-capable-endpoint
