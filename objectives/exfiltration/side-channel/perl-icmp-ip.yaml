defaults:
  platforms: [unix, windows]
  for: [perl]
  conf: 0.97

composite_rules:
  - id: perl-host-byte-ipv4-helper
    desc: Perl hostname query with byte iteration and IPv4 helper call
    crit: suspicious
    scope: file
    near_lines: 8
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::perl-hostname-call
      - id: micro-behaviors/data/buffer/integer-codec::perl-unpack-byte-iteration
      - id: micro-behaviors/communications/icmp::perl-ipv4-prefix-helper-call

  - id: perl-host-identity-ipv4-icmp-exfil
    desc: Perl host-byte helper accompanies scalar-built ping destinations
    crit: hostile
    attack: T1048.003,T1082
    for: [perl, tar, cpan]
    scope: archive
    all:
      - id: perl-host-byte-ipv4-helper
      - id: micro-behaviors/communications/icmp::perl-ping-destination-byte
