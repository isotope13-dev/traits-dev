# C# reads developer credential files and hands each byte's high and low nibble
# to an ICMP helper (ping packet size or target encodes the nibble). Helper and
# class names can change; the paired >> 4 / & 15 arguments to an ICMP-named call
# plus a credential path and a whole-file read are the signal.
defaults:
  platforms: [unix, windows]
  for: [csharp]
  attack: T1048.003

traits:
  - id: csharp-icmp-high-nibble-call
    desc: C# passes high byte nibble to ICMP
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)icmp\w{0,12}\s*\([^;]{1,80},\s*\w+\s*>>\s*4\s*\)'

  - id: csharp-icmp-low-nibble-call
    desc: C# passes low byte nibble to ICMP
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)icmp\w{0,12}\s*\([^;]{1,80},\s*\w+\s*&\s*(15|0xf)\s*\)'

composite_rules:
  - id: csharp-credential-bytes-icmp-nibble-exfil
    desc: C# sends credential-file bytes as ICMP nibble pairs
    crit: hostile
    conf: 0.98
    attack: T1048.003,T1552.001
    scope: file
    near_lines: 60
    all:
      - id: csharp-icmp-high-nibble-call
      - id: csharp-icmp-low-nibble-call
      - id: micro-behaviors/fs/read/file/content/whole::dotnet-readallbytes-token
    any:
      - id: micro-behaviors/fs/path/credential/registry::package-manager-or-netrc-config-path
      - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
