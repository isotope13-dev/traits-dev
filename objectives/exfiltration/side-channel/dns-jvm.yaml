defaults:
  conf: 0.98
  platforms: [routeros, appliance, unix]
  for: [java, kotlin, class, jar]
  attack: T1048.003

composite_rules:
  - id: jvm-dns-side-channel-exfil
    desc: JVM DNS side-channel exfil
    crit: hostile
    for: [java, kotlin]
    all:
      - id: micro-behaviors/data/encode/base64/primitive::java-base64-encode
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getallbyname-source

  - id: jvm-dns-side-channel-bytecode
    desc: JVM Base64 and DNS resolution APIs
    crit: notable
    # A JAR pools independent class files. Requiring a single class keeps
    # generic shaded Base64 and DNS-library code from combining into a
    # side-channel finding at archive scope.
    for: [class]
    scope: leaf
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/encode/base64/primitive::jvm-base64-encode-bytecode
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getallbyname-bytecode
