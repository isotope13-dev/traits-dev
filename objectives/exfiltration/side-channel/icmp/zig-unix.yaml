defaults:
  platforms: [unix, windows]
  for: [zig]
  attack: T1048.002
  conf: 0.97

composite_rules:
  - id: zig-host-identity-icmp-exfil
    desc: Zig host identity over ICMP
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/icmp/channel::zig-icmp-helper-call
      - id: micro-behaviors/os/sysinfo/hostname::zig-gethostname-reference

  - id: zig-credential-icmp-exfil
    desc: Zig credentials over ICMP
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/icmp/channel::zig-icmp-helper-call
      - id: objectives/credential-access/files/config::source-control-token-paths
