defaults:
  platforms: [unix, windows]
  for: [csharp, java, kotlin, elixir, ruby, swift, zig]
  attack: T1048.002
  conf: 0.97

composite_rules:
  # The Perl module reads developer credential files and sends each byte as
  # two ICMP packet-size symbols. Keep the credential loop and nibble encoder
  # in the same source member; the WHOIS relay is separately detected.
  - id: perl-credential-nibbles-over-icmp
    desc: Perl sends developer credentials through ICMP packet sizes
    crit: hostile
    conf: 0.99
    for: [perl]
    platforms: [unix]
    scope: file
    all:
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: micro-behaviors/process/create/exec::perl-exec-call
      - id: micro-behaviors/communications/icmp/ping::perl-ping-size-nibble

  - id: source-host-identity-icmp-exfil
    desc: Zig host identity over ICMP
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/icmp/channel::source-icmp-helper-call
      - id: micro-behaviors/os/sysinfo/hostname::source-hostname-helper-call

  - id: source-credential-icmp-exfil
    desc: Zig credentials over ICMP
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/icmp/channel::source-icmp-helper-call
    any:
      - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
      - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input

  # One Python file: the name lookup and the ping that carries it are the
  # same routine. Under `scope: archive` the two legs are
  # `socket.gethostname()` and a call to ping -- both ordinary on their own
  # -- pooled across an entire distribution, so any tree large enough to
  # contain each once scored hostile. Home Assistant OS bundles thousands of
  # packages and matched on scapy's arch/windows/native.py.
  - id: python-host-identity-icmp-exfil
    desc: Python sends host identity through ICMP
    crit: hostile
    conf: 0.96
    for: [python]
    # And the same routine, not merely the same file. scapy's
    # arch/windows/native.py calls `socket.gethostname()` at line 137 to find
    # the local interface and shells out to `ping` at line 241 to populate the
    # ARP cache before sending a raw packet -- two unrelated jobs a hundred
    # lines apart. Exfiltration puts the name it just read into the packet it
    # is about to send.
    near_bytes: 512
    all:
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/communications/icmp/ping::python-ping-process-call

  - id: python-credential-icmp-exfil
    desc: Python package sends credentials over ICMP
    crit: hostile
    conf: 0.98
    for: [python]
    # Legs must share one routine, not merely one archive: a large toolkit
    # trivially contains ping somewhere, subprocess somewhere, and a
    # credential-file reference somewhere unrelated (a hygiene scanner that
    # audits .netrc and pings the LAN fires on every file of its own wheel).
    # Exfiltration reads the credential into the packet it is about to send,
    # so the legs are bound to one member file.
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/icmp/ping::python-ping-process-call
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
    any:
      - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
    needs: 1

  - id: javascript-host-identity-icmp-exfil
    desc: JavaScript sends host identity through ICMP
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/communications/icmp/ping::javascript-ping-interpolated-host

  - id: php-host-identity-icmp-exfil
    desc: PHP sends host identity through ICMP
    crit: hostile
    conf: 0.96
    for: [php]
    # Same routine, not merely the same distribution: EGroupware's source
    # archive holds one legitimate gethostname() in its mailer and one
    # `mariadb-admin ping -h db` readiness wait in a CI workflow — pooled
    # archive-wide that scored hostile on two unrelated ordinary tokens.
    # Exfiltration puts the name it just read into the packet it is about
    # to send.
    near_bytes: 512
    all:
      - id: micro-behaviors/os/sysinfo/hostname::php-gethostname-call
      - id: micro-behaviors/communications/icmp/ping::ping

  - id: powershell-host-identity-ipv4-icmp-exfil
    desc: PowerShell encodes host identity in ping target addresses
    crit: hostile
    conf: 0.99
    for: [powershell, zip]
    platforms: [windows]
    scope: archive
    all:
      - id: micro-behaviors/os/sysinfo/hostname::powershell-host-identity-utf8-bytes
      - id: micro-behaviors/communications/icmp/ping::powershell-ping-interpolated-address-byte
