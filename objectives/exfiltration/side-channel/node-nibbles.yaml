defaults:
  platforms: [unix, windows]
  crit: hostile
  for: [npm, javascript, typescript, tar]

composite_rules:
- id: node-nibble-credential-icmp-exfil
  desc: Package pairs credential reads with nibble-coded ICMP transmission
  conf: 0.98
  attack: T1048.003,T1552.001
  scope: archive
  all:
  - id: micro-behaviors/communications/icmp::node-ping-size-nibble
  - id: micro-behaviors/communications/icmp::node-high-nibble-helper-call
  - id: micro-behaviors/communications/icmp::node-low-nibble-helper-call
  - id: micro-behaviors/fs/read/file/content/whole::read-node
  any:
  - id: micro-behaviors/fs/path/credential/registry
  - id: micro-behaviors/fs/path/credential/ssh
  - id: micro-behaviors/fs/path/credential/cloud

