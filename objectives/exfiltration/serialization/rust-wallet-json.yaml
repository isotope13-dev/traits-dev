defaults:
  platforms: [unix, windows]
  for: [rust]
  conf: 0.98
  attack: T1552.001,T1041

traits:
  - id: rust-wallet-secret-json-template
    desc: Serializes private key and proxy address
    crit: suspicious
    if:
      type: literal
      regex: '"(pk|privateKey)"\s*:\s*"\{\}".{0,80}"proxyAddress"'
