defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: trufflehog-message-body-detector-field
    desc: Message body precedes TruffleHog detector field
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)["''](text|body|content|payload)["'']\s*:[\s\S]{0,480}["'']DetectorName["'']'

  - id: trufflehog-detector-raw-fields
    desc: TruffleHog detector precedes raw-secret field
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']DetectorName["''][\s\S]{0,320}["'']Raw(V2)?["'']'

composite_rules:
  - id: trufflehog-raw-result-message-body
    desc: Serializes TruffleHog raw-secret result
    crit: suspicious
    conf: 0.97
    near_bytes: 64
    all:
      - id: trufflehog-message-body-detector-field
      - id: trufflehog-detector-raw-fields
