# Data Serialization - JavaScript/Node.js
# Detects serialization of sensitive data before exfiltration
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  # GuardDog: JSON-serialized environment. Serialization is only an
  # exfiltration signal when a request sink is close to the serialized value;
  # worker/config extractors and telemetry code routinely snapshot process.env
  # without sending it anywhere.
  - id: js-serialize-environment
    desc: Environment variables serialized for a nearby HTTP request (JS)
    crit: suspicious
    conf: 0.90
    scope: leaf
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/access::javascript
      - id: micro-behaviors/data/serialize/json::process-env-json-stringify
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    unless:
      - id: well-known/app/development/vscode-extension/vscode-marketplace::dev-session-canvas-vsix
      - id: well-known/app/development/vscode-extension/vscode-marketplace::dev-session-canvas-member-path
      # Test harnesses commonly snapshot process.env to restore it between
      # cases. There is no outbound sink in this serialization alone.
      - id: metadata/package/testing/presence/harness::tests-path-basename
    downgrade:
      any:
        - id: metadata/library/github-actions::action-output-env-file
