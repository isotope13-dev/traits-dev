defaults:
  platforms: [aix, unix]
  for: [rust]
  attack: T1041

traits:
  - id: rust-file-exfil-record
    desc: Rust FILE exfil record
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'FILE:{}'
  - id: rust-cred-exfil-record
    desc: Rust CRED exfil record
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'CRED:{}:{}'
