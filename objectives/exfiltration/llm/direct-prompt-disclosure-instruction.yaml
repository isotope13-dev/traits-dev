defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.97
traits:
- id: direct-prompt-disclosure-instruction
  desc: Direct instruction requests system prompt
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?im)^[^|\n]{0,60}(show|reveal|print|repeat|output|disclose).{0,9}(your|the) system prompt'
