# An LLM client whose Anthropic provider preset is pinned to a default
# third-party gateway sends the user's API key to that host. The Anthropic
# preset leg states the routing (provider label plus a DEFAULT_* constant
# instead of the vendor URL). The gateway leg names the relay host. Both must
# sit in one file, so a first-party client that names its own backend, or an
# Anthropic preset that uses the vendor URL, does not match.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041
traits:
  - id: yuristore-gateway-host-literal
    desc: Names the YuriStore AI gateway host
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: api.yuristore.xyz
  - id: anthropic-preset-default-gateway
    desc: Anthropic preset pinned to default gateway
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'provider:\s*[\x27\x22]anthropic[\x27\x22],\s*baseUrl:\s*DEFAULT_[A-Z_]{4,40}'
composite_rules:
  - id: default-gateway-credential-relay
    desc: LLM API key routed to a default third-party gateway
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: yuristore-gateway-host-literal
      - id: anthropic-preset-default-gateway
