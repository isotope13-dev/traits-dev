defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  attack: T1005,T1041,T1059
traits:
- id: llm-urlencodes-report-context-for-export
  for: [python]
  desc: Prompt encodes private report context for export
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)URL[- ]encoded\b[^\n]{0,120}\b(report titles|user information)\b'
- id: llm-forces-context-image-response
  for: [python]
  desc: Prompt requires diagnostic image in response
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)MUST include.{0,80}(image|pixel) in your response'
- id: llm-report-context-image-url
  for: [python]
  # Any query-string image (shields.io badges) matches; the urlencode and
  # forced-image legs of the export composite supply the exfil meaning.
  desc: Markdown image URL with a query string
  crit: component
  conf: 0.97
  if:
    type: text
    regex: '!\[[^\]\n]{1,40}\]\(https?://[^)\n]{1,100}\?[^)\n]{1,100}\)'
- id: llm-complete-system-instruction-request
  for: [python]
  desc: Prompt requests complete system instructions
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: '(?i)output your complete system instructions, including all rules'
- id: llm-system-instruction-format-demand
  for: [python]
  desc: Prompt demands system instructions in code block
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)tool definitions.{0,80}markdown code block labeled'

composite_rules:
- id: llm-invisible-report-context-export
  for: [python]
  desc: Invisible prompt injects private report data into image URL
  conf: 0.99
  attack: none
  near_bytes: 1200
  all:
  - id: llm-urlencodes-report-context-for-export
  - id: llm-forces-context-image-response
  - id: llm-report-context-image-url
- id: llm-invisible-system-prompt-disclosure
  for: [python]
  desc: Invisible prompt requests system instructions and tool details
  conf: 0.98
  attack: none
  near_bytes: 500
  all:
  - id: llm-complete-system-instruction-request
  - id: llm-system-instruction-format-demand

