# The hostile conclusion requires all three invariant parts of the technique:
# a model-generated command boundary, an explicit document-collection prompt,
# and a remote upload operation. The model vendor and exfiltration protocol are
# intentionally interchangeable.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1005,T1041,T1059
composite_rules:
  - id: llm-generated-collection-http-body-exfiltration
    for: [python]
    desc: LLM-generated collection sent in an HTTP request body
    conf: 0.98
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-command-execution
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
    any:
      - id: objectives/collection/file-targeting/llm::llm-host-profile-collection-request
      - id: objectives/collection/file-targeting/llm::llm-document-collection-request
    near_bytes: 6000
  - id: llm-generated-document-exfiltration
    for:
    - shell
    - python
    - javascript
    - lua
    - powershell
    desc: LLM-generated document collection and exfiltration
    conf: 0.99
    all:
    - id: objectives/execution/interpreter/eval/generated::llm-generated-command-execution
    - id: objectives/collection/file-targeting/llm::llm-document-collection-request
    - id: objectives/collection/file-targeting/filter::high-value-document-extension-cluster
    any:
    - id: micro-behaviors/communications/http/upload::requests-post-files-parameter
    - id: micro-behaviors/communications/ssh/transfer::sftp-put
    - id: objectives/exfiltration/http/upload/
    - id: micro-behaviors/communications/http/request/body::groovy-http-post-output
    - id: micro-behaviors/communications/http/request/body::node-upload-sink
    - id: micro-behaviors/communications/http/request/body::objc-curlopt-postfields
    - id: micro-behaviors/communications/http/request/body::objc-libcurl-postfields
    - id: micro-behaviors/communications/http/request/verb::c-ssl-write-http-post
    - id: micro-behaviors/communications/http/request/verb::lua-https-post-request
    - id: micro-behaviors/communications/http/request/verb::swift-urlsession-post-method-reference
    - id: micro-behaviors/communications/http/upload::bittorrent-archive-http-client
    - id: micro-behaviors/communications/http/client/managed::csharp-base64-before-http-send
    - id: micro-behaviors/communications/http/upload::curl-file-upload-exfil
    - id: micro-behaviors/communications/http/upload::lua-curl-post-temp-file
    - id: micro-behaviors/communications/http/upload::mediarecorder-before-network-sink
    - id: micro-behaviors/communications/http/upload::mediarecorder-upload-endpoint-context
    - id: micro-behaviors/communications/http/upload::shell-curl-octet-upload
    - id: objectives/exfiltration/http/archive::applescript-chunked-curl-exfil
    - id: objectives/exfiltration/http/archive::applescript-direct-chunked-upload
    - id: objectives/exfiltration/http/archive::applescript-outzip-curl-exfil
    - id: objectives/exfiltration/http/archive::applescript-outzip-p2p-exfil
    - id: objectives/exfiltration/http/archive::applescript-profile-and-exfil
    - id: objectives/exfiltration/http/archive::github-release-encrypted-archive-exfil
    - id: objectives/exfiltration/http/archive::powershell-base64-archive-http-exfil
    - id: objectives/exfiltration/http/archive::ps-zip-body-upload
    - id: micro-behaviors/communications/http/upload::python-targz-requests-post
    - id: objectives/exfiltration/http/archive::shell-staged-tar-http-upload
    - id: objectives/exfiltration/http/archive::windows-encoded-archive-http-exfil
    - id: objectives/exfiltration/http/encrypted::browser-webcrypto-hybrid-http-exfil
    - id: objectives/exfiltration/http/encrypted::encrypted-icp-canister-exfil
    - id: objectives/exfiltration/http/encrypted::hybrid-encrypt-exfil
    - id: objectives/exfiltration/http/encrypted::node-gcm-rsa-encrypted-exfil
    - id: objectives/exfiltration/http/encrypted::node-hybrid-encrypted-exfil
    - id: objectives/exfiltration/http/encrypted::python-cbc-rsa-encrypted-http-upload
    - id: objectives/exfiltration/http/encrypted::python-hybrid-encrypted-http-upload
    - id: objectives/exfiltration/stealer/account-db::kotlin-bytecode-sensitive-http-copy-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-lua-credential-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-lua-credential-raw-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-native-account-config-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-native-message-api-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-node-chunked-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-node-credential-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-php-credential-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-powershell-credential-http-exfil
    - id: objectives/exfiltration/stealer/appliance-config::openwrt-python-credential-http-exfil
    - id: objectives/exfiltration/stealer/credential::node-encode-exfil
    - id: objectives/exfiltration/stealer/env::ci-token-curl-upload
    - id: objectives/exfiltration/stealer/env::curl-post-data
    - id: objectives/exfiltration/stealer/env::node-host-profile-env-exfil
    - id: objectives/exfiltration/stealer/env::python-encoded-environment-raw-http-exfil
    - id: micro-behaviors/communications/http/upload::file-enumeration-curl-upload-context
    - id: objectives/exfiltration/stealer/file::groovy-http-file-upload
    - id: objectives/exfiltration/stealer/image::all-site-extension-image-upload
    - id: objectives/exfiltration/stealer/multi-source::java-command-sensitive-exfil
    - id: objectives/exfiltration/stealer/multi-source::jvm-netbsd-sensitive-exfil
    - id: objectives/exfiltration/stealer/system-info/network::openwrt-uci-host-profile-http-exfil
    near_bytes: 6000
  - id: llm-generated-credential-github-exfiltration
    for: [python, javascript]
    desc: LLM credential, encryption, GitHub write signals
    conf: 0.995
    attack: T1005,T1041,T1027,T1552.001,T1552.004,T1567.001
    all:
      - id: objectives/collection/file-targeting/llm::llm-generated-credential-collection
      - id: micro-behaviors/communications/http/services/github::github-contents-api-write-flow
      - id: micro-behaviors/data/encode/base64::base64-encoding
    any:
      - id: micro-behaviors/crypto/symmetric/encrypt::python-encrypt-method-call
      - id: micro-behaviors/crypto/symmetric/encrypt::symmetric-encryption-operation
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::webcrypto-subtle-encrypt-call
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-oaep-public-encrypt
      - id: micro-behaviors/crypto/hybrid::openssl-rsa-aes-hybrid-encryption
    near_bytes: 12000
  # Amazon Kiro / "Powers"-class steering file: a repo-controlled instruction
  # file (POWER.md) that the agent reads as persistent context. When such a file
  # also tells the agent to send/upload credentials or secrets, it is an
  # attacker-authored prompt injection designed to exfiltrate local data — the
  # same trust-boundary failure Mindgard reported against Kiro. The instruction
  # file basename is one of AGENTS/CLAUDE/GEMINI/POWER(.md).
  - id: steering-file-sensitive-data-exfiltration
    desc: Agent steering file directs export of sensitive data
    conf: 0.95
    attack: T1195.002,T1059,T1567
    for: [markdown]
    near_bytes: 8000
    all:
      - id: metadata/package/agent-skill::agent-instructions-md-basename
      - id: objectives/command-and-control/remote-command/llm/action::llm-sensitive-data-export-directive
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
