defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: extension-page-relay-llm-endpoint-clues
  desc: Page relay with LLM endpoint and broad access
  crit: suspicious
  conf: 0.97
  scope: archive
  for:
  - xpi
  - crx
  - zip
  - javascript
  - chrome-manifest
  all:
  - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
  - id: metadata/permission/host::permission-all-urls
  - id: micro-behaviors/communications/ipc/extension-message::page-content-message-relay
  unless:
  - id: well-known/app/ai/browser-agent/webbrain::webbrain-ai-agent-context
