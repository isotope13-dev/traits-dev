# Repository tooling can turn private agent-session context into public review
# metadata by requiring the agent to quote the human's request in a PR body.
# The disclosure directive alone is suspicious; the hostile conclusion also
# requires an independently matched instruction to publish that body.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, ruby, go, rust, powershell]
  attack: T1041,T1195.002

traits:
  - id: human-request-quotation-directive
    desc: Directs quoting human request
    crit: suspicious
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)\bquote what the (human|user) (asked|requested)\b'

composite_rules:
  - id: agent-human-request-pr-body-exfiltration
    desc: Agent exports human request through PR body
    crit: hostile
    conf: 0.99
    for: [shell]
    scope: file
    near_bytes: 2600
    all:
      - id: human-request-quotation-directive
      - id: micro-behaviors/communications/http/services/code-forge::agent-authored-contribution-context
      - id: micro-behaviors/communications/http/services/code-forge::pull-request-body-publication-directive
