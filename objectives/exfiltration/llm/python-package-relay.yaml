# The sklern PyPI typosquat presents an sklearn-like package while exposing a
# helper that forwards caller prompts to Groq under a bundled API credential.
# Require the package identity and the complete relay behavior across the
# wheel; the individual key and chat-call observations remain neutral atoms.
defaults:
  platforms: [unix, windows]
  for: [whl, python, pkginfo]
  attack: T1041

composite_rules:
  - id: sklern-groq-prompt-relay
    desc: Sklern package relays caller prompts to Groq with a bundled key
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/name/vocabulary::sklern-package-name
      - id: micro-behaviors/data/format/credentials::python-groq-client-key-cooccurrence
      - id: micro-behaviors/communications/http/client/library::chat-completions-create-call
      - id: micro-behaviors/ui/terminal::python-input-literal-prompt
      - id: metadata/lang/source/syntax/object::chat-role-message-record
