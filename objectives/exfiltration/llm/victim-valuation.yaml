# Stolen-data victim valuation: a stealer sends its collected credential
# bundle to a hosted LLM under a prompt that ranks the person by
# monetization value, then exfiltrates the returned dossier. The hostile
# claim needs all three legs -- an inference endpoint, the valuation
# prompt, and browser-credential theft evidence -- so fraud-scoring or
# account-recovery tools that merely call a model do not match.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [scripts, source, pe, elf, macho]
  attack: T1555.003,T1041,T1567

composite_rules:
  - id: stolen-credentials-llm-monetization-valuation
    desc: Stolen credentials ranked by an LLM
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
      - id: micro-behaviors/data/llm/evaluation::llm-person-monetization-assessment-prompt
    any:
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/data/db/access::chromium-login-row-secret-fields
      - id: micro-behaviors/data/db/read/records::browser-record-table-select
    needs: 2
  - id: llm-victim-dossier-telegram-exfiltration
    desc: LLM victim dossier sent via Telegram
    conf: 0.98
    attack: T1555.003,T1041,T1567.002
    all:
      - id: micro-behaviors/data/llm/evaluation::llm-person-monetization-assessment-prompt
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    any:
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/data/db/access::chromium-login-row-secret-fields
      - id: micro-behaviors/data/db/read/records::browser-record-table-select
    needs: 2
