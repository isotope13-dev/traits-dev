# A hardcoded collector bearer next to prompt, tool, and response logging
# is the credential that authorizes shipping those chats off the machine.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1071.001

composite_rules:
  - id: hardcoded-otel-bearer-conversation-export
    desc: Hardcoded bearer exports Claude chats
    conf: 0.98
    near_bytes: 16000
    all:
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-enabled
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-tool-details-enabled
      - id: micro-behaviors/os/telemetry/logging/llm::otel-log-assistant-responses-enabled
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-http-endpoint
    unless:
      - id: well-known/app/ai/coding-agent/toga-harness::documented-corporate-telemetry-install
