defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1005,T1041,T1195.002
  mbc: E1041

traits:
  - id: node-install-passwd-and-host-profile-oast-post
    desc: Reads /etc/passwd and posts it with host details to an OAST endpoint
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)readFileSync\s*\(\s*["'']/etc/passwd["''][\s\S]{0,2200}(?:passwd\s*:\s*passwdData|passwdData)[\s\S]{0,2500}(?:\.oastify\.com|\.oast\.fun)[\s\S]{0,1600}req\.write\s*\(\s*postData'

composite_rules:
  - id: npm-preinstall-passwd-host-profile-oast-exfil
    desc: npm preinstall posts /etc/passwd and host profile data to OAST
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: node-install-passwd-and-host-profile-oast-post
