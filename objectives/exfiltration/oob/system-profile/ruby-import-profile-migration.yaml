defaults:
  platforms: [unix, windows]
  for: [ruby]
  mbc: E1041
composite_rules:
  - id: ruby-oastify-host-profile-json-post
    desc: Ruby posts host profile JSON to OASTify
    crit: hostile
    conf: 0.99
    attack: "T1041,T1195.002"
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/data/serialize/object::json-generate
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-hostname-query-field
      - id: micro-behaviors/network/interface/query::ruby-local-ip-discovery-signal
    any:
      - id: micro-behaviors/fs/directory/cwd::ruby-current-directory-json-field
      - id: metadata/lang/source/syntax/key-value::ruby-home-api-field
      - id: micro-behaviors/os/env/user-info::ruby-username-field-from-env-or-login

  - id: ruby-host-profile-oob-callback
    desc: Ruby host profile OOB callback
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/profile::ruby-host-profile-json-fields
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/data/serialize/object::json-generate
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::gethostname
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
      - id: micro-behaviors/network/interface/query::socket-ip-address
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::ruby-platform-const

  - id: ruby-depconf-host-profile-callback
    desc: Ruby dependency confusion host profile callback
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/description/disclosure::ruby-dependency-confusion-marker
      - id: ruby-host-profile-oob-callback

  - id: ruby-import-time-oast-host-profile
    desc: Ruby HTTP GET and OAST identity URL
    crit: hostile
    conf: 0.99
    attack: "T1041,T1195.002"
    all:
      - id: micro-behaviors/communications/url/construction/template::ruby-oast-host-profile-url
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname

  - id: ruby-require-pipedream-host-beacon
    desc: Ruby library HTTP-beacons hostname to Pipedream
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    all:
      - id: micro-behaviors/os/module/load/path::ruby-require-relative
      - id: objectives/exfiltration/oob/system-profile::ruby-pipedream-host-profile-http-get
    unless:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
  - id: ruby-gem-pipedream-install-runtime-beacon
    desc: Ruby gem beacons Pipedream at install and require
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    scope: archive
    for: [gem, ruby]
    all:
      - id: objectives/exfiltration/oob/system-profile::extconf-pipedream-host-beacon
      - id: objectives/exfiltration/oob/system-profile::ruby-require-pipedream-host-beacon
