defaults:
  for: [manifests]
  platforms: [unix, windows]
composite_rules:
  - id: npm-preinstall-oast-system-info-exfil
    desc: npm preinstall exfiltrates host identity and working directory to OAST
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    all:
      - id: micro-behaviors/communications/http/curl/body::npm-preinstall-oast-probe
    any:
      - id: micro-behaviors/process/identity/query/command::preinstall-hostname-whoami-pwd
      - id: micro-behaviors/process/identity/query/command::preinstall-info-field-hostname-whoami-pwd