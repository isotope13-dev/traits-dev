defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-preinstall-hostname-command
    desc: npm preinstall invokes hostname
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)"preinstall"\s*:\s*"[^"\n]{0,900}hostname'
  - id: npm-preinstall-whoami-command
    desc: npm preinstall invokes whoami
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)"preinstall"\s*:\s*"[^"\n]{0,900}whoami'
  - id: npm-preinstall-passwd-file-read
    desc: npm preinstall reads the passwd file
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)cat\s+/etc/passwd'
  - id: npm-preinstall-oast-stdin-post
    desc: Preinstall sends piped data to OAST
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)curl\s+-X\s+POST\s+-d\s+@-\s+https?://[a-z0-9.-]+\.oast\.fun'

composite_rules:
  - id: npm-preinstall-host-passwd-oast-exfil
    desc: npm preinstall posts host identity and passwd data to OAST
    crit: hostile
    conf: 0.995
    attack: T1041,T1003.008,T1195.002
    all:
      - id: npm-preinstall-hostname-command
      - id: npm-preinstall-whoami-command
      - id: npm-preinstall-passwd-file-read
      - id: npm-preinstall-oast-stdin-post
