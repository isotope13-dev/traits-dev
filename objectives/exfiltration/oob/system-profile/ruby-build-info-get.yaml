defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1041,T1082

traits:
  - id: ruby-encoded-info-json-query
    desc: Ruby URL encodes info JSON query
    crit: notable
    if:
      type: text
      substr: 'info=#{Base64.encode64(info.to_json)}'

composite_rules:
  - id: ruby-build-host-info-get
    desc: Ruby build file encodes host profile for GET
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/package/recipe/gemspec::filename-rakefile
      - id: ruby-encoded-info-json-query
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-hostname-query-field
      - id: micro-behaviors/os/env/user-info::ruby-username-field-from-env-or-login
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/get::ruby-net-http-get-call
