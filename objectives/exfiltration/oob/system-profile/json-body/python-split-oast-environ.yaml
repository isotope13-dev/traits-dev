defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: install-class-processed-environment-oast-post
    desc: Install class posts processed environment
    crit: suspicious
    conf: 0.99
    attack: T1195.002,T1082,T1041
    if:
      type: tree-sitter
      query: |
        ((module
          (import_from_statement module_name: (dotted_name) @importmod name: (dotted_name (identifier) @imported))
          (class_definition superclasses: (argument_list (identifier) @install)
          body: (block
            (function_definition name: (identifier) @init body: (block (try_statement body: (block
              (expression_statement (assignment left: (identifier) @envjson right: (call
                function: (attribute object: (identifier) @json attribute: (identifier) @dumps)
                arguments: (argument_list (call function: (attribute object: (attribute object: (identifier) @os attribute: (identifier) @environ) attribute: (identifier) @copy))))))
              (expression_statement (assignment left: (attribute object: (identifier) @self1 attribute: (identifier) @stored1)
                right: (call function: (identifier) @encode arguments: (argument_list (identifier) @envjson2))))))))
            (function_definition name: (identifier) @run body: (block
              (expression_statement (assignment left: (identifier) @scheme right: (string) @https))
              (expression_statement (assignment left: (identifier) @host right: (string)))
              (expression_statement (assignment left: (identifier) @oast right: (binary_operator left: (string) @oa right: (string) @st)))
              (expression_statement (assignment left: (identifier) @tld right: (string) @fun))
              (expression_statement (assignment left: (identifier) @url right: (string
                (interpolation expression: (identifier) @scheme2)
                (interpolation expression: (identifier) @host2)
                (interpolation expression: (identifier) @oast2)
                (interpolation expression: (identifier) @tld2)) @format))
              (expression_statement (call function: (attribute object: (attribute object: (identifier) @urllib attribute: (identifier) @request) attribute: (identifier) @urlopen)
                arguments: (argument_list (identifier) @url2 (keyword_argument name: (identifier) @data
                  value: (attribute object: (identifier) @self2 attribute: (identifier) @stored2))))))))))
          (#eq? @install "install") (#eq? @init "__init__") (#eq? @run "run")
          (#eq? @json "json") (#eq? @dumps "dumps") (#eq? @os "os") (#eq? @environ "environ") (#eq? @copy "copy")
          (#eq? @envjson @envjson2) (#eq? @importmod "setup.utils") (#eq? @imported @encode) (#eq? @encode "ec") (#eq? @self1 "self") (#eq? @self2 "self") (#eq? @stored1 @stored2)
          (#eq? @scheme @scheme2) (#eq? @host @host2) (#eq? @oast @oast2) (#eq? @tld @tld2) (#eq? @url @url2)
          (#eq? @urllib "urllib") (#eq? @request "request") (#eq? @urlopen "urlopen") (#eq? @data "data")
          (#match? @format "://") (#match? @format "[.]")
          (#match? @https "^.https.$") (#match? @oa "^.oa.$") (#match? @st "^.st.$") (#match? @fun "^.fun.$"))

  - id: ec-base64-encode-helper
    desc: Helper base64 encodes its input
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition name: (identifier) @helper
          parameters: (parameters (typed_parameter (identifier) @input))
          body: (block (return_statement (call
            function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
            arguments: (argument_list (call function: (attribute object: (identifier) @input2 attribute: (identifier) @encode)))))))
          (#eq? @helper "ec") (#eq? @base64 "base64") (#eq? @b64 "b64encode")
          (#eq? @input @input2) (#eq? @encode "encode"))

composite_rules:
  - id: install-class-base64-environment-oast-post
    for: [python, zip, python-sdist, whl, tar]
    desc: Install hook posts base64 environment to OAST endpoint
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1082,T1041
    scope: outer
    all:
      - id: install-class-processed-environment-oast-post
      - id: ec-base64-encode-helper
  - id: install-class-environment-oast-post
    desc: Install class posts environment to OAST host
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1082,T1041
    all:
      - id: install-class-processed-environment-oast-post
      - id: metadata/build/package/recipe/setup-hooks::setuptools-install-class
