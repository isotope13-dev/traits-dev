defaults:
  platforms:
  - unix
  for:
  - package.json
  - zip
  - npm
  - tar
  attack: T1195.002,T1033,T1041
traits:
- id: preinstall-curl-posts-base64-id
  desc: Preinstall posts base64 encoded user identity
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: text
    regex: curl\s+-d\s+\$\(id\s*\|\s*base64\)
- id: preinstall-pipedream-callback-host
  desc: Preinstall targets a Pipedream collector
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: text
    substr: .m.pipedream.net
composite_rules:
- id: npm-preinstall-posts-base64-id-to-pipedream
  desc: npm preinstall posts encoded user identity
  crit: hostile
  conf: 0.995
  scope: archive
  near_bytes: 400
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/oob/system-profile/json-body::preinstall-curl-posts-base64-id
  - id: objectives/exfiltration/oob/system-profile/json-body::preinstall-pipedream-callback-host
