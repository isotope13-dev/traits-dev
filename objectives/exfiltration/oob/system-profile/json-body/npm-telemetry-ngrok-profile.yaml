defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082,T1033
traits:
- id: node-telemetry-host-user-post
  desc: Telemetry module posts hostname and username
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /getSystemInfo\s*\(\s*\)/s
          $b0_1 = /os\.userInfo\s*\(\s*\)\.username/s
          $b0_2 = /os\.hostname\s*\(\s*\)/s
          $b0_3 = /sendToServer\s*\(\s*info\s*\)/s
          $b0_4 = /JSON\.stringify\s*\(\s*info\s*\)/s
          $b0_5 = /\.request\s*\(/s
          $b0_6 = /\.write\s*\(\s*postData\s*\)/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 150 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1500 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 800 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 800 and
                        for any i6 in (1..#b0_6) : (
                          @b0_6[i6] >= (@b0_5[i5] + !b0_5[i5]) and
                          @b0_6[i6] <= (@b0_5[i5] + !b0_5[i5]) + 800 and
                          true
                        )
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-install-ngrok-telemetry-profile
  desc: npm install sends host profile to ngrok
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::node-telemetry-ngrok-report
  - id: objectives/exfiltration/oob/system-profile/json-body::node-telemetry-host-user-post
