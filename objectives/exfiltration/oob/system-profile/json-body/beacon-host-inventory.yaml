defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - text
  attack: T1082,T1041
  mbc: E1041
composite_rules:
- id: concealed-endpoint-host-inventory
  for:
  - php
  desc: Host-profile reporting with concealed or hardcoded endpoint
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/exfiltration/oob/system-profile/url-query::host-profile-json-post
  any:
  - id: objectives/command-and-control/beacon/network/host-identity::hostname-beacon-to-hardcoded-ip
  - id: micro-behaviors/communications/url/encoded::encoded-url-curl-tls-bypass
  - id: micro-behaviors/communications/url/resource-path/file::url-ip-php-endpoint-encoded
  unless:
  - id: metadata/path/directory::test-directory-component
