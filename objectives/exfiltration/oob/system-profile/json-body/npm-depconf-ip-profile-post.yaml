defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082,T1033
traits:
- id: js-ip-host-profile-post
  desc: Posts host identity to an IP endpoint
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /os\.hostname\s*\(\s*\)/s
          $b0_1 = /os\.userInfo\s*\(\s*\)\.username/s
          $b0_2 = /JSON\.stringify\s*\(/s
          $bad_0_3 = /["'\s]/s
          $b0_3 = /http:\/\/([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}\//s
          $b0_4 = /http\.request\s*\(/s
          $b0_5 = /\.write\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1500 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 300 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) + 0 and
                      (@b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 300 or not $bad_0_3 in ((@b0_3[i3] + !b0_3[i3]) .. @b0_4[i4] - 301)) and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 800 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-depconf-ip-host-profile-post
  desc: Install hook posts host profile to an IP address
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/oob/system-profile/json-body::js-ip-host-profile-post
  any:
  - id: metadata/package/description/disclosure::npm-description-dependency-confusion-variants
  - id: metadata/package/description/disclosure::desc-dependency-confusion
