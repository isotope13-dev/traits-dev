defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
traits:
- id: lifecycle-runs-telemetry-script
  desc: Install hook runs a telemetry script
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /["'](preinstall|postinstall)["']\s*:\s*["'](sh\s+scripts\/telemetry\.sh|node\s+index\.js)\s+(preinstall|postinstall)/
        condition:
          (
            $b0_0
          )
      }
