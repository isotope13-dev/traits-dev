defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: module-urllib-host-json-oob-send
    desc: Module sends hostname JSON to OOB
    crit: hostile
    conf: 0.99
    attack: T1041,T1082
    # Bind both values and the opened request. Separate Request facts cannot
    # establish that the hostname-bearing request is the one being opened.
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @host
            right: (call function: (attribute object: (identifier) @socket
              attribute: (identifier) @hostname))))
          . (comment)* . (expression_statement (assignment left: (identifier) @request
            right: (call function: (attribute object: (attribute
              object: (identifier) @urllib attribute: (identifier) @request_module)
              attribute: (identifier) @constructor)
              arguments: (argument_list . (string (string_content) @url)
                (keyword_argument name: (identifier) @data
                  value: (call function: (attribute object: (call
                    function: (attribute object: (identifier) @json attribute: (identifier) @dumps)
                    arguments: (argument_list . (dictionary
                      (pair value: (identifier) @host_value)) .))
                    attribute: (identifier) @encode)))))))
          . (comment)* . (expression_statement (call function: (attribute
            object: (attribute object: (identifier) @urllib2 attribute: (identifier) @request_module2)
            attribute: (identifier) @urlopen)
            arguments: (argument_list . (identifier) @sent))))
          (#eq? @socket "socket") (#eq? @hostname "gethostname")
          (#eq? @host @host_value) (#eq? @request @sent)
          (#eq? @urllib "urllib") (#eq? @urllib2 "urllib")
          (#eq? @request_module "request") (#eq? @request_module2 "request")
          (#eq? @constructor "Request") (#eq? @urlopen "urlopen")
          (#eq? @data "data") (#eq? @json "json") (#eq? @dumps "dumps")
          (#eq? @encode "encode")
          (#match? @url "(?i)^https?://([a-z0-9-]+\\.)*(webhook\\.site|oastify\\.com|interact\\.sh)/"))
