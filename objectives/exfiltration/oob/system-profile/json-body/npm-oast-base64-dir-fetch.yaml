defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041
composite_rules:
- id: npm-preinstall-oast-dir-fetch
  desc: npm preinstall fetch sends encoded module directory to OAST
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::oast-base64-dir-fetch
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::invoke-fetch-helper
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
