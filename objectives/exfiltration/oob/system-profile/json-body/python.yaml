defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1041
  mbc: E1041
composite_rules:
- id: python-install-hook-globbed-file-content-post
  desc: Install hook uploads recursively found file contents
  crit: hostile
  conf: 0.98
  attack: T1005,T1041,T1195.002
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/fs/search/name::glob-call
  - id: micro-behaviors/communications/http/request/json::python-json-near-urllib-request
  - id: micro-behaviors/communications/ip/literal::public-or-shared-ipv4-http-url
- id: python-import-time-oob-network-host-profile
  desc: Import starts OOB host profile reporting
  crit: hostile
  conf: 0.98
  attack: T1041,T1082,T1195.002
  scope: file
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  - id: micro-behaviors/communications/url/host/oob/callback-url::webhook-site-url-literal
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  any:
  - id: micro-behaviors/communications/http/request/body/construction::http-post-with-body-argument
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
- id: python-webhook-host-profile-post
  desc: Python posts host profile to webhook
  crit: suspicious
  conf: 0.94
  near_lines: 160
  all:
  - id: objectives/discovery/system/profile::python-host-profile-field-set
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
- id: python-webhook-user-path-post
  desc: Python posts user path profile to webhook
  crit: suspicious
  conf: 0.93
  near_lines: 160
  all:
  - id: micro-behaviors/data/serialize/schema-system::user-path-profile-fields
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
- id: python-webhook-full-host-profile-exfil
  desc: Python exfils full host profile to webhook
  crit: hostile
  conf: 0.97
  near_lines: 180
  all:
  - id: objectives/discovery/system/profile::python-host-profile-field-set
  - id: micro-behaviors/data/serialize/schema-system::user-path-profile-fields
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
