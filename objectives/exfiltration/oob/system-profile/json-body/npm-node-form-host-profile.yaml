defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
  for:
  - npm
  - zip
  - tar
  - javascript
  - package.json
composite_rules:
- id: npm-depconf-import-form-host-profile-post
  desc: Dependency confusion entrypoint posts host profile
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/description/disclosure::npm-description-dependency-confusion-variants
  - id: metadata/package/entrypoint/module::main-root-javascript-entry
  - id: objectives/exfiltration/oob/system-profile/url-query::node-form-encoded-host-profile-post
- id: npm-depconf-form-host-profile-post
  desc: Dependency confusion install sends a host profile
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/description/disclosure::npm-description-dependency-confusion-variants
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/oob/system-profile/url-query::node-form-encoded-host-profile-post
