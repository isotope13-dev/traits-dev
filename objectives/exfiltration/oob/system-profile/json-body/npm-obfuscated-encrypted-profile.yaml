defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
traits:
- id: js-obfuscated-encrypted-profile-fetch
  desc: Fetches endpoint with encrypted host profile
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /createCipheriv\s*\(/s
          $b0_1 = /String\.fromCharCode\s*\(/s
          $b0_2 = /os\s*\[/s
          $b0_3 = /process\.platform/s
          $b0_4 = /process\.cwd\s*\(\s*\)/s
          $b0_5 = /JSON\.stringify\s*\(/s
          $b0_6 = /fetch\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1000 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 600 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 200 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 100 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 300 and
                        for any i6 in (1..#b0_6) : (
                          @b0_6[i6] >= (@b0_5[i5] + !b0_5[i5]) and
                          @b0_6[i6] <= (@b0_5[i5] + !b0_5[i5]) + 500 and
                          true
                        )
                      )
                    )
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-install-obfuscated-encrypted-profile-fetch
  desc: npm install sends encrypted host profile to encoded endpoint
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/oob/system-profile/json-body::js-obfuscated-encrypted-profile-fetch
