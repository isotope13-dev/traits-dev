defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1005,T1041,T1195.002
  mbc: E1041
composite_rules:
- id: npm-preinstall-passwd-host-profile-oast-exfil
  desc: npm preinstall posts /etc/passwd and host profile data to OAST
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/oob/system-profile/request-body::node-install-passwd-and-host-profile-oast-post
