defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  mbc: E1041
composite_rules:
- id: npm-postinstall-exfiltrates-lambda-environment
  desc: npm hook exfiltrates Lambda environment to OOB
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/fs/proc/info/listing::javascript-proc-directory-read
  - id: micro-behaviors/communications/http/request/lambda-runtime::aws-lambda-runtime-api-environment-key
  - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: micro-behaviors/communications/url/host/name::ngrok-free-domain
