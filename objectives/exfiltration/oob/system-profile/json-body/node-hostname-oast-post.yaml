defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1082,T1041
composite_rules:
- id: npm-hostname-oast-profile-post
  desc: npm package posts hostname to callback service
  crit: hostile
  conf: 0.98
  scope: archive
  for:
  - zip
  - npm
  - javascript
  - package.json
  all:
  - id: objectives/exfiltration/oob/system-profile/url-query::node-hostname-oast-profile-post
  - id: metadata/import/builtin::require-https
  - id: metadata/import/builtin::require-os
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
