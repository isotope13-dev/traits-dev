defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1003.008,T1195.002
  mbc: E1041
  for:
  - package.json
  - shell
composite_rules:
- id: npm-install-hook-passwd-oastify-exfil
  desc: npm install hook sends /etc/passwd to OASTify
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  scope: archive
  near_bytes: 1200
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-curl-uploads-passwd-file
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-curl-posts-passwd-to-oastify
- id: curl-uploads-passwd-to-oast
  desc: curl uploads passwd file to OAST host
  crit: hostile
  conf: 0.99
  for:
  - javascript
  - shell
  near_bytes: 1200
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-curl-uploads-passwd-file
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-curl-posts-passwd-to-oastify
