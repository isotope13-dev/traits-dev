defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082,T1033
traits:
- id: js-host-user-json-ngrok-post
  desc: Posts host and user through HTTPS
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /os\.hostname\s*\(\s*\)/s
          $b0_1 = /os\.userInfo\s*\(\s*\)\.username/s
          $b0_2 = /https\.request\s*\(/s
          $b0_3 = /\.write\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 4000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 600 and
                    true
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: js-ngrok-host-user-post
  desc: Script posts host and user profile to ngrok
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  scope: file
  all:
  - id: objectives/exfiltration/oob/system-profile/json-body::js-host-user-json-ngrok-post
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::js-ngrok-free-host
- id: npm-depconf-ngrok-host-user-post
  desc: Dependency confusion package posts host user profile
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: objectives/exfiltration/oob/system-profile/json-body::js-ngrok-host-user-post
  any:
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/description/disclosure::npm-description-dependency-confusion-variants
