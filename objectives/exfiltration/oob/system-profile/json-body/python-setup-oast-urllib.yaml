defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-install-oast-host-json-post
    desc: Install posts host profile to OAST server
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1082,T1041
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @endpoint right: (string) @url))
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (assignment left: (identifier) @host right: (call
              function: (attribute object: (identifier) @socket attribute: (identifier) @hostname))))
            (expression_statement (assignment left: (identifier) @data right: (dictionary
              (pair key: (string) @hostkey value: [
                (identifier) @host2
                (string (interpolation expression: (identifier) @host2))]))))
            (expression_statement (assignment left: (identifier) @encoded right: (call
              function: (attribute object: (call function: (attribute object: (identifier) @json attribute: (identifier) @dumps)
                arguments: (argument_list (identifier) @data2)) attribute: (identifier) @encode))))
            (expression_statement (assignment left: (identifier) @req right: (call
              function: (attribute object: (attribute object: (identifier) @urllib attribute: (identifier) @request1) attribute: (identifier) @request)
              arguments: (argument_list (identifier) @endpoint2 (keyword_argument name: (identifier) @datakey value: (identifier) @encoded2)))))
            (with_statement (with_clause (with_item value: (as_pattern
              (call function: (attribute object: (attribute object: (identifier) @urllib2 attribute: (identifier) @request2) attribute: (identifier) @urlopen)
                arguments: (argument_list (identifier) @req2))))))))
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (call function: (identifier) @invoke))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @cmdclass
              value: (dictionary (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @socket "socket") (#eq? @hostname "gethostname") (#eq? @host @host2)
          (#match? @hostkey "host")
          (#eq? @data @data2) (#eq? @json "json") (#eq? @dumps "dumps") (#eq? @encode "encode")
          (#eq? @urllib "urllib") (#eq? @urllib2 "urllib") (#eq? @request1 "request") (#eq? @request2 "request")
          (#eq? @request "Request") (#eq? @urlopen "urlopen") (#eq? @datakey "data")
          (#eq? @endpoint @endpoint2) (#eq? @encoded @encoded2) (#eq? @req @req2)
          (#eq? @helper @invoke) (#eq? @install "install") (#eq? @run "run")
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#eq? @hook @registered)
          (#match? @installkey "^.install.$") (#match? @url "https?://[^/]+[.]oast[.]fun"))
