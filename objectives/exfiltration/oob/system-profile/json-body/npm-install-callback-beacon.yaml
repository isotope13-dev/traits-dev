defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  - typescript
  attack: T1041,T1195.002
  mbc: E1041
traits:
- id: npm-postinstall-curls-package-id-to-beeceptor
  desc: Postinstall sends package ID to Beeceptor
  crit: suspicious
  conf: 0.99
  for:
  - package.json
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /"postinstall"\s*:\s*"curl\s+https?:\/\/[^"']+\.free\.beeceptor\.com\/[^"']+"/is
        condition:
          (
            $b0_0
          )
      }
composite_rules:
- id: npm-postinstall-beeceptor-package-callback
  desc: npm postinstall makes a remote request to a package-specific callback collector
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: objectives/exfiltration/oob/system-profile/json-body::npm-postinstall-curls-package-id-to-beeceptor
- id: npm-install-oast-proof-token-beacon
  desc: npm install script sends a proof token to an OAST callback
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - typescript
  - package.json
  scope: archive
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::node-install-oast-poc-token-beacon
  any:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
