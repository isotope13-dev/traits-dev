# A backdoor that also posts an inventory of the host it landed on.
#
# The command-and-control rules describe the channel: a beacon to a hardcoded
# address, an encoded endpoint, certificate checking turned off. This states
# what travels the other way on first contact -- a JSON document describing
# the machine.
#
# It is a separate act with separate consequences. A channel means the
# operator can reach this host; an inventory means they already know what it
# is, and can select from among everyone who installed the package. It is
# also the part that decides whether a given victim is worth a second stage,
# so a responder reading only the C2 finding underestimates what the operator
# already has.
#
# Keyed on the profile being assembled and posted, not on which fields it
# contains, so a variant that swaps hostname for MAC address or adds the
# cloud instance id is covered.
defaults:
  platforms: [unix, windows]
  for: [scripts, text]
  attack: T1082,T1041
  mbc: E1041

composite_rules:
  - id: backdoor-posts-host-inventory
    desc: Backdoor posts a host inventory
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/exfiltration/oob/system-profile::host-profile-json-post
    any:
      - id: objectives/command-and-control/beacon/network/host-identity::hostname-beacon-to-hardcoded-ip
      - id: objectives/command-and-control/backdoor/decoded-c2::encoded-c2-ssl-bypass
      - id: objectives/command-and-control/infrastructure/ip-url-php::external-ip-php-endpoint-encoded
    unless:
      - id: metadata/package/testing/
