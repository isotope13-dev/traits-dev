# Host-profile collection and reporting beside concealed/hardcoded endpoints.
# This combination warrants inspection; neither an encoded destination nor
# disabled certificate checks establishes a remotely controlled backdoor.
defaults:
  platforms: [unix, windows]
  for: [scripts, text]
  attack: T1082,T1041
  mbc: E1041

composite_rules:
  - id: concealed-endpoint-host-inventory
    desc: Host-profile reporting with concealed or hardcoded endpoint
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/exfiltration/oob/system-profile::host-profile-json-post
    any:
      - id: objectives/command-and-control/beacon/network/host-identity::hostname-beacon-to-hardcoded-ip
      - id: micro-behaviors/communications/url/encoded::encoded-url-curl-tls-bypass
      - id: objectives/command-and-control/infrastructure/ip-url-php::external-ip-php-endpoint-encoded
    unless:
      - id: metadata/package/testing/
