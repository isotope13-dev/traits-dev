defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, typescript, npm, tar, zip]
  attack: T1041,T1195.002
  mbc: E1041

traits:
  - id: npm-postinstall-curls-package-id-to-beeceptor
    desc: npm postinstall sends a package-specific callback to a Beeceptor endpoint
    crit: suspicious
    conf: 0.99
    for: [package.json]
    if:
      type: text
      regex: '(?is)"postinstall"\s*:\s*"curl\s+https?://[^"'']+\.free\.beeceptor\.com/[^"'']+"'
  - id: node-install-oast-poc-token-beacon
    desc: Install script sends a generated proof token and package name to an OAST callback
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)TOKEN\s*=\s*["'']POC-["''][\s\S]{0,1200}\.oast\.me/poc-beacon\?token=[\s\S]{0,500}&pkg=[^"'']+'

composite_rules:
  - id: npm-postinstall-beeceptor-package-callback
    desc: npm postinstall makes a remote request to a package-specific callback collector
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: npm-postinstall-curls-package-id-to-beeceptor
  - id: npm-install-oast-proof-token-beacon
    desc: npm install script sends a proof token to an OAST callback
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar]
    scope: archive
    all:
      - id: node-install-oast-poc-token-beacon
    any:
      - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
