defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: setup-host-user-json-callback
    desc: Package setup sends host and user profile
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082,T1033
    all:
      - id: metadata/build/pip::packaging-setuptools-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/os/sysinfo/platform/host::platform-node
      - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
