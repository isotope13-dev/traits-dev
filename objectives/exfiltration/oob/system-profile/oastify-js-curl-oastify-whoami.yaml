defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: js-curl-oastify-whoami
    desc: Curl exfils whoami to OASTify
    crit: suspicious
    conf: 0.98
    attack: "T1041"
    for: [javascript]
    if:
      type: string_literal
      regex: "curl\\b.{0,240}https?://[a-z0-9-]+\\.oastify\\.com[^`'\"]{0,240}\\$\\(whoami\\)"
