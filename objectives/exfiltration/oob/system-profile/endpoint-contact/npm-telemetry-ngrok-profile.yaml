defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082,T1033
traits:
- id: node-telemetry-ngrok-report
  desc: Script reports telemetry to an ngrok endpoint
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $bad_0_0 = /[\s"']/s
          $b0_0 = /https?:\/\/[^\s"']+\.ngrok-free\.app\//s
          $b0_1 = /new\s+Telemetry\s*\(/s
          $b0_2 = /\.report\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) + 0 and
                (@b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 or not $bad_0_0 in ((@b0_0[i0] + !b0_0[i0]) .. @b0_1[i1] - 301)) and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 150 and
                  true
                )
              )
            )
          )
      }
