# File-level co-occurrence establishes neither URL-carried host identity
# nor a call path from module scope to the network operation.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: module-call-oob-post-hostname-cooccurrence
  desc: Module call, OOB POST and hostname co-occur
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
