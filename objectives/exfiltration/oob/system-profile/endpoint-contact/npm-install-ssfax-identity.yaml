defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041
  for:
  - package.json
traits:
- id: npm-install-ssfax-user-callback
  desc: Install sends username to SSFAX callback
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.install
    regex: (?i)curl\s+https?://\$\(whoami\)[^\s"']{0,120}\.i\.ssfax\.cc
- id: npm-install-ssfax-shadow-upload
  desc: Install uploads shadow file to SSFAX
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.install
    regex: (?i)curl\s+--data\s+["']?@/etc/shadow["']?\s+[^\s]{1,140}\.i\.ssfax\.cc
