defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: npm-preinstall-hostname-command
  desc: npm preinstall invokes hostname
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?i)"preinstall"\s*:\s*"[^"\n]{0,900}hostname
  unless:
  - type: value
    path: scripts.preinstall
    regex: '\Aecho([ \t]+[\w.,:=-]+)+[ \t]*\z'
  downgrade:
    any:
      - id: metadata/package/scripts/install::npm-preinstall-echo-host-identity
- id: npm-preinstall-whoami-command
  desc: npm preinstall invokes whoami
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?i)"preinstall"\s*:\s*"[^"\n]{0,900}whoami
  unless:
  - type: value
    path: scripts.preinstall
    regex: '\Aecho([ \t]+[\w.,:=-]+)+[ \t]*\z'
  downgrade:
    any:
      - id: metadata/package/scripts/install::npm-preinstall-echo-host-identity
- id: npm-preinstall-passwd-file-read
  desc: npm preinstall reads the passwd file
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?i)cat\s+/etc/passwd
- id: preinstall-curl-hostname-query-no-port
  desc: Preinstall curl sends hostname without a port
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: 'curl\s+https?://([0-9.]{7,15})/\?[^ =]{1,40}=`hostname`'
    is: external_ip
- id: preinstall-curl-hostname-query-with-port
  desc: Preinstall curl sends hostname with a port
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    regex: 'curl\s+https?://([0-9.]{7,15}):[0-9]{1,5}/\?[^ =]{1,40}=`hostname`'
    is: external_ip

composite_rules:
- id: preinstall-curl-hostname-query
  desc: Preinstall curl sends hostname in URL
  crit: notable
  any:
  - id: preinstall-curl-hostname-query-no-port
  - id: preinstall-curl-hostname-query-with-port
- id: preinstall-raw-ip-hostname-query
  desc: Preinstall sends hostname to a raw IP address
  crit: hostile
  attack: T1041,T1082
  all:
  - id: preinstall-curl-hostname-query
  - id: micro-behaviors/communications/http/request/package::npm-preinstall-ip-callback
