defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: cargo-build-hook-oob-profile-exfil
  desc: Cargo build hook sends a host profile to an OOB endpoint
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  - id: objectives/exfiltration/oob/system-profile/request-body::rust-build-rs-oob-host-profile-exfil
