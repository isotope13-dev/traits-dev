defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - zip
  - python-sdist
  - whl
  attack: T1041,T1082,T1195.002
  mbc: E1041
traits:
- id: python-wechat-hostname-message-post
  desc: Webhook POST carries hostname message
  crit: suspicious
  conf: 0.97
  for: [python]
  if:
    type: tree-sitter
    query: |
      ((function_definition body: (block (try_statement body: (block
        (expression_statement (assignment left: (identifier) @host right: (call
          function: (attribute object: (identifier) @socket attribute: (identifier) @gethostname))))
        (expression_statement (assignment left: (identifier) @endpoint_var right: (string) @endpoint))
        (expression_statement (assignment left: (identifier) @message_var right: (dictionary) @message))
        (expression_statement (assignment right: (call function: (attribute object: (identifier) @requests attribute: (identifier) @post)
          arguments: (argument_list (identifier) @endpoint_arg (keyword_argument name: (identifier) @data value: (call
            function: (attribute object: (identifier) @json attribute: (identifier) @dumps)
            arguments: (argument_list (identifier) @message_arg)))))))))))
        (#eq? @socket "socket") (#eq? @gethostname "gethostname")
        (#eq? @host "hostname") (#eq? @requests "requests") (#eq? @post "post")
        (#eq? @data "data") (#eq? @json "json") (#eq? @dumps "dumps") (#eq? @message_var @message_arg)
        (#eq? @endpoint_var @endpoint_arg) (#match? @endpoint "qyapi[.]weixin[.]qq[.]com/cgi-bin/webhook/send")
        (#match? @message "[{]hostname[}]"))
- id: python-setup-wechat-webhook-url
  desc: Setup references WeChat bot webhook
  crit: notable
  for:
  - python
  if:
    type: text
    regex: (?i)https?://qyapi\.weixin\.qq\.com/cgi-bin/webhook/send\?key=
- id: python-setup-root-server-marker-check
  desc: Setup checks root server marker files
  crit: suspicious
  for:
  - python
  if:
    type: text
    regex: (?s)os\.path\.exists\(["']/root/\.cx\.(sh|server)["']\)
composite_rules:
- id: python-setup-marker-restarts-server-services
  desc: Root server markers with nearby restart commands
  crit: suspicious
  for: [python]
  scope: file
  near_lines: 12
  all:
  - id: python-setup-root-server-marker-check
  - id: micro-behaviors/os/service/restart/request::python-service-restart-command
- id: python-install-wechat-hostname-post
  desc: Install hook posts hostname to WeChat webhook
  crit: hostile
  conf: 0.97
  for: [python]
  scope: file
  all:
  - id: python-wechat-hostname-message-post
  - id: python-setup-wechat-webhook-url
  - id: micro-behaviors/communications/http/webhook::setup-py-install-webhook-beacon
