defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1041,T1082
traits:
- id: npm-cucumber-hostname-substitution
  desc: Collects hostname during preinstall
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: HOSTNAME=$(hostname)
- id: npm-cucumber-profile-endpoint
  desc: Targets receiver app profile endpoint
  crit: suspicious
  if:
    type: value
    path: scripts.preinstall
    substr: https://receiver-app-h713.onrender.com/data
