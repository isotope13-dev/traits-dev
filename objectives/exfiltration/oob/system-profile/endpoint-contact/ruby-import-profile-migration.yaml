defaults:
  platforms:
  - unix
  - windows
  for:
  - ruby
  mbc: E1041
composite_rules:
- id: ruby-depconf-host-profile-callback
  desc: Ruby dependency confusion host profile callback
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/package/description/disclosure::ruby-dependency-confusion-marker
  - id: objectives/exfiltration/oob/system-profile/url-query::ruby-host-profile-oob-callback
- id: ruby-gem-pipedream-install-runtime-beacon
  desc: Ruby gem beacons Pipedream at install and require
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  scope: archive
  for:
  - gem
  - ruby
  all:
  - id: objectives/exfiltration/oob/system-profile/url-query::extconf-pipedream-host-beacon
  - id: objectives/exfiltration/oob/system-profile/url-query::ruby-require-pipedream-host-beacon
