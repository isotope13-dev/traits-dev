defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - javascript
  - typescript
  attack: T1041,T1195.002
  mbc: E1041
traits:
- id: node-install-oast-poc-token-beacon
  desc: Sends proof token and package to OAST
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /TOKEN\s*=\s*["']POC-["']/is
          $b0_1 = /\.oast\.me\/poc-beacon\?token=/is
          $b0_2 = /&pkg=[^"']+/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 500 and
                  true
                )
              )
            )
          )
      }
