defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1041,T1082
traits:
- id: js-evidence-oast-collaborator
  desc: Sets OASTify collaborator host
  crit: notable
  if:
    type: text
    regex: collaboratorUrl\s*=\s*["'][a-z0-9-]{12,63}\.oastify\.com["']
- id: js-evidence-wget-output
  desc: Captures wget command output
  crit: notable
  if:
    type: text
    regex: exec\(["']wget\s+-O\s+-\s+http://google\.com["']
- id: js-evidence-oast-send
  desc: Sends collected evidence to collaborator
  crit: notable
  if:
    type: text
    regex: sendRequest\(`http://\$\{collaboratorUrl\}`\s*,\s*evidence\)
