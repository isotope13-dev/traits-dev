defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
traits:
- id: host-user-cwd-variables
  desc: Reads host, user and directory values
  crit: component
  conf: 0.99
  if:
    type: text
    regex: (?s)os\.hostname\(\).{0,100}os\.userInfo\(\)\.username.{0,100}process\.cwd\(\)
- id: import-call-callback
  desc: Module imports and calls callback
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)import\s+clb\s+from\s+["\x27]\./clb\.js["\x27].{0,600}\bclb\s*\(\s*\)
