defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041
  for:
  - javascript
traits:
- id: oast-base64-dir-fetch
  desc: Fetch sends encoded module directory to OAST
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: fetch\(`https://[a-z0-9-]+\.oastify\.com/\?cwd=\$\{btoa\(__dirname\)\}`\)
- id: invoke-fetch-helper
  desc: Module invokes fetch helper on load
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?s)async\s+function\s+hello\(\)\s*\{.{0,300}\}\s*hello\(\)
