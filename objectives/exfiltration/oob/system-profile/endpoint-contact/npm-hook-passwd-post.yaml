# Observations from an npm install hook that reads the account database and
# POSTs it to a request-capture service. The passwd read is host-agnostic; the
# request-bin host and the self-labelled npm/stealer User-Agent are IOCs that
# corroborate but do not gate the hostile composite in request-body/.
defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1082,T1041
traits:
- id: npm-hook-passwd-read
  desc: Install script reads /etc/passwd
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts[*]
    regex: 'readFile(Sync)?\(\s*["'']/etc/passwd["'']'
- id: npm-ctf-bin-host
  desc: Targets graversen request bin
  crit: suspicious
  if:
    type: value
    path: scripts.preinstall
    substr: 'hostname: ''bin.graversen.io'''
- id: npm-ctf-bin-stealer-agent
  desc: Identifies request as npm stealer
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: '''User-Agent'': ''npm/stealer'''
