defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
  for:
  - javascript
traits:
- id: ngrok-collector-url
  desc: Script sets ngrok collector URL
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: COLLECTOR\s*=\s*["\x27]https://[a-z0-9-]+\.ngrok-free\.app/log["\x27]
- id: https-request-write
  desc: Script writes HTTPS request body
  crit: component
  conf: 0.99
  if:
    type: text
    regex: (?s)https\.request\s*\(.{0,1000}\.write\s*\(
