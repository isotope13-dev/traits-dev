defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1003.008,T1195.002
  mbc: E1041
  for:
  - package.json
  - shell
  - javascript
traits:
- id: npm-curl-uploads-passwd-file
  desc: Uploads account database through curl
  crit: suspicious
  conf: 0.99
  unless:
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /curl\b[^\n]{0,240}--data(-binary)?\s+['"]?@\/etc\/passwd/is
          $b1_0 = /tar\s+-czf\s+-\s+\/etc\/passwd/is
          $b1_1 = /\|\s*base64/is
          $b1_2 = /\|\s*curl\b[^\n]{0,240}--data-binary\s+@-/is
        condition:
          (
            $b0_0
          ) or
          (
            for any i0 in (1..#b1_0) : (
              for any i1 in (1..#b1_1) : (
                @b1_1[i1] >= (@b1_0[i0] + !b1_0[i0]) and
                @b1_1[i1] <= (@b1_0[i0] + !b1_0[i0]) + 180 and
                for any i2 in (1..#b1_2) : (
                  @b1_2[i2] >= (@b1_1[i1] + !b1_1[i1]) and
                  @b1_2[i2] <= (@b1_1[i1] + !b1_1[i1]) + 180 and
                  true
                )
              )
            )
          )
      }
