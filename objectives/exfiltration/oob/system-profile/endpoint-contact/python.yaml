defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1041
  mbc: E1041
traits:
- id: python-extract-stack-reference
  desc: Python captures the current call stack
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: extract_stack
composite_rules:
- id: python-install-hook-oob-get-beacon
  desc: Python install hook sends an HTTP GET to an OOB collector
  crit: hostile
  conf: 0.96
  attack: T1041,T1195.002
  scope: outer
  for:
  - python
  - python_sdist
  - whl
  - zip
  - tar
  all:
  - id: micro-behaviors/communications/url/host/oob/package::python-install-hook-oob-reference
  - id: micro-behaviors/communications/url/host/oob/callback-url::webhook-site-url-literal
  - id: micro-behaviors/communications/http/get::requests-get
- id: setup-py-oob-collector-contact
  desc: setup.py contacts OOB collector at module scope
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/build/package/recipe/setup-hooks::setuptools-install-class
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  any:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
  - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
