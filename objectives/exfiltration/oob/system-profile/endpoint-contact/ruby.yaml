defaults:
  platforms:
  - unix
  - windows
  for:
  - ruby
  attack: T1041
  mbc: E1041
composite_rules:
- id: ruby-extconf-obfuscated-host-profile-callback
  desc: Ruby extconf sends an encoded host profile to a decoded domain
  crit: hostile
  conf: 0.99
  attack: T1041,T1195.002
  all:
  - id: metadata/build/package/recipe/gemspec::filename-extconf
  - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
  - id: micro-behaviors/communications/url/host/name::base64-domain-content
  - id: micro-behaviors/communications/http/lib/netlib::ruby-net-http-reference
  - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
  - id: micro-behaviors/os/sysinfo/profile::ruby-system-identity-queries
  any:
  - id: micro-behaviors/data/encode/base64/primitive::ruby-base64-encode-call
  - id: micro-behaviors/data/encode/base64/primitive::ruby-base64-urlsafe-encode
  - id: objectives/discovery/system/profile::ruby-packed-host-profile-fields
