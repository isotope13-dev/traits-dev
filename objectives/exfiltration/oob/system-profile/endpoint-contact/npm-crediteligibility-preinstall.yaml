defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1041,T1082,T1033
traits:
- id: npm-crediteligibility-profile-endpoint
  desc: Targets credit eligibility profile endpoint
  crit: suspicious
  if:
    type: value
    path: scripts.preinstall
    substr: https://credit.tb4.us/ping
- id: npm-crediteligibility-hostname-substitution
  desc: Collects hostname during preinstall
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: hostname=$(hostname)
- id: npm-crediteligibility-cwd-substitution
  desc: Collects working directory during preinstall
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: cwd=$(pwd)
