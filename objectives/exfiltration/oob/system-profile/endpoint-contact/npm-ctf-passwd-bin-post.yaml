defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1082,T1041
traits:
- id: npm-ctf-passwd-read
  desc: Reads passwd during package preinstall
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: readFileSync('/etc/passwd'
- id: npm-ctf-bin-host
  desc: Targets graversen request bin
  crit: suspicious
  if:
    type: value
    path: scripts.preinstall
    substr: 'hostname: ''bin.graversen.io'''
- id: npm-ctf-bin-stealer-agent
  desc: Identifies request as npm stealer
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: '''User-Agent'': ''npm/stealer'''
