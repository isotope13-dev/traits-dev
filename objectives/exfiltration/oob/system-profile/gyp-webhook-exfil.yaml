defaults:
  platforms: [unix, windows]
  for: [gyp, npm, tar]
  attack: T1195.002,T1041
  mbc: B0024

composite_rules:
  - id: gyp-before-build-inline-node-webhook-exfil
    desc: GYP build action posts host data to webhook.site
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/exfiltration/oob/endpoint::gyp-install-webhook-host-exfil-clues
      - id: micro-behaviors/communications/url/host/oob/endpoint::gyp-webhook-site-text-reference
