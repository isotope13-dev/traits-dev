defaults:
  mbc: B0024
  platforms: [unix, windows]
  for: [ruby]
  crit: suspicious
  conf: 0.8
composite_rules:
  - id: extconf-pipedream-host-beacon
    desc: extconf.rb beacons hostname to Pipedream OOB
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    scope: leaf
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: objectives/exfiltration/oob/system-profile::ruby-pipedream-host-profile-http-get
  # Install-time host recon to a minted OOB name is a supply-chain hook, not
  # the same claim as a generic script posting identity. Pipedream stays on
  # its own composite because that beacon is an HTTP GET profile.
  - id: extconf-oob-host-profile-post
    desc: extconf.rb posts a host profile to an OOB service
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041,T1082
    scope: file
    near_lines: 80
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
  # Keep account-file export distinct from generic hostname reconnaissance:
  # this requires a sensitive account database read as well as an OOB network
  # connection, so it detects the stolen data rather than ordinary telemetry.
  - id: ruby-account-file-oob-exfil
    desc: Ruby sends local account database contents to an OOB host
    crit: hostile
    conf: 0.99
    attack: T1003.008,T1041
    all:
      - id: micro-behaviors/fs/read/file/account::etc-passwd-read
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-connect
