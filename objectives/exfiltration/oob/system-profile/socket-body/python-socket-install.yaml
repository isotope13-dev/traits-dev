defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-socket-sends-interface-profile
    desc: Sends network interface profile over socket
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (identifier) @profile
            right: (tuple (call function: (attribute object: (identifier) @psutil attribute: (identifier) @interfaces)))))
          (expression_statement (assignment left: (identifier) @message
            right: (string (interpolation expression: (identifier) @profile2))))
          (expression_statement (call function: (attribute object: (identifier) @socket1 attribute: (identifier) @connect)))
          (expression_statement (call function: (attribute object: (identifier) @socket2 attribute: (identifier) @send)
            arguments: (argument_list (call function: (attribute
              object: (call function: (identifier) @str arguments: (argument_list (identifier) @message2))
              attribute: (identifier) @encode)))))))
          (#eq? @psutil "psutil") (#eq? @interfaces "net_if_addrs") (#eq? @profile @profile2)
          (#eq? @socket1 @socket2) (#eq? @connect "connect") (#eq? @send "send")
          (#eq? @str "str") (#eq? @message @message2) (#eq? @encode "encode"))

composite_rules:
  - id: python-install-socket-interface-profile-exfil
    desc: Install hook sends network interface profile to a socket
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1016,T1041
    scope: file
    all:
      - id: python-socket-sends-interface-profile
      - id: micro-behaviors/communications/socket/connect/attempt::setup-py-install-raw-socket-exfil
