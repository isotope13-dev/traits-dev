defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  mbc: B0030
  attack: T1041
composite_rules:
- id: php-oob-chunked-host-profile-get
  desc: PHP exfiltrates profile in OOB host labels
  crit: hostile
  conf: 0.99
  mbc: E1041
  attack: T1048.003,T1082,T1033
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/client/file-read::php-file-get-dynamic-host-label
  - id: micro-behaviors/data/string/split::php-str-split-call
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::php-uname-call
  - id: micro-behaviors/fs/directory/cwd::php-getcwd
  - id: micro-behaviors/fs/file/stat::php-get-current-user
  - id: micro-behaviors/fs/path/check::php-is-writable-call
  needs: 2
  near_bytes: 4096
