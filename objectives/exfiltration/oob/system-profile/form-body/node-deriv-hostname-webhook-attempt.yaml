defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1082
traits:
- id: node-deriv-hostname-form
  desc: Adds hostname to curl form data
  crit: notable
  if:
    type: text
    # Require a curl data or form option. A bare `hostname=${hostname}` also
    # occurs in ordinary error messages, such as test timeout text.
    regex: '(-d|-F|--data[a-z-]{0,20}|--form)[ =]{1,2}.{0,2}hostname=\$\{hostname\}'
