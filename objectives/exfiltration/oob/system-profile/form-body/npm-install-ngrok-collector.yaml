defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
traits:
- id: install-host-profile
  desc: Script collects host and working directory
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: (?s)os\.hostname\s*\(\s*\).{0,200}os\.platform\s*\(\s*\).{0,200}process\.cwd\s*\(
