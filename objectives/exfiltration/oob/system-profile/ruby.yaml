# Ruby extconf OOB callbacks collect host identity and conceal the callback
# target behind Base64 before making an HTTP request.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1041
  mbc: E1041

traits:
  - id: ruby-host-profile-report
    desc: Ruby host profile fields
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(usr|user):.{0,100}\|\s*(hst|host):.{0,100}\|\s*(plt|platform):'

composite_rules:
  - id: ruby-extconf-obfuscated-host-profile-callback
    desc: Ruby extconf sends an encoded host profile to a decoded domain
    crit: hostile
    conf: 0.99
    attack: T1041,T1195.002
    all:
      - id: metadata/build/package/recipe::filename-extconf
      - id: micro-behaviors/data/decode/base64::ruby-require-base64
      - id: micro-behaviors/data/decode/base64::base64-decode
      - id: micro-behaviors/communications/http/url/encoded::ruby-base64-decoded-domain
      - id: micro-behaviors/communications/http/lib/netlib::net-http
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
      - id: micro-behaviors/process/user/query::ruby-etc-user-lookup
      - id: micro-behaviors/data/encode/base64::ruby-base64-encode-call
      - id: ruby-host-profile-report
