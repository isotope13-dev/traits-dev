defaults:
  mbc: E1041
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: rust-build-rs-oob-host-profile-exfil
  desc: Cargo build uploads an environment host profile
  crit: hostile
  conf: 0.98
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/communications/url/host/oob/endpoint::rust-build-rs-oob-endpoint
  - id: micro-behaviors/data/serialize/schema-system::rust-build-rs-host-profile-fields
  - id: micro-behaviors/os/env/read/variable::rust-env-module-var
  - id: micro-behaviors/communications/http/post::rust-curl-data-argument
  near_bytes: 2048
- id: cargo-build-hook-oob-profile-exfil
  desc: Cargo build hook sends a host profile to an OOB endpoint
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1041,T1082
  for:
  - rust
  - crate
  - cargo-toml
  - tar
  scope: archive
  all:
  - id: metadata/package/scripts/build::cargo-build-script-declared
  - id: objectives/exfiltration/oob/system-profile::rust-build-rs-oob-host-profile-exfil
