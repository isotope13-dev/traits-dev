# Node/system-profile exfiltration composites.
#
# The npm spellings of "tell the operator where this landed". The recon-exfil
# side convicts the timing (install hook beacons); these state the payload --
# the full process environment, not a hostname, is what leaves.
defaults:
  platforms: [unix, windows]
  attack: T1041,T1552.001

# A Node CI probe can serialize its environment and host inventory to a
# hardcoded HTTP endpoint instead of a named OOB service. Bind the profile
# collection to a POST body written to the request, so ordinary host-info
# logging and unrelated HTTP clients do not qualify.
traits:
  - id: node-json-payload-buffer
    desc: Buffers serialized JSON payload
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Buffer\.from\(JSON\.stringify\(payload\)\)'
  - id: node-http-post-method
    desc: Node HTTP request uses POST method
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.request\s*\(\s*\{[^}]{0,200}method\s*:\s*.{0,8}POST'
  - id: node-request-writes-data-buffer
    desc: Node request writes data buffer
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\breq\.write\(data\)\s*;\s*req\.end\(\)'
  - id: node-profile-payload-host-fields
    desc: Assigns host fields to Node payload
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'payload\.(hostname|user|cwd|env_keys)\s*='

composite_rules:
- id: node-oast-fun-hostname-beacon-get
  desc: Sends hostname to OAST.fun over DNS and HTTPS
  crit: hostile
  conf: 0.99
  attack: T1041,T1048.003,T1082
  mbc: E1041
  for: [javascript, typescript]
  scope: file
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oast-fun-domain
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/get::javascript-get-method-text
  - id: micro-behaviors/communications/http/request/configuration::node-http-options-host-port
- id: node-oob-subdomain-host-identity-exfil
  desc: Sends Node hostname and username to OOB subdomains
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002,T1082,T1033
  mbc: E1041
  for: [javascript, typescript]
  scope: file
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/configuration::node-http-options-host-port
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  near_bytes: 4096

- id: node-querystring-host-profile-oob-exfil
  desc: Sends URL-encoded host identity to an OOB endpoint
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002,T1082,T1033
  mbc: E1041
  for: [javascript, typescript]
  scope: file
  all:
  - id: micro-behaviors/communications/http/request/beacon::oob-http-identity-query-cooccurrence
  - id: micro-behaviors/data/encode/url::querystring-stringify-call
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  near_bytes: 4096

  # A serialized host profile written into a Node request body and sent to a
  # public OOB collector is complete exfiltration. Unlike the narrower
  # full-environment rule below, this also covers identity profiles made from
  # hostname, username, home directory, and resolver configuration.
- attack: T1041,T1082,T1033
  id: node-host-profile-burp-oob-exfil
  desc: Sends serialized Node host profile to Burp OOB
  crit: hostile
  conf: 0.99
  mbc: E1041
  for:
    - javascript
    - typescript
  all:
    - id: micro-behaviors/communications/http/telemetry::node-host-profile-json-http-context
    - id: micro-behaviors/communications/url/host/oob/endpoint::burp-attack-live
  unless:
    - id: micro-behaviors/os/security/scan/documentation/

- id: node-env-dump-oob-exfil
  desc: Lifecycle script ships full env dump to OOB
  crit: hostile
  conf: 0.97
  mbc: E1041
  for: [packagejson]
  all:
    - id: micro-behaviors/os/env/enumerate::npm-script-full-env-object
    - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  unless:
    - id: micro-behaviors/os/security/scan/documentation/

# A hollow package whose module collects hostname/platform/username/cwd into
# a query string and fires requests at a list of operator hosts. The
# hook-only rules convict the hollow package; this states the profile beacon
# itself -- URL-encoded identity sent to several endpoints at once, which is
# a census, not a telemetry call.
#
# Worked example: the @navancorp core placeholder, whose loader beacons
# URLSearchParams(os.hostname/platform/userInfo/cwd) to an operator host and
# two per-install subdomains.
- id: node-query-string-host-profile-beacon
  desc: Query-string host profile sent to collector hosts
  crit: hostile
  conf: 0.95
  for: [javascript, typescript]
  scope: file
  all:
    - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
    - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias
  any:
    - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
    - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  unless:
    - id: micro-behaviors/os/security/scan/documentation/

  # Manual query-string twin of the rule above: encodeURIComponent pairs
  # joined with '&' instead of URLSearchParams, fired through http.get
  # instead of https.request. Co-occurrence alone does not establish the
  # beacon: a file can query host/user identity and call
  # encodeURIComponent without the encoded profile visibly reaching the
  # request. Convict only when the query is assembled into the request
  # path inside the call options, which binds the encoded profile to the
  # OOB request -- the same binding the username-query GET exfil rule
  # requires. Hoisted object-key queries are covered separately by
  # objectives/exfiltration/http/query::node-oob-object-profile-query-exfil,
  # which binds the queried profile, mapped values and request-path variable.
  # Worked example: a probe building `path: '/collect?' + qs` inline in
  # http.get options to an oast.fun collector (see
  # testdata/hostile/js-manual-qs-beacon-controls).
- id: node-manual-qs-host-profile-beacon
  desc: URL-encoded host and user queries beside a computed GET to an OOB host
  crit: hostile
  conf: 0.95
  for: [javascript, typescript]
  scope: file
  all:
    - id: micro-behaviors/communications/http/request/beacon::oob-http-identity-query-cooccurrence
    - id: micro-behaviors/data/encode/url::encode-uri-component-call
    - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
    - id: micro-behaviors/communications/http/request/url-computed::node-request-options-computed-path

- id: node-ci-host-profile-http-post-exfil
  desc: Uploads Node environment and host profile over HTTP
  crit: hostile
  conf: 0.97
  attack: T1041,T1195.002,T1082,T1033
  mbc: E1041
  for: [javascript, typescript]
  scope: file
  all:
    - id: micro-behaviors/os/env/enumerate::js-object-keys-env
    - id: micro-behaviors/os/sysinfo/profile::node-host-information-query-set
    - id: node-profile-payload-host-fields
    - id: node-json-payload-buffer
    - id: node-http-post-method
    - id: node-request-writes-data-buffer
  near_bytes: 5000
