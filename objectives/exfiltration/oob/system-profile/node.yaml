# Node/system-profile exfiltration composites.
#
# The npm spellings of "tell the operator where this landed". The recon-exfil
# side convicts the timing (install hook beacons); these state the payload --
# the full process environment, not a hostname, is what leaves.
defaults:
  platforms: [unix, windows]
  attack: T1041,T1552.001

composite_rules:
  # A serialized host profile written into a Node request body and sent to a
  # public OOB collector is complete exfiltration. Unlike the narrower
  # full-environment rule below, this also covers identity profiles made from
  # hostname, username, home directory, and resolver configuration.
- attack: T1041,T1082,T1033
  id: node-host-profile-burp-oob-exfil
  desc: Sends serialized Node host profile to Burp OOB
  crit: hostile
  conf: 0.99
  mbc: E1041
  for:
    - javascript
    - typescript
  all:
    - id: objectives/exfiltration/http/upload::node-collect-exfil
    - id: micro-behaviors/communications/url/host/oob::burp-attack-live
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: well-known/tool/detection/security-scanner/

- id: node-env-dump-oob-exfil
  desc: Lifecycle script ships full env dump to OOB
  crit: hostile
  conf: 0.97
  mbc: E1041
  for: [packagejson]
  all:
    - id: micro-behaviors/os/env/enumeration::npm-script-full-env-object
    - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: well-known/tool/detection/security-scanner/

# A hollow package whose module collects hostname/platform/username/cwd into
# a query string and fires requests at a list of operator hosts. The
# hook-only rules convict the hollow package; this states the profile beacon
# itself -- URL-encoded identity sent to several endpoints at once, which is
# a census, not a telemetry call.
#
# Worked example: the @navancorp core placeholder, whose loader beacons
# URLSearchParams(os.hostname/platform/userInfo/cwd) to an operator host and
# two per-install subdomains.
- id: node-query-string-host-profile-beacon
  desc: Query-string host profile sent to collector hosts
  crit: hostile
  conf: 0.95
  all:
    - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias

  # Manual query-string twin of the rule above: encodeURIComponent pairs
  # joined with '&' instead of URLSearchParams, fired through http.get
  # instead of https.request. Co-occurrence alone does not establish the
  # beacon: a file can query host/user identity and call
  # encodeURIComponent without the encoded profile visibly reaching the
  # request. Convict only when the query is assembled into the request
  # path inside the call options, which binds the encoded profile to the
  # OOB request -- the same binding the username-query GET exfil rule
  # requires. A beacon that hoists the path into a variable stays a
  # suspicious co-occurrence, not a hostile exfiltration verdict.
  # Worked example: a probe building `path: '/collect?' + qs` inline in
  # http.get options to an oast.fun collector (see
  # testdata/hostile/js-manual-qs-beacon-controls).
- id: node-manual-qs-host-profile-beacon
  desc: Manual query-string host profile beacon
  crit: hostile
  conf: 0.95
  for: [javascript, typescript]
  scope: file
  all:
    - id: micro-behaviors/communications/http/request/beacon::oob-http-identity-query-cooccurrence
    - id: micro-behaviors/data/encode/url::encode-uri-component-call
    - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
    - id: micro-behaviors/communications/http/request/url-computed::node-request-options-computed-path
