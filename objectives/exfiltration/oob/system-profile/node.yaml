# Node/system-profile exfiltration composites.
#
# The npm spellings of "tell the operator where this landed". The recon-exfil
# side convicts the timing (install hook beacons); these state the payload --
# the full process environment, not a hostname, is what leaves.
defaults:
  platforms: [unix, windows]
  attack: T1041,T1552.001

composite_rules:
  # A lifecycle script that serializes the entire environment object and
  # hands it to an OOB collector. A hostname says where; `process.env` says
  # everything -- tokens, registry credentials, CI secrets -- which is why
  # the full-env dump paired with a collector endpoint is hostile on contact,
  # whatever the hook's stated purpose.
  #
  # Worked example: the ide-stubs dependency-confusion PoC, whose inline
  # postinstall collects JSON.stringify(process.env), whoami output and
  # /etc/passwd, and POSTs the bundle to an oast.fun host.
  - id: node-env-dump-oob-exfil
    desc: Lifecycle script ships full env dump to OOB
    crit: hostile
    conf: 0.97
    mbc: E1041
    for: [package.json, javascript, typescript]
    all:
      - id: micro-behaviors/os/env/vars/access::npm-script-full-env-object
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
