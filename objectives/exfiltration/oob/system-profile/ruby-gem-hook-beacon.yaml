defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1041,T1195.002,T1059.006

traits:
  - id: ruby-eval-http-body-base64
    desc: Ruby evaluates decoded HTTP response body
    crit: notable
    if:
      type: text
      regex: 'eval\s*\(\s*Base64\.decode64\s*\(\s*\w+\.body\s*\)\s*\)'

composite_rules:
  - id: ruby-gem-hook-host-beacon-remote-eval
    desc: Gem hook reports host and evaluates response
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/config::ruby-gemrc-post-install-hook
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: ruby-eval-http-body-base64
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
