defaults:
  platforms: [windows, unix]
  for: [package.json]
composite_rules:
  - id: oastify-recon
    desc: Registry metadata exfiltrates host recon to OASTify
    crit: hostile
    conf: 0.995
    attack: "T1041"
    # registry-metadata-json/install-hooked-registry-package only ever resolve
    # on the separately-fetched pkginfo registry snapshot, while curl-post and
    # its siblings read the raw lifecycle-hook text out of package.json -- two
    # different nodes of the same npm package, so this needs archive pooling.
    scope: archive
    for: [npm, package.json, pkginfo]
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: objectives/supply-chain/impersonation/registry/snapshot::install-hooked-registry-package
      - id: micro-behaviors/communications/http/request/verb::npm-curl-post-text
      - id: micro-behaviors/os/sysinfo/hostname/query::hostname-postfield
      - id: micro-behaviors/process/identity/query/command::whoami-postfield
      - id: micro-behaviors/os/sysinfo/query::uname-postfield
      - id: micro-behaviors/communications/url/construction/template::hostname-oastify-subdomain
    any:
      - id: micro-behaviors/communications/http/curl/body::data-urlencode
      - id: metadata/package/scripts/reference::repeated-preinstall-hooks
  - id: node-oastify-recon
    desc: Node.js preinstall exfiltrates sysinfo to OASTify
    crit: hostile
    conf: 0.98
    attack: "T1041"
    mbc: "E1041"
    scope: archive
    for: [npm, package.json, pkginfo, javascript]
    all:
      - id: micro-behaviors/process/interpreter/node::versioned-lifecycle-node-e
      - id: micro-behaviors/communications/url/host/oob/package::node-oastify-hostname
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-platform-call
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-arch-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/data/encode/url::querystring-stringify-call
    needs: 2
  - id: node-oastify-https-profile-exfil
    desc: Node exfiltrates base64 host profile to Oastify over HTTPS
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    for: [javascript]
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/data/encode/base64/structured::node-json-base64-with-host-query
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/process/identity/query/reference::user-info
  - id: node-oastify-http-profile-query-exfil
    desc: Node sends host profile query to Oastify
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    for: [javascript]
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/request/client::node-http
      - id: micro-behaviors/communications/http/request/body/construction::request-end-call
      - id: micro-behaviors/os/sysinfo/profile::node-four-host-query-kinds
    any:
      - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-query
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  - id: node-oastify-json-host-profile-post-exfil
    desc: Node POSTs JSON host profile to Oastify
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/body/construction::request-end-call
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/process/identity/query/command::node-shell-id-command
    needs: 2
  - id: npm-preinstall-oastify-https-query-exfil
    desc: npm preinstall Oastify GET sends encoded host profile
    crit: hostile
    conf: 0.995
    attack: "T1195.002,T1041,T1082"
    mbc: E1041
    for: [npm, package.json, javascript]
    scope: archive
    all:
    - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
    - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
    - id: micro-behaviors/communications/http/request/client::node-http
    - id: micro-behaviors/data/encode/url::encode-uri-component-call
    - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: npm-postinstall-node-oastify-profile-exfil
    desc: npm postinstall sidecar exfiltrates host profile to Oastify
    crit: hostile
    conf: 0.995
    attack: "T1195.002"
    mbc: "E1041"
    scope: archive
    for: [javascript, package.json, npm]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: node-oastify-https-profile-exfil
    any:
      - id: micro-behaviors/communications/dns/oob::node-oastify-dns-callback
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
  - id: npm-postinstall-node-oastify-query-exfil
    desc: npm postinstall exfils host profile to Oastify
    crit: hostile
    conf: 0.995
    attack: "T1195.002"
    mbc: "E1041"
    scope: archive
    for: [javascript, package.json, npm]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: node-oastify-http-profile-query-exfil
  - id: npm-postinstall-oastify-host-identity-exfil
    desc: npm postinstall exfils host identity to OASTify
    crit: hostile
    conf: 0.99
    attack: "T1041"
    mbc: "E1041"
    for: [npm, javascript, shell]
    all:
      - id: metadata/package/files/included::postinstall-js-basename
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/os/sysinfo/hostname/command::hostname-cmd
      - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
      - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: npm-postinstall-oastify-profile-query-exfil
    desc: npm postinstall exfils host profile to Oastify query params
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    for: [javascript]
    all:
      - id: metadata/package/files/included::postinstall-js-basename
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
      - id: micro-behaviors/os/sysinfo/profile::node-host-profile-payload-fields
    any:
      - id: micro-behaviors/os/env/read/variable::node-cicd-payload-fields
      - id: micro-behaviors/communications/url/resource-path/commerce::node-oastify-shopify-path
      - id: micro-behaviors/os/env/read/named::ci-env-reference-set
  - id: npm-security-research-oastify-exfil
    desc: Security research npm package exfils to Oastify
    crit: hostile
    conf: 0.995
    attack: "T1195.002"
    mbc: "E1041"
    scope: archive
    for: [javascript, package.json, tar, zip]
    all:
      - id: metadata/package/description/security::research-claim-with-install-hook
    any:
      - id: npm-postinstall-oastify-profile-query-exfil
      - id: objectives/exfiltration/dns/lookup::npm-postinstall-oastify-dns-whoami-exfil
  - id: node-oastify-hostname-query-exfil
    desc: Node.js exfiltrates hostname to OASTify query path
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    for: [javascript]
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/url/query/structure::node-host-query-param
      - id: micro-behaviors/data/encode/url::node-inline-os-hostname-encode
  - id: node-curl-oastify-whoami-exfil
    desc: Node child_process exfils whoami to OASTify
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    for: [javascript]
    all:
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: objectives/exfiltration/oob/system-profile::js-curl-oastify-whoami
  - id: ruby-dependency-confusion-oast-home-beacon
    desc: Dependency-confusion Ruby OAST home beacon
    crit: hostile
    conf: 0.99
    attack: "T1041,T1195.002"
    mbc: E1041
    for: [ruby, gem]
    scope: archive
    all:
      - id: metadata/package/description/disclosure::ruby-dependency-confusion-marker
      - id: micro-behaviors/os/env/read/variable::ruby-oast-home-presence-url
      - id: objectives/exfiltration/oob/system-profile::ruby-import-time-oast-host-profile
