defaults:
  platforms: [unix, windows]
  for: [python]
  mbc: E1041
composite_rules:
- id: init-oob-host-profile-callback
  desc: Import-time OOB host profile callback
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/data/serialize/schema-system::compact-host-profile-fields
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
- id: init-subprocess-oob-profile-exfil
  desc: Import-time command output OOB exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: init-oob-host-profile-callback
  - id: micro-behaviors/process/create/shell/command-string::getoutput-content
- id: init-research-canary-profile-callback
  desc: Import-time dependency confusion canary callback
  crit: suspicious
  conf: 0.95
  all:
  - id: init-oob-host-profile-callback
  any:
  - id: metadata/package/documentation/disclosure::dependency-confusion-source-disclosure
  - id: metadata/lang/natural/phrasing/security::oob-research-canary-marker-canary
  - id: metadata/lang/natural/phrasing/security::oob-research-canary-marker-reward
  - id: well-known/app/security/google-bughunters::oob-research-canary-marker-google
- id: init-curl-command-subst-oob
  desc: Import curls command-substitution to OOB
  crit: hostile
  conf: 0.96
  attack: T1195.002,T1041,T1059.006
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/curl/command::curl-data-command-subst
