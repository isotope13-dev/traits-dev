defaults:
  platforms: [unix, windows]
  for: [shell, package.json]
composite_rules:
- id: npm-preinstall-oast-pro-host-recon
  desc: npm preinstall exfiltrates host profile to oast.pro
  crit: hostile
  conf: 0.997
  attack: "T1041"
  mbc: "E1041"
  scope: archive
  for: [shell, package.json, npm]
  all:
  - id: metadata/package/scripts/lifecycle::filtered-raw-preinstall-hook
  - id: micro-behaviors/communications/http/curl/body::data-urlencode
  - id: micro-behaviors/communications/url/host/oob/endpoint::oast-pro-callback-raw
  - id: micro-behaviors/process/identity/query/command::shell-user-field-capture
  - id: micro-behaviors/process/identity/query/command::shell-pwd-field-capture
  - id: micro-behaviors/process/identity/query/command::shell-capture-numeric-uid
  any:
  - id: micro-behaviors/process/identity/query/command::shell-home-field-capture
