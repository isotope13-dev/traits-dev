defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: pypi-default-rendezvous-session-beacon
    desc: PyPI wheel defaults to OOB session readiness beacon
    conf: 0.98
    for: [whl, python]
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/service-reference::ntfy-sh-topic-url
      - id: micro-behaviors/communications/http/request/json::python-urllib-json-request-oob-reference
      - id: metadata/lang/source/syntax/identity-field::python-platform-host-user-field-pair
