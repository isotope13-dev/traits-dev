# Install-time host-profile callbacks.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, npm]
  attack: T1041,T1082
  mbc: E1041

composite_rules:
  - id: npm-preinstall-node-script-host-recon-to-oob
    desc: preinstall Node script posts host identity to OOB service
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: objectives/exfiltration/oob/callback::oob-service-http-host-recon
  - id: npm-preinstall-node-script-ci-recon-get-to-oob
    desc: preinstall script GETs host and CI identity to OOB
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/http/get::node-host-identity-get-url
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/os/env/cicd/runner::multi-ci-provider-env-refs-three-plus
      - id: micro-behaviors/communications/url/construction/query::encoded-template-query-parameter
