# A setup install hook that inventories the host and posts the result to a
# hardcoded WeChat bot, while also checking for and restarting named server
# services, is conditional host reconnaissance tied to an existing server.
defaults:
  platforms: [unix, windows]
  for: [python, zip, python-sdist, whl]
  attack: T1041,T1082,T1195.002
  mbc: E1041

traits:
  - id: python-setup-wechat-webhook-url
    desc: Setup references WeChat bot webhook
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?i)https?://qyapi\.weixin\.qq\.com/cgi-bin/webhook/send\?key='

  - id: python-setup-root-server-marker-check
    desc: Setup checks root server marker files
    crit: suspicious
    for: [python]
    if:
      type: text
      regex: '(?s)os\.path\.exists\(["'']/root/\.cx\.(sh|server)["'']\)'

  - id: python-setup-marker-restarts-server-services
    desc: Marker condition restarts server services
    crit: suspicious
    for: [python]
    if:
      type: text
      regex: '(?is)if\s+has_svr\s*==\s*1\s*:[\s\S]{0,300}(supervisorctl\s+restart|systemctl\s+restart)'

composite_rules:
  - id: python-install-hook-wechat-host-profile-server-check
    desc: Install reports host and probes server services
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: python-setup-wechat-webhook-url
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
      - id: python-setup-root-server-marker-check
      - id: python-setup-marker-restarts-server-services
