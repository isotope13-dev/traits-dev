defaults:
  platforms: [unix, windows]
  for: [package.json]
  mbc: E1041
composite_rules:
- id: npm-preinstall-base64-host-profile-get
  desc: npm preinstall GET exfiltrates Base64 host profile
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1041,T1082
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: micro-behaviors/data/encode/base64/structured::node-json-base64-with-host-query
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  - id: micro-behaviors/communications/url/host/name::ngrok-free-domain
  unless:
  - id: metadata/path/directory::test-directory-component

- id: npm-install-hook-id-oob-query
  desc: npm install hook runs id and reports to an OOB service
  crit: hostile
  conf: 0.995
  attack: T1195.002,T1033,T1041
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/process/identity/query/command::node-shell-id-command
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  unless:
  - id: metadata/path/directory::test-directory-component
- id: npm-lifecycle-host-profile-oob-https-get
  desc: npm lifecycle hook sends host and user identity to OOB endpoint over HTTPS
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041,T1082,T1033
  for: [npm, tar, package.json, javascript, typescript]
  scope: archive
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  any:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  unless:
  - id: metadata/path/directory::test-directory-component
