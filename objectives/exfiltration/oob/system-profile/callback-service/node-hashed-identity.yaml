defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1082,T1033
  for:
  - javascript
  - typescript
composite_rules:
- id: node-oob-hashed-host-identity-get-beacon
  desc: SHA-256 of host or user identity sent to an OOB GET
  crit: hostile
  conf: 0.97
  mbc: E1041
  scope: file
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  - id: micro-behaviors/crypto/hash/digest/sha2::node-createhash-sha256-call
  any:
  - id: micro-behaviors/fs/path/config/system::linux-hostname-path
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-username-read
  - id: micro-behaviors/process/identity/query/principal::node-os-alias-userinfo-call
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  near_bytes: 4096
