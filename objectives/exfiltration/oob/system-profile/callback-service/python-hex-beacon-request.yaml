defaults:
  platforms:
  - unix
  - windows
  attack: T1071.001
  for:
  - python
composite_rules:
- id: python-hex-labelled-beacon-request
  desc: Python requests a hex-labelled beacon host
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/communications/url/host/name::hostname-with-eight-hex-label
  - id: micro-behaviors/communications/url/resource-path/collection::beacon-path-token
  - id: micro-behaviors/communications/http/get::requests-get
