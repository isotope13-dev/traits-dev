# JavaScript that reads host, user or environment data and makes a network
# request in the same file as an out-of-band callback service (oastify,
# webhook.site, pipedream and similar). The callback host is the distinguishing evidence:
# these services exist to receive probe traffic, not to serve a product API.
defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1082
  for:
  - javascript
  - typescript
composite_rules:
- id: node-env-read
  desc: Enumerates the process environment
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/enumerate::js-object-keys-env
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/os/env/report::process-env-direct-dump
- id: node-http-request-operation
  desc: Node script performs an HTTP request
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  - id: micro-behaviors/communications/http/request/get::node-http-client-invokes-get
- id: node-network-egress-operation
  desc: Node script makes an HTTP or DNS request
  crit: notable
  conf: 0.9
  any:
  - id: objectives/exfiltration/oob/system-profile/callback-service::node-http-request-operation
  - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
  - id: micro-behaviors/communications/dns/lookup::nslookup-command-literal
- id: node-oob-hostname-beacon
  desc: Hostname query beside OOB callback service
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
- id: node-oob-environment-request-exfil
  desc: Sends environment data to OOB service
  crit: hostile
  conf: 0.95
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: objectives/exfiltration/oob/system-profile/callback-service::node-http-request-operation
  - id: objectives/exfiltration/oob/system-profile/callback-service::node-env-read
- id: node-oob-host-user-egress-exfil
  desc: Host and user identity sent toward OOB service
  crit: hostile
  conf: 0.95
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/sysinfo/profile::node-oast-identity-query-cooccurrence
  - id: objectives/exfiltration/oob/system-profile/callback-service::node-network-egress-operation
- id: node-curl-host-profile-query-exfil
  desc: Node curl command sends host profile in URL
  crit: hostile
  conf: 0.95
  near_bytes: 1000
  all:
  - id: micro-behaviors/os/sysinfo/report::js-host-profile-command-sequence
  - id: objectives/exfiltration/messaging/discord::node-whoami-query-parameter
- id: node-module-load-webhook-site-post
  desc: Module-load POST to webhook.site
  crit: suspicious
  conf: 0.85
  near_bytes: 1500
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
  - id: micro-behaviors/communications/http/request/client::node-module-level-http-request
  - id: micro-behaviors/communications/http/request/verb::mutating-method-option
