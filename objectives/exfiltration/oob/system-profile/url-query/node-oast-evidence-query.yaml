defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1195.002,T1041,T1082
traits:
- id: js-evidence-query-encoding
  desc: Encodes query parameter values
  crit: notable
  if:
    type: text
    substr: encodeURIComponent(queryParams[key])
composite_rules:
- id: node-oast-evidence-query-exfil
  desc: Sends host and command evidence to OASTify
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::js-evidence-oast-collaborator
  - id: objectives/exfiltration/oob/system-profile/form-body::js-evidence-host-and-platform
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::js-evidence-wget-output
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::js-evidence-oast-send
  - id: objectives/exfiltration/oob/system-profile/url-query::js-evidence-query-encoding
