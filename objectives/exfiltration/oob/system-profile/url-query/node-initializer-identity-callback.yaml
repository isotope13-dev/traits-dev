defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1082,T1041

traits:
  - id: node-init-identity-user
    desc: Captures username
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const user = os.userInfo().username'
  - id: node-init-identity-host
    desc: Captures hostname
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const host = os.hostname()'
  - id: node-init-identity-platform
    desc: Assigns os.platform() to a constant
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'const platform = os.platform()'
  - id: node-init-identity-template
    desc: Builds user and host identifier
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '${user}-${host}-${platform}`'
  - id: node-init-identity-cloudflare
    desc: Constructs Cloudflare tunnel host
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const d_p2 = 'trycloudflare'"
  - id: node-init-identity-domain-join
    desc: Builds tunnel hostname from components
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const domain = `${d_p1}.${d_p2}.${d_p3}`'
  - id: node-init-identity-domain-com
    desc: Uses tunnel domain suffix
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const d_p3 = 'com'"
  - id: node-init-identity-domain
    desc: Assigns domain to hostname field
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'hostname: domain'
  - id: node-init-identity-init-path
    desc: Sends identifier in request path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'path: `/init/${identifier}`'
  - id: node-init-identity-http
    desc: Starts HTTP request
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const req = http.request(options)'
  - id: node-init-identity-supabase
    desc: Selects Supabase host
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "const d_host = '[A-Za-z0-9-]+[.]supabase[.]co'"
  - id: node-init-identity-oob-path
    desc: Selects OOB webhook path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const d_path = '/functions/v1/Webhook_OOB'"
  - id: node-init-identity-supabase-host
    desc: Uses callback host in request
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'hostname: d_host'
  - id: node-init-identity-supabase-query
    desc: Places identity in webhook query
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'path: `${d_path}?data=telemetry_sync_${identifier}`'
  - id: node-init-identity-run
    desc: Executes initializer
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^initializeDiagnostics\(\);'

composite_rules:
  - id: node-init-identity-cloudflare-request
    desc: Sends identity to tunnel host
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::scripts-init-js-path
      - id: node-init-identity-user
      - id: node-init-identity-host
      - id: node-init-identity-platform
      - id: node-init-identity-template
      - id: node-init-identity-cloudflare
      - id: node-init-identity-domain-join
      - id: node-init-identity-domain-com
      - id: node-init-identity-domain
      - id: node-init-identity-init-path
      - id: node-init-identity-http
      - id: micro-behaviors/communications/http/request/lifecycle::node-request-end-call
      - id: node-init-identity-run
  - id: node-init-identity-supabase-request
    desc: Sends identity to webhook
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::scripts-init-js-path
      - id: node-init-identity-user
      - id: node-init-identity-host
      - id: node-init-identity-platform
      - id: node-init-identity-template
      - id: node-init-identity-supabase
      - id: node-init-identity-oob-path
      - id: node-init-identity-supabase-host
      - id: node-init-identity-supabase-query
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/lifecycle::node-request-end-call
      - id: node-init-identity-run
  - id: npm-preinstall-identity-callback
    desc: Install sends identity to callback
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-init-js-script
    any:
      - id: node-init-identity-cloudflare-request
      - id: node-init-identity-supabase-request
