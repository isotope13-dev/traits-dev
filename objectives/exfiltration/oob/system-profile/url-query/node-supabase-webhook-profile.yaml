defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1082,T1041

traits:
  - id: node-profile-user
    desc: Reads local username
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const u = os.userInfo().username'
  - id: node-profile-host
    desc: Reads local hostname
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const h = os.hostname()'
  - id: node-profile-template
    desc: Builds user and host profile
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'let report = `usr:${u}|hst:${h}|plt:${p}`'
  - id: node-profile-report-encode
    desc: Encodes collected profile
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "const data = Buffer.from(report).toString('base64')"
  - id: node-profile-query-option
    desc: Places profile in webhook query
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'path: `\$\{d_path\}[?]data=[A-Za-z0-9_]+\$\{data\}`'
  - id: node-profile-send-request
    desc: Sends HTTPS request options
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const req = https.request(options)'

composite_rules:
  - id: node-profile-supabase-query
    desc: Sends encoded identity to webhook
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::scripts-init-js-path
      - id: node-profile-user
      - id: node-profile-host
      - id: node-profile-template
      - id: objectives/exfiltration/oob/system-profile/url-query::node-init-identity-supabase
      - id: objectives/exfiltration/oob/system-profile/url-query::node-init-identity-oob-path
      - id: node-profile-report-encode
      - id: objectives/exfiltration/oob/system-profile/url-query::node-init-identity-supabase-host
      - id: node-profile-query-option
      - id: node-profile-send-request
      - id: micro-behaviors/communications/http/request/lifecycle::node-request-end-call
      - id: objectives/exfiltration/oob/system-profile/url-query::node-init-identity-run
  - id: npm-preinstall-supabase-query-profile
    desc: Install sends identity to webhook
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-profile-supabase-query
      - id: metadata/package/scripts/entrypoint::preinstall-runs-init-js-script
