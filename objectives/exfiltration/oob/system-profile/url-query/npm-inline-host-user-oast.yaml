defaults:
  for: [package.json]
  platforms: [unix, windows]
  attack: T1082,T1041

traits:
  - id: npm-inline-host-user-command
    desc: Install runs hostname and whoami
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: "exec\\(['\"]hostname\\s*&&\\s*whoami['\"]\\s*,\\s*\\(error,\\s*stdout"
  - id: npm-inline-host-user-encode
    desc: Encodes command stdout for URL
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: 'const\s+data\s*=\s*encodeURIComponent\(stdout\)'
  - id: npm-inline-https-get
    desc: Node inline code makes HTTPS GET
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: "require\\(['\"]https['\"]\\)[.]get\\("
  - id: npm-inline-oast-data-url
    desc: Sends encoded data to OASTify path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: "['\"]https://[a-zA-Z0-9-]+[.]oastify[.]com/data-['\"]\\s*\\+\\s*data"

composite_rules:
  - id: npm-preinstall-oast-endpoint-reference
    desc: Install script references OAST callback service
    crit: notable
    any:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: metadata/package/scripts/network::preinstall-oast-domain
  - id: npm-inline-preinstall-host-user-remote-request
    desc: Inline preinstall sends host and user to remote URL
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/scripts/inline::manifest-node-inline-command
      - id: metadata/package/scripts/discovery::preinstall-hostname
      - id: metadata/package/scripts/discovery::preinstall-whoami
      - id: metadata/package/scripts/command::npm-preinstall-http-url
    any:
      - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
      - id: micro-behaviors/communications/http/request/inline::js-https-request
  - id: npm-preinstall-inline-host-user-oast
    desc: Install sends hostname and user to callback
    crit: hostile
    conf: 0.99
    near_bytes: 800
    all:
      - id: npm-inline-host-user-command
      - id: npm-inline-host-user-encode
      - id: npm-inline-https-get
      - id: npm-inline-oast-data-url
