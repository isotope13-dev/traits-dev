defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  mbc: B0030
  attack: T1041
composite_rules:
- id: host-profile-json-post
  desc: Host profile JSON-POSTed remote
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::php-gethostname-call
  - id: micro-behaviors/data/serialize/json::php-json-encode
  - id: micro-behaviors/communications/http/curl/binding::exec-symbol
  - id: micro-behaviors/communications/http/curl/binding::post-data
  any:
  - id: micro-behaviors/communications/http/request/superglobal::server-name
  - id: micro-behaviors/fs/directory/cwd::php-getcwd
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::php-uname-symbol
  - id: micro-behaviors/os/env/enumerate::php-getenv-no-args
  needs: 2
  near_bytes: 4096
- id: php-webhook-host-profile-get
  desc: PHP sends Base64 host profile to OOB endpoint
  crit: hostile
  conf: 0.99
  mbc: E1041
  attack: T1041,T1082,T1033
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
  - id: micro-behaviors/data/encode/base64/primitive::php-base64-encode
  - id: micro-behaviors/os/sysinfo/hostname/query::php-gethostname-call
  - id: micro-behaviors/os/env/read/variable::php-getenv-call
  - id: micro-behaviors/fs/directory/cwd::php-getcwd
  near_bytes: 4096
