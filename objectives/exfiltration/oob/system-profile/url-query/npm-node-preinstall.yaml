defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  - npm
  attack: T1041,T1082
  mbc: E1041
composite_rules:
- id: npm-preinstall-node-script-ci-recon-get-to-oob
  desc: preinstall script GETs host and CI identity to OOB
  crit: hostile
  conf: 0.95
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/http/get::node-host-identity-get-url
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/os/env/cicd/runner::multi-ci-provider-env-refs-three-plus
  - id: micro-behaviors/communications/url/construction/query::encoded-template-query-parameter
- id: npm-preinstall-user-identity-get-to-beeceptor
  desc: preinstall script GETs the OS user to a Beeceptor endpoint
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1041,T1033
  scope: archive
  unless:
  - id: metadata/path/directory::test-directory-component
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/url/host/oob/endpoint::beeceptor-endpoint
  - id: micro-behaviors/communications/url/query/profile::encoded-identity-query-field
