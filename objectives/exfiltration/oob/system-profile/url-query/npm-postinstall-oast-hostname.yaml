defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1041,T1082
traits:
- id: npm-postinstall-https-get
  desc: Postinstall calls Node HTTPS get
  crit: notable
  if:
    type: value
    path: scripts.postinstall
    regex: require\(["']https["']\)\.get\s*\(
- id: npm-postinstall-oastify-hostname-query
  desc: Postinstall appends hostname to OASTify query
  crit: notable
  if:
    type: value
    path: scripts.postinstall
    regex: \.oastify\.com/[^"']{0,100}\?host=["']\s*\+\s*require\(["']os["']\)\.hostname\s*\(
composite_rules:
- id: npm-postinstall-oastify-hostname-get
  desc: Postinstall sends hostname to OASTify
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/oob/system-profile/url-query::npm-postinstall-https-get
  - id: objectives/exfiltration/oob/system-profile/url-query::npm-postinstall-oastify-hostname-query
