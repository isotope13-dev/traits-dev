defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1082,T1041
traits:
- id: node-axios-host-cwd-callback
  desc: Posts hostname and working directory to callback
  crit: hostile
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((program
        (lexical_declaration (variable_declarator name: (identifier) @os
          value: (call_expression function: (identifier) @require_os
            arguments: (arguments (string (string_fragment) @os_module)))))
        (lexical_declaration (variable_declarator name: (identifier) @axios
          value: (call_expression function: (identifier) @require_axios
            arguments: (arguments (string (string_fragment) @axios_module)))))
        (lexical_declaration (variable_declarator name: (identifier) @host
          value: (call_expression function: (member_expression object: (identifier) @os_use property: (property_identifier) @hostname))))
        (lexical_declaration (variable_declarator name: (identifier) @cwd
          value: (call_expression function: (member_expression object: (identifier) @process property: (property_identifier) @cwd_method))))
        (lexical_declaration (variable_declarator name: (identifier) @url
          value: (string (string_fragment) @target)))
        (lexical_declaration (variable_declarator name: (identifier) @body
          value: (object (pair value: (identifier) @host_use) (pair value: (identifier) @cwd_use))))
        (expression_statement (call_expression function: (member_expression
          object: (call_expression function: (member_expression
            object: (call_expression
              function: (member_expression object: (identifier) @axios_use property: (property_identifier) @post)
              arguments: (arguments (identifier) @url_use (identifier) @body_use))))))))
        (#eq? @require_os "require")
        (#eq? @os_module "os")
        (#eq? @require_axios "require")
        (#eq? @axios_module "axios")
        (#eq? @os @os_use)
        (#eq? @hostname "hostname")
        (#eq? @process "process")
        (#eq? @cwd_method "cwd")
        (#eq? @host @host_use)
        (#eq? @cwd @cwd_use)
        (#eq? @axios @axios_use)
        (#eq? @post "post")
        (#eq? @url @url_use)
        (#eq? @body @body_use)
        (#match? @target "^https?://[^/]+\\.(oast\\.(live|site|fun|online|pro|me)|oastify\\.com)(/|$)"))
