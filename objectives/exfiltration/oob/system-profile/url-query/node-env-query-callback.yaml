defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1082,T1041
traits:
- id: node-env-entries-query-callback
  desc: Sends serialized environment to callback service
  crit: suspicious
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((program
        (lexical_declaration (variable_declarator name: (identifier) @https
          value: (call_expression function: (identifier) @require
            arguments: (arguments (string (string_fragment) @https_module)))))
        (lexical_declaration (variable_declarator name: (identifier) @profile
          value: (object (pair value: (member_expression object: (identifier) @process property: (property_identifier) @env)))))
        (lexical_declaration (variable_declarator name: (identifier) @query
          value: (call_expression function: (member_expression
            object: (call_expression function: (member_expression
              object: (call_expression function: (member_expression object: (identifier) @object property: (property_identifier) @entries)
                arguments: (arguments (identifier) @profile_use))
              property: (property_identifier) @map)
              arguments: (arguments (arrow_function
                parameters: (formal_parameters (array_pattern (identifier) @key (identifier) @value))
                body: (statement_block
                  (if_statement consequence: (statement_block (expression_statement
                    (assignment_expression left: (identifier) @value_assign right: (call_expression
                      function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
                      arguments: (arguments (identifier) @value_stringify))))))
                  (return_statement (template_string
                    (template_substitution (call_expression function: (identifier) @encode_key arguments: (arguments (identifier) @key_use)))
                    (template_substitution (call_expression function: (identifier) @encode_value arguments: (arguments (identifier) @value_use)))))))))
            property: (property_identifier) @join))))
        (lexical_declaration (variable_declarator name: (identifier) @options
          value: (object
            (pair key: (property_identifier) @host_key value: (string (string_fragment) @target))
            (pair key: (property_identifier) @path_key value: (template_string
              (string_fragment) @prefix (template_substitution (identifier) @query_use))))))
        (lexical_declaration (variable_declarator name: (identifier) @req
          value: (call_expression function: (member_expression object: (identifier) @https_use property: (property_identifier) @request)
            arguments: (arguments (identifier) @options_use))))
        (expression_statement (call_expression function: (member_expression object: (identifier) @req_use property: (property_identifier) @end))))
        (#eq? @require "require")
        (#eq? @https_module "https")
        (#eq? @process "process")
        (#eq? @env "env")
        (#eq? @object "Object")
        (#eq? @entries "entries")
        (#eq? @profile @profile_use)
        (#eq? @map "map")
        (#eq? @value @value_assign)
        (#eq? @value @value_stringify)
        (#eq? @value @value_use)
        (#eq? @key @key_use)
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @encode_key "encodeURIComponent")
        (#eq? @encode_value "encodeURIComponent")
        (#eq? @join "join")
        (#eq? @host_key "hostname")
        (#eq? @path_key "path")
        (#match? @prefix "\\?")
        (#eq? @query @query_use)
        (#eq? @https @https_use)
        (#eq? @request "request")
        (#eq? @options @options_use)
        (#eq? @req @req_use)
        (#eq? @end "end")
        (#match? @target "(^|[.])(oastify\\.com|oast\\.(live|site|fun|online|pro|me))$"))
composite_rules:
- id: npm-postinstall-env-query-callback
  desc: Install hook sends environment in callback query
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - zip
  - npm
  - javascript
  - package.json
  all:
  - id: objectives/exfiltration/oob/system-profile/url-query::node-env-entries-query-callback
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
