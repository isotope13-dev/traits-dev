defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082,T1033
traits:
- id: calluser-profile-query
  desc: Script builds callback identity query
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: calluser\?u=.{0,100}&h=.{0,100}&d=.{0,100}&t=
composite_rules:
- id: host-user-callback-query
  desc: Callback sends host user and directory profile
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  scope: file
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::host-user-cwd-variables
  - id: objectives/exfiltration/oob/system-profile/url-query::calluser-profile-query
  - id: micro-behaviors/communications/http/request/client/target::fetch-url-variable-or-literal
- id: npm-install-host-user-callback
  desc: Install hook invokes host and user profile callback
  crit: hostile
  conf: 0.98
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: objectives/exfiltration/oob/system-profile/url-query::host-user-callback-query
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::import-call-callback
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
