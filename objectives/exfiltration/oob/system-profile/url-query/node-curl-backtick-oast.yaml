defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1048.003,T1033,T1082
  mbc: E1041
traits:
- id: node-curl-host-profile-url-fields
  desc: OAST URL embeds hostname and working directory
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: oast\.fun[^\n]{0,500}`hostname`[^\n]{0,120}`pwd`
composite_rules:
- id: node-curl-command-substitutes-host-profile-to-oast
  desc: Curl substitutes host identity into OAST URL
  crit: suspicious
  conf: 0.99
  near_bytes: 1000
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::node-curl-id-command-substitution
  - id: objectives/exfiltration/oob/system-profile/url-query::node-curl-host-profile-url-fields
