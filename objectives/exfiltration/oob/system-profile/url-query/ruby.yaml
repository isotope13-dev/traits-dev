defaults:
  platforms:
  - unix
  - windows
  for:
  - ruby
  attack: T1041
  mbc: E1041
composite_rules:
- attack: T1041,T1082,T1195.002
  crit: hostile
  id: ruby-pipedream-host-profile-http-get
  desc: Ruby HTTP GET sends hostname to Pipedream OOB
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::pipedream
  - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
  - id: micro-behaviors/communications/http/lib/netlib::net-http-get
