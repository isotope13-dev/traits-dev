defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
traits:
- id: node-telemetry-profile-query
  desc: Sends hostname and user through HTTPS
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /URLSearchParams\s*\(\s*\{/s
          $b0_1 = /os\.hostname\s*\(\s*\)/s
          $b0_2 = /process\.getuid/s
          $b0_3 = /https\.request\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 500 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 500 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 500 and
                    true
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: shell-telemetry-profile-query
  desc: HTTP query includes hostname and user commands
  crit: suspicious
  conf: 0.98
  for: [shell]
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  near_lines: 1
  all:
  - id: micro-behaviors/communications/url/construction/query::shell-query-hostname-command
  - id: micro-behaviors/communications/url/construction/query::shell-query-whoami-command
  - id: micro-behaviors/communications/http/request/client::shell-query-http-client
- id: shell-variable-profile-query
  desc: Fetches profile query alongside identity commands
  crit: suspicious
  for: [shell]
  all:
  - id: micro-behaviors/communications/url/construction/query::shell-query-profile-variables
  - id: micro-behaviors/os/sysinfo/hostname/command::sh-hostname-command
  - id: micro-behaviors/process/identity/query/command::shell-whoami-command
  - id: micro-behaviors/communications/http/download/shell::shell-fetch-variable-http-url
- id: npm-depconf-telemetry-profile-beacon
  desc: Dependency confusion install hook sends host profile
  crit: hostile
  conf: 0.99
  for:
  - npm
  - zip
  - tar
  - package.json
  - shell
  - javascript
  scope: archive
  all:
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: objectives/exfiltration/oob/system-profile/json-body::lifecycle-runs-telemetry-script
  any:
  - id: objectives/exfiltration/oob/system-profile/url-query::shell-variable-profile-query
  - id: objectives/exfiltration/oob/system-profile/url-query::shell-telemetry-profile-query
  - id: objectives/exfiltration/oob/system-profile/url-query::node-telemetry-profile-query
