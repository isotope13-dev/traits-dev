defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1082,T1041

traits:
  - id: node-staged-user-host-cwd-oast-query
    desc: Stages user, host and cwd callback
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @default value: (string (string_fragment) @target)))
          (lexical_declaration (variable_declarator name: (identifier) @base value: (binary_expression
            left: (member_expression object: (member_expression object: (identifier) @process property: (property_identifier) @env))
            right: (identifier) @default_use)))
          (lexical_declaration (variable_declarator name: (identifier) @profile value: (object
            (pair value: (member_expression object: (call_expression function: (member_expression object: (identifier) @os_user property: (property_identifier) @user_info)) property: (property_identifier) @username))
            (pair value: (call_expression function: (member_expression object: (identifier) @os_host property: (property_identifier) @hostname)))
            (pair value: (call_expression function: (member_expression object: (identifier) @process_cwd property: (property_identifier) @cwd))))))
          (lexical_declaration (variable_declarator name: (identifier) @query value: (call_expression function: (member_expression
            object: (call_expression function: (member_expression
              object: (call_expression function: (member_expression object: (identifier) @object property: (property_identifier) @entries)
                arguments: (arguments (identifier) @profile_use))
              property: (property_identifier) @map)
              arguments: (arguments (arrow_function parameters: (formal_parameters (array_pattern (identifier) @key (identifier) @value))
                body: (template_string
                  (template_substitution (call_expression function: (identifier) @encode_key arguments: (arguments (identifier) @key_use)))
                  (template_substitution (call_expression function: (identifier) @encode_value arguments: (arguments
                    (call_expression function: (identifier) @string arguments: (arguments (identifier) @value_use)))))))))
            property: (property_identifier) @join))))
          (lexical_declaration (variable_declarator name: (identifier) @url value: (template_string
            (template_substitution (identifier) @base_use) (string_fragment) @question (template_substitution (identifier) @query_use))))
          (lexical_declaration (variable_declarator name: (identifier) @client value: (ternary_expression
            condition: (call_expression function: (member_expression object: (identifier) @url_check property: (property_identifier) @starts))
            consequence: (identifier) @https alternative: (identifier) @http)))
          (lexical_declaration (variable_declarator value: (call_expression
            function: (member_expression object: (identifier) @client_use property: (property_identifier) @get)
            arguments: (arguments (identifier) @url_use)))))
          (#eq? @process "process")
          (#eq? @env "env")
          (#eq? @process @process_cwd)
          (#eq? @os_user "os")
          (#eq? @os_host "os")
          (#eq? @user_info "userInfo")
          (#eq? @username "username")
          (#eq? @hostname "hostname")
          (#eq? @cwd "cwd")
          (#match? @target "^(https://)?[A-Za-z0-9-]+[.]oastify[.]com/")
          (#eq? @object "Object")
          (#eq? @entries "entries")
          (#eq? @profile @profile_use)
          (#eq? @map "map")
          (#eq? @key @key_use)
          (#eq? @value @value_use)
          (#eq? @encode_key "encodeURIComponent")
          (#eq? @encode_value "encodeURIComponent")
          (#eq? @string "String")
          (#eq? @join "join")
          (#eq? @default @default_use)
          (#eq? @base @base_use)
          (#eq? @url @url_check)
          (#eq? @starts "startsWith")
          (#eq? @https "https")
          (#eq? @http "http")
          (#eq? @client @client_use)
          (#eq? @question "?")
          (#eq? @query @query_use)
          (#eq? @get "get")
          (#eq? @url @url_use))


composite_rules:
  - id: npm-install-staged-user-host-cwd-oast
    desc: Install stages user and host callback
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-staged-user-host-cwd-oast-query
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
