defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1082,T1041
traits:
- id: node-hostname-oast-profile-post
  desc: Posts hostname profile to callback service
  crit: suspicious
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((program
        (lexical_declaration
          (variable_declarator name: (identifier) @host
            value: (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @os property: (property_identifier) @hostname))
                property: (property_identifier) @lower))))
        (if_statement
          consequence: (statement_block
            (lexical_declaration
              (variable_declarator name: (identifier) @body
                value: (template_string (template_substitution (identifier) @host_use))))
            (lexical_declaration
              (variable_declarator name: (identifier) @options
                value: (object
                  (pair key: (property_identifier) @host_key value: (string (string_fragment) @target))
                  (pair key: (property_identifier) @method_key value: (string (string_fragment) @method)))))
            (lexical_declaration
              (variable_declarator name: (identifier) @req
                value: (call_expression
                  function: (member_expression object: (identifier) @https property: (property_identifier) @request)
                  arguments: (arguments (identifier) @options_use))))
            (expression_statement
              (call_expression function: (member_expression object: (identifier) @req_use property: (property_identifier) @write)
                arguments: (arguments (identifier) @body_use))))))
        (#eq? @hostname "hostname")
        (#eq? @lower "toLowerCase")
        (#eq? @host @host_use)
        (#eq? @host_key "hostname")
        (#match? @target "\\.oastify\\.com$")
        (#eq? @method_key "method")
        (#eq? @method "POST")
        (#eq? @https "https")
        (#eq? @request "request")
        (#eq? @options @options_use)
        (#eq? @req @req_use)
        (#eq? @write "write")
        (#eq? @body @body_use))
