defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
traits:
- id: node-form-encoded-host-profile-post
  desc: Posts form-encoded host profile
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /os\.homedir\s*\(\s*\)/s
          $b0_1 = /os\.hostname\s*\(\s*\)/s
          $b0_2 = /os\.userInfo\s*\(\s*\)/s
          $b0_3 = /querystring\.stringify\s*\(/s
          $b0_4 = /https\.request\s*\(/s
          $b0_5 = /\.write\s*\(/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 300 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 500 and
                    for any i4 in (1..#b0_4) : (
                      @b0_4[i4] >= (@b0_3[i3] + !b0_3[i3]) and
                      @b0_4[i4] <= (@b0_3[i3] + !b0_3[i3]) + 1000 and
                      for any i5 in (1..#b0_5) : (
                        @b0_5[i5] >= (@b0_4[i4] + !b0_4[i4]) and
                        @b0_5[i5] <= (@b0_4[i4] + !b0_4[i4]) + 500 and
                        true
                      )
                    )
                  )
                )
              )
            )
          )
      }
