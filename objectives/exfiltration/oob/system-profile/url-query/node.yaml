defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1552.001
  for:
  - javascript
  - typescript
composite_rules:
- id: node-oast-fun-hostname-beacon-get
  desc: Sends hostname to OAST.fun over DNS and HTTPS
  crit: hostile
  conf: 0.99
  attack: T1041,T1048.003,T1082
  mbc: E1041
  scope: file
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oast-fun-domain
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/communications/http/request/client/call::https-request
  - id: micro-behaviors/communications/http/get::javascript-get-method-text
  - id: micro-behaviors/communications/http/request/configuration::node-http-options-host-port
- id: node-oob-subdomain-host-identity-exfil
  desc: Sends Node hostname and username to OOB subdomains
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002,T1082,T1033
  mbc: E1041
  scope: file
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/configuration::node-http-options-host-port
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  near_bytes: 4096
- id: node-querystring-host-profile-oob-exfil
  desc: Sends URL-encoded host identity to an OOB endpoint
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002,T1082,T1033
  mbc: E1041
  scope: file
  all:
  - id: micro-behaviors/communications/http/request/beacon::oob-http-identity-query-cooccurrence
  - id: micro-behaviors/data/encode/url::querystring-stringify-call
  - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
  near_bytes: 4096
- id: node-query-string-host-profile-beacon
  desc: Query-string host profile sent to collector hosts
  crit: hostile
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
  - id: micro-behaviors/communications/http/request/client/call::node-https-request-h-alias
  any:
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
- id: node-manual-qs-host-profile-beacon
  desc: URL-encoded host and user queries beside a computed GET to an OOB host
  crit: hostile
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/communications/http/request/beacon::oob-http-identity-query-cooccurrence
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/communications/http/request/url-computed::node-request-options-computed-path
- id: node-ci-host-profile-http-post-exfil
  desc: Uploads Node environment and host profile over HTTP
  crit: hostile
  conf: 0.97
  attack: T1041,T1195.002,T1082,T1033
  mbc: E1041
  scope: file
  all:
  - id: micro-behaviors/os/env/enumerate/entries::js-object-keys-env
  - id: micro-behaviors/os/sysinfo/profile::node-host-information-query-set
  - id: micro-behaviors/communications/http/request/json::node-profile-payload-host-fields
  - id: micro-behaviors/communications/http/request/json::node-json-payload-buffer
  - id: micro-behaviors/communications/http/request/json::node-http-post-method
  - id: micro-behaviors/communications/http/request/json::node-request-writes-data-buffer
  near_bytes: 5000
