defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1041,T1082
composite_rules:
- id: node-deriv-hostname-webhook-attempt
  desc: Attempts hostname upload through webhook
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::node-deriv-hostname-webhook
  - id: objectives/exfiltration/oob/system-profile/form-body::node-deriv-hostname-form
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::node-deriv-curl-exec
  - id: micro-behaviors/os/sysinfo/hostname/query::node-hostname-read
