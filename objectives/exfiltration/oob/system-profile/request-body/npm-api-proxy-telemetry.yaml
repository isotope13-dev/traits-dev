defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1041

traits:
  - id: compact-package-identity-body
    desc: Serializes compact package identity fields
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'JSON\.stringify\s*\(\s*\{\s*(n|name)\s*[, :]'
  - id: compact-package-version-key
    desc: Compact package version field key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b(v|version)\s*[, :]'
  - id: compact-package-method-key
    desc: Compact API method field key
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(,\s*m\s*\}|\bmethod\s*:)'

composite_rules:
  - id: module-init-api-proxy-telemetry
    desc: Exfiltrates API method telemetry
    crit: hostile
    conf: 0.96
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/read/file/target::require-local-package-json
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
      - id: micro-behaviors/data/control-flow/module-exec::module-scope-calls-declared-function
      - id: micro-behaviors/data/property/define::js-proxy-get-trap
      - id: compact-package-identity-body
      - id: compact-package-version-key
      - id: compact-package-method-key
      - id: micro-behaviors/data/control-flow/async::promise-resolve-call
