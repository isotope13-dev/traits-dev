defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041,T1082
traits:
- id: collector-post-invocation
  desc: Script posts payload to collector
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: post\s*\(\s*COLLECTOR\s*,\s*payload
composite_rules:
- id: ngrok-install-profile-post
  desc: Script posts install host profile to ngrok collector
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  scope: file
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::ngrok-collector-url
  - id: objectives/exfiltration/oob/system-profile/form-body::install-host-profile
  - id: objectives/exfiltration/oob/system-profile/request-body::collector-post-invocation
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::https-request-write
- id: npm-install-ngrok-profile-post
  desc: Install hook posts host profile to ngrok collector
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  scope: archive
  all:
  - id: objectives/exfiltration/oob/system-profile/request-body::ngrok-install-profile-post
  - id: metadata/package/scripts/lifecycle::install-hooks
