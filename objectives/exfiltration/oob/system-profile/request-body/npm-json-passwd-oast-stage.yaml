defaults:
  platforms: [unix]
  attack: T1003.008,T1041,T1195.002

traits:
  - id: node-json-preinstall-entry
    desc: Preinstall invokes JSON-named Node entry
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '^node[[:space:]]+(\./)?preinstall[.]json([[:space:]]|$)'
  - id: preinstall-json-basename
    desc: Artifact named preinstall JSON
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: basename
      exact: preinstall.json
  - id: json-js-exec-binding
    desc: JSON-named text binds child-process exec
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: text
      regex: "const\\s*\\{\\s*exec\\s*\\}\\s*=\\s*require\\(['\"]child_process['\"]\\)"
  - id: json-passwd-post-command
    desc: JSON-named text posts passwd with curl
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: text
      substr: "curl --data '@/etc/passwd'"
  - id: json-host-oast-template
    desc: Builds hostname-prefixed callback URL
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: text
      substr: '$(hostname).${domain}'
  - id: json-oast-domain-binding
    desc: Binds domain to OASTify callback
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: text
      regex: "const\\s+domain\\s*=\\s*['\"][a-zA-Z0-9-]+[.]oastify[.]com['\"]"
  - id: json-passwd-command-binding
    desc: Command embeds passwd and hostname target
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: text
      regex: "const\\s+cmd\\s*=\\s*`[^`\\n]{0,80}curl --data '@/etc/passwd'\\s+\\$\\(hostname\\)[.]\\$\\{domain\\}`"
  - id: json-exec-command-binding
    desc: Executes constructed command variable
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: text
      regex: 'exec\s*\(\s*cmd\s*[,)]'

composite_rules:
  - id: json-node-passwd-oast-stage
    desc: JSON-named script stages passwd upload
    crit: suspicious
    conf: 0.99
    for: [json]
    scope: file
    all:
      - id: preinstall-json-basename
      - id: json-js-exec-binding
      - id: json-passwd-post-command
      - id: json-host-oast-template
      - id: json-oast-domain-binding
      - id: json-passwd-command-binding
      - id: json-exec-command-binding
  - id: npm-json-passwd-oast-stage
    desc: Install stages JSON-named passwd upload
    crit: hostile
    conf: 0.99
    for: [zip, npm, package.json, json]
    scope: archive
    all:
      - id: node-json-preinstall-entry
      - id: json-node-passwd-oast-stage
