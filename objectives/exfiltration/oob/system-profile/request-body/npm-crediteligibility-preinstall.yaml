defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1041,T1082,T1033
traits:
- id: npm-crediteligibility-curl-post
  desc: Posts collected install profile
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: curl -X POST -d
composite_rules:
- id: npm-crediteligibility-preinstall-profile-post
  desc: Posts hostname and working directory on install
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-crediteligibility-profile-endpoint
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-crediteligibility-hostname-substitution
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-crediteligibility-cwd-substitution
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-crediteligibility-curl-post
