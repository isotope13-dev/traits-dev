defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1005,T1041,T1195.002
  mbc: E1041
traits:
- id: node-install-passwd-and-host-profile-oast-post
  desc: Posts account database and profile to OAST
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /readFileSync\s*\(\s*["']\/etc\/passwd["']/is
          $b0_1 = /(passwd\s*:\s*passwdData|passwdData)/is
          $b0_2 = /(\.oastify\.com|\.oast\.fun)/is
          $b0_3 = /req\.write\s*\(\s*postData/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 2200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 2500 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1600 and
                    true
                  )
                )
              )
            )
          )
      }
