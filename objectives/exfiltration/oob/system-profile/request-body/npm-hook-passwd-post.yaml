# An install hook that reads /etc/passwd and writes it into the body of a Node
# HTTPS POST sends the account database off the machine at install time. The
# destination is not required: any remote host receives the same data.
defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1082,T1041
traits:
- id: npm-hook-request-body-write
  desc: Install script writes request body
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts[*]
    regex: '\b(req|request)\.write\(\s*\w{1,30}\s*\)'
composite_rules:
- id: npm-hook-passwd-https-post-exfil
  desc: Install hook POSTs /etc/passwd contents over HTTPS
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-hook-passwd-read
  - id: micro-behaviors/communications/http/request/verb::npm-script-node-http-post
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-hook-request-body-write
  needs: 1
  any:
  - id: metadata/package/scripts/lifecycle::npm-pre-or-postinstall-hook
  - id: metadata/package/scripts/lifecycle::has-install-script
