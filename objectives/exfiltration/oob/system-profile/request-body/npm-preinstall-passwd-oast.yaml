defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: npm-preinstall-oast-stdin-post
  desc: Preinstall sends piped data to OAST
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: (?i)curl\s+-X\s+POST\s+-d\s+@-\s+https?://[a-z0-9.-]+\.oast\.fun
composite_rules:
- id: npm-preinstall-host-passwd-oast-exfil
  desc: npm preinstall posts host identity and passwd data to OAST
  crit: hostile
  conf: 0.995
  attack: T1041,T1003.008,T1195.002
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-preinstall-hostname-command
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-preinstall-whoami-command
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-preinstall-passwd-file-read
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-preinstall-oast-stdin-post
