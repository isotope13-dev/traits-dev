defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1552.001
  for:
  - javascript
  - typescript
traits:
- id: node-http-post-method
  desc: Node HTTP request uses POST method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.request\s*\(\s*\{[^}]{0,200}method\s*:\s*.{0,8}POST
- id: node-request-writes-data-buffer
  desc: Node request writes data buffer
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \breq\.write\(data\)\s*;\s*req\.end\(\)
