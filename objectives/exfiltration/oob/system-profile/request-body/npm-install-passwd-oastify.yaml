defaults:
  platforms:
  - unix
  - windows
  attack: T1041,T1003.008,T1195.002
  mbc: E1041
  for:
  - package.json
  - shell
  - javascript
traits:
- id: npm-curl-posts-passwd-to-oastify
  desc: curl sends data to an OASTify endpoint
  crit: suspicious
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /curl\b[^\n]{0,400}(https?:\/\/)?[^\s\/"']{1,100}\.(oastify\.com|serveo\.net)/is
        condition:
          (
            $b0_0
          )
      }
