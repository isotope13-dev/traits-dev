defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041
traits:
- id: npm-inline-profile-oastify-post
  desc: Inline preinstall posts to an OASTify host
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: \.oastify\.com[\s\S]{0,100}method\s*:\s*["']POST
composite_rules:
- id: npm-inline-oastify-host-cloud-profile-exfil
  desc: npm preinstall POSTs host and cloud profile to OAST
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/package/scripts/lifecycle::npm-preinstall-script
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-inline-profile-host-user
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-inline-profile-env-network
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-inline-profile-oastify-post
