defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1082,T1041
traits:
- id: npm-ctf-bin-post-method
  desc: Uses POST for package preinstall request
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: 'method: ''POST'''
- id: npm-ctf-bin-body-write
  desc: Sends collected data in request body
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: req.write(postData)
composite_rules:
- id: npm-ctf-passwd-bin-profile-exfil
  desc: Posts passwd data to request bin on install
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-ctf-passwd-read
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-ctf-bin-host
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-ctf-bin-post-method
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-ctf-bin-body-write
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-ctf-bin-stealer-agent
