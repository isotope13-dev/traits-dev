defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1041,T1082
traits:
- id: npm-cucumber-hostname-stdin-post
  desc: Posts stdin during package preinstall
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: curl -s -X POST --data-binary @-
composite_rules:
- id: npm-cucumber-hostname-stdin-exfil
  desc: Posts hostname during package installation
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-cucumber-hostname-substitution
  - id: objectives/exfiltration/oob/system-profile/request-body::npm-cucumber-hostname-stdin-post
  - id: objectives/exfiltration/oob/system-profile/endpoint-contact::npm-cucumber-profile-endpoint
