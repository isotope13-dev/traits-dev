defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1082,T1041

traits:
  - id: npm-tcp-profile-preinstall
    desc: Preinstall runs local index script
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '^node[[:space:]]+(\./)?index[.]js([[:space:]]|$)'
  - id: node-tcp-profile-user
    desc: Collects username in profile
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'info.username = os.userInfo().username'
  - id: node-tcp-profile-host
    desc: Collects hostname in profile
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'info.hostname = os.hostname()'
  - id: node-tcp-profile-callback
    desc: Passes collected profile to callback
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'callback(info)'
  - id: node-tcp-profile-collect
    desc: Collects and sends system profile
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'getSystemInfo\(\(info\)\s*=>\s*\{\s*sendSystemInfo\(info\)'
  - id: node-tcp-profile-socket
    desc: Opens TCP socket for profile
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'const client = new net.Socket()'
  - id: node-tcp-profile-connect
    desc: Connects profile socket
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'client.connect(targetPort, targetIP'
  - id: node-tcp-profile-write
    desc: Writes serialized profile to socket
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'client.write(JSON.stringify(info))'

composite_rules:
  - id: node-tcp-system-profile-send
    desc: Sends user and host profile over TCP
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: node-tcp-profile-user
      - id: node-tcp-profile-host
      - id: node-tcp-profile-callback
      - id: node-tcp-profile-collect
      - id: node-tcp-profile-socket
      - id: node-tcp-profile-connect
      - id: node-tcp-profile-write
  - id: npm-preinstall-tcp-system-profile
    desc: Install sends system profile over TCP
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-tcp-system-profile-send
      - id: npm-tcp-profile-preinstall
