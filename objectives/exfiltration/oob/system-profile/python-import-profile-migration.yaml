defaults:
  platforms: [unix, windows]
  for: [python]
  mbc: E1041
  attack: T1195.002,T1082,T1041
composite_rules:
- id: import-time-oob-hostname-cwd-exfil
  desc: Import posts host profile to OAST
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/request/body/environment::module-level-host-profile-oob-post
  - id: micro-behaviors/communications/http/post::requests-post
- id: import-time-oob-host-profile-beacon
  desc: Import-time POST of host identity to OOB
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  any:
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
- id: import-time-urlopen-oob-host-beacon
  desc: Import-time urlopen sends hostname to OOB collector
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/os/package-manager/hook-install::runs-at-import-or-install
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  - id: objectives/exfiltration/oob/system-profile::python-urlopen-host-identity-query-exfil
- id: import-time-dns-oob-host-profile-beacon
  desc: Import resolves OOB DNS label carrying host identity
  crit: hostile
  conf: 0.96
  mbc: E1041,B0030
  attack: T1195.002,T1048.003,T1082
  all:
  - id: micro-behaviors/os/package-manager/hook-install::runs-at-import-or-install
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/dns/resolver::socket-dns-lookup
  any:
  - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference
  - id: micro-behaviors/os/sysinfo/platform/host::platform-node
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
