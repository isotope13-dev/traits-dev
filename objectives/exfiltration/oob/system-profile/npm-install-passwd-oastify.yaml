defaults:
  platforms: [unix, windows]
  attack: T1041,T1003.008,T1195.002
  mbc: E1041

traits:
  - id: npm-curl-uploads-passwd-file
    desc: curl sends the local passwd file as request data
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: >-
        (?is)(?:curl\b[^\n]{0,240}--data(?:-binary)?\s+['"]?@/etc/passwd|tar\s+-czf\s+-\s+/etc/passwd[\s\S]{0,180}\|\s*base64[\s\S]{0,180}\|\s*curl\b[^\n]{0,240}--data-binary\s+@-)
  - id: npm-curl-posts-passwd-to-oastify
    desc: curl sends data to an OASTify endpoint
    crit: suspicious
    if:
      type: text
      regex: >-
        (?is)curl\b[^\n]{0,400}(?:https?://)?[^\s/"']{1,100}\.(?:oastify\.com|serveo\.net)

composite_rules:
  - id: npm-install-hook-passwd-oastify-exfil
    desc: npm install hook sends /etc/passwd to OASTify
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, package.json, javascript]
    scope: archive
    near_bytes: 1200
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: npm-curl-uploads-passwd-file
      - id: npm-curl-posts-passwd-to-oastify
