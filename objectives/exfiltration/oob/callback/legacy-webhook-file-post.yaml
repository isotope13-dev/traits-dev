defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002
composite_rules:
  - id: webhook-file-post
    desc: Webhook file POST with package tag
    crit: suspicious
    conf: 0.94
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site
      - id: micro-behaviors/communications/http/request/body/form-field::post-data-package-key
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/challenge-flag::ctf-flag-target
