defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1195.002
  mbc: E1041

composite_rules:
  - id: node-oastify-https-get-beacon
    desc: Node sends an HTTPS GET beacon to an OASTify callback
    crit: hostile
    conf: 0.99
    near_lines: 10
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/os/package-manager/run::https-get-call
      - id: micro-behaviors/communications/http/client/initialize::node-http-get-oastify-target
