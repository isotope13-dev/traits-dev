# The remote half of an out-of-band XXE: a DTD whose parameter entity declares
# a `send` entity whose SYSTEM URL embeds the already-read `%file;` contents, so
# merely parsing the DTD issues the outbound request that carries the stolen
# data to the attacker callback host. The source (local file read) and the send
# (HTTP URL embedding it) are both expressed in the nested entity construction;
# it is files under exfiltration because the realized result is data leaving.
defaults:
  for: [xml, text, data]
  platforms: [unix, windows]
  attack: T1567,T1005
  mbc: B0024

composite_rules:
  - id: oob-xxe-nested-entity-exfiltration
    desc: OOB XXE DTD exfiltrates a read file to a callback URL
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/profile/markup::parameter-entity-nested-declaration
      - id: objectives/execution/exploit/markup::system-url-embeds-entity-ref
    unless:
      - id: metadata/package/agent-skill::agent-skill-directory-member
      # Pentest references and scoped test guides quote the same nested-entity
      # DTD as teaching material; the exfiltration claim needs a file that is
      # not documented security coursework.
      - id: metadata/package/documentation/agent-safety::security-example-documentation
