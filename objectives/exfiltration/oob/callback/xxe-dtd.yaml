# Remote half of an OOB XXE payload. The parent supplies the entity value;
# this file need not contain a local-file read or establish its data class.
# Require declaration injection and expansion syntax, not a URL alone.
defaults:
  # Plain text is omitted: the adjacent-entity leg cannot scan a
  # multi-megabyte single-line text file without tripping the rule
  # timeout. XML DTDs are the payloads this composite names.
  for: [xml]
  platforms: [unix, windows]
  attack: T1048.003

composite_rules:
  - id: oob-xxe-nested-entity-exfiltration
    desc: Nested DTD entity-data callback payload
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: objectives/execution/exploit/xxe::nested-external-parameter-injection
      - id: metadata/file/profile/markup::adjacent-parameter-entity-references
    unless:
      - id: metadata/package/agent-skill::agent-skill-directory-member
      # Pentest references and scoped test guides quote the same nested-entity
      # DTD as teaching material; the exfiltration claim needs a file that is
      # not documented security coursework.
      - id: metadata/package/documentation/agent-safety::security-example-documentation
