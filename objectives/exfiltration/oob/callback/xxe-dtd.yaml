# Remote half of an OOB XXE payload. The parent supplies the entity value;
# this file need not contain a local-file read or establish its data class.
# Require declaration injection and expansion syntax, not a URL alone.
defaults:
  # Plain text is omitted: the adjacent-entity leg cannot scan a
  # multi-megabyte single-line text file without tripping the rule
  # timeout. XML DTDs are the payloads this composite names.
  for: [xml]
  platforms: [unix, windows]
  attack: T1048.003

composite_rules:
  - id: oob-xxe-nested-entity-exfiltration
    desc: Nested DTD entity-data callback payload
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: objectives/execution/exploit/xxe::nested-external-parameter-injection
      - id: micro-behaviors/data/format/xml::adjacent-parameter-entity-references
    unless:
      - id: metadata/package/agent-skill::agent-skill-directory-member
      # Pentest references and scoped test guides quote the same nested-entity
      # DTD as teaching material; the exfiltration claim needs a file that is
      # not documented security coursework.
      - id: metadata/package/documentation/agent-safety::security-example-documentation

  # Blind XXE against an operator-chosen local file: a parameter entity
  # loads the file, a nested parameter entity defines the outbound
  # entity, and a request URL query carries the file entity reference.
  # The destination may be an attacker callback (file disclosure) or a
  # loopback service URL (a stolen session value injected server-side);
  # the entity mechanism is the same and survives renamed entities,
  # changed files, hosts, and host implementation language.
  - id: oob-xxe-blind-file-exfiltration
    desc: Blind XXE expands local file into request URL
    crit: hostile
    conf: 0.97
    attack: T1190,T1005,T1048.003
    for: [xml, scripts, source, text, html]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/format/xml::external-entity-local-system-id
      - id: micro-behaviors/data/format/xml::parameter-entity-nested-declaration
    any:
      - id: objectives/execution/exploit/xxe::url-embeds-parameter-entity-ref
      - id: objectives/execution/exploit/xxe::fragmented-url-embeds-entity-ref
      - id: objectives/execution/exploit/xxe::system-url-embeds-entity-ref
    needs: 1
    unless:
      - id: metadata/package/agent-skill::agent-skill-directory-member
      - id: metadata/package/documentation/agent-safety::security-example-documentation
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      # Go never links _test.go into a built binary; parser tests carry XXE inputs.
      - id: metadata/package/testing/harness/unit::go-test-source-file
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/offensive/payload-corpus::scanner-request-payload-context
        - id: well-known/lib/format/defusedxml/

  # The serving half of the same attack in one artifact: the file both
  # carries the blind-XXE payload and runs an HTTP listener that serves
  # the external DTD and collects the resulting file-content request.
  - id: oob-xxe-dtd-callback-server
    desc: HTTP server serves blind-XXE DTD and collects file callback
    crit: hostile
    conf: 0.96
    attack: T1048.003,T1071.001
    for: [scripts, source, text]
    all:
      - id: oob-xxe-blind-file-exfiltration
      - id: micro-behaviors/communications/http/server/listener::server
