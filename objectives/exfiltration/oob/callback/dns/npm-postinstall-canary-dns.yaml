defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1071.004
traits:
- id: postinstall-canary-dns-lookup
  desc: npm postinstall resolves Canarytokens domain
  crit: notable
  conf: 0.99
  if:
    type: value
    path: scripts.postinstall
    regex: \bnslookup\s+[a-z0-9]{16,63}\.canarytokens\.com\b
composite_rules:
- id: npm-postinstall-canary-dns
  desc: Dependency confusion package resolves Canarytokens on install
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: objectives/exfiltration/oob/callback/dns::postinstall-canary-dns-lookup
  - id: metadata/package/description/disclosure::desc-dependency-confusion
