defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  for:
  - python
composite_rules:
- attack: T1048.003
  id: python-import-install-dns-oob-callback
  desc: Import/install context with OOB DNS callback
  conf: 0.9
  mbc: E1041
  all:
  - id: micro-behaviors/os/package-manager/hook-install::runs-at-import-or-install
  - id: micro-behaviors/communications/dns/resolver::python-oob-dns-name-argument
- id: python-silent-oob-dns-callback
  desc: Silently resolves an OOB callback hostname
  conf: 0.95
  attack: T1048.003
  all:
  - id: micro-behaviors/communications/dns/resolver::python-oob-dns-name-argument
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
- id: python-install-canarytokens-dns-callback
  desc: Install hook sends CanaryTokens DNS callback
  crit: hostile
  conf: 0.99
  attack: T1041,T1195.002,T1048.003
  scope: file
  all:
  - id: objectives/exfiltration/oob/callback/dns::python-import-install-dns-oob-callback
  - id: micro-behaviors/communications/url/host/oob/endpoint::canarytokens-bare-host
  - id: metadata/package/files/included::setup-py-basename
