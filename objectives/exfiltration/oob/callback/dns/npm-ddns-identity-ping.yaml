defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1048,T1033
traits:
- id: npm-postinstall-ddns-identity-ping
  desc: Postinstall attempts dynamic DNS callback
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\bping.{0,150}%USERNAME%.{0,100}\.x\.ddns\.su.{0,150}(ping|curl).{0,100}whoami
