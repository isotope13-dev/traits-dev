defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: tines-endpoint-oob-callback
    desc: Tines endpoint, JSON and OOB POST clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/import/module::tines-apps-import
      - id: micro-behaviors/communications/http/request/client::invoke-endpoint-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    any:
      - id: micro-behaviors/data/control-flow/dispatch/named::js-exploit-named-function-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
