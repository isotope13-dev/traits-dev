# A DNS query is itself the signal: the domain's name server records the
# query, its resolver address and time. Report the callback, not data theft;
# the label may carry no more than a package or campaign identifier.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.004
composite_rules:
  # Resolving a run-time subdomain and discarding the answer has no use
  # besides reaching the domain's authoritative server.
  - id: node-load-time-dns-subdomain-beacon
    desc: Load-time DNS beacon to a built subdomain
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/dns/resolver::node-module-load-dns-request
      - id: micro-behaviors/communications/dns/resolver::node-dns-query-result-discarded
    any:
      - id: micro-behaviors/communications/dns/label::node-module-load-dns-suffix-query
      - id: micro-behaviors/communications/dns/label::node-module-load-dns-template-subdomain
  # Only the publish-root manifest's hooks run on install, so installing the
  # package triggers the callback without any import by the victim.
  - id: npm-install-hook-dns-callback-beacon
    desc: npm install hook runs a DNS callback beacon
    crit: hostile
    conf: 0.95
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
    any:
      - id: node-load-time-dns-subdomain-beacon
      - id: micro-behaviors/communications/dns/oob::node-load-time-oob-label-query
      - id: micro-behaviors/communications/dns/oob::node-load-time-oast-service-query
