defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - package.json
  - javascript
  attack: T1195.002,T1071.001,T1041
composite_rules:
- id: npm-lifecycle-base64-oast-fun-callback
  desc: npm lifecycle hooks decode and contact a Base64 OAST.fun endpoint
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: micro-behaviors/communications/url/host/oob/encoded::oast-fun-b64
  - id: micro-behaviors/data/decode/base64/lifecycle::npm-preinstall-base64
  - id: micro-behaviors/communications/http/request/get::preinstall-node-https-get
  - id: metadata/package/scripts/lifecycle::multiple-install-hooks
