defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-install-typosquat-probe-callback
    desc: Install hook calls typosquat probe endpoint
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1071.001
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (assignment right: (call
              function: (attribute object: (attribute object: (identifier) @urllib attribute: (identifier) @request) attribute: (identifier) @urlopen)
              arguments: (argument_list (string) @url))))))
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (call function: (identifier) @invoke))))))
          (expression_statement (call function: (identifier) @setup arguments: (argument_list
            (keyword_argument name: (identifier) @description value: (string) @text)
            (keyword_argument name: (identifier) @cmdclass value: (dictionary
              (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @urllib "urllib") (#eq? @request "request") (#eq? @urlopen "urlopen")
          (#eq? @helper @invoke) (#eq? @install "install") (#eq? @run "run") (#eq? @hook @registered)
          (#eq? @setup "setup") (#eq? @description "description") (#eq? @cmdclass "cmdclass")
          (#match? @installkey "^.install.$") (#match? @url "https?://")
          (#match? @text "check how many developers install typoed libraries")
          (#not-match? @url "https?://(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @url "https?://172[.](1[6-9]|2[0-9]|3[01])[.]")
          (#not-match? @url "https?://(169[.]254[.]|0[.]0[.]0[.]0)")
          (#not-match? @url "[.](local|internal)(/|.)"))
