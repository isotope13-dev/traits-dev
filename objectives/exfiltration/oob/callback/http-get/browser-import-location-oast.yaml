defaults:
  platforms:
  - unix
  - windows
  - android
  - ios
  for:
  - javascript
  attack: T1189,T1041
traits:
- id: browser-load-fetch-oast
  desc: Schedules OAST fetch on browser load
  crit: hostile
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((program (expression_statement (call_expression
        function: (member_expression object: (identifier) @window
          property: (property_identifier) @listener)
        arguments: (arguments (string (string_fragment) @event)
          (function_expression body: (statement_block (expression_statement
            (call_expression function: (member_expression
              object: (call_expression function: (member_expression
                object: (call_expression function: (identifier) @fetch
                  arguments: (arguments (string (string_fragment) @url)))
                property: (property_identifier) @then))
              property: (property_identifier) @catch)))))))))
        (#eq? @window "window")
        (#eq? @listener "addEventListener")
        (#eq? @event "load")
        (#eq? @fetch "fetch")
        (#eq? @then "then")
        (#eq? @catch "catch")
        (#match? @url "(?i)^https?://[a-z0-9.-]+\\.oastify\\.com([/?#]|$)"))
