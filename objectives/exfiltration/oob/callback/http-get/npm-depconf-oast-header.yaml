defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1071.001
traits:
- id: js-depconf-https-get-options
  desc: Sends HTTPS request using options
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: https\.get\s*\(\s*options\s*,
composite_rules:
- id: npm-install-oast-depconf-user-agent
  desc: Install sends dependency confusion OAST callback
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/oob/callback/request::js-depconf-oast-fun-host
  - id: objectives/exfiltration/oob/callback/request::js-depconf-poc-user-agent
  - id: objectives/exfiltration/oob/callback/http-get::js-depconf-https-get-options
