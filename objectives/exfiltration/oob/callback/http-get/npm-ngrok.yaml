defaults:
  platforms:
  - unix
  - windows
  crit: hostile
  attack: T1195.002,T1041
  for:
  - npm
  - package.json
  - javascript
composite_rules:
- id: npm-postinstall-ngrok-app-beacon
  desc: npm postinstall makes an ngrok HTTPS callback
  crit: hostile
  conf: 0.97
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/url/host/name::ngrok-app-endpoint
- id: dependency-confusion-postinstall-ngrok-beacon
  desc: Dependency-confusion install callback to ngrok
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/url/host/name::ngrok-free-domain
