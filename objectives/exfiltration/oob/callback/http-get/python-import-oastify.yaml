defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1195.002,T1071.001

traits:
  - id: python-import-oastify-get
    desc: Import requests OASTify endpoint
    crit: hostile
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module (expression_statement (call
          function: (attribute object: (identifier) @requests attribute: (identifier) @get)
          arguments: (argument_list (string) @url))))
          (#eq? @requests "requests") (#eq? @get "get")
          (#match? @url "https?://[^/]+[.]oastify[.]com([^A-Za-z0-9.-]|$)"))
  - id: python-import-thread-oastify-get
    desc: Import starts OASTify request thread
    crit: hostile
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @callback body: (block
            (try_statement body: (block (expression_statement (call
              function: (attribute object: (identifier) @requests attribute: (identifier) @get)
              arguments: (argument_list (string) @url)))))))
          (expression_statement (call function: (attribute object: (call function: (identifier) @thread
            arguments: (argument_list (keyword_argument name: (identifier) @targetkey value: (identifier) @target)))
            attribute: (identifier) @start))))
          (#eq? @requests "requests") (#eq? @get "get") (#match? @url "https?://[^/]+[.]oastify[.]com([^A-Za-z0-9.-]|$)")
          (#eq? @callback @target) (#eq? @thread "Thread") (#eq? @targetkey "target") (#eq? @start "start"))
