defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-module-body-oob-get
  desc: Module-level HTTP GET targets an OOB collector
  crit: suspicious
  conf: 0.99
  if:
    type: symbol
    kind: call
    regex: \.get$
    module_level: true
    receiver:
      from:
        call: ^require$
        literal: ^(node:)?https?$
    arg:
      index: 0
      from:
        whole_value: ^https?://[a-zA-Z0-9.-]+[.](oast[.](fun|pro|live|site|online|me)|interactsh[.]com|burpcollaborator[.]net)(:[0-9]+)?([/?#]|$)
composite_rules:
- id: node-webhook-site-hostname-get-attempt
  desc: Attempts a hostname callback to webhook.site
  crit: hostile
  conf: 0.98
  attack: T1041,T1082
  mbc: E1041
  near_bytes: 500
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::node-inline-os-hostname-call
  - id: micro-behaviors/communications/http/request/client/call::node-http-get-dynamic
  - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-uuid-path
- id: published-tiny-node-package-oob-beacon
  desc: Tiny npm package contains a module-level OOB beacon
  crit: hostile
  conf: 0.98
  attack: T1071.001
  for:
  - npm
  - tar
  - package.json
  - javascript
  scope: package
  size_max: 4096
  all:
  - id: objectives/exfiltration/oob/callback/http-get::node-module-body-oob-get
  - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
  any:
  - id: metadata/import/builtin::require-http
  - id: metadata/import/builtin::require-https
  - id: metadata/import/builtin::node-prefixed-http-require
  - id: metadata/import/builtin::node-prefixed-https-require
