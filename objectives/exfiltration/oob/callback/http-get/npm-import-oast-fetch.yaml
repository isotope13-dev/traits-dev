defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1041
traits:
- id: js-esm-oast-fetch-before-export
  desc: Browser module fetches OAST endpoint during load
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /\bfetch\s*\(\s*["']https?:\/\/[a-z0-9-]+\.oast\.(site|fun)(\/[^"']*)?["']\s*\)\s*;\s*export\s*\{/s
        condition:
          (
            $b0_0
          )
      }
- id: js-async-iife-oast-fetch
  desc: Async initializer fetches OAST endpoint
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /\(\s*async\s*\(\s*\)\s*=>\s*\{/s
          $b0_1 = /["']https?:\/\/[a-z0-9-]+\.oast\.(site|fun)\/[^"']*["']/s
          $b0_2 = /await\s+fetch\s*\(\s*url\b/s
          $b0_3 = /\}\s*\)\s*\(\s*\)/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 300 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 300 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1000 and
                    true
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-import-oast-fetch
  desc: npm entrypoint makes an OAST callback at load
  crit: hostile
  conf: 0.99
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/entrypoint/module::main-root-javascript-entry
  any:
  - id: objectives/exfiltration/oob/callback/http-get::js-esm-oast-fetch-before-export
  - id: objectives/exfiltration/oob/callback/http-get::js-async-iife-oast-fetch
