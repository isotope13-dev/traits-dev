defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1071.001
traits:
- id: import-fetch-url
  desc: Line starts with an HTTPS fetch call
  crit: notable
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    regex: ^\s*fetch\(["\x27]https://[^"\x27\s]{1,200}["\x27]\)
composite_rules:
- id: npm-unclaimed-scope-import-ping
  desc: Unclaimed scope proof calls remote endpoint on import
  crit: hostile
  conf: 0.98
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: objectives/exfiltration/oob/callback/request::description-unclaimed-scope-poc
  - id: objectives/exfiltration/oob/callback/http-get::import-fetch-url
  - id: objectives/exfiltration/oob/callback/request::import-ping-log
  - id: micro-behaviors/data/control-flow/error-handling/suppress::empty-arrow-catch-handler
  - id: metadata/package/entrypoint/module::main-root-javascript-entry
