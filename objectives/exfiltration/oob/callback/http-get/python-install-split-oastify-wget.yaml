defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-install-split-oastify-wget-eval
    desc: Install evaluates fragmented OASTify wget
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1027,T1071.001
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (assignment left: (identifier) @stem right: (string) @stemvalue))
            (expression_statement (assignment left: (identifier) @oast right: (string) @oastvalue))
            (expression_statement (assignment left: (identifier) @ify right: (string) @ifyvalue))
            (expression_statement (assignment left: (identifier) @com right: (string) @comvalue))
            (expression_statement (assignment left: (identifier) @space right: (string) @spacevalue))
            (expression_statement (assignment left: (identifier) @get right: (string) @getvalue))
            (expression_statement (assignment left: (identifier) @w right: (string) @wvalue))
            (expression_statement (assignment left: (identifier) @dot_sy right: (string) @syvalue))
            (expression_statement (assignment left: (identifier) @o right: (string) @ovalue))
            (expression_statement (assignment left: (identifier) @s right: (string) @svalue))
            (expression_statement (assignment left: (identifier) @domain right: (binary_operator
              left: (binary_operator left: (binary_operator right: (identifier) @oast2) right: (identifier) @ify2) right: (identifier) @com2)))
            (expression_statement (assignment left: (identifier) @cmd right: (binary_operator
              left: (binary_operator left: (identifier) @w2 right: (identifier) @get2) right: (identifier) @space2)))
            (expression_statement (assignment left: (identifier) @system right: (binary_operator
              left: (binary_operator left: (binary_operator left: (identifier) @o2 right: (identifier) @s2) right: (identifier) @dot_sy2) right: (identifier) @stem2)))
            (expression_statement (call function: (identifier) @eval arguments: (argument_list (binary_operator
              left: (identifier) @system2 right: (string (interpolation expression: (binary_operator left: (identifier) @cmd2 right: (identifier) @domain2)))))))))
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (call function: (identifier) @invoke))))))
          (expression_statement (call function: (identifier) @setup arguments: (argument_list
            (keyword_argument name: (identifier) @cmdclass value: (dictionary
              (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @helper @invoke) (#eq? @hook @registered) (#eq? @install "install") (#eq? @run "run")
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#match? @installkey "^.install.$") (#eq? @eval "eval")
          (#eq? @oast @oast2) (#eq? @ify @ify2) (#eq? @com @com2) (#eq? @domain @domain2)
          (#eq? @w @w2) (#eq? @get @get2) (#eq? @space @space2) (#eq? @cmd @cmd2)
          (#eq? @o @o2) (#eq? @s @s2) (#eq? @dot_sy @dot_sy2) (#eq? @stem @stem2) (#eq? @system @system2)
          (#match? @oastvalue "^.oast.$") (#match? @ifyvalue "^.ify[.]c.$") (#match? @comvalue "^.om.$")
          (#match? @wvalue "^.w.$") (#match? @getvalue "^.get.$") (#match? @spacevalue "^. .$")
          (#match? @ovalue "^.o.$") (#match? @svalue "^.s.$") (#match? @syvalue "^.[.]sy.$") (#match? @stemvalue "^.stem.$"))
