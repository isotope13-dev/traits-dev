defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  attack: T1048
  mbc: B0030
composite_rules:
- id: browser-oob-encoded-navigation
  desc: Browser sends URL-encoded data to OOB collector
  crit: hostile
  conf: 0.97
  attack: T1041
  mbc: E1041
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  any:
  - id: micro-behaviors/ui/window/navigation/location::browser-external-redirect
  - id: micro-behaviors/ui/window/navigation/open::browser-window-open-external-url
