defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1195.002
  mbc: E1041
traits:
- id: node-oastify-https-get-beacon
  desc: HTTPS GET to OASTify callback
  crit: hostile
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression object: (identifier) @client
          property: (property_identifier) @method)
        arguments: (arguments (string (string_fragment) @url)))
        (#eq? @client "https")
        (#eq? @method "get")
        (#match? @url "(?i)^https://[a-z0-9.-]+\\.oastify\\.com([/?#]|$)"))
