defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041,T1195.002
  mbc: E1041

traits:
  - id: node-pipedream-requestbin-host
    desc: Node references a Pipedream RequestBin host
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)([a-z0-9-]{1,64}\.)+m\.pipedream\.net\b'
  - id: node-pipedream-options-hostname-get
    desc: Configures Pipedream hostname GET request
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?s)hostname\s*:\s*["''][\w.-]{1,64}\.m\.pipedream\.net["''].{0,80}method\s*:\s*["'']GET["'']'

composite_rules:
  - id: node-pipedream-https-get-beacon
    desc: Node sends a GET beacon to Pipedream
    crit: hostile
    conf: 0.99
    all:
      - id: node-pipedream-requestbin-host
      - id: node-pipedream-options-hostname-get
      - id: micro-behaviors/os/package-manager/run::https-get-call
