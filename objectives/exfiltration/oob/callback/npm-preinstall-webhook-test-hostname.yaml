defaults:
  platforms: [unix, windows]
  for: [zip, npm, package.json]
  attack: T1195.002,T1041,T1082

composite_rules:
  - id: npm-preinstall-posts-hostname-to-webhook-test
    desc: npm preinstall posts local hostname data to webhook-test.com
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/discovery::preinstall-hostname
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-test-domain
      - id: micro-behaviors/communications/http/request/verb::npm-script-post
      - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
