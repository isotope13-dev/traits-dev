defaults:
  platforms:
  - unix
  - windows
  - android
  - ios
  for:
  - javascript
  attack: T1189,T1041
traits:
- id: browser-import-location-oast
  desc: Redirects browser to OAST on import
  crit: hostile
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((program (expression_statement (assignment_expression
        left: (member_expression object: (identifier) @window
          property: (property_identifier) @location)
        right: (string (string_fragment) @url))))
        (#eq? @window "window")
        (#eq? @location "location")
        (#match? @url "(?i)^https?://[a-z0-9.-]+\\.oastify\\.com([/?#]|$)"))
