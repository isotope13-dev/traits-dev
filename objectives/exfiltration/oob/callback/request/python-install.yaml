defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
traits:
- id: python-setup-module-curl-canarytokens
  desc: Module runs curl against CanaryTokens
  crit: suspicious
  conf: 0.98
  for:
  - python
  if:
    type: tree-sitter
    query: |
      ((module (expression_statement (call
        function: (attribute object: (identifier) @obj attribute: (identifier) @method)
        arguments: (argument_list (string) @command))))
        (#eq? @obj "os") (#eq? @method "system")
        (#match? @command "curl[[:space:]]+https?://canarytokens\\.com/"))
composite_rules:
- id: python-setup-curl-canarytokens-callback
  desc: Setup runs a CanaryTokens HTTP callback
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1071.001
  for:
  - python
  scope: file
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: objectives/exfiltration/oob/callback/request::python-setup-module-curl-canarytokens
- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-install-caesar-canarytokens-identity-beacon
  desc: Install hook sends user identity to shifted CanaryTokens URL
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002,T1033
  scope: archive
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/data/arithmetic::python-chr-ord-shift-generator
  - id: micro-behaviors/communications/url/host/oob/encoded::caesar-three-canarytokens-domain
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference
- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-install-hook-requestrepo-curl-callback
  desc: Install hook contacts an OOB request collector with curl
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002
  scope: outer
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/communications/url/host/oob/endpoint::requestrepo
  any:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-egg-info
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-develop
- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-setup-hook-download-write-and-execute-discord-cdn
  desc: setup hook downloads and executes a Discord-hosted Python payload
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.006,T1195.002
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/download/write::python-response-content-binary-write
  - id: micro-behaviors/process/create/subprocess/launch::check-call-ast
  - id: micro-behaviors/process/info/current::python-sys-executable-text
  - id: well-known/app/communication/discord::discord-cdn-download-url
- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-install-hook-urlopen-oob
  desc: Install hook sends OOB HTTP callback
  crit: hostile
  conf: 0.96
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/http/client/initialize::python-urlopen-oob-target
  unless:
  - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
  - id: metadata/lang/source/literal/string/shape::python-triple-quoted-module
- id: python-install-hook-http-oob-beacon
  desc: Install hook calls an OOB callback
  crit: hostile
  conf: 0.97
  for:
  - python
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
