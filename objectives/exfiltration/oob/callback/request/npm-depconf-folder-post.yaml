defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1195.002,T1041
traits:
- id: npm-depconf-test-description
  desc: Describes dependency confusion test
  crit: suspicious
  if:
    type: value
    path: description
    regex: (?i)\btest package for dependency confusion\b
- id: npm-depconf-folder-pwd
  desc: Includes working directory excerpt
  crit: notable
  if:
    type: value
    path: scripts.preinstall
    substr: $(pwd | cut -d
