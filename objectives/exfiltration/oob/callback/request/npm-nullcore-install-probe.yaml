defaults:
  platforms:
  - unix
  for:
  - package.json
  attack: T1195.002,T1041
traits:
- id: npm-preinstall-nullcore-probe
  desc: Preinstall requests nullcore callback
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.preinstall
    regex: ^\s*wget\s+--quiet\s+\S*://(newnpm\d+|canary)\.nullcorelabs\.com(/|["'\s]|$)
