defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  attack: T1195.002,T1071.001
traits:
- id: js-airbnb-depconf-marker
  desc: Sets Airbnb dependency confusion marker
  crit: notable
  for:
  - javascript
  if:
    type: text
    substr: airbnb-depconf
- id: js-install-package-env
  desc: Reads npm package identity for callback
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: (?s)process\.env\.npm_package_name.{0,150}process\.env\.npm_package_version
- id: js-install-https-options-request
  desc: Sends HTTPS callback using options
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: https\.request\(options\s*,
