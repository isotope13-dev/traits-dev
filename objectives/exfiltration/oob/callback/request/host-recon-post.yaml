defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  attack: T1041,T1082,T1590
  mbc: C0011
  crit: hostile
composite_rules:
- id: python-curl-host-cwd-exfil
  for:
  - python
  desc: curl sends hostname and cwd out
  conf: 0.95
  scope: leaf
  near_lines: 8
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
- id: init-daemon-thread-host-beacon
  for:
  - python
  desc: Init file starts a daemon host beacon
  conf: 0.95
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/process/thread/create::python-daemon-thread
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
