defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - package.json
  - javascript
  attack: T1195.002,T1071.001
traits:
- id: js-depconf-oast-fun-host
  desc: Configures an OAST callback host
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: hostname\s*:\s*["'][a-z0-9-]{12,63}\.oast\.fun["']
- id: js-depconf-poc-user-agent
  desc: Sets dependency confusion proof user agent
  crit: suspicious
  for:
  - javascript
  if:
    type: text
    substr: PoC-Dependency-Confusion-by-
