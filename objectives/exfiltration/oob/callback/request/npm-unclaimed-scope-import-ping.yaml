defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1071.001
traits:
- id: description-unclaimed-scope-poc
  desc: Description claims unclaimed scope proof
  crit: notable
  conf: 0.99
  for:
  - package.json
  if:
    type: value
    path: description
    regex: (?i)poc for unclaimed scoped org
- id: import-ping-log
  desc: Module logs callback ping
  crit: notable
  conf: 0.95
  for:
  - javascript
  if:
    type: text
    regex: console\.log\([^\n]{0,100}pinged
- id: import-ping-silences-failure
  desc: Module ignores callback request failure
  crit: notable
  conf: 0.95
  for:
  - javascript
  if:
    type: text
    regex: \.catch\s*\(\s*\(\s*\)\s*=>\s*\{\s*\}\s*\)
