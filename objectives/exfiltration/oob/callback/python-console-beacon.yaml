defaults:
  platforms: [unix, windows]
  for: [python, python-sdist, whl, zip]

composite_rules:
  - id: python-console-entrypoint-hex-host-beacon
    desc: Console entry point calls HTTP on hex-label host
    crit: hostile
    conf: 0.96
    attack: T1041,T1195.002
    scope: outer
    for: [text, python, python-sdist, whl, zip]
    all:
      - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/url/host/name::hostname-with-eight-hex-label
      - id: micro-behaviors/communications/url/scheme::cleartext-http-url-code-literal
