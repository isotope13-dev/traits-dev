defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: preinstall-webhook-client-clues
  desc: Preinstall webhook and HTTP client clues
  crit: suspicious
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  for: [package.json, npm]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/communications/url/host/oob/endpoint::preinstall-webhook-site-url
  any:
  - id: metadata/package/scripts/command::npm-lifecycle-node-inline-reference
  - id: micro-behaviors/process/interpreter/node::scripts-preinstall-node-e
  - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
  - id: micro-behaviors/communications/http/download/wget::npm-preinstall-wget
  - id: micro-behaviors/communications/http/request/package::meta-preinstall-wget
