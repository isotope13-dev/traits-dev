# Thunderbolt manifest JSON that names a third-party callback baseURL and remote
# payload bundles — the loader stage before a site builder pulls attacker JS/CSS.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, json, text]
  attack: T1195.002,T1071.001
  mbc: E1041

composite_rules:
  - id: thunderbolt-manifest-callback-document
    desc: Thunderbolt manifest names callback baseURL
    crit: hostile
    conf: 0.99
    scope: file
    for: [json, text]
    all:
      - id: objectives/supply-chain/impersonation/brand::thunderbolt-manifest-non-wix-baseurl
      - id: objectives/supply-chain/impersonation/brand::thunderbolt-manifest-payload-bundle-model
      - id: objectives/supply-chain/impersonation/brand::rb-dsgnsys-thunderbolt-manifest-basename
