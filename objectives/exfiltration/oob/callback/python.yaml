defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1041
  mbc: E1041

composite_rules:
  - id: canarytokens-formatted-query-exfil
    desc: Sends runtime value through CanaryTokens query
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: objectives/exfiltration/oob/endpoint::canarytokens-traffic-path
      - id: micro-behaviors/communications/http/url/query::formatted-identifier-query-value
      - id: micro-behaviors/communications/http/request/client::urllib3-explicit-method-request
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/
      - id: well-known/tool/offensive/
