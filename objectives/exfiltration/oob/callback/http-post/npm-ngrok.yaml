defaults:
  platforms:
  - unix
  - windows
  crit: hostile
composite_rules:
- id: npm-postinstall-curl-ngrok-callback
  desc: npm postinstall makes a curl request to an ngrok tunnel
  conf: 0.97
  attack: T1041
  scope: archive
  for:
  - npm
  - package.json
  all:
  - id: micro-behaviors/communications/http/curl/command::npm-postinstall-curl
  - id: micro-behaviors/communications/url/host/name::ngrok-free-domain
