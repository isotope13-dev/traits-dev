defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1041
traits:
- id: npm-postinstall-xyzcollab-rce-test
  desc: Postinstall sends RCE test callback
  crit: hostile
  conf: 0.99
  if:
    type: value
    path: scripts.postinstall
    regex: ^\s*curl\s+https?://[a-z0-9-]+\.xyzcollab\.com/ping\?user=rce-test\s*$
