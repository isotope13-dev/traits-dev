defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  attack: T1195.002,T1071.001
traits:
- id: js-install-webhook-host
  desc: Configures webhook callback host
  crit: notable
  for:
  - javascript
  if:
    type: text
    regex: hostname:\s*["']webhook\.site["']
composite_rules:
- id: npm-airbnb-depconf-install-webhook
  desc: Install sends Airbnb dependency confusion beacon
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/exfiltration/oob/callback/request::js-airbnb-depconf-marker
  - id: objectives/exfiltration/oob/callback/http-post::js-install-webhook-host
  - id: objectives/exfiltration/oob/callback/request::js-install-package-env
  - id: objectives/exfiltration/oob/callback/request::js-install-https-options-request
