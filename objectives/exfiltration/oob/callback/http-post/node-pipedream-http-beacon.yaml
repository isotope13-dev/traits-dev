defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1041,T1195.002
  mbc: E1041
composite_rules:
- id: npm-install-pipedream-hostname-query-exfil
  desc: npm install sends the machine hostname to Pipedream
  crit: hostile
  conf: 0.99
  for:
  - npm
  - zip
  - package.json
  - javascript
  scope: package
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: metadata/import/npm/requests::requests
  - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
  - id: micro-behaviors/communications/url/construction/build-http::http-url-template-literal
  - id: micro-behaviors/communications/url/host/oob/endpoint::pipedream-requestbin-host
