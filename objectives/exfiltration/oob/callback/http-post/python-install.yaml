defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
traits:
- id: python-dependency-confusion-execution-proof-marker
  desc: Dependency-confusion install proof marker
  crit: hostile
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: '["\x27]proof["\x27]\s*:\s*["\x27][^"\x27]{0,80}(dependency.confusion|canary.executed)'
composite_rules:
- id: python-setup-module-oob-webhook-callback
  desc: setup.py makes an unsolicited module-scope request to an OOB webhook
  crit: hostile
  conf: 0.97
  attack: T1041,T1195.002
  scope: outer
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/url/host/oob/callback-url::webhook-site-url-literal
- id: python-setup-environment-json-webhook-exfil
  desc: setup.py sends the installer environment to an OOB webhook
  crit: hostile
  conf: 0.98
  attack: T1041,T1082,T1195.002
  scope: outer
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-dict
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/communications/http/client/initialize::python-urlopen-oob-target
  - id: micro-behaviors/communications/http/request/oob::webhook-site-source-call
- id: python-setup-dependency-confusion-proof-callback
  desc: setup.py reports dependency-confusion execution
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1041
  scope: outer
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  - id: micro-behaviors/communications/http/request/json::python-urllib-json-body-urlopen
  - id: micro-behaviors/communications/http/request/verb::python-post-method-keyword
  - id: python-dependency-confusion-execution-proof-marker
