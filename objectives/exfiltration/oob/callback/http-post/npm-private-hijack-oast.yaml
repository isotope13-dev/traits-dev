defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002,T1071.001
traits:
- id: npm-oast-postinstall-curl
  desc: Calls OAST endpoint on installation
  crit: notable
  if:
    type: value
    path: scripts.postinstall
    regex: ^\s*curl\s+https?://[a-z0-9-]{12,63}\.oast\.(me|fun)(/[^ ]*)?\s*$
composite_rules:
- id: npm-private-hijack-oast-callback
  desc: Private package hijack proof calls OAST
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/exfiltration/oob/callback/request::npm-private-hijack-description
  - id: objectives/exfiltration/oob/callback/http-post::npm-oast-postinstall-curl
