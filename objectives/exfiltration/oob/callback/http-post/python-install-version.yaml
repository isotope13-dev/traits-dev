defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-install-webhook-version-post
    desc: Install posts Python version to webhook
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @base)
          body: (block (function_definition name: (identifier) @run body: (block
            (expression_statement (assignment left: (identifier) @urlvar right: (string) @url))
            (expression_statement (assignment left: (identifier) @payload right: (dictionary) @data))
            (try_statement body: (block
              (expression_statement (assignment right: (call
                function: (attribute object: (identifier) @requests attribute: (identifier) @post)
                arguments: (argument_list (identifier) @urluse
                  (keyword_argument name: (identifier) @json value: (identifier) @payloaduse)))))))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @cmdclass
              value: (dictionary (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @base "install") (#eq? @run "run")
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#eq? @hook @registered)
          (#match? @installkey "^.install.$")
          (#eq? @requests "requests") (#eq? @post "post") (#eq? @json "json")
          (#eq? @urlvar @urluse) (#eq? @payload @payloaduse)
          (#match? @url "https?://webhook[.]site/")
          (#match? @data "sys[.]version") (#match? @data "install"))

composite_rules:
  - id: python-install-webhook-version-callback
    desc: Install hook posts Python version and event to webhook.site
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    scope: file
    all:
      - id: python-install-webhook-version-post
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
