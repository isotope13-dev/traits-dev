defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-install-caesar-canarytokens-identity-beacon
  desc: Install hook sends user identity to shifted CanaryTokens URL
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002,T1033
  scope: archive
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/data/arithmetic::python-chr-ord-shift-generator
  - id: micro-behaviors/communications/url/host/oob/encoded::caesar-three-canarytokens-domain
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference

- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-install-hook-requestrepo-curl-callback
  desc: Install hook contacts an OOB request collector with curl
  crit: hostile
  conf: 0.98
  attack: T1041,T1195.002
  scope: outer
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/communications/url/host/oob/endpoint::requestrepo
