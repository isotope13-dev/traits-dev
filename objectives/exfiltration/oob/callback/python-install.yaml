  conf: 0.98
  attack: T1041,T1082,T1195.002
  scope: outer
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: micro-behaviors/data/serialize/json::python-environ-json
  - id: micro-behaviors/communications/http/client/initialize::python-urlopen-oob-target
  - id: micro-behaviors/communications/http/request/oob::webhook-site-source-call
- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-setup-hook-download-write-and-execute-discord-cdn
  desc: setup hook downloads and executes a Discord-hosted Python payload
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.006,T1195.002
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/download/write::python-response-content-binary-write
  - id: micro-behaviors/process/create/subprocess/launch::check-call-ast
  - id: micro-behaviors/process/info/current::python-sys-executable-text
