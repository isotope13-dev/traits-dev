defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-install-hook-urlopen-oob
  desc: Install hook sends OOB HTTP callback
  crit: hostile
  conf: 0.96
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/http/client/initialize::python-urlopen-oob-target
  unless:
  - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
  - id: metadata/file/profile/source-indications::python-triple-quoted-module
- for:
  - python
  attack: T1048.003
  id: python-import-install-dns-oob-callback
  desc: Import/install context with OOB DNS callback
  conf: 0.9
  mbc: E1041
  all:
  - id: objectives/supply-chain/recon-exfil/import-time::runs-at-import-or-install
  - id: micro-behaviors/communications/dns/resolver::python-oob-dns-name-argument
- id: python-silent-oob-dns-callback
  desc: Silently resolves an OOB callback hostname
  conf: 0.95
  for: [python]
  attack: T1048.003
  all:
  - id: micro-behaviors/communications/dns/resolver::python-oob-dns-name-argument
  - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
  unless:
  - id: well-known/tool/offensive/
