  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-egg-info
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-develop

- for:
  - python
  - python-sdist
  - whl
  - tar
  - zip
  id: python-setup-module-oob-webhook-callback
