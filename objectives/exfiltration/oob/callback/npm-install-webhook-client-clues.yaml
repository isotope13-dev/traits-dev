defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: install-webhook-client-clues
  desc: Install webhook and client clues
  crit: suspicious
  conf: 0.99
  attack: "T1195.002, T1041"
  mbc: "E1041"
  all:
  - id: metadata/package/scripts/lifecycle::has-install-script
  - id: micro-behaviors/communications/url/host/oob/endpoint::install-webhook-site-url
  any:
  - id: metadata/package/scripts/command::npm-lifecycle-node-inline-reference
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: metadata/package/scripts/reference::npm-install-curl-reference
