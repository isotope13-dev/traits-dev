defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: disclosed-security-research-bin-oast-exfil
    desc: Research-disclosed npm bin exfiltrates to OAST
    crit: hostile
    conf: 0.97
    attack: "T1195.002"
    mbc: "E1041"
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: metadata/package/description/disclosure::claims-security-research
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: objectives/exfiltration/stealer/system-info/hostname::js-hostname-json-oob-post-clues
