defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-oast-fun-stdin-exfil
  desc: Postinstall OAST request and local clues
  crit: suspicious
  conf: 0.98
  attack: T1041,T1048.003
  all:
  - id: micro-behaviors/communications/url/host/oob/package::manifest-oast-fun-reference
  - id: micro-behaviors/communications/http/curl/body::curl-stdin-body-post
  any:
  - id: micro-behaviors/fs/path/temp::postinstall-temp-path
  - id: micro-behaviors/fs/path/token::serviceaccount-token-read
  - id: micro-behaviors/fs/path/config/cloud::hostroot-kube-recon
  - id: micro-behaviors/fs/device::mknod-virtio-block
