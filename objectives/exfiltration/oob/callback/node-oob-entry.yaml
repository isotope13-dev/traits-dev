# A published module that calls an OOB collector as it loads is an execution
# probe on the endpoint. A research disclaimer does not remove the callback.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-module-body-oob-get
    desc: Module-level HTTP GET targets an OOB collector
    crit: suspicious
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '\.get$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
      arg:
        index: 0
        from:
          # A contributing literal is insufficient: a later concatenation
          # can change the actual host. Require a complete resolved URL.
          whole_value: '^https?://[a-zA-Z0-9.-]+[.](oast[.](fun|pro|live|site|online|me)|interactsh[.]com|burpcollaborator[.]net)(:[0-9]+)?([/?#]|$)'
composite_rules:
  # The package contains the beacon; package scope does not bind it to main.
  - id: published-tiny-node-package-oob-beacon
    desc: Tiny npm package contains a module-level OOB beacon
    crit: hostile
    conf: 0.98
    attack: T1071.001
    for: [npm, tar, package.json, javascript]
    scope: package
    size_max: 4096
    all:
      - id: node-module-body-oob-get
      - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
    any:
      - id: metadata/import/builtin::require-http
      - id: metadata/import/builtin::require-https
      - id: metadata/import/builtin::node-prefixed-http-require
      - id: metadata/import/builtin::node-prefixed-https-require
