defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-install-class-literal-tcp-greeting
    desc: Install class sends literal TCP greeting
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((class_definition superclasses: (argument_list (identifier) @parent)
          body: (block (function_definition name: (identifier) @run body: (block
            (try_statement body: (block
              (expression_statement (assignment left: (identifier) @ip right: (string) @ip_literal))
              (expression_statement (assignment left: (identifier) @port right: (integer)))
              (expression_statement (assignment left: (identifier) @message right: (string)))
              (expression_statement (assignment left: (identifier) @address right: (tuple (identifier) @ip2 (identifier) @port2)))
              (expression_statement (assignment left: (identifier) @sock right: (call function: (attribute object: (identifier) @socket attribute: (identifier) @constructor))))
              (expression_statement (call function: (attribute object: (identifier) @sock2 attribute: (identifier) @connect)
                arguments: (argument_list (identifier) @address2)))
              (try_statement body: (block (expression_statement (call
                function: (attribute object: (identifier) @sock3 attribute: (identifier) @send)
                arguments: (argument_list (call function: (attribute object: (identifier) @message2 attribute: (identifier) @encode)))))))))))))
          (#eq? @parent "install") (#eq? @run "run")
          (#eq? @ip @ip2) (#eq? @port @port2) (#eq? @address @address2)
          (#eq? @socket "socket") (#eq? @constructor "socket")
          (#eq? @sock @sock2) (#eq? @sock @sock3) (#eq? @connect "connect") (#eq? @send "sendall")
          (#eq? @message @message2) (#eq? @encode "encode")
          (#match? @ip_literal "[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+")
          (#not-match? @ip_literal "['\"](127[.]|10[.]|192[.]168[.]|169[.]254[.]|0[.])")
          (#not-match? @ip_literal "['\"]172[.](1[6-9]|2[0-9]|3[01])[.]"))

composite_rules:
  - id: python-install-public-tcp-greeting
    desc: Install hook sends greeting to external IP
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1071
    scope: file
    all:
      - id: python-install-class-literal-tcp-greeting
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
