defaults:
  platforms: [unix, windows]
  crit: hostile

composite_rules:
- id: npm-postinstall-curl-ngrok-callback
  desc: npm postinstall makes a curl request to an ngrok tunnel
  conf: 0.97
  attack: T1041
  scope: archive
  for: [npm, package.json]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/curl::npm-postinstall-curl
  - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: dependency-confusion-postinstall-ngrok-beacon
  desc: Dependency-confusion install callback to ngrok
  conf: 0.98
  attack: T1195.002,T1041
  scope: archive
  for: [npm, package.json, javascript]
  all:
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/get::node-https-get-text
  - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
  unless:
  - id: metadata/package/testing/harness/runtime/
