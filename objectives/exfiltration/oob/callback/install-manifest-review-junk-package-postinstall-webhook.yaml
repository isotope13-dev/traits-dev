defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: junk-package-postinstall-webhook
    desc: Sparse npm package sends install callback to webhook.site
    crit: hostile
    conf: 0.99
    attack: "T1195.002, T1041"
    mbc: "E1041"
    all:
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: objectives/exfiltration/oob/callback::postinstall-webhook-inline-clues
    any:
      - id: metadata/package/scripts/develop::npm-init-default-test
      - id: metadata/package/description/presence::short-description
      - id: metadata/package/empty::npm-empty-description-any
      - id: metadata/package/empty::npm-no-keywords
    needs: 2
