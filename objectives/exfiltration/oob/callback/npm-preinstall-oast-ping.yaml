defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: npm-preinstall-oast-callback-probe
    desc: npm preinstall sends an OAST callback
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1071.001
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/network::preinstall-oast-domain
      - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
