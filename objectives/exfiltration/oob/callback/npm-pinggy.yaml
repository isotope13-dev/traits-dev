defaults:
  platforms: [unix, windows]
  crit: hostile
composite_rules:
  - id: npm-postinstall-pinggy-https-callback
    desc: npm postinstall sends an HTTPS callback to a Pinggy tunnel
    conf: 0.98
    attack: T1195.002,T1041
    scope: archive
    for: [npm, package.json, javascript]
    all:
      - id: micro-behaviors/communications/http/request/inline::npm-postinstall-https-get
      - id: micro-behaviors/communications/url/host/name::pinggy-free-tunnel-domain
