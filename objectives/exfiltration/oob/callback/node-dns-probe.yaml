defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-load-time-dns-host-profile-exfil
    desc: Exfiltrates a host profile through DNS queries
    crit: hostile
    conf: 0.99
    size_max: 8192
    attack: T1041,T1071.004,T1033,T1082
    all:
      - id: micro-behaviors/communications/dns/label::node-module-load-dns-template-subdomain
      - id: micro-behaviors/communications/dns/resolver::node-module-load-dns-request
      - id: micro-behaviors/communications/url/host/oob/endpoint::canarytokens-service-reference
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  # The DNS request is real even when the separately constructed host/network
  # string is unused. Report an execution callback, never host-data exfiltration.
  - id: node-load-time-host-inventory-dns-probe
    desc: Load-time DNS callback with host inventory
    crit: hostile
    conf: 0.98
    size_max: 8192
    scope: file
    all:
      - id: micro-behaviors/communications/dns/resolver::node-module-load-dns-request
      - id: metadata/package/documentation/disclosure::dns-callback-confirmation-log
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/network/interface/query::node-network-interfaces-call
