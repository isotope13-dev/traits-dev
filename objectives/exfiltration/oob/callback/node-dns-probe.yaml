defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # The DNS request is real even when the separately constructed host/network
  # string is unused. Report an execution callback, never host-data exfiltration.
  - id: node-load-time-host-inventory-dns-probe
    desc: Load-time DNS callback with host inventory
    crit: hostile
    conf: 0.98
    size_max: 8192
    scope: file
    all:
      - id: micro-behaviors/communications/dns/resolver::node-module-load-dns-request
      - id: metadata/package/documentation/disclosure::dns-callback-confirmation-log
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/network/interface::node-network-interfaces-call
