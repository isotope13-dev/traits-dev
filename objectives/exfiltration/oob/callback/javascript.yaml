defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1048
  mbc: B0030

composite_rules:
- id: browser-oob-encoded-navigation
  desc: Browser sends URL-encoded data to OOB collector
  crit: hostile
  conf: 0.97
  attack: T1041
  mbc: E1041
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  any:
  - id: micro-behaviors/ui/window/navigation::browser-external-redirect
  - id: micro-behaviors/ui/window/navigation::browser-window-open-external-url
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/tool/detection/

- id: node-messaging-inventory-oob-exfil
  desc: Sends messaging file and environment inventory to an OOB sink
  crit: hostile
  conf: 0.995
  attack: T1005,T1041
  mbc: E1005,E1041
  near_bytes: 4096
  all:
  - id: objectives/collection/file-targeting/filter::messaging-file-root-sweep
  - id: micro-behaviors/os/env/read::js-filtered-env-copy
  - id: micro-behaviors/communications/url/http-query::js-file-variable-lists-query-payload
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/tool/detection/security-scanner/

# Whole-environment harvest shipped to an OOB collection service. The OOB
# services in the union are temporary inspection endpoints with no production
# use; enumerating every environment entry into a POST body aimed at one is
# credential/environment exfiltration, not application telemetry.
- id: node-env-dump-oob-webhook-post
  desc: Environment enumerated and POSTed to an OOB collector
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1041
  mbc: E1041
  near_bytes: 2000
  all:
  - id: micro-behaviors/os/env/enumerate::node-process-env-enumeration
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/result::http-post-method
  unless:
  - id: metadata/package/testing/harness/runtime/

# System-root content-sweep results shipped to an OOB collection service: an
# install-time harvester reports which files match its content predicate. The
# sweep alone is a dual-use admin task; the OOB POST sink is the theft.
- id: node-content-sweep-oob-webhook-post
  desc: Content-sweep results POSTed to an OOB collector
  crit: hostile
  conf: 0.97
  attack: T1005,T1041
  mbc: E1005,E1041
  near_bytes: 2500
  all:
  - id: micro-behaviors/fs/search/content::grep-content-multi-system-root-sweep
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/result::http-post-method
  unless:
  - id: metadata/package/testing/harness/runtime/
