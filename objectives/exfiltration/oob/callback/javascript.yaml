defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1048
  mbc: B0030

composite_rules:
  # A browser navigation to an OOB collector with a URL-encoded value is an
  # outbound data channel, not an ordinary sign-in or link redirect.  Keep
  # the source of the value separate so credential, response-body, and other
  # exfiltration objectives can refine this transport without duplicating its
  # matchers.
  - id: browser-oob-encoded-navigation
    desc: Browser sends URL-encoded data to OOB collector
    crit: hostile
    conf: 0.97
    attack: T1041
    mbc: E1041
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/ui/window/navigation::browser-external-redirect
      - id: micro-behaviors/ui/window/navigation::browser-window-open-external-url
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/

  - id: node-messaging-inventory-oob-exfil
    desc: Sends messaging file and environment inventory to an OOB sink
    crit: hostile
    conf: 0.995
    attack: T1005,T1041
    mbc: E1005,E1041
    near_bytes: 4096
    all:
      - id: objectives/collection/file-targeting/filter::messaging-file-root-sweep
      - id: micro-behaviors/os/env/read::js-filtered-env-copy
      - id: micro-behaviors/communications/http/url/query::js-file-variable-lists-query-payload
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
  - id: small-javascript-oob-contact
    desc: Small JavaScript file contacts an OOB service
    crit: suspicious
    conf: 0.95
    all:
    - id: micro-behaviors/communications/url/host::interact-sh-me-fun
    - id: metadata/file/size::javascript-small-file-5k
    unless:
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/file/policy/disclosure::disclosed-vscode-research-canary

  # Dependency-confusion interaction beacons often stop at a DNS lookup plus a
  # GET-shaped HTTPS callback (package name in the subdomain or path) without
  # collecting hostname, cwd, or environment variables.
  - id: javascript-oob-dns-https-interaction
    desc: Node OAST DNS lookup and HTTPS GET callback
    crit: hostile
    conf: 0.97
    attack: T1048,T1071.001
    mbc: E1041
    for: [javascript, typescript]
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/communications/dns/resolver::require-dns-inline-lookup
      - id: micro-behaviors/communications/http/request/client::node-https-get-dynamic
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/

