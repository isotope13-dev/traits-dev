defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1048
  mbc: B0030

composite_rules:
  - id: node-messaging-inventory-oob-exfil
    desc: Sends messaging file and environment inventory to an OOB sink
    crit: hostile
    conf: 0.995
    attack: T1005,T1041
    mbc: E1005,E1041
    near_bytes: 4096
    all:
      - id: objectives/collection/file-targeting/filter::messaging-file-root-sweep
      - id: micro-behaviors/os/env/access::js-filtered-env-copy
      - id: micro-behaviors/communications/http/url/query::js-file-variable-lists-query-payload
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
  - id: small-javascript-oob-contact
    desc: Small JavaScript file contacts an OOB service
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/exfiltration/oob/endpoint::interact-sh-me-fun
      - id: metadata/file/metrics::javascript-small-file-5k
    unless:
      - id: metadata/package/testing/harness/runtime/
