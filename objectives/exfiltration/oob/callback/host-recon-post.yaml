# Host identity POSTed to an out-of-band callback service.
#
# The recon is ordinary on its own -- hostname, login name, platform, working
# directory, CI variables, a public-IP lookup and a geolocation call are all
# things a diagnostic reports. What settles it is where the report goes. An
# oastify.com, interact.sh or burpcollaborator.net hostname belongs to
# whoever generated it; nothing resolves there for the package's own benefit,
# and no diagnostic sends its findings to a name a stranger minted an hour ago.
#
# Ruby here, but the legs are language-neutral on purpose: the same package
# published to npm or PyPI differs only in which HTTP client it reaches for.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1041,T1082,T1590
  mbc: C0011

composite_rules:
  - id: oob-service-http-host-recon
    desc: POSTs host and CI identity to an OOB service
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/post/
    any:
      - id: micro-behaviors/os/sysinfo/hostname/
      - id: micro-behaviors/os/env/cicd/
      - id: micro-behaviors/communications/http/ip-discovery/
      - id: micro-behaviors/process/user/query/
    needs: 2
