# Language-portable counterpart to the Android/Java relay detection. Requiring
# authenticated encryption, local staging, multiple proximity transports, and
# HTTP egress captures the reported store-and-forward shape without relying on
# family names, package IDs, prose, or a particular Bluetooth service UUID.
defaults:
  platforms: [unix, windows, android]
  for: [python]
  attack: T1011,T1048,T1573.001

composite_rules:
  - id: python-encrypted-multiradio-relay-with-http-egress
    desc: Combines AES-GCM staging, multiradio peer routing, and HTTP upload
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/fs/file/open::write-append-create-mode
      - id: micro-behaviors/hardware/wireless/network::python-multiradio-peer-routing
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    near_lines: 140
