# Store-and-forward exfiltration through nearby Android peers. These rules
# describe the technique rather than a family: encrypted sensitive records are
# queued locally and moved across several proximity radios to an Internet peer.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1048,T1573.001

composite_rules:
  - id: android-encrypted-multiradio-data-exfiltration
    desc: Exfiltrates encrypted SMS records through nearby peers with HTTP fallback
    crit: hostile
    conf: 0.985
    all:
      - id: objectives/collection/messaging/sms::android-source-sms-inbox-query
      - id: micro-behaviors/crypto/symmetric/aes/mode::java-aes-gcm-mode
      - id: micro-behaviors/hardware/wireless/network::android-multiradio-peer-transfer
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
    near_lines: 140

  - id: android-store-and-forward-peer-exfiltration
    desc: Queues encrypted SMS records and relays peer data to an HTTP uplink
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/collection/messaging/sms::android-source-sms-inbox-query
      - id: micro-behaviors/crypto/symmetric/aes/mode::java-aes-gcm-mode
      - id: micro-behaviors/fs/write/file/direct::java-fileoutputstream-source
      - id: micro-behaviors/hardware/wireless/network::android-multiradio-peer-relay
      - id: micro-behaviors/communications/http/post::jvm-http-body-write-source
    near_lines: 140
