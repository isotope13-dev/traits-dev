defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: suspicious-interactsh-usage
    desc: Interactsh endpoint paired with reconnaissance capability
    crit: suspicious
    scope: file
    near_lines: 200
    all:
      - id: micro-behaviors/communications/url/host::interact-sh
    any:
      - id: objectives/discovery/system/fingerprint/hardware::js-sysinfo-multi
      - id: micro-behaviors/fs/enumerate/directory::fs-readdir
      - id: micro-behaviors/fs/path/drive-root::hardcoded-windows-root
      - id: micro-behaviors/data/encode/hex::buffer-hex
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
