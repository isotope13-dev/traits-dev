defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript, go]
composite_rules:
  - id: go-oob-account-profile-exfil
    desc: Go sends an account profile to an OOB callback
    crit: hostile
    conf: 0.99
    attack: "T1041,T1082"
    mbc: E1041
    all:
      - id: objectives/exfiltration/stealer/system-info::go-account-workdir-profile
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/communications/http/post::http-post-methods
    near_bytes: 3200

  - id: javascript-oob-hostname-http-proximity
    desc: JavaScript accesses hostname near an OOB endpoint and HTTP request
    crit: hostile
    conf: 0.98
    attack: "T1048,T1082"
    mbc: E1041
    all:
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
    any:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
      - id: micro-behaviors/communications/http/request/computed-url::node-https-get-concatenated-url
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
    near_bytes: 1024
  - id: javascript-oob-hostname-http-fallback
    desc: OOB hostname beacon has HTTP fallback
    crit: hostile
    conf: 0.96
    attack: "T1048,T1071.001,T1082"
    mbc: E1041
    all:
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
    near_bytes: 2048
  - id: oast-system-info-exfil
    desc: System info exfiltration to OAST callback
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/user/query::whoami-cmd
      - id: objectives/supply-chain/trojanized/library/framework::oast-str
  - id: oast-system-info-exfil-encoded-loader
    desc: Encoded staged JS loader with OAST callback exfil objective
    crit: hostile
    conf: 0.96
    attack: T1048
    mbc: E1041
    all:
      - id: objectives/command-and-control/dropper/obfuscated::nested-hex-base64-dropper
      - id: objectives/exfiltration/oob/endpoint::oast-fun-b64-hexwrapped
