defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript, go]
composite_rules:
  - id: go-oob-account-profile-exfil
    # go-account-workdir-profile (objectives/exfiltration/stealer/system-info)
    # is for: [go] only. `typescript` resolves to the same underlying
    # JavaScript FileType, which that leg does not cover, so it was
    # ft-impossible on JavaScript -- and every other leg here is Go-specific
    # too (go-json-marshal), confirming `typescript` was never intended.
    desc: Go sends an account profile to an OOB callback
    for: [go]
    conf: 0.99
    attack: "T1041,T1082"
    mbc: E1041
    all:
      - id: objectives/discovery/system/fingerprint/user::go-account-workdir-profile
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/communications/http/post::http-post-methods
    near_bytes: 3200

  - id: javascript-oob-hostname-http-proximity
    desc: JavaScript accesses hostname near an OOB endpoint and HTTP request
    conf: 0.98
    attack: "T1048,T1082"
    mbc: E1041
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
    any:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-variable
      - id: micro-behaviors/communications/http/request/url-computed::node-https-get-concatenated-url
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
      - id: micro-behaviors/communications/http/download/cli::curl-wget-command
    near_bytes: 1024
    unless:
      - id: metadata/file/policy/disclosure::disclosed-vscode-research-canary
      # JSON POST objectives describe the completed transport more precisely.
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
  - id: js-oob-curl-base64-host-recon
    desc: Base64 host recon POSTed by curl to OOB
    conf: 0.98
    attack: "T1041,T1082,T1033"
    mbc: E1041
    for: [javascript, typescript]
    all:
      - id: objectives/discovery/system/fingerprint/runtime::js-shell-host-identity-recon-chain
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: javascript-oob-hostname-http-fallback
    desc: OOB hostname beacon has HTTP fallback
    for: [javascript, typescript]
    conf: 0.96
    attack: "T1048,T1071.001,T1082"
    mbc: E1041
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
      - id: micro-behaviors/communications/http/url/domain::js-insecure-remote-http-url
    near_bytes: 2048
    unless:
      - id: metadata/file/policy/disclosure::disclosed-vscode-research-canary
  - id: oast-system-info-exfil
    desc: System info exfiltration to OAST callback
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/process/user/query::whoami-exec-argument
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: oast-system-info-exfil-encoded-loader
    desc: Encoded staged JS loader with OAST callback exfil objective
    for: [javascript, typescript]
    conf: 0.96
    attack: T1048
    mbc: E1041
    all:
      - id: objectives/command-and-control/dropper/obfuscated::nested-hex-base64-dropper
      - id: micro-behaviors/communications/url/host::oast-fun-b64-hexwrapped
  - id: js-execsync-fetch-command-output-exfil
    desc: execSync output encoded into fetch callback URL
    for: [javascript, typescript]
    conf: 0.995
    attack: T1041,T1059.004,T1082
    mbc: E1041
    scope: file
    near_bytes: 2500
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    any:
      - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
      - id: micro-behaviors/fs/path/config/system::config-hosts
      - id: micro-behaviors/process/user/query::node-shell-id-command
    needs: 1
    unless:
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
      - id: well-known/lib/ui/wix::wix-thunderbolt-registry-api-surface
  - id: npm-module-load-execsync-fetch-exfil
    desc: npm package module execSync fetch exfiltration
    for: [npm, tar, zip, javascript, package.json]
    conf: 0.995
    attack: T1195.002,T1041,T1059.004
    mbc: E1041
    scope: archive
    all:
      - id: js-execsync-fetch-command-output-exfil
    any:
      - id: micro-behaviors/os/module/dynamic-load::module-constructor-access
      - id: metadata/package/placeholder::tiny-commonjs-exports-object
    needs: 1
    unless:
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
      - id: metadata/package/files/package-json::files-thunderbolt-registry-js
  - id: npm-module-sandbox-escape-execsync-exfil
    desc: npm module escapes require sandbox then execSync exfils
    for: [npm, tar, zip, javascript, package.json]
    conf: 0.995
    attack: T1195.002,T1059.004,T1041
    mbc: E1041
    scope: archive
    all:
      - id: js-execsync-fetch-command-output-exfil
      - id: micro-behaviors/os/module/dynamic-load::module-constructor-access
    unless:
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
      - id: metadata/package/files/package-json::files-thunderbolt-registry-js
