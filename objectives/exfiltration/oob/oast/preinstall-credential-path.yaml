# Install hook, credential-path and OOB POST clues in a package.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
  attack: T1041
  mbc: E1041
composite_rules:
  - id: preinstall-js-shadow-oast-post-exfil
    desc: Preinstall OOB POST and credential path clues
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/body/construction::request-end-call
      - id: micro-behaviors/fs/path/credential::authorized-keys-or-shadow-path
