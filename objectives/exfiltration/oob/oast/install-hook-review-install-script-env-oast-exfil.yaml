defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-env-oast-exfil
    desc: Install-named script has environment reporting and OAST callback clues
    crit: hostile
    conf: 0.99
    attack: T1195.002, T1552.001, T1041
    mbc: E1041
    scope: leaf
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/os/env/read/collection::named-script-env-report-cooccurrence
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
    any:
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/dns/oob::node-oastify-dns-callback
      - id: objectives/exfiltration/stealer/file::oob-endpoint-file-exfil
