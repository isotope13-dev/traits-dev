defaults:
  platforms:
  - unix
  for:
  - javascript
  attack: T1005,T1041,T1083
traits:
- id: node-ctf-ngrok-endpoint
  desc: Uses an ngrok webhook endpoint
  crit: notable
  if:
    type: text
    substr: .ngrok-free.app
- id: node-ctf-ngrok-home-recon
  desc: Recursively inventories home directories
  crit: suspicious
  if:
    type: text
    substr: ls -laR /home 2>/dev/null | head -n 400
- id: node-ctf-ngrok-archive-target
  desc: Searches targeted CTF archive
  crit: suspicious
  if:
    type: text
    substr: /home/node/aspect-node.tar.gz
composite_rules:
- id: node-ctf-ngrok-flag-collection
  desc: Posts CTF flag search results to ngrok
  crit: hostile
  conf: 0.99
  all:
  - id: node-ctf-ngrok-endpoint
  - id: micro-behaviors/communications/http/post::request-options-post-method
  - id: micro-behaviors/communications/http/request/lifecycle::node-request-end-call
  any:
  - id: micro-behaviors/fs/path/sensitive::node-ctf-root-flag-path
  - id: node-ctf-ngrok-home-recon
  - id: node-ctf-ngrok-archive-target
