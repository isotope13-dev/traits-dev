defaults:
  platforms: [unix, windows, android, ios]
  for: [zip, npm, tar, package.json, javascript]
  attack: T1071.001,T1598

traits:
  - id: npm-consumerweb-config-name
    desc: Identifies consumer web configuration package
    crit: notable
    for: [package.json]
    if:
      type: value
      path: name
      exact: consumerweb-config
  - id: browser-oast-hidden-image-create
    desc: Creates hidden browser image beacon
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'document.createElement("img"); b.style.visibility="hidden"'
  - id: browser-oast-test-image-url
    desc: References OAST test image endpoint
    crit: suspicious
    for: [javascript]
    if:
      type: text
      regex: 'b\.src="https?://[^" ]{1,128}\.oast\.(site|me)/test\.jpg"'
  - id: browser-oast-hidden-image-append
    desc: Appends browser image beacon to document
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'document.body.appendChild(b)'

composite_rules:
  - id: browser-consumerweb-hidden-oast-beacon
    desc: Tracks browser loads via concealed OAST image
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: npm-consumerweb-config-name
      - id: browser-oast-hidden-image-create
      - id: browser-oast-test-image-url
      - id: browser-oast-hidden-image-append
