---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1048.003,T1033,T1082
  mbc: E1041
traits:
- id: node-curl-id-command-substitution
  desc: Curl command embeds identity command output
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: "(?i)curl\\s+`[^`]{0,180}(whoami|id)[^`]{0,180}`"
- id: node-curl-host-profile-url-fields
  desc: OAST URL embeds hostname and working directory
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: oast\.fun[^\n]{0,500}`hostname`[^\n]{0,120}`pwd`
composite_rules:
- id: node-curl-command-substitutes-host-profile-to-oast
  desc: Curl substitutes host identity into OAST URL
  crit: suspicious
  conf: 0.99
  near_bytes: 1000
  all:
  - id: node-curl-id-command-substitution
  - id: node-curl-host-profile-url-fields
- id: node-curl-backtick-host-profile-oast-exfil
  desc: Sends command-collected host identity to OAST through curl
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: micro-behaviors/communications/url/host/oob/endpoint::oast-fun-domain
  - id: node-curl-command-substitutes-host-profile-to-oast
