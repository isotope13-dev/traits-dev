defaults:
  platforms: [unix, windows]
  for: [data, manifests]
composite_rules:
  - id: npm-preinstall-oob-exfil
    desc: Preinstall curl, OOB and passwd-path clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/curl/body::preinstall-curl-exfil
    any:
      - id: metadata/package/scripts/reference::preinstall-oob-callback
      - id: micro-behaviors/communications/http/curl/body::passwd-exfil
    needs: 2

