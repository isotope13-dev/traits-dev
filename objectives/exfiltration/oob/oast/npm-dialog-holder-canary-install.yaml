defaults:
  platforms:
  - unix
  - windows
  attack: T1195.002,T1071.004
traits:
- id: npm-dialog-holder-test-update-hook
  desc: Runs test update script after installation
  crit: notable
  for:
  - package.json
  if:
    type: value
    path: scripts.postinstall
    exact: node ./test/update.js
composite_rules:
- id: npm-dialog-holder-install-canary-beacon
  desc: Resolves canary host during installation
  crit: hostile
  conf: 0.99
  scope: archive
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  all:
  - id: npm-dialog-holder-test-update-hook
  - id: micro-behaviors/communications/dns/lookup::dns-lookup-resolve-api-reference
  - id: micro-behaviors/communications/url/host/oob/endpoint::canarytokens-bare-host
