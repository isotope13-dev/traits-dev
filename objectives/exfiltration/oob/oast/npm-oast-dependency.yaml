defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002,T1071.004

traits:
  - id: npm-oast-required-dependency
    desc: Resolves required dependency from OAST host
    crit: hostile
    conf: 0.99
    if:
      type: value
      path: dependencies.*
      regex: 'https?://[^/]{1,150}\.(oast\.fun|oastify\.com)(/|$)'
  - id: npm-oast-optional-dependency
    desc: Resolves optional dependency from OAST host
    crit: hostile
    conf: 0.99
    if:
      type: value
      path: optionalDependencies.*
      regex: 'https?://[^/]{1,150}\.(oast\.fun|oastify\.com)(/|$)'

