defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
composite_rules:
  - id: curl-d-oast-fun-envdump-exfil
    desc: Preinstall curl POSTs env/npmrc to oast.fun
    crit: hostile
    conf: 0.999
    attack: T1041
    mbc: E1041
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: micro-behaviors/communications/url/host/oob/package::manifest-oast-fun-reference
      - id: micro-behaviors/communications/http/curl/body::manifest-curl-data-body-text
    any:
      - id: objectives/credential-access/dev-tools/package-registry::npmrc-credential-read
      - id: micro-behaviors/os/env/enumerate::shell-env-dump
      - id: micro-behaviors/communications/url/construction/query::url-query-whoami-subshell

