defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1082

traits:
  - id: node-speed-oast-download-host
    desc: Constructs OAST download host from local data
    crit: suspicious
    if:
      type: text
      substr: '.depenconf7.download.uec5zy65d3g3mcjtdqpg9zr9f0ly9pxe.oastify.com'
  - id: node-speed-local-ipv4
    desc: Collects local IPv4 addresses
    crit: notable
    if:
      type: text
      substr: "getIp('IPv4')"
  - id: node-speed-ip-download
    desc: Requests network speed URL with local IP
    crit: notable
    if:
      type: text
      substr: 'getNetworkDownloadSpeed(localip)'

composite_rules:
  - id: node-network-speed-local-ip-oast
    desc: Beacons local IP through OAST download host
    crit: hostile
    conf: 0.99
    all:
      - id: node-speed-oast-download-host
      - id: node-speed-local-ipv4
      - id: node-speed-ip-download
