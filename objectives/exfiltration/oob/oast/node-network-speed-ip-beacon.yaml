defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1041,T1082

traits:
  - id: node-speed-oast-download-host
    desc: Builds an OAST host from a variable
    crit: suspicious
    if:
      type: text
      regex: "\\+\\s*[A-Za-z_$]\\w{0,30}\\s*\\+\\s*['\"][A-Za-z0-9.-]{1,80}\\.oastify\\.com"
  - id: node-speed-ip-download
    desc: Passes IPv4 lookup result to speed check
    crit: notable
    if:
      type: symbol
      kind: call
      exact: getNetworkDownloadSpeed
      arg:
        index: 0
        from:
          call: '^getIp$'
          literal: '^IPv4$'

composite_rules:
  - id: node-network-speed-local-ip-oast
    desc: Combines a local IPv4 network speed request with a dynamic OAST hostname
    crit: hostile
    conf: 0.99
    all:
      - id: node-speed-oast-download-host
      - id: node-speed-ip-download
