defaults:
  platforms: [unix]
  for: [package.json]
  attack: T1005,T1041

traits:
  - id: npm-cw-isdk-file-source
    desc: Reads application manifest or hosts file
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: 'cat /(app/package\.json|etc/hosts)'
  - id: npm-cw-isdk-oast-hosts-query
    desc: Targets OAST callback with hosts query
    crit: suspicious
    if:
      type: value
      path: scripts.preinstall
      substr: 'tvpahnhixsiwkycjnyfb1egmv1mk0nhzu.oast.fun/?hosts='
  - id: npm-cw-isdk-wget
    desc: Uses wget during preinstall
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      substr: 'wget '

composite_rules:
  - id: npm-cw-isdk-encoded-file-oast-query
    desc: Sends encoded local file to OAST on install
    crit: hostile
    conf: 0.99
    all:
      - id: npm-cw-isdk-file-source
      - id: micro-behaviors/data/encoding/base64::preinstall-base64-word
      - id: npm-cw-isdk-oast-hosts-query
      - id: npm-cw-isdk-wget
