defaults:
  platforms: [windows, unix]
  for: [package.json]
composite_rules:
  - id: passwd-oastify-exfil
    desc: Registry metadata exfiltrates passwd to OASTify
    crit: hostile
    conf: 0.999
    attack: "T1041"
    # Flattened onto oastify-recon's own scope/for rather than chaining a
    # leaf-scoped composite over an archive-scoped one.
    scope: archive
    for: [npm, package.json, pkginfo]
    all:
      - id: objectives/exfiltration/oob/system-profile::oastify-recon
      - id: micro-behaviors/fs/read/file/account::passwd-postfield
  - id: curl-oastify-passwd-exfil
    desc: Preinstall curl exfiltrates passwd to OASTify
    crit: hostile
    conf: 0.998
    attack: "T1041"
    scope: archive
    for: [npm, package.json, pkginfo]
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: objectives/supply-chain/impersonation/registry/snapshot::install-hooked-registry-package
      - id: micro-behaviors/communications/http/request/verb::npm-curl-post-text
      - id: micro-behaviors/communications/url/host/oob/package::oastify-url
      - id: micro-behaviors/fs/read/file/account::passwd-file-exfil
    any:
      - id: micro-behaviors/communications/http/curl/body::data-urlencode
      - id: micro-behaviors/communications/http/request/verb::curl-post-ssilent
  - id: node-oastify-config-secret-exfil
    desc: Inline npm hook steals config secrets to OASTify
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    all:
      - id: micro-behaviors/communications/url/host/oob/package::node-oastify-hostname
      - id: micro-behaviors/fs/search/name::node-config-harvest-find
      - id: micro-behaviors/fs/search/content::node-config-harvest-grep
    any:
      - id: micro-behaviors/communications/http/request/package::node-secrets-leak-post
      - id: micro-behaviors/data/encode/output/base64::node-buffer-base64-fallback
  - id: node-curl-oastify-container-secret-exfil
    desc: Node curl exfils container secrets to OASTify
    crit: hostile
    conf: 0.995
    attack: "T1041"
    mbc: "E1041"
    for: [javascript]
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/http/request/verb::javascript-curl-post-command
      - id: micro-behaviors/data/encode/file/base64::js-cat-etc-files-b64
    any:
      - id: micro-behaviors/fs/path/token::serviceaccount-token-path
      - id: micro-behaviors/process/identity/query/command::shell-substitution-user-cwd-query
  - id: preinstall-harvest-post-exfil
    desc: Preinstall, Base64 and OAST POST clues
    crit: suspicious
    conf: 0.98
    attack: "T1041,T1195.002"
    mbc: "E1041"
    all:
      - id: metadata/package/scripts/lifecycle::raw-preinstall-key
      - id: micro-behaviors/communications/http/request/verb::npm-curl-post-text
      - id: micro-behaviors/data/encoding/base64::script-base64-word
    any:
      - id: micro-behaviors/communications/url/host/oob/package::node-oastify-hostname
  - id: preinstall-post-oast-exfil
    desc: Preinstall POSTs to OAST endpoint
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/package/scripts/lifecycle::raw-preinstall-key
      - id: micro-behaviors/communications/http/request/verb::npm-script-post
      - id: micro-behaviors/communications/url/host/oob/package::node-oastify-hostname
  - id: lifecycle-jwt-sweep-oast-exfil
    desc: Lifecycle hook sweeps JWTs to OAST endpoint
    crit: hostile
    conf: 0.98
    attack: "T1195.002,T1552.001,T1041"
    scope: archive
    for: [npm, package.json, shell]
    all:
      - id: micro-behaviors/fs/search/command::eyjh-header-grep
      - id: micro-behaviors/communications/url/host/oob/package::oastify-url
      - id: micro-behaviors/process/create/shell/command-mode::npm-install-shell-command-string
      - id: micro-behaviors/data/encoding/base64::script-base64-word
