defaults:
  platforms: [windows, unix]
  for: [nupkg, xml]
  attack: T1195.002,T1041

traits:
  - id: msbuild-pipedream-or-webhook-post-url
    desc: MSBuild references out-of-band webhook
    crit: suspicious
    conf: 0.94
    for: [xml]
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{1,80}\.(pipedream\.net|webhook\.site)\b'
      case_insensitive: true

composite_rules:
  - id: nuget-msbuild-env-oob-webhook-exfil
    desc: NuGet build hook posts environment secrets
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: objectives/credential-access/env/harvesting::msbuild-env-secret-filter-pattern
      - id: msbuild-pipedream-or-webhook-post-url

  - id: nuget-msbuild-prebuild-hostname-webhook-beacon
    desc: NuGet build hook beacons hostname
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/msbuild::msbuild-before-build-target
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-computername-source
      - id: micro-behaviors/communications/url/host/oob/endpoint::webhook-site-reference
