# Cloud and cluster credentials collected from a container and sent through a
# public callback.  The endpoint provider remains intentionally unconstrained:
# the technique is the credential source plus packed transfer, not a service IOC.
defaults:
  platforms: [unix, windows]
  for: [python, scripts]
  attack: "T1552.005,T1552.007,T1041,T1027"
  mbc: "B0030"

composite_rules:
  - id: kube-cloud-credential-packed-oob-exfil
    desc: Container cloud credentials packed for external callback exfiltration
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/lateral-movement/exploit/container::kube-pod-runtime-cloud-credential-pivot
      - id: micro-behaviors/data/compress/library::python-base64-gzip-encode
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/client::request-python
    near_lines: 180
