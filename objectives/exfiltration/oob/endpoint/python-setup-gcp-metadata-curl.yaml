defaults:
  for: [python]
  platforms: [unix]
  attack: T1195.002,T1552.005,T1041

traits:
  - id: python-gcp-metadata-curl-callback-command
    desc: Curl posts GCP metadata to callback
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute object: (identifier) @os attribute: (identifier) @system)
          arguments: (argument_list (string) @command))
          (#eq? @os "os") (#eq? @system "system")
          (#match? @command "access_token=[$][(]curl")
          (#match? @command "metadata[.]google[.]internal/computeMetadata/v1/instance/service-accounts/")
          (#match? @command "curl -X POST -d [^;]{0,8}[$]access_token")
          (#match? @command "https?://([a-zA-Z0-9.-]{1,100}[.](oastify[.]com|ngrok-free[.]app)|webhook[.]site)/"))

composite_rules:
  - id: python-setup-gcp-metadata-callback-post
    desc: Setup contains cloud metadata exfiltration command
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: python-gcp-metadata-curl-callback-command
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: metadata/package/files/included::setup-py-basename
