defaults:
  platforms: [unix, windows]
  for: [gyp]
  attack: T1195.002
  mbc: B0024
composite_rules:
  - id: gyp-install-webhook-host-exfil-clues
    desc: gyp webhook, POST, and host or environment clues
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1041,T1082,T1552.001
    near_bytes: 1600
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::gyp-webhook-site-text-reference
      - id: micro-behaviors/communications/http/request/verb::gyp-post-method-text
    any:
      - id: micro-behaviors/metaprogramming/generation/build::gyp-host-path-or-exec-clues
      - id: micro-behaviors/os/env/enumerate::gyp-env-command-options-reference
