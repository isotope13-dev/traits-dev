defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002,T1041,T1082,T1033
  mbc: E1041
composite_rules:
- id: node-oob-hashed-host-user-get-beacon
  desc: Sends hashed hostname and username to an OOB GET
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: micro-behaviors/communications/http/request/beacon::oob-http-identity-query-cooccurrence
  - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  - id: micro-behaviors/crypto/hash/digest/sha2::node-createhash-sha256-call
  - id: micro-behaviors/communications/url/construction/query::query-parameter-mutation
  - id: micro-behaviors/os/sysinfo/hostname/query::host-identity-query
  - id: micro-behaviors/process/identity/query/principal::process-user-identity-api-set
- id: npm-install-hashed-host-user-oob-beacon
  desc: npm install-time script sends hashed host and user to OOB GET
  crit: hostile
  conf: 0.99
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  scope: archive
  any:
  - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  - id: micro-behaviors/crypto/hash/digest/sha2::node-createhash-sha256-call
  - id: micro-behaviors/communications/url/construction/query::query-parameter-mutation
  - id: micro-behaviors/os/sysinfo/hostname/query::host-identity-query
  - id: micro-behaviors/process/identity/query/principal::process-user-identity-api-set
