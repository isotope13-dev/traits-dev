defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-setup-root-glob-webhook-shell
    desc: Setup shells root file glob into webhook
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module (expression_statement (call function: (identifier) @print
          arguments: (argument_list (call function: (attribute object: (call function: (identifier) @import
            arguments: (argument_list (string) @module)) attribute: (identifier) @getoutput)
            arguments: (argument_list (string) @command))))))
          (#eq? @print "print") (#eq? @import "__import__") (#match? @module "subprocess")
          (#eq? @getoutput "getoutput") (#match? @command "curl[[:space:]]+https?://webhook[.]site/")
          (#match? @command "-d[[:space:]]+`cat[[:space:]]+/f[*]`"))

composite_rules:
  - id: python-setup-root-glob-webhook-exfil
    desc: Setup posts root file glob contents to webhook.site
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1005,T1041
    scope: file
    all:
      - id: python-setup-root-glob-webhook-shell
      - id: metadata/package/files/included::setup-py-basename
