# SVG attachments can execute script in a browser.  A webhook.site POST from
# an inline SVG script is an exfiltration channel regardless of the lure.
defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1041,T1567

composite_rules:
  - id: svg-webhook-post-exfiltration
    desc: SVG posts script data to webhook collector
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: micro-behaviors/communications/http/post::svg-fetch-post-request
      - id: objectives/exfiltration/oob/endpoint::webhook-site-reference
    near_bytes: 2600
