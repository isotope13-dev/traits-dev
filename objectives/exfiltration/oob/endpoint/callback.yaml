defaults:
  mbc: E1041
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
  # Keep the original high-signal language spread, add PHP for the PHP OOB
  # composites, and exclude unrelated script formats so endpoint matching stays
  # bounded. Native binaries remain limited to PE, as in the original rule.
  for: [scripts, -batch, -jcl, -lua, -perl, -applescript, -vbs, pe, go, rust, package.json]
composite_rules:
  - id: npm-postinstall-stdin-oob-exfil
    desc: npm postinstall pipes command output to an ngrok tunnel
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1033,T1041
    for: [source, scripts, '!jcl', npm, package.json, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post
      - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain

  - id: js-remote-script-oob-loader
    desc: Loads xss.report browser collector script
    crit: hostile
    conf: 0.97
    attack: T1105,T1048
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
      - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
      - id: micro-behaviors/data/collection/dom::append-child-reference
      - id: micro-behaviors/communications/http/url/endpoint::xss-report-callback
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/

  - id: js-fetch-json-post-oob
    desc: JavaScript fetch JSON POST to OOB
    crit: hostile
    conf: 0.97
    attack: T1048,T1041
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::json-body-post
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/opena2a-arp/
      # Hostname-shaped strings inside an embedded domain blocklist are
      # data to be blocked, not a callback endpoint the program contacts.
      - id: metadata/file/catalog/identity::embedded-domain-blocklist-context
      - id: objectives/supply-chain/impersonation/brand::npm-wix-registry-facade-command-exfil
      - id: well-known/tool/development/testing/empiricalrun/
      # A fetch POST to a free-host endpoint that the package manifest names
      # as its own homepage is the vendor's documented API, not a callback.
      - id: objectives/exfiltration/oob/endpoint::documented-vendor-api-endpoint-post
      # File-scope twin: clears the member-level finding, where the manifest
      # leg of the archive twin cannot match.
      - id: objectives/exfiltration/oob/endpoint::documented-vendor-endpoint-post-file

  # The https.request spelling of the fetch OOB beacon: install-time and
  # telemetry callbacks built on node:https POST a marker body to an OOB
  # collector (webhook.site UUID) with errors resolved away, so the
  # fetch/empty-catch legs of the sibling rules never see them.
  - id: js-https-post-oob
    desc: JavaScript HTTPS request POSTs body to OOB endpoint
    crit: hostile
    conf: 0.97
    attack: T1041
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/request/body::node-http-request-end-body
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/

  - id: browser-page-snapshot-oob-exfil
    desc: Full browser page snapshot exfiltrated to OOB collector
    crit: hostile
    conf: 0.98
    attack: T1113,T1041
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/data/parse/html::browser-document-html-snapshot-read-any
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/

  - id: js-local-route-oob-post
    desc: Local application route content posted to OOB callback
    crit: hostile
    conf: 0.96
    attack: T1041
    for: [javascript, typescript]
    near_lines: 120
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/url::js-relative-route-fetch
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/opena2a-arp/

  # PHP OOB endpoints are callback collectors rather than application APIs.
  # A JSON POST to one is an outbound collection operation even when the
  # payload is assembled from runtime values instead of a local file.
  - id: php-oob-json-post
    desc: PHP posts JSON to an OOB endpoint
    crit: hostile
    conf: 0.97
    attack: T1041
    for: [php]
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/data/serialize/json::php-json-encode
    near_bytes: 4096
    unless:
      - id: metadata/package/testing/harness/runtime/

  # Python packages sometimes contain ordinary webhook integrations, so the
  # hostile signal requires both a known OOB collector and a JSON POST in the
  # same source file.  A fixed webhook.site UUID is a callback sink, not an
  # application API, and the payload here is assembled from caller input.
  - id: python-oob-json-post
    desc: Python posts caller data as JSON to an OOB endpoint
    crit: hostile
    conf: 0.97
    attack: T1041
    for: [python, whl, python-sdist]
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
    unless:
      - id: metadata/package/testing/harness/runtime/

  # Keep the suppression evidence in the same file as the OOB request. At
  # archive scope, an unrelated empty catch in another package member must not
  # turn an ordinary postinstall declaration into a silent callback beacon.
  - id: npm-postinstall-oob-silent-json-beacon
    desc: npm postinstall silently POSTs JSON to an OOB sink
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    for: [javascript, typescript, pkginfo, npm, tar, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/request/beacon::oob-json-post-suppressed-errors
    unless:
      - id: metadata/package/documentation/disclosure::npm-config-diagnostic-research-beacon
      - id: metadata/package/testing/harness/runtime/

  # The GET spelling of the python OOB beacon: a urlopen against an OOB
  # collaborator with errors swallowed, no JSON body at all. The sibling
  # python-oob-json-post needs a payload; a bare "the install happened"
  # ping to webhook.site/oastify/interact.sh -- proof-of-reach is the
  # service's whole function -- convicts on the contact alone.
  - id: python-urlopen-oob-swallowed-beacon
    desc: Python silently opens an OOB collector
    crit: hostile
    conf: 0.95
    attack: T1048,T1041
    for: [python]
    scope: file
    near_lines: 10
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/

# Install-time OS recon reported to an OOB collector. The container rules
# convict the secret harvesting; this one states the callback -- a lifecycle
# script that shells `whoami`/`hostname`-style recon and hands the output to
# a webhook UUID path is an installation census, and the collector exists to
# receive it.
#
# Worked example: the kube-serviceaccount OOB package, whose postinstall
# collects identity commands and the serviceaccount directory listing, then
# curls the result to a webhook.site UUID.
  - id: os-recon-to-oob-collector
    desc: OS recon reported to OOB collector
    crit: hostile
    conf: 0.96
    attack: T1041,T1082,T1087
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/url/endpoint::webhook-site-uuid-path
      # The recon engine: a shell-out from the lifecycle script (the commands
      # collected -- whoami, hostname, ip, secrets listings -- ride inside
      # the spawned shell's text, not the JS).
      - id: metadata/import/builtin::child-process-api-destructure

  # A documented vendor API endpoint on a free host is not an OOB callback.
  # srebps-ai ships an SDK whose manifest homepage names the same
  # srebps-ai.gt.tc host its code POSTs caller-supplied prompts to. The
  # legs below are mechanism-level parents, not per-store lists: harvesting
  # browser, token, file or registry stores needs a file read (fs/read) and
  # host or user profiling needs sysinfo/discovery -- so a package showing
  # any collection, recon, execution, socket or install-hook evidence keeps
  # its hostile. Per-store leaves are deliberately not enumerated: several
  # cover only native types the rule does not declare, and fs/read already
  # spans their mechanism. The hostile below evaluates file-locally, so this
  # archive rule alone cannot clear the member-level finding; the file-scope
  # twin after it covers the member file itself.
  - id: documented-vendor-api-endpoint-post
    desc: Documented vendor endpoint with no collection
    crit: exception
    for: [npm, tar, javascript, typescript, package.json]
    scope: archive
    all:
      - id: micro-behaviors/communications/url/reference::srebps-ai-api-endpoint
      - id: metadata/package/repository::manifest-homepage-srebps-endpoint
    unless:
      - id: objectives/collection/
      - id: objectives/discovery/
      - id: micro-behaviors/os/sysinfo/
      - id: micro-behaviors/fs/read/
      - id: micro-behaviors/process/create/spawn/
      - id: micro-behaviors/process/create/shell/command-string/
      - id: metadata/package/scripts/lifecycle::install-hooks

  # File-scope twin of the rule above: the fetch-POST OOB hostile evaluates
  # inside one member file, where the manifest leg cannot match, so the
  # archive twin alone leaves the member-level finding standing. The vendor
  # binding here is the endpoint literal in the posting file itself: a file
  # that POSTs JSON to srebps-ai.gt.tc with no collection, recon, file-read
  # or execution legs is an API client call site, not a beacon. Anything
  # harvesting, profiling, reading files or spawning processes keeps firing.
  - id: documented-vendor-endpoint-post-file
    desc: Vendor endpoint POST with no collection
    crit: exception
    for: [javascript, typescript]
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/url/reference::srebps-ai-api-endpoint
      - id: micro-behaviors/communications/http/post::json-body-post
    unless:
      - id: objectives/collection/
      - id: objectives/discovery/
      - id: micro-behaviors/os/sysinfo/
      - id: micro-behaviors/fs/read/
      - id: micro-behaviors/process/create/spawn/
      - id: micro-behaviors/process/create/shell/command-string/
