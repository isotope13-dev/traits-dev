defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
  # Keep the original high-signal language spread, add PHP for the PHP OOB
  # composites, and exclude unrelated script formats so endpoint matching stays
  # bounded. Native binaries remain limited to PE, as in the original rule.
  for: [scripts, -batch, -jcl, -lua, -perl, -applescript, -vbs, pe, go, package.json]
traits:
  - id: burpcollaborator
    desc: Burp Collaborator OOB service
    if:
      type: text
      regex: ([a-z0-9]{8,32}\.)?burpcollaborator\.net\b
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: collab-digi-ninja
    desc: collab.digi.ninja OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?collab\.digi\.ninja\b
  - id: interact-sh-me-fun
    desc: interact.sh OOB service (me/fun)
    if:
      type: text
      regex: ([a-z0-9]{8,64}\.)?oast\.(me|fun)\b
    unless:
      - id: well-known/tool/offensive/projectdiscovery::nuclei-engine-go-module
  - id: interact-sh-pro-live
    desc: interact.sh OOB service (pro/live)
    if:
      type: text
      regex: ([a-z0-9]{8,64}\.)?oast\.(pro|live)\b
  - id: interact-sh-online-site
    desc: interact.sh OOB service (online/site)
    if:
      type: text
      regex: ([a-z0-9]{8,64}\.)?oast\.(online|site)\b
  - id: interactsh-com
    desc: interactsh.com OOB service
    if:
      type: text
      regex: ([a-z0-9]{8,64}\.)?interactsh\.com\b
  - id: pipedream
    desc: Pipedream OOB service
    if:
      type: text
      regex: ([a-z0-9]{8,32}\.)?(m\.)?pipedream\.(net|com)\b
  - id: pipedream-npm-script
    desc: Pipedream OOB service in npm script
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: ([a-z0-9]{8,32}\.)?(m\.)?pipedream\.(net|com)\b
  - id: web-content-oob-service-reference
    desc: OOB service URL in web content
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '(?i)([a-z0-9-]{1,64}\.)?(pipedream\.(net|com)|webhook\.site)\b'
  - id: xss-report-callback
    desc: xss.report callback collection path
    if:
      type: text
      regex: xss\.report/(c|r)/[A-Za-z0-9_-]{3,80}\b
  - id: dnslog-cn
    desc: DNSLog.cn OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?dnslog\.cn\b
  - id: ceye-io
    desc: ceye.io OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?ceye\.io\b
  - id: requestbin
    desc: RequestBin OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?requestbin\.(com|net)\b
  - id: requestcatcher
    desc: RequestCatcher OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?requestcatcher\.com\b
  - id: hookbin
    desc: HookBin OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?hookbin\.com\b
  - id: httpdump-app
    desc: httpdump.app OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?httpdump\.app\b
  - id: webhook-site-reference
    desc: webhook.site service reference
    for: [binaries, package.json, xml, javascript, typescript, php, batch, vbs, html]
    if:
      type: text
      regex: ([a-z0-9-]+\.)?webhook\.site\b
    unless:
      # Per-file: only suppress when *this* file is a test, not when the package
      # contains any test elsewhere — malicious packages bundle a token test.js
      # to silence package-level suppressors.
      - id: metadata/package/testing/harness/runtime/

  - id: composer-post-install-webhook-site
    desc: Composer post-install targets webhook.site
    for: [composer.json]
    conf: 0.98
    if:
      type: value
      path: scripts.post-install-cmd[*]
      regex: '(?i)https?://([a-z0-9-]+\.)?webhook\.site/'
  - id: webhook-site-source-call
    desc: Source call passes a webhook.site URL
    for: [python, javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_][A-Za-z0-9_.]*$'
      arg:
        kind: string
        substr: webhook.site
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: webhook-cool
    desc: webhook.cool OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?webhook\.cool\b
  - id: webhookrelay
    desc: webhookrelay.com OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?webhookrelay\.com\b
  - id: requestrepo
    desc: RequestRepo OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?requestrepo\.com\b
  - id: canarytokens-dup
    desc: CanaryTokens OOB service
    if:
      type: text
      regex: https?://([a-z0-9-]+\.)?canarytokens\.org\b
  - id: canarytokens-com
    desc: CanaryTokens.com OOB service
    if:
      type: text
      regex: https?://([a-z0-9-]+\.)?canarytokens\.com\b
  - id: canarytokens-traffic-path
    desc: CanaryTokens traffic callback path
    conf: 0.95
    if:
      type: text
      regex: 'canarytokens\.com/tags/traffic/[A-Za-z0-9_-]{8,}'
  - id: unicode-escaped-canarytokens-com
    desc: Escaped CanaryTokens.com OOB URL
    if:
      type: encoded
      encoding: unicode-escape
      regex: 'https?://([a-z0-9-]+\.)?canarytokens\.com\b'
  - id: beez-buzz
    desc: Beez.buzz OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?beez\.buzz\b
  - id: oastify
    desc: Oastify OOB service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?oastify\.com\b
  - id: own-sh
    desc: 0wn.sh OOB callback service
    if:
      type: text
      regex: ([a-z0-9-]+\.)?0wn\.sh\b
  - id: bypass-eu-org
    desc: bypass.eu.org SSRF bypass service
    crit: suspicious
    conf: 0.9
    attack: T1599
    if:
      type: text
      regex: ([a-f0-9]{6,16}\.(ipv4|ipv6)\.)?bypass\.eu\.org\b
  - id: dnshook-site
    desc: dnshook.site DNS canary/OOB service
    crit: suspicious
    conf: 0.95
    attack: T1048.003
    if:
      type: text
      regex: '[a-z0-9]{8,64}\.dnshook\.site\b'
  - id: eyes-sh
    desc: eyes.sh OOB service
    crit: suspicious
    conf: 0.95
    attack: T1048.003
    if:
      type: text
      regex: ([a-z0-9-]+\.)?eyes\.sh\b
  - id: zivyelab-collaborator
    desc: ZivyeLab collaborator OOB service
    crit: suspicious
    conf: 0.95
    attack: T1048
    if:
      type: text
      regex: ([a-z0-9]+\.)?collaborator\.zivyelab\.com\b
composite_rules:
  - id: npm-postinstall-stdin-oob-exfil
    desc: npm postinstall pipes command output to an ngrok tunnel
    crit: hostile
    conf: 0.995
    mbc: E1041
    attack: T1195.002,T1033,T1041
    for: [package.json, npm, archives]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/scripts/postinstall::curl-stdin-body-post
      - id: well-known/dual-use/tunnel/ngrok::ngrok-free-domain

  - id: webhook-site
    desc: webhook.site OOB service
    crit: notable
    conf: 0.85
    any:
      - id: webhook-site-reference
      - id: webhook-site-source-call

  - id: interact-sh
    desc: interact.sh OOB service
    any:
      - id: interact-sh-me-fun
      - id: interact-sh-pro-live
      - id: interact-sh-online-site

  - id: oob-endpoint-any
    desc: Any OOB callback endpoint
    crit: notable
    conf: 0.9
    any:
      - id: burpcollaborator
      - id: collab-digi-ninja
      - id: interactsh-com
      - id: interact-sh
      - id: pipedream
      - id: pipedream-npm-script
      - id: web-content-oob-service-reference
      - id: well-known/dual-use/tunnel/ngrok::ngrok-free-domain
      - id: requestbin
      - id: requestcatcher
      - id: hookbin
      - id: httpdump-app
      - id: webhook-site
      - id: webhook-cool
      - id: webhookrelay
      - id: requestrepo
      - id: canarytokens-dup
      - id: canarytokens-com
      - id: unicode-escaped-canarytokens-com
      - id: beez-buzz
      - id: oastify
      - id: own-sh
      - id: bypass-eu-org
      - id: dnshook-site
      - id: eyes-sh
      - id: zivyelab-collaborator

  # Single-file install/recon beacon: fetch() to a known OOB collaborator host
  # with errors deliberately swallowed so install never fails visibly.
  - id: js-fetch-oob-swallowed-beacon
    desc: JavaScript fetch to OOB with suppressed errors
    crit: hostile
    conf: 0.96
    attack: T1048
    mbc: E1041
    for: [javascript, typescript]
    near_lines: 3
    all:
      - id: micro-behaviors/data/control-flow/error-handling::fetch-empty-catch-handler
      - id: oob-endpoint-any
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: js-fetch-json-post-oob
    desc: JavaScript fetch JSON POST to OOB
    crit: hostile
    conf: 0.97
    attack: T1048,T1041
    mbc: E1041
    for: [javascript, typescript]
    all:
      - id: oob-endpoint-any
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: browser-page-snapshot-oob-exfil
    desc: Full browser page snapshot exfiltrated to OOB collector
    crit: hostile
    conf: 0.98
    attack: T1113,T1041
    mbc: E1041
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: oob-endpoint-any
      - id: micro-behaviors/data/parse/html::browser-document-html-snapshot-read-any
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/

  - id: oob-endpoint-file-exfil
    desc: File read posted to OOB callback endpoint
    crit: hostile
    conf: 0.95
    attack: T1567
    mbc: B0030
    for: [scripts, source]
    # OOB endpoints are exclusively for receiving callbacks (no legitimate API
    # surface). Reading a file and POSTing to one within the same source file
    # is the classic supply-chain exfil chain (e.g. @theguyswithaball color-utils).
    near_lines: 120
    all:
      - id: oob-endpoint-any
      - id: micro-behaviors/fs/file/read::file-content-read-operation
      - id: micro-behaviors/communications/http/post::post
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
  - id: js-local-route-oob-post
    desc: Local application route content posted to OOB callback
    crit: hostile
    conf: 0.96
    attack: T1041
    mbc: E1041
    for: [javascript, typescript]
    near_lines: 120
    all:
      - id: oob-endpoint-any
      - id: micro-behaviors/communications/http/url/path::js-relative-route-fetch
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    unless:
      - id: metadata/package/testing/harness/runtime/

  # PHP OOB endpoints are callback collectors rather than application APIs.
  # A JSON POST to one is an outbound collection operation even when the
  # payload is assembled from runtime values instead of a local file.
  - id: php-oob-json-post
    desc: PHP posts JSON to an OOB endpoint
    crit: hostile
    conf: 0.97
    attack: T1041
    mbc: E1041
    for: [php]
    all:
      - id: oob-endpoint-any
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/data/serialize/object::json-encode
    near_bytes: 4096
    unless:
      - id: metadata/package/testing/harness/runtime/

  # Python packages sometimes contain ordinary webhook integrations, so the
  # hostile signal requires both a known OOB collector and a JSON POST in the
  # same source file.  A fixed webhook.site UUID is a callback sink, not an
  # application API, and the payload here is assembled from caller input.
  - id: python-oob-json-post
    desc: Python posts caller data as JSON to an OOB endpoint
    crit: hostile
    conf: 0.97
    attack: T1041
    mbc: E1041
    for: [python]
    scope: file
    near_lines: 80
    all:
      - id: oob-endpoint-any
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
    unless:
      - id: metadata/package/testing/harness/runtime/

  # postinstall.js sidecar POSTs JSON (often cwd/package/wallet) to webhook.site
  # / similar OOB sinks and swallows errors so npm install never fails.
  - id: npm-postinstall-oob-silent-json-beacon
    desc: npm postinstall silently POSTs JSON to an OOB sink
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1041
    mbc: E1041
    for: [javascript, typescript, archives, pkginfo]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: oob-endpoint-any
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
    unless:
      - id: metadata/package/testing/harness/runtime/
