defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-env-host-oob-exfil
    desc: Install script has environment, host, and OOB reporting clues
    crit: hostile
    conf: 0.99
    attack: T1195.002, T1552.001, T1041
    mbc: E1041
    size_max: 20000
    scope: leaf
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/lang/source/literal/fragment/env-variable::dep-confusion-env-knobs
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-moika-endpoint
      - id: micro-behaviors/os/env/read/collection::named-script-env-report-cooccurrence
      - id: micro-behaviors/communications/http/request/verb::install-script-json-post-clues
    any:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/os/sysinfo/profile::small-node-host-user-query
