defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1048
  mbc: B0030
traits: []
composite_rules:
  - id: preinstall-exfil
    desc: OOB exfiltration from npm preinstall
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/script/npm::npm-preinstall-script
      - id: micro-behaviors/communications/url/host::oob-domains
  - id: crypto-oob
    for: [javascript]
    desc: OOB callback with crypto module import
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/library/provider::crypto-module-import
      - id: micro-behaviors/communications/url/host::oob-domains
  - id: encoded-oob-exfil
    desc: Base64-encoded OOB domain with HTTP
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/
    any:
      - id: micro-behaviors/communications/url/host::oastify-b64
      - id: micro-behaviors/communications/url/host::oast-fun-b64
      - id: micro-behaviors/communications/url/host::oast-fun-b64-hexwrapped
  # A Python module that snapshots the process environment and POSTs it to a
  # webhook.site UUID collection URL. The literal leg pins the disposable
  # collector even when the URL is held in a variable and posted by name,
  # which call-argument matchers cannot see.
  - id: python-webhook-env-exfil
    for: [python]
    desc: Python posts environment to webhook.site
    conf: 0.95
    all:
      - id: micro-behaviors/communications/url/host::python-webhook-site-uuid-literal
      - id: micro-behaviors/os/env/enumeration::python-environ-dict
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
