defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1048
  mbc: B0030
traits: []
composite_rules:
  - id: preinstall-exfil
    desc: OOB exfiltration from npm preinstall
    conf: 0.99
    all:
      - id: metadata/package/scripts/lifecycle::npm-preinstall-script
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-domains
  - id: crypto-oob
    for: [javascript]
    desc: OOB callback with crypto module import
    conf: 0.95
    all:
      - id: metadata/import/builtin::crypto-module-import
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-domains
  - id: encoded-oob-exfil
    desc: Base64-encoded OOB domain with HTTP
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/exchange::http-request-markers-or-response-stream
    any:
      - id: micro-behaviors/communications/url/host/oob/encoded::oastify-b64
      - id: micro-behaviors/communications/url/host/oob/encoded::oast-fun-b64
      - id: micro-behaviors/communications/url/host/oob/encoded::oast-fun-b64-hexwrapped
  # Disclosure identifies this as a dependency-confusion probe. Require the
  # parsed callback's own hostname-query provenance, not nearby telemetry.
  - id: nuget-build-hostname-webhook-exfil
    desc: Confusion probe sends hostname to webhook.site
    crit: hostile
    conf: 0.99
    for: [nupkg, xml]
    scope: archive
    attack: T1041,T1195.002
    all:
      - id: metadata/package/description/disclosure::nuspec-desc-dependency-confusion
      - id: metadata/build/manifest::nuspec-file
      - id: micro-behaviors/communications/http/download/package::msbuild-precompile-hostname-query
      - id: micro-behaviors/communications/http/download/package::msbuild-precompile-hostname-webhook-query
