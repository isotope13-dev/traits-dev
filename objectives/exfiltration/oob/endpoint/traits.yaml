defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1048
  mbc: B0030
traits: []
composite_rules:
  - id: preinstall-exfil
    desc: OOB exfiltration from npm preinstall
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/script/npm::npm-preinstall-script
      - id: micro-behaviors/communications/url/host/oob::oob-domains
  - id: crypto-oob
    for: [javascript]
    desc: OOB callback with crypto module import
    conf: 0.95
    all:
      - id: metadata/import/builtin::crypto-module-import
      - id: micro-behaviors/communications/url/host/oob::oob-domains
  - id: encoded-oob-exfil
    desc: Base64-encoded OOB domain with HTTP
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/exchange::http-request-markers-or-response-stream
    any:
      - id: micro-behaviors/communications/url/host/oob::oastify-b64
      - id: micro-behaviors/communications/url/host/oob::oast-fun-b64
      - id: micro-behaviors/communications/url/host/oob::oast-fun-b64-hexwrapped
  # The exfiltration half of the NuGet build-hook beacon: the pre-build
  # DownloadFile request is addressed to a public webhook collector and
  # its query carries the build machine's hostname, so the collector
  # learns which organisation's build resolved the package. A package
  # description calling this research does not authorise the transfer.
  - id: nuget-build-hostname-webhook-exfil
    desc: NuGet pre-build hook sends hostname to webhook collector
    crit: hostile
    conf: 0.97
    for: [nupkg, xml]
    scope: package
    attack: T1041,T1195.002
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-before-build-target
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-computername-source
      - id: micro-behaviors/communications/url/host/oob::webhook-site-reference
