# Request-capture services (webhook.site, OAST collectors) let an author
# read whatever reaches a throwaway URL. Pointing an encoded environment dump
# at one is collection, not integration with a real backend.
defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1552.001,T1567

composite_rules:
  - id: encoded-environment-to-capture-service
    desc: Sends an encoded environment dump to a request-capture service
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/os/env/pipeline::env-dump-base-encoded
      - id: micro-behaviors/communications/url/host/oob/endpoint
