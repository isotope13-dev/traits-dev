defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-project-env-oob-exfil
    desc: Install script has project, environment, and OOB reporting clues
    crit: hostile
    conf: 0.995
    attack: T1195.002, T1552.001, T1041
    mbc: E1041
    size_max: 20000
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/lang/source/literal/fragment/env-variable::dep-confusion-env-knobs
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-moika-endpoint
      - id: metadata/lang/source/naming/variable::postinstall-sensitive-env-report
      - id: micro-behaviors/fs/path/secret-config::postinstall-npmrc-harvest
      - id: micro-behaviors/revision-control/git/read::install-script-project-git-env-clues
      - id: micro-behaviors/communications/http/request/verb::install-script-json-post-clues
    any:
      - id: objectives/discovery/network/interface::install-script-network-discovery-clues
      - id: objectives/exfiltration/stealer/credential::credential-http-upload
