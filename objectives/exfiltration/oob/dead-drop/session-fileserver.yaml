# Dead-drop exfiltration through ephemeral-messenger file hosting. The
# Session messenger's file server (filev2.getsession.org and its seeds)
# accepts anonymous encrypted attachments, so stealer operators encrypt
# collected secrets to a fixed recipient key and upload them as
# attachments — an attacker-held drop point with no account to trace.
# The host reference alone is honest signal; the hostile composite
# requires the accompanying credential-collection behavior, because a
# Session client library legitimately talks to this server too.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1567"

traits:
  - id: session-fileserver-host
    desc: Session messenger file-server host reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)[a-z0-9.-]*getsession\.org'

  - id: session-attachment-upload-api
    desc: Session file-server attachment upload API verb
    crit: component
    conf: 0.9
    if:
      type: text
      substr: upload_attachment

composite_rules:
  - id: session-fileserver-attachment-upload
    desc: Uploads attachments to the Session file server
    crit: suspicious
    conf: 0.93
    near_bytes: 4096
    all:
      - id: session-fileserver-host
      - id: session-attachment-upload-api

  - id: session-fileserver-credential-dead-drop
    desc: Exfiltrates collected credentials via Session dead drop
    crit: hostile
    conf: 0.95
    attack: "T1567,T1041"
    all:
      - id: session-fileserver-host
      - id: objectives/collection/stealer/workflow::detached-cloud-ci-credential-collector
