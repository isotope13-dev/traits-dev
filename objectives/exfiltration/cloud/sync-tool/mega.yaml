defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]

composite_rules:
  - id: megacmd-silent-user-dir-exfil
    desc: Script silently installs MEGAcmd and uploads user directories
    crit: hostile
    conf: 0.95
    attack: T1567.002
    all:
      - id: micro-behaviors/communications/transfer::mega-put-command
      - id: micro-behaviors/os/package-manager/
      - id: micro-behaviors/os/security/
