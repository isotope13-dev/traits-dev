defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1567.002

traits:
  - id: megacmd-put-user-profile-folder
    desc: mega-put uploads a user profile folder
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)mega-put\b[^\r\n]{0,60}USERPROFILE[^\r\n]{0,12}\\(Desktop|Documents|Pictures)'

composite_rules:
  - id: megacmd-silent-user-dir-exfil
    desc: Script silently installs MEGAcmd and uploads user directories
    crit: hostile
    conf: 0.95
    all:
      - id: megacmd-put-user-profile-folder
      - id: micro-behaviors/communications/transfer::mega-put-command
      - id: micro-behaviors/os/package-manager/
      - id: micro-behaviors/os/security/
