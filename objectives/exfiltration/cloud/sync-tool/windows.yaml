defaults:
  platforms: [windows]
  for: [batch, powershell, pe]
  attack: T1567
traits:
- id: goodsync-name
  desc: GoodSync sync tool reference
  crit: component
  if:
    type: text
    regex: '(?i)\bGoodSync(\.exe)?\b'
- id: goodsync-job-action
  desc: GoodSync job action switch
  crit: suspicious
  if:
    type: text
    regex: '(?i)\bGoodSync(\.exe)?\b.{0,120}\b(sync|analyze|jobs|run)\b'
- id: bulk-sensitive-server-data-path--rx-1
  desc: "Matches 'ProgramData\\Microsoft\\Crypto'"
  crit: notable
  count_min: 2
  if:
    type: text
    substr: ProgramData\Microsoft\Crypto
    case_insensitive: true
- id: bulk-sensitive-server-data-path--rx-2
  desc: "Matches 'Documents\\Secrets'"
  crit: notable
  count_min: 2
  if:
    type: text
    substr: Documents\Secrets
    case_insensitive: true
- id: bulk-sensitive-server-data-path--rx-3
  desc: "Matches 'AppData\\Roaming'"
  crit: notable
  count_min: 2
  if:
    type: text
    substr: AppData\Roaming
    case_insensitive: true
- id: bulk-sensitive-server-data-path--rx-4
  desc: "Matches 'inetpub\\wwwroot'"
  crit: notable
  count_min: 2
  if:
    type: text
    substr: inetpub\wwwroot
    case_insensitive: true
# A bare '--recursive' was dropped: every file tool's help text has it.
- id: goodsync-left-flag
  desc: GoodSync /left= job argument
  crit: notable
  if:
    type: text
    regex: '(?i)/left='
- id: goodsync-right-flag
  desc: GoodSync /right= job argument
  crit: notable
  if:
    type: text
    regex: '(?i)(/right=|/sync.{0,40}/(left|right)=)'
composite_rules:
- id: goodsync-backblaze-exfil
  desc: GoodSync exfiltration to Backblaze
  crit: hostile
  conf: 0.95
  all:
  - id: goodsync-name
  - id: micro-behaviors/communications/http/services/backblaze::backblaze-b2-endpoint-reference
  any:
  - id: goodsync-job-action
  - id: sync-recursive-flags
  - id: micro-behaviors/fs/path/system::windows-common-data-tree-path
  - id: bulk-sensitive-server-data-path
  needs: 2
- id: bulk-sensitive-server-data-path
  desc: Multiple sensitive server data paths
  crit: notable
  conf: 1.0
  needs: 2
  any:
  - id: bulk-sensitive-server-data-path--rx-1
  - id: bulk-sensitive-server-data-path--rx-2
  - id: bulk-sensitive-server-data-path--rx-3
  - id: bulk-sensitive-server-data-path--rx-4
  - id: objectives/credential-access/ftp/filezilla::application-path
  - id: micro-behaviors/fs/path/app-data::windows-user-profile-data-path
  downgrade:
    any:
    - id: metadata/signed/leaf::malwarebytes-inc
- id: sync-recursive-flags
  desc: GoodSync left/right sync arguments
  crit: component
  conf: 1.0
  any:
  - id: goodsync-left-flag
  - id: goodsync-right-flag
