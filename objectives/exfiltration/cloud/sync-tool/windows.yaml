defaults:
  platforms: [windows]
  for: [batch, powershell, pe]
  attack: T1567
traits:
- id: goodsync-name
  desc: GoodSync sync tool reference
  crit: component
  if:
    type: text
    regex: '(?i)\bGoodSync(\.exe)?\b'
- id: goodsync-job-action
  desc: GoodSync job action switch
  crit: suspicious
  if:
    type: text
    regex: '(?i)\bGoodSync(\.exe)?\b.{0,120}\b(sync|analyze|jobs|run)\b'
- id: goodsync-left-flag
  desc: GoodSync /left= job argument
  crit: notable
  if:
    type: text
    regex: '(?i)/left='
- id: goodsync-right-flag
  desc: GoodSync /right= job argument
  crit: notable
  if:
    type: text
    regex: '(?i)(/right=|/sync.{0,40}/(left|right)=)'
composite_rules:
- id: goodsync-backblaze-exfil
  desc: GoodSync exfiltration to Backblaze
  crit: hostile
  conf: 0.95
  all:
  - id: goodsync-name
  - id: micro-behaviors/communications/http/services/backblaze::backblaze-b2-endpoint-reference
  any:
  - id: goodsync-job-action
  - id: sync-recursive-flags
  - id: micro-behaviors/fs/path/system::windows-common-data-tree-path
  - id: micro-behaviors/fs/path/reference::multiple-windows-data-locations
  needs: 2
- id: sync-recursive-flags
  desc: GoodSync left/right sync arguments
  crit: component
  conf: 1.0
  any:
  - id: goodsync-left-flag
  - id: goodsync-right-flag
