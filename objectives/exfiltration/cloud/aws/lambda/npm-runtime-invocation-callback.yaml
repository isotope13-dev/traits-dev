defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1195.002,T1041,T1530

traits:
  - id: js-lambda-runtime-api-environ
    desc: Finds Lambda runtime API in process environment
    crit: notable
    if:
      type: text
      substr: 'AWS_LAMBDA_RUNTIME_API='

  - id: js-lambda-response-callback
    desc: Sends invocation response to callback
    crit: suspicious
    if:
      type: text
      regex: '(?s)phoneHome\s*\(\s*\{\s*step:\s*["''](next_response|captured)["''].{0,500}body:'

  - id: js-lambda-cross-account-callback
    desc: Sends cross-account response to callback
    crit: suspicious
    if:
      type: text
      regex: '(?s)phoneHome\s*\(\s*\{\s*step:\s*["'']cross_account_captured["''].{0,250}body:'

  - id: js-lambda-callback-post
    desc: Posts callback data over HTTPS
    crit: notable
    if:
      type: text
      regex: '(?s)https\.request\s*\(\s*CALLBACK.{0,100}method:\s*["'']POST["'']'

composite_rules:
  - id: npm-install-lambda-invocation-callback
    desc: Install hook forwards Lambda invocation response
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: js-lambda-runtime-api-environ
      - id: micro-behaviors/communications/http/request/lambda-runtime::aws-lambda-runtime-invocation-next-route
      - id: js-lambda-callback-post
    any:
      - id: js-lambda-response-callback
      - id: js-lambda-cross-account-callback

  - id: js-lambda-runtime-invocation-external-post
    desc: Script reads Lambda invocations and posts externally
    crit: hostile
    conf: 0.97
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/http/request/lambda-runtime::aws-lambda-runtime-invocation-next-route
      - id: micro-behaviors/fs/proc/info/path::process-var-environ
      - id: micro-behaviors/communications/http/post::node-http-request-post
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
