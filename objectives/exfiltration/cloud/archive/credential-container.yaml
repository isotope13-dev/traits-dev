# A recursive credential-container sweep becomes clear exfiltration when its
# results are packed into a local staging archive and sent with a cloud-copy
# utility. This captures the reusable double-extortion technique without
# binding detection to a victim, filename, hostname, or ransomware family.
defaults:
  platforms: [windows, unix]
  for: [scripts]
  attack: T1005,T1074.001,T1552.001,T1560.001,T1567.002

composite_rules:
  - id: credential-container-archive-cloud-exfiltration
    desc: Archives credential-container targets and transfers them to cloud storage
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/files/secret-sweep::recursive-credential-container-sweep
      - id: micro-behaviors/data/archive/create/utility::archive-utility-create
      - id: micro-behaviors/fs/path/archive::archive-staging-location
      - id: objectives/collection/archive/upload::azcopy-transfer-command
    near_lines: 80
