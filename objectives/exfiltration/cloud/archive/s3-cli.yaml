# Archive staging followed by a directional local-to-S3 transfer. These
# combinations are suspicious rather than hostile because legitimate backup
# jobs can have the same mechanics; a responder should verify bucket ownership
# and the provenance of the archive command.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1560.001,T1567.002

composite_rules:
  - id: s5cmd-archive-s3-upload
    desc: Uploads a local archive to S3 with s5cmd
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/collection/archive/upload::s5cmd-s3-upload-command
    any:
      - id: micro-behaviors/fs/path/archive::windows-archive-path
      - id: micro-behaviors/fs/path/archive::unix-temp-archive-path
    near_lines: 4

  - id: rar-staging-s5cmd-s3-upload
    desc: Creates a RAR archive and uploads it to S3 with s5cmd
    crit: suspicious
    conf: 0.98
    all:
      - id: s5cmd-archive-s3-upload
      - id: objectives/collection/archive/upload::rar-archive-command
    near_lines: 10
