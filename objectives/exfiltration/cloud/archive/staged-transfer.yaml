# Cloud-drive collection followed by archive staging and transfer.  The
# combination models the article's OneDrive/SharePoint -> compressed archive ->
# Mega workflow without depending on a malware-family name or one executable.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1005,T1530,T1560.001,T1567.002

composite_rules:
  - id: cloud-drive-archive-exfiltration
    desc: Downloads cloud-drive data, archives targeted files, and transfers the archive
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/deaddrop/cloud-storage::graph-drive-content-read-traffic
      - id: objectives/collection/file-targeting/filter::targeted-high-value-file-discovery
      - id: objectives/collection/archive/upload::archive-creation-for-collection
      - id: objectives/collection/archive/upload::archive-transfer-command
    near_bytes: 20000
