# Cloud-drive collection followed by archive staging and transfer.  The
# combination models the article's OneDrive/SharePoint -> compressed archive ->
# Mega workflow without depending on a malware-family name or one executable.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1005,T1530,T1560.001,T1567.002

composite_rules:
  - id: cloud-drive-archive-exfiltration
    for: [scripts, '!jcl']
    desc: Downloads cloud-drive data, archives targeted files, and transfers the archive
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-read-traffic
      - id: objectives/collection/file-targeting/filter::targeted-high-value-file-discovery
      - id: objectives/collection/archive/upload::archive-creation-for-collection
      - id: objectives/collection/archive/upload::archive-transfer-command
    near_bytes: 20000

  - id: admin-share-archive-cloud-exfiltration
    for: [batch, powershell]
    desc: Archives Windows admin-share user data and uploads to cloud storage
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/collection/archive/stage::network-share-archive-staging
      - id: micro-behaviors/os/network/share::windows-admin-share-path
      - id: micro-behaviors/fs/path/personal::windows-documents-or-desktop-path
    any:
      - id: objectives/exfiltration/cloud/object-store::cloud-copy-to-named-remote
      - id: micro-behaviors/communications/http/services/backblaze::backblaze-b2-endpoint-reference
