defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1567.002,T1552.001

traits:
  # Quoted sk- key literal in source. The shared sk- atom is typed for
  # markdown and text only, so script files need their own leg.
  - id: embedded-sk-key-literal
    desc: Source embeds quoted sk- API key literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[''"]sk-[A-Za-z0-9]{24,64}[''"]'

composite_rules:
  # A client bundles a hardcoded AI-provider API key and sends user content
  # to that provider's chat endpoint. Every installed copy then uploads the
  # user's private messages to a third-party model under the developer's key.
  - id: embedded-ai-key-chat-upload
    desc: Client embeds an AI API key and uploads chat content
    crit: hostile
    conf: 0.93
    all:
      - id: embedded-sk-key-literal
      - id: micro-behaviors/communications/http/services/deepseek::deepseek-chat-api-client
