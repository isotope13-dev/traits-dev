# Credential or config bytes written into a hosted Redis/KV service.
# Neutral Redis client use lives under micro-behaviors/data/db/redis/;
# this composite infers exfil when a constructed client APPENDs into a
# hardcoded Upstash endpoint next to a dotenv read.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1567,T1552.001
  mbc: E1041

composite_rules:
  - id: upstash-dotenv-kv-exfil
    desc: Dotenv contents written to Upstash Redis
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: well-known/lib/cloud/upstash::redis-host
      - id: micro-behaviors/data/db/redis::redis-construct-append
      - id: micro-behaviors/fs/path/config/environment::node-dotenv-file-path
