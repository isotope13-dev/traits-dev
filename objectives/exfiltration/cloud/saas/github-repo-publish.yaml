# Stolen data published to a repository the malware creates on the victim's own
# account.
#
# The exfiltration channel is the victim's GitHub account, reached with the
# token the malware just harvested. It authenticates as them, creates a fresh
# repository, and writes the collected secrets into it as file contents. No
# attacker-controlled host appears anywhere in the traffic: the destination is
# github.com, the credential is the victim's own, and the request is
# indistinguishable at the network layer from that developer pushing code.
#
# Egress filtering, domain blocklists and TLS inspection all see a normal
# GitHub API call. What makes it recoverable is the sequence — create a
# repository, then write file contents into it, in code that is also sweeping
# the machine for credentials. A tool that legitimately creates repositories
# (a scaffolder, a CI bootstrapper) does not also carry a developer-secret
# pattern list.
#
# The credential leg is what supplies the intent; the two GitHub calls alone
# describe a publishing integration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1567
  mbc: B0024,E1020

composite_rules:
  # The source may hide the REST route in an encoded string table. GitHub's
  # create-repository and contents-write request schemas remain useful evidence
  # when combined with an independently detected credential harvester.
  - id: github-public-repo-credential-deaddrop
    desc: Credential harvester writes collected data to a new public GitHub repo
    crit: hostile
    conf: 0.97
    for: [javascript]
    all:
      - id: objectives/credential-access/cloud/secret-inventory::detached-ci-cloud-token-harvester
      - id: micro-behaviors/communications/http/services/github/repository::github-public-repo-create-body-shape
    any:
      - id: micro-behaviors/communications/http/put::javascript-content-commit-put-options
      - id: micro-behaviors/communications/http/put::javascript-content-commit-put-options-reversed

  - id: github-repo-created-for-secret-publish
    desc: Publishes harvested secrets to a new repo
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/lang/source/naming/secret::developer-secret-name-cluster
      - id: micro-behaviors/communications/http/services/github/repository::github-create-repo-and-contents-write
