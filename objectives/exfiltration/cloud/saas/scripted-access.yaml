# Microsoft 365 audit artifacts for scripted SharePoint/OneDrive collection.
# UNC6671 activity showed file access/download events whose scripting
# User-Agent did not agree with the claimed Office client, often from an
# unmanaged device.  Match the structured audit fields, not analyst prose or
# incident-specific filenames.
defaults:
  platforms: [windows, unix]
  for: [json, text]
  attack: T1213.002,T1530

traits:
  - id: saas-file-access-operation
    desc: SaaS file access audit operation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)"Operation"\s*:\s*"FileAccessed"'

  - id: saas-file-download-operation
    desc: SaaS file download audit operation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)"Operation"\s*:\s*"FileDownloaded"'

  - id: saas-sharepoint-workload
    desc: SharePoint audit workload
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)"Workload"\s*:\s*"SharePoint"'

  - id: saas-onedrive-workload
    desc: OneDrive audit workload
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)"Workload"\s*:\s*"OneDrive"'

  - id: saas-python-requests-user-agent
    desc: Python requests User-Agent in SaaS audit data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)"UserAgent"\s*:\s*"python-requests/[0-9]'

  - id: saas-powershell-user-agent
    desc: PowerShell User-Agent in SaaS audit data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)"UserAgent"\s*:\s*"WindowsPowerShell/[0-9.]+'

  - id: saas-go-http-user-agent
    desc: Go HTTP User-Agent in SaaS audit
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)"UserAgent"\s*:\s*"Go-http-client/[0-9.]+'

  - id: saas-unmanaged-device-event
    desc: SaaS file event from an unmanaged device
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)"IsManagedDevice"\s*:\s*false'

  - id: saas-office-client-label
    desc: Office client label in audit data
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)"ApplicationDisplayName"\s*:\s*"Microsoft Office"'

composite_rules:
  - id: saas-cloud-file-workload
    desc: SharePoint or OneDrive audit workload
    crit: notable
    conf: 0.96
    any:
      - id: saas-sharepoint-workload
      - id: saas-onedrive-workload

  - id: saas-script-user-agent
    desc: Script engine User-Agent in SaaS audit
    crit: notable
    conf: 0.96
    any:
      - id: saas-python-requests-user-agent
      - id: saas-powershell-user-agent
      - id: saas-go-http-user-agent

  - id: scripted-saas-file-access
    desc: Scripted SharePoint or OneDrive file access
    crit: hostile
    conf: 0.98
    all:
      - id: saas-cloud-file-workload
      - id: saas-file-access-operation
      - id: saas-script-user-agent
    any:
      - id: saas-unmanaged-device-event
      - id: saas-office-client-label
    near_bytes: 1800

  - id: scripted-saas-file-download
    desc: Scripted SharePoint or OneDrive file download
    crit: hostile
    conf: 0.98
    all:
      - id: saas-cloud-file-workload
      - id: saas-file-download-operation
      - id: saas-script-user-agent
      - id: saas-unmanaged-device-event
      - id: saas-office-client-label
    near_bytes: 1800
