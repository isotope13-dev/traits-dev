# A wallet client has no reason to hold a Firebase Admin service account:
# that credential grants server-side write access to someone's Firestore
# project. Bundled into wallet code beside a Firestore document write, it
# gives every installed copy a channel to push data into the operator's
# database (the OSX.ElectrumStealer pattern, 2020).
defaults:
  platforms: [windows, linux, macos]
  for: [python, python_bytecode]
  attack: T1567,T1552.001

composite_rules:
  - id: wallet-firestore-admin-write
    desc: Wallet code writes Firestore documents with an embedded Firebase Admin key
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/firebase::firebase-admin-python-module
      - id: micro-behaviors/communications/http/services/firebase::firestore-server-timestamp-write
      - id: micro-behaviors/os/security/auth/cloud::firebase-admin-service-account-email
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-header
    any:
      - id: micro-behaviors/os/application/target/wallet::hardware-wallet-keyword-cluster--rx-8
      - id: micro-behaviors/fs/path/credential::wallet-keystore-file-path-wording
      - id: micro-behaviors/fs/path/wallet::electrum-default
