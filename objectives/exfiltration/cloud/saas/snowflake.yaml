# Snowflake unload-to-stage followed by a local GET. Requiring the temporary
# stage, unload, and local transfer distinguishes this chain from ordinary
# application queries while remaining independent of client language or OS.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, class]

composite_rules:
  - id: temporary-stage-local-download-chain
    desc: Snowflake temporary-stage local download chain
    crit: suspicious
    conf: 0.96
    attack: T1530,T1074.002
    all:
      - id: micro-behaviors/data/db/snowflake::temporary-stage-create
      - id: micro-behaviors/data/db/snowflake::stage-unload
      - id: micro-behaviors/data/db/snowflake::stage-download-to-local-uri
    near_bytes: 2400

  - id: stolen-credential-whole-table-local-exfil
    desc: Stolen Snowflake credential exports whole table locally
    crit: hostile
    conf: 0.99
    attack: T1530,T1078.004,T1041
    all:
      - id: objectives/credential-access/cloud/datastore::snowflake-stolen-password-connect
      - id: objectives/collection/database/query::compressed-whole-table-stage-unload
      - id: temporary-stage-local-download-chain
