defaults:
  platforms: [windows]
  for: [java, class]
  crit: hostile
composite_rules:
  - id: broker-token-graph-file-collection
    ref: https://tenex.ai/blog/grand-theft-token-brokersiphon
    desc: Token Broker credential dumper handles Graph file responses
    attack: T1528,T1530
    all:
      - id: objectives/credential-access/cloud/token/broker::java-cache-token-dump
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-item-content
      - id: micro-behaviors/communications/http/client/response-body::jdk-http-byte-response
      - id: micro-behaviors/communications/http/client/exchange::jdk-httpclient-exchange
    near_bytes: 8192
  - id: broker-cloud-collection-byte-upload
    ref: https://tenex.ai/blog/grand-theft-token-brokersiphon
    desc: Token Broker cloud-file collector builds HTTP byte uploads
    attack: T1041
    all:
      - id: broker-token-graph-file-collection
      - id: micro-behaviors/communications/http/put::jdk-http-put-bytes
    near_bytes: 8192
