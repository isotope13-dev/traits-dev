# Compromised OAuth applications can enumerate and retrieve Google Workspace
# data without another interactive login. Any single service operation is
# routine; the suspicious patterns are whole-mailbox retrieval and collection
# spanning several independent Workspace data planes.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1114.002,T1213.002,T1530

composite_rules:
  - id: google-gmail-mailbox-collection
    desc: Enumerates and retrieves Gmail messages
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/google::google-gmail-message-listing
      - id: micro-behaviors/communications/http/services/google::google-gmail-message-retrieval
    near_bytes: 4096

  - id: google-workspace-oauth-multi-service-collection
    desc: OAuth client collects across Workspace services
    crit: suspicious
    conf: 0.98
    all:
      - id: google-gmail-mailbox-collection
      - id: micro-behaviors/communications/http/services/google::google-drive-file-listing
      - id: micro-behaviors/communications/http/services/google::google-drive-content-download
      - id: micro-behaviors/communications/http/services/google::google-workspace-contact-calendar-listing
      - id: micro-behaviors/communications/http/services/google::google-workspace-oauth-authentication
    near_bytes: 12000
