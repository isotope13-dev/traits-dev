# A Cloud Logging client writes to whichever project its credentials name. A
# package that embeds a service-account key, or that logs the host and the
# process environment through one, delivers that data to the operator's
# project. The log write alone is ordinary; the payload and the key source
# establish the exfiltration.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1567
composite_rules:
  - id: gcp-logging-env-snapshot-write
    desc: Cloud log write beside a full environment snapshot
    crit: notable
    conf: 0.93
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/services/gcp::gcp-logging-struct-write
      - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: import-time-env-cloud-log-exfil
    desc: Cloud log write carries host details and environment
    crit: hostile
    conf: 0.97
    scope: file
    attack: T1567,T1082
    all:
      - id: metadata/import/python/google/cloud/logging
      - id: gcp-logging-env-snapshot-write
    any:
      - id: micro-behaviors/os/sysinfo/platform/host::platform-node
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: embedded-service-account-log-channel
    desc: Decoded embedded service-account key writes cloud logs
    crit: hostile
    conf: 0.96
    scope: file
    attack: T1567,T1552.001
    all:
      - id: objectives/anti-static/obfuscation/encoding/layered::base64-xor-transform
      - id: micro-behaviors/os/security/auth/cloud::python-service-account-info-constructor
      - id: micro-behaviors/communications/http/services/gcp::gcp-logging-struct-write
      - id: metadata/import/python/google/cloud/logging
