# SharePoint REST file retrieval coupled to broad, paginated repository
# discovery. Tenant names, resource paths, and client implementations vary, so
# the rule depends only on the durable SharePoint protocol sequence.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1213.002,T1530

composite_rules:
  - id: sharepoint-rest-repository-collection
    desc: Retrieves files after broad SharePoint discovery
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/discovery/cloud/enum::sharepoint-rest-paginated-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::sharepoint-rest-file-content-endpoint
    near_bytes: 12000
