# Automated Microsoft Graph collection after broad tenant reconnaissance.
# A backup or governance client can legitimately use any individual endpoint,
# so the rules remain suspicious and require the article's durable sequence:
# permission-surface reconnaissance, paginated repository traversal, and
# content retrieval across cloud workloads. Resource IDs, API versions,
# filenames, user agents, and campaign infrastructure are deliberately absent.
defaults:
  crit: suspicious
  conf: 0.98
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1087.004,T1069.003,T1213.002,T1530,T1114

composite_rules:
  - id: paginated-graph-repository-collection
    for: [scripts, '!jcl']
    desc: Collects Graph repository content after tenant reconnaissance
    all:
      - id: objectives/discovery/cloud/directory::entra-directory-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::graph-paginated-result-reader
      - id: micro-behaviors/communications/http/services/microsoft::graph-repository-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-read-traffic
    near_bytes: 12000

  - id: graph-multi-workload-collection
    for: [scripts, '!jcl']
    desc: Collects Graph drive and mailbox data after tenant reconnaissance
    all:
      - id: objectives/discovery/cloud/directory::entra-directory-enumeration
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-read-traffic
      - id: micro-behaviors/communications/http/services/microsoft::graph-mail-folder-recon-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-message-attachments-path
    near_bytes: 12000
