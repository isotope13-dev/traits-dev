defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1041,T1567.002
  mbc: E1041,E1567.002

traits:
  - id: ci-run-environment-read
    desc: Reads the CI run environment field
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'os\.getenv\(\s*["'']RUN["'']'

  - id: ci-pipeline-environment-read
    desc: Reads the CI pipeline environment field
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'os\.getenv\(\s*["'']PIPELINE["'']'

  - id: ci-step-environment-read
    desc: Reads the CI step environment field
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'os\.getenv\(\s*["'']STEP["'']'

composite_rules:
  - id: python-gcs-ci-metadata-upload
    desc: Uploads CI environment metadata to a GCS bucket
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/gcp::python-gcs-upload-string
      - id: ci-run-environment-read
      - id: ci-pipeline-environment-read
      - id: ci-step-environment-read

  - id: python-import-time-gcs-ci-upload
    desc: Import-time thread uploads CI metadata to GCS
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: python-gcs-ci-metadata-upload
      - id: micro-behaviors/data/control-flow/module-exec::python-class-eager-thread-start
      - id: micro-behaviors/process/create/thread::python-thread-target-eager-call
