# CloudTrail and source-level AWS API evidence for the S3 replication theft
# technique.  A replication write is not hostile by itself; the combination
# with Lambda discovery and KMS decryption is the article's credential-to-data
# theft chain.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1530

composite_rules:
  - id: aws-lambda-secret-replication-theft
    desc: AWS Lambda secret replication theft
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/aws::lambda-function-list-operation
      - id: micro-behaviors/communications/http/services/aws::kms-decrypt-operation
      - id: micro-behaviors/communications/http/services/aws::s3-replication-write-operation
