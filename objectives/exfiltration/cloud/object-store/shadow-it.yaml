# Cloud object storage repurposed as trusted staging or exfiltration.
# A cloud endpoint is benign by itself; intent requires local data, an upload,
# and cloud credentials or the external/cloud mapping described in the article.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1567.002

traits:
  # The bare object-storage endpoint atoms that used to sit here moved to
  # micro-behaviors/communications/http/url/cloud (see the note there): naming a
  # storage host is a neutral capability, and keeping it under an exfiltration
  # path made every SDK that ships an endpoint table look like staging. The
  # composite below still reads exactly the same, it just reaches for them
  # cross-directory the way it already did for `aws-s3-url`.
  # The Node sensitive-file read moved to
  # micro-behaviors/fs/read/file::node-sensitive-file-read, for the same reason
  # the endpoint atoms moved: the regex only shows a readFileSync of a
  # .env/.config/credentials path, which is neutral file access, and its Python
  # twin was already in the capability namespace.  The composite below reaches
  # for both cross-directory.

  - id: r2-credential-source-reference
    desc: References R2 credential material
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)R2_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)'

composite_rules:
  - id: cloud-object-upload-operation
    desc: Performs a cloud object upload
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context
      - id: well-known/app/publishing/sphinxcontrib-osint::sphinxcontrib-osint-package
      - id: well-known/app/publishing/sphinxcontrib-osint::owebuil-api-class
      - id: well-known/app/publishing/sphinxcontrib-osint::bsky-story-class
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object-python
      - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object-typescript
      - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object
      - id: micro-behaviors/communications/http/upload::upload-file-method-call
      - id: micro-behaviors/communications/http/upload::upload-blob-method-call
      - id: micro-behaviors/communications/http/upload::upload-file-js-method-call

  - id: local-data-read-for-cloud-upload
    desc: Reads local data for cloud transfer
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/read/file::node-sensitive-file-read
      - id: micro-behaviors/fs/read/file::python-sensitive-file-read

  - id: cloud-credential-source-reference
    desc: Cloud credential source candidate for staging context
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::cloud-credentials
      - id: micro-behaviors/os/env/vars/credentials/
      - id: micro-behaviors/os/env/vars/cloud::python-azure-tenant-id-env-read
      - id: micro-behaviors/os/env/vars/credentials::gcp-credential-env-name
      - id: r2-credential-source-reference

  - id: cloud-object-local-data-upload
    desc: Uploads locally read data to cloud storage
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/cloud::object-storage-endpoint
      - id: cloud-object-upload-operation
      - id: local-data-read-for-cloud-upload

  - id: shadow-it-cloud-staging
    desc: Maps assets before credentialed cloud staging
    crit: hostile
    conf: 0.97
    attack: T1041,T1567.002,T1589
    near_bytes: 12000
    all:
      - id: objectives/discovery/network/enumeration::external-cloud-surface-mapping
      - id: cloud-object-local-data-upload
      - id: cloud-credential-source-reference
