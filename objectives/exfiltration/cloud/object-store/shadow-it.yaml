# Cloud object storage repurposed as trusted staging or exfiltration.
# A cloud endpoint is benign by itself; intent requires local data, an upload,
# and cloud credentials or the external/cloud mapping described in the article.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1567.002

traits: []
  # The bare object-storage endpoint atoms that used to sit here moved to
  # micro-behaviors/communications/http/url/cloud (see the note there): naming a
  # storage host is a neutral capability, and keeping it under an exfiltration
  # path made every SDK that ships an endpoint table look like staging. The
  # composite below still reads exactly the same, it just reaches for them
  # cross-directory the way it already did for `aws-s3-url`.
  # The Node sensitive-file read moved to
  # micro-behaviors/fs/read/file/target::node-sensitive-file-read, for the same reason
  # the endpoint atoms moved: the regex only shows a readFileSync of a
  # .env/.config/credentials path, which is neutral file access, and its Python
  # twin was already in the capability namespace.  The composite below reaches
  # for both cross-directory.

  # `r2-credential-source-reference` was the last endpoint-style atom left in
  # this file: an env-var *name* regex, which is the same neutral capability its
  # sibling legs below already read from micro-behaviors/os/env/credentials/.
  # Any S3-compatible upload provider names R2_ACCESS_KEY_ID beside
  # S3_ACCESS_KEY_ID, so on its own it is not exfiltration. It now lives with the
  # other cloud credential env names and is referenced cross-directory.

composite_rules:
  - id: cloud-credential-source-reference
    desc: Cloud credential source candidate for staging context
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/token::cloud-credentials
      - id: micro-behaviors/os/env/secret-name::credential-env-read
      - id: micro-behaviors/os/env/cloud::python-azure-tenant-id-env-read

  # The read legs are referenced directly: the former `local-data-read-for-cloud-upload`
  # umbrella has been removed because it relabeled a neutral sensitive-config
  # read as "for cloud transfer" while firing everywhere either leg fired.
  # The transfer claim lives here, where the endpoint and upload legs supply it.
  - id: cloud-object-local-data-upload
    desc: Uploads locally read data to cloud storage
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/cloud::object-storage-endpoint
      - id: micro-behaviors/communications/http/upload::object-file-upload-api-reference
    any:
      - id: micro-behaviors/fs/read/file/target::node-sensitive-file-read
      - id: micro-behaviors/fs/read/file/target::python-sensitive-file-read

  - id: shadow-it-cloud-staging
    desc: Maps assets before credentialed cloud staging
    crit: hostile
    conf: 0.97
    attack: T1041,T1567.002,T1589
    near_bytes: 12000
    all:
      - id: objectives/discovery/network/enumeration::external-cloud-surface-mapping
      - id: cloud-object-local-data-upload
      - id: cloud-credential-source-reference
