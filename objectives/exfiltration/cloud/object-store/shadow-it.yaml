# Cloud object storage repurposed as trusted staging or exfiltration.
# A cloud endpoint is benign by itself; intent requires local data, an upload,
# and cloud credentials or the external/cloud mapping described in the article.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1567.002

traits:
  - id: s3-object-endpoint
    desc: References an S3 object endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)s3[.-][a-z0-9-]+\.amazonaws\.com'

  - id: r2-object-endpoint
    desc: References a Cloudflare R2 endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: r2.cloudflarestorage.com

  - id: other-object-endpoint
    desc: References another cloud object endpoint
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(digitaloceanspaces|backblazeb2|aliyuncs|myqcloud)\.com'

  - id: node-sensitive-file-read
    desc: Reads a sensitive file in Node
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\breadFileSync\s*\([^)]{0,100}(\.env|\.config|credentials)'

  - id: python-sensitive-file-read
    desc: Reads a sensitive file in Python
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bopen\s*\([^)]{0,100}(\.env|\.config|credentials)'

  - id: aws-shared-credentials-file
    desc: AWS shared credentials file reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.aws[/\\]credentials'

  - id: aws-credential-environment-name
    desc: AWS credential environment name
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)^AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN|SECURITY_TOKEN)$'

  - id: azure-credential-source-reference
    desc: References Azure credential material
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(AZURE_CLIENT_SECRET|AZURE_TENANT_ID)'

  - id: google-credential-source-reference
    desc: References Google credential material
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(GOOGLE_APPLICATION_CREDENTIALS|GOOGLE_CLOUD_KEYFILE_JSON)'

  - id: r2-credential-source-reference
    desc: References R2 credential material
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)R2_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)'

composite_rules:
  - id: aws-credential-source-reference
    desc: References AWS credential material
    crit: notable
    conf: 0.9
    any:
      - id: aws-shared-credentials-file
      - id: aws-credential-environment-name

  - id: cloud-object-storage-endpoint
    desc: References cloud object storage
    crit: notable
    conf: 0.9
    any:
      - id: s3-object-endpoint
      - id: r2-object-endpoint
      - id: other-object-endpoint
      - id: objectives/command-and-control/dropper/delivery/http::suspicious-cloud-image-object--rx-1
      - id: objectives/command-and-control/dropper/delivery/http::suspicious-cloud-image-object--rx-2

  - id: cloud-object-upload-operation
    desc: Performs a cloud object upload
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object-python
      - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object-typescript
      - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object
      - id: micro-behaviors/communications/http/upload::upload-file-method-call
      - id: micro-behaviors/communications/http/upload::upload-blob-method-call
      - id: micro-behaviors/communications/http/upload::upload-file-js-method-call

  - id: local-data-read-for-cloud-upload
    desc: Reads local data for cloud transfer
    crit: notable
    conf: 0.88
    any:
      - id: node-sensitive-file-read
      - id: python-sensitive-file-read

  - id: cloud-credential-source-reference
    desc: References cloud credential material
    crit: notable
    conf: 0.9
    any:
      - id: aws-credential-source-reference
      - id: azure-credential-source-reference
      - id: google-credential-source-reference
      - id: r2-credential-source-reference

  - id: cloud-object-local-data-upload
    desc: Uploads locally read data to cloud storage
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: cloud-object-storage-endpoint
      - id: cloud-object-upload-operation
      - id: local-data-read-for-cloud-upload

  - id: shadow-it-cloud-staging
    desc: Maps assets before credentialed cloud staging
    crit: hostile
    conf: 0.97
    attack: T1041,T1567.002,T1589
    near_bytes: 12000
    all:
      - id: objectives/discovery/network/enumeration::external-cloud-surface-mapping
      - id: cloud-object-local-data-upload
      - id: cloud-credential-source-reference
