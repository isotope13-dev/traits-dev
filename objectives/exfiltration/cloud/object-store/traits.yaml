defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
- id: cloudflare-r2-upload-method--rx-1
  desc: Regex component marker
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\b(PUT|putObject)\b.{0,180}(r2\.cloudflarestorage\.com|R2_ACCESS_KEY|CLOUDFLARE_R2)'
- id: cloudflare-r2-upload-method--rx-2
  desc: Regex component marker
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\b(PutObject|Upload)\b.{0,180}(r2\.cloudflarestorage\.com|R2_ACCESS_KEY|CLOUDFLARE_R2)'
# A named remote after a copy/sync/move command is the useful signal when a
# dual-use transfer binary has been renamed.  The remote syntax is generic
# by design; the rclone-specific option cluster below supplies the tool
# context for the stronger composite.
composite_rules:
  - id: rclone-cloud-transfer
    for: [shell, batch, powershell]
    desc: Rclone copy to named remote
    crit: suspicious
    mbc: E1567.002
    attack: T1567.002
    conf: 0.96
    all:
      - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
      - id: well-known/dual-use/transfer/rclone::rclone-transfer-operator-options

  - id: s3-upload
    for: [javascript]
    desc: S3 upload of targeted credential material
    crit: suspicious
    mbc: E1567.002
    attack: T1567.002
    conf: 0.9
    scope: leaf
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: well-known/dual-use/transfer/rclone::rclone-package-path
      - id: well-known/lib/cloud/aws-crt/
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::amazonaws-domain
      - id: micro-behaviors/communications/http/services/aws-s3::regional-bucket-domain
    all:
      - id: micro-behaviors/communications/http/services/aws-s3::upload-api
      - id: micro-behaviors/fs/path/credential::key-and-connection-file-references
  - id: macos-password-dropbox-exfil
    desc: macOS password prompt with Dropbox upload
    crit: hostile
    mbc: E1567.002,T1056.002
    attack: T1056.002,T1567.002
    conf: 0.99
    for: [shell]
    all:
      - id: micro-behaviors/ui/dialog/prompt::shell-password-prompt-to-file
      - id: micro-behaviors/communications/http/services/dropbox::content-upload-shell
    near_bytes: 1400
  - id: cloudflare-r2-upload
    desc: Cloudflare R2 object upload
    crit: suspicious
    mbc: E1567.002
    attack: T1567.002
    conf: 0.92
    # R2 credentials are used to authenticate ordinary reads as well as
    # writes. Require an upload operation; endpoint and credential references
    # alone describe an R2 client, not an object upload.
    all:
      - id: micro-behaviors/communications/http/url/cloud::cloudflare-r2-url
      - id: cloudflare-r2-upload-method
  - id: cloudflare-r2-secret-exfil
    desc: Cloud credentials uploaded to R2
    crit: hostile
    mbc: E1567.002
    attack: T1567.002
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: cloudflare-r2-upload
      # A cloud client's own auth variables are routine configuration. This
      # hostile claim needs code that scans environment values for credentials.
      - id: objectives/credential-access/env/secrets/filtered-access::node-filtered-secret-scan
  - id: cloudflare-r2-upload-method
    desc: Cloudflare R2 object upload
    crit: notable
    conf: 0.86
    mbc: E1567.002
    attack: T1567.002
    any:
      - id: cloudflare-r2-upload-method--rx-1
      - id: cloudflare-r2-upload-method--rx-2
