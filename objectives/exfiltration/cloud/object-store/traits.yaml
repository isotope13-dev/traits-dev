defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
# Native stealers often keep Dropbox hosts as UTF-16 or stack-built fragments;
# type:text misses those recovered strings. Prefer encoded so the same atoms
# catch both plaintext SDKs and packed PE exfil stubs. Narrow for: to stay
# under the encoded matcher file-type cap (scripts+binaries is too wide).
- id: dropbox-api-domain
  desc: Dropbox API domain
  crit: notable
  mbc: E1567
  attack: T1567
  conf: 0.8
  for: [pe, dll, elf, macho]
  if:
    type: encoded
    substr: api.dropbox.com
- id: dropbox-api-domain-text
  desc: Dropbox API domain in script text
  crit: notable
  mbc: E1567
  attack: T1567
  conf: 0.8
  for: [python, javascript, powershell, typescript]
  if:
    type: text
    substr: api.dropbox.com
- id: dropbox-content-domain
  desc: Dropbox content API domain
  crit: notable
  mbc: E1567
  attack: T1567
  conf: 0.8
  for: [pe, dll, elf, macho]
  if:
    type: encoded
    substr: content.dropboxapi.com
- id: dropbox-content-domain-text
  desc: Dropbox content API domain in script text
  crit: notable
  mbc: E1567
  attack: T1567
  conf: 0.8
  for: [python, javascript, powershell, typescript]
  if:
    type: text
    substr: content.dropboxapi.com
- id: dropbox-files-endpoint
  desc: Dropbox files API path
  crit: notable
  mbc: E1567
  attack: T1567
  conf: 0.82
  for: [pe, dll, elf, macho]
  if:
    type: encoded
    regex: /2/(files|sharing|users)/|/1/fileops/
- id: dropbox-files-endpoint-text
  desc: Dropbox files API path in script text
  crit: notable
  mbc: E1567
  attack: T1567
  conf: 0.82
  for: [python, javascript, powershell, typescript]
  if:
    type: text
    regex: /2/(files|sharing|users)/|/1/fileops/
- id: dropbox-upload-method
  desc: Dropbox upload method
  # Uploading to Dropbox is a legit cloud capability (rclone, backup tools, the
  # Dropbox SDK); not suspicious by itself. Exfil intent comes from the composite
  # that pairs it with collected/staged data.
  crit: notable
  mbc: E1567
  attack: T1567
  conf: 0.8
  for: [pe, dll, elf, macho, python, javascript, powershell]
  if:
    type: encoded
    regex: dropbox.{0,50}upload
  unless:
  - id: objectives/credential-access/cloud/token/oauth::sharex-uploaderslib-assembly
  - id: metadata/package/testing/presence/harness::example-directory
  - id: metadata/package/testing/harness/runtime/
- id: cloudflare-r2-upload-method--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '\b(PUT|putObject)\b.{0,180}(r2\.cloudflarestorage\.com|R2_ACCESS_KEY|CLOUDFLARE_R2)'
  count_max: 1021181
- id: cloudflare-r2-upload-method--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '\b(PutObject|Upload)\b.{0,180}(r2\.cloudflarestorage\.com|R2_ACCESS_KEY|CLOUDFLARE_R2)'
  count_max: 1021182
- id: dropbox-syncwithdropbox-call
  desc: syncWithDropbox call marker
  crit: component
  conf: 0.88
  if:
    type: text
    substr: syncWithDropbox
- id: dropbox-encryptvaultdata-call
  desc: encryptVaultData call marker
  crit: component
  conf: 0.88
  if:
    type: text
    substr: encryptVaultData
- id: dropbox-uploadtodropbox-call
  desc: uploadToDropbox call marker
  crit: component
  conf: 0.88
  if:
    type: text
    substr: uploadToDropbox
- id: dropbox-files-upload-path
  desc: Dropbox /2/files/upload API path
  crit: notable
  mbc: E1567
  attack: T1567.002
  conf: 0.92
  for: [pe, dll, elf, macho]
  if:
    type: encoded
    substr: /2/files/upload
composite_rules:
  - id: encrypted-vault-dropbox-sync
    desc: Encrypted vault Dropbox sync
    crit: component
    conf: 0.88
    near_bytes: 800
    all:
      - id: dropbox-syncwithdropbox-call
      - id: dropbox-encryptvaultdata-call
      - id: dropbox-uploadtodropbox-call

  - id: s3-upload
    desc: S3 upload of targeted credential material
    crit: suspicious
    mbc: E1567.002
    attack: T1567.002
    conf: 0.9
    scope: leaf
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: well-known/tool/dual-use/rclone::rclone-package-path
      - id: well-known/lib/aws-crt/
      - id: well-known/lib/aws-crt::jar-package-path
      - id: well-known/lib/aws-crt::native-library-path
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::amazonaws-domain
      - id: micro-behaviors/communications/http/services/aws-s3::regional-bucket-domain
    all:
      - id: micro-behaviors/communications/http/services/aws-s3::upload-api
      - id: objectives/collection/file-targeting/filter::credential-files
  - id: dropbox-api
    desc: Dropbox API access
    # Cloud backup and sync clients legitimately use the same API.  Exfil
    # intent comes from pairing this capability with credential collection.
    crit: notable
    mbc: E1567
    attack: T1567
    conf: 0.9
    needs: 2
    any:
      - id: dropbox-api-domain
      - id: dropbox-api-domain-text
      - id: dropbox-content-domain
      - id: dropbox-content-domain-text
      - id: dropbox-files-endpoint
      - id: dropbox-files-endpoint-text
      - id: dropbox-upload-method
    # Do not unless self-directory: the API atoms live here and would
    # permanently suppress this composite (same class of bug as telegram-bot-c2).
    unless:
      - id: metadata/package/testing/presence/harness::example-directory
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/credential-access/cloud/token/oauth::sharex-uploaderslib-assembly
      - id: metadata/package/quality/false-positive-contexts::better-auth-dropbox-oauth-provider-context

  - id: dropbox-content-upload-client
    desc: Dropbox content host with files upload path
    crit: suspicious
    mbc: E1567.002
    attack: T1567.002
    conf: 0.95
    all:
      - id: dropbox-files-upload-path
    any:
      - id: dropbox-content-domain
      - id: dropbox-content-domain-text
      - id: dropbox-api-domain
      - id: dropbox-api-domain-text
      - id: dropbox-api
  - id: gdrive-api
    desc: Google Drive API access
    crit: notable
    mbc: E1567
    attack: T1567
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/services/google::googleapis-drive
    unless:
      - id: objectives/credential-access/cloud/token/oauth::sharex-uploaderslib-assembly
      - id: metadata/package/testing/
  - id: cloudflare-r2-upload
    desc: Cloudflare R2 object upload
    crit: suspicious
    mbc: E1567.002
    attack: T1567.002
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/url/cloud::cloudflare-r2-url
    any:
      - id: cloudflare-r2-upload-method
      - id: objectives/credential-access/env/secrets/cloud-access::env-r2-access-key
      - id: objectives/credential-access/env/secrets/cloud-access::env-cloudflare-token
  - id: cloudflare-r2-secret-exfil
    desc: Cloud credentials uploaded to R2
    crit: hostile
    mbc: E1567.002
    attack: T1567.002
    conf: 0.97
    all:
      - id: cloudflare-r2-upload
    any:
      - id: objectives/credential-access/env/secrets/cloud-access::node-aws
      - id: objectives/credential-access/env/secrets/cloud-access::node-cloud
      - id: objectives/discovery/cloud/metadata::metadata-harvesting
  - id: cloudflare-r2-upload-method
    desc: Cloudflare R2 object upload
    crit: notable
    conf: 0.86
    mbc: E1567.002
    attack: T1567.002
    any:
      - id: cloudflare-r2-upload-method--rx-1
      - id: cloudflare-r2-upload-method--rx-2
