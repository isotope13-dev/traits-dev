# Staging the Active Directory database (ntds.dit) and pushing it off-box with
# a cloud-transfer CLI is domain-credential exfiltration: whoever holds ntds.dit
# plus the SYSTEM hive can extract every domain hash offline. Storm-2570 dumps
# ntds.dit via an ntdsutil IFM backup, then moves it with s5cmd/rclone to an
# attacker S3 bucket before encryption. The pair is the conviction — a file
# that both names the domain database and drives an off-box transfer client is
# not doing backup — so it survives the operator swapping the dump tool or the
# transfer CLI. ntds.dit reference and the transfer command need not be
# adjacent, so correlate across the file.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.003,T1567.002
  mbc: B0005,E1567.002

composite_rules:
  - id: ntds-database-cloud-exfil
    desc: Exfiltrates the AD database via cloud CLI
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/credential-access/dump/system::ntds-database-file-target
      - id: objectives/collection/archive/upload::archive-transfer-command
