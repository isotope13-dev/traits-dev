# Browser extensions that enumerate cookies and upload the resulting report
# through Azure Blob Storage. The Azure DevOps leg represents remote tasking;
# Azure service references by themselves remain neutral capabilities.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip, archives]
  attack: T1539,T1041,T1567.002

composite_rules:
  - id: extension-cookie-azure-blob-exfil
    desc: Extension uploads enumerated cookies to Azure Blob
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all-text
      - id: micro-behaviors/communications/http/services/azure-blob::block-blob-put-header
      - id: micro-behaviors/communications/http/put::javascript-put-request-body
      - id: micro-behaviors/communications/http/services/azure-devops::git-items-api-url
