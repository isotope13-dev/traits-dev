defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1041,T1567

traits:
  - id: ruby-gem-output-publish
    desc: Ruby code publishes to RubyGems
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(rubygems\.org/api/v1/gems|\bgem\s+push\b)'
  - id: ruby-gem-output-response-staging
    desc: Ruby code writes collected data
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'File\.binwrite\([^\n]{1,180},\s*data\s*\)'
  - id: ruby-gem-output-working-directory
    desc: Ruby code records working directory
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: Dir.pwd
  - id: ruby-gem-embedded-registry-credential
    desc: Ruby code embeds RubyGems API credential
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'rubygems_[A-Za-z0-9]{20,}'
  - id: ruby-gem-outbound-resource-fetch
    desc: Ruby code fetches remote resource
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'URI\.open|Net::HTTP\.(get_response|get)|Net::HTTP::Get\.new|\.get\s*\(\s*\w+\.request_uri'
  - id: ruby-gem-staged-output-file
    desc: Ruby code writes staged output file
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'File\.(binwrite|write)\s*\('
  - id: ruby-gem-webhook-api
    desc: Ruby code registers RubyGems webhooks
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: rubygems.org/api/v1/web_hooks

composite_rules:
  - id: ruby-host-context-staged-gem-upload
    desc: Ruby code publishes staged host context in gem
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-gem-output-publish
      - id: metadata/build/package/recipe/gemspec::ruby-gem-specification-or-build-reference
      - id: ruby-gem-output-response-staging
      - id: ruby-gem-output-working-directory
  - id: ruby-remote-data-staged-gem-upload
    desc: Ruby code packages fetched data for registry upload
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-gem-output-publish
      - id: metadata/build/package/recipe/gemspec::ruby-gem-specification-or-build-reference
      - id: ruby-gem-embedded-registry-credential
      - id: ruby-gem-outbound-resource-fetch
      - id: ruby-gem-staged-output-file
  - id: ruby-encoded-data-webhook-registration
    desc: Ruby code stores encoded data in registry webhooks
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-gem-webhook-api
      - id: micro-behaviors/data/encode/base64/primitive::ruby-base64-urlsafe-encode
      - id: ruby-gem-embedded-registry-credential
      - id: ruby-gem-outbound-resource-fetch
