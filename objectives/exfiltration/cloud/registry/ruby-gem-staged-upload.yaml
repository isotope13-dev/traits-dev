defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1041,T1567

traits:
  - id: ruby-gem-output-response-staging
    desc: Ruby code writes collected data
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'File\.binwrite\([^\n]{1,180},\s*data\s*\)'
  - id: ruby-gem-embedded-registry-credential
    desc: Ruby code embeds RubyGems API credential
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'rubygems_[A-Za-z0-9]{20,}'

composite_rules:
  - id: ruby-host-context-staged-gem-upload
    desc: Ruby code publishes staged host context in gem
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/registry::ruby-gem-output-publish
      - id: metadata/build/package/recipe/gemspec::ruby-gem-specification-or-build-reference
      - id: ruby-gem-output-response-staging
      - id: micro-behaviors/fs/directory/cwd::ruby-dir-pwd-call
  - id: ruby-remote-data-staged-gem-upload
    desc: Ruby code packages fetched data for registry upload
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/registry::ruby-gem-output-publish
      - id: metadata/build/package/recipe/gemspec::ruby-gem-specification-or-build-reference
      - id: ruby-gem-embedded-registry-credential
      - id: micro-behaviors/communications/http/request/netlib::ruby-gem-outbound-resource-fetch
      - id: micro-behaviors/fs/write/file/full/unspecified::ruby-file-output-call
  - id: ruby-encoded-data-webhook-registration
    desc: Ruby code stores encoded data in registry webhooks
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/registry::ruby-gem-webhook-api
      - id: micro-behaviors/data/encode/base64/primitive::ruby-base64-urlsafe-encode
      - id: ruby-gem-embedded-registry-credential
      - id: micro-behaviors/communications/http/request/netlib::ruby-gem-outbound-resource-fetch
