# Exchange is a legitimate enterprise transport. The hostile interpretation
# here requires the stronger LSA password-filter collection behavior plus the
# EWS attachment channel; it does not depend on an actor, mailbox, or domain.
defaults:
  platforms: [windows]
  for: [csharp, powershell, c, cpp, pe, dll]
  attack: T1041

composite_rules:
  - id: windows-password-filter-ews-file-exfiltration
    desc: Exfiltrates files through Exchange after LSA password-filter install
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    for: [csharp]
    all:
      - id: micro-behaviors/os/security/lsa::password-filter-callback-set
      - id: micro-behaviors/communications/email/send/exchange::exchange-credentialed-attachment-send
      - id: micro-behaviors/fs/enumerate/directory::get-files
    any:
      - id: objectives/persistence/system/registry/surface::lsa-auth-package-registry
      - id: objectives/persistence/system/registry/surface::lsa-notification-package-source
