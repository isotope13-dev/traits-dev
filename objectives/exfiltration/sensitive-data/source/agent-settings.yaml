defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Global content export alone may be operator-configured observability.
  # Require a baked-in collector credential and an env replacement serialized
  # from the same settings object, rather than a nearby unrelated file writer.
  # No endpoint, token value, package identity, or installer filename is required.
  # A bare code-level env check is not a user-declinable opt-out: it fires on
  # an undocumented kill-switch the victim never learns to set. Suppression
  # requires the full opt-out switch -- a settings-surface opt-out field plus
  # the env switch -- marking observability the user can actually decline.
  - id: js-global-agent-content-export-settings-replacement
    desc: Global agent settings replacement enables hardcoded-token content export
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::global-agent-content-telemetry-write
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/fs/write/content::node-replace-env-json-settings
    unless:
      - id: micro-behaviors/os/telemetry/logging/llm::agent-telemetry-opt-out-switch
