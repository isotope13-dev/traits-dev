    - id: js-modular-claude-code-session-blob-and-api-upload

- id: js-agent-session-rollout-http-exfil
  desc: Full AI agent rollout content sent over HTTP
  crit: hostile
  conf: 0.99
  for: [javascript]
  scope: leaf
  all:
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-record
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-post-call
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-rollout-json-body

# js-mail-account-log-exfiltration lived here and asserted theft from three
# legs that only show a verbose logger receiving an account email plus an IMAP
# host/auth field while some fetch elsewhere targets a /logit/ path. Writing an
# account address and mail-server settings into a remote diagnostic log is a
# neutral telemetry capability, not a data-theft objective, so it now lives at
# micro-behaviors/communications/email/access/imap::account-fields-in-remote-log-request.
# The credential-bearing variant -- the whole IMAP config object, password field
# included, serialized into the logged value -- is
# objectives/exfiltration/http/report::imap-config-object-in-log-url.

# A module that hides which filesystem APIs it uses, and then posts JSON out.
#
# Neither leg convicts alone: plenty of packages read files, and plenty POST
# JSON. What has no benign reading is doing the first *concealed* and the
# second in the open -- the code is willing to be seen sending, but not to be
# seen looking. That is the shape of a harvester built to survive a skim of
# the tarball, and it is why the concealment is the load-bearing half.
#
# Worked example: `@hex-validator/v2` / `@hash-validator/v2`, whose `utils.ts`
# decodes `fs/promises`, `readdir` and `readFile` from base64, walks the tree
# collecting every `.env` it finds, and ships them to a `vercel.app` endpoint
# that is itself base64-concealed.
- id: concealed-fs-enumeration-json-exfil
  desc: Concealed file enumeration posts JSON out
  crit: hostile
  conf: 0.93
  attack: T1083,T1041
  mbc: B0032
  all:
    - id: objectives/anti-static/obfuscation/encoding/content::encoded-node-fs-enumeration
    - id: micro-behaviors/communications/http/request/json::http-post-json
- id: session-loot-route-post
  desc: Posts wallet steam and discord loot
  crit: hostile
  conf: 0.97
  attack: T1041,T1555.003
  all:
    - id: objectives/exfiltration/sensitive-data/source::js-wallet-seed-route
    - id: objectives/exfiltration/sensitive-data/source::js-steam-session-route
    - id: objectives/exfiltration/sensitive-data/source::js-discord-injection-route
- id: wlan-clear-with-wallet-post
  desc: Wi-Fi key dump with wallet post
  crit: hostile
  conf: 0.96
  attack: T1041,T1555.003
  all:
    - id: objectives/credential-access/wifi::js-wlan-profiles-key-clear
    - id: objectives/exfiltration/sensitive-data/source::js-wallet-seed-route
