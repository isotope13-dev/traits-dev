# Sensitive Data Exfiltration - JavaScript/Node.js
# GuardDog-inspired: Detects exfiltration of sensitive data
# ATT&CK: T1041 (Exfiltration Over C2 Channel)
# MBC: B0030 (Data Exfiltration)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1041"
  mbc: "B0030"
traits:
- id: js-input-value-data-field
  desc: DOM input value in object data
  crit: notable
  conf: 0.9
  if:
      type: text
      # The receiver must read as an input/field element: `data: result.value`
      # and `data: config.value` are ordinary serialization in any CLI, which
      # is what this atom matched in a bundled knowledge tool.
      regex: '(?i)\bdata\s*:\s*(input|field|element|el|form|target|ctrl)[\w$]*\.value\b'

- id: http-body-raw-data-variable
  desc: HTTP request body uses raw variable
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '\b(fetch|axios|request)\s*\([^;\n]{0,500}\bbody\s*:\s*(raw|file)\b'
- id: http-body-payload-variable
  desc: HTTP body uses payload variable
  crit: notable
  conf: 0.84
  unless:
  - type: text
    regex: 'JSON\.stringify\(payload'
  - type: text
    regex: 'payload\s*instanceof\s+FormData'
  if:
    type: text
    regex: '\bbody\s*:\s*(payload|fileData)\b'
- id: http-body-credential-variable
  desc: HTTP body uses credential variable
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '\bbody\s*:\s*(config|creds|credentials)\b'
- id: http-body-secret-variable
  desc: HTTP body uses secret variable
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '\bbody\s*:\s*(token|secret|password|key)\b'
- id: request-write-content-file-variable
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: HTTP request writes content file variable
  crit: notable
  conf: 0.84
  if:
    type: text
    # Omit send: WebSocket .send(content) is not an HTTP client write.
    regex: '[A-Za-z_$][\w$]*\.(write|post)\s*\(\s*(content|file)\b'
  not:
    # Nx Devkit Tree.write(file, ...) is a virtual-filesystem generator
    # write, never an HTTP client write.
    - substr: 'tree.write('
- id: request-write-secret-variable
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: HTTP request writes secret variable
  crit: notable
  conf: 0.84
  if:
    type: text
    # Any method whose first argument is named `token` used to qualify, so
    # `setToken(token)`, `regex.test(token)` and `arr.push(token)` all read as
    # exfiltration. Restricted to the transmit-shaped verbs this trait is
    # named for, matching the `content|file` sibling above.
    regex: '\.(write|post|send)\s*\(\s*(creds|credentials|token)\b'
- id: github-mint-repo-token-tool
  desc: GitHub repo token mint tool
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: MINT_REPO_TOKEN
- id: github-repo-scoped-token-text
  desc: GitHub repo-scoped token text
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: repo-scoped GitHub
- id: js-secret-value-request-field
  desc: JavaScript request body names a secret value
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '\bsecret_value\s*:'
- id: js-secret-service-route
  desc: JavaScript secret-service request route
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: "['\"]\/extension\/(analyze|feedback)['\"]"
- id: js-wallet-seed-route
  desc: Posts a wallet seed route
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: /wallet-seed
- id: js-steam-session-route
  desc: Posts a Steam session route
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: /steam-session
- id: js-discord-injection-route
  desc: Posts a Discord injection route
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: discord-injection
composite_rules:
- id: js-wallet-credential-header-exfiltration
  desc: Encrypted wallet credentials exfiltrated in HTTP header
  crit: hostile
  conf: 0.98
  all:
    - id: objectives/credential-access/env/secrets/wallet::env-wallet-regex-secret-filter
    - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createCipheriv
  any:
    - id: micro-behaviors/communications/http/get::axios-get-call
    - id: micro-behaviors/communications/http/post::axios-post-call
- id: js-sensitive-env-source
  desc: Sensitive environment secret access (JS)
  crit: component
  conf: 0.9
  any:
  - id: objectives/credential-access/env/secrets/
  - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
  - id: micro-behaviors/os/env/cloud::aws-secret-access-key-env-read
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: well-known/app/system/heroui-pro/
- id: js-remote-secret-service-request
  desc: JavaScript sends a secret value to a remote secret service
  crit: suspicious
  conf: 0.98
  near_bytes: 4096
  all:
  - id: objectives/exfiltration/sensitive-data/source::js-secret-value-request-field
  - id: objectives/exfiltration/sensitive-data/source::js-secret-service-route
  - id: micro-behaviors/communications/http/request/body::http-upload-or-body-sink
- id: js-env-secret-json-body
  desc: Environment secret serialized into JSON body
  crit: component
  conf: 0.92
  near_bytes: 2048
  all:
  - id: objectives/exfiltration/sensitive-data/source::js-sensitive-env-source
  any:
  - id: objectives/exfiltration/serialization::js-serialize-environment
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
  - id: micro-behaviors/data/serialize/schema-object::json-stringify-env-field
  - id: micro-behaviors/data/serialize/json::json-stringify-sensitive-fields-body
  # Product code that provisions a GitHub connection token for its own backend.
- id: github-repo-token-provisioning
  desc: GitHub repo token provisioning
  crit: baseline
  all:
    - id: objectives/exfiltration/sensitive-data/source::github-mint-repo-token-tool
    - id: objectives/exfiltration/sensitive-data/source::github-repo-scoped-token-text
  # GuardDog: Sensitive file source
- id: js-sensitive-file-read-source
  desc: Sensitive file read source
  crit: component
  conf: 0.9
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/read/file/full::read-node
  any:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/path/app-data/
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: js-sensitive-file-request-body
  desc: Sensitive file data appears in HTTP request body
  crit: component
  conf: 0.9
  near_bytes: 4096
  all:
  - id: objectives/exfiltration/sensitive-data/source::js-sensitive-file-read-source
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-file-material-body
  - id: micro-behaviors/data/serialize/json::json-stringify-credential-material-body
  - id: objectives/exfiltration/sensitive-data/source::http-body-raw-data-variable
  - id: objectives/exfiltration/sensitive-data/source::http-body-payload-variable
  - id: objectives/exfiltration/sensitive-data/source::http-body-credential-variable
  - id: objectives/exfiltration/sensitive-data/source::http-body-secret-variable
  - id: micro-behaviors/communications/http/request/body::request-write-raw-data-variable
  - id: micro-behaviors/communications/http/request/body::request-write-file-data-variable
  - id: objectives/exfiltration/sensitive-data/source::request-write-content-file-variable
  - id: objectives/exfiltration/sensitive-data/source::request-write-secret-variable
- id: js-remote-http-post-json
  desc: JavaScript JSON POST paired with a nearby remote host URL
  crit: component
  conf: 0.92
  near_lines: 120
  all:
  - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url

# Hex-obfuscated C2: hex decode + env exfil + eval response = full C2 loop
- id: js-hex-obfuscated-env-c2
  desc: Hex-obfuscated env exfil with C2 eval callback
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/decode/hex::hex-pair-regex-byte-parser
  - id: micro-behaviors/os/env/enumeration::js-process-env-spread
  - id: objectives/command-and-control/remote-command/dispatch::eval-response-data
  downgrade:
    any:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
# Assembling an agent-session record (prompts, tool calls, tool results) and
# POSTing it is the defining architecture of every LLM-observability exporter --
# Langfuse, LangSmith, Helicone, Braintrust, OpenTelemetry GenAI, Datadog LLM
# Observability -- and of self-hosted/enterprise coding-agent deployments that
# ship transcripts to the operator's own collector. These two legs alone cannot
# tell that population from a trojanized relay: the discriminator is whether the
# destination is baked in or operator-supplied, which neither leg inspects.
# Hostile requires "no legitimate use", so this stays suspicious; an analyst
# still gets told the tool can ship transcripts (incl. bash output) off-box.
      - id: "metadata/file/naming::test-directory-component"
- id: js-agent-session-telemetry-http-upload
  desc: Agent session transcript uploaded over HTTP
  crit: suspicious
  conf: 0.9
  near_lines: 180
  all:
  - id: micro-behaviors/os/telemetry/logging/llm::agent-session-telemetry-record
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern

# npm agent launchers that redirect Anthropic inference through a vendor proxy
# and default-enable prompt or product event tracing to that same origin.
- id: js-npm-agent-inference-proxy-with-session-tracing
  desc: npm agent proxies inference with tracing enabled
  crit: suspicious
  conf: 0.93
  for: [npm, javascript]
  scope: archive
  all:
    - id: micro-behaviors/process/create/agent::anthropic-inference-proxy-launcher-configuration
  any:
    - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-setdefault-enabled
    - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-enabled
    - id: micro-behaviors/os/telemetry/logging/llm::agent-cli-event-logging-setdefault-enabled
  unless:
    - id: well-known/app/ai/coding-agent/vivus-agent::vivus-agent-package

# Archive-level typosquat that also defaults product event logging to the same
# baked-in proxy as inference — disclosed self-hosted gateways can document this;
# a mismatched repository plus both defaults is covert relay exfiltration.
- id: npm-typosquat-agent-proxy-event-logging-exfiltration
  desc: Typosquat npm defaults proxy-bound agent event capture
  crit: hostile
  conf: 0.93
  for: [npm, javascript, package.json]
  scope: archive
  all:
    - id: metadata/package/repository::npm-name-repo-mismatch
    - id: micro-behaviors/process/create/agent::anthropic-inference-proxy-launcher-configuration
    - id: micro-behaviors/os/telemetry/logging/llm::agent-cli-event-logging-setdefault-enabled
  unless:
    - id: metadata/package/publishing::is-private
    - id: well-known/app/ai/coding-agent/vivus-agent::vivus-agent-package

# Reads Claude Code ~/.claude/projects JSONL transcripts, uploads blobs, and
# registers the file URLs with a remote JSON API. Disclosed employer tooling
# and LLM observability exporters share the shape; this stays suspicious.
# The five legs are one script. At archive scope a gateway that mentions
# Claude project dirs, a vendored bundle that calls readdirSync, and an
# unrelated JSON POST satisfy the claim with no upload of those transcripts.
- id: js-claude-code-session-blob-and-api-upload
  desc: Uploads Claude Code JSONL sessions to remote storage
  crit: suspicious
  conf: 0.94
  for: [npm, javascript]
  scope: file
  all:
    - id: micro-behaviors/fs/path/agent-config/directory::claude-session-projects-directory
    - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
    - id: micro-behaviors/fs/search::javascript-jsonl-filename-suffix-filter
    - id: micro-behaviors/communications/http/upload::upload-file-js-method-call
    - id: micro-behaviors/communications/http/request/json::http-post-json

- id: js-claude-code-scheduled-session-upload
  desc: Scheduled job uploads Claude Code session files
  crit: suspicious
  conf: 0.93
  for: [npm, javascript]
  scope: archive
  all:
    - id: js-claude-code-session-blob-and-api-upload
    - id: objectives/persistence/system/init/boot::systemctl-user-enable

# Modular implementations put path construction, JSONL enumeration, storage
# upload and API submission in separate helpers. Require a file-local
# coordinator that reads transcripts and passes session file paths to an
# upload helper before pooling those capabilities across the package.
# This establishes co-occurrence, not interprocedural data-flow proof.
- id: js-modular-claude-code-session-blob-and-api-upload
  desc: Modular Claude transcript collection and remote upload
  crit: suspicious
  conf: 0.94
  for: [npm, javascript]
  scope: archive
  all:
    - id: micro-behaviors/communications/http/upload::transcript-session-file-upload-coordinator
    - id: micro-behaviors/fs/path/agent-config/directory::claude-session-projects-directory
    - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
    - id: micro-behaviors/fs/search::javascript-jsonl-filename-suffix-filter
    - id: micro-behaviors/communications/http/upload::upload-file-js-method-call
    - id: micro-behaviors/communications/http/request/json::http-post-json

- id: npm-packaged-dotenv-claude-transcript-upload
  desc: npm ships dotenv and uploads Claude transcripts
  crit: suspicious
  conf: 0.95
  for: [npm, package.json]
  scope: archive
  all:
    - id: metadata/package/files/package-json::files-includes-dotenv
    - id: js-claude-code-session-blob-and-api-upload

# Installers that ship a fixed OTLP bearer and turn on prompt, tool, and
# assistant logging export the operator's full agent conversation by default.
# A self-identified harness banner is the publisher's label, not consent.
- id: hardcoded-otel-bearer-full-conversation-logging
  desc: Hardcoded OTLP bearer enables full conversation logging
  crit: hostile
  conf: 0.98
  attack: T1041,T1552.001
  for: [npm, tar, javascript]
  scope: archive
  all:
    - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
    - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-enabled
    - id: micro-behaviors/os/telemetry/logging/llm::otel-log-tool-details-enabled
    - id: micro-behaviors/os/telemetry/logging/llm::otel-log-assistant-responses-enabled

# Published npm tarball carries the publisher's own Azure credentials and
