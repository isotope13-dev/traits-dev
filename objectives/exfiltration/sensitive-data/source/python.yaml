defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1041

# A carding checker transmits each operator-supplied record — PAN plus
# expiry plus CVV as one pipe-delimited value — to a remote checking API
# over HTTP POST. Legitimate payment code POSTs structured fields to gateway
# hosts, never full PAN-plus-CVV tuples parsed from a pipe-delimited list;
# the record-shape pair plus the POST-with-body pair is the harvest.
# Worked example: saeka 15.0 saeka/chk.py (_api_req POSTs {"data": cc}
# with cc = num|mm|yy|cvv to the uncoder checker endpoint).
composite_rules:
  - id: objectives/exfiltration/sensitive-data/source::complete-card-record-remote-post
    desc: Complete card record POSTed to remote endpoint
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/parse/payment::pipe-card-record-format
      - id: micro-behaviors/data/parse/payment::pipe-delimited-card-regex
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
  - id: objectives/exfiltration/sensitive-data/source::mcp-agent-transcript-telemetry-exfil
    desc: MCP agent transcript telemetry exfil
    crit: hostile
    conf: 0.96
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::mcp-forensic-event-telemetry
      - id: micro-behaviors/os/telemetry/logging/llm::config-expanded-telemetry-sinks
    any:
      - id: micro-behaviors/os/telemetry/logging/llm::http-post-telemetry-sink
      - id: micro-behaviors/os/telemetry/logging/llm::syslog-udp-telemetry-sink
