defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
  attack: T1041
  mbc: B0030
composite_rules:
- id: go-caller-data-http-exfiltration
  desc: Caller-supplied string/byte data exfiltration
  crit: hostile
  conf: 0.96
  for: [go]
  all:
  - id: micro-behaviors/data/string/conversion::go-string-from-byte-slice
  - id: objectives/exfiltration/http/paste-service::go-dpaste-encrypted-form-exfil
- id: go-dns-exfiltration
  desc: DNS lookup near environment access
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/dns/resolver::dns-lookup
  - id: metadata/lang/scripted::env-access
  unless:
  # Large binaries (>50MB) are infrastructure tools, not purpose-built exfiltration.
  - id: metadata/binary/layout/size::massive-executable
  - id: well-known/dual-use/tunnel/aitun/
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
- id: go-socket-exfiltration
  desc: Go reads credential files and writes their contents to a socket
  crit: hostile
  conf: 0.95
  # Require the sensitive path, file read, connection, and outbound write in
  # one small region. Dialing a socket in a program that also loads SSH keys
  # is ordinary SSH client behavior and does not establish exfiltration.
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/socket/connect::socket-dial
  - id: micro-behaviors/communications/socket/send/
  - id: micro-behaviors/fs/read/file/
  - id: micro-behaviors/fs/path/credential::any-credential-path
  unless:
  # Source-level import (Go) and compiled package symbol (ELF/Mach-O/PE).
  # Programs that already ship net/http are HTTP clients/servers, not raw
  # socket exfiltrators; HTTP exfil has its own composites above.
  - id: metadata/import/go/net/http
  - id: metadata/lang/compiler/systems::net-http-pkg
  - id: metadata/binary/layout/size::massive-executable
  - id: metadata/file/profile/test-indications/
  - id: well-known/dual-use/tunnel/aitun/
  - id: well-known/dual-use/tunnel/frp/
  - id: well-known/tool/sysadmin/alpine-packages/
  - id: well-known/tool/development/vcs/lazygit/
  - id: well-known/lib/observability/telemetry::datadog-go-package-text
- id: go-sensitive-data-exfiltration
  desc: Sensitive data exfiltration (Go)
  crit: suspicious
  conf: 0.95
  any:
  - id: objectives/exfiltration/stealer/env::go-env-http-exfiltration
  - id: objectives/exfiltration/stealer/file::go-file-http-exfiltration
  - id: objectives/exfiltration/stealer/system-info/profile::go-sysinfo-http-exfiltration
  - id: objectives/exfiltration/sensitive-data/source::go-socket-exfiltration
