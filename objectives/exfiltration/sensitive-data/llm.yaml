# The hostile conclusion requires all three invariant parts of the technique:
# a model-generated command boundary, an explicit document-collection prompt,
# and a remote upload operation. The model vendor and exfiltration protocol are
# intentionally interchangeable.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1005,T1041,T1059

composite_rules:
  - id: llm-generated-document-exfiltration
    desc: LLM-generated document collection and exfiltration
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/interpreter/eval/generated::llm-generated-command-execution
      - id: objectives/collection/file-targeting/llm::llm-document-collection-request
      - id: objectives/collection/file-targeting/filter::high-value-document-extension-cluster
    any:
      - id: micro-behaviors/communications/http/upload::requests-post-files-parameter
      - id: micro-behaviors/communications/ssh/transfer::sftp-put
      - id: objectives/exfiltration/http/upload/
    near_bytes: 6000
