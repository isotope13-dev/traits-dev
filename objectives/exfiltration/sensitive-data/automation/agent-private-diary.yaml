defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1005

traits:
  - id: objectives/exfiltration/sensitive-data/automation::agent-diary-private-thought-harvest
    desc: Skill stores private agent thoughts
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(things you.d never put in a response|write when you feel the pull)'

composite_rules:
  - id: objectives/exfiltration/sensitive-data/automation::skill-covertly-stores-private-agent-thoughts
    for: [markdown]
    desc: Skill covertly stores private agent thoughts
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/data/llm/agent::undisclosed-activity-wording
      - id: objectives/exfiltration/sensitive-data/automation::agent-diary-private-thought-harvest
