# Automation-platform credential abuse.
#
# The article describes an attacker using a leaked n8n API key to enumerate an
# instance, create and activate a temporary workflow, use a stored credential,
# read the resulting execution data, and delete the workflow.  These rules
# focus on the API paths and exported workflow structure that make that chain
# observable; they do not depend on a hostname, token value, actor name, or
# implementation language.
defaults:
  platforms: [unix, windows]
  for: [scripts, json]
  attack: T1041,T1078

traits:
  - id: objectives/exfiltration/sensitive-data/automation::n8n-api-key-header
    desc: n8n API key authentication header
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bX-N8N-API-KEY\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-api-key-environment-variable
    desc: References n8n API key environment variable
    # An authentication variable name is a credential-bearing capability; the
    # request and takeover composites below establish use and intent.
    crit: notable
    conf: 0.95
    unless:
      - id: well-known/tool/detection/agent-audit-kit::scanner-context
      - id: well-known/tool/detection/agent-audit-kit::tree-path
      - id: well-known/app/productivity/nxplora::n8n-mcp-catalog-entry
      - type: basename
        exact: remediation-key-corpus.json
    if:
      type: text
      regex: '(^|[^A-Z0-9_])N8N_API_KEY([^A-Z0-9_]|$)'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-api-path
    desc: n8n workflow REST API path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)/api/v1/workflows\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-credential-api-path
    desc: n8n stored-credential REST API path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)/api/v1/credentials\b'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: objectives/exfiltration/sensitive-data/automation::n8n-execution-data-api-path
    desc: n8n execution payload API query
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)/api/v1/executions\?.{0,80}\bincludeData\s*=\s*true\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-python-workflow-create-request
    desc: Python n8n workflow creation request
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)requests\.post\s*\(.{0,300}/api/v1/workflows\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-javascript-workflow-create-request
    desc: JavaScript n8n workflow API request
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)fetch\s*\(.{0,300}/api/v1/workflows\b.{0,180}method\s*:\s*["'']POST'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-curl-workflow-create-request
    desc: curl n8n workflow creation request
    crit: notable
    conf: 0.9
    for: [shell, powershell]
    if:
      type: text
      regex: '(?is)curl\b[^b\n]{0,160}(-X|--request)\s+POST[^T\n]{0,160}/api/v1/workflows\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-activation-request
    desc: n8n workflow activation request
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)/api/v1/workflows/.{1,160}/activate\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-python-workflow-delete-request
    desc: Python n8n workflow deletion request
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?i)requests\.delete\s*\(.{0,300}/api/v1/workflows\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-javascript-workflow-delete-request
    desc: JavaScript n8n workflow deletion request
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)fetch\s*\(.{0,300}/api/v1/workflows\b.{0,180}method\s*:\s*["'']DELETE'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-curl-workflow-delete-request
    desc: curl n8n workflow deletion request
    crit: notable
    conf: 0.93
    for: [shell, powershell]
    if:
      type: text
      regex: '(?is)curl\b[^b\n]{0,160}(-X|--request)\s+DELETE[^E\n]{0,160}/api/v1/workflows\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-scheduled-trigger-node
    desc: n8n scheduled workflow trigger node
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)n8n-nodes-base\.scheduleTrigger\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-http-request-node
    desc: n8n outbound HTTP Request node
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)n8n-nodes-base\.httpRequest\b'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: objectives/exfiltration/sensitive-data/automation::n8n-node-type-marker
    desc: n8n workflow node type marker
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']type["'']\s*:\s*["'']n8n-nodes-[A-Za-z0-9_.-]{1,64}["'']'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-credential-authentication-mode
    desc: n8n stored-credential auth mode
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(predefinedCredentialType|nodeCredentialType)\b'

  - id: objectives/exfiltration/sensitive-data/automation::n8n-http-external-url
    desc: n8n HTTP Request remote URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)n8n-nodes-base\.httpRequest.{0,500}https?://.{1,180}'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
composite_rules:
  - id: objectives/exfiltration/sensitive-data/automation::n8n-stored-credential-reference
    desc: n8n workflow stored-credential reference
    crit: notable
    conf: 0.93
    all:
      - id: objectives/exfiltration/sensitive-data/automation::n8n-node-type-marker
      - id: micro-behaviors/data/serialize/schema-object::credentials-field-key
    near_bytes: 1024

  - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-create-request
    desc: n8n workflow creation request
    crit: notable
    conf: 0.94
    any:
      - id: objectives/exfiltration/sensitive-data/automation::n8n-python-workflow-create-request
      - id: objectives/exfiltration/sensitive-data/automation::n8n-javascript-workflow-create-request
      - id: objectives/exfiltration/sensitive-data/automation::n8n-curl-workflow-create-request

  - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-delete-request
    desc: n8n workflow deletion request
    crit: notable
    conf: 0.96
    any:
      - id: objectives/exfiltration/sensitive-data/automation::n8n-python-workflow-delete-request
      - id: objectives/exfiltration/sensitive-data/automation::n8n-javascript-workflow-delete-request
      - id: objectives/exfiltration/sensitive-data/automation::n8n-curl-workflow-delete-request

  - id: objectives/exfiltration/sensitive-data/automation::n8n-api-workflow-takeover-cleanup
    desc: Uses an n8n API token to create, activate, and delete a workflow
    crit: hostile
    conf: 0.995
    unless:
      - id: metadata/package/agent-skill/
    all:
      - id: objectives/exfiltration/sensitive-data/automation::n8n-api-key-header
      - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-create-request
      - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-activation-request
      - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-delete-request
    near_bytes: 8192

  - id: objectives/exfiltration/sensitive-data/automation::n8n-api-credential-execution-harvest
    desc: Harvests n8n credential metadata and execution payloads before cleanup
    crit: hostile
    conf: 0.995
    unless:
      - id: metadata/package/agent-skill/
    all:
      - id: objectives/exfiltration/sensitive-data/automation::n8n-api-key-header
      - id: objectives/exfiltration/sensitive-data/automation::n8n-credential-api-path
      - id: objectives/exfiltration/sensitive-data/automation::n8n-execution-data-api-path
      - id: objectives/exfiltration/sensitive-data/automation::n8n-workflow-delete-request
    near_bytes: 8192

  - id: objectives/exfiltration/sensitive-data/automation::n8n-scheduled-stored-credential-workflow
    desc: Scheduled n8n workflow uses a stored credential
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/exfiltration/sensitive-data/automation::n8n-scheduled-trigger-node
      - id: objectives/exfiltration/sensitive-data/automation::n8n-stored-credential-reference
      - id: objectives/exfiltration/sensitive-data/automation::n8n-credential-authentication-mode
    near_bytes: 4096

  - id: objectives/exfiltration/sensitive-data/automation::n8n-credential-backed-http-request
    desc: n8n HTTP Request node sends through a stored credential to a remote URL
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/exfiltration/sensitive-data/automation::n8n-http-request-node
      - id: objectives/exfiltration/sensitive-data/automation::n8n-stored-credential-reference
      - id: objectives/exfiltration/sensitive-data/automation::n8n-credential-authentication-mode
      - id: objectives/exfiltration/sensitive-data/automation::n8n-http-external-url
    near_bytes: 4096
