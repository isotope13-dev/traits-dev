# CSS-only exfiltration of data already rendered into a trusted page or webmail
# UI. The attacker cannot read the DOM, so each rule turns one guess about the
# rendered text into a resource request; the request that arrives at the
# collection host is the leaked character. The selector and @font-face shapes
# are neutral CSS observations and live in
# micro-behaviors/data/format/css/ — these composites add the exfiltration
# consequence by pairing a sweep with the remote load it triggers.
defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1041

composite_rules:
  - id: css-attribute-value-character-oracle
    desc: CSS attribute-value sweep leaks matched characters through remote loads
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/css::content-attribute-selector-sweep
    any:
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
      - id: micro-behaviors/communications/http/client/resource::stylesheet-image-set-external-fallback
    near_bytes: 256

  - id: css-glyph-font-codepoint-oracle
    desc: Per-glyph webfont oracle leaks rendered characters to a remote host
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/css::single-codepoint-font-face-sweep
      - id: micro-behaviors/communications/http/client/resource::stylesheet-font-face-remote-url
      - id: micro-behaviors/data/format/css::css-rule-font-family-use
    # The remote font reference and its use must occur in the same stylesheet.
    near_bytes: 12000
