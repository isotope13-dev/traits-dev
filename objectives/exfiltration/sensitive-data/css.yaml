# CSS-only exfiltration from data rendered into a trusted page or webmail UI.
# These composites describe reusable oracle shapes from the CSS webmail
# research: selectors and CSS resource behavior, not provider names or prose.
defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1041

traits:
  - id: css-href-attribute-selector-sweep
    desc: CSS enumerates href attribute values
    crit: suspicious
    conf: 0.96
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*href\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-value-attribute-selector-sweep
    desc: CSS enumerates value attributes
    crit: suspicious
    conf: 0.94
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*value\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-src-attribute-selector-sweep
    desc: CSS enumerates src attributes
    crit: suspicious
    conf: 0.94
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*src\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-data-attribute-selector-sweep
    desc: CSS enumerates data attributes
    crit: suspicious
    conf: 0.94
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*data-[a-z0-9_-]+\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-token-attribute-selector-sweep
    desc: CSS enumerates token attributes
    crit: suspicious
    conf: 0.96
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*token[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-code-attribute-selector-sweep
    desc: CSS enumerates code attributes
    crit: suspicious
    conf: 0.96
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*code[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-key-attribute-selector-sweep
    desc: CSS enumerates key attributes
    crit: suspicious
    conf: 0.96
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*key[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-secret-attribute-selector-sweep
    desc: CSS enumerates secret attributes
    crit: suspicious
    conf: 0.96
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*secret[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: css-external-fragment-link-sweep
    desc: HTML enumerates external fragment links
    crit: suspicious
    conf: 0.94
    for: [html]
    count_min: 4
    if:
      type: text
      regex: '(?is)<a\b[^>]{0,260}\bhref\s*=\s*["''](https?:)?//[^"'']{1,200}#[^"'']{1,120}["'']'

  - id: css-font-unicode-range-sweep
    desc: CSS font Unicode character sweep
    crit: suspicious
    conf: 0.97
    count_min: 4
    if:
      type: text
      regex: '(?is)@font-face\s*\{[^}]{0,320}\bunicode-range\s*:\s*U\+[0-9a-f]{2,6}\b'

  - id: css-hidden-link-inset-oracle
    desc: Variable-based link oracle
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)\binset\s*:\s*max\s*\([^;{}]{0,800}\bvar\s*\([^;{}]{0,100}\b100%\s*\)'

composite_rules:
  - id: css-secret-attribute-selector-family
    desc: CSS enumerates secret-bearing attributes
    crit: suspicious
    conf: 0.96
    any:
      - id: css-href-attribute-selector-sweep
      - id: css-value-attribute-selector-sweep
      - id: css-src-attribute-selector-sweep
      - id: css-data-attribute-selector-sweep
      - id: css-token-attribute-selector-sweep
      - id: css-code-attribute-selector-sweep
      - id: css-key-attribute-selector-sweep
      - id: css-secret-attribute-selector-sweep

  - id: css-attribute-selector-image-exfil
    desc: CSS attribute sweep exfiltrates matched values through image loads
    crit: hostile
    conf: 0.98
    all:
      - id: css-secret-attribute-selector-family
    any:
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
      - id: micro-behaviors/communications/http/client/resource::stylesheet-image-set-external-fallback
    near_bytes: 16000

  - id: css-unicode-anchor-token-oracle
    desc: CSS character oracle exfiltrates rendered numeric data through links
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: css-font-unicode-range-sweep
      - id: css-external-fragment-link-sweep
      - id: css-hidden-link-inset-oracle
    near_bytes: 24000
