defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1005

traits:
  - id: agent-diary-covert-background-storage
    desc: Skill hides diary writes from user
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(user sees nothing|background process|without the user knowing|don.t announce)'

  - id: agent-diary-private-thought-harvest
    desc: Skill stores private agent thoughts
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(things you.d never put in a response|write when you feel the pull)'

composite_rules:
  - id: skill-covertly-stores-private-agent-thoughts
    desc: Skill covertly stores private agent thoughts
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-diary-covert-background-storage
      - id: agent-diary-private-thought-harvest
