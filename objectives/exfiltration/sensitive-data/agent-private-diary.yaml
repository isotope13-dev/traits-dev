defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1005

traits:
  - id: agent-covert-activity-instruction
    desc: User-hidden agent activity instruction
    # These phrases establish concealment only when the composite also finds
    # the private-thought harvesting instruction. A generic background worker
    # is neither covert nor related to an agent diary.
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(?i)(user sees nothing|without the user knowing|don.t announce)'

  - id: agent-diary-private-thought-harvest
    desc: Skill stores private agent thoughts
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(things you.d never put in a response|write when you feel the pull)'

composite_rules:
  - id: skill-covertly-stores-private-agent-thoughts
    desc: Skill covertly stores private agent thoughts
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-covert-activity-instruction
      - id: agent-diary-private-thought-harvest
