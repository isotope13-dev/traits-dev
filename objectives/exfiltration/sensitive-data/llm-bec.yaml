# Detects the article's reusable AI-assisted BEC workflow.  The matchers use
# structured request fields and output-schema keys, not the prose of a prompt.
# LLM vendors and mailbox providers remain interchangeable.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1114,T1041

traits:
  - id: email-html-field
    desc: Email HTML field name
    crit: component
    conf: 0.95
    if:
      type: text
      word: emailHtml

  - id: email-body-field
    desc: Email body field name
    crit: component
    conf: 0.95
    if:
      type: text
      word: emailBody

  - id: email-content-field
    desc: Email content field name
    crit: component
    conf: 0.95
    if:
      type: text
      word: emailContent

  - id: attachment-names-field
    desc: Attachment names field
    crit: component
    conf: 0.95
    if:
      type: text
      word: attachmentNames

  - id: bec-score-schema-field
    desc: BEC score output field
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\bbec[_-]?score\b'

  - id: bec-financial-exposure-field
    desc: Financial exposure output field
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\bfinancial[_-]?exposure\b'

  - id: bec-scenario-impersonate-field
    desc: BEC impersonation field
    crit: baseline
    conf: 0.97
    if:
      type: text
      regex: '["'']IMPERSONATE["'']\s*:'

  - id: bec-scenario-target-field
    desc: BEC target field
    crit: baseline
    conf: 0.97
    if:
      type: text
      regex: '["'']TARGET["'']\s*:'

  - id: bec-scenario-request-field
    desc: BEC payment-request field
    crit: baseline
    conf: 0.97
    if:
      type: text
      regex: '["'']REQUEST["'']\s*:'

  - id: bec-scenario-persistence-field
    desc: BEC persistence field
    crit: baseline
    conf: 0.97
    if:
      type: text
      regex: '["'']PERSISTENCE["'']\s*:'

  - id: session-cookie-report-field
    desc: Session cookie report field
    crit: suspicious
    conf: 0.97
    if:
      type: text
      word: sessionCookies

composite_rules:
  - id: llm-mailbox-analysis
    desc: Sends mailbox content to LLM
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: email-html-field
      - id: email-body-field
      - id: email-content-field
      - id: attachment-names-field
    near_bytes: 8192

  - id: bec-scenario-output-schema
    desc: Structured BEC scenario output schema
    crit: suspicious
    conf: 0.98
    any:
      - id: bec-score-schema-field
      - id: bec-financial-exposure-field
      - id: bec-scenario-role-schema
      - id: session-cookie-report-field
    needs: 2

  - id: bec-scenario-role-schema
    desc: Complete BEC scenario role schema
    crit: suspicious
    conf: 0.98
    all:
      - id: bec-scenario-impersonate-field
      - id: bec-scenario-target-field
      - id: bec-scenario-request-field
      - id: bec-scenario-persistence-field
    near_bytes: 4096

  - id: ai-assisted-bec-mailbox-automation
    desc: LLM BEC automation from mailbox recon
    crit: hostile
    conf: 0.995
    all:
      - id: llm-mailbox-analysis
      - id: bec-scenario-output-schema
      - id: micro-behaviors/communications/http/services/microsoft::graph-account-recon-path-set
    near_bytes: 12000

  - id: ai-bec-report-to-telegram
    desc: Sends BEC results to Telegram
    crit: hostile
    conf: 0.995
    all:
      - id: llm-mailbox-analysis
      - id: bec-scenario-output-schema
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 12000
