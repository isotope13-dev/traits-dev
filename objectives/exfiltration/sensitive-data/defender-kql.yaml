# Defender Advanced Hunting queries that trace a sensitivity-labeled endpoint
# file into outbound email telemetry. Atoms describe KQL table, field, and
# operator structure, not tenant labels or example domains.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, powershell, python, shell, go, csharp, text, data]
  attack: T1041
  mbc: B0030

traits:
  - id: defender-endpoint-sensitive-file-source
    desc: Defender labeled endpoint file source
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bDeviceFileEvents\b.{0,700}\bSensitivityLabel\b'

  - id: defender-endpoint-file-hash-field
    desc: Endpoint file telemetry SHA256 field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bDeviceFileEvents\b.{0,700}\bSHA256\b'

  - id: defender-email-attachment-source
    desc: Defender email attachment table
    crit: suspicious
    conf: 0.92
    if:
      type: text
      word: EmailAttachmentInfo

  - id: defender-email-recipient-field
    desc: Email attachment recipient field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bEmailAttachmentInfo\b.{0,700}\bRecipientEmailAddress\b'

  - id: defender-email-hash-field
    desc: Email attachment SHA256 field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bEmailAttachmentInfo\b.{0,700}\bSHA256\b'

  - id: defender-external-recipient-domain-filter
    desc: External email recipient-domain filter
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?is)\bRecipientDomain\b.{0,320}(!=|!in|has_any|!contains)\s*[''"(]'

  - id: defender-purview-public-domain-event-source
    desc: Purview public-domain event source
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bDataSecurityEvents\b.{0,700}\bActionType\b.{0,180}free\s+public\s+domains'

  - id: defender-purview-attachment-json-parse
    desc: Purview attachment JSON parse
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bparse_json\s*\(\s*AttachmentInfo\s*\)'

  - id: defender-purview-attachment-expansion
    desc: Expands Purview attachment array rows
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*\|\s*mv-expand\s+Attachments\b'

  - id: defender-purview-attachment-hash-field
    desc: Purview attachment SHA256 field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bAttachments\.SHA256\b'

  - id: defender-file-email-sha256-join
    desc: Joins file and email telemetry on SHA256
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)\bjoin\b[^b\n]{0,260}\bon\s+SHA256\b'

composite_rules:
  - id: defender-sensitive-file-inventory-by-hash
    desc: Sensitive file inventory by SHA256
    crit: suspicious
    conf: 0.97
    all:
      - id: defender-endpoint-sensitive-file-source
      - id: defender-endpoint-file-hash-field

  - id: defender-sensitive-file-external-email-hash-correlation
    desc: Sensitive file to external email hash correlation
    crit: suspicious
    conf: 0.99
    all:
      - id: defender-sensitive-file-inventory-by-hash
      - id: defender-email-attachment-source
      - id: defender-email-recipient-field
      - id: defender-email-hash-field
      - id: defender-external-recipient-domain-filter
      - id: defender-file-email-sha256-join
    near_bytes: 12000

  - id: defender-sensitive-file-purview-public-domain-correlation
    desc: Sensitive file to public-domain hash correlation
    crit: suspicious
    conf: 0.99
    all:
      - id: defender-sensitive-file-inventory-by-hash
      - id: defender-purview-public-domain-event-source
      - id: defender-purview-attachment-json-parse
      - id: defender-purview-attachment-expansion
      - id: defender-purview-attachment-hash-field
      - id: defender-file-email-sha256-join
    near_bytes: 12000
