defaults:
  platforms: [windows, unix]
  for: [text]

traits:
  - id: public-access-token-field
    desc: Public access token field
    crit: component
    if:
      type: text
      substr: public_access_token
  - id: public-refresh-token-field
    desc: Public refresh token field
    crit: component
    if:
      type: text
      substr: public_refresh_token
  - id: admin-access-token-field
    desc: Admin access token field
    crit: component
    if:
      type: text
      substr: admin_access_token
  - id: admin-refresh-token-field
    desc: Admin refresh token field
    crit: component
    if:
      type: text
      substr: admin_refresh_token
  - id: cookies-field
    desc: Browser cookies field
    crit: component
    if:
      type: text
      substr: cookies
  - id: fetch-json-body
    desc: Fetch sends a serialized JSON body
    crit: notable
    if:
      type: text
      regex: 'fetch.{0,250}body.{0,100}JSON\['

composite_rules:
  - id: browser-auth-token-set
    desc: Browser access and refresh token fields with cookies
    crit: notable
    all:
      - id: public-access-token-field
      - id: public-refresh-token-field
      - id: admin-access-token-field
      - id: admin-refresh-token-field
      - id: cookies-field
  - id: browser-auth-fields-near-json-fetch-body
    desc: Browser auth fields near a fetch JSON body
    crit: hostile
    conf: 0.99
    attack: "T1555.003,T1539,T1041,T1027.002"
    mbc: "B0028"
    near_bytes: 2400
    all:
      - id: browser-auth-token-set
      - id: fetch-json-body
