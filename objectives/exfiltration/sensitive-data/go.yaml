defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
  attack: T1041
  mbc: B0030
composite_rules:
- id: go-caller-data-http-exfiltration
  desc: Caller-supplied string/byte data exfiltration
  crit: hostile
  conf: 0.96
  for: [go]
  all:
  - id: micro-behaviors/data/string/conversion::go-string-from-byte-slice
  - id: objectives/exfiltration/http/paste-service::go-dpaste-encrypted-form-exfil
- id: go-env-http-exfiltration
  desc: Environment variable exfiltration via HTTP (Go)
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/lang/scripted::env-access
  - id: micro-behaviors/communications/http/post::http-post-methods
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
- id: go-file-http-exfiltration
  desc: Sensitive file read and HTTP exfiltration (Go)
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/file/read::read-go
  - id: micro-behaviors/communications/http/post::http-post-methods
  any:
  - id: micro-behaviors/fs/path/sensitive/credentials/
  - id: micro-behaviors/fs/path/sensitive/browser/
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
- id: go-sysinfo-http-exfiltration
  desc: System information discovery and HTTP exfiltration (Go)
  crit: hostile
  conf: 0.93
  # Keep the discovery and POST in the same small code region. A Go daemon
  # commonly contains both routine host introspection and unrelated local/API
  # POSTs; file-wide correlation mislabels those management and telemetry
  # paths as exfiltration.
  near_bytes: 1024
  all:
  - id: objectives/discovery/system/fingerprint/runtime::go-system-info-discovery
  - id: micro-behaviors/communications/http/post::http-post-methods
  unless:
  # Hostname/GOOS + POST is normal for OAuth device/PKCE CLIs (entropy + token exchange).
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-challenge
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-verifier
  - id: micro-behaviors/communications/http/oauth::oauth-device-authorization-path
  - id: micro-behaviors/communications/http/oauth::oauth-device-grant-type
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
- id: go-dns-exfiltration
  desc: DNS lookup near environment access
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/dns/lookup/resolver::dns-lookup
  - id: metadata/lang/scripted::env-access
  unless:
  # Large binaries (>50MB) are infrastructure tools, not purpose-built exfiltration.
  - id: metadata/binary/metrics/size::massive-executable
  - id: well-known/dual-use/tunnel/aitun/
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
- id: go-socket-exfiltration
  desc: Go socket exfiltration with credential targeting
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/socket/connect::socket-dial
  - id: micro-behaviors/fs/path/sensitive/credentials/
  unless:
  # Source-level import (Go) and compiled package symbol (ELF/Mach-O/PE).
  # Programs that already ship net/http are HTTP clients/servers, not raw
  # socket exfiltrators; HTTP exfil has its own composites above.
  - id: micro-behaviors/communications/http/lib/netlib::net-http-import
  - id: metadata/lang/compiler/systems::net-http-pkg
  # Large binaries (>50MB) are infrastructure tools, not purpose-built exfiltration.
  - id: metadata/binary/metrics/size::massive-executable
  - id: metadata/package/testing/
  - id: well-known/dual-use/tunnel/aitun/
  - id: well-known/dual-use/tunnel/frp/
  - id: well-known/tool/sysadmin/alpine-packages/
  - id: well-known/app/development/lazygit/
  - id: metadata/library/observability::datadog-go-package-text
- id: go-sensitive-data-exfiltration
  desc: Sensitive data exfiltration (Go)
  crit: hostile
  conf: 0.95
  any:
  - id: go-env-http-exfiltration
  - id: go-file-http-exfiltration
  - id: go-sysinfo-http-exfiltration
  - id: go-socket-exfiltration
