defaults:
  platforms: [unix]
  for: [shell]
  attack: T1048.003

traits:
  - id: shell-ftp-here-session
    desc: Shell FTP scripted session
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'ftp_session=\$\(cat <<EOF[\s\S]{0,180}put \$payload'

  - id: shell-ftp-transfer-command
    desc: Shell FTP transfer command
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(put|mput)\b'

  - id: shell-ftp-tar-archive
    desc: Shell references dump archive
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(^|[^a-zA-Z0-9_-])dump\.tar\.gz\b'

  - id: shell-ftp-target-command
    desc: Shell FTP target command
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: ftp -n "$TARGET_HOST"

  - id: shell-root-shadow-archive
    desc: Shell archives root secrets
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'cat /etc/shadow[\s\S]{0,260}ls -laR /root'

composite_rules:
  - id: shell-ftp-tar-dump
    desc: Shell FTP puts dump archive
    crit: suspicious
    conf: 0.94
    all:
      - id: shell-ftp-transfer-command
      - id: shell-ftp-tar-archive

  - id: shell-ftp-secret-archive-exfil
    desc: Shell FTP secret archive exfil
    crit: hostile
    conf: 0.98
    all:
      - id: shell-ftp-here-session
      - id: shell-ftp-tar-dump
      - id: shell-root-shadow-archive
      - id: shell-ftp-target-command
