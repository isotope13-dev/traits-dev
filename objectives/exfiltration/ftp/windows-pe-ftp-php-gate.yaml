defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
  - id: ftp-php-exfil
    desc: FTP greeting plus a PHP gate URL
    crit: hostile
    conf: 0.94
    attack: T1048.003,T1071.001
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/ftp/control::ftp-server-greeting
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
