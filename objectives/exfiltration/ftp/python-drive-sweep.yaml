defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1005,T1041

composite_rules:
  - id: python-bytecode-drive-tree-ftp-exfil
    desc: Python bytecode sweeps Windows drives and uploads files over FTP
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/enumerate/drives::python-bytecode-get-logical-drives-reference
      - id: micro-behaviors/fs/directory/traverse::pyc-walk-name-record
      - id: micro-behaviors/communications/ftp/upload::python-bytecode-ftp-storbinary-reference
