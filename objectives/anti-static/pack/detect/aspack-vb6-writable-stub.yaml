defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
composite_rules:
  - id: aspack-stub-with-inflated-data-and-reloc-overhang
    desc: ASPack stub with inflated data and reloc overhang
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: metadata/binary/section/entropy::high-entropy-text
    unless:
      - id: metadata/signed/platform/
