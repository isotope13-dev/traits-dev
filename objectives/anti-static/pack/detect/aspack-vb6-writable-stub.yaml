# ASPack is a commercial packer, so its sections alone prove little. On a
# program that is only a few kilobytes, imports four functions, lists the
# VB6 runtime as a string instead of an import, and starts in a writable
# section, the packer is wrapping a VB6 payload that is rebuilt in memory.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
composite_rules:
  - id: aspack-wrapped-vb6-payload-stub
    desc: ASPack stub wrapping a VB6 payload
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/symbols/count::imported-functions-under-10
    unless:
      - id: metadata/signed/platform/
  - id: aspack-stub-with-inflated-data-and-reloc-overhang
    desc: ASPack stub with inflated data and reloc overhang
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: metadata/binary/section/entropy::high-entropy-text
    unless:
      - id: metadata/signed/platform/
