# ASPack by itself proves little. Wrapped around an image whose DOS stub
# text was changed, whose section table has several BSS-like empty sections
# and whose entry point is writable, it is a re-packed program: the original
# was rebuilt behind the packer.
# With a service start and registry writes among fewer than ten imports, the
# visible behavior is installation, not a user interface.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1543.003,T1112
composite_rules:
  - id: aspack-repack-with-edited-headers
    desc: ASPack repack of an image with edited headers
    crit: suspicious
    conf: 0.72
    all:
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: metadata/binary/header/malformed::pe-bss-like-sections-multiple
      - id: metadata/binary/header/malformed::pe-dos-stub-modified
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
  - id: aspack-stub-starting-service-and-writing-registry
    desc: ASPack stub starting a service and writing registry
    crit: suspicious
    conf: 0.7
    all:
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: metadata/binary/symbols/count::imported-functions-under-10
    unless:
      - id: metadata/signed/platform/
