# Mach-O segment and entry-point anomalies can indicate packing or an
# unpacker stub. These structural features are suspicious evidence, not proof
# that the file was tampered with or is hostile.
#
# Catches in the validation corpus:
#   * vxshell, d_mac_x64 (DPRK MachOMan): writable-EP + W+X + bad-pagezero
#   * Teams (DPRK Teams masquerade): writable-EP + W+X + chained-fixups
defaults:
  crit: suspicious
  conf: 0.95
  platforms: [macos, ios]
  for: [macho]
  attack: T1027.002
composite_rules:
  # Core cluster — writable EP region AND a W+X loadable segment.
  # Two independent structural signals; together they are the textbook
  # self-modifying / unpacker-stub fingerprint.
  - id: macho-structural-tampering-cluster
    desc: Mach-O entry point in writable region and W+X segment
    all:
      - id: metadata/binary/header/load-command::macho-entry-in-writable-segment
      - id: metadata/binary/header/load-command::macho-wx-segment
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      # A UPX stub is one RWX segment with the entry point inside it by
      # construction. That is the packer's normal output, and the honest
      # finding is "UPX packed" (objectives/anti-static/pack/detect::
      # packer-detected), not tampering.
      - id: metadata/binary/provenance/build::upx-banner

  # Modern-shaped tampering — writable EP region plus any of the
  # auxiliary tampering signs (W+X, bad PAGEZERO, encrypted section).
  # Catches "modern looking" malware (Teams) where the build tries to
  # blend in via chained-fixups but the loadable geometry betrays it.
  - id: macho-modern-shaped-tampering
    desc: Mach-O writable entry point with structural anomalies
    all:
      - id: metadata/binary/header/load-command::macho-entry-in-writable-segment
    any:
      - id: metadata/binary/header/load-command::macho-wx-segment
      - id: metadata/binary/header/load-command::macho-pagezero-size-anomalous
      - id: metadata/binary/header/load-command::macho-encrypted-section-present
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      # A UPX stub is one RWX segment with the entry point inside it by
      # construction. That is the packer's normal output, and the honest
      # finding is "UPX packed" (objectives/anti-static/pack/detect::
      # packer-detected), not tampering.
      - id: metadata/binary/provenance/build::upx-banner
