composite_rules:
- id: sparse-tls-overlay-single-export-dll
  desc: Sparse TLS overlay DLL with single export
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/pack/runtime::sparse-tls-overlay-packed-dll
  - id: metadata/binary/symbols/imports::pe-imports-max-six
  - id: metadata/binary/symbols/exports::single-export
  any:
  - id: micro-behaviors/fs/path/system/library::mscoree-dll-name
  - id: metadata/file/profile/library/module-name::ntdll-dll-string
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog/
  for:
  - pe
  - dll
  platforms:
  - windows
