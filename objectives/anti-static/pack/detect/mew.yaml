# MEW is a legacy Win32 executable compressor. The section marker identifies
# the packer, not the intent of the program it wraps.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: mew-packed-section
    desc: MEW executable-packer section
    crit: notable
    conf: 0.99
    if:
      type: section
      exact: MEW

