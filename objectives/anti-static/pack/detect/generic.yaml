defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
composite_rules:
  - id: packed-decoy-ui
    for: [macho]
    desc: Packed binary with UI framework
    crit: suspicious
    conf: 0.9
    mbc: F0001
    attack: T1204.001
    all:
      - id: metadata/build/protector::upx-packing-token-reference
      - id: metadata/binary/section/ratio::few-sections
      - id: micro-behaviors/dylib/load/runtime::webkit-framework
  - id: empty-text-minimal-import-packed-pe
    desc: Empty text PE with minimal imports and high entropy
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/symbols/imports::pe-imports-max-six
    unless:
      - id: metadata/signed/platform/
  - id: empty-text-nonstandard-entropy-packed-pe
    desc: Empty-text PE with nonstandard high-entropy packing
    crit: notable
    conf: 0.98
    attack: T1027.002
    mbc: F0001
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/code/entropy::code-region-entropy-78
      - id: metadata/file/entropy::overall-entropy-78
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: empty-text-opaque-near-total-packed-pe
    desc: Opaque empty-text PE with near-total packed code
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    mbc: F0001
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/binary/section/prose::pe-short-readable-strings
      - id: metadata/binary/symbols/count::pe-sparse-import-table
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/code/entropy::code-region-entropy-78
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
