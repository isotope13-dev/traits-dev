defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: upx-marker
    desc: UPX packer marker string
    crit: component
    conf: 0.8
    if:
      type: text
      # Require token boundaries so compressed data such as `LUPX1` does not
      # turn an incidental substring into a packer marker. A real marker is a
      # standalone UPX! / UPX0 / UPX1 string in the scanned text run.
      regex: '(^|[^A-Za-z0-9])UPX[!01]([^A-Za-z0-9]|$)'
    unless:
      - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
      - id: well-known/tool/sysadmin/nirsoft::snremove-utility
  # UPX writes its full banner into every packed image. The `UPX!` token above
  # needs non-alphanumeric boundaries and so misses the packed Mach-O case,
  # where the marker sits inside compressed data (`UPX!u`) -- wkhtmltopdf's
  # vendored darwin binary was read as structural tampering instead of as the
  # UPX stub it is.
  - id: upx-banner
    desc: UPX packer banner string
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'This file is packed with the UPX executable packer'
  - id: aspack-marker
    desc: ASPack packer marker
    crit: notable
    conf: 0.8
    if:
      type: text
      word: ASPack
      case_insensitive: true
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\baspack\b
      - regex: (?i)["']aspack["']
    unless:
      - id: well-known/tool/sysadmin/spack::spack-package-context
      - id: metadata/package/testing/
  - id: petite-marker
    desc: Petite packer signature string
    crit: component
    conf: 0.95
    if:
      type: text
      regex: (?i)\b(Compressed by Petite|Petite\s+v?\d|Petite\s+\(c\)\s*1999\s+Ian\s+Luck)\b
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bpetite(\.[^\\/\r\n]+)?\b
      - regex: Petite Capitals( From Capitals)?
  - id: petite-section
    desc: Petite packer section name
    for: [elf, macho, pe]
    crit: notable
    conf: 0.85
    if:
      type: section
      regex: ^@?\.?petite$
  - id: themida-marker
    desc: Themida packer marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: Themida
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bthemida([^\\/\r\n]{0,80})?\b
  - id: themida-section
    desc: Themida packed binary section
    for: [elf, macho, pe]
    crit: suspicious
    conf: 0.95
    mbc: F0001
    if:
      type: section
      regex: ^@?\.themida$
      entropy_min: 1.0
  - id: vmprotect-marker
    desc: VMProtect packer marker
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)\bVMProtect\s*(v\d|\d)
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bvmprotect([^\\/\r\n]{0,80})?\b
  - id: expressor-demo-string
    desc: eXPressor demo packer string
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      exact: This program was packed with a demo version of eXPressor
  - id: expressor-v13-marker
    desc: eXPressor version 1.3 marker
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: ExPr-v.1.3
  - id: expressor-unregistered-string
    desc: eXPressor unregistered packer banner
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: This application was packed with an Unregistered version of eXPressor
  - id: expressor-code-section
    desc: eXPressor code section name
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: section
      exact: .ex_cod
  - id: xpack-unpacked-section
    desc: XPACK unpacked-image section
    crit: component
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: section
      exact: .XPack0
  - id: xpack-loader-section
    desc: XPACK loader section
    crit: component
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: section
      exact: .XPack
composite_rules:
  - id: detect
    desc: Packed/compressed executable
    crit: notable
    conf: 0.66
    mbc: F0001
    attack: T1027.002
    any:
      - id: upx-marker
      - id: upx-banner
      - id: aspack-marker
      - id: petite-marker
      - id: petite-section
      - id: themida-marker
      - id: themida-section
      - id: vmprotect-marker
      - id: objectives/anti-static/pack/vmprotect::section
      - id: expressor-packer
      - id: xpack-packer
  - id: expressor-packer
    desc: eXPressor packed executable
    crit: suspicious
    conf: 0.98
    mbc: F0001
    attack: T1027.002
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: expressor-code-section
    any:
      - id: expressor-v13-marker
      - id: expressor-demo-string
      - id: expressor-unregistered-string
    unless:
      - id: well-known/game/online::moyu-packed-game-context
  - id: xpack-packer
    desc: XPACK-protected executable
    crit: suspicious
    conf: 0.98
    mbc: F0001
    attack: T1027.002
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: xpack-unpacked-section
      - id: xpack-loader-section
  - id: packed-decoy-ui
    desc: Packed binary with UI framework
    crit: suspicious
    conf: 0.9
    mbc: F0001
    attack: T1204.001
    all:
      - id: upx-marker
      - id: metadata/binary/metrics/structural::few-sections
      - id: micro-behaviors/dylib/load/runtime::webkit-framework
  - id: empty-text-minimal-import-packed-pe
    desc: Empty text PE with minimal imports and high entropy
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/payload/section::empty-text-section
      - id: metadata/binary/metrics/structural::high-code-entropy
      - id: metadata/binary/symbols/imports::pe-imports-max-six
    unless:
      - id: metadata/signed/platform/
  - id: empty-text-nonstandard-entropy-packed-pe
    desc: Empty-text PE with nonstandard high-entropy packing
    crit: hostile
    conf: 0.98
    attack: T1027.002
    mbc: F0001
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/payload/section::empty-text-section
      - id: metadata/binary/metrics/structural::high-code-entropy
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: metadata/binary/metrics/structural::pe-overall-entropy-78
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: empty-text-opaque-near-total-packed-pe
    desc: Opaque empty-text PE with near-total packed code
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    mbc: F0001
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/payload/section::empty-text-section
      - id: metadata/binary/metrics/structural::pe-near-total-code-data
      - id: metadata/binary/metrics/structural::pe-short-readable-strings
      - id: metadata/binary/metrics/structural::pe-sparse-import-table
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
