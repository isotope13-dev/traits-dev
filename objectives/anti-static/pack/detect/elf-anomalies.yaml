# ELF Binary Anomaly Detection
# Detects structural anomalies common in packed/obfuscated ELF binaries
# ATT&CK: T1027.002 (Software Packing)
defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: elf32-class
    desc: "ELF32 class marker"
    crit: component
    conf: 1.0
    if:
      type: metrics
      field: elf.bits
      min: 32
      max: 32
  - id: elf32-sectionless-header
    desc: "ELF32 header omits section table"
    crit: component
    conf: 0.95
    mbc: "F0001"
    attack: "T1027.002"
    if:
      type: hex
      pattern: "00 00 00 00 00 00 10 07 00 34 00 20 00 02 00 28 00 00 00 00"
      offset: 32
  - id: elf64-sectionless-header
    desc: "ELF64 header omits section table"
    crit: component
    conf: 0.95
    mbc: "F0001"
    attack: "T1027.002"
    if:
      type: hex
      pattern: "00 00 00 00 00 00 00 00 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? 00 00 ?? ??"
      offset: 40
  - id: upx-packer-string
    desc: UPX executable packer signature string
    crit: component
    conf: 1.0
    if:
      type: text
      substr: UPX executable packer
  - id: upx-tool-basename
    desc: UPX tool basename
    crit: notable
    conf: 1.0
    if:
      type: path
      basename: true
      exact: upx
  - id: upx-magic-raw
    desc: UPX magic bytes in ELF
    crit: component
    conf: 0.95
    if:
      type: text
      substr: "UPX!"

composite_rules:
  - id: unnamed-temp-storage-api
    desc: ELF uses anonymous or unnamed temporary storage API
    crit: component
    conf: 0.9
    unless:
      # Bun's normal self-contained runtime uses these APIs for its own
      # temporary/runtime storage; this is not evidence of a packed loader.
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-cosmos-extension
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-opencode-bundle
      - id: well-known/app/ai/coding-agent/opencode::opencode-bun-runtime
      - id: well-known/app/ai/coding-agent/opencode::opencode-binary-path
      - id: well-known/lib/runtime/bun-runtime::unix-runtime-context
    any:
      - id: micro-behaviors/mem/anonymous/create::memfd-create
      - id: micro-behaviors/fs/temp/mktemp::o-tmpfile-flag

  - id: self-executable-path-marker
    desc: ELF uses a shared-memory or self-executable path marker
    crit: component
    conf: 0.8
    unless:
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-cosmos-extension
      - id: well-known/app/ai/coding-agent/delos-cosmos::delos-opencode-bundle
      - id: well-known/app/ai/coding-agent/opencode::opencode-bun-runtime
      - id: well-known/app/ai/coding-agent/opencode::opencode-binary-path
      - id: well-known/lib/runtime/bun-runtime::unix-runtime-context
    any:
      - id: micro-behaviors/fs/path/device/special::dev-shm-bare
      - id: micro-behaviors/fs/proc/info/path::process-self-ex-fragment

  - id: linux-loader-breadcrumbs
    desc: ELF combines unnamed storage with a path marker
    crit: component
    conf: 0.9
    all:
      - id: unnamed-temp-storage-api
      - id: self-executable-path-marker

  - id: upx-packed-elf
    desc: "UPX-packed ELF binary"
    crit: notable
    conf: 0.85
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: upx-packer-string
    unless:
      - id: upx-tool-basename
    any:
      - id: metadata/binary/metrics/threshold::high-overall-entropy-70
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: metadata/binary/anomaly/section-header::elf-no-section-headers
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: linux-loader-breadcrumbs
      - id: metadata/binary/anomaly/program-header::compact-large-load-memory-image
  - id: elf32-no-section-headers
    desc: "ELF32 has no section headers"
    crit: component
    conf: 0.95
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: elf32-class
      - id: elf32-sectionless-header
  - id: elf64-no-section-headers
    desc: "ELF64 has no section headers"
    crit: component
    conf: 0.95
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: metadata/binary/metrics/structural::elf64-class
      - id: elf64-sectionless-header
  - id: no-section-headers
    desc: "No section headers"
    crit: notable
    conf: 0.8
    mbc: "F0001"
    attack: "T1027.002"
    any:
      - id: metadata/binary/anomaly/section-header::elf-no-section-headers
      - id: elf32-no-section-headers
      - id: elf64-no-section-headers
  - id: stripped-packed
    desc: "Packed ELF binary"
    crit: suspicious
    conf: 0.85
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: no-section-headers
      - id: metadata/binary/metrics/threshold::high-overall-entropy-70
    unless:
      - id: upx-packer-string
      - id: metadata/arch/iot::mips
      - id: metadata/binary/metrics/structural::mips-high-overall-entropy
      - id: micro-behaviors/mem/alloc/map::mips-mmap-syscall
  - id: mips-sectionless-packed-loader
    desc: Sectionless high-entropy MIPS memory loader
    crit: suspicious
    conf: 0.97
    mbc: "F0001"
    attack: "T1027.002,T1620"
    platforms: [linux]
    all:
      - id: metadata/arch/iot::mips
      - id: metadata/binary/metrics/structural::mips-high-overall-entropy
      - id: no-section-headers
      - id: micro-behaviors/mem/alloc/map::mips-memory-map-and-cache-flush
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/
  - id: packed-linux-memory-temp-loader
    desc: "Packed Linux ELF with memory/temp loader breadcrumbs"
    crit: hostile
    conf: 0.9
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: no-section-headers
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: linux-loader-breadcrumbs
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout::legacy-watcom-packed-utility
  - id: concealed-packed-loader
    desc: "Concealed sectionless packed ELF loader"
    crit: hostile
    conf: 0.92
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: no-section-headers
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
    any:
      - id: metadata/binary/metrics/structural::few-functions
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::noisy-avg-string-length
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: linux-loader-breadcrumbs
      - id: metadata/binary/anomaly/program-header::compact-large-load-memory-image
      - id: metadata/binary/anomaly/program-header::load-segment-exceeds-midsize-file
      - id: metadata/binary/anomaly/program-header::large-load-on-compact-artifact
      - id: metadata/binary/linking/static::elf-needed-libs-zero
    needs: 2
    unless:
      - id: upx-packer-string
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout::legacy-watcom-packed-utility

  - id: sectionless-arm-packed-loader
    desc: Sectionless high-entropy ARM ELF with compact oversized load image
    crit: hostile
    conf: 0.97
    mbc: "F0001"
    attack: "T1027.002"
    platforms: [linux]
    # Prior floor (655360) skipped ~640 KiB IoT packed loaders that still
    # carry sectionless + very-high entropy + oversized LOAD + zero needed.
    size_min: 600000
    size_max: 786432
    all:
      - id: no-section-headers
      - id: metadata/arch/iot::arm
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: metadata/binary/anomaly/program-header::large-load-on-compact-artifact
      - id: metadata/binary/linking/static::elf-needed-libs-zero
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/

  - id: sparse-static-cmdline-pty-bot
    desc: Static cmdline-targeting PTY bot with sparse code
    crit: hostile
    conf: 0.98
    mbc: "F0001"
    attack: "T1027.002,T1057,T1059.004"
    all:
      - id: objectives/command-and-control/botnet/iot::static-cmdline-targeting-pty-c2-bot
      - id: metadata/binary/metrics/structural::sparse-functions
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/

  - id: mips-sectionless-high-entropy-sparse-loader
    desc: Sectionless high-entropy MIPS ELF with sparse recovered code
    crit: hostile
    conf: 0.97
    size_max: 524288
    mbc: "F0001"
    attack: "T1027.002,T1620"
    all:
      - id: metadata/arch/iot::mips
      - id: metadata/binary/metrics/structural::mips-high-overall-entropy
      - id: no-section-headers
      - id: metadata/binary/metrics/structural::no-functions
      - id: metadata/binary/metrics/structural::few-basic-blocks
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-firmware-embedded-elf-path
      - id: well-known/tool/sysadmin/unix-benign/

  - id: expanded-memory-packed-loader
    desc: "Sectionless packed ELF expands into a large memory image"
    crit: hostile
    conf: 0.88
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: no-section-headers
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: metadata/binary/anomaly/program-header::compact-large-load-memory-image
    any:
      - id: metadata/binary/metrics/structural::few-functions
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::noisy-avg-string-length
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: linux-loader-breadcrumbs
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout::legacy-watcom-packed-utility
  - id: overmapped-sectionless-packed-elf
    desc: "Sectionless packed ELF with oversized LOAD memory image"
    crit: hostile
    conf: 0.94
    mbc: "F0001"
    attack: "T1027.002"
    size_max: 262144
    all:
      - id: no-section-headers
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: objectives/anti-static/obfuscation/payload/elf-struct::load-segment-exceeds-small-file
    any:
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: metadata/binary/metrics/structural::few-functions
      - id: metadata/binary/metrics/structural::no-functions
      - id: objectives/anti-static/obfuscation/payload/elf-struct::load-segment-exceeds-small-file
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout::legacy-watcom-packed-utility
  - id: upx-marked-sectionless-loader
    desc: "UPX-marked sectionless high-entropy ELF loader"
    crit: hostile
    conf: 0.92
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: upx-magic-raw
      - id: no-section-headers
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
    any:
      - id: objectives/anti-static/obfuscation/payload/elf-struct::load-segment-exceeds-small-file
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/metrics/structural::few-functions
      - id: metadata/binary/metrics/structural::no-functions
    needs: 2
    unless:
      - id: upx-tool-basename
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout::legacy-watcom-packed-utility
  - id: sectionless-packed-elf-loader
    desc: "Sectionless packed ELF loader with an oversized load image"
    crit: hostile
    conf: 0.9
    mbc: "F0001"
    attack: "T1027.002"
    size_max: 262144
    all:
      - id: no-section-headers
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: objectives/anti-static/obfuscation/payload/elf-struct::load-segment-exceeds-small-file
    any:
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: metadata/binary/metrics/structural::few-functions
      - id: metadata/binary/metrics/structural::no-functions
      - id: metadata/binary/metrics/structural::mips-high-overall-entropy
    unless:
      - id: upx-magic-raw
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout::legacy-watcom-packed-utility
  - id: mirai-like
    desc: "Mirai-like IoT malware pattern: static + stripped + exotic arch + packed"
    crit: hostile
    conf: 0.9
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: no-section-headers
      - id: metadata/arch/iot::exotic-arch
      - id: objectives/command-and-control/botnet/iot::mirai-variant
    any:
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/linking/static::static-linked-heuristic
  - id: iot-target
    desc: "IoT target architecture (exotic arch + static)"
    crit: notable
    conf: 0.7
    attack: "T1583.005"
    all:
      - id: metadata/arch/iot::exotic-arch
    any:
      - id: metadata/binary/linking/static::static-linked
      - id: metadata/binary/linking/static::static-linked-heuristic
