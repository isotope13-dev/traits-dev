# ELF Binary Anomaly Detection
# Detects structural anomalies common in packed/obfuscated ELF binaries
# ATT&CK: T1027.002 (Software Packing)
defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  - id: linux-loader-breadcrumbs
    desc: ELF combines unnamed storage with a path marker
    crit: component
    conf: 0.9
    all:
      - id: micro-behaviors/fs/temp/file::unnamed-temp-storage-capability
    any:
      - id: micro-behaviors/fs/path/device/special::dev-shm-bare
      - id: micro-behaviors/fs/proc/exe::process-self-ex-fragment

  - id: stripped-packed
    desc: "Packed ELF binary"
    crit: suspicious
    conf: 0.85
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/file/entropy::high-overall-entropy-70
    unless:
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/arch/iot::mips
      - id: metadata/file/entropy::overall-entropy-78
      - id: "micro-behaviors/mem/map::mips-mmap-syscall"
      # A core dump is a memory image. Missing sections and high entropy
      # are the recorded address space, not a packer.
      - id: metadata/binary/header/identity::elf-core-dump
  - id: mips-sectionless-packed-loader
    desc: Sectionless high-entropy MIPS memory loader
    crit: suspicious
    conf: 0.97
    mbc: "F0001"
    attack: "T1027.002,T1620"
    platforms: [linux]
    all:
      - id: metadata/arch/iot::mips
      - id: metadata/file/entropy::overall-entropy-78
      - id: metadata/binary/section/header::no-section-headers
      - id: "micro-behaviors/mem/map::mips-memory-map-and-cache-flush"
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/
  - id: mips-sectionless-zero-load-runtime-unpacker
    desc: Sectionless MIPS runtime unpacker with a rewritten LOAD table
    crit: hostile
    conf: 0.995
    mbc: "F0001.008"
    attack: "T1027.002,T1620"
    platforms: [linux]
    all:
      - id: mips-sectionless-packed-loader
      - id: metadata/binary/header/program::mips-zero-sized-rw-load-segment
      - id: metadata/binary/code/complexity::sparse-functions
      - id: objectives/anti-static/pack/runtime::mips-lzma-loader-entry
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/
  - id: packed-linux-memory-temp-loader
    desc: "Packed Linux ELF with memory/temp loader breadcrumbs"
    crit: hostile
    conf: 0.9
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: linux-loader-breadcrumbs
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
  - id: sectionless-elf-with-packing-indicators
    desc: "Sectionless ELF with multiple packing indicators"
    crit: suspicious
    conf: 0.92
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/file/entropy::very-high-overall-entropy-75
    any:
      - id: metadata/binary/code/complexity::few-functions
      - id: metadata/file/profile/string-population::short-average-strings-large-binary
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
      - id: linux-loader-breadcrumbs
      - id: metadata/binary/header/program::compact-large-load-memory-image
      - id: metadata/binary/header/program::load-segment-exceeds-midsize-file
      - id: metadata/binary/header/program::large-load-on-compact-artifact
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
    needs: 2
    unless:
      - id: metadata/binary/provenance/build::upx-banner
      # A specific UPX header-tampering finding describes this case without
      # duplicating the broad sectionless/high-entropy packing verdict.
      - id: objectives/anti-static/pack/upx::zeroed-pinfo-anti-unpack
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
      - id: metadata/binary/header/identity::elf-core-dump

  - id: sectionless-arm-packed-loader
    desc: Sectionless high-entropy ARM ELF with compact oversized load image
    crit: hostile
    conf: 0.97
    mbc: "F0001"
    attack: "T1027.002"
    platforms: [linux]
    # Prior floor (655360) skipped ~640 KiB IoT packed loaders that still
    # carry sectionless + very-high entropy + oversized LOAD + zero needed.
    size_min: 600000
    size_max: 786432
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/arch/arm::arm
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: metadata/binary/header/program::large-load-on-compact-artifact
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: metadata/binary/header/identity::elf-core-dump

  - id: sparse-static-cmdline-pty-bot
    desc: Static cmdline-targeting PTY bot with sparse code
    crit: hostile
    conf: 0.98
    mbc: "F0001"
    attack: "T1027.002,T1057,T1059.004"
    all:
      - id: objectives/command-and-control/botnet/iot::static-cmdline-targeting-pty-c2-bot
      - id: metadata/binary/code/complexity::sparse-functions
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/

  - id: mips-sectionless-high-entropy-sparse-loader
    desc: Sectionless high-entropy MIPS ELF with sparse recovered code
    crit: hostile
    conf: 0.97
    size_max: 524288
    mbc: "F0001"
    attack: "T1027.002,T1620"
    all:
      - id: metadata/arch/iot::mips
      - id: metadata/file/entropy::overall-entropy-78
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/binary/code/complexity::few-basic-blocks
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-firmware-embedded-elf-path
      - id: well-known/tool/sysadmin/unix-benign/

  - id: overmapped-sectionless-packed-elf
    desc: "Sectionless packed ELF with oversized LOAD memory image"
    crit: suspicious
    conf: 0.94
    mbc: "F0001"
    attack: "T1027.002"
    size_max: 262144
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: objectives/anti-static/obfuscation/payload/elf-struct::load-segment-exceeds-small-file
    any:
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
      - id: metadata/binary/code/complexity::few-functions
      - id: metadata/binary/code/complexity::no-functions
      - id: objectives/anti-static/obfuscation/payload/elf-struct::load-segment-exceeds-small-file
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
      - id: metadata/binary/header/identity::elf-core-dump
  - id: mips-upx-sectionless-bot-profile
    desc: Hostile sectionless MIPS UPX profile
    crit: hostile
    conf: 0.98
    mbc: "F0001"
    attack: "T1027.002"
    platforms: [linux]
    all:
      # The MIPS leg this rule is named for. Without it the rest describes
      # any statically linked, UPX-packed, sectionless ELF -- trufflehog's
      # x86-64 release is exactly that -- and the IoT twin below already
      # covers the other embedded architectures.
      - id: metadata/arch/iot::mips
      - id: metadata/file/entropy::overall-entropy-78
      - id: metadata/binary/layout/stub::upx-magic-raw
      - id: metadata/binary/section/header::no-section-headers
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
    unless:
      - id: metadata/file/naming::upx-basename
      - id: metadata/binary/header/program::load-exceeds-file-backing
      - id: metadata/binary/header/program::load-segment-exceeds-compact-file
      - id: metadata/binary/header/program::load-segment-exceeds-128k-file
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/

  # Apply the same packing profile to other recognized embedded targets. The
  # MIPS rule above remains separate so it can retain MIPS-specific evidence.
  #
  # Not hostile: the required evidence is stock UPX release shape (UPX magic,
  # sectionless, static, high entropy) on an embedded architecture, and
  # legitimate projects ship exactly it -- zapret2's arm64 router builds
  # (nfqws2/mdig/ip2net, UPX 4.24) and trufflehog's release binaries match.
  # RULES.md: stock UPX output is notable layout, not hostile. The profile
  # stays suspicious as a packing/concealment indication worth review.
  - id: iot-upx-sectionless-packed-profile
    desc: Sectionless UPX-packed embedded-arch ELF
    crit: suspicious
    conf: 0.98
    mbc: "F0001"
    attack: "T1027.002"
    platforms: [linux]
    all:
      - id: metadata/arch/iot::embedded-elf-architecture
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: metadata/binary/layout/stub::upx-magic-raw
      - id: metadata/binary/section/header::no-section-headers
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
    unless:
      - id: metadata/arch/iot::mips
      - id: metadata/file/naming::upx-basename
      - id: metadata/binary/header/program::load-exceeds-file-backing
      - id: metadata/binary/header/program::load-segment-exceeds-compact-file
      - id: metadata/binary/header/program::load-segment-exceeds-128k-file
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/

  - id: sectionless-packed-elf-loader
    desc: "Sectionless packed ELF loader with an oversized load image"
    crit: suspicious
    conf: 0.9
    mbc: "F0001"
    attack: "T1027.002"
    size_max: 262144
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: objectives/anti-static/obfuscation/payload/elf-struct::load-segment-exceeds-small-file
    any:
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
      - id: metadata/binary/code/complexity::few-functions
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/file/entropy::overall-entropy-78
    unless:
      - id: metadata/binary/layout/stub::upx-magic-raw
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
      - id: metadata/binary/header/identity::elf-core-dump
  - id: mirai-like
    desc: "Mirai-like IoT malware pattern: static + stripped + exotic arch + packed"
    crit: hostile
    conf: 0.9
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/arch/iot::exotic-arch
      - id: objectives/lateral-movement/brute-force/iot::iot-credentials-with-service-tools
    any:
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
  - id: arm-sectionless-packed-loader
    desc: Sectionless packed ARM ELF loader
    crit: hostile
    conf: 0.96
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/arch/arm::arm
      - id: metadata/file/entropy::very-high-overall-entropy-75
    unless:
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/binary/installer/family/
      - id: metadata/binary/header/identity::elf-core-dump
  - id: arm-stripped-packed-static
    desc: Stripped packed static ARM ELF
    crit: hostile
    conf: 0.95
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: stripped-packed
      - id: metadata/arch/arm::arm
    unless:
      - id: metadata/binary/provenance/build::upx-banner
  - id: arm-sectionless-load-exceeds
    desc: Sectionless ARM ELF with oversized LOAD
    crit: hostile
    conf: 0.95
    mbc: "F0001"
    attack: "T1027.002"
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/arch/arm::arm
      - id: metadata/binary/header/program::load-segment-exceeds-midsize-file
    unless:
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/binary/header/identity::elf-core-dump
