defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: F0001

traits:
  - id: pe-wx-section
    desc: PE has writable executable section
    crit: notable
    conf: 0.90
    if:
      type: metrics
      field: sections.executable_writable_count
      min: 1

  - id: pe-high-entropy-section
    desc: PE has high-entropy section
    crit: notable
    conf: 0.90
    if:
      type: metrics
      field: sections.max_entropy
      min: 7.4

  - id: pe-nonstandard-section
    desc: PE has nonstandard section name
    crit: notable
    conf: 0.90
    if:
      type: metrics
      field: sections.nonstandard_count
      min: 1

composite_rules:
  - id: pe-packed-wx-nonstandard
    desc: Packed PE with WX and nonstandard high-entropy section
    crit: notable
    conf: 0.95
    all:
      - id: pe-wx-section
      - id: pe-high-entropy-section
      - id: pe-nonstandard-section

  - id: packed-pe-cmd-die-rename
    desc: Packed PE with cmd.exe .die rename self-deletion pattern
    crit: hostile
    conf: 0.95
    all:
      - id: pe-high-entropy-section
      - id: micro-behaviors/fs/file/rename::cmd-target-die-extension-rename
