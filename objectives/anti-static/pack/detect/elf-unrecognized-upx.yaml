defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
composite_rules:
  - id: elf-unrecognized-packed-handoff
    desc: Sectionless unpacker without UPX recovery header
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: micro-behaviors/process/deploy::x64-unpack-mprotect-handoff
    unless:
      - id: metadata/binary/layout/stub::intact-trailing-packheader
  - id: upx-elf-missing-packheader
    desc: UPX stub lacks trailing recovery header
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/binary/layout/stub::upx-magic-raw
      - id: micro-behaviors/process/deploy::x64-unpack-mprotect-handoff
    unless:
      - id: metadata/binary/layout/stub::trailing-packheader-magic
