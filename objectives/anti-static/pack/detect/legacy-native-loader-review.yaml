defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: empty-text-opaque-timing-import-profile
  desc: Empty-text packed PE with sparse timing imports
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/anti-static/pack/detect::empty-text-minimal-import-packed-pe
  - id: metadata/binary/resource/table::pe-no-version-info-resource
  - id: micro-behaviors/time/query::query-performance-frequency
  - id: micro-behaviors/ui/window/message::get-message-time
  - id: metadata/binary/symbols/imports::few-import-count
  - id: metadata/binary/section/layout::multiple-nonstandard-section-names
  any:
  - id: metadata/binary/section/header::pe-entry-in-punctuated-section
  - id: metadata/binary/section/header::pe-entry-in-short-dotted-section
  unless:
  - id: metadata/installer/product/
- id: empty-text-dual-packing-profile
  desc: Empty-text PE matches two opaque packing profiles
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/pack/detect::empty-text-minimal-import-packed-pe
  - id: objectives/anti-static/pack/detect::empty-text-opaque-near-total-packed-pe
  - id: metadata/binary/resource/table::pe-no-version-info-resource
  unless:
  - id: metadata/installer/product/
- id: opaque-pack-plus-section-entry
  desc: Opaque packed PE with plus-named entry section
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/pack/detect::empty-text-opaque-near-total-packed-pe
  - id: metadata/binary/section/header::pe-entry-in-plus-section-name
  - id: metadata/binary/resource/table::pe-no-version-info-resource
  unless:
  - id: metadata/installer/product/
