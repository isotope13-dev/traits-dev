defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: sparse-peb-resource-layout-clues
    desc: Sparse PE, PEB and resource layout clues
    crit: suspicious
    conf: 0.95
    attack: T1027
    all:
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/binary/resource/size::oversized-rsrc
    needs: 2
