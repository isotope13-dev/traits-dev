# The Expressor packer names its code section ".ex_cod". It is a legitimate
# commercial packer, but malware uses it often: a stub with a writable entry
# point, a checksum that does not match the content and a high-entropy
# appended block is a payload wrapper, not a protected program.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
composite_rules:
  - id: expressor-stub-with-writable-entry-and-opaque-overlay
    desc: Expressor stub with writable entry and opaque overlay
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/binary/section/label::expressor-code-section-name
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/layout/overlay::high-entropy-overlay
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
