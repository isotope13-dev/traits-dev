# ASPack and non-Microsoft DOS stubs do not establish header tampering or
# repacking. Empty sections and writable entry sections are reported by
# their metadata traits; the Delphi Win32 DOS stub is a normal toolchain stub.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1543.003,T1112
composite_rules:
  - id: aspack-stub-starting-service-and-writing-registry
    desc: ASPack stub starting a service and writing registry
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: metadata/binary/symbols/count::imported-functions-under-10
    unless:
      - id: metadata/signed/platform/
