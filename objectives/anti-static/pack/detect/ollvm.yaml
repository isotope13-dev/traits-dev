# Obfuscator-LLVM stamps its compiler ident into native libraries.
defaults:
  platforms: [android, linux]
  for: [elf]
  attack: T1027.002
  mbc: F0001

traits:
  - id: ollvm-compiler-ident
    desc: Obfuscator-LLVM compiler ident
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: Obfuscator-LLVM

composite_rules:
  - id: ollvm-stripped-elf
    desc: Stripped ELF built with Obfuscator-LLVM
    crit: hostile
    conf: 0.96
    all:
      - id: ollvm-compiler-ident
      - id: metadata/hardening/missing::stripped-binary
