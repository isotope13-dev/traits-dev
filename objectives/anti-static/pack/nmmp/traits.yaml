# nmmp (github.com/maoabc/nmmp) is an open-source DEX virtualizer: it turns
# every protected Dalvik method into a `native` stub and replays the original
# bytecode in its own interpreter (libnmmvm.so), bridged by libnmmp.so. The
# DEX left behind is a shell of native declarations, so every behavior the
# app has (installers, overlays, network) is invisible to bytecode review.
# Both halves are needed: the Java bridge class names the runtime, and the
# native bridge library registers that class's natives.
defaults:
  platforms: [android]
  attack: T1027.002,T1406
  mbc: F0001

traits:
  - id: native-util-class
    desc: DEX references nmmp NativeUtil runtime class
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Lcom/nmmedit/protect/NativeUtil;"

  - id: native-bridge-library
    desc: Native library registers nmmp NativeUtil methods
    crit: notable
    conf: 0.95
    for: [elf, so]
    if:
      type: text
      exact: "com/nmmedit/protect/NativeUtil"

composite_rules:
  - id: virtualized-dex
    desc: APK code virtualized by the nmmp DEX VM
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [android_apk, zip, dex, elf, so]
    all:
      - id: native-util-class
      - id: native-bridge-library
