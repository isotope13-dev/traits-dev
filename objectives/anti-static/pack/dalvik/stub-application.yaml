# Shell ("stub") Application packing for Android. The shipped classes.dex is a
# loader only: from attachBaseContext it reads encrypted DEX files out of
# assets/, writes them to a private dex directory, splices them into the
# app classloader through DexPathList's element factory, and then swaps
# ActivityThread's Application object for the real one it just decrypted.
# Commercial protectors, cracked-game repacks and banking-trojan droppers
# share this exact handover; the real code is never in a DEX the scanner sees.
defaults:
  platforms: [android]
  for: [dex]
  attack: T1027.002,T1406
  mbc: F0001

composite_rules:
  - id: asset-dex-stub-application
    desc: Stub Application injects asset DEX and swaps itself
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: micro-behaviors/process/create/loader::dalvik-get-assets-call
      - id: micro-behaviors/process/create/loader::path-list-field
      - id: micro-behaviors/process/create/loader::dex-elements-field
      - id: micro-behaviors/process/create/loader::dex-path-list-element-factory
      - id: micro-behaviors/process/create/loader::activitythread-initial-application-field
