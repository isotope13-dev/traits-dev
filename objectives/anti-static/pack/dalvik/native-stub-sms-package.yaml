# Native-library stub packing for Android. The shipped classes.dex only
# overrides Application.attachBaseContext and calls loadLibrary; the real
# code is decrypted by a JNI library with obfuscated exports, so no scanner
# ever sees it as DEX. Alone that shape is common (SoLoader, multidex); with
# the full SMS read/send/receive cluster it is the packed SMS-trojan layout.
defaults:
  platforms: [android]
  attack: T1027.002,T1406,T1636.004

composite_rules:
  - id: native-stub-application-sms-trojan
    desc: Native-loader stub app with SMS read/send/receive
    crit: hostile
    conf: 0.9
    for: [zip, android_apk, apk_android, xml, dex, elf]
    # The DEX stub and JNI library belong to one APK; do not combine
    # permissions or loader evidence across separate APKs in a source bundle.
    scope: archive
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-manifest-identity
      - id: well-known/app/communication/android-incallui::incallui-manifest-identity
      - id: metadata/path::test-directory-component
      - id: well-known/app/communication/mobilego::mobilego-manifest-identity
    all:
      - id: micro-behaviors/process/lifecycle/initialize::attach-base-context
      - id: micro-behaviors/dylib/load/runtime::dex-load-library-reference
      - id: metadata/binary/symbols/plugin::jni-native-method-exports
      - id: metadata/permission/storage::android-read-sms-declared-request
      - id: metadata/permission/network::android-send-sms-declared-request
      - id: metadata/permission/network::android-receive-sms-declared-request
