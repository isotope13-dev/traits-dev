# Petite packing, a VB6 runtime and memory protection/allocation APIs
# indicate unpacker capability; no staged payload activation is required.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: B0032
composite_rules:
- id: petite-vb6-memory-api-profile
  desc: Petite-packed VB6 with memory API clues
  crit: suspicious
  conf: 0.93
  all:
  - id: objectives/anti-static/pack/detect::petite-section
  - id: metadata/binary/framework::vb6-runtime-dll
  - id: micro-behaviors/mem/protect/modify::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  any:
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
