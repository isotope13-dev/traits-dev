# Petite-packed stub with large overlay containing multiple benign PE
# binaries as camouflage. The stub is tiny (few functions, few imports)
# but the file is large due to appended legitimate executables that
# reduce overall entropy and inject benign vendor metadata.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009
  mbc: B0032
composite_rules:
- id: petite-encoded-overlay-loader
  desc: Petite stub pairs a large alphanumeric overlay with memory APIs
  crit: suspicious
  conf: 0.97
  attack: T1027.002,T1620
  all:
  - id: objectives/anti-static/pack/detect::petite-section
  - id: objectives/anti-static/obfuscation/payload/encoded::custom-alphabet-encoded-blob
  - id: metadata/binary/layout::medium-overlay-size
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
- id: tiny-truncated-pe-loader-stub
  desc: Tiny PE with truncated loader sections
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/metrics/structural::section-exceeds-file-size
  - id: metadata/binary/metrics/structural::multiple-pe-section-overflows
  - id: metadata/binary/metrics/structural::pe-relocation-table-overhang
  # The three legs above are all consequences of one fact — the raw data the
  # section headers describe is not present in the file — so a file that was
  # merely cut short satisfies all of them. A Petite stub is not truncated: it
  # carries its compressed payload inline, so the bytes that are present are
  # compression-grade. Requiring that entropy separates a packer stub from a
  # PE fragment (minimized fuzzer inputs, partial downloads, carved samples).
  - id: metadata/binary/metrics/threshold::high-overall-entropy-binary
  size_max: 4096
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
- id: petite-stub-multi-pe-overlay
  desc: Petite-packed stub with multiple embedded PE overlays
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/anti-static/pack/detect::petite-section
  - id: metadata/binary/metrics/structural::embedded-pe-three-plus
  - id: metadata/binary/metrics/structural::no-functions
  any:
  - id: objectives/anti-static/obfuscation/string/junking::repeated-padding-marker
  - id: metadata/binary/metrics/structural::malformed-pe-structure
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/installer/script/

# Compact unsigned Petite stub: two sections, packed body as a custom alphabet
# blob, and the classic VirtualAlloc/VirtualProtect unpack pair with dynamic
# GetProcAddress resolution. Distinct from the overlay-camouflage shape above.
- id: petite-stub-dynamic-unpacker
  desc: Petite two-section stub dynamically unpacks in memory
  # Petite packing and in-memory decompression are suspicious but are also
  # used by legitimate protected software; they do not establish an attack.
  crit: suspicious
  conf: 0.97
  attack: T1027.002,T1620
  size_max: 262144
  all:
  - id: objectives/anti-static/pack/detect::petite-section
  - id: metadata/binary/section/metrics::two-section-pe
  - id: objectives/anti-static/obfuscation/payload/encoded::custom-alphabet-encoded-blob
  - id: objectives/anti-static/obfuscation/payload/import::pe-dynamic-resolution
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  - id: metadata/binary/metrics/threshold::high-overall-entropy-70
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
