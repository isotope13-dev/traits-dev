# Midgetpack-packed ELF: the password-integrity runtime stub with its
# key-exchange failure message or a writable entry segment.
defaults:
  platforms: [unix]
  for: [elf]
  size_min: 8192
  size_max: 16777216

composite_rules:
  - id: midgetpack-packed-output
    desc: Midgetpack packed ELF output payload
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/build/packer/midgetpack::starting-stub-msg
      - id: metadata/build/packer/midgetpack::integrity-good-password-msg
    any:
      - id: metadata/build/packer/midgetpack::curve25519-failed-msg
      - id: metadata/binary/header/program::elf-entry-in-writable-segment
