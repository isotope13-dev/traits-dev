# Rust pack-v3 loader fingerprints.  The proprietary markers and source paths
# are kept as atoms; intent comes only from the multi-signal composites below.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: F0001

traits:
  - id: pack-v3-magic-marker
    desc: Pack-v3 loader format marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: pack-v3-magic

  - id: pack-v3-encryption-marker
    desc: Pack-v3 encryption-mode marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: pack-v3-encrypt

  - id: rust-packer-stub-source-path
    desc: Rust packer stub source path
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: src/bin/stub.rs

  - id: rust-chacha20-crate-source-path
    desc: Rust ChaCha20 crate source path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: chacha20-0.

composite_rules:
  - id: pack-v3-format
    desc: Pack-v3 format with encryption marker
    crit: suspicious
    conf: 0.98
    attack: T1027.002,T1140
    all:
      - id: pack-v3-magic-marker
      - id: pack-v3-encryption-marker

  - id: rust-chacha-lz4-packer-stack
    desc: Rust ChaCha20 and LZ4 packer implementation
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/stream::rust-stream-cipher
      - id: micro-behaviors/data/compress/library::rust-lz4-flex-crate
    any:
      - id: rust-packer-stub-source-path
      - id: rust-chacha20-crate-source-path

  - id: pack-v3-rust-encrypted-loader
    desc: Pack-v3 Rust encrypted ELF loader
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1140,T1620
    mbc: B0032
    all:
      - id: pack-v3-format
      - id: rust-chacha-lz4-packer-stack
      - id: objectives/anti-static/pack/detect::no-section-headers
      - id: micro-behaviors/fs/proc/info/path::process-self-fd-path
