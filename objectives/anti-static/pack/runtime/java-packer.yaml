defaults:
  platforms: [unix, windows, macos]
# Java Packer / Obfuscator Objectives
composite_rules:
  - id: java-obfuscated-packer
    desc: Java archive decryptor with dynamic class definition
    crit: suspicious
    conf: 0.9
    # A JAR pools unrelated libraries; require these capabilities in one class.
    for: [java, class]
    scope: file
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass-any
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
      - id: micro-behaviors/data/archive/library::jvm-jar-api-reference
      - id: micro-behaviors/crypto/library/provider::java-raw-key-cipher-use
    unless:
      - id: well-known/app/development/lyric::lyric-toolchain-context
      - id: well-known/app/development/lyric::lyric-maven-resolver
  - id: stringer-obfuscator
    desc: Java archive protected by Stringer Obfuscator
    crit: suspicious
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/bytecode::stringer
      - id: objectives/anti-static/obfuscation/obfuscator/bytecode::stringer-licelus
