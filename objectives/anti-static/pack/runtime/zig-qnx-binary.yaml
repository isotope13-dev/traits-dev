defaults:
  platforms: [qnx]
  for: [elf]
  attack: T1027

composite_rules:
  - id: qnx-zig-elf-chacha-symbols
    desc: QNX Zig ELF random ChaCha
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: metadata/lang/compiler/native::zig-random-chacha-signature

  - id: qnx-zig-elf-chacha20-symbol
    desc: QNX Zig ELF chacha20 symbol
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: metadata/lang/compiler/native::zig-chacha20-signature

  - id: qnx-zig-elf-flate-decode
    desc: QNX Zig ELF flate decode
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: metadata/lang/compiler/native::zig-flate-decompress-signature

  - id: qnx-zig-elf-test-entry
    desc: QNX Zig ELF test entry
    crit: component
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: metadata/lang/compiler/native::zig-test-main-signature

  - id: qnx-zig-elf-packed-payload
    desc: QNX Zig ELF packed payload
    crit: hostile
    conf: 0.96
    all:
      - id: qnx-zig-elf-chacha-symbols
      - id: qnx-zig-elf-chacha20-symbol
      - id: qnx-zig-elf-flate-decode
      - id: qnx-zig-elf-test-entry
