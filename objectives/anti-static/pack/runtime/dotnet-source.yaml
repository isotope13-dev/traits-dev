defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1027.002
  mbc: B0032

traits:
  - id: dotnet-tail-stream-slice
    desc: .NET reads appended tail
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'stream\.Position = \(long\)[\s\S]{0,80}stream\.Length - \(long\)'

  - id: dotnet-entrypoint-invoke
    desc: .NET invokes loaded entrypoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: EntryPoint.Invoke

  - id: dotnet-getoriginaldata-unpack
    desc: .NET GetoriginalData unpack stub
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: GetoriginalData

  - id: dotnet-lzma-native-unpack-stub
    desc: .NET LZMA native unpack stub
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: LzmaBlockUnPack

  - id: dotnet-new-decompress-load
    desc: .NET loads decompressed assembly
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'Assembly\.Load\(new [A-Za-z0-9_]+.{0,45}\.Decompress'

  - id: dotnet-resource-base64-getobject
    desc: .NET decodes resource object
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'FromBase64String[\s\S]{0,180}\.GetObject\('

composite_rules:
  - id: dotnet-remote-byte-decryptor
    desc: .NET remote-stage byte decryptor
    crit: notable
    conf: 0.95
    for: [csharp, pe, dll]
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
      - id: micro-behaviors/crypto/symmetric/xor/loop::csharp-byte-xor-modulo-loop

  # `invoke-token` was one of the two legs, and it matches the bare member name
  # "Invoke" -- a string that sits in the metadata of essentially every managed
  # assembly, delegates included. It carried this composite (and, through the
  # `objectives/anti-static/pack/` directory references that consume it, the
  # claim that the image is packed) on ordinary WinForms programs such as the
  # `flister.exe` bundled in filename-lister. An actual reflective invocation
  # is the qualified call, so the legs are the qualified forms; the bare token
  # remains available as a component for composites that pair it with a load.
  - id: dotnet-remote-entrypoint-invocation
    desc: .NET invokes the remotely loaded entrypoint
    crit: notable
    conf: 0.92
    for: [csharp, pe, dll]
    any:
      - id: dotnet-entrypoint-invoke
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::csharp-reflection-invoke-call

  - id: dotnet-appended-assembly-loader-source
    desc: .NET appended payload loader
    crit: hostile
    conf: 0.98
    all:
      - id: dotnet-tail-stream-slice
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load
    any:
      - id: dotnet-new-decompress-load
      - id: dotnet-entrypoint-invoke
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
      - id: micro-behaviors/fs/read/self::executable-path-self-reference

  - id: dotnet-resource-reflective-loader-source
    desc: .NET resource reflective loader
    crit: hostile
    conf: 0.98
    all:
      - id: dotnet-resource-base64-getobject
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load
      - id: micro-behaviors/os/api-resolution/dynamic::assembly-load-getmethod-chain
    any:
      - id: micro-behaviors/data/embedded/payload/resource::resourcemanager-getobject-call
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/runtime::method-invoke

  - id: dotnet-lzma-packed-assembly-loader
    desc: .NET LZMA packed assembly loader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-buffer
      - id: dotnet-getoriginaldata-unpack
      - id: dotnet-lzma-native-unpack-stub
      - id: dotnet-entrypoint-invoke

  - id: dotnet-remote-encrypted-entrypoint-loader
    desc: .NET remotely retrieves encrypted bytes and invokes a managed entrypoint
    crit: hostile
    conf: 0.99
    for: [csharp, pe, dll]
    attack: T1105,T1140,T1620
    all:
      - id: micro-behaviors/communications/http/client/managed::downloaddata
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-buffer
      - id: dotnet-remote-byte-decryptor
      - id: dotnet-remote-entrypoint-invocation
