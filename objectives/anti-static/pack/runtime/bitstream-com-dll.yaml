defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1027,T1140
composite_rules:
  - id: bitstream-registration-unpacker
    desc: Registration DLL decodes bytes beside large constants
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/instruction/operand::x64-large-small-immediate-pairs
      - id: micro-behaviors/data/decode/xor/transform::x64-byte-subtract-xor-store
      - id: metadata/binary/symbols/exports::export-dll-register-server
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple

  - id: registration-dll-reflective-pe-unpacker
    desc: Registration DLL decodes and unpacks PE payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1620
    all:
      - id: objectives/anti-static/pack/runtime::bitstream-registration-unpacker
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: metadata/binary/header/geometry::pe-large-ultralow-entropy-image
      - id: micro-behaviors/process/fiber::switch-to-fiber
