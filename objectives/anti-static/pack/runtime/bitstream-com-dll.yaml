defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1027,T1140
composite_rules:
  - id: bitstream-registration-unpacker
    desc: Registration DLL decodes bytes beside large constants
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/instruction/operand::x64-large-small-immediate-pairs
      - id: micro-behaviors/data/decode/xor::x64-byte-subtract-xor-store
      - id: metadata/binary/symbols/exports::export-dll-register-server
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
