defaults:
  platforms: [routeros, appliance, unix]
  for: [python, pyc]
  attack: T1027
  mbc: B0032

# `python-xor-modulo-key-loop` moved to
# micro-behaviors/data/encode/xor::xor-indexed-assign-modulo-key -- a
# repeating-key XOR loop is a neutral byte transform (media extractors and
# WebSocket masking use the same line), so it is a capability, not a packing
# objective. The loader composite below supplies the intent.
traits:
  - id: python-payload-file-name
    desc: Python payload file name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'payload\.(enc|dat|bin)'

composite_rules:
  - id: python-xor-file-runtime-loader
    desc: Python XOR file runtime loader
    crit: hostile
    conf: 0.98
    all:
      - id: python-payload-file-name
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/encode/xor::xor-indexed-assign-modulo-key
    any:
      - id: micro-behaviors/os/api-resolution/dynamic::python-module-dict-exec
      - id: micro-behaviors/process/interpreter/python::exec-builtin
