defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]

traits:
  # Position-independent LZMA stage entry used by compact MIPS runtime
  # unpackers. The branch target varies with the compressed carrier, while
  # the decoder-state initialization and range-coder setup remain stable.
  - id: mips-lzma-loader-entry
    desc: MIPS position-independent LZMA loader entry
    crit: notable
    conf: 0.99
    mbc: F0001
    attack: T1140
    if:
      type: hex
      offset_range: [0, null]
      pattern: "04 11 [2] 27 F7 00 00 90 99 00 00 24 01 FA 00 90 98 00 01 33 22 00 07 00 19 C8 C2 03 21 08 04 24 21 F1 60"
