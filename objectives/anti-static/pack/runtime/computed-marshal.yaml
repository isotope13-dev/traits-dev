defaults:
  for: [python, xml]
  platforms: [unix, windows]

composite_rules:
  - id: computed-exec-compressed-marshal
    desc: Computed exec lookup accompanies compressed marshaled code
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.006
    near_bytes: 512
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::codepoint-exec-builtin-lookup
      - id: micro-behaviors/data/serialize/unsafe::dynamic-marshal-loads-text
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-dynamic
    any:
      - id: metadata/file/encoding/shape::python-base64-alphabet-run
      - id: metadata/file/encoding/shape::large-base64-like-literal
