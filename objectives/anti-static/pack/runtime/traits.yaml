defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: pe-import-count-under-10
  desc: PE has under ten imports
  crit: component
  conf: 0.9
  if:
    type: metrics
    field: imports.count
    max: 9
  unless:
  - type: metrics
    field: exports.count
    min: 20
  - type: metrics
    field: pe.is_dotnet
    min: 1
  - id: metadata/binary/framework::dotnet-metadata
- id: embedded-stage-copy-jump-x64
  desc: Embedded-stage copy loop and indirect jump
  crit: notable
  conf: 0.97
  attack: T1620
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: "AD AB FF C9 75 FA [0-16] 41 FF E?"
composite_rules:
- id: rwx-copy-jump-stage-loader
  desc: RWX embedded-stage copy and indirect jump
  crit: hostile
  conf: 0.99
  attack: T1027.001,T1620
