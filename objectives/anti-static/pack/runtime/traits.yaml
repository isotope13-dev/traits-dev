  - id: metadata/binary/framework/

# Sibling of `importless-single-section-high-entropy-body` without its 128 KB
# floor. That rule needs the size gate because its legs (no imports, high
# entropy, one section) are individually weak; a small file can satisfy all
# three by accident. Zero declared data directories is not weak — an image that
# names no import directory cannot have been produced by a linker, so it
# carries the conclusion on its own and the composite can reach the small
# crypter stubs the size floor was excluding.
- id: headerless-importless-packed-pe
  desc: PE with no data directories and packed body
  crit: hostile
  conf: 0.97
  attack: T1027.002
  mbc: B0032
  for: [pe]
  all:
  - id: metadata/binary/anomaly/format::pe-no-data-directories
  - id: metadata/binary/metrics/structural::single-section-pe
  - id: metadata/binary/metrics/structural::high-code-entropy
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
- id: unsigned-microsoft-packed-tls-loader
  desc: Unsigned Microsoft-claim PE combines TLS callbacks with packed data
  crit: hostile
  conf: 0.96
  attack: "T1036.005,T1027.002"
  all:
  - id: objectives/evasion/masquerade/trust::unsigned-pe-microsoft-version-claim
  - id: metadata/binary/layout::pe-multiple-tls-callbacks
  # Entropy >= 6.0 is common in ordinary MSVC C++ system DLLs; require the
  # packing-grade threshold (>= 7.0) so "packed data" matches the description.
  - id: metadata/binary/metrics/threshold::high-overall-entropy-70
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/certificate/identity/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework::dotnet-comhost-runtime
  - id: well-known/app/infrastructure/windows-text-input-formatter::text-input-method-formatter-identity
- id: tls-fiber-rwx-unpacking-loader
