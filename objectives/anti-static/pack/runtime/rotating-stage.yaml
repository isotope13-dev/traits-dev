defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  - id: return-address-rotate-xor-stage-decoder
    desc: Rotate/XOR entry decoder with indirect jump
    crit: suspicious
    conf: 0.99
    attack: T1027.013,T1140
    if:
      type: hex
      section: .data
      pattern: "41 5A [0-8] 41 C1 02 ?? 41 C1 4A 04 ?? 41 81 72 08 ?? ?? ?? ?? [0-16] 41 81 72 0C ?? ?? ?? ?? 41 FF E2"

composite_rules:
  - id: rwx-copy-self-decrypting-stage
    desc: Embedded RWX stage rewrites its own entry instructions
    crit: hostile
    conf: 0.99
    attack: T1027.013,T1140,T1620
    all:
      - id: return-address-rotate-xor-stage-decoder
      - id: objectives/anti-static/pack/runtime::rwx-copy-jump-stage-loader
