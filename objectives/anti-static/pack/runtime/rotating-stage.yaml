    desc: Rotate/XOR entry decoder with indirect jump
    crit: suspicious
    conf: 0.99
    attack: T1027.013,T1140
    if:
      type: hex
      section: .data
      pattern: "41 5A [0-8] 41 C1 02 ?? 41 C1 4A 04 ?? 41 81 72 08 ?? ?? ?? ?? [0-16] 41 81 72 0C ?? ?? ?? ?? 41 FF E2"

