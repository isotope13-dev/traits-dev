defaults:
  attack: T1027.002
  mbc: B0032
  platforms: [windows]
  for: [pe, dll]

traits:
  # .NET Core/5+ runtime assembly names. In an actual managed assembly these are
  # ordinary metadata; in a NATIVE PE (no COM descriptor) their presence as
  # plain strings means a .NET payload/runtime is embedded for reflective
  # loading. Kept as separate substr atoms (a composite below requires several
  # distinct names so a stray mention does not fire).
composite_rules:
  # >=3 distinct .NET runtime assembly names embedded as strings.
  - id: native-host-embedded-dotnet-payload
    desc: Native PE conceals embedded .NET payload
    crit: hostile
    conf: 0.95
    attack: "T1620"
    all:
      - id: metadata/lang/runtime::dotnet-runtime-name-cluster
      - id: metadata/binary/section/header::reloc-overhang-dominant
    unless:
      - id: metadata/binary/framework/
  - id: dotnet-packed-loader
    desc: Packed .NET dynamic loader chain
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: objectives/command-and-control/dropper/staging/managed::minimal-import-stub-signal
    any:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-assembly-load-invoke
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-reflective-loader-chain
    unless:
      - id: objectives/anti-static/obfuscation/obfuscator/managed/
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: well-known/dual-use/tunnel/connectify/

  - id: unsigned-dotnet-obfuscated-loader-stub
    desc: Unsigned opaque high-entropy .NET loader stub
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/symbols/imports::single-import-count
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/file/entropy::very-high-overall-entropy-75
    unless:
      - id: metadata/signed/platform/
      - id: objectives/anti-static/obfuscation/obfuscator/managed/
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: well-known/lib/ui/devexpress/

  - id: dotnet-sparse-import-encrypted-resource-stager
    desc: Sparse-import .NET loader reflectively stages an encrypted resource
    crit: hostile
    conf: 0.97
    attack: T1620,T1027
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/symbols/imports::single-import-raw
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      # The encrypted stage must be represented by a large, high-entropy
      # managed resource.  A high-entropy .text section is normal for a
      # compiled source generator and is not evidence of an encrypted blob.
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      # STAGING is what makes this a loader rather than an ordinary resource
      # read: the decrypted bytes have to be handed to Assembly.Load /
      # Assembly.LoadFrom.  Without that leg the remaining conditions are all
      # near-universal for a WPF application -- every managed PE has the single
      # mscoree import, every compiled XAML app references ResourceReader and
      # ships a large compressed `<app>.g.resources`, and `Activator` is the
      # ordinary way to build a COM object from a ProgID -- so the rule fired
      # on plain signed WPF installers.
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-explicit-load-api
    unless:
      - id: metadata/signed/platform/
      - id: objectives/anti-static/obfuscation/obfuscator/managed/
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context
      - id: well-known/lib/runtime/managed/dotnet-runtime::mono-mscorlib-runtime-context

  # Resource-backed pixel extraction plus reflective activation and high
  # entropy is the characteristic of an in-memory packed payload, rather than
  # ordinary .NET resource use.  Activator and bitmap pixel access alone are
  # common in legitimate VB/.NET image tools, so require a real assembly-load
  # leg before calling this a payload loader.
  - id: dotnet-bitmap-reflective-payload-loader
    desc: .NET bitmap-backed reflective payload loader
    crit: hostile
    conf: 0.97
    attack: "T1027.003,T1620"
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource/identity::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-backed-bitmap
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: metadata/binary/code/entropy::high-code-entropy
    any:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-explicit-load-api
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-buffer

  - id: dotnet-gzip-base64-reflective-loader
    desc: Unsigned .NET GZip/Base64 reflective loader
    crit: hostile
    conf: 0.98
    attack: "T1027,T1140,T1620"
    mbc: "B0032,E1059"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/code/entropy::native-code-entropy-78
      - id: "micro-behaviors/data/codec::dotnet-gzip-compression"
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/os/api-resolution/dynamic::assembly-load-type-method-marker-cluster
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-packed-stub
    desc: High-entropy .NET stub with packer-specific entry behavior
    crit: suspicious
    conf: 0.88
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/code/entropy::high-code-entropy
    any:
      - id: objectives/anti-static/pack/polymorphic::unusual-entry-point-section
      - id: objectives/anti-static/pack/detect::themida-section
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-assembly-load-invoke
    unless:
      # Black Lightning is a verified managed game client whose ordinary CLR
      # image has one native import and high-entropy UI resources. Those
      # structural facts do not make its entry assembly a packed stub.
      - id: well-known/app/system/black-lightning::black-lightning-identity-context
    downgrade:
      any:
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: metadata/binary/debug::pdb-visual-studio
        - id: well-known/app/system/crayens/
        - id: objectives/anti-static/obfuscation/obfuscator/managed/
        - id: metadata/build/protector::dotnet-reactor-module-guid-type

  - id: dotnet-dominant-resource-packed-stub
    desc: .NET packed stub with dominant resource payload
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
      - id: metadata/binary/section/prose::medium-pe-string-concealment-profile
    unless:
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/family/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
      - id: well-known/app/system/stresstimulus::logicnp-cryptolicensing
    ref: sha256:5fcb9d72408d6781741db2da86b7d4675d607f469a731a9786fc96d59a1e9eb6

  - id: dotnet-resource-crypter-layout
    desc: .NET CLR stub with dominant resource and missing metadata root
    crit: suspicious
    conf: 0.94
    all:
      - id: dotnet-dominant-resource-packed-stub
    any:
      - id: metadata/binary/resource/size::minimal-resources
      - id: metadata/binary/section/reloc::pe-relocation-table-overhang
      - id: metadata/binary/layout/overlay::has-overlay
    unless:
      # A valid managed assembly carries the BSJB metadata-root signature;
      # this layout is specifically the metadata-obscuring CLR stub shape.
      - id: metadata/binary/framework::dotnet-metadata
    ref: sha256:5fcb9d72408d6781741db2da86b7d4675d607f469a731a9786fc96d59a1e9eb6

  - id: clr-header-without-metadata-root
    desc: .NET CLR header without metadata root signature
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: flattened-packer-clr-loader
    desc: Control-flow-flattened packer with CLR loader marker
    crit: suspicious
    conf: 0.9
    all:
      # CorExitProcess is also emitted by ordinary native MSVC/JNI builds;
      # require an actual CLR header and the structural entropy signal before
      # treating the combination as a packed managed loader.
      - id: metadata/binary/framework::clr-runtime-header
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: micro-behaviors/process/exit/terminate::corexitprocess-string
    unless:
      - id: metadata/binary/vendor/

  - id: dotnet-admin-reflective-resource-loader
    desc: Admin-elevated reflective resource loader
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
      - id: metadata/lang/compiler/managed::get-method-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: micro-behaviors/os/privilege/manifest::require-administrator
      - id: metadata/hardening/memory::wx-section

  # CLR crypter stubs keep the COM descriptor but strip BSJB metadata; the
  # encrypted overlay is read, decrypted, and handed to MethodBase.Invoke on the
  # resolved entry point. Requiring dotnet-assembly misses this shape entirely.
  - id: clr-crypter-overlay-entrypoint-loader
    desc: CLR crypter stub decrypts overlay and invokes entry point
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1620
    mbc: B0030,B0040
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: metadata/binary/section/header::pe-il-only-without-clr-metadata
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/crypto/library/stdlib::dotnet-cryptostream
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-token
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: unsigned-zero-width-msil-exfil-stub
    desc: Unsigned MSIL stub with zero-width IDs, AMSI, and WebClient
    crit: hostile
    conf: 0.97
    attack: T1027,T1071.001,T1562.001
    all:
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206d
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206f
      - id: objectives/anti-static/obfuscation/payload/resource::unsigned-dotnet-mismatch-appdomain
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/os/security/amsi::scan-buffer-api
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
