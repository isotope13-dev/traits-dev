defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: aplib-memory-section-unpacking
    desc: aPLib decoder with memory-only code section
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    all:
      - id: micro-behaviors/data/decompress/aplib::x64-aplib-depacker
      - id: metadata/binary/section/entropy::large-high-entropy-boot-section
      - id: metadata/binary/section/header::pe-entry-in-nonstandard-section
      - id: metadata/binary/section/layout::winlicense-memory-section
