defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
traits:
- id: python-exec-marshal-bytes
  desc: Executes a marshaled bytes literal
  crit: notable
  conf: 0.96
  platforms:
  - unix
  - windows
  if:
    type: text
    regex: exec\s*\(\s*marshal\.loads\s*\(\s*b['"]
composite_rules:
- id: python-module-exec-marshal-bytes
  desc: Module executes a marshaled bytes blob
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.006
  scope: file
  all:
  - id: metadata/lang/source/declaration::python-column-zero-marshal-import
  - id: python-exec-marshal-bytes
- id: python-import-execs-marshal-blob
  desc: Import executes a marshaled code blob
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.006
  scope: file
  all:
  - id: python-exec-marshal-bytes
  - id: micro-behaviors/process/interpreter/eval/direct::module-scope-exec-builtin
- id: exec-marshal-zlib
  desc: Evaluates decompressed marshaled Python code
  crit: suspicious
  conf: 0.99
  mbc: B0032
  attack: T1027
  # One payload expression. Separate generator stubs (a zlib wrapper in one
  # function, a marshal wrapper in the next) are not a single executed blob.
  near_bytes: 256
  all:
  - id: micro-behaviors/process/deploy/script-eval::python-exec-zlib-marshal-chain
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/data/serialize/unsafe::marshal-loads
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  any:
  - id: micro-behaviors/data/decode/base85::b85decode-script
  - id: micro-behaviors/data/decode/base64::b64decode-call
