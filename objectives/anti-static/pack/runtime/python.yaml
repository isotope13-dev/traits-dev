defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
traits:
- id: python-exec-marshal-bytes
  desc: exec with marshal.loads on bytes literal
  crit: notable
  conf: 0.96
  platforms:
  - unix
  - windows
  if:
    type: text
    regex: exec\s*\(\s*marshal\.loads\s*\(\s*b['"]
composite_rules:
- id: python-module-exec-marshal-bytes
  desc: Module-level marshal execution attempt
  crit: suspicious
  conf: 0.98
  attack: T1027,T1059.006
  scope: file
  all:
  - id: "metadata/lang/source/syntax/directive::python-column-zero-marshal-import"
  - id: python-exec-marshal-bytes
  unless:
  - id: metadata/path/directory::test-directory-component
- id: python-import-execs-marshal-blob
  desc: Import-time marshal execution attempt
  crit: suspicious
  conf: 0.98
  attack: T1027,T1059.006
  scope: file
  all:
  - id: python-exec-marshal-bytes
  - id: micro-behaviors/process/interpreter/eval/python-builtins::module-scope-exec-builtin
  unless:
  - id: metadata/path/directory::test-directory-component
- id: exec-marshal-zlib
  desc: Evaluates decompressed marshaled Python code
  crit: suspicious
  conf: 0.99
  mbc: B0032
  attack: T1027
  # One payload expression. Separate generator stubs (a zlib wrapper in one
  # function, a marshal wrapper in the next) are not a single executed blob.
  near_bytes: 256
  all:
  - id: micro-behaviors/process/deploy/script-eval/transformed::python-exec-zlib-marshal-chain
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/data/serialize/unsafe::marshal-loads
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  any:
  - id: micro-behaviors/data/decode/base85::b85decode-script
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  unless:
  - id: exec-marshal-decompress-blob
# General decompressor sibling of exec-marshal-zlib: the executed code is
# not decompressed source text but a marshal code object recovered from a
# compressed, text-encoded blob and executed at module scope, so no
# readable source ever appears in the file. The zlib-only chain above
# misses the same construction over lzma, bz2 or gzip; this form keys on
# the marshal-plus-decompress-plus-exec chain in one expression, whatever
# module supplies the decompression and whatever text encoding wraps it.
# The long-literal leg keeps toy template stubs that exec an empty
# stream (a dozen Base64 characters, no payload) at suspicious.
- id: exec-marshal-decompress-blob
  desc: Executes marshaled code from compressed blob
  crit: hostile
  conf: 0.97
  mbc: B0032
  attack: T1027,T1140,T1059.006
  near_bytes: 512
  all:
  - id: micro-behaviors/data/serialize/unsafe::exec-marshal-loads-text
  - id: micro-behaviors/data/compression::python-module-decompress-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::module-scope-exec-builtin
  - id: metadata/file/encoding/shape::python-long-base64-looking-string-literal
  any:
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: micro-behaviors/data/decode/base85::b85decode-script
  - id: micro-behaviors/data/decode/hex::python-fromhex
