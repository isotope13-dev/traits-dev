# Python Packing Patterns
# Detects common Python packing/obfuscation techniques
# MBC: B0032 (Obfuscated Files or Information)
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
traits:
  - id: python-exec-marshal-bytes
    desc: Executes a marshaled bytes literal
    crit: notable
    conf: 0.96
    platforms: [unix, windows]
    if:
      type: text
      regex: 'exec\s*\(\s*marshal\.loads\s*\(\s*b[''"]'
  - id: python-import-marshal-line
    desc: Imports marshal at module scope
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?m)^import marshal\s*$'
composite_rules:
  - id: python-module-exec-marshal-bytes
    desc: Module executes a marshaled bytes blob
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.006
    scope: file
    all:
      - id: python-import-marshal-line
      - id: python-exec-marshal-bytes
  - id: python-import-execs-marshal-blob
    desc: Import executes a marshaled code blob
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.006
    scope: file
    all:
      - id: python-exec-marshal-bytes
      - id: micro-behaviors/process/interpreter/python::module-scope-exec-builtin
  # Executing marshal-deserialized zlib-compressed payload
  # Pattern: exec(marshal.loads(zlib.decompress(base64.b85decode(...))))
  # This is a very specific and high-signal hostile pattern used by Python packers/droppers.
  - id: exec-marshal-zlib
    desc: Executing marshal-deserialized zlib-compressed payload
    crit: hostile
    conf: 0.99
    mbc: "B0032"
    attack: "T1027"
    all:
      - id: micro-behaviors/process/interpreter/python::exec-builtin
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
    any:
      - id: micro-behaviors/data/encode/base85
      - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
