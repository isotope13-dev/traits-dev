defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jnic-compressed-native-resource-loader
    desc: JNIC compressed native-resource loader
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule jnic_compressed_native_resource_loader {
          strings:
            $resource = /\/dev\/jnic\/lib\/[^\x00\r\n]{10,80}\.dat/ ascii
            $loader = "JNICLoader" ascii
            $input = "java/io/InputStream" ascii
            $data = "java/io/DataInputStream" ascii
            $read = "readUnsignedByte" ascii
            $stream = "getResourceAsStream" ascii
            $system = "java/lang/System" ascii
            $load = "load" ascii
            $output = "java/io/FileOutputStream" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
