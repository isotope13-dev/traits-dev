defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: fsp-compressed-section-loader
    desc: FSP import bootstrap with high-entropy resources
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/dylib/lookup::fsp-api-list-resolution-loop
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
  - id: fsp-mmym-trampoline-sparse-loader
    desc: FSP-packed PE with mmym trampoline entry and sparse runtime-resolved imports
    crit: hostile
    conf: 0.97
    attack: T1027.002
    mbc: B0032
    all:
      - id: fsp-compressed-section-loader
      - id: metadata/binary/section/label::mmym-small-executable-section
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::dummy-register-push-ret-trampoline
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
