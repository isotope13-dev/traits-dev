# Tiny unsigned PEs that claim EFI, zero the DOS stub, and have no imports
# are packed stubs, not firmware: Windows malware uses the EFI subsystem
# flag as a parser-breaking disguise.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  crit: hostile
  conf: 0.93

composite_rules:
  - id: efi-pe-no-imports
    desc: EFI-subsystem PE with zeroed DOS stub and no imports
    all:
      - id: metadata/binary/header/malformed::efi-pe-subsystem
      - id: metadata/binary/header/malformed::pe-dos-stub-zeroed
      - id: metadata/binary/symbols/count::no-imports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: efi-pe-blank-section
    desc: EFI-subsystem PE uses a blank-named section
    all:
      - id: metadata/binary/header/malformed::efi-pe-subsystem
      - id: metadata/binary/section/label::blank-named-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: efi-pe-opaque-name
    desc: EFI-subsystem PE uses an opaque generated name
    all:
      - id: metadata/binary/header/malformed::efi-pe-subsystem
      - id: metadata/file/naming::opaque-identifier-pe-basename
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: efi-pe-detached-signature
    desc: EFI-subsystem PE has a detached overlay signature
    all:
      - id: metadata/binary/header/malformed::efi-pe-subsystem
      - id: objectives/evasion/masquerade/binary::detached-signature-overlay
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
