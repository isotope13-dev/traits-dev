defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1027.002
  crit: hostile
  conf: 0.93
composite_rules:
- id: efi-pe-no-imports
  desc: EFI-subsystem PE with zeroed DOS stub and no imports
  size_max: 1048576
  all:
  - id: metadata/binary/header/characteristics::efi-pe-subsystem
  - id: metadata/binary/header/malformed::pe-dos-stub-zeroed
  - id: metadata/binary/symbols/count::no-imports
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: metadata/file/extension/executable::efi
  - id: micro-behaviors/os/kernel/firmware/
- id: efi-pe-opaque-name
  desc: EFI-subsystem PE uses an opaque generated name
  crit: suspicious
  all:
  - id: metadata/binary/header/characteristics::efi-pe-subsystem
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: efi-pe-detached-signature
  desc: EFI-subsystem PE has a detached overlay signature
  all:
  - id: metadata/binary/header/characteristics::efi-pe-subsystem
  - id: objectives/evasion/masquerade/binary/signature::detached-signature-overlay
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
