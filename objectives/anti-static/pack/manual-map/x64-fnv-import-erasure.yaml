defaults:
  platforms: [windows]
  for: [data]
composite_rules:
  - id: x64-fnv-packed-import-erasing-loader
    desc: Packed x64 loader hashes APIs and erases resolved import names
    crit: hostile
    conf: 0.99
    attack: T1027,T1620
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::x64-ror7-opaque-export-walk
      - id: micro-behaviors/data/encoding/xor/evolving-operand::x64-fnv16-feedback-xor
      - id: micro-behaviors/mem/fill::x64-opaque-import-name-erasure
