defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1027,T1620
  crit: hostile
  conf: 0.93
composite_rules:
- id: x64-packed-section-manual-pe-loader
  desc: x64 loader maps an embedded PE from a packed section
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/section/header::pe-entry-in-nonstandard-section
  - id: metadata/binary/section/entropy::large-high-entropy-writable-payload-section
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/dylib/lookup::get-proc-address
  unless:
  - id: metadata/signed/platform/
- id: unsigned-com-few-imports
  desc: DllRegisterServer stub has almost no imports
  all:
  - id: metadata/binary/symbols/exports::export-dll-register-server
  - id: metadata/binary/symbols/imports::few-import-count
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: unsigned-com-peb-install-register-stub
  desc: Unsigned COM install stub walks the PEB
  all:
  - id: metadata/binary/symbols/exports::export-dll-register-server
  - id: metadata/binary/symbols/exports::export-dll-install
  - id: micro-behaviors/process/info/query::peb-access-x86
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
