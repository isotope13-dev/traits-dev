# Unsigned COM/register stubs that walk their own PE header with almost no
# imports are manual-map loaders, not in-proc servers.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1620
  crit: hostile
  conf: 0.93

composite_rules:
  - id: unsigned-pe-header-walk-com
    desc: COM register stub walks its own PE header
    all:
      - id: objectives/anti-static/obfuscation/imports::pe-header-walk-x64
      - id: metadata/binary/symbols/exports::export-dll-register-server
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: unsigned-mz-walk-sparse
    desc: Sparse-import stub checks MZ then walks PE
    all:
      - id: objectives/anti-static/obfuscation/imports::mz-magic-check
      - id: objectives/anti-static/pack/runtime::pe-import-count-under-10
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: unsigned-com-few-imports
    desc: DllRegisterServer stub has almost no imports
    all:
      - id: metadata/binary/symbols/exports::export-dll-register-server
      - id: metadata/binary/symbols/imports::few-import-count
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-pe-header-walk
    desc: Opaque-named PE walks its own PE header
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: objectives/anti-static/obfuscation/imports::pe-header-walk-x64
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
