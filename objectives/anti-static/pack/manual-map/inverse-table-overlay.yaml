# A keyed inverse substitution decoder, a native PE relocation dispatcher,
# and activation through AddressOfEntryPoint establish a concealed image
# loader. The high-entropy overlay supplies storage context, not intent alone.
# No family label, marker magic, key, filename or endpoint is required.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  attack: T1027.009,T1140,T1620

composite_rules:
  - id: inverse-table-overlay-pe-loader
    desc: Keyed overlay decoder with manual PE relocation and entry call
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::x64-table-keyed-position-xor-loop
      - id: micro-behaviors/process/deploy/image-map::x64-pe-dll-flag-entry-call
      - id: micro-behaviors/data/format/pe-parser::x86-base-relocation-type-dispatch
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
