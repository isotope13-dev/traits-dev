defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: overlay-self-read-pe-map-api-profile
    desc: Self-read overlay with PE-map API clues
    crit: suspicious
    conf: 0.98
    attack: T1027.009
    all:
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes-pe-rdata
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: tls-inline-pe-memory-clues-profile
    desc: Unsigned TLS PE with inline-PE memory clues
    crit: suspicious
    conf: 0.99
    attack: T1036.005,T1027.002
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
