# ELF loaders that map themselves into a host process the same way PE
# reflective DLLs do. The export name alone is a hello-world tutorial
# signal; hostility requires an actual executable mapping operation.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1620
  mbc: F0013

traits:
  - id: elf-reflective-loader-symbol
    desc: Exports a ReflectiveLoader symbol
    crit: notable
    conf: 0.95
    if:
      type: symbol
      regex: '(^|[.])ReflectiveLoader($|[.])'

composite_rules:
  - id: elf-reflective-mprotect-loader
    desc: ReflectiveLoader changes memory protection
    crit: hostile
    conf: 0.97
    all:
      - id: elf-reflective-loader-symbol
      - id: micro-behaviors/mem/protect/modify::mprotect
  - id: elf-reflective-mmap-exec-loader
    desc: ReflectiveLoader maps executable memory
    crit: hostile
    conf: 0.97
    all:
      - id: elf-reflective-loader-symbol
      - id: micro-behaviors/mem/alloc/map::mmap-executable-syscall
  - id: elf-reflective-rwx-map-loader
    desc: ReflectiveLoader maps writable executable memory
    crit: hostile
    conf: 0.98
    all:
      - id: elf-reflective-loader-symbol
      - id: micro-behaviors/mem/alloc/map::mmap-writable-executable-syscall
