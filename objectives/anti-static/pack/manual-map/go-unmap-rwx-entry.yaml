# Go 1.14 x64 stack calling convention: the code follows e_lfanew, places
# MEM_COMMIT|MEM_RESERVE and PAGE_EXECUTE_READWRITE in adjacent argument
# slots, copies header bytes, and computes base + AddressOfEntryPoint before
# a call. The surrounding composite requires Go syscall dispatch and the
# independently recovered NtUnmapViewOfSection API name.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1027,T1620

traits:
  - id: go-byte-add-reverse-loop
    desc: Adds to and reverses input bytes
    crit: notable
    if:
      type: hex
      section: .text
      pattern: '0F B6 34 19 01 D6 40 88 34 19 48 FF C3 [0-100] 48 FF C8 [0-50] 44 0F B6 04 01'
  - id: go-pe-rwx-copy-entry-sequence
    desc: Sets RWX flags and computes PE entry
    crit: notable
    if:
      type: hex
      section: .text
      pattern: '8B 40 3C 48 01 C8 [0-240] 48 B9 00 30 00 00 40 00 00 00 48 89 4C 24 10 E8 ?? ?? ?? ?? [0-220] 48 8D 1C 02 48 8B B4 24 ?? ?? ?? ?? 48 01 D6 0F B6 36 40 88 33 48 FF C2 [0-350] 8B 40 28 48 8B 4C 24 ?? 48 01 C8 48 89 04 24 [0-80] E8 ?? ?? ?? ??'

composite_rules:
  - id: go-unmap-rwx-pe-dispatch
    desc: Go loader maps and invokes PE entry
    crit: hostile
    conf: 0.98
    all:
      - id: go-pe-rwx-copy-entry-sequence
      - id: go-byte-add-reverse-loop
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/os/syscall/invoke::go-syscall-function-pointer-dispatch
      - id: metadata/lang/compiler/systems::go-binary-comp
