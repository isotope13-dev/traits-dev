# A native program whose writable data section holds a PE image XOR-encoded
# with a repeating four-byte key, that checks MZ and PE header constants in
# its own code, names the CLR hosting library and a .NET Framework tool by
# full path, is a loader for a managed payload: it decodes the image from
# its own data and runs it inside, or in place of, the named .NET host.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1055.012,T1027.009
composite_rules:
  - id: xor4-pe-in-data-with-dotnet-host-and-header-checks
    desc: XOR4 PE in data with .NET host path
    crit: hostile
    conf: 0.87
    all:
      - id: micro-behaviors/data/embedded/payload/header::xor4-encoded-pe-in-data
      - id: micro-behaviors/fs/path/system::dotnet-framework-runtime-exe-path
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/dylib/library/family::mscoree-dll-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
