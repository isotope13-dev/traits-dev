# A native program with a megabyte of cipher-grade resource data that walks
# its own PE headers inline (e_lfanew walk, MZ word compare, header
# validation sequence) and names both the CLR hosting library and the URL
# moniker library loads or fetches a managed payload without the Windows
# loader. The inline header walk is what a hand-written image mapper needs.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1027.009,T1105
composite_rules:
  - id: resource-inline-pe-walk-with-clr-and-urlmon
    desc: Resource loader with inline PE walk, CLR and urlmon
    crit: hostile
    conf: 0.82
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/data/embedded/payload/header::x86-inline-pe-header-validation-sequence
      - id: micro-behaviors/data/parse/portable-executable::x86-e-lfanew-pe-walk
      - id: micro-behaviors/dylib/library/family::mscoree-dll-name
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
