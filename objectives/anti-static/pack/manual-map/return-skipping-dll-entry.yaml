# Debugger, termination and loader imports also occur in ordinary MSVC CRT
# code. They establish neither a debugger gate nor manual image mapping.
# Require the computed DLL entry handoff and return-address obfuscation;
# the overlay is concealed storage, not evidence of an anti-debug branch.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: return-skipping-opaque-dll-entry-loader
    desc: Return-skipping DLL loader and opaque overlay
    crit: suspicious
    conf: 0.97
    attack: T1620,T1027
    all:
      - id: micro-behaviors/process/deploy::x86-image-entry-dll-attach-call
      - id: objectives/anti-static/obfuscation/control-flow/stack::x86-return-address-junk-skip
      - id: metadata/binary/layout/overlay::large-overlay-64k
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
