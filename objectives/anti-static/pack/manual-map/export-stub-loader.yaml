# An unsigned DLL whose many exports alias one stub, that walks PE headers
# inline, changes page protections and runs several TLS callbacks before
# DllMain. Together these are a loader that maps a second image itself and
# answers the host's export calls with stubs so the host keeps running.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1574.002
composite_rules:
  - id: export-stub-dll-inline-pe-mapper-tls-loader
    desc: Export-stub DLL with inline PE mapping and TLS callbacks
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::aliased-exports
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-walk-x64
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/package/testing/
