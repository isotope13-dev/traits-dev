# A native program that resolves NtUnmapViewOfSection, checks MZ/PE header
# constants in its own code, and carries a high-entropy image whose sections
# have randomized names is a loader that replaces a mapped image with a
# payload it hid in the file. The unmap call or the header walk alone is
# ordinary; the packed, randomly named body is what a builder leaves behind.
# The CLR-host variant of this shape lives in
# `objectives/evasion/process/injection/hollowing/process`; this one does not
# need a .NET host reference.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1027.002
composite_rules:
  - id: unmap-loader-with-random-packed-section
    desc: Unmapping PE loader with random packed sections
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/file/entropy::high-overall-entropy-70
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
