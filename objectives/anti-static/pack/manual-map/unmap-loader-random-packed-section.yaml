# These co-occurring references and section properties do not establish that
# a mapped image was replaced. UPX and large native tools can share them.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1027.002
composite_rules:
  - id: unmap-loader-with-random-packed-section
    desc: Unmap name and PE checks with high-entropy sections
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: metadata/file/entropy::high-overall-entropy-70
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
