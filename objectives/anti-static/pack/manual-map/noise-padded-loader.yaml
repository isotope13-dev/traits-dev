# A thin x64 stub that parses MZ/PE headers in its own code and carries an
# .rdata section padded with fake paths spliced into printable noise is a
# manual-map loader hiding its next stage in the noise.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1620

composite_rules:
  - id: noise-padded-rdata-pe-header-loader
    desc: In-code PE loader with noise-padded rdata
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/anti-static/obfuscation/string/junking::noise-fused-program-files-paths
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: metadata/binary/section/ratio::data-section-1p5x-code
    unless:
      - id: metadata/signed/platform/
