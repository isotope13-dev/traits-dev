# A payload kept as six-bit values inside the code section cannot be an
# instruction stream or a mapped image, so something must unpack it. Code
# that also compares MZ and PE header constants itself and allocates then
# re-protects memory is a loader that rebuilds a hidden image by hand.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1027.002
composite_rules:
  - id: six-bit-packed-image-manual-mapper
    desc: Six-bit packed image rebuilt by hand mapper
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/code/density::six-bit-byte-run-text
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
