# A Go program with garbled identifiers has no need to read MZ and e_lfanew
# values or walk PE headers by hand, nor to dispatch Win32 calls through
# syscall function pointers. Together they are the shape of a loader that
# parses an image in memory and calls the APIs it needs without import
# entries, with the signed-looking certificate covering the whole thing.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1106,T1027
composite_rules:
  - id: garbled-go-pe-header-walk-with-syscall-dispatch
    desc: Garbled Go PE header walk with syscall dispatch
    crit: hostile
    conf: 0.85
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-garbled-main-symbols
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: micro-behaviors/data/embedded/payload/header::pe-mz-compare-x64
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-function-pointer-dispatch
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
