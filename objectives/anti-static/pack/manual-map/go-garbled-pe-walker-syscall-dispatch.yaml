# Garbled names, a hand-rolled MZ/e_lfanew check, and the runtime symbol
# syscall.Syscall are not a loader: Windows Go programs always name that
# symbol, and a GUI can reject a file that is not a PE. The hostile shape
# is that walk plus a request for committed RWX memory to run the image.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1106,T1027
composite_rules:
  - id: garbled-go-pe-header-walk-with-syscall-dispatch
    desc: Garbled Go PE header walk with syscall dispatch
    crit: hostile
    conf: 0.85
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-garbled-main-symbols
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-function-pointer-dispatch
      - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-any
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
