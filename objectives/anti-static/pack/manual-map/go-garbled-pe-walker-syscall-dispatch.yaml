defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
  attack: T1027,T1620
  crit: hostile
composite_rules:
- id: go-arithmetic-pe-unpacker
  desc: Obfuscated Go decodes and manually maps a PE payload
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
  - id: micro-behaviors/data/arithmetic::x64-index-scaled-byte-subtraction-loop
  - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
  - id: micro-behaviors/data/arithmetic::go-field-base-sum-call-setup
  - id: micro-behaviors/os/syscall/invoke::go-syscall-function-pointer-dispatch
  - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-any
- id: go-obfuscated-manual-pe-loader
  desc: Obfuscated Go manually maps a PE image
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
  - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
  - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
  - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-no-slice
  - id: micro-behaviors/os/syscall/invoke::go-syscall-function-pointer-dispatch
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app
- id: go-obfuscated-mz-transform-rwx-loader
  desc: Obfuscated Go transforms and dispatches a PE payload in executable memory
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
  - id: micro-behaviors/data/arithmetic::x64-index-scaled-byte-subtraction-loop
  - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
  - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-any
  - id: micro-behaviors/os/syscall/invoke::go-syscall-function-pointer-dispatch
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app
