defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94
  attack: T1027.013,T1204.002

composite_rules:
- id: cab-manual-map-dropper
  crit: hostile
  desc: Cabinet wraps a manual PE mapper stub
  scope: archive
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-sole-member
    - id: micro-behaviors/mem/combined::x86-pe-validation-allocation-export-api-set
    - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    # A stub-wrapping cabinet lists one payload. scope:archive pools the
    # sole-member leg from unrelated single-file archives inside a
    # multi-member MSI, so a cab that lists six or more members is not a stub.
    - id: metadata/archive/layout::cab-several-member-entry

