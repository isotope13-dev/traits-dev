defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94
  attack: T1027.013,T1204.002

composite_rules:
- id: cab-manual-map-dropper
  crit: hostile
  desc: Cabinet wraps a manual PE mapper stub
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
