# A program whose resource section is mostly cipher-grade entropy, that
# checks MZ and PE header constants in its own code, manages memory for a
# mapped image, resolves exports from the opaque resource module and hashes
# names with FNV-1a, reads its payload from the resource and maps it by hand
# instead of letting the Windows loader do it.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1027.007,T1055.001
composite_rules:
  - id: opaque-resource-manual-pe-mapper-with-fnv-hashing
    desc: Opaque resource mapped by hand with FNV-1a hashing
    crit: hostile
    conf: 0.87
    all:
      - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
      - id: micro-behaviors/data/embedded/payload/resource::resource-extraction-module-lookup-references
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/mem/combined::pe-memory-management-api-set
      - id: micro-behaviors/data/checksum::fnv1a-x86-prime-imul
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/game/online::bolacga-launcher-game-context
