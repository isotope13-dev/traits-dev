# Code that checks MZ and PE header constants itself, allocates an image
# buffer and changes its protection, and terminates when a debugger is
# present, while resolving LoadLibraryA by name instead of importing it, is
# a loader that maps a hidden image by hand and refuses to run under
# analysis. Ordinary programs let the Windows loader do the mapping.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1622,T1027.002
composite_rules:
  - id: antidebug-manual-pe-mapper-with-opaque-image
    desc: Anti-debug loader mapping an opaque PE by hand
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/mem/protect/modify::allocation-protection-opaque-image
      - id: micro-behaviors/process/debug/detect::debugger-check-terminate-loadlibrary-imports
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
