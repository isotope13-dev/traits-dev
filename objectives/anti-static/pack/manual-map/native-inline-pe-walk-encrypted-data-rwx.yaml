# A native program that walks a PE header in its own code (e_lfanew), keeps a
# large high-entropy writable data section and makes memory read-write-execute
# is likely to map an image it decrypted from its own data.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1027.002
composite_rules:
  - id: native-inline-pe-walk-with-encrypted-data-and-rwx
    desc: Inline PE walk with encrypted data and RWX
    crit: suspicious
    conf: 0.7
    all:
      - id: micro-behaviors/data/embedded/payload/header::x86-inline-e-lfanew-pe-walk
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
    unless:
      - id: metadata/signed/platform/
