# A pure-Python reflective PE loader allocates memory through ctypes, copies
# the headers and sections with memmove, walks the base-relocation table
# (entry type 10 is IMAGE_REL_BASED_DIR64), resolves imports with
# LoadLibraryA and GetProcAddress, and starts the image on a new thread at
# its entry point. Doing that in Python hides the loader from PE-level
# scanners; the mapped image is whatever the caller feeds it.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1620,T1055.001
traits:
  - id: python-pe-reloc-dir64-fixup
    desc: Python applies DIR64 base relocations
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '>>\s*12\s*==\s*10\b'
  - id: python-createthread-at-mapped-entry
    desc: Python thread started at mapped entry
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'CreateThread\(\s*None,\s*0,\s*ctypes\.c_void_p\(\w+\s*\+'
composite_rules:
  - id: python-ctypes-reflective-pe-loader
    desc: Python ctypes reflective PE loader
    crit: hostile
    conf: 0.9
    all:
      - id: python-pe-reloc-dir64-fixup
      - id: python-createthread-at-mapped-entry
      - id: micro-behaviors/mem/copy::python-ctypes-memmove
      - id: micro-behaviors/dylib/load/ffi::ctypes-ffi-import
