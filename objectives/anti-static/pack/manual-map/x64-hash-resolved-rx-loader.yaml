# An x64 program that walks PE headers inline (e_lfanew), validates MZ
# magic, resolves its imports by hash, allocates executable memory and
# starts threads is mapping an image it hides from static analysis. The
# x86 sibling rule covers 32-bit stack-arg loaders; this is the 64-bit
# spelling with hash-concealed resolution. Signed loaders and installer
# stubs are excluded below.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1027.002
composite_rules:
  - id: x64-inline-pe-walk-hash-resolved-rx-loader
    desc: Inline PE walk with hash-resolved RX loader
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/mem/protect/modify::page-protection-api-x64
      - id: micro-behaviors/process/create/thread::thread-start-api-x64
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop-x64
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
