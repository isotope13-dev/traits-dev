defaults:
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: mpress-overlay-htons-reference
    desc: MPRESS overlay and byte-order API reference
    all:
      - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/data/buffer/integer-codec::htons-api-ordinal
    unless:
      - id: metadata/installer/product/
  - id: mpress-opaque-overlay-socket-send-reference
    desc: MPRESS opaque overlay and socket send reference
    attack: T1027.002,T1027.009
    all:
      - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: micro-behaviors/communications/socket/send/reference::send-api
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/installer/product/
