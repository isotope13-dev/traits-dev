defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: mpress-wininet-packed-import-clues
    desc: MPRESS WinInet and COM import clues
    crit: suspicious
    conf: 0.94
    size_max: 262144
    all:
      - id: metadata/binary/section/label/packing::mpress-section-one
      - id: metadata/binary/section/label/packing::mpress-section-two
      - id: micro-behaviors/communications/http/client/wininet::wininet-com-sparse-import-profile
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/dylib/lookup::get-module-handle-ansi
      - id: micro-behaviors/os/com/runtime::co-initialize
      - id: micro-behaviors/fs/path/location::shell-get-folder-path
      - id: metadata/binary/section/permission::wx-section
    needs: 2
