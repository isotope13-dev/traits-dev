defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1027.002,T1105"

composite_rules:
  - id: remcos-mpress-encrypted-settings-stage
    desc: MPRESS-packed loader conceals a Remcos SETTINGS download stage
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/anti-static/pack/mpress::mpress-versioned-stub
      - id: metadata/binary/resource::wide-settings-resource-name
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: micro-behaviors/communications/http/get::url-download-to-file
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
