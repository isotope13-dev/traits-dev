defaults:
  attack: T1027
  mbc: B0032
  platforms:
    - windows
  for:
    - pe
traits:
  - id: mpress-packer-symbol
    desc: MPRESS packer symbol
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      regex: (^|[^a-zA-Z])[Mm][Pp]ress::_

composite_rules:
  - id: mpress-sparse-dynamic-loader
    desc: MPRESS sparse dynamic API loader
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
      - id: micro-behaviors/dylib/lookup::sparse-pe-export-resolution-context
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    unless:
      - id: metadata/signed/platform/
  # MPRESS rewrites the image, so a signature that survives on a packed file
  # no longer matches it.  A vendor that packs after signing ships a broken
  # signature by accident, but it does not also resolve its APIs at runtime
  # from a near-empty import table; a copied signature on such a loader keeps
  # the file looking signed while the packed body hides what it imports.
  - id: mpress-loader-tampered-signature
    desc: MPRESS sparse API loader under a non-matching signature
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1553.002
    all:
      - id: mpress-sparse-dynamic-loader
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: mpress-obfuscated-overlay-loader
    desc: MPRESS loader with writable entry and large overlay
    # Packing, a writable entry section, and an appended high-entropy region
    # This identifies a packer layout, but does not establish the payload's
    # purpose without a concrete capability.
    crit: notable
    conf: 0.98
    attack: "T1027,T1027.009"
    all:
      - id: mpress-sparse-dynamic-loader
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/ratio::overlay-over-35pct
    unless:
      - id: metadata/signed/platform/
  # Import concealment plus a staged payload. MPRESS legitimately resolves its
  # own handful of APIs at runtime, but a stub that keeps the import table
  # near-empty AND ships a text-encoded blob is using the packer as a crypter:
  # neither the payload nor the API surface is visible to static inspection.
  # Distinct from packed-pe-encoded-payload-crypter, which keys on overlay
  # dominance rather than on the concealed import surface.
  - id: mpress-concealed-import-encoded-payload
    desc: MPRESS crypter hiding imports and payload
    crit: hostile
    conf: 0.96
    attack: T1027.013
    mbc: F0001
    all:
      - id: mpress-sparse-dynamic-loader
      - id: metadata/file/profile/string-population::long-digit-nonhex-lowercase-run
      - id: metadata/binary/section/permission::pe-multiple-executable-writable-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: mpress-network-aware-shell-dropper
    desc: MPRESS-packed network-aware shell dropper
    crit: hostile
    conf: 0.97
    attack: "T1027.002,T1059,T1016"
    all:
      - id: metadata/build/protector::mpress-stub-layout-evidence
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/network/interface::get-adapters-addresses
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer
  - id: mpress-packed-team-vr-license-crack
    desc: MPRESS-packed Team V.R license crack
    crit: hostile
    conf: 0.98
    attack: "T1027.002,T1036.005"
    all:
      - id: metadata/build/protector::mpress-stub-layout-evidence
      - id: well-known/unwanted/software-crack::team-vr-self-issued-authenticode
      - id: objectives/evasion/masquerade/version-resource/licensing::steinberg-elicenser-version-identity
    any:
      - id: mpress-sparse-dynamic-loader
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
    unless:
      - id: metadata/signed/platform/
