composite_rules:
  # An ASPack stub whose real entry point decompresses in a writable section,
  # sitting in front of a second, complete PE that is at least half the file.
  # File-infector viruses use this shape: the stub carries the infection and
  # the intact original program is the overlay it hands control back to.
  - id: aspack-stub-with-complete-pe-overlay
    desc: ASPack stub in front of a complete PE overlay
    crit: hostile
    conf: 0.9
    attack: T1027.002,T1027.009
    platforms: [windows]
    for: [pe]
    all:
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
