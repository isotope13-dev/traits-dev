# A packer stub that resolves its imports by hand and injects what it unpacks.
#
# The shape, stated in three independent facts about the same binary: half or
# more of the file is appended data rather than mapped image; what little is
# mapped is a small code section inside a large file; and that code walks the
# PEB loader list to find modules rather than letting the loader resolve them.
#
# Each has an innocent explanation and none of the explanations agree with each
# other. An installer has a big overlay, but it does not enumerate modules
# through the PEB -- it has an import table like any other program. A packed
# commercial binary resolves imports by hand, but its mapped image is the
# program, not a stub in front of one. Together they describe something whose
# only job is to unpack what is appended to it and hand control over.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002,T1055
  mbc: B0032

composite_rules:
  - id: overlay-packed-injection-stub
    desc: Overlay-packed stub with manual imports
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: objectives/anti-static/obfuscation/imports::peb-ldr-access
      - id: objectives/evasion/anti-av/code-padding::small-code-section-in-large-pe
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/lib/

  # Same stub shape, but the overlay is a copied or truncated certificate
  # rather than (or in addition to) a packed payload. The PEB walk plus a
  # half-file overlay already say "unpacker"; the detached signature says the
  # extra bytes are wearing someone else's Authenticode, which is how these
  # droppers survive a glance at the certificate table.
  - id: overlay-stub-detached-signature
    desc: Overlay stub with a detached certificate overlay
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: objectives/anti-static/obfuscation/imports::peb-ldr-access
      - id: metadata/binary/layout/checksum::cert-table-truncated
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/lib/
