defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: inno-unknown-marker-entropy-clues
    desc: Inno unknown marker and unsigned overlay clues
    crit: notable
    conf: 0.99
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
