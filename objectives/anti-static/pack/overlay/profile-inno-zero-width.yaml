# Inno Setup may include PBKDF2 and ChaCha even when encryption is disabled.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: inno-zero-width-entropy-clues
    desc: Inno zero-width and high-entropy overlay clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/lang/encoding/shape/character::managed-pe-format-marker-population-206d
      - id: metadata/lang/encoding/shape/character::managed-pe-format-marker-population-206f
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-keyword
