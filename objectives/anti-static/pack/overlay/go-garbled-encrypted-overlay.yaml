defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # A Go loader built through garble (random package and main-symbol names) that
  # keeps almost nothing in its sections and carries the rest of the file as
  # random-looking appended data: the payload is stored encrypted behind the
  # image and resolved at runtime through dynamic syscall dispatch.
  - id: go-garbled-loader-encrypted-overlay
    desc: Garbled Go PE with dominant encrypted overlay
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1027.009
    mbc: B0032
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/
      - id: well-known/tool/
