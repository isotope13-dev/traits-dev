defaults:
  platforms:
  - windows
  for:
  - source
  - vbs
composite_rules:
- id: vb6-appended-decrypt-call-profile
  for:
  - vbs
  desc: VB6 self-path, appended data and decrypt call
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/self::vb6-self-exe-name
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-appended-delimiter
  - id: micro-behaviors/data/string/split::vb6-splitter-second-part
  - id: micro-behaviors/crypto/symmetric/decrypt::vb6-decryptstring-call
  - id: micro-behaviors/data/control-flow/dispatch::vb6-loader-command-argument-call
  any:
  - id: micro-behaviors/data/string/conversion::vb6-unicode-string-to-bytes
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-read-eof-data-call
  - id: micro-behaviors/data/string/assembly::vb6-get-nullbytes-30-call
  - id: micro-behaviors/data/string/reverse::vb6-reverse-file-buffer-call
- id: vb6-appended-crypter-builder-profile
  for:
  - vbs
  desc: VB6 appended crypter with builder clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/pack/overlay::vb6-appended-decrypt-call-profile
  any:
  - id: micro-behaviors/fs/path/self::vb6-self-injectionpath-assignment
  - id: micro-behaviors/fs/file/section::vb6-pe-header-reference-profile
  - id: micro-behaviors/data/string/malware::vb6-crypter-constant-text
- id: vb6-eof-crypter-builder-profile
  desc: VB6 EOF crypter builder clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/fs/file/open::vb6-stub-binary-open
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-appended-delimiter
  - id: micro-behaviors/data/string/malware::vb6-crypter-constant-text
  any:
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-read-eof-data-call
  - id: micro-behaviors/data/string/assembly::vb6-get-nullbytes-30-call
  - id: micro-behaviors/data/string/reverse::vb6-reverse-file-buffer-call
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-write-eof-data-call
  - id: micro-behaviors/data/string/concat::vb6-file-eof-data-concat
- id: vb6-preserves-eof-overlay
  desc: VB6 EOF read/write helper pair
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-read-eof-overlay
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-write-eof-overlay
