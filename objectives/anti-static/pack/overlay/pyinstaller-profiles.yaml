defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pyinstaller-opaque-overlay-debug-import-profile
    desc: Opaque PyInstaller overlay with debugger import
    crit: suspicious
    conf: 0.99
    attack: T1027.002
    # Bootloader strings live in the PE; debugger imports can also appear
    # in extracted runtime members, so pool the one-file tree.
    scope: outer
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-bootstrap
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-opaque-script-entry
      - id: objectives/evasion/masquerade/versioninfo::opaque-alnum-internal-name

  - id: pyinstaller-reloc-overlay-spawn-profile
    desc: PyInstaller reloc overlay near CreateProcessW
    crit: suspicious
    conf: 0.98
    attack: T1027.002,T1027.009
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::meipass-runtime-dir
      - id: objectives/anti-static/pack/loader-noise::reloc-encrypted-dominant-overlay
      - id: micro-behaviors/process/create/spawn::create-process-w

  - id: pyinstaller-overlay-process-profile
    desc: Opaque PyInstaller overlay with process API
    crit: suspicious
    conf: 0.99
    attack: T1027.002
    scope: outer
    all:
      - id: pyinstaller-opaque-overlay-debug-import-profile
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
