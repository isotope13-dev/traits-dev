      - id: metadata/binary/layout/ratio::overlay-dominates-third
    any:
      - id: micro-behaviors/ui/window/station::window-station-query-chain
      - id: micro-behaviors/ui/window/probe::ansi-gui-probe
      - id: objectives/anti-static/obfuscation/string/recovery::xor-getuserobject-text-burst
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-and-clock-api-profile
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-string
