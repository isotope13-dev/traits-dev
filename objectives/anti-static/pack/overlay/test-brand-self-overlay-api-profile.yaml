    desc: Test-branded PE with self-overlay and API clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/resource/label::test-branding-cluster
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
