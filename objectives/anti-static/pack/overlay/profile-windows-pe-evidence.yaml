defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
composite_rules:
  - id: unsigned-rwx-overlay-deletion-clues
    desc: Unsigned RWX overlay and file-deletion clues
    crit: suspicious
    conf: 0.98
    for:
      - pe
    all:
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/section/permission::near-zero-entropy-rwx-section
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: micro-behaviors/fs/delete/file/library::delete-win
  - id: unsigned-reloc-overlay-memory-crypto-clues
    desc: Relocation overlay, memory and crypto clues
    crit: suspicious
    conf: 0.98
    for:
      - pe
    all:
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
    unless:
      - id: metadata/installer/product/
  - id: x86-export-resolver-overlay-clues
    desc: x86 export resolver and overlay clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-backward-mz-search-export-resolver
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/layout/size::small-pe
