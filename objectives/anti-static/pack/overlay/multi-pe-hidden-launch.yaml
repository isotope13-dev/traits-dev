defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Co-occurring opaque executable content and hidden-launch capabilities.
  # This does not prove which payload is launched or assign a malware family.
  - id: opaque-multi-pe-overlay-hidden-launch
    desc: Opaque multi-PE overlay with hidden-launch APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: micro-behaviors/process/config::x86-create-no-window-immediate
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
