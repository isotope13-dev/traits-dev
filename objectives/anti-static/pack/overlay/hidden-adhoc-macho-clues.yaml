---
defaults:
  platforms:
  - macos
composite_rules:
- id: hidden-adhoc-macho-overlay
  desc: Hidden ad-hoc binary with large overlay
  crit: suspicious
  conf: 0.95
  for:
  - dmg
  - macho
  scope: archive
  all:
  - id: metadata/archive/member/filename/shape::hidden-dot-executable-member
  - id: metadata/signature/ad-hoc::adhoc
  - id: metadata/binary/layout/ratio::overlay-at-least-half
