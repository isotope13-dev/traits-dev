defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: inno-unrecognized-overlay-process-api-profile
  desc: Inno overlay with process and thread APIs
  crit: suspicious
  conf: 0.99
  attack: T1027.009
  all:
  - id: metadata/binary/installer/script::inno-unrecognized-loader-magic
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/info/thread::suspend-thread-import
  - id: micro-behaviors/process/info/thread::resume-thread-import

- id: inno-delphi-opaque-overlay-profile
  desc: Inno/Delphi with opaque overlay
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  - id: metadata/binary/layout/overlay::large-overlay-1mb
  - id: metadata/binary/layout/overlay::overlay-entropy-over-7
  any:
  - id: objectives/evasion/indicator-removal/timestamps::inno-55-pre2000-timestamp
  - id: metadata/binary/installer/script::inno-password-canary
  - id: metadata/binary/installer/script::inno-bcrypt-random
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  unless:
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/leaf::johannes-schindelin
  - id: metadata/signed/platform/
  - id: metadata/signed/certificate/signature::pe-signature-verified-kv

- id: inno-opaque-overlay-privilege-profile
  desc: Opaque Inno overlay with privilege APIs
  crit: suspicious
  conf: 0.98
  all:
  - id: inno-delphi-opaque-overlay-profile
  - id: metadata/signed/trust-level::unsigned
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: micro-behaviors/os/privilege/token::token-privilege-adjustment-references
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  any:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: micro-behaviors/fs/directory/mkdir::create-directory-a
  needs: 2
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/platform/

- id: inno-dominant-overlay-com-crypto-profile
  desc: Inno overlay with COM and crypto clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/layout/overlay::inno-delphi-dominant-overlay-profile
  - id: micro-behaviors/os/com/array::safearray-put-element
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
  any:
  - id: metadata/binary/installer/script::inno-password-canary
  - id: metadata/binary/installer/script::inno-bcrypt-random
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: metadata/signed/trust-level::unsigned-pe-executable
  needs: 2

- id: selfissued-inno-overlay-process-profile
  desc: Self-issued Inno overlay with process API
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  mbc: B0032
  all:
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: metadata/binary/installer/family::inno-setup-crypto-support-markers
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  - id: metadata/binary/layout/overlay::large-overlay-1mb
  - id: micro-behaviors/os/com/array::safearray-data-manipulation-cluster
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
  any:
  - id: metadata/binary/installer/script::inno-setup-installer-data
  - id: metadata/binary/installer/runtime::winhttp-system32-manifest
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/leaf::johannes-schindelin

- id: inno-overlay-privilege-thread-profile
  desc: Inno overlay with privilege and thread APIs
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/layout/overlay::inno-delphi-dominant-overlay-profile
  - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-ui-language
  - id: micro-behaviors/process/inject/runtime/call::suspend-thread
  any:
  - id: micro-behaviors/os/privilege/token::token-privilege-adjustment-references
  - id: micro-behaviors/os/com/array::safearray-put-element
  - id: metadata/binary/installer/script::inno-password-canary
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  needs: 2
  unless:
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/leaf::johannes-schindelin
  - id: metadata/signed/platform/

- id: inno-opaque-overlay-privilege-thread-profile
  desc: Opaque Inno overlay with privilege APIs
  crit: suspicious
  conf: 0.99
  all:
  - id: inno-delphi-opaque-overlay-profile
  - id: metadata/signed/trust-level::unsigned
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/inject/runtime/call::suspend-thread
  - id: micro-behaviors/os/privilege/token::shutdown-privilege-name
  - id: micro-behaviors/os/privilege/token::token-open-and-duplicate-apis
  any:
  - id: micro-behaviors/os/privilege/token::token-privilege-adjustment-references
  - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-ui-language
  - id: micro-behaviors/os/com/array::safearray-put-element
  - id: metadata/binary/installer/runtime::winhttp-system32-manifest
  needs: 2
  unless:
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/leaf::johannes-schindelin
  - id: metadata/signed/platform/
