defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: inno-unrecognized-overlay-process-api-profile
    desc: Inno overlay with process and thread APIs
    crit: suspicious
    conf: 0.99
    attack: T1027.009
    all:
      - id: metadata/binary/resource/label::unrecognized-rdlpts-resource-marker
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/info/thread::suspend-thread-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: inno-delphi-opaque-overlay-profile
    desc: Inno/Delphi with opaque overlay
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/entropy::overlay-entropy-over-7
    any:
      - id: objectives/evasion/indicator-removal/timestamps::inno-55-pre2000-timestamp
      - id: well-known/tool/packaging/inno-setup-runtime::inno-password-canary
      - id: micro-behaviors/os/random/crypto::bcrypt-genrandom-name-without-symbol
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: metadata/signature/verified/
  - id: inno-opaque-overlay-privilege-profile
    desc: Opaque Inno overlay with privilege APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: inno-delphi-opaque-overlay-profile
      - id: metadata/signature/absent::unsigned
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
      - id: micro-behaviors/os/privilege/token/adjust::token-privilege-adjustment-references
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/fs/directory/create::create-directory-a
    needs: 2
    unless:
      - id: metadata/installer/product/
  - id: inno-dominant-overlay-com-crypto-profile
    desc: Inno overlay with COM and crypto clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/layout/overlay::inno-delphi-dominant-overlay-profile
      - id: micro-behaviors/os/com/array::safearray-put-element
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
    any:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-password-canary
      - id: micro-behaviors/os/random/crypto::bcrypt-genrandom-name-without-symbol
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/signature/absent::unsigned-pe-executable
    needs: 2
  - id: selfissued-inno-overlay-process-profile
    desc: Self-issued Inno overlay with process API
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    mbc: B0032
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: well-known/tool/packaging/inno-setup-runtime::inno-setup-crypto-support-markers
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: micro-behaviors/os/com/array::safearray-data-manipulation-cluster
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
    any:
      - id: well-known/tool/packaging/inno-setup-loader::inno-setup-installer-data
      - id: metadata/binary/resource/manifest::winhttp-system32-manifest
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/os/sysinfo/disk::get-disk-free-space
    needs: 2
    unless:
      - id: metadata/signature/verified/signer::johannes-schindelin
  - id: inno-overlay-privilege-thread-profile
    desc: Inno overlay with privilege and thread APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/layout/overlay::inno-delphi-dominant-overlay-profile
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-ui-language
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
    any:
      - id: micro-behaviors/os/privilege/token/adjust::token-privilege-adjustment-references
      - id: micro-behaviors/os/com/array::safearray-put-element
      - id: well-known/tool/packaging/inno-setup-runtime::inno-password-canary
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    needs: 2
    unless:
      - id: metadata/signature/verified/signer::johannes-schindelin
  - id: inno-opaque-overlay-privilege-thread-profile
    desc: Opaque Inno overlay with privilege APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: inno-delphi-opaque-overlay-profile
      - id: metadata/signature/absent::unsigned
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: micro-behaviors/os/privilege/reference::shutdown-privilege-name
      - id: micro-behaviors/os/privilege/token/use::token-open-and-duplicate-apis
    any:
      - id: micro-behaviors/os/privilege/token/adjust::token-privilege-adjustment-references
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-ui-language
      - id: micro-behaviors/os/com/array::safearray-put-element
      - id: metadata/binary/resource/manifest::winhttp-system32-manifest
    needs: 2
    unless:
      - id: metadata/signature/verified/signer::johannes-schindelin
  - id: inno-opaque-unopenable-python-staging
    desc: Opaque Inno overlay has Python ZIP fragments
    crit: hostile
    conf: 0.95
    attack: T1027.009
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
      - id: metadata/binary/layout/overlay::zip-local-header-without-eocd
      - id: metadata/package/files/name::zipimport-bytecode-member
      - id: metadata/signature/absent::unsigned
    unless:
      - id: metadata/signature/verified/
  - id: inno-opaque-embedded-pe-dropper
    desc: Inno installer hides embedded PE in opaque overlay
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1027.009
    size_min: 10000000
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: metadata/signature/absent::unsigned-missing-signature-record
