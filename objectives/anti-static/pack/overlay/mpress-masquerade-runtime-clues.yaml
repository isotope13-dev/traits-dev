defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: mpress-adobe-claim-external-ip-clues
    desc: MPRESS, Adobe version claims and external IP
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe
    any:
      - id: well-known/app/system/adobe-bootstrapper::adobe-bootstrapper-versioninfo
    unless:
      - id: metadata/signature/verified/platform/

  # Unsigned MPRESS stubs wear a 360.cn module identity while appending megabytes
  # of certificate-chain padding past the mapped image (zeroed cert checksum,
  # overlay >90%). Real Qihoo components ship Authenticode; this shape is a
  # Farfli-style cert-stuffed carrier, not LSPFix.
  - id: mpress-overlay-runtime-api-clues
    desc: MPRESS overlay and runtime API clues
    crit: suspicious
    conf: 0.94
    size_min: 1048576
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
