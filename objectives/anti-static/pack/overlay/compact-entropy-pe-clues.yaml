defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: compact-entropy-overlay-pe-clues
    for: [pe]
    desc: Compact high-entropy overlay with PE clues
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/layout/entropy::compact-high-entropy-overlay
    any:
      - id: metadata/binary/section/permission::wx-section
      - id: micro-behaviors/os/api-resolution/manual::x86-peb-loader-data-load
      - id: metadata/binary/provenance/build::unusual-pe-header-timestamp
