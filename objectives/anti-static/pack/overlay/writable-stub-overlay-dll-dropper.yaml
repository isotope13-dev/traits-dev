# A small stub whose code section is writable and executable and whose entry
# point is inside it (the code is rewritten before it runs), whose overlay
# is at least half the file and carries a complete PE, and which imports
# little beyond LoadLibraryA and GetProcAddress, is a self-decrypting
# dropper for the overlay DLL.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1055
composite_rules:
  - id: writable-entry-stub-with-overlay-dll
    desc: Self-modifying stub carrying a PE in its overlay
    crit: hostile
    conf: 0.8
    all:
      - id: metadata/binary/section/header::writable-entry-with-wx-section
      - id: metadata/binary/section/permission::writable-text-section
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: metadata/binary/layout/embedded::embedded-dos-header-tail
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
