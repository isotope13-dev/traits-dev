---
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
composite_rules:
- id: elf-overlay-syscall-few-imports
  desc: ELF overlay, syscall wrapper and few imports
  crit: suspicious
  conf: 0.93
  all:
  - id: metadata/binary/layout/overlay::elf-has-overlay
  - id: micro-behaviors/os/syscall/invoke::syscall-wrapper-import
  - id: metadata/binary/layout/entropy::elf-overlay-entropy-over-75
  - id: metadata/binary/symbols/count::elf-12-or-fewer-imports
- id: elf-overlay-syscall-execve-clues
  desc: ELF overlay and execve syscall clues
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/pack/overlay::elf-overlay-syscall-few-imports
  any:
  - id: micro-behaviors/os/syscall/invoke::execve-syscall-wrapper-thumb
  - id: micro-behaviors/os/syscall/raw::x64-mov-execve-syscall
  - id: micro-behaviors/process/replace::mips-o32-execve-syscall
