defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, pyc]
composite_rules:
  - id: pyinstaller-clipboard-aes-overlay-clues
    desc: PyInstaller clipboard, AES and overlay clues
    conf: 0.98
    for: [pe]
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::runtime-tmpdir-option
      - id: micro-behaviors/fs/temp/pyinstaller::meipass-runtime-dir
      - id: micro-behaviors/fs/temp/pyinstaller::archive-encode-entrypoint
      - id: micro-behaviors/os/clipboard/reference::clipboard-module
      - id: metadata/binary/symbols/name/crypto::pycrypto-aes-module-name-text
      - id: metadata/binary/layout/ratio::overlay-over-90pct

