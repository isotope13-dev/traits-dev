defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1036.005

composite_rules:
  - id: firewall-decoy-dominant-multi-pe-overlay
    desc: Firewall decoy wraps a dominant multi-PE overlay
    crit: hostile
    conf: 0.999
    all:
      - id: metadata/vendor/string::microsoft-firewall-identity-text
      - id: metadata/vendor/string::xiang-company-identity-text
      - id: metadata/binary/layout/ratio::many-pe-embedded
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
