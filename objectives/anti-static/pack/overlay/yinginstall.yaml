defaults:
  conf: 0.98
  platforms: [windows]
  for: [pe]
  attack: T1027.009

composite_rules:
  - id: yinginstall-opaque-overlay-profile
    desc: YingInstall wrapper with opaque LZMA overlay
    crit: suspicious
    size_min: 4000000
    all:
      - id: well-known/tool/packaging/yinginstall::yinginstall-wrapper
      - id: micro-behaviors/data/embedded/payload/compression::overlay-lzma-header
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/signature/absent::unsigned
    any:
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/os/handler/open::shell-execute-a
    needs: 3
    # The general installer catalog includes the YingInstall wrapper itself.
    # Use the narrower recognized-installer context to avoid suppressing it.
    unless:
      - id: metadata/installer/product::known-installer-context

  - id: yinginstall-opaque-overlay-api-profile
    desc: YingInstall opaque overlay with system APIs
    crit: suspicious
    size_min: 1000000
    all:
      - id: yinginstall-opaque-overlay-profile
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
      - id: micro-behaviors/hardware/input/keyboard/poll::key-state-ui-timer-pe-api-set
      - id: micro-behaviors/hardware/display/screenshot/window::gdi-bitmap-and-window-api-set
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
    needs: 2
    unless:
      - id: metadata/installer/product::known-installer-context
