defaults:
  conf: 0.98
  platforms: [windows]
  for: [pe]
  attack: T1027.009

composite_rules:
  - id: yinginstall-opaque-overlay-profile
    desc: YingInstall wrapper with opaque LZMA overlay
    crit: suspicious
    size_min: 4000000
    all:
      - id: metadata/binary/installer/family::yinginstall-wrapper
      - id: micro-behaviors/data/embedded/payload/compression::overlay-lzma-header
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
    needs: 3
    # Name the known-benign installer identity: the whole family/ directory
    # also holds the `yinginstall-wrapper` leg, which silenced this rule and,
    # through it, the staged-loader composite below.
    unless:
      - id: metadata/binary/installer/family::known-benign-installer
      - id: metadata/signed/platform/

  - id: yinginstall-opaque-overlay-api-profile
    desc: YingInstall opaque overlay with system APIs
    crit: suspicious
    size_min: 1000000
    all:
      - id: yinginstall-opaque-overlay-profile
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
      - id: objectives/anti-analysis/timing/evasion::ui-timer-keypoll-gate
      - id: objectives/collection/screenshot::gdi-window-capture
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
    needs: 2
    unless:
      - id: metadata/binary/installer/family::known-benign-installer
      - id: metadata/signed/platform/
