# macOS counterpart to the tiny-stub PE loaders in this directory: a Mach-O
# whose real payload is appended past the end of the image rather than carried
# in its sections.
#
# The shape these disk images ship is consistent -- a DMG holding a bare
# executable named `Setup`, `Installer` or `Update` (no `.app` bundle at all),
# unsigned, where more than half the file is overlay. A real macOS installer is
# an application bundle signed by a developer ID; a bare unsigned binary with a
# generic name and a majority-overlay body is a stub whose job is to unpack the
# thing it actually runs.
defaults:
  platforms: [macos]
  for: [macho, dmg]
  attack: T1027.002,T1036.005
  mbc: B0032

composite_rules:
  - id: unsigned-installer-overlay-payload
    desc: Unsigned installer-named Mach-O is mostly overlay
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/masquerade/naming/placeholder::generic-executable-name-1
      - id: metadata/signed/trust-level::unsigned-macho
      - id: objectives/anti-static/obfuscation/control-flow/logic::overlay-at-least-half
    unless:
      # A developer-ID or platform signature settles it the other way; an
      # installer that is signed is not hiding what it runs.
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
