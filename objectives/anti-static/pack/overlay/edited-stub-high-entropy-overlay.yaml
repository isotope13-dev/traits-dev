# A program with a rewritten DOS stub, a high-entropy writable data section,
# a high-entropy appended block and a version resource that names a different
# file than the one on disk has been rebuilt around hidden data. Compilers
# that wrap scripts produce this shape, and so do droppers.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1036.005
composite_rules:
  - id: edited-dos-stub-with-high-entropy-data-and-overlay
    desc: Edited DOS stub with high-entropy data and overlay
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/header/malformed::pe-dos-stub-modified
      - id: metadata/binary/section/entropy::writable-data-section-entropy-over-7
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
