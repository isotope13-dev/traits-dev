defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: nsis-system-overlay-callwindowproc-profile
    desc: NSIS System plugin, opaque overlay and CallWindowProc
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/tool/packaging/nsis::nsis-manifest-exehead
      - id: metadata/binary/symbols/name/export::system-dll-plugin-export-profile
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: micro-behaviors/ui/window/message::call-window-proc
    any:
      - id: metadata/binary/layout/entropy::high-entropy-overlay
