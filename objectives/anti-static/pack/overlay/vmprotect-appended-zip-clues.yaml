---
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: unsigned-vmprotect-appended-zip-clues
  desc: Unsigned VMProtect and appended ZIP clues
  conf: 0.98
  all:
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: metadata/binary/layout/size::noncertificate-unclaimed-bytes-512
  - id: metadata/binary/layout/overlay::appended-zip-trailer
  any:
  - id: metadata/build/protector::vmprotect-section-reference
  - id: objectives/anti-static/pack/section-anomaly::large-rwx-vmp-encrypted-section
  - id: metadata/binary/section/label/packing::vmp-section-name
  unless:
  - id: metadata/installer/product/
