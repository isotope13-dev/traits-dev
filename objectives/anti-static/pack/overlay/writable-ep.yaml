# Writable entry plus overlay/checksum is the cheap packer/cryptor shape
# used by old Win32 backdoors: the mapped .text is writable, a stub jumps
# there, and the real body sits in overlay or a checksum-invalid image.
# Pairs of two structural facts (checksum, missing resources) are packer shape,
# not behavior, so they stay suspicious; hostile pairs need a behavior leg.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002
  mbc: B0032

composite_rules:

  - id: writable-ep-overlay-packer
    desc: Writable entry point with a file overlay
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/overlay::has-overlay
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/vendor/
      - id: well-known/lib/
      - id: metadata/binary/symbols/count::pe-coff-symbol-table-overlay-context

  - id: writable-ep-bound-imports
    desc: Writable entry point with bound imports
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/build/artifact::pe-bound-imports-present
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/vendor/
      - id: well-known/lib/
      - id: objectives/command-and-control/dropper/staging/stub::vb6-concealed-overlay-urlmon
      - id: objectives/lateral-movement/usb-worm/autorun::vb6-findfile-shell-worm

  - id: writable-ep-high-entropy-overlay
    desc: Writable entry point with a high-entropy file overlay
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/overlay::high-entropy-overlay
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/vendor/
      - id: well-known/lib/

  - id: writable-ep-vb6-shell
    desc: Writable-entry VB6 stub shells a payload
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1059
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: objectives/command-and-control/dropper/staging/stub::vb6-concealed-overlay-urlmon
      - id: objectives/lateral-movement/usb-worm/autorun::vb6-findfile-shell-worm
