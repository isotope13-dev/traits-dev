# Recovered-UPX layout combined with an active crypter dispatcher and a bait
# sandbox-path overlay. The reconstructed UPX layout with writable entry point
# and dense arithmetic immediate reencoding hosts an emulator-gated handler-table
# loader that decodes and executes an in-memory stage while padding the overlay
# with sandbox paths to evade dynamic analysis.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1497.001
  mbc: B0032,B0009

composite_rules:
  # A compressed UPX-like section plus an overlay path corpus is suspicious on
  # its own. The additional WinInet, adapter-query, and sparse resolver
  # evidence identifies a network-capable loader stub without claiming that
  # the overlay paths are read at runtime.
  - id: upx-network-stub-with-sandbox-bait-overlay
    desc: UPX-like network stub carries sandbox bait paths
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1497.001,T1071.001,T1016
    all:
      - id: metadata/binary/section/entropy::upx1-high-entropy-section
      - id: objectives/anti-static/obfuscation/string/junking::compact-sandbox-path-overlay
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/network/interface/query::get-adapters-info
      - id: micro-behaviors/dylib/lookup::sparse-pe-export-resolution-context

  - id: recovered-upx-com-gated-bait-overlay-crypter
    desc: Recovered-UPX COM-gated crypter stub with bait path overlay
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/section/layout::recovered-upx-image-layout
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: objectives/anti-static/obfuscation/string/junking::compact-sandbox-path-overlay
      - id: metadata/binary/code/density::repeated-immediate-arithmetic
    any:
      - id: objectives/anti-analysis/emulator-detect::com-vbscript-factory-emulation-gate
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::com-gated-handler-table-loader
    unless:
      - id: metadata/installer/product/
