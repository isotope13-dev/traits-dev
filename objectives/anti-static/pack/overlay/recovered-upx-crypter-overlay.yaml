# Recovered-UPX layout combined with an active crypter dispatcher and a bait
# sandbox-path overlay. The reconstructed UPX layout with writable entry point
# and dense arithmetic immediate reencoding hosts an emulator-gated handler-table
# loader that decodes and executes an in-memory stage while padding the overlay
# with sandbox paths to evade dynamic analysis.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1497.001
  mbc: B0032,B0009

composite_rules:
  - id: recovered-upx-com-gated-bait-overlay-crypter
    desc: Recovered-UPX COM-gated crypter stub with bait path overlay
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/section/layout::recovered-upx-image-layout
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: objectives/anti-static/obfuscation/string/junking::compact-sandbox-path-overlay
      - id: objectives/anti-static/obfuscation/code-metrics/structure::repeated-immediate-reencoding
    any:
      - id: objectives/anti-analysis/emulator-detect::com-vbscript-factory-emulation-gate
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::com-gated-handler-table-loader
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
