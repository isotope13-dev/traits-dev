# The matcher establishes an ISAPI-capable module plus opaque or encrypted
# content. It does not establish MSI delivery, IIS installation or execution.
defaults:
  platforms: [windows]
  for: [oledoc, pe, dll]
  attack: T1027.009

composite_rules:
  - id: isapi-module-opaque-overlay-profile
    desc: ISAPI-capable module with opaque content
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/server/module::http-extension-proc-export
    any:
      - id: objectives/anti-static/obfuscation/payload/encrypted::embedded-cipher-payload
      - id: objectives/anti-static/obfuscation/payload/section/layout::empty-code-high-entropy-overlay
      - id: metadata/binary/layout/overlay::high-entropy-overlay
    needs: 2
