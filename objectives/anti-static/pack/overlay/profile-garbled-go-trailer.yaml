defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: garbled-go-stack-strings-opaque-trailer
    desc: Garbled Go stack strings with opaque trailer
    crit: notable
    conf: 0.96
    attack: T1027
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: micro-behaviors/data/string/assembly::many-stack-materialized-strings
      - id: metadata/binary/layout/entropy::overlay-entropy-over-7
      - id: metadata/binary/layout/entropy::high-entropy-overlay
    unless:
      - id: metadata/signature/verified/developer/
