defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: upx-multi-pe-overlay-clues
    desc: UPX markers and unsigned multi-PE overlay
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/layout/overlay::unsigned-multi-embedded-pe-overlay
      - id: metadata/binary/section/label/packing::upx-section-pair
    any:
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/provenance/build::upx-banner
    needs: 1
    unless:
      - id: metadata/installer/product/
      - id: metadata/build/protector::upx-elfmainx-stub-name
      - id: metadata/binary/layout/embedded::embedded-pe-child
