defaults:
  platforms: [macos]
  for: [macho, dmg]
composite_rules:
  - id: macho-unsigned-sparse-strings-overlay
    desc: Unsigned Mach-O with sparse strings and overlay
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/layout/strings::sparse-sentence-strings
      - id: metadata/binary/section/ratio::macho-sparse-cstring-section
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/signature/absent::unsigned-macho
    unless:
      - id: metadata/signature/verified/developer/
      # Universal (fat) binaries carry one slice per architecture, so the
      # second slice sits past the end of the first slice's image and reads
      # as overlay, while the summed slices push tiny helpers over the
      # string-trait size floors. That "bulk outside the image" is a second
      # mapped image, not a hidden payload.
      - id: metadata/build/artifact::macho-universal-binary
      # Dynamic libraries map symbol and string tables into __LINKEDIT,
      # which reads as overlay without segment awareness. A dylib is not an
      # opaque payload stub executable.
      - id: metadata/binary/header/identity::macho-dylib
