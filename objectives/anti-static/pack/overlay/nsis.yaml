defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nsis-dominant-opaque-overlay
  desc: NSIS wrapper with dominant opaque overlay
  crit: notable
  conf: 0.92
  needs: 3
  any:
  - id: metadata/binary/installer/script::nsis-manifest-exehead
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/file/extension/identity::uninstaller-exe-basename
  - id: well-known/app/storage/qbittorrent/
  - id: well-known/app/security/bitwarden::bitwarden-app
  - id: well-known/app/utility/hyper::release-path
  - id: well-known/app/media/lx-music::release-path
  - id: well-known/dual-use/tunnel/mullvad::windows-installer-path
  - id: well-known/dual-use/tunnel/clash-verge/
