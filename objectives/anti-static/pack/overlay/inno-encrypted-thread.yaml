defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: inno-encrypted-overlay-thread-profile
  desc: Encrypted Inno overlay with thread APIs
  crit: suspicious
  conf: 0.97
  attack: T1027.002
  mbc: B0032
  all:
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: objectives/anti-static/obfuscation/payload/encrypted::encrypted-inno-overlay-payload
  any:
  - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: micro-behaviors/process/inject/runtime/call::suspend-thread
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  - id: micro-behaviors/os/privilege/token::shutdown-privilege-name
  - id: micro-behaviors/os/privilege/token::token-open-and-duplicate-apis
  needs: 2
  downgrade:
    any:
    - id: metadata/signed/platform/
