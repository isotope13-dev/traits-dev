defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: inno-encrypted-overlay-thread-profile
  desc: Inno overlay with thread or privilege APIs
  crit: notable
  conf: 0.97
  attack: T1027.002
  mbc: B0032
  all:
  - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
  - id: objectives/anti-static/obfuscation/payload/encrypted::encrypted-inno-overlay-payload
  any:
  - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  - id: metadata/file/system-info/privilege-name::shutdown-privilege-name
  - id: micro-behaviors/os/privilege/token::token-open-and-duplicate-apis
  needs: 2
