defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-overlay-decrypt-reflection-profile
  desc: Managed overlay, decryptor and reflection
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readallbytes-token
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
  unless:
  # The .NET single-file host's overlay is the bundled app, not a payload.
  - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
