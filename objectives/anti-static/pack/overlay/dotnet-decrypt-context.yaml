defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-overlay-decrypt-reflection-profile
  desc: Managed overlay, decryptor and reflection
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  - id: micro-behaviors/fs/read/file/content/whole::dotnet-readallbytes-token
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
  unless:
  # The .NET single-file host's overlay is the bundled app, not a payload.
  - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
# A tiny managed stub whose file is almost entirely appended data: it reads
# its own image through a stream, decrypts the appended blob, loads the
# plaintext with Assembly.Load and invokes the entry point by reflection.
# That is the crypter/packer shape. The wrapper hides the real program from
# static inspection, so the loader is convicted without seeing the payload.
# Plugin hosts load assemblies without hiding an overlay-resident program,
# and single-file hosts are excluded below.
- id: dotnet-overlay-decrypted-assembly-loader
  desc: Managed stub decrypts its overlay and loads it as an assembly
  crit: hostile
  conf: 0.95
  attack: T1027.002,T1620
  mbc: B0032
  all:
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  - id: micro-behaviors/fs/read/file/handle::dotnet-module-file-read
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
  - id: micro-behaviors/metaprogramming/reflection/invoke::managed-methodbase-invoke-call
  unless:
  - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
