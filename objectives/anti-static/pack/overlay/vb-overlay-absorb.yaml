# Crypter/binder "EOF patch": parse the PE headers, take the last section
# header, and enlarge its SizeOfRawData so data appended after the image
# (encrypted payload or settings) is covered by the section table instead of
# sitting in the overlay. It also invalidates any Authenticode overlay.
# Compilers, linkers and installers do not rewrite a finished image this way.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027.002

composite_rules:
  - id: vb-last-section-absorbs-overlay
    desc: VB grows last PE section over appended data
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/embedded/payload/header::vb-image-header-type-decl
      - id: micro-behaviors/data/format/executable/section::vb-last-section-header-offset
      - id: micro-behaviors/data/format/executable/section::vb-section-raw-size-grown-by-length
