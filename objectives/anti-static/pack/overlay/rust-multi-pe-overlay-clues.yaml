defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: rust-unsigned-dominant-multi-pe-overlay
    desc: Rust unsigned dominant multi-PE overlay
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: metadata/binary/layout/overlay::unsigned-multi-embedded-pe-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
    unless:
      - id: metadata/installer/product/
  - id: rust-multi-pe-overlay-virtualalloc-reference
    desc: Rust multi-PE overlay and VirtualAlloc reference
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: metadata/binary/layout/overlay::unsigned-multi-embedded-pe-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    unless:
      - id: metadata/installer/product/
