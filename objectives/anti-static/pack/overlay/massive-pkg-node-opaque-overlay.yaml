# A pkg-built Node executable is its runtime plus a script snapshot, so a
# few tens of megabytes. One that is over a hundred megabytes with more than
# half of it a high-entropy appended block carries a large opaque payload
# or padding beyond what any script bundle needs.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1027.009
composite_rules:
  - id: massive-pkg-node-exe-with-opaque-overlay
    desc: Massive pkg Node executable with opaque overlay
    crit: suspicious
    conf: 0.72
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: metadata/binary/layout/size::massive-executable
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/
