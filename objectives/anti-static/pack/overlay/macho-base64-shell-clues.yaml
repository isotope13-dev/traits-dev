# Base64 text, overlay and system API do not bind an executed command.
defaults:
  for:
  - macho
  platforms:
  - macos
  crit: suspicious
  conf: 0.98
composite_rules:
- id: macho-base64-shell-api-clues
  desc: Mach-O Base64, overlay and shell API clues
  all:
  - id: metadata/file/encoding/base64::large-base64-like-string
  - id: metadata/binary/layout/overlay::overlay-at-least-80k
  - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
  - id: micro-behaviors/process/create/shell/reference::few-imports-system-reference
