defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: nsis-opaque-overlay-temp-cab-virtualalloc
    desc: NSIS opaque overlay with temp entry, CAB name and VirtualAlloc
    crit: suspicious
    conf: 0.92
    scope: outer
    all:
      - id: metadata/installer/recognition::small-unsigned-system-plugin-clues
      - id: metadata/binary/layout/overlay::nsis-dominant-opaque-overlay
      - id: micro-behaviors/fs/path/temporary-artifact::nsis-temp-destination-entry
      - id: micro-behaviors/fs/path/archive::bare-cab-filename-string
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
