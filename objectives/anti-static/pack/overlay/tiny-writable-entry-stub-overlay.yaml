# A tiny PE whose entry point is in a writable section, whose DOS stub text
# was edited, and which trails an overlay of 512 bytes or more is a
# loader for the overlay: the stub has nothing else to do.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
composite_rules:
  - id: tiny-writable-entry-stub-with-overlay
    desc: Tiny writable-entry stub with appended overlay
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/section/header::small-pe-writable-entry-point
      - id: metadata/binary/header/malformed::pe-dos-stub-modified
      - id: metadata/binary/layout/overlay::noncertificate-overlay-512
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
