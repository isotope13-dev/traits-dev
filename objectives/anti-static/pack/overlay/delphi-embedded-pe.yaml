defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: delphi-embedded-pe-overlay-profile
    desc: Delphi PE with embedded PE and large overlay
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/ratio::overlay-dominates-third
    any:
      - id: metadata/lang/compiler/managed::delphi-kol-pas-source-path
      - id: metadata/lang/compiler/managed::borland-rtl-regkey
    unless:
      - id: well-known/app/storage/peazip::peazip-inno-uninstaller
      - id: well-known/tool/packaging/nsis::nsis
      - id: well-known/tool/packaging/nsis::nullsoft-install-system
      - id: well-known/tool/sysadmin/npcap::npcap-installer
      - id: well-known/tool/sysadmin/npcap::npcap-installer-context
