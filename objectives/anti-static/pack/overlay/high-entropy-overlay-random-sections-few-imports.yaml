# A PE with randomly named sections, almost no imports and an appended
# high-entropy overlay carries an encrypted payload outside its mapped image.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.009
composite_rules:
  - id: high-entropy-overlay-with-random-sections-and-few-imports
    desc: High-entropy overlay, random sections, few imports
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/binary/layout/entropy::overlay-entropy-over-7
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: metadata/binary/symbols/count::max-25-imports
    unless:
      - id: well-known/app/utility/yodot-recovery::versacor-signed-yodot-component
