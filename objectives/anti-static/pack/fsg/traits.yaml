# FSG 2.x places the PE signature at offset 0x0C, inside the DOS header,
# so the file sniffer rejects the image and types it `data`. Both FSG atoms
# are pinned to header offsets, so the `data` scope only reaches files with
# FSG's own header layout; composites that need PE facts keep `pe`.
defaults:
  platforms: [windows]
  for: [pe, dll, data]
  attack: T1027.002
  mbc: F0001

traits:
  - id: fsg-timestamp-signature
    desc: FSG packer PE timestamp signature
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 46 53 47 21
      offset_range: [12, 64]

  - id: fsg-entrypoint-stack-pivot
    desc: FSG packer entrypoint stack pivot
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      pattern: "87 25 ?? ?? ?? ?? 61 94 55 a4"
      offset_range: [256, 512]

composite_rules:
  - id: fsg-packed-pe
    desc: FSG-packed PE executable loader
    crit: suspicious
    conf: 0.98
    all:
      - id: fsg-timestamp-signature
      - id: fsg-entrypoint-stack-pivot

  - id: fsg-packed-executable-dropper
    desc: FSG-packed PE carries executable URL
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    attack: T1027.002,T1105
    all:
      - id: fsg-packed-pe
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe

  # The plaintext-URL dropper above, with the download URL hidden by
  # position-keyed XOR outside the compressed image instead: the packer
  # conceals the code and the cipher conceals the one string a scanner could
  # still read. A packed program has no reason to hide a remote executable's
  # address twice; together they are the stub-plus-config downloader shape.
  - id: fsg-packed-concealed-executable-url
    desc: FSG-packed PE hides executable URL with XOR
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1027,T1105
    all:
      - id: fsg-packed-pe
      - id: objectives/anti-static/obfuscation/encoding/xor/string::indexed-xor-executable-url
