# UPack (Dwing) PE packer: rewritten DOS stub, empty RWX .Upack reservation,
# and a high-entropy executable .rsrc that holds the real entry stub.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: F0001

traits:
  - id: kbydwing-stub-bytes
    desc: UPack Dwing DOS-stub marker
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 6B 42 79 44 77 69 6E 67 40
      offset: 52

  - id: dos-stub-kernel32-marker
    desc: UPack DOS stub KERNEL32 marker
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: MZKERNEL32.DLL

composite_rules:
  - id: upack-dwing-identity
    desc: UPack Dwing stub identity
    crit: notable
    conf: 0.99
    all:
      - id: kbydwing-stub-bytes
      - id: dos-stub-kernel32-marker
      - id: metadata/binary/section/label::upack-section-name

  - id: upack-empty-rsrc-ep-loader
    desc: UPack empty RWX resource-entry loader
    crit: hostile
    conf: 0.98
    all:
      - id: upack-dwing-identity
      - id: metadata/binary/section/label::empty-rwx-upack
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/header::two-section-pe
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/

  # Upack folds the PE header into the DOS header (`MZKERNEL32.DLL`, PE
  # signature at 0x10) and leaves only LoadLibrary/GetProcAddress imports. The
  # kByDwing banner is absent from later builds, so the folded header plus a
  # bootstrap-only import table and RWX stub sections carry the identity.
  - id: upack-folded-header-stub
    desc: UPack folded-header stub with bootstrap imports
    crit: suspicious
    conf: 0.85
    all:
      - id: dos-stub-kernel32-marker
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: metadata/binary/section/permission::pe-multiple-executable-writable-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
