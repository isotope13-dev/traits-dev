# Nuitka one-file executables unpack their bundled program at run time; these
# profiles pair that container with opaque resources, malformed structure and
# process-creation clues. They describe the clues, not a proven payload.
---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: nuitka-onefile-resource-process-profile
  desc: Nuitka one-file resource and process API profile
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/compiler/generated::nuitka-onefile-runtime
  - id: metadata/binary/section/entropy::high-entropy-rodata
  - id: metadata/binary/resource/representation::pe-resource-opaque-token
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
  - id: metadata/binary/layout/entropy::low-overlay-entropy
- id: nuitka-onefile-malformed-resource-profile
  desc: Nuitka one-file with malformed PE and large resource
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/anti-static/pack/self-extractor::nuitka-onefile-resource-process-profile
  - id: metadata/binary/header/malformed::malformed-pe-structure
  - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
  any:
  - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  unless:
  - id: metadata/installer/product/
