# Writable-entry PE stubs that stage payload from an oversized resource section.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1620

traits:
  # Cleartext prologue of a pushad/getpc stub. The byte loop itself stays
  # visible; the payload decode that follows is still ciphertext.
  - id: x86-getpc-byte-subtract-decoder
    desc: GetPC stub subtracts a byte key
    crit: notable
    conf: 0.9
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: 'E8 00 00 00 00 58 [0-40] 80 28 ?? [0-32] 61'

composite_rules:
  - id: writable-entry-oversized-resource-packed-stub
    desc: Writable-entry PE with oversized resource staging section
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/storage/bittorrent-client::bittorrent-official-client-identity

  - id: getpc-byte-subtract-writable-entry-loader
    desc: Writable entry decodes with byte subtraction
    crit: hostile
    conf: 0.96
    all:
      - id: x86-getpc-byte-subtract-decoder
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
