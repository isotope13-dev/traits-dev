# A rolling-key byte transform accompanies a missing on-disk code section.
# This establishes concealment, including in legitimate protected programs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: rolling-key-packed-code
    desc: Rolling-key transform with packed code layout
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: micro-behaviors/data/encoding/xor::x64-rolling-key-byte-transform
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/file/entropy::very-high-overall-entropy-75
