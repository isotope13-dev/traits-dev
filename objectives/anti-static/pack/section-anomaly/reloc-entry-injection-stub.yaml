# A linker puts relocation data in .reloc and nothing in it runs. Here the
# entry point sits inside a large, high-entropy .reloc section that is also
# writable and executable, so the real program is packed behind the
# relocation table. Add the process-memory and thread-context APIs that
# drive thread hijacking and the stub is an injector carrier.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1055.003
composite_rules:
  - id: reloc-section-entry-with-thread-hijack-apis
    desc: Entry in RWX reloc section with thread-hijack APIs
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/binary/section/header::pe-entry-in-reloc-section
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
    unless:
      - id: metadata/signed/platform/
