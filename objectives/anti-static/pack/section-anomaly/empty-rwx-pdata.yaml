# Cryptor/packer stubs that reserve a large empty RWX `.pdata` section
# (BSS-style) while placing the entry stub in an executable `.rsrc` with a
# four-import VirtualProtect resolve table. Distinct from real PE exception
# directories, which are not RWX BSS reservations.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: F0001

traits:
  - id: empty-rwx-pdata-reservation
    desc: Empty RWX .pdata memory reservation
    crit: suspicious
    conf: 0.96
    if:
      type: section
      exact: .pdata
      writable: true
      executable: true
      length_max: 1
      # Virtual size is large; file size near-zero (length_max covers file bytes).
    unless:
      - id: metadata/signature/verified/developer/
      - id: metadata/installer/product/

composite_rules:
  - id: empty-pdata-executable-rsrc-crypt-stub
    desc: Empty RWX .pdata with executable .rsrc crypt stub
    crit: hostile
    conf: 0.97
    all:
      - id: empty-rwx-pdata-reservation
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
    needs: 2
    unless:
      - id: metadata/signature/verified/developer/
      - id: metadata/installer/product/

  - id: pdata-entry-payload-crypter-stub
    desc: PE pdata entry stub with oversized payload
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/section/header::pe-entry-in-pdata-section
      - id: metadata/binary/section/ratio::oversized-rdata-ratio
      - id: micro-behaviors/os/api-resolution/export-table::x64-pe-signature-export-rva-read
    unless:
      - id: metadata/signature/verified/developer/
      - id: metadata/installer/product/
