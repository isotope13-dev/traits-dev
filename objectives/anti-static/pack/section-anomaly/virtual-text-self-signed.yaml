# A protector-style layout: an empty .text, an entry point in a dotted
# section with a random-looking name, an executable section of nearly random
# bytes holding almost the whole file, and a signature from a certificate
# that signed itself. Commercial protectors produce the layout; the
# self-issued signature, made for the file, is the part ordinary software
# does not have.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1553.002
composite_rules:
  - id: virtual-text-packed-entry-self-signed-image
    desc: Empty .text, packed entry section, self-issued signature
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/section/header::pe-entry-in-short-dotted-packer-section
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
    unless:
      - id: metadata/signed/platform/
