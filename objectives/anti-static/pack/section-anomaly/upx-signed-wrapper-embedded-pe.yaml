defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1036.001,T1553.002

composite_rules:
  # A vendor installer keeps its Authenticode block and version resource while the
  # outer image is replaced by a UPX-packed loader (random section names, PEB
  # walk, debugger check) that carries the original signed installer as a
  # high-entropy resource it locates and resolves exports for. The signed digest no longer matches the outer image, so the
  # vendor identity is a costume for the wrapper, not a property of it.
  - id: upx-signed-wrapper-peb-loader-opaque-resource
    desc: UPX wrapper loader around opaque resource
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/provenance/signature::pe-signature-digest-mismatch
      - id: objectives/anti-static/pack/section-anomaly::random-section-loader-with-peb-access-and-debugger-check
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-module-export-lookup
      - id: metadata/binary/section/label::upx-section
    unless:
      - id: metadata/signed/platform/
