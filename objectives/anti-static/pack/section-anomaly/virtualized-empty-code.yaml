# Empty original code plus a high-entropy executable carrier and actual
# repeated stack camouflage supports packing, independently of signer identity.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: empty-text-obfuscated-executable-carrier
    desc: Empty .text with packed code and stack junk
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    all:
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/section/header::pe-entry-in-nonstandard-section
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: objectives/anti-static/obfuscation/instruction/junk::x64-repeated-discarded-immediate-push
