defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009,T1554

composite_rules:
  - id: duplicated-standard-section-graft
    desc: Unsigned PE carries a second standard code and data layout
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/section/names::duplicated-text-sections
      - id: metadata/binary/section/names::duplicated-rdata-sections
      - id: metadata/binary/section/names::duplicated-data-sections
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/layout::pe-checksum-zeroed
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
  - id: duplicate-text-rwx-entry-graft
    desc: Duplicated .text layout places the PE entry point in writable code
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1554
    all:
      - id: metadata/binary/section/names::duplicated-text-sections
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: metadata/binary/section/metrics::writable-text-section
      - id: metadata/binary/metrics/structural::high-code-entropy
      - id: metadata/binary/layout::pe-checksum-valid
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/platform/
