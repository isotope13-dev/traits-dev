defaults:
  crit: suspicious
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009,T1554

composite_rules:
  - id: opaque-section-layout-with-tls-resolver
    desc: Unsigned PE has duplicate sections, TLS startup, and runtime API resolution
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/section/label::duplicated-text-sections
      - id: metadata/binary/section/label::duplicated-rdata-sections
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/

  - id: duplicated-standard-section-graft
    desc: Unsigned PE has duplicate standard section names and a zeroed checksum
    conf: 0.98
    all:
      - id: metadata/binary/section/label::duplicated-text-sections
      - id: metadata/binary/section/label::duplicated-rdata-sections
      - id: metadata/binary/section/label::duplicated-data-sections
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
  - id: duplicate-text-rwx-entry-graft
    desc: Duplicated .text layout places the PE entry point in writable code
    conf: 0.99
    attack: T1027.002,T1554
    all:
      - id: metadata/binary/section/label::duplicated-text-sections
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/permission::writable-text-section
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/layout/checksum::pe-checksum-valid
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/platform/
  - id: duplicate-text-rwx-entry-checksum-mismatch
    desc: Duplicated .text layout with writable entry point and invalid checksum
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1554
    all:
      - id: metadata/binary/section/label::duplicated-text-sections
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/binary/layout/checksum::writable-ep-checksum-mismatch
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/platform/
