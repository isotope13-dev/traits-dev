# A section table that overlaps itself, a section that claims to run past the
# end of the file, a rewritten DOS stub and a resource section many times the
# size of the code are all header edits made after linking. Parsers that trust
# the table read the wrong bytes while the Windows loader still maps the
# image, so the tampering hides the resource payload from static tools.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1027.002
composite_rules:
  - id: overlapping-sections-with-giant-rsrc-and-edited-stub
    desc: Overlapping sections, giant rsrc and edited DOS stub
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/header/malformed::pe-section-overlap
      - id: metadata/binary/section/ratio::pe-section-overflow-present
      - id: metadata/binary/resource/size::giant-rsrc
      - id: metadata/binary/header/identity::pe-nondefault-dos-stub
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
