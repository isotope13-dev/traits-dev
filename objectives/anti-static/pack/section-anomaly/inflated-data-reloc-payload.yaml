# A data section whose virtual size dwarfs its raw size is scratch space for
# unpacked code, and a .reloc section that is high-entropy is not
# relocation data. Together in an unsigned PE with a high-entropy region
# mass over 64 KiB, the .reloc section is where the encrypted payload sits.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.009
composite_rules:
  - id: inflated-data-with-high-entropy-reloc-payload
    desc: Inflated data section with high-entropy reloc
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/section/label::suspicious-reloc-section
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
