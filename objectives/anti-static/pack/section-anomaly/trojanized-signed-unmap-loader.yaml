# A vendor-signed binary whose Authenticode digest no longer matches its
# image, carrying encrypted anonymous payload sections behind random section
# names, with an unmap-view hollowing loader. The signature is the trust
# being abused: the vendor identity (here NVIDIA) survives in the
# certificate while the bytes it vouched for were replaced by an encrypted
# payload and a loader that hollows a host process. Legitimate signed
# software never ships a broken digest; packed-but-valid binaries keep a
# matching signature or carry no signature at all.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1553.002

composite_rules:
  - id: digest-mismatch-encrypted-payload-unmap-loader
    desc: Signature-broken binary stages encrypted payload for unmap loading
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/binary/section/permission::anonymous-pe-section-high-entropy
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
