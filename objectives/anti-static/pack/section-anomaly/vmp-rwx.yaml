# Large RWX high-entropy .vmpN sections — used by VMProtect and by
# Expiro-class PE appenders that masquerade as VMProtect. Atomic only;
# infection intent lives in impact/infect and well-known composites.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027.002
  mbc: B0032
traits:
- id: large-rwx-vmp-encrypted-section
  desc: Large high-entropy RWX VMP-named section
  crit: suspicious
  conf: 0.94
  size_min: 131072
  if:
    type: section
    regex: ^\.vmp[0-2]$
    writable: true
    executable: true
    length_min: 262144
    length_max: 1572864
    entropy_min: 7.0
  unless:
  - id: metadata/signed/platform/
  - id: objectives/anti-static/pack/detect::vmprotect-marker
  - id: objectives/anti-static/pack/vmprotect::marker-string
