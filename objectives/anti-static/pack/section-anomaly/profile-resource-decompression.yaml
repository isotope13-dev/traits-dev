defaults: {}
composite_rules:
  - platforms:
      - windows
    for:
      - pe
    id: giant-resource-native-decompression-profile
    desc: Giant resource and native decompression references
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/binary/resource/size::giant-rsrc
      - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
      - id: micro-behaviors/data/codec::rtl-decompress-buffer
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
    unless:
      - id: metadata/installer/product/
