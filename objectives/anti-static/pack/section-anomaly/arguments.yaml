defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: excessive-function-arguments
    desc: "func definition with excessive args (>50)"
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: 'function\s+[a-zA-Z0-9_]+\s*\(([a-zA-Z0-9_]+,){50,}[a-zA-Z0-9_]+\)'
    not:
      - regex: '^function\s+invoke_'
      # dart2js arity-dispatcher stubs take every arg as sequential
      # minified params (a..z, a0..): compiler emission, not padding.
      - regex: 'function\s+[a-zA-Z0-9_]+\(a,b,c,d,e,f,g,h,i,j,k,l,m'
    unless:
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
