# A PE whose entry point lands in a writable section, whose section table marks
# nothing executable, and which carries other PE images inside it.
#
# Taken together these describe an image that cannot run as laid out: something
# has to flip page protections before the entry point is reachable, which is
# what an unpacking stub does at runtime. That the file also contains further
# PE headers says what is being unpacked — payload executables, not
# compressed data.
#
# Written without naming a packer on purpose. ASPack's `.aspack`/`.adata`
# sections identify the tool used in this sample, but the structural facts hold
# for every runtime packer, including whatever is written next; a
# marker-matching rule only ever recognises the ones already seen.
#
# Suspicious rather than hostile: commercial protectors legitimately produce
# the first two facts, and the exclusions cover recognised installers and
# tooling. What no ordinary protected build has is the third — a protected
# application is one program, not several.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002
  mbc: E1027.002

composite_rules:
  - id: unexecutable-image-carrying-embedded-pes
    desc: Unrunnable PE layout carries embedded PE images
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: metadata/binary/metrics/structural::pe-no-executable-sections
      - id: metadata/binary/layout::multiple-pe-embedded
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/tool/
