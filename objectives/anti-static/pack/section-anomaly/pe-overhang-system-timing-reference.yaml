defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: pe-overhang-system-timing-reference
    desc: PE section overhang with timing reference
    crit: suspicious
    conf: 0.94
    for: [pe, dll]
    all:
      - id: metadata/binary/section/ratio::high-entropy-pe-section-overhang
      - id: micro-behaviors/os/sysinfo/platform/artifact::kuser-shared-data
    any:
      - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
      - id: metadata/binary/section/ratio::few-sections
    needs: 1
