defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1055

composite_rules:
  # An ordinary VB6 program has one code section and no writable executable
  # ones. Three or more RWX sections, two of them anonymous or near-zero
  # entropy stub areas, mean a packer or crypter wrapped the VB6 runtime
  # around a payload it unpacks into memory.
  - id: vb6-multi-rwx-anonymous-stub-sections
    desc: VB6 image wrapped in anonymous RWX stub sections
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/hardening/memory::three-plus-wx-sections
      - id: metadata/binary/section/permission::near-zero-entropy-rwx-section
      - id: metadata/binary/section/permission::large-anonymous-pe-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
