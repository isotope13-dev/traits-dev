# Randomly named executable and data sections, high overall entropy, access
# to the PEB, and a debugger check in a small console program describe a
# loader whose payload sits in the oddly named data section and whose code
# checks for analysis before touching it.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1622
composite_rules:
  - id: random-section-loader-with-peb-access-and-debugger-check
    desc: Random-section loader with PEB access and anti-debug
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/file/entropy::high-overall-entropy-70
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x86
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
