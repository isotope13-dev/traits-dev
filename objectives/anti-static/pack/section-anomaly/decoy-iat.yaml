# Two-section PE with a hugely inflated .data image and a cross-domain
# GDI/IME/RPC decoy IAT — unsigned cryptor stub, not a GUI application.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002

composite_rules:
  - id: unsigned-inflated-decoy-iat-loader
    desc: Unsigned inflated two-section decoy loader
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/decoy-imports::gdi-ime-rpc-decoy-cluster
      - id: metadata/binary/section/metrics::two-section-pe
      - id: metadata/binary/section/metrics::inflated-data-section
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/platform/wine/
