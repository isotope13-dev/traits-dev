# `.reloc` holds base-relocation tables, which the loader reads and never
# executes. A quarter-megabyte RWX `.reloc` section with the entry point inside
# it is code stored in the relocation directory and started from the PE header:
# the image's original entry has been replaced. The compiler never emits this
# layout; an infector or packer that grows the last section does.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1055.012
composite_rules:
  - id: entry-in-rwx-reloc-payload-section
    desc: Entry point inside large RWX relocation section
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/section/header::pe-entry-in-reloc-section
      - id: metadata/binary/section/reloc::large-write-execute-mid-entropy-section
      - id: metadata/signature/absent::unsigned-missing-signature-record
