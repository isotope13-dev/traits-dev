defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: packed-executable-resource-ip-clues
    desc: Packed resource and external IP text clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/code/entropy::high-code-entropy
    any:
      - id: metadata/build/protector::aspack-name-reference
      - id: well-known/tool/packaging/themida::themida-name-reference
      - id: well-known/dual-use/packaging/pecompact::pec2no-header-marker
