defaults:
  platforms:
  - windows
composite_rules:
- id: rwx-reloc-resource-selfdelete-profile
  desc: RWX .reloc, resource extraction and self-delete clues
  conf: 0.96
  size_min: 200000
  all:
  - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: objectives/evasion/self-delete/file/script::module-path-delete
  any:
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
  - id: metadata/build/manifest::require-administrator
  needs: 1
  for: &id001
  - pe
  - dll
  crit: hostile
- id: reloc-opaque-overlay-resource-extraction
  desc: Packed .reloc and opaque overlay with resource extraction
  conf: 0.98
  attack: T1027.002,T1027.009,T1105
  mbc: B0032
  all:
  - id: objectives/anti-static/pack/loader-noise::reloc-encrypted-dominant-overlay
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  for: *id001
  crit: hostile
- id: rwx-reloc-unrolled-decoder-profile
  desc: RWX .reloc with unrolled decoder and loader APIs
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/payload/section/layout::x86-unrolled-dword-decoder-in-reloc
  - id: metadata/binary/section/reloc::large-write-execute-low-entropy-section
  - id: metadata/binary/section/ratio::reloc-dominates-image
  - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
  any:
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  needs: 1
  unless:
  - id: metadata/installer/product/
  for:
  - pe
  - dll
- id: native-rc4-wx-vm-reference-profile
  desc: RC4 bytecode, writable executable section and VM clues
  conf: 0.98
  attack: T1027,T1140,T1497.001,T1620
  all:
  - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::rc4-bytecode
  - id: metadata/binary/section/permission::wx-section
  any:
  - id: objectives/anti-analysis/vm-detect/
  - id: micro-behaviors/os/virtualization/hypervisor::hyperv-vendor-reference
  for:
  - pe
  - dll
  crit: hostile
- id: rwx-text-resource-opaque-overlay
  desc: Writable executable sections with high-entropy resource and overlay
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/binary/section/permission::wx-section
  - id: metadata/binary/section/permission::executable-rsrc-section
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/layout/overlay::large-opaque-high-entropy-overlay
  unless:
  - id: metadata/installer/product/
  for:
  - pe
