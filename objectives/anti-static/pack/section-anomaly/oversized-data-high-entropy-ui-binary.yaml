# A small code section behind a large inflated data area, nonstandard section
# names and a high-entropy region mass over 64 KiB, in a UI program that
# carries Microsoft version data without a signature, hides a data blob
# where the original program kept little.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1036.005
composite_rules:
  - id: unsigned-microsoft-claim-with-inflated-high-entropy-data
    desc: Unsigned Microsoft-claim PE with hidden data blob
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/section/size::small-code-in-large-pe
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      # Require entropy in writable data, rather than borrowing a compressed
      # cabinet's entropy from .rsrc in an ordinary IExpress extraction stub.
      - id: metadata/binary/section/entropy::writable-data-section-entropy-over-7
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/layout/overlay::7z-sfx-config-marker
