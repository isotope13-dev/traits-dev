# A small code section behind a large inflated data area, nonstandard section
# names and a high-entropy region mass over 64 KiB, in a UI program that
# carries Microsoft version data without a signature, hides a data blob
# where the original program kept little.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1036.005
traits:
  - id: programdata-random-directory-creation-command
    desc: Creates random ProgramData directory
    crit: notable
    if:
      type: text
      regex: 'cmd\.exe /c mkdir [A-Z]:\\ProgramData\\[\w-][\w-]+'
      case_insensitive: true
  - id: programdata-random-executable-copy-command-fragment
    desc: Copies randomly named executable
    crit: notable
    if:
      type: text
      regex: 'copy /y [A-Z0-9]{12,24}\.EXE'
      case_insensitive: true

composite_rules:
  # Both command fragments must occur close together; unrelated installer
  # text mentioning ProgramData or an executable copy does not satisfy this.
  - id: programdata-random-executable-copy-command
    desc: Copies random executables into ProgramData
    crit: notable
    conf: 0.97
    near_bytes: 256
    all:
      - id: programdata-random-directory-creation-command
      - id: programdata-random-executable-copy-command-fragment
  - id: unsigned-microsoft-claim-with-inflated-high-entropy-data
    desc: Unsigned Microsoft-claim PE with hidden data blob
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/signature/absent::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/section/size::small-code-in-large-pe
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      # Require entropy in writable data, rather than borrowing a compressed
      # cabinet's entropy from .rsrc in an ordinary IExpress extraction stub.
      - id: metadata/binary/section/entropy::writable-data-section-entropy-over-7
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/binary/layout/overlay::7z-sfx-config-marker

  - id: unsigned-microsoft-claim-stages-programdata-executables
    desc: Fake Microsoft PE stages executables in ProgramData
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1105
    all:
      - id: unsigned-microsoft-claim-with-inflated-high-entropy-data
      - id: programdata-random-executable-copy-command
      - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
