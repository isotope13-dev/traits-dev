# A multi-megabyte PE whose sections carry random names, whose executable code
# is negligible and which imports almost nothing is a container for a payload
# held in its data sections; it resolves the APIs it needs through the PEB.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.007
composite_rules:
  - id: random-section-names-negligible-code-few-imports-peb
    desc: Random sections, negligible code, few imports, PEB walk
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/symbols/count::max-25-imports
      - id: micro-behaviors/process/info/query::peb-access-x64
