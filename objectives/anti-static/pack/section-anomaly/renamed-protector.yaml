# A commercial protector that was told not to advertise itself. The name-based
# rules in this tree (.vmpN, Themida, ASProtect, Enigma) all fail the moment the
# operator renames the sections, which every one of those products supports, so
# this composite reads the layout instead: cloned section names, the entry point
# sitting in a section the loader will let the process write to, and that
# section holding high-entropy bytes rather than code.
#
# Suspicious, not hostile: protecting a binary this way is what the products are
# sold for, and licensed commercial software ships like this. What it does mean
# is that nothing downstream can read the real code, which is worth saying out
# loud on an unsigned binary.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027.002
  mbc: F0001

composite_rules:
  - id: renamed-protector-rwx-image
    desc: Packed image with cloned RWX code sections
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/section/names::cloned-standard-section-names
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: metadata/binary/section/metrics::high-entropy-exec-section
    unless:
      - id: metadata/signed/platform/
