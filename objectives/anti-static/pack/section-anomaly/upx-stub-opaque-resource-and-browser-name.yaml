# A UPX-packed program with a cipher-entropy resource section that it
# loads through the resource-loader API chain, names the URL moniker library
# and carries a browser product name inside a resource string is a loader
# dressed with browser identity strings: the resource is the hidden payload.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1036.005,T1105
composite_rules:
  - id: upx-stub-with-opaque-resource-loader-and-urlmon
    desc: UPX stub loading opaque resource with urlmon
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: upx-stub-with-pe-signature-check-and-browser-name
    desc: UPX stub with PE check and browser name string
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/instruction::pe-signature-immediate-compare
      - id: metadata/binary/resource/identity::chrome-name-resource-string
      - id: metadata/binary/symbols/imports::graphics-api-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
