defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: strictor-resource-section-api-profile
    desc: Strictor-style resource, section and API clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/resource/label::reginst-resource-label
      - id: metadata/binary/resource/label::image-resource-label
      - id: micro-behaviors/ui/dialog/error::loader-error-caption
      - id: metadata/binary/section/label/packing::vr-writable-section
      - id: metadata/binary/section/label/packing::mmym-small-executable-section
      - id: metadata/binary/symbols/imports::mfc42-ccmdtarget-interface-map-import
      - id: micro-behaviors/communications/socket/options::setsockopt-windows
      - id: micro-behaviors/mem/combined::virtual-memory-api-name-triad
  - id: vr-mmym-packed-resource-loader
    desc: Packed PE with vr/mmym sections and payload resources
    crit: hostile
    conf: 0.98
    attack: T1027.002
    all:
      - id: strictor-resource-section-api-profile
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
