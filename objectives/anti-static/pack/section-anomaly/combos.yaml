# Anti-Static: Packing and Obfuscation
# Composite rules for detecting packed or obfuscated code
defaults:
  platforms: [windows, linux, macos, unix, android, ios]
composite_rules:
  - id: rwx-packed-loader
    desc: PE with RWX section flood and packed payload
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1620
    mbc: B0032
    for: [pe]
    all:
      - id: metadata/hardening/memory::extreme-wx-section-count-10
      - id: metadata/binary/section/layout::large-low-entropy-rwx-section
      - id: metadata/binary/section/permission::near-zero-entropy-rwx-section
      - id: objectives/anti-static/pack/loader-noise::rsrc-rwx-null-payload-section
  - id: packed-ad-targeting
    desc: Packed binary with Active Directory and Terminal Services imports
    crit: suspicious
    conf: 0.8
    attack: "T1027"
    for: [pe]
    all:
      - id: micro-behaviors/dylib/load/dsprop/
      - id: micro-behaviors/dylib/library/family::pe-terminal-services-library-reference
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
  - id: payload-unpacking
    desc: Embedded payload with unpacking capability
    crit: notable
    conf: 0.85
    attack: "T1140"
    mbc: "C0032"
    for: ["pe", "dll"]
    all:
      - id: micro-behaviors/data/embedded/payload/compression::lzma-magic
      - id: objectives/anti-static/obfuscation/reflection/class::dynamic-load-pattern
    downgrade:
      any:
        - id: well-known/game/steam/
  # Large packed JS with excessive function arguments and string decryptor
  - id: packed-js-payload
    desc: Packed JavaScript payload with string decryptor
    crit: hostile
    conf: 0.98
    attack: "T1027"
    mbc: "B0032"
    for: [javascript, typescript]
    needs: 3
    any:
      - id: objectives/command-and-control/backdoor/keywords::user-get-action-class
      - id: objectives/anti-static/pack/section-anomaly::excessive-function-arguments
      - id: objectives/anti-static/obfuscation/string/dynamic::arithmetic-decoder-wrapper-call
      - id: metadata/binary/layout/size::large-source-file-4mb
      - id: metadata/file/line::source-lines-over-1000
  # Large packed binary with excessive arguments
  - id: packed-excessive-args
    desc: Large packed file with excessive function arguments
    crit: suspicious
    conf: 0.9
    attack: "T1027"
    mbc: "B0032"
    # excessive-function-arguments matches the JS `function name(...)` syntax,
    # so this is JS-scoped; large-file-1mb is for compiled binaries/source
    # languages and never fires on javascript, so the size gate is applied
    # directly here instead of through that leg.
    for: [javascript, typescript]
    size_min: 1048576
    all:
      - id: objectives/anti-static/pack/section-anomaly::excessive-function-arguments
    any:
      - id: metadata/file/line::source-lines-over-1000
      - id: objectives/anti-static/obfuscation/code-metrics/structure::minified-code
    unless:
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
  - id: packed-pe-temp-shell-stager
    desc: Packed PE temp shell stager
    crit: suspicious
    conf: 0.92
    attack: "T1027,T1105"
    mbc: "B0032"
    for: [pe]
    all:
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
    any:
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
      - id: micro-behaviors/process/terminate/kill::terminate-process
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/media/vlc::windows-nsis-bundle
      - id: well-known/lib/media/videolan::videolan-codec-lib
  - id: rwx-flood-low-entropy-overlay-loader
    desc: RWX section flood overlay loader
    crit: hostile
    conf: 0.97
    attack: "T1027.002"
    mbc: "B0032"
    for: [pe]
    all:
      - id: metadata/hardening/memory::extreme-wx-section-count-10
      - id: metadata/binary/layout/overlay::low-entropy-large-overlay
      - id: micro-behaviors/os/module/load::module-export-resolution-imports
      - id: metadata/binary/symbols/count::imported-functions-under-80
      - id: metadata/binary/section/entropy::random-exec-payload-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/

  - id: short-dotted-packer-high-entropy-payload
    desc: Packed PE with entry in short dotted section and high-entropy payload mass
    crit: hostile
    conf: 0.98
    attack: "T1027.002"
    mbc: "B0032,F0001"
    for: [pe]
    all:
      - id: metadata/binary/section/header::pe-entry-in-short-dotted-packer-section
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/section/entropy::small-high-entropy-executable-section-without-text
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
    any:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/provenance/build::header-timestamp-pre-2000
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # Large-section sibling of the rule above: NSPack-style loaders keep a ~90 KB
  # high-entropy payload section, so the 64 KB small-section leg never fires
  # even though the shape (dotted entry, nonstandard names, dominant opaque
  # section, broken signature) is the same packer. The tampered-signature leg
  # is required rather than alternative: a dominant high-entropy section alone
  # also describes packed games and SFX installers that still verify.
  - id: short-dotted-packer-dominant-tampered-payload
    desc: Tampered packed PE with dominant payload in short dotted section
    crit: hostile
    conf: 0.98
    attack: "T1027.002,T1553.002"
    mbc: "B0032,F0001"
    for: [pe]
    platforms: [windows]
    all:
      - id: metadata/binary/section/header::pe-entry-in-short-dotted-packer-section
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: metadata/binary/code/entropy::code-region-entropy-78
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: blank-section-packer-high-entropy-payload
    desc: Packed PE with blank-named section and high-entropy payload mass
    crit: hostile
    conf: 0.98
    attack: "T1027.002"
    mbc: "B0032,F0001"
    for: [pe]
    platforms: [windows]
    all:
      - id: metadata/binary/section/label::blank-named-section
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/section/entropy::small-high-entropy-executable-section-without-text
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    any:
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
