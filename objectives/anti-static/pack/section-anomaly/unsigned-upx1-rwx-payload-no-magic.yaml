# An unsigned PE that names a company and carries one large high-entropy RWX
# section called UPX1, with no UPX magic at the stub, has an encrypted payload
# appended as a section. Real UPX writes UPX0 and UPX1 together and leaves its
# magic at the stub. The composite requires the section name, the unsigned
# record, and a version-resource company claim, so a bare UPX1 section from a
# genuine UPX build does not reach this rule.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1036.005
composite_rules:
  - id: unsigned-upx1-rwx-payload-without-magic
    desc: Unsigned company PE with RWX UPX1 payload, no UPX magic
    crit: hostile
    conf: 0.75
    all:
      - id: metadata/binary/section/entropy::large-rwx-upx1-section
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-version-company-name-value
    unless:
      - id: metadata/binary/layout/stub::upx-early-magic
