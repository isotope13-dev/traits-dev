# A PE with no import table, ten or fewer recovered basic blocks, and either a
# dominant section or almost no strings: the stub of a packer or crypter
# whose real code is decoded at run time. Moved from
# objectives/anti-analysis/vm-detect/instruction, where it sat beside CPUID
# and RDTSC checks although nothing in it detects a virtual machine.
defaults:
  platforms: [windows]
  attack: T1027.002
composite_rules:
  - id: sparse-execution-anomaly
    for: [pe]
    desc: Import-less PE with almost no code
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/code/complexity::sparse-logic-density
      - id: metadata/binary/symbols/count::no-imports
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::dominant-section
      - id: metadata/binary/code/density::minimal-string-count
    unless:
      - id: metadata/binary/framework/
