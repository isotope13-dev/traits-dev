# A PE whose largest section is executable code with an unprintable or blank
# name, next to other non-standard section names, and whose image is almost all
# code and little data, is a packed or protected binary rather than a normal
# compiler output.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002
composite_rules:
  - id: blank-named-code-section-with-nonstandard-names-and-code-heavy-image
    desc: Blank-named code section in code-heavy packed PE
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/binary/section/label::blank-named-section
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/section/ratio::pe-near-total-code-data
