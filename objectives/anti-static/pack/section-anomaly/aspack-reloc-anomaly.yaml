defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: aspack-reloc-anomaly-embedded-pe
    desc: ASPack-packed PE with stripped relocations and declared fixup blocks
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/build/protector::aspack-x86-unpacking-stub
      - id: metadata/binary/section/reloc::relocs-stripped-with-declared-reloc-blocks
      - id: metadata/binary/layout/overlay::aspack-writable-entry-embedded-pe-overlay
    unless:
      - id: metadata/signature/verified/

  # The same wrapper layout is a decoy carrier when the unsigned outer stub is
  # dwarfed by the carried image (overlay over 90 percent of the file). The
  # observed specimen packs an MSWDM worm (Run keys, AV kill list, self-copy
  # as kernel32.exe) in front of a Microsoft-signed Sysinternals
  # Autologon64.exe. The packed stub cannot be inspected, so the wrapper
  # layout around a dominant carried PE is the finding.
  - id: aspack-wrapper-dominant-embedded-pe-overlay
    desc: ASPack stub with relocation anomaly wrapping a dominant embedded PE
    crit: hostile
    conf: 0.9
    attack: T1027.002,T1036.001
    all:
      - id: aspack-reloc-anomaly-embedded-pe
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/signature/absent::unsigned-missing-signature-record
