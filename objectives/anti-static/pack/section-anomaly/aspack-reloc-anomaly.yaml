defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: aspack-reloc-anomaly-embedded-pe
    desc: ASPack-packed PE with stripped relocations and declared fixup blocks
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/build/protector::aspack-x86-unpacking-stub
      - id: metadata/binary/section/reloc::relocs-stripped-with-declared-reloc-blocks
      - id: metadata/binary/layout/overlay::aspack-writable-entry-embedded-pe-overlay
    unless:
      - id: metadata/signature/verified/
