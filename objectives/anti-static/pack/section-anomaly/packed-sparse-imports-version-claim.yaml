# A packed image with a sparse import table and extra non-standard sections
# that still carries company, product and file-version strings borrows an
# identity to look like an ordinary program. Packers do not add those
# strings, so they were set by whoever built the stub.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027.002
composite_rules:
  - id: packed-sparse-import-stub-with-version-claim
    desc: Packed sparse-import stub claiming a product identity
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/code/entropy::sparse-import-high-code-entropy
      - id: metadata/binary/provenance/version-info::pe-companyname-field
      - id: metadata/binary/provenance/version-info::pe-productname-field
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
