# A manifest still carrying the template placeholder assembly name, an entry
# point inside a short dotted section, and a window-title enumeration that
# also terminates processes by name describe a stub assembled from a builder
# template: it finds a target window, kills competing processes and moves on.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1057,T1489,T1027
composite_rules:
  - id: placeholder-identity-stub-with-window-process-killer
    desc: Template stub that enumerates windows and kills processes
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/resource/identity::placeholder-assembly-identity
      - id: metadata/binary/section/header::pe-entry-in-short-dotted-section
      - id: micro-behaviors/ui/window/enumerate::window-process-title-api-profile
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    unless:
      - id: metadata/signed/platform/
      # Bat To Exe Converter builds carry the template placeholder manifest,
      # a `.code` entry stub and the runtime's window/process plumbing on
      # every compile; that shared wrapper shape is not a builder-template
      # attack stub.
      - id: well-known/dual-use/packaging/bat-to-exe/
