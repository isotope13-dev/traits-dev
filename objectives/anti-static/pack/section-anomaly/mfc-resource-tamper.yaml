# Suspicious resource-heavy MFC/GUI applications where the resource table shape
# looks tampered or parser-hostile. These rules intentionally stay below hostile:
# MFC imports can explain hooks, BitBlt, resource loading, and memory management.
defaults:
  crit: suspicious
  for: [pe]
  platforms: [windows]
  attack: T1027
composite_rules:
  - id: unsigned-mfc-malformed-resource-table
    desc: Unsigned MFC app with malformed resources
    conf: 0.9
    all:
      - id: metadata/signed/trust-level::unsigned
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/resource/size::large-null-rsrc
    any:
      - id: metadata/binary/framework::mfc-application-framework
      - id: metadata/package/versioning/scheme::pe-version-resource
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: metadata/binary/symbols/count::many-imports
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
  - id: packed-gui-null-resource-wrapper
    desc: Packed GUI with null resource wrapper
    conf: 0.91
    all:
      - id: metadata/binary/layout/entropy::high-overall-entropy-70
      - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
      - id: metadata/binary/header/malformed::malformed-pe-structure
    any:
      - id: metadata/signed/trust-level::unsigned
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: metadata/binary/symbols/count::many-imports
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/app/utility/360-clean-master::360-clean-master-installer-identity
  - id: malformed-resource-ui-monitor-surface
    desc: Malformed resource app with UI monitoring
    conf: 0.88
    all:
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/resource/size::large-null-rsrc
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::foreground-window-input-state
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # The two sibling rules above require the image to be unsigned; this one
      # did not, so it fired on signed GUI utilities whose only "UI monitoring"
      # is a hook, BitBlt and a desktop-window handle. Authenticode digests the
      # resource directory, so an intact chain rules out the resource-table
      # tampering this rule is named for.
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
