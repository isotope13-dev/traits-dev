defaults:
  for: [macho]
  platforms: [macos]
  crit: hostile
  conf: 0.98
  attack: T1027

composite_rules:
  - id: encoded-overlay-sparse-command-runner
    desc: Encoded overlay in sparse command runner
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: objectives/anti-static/obfuscation/control-flow/logic::overlay-at-least-half
      - id: objectives/anti-static/obfuscation/payload/import::minimal-imports
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
