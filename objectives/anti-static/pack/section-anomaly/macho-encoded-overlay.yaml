defaults:
  for: [macho]
  platforms: [macos]
  crit: hostile
  conf: 0.98
  attack: T1027

composite_rules:
  - id: encoded-overlay-sparse-command-runner
    desc: Encoded overlay in sparse command runner
    all:
      - id: metadata/file/encoding/base64::large-base64-like-string
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: micro-behaviors/process/create/shell/reference::few-imports-system-reference
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section

  # Universal Mach-O slices are excluded from overlay traits. Use the
  # small high-entropy section without text for those packed command runners.
  - id: packed-sparse-command-runner
    desc: Packed entry layout in sparse command runner
    all:
      - id: metadata/file/encoding/base64::large-base64-like-string
      - id: metadata/binary/section/entropy::small-high-entropy-executable-section
      - id: micro-behaviors/process/create/shell/reference::few-imports-system-reference
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section

  - id: macho-sparse-strings-high-entropy-constants
    desc: Mach-O has sparse strings and a dominant high-entropy constants region
    crit: suspicious
    conf: 0.95
    mbc: B0028
    all:
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: metadata/binary/section/entropy::high-entropy-const-region
      - id: metadata/binary/layout/strings::sparse-sentence-strings
    any:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-quarter-round-rotations-x86-64
      - id: metadata/file/entropy::high-overall-entropy-70
    downgrade:
      scope: archive
      any:
        - id: metadata/binary/header/load-command::apple-ipa-archive-path
