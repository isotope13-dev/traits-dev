defaults:
  for: [macho]
  platforms: [macos]
  crit: hostile
  conf: 0.98
  attack: T1027

composite_rules:
  - id: encoded-overlay-sparse-command-runner
    desc: Encoded overlay in sparse command runner
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: micro-behaviors/process/create/api-system::few-imports-system-reference
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section

  - id: macho-sparse-strings-opaque-constants
    desc: Mach-O sparse strings accompany opaque constants
    crit: suspicious
    conf: 0.95
    mbc: B0028
    all:
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: metadata/binary/section/entropy::high-entropy-const-region
      - id: metadata/binary/section/prose::sparse-sentence-strings
    any:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-quarter-round-rotations-x86-64
      - id: metadata/file/entropy::high-overall-entropy-70
