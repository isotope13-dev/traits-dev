# A native program with odd section names that walks the PEB, checks for a
# debugger and names a versioned .NET Framework tool path is a loader stub
# preparing to host an embedded payload in a signed .NET executable.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1027.002
composite_rules:
  - id: random-section-loader-with-dotnet-host-tail-and-peb-access
    desc: Odd-section loader with .NET host path and PEB walk
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: micro-behaviors/fs/path/dotnet-framework::dotnet-framework-versioned-exe-tail
      - id: micro-behaviors/process/info/query::peb-access-x86
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
