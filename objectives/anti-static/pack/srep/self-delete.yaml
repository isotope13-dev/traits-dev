# SREP-packed binary that also deletes its own module path.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096

composite_rules:
  - id: srep-packer-self-delete
    desc: SREP compression utility with self-delete behavior
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/build/packer/srep::srep-compression-tool
      - id: metadata/build/packer/srep::srep-delete-flag
      - id: objectives/evasion/self-delete/file/script::module-path-delete
