# Bind the same global buffer through TEA block processing, executable page
# protection and the final JMP. The null-call stall supplies evasion context.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: stalled-tea-heap-payload
    desc: Evasive TEA loader executes decrypted heap code
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: micro-behaviors/crypto/decrypt::x86-tea-helper-decrypt
      - id: micro-behaviors/mem/protect/modify::x86-block-buffer-protect-jump
      - id: objectives/anti-analysis/timing/evasion::x86-null-call-counted-stall
      - id: micro-behaviors/mem/protect/modify::virtual-protect
