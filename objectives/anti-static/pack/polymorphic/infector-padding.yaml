defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  size_min: 32768
  size_max: 16777216

traits: []

composite_rules:
  - id: packed-pe-dictionary-padding
    desc: Packed PE with dictionary-word padding
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/complexity::recovered-functions-at-most-10
      - id: metadata/binary/section/prose::high-string-count-2000
      - id: "metadata/file/profile/string-population::few-high-entropy-strings-20"
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/

  - id: polymorphic-win32-infector-shape
    desc: Polymorphic Win32 infector structural shape
    crit: hostile
    conf: 0.93
    all:
      - id: packed-pe-dictionary-padding
      - id: objectives/privilege-escalation/token-manipulation::token-spawn-api-chain
    any:
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/communications/ipc/named-pipe::connect-named-pipe
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified

  - id: packed-pe-token-spawn-elevation
    desc: Packed PE with user-token spawn pivot
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/complexity::recovered-functions-at-most-10
      - id: objectives/privilege-escalation/token-manipulation::token-spawn-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified

  - id: packed-pe-service-install-pivot
    desc: Packed PE with service install pivot
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/complexity::recovered-functions-at-most-10
      - id: micro-behaviors/os/service/create::create-service
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: metadata/binary/installer/family/
