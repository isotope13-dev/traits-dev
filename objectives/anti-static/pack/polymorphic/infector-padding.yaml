defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  size_min: 32768
  size_max: 16777216

traits: []

composite_rules:
  - id: polymorphic-win32-infector-shape
    desc: Polymorphic Win32 infector structural shape
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/complexity::recovered-functions-at-most-10
      - id: metadata/binary/layout/strings::high-string-count-2000
      - id: metadata/binary/layout/strings::few-high-entropy-strings-20
      - id: micro-behaviors/os/privilege/token/launch::token-spawn-api-chain
    any:
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/communications/ipc/named-pipe::connect-named-pipe
    unless:
      - id: metadata/signature/verified/

  - id: packed-pe-token-spawn-elevation
    desc: Packed PE with user-token spawn pivot
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/complexity::recovered-functions-at-most-10
      - id: micro-behaviors/os/privilege/token/launch::token-spawn-api-chain
    unless:
      - id: metadata/signature/verified/

  - id: packed-pe-service-install-pivot
    desc: Packed PE with service install pivot
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/complexity::recovered-functions-at-most-10
      - id: micro-behaviors/os/service/create::create-service
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
