# Crypter stubs that pad their encrypted payload with a random-length run of
# noise bytes change the file hash, size and overlay offsets on every build,
# defeating hash and layout signatures. Builds that keep debug logging expose
# the padding as a field next to the compressed/decompressed sizes, e.g.
# "Payload: off=%ld comp=%u decomp=%u noise=%u".
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: B0032
traits:
  - id: payload-noise-padding-diagnostic
    desc: Loader logs payload sizes and noise padding
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bdecomp(ressed)?=%[ludz]{1,2}[^\n]{0,24}\bnoise=%[ludz]{1,2}'
composite_rules:
  - id: noise-padded-encrypted-overlay-stub
    desc: Exec stub with noise-padded encrypted overlay
    crit: hostile
    conf: 0.95
    all:
      - id: payload-noise-padding-diagnostic
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: metadata/binary/layout/overlay::elf-overlay-entropy-over-75
      - id: micro-behaviors/process/create/exec::syscall-execve-elf
