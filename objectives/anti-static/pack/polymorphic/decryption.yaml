defaults:
  platforms:
    - linux
    - macos
    - windows
  attack: T1027.002
  mbc: F0001
  for: [elf, macho, pe]
traits:
  - id: xor-inc-loop-x86
    desc: XOR decryption loop (x86)
    crit: suspicious
    conf: 0.85
    arch: [x86, x86-64]
    count_min: 4
    per_kb_min: 0.05
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 30 ?? 4? E2
    # Machine Thumb is not applied as an x86 arch gate. A32
    # `sub sp, sp, #0x30` is the bytes 30 D0 4D E2.
    unless:
      - type: value
        path: pe.machine
        exact: thumb
      - type: value
        path: pe.machine
        regex: '^arm'
  - id: xor-jmp-short-loop
    desc: XOR with short jump loop
    crit: suspicious
    conf: 0.8
    # `80 35 <disp32> ... EB` is an x86 instruction sequence; on other
    # architectures the same bytes are arbitrary instruction data.
    arch: [x86, x86-64]
    count_min: 4
    per_kb_min: 0.05
    size_max: 10485760
    if:
      type: hex
      section: text
      # 80 /6 is XOR. The former 80 /7 pattern was CMP and matched ordinary
      # PIC/global-state branches in coreutils such as `ln`.
      pattern: 80 35 ?? ?? ?? ?? ?? EB ??
    unless:
      - type: basename
        regex: '\.o$'
      # PE .text in an IL-only managed assembly contains arbitrary IL and
      # embedded data bytes; native instruction signatures are not valid there.
      - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: dense-xor-operations
    desc: Dense XOR operations in code
    crit: suspicious
    conf: 0.85
    count_min: 10
    per_kb_min: 15.0
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 30|31|32|33
  - id: single-byte-xor-key
    desc: Single-byte XOR decryption stub
    crit: suspicious
    conf: 0.9
    count_min: 3
    per_kb_min: 0.02
    if:
      type: hex
      section: text
      pattern: 33 06 46 E2
  - id: eor-loop-arm
    desc: EOR decryption loop (ARM64)
    crit: suspicious
    conf: 0.85
    platforms:
      - linux
      - macos
    for:
      - elf
    per_kb_min: 10.0
    count_min: 20
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 4A|CA
  - id: small-encrypted-section
    desc: Small high-entropy executable section
    crit: notable
    conf: 0.75
    entropy_min: 7.0
    if:
      type: section
      executable: true
      # 7.0+ separates packed/encrypted stubs from normal Mach-O metadata
      # sections (e.g. __init_offsets ~6.5) that are executable but not packed.
      # FairPlay marks every __TEXT section executable, so an encrypted
      # __const is metadata, not a stub.
      entropy_min: 7.0
      length_min: 128
      length_max: 2048
      # Name the stub. FairPlay marks ordinary __TEXT,__const executable, and
      # that section is metadata rather than a decrypting stub. Packer stubs
      # keep a code or packer section name.
      regex: '(?i)(^|[.,])(__text|\.text|upx[0-9]?|\.stub|\.packed)$'
composite_rules:
  - id: packed-stub-indicators
    desc: Packed stub structural indicators
    crit: component
    conf: 0.8
    any:
      - id: small-encrypted-section
      - id: metadata/binary/section/entropy::small-high-entropy-executable-section
  - id: polymorphic-decryptor
    desc: Polymorphic decryption stub
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: xor-inc-loop-x86
      - id: xor-jmp-short-loop
      - id: single-byte-xor-key
      - id: eor-loop-arm
      - id: dense-xor-operations
      - id: micro-behaviors/mem/write/arbitrary::x86-arithmetic-immediate-store
  - id: packed-with-decryption
    desc: Packed executable with runtime decryption
    crit: suspicious
    conf: 0.98
    all:
      - id: packed-stub-indicators
      - id: polymorphic-decryptor
  - id: xor-packer
    desc: Simple XOR-based packer
    crit: suspicious
    conf: 0.92
    needs: 2
    any:
      - id: xor-inc-loop-x86
      - id: single-byte-xor-key
      - id: xor-jmp-short-loop
      - id: dense-xor-operations

  - id: importless-arithmetic-entry-decoder
    for: [pe]
    desc: Importless writable-entry PE arithmetic stores or metamorphic decoder
    crit: suspicious
    conf: 0.98
    attack: T1027.002,T1140
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    any:
      - id: micro-behaviors/mem/write/arbitrary::x86-arithmetic-immediate-store
      - id: objectives/anti-static/obfuscation/instruction/junk::repeated-canceling-not-pairs
      - id: metadata/binary/section/layout::junk-code-writable-pe-layout
    unless:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: well-known/dual-use/packaging/kkrunchy::kkrunchy-rwx-packer-context

  - id: writable-payload-section-indicators
    for: [pe]
    desc: Writable code section with encrypted payload entropy
    crit: component
    conf: 0.95
    any:
      - id: metadata/binary/section/entropy::high-entropy-writable-code-section
      - id: metadata/binary/section/entropy::giant-writable-text-section

  - id: importless-arithmetic-polymorphic-crypter
    for: [pe]
    desc: Importless PE uses arithmetic entry decoder with encrypted payload
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1140
    all:
      - id: importless-arithmetic-entry-decoder
      - id: writable-payload-section-indicators
    any:
      - id: metadata/binary/header/identity::pe-no-populated-data-directories
      - id: metadata/binary/section/ratio::pe-no-executable-sections
    unless:
      - id: metadata/installer/product/
      - id: metadata/signature/verified/
      - id: well-known/dual-use/packaging/kkrunchy::kkrunchy-rwx-packer-context

