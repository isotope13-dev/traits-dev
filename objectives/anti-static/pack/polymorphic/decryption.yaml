defaults:
  platforms:
    - linux
    - macos
    - windows
  attack: T1027.002
  mbc: F0001
  for: [elf, macho, pe]
traits:
  - id: xor-inc-loop-x86
    desc: XOR decryption loop (x86)
    crit: suspicious
    conf: 0.85
    arch: [x86, x86-64]
    count_min: 4
    per_kb_min: 0.05
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 30 ?? 4? E2
  - id: xor-jmp-short-loop
    desc: XOR with short jump loop
    crit: suspicious
    conf: 0.8
    count_min: 4
    per_kb_min: 0.05
    size_max: 10485760
    if:
      type: hex
      section: text
      # 80 /6 is XOR. The former 80 /7 pattern was CMP and matched ordinary
      # PIC/global-state branches in coreutils such as `ln`.
      pattern: 80 35 ?? ?? ?? ?? ?? EB ??
    unless:
      - type: basename
        regex: '\.o$'
      - id: metadata/package/files/system-package::debian-account-tool-basename
      - id: well-known/lib/data/sqlite/
      # PE .text in an IL-only managed assembly contains arbitrary IL and
      # embedded data bytes; native instruction signatures are not valid there.
      - id: metadata/binary/framework::dotnet-assembly
  - id: dense-xor-operations
    desc: Dense XOR operations in code
    crit: suspicious
    conf: 0.85
    count_min: 10
    per_kb_min: 15.0
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 30|31|32|33
  - id: single-byte-xor-key
    desc: Single-byte XOR decryption stub
    crit: suspicious
    conf: 0.9
    count_min: 3
    per_kb_min: 0.02
    if:
      type: hex
      section: text
      pattern: 33 06 46 E2
  - id: eor-loop-arm
    desc: EOR decryption loop (ARM64)
    crit: suspicious
    conf: 0.85
    platforms:
      - linux
      - macos
    for:
      - elf
    per_kb_min: 10.0
    count_min: 20
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 4A|CA
  - id: small-encrypted-section
    desc: Small high-entropy section (encrypted stub)
    crit: suspicious
    conf: 0.75
    entropy_min: 7.0
    if:
      type: section
      executable: true
      # 7.0+ separates packed/encrypted stubs from normal Mach-O metadata
      # sections (e.g. __init_offsets ~6.5) that are executable but not packed.
      entropy_min: 7.0
      length_min: 128
      length_max: 2048
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/binary/layout::svk-packed-section
        - id: well-known/app/utility/dell-display-manager/
        - id: well-known/app/utility/portrait-displays-display-tune/
        - id: metadata/package/quality/benign-context::benign-app-fp-context
    unless:
      - id: well-known/lib/ai/onnxruntime::onnxruntime-library
  - id: unusual-entry-point-section
    desc: Entry point in non-standard section
    crit: component
    conf: 0.8
    if:
      type: section
      executable: true
      entropy_min: 6.5
      length_max: 65536
    unless:
      - type: section
        exact: .text
        executable: true
      - type: section
        exact: __text
        executable: true
      - type: section
        exact: __TEXT,__unwind_info
        executable: true
  - id: x86-arithmetic-decode-chain
    desc: Repeated x86 arithmetic decoder chain
    crit: suspicious
    conf: 0.94
    for: [pe]
    platforms: [windows]
    arch: [x86, x86-64]
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: 81 EA ?? ?? ?? ?? 81 EB ?? ?? ?? ?? 81 EA ?? ?? ?? ?? 81 C3 ?? ?? ?? ?? 81 C2 ?? ?? ?? ?? 81 C3 ?? ?? ?? ??
  - id: x86-arithmetic-decode-store
    desc: X86 decoder chain with memory store
    crit: suspicious
    conf: 0.96
    for: [pe]
    platforms: [windows]
    arch: [x86, x86-64]
    count_min: 1
    if:
      type: hex
      section: .text
      # Polymorphic builders vary ADD/SUB and the immediate constants while
      # retaining alternating arithmetic on EDX/EBX followed by a store.
      pattern: 81 (EA|C2) ?? ?? ?? ?? 81 (EB|C3) ?? ?? ?? ?? 81 (EA|C2) ?? ?? ?? ?? 81 (EB|C3) ?? ?? ?? ?? 81 (EA|C2) ?? ?? ?? ?? 81 (EB|C3) ?? ?? ?? ?? [0-192] 89 (1A|32)
composite_rules:
  - id: packed-stub-indicators
    desc: Packed stub structural indicators
    crit: component
    conf: 0.8
    any:
      - id: small-encrypted-section
      - id: unusual-entry-point-section
  - id: polymorphic-decryptor
    desc: Polymorphic decryption stub
    crit: hostile
    conf: 0.95
    needs: 2
    any:
      - id: xor-inc-loop-x86
      - id: xor-jmp-short-loop
      - id: single-byte-xor-key
      - id: eor-loop-arm
      - id: dense-xor-operations
      - id: x86-arithmetic-decode-chain
      - id: x86-arithmetic-decode-store
  - id: packed-with-decryption
    desc: Packed executable with runtime decryption
    crit: hostile
    conf: 0.98
    all:
      - id: packed-stub-indicators
      - id: polymorphic-decryptor
  - id: xor-packer
    desc: Simple XOR-based packer
    crit: hostile
    conf: 0.92
    needs: 2
    any:
      - id: xor-inc-loop-x86
      - id: single-byte-xor-key
      - id: xor-jmp-short-loop
      - id: dense-xor-operations

  - id: importless-arithmetic-entry-decoder
    desc: Importless PE with a polymorphic arithmetic entry decoder
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1140
    all:
      - id: x86-arithmetic-decode-store
      - id: metadata/binary/metrics/structural::no-imports
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: metadata/binary/layout::pe-checksum-zeroed
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
      - id: well-known/dual-use/packaging/kkrunchy::kkrunchy-rwx-packer-context
