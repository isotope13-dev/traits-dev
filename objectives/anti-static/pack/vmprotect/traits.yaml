defaults:
  platforms:
    - unix
    - windows
  for: [binaries]
  entropy_min: 6.5
traits:
  # Canonical .vmpN name atom lives in metadata/binary/section/names/; this
  # derived trait raises it to suspicious packing intent except for known
  # commercially packed products (Antidote).
  - id: section
    desc: VMProtect detected via section names
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    if:
      id: metadata/binary/section/names::vmp-section-name
    unless:
      - id: well-known/app/productivity/antidote::antidote-vmprotect-context
  - id: marker-string
    desc: VMProtect marker string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)VMProtect (begin|end|VMP)
