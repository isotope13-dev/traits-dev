# VMProtect-protected binaries whose sections were renamed/cloned away from
# `.vmpN` (e.g., `.text1`, `.rdata1`, `.data1`) combined with elevation,
# debugger checks, or an embedded VMProtectSDK runtime DLL.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002
  mbc: F0001

composite_rules:
  - id: renamed-vmprotect-elevated-anti-debug
    desc: Unsigned cloned-section PE with admin manifest and anti-debug
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1548.002,T1622
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/section/name::cloned-standard-section-names
      - id: metadata/binary/section/header::pe-entry-in-nonstandard-section
      - id: metadata/binary/section/permission::writable-rdata
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/process/debug/
      - id: micro-behaviors/os/api-resolution/digest-export/walk::peb-ldr-export-walk-x64
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product::known-installer-context

  - id: vmprotect-renamed-embedded-sdk
    desc: Unsigned cloned-section PE bundled with VMProtectSDK DLL
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [zip, pe]
    all:
      - id: well-known/lib/native/vmprotect-sdk::vmprotect-sdk-dll
      - id: metadata/binary/section/name::cloned-standard-section-names
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product::known-installer-context
