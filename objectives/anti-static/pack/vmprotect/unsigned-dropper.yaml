# Unsigned VMProtect-protected PE images with dropper/stub layout.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002

composite_rules:
  - id: unsigned-vmprotect-sparse-import-pe
    desc: Unsigned VMProtect-packed PE with sparse imports
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/section/label::vmp-section-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/symbols/count::max-30-imports
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
    unless:
      - id: well-known/app/productivity/antidote::antidote-vmprotect-context
      - id: metadata/signed/platform/
  - id: unsigned-vmprotect-elevated-dropper
    desc: Unsigned VMProtect PE with admin manifest
    crit: hostile
    conf: 0.97
    attack: T1548.002
    all:
      - id: metadata/binary/section/label::vmp-section-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/build/manifest::pe-requires-admin
      - id: metadata/file/entropy::very-high-overall-entropy-75
    unless:
      - id: well-known/app/productivity/antidote::antidote-vmprotect-context
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
