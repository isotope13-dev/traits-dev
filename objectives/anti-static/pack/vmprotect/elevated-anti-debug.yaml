defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-vmprotect-elevated-anti-debug
    desc: Unsigned VMProtect PE with admin manifest and anti-debug checks
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1622
    all:
      - id: objectives/anti-static/pack/vmprotect::unsigned-vmprotect-elevated-dropper
      - id: micro-behaviors/process/debug/
