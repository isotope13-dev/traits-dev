# A build environment assembled to produce binaries that resist analysis. The
# image itself does nothing hostile; what it installs states the intent. A
# project that pulls in a source obfuscator, an executable packer, and a
# cross-compiler for an operating system it does not run on is not building a
# product for its users -- it is building an artifact meant to survive
# inspection on someone else's machine.
#
# Each install on its own is ordinary: UPX ships in every distro and has
# legitimate size-reduction uses, and MinGW is how anyone cross-builds for
# Windows. The composite is what carries the claim.
defaults:
  platforms: [unix, windows]
  for: [dockerfile, shell, batch, powershell, github-actions]
  attack: T1027.002
  mbc: F0001

traits:
  - id: packer-package-install
    desc: Build image installs an executable packer
    crit: notable
    conf: 0.9
    if:
      # `apt install upx-ucl`, `apk add upx`. Anchored to a package-manager
      # install so a mention of the tool in prose or a filename is not read
      # as provisioning it.
      type: text
      regex: '(?im)\b(apt-get|apt|apk|yum|dnf)\b[^\n]{0,80}\bupx(-ucl)?\b'

  - id: windows-cross-compiler-install
    desc: Build image installs a Windows cross-compiler
    crit: notable
    conf: 0.9
    if:
      # `gcc-mingw-w64` / `mingw-w64` in a Linux image: this build targets
      # Windows from a host that is not Windows.
      type: text
      regex: '(?i)\b(gcc-)?mingw-w64\b'

composite_rules:
  # Obfuscate the source, then pack the result, and aim the whole thing at a
  # platform the build host is not. Each step removes something an analyst
  # would otherwise read, and together they describe an implant pipeline
  # rather than a release pipeline.
  - id: evasive-binary-build-image
    desc: Build image chains obfuscation and packing
    crit: suspicious
    conf: 0.93
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-install-hint
    any:
      - id: packer-package-install
      - id: windows-cross-compiler-install

  # A pentest distribution plus a Windows cross-compiler: the image is set up
  # to build binaries for a platform it does not run, on a base that already
  # carries the tooling to deliver them. That is a payload workshop rather
  # than a CI image for a product.
  - id: offensive-distro-cross-build-image
    desc: Pentest-distro image cross-builds for Windows
    crit: suspicious
    conf: 0.9
    all:
      - id: windows-cross-compiler-install
    any:
      - id: well-known/tool/offensive/distro::pentest-distro-base-image
      - id: well-known/tool/offensive/distro::pentest-distro-repository
      - id: well-known/tool/offensive/metasploit::container-base-image
