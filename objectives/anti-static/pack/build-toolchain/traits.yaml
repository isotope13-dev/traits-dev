defaults:
  platforms: [unix, windows]
  for: [dockerfile, shell, batch, powershell, github-actions]
  attack: T1027.002
  mbc: F0001

composite_rules:
  - id: offensive-distro-cross-build-image
    desc: Pentest-distro image cross-builds for Windows
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/build/toolchain::windows-cross-toolchain-reference
    any:
      - id: well-known/tool/offensive/distro::pentest-distro-base-image
      - id: well-known/tool/offensive/distro::pentest-distro-repository
      - id: well-known/tool/offensive/metasploit::container-base-image
