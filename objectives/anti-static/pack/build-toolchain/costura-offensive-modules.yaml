# Offensive .NET libraries packed into an executable with Fody Costura. The
# bundled assemblies are DEFLATE-compressed, so their code is invisible to a
# static scan of the outer file; only the Costura resource names give them
# away. Apollo bundles DInvokeResolver beside its Injection and
# KerberosTickets modules this way, and forks keep the module names.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009
  mbc: F0001

composite_rules:
  - id: costura-hidden-offensive-assembly
    desc: Costura hides DInvoke or a GhostPack/SharpSploit assembly in the executable
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
    any:
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-dinvoke
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-ghostpack-credential-tool
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-offensive-library

  - id: costura-hidden-dinvoke-post-exploitation-bundle
    desc: Costura hides DInvoke beside injection, Kerberos or credential modules
    crit: hostile
    conf: 0.95
    attack: T1027.009,T1055,T1558
    all:
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-dinvoke
    any:
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-injection-module
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-kerberos-tickets-module
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-ghostpack-credential-tool
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundled-offensive-library
