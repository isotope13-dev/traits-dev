# Enigma Protector leaves its own section names (.enigma1, .enigma2) in the
# image unless the operator renames them. Protecting a binary is what the
# product is sold for, so the section names alone are only a packer marker.
# A vendor installer that arrives re-wrapped by it and unsigned is different:
# the vendor's signature is what let the installer be trusted, and the wrapper
# is how the bytes inside stop being checkable.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: F0001

traits:
  - id: enigma-protector-section-names
    desc: Enigma Protector section names
    crit: notable
    conf: 0.97
    if:
      type: section
      regex: '(?i)^\.enigma[0-9]'

composite_rules:
  - id: unsigned-omaha-installer-under-enigma-protector
    desc: Unsigned Omaha installer wrapped by Enigma
    crit: hostile
    conf: 0.9
    all:
      - id: well-known/app/system/google-update::omaha-tag-magic-constant
      - id: enigma-protector-section-names
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
