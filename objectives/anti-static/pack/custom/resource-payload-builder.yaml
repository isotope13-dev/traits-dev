# Crypter builder that packs a stub by writing named PE resources into it:
# the loader/injector routine ("RUNPE"), the encrypted payload, and the key
# and IV the stub needs to decrypt it. The stub later reads them back with
# FindResource/LoadResource. Matched on the resource-name argument of the
# builder's resource-writing helper.
defaults:
  platforms: [windows]
  for: [vbs, csharp]
  attack: T1027.002

traits:
  - id: runpe-resource-name-write
    desc: Writes a resource named RunPE
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\w*Resource\w*\([^\r\n()]{0,40}"Run_?PE"'
  - id: payload-resource-name-write
    desc: Writes a resource named Payload
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\w*Resource\w*\([^\r\n()]{0,40}"Payload"'
  - id: key-iv-resource-name-write
    desc: Writes resources named Key or IV
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\w*Resource\w*\([^\r\n()]{0,40}"(Key|IV)"'

composite_rules:
  - id: runpe-payload-key-resource-builder
    desc: Builder embeds RunPE, payload and key resources
    crit: hostile
    for: [vbs]
    conf: 0.96
    all:
      - id: micro-behaviors/fs/write/file/resource::vb6-update-resource-reference
      - id: runpe-resource-name-write
      - id: payload-resource-name-write
      - id: key-iv-resource-name-write
