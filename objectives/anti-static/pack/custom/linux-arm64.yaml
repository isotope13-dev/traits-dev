defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: arm64-compressed-self-exec-loader
    desc: Compressed ARM64 loader with self-path and process replacement
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    all:
      - id: micro-behaviors/data/decompress/lzma::arm64-sized-buffer-decode-setup
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/process/replace::syscall-execve-elf
