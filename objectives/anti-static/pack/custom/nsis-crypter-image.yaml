# NSIS keeps its script compressed in the overlay and its entry point in
# .text. An NSIS stub whose entry point sits in the zero-filled .ndata section
# and whose script strings are readable in .data is a rebuilt crypter image:
# the loader script is exposed while the payload area has been blanked.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: nsis-entry-in-ndata-section
    desc: PE entry point inside the .ndata section
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.entry_section
      exact: .ndata

  - id: nsis-script-system-dll-path-data
    desc: NSIS script System.dll path readable in data
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: \System.dll
      section: .data

composite_rules:
  - id: nsis-crypter-script-image
    desc: NSIS stub with .ndata entry point and exposed loader script
    crit: hostile
    conf: 0.9
    attack: T1027.002,T1140
    all:
      - id: metadata/installer/builder/nsis::nsis-error-title
      - id: objectives/anti-static/pack/custom::nsis-entry-in-ndata-section
      - id: objectives/anti-static/pack/custom::nsis-script-system-dll-path-data
