defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1140

composite_rules:
  # The .packed unpack target, entry in a writable section and a payload that
  # is pulled out of the image's own resources: a protector stub that unpacks
  # and runs an embedded program rather than an application using resources.
  - id: packed-section-resource-extraction-loader
    desc: Packed-section loader that extracts resource payloads
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/section/permission::packed-writable-executable-section
      - id: metadata/binary/section/header::writable-entry-with-wx-section
      - id: metadata/binary/layout/overlay::writable-entry-high-entropy-overlay
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    unless:
      - id: metadata/signed/platform/
