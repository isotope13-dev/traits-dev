# UPX0/UPX1 section names on an image whose contents were never compressed.
#
# The names are load-bearing for tooling, not for Windows: nothing in the loader
# cares what a section is called, but a great deal of triage automation branches
# on "if it looks like UPX, unpack it and analyse the result". Wearing the names
# without the compression sends that path to `upx -d`, which refuses the file
# (NotPackedException), and an analyst who reads that as "packer failed" moves
# on without looking at the code -- which is sitting there in plain text.
#
# Real UPX leaves its packed payload in UPX1 at an entropy close to 8; the
# absence of any high-entropy executable section is what separates the imitation
# from the genuine article. Suspicious rather than hostile on its own: the
# observation is a layout lie, and the intent comes from what the file does with
# the cover it buys.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036
  mbc: F0001

composite_rules:
  - id: upx-named-sections-uncompressed
    desc: UPX section names without compressed content
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/section/names::upx-section-pair
    unless:
      # A genuinely UPX-packed image: the compressed payload pushes the
      # entropy of UPX1 -- the section UPX actually writes it to -- up near 8.
      #
      # The guard has to name UPX1 specifically. The generic
      # high-entropy-exec-section atom below matches on section NAME
      # (.text/.code/__text/CODE), and a real UPX image has none of those: UPX
      # renames the code section to UPX1. Relying on it alone inverted the rule,
      # firing "UPX names without compressed content" on every honestly packed
      # binary in the corpus. Both are kept -- the generic one still covers
      # hybrids that retain a packed .text alongside the UPX pair.
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
      - id: metadata/binary/section/metrics::high-entropy-exec-section
