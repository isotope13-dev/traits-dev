---
defaults:
  platforms:
  - android
  crit: suspicious
composite_rules:
- for:
  - apk
  - zip
  id: apk-member-table-client-store-clues
  desc: APK member anomalies and client-store clues
  conf: 0.97
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: objectives/anti-static/pack/archive::apk-obfuscated-member-table-payload
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-client-bks-asset
  - id: metadata/package/files/android-assets::apk-client-p12-asset
- for:
  - android_apk
  - zip
  - class
  id: apk-encrypted-member-http-bytecode-clues
  desc: APK encrypted-member and HTTP bytecode clues
  conf: 0.98
  all:
  - id: metadata/archive/encryption::apk-declared-encryption-executable-clues
  - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
- for:
  - apk
  - zip
  - java
  - kotlin
  - xml
  - dex
  id: apk-empty-dex-drawable-permission-clues
  desc: APK empty DEX, drawable and permission clues
  conf: 0.94
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: objectives/anti-static/pack/archive::apk-empty-primary-dex-member
  - id: metadata/package/files/android-assets::apk-drawable-png-asset
  any:
  - id: metadata/permission/management::android-install-packages-permission-reference
  - id: metadata/permission/management::android-delete-packages-permission-reference
  - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
  - id: micro-behaviors/os/message/intent::android-boot-completed-reference
- for:
  - android_apk
  id: apk-short-resource-numeric-asset-clues
  desc: APK short resource and numeric asset clues
  conf: 0.95
  any:
  - id: metadata/package/files/android-assets::apk-numeric-asset-filename
  - id: metadata/package/files/android-assets::apk-eight-hex-hyphen-asset-names
  all:
  - id: objectives/anti-static/pack/archive::apk-obfuscated-resource-pack
