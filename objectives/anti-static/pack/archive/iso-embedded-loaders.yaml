defaults:
  crit: hostile
  platforms: [unix, windows]
  # Standalone ISO-9660 images arrive as Unknown because cleave does not
  # descend them as archive members.  The referenced atoms are ISO-anchored.
  for: [iso]
  attack: T1027,T1204.002

composite_rules:
  - id: iso-dotnet-telegram-impersonator
    for: [iso, data]
    desc: ISO .NET Telegram impersonator with network and crypto
    conf: 0.99
    attack: T1036,T1027.009,T1071.001
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::embedded-telegram-product-claim
      - id: metadata/file/format/iso/structure::embedded-telegram-company-claim
      - id: metadata/file/format/managed-runtime::embedded-dotnet-runtime-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
      - id: metadata/file/format/managed-runtime::embedded-dotnet-network-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-crypto-marker

  - id: iso-nsis-order-pdf-packed-loader
    for: [iso, data]
    desc: ISO NSIS PDF.EXE MotW delivery wrapper
    conf: 0.99
    attack: T1036.005,T1027,T1204.002
    # Pool PVD/member markers across the image when members are also scanned
    # as separate leaves; MotW wrappers keep all bytes in one carrier too.
    scope: outer
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-pdf-exe-member
      - id: metadata/file/format/iso/structure::embedded-nsis-marker

  - id: iso-dotnet-pdf-reflective-lure
    for: [iso, data]
    desc: ISO PDF-looking .NET reflective loader
    conf: 0.98
    attack: T1036.005,T1027,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-pdf-exe-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-runtime-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker

  - id: iso-packed-loader-smart-screen-lure
    for: [iso, data]
    desc: ISO carries a packed Windows loader with SmartScreen bypass guidance
    conf: 0.99
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::embedded-themida-section
      - id: metadata/file/format/iso/structure::embedded-boot-section
      - id: metadata/file/format/iso/payload::iso-smart-screen-message
      - id: metadata/file/format/iso/payload::iso-run-anyway-guidance

  - id: iso-dotnet-com-reflective-lure
    for: [iso, data]
    desc: ISO .COM-named .NET reflective executable lure
    conf: 0.98
    attack: T1036.005,T1027.009,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-document-com-lure
      - id: metadata/file/format/managed-runtime::embedded-dotnet-metadata-signature
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
