defaults:
  platforms: [unix, windows]
  # ISO-9660 images are currently surfaced as opaque/unknown files. The
  # composites below therefore use the engine's universal fallback tier.
  for: [all]
  attack: T1027,T1204.002

composite_rules:
  - id: iso-dotnet-telegram-impersonator
    desc: ISO .NET Telegram impersonator with network and crypto
    crit: hostile
    conf: 0.99
    attack: T1036,T1027.009,T1071.001
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-telegram-product-claim
      - id: metadata/file/format/structured::embedded-telegram-company-claim
      - id: metadata/file/format/structured::embedded-dotnet-runtime-marker
      - id: metadata/file/format/structured::embedded-dotnet-resource-loader
      - id: metadata/file/format/structured::embedded-dotnet-network-marker
      - id: metadata/file/format/structured::embedded-dotnet-crypto-marker

  - id: iso-nsis-order-pdf-packed-loader
    desc: ISO NSIS order/PDF lure with high-entropy executable content
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-order-pdf-exe-lure
      - id: metadata/file/format/structured::embedded-nsis-marker

  - id: iso-packed-loader-smart-screen-lure
    desc: ISO carries a packed Windows loader with SmartScreen bypass guidance
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-themida-section
      - id: metadata/file/format/structured::embedded-boot-section
      - id: metadata/file/format/structured::embedded-smart-screen-guidance
