defaults:
  platforms: [unix, windows]
  # ISO-9660 images are currently surfaced as opaque/unknown files.  The
  # referenced atoms use the ISO descriptor marker and format/content markers,
  # so these composites must also be eligible for that file type.
  for: [all]
  attack: T1027,T1204.002

composite_rules:
  - id: iso-packed-loader-smart-screen-lure
    desc: ISO carries a packed Windows loader with SmartScreen bypass guidance
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format::primary-volume-descriptor
      - id: metadata/file/format::embedded-themida-section
      - id: metadata/file/format::embedded-smart-screen-guidance

  - id: iso-packed-admin-loader
    desc: ISO carries a packed administrator-requesting executable
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format::primary-volume-descriptor
      - id: metadata/file/format::embedded-themida-section
      - id: metadata/file/format::embedded-admin-manifest-marker
