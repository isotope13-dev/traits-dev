# A password-encrypted archive combines an executable member with a retained
# temporary filesystem path. The layout conceals a staged executable and
# exposes a build-time path instead of a normal distribution layout.
defaults:
  platforms: [unix, windows]
  for: [zip]
  attack: T1027.013,T1195.001
  mbc: B0024

composite_rules:
  - id: encrypted-executable-temp-path
    desc: Encrypted archive has executable temp path
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/archive/encryption::archive-encrypted-member-cluster
      - id: metadata/archive/layout::archive-misplaced-executable-member
      - id: metadata/archive/member/path::temporary-filesystem-path-member
