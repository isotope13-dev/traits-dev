# Password-protected package archives can conceal the code selected by the
# package manifest.  Encryption is only suspicious when an executable
# package entrypoint is present; the archive mechanic remains observable.
defaults:
  platforms: [unix, windows]
  attack: T1027.013
  mbc: B0024

composite_rules:
  - id: encrypted-package-entrypoint
    desc: Encrypted package archive carries an entrypoint
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
    any:
      - id: metadata/package/manifest/entrypoint::main-root-javascript-entry
      - id: metadata/package/manifest/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/scripts/entrypoint::wheel-console-entrypoint
      - id: metadata/package/manifest/entrypoint::bin-field-declared
      - id: metadata/package/manifest/entrypoint::has-side-effects
      - id: metadata/package/files/included::setup-py-basename
