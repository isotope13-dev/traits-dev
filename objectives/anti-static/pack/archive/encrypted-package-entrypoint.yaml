# Password-protected package archives can conceal the code selected by the
# package manifest.  Encryption is only suspicious when an executable
# package entrypoint is present; the archive mechanic remains observable.
defaults:
  platforms: [unix, windows]
  attack: T1027.013
  mbc: B0024

composite_rules:
  - id: encrypted-package-entrypoint
    desc: Encrypted package archive carries an entrypoint
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
    any:
      - id: metadata/package/manifest/entrypoint::main-root-javascript-entry
      - id: metadata/package/manifest/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/scripts/entrypoint::wheel-console-entrypoint
      - id: metadata/package/manifest/entrypoint::bin-field-declared
      - id: metadata/package/manifest/entrypoint::has-side-effects
      - id: metadata/package/files/included::setup-py-basename

  - id: encrypted-package-manifest
    desc: Encrypted package manifest conceals metadata
    crit: suspicious
    conf: 0.88
    scope: archive
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/package/files/included::npm-package-manifest-member
    any:
      - id: micro-behaviors/data/archive/zip::zipcrypto-few-encrypted-entries
      - id: micro-behaviors/data/archive/zip::zipcrypto-many-encrypted-entries

  - id: encrypted-wheel-metadata
    desc: Encrypted wheel metadata conceals runtime package
    crit: suspicious
    conf: 0.88
    scope: archive
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/package/manifest/ecosystem::python-package-metadata-member
    any:
      - id: metadata/package/files/wheel-sdist::wheel-python-code-member
      - id: metadata/package/files/wheel-sdist::wheel-native-code-member

  - id: encrypted-agent-skill-manifest
    desc: Encrypted agent skill conceals instructions
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/package/config::agent-skill-frontmatter
      - id: well-known/app/ai/knowledge/agent-skills::skill-definition-file

  - id: encrypted-wheel-metadata-only
    desc: Encrypted metadata-only wheel conceals package contents
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/package/manifest/ecosystem::python-package-metadata-member
      - id: metadata/package/files/wheel-sdist::wheel-metadata-only
      - id: metadata/package/files/archive-member::temporary-filesystem-path-member
