defaults:
  platforms:
  - android
  for:
  - apk
  attack: T1406
  mbc: B0024
traits:
- id: encrypted-classes-dex
  desc: APK encrypts classes.dex inside ZIP container
  crit: suspicious
  conf: 0.97
  if:
    type: hex
    pattern: 50 4B 03 04 00 00 01 00 08 00 [16] 0B 00 00 00 63 6C 61 73 73 65 73 2E 64 65 78
- id: encrypted-android-manifest
  desc: crypto android manifest
  crit: suspicious
  conf: 0.97
  if:
    type: hex
    pattern: 50 4B 03 04 00 00 01 00 08 00 [16] 13 00 00 00 41 6E 64 72 6F 69 64 4D 61 6E 69 66 65 73
      74 2E 78 6D 6C
- id: encrypted-libsys-core
  desc: APK encrypts libsys_core native runtime
  crit: suspicious
  conf: 0.96
  if:
    type: hex
    pattern: 50 4B 03 04 00 00 01 00 08 00 [16] 1D 00 00 00 6C 69 62 2F [6] 2F 6C 69 62 73 79 73 5F 63
      6F 72 65 2E 73 6F
- id: apk-extreme-member-name-length
  desc: APK extreme archive member name
  crit: notable
  conf: 0.94
  if:
    type: metrics
    field: archive.max_filename_length
    min: 1024
- id: apk-heavy-path-traversal
  desc: APK has many path-traversal members
  crit: suspicious
  conf: 0.98
  if:
    type: metrics
    field: archive.path_traversal_count
    min: 20
- id: apk-rtlo-member-name
  desc: Archive has RTLO member name
  crit: suspicious
  conf: 0.94
  platforms:
  - android
  - windows
  for:
  - android_apk
  - zip
  - rar
  - 7z
  - tar
  if:
    type: metrics
    field: archive.rtlo_filename_count
    min: 1
- id: apk-unicode-member-cluster
  desc: APK has Unicode member cluster
  crit: notable
  conf: 0.88
  if:
    type: metrics
    field: archive.unicode_filename_count
    min: 100
- id: fake-encrypted-plaintext-dex-member
  desc: Flagged-encrypted member stores plaintext DEX
  crit: suspicious
  conf: 0.96
  if:
    type: hex
    pattern: 50 4B 03 04 ?? 00 01 ?? 00 00 [16] ?? ?? ?? ?? [0-256] 64 65 78 0A
- id: fake-encrypted-plaintext-axml-member
  desc: Flagged-encrypted member stores plaintext AXML
  crit: suspicious
  conf: 0.96
  if:
    type: hex
    pattern: 50 4B 03 04 ?? 00 01 ?? 00 00 [16] ?? ?? ?? ?? [0-256] 03 00 08 00
- id: fake-encrypted-plaintext-arsc-member
  desc: Flagged-encrypted member stores plaintext ARSC
  crit: suspicious
  conf: 0.96
  if:
    type: hex
    pattern: 50 4B 03 04 ?? 00 01 ?? 00 00 [16] ?? ?? ?? ?? [0-256] 02 00 0C 00
- id: apk-empty-primary-dex-member
  desc: APK primary DEX member is empty
  crit: notable
  conf: 0.9
  if:
    type: raw
    regex: classes\.dex\x03\x00PK
- id: apk-resource-table-pseudo-member-cluster
  desc: APK resource table pseudo-member cluster
  crit: notable
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: ^resources\.arsc/[A-Za-z0-9]{12,20}\.(xml|png|jpe?g|webp)$
- id: apk-dummy-filler-member
  desc: APK dummy filler member
  crit: notable
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: ^dummy[0-9]{5,}$
composite_rules:
- id: fake-encrypted-plaintext-member
  desc: Fake-encrypted member stores plaintext content
  crit: suspicious
  conf: 0.97
  any:
  - id: fake-encrypted-plaintext-dex-member
  - id: fake-encrypted-plaintext-axml-member
  - id: fake-encrypted-plaintext-arsc-member
- id: apk-fake-encrypted-payload
  desc: APK carries fake-encrypted plaintext member
  crit: hostile
  conf: 0.97
  attack: T1027
  all:
  - id: fake-encrypted-plaintext-member
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
- id: encrypted-apk-core
  desc: APK encrypts both manifest and DEX in the ZIP container
  crit: suspicious
  conf: 0.985
  all:
  - id: encrypted-classes-dex
  - id: encrypted-android-manifest
- id: testkey-excessive-multidex-apk
  desc: Testkey-signed APK with excessive secondary DEX layout
  crit: suspicious
  conf: 0.92
  for:
  - android_apk
  - zip
  all:
  - id: metadata/signed/platform::android-debug-testkey-signature
  - id: metadata/package/files/mobile-package::apk-multiple-secondary-dex
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
- id: opaque-encrypted-apk-member-name-obfuscation
  desc: APK combines encrypted payload storage with extreme member-name obfuscation
  crit: suspicious
  conf: 0.96
  platforms:
  - android
  - linux
  - windows
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - apk
  - alpine_apk
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/file/entropy::high-entropy-archive
  - id: apk-extreme-member-name-length
  - id: metadata/archive/encryption::archive-encrypted-member
- id: encrypted-apk-member-cluster
  desc: APK archive has encrypted member cluster
  crit: suspicious
  conf: 0.94
  for:
  - android_apk
  - zip
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/archive/encryption::archive-encrypted-member-cluster
- id: apk-unicode-extreme-member-table
  desc: APK hides members with long Unicode names
  crit: hostile
  conf: 0.96
  for:
  - android_apk
  - apk
  - zip
  all:
  - id: metadata/archive/layout::archive-at-least-500-members
  - id: apk-unicode-member-cluster
  - id: apk-extreme-member-name-length
- id: apk-unknown-method-name-obfuscation
  desc: Unknown ZIP method hides extreme member names
  crit: hostile
  conf: 0.96
  for:
  - android_apk
  - apk
  - zip
  all:
  - id: metadata/archive/compression::archive-unknown-compression-method
  - id: apk-extreme-member-name-length
  - id: apk-unicode-member-cluster
- id: apk-unknown-compression-encrypted-container
  desc: APK combines unknown ZIP compression with encrypted members
  crit: hostile
  conf: 0.985
  for:
  - android_apk
  - apk
  - zip
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/archive/compression::archive-unknown-compression-method
  - id: metadata/archive/encryption::archive-encrypted-member
- id: apk-obfuscated-socket-packer
  desc: Name-obfuscated APK still opens a socket
  crit: hostile
  conf: 0.95
  scope: outer
  for:
  - android_apk
  - apk
  - zip
  - dex
  all:
  - id: apk-extreme-member-name-length
  - id: apk-unicode-member-cluster
  - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
- id: encrypted-apk-native-payload-anomaly
  desc: APK packs encrypted DEX/native payloads with archive integrity anomalies
  crit: hostile
  conf: 0.985
  for:
  - zip
  - apk
  any:
  - id: metadata/archive/layout::archive-misplaced-executable-member
  - id: metadata/package/files/mobile-package::apk-misplaced-executable-member
  all:
  - id: encrypted-apk-member-cluster
  - id: metadata/archive/layout::archive-executable-member-cluster
- id: apk-obfuscated-member-table-payload
  desc: APK hides payload in obfuscated archive member table
  crit: hostile
  conf: 0.975
  for:
  - zip
  - apk
  any:
  - id: metadata/archive/layout::archive-misplaced-executable-member
  - id: metadata/package/files/mobile-package::apk-misplaced-executable-member
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/layout::archive-at-least-500-members
  - id: apk-rtlo-member-name
  - id: apk-unicode-member-cluster
  - id: apk-extreme-member-name-length
- id: apk-unicode-nested-archive-packer
  for:
  - android_apk
  - zip
  - odf
  desc: APK hides nested payload behind Unicode archive names
  crit: suspicious
  conf: 0.96
  all:
  - id: apk-unicode-member-cluster
  - id: metadata/package/files/mobile-package::archive-android-apk-member
- id: apk-path-poisoned-payload-table
  desc: APK path poisoning with misplaced payload content
  crit: hostile
  conf: 0.99
  for:
  - zip
  - apk
  any:
  - id: metadata/archive/layout::archive-misplaced-executable-member
  - id: metadata/package/files/mobile-package::apk-misplaced-executable-member
  all:
  - id: apk-heavy-path-traversal
  - id: metadata/archive/layout::archive-at-least-500-members
- id: apk-empty-dex-obfuscated-resource-table
  desc: APK uses empty DEX with obfuscated resource table
  crit: suspicious
  conf: 0.95
  for:
  - android_apk
  - zip
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: apk-empty-primary-dex-member
  - id: apk-resource-table-pseudo-member-cluster
- id: apk-empty-dex-compression-resource-packer
  desc: APK empty DEX resource compression packer
  crit: hostile
  conf: 0.97
  for:
  - android_apk
  - zip
  all:
  - id: apk-empty-dex-obfuscated-resource-table
  - id: metadata/archive/compression::archive-high-compression-expansion
- id: apk-high-compression-packer
  desc: APK archive has extreme compression expansion
  crit: suspicious
  conf: 0.94
  for:
  - android_apk
  - zip
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/archive/compression::archive-high-compression-expansion
  - id: metadata/archive/compression::archive-high-overall-compression-expansion
- id: apk-dummy-filler-compression-packer
  desc: APK dummy filler compression packer
  crit: hostile
  conf: 0.96
  for:
  - android_apk
  - zip
  all:
  - id: apk-high-compression-packer
  - id: apk-dummy-filler-member
- id: apk-dummy-filler-archive-packer
  desc: APK dummy filler archive packer
  crit: hostile
  conf: 0.95
  for:
  - android_apk
  - zip
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: apk-dummy-filler-member
- id: apk-resource-pseudo-dummy-packer
  desc: APK resource pseudo-member dummy packer
  crit: hostile
  conf: 0.96
  for:
  - android_apk
  - zip
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: apk-resource-table-pseudo-member-cluster
  - id: apk-dummy-filler-member
- id: xapk-random-cleaner-split-carrier
  desc: XAPK randomized cleaner split package carrier
  crit: suspicious
  conf: 0.94
  for:
  - android_apk
  - zip
  all:
  - id: objectives/evasion/masquerade/identity/app::xapk-random-cleaner-package-name
  - id: metadata/archive/layout::archive-several-nested-archives
  - id: metadata/package/files/mobile-package::archive-android-config-split-apk
  - id: metadata/package/files/mobile-package::archive-android-apk-member
- id: apk-obfuscated-resource-pack
  for:
  - android_apk
  desc: APK resource table uses dense short-name obfuscation
  crit: suspicious
  conf: 0.95
  attack: T1027.002
  all:
  - id: metadata/package/files/mobile-package::apk-obfuscated-resource-names
  - id: metadata/package/files/mobile-package::apk-obfuscated-ninepatch-names
- id: apk-firebase-hex-obfuscated-asset
  for:
  - android_apk
  desc: APK combines Firebase modules with obfuscated resources
  crit: suspicious
  conf: 0.99
  attack: T1027
  all:
  - id: objectives/anti-static/pack/archive::apk-obfuscated-resource-pack
  - id: metadata/package/files/mobile-package::apk-hex-asset-filename
  - id: metadata/package/files/mobile-package::apk-firebase-messaging-module
  - id: metadata/package/files/mobile-package::apk-retrofit-module
