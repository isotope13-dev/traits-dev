defaults:
  platforms: [windows]
  for: [rar]
  conf: 0.88

composite_rules:
  # A password hides the executable from scanners while the protector SDK DLL
  # beside it shows it is a protected binary: the delivery shape of game-cheat
  # loaders that stage a driver and a service. Legitimate protected software
  # is not normally shipped as an encrypted RAR with its runtime DLL.
- id: rar-encrypted-vmprotect-executable
  desc: Encrypted RAR with executable and VMProtect SDK DLL
  crit: hostile
  scope: archive
  all:
    - id: metadata/archive/encryption::archive-encrypted-member
    - id: metadata/archive/member/extension::archive-windows-executable-entry
    - id: metadata/archive/member/filename/role::archive-vmprotect-sdk-member
