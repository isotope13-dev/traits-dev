defaults:
  platforms: [windows, linux, macos, unix]
  for: [data, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa, bz2]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: bzip2-packed-payload-container
    desc: Bzip2 carries packed payload
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [data, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, pe, apk, alpine_apk, ipa, bz2]
    all:
      - id: metadata/file/magic/identity::bzip2
    any:
      - id: objectives/anti-static/pack/runtime::dotnet-packed-loader
      - id: objectives/anti-static/pack/section-anomaly::packed-pe-temp-shell-stager
      - id: objectives/anti-static/pack/section-anomaly::tiny-executable-obfuscation-section
      - id: objectives/command-and-control/dropper/staging/memory::stego-bitmap-minimal-import-packed-stub
      - id: objectives/anti-static/obfuscation/payload/resource::assemblyresolve-resource-writealltext
      - id: objectives/command-and-control/dropper/execution/installer::nsis-system-overlay-shell-stager
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-hidden-run
  - id: bzip2-hashed-exe-stage
    desc: Bzip2 stages a hash-named executable
    crit: hostile
    conf: 0.96
    for: [bz2, tar, pe]
    all:
      - id: metadata/build/archive::archive-hashed-exe-member
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: bzip2-lure-exe-stage
    desc: Bzip2 stages a business-lure executable
    crit: hostile
    conf: 0.96
    for: [bz2, tar, pe]
    all:
      - id: metadata/build/archive::archive-business-lure-exe-member
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
