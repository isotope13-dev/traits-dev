# Parser-evading ZIP chains (GootLoader-style delivery, 2025+).
#
# The carrier concatenates hundreds of complete single-member ZIPs and ends
# with a damaged or split-volume EOCD record. Windows Explorer extracts the
# member from the final records; most libraries, scanners and sandboxes
# reject the file as truncated or multi-part and analyze nothing. No archiver
# or packaging tool emits this structure.
defaults:
  platforms: [windows]
  for: [zip]
  crit: hostile
  conf: 0.95
  attack: T1027,T1140
  mbc: B0024

composite_rules:
  - id: zip-chain-with-malformed-final-eocd
    desc: Chain of single-member ZIPs ends in a malformed EOCD that breaks standard parsers
    all:
      - id: metadata/archive/parsing::zip-single-member-archive-chain
      - id: metadata/archive/parsing::zip-final-eocd-malformed

  - id: unparseable-zip-chain
    desc: Chain of single-member ZIPs that the archive parser cannot open
    all:
      - id: metadata/archive/parsing::zip-single-member-archive-chain
      - id: metadata/archive/parsing::archive-parser-errors-present
    unless:
      - type: metrics
        field: archive.member_count
        min: 1

  - id: zip-chain-with-overrunning-local-sizes
    desc: Chain of single-member ZIPs whose local headers declare overlapping sizes
    all:
      - id: metadata/archive/parsing::zip-single-member-archive-chain
      - id: metadata/archive/parsing::zip-local-sizes-overrun-next-header
