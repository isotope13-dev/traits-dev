# Encrypted APK core, obfuscated resource names and native/asset layout.
defaults:
  platforms:
  - android
  for:
  - android_apk
  mbc: B0024
  attack: T1027.002
composite_rules:
- id: apk-encrypted-core-obfuscated-resource-assets
  desc: Encrypted APK core with obfuscated assets
  crit: suspicious
  conf: 0.995
  all:
  - id: objectives/anti-static/pack/archive::encrypted-apk-core
  - id: metadata/package/files/android-assets::apk-hex-hyphen-assets-metadata-dat
  - id: objectives/anti-static/pack/archive::apk-obfuscated-resource-pack
  - id: metadata/package/files/mobile-package::apk-libsys-core-runtime
