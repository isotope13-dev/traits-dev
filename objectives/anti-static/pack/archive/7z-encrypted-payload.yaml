# Password-protected 7z archives are common in software distribution, so
# encryption alone remains a notable capability. Hostile rules require an
# executable member plus concealment/expansion signals.
# Format identity uses metadata/build/archive::archive-7z-container (not a
# local objectives atom) so benign/does-nothing 7z fixtures stay clean.
defaults:
  platforms: [unix, windows]
  for: [7z]
  attack: T1027
  mbc: B0024

composite_rules:
  - id: high-entropy-7z-executable-payload
    desc: High-entropy 7zAES archive carries executable member
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/file/metrics::near-maximum-entropy-file
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: micro-behaviors/data/archive/7z::7z-aes-codec

  - id: oversized-7z-executable-payload
    desc: 7z archive carries an oversized executable member
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/build/archive::archive-large-member-entry
      - id: metadata/build/archive::archive-windows-executable-entry
    unless:
      # Electron distribution archives routinely pair a very large app.asar
      # with unpacked helper executables; that layout is not by itself a
      # concealed oversized payload.
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception

  - id: encrypted-7z-executable-payload
    desc: Encrypted 7z archive carries an executable member
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/7z::7z-encrypted-entry
      - id: metadata/build/archive::archive-windows-executable-entry

  - id: extreme-expansion-7z-executable-payload
    desc: Extreme-expansion 7z archive carries an executable member
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/archive/7z::7z-extreme-expansion-ratio
      - id: metadata/build/archive::archive-windows-executable-entry

  - id: aes-encrypted-oversized-7z-exe
    desc: 7zAES archive with oversized high-entropy executable
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1204.002
    all:
      - id: micro-behaviors/data/archive/7z::7z-aes-codec
      - id: metadata/file/metrics::near-maximum-entropy-file
      - id: metadata/build/archive::archive-large-member-entry
      - id: metadata/build/archive::archive-windows-executable-entry

  # Encrypted headers hide archive.members[*], and near-maximum-entropy is
  # size-gated at 256KB — small AES 7z droppers still nest a UPX PE that deep
  # analysis sees as a child. scope: outer joins the codec with that PE layout.
  - id: aes-encrypted-7z-nested-upx-pe
    desc: 7zAES archive nests an UPX-packed Windows PE
    crit: suspicious
    conf: 0.94
    attack: T1027.002,T1204.002
    scope: outer
    all:
      - id: micro-behaviors/data/archive/7z::7z-aes-codec
      - id: metadata/binary/section/names::empty-rwx-upx0

  - id: aes-encrypted-7z-nested-unsigned-pe
    desc: 7zAES archive nests an unsigned Windows PE
    crit: suspicious
    conf: 0.9
    attack: T1027.002,T1204.002
    scope: outer
    all:
      - id: micro-behaviors/data/archive/7z::7z-aes-codec
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
