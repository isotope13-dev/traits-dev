# Password-protected 7z archives are common in software distribution, so
# encryption alone remains a notable capability. Hostile rules require an
# executable member plus concealment/expansion signals.
# Format identity uses metadata/build/archive::archive-7z-container (not a
# local objectives atom) so benign/does-nothing 7z fixtures stay clean.
defaults:
  platforms: [unix, windows]
  for: [7z]
  attack: T1027
  mbc: B0024

composite_rules:
  - id: high-entropy-7z-executable-payload
    desc: High-entropy 7zAES archive carries executable member
    crit: suspicious
    conf: 0.95
    # Keep the codec, entropy, and member evidence on the same analyzed 7z
    # leaf.  A source archive can legitimately contain an AES test fixture and
    # unrelated executable fixtures elsewhere in the outer package.
    scope: leaf
    all:
      - id: metadata/file/data-blob::near-maximum-entropy-file
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: micro-behaviors/data/archive/7z::7z-aes-codec

  - id: oversized-7z-executable-payload
    for: [source, scripts, '!jcl', dmg, elf, json, markdown, npm, package.json, pkg_macos, plist, 7z, tar, text, vsix, zip]
    desc: 7z archive combines oversized and executable members
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/build/archive::archive-large-member-entry
      - id: metadata/build/archive::archive-windows-executable-entry
    unless:
      # Electron distribution archives routinely pair a very large app.asar
      # with unpacked helper executables; that layout is not by itself a
      # concealed oversized payload.
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: well-known/app/ai/media/comfyui::comfyui-portable-archive-context
      - id: well-known/app/ai/gateway/textgen::textgen-portable-archive-context
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::package-identity

  # Renamed from `encrypted-7z-executable-payload`. Its evidence is the
  # container-agnostic encrypted-member metric, so naming the rule for 7z made
  # it report "7z archive" about any password-protected container -- a ZIP with
  # an executable member included.
  - id: encrypted-archive-executable-payload
    for: [7z, zip, python, gz]
    desc: Encrypted archive carries an executable member
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/build/archive::archive-windows-executable-entry
    unless:
      - id: well-known/game/doom-ascii::pip-doom-distribution-context
      - id: well-known/game/doom-ascii::pip-doom-archive-basename

  # A remote-admin client is dual-use: the same NetSupport build is a licensed
  # helpdesk agent and a commodity RAT, so its layout alone stays `notable` in
  # `well-known/`. Encrypting it settles the question. A managed deployment
  # pushes the client through its own installer, not as a password-protected
  # archive whose member table advertises the client while the payloads stay
  # unreadable -- that combination exists to get the agent past inspection.
  #
  # The vendor leg is an `any:` with one member today because NetSupport is the
  # only remote-admin family with an archive-layout trait; RustDesk, AnyDesk,
  # ScreenConnect and the rest are the obvious next legs, and each drops in
  # here without touching the rest of the rule.
  - id: encrypted-archive-remote-admin-payload
    desc: Encrypted archive conceals a remote-admin client
    crit: hostile
    conf: 0.95
    attack: T1027,T1219
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: well-known/dual-use/remote-admin/netsupport::client32-archive-member
      - id: well-known/dual-use/remote-admin/netsupport::nsm-archive-member
    any:
      - id: well-known/dual-use/remote-admin/netsupport::audiocapture-archive-member
      - id: well-known/dual-use/remote-admin/netsupport::pcicl32-archive-member
      - id: well-known/dual-use/remote-admin/netsupport::remcmdstub-archive-member

  - id: extreme-expansion-7z-executable-payload
    desc: Extreme-expansion 7z archive carries an executable member
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/archive/7z::7z-extreme-expansion-ratio
      - id: metadata/build/archive::archive-windows-executable-entry
    unless:
      - id: well-known/app/ai/media/comfyui::comfyui-portable-archive-context
      - id: well-known/lib/format/mimetype::mimetype-testdata-archive-context

  - id: aes-encrypted-oversized-7z-exe
    desc: 7zAES archive with oversized high-entropy executable
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1204.002
    all:
      - id: micro-behaviors/data/archive/7z::7z-aes-codec
      - id: metadata/file/data-blob::near-maximum-entropy-file
      - id: metadata/build/archive::archive-large-member-entry
      - id: metadata/build/archive::archive-windows-executable-entry

  # Encrypted headers hide archive.members[*], and near-maximum-entropy is
  # size-gated at 256KB — small AES 7z droppers still nest a UPX PE that deep
  # analysis sees as a child. scope: outer joins the codec with that PE layout.
  - id: aes-encrypted-7z-nested-upx-pe
    for: [7z, pe]
    desc: 7zAES archive nests an UPX-packed Windows PE
    crit: suspicious
    conf: 0.94
    attack: T1027.002,T1204.002
    scope: outer
    all:
      - id: micro-behaviors/data/archive/7z::7z-aes-codec
      - id: metadata/binary/section/label::empty-rwx-upx0
    downgrade:
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member

  - id: aes-encrypted-7z-nested-unsigned-pe
    for: [7z, pe, scripts, documents, json, zip, tar, gz]
    desc: 7zAES archive nests an unsigned Windows PE
    crit: suspicious
    conf: 0.9
    attack: T1027.002,T1204.002
    scope: outer
    all:
      - id: micro-behaviors/data/archive/7z::7z-aes-codec
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      # Umbrella exception covers member/pkg-path/pkgname/ilcompiler legs;
      # spelling out members here tripped the 8-leg suppression limit.
      - id: well-known/lib/runtime/managed/dotnet-runtime::source-built-artifacts-context
      - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context
    downgrade:
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member

  # HijackLoader-style concealment: the member table advertises a PE launcher
  # and a Title-case nonce with an invented extension. Encryption keeps the
  # blob unreadable; the nonce is so the listing does not say `.bin` or `.dat`.
  # Flattened atoms — nested name-mangling roll-ups do not resolve at scan.
  - id: encrypted-archive-generated-payload
    for: [7z, zip]
    desc: Encrypted archive hides a generated-name payload beside an executable
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1204.002
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/build/archive::archive-windows-executable-entry
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::archive-nonce-4ext-3cons
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::archive-nonce-4ext-allcons
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::archive-nonce-4ext-vowel-cons
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::archive-nonce-2ext-member
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::archive-double-vowel-3ext-member

  - id: encrypted-archive-lorem-payload
    for: [7z, zip]
    desc: Encrypted archive hides a lorem-named payload
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1204.002
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::archive-lorem-member-a
      - id: objectives/anti-static/obfuscation/name-mangling/member-name::archive-lorem-member-b

  - id: aes-encrypted-sole-windows-executable
    desc: 7zAES archive whose only member is a PE
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1204.002
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::7z-aes-codec-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/build/archive::archive-windows-executable-entry

  # Size floor: a few-hundred-byte 7zAES container is signature + encoded
  # header + one or two AES blocks, so there is no concealed member table
  # worth the name. Archive-library encryption fixtures sit entirely below
  # this floor; a packed payload does not.
  - id: header-encrypted-7z-payload
    desc: 7zAES archive with encrypted member table
    crit: hostile
    conf: 0.95
    attack: T1027.002
    size_min: 4096
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-single-aes-coder-folder

  - id: opaque-header-locked-7zaes
    desc: Opaque header-locked 7zAES hides members
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-aes-without-members
      - id: metadata/file/data-blob::near-maximum-entropy-file

  - id: header-locked-7zaes-container
    desc: Header-locked 7zAES container
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: micro-behaviors/data/archive/7z::large-header-locked-7z
      - id: micro-behaviors/data/archive/7z::7z-aes-without-members

  - id: high-entropy-header-encrypted-7z
    desc: High-entropy 7zAES with encrypted headers
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-single-aes-coder-folder
      - id: micro-behaviors/data/archive/7z::compact-high-entropy-blob

  - id: opaque-high-entropy-header-7z
    desc: Opaque high-entropy 7zAES hides members
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-single-aes-coder-folder
      - id: metadata/file/data-blob::near-maximum-entropy-file

  - id: aes-encrypted-nested-container
    desc: 7zAES archive whose only member is nested
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::7z-aes-codec-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
    any:
      - id: metadata/package/files/archive-member::archive-nested-zip-member
      - id: metadata/package/files/archive-member::archive-nested-rar-member
      - id: metadata/package/files/archive-member::archive-nested-7z-member
      - id: metadata/package/files/archive-member::archive-nested-tar-member

  - id: encrypted-7zaes-windows-exe
    desc: 7zAES archive encrypts a Windows executable
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1204.002
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::7z-aes-codec-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/build/archive::archive-windows-executable-entry

  - id: aes-encrypted-sole-member
    desc: 7zAES archive encrypts its only member
    crit: hostile
    conf: 0.93
    attack: T1027.002
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::7z-aes-codec-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
    any:
      - id: metadata/package/files/archive-member::archive-vir-suffix-member
      - id: metadata/package/files/archive-member::archive-aids-named-member
      - id: metadata/package/files/archive-member::archive-com-member
      - id: metadata/package/files/archive-member::archive-swf-member
      - id: metadata/package/files/archive-member::archive-legacy-disk-member
      - id: metadata/package/files/archive-member::archive-virus-named-member
      - id: metadata/package/files/archive-member::archive-html-member
      - id: metadata/package/files/archive-member::archive-js-member
      - id: metadata/package/files/archive-member::archive-apk-member
      - id: metadata/package/files/archive-member::archive-vbs-member
      - id: metadata/package/files/archive-member::archive-msi-member
      - id: metadata/package/files/archive-member::archive-nds-member
      - id: metadata/package/files/archive-member::archive-reg-member
      - id: metadata/package/files/archive-member::archive-family-named-member
      - id: metadata/package/files/archive-member::archive-disk-image-member
      - id: metadata/package/files/archive-member::archive-numeric-dll-member
      - id: metadata/package/files/archive-member::archive-svg-member
      - id: metadata/file/naming::archive-elf-member
      - id: metadata/file/naming::archive-hashed-jar-member
      - id: metadata/file/naming::archive-hashed-script-member

  - id: compact-encrypted-7zaes
    desc: Compact 7zAES encrypts archive members
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::compact-7zaes-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member

  - id: compact-encrypted-sole-7zaes
    desc: Compact 7zAES encrypts a sole member
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: micro-behaviors/data/archive/7z::compact-7zaes-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
