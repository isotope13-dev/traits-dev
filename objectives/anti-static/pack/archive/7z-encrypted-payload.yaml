  - id: aes-encrypted-apk-payload
    desc: 7zAES archive encrypts an Android package
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1476
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::7z-aes-codec-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/package/files/archive-member::archive-apk-member

  - id: aes-encrypted-deb-payload
    desc: 7zAES archive encrypts a Debian package
    crit: hostile
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::7z-aes-codec-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/package/files/archive-member::archive-deb-member

  - id: aes-encrypted-oversized-member
    desc: 7zAES archive encrypts an oversized member
    crit: hostile
    conf: 0.94
    attack: T1027.002
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: micro-behaviors/data/archive/7z::7z-aes-codec-bytes
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/build/archive::archive-member-over-10mb

  - id: encrypted-archive-exe-swarm
    desc: Encrypted archive conceals many executables
    crit: hostile
