# Highly compressed tiny RAR whose visible payload name is an HTA —
# packing that conceals a script host until extract. Complements the
# document-lure composite (packing signal vs lure naming).
defaults:
  crit: hostile
  conf: 0.97
  platforms: [unix, windows]
  for: [rar]
  attack: T1027.002

composite_rules:
  - id: rar-tiny-compressed-hta
    desc: Tiny high-entropy RAR carries an HTA
    scope: file
    all:
      - id: metadata/file/archive::tiny-high-entropy-rar
      - id: micro-behaviors/data/archive/rar::hta-member-extension
