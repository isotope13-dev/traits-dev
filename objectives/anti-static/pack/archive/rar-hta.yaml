# Highly compressed tiny RAR whose visible payload name is an HTA —
# packing that conceals a script host until extract. Complements the
# document-lure composite (packing signal vs lure naming).
defaults:
  platforms: [windows]
  for: [rar]
  attack: T1027.002

traits:
  - id: tiny-high-entropy-rar
    desc: Tiny high-entropy RAR container
    crit: suspicious
    conf: 0.9
    size_max: 16384
    entropy_min: 7.0
    if:
      type: hex
      pattern: "52 61 72 21 1A 07 01 00" # RAR v5 magic
      offset: 0
    unless:
      - id: well-known/app/communication/mattermost-server::mattermost-server-source
      # Archive parser regression suites intentionally contain tiny, maximally
      # compressed RAR fixtures, including filters and malformed variants.
      - id: metadata/package/testing/presence/harness::test-fixture-directory-path
      - id: metadata/package/testing/presence/integration::archive-test-directory-member-path
      - id: metadata/package/testing/presence/integration::archive-reader-fixture-bundle-path
      # Nested archive analysis evaluates atomic same-file exclusions before
      # composites. Reference each basename atom directly so parser regression
      # fixtures do not briefly surface as packed payloads in a parent bundle.
      - id: metadata/package/testing/presence/integration::rar-filter-regression-fixture-basename
      - id: metadata/package/testing/presence/integration::rar-storage-regression-fixture-basename
      - id: metadata/package/testing/presence/integration::rar-password-regression-fixture-basename

composite_rules:
  - id: rar-tiny-compressed-hta
    desc: Tiny high-entropy RAR carries an HTA
    crit: hostile
    conf: 0.97
    all:
      - id: tiny-high-entropy-rar
      - id: micro-behaviors/data/archive/rar::hta-member-extension

  # Shipping-AWB HTML is the document-lure twin of the HTA packing rule:
  # a tiny high-entropy RAR whose visible member is a carrier waybill page.
  - id: rar-tiny-shipping-awb-html
    desc: Tiny RAR packs shipping-AWB HTML
    crit: hostile
    conf: 0.97
    all:
      - id: tiny-high-entropy-rar
      - id: micro-behaviors/data/archive/rar::shipping-awb-html-member
