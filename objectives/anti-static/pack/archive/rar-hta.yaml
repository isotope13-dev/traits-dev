# Highly compressed tiny RAR whose visible payload name is an HTA —
# packing that conceals a script host until extract. Complements the
# document-lure composite (packing signal vs lure naming).
defaults:
  platforms: [windows]
  for: [rar]
  attack: T1027.002

traits:
  - id: tiny-high-entropy-rar
    desc: Tiny high-entropy RAR container
    crit: suspicious
    conf: 0.9
    size_max: 16384
    entropy_min: 7.0
    if:
      type: hex
      pattern: "52 61 72 21 1A 07 01 00" # RAR v5 magic
      offset: 0
    unless:
      - id: well-known/app/communication/mattermost-server::mattermost-server-source

composite_rules:
  - id: rar-tiny-compressed-hta
    desc: Tiny high-entropy RAR carries an HTA
    crit: hostile
    conf: 0.97
    all:
      - id: tiny-high-entropy-rar
      - id: micro-behaviors/data/archive/rar::hta-member-extension
