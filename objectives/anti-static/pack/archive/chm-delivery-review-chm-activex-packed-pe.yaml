defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-activex-packed-pe
  desc: Active single-topic CHM carries a packed PE
  crit: hostile
  conf: 0.96
  scope: archive
  for: [chm, pe]
  all:
    - id: metadata/document/chm::chm-single-topic-objinst
    - id: metadata/document/chm::chm-contains-executable
    - id: metadata/build/protector::upx-packing-token-reference
  unless:
    - id: metadata/document/chm::chm-data-basename

