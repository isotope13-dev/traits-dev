defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: minizip-zip-data-checksum-profile
    desc: minizip ZIP-in-data checksum profile
    crit: suspicious
    conf: 0.98
    all:
      - id: well-known/lib/format/minizip::zip-in-data-launcher-name-profile
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/section/ratio::dominant-high-entropy-data
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: objectives/anti-analysis/debugger-detect/loader::exception-filtered-packed-loader-windows-loader
      - id: micro-behaviors/process/terminate/kill::terminate-process
    needs: 2
