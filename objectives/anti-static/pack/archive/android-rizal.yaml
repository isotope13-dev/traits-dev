defaults:
  platforms: [android]
  for: [apk]
composite_rules:
  - id: apk-rizal-packed-payload
    desc: APK uses Rizal application with packed payload asset
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/build/packer/rizal::apk-rizal-application-class
      - id: metadata/build/packer/rizal::apk-rizal-data-asset
