defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
composite_rules:
  - id: opaque-packed-sparse-import-pe
    desc: Opaque packed PE with few imports
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/anti-static/pack/detect::empty-text-minimal-import-packed-pe
      - id: objectives/anti-static/pack/detect::empty-text-opaque-near-total-packed-pe
      - id: metadata/binary/resource/identity::pe-no-version-info-resource
      - id: metadata/binary/symbols/imports::few-import-count
  - id: packed-pe-timing-imports
    desc: Packed PE with timing imports
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/anti-static/pack/detect::empty-text-minimal-import-packed-pe
      - id: micro-behaviors/time/query::query-performance-frequency
      - id: micro-behaviors/ui/window/message::get-message-time
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
