# A tiny packer stub: a few kilobytes with the entry point in a writable
# section, one small high-entropy executable section, and an import list
# of only LoadLibraryA, GetProcAddress and VirtualAlloc. Everything else the
# program needs is rebuilt at run time from the packed section. Several
# commercial packers look the same, so this is suspicious, not conclusive.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
composite_rules:
  - id: tiny-writable-entry-dynamic-import-stub
    desc: Tiny packer stub with writable entry and four imports
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/section/header::small-pe-writable-entry-point
      - id: metadata/binary/section/entropy::small-high-entropy-executable-section
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/binary/symbols/count::imported-functions-under-10
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
