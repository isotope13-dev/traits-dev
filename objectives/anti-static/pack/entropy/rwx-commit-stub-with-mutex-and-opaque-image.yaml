# A stub with a handful of imports that commits RWX memory with raw
# VirtualAlloc flags, changes protection on an opaque image, resolves exports
# by name and takes a mutex before doing so allocates a hidden image and
# guards against running twice. That is how a loader behaves; installers
# and utilities do not unpack into raw executable memory.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1620
composite_rules:
  - id: rwx-commit-loader-stub-with-mutex-guard
    desc: RWX-commit loader stub with single-instance mutex
    crit: suspicious
    conf: 0.72
    all:
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-x86-raw
      - id: micro-behaviors/mem/protect/modify::allocation-protection-opaque-image
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: micro-behaviors/process/sync/mutex::create-mutex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
