# A program whose import table holds five loader functions plus unrelated
# accessibility decoys, whose import table sits in a ".NewIT" section left by
# an import-rebuild tool, and whose code walks the PEB loader data to find
# other modules is a dumped and re-fixed packer stub: the real imports are
# resolved by hand at run time.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1106
composite_rules:
  - id: dumped-image-stub-resolving-modules-by-peb
    desc: Rebuilt-import stub resolving modules by PEB
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/binary/section/label::newit-rebuilt-import-section
      - id: micro-behaviors/os/api-resolution/manual::x86-peb-loader-data-load
      - id: metadata/binary/symbols/count::imported-functions-under-10
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: sparse-loader-imports-with-opaque-image-allocation
    desc: Sparse loader imports with opaque image allocation
    crit: suspicious
    conf: 0.7
    all:
      - id: micro-behaviors/mem/protect/modify::allocation-protection-opaque-image
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: metadata/build/artifact::pe-bound-imports-present
      - id: metadata/binary/symbols/count::imported-functions-under-10
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
