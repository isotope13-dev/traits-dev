defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: privileged-high-entropy-pe
    desc: Packed elevated PE with token and control APIs
    crit: suspicious
    conf: 0.96
    attack: T1027,T1548.002
    all:
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/layout/overlay::overlay-dominates-third
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
      - id: metadata/binary/section/layout::blank-section-name-cluster
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/service/remote::net-user-enum-source
      - id: micro-behaviors/communications/socket/create::socket-api-ordinal
      - id: micro-behaviors/network/connections::set-tcp-entry
    needs: 2
