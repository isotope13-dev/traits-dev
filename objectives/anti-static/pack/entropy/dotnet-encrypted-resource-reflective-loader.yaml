# A .NET assembly whose bulk is one high-entropy managed resource, with
# almost no imports, a Rijndael decryptor and Activator/AppDomain reflection,
# is a crypter: the real program is decrypted in memory from the resource
# and instantiated by reflection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1620
composite_rules:
  - id: dotnet-encrypted-resource-reflective-loader
    desc: .NET stub decrypts resource and activates by reflection
    crit: hostile
    conf: 0.8
    # A stub claim is meaningless on containers: firing on a CAB or MSI whose
    # members merely embed managed assemblies misdescribes the archive as a
    # reflective loader. The legs are all PE/DLL-scoped; keep the composite
    # there too.
    for: [pe, dll]
    all:
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/crypto/decrypt::dotnet-rijndael-decryptor
      - id: micro-behaviors/process/interpreter/runtime/clr::activator
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: metadata/binary/symbols/imports::single-import-count
    unless:
      - id: metadata/signed/platform/
      # Stock vendor assemblies bundle compressed dependencies, use session
      # crypto, and reflect over plugins: the legs are all true without any
      # encrypted-payload stub. The vendor client contexts below name the
      # assemblies whose own product identity explains the combination.
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-remote-control-client-context
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-installer-actions-context
