defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002

composite_rules:
  - id: aspack-vb6-high-entropy-resource
    desc: ASPack VB6 with dominant high-entropy resource
    crit: notable
    conf: 0.999
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
      - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
    unless:
      - id: metadata/installer/product/
