defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-resource-indirect-api-hash-profile
    desc: Unsigned PE with dense resource and hashed API clues
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: micro-behaviors/data/control-flow/dispatch/indirect::indirect-call-r13-x64
      - id: metadata/binary/resource/entropy::bounded-high-entropy-rsrc
      - id: micro-behaviors/os/api-resolution/digest-export::pe-api-hashing-indicator-single
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: objectives/anti-static/obfuscation/imports/api-hashing::djb2-hash-constant
