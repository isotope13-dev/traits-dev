# A packed, elevated PE with high-entropy code that also rewrites the active TCP
# connection table is a loader that runs an encrypted payload with network
# control. Packing with elevation alone is common in protected installers, and
# a TCP-table write alone is a network tool capability; the pair of an opaque
# elevated loader and a connection rewrite supports a hostile reading.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1548.002,T1095
composite_rules:
  - id: elevated-packed-pe-with-tcp-table-write
    desc: Packed elevated PE rewrites active TCP connection table
    crit: hostile
    conf: 0.7
    all:
      - id: objectives/anti-static/pack/entropy::privileged-high-entropy-pe
      - id: micro-behaviors/network/connections::set-tcp-entry
