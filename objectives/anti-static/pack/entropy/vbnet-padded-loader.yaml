# Padding a loader past 50 MB with near-random data defeats size limits in
# scanners and sandboxes. The padded .NET image has almost no imports, a
# near-maximum-entropy code section and a Visual Basic runtime reference:
# a stub wrapped around an encrypted payload, not a program with real code.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1027.002
composite_rules:
  - id: vbnet-near-random-padded-loader-stub
    desc: Near-random 50MB+ VB.NET image with a single import
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/binary/section/entropy::large-near-high-entropy-text
      - id: metadata/binary/section/entropy::dotnet-near-maximum-code-entropy
      - id: metadata/binary/code/entropy::unsigned-high-entropy-single-import-dotnet
      - id: metadata/lang/compiler/managed::visual-basic-runtime
      - id: micro-behaviors/data/codec::gzipstream-dotnet
    unless:
      - id: metadata/signed/platform/
