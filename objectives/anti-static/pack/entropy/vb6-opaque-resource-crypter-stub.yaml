# A VB6 crypter stub: the program itself is tiny, the bulk of the file is a
# high-entropy resource section, and the stub hides the loader APIs it needs
# (LoadLibraryA is not imported, DLL names are plain strings) and moves
# memory with RtlMoveMemory to rebuild the payload. Legitimate VB6 programs
# with big resources import and use normal controls instead.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.009
composite_rules:
  - id: vb6-opaque-resource-hidden-loader-stub
    desc: VB6 stub with opaque resource and hidden loader APIs
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/binary/resource/size::rsrc-section-over-150kb
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
