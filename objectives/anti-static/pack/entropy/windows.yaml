defaults:
  for: [pe]
  platforms: [windows]
traits:
  # These are format-neutral section facts. .NET-specific conclusions below
  # combine them with the managed-assembly marker.
- id: dotnet-timezonenames-library-marker
  desc: TimeZoneNames .NET library marker
  crit: notable
  if:
    type: text
    substr: "TimeZoneNames/obj/Release"
- id: dotnet-toolgood-words-dict-marker
  desc: ToolGood.Words dictionary resource marker
  crit: notable
  if:
    type: text
    substr: "ToolGood.Words.dict."
- id: dotnet-wix-extension-marker
  desc: WiX toolset extension marker
  crit: notable
  if:
    type: text
    substr: "WixToolset.Extensibility"
composite_rules:
- id: dotnet-known-packed-recognized-markers
  desc: Known recognized packed .NET assemblies
  crit: notable
  any:
  - id: metadata/build/bundler/asset::costura-compressed-assembly-name
  - id: dotnet-timezonenames-library-marker

- id: standard-upx-packed-pe-context
  desc: Canonical UPX-packed PE layout
  crit: exception
  conf: 0.99
  all:
  - id: metadata/binary/section/label::upx-section-pair
  - id: metadata/binary/section/header::pe-entry-in-writable-section
# Entropy, writable sections, API imports and signature integrity do not
# establish an unpacker, reflective loading or hostile intent. Those facts
# remain in their canonical metadata and capability traits.
- id: dotnet-large-packed-text
  desc: .NET assembly with giant packed .text
  crit: suspicious
  conf: 0.9
  attack: "T1027.002"
  all:
  - id: metadata/binary/section/entropy::large-near-high-entropy-text
  - id: metadata/binary/framework::dotnet-assembly
  downgrade:
    any:
    - id: micro-behaviors/data/embedded/payload/resource/
    - id: micro-behaviors/data/embedded/payload/image/
    # Both relocated composites require this bitmap atom; these two atoms
    # preserve the former directory selector without redundant conditions.
    - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-type-token
    - id: micro-behaviors/ui/graphics/image::dotnet-decoded-image-api-reference
    - id: micro-behaviors/hardware/block/device/
    - id: micro-behaviors/fs/path/device/storage::dev-mapper
    - id: "micro-behaviors/fs/path/device/storage::linux-scsi-sata-device-path"
    - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
- id: unsigned-nonstandard-rwx-unpacker
  desc: Unsigned high-entropy PE with nonstandard sections and a writable entry
  crit: suspicious
  conf: 0.96
  attack: T1027.002,T1620
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/binary/section/label::multiple-nonstandard-section-names
  - id: metadata/binary/code/entropy::high-code-entropy
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/app/
      # Canonical UPX has UPX0/UPX1 names and a writable entry by design.
  - id: standard-upx-packed-pe-context
  - id: well-known/dual-use/packaging/upx::upx-entry-stub-packer-context
  - id: metadata/binary/section/label::vmp-section-name
      # MinGW/GCC output is unsigned, keeps a writable .text for
      # pseudo-relocation fixups, and ships .debug_*/.tls/.xdata names the
      # MSVC-derived counter calls nonstandard -- ordinary toolchain layout,
      # not packing (e.g. EventMachine's mingw32 Ruby extensions).
  - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe

- id: unsigned-multisection-rwx-unpacker
  desc: Unsigned PE unpacker with multiple RWX sections and dynamic linking APIs
  crit: hostile
  conf: 0.98
  attack: T1027.002,T1620
  mbc: B0032
  all:
  - id: unsigned-nonstandard-rwx-unpacker
  - id: metadata/file/entropy::overall-entropy-78
  - id: metadata/binary/section/permission::three-plus-wx-sections
  - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/app/
