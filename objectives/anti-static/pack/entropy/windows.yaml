defaults:
  for: [pe]
  platforms: [windows]
traits:
  # These are format-neutral section facts. .NET-specific conclusions below
  # combine them with the managed-assembly marker.
- id: dotnet-timezonenames-library-marker
  desc: TimeZoneNames .NET library marker
  crit: notable
  if:
    type: text
    substr: "TimeZoneNames/obj/Release"
- id: dotnet-toolgood-words-dict-marker
  desc: ToolGood.Words dictionary resource marker
  crit: notable
  if:
    type: text
    substr: "ToolGood.Words.dict."
composite_rules:
- id: dotnet-known-packed-recognized-markers
  desc: Known recognized packed .NET assemblies
  crit: notable
  any:
  - id: metadata/build/bundler/asset::costura-compressed-assembly-name
  - id: dotnet-timezonenames-library-marker

- id: unsigned-multisection-rwx-unpacker
  desc: Unsigned PE runtime unpacker with high-entropy RWX sections
  crit: suspicious
  conf: 0.98
  attack: T1027.002,T1620
  mbc: B0032
  all:
  - id: metadata/binary/section/header::unsigned-high-entropy-writable-entry-profile
  - id: metadata/file/entropy::very-high-overall-entropy-75
  - id: metadata/binary/section/permission::three-plus-wx-sections
  - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/app/
