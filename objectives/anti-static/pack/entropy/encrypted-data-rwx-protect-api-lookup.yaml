# A native program with a large high-entropy writable data section that flips
# memory to read-write-execute and looks up APIs at runtime keeps its payload
# encrypted in data and prepares to run it from memory.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1620
composite_rules:
  - id: encrypted-writable-data-with-rwx-protect-and-api-lookup
    desc: Encrypted data section, RWX protect, API lookup
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
