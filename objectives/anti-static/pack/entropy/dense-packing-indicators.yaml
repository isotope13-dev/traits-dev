defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
  attack: T1027
  mbc: B0032
composite_rules:
  # Three generic conditions let a single section-property fact combine with
  # two common binary properties and misclassify benign PE layout controls.
  # Require all four independent indicators before inferring dense packing.
  - id: binary-dense-packing-indicators
    desc: Binary with dense packing indicators
    crit: suspicious
    conf: 0.95
    attack: T1045
    size_min: 20000
    needs: 4
    any:
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: "metadata/file/profile/binary-strings::binary-strings-one-to-five"
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/binary/section/permission::wx-section
    unless:
      - id: metadata/binary/code/entry::return-only-no-directories
    downgrade:
      any:
        - id: well-known/dual-use/packaging/pecompact::pecompact-packer
