defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
  attack: T1027
  mbc: B0032
composite_rules:
  # Broad indicator profile from the prepared batch: entropy and sparse
  # strings plus either code or section evidence. Keep this notable signal,
  # including its known packer and UPX context downgrades.
  - id: binary-dense-packing-indicators
    desc: Binary with dense packing indicators
    crit: notable
    conf: 0.95
    attack: T1027.002
    size_min: 20000
    all:
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: "metadata/binary/layout/strings::binary-strings-one-to-five"
    any:
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/binary/section/permission::wx-section
    unless:
      - id: metadata/binary/code/entry::return-only-no-directories
    downgrade:
      any:
        - id: well-known/dual-use/packaging/pecompact::pecompact-packer
        - id: metadata/binary/section/label/packing::upx-section

  # The incoming candidate's four-way profile is a narrower, higher
  # confidence signal. Keep its stricter threshold and PECompact handling.
  - id: binary-four-dense-packing-indicators
    desc: Binary with four dense packing indicators
    crit: suspicious
    conf: 0.95
    attack: T1045
    size_min: 20000
    needs: 4
    any:
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: "metadata/binary/layout/strings::binary-strings-one-to-five"
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/binary/section/permission::wx-section
    unless:
      - id: metadata/binary/code/entry::return-only-no-directories
    downgrade:
      any:
        - id: well-known/dual-use/packaging/pecompact::pecompact-packer
