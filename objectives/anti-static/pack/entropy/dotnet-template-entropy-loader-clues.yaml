defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: suspicious
composite_rules:
- id: dotnet-template-entropy-loader-clues
  desc: Managed template, entropy and loader clues
  conf: 0.9
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/build/manifest::pe-manifest-myapplication-template
  - id: metadata/binary/section/entropy::random-exec-payload-section
  any:
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: micro-behaviors/communications/http/client/managed::downloadstring
  needs: 1
