defaults:
  for:
    - pe
  platforms:
    - windows
  attack: T1027
  mbc: B0032
traits:
  - id: taggant-section
    desc: Nonstandard .taggant section present
    crit: suspicious
    conf: 0.95
    if:
      type: section
      exact: .taggant
      length_min: 4096
    downgrade:
      any:
        - id: metadata/signed/platform/
composite_rules:
  - id: nonstandard-names-multiple-wx-section-packer
    desc: Unusual PE names and multiple RWX sections
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/section/permission::three-plus-wx-sections
      - id: metadata/binary/section/header::pe-nonstandard-entry
    any:
      - id: metadata/binary/layout/size::large-file-1mb
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: metadata/signed/certificate/identity::authenticode-test-certificate-subject
      - id: objectives/anti-static/pack/runtime::packed-dword-xor-add-runtime-loader
  - id: taggant-packed-loader
    desc: Packed Windows loader with .taggant stub
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/pack/taggant::taggant-section
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/symbols/imports::single-import-raw
      - id: metadata/binary/section/permission::two-or-more-wx-sections
    any:
      - id: objectives/evasion/indicator-removal/timestamps::timestamp-anomaly
      - id: metadata/binary/layout/ratio::overlay-size-metrics
      - id: metadata/binary/layout/ratio::pe-signature-present
    needs: 2
    unless:
      - id: metadata/signed/platform/
