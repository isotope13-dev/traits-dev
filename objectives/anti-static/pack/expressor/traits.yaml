# eXPressor-packed Windows executables. The packer writes a banner into what
# it emits; its demo and unregistered editions say so, and vendors shipping
# protected software license the tool, so those banners are the mark of
# throwaway and malicious builds.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002
traits:
  - id: expressor-demo-banner
    desc: Packed with eXPressor demo edition
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: This program was packed with a demo version of eXPressor
  - id: expressor-v13-token
    desc: eXPressor version 1.3 token
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: ExPr-v.1.3
  - id: expressor-unregistered-banner
    desc: Packed with unregistered eXPressor
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: This application was packed with an Unregistered version of eXPressor
composite_rules:
  - id: expressor-section-and-banner
    desc: eXPressor code section and packing banner
    crit: notable
    conf: 0.98
    all:
      - id: metadata/binary/section/label/packing::expressor-code-section-name
    any:
      - id: expressor-v13-token
      - id: expressor-demo-banner
      - id: expressor-unregistered-banner
