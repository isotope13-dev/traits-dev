# A VB6 program is not normally UPX-packed with a writable-entry stub and a
# high-entropy appended block. Packing hides the VB6 code and the overlay
# holds data the stub reads back at run time, which is how VB6 crypters and
# binders ship a payload.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.009
composite_rules:
  - id: upx-vb6-stub-with-high-entropy-overlay
    desc: UPX VB6 stub with high-entropy overlay payload
    crit: hostile
    conf: 0.8
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/section/header::entry-in-upx0
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: micro-behaviors/fs/read/file/handle::vb6-record-file-read
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
