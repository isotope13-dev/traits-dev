defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: scrambled-upx-sandbox-hash-path-list
    desc: Tampered UPX stub with sandbox hash-path list
    crit: hostile
    conf: 0.9
    attack: T1027.002,T1497
    # The path leg is the neutral relocated corpus atom: on its own it claims
    # no sandbox check, so this composite's intent rests on pairing the corpus
    # with the tampered stub.
    all:
      - id: objectives/anti-static/pack/upx::scrambled-upx-header
      - id: micro-behaviors/fs/path/padding::many-hash-named-root-paths
