defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027

composite_rules:
  - id: masquerade-packed-multipart-uploader
    desc: Fake-UPX-masquerading binary with multipart file upload
    crit: hostile
    conf: 0.9
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: objectives/anti-static/pack/upx::scrambled-upx-header
    unless:
      - id: well-known/app/browser/phantomjs::phantomjs-official-binary
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # Chromium's crash reporter carries multipart upload strings. Some
      # AutoIt malware stuffs an entire Chromium image behind fake UPX
      # sections, so those decoy strings do not describe the outer program.
      - id: objectives/anti-static/obfuscation/string/junking::chromium-decoy-stuffing

  - id: retained-magic-low-entropy-multipart-uploader
    desc: Fake-UPX low-entropy binary with multipart file upload
    # Multipart upload plus a fake-UPX layout is suspicious staging behavior,
    # but neither leg proves theft or attacker control. Family-specific or
    # self-mutation composites supply hostile intent when present.
    crit: suspicious
    conf: 0.9
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: objectives/anti-static/pack/upx::upx-sections-not-compressed
      - id: objectives/anti-static/pack/upx::upx-magic-bytes
    unless:
      - id: well-known/app/browser/phantomjs::phantomjs-official-binary
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
