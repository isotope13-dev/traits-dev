# A VB6 program lists MSVBVM60.DLL in its import table. Here the table holds
# only seven kernel32 loader imports and the runtime name is just a string in
# the packed body, so the image is a UPX-wrapped VB6 payload that is loaded
# by hand. Extra non-standard sections after the UPX trio carry the data the
# stub unpacks, and the writable entry point confirms the stub rewrites code.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1620
composite_rules:
  - id: upx-wrapped-vb6-runtime-manual-loader
    desc: UPX-wrapped VB6 payload with hand-loaded imports
    crit: hostile
    conf: 0.8
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # Stock UPX uses this prologue, a writable UPX1 entry, and
      # VirtualAlloc/VirtualProtect. Those are the decompressor, not a
      # hand-rolled loader. UPX0 plus UPX1 already satisfy the nonstandard
      # section count.
      - id: well-known/dual-use/packaging/upx::upx-x86-pe-entry-stub
