# Stock AutoIt interpreters are not UPX-packed and start in .text. Here the
# interpreter carries UPX section names with an entry point in a writable
# section, a compact high-entropy RWX UPX1 payload section, and the compiled
# script still sits in the overlay. Packing around the AU3 script defeats
# script extractors and is how AutoIt malware hides its payload.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1059
composite_rules:
  - id: autoit-script-behind-rwx-upx-stub
    desc: AutoIt script overlay behind RWX UPX stub
    crit: hostile
    conf: 0.88
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/overlay::autoit-pe-overlay-signature
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/entropy::compact-rwx-upx1-section
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
