# A UPX-banner ELF whose trailing PackHeader magic was replaced by NOPs is
# not a routine packed binary: the packer's own banner is intact, but the
# header that lets an unpacker recover the image has been removed. Static
# ELFs with no dynamic linker and no sections are the shape this produces.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002,T1027,T1622

traits:
  # A real packer writes UPX! here. NOP bytes (0x90) with a set version byte
  # mean the magic was overwritten, so upx -d refuses the file.
  - id: nopped-trailing-packheader
    desc: Trailing UPX PackHeader overwritten with NOPs
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: 90 90 90 90
      offset_range: [-36, -32]

composite_rules:
  - id: upx-antiunpack-nopped-header-elf
    desc: UPX ELF with NOPed packheader blocks unpacking
    crit: hostile
    conf: 0.93
    all:
      - id: nopped-trailing-packheader
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-absent
