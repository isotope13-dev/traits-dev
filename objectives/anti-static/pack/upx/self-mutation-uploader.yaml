# A UPX-packed program that carries a per-copy "[[UNIQUE]]" slot and the
# libcurl multipart file-array upload strings can rewrite itself and send
# the result out. A submission utility behaves the same way, so this stays
# suspicious: the bytes show mutation plus upload, not the destination's
# owner.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1105
composite_rules:
  - id: upx-mutation-slot-multipart-uploader
    desc: UPX binary with mutation slot and file upload
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
    unless:
      - id: metadata/signed/platform/
