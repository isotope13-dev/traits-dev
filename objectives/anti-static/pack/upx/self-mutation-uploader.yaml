# A UPX-packed program that carries a per-copy "[[UNIQUE]]" slot and the
# libcurl multipart file-array upload strings can rewrite itself and send
# the result out. A submission utility behaves the same way, so that alone
# stays suspicious: the bytes show mutation plus upload, not the destination's
# owner. The hostile sibling below adds a second PE appended in a dominant
# overlay: a per-copy-unique wrapper that uploads itself while carrying an
# unrelated executable is a hash-evading payload carrier, not a submission
# client (the carried image is a 2012-era resource loader with a ~2 MB
# high-entropy resource section; the stubs differ only in the 16-byte slot
# and the overlay length, and break the UPX checksum because the slot is
# patched inside the compressed stream).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1105
composite_rules:
  - id: upx-mutation-slot-multipart-uploader
    desc: UPX binary with mutation slot and file upload
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
    unless:
      - id: metadata/signed/platform/
      - id: upx-mutation-slot-uploader-with-pe-overlay
      - id: upx-mutation-slot-uploader-with-large-pe-overlay
  - id: upx-mutation-slot-uploader-with-pe-overlay
    desc: Self-mutating UPX uploader carrying appended PE
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: metadata/binary/layout/overlay::upx-dominant-overlay-with-embedded-pe
    unless:
      - id: metadata/signed/platform/
  # The dominant-overlay form above misses carriers whose second image is a
  # small loader (a 70 KB PE with a Run key and a service entry). A plain
  # submission utility has no unrelated executable behind its own image, so a
  # large overlay that is itself a PE is the same carrier at a smaller size.
  # When the overlay is also dominant, the sibling above convicts the same
  # carrier with stronger evidence; step down so one carrier is not counted
  # as two hostile findings.
  - id: upx-mutation-slot-uploader-with-large-pe-overlay
    desc: Self-mutating UPX uploader with large embedded PE
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/overlay::large-overlay-64k
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: upx-mutation-slot-uploader-with-pe-overlay
