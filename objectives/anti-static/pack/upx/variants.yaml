defaults:
  platforms: [windows, unix]
  for: [binaries]
  entropy_min: 7.0
traits:
  - id: upx-tampered-magic-pattern
    desc: 'Byte pattern matching tampered UPX magic'
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-TV-Z]PX!'
composite_rules:
  # Some UPX payloads retain a valid packer signature yet add a second,
  # obfuscated loader layer. Requiring PEB walking plus hashes for the full
  # native allocate/protect/write set separates this from ordinary UPX use.
  - id: upx-peb-native-memory-loader
    for: [pe]
    desc: UPX payload resolves native memory APIs through the PEB
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1620
    mbc: B0030
    all:
      - id: metadata/build/packer/upx::upx-x64-pe-entry-stub
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/os/api-resolution/manual::gs-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-exact-nt-allocate-virtual-memory
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-exact-nt-protect-virtual-memory
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-exact-nt-write-virtual-memory
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-import
      - id: metadata/signature/absent::unsigned-pe-executable

  # Genuine UPX magic does not make the recovered payload benign. Match the
  # outer x64 stub to an unpacked, importless image that resolves APIs by
  # walking the PEB and parsing exports across the recovery child.
  - id: upx-packed-importless-peb-api-resolver
    desc: UPX payload resolves APIs through the PEB
    crit: hostile
    conf: 0.96
    scope: archive
    attack: T1027.002,T1620
    all:
      - id: metadata/build/packer/upx::upx-x64-pe-entry-stub
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/os/api-resolution/manual::gs-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/export-table::x64-pe-signature-export-rva-read
      - id: micro-behaviors/data/checksum::fnv1a-prime-32bit-literal

  - id: upx-tampered-magic
    for: [pe]
    desc: Tampered UPX magic pattern with UPX section names
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1027
    all:
      - id: upx-tampered-magic-pattern
      - id: metadata/binary/section/label/packing::upx-section

  - id: fake-upx-invalid-import-wrapper
    for: [pe]
    desc: Fake UPX wrapper with forged import directory
    crit: suspicious
    conf: 0.98
    mbc: B0032
    attack: T1027.001
    all:
      - id: metadata/binary/layout/stub::upx-early-magic
      - id: metadata/binary/section/label/packing::upx-section-pair
      - id: metadata/binary/header/malformed::pe-import-dir-rva-10000000
    any:
      - id: metadata/binary/section/ratio::few-sections

  # Some malformed or deliberately modified wrappers keep their executable
  # payload in UPX1 while redirecting the PE entry point into an empty section.
  # The entry need not be writable for the packed payload to merit review.
  - id: upx-payload-behind-zeroed-entrypoint
    for: [pe]
    desc: UPX payload behind a zeroed entrypoint
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1027.002
    all:
      - id: metadata/binary/section/entropy::compact-rwx-upx1-section
      - id: metadata/binary/section/header::pe-entry-region-zeroed
      - id: metadata/binary/section/label/packing::upx1-section-name
      - id: metadata/signature/absent::unsigned-missing-signature-record

  - id: unsigned-small-upx-dynamic-loader
    for: [pe]
    desc: Unsigned small UPX stub with runtime API resolution
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1105
    mbc: B0032
    all:
      - id: metadata/binary/section/label/packing::upx-section-pair
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/size::small-pe
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
    unless:
      - id: metadata/installer/product/
      - id: metadata/binary/section/layout::recovered-upx-image-layout
      # CAPE keeps the UPX section names and the stub's LoadLibraryA /
      # VirtualProtect strings after reconstruction. The entry is the dumped
      # image, not the packer stub this composite describes.
      - id: metadata/binary/section/label/custom::cape-sandbox-dump-section
