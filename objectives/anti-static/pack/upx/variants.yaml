defaults:
  platforms: [windows, unix]
  for: [binaries]
  entropy_min: 7.0
traits:
  - id: upx-tampered-magic-pattern
    desc: 'Byte pattern matching tampered UPX magic'
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-TV-Z]PX!'
composite_rules:
  - id: upx-tampered-magic
    for: [pe]
    desc: Tampered UPX magic pattern with UPX section names
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1027
    all:
      - id: upx-tampered-magic-pattern
      - id: metadata/binary/section/label::upx-section

  - id: fake-upx-invalid-import-wrapper
    for: [pe]
    desc: Fake UPX wrapper with forged import directory
    crit: suspicious
    conf: 0.98
    mbc: B0032
    attack: T1027.001
    all:
      - id: upx-magic-bytes
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/header/malformed::pe-import-dir-rva-10000000
    any:
      - id: metadata/binary/section/ratio::few-sections

  - id: unsigned-small-upx-dynamic-loader
    for: [pe]
    desc: Unsigned small UPX stub with runtime API resolution
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1105
    mbc: B0032
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/size::small-pe
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: upx-anachronistic-timestamp-dropper
    for: [pe]
    desc: UPX-packed dropper with pre-2000 compile timestamp
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1070.006
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: objectives/evasion/indicator-removal/timestamps::header-timestamp-pre-2000
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
