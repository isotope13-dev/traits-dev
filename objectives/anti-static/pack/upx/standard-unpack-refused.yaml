# `upx -d` rejected the image itself (not a missing tool, timeout, I/O error
# or size ceiling: `upx.refused` is only set for a file-specific refusal). A
# file that resists standard unpacking is hostile even when a later checksum
# repair recovers its contents.
defaults:
  platforms: [unix, windows]
  for: [pe, elf]
  conf: 1.0

traits:
  - id: standard-unpack-refused
    desc: UPX image resists standard unpacking
    crit: hostile
    if:
      type: metrics
      field: upx.refused
      min: 1
