# A vendor-labelled launcher whose file name disagrees with its version
# resource, whose relocation table claims far more than it holds, and whose
# last section is a high-entropy UPX1 payload. The first three signs say the
# image was edited; the packed tail is where the added bytes went.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1036.005
composite_rules:
  - id: vendor-version-launcher-upx1-tail-reloc-overhang
    desc: Vendor-labelled image with UPX1 tail and reloc overhang
    crit: hostile
    conf: 0.88
    all:
      - id: well-known/lib/runtime/managed/jvm::windows-java-se-versioninfo
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
    unless:
      - id: metadata/signed/platform/
