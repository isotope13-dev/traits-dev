# A UPX layout with inline image-header checks does not prove manual mapping.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1620
composite_rules:
  - id: upx-stub-with-giant-buffer-and-inline-pe-checks
    desc: UPX stub with giant buffer and inline PE checks
    attack: T1027.002
    crit: suspicious
    conf: 0.72
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/disk-utility::bootice-disk-utility
  - id: upx-stub-with-debugger-lookup-and-winhttp
    desc: UPX stub with debugger lookup and WinHTTP
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/dylib/lookup::unsigned-writable-entry-api-lookup-debugger-imports
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-set-timeouts
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/disk-utility::bootice-disk-utility
  - id: unsigned-upx-stub-debugger-memprotect-loader
    desc: Unsigned UPX stub with debugger lookup flips memory protection
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/dylib/lookup::unsigned-writable-entry-api-lookup-debugger-imports
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/disk-utility::bootice-disk-utility
