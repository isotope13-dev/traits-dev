defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: F0001.008

composite_rules:
  - id: xor0b-packheader-anti-unpack
    desc: ELF masks UPX 4.00 PackHeader magic to block unpacking
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/layout/stub::packheader-magic-xor0b
      - id: metadata/binary/provenance/build::upx-400-version
      - id: metadata/binary/layout/stub::upx-packed-elf

  - id: zeroed-pinfo-anti-unpack
    desc: UPX ELF has zeroed original-image metadata
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/layout/stub::zeroed-pinfo-size-fields
      - id: objectives/anti-static/pack/detect::upx-magic-raw
      - id: metadata/binary/section/header::no-section-headers
    unless:
      - id: objectives/anti-static/pack/detect::upx-tool-basename

  - id: zeroed-packheader-anti-unpack
    desc: ELF zeroes trailing UPX metadata to block standard unpacking
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/layout/stub::zeroed-packheader-control-prefix
      - id: metadata/binary/provenance/build::upx-banner
    unless:
      # cybench "packed-away" ships the header-corrupted UPX artifact itself
      # as the challenge solution.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      # Stock UPX 4.x output: the zero run is the loader marker ahead of an
      # intact header (trufflehog's release binaries, among many).
      - id: metadata/binary/layout/stub::intact-trailing-packheader

  - id: corrupted-upx400-packheader-magic
    desc: ELF corrupts UPX 4.00 PackHeader magic to block unpacking
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/binary/provenance/build::upx-provenance-indicator
    any:
      - id: metadata/binary/layout/stub::upx400-arm-packheader-body
      - id: metadata/binary/layout/stub::upx400-amd64-packheader-body
    unless:
      - id: metadata/binary/layout/stub::trailing-packheader-magic
      - id: objectives/anti-static/pack/detect::upx-magic-raw

  # Stock UPX on ELF32 often strips the section table and leaves a trailing
  # PackHeader. This confirms an intact packed layout, not hostile intent;
  # anti-unpacking tamper has separate rules above.
  - id: upx-sectionless-high-entropy-elf
    desc: Sectionless high-entropy trailing UPX ELF
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/layout/stub::trailing-packheader-magic
      - id: metadata/binary/section/header::elf32-zero-section-header-offset
      - id: metadata/file/entropy::high-overall-entropy-70
    unless:
      - id: metadata/binary/framework::upx-tool-basename
      - id: well-known/tool/sysadmin/unetbootin/
