defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.92

# The linker major/minor atoms this profile is built from used to live here.
# They are single optional-header fields -- major 2 is what MinGW's binutils
# writes, and a linker version says nothing about whether an image is packed --
# so sitting in a packer directory they made every `objectives/anti-static/pack/`
# directory reference true for ordinary Delphi and MinGW binaries. IObit's
# `IObitUnlocker.exe` and the `flister.exe` bundled in filename-lister were
# both reported as "packed" on that basis alone. They now live in
# `metadata/binary/metrics/pe-details` and `metadata/lang/compiler/native`,
# and this profile -- version pair PLUS the CharToOemA import -- is what the
# directory now offers.
composite_rules:
  - id: uharc-version-string
    desc: UHARC archiver executable profile
    crit: component
    conf: 0.9
    all:
      - id: metadata/lang/compiler/native::linker-binutils-2x
      - id: metadata/binary/metrics/pe-details::pe-linker-minor-version-18
      - id: micro-behaviors/data/encode/charset::char-to-oem-a-import
