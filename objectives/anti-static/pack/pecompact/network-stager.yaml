# PECompact hides payload bytes behind a writable entry and ordinal Winsock
# imports. Pairing that packer with a hardcoded external IPv4 is the staged-C2
# shape seen in compact downloaders and bot loaders, not in signed shrink-wrap.
defaults:
  crit: hostile
  conf: 0.97
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1071.001,T1105
  mbc: B0032,B0030

composite_rules:
  - id: pecompact-packed-winsock-literal-c2-loader
    desc: PECompact loader with Winsock client and literal C2 address
    all:
      - id: micro-behaviors/data/encode/pecompact::pec2no-section-token
      - id: micro-behaviors/communications/socket/init::winsock-client-ordinal-api-set
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/

  - id: pecompact-overlap-winsock-connect-stager
    desc: PECompact stager with overlapping sections and Winsock connect
    attack: T1027.002,T1620,T1071.001
    all:
      - id: micro-behaviors/data/encode/pecompact::pec2no-section-token
      - id: metadata/binary/header/malformed::pe-section-overlap
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/communications/socket/init::connect-api-ordinal
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
