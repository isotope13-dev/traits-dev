defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1548.002
  mbc: F0001

composite_rules:
  # PECompact is a legitimate packer, but a whole-image payload in one giant
  # writable code section, bootstrap-only imports and a requireAdministrator
  # manifest is the shape of an elevated crypter loader (the PECompact twin of
  # scrambled-upx-admin-crypt-loader). A real product packed with it keeps an
  # ordinary import table and sections.
  - id: pecompact-admin-giant-rwx-loader
    desc: PECompact admin loader with giant RWX payload
    crit: hostile
    conf: 0.95
    all:
      - id: well-known/dual-use/packaging/pecompact::pecompact-packer
      - id: metadata/binary/section/entropy::giant-writable-text-section
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: metadata/build/manifest::pe-requires-admin
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # A PECompact-packed image that still carries a named IDR_BINARY payload
  # resource beside a full GUI resource table, with only packer bootstrap
  # imports visible, is a staged-carrier shape. The packed program's intent
  # is not visible in this form, so this stays suspicious.
  - id: pecompact-packed-embedded-resource-loader
    desc: PECompact packer with embedded binary resource
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/dual-use/packaging/pecompact::pecompact-packer
      - id: metadata/binary/resource/identity::pe-idr-binary-resource-type
      - id: metadata/binary/symbols/count::imported-functions-under-10
    any:
      - id: metadata/binary/resource/identity::pe-resource-menu-list
      - id: metadata/binary/resource/identity::pe-resource-dialog-list
      - id: metadata/binary/resource/identity::pe-resource-accelerator-list
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # The same crypter shape without the elevation manifest: a small PECompact
  # image whose entry sits in a high-entropy writable text section beside a
  # second RWX section, with only LoadLibrary/GetProcAddress-class imports.
  # PECompact alone is dual-use; the bootstrap-only import table and the
  # encrypted writable entry say the real payload is resolved at run time.
  - id: pecompact-bootstrap-imports-rwx-stub
    desc: PECompact stub with bootstrap imports and RWX entry
    crit: suspicious
    conf: 0.85
    all:
      - id: well-known/dual-use/packaging/pecompact::pecompact-packer
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: metadata/binary/section/header::unsigned-writable-text-and-entry-high-code-entropy
      - id: metadata/binary/section/permission::pe-multiple-executable-writable-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
