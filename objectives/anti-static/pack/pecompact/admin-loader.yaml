defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1548.002
  mbc: F0001

composite_rules:
  # PECompact is a legitimate packer, but a whole-image payload in one giant
  # writable code section, bootstrap-only imports and a requireAdministrator
  # manifest is the shape of an elevated crypter loader (the PECompact twin of
  # scrambled-upx-admin-crypt-loader). A real product packed with it keeps an
  # ordinary import table and sections.
  - id: pecompact-admin-giant-rwx-loader
    desc: PECompact admin loader with giant RWX payload
    crit: hostile
    conf: 0.95
    all:
      - id: well-known/dual-use/packaging/pecompact::pecompact-packer
      - id: metadata/binary/section/entropy::giant-writable-text-section
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: metadata/build/manifest::pe-requires-admin
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
