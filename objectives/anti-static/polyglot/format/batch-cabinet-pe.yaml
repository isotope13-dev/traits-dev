# Batch/Cabinet polyglot: the script is also a valid cabinet whose stored
# member is a Windows executable. Static tools that type the file as a
# script never open the cabinet, so the PE travels unexamined. Independent
# of how the script launches it (see the extrac32 self-extract dropper).
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027.009,T1036.008

composite_rules:
  - id: batch-cabinet-polyglot-pe
    desc: Batch script doubles as a cabinet holding a PE
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/format/polyglot::batch-cabinet-header
      - id: micro-behaviors/data/embedded/payload/header::batch-embedded-pe-dos-stub
