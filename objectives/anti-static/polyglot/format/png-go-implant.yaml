defaults:
  for: [png]
  platforms: [macos]

traits:
  - id: png-macho-beacon-tasking-clues
    desc: PNG contains Mach-O beacon tasking clues
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule png_macho_beacon_tasking_clues {
          strings:
            $macho = { CF FA ED FE 0C 00 00 01 }
            $jitter = "GetBeaconJitter"
            $register = ".BeaconRegister"
            $screenshot = ".ScreenshotReq"
            $system = ".InvokeGetSystemReq"
          condition:
            all of them
        }

composite_rules:
  - id: png-trailing-macho-tasking-implant
    desc: PNG trailer contains Mach-O beacon tasking implant
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1071
    scope: file
    all:
      - id: png-macho-beacon-tasking-clues
      - id: objectives/anti-static/polyglot/format::png-trailing-stowaway-executable
