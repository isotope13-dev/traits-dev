defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
traits:
  - id: appended-shell-script
    desc: Shell shebang in file trailer
    crit: suspicious
    conf: 0.8
    size_min: 8193
    if:
      # Literal trailer bytes only. Decoded strings reuse nearby offsets and
      # are not an appended script.
      type: raw
      regex: '#!/(bin/|usr/bin/)(sh|shell|zsh)'
      offset_range:
        - -1024
        - null
  - id: appended-python-script
    desc: Python shebang in file trailer
    crit: suspicious
    conf: 0.8
    size_min: 4097
    if:
      type: text
      regex: '#!/(usr/bin/|bin/)(python|python3)'
      offset_range:
        - -1024
        - null
  # `appended-pe-binary` lived here and was removed (2026-08). Its matcher was
  # `4D 5A ?? ?? 50 45 00 00`, which cannot describe a real PE at all: the PE
  # signature is reached through `e_lfanew` at offset 0x3C, so it is never four
  # bytes past the MZ magic. The only thing that byte layout ever matched was
  # two signature constants stored side by side, which is what every format
  # detector, archiver, linker and packer carries -- it scored 7-Zip's
  # `MZ\0\0PE\0\0` detection table (sitting next to `\x7fELF`, a Mach-O magic
  # and `RIFFWAVEfmt`) inside the Pinokio installer.
  #
  # Repairing the pattern to the real structure (`MZ [58-1024] PE\0\0`) does not
  # rescue it: on ELF/Mach-O carriers the population that legitimately embeds a
  # PE header is toolchains, not droppers. The Zig compiler ships a DOS header,
  # stub and PE signature as the template its COFF linker writes, and 7-Zip
  # carries more of the same at other gaps -- so does lld, MinGW and UPX. A DOS
  # stub check fails for the same reason. There is no byte pattern that
  # separates "carrier hides a PE payload" from "carrier knows the PE format",
  # so the honest coverage is the header-validated `binary.embedded[]` facts
  # (metadata/binary/layout/embedded::embedded-pe-image), which carry each
  # image's offset and size.
composite_rules:
  - id: upx-elf32-stub-name
    desc: UPX ELF32 stub name
    crit: notable
    conf: 0.9
    any:
      - id: metadata/build/protector::upx-lzma-elf32-stub-name
      - id: metadata/build/protector::upx-elfmainx-stub-name
      - id: metadata/build/protector::upx-elfmainz-stub-name

  # Both of these need `for: [png]`. The file default is [elf, macho, pe], and
  # without an override a composite named "PNG trailing data with executable
  # payload" was gated to file types that are not PNG, so it could never fire on
  # the format it describes. Every leg below is a `for: [png]` atom.
  - id: image-embedded-exec-magic
    desc: Image carries executable header magic
    crit: suspicious
    conf: 0.9
    for: [png]
    any:
      - id: micro-behaviors/data/embedded/payload/image::elf-magic-past-png-header
      - id: micro-behaviors/data/embedded/payload/image::pe-magic-past-png-header
  - id: png-trailing-embedded-exec
    desc: PNG trailer co-occurs with executable header magic
    crit: suspicious
    conf: 0.95
    attack: T1027.009
    for: [png]
    all:
      - id: image-embedded-exec-magic
    any:
      - id: metadata/image/trailing::png-trailing-data
      - id: metadata/image/trailing::png-chunks-after-iend
  # Magic sniffers call a shellcode trailer an archive when a later 1F 8B
  # byte pair is not a gzip member. The PEB read is the payload signal, and
  # it only becomes a stager when the image also has a real trailer.
  - id: png-trailer-x64-peb-shellcode
    desc: PNG trailer carries x64 PEB-walk shellcode
    crit: hostile
    conf: 0.97
    attack: T1027.009
    for: [png]
    all:
      - id: micro-behaviors/data/embedded/payload/image::x64-gs-peb-walk-in-png
      - id: metadata/image/trailing::png-trailing-data
  - id: png-trailing-stowaway-executable
    desc: PNG trailer contains an executable header
    crit: suspicious
    conf: 0.98
    attack: T1027.009
    for: [png]
    all:
      # The aggregate stowaway list may refer to a header in tEXt or a gap.
      # Require its location in the tail. A header is not a parsed program.
      - id: metadata/file/format/media::media-trailer-executable-header
    any:
      - id: metadata/image/trailing::png-trailing-data
      - id: metadata/file/format/media::media-trailing-data
  # An image that still decodes but carries a server-side shell after its own
  # data: the container walker confirms the unclaimed trailer, and the trailer
  # holds both the request read and the runtime exec. The webshell verdict is
  # command-and-control/backdoor/webshell/embedded; this records the polyglot
  # carrier that lets the file pass an upload filter as a picture.
  - id: media-trailer-server-side-shell-polyglot
    desc: Image with appended data hides a JSP shell
    crit: hostile
    conf: 0.96
    attack: T1027.009,T1505.003
    for: [media]
    platforms: [unix, windows]
    all:
      - id: metadata/file/format/media::media-trailing-data
      - id: micro-behaviors/data/embedded/payload/media::jsp-request-parameter-in-media
      - id: micro-behaviors/data/embedded/payload/media::jsp-runtime-exec-in-media
  - id: pe-multi-embedded-payload-container
    for: [pe]
    desc: PE with many embedded PE headers
    crit: suspicious
    conf: 0.92
    attack: T1027.009
    all:
      - id: metadata/binary/layout/embedded::pe-code-section-header-cluster
    any:
      - id: metadata/binary/layout/ratio::large-file-overlay-at-least-half
      - id: metadata/binary/code/complexity::few-functions
