defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
traits:
  - id: appended-zip-trailer
    desc: ZIP central directory at file end
    crit: notable
    conf: 0.85
    attack: T1027.009
    if:
      type: hex
      pattern: 50 4B 05 06
      offset_range:
        - -1024
        - null
    unless:
      - type: raw
        regex: __main__\.py(PK)?
        offset_range:
          - -512
          - null
  - id: appended-shell-script
    desc: Shell shebang in file trailer
    crit: suspicious
    conf: 0.8
    size_min: 8193
    if:
      type: text
      regex: '#!/(bin/|usr/bin/)(sh|shell|zsh)'
      offset_range:
        - -1024
        - null
  - id: appended-python-script
    desc: Python shebang in file trailer
    crit: suspicious
    conf: 0.8
    size_min: 4097
    if:
      type: text
      regex: '#!/(usr/bin/|bin/)(python|python3)'
      offset_range:
        - -1024
        - null
  - id: appended-elf32-le-binary
    desc: ELF32 little-endian binary appended to file
    crit: suspicious
    conf: 0.9
    size_max: 1000000
    if:
      type: hex
      # Require a coherent ELF32 header rather than an e_ident fragment copied
      # into an executable's constants or recovery data.
      pattern: 7F 45 4C 46 01 01 01 ?? [8] (01|02|03) 00 ?? 00 01 00 00 00
      offset_range:
        - 1
        - null
    unless:
      - id: metadata/binary/layout/stub::elf-image-carried-by-design
      - id: metadata/build/protector::upx-packing-token-reference
      # A rejected ELF has unknown/truncated layout. Internal header templates
      # do not establish a deliberately appended second executable.
      - type: metrics
        field: elf.parse_failed
        min: 1
      - type: value
        path: elf.type
        exact: core
      # An already-extracted embedded sub-object (UPX payload, eBPF object) is not
      # a polyglot/appended-ELF file. cleave's synthetic sub-object path carries
      # the `!!embedded` marker, available during evaluation.
      - type: path
        regex: '!!embedded'
      - type: metrics
        field: binary.overlay_size
        max: 4096
    downgrade:
      any:
        - type: metrics
          field: binary.string_count
          min: 50
  # `appended-pe-binary` lived here and was removed (2026-08). Its matcher was
  # `4D 5A ?? ?? 50 45 00 00`, which cannot describe a real PE at all: the PE
  # signature is reached through `e_lfanew` at offset 0x3C, so it is never four
  # bytes past the MZ magic. The only thing that byte layout ever matched was
  # two signature constants stored side by side, which is what every format
  # detector, archiver, linker and packer carries -- it scored 7-Zip's
  # `MZ\0\0PE\0\0` detection table (sitting next to `\x7fELF`, a Mach-O magic
  # and `RIFFWAVEfmt`) inside the Pinokio installer.
  #
  # Repairing the pattern to the real structure (`MZ [58-1024] PE\0\0`) does not
  # rescue it: on ELF/Mach-O carriers the population that legitimately embeds a
  # PE header is toolchains, not droppers. The Zig compiler ships a DOS header,
  # stub and PE signature as the template its COFF linker writes, and 7-Zip
  # carries more of the same at other gaps -- so does lld, MinGW and UPX. A DOS
  # stub check fails for the same reason. There is no byte pattern that
  # separates "carrier hides a PE payload" from "carrier knows the PE format",
  # so the honest coverage is the engine's parser-backed `binary/embedded/pe`
  # finding, which reports embedded images with an offset and a size.
  - id: jar-polyglot-prefix
    desc: Data before JAR/ZIP header
    crit: component
    conf: 0.8
    if:
      type: hex
      pattern: 50 4B 03 04
      offset_range:
        - 64
        - null
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiled/
      - id: well-known/app/system/drivers/
      - id: metadata/binary/section/name::fwimage-section
composite_rules:
  - id: upx-elf32-stub-name
    desc: UPX ELF32 stub name
    crit: notable
    conf: 0.9
    any:
      - id: metadata/build/protector::upx-lzma-elf32-stub-name
      - id: metadata/build/protector::upx-elfmainx-stub-name
      - id: metadata/build/protector::upx-elfmainz-stub-name

  # Both of these need `for: [png]`. The file default is [elf, macho, pe], and
  # without an override a composite named "PNG trailing data with executable
  # payload" was gated to file types that are not PNG, so it could never fire on
  # the format it describes. Every leg below is a `for: [png]` atom.
  - id: image-embedded-exec-magic
    desc: Image carries executable header magic
    crit: suspicious
    conf: 0.9
    for: [png]
    any:
      - id: micro-behaviors/data/embedded/payload/image::elf-magic-past-png-header
      - id: micro-behaviors/data/embedded/payload/image::pe-magic-past-png-header
  - id: png-trailing-embedded-exec
    desc: PNG trailing data with executable payload
    crit: suspicious
    conf: 0.95
    attack: T1027.009
    for: [png]
    all:
      - id: image-embedded-exec-magic
    any:
      - id: metadata/binary/header/malformed::png-trailing-data
      - id: metadata/image/trailing::png-chunks-after-iend
  # Hostile-grade sibling of png-trailing-embedded-exec: instead of byte magic
  # (which a compressed pixel stream can produce by coincidence), this requires
  # the container walker to confirm the unclaimed trailer parses as an
  # executable image. A PNG whose own structure disowns bytes that form a valid
  # PE/ELF/Mach-O has no legitimate construction -- the magic-based suspicious
  # above stays for the weaker evidence.
  - id: png-trailing-stowaway-executable
    desc: PNG unclaimed trailer parses as an executable
    crit: hostile
    conf: 0.98
    attack: T1027.009
    for: [png]
    all:
      - id: metadata/file/format/media::media-stowaway-executable
    any:
      - id: metadata/binary/header/malformed::png-trailing-data
      - id: metadata/file/format/media::media-trailing-data
  # An image that still decodes but carries a server-side shell after its own
  # data: the container walker confirms the unclaimed trailer, and the trailer
  # holds both the request read and the runtime exec. The webshell verdict is
  # command-and-control/backdoor/webshell/embedded; this records the polyglot
  # carrier that lets the file pass an upload filter as a picture.
  - id: media-trailer-server-side-shell-polyglot
    desc: Image with appended data hides a JSP shell
    crit: hostile
    conf: 0.96
    attack: T1027.009,T1505.003
    for: [media]
    platforms: [unix, windows]
    all:
      - id: metadata/file/format/media::media-trailing-data
      - id: micro-behaviors/data/embedded/payload/media::jsp-request-parameter-in-media
      - id: micro-behaviors/data/embedded/payload/media::jsp-runtime-exec-in-media
  - id: pe-multi-embedded-payload-container
    for: [pe]
    desc: PE with many embedded PE headers
    crit: suspicious
    conf: 0.92
    attack: T1027.009
    all:
      - id: metadata/binary/layout/embedded::pe-code-section-header-cluster
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::large-overlay
      - id: metadata/binary/code/complexity::few-functions
  # Embedded image metadata is data, not a second executable file format.
  # Polyglot findings must be grounded in a parseable secondary format.
  - id: jar-polyglot-host-indicator
    desc: JAR polyglot host indicators
    crit: suspicious
    conf: 0.85
    attack: T1027.009
    unless:
      - id: metadata/binary/linking/runtime::ape-binary-marker
      - id: metadata/binary/layout/overlay::jar-manifest-marker
      - id: micro-behaviors/fs/temp/py2exe::py2exe-pythondll
    all:
      - id: jar-polyglot-prefix
      - id: appended-zip-trailer
    any:
      - id: metadata/binary/layout/overlay::has-overlay
    downgrade:
      any:
        - id: micro-behaviors/fs/temp/py2exe::py2exe-bundle
        - id: micro-behaviors/fs/temp/pyinstaller/
