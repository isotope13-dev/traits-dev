defaults:
  platforms: [windows, unix]
  attack: T1027.009
  for: [html]
composite_rules:
  - id: html-dos-com-encrypted-polyglot
    desc: HTML page doubles as encrypting DOS COM program
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/document/html::title-tag-nop-jump-entry
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-swapped-word-xor-copy-loop
      - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::dos-delta-offset-dispatch

  - id: html-title-jump-dos-overwriter
    desc: HTML title conceals DOS file-overwriting code
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/document/html::title-tag-nop-jump-entry
      - id: objectives/impact/infect/binary/dos/overwrite::dos-bp-sized-search-image-overwrite
