defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: microsoft-signed-overlay-multiple-pe-profile
  desc: Microsoft-signed PE with multiple embedded PE and overlay
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/signature/verified/platform::microsoft
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: metadata/binary/layout/ratio::overlay-over-35pct
  any:
  - id: micro-behaviors/fs/path/basename::mavinject32-executable-reference
  - id: metadata/binary/layout/ratio::tnameserv-name
  - id: well-known/tool/packaging/nsis::nsis
  - id: objectives/anti-static/polyglot/format::pe-multi-embedded-payload-container
  needs: 2
