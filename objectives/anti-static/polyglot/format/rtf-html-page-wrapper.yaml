# An RTF file whose body is a script that writes a percent-encoded HTML page.
# Word shows the script as text; a browser opening the same bytes (saved or
# renamed as .html) skips the RTF header and runs the script. The encoding
# keeps the page's markup away from scanners keyed on HTML.
defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1027,T1027.006

composite_rules:
  - id: rtf-wrapped-encoded-html-page
    desc: RTF body writes an encoded HTML page
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/phishing/form::rtf-html-unescape-writer
      - id: metadata/document/rtf/structure::rtf-url-encoded-html-document
