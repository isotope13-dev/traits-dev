defaults:
  for: [batch]
  platforms: [windows]
  attack: T1027,T1562.001

composite_rules:
  - id: obfuscated-batch-security-bypass-launch
    desc: Obfuscated batch hides security bypass and launch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/env/write::batch-many-short-quoted-assignments
      - id: metadata/file/text-distribution::large-batch-low-whitespace-ratio
      - id: micro-behaviors/os/security/defender::batch-defender-exclusion-command-text
      - id: micro-behaviors/os/registry/association/reference::qualified-shell-open-command-key
      - id: metadata/lang/source/syntax/argument::cmd-public-executable-launch
