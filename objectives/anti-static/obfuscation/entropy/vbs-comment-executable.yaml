defaults:
  for: [vbs]
  platforms: [windows]
  conf: 0.94

traits:
  - id: vbs-comment-launcher-entropy
    desc: High entropy in large VBScript
    crit: component
    if:
      type: metrics
      field: file.entropy
      min: 6.4
      min_size: 8192
  - id: vbs-comment-launcher-digits
    desc: Digit-heavy VBScript
    crit: component
    if:
      type: metrics
      field: text.digit_ratio
      min: 0.25
      min_size: 8192
  - id: vbs-exe-argument-concatenation
    desc: VBScript concatenates executable and argument
    crit: component
    if:
      type: text
      regex: '(?im)^\s*\w+\s*=\s*"[^"\r\n]{1,80}\.(exe|pif)"\s*[+&]\s*"\s+"\s*[+&]\s*\w+'
  - id: vbs-variable-run-call
    desc: VBScript Run executes a variable
    crit: component
    if:
      type: text
      regex: '(?im)^\s*\w+\.run\s+\w+\s*$'
  - id: vbs-literal-executable-argument
    desc: VBScript assigns executable with argument
    crit: component
    if:
      type: text
      regex: '(?im)^\s*\w+\s*=\s*"[^"\r\n]{1,80}\.(exe|pif)\s+[^"\r\n]{1,100}"'

composite_rules:
  - id: vbs-random-comment-executable-launch
    desc: Random-comment padding obscures executable launch
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/source/comment::contiguous-long-vb-comment-block
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
      - id: vbs-comment-launcher-entropy
      - id: vbs-comment-launcher-digits
      - id: vbs-variable-run-call
    any:
      - id: vbs-exe-argument-concatenation
      - id: vbs-literal-executable-argument
