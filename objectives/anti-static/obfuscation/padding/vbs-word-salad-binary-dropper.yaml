# VBS droppers padded with word-salad comment lines that decode an embedded
# base64 blob through MSXML and write it to disk with ADODB.Stream.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: hostile
  attack: T1027.001,T1140,T1105

composite_rules:
  - id: word-salad-padded-vbs-binary-drop
    desc: Word-salad padded VBS decodes and writes an embedded binary
    conf: 0.94
    all:
      - id: metadata/lang/source/comment::vbs-word-salad-comment-lines
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
