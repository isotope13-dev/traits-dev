# Cloned-page script loaders padded with generated English word salad.
#
# The page keeps the captured CDN request headers of the site it was saved
# from (so it looks like a saved copy of that site), replaces the body with
# thousands of random dictionary words (dilutes text classifiers and gives
# each copy a fresh hash), and adds one script from a throwaway host that
# does the real work. Run as an HTA or opened in a browser, the page has no
# content of its own.
defaults:
  platforms: [windows]
  for: [html]
  crit: hostile
  attack: T1027.001,T1036.008

composite_rules:
  - id: word-salad-cloned-page-remote-script
    desc: Word-salad page posing as a saved copy of a site loads a foreign remote script
    conf: 0.92
    all:
      - id: metadata/document/html/encoding::untagged-body-word-run
      - id: metadata/document/html/markup::embedded-cloudfront-viewer-headers
      - id: micro-behaviors/communications/http/client/script::remote-script-element-source
