# Storing each ciphertext byte in its own little-endian dword (three zero
# bytes after every payload byte) quarters the apparent entropy of an
# encrypted appended payload, so entropy-based packer checks read it as
# sparse data. A Rust RunPE stub delivered as "Loader-GUI.exe" with a
# license-key decoy (TrojanPony PromptReel repository, 2026) carries a
# ~1.5 MB AES stage this way and hollows it into a suspended process.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1027.013

traits:
  - id: overlay-dword-widened-bytes
    desc: Overlay head holds bytes widened to dwords
    crit: notable
    conf: 0.85
    if:
      type: hex
      section: overlay
      section_offset_range: [0, 4096]
      pattern: >-
        ~00 00 00 00 ~00 00 00 00 ~00 00 00 00 ~00 00 00 00
        ~00 00 00 00 ~00 00 00 00 ~00 00 00 00 ~00 00 00 00
        ~00 00 00 00 ~00 00 00 00 ~00 00 00 00 ~00 00 00 00

composite_rules:
  - id: dword-widened-overlay-decrypting-pe-loader
    desc: Dword-widened overlay payload decrypted by a PE-parsing loader
    crit: hostile
    conf: 0.93
    all:
      - id: overlay-dword-widened-bytes
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
    any:
      - id: micro-behaviors/crypto/decrypt/transform/call::bcrypt-decrypt-api
      - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-api
