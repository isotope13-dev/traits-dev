# Trojanized project configs (postcss/tailwind/next/vite/eslint) whose last
# export line is followed by hundreds of spaces and then a loader that tags
# global["!"] before aliasing require: the code sits past any editor's right
# margin, so the file reviews as a three-line config. Seen in fake
# job-interview repositories (2024+).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: hostile
  attack: T1027,T1195.002,T1059.007

composite_rules:
  - id: offscreen-tagged-loader
    desc: Hides a tagged loader past a long inline whitespace run
    conf: 0.95
    all:
      - id: metadata/file/line::long-inline-whitespace-run
      - id: metadata/lang/javascript-features::global-bang-version-marker
