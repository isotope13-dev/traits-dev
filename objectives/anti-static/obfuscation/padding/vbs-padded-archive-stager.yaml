defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1027,T1140,T1059.005

composite_rules:
  - id: padded-vbs-decoded-archive-execution
    desc: Padded VBScript decodes and executes archive content
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/anti-av/code-padding::empty-vb-statement-separator-padding
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/data/string/concat/expression::vbs-four-variable-concatenation
      - id: micro-behaviors/data/archive/extract/capability::shell-copyhere-method
      - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file
      - id: metadata/lang/source/syntax/call/member::shellexecute-method-invocation-text
