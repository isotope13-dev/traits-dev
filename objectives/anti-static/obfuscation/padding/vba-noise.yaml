defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1027,T1059.005

traits:
  - id: vba-repeated-error-suppression
    desc: VBA repeatedly suppresses errors
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)(on error resume next.{0,500}){4}'

  - id: vba-hidden-object-window
    desc: VBA sets an object window visibility
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)showwindow\s*='

  - id: vba-document-open
    desc: VBA document-open handler
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bDocument_Open\s*\('

composite_rules:
  - id: vba-autoopen-obfuscated-object-create
    desc: Auto-open macro hides noisy object execution
    crit: hostile
    conf: 0.96
    all:
      - id: vba-repeated-error-suppression
      - id: vba-hidden-object-window
      - id: vba-document-open
      - id: micro-behaviors/os/com/instantiation::vbs-createobject-variable-progid
