defaults:
  platforms: [android]
  for: [apk_android]
  attack: T1027,T1499

traits:
  - id: apk-huge-compressed-manifest-header
    desc: APK manifest declares excessive expanded size
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: '50 4B 03 04 [14] ?? ?? ?? 00 ?? ?? ?? (1? | 2? | 3? | 4? | 5? | 6? | 7? | 8? | 9? | A? | B? | C? | D? | E? | F?) 13 00 ?? ?? 41 6E 64 72 6F 69 64 4D 61 6E 69 66 65 73 74 2E 78 6D 6C'
  - id: apk-extreme-uncompressed-member
    desc: APK has exceptionally large expanded member
    crit: notable
    conf: 0.98
    if:
      type: value
      path: archive.members[*].size_bytes
      regex: '^[2-9][0-9]{8,}$|^[1-9][0-9]{9,}$'

composite_rules:
  - id: apk-oversized-compressed-manifest-obfuscation
    desc: APK hides excessive manifest data in compression
    crit: hostile
    conf: 0.99
    all:
      - id: apk-huge-compressed-manifest-header
      - id: apk-extreme-uncompressed-member
