defaults:
  platforms: [android]
  for: [apk_android]
  attack: T1027,T1499

traits:
  - id: apk-huge-compressed-manifest-header
    desc: APK manifest declares excessive expanded size
    crit: suspicious
    conf: 0.98
    if:
      # ZIP sizes are little endian: packed <16 MiB, expanded >=16 MiB.
      # These local-header bytes are not available in extracted text.
      type: raw
      regex: '(?s)PK\x03\x04.{14}...\x00...[\x01-\xff]\x13\x00..AndroidManifest\.xml'
  - id: apk-extreme-uncompressed-member
    desc: APK has exceptionally large expanded member
    crit: notable
    conf: 0.98
    if:
      type: value
      path: archive.members[*].size_bytes
      regex: '^[2-9][0-9]{8,}$|^[1-9][0-9]{9,}$'

composite_rules:
  - id: apk-oversized-compressed-manifest-obfuscation
    desc: APK hides excessive manifest data in compression
    crit: hostile
    conf: 0.99
    all:
      - id: apk-huge-compressed-manifest-header
      - id: apk-extreme-uncompressed-member

  - id: android-padded-manifest-asset-loader
    desc: Oversized compressed manifest conceals an in-memory package DEX loader
    crit: hostile
    conf: 0.99
    attack: T1406
    for: [apk, zip, dex]
    scope: outer
    all:
      - id: objectives/anti-static/obfuscation/padding::apk-huge-compressed-manifest-header
      - id: objectives/evasion/hijack-execution-flow/loader::android-package-cache-in-memory-loader
