defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027

traits:
  - id: pe-overlay-over-100mb
    desc: PE overlay exceeds 100 MB
    crit: component
    if:
      type: metrics
      field: pe.overlay_size
      min: 104857600
  - id: pe-overlay-over-95-percent
    desc: PE overlay exceeds 95 percent of file
    crit: component
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.95

composite_rules:
  - id: pe-massive-nul-overlay-high-entropy-code
    desc: PE combines massive NUL overlay and dense code
    crit: hostile
    conf: 0.98
    all:
      - id: pe-overlay-over-100mb
      - id: pe-overlay-over-95-percent
      - id: metadata/binary/layout/overlay::large-near-zero-entropy-overlay
      - id: metadata/binary/code/entropy::code-region-entropy-78
      - id: metadata/signature/absent::unsigned-missing-signature-record
