# Binary padding inside a password-protected archive (a "pumped" installer).
# The delivered executable is inflated with filler to hundreds of megabytes so
# sandboxes and AV upload paths skip it, and the archive is encrypted so a mail
# or web gateway cannot read it either. The filler compresses away: a member
# header declares 300 MB or more while that member packs at least 50x smaller.
# Ordinary large installers carry already-compressed payloads and expand only
# a few times; password-protected software releases do not add filler.
# Member names are not used: the legs are encryption, an executable or
# installer member type, the declared size and the per-member expansion.
defaults:
  platforms: [windows]
  for: [rar, zip]
  attack: T1027.001,T1027.013
  mbc: B0024

composite_rules:
- id: encrypted-archive-inflated-executable
  desc: Encrypted archive hides an inflated executable
  crit: hostile
  conf: 0.93
  scope: archive
  all:
    - id: metadata/archive/encryption::archive-encrypted-member
    - id: metadata/archive/member/size::member-at-least-300mb
    - id: metadata/archive/compression::archive-member-expansion-over-50x
  any:
    - id: metadata/archive/member/extension::archive-windows-executable-entry
    - id: metadata/archive/member/extension::archive-msi-member
  unless:
    # Sparse virtual disks legitimately declare huge, mostly-empty extents.
    - id: metadata/archive/layout::archive-disk-image-member
