defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1027.016
traits:
  - id: powershell-math-call-noise
    desc: Repeated discarded constant Math calls
    crit: notable
    conf: 0.9
    count_min: 30
    if:
      type: text
      regex: '(?i)[;{}]\s*\[Math\]::\w+\([-0-9., ]{1,32}\)\s*[;}]'
composite_rules:
  - id: powershell-decoder-with-call-padding
    desc: Character decoder with Math call padding
    crit: suspicious
    conf: 0.95
    all:
      - id: powershell-math-call-noise
      - id: micro-behaviors/data/decode/charset::powershell-cyclic-subtraction-character-decoder
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
