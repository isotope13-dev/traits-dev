# Dozens of standalone [Math] static-method calls whose results are discarded
# pad a PowerShell stager with inert statements to dilute static signatures.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1027.016
traits:
  - id: powershell-math-call-noise
    desc: Many discarded Math calls as padding
    crit: notable
    conf: 0.85
    count_min: 30
    if:
      type: text
      regex: '(?i)[;{}]\s*\[Math\]::\w+\('
composite_rules:
  - id: powershell-stager-with-math-call-noise-and-variable-call
    desc: Padded PowerShell stager calls decoded names
    crit: hostile
    conf: 0.85
    attack: T1027.016,T1059.001
    for: [batch]
    all:
      - id: powershell-math-call-noise
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-variable-call
      - id: micro-behaviors/data/decode/hex::embedded-powershell-convert-tobyte-radix16
