# Hundreds of lines assigning random lowercase strings to random variable names
# pad a VBScript so the short decode-and-Execute routine is buried in noise and
# the file hash and size differ on every build.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027.001,T1027.016
traits:
  - id: vbscript-random-string-assignment-padding
    desc: Many random-name string assignments as padding
    crit: notable
    conf: 0.8
    count_min: 50
    if:
      type: text
      regex: '(?m)^[a-z][a-z0-9]{7,20} = "[a-z0-9]{8,20}"\r?$'
composite_rules:
  - id: vbscript-junk-padding-with-offset-decode-and-execute
    desc: Padded VBScript decodes a numeric array and runs it
    crit: hostile
    conf: 0.9
    all:
      - id: vbscript-random-string-assignment-padding
      - id: micro-behaviors/data/decode/charset::vbs-chr-array-element-minus-key
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
  # Minimal-loader variant: the script has too little ordinary VBScript
  # for the validated-execute leg, but the padding, the long numeric
  # array, the Chr(element-minus-key) rebuild and a bare Execute of the
  # rebuilt string are the whole file. Nothing else is left to be the
  # program, so the executed stage is the payload.
  - id: vbscript-padded-array-execute-loader
    desc: Padded VBScript executes a decoded numeric array
    crit: hostile
    conf: 0.96
    all:
      - id: vbscript-random-string-assignment-padding
      - id: micro-behaviors/data/decode/charset::vbs-numeric-array-literal
      - id: micro-behaviors/data/decode/charset::vbs-chr-array-element-minus-key
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
