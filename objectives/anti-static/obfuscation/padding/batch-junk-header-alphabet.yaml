# Batch that opens with junk bytes and a mid-line UTF-16 BOM, then spells
# its commands from a non-ASCII alphabet padded with variables that expand
# to nothing. The header defeats text sniffing; the padding defeats
# signature matching on the rebuilt commands.
defaults:
  platforms: [windows]
  for: [batch]
  crit: hostile
  attack: T1027.001

composite_rules:
  - id: batch-junk-header-and-empty-variable-padding
    desc: Batch hides behind a junk header and empty-variable padding
    conf: 0.93
    all:
      - id: metadata/file/encoding/shape::batch-junk-bytes-before-bom-header
      - id: metadata/file/encoding/shape::batch-nonascii-empty-junk-variables
