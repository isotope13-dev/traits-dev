# JScript builders bury a short decode-and-launch routine under hundreds of
# no-op statements: full-length self-substrings, same-character regex
# replacements, add-then-subtract round trips and identity conversions. None
# of the shapes changes program state, and ordinary code has no reason to
# repeat them dozens of times. This is the JavaScript sibling of
# powershell-math-call-noise and vbscript-random-string-assignment-padding.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1027.001
traits:
  - id: js-noop-self-substring-padding
    desc: Self-substring assignments repeated as padding
    crit: notable
    conf: 0.9
    count_min: 8
    if:
      type: text
      regex: '=\s*\w+\.substring\(0\s*,\s*\w+\.length\)'
  - id: js-noop-same-char-replace-padding
    desc: Same-character regex replacements as padding
    crit: notable
    conf: 0.9
    count_min: 8
    if:
      type: text
      regex: '\.replace\s*\(\s*/[A-Za-z]\s*/g\s*,\s*["''][A-Za-z]["'']\s*\)'
  - id: js-noop-add-subtract-roundtrip-padding
    desc: Add-then-subtract round trips as padding
    crit: notable
    conf: 0.88
    count_min: 10
    if:
      type: text
      regex: '\(\s*\w+\s*\+\s*\d+\s*\)\s*-\s*\d+'
  - id: js-noop-multiply-divide-roundtrip-padding
    desc: Multiply-then-divide round trips as padding
    crit: notable
    conf: 0.88
    count_min: 8
    if:
      type: text
      regex: '\(\s*\w+\s*\*\s*\d+\s*\)\s*/\s*\d+'
composite_rules:
  - id: js-junk-noop-padding-cluster
    desc: JScript mixes several no-op padding shapes
    crit: suspicious
    conf: 0.92
    any:
      - id: js-noop-self-substring-padding
      - id: js-noop-same-char-replace-padding
      - id: js-noop-add-subtract-roundtrip-padding
      - id: js-noop-multiply-divide-roundtrip-padding
    needs: 2
