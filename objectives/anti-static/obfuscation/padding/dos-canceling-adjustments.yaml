defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 7000
  size_max: 65536
  attack: T1027

traits:
  - id: dos-delta-call-pop-prologue
    desc: DOS code derives position via call-pop
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 'E8 00 00 5D 81 ED 06 01'
  - id: dos-repeated-canceling-bp-adjustments
    desc: DOS code repeats canceling BP adjustments
    crit: suspicious
    conf: 0.99
    count_min: 100
    if:
      type: hex
      pattern: '81 ED 06 01 81 C5 06 01'

composite_rules:
  - id: dos-position-code-canceling-adjustment-padding
    desc: DOS position code uses extensive canceling arithmetic padding
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: dos-delta-call-pop-prologue
      - id: dos-repeated-canceling-bp-adjustments
