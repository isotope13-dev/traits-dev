# JavaScript String Building Obfuscation
# Detects incremental string building patterns typical of JScript malware
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [linux, macos, windows]
traits:
  # High density of small string-appending functions (JScript obfuscation)
  - id: js-dense-string-building
    desc: Dense incremental string building
    crit: notable
    conf: 0.95
    mbc: "B0032"
    attack: "T1027"
    for: [javascript]
    count_min: 3
    if:
      type: text
      # Pattern: function name() { var += 'str'; };
      # The appended operand must not be a number — the matcher stopped at the
      # `+=` and so counted `function P(){r+=1,mt();}`, the reference-counting
      # helpers minified into Otter Blocks' bundled Lottie player, as string
      # building. A string builder appends a literal, an array element or a
      # fromCharCode call; none of those begin with a digit.
      regex: 'function\s+\w+\(\)\s*\{\s*\w+\s*\+=\s*[^\d\s;]'
    unless:
      - type: text
        regex: '__p\s*\+=\s*__j\.call\(arguments'
      - type: text
        substr: 'Function("_","return "+o)(u)'
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/core/lodash/
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: well-known/lib/ui/cheerio/
      - id: well-known/app/publishing/wordpress-plugins/
      - id: well-known/app/publishing/ugcify/
