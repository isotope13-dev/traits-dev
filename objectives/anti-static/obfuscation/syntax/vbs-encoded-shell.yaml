defaults:
  for: [html, vbs]
  platforms: [windows]
traits:
  - id: encoded-shell-progid
    desc: Base64 conceals the WScript.Shell COM class
    crit: suspicious
    conf: 0.99
    if:
      type: encoded
      encoding: base64
      exact: WScript.Shell
      case_insensitive: true
composite_rules:
  - id: vbs-concealed-shell-encoded-powershell
    desc: Concealed shell with encoded PowerShell
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-shell-progid
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/process/interpreter/powershell/command::html-encoded-powershell-command
      - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
