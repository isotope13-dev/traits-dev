defaults:
  platforms: [windows]
  for: [asp]
  attack: T1027

traits:
  # IIS permits a single-line HTML comment inside Classic ASP. An unmatched
  # double quote in that comment confuses some source scanners while IIS
  # still parses the following Execute statement. Require both positions;
  # an ordinary HTML comment, prose, or quoted example is insufficient.
  - id: asp-quote-comment-before-execute
    desc: ASP Execute follows quote-bearing HTML comment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)<%[ \t\r\n]*<!--[ \t]*"[ \t]*-->[ \t\r\n]*Execute[ (\t]'
