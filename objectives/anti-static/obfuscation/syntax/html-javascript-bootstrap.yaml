defaults:
  platforms: [linux, macos, windows]
  for:
    - html
    - scala
    - elixir
  attack: T1027
  mbc: B0032
traits:
  - id: html-large-inline-base64-blob
    desc: Large inline Base64 blob in script
    crit: suspicious
    conf: 0.86
    size_min: 4096
    for: [html, javascript]
    if:
      type: text
      # Base64 output is mixed-case by construction: a long run with no
      # uppercase letter is a dictionary/identifier table (e.g. a bundled
      # autocomplete list), not encoded data. The loop is a cheap prefilter
      # saying what the run has to be; `length_min` below carries the real
      # carrier-scale threshold (the span also covers the short `var _0x..=`
      # prefix, so it sits just above the 1024 run floor).
      regex: 'var\s+_0x[a-f0-9]{4,}\s*=\s*[''"][A-Za-z0-9+/=]*[A-Z][A-Za-z0-9+/=]*'
      length_min: 1040
  - id: html-eval-unescape-decoder
    desc: Evals percent-unescaped JavaScript decoder code
    crit: suspicious
    conf: 0.9
    for: [html, javascript, makefile, text]
    if:
      type: text
      regex: 'eval\s*\(\s*unescape\s*\('
  - id: eval-unescape-percent-payload
    desc: eval of a percent-encoded unescape payload
    crit: suspicious
    conf: 0.96
    for: [html, javascript, makefile]
    if:
      type: text
      regex: 'eval\s*\(\s*unescape\s*\(\s*["''](%[0-9A-Fa-f]{2}){6,}'
  - id: percent-encoded-vbscript-language
    desc: Percent-encoded VBScript language attribute
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)Language(%3[Dd]|=)%22VBScript'
  - id: percent-encoded-execute-call
    desc: Percent-encoded VBScript Execute call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)Execute%20'
  - id: percent-encoded-chr-call
    desc: Percent-encoded VBScript Chr reconstruction
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(Chr%28|Num2Str%20)'
  - id: html-charcode-minus-one-decode
    desc: Subtracts one from each character code
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'fromCharCode\s*\(\s*[A-Za-z_$][\w$]*\s*-\s*1'
  - id: html-encoded-alphabet-indexof-lookup
    desc: Percent-encoded custom-alphabet character lookup
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'indexOf%28[A-Za-z_$][\w$]{0,40}\.charAt%28'
  # js-new-function-constructor is a tree-sitter JavaScript-grammar query --
  # it never runs against an .html-typed file. Pair it with a text-based
  # equivalent so the composite below can still fire on an HTML document
  # whose inline <script> block is only ever scanned as raw text.
  - id: html-new-function-constructor-text
    desc: Script calls new Function constructor
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: 'new\s+Function\s*\('
  - id: jscript-encode-language-attr
    desc: Script tagged as JScript.Encode
    crit: suspicious
    conf: 0.94
    for: [html, javascript, objectivec, scala, vbs, static-lib]
    if:
      type: text
      regex: '(?i)(\b|%[0-9a-f]{2})JScript\.Encode\b'
    unless:
      # CyberChef's operation documents an encoded sample while implementing
      # a decoder. That example is decoded, never executed.
      - type: text
        substr: 'this.name = "Microsoft Script Decoder"'
  - id: jscript-encode-inline-magic
    desc: Inline JScript.Encode start marker
    crit: notable
    conf: 0.9
    for: [html, javascript, objectivec, scala, static-lib, vbs]
    if:
      type: text
      regex: '#@~\^|%23(@|%40)%7[eE]%5[eE]'
  - id: jscript-encode-magic-hex
    desc: Encoded script marker in bytes
    crit: notable
    conf: 0.9
    for: [static-lib, html, data]
    if:
      type: hex
      pattern: "23 40 7E 5E"

composite_rules:
  # The declaration in either corpus: source-typed files carry it as text,
  # opaque data containers only as raw bytes (their '#@~^'-carrying runs are
  # replaced by the decoded layer before text matching).
  - id: vbscript-encode-runtime-declared
    desc: Declares the VBScript.Encode scripting runtime
    crit: notable
    conf: 0.94
    for: [html, javascript, vbs, asp, static-lib, data, makefile]
    platforms: [windows]
    any:
      - id: metadata/lang/runtime::vbscript-encode-runtime-declaration
      - id: metadata/lang/runtime::vbscript-encode-runtime-declaration-bytes

  - id: html-vbscript-encode-payload-hex
    desc: Encoded VBScript body in bytes
    crit: hostile
    conf: 0.95
    for: [static-lib, html, data]
    all:
      - id: vbscript-encode-runtime-declared
      - id: jscript-encode-magic-hex

  - id: html-jscript-encode-payload
    desc: HTML runs an encoded JScript body
    crit: hostile
    conf: 0.95
    for: [html, javascript, vbs, static-lib]
    all:
      - id: jscript-encode-language-attr
      - id: jscript-encode-inline-magic

  - id: html-vbscript-encode-payload
    desc: HTML runs an encoded VBScript body
    crit: hostile
    conf: 0.95
    for: [html, javascript, vbs, static-lib]
    all:
      - id: vbscript-encode-runtime-declared
      - id: jscript-encode-inline-magic
  - id: new-function-constructor-call
    desc: Calls JavaScript's new Function constructor
    crit: notable
    conf: 0.7
    for: [html, javascript]
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
      - id: html-new-function-constructor-text
  - id: html-xor-self-decoding-loader
    for: [html, javascript]
    desc: Self-decoding HTML loader with Base64 blob, XOR routine, and dynamic execution
    crit: suspicious
    conf: 0.98
    all:
      - id: html-large-inline-base64-blob
      # The Base64 decode call is carried by the TextDecoder leg below.
      - id: micro-behaviors/data/encode/xor::js-charcode-xor-operation
      # The former `html-textdecoder-utf8` wrapper lived here and called the
      # decode stage `suspicious` on its own -- but `atob()` -> `Uint8Array`
      # via `charCodeAt` -> `new TextDecoder('utf-8').decode()` is the standard
      # browser way to read embedded UTF-8 JSON, so it convicted every page
      # that ships data inline. The pairing now lives next to the atom as a
      # `notable` micro-behavior; the obfuscation evidence here comes from the
      # blob, XOR and `new Function` legs, and this leg only marks the stage.
      - id: micro-behaviors/data/decode/utf8::textdecoder-utf8-after-byte-decode
      - id: new-function-constructor-call
  - id: browser-base64-xor-document-rewrite-loader
    desc: Base64 XOR document rewrite loader
    crit: hostile
    conf: 0.98
    ref: sha256:2e95c6a1842b99a4045e973126f1b16261cb8f0b89ee9e7c618a6e4d0746d7fd
    for: [javascript]
    all:
      - id: micro-behaviors/data/encode/base64::large-string-assignment
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
      - id: micro-behaviors/ui/window/insert-html::browser-aliased-document-rewrite-call
  - id: html-eval-encoded-decoder-document-writer
    desc: Encoded decoder eval then document write
    crit: hostile
    for: [html]
    conf: 0.98
    all:
      - id: html-eval-unescape-decoder
      - id: html-encoded-alphabet-indexof-lookup
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
  - id: html-unescape-vbs-polyglot-writer
    desc: Unescape writer rebuilds embedded VBScript
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
      - id: percent-encoded-vbscript-language
      - id: percent-encoded-execute-call
  - id: html-unescape-chr-document-writer
    desc: Unescape writer rebuilds Chr-concatenated script
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
      - id: percent-encoded-chr-call
      - id: percent-encoded-execute-call
  - id: html-rot-minus-one-document-writer
    desc: Rot-minus-one decoder writes HTML into the page
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    all:
      - id: html-charcode-minus-one-decode
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
  - id: html-rot-minus-one-tiny-iframe
    desc: Rot-minus-one decoder writes a tiny iframe
    crit: hostile
    conf: 0.96
    attack: T1027,T1189
    all:
      - id: html-charcode-minus-one-decode
      - id: micro-behaviors/ui/window/visibility::tiny-iframe
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
  - id: hta-jscript-encode-loader
    desc: HTA page holds an encoded JScript block
    crit: hostile
    conf: 0.96
    for: [html, javascript, objectivec]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: jscript-encode-language-attr
      - id: jscript-encode-inline-magic
  - id: html-eval-unescape-percent-loader
    desc: Eval rebuilds a page from percent-encoded bytes
    crit: hostile
    for: [html]
    conf: 0.96
    all:
      - id: html-eval-unescape-decoder
      - id: micro-behaviors/data/decode/url::js-percent-byte-unescape
  - id: html-hex-decode-eval-stager
    desc: HTML rebuilds a hex-decoded stage and evals it
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    for: [html]
    all:
      - id: objectives/execution/interpreter/vbscript/loader::eval-variable
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
      - id: micro-behaviors/data/string/conversion::charcodeat-text-expression
      - id: micro-behaviors/data/decode/hex::js-parseint-radix-16
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/web/jquery/
