# Readable command text hidden as octal escapes in a char array, handed to
# popen within the same routine. Printable ASCII has no reason to be written
# as octal except to keep the command from being read; the 2 KB window binds
# the concealed array to the popen call that consumes an identifier.
defaults:
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: c-octal-hidden-command-loader
  desc: Runs an octal-concealed command string through popen
  crit: hostile
  conf: 0.99
  near_bytes: 2048
  for:
  - c
  - cpp
  attack: T1027,T1059.004
  all:
  - id: micro-behaviors/data/encode/char-code::c-octal-printable-ascii-run
  - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
  - id: micro-behaviors/data/buffer/alloc::c-command-buffer
