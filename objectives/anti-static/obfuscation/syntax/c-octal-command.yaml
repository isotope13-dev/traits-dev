# An octal string literal, command buffer and popen coexist in one source file.
# Their dataflow is not established, so this is obfuscation context.
defaults:
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: c-octal-hidden-command-loader
  desc: Octal string escapes near native shell call
  crit: suspicious
  conf: 0.99
  for:
  - c
  - cpp
  attack: T1027,T1059.004
  all:
  - id: micro-behaviors/data/encode/char-code::c-octal-escape-sequence
  - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
  - id: micro-behaviors/data/buffer/alloc::c-command-buffer
