# Unicode Obfuscation in JScript
# Detects heavy use of Unicode escapes in identifiers and property access
defaults:
  platforms: [linux, macos, windows]
  crit: suspicious
  conf: 0.9
  for: [javascript]
traits:
  - id: emoji-saturated-source
    desc: Dense emoji distribution in source
    crit: suspicious
    conf: 0.96
    for: [scripts, source]
    count_min: 20
    per_kb_min: 8.0
    if:
      type: text
      regex: '[\x{2600}-\x{27BF}\x{1F000}-\x{1FAFF}]'
    unless:
      # These are data-only/generated package members, not emoji-based
      # obfuscation. Keep the exception tied to the package path and cover
      # both standalone Prettier distributions.
      - type: path
        regex: '(^|[\\/])node_modules[\\/]emojis-list[\\/]index\.js(?:$|[!#])'
      - type: path
        regex: '(^|[\\/])node_modules[\\/]prettier[\\/](standalone\.js|esm[\\/]standalone\.mjs)(?:$|[!#])'
      - id: metadata/file/invisible-unicode::emoji-library-table-text
      - id: metadata/file/invisible-unicode::emoji-logger-icons-text
      - id: metadata/file/invisible-unicode::warning-emoji-log-text
      - id: metadata/file/invisible-unicode::node-emoji-package-text
      - id: metadata/package/documentation/

  - id: js-unicode-escaped-identifiers
    desc: "Repeated Unicode-escaped identifiers in source"
    # Require multiple real source lines. A broad unanchored search also
    # matches escaped snippets embedded in HTML test fixtures and strings;
    # one such fixture is language coverage, not identifier obfuscation.
    if:
      type: text
      # Matches var \uXXXX where \u is literal text in the source
      regex: '(?m)^[ \t]*(var|function)\s+\\\\u[0-9a-fA-F]{4}'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: js-activex-via-this-obfuscated
    desc: "ActiveXObject accessed via 'this' w/ obf"
    if:
      type: text
      # Matches this[{...:'\uXXXX'}. where \u is literal text in the source
      regex: 'this\[\s*\{[^:]{1,120}:[''"]\\\\u[0-9a-fA-F]{4}[''"]\}\.'

composite_rules:
  - id: emoji-saturated-staged-execution
    desc: Emoji-saturated source writes a file and launches a process
    crit: hostile
    conf: 0.97
    attack: T1027,T1059
    near_lines: 80
    all:
      - id: emoji-saturated-source
      - id: micro-behaviors/fs/write/
      - id: micro-behaviors/process/create/shell/
