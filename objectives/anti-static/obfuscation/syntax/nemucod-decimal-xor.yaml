# Decimal-XOR syntax and ActiveX context are supported. No downloaded data,
# file write or payload activation is required by this predicate.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: nemucod-decimal-xor-activex-profile
    desc: Nemucod decimal XOR near ActiveX clues
    crit: suspicious
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/syntax::js-decimal-xor-loop
      - id: micro-behaviors/process/interpreter/jscript::activex-object
    any:
      - id: micro-behaviors/data/encode/string::decimal-string-blob
      - id: metadata/lang/javascript-features::js-comma-sequence-count-5
