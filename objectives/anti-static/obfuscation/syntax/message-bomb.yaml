defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1027,T1499.003"

composite_rules:
  # The huge button/object collection is concealed behind a custom string
  # decoder, computed constructor/property calls, and anti-analysis breakpoints.
  - id: javascript-concealed-message-object-bomb
    desc: Custom-obfuscated JavaScript conceals a messaging object bomb
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/impact/dos/social-platform::javascript-obfuscated-message-object-bomb
      - id: micro-behaviors/data/source/property/computed::js-computed-constructor
      - id: micro-behaviors/process/debug/event::debugger-statement
    near_bytes: 200000
