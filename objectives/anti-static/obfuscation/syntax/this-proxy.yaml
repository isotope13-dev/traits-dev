defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
traits:
  - id: js-new-this-bracket
    desc: "Direct computed 'this' constructor"
    crit: suspicious
    conf: 0.9
    mbc: "B0032"
    attack: "T1027"
    # Match a direct computed constructor call. Chained browser-realm
    # constructors such as `new this[PropertySymbol.window].TypeError(...)`
    # are ordinary DOM emulation and are not this anti-static shape.
    if:
      type: text
      regex: 'new\s+this\s*\[[^\]\n]{1,120}\]\s*\('
    unless:
      - id: micro-behaviors/data/archive/library/
      - id: metadata/build/recognized-contexts/
      - id: metadata/library/structure/
      - id: well-known/app/development/
      - id: well-known/tool/development/
      - id: well-known/lib/runtime/datadome/
      - id: well-known/app/communication/
  - id: js-this-bracket-access
    desc: "Property access on 'this' via bracket notation"
    crit: suspicious
    conf: 0.8
    if:
      type: tree-sitter
      language: javascript
      # Matches: this[...] - bracket notation on 'this'
      query: |
        (subscript_expression
          object: (this)
        )
    unless:
      - id: metadata/library/jquery::domain
      - id: metadata/library/prototype::copyright
composite_rules:
  - id: js-this-global-proxy
    desc: Use of 'this' to proxy global object access for obfuscation
    crit: suspicious
    any:
      - id: js-new-this-bracket
      - id: js-this-bracket-access
    # Bundler/minifier output commonly uses bracketed `this` access for module
    # wrappers and generated helpers. Keep the stronger anti-static indicators
    # visible, but do not treat this generic shape alone as suspicious there.
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
