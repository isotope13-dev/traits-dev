defaults:
  for: [html]
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.97
  attack: T1027
composite_rules:
  - id: embedded-zip-concealed-dom-dispatch
    desc: ZIP decoding with concealed DOM dispatch
    all:
      - id: metadata/file/encoding::base64-zip-string-assignment
      - id: micro-behaviors/data/buffer/alloc::blob-construction
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-document-call
      - id: metadata/lang/encoding::javascript-hex-escape-string-table
