defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
traits:
  - id: js-comment-injection-member
    desc: JS comment injected in member access
    crit: component
    if:
      type: text
      regex: '\.\s*/\*[A-Za-z_$][A-Za-z0-9_$]{0,24}\*/\s*\w+'
    not:
      - regex: 'istanbul ignore'
      - regex: '@class'
      - regex: '@internal'
      # tsc declaration emit marks elided type arguments with /*elided*/
      # (e.g. readonly [/*elided*/ any, .../*elided*/ any[]]); a compiler
      # marker in generated .d.ts, not an obfuscator splitting syntax.
      - regex: 'elided'
      # The Svelte compiler emits `/*varname*/ ctx[N]` before every access to
      # its internal component-state array, to keep compiled output readable
      # for source maps/devtools. It reliably shows up as `.../*name*/ ctx`,
      # `[/*name*/ ctx[N]`, etc. across any Svelte app's build output -- a
      # compiler identifier label, not split syntax concealing intent.
      - regex: '\*/\s*ctx\b'
  - id: js-comment-injection-call
    desc: JS comment injected before function call
    crit: notable
    if:
      type: text
      regex: '\w+\s*/\*[A-Za-z_$][A-Za-z0-9_$]{0,24}\*/\s*\('
    not:
      - regex: 'istanbul ignore'
      - regex: '@class'
      - regex: '@internal'
      # tsc declaration emit marks elided type arguments with /*elided*/
      # (e.g. readonly [/*elided*/ any, .../*elided*/ any[]]); a compiler
      # marker in generated .d.ts, not an obfuscator splitting syntax.
      - regex: 'elided'
      # The Svelte compiler emits `/*varname*/ ctx[N]` before every access to
      # its internal component-state array, to keep compiled output readable
      # for source maps/devtools. It reliably shows up as `.../*name*/ ctx`,
      # `[/*name*/ ctx[N]`, etc. across any Svelte app's build output -- a
      # compiler identifier label, not split syntax concealing intent.
      - regex: '\*/\s*ctx\b'
  - id: js-comment-injection-index
    desc: JS comment injected in index access
    crit: component
    if:
      type: text
      regex: '\[\s*/\*[A-Za-z_$][A-Za-z0-9_$]{0,24}\*/\s*'
    not:
      - regex: 'istanbul ignore'
      - regex: '@class'
      - regex: '@internal'
      # tsc declaration emit marks elided type arguments with /*elided*/
      # (e.g. readonly [/*elided*/ any, .../*elided*/ any[]]); a compiler
      # marker in generated .d.ts, not an obfuscator splitting syntax.
      - regex: 'elided'
      # The Svelte compiler emits `/*varname*/ ctx[N]` before every access to
      # its internal component-state array, to keep compiled output readable
      # for source maps/devtools. It reliably shows up as `.../*name*/ ctx`,
      # `[/*name*/ ctx[N]`, etc. across any Svelte app's build output -- a
      # compiler identifier label, not split syntax concealing intent.
      - regex: '\*/\s*ctx\b'
composite_rules:
  - id: js-comment-injection
    desc: Comments injected in JS syntax positions
    crit: suspicious
    needs: 2
    any:
      - id: js-comment-injection-member
      - id: js-comment-injection-call
      - id: js-comment-injection-index
    unless:
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
