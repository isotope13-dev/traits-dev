defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: obfuscated-js-wsf-remote-ps1-downloader
    desc: Obfuscated WSF JScript remote PS1 downloader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105
    platforms: [windows]
    all:
      - id: metadata/lang/source/naming::hex-identifier-population
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-http-variants
      - id: micro-behaviors/communications/http/url/path::executable-url-reference-b
      - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
    any:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-prga-output
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
    needs: 1
