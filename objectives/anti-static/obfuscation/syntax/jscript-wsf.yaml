defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027
  mbc: B0032

traits:
  - id: xml-wsf-hex-index-obfuscation
    desc: Obfuscated JScript hexadecimal index table
    crit: suspicious
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '\b_0x[0-9a-f]{3,}\b'

composite_rules:
  - id: obfuscated-js-wsf-remote-ps1-downloader
    desc: Obfuscated WSF JScript remote PS1 downloader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105
    all:
      - id: xml-wsf-hex-index-obfuscation
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
    any:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-prga-output
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
    needs: 1
