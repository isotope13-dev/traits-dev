defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.94
traits:
  - id: escaped-junk-expression-statement
    desc: Discarded punctuation-escaped string expression
    unless:
      # Formatter and parser test fixtures exercise escaped-quote edge cases
      # on purpose (prettier-style specs, snapshots); the shape there records
      # a syntax corner, not concealed code. Same guards as the sibling
      # image-extension-script-source resource trait.
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/
    if:
      type: text
      # Standalone discarded strings, not assigned alphabets or HTML attributes.
      regex: '[;{]\s*["'']([A-Za-z0-9&]{0,8}\\[^\w\s]){3,}[A-Za-z0-9]{0,8}["''][;,}]'
