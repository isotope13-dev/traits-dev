defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
  attack: T1027
composite_rules:
  - id: numeric-dictionary-escaped-script
    desc: Packed script uses numeric escape dictionary
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
      - id: metadata/lang/encoding::numeric-escape-octal-dictionary
