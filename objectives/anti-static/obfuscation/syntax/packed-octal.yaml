defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
  attack: T1027
traits:
  - id: numeric-dictionary-escaped-script
    desc: Numeric dictionary hides escaped script
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "(\\\\\\\\[0-9]{1,3}){80,}.{0,80}',[0-9]+,[0-9]+,'([0-7]{3}\\|){8,}"
