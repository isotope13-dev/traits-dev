defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  # Replacing the word "object" with "al" in this fragment spells "rn eval".
  # The source may obtain "object" through typeof; do not assert that binding
  # or runtime success from this text pattern alone.
  - id: js-eval-name-object-substitution
    desc: Substitution disguises an eval-name fragment
    crit: suspicious
    conf: 0.97
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: '["'']rn evobject["'']\.replace\(\s*[\w$]+\s*,\s*["'']al["'']\s*\)'
      exclude_html_comments: true
