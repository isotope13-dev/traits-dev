defaults:
  for: [html]
  platforms: [windows, unix]
  conf: 0.99
composite_rules:
  - id: decimal-hidden-external-iframe-injection
    desc: Character decoder writes an invisible external iframe
    crit: hostile
    attack: T1027,T1189
    all:
      - id: metadata/file/encoding::decimal-delimited-iframe-opener
      - id: metadata/file/encoding::decimal-delimited-http-prefix
      - id: metadata/file/encoding::decimal-delimited-opacity-zero
      - id: micro-behaviors/data/decode/charset::indexed-charcode-array-decode
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
    near_bytes: 4096
