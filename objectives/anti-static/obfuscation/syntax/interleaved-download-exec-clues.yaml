defaults:
  platforms: [linux]
  for: [elf]
  crit: component
  conf: 0.86


composite_rules:
  - id: interleaved-download-exec-clues
    desc: Interleaved downloader, chmod and shell text
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/lang/source/literal/fragment/sequence::interleaved-chmod-token
      - id: metadata/lang/source/literal/fragment/sequence::interleaved-bin-sh-token
    any:
      - id: metadata/lang/source/literal/fragment/sequence::interleaved-wget-token
      - id: metadata/lang/source/literal/fragment/sequence::interleaved-tftp-token
    needs: 1
    unless:
      - id: well-known/app/media/shotwell::shotwell-package-member
