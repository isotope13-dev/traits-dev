defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027
traits:
  - id: powershell-junk-comments
    desc: 'Repeated PS block comments (junk obfuscation)'
    crit: suspicious
    conf: 0.85
    count_min: 3
    if:
      type: text
      # Short block comments used to break signatures carry a digit.
      # A word label such as <#case#> is source structure, not junk.
      regex: '(?i)<\#[a-z]*[0-9][a-z0-9]{0,4}\#>'
