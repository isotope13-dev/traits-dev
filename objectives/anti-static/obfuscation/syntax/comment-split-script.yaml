defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
composite_rules:
  # Scheme fragmentation plus script creation/source assembly supports
  # concealment. It does not alone establish compromise or credential theft.
  - id: comment-split-scheme-with-script-assembly
    desc: Comment-split scheme near script-source assembly
    crit: suspicious
    conf: 0.94
    near_bytes: 3200
    all:
      - id: micro-behaviors/communications/url/construction/fragment::comment-split-https-scheme
      - id: micro-behaviors/data/collection/dom::script-element-create
      - id: micro-behaviors/data/property/assign::joined-empty-src-property
