defaults:
  attack: T1027
  mbc: B0032
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

composite_rules:
  - id: repeated-iife-string-literal-return
    desc: Repeated IIFEs return string literals
    crit: suspicious
    conf: 0.9
    # TypeScript/TSX source commonly contains inline callbacks that the
    # parser projects as this shape; compiled JavaScript retains the signal
    # for obfuscated bundles without flagging ordinary source structure.
    for: [javascript]
    all:
      - id: micro-behaviors/data/source/function/return::iife-string-literal-return
    unless:
      - id: well-known/lib/web/rxjs::rxjs-websocket-constructor-error
      - id: well-known/lib/web/rxjs::rxjs-cold-observable-offset-error
      - id: metadata/build/
