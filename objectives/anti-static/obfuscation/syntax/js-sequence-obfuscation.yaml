defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
traits:
  # The AST shape on its own trusts the parse. When tree-sitter recovers from
  # an error it re-anchors mid-expression and projects an ordinary call's
  # argument list as a parenthesized sequence — the `.stx` exclusion below was
  # the first sighting, and the ThemeIsle SDK's minified promo bundle inside
  # Otter Blocks is another: `void p("themeisle_sdk_promotions_neve_installed",
  # !0).then(…)` is a two-argument call, and a paren-matching scan of that file
  # finds zero genuine string-leading sequences. So the shape is now one half
  # of the finding, corroborated by the syntax leg below.
  - id: js-string-sequence-ast
    desc: "String-leading sequence expression node"
    crit: component
    conf: 0.95
    size_max: 500000
    if:
      type: tree-sitter
      language: javascript
      query: |
        [
          (member_expression
            object: (parenthesized_expression
              (sequence_expression
                (string)
                (_)
              )
            )
          )
          (subscript_expression
            object: (parenthesized_expression
              (sequence_expression
                (string)
                (_)
              )
            )
          )
        ] @seq_expr
    unless:
      # STX templates are heuristically classified as JavaScript; their
      # template syntax can project ordinary calls as sequence expressions.
      - type: basename
        regex: '\.stx$'
      - id: metadata/package/documentation/manpage::unix-manpage

  # The syntactic half: a `(` that opens a real parenthesized expression rather
  # than an argument list. A callee ends in an identifier character, `)` or
  # `]`, so requiring an operator, an opening bracket, or `return`/`void`
  # immediately before the paren separates `("a",b).c` from `f("a",b).c`.
  - id: js-string-sequence-syntax
    desc: "Parenthesized string sequence, not a call"
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '([=;:{,&|!?(\[+]|\breturn|\bvoid)\s{0,4}\(\s*["''][^"'']{0,40}["'']\s*,'

  - id: comma-tuple-map-append
    desc: 'JS comma-operator tuple concatenation'
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\(\d+,\s*\d+,\s*\w+\)\s*\+\s*\(\d+,\s*\d+,\s*\w+\[\w+\]\)'

composite_rules:
  # Keeps the id the Nemucod signatures reference. No proximity constraint:
  # the two legs are different views of the file, and requiring a genuine
  # parenthesized string sequence anywhere in it is already enough to drop a
  # bundle whose only "sequences" are argument lists.
  - id: js-sequence-expression-obfuscation
    desc: "String-leading sequence member access"
    crit: notable
    conf: 0.95
    all:
      - id: js-string-sequence-ast
      - id: js-string-sequence-syntax
