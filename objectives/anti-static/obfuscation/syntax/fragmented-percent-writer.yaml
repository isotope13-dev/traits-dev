defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1027
  crit: suspicious
  conf: 0.95
composite_rules:
  - id: fragmented-percent-document-writer
    desc: Conceals DOM output in many percent fragments
    all:
      - id: micro-behaviors/data/reassembly::repeated-percent-decode-concatenation
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
    near_bytes: 2048
