defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
composite_rules:
  - id: split-string-redirect-assembly
    desc: Page assembles atob, location and URL from fragments
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/lang/source/literal/fragment/sequence::base64-fragment-array-reduce
      - id: metadata/lang/source/literal/fragment/sequence::atob-name-joined-from-letters
      - id: metadata/lang/source/literal/fragment/sequence::location-name-joined-from-parts
      - id: micro-behaviors/ui/window/navigation/location::window-bracket-href-assignment
