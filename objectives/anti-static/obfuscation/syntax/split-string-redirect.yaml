defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
composite_rules:
  - id: split-string-redirect-assembly
    desc: Page assembles atob, location and URL from fragments
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/navigation::base64-fragment-array-reduce
      - id: micro-behaviors/ui/window/navigation::atob-name-joined-from-letters
      - id: micro-behaviors/ui/window/navigation::location-name-joined-from-parts
      - id: micro-behaviors/ui/window/navigation::window-bracket-href-assignment
