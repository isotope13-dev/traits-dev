defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
  # Control-flow flattening is anti-analysis; without a payload leg it is
  # notable rather than evidence of malicious intent.
  crit: notable
  attack: "T1027"
traits:
  - id: js-while-switch-state-machine
    desc: While/switch state machine pattern
    conf: 0.85
    count_min: 3
    # Cryxos-style WSH droppers embed megabytes of unicode-escaped string
    # tables around a compact while/switch dispatcher; keep the pattern
    # available on those large single-file scripts.
    size_max: 2000000
    if:
      type: text
      regex: 'while\s*\([^)]{0,50}\)\s*(\{)?\s*switch\s*\('
    unless:
      - id: metadata/build/bundler/
      - id: metadata/library/structure::js-known-bundler-output
      - id: well-known/lib/format/protocol-buffers-schema::source-parser-marker
      - id: well-known/lib/ui/ace-editor::ace-worker-bundle
      - id: metadata/library/generated::box-extract-progress-context
      # Some production webpack runtimes omit their marker identifiers but
      # retain this chunk-loader bootstrap shape.
      - type: text
        regex: '(?s)hasOwnProperty\.call\(.{0,300}while\s*\(\w+\.length\)\s*\w+\.shift\(\)'
      - id: metadata/library/structure::dart-flutter-js-bundle
      - id: well-known/lib/web/nextjs/
      - id: well-known/app/ai/pinokio::app-bundle

  # Single while/switch dispatcher (count_min 1). Pair only with strong
  # companions such as unicode-escape volume and alphabet offset decoding;
  # do not treat this atom as hostile on its own.
  - id: js-while-switch-dispatcher
    desc: While/switch control-flow dispatcher
    conf: 0.8
    count_min: 1
    size_max: 2000000
    if:
      type: text
      regex: 'while\s*\([^)]{0,50}\)\s*(\{)?\s*switch\s*\('
    unless:
      - id: metadata/build/bundler/
      - id: metadata/library/structure::js-known-bundler-output
      - id: well-known/lib/format/protocol-buffers-schema::source-parser-marker
      - id: well-known/lib/ui/ace-editor::ace-worker-bundle
      - id: metadata/library/generated::box-extract-progress-context
      - type: text
        regex: '(?s)hasOwnProperty\.call\(.{0,300}while\s*\(\w+\.length\)\s*\w+\.shift\(\)'
      - id: metadata/library/structure::dart-flutter-js-bundle
      - id: well-known/lib/web/nextjs/
      - id: well-known/app/ai/pinokio::app-bundle
