defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: suspicious
  conf: 0.96
traits:
  - id: computed-document-base64-insertion
    desc: Computed document call decodes Base64 data
    if:
      type: text
      exclude_html_comments: true
      regex: '\bdocument\[[^;\r\n]{1,80}\+[^;\r\n]{1,80}\]\(unescape\(atob\('
