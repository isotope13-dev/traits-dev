defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
  mbc: B0032
composite_rules:
  - id: js-obfuscated-com-overwrite
    desc: Obfuscated COM constructor paired with overwrite-style call
    crit: hostile
    conf: 0.92
    attack: T1027,T1106
    all:
      - id: micro-behaviors/process/interpreter/jscript::activex-object-decoder-progid
      - id: micro-behaviors/data/control-flow/dispatch::computed-call-two-argument
  - id: js-wsh-layered-hidden-powershell-loader
    desc: Obfuscated WSH script creates a file for hidden PowerShell execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.007,T1564.003
    all:
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
      - id: objectives/execution/interpreter/script/wsh::powershell-bypass-hidden
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: metadata/file/line::single-long-line

  # High-volume unicode escapes plus alphabet offset decoding feeding
  # dynamic WScript[...] access — Cryxos-style lure scripts without relying
  # solely on control-flow flattening size gates.
  - id: js-wscript-unicode-alphabet-obfuscation
    desc: Dynamic WScript with unicode alphabet offset decoding
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007,T1140
    all:
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
      - id: metadata/lang/encoded/unicode-escape::javascript-unicode-escape-volume
      - id: micro-behaviors/data/decode/custom::js-charat-charcodeat-alphabet-offset
    unless:
      - id: metadata/build/bundler/
