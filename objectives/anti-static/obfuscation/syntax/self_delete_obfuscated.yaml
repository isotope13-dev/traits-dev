defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.8
  for: [javascript]
traits:
  - id: js-deletefile-obfuscated
    desc: Obfuscated DeleteFile reference
    if:
      type: encoded
      regex: '\{[^:{]{1,200}:[''"]D[''"]\}\.[a-zA-Z0-9_$]+\+\{[^:{]{1,200}:[''"]e[''"]\}'
  - id: js-scriptfullname-obfuscated
    desc: Obfuscated ScriptFullName reference
    if:
      type: encoded
      regex: '\{[^:{]{1,200}:[''"]S[''"]\}\.[a-zA-Z0-9_$]+\+\{[^:{]{1,200}:[''"]c[''"]\}'
composite_rules: []
