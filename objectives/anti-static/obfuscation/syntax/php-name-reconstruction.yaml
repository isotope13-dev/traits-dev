# A PHP request handler whose own function names are assembled at run time.
#
# This is what a grafted web-shell looks like once the author has stopped
# caring about size: a WordPress core file, unmodified for a thousand lines,
# with a block at the bottom that builds `create_function` and `base64_decode`
# out of a scrambled alphabet, reads a request parameter whose name is built
# the same way, compiles it and exits before the real page renders.
#
# The legs are deliberately about construction rather than the names being
# constructed -- the next variant will pick a different alphabet, a different
# pair of functions, and a different superglobal.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1027,T1505.003
  mbc: B0032

composite_rules:
  - id: php-reconstructed-name-request-handler
    desc: Request handler builds its own call names
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/superglobal::request-dup
    any:
      - id: micro-behaviors/data/string/assembly::php-char-table-index-builder
      - id: micro-behaviors/data/string/assembly::php-single-char-literal-chain
      - id: micro-behaviors/data/string/assembly::php-junk-block-comment
    needs: 2

  - id: php-name-reconstruction-cluster
    desc: PHP assembles names from character tables
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/string/assembly::php-char-table-index-builder
      - id: micro-behaviors/data/string/assembly::php-single-char-literal-chain
