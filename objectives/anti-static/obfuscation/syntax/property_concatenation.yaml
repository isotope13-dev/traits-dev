# Property Concatenation Obfuscation
# Detects string construction using object property access {k:'v'}.k
defaults:
  platforms: [linux, macos, windows]
  crit: suspicious
  conf: 0.9
  for: [javascript]
traits:
  - id: js-property-concatenation-obfuscation
    desc: JavaScript object-property string access
    mbc: "B0032.001"
    if:
      type: text
      # Require a path/URL-ish character in the string value so build-time
      # define stubs such as {IS_KIBANA_DISTRIBUTABLE:"true"}.NODE_DEBUG
      # (process.env replacement) are not scored as string obfuscation.
      regex: '([=(,:;])\{[A-Za-z_$]\w*:\s*[''"][\w]*[./:$-][\w./:$-]{2,38}[''"]\}\.\w+'
    unless:
      - type: text
        regex: '\{\s*content\s*:'
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/fixture::snapshot-file
