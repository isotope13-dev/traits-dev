defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.8
  for: [javascript]
traits:
  - id: js-split-custom-delimiter
    desc: "Split with custom delimiter"
    crit: component
    if:
      type: text
      # Matches .split("^") or .split("@") or other non-alphanumeric delimiters
      # Excludes common delimiters: = , . : ; / _ | - ` \ # * ~
      regex: '\.split\(\s*["''][^a-zA-Z0-9\s=,.:;/_|#*~`\\?&-]["'']\s*\)'
    not:
      - substr: .split('+')
      - substr: .split("+")
      - substr: .split('@')
      - substr: .split("@")
      - substr: .split('(')
      - substr: .split(']')
      - substr: .split("·")
      - substr: .split('·')
      - substr: "query.includes('@')"
      - regex: (^|[\\/]).+\.map$
  - id: js-split-string-property-quad
    desc: Four-part computed property concatenation
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\[\s*"[^"]{1,24}"\s*\+\s*"[^"]{1,24}"\s*\+\s*"[^"]{1,24}"\s*\+\s*"[^"]{1,24}"\s*\]'
    unless:
      - id: well-known/app/nodpy::nodpy-package-context
      - id: well-known/lib/regula-facesdk::official-face-components-context
  - id: js-empty-string-separator-concat
    desc: HTTP scheme split with empty string
    crit: suspicious
    conf: 0.9
    attack: T1027
    if:
      # Restrict this structural pattern to executable expressions.  The raw
      # text matcher also sees comments, where examples such as
      # `"a" + "" + "b"` are ordinary documentation and not obfuscation.
      type: tree-sitter
      kind: binary_op
      # `"ht" + "" + "tps"` is a URL-scheme split; generic generated
      # expressions such as AJV's `" " + "" + " if "` are not.
      regex: '(?i)["'']ht[^"'']{0,2}["'']\s*\+\s*["'']["'']\s*\+\s*["'']t[^"'']{0,8}["'']'
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: well-known/app/browser-extension-known::metamask-official-manifest
