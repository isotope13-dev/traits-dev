defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-charcode-activex-profile
    desc: HTA char-code ActiveX reconstruction
    crit: suspicious
    conf: 0.96
    attack: T1027
    for: [html]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: micro-behaviors/os/com/automation::script-computed-activex-object
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
