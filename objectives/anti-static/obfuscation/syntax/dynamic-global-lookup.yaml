# Dynamic Global Lookup
# Detects obfuscated access to global properties (like ActiveXObject) via array operations
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.8
  for: [javascript]
traits:
- id: js-computed-constructor-from-numeric-decoder
  desc: Constructor selected by a numeric-array decoder
  crit: suspicious
  conf: 0.95
  attack: T1027
  # Covers `new scope[decode([..])](arg)`. Requiring a numeric array inside
  # the computed constructor keeps ordinary indexed object access out.
  if:
    type: text
    regex: 'new\s+[A-Za-z_$][\w$]*\s*\[\s*[A-Za-z_$][\w$]*\s*\(\s*\[[0-9,\s]{12,}\]\s*\)\s*\]\s*\('
- id: js-array-first-char-join
  desc: String array first characters joined
  crit: notable
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: '\b\w+\.map\(\s*\(?\s*\w+\s*\)?\s*=>\s*\w+\[0\]\s*\)\.join\([''"]{0,2}\)'

- id: js-eval-word-vertex
  desc: Eval initial word vertex
  crit: component
  conf: 0.92
  if:
    type: literal
    exact: vertex
- id: js-eval-word-alpha
  desc: Eval initial word alpha
  crit: component
  conf: 0.92
  if:
    type: literal
    exact: alpha
- id: js-eval-word-echo
  desc: Eval initial word echo
  crit: component
  conf: 0.92
  if:
    type: literal
    exact: echo
composite_rules:
- id: js-dynamic-global-constructor-chain
  desc: Dynamic global COM constructor chain
  crit: suspicious
  conf: 0.94
  attack: T1027
  all:
  - id: micro-behaviors/data/property/access::js-this-bracket-array-shift-pop
  - id: micro-behaviors/data/string/split::javascript-popped-value-split
  - id: metadata/lang/javascript-features::js-new-from-first-elements
- id: js-char-stacked-global-eval
  desc: JavaScript builds eval from word initials
  crit: hostile
  conf: 0.97
  attack: T1027
  all:
  - id: micro-behaviors/data/control-flow/dispatch/computed::globalthis-computed-property-call
  - id: js-array-first-char-join
  any:
  - id: js-eval-initial-words
  - id: metadata/lang/encoding::js-dense-hex-escapes
- id: js-aes-decrypt-then-global-dispatch
  desc: AES-decrypted payload run via global dispatch
  crit: hostile
  conf: 0.96
  attack: T1027.013
  for: [javascript, typescript]
  # The decrypted text has to be what gets dispatched. A multi-megabyte
  # bundle can contain a passphrase PEM decipher and an unrelated
  # globalThis slot hundreds of kilobytes apart; file-wide co-occurrence
  # is not that handoff.
  near_bytes: 4096
  all:
  - id: micro-behaviors/crypto/decrypt::createDecipheriv
  - id: micro-behaviors/data/control-flow/dispatch/computed::globalthis-computed-property-call
  unless:
    # A file exporting cipher factories implements the Node crypto surface
    # for its consumers (provider shim or polyfill) instead of decrypting a
    # payload of its own.
    - id: metadata/lang/source/syntax/assignment::cipher-factory-named-export-assignment
    - id: metadata/lang/source/syntax/assignment::hash-factory-named-export-assignment
    - id: metadata/lang/source/syntax/assignment::signature-factory-named-export-assignment
    # Passphrase-protected PEM private-key decryption (ssh2/openpgp style,
    # for broker or deploy credentials) is key management: the decipher
    # yields key material that is imported, not dispatched.
    - id: micro-behaviors/crypto/symmetric/decrypt::pem-key-decrypt-context
- id: js-eval-initial-words
  desc: Words whose initials spell eval
  crit: baseline
  conf: 0.92
  attack: T1027
  all:
  - id: metadata/lang/scripted::length-prop
  - id: js-array-first-char-join
  - id: js-eval-word-vertex
  - id: js-eval-word-alpha
  - id: js-eval-word-echo
  near_bytes: 4096
