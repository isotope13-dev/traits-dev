defaults:
  for: [javascript]
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  crit: suspicious
  conf: 0.9
  attack: T1027
  mbc: B0032
traits:
- id: dunder-token-array-initializer
  desc: Array begins with repeated dunder tokens
  crit: suspicious
  conf: 0.9
  platforms: [unix, windows]
  if:
    type: text
    # A single key such as a media URL's `__vid` parameter is ordinary data.
    # Nemucod's dictionary loader uses a run of these tokens as an index table.
    regex: 'var\s+\w+\s*=\s*\["__\w{2,4}"\s*,\s*"__\w{2,4}"'
composite_rules:
- id: js-array-literal-obfuscation
  desc: Obfuscation using indexed array literals
  crit: notable
  all:
  - id: micro-behaviors/data/property/access::comma-brackets-numeric-indexing
  - id: objectives/anti-static/obfuscation/syntax::js-array-dynamic-execution
  unless:
  - id: well-known/tool/development/agent/kilocode::kilo-code-js-bundle
  - id: metadata/build
