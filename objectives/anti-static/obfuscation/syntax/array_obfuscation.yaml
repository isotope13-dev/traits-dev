defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: suspicious
  conf: 0.9
  attack: T1027
  mbc: B0032
composite_rules:
  - id: js-array-literal-obfuscation
    desc: Obfuscation using indexed array literals
    crit: notable
    for: [javascript]
    all:
      - id: micro-behaviors/data/source/syntax/array::array-literal-indexing
      - id: objectives/anti-static/obfuscation/syntax::js-array-dynamic-execution
    unless:
      - id: metadata/library/structure::dart-flutter-js-bundle
      - id: well-known/app/development/kilocode::kilo-code-js-bundle
      - id: metadata/library/structure/
