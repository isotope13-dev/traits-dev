defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.8
  for: [javascript]
traits:
  - id: js-obfuscated-increment
    desc: "Obfuscated increment/decrement via arithmetic"
    crit: suspicious
    conf: 0.8
    # Repeated single-digit offsets stand in for ++/-- ((-1 + 2)). A
    # two-sided offset such as (-90 + 120) is angle or coordinate math.
    # One occurrence is ordinary arithmetic. Large minified bundles are
    # not a reliable place to infer obfuscation.
    count_min: 2
    if:
      type: text
      regex: '\(-\d\s*\+\s*\d+\)'
    unless:
      - type: basename
        regex: '^gc\.spread\.'
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/file/format/source-map::sourcemap-context
      - id: well-known/lib/web/client-side/browser-libraries::pegjs-generated-parser
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
      - id: metadata/package/testing/presence/fixture::package-test-tree-member
      - id: metadata/package/testing/presence/harness::test-directory
