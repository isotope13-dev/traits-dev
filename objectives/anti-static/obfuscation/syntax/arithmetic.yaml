defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.8
  for: [javascript]
traits:
  - id: js-obfuscated-increment
    desc: "Obfuscated increment/decrement via arithmetic"
    crit: suspicious
    conf: 0.8
    # One negative-plus-positive expression is common timestamp/date math
    # (for example, a Unix-epoch offset). Repeated occurrences are the useful
    # obfuscation signal and avoid classifying ordinary test arithmetic.
    count_min: 2
    if:
      type: text
      regex: '\(-\d+\s*\+\s*\d+\)'
