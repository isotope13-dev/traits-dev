defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.8
  for: [javascript]
traits:
  - id: js-obfuscated-increment
    desc: "Obfuscated increment/decrement via arithmetic"
    crit: suspicious
    conf: 0.8
    # One negative-plus-positive expression is common timestamp/date math
    # (for example, a Unix-epoch offset). Repeated occurrences are the useful
    # obfuscation signal and avoid classifying ordinary test arithmetic. A
    # large minified bundle is also not a reliable place to infer obfuscation:
    # examples and source-map content routinely contain this expression.
    count_min: 2
    if:
      type: text
      regex: '\(-\d+\s*\+\s*\d+\)'
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/file/format/structured::sourcemap-context
      - id: metadata/library/browser-parser::pegjs-generated-parser
