defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs]
  crit: suspicious
  attack: T1027
traits:
  - id: cmd-caret-split-command-token
    desc: CMD command token split by caret escapes
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bcmd(\.exe)?[^\r\n]{0,160}\b([a-z]\^{1,4}){4,32}[a-z]\b'
  - id: cmd-caret-split-binary-token
    desc: Caret-split command token in PE code section
    crit: suspicious
    for: [pe]
    conf: 0.9
    if:
      type: text
      regex: '\b([A-Za-z]\^{1,4}){4,32}[A-Za-z]\b'
      section: .text
    unless:
      - id: metadata/binary/framework::dotnet-metadata
