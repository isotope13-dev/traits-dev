defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs]
  crit: suspicious
  attack: T1027
traits:
  - id: cmd-caret-split-command-token
    desc: CMD command token split by caret escapes
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bcmd(\.exe)?[^\r\n]{0,160}\b([a-z]\^{1,4}){4,32}[a-z]\b'
    unless:
      - id: metadata/package/documentation/source::defensive-dangerous-command-doc
  - id: cmd-caret-split-binary-token
    desc: Caret-split command token in PE code section
    crit: suspicious
    for: [pe]
    conf: 0.9
    if:
      type: text
      regex: '\b([A-Za-z]\^{1,4}){4,32}[A-Za-z]\b'
      section: .text
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: well-known/lib/format/gnu-libiconv
  # LNK arguments are stored UTF-16 and are only reachable through the parsed
  # lnk.arguments value, so text extraction cannot see them; this is the
  # shortcut surface of the same caret-splitting evasion. A single escaped
  # interpreter name (con^host, cu^rl, pow^ershell) defeats literal command
  # matching just as the heavily split tokens above do.
  - id: lnk-caret-split-command-token
    desc: LNK arguments carry a caret-split command token
    crit: suspicious
    for: [lnk]
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\b[a-z]{2,14}\^[a-z]{2,14}(\.exe)?\b'
