defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
composite_rules:
  # `obj['a'+'b']` is what minifiers and bundlers emit, so a bare any: over the
  # three concat shapes convicts any shipped bundle -- draw.io Desktop's
  # Electron build among them. The single vendor `unless:` below was this same
  # FP handled one tool at a time. The obfuscation verdict belongs to the two
  # composites that consume this: `nemucod-jitter-check` (hostile) and
  # `npm-disguised-analytics-host-beacon`.
  - id: js-fragmented-property-access
    desc: Computed property access using concatenation (obfuscation)
    crit: notable
    conf: 0.8
    attack: T1027
    mbc: B0032
    any:
      - id: micro-behaviors/data/source/string::computed-property-single-quote-concat
      - id: micro-behaviors/data/source/string::computed-property-double-quote-concat
      - id: micro-behaviors/data/source/string::computed-property-template-concat
    unless:
      - id: well-known/tool/development/cli/dev-cli/guanghechen::obfuscated-cli
