# Hiding the program being run, not just the data it is given.
#
# Most obfuscation conceals a payload and leaves the machinery visible: the
# reader still sees `base64 -d` and `sh`. This technique conceals the machinery
# too. `printf xAxd | tr -d A` yields `xxd` without the file ever containing
# the word, so a reviewer -- or a scanner matching on decoder names -- sees a
# `printf` and a `tr` and nothing that decodes anything.
#
# Both legs together are the signal. A rebuilt command name alone could be
# contrived; a rebuilt command name splicing itself into a pipeline that ends
# at a shell, next to an encoded blob, is a deliberate attempt to be
# unreadable. Nothing legitimate assembles `xxd` a character at a time in order
# to run it.
defaults:
  platforms: [unix]
  for: [scripts, source, makefile, dockerfile, text]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  # The complete technique: a command name rebuilt at runtime, and an encoded
  # blob fed through it into a shell. Held to one locality window so the two
  # halves are the same construct rather than two unrelated lines.
  - id: reconstructed-decoder-executes-encoded-payload
    desc: Rebuilt decoder runs encoded payload
    crit: hostile
    conf: 0.96
    near_lines: 5
    all:
      - id: micro-behaviors/data/string/assembly::reconstructed-command-substitution
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-onward

  # The reconstruction paired with any shell execution, without requiring the
  # blob to be hex. Catches the same trick carrying a base64 or raw payload,
  # where only the decoder name is hidden.
  - id: reconstructed-command-name-shell-execution
    desc: Rebuilt command name run via shell
    crit: suspicious
    conf: 0.9
    near_lines: 5
    all:
      - id: micro-behaviors/data/string/assembly::reconstructed-command-substitution
    any:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
      - id: micro-behaviors/process/create/background::subshell-detached-output-discarded
      - id: micro-behaviors/data/decode/multiple-encoding::stacked-decode-pipeline
