defaults:
  for: [html]
  platforms: [windows, unix]
composite_rules:
  - id: packed-hidden-frame-routing
    desc: Packer conceals iframe and display-none tokens
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
      - id: micro-behaviors/ui/window/insert-html::packed-iframe-document-tokens
      - id: micro-behaviors/ui/window/visibility::packed-display-none-tokens
