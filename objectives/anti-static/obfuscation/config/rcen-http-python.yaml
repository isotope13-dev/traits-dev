defaults:
  for: [python]
  platforms: [unix, windows]

composite_rules:
  - id: rcen-parser-http-client
    desc: RCEN configuration parser accompanies an HTTP POST client
    crit: suspicious
    conf: 0.9
    attack: T1027.013
    # A recovery tool using the same cipher is only notable. This observation
    # requires an HTTP client in the file; it does not assert data flow.
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rcen::python-envelope-parser
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
