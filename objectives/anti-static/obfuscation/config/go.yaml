defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1027
  mbc: B0032
traits:
- id: config-base64-xor-fragment
  desc: Obfuscated config string fragment
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    regex: '(?i)\b(config|configuration)[_-]?(base64|xor)\b'
- id: decoded-address-config-fragment
  desc: Decoded address config fragment
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    regex: '(?i)\b(decode|decoded)[_-]?(config|addr|address)\b'
- id: xor-address-prefix
  desc: XOR-prefixed address config token
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    regex: '(?i)\bxor[_-]?(addr|address|host)\b'
- id: xor-address-suffix
  desc: Address token with XOR suffix
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    regex: '(?i)\b(addr|address|host)[_-]?xor\b'
- id: go-decryption-key-symbol
  desc: Go decryption key symbol
  crit: component
  conf: 0.55
  if:
    type: text
    regex: '\b(decryptionKey|decryptionKey[0-9]+)\b'

composite_rules:
- id: xor-address-config-fragment
  desc: XOR address config fragment
  crit: component
  conf: 0.85
  any:
  - id: xor-address-prefix
  - id: xor-address-suffix
