defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1027,T1059.003

traits:
  - id: lnk-cmd-many-variable-loops
    desc: Shortcut chains command variable loops
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)for\s+%[a-z]\s+in.{0,80}for\s+%[a-z]\s+in.{0,80}for\s+%[a-z]\s+in'
  - id: lnk-many-encoded-character-escapes
    desc: Shortcut contains many encoded characters
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\\x[0-9a-f]{2}.{0,24}\\x[0-9a-f]{2}'
  - id: lnk-repeated-octal-character-escapes
    desc: Shortcut contains octal character escapes
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '\\[0-7]{3}.{0,24}\\[0-7]{3}'
  - id: lnk-window-object-reference
    desc: Shortcut arguments access browser window
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)window\s*[.\[]'

composite_rules:
  - id: lnk-loop-assembled-encoded-browser-script
    desc: Shortcut assembles encoded browser script via loops
    crit: hostile
    conf: 0.97
    all:
      - id: lnk-cmd-many-variable-loops
      - id: lnk-many-encoded-character-escapes
      - id: lnk-repeated-octal-character-escapes
      - id: lnk-window-object-reference
      - id: micro-behaviors/process/config/target::lnk-cmd-target
