defaults:
  for: [batch]
  platforms: [windows]
  attack: T1027,T1218.011

composite_rules:
  - id: batch-obfuscated-rundll-ordinal
    desc: Obfuscated batch launches DLL by ordinal
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/source/syntax/assignment/value::batch-single-character-variable-assignments
      - id: well-known/app/system/microsoft/rundll32::rundll32-ordinal-host
      - id: metadata/file/line::batch-has-long-token
