# Batch droppers (DBatLoader/ModiLoader) whose commands exist only as
# single-character slices of a shuffled alphabet variable with a non-ASCII
# name, reshuffled between lines. No builder, installer or admin script
# writes batch this way; it exists to keep every command off the page.
defaults:
  platforms: [windows]
  for: [batch]
  crit: hostile
  attack: T1027.010

composite_rules:
  - id: batch-commands-from-reshuffled-nonascii-alphabet
    desc: Batch spells commands from a reshuffled hidden alphabet
    conf: 0.95
    all:
      - id: metadata/file/encoding/shape::batch-nonascii-alphabet-char-slices
      - id: metadata/file/encoding/shape::batch-nonascii-alphabet-reshuffle
