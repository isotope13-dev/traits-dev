# UTF-16 Script Encoding Obfuscation
# JScript/VBScript files encoded as UTF-16 to evade string-based detection
# Legitimate scripts rarely use UTF-16 encoding with null-byte interleaving
defaults:
  crit: suspicious
  platforms: [windows]
  for: [javascript, pdf]
  attack: "T1027"
  mbc: "B0032"
traits:
  - id: utf16-bom-script
    desc: UTF-16 encoded script content
    conf: 0.7
    if:
      type: text
      regex: "f\\x00u\\x00n\\x00c\\x00t\\x00i\\x00o\\x00n\\x00"
    unless:
      # The PDF itself is in the pdf.js tree.
      - id: well-known/lib/format/pdfjs::source-tree
      # Carved PDF JavaScript actions are exposed as `pdf/objectN.js` and keep
      # the PDF string's UTF-16 bytes. That is the document encoding, not a
      # UTF-16 script file dropped to evade a scanner. The path is only the
      # inner object name, so the enclosing pdf.js directory is invisible here.
      - type: path
        regex: 'pdf/object[0-9]+\.js'
composite_rules:
  - id: utf16-wsh-obfuscation
    for: [javascript]
    desc: UTF-16 encoded WSH with COM objects
    conf: 0.85
    all:
      - id: utf16-bom-script
      - id: objectives/execution/activex/com::utf16-wsh-com-objects
