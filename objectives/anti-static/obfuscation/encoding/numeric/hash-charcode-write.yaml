defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
composite_rules:
  # Hash-delimited decimal packing (the HTML-Guardian idiom) hides a whole
  # script from static view; decoding it through fromCharCode and writing
  # the result into the document executes the concealed stage. Search-hijack
  # doorways pack their referrer-gated redirector exactly this way: the
  # visible page is keyword bait while the hidden script steals the
  # search-engine visitor.
  - id: hash-delimited-charcode-document-write
    desc: Hash-encoded script written into document
    crit: hostile
    conf: 0.96
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/encode/charcode::hash-delimited-charcode-blob
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
  # Encoding-only twin of the writer above: a concealed blob with its
  # decoder but no document sink may be a license check, so it stays
  # suspicious. It exists so the write leg carries the conviction alone.
  - id: hash-delimited-charcode-text
    desc: Hash-encoded character-code concealed text
    crit: suspicious
    conf: 0.9
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/encode/charcode::hash-delimited-charcode-blob
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
