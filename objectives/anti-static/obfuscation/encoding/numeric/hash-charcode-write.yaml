defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
composite_rules:
  # Decimal-string decoding beside a document sink indicates concealment.
  # It neither proves that the decoded value reaches the sink nor that the
  # content is malicious; referrer-cloaking rules establish the attack.
  - id: hash-delimited-charcode-document-write
    desc: Hash charcode decoder beside document.write
    crit: suspicious
    conf: 0.96
    near_bytes: 6000
    all:
      - id: metadata/lang/source/literal::hash-delimited-decimal-string
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
  # Neither a decoder nor document.write establishes malicious content.
  # Both observations remain suspicious concealment signals.
  - id: hash-delimited-charcode-text
    desc: Hash decimal string beside fromCharCode
    crit: suspicious
    conf: 0.9
    near_bytes: 6000
    all:
      - id: metadata/lang/source/literal::hash-delimited-decimal-string
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
