# Managed stub that carries its payload as a long run of decimal digit
# groups, reverses strings at runtime, and loads and late-binds an assembly.
# Each part has ordinary uses; a decimal-serialized blob plus string reversal
# feeding Assembly.Load and reflective member invocation is a loader that
# keeps the next stage out of any recognisable binary form.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140,T1620

composite_rules:
  - id: dotnet-reversed-decimal-assembly-loader
    desc: .NET loads a reversed decimal-encoded assembly
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/data/embedded/payload/array::space-separated-decimal-triplet-run
      - id: micro-behaviors/data/string/reverse::dotnet-strreverse
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
    any:
      - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-callbyname-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::managed-activator-createinstance-call
    needs: 1
