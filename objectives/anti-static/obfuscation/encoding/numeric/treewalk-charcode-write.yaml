# Tree-walk bit-stream packing hides a whole script from static view: a
# decode tree built from charCodeAt pairs, a bit reader, indexed
# fromCharCode emission, and a document.write sink. The decoded stage is a
# referrer-gated TDS redirect while the visible page is keyword bait, the
# same doorway structure as the hash-delimited family, packed with a custom
# bit decoder instead of decimal runs.
# Nearby charCodeAt reads and fromCharCode calls alone do not establish
# concealment or a decoder data flow: ordinary UTF-16/entity codecs contain
# both. Keep those observations in data/string/conversion, without an
# objective composite. See testdata/triage/playwright-core-unicode-review/.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
composite_rules:
  # Concealed indexed-decoded content written into the document: the hidden
  # stage executes where scanners see only punctuation soup.
  - id: treewalk-charcode-document-write
    desc: Tree-walk decoded script written into document
    crit: suspicious
    conf: 0.9
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/decode/charset::indexed-charcode-array-decode
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
