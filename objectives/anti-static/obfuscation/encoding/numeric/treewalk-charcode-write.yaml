# Tree-walk bit-stream packing hides a whole script from static view: a
# decode tree built from charCodeAt pairs, a bit reader, indexed
# fromCharCode emission, and a document.write sink. The decoded stage is a
# referrer-gated TDS redirect while the visible page is keyword bait, the
# same doorway structure as the hash-delimited family, packed with a custom
# bit decoder instead of decimal runs. The codec pair alone may be a license
# check, so each pairing stays suspicious; together they convict the page.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
traits:
  # A script that combines two character codes into one tree value is
  # packing data densely, not converting keystrokes: keyboard handlers read
  # single codes, while packed stages merge pairs (base-64 style).
  - id: charcode-pair-combine-decode
    desc: Merges charCodeAt pairs into values
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'charCodeAt\(\d\)[^;]{0,80}charCodeAt\(\d\)'
composite_rules:
  # Concealed indexed-decoded content written into the document: the hidden
  # stage executes where scanners see only punctuation soup.
  - id: treewalk-charcode-document-write
    desc: Tree-walk decoded script written into document
    crit: suspicious
    conf: 0.9
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/decode/charset::indexed-charcode-array-decode
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
  # Paired with fromCharCode emission, the pair-combining above is the
  # decoder end to end.
  - id: charcode-pair-emission-text
    desc: Pair-combined codes emitted via fromCharCode
    crit: suspicious
    conf: 0.87
    near_bytes: 2048
    all:
      - id: charcode-pair-combine-decode
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
