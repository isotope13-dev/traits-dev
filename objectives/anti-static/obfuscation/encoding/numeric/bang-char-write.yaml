defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: charat-bang-delimiter
    desc: charAt tests an exclamation-mark delimiter
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'charAt\(\w\)!=[''"]![''"]'
composite_rules:
  - id: bang-delimited-charcode-document-write
    desc: Bang-delimited codes are written to the document
    crit: hostile
    conf: 0.97
    attack: T1027
    near_bytes: 400
    all:
      - id: charat-bang-delimiter
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
    any:
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
