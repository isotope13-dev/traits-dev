# Signed decimal offsets separated by the letter c, then split on that
# letter. The pieces are character deltas, not prose.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: c-delimited-signed-offset-split
    desc: Splits signed offsets on the letter c
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\d{1,3}[+-]\d{1,3}c\d{1,3}[+-]\d{1,3}\\"\.split\(\\"c\\"\)'
