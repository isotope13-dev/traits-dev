defaults:
  for: [html, javascript]
  platforms: [windows, unix]
composite_rules:
  # A decimal data string alone is not obfuscation. Require the conversion
  # function table and concealed eval selection used by this packer style.
  # This records co-occurrence, not a source-to-eval data-flow proof.
  - id: letter-delimited-decimal-eval-packer
    desc: Decimal text, decoder table and eval selection
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: metadata/lang/encoding/shape::letter-delimited-decimal-string
      - id: micro-behaviors/data/collection/array::js-character-conversion-function-table
      - id: micro-behaviors/data/control-flow/branch::js-conditional-string-eval-selection
