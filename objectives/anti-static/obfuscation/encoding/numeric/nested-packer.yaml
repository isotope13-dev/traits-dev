defaults:
  for: [html, javascript, text]
  platforms: [windows, unix]
composite_rules:
  - id: nested-numeric-escape-packer
    desc: Packer evaluation conceals multiply escaped numeric source
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/encoding::nested-numeric-escape-run
      - id: micro-behaviors/data/string/replace::numeric-character-dictionary
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
  - id: concealed-activex-numeric-packer
    desc: Hidden ActiveX object accompanies nested numeric packing
    crit: suspicious
    conf: 0.98
    platforms: [windows]
    for: [html, text]
    all:
      - id: nested-numeric-escape-packer
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/os/com/automation::display-hidden-activex-object
