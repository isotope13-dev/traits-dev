# Split-decoder packer listings: a numeric payload array decoded by a
# fromCharCode alias whose name is itself built by concatenation, then run
# through the recovered Function constructor. Each evasion step below dodges
# one literal matcher: the decoder name never appears whole (`'f' + ro()`
# where ro() returns 'romChar'), the constructor is grabbed through an
# anonymous IIFE instead of `new Function(`, and the payload body is a bare
# comma-number run plus a split/join de-shuffling loop. Legitimate minified
# bundles use numeric arrays and split/join, so every atom alone stays
# notable; the composites pair the evasion idioms that only packers combine.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
traits:
  - id: split-fromcharcode-fragment
    desc: fromCharCode built from romChar fragment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']romChar["'']'
  - id: string-f-concat-alias
    desc: String decoder aliased by f concatenation
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\(\s*String\s*,\s*[''"]f[''"]\s*\+'
composite_rules:
  # Both required fragments conceal the decoder name. Constructor-property
  # helpers are ordinary introspection and provide no numeric-packing evidence.
  - id: split-decoder-name-assembly
    desc: Decoder name assembled from split fragments
    crit: suspicious
    conf: 0.88
    near_bytes: 2048
    all:
      - id: split-fromcharcode-fragment
      - id: string-f-concat-alias
  # The evasion pair above plus an encoded numeric body reshaped by a
  # split/join loop: decoder concealment with its payload present.
  - id: packed-split-decoder-payload
    desc: Concealed decoder with numeric payload body
    crit: suspicious
    conf: 0.87
    near_bytes: 2048
    all:
      - id: split-fromcharcode-fragment
      - id: "metadata/lang/source/literal::long-comma-numeric-run"
      - id: micro-behaviors/data/string/replace::split-join-variable-separator
