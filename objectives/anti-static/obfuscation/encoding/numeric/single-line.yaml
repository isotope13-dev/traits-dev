defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
composite_rules:
- id: charcode-packed-numeric-source
  desc: Numeric source concealed by character-code transforms
  crit: suspicious
  conf: 0.96
  mbc: B0032
  all:
  - id: metadata/file/text-distribution::numeric-or-long-line-source
  - id: micro-behaviors/data/encode/charcode::charcodeat-arithmetic
  - id: micro-behaviors/data/decode/char-code::fromcharcode-map-array
  - id: metadata/lang/source/syntax/call/arguments::numeric-array-map-tail
  unless:
  - id: metadata/build/bundler/asset::js-known-bundler-output
- id: mirc-binary-encoded-config-section
  for: [text]
  platforms: [windows]
  desc: mIRC configuration conceals settings as ASCII binary bitstrings
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/format/structured::mirc-client-config-section
  - id: metadata/file/format/structured::mirc-remote-script-list
  - id: micro-behaviors/data/config/schema::ini-ascii-binary-bitstring-fields
