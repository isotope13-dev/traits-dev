defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: charcode-packed-numeric-source
  desc: Numeric source concealed by character-code transforms
  crit: suspicious
  conf: 0.96
  mbc: B0032
  attack: T1027
  all:
  - id: metadata/file/profile/text-shape::numeric-or-long-line-source
  - id: micro-behaviors/data/encode/charcode::charcodeat-arithmetic
  - id: micro-behaviors/data/decode/custom::fromcharcode-map-array
  - id: metadata/lang/source/syntax/call/arguments::numeric-array-map-tail
  unless:
  - id: metadata/build/bundler/asset::js-known-bundler-output
