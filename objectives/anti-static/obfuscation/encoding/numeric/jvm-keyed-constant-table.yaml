# Runtime integer constants are hidden behind a keyed long-array lookup,
# narrowed after XOR, boxed and cached. This is distinct from string hiding.
# Wildcards cover the key, table indexes and method-reference indexes.
defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1027
traits:
  - id: jvm-keyed-integer-constant-cache
    desc: JVM integer constants recovered from keyed table
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      pattern: >-
        1A 1F 14 ?? ?? 7F 88 82 11 ?? ?? 82 3E
        B2 ?? ?? 1D 32 C7 ?? ?? B2 ?? ?? 1D B2 ?? ??
        1D 2F 1F 83 88 B8 ?? ?? 53 B2 ?? ?? 1D 32 B6 ?? ?? AC
