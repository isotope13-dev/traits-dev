# Every string in the program written as decimal character codes.
#
# A VBA dropper in this corpus keeps nothing readable: the message box, the COM
# moniker, the path to `mshta.exe` and the URL are all runs of three-digit
# codes passed through a helper that turns them back into text. Nothing a
# string scanner reads is a string, and nothing a person reads is a program.
#
# The atom describes the shape rather than the helper, because the helper is
# named differently in every build -- `Int2Str` here -- while a hundred-digit
# literal in a document is the same choice whatever it is called.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs, text]
  attack: T1027
  mbc: B0032

traits:
  - id: vba-decimal-encoded-string-literal
    desc: String literal is a long digit run
    crit: notable
    conf: 0.92
    if:
      # A long digit run handed straight to a function. Sixty-odd digits is
      # twenty characters of decoded text and far past any honest numeric
      # literal -- a year, an ID, a version, a phone number -- and the call
      # around it is what says the digits are meant to be turned back into
      # something rather than counted with.
      type: text
      regex: '\w{2,32}\("[0-9]+"\)'
      length_min: 66

composite_rules:
  # The decoded string is handed to `GetObject`, which takes a moniker: a
  # CLSID to instantiate, a `script:` URL to fetch and run, a file to bind. A
  # macro that will not say which one it means has chosen not to.
  - id: vba-decimal-encoded-com-moniker
    for: [vbs]
    desc: Macro builds a COM moniker from digit runs
    crit: hostile
    conf: 0.95
    attack: T1027,T1559.001
    all:
      - id: vba-decimal-encoded-string-literal
      - id: micro-behaviors/process/script/wsh::wsh-getobject-variable-argument
