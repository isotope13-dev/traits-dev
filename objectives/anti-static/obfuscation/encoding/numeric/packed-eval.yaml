defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002
composite_rules:
- id: numeric-reconstruction-with-eval-syntax
  desc: Long source combines numeric reconstruction and eval syntax
  crit: suspicious
  conf: 0.96
  mbc: B0032
  attack: T1027
  all:
  - id: objectives/supply-chain/hidden-payload/eval::packed-payload-exec-sink
  - id: metadata/file/text-distribution::numeric-or-long-line-source
  - id: objectives/supply-chain/hidden-payload/eval::packed-charcode-decoder
  - id: metadata/lang/source/syntax/call/arguments::numeric-array-map-tail
  unless:
  - id: metadata/lang/source/function::js-long-lines-short-functions-context
  - id: metadata/file/line::javascript-over-1000-lines
  - id: well-known/lib/runtime/scripted/pyodide::pyodide-runtime-bundle
  - id: metadata/build/bundler/asset::js-known-bundler-output
