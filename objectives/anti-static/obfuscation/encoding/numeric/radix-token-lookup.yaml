# The script text is stored as base-25 character-code tokens, converted
# with a parseInt(token, radix) helper and mapped through a printable-char
# lookup table, so no readable byte of the payload is present.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: radix-token-text-via-char-lookup-table
    desc: Script stored as radix tokens decoded via table
    crit: hostile
    conf: 0.95
    attack: T1027
    all:
      - id: micro-behaviors/data/encode/char-code::radix-above-sixteen-char-token-literals
      - id: micro-behaviors/data/encode/char-code::printable-char-lookup-table
      - id: micro-behaviors/data/encode/char-code::parseint-radix-conversion-helper
