defaults:
  platforms: [windows]
  for: [asp, vbs]
  attack: T1027

composite_rules:
  # These nearby observations establish co-occurrence, not data flow or
  # the meaning of the reconstructed program. Do not infer request access
  # from an opaque numeric literal.
  - id: vbs-percent-numeric-execute-cluster
    desc: Numeric strings and decoder accompany Execute
    crit: suspicious
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-function-call
      - id: metadata/file/encoding/url::percent-decimal-string
      - id: micro-behaviors/data/decode/charset::vbs-chr-array-element-minus-key
