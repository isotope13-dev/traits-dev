# Dynamic execution recovered only after decoding an opaque string layer.
defaults:
  platforms: [windows]
  for: [batch, python, javascript, typescript, rust, go, csharp, powershell]
  attack: T1027,T1059.001
  mbc: B0032

traits:
  - id: base64-powershell-iex
    desc: Base64-decoded PowerShell invokes IEX
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\biex\s*\('
