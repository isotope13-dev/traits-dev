defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

composite_rules:
  # A self-issued publisher cannot supply the known benign publisher
  # exception to deliberately concealed native dispatch. The measurements
  # remain neutral; the combination states the concealment mechanism.
  - id: self-issued-garbled-go-native-dispatch
    desc: Self-issued Go with garbled names and native dispatch
    crit: hostile
    conf: 0.96
    attack: T1027,T1027.002
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-garbled-main-symbols
      - id: metadata/binary/code/complexity::hundred-large-control-flow-functions
      - id: micro-behaviors/os/syscall/invoke::go-syscall-function-pointer-dispatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
