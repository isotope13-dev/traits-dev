defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.97
  attack: T1027

traits:
  # Notable, not suspicious. The matcher proves one thing -- numeric constants
  # are written in hexadecimal and combined arithmetically -- and cannot tell
  # `0x400*0x400` (a one-megabyte buffer size) or the UTF-16 surrogate
  # composition `(c-0xd800)*0x400+d-0xdc00+0x10000` from a constant a tool
  # deliberately disguised. Both spellings are what javascript-obfuscator's
  # hex-numbers transform leaves behind, so the count floor finds obfuscated
  # files -- but it finds them by a symptom, and reported alone at suspicious
  # it asserts the intent ("disguises") that the regex never established.
  # Traycer's VS Code extension is the worked example: a genuinely
  # javascript-obfuscator-packed bundle whose only suspicious finding was this
  # one, because every rule that could name the obfuscator was suppressed as a
  # large minified bundle. The identity now lives in
  # obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime, and
  # the two composites below still raise this atom when they can add the COM
  # dispatch or the XOR/base64 decoder that supplies the intent.
  - id: repeated-hex-arithmetic-constants
    desc: Repeated hex arithmetic over numeric constants
    crit: notable
    count_min: 30
    if:
      type: text
      # The left operand must be a hex *literal*, not the tail of an
      # identifier. javascript-obfuscator names every variable `_0xABCDEF`, so
      # without the boundary an ordinary array index -- `_0x4aa6c9[_0x304364
      # + 0x1]` -- read as `0x304364 + 0x1`, hex arithmetic that was never
      # written. Zencoder's bundled extension.js scored 826 such "constants";
      # 14 survive the boundary, all genuine codec math (UTF-16 surrogate
      # composition, UUID digit sums), well under the count floor.
      regex: '[^\w$]0x[0-9a-fA-F]+\s*[+*\-]\s*-?0x[0-9a-fA-F]+'

composite_rules:
  - id: arithmetic-obfuscated-com-dispatch
    desc: Arithmetic-obfuscated COM object construction
    crit: suspicious
    all:
      - id: repeated-hex-arithmetic-constants
      - id: micro-behaviors/os/com/automation::activex-indexed-progid
  - id: arithmetic-encrypted-string-dispatch
    desc: Encrypted strings drive computed script calls
    crit: suspicious
    all:
      - id: repeated-hex-arithmetic-constants
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/decode/base64::lower-first-base64-alphabet
      - id: micro-behaviors/data/control-flow/dispatch::js-function-derived-computed-call
