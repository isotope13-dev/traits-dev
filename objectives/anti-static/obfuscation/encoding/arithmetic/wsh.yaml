defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.97
  attack: T1027

traits:
  - id: repeated-hex-arithmetic-constants
    desc: Arithmetic expressions disguise constants
    crit: suspicious
    count_min: 30
    if:
      type: text
      regex: '0x[0-9a-fA-F]+\s*[+*\-]\s*-?0x[0-9a-fA-F]+'

composite_rules:
  - id: arithmetic-obfuscated-com-dispatch
    desc: Arithmetic-obfuscated script constructs computed COM objects
    crit: suspicious
    all:
      - id: repeated-hex-arithmetic-constants
      - id: micro-behaviors/os/com/object::activex-indexed-progid
  - id: arithmetic-encrypted-string-dispatch
    desc: Arithmetic-disguised script decrypts strings for computed calls
    crit: suspicious
    all:
      - id: repeated-hex-arithmetic-constants
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/decode/base64::lower-first-base64-alphabet
      - id: micro-behaviors/data/control-flow/dispatch::js-function-derived-computed-call
