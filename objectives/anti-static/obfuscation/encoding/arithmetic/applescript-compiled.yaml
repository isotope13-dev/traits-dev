# FasdUAS character-ID descriptor followed by indexed arithmetic, conversion,
# concatenation, GetData and a local-variable store. Repeated decoder bodies
# distinguish a string-concealment implementation from one character operation.
# No handler names, encoded strings or campaign configuration are required.
defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1027,T1140
traits:
  - id: scpt-arithmetic-character-decoders
    desc: Repeated arithmetic character decoders
    crit: suspicious
    conf: 0.97
    count_min: 3
    if:
      type: hex
      pattern: '63 68 61 20 [0-32] 6B 66 72 6D 49 44 20 20 [0-256] 2F (1E|1F) E? 30 25 45 B?'
