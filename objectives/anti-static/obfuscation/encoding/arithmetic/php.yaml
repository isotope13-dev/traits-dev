# PHP restricted-character expression obfuscation.
#
# The technique reconstructs letters and callable names from numeric values,
# XOR, concatenation, and parentheses so a downstream expression evaluator
# never receives alphabetic source text.  These atoms describe the structure;
# the exploit objective adds the request/dispatch context.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1027
  mbc: B0032

traits:
  - id: php-long-operator-only-expression
    desc: Long numeric PHP operator-expression string
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      # Require a numeric operand. Long regex fragments made only from
      # parentheses and alignment whitespace are ordinary parser data.
      regex: '^[().^+\-*=/<>|&\s]*\d[().\d^+\-*=/<>|&\s]{79,}$'
    not:
      # Standards such as OpenID embed long decimal DH parameters. A decimal
      # literal without an operator is data, not an operator-only expression.
      - regex: '^\s*\d+\s*$'
      - regex: '^[-\s]+$'
      # Log and banner decorators built from repeated dash/asterisk runs.
      - regex: '^[-*\s]+$'
      # Heredoc fixtures commonly hold large ASCII numeric tables. Four
      # pipe-delimited numeric cells prove tabular data, not an expression.
      - regex: '\|\s*\d+\s*\|\s*\d+\s*\|\s*\d+\s*\|\s*\d+\s*\|'
    unless:
      - id: well-known/lib/web/symfony::package-doc
      - id: well-known/lib/crypto/phpseclib::library-context
      - id: well-known/app/publishing/salesmanago::salesmanago-wordpress-plugin
      - id: well-known/lib/runtime/php-runtime::source-tree

  - id: php-xor-operator-only-expression
    desc: PHP XOR expression string
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      regex: '^[().0-9]{24,}\^[().0-9^]{1,}$'

  - id: php-digit-zero-fragment
    desc: PHP digit zero expression fragment
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["'']0["'']\s*=>\s*["'']\(0\)["'']'

  - id: php-digit-nine-fragment
    desc: PHP digit nine expression fragment
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["'']9["'']\s*=>\s*["'']\(9\)["'']'

  - id: php-operator-callable-builder
    desc: PHP split-character callable builder
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z0-9_]*\s*\.=\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\.\s*["'']\(["'']'
    unless:
      - type: basename
        regex: '_test\.php$'

composite_rules:
  - id: php-restricted-character-callable
    desc: PHP reconstructs a callable using a restricted-character expression
    crit: hostile
    conf: 0.99
    all:
      - id: php-long-operator-only-expression
      - id: php-xor-operator-only-expression
      - id: php-digit-zero-fragment
      - id: php-digit-nine-fragment
      - id: micro-behaviors/data/string/split::php-str-split-call
      - id: php-operator-callable-builder
