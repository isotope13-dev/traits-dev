defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: indexed-subtract-character-key
    desc: Array bytes subtract cycling character key
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '[\w$]+\[[\w$]+\]\s*-\s*[\w$]+\.substring\([^;]{1,180}\.charCodeAt\(0\)'
