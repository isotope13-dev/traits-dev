defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  # The parser's minus-node metric includes unary negative numbers. Requiring
  # repeated infix subtraction distinguishes arithmetic-packed arrays from
  # GeoJSON coordinate arrays while retaining count and density gates.
  - id: js-arithmetic-array-init
    desc: "Array initialization with repetitive arithmetic expressions (obfuscation)"
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/profile/metrics::js-many-minus-operator-nodes
      - id: metadata/file/profile/metrics::js-minus-operator-node-density
      - id: micro-behaviors/data/source/arithmetic::js-binary-subtraction-cluster
      - id: metadata/file/extension/identity::javascript-source-extension
    unless:
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/file/format/markup::jinja-template-source
      # Astronomy polynomials (SunCalc et al.) are dense in subtractions by design.
      - id: well-known/lib/core/suncalc::suncalc-astronomy-library
      - id: well-known/lib/network/novnc::source-context
      - id: well-known/lib/media/pixastic::pixastic-library-context
      - id: metadata/library/vscode::vscode-extension-marker
      # Numeric test vectors are intentionally arithmetic-dense, but are not
      # obfuscation merely because they occur in JavaScript source.
      - id: metadata/package/testing/
