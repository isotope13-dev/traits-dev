# Startup graft recovered from a native PE: scattered code caves allocate
# executable memory, reconstruct an appended body with mixed-width arithmetic,
# then call an entry inside that buffer. Constants, sizes and addresses vary.
# The signature binds the final dword/byte decode steps, loop termination,
# buffer-base recovery and indirect execution in one instruction sequence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1027,T1140,T1620
traits:
  - id: x86-mixed-width-decoder-handoff
    desc: x86 arithmetic loop with decoded-buffer call
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8B 4F 00 89 88 00 00 00 00 81 28 ?? ?? ?? ?? 81 C0 04 00 00 00 81 C7 04 00 00 00 8A 8F 00 00 00 00 80 C1 ?? 88 88 00 00 00 00 81 C0 01 00 00 00 81 C7 01 00 00 00 83 C6 ?? 81 FE ?? ?? ?? ?? 0F 82 ?? ?? ?? ?? 81 E8 ?? ?? ?? ?? 50 81 C0 ?? ?? ?? ?? FF D0 59 58 8F C6 5F C3'

composite_rules:
  - id: x86-mixed-width-decoder-execution
    desc: Arithmetic-decoded resource code execution
    crit: hostile
    conf: 0.99
    all:
      - id: x86-mixed-width-decoder-handoff
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
