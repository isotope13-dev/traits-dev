defaults:
  platforms: [windows, unix]
  for: [scripts, source]
composite_rules:
  - id: powershell-offset-integer-array-obfuscation
    desc: Negative-array decoder near dynamic script construction
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    near_bytes: 32768
    all:
      - id: micro-behaviors/data/collection/array::powershell-negative-integer-array
      - id: micro-behaviors/data/decode/custom::powershell-offset-array-character-decode
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-eval
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text

