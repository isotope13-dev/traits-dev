# JavaScript stream-decode patterns using arithmetic instead of XOR.
# JS analog of arithmetic/python-stream-decode.yaml.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032
traits:
  # `arr.map(b => (b - k) & 0xff)` or `Uint8Array.from(arr.map(b => b - k))`
- id: js-subtract-bytes-map
  desc: bytes subtraction decode via map
  crit: suspicious
  conf: 0.93
  if:
    type: text
    substr: \.map\s*\(\s*\(?\s*\w+\s*\)?\s*=>\s*\(?\s*\w+\s*-\s*[\w.()]{1,30
- id: js-add-mod-bytes-map
  desc: bytes addition mod 256 decode via map
  crit: suspicious
  conf: 0.93
  if:
    type: text
    substr: \.map\s*\(\s*\(?\s*\w+\s*\)?\s*=>\s*\(\s*\w+\s*\+\s*[\w.()]{1,30
- id: js-fromcharcode-mod-256-decode
  desc: Character-code modular-arithmetic byte decode
  crit: suspicious
  conf: 0.92
  # `String.fromCharCode((c.charCodeAt(0) - key + 256) % 256)` — a wrap-around
  # subtract/add cipher decode. Match the arithmetic expression itself because
  # formatted source commonly puts the fromCharCode call on the preceding line.
  # The key may be a literal or a caller-controlled variable.
  if:
    type: text
    regex: 'charCodeAt\(0\)\s*[-+]\s*[\w$]+\s*\+\s*256\)\s*%\s*256'
- id: js-fullwidth-char-transform
  desc: Fullwidth Unicode char transform
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'String\.fromCharCode\(\s*65280\s*\+\s*\w+\.charCodeAt\(0\)\s*-\s*32\s*\)'
composite_rules:
- id: js-stream-decode-aggregator
  desc: JS single-byte stream-decode pattern (any form)
  crit: suspicious
  conf: 0.94
  any:
  - id: js-subtract-bytes-map
  - id: js-add-mod-bytes-map
