defaults:
  platforms: [unix, windows]
  for: [json]
  crit: suspicious
  conf: 0.94
  attack: T1027

traits:
  - id: json-contained-arithmetic-decoder-source
    desc: Serialized arithmetic URI decoder source
    if:
      type: value
      path: content
      regex: '(?s)^\s*function.{0,160}0x\w+\s*\*\s*-?0x\w+.{0,1800}decodeURIComponent\('
  - id: json-contained-arithmetic-window-option
    desc: Serialized source obscures a window option
    if:
      type: value
      path: content
      regex: 'windowsHide.{0,8}!\([^)]{0,80}0x\w+\s*\*'

composite_rules:
  - id: json-contained-concealed-window-options
    desc: Serialized decoder conceals window options
    all:
      - id: json-contained-arithmetic-decoder-source
      - id: json-contained-arithmetic-window-option
