defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1027
  mbc: B0032

traits:
  - id: lnk-bigint-parse
    desc: LNK parses a BigInt constant
    crit: notable
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\[bigint\]::parse\s*\('
  - id: lnk-bigint-remainder-base256
    desc: LNK takes a BigInt base-256 remainder
    crit: notable
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\[bigint\]::remainder\s*\([^,\r\n]{1,120},\s*256\s*\)'
  - id: lnk-bigint-divide-base256
    desc: LNK divides a BigInt by 256
    crit: notable
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\[bigint\]::divide\s*\([^,\r\n]{1,120},\s*256\s*\)'

composite_rules:
  - id: lnk-base256-integer-url-decoder
    desc: LNK converts BigInt into base-256 bytes
    crit: suspicious
    conf: 0.97
    all:
      - id: lnk-bigint-parse
      - id: lnk-bigint-remainder-base256
      - id: lnk-bigint-divide-base256
  - id: lnk-obfuscated-remote-script-loader
    desc: LNK decodes a remote script loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1105
    mbc: B0030
    all:
      - id: lnk-base256-integer-url-decoder
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::lnk-irm-alias-argument
      - id: micro-behaviors/process/interpreter/eval/direct::lnk-powershell-scriptblock-constructor
      - id: micro-behaviors/process/interpreter/eval/direct::lnk-powershell-scriptblock-call-operator
