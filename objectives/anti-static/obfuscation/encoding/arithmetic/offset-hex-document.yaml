# Offset arithmetic hides text from string extraction. The HTML sink makes
# this a browser reconstruction profile; co-occurrence does not bind a value.
defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: offset-hex-decoder-beside-document-write
    desc: Offset hex decoder beside document.write
    crit: suspicious
    conf: 0.95
    attack: T1027
    all:
      - id: micro-behaviors/data/decode/custom::js-hex-parseint-offset-subtraction
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
    near_bytes: 6000
