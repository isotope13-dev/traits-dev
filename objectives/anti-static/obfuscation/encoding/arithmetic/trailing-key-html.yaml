defaults:
  for: [html, javascript]
  platforms: [windows, unix]
composite_rules:
  - id: trailing-key-percent-document-decoder
    desc: Trailing-key decoding reconstructs document text
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/arithmetic::js-charcode-subtract-trailing-key
      - id: micro-behaviors/data/decode/url::js-unescape-without-trailing-key
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
  - id: percent-hidden-character-subtraction
    desc: Percent markup hides character subtraction
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/arithmetic::percent-charcode-subtraction
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/ui/window/insert-html::percent-encoded-document-write
