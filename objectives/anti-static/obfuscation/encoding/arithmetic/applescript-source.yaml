# Offset character decoding with a nearby long numeric table.
# Arithmetic conversion alone also occurs in ordinary ASCII formatting.
# Prefer the source observation when recursive analysis exposes both forms.
defaults:
  for: [applescript, shell]
  platforms: [macos]
  attack: T1027,T1140
traits:
  - id: applescript-offset-character-source
    desc: AppleScript offset character decoder
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)character\s+id.{0,30}as\s+integer\)?\s*[-+]\s*\d+.{0,600}\{(\d+\s*,\s*){12,}'
  - id: applescript-offset-character-encoded
    desc: Encoded AppleScript character decoder
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: '(?is)character\s+id.{0,30}as\s+integer\)?\s*[-+]\s*\d+.{0,600}\{(\d+\s*,\s*){12,}'
    unless:
      - id: applescript-offset-character-source
