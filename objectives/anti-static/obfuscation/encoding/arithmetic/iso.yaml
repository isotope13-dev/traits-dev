defaults:
  platforms: [windows]
  for: [iso]
  attack: T1027

composite_rules:
  - id: iso-stride-decoded-powershell-loader
    desc: ISO hides a dynamic PowerShell loader behind stride decoding
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/payload::iso-powershell-stride-decoder
      - id: metadata/file/format/iso/payload::iso-powershell-command-line
