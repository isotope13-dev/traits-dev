defaults:
  platforms: [windows]
  for: [iso]
  attack: T1027

composite_rules:
  - id: iso-stride-decoded-powershell-loader
    desc: ISO hides a dynamic PowerShell loader behind stride decoding
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1620
    for: [iso, data, batch, powershell]
    scope: archive
    all:
      - id: metadata/file/format/iso/structure::primary-volume-context
      - id: metadata/file/format/iso/payload::iso-powershell-stride-decoder
      - id: micro-behaviors/process/argument/option::powershell-execution-or-window-option
