defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

composite_rules:
  # The required evidence is a co-occurrence, not a statically bound
  # source-to-sink chain. Keep the result suspicious: these mechanics also
  # admit custom packers and protectors with legitimate uses.
  - id: garbled-go-pe-layered-byte-transforms
    desc: Garbled Go PE code with layered byte transforms
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-garbled-main-symbols
      - id: micro-behaviors/data/arithmetic::x64-index-scaled-byte-subtraction-loop
      - id: micro-behaviors/data/arithmetic::x64-adjacent-byte-pair-swap-loop
      - id: micro-behaviors/data/embedded/payload/header::pe-mz-compare-x64
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-function-pointer-dispatch
