defaults:
  for: [javascript]
  platforms: [windows, unix]
composite_rules:
  - id: shifted-unicode-payload
    desc: Dense Unicode strings with computed character offset decoding clues
    crit: suspicious
    attack: T1027
    conf: 0.95
    all:
      - id: metadata/lang/source/literal/string/shape::dense-non-ascii-literals
      - id: micro-behaviors/data/string/access::charcode-method-literal
      - id: micro-behaviors/data/arithmetic::computed-call-subtract-offset
      - id: micro-behaviors/data/arithmetic::byte-mask-or-divide-0xff
