# A clear delimiter frames another delimiter-separated configuration whose
# bytes have all been shifted by +120. The inner .exe extension and delimiters
# are shifted too. This describes concealed configuration, not payload execution.
defaults:
  platforms: [windows]
  for: [data]

traits:
  - id: nested-offset120-executable-config
    desc: Nested byte-shifted executable configuration
    crit: suspicious
    conf: 0.95
    attack: T1027
    if:
      type: hex
      pattern: '5C 40 2F [1-16] D4 B8 A7 [1-128] A6 DD F0 DD D4 B8 A7'
