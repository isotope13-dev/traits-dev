defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  # A nonnumeric suffix is deliberately discarded by parseInt. Ordinary
  # Boolean-to-number conversion does not need this malformed numeric string.
  - id: js-false-to-garbage-suffixed-zero
    desc: Parses false replacement with junk-suffixed zero
    crit: suspicious
    conf: 0.96
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: 'parseInt\([\w$]+\.replace\(["'']false["''],["'']0[A-Za-z_]+["'']\)\)'
      exclude_html_comments: true
