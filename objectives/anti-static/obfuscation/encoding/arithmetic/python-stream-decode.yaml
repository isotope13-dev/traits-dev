# Python stream-decode patterns using arithmetic instead of XOR.
# Same intent as XOR (single-byte stream cipher), different operator.
# Subtraction and modular addition are the most common alternates.  Require
# byte-range arithmetic; ordinary hashing, SimHash, and integer genexprs are
# not stream decoding.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027
  mbc: B0032
traits:
- id: subtract-bytes-genexpr
  desc: Byte subtraction with mask or modulus
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'bytes\([^)]{0,120}-[^)]{0,120}(%\s*(256|0x100)\b|&\s*0xff\b)[^)]{0,80}\s+for\s+\w+\s+in'
- id: add-mod-bytes-genexpr--rx-2
  desc: bytes() addition genexpr over an iterable
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'bytes\([^)]{0,120}\+[^)]{0,120}(%\s*(256|0x100)\b|&\s*0xff\b)[^)]{0,80}\s+for\s+\w+\s+in\b'
- id: byte-range-modulus-or-mask
  desc: Byte-range modulo or mask fragment
  crit: component
  conf: 0.93
  if:
    type: text
    regex: '(?i)(%\s*(256|0x100)\b|&\s*0xff\b)'
composite_rules:
- id: python-stream-decode-aggregator
  desc: Python bytes arithmetic with byte-range normalization
  crit: notable
  conf: 0.94
  any:
  - id: subtract-bytes-genexpr
  - id: add-mod-bytes-genexpr

- id: add-mod-bytes-genexpr
  desc: bytes addition mod 256 decode generator
  crit: notable
  conf: 0.93
  all:
  - id: add-mod-bytes-genexpr--rx-2
  - id: byte-range-constant-evidence
  near_bytes: 128
- id: byte-range-constant-evidence
  desc: Byte-range modulo or mask evidence
  crit: component
  conf: 0.93
  any:
  - id: byte-range-modulus-or-mask
  - id: metadata/lang/source/literal/hex::hex-byte-token-ff
