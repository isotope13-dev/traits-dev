defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: many-bidi-overrides
    desc: Many bidirectional override characters
    crit: notable
    count_min: 100
    if:
      type: text
      regex: '\x{202e}'
  - id: many-escaped-byte-values
    desc: Many hexadecimal byte escapes
    crit: notable
    count_min: 25
    if:
      type: text
      regex: '(\\x[0-9a-fA-F]{2}){4}'
composite_rules:
  - id: oversized-bidi-encoded-activex-loader
    desc: Large bidi-obfuscated script constructs ActiveX
    crit: hostile
    conf: 0.98
    size_min: 262144
    all:
      - id: many-bidi-overrides
      - id: many-escaped-byte-values
      - id: micro-behaviors/os/com/instantiation::computed-activex-progid
