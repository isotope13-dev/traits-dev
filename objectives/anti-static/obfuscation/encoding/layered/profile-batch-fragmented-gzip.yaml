defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-fragmented-gzip-encoding-profile
    desc: Fragmented batch gzip encoding clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-powershell-gzipstream
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-powershell-memorystream
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-frombase64string-concat
      - id: metadata/lang/source/literal/fragment/single::powershell-compression-namespace-clues
    any:
      - id: objectives/anti-static/obfuscation/string/fragmentation::batch-long-random-envvar-reassembly
      - id: metadata/file/line::batch-long-average-lines
    needs: 1
  - id: batch-array-gzip-encoding-profile
    desc: Batch array and gzip encoding clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/string/concat/join::powershell-char-array-join
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
      - id: metadata/file/line::batch-line-over-100000
      - id: metadata/file/line::batch-long-average-lines
      - id: micro-behaviors/process/argument/interpreter::powershell-option-or-operator-prefix
