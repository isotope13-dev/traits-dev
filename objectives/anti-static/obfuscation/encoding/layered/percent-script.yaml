defaults:
  platforms: [windows]
  for: [html, javascript, data]
  conf: 0.95

traits:
  - id: percent-encoded-charcode-decoder
    desc: Percent-encoded character subtraction decoder
    crit: suspicious
    if:
      type: text
      regex: '%2563%2568%2561%2572%2543%256F%2564%2565%2541%2574.{0,100}%252D'

  - id: eval-percent-document-writer
    desc: Eval reconstructs a document.write unescape call
    crit: suspicious
    if:
      type: text
      regex: 'eval\s*\(\s*[''"]document\.write\(unescape\('

