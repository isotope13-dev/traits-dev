defaults:
  crit: suspicious
composite_rules:
  - platforms:
      - windows
    for:
      - data
    id: powershell-base64-deflate-variable-index-clues
    desc: PowerShell Base64, deflate and variable clues
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/index-select::ps-gv-name-index-invoke-data
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/compression::powershell-deflatestream-reference
      - id: micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress
