# Reordering and source clues do not alone establish payload execution.
defaults:
  platforms:
  - windows
  for:
  - data
composite_rules:
- id: powershell-data-reordered-base64-cbc
  desc: Reordered PowerShell with Base64 and CBC clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/string/broken-api::dotnet-frombase64string-obfuscated-data
  - id: micro-behaviors/crypto/symmetric/config::cbc-mode
  - id: objectives/anti-static/obfuscation/string/index-select::ps-large-indexed-format-reorder-data
- id: powershell-data-reorder-invocation-or-culture
  desc: PowerShell reorder and invocation or culture clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/string/index-select::ps-large-indexed-format-reorder-data
  any:
  - id: objectives/anti-static/obfuscation/string/index-select::ps-string-index-invoke-data
  - id: objectives/anti-static/obfuscation/string/index-select::ps-gv-name-index-invoke-data
  - id: micro-behaviors/os/sysinfo/platform/locale::powershell-culture-english-name-text
  needs: 1
