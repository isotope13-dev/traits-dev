defaults:
  platforms:
  - windows
  for:
  - data

composite_rules:
  - id: powershell-obfuscated-deflate-read
    desc: Obfuscated PowerShell compressed-data read
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/file/profile/encoding::dotnet-frombase64string-text
      - id: micro-behaviors/data/decompress/zlib::powershell-data-deflate-decompress
      - id: micro-behaviors/data/buffer/read::powershell-streamreader-readtoend
    any:
      - id: objectives/anti-static/obfuscation/string/concat::ps-gv-name-index-invoke-data
      - id: objectives/anti-static/obfuscation/string/concat::dense-backtick-escapes-data
  - id: powershell-obfuscated-base64-deflate
    desc: Obfuscated PowerShell Base64 and Deflate references
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/file/profile/encoding::dotnet-frombase64string-text
      - id: micro-behaviors/data/codec::powershell-deflatestream-reference
    any:
      - id: objectives/anti-static/obfuscation/string/concat::ps-gv-name-index-invoke-data
      - id: objectives/anti-static/obfuscation/string/concat::dense-format-strings-data
      - id: objectives/anti-static/obfuscation/string/concat::dense-backtick-escapes-data
    needs: 1
