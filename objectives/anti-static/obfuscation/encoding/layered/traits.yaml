defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1027
  mbc: E1014
  for: [scripts, binaries]
traits:
  - id: codecs-rot13
    desc: codecs ROT13 decoding
    crit: suspicious
    conf: 0.85
    size_max: 10000
    if:
      type: string_literal
      regex: codecs\.decode.{0,20}rot13|rot13.{0,20}codecs
  - id: rot13-encoded-string
    desc: ROT13 encoded string literal
    crit: suspicious
    conf: 0.8
    size_max: 10000
    if:
      type: string_literal
      regex: codecs\.decode\('[^']{10,}'
  - id: base64-with-codecs
    desc: Base64 with codecs
    crit: suspicious
    conf: 0.85
    size_max: 15000
    if:
      type: string_literal
      regex: b64decode.{0,20}codecs|codecs.{0,20}b64decode
  - id: encoded-path-assembly
    desc: Encoded path assembly
    crit: suspicious
    conf: 0.85
    size_max: 10000
    if:
      type: string_literal
      regex: codecs\.encode\('/|decode\('/
composite_rules:
  - id: base64-xor-transform
    desc: Base64-decoded data XOR transformation
    crit: suspicious
    conf: 0.9
    for: [python]
    near_bytes: 256
    all:
      - id: micro-behaviors/data/decode/base64::b64decode-call
    any:
      - id: micro-behaviors/data/encode/xor::b64decode-then-xor-bytes
      - id: micro-behaviors/data/encode/xor::xor-bytes-genexpr-key
    unless:
      - id: well-known/tool/offensive/phantom-agent::phantom-secret-storage-context
  - id: rot13-obfuscation
    desc: ROT13 string obfuscation
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: codecs-rot13
      - id: rot13-encoded-string
  - id: base64-layered-encoding
    desc: Layered base64 encoding
    crit: suspicious
    conf: 0.9
    for:
      - python
      - javascript
    needs: 2
    any:
      - id: micro-behaviors/data/decode/base64::b64decode-literal-to-text
      - id: base64-with-codecs
  - id: double-obfuscation
    desc: Double encoding obfuscation
    crit: suspicious
    conf: 0.95
    needs: 3
    any:
      - id: codecs-rot13
      - id: base64-with-codecs
      - id: micro-behaviors/data/string/conversion::python-bytes-string-conversion
      - id: encoded-path-assembly
  - id: advanced-string-obfuscation
    desc: Advanced string obfuscation
    crit: hostile
    conf: 0.98
    all:
      - id: rot13-obfuscation
      - id: base64-layered-encoding
  - id: javascript-custom-decoder-eval-carrier
    desc: Large JavaScript custom-alphabet payload is handed to aliased eval
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1059.007
    mbc: B0032
    for: [javascript]
    scope: file
    all:
      - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-alias-assignment
      - id: metadata/file/metrics::js-many-very-long-strings
    unless:
      - id: metadata/package/testing/
  - id: js-wsh-base64-staged-cleanup-loader
    desc: WSH PowerShell loader stages a large Base64 carrier and cleans it up
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.007
    mbc: B0032
    for: [javascript]
    scope: file
    all:
      - id: objectives/evasion/indicator-removal/cleanup::js-wsh-staged-file-cleanup
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/fs/write/file/stream::adodb-stream

  - id: javascript-large-decoder-eval-loader
    desc: Large JavaScript decoder executes a stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.007
    mbc: B0032
    for: [javascript]
    scope: file
    near_bytes: 8192
    all:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: micro-behaviors/data/decode/custom::js-indexof-source-token
      - id: micro-behaviors/data/encode/char-code::fromcharcode-source-token
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
    unless:
      - id: metadata/package/testing/
      # Webpack's eval devtool embeds ordinary generated modules in eval()
      # strings.  Those bundles can also contain unrelated character-code
      # loops, but they are build output rather than staged payload loaders.
      - id: micro-behaviors/data/source/build::webpack-eval-devtool-comment
      - id: micro-behaviors/data/source/build::webpack-sourceurl-comment
      - id: well-known/lib/ui/x-ite::x-ite-package-context
      - id: well-known/lib/ui/x-ite::x-ite-library-banner

  - id: javascript-custom-alphabet-eval-loader
    desc: JavaScript custom-alphabet decoder executes a stage
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.007
    mbc: B0032
    for: [javascript]
    scope: file
    near_bytes: 8192
    all:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
      - id: micro-behaviors/data/encode/char-code::fromcharcode-source-token
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
    unless:
      - id: metadata/package/testing/
      # Webpack's eval devtool embeds ordinary generated modules in eval()
      # strings.  Those bundles can also contain unrelated character-code
      # loops, but they are build output rather than staged payload loaders.
      - id: micro-behaviors/data/source/build::webpack-eval-devtool-comment
      - id: micro-behaviors/data/source/build::webpack-sourceurl-comment
      - id: well-known/lib/ui/x-ite::x-ite-package-context
      - id: well-known/lib/ui/x-ite::x-ite-library-banner
