defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-rot13-call
    desc: Calls PHP ROT13 decoder
    crit: component
    if: {type: symbol, kind: call, exact: str_rot13}
composite_rules:
  - id: php-base64-rot13-exec-text
    desc: PHP Base64 and ROT13 decoding near command execution
    crit: suspicious
    conf: 0.94
    near_bytes: 520
    all:
      - id: micro-behaviors/data/decode/base64/call::php-base64-decode-call
      - id: php-rot13-call
      - id: micro-behaviors/process/create/shell/command-mode::php-exec

