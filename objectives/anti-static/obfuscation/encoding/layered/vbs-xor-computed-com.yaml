defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vbs-xor-computed-com-obfuscation
    desc: VBScript XOR, computed COM and generated names
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::vbs-xor-character-code
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
