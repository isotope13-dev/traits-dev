defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1027
  mbc: B0032
composite_rules:
  - id: python-multiple-xor-techniques
    desc: Python uses multiple XOR transformation techniques
    crit: suspicious
    conf: 0.93
    size_max: 50000
    needs: 2
    any:
      - id: micro-behaviors/data/encoding/xor/unspecified-key::python-xor-bytes-variable-key
      - id: micro-behaviors/data/encoding/xor/fixed-key::python-literal-key-xor-bytes
      - id: micro-behaviors/data/encode/xor::xor-bytearray-mutating-loop
    unless:
      - id: well-known/lib/format/kaitai::kaitai-python-runtime
      - id: metadata/path/directory::test-directory-component
    downgrade:
      scope: parent
      any:
        - id: metadata/package/testing/presence/corpus::adversarial-fixture-builder-basename
        - id: well-known/lib/format/kaitai::kaitai-python-runtime
