defaults:
  for: [html]
  platforms: [windows, unix]
  attack: T1027

traits:
  - id: large-low-entropy-html
    desc: Large HTML file has low entropy
    crit: notable
    conf: 0.9
    size_min: 262144
    if:
      type: metrics
      field: file.entropy
      max: 3.5
  - id: repeated-double-percent-encoding
    desc: Repeated doubly percent-encoded bytes
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(%25%[0-9a-f]{2}%[0-9a-f]{2}){8}'

composite_rules:
  - id: oversized-double-percent-script-carrier
    desc: Oversized double-encoded script writes HTML
    crit: hostile
    conf: 0.97
    all:
      - id: large-low-entropy-html
      - id: repeated-double-percent-encoding
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
