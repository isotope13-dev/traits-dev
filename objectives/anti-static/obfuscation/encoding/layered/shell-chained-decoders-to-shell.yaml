# An inline blob decoded through a chain of identical decoders and handed
# straight to a shell. The layering serves no transport purpose; it hides
# the command (typically curl ... | sh) from review and from scanners that
# decode a single layer.
defaults:
  platforms: [unix, macos]
  for: [shell, pbxproj, scripts, text]
  crit: hostile
  attack: T1027,T1140,T1059.004

composite_rules:
  - id: layered-decoder-chain-feeds-shell
    desc: Multi-layer decoded blob is piped into a shell
    conf: 0.94
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::encoded-blob-piped-to-shell
    any:
      - id: micro-behaviors/data/decode/multiple-encoding::chained-xxd-reverse-decoders
      - id: micro-behaviors/data/decode/multiple-encoding::chained-base64-decoders
