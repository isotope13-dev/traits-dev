defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: zero-width-managed-resource-xor-writer
    desc: Zero-width managed resource writer with cyclic byte XOR
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: metadata/lang/encoding/shape/character::managed-pe-format-marker-population-206d
      - id: metadata/lang/encoding/shape/character::managed-pe-format-marker-population-206f
      - id: micro-behaviors/data/encoding/xor/cyclic-key::cil-remainder-indexed-key-byte-xor
      - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token

  - id: clr-resource-cyclic-xor-dropper
    desc: Unsigned .NET assembly XOR-decodes high-entropy CLR resources to disk
    crit: suspicious
    conf: 0.96
    attack: T1027,T1140
    all:
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-cil-manifest-resource-stream-call
      - id: micro-behaviors/data/encoding/xor/cyclic-key
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
    unless:
      - id: metadata/signature/verified/
