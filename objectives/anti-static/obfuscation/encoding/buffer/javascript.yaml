# JavaScript/Node.js Obfuscation Patterns
# Detects runtime code generation and obfuscated execution
defaults:
  platforms: [windows, unix]
  attack: T1027
  mbc: B0032
  for: [javascript, typescript]
traits:
  - id: buffer-from-hex-exec
    desc: Executes code decoded from hex buffer
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'exec\s*\(\s*Buffer\.from\s*\([^)]{0,120}[''"]hex[''"]\s*\)\.toString'
  - id: buffer-from-base64-exec
    desc: Executes code decoded from base64 buffer
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'exec\s*\(\s*Buffer\.from\s*\([^)]{0,120}[''"]base64[''"]\s*\)\.toString'

composite_rules:
  - id: buffer-from-hex-variable-command-exec
    desc: Executes variable command decoded from hex
    crit: hostile
    conf: 0.98
    attack: "T1027.013,T1059.007"
    all:
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
      - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
      - id: micro-behaviors/process/create/shell/bridge::js-exec
    near_bytes: 430
