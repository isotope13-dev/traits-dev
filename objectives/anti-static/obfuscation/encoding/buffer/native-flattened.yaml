defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: flattened-xorshift-byte-scrambling
    desc: TLS-flattened code with PRNG byte scrambling
    crit: suspicious
    conf: 0.96
    attack: T1027
    # Repeated concealed dispatch supplies the anti-static context. Require
    # both the state transform and bytewise data scrambling, not PRNG alone.
    # These are file-scoped observations, not a claimed source-to-sink flow.
    all:
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
      - id: micro-behaviors/data/encoding/xor::x64-xorshift-multiply-state-update
      - id: micro-behaviors/data/encoding/xor::x64-shift-selected-byte-xor
