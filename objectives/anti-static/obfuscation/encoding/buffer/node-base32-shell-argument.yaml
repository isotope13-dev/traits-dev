# Source dependency only; standard Node Buffer does not implement Base32.
# Do not infer that decoding succeeds, that the function is called, or that
# a shell starts. Require the actual imported call and bound argument recipe.
defaults:
  platforms: [linux, macos]
  for: [javascript, typescript]
traits:
  - id: node-base32-dependent-shell-argument
    desc: Shell argument depends on Base32 Buffer request
    crit: suspicious
    conf: 0.98
    attack: T1027
    if:
      type: tree-sitter
      query: |
        ((program
         (lexical_declaration "const"
          (variable_declarator
           name: (object_pattern . [(shorthand_property_identifier_pattern) @imported @dispatch
             (pair_pattern key: (property_identifier) @imported value: (identifier) @dispatch)] .)
           value: (call_expression function: (identifier) @require
            arguments: (arguments . (string (string_fragment) @module) .))))
         (lexical_declaration "const"
          (variable_declarator name: (identifier) @table value: (string (string_fragment) @encoded)))
         (function_declaration body: (statement_block
          (lexical_declaration "const"
           (variable_declarator name: (identifier) @entry
            value: (call_expression
             function: (member_expression
              object: (call_expression
               function: (member_expression object: (identifier) @buffer property: (property_identifier) @from)
               arguments: (arguments . (identifier) @table_input . (string (string_fragment) @encoding) .))
              property: (property_identifier) @to_string)
             arguments: (arguments . (string (string_fragment) @charset) .))))
          . (expression_statement (call_expression function: (identifier) @callee
           arguments: (arguments . (string (string_fragment) @shell) .
            (array . (string (string_fragment) @option) . (identifier) @argument .)))) @evidence)))
         (#eq? @imported "execFile")
         (#eq? @dispatch @callee)
         (#eq? @require "require")
         (#match? @module "^(node:)?child_process$")
         (#match? @encoded "^[A-Z2-7]{64,}={0,6}$")
         (#eq? @table @table_input)
         (#eq? @buffer "Buffer")
         (#eq? @from "from")
         (#eq? @encoding "base32")
         (#eq? @to_string "toString")
         (#match? @charset "^utf-?8$")
         (#match? @shell "^/(usr/)?bin/(ba)?sh$")
         (#eq? @option "-c")
         (#eq? @entry @argument))
