defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: hex-xor-shell-command
    desc: Hex-XOR buffer text supplies shell command
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/decode/xor::buffer-from-hex-byte-xor
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: metadata/lang/source/syntax/call/arguments::exec-mapped-buffer-argument
    near_bytes: 4096
