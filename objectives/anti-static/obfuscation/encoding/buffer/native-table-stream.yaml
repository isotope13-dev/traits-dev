defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: flattened-table-stream-string-decoding
    desc: Flattened dispatch with table and stream decoding
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    # File-scoped co-occurrence, not a claimed flow between arbitrary matches.
    all:
      - id: micro-behaviors/data/collection/map::x64-inverse-64-symbol-table
      - id: micro-behaviors/data/decode/stream::x64-word-mixer-inplace-xor-loop
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::repeated-cmov-relative-branch-tables-x64
