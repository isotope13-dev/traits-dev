# A transform is neutral; concealment of command text supplies the objective.
defaults:
  platforms:
  - unix
  for:
  - shell
  crit: suspicious
  conf: 0.97
  attack: T1027
traits:
- id: shell-rot13-curl-pipeline
  desc: ROT13 transforms a curl-to-shell command
  if:
    type: tree-sitter
    query: |-
      ((pipeline
       (command name: (command_name (word) @echo) argument: (raw_string) @encoded)
       (command name: (command_name (word) @tr)
        argument: (raw_string) @alphabet argument: (raw_string) @rotation)) @pipeline

      (#eq? @echo "echo") (#eq? @tr "tr")
      (#eq? @alphabet "'A-Za-z'") (#eq? @rotation "'N-ZA-Mn-za-m'")
      (#match? @encoded "^'phey[ \\t]+[^|]{1,160}[|][ \\t]*(fu|onfu)[ \\t]*'$")
      )
composite_rules:
- id: shell-rot13-dynamic-evaluation
  desc: ROT13 occurs near shell variable evaluation
  near_lines: 2
  all:
  - id: micro-behaviors/data/codec::shell-tr-rot13
  - id: micro-behaviors/process/interpreter/eval/direct::shell-evaluates-variable-command
