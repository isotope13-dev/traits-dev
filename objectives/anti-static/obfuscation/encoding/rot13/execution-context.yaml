# Routed from legacy dropper/execution/encoding after evidence review.
# Encoding or evaluation is retained; no unbound payload handoff is claimed.
defaults:
  crit: suspicious
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1105
  mbc: B0032
composite_rules:
- id: rot13-stealth-dropper
  desc: Obfuscated Python ROT13 execution
  all:
  - id: micro-behaviors/data/encode/rot13::rot13-windows
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/os/sysinfo/platform/host::platform-system
  any:
  - id: micro-behaviors/process/create/flags::detached-process
  - id: micro-behaviors/process/create/direct::python-preexec-hook
- id: rot13-exec-dropper
  desc: Obfuscated Python ROT13 dynamic eval
  all:
  - id: micro-behaviors/data/encode/rot13::rot13-windows
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/communications/http/lib/requests::requests-post
