# JavaScript ROT13 string transformation used to conceal payloads.
defaults:
  crit: suspicious
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - javascript
  - html
  attack: T1027
composite_rules:
  - id: js-rot13-decoded-dom-payload
    desc: ROT13 transforms concealed DOM element
    all:
      - id: micro-behaviors/data/encode/rot13::js-rot13-replace-charcode-transform
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
    any:
      - id: micro-behaviors/ui/window/style::css-display-none
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
  # The evaluated program is hidden twice: hex-encoded, then letter-rotated,
  # and only exists after both transforms run inside the eval() argument.
  # Shift, helper names and literal size vary; the layering does not.
  - id: js-eval-caesar-rotated-hex-source
    desc: Evaluates Caesar-rotated hex-decoded source
    conf: 0.95
    attack: T1027,T1140,T1059.007
    for: [javascript]
    all:
      - id: micro-behaviors/data/encode/rot13::js-caesar-letter-rotation-replace
      - id: micro-behaviors/data/decode/hex::js-hex-number-parse
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
