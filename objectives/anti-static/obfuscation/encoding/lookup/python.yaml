defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027,T1140
composite_rules:
  - id: index-encoded-executable-buffer
    desc: Table-index byte decoding accompanies executable memory allocation
    crit: suspicious
    conf: 0.96
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/table::python-index-modulo-byte-stream
      - id: micro-behaviors/mem/alloc/executable::python-executable-buffer-allocation
  - id: python-index-decoded-native-loader
    desc: Table-index decoded bytes staged and invoked in executable memory
    attack: T1027,T1140,T1620
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/table::python-index-modulo-byte-stream
      - id: micro-behaviors/mem/alloc/executable::python-executable-buffer-allocation
      - id: micro-behaviors/mem/copy::python-ctypes-memmove
      - id: micro-behaviors/process/inject/runtime/call::python-cfunctype-function-pointer-call
