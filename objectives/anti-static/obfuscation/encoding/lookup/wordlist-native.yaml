# Shellcode stored as a 256-entry pointer table of tokens; each encoded word
# is matched by address (not strcmp) and the matching index is the output byte.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1027,T1055
  mbc: B0032

traits:
  - id: pointer-eq-table-lookup
    desc: Pointer-equality lookup between two arrays
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\w+\[[^\]]{0,12}\]\s*==\s*\w+\[[^\]]{0,12}\]'

  - id: write-index-as-byte
    desc: Writes loop index as unsigned char
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\[[^\]]{0,50}\]\s*=\s*\(unsigned char\)\s*\w+'

composite_rules:
  - id: wordlist-pointer-index-decode
    desc: Reconstructs bytes from a 256-entry pointer wordlist
    crit: suspicious
    conf: 0.96
    near_bytes: 512
    all:
      - id: pointer-eq-table-lookup
      - id: write-index-as-byte
      - id: metadata/file/literal::c-256-entry-array-declaration

  - id: wordlist-pointer-index-shellcode
    desc: Wordlist pointer decode into executable memory
    crit: hostile
    conf: 0.98
    attack: T1027,T1055,T1620
    near_bytes: 2048
    all:
      - id: wordlist-pointer-index-decode
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
