# A substitution alphabet built from a long `String.fromCharCode(...)` list,
# then spent one slot at a time (`$[17]`) and interleaved with JSFuck
# coercion picks (`(![]+[])[+!+[]]`, a letter of "false"). No readable
# token of the program survives: every character is either a table slot or a
# coerced-literal index. Injected web loaders (seen inline in compromised
# WordPress posts and their RSS copies) use this to spell the script they
# hand to the Function constructor.
#
# Example: `$=String.fromCharCode(118,82,61,...);_=...;_[_][_]($[0]+(![]+[])
# [+!+[]]+$[1]+...)()`. Counterexample: a short fromCharCode call building
# one word, or a JSFuck demo without an alphabet table.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, xml]
  attack: T1027
  mbc: B0032

traits:
  - id: table-slot-joined-to-jsfuck-pick
    desc: Table slot concatenated with JSFuck letter pick
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '[$_A-Za-z][$\w]{0,7}\[\d{1,2}\]\+\(!?!?\[\]\+\[\]\)\[[!+\[\]]{2,24}\]'

composite_rules:
  - id: charcode-alphabet-jsfuck-interleave
    desc: Char-code alphabet spelled with JSFuck picks
    crit: suspicious
    conf: 0.93
    near_bytes: 3000
    all:
      - id: micro-behaviors/data/decode/char-code::fromcharcode-alphabet-table
      - id: table-slot-joined-to-jsfuck-pick
