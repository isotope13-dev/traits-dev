# A Lua decoder can be carried as plain text under a non-source suffix.
# Radix-64 arithmetic alone is ordinary decoding. Large populations of
# escaped literals and environment/proxy indirection establish concealment;
# neither the carrier filename nor a particular alphabet is required.
defaults:
  platforms: [windows, unix]
  for: [lua, text]

composite_rules:
  - id: lua-escaped-table-radix64-concealment
    desc: Escaped Lua decoder with environment indirection
    crit: suspicious
    conf: 0.96
    attack: T1027
    mbc: B0032
    all:
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings
      - id: micro-behaviors/metaprogramming/reflection::lua-environment-proxy-references
      # Four alphabet indices are accumulated into a 24-bit value, then
      # decomposed into the three decoded bytes. Keep all three roles.
      - id: micro-behaviors/data/arithmetic::lua-radix64-quartet-byte-decomposition
