defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  attack: T1027

composite_rules:
  - id: encoded-fetch-command-shell-resolver
    desc: Encoded URL beside shell-derived request host
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/configuration::node-request-host-from-shell-output
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/communications/http/download/github::github-raw-curl-fetch
