defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027
  crit: suspicious
composite_rules:
  # A reversed string passed through a custom Base64 decoder and into eval is
  # a layered hidden-code execution chain. Requiring both independently
  # detected decoder/eval and reversal/eval patterns distinguishes this from
  # a custom decoder or a reversal helper used on ordinary page data.
  - id: reversed-custom-base64-eval-chain
    desc: Executes reversed custom-Base64 JavaScript payload
    crit: hostile
    conf: 0.95
    attack: T1027.002
    near_bytes: 1500
    all:
      - id: custom-base64-with-eval-syntax
      - id: objectives/anti-static/obfuscation/string/reverse::string-reversal-with-eval-syntax
  # Script text remains available even when a large HTML document has no
  # projected JavaScript calls. This is bounded co-occurrence, not data flow.
  - id: custom-base64-with-eval-syntax
    desc: Custom Base64 decoder beside eval syntax
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-text
      - id: micro-behaviors/data/string/search::incrementing-character-index-lookup
      - id: micro-behaviors/data/arithmetic::shift-mask-octet-unpack
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
