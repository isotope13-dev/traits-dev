defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027
  crit: suspicious
composite_rules:
  - id: custom-base64-helper-eval
    desc: Custom Base64 decoder co-occurs with helper-fed eval
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/encoding::standard-base64-alphabet-text
      - id: micro-behaviors/data/string/search::incrementing-character-index-lookup
      - id: micro-behaviors/data/arithmetic::shift-mask-octet-unpack
      - id: micro-behaviors/process/interpreter/eval/direct::eval-nested-identifier-expression
  # A hand-rolled decoder alone may protect a license check, but stacking
  # string reversal beneath the decode loop leaves no size or compatibility
  # motive: the payload is concealed, then executed.
  - id: reversed-custom-base64-eval-payload
    desc: Reversed hand-decoded Base64 payload reaches eval
    crit: hostile
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/encoding::standard-base64-alphabet-text
      - id: micro-behaviors/data/string/search::incrementing-character-index-lookup
      - id: micro-behaviors/data/arithmetic::shift-mask-octet-unpack
      - id: micro-behaviors/process/interpreter/eval/direct::eval-nested-identifier-expression
