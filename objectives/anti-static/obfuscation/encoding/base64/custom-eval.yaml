defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027
  crit: suspicious
composite_rules:
  - id: custom-base64-helper-eval
    desc: Custom Base64 decoder co-occurs with helper-fed eval
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-text
      - id: micro-behaviors/data/string/search::incrementing-character-index-lookup
      - id: micro-behaviors/data/arithmetic::shift-mask-octet-unpack
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-nested-identifier-call
