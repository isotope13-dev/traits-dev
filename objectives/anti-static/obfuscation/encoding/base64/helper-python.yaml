defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027
  mbc: F0001
composite_rules:
  - id: b64decode-helper-obfuscated-dropper
    desc: Base64 decode helper with encoded C2 and execution
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-wrapper-func
      - id: micro-behaviors/communications/url/encoded::encoded-http-url
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/interpreter/python::sys-executable-popen
    unless:
      - id: metadata/path/directory::test-directory-component
