defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027
  mbc: F0001
traits:
  # A pair of decoder calls is normal in framework and protocol helpers. Keep
  # this anti-static signal for compact stagers, where repeated decoding is
  # concentrated in a small source file rather than spread through a library.
  - id: python-repeated-base64-decodes
    desc: Dense repeated Python Base64 decoder calls
    crit: suspicious
    conf: 0.97
    size_max: 4096
    if:
      id: micro-behaviors/data/decode/base64::multiple-b64decode-calls
composite_rules:
  - id: b64decode-helper-obfuscated-dropper
    desc: Base64 decode helper with encoded C2 and execution
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64::b64decode-wrapper-func
      - id: micro-behaviors/communications/url/encoded::encoded-http-url
    any:
      - id: micro-behaviors/process/create/subprocess::popen-content
      - id: micro-behaviors/process/create/subprocess::sys-executable-popen
    unless:
      - id: metadata/package/testing/
