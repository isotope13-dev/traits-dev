defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  attack: T1027

composite_rules:
  - id: encoded-imds-request-with-numeric-paths
    desc: Encoded metadata address with character-built request paths
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/cloud::base64-metadata-service-address
      - id: micro-behaviors/data/decode/char-code::fromcharcode-arrow-map
      - id: micro-behaviors/communications/http/services/cloud::imds-token-path-codepoint-array
      - id: micro-behaviors/communications/http/request/client::http-request
