defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [ruby]
  attack: T1027
  mbc: C0026

traits:
  # Reverse-shell stagers often hide `require 'socket'` inside a Base64 literal.
  - id: base64-ruby-socket-require-fragment
    desc: Base64 blob encodes Ruby socket require
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: cmVxdWlyZSAnc29ja2V0
composite_rules:
  - id: ruby-fragmented-base64-payload
    desc: Ruby fragmented base64 payload
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/assembly::ruby-long-string-fragment-array
      - id: micro-behaviors/data/decode/base64::base64-decode
