# Bind the substitution to the decoder argument and the decoder to exec.
# Literal-receiver replace calls lack named targets in the call projection.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-unicode-substituted-base64-exec
    desc: Execs Unicode-substituted Base64 source
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140,T1059.006
    if:
      type: tree-sitter
      query: |
        (
          (call
            function: (identifier) @executor
            arguments: (argument_list
              (call
                function: (attribute
                  object: (identifier) @module
                  attribute: (identifier) @decoder)
                arguments: (argument_list
                  (call
                    function: (attribute
                      object: [
                        (string) @payload
                        (call function: (attribute
                          object: (string) @payload))
                      ]
                      attribute: (identifier) @method)
                    arguments: (argument_list
                      . (string) @source
                      . (string) @replacement .)))))) @execution
          (#eq? @executor "exec")
          (#eq? @module "base64")
          (#eq? @decoder "b64decode")
          (#eq? @method "replace")
          (#match? @payload "[^\\x00-\\x7F]")
          (#match? @source "^[\"'][^\\x00-\\x7F][\"']$")
          (#match? @replacement "^[\"'][A-Za-z0-9+/][\"']$")
        )
