# A launcher that carries its real script as a gzip stream in a Base64 literal
# and builds a ScriptBlock from the decompressed text keeps the working code
# out of the file on disk. Text-typed carriers (renamed or extensionless
# scripts) never get their decoded layer analyzed, so the observable launcher
# shape itself is the evidence.
defaults:
  platforms: [windows, unix]
  for: [powershell, text]
  attack: T1027.010
  mbc: E1027

traits:
  - id: powershell-split-api-name-literals
    desc: PowerShell builds API names from split literals
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: "\\('[A-Za-z.]{2,24}'\\+'[A-Za-z.]{2,24}'\\)"

composite_rules:
  - id: powershell-gzip-base64-scriptblock-launcher
    desc: Runs a ScriptBlock built from gzip-compressed Base64 text
    crit: hostile
    conf: 0.96
    attack: T1027.010,T1059.001
    all:
      - id: metadata/file/encoding/base64::base64-decoded-gz
      - id: micro-behaviors/metaprogramming/generation/function::powershell-stream-scriptblock-immediate-invoke
      - id: powershell-split-api-name-literals
