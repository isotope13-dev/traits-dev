# Base64 Decode-to-Exec Patterns
# Decoding base64 content and piping directly to shell interpreters
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  attack: T1027
  platforms: [unix, android, ios]
  for: [shell]
traits:
  - id: base64-d-pipe-shell
    desc: base64 -d piped to shell
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+-d\s*\|\s*shell'
    unless:
    - id: metadata/package/testing/corpus/
  - id: base64-decode-pipe-sh
    desc: base64 --decode piped to sh
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+--decode\s*\|\s*sh'
    unless:
      - id: metadata/package/testing/corpus/
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/oracle-macaron/
  - id: base64-decode-pipe-bash
    desc: base64 --decode piped to bash
    crit: suspicious
    conf: 0.82
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+--decode\s*\|\s*bash\b'
    unless:
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/oracle-macaron/
      - id: "metadata/file/naming::test-directory-component"
    downgrade:
      any:
        - id: well-known/lib/ai/pyaigis
        - id: well-known/tool/detection/
  - id: base64-decode-pipe-shell
    desc: base64 --decode piped to shell
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+--decode\s*\|\s*shell'
  - id: base64-capital-d-pipe-sh
    desc: base64 -D piped to sh
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+-D\s*\|\s*sh\b'
  - id: base64-capital-d-pipe-shell
    desc: base64 -D piped to shell
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+-D\s*\|\s*shell\b'
  # macOS `base64 -D` and GNU `base64 -d`/`--decode`, piped at zsh rather than
  # sh/bash. The optional `/bin/` or `/usr/bin/` prefix is how a JXA
  # doShellScript carrier spells the interpreter (`base64 -D | /bin/zsh -s`).
  - id: base64-decode-pipe-zsh
    desc: base64 decode piped to zsh
    crit: suspicious
    conf: 0.84
    for: [scripts]
    if:
      type: text
      regex: 'base64\s+(-D|--decode|-d)\s*\|\s*(/(usr/)?bin/)?zsh(\s+-s)?\b'
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/defensive-scanner-context::linux-persistence-threat-scanner
  - id: ifs-spaced-base64-pipe-shell
    desc: IFS-expanded Base64 decode pipes into a shell
    crit: suspicious
    conf: 0.98
    for: [shell, python, javascript, typescript, perl, ruby, php]
    if:
      type: text
      regex: '\bbase64\$\{IFS\}-(d|D)\|(/bin/)?(ba)?sh\b'
composite_rules:
  - id: base64-d-pipe-bash
    desc: base64 -d piped to bash
    crit: suspicious
    conf: 0.82
    for: [shell, github-actions]
    near_bytes: 256
    all:
      - id: micro-behaviors/data/decode/base64::base64-pipeline-input
      - id: micro-behaviors/data/decode/base64::decode-pipe-bash
    unless:
      # The shared testing-context exception covers the corpus dir and the
      # news-catalog shape in one slot.
      - id: micro-behaviors/data/decode/base64::serialized-or-heuristic-input-context
      - id: micro-behaviors/process/create/shell/guard::python-command-risk-classifier-context
      - id: well-known/tool/detection/llm-scanner/
      # The whole defensive-scanner context family: any of its members
      # establishes the file is recognized security tooling.
      - id: well-known/tool/detection/defensive-scanner-context/
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/process/create/shell/bridge::runtime-base64-shell-transport
      # Deploy helpers encode their own command text and decode it through
      # bash across ssh; nothing is concealed.
      - id: micro-behaviors/process/create/shell/bridge::shell-base64-transport-roundtrip
      - id: metadata/package/tooling::the-situation-provisioner
  - id: base64-d-pipe-sh
    desc: base64 -d followed by sh interpreter
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions, makefile]
    near_bytes: 64
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-command
      - id: micro-behaviors/process/create/shell/pipeline::base64-output-shell-stdin
    unless:
      - id: runtime-base64-transport-context
      - id: metadata/package/testing/
      - id: metadata/file/naming::rust-source-file-context
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/
      - id: well-known/app/ai/agent-runtime/feral-ai/
      # A JavaScript caller may Base64-encode a runtime command solely to carry
      # it across a shell boundary without quoting problems. There is no static
      # encoded payload to hide in that round-trip; the shell-bridge trait still
      # reports the unusual decode-to-shell capability.
      # Printf-fed variant of the same round trip, built as a wider block.

  # The redirect sibling of the pipe forms above, and the one they all miss.
  # Piping keeps the payload off disk; redirecting stages it as a real script
  # first, which is what a loader does when it wants a file it can invoke,
  # re-invoke, or hand to sudo. Same technique, same grade as
  # `base64-d-pipe-bash` — the disk stop makes it more forensically visible,
  # not more innocent.
  #
  # Both legs are ordinary alone: decoding into a file is fixture handling,
  # running a script by path is automation. It is decoding *into* a path and
  # executing a path in the same breath that describes delivery of code
  # hidden from review, so `near_bytes` keeps them on one command line
  # rather than merely in one file. tj-actions/changed-files (March 2025)
  # wrote exactly one line of it — `base64 -d > /tmp/run.sh && bash
  # /tmp/run.sh` — and the staged script dumped the runner's memory and
  # printed every CI secret it found.
  - id: base64-decode-redirect-exec
    desc: Decoded blob staged to disk then run
    crit: suspicious
    conf: 0.95
    for: [shell, github-actions, javascript, typescript, python]
    near_bytes: 100
    all:
      - id: micro-behaviors/data/decode/command::base64-decode-to-file
      - id: micro-behaviors/process/create/shell/target::shell-exec-script-path
    unless:
      - id: "metadata/file/naming::test-directory-component"
      # Security-hook test tables embed deny-verdict attack strings (decode
      # to file, then run) as inert data in *.test.* files outside tests/.
      - id: metadata/package/testing/harness/runtime/
  - id: base64-decode-exec
    desc: Base64 decode piped to shell
    crit: suspicious
    conf: 0.95
    for: [shell, github-actions]
    any:
      - id: base64-d-pipe-sh
      - id: base64-d-pipe-bash
      - id: base64-d-pipe-shell
      - id: base64-decode-pipe-sh
      - id: base64-decode-pipe-bash
      - id: base64-decode-pipe-shell
      - id: base64-capital-d-pipe-sh
      - id: base64-capital-d-pipe-shell
      - id: base64-decode-pipe-zsh
      - id: ifs-spaced-base64-pipe-shell
      - id: base64-decode-redirect-exec
    unless:
      - id: metadata/file/naming::rust-source-file-context
      - id: well-known/tool/detection/oracle-macaron/
  # The JXA layer's only job is to unwrap an embedded blob into a shell that
  # reads commands from stdin. doShellScript alone is a normal automation
  # call; the base64-to-zsh pipe is what makes this a carrier.
  - id: jxa-embedded-base64-zsh-stdin
    desc: JXA doShellScript feeds base64 into zsh
    crit: hostile
    conf: 0.96
    attack: T1059.002,T1059.004,T1027
    for: [javascript]
    near_bytes: 400
    all:
      - id: micro-behaviors/process/create/script/automation::do-shell-script
      - id: base64-decode-pipe-zsh

  - id: runtime-base64-transport-context
    for: [javascript, typescript, shell, github-actions, makefile]
    desc: Runtime Base64 shell transport forms
    crit: exception
    any:
    - id: micro-behaviors/process/create/shell/bridge::runtime-base64-shell-transport
    - id: micro-behaviors/process/create/shell/bridge::printf-fed-base64-shell-transport
