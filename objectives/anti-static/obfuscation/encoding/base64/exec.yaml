# Base64 Decode-to-Exec Patterns
# Decoding base64 content and piping directly to shell interpreters
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  attack: T1027
  platforms: [unix, android, ios]
  for: [shell]
traits:
  - id: base64-sh-pipeline
    desc: base64 output pipes to sh
    crit: notable
    conf: 0.9
    for: [shell, github-actions]
    if:
      type: text
      regex: '\bbase64\b[^\n|]{0,160}\|\s*sh\b'
    unless:
      - id: metadata/file/profile/identity::rust-source-file-context
  - id: base64-d-pipe-bash
    desc: base64 -d piped to bash
    crit: suspicious
    conf: 0.82
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+-d\s*\|\s*bash\b'
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/defensive-scanner-context::linux-persistence-threat-scanner
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: base64-d-pipe-shell
    desc: base64 -d piped to shell
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+-d\s*\|\s*shell'
  - id: base64-decode-pipe-sh
    desc: base64 --decode piped to sh
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+--decode\s*\|\s*sh'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/detection/oracle-macaron/
  - id: base64-decode-pipe-bash
    desc: base64 --decode piped to bash
    crit: suspicious
    conf: 0.82
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+--decode\s*\|\s*bash\b'
    downgrade:
      any:
        - id: well-known/lib/ai/pyaigis
        - id: well-known/tool/detection/
  - id: base64-decode-pipe-shell
    desc: base64 --decode piped to shell
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+--decode\s*\|\s*shell'
  - id: base64-capital-d-pipe-sh
    desc: base64 -D piped to sh
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+-D\s*\|\s*sh\b'
  - id: base64-capital-d-pipe-shell
    desc: base64 -D piped to shell
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    if:
      type: text
      regex: 'base64\s+-D\s*\|\s*shell\b'
  - id: ifs-spaced-base64-pipe-shell
    desc: IFS-expanded Base64 decode pipes into a shell
    crit: suspicious
    conf: 0.98
    for: [shell, python, javascript, typescript, perl, ruby, php]
    if:
      type: text
      regex: '\bbase64\$\{IFS\}-(d|D)\|(/bin/)?(ba)?sh\b'
composite_rules:
  - id: base64-d-pipe-sh
    desc: base64 -d followed by sh interpreter
    crit: suspicious
    conf: 0.7
    for: [shell, github-actions]
    near_bytes: 64
    all:
      - id: micro-behaviors/data/decode/base64::base64-d-cmd
      - id: base64-sh-pipeline
    unless:
      - id: metadata/file/profile/identity::rust-source-file-context
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/detection/mcp-fence::context
      - id: well-known/app/ai/agent-runtime/feral-ai/

  # The redirect sibling of the pipe forms above, and the one they all miss.
  # Piping keeps the payload off disk; redirecting stages it as a real script
  # first, which is what a loader does when it wants a file it can invoke,
  # re-invoke, or hand to sudo. Same technique, same grade as
  # `base64-d-pipe-bash` — the disk stop makes it more forensically visible,
  # not more innocent.
  #
  # Both legs are ordinary alone: decoding into a file is fixture handling,
  # running a script by path is automation. It is decoding *into* a path and
  # executing a path in the same breath that describes delivery of code
  # hidden from review, so `near_bytes` keeps them on one command line
  # rather than merely in one file. tj-actions/changed-files (March 2025)
  # wrote exactly one line of it — `base64 -d > /tmp/run.sh && bash
  # /tmp/run.sh` — and the staged script dumped the runner's memory and
  # printed every CI secret it found.
  - id: base64-decode-redirect-exec
    desc: Decoded blob staged to disk then run
    crit: suspicious
    conf: 0.95
    for: [shell, github-actions, javascript, typescript, python]
    near_bytes: 100
    all:
      - id: micro-behaviors/data/decode/command::base64-decode-to-file
      - id: micro-behaviors/process/create/shell/target::shell-exec-script-path
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: base64-decode-exec
    desc: Base64 decode piped to shell
    crit: suspicious
    conf: 0.95
    for: [shell, github-actions]
    any:
      - id: base64-d-pipe-sh
      - id: base64-d-pipe-bash
      - id: base64-d-pipe-shell
      - id: base64-decode-pipe-sh
      - id: base64-decode-pipe-bash
      - id: base64-decode-pipe-shell
      - id: base64-capital-d-pipe-sh
      - id: base64-capital-d-pipe-shell
      - id: ifs-spaced-base64-pipe-shell
      - id: base64-decode-redirect-exec
    unless:
      - id: metadata/file/profile/identity::rust-source-file-context
      - id: well-known/tool/detection/oracle-macaron/
