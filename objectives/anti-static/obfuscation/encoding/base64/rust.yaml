# Rust programs occasionally store binary fixtures as Base64, but splitting a
# URL-like constant across a string array and rebuilding it through a decoder
# is an endpoint-concealment structure. Keep the array and decoder as separate
# atoms so the suspicious conclusion requires both shapes.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1027.001
  mbc: B0032

traits:
  - id: rust-endpoint-string-array-constant
    desc: Rust endpoint constant is a string array
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\bconst\s+\w*(URL|URI|HOST|ENDPOINT|ADDRESS)\w*\s*:\s*&\s*\[\s*&str\s*\]'

  - id: rust-repeated-base64-string-literals
    desc: Rust contains repeated Base64 string literals
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      # Base64 padding is optional when a fragment's byte length is already a
      # multiple of three. Requiring `=` on every fragment missed endpoint
      # arrays that mix padded and unpadded chunks.
      regex: '"[A-Za-z0-9+/]{12,}={0,2}"'

  - id: rust-array-iterator-call
    desc: Rust invokes array iterator
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\.iter\s*\(\s*\)'

  - id: rust-base64-decode-item-call
    desc: Rust decodes an iterator item
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\.decode\s*\(\s*[A-Za-z_]\w*\s*\)'

  - id: rust-string-fragment-join-call
    desc: Rust joins string fragments
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\.(collect|concat)\b'

composite_rules:
  - id: rust-base64-endpoint-fragment-array
    desc: Rust endpoint array holds Base64 fragments
    crit: component
    conf: 0.96
    near_bytes: 1200
    all:
      - id: rust-endpoint-string-array-constant
      - id: rust-repeated-base64-string-literals

  - id: rust-base64-fragment-join-decoder
    desc: Rust decodes and joins string fragments
    crit: component
    conf: 0.94
    near_bytes: 900
    all:
      - id: rust-array-iterator-call
      - id: rust-base64-decode-item-call
      - id: rust-string-fragment-join-call

  - id: rust-base64-fragmented-endpoint
    desc: Rust reconstructs an endpoint from Base64 string fragments
    crit: suspicious
    conf: 0.97
    near_bytes: 3000
    all:
      - id: rust-base64-endpoint-fragment-array
      - id: rust-base64-fragment-join-decoder
