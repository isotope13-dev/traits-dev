# Rust programs occasionally store binary fixtures as Base64, but splitting a
# URL-like constant across a string array and rebuilding it through a decoder
# is an endpoint-concealment structure. Keep the array and decoder as separate
# atoms so the suspicious conclusion requires both shapes.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1027.001
  mbc: B0032

traits:
  - id: rust-endpoint-string-array-constant
    desc: Rust endpoint constant is a string array
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bconst\s+\w*(URL|URI|HOST|ENDPOINT|ADDRESS)\w*\s*:\s*&\s*\[\s*&str\s*\]'

  # Named for what the regex can actually tell: a long literal drawn only from
  # the Base64 alphabet. Case shape alone cannot distinguish an encoded chunk
  # from a camelCase identifier ("aHR0cHM6Ly9teS1hcGk" parses as camelCase),
  # so the match requires a digit: ordinary key names ("terminationMessagePath",
  # "NotOlderThan") and lowercase words ("deletecollection") carry none, while
  # a 16-character chunk of encoded bytes almost always does.
  - id: rust-repeated-base64-alphabet-literals
    desc: Repeated Base64-alphabet Rust literals
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      # Base64 padding is optional when a fragment's byte length is already a
      # multiple of three. Requiring `=` on every fragment missed endpoint
      # arrays that mix padded and unpadded chunks.
      regex: '"[A-Za-z0-9+/]*[0-9][A-Za-z0-9+/]{15,}={0,2}"'
    # `/` is in the Base64 alphabet, so URL paths ("/v1/chat/completions") and
    # media types ("application/json") otherwise read as encoded chunks, as do
    # duration literals ("07199254740993ns", "23372036s854ms775us807ns").
    not:
      - regex: '^"/'
      - regex: '^"[a-z]+/[a-z0-9.+-]+"$'
      - regex: '^"[0-9]+([a-z]{1,3}[0-9]+)*[a-z]{1,3}"$'

  - id: rust-base64-decode-item-call
    desc: Rust decodes an iterator item
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\.decode\s*\(\s*[A-Za-z_]\w*\s*\)'

composite_rules:
  - id: rust-base64-endpoint-fragment-array
    desc: Rust endpoint array holds Base64 fragments
    crit: component
    conf: 0.96
    near_bytes: 1200
    all:
      - id: rust-endpoint-string-array-constant
      - id: rust-repeated-base64-alphabet-literals

  - id: rust-base64-fragment-join-decoder
    desc: Rust decodes and joins string fragments
    crit: component
    conf: 0.94
    near_bytes: 900
    all:
      - id: micro-behaviors/data/control-flow/loop::rust-iter-call
      - id: rust-base64-decode-item-call
    any:
      - id: micro-behaviors/data/control-flow/loop::rust-collect-call
      - id: micro-behaviors/data/string/concat::rust-concat-call

  - id: rust-base64-fragmented-endpoint
    desc: Rust reconstructs an endpoint from Base64 string fragments
    crit: suspicious
    conf: 0.97
    near_bytes: 3000
    all:
      - id: rust-base64-endpoint-fragment-array
      - id: rust-base64-fragment-join-decoder
