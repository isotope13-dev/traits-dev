defaults:
  platforms: [windows, unix]
  for: [powershell]

traits:
  # Static method calls are opaque in the PowerShell flow projection. Bind
  # adjacent statements and the identical variable instead of combining an
  # arbitrary decoder and evaluator anywhere in the file. Bind the literal
  # carrier to the decoder input too; consumers can correlate its offset.
  - id: powershell-decoded-variable-eval
    desc: Evaluates an assigned Base64 source literal
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140,T1059.001
    if:
      type: tree-sitter
      query: |
        (statement_list
         (pipeline (assignment_expression
          (left_assignment_expression) @wire
          (assignement_operator) @wire_assign
          (pipeline) @carrier))
         . (pipeline (assignment_expression
          (left_assignment_expression) @decoded
          (assignement_operator) @assign
          (pipeline (pipeline_chain (logical_expression (bitwise_expression (comparison_expression (additive_expression (multiplicative_expression (format_expression (range_expression (array_literal_expression (unary_expression (invokation_expression (argument_list (argument_expression_list (argument_expression (logical_argument_expression (bitwise_argument_expression (comparison_argument_expression (additive_argument_expression (multiplicative_argument_expression (format_argument_expression (range_argument_expression (unary_expression (invokation_expression (argument_list (argument_expression_list (argument_expression (logical_argument_expression (bitwise_argument_expression (comparison_argument_expression (additive_argument_expression (multiplicative_argument_expression (format_argument_expression (range_argument_expression (unary_expression (variable) @wire_input))))))))))))))))))))))))))))))))))) @decoder))
         . (pipeline (pipeline_chain (command
          (command_name) @eval
          (command_elements
           . (command_argument_sep)
           . (array_literal_expression (unary_expression (variable))) @input .))))
         (#match? @wire "^\\$[A-Za-z_]\\w*$")
         (#eq? @wire_assign "=")
         (#match? @carrier "^[\"'][A-Za-z0-9+/]{16,}={0,2}[\"']$")
         (#eq? @wire @wire_input)
         (#match? @decoded "^\\$[A-Za-z_]\\w*$")
         (#eq? @assign "=")
         (#match? @decoder "(?i)^\\[(System\\.)?Text\\.Encoding\\]::(UTF8|Unicode)\\.GetString\\(\\[(System\\.)?Convert\\]::FromBase64String\\(\\$[A-Za-z_]\\w*\\)\\)$")
         (#match? @eval "(?i)^(iex|Invoke-Expression)$")
         (#eq? @decoded @input))
