defaults:
  platforms: [windows, unix]
  for: [powershell]

traits:
  # Static method calls are opaque in the PowerShell flow projection. Bind
  # adjacent statements and the identical variable instead of combining an
  # arbitrary decoder and evaluator anywhere in the file. Bind the literal
  # carrier to the decoder input too; consumers can correlate its offset.
  # Only the carrier is an evidence site: predicate captures bind values but
  # must not add unrelated offsets or repeated evidence extraction work.
  # Decoder text fixes the expression syntax. Wildcards traverse precedence
  # wrappers without separately checking every redundant grammar node type;
  # invocation/argument nodes still bind the actual decoder input variable.
  - id: powershell-decoded-variable-eval
    desc: Evaluates an assigned Base64 source literal
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140,T1059.001
    if:
      type: tree-sitter
      query: |
        (statement_list
         (pipeline (assignment_expression
          (left_assignment_expression) @wire
          (assignement_operator "=")
          (pipeline) @evidence))
         . (pipeline (assignment_expression
          (left_assignment_expression) @decoded
          (assignement_operator "=")
          (pipeline (_ (_ (_ (_ (_ (_ (_ (_ (_ (_ (invokation_expression (argument_list (_ (_ (_ (_ (_ (_ (_ (_ (_ (_ (invokation_expression (argument_list (_ (_ (_ (_ (_ (_ (_ (_ (_ (_ (variable) @wire_input))))))))))))))))))))))))))))))))))) @decoder))
         . (pipeline (pipeline_chain (command
          (command_name) @eval
          (command_elements
           . (command_argument_sep)
           . (array_literal_expression (unary_expression (variable))) @input .))))
         (#match? @evidence "^[\"'][A-Za-z0-9+/]{16,}={0,2}[\"']$")
         (#eq? @wire @wire_input)
         (#match? @decoded "^\\$[A-Za-z_]\\w*$")
         (#match? @decoder "(?i)^\\[(System\\.)?Text\\.Encoding\\]::(UTF8|Unicode)\\.GetString\\(\\[(System\\.)?Convert\\]::FromBase64String\\(\\$[A-Za-z_]\\w*\\)\\)$")
         (#match? @eval "(?i)^(iex|Invoke-Expression)$")
         (#eq? @decoded @input))
