defaults:
  platforms: [unix]
  for: [github_actions]
  attack: T1027,T1082

traits:
  - id: ci-hidden-stage-config64
    desc: CI starts hidden runtime with encoded config
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\.runtime/[A-Za-z0-9_./-]+\s+stage0\s+--config64\s+[A-Za-z0-9+/=]{200,}'
  - id: ci-encoded-home-inventory-root
    desc: Encoded config targets home inventory
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: bnZlbnRvcnlfcm9vdHMiOlsiJEhPTUUi
  - id: ci-encoded-remote-control-path
    desc: Encoded config contains remote control path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: b250cm9sX3BhdGgi

composite_rules:
  - id: ci-encoded-hidden-home-inventory-control
    desc: Encoded CI stage config targets home inventory
    crit: hostile
    conf: 0.99
    all:
      - id: ci-hidden-stage-config64
      - id: ci-encoded-home-inventory-root
      - id: ci-encoded-remote-control-path
