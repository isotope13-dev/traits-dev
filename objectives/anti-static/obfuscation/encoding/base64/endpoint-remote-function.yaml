# A Base64-hidden HTTP endpoint whose response body is run through
# `new Function("require", data)`: the URL never appears in clear text, and
# what it returns is executed with module-loading rights. Either half is
# seen in ordinary code; together they conceal the staging server of a
# remote-code loader.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: base64-endpoint-response-function-executor
    desc: Base64-hidden endpoint feeds Function with require
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: objectives/command-and-control/dropper/script-eval/remote-code::function-require-response-data-ast
