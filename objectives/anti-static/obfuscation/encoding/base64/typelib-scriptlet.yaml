# Base64 alone is ordinary encoding. Require the TypeLib scriptlet takeover
# before interpreting the encoded scriptlet source as payload concealment.
# These are file-scoped observations, not a source-to-file data-flow claim.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: typelib-base64-scriptlet-concealment
    desc: TypeLib hijack carries a Base64 scriptlet decoder
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: objectives/persistence/system/registry/com-hijack::typelib-scriptlet-hijack
      - id: micro-behaviors/os/com/automation::base64-scriptlet-element
      - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
