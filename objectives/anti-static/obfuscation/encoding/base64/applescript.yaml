defaults:
  platforms: [macos]
  for: [applescript]
  crit: suspicious
  conf: 0.95

composite_rules:
  - id: compiled-applescript-base64-shell-pipeline
    desc: AppleScript executes base64 shell pipeline
    all:
      - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
      - id: micro-behaviors/data/decode/base64::decode-pipe-shell
