defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1027,T1105,T1059.007,T1195.002"

composite_rules:
  # Base64 is common in ordinary data handling. It becomes an attack pattern
  # here only when the decoded URL feeds an executable write and a detached
  # process during module initialization.
  - id: encoded-import-time-executable-stage
    desc: Base64-obscured URL feeds an import-time executable stage
    crit: hostile
    conf: 0.995
    scope: archive
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/file/write/async::node-write-file-promise
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/data/control-flow/module-exec::module-leading-promise-chain-call
