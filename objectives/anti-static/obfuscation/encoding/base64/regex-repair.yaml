# String repair before decoding conceals the Base64 representation. This
# observation alone establishes neither file creation nor payload activation.
defaults:
  platforms: [windows]
  for: [batch, powershell]
traits:
  - id: ps-regex-repaired-base64
    desc: PowerShell regex repairs Base64
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)FromBase64String.{0,80}\[regex\]::Replace'
