# Custom Base64 decoder tables in Lua source.  This is an obfuscation signal,
# not a language fact: a normal operator-precedence table can also contain
# entries such as ["+"] = 9.
defaults:
  platforms: [windows, unix]
  for: [lua]
  attack: T1027.001
  mbc: B0032

composite_rules:
  - id: custom-base64-alphabet-table
    desc: Lua maps many Base64 alphabet characters
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/source/literal/array::lua-letter-index-entries
      - id: metadata/lang/source/literal/array::lua-base64-symbol-index