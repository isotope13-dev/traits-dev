# Custom Base64 decoder tables in Lua source.  This is an obfuscation signal,
# not a language fact: a normal operator-precedence table can also contain
# entries such as ["+"] = 9.
defaults:
  platforms: [windows, unix]
  for: [lua]
  attack: T1027.001
  mbc: B0032

traits:
  # Repeated data keys such as ["x"] = 418 are not an alphabet. A decoder
  # table also maps a non-letter alphabet symbol: +, /, or the URL-safe pair.
  - id: lua-letter-alphabet-index
    desc: Lua letter mapped to an index
    crit: notable
    conf: 0.9
    count_min: 50
    if:
      type: text
      regex: '\["[A-Za-z]"\]\s*=\s*\d+[,;]'
  - id: lua-base64-symbol-index
    desc: Lua maps a Base64 symbol index
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\["[+/_-]"\]\s*=\s*\d+[,;]'
composite_rules:
  - id: custom-base64-alphabet-table
    desc: Lua maps many Base64 alphabet characters
    crit: suspicious
    conf: 0.9
    all:
      - id: lua-letter-alphabet-index
      - id: lua-base64-symbol-index
