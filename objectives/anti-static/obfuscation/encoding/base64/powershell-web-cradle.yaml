defaults:
  platforms: [windows]
  for: [text, batch, powershell]
  attack: T1027,T1059.001

composite_rules:
  - id: base64-powershell-web-cradle
    desc: Base64-encoded PowerShell command invokes web download cradle
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::text-powershell-encoded-command
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::base64-powershell-web-cradle-call
