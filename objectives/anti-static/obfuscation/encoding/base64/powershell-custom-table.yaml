# Hand-rolled Base64 alphabet + bitwise unpack feeding Invoke-Expression.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001
  mbc: E1027

traits:
  - id: ps-b64-bitwise-unpack
    desc: Base64 bitwise shift unpack loop
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?is)-shl\s+18.{0,80}-shl\s+12.{0,80}-shl\s+6'

  - id: ps-iex-decoded-payload
    desc: IEX of a decoded payload variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Same-line only: `\s+` previously matched `… | iex` in a usage comment
      # across a blank line into `$ErrorActionPreference`.
      regex: '(?i)\b(iex|Invoke-Expression)\b[ \t]+\$\w+'

composite_rules:
  - id: ps-custom-b64-table-iex
    desc: Custom Base64 decode executed via IEX
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base64::standard-base64-alphabet-table
      - id: ps-b64-bitwise-unpack
      - id: ps-iex-decoded-payload
    near_bytes: 2048

  - id: ps-custom-b64-bitwise-decoder
    desc: Hand-rolled Base64 bitwise decoder
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base64::standard-base64-alphabet-table
      - id: ps-b64-bitwise-unpack
    near_bytes: 1024
