defaults:
  attack: T1027
  mbc: C0027
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: bcdedit-base64
    desc: Base64 encoded bcdedit command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: YmNkZWRpdC
  - id: bcdedit-cmd-base64
    desc: Base64 encoded cmd.exe /c bcdedit
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: Y21kLmV4ZSAvYyBiY2RlZGl0
  - id: vssadmin-base64
    desc: Base64 encoded vssadmin command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: dnNzYWRtaW4
  # Reconnaissance commands smuggled past eyeballs in encoded form — the
  # PaperCut NG/MF pre-auth RCE chain ran `whoami & ver` / `whoami & ver &
  # tasklist` from application logs as bare base64 strings. Logs and config
  # dumps carry these too, so the for-list widens past scripts/binaries.
  - id: whoami-base64
    desc: Base64 encoded whoami command
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries, data, text, json]
    if:
      type: text
      substr: d2hvYW1p
  - id: tasklist-base64
    desc: Base64 encoded tasklist command
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries, data, text, json]
    if:
      type: text
      substr: dGFza2xpc3Q
