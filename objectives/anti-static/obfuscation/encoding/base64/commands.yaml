defaults:
  crit: suspicious
  conf: 0.9
  attack: T1027
  mbc: C0027
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: bcdedit-base64
    desc: Base64 encoded bcdedit command
    if:
      type: text
      substr: YmNkZWRpdC
    unless:
      - id: metadata/file/format/structured::sourcemap-inline-base64
  - id: bcdedit-cmd-base64
    desc: Base64 encoded cmd.exe /c bcdedit
    if:
      type: text
      substr: Y21kLmV4ZSAvYyBiY2RlZGl0
    unless:
      - id: metadata/file/format/structured::sourcemap-inline-base64
  - id: vssadmin-base64
    desc: Base64 encoded vssadmin command
    if:
      type: text
      substr: dnNzYWRtaW4
    unless:
      - id: metadata/file/format/structured::sourcemap-inline-base64
  # Reconnaissance commands smuggled past eyeballs in encoded form — the
  # PaperCut NG/MF pre-auth RCE chain ran `whoami & ver` / `whoami & ver &
  # tasklist` from application logs as bare base64 strings. Logs and config
  # dumps carry these too, so the for-list widens past scripts/binaries.
  - id: whoami-base64
    desc: Base64 encoded whoami command
    for: [scripts, binaries, data, text, json]
    # The token has to be the whole blob. A longer base64 table or encoded
    # payload contains these eight characters by coincidence.
    if:
      type: text
      regex: '(^|[^A-Za-z0-9+/])d2hvYW1p([^A-Za-z0-9+/]|$)'
    unless:
      # Inline maps encode the original source wholesale. A command token in
      # that map is not an encoded command executed by the shipped script.
      - id: metadata/file/format/structured::sourcemap-inline-base64
      # Web fonts embedded in CSS stylesheets encode icon glyph names in their
      # base64 font data, not an encoded system command.
      - id: metadata/file/format/markup::css-selector-rule-block
  - id: tasklist-base64
    desc: Base64 encoded tasklist command
    for: [scripts, binaries, data, text, json]
    # The token has to be the whole blob. A longer base64 table (Monaco's
    # packed word list) contains these eleven characters by coincidence.
    if:
      type: text
      regex: '(^|[^A-Za-z0-9+/])dGFza2xpc3Q([^A-Za-z0-9+/]|$)'
    unless:
      - id: metadata/file/format/structured::sourcemap-inline-base64
      # Web fonts embedded in CSS stylesheets encode icon glyph names in their
      # base64 font data, not an encoded system command.
      - id: metadata/file/format/markup::css-selector-rule-block
