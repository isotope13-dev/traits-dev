# Custom Base64 alphabets embedded in native loaders for C2 body encoding.
# A pad character '=' sitting mid-alphabet (not as trailing padding) marks a
# shuffled substitution alphabet rather than encoded payload data.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1132.001
  mbc: B0032

traits:
  - id: mid-equals-b64-alphabet
    desc: Mid-equals Base64 alphabet literal
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '["''][A-Za-z0-9+/]{8,64}=[A-Za-z0-9+/]{8,64}["'']'
