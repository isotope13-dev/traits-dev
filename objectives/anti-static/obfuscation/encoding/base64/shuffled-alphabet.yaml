# Custom Base64 alphabets embedded in native loaders for C2 body encoding.
# A pad character '=' sitting mid-alphabet (not as trailing padding) marks a
# shuffled substitution alphabet rather than encoded payload data.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1132.001
  mbc: B0032

traits:
  - id: mid-equals-b64-alphabet
    desc: Mid-equals Base64 alphabet literal
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # A custom alphabet is a long 64-symbol table with the pad character
      # embedded inside it. Requiring a substantial suffix after '=' avoids
      # treating ordinary key=value strings as an alphabet. Real Base64
      # alphabets include '/' and '+'; BIND base32hex tables are alphanumeric only.
      regex: '["''][A-Za-z0-9+/]*/[A-Za-z0-9+/]{0,31}=[A-Za-z0-9+/]{32,56}["'']'
    unless:
      - id: well-known/app/utility/mocktail::mocktail-runtime-context
      # Perl's generated Unicode keyword MPH table contains fixed-width
      # alphanumeric lookup chunks with embedded '/', '=' characters. They
      # are searchable keywords, not a custom encoding alphabet.
      - id: well-known/lib/runtime/scripted/perl-runtime::generated-unicode-keyword-table

composite_rules:
  # Browser script that decodes a fetched response through a reordered Base64
  # alphabet before parsing it: the server channel is concealed from anything
  # that would recognise standard Base64.
  - id: permuted-alphabet-decoded-remote-response
    desc: Decodes fetched response with reordered Base64
    crit: hostile
    conf: 0.95
    platforms: [windows, unix]
    for: [javascript, typescript]
    attack: T1132.002
    all:
      - id: metadata/lang/encoding/shape/character::permuted-base64-alphabet-literal-js
      - id: micro-behaviors/data/decode/quartet-base64::base64-character-index-loop
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/parse/json::js-json-parse-direct-or-computed
