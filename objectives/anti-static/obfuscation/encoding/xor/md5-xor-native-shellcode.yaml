# Encoded percent-word x86 instructions from the standard MD5-XOR packer.
# The decoded words are FS:[0x30] PEB access followed by loader traversal.
defaults:
  for: [html, javascript]
  platforms: [windows]
  conf: 0.99
composite_rules:
  - id: md5-xor-concealed-native-shellcode
    desc: MD5-XOR browser writer reconstructs native x86 shellcode
    crit: hostile
    attack: T1027
    all:
      - id: micro-behaviors/process/info/current::md5-xor-x86-peb-resolver-words
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: objectives/anti-static/obfuscation/encoding/xor::percent-xor-document-concealment
      - id: objectives/anti-static/obfuscation/string/fragmentation::fragmented-percent-xor-content
