defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  - id: html-jump-xor-hidden-com-mask
    desc: HTML native entry carries XOR-hidden executable mask
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/decode/xor::dos-call-relative-com-mask-decode
      - id: metadata/document/html::title-tag-nop-jump-entry
