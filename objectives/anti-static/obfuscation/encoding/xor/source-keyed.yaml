defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: percent-wrapped-xor-eval-with-filtering
    desc: Percent eval with source filtering and XOR
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/string/conversion::filtered-eval-string-conversion
      - id: objectives/anti-static/obfuscation/syntax::html-eval-unescape-decoder
      - id: micro-behaviors/data/arithmetic::js-charcode-xor-operation
    near_bytes: 2048
