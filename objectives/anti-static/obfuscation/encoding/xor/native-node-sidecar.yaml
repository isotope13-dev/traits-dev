# Native loader control flow reads a dotfile, XORs its buffer, then launches
# the reconstructed source from a hidden temporary path. No key is required.
defaults:
  platforms: [linux, windows]
  for: [elf, pe]

composite_rules:
  - id: native-node-xor-sidecar-stage
    desc: Hidden Node stage beside buffer XOR loop
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/encoding/xor::x64-vector-buffer-xor-loop
    any:
      - id: objectives/execution/payload/file-exec::native-addon-hidden-sidecar-node-dropper
      - id: objectives/execution/payload/file-exec::native-addon-hidden-sidecar-temp-js-dropper
