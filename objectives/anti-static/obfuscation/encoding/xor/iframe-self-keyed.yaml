defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: appended-iframe-source-keyed-concealment
    desc: Injected iframe uses source-keyed XOR hiding
    crit: hostile
    conf: 0.99
    all:
      - id: percent-self-keyed-xor-eval
      - id: objectives/execution/interpreter/eval/document::appended-percent-function-eval
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
