# Potassium conceals the stream-cipher initialization constant itself, in
# addition to encrypting its configuration. Match the algorithm's fixed sigma
# bytes under every nonzero byte-XOR key, rather than the campaign's 0xa5 key.
# The same sigma is shared by ChaCha and Salsa; it cannot identify either one
# alone, and does not establish encrypted C2 traffic or malicious execution.
defaults:
  platforms: [unix, windows, android]
  for: [elf, pe, macho, static-lib]
  crit: suspicious
  conf: 0.98
  attack: T1027

traits:
  - id: xor-concealed-stream-cipher-sigma
    desc: XOR-hidden ChaCha/Salsa sigma constant
    if:
      type: yara
      source: |
        rule xor_concealed_stream_cipher_sigma {
          strings:
            $sigma = "expand 32-byte k" xor(1-255)
          condition:
            $sigma
        }
