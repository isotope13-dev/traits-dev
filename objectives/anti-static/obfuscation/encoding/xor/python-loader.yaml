defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1027
  mbc: B0032
traits:
- id: itertools-cycle-xor-cond-3--inline-26848
  desc: Matches 'IFYOUWANTTHEARTISTSTOGETP...'
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: IFYOUWANTTHEARTISTSTOGETPAIDDONOTDOWNLOADFROMMIXCLOUD
composite_rules:
- id: xor-base64-exec-loader
  desc: XOR + base64 decode + exec payload loader
  crit: hostile
  conf: 0.95
  all:
  # A cyclic iterator and an XOR expression do not by themselves establish
  # concealment: ordinary WebSocket clients use both for frame masking.
  # Preserve the original loader conjunction and its exclusions here; the
  # neutral XOR operation and byte-transform traits remain independently visible.
  - id: micro-behaviors/data/control-flow/loop::python-itertools-cycle-call
  - id: micro-behaviors/data/arithmetic::python-xor-expression
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/data/decode/base64::b64decode-call
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: itertools-cycle-xor-cond-3--inline-26848
  - id: metadata/path::test-directory-component
- id: bytewise-xor-base64-exec-loader
  desc: Python reconstructs and executes a Base64-XOR payload
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.006
  scope: file
  near_bytes: 512
  all:
  - id: micro-behaviors/data/arithmetic::source-xor-operation
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/string/conversion::python-chr-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
