defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: hex-table-xor-text-decoder
    desc: Self-redefining hex table accompanies XOR text decoding
    crit: suspicious
    conf: 0.95
    attack: T1027,T1140
    near_bytes: 32768
    all:
      - id: metadata/lang/source/literal/array::javascript-hex-string-array-prefix
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::self-redefining-string-array-function
      - id: micro-behaviors/data/bitwise/xor/expression::js-ts-parsed-xor-expression
      - id: micro-behaviors/data/decode/utf8::textdecoder-constructor-call
