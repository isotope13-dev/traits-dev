# In-place XOR stream of 32-byte records keyed by a leading byte, terminated
# by the 0x11C311C3 marker used by WordlistLoader-class shellcode.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1027
  mbc: B0032

traits:
  - id: xor-stream-end-marker
    desc: 0x11C311C3 XOR-stream terminator
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)0x11C311C3'

  - id: thirty-two-byte-xor-loop
    desc: 32-iteration in-place XOR loop
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'for\s*\([^)]{0,48}32[^)]{0,24}\)[\s\S]{0,80}\^='

composite_rules:
  - id: keyed-32-byte-xor-stream
    desc: Keyed 32-byte XOR records with stream terminator
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: xor-stream-end-marker
      - id: thirty-two-byte-xor-loop
