defaults:
  for: [html, javascript]
  platforms: [windows, unix]
composite_rules:
  - id: character-xor-eval
    desc: Character XOR reconstruction with eval
    crit: suspicious
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/data/string/conversion::js-fromcharcode-xor-result
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
    unless:
      - id: well-known/tool/development/testing/mabl::mabl-cli-runtime-context
      - id: well-known/tool/development/agent/anthropic-claude-agent::official-package-identity
      - id: well-known/lib/crypto/node-forge::node-forge-crypto-library
  # The computed-eval twin of the rule above: the same character-code XOR
  # decode loop, but the decoded text dispatches through a computed
  # property (`globalThis[name](...)`) instead of a literal eval call, so
  # the eval-text legs miss it. The charCodeAt read plus the computed
  # dispatch is the loader half; the XOR expression is the decoder half.
  - id: xor-decode-computed-dispatch
    desc: XOR-decoded text dispatched via computed call
    crit: hostile
    conf: 0.94
    attack: T1027,T1059.007
    for: [html]
    all:
      - id: micro-behaviors/data/encode/xor::embedded-js-xor-character-code
      - id: micro-behaviors/data/string/conversion::charcodeat-text-expression
      - id: micro-behaviors/data/control-flow/dispatch::js-computed-property-call
  # The keyed narrow twin of character-xor-eval above: the same XOR rebuild
  # plus eval, but the XOR key itself arrives concealed as a Base64 blob
  # decoded at runtime. A self-contained key plus ciphertext plus eval is
  # the TDS-loader stage shape; legitimate decoders ship plaintext keys.
  - id: atob-keyed-xor-eval-loader
    desc: atob-keyed XOR stage executed through eval
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    for: [html]
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/base64::atob-embedded-base64-literal
      - id: micro-behaviors/data/encode/xor::embedded-js-xor-character-code
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
