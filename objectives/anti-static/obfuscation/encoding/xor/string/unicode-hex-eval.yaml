defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1140,T1059.007

composite_rules:
  - id: hex-xor-reconstruction-near-eval
    desc: Hex parsing and XOR character rebuilding near eval
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/data/decode/hex::js-hex-number-parse
      - id: micro-behaviors/data/decode/xor/reconstruction::fromcharcode-xor-rebuild
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-identifier-arg-text

  # Padding can dominate a multi-megabyte carrier, so window the decoder
  # and evaluation separately from the ciphertext. No campaign key, marker,
  # filename, or unverified downstream malware identity supplies evidence.
  - id: unicode-padded-hex-xor-wsh-eval
    desc: WSH evaluates a Unicode-padded hex/XOR script stage
    crit: hostile
    conf: 0.98
    all:
      - id: hex-xor-reconstruction-near-eval
      - id: objectives/anti-static/obfuscation/steganography/unicode::unicode-padded-hexadecimal
      - id: metadata/lang/runtime::wscript-host-reference
