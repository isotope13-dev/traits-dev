# Strings hidden by XOR with their own byte position (b[i] ^ i), the
# downloader-config scheme Banload-era builders append after the packed
# image: the stub reads its own file, XORs each byte with its index, checks
# for an `h` and fetches the result. Because the key is the position, the
# scheme prefix always encodes the same way when the string starts the
# buffer: `http://` -> `huvs>*)`, `https://` -> `huvsw?)(`. That anchor is
# the invariant across hosts, paths and filenames; the scanner's own XOR
# decoder only runs on files typed PE, and FSG-style headers type as data.
defaults:
  platforms: [windows]
  for: [pe, dll, data]
  attack: T1027

traits:
  - id: indexed-xor-http-url
    desc: Position-keyed XOR hides an HTTP URL
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: 'huvs(>\*\)|w\?\)\()[\x21-\x7e]'
  # Decodes forward from the anchor until a dot, then requires a native
  # executable extension followed by the encoded terminator or a query, with
  # every byte between still decoding to printable URL text.
  - id: indexed-xor-executable-url
    desc: Position-keyed XOR hides an executable URL
    crit: suspicious
    conf: 0.95
    attack: T1027,T1105
    if:
      type: yara
      source: |
        rule indexed_xor_executable_url {
          strings:
            $u = { 68 75 76 73 ( 3E 2A 29 | 77 3F 29 28 ) }
          condition:
            for any i in (1..#u) : (
              for any j in (12..160) : (
                (uint8(@u[i] + j) ^ (j & 0xFF)) == 0x2E and
                ((uint8(@u[i] + j + 4) ^ ((j + 4) & 0xFF)) == 0x00 or (uint8(@u[i] + j + 4) ^ ((j + 4) & 0xFF)) == 0x3F) and
                (
                          (((uint8(@u[i] + j + 1) ^ ((j + 1) & 0xFF)) | 0x20) == 0x65 and ((uint8(@u[i] + j + 2) ^ ((j + 2) & 0xFF)) | 0x20) == 0x78 and ((uint8(@u[i] + j + 3) ^ ((j + 3) & 0xFF)) | 0x20) == 0x65)
                          or (((uint8(@u[i] + j + 1) ^ ((j + 1) & 0xFF)) | 0x20) == 0x73 and ((uint8(@u[i] + j + 2) ^ ((j + 2) & 0xFF)) | 0x20) == 0x63 and ((uint8(@u[i] + j + 3) ^ ((j + 3) & 0xFF)) | 0x20) == 0x72)
                          or (((uint8(@u[i] + j + 1) ^ ((j + 1) & 0xFF)) | 0x20) == 0x63 and ((uint8(@u[i] + j + 2) ^ ((j + 2) & 0xFF)) | 0x20) == 0x6F and ((uint8(@u[i] + j + 3) ^ ((j + 3) & 0xFF)) | 0x20) == 0x6D)
                          or (((uint8(@u[i] + j + 1) ^ ((j + 1) & 0xFF)) | 0x20) == 0x70 and ((uint8(@u[i] + j + 2) ^ ((j + 2) & 0xFF)) | 0x20) == 0x69 and ((uint8(@u[i] + j + 3) ^ ((j + 3) & 0xFF)) | 0x20) == 0x66)
                          or (((uint8(@u[i] + j + 1) ^ ((j + 1) & 0xFF)) | 0x20) == 0x6D and ((uint8(@u[i] + j + 2) ^ ((j + 2) & 0xFF)) | 0x20) == 0x73 and ((uint8(@u[i] + j + 3) ^ ((j + 3) & 0xFF)) | 0x20) == 0x69)
                          or (((uint8(@u[i] + j + 1) ^ ((j + 1) & 0xFF)) | 0x20) == 0x64 and ((uint8(@u[i] + j + 2) ^ ((j + 2) & 0xFF)) | 0x20) == 0x6C and ((uint8(@u[i] + j + 3) ^ ((j + 3) & 0xFF)) | 0x20) == 0x6C)
                ) and
                for all k in (8..j - 1) : (
                  (uint8(@u[i] + k) ^ (k & 0xFF)) > 0x20 and
                  (uint8(@u[i] + k) ^ (k & 0xFF)) < 0x7F
                )
              )
            )
        }
