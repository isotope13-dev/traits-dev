defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
composite_rules:
  - id: native-concealed-browser-database
    desc: Position-XOR decoder with a concealed browser credential filename
    crit: suspicious
    conf: 0.99
    attack: T1027
    all:
      - id: micro-behaviors/fs/path/credential/password-store::indexed-xor-login-data
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-position-multiplied-word-xor
