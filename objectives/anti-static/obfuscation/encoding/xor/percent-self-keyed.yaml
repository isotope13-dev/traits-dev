defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: suspicious
  conf: 0.98
traits:
  - id: percent-filtered-function-key
    desc: Percent eval filters a function decoding key
    if:
      type: text
      regex: 'eval%28%27[^%]{5,}%27\.replace%28/[^/]{1,60}/g%2C%20%27%27%29%29\.toString%28%29\.replace'
  - id: percent-nested-charcode-xor-reconstruction
    desc: Percent-escaped nested character-code XOR
    if:
      type: text
      regex: 'charCodeAt%28[\w$]+%29%5E%28[\w$]+\.charCodeAt%28'
  - id: percent-decoded-variable-eval
    desc: Percent-escaped eval executes a variable
    if:
      type: text
      regex: 'eval%28[\w$]+%29%3B'
composite_rules:
  - id: percent-self-keyed-xor-eval
    desc: Percent eval hides source-keyed XOR decoding
    all:
      - id: percent-filtered-function-key
      - id: percent-nested-charcode-xor-reconstruction
      - id: objectives/anti-static/obfuscation/syntax::html-eval-unescape-decoder
    near_bytes: 2048
