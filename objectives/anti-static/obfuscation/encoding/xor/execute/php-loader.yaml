defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1027,T1059.006
  mbc: B0032,B0030

composite_rules:
  - id: php-xor-decode-exec-loader
    desc: PHP executes XOR-decoded callable or payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/hex::php-packed-hex-before-xor
      - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
    any:
      - id: micro-behaviors/data/collection/array::php-array-callback-intersection-api
      - id: micro-behaviors/data/collection/array::php-array-callback-difference-api
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::php-callback-dispatch
      - id: micro-behaviors/metaprogramming/reflection/invoke::php-callback-array-dispatch
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: micro-behaviors/data/control-flow/assert::php-assert-call
