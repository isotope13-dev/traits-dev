defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1027,T1059.006
  mbc: B0032,B0030

composite_rules:
  - id: php-xor-decode-eval-stage
    desc: PHP evaluates hex-XOR reconstructed payload
    crit: hostile
    conf: 0.98
    near_bytes: 768
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::php-hex-xor-reconstruction
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-identifier-argument
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-result-argument
      - id: micro-behaviors/process/interpreter/eval/direct::eval-xor-or-subscript-argument

  - id: php-xor-decode-exec-loader
    desc: PHP executes XOR-decoded callable or payload
    crit: hostile
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::php-hex-xor-reconstruction
      - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
    any:
      - id: micro-behaviors/data/collection/array::php-array-callback-dynamic-callable
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-computed-expression-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::php-dispatcher-dynamic-callable
      - id: micro-behaviors/process/interpreter/eval/direct::php-eval-dynamic-payload
      - id: micro-behaviors/data/control-flow/assert::php-assert-dynamic-payload
