defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1027
  mbc: B0032
composite_rules:
- id: xor-base64-exec-loader
  desc: XOR + base64 decode + exec payload loader
  crit: hostile
  conf: 0.95
  all:
  # A cyclic iterator and an XOR expression do not by themselves establish
  # concealment: ordinary WebSocket clients use both for frame masking.
  # Preserve the original loader conjunction and its exclusions here; the
  # neutral XOR operation and byte-transform traits remain independently visible.
  - id: micro-behaviors/data/collection/create::python-itertools-cycle-call
  - id: micro-behaviors/data/bitwise/mixed::python-xor-expression
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  unless:
  - id: well-known/app/media/mixcloud::mixcloud-download-warning
  - id: metadata/path/directory::test-directory-component
- id: bytewise-xor-base64-exec-loader
  desc: Python reconstructs and executes a Base64-XOR payload
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.006
  scope: file
  near_bytes: 512
  all:
  - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: micro-behaviors/data/string/conversion::python-chr-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
