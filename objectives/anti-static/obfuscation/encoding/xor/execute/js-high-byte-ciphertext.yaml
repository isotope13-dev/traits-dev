# Binary ciphertext carried as a high-byte escaped string literal (or a cipher
# round smuggled as an eval'd string), rebuilt by XORing char codes back into
# text, and handed to eval.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: concealed-ciphertext-xor-decoded-to-eval
    desc: Evaluates XOR-decoded concealed ciphertext
    crit: hostile
    conf: 0.95
    attack: T1027
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::js-array-xor-character-reconstruction
      - id: micro-behaviors/process/interpreter/eval/javascript::eval-call-text
    any:
      - id: metadata/lang/encoding/hex::js-high-byte-escaped-literal
      - id: micro-behaviors/process/interpreter/eval/javascript::eval-literal-byte-mask-loop
