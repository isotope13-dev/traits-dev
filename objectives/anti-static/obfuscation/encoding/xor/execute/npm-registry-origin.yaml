defaults:
  platforms: [unix, windows]
  for: [npm, tar, javascript, json, package.json]
  attack: T1027,T1195.002

composite_rules:
  - id: npm-xor-masked-registry-origin-stage
    desc: XOR-decoded Base64 origin feeds runtime npm registry install
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/supply-chain/hidden-payload/staging/script::npm-xor-base64-origin-decoder
      - id: objectives/supply-chain/hidden-payload/staging/script::npm-install-selects-decoded-registry
