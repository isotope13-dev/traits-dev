defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  mbc: B0032
  attack: T1027
composite_rules:
  - id: python-xor-decode
    desc: Python XOR decode with dynamic execution
    crit: suspicious
    conf: 0.9
    for: [python]
    all:
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/data/decode/hex::hex-decode-int-16
    any:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: micro-behaviors/metaprogramming/generation/compile::compile-exec-mode
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads

    unless:
    - id: well-known/tool/detection/malware-config-parser
    - id: well-known/app/development/calvyn-code
    # A debug-pickle basename suppresses this rule.
    - id: metadata/file/extension/asset::debug-pickle-basename
    - id: micro-behaviors/communications/websocket/framing::python-websocket-mask-key
    # Scapy's packet-field toolkit pairs strxor, hex handling and eval() on
    # VolatileValue expressions as documented crafting primitives, not a
    # decode-and-execute loader.
    - id: well-known/lib/network/scapy::scapy-library-context
