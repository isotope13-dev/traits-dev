# The user-folder search and XOR operation are visible, but the alternative
# char-code helper does not require an evaluation sink. Neither alternative
# binds the transformed value to the Function constructor.
defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: user-folder-xor-function-clues
    desc: User-folder path, XOR and Function/char-code clues
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/location::localized-user-folder-path
      - id: micro-behaviors/data/decode/custom::bytewise-xor-append-transform
    any:
      - id: objectives/anti-static/obfuscation/eval/loader::computed-receiver-new-constructor
      - id: objectives/anti-static/obfuscation/string/dynamic::char-code-helper-member-name
