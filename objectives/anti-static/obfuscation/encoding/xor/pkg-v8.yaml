# Generic XOR plus two argument-sharing calls does not identify the callees,
# a dropped executable, or a command channel. Require independently matched
# hidden Defender exclusions to admit the concealment claim. The original
# bytecode observations remain notable in their own canonical homes.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pkg-v8-xor-with-hidden-defender-exclusion
    desc: V8 XOR call profile with hidden Defender exclusion
    crit: hostile
    conf: 0.95
    attack: T1027,T1140
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: metadata/binary/code/bytecode::v8-paired-calls-reuse-register
      - id: micro-behaviors/data/encoding/xor::v8-modulo-xor-indexed-store
      - id: objectives/evasion/anti-av/exclusion::pkg-node-bundle-with-admin-check-and-hidden-defender-exclusion
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks
