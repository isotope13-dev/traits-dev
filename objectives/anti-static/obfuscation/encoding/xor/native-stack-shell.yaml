defaults:
  platforms: [macos]
  for: [macho]
  arch: [aarch64]
  attack: T1027
composite_rules:
  # Repeated vector XOR alone is ordinary arithmetic. Here almost no strings
  # remain in __cstring while reconstructed strings include shell commands.
  # This describes concealment; it does not identify a family or assert theft.
  - id: sparse-cstring-vector-xor-shell
    desc: Sparse-string shell binary uses vector XOR
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: micro-behaviors/data/arithmetic::aarch64-paired-vector-xor-store
      - id: micro-behaviors/process/create/script/osascript::osascript-exec
      - id: micro-behaviors/process/create/shell/native::c-popen

  # Scalar helper-updated state is a different XOR implementation from the
  # vector transform above. Retain the almost-empty string section and the
  # recovered interpreter command as concealment context. This co-occurrence
  # does not claim a proven decoder-to-system() data-flow relationship.
  - id: sparse-cstring-state-xor-osascript
    desc: Sparse-string state XOR with osascript command
    arch: [x86-64, aarch64]
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: micro-behaviors/process/create/script/osascript::osascript-exec
      - id: micro-behaviors/process/create/shell/native::c-system-import
    any:
      - id: micro-behaviors/data/encoding/xor::arm64-helper-updated-state-byte-xor
      - id: micro-behaviors/data/encoding/xor::x64-helper-updated-state-byte-xor
