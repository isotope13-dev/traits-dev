defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - typescript
  attack: T1027,T1059.007
  mbc: B0032
traits:
- id: charcode-numeric-xor-key
  desc: XOR with a numeric charCodeAt key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: charCodeAt\s*\(\s*0?\s*\)\s*\^\s*(0x[0-9A-Fa-f]{1,4}|\d{1,3})
composite_rules:
- id: atob-map-charcode-numeric-xor
  for:
  - javascript
  desc: atob payload XOR-decoded by numeric key
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: charcode-numeric-xor-key
  near_bytes: 160
- id: browser-atob-xor-eval-stager
  for:
  - javascript
  desc: Browser eval executes Base64 XOR payload
  crit: hostile
  conf: 0.98
  all:
  - id: atob-map-charcode-numeric-xor
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  near_bytes: 400
- id: browser-base64-xor-function-stager
  for:
  - javascript
  desc: Executes Base64-decoded bytewise-XOR JavaScript
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1140
  near_lines: 20
  all:
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/data/encode/xor::js-charcode-xor-operation
  - id: micro-behaviors/data/decode/utf8::textdecoder-utf8-decode
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
