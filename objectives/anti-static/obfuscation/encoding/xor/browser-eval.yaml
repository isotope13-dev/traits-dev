# Browser stagers that Base64-decode a blob, XOR each byte with a numeric key,
# then eval the recovered source. Mirage2FA-class HTML attachments use this
# shape (commonly key 0xAD / 173); the same unpacker appears in JS loaders.
# eval(atob(...)) alone is suspicious; pairing it with a charCodeAt XOR loop
# is the hostile self-decoding stager signal.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1027,T1059.007
  mbc: B0032

traits:
  - id: atob-call-site
    desc: Calls atob to decode a Base64 blob
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\batob\s*\('

  - id: charcode-numeric-xor-key
    desc: XOR with a numeric charCodeAt key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'charCodeAt\s*\(\s*0?\s*\)\s*\^\s*(0x[0-9A-Fa-f]{1,4}|\d{1,3})'

  - id: eval-call-site
    desc: Calls eval on recovered source
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\beval\s*\('

composite_rules:
  - id: atob-map-charcode-numeric-xor
    desc: atob payload XOR-decoded by numeric key
    crit: notable
    conf: 0.94
    all:
      - id: atob-call-site
      - id: charcode-numeric-xor-key
    near_bytes: 160

  - id: browser-atob-xor-eval-stager
    desc: Browser eval executes Base64 XOR payload
    crit: hostile
    conf: 0.98
    all:
      - id: atob-map-charcode-numeric-xor
      - id: eval-call-site
    near_bytes: 400
