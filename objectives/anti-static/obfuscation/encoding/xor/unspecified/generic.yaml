defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1027
composite_rules:
  - id: c-cyclic-string-decrypt
    desc: C cyclic XOR string decryption
    crit: suspicious
    conf: 0.92
    for: [c, cpp]
    any:
      - id: micro-behaviors/data/encode/xor::cyclic-xor-string-decrypt
      - id: micro-behaviors/data/encode/xor::xor-key-name
      - id: metadata/lang/source/naming/action/cryptography::xor-encrypt-name
    needs: 2
  - id: python-file-byte-inversion
    desc: Python XOR file decryptor
    crit: suspicious
    conf: 0.96
    for: [python]
    size_max: 32768
    all:
      - id: micro-behaviors/data/encode/xor::xor-byte-invert-bytes-listcomp
      - id: micro-behaviors/fs/file/open/unspecified::binary-read-mode
      - id: micro-behaviors/fs/read/file/content/unspecified::file-read-content
      - id: micro-behaviors/fs/file/open/unspecified::binary-write-mode
    any:
      - id: micro-behaviors/process/argument/positional::python-two-positional-arguments
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-named-function-transform-syntax
  - id: python-cli-file-decryptor
    desc: Tiny Python CLI decryptor
    crit: suspicious
    conf: 0.98
    for: [python]
    size_max: 4096
    all:
      - id: objectives/anti-static/obfuscation/encoding/xor/unspecified::python-file-byte-inversion
      - id: micro-behaviors/process/argument/positional::python-two-positional-arguments
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-named-function-transform-syntax
