# The user-folder search and XOR operation are visible, but the alternative
# char-code helper does not require an evaluation sink. Neither alternative
# binds the transformed value to the Function constructor.
defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: user-folder-xor-function-clues
    desc: User-folder path, XOR and computed access clues
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/user-directory::localized-user-folder-path
      - id: metadata/lang/source/syntax/call/arguments::append-literal-xor-argument-text
    any:
      - id: micro-behaviors/data/control-flow/dispatch/computed::computed-receiver-new-constructor
      - id: micro-behaviors/data/property/access::repeated-numeric-helper-property-keys
