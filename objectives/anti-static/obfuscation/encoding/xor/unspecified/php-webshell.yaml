defaults:
  platforms: [unix, windows]
  for: [php]
  crit: suspicious
  conf: 0.9
  attack: T1027
  mbc: B0032

traits:

  # A generic array_map XOR callback
  # is not evidence of a UUID-keyed webshell decrypt without the composite's
  # proximity requirement to an actual UUID literal.
  - id: array-map-xor-decrypt
    desc: Array-map XOR byte callback
    crit: notable
    conf: 0.85
    size_max: 500000
    if:
      type: text
      regex: "array_map\\s*\\(.{0,100}\\b(ord|chr)\\s*\\([^)]{0,40}\\)\\s*\\^"


# serialize-call removed: a bare PHP `(un)serialize(` call is neutral object
# serialization (ubiquitous in WordPress/Laravel/etc.), not XOR obfuscation. It
# was an orphan baseline (no composite referenced it) that mislabeled benign PHP
# with an obfuscation/encoding/xor web-UI feature. The canonical capability home
# is micro-behaviors/data/serialize/object/php.yaml::{serialize-symbol,unserialize}.

composite_rules:
  - id: uuid-xor-key
    desc: UUID constant used as XOR decryption key
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/data/format/uuid::php-uuid-string-literal
    any:
      - id: micro-behaviors/data/encoding/xor/cyclic-key::php-repeating-key-index-xor
      - id: micro-behaviors/data/encoding/xor/cyclic-key::php-byte-xor-transform-loop
      - id: micro-behaviors/data/encoding/xor/cyclic-key::php-cyclic-xor-string-reconstruction
      - id: array-map-xor-decrypt
      - id: micro-behaviors/data/decode/xor/reconstruction::php-hex-xor-reconstruction
    unless:
      - id: well-known/lib/crypto/uuidv5::php-uuidv5-implementation
      - id: metadata/path/directory::test-directory-component
