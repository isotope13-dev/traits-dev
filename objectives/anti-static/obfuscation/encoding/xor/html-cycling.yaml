defaults:
  for: [text]
  platforms: [windows, unix]
  attack: T1027
composite_rules:
  - id: cycling-xor-document-writer
    desc: Cycling-XOR decoder writes reconstructed markup
    crit: suspicious
    all:
      - id: micro-behaviors/data/encode/xor::js-cycling-eight-character-xor
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/data/decode/charset::fromcharcode-text-carrier
  - id: dual-charcode-xor-eval
    desc: Dual character-code XOR accompanies variable eval
    crit: suspicious
    all:
      - id: micro-behaviors/data/encode/xor::js-dual-charcode-xor
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
      - id: micro-behaviors/data/encode/xor::js-xor-fromcharcode-rebuild
