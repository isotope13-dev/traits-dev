defaults:
  platforms: [windows, unix]
  for: [wasm]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  # Keep the decoder's exact byte-loop structure distinct from the host bridge;
  # the similar no-host fixture should retain only notable decoder evidence.
  - id: bulk-xor-wasm-host-bridge-concealer
    desc: WASM combines indexed byte rotation with a dynamic host bridge
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/data/decode/rotate::wasm-indexed-byte-rotation-loop
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-call
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-invoke
