defaults:
  platforms: [windows, unix]
  for: [wasm]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  # This does not depend on successful string recognition or on an endpoint,
  # symbol name, key, filename, or known family. The decoder is structurally
  # bound to active data, at program-wide scale, with dynamic JS host calls.
  - id: bulk-xor-wasm-host-bridge-concealer
    desc: WASM conceals a large data table behind XOR and a dynamic host bridge
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/data/decode/xor::wasm-bulk-xor-data-loops
      - id: micro-behaviors/data/decode/xor::wasm-xor-data-over-8k
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-call
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-invoke
