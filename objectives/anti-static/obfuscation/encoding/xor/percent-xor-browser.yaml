defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: suspicious
  conf: 0.96
composite_rules:
  - id: percent-xor-document-concealment
    desc: Percent input, keyed XOR, and document writing
    all:
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
  - id: md5-xor-concealed-setslice-exploit
    desc: MD5-XOR fragments conceal a setSlice exploit
    crit: hostile
    attack: T1027
    all:
      - id: objectives/execution/activex/browser-control::md5-xor-setslice-overflow-writer
      - id: objectives/anti-static/obfuscation/string/fragmentation::fragmented-percent-xor-content
