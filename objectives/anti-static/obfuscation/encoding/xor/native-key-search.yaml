defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  - id: x86-key-searched-xor-code-loader
    desc: XOR shellcode-key search with copied-buffer execution
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/decode/xor::x86-header-key-search-byte-xor
      - id: micro-behaviors/process/deploy::x86-rwx-copied-buffer-call
