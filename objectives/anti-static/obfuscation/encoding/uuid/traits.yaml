# UUID text as an encoding channel for embedded native payloads.
# Distinct from ordinary COM/RPC GUID tables by density plus a decode API.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0032
  size_max: 20971520

composite_rules:
  - id: dense-uuid-rpc-decoded-payload
    desc: Dense UUID string table decoded via Rpc UuidFromString
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/string::dense-uuid-hyphen-string-table
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/data/format/string::uuid-decode-16byte-advance-loop-x64
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/signed/leaf::microsoft-corporation
