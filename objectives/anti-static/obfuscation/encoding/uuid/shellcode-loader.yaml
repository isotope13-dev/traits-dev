# UUID-string shellcode loaders: payloads are stored as thousands of GUID
# strings and reconstituted via UuidFromString into a RW buffer that is then
# VirtualProtect'd executable. Benign PE files may carry a handful of COM
# GUIDs; a dense table plus the RPC decode API is the loader shape.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1055,T1620
  mbc: B0032

traits:
  - id: dense-uuid-string-table
    desc: Dense UUID string table embedded in PE
    crit: suspicious
    conf: 0.95
    # Normal COM/typelib GUID sets stay well under this; UUID-shellcode
    # loaders embed thousands of synthetic GUIDs as the payload encoding.
    count_min: 128
    if:
      type: text
      regex: '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}'

composite_rules:
  - id: uuid-shellcode-rw-memory-loader
    desc: UUID table decoded into RW memory via UuidFromString
    crit: hostile
    conf: 0.97
    all:
      - id: dense-uuid-string-table
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-readwrite-commit-resolved-x64
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: well-known/app/
      - id: well-known/lib/
