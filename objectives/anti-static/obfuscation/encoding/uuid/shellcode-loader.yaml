# UUID-string shellcode loaders: payloads are stored as thousands of GUID
# strings and reconstituted via UuidFromString into a RW buffer that is then
# VirtualProtect'd executable. The dense GUID table atom lives in
# micro-behaviors/; this composite adds the loader intent.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1055,T1620
  mbc: B0032

composite_rules:
  - id: uuid-shellcode-rw-memory-loader
    desc: UUID table decoded into RW memory via UuidFromString
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/string::dense-uuid-hyphen-string-table
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: well-known/app/
      - id: well-known/lib/
