# Source-level UUID-string shellcode reconstruction (UuidFromStringA writing
# 16-byte chunks). PE/DLL variants live in encoding/uuid/traits.yaml.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1027,T1055,T1620
  mbc: B0032

traits:
  - id: uuid-from-string-call
    desc: UuidFromStringA/W decode call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^UuidFromString[AW]$'

  - id: uuid-output-plus-16
    desc: Advances decode pointer by 16 bytes
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\+=\s*16\b'

composite_rules:
  - id: uuid-from-string-source-stride
    desc: UuidFromString decode loop with 16-byte stride
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: uuid-from-string-call
      - id: uuid-output-plus-16

  - id: uuid-from-string-executable-buffer
    desc: UuidFromString payload written to executable memory
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: uuid-from-string-call
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
