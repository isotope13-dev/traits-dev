defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
  crit: suspicious
  conf: 0.95
composite_rules:
  - id: fragmented-hex-charcode-document-writer
    desc: Fragmented hex, charcode reference and DOM write
    all:
      - id: micro-behaviors/data/reassembly::repeated-hex-fragments-interleaved-variable
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
    near_bytes: 4096
