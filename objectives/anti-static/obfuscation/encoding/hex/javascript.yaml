defaults:
  platforms:
  - windows
  - unix
  mbc: B0032
  for:
  - javascript
  - typescript
traits:
- id: js-sniff-attachment-mime-marker
  desc: JavaScript attachment MIME sniffing marker
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: sniffAttachmentMime
- id: hex-literal-node-userinfo-method
  desc: Node userInfo method concealed as hex literal
  crit: notable
  conf: 0.94
  if:
    type: literal
    exact: 75736572496e666f
    case_insensitive: true
- id: hex-literal-node-hostname-method
  desc: Node hostname method concealed as hex literal
  crit: notable
  conf: 0.94
  if:
    type: literal
    exact: 686f73746e616d65
    case_insensitive: true
- id: hex-literal-node-homedir-method
  desc: Node homedir method concealed as hex literal
  crit: notable
  conf: 0.94
  if:
    type: literal
    exact: 686f6d65646972
    case_insensitive: true
- id: hex-literal-node-dns-servers-method
  desc: Node getServers method concealed as hex literal
  crit: notable
  conf: 0.94
  if:
    type: literal
    exact: '67657453657276657273'
composite_rules:
- id: advanced-hex-obfuscation
  desc: Advanced hexadecimal obfuscation pattern
  crit: suspicious
  conf: 0.92
  attack: T1027
  needs: 2
  any:
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  - id: metadata/lang/encoding/hex::hex-repeated-long-hex-literals
  - id: micro-behaviors/data/property/access::hex-key-indexing-cluster
  - id: micro-behaviors/data/string/conversion::repeated-hex-fromcharcode
  all:
  - id: metadata/lang/encoding/hex::hex-concatenation
- id: node-hex-concealed-host-profile
  desc: Node host profile APIs concealed as hex strings
  crit: suspicious
  conf: 0.99
  near_bytes: 1536
  needs: 3
  any:
  - id: hex-literal-node-userinfo-method
  - id: hex-literal-node-hostname-method
  - id: hex-literal-node-homedir-method
  - id: hex-literal-node-dns-servers-method
- id: hex-string-decoding
  desc: Hexadecimal string decoding routine
  crit: suspicious
  conf: 0.95
  attack: T1027.002
  all:
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  - id: micro-behaviors/data/string/conversion::repeated-hex-fromcharcode
  any:
  - id: micro-behaviors/data/property/access::hex-key-indexing-cluster
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
# Large hex constants in branches alone are ordinary binary-format parsing
# (ZIP64 0xffffffff sentinels, magic numbers); obfuscation needs the
# obfuscator's hex-mangled identifiers beside them.
- id: hex-control-flow-obfuscation
  desc: Hex-mangled code branches on large hex literals
  crit: suspicious
  conf: 0.87
  attack: T1027
  all:
  - id: micro-behaviors/data/control-flow/branch::hex-literal-conditionals
  - id: metadata/lang/source/naming/resource::hex-identifier-population
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: js-sniff-attachment-mime-marker
  - id: well-known/app/development/superdoc-docx-engine::superdoc-docx-engine-bundle
  - id: metadata/build/minifier::intentional-obfuscator-dist-decoded-slice
  - id: metadata/build/minifier::intentional-obfuscator-nested-unicode-slice
  - id: metadata/package/files/bsd::openbsd-port-patch-header
- id: massive-unicode-hex-table-decoder
  desc: Massive Unicode-escaped source uses a hexadecimal table decoder
  crit: suspicious
  conf: 0.97
  attack: T1027,T1140
  all:
  - id: metadata/lang/source/literal/hex::hex-token-length-undefined-cluster
  - id: micro-behaviors/data/property/access::hex-key-indexing-cluster
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-javascript-unicode-escape-volume
  unless:
  - id: metadata/build/minifier::obfuscated-commonjs-getter-wrapper
