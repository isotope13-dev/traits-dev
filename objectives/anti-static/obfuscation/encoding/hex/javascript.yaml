defaults:
  platforms: [windows, unix]
  mbc: B0032
  for:
  - javascript
  - typescript
traits:
  # Single-byte hex tokens commonly appearing inside hex-byte-array
  # alphabet tables. These atoms are deliberately content-free — each is
  # too generic to mean anything on its own; their value comes from
  # appearing together in proximity (handled by the consuming composite,
  # e.g. OtterCookie's base91 alphabet table). Hosting them here instead
  # of under a family directory keeps family attribution out of generic
  # trait IDs.
- id: hex-byte-token-3f
  desc: 0x3f hex byte token
  crit: component
  conf: 0.5
  if:
    type: text
    word: '0x3f'
  # Bit masks and table indexes are ordinary numeric operations, not byte
  # alphabets or decoder constants.
  not:
  - regex: '&\s*0x3f\b'
  - regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\[\s*0x3f\s*\]'
- id: hex-byte-token-ff
  desc: 0xff hex byte token
  crit: component
  conf: 0.5
  if:
    type: text
    word: '0xff'
  # Do not treat bit masks, indexes, or the 0xff prefix of a wider literal
  # such as 0xffff as an encoding indicator.
  not:
  - regex: '&\s*0xff\b'
  - regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\[\s*0xff\s*\]'
- id: hex-byte-array-open
  desc: Hex byte array literal opening
  crit: component
  conf: 0.5
  if:
    type: text
    substr: '[0x0'
- id: hex-array-access
  desc: Hexadecimal array indexing
  crit: notable
  conf: 0.85
  attack: T1027
  count_min: 5
  per_kb_min: 0.3
  if:
    type: text
    regex: \w+\[\s*0x[0-9a-fA-F]{2,}\s*\]
  not:
  # A PDFDocEncoding lookup table is a format implementation, not concealed
  # strings. Filter only those matched table accesses so unrelated hex arrays
  # in the same source file remain visible.
  - regex: '(?i)pdfdocencoding'
  unless:
  - type: text
    substr: FuelAsm.
  # YAML/JSON dumpers index escape tables with hex code points
  # (ESCAPE_SEQUENCES[0x00] = '\\0') — not string obfuscation.
  - type: text
    substr: ESCAPE_SEQUENCES
  - id: metadata/file/extension/identity::c3-source-basename
- id: hex-string-arithmetic
  desc: Hex arithmetic in string operations
  crit: component
  conf: 0.78
  attack: T1027
  if:
      # Migrated from a tree-sitter query to a lenient `type: text`
      # match (no per-member cursor walk). Approximates the query's
      # structural intent via its distinctive token(s).
    type: text
    regex: '0x[0-9a-fA-F]+\s*[-+*/%^&|]\s*0x[0-9a-fA-F]+'
  unless:
  - id: metadata/library/structure/
  - type: basename
    regex: '(^|[._-])README([._-][^\\/]*)?$'
  - id: metadata/library/structure::js-emscripten-preamble-marker
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/package/testing/
  - id: objectives/anti-static/obfuscation/code-metrics/structure::ico-resource-basename
  - id: metadata/file/extension/identity::c3-source-basename
- id: fromcharcode-hex
  desc: Hexadecimal fromCharCode outside source maps
  crit: suspicious
  conf: 0.8
  attack: T1027
  count_min: 3
  per_kb_min: 0.2
  if:
    type: text
    regex: fromCharCode\s*\(\s*0x[0-9a-fA-F]+
  unless:
  # Source maps preserve ordinary source literals, including protocol and
  # character-code tables; they are not executable obfuscation.
  - id: metadata/file/format/structured::sourcemap
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/package/testing/
  - id: metadata/library/runtime/
  - id: metadata/lang/source/
  - id: metadata/file/extension/identity::c3-source-basename
- id: hex-concatenation
  desc: Hexadecimal string concatenation
  crit: suspicious
  conf: 0.77
  attack: T1027
  count_min: 3
  if:
    type: text
    regex: \+\s*['"]0x[0-9a-fA-F]{4,}['"]
  downgrade:
    any:
    - id: metadata/library/structure::js-large-module-bundle
    - id: micro-behaviors/process/interpreter/vm/
  unless:
  - id: metadata/file/format/
  - id: metadata/package/testing/
  - id: well-known/lib/format/json-ts/
  - id: well-known/lib/format/pdfjs/
  - id: metadata/library/upload/
- id: mixed-hex-decimal
  desc: Mixed hexadecimal and decimal operations
  crit: component
  conf: 0.72
  attack: T1027
  unless:
  - id: metadata/package/testing/
  - id: metadata/library/structure::js-emscripten-preamble-marker
  - id: metadata/library/structure/
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/library/browser-parser::mozilla-readability-library
  - type: text
    substr: '1024 * 1024'
  - type: text
    regex: '\b(hex|decimal|octal|bin)_ip_to_normal_ip\b'
  - id: metadata/file/extension/identity::c3-source-basename
  if:
      # Migrated from a tree-sitter query to a lenient `type: text`
      # match (no per-member cursor walk). Approximates the query's
      # structural intent via its distinctive token(s).
    type: text
    regex: '0x[0-9a-fA-F]+'
- id: js-sniff-attachment-mime-marker
  desc: JavaScript attachment MIME sniffing marker
  crit: component
  conf: 0.86
  if:
    type: text
    substr: "sniffAttachmentMime"
- id: hex-literal-node-userinfo-method
  desc: Node userInfo method concealed as hex literal
  crit: component
  conf: 0.94
  if:
    type: literal
    exact: '75736572496e666f'
    case_insensitive: true
- id: hex-literal-node-hostname-method
  desc: Node hostname method concealed as hex literal
  crit: component
  conf: 0.94
  if:
    type: literal
    exact: '686f73746e616d65'
    case_insensitive: true
- id: hex-literal-node-homedir-method
  desc: Node homedir method concealed as hex literal
  crit: component
  conf: 0.94
  if:
    type: literal
    exact: '686f6d65646972'
    case_insensitive: true
- id: hex-literal-node-dns-servers-method
  desc: Node getServers method concealed as hex literal
  crit: component
  conf: 0.94
  if:
    type: literal
    exact: '67657453657276657273'
composite_rules:
- id: advanced-hex-obfuscation
  desc: Advanced hexadecimal obfuscation pattern
  crit: suspicious
  conf: 0.92
  attack: T1027
  needs: 2
  any:
  - id: micro-behaviors/data/encode/hex::js-dense-hex-escapes
  - id: metadata/lang/encoded/hex::repeated-long-hex-literals
  - id: hex-array-access
  - id: fromcharcode-hex
  all:
  - id: hex-concatenation
- id: node-hex-concealed-host-profile
  desc: Node host profile APIs concealed as hex strings
  crit: suspicious
  conf: 0.99
  near_bytes: 1536
  needs: 3
  any:
  - id: hex-literal-node-userinfo-method
  - id: hex-literal-node-hostname-method
  - id: hex-literal-node-homedir-method
  - id: hex-literal-node-dns-servers-method
- id: hex-string-decoding
  desc: Hexadecimal string decoding routine
  crit: hostile
  conf: 0.95
  attack: T1027.002
  all:
  - id: micro-behaviors/data/encode/hex::js-dense-hex-escapes
  - id: fromcharcode-hex
  any:
  - id: hex-array-access
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
- id: hex-control-flow-obfuscation
  desc: Hexadecimal control flow obfuscation
  crit: suspicious
  conf: 0.87
  attack: T1027
  all:
  - id: micro-behaviors/data/source/arithmetic::hex-threshold-conditionals
  any:
  - id: mixed-hex-decimal
  - id: hex-string-arithmetic
  - id: metadata/lang/encoded/hex::repeated-long-hex-literals
  unless:
  - id: metadata/library/data/
  - id: metadata/library/structure/
  - id: metadata/package/files/dependency::node-modules-path
  - id: js-sniff-attachment-mime-marker
  - id: metadata/lang/source/
  - id: metadata/library/structure::js-large-minified-bundle
  - id: well-known/app/development/superdoc-docx-engine::superdoc-docx-engine-bundle
  - id: metadata/build/minifier::intentional-obfuscator-dist-decoded-slice
  - id: metadata/build/minifier::intentional-obfuscator-nested-unicode-slice
- id: hex-byte-decoder-constants
  desc: Hex byte decoder constants
  crit: notable
  conf: 0.86
  attack: T1027
  near_bytes: 4096
  all:
  - id: metadata/lang/scripted::undefined-literal
  - id: metadata/lang/scripted::length-prop
  - id: hex-byte-token-3f
  - id: hex-byte-token-ff
  - id: hex-byte-array-open
  # Inline source-map sourceContents are decoded data, not executable
  # decoder constants; keep the component atoms available for other uses.
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: massive-unicode-hex-table-decoder
  desc: Massive Unicode-escaped source uses a hexadecimal table decoder
  # This establishes deliberate concealment, not the decoded program's intent.
  # Require execution or another concrete behavior before calling it hostile.
  crit: suspicious
  conf: 0.97
  attack: T1027,T1140
  all:
  - id: hex-byte-decoder-constants
  - id: hex-array-access
  - id: metadata/lang/encoded/unicode-escape::javascript-unicode-escape-volume
