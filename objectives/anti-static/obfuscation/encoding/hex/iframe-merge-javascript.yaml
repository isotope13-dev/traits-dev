defaults:
  platforms: [unix, windows, ios]
  for: [javascript]
  attack: T1027,T1059.007

composite_rules:
  - id: js-hex-decoded-script-document-write
    desc: JavaScript hex decoder attempts script insertion into the document
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/hex::js-parseint-radix-16
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-function-result
      - id: micro-behaviors/data/decode/hex::hex-encoded-script-tag
    near_bytes: 2000
  - id: js-hex-decoded-hidden-remote-iframe
    desc: JavaScript hex decoder attempts a concealed remote iframe write
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/hex::js-parseint-radix-16
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-function-result
      - id: micro-behaviors/data/decode/hex::hex-encoded-iframe-tag
      - id: micro-behaviors/data/decode/hex::hex-encoded-display-none
      - id: micro-behaviors/data/decode/hex::hex-encoded-http-url-prefix
    near_bytes: 2000
