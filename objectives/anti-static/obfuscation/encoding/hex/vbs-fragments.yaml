# Restore definitions omitted when their consumers migrated in cb7cce1abda.
defaults:
  platforms:
  - windows
  for:
  - vbs
  - html
  - scripts
  - mp3
  attack: T1027
traits:
- id: vbs-hex-fragment-accumulator
  desc: VBScript accumulates hex-encoded fragments
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?i)\b[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\s*&\s*[A-Za-z_]\w*\s*\(\s*["'][0-9a-f]{16,}["']\s*\)
  count_min: 8
