defaults:
  platforms: [unix, windows, ios]
  for: [html, javascript, elixir, scala]
  attack: T1189
  mbc: B0031
composite_rules:
  - id: hex-array-decoded-hidden-iframe-injection
    desc: Hex iframe, array decoder and eval clues
    crit: suspicious
    conf: 0.98
    attack: T1189,T1027,T1059.007
    for: [html, javascript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/hex::hex-byte-iframe-token
      - id: micro-behaviors/data/decode/char-code::indexed-charcode-array-decode
    any:
      - id: micro-behaviors/process/interpreter/eval/indirect::window-eval-bracket-assigned
      - id: micro-behaviors/process/interpreter/eval/indirect::eval-assigned-to-variable
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument

  # A frame disguised with a service or sign-in identity that is shrunk to
  # minimal dimensions (two to three pixels) while pulling an external document
  # delivers drive-by content under a deceptive brand wrapper.
