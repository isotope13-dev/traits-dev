defaults:
  platforms: [windows]
  for: [powershell, batch, javascript, typescript, python, vbs, lnk, pe]
traits:
  - id: hex-hidden-process-launch
    desc: Hex conceals hidden process launch
    crit: suspicious
    conf: 0.97
    attack: T1027,T1564.003
    if:
      type: encoded
      encoding: hex
      regex: '(?i)\bStart-Process\b[^;\r\n]{0,240}-WindowStyle\s+Hidden\b'

  - id: hex-hidden-task-settings
    desc: Hex conceals hidden scheduled-task settings
    crit: suspicious
    conf: 0.95
    attack: T1027
    if:
      type: encoded
      encoding: hex
      regex: '(?i)New-ScheduledTaskSettingsSet\b[^;\r\n]{0,160}-Hidden\b'

  # The hex layer of a shortcut command line is plain ASCII hex inside the
  # arguments value; match the encoded cmdlet or method name, which stays
  # constant when the attacker changes task names, paths and hosts.
  - id: lnk-hex-register-scheduledtask
    desc: LNK hex text hides task registration
    crit: suspicious
    conf: 0.95
    attack: T1027,T1053.005
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)52656769737465722d5363686564756c65645461736b'

  - id: lnk-hex-downloadstring
    desc: LNK hex text hides web download call
    crit: suspicious
    conf: 0.95
    attack: T1027,T1105
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)446f776e6c6f6164537472696e67'

composite_rules:
  # This is concealment of executable content beside independently established
  # concealed persistence, not a claim that arbitrary path variables are equal.
  - id: hex-concealed-recurring-task
    desc: Hidden recurring task with hex-concealed execution
    crit: hostile
    conf: 0.97
    attack: T1027
    all:
      - id: objectives/persistence/system/scheduled-task::hidden-repeating-conhost-powershell
    any:
      - id: hex-hidden-process-launch
      - id: hex-hidden-task-settings
