defaults:
  platforms: [windows]
  for: [powershell, batch, javascript, typescript, python, vbs, lnk, pe]
traits:
  - id: hex-hidden-process-launch
    desc: Hex conceals hidden process launch
    crit: suspicious
    conf: 0.97
    attack: T1027,T1564.003
    if:
      type: encoded
      encoding: hex
      regex: '(?i)\bStart-Process\b[^;\r\n]{0,240}-WindowStyle\s+Hidden\b'

  - id: hex-hidden-task-settings
    desc: Hex conceals hidden scheduled-task settings
    crit: suspicious
    conf: 0.95
    attack: T1027
    if:
      type: encoded
      encoding: hex
      regex: '(?i)New-ScheduledTaskSettingsSet\b[^;\r\n]{0,160}-Hidden\b'

composite_rules:
  # This is concealment of executable content beside independently established
  # concealed persistence, not a claim that arbitrary path variables are equal.
  - id: hex-concealed-recurring-task
    desc: Concealed recurring task hides setup in hex
    crit: hostile
    conf: 0.97
    attack: T1027
    all:
      - id: objectives/persistence/system/scheduled-task::hidden-repeating-conhost-powershell
    any:
      - id: hex-hidden-process-launch
      - id: hex-hidden-task-settings
