# Hex bytes written as w63 w69, the w later becoming a percent sign.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
traits:
  - id: w-delimited-hex-bytes
    desc: Hex bytes split by the letter w
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(w[0-9a-fA-F]{2}.{0,1}){6}'
composite_rules:
  - id: w-hex-swapped-into-unescape
    desc: Unescapes hex bytes split by w
    crit: hostile
    conf: 0.93
    near_bytes: 2500
    all:
      - id: w-delimited-hex-bytes
      - id: micro-behaviors/data/decode/url::unescape-w-replaced-with-percent
