# Preserve the repeated-fragment predicate from encoded/script's MSXML rules.
# It is an encoding/concealment clue, not evidence of payload activation.
defaults:
  platforms: [windows]
  for: [vbs, html, scripts, mp3]
  attack: T1027
traits:
  - id: vbs-hex-fragment-accumulator
    desc: Repeated VBScript hex-fragment accumulation
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\s*&\s*[A-Za-z_]\w*\s*\(\s*["''][0-9a-f]{16,}["'']\s*\)'
    count_min: 8
