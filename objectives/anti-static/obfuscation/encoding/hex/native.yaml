# Native loaders sometimes replace the hexadecimal alphabet with an offset
# alphabet.  The useful invariant is the pairwise nibble reconstruction, not
# the particular alphabet or family string.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, c, cpp, csharp, go, rust]
  attack: T1027

traits:
- id: custom-base16-high-nibble
  desc: Offset alphabet high nibble decode
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\[\s*2\s*\*\s*\w+\s*\]\s*[-+]\s*0x[0-9a-f]+\s*\)\s*&\s*0x[0-9a-f]+'
- id: custom-base16-low-nibble
  desc: Offset alphabet low nibble decode
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\[\s*2\s*\*\s*\w+\s*\+\s*1\s*\]\s*[-+]\s*0x[0-9a-f]+\s*\)\s*&\s*0x[0-9a-f]+'
- id: custom-base16-nibble-recombine
  desc: Recombines decoded nibbles into bytes
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\w+\[\w+\]\s*=\s*\(\w+\s*<<\s*4\)\s*\|\s*\w+'

composite_rules:
- id: custom-base16-nibble-decoder
  desc: Custom alphabet Base16 nibble decoder
  crit: suspicious
  conf: 0.94
  near_bytes: 512
  all:
  - id: custom-base16-high-nibble
  - id: custom-base16-low-nibble
  - id: custom-base16-nibble-recombine
