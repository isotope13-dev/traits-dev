# AutoIt source is exposed as text. Require the decoder at the evaluator's
# argument, rather than unrelated decoding and execution in the same file.
# This also applies to obfuscated administrative scripts; it is not a verdict.
defaults:
  platforms: [windows]
  for: [text]

traits:
  - id: autoit-execute-hex-expression
    desc: AutoIt evaluates a hex-concealed expression
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: text
      regex: '(?i)\bExecute\s*\(\s*BinaryToString\s*\(\s*["'']0x[0-9a-f]{64,}'
