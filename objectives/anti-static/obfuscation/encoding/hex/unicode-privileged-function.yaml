defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.96
traits:
  - id: invisible-key-require-function-wrapper
    desc: Invisible identifier wraps privileged Function
    size_min: 500000
    if:
      type: yara
      source: |
        rule invisible_key_require_function_wrapper {
          strings:
            $function = "Function(\"" ascii
            $getter = /get\"[A-Za-z]+(\\u200[cC]){10,100}\"\(\)\{return require\}/ ascii
          condition:
            all of them
        }
composite_rules:
  # The extreme encoded source and injected Node capability establish a
  # concealed privileged stage, not the behavior of its decoded contents.
  - id: massive-unicode-privileged-function-stage
    desc: Unicode-concealed privileged Function stage
    crit: hostile
    attack: T1027,T1059.007
    all:
      - id: invisible-key-require-function-wrapper
      - id: objectives/anti-static/obfuscation/encoding/hex::massive-unicode-hex-table-decoder
