defaults:
  platforms:
    - windows
  for:
    - powershell
composite_rules:
  - id: powershell-hex-xor-long-identifiers
    desc: Hex/XOR character code and long identifiers
    crit: suspicious
    conf: 0.96
    for:
      - powershell
      - python
      - text
    all:
      - id: metadata/lang/source/naming/population::very-long-average-identifiers
      - id: micro-behaviors/data/encode/char-code::powershell-hex-pair-bxor
