defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  # Some browser loaders put encrypted hex data in a hidden element, wrap
  # radix-16 conversion in a helper, reconstruct characters, then pass a
  # variable to eval. The existing direct hex decoder rule cannot see that
  # helper shape; this conjunction requires the large concealed carrier,
  # decoder evidence, and dynamic execution in the same HTML file.
  - id: concealed-hex-eval-loader
    desc: Concealed hex payload accompanies character reconstruction and eval
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    all:
      - id: micro-behaviors/data/format/html::concealed-bulk-encoded-blob
      - id: micro-behaviors/data/decode/hex::js-parseint-radix-16
      - id: micro-behaviors/data/string/conversion::charcodeat-text-expression
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/process/interpreter/eval/direct::eval-identifier-call-text
