# Hacked-page mobile redirectors (`_mauthtoken` family) ship their string
# table as \xNN escapes so the crawler gate, the cookie throttle and the
# traffic-distribution URL never appear in the page source. Hex-escaped
# string arrays are ordinary obfuscator output; what is concealed here is a
# crawler-cloaked redirect, which has no legitimate reason to hide itself.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
  attack: T1027,T1189
composite_rules:
  - id: hex-table-conceals-cloaked-redirect
    desc: Hex-escaped string table hides cloaked redirect
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/encoding/shape::javascript-hex-escape-string-table
      - id: objectives/evasion/decoy/cloaking::non-googlebot-mobile-cookie-redirect
