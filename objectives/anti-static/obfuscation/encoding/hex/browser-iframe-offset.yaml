# The supplied stream is a comma-separated hexadecimal character array
# reconstructed with an arithmetic +9 offset, then passed to window.eval.
# Decoded createElement/1px properties establish the concealed iframe action.
defaults:
  platforms: [windows, unix]
  for: [xml, html, javascript]
  attack: T1027,T1189
traits:
  - id: offset-hex-hidden-iframe-eval
    desc: Hex-offset eval hides 1px iframe injection
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule offset_hex_hidden_iframe_eval {
          strings:
            $iframe = "5a,69,5c,58,6b,5c,3c,63,5c,64,5c,65,6b,1f,1e,60,5d,69,58,64,5c,1e,20"
            $height = "25,6a,6b,70,63,5c,25,5f,5c,60,5e,5f,6b,17,34,17,1e,28,67,6f,1e"
            $width = "25,6a,6b,70,63,5c,25,6e,60,5b,6b,5f,17,34,17,1e,28,67,6f,1e"
            $decode = ".fromCharCode("
            $eval = /\[["']eval["']\]/
          condition:
            all of them
        }
