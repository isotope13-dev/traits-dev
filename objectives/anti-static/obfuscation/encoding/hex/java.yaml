defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1027,T1059
  mbc: B0032

composite_rules:
  # A JVM launcher that combines the interpreter-location property with
  # ProcessBuilder and multiple hexadecimal string constants is concealing
  # the command used to start another process. The generic metadata leg keeps
  # this independent of a particular obfuscator or launcher token.
  - id: java-obfuscated-process-launch-command
    desc: Java conceals a ProcessBuilder launch command in hex strings
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode-symbol
      - id: micro-behaviors/process/create/launch::java-home-property-literal
      - id: metadata/file/encoded::multiple-hex-class-literals
