defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0032
  attack: T1027
traits:
- id: php-long-percent-encoded-literal
  desc: Long percent-encoded PHP literal
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: urldecode\s*\(\s*['"](%[0-9A-Fa-f]{2}){16,}['"]\s*\)
  unless:
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
- id: hex-string-func-array
  desc: Array of hex-encoded function name literals
  crit: component
  conf: 0.9
  per_kb_min: 0.7
  size_min: 1000
  size_max: 500000
  if:
    type: text
    regex: ("[0-9a-fA-F]{16,36}"|'[0-9a-fA-F]{16,36}')
  unless:
  - id: well-known/lib/crypto/phpseclib
  - id: well-known/lib/crypto/firebase-jwt
  - id: metadata/file/magic/identity::php-archive
  - id: well-known/app/publishing/wordpress-plugins/
  - id: metadata/package/manager::composer-generated-autoload
- id: integer-indexed-func-dispatch
  desc: func dispatch via integer-indexed var array
  crit: suspicious
  conf: 0.87
  count_min: 7
  per_kb_min: 0.4
  attack: T1027.010
  if:
    type: text
    regex: \$\w+\[\s*[0-9]+\s*\]\s*\(
composite_rules:
- id: php-hex-funcname-obfuscation
  desc: PHP hex-encoded function name dispatch obfuscation
  crit: suspicious
  conf: 0.97
  attack: T1027.010
  all:
  - id: micro-behaviors/data/decode/hex::chr-hexdec-call
  - id: integer-indexed-func-dispatch
  any:
  - id: hex-string-func-array
  - id: micro-behaviors/communications/http/request
