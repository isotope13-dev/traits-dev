defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, text]
  attack: T1027
traits:
  - id: percent-concealed-http-host
    desc: Percent escapes conceal entire HTTP hostname
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'https?://(%(2[eE]|[3-7][0-9a-fA-F])){4,}/'
  - id: percent-concealed-script-path
    desc: Percent escapes conceal remote script path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '<script\s+src=["'']https?://[^/"'']{1,180}/(%[2-7][\da-f]){4,}["'']'
