defaults:
  platforms: [windows, unix]
  for: [python]
  crit: suspicious
  attack: T1027
traits:
  # The parser decodes string escapes before call facts are built, so a source
  # string written entirely as \xNN escapes is only visible to a text match.
  # Eight consecutive escapes is not an escape in a format string or a control
  # sequence; it is the text of a statement spelled out byte by byte.
  - id: hex-escape-exec-literal
    # Bind the path to this member while reading package identity across files.
    downgrade:
      scope: archive
      all:
        - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package
        - type: path
          regex: '(^|[\\/])tests[\\/]fixtures[\\/]'
      none:
        - id: well-known/tool/detection/code-analysis/disclude::fixture-package-interpreter-command
    desc: Exec runs hex-escaped string
    conf: 0.9
    if:
      type: text
      regex: '\b(exec|eval)\s*\(\s*b?["''](\\x[0-9a-fA-F]{2}){8,}'
    unless:
      - id: metadata/package/testing/harness/unit
      - id: well-known/tool/detection/
  # Mirror of encoding/content::b64decode-exec: the evaluated argument is the
  # result of a hex decoder, so the evaluator runs text that is not readable in
  # the file. The matcher lives here, not in process/interpreter/eval/direct,
  # because it is the decode-then-run pairing that makes it concealment.
  - id: hex-decode-exec
    desc: Exec receives hex-decoded Python source
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(exec|eval)$'
      arg:
        index: 0
        from:
          call: '(^|\.)(fromhex|unhexlify|a2b_hex)(\.decode)?$'
    unless:
      - id: metadata/package/testing/harness/unit
      - id: well-known/tool/detection/
