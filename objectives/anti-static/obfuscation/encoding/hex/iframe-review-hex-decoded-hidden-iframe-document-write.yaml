    all:
      - id: micro-behaviors/data/decode/hex::js-parseint-radix-16
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/data/decode/hex::hex-encoded-iframe-tag
      - id: micro-behaviors/data/decode/hex::hex-encoded-display-none
      - id: micro-behaviors/data/decode/hex::hex-encoded-http-url-prefix
    near_bytes: 2000
