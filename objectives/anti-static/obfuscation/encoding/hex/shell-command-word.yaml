defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027,T1059.004

traits:
  # The call target, rather than any argument or nearby decoded text, must
  # consist of printable hexadecimal escapes in an ANSI-C quote. A quoted
  # example, comment, variable assignment or printf data argument is not a
  # command name. No package/path exception: executable fixtures retain the
  # behavior they demonstrate.
  - id: shell-ansi-hex-command-word
    desc: Hex ANSI-C quote forms command name
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: ^\$'(\\x[2-7][0-9a-fA-F]){2,}'$
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/cc-audit::cc-audit-source-package-identity
