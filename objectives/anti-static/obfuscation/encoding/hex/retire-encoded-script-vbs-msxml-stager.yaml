defaults:
  platforms: [windows]
  for: [vbs, html, scripts, mp3]
  attack: T1027

traits:
- id: vbs-hex-fragment-accumulator
  desc: VBScript accumulates hex-encoded fragments
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '(?i)\b[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\s*&\s*[A-Za-z_]\w*\s*\(\s*["''][0-9a-f]{16,}["'']\s*\)'
  count_min: 8

composite_rules:
- id: hta-hidden-encoded-fragments
  for: [vbs, mp3]
  desc: Hidden HTA encoded fragment clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
  - id: objectives/anti-static/obfuscation/encoding/hex::vbs-hex-fragment-accumulator
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
