defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027,T1059.004

traits:
  - id: ifs-network-command-arguments
    desc: Network command uses IFS as argument spaces
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      exclude_docstrings: true
      regex: '\b(curl|wget|nslookup|getent)\$\{IFS\}'
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/

  # JSON manifests have structured values, not parser-extracted source
  # literals. Bind this observation to the declared repository URL.
  - id: npm-repository-ifs-network-arguments
    desc: Repository network command uses IFS spaces
    crit: suspicious
    conf: 0.98
    for: [package.json]
    platforms: [unix]
    if:
      type: value
      path: repository.url
      regex: '\b(curl|wget|nslookup|getent)\$\{IFS\}'
