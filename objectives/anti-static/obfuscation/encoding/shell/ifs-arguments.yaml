defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027,T1059.004

traits:
  - id: ifs-network-command-arguments
    desc: Network command uses IFS as argument spaces
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      exclude_docstrings: true
      regex: '\b(curl|wget|nslookup)\$\{IFS\}'
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
