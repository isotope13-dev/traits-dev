defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027,T1059.004

traits:
  # JSON manifests have structured values, not parser-extracted source
  # literals. Bind this observation to the declared repository URL.
  - id: npm-repository-ifs-network-arguments
    desc: Repository network command uses IFS spaces
    crit: suspicious
    conf: 0.98
    for: [package.json]
    platforms: [unix]
    if:
      type: value
      path: repository.url
      regex: '\b(curl|wget|nslookup|getent)\$\{IFS\}'

composite_rules:
  - id: ifs-network-command-arguments
    desc: Shell execution beside IFS-spaced network command
    crit: suspicious
    conf: 0.95
    near_bytes: 256
    all:
      - id: micro-behaviors/process/create/shell/command-string::ifs-network-command-fragment
      - id: micro-behaviors/process/create/shell/command-mode
