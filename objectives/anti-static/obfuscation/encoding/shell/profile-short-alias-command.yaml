---
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
composite_rules:
- id: sh-short-alias-command-clues
  desc: Short shell aliases and short command invocations
  crit: suspicious
  conf: 0.85
  size_max: 256
  all:
  - id: metadata/lang/shebang::shell-script
  - id: micro-behaviors/data/control-flow/dispatch/alias::sh-alias-command-definition
  - id: metadata/lang/source/syntax/call/invocation::sh-short-command-with-short-argument
