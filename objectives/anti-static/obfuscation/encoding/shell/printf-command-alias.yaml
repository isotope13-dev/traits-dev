defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027
traits:
  - id: printf-octal-command-alias
    desc: Octal printf output becomes command alias
    crit: suspicious
    conf: 0.96
    size_max: 50000
    if:
      type: tree-sitter
      query: |
        ((program
          (variable_assignment name: (variable_name) @saved
            value: (command_substitution
              (command name: (command_name (word) @printf)
                argument: (raw_string) @escapes)))
          . (comment)* .
          [(command name: (command_name
             [(expansion (variable_name) @used)
              (simple_expansion (variable_name) @used)]))
           (redirected_statement body: (command name: (command_name
             [(expansion (variable_name) @used)
              (simple_expansion (variable_name) @used)])))]) @alias
          (#eq? @printf "printf") (#eq? @saved @used)
          (#match? @escapes "(\\\\[0-7]{3}){3}"))
