defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: dpkg-maintainer-script-obfuscated-command
    desc: Debian script has shell obfuscation clues
    crit: suspicious
    conf: 0.96
    attack: T1195.002, T1027
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
    any:
      - id: metadata/lang/encoding/shape/escape::shell-ansi-octal-escapes
      - id: metadata/lang/encoding/shape/escape::sh-dense-hex-escapes
      - id: micro-behaviors/data/string/concat/expression::sh-char-split-concatenation

