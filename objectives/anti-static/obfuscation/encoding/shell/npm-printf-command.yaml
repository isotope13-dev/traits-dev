defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  # Require substitution in command position, not an argument to echo/printf.
  # This detects concealment without claiming the reconstructed verb is valid.
  - id: npm-postinstall-printf-command-word
    desc: Install hook executes printf-built command words
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|;)\s*\$\(printf\s+"(%s){2,8}[^"\n]{0,80}"\s+"[^"\n]{1,30}"'
