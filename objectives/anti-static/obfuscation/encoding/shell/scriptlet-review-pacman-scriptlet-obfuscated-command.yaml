defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pacman-scriptlet-obfuscated-command
    desc: Pacman scriptlet has shell obfuscation clues
    crit: suspicious
    conf: 0.96
    attack: T1195.002, T1027
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook
    any:
      - id: metadata/lang/encoding/shape/escape::shell-ansi-octal-escapes
      - id: metadata/lang/encoding/shape/escape::sh-dense-hex-escapes
      - id: micro-behaviors/data/string/concat/expression::sh-char-split-concatenation

