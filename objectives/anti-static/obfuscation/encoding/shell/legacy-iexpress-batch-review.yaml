defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-scrambled-esix-fragment
  desc: Batch assigns scrambled esix fragment
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (?i)\bSet\s+"?[A-Za-z0-9_]{6,}=esix"?
- id: batch-scrambled-cdm-fragment
  desc: Batch assigns scrambled Cdm fragment
  crit: component
  conf: 0.86
  if:
    type: text
    regex: (?i)\bSet\s+"?[A-Za-z0-9_]{6,}=Cdm"?
- id: batch-dynamic-slash-switch
  desc: Batch reconstructs slash-prefixed switch
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: Set\s+"?[A-Za-z0-9_]{6,}=/![A-Za-z0-9_]{6,}:~[0-9]+,[0-9]+!
- id: batch-image-extension-fragment
  desc: Batch assigns an image-like extension fragment
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (?i)\bSet\s+"?[A-Za-z0-9_]{6,}=\.[bjpt][a-z]?[mp]
composite_rules:
- id: batch-scrambled-command-image-switch
  desc: Batch reconstructs command fragments and an image-like extension
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/encoding/shell::batch-scrambled-esix-fragment
  - id: objectives/anti-static/obfuscation/encoding/shell::batch-scrambled-cdm-fragment
  - id: objectives/anti-static/obfuscation/encoding/shell::batch-dynamic-slash-switch
  - id: objectives/anti-static/obfuscation/encoding/shell::batch-image-extension-fragment
  - id: micro-behaviors/data/string/access::batch-long-name-delayed-substring
