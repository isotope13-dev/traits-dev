# Routed from legacy dropper/execution/encoding after evidence review.
# Encoding or evaluation is retained; no unbound payload handoff is claimed.
defaults:
  platforms: [netscaler, appliance, unix]
  for: [shell]
  attack: T1059.004

traits:
  - id: shell-eval-decoded-command
    desc: Shell eval decoded command
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: 'eval "$(echo "$hex_encoded"'

composite_rules:
  - id: shell-hex-base64-eval-sequence
    desc: Hex/Base64 decoder sequence and eval markers
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/multiple-encoding::xxd-base64-decode-sequence
      - id: shell-eval-decoded-command
    any:
      - id: micro-behaviors/communications/http/url/endpoint::api-v1-gateway-path
