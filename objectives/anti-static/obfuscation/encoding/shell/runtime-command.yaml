# Shell command obfuscation patterns from the ESX BusyBox research.  The
# matchers describe decoder mechanics and execution sinks, not ESXi commands.
defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1027,T1059.004,T1140
  mbc: B0032

traits:
  - id: shell-printf-hex-substitution
    desc: Literal hex-encoded shell command substitution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\$\(\s*printf\s+[^%\n;]{0,100}\\x[0-9a-fA-F]{2}(\\x[0-9a-fA-F]{2})+'
    unless:
      - id: well-known/tool/sysadmin/rpm-tools::rpm2cpio-script

  - id: shell-printf-octal-substitution
    desc: Multi-byte octal printf command substitution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\$\(\s*printf\s+.{0,100}\\[0-7]{3}(\\[0-7]{3})+'
    unless:
      - id: well-known/tool/sysadmin/rpm-tools::rpm2cpio-script

  - id: shell-ansi-hex-fragment
    desc: Consecutive ANSI-C hex escapes in shell
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: "\\$'[^']{0,80}\\\\x[0-9a-fA-F]{2}(\\\\x[0-9a-fA-F]{2})+"

  - id: shell-ansi-octal-fragment
    desc: Consecutive ANSI-C octal escapes in shell
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: "\\$'[^']{0,80}\\\\[0-7]{3}(\\\\[0-7]{3})+"

  - id: shell-awk-token
    desc: Awk decoder invocation
    crit: component
    conf: 0.9
    if:
      type: text
      word: awk

  - id: shell-awk-begin-block
    desc: Awk begins a decoder block
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bBEGIN\s*\{'

  - id: shell-awk-charcode-output
    desc: Awk prints numeric character codes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bprintf\b.{0,80}%c.{0,40}[0-9]{2,3}'

  - id: shell-awk-byte-format
    desc: Awk formats byte escapes
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bsprintf\s*\(.{0,60}%c.{0,30}0x[0-9a-fA-F]{2}'

  - id: shell-awk-gsub-call
    desc: Awk calls gsub
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '\bgsub\s*\('

  - id: shell-awk-system-call
    desc: Awk calls system
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '\bsystem\s*\('

  - id: shell-awk-xor-call
    desc: Awk XOR call
    crit: notable
    conf: 0.94
    if:
      type: literal
      regex: '\bxor\s*\('

  # The pipe-into-a-shell sink is a neutral execution primitive, not an
  # encoding technique, and it was already defined canonically in
  # micro-behaviors/data/runtime/keywords. The local copy claimed the piped
  # output was "decoded" -- something its regex never checked -- and matched
  # Ruby block parameters (`do |sh|`) as well. The composites below now
  # reference the capability atom; the decoding evidence comes from their awk
  # legs.

  - id: shell-host-key-assignment
    desc: Host-derived key assignment
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\b[A-Z_][A-Z0-9_]*\s*=\s*\$\(\s*(hostname|uname|sysctl|getconf)\b'

  - id: shell-esx-version-key
    desc: ESX version key assignment
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\b[A-Z_][A-Z0-9_]*\s*=\s*\$\(\s*esxcli\s+system\s+version\b'

  - id: shell-esx-firewall-test
    desc: ESX firewall state test
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\[\s*\$\(\s*esxcli\s+network\s+firewall\b'

  - id: shell-vim-vm-count-test
    desc: VM count state test
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\[\s*\$\(\s*vim-cmd\s+vmsvc/getallvms\b'

  - id: shell-encoded-file-write
    desc: Encoded text written to variable file
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bprintf\b.{0,100}>\s*\$[A-Za-z_][A-Za-z0-9_]*'

  # NOTE: `rm -f $VAR` lives in micro-behaviors/fs/file/delete::
  # rm-force-variable-target. It was duplicated here as a local
  # `shell-variable-file-delete`, which both split one behaviour across two ML
  # features and filed a plain filesystem delete under obfuscation/encoding —
  # every autoconf `configure` (`rm -f $ac_rmfiles`) reported a decoder
  # component. The staged-self-delete composite references the canonical atom.

  - id: shell-morse-table
    desc: Morse lookup table assignment
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'm\s*\[\s*["''][.\\-]{1,4}["'']\s*\]\s*='

  - id: shell-morse-token-list
    desc: Morse token list
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'split\s*\(\s*["''][.\- /]{20,}["'']'

  - id: shell-binary-value-list
    desc: Binary value list
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'split\s*\(\s*["''][01]{5,}'

  - id: shell-binary-accumulator
    desc: Binary accumulator
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bv\s*=\s*v\s*\*\s*2'

  - id: shell-scientific-value-list
    desc: Scientific value list
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'split\s*\(\s*["''][0-9]+\.[0-9]+e[+-]?[0-9]+'

  - id: shell-percent-c-output
    desc: Awk character output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'printf\s*\(\s*["'']%c["'']'

composite_rules:
  - id: shell-awk-character-decoder
    desc: Awk numeric character decoder
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: shell-awk-token
      - id: shell-awk-begin-block
      - id: shell-awk-charcode-output

  - id: shell-awk-invisible-strip-exec
    desc: Awk strips hidden bytes then executes
    crit: suspicious
    conf: 0.99
    near_bytes: 4000
    all:
      - id: shell-awk-token
      - id: shell-awk-byte-format
      - id: shell-awk-gsub-call
      - id: shell-awk-system-call

  - id: shell-awk-xor-shell
    desc: Awk XOR decoder reaches shell
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: shell-awk-token
      - id: shell-awk-xor-call
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-host-keyed-decoder
    desc: Host key feeds an Awk decoder
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: shell-host-key-assignment
      - id: shell-awk-xor-shell

  - id: shell-esx-keyed-decoder
    desc: ESX build key feeds an Awk decoder
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: shell-esx-version-key
      - id: shell-awk-xor-shell

  - id: shell-staged-self-delete
    desc: Staged shell file is executed and deleted
    crit: suspicious
    conf: 0.98
    near_bytes: 700
    all:
      - id: shell-encoded-file-write
      - id: micro-behaviors/process/create/shell/eval::shell-variable-file-exec
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target

  - id: shell-morse-decoder
    desc: Awk Morse decoder reaches shell
    crit: suspicious
    conf: 0.96
    near_bytes: 3200
    all:
      - id: shell-awk-token
      - id: shell-morse-table
      - id: shell-morse-token-list
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-binary-decoder
    desc: Awk binary decoder reaches shell
    crit: suspicious
    conf: 0.96
    near_bytes: 2600
    all:
      - id: shell-awk-token
      - id: shell-binary-value-list
      - id: shell-binary-accumulator
      - id: shell-percent-c-output
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-scientific-decoder
    desc: Awk scientific decoder reaches shell
    crit: suspicious
    conf: 0.96
    near_bytes: 2400
    all:
      - id: shell-awk-token
      - id: shell-scientific-value-list
      - id: shell-percent-c-output
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-obfuscated-command-execution
    desc: Shell decodes and executes a runtime command
    crit: hostile
    conf: 0.98
    near_bytes: 2000
    all:
      - id: metadata/lang/shebang::shell-script
      - id: micro-behaviors/process/create/shell/eval::shell-dynamic-command-execution
    any:
      - id: shell-printf-hex-substitution
      - id: shell-printf-octal-substitution
      - id: shell-ansi-hex-fragment
      - id: shell-ansi-octal-fragment
      - id: shell-awk-character-decoder
      - id: shell-awk-invisible-strip-exec
      - id: shell-awk-xor-shell
      - id: shell-morse-decoder
      - id: shell-binary-decoder
      - id: shell-scientific-decoder

  - id: shell-host-keyed-obfuscated-command
    desc: Host key gates shell command decode
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/shebang::shell-script
      - id: shell-host-keyed-decoder

  - id: shell-infrastructure-gated-command
    desc: ESX state gates an encoded command
    crit: hostile
    conf: 0.98
    near_bytes: 1200
    all:
      - id: metadata/lang/shebang::shell-script
      - id: shell-esx-firewall-test
      - id: shell-vim-vm-count-test
      - id: shell-printf-octal-substitution

  - id: shell-obfuscated-staged-command
    desc: Encoded command is staged and deleted
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/shebang::shell-script
      - id: shell-staged-self-delete
      - id: shell-printf-octal-substitution

  - id: shell-alternative-encoding-command
    desc: Alternative encoding reaches shell
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/shebang::shell-script
    any:
      - id: shell-morse-decoder
      - id: shell-binary-decoder
      - id: shell-scientific-decoder
