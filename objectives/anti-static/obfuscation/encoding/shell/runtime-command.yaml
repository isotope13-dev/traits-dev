# Shell command obfuscation patterns from the ESX BusyBox research.  The
# matchers describe decoder mechanics and execution sinks, not ESXi commands.
defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1027,T1059.004,T1140
  mbc: B0032

traits:
  - id: shell-printf-hex-substitution
    desc: ASCII hex-encoded shell command substitution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\$\(\s*printf\s+[^%\n;]{0,80}\\x[2-7][0-9a-fA-F](\\x[2-7][0-9a-fA-F])+'
    unless:
      - id: well-known/tool/sysadmin/rpm-tools::rpm2cpio-script
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::git-tests-directory

  - id: shell-printf-octal-substitution
    desc: Short octal printf command substitution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # A command-name decoder emits a short, all-escape token and closes the
      # substitution immediately. Do not classify byte-range fixtures such as
      # `bytes=$(printf "\001...\377")`: those decode data, not a hidden
      # command, and a prefix of their long run satisfied the old rule.
      regex: '\$\(\s*printf\s+(["'']?%b["'']?\s+)?["'']?(\\[0-7]{3}){2,24}["'']?\s*\)'
    unless:
      - id: well-known/tool/sysadmin/rpm-tools::rpm2cpio-script
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::git-tests-directory
      - id: well-known/lib/development/modernc-ccorpus2::source-archive-path

  # Both fragments require at least one escape in the ASCII range next to
  # another escape. A run made only of bytes >= 0x80 is a UTF-8 literal, which
  # is how a POSIX script embeds a non-ASCII character portably: glibc's
  # `tzselect` writes `CUNEIFORM_SIGN_URU_TIMES_KI=$'\360\222\215\205'` to test
  # whether the shell handles multibyte characters, and shipped that finding in
  # every Debian-based container image. A shell obfuscator assembles a command
  # name, and command names are ASCII (`$'\143\165\162\154'` = curl). Pure
  # control-byte runs (000-037) are JSON/string sanitizers, not obfuscation —
  # excluded via `not:` because encoding printable-octal into the main regex
  # blows the 90-byte pattern budget.
  - id: shell-ansi-hex-fragment
    desc: Consecutive ANSI-C hex escapes in shell
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: "\\$'[^']{0,60}(\\\\x[2-7][0-9a-fA-F]\\\\x[0-9a-fA-F]{2}|\\\\x[0-9a-fA-F]{2}\\\\x[2-7][0-9a-fA-F])"

    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/app/development/zshrs::zshrs-test-corpus-path
  - id: shell-ansi-octal-fragment
    desc: Consecutive ANSI-C octal escapes in shell
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: "\\$'[^']{0,60}(\\\\[01][0-7]{2}\\\\[0-7]{3}|\\\\[0-7]{3}\\\\[01][0-7]{2})"
      not:
        - regex: "tr -d '\\\\[0-7]"
        - regex: '\[\$.*\$''\\[01]'
        # Control-only pairs (000-037), e.g. JSONL sanitizers stripping C0 bytes.
        - regex: "\\$'[^']{0,40}\\\\0[0-3][0-7]\\\\0[0-3][0-7]"

  - id: shell-awk-token
    desc: Awk decoder invocation
    crit: component
    conf: 0.9
    if:
      type: text
      word: awk

  - id: shell-awk-begin-block
    desc: Awk begins a decoder block
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bBEGIN\s*\{'

  - id: shell-awk-charcode-output
    desc: Awk prints numeric character codes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bprintf\b.{0,80}%c.{0,40}[0-9]{2,3}'

  - id: shell-awk-byte-format
    desc: Awk formats byte escapes
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bsprintf\s*\(.{0,60}%c.{0,30}0x[0-9a-fA-F]{2}'

  - id: shell-awk-gsub-call
    desc: Awk calls gsub
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '\bgsub\s*\('

  - id: shell-awk-xor-call
    desc: Awk XOR call
    crit: notable
    conf: 0.94
    if:
      type: literal
      regex: '\bxor\s*\('

  # The pipe-into-a-shell sink is a neutral execution primitive, not an
  # encoding technique, and it was already defined canonically in
  # micro-behaviors/data/runtime/keywords. The local copy claimed the piped
  # output was "decoded" -- something its regex never checked -- and matched
  # Ruby block parameters (`do |sh|`) as well. The composites below now
  # reference the capability atom; the decoding evidence comes from their awk
  # legs.

  - id: shell-host-key-assignment
    desc: Host-derived key assignment
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\b[A-Z_][A-Z0-9_]*\s*=\s*\$\(\s*(hostname|uname|sysctl|getconf)\b'

  - id: shell-esx-version-key
    desc: ESX version key assignment
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\b[A-Z_][A-Z0-9_]*\s*=\s*\$\(\s*esxcli\s+system\s+version\b'

  - id: shell-esx-firewall-test
    desc: ESX firewall state test
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\[\s*\$\(\s*esxcli\s+network\s+firewall\b'

  - id: shell-vim-vm-count-test
    desc: VM count state test
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\[\s*\$\(\s*vim-cmd\s+vmsvc/getallvms\b'

  # NOTE: `printf ... > $VAR` lives in micro-behaviors/fs/file/write/redirect::
  # shell-printf-file-write. It was duplicated here as `shell-encoded-file-write`
  # ("Encoded text written to variable file"), which both split one behaviour
  # across two ML features and called a plain stdout redirect an encoding — the
  # `rw` package's bash test harness (`printf '%09X\\n' $RANDOM >> $FILE`)
  # reported an obfuscation atom. The staged-self-delete composite below
  # references the canonical atom.

  # NOTE: `rm -f $VAR` lives in micro-behaviors/fs/file/delete::
  # rm-force-variable-target. It was duplicated here as a local
  # `shell-variable-file-delete`, which both split one behaviour across two ML
  # features and filed a plain filesystem delete under obfuscation/encoding —
  # every autoconf `configure` (`rm -f $ac_rmfiles`) reported a decoder
  # component. The staged-self-delete composite references the canonical atom.

  - id: shell-morse-table
    desc: Morse lookup table assignment
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'm\s*\[\s*["''][.\\-]{1,4}["'']\s*\]\s*='

  - id: shell-morse-token-list
    desc: Morse token list
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'split\s*\(\s*["''][.\- /]{20,}["'']'

  - id: shell-binary-value-list
    desc: Binary value list
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'split\s*\(\s*["''][01]{5,}'

  - id: shell-binary-accumulator
    desc: Binary accumulator
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bv\s*=\s*v\s*\*\s*2'

  - id: shell-scientific-value-list
    desc: Scientific value list
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'split\s*\(\s*["''][0-9]+\.[0-9]+e[+-]?[0-9]+'

  - id: shell-percent-c-output
    desc: Awk character output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'printf\s*\(\s*["'']%c["'']'

composite_rules:
  - id: shell-awk-character-decoder
    desc: Awk numeric character decoder
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: shell-awk-token
      - id: shell-awk-begin-block
      - id: shell-awk-charcode-output

  - id: shell-awk-invisible-strip-exec
    desc: Awk strips hidden bytes then executes
    crit: suspicious
    conf: 0.99
    near_bytes: 4000
    all:
      - id: shell-awk-token
      - id: shell-awk-byte-format
      - id: shell-awk-gsub-call
      - id: micro-behaviors/process/create/exec::awk-system-call

  - id: shell-awk-xor-shell
    desc: Awk XOR decoder reaches shell
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: shell-awk-token
      - id: shell-awk-xor-call
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-host-keyed-decoder
    desc: Host key feeds an Awk decoder
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: shell-host-key-assignment
      - id: shell-awk-xor-shell

  - id: shell-esx-keyed-decoder
    desc: ESX build key feeds an Awk decoder
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: shell-esx-version-key
      - id: shell-awk-xor-shell

  - id: shell-staged-self-delete
    desc: Staged shell file is executed and deleted
    crit: suspicious
    conf: 0.98
    near_bytes: 700
    all:
      - id: micro-behaviors/fs/file/write/redirect::shell-printf-file-write
      - id: micro-behaviors/process/create/shell/eval::shell-variable-file-exec
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target

  - id: shell-morse-decoder
    desc: Awk Morse decoder reaches shell
    crit: suspicious
    conf: 0.96
    near_bytes: 3200
    all:
      - id: shell-awk-token
      - id: shell-morse-table
      - id: shell-morse-token-list
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-binary-decoder
    desc: Awk binary decoder reaches shell
    crit: suspicious
    conf: 0.96
    near_bytes: 2600
    all:
      - id: shell-awk-token
      - id: shell-binary-value-list
      - id: shell-binary-accumulator
      - id: shell-percent-c-output
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-scientific-decoder
    desc: Awk scientific decoder reaches shell
    crit: suspicious
    conf: 0.96
    near_bytes: 2400
    all:
      - id: shell-awk-token
      - id: shell-scientific-value-list
      - id: shell-percent-c-output
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell

  - id: shell-obfuscated-command-execution
    desc: Shell decodes and executes a runtime command
    crit: hostile
    conf: 0.98
    near_bytes: 2000
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::git-tests-directory
    all:
      - id: metadata/lang/shebang::shell-script
      - id: micro-behaviors/process/create/shell/eval::shell-dynamic-command-execution
    any:
      - id: shell-printf-hex-substitution
      - id: shell-printf-octal-substitution
      - id: shell-ansi-hex-fragment
      - id: shell-ansi-octal-fragment
      - id: shell-awk-character-decoder
      - id: shell-awk-invisible-strip-exec
      - id: shell-awk-xor-shell
      - id: shell-morse-decoder
      - id: shell-binary-decoder
      - id: shell-scientific-decoder

  - id: shell-host-keyed-obfuscated-command
    desc: Host key gates shell command decode
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/shebang::shell-script
      - id: shell-host-keyed-decoder

  - id: shell-infrastructure-gated-command
    desc: ESX state gates an encoded command
    crit: hostile
    conf: 0.98
    near_bytes: 1200
    all:
      - id: metadata/lang/shebang::shell-script
      - id: shell-esx-firewall-test
      - id: shell-vim-vm-count-test
      - id: shell-printf-octal-substitution

  - id: shell-obfuscated-staged-command
    desc: Encoded command is staged and deleted
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/shebang::shell-script
      - id: shell-staged-self-delete
      - id: shell-printf-octal-substitution

  - id: shell-alternative-encoding-command
    desc: Alternative encoding reaches shell
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/shebang::shell-script
    any:
      - id: shell-morse-decoder
      - id: shell-binary-decoder
      - id: shell-scientific-decoder
