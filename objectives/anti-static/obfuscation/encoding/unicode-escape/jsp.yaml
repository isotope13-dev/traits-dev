defaults:
  platforms: [unix, windows]
  for: [jsp]
  attack: T1027
  mbc: B0032

traits:
  - id: jsp-unicode-escaped-scriptlet
    desc: JSP scriptlet as printable Unicode escapes
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)<%\s*(\\u00([2-6][0-9a-f]|7[0-e])){16,}'

  - id: jsp-unicode-escaped-ascii-identifier
    desc: JSP identifiers as ASCII Unicode escapes
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: text
      regex: '(?i)(\\u00[4-7][0-9a-f]){5,}'

composite_rules:
  - id: jsp-unicode-escape-obfuscation
    desc: JSP code obfuscated with printable ASCII Unicode escapes
    crit: notable
    conf: 0.97
    any:
      - id: metadata/lang/encoding/unicode-escape::java-printable-unicode-escape-run
      - id: jsp-unicode-escaped-scriptlet
      - id: jsp-unicode-escaped-ascii-identifier

  - id: jsp-unicode-escaped-webshell
    desc: Unicode-escaped JSP scriptlet conceals a classloading or command webshell
    crit: hostile
    conf: 0.99
    attack: T1027,T1505.003
    mbc: B0030,B0032
    all:
      - id: jsp-unicode-escape-obfuscation
    any:
      - id: objectives/command-and-control/backdoor/webshell/request/code-load::jsp-aes-request-classload-shell
      - id: objectives/command-and-control/backdoor/webshell/request/code-load::jsp-request-base64-classload-shell
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-runtime-exec-shell
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-processbuilder-shell
