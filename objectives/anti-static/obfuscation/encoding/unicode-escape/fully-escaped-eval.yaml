# A script whose entire body is written as `\uXXXX` escapes and handed to eval.
#
# Every character of the payload -- spaces and newlines included -- spelled as
# an escape, so nothing in the source is greppable: not the URL it loads, not
# the APIs it calls, not a single keyword. A minifier never does this (it costs
# six bytes per character), and an author escaping a genuine special character
# escapes one or two, not hundreds in a row.
#
# The June 2024 WordPress.org source compromise shipped its whole browser
# payload this way, echoed into `wp_footer` as
# `eval("\u000a\u0020\u0020...")`.
#
# `metadata/lang/encoded/unicode-escape::dense-javascript-hex-escapes` measures
# escape *density* across a whole file; this keys on the sharper fact that the
# argument of a dynamic-execution sink is a solid run of them.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php]
  attack: T1027
  mbc: B0032

traits:
  - id: eval-argument-all-unicode-escapes
    desc: eval argument is solid Unicode escapes
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\b(eval|Function)\s*\(\s*["''](\\u[0-9a-fA-F]{4}){8,}'
composite_rules:
  # The escaped eval is the loader. Host-profile terms in the same
  # script are what that loader is reaching for: username, computer
  # name, and the profile path, still hidden inside the string table.
  - id: unicode-eval-host-profile
    desc: Unicode eval reaches host profile terms
    crit: hostile
    conf: 0.96
    attack: T1027,T1082
    # The host-profile leg only matches JavaScript and TypeScript.
    for: [javascript, typescript]
    near_lines: 8
    all:
      - id: eval-argument-all-unicode-escapes
      - id: objectives/supply-chain/recon-exfil/dns::obfuscated-host-profile-terms
    unless:
      - id: metadata/package/testing/harness/runtime/
