# A quoted eval/Function argument starts with at least eight Unicode escapes.
# This is concealment syntax: the matcher proves neither an entirely escaped
# body nor invocation of a function constructed from the argument.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php]
  attack: T1027
  mbc: B0032

traits:
  - id: unicode-escape-prefix-code-argument
    desc: eval/Function argument has Unicode prefix
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: \b(eval|Function)\s*\(\s*["'](\\u[0-9a-fA-F]{4}){8,}
    unless:
    - id: micro-behaviors/ui/help::escaped-local-command-reference
    - id: well-known/tool/offensive/pentestkit::local-storage-panel
composite_rules:
  # The escaped eval is the loader. Host-profile terms in the same
  # script are what that loader is reaching for: username, computer
  # name, and the profile path, still hidden inside the string table.
  - id: unicode-eval-host-profile
    desc: Unicode eval reaches host profile terms
    crit: hostile
    conf: 0.96
    attack: T1027,T1082
    # The host-profile leg only matches JavaScript and TypeScript.
    for: [javascript, typescript]
    near_lines: 8
    all:
      - id: unicode-escape-prefix-code-argument
      - id: objectives/discovery/system/profile::obfuscated-host-profile-terms
    unless:
      - id: metadata/package/testing/harness/runtime/
