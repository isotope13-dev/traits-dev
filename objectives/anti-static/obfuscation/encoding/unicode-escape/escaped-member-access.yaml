# Bracket member access whose property name is spelled entirely as \u00XX
# escapes of plain ASCII (`fs['cr...']`). Source code never needs
# to escape an identifier-safe ASCII name; the only effect is hiding which
# API is called from string and signature scans.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
traits:
  - id: js-escaped-bracket-member-names
    desc: Bracket member names spelled as ASCII escapes
    crit: notable
    conf: 0.92
    count_min: 3
    if:
      type: text
      regex: '\[[''"](\\u00[2-7][0-9a-fA-F]){3,}[''"]\]'
composite_rules:
  # Escaped member names around the download, file write and shell exec
  # chain: the concealment is applied exactly to the calls that stage and
  # run the fetched payload.
  - id: escaped-members-hide-fetch-write-exec
    desc: Escaped member names hide a download, file stream write and exec call
    crit: hostile
    conf: 0.94
    attack: T1027,T1105,T1059
    all:
      - id: js-escaped-bracket-member-names
      - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/fs/write/file/stream::create-write-stream

  - id: jsp-unicode-escaped-classloader-webshell
    desc: JSP webshell conceals classloading APIs with Unicode escapes
    crit: hostile
    conf: 0.99
    for: [jsp]
    attack: T1505.003,T1027
    all:
      - id: metadata/lang/encoding/unicode-escape::java-unicode-escaped-identifier-call
      - id: micro-behaviors/process/interpreter/runtime/jvm::unicode-escaped-define-class
      - id: micro-behaviors/communications/http/server/request::jsp-request-reader-source
