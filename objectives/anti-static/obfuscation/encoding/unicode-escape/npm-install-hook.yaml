defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: "T1027,T1195.002,T1105,T1059.001"

composite_rules:
- id: unicode-obfuscated-npm-archive-dropper
  desc: Unicode-obfuscated npm hook hides archive extraction and EXE launch
  crit: hostile
  conf: 0.995
  mbc: B0024
  scope: leaf
  size_max: 20000
  all:
  - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
  - id: metadata/lang/encoded/unicode-escape::dense-javascript-hex-escapes
  - id: micro-behaviors/communications/http/download/url::archive-url-reference
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/fs/enumerate/directory::node-recursive-executable-search
