defaults:
  platforms: [windows, unix]
  attack: T1027
  for: [html]
composite_rules:
  - id: us-ascii-declared-high-bit-body
    desc: US-ASCII page with high-bit-byte body
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/document/html::us-ascii-charset-meta
      - id: metadata/document/html::high-bit-byte-run
  - id: high-bit-concealed-chr-decoder
    desc: High-bit body hides a Chr decoding call
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/document/html::high-bit-byte-run
      - id: metadata/document/html::high-bit-encoded-chr-call
  - id: high-bit-concealed-array-decoder
    desc: High-bit body hides a numeric Array decoder table
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/document/html::high-bit-encoded-array-call
      - id: metadata/document/html::high-bit-encoded-chr-call
