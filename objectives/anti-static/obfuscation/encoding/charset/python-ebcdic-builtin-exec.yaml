# A Python builtin (eval/exec) is looked up from a name hidden in an EBCDIC
# bytes literal, then called with a second EBCDIC-hidden string. Neither the
# builtin name nor the executed source appears as readable text. Code-page
# conversion has no legitimate reason to name a builtin.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027,T1059.006
  mbc: E1027

composite_rules:
  - id: python-ebcdic-hidden-builtin-exec
    desc: Resolves and runs builtin from EBCDIC-hidden strings
    crit: hostile
    conf: 0.95
    scope: file
    near_lines: 3
    all:
      - id: micro-behaviors/data/decode/charset::python-ebcdic-escaped-bytes-literal-decode
      - id: micro-behaviors/metaprogramming/reflection/resolve::python-getattr-builtins
