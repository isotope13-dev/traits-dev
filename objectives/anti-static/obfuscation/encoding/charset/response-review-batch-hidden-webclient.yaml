defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-codepage-obfuscated-systemroot-path
    desc: Codepage remapping with expanded SystemRoot path
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/signature::batch-codepage-remap-obfuscator
      - id: metadata/lang/source/syntax/expansion::batch-systemroot-variable-expansion-sequence
      - id: metadata/lang/encoding/shape/character::non-ascii-script-text
