# Routed from legacy dropper/execution/encoding after evidence review.
# Encoding or evaluation is retained; no unbound payload handoff is claimed.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
- id: nemucod-cp437-dropper
  desc: JScript CP437 mapping with encoded evaluation
  crit: hostile
  for: [javascript]
  needs: 3
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-string-obfuscation
  - id: micro-behaviors/data/encode/charset::js-cp437-array-mapping
  - id: objectives/anti-static/obfuscation/string/crypto::js-rolling-xor-decryption
  - id: micro-behaviors/data/format/executable/header::js-mz-header-array-check
