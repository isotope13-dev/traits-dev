defaults:
  attack: T1027
  mbc: B0032
traits:
- platforms:
  - windows
  for:
  - html
  - javascript
  id: script-encoded-java-applet-writer
  desc: Script Encoder hides an applet markup writer
  crit: suspicious
  conf: 0.98
  if:
    type: encoded
    encoding: script
    regex: (?i)document\.write(ln)?\(\s*["']<applet\b
composite_rules:
- platforms:
  - windows
  for:
  - html
  - javascript
  attack: T1027,T1189
  id: encoded-hidden-remote-java-applet
  desc: Conceals remote one-pixel Java applet activation
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/encoding/script::script-encoded-java-applet-writer
  - id: micro-behaviors/communications/http/client/resource::external-java-applet-codebase
  - id: micro-behaviors/ui/window/visibility::one-pixel-java-applet
- platforms:
  - linux
  - macos
  - windows
  for:
  - html
  - javascript
  - vbs
  - static-lib
  id: jscript-encoded-script-body
  desc: JScript.Encode runtime accompanies an encoded script block
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/lang/runtime::jscript-encode-runtime-declaration
  - id: metadata/file/encoding::microsoft-script-encoder-start-marker
