defaults:
  platforms: [windows]
  for: [html]
  attack: T1027,T1105
composite_rules:
  - id: unescaped-script-saves-remote-exe
    desc: Unescaped script saves a remote executable
    crit: hostile
    conf: 0.97
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
      - id: micro-behaviors/communications/http/url/path::http-executable-url-reference
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
