# A string-literal Script Encoder header planted ahead of a real encoded block
# misleads decoders that start at the first marker, so the true block is never
# recovered (cleave/stng's own Script Encoder layer was derailed this way).
# Page protectors (HTML Guardian) emit this, so it stays suspicious alone.
defaults:
  platforms: [windows]
  for: [html, javascript, vbs]
  attack: T1027

composite_rules:
  - id: script-encoder-decoy-header
    desc: Decoy Script Encoder header beside real block
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/file/encoding/shape::quoted-script-encoder-header
      - id: metadata/file/encoding/shape::tag-adjacent-script-encoder-header
