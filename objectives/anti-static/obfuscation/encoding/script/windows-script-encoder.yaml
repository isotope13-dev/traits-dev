defaults:
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1027

traits:
  - id: microsoft-script-encoder-magic
    desc: Microsoft Script Encoder magic
    crit: component
    conf: 0.94
    if:
      type: hex
      pattern: "23 40 7e 5e"
      offset: 0

  - id: microsoft-script-encoder-footer
    desc: Microsoft Script Encoder footer
    crit: component
    conf: 0.94
    if:
      type: hex
      pattern: "5e 23 7e 40"
      offset_range: [-64, null]

composite_rules:
  - id: microsoft-script-encoder-file
    desc: Microsoft Script Encoder protected script
    crit: suspicious
    conf: 0.98
    all:
      - id: microsoft-script-encoder-magic
      - id: microsoft-script-encoder-footer
