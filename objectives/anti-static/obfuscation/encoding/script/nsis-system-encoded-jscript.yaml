defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nsis-system-encoded-jscript
    for: [pe, javascript]
    desc: NSIS System installer with encoded JScript
    crit: suspicious
    conf: 0.98
    scope: outer
    all:
      - id: metadata/installer/builder/nsis::nsis
      - id: metadata/binary/symbols/name/export::system-dll-plugin-export-profile
      - id: objectives/anti-static/obfuscation/encoding/script::microsoft-script-encoder-file
