defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nsis-system-encoded-jscript
    for: [pe, javascript]
    desc: NSIS System installer with encoded JScript
    crit: suspicious
    conf: 0.98
    scope: outer
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/file/profile/installer/lifecycle::system-dll-plugin-export-profile
      - id: objectives/anti-static/obfuscation/encoding/script::microsoft-script-encoder-file
    unless:
      - id: metadata/signed/platform/
