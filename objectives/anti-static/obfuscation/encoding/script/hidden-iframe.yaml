defaults:
  attack: T1027
  mbc: B0032
  platforms: [windows]
  for: [html]
traits:
# Bind remote source and tiny dimensions in the SAME decoded iframe, rather
# than combining an encoded visible frame with an unrelated hidden frame.
- id: encoded-hidden-remote-iframe-source-first
  desc: Script Encoder conceals a tiny remote iframe
  crit: suspicious
  conf: 0.99
  if:
    type: encoded
    encoding: script
    regex: '(?i)<iframe src=["'']https?://[^>]{1,160}width=[01] height=[01]'
- id: encoded-hidden-remote-iframe-dimensions-first
  desc: Script Encoder conceals a tiny remote iframe
  crit: suspicious
  conf: 0.99
  if:
    type: encoded
    encoding: script
    regex: '(?i)<iframe width=[01] height=[01] SRC=["'']https?://'
composite_rules:
- id: encoded-hidden-remote-iframe
  desc: Script Encoder conceals a tiny remote iframe
  crit: suspicious
  conf: 0.99
  any:
  - id: encoded-hidden-remote-iframe-source-first
  - id: encoded-hidden-remote-iframe-dimensions-first
