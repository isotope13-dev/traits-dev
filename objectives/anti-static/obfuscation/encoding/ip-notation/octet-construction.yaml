# Reconstruction of IPv4 addresses from per-octet integer/hex literals
# joined at runtime — pure obfuscation pattern with no legitimate use.
# Examples:
#   ".".join(str(x) for x in [0x68, 0x15, 0x00, 0x01])  # → 104.21.0.1
#   ".".join(map(str, [104, 21, 0, 1]))
#   "%d.%d.%d.%d" % (0x68, 0x15, 0, 1)
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  attack: T1027
  mbc: B0032
traits:
# Ruby `%w[193 70 34 101].join('.')` — same per-octet hide as JS/Python
# integer-array joins; used by supply-chain installers to avoid a dotted IP literal.
- id: ruby-percent-w-octet-join
  desc: Ruby %w integer octets joined with dots
  crit: suspicious
  conf: 0.93
  for: [ruby]
  if:
    type: text
    regex: '%w\[\s*\d{1,3}\s+\d{1,3}\s+\d{1,3}\s+\d{1,3}\s*\]\.join\(\s*[''"]\.[''"]\s*\)'
  # Allow up to ~80 non-newline chars between `.join(` and the octet list,
  # including inner parens (e.g. `str(x) for x in`). Caps at one line.
- id: join-call
  desc: Joins values with a dot separator
  crit: component
  conf: 0.5
  if:
    type: text
    regex: '["'']\.["'']\.join\(|\.join\(["'']\.["'']\)'
- id: hex-octet-list
  desc: Four hex octets list
  crit: notable
  conf: 0.95
  for: [python]
  if:
    type: text
    regex: '\.join\([^\n]{0,80}0x[0-9a-fA-F]{1,2},\s*0x[0-9a-fA-F]{1,2},\s*0x'
- id: hex-octet-list-js
  desc: Hex array followed by dot-join
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "0x[0-9a-fA-F]{1,2},\\s*0x[0-9a-fA-F]{1,2},\\s*0x[^\\n]{0,40}\\.join\\([\"']\\.[\"']\\)"
- id: int-octet-list
  desc: Integer octets in dot-join
  crit: notable
  conf: 0.88
  # Require a dot-join before the list. A bare four-number array is common in
  # graphics, geometry, and data libraries and is not IPv4 obfuscation.
  if:
    type: text
    # The separator must be a dot: `''.join(chr(x) for x in [122,108,105,98])`
    # rebuilds a string from char codes, not an address.
    regex: '[''"]\.[''"]\.join\([^\n]{0,80}\[\s*\d{1,3}(,\s*\d{1,3}){3}\s*\]'
  # `[24, 16, 8, 0]` (or its reverse) is the bit-shift ladder every int-to-
  # dotted-quad formatter uses -- `".".join(str((v >> i) & 0xFF) for i in
  # [24,16,8,0])`. Those are shift widths, not hidden octets.
  not:
    - regex: '\[\s*(24,\s*16,\s*8,\s*0|0,\s*8,\s*16,\s*24)\s*\]'
- id: int-octet-list-js
  desc: Integer array followed by dot-join
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\[\d{1,3}(,\s*\d{1,3}){3}\][^\n]{0,40}\.join\(["'']\.["'']\)'
  # Same shift-ladder exclusion as `int-octet-list` above, which this atom was
  # missing: the id says `-js` but nothing restricts the file type, so it is
  # the leg that fires on every other language. The Ruby gem
  # `philiprehberger-ip_addr` scored suspicious on
  # `[24, 16, 8, 0].map { |shift| (int >> shift) & 0xFF }.join('.')` -- the
  # textbook int-to-dotted-quad formatter, with the ladder read as octets.
  not:
    - regex: '\[\s*(24,\s*16,\s*8,\s*0|0,\s*8,\s*16,\s*24)\s*\]'
    # A shift applied between the array and the join means the literals are
    # operands, not the address: the octets are computed from a variable.
    - regex: '\[\d{1,3}(,\s*\d{1,3}){3}\][^\n]{0,40}>>[^\n]{0,40}\.join\(["'']\.["'']\)'
# First element is a decimal octet; remaining slots are identifiers or
# arithmetic (`[77, seed, seed+9, seed+84]`). Bare `[r,g,b,a]` stays out
# because it does not start with a 1–3 digit literal.
# `i ? '.' : ''` (or equivalent) used to glue parts into a dotted string.
# The address's own characters as char codes: `[49,57,51,46,...]` is
# "193." -- digits (48-57) in 1-3 digit groups split by exactly three dots
# (46). String.fromCharCode / chr() then yields a dotted quad no grep sees.
- id: ipv4-charcode-array
  desc: IPv4 address spelled as character codes
  crit: suspicious
  conf: 0.93
  for: [javascript, typescript, python, html]
  if:
    type: text
    regex: '\[(4[89]|5[0-7])(, ?(4[89]|5[0-7])){0,2}(, ?46(, ?(4[89]|5[0-7])){1,3}){3}\]'
- id: ipv4-printf-tuple-construction
  desc: IPv4 from literal octets via printf
  # Obfuscation hides a hardcoded IP by splitting it into per-octet literals.
  # `'%d.%d.%d.%d' % (a,b,c,d)` with *variables* is just normal IP formatting
  # (debugger pretty-printers, display code) — require the first octet to be a
  # numeric/hex literal so variable-based formatting no longer matches.
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '["'']%d\.%d\.%d\.%d["'']\s*%\s*\(\s*(0x[\da-fA-F]{1,2}|\d{1,3})\s*,'
- id: ipv4-fstring-bitshift-octets
  desc: IPv4 built via bit-shift f-string from int
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: 'f["''][^"''\n]{0,40}\{[^}\n]{1,40}>>\s*24[^}\n]{1,40}\}\.\{[^}\n]{1,40}>>\s*16'
  # Only a *literal* packed integer hides an address. Shifting a variable is the
  # ordinary int-to-dotted-quad formatter that network code (OSPF router-ids,
  # netmask helpers) writes, so drop matches whose shifted operand is a name.
  not:
    - regex: '\{\(?[A-Za-z_][A-Za-z_0-9.\[\]]*\s*>>\s*24'
- id: ipv4-bytes-call
  desc: Four-octet bytes array constructor
  crit: notable
  conf: 0.9
  for: [python]
  # `bytes([...])` — list-literal constructor. Component-only, gated by the
  # `ipv4-inet-ntoa-obfuscated` composite (requires inet_ntoa nearby).
  if:
    type: text
    regex: 'bytes\s*\(\s*\[\s*\d{1,3}(,\s*\d{1,3}){3}\s*\]'
- id: ipv4-struct-pack-dec
  desc: inet_ntoa packs a decimal IPv4 constant
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'inet_ntoa\s*\(\s*struct\.pack\s*\([^)\n]{0,24}[0-9]{4,10}'
- id: ipv4-ipaddress-from-int
  desc: IPv4 built via ipaddress.IPv4Address(int)
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(ipaddress\.)?IPv4Address\s*\(\s*(0x[0-9a-fA-F]{6,8}|[0-9]{4,10})\s*\)'
- id: url-with-hex-ip
  desc: URL with hex-encoded IPv4
  crit: suspicious
  conf: 0.95
  unless:
  - id: metadata/package/testing/
  # SSRF/egress deny-list docs: hex loopback cited as a blocked check vector
  - type: text
    regex: 'https?://0x[0-9a-fA-F]{6,8}/["'']\)?\s*#\s*(raises|hex|loopback)'
  - type: text
    regex: '(?i)#\s*raises\s*\(\s*hex\b'
  # The hex-IP appears inside a comment/docstring line explaining an SSRF
  # defense (e.g. `# hex-encoded IPs (\`http://0x7f000001/\`) — bypass form`)
  # rather than a URL the program actually requests.
  - type: text
    regex: '(?m)^\s*(#|//|\*)\s*.{0,120}https?://0x[0-9a-fA-F]{6,8}'
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/tool/offensive/
  - id: "metadata/file/naming::test-directory-component"
  # Match runtime literals, not comments or Python documentation examples.
  if:
    type: literal
    exclude_docstrings: true
    regex: 'https?://0x[0-9a-fA-F]{6,8}([:/]|$)'
- id: url-with-octal-ip
  desc: URL with octal-encoded IPv4 octet
  crit: suspicious
  conf: 0.93
  unless:
  - id: well-known/tool/offensive/pentestkit::local-storage-panel
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/tool/offensive/bughunter::bughunter-source-context
  - id: metadata/package/testing/
  - id: well-known/tool/offensive/bingo::bingo-autoexploit-module-context
  - id: well-known/tool/offensive/bingo/
  - id: well-known/tool/offensive/mcpsec/
  - id: metadata/package/documentation/agent-safety::scoped-security-test-documentation
  - id: "metadata/file/naming::test-directory-component"
  # Docstrings describing rejected SSRF inputs are not hidden destinations.
  if:
    type: literal
    exclude_docstrings: true
    regex: https?://0[0-7]{0,2}[1-7][0-7]*\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
- id: url-with-dword-ip
  desc: URL with single-DWORD IPv4 (no dots)
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: https?://(1[0-9]{8,9}|[2-9][0-9]{8,9}|[1-3][0-9]{9}|4[0-2][0-9
composite_rules:
- id: ipv4-octet-list-hex-join
  desc: IPv4 reconstruction from hex octet list
  crit: suspicious
  conf: 0.95
  all:
  - id: join-call
  any:
  - id: hex-octet-list
  - id: hex-octet-list-js
  near_lines: 2
  downgrade:
    any:
    - id: metadata/build/bundler/asset::js-large-module-bundle
    - id: micro-behaviors/process/interpreter/vm/
  unless:
  - id: well-known/lib/format/json-ts/
  - id: well-known/lib/format/pdfjs/
  - id: metadata/build/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
- id: ipv4-octet-list-int-join
  desc: IPv4 reconstruction from integer octet list
  crit: suspicious
  conf: 0.88
  all:
  - id: join-call
  any:
  - id: int-octet-list
  - id: int-octet-list-js
  near_lines: 2
  unless:
  - id: well-known/lib/format/json-ts/
  - id: well-known/lib/format/pdfjs/
  # ipaddr.js parses/formats addresses from integer octets by design.
  - id: well-known/lib/network/ipaddr/
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: metadata/build/
# Computed octets (seed+N) joined with '.' — same *shape* as a dotted
# quad, but a version/seed plus arithmetic is also ordinary feature
# encoding. Keep the observation; do not treat it as C2 obfuscation.
- id: ipv4-computed-octet-dot-join
  desc: IPv4 reconstruction from computed octet array
  crit: notable
  conf: 0.9
  near_lines: 16
  all:
  - id: micro-behaviors/data/collection/array::four-value-array-with-identifier
  - id: join-call
  unless:
  - id: well-known/lib/network/ipaddr/
  - id: well-known/lib/data/faker::faker-library-context
  - id: metadata/build/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: ipv4-construction-aggregator
  desc: IPv4 address built or referenced via obfuscated form
  crit: suspicious
  conf: 0.93
  any:
  - id: ipv4-octet-list-hex-join
  - id: ipv4-octet-list-int-join
  - id: ipv4-printf-tuple-construction
  - id: ipv4-fstring-bitshift-octets
  - id: ipv4-inet-ntoa-obfuscated
  - id: ipv4-ipaddress-from-int
  - id: url-with-hex-ip
  - id: url-with-octal-ip
  - id: url-with-dword-ip
  - id: ruby-percent-w-octet-join
  - id: word-table-octet-join
  unless:
  # A dedicated IP-address library (ipaddr.js) constructs addresses from octets
  # as its core function, not to obfuscate a C2 endpoint.
  - id: well-known/lib/network/ipaddr/
- id: ipv4-inet-ntoa-obfuscated
  desc: IPv4 built via socket.inet_ntoa bytes packing
  crit: suspicious
  conf: 0.95
  near_lines: 2
  all:
  - id: micro-behaviors/communications/ip/parse::python-inet-ntoa-call
  any:
  - id: micro-behaviors/data/serialize/binary::python-pack-hex-u32
  - id: ipv4-bytes-call
  - id: ipv4-struct-pack-dec
  unless:
  - id: well-known/tool/offensive/pentestkit/
  - id: well-known/lib/stdlib/python-stdlib
# Word-substitution variant of the octet list: each octet hides behind an
# English word key in an embedded table ("maple" => 192), the words are
# collected from anchor-delimited text, and the looked-up values are
# dot-joined into the dotted address. The words exist to keep the endpoint out
# of plain text — neither the code nor the fetched document shows an address —
# which is the same no-legitimate-use hide as the literal-octet forms above.
- id: word-table-octet-join
  desc: Dotted address built from word-to-number lookup table
  crit: suspicious
  conf: 0.9
  near_lines: 30
  unless:
  - id: objectives/command-and-control/reverse-shell/fd-redirect::placeholder-documentation-address
  all:
  - id: micro-behaviors/data/collection/map::four-word-numeric-table
  - id: micro-behaviors/data/decode/custom::dictionary-dot-join
# When the reconstructed address is immediately dialed, the hidden value is a
# used network endpoint, not a formatting curiosity: concealment of the
# rendezvous destination plus its use. Remote-fetch context is covered by the
# dead-drop resolver composite; this one also catches locally embedded
# word-table addresses.
- id: word-table-octet-join-dialed
  desc: Socket dialed to an address hidden behind word-number table
  crit: hostile
  conf: 0.92
  near_lines: 40
  all:
  - id: word-table-octet-join
  - id: micro-behaviors/communications/socket/connect::outbound-connect-call
