defaults:
  platforms:
  - unix
  - windows
  attack: T1027,T1059.006
  for:
  - python
composite_rules:
- id: python-xor-decoded-command-execution
  desc: Python runs a command decoded with XOR
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/decode/xor/reconstruction::python-xor-byte-comprehension-text-decode
  - id: micro-behaviors/process/argument/positional::python-decoded-bytes-subprocess-argv
- id: python-base64-exec-telegram-tdata
  desc: Base64 source references Telegram session data
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/anti-static/obfuscation/eval/loader::python-base64-decoded-source-execution
  - id: micro-behaviors/fs/path/application/messaging::encoded-telegram-desktop-tdata-reference
