defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: encoded-wmi-vm-gate-remote-eval
    desc: Encoded WMI VM checks and remote eval
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule encoded_wmi_vm_gate_remote_eval {
          strings:
            $cpu = "Win32_Processor" base64
            $machine = "Win32_ComputerSystem" base64
            $video = "Win32_VideoController" base64
            $cores = "NumberOfLogicalProcessors" base64
            $vm = "vmware" base64
            $eval = " | iex" base64
          condition:
            all of them
        }
composite_rules:
  - id: obfuscated-electron-vm-gated-powershell-stage
    desc: Obfuscated VM-gated PowerShell stage
    crit: hostile
    conf: 0.97
    attack: T1027,T1497.001,T1059.001,T1105
    all:
      - id: encoded-wmi-vm-gate-remote-eval
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
