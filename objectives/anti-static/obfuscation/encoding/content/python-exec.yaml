defaults:
  platforms: [windows, unix]
  for: [python]
  crit: suspicious
  attack: T1027

traits:
  # Text fallback when source parsing exceeds its line budget. Stagers may put
  # a multi-megabyte base64 blob on one line, or place exec after a semicolon;
  # in either case the call node may not form and AST matchers miss the blob.
  # A plain-text match survives both shapes.
  - id: base64-exec-text
    desc: Standalone exec decodes long Base64 literal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|;)[ \t]*exec[ \t]*\([ \t]*(base64\.)?b64decode[ \t]*\(["'']{1,3}[\w+/=-]{256,}'
  - id: decoded-base64-python-executable-launch
    desc: Decoded Base64 Python writes and runs EXE
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '(?s)(open\([^)]{0,100}\.exe.{0,100}wb|\.write\(b["'']MZ).*?os\.startfile\s*\('
  - id: decoded-importlib-urllib-request
    desc: Decoded Base64 imports urllib via importlib
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '__import__\(["'']importlib["'']\)\.import_module\(["'']urllib\.request["'']\)'
  - id: decoded-urlopen-read-decode
    desc: Decoded Base64 reads HTTP response text
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '\.urlopen\(["'']https?://[\w./:?&=-]{1,120}["'']\)\.read\(\)\.decode\('

composite_rules:
  - id: decoded-python-importlib-urlopen-source
    desc: Base64-decoded Python fetches source through urllib
    crit: suspicious
    conf: 0.96
    all:
      - id: decoded-importlib-urllib-request
      - id: decoded-urlopen-read-decode
  - id: python-base64-exec-executable-dropper
    desc: Python executes Base64 source that writes and starts an executable
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1105,T1204.002
    all:
      - id: objectives/anti-static/obfuscation/encoding/content::base64-exec-text
      - id: objectives/anti-static/obfuscation/encoding/content::decoded-base64-python-executable-launch

  - id: python-base64-exec-remote-source
    desc: Python executes Base64 source that retrieves and runs remote Python code
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1105,T1059.006
    all:
      - id: objectives/anti-static/obfuscation/encoding/content::b64decode-exec
      - id: objectives/anti-static/obfuscation/encoding/content::decoded-python-importlib-urlopen-source

  - id: b64decode-exec
    # Bind the path to this member while reading package identity across files.
    downgrade:
      scope: archive
      all:
        - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package-without-interpreter
        - type: path
          regex: '(^|[\\/])tests[\\/]fixtures[\\/]'
    desc: Exec receives Base64-decoded Python source
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-base64-result
      - id: objectives/anti-static/obfuscation/control-flow/logic::imported-base64-exec
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
      - id: objectives/anti-static/obfuscation/control-flow/logic::python-base64-runtime-wrappers
      - id: metadata/package/testing/presence/harness::verified-python-test-file
      - id: well-known/app/browser/ungoogled-chromium::ungoogled-chromium-patch-validator
