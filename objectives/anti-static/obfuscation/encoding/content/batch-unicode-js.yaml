defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: batch-echo-unicode-js-eval
  desc: Batch echoes unicode JS eval
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)echo\s+eval\(''\\u[0-9a-f]{4}'
composite_rules:
- id: batch-unicode-js-url-stager
  desc: Batch Unicode JS and GetObject clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/shell/command-mode::comspec-delayed-command
  - id: batch-echo-unicode-js-eval
  - id: micro-behaviors/process/create/shell/batch::batch-variable-write-and-call
  - id: micro-behaviors/os/com/automation::script-protocol-getobject
