defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027,T1059.006
traits:
  - id: python-aliased-base64-decode-exec
    desc: Executes content from aliased Base64 decoder
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (import_from_statement
            module_name: (dotted_name) @module
            name: (aliased_import name: (dotted_name) @original alias: (identifier) @alias))
          (expression_statement (call
            function: (identifier) @exec
            arguments: (argument_list (call
              function: (attribute
                object: (call function: (identifier) @used)
                attribute: (identifier) @decode))))))
          (#eq? @module "base64")
          (#eq? @original "b64decode")
          (#eq? @alias @used)
          (#eq? @exec "exec")
          (#eq? @decode "decode"))
