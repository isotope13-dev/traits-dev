defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032
composite_rules:
  - id: rotated-base91-decoder
    desc: Rotated Base91 decoder
    crit: suspicious
    conf: 0.9
    size_max: 2000000
    near_bytes: 4096
    all:
      - id: metadata/file/literal::hex-token-length-undefined-cluster
      - id: micro-behaviors/data/decode/base91::base91-magic-constants
      - id: objectives/anti-static/obfuscation/string/charcode-url::fromcodepoint-with-base-decode
    any:
      - id: metadata/file/literal::repeated-85-to-95-character-variable-strings
      - id: micro-behaviors/data/control-flow/error-handling::catch-before-await-or-require
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
