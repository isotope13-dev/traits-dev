defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1027,T1027.009,T1059.006"
  mbc: "B0032,B0009"

composite_rules:
  - id: pyinstaller-obfuscated-runtime-source
    for: [pe, pyc]
    desc: PyInstaller XOR-decoded runtime source execution
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
      - id: micro-behaviors/data/decode/xor/transform::python-xor-string-decoder-bytecode
      - id: metadata/binary/layout/ratio::overlay-over-90pct

  - id: pyinstaller-hex-temp-exe-dropper
    for: [pe, pyc]
    desc: PyInstaller bundles hex-encoded hidden temp EXE dropper
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: objectives/execution/payload/file-exec/spawn/hidden-window::pyc-hex-temp-exe-hidden-spawn
