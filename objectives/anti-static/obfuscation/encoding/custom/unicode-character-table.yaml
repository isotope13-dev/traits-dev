defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
traits:
  - id: unicode-escaped-input-character-table-rebuild
    desc: Escaped input decoded through a character table
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      # Bind the nested decoder's result to the array used as character-table
      # indices. A localization string elsewhere in the file is insufficient.
      query: |
        ((_
          (variable_declaration
            (variable_declarator name: (identifier) @decoded
              value: (call_expression
                arguments: (arguments
                  (call_expression arguments: (arguments (string) @input))))))
          (for_statement body: (expression_statement
          (call_expression
            function: (member_expression property: (property_identifier) @push)
            arguments: (arguments
              (call_expression
                function: (member_expression property: (property_identifier) @charat)
                arguments: (arguments
                  (subscript_expression object: (identifier) @indices))))))) @rebuild)
          (#eq? @decoded @indices)
          (#eq? @push "push")
          (#eq? @charat "charAt")
          (#match? @input "(\\\\u[0-9a-fA-F]{4}[^\"\r\n]{0,32}){16}"))

        ((_
          (variable_declaration
            (variable_declarator name: (identifier) @decoded
              value: (call_expression
                arguments: (arguments
                  (call_expression arguments: (arguments (string) @input))))))
