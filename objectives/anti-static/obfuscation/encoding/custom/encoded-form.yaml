defaults:
  for: [html]
  platforms: [windows, unix]
composite_rules:
  - id: percent-concealed-auto-submit-form
    desc: Percent-concealed form markup includes automatic submission
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/form-input::percent-encoded-form-submit
      - id: micro-behaviors/ui/window/insert-html::script-document-write-percent-bytes
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/ui/controls/input::html-hidden-input-tag
