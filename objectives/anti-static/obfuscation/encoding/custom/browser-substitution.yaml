defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.95
composite_rules:
  - id: substituted-document-content
    desc: Character substitution with document writing
    all:
      - id: micro-behaviors/data/decode/custom::js-character-substitution-ternary
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: objectives/anti-static/obfuscation/syntax::escaped-junk-expression-statement
  - id: rotating-substitution-document-writer
    desc: Rotating substitution conceals document output
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/custom::js-character-substitution-ternary
      - id: micro-behaviors/data/decode/custom::js-rotating-alphabet
      - id: micro-behaviors/data/decode/custom::substitution-document-write-call
  # Single-stage substitution has benign uses (a bare rotating decoder stays
  # suspicious), and ordinary cloaks (analytics noscript frames always carry
  # a collector src) are not this. The full assembly here — a re-keying
  # cipher feeding escape-packed blobs, discarded-string camouflage, and a
  # content-free noscript frame splitting crawler and victim views — exists
  # only to stage hidden scripts past static inspection.
  - id: rotating-cloaked-script-staging
    desc: Rotating cipher stages cloaked scripts
    crit: hostile
    conf: 0.96
    for: [html]
    platforms: [windows]
    all:
      - id: rotating-substitution-document-writer
      - id: objectives/anti-static/obfuscation/syntax::escaped-junk-expression-statement
      - id: micro-behaviors/ui/window/html::noscript-empty-iframe
      - id: metadata/file/encoding::dense-backslash-escape-triples
    near_bytes: 6000
  - id: htmlship-encoder-rewrites-document
    desc: HTMLSHIP encoder rewrites the document
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: metadata/document/html::htmlship-encoder-meta
      - id: rotating-substitution-document-writer

  - id: junk-camouflaged-browser-installer
    desc: Discarded escaped junk conceals installer script
    crit: hostile
    conf: 0.98
    for: [html]
    platforms: [windows]
    all:
      - id: objectives/execution/activex/browser-control::concealed-noscript-cloaked-installer
      - id: objectives/anti-static/obfuscation/syntax::escaped-junk-expression-statement
