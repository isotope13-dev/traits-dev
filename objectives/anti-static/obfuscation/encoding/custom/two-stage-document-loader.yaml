# Two-stage concealed web loaders: the page first decodes a hidden script with a
# swapped-percent unescape loader and writes it into the document, then hands a
# second opaque string to a call whose decoder arrives through that first
# decoded stage. Either stage alone is only suspicious (the loader pair) or a
# neutral handoff observation; the assembled combination exists to stage hidden
# scripts past static inspection. The rule does not establish the final
# payload's URL, that it loads successfully, or that it executes.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
composite_rules:
  - id: two-stage-concealed-document-loader
    desc: Unescape-swap loader writes document and passes opaque string to a call
    crit: hostile
    conf: 0.96
    near_bytes: 2500
    all:
      - id: micro-behaviors/data/decode/url::unescape-w-replaced-with-percent
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/data/decode/custom::long-quoteless-string-call-handoff
