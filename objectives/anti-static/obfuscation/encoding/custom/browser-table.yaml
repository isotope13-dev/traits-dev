defaults:
  for: [text, html]
  platforms: [windows, unix]
composite_rules:
  - id: table-xor-character-obfuscation
    desc: Offset-table character decoding with XOR masking
    crit: suspicious
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/custom::js-offset-character-table-lookup
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
    any:
      - id: micro-behaviors/data/decode/custom::js-numeric-xor-byte-unpack
      - id: micro-behaviors/data/decode/custom::js-fromcharcode-xor-masked-byte

  # Generalizes offset-table + XOR byte-masked character decoding across HTML
  # and standalone JS/TS, including packers that wrap String["from"+"Char"+"Code"]
  # in a helper or write the byte mask and numeric XOR in alternate order.
  - id: concealed-table-xor-character-decoder
    desc: Offset-table and XOR byte decoder rebuilds characters
    for: [javascript, typescript, html]
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140
    mbc: B0032
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/table::js-offset-table-charcode-index
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::js-numeric-key-byte-mask-xor
    any:
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: objectives/anti-static/obfuscation/string/name-split::js-fromcharcode-name-split-concat
      - id: metadata/lang/source/literal/fragment/sequence::js-string-from-char-fragments
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/package/testing/presence/manifest::test-fixtures
