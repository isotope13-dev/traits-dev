# The managed initializer reconstructs MZ/PE bytes by replacing hex digits,
# separators and zero runs. This is executable-content concealment; ordinary
# hexadecimal data and an unmodified hex-encoded MZ header are near misses.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: substituted-hex-pe-header
    desc: Substituted hex PE header and zero runs
    crit: suspicious
    conf: 0.98
    attack: T1027
    if:
      type: text
      regex: '(4D|XD)\|5A\|[0-9A-FX}]{2}\*[|0-9A-FX}*]{8,120}'
      section: .text
