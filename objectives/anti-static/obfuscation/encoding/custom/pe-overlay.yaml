defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0032

traits:
  - id: pe-low-alphabet-overlay-string
    desc: PE low alphabet overlay string
    crit: suspicious
    conf: 0.88
    if:
      type: text
      section: overlay
      regex: '[ADGINPX]{256,}'
    # Inno Setup uses repeated PADDING/ADDINGXX filler before its encrypted
    # payload.  Preserve this detector for varied custom alphabets, but do not
    # call a standard installer padding block encoded content.
    not:
      - substr: PADDINGXXPADDING
    # Chromium/Electron PEs contain long ADGINPX-class runs in packed
    # resources; require a real custom alphabet outside that runtime.
    unless:
      - id: well-known/lib/runtime/electron::electron-app-runtime
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
  - id: tiny-dll-low-alphabet-overlay
    desc: Tiny DLL low alphabet overlay
    crit: suspicious
    conf: 0.9
    size_max: 65536
    if:
      type: trait
      id: pe-low-alphabet-overlay-string
composite_rules:
  - id: tiny-dll-custom-encoded-payload
    desc: Tiny DLL with custom encoded payload
    crit: hostile
    conf: 0.96
    all:
      - id: tiny-dll-low-alphabet-overlay
      - id: metadata/binary/layout::overlay-over-30pct
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
      - id: micro-behaviors/process/create/shell/script-host::rundll32-command-reference
