# Routed from legacy dropper/execution/encoding after evidence review.
# Perl decoding and polyglot evaluation are retained; no payload handoff is claimed.
defaults:
  platforms: [netscaler, appliance, unix]
  for: [perl]
  attack: T1059

traits:
  - id: perl-base64-eval-payload
    desc: Perl Base64 decode and eval
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'decode_base64[\s\S]{0,160}eval \$decoded'

  - id: perl-decode-payload-eval
    desc: Perl decoded payload eval
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'decode_payload\(\$encoded\)[\s\S]{0,80}eval \$decoded'

  - id: perl-polyglot-marker
    desc: Perl polyglot marker
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: polyglot marker

  - id: perl-polyglot-b64-marker
    desc: Perl polyglot b64 marker
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: cHJpbnQgIiJ7ICMgcG9seWdsb3Q

  - id: perl-self-modify-backup
    desc: Perl self-modify backup
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '__FILE__[\s\S]{0,260}rename\(\$backup, \$self\)'

composite_rules:
  - id: perl-polyglot-eval-dropper
    desc: Perl polyglot decode and eval
    crit: suspicious
    conf: 0.98
    all:
      - id: perl-decode-payload-eval
      - id: perl-polyglot-b64-marker
    any:
      - id: perl-self-modify-backup
      - id: perl-polyglot-marker
      - id: perl-base64-eval-payload
