defaults:
  platforms: [windows, unix]
  for: [python, pyc]
  mbc: B0032
  attack: T1027

traits:
  - id: slash-delimited-utf8-hex
    desc: Slash-delimited UTF-8 hex payload
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)([0-9a-f]{4,8}/){32,}'
  - id: unicode-codepoint-offset-decoder
    desc: Unicode codepoint offset decoder
    crit: suspicious
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: ord\([^)]{1,40}\)\s*-\s*[1-9][0-9]{4,6}
composite_rules:
  - id: unicode-offset-alphabet-decoder
    desc: Unicode offset alphabet decoder
    crit: hostile
    conf: 0.95
    for: [python]
    all:
      - id: unicode-codepoint-offset-decoder
      - id: micro-behaviors/data/collection/array::index-increment-near-sequence-length
      - id: metadata/file/literal::lowercase-alnum-alphabet
