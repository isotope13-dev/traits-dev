# Custom-alphabet substitution loaders: the page decodes its payload by
# looking each character up in an embedded alphabet, remapping the position,
# and accumulating the result, then evaluates and writes the decoded output
# into the document. The remap leg distinguishes this from hex, Base64, and
# char-code decoders, which have their own composites.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: alphabet-remap-eval-document-loader
    desc: Alphabet-remap decoding with eval and document write
    crit: hostile
    conf: 0.96
    near_bytes: 2500
    all:
      - id: micro-behaviors/data/decode/custom::js-indexof-modulo-charat-decoder
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
    unless:
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      - id: well-known/tool/development/webinspector/
