defaults:
  crit: hostile
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
  attack: T1059.006
composite_rules:
- id: gzip-json-to-exec
  desc: In-memory compressed JSON blob feeds code execution
  conf: 0.9
  mbc: E1059
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/decompress/gzip::gzip-decompress-call
  - id: micro-behaviors/data/parse/json::json-loads-call
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
  unless:
  - id: micro-behaviors/data/parse/json::comprehension-parse
- id: xor-b64-exec-compile-loader
  desc: XOR and Base64 decoded exec-compile loader
  conf: 0.93
  for:
  - python
  - text
  near_lines: 25
  all:
  - id: micro-behaviors/process/interpreter/eval/constructed::exec-compiled-code
  - id: micro-behaviors/data/encoding/xor::python-xor-bytes-comprehension
  - id: metadata/lang/source/naming/resource::b64decode-string
  unless:
  - id: well-known/tool/detection/skill-analysis::skill-analysis-audit-engine-context
  - id: well-known/tool/offensive/payload-corpus::documented-pentest-payload-corpus
- id: jinja-compressed-base64-exec-stage
  desc: Jinja execution payload unpacks compressed Base64 code
  conf: 0.98
  for:
  - json
  mbc: B0032
  attack: T1027.009,T1059.006
  all:
  - id: objectives/execution/interpreter/eval/remote::jinja-template-code-execution
  - id: micro-behaviors/process/deploy/script-eval::json-exec-decompressed-base64-expression
  unless:
  - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
  - id: metadata/package/documentation/security-advisory::json-ghsa-poc-advisory-context
  - id: metadata/package/testing/corpus/
