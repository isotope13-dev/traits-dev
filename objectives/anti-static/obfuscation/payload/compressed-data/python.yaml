# Payload Concealment via In-Memory Compressed Blobs
# Technique: hide a malicious payload as a compressed blob assembled in
# memory (e.g. base64/hex-decoded, fetched, or otherwise built at runtime),
# gzip.decompress() it, and feed the result straight into exec/eval. The
# blob never appears as plaintext anywhere static analysis can read it.
# MBC: B0032 (Obfuscated Files or Information)
# ATT&CK: T1027.009 (Embedded Payloads)
#
# Deliberately keyed on gzip.decompress(), not gzip.open(). gzip.open()
# reads a *named file* -- typically a bundled data asset that ships
# alongside the code as its own archive member (visible to any unzip/tar
# listing and independently scannable), not a payload concealed inside the
# scanned file itself. Packages that ship a compressed dataset and read it
# by path for a legitimate data-driven purpose (test corpora, benchmark
# fixtures, plugin manifests) match gzip.open()+json.loads()+exec() just as
# well as a staged-payload dropper does, so keying on the file-open form
# false-positived on such packages. gzip.decompress() takes bytes already
# in memory, which is the actual concealment step: something built the blob
# without ever writing readable text to disk or to the file being scanned.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
  # Compression and JSON parsing are neutral capabilities. Obfuscation intent
  # requires the decoded data to feed dynamic execution in the same file.
  - id: gzip-json-to-exec
    desc: In-memory compressed JSON blob feeds code execution
    crit: hostile
    conf: 0.90
    mbc: "E1059"
    attack: "T1059.006"
    # Require real dynamic execution (exec/eval), not bare "compile" word
    # matches in user-facing strings, and keep decompress+JSON near the sink.
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/compress/library::gzip-decompress-call
      - id: micro-behaviors/data/serialize/json::json-loads-call
    any:
      - id: micro-behaviors/process/interpreter/python::exec-builtin
      - id: micro-behaviors/process/interpreter/python::eval-builtin
    unless:
      # A JSON-Lines dataset (many independently-schemad records, e.g. a
      # bundled training/eval corpus) is a different shape than a single
      # smuggled payload: the decoded blob is fanned out into named fields
      # (task/reference/spec) before any one of them reaches exec/eval,
      # rather than the decoded bytes being executed directly.
      - id: micro-behaviors/data/serialize/jsonl::comprehension-parse
