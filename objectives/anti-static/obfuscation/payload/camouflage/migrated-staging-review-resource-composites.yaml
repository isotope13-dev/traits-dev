---
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: resource-api-camouflage-clues
  desc: Resource API and camouflage clues
  conf: 0.92
  unless:
  - id: well-known/app/browser/internet-explorer/
  all:
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-w
  - id: micro-behaviors/data/embedded/payload/resource::load-resource
  - id: micro-behaviors/data/embedded/payload/resource::lock-resource
  - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
  any:
  - id: objectives/anti-static/obfuscation/payload/camouflage::text-section-payload-camouflage
  - id: objectives/anti-static/obfuscation/payload/camouflage::dictionary-padding-entropy-camouflage
  - id: metadata/binary/symbols/count::recovered-function-count-under-10
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
