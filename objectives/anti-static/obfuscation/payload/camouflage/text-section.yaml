defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032
traits:
  - id: code-heavy-loader-ratio
    desc: Code to data ratio favors text
    crit: notable
    conf: 0.84
    size_min: 1048576
    if:
      type: metrics
      field: binary.code_to_data_ratio
      min: 50
  - id: multilingual-padding-corpus
    desc: Multilingual dictionary padding corpus
    crit: notable
    conf: 0.96
    size_min: 1048576
    if:
      type: text
      section: .rsrc
      substr: macroeconomic désynchronise
  - id: death-star-padding-quote
    desc: Death Star quote in PE data
    crit: notable
    conf: 0.99
    size_min: 1048576
    if:
      type: text
      section: .rdata
      exact: "The Galactic Empire is nearing completion of the Death Star, a space station with the power to destroy entire planets."
  - id: sandwich-padding-quote
    desc: Sandwich taunt in PE data
    crit: notable
    conf: 0.98
    size_min: 1048576
    if:
      type: text
      section: .rdata
      exact: "Make me a sandwich."
  - id: pants-padding-quote
    desc: Lost pants joke in PE data
    crit: notable
    conf: 0.98
    size_min: 1048576
    if:
      type: text
      section: .rdata
      exact: "Where are my pants?"
composite_rules:
  - id: text-section-payload-camouflage
    desc: Oversized text section hides payload
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/section/ratio::large-pe-largest-section-over-98-percent
      - id: code-heavy-loader-ratio
      - id: metadata/binary/symbols/count::recovered-function-count-under-10
    any:
      - id: metadata/binary/symbols/count::many-imports
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-w
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: metadata/binary/framework/
  - id: image-metadata-text-camouflage
    desc: Image metadata camouflages PE text
    crit: hostile
    conf: 0.96
    ref: sha256:b38ed78c2328a41c8a08e3b6d508edff3ca75b8101cb517b0891be47a14a48e3
    all:
      - id: micro-behaviors/data/embedded/media::photoshop-xmp-conversion-corpus
      - id: metadata/binary/header/malformed::pe-dos-stub-modified
    any:
      - id: metadata/binary/section/ratio::pe-section-overflow-present
      - id: metadata/binary/header/malformed::pe-misaligned-section
    unless:
      - id: metadata/binary/framework/
  - id: dictionary-padding-entropy-camouflage
    desc: Low entropy resource padding camouflage
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/entropy::low-entropy-pe-resource-section
      - id: metadata/binary/section/prose::sentence-strings-over-half
      - id: metadata/binary/symbols/count::recovered-function-count-under-10
    any:
      - id: metadata/binary/section/ratio::large-pe-largest-section-over-98-percent
      - id: multilingual-padding-corpus
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: metadata/binary/installer/family/
    unless:
      - id: metadata/binary/framework/
  - id: quote-loader-marker
    desc: Quote padding alongside loader signals
    crit: component
    any:
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
      - id: metadata/binary/symbols/fake-windows::sideload-export-masquerade-cluster-lite
      - id: objectives/evasion/masquerade/dll/sideload::gui-apis-with-masquerading-exports
  - id: decoy-quote-loader-camouflage
    desc: Decoy quote corpus hides sideload loader
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/section/prose::sentence-strings-over-half
      - id: quote-loader-marker
    any:
      - id: death-star-padding-quote
      - id: sandwich-padding-quote
      - id: pants-padding-quote
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/framework/
  - id: quote-padded-matryoshka-sideload
    desc: Quote-padded sideload wrapper hides nested PEs
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/prose::sentence-strings-over-half
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc-multiple
      - id: metadata/binary/symbols/fake-windows::sideload-export-masquerade-cluster-lite
    any:
      - id: death-star-padding-quote
      - id: sandwich-padding-quote
      - id: pants-padding-quote
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/framework/
