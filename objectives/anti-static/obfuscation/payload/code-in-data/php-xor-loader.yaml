defaults:
  platforms: [unix, windows]
  for: [php]
  conf: 0.95

composite_rules:
  - id: php-xor-source-reconstruction
    desc: XOR decoder accompanies PHP source file reconstruction
    crit: suspicious
    scope: file
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-decode-loop
      - id: micro-behaviors/fs/read/file/full::file-get-contents
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/data/string/search::php-source-header-search

  - id: php-xor-reconstructed-source-include
    desc: Source reconstruction accompanies variable-path inclusion
    crit: suspicious
    scope: file
    all:
      - id: php-xor-source-reconstruction
      - id: micro-behaviors/process/lifecycle/auto-exec::php-variable-file-load
