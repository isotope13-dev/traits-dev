defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: browser-builds-vbscript-native-payload-dropper
    desc: Browser constructs VBScript around an encoded native dropper
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.005,T1189
    all:
      - id: micro-behaviors/ui/window/insert-html::writes-vbscript-decimal-pe-block
      - id: objectives/command-and-control/dropper/staging/runtime::script-decimal-pe-stream-drop
