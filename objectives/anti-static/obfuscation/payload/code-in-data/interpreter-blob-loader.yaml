# Code-as-data unpackers: a host file that decompresses an opaque "data" blob and
# materializes live code from it — the SiteGuarding WordPress shape, where a
# small PHP/data stub gzuncompresses a `.dat`/`.key` companion into a backdoor.
# cleave extracts an embedded interpreter body and parses its AST, so the inner
# decompress / file-read / blob-filename / decode signals surface on the host.
#
# Intent composites reference neutral decompression and evaluation capabilities.
# Decompression followed by eval is a capability; the disguise or import-time
# concealment in each composite supplies its objective context.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts]
  conf: 0.9

composite_rules:
  # === HOSTILE: compressed code masqueraded as a data file ==================
  # An embedded interpreter (surfaced only because it is hidden in a non-python
  # host) decompresses an opaque data-extension blob and decodes the bytes into
  # source. The host-type gate is the disguise discriminator: these atoms on a
  # PHP/JS/etc. file mean a foreign interpreter program is concealed inside it.
  # A standalone .py doing the same is benign and excluded by the gate.
  - id: compressed-code-masqueraded-as-data
    desc: Hidden interpreter unpacks code from data blob
    crit: hostile
    conf: 0.96
    attack: T1027.009
    for: [php, javascript, ruby, perl, lua, powershell]
    all:
      - id: micro-behaviors/data/compression::script-decompression-operation-evidence
      - id: micro-behaviors/data/compression::decompression-output-text-decode
      - id: micro-behaviors/fs/file/extension::data-blob-extension

  # === SUSPICIOUS: script body shipped as an embedded compressed blob ========
  # The executed bytes are decompressed from data that was itself text-encoded
  # (base64/hex) in the same file — the packed-loader shape, where a script's
  # real body is a literal blob rather than readable source. Host-agnostic, so it
  # catches the same trick in python/ruby/node/perl/lua.
  #
  # NOT hostile: script self-packers (`pyminifier --gzip` and the many
  # copy-pasted zlib+base64 wrappers) emit this exact form for ordinary programs,
  # so "no legitimate use" does not hold, and the two-leg form measured only 1.7
  # precision against the >= 3.5 hostile bar. cleave decodes the blob and analyses
  # the unpacked source as its own layer, so a genuinely malicious payload is
  # still convicted by its own behaviour rather than by the wrapper.
  #
  # (The earlier `all: [exec-of-decompressed, script-decompress-call]` form was
  # also a tautology: a decompress call is what the first leg already matches.)
  - id: decompressed-code-executed
    desc: Executes code unpacked from an embedded compressed blob
    crit: suspicious
    conf: 0.93
    attack: T1027,T1140
    all:
      - id: micro-behaviors/process/deploy/script-eval::decompressed-script-evaluation
      - id: micro-behaviors/data/decode/base64::base64-decoding
    unless:
      # A tool that compresses source code (such as a code packager, runtime UI
      # injector, or installer) generates stagers rather than executing an
      # embedded compressed payload itself.
      - id: micro-behaviors/data/compress::zlib-compress-symbol
      - id: micro-behaviors/data/compress::gzip-compress-call
      - id: embedded-library-unpacking-context

  # === SUSPICIOUS: import-time compressed-code stub ==========================
  # The compressed-code exec sits at module scope: importing the module runs
  # the concealed body before any caller-supplied context exists. pyminifier
  # --gzip and the copy-pasted zlib+base64 wrappers emit this shape for
  # ordinary standalone scripts, so the module-level fact stays suspicious;
  # wheel metadata alone adds no hostile behavior. A hostile delivered payload
  # requires evidence beyond this wrapping and distribution context.
  - id: import-time-compressed-code-stub
    desc: Module import executes compressed concealed code
    crit: suspicious
    conf: 0.94
    for: [python]
    attack: T1027,T1059.006
    all:
      - id: micro-behaviors/process/deploy/script-eval::decompressed-script-evaluation
      - id: micro-behaviors/process/interpreter/eval/direct::module-scope-exec-builtin
    unless:
      # The same file compresses the source it quotes. That is a generator
      # writing a pod or subprocess command, not an import of a hidden body.
      - id: micro-behaviors/data/compress::zlib-compress-symbol
      - id: embedded-library-unpacking-context

  - id: embedded-library-unpacking-context
    desc: Decompresses and executes a recognized well-known library
    crit: exception
    conf: 0.95
    any:
      - id: well-known/lib/crypto/pydes::pydes-library
      - id: well-known/lib/crypto/pydes::pydes-consumer

  # === SUSPICIOUS: opaque-blob decompressor stub (host-agnostic) =============
  # A whole-file one-liner that decompresses an opaque data-extension blob and
  # decodes it to text. Inline like this it is the dropper-stub shape — but
  # decompress+decode of a *.dat is dual-use, so this stays suspicious, not
  # hostile. The one-liner gate separates the stub from a larger program that
  # legitimately decompresses a data file.
  - id: opaque-blob-decompress-stub
    desc: One-line opaque-blob decompressor stub
    crit: suspicious
    conf: 0.85
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/compression::script-decompression-operation-evidence
      - id: micro-behaviors/data/compression::decompression-output-text-decode
      - id: micro-behaviors/fs/file/extension::data-blob-extension
      - id: metadata/file/line::file-one-liner
