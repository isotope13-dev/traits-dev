defaults:
  platforms: [windows]
  for: [pe]
  crit: suspicious
  conf: 0.85

composite_rules:
  # An unsigned PE whose entry point is both writable and executable, resolves
  # APIs dynamically, and actively detects debuggers is a compact loader shape.
  # Keep the decision independent of a product or malware-family name.
  - id: unsigned-rwx-api-resolver-loader
    desc: Unsigned RWX entrypoint with dynamic API resolution
    crit: suspicious
    conf: 0.96
    attack: T1027,T1620,T1622
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/hardening/memory::wx-section
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: ep-in-rwx-section
    desc: Entry point in a writable RWX section
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/hardening/memory::wx-section
    unless:
      - id: well-known/dual-use/access-control/hasp-license-manager/
      # HWiNFO's protected client library enters through its unpack stub in a
      # RWX section by design; the verified vendor identity marks it benign.
      - id: well-known/app/utility/hwinfo::hwinfo-component-context
      # Old RubyInstaller/MinGW CRuby 1.x extension DLLs are routinely linked
      # with the entry point inside a writable executable .text section; the
      # runtime import identifies that toolchain output, not a packer stub.
      - id: well-known/lib/runtime/scripted/cruby::ruby-1x-native-extension-runtime
      # Every WDK kernel driver looks like this. The linker puts DriverEntry in
      # INIT, a discardable section it marks read/write/execute so the kernel
      # can free it after initialisation. The entry point sitting in a writable
      # executable section is the documented layout there, not a stub that
      # unpacks itself, so it separates nothing. `pe-entry-in-writable-section`
      # already downgrades on this same driver marker.
      - id: metadata/binary/resource/identity::kernel-driver-init
      # Parser regression corpora intentionally include minimal PE fixtures
      # whose only section is RWX; the embedded demo explains its real purpose.
      - id: micro-behaviors/ui/terminal::pe-manual-import-demo-message
      # An entry point in an RWX section is the shape of *being packed*, which
      # is why this rule exists for packers nothing identifies. Once a named
      # packer has been recognized the fact is already reported, by name, at
      # the criticality that packer deserves -- ARJ's Petite stub, an Obsidium
      # -protected keygen DLL, a UPX-packed bfi.exe. Restating it as an
      # anti-static finding adds an alarm, not information.
      - id: objectives/anti-static/pack/detect/
      # SharpOD 0.6d is a VMProtect-packed x64dbg plugin whose product resource
      # identifies the legitimate anti-anti-debugging tool.
      - id: well-known/tool/reverse-engineering/sharpod::sharpod-plugin-string
    downgrade:
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
