# Native PE staging geometry paired with opaque startup/dispatch.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: native-tls-rw-staging-profile
    desc: Native PE RW staging with TLS startup
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64-register-order
      - id: micro-behaviors/process/threading/create::threadpool-work-lifecycle
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: metadata/binary/metrics/structural::pe-near-total-code-data
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
