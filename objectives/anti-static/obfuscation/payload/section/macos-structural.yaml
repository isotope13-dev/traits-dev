defaults:
  crit: suspicious
  for:
    - macho
  platforms:
    - macos
    - ios
composite_rules:
  - id: obfuscated-string-pattern
    desc: Obfuscated string storage pattern
    conf: 0.9
    all:
      - id: metadata/binary/section/prose::minimal-string-count
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::many-high-entropy-strings
  - id: encoded-payload-pattern
    desc: Encoded payload storage pattern
    conf: 0.9
    all:
      - id: metadata/binary/section/prose::extreme-minimal-strings
      - id: metadata/binary/section/ratio::data-dominates-cstring
  - id: structural-anomaly-pattern
    desc: Multiple structural anomalies
    conf: 0.95
    all:
      - id: metadata/binary/section/ratio::extreme-text-to-string-ratio
      - id: metadata/binary/section/ratio::data-dominates-cstring
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::many-high-entropy-strings
