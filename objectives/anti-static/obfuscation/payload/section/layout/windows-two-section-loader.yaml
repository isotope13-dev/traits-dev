defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032
composite_rules:
- id: importless-api-hash-pe-loader
  desc: Importless API-hash PE loader with executable payload staging
  crit: hostile
  conf: 0.98
  attack: T1027,T1620
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: micro-behaviors/os/api-resolution/hash-based::multiply-shift-xor-export-walk
  - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
  - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
