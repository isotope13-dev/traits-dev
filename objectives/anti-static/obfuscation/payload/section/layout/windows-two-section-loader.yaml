defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032
traits:
- id: giant-writable-text-section
  desc: Giant writable text section payload
  crit: notable
  conf: 0.96
  size_min: 1048576
  if:
    type: section
    exact: ".text"
    writable: true
    length_min: 1048576
    entropy_min: 6.2
- id: tiny-null-rsrc-section
  desc: Tiny null resource stub section
  crit: notable
  conf: 0.92
  size_min: 1048576
  if:
    type: section
    exact: ".rsrc"
    length_max: 1024
    entropy_max: 0.05
- id: one-function-large-pe
  desc: Large PE with one function
  crit: notable
  conf: 0.94
  size_min: 1048576
  if:
    type: metrics
    field: functions.count
    min: 1
    max: 1
composite_rules:
- id: importless-api-hash-pe-loader
  desc: Importless API-hash PE loader with executable payload staging
  crit: hostile
  conf: 0.98
  attack: T1027,T1620
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-signature-check
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
- id: importless-rwx-two-section-loader
  desc: Importless PE with a giant encrypted RWX text loader
  crit: hostile
  conf: 0.98
  attack: T1027,T1620
  all:
  - id: objectives/anti-static/obfuscation/payload/section/layout::giant-writable-text-section
  - id: metadata/binary/section/header::large-pe-two-sections
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/section/permission::large-rwx-text-section
  - id: metadata/binary/section/permission::executable-rsrc-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
- id: giant-writable-text-loader
  desc: Two section packed loader with writable text
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/payload/section/layout::giant-writable-text-section
  - id: metadata/binary/section/header::large-pe-two-sections
  - id: objectives/anti-static/obfuscation/payload/section/layout::tiny-null-rsrc-section
  # `symbols/compat::zero-import-count` is an intentionally unreachable
  # migration placeholder. Use the maintained metric-backed import atom so
  # importless polymorphic loaders can satisfy this rule.
  - id: metadata/binary/symbols/count::no-imports
  any:
  - id: objectives/evasion/indicator-removal/timestamps::timestamp-anomaly
  - id: objectives/anti-static/obfuscation/payload/section/layout::one-function-large-pe
  - id: metadata/binary/section/ratio::large-pe-largest-section-over-99-percent
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
