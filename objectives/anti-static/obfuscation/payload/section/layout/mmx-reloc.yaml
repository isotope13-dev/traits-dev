defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
composite_rules:
- id: mmx-entry-reloc-polymorphic-decoder
  desc: MMX entry trampoline into a junk-obfuscated RWX relocation decoder
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/control-flow/return::x86-call-pop-mmx-pointer-handoff
  - id: micro-behaviors/data/control-flow/branch::x86-reloc-junk-backward-branch
  - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
  - id: metadata/binary/section/header::pe-entry-in-writable-section
- id: entry-getpc-encrypted-resource-decryptor
  desc: Entry GetPC stub with encrypted resource body
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/anti-static/obfuscation/control-flow/getpc::x86-entry-call-pop-getpc
  - id: metadata/binary/section/permission::executable-rsrc-section
  - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
  unless:
  - id: well-known/dual-use/packaging/enigma-protector::v1-loader-stub
