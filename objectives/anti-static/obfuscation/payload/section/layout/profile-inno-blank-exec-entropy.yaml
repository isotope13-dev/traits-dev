defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: inno-blank-exec-entropy-clues
    attack: T1027
    desc: Inno blank executable section and entropy clues
    crit: suspicious
    conf: 0.98
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/section/layout::blank-named-high-entropy-exec-section
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
