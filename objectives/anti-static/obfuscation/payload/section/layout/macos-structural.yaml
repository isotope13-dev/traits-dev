defaults:
  crit: suspicious
  for:
    - macho
  platforms:
    - macos
    - ios
composite_rules:
  - id: objectives/anti-static/obfuscation/payload/section/layout::encoded-payload-pattern
    desc: Encoded payload storage pattern
    conf: 0.9
    all:
      - id: metadata/binary/section/prose::extreme-minimal-strings
      - id: metadata/binary/section/ratio::data-dominates-cstring
  - id: objectives/anti-static/obfuscation/payload/section/layout::structural-anomaly-pattern
    desc: Multiple structural anomalies
    conf: 0.95
    all:
      - id: metadata/binary/section/ratio::extreme-text-to-string-ratio
      - id: metadata/binary/section/ratio::data-dominates-cstring
    any:
      - id: "metadata/file/profile/string-population::high-entropy-strings-20"
