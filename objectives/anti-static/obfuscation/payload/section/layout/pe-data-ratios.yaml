defaults:
  platforms: [windows]
  for: [pe]
traits:
composite_rules:
  - id: objectives/anti-static/obfuscation/payload/section/layout::pe-packed-dropper-anomaly
    desc: "PE extreme data-to-code ratio with unusual alignment"
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/code/ratio::pe-code-to-data-at-most-0-1
      - id: metadata/binary/layout/size::pe-file-alignment-under-512
