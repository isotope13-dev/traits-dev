defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: objectives/anti-static/obfuscation/payload/section/layout::unusual-alignment-pe
    desc: "Unusual PE section alignment"
    crit: suspicious
    conf: 0.9
    if:
      type: metrics
      field: pe.file_alignment
      min: 1
      max: 511
    unless:
      - id: metadata/binary/resource/
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/app/media/graphics/
    downgrade:
      any:
        - id: metadata/binary/framework::dotnet-metadata
composite_rules:
  - id: objectives/anti-static/obfuscation/payload/section/layout::pe-packed-dropper-anomaly
    desc: "PE extreme data-to-code ratio with unusual alignment"
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/code/ratio::pe-code-to-data-at-most-0-1
      - id: objectives/anti-static/obfuscation/payload/section/layout::unusual-alignment-pe
