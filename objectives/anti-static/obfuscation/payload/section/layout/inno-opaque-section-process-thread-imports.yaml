defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: inno-opaque-section-process-thread-imports
    desc: Inno opaque section with process and thread API imports
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::inno-blank-exec-entropy-clues
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/info/thread::suspend-thread-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
