# Mach-O Data-to-Code Ratio Objective Composites
defaults:
  platforms: [macos]
  for: [macho]
  mbc: "B0032"
composite_rules:
  - id: objectives/anti-static/obfuscation/payload/section/layout::macho-high-entropy-data-dropper
    desc: Mach-O data-to-code anomaly with shell API
    crit: suspicious
    conf: 0.95
    # Ratio anomaly becomes objective-level only with execution capability.
    all:
      - id: metadata/binary/code/ratio::macho-extreme-data-to-code-ratio
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
    unless:
      - id: metadata/signature/verified/platform::apple