# Evidence-based placement; see docs/taxonomy-audit/merge-20261026/resolution.json.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-concealed-reloc-with-api-references
    desc: Unsigned concealed reloc with API references
    crit: suspicious
    conf: 0.97
    attack: T1027.002
    size_min: 131072
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::encrypted-reloc-payload-carrier
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file-ex
    unless:
      - id: metadata/installer/product/

  - id: unsigned-concealed-reloc-hook-carrier
    desc: Concealed reloc payload with inline hooks
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1055.009
    size_min: 131072
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::encrypted-reloc-payload-carrier
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/inject/runtime/inline-hook::x64-movabs-rax-jump-stub-write
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-quarter-round-rotations-x86-64
      - id: micro-behaviors/os/wmi/event::native-command-line-template-property
    unless:
      - id: metadata/installer/product/
