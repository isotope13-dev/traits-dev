defaults:
  for: [binaries]
  platforms:
    - windows
    - linux
    - macos
  attack: T1027
traits:
  - id: objectives/anti-static/obfuscation/payload/section/layout::tiny-cstring-absolute-macos
    desc: Abnormally small __cstring section
    crit: notable
    conf: 0.85
    for:
      - macho
    size_min: 100000
    if:
      type: section
      exact: '__TEXT.__cstring'
      length_max: 100
  - id: objectives/anti-static/obfuscation/payload/section/layout::freebsd-modmetadata-section
    desc: FreeBSD module metadata section
    crit: notable
    conf: 0.95
    for:
      - elf
    if:
      type: section
      exact: set_modmetadata_set
  - id: objectives/anti-static/obfuscation/payload/section/layout::freebsd-sysctl-section
    desc: FreeBSD sysctl registration section
    crit: notable
    conf: 0.95
    for:
      - elf
    if:
      type: section
      exact: set_sysctl_set
composite_rules:
  - id: objectives/anti-static/obfuscation/payload/section/layout::freebsd-relocatable-kmod-layout
    desc: FreeBSD relocatable kernel-module layout
    crit: component
    conf: 0.95
    for:
      - elf
    any:
      - id: objectives/anti-static/obfuscation/payload/section/layout::freebsd-modmetadata-section
      - id: objectives/anti-static/obfuscation/payload/section/layout::freebsd-sysctl-section
  - id: objectives/anti-static/obfuscation/payload/section/layout::obfuscated-data-payload-macos
    desc: Obfuscated payload in data section
    crit: suspicious
    conf: 0.9
    for:
      - macho
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::tiny-cstring-absolute-macos
      - id: metadata/binary/section/size::large-data-absolute-macos
    any:
      - id: objectives/anti-static/obfuscation/payload/string-sparse::high-entropy-data-macos
      - id: micro-behaviors/process/create/shell/
  - id: objectives/anti-static/obfuscation/payload/section/layout::obfuscated-data-payload-elf
    desc: Obfuscated payload in data section
    crit: suspicious
    conf: 0.9
    for:
      - elf
    # Tiny .rodata beside a large .data is also a plaintext string table
    # (a challenge binary's decoys). Encrypted payload bytes are high entropy.
    all:
      - id: metadata/binary/section/size::elf-rodata-at-most-100-bytes
      - id: metadata/binary/section/size::large-data-absolute-elf
      - id: metadata/binary/layout/entropy::high-entropy-data
    unless:
      # Emacs native-compiled Lisp is an ELF whose compiled objects live in
      # .data with almost no C string data -- large .data beside tiny .rodata
      # is what the compiler emits, and a stock Emacs ships hundreds of them.
      - id: metadata/lang/compiled::emacs-native-lisp-module
