defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0032
traits:
- id: x86-position-independent-dword-decoder-in-reloc
  desc: x86 position-independent dword decoder in .reloc
  crit: suspicious
  conf: 0.98
  attack: T1140
  arch: [x86]
  if:
    type: hex
    section: .reloc
    # call/pop establishes a position-independent base, then a register
    # seeded from that base is passed to a dword transform loop.  The
    # immediates are wildcarded so this describes the decoder shape, not one
    # sample's relocation delta or key.
    pattern: '60 9C E8 00 00 00 00 5D 81 ED ?? ?? ?? ?? 8D B5 ?? ?? ?? ?? 56 68 ?? ?? ?? ?? FF B5 ?? ?? ?? ?? E8 ?? ?? ?? ?? EB ??'
- id: x86-unrolled-dword-decoder-in-reloc
  desc: x86 call-pop dword decoder stub in .reloc
  crit: suspicious
  conf: 0.97
  attack: T1027,T1140
  arch: [x86]
  if:
    type: hex
    section: .reloc
    # A position-independent call/pop base followed by a zeroed register and
    # repeated dword transforms.  Wildcards cover relocation deltas and keys;
    # the opcode shape is the reusable loader signal.
    pattern: '50 51 52 53 55 56 57 E8 00 00 00 00 5B 81 EB ?? ?? ?? ?? BF 00 00 00 00 53 81 83 ?? ?? ?? ?? ?? ?? ?? ?? 81 B3 ?? ?? ?? ?? ?? ?? ?? ?? F7 93'
- id: x64-unrolled-dword-decoder-stub
  desc: x64 saved-register dword decoder stub
  crit: suspicious
  conf: 0.98
  attack: T1027,T1140
  arch: [x86-64]
  if:
    type: hex
    section: .reloc
    # The long register-save prologue, RIP-relative state setup, and repeated
    # 32-bit memory transforms describe the decoder shape without baking in
    # relocation deltas or transform constants. Relocation placement is
    # established by the consuming composites' section geometry.
    pattern: '50 51 52 53 55 56 57 41 50 41 51 41 52 41 53 41 54 41 55 41 56 41 57 55 48 8B EC 48 83 EC 20 48 83 E4 F0 48 8D 0D ?? ?? ?? ?? 6A 00 5B 51 81 71 ?? ?? ?? ?? ?? 81 81 ?? ?? ?? ?? ?? ?? ?? ??'
- id: x64-rax-unrolled-dword-decoder-stub
  desc: x64 saved-register RAX dword decoder stub
  crit: suspicious
  conf: 0.99
  attack: T1027,T1140
  arch: [x86-64]
  if:
    type: hex
    section: .reloc
    # Preserve every general-purpose register, align a private stack, load a
    # RIP-relative payload into RAX, and begin an unrolled dword transform.
    # Displacements and arithmetic keys vary between infected hosts.
    pattern: '50 51 52 53 55 56 57 41 50 41 51 41 52 41 53 41 54 41 55 41 56 41 57 55 48 8B EC 48 83 EC 20 48 83 E4 F0 48 8D 05 ?? ?? ?? ?? 48 BF 00 00 00 00 00 00 00 00 50 81 B0 ?? ?? ?? ?? ?? ?? ?? ?? 81 B0'
- id: x64-rbx-unrolled-dword-decoder-stub
  desc: x64 saved-register RBX dword decoder stub
  crit: suspicious
  conf: 0.99
  attack: T1027,T1140
  arch: [x86-64]
  if:
    type: hex
    section: .reloc
    # Preserve every general-purpose register, align a private stack, load a
    # RIP-relative payload into RBX, and apply keyed dword transforms. The
    # displacement, operation order, and arithmetic keys vary per host.
    pattern: '50 51 52 53 55 56 57 41 50 41 51 41 52 41 53 41 54 41 55 41 56 41 57 55 48 8B EC 48 83 EC 20 48 83 E4 F0 48 8D 1D ?? ?? ?? ?? 48 BF 00 00 00 00 00 00 00 00 53 81 83 ?? ?? ?? ?? ?? ?? ?? ?? 81 B3 ?? ?? ?? ?? ?? ?? ?? ?? F7 93'

composite_rules:
- id: reloc-entrypoint-self-decoder
  desc: PE entry point self-decodes code from writable .reloc
  crit: hostile
  conf: 0.99
  attack: T1027,T1140
  all:
  - id: metadata/binary/anomaly/section-header::pe-entry-in-reloc-section
  - id: metadata/binary/section/metrics::pe-entry-in-writable-section
  - id: x86-position-independent-dword-decoder-in-reloc
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/reverse-engineering/
- id: encrypted-reloc-payload-carrier
  desc: Encrypted payload hidden in .reloc section
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/section/metrics::reloc-payload-geometry
  any:
  - id: metadata/package/versioning::version-resource-metadata
  - id: metadata/binary/section/metrics::high-import-count-pe
  - id: metadata/binary/section/metrics::elevated-text-entropy-section
  downgrade:
    any:
    - id: metadata/binary/installer/family/
- id: importless-writable-code-reloc-payload
  desc: Importless PE conceals a high-entropy payload in .reloc beside writable code
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/section/metrics::high-entropy-reloc-section
  - id: metadata/binary/metrics/structural::no-imports
  - id: metadata/binary/section/metrics::writable-text-section
  - id: metadata/binary/section/metrics::high-entropy-exec-section
  - id: metadata/binary/section/metrics::pe-entry-in-writable-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
