defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0032
traits:
- id: x86-position-independent-dword-decoder-in-reloc
  desc: x86 position-independent dword decoder in .reloc
  crit: suspicious
  conf: 0.98
  attack: T1140
  arch: [x86]
  if:
    type: hex
    section: .reloc
    # call/pop establishes a position-independent base, then a register
    # seeded from that base is passed to a dword transform loop.  The
    # immediates are wildcarded so this describes the decoder shape, not one
    # sample's relocation delta or key.
    pattern: '60 9C E8 00 00 00 00 5D 81 ED ?? ?? ?? ?? 8D B5 ?? ?? ?? ?? 56 68 ?? ?? ?? ?? FF B5 ?? ?? ?? ?? E8 ?? ?? ?? ?? EB ??'

composite_rules:
- id: reloc-entrypoint-self-decoder
  desc: PE entry point self-decodes code from writable .reloc
  crit: hostile
  conf: 0.99
  attack: T1027,T1140
  all:
  - id: metadata/binary/anomaly/section-header::pe-entry-in-reloc-section
  - id: metadata/binary/section/metrics::pe-entry-in-writable-section
  - id: x86-position-independent-dword-decoder-in-reloc
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/reverse-engineering/
- id: encrypted-reloc-payload-carrier
  desc: Encrypted payload hidden in .reloc section
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/section/metrics::reloc-payload-geometry
  any:
  - id: metadata/package/versioning::version-resource-metadata
  - id: metadata/binary/section/metrics::high-import-count-pe
  - id: metadata/binary/section/metrics::elevated-text-entropy-section
  downgrade:
    any:
    - id: metadata/binary/installer/family/
- id: importless-writable-code-reloc-payload
  desc: Importless PE conceals a high-entropy payload in .reloc beside writable code
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/section/metrics::high-entropy-reloc-section
  - id: metadata/binary/metrics/structural::no-imports
  - id: metadata/binary/section/metrics::writable-text-section
  - id: metadata/binary/section/metrics::high-entropy-exec-section
  - id: metadata/binary/section/metrics::pe-entry-in-writable-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
