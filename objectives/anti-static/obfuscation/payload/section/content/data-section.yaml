defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  attack: T1027
  mbc: B0032
traits:
  - id: data-section-dominant
    desc: Data section significantly larger than code
    crit: component
    conf: 0.8
    size_min: 32768
    if:
      id: metadata/binary/section/ratio::data-section-1p5x-code
    unless:
      - type: basename
        regex: \.dll$
      - id: well-known/tool/sysadmin/par-launcher::par-env-vars
      - id: metadata/signature/verified/platform::apple
      - type: metrics
        field: exports.count
        min: 50
      - type: metrics
        field: binary.data_entropy
        max: 5.4
      - type: metrics
        field: functions.count
        min: 500
  - id: largest-section-resource-only-dll
    desc: Largest-section resource-only DLL
    crit: component
    conf: 0.85
    platforms:
      - windows
    for:
      - pe
    if:
      type: trait
      id: metadata/binary/resource/identity::resource-only-dll
  - id: largest-section-versioned-export-library
    desc: Largest-section versioned export library
    crit: component
    conf: 0.85
    platforms:
      - windows
    for:
      - pe
    if:
      type: trait
      id: versioned-export-heavy-library
  - id: largest-section-nativeaot-runtime
    desc: Largest-section NativeAOT runtime
    crit: component
    conf: 0.85
    platforms:
      - windows
    for:
      - pe
    if:
      type: trait
      id: metadata/lang/compiler/aot::nativeaot-large-runtime
  - id: encrypted-payload-section-cond-0--inline-29177
    desc: Derived data-section geometry component
    crit: component
    conf: 0.9
    size_min: 8192
    if:
      type: trait
      id: metadata/binary/section/entropy::very-high-entropy-data-section
  - id: encrypted-loader-data-geometry-cond-1--inline-29197
    desc: Derived data-section geometry component
    crit: component
    conf: 0.96
    platforms:
      - windows
    for:
      - pe
    if:
      type: trait
      id: micro-behaviors/crypto/provider/cryptoapi::capi-key-buffer-api-profile
  - id: packed-anti-analysis-data-loader-cond-0--inline-29201
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: metadata/binary/section/ratio::large-four-section-pe
  - id: packed-anti-analysis-data-loader-cond-1--inline-29202
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: metadata/binary/section/ratio::dominant-section
  - id: packed-anti-analysis-data-loader-cond-2--inline-29203
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: metadata/binary/layout/entropy::high-entropy-data
  - id: packed-anti-analysis-data-loader-cond-3--inline-29204
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: metadata/binary/code/ratio::pe-code-to-data-at-most-0-2
  - id: packed-anti-analysis-data-loader-cond-4--inline-29205
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  - id: packed-anti-analysis-data-loader-cond-5--inline-29206
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: micro-behaviors/os/exception/error-handling::exception-filter-pair-imports
  - id: packed-anti-analysis-data-loader-cond-0--inline-29208
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: metadata/signature/verified/platform::microsoft
  - id: packed-anti-analysis-data-loader-cond-1--inline-29209
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: metadata/lang/compiler/aot::nativeaot-large-runtime
  - id: packed-anti-analysis-data-loader-cond-2--inline-29210
    desc: Derived data-section geometry component
    crit: component
    conf: 0.97
    platforms:
      - windows
    size_min: 1048576
    for:
      - pe
    if:
      type: trait
      id: metadata/binary/resource/identity::resource-only-dll
composite_rules:
  - id: unsigned-sparse-rdata-loader-profile
  # A future-proof loader profile: an unsigned PE with a very large read-only
  # data section, sparse imports, and runtime resolution/memory staging. Large
  # type-library and COM proxy DLLs can share the geometry, so this remains
  # suspicious; family rules add the hostile interpretation when proxy and
  # campaign markers are present.
    desc: Unsigned sparse-import rdata loader profile
    crit: suspicious
    conf: 0.94
    for: [pe, dll]
    attack: "T1027.009,T1574.002"
    all:
      - id: metadata/binary/section/ratio::oversized-rdata-ratio
      - id: metadata/signature/absent::unsigned
      - id: metadata/binary/symbols/count::max-25-imports
      - id: metadata/binary/provenance/build::pe-far-future-timestamp
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: metadata/binary/section/ratio::benign-large-rdata-layout
      - id: metadata/installer/product/

  - id: opaque-rdata-anti-analysis-loader
    desc: Monolithic RDATA carrier paired with local and remote debugger queries
    crit: hostile
    conf: 0.97
    attack: T1027,T1622
    for: [pe]
    all:
      - id: metadata/binary/layout/size::large-rdata-section
      - id: metadata/binary/layout/size::massive-executable
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    unless:
      - id: well-known/tool/development/toolchain/deno::deno-runtime-binary
      - id: well-known/tool/development/toolchain/deno::denort-runtime-binary
  # Same shape as the Deno carve-outs above: a Chromium/Electron binary is a
  # 100 MB+ image with a monolithic .rdata, MSVC TLS callbacks and the CRT's
  # IsDebuggerPresent, so it satisfies every leg on framework structure alone.
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong

  - id: encrypted-data-section-toolchain-profile
    desc: Encrypted data-section toolchain profile
    crit: component
    conf: 0.9
    any:
      - id: metadata/lang/compiler/managed::versioned-vcl-app
      - id: metadata/signature/verified/signer::google-llc
      - id: metadata/signature/unverified/signer::google-llc
      - id: metadata/signature/self-signed/signer::google-llc
      - id: metadata/signature/invalid/tampered/signer::google-llc
      - id: metadata/signature/invalid/bad-signature/signer::google-llc
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
      - id: objectives/anti-static/pack/detect::enigma-protector
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/app/system/drivers/
      - id: objectives/anti-static/pack/asprotect::asprotect-protector-application
  # Native CPython crypto extensions (PyCryptodome _ec_ws, etc.) pack optimized
  # constant tables at entropy >7.5 in .rdata — not an encrypted payload.
      - id: metadata/lang/compiler/native::python-msvc-extension
  - id: high-entropy-dot-data-runtime-profile
    desc: High-entropy .data runtime profile
    crit: component
    conf: 0.92
    any:
      - id: well-known/dual-use/access-control/zprotect::zprotect-plugin
      - id: metadata/lang/compiler/systems::go-pe-binary-context
      - id: well-known/app/system/drivers/
      - id: well-known/dual-use/access-control/hasp-license-manager::hasp-license-manager-service
      - id: well-known/lib/crypto/rsa-bsafe::rsa-bsafe-crypto-library

  - id: go-inflated-data-loader-layout
    desc: Go PE inflated data loader layout
    crit: suspicious
    conf: 0.9
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/lang/compiler/systems::go-pe-rich-symbols
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/symbols/imports::pe-single-import-dll
    any:
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/lifecycle::thread-control-apis-3of4
    needs: 2
    unless:
      - id: metadata/installer/product/
  - id: packed-loader-low-code-to-data-packaging
    desc: Recognized PE packaging in data-heavy layout
    crit: component
    conf: 0.85
    any:
      - id: metadata/binary/resource/identity::resource-only-dll
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
  - id: dotnet-data-section-framework-profile
    desc: Managed PE framework metadata marker
    crit: component
    conf: 0.95
    any:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/signature/verified/signer::.net
      - id: metadata/signature/unverified/signer::.net
      - id: metadata/signature/self-signed/signer::.net
      - id: metadata/signature/invalid/tampered/signer::.net
      - id: metadata/signature/invalid/bad-signature/signer::.net
      - id: metadata/signature/verified/subject::.net
      - id: metadata/signature/unverified/subject::.net
      - id: metadata/signature/self-signed/subject::.net
      - id: metadata/signature/invalid/tampered/subject::.net
      - id: metadata/signature/invalid/bad-signature/subject::.net
  - id: versioned-export-heavy-library
    desc: Versioned export-heavy library layout
    crit: component
    conf: 0.85
    for:
      - dll
    platforms:
      - windows
    all:
      - id: metadata/binary/provenance/version-info::version-resource-metadata
      - id: metadata/binary/symbols/count::many-exports-20
  - id: packed-loader-largest-section-packaging
    desc: Large-section packaging/runtime profile
    crit: component
    conf: 0.85
    for:
      - pe
    platforms:
      - windows
    any:
      - id: objectives/anti-static/obfuscation/payload/section/content::largest-section-resource-only-dll
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/signature/certificate/identity::open-source-developer-leaf-subject
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::largest-section-versioned-export-library
      - id: objectives/anti-static/obfuscation/payload/section/content::largest-section-nativeaot-runtime
      - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
      - id: metadata/binary/section/label/packing::upx-section
      - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
      - id: metadata/binary/symbols/count::high-export-count-marker
  - id: encrypted-payload-section
    desc: High-entropy data with a small string section
    crit: suspicious
    conf: 0.9
    size_min: 8192
    all:
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::encrypted-payload-section-cond-0--inline-29177
      - id: metadata/binary/section/prose::tiny-cstring-section
  - id: encrypted-loader-data-geometry
    desc: Encrypted loader data geometry
    crit: suspicious
    conf: 0.96
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/binary/section/entropy::large-near-random-writable-data
      - id: metadata/binary/section/ratio::data-section-1p5x-code
    any:
      - id: metadata/binary/code/ratio::pe-code-to-data-at-most-0-3
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::encrypted-loader-data-geometry-cond-1--inline-29197
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/signature/verified/signer::nvidia-corporation
      - id: well-known/lib/ai/triton::triton-package-binary
      - id: well-known/dual-use/remote-admin/anydesk::signed-windows-client
  - id: packed-anti-analysis-data-loader
    desc: Packed PE loader with anti-analysis data geometry
    crit: suspicious
    conf: 0.97
    for:
      - pe
    platforms:
      - windows
    size_min: 1048576
    all:
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-0--inline-29201
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-1--inline-29202
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-2--inline-29203
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-3--inline-29204
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-4--inline-29205
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-5--inline-29206
    unless:
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-0--inline-29208
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-1--inline-29209
      - id: 
          objectives/anti-static/obfuscation/payload/section/content::packed-anti-analysis-data-loader-cond-2--inline-29210
  - id: null-padded-remote-process-loader
    desc: Null-padded PE performs remote thread-context injection
    crit: hostile
    conf: 0.99
    for:
      - pe
    platforms:
      - windows
    attack: T1027,T1055
    mbc: B0033
    all:
      - id: metadata/binary/section/layout::dominant-low-entropy-writable-data-layout
      - id: micro-behaviors/process/inject/runtime/thread-context::remote-memory-thread-context-api-set
  - id: encoded-rdata-loader-geometry
    desc: Encoded loader payload in rdata
    crit: suspicious
    conf: 0.93
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/binary/section/ratio::pe-rdata-text-at-least-1-7
      - id: micro-behaviors/data/encode/base64/custom::alphabet-permuted-native
    any:
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rdata
      - id: metadata/binary/debug::pdb-lowercase-basename-8-to-16
      - id: metadata/binary/provenance/version-fields::pe-productname-field
  - id: large-encrypted-rdata-loader
    desc: Large PE with high-entropy .rdata and low code-to-data ratio
    crit: suspicious
    conf: 0.85
    size_min: 4194304
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/binary/section/entropy::extreme-rdata-entropy
      - id: metadata/binary/section/ratio::rdata-ratio-over-5x
      - id: metadata/binary/code/ratio::pe-code-to-data-at-most-0-1
    unless:
  # `section/metrics/` is dissolved. Each of these rules is about .rdata
  # shape, and the benign rdata signer context landed in ratio/. Name it:
  # the whole ratio/ directory also holds the `rdata-ratio-over-5x` leg.
      - id: metadata/binary/section/ratio::oversized-rdata-signer-context
  # `framework::clr-runtime-header` dropped to stay under the expanded
  # suppression budget: an IL-only assembly has no .rdata section at all.
      - id: metadata/binary/symbols/count::many-exports-200
  - id: go-symtab-rwx-payload
    desc: Go PE conceals an opaque payload in an RWX .symtab section
    crit: hostile
    conf: 0.99
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/binary/section/entropy::high-entropy-rwx-symtab-section
      - id: metadata/lang/compiler/systems::go-version-string
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/dylib/lookup::get-proc-address

  - id: aes-high-entropy-dll-payload
    desc: DLL hides AES-protected data in a high-entropy section
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    platforms: [windows]
    attack: T1027,T1140
    all:
      - id: metadata/binary/section/entropy::small-high-entropy-data-section
      - id: micro-behaviors/crypto/cipher/mode::bcrypt-cbc-mode-references
      - id: metadata/binary/symbols/count::minimal-exports
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: metadata/installer/product/
  - id: unsigned-encrypted-dot-data-spawn-loader
    desc: Unsigned PE decrypts encrypted .data then spawns a child process
    crit: hostile
    conf: 0.97
    attack: T1027,T1106
    for: [pe]
    platforms: [windows]
    size_max: 400000
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/section/entropy::large-near-random-writable-data
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/installer/product/
      - id: metadata/lang/compiler/managed::dotnet-metadata
# Packed stealers (RadThief/Fragtor-class) stash twin max-entropy .seh
# blobs and flip protection with VirtualProtect before running them.
  - id: duplicate-seh-virtualprotect-payload
    desc: Duplicate .seh payloads unlocked via VirtualProtect
    crit: hostile
    conf: 0.96
    for: [pe]
    platforms: [windows]
    attack: T1027,T1055
    all:
      - id: metadata/binary/section/label/custom::duplicated-high-entropy-seh-sections
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
      - id: metadata/installer/product/
  - id: duplicate-seh-unsigned-entropy-loader
    desc: Unsigned PE with duplicate .seh and VirtualProtect
    crit: hostile
    conf: 0.95
    for: [pe]
    platforms: [windows]
    attack: T1027,T1055
    all:
      - id: metadata/binary/section/label/custom::duplicated-high-entropy-seh-sections
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
      - id: metadata/installer/product/
  - id: duplicate-seh-high-entropy-loader
    desc: High-entropy PE with duplicate .seh and VirtualProtect
    crit: hostile
    conf: 0.95
    for: [pe]
    platforms: [windows]
    attack: T1027,T1055
    all:
      - id: metadata/binary/section/label/custom::duplicated-high-entropy-seh-sections
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/file/entropy::overall-entropy-78
    unless:
      - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
      - id: metadata/installer/product/
  - id: padded-pe-embedded-shellcode-loader
    desc: Size-padded PE carries an RWX shellcode loader
    crit: hostile
    conf: 0.96
    attack: T1027.001,T1055
    for:
      - pe
    platforms:
      - windows
    all:
      - id: metadata/binary/section/layout::dominant-low-entropy-writable-data-layout
      - id: objectives/execution/payload/memory-branch/shellcode::pe-embedded-blob-rwx-copy-and-run
