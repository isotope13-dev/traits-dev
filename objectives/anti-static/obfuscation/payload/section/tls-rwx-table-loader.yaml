# A native loader that combines early PE initialization with executable-memory
# staging and a full lookup-table decoder.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1027, T1620"

composite_rules:
  - id: multi-tls-thread-context-overlay-loader
    desc: Multi-TLS loader controls thread context in large overlay
    crit: hostile
    conf: 0.99
    attack: T1027,T1055.003,T1620,T1622
    mbc: B0012
    all:
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
      - id: metadata/binary/layout::large-overlay-1mb
      - id: micro-behaviors/os/exception/error-handling::add-vectored-exception-handler
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/sync/event::open-event
      - id: micro-behaviors/process/sync/event::create-event
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: tls-rwx-table-decoder-loader
    desc: Unattested PE stages lookup-decoded code in RWX memory
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/data/encode/custom::x86-lookup-table-byte-decoder
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
