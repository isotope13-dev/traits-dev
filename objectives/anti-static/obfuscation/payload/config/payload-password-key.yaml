# A configuration key naming a password for the program's "payload" is a
# builder setting for an encrypted stage. Installers and updaters call their
# bundles an app, package, or update; a password shipped beside the code it
# unlocks protects the stage from scanners, not from the user. SYS010
# Electron builds declare "payloadPassword" beside payloadScript and
# extractFolder, and the key survives javascript-obfuscator because object
# property names are not moved into the string array.
defaults:
  platforms: [windows, unix]
  attack: T1027.013
  mbc: B0032

traits:
  - id: payload-password-config-key
    desc: Config declares a payload password key
    crit: suspicious
    conf: 0.85
    for: [javascript, typescript, json, python, yaml]
    if:
      type: text
      regex: '(?i)\bpayload[_-]?(password|passwd|pwd)["'']?\s*:'
