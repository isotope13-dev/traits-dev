# ALPHA2 (Metasploit x86/alpha_upper, alpha_mixed) encodes a payload as
# printable text behind a short self-patching decoder. The invariant middle
# of that decoder is a fixed run of letters; the `A?` covers the mixed-case
# variant's extra pad byte and `[BC]` its two terminator spellings.
defaults:
  platforms: [windows]
  for: [pe, dll, shellcode]
  attack: T1027
  mbc: B0032

traits:
  - id: alpha2-decoder-stub-text
    desc: Alpha2 alphanumeric shellcode decoder stub
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'AAQ2AB2BB0BBA?XP8A[BC]'

composite_rules:
  - id: pe-alpha2-shellcode-at-custom-entry
    desc: Alpha2 shellcode decoder in a PE whose entry is in a custom section
    crit: hostile
    conf: 0.97
    attack: T1027,T1055
    for: [pe]
    all:
      - id: alpha2-decoder-stub-text
      - id: metadata/binary/section/header::pe-entry-in-nonstandard-section
