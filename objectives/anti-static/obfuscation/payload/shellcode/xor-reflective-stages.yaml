defaults:
  platforms: [windows]
  for: [shellcode]
  attack: T1027,T1055

traits:
  - id: shellcode-large-stage
    desc: Shellcode stage exceeds 64 KiB
    crit: notable
    if:
      type: metrics
      field: file.size
      min: 65536
  - id: shellcode-repeating-key-xor-decoder
    desc: Shellcode cycles key while XOR-decoding stage
    crit: notable
    if:
      type: yara
      source: |
        rule shellcode_repeating_key_xor_decoder {
          strings:
            $decoder = { EB ?? 5B 53 5F B0 ?? FC AE 75 ?? 57 59 53 5E 8A 06 30 07 48 FF C7 48 FF C6 }
          condition:
            $decoder at 0
        }
  - id: shellcode-inline-xor-loop
    desc: Shellcode XOR-decodes appended stage in place
    crit: notable
    if:
      type: yara
      source: |
        rule shellcode_inline_xor_loop {
          strings:
            $decoder = { E8 00 00 00 00 5B 83 C3 ?? 90 90 90 33 C9 B0 ?? 3E 30 04 19 41 81 F9 ?? ?? ?? ?? 7C ?? }
          condition:
            $decoder at 0
        }
composite_rules:
  - id: shellcode-large-obfuscated-or-reflective-stage
    desc: Large shellcode XOR-decodes appended stage
    crit: hostile
    conf: 0.97
    all:
      - id: shellcode-large-stage
    any:
      - id: shellcode-repeating-key-xor-decoder
      - id: shellcode-inline-xor-loop
