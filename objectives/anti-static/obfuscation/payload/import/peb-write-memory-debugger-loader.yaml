# A native program that walks the PEB itself, names the NT write-memory API
# and checks for a debugger resolves its injection primitives by hand rather
# than through its import table.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1027.007
composite_rules:
  - id: native-loader-with-peb-and-write-memory
    desc: Native loader with PEB walk and write-memory
    crit: suspicious
    conf: 0.7
    all:
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x86
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
