# Import table minimization patterns - indicators of string/import obfuscation.
# Malware often uses minimal imports + dynamic loading to evade static analysis.
# Per-API atomics live in their canonical micro-behaviors/ homes (dylib/load,
# mem/protect, crypto/library, process/create/exec, fs/file/open, etc.).
defaults:
  platforms: [linux, macos, windows]
  mbc: "B0032"
  attack: "T1027"
composite_rules:
  - id: crypto-minimal-pe
    desc: Crypto API with minimal imports
    crit: suspicious
    conf: 0.8
    for: [pe]
    all:
      - id: micro-behaviors/crypto/provider/cryptoapi::capi-key-setup-api-profile
    any:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: metadata/binary/symbols/imports::pe-execution-api-references
    unless:
      - id: metadata/binary/symbols/count::many-imports-30
      - id: metadata/binary/section/label/packing::upx-section
  - id: suspicious-ratio-imports
    desc: Sparse imports with multiple system capabilities
    crit: notable
    conf: 0.85
    for: [pe]
    any:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: micro-behaviors/mem/combined::pe-memory-management-api-set
      - id: metadata/binary/symbols/imports::pe-execution-api-references
      - id: micro-behaviors/crypto/provider/cryptoapi::capi-key-setup-api-profile
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/os/registry/create::reg-create-key-ex-w
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/communications/socket/create::socket-api
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
    needs: 7
    unless:
      - id: metadata/binary/symbols/count::many-imports-25

  - id: getprocaddress-large-pe-few-imports
    desc: Large PE with sparse imports
    crit: suspicious
    conf: 0.85
    for: [pe]
    size_min: 4194304
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address
    unless:
      - id: metadata/binary/symbols/count::many-imports-100
      - id: micro-behaviors/fs/temp/pyinstaller/
      - id: micro-behaviors/data/archive/custom::pyinstaller-archive-cookie-read-error

  # === ELF Import Patterns ===
  - id: minimal-elf-execution-resolution
    desc: Minimal-import ELF with dynamic resolution or shell execution
    crit: suspicious
    conf: 0.8
    for: [elf]
    any:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
    needs: 2
    unless:
      - id: metadata/binary/symbols/name/c-runtime::libc-runtime-export-surface
      - id: metadata/binary/symbols/count::many-imports-30
      - id: well-known/lib/native/modernc-libc::libc-xdlsym-runtime
      - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
      # libc.so.N is the C library itself — near-zero imports are expected.
      - id: well-known/lib/native/glibc::libc-soname
      - id: well-known/tool/sysadmin/unix-benign::sudo-noexec-library

  # === PE Ransomware/Dropper Patterns ===
  - id: pe-dropper-minimal-imports
    desc: PE dropper with minimal imports
    crit: hostile
    conf: 0.9
    for: [pe]
    # The two sparse-import profiles count the same evidence (few imports
    # plus a loader or execution API); together they described every small
    # COM/loader DLL. A dropper also needs the CryptoAPI payload-key leg.
    all:
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: crypto-minimal-pe
    any:
      - id: metadata/binary/symbols/imports::pe-sparse-execution-api-profile
      - id: metadata/binary/symbols/imports::sparse-import-api-profile
    unless:
      - id: metadata/binary/section/label/packing::upx-section
      - id: well-known/dual-use/packaging/pecompact::pecompact-packer
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/layout/ratio::svk-packed-section
      - id: objectives/anti-static/pack/detect::enigma-protector
      - id: metadata/binary/symbols/exports::no-exports

  - id: pe-concealed-capability
    desc: PE concealing capabilities
    crit: suspicious
    conf: 0.85
    for: [pe]
    needs: 2
    any:
      - id: crypto-minimal-pe
      - id: metadata/binary/symbols/imports::pe-sparse-execution-api-profile
      - id: suspicious-ratio-imports
      - id: metadata/binary/symbols/imports::sparse-import-api-profile
    unless:
      - id: metadata/binary/symbols/exports::no-exports
      - id: metadata/binary/layout/ratio::svk-packed-section
      - id: well-known/dual-use/packaging/pecompact
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
    downgrade:
      any:
        - id: metadata/binary/section/label/packing::upx-section
        - id: well-known/dual-use/packaging/pecompact::pecompact-packer
        - id: metadata/lang/compiler/managed/
        - id: objectives/anti-static/pack/detect::enigma-protector
  - id: recognized-elf-runtime-dynamic-resolution
    desc: Recognized large runtime dynamic resolution marker
    crit: component
    for: [elf]
    any:
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: metadata/binary/layout/size::massive-executable
      - id: objectives/anti-static/obfuscation/payload/import::system-lib-marker
      - id: metadata/filename/runtime::glibc-versioned-libdl
      - id: metadata/lang/compiler/systems::rust-binary
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: well-known/app/system/drivers/nvidia::nvidia-linux-driver-component

  - id: packed-pe-concealed-network-process-capabilities
    desc: Packed PE hides network and process APIs behind dynamic resolution
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1620
    for: [pe]
    all:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/communications/socket/receive::recv-api
      - id: micro-behaviors/process/create/exec::create-process-api-name
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/installer/product/
      - id: metadata/binary/layout/embedded::embedded-pe-child
