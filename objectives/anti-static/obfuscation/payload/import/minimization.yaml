# Import table minimization patterns - indicators of string/import obfuscation.
# Malware often uses minimal imports + dynamic loading to evade static analysis.
# Per-API atomics live in their canonical micro-behaviors/ homes (dylib/load,
# mem/protect, crypto/library, process/create/exec, fs/file/open, etc.).
defaults:
  platforms: [linux, macos, windows]
  mbc: "B0032"
  attack: "T1027"
composite_rules:
  - id: elf-dynamic-resolution
    desc: ELF dynamic API resolution primitive
    crit: component
    for: [elf]
    any:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: objectives/anti-static/obfuscation/reflection/class::dlopen

  - id: minimal-pe-dynamic-load-recognized-marker
    desc: Recognized packed or signed minimal-import PE marker
    crit: component
    for: [pe]
    any:
      - id: micro-behaviors/data/encode/pecompact
      - id: metadata/binary/section/label::upx-section
      - id: metadata/binary/section/label::pdi-section
      - id: metadata/signed/certificate/signature::pe-signature-verified
      # The Dell Display Manager leg was dropped when this marker was finally
      # wired into `minimal-pe-dynamic-load`: it is one product rather than a
      # packer or a signature, so it does not fit what this marker says it is,
      # and it expanded to six suppressions against the 32 ceiling. It was
      # inert regardless -- nothing referenced this trait at all.
      - id: objectives/anti-static/pack/asprotect::asprotect-protector-application
      - id: objectives/anti-static/pack/uharc::uharc-version-string
      - id: metadata/binary/section/label::vmp-section-name
      - id: metadata/binary/section/label::aspack-section
      - id: objectives/anti-static/pack/detect::aspack-marker

  # Strong, named benign contexts for minimal-import PEs. We require identity
  # or implementation evidence here; a vendor string or installer directory
  # alone is handled separately on the consuming rule, not promoted to an
  # exception.
  - id: minimal-import-recognized-pe
    desc: Verified benign minimal-import PE context
    crit: exception
    conf: 0.9
    for: [pe]
    any:
      - id: metadata/binary/installer/plugin::nsis-system-plugin
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/app/system/reactos::system-component
      # Bundled open-source plugin/runtime libraries whose Windows builds
      # carry a canonical ABI export next to the MSVC static-CRT
      # delay-load import set (LoadLibraryExW + GetProcAddress +
      # FreeLibrary) in a table of well under 40 imports. GStreamer
      # plugin DLLs and the GLib bundle's proxy-libintl gettext shim both
      # scored here from the @openai/codex voice resources.
      - id: well-known/lib/media/gstreamer/
      - id: well-known/lib/runtime/native-platform/glib::proxy-libintl-gettext-export

  # Legitimate programs that resolve APIs through their own loader layers keep
  # small import tables next to large images: libcef (its own Windows API
  # loader) and Topala SIW (hardware probing via LoadLibrary/GetProcAddress).
  # Grouped under one id so the minimal-import composites below can name a
  # single exclusion instead of growing past the suppression budget.
  - id: legitimate-loader-sparse-import-context
    desc: Known legitimate loader with sparse imports
    crit: exception
    conf: 0.9
    for: [pe]
    any:
      - id: well-known/lib/runtime/scripted/electron::cef-engine-binary-basename
      - id: well-known/app/utility/siw/
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      # HWiNFO's protected client library resolves its real imports
      # dynamically behind a 9-import stub (bundled by IObit Driver Booster).
      - id: well-known/app/utility/hwinfo::hwinfo-component-context
      - id: well-known/lib/platform/squirrel/
      - id: well-known/tool/sysadmin/ethr::ethr-binary

  # === Windows PE Import Patterns ===
  - id: minimal-pe-dynamic-load
    desc: Minimal PE imports with dynamic loading
    crit: suspicious
    conf: 0.75
    for:
    - pe
    size_min: 8193
    all:
    - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
    - id: metadata/binary/symbols/count::pe-imports-under-40
    unless:
    - id: objectives/anti-static/pack/entropy::unsigned-nonstandard-rwx-unpacker
    - id: minimal-pe-dynamic-load-known-benign-context
    - id: metadata/binary/symbols/exports::no-exports
    - id: metadata/binary/layout/ratio::svk-packed-section
    - id: metadata/binary/installer/family/
    - id: metadata/binary/symbols/count::many-exports-20
    - id: minimal-pe-dynamic-load-recognized-marker
    - id: metadata/package/testing/presence/
  - id: minimal-pe-dynamic-load-known-benign-context
    desc: Recognized PE with legitimately sparse imports
    crit: exception
    conf: 0.9
    for:
    - pe
    any:
    - id: legitimate-loader-sparse-import-context
    - id: well-known/lib/platform/wine::wine-builtin-dll-marker
    - id: minimal-import-recognized-pe
    - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-distribution
    - id: well-known/tool/development/toolchain/go-toolchain::go-testdata-fixture-path
    - id: metadata/lang/compiler/systems::go-pe-binary-context
  - id: crypto-minimal-pe
    desc: Crypto API with minimal imports
    crit: suspicious
    conf: 0.8
    for: [pe]
    all:
      - id: micro-behaviors/crypto/library/cryptoapi::capi-key-material-setup
    any:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: metadata/binary/symbols/imports::pe-execution-api-references
    unless:
      - id: metadata/binary/symbols/count::many-imports-30
      - id: metadata/build/recognized-contexts/
      - id: metadata/binary/section/label::upx-section
  - id: extreme-minimal-imports
    desc: Extremely minimal import table
    crit: notable
    conf: 0.8
    for: [pe, elf]
    size_min: 32768
    any:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: micro-behaviors/mem/combined::pe-memory-management-api-set
      - id: metadata/binary/symbols/imports::pe-execution-api-references
      - id: micro-behaviors/crypto/library/cryptoapi::capi-key-material-setup
      - id: elf-dynamic-resolution
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/binary/symbols/count::many-imports-20
      - id: metadata/package/versioning/
      - id: well-known/app/system/drivers/
    downgrade:
      any:
        - id: metadata/binary/section/label::upx-section
        - id: micro-behaviors/data/encode/pecompact::pecompact-signature
        - id: objectives/anti-static/pack/detect::enigma-protector

  - id: suspicious-ratio-imports
    desc: High ratio of suspicious to total imports
    crit: suspicious
    conf: 0.85
    for: [pe]
    any:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: micro-behaviors/mem/combined::pe-memory-management-api-set
      - id: metadata/binary/symbols/imports::pe-execution-api-references
      - id: micro-behaviors/crypto/library/cryptoapi::capi-key-material-setup
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/os/registry/access::reg-create-key-ex-w
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/communications/socket/init::socket-api
      - id: micro-behaviors/communications/socket/init::connect-api
    needs: 7
    unless:
      - id: metadata/binary/symbols/count::many-imports-25
      - id: well-known/app/ai/coding-agent/devez-vibe::runtime-binary-context
      - id: well-known/app/storage/syncback/
      - id: well-known/app/utility/siw::siw-family-identity
      # Chromium/CEF imports many normal browser, IPC, crypto, and process
      # APIs; its framework surface is not an import-minimised payload.
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
    downgrade:
      any:
        - id: metadata/binary/section/label::upx-section

  - id: getprocaddress-large-pe-few-imports
    desc: Large PE with sparse imports
    crit: suspicious
    conf: 0.85
    for: [pe]
    size_min: 4194304
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address
    unless:
      - id: metadata/binary/symbols/count::many-imports-100
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: micro-behaviors/fs/temp/pyinstaller/
      - id: micro-behaviors/data/archive/custom::pyinstaller-archive-cookie-read-error

  # === ELF Import Patterns ===
  - id: minimal-elf-execution-resolution
    desc: Minimal-import ELF with dynamic resolution or shell execution
    crit: suspicious
    conf: 0.8
    for: [elf]
    any:
      - id: elf-dynamic-resolution
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    needs: 2
    unless:
      - id: metadata/binary/symbols/count::many-imports-30
      - id: micro-behaviors/dylib/library/family/
      - id: well-known/app/system/drivers/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: well-known/lib/native/modernc-libc::libc-xdlsym-runtime
      - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
      # libc.so.N is the C library itself — near-zero imports are expected.
      - id: well-known/lib/native/glibc::libc-soname

  # === Mach-O Import Patterns ===
  - id: macho-sparse-imports-dlsym
    desc: Mach-O uses dlsym with fewer than 40 imports
    crit: notable
    conf: 0.5
    for: [macho]
    size_min: 524288
    all:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
    unless:
      - id: metadata/binary/symbols/count::many-imports-40
      - id: well-known/lib/runtime/managed/jvm
      - id: well-known/lib/media/skiko
      - id: metadata/binary/framework/
      # Statically-linked Rust/Go (and other massive runtimes) ship few dynamic
      # imports by design + a runtime dlsym — that is not obfuscation. Mirrors
      # benign-elf-runtime-dynamic-resolution for the ELF siblings above.
      - id: metadata/lang/compiler/systems/
      - id: metadata/binary/layout/size::massive-executable
      # A dSYM's debug companion data does not have an executable import
      # surface; dlsym symbols in it do not indicate import minimization.
      - id: metadata/build/debug::macos-dsym-debug-symbol
      # whisper.cpp statically links its inference and Metal implementation;
      # its small dynamic import surface is expected for this CLI.
      - id: well-known/lib/ai/whisper-cpp::whisper-cpp-cli
  - id: macho-concealed-capability
    desc: Mach-O concealing capabilities
    crit: suspicious
    conf: 0.85
    for: [macho]
    all:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
    any:
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      # Darling's usr/bin/ssh and libdtrace.dylib: dlsym beside crypto or
      # system() is how OpenSSH and a tracing library are built, not
      # capability concealment.
      - id: well-known/tool/development/toolchain/darling/
      # An interpreter resolves symbols dynamically and shells out because
      # that is its job: a-shell ships python3_ios and pythonA frameworks,
      # both exporting Py_Initialize.
      - id: well-known/lib/runtime/scripted/cpython/
      # Scripting runtimes and standalone CLI agents dynamically load native
      # addons via dlsym and spawn commands by design.
      - id: well-known/lib/runtime/scripted/bun-runtime/
      - id: well-known/app/ai/coding-agent/anthropic-claude-code/
      - id: metadata/binary/symbols/count::many-imports-40
      - id: metadata/binary/layout/size::massive-executable

  # === PE Ransomware/Dropper Patterns ===
  - id: pe-dropper-minimal-imports
    desc: PE dropper with minimal imports
    crit: hostile
    conf: 0.9
    for: [pe]
    all:
      - id: minimal-pe-dynamic-load
    needs: 2
    any:
      - id: crypto-minimal-pe
      - id: metadata/binary/symbols/imports::pe-sparse-execution-api-profile
      - id: extreme-minimal-imports
    unless:
      - id: metadata/binary/section/label::upx-section
      - id: micro-behaviors/data/encode/pecompact::pecompact-signature
      - id: metadata/lang/compiler/managed/
      - id: metadata/binary/layout/ratio::svk-packed-section
      - id: objectives/anti-static/pack/detect::enigma-protector
      - id: metadata/binary/symbols/exports::no-exports

  - id: masqueraded-aspack-dynamic-loader
    desc: Masqueraded ASPack PE with dynamic loader
    crit: suspicious
    conf: 0.98
    for: [pe]
    attack: T1027.002,T1036.005,T1620
    all:
      - id: objectives/evasion/masquerade/version-resource/contradiction::microsoft-firewall-xiang-masquerade
      - id: metadata/binary/section/label::aspack-section
      - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: pe-concealed-capability
    desc: PE concealing capabilities
    crit: suspicious
    conf: 0.85
    for: [pe]
    needs: 2
    any:
      - id: crypto-minimal-pe
      - id: metadata/binary/symbols/imports::pe-sparse-execution-api-profile
      - id: suspicious-ratio-imports
      - id: extreme-minimal-imports
    unless:
      - id: metadata/binary/symbols/exports::no-exports
      - id: metadata/binary/layout/ratio::svk-packed-section
      - id: micro-behaviors/data/encode/pecompact
    downgrade:
      any:
        - id: metadata/binary/section/label::upx-section
        - id: micro-behaviors/data/encode/pecompact::pecompact-signature
        - id: metadata/lang/compiler/managed/
        - id: objectives/anti-static/pack/detect::enigma-protector
  - id: elf-concealed-capability
    desc: ELF concealing capabilities
    crit: notable
    conf: 0.85
    for: [elf]
    all:
      - id: elf-dynamic-resolution
    any:
      - id: minimal-elf-execution-resolution
      - id: extreme-minimal-imports
    unless:
      - id: metadata/binary/provenance/
      - id: objectives/evasion/hijack-execution-flow/linker/
      - id: well-known/lib/native/modernc-libc::libc-xdlsym-runtime
      - id: well-known/lib/platform/android-renderscript
      - id: micro-behaviors/dylib/library/family/

  - id: recognized-elf-runtime-dynamic-resolution
    desc: Recognized large runtime dynamic resolution marker
    crit: component
    for: [elf]
    any:
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: metadata/binary/layout/size::massive-executable
      - id: micro-behaviors/dylib/library/family::system-lib-marker
      - id: micro-behaviors/dylib/library/libc::glibc-versioned-libdl
      - id: metadata/lang/compiler/systems::rust-binary
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: well-known/app/system/drivers/nvidia::nvidia-linux-driver-component

  - id: packed-pe-concealed-network-process-capabilities
    desc: Packed PE hides network and process APIs behind dynamic resolution
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1620
    for: [pe]
    all:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/communications/socket/init::recv-api
      - id: micro-behaviors/process/create/launch::create-process-api-name
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
