# A GUI program that imports volume-label, process-affinity and system-info
# administration calls it has no use for, next to a debugger check, is padding
# its import table with decoys. Real programs import what they call; the
# unrelated calls make the file look like a utility to import-based scanners.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1622
composite_rules:
  - id: decoy-admin-imports-beside-debugger-check
    desc: Unrelated admin API imports beside debugger check
    crit: suspicious
    conf: 0.7
    all:
      - id: micro-behaviors/fs/volume/admin::set-volume-label-w
      - id: micro-behaviors/process/control/affinity::set-process-affinity-mask
      - id: micro-behaviors/os/sysinfo/hardware::get-native-system-info
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
