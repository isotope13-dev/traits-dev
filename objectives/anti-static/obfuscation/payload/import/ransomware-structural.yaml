# Ransomware/dropper detection via structural anomalies + minimal imports
# Combines high entropy sections, dominant sections, and import minimization
defaults:
  platforms: [windows, linux, unix, android, macos, ios]
composite_rules:
  # === Hostile: Structural indicators + crypto + minimal imports ===
  #
  # The structural legs below (high code entropy, a crypto reference, imports
  # resolved through LoadLibraryA/GetProcAddress) describe a PACKER, not
  # ransomware: every UPX-compressed PE satisfies all of them, because the UPX
  # stub imports exactly LoadLibraryA + GetProcAddress and the compressed body
  # pushes .text entropy past 7.8. The official UPX 3.91-packed
  # phantomjs-2.1.1-windows/bin/phantomjs.exe — which bundles OpenSSL, hence
  # the crypto leg — was called hostile ransomware on that basis alone.
  # `pe-ransom-extortion-content` supplies the missing half of the claim: a
  # ransom note, a payment demand or the extension victim files are renamed
  # to. Packed-plus-dynamic-imports on its own remains visible as
  # objectives/anti-static/pack and metadata/binary/section/names.
  - id: ransomware-packed-minimal
    desc: Packed PE with dynamic imports and ransom extortion content
    crit: hostile
    conf: 0.95
    for: [pe]
    attack: "T1486"
    mbc: "C0027"
    all:
      # Packing indicator (Rust-generated)
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      # Crypto capability
      - id: micro-behaviors/crypto/
      # Extortion content — what makes this ransomware rather than a packer
      - id: objectives/impact/ransom/extortion::pe-ransom-extortion-content
    needs: 2
    any:
      # Dynamic loading (import obfuscation)
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address
      # Execution
      - id: micro-behaviors/process/create/exec::shell-execute-a
      - id: micro-behaviors/process/create/exec::shell-execute
      # Specific crypto APIs
      - id: micro-behaviors/crypto/certificate/store::cert-open-store
    unless:
      - id: well-known/tool/development/cygwin::cygwin-setup-signature
  - id: dropper-structural-concealment
    desc: Dropper with structural obfuscation pattern
    crit: hostile
    conf: 0.9
    for: [pe]
    attack: "T1027"
    mbc: "B0032"
    all:
      # High entropy section
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      # Dominant section (single section is 85%+ of binary)
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::dominant-section
      # Dynamic loading capability
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address
    any:
      # Additional suspicious capabilities
      - id: micro-behaviors/process/create/exec::shell-execute-a
      - id: micro-behaviors/crypto/certificate/store::cert-open-store
      - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: encrypted-payload-binary
    desc: Binary with encrypted payload section
    crit: suspicious
    conf: 0.85
    for: [pe, elf, macho]
    attack: "T1027"
    mbc: "B0032"
    all:
      # High entropy executable section
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      # Tiny string section
      - id: metadata/binary/section/metrics::tiny-cstring-section
    needs: 2
    any:
      # Execution capabilities
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/crypto/
  - id: minimal-import-high-entropy
    desc: Minimal imports with high entropy section
    crit: suspicious
    conf: 0.85
    for: [pe]
    attack: "T1027"
    all:
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
    any:
      - id: objectives/anti-static/obfuscation/payload/import::shell-exec-minimal-imports
      - id: objectives/anti-static/obfuscation/imports::minimal-imports-suspicious-apis
      - id: objectives/anti-static/obfuscation/imports::concealed-capabilities-pe
