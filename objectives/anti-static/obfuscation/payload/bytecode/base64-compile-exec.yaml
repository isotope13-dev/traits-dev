defaults:
  platforms: [windows, unix]
  for: [pyc]

traits:
  - id: pyc-compile-identifier
    desc: Bytecode references compile
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: compile

composite_rules:
  # Bytecode exposes names and constants, but these facts do not bind the
  # decompressor output to the evaluator.
  - id: pyc-base64-decompress-compile-exec
    desc: Bytecode has embedded Base64, decompression, and dynamic evaluation
    crit: suspicious
    conf: 0.94
    attack: T1027,T1059.006
    all:
      - id: metadata/file/encoding/shape::python-base64-alphabet-run
      - id: micro-behaviors/data/decode/base64/reference::pyc-base64-decode-identifier
      - id: micro-behaviors/data/decompress/stream::pyc-decompress-identifier
      - id: pyc-compile-identifier
      - id: exec-word
