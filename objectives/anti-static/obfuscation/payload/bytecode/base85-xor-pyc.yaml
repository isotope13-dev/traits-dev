defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1027,T1620

traits:
  - id: pyc-b85decode-identifier
    desc: Bytecode references Base85 decoder
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: b85decode
  - id: pyc-decompress-identifier
    desc: Bytecode references decompression
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: decompress
  - id: pyc-bytearray-identifier
    desc: Bytecode references bytearray
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: bytearray
  - id: pyc-enumerate-identifier
    desc: Bytecode references enumerate
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: enumerate
  - id: pyc-encoded-loader-size
    desc: Bytecode is larger than sixteen kilobytes
    crit: component
    if:
      type: metrics
      field: file.size
      min: 16384
  - id: pyc-encoded-loader-entropy
    desc: Bytecode has high file entropy
    crit: component
    if:
      type: metrics
      field: file.entropy
      min: 6.2

composite_rules:
  - id: pyc-high-entropy-b85-exec-loader
    desc: Bytecode references encoded execution loader
    crit: hostile
    conf: 0.94
    all:
      - id: pyc-b85decode-identifier
      - id: pyc-decompress-identifier
      - id: exec-word
      - id: pyc-bytearray-identifier
      - id: pyc-enumerate-identifier
      - id: pyc-encoded-loader-size
      - id: pyc-encoded-loader-entropy
      - id: metadata/binary/code/bytecode::pyc-zeroed-metadata
