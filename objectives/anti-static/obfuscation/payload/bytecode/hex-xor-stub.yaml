defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1027
  mbc: B0032

traits:
  - id: pyc-xor-payload-stub-names
    desc: Bytecode names XOR payload decoder variables
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(xor_key|hex_payload|decrypted_data)\b'

composite_rules:
  - id: pyc-hex-bytearray-decoder-stub
    desc: Python bytecode carries large hex payload and bytearray decoder
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/file/encoding/hex::long-hex-text-run
      - id: micro-behaviors/data/decode/hex::pyc-hex-decode-name
      - id: pyc-bytearray-identifier
    any:
      - id: pyc-xor-payload-stub-names
      - id: python-junk-large-bytecode
