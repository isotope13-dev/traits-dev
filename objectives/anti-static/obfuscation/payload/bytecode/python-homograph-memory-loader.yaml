defaults:
  for: [pyc]
  platforms: [windows]
  attack: T1027,T1620

traits:
  - id: pyc-homograph-encoded-virtualalloc
    desc: Homograph-substituted Base64 VirtualAlloc text
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: '57 D0 B0 58 4A 30 64 57 46 73 51 57 78 73 D0 B1 32 4D 6F'
  - id: pyc-homograph-encoded-rtlm
    desc: Homograph-substituted Base64 RtlMoveMemory text
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: '53 64 47 78 4E D0 B1 33 5A 6C 54 57 56 74 D0 B1 33 4A 35'
  - id: pyc-string-replace-token
    desc: Bytecode references string replacement
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: replace

composite_rules:
  - id: pyc-homograph-encoded-memory-loader
    desc: Bytecode conceals native memory loader using homographs
    crit: hostile
    conf: 0.99
    all:
      - id: pyc-homograph-encoded-virtualalloc
      - id: pyc-homograph-encoded-rtlm
      - id: pyc-string-replace-token
      - id: metadata/lang/source/naming/resource::b64decode-string
