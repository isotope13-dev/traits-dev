defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1027,T1027.016

traits:
  - id: python313-repeated-junk-instructions
    desc: Python 3.13 bytecode repeats junk opcodes
    crit: notable
    if:
      type: yara
      source: |
        rule python313_repeated_junk_instructions {
          strings:
            $extended = { 47 FF 47 FF 55 FF }
            $divide = { 53 ?? 53 ?? 2D 0B 00 00 20 00 }
          condition:
            uint16(0) == 0x0df3 and #extended >= 64 and #divide >= 8
        }
  - id: python-junk-large-bytecode
    desc: Python bytecode exceeds one megabyte
    crit: notable
    if:
      type: metrics
      field: file.size
      min: 1048576
  - id: python-junk-parse-error
    desc: Python bytecode parsing reports an error
    crit: notable
    if:
      type: metrics
      field: parse.error_count
      min: 1
  - id: python-junk-low-entropy
    desc: Bytecode has low overall entropy
    crit: component
    if:
      type: metrics
      field: file.entropy
      max: 4.5

composite_rules:
  - id: python313-junk-bytecode-obfuscation
    desc: Bytecode contains repeated junk instructions
    crit: hostile
    conf: 0.97
    all:
      - id: python313-repeated-junk-instructions
      - id: python-junk-large-bytecode
      - id: metadata/binary/code/bytecode::pyc-zeroed-metadata
    any:
      - id: python-junk-parse-error
      - id: python-junk-low-entropy
