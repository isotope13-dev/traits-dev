defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - whl
  - zip
  - tar
traits:
- id: python-module-stub-sealed-blob
  desc: Module delegates to a sealed blob loader
  crit: suspicious
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: \.load\(__name__,\s*["'][A-Za-z0-9+/=]{400,}
- id: python-self-loader-variable-call
  desc: Module loader invoked with a module variable
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: \.load\(__name__,\s*\w+\)
composite_rules:
- id: python-package-sealed-sources
  desc: Package ships its modules as exec-sealed encrypted blobs
  crit: suspicious
  conf: 0.92
  scope: archive
  for:
  - python
  - zip
  - tar
  all:
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: micro-behaviors/data/compression::decompression-output-text-decode
  - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
  - id: python-module-stub-sealed-blob
- id: python-variable-blob-stub
  desc: Variable-carried sealed blob feeds a module loader
  crit: suspicious
  conf: 0.9
  for:
  - python
  - whl
  all:
  - id: metadata/file/encoding/shape::python-long-base64-looking-string-literal
  - id: python-self-loader-variable-call
- id: python-xor-blob-import-exec-seal
  desc: Import-time Base64 exec beside XOR bytes
  crit: suspicious
  conf: 0.9
  # Container/package defaults pool siblings. This relationship belongs to one
  # source file; a SHA3 implementation elsewhere cannot supply its XOR leg.
  scope: file
  all:
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-module-level-base64-exec
  - id: micro-behaviors/data/encoding/xor/unspecified-key::python-xor-bytes-comprehension
- id: python-hidden-key-decoder-exec
  desc: XOR-hidden key unlocks an exec'd inflated blob
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/bitwise/mixed::python-large-integer-xor-mask
  - id: micro-behaviors/data/encoding/xor/unspecified-key::python-xor-bytes-comprehension
  - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
- id: python-authenticated-crypter-payload-loader
  desc: Authenticated stream cipher decrypts payload
  crit: hostile
  conf: 0.985
  for:
  - python
  - whl
  scope: archive
  attack: T1027.002,T1140,T1059.006
  mbc: B0032,E1059
  all:
  - id: micro-behaviors/crypto/kdf/algorithm::python-hashlib-pbkdf2-hmac
  - id: micro-behaviors/crypto/hash/hmac::hmac-api-reference
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-keyword
  - id: metadata/file/encoding/shape::large-base64-like-literal
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  any:
  - id: micro-behaviors/metaprogramming/reflection/resolve::python-getattr-builtins
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/metaprogramming/reflection/invoke::python-getattr-builtin-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-dynamic-code-evaluation
  unless:
  - id: metadata/path/directory::test-directory-component
