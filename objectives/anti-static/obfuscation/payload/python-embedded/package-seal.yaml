# A Python package whose every module is a one-call stub delegating to an
# encrypted blob exec'd at import conceals its distributed logic from static
# recovery. Vendor obfuscation of a shipped SDK is the legitimate twin; the
# claim here is the sealing pattern, not the vendor, so it stays suspicious.
defaults:
  platforms: [windows, unix]
  for: [python, whl, zip, tar]

traits:
  - id: python-module-stub-sealed-blob
    desc: Module delegates to a sealed blob loader
    crit: suspicious
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '\.load\(__name__,\s*["''][A-Za-z0-9+/=]{400,}'

  - id: python-self-loader-variable-call
    desc: Module loader invoked with a module variable
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\.load\(__name__,\s*\w+\)'

composite_rules:
  # The inline stub style: the sealed blob rides directly in the loader call.
  - id: python-package-sealed-sources
    desc: Package ships its modules as exec-sealed encrypted blobs
    crit: suspicious
    conf: 0.92
    scope: archive
    for: [python, zip, tar]
    all:
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/compression::decompression-output-text-decode
      - id: micro-behaviors/metaprogramming/generation::compile-source-exec-mode
      - id: python-module-stub-sealed-blob
    unless:
      - id: metadata/package/testing/

  # The variable-carrier stub style: the sealed blob rides in a module-level
  # variable and the loader call hands it back by name. The long literal leg
  # reuses the encoding-layer observation of a giant base64-like string.
  - id: python-variable-blob-stub
    desc: Variable-carried sealed blob feeds a module loader
    crit: suspicious
    conf: 0.9
    for: [python, whl]
    all:
      - id: metadata/file/encoding::python-long-base64-looking-string-literal
      - id: python-self-loader-variable-call
    unless:
      - id: metadata/package/testing/

  # The decoder-core variant: an embedded base64 blob, an XOR decode loop
  # and import-time execution in one artifact mark a concealed logic
  # carrier even where no stub call survives.
  - id: python-xor-blob-import-exec-seal
    desc: XOR-decoded blob executes at import time
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    unless:
      - id: metadata/package/testing/

  # Decoder-core layer variant: the module that assembles XOR-hidden key
  # material, inflates a blob through a XOR bytes loop, and execs the
  # compiled result carries the concealment machinery in one place.
  - id: python-hidden-key-decoder-exec
    desc: XOR-hidden key unlocks an exec'd inflated blob
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::python-xor-assembled-key-constant
      - id: micro-behaviors/data/encoding/xor::python-xor-bytes-comprehension
      - id: micro-behaviors/metaprogramming/generation::compile-source-exec-mode
    unless:
      - id: metadata/package/testing/

  - id: python-authenticated-crypter-payload-loader
    desc: Authenticated stream cipher decrypts payload
    crit: hostile
    conf: 0.985
    for: [python, whl]
    scope: archive
    attack: T1027.002,T1140,T1059.006
    mbc: B0032,E1059
    all:
      - id: micro-behaviors/crypto/kdf/algorithm::python-hashlib-pbkdf2-hmac
      - id: micro-behaviors/crypto/hash/hmac::hmac-api-reference
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-keyword
      - id: metadata/file/encoded::large-base64-like-literal
      - id: micro-behaviors/data/decode/base64::b64decode-call
    any:
      - id: micro-behaviors/process/interpreter/python::python-getattr-builtins
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/indirect::python-getattr-builtin-call
      - id: micro-behaviors/process/interpreter/eval/direct::python-dynamic-code-evaluation
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/lib/
