defaults:
  platforms: [windows]
  for: [pe, rar]
composite_rules:
- id: silent-sfx-ntfs-stream-payload
  desc: Silent SFX carries an NTFS stream member
  crit: hostile
  conf: 0.93
  scope: outer
  attack: T1564.004,T1027.009
  all:
  - id: well-known/tool/sysadmin/winrar-sfx::winrar-sfx
  - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
  - id: micro-behaviors/ui/window/suppression::sfx-silent-raw-directive
  - id: micro-behaviors/data/archive/extract/destination::sfx-temp-mode-directive
