defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94
  attack: T1027.013,T1204.002

composite_rules:
- id: cab-com-win32-vb6
  crit: hostile
  desc: Cabinet wraps concealed Win32 VB6 COM
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/member/extension::archive-com-member
    - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

