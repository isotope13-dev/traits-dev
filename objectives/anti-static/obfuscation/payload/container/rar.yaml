defaults:
  platforms:
    - windows
  for: [binaries, scripts, source]
  attack: T1027
  mbc: B0032
traits:
  - id: many-long-lines
    desc: Many extremely long lines
    crit: suspicious
    conf: 0.8
    size_min: 524288
    for:
      - powershell
      - batch
      - vbs
      - lnk
    if:
      type: metrics
      field: text.lines_over_1000
      min: 500
  - id: many-long-tokens
    desc: Many long opaque tokens present
    crit: notable
    conf: 0.8
    size_min: 524288
    for:
      - javascript
      - powershell
      - batch
      - vbs
      - lnk
    if:
      type: metrics
      field: text.long_token_count
      min: 10000
    unless:
      - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
      - id: well-known/lib/development/vscode-webview::acquire-vscode-api
      - id: micro-behaviors/process/interpreter/vm/
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/bundler/asset::js-vite-rollup-vendor-chunk

composite_rules:
  - id: winrar-sfx-high-entropy-overlay-pack
    desc: WinRAR SFX packs a high-entropy overlay archive
    crit: hostile
    conf: 0.95
    for: [pe]
    attack: T1027.009
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/entropy::high-entropy-64k-region
    unless:
      - id: metadata/signed/platform/
  - id: winrar-sfx-packed-rat-stage
    desc: RAR self-extractor conceals a RAT-named temporary stage
    crit: hostile
    conf: 0.995
    for: [pe]
    attack: T1027.009,T1204.002
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/layout/overlay::large-overlay-1mb
      - id: objectives/command-and-control/dropper/delivery/sfx::sfx-temp-mode-directive
      - id: objectives/command-and-control/dropper/delivery/sfx::sfx-setup-rat-executable
    unless:
      - id: metadata/signed/platform/
