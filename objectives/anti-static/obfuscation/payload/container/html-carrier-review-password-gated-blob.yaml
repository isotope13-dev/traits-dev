defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027.006,T1204.002


composite_rules:
  - id: password-gated-encrypted-executable-iframe-delivery
    desc: Password-gated encrypted executable iframe delivery
    crit: hostile
    conf: 0.98
    near_bytes: 1024
    all:
      - id: metadata/document/html/markup::encrypted-zip-iframe
      - id: metadata/document/html/markup::base64-exe-suffix-marker
      - id: micro-behaviors/ui/window/display::password-label-text
