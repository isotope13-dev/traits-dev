# Each role is required within one file; unrelated archive members cannot
# supply it. These findings describe co-occurrence, not proven data flow.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]
  crit: suspicious
  conf: 0.94
  attack: T1027.009,T1027.013

composite_rules:
  - id: font-delimited-base64-payload
    desc: Font reference with Base64 tail extraction
    scope: file
    all:
      - id: micro-behaviors/fs/path/font::quoted-font-path
      - id: micro-behaviors/data/buffer/carve::delimited-base64-tail
