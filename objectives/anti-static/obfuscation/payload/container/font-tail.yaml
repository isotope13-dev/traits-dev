# Each role is required within one file; unrelated archive members cannot
# supply it. These findings describe co-occurrence, not proven data flow.
defaults:
  platforms: [unix, windows]
  for: [shell, python]
  crit: suspicious
  conf: 0.94
  attack: T1027.009,T1027.013

composite_rules:
  - id: font-delimited-base64-payload
    desc: Font reference with Base64 tail extraction
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/extension::quoted-font-path
      - id: micro-behaviors/data/buffer/carve::delimited-base64-tail

  - id: encrypted-font-executable-staging
    desc: Font-tail decoding with AES and execute bits
    scope: file
    near_lines: 40
    all:
      - id: font-delimited-base64-payload
      - id: micro-behaviors/fs/chmod/executable/mode::script-grants-execute-permission
    any:
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-aes-decrypt
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-decrypt-flow
