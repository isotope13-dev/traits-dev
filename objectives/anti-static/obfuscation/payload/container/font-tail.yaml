# Each role is required within one file; unrelated archive members cannot
# supply it. These findings describe co-occurrence, not proven data flow.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]
  crit: suspicious
  conf: 0.94
  attack: T1027.009,T1027.013

composite_rules:
  # Encryption is the concealment, independent of the transport encoding or
  # delimiter spelling. A font reference alone never establishes a payload.
  # Same-file co-occurrence: the description states what fired together, not
  # proven data flow; a user-restoring font-backup script matches too.
  - id: font-delimited-encrypted-payload
    desc: Font reference hides an AES-encrypted tail
    for: [shell, python]
    scope: file
    all:
      - id: micro-behaviors/fs/path/font::quoted-font-path
      - id: micro-behaviors/data/buffer/carve::delimited-input-tail
    any:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::openssl-aes-decrypt
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::pycrypto-aes-decrypt-context

  # The same concealment on a carrier fetched from the network. A local
  # "restore my encrypted backup" script has no fetch leg and stays with the
  # suspicious composite above; fetching the font-named carrier from a remote
  # host removes that reading, because the remote resource is not the user's
  # backup. The decrypted bytes may be written or used in memory; no
  # execution is claimed.
  - id: font-delimited-encrypted-remote-payload
    desc: Remote font carrier hides an encrypted tail
    crit: hostile
    conf: 0.93
    for: [shell, python]
    scope: file
    all:
      - id: micro-behaviors/fs/path/font::quoted-font-path
      - id: micro-behaviors/data/buffer/carve::delimited-input-tail
      - id: objectives/execution/staging/http::remote-fetch-alternative
    any:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::openssl-aes-decrypt
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::pycrypto-aes-decrypt-context

  - id: font-delimited-base64-payload
    desc: Font reference hides a Base64 delimiter tail
    scope: file
    all:
      - id: micro-behaviors/fs/path/font::quoted-font-path
      - id: micro-behaviors/data/buffer/carve::delimited-base64-tail
