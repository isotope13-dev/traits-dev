defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [iso]
  attack: T1027,T1059.001,T1204.002

composite_rules:
- id: iso-password-powershell-arithmetic-clues
  desc: ISO password and PowerShell arithmetic clues
  platforms: [windows, unix]
  for: [iso, pe, pyc, data, scripts]
  all:
    - id: metadata/file/format/iso/structure::primary-volume-descriptor
    - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    - id: metadata/file/format/iso/payload::iso-lnk-arithmetic-obfuscation
    - id: metadata/file/format/iso/member::iso-password-disclosure-text

