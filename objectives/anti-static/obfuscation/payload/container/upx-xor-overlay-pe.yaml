defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.009
  mbc: F0001.008

composite_rules:
  - id: xor-decoder-in-upx-overlay-pe-carrier
    desc: UPX image combines an XOR decoder with an overlay PE
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/layout/embedded::pe-embedded
      # Thirty-five percent, not half: verified carriers stage a 60KB-plus
      # overlay PE beside the decoder at ~42% of the image; the other four
      # legs already carry the specificity.
      - id: metadata/binary/layout/ratio::overlay-over-35pct
      - id: micro-behaviors/data/decode/xor::x86-unrolled-byte-xor-to-stack
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # Rifaien's UPX stub imports VirtualProtect, and an appended PE can
      # carry its own stack XOR decoder. That co-occurrence is not the
      # submission utility staging or running the overlay.
      - id: well-known/dual-use/transfer/rifaien::rifaien-self-upload-exception
  # The container's embedded overlay PE is itself a stage: its import cluster
  # reads resources back at runtime, and the carrier resolves executable
  # memory around it. An unpacked binary shows the same import set through
  # the symbol-typed pe-resource-full-extraction; here the raw-bytes cluster
  # is what survives the packing, so the staging verdict lands on the
  # carrier that ships the stage.
  - id: upx-carrier-embedded-resource-stage
    desc: UPX carrier embeds a resource-extraction stage
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/data/embedded/payload/native::raw-resource-extraction-import-cluster
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # The Rifaien self-submission experiment reads its own image through
      # this same extraction cluster to upload it; its appended PE rides
      # along in the upload and is not launched. Same rationale as the
      # sibling XOR-decoder composite above.
      - id: well-known/dual-use/transfer/rifaien::rifaien-self-upload-exception
