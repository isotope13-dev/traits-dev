defaults:
  platforms: [windows, unix]
  for: [scripts, macho, pe, elf]
  mbc: B0032
  attack: T1027.003
traits:
  - id: named-function-declaration-in-noncode
    desc: Named function in non-source container
    crit: notable
    conf: 0.9
    for: [documents, media]
    if:
      type: text
      regex: \bfunction\s+(_?0x[a-fA-F0-9]{2,}|[A-Za-z_$][A-Za-z0-9_$]{0,31})\s*\(
    unless:
      - type: basename
        regex: \.([cm]?js|jsx|tsx?|mjs)$
      - type: basename
        regex: '(?i)\.(diff|patch)$'
      - type: basename
        regex: '(?i)^readme(\.[^.]+)?$'
      - type: basename
        regex: '(?i)\.(md|markdown|txt|rst)$'
    not:
      - substr: function OnConnection(
      - substr: function id (
      - substr: Script generated by Fiddler2 export.
      - substr: function ToggleTableContent(
      - substr: function getElementPosition(
      - substr: function ToggleOverlayContentDisplay(
      - substr: function ProcessTableWithLargeCellContent(
      - substr: MathJax.loader&&MathJax.loader.checkVersion(
  - id: require-call-in-noncode
    desc: Require call in non-code file
    crit: component
    conf: 0.9
    for: [documents, media]
    if:
      type: text
      substr: require(
    unless:
      - type: basename
        regex: \.([cm]?[jt]s|jsx|tsx|mjs)$
      - type: basename
        regex: '(?i)\.(md|markdown|rst|txt)$'
      - id: objectives/anti-static/obfuscation/payload/container::mathjax-webpack-bundle
  - id: source-map-extension
    desc: Source map file extension
    crit: notable
    for: [javascript, typescript, json, shell, data]
    if:
      type: path
      basename: true
      regex: '\.map$'
  - id: mathjax-webpack-bundle
    desc: Embedded MathJax webpack bundle
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: MathJax.loader&&MathJax.loader.checkVersion(
composite_rules:
  - id: macho-binary
    desc: Mach-O binary marker
    crit: component
    any:
      - id: metadata/file/magic/identity::macho-32
      - id: metadata/file/magic/identity::macho-64
  - id: hidden-js-payload
    desc: Non-code file with JavaScript code patterns
    crit: suspicious
    conf: 0.9
    for: [documents, media, data, manifests]
    unless:
      - id: metadata/lang/source::js-ts-source-basename
      - id: source-map-extension
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: mathjax-webpack-bundle
    any:
      - id: named-function-declaration-in-noncode
      - id: require-call-in-noncode
      - id: micro-behaviors/data/source/syntax/keyword::js-keyword-fromcharcode
    needs: 3
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable

  # A compiled help file, an OLE document or a PDF has no reason to carry a
  # named function that rebuilds a string from character codes. Each half is
  # already notable on its own and neither is conclusive: help files do embed
  # script, and `fromCharCode` has honest uses. Together in a container whose
  # whole purpose is to render documentation, they are a payload being
  # reassembled at open time to keep it out of the file as shipped.
  #
  # `html` is deliberately NOT in scope even though it is the format the script
  # is written in. A standalone page combining a named function with
  # `fromCharCode` is ordinary minified web code, so scoping this to `documents`
  # would turn every such page hostile. The signal is the *container*: when the
  # same HTML arrives sealed inside a .chm, the surrounding format is what makes
  # it indefensible, and cleave reads the embedded markup as the container's own
  # text.
  - id: noncode-container-selfdecoding-script
    desc: Container hides self-decoding script
    crit: hostile
    conf: 0.95
    attack: T1027.003,T1140
    for: [chm, oledoc, ooxml, rtf, pdf]
    # Both legs must come from the same document. Without this the archive
    # scope pools them across unrelated members and the finding lands on the
    # containing tarball: OpenSSH's 9.6p1 source matched, its function
    # declarations in one file and a fromCharCode in another.
    scope: file
    all:
      - id: named-function-declaration-in-noncode
      - id: objectives/anti-static/obfuscation/syntax::html-fromcharcode-decode

