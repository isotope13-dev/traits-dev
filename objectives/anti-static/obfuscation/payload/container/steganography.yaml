defaults:
  platforms: [windows, unix]
  for: [scripts, macho, pe, elf]
  mbc: B0032
  attack: T1027.003
composite_rules:
  - id: macho-binary
    desc: Mach-O binary marker
    crit: component
    any:
      - id: metadata/file/magic/identity::macho-32
      - id: metadata/file/magic/identity::macho-64
  - id: hidden-js-payload
    desc: Non-code file with JavaScript code patterns
    crit: suspicious
    conf: 0.9
    for: [documents, media, data, manifests]
    unless:
      - id: "metadata/file/extension/source::js-ts-source-basename"
      - id: metadata/file/format/source-map::sourcemap
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/lib/ai/mathjax::mathjax-webpack-bundle
    any:
      - id: micro-behaviors/data/embedded/script::named-function-in-document-or-media
      - id: micro-behaviors/os/module/require::require-call-in-noncode
      - id: metadata/lang/source/naming/function/runtime::js-keyword-fromcharcode
    needs: 3
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable

  # A compiled help file, an OLE document or a PDF has no reason to carry a
  # named function that rebuilds a string from character codes. Each half is
  # already notable on its own and neither is conclusive: help files do embed
  # script, and `fromCharCode` has honest uses. Together in a container whose
  # whole purpose is to render documentation, they are a payload being
  # reassembled at open time to keep it out of the file as shipped.
  #
  # `html` is deliberately NOT in scope even though it is the format the script
  # is written in. A standalone page combining a named function with
  # `fromCharCode` is ordinary minified web code, so scoping this to `documents`
  # would turn every such page hostile. The signal is the *container*: when the
  # same HTML arrives sealed inside a .chm, the surrounding format is what makes
  # it indefensible, and cleave reads the embedded markup as the container's own
  # text.
  #
  # `oledoc` covers the same shape behind an Outlook .msg: a phishing body
  # ships obfuscated JavaScript (API names rebuilt through fromCharCode
  # arithmetic) that XOR-decodes an embedded page and swaps it in on click.
  # Legacy .doc/.xls droppers reach this composite the same way; VBA macro
  # bodies use Chr(), not fromCharCode, so macro-laden office files do not.
  - id: noncode-container-selfdecoding-script
    desc: Container hides self-decoding script
    crit: hostile
    conf: 0.95
    attack: T1027.003,T1140
    for: [chm, oledoc]
    # Both legs must come from the same document. Without this the archive
    # scope pools them across unrelated members and the finding lands on the
    # containing tarball: OpenSSH's 9.6p1 source matched, its function
    # declarations in one file and a fromCharCode in another.
    scope: file
    all:
      - id: micro-behaviors/data/embedded/script::named-function-in-document-or-media
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
