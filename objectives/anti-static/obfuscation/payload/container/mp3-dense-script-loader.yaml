defaults:
  for: [mp3]
  platforms: [windows, unix]
  attack: T1027,T1140

traits:
  - id: mp3-dense-script-hex-eval
    desc: MP3 contains dense script and hex-decoding eval
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule mp3_dense_script_hex_eval {
          strings:
            $id3 = "ID3" ascii
            $open = "<script>" ascii nocase
            $close = "</script>" ascii nocase
            $eval = "eval(" ascii nocase
            $char = "String.fromCharCode" ascii nocase
            $parse = "parseInt(" ascii nocase
          condition:
            $id3 at 0 and #open >= 20 and #close >= 20 and $eval and $char and $parse
        }
  - id: mp3-hidden-window-charcode-eval
    desc: MP3 hides window and evaluates decoded script
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule mp3_hidden_window_charcode_eval {
          strings:
            $id3 = "ID3" ascii
            $script = "<script>" ascii nocase
            $move = "window.moveTo(-10000,-10000)" ascii nocase
            $resize = "window.resizeTo(1,1)" ascii nocase
            $eval = "eval(" ascii nocase
            $char = "String.fromCharCode" ascii nocase
          condition:
            $id3 at 0 and all of ($script, $move, $resize, $eval, $char)
        }
