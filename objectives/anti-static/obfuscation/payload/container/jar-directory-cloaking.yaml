defaults:
  for: [jar]
  platforms: [windows, unix]
  attack: T1027,T1564

traits:
  - id: jar-class-directory-name
    desc: JAR class path marked as directory
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)\.class/$'

  - id: jar-extreme-member-name
    desc: JAR has an extremely long member name
    crit: suspicious
    conf: 0.97
    if:
      type: metrics
      field: archive.max_filename_length
      min: 32000

composite_rules:
  - id: jar-class-directory-extreme-path-cloaking
    desc: Executable JAR uses extreme directory paths
    crit: hostile
    conf: 0.98
    all:
      - id: jar-extreme-member-name
      - id: metadata/archive/layout::jar-many-directory-entries
      - id: metadata/package/entrypoint/module::jar-main-class
