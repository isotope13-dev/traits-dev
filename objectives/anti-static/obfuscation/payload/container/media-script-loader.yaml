# A script loader wearing a media file.
#
# The carrier is chosen for what a scanner does with it, not for what it plays.
# Identified as audio or an image, the file is treated as a passive asset:
# script-language rules do not run against it, and the megabytes of real media
# in front of the payload push the interesting bytes past whatever budget the
# scanner allots. The abuse.ch 2025 wave appends its markup to a Creative
# Commons MP3 and delivers the result as `.hta`, which Windows runs as script
# regardless of what the bytes say.
#
# Two facts settle it together. A media container has no interpreter, so a call
# to one is code that arrived where nothing looks for code; and a hex-pair
# decoder next to it means the code is not even the code -- it is the thing
# that produces it.
defaults:
  platforms: [windows, unix]
  for: [media]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: media-carried-decoding-script-loader
    desc: Media file decodes and evaluates a script
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/payload/media::dynamic-eval-in-media
      - id: micro-behaviors/data/decode/hex::js-hex-charcode-decoder
