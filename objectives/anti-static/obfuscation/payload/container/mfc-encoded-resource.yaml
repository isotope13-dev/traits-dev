# The resource is moderately encoded and an independent stack-buffer dispatch
# is present. The matcher does not show the resource supplying that buffer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 524288
  attack: T1027.003

composite_rules:
  - id: mfc-encoded-resource-buffer-dispatch-profile
    desc: MFC encoded resource and buffer-dispatch clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/library/legacy::mfc42-ref
      - id: metadata/binary/section/entropy::rsrc-over-32k-entropy-over-5p8
      - id: micro-behaviors/process/inject/runtime/call::transformed-stack-buffer-dispatch-x86
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
