# Parser-independent evidence for a truncated ARM ELF image.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: B0001

traits:
  - id: executable-stack-raw-header
    desc: ELF PT_GNU_STACK executable bit in header
    crit: notable
    conf: 0.95
    if:
      type: hex
      offset: 180
      pattern: "51 E5 74 64 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 07 00 00 00"

  # The parser cannot compare p_filesz with the supplied file length after
  # section metadata is damaged, so retain the complete header invariant.
  - id: arm-load-segment-claims-unavailable-bytes
    desc: ARM ELF load segment exceeds supplied file
    crit: suspicious
    conf: 0.98
    size_max: 131072
    if:
      type: hex
      offset: 84
      pattern: "01 00 00 00 00 00 00 00 00 80 00 00 00 80 00 00 A8 06 04 00 A8 06 04 00 05 00 00 00"

composite_rules:
  - id: truncated-arm-elf-load-image
    desc: Truncated ARM ELF with unavailable load image
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/arch/iot::arm
      - id: metadata/binary/anomaly/format::elf-parse-failure
      - id: arm-load-segment-claims-unavailable-bytes
      - id: executable-stack-raw-header
