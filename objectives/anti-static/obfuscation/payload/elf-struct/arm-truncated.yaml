# Parser-independent evidence for a truncated ARM ELF image.  These patterns
# describe ELF program-header invariants, rather than a family or sample
# string, because malformed section metadata can prevent normal extraction.
defaults:
  crit: suspicious
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: truncated-arm-elf-load-image
    desc: ARM ELF truncated RX load with executable stack
    conf: 0.98
    all:
      - id: metadata/arch/iot::arm
      - id: metadata/binary/header/malformed::elf-parse-failure
      - id: metadata/binary/header/program::arm-rx-load-exceeds-file
      - id: metadata/binary/header/program::elf-executable-stack-raw-header

  # Truncated ARM stubs may keep a RW GNU_STACK while both the RX segment and
  # section table claim file-backed bytes beyond EOF.
  - id: truncated-arm-rx-load-image
    desc: ARM ELF truncated RX load and section table
    conf: 0.97
    all:
      - id: metadata/arch/iot::arm
      - id: metadata/binary/header/malformed::elf-parse-failure
      - id: metadata/binary/header/program::arm-rx-load-exceeds-file
      - id: metadata/binary/section/header::elf-unreachable-section-header-table
