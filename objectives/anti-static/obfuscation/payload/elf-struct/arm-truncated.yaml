# Parser-independent evidence for a truncated ARM ELF image.  These patterns
# describe ELF program-header invariants, rather than a family or sample
# string, because malformed section metadata can prevent normal extraction.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: B0001

traits:
  - id: executable-stack-raw-header
    desc: ELF header requests executable stack
    crit: notable
    conf: 0.95
    arch: [arm]
    if:
      type: hex
      offset_range: [52, 4096]
      # p_type=PT_GNU_STACK followed by 20 bytes of the 32-bit program
      # header and p_flags=PF_R|PF_W|PF_X.  No fixed phdr index or sample
      # address/size is assumed.
      pattern: "51 E5 74 64 [20] 07 00 00 00"

  # The parser cannot compare p_filesz with the supplied file length after
  # section metadata is damaged.  This is a deliberately neutral header atom:
  # the composite below supplies the malformed-image and executable-stack
  # context needed to infer hostile intent.
  - id: arm-executable-load-header
    desc: ARM ELF PT_LOAD begins at file origin
    crit: notable
    conf: 0.9
    arch: [arm]
    size_max: 131072
    if:
      type: hex
      offset: 84
      # PT_LOAD, p_offset=0, and PF_R|PF_X.  The remaining address and size
      # fields are intentionally wildcarded so this covers future compact
      # ARM loader fragments rather than this file's exact image dimensions.
      pattern: "01 00 00 00 00 00 00 00 [16] 05 00 00 00"

composite_rules:
  - id: truncated-arm-elf-load-image
    desc: Malformed ARM ELF with executable load image
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/arch/iot::arm
      - id: metadata/binary/anomaly/format::elf-parse-failure
      - id: arm-executable-load-header
      - id: executable-stack-raw-header
