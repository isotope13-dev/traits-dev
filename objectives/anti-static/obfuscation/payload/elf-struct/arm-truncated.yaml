# Parser-independent evidence for a truncated ARM ELF image.  These patterns
# describe ELF program-header invariants, rather than a family or sample
# string, because malformed section metadata can prevent normal extraction.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: B0001

traits:
  - id: executable-stack-raw-header
    desc: ELF header requests executable stack
    crit: notable
    conf: 0.95
    arch: [arm]
    if:
      type: hex
      offset_range: [52, 4096]
      # p_type=PT_GNU_STACK followed by 20 bytes of the 32-bit program
      # header and p_flags=PF_R|PF_W|PF_X.  No fixed phdr index or sample
      # address/size is assumed.
      pattern: "51 E5 74 64 [20] 07 00 00 00"

composite_rules:
  - id: truncated-arm-elf-load-image
    desc: ARM ELF truncated RX load with executable stack
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/arch/iot::arm
      - id: metadata/binary/anomaly/format::elf-parse-failure
      - id: metadata/binary/anomaly/program-header::arm-rx-load-exceeds-file
      - id: executable-stack-raw-header

  # Truncated ARM stubs may keep a RW GNU_STACK while both the RX segment and
  # section table claim file-backed bytes beyond EOF.
  - id: truncated-arm-rx-load-image
    desc: ARM ELF truncated RX load and section table
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/arch/iot::arm
      - id: metadata/binary/anomaly/format::elf-parse-failure
      - id: metadata/binary/anomaly/program-header::arm-rx-load-exceeds-file
      - id: metadata/binary/anomaly/section-header::elf-unreachable-section-header-table
