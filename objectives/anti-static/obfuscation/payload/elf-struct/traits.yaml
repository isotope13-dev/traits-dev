# ELF Format Anomalies
# Structural issues in ELF binaries that indicate tampering or malware
defaults:
  platforms: [unix, android]
  for: [elf]
  mbc: B0032
  attack: T1027

traits:
  # Tiny file with oversized LOAD segment: the segment claims far more data
  # than the file actually contains. Common in shellcode stagers and crafted ELFs.
  - id: load-segment-exceeds-tiny-file
    desc: Oversized LOAD segment in tiny ELF
    crit: notable
    conf: 0.95
    size_max: 10240
    if:
      id: metadata/binary/header/program::load-segment-exceeds-tiny-file
    unless:
      # A core dump records live memory, and truncated cores are routine: the
      # LOAD segments there claim more bytes than the file holds.
      - id: metadata/binary/header/identity::elf-core-dump
      # Qualcomm split firmware: the `.mdt` carries only the ELF and program
      # headers, the segment bytes live in sibling `.b00`/`.b01` files, and
      # every LOAD therefore points past the end of its own file by design.
      - id: "metadata/binary/layout/member::qcom-mdt-header-without-load-bytes"
  - id: load-segment-exceeds-small-file
    desc: Oversized LOAD segment in small ELF
    crit: suspicious
    conf: 0.90
    size_max: 65536
    if:
      id: metadata/binary/header/program::load-segment-exceeds-small-file
    unless:
      # A core dump records live memory, and truncated cores are routine: the
      # LOAD segments there claim more bytes than the file holds.
      - id: metadata/binary/header/identity::elf-core-dump
      # Qualcomm split firmware: the `.mdt` carries only the ELF and program
      # headers, the segment bytes live in sibling `.b00`/`.b01` files, and
      # every LOAD therefore points past the end of its own file by design.
      - id: "metadata/binary/layout/member::qcom-mdt-header-without-load-bytes"
  # Mid-size on-disk ELF whose LOAD filesz exceeds the file (~640–700 KiB
  # IoT stubs advertising ~800 KiB backed bytes). Elevates the metadata
  # atom for objective-tier composites without catching full UPX images.
  - id: load-segment-exceeds-midsize-file
    desc: Oversized LOAD segment in mid-size ELF
    crit: notable
    conf: 0.92
    size_min: 65536
    size_max: 700000
    if:
      id: metadata/binary/header/program::load-segment-exceeds-midsize-file
    unless:
      # A core dump records live memory, and truncated cores are routine: the
      # LOAD segments there claim more bytes than the file holds.
      - id: metadata/binary/header/identity::elf-core-dump
      # Qualcomm split firmware: the `.mdt` carries only the ELF and program
      # headers, the segment bytes live in sibling `.b00`/`.b01` files, and
      # every LOAD therefore points past the end of its own file by design.
      - id: "metadata/binary/layout/member::qcom-mdt-header-without-load-bytes"
  - id: load-segment-exceeds-compact-file
    desc: ELF LOAD segment exceeds compact file backing
    crit: suspicious
    conf: 0.92
    size_min: 65537
    size_max: 81919
    if:
      id: metadata/binary/header/program::load-segment-exceeds-compact-file
    unless:
      # A core dump records live memory, and truncated cores are routine: the
      # LOAD segments there claim more bytes than the file holds.
      - id: metadata/binary/header/identity::elf-core-dump
      # Qualcomm split firmware: the `.mdt` carries only the ELF and program
      # headers, the segment bytes live in sibling `.b00`/`.b01` files, and
      # every LOAD therefore points past the end of its own file by design.
      - id: "metadata/binary/layout/member::qcom-mdt-header-without-load-bytes"
  # Large executable ELF section whose name contains uppercase letters.
  # Standard Linux toolchains produce only lowercase section names (.text, .plt,
  # .data, etc.). An executable section with uppercase in its name — combined
  # with near-maximum entropy and substantial size — is characteristic of
  # metamorphic packers that generate synthetic section tables (.eDM0/.eDM1 etc.).

  - id: uppercase-exec-section
    desc: "high-entropy EXE section w/ uppercase name"
    crit: notable
    conf: 0.88
    platforms: [unix]
    if:
      type: section
      regex: "[A-Z]"
      entropy_min: 7.5
      length_min: 65536
      executable: true
    unless:
      - type: section
        regex: "^(UPX\\d|\\.upx)"

composite_rules:
  # An unusual entry point, dominant section, sparse strings and mprotect
  # together are worth reviewing, but do not by themselves prove unpacking.
  - id: metamorphic-packed-elf
    desc: ELF unusual entry, sparse strings, mprotect
    crit: suspicious
    conf: 0.95
    size_min: 524288
    attack: T1027.002
    all:
      - id: metadata/binary/section/header::elf-entry-outside-code-section-set
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
      - id: metadata/binary/layout/strings::large-binary-max-string-at-most-40
      - id: metadata/binary/layout/strings::short-average-strings-large-binary
      - id: micro-behaviors/mem/protect/modify/api-reference::mprotect-import
    unless:
      - id: metadata/binary/section/label/packing::upx-section
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/lang/compiler/systems::go-binary

  - id: mips-sectionless-truncated-load-image
    desc: MIPS sectionless loader with an out-of-file LOAD image
    crit: hostile
    conf: 0.98
    mbc: "F0001"
    attack: "T1027.002,T1620"
    all:
      - id: objectives/anti-static/pack/detect::mips-sectionless-high-entropy-sparse-loader
      - id: load-segment-exceeds-compact-file

  # Sectionless high-entropy ARM ELF whose LOAD filesz exceeds the mid-size
  # on-disk image — truncated/packed IoT agents (entry VA past EOF, zero
  # DT_NEEDED). Distinct from pack/detect::sectionless-arm-packed-loader,
  # which keys on large-load-on-compact-artifact rather than midsize truncate.
  - id: sectionless-arm-midsize-truncated-load
    desc: Sectionless ARM ELF LOAD exceeds mid-size file backing
    crit: hostile
    conf: 0.97
    mbc: "F0001"
    attack: "T1027.002"
    platforms: [linux]
    size_min: 600000
    size_max: 700000
    all:
      - id: metadata/binary/section/header::no-section-headers
      - id: metadata/arch/arm::arm
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: load-segment-exceeds-midsize-file
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"

  - id: sectionless-stripped-xor-credential-elf
    desc: Sectionless stripped ELF with XOR-hidden IoT credential table
    crit: hostile
    conf: 0.98
    platforms: [linux]
    attack: T1027,T1110.001
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::xor-encoded-iot-credential-table
      - id: metadata/binary/linking/records::elf-linker-metadata-and-full-symbol-table-absent
      - id: metadata/binary/section/header::elf-comment-section-absent
    any:
      - id: metadata/binary/section/header::elf64-zero-section-header-offset
      - id: metadata/binary/section/header::elf32-zero-section-header-offset

  - id: sectionless-stripped-iot-http-loader
    desc: Stripped tiny ELF fetches IoT HTTP payload with loader filename
    crit: hostile
    conf: 0.98
    platforms: [linux, unix]
    size_max: 8192
    attack: T1027,T1105
    all:
      - id: metadata/binary/layout/size::tiny-elf
      - id: metadata/binary/section/header::elf-comment-section-absent
      - id: metadata/binary/linking/records::elf-linker-metadata-and-full-symbol-table-absent
      - id: micro-behaviors/communications/http/get::binary-get-path
      - id: micro-behaviors/fs/path/basename::mirai-loader-filename-reference
