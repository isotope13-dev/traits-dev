# ELF Format Anomalies
# Structural issues in ELF binaries that indicate tampering or malware
defaults:
  platforms: [unix, android]
  for: [elf]
  mbc: B0001
  attack: T1027

traits:
  # Tiny file with oversized LOAD segment: the segment claims far more data
  # than the file actually contains. Common in shellcode stagers and crafted ELFs.
  - id: load-segment-exceeds-tiny-file
    desc: Oversized LOAD segment in tiny ELF
    crit: notable
    conf: 0.95
    size_max: 10240
    if:
      id: metadata/binary/anomaly/program-header::load-segment-exceeds-tiny-file
  - id: load-segment-exceeds-small-file
    desc: Oversized LOAD segment in small ELF
    crit: suspicious
    conf: 0.90
    size_max: 200000
    if:
      id: metadata/binary/anomaly/program-header::load-segment-exceeds-small-file
  # Mid-size on-disk ELF whose LOAD filesz exceeds the file (~640–700 KiB
  # IoT stubs advertising ~800 KiB backed bytes). Elevates the metadata
  # atom for objective-tier composites without catching full UPX images.
  - id: load-segment-exceeds-midsize-file
    desc: Oversized LOAD segment in mid-size ELF
    crit: suspicious
    conf: 0.92
    size_min: 65536
    size_max: 700000
    if:
      id: metadata/binary/anomaly/program-header::load-segment-exceeds-midsize-file
  - id: load-segment-exceeds-compact-file
    desc: ELF LOAD segment exceeds compact file backing
    crit: suspicious
    conf: 0.92
    size_max: 81919
    if:
      id: metadata/binary/anomaly/program-header::load-segment-exceeds-compact-file
  # ELF entry point resolves to a non-.text section.
  # Legitimate compilers always place _start in .text; metamorphic/packed ELFs
  # set entry into custom sections to hide the unpacking stub from disassemblers.
  - id: entry-not-in-text
    desc: ELF entry point outside .text section
    crit: suspicious
    conf: 0.88
    if:
      type: metrics
      field: elf.entry_not_in_text
      min: 1
    unless:
      - type: basename
        regex: ^ld\.so(\.[0-9]{1,3})?$
      - type: section
        regex: "^(UPX\\d|\\.upx)"
      - id: metadata/lang/compiler/systems::go-binary
      - id: objectives/evasion/hijack-execution-flow/linker/
      - id: metadata/binary/linking/static/
    downgrade:
      any:
        - type: basename
          regex: \.so$

  # Large executable ELF section whose name contains uppercase letters.
  # Standard Linux toolchains produce only lowercase section names (.text, .plt,
  # .data, etc.). An executable section with uppercase in its name — combined
  # with near-maximum entropy and substantial size — is characteristic of
  # metamorphic packers that generate synthetic section tables (.eDM0/.eDM1 etc.).
  - id: uppercase-exec-section
    desc: "high-entropy EXE section w/ uppercase name"
    crit: notable
    conf: 0.88
    platforms: [unix]
    if:
      type: section
      regex: "[A-Z]"
      entropy_min: 7.5
      length_min: 65536
      executable: true
    unless:
      - type: section
        regex: "^(UPX\\d|\\.upx)"

  # Component-level building block for the metamorphic-packed-elf composite.
  # Records that the entry point is outside the standard .text section without
  # rendering a verdict — the composite rule decides what it means in context.
  - id: elf-nonstandard-entry
    desc: ELF entry in non-standard section
    crit: notable
    conf: 0.7
    if:
      id: objectives/anti-static/obfuscation/payload/elf-struct::entry-not-in-text

composite_rules:
  # All structural tampering signals combined: entry point hijacked out of .text,
  # section table claims more bytes than the file holds (fabricated headers),
  # all strings near-noise (encrypted payload), mprotect to flip memory
  # executable at runtime (the unpack stub). Uses lower-level building blocks
  # rather than suspicious-level composites so this hostile finding surfaces
  # alongside the individual suspicious signals.
  - id: metamorphic-packed-elf
    desc: Metamorphic ELF with entry hijack, fabricated sections, and runtime unpacking
    crit: hostile
    conf: 0.95
    size_min: 524288
    attack: T1027.002
    all:
      - id: elf-nonstandard-entry
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::dominant-section
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::sparse-strings-large-binary
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::noisy-avg-string-length
      - id: micro-behaviors/mem/protect/modify::mprotect-import
    unless:
      - id: metadata/binary/section/names::upx-section
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/lang/compiler/systems::go-binary

  - id: mips-sectionless-truncated-load-image
    desc: MIPS sectionless loader with an out-of-file LOAD image
    crit: hostile
    conf: 0.98
    mbc: "F0001"
    attack: "T1027.002,T1620"
    all:
      - id: objectives/anti-static/pack/detect::mips-sectionless-high-entropy-sparse-loader
      - id: load-segment-exceeds-compact-file

  # Sectionless high-entropy ARM ELF whose LOAD filesz exceeds the mid-size
  # on-disk image — truncated/packed IoT agents (entry VA past EOF, zero
  # DT_NEEDED). Distinct from pack/detect::sectionless-arm-packed-loader,
  # which keys on large-load-on-compact-artifact rather than midsize truncate.
  - id: sectionless-arm-midsize-truncated-load
    desc: Sectionless ARM ELF LOAD exceeds mid-size file backing
    crit: hostile
    conf: 0.97
    mbc: "F0001"
    attack: "T1027.002"
    platforms: [linux]
    size_min: 600000
    size_max: 700000
    all:
      - id: objectives/anti-static/pack/detect::no-section-headers
      - id: metadata/arch/iot::arm
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: load-segment-exceeds-midsize-file
      - id: metadata/binary/linking/static::elf-needed-libs-zero
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/
