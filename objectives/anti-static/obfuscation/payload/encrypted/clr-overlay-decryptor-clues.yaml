# CLR layout, overlay and API names do not establish decryption or execution.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
composite_rules:
- id: clr-missing-metadata-overlay-decryptor-clues
  for:
  - pe
  desc: CLR metadata anomaly, overlay and decryptor name
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/lang/compiler/managed::clr-runtime-header
  - id: metadata/binary/section/header::pe-il-only-without-clr-metadata
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
  - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readallbytes-token
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  unless:
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: metadata/installer/product/
