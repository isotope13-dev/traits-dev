# Static-analysis concealment through an in-section padded loader.
# The measurements can indicate an unusually compact native loader, but do
# not establish that it performs manual API resolution or hides a payload.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: in-section-padded-pe-loader
    desc: Unsigned PE with little code, sparse imports, PEB access, and large resources
    crit: suspicious
    conf: 0.95
    attack: T1027.001,T1027.002
    mbc: F0001
    all:
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/binary/resource/size::oversized-rsrc
    needs: 2
