# Static-analysis concealment through an in-section padded loader.
# The measurements are neutral on their own; the composite requires the
# minimal native stub and manual API resolution before inferring packing.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: in-section-padded-pe-loader
    desc: PE hides a loader behind in-section payload padding
    crit: hostile
    conf: 0.95
    attack: T1027.001,T1027.002
    mbc: F0001
    all:
      - id: metadata/binary/metrics/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: micro-behaviors/os/env/access::peb-access-x64
      - id: metadata/binary/layout::pe-no-signature-record
    any:
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
      - id: metadata/binary/resource::large-high-entropy-rsrc-section
      - id: metadata/binary/resource::oversized-rsrc
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/framework/
