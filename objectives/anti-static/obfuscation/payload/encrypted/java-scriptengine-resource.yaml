defaults:
  for: [jar, class, java_class]
  platforms: [windows, unix]
  attack: T1027,T1140,T1059

composite_rules:
  - id: obfuscated-jar-resource-script-evaluation
    desc: Obfuscated JAR evaluates an opaque resource
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-name::java-obfuscated-class-engine-profile
      - id: micro-behaviors/data/embedded/payload/resource::java-class-getresourceasstream
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-eval-import
      - id: metadata/archive/compression::jar-opaque-compression-ratio
