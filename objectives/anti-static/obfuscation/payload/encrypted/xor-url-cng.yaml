# The concealed URL and download/decryption APIs co-occur. There is no bound
# payload handoff or executable-payload evidence, so do not claim staging,
# activation, command-and-control, or hostile intent from these facts alone.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027,T1140

composite_rules:
  - id: xor-url-http-cbc-decryption
    desc: Concealed HTTP URL with download and CBC-decryption APIs
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
      - id: micro-behaviors/communications/url/encoded::binary-xor-http-url
    unless:
      - id: metadata/signed/platform/
