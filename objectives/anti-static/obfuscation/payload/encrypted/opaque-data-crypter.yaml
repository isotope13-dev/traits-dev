defaults:
  platforms: [windows]
  for: [data]
  size_min: 65536
  size_max: 2097152
  attack: T1027.013
  mbc: F0001

composite_rules:
  - id: opaque-data-feedback-xor-crypter
    desc: Opaque data feedback-XOR crypter payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-feedback-xor-decoder-edi
      - id: metadata/file/data-blob::very-high-entropy-data-file
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k

  # A private ENC<n> container header in front of a cipher-entropy body is a
  # crypter's output file: the loader that decrypts it ships separately, so the
  # blob itself has no legitimate reader to identify. Not size-capped like the
  # shellcode carriers above, since staged payloads run to tens of MB.
  - id: opaque-data-custom-enc-container
    desc: Custom-header encrypted opaque payload container
    crit: suspicious
    conf: 0.9
    platforms: [windows, linux, macos]
    size_max: 268435456
    all:
      - id: metadata/file/magic/identity::custom-enc-container-header
      - id: metadata/file/data-blob::very-high-entropy-data-file
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k
