# A JavaScript FFI shellcode runner that also carries a block cipher keeps its
# stage encrypted at rest and decrypts it only into the RWX buffer. SocGholish's
# trojanized Figma keystorage.js holds a 7.6 MB AES-256-CBC blob as an
# obfuscator.io arithmetic array (about 207 MB of source) and runs the
# plaintext with koffi-bound VirtualAlloc, RtlMoveMemory, and CreateThread.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1027.013,T1140

composite_rules:
  - id: aes-stage-ffi-shellcode-runner
    desc: Decrypts an AES stage for an FFI shellcode runner
    crit: hostile
    conf: 0.96
    ref: https://adamnet.works/blog/socgholish-trojanized-figma-rust-tor-backdoor/
    all:
      - id: objectives/execution/payload/memory-branch/shellcode/source::ffi-prototype-alloc-copy-thread
    any:
      - id: micro-behaviors/crypto/decrypt/initialize::createdecipheriv-any-form
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
      - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash
