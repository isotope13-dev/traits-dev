# A DOS image that decodes its own body in place: a loop reads each byte with
# a CS-prefixed load, XORs it with 0xFF, stores it back, and steps SI. The
# stub is a complete decode loop and is specific to this shape.
defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 131072
  attack: T1027
  mbc: B0032

traits:
  - id: dos-ff-self-decrypt-loop
    desc: XOR 0xFF self-decrypt loop in DOS image
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "BE ?? ?? B9 ?? ?? 2E 8A 04 34 FF 2E 88 04 46 E2 F5"
