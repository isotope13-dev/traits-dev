# Runtime-decrypted string pools in compact native ELFs. The shape is more
# specific than "uses ChaCha": ciphertext dominates .rodata, the plaintext
# surface is unusually short. This remains suspicious rather than hostile
# because commercial protectors can use the same design.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027
  mbc: F0001

composite_rules:
  - id: native-chacha-runtime-string-table
    desc: Compact ELF carries a runtime-decrypted ChaCha string table
    crit: suspicious
    conf: 0.97
    size_min: 16384
    all:
      - id: metadata/binary/section/metrics::high-entropy-rodata
      - id: micro-behaviors/crypto/symmetric/stream::chacha-salsa-constant
      - id: metadata/hardening/layout::stripped
      - id: metadata/binary/metrics/structural::native-short-readable-string-surface
      - id: metadata/binary/metrics/structural::elf-at-most-two-needed-libraries
    unless:
      - id: metadata/binary/framework/
      - id: well-known/lib/

  # Why this shape is worth a rule of its own.
  #
  # The ruleset already detects what this family *does*: the Tor Expert Bundle
  # bootstrap, AllowSingleHopCircuits, the .onion C2, credential directories,
  # systemd/cron/launchd persistence, TracerPid anti-debug. Every one of those
  # traits matches the sample's plaintext. Encrypting the string table with a
  # per-string ChaCha20 key defeats all of them at once, leaving only the
  # binary's structural shape visible.
  #
  # So compose the shape. A compact stripped ELF whose entire .rodata is an
  # encrypted string table, which then checks its own privilege level (to pick
  # system- vs user-scope install), resolves its own path (to copy itself), and
  # runs concurrent workers over a socket, is an implant profile — the content
  # is hidden but the scaffolding around it cannot be.
  #
  # Referencing these baseline atoms also rescues them into the rendered output,
  # so an analyst sees the privilege check and self-path resolution that the
  # low-tier strip would otherwise hide.
  - id: encrypted-string-table-privileged-native-implant
    desc: Encrypted-string native implant checks privilege and self-path
    crit: hostile
    conf: 0.96
    attack: T1027,T1055,T1543
    all:
      - id: native-chacha-runtime-string-table
      - id: micro-behaviors/os/privilege/query::geteuid
      - id: micro-behaviors/fs/link/symlink::readlink
    any:
      - id: micro-behaviors/process/threading/concurrency::pthread
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/fs/attributes/xattr::setxattr-func
    needs: 2
