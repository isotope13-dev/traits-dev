# Runtime-decrypted string pools in compact native ELFs. The shape is more
# specific than "uses ChaCha": ciphertext dominates .rodata, the plaintext
# surface is unusually short. This remains suspicious rather than hostile
# because commercial protectors can use the same design.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027
  mbc: F0001

composite_rules:
  - id: native-chacha-runtime-string-table
    desc: Compact ELF carries a runtime-decrypted ChaCha string table
    crit: suspicious
    conf: 0.97
    size_min: 16384
    all:
      - id: metadata/binary/section/metrics::high-entropy-rodata
      - id: micro-behaviors/crypto/symmetric/stream::chacha-salsa-constant
      - id: metadata/hardening/layout::stripped
      - id: metadata/binary/metrics/structural::native-short-readable-string-surface
      - id: metadata/binary/metrics/structural::elf-at-most-two-needed-libraries
    unless:
      - id: metadata/binary/framework/
      - id: well-known/lib/
