# Opaque data in compact native ELFs. This shape is more specific than merely
# using ChaCha: high-entropy .rodata dominates while the readable string
# surface stays unusually short. It does not claim which cipher protects the
# opaque data because a binary may use ChaCha for an unrelated protocol.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027
  mbc: F0001

composite_rules:
  - id: compact-opaque-chacha-rodata-profile
    desc: Compact stripped ELF has opaque rodata and a ChaCha constant
    crit: suspicious
    conf: 0.97
    size_min: 16384
    all:
      - id: metadata/binary/section/metrics::high-entropy-rodata
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: metadata/hardening/layout::stripped
      - id: metadata/binary/metrics/structural::native-short-readable-string-surface
      - id: metadata/binary/metrics/structural::elf-at-most-two-needed-libraries
    unless:
      - id: metadata/binary/framework/
      - id: well-known/lib/

  # Opaque rodata can hide the content that ordinarily anchors an implant.
  # Privilege checks, self-path resolution, and multiple worker/socket/xattr
  # mechanics remain visible and supply the intent legs for this profile.
  - id: opaque-chacha-privileged-native-implant
    desc: Opaque-ChaCha native implant checks privilege and self-path
    crit: hostile
    conf: 0.96
    attack: T1027,T1055,T1543
    all:
      - id: compact-opaque-chacha-rodata-profile
      - id: micro-behaviors/os/privilege/query::geteuid
      - id: micro-behaviors/fs/link/symlink::readlink
    any:
      - id: micro-behaviors/process/threading/concurrency::pthread
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/fs/attributes/xattr::setxattr-func
    needs: 2
