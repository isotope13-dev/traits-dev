defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1027.009,T1140

composite_rules:
  - id: hashed-api-strided-payload-loader
    desc: Random-section hashed-API XOR payload loader
    conf: 0.99
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-strided-repeating-key-xor-loop
      - id: micro-behaviors/os/api-resolution/manual::x64-pe-export-directory-walk-packed-stub
      - id: micro-behaviors/os/api-resolution/digest-export/hash::shift-add-33-hash-packed-stub-x64
      - id: micro-behaviors/process/config/launch::indirect-detached-process-group-x64
      - id: metadata/binary/section/layout::many-nonstandard-section-names
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    unless:
      - id: metadata/installer/product/
  - id: obfuscated-runtime-api-dropper
    desc: Obfuscated native dropper with runtime API resolution and file staging
    conf: 0.98
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-mask-xor-buffer-loop
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/fs/file/open/unspecified::createfile-api-text-reference
      - id: micro-behaviors/fs/write/file/handle/unspecified::writefile-api-text-reference
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    unless:
      - id: metadata/installer/product/
  - id: tls-api-resolved-wx-loader
    desc: Encrypted native loader with TLS callbacks and runtime API resolution
    conf: 0.98
    arch: [x86-64]
    attack: T1027,T1055,T1057
    all:
      - id: micro-behaviors/mem/protect/modify/api-reference::integer-loads-protection-thread-apis
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    unless:
      - id: metadata/installer/product/
