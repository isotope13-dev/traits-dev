defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1027.009,T1140

composite_rules:
  - id: hashed-api-strided-payload-loader
    desc: Random-section hashed-API XOR payload loader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-strided-repeating-key-xor-loop
      - id: micro-behaviors/os/api-resolution/manual::x64-pe-export-directory-walk-packed-stub
      - id: micro-behaviors/os/api-resolution/hash-based::shift-add-33-hash-packed-stub-x64
      - id: micro-behaviors/process/create/flags::indirect-detached-process-group-x64
      - id: metadata/binary/section/metrics::many-nonstandard-section-names
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/

  - id: obfuscated-runtime-api-dropper
    desc: Obfuscated native dropper with runtime API resolution and file staging
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-mask-xor-buffer-loop
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/fs/file/open::createfile-api-text-reference
      - id: micro-behaviors/fs/file/write/direct::writefile-api-text-reference
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/

  - id: tls-api-resolved-wx-loader
    desc: Encrypted native loader with TLS callbacks and runtime API resolution
    crit: hostile
    conf: 0.98
    arch: [x86-64]
    attack: T1027,T1055,T1057
    all:
      - id: micro-behaviors/mem/protect/modify::rw-to-rx-protection-with-thread-start
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
      - id: metadata/binary/section/metrics::high-entropy-rdata-section
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
