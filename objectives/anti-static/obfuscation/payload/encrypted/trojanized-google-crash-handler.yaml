# Shipped Google crash handlers are signed, run as invoker and have ordinary
# code entropy. An unsigned build with that PDB, near-random .text and a
# requireAdministrator manifest hides its real code in the image (Petya).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027

composite_rules:
  - id: unsigned-google-crash-handler-encrypted-text-elevation
    desc: Unsigned Google crash-handler build hides encrypted code
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/debug::google-crash-handler-pdb-stem
      - id: metadata/binary/section/entropy::high-entropy-text
      - id: metadata/build/manifest::pe-requires-admin
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
