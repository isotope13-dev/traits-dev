defaults:
  platforms: [windows]
  for: [asp]
  attack: T1027,T1505.003

composite_rules:
  # Session-key initialization and runtime reachability remain outside this
  # matcher. It detects the concealed-code pattern even in broken implants.
  - id: asp-cyclic-xor-with-script-execute
    desc: ASP request reader combines cyclic-key XOR and Execute
    crit: suspicious
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
      - id: micro-behaviors/crypto/symmetric/xor/loop::vbs-byte-xor-cyclic-string-key
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
