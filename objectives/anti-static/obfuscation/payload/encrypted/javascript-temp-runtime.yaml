defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1027,T1140

traits:
  - id: node-writes-temporary-script
    desc: Node writes a randomly named temp script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/tmp/[^\n]{0,80}Math\.random[\s\S]{0,200}writeFileSync\('

  - id: node-executes-bun-script
    desc: Node invokes Bun to run a script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'execSync\([^\n]{0,120}bun run'

composite_rules:
  - id: encrypted-stage-temporary-bun-execution
    desc: Encrypted stage is written to a temporary script and run with Bun
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/execution/payload/script-eval/transformed/direct::aes-gcm-hex-stage-indirect-eval
      - id: node-writes-temporary-script
      - id: node-executes-bun-script
