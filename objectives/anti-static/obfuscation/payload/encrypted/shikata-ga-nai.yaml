defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  attack: T1027
  mbc: B0032
traits:
  - id: shikata-ga-nai-stub
    desc: Shikata Ga Nai FPU GetPC decoder stub
    crit: suspicious
    conf: 0.9
    attack: T1027.002
    mbc: B0032.009
    if:
      type: hex
      # Shikata's polymorphic prologue obtains EIP with fnstenv and pops it
      # into any general-purpose register. Payload implants are often placed
      # in an appended executable section rather than the linker's .text.
      pattern: 'D9 74 24 F4 (58|59|5A|5B|5D|5E|5F)'
      offset_range: [0, null]
