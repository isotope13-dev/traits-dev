defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  attack: T1027,T1140,T1059.007

composite_rules:
  - id: wsh-xor-decoded-hidden-stage
    for: [javascript]
    desc: WSH XOR-decodes a self-read payload and launches it hidden
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/fs/read/file/handle::open-text-file-read
      - id: micro-behaviors/data/decode/custom::js-hex-xor-character-decode
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text

  - id: rc4-obfuscated-wsh-encrypted-powershell-stage
    for: [javascript]
    desc: RC4-obfuscated WSH hides a decrypting PS stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-prga-output
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/interpreter/eval/compile::encoded-powershell-scriptblock-constructor
