# ASPack's own unpacking stub explains sparse dynamic imports and writable
# executable sections, so those properties alone must not convict it. This
# loader is different: a near-random .rsrc occupies almost the entire image,
# while the VB6 program and ASPack stub are only a thin execution wrapper. The
# unpacked VB6 code decrypts that resource and invokes it through
# CallWindowProcW. Family-specific resource names are intentionally kept in the
# corresponding well-known/ rule rather than used to manufacture this behavior.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1027.009,T1620
  mbc: F0001

composite_rules:
  - id: aspack-vb6-opaque-resource-loader
    desc: ASPack VB6 loader carries a dominant encrypted resource
    crit: hostile
    conf: 0.999
    all:
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
      - id: metadata/binary/section/permission::dominant-high-entropy-rsrc-section
      - id: objectives/anti-static/pack/runtime::pe-import-count-under-10
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
