# Embedded payload whose decoder sabotages itself under observation.
#
# The shape: a string blob is carried inside the script, run through a
# non-standard alphabet (so `base64 -d` on the literal returns noise), turned
# back into characters, and — critically — the routine times itself and XORs
# the result buffer when the elapsed time says it was single-stepped. That
# last step has no engineering purpose. A benign decoder that cares about
# speed logs or caches the measurement; it does not rewrite its own plaintext,
# because the only party a corrupted result inconveniences is someone reading
# it at a breakpoint. Combined with an obfuscator string table, the blob is a
# concealed payload (a stage URL, a key, a command) rather than program data.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1497.003
  mbc: B0032

composite_rules:
  - id: anti-debug-guarded-embedded-payload-decode
    desc: Embedded payload decode sabotaged under a debugger
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: objectives/anti-analysis/timing/evasion::timing-gated-decode-corruption
      - id: micro-behaviors/data/decode/base64::lower-first-base64-alphabet
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
