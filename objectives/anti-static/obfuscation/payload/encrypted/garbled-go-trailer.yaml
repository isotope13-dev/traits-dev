defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: garbled-go-stack-strings-opaque-trailer
    desc: Garbled Go stack strings with opaque trailer
    crit: hostile
    conf: 0.96
    attack: T1027,T1027.009
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: micro-behaviors/data/string/assembly::many-stack-materialized-strings
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: metadata/binary/layout/overlay::high-entropy-overlay
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
