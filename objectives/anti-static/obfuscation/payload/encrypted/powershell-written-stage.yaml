defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-encrypted-written-child-stage
    desc: Encoded blob, decryptor and Node script staging
    crit: suspicious
    conf: 0.96
    attack: T1027,T1140
    all:
      - id: metadata/file/encoding/base64::powershell-large-base64-literal
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/crypto/decrypt::powershell-create-decryptor-call
      - id: micro-behaviors/process/deploy/file-exec::powershell-written-node-script-launch
