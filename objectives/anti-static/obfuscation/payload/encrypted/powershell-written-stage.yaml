defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1140
composite_rules:
  - id: powershell-encrypted-written-child-stage
    desc: Encoded blob, decryptor and Node script staging
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/encoding/base64::powershell-large-base64-literal
      - id: micro-behaviors/data/decode/base64/call::powershell-frombase64string
      - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
      - id: micro-behaviors/process/deploy/file-exec/spawn::powershell-written-node-script-launch
  - id: powershell-reassembled-encrypted-write
    desc: Indexed string reassembly with decryption and text staging
    crit: suspicious
    all:
      - id: micro-behaviors/data/string/concat/join::powershell-indexed-foreach-join
      - id: micro-behaviors/crypto/decrypt/transform/call::powershell-base64-decryption-cooccurrence
      - id: micro-behaviors/fs/write/file/full/string::expression-static-write-all-text
