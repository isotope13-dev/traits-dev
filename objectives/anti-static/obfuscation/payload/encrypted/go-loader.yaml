defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: custom-decryptor-method-symbol
    desc: Application-defined decryptor method symbol
    crit: component
    conf: 0.96
    attack: T1140
    if:
      type: hex
      section: .rdata
      pattern: 6D 61 69 6E 2E 64 65 63 46 75 6E 63

composite_rules:
  - id: anti-analysis-gated-go-encrypted-loader
    desc: Anti-analysis-gated Go loader with an AES decryption stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1497,T1622
    all:
      - id: objectives/anti-analysis/environment-detect/checks::enabled-anti-analysis-config
      - id: custom-decryptor-method-symbol
      - id: micro-behaviors/crypto/symmetric/aes/library::go-internal-aes-ctr-string
