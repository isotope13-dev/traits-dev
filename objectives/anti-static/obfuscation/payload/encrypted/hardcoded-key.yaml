# Hardcoded-key + ciphertext co-located in a single source module.
#
# Real encryption protects content from someone who doesn't have the key.
# When the key, salt, and ciphertext are all declared as module-level
# constants in the same file, the AES layer is not protecting anything —
# it's obfuscation, designed to keep a static analyser from reading the
# payload. The pattern has no benign use case for shipped library code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  attack: T1027.013
  mbc: B0032
traits:
  - id: js-passphrase-literal-const
    desc: Literal crypto key or passphrase
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^(const|let|var) +(KEY|PASSPHRASE) *= *["''][^"'']{6,80}["'']'
  - id: js-prefixed-crypto-key-name
    desc: Encryption key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: ENCRYPTION_KEY
      case_insensitive: true
  - id: js-decryption-key-name
    desc: Decryption key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: DECRYPTION_KEY
      case_insensitive: true
  - id: js-cipher-key-name
    desc: Cipher key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: CIPHER_KEY
      case_insensitive: true
  - id: js-crypto-key-name
    desc: Crypto key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: CRYPTO_KEY
      case_insensitive: true
  - id: js-hmac-key-name
    desc: HMAC key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: HMAC_KEY
      case_insensitive: true
  - id: js-secret-key-name
    desc: Secret key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: SECRET_KEY
      case_insensitive: true
  - id: js-signing-key-name
    desc: Signing key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: SIGNING_KEY
      case_insensitive: true
  - id: js-salt-literal-const
    desc: Module-level salt string constant
    crit: component
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^\s*(const|let|var)\s+\w*(SALT|AES_SALT)\w*\s*=\s*["''][^"'']{4,80}["'']'
  - id: py-passphrase-literal-assign
    desc: Module-level passphrase string in Python
    crit: component
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '(?im)^[A-Za-z_][A-Za-z0-9_]*(KEY|PASSPHRASE)[A-Za-z0-9_]*\s*=\s*["''][^"'']{6,80}["'']'
  - id: aes-gcm-triplet-blob
    desc: AES-GCM iv:tag:data base64 triplet
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[A-Za-z0-9+/]{12,32}={0,2}:[A-Za-z0-9+/]{16,32}={0,2}:[A-Za-z0-9+/]{200,}={0,2}'
  - id: js-final-encoded-text-const
    desc: '*FINAL_ENCODED* constant declaration'
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^\s*(const|let|var)\s+\w*FINAL_ENCODED\w*\s*='
  - id: js-ciphertext-const
    desc: Ciphertext variable declaration
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    # Require a literal RHS. Runtime crypto code often names the result of an
    # encrypt() call `ciphertext`; the obfuscated-payload marker is a hardcoded
    # blob assigned directly to a constant.
    if:
      type: text
      regex: '(?im)^\s*(const|let|var)\s+\w*CIPHERTEXT\w*\s*=\s*["'']'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture/
  - id: js-encrypted-text-const
    desc: '*ENCRYPTED_TEXT* constant declaration'
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^\s*(const|let|var)\s+\w*ENCRYPTED_TEXT\w*\s*='
  - id: js-payload-blob-const
    desc: '*PAYLOAD_BLOB* constant declaration'
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^\s*(const|let|var)\s+\w*PAYLOAD_BLOB\w*\s*='
    not:
      - regex: 'createOneDSPayload|_DYN_PAYLOAD_BLOB|_DYN_CREATE_ONE_DSPAYLOAD'
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure::js-webpack-bundle
  - id: py-final-encoded-text-const
    desc: '*FINAL_ENCODED* constant declaration'
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '(?im)^\s*\w*FINAL_ENCODED\w*\s*=\s*[a-zA-Z]{0,2}["'']'
  - id: py-ciphertext-const
    desc: '*CIPHERTEXT* constant declaration'
    crit: notable
    conf: 0.85
    for: [python]
    # Require a literal RHS: the obfuscation pattern is a constant assigned to an
    # encoded blob (CIPHERTEXT = "base64..."), not live crypto where a local like
    # `ciphertext_and_tag = aesccm.encrypt(...)` is assigned a function result.
    if:
      type: text
      regex: '(?m)^\s*\w*CIPHERTEXT\w*\s*=\s*[a-zA-Z]{0,2}["'']'
    unless:
    - id: well-known/tool/detection/malware-config-parser
  - id: py-encrypted-text-const
    desc: '*ENCRYPTED_TEXT* constant declaration'
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '(?im)^\s*\w*ENCRYPTED_TEXT\w*\s*=\s*[a-zA-Z]{0,2}["'']'
  # Hardcoded passphrase digested into AES key material. The three legs of that
  # chain -- `createHash('sha256')`, `.update("literal")`, `.digest()` -- are
  # neutral hashing mechanics, so they live in micro-behaviors/crypto/hash/digest/
  # and are referenced cross-tier by the composite below. Filing them here named
  # them for the composite they feed rather than for what they match.
composite_rules:
  - id: js-sha256-literal-passphrase-digest
    desc: SHA-256 digests a literal passphrase
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_lines: 6
    all:
      - id: micro-behaviors/crypto/hash/digest::javascript-sha256-operation
      - id: micro-behaviors/crypto/hash/digest::digest-update-string-literal
      - id: micro-behaviors/crypto/hash/digest::digest-method-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure::js-large-module-bundle
  - id: hardcoded-key-with-large-blob
    desc: Hardcoded key sits beside large ciphertext blob
    crit: hostile
    conf: 0.97
    near_lines: 80
    any:
      - id: js-passphrase-literal-const
      - id: js-prefixed-crypto-key-name
      - id: js-decryption-key-name
      - id: js-cipher-key-name
      - id: js-crypto-key-name
      - id: js-hmac-key-name
      - id: js-secret-key-name
      - id: micro-behaviors/crypto/asymmetric/key::private-key-identifier
      - id: js-signing-key-name
      - id: js-salt-literal-const
      - id: py-passphrase-literal-assign
      - id: js-sha256-literal-passphrase-digest
    all:
      - id: ciphertext-blob-present
  - id: named-large-ciphertext-blob
    desc: Large encoded literal assigned to a ciphertext variable
    crit: component
    near_lines: 6
    all:
      - id: micro-behaviors/data/encode/payload::large-encoded-blob-literal
    any:
      - id: js-final-encoded-text-const
      - id: js-ciphertext-const
      - id: js-encrypted-text-const
      - id: js-payload-blob-const
      - id: py-final-encoded-text-const
      - id: py-ciphertext-const
      - id: py-encrypted-text-const
  - id: ciphertext-blob-present
    desc: Explicitly named or structured ciphertext blob
    crit: component
    any:
      - id: aes-gcm-triplet-blob
      - id: named-large-ciphertext-blob
    unless:
      - id: metadata/file/format/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure::js-large-module-bundle
