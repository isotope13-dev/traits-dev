defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: cbc-file-memory-thread-api-clues
    desc: CBC, filename, read and memory/thread API clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/cipher/mode::bcrypt-cbc-mode-references
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/path/data-file::payload-or-stage-data-filename-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/signature/verified/signer::broadcom-inc
