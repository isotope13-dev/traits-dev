# RC4, PE-resource and system-action clues in the same source.
defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - powershell
composite_rules:
- id: source-rc4-resource-security-profile
  desc: Source RC4 and resources with system API clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::source-rc4-implementation
  - id: micro-behaviors/data/embedded/resource::source-pe-resource-access
  any:
  - id: micro-behaviors/os/kernel/driver::kernel-driver-service-configuration
  - id: micro-behaviors/os/registry/value/write::registry-binary-value-write-source
  - id: micro-behaviors/process/inject/thread-context::suspended-child-remote-write-context-apis
