defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009
  mbc: B0032

composite_rules:
  - id: tampered-inno-loader-opaque-stage
    desc: Tampered Inno loader carries an unsigned opaque overlay stage
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1036
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/file/profile/installer/structure::unrecognized-rdlpts-resource-marker
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: metadata/signed/trust-level::unsigned-missing-signature-record

  - id: zero-width-encrypted-inno-overlay-payload
    desc: Zero-width-marked encrypted Inno overlay payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1027.009
    all:
      - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206d
      - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206f
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-keyword

  # REMOVED: malformed-unsigned-inno-crypto-stage. Inno Setup 6.3+ links its
  # PBKDF2/ChaCha20 installer-encryption code into every SetupLdr whether or
  # not the script enables encryption, and the Inno compiler emits an unsigned
  # PE with a zeroed checksum by default. Neither those properties nor a
  # large high-entropy overlay alone establish malicious behavior.

  - id: encrypted-inno-overlay-payload
    desc: Inno installer with large high-entropy overlay
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/profile/installer/structure::inno-550-data-in-overlay
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/entropy::high-entropy-overlay

  - id: encrypted-inno-privileged-reboot-loader
    desc: Inno overlay with reboot and process APIs
    crit: notable
    conf: 0.98
    all:
      - id: encrypted-inno-overlay-payload
      - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
      - id: metadata/binary/symbols/name/process::create-process-a
  # Inno/Delphi SetupLdr skins that append a blank-named high-entropy CODE
  # section (not an overlay) as an opaque payload — common Sonbokli/Babar
  # carriers that steal legit VERSIONINFO (e.g. Light Alloy) to dodge
  # well-known/app/ suppressors keyed on product metadata alone.
  - id: inno-blank-exec-opaque-payload
    desc: Inno stub hides blank-named high-entropy exec payload
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1036.005
    all:
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/section/layout::blank-named-high-entropy-exec-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: metadata/signed/platform/
    # Do not unless light-alloy-inno-installer-context: stolen VERSIONINFO
    # carriers still match that exception, but the blank exec-section leg
    # already excludes real Light Alloy installs.

