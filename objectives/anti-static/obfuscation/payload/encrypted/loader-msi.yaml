defaults:
  crit: hostile
  platforms: [windows]
  for: [oledoc]
  attack: T1027

composite_rules:
  - id: adobe-opaque-wix-msi-masquerade
    desc: Adobe-branded WiX MSI hides a payload in opaque streams
    conf: 0.99
    attack: T1036.005,T1027,T1195.002
    size_min: 10000000
    all:
      - id: metadata/document/office/properties::msi-adobe-acrobat-subject
      - id: metadata/document/office/properties::msi-adobe-acrobat-creator
      - id: metadata/package/files/msi/identity::msi-wix-toolset-branding
      - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster

  # Fires when MSI is routed as OleDoc (pack bytes + entropy visible). The
  # entropy leg uses the canonical OLE-container trait: the former
  # high-entropy-msi-container atom duplicated it under an "MSI" label that
  # misfired on high-entropy Office documents.
  - id: encrypted-native-node-loader-msi
    desc: MSI combines encrypted pack and native loader
    conf: 0.99
    attack: T1027,T1620,T1195.002
    all:
      - id: metadata/package/files/msi/strings::spk2-marker-reference
      - id: metadata/file/entropy::document-overall-entropy-78
      - id: metadata/package/files/msi/strings::msi-boot-node-reference

  # Identity + oversized container — works under MSI routing via
  # for:[all] value atoms (pack bytes are invisible on that path).
