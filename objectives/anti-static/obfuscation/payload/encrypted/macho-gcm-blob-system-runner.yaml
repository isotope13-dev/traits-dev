defaults:
  platforms: [macos]
  for: [macho]
  attack: T1027.013,T1140,T1059.004

composite_rules:
  # Some variants use custom key derivation rather than PBKDF2. A sizable
  # encoded blob, AES-GCM decryption, and a native system() handoff still
  # captures the encrypted command payload without depending on that choice.
  - id: macho-aes-gcm-blob-system-runner
    desc: Mach-O decrypts an encoded blob and runs it with system()
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/crypto/decrypt::aes256-gcm-indirect-decrypt
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/signed/platform/

  # A Mach-O that holds a large Base64-like blob, derives a key with PBKDF2,
  # decrypts with AES-256-GCM and hands the result to system(): the blob is a
  # shell stage kept encrypted until run. Packed stealer droppers use this
  # shape to keep the actual script out of the binary's strings.
  - id: macho-pbkdf2-gcm-blob-system-runner
    desc: Mach-O decrypts an embedded blob and runs it with system()
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2-36-byte-password
      - id: micro-behaviors/crypto/decrypt::aes256-gcm-indirect-decrypt
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/signed/platform/

  # Custom in-binary cryptography may not match the known PBKDF2/AES byte
  # signatures. An encoded blob, sparse import surface, high-entropy code,
  # and system() handoff still identify a concealed shell stage while
  # excluding ordinary embedded assets and normal CLI programs.
  - id: macho-opaque-shell-blob-runner
    desc: Sparse-import Mach-O runs an opaque encoded shell payload
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1059.004,T1105
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: metadata/binary/symbols/count::imports-at-most-50-large-binary
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/signed/platform/
