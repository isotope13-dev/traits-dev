defaults:
  platforms: [macos]
  for: [macho]
  attack: T1027.013,T1140,T1059.004

composite_rules:
  # A Mach-O that holds a large Base64-like blob, derives a key with PBKDF2,
  # decrypts with AES-256-GCM and hands the result to system(): the blob is a
  # shell stage kept encrypted until run. Packed stealer droppers use this
  # shape to keep the actual script out of the binary's strings.
  - id: macho-pbkdf2-gcm-blob-system-runner
    desc: Mach-O decrypts an embedded blob and runs it with system()
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2-36-byte-password
      - id: micro-behaviors/crypto/decrypt::aes256-gcm-indirect-decrypt
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/signed/platform/
