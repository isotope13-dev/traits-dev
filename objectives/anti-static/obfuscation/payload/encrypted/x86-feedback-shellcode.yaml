defaults:
  platforms: [windows]
  for: [data]
  size_min: 65536
  size_max: 2097152
  attack: T1027.013
  mbc: F0001

composite_rules:
  # Either register flavor of the feedback-XOR dword decoder. Generated x86
  # envelopes vary the pop/push registers, and the decoding loop is identical.
  - id: x86-feedback-xor-decoder
    desc: X86 feedback-XOR payload decoder, either register flavor
    crit: suspicious
    conf: 0.995
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-dword-feedback-decoder
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-feedback-xor-decoder-edi
  - id: x86-feedback-xor-self-decoding-shellcode
    desc: X86 rolling-XOR self-decoding shellcode payload
    crit: hostile
    conf: 0.99
    all:
      - id: x86-feedback-xor-decoder
      - id: metadata/file/data-blob::very-high-entropy-data-file
