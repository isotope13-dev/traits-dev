# Concealment pattern: empty executable code combined with a
# cipher-entropy overlay indicates a packed or staged payload.
defaults:
  platforms: [windows]
  attack: T1027

composite_rules:
  - id: embedded-cipher-payload
    desc: Empty code with cipher-entropy overlay
    crit: suspicious
    conf: 0.98
    for: [pe]
    all:
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/layout/overlay::overlay-dominates-third
