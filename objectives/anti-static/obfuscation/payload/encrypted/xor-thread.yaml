defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
composite_rules:
  - id: xor-decoded-rx-thread-payload
    desc: XOR-decoded executable thread payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/decode/xor::x64-four-byte-key-xor-copy-loop
      - id: micro-behaviors/mem/protect/modify::x64-rx-buffer-thread-argument
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/create/thread::create-thread
