# The increment, zero check, skip-zero increment and decoder must refer to the same key byte. This is changing emitted ciphertext, not a claim of machine-code polymorphism.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-changing-key-self-image
    desc: Changes XOR key before emitting own code
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_changing_key_self_image {
          strings:
            $key = { FE 86 ?? ?? 80 BE ?? ?? 00 75 04 FE 86 ?? ?? E8 ?? ?? B4 40 8D 96 ?? ?? B9 ?? ?? CD 21 E8 ?? ?? }
            $decoder = { E8 00 00 5F 81 EF ?? ?? B9 ?? ?? 8A 95 ?? ?? 30 95 ?? ?? 47 E2 F9 C3 }
          condition:
            for any k in (1..#key) : (
              uint16(@key[k]+2) == uint16(@key[k]+6) and
              uint16(@key[k]+2) == uint16(@key[k]+13) and
              for any d in (1..#decoder) : (
                uint16(@key[k]+2) == uint16(@decoder[d]+13) and
                ((@key[k]+18+uint16(@key[k]+16)) % 65536) == @decoder[d] and
                ((@key[k]+32+uint16(@key[k]+30)) % 65536) == @decoder[d]
              )
            )
        }
