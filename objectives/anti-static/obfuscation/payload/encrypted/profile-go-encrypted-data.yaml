defaults:
  platforms:
  - linux
  for:
  - elf
composite_rules:
- id: go-encrypted-name-data-cipher-profile
  desc: Encrypted-file name, Go data and cipher clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/file::payload-enc-filename-text
  - id: metadata/binary/section/size::go-large-noptrdata
  any:
  - id: micro-behaviors/crypto/cipher/mode::go-newgcm-error-string
  - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
