defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-aes-wrapped-script-construction
    desc: Base64/AES decryption with ScriptBlock construction
    # Encryption plus dynamic compilation also occurs in script protectors.
    # These file-scoped observations do not prove decryption-to-eval data flow.
    # AES and CreateDecryptor are atoms: the any-only umbrellas are dropped
    # from findings, so a composite that requires them never sees Aes.Create.
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: metadata/file/encoding::powershell-many-base64-alphabet-lines
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor-text
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-managed
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-csp
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-crypto-namespace
      - id: micro-behaviors/crypto/symmetric/aes/library::rijndael-managed
    needs: 1

  - id: powershell-aes-gzip-wrapped-script-payload
    desc: Base64, AES and gzip feed ScriptBlock
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: metadata/file/encoding::powershell-many-base64-alphabet-lines
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor-text
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-managed
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-csp
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-crypto-namespace
      - id: micro-behaviors/crypto/symmetric/aes/library::rijndael-managed
    needs: 1
