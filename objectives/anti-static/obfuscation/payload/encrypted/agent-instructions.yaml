defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: static-key-file-decryptor-with-inflate
    desc: Static-key decryptor reads files and inflates data
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::node-static-key-decipher
      - id: micro-behaviors/fs/read/file/handle::file-read-api-call
      - id: micro-behaviors/data/decompress/zlib::node-inflate-function

  # Same-file clues: static analysis does not follow the decrypted ZIP through
  # temporary files into the installed prompt. Do not claim that it does, or
  # infer malicious prompt content from encryption alone.
  - id: static-key-decryption-agent-instruction-write
    desc: Static-key decryption accompanies agent instruction writes
    crit: suspicious
    conf: 0.93
    all:
      - id: static-key-file-decryptor-with-inflate
      - id: micro-behaviors/fs/write/agent-config/instructions::node-agent-instruction-path-write
      - id: micro-behaviors/fs/path/agent-config/directory::codex-home-join-argument
