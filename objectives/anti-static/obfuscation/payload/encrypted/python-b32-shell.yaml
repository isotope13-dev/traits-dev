# Base32 is less common than Base64 in Python packages, but it is useful for
# hiding a second-stage shell command in an otherwise ordinary terminal helper.
# The decoder alone is neutral; the hostile composite requires the decoded value
# to feed `/bin/sh -c` through subprocess in the same source neighborhood.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  attack: T1027,T1140,T1059.004
  mbc: B0032,C0043

traits:
  - id: python-base32-shell-command
    desc: Python Base32 payload feeds a shell
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'subprocess\.(run|Popen)\s*\([^\n]{0,100}/bin/(ba)?sh[^\n]{0,100}\.decode\s*\(\)'

composite_rules:
  - id: python-base32-decoded-shell-loader
    desc: Python Base32-decoded shell loader
    crit: hostile
    conf: 0.98
    near_lines: 30
    all:
      - id: micro-behaviors/data/decode/encoded/formats::python-base32-decode
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: python-base32-shell-command
