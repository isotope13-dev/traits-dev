defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

composite_rules:
  - id: importless-writable-image-xor-transform
    desc: Importless writable image with XOR transform
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: micro-behaviors/data/encoding/xor::x86-separated-in-place-dword-xor
      - id: metadata/binary/section/entropy::giant-writable-text-section
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/section/header::pe-entry-in-writable-section
