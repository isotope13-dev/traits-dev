# The AES-wrapped PowerShell stager when the file carries no script extension:
# a large Base64 here-string is decoded, AES-decrypted and compiled into a
# ScriptBlock, so the real payload never appears in the file.
defaults:
  platforms: [windows]
  for: [data]
composite_rules:
  - id: untyped-powershell-aes-wrapped-script-construction
    desc: Base64 and AES decryption accompany ScriptBlock creation
    crit: suspicious
    conf: 0.95
    attack: T1027,T1140
    all:
      - id: metadata/file/encoding::many-base64-alphabet-lines-untyped
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-untyped
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-managed-untyped
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor-untyped
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-untyped
