# An unattributable image whose resource section is one large opaque blob that
# the program itself reads back at runtime.
#
# Storing a payload in .rsrc is the oldest dropper layout there is, and on its
# own it is not evidence of anything: resources are where a normal program keeps
# its icons, dialogs, fonts and media, and it reads them back with exactly these
# four APIs. What separates the two is whether the resources look like assets.
# Icons and dialogs are structured -- directory tables, name strings, palettes,
# padding -- and a quarter-megabyte of them does not average 7.5 bits per byte.
# A section that stays near-random across its whole length is holding one
# ciphertext, and the FindResource/LoadResource/SizeofResource/LockResource
# chain says the program intends to get at it.
#
# The identity leg is what makes the pairing hostile rather than merely odd. A
# real application that ships a compressed asset bundle in its resources is
# still a real application: it signs its build, or at minimum fills in a version
# resource that names it. This one does neither -- the string table is four
# anonymous lowercase tokens and there is no signature record -- so there is no
# account of what the opaque quarter-megabyte is for, from anyone who could be
# held to it.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1027.002
  mbc: F0001

composite_rules:
  - id: anonymous-identity-opaque-resource-carrier
    desc: Anonymous PE reads a near-random resource
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/resource::very-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: objectives/evasion/masquerade/versioninfo::anonymous-token-versioninfo-identity
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      # On a packed image the resource entropy is the packer's compression, not
      # a payload the program keeps for itself -- UPX rewrites .rsrc along with
      # everything else. The evidence this rule wants is in the unpacked child,
      # which the engine scans separately, so let the verdict land there rather
      # than double-counting the wrapper.
      - id: metadata/binary/section/names::upx1-section-name
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
