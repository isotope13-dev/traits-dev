defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1027.009,T1027.002
  mbc: F0001
composite_rules:
- id: anonymous-identity-opaque-resource-carrier
  desc: Anonymous PE reads a near-random resource
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/binary/resource/entropy::very-high-entropy-rsrc-section
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: objectives/evasion/masquerade/versioninfo::anonymous-token-versioninfo-identity
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/binary/section/label::upx1-section-name
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
  - id: metadata/binary/installer/family/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
