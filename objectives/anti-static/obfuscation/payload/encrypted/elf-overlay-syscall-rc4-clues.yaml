---
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
composite_rules:
- id: elf-overlay-syscall-rc4-clues
  desc: ELF overlay, syscall and RC4 clues
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/pack/overlay::elf-overlay-syscall-few-imports
  - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::rc4-bytecode

# Static libc needs no imported syscall wrapper. Require an actual RC4
# transform, opaque overlay and a recovered execve syscall instead.
- id: elf-rc4-overlay-exec
  platforms: [linux]
  arch: [x86-64]
  desc: RC4 transform and opaque ELF overlay with execve capability
  crit: suspicious
  conf: 0.98
  attack: T1027,T1140
  all:
  - id: metadata/binary/layout/entropy::elf-overlay-entropy-over-75
  - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::x64-stack-displaced-byte-prga
  - id: micro-behaviors/process/replace::syscall-execve-elf
