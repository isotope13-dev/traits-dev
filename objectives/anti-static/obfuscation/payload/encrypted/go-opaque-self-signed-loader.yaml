# Obfuscated Go loader with an encrypted in-section payload under an untrusted
# signature. The module and build paths are a single opaque token (garble or
# a bespoke renamer), the peak-entropy mass marks a multi-megabyte cipher
# region inside a mapped section (not an overlay), and the binary carries a
# self-issued certificate with a zeroed link timestamp instead of a
# platform-trusted chain. Each leg alone is weak; together they are the
# self-signed Go stealer/loader shape (Vidar-class samples included).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: opaque-go-encrypted-blob-self-signed-loader
    desc: Obfuscated Go loader with encrypted payload, self-signed
    crit: hostile
    conf: 0.94
    size_min: 1048576
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/file/data-blob::concealed-payload-mass-8k
      - id: metadata/file/data-blob::peak-region-cipher-entropy
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
      - id: metadata/binary/provenance/build::pe-zero-timestamp
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
