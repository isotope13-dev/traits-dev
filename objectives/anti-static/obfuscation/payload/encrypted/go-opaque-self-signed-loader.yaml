# Opaque Go PE with a large high-entropy region and a self-issued certificate.
# These static properties can indicate concealed data, but do not show that the
# program reads, decrypts, or executes it. Keep this profile suspicious; the
# hostile loader classification below requires separate executable-memory
# loader evidence.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: opaque-go-high-entropy-data-self-issued
    desc: Opaque Go PE with high-entropy data and a self-issued certificate
    crit: suspicious
    conf: 0.94
    size_min: 1048576
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/file/data-blob::binary-peak-region-mass-over-8k
      - id: metadata/file/data-blob::peak-region-cipher-entropy
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/binary/provenance/build::pe-zero-timestamp
    unless:
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: opaque-go-self-signed-garbled-dispatch-loader
    desc: Self-issued obfuscated Go loader with executable-memory behavior
    crit: hostile
    conf: 0.96
    attack: T1027,T1620
    size_min: 1048576
    all:
      - id: opaque-go-high-entropy-data-self-issued
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: objectives/command-and-control/dropper/staging/native/loader::go-opaque-dynamic-win32-rwx-loader
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/development/
