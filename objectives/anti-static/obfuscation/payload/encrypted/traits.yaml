defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [binaries]
  attack: T1027
  mbc: B0032
traits: []
composite_rules:
- id: self-modifying-payload-loader
  desc: Writes and executes a transformed payload in its own process
  crit: suspicious
  conf: 0.98
  attack: T1027,T1140,T1055
  platforms: [windows]
  for: [pe, dll]
  all:
  - id: metadata/binary/code/entropy::large-sparse-import-high-entropy-profile
  - id: micro-behaviors/crypto/symmetric/xor/loop::x86-indexed-byte-xor-transform-loop
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: micro-behaviors/os/module/load::get-current-process
  - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
  - id: micro-behaviors/process/create/thread::create-thread
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/

- id: encrypted-resource-dynamic-loader
  desc: High-entropy resource loader with dynamic API resolution
  crit: hostile
  conf: 0.97
  attack: T1027.009
  for:
  - pe
  all:
  - id: metadata/binary/section/permission::dominant-high-entropy-resources
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/os/module/load::get-module-handle-ansi
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/
  - id: well-known/app/
  - id: well-known/tool/

- id: native-pe-buffer-decrypt-loader
  desc: Native PE decrypts an overlay buffer for executable staging
  crit: hostile
  conf: 0.98
  attack: T1027,T1140,T1620
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/data/embedded/payload/header::pe-mz-compare-x64
  - id: micro-behaviors/data/embedded/payload/header::pe-e-lfanew-read-x64
  - id: micro-behaviors/data/decode/xor::x64-byte-xor-decode-loop
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/
  - id: well-known/tool/reverse-engineering/

- id: anonymous-section-loader
  desc: Anonymous payload section with loader
  crit: suspicious
  conf: 0.97
  for:
  - pe
  all:
  - id: metadata/binary/section/permission::anonymous-payload-section
  any:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
  - id: micro-behaviors/mem/protect/modify::virtual-alloc
  - id: micro-behaviors/process/create/thread::create-thread
  needs: 2

- id: go-anonymous-executable-stage-loader
  desc: Go PE decrypts an anonymous executable stage at runtime
  crit: hostile
  conf: 0.96
  attack: T1140,T1620
  for:
  - pe
  all:
  - id: metadata/lang/compiler/systems::go-pe-binary-context
  - id: metadata/binary/section/permission::anonymous-pe-section-high-entropy
  - id: micro-behaviors/mem/protect/modify::virtual-alloc
  - id: micro-behaviors/process/create/thread::create-thread
  any:
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: micro-behaviors/dylib/load/runtime::load-library-w
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/

- id: encrypted-script-payload-stager
  desc: Encrypted script payload staged in dominant data section
  crit: suspicious
  conf: 0.93
  for:
  - pe
  all:
  - id: metadata/binary/section/ratio::large-data-section
  - id: metadata/binary/code/complexity::few-functions
  any:
  - id: objectives/evasion/masquerade/extension/engine::wscript-engine-jscript-override
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  - id: metadata/binary/symbols/count::very-many-imports
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: obfuscated-macos-daemon-dropper
  desc: Concealed Mach-O with encrypted blob runs shell
  crit: hostile
  conf: 0.92
  for:
  - macho
  all:
  - id: metadata/binary/section/entropy::high-entropy-const-region
  - id: metadata/binary/section/prose::tiny-cstring-section
  any:
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: micro-behaviors/process/create/shell/spawn::shell-execution

- id: obfuscated-elf-daemon-dropper
  desc: Obfuscated ELF daemon dropper (embedded payload
  crit: hostile
  conf: 0.88
  platforms:
  - linux
  for:
  - elf
  size_max: 2097152
  all:
  - id: micro-behaviors/data/embedded/payload/compression::lzma-magic
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  any:
  - id: micro-behaviors/process/create/shell/
  unless:
  - id: metadata/binary/symbols/count::many-imports

- id: x64-xor-decrypt-loop
  desc: XOR decryption loop with PEB or payload
  crit: suspicious
  conf: 0.85
  attack: T1140
  for:
  - pe
  all:
  - id: micro-behaviors/crypto/symmetric/xor/loop::x64-xor-indexed-byte-loop
  any:
  - id: micro-behaviors/os/api-resolution/manual::peb-access-x64
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-export-walk-primitive
  - id: metadata/binary/section/entropy::high-entropy-rsrc
  - id: metadata/binary/section/permission::dominant-high-entropy-rsrc-section

- id: pe-encrypted-resource-with-evasion
  desc: PE encrypted resource with anti-analysis
  crit: suspicious
  conf: 0.88
  for:
  - pe
  all:
  - id: metadata/binary/section/permission::dominant-high-entropy-rsrc-section
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  any:
  - id: micro-behaviors/process/enumerate/psapi::psapi-process-scan
  downgrade:
    any:
    - id: metadata/binary/installer/script/
    - id: metadata/signed/developer
    - id: metadata/binary/vendor::is-microsoft-named

- id: packed-winhttp-memory-loader
  desc: Resource-packed WinHTTP memory loader
  crit: hostile
  conf: 0.97
  attack: "T1027.002,T1105,T1620"
  for:
  - pe
  all:
  - id: metadata/binary/section/permission::dominant-high-entropy-resources
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: tampered-encrypted-resource-pe
  desc: Obfuscated PE resource with malformed certificate metadata
  crit: hostile
  conf: 0.97
  attack: T1027.002
  for:
  - pe
  all:
  - id: metadata/binary/section/permission::large-high-entropy-rsrc-section
  - id: metadata/binary/layout/checksum::cert-table-truncated
  - id: metadata/binary/section/label::multiple-nonstandard-section-names
  - id: metadata/file/padding::paddingxxpadding-filler
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: opaque-section-temp-relaunch-stager
  desc: Opaque PE sections conceal a temp-staged child relaunch
  crit: hostile
  conf: 0.97
  attack: T1027,T1027.009,T1105,T1106
  for: [pe]
  all:
  - id: metadata/binary/section/label::multiple-nonstandard-section-names
  - id: metadata/file/data-blob::low-entropy-binary-with-dense-region
  - id: micro-behaviors/fs/temp/directory::get-temp-file-name
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: opaque-admin-overlay-host-probe
  desc: Opaque admin PE overlay with host-probing capabilities
  crit: hostile
  conf: 0.98
  attack: T1027,T1140,T1016,T1087,T1056.001
  for: [pe]
  all:
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/binary/section/label::blank-section-name-cluster
  - id: metadata/binary/section/label::multiple-nonstandard-section-names
  - id: metadata/build/manifest::pe-requires-admin
  any:
  - id: micro-behaviors/os/network/connections::set-tcp-entry
  - id: micro-behaviors/os/service/remote::net-user-enum-source
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/certificate/signature::pe-signature-verified
  - id: metadata/binary/installer/family/

- id: opaque-screen-clipboard-collection-payload
  desc: Opaque native payload with screen and clipboard collection
  crit: hostile
  conf: 0.99
  attack: T1027,T1113,T1115
  for: [pe]
  all:
  - id: objectives/collection/screenshot::gdi-capture-clipboard-desktop-access
  - id: objectives/collection/clipboard/capture::windows-clipboard-capture-with-user-monitoring
  - id: micro-behaviors/data/embedded/payload/header::pe-e-lfanew-read-x64
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-walk
  - id: micro-behaviors/crypto/symmetric/xor/loop::x64-xor-imm8-widen-loop
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/


- id: unsigned-renamed-rwx-rolling-xor-overlay-loader
  desc: Unsigned renamed PE decrypts an overlay in RWX memory
  crit: hostile
  conf: 0.995
  attack: T1027,T1036.005,T1140,T1620
  for: [pe, dll]
  all:
  - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-resolved-x64-imm64
  - id: micro-behaviors/crypto/symmetric/xor/loop::x64-rolling-byte-xor-decode-loop-accumulator
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/


- id: scpack-encrypted-loader-stage
  desc: SC Pack conceals a sparse encrypted loader stage
  crit: hostile
  conf: 0.99
  attack: T1027.002,T1027.013,T1140
  for: [pe]
  platforms: [windows]
  all:
  - id: metadata/binary/section/label::scpack-section-name
  - id: metadata/binary/section/entropy::tiny-high-entropy-uppercase-text
  - id: metadata/binary/section/entropy::uppercase-data-near-random
  - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
  - id: objectives/anti-static/obfuscation/payload/section/layout::ep-in-rwx-section
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
