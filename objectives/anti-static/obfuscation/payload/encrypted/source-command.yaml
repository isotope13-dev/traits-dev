# A concealed byte/string payload is decoded with XOR and then handed to a
# Windows command shell. The atoms remain neutral and reusable; this objective
# supplies intent only when payload concealment, decoding, and execution all
# coexist. The random environment/file gates used by inert benchmarks are
# deliberately irrelevant to the match.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
  attack: T1027,T1140,T1059.003
  mbc: B0032,C0043,E1059.003

traits:
  - id: zig-shell-c-command
    desc: Zig source invokes a shell with -c
    crit: notable
    conf: 0.96
    platforms: [unix]
    for: [zig]
    if:
      type: text
      regex: '(?i)/bin/sh["'']?\s*,\s*["'']-c["'']'

  - id: swift-base64-decoder-call
    desc: Swift decodes a base64 string
    crit: suspicious
    conf: 0.94
    for: [swift]
    if:
      type: text
      substr: 'Data(base64Encoded:'

  - id: swift-own-executable-backup
    desc: Backs up its own executable
    crit: suspicious
    conf: 0.94
    for: [swift]
    platforms: [unix]
    if:
      type: text
      regex: 'CommandLine\.arguments\[0\][\s\S]{0,480}\.bak'

  - id: swift-hidden-system-logs-stage
    desc: Stages files under hidden system logs
    crit: suspicious
    conf: 0.94
    for: [swift]
    platforms: [unix]
    if:
      type: text
      substr: /tmp/.system_logs

  - id: swift-dns-checkin-labels
    desc: DNS check-in label set
    crit: suspicious
    conf: 0.92
    for: [swift]
    platforms: [unix]
    if:
      type: text
      regex: '"status"[\s\S]{0,40}"checkin"[\s\S]{0,40}"heartbeat"'

composite_rules:
  - id: zig-xor-shell-loader
    desc: Zig XOR payload is handed to a shell
    crit: hostile
    conf: 0.98
    platforms: [unix]
    for: [zig, tar, gz, zip]
    scope: archive
    all:
      - id: micro-behaviors/data/embedded/payload/array::zig-hex-byte-array-literal
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: objectives/anti-static/obfuscation/payload/encrypted::zig-shell-c-command

  # The sink takes the decoded identifier itself. A byte table, an unrelated
  # XOR (checksums and crypto use it constantly), and an unrelated system()
  # call elsewhere in a large native source file are not enough; all three
  # must occur in the same small source neighborhood.
  - id: c-hex-xor-system-loader
    desc: C XOR-decodes an embedded byte payload into a system command
    crit: hostile
    conf: 0.98
    platforms: [unix]
    for: [c]
    near_lines: 40
    all:
      - id: micro-behaviors/data/embedded/payload/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/shell/native::c-system-identifier-input

  # Ruby's explicit `/bin/sh -c <computed value>` form proves that the opaque
  # byte table becomes shell input. Keep the bound tight enough that a gem
  # containing generated parser tables and a separate shell helper does not
  # become hostile merely because both capabilities share one file.
  - id: ruby-decimal-xor-shell-loader
    desc: Ruby XOR-decodes an embedded byte payload for shell execution
    crit: hostile
    conf: 0.98
    platforms: [unix]
    for: [ruby]
    near_lines: 40
    all:
      - id: micro-behaviors/data/embedded/payload/array::ruby-decimal-byte-array-literal
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/shell/lang::ruby-system-shell-interpreter

  - id: hex-xor-unix-shell-loader
    desc: XOR-decoded byte payload executes through a shell
    crit: hostile
    conf: 0.98
    platforms: [unix]
    for: [go, rust]
    near_lines: 80
    all:
      - id: micro-behaviors/data/embedded/payload/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/process/create/shell/command-flag::go-exec-shell-variable-command
      - id: micro-behaviors/process/create/shell/runner::rust-shell-command-exec

  - id: hex-xor-command-shell-loader
    desc: XOR-decoded opaque payload is executed through cmd.exe
    crit: hostile
    conf: 0.99
    for: [scripts, source]
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: metadata/lang/encoded/hex::long-hex-string-literal
      - id: micro-behaviors/data/embedded/payload/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/embedded/payload/array::ruby-decimal-byte-array-literal

  - id: perl-packed-hex-command-loader
    desc: Perl decodes packed XOR bytes before a command invocation
    crit: hostile
    conf: 0.98
    # One Perl script: the packed hex literal, the XOR that unmasks it and the
    # system() that runs the result are one routine, as the name says. Under
    # `scope: archive` a source tree supplied them from unrelated files --
    # TeXLive's build tarball has `source-xor-operation` in several hundred
    # cairo C files alone, because it matches an XOR operator in C source.
    for: [perl]
    all:
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/data/decode/hex::perl-packed-hex-byte-decode
      - id: micro-behaviors/process/create/system::system-process-call
      - id: metadata/lang/encoded/hex::long-hex-string-literal

  - id: jvm-hex-command-shell-loader
    desc: JVM hex-decoded payload is executed through cmd.exe
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    all:
      - id: metadata/file/encoded::hex-class-string-long
      - id: micro-behaviors/data/decode/hex::java-radix16-string-parse
      - id: micro-behaviors/process/create/shell/spawn::java-cmd-exe-c-arguments
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol

  - id: typescript-hidden-window-xor-loader
    desc: TypeScript XOR payload executes with a hidden Windows process
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm, package.json]
    scope: archive
    all:
      - id: metadata/lang/encoded/hex::long-hex-string-literal
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/spawn::windowshide-option

  - id: shell-hidden-hex-background-loader
    desc: Shell hides an encoded payload in a background process
    crit: hostile
    conf: 0.99
    for: [shell]
    platforms: [unix]
    all:
      - id: objectives/command-and-control/dropper/execution/pipe::shell-appended-payload-extract
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
      - id: micro-behaviors/process/create/background::detached-background-command

  - id: csharp-base64-shell-loader
    desc: C# decodes base64 before launching a shell
    crit: hostile
    conf: 0.99
    for: [csharp, nupkg]
    platforms: [unix, windows]
    scope: archive
    all:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/create/shell/runner::dotnet-unix-shell-command
      - id: objectives/command-and-control/dropper/delivery/execute-download::process-start-downloaded
      - id: objectives/command-and-control/dropper/staging/encrypted::dotnet-assembly-or-temp-run

  - id: perl-powershell-credential-loader
    desc: Perl reads developer credentials for PowerShell
    crit: hostile
    conf: 0.99
    for: [perl, tar, zip]
    scope: archive
    all:
      - id: objectives/credential-access/files/config::developer-credential-file-read
      - id: micro-behaviors/process/create/system::system-process-call
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/communications/http/post::perl-post-method-call

  - id: jvm-curl-runtime-loader
    desc: JVM launches a curl-piped shell payload
    crit: hostile
    conf: 0.99
    for: [class, java_class, jar, zip]
    platforms: [unix, macos]
    scope: archive
    all:
      - id: micro-behaviors/process/create/shell/pipeline::jvm-curl-pipe-shell-string
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/communications/http/url/domain::http-url-binary

  - id: jvm-cmd-download-stage
    desc: JVM downloads a batch command stage
    crit: hostile
    conf: 0.99
    for: [class, java_class, jar, zip]
    scope: archive
    all:
      - id: micro-behaviors/process/create/shell/spawn::java-cmd-exe-c-arguments
      - id: objectives/persistence/login/startup/shortcut::jvm-curl-script-url
      - id: micro-behaviors/fs/path/temp::temporary-batch-path-reference
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol

  - id: jvm-staged-resource-process
    desc: JVM decodes and stages a hidden executable
    crit: hostile
    conf: 0.99
    for: [class, java_class, jar, zip]
    platforms: [unix, windows]
    scope: archive
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-class
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/fs/write/file/stage::jvm-hidden-temp-stage-path

  - id: jvm-credential-runtime-exfil
    desc: JVM reads credential paths for remote execution
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    platforms: [unix, macos]
    # Was `scope: archive`, which pools these legs across every class in a
    # JAR. They are ordinary JVM library surface -- an http URL, Runtime.exec,
    # java.nio.file, readAllBytes -- so any substantial application supplies
    # all of them from unrelated classes. Calva, datalevin and swarmpit each
    # scored hostile on this cluster. A loader class does all of it in one
    # class; an application spreads it over hundreds.
    all:
      - id: objectives/credential-access/files/config::java-credential-path-table
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/communications/http/url/domain::http-url-binary

  - id: jvm-hidden-cache-terminal-loader
    desc: JVM hidden cache process deletes user data
    crit: hostile
    conf: 0.99
    for: [class, java_class, jar, zip]
    platforms: [unix, macos]
    scope: archive
    all:
      - id: micro-behaviors/fs/path/location::jvm-hidden-user-cache-directory
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: objectives/impact/destroy/file-deletion::kotlin-user-data-delete-targets

  - id: jvm-cmd-diagnostic-exfil
    desc: JVM launches cmd to exfil diagnostic data
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    # Was `scope: archive`, which pools these legs across every class in a
    # JAR. They are ordinary JVM library surface -- an http URL, Runtime.exec,
    # java.nio.file, readAllBytes -- so any substantial application supplies
    # all of them from unrelated classes. Calva, datalevin and swarmpit each
    # scored hostile on this cluster. A loader class does all of it in one
    # class; an application spreads it over hundreds.
    all:
      - id: micro-behaviors/process/create/shell/spawn::java-cmd-exe-c-arguments
      - id: micro-behaviors/fs/path/extension::java-executable-reference
      - id: micro-behaviors/fs/read/file/handle::jvm-nio-file-class-ref
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: metadata/package/manager::maven-repository-url

  - id: jvm-urlconnection-c2
    desc: URLConnection beacon never reads the response
    crit: hostile
    conf: 0.98
    for: [class, java_class]
    platforms: [unix, macos]
    # Was `scope: archive`, which pools these legs across every class in a
    # JAR. They are ordinary JVM library surface -- an http URL, Runtime.exec,
    # java.nio.file, readAllBytes -- so any substantial application supplies
    # all of them from unrelated classes. Calva, datalevin and swarmpit each
    # scored hostile on this cluster. A loader class does all of it in one
    # class; an application spreads it over hundreds.
    #
    # File scope alone was still not enough. Unlike every other composite in
    # this family the legs name no second capability: openConnection, the
    # HttpURLConnection constant, a URL and the word "disconnect" describe an
    # HTTP client, and any class that implements one matches. Apache Druid
    # bundles jclouds, whose JavaUrlHttpCommandExecutorService is exactly
    # that -- the library's own URLConnection transport -- and scored
    # hostile. What separates it from a beacon is that a transport reads
    # what comes back: jclouds calls getInputStream, getResponseCode and
    # setDoOutput, while a fire-and-forget check-in connects, signals its
    # presence through the request itself and hangs up. So the suppressions
    # below are the rule's real discriminator, not FP patches.
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-urlconnection-open-connection
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
      - id: micro-behaviors/communications/socket/disconnect::disconnect-reference
    unless:
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-response-code
      - id: micro-behaviors/communications/http/post::jvm-bytecode-do-output

  - id: jvm-download-write-stage
    desc: JVM writes a downloaded payload to disk
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    # Was `scope: archive`, which pools these legs across every class in a
    # JAR. They are ordinary JVM library surface -- an http URL, Runtime.exec,
    # java.nio.file, readAllBytes -- so any substantial application supplies
    # all of them from unrelated classes. Calva, datalevin and swarmpit each
    # scored hostile on this cluster. A loader class does all of it in one
    # class; an application spreads it over hundreds.
    all:
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol

  - id: jvm-proxy-config-shell
    desc: JVM reads proxy config for remote shell execution
