# Concealment requires the custom cipher and the scattered self-file reader.
# No claim here depends on the decrypted stage's filename.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
composite_rules:
  - id: scattered-cipher-self-file-payload
    desc: Scattered self-file payload uses a custom cipher
    crit: suspicious
    conf: 0.99
    attack: T1027.009,T1140
    all:
      - id: micro-behaviors/crypto/cipher::x64-index-sum-stream-xor
      - id: micro-behaviors/fs/read/file/handle::x64-scattered-file-read-profile
      - id: micro-behaviors/process/info/current::get-module-filename-wide
      - id: metadata/binary/layout/overlay::large-noncertificate-unclaimed-bytes
