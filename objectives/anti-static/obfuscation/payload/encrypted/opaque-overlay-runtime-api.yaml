defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: nsis-opaque-runtime-loader
    desc: Opaque NSIS overlay conceals an unsigned runtime loader
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1106,T1129
    all:
      - id: metadata/binary/installer/script::nsis
      - id: objectives/command-and-control/dropper/execution/installer::nsis-dominant-encrypted-overlay
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/create/spawn::create-process-w
    any:
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: signed-nsis-large-overlay-staged-loader
    desc: Self-issued NSIS with large staged overlay and execution APIs
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1106
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/anomaly/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued-kv
      - id: objectives/command-and-control/dropper/execution/installer::nsis-suspicious-identity
      - id: metadata/binary/installer/plugin::nsis-system-plugin
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/process/create/spawn::create-process-w
    any:
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/os/clipboard/access::win32-clipboard-access
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: nsis-self-issued-opaque-process-stager
    desc: Self-issued NSIS opaque process stager
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1106,T1620
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/anomaly/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued-kv
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
      - id: metadata/binary/layout::large-overlay-64k
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
    unless:
      - id: metadata/signed/platform/

  - id: renamed-opaque-overlay-runtime-api-cluster
    desc: Renamed PE with opaque runtime API cluster
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027.009,T1106,T1129
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/dylib/load/runtime::load-library-w
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/
      - id: well-known/lib/
      - id: objectives/evasion/anti-av/code-padding::native-rat-random-overlay-padding

  - id: unsigned-opaque-overlay-runtime-process-loader
    desc: Unsigned opaque overlay with runtime API resolution and process creation
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1106,T1620
    for: [pe]
    all:
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/
      - id: well-known/lib/
      - id: objectives/evasion/anti-av/code-padding::native-rat-random-overlay-padding
