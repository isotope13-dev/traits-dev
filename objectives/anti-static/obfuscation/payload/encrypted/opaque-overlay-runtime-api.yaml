defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: nsis-opaque-runtime-loader
    desc: Opaque NSIS overlay conceals an unsigned runtime loader
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1106,T1129
    all:
      - id: metadata/binary/installer/script::nsis
      - id: objectives/command-and-control/dropper/execution/installer::nsis-dominant-encrypted-overlay
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/create/spawn::create-process-w
    any:
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: renamed-opaque-overlay-runtime-api-cluster
    desc: Renamed PE with opaque runtime API cluster
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027.009,T1106,T1129
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/dylib/load/runtime::load-library-w
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/
      - id: well-known/lib/
