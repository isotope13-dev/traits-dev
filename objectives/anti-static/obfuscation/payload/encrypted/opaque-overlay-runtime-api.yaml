defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: nsis-opaque-runtime-loader
  desc: Opaque NSIS overlay conceals an unsigned runtime loader
  crit: hostile
  conf: 0.98
  attack: T1027.009,T1106,T1129
  all:
  - id: metadata/binary/installer/script::nsis
  - id: objectives/anti-static/pack/overlay::nsis-dominant-opaque-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  any:
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: signed-nsis-large-overlay-staged-loader
  desc: Self-issued NSIS with large staged overlay and execution APIs
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1106
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
  - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  any:
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: renamed-opaque-overlay-runtime-api-cluster
  desc: Renamed PE with opaque runtime API cluster
  crit: suspicious
  conf: 0.96
  attack: T1036.005,T1027.009,T1106,T1129
  all:
  - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/dylib/load/runtime::load-library-w
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app
  - id: well-known/lib
  - id: objectives/evasion/anti-av/code-padding::native-rat-random-overlay-padding
- id: unsigned-opaque-overlay-runtime-process-loader
  desc: Unsigned opaque overlay with runtime API resolution and process creation
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1106,T1620
  for:
  - pe
  all:
  - id: metadata/binary/layout/overlay::large-high-entropy-overlay
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/create/exec::create-process-a
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app
  - id: well-known/lib
  - id: objectives/evasion/anti-av/code-padding::native-rat-random-overlay-padding
