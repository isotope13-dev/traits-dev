defaults:
  platforms: [windows]
  for: [pe, data, text]
composite_rules:
  - id: nsis-xorhex-native-callback-commands
    desc: NSIS conceals native callback API commands
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140
    scope: outer
    all:
      - id: metadata/binary/installer/script::nsis
      - id: micro-behaviors/ui/window/message::xorhex-nsis-callwindowproc
      - id: micro-behaviors/mem/alloc/virtual::xorhex-nsis-virtualalloc
      - id: micro-behaviors/fs/read/file/handle::xorhex-nsis-readfile
