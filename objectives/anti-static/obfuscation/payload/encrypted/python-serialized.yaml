# Serialized Python constants preserve a bounded payload-decoding vocabulary.
# Require the cipher and decoder separately, plus loader-specific diagnostics;
# bundled PyCryptodome implementations alone cannot establish this claim.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.95

composite_rules:
  - id: serialized-encrypted-hidden-launch-loader
    desc: Encrypted payload decoder with hidden-launch diagnostics
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1140,T1564.003
    all:
      - id: micro-behaviors/crypto/symmetric/aes/ctr::python-serialized-aes-counter-decrypt
      - id: micro-behaviors/data/decode/base85::python-serialized-b85decode
      - id: micro-behaviors/process/create/hidden::python-serialized-hidden-popen
      - id: micro-behaviors/crypto/decrypt::background-payload-decryption-diagnostic
      - id: micro-behaviors/fs/write/file/target::payload-written-diagnostic
