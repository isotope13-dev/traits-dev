# Python modules that reconstruct a key via XOR halves + PBKDF2-HMAC, verify
# an HMAC over a ciphertext blob, XOR-decrypt a keystream, then
# exec(compile(...)) the recovered source at import time. Used by PyPI
# packers that ship every module as an integrity-gated encrypted stub.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027.002
  mbc: B0032

traits:
  - id: python-invalid-payload-import-error
    desc: Raises ImportError for invalid packed payload
    crit: component
    conf: 0.95
    if:
      type: text
      regex: "ImportError\\(\\s*['\"]invalid payload['\"]\\s*\\)"

composite_rules:
  - id: python-hmac-pbkdf2-xor-exec-loader
    desc: HMAC-PBKDF2 XOR decrypt then exec packed Python
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/kdf/algorithm::python-hashlib-pbkdf2-hmac
      - id: micro-behaviors/crypto/hash/hmac::hmac-api-reference
      - id: micro-behaviors/process/interpreter/python::exec-compiled-code
      - id: python-invalid-payload-import-error
    any:
      - id: micro-behaviors/data/encode/xor::xor-bytes-zip-pairwise
      - id: micro-behaviors/data/encode/xor::xor-bytearray-indexed-assign
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/runtime/

  - id: python-hmac-xor-module-packer
    desc: Import-time HMAC-XOR packed Python module
    crit: hostile
    conf: 0.985
    all:
      - id: python-hmac-pbkdf2-xor-exec-loader
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/runtime/
