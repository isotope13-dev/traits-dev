defaults:
  platforms:
  - windows
  - unix
  attack: T1027
  for:
  - pe
  - dll
composite_rules:
- id: concealed-overlay-memory-loader
  desc: Concealed PE payload paired with executable-memory modification
  crit: hostile
  conf: 0.96
  attack: T1027,T1620
  all:
  - id: metadata/file/data-blob::low-entropy-binary-with-dense-region
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::low-entropy-overlay-inflation
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  - id: micro-behaviors/data/control-flow/dispatch::indirect-call-r13-x64
  - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: pe-rwx-concealed-payload-carrier
  desc: PE RWX section conceals encrypted payload
  crit: hostile
  conf: 0.99
  attack: T1027,T1027.009
  all:
  - id: metadata/file/data-blob::low-entropy-binary-with-dense-region
  - id: objectives/anti-static/pack/loader-noise::reloc-rwx-payload-section
  - id: metadata/binary/section/ratio::reloc-dominates-image
- id: unsigned-rwx-overlay-byte-transform-loader
  desc: Unsigned native PE decodes an executable writable overlay
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1620
  all:
  - id: metadata/binary/section/entropy::high-entropy-rwx-data-section
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: metadata/binary/symbols/exports::single-export
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/crypto/symmetric/xor/loop::x86-indexed-byte-xor-transform-loop
  - id: micro-behaviors/crypto/symmetric/xor/loop::x86-inplace-decrypt-jmp-eax
  - id: micro-behaviors/crypto/symmetric/xor/loop::x86-rol-ror-xor-byte-mixer
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/reverse-engineering/
