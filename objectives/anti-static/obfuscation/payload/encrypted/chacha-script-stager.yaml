defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140
  mbc: C0025

composite_rules:
  - id: chacha-encrypted-temp-script-stager
    desc: Native loader decrypts an opaque payload and writes a temporary script
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    any:
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/binary/symbols/imports::sparse-import-api-profile
    needs: 1
    unless:
      - id: metadata/installer/product/
  - id: chacha-inline-pe-http-post-loader
    desc: ChaCha native PE maps payload and HTTP POSTs
    crit: hostile
    conf: 0.98
    attack: T1027,T1071.001,T1620
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/os/api-resolution/digest-export/walk::peb-ldr-list-access-x86
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/communications/http/post::post-string-pe-wide
    unless:
      - id: metadata/installer/product/
