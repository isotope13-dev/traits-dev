defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140
  mbc: C0025

composite_rules:
  - id: chacha-encrypted-temp-script-stager
    desc: Native loader decrypts an opaque payload and writes a temporary script
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    any:
      - id: micro-behaviors/process/thread/create::create-thread
      - id: objectives/anti-static/obfuscation/payload/import::extreme-minimal-imports
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
  - id: chacha-inline-pe-http-post-loader
    desc: ChaCha native PE maps payload and HTTP POSTs
    crit: hostile
    conf: 0.98
    attack: T1027,T1071.001,T1620
    all:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: micro-behaviors/os/api-resolution/hash-based::peb-ldr-list-access-x86
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/communications/http/post::post-string-pe-wide
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
