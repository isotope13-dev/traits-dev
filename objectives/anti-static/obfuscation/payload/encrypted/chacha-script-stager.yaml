defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140
  mbc: C0025

composite_rules:
  - id: chacha-encrypted-temp-script-stager
    desc: Native loader decrypts an opaque payload and writes a temporary script
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: micro-behaviors/fs/temp/directory::get-temp-path-name
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
    any:
      - id: micro-behaviors/process/create/thread::create-thread
      - id: objectives/anti-static/obfuscation/payload/import::extreme-minimal-imports
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
