# The downloaded body is rewritten through a repeating-key XOR whose operator
# is concealed as the equivalent boolean identity. Requiring the auto-open
# entry, split dispatch, response-body read and environment access makes the
# downloaded-payload description explicit.
#
# Office stores each module as a separate member of the container, so the legs
# of one macro project can sit in different modules. Archive scope joins them
# across members. A standalone module keeps file scope and needs them all in one
# file, which matches the behavior of the earlier file-local profile.
defaults:
  platforms: [windows]
  attack: T1027,T1140,T1105

composite_rules:
  - id: vba-downloaded-boolean-xor-payload
    desc: VBA decrypts downloaded payload with concealed XOR loop
    crit: hostile
    conf: 0.98
    for: [ooxml, vbs]
    scope: archive
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/os/com/automation::vba-callbyname-split-method
      - id: micro-behaviors/communications/http/client/response-body::vbs-split-responsebody-reference
      - id: micro-behaviors/os/env/read/current::wsh-vbs-environment-method
      - id: micro-behaviors/data/encode/xor::vba-boolean-identity-xor
      - id: micro-behaviors/data/buffer/index::vba-modulo-indexed-array
      - id: micro-behaviors/fs/write/file/handle/call::vb6-put-binary-source
