# The downloaded body is rewritten through a repeating-key XOR whose operator
# is concealed as the equivalent boolean identity. Requiring the independent
# auto-open HTTP-stager finding distinguishes the malware chain from a standalone
# VBA file transformer and makes the downloaded-payload description explicit.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1140,T1105

composite_rules:
  - id: vba-downloaded-boolean-xor-payload
    desc: VBA decrypts downloaded payload with concealed XOR loop
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/execution/wsh::vba-fragmented-dispatch-http-stager
      - id: micro-behaviors/data/encode/xor::vba-boolean-identity-xor
      - id: micro-behaviors/data/buffer/index::vba-modulo-indexed-array
      - id: micro-behaviors/fs/write/file/handle::vb6-put-binary-source
