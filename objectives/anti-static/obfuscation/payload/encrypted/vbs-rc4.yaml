defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: vbs-rc4-stream-cipher-payload-decoder
    desc: VBScript decodes obfuscated payload using an RC4 stream cipher
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::vbs-rc4-stream-cipher
      - id: micro-behaviors/data/encode/char-code::array-payload-reconstruction
      - id: micro-behaviors/data/string/concat/expression::vbs-many-long-literal-concatenations
