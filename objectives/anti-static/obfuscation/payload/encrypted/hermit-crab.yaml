defaults:
  crit: hostile
  platforms:
    - unix
    - windows
    - macos
composite_rules:
  - id: encrypted-memory-loader
    desc: Encrypted PE payload prepared for execution
    conf: 0.96
    for:
      - pe
    all:
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::rust-aes-crate-path
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: well-known/tool/development
