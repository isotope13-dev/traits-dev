defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-rc4-base64-native-api-clues
    desc: Python RC4 Base64 and native API clues
    crit: suspicious
    conf: 0.99
    platforms: [windows]
    near_lines: 120
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::source-rc4-implementation
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
    any:
      - id: micro-behaviors/dylib/load/ffi::python-ctypes-windll-load
      - id: micro-behaviors/mem/alloc/virtual::python-virtualalloc-near-rwx-number
      - id: "micro-behaviors/mem/copy::python-ctypes-memmove"
      - id: micro-behaviors/mem/protect/modify/executable::python-virtualprotect-rwx
    needs: 1

  # Dual-use native runner: map caller-supplied bytes RWX and invoke via
  # ctypes. Suspicious without an encoded/network stage; hostile loaders add
  # decode or delivery legs elsewhere.
