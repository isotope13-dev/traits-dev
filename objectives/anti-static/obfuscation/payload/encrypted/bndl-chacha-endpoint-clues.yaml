# Co-occurring bundle, cipher-constant and PE section observations.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: bndl-chacha-high-entropy-rdata
  desc: BNDL, ChaCha/Salsa and high-entropy rdata
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
  - id: micro-behaviors/data/archive/custom::bndl-exe-archive
  - id: metadata/binary/section/entropy::high-entropy-rdata-section
  unless:
  - id: metadata/installer/product/
- id: bndl-chacha-rdata-external-endpoint
  desc: BNDL and ChaCha/Salsa with external endpoint
  crit: suspicious
  conf: 0.94
  all:
  - id: bndl-chacha-high-entropy-rdata
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-pair
