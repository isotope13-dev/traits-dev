defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1027
  mbc: B0032
traits:
- id: nop-padded-dword-xor-decryptor
  desc: NOP-padded dword XOR decryptor
  crit: suspicious
  conf: 0.97
  arch:
  - x86
  if:
    type: hex
    section: .ajelhf
    pattern: 60 [0-8] B8 ?? ?? ?? ?? [0-8] 6A 04 [0-8] 5F
- id: bitshift-xor-byte-decrypt-loop
  desc: Bitshift-derived XOR decrypt loop
  crit: notable
  conf: 0.92
  arch:
  - x86
  if:
    type: hex
    section: .text
    pattern: 0F AD ?? F6 C1 20 C4 E2 ?? F7 ?? 0F 44 ?? 30 ?? ?? 00
composite_rules:
- id: dotnet-fragmented-hex-xor-payload
  desc: Fragmented hex payload with XOR decoder
  crit: hostile
  conf: 0.995
  attack: T1027,T1140
  mbc: B0032,C0043
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/file/encoded::dotnet-dense-short-lower-hex-fragments
  - id: micro-behaviors/crypto/symmetric/xor/loop::dotnet-hex-byte-repeating-xor-loop
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
- id: unsigned-rwx-overlay-file-delete
  desc: Unsigned PE with opaque RWX payload and file deletion
  crit: hostile
  conf: 0.98
  attack: T1027,T1070.004
  for:
  - pe
  all:
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/section/permission::near-zero-entropy-rwx-section
  - id: metadata/binary/header/malformed::malformed-pe-structure
  - id: micro-behaviors/fs/delete/file/library::delete-win
- id: x64-rwx-rolling-xor-memory-loader
  desc: x64 rolling-XOR payload loader in executable memory
  crit: hostile
  conf: 0.995
  attack: T1027,T1140,T1620
  all:
  - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-resolved-x64-imm64
  any:
  - id: micro-behaviors/crypto/symmetric/xor/loop::x64-rolling-byte-xor-decode-loop
  - id: micro-behaviors/crypto/symmetric/xor/loop::x64-rolling-byte-xor-decode-loop-accumulator
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
- id: stack-copied-xor-payload
  desc: Stack-copied XOR payload decryptor
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/mem/copy::x86-fixed-length-stack-copy
  - id: bitshift-xor-byte-decrypt-loop
- id: api-resolved-surveillance-payload
