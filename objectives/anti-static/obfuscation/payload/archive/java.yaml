defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [jar, zip]
traits:
  - id: java-archive-slashed-class-folder
    desc: "ZIP entry with slash after class"
    conf: 0.95
    if:
      type: yara
      source: |
        rule java_archive_slashed_class_folder {
          strings:
            $entry = /[A-Za-z0-9_\/]+\.class\// ascii
          condition:
            #entry > 10
        }
  - id: java-archive-class-folder-caesium
    desc: Slashed class folder with Caesium decoys
    conf: 0.99
    if:
      type: yara
      source: |
        rule java_archive_class_folder_caesium {
          strings:
            $decoy = /\.class\/caesium_[0-9]{2}\.class/ ascii
          condition:
            #decoy > 20
        }
  # Central-directory records named as directories ("a/B.class/") that still
  # declare uncompressed bytes. Extractors create an empty folder and drop
  # the data; ZipFile.getEntry("a/B.class") falls back to the slashed name,
  # so the JVM loads it as the class. Packaging tools never write this.
  - id: java-archive-data-bearing-directory-entries
    desc: ZIP directory entries carry file data
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule java_archive_data_bearing_directory_entries {
          strings:
            $cdh = { 50 4B 01 02 }
          condition:
            uint32(0) == 0x04034b50 and
            for 5 i in (1..#cdh) : (
              uint32(@cdh[i] + 24) > 64 and
              uint16(@cdh[i] + 28) > 7 and
              uint8(@cdh[i] + 46 + uint16(@cdh[i] + 28) - 1) == 0x2f and
              uint32(@cdh[i] + 46 + uint16(@cdh[i] + 28) - 7) == 0x616c632e
            )
        }
composite_rules:
  - id: java-archive-classes-hidden-in-directory-entries
    desc: JAR hides its class bytecode in data-bearing directory entries
    crit: hostile
    conf: 0.93
    attack: T1027,T1140
    all:
      - id: java-archive-data-bearing-directory-entries
      - id: java-archive-slashed-class-folder
  - id: java-archive-caesium-decoy-layout
    desc: JAR class folder Caesium decoy layout
    conf: 0.99
    all:
      - id: java-archive-slashed-class-folder
      - id: java-archive-class-folder-caesium
