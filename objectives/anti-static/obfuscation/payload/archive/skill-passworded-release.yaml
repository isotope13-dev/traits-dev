# Agent-skill lures ship the Windows payload as a password-protected release
# zip ("extract with pass openclaw") so registry and gateway scanners cannot
# open it. Legitimate skills never need an archive password to install.
defaults:
  platforms: [windows, unix]
  # Collectors rename SKILL.md samples (.js); the skill legs anchor the type.
  for: [markdown, text, javascript]
  attack: T1027.013,T1204.002
traits:
  - id: release-zip-extract-with-password-instruction
    desc: Release zip download with extraction password
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)releases/download/\S{1,160}\.(zip|rar|7z)\b[^\n]{0,80}\bextract\w*\s+with\s+pass'
composite_rules:
  - id: agent-skill-passworded-release-payload
    desc: Agent skill ships passworded release payload
    crit: hostile
    conf: 0.96
    all:
      - id: release-zip-extract-with-password-instruction
    any:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: objectives/supply-chain/trojanized/app/agent-skill::skill-decoy-echo-masked-installer
