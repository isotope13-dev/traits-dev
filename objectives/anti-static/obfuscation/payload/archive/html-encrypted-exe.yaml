# An HTML page embedding a ZIP whose first entry is a Windows executable and
# whose entry is encrypted. Inline Base64 keeps the bytes off the wire as a
# file; encryption keeps the executable unreadable to static scanners of
# both the page and the saved archive. Software vendors distributing an
# installer link it or sign it; they do not encrypt it inside a web page.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1027.006,T1027.013
composite_rules:
  - id: html-inline-encrypted-zip-javascript-download
    desc: Encrypted ZIP and JavaScript-name clues with browser download
    for: [html, javascript]
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/encoding/compression::base64-zip-javascript-name-clues
    any:
      - id: micro-behaviors/communications/http/download/archive::encrypted-archive-ms-save-clues
      - id: micro-behaviors/communications/http/download/archive::encrypted-archive-anchor-save-clues

  - id: html-inline-encrypted-zip-hta-download
    desc: Encrypted ZIP holding an HTA browser download
    for: [html, javascript]
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/encoding/compression::base64-zip-hta-entry
    any:
      - id: micro-behaviors/communications/http/download/archive::encrypted-archive-ms-save-clues
      - id: micro-behaviors/communications/http/download/archive::encrypted-archive-anchor-save-clues

  - id: html-inline-encrypted-zip-hta
    desc: HTML inlines encrypted ZIP holding an HTA
    for: [html, javascript]
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
      - id: metadata/file/encoding/compression::base64-zip-hta-entry
      - id: metadata/file/encoding/compression::base64-zip-inline-archive
  - id: html-inline-encrypted-zip-executable
    desc: HTML inlines encrypted ZIP holding an .exe
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
      - id: metadata/file/encoding/compression::base64-zip-exe-entry
      - id: metadata/file/encoding/compression::base64-zip-inline-archive
  - id: html-inline-encrypted-zip-shortcut
    desc: HTML inlines encrypted ZIP holding a shortcut
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
      - id: metadata/file/encoding/compression::base64-zip-lnk-entry
      - id: metadata/file/encoding/compression::base64-zip-inline-archive
