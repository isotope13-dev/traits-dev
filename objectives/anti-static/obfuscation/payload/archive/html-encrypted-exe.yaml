# An HTML page embedding a ZIP whose first entry is a Windows executable and
# whose entry is encrypted. Inline Base64 keeps the bytes off the wire as a
# file; encryption keeps the executable unreadable to static scanners of
# both the page and the saved archive. Software vendors distributing an
# installer link it or sign it; they do not encrypt it inside a web page.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1027.006,T1027.013
composite_rules:
  - id: html-inline-encrypted-zip-executable
    desc: HTML inlines encrypted ZIP holding an .exe
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/encoding::base64-zip-encrypted-entry
      - id: metadata/file/encoding::base64-zip-exe-entry
    any:
      - id: metadata/file/encoding::data-uri-zip-archive
      - id: metadata/file/encoding::base64-zip-string-assignment
