# An unsigned native executable hiding its console while carrying GCM, ZIP,
# and process launch code deserves investigation. Encrypted installers remain
# plausible: this profile is suspicious, and does not claim a proven byte flow.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: hidden-gcm-archive-launch-profile
    desc: Hidden launcher with GCM and ZIP parser code
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/visibility::native-console-hide-profile
      - id: micro-behaviors/crypto/cipher::gcm-tag-length-error
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: metadata/binary/section/entropy::large-elevated-entropy-rdata
      - id: micro-behaviors/data/format/zip-parser::zip-central-directory-error
    unless:
      - id: metadata/signed/platform/
