# HTML smuggling of an encrypted ZIP behind an analysis-host check. The page
# rebuilds a Base64 ZIP whose entry is encrypted into a Blob and saves it
# through msSaveBlob or a scripted anchor download, so neither the gateway
# nor a scanner of the saved archive sees the payload. The same script tests
# the WebGL renderer for SwiftShader/llvmpipe/VirtualBox/VMware, which only
# headless browsers and analysis VMs report, and is there to withhold the
# archive from sandboxes. A page offering a real download has no reason to
# encrypt it client-side and hide it from virtual GPUs.
# Co-occurrence only: the matcher does not prove the check guards the save.
defaults:
  platforms: [windows, unix]
  # Inline <script> blocks are scanned as JavaScript members.
  for: [javascript]
  attack: T1027.006,T1027.013,T1497.001
composite_rules:
  - id: encrypted-zip-save-with-virtual-gpu-check
    desc: Encrypted ZIP save beside virtual GPU check
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
      - id: micro-behaviors/data/buffer/alloc::uint8array-to-blob-materialization
      - id: objectives/anti-analysis/vm-detect/artifact::js-virtual-gpu-renderer-check
    any:
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-blob
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-bracket
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-hex
      - id: micro-behaviors/communications/http/download/browser::quoted-download-click-strings
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
