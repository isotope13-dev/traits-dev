defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: split-xor-rwx-loader
    desc: Split XOR decoder with runtime RWX protection
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-split-xor-byte-helper
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-cyclic-key-helper-loop
      - id: micro-behaviors/mem/protect/modify::x86-indirect-rwx-protect-call
