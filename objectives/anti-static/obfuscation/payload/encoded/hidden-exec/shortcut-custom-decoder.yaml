defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1027,T1059.001,T1105


composite_rules:
  - id: lnk-custom-base64-hidden-powershell
    desc: LNK custom decoder launches hidden PowerShell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/decode/base64/custom::lnk-custom-base64-decoder
      - id: micro-behaviors/process/argument/interpreter::lnk-powershell-argument-reference
      - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
    near_bytes: 4096
