defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-system-base64-decode
    desc: Ruby executes a Base64-decoded command
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: ruby
      query: |
        ((call !receiver method: (identifier) @system
          arguments: (argument_list .
            (call receiver: (constant) @base64 method: (identifier) @decode))) @execution
        (#eq? @system "system") (#eq? @base64 "Base64")
        (#match? @decode "^(decode64|strict_decode64|urlsafe_decode64)$"))
