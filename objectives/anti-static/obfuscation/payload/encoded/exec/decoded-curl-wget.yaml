defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: suspicious
  attack: T1027
  mbc: E1014
  for:
  - python
  - shell
  - elf
  - macho
  - pe
traits: []
composite_rules:
- id: decoded-http-client-command
  desc: Encoded payload invokes an HTTP client
  crit: suspicious
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/shell/command-string::decoded-curl-command
  - id: micro-behaviors/process/create/shell/command-string::decoded-wget-command
  - id: micro-behaviors/process/create/shell/command-string::decoded-powershell-download-command
  all:
  - id: decoded-command-execution-sink
  for:
  - shell
  - python
- id: encoded-powershell-download-concealment
  for:
  - shell
  - python
  desc: Encoded PowerShell download command concealed
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.001
  all:
  - id: micro-behaviors/process/create/shell/command-string::decoded-powershell-download-command
  - id: micro-behaviors/process/interpreter/powershell/command::powershell-encoded-payload-command-text
