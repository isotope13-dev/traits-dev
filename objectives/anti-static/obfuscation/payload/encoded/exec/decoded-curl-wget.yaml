defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: suspicious
  attack: T1027
  mbc: E1014
  for:
  - shell
  - python
traits: []
composite_rules:
- id: decoded-http-client-command
  desc: Encoded payload invokes an HTTP client
  crit: suspicious
  conf: 0.95
  for:
  - shell
  - python
  - text
  any:
  - id: micro-behaviors/process/create/shell/encoded::decoded-curl-command
  - id: micro-behaviors/process/create/shell/encoded::decoded-wget-command
  - id: micro-behaviors/process/create/shell/encoded::decoded-powershell-download-command
  all:
  - id: decoded-command-execution-sink
- id: encoded-powershell-download-concealment
  desc: Encoded PowerShell download command concealed
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.001
  all:
  - id: micro-behaviors/process/create/shell/encoded::decoded-powershell-download-command
  - id: metadata/lang/source/syntax/command/invocation::powershell-encoded-payload-command-text
