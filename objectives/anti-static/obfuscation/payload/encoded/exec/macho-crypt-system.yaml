defaults:
  for: [macho]
  platforms: [macos]
composite_rules:
  # These facts co-occur; static matching does not bind crypt output to system.
  - id: adhoc-crypt-template-shell-indicators
    desc: Ad-hoc Mach-O with crypt and shell API clues
    crit: suspicious
    conf: 0.88
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/symbols/name/qualified::cpp-crypt-array-template-reference
      - id: metadata/binary/symbols/name/qualified::cpp-mlcg-prng-symbol-reference
      - id: micro-behaviors/process/create/shell/native::c-system-import
      - id: metadata/binary/section/entropy::high-entropy-const-region
