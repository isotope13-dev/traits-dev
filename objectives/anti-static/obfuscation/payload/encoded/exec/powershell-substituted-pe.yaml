defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: substituted-hex-pe-literal
  desc: Character-substituted PE hex literal
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: "'4D5[A@]9[0-9A-FO!@]{2048,}'\\.Replace"
- id: compiler-name-with-optional-carets
  desc: Carets appear in a .NET runtime path
  crit: component
  conf: 0.98
  if:
    type: text
    regex: '(?i)\\Mi[^\r\n]{0,160}cro[^\r\n]{0,160}\.NET\\[^\r\n]{0,120}\^\^'
- id: caret-separated-identifier-letters
  desc: Carets separate identifier letters
  crit: component
  conf: 0.98
  if:
    type: text
    regex: '(?i)[a-z_]\^+[a-z_]'
composite_rules:
- id: caret-noise-compiler-path
  desc: Caret noise conceals .NET runtime path
  crit: suspicious
  conf: 0.98
  near_bytes: 100
  all:
  - id: compiler-name-with-optional-carets
  - id: caret-separated-identifier-letters
- id: substituted-pe-reflection-compiler-target
  desc: Substituted PE data with reflected invocation
  crit: hostile
  conf: 0.98
  all:
  - id: substituted-hex-pe-literal
  - id: caret-noise-compiler-path
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-assembly-type-reference
  - id: micro-behaviors/metaprogramming/reflection/invoke::batch-null-reflection-invocation
