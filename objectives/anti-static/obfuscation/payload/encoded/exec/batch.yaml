# Encoded content reaches an execution sink.
defaults:
  crit: hostile
  platforms: [windows]
  for: [batch]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: batch-obfuscated-double-payload-loader
    desc: Batch loader with comment and marker payload carriers
    conf: 0.98
    all:
      - id: micro-behaviors/data/encode/payload::batch-comment-base64-carrier
      - id: micro-behaviors/data/encode/payload::batch-marker-base64-carrier
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-long-random-envvar-reassembly

  - id: batch-obfuscated-payload-self-copy
    desc: Obfuscated batch carries payload and self-copy logic
    conf: 0.99
    attack: "T1027,T1140,T1547.001"
    all:
      - id: metadata/file/line::batch-line-over-100000
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-long-random-envvar-reassembly
      - id: objectives/persistence/login/self-install/script::batch-obfuscated-self-copy

  - id: batch-base64-staged-execution
    desc: Batch reconstructs Base64 payload and executes it
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/file-exec/command/batch::temp-powershell-stage-rebuild
      - id: micro-behaviors/fs/write/file/binary::embedded-powershell-base64-write-all-bytes
    any:
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
      - id: micro-behaviors/fs/path/temp::batch-script-path-reference
      - id: micro-behaviors/fs/path/temp::batch-data-path-reference
    needs: 1
