defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: batch-substitution-base64-eval
  desc: Base64 substitution feeds PowerShell evaluation
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?is)Frombase64string.{0,100}\.repl.{0,100};iex\s+\$'
composite_rules:
- id: batch-hidden-substituted-base64-command
  desc: Hidden PowerShell evaluates substituted Base64
  crit: hostile
  conf: 0.98
  all:
  - id: batch-substitution-base64-eval
  - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
