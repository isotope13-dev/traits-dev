# Encoded content reaches an execution sink.
defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - powershell
  - python
  - javascript
  - shell
  - php
traits:
- id: exec-unhexlify
  desc: Executes hex-decoded Python source
  crit: suspicious
  conf: 0.98
  for: [python]
  mbc: B0032
  attack: T1027,T1059.006
  if:
    type: symbol
    kind: call
    exact: exec
    arg:
      index: 0
      from:
        call: '(^|\.)unhexlify$'
- id: base64-docker-login-password
  desc: Decoded token feeds docker login
  crit: notable
  conf: 0.93
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: base64[\s\S]{0,240}docker login --username
- id: go-exec-gpg-command
  desc: Go executes gpg or gpg2 command
  crit: notable
  conf: 0.95
  for:
  - go
  if:
    type: text
    regex: exec\.Command\("gpg2?"
- id: python-chunk-concat-base64
  desc: Concatenates chunked Base64 payload strings
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: '[A-Za-z_]\w*\s*\+=\s*["''][A-Za-z0-9+/]{40,}'
  count_min: 3
- id: inline-ruby-command-text
  desc: Inline Ruby command text
  crit: notable
  conf: 0.92
  for:
  - shell
  - github-actions
  if:
    type: text
    regex: \bruby\s+(-e|<<)
- id: inline-ruby-base64-decode-text
  desc: Inline Ruby base64 decode
  crit: notable
  conf: 0.94
  for:
  - shell
  - github-actions
  if:
    type: text
    substr: Base64.decode64
- id: inline-ruby-eval-text
  desc: Inline Ruby eval text
  crit: notable
  conf: 0.92
  for:
  - shell
  - github-actions
  if:
    type: text
    regex: \b(eval|instance_eval)\s*\(
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
    - id: metadata/file/format/structured::serialized-news-article-catalog
- id: inline-ruby-class-eval-text
  desc: Inline Ruby class eval text
  crit: notable
  conf: 0.92
  for:
  - shell
  - github-actions
  if:
    type: text
    regex: \b(class_eval|module_eval)\s*\(
- id: hex-encoded-eval
  desc: Hex-encoded "eval" string
  crit: suspicious
  conf: 0.95
  attack: T1027
  for:
  - python
  if:
    type: text
    regex: eval\s*\(\s*["']\\\\145\\\\166\\\\141\\\\154["']
- id: hex-escape-eval
  desc: Hex escape encoded "eval"
  crit: suspicious
  conf: 0.95
  attack: T1027
  for:
  - python
  if:
    type: text
    regex: eval\s*\(\s*["']\\\\x65\\\\x76\\\\x61\\\\x6c["']
- id: exported-decryptor
  desc: Module exports decryption function
  crit: notable
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)module\.exports\s*=\s*function.{0,120}\b(decrypt|decipher|decryptor)\b
- id: decode-exec-js
  desc: JS literal combines atob with dynamic execution
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: literal
    regex: atob.{0,64}(eval|Function)
  unless:
  - id: well-known/dual-use/packaging/javascript-obfuscator::official-archive-context
  - id: well-known/dual-use/packaging/javascript-obfuscator::implementation-context
  # The tool's own atob/decode templates ship in its bundles and sourcemaps.
  - id: well-known/dual-use/packaging/javascript-obfuscator::tool-option-surface-context
  # Sourcemap data blobs and decoded template fragments carry the option
  # names without the full bundle surface; each still identifies the tool.
  - id: well-known/dual-use/packaging/javascript-obfuscator::option-debug-protection-name
  - id: well-known/dual-use/packaging/javascript-obfuscator::option-string-array-encoding-name
  - id: well-known/dual-use/packaging/javascript-obfuscator::option-self-defending-name
- id: hex-payload-pe-stub
  desc: Hex-encoded PE DOS stub
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: micro-behaviors/communications/http/services/github::github-camo-image-proxy-url
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  if:
    type: encoded
    encoding: hex
    substr: This program
- id: hex-payload-html
  desc: Hex-encoded HTML payload
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: <html
    case_insensitive: true
- id: hex-payload-powershell
  desc: Hex-encoded PowerShell payload
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: powershell
    case_insensitive: true
- id: hex-payload-cmd
  desc: Hex-encoded cmd.exe payload
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: cmd.exe
    case_insensitive: true
- id: hex-payload-binsh
  desc: Hex-encoded /bin/sh payload
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: /bin/sh
- id: hex-payload-http
  desc: Hex-encoded HTTP payload
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - type: text
    substr: camo.githubusercontent.com
  if:
    type: encoded
    encoding: hex
    substr: http
  not:
  - regex: ^F{16}C90FDAA2
  - regex: A{256,}
- id: sh2bin-markers
  desc: sh2bin build or module marker
  crit: suspicious
  conf: 0.98
  size_min: 1000000
  for:
  - elf
  if:
    type: text
    regex: carlospolop/sh2bin|/PEASS-ng/sh2bin/sh2bin.go
- id: encoded-linpeas-markers
  desc: Encoded LinPEAS script markers
  crit: suspicious
  conf: 0.98
  size_min: 1000000
  for:
  - elf
  if:
    type: text
    substr: IyEvYmluL3NoClZFUlNJT049Im5nIgpBRFZJU09SWT0
- id: eval-regex-literal
  desc: Regex literal matching eval text
  crit: suspicious
  for:
  - python
  if:
    type: text
    substr: r'eval\\(
- id: eval-rewrite-status-text
  desc: Status text about replacing eval statements
  crit: suspicious
  for:
  - python
  if:
    type: text
    regex: Failed to replace eval(, please check if the eval statement is correct\.)?
    not:
    - regex: Failed to replace eval, please check if the eval statement is correct\.
- id: electron-execute-javascript
  desc: Electron executeJavaScript call
  crit: notable
  conf: 0.9
  for:
  - javascript
  if:
    type: text
    substr: executeJavaScript
- id: ruby-pdflatex-export-command
  desc: Ruby pdflatex system call
  crit: notable
  conf: 0.9
  for:
  - ruby
  if:
    type: text
    regex: \bsystem\s*\([^)]{0,80}pdflatex\b
- id: decoded-function-constructor-argument
  desc: Function constructor receives decoded data
  crit: suspicious
  unless:
  - id: well-known/tool/offensive/pentestkit/
  conf: 0.95
  mbc: B0032
  attack: T1140
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |
      [
        (call_expression
          function: (identifier) @ctor
          arguments: (arguments
            (call_expression
              function: (identifier) @decoder))
          (#eq? @ctor "Function")
          (#eq? @decoder "atob"))
        (call_expression
          function: (identifier) @ctor
          arguments: (arguments
            (call_expression
              function: (member_expression
                object: (identifier) @decoder_object
                property: (property_identifier) @decoder_method)))
          (#eq? @ctor "Function")
          (#eq? @decoder_object "Buffer")
          (#eq? @decoder_method "from"))
        (call_expression
          function: (identifier) @ctor
          arguments: (arguments
            (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression
                    object: (identifier) @decoder_object
                    property: (property_identifier) @decoder_method))
                property: (property_identifier) @conversion_method)))
          (#eq? @ctor "Function")
          (#eq? @decoder_object "Buffer")
          (#eq? @decoder_method "from")
          (#eq? @conversion_method "toString"))
        (new_expression
          constructor: (identifier) @ctor
          arguments: (arguments
            (call_expression
              function: (identifier) @decoder))
          (#eq? @ctor "Function")
          (#eq? @decoder "atob"))
        (new_expression
          constructor: (identifier) @ctor
          arguments: (arguments
            (call_expression
              function: (member_expression
                object: (identifier) @decoder_object
                property: (property_identifier) @decoder_method)))
          (#eq? @ctor "Function")
          (#eq? @decoder_object "Buffer")
          (#eq? @decoder_method "from"))
        (new_expression
          constructor: (identifier) @ctor
          arguments: (arguments
            (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression
                    object: (identifier) @decoder_object
                    property: (property_identifier) @decoder_method))
                property: (property_identifier) @conversion_method)))
          (#eq? @ctor "Function")
          (#eq? @decoder_object "Buffer")
          (#eq? @decoder_method "from")
          (#eq? @conversion_method "toString"))
      ]
- id: ruby-eval-base64-direct-flow
