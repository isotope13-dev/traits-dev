defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  # Bind the decoder result to the command argument. Unrelated Base64 use and
  # process execution in the same file do not establish concealed commands.
  - id: php-base64-shell-command
    desc: PHP executes a Base64-decoded shell command
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059
    if:
      type: symbol
      kind: call
      regex: '(?i)^(system|exec|shell_exec|passthru)$'
      arg:
        index: 0
        from:
          call: '(?i)^base64_decode$'
