defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027

traits:
  - id: direct-base64-exec
    desc: Direct Python base64 decode passed to exec
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      kind: call
      regex: ^exec\s*\(\s*(base64\.)?b64decode\s*\(
    unless:
    - id: defensive-python-input-context
    - id: well-known/tool/offensive/cyberstrikeai::oneliner-template-generator
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/app/ai/agent-runtime/local-operator::local-operator-package-context
    - id: objectives/anti-static/obfuscation/control-flow/logic::sshpilot-flatpak-agent-context
    - id: objectives/anti-static/obfuscation/control-flow/logic::remote-python-payload-roundtrip
    - id: metadata/package/documentation/security-testing::authorized-fenced-engagement-guide

composite_rules:
  - id: decoded-shell-command
    desc: Encoded shell call with Base64 code evaluation
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/command-mode::encoded-python-os-system
      - id: direct-base64-exec

  - id: defensive-python-input-context
    desc: Recognized scanner Python execution references
    crit: exception
    any:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/detection/security-scanner::skilltotal-scanner-module-path
      - id: well-known/tool/detection/security-scanner::skilltotal-package-import-marker
      - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
