defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027

composite_rules:
  - id: decoded-shell-command
    desc: Encoded shell call with Base64 code evaluation
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/command-mode::encoded-python-os-system
      - id: micro-behaviors/process/interpreter/eval/direct::python-exec-base64-result
