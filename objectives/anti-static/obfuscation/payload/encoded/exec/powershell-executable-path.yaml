defaults:
  platforms: [windows]
  for: [python]

composite_rules:
- id: encoded-powershell-executable-path
  desc: Encoded PowerShell references executable path
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/lang/source/syntax/command::powershell-encoded-payload-command-text
  - id: micro-behaviors/fs/path/basename::base64-decoded-executable-path
