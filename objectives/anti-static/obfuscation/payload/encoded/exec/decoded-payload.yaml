defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: suspicious
  attack: T1027
  mbc: E1014
  for:
  - python
  - shell
  - elf
  - macho
  - pe
traits:
- id: decoded-pyinstaller-bootloader-runner
  desc: Decoded PyInstaller bootloader runner
  crit: suspicious
  conf: 0.9
  for:
  - python
  if:
    type: encoded
    encoding: base64
    regex: pyinstaller-[0-9.]+/bootloader/build/releasew?/runw?\.exe
composite_rules:
- id: python-decoded-chmod-run
  desc: Decoded payload chmods and runs code
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.004
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/fs/chmod/modify::encoded-os-chmod-call
  - id: metadata/lang/source/syntax/call/invocation::encoded-python-subprocess-call
  unless:
  - id: well-known/tool/development/chromium::chromium-snapshot-bisect-script
- id: python-sdist-decoded-chmod-run-delete
  desc: Package payload chmods, runs, and deletes
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.004,T1070.004
  scope: package
  for:
  - python
  - python-sdist
  all:
  - id: micro-behaviors/fs/chmod/modify::encoded-os-chmod-call
  - id: metadata/lang/source/syntax/call/invocation::encoded-python-subprocess-call
  - id: objectives/evasion/self-delete/file/script::self-delete-python
- id: decoded-pipe-to-shell
  desc: Piped execution in decoded payload
  crit: suspicious
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/shell/encoded::decoded-shell-pipeline-text
  - id: micro-behaviors/process/create/shell/encoded::decoded-interpreter-pipeline-text
  all:
  - id: decoded-command-execution-sink
  for:
  - shell
  - python
- id: decoded-pyinstaller-bootloader-rar
  desc: Decoded PyInstaller bootloader RAR
  crit: suspicious
  conf: 0.92
  for:
  - python
  all:
  - id: metadata/file/encoding/shape::decoded-rar-payload-blob
  - id: decoded-pyinstaller-bootloader-runner
- id: decoded-shell-with-execution-sink
  desc: Encoded shell text with execution sink
  crit: suspicious
  conf: 0.92
  attack: T1059
  for:
  - shell
  - python
  any:
  - id: decoded-shell-command
  - id: metadata/file/encoding/shape::decoded-windows-command
  - id: metadata/file/encoding/shape::decoded-file-creation
  - id: decoded-pipe-to-shell
  all:
  - id: decoded-command-execution-sink
- id: decoded-remote-download-execute
  desc: Decoded remote download-and-execute command
  crit: hostile
  conf: 0.96
  attack: T1105
  mbc: E1105
  for:
  - shell
  - python
  - text
  all:
  - id: decoded-command-execution-sink
  - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
  - id: micro-behaviors/process/create/shell/encoded::decoded-relative-command-text
  any:
  - id: micro-behaviors/process/create/shell/encoded::decoded-curl-command
  - id: micro-behaviors/process/create/shell/encoded::decoded-wget-command
  - id: micro-behaviors/process/create/shell/encoded::decoded-powershell-download-command
- id: decoded-python-urllib-remote-exec
  any:
  - id: metadata/lang/encoding/base64::base64-evaluation-call-text
  - id: micro-behaviors/metaprogramming/generation/compile::base64-compile-call-text
  desc: Encoded payload imports Python networking and executes decoded code
  crit: hostile
  conf: 0.99
  attack: T1027,T1105,T1059.006
  mbc: E1014,B0024
  for:
  - python
  all:
  - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
  - id: metadata/lang/encoding/base64::encoded-python-system-import-text
- id: encoded-ipv4-download-subprocess
  desc: Encoded blob downloads from a literal IP
  crit: hostile
  conf: 0.96
  attack: T1027,T1105
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/communications/url/encoded::base64-decoded-ipv4-http-url
  - id: metadata/lang/source/syntax/call/invocation::encoded-python-subprocess-call
  - id: objectives/anti-static/obfuscation/encoding/content::base64-exec-text
- id: encoded-chmod-download-run
  desc: Encoded stage chmods then runs a file
  crit: hostile
  conf: 0.96
  attack: T1027,T1105
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/fs/chmod/modify::encoded-os-chmod-call
  - id: metadata/lang/source/syntax/call/invocation::encoded-python-subprocess-call
  - id: micro-behaviors/communications/url/encoded::base64-decoded-ipv4-http-url
- id: decoded-command-execution-sink
  desc: Encoded text with interpreter execution sink
  crit: suspicious
  conf: 0.95
  for:
  - shell
  - python
  - text
  any:
  - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-decrypt-dynamic-exec
