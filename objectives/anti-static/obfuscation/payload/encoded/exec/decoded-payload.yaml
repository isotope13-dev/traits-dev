defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: suspicious
  attack: T1027
  mbc: E1014
  for:
  - python
  - shell
  - elf
  - macho
  - pe
traits:
- id: decoded-file-creation-a
  desc: Decoded payload creates text or exe
  crit: suspicious
  conf: 0.85
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&])\\s*[^<\\r\\n]{0,50}\\.(txt|exe|dll)\\s*>
  not:
  - substr: '"file":"polyglot-no'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/lib/runtime/scripted/electron::electron-bundled-node-runtime
  - id: well-known/app/productivity/silverbullet::official-silverbullet-context
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
  - id: well-known/app/system/mtrinistudio::mtrini-template-module
- id: decoded-file-creation-b
  desc: Decoded payload creates script files
  crit: suspicious
  conf: 0.85
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&])\\s*[^<\\r\\n]{0,50}\\.(bat|ps1)\\s*>
- id: decoded-windows-type-nul
  desc: Decoded Windows empty-file command
  crit: suspicious
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    substr: type nul
  not:
  - substr: '"file":"polyglot-no'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/tool/offensive/projectdiscovery/
  - id: micro-behaviors/data/format/pem::begin-boundary
  - id: micro-behaviors/crypto/certificate/usage::pem-begin
- id: decoded-windows-echo-redirect
  desc: Decoded Windows echo file write
  crit: suspicious
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\\s*echo\\s+[^<\\r\\n]{0,50}>
  not:
  - substr: '"file":"polyglot-no'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/tool/offensive/projectdiscovery/
- id: decoded-windows-copy-redirect
  desc: Decoded Windows copy file write
  crit: suspicious
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\\s*copy\\s+[^<\\r\\n]{0,50}>
  not:
  - substr: '"file":"polyglot-no'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/tool/offensive/projectdiscovery/
  - id: well-known/app/productivity/silverbullet::official-silverbullet-context
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
  - id: well-known/app/system/mtrinistudio::mtrini-template-module
- id: decoded-windows-del-command
  desc: Decoded Windows delete command
  crit: notable
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&])\\s*del\\s+
  not:
  - substr: '"file":"polyglot-no'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/tool/offensive/projectdiscovery/
  - id: well-known/lib/runtime/scripted/electron::electron-bundled-node-runtime
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
  - id: well-known/app/system/mtrinistudio::mtrini-template-module
- id: decoded-eval-exec
  desc: Code execution in decoded payload
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: base64
    regex: eval\(|exec\(|compile\(
  not:
  - substr: '"file":"polyglot-no'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/app/productivity/silverbullet::official-silverbullet-context
- id: decoded-rar-archive
  desc: Decoded RAR archive payload
  crit: suspicious
  conf: 0.88
  if:
    type: encoded
    encoding: base64
    regex: ^Rar!
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
- id: decoded-pyinstaller-bootloader-runner
  desc: Decoded PyInstaller bootloader runner
  crit: suspicious
  conf: 0.9
  for:
  - python
  if:
    type: encoded
    encoding: base64
    regex: pyinstaller-[0-9.]+/bootloader/build/releasew?/runw?\.exe
composite_rules:
- id: python-zlib-b64-temp-exe
  desc: Runs a decompressed temp-exe blob
  crit: hostile
  conf: 0.97
  attack: T1027,T1105
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
  - id: micro-behaviors/process/create/subprocess::popen-ast
- id: python-hidden-popen-temp-exe
  desc: Hidden Popen of a temp-dir exe
  crit: hostile
  conf: 0.96
  attack: T1564.003,T1105
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/process/create/flags::startupinfo
  - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
  - id: micro-behaviors/process/create/subprocess::popen-ast
- id: python-decoded-chmod-run
  desc: Decoded payload chmods and runs code
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.004
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/fs/chmod/modify::encoded-os-chmod-call
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-subprocess-call
- id: python-sdist-decoded-chmod-run-delete
  desc: Package payload chmods, runs, and deletes
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.004,T1070.004
  scope: package
  for:
  - python
  - python-sdist
  all:
  - id: micro-behaviors/fs/chmod/modify::encoded-os-chmod-call
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-subprocess-call
  - id: objectives/evasion/self-delete/file/script::self-delete-python
- id: decoded-file-creation
  desc: File creation in decoded payload
  crit: suspicious
  conf: 0.85
  any:
  - id: decoded-file-creation-a
  - id: decoded-file-creation-b
- id: decoded-pipe-to-shell
  desc: Piped execution in decoded payload
  crit: suspicious
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/shell/command-string::decoded-shell-pipeline-text
  - id: micro-behaviors/process/create/shell/command-string::decoded-interpreter-pipeline-text
  all:
  - id: decoded-command-execution-sink
  for:
  - shell
  - python
- id: decoded-windows-command
  desc: Decoded Windows file command
  crit: suspicious
  conf: 0.8
  any:
  - id: decoded-windows-type-nul
  - id: decoded-windows-echo-redirect
  - id: decoded-windows-copy-redirect
  - id: decoded-windows-del-command
  unless:
  - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
- id: decoded-rar-payload-blob
  desc: Large decoded RAR payload
  crit: suspicious
  conf: 0.9
  for:
  - python
  all:
  - id: decoded-rar-archive
  - id: metadata/file/line::very-long-source-line
- id: decoded-pyinstaller-bootloader-rar
  desc: Decoded PyInstaller bootloader RAR
  crit: suspicious
  conf: 0.92
  for:
  - python
  all:
  - id: decoded-rar-payload-blob
  - id: decoded-pyinstaller-bootloader-runner
- id: decoded-shell-with-execution-sink
  desc: Encoded shell text with execution sink
  crit: suspicious
  conf: 0.92
  attack: T1059
  for:
  - shell
  - python
  any:
  - id: decoded-shell-command
  - id: decoded-windows-command
  - id: decoded-file-creation
  - id: decoded-pipe-to-shell
  all:
  - id: decoded-command-execution-sink
- id: decoded-remote-download-execute
  desc: Decoded remote download-and-execute command
  crit: hostile
  conf: 0.96
  attack: T1105
  mbc: E1105
  for:
  - shell
  - python
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/app/productivity/silverbullet::official-silverbullet-context
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
  - id: well-known/app/system/mtrinistudio::mtrini-template-module
  all:
  - id: decoded-command-execution-sink
  - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
  - id: micro-behaviors/process/create/shell/command-string::decoded-curl-command
  - id: micro-behaviors/process/create/shell/command-string::decoded-relative-command-text
- id: decoded-python-urllib-remote-exec
  desc: Encoded payload imports Python networking and executes decoded code
  crit: hostile
  conf: 0.99
  attack: T1027,T1105,T1059.006
  mbc: E1014,B0024
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
  - id: decoded-eval-exec
  - id: metadata/import/package::encoded-python-system-import-text
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
- id: encoded-ipv4-download-subprocess
  desc: Encoded blob downloads from a literal IP
  crit: hostile
  conf: 0.96
  attack: T1027,T1105
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/communications/http/url/encoded::base64-decoded-ipv4-http-url
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-subprocess-call
  - id: objectives/anti-static/obfuscation/control-flow/logic::base64-exec-text
- id: encoded-chmod-download-run
  desc: Encoded stage chmods then runs a file
  crit: hostile
  conf: 0.96
  attack: T1027,T1105
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/fs/chmod/modify::encoded-os-chmod-call
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-subprocess-call
  - id: micro-behaviors/communications/http/url/encoded::base64-decoded-ipv4-http-url
- id: decoded-command-execution-sink
  desc: Encoded text with interpreter execution sink
  crit: suspicious
  conf: 0.95
  for:
  - shell
  - python
  any:
  - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-decrypt-dynamic-exec
