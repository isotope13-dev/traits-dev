defaults:
  platforms:
  - windows
  - unix
  for:
  - python
composite_rules:
- id: python-one-line-base64-exec-large-string
  desc: One-line Python eval with Base64 decoding and a 10 KB string
  crit: suspicious
  conf: 0.98
  attack: T1027,T1140,T1059.006
  mbc: B0032
  all:
  - id: metadata/file/profile/string-population::python-string-at-least-10k
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-single-line-dynamic-exec
  unless:
  - id: well-known/lib
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
