defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027,T1059.006

# Base85 decode, zlib inflate and exec() in one short region is a staged
# loader: an embedded blob is unpacked and run. The method-call traits are
# alias-proof, so `import base64 as x, zlib as y` loaders still match.
composite_rules:
  - id: python-b85-zlib-exec-payload
    desc: Python decodes, inflates and execs an embedded blob
    crit: hostile
    conf: 0.97
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/base85::b85decode-method-call
      - id: micro-behaviors/data/compression::python-module-decompress-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
