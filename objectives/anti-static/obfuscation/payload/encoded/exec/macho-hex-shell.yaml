defaults:
  for: [macho]
  platforms: [macos]
composite_rules:
  # This is a co-occurrence signal; it does not prove that the hex text is
  # decoded or passed to system(). Signed binaries may legitimately do both.
  - id: adhoc-long-hex-shell-api
    desc: Ad-hoc Mach-O with long hex and shell API
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/file/profile/process::few-imports-system-reference
    any:
      - id: metadata/file/encoding/hex::long-hex-text-run
      - id: metadata/file/encoding/hex::macho-long-hex-raw-run
