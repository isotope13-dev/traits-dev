# SHC's runtime decrypts a shell script and passes it to execvp. This is
# concealed execution, including when the packaged script is harmless.
# RC4, a section ratio, and exec alone do not establish that relationship.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: shc-encrypted-script-launcher
    desc: SHC wrapper decrypts and executes script
    crit: suspicious
    conf: 0.95
    size_max: 262144
    all:
      - id: metadata/lang/compiler/native::shc-script-wrapper
      - id: micro-behaviors/crypto/symmetric/stream/rc4::arc4-routine-symbol
      - id: metadata/binary/section/ratio::data-larger-than-cstring
      - id: micro-behaviors/process/create/exec::c-exec-variants
      - id: metadata/signed/trust-level::unsigned-macho
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
