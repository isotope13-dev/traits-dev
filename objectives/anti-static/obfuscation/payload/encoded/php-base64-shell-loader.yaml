defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001,T1041

composite_rules:
- id: php-base64-shell-loader
  desc: PHP decodes base64 before shell execution
  crit: hostile
  conf: 0.99
  for: [php, zip]
  scope: archive
  all:
  - id: micro-behaviors/data/decode/symbol-base64::php-base64-decode-call
  - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
  - id: base64-exec-proximity