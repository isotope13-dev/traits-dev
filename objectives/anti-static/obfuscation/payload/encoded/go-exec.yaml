# Obfuscated Payload Execution - Go
# GuardDog-inspired: Base64 + exec.Command execution patterns
# ATT&CK: T1140 (Deobfuscate/Decode Files or Information)
defaults:
  attack: T1140
  mbc: B0032
  platforms: [linux, macos, windows, unix, android, ios]
  for: [go]
composite_rules:
  # === GuardDog: Base64 + exec proximity ===
  - id: base64-exec-command-proximity
    desc: Base64 decode + exec.Command
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/process/create/direct::exec-command
    unless:
      - id: metadata/package/testing/
  - id: base64-start-process-proximity
    desc: Base64 decode + os.StartProcess
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/process/create/direct::start-process
    unless:
      - id: metadata/package/testing/
  - id: base64-syscall-exec-proximity
    desc: Base64 decode + syscall.Exec
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/process/create/direct::syscall-exec
    unless:
      - id: metadata/package/testing/
  # Opaque trimpath metadata is common in generated Go programs, but pairing
  # both opaque identities with a large encoded carrier and os/exec identifies
  # the builder-style process loaders those metadata traits are meant to find.
  - id: opaque-go-encoded-process-loader
    desc: Opaque Go loader carries encoded data and launches a process
    crit: hostile
    conf: 0.95
    for: [pe]
    attack: T1027.013,T1059
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
      - id: objectives/anti-static/obfuscation/payload/encoded::custom-alphabet-encoded-blob
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
