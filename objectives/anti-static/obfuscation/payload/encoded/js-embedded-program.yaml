# Embedded encoded program in JavaScript — the obfuscation shape of a loader
# whose real logic is reached via require() of a char-code-decoded module name.
# The data-shape mechanics live in micro-behaviors/data/; this file retains the
# attack-context-specific dynamic-require fragment used by loader composites.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1027"
traits:
- id: js-encoded-require
  desc: Require of a decoded module name
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'require\s*\(\s*\w+\s*\(\s*\['
  unless:
  - id: metadata/library/structure/
  - id: metadata/package/testing/
