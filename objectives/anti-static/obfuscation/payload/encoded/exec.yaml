defaults:
  platforms: [windows, unix]
  for: [pe, elf, powershell, python, javascript, shell, php]
traits:
  - id: base64-docker-login-password
    desc: Decoded token feeds docker login
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: 'base64[\s\S]{0,240}docker login --username'
  - id: go-exec-gpg-command
    desc: Go executes gpg or gpg2 command
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: 'exec\.Command\("gpg2?"'
  - id: python-chunk-concat-base64
    desc: Concatenates chunked Base64 payload strings
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '[A-Za-z_]\w*\s*\+=\s*["''][A-Za-z0-9+/]{40,}'
    count_min: 3
  - id: inline-ruby-command-text
    desc: Inline Ruby command text
    crit: notable
    conf: 0.92
    for: [shell, github-actions]
    if:
      type: text
      regex: '\bruby\s+(-e|<<)'
  - id: inline-ruby-base64-decode-text
    desc: Inline Ruby base64 decode
    crit: notable
    conf: 0.94
    for: [shell, github-actions]
    if:
      type: text
      substr: Base64.decode64
  - id: inline-ruby-eval-text
    desc: Inline Ruby eval text
    crit: notable
    conf: 0.92
    for: [shell, github-actions]
    if:
      type: text
      regex: '\b(eval|instance_eval)\s*\('
  - id: inline-ruby-class-eval-text
    desc: Inline Ruby class eval text
    crit: notable
    conf: 0.92
    for: [shell, github-actions]
    if:
      type: text
      regex: '\b(class_eval|module_eval)\s*\('
  - id: binascii-unhexlify
    desc: Hex decoding via binascii.unhexlify
    crit: notable
    conf: 0.7
    mbc: B0032
    attack: T1140
    for:
      - python
    if:
      type: text
      substr: binascii.unhexlify
  # Importing unhexlify is ordinary binascii use (urllib3, pip); leg only.
  - id: unhexlify-import
    desc: unhexlify function import
    crit: component
    conf: 0.7
    mbc: B0032
    attack: T1140
    for:
      - python
    if:
      type: text
      regex: from\s+binascii\s+import.{0,50}unhexlify
  - id: binascii-import
    desc: binascii module import
    crit: notable
    conf: 0.9
    for:
      - python
    if:
      type: text
      regex: import\s+binascii\b
  - id: hex-encoded-eval
    desc: Hex-encoded "eval" string
    crit: suspicious
    conf: 0.95
    attack: T1027
    for:
      - python
    if:
      type: text
      regex: eval\s*\(\s*["']\\\\145\\\\166\\\\141\\\\154["']
  - id: hex-escape-eval
    desc: Hex escape encoded "eval"
    crit: suspicious
    conf: 0.95
    attack: T1027
    for:
      - python
    if:
      type: text
      regex: eval\s*\(\s*["']\\\\x65\\\\x76\\\\x61\\\\x6c["']
  - id: exported-decryptor
    desc: Module exports decryption function
    crit: notable
    conf: 0.8
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '(?i)module\.exports\s*=\s*function.{0,120}\b(decrypt|decipher|decryptor)\b'
  - id: decode-exec-js
    desc: JS literal combines atob with dynamic execution
    crit: suspicious
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: literal
      regex: atob.{0,64}(eval|Function)
    unless:
      - id: well-known/dual-use/packaging/javascript-obfuscator::official-archive-context
      - id: well-known/dual-use/packaging/javascript-obfuscator::implementation-context
  - id: hex-payload-pe-stub
    desc: Hex-encoded PE DOS stub
    crit: notable
    conf: 0.75
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
      # GitHub Camo intentionally stores the proxied image URL as a hex path.
      # Decoding that path to http(s) is transport metadata, not concealment.
      - id: micro-behaviors/communications/http/services/github::github-camo-image-proxy-url
    if:
      type: encoded
      encoding: hex
      substr: This program
  - id: hex-payload-html
    desc: Hex-encoded HTML payload
    crit: notable
    conf: 0.75
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
    if:
      type: encoded
      encoding: hex
      substr: <html
      case_insensitive: true
  - id: hex-payload-powershell
    desc: Hex-encoded PowerShell payload
    crit: notable
    conf: 0.75
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
    if:
      type: encoded
      encoding: hex
      substr: powershell
      case_insensitive: true
  - id: hex-payload-cmd
    desc: Hex-encoded cmd.exe payload
    crit: notable
    conf: 0.75
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
    if:
      type: encoded
      encoding: hex
      substr: cmd.exe
      case_insensitive: true
  - id: hex-payload-binsh
    desc: Hex-encoded /bin/sh payload
    crit: notable
    conf: 0.75
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
    if:
      type: encoded
      encoding: hex
      substr: /bin/sh
  - id: hex-payload-http
    desc: Hex-encoded HTTP payload
    crit: notable
    conf: 0.75
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
      # `camo.githubusercontent.com/<sha1>/<hex>` is how every README image on
      # GitHub renders: the proxy hex-encodes the original URL into its path.
      # Packages carry those links in JSDoc comments -- async ships four such
      # files -- so the hex decodes to `https://...` because it *is* a URL.
      - type: text
        substr: camo.githubusercontent.com
    if:
      type: encoded
      encoding: hex
      substr: http
    not:
      - regex: ^F{16}C90FDAA2
      - regex: A{256,}
  - id: sh2bin-markers
    desc: sh2bin build or module marker
    crit: suspicious
    conf: 0.98
    size_min: 1000000
    for: [elf]
    if:
      type: text
      regex: carlospolop/sh2bin|/PEASS-ng/sh2bin/sh2bin.go
  - id: encoded-linpeas-markers
    desc: Encoded LinPEAS script markers
    crit: suspicious
    conf: 0.98
    size_min: 1000000
    for: [elf]
    if:
      type: text
      substr: IyEvYmluL3NoClZFUlNJT049Im5nIgpBRFZJU09SWT0
  - id: eval-regex-literal
    desc: Regex literal matching eval text
    crit: suspicious
    for: [python]
    if:
      type: text
      substr: 'r''eval\\('
  - id: eval-rewrite-status-text
    desc: Status text about replacing eval statements
    crit: suspicious
    for: [python]
    if:
      type: text
      # EasySpider's page-script helper prints this bilingual failure line when
      # a user-supplied expression cannot be executed in the browser. The
      # optional clause is consumed so the not: span covers that sentence
      # and a bare "Failed to replace eval" elsewhere still matches.
      regex: 'Failed to replace eval(, please check if the eval statement is correct\.)?'
      not:
        - regex: 'Failed to replace eval, please check if the eval statement is correct\.'
  - id: electron-execute-javascript
    desc: Electron executeJavaScript call
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      substr: executeJavaScript
  - id: browser-create-image-bitmap
    desc: Browser createImageBitmap call
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      substr: createImageBitmap
  - id: ruby-pdflatex-export-command
    desc: Ruby pdflatex system call
    crit: notable
    conf: 0.9
    for: [ruby]
    if:
      type: text
      regex: '\bsystem\s*\([^)]{0,80}pdflatex\b'

  - id: decoded-function-constructor-argument
    desc: Function constructor receives decoded data
    crit: suspicious
    unless:
      - id: well-known/tool/offensive/pentestkit/
    conf: 0.95
    mbc: B0032
    attack: T1140
    for: [javascript, typescript]
    if:
      # Match executable syntax, not filter rules, signatures, or documentation
      # that quote `new Function(atob(...))` as inert text.
      type: tree-sitter
      query: |
        [
          (call_expression
            function: (identifier) @ctor
            arguments: (arguments
              (call_expression
                function: (identifier) @decoder))
            (#eq? @ctor "Function")
            (#eq? @decoder "atob"))
          (call_expression
            function: (identifier) @ctor
            arguments: (arguments
              (call_expression
                function: (member_expression
                  object: (identifier) @decoder_object
                  property: (property_identifier) @decoder_method)))
            (#eq? @ctor "Function")
            (#eq? @decoder_object "Buffer")
            (#eq? @decoder_method "from"))
          (call_expression
            function: (identifier) @ctor
            arguments: (arguments
              (call_expression
                function: (member_expression
                  object: (call_expression
                    function: (member_expression
                      object: (identifier) @decoder_object
                      property: (property_identifier) @decoder_method))
                  property: (property_identifier) @conversion_method)))
            (#eq? @ctor "Function")
            (#eq? @decoder_object "Buffer")
            (#eq? @decoder_method "from")
            (#eq? @conversion_method "toString"))
          (new_expression
            constructor: (identifier) @ctor
            arguments: (arguments
              (call_expression
                function: (identifier) @decoder))
            (#eq? @ctor "Function")
            (#eq? @decoder "atob"))
          (new_expression
            constructor: (identifier) @ctor
            arguments: (arguments
              (call_expression
                function: (member_expression
                  object: (identifier) @decoder_object
                  property: (property_identifier) @decoder_method)))
            (#eq? @ctor "Function")
            (#eq? @decoder_object "Buffer")
            (#eq? @decoder_method "from"))
          (new_expression
            constructor: (identifier) @ctor
            arguments: (arguments
              (call_expression
                function: (member_expression
                  object: (call_expression
                    function: (member_expression
                      object: (identifier) @decoder_object
                      property: (property_identifier) @decoder_method))
                  property: (property_identifier) @conversion_method)))
            (#eq? @ctor "Function")
            (#eq? @decoder_object "Buffer")
            (#eq? @decoder_method "from")
            (#eq? @conversion_method "toString"))
        ]

  - id: ruby-eval-base64-direct-flow
    desc: Ruby eval directly consumes Base64 decode
    crit: suspicious
    conf: 0.97
    attack: T1059
    mbc: B0032
    for: [ruby]
    # Join the decoder and evaluator at the call expression. Mere proximity
    # also occurs in serializers that decode data and use eval for unrelated
    # metaprogramming.
    if:
      type: text
      regex: '\beval\s*\(?\s*(::)?Base64\.decode64\s*\('
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/cloud/browserstack::package-member-path

composite_rules:
  # A real b64decode call near a shell-enabled subprocess. Merely decoding
  # ordinary subprocess output (screenshots, clipboard images, certificates)
  # does not establish a decoded-command execution flow.
  - id: python-benign-decode-subprocess-context
    desc: Recognized benign Python decode and subprocess context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/tool/development/build/waf::waf-subprocess-command-worker
      - id: micro-behaviors/crypto/certificate/usage::python-pem-certificate-body-decode
      - id: micro-behaviors/crypto/asymmetric/signature::python-minisign-key-material-decode
      - id: well-known/lib/ai/pyaigis::pyaigis-context
      - id: micro-behaviors/ui/window/notify/message::winforms-notifyicon-balloon
      - id: micro-behaviors/data/decode/protobuf::python-protoc-decode-raw-subprocess
      - id: well-known/game/poptracker::poptracker-source-archive-context

  - id: python-b64decode-near-shell-subprocess
    desc: Base64 decode near shell-enabled Python subprocess
    crit: suspicious
    conf: 0.97
    mbc: B0032
    attack: T1059
    for: [python]
    all:
      - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
    near_bytes: 256
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: python-benign-decode-subprocess-context
  - id: profiled-encoded-temp-execution-primitives
    desc: PE combines encoded data, profiling checks, and Temp execution APIs
    crit: suspicious
    conf: 0.97
    attack: T1027,T1497.001
    for: [pe]
    all:
      - id: micro-behaviors/data/encoded::raw-base64-pe-header
      - id: objectives/discovery/system/locale::locale-and-environment-profiling
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
    unless:
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context

  - id: large-hex-string-dup
    desc: Hex-encoded payload content
    crit: notable
    conf: 0.75
    any:
      - id: hex-payload-pe-stub
      - id: hex-payload-html
      - id: hex-payload-powershell
      - id: hex-payload-cmd
      - id: hex-payload-binsh
      - id: hex-payload-http
    unless:
      - id: micro-behaviors/communications/http/services/github::github-camo-image-proxy-url
  - id: exec-function-call
    desc: exec() call marker
    crit: component
    conf: 0.7
    mbc: E1059
    attack: T1059
    for:
      - python
    all:
      - id: micro-behaviors/process/interpreter/python::exec-builtin
    unless:
      - id: well-known/lib/runtime/scripted/python-runtime::python-runtime
  - id: java-bytecode-base64-runtime-exec
    desc: Java class decodes Base64 before Runtime.exec
    crit: suspicious
    conf: 0.96
    mbc: B0032
    attack: T1140
    for: [class]
    scope: leaf
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
    unless:
      - id: metadata/build/bundler/vscode::vscode-language-server-library
  - id: base64-eval-recognized-marker
    desc: Recognized base64 and eval marker
    crit: component
    conf: 0.9
    any:
      - id: electron-ml-parity-harness
      - id: micro-behaviors/communications/http/oauth::oauth-client-sdk-context
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: well-known/lib/web/ecmascript::next-edge-runtime-bundle
      - id: well-known/lib/web/ecmascript::js-base64-library
      - id: eval-regex-literal
      - id: eval-rewrite-status-text
      - id: objectives/anti-static/obfuscation/eval/interpreter::nvidia-bug-report-basename
      - id: objectives/anti-static/obfuscation/eval/interpreter::shell-heredoc-base64-eval
      - id: well-known/tool/detection/clawker::adversarial-payload-fixture
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/package/completeness::has-tests-or-declarations
      - id: micro-behaviors/data/archive/package::makeself-archive-context
      - id: well-known/tool/development/editor/qtcreator::qtcreator-component
  - id: base64-exec-recognized-marker
    desc: Recognized base64 and exec marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/package/completeness::has-tests-or-declarations
      - id: metadata/build/bundler/asset::js-any-bundle-output
      - id: metadata/package/files/dependency::node-modules-path
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: well-known/lib/format/pdfjs::pdfjs-bundle
      - id: well-known/lib/runtime/scripted/shiboken::shiboken-embedded-support-loader
      - id: well-known/lib/development/versioneer::embedded-source-wrapper
      - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
  - id: base64-ssh-keyfile-staging
    desc: Base64 credential staged for SSH identity
    crit: exception
    conf: 0.97
    for: [javascript, typescript]
    scope: file
    near_lines: 16
    all:
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
      - id: micro-behaviors/fs/chmod/modify::node-create-restricted-mode
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
  - id: electron-ml-parity-harness
    desc: Electron ML parity test harness
    crit: component
    conf: 0.95
    for: [javascript]
    all:
      - id: well-known/app/system/electron-auth::electron-ml-parity-token
      - id: electron-execute-javascript
      - id: browser-create-image-bitmap
  - id: base64-eval-proximity
    desc: Nearby Base64 decode and dynamic evaluation
    # Proximity does not prove that decoded bytes reach the evaluation sink.
    # It is strong obfuscation evidence, but not a hostile data-flow claim.
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1140
    # Python and Ruby have direct-flow rules for decode-to-execution patterns;
    # proximity is too broad for helpers that decode data and independently
    # use eval for type resolution or metaprogramming.
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/decode/base64::base64-decoding
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
      - id: micro-behaviors/process/interpreter/eval/compile::function-ctor-call-expr-arg
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
    # A decode in one stage and an unrelated eval elsewhere in a large source
    # file is common in data/ML tooling.  Require the decode and evaluator to
    # be genuinely adjacent so this describes a decode-then-evaluate flow.
    # Source-level adjacency is the useful boundary here.  A byte window can
    # join unrelated helpers in a large Python module (for example, a
    # screenshot decoder and a type-resolution eval), which is not a
    # decode-then-evaluate flow.
    near_lines: 12
    unless:
      - id: well-known/lib/format/pdfjs/
      - id: well-known/lib/runtime/scripted/erb::erb-opal-runtime
      - id: metadata/build/
      - id: well-known/app/enterprise/egroupware/
      - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
      - id: well-known/tool/detection/agent-glovebox::staticscan-eval-payload-fixture-context
  # The benign shapes this idiom legitimately has, held as one named group so
  # every rule that needs them spends a single reference. In all of them the
  # decoded bytes land on disk as DATA -- audio, an SSH identity, a config or
  # a JSON blob -- and the nearby exec runs a fixed, known program against
  # that file rather than the decoded bytes.
  - id: base64-gpg-key-inspection
    desc: Base64 decode feeds gpg key inspection
    crit: notable
    conf: 0.95
    for: [go]
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: go-exec-gpg-command

  - id: base64-exec-known-benign-context
    desc: Decoded bytes are data for a fixed exec
    crit: exception
    conf: 0.97
    # base64-exec-proximity also targets Go, so the exception must evaluate
    # there too; each member still gates on its own file scope.
    for: [pe, elf, powershell, python, javascript, shell, php, go]
    any:
      # Speech-to-text handlers decode uploaded audio, write it to a media
      # file, and invoke a fixed transcription CLI.
      - id: micro-behaviors/hardware/input/audio::base64-audio-whisper-transcription
      # Build/deployment clients accept a Base64-wrapped SSH key, write it
      # with mode 0600, then invoke ssh using that identity.
      - id: base64-ssh-keyfile-staging
      # Same shape in plain shell: the decode is redirected into a config or
      # document and the exec runs a literal program path. Apache Druid's
      # peon.sh writes `${TASK_DIR}/task.json` five lines above its
      # `exec bin/run-java`.
      - id: micro-behaviors/data/decode/base64::base64-decode-lands-in-file
      # Entry-point scripts unpack environment-provided Base64-gzip JSON into
      # a data file, then exec a fixed program that reads it.
      - id: micro-behaviors/data/decode/base64::env-var-base64-gzip-json-to-file
      # Installer integrity check: snapd base64-decodes the expected SHA3-384
      # preseed digest, byte-compares it, aborts on mismatch, then extracts
      # with a fixed tar invocation. The decode feeds the comparison, never
      # the nearby exec.
      - id: micro-behaviors/crypto/hash/file::go-decoded-digest-bytes-compare
      # AWS ECR hands back a base64 token that splits into a registry username
      # and password. The nearby exec is `docker login` with that password on
      # stdin, not the decoded bytes as a program.
      - id: base64-docker-login-password
      # GPG key data is base64-decoded into a temporary file and inspected with
      # a fixed gpg2 invocation to retrieve key identities.
      - id: base64-gpg-key-inspection

  - id: base64-exec-proximity
    desc: Nearby Base64 decode and exec call
    # Proximity alone does not prove that decoded bytes reach the process
    # execution sink. It remains suspicious obfuscation evidence, but cannot
    # support a hostile data-flow claim: build clients may decode a credential,
    # write it to a restricted temporary file, then invoke ssh with that file.
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1140
    for: [scripts, '!jcl', '!python', go]
    # The dropper shape is a decode whose output is handed to an exec, so the
    # two have to sit together. Without a proximity bound this fired on any
    # program that both decodes Base64 somewhere and spawns a process somewhere
    # else -- a screen recorder decoding frame data and spawning ffmpeg
    # hundreds of lines apart, for instance. `near_lines` matches the bound the
    # base64-subprocess-proximity sibling already uses.
    near_lines: 12
    # Lines alone are not a bound in generated output: a webpack chunk puts
    # 318 KB on 13 physical lines, so `near_lines: 12` spans the whole file
    # and every decode is "near" every exec. AnotherRedisDesktopManager's
    # bundle hit this. Byte proximity is what the hostile sibling switched
    # to for the same reason; match its 1024.
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/base64::base64-decoding
    any:
      - id: exec-function-call
      - id: micro-behaviors/process/create/exec/
    unless:
      # The decode-lands-in-a-data-file shapes, as one named group.
      - id: base64-exec-known-benign-context
      - id: metadata/build/
      # The base64-subprocess-proximity sibling below already carries this
      # exclusion; this rule targets the same dropper shape and was missing
      # it. esbuild's own wasm-tests.js decodes a base64 zip fixture into a
      # test directory with fs.writeFileSync, then execFileSync's the
      # already-built esbuild binary against that directory to compare
      # native vs. WASM output -- the exec target is a fixed, known binary,
      # never the decoded bytes.
      - id: metadata/package/testing/
      - id: well-known/lib/web/
      - id: well-known/lib/ui/ace-editor
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      # A spec file that decodes the base64 command its own code just built,
      # to assert on it, is testing the encoder rather than dropping a payload:
      # oh-my-pi's `open.test.ts` decodes the `powershell -EncodedCommand`
      # argument captured from a mocked spawn.
      # The promptfoo site image generator decodes returned image bytes, writes
      # them as PNG data, then invokes a fixed image converter nearby.
      - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: base64-subprocess-proximity
    desc: Base64 decode + subprocess execution
    crit: hostile
    conf: 0.92
    mbc: B0032
    attack: T1059
    # Python's `base64.b64encode(...)` is commonly used to transport ordinary
    # text through a PowerShell/clipboard bridge.  Keep this broad rule for
    # non-Python source and use the call-fact-gated rule below for Python.
