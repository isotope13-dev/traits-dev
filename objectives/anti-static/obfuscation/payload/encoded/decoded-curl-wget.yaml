defaults:
  platforms: [linux, macos, windows]
  crit: suspicious
  attack: "T1027"
  mbc: "E1014"
  for: [python, shell, elf, macho, pe]

traits:
  - id: decoded-curl-command
    desc: "Curl command in decoded payload"
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '(?im)(^|[;&])\s*curl\b'
    unless:
      # Both bare non-exception detection-tool identities; the family's
      # crit:exception members (e.g. security-scanner-identity, agent-security-harness)
      # live in their own subdirectories and are still named explicitly elsewhere.
      - id: well-known/tool/detection/
      - id: well-known/tool/offensive/projectdiscovery/
      - id: well-known/app/system/mtrinistudio::mtrini-template-context
      # wheel-basename/template-module are plain notable identity legs (not
      # exceptions) so the directory ref covers them without excluding anything.
      - id: well-known/app/system/mtrinistudio/
      - id: well-known/app/infrastructure/openshift::openshift-release-ci-step-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
  - id: decoded-wget-command
    desc: "Wget command in decoded payload"
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '(?im)(^|[;&])\s*wget\b'
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
      - id: well-known/tool/detection/llm-scanner::mvar-security-context
      - id: well-known/app/system/mtrinistudio::mtrini-template-context
      - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
      - id: well-known/app/system/mtrinistudio::mtrini-template-module
  - id: decoded-powershell-download-command
    desc: "PowerShell download command in decoded payload"
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '(?im)(^|[;&])\s*(Invoke-WebRequest|iwr)\b'
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
      - id: well-known/tool/detection/llm-scanner::mvar-security-context
      - id: well-known/app/system/mtrinistudio::mtrini-template-context
      - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
      - id: well-known/app/system/mtrinistudio::mtrini-template-module
  - id: decoded-local-execution
    desc: "Local executable invocation in decoded payload"
    crit: suspicious
    conf: 0.95
    for: [python, shell]
    if:
      type: encoded
      encoding: base64
      regex: '(?im)(^|[;&])\s*\./[A-Za-z0-9._$-]{1,80}(\s|[;&]|$)'
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
      - id: well-known/app/system/mtrinistudio::mtrini-template-context
      - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
      - id: well-known/app/system/mtrinistudio::mtrini-template-module

composite_rules:
  - id: decoded-curl-wget
    desc: "Download command in decoded payload"
    crit: suspicious
    conf: 0.95
    any:
      - id: decoded-curl-command
      - id: decoded-wget-command
      - id: decoded-powershell-download-command
