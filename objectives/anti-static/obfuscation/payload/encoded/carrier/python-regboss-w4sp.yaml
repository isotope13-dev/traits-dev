defaults:
  for: [python]
  platforms: [windows]

traits:
  # The compressed-stream fragment identifies the statically decoded W4SP
  # payload; the wrapper markers alone are not sufficient for a verdict.
  - id: python-regboss-w4sp-marshal-carrier
    desc: Compressed W4SP stealer marshal carrier
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.006
    if:
      type: yara
      source: |
        rule python_regboss_w4sp_marshal_carrier {
          strings:
            $wrapper = "__regboss__"
            $loader = "from marshal import loads;exec(loads"
            $stream = "\\xed=\\t{\\xd3F\\xd3\\x7f\\xc5\\x10\\xa0\\x9c\\x89$K\\xb6"
          condition:
            all of them
        }
