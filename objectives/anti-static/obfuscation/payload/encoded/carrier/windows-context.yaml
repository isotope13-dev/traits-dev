# Base64 decoding and a launch call occur together; the matchers do not bind (encoded carrier profile) (representation leaf)
# the decoded bytes to the launched path.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027.002
  mbc: B0024
composite_rules:
  - id: windows-dropper-pattern
    desc: Windows launch with decoded payload context
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    all:
      - id: micro-behaviors/process/create/launch::windows-startfile-exec
      - id: objectives/anti-static/obfuscation/control-flow/logic::b64decode-exec
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/fs/path/temp/
