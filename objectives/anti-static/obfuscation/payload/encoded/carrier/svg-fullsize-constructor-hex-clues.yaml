defaults:
  platforms: [windows, unix]
  for: [svg, html, javascript]

composite_rules:
  - id: svg-fullsize-constructor-hex-clues
    for: [svg]
    desc: Full-size SVG with constructor and hex clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/style::svg-fixed-full-size-style
      - id: objectives/execution/interpreter/eval/dynamic::svg-constructor-property-chain
      - id: micro-behaviors/data/encode/hex::svg-long-hex-string-literal
