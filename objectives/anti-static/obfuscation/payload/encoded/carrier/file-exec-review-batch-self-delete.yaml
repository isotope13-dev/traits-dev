defaults:
  platforms:
  - windows
composite_rules:
- id: obfuscated-batch-embedded-pe
  desc: Obfuscated batch carries embedded base64 PE
  crit: hostile
  conf: 0.97
  attack: "T1027.009"
  for: [batch]
  all:
  - id: metadata/file/encoding/shape::base64-pe-header-text
  any:
  - id: metadata/lang/source/syntax/expansion::batch-interleaved-env-fragments
  - id: metadata/file/line::batch-long-token-saturation
  - id: metadata/file/line::batch-long-line-saturation
  needs: 2
