defaults:
  platforms: [windows]
  for: [postscript, text, data]
  size_min: 8192

traits:
  - id: substituted-dos-header
    desc: Substituted Base64 Windows executable header
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '^#VqQ!!M!!!!E'
  - id: substituted-upx-marker
    desc: Substituted Base64 UPX marker
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'BVUFgh'
  - id: substituted-url-download-api
    desc: Substituted Base64 URL download API
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'BVUkxEb3dubG9hZFRvRmls'
  - id: substituted-internet-open-api
    desc: Substituted Base64 InternetOpen API
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'EludGVybmV0#3Bl'

composite_rules:
  - id: substituted-pe-network-loader
    desc: Substituted PE contains packed download loader
    crit: hostile
    conf: 0.96
    attack: T1027,T1105
    all:
      - id: substituted-dos-header
      - id: substituted-upx-marker
      - id: substituted-url-download-api
      - id: substituted-internet-open-api
