defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: suspicious
  conf: 0.98
traits:
  - id: packed-fnstenv-stack-words
    desc: Packed x86 FNSTENV stack instruction words
    if:
      type: text
      substr: 'ud9c7|u2474'
  - id: packed-edx-xor-feedback-words
    desc: Packed x86 EDX XOR feedback decoder words
    if:
      type: text
      regex: 'u04c2\|u6a03\|u8310\|u6a31\|u5af4|u5af4\|u6a31\|u8310\|u04c2\|u6a03'
composite_rules:
  - id: packed-fpu-xor-feedback-stub
    desc: Packed FPU GetPC XOR feedback decoder words
    all:
      - id: packed-fnstenv-stack-words
      - id: packed-edx-xor-feedback-words
    near_bytes: 600
