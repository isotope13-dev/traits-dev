defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: html-reverse-dataset-embed-clues
    desc: HTML reverse loop, dataset and embed clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/property/access::dom-dataset-store-read
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
