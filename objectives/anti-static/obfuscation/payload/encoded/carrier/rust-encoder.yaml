defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: hostile
  conf: 0.94
traits:
  - id: shellcode-encoder-cli-purpose
    desc: CLI declares shellcode obfuscation purpose
    crit: notable
    if:
      type: string_literal
      regex: '(?i)obfuscat\w*\s+shellcode|shellcode\s+obfuscat'
composite_rules:
  - id: shellcode-address-format-encoder
    desc: Shellcode encoder offers address-format masking
    all:
      - id: shellcode-encoder-cli-purpose
      - id: micro-behaviors/data/encode/custom::address-obfuscation-helper-call
  - id: shellcode-word-format-encoder
    desc: Shellcode encoder offers word-format masking
    all:
      - id: shellcode-encoder-cli-purpose
      - id: micro-behaviors/data/encode/custom::word-obfuscation-helper-call
  - id: shellcode-uuid-format-encoder
    desc: Shellcode encoder offers UUID-format masking
    all:
      - id: shellcode-encoder-cli-purpose
      - id: micro-behaviors/data/encode/custom::uuid-obfuscation-helper-call
