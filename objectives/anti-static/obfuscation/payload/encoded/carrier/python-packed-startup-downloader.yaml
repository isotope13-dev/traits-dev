defaults:
  for: [python]
  platforms: [windows]

traits:
  # Distinct fragments of the statically decoded startup downloader carrier.
  - id: packed-startup-downloader-fragments
    desc: Packed startup downloader fragments
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule packed_startup_downloader_fragments {
          strings:
            $a = "\\122\\\\126\\\\x39\\\\102\\\\x52\\\\x41\\\\x4b\\\\132\\\\170\\\\x57\\\\x45\\\\127\\\\107\\\\165\\"
            $b = "x33\\\\65\\\\x35\\\\x30\\\\x34\\\\141\\\\67\\\\141\\\\x34\\\\141\\\\x34\\\\141\\\\65\\\\64\\\\x36\\"
          condition:
            all of them
        }

composite_rules:
  - id: python-packed-startup-downloader
    desc: Packed carrier contains a Windows startup downloader
    crit: hostile
    conf: 0.99
    attack: T1027,T1547.001,T1105
    scope: file
    all:
      - id: packed-startup-downloader-fragments
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::eval-hex-escaped-identifier
