# Encoded content is observed without a required execution sink. (representation leaf)
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: split-xor-rwx-loader
    desc: Split XOR decoder with runtime RWX protection
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::x86-split-xor-byte-helper
      - id: micro-behaviors/data/control-flow/loop/conditional::x86-cyclic-helper-pointer-loop
      - id: micro-behaviors/mem/protect/modify/executable::x86-indirect-rwx-protect-call
