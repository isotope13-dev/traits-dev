defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: html-reversed-svg-src-clues
    desc: Reversed SVG data URI and source assignment clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/string/reverse::reversed-svg-data-uri-text
      - id: micro-behaviors/communications/http/client/resource::element-src-reversed-value-assignment
