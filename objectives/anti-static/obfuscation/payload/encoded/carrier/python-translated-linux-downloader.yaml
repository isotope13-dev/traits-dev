defaults:
  for: [python]
  platforms: [unix]

traits:
  # These fragments identify the statically decoded Linux script downloader.
  - id: python-translated-base64-linux-downloader
    desc: Translated Base64 Linux downloader carrier
    crit: hostile
    conf: 0.99
    attack: T1027,T1105,T1059.004
    if:
      type: yara
      source: |
        rule translated_base64_linux_downloader {
          strings:
            $exec = "exec(''.join("
            $decode = "base64.b64decode("
            $a = "R1hfIl8iTgk2ImQiZCJHImQJMCIJCScJL182WEdOWAkvXzZYR1hYX08JXgkn"
            $b = "NgkvXzZYR1hYCS9fNlhHWF8JL182WEdYZAkvXzZYR1g2CS9fNlhHWAkJL182"
            $c = "SXdBQ3tBQT5hPkl3QUJBWWE+SXdBQkFCYT5Jd0FCQWFhPkl3QUJBQmE+SXdBQkFJ"
            $d = "SXdBQkF7YT5Jd0FCe3thPkl3QUJBSWFBKXthPkl3QUJBKWFCYT5Jd0FDe3xBWWE+"
          condition:
            $exec and $decode and (($a and $b) or ($c and $d))
        }
