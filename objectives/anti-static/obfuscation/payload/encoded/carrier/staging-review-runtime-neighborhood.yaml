defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  crit: suspicious
composite_rules:
- id: js-base64-powershell-delegate-carrier
  desc: Base64 carrier and encoded PowerShell scaffold
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
  - id: objectives/anti-static/obfuscation/payload/data-file::encoded-powershell-delegate
- id: js-reversed-pe-concatenation-carrier
  desc: Reversed PE Base64 header and concatenation
  conf: 0.96
  all:
  - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
  - id: micro-behaviors/data/string/concat/expression::massive-concatenation-chain
- id: js-reversed-base64-pe-carrier
  desc: Reversed PE header and encoded data clues
  conf: 0.98
  all:
  - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
  - id: metadata/file/line::single-long-line
  - id: micro-behaviors/data/encode/embedded::large-encoded-blob
  - id: metadata/lang/source/comment::base64-like-comment-content
