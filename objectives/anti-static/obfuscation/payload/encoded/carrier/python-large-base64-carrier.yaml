defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: python-large-base64-carrier
    desc: Large Base64-like Python carrier
    crit: notable
    conf: 0.94
    all:
      - id: metadata/lang/source/literal/string/population::python-string-at-least-100k
      - id: metadata/file/encoding/shape::large-python-base64-candidate
