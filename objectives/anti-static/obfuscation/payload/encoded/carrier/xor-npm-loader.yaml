defaults:
  for: [data]
  platforms: [windows]

traits:
  # The two instruction sequences come from JPCERT's Lazarus npmLoader DLL
  # signature, XOR-encoded with the key used by this carrier family.
  - id: xor-d8-npmloader-pe
    desc: XOR-encoded npmLoader Windows DLL
    crit: hostile
    conf: 0.99
    attack: T1027
    if:
      type: yara
      source: |
        rule xor_d8_npmloader_pe {
          strings:
            $code1 = { 59 3A 27 DB D8 D8 99 59 39 27 DB D8 D8 59 3F 27 DB D8 D8 59 39 27 DB D8 D8 }
            $code2 = { 90 EB 09 53 19 99 19 12 D2 19 18 D1 59 3A 27 DB D8 D8 9C EB 08 }
          condition:
            uint16(0) == 0x8295 and
            (uint32(uint32(0x3c) ^ 0xd8d8d8d8) ^ 0xd8d8d8d8) == 0x00004550 and
            all of them
        }
