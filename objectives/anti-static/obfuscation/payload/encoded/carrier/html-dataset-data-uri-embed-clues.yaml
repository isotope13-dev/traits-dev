defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: html-dataset-data-uri-embed-clues
    desc: HTML dataset and data URI embed clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/property/access::dom-dataset-store-read
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
