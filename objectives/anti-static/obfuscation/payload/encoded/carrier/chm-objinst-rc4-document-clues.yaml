defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-objinst-rc4-document-clues
  desc: CHM OBJINST and RC4 document-call clues
  crit: suspicious
  conf: 0.97
  scope: archive
  for: [chm, html]
  all:
    - id: metadata/document/chm::chm-single-user-entry
    - id: metadata/document/chm::chm-has-objinst
    - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::js-rc4-implementation
    - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-document-call
    - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
  unless:
    - id: metadata/document/chm::chm-data-basename
