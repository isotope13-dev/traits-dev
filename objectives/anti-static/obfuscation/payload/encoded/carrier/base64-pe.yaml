# Encoded content is observed without a required execution sink. (representation leaf)
defaults:
  platforms: [windows, unix]
  for: [scripts]
  mbc: F0001.006
  attack: T1027.009
traits:
composite_rules:
  # Wrap-tolerant: anchor on the canonical base64 PE prefix (MZ + fixed DOS
  # header) rather than a 200-char contiguous run, which missed line-wrapped
  # base64 PEs (certutil/MIME/PowerShell 64-76 char lines). See
  # metadata/file/encoding::base64-pe-header-text.
  - id: obfuscation-concealed-encoded-pe
    for: [batch]
    desc: Obfuscated source conceals encoded PE payload
    crit: hostile
    conf: 0.96
    unless:
      - id: metadata/build/bundler/asset::wasm-bindgen-placeholder-marker
    all:
      - id: metadata/file/encoding::base64-pe-header-text
      - id: objectives/anti-static/obfuscation/string/concat::batch-interleaved-env-fragments

  # A reversed PE header is an encoded MZ marker. Requiring both a large
  # encoded-data observation and a single oversized script line keeps this
  # objective specific to concealed executable carriers rather than ordinary
  # Base64 configuration or media data.
  - id: reversed-base64-pe-stage
    desc: JavaScript conceals a reversed Base64-encoded PE stage
    crit: hostile
    conf: 0.98
    for: [javascript]
    all:
      - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
      - id: metadata/file/line::single-long-line
      - id: micro-behaviors/data/encode/embedded::large-encoded-blob

  - id: batch-oversized-base64-pe-carrier
    desc: Batch hides an executable in an oversized Base64 data line
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1140
    for: [batch]
    all:
      - id: objectives/command-and-control/dropper/file-exec/command/batch::batch-base64-pe-prefix
      - id: metadata/file/line::batch-line-over-100000
      - id: objectives/anti-static/obfuscation/string/fragmentation::batch-extreme-line-bloat
