defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027
  mbc: B0032

traits:
  # The hex analogue of the Base64 stage rules below. A script whose body is
  # overwhelmingly one hex here-string is not a script that happens to embed
  # data -- the carrier IS the program, and the few kilobytes of PowerShell
  # wrapped around it exist only to turn it back into code. The size floor is
  # what separates that from an ordinary script carrying an embedded
  # certificate, icon or test vector.
  - id: powershell-oversized-hex-payload-body
    desc: PowerShell body dominated by a hex payload
    crit: suspicious
    conf: 0.95
    size_min: 65536
    if:
      id: micro-behaviors/data/encode/payload::powershell-hex-here-string-carrier

composite_rules:
  - id: powershell-opaque-base64-command-body
    desc: PowerShell hides Base64-like data in a one-line body
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/metrics/encoded::large-embedded-b64-blob
      - id: metadata/file/metrics::file-one-liner
    any:
      - id: micro-behaviors/data/encode/payload::powershell-base64-like-carrier-line
      - id: micro-behaviors/data/encode/payload::powershell-bare-base64-like-carrier-line

  - id: powershell-opaque-base64-stage
    desc: PowerShell reduced to an opaque Base64-like stage
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/metrics/encoded::large-embedded-b64-blob
      - id: metadata/file/metrics::powershell-long-average-line-profile
    any:
      - id: micro-behaviors/data/encode/payload::powershell-base64-like-carrier-line
      - id: micro-behaviors/data/encode/payload::powershell-bare-base64-like-carrier-line

  - id: powershell-parser-opaque-data-body
    desc: PowerShell hides data in a parser-opaque body
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/metrics::file-one-liner
      - id: metadata/file/metrics::powershell-single-giant-identifier
      - id: metadata/file/metrics::powershell-single-identifier-body
      - id: metadata/file/metrics::powershell-minimal-ast-body
    any:
      - id: micro-behaviors/data/encode/payload::powershell-base64-like-carrier-line
      - id: micro-behaviors/data/encode/payload::powershell-bare-base64-like-carrier-line

  - id: powershell-opaque-custom-base32-stage
    desc: PowerShell custom-base32 stage evaluation
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001
    mbc: C0025,E1059
    all:
      - id: micro-behaviors/data/decode/base32::ps-custom-base32-decoder
      - id: micro-behaviors/data/decode/base32::ps-custom-base32-carrier
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

  # Carrier, decoder, key schedule and sink, all in one file. A crypter's whole
  # job. Kept separate from the Base64 stages above because the hex+XOR builder
  # family re-wraps its blob and swaps eval sinks between builds; each leg here
  # names a mechanic rather than a layout, so a re-wrap does not evade it.
  - id: powershell-oversized-hex-payload-decrypt-execute
    desc: Oversized hex payload decrypted and executed
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.001
    mbc: B0032,C0043,E1059
    all:
      - id: powershell-oversized-hex-payload-body
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/crypto/symmetric/xor/loop::byte-array-xor-transform
    any:
      - id: micro-behaviors/process/interpreter/runtime/eval::powershell-iex-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
