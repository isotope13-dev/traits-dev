# An extension that ships a control-flow-flattened, numerically decoded
# script and injects it into a page's MAIN world. The page sees code the
# store reviewer could not read, running with the site's own privileges.
# Licensing and anti-tamper wrappers use the same obfuscators, so this is
# suspicious on its own; the payload's behavior decides more.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1027,T1176

composite_rules:
  - id: extension-main-world-injects-flattened-decoder-script
    desc: Injects flattened decoded script into MAIN world
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: objectives/anti-static/obfuscation/syntax::js-computed-constructor-from-numeric-decoder
      - id: micro-behaviors/data/control-flow/branch::js-while-switch-loop
