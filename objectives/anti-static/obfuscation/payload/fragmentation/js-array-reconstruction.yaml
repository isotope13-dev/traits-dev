# JS Array Reconstruction Obfuscation
# Detects reconstruction of payload from hex char array using index array and eval
defaults:
  platforms: [linux, windows, macos]
  for: [javascript]
traits:
- id: svga-player-bundle--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: videoEntity
  count_max: 1028478
- id: svga-player-bundle--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: SVGAProto
  count_max: 1028479
- id: svga-player-bundle--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: svgaplayer
  count_max: 1028480
composite_rules:
- id: js-large-array-eval-loop
  desc: Evaluates JavaScript built around a large numeric array
  crit: suspicious
  conf: 0.88
  # "Built around" is a claim about one piece of code: the dropper's array, the
  # loop that walks it, and the eval that runs the result sit together. Without
  # a distance bound the legs pair up across a whole bundle -- in Ray's
  # dashboard the speedscope browserify bundle has decode tables at offset ~7k
  # and protobufjs's `eval("quire".replace(/^/,"re"))` optional-require shim at
  # ~81k, two unrelated vendored modules 41 KB apart.
  near_bytes: 4096
  all:
  - id: metadata/lang/source::repeated-large-integer-arrays
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  any:
  - id: micro-behaviors/data/control-flow/analysis::for-loop-content
  downgrade:
    any:
    - id: metadata/library/structure::vscode-extension-generated-asset
    - id: metadata/library/structure::vscode-vendor-output-path
- id: js-hex-array-eval-recognized-marker
  desc: Recognized JS array eval marker
  crit: baseline
  conf: 0.95
  any:
    - id: well-known/lib/web/jquery
    - id: metadata/library/prototype
    - id: metadata/package/testing/harness/runtime::is-test
    - id: metadata/package/testing/presence/fixture::test-filename-pattern
    - id: metadata/package/testing/presence/harness::test-directory
    - id: metadata/lang/scripted::dts-declaration-file
    - id: svga-player-bundle
    - id: well-known/lib/format/conda-package::ray-dashboard-speedscope-bundle
    - id: well-known/app/browser-extension/evernote-web-clipper::extension
- id: svga-player-bundle
  desc: SVGA Player web bundle (animation library)
  crit: baseline
  conf: 0.95
  any:
  - id: svga-player-bundle--rx-1
  - id: svga-player-bundle--rx-2
  - id: svga-player-bundle--rx-3
