# Embedded script loaders carried by native Windows binaries.
# These rules describe the loader shape rather than an IOC: a native PE that
# stores a PowerShell stage as many base64 fragments and reconstructs it through
# a helper-call loop is materially different from an ordinary Go runtime.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032

traits:
  - id: pe-script-base64-fragment-calls
    desc: Base64 fragment helper calls
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bCall\s+[A-Za-z][A-Za-z0-9_]{7,}\s*\(\s*["''][A-Za-z0-9+/]{24,}={0,2}["'']'
    count_min: 8

  - id: pe-script-encoded-dotnet-network-stage
    desc: Encoded .NET network stage
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: '(?i)(WebRequest|GetResponseStream|MemoryStream)'

  - id: pe-script-encoded-reflective-stage
    desc: Encoded reflective .NET stage
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?i)(Reflection\\.Assembly|Assembly::Load|AppDomain|scriptblock)'

composite_rules:
  - id: pe-script-obfuscated-helper-functions
    desc: Long-name VBScript helper definitions
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/scripted::vb-long-name-procedure-header
      - id: metadata/lang/scripted::vb-end-function-statement
    unless:
      - id: metadata/lang/encoded/xor::highlightjs-resource
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/inno-setup::inno-setup-compiler
      - id: metadata/binary/framework::dotnet-assembly
      - id: well-known/lib/runtime/scripted/node-runtime::runtime-pdb-identity
      # Bun embeds JavaScriptCore's injectedScript (whose `function
      # PrototypelessObjectBase()` satisfies the helper-definition atom) and
      # Shiki TextMate grammars (whose ASP keyword list contains "End
      # Function" / "End Sub") in every compiled binary -- grammar data and
      # engine source, not VBScript helpers. hunk.exe is the measured case.
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-windows-runtime-binary
      - id: well-known/tool/sysadmin/microsoft-office::office-c2r-kms-activation-context
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context

  - id: pe-obfuscated-script-stage
    desc: Native PE reconstructs an obfuscated embedded script stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001
    all:
      - id: pe-script-base64-fragment-calls
      - id: pe-script-obfuscated-helper-functions
