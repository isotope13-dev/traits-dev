defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: fragment-reassembly-gui-pointer-call
    desc: Fragment reassembly with GUI indirect invocation
    crit: suspicious
    conf: 0.95
    attack: T1027.009
    # The window procedure invokes an opaque global pointer while the image
    # reconstructs fragments from disjoint pointer/length tables. Co-occurrence
    # supports concealment, but does not identify the recovered payload.
    all:
      - id: micro-behaviors/data/decode/custom::x86-fragment-table-byte-reassembly
      - id: micro-behaviors/data/control-flow/dispatch::x86-gui-global-pointer-call
