defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1027.009
composite_rules:
  - id: offscreen-fragment-executable-buffer
    desc: Offscreen GUI invokes concealed code buffer
    crit: hostile
    conf: 0.98
    # Endpoint triage: concealed executable-buffer activation behind an
    # offscreen GUI is sufficient even when the final payload is unrecovered.
    all:
      - id: fragment-loader-executable-buffer
      - id: micro-behaviors/ui/window/control::x86-create-window-far-negative-origin

  - id: fragment-reassembly-gui-pointer-call
    desc: Fragment reassembly with GUI indirect invocation
    crit: suspicious
    conf: 0.95
    # The window procedure invokes an opaque global pointer while the image
    # reconstructs fragments from disjoint pointer/length tables. Co-occurrence
    # supports concealment, but does not identify the recovered payload.
    all:
      - id: micro-behaviors/data/decode/custom::x86-fragment-table-byte-reassembly
      - id: micro-behaviors/data/control-flow/dispatch/indirect::x86-gui-global-pointer-call
    # The export-walk composite already includes both of these legs.
    unless:
      - id: objectives/anti-static/obfuscation/imports/concealment::fragment-loader-export-backscan

  - id: fragment-loader-executable-buffer
    desc: Concealed fragment loader enables executable buffer
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::fragment-loader-export-backscan
      - id: micro-behaviors/mem/protect/modify::x86-gui-buffer-rwx-protect-call
