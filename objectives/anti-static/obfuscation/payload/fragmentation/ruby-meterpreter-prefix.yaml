defaults:
  for: [ruby]
  platforms: [windows]
traits:
  - id: ruby-meterpreter-randomized-stage-prefix
    desc: Prefixes Meterpreter stage with random bytes
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule ruby_meterpreter_randomized_stage_prefix {
          strings:
            $module = "Payload::Windows::MeterpreterLoader"
            $load = "load_rdi_dll(MetasploitPayloads.meterpreter_path('metsrv', 'x86.dll'))"
            $patch = "dll[ 0, bootstrap.length ] = bootstrap"
            $random = "SecureRandom.random_bytes(65536)"
            $return = "randomData + dll"
          condition:
            all of them and @random < @return
        }
