defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-scattered-xor-stub-reconstruction
    desc: x86 scatter-stream XOR stub reconstruction
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    if:
      type: hex
      section: text
      # Select a stream by a byte-table entry, advance its pointer, read its
      # preceding byte and XOR it into the destination. Addresses vary.
      pattern: '0F B6 ?? [4] FF 04 ?? [4] 41 8D ?? [5] (41|90) 4A 75 ?? 49 8B 15 [4] 89 0D [4] 03 C2 0F B6 89 [4] FF 0C 8D [4] 8D 0C 8D [4] 8B 09 8A 09 30 08'
