defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  crit: suspicious
  conf: 0.98
composite_rules:
- id: js-base64-carrier-name-population
  desc: Base64 carrier and Base64-like identifier names
  unless:
  - id: well-known/tool/development/cli/socket-cli::socket-dev-cli-bundle
  - id: well-known/tool/development/cli/socket-cli::socket-dev-cli-vendored-path
  - id: objectives/anti-static/obfuscation/payload/data-file::javascript-module-is-base64-only
  all:
  - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
  - id: metadata/lang/source/naming/population::js-base64-like-name-count
- id: js-base64-carrier-opaque-identifiers
  desc: Base64 carrier and opaque identifier clues
  unless:
  - id: objectives/anti-static/obfuscation/payload/data-file::javascript-module-is-base64-only
  - id: metadata/path/directory::test-directory-component
  all:
  - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
  - id: metadata/lang/source/naming/population::high-entropy-identifier-ratio
