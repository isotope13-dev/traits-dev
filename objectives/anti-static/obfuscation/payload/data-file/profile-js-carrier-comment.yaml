defaults: {}
composite_rules:
  - platforms:
      - windows
      - unix
    for:
      - javascript
    id: js-base64-carrier-comment-clues
    desc: Base64 carrier and Base64-like comment clues
    crit: suspicious
    conf: 0.97
    unless:
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-module-is-base64-only
      - id: metadata/path/directory::test-directory-component
    all:
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
      - id: metadata/lang/source/comment::base64-like-comment-content
