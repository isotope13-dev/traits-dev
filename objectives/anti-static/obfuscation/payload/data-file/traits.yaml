# Encoded and staged payload evidence found inside opaque data files.
# Neutral file-shape measurements live under metadata/file/metrics/opaque.yaml;
# objective rules here require payload-specific evidence.
defaults:
  for: [data]
  attack: T1027
  mbc: F0001
traits:

  # === SUSPICIOUS: XOR-decoded PE loader APIs (Windows-only) ===
- id: xor-decoded-sync-api
  desc: XOR-decoded sync-primitive in data file
  crit: suspicious
  conf: 0.85
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: 'InitializeCriticalSection'

  # === SUSPICIOUS: XOR-decoded PE DOS stub text (unambiguous PE header) ===
- id: xor-decoded-pe-dos-stub
  desc: XOR-decoded PE DOS stub string
  crit: suspicious
  conf: 0.95
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: "This program cannot be run in DOS mode"
- id: powershell-large-base64-convert
  desc: Large Base64 Convert payload in data
  crit: suspicious
  conf: 0.92
  platforms: [windows]
  if:
    type: text
    regex: '(?i)FromBase64String.{0,40}[''"][A-Za-z0-9+/]{2000,}'
- id: standalone-base64-alphabet-data
  desc: Base64-compatible character-only data file
  crit: component
  conf: 0.88
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    regex: '^[A-Za-z0-9+/]{1024,}={0,2}$'
  unless:
  - id: micro-behaviors/data/encode/hex::standalone-hex-data-file
  - id: metadata/file/padding::long-single-uppercase-run
- id: large-base64ish-data-blob
  desc: Large Base64-like data blob
  crit: component
  conf: 0.84
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    regex: '[A-Za-z0-9+/]{1024,}'
  unless:
  - id: micro-behaviors/data/encode/hex::standalone-hex-data-file
  - id: metadata/file/padding::long-single-uppercase-run
- id: javascript-standalone-base64-carrier
  desc: JavaScript is a large standalone Base64 carrier
  crit: suspicious
  conf: 0.96
  for: [javascript, typescript]
  platforms: [unix, windows]
  size_min: 100000
  # Heuristic XOR decoding of ordinary numeric arrays can produce long
  # lowercase-only noise. Reject that decoder artifact; real large Base64
  # payloads use a mixed alphabet with overwhelming probability.
  # The length floor matters: `^[A-Za-z0-9+/]+$` is line-anchored, so without
  # it any single alphanumeric token on its own line (routine in minified
  # bundles, generated code, and .d.ts type definitions) armed the four hostile
  # carrier composites below. A real whole-file carrier is one huge blob.
  if:
    type: text
    regex: '^[A-Za-z0-9+/]{2048,}={0,2}$'
  not:
    - regex: '^[a-z]+$'
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/build/
    - id: metadata/package/documentation/page::static-html-shell
    # AES-GCM ciphertext stages (mathmain/mathsbase) are whole-file Base64 blobs
    # with zero calls — not eval-in-base64 carriers. The stage-file composite
    # covers them; do not also label them standalone carriers.
    - id: javascript-module-is-base64-only

- id: javascript-module-is-base64-only
  desc: JavaScript module is Base64 data only
  crit: suspicious
  conf: 0.97
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1027.013
  mbc: B0032
  # The size floor on `javascript-standalone-base64-carrier` above exists to
  # keep one long alphanumeric line in a minified bundle from arming the
  # hostile carrier composites. A whole-file carrier needs no such floor when
  # the *absence of code* is checked directly: `ast.call_count` is zero only
  # when the parser found no call anywhere in the file. Minified bundles,
  # generated clients and .d.ts files all call something; a `.js` module that
  # calls nothing and consists of one Base64 run is not JavaScript at all, it
  # is a ciphertext blob wearing a module's extension.
  #
  # Caught graph.js (28 KB) and fraction.js (12 KB) in the math-universe npm
  # loader, both of which sat under the 100 KB floor and scored notable.
  if:
    type: text
    regex: '^[A-Za-z0-9+/]{1024,}={0,2}$'
    is: base64
  unless:
    # Any call at all means the file contains real JavaScript.
    - type: metrics
      field: ast.call_count
      min: 1
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/build/
    - id: metadata/package/testing/

- id: encoded-powershell-delegate
  desc: Encoded PowerShell delegate scaffold
  crit: suspicious
  conf: 0.97
  for: [javascript, typescript]
  platforms: [unix, windows]
  if:
    type: encoded
    encoding: base64
    regex: '(?is)function\s+[A-Za-z_]\w*\s*\(\s*\[Parameter\b.{0,240}\[Type\]'

- id: large-base64-alpha-data-blob
  desc: Large Base64 blob with non-hex alphabet
  crit: component
  conf: 0.86
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    regex: '[G-Zg-z+/][A-Za-z0-9+/]{1023,}'
  unless:
  - id: micro-behaviors/data/encode/hex::standalone-hex-data-file
  - id: metadata/file/padding::long-single-uppercase-run
- id: single-line-encoded-data-blob
  desc: Single-line encoded data blob
  crit: suspicious
  conf: 0.84
  platforms: [windows, linux, macos]
  size_min: 1024
  unless:
  - type: basename
    regex: '(?i)\.json$'
  if:
    type: metrics
    field: text.max_line_length
    min: 1024
- id: data-file-js-decoder-runtime
  desc: JavaScript decoder runtime in data
  crit: notable
  conf: 0.88
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    substr: "decodeURIComponent"
- id: data-file-js-obfuscator-function
  desc: JavaScript obfuscator function in data
  crit: notable
  conf: 0.88
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    substr: "function c(b,d)"
- id: jscript-encode-magic-data
  desc: JScript.Encode magic in data
  crit: suspicious
  conf: 0.96
  platforms: [windows]
  if:
    type: hex
    pattern: "23 40 7e 5e"
    offset: 0
  unless:
    - id: metadata/package/testing/presence/harness::test-directory-path
- id: jscript-encode-block-delimiters
  desc: JScript.Encode block delimiters
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  count_min: 3
  if:
    type: raw
    substr: "@#@&"
- id: jscript-encode-end-marker
  desc: JScript.Encode end marker
  # Footer only corroborates the start magic; alone it is not intent, and
  # scoring it separately double-counts every encoded blob.
  crit: component
  conf: 0.92
  platforms: [windows]
  if:
    type: raw
    substr: "^#~@"
    # This is the encoded block terminator, not a free-standing four-byte
    # signature. Requiring it near EOF avoids chance hits in binary tables.
    offset_range: [-64, null]
  unless:
    - id: metadata/package/testing/presence/harness::test-directory-path
- id: data-file-stdio-option
  desc: stdio process option in data payload
  crit: component
  conf: 0.86
  platforms: [windows, linux, macos]
  size_min: 4096
  if:
    type: text
    substr: stdio
- id: json-content-o-field
  desc: JSON content_o payload field
  crit: notable
  conf: 0.9
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    exists: true
- id: data-file-telegram-bot-api
  desc: Telegram bot API URL in data payload
  crit: notable
  conf: 0.92
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: api.telegram.org/bot
- id: data-file-telegram-sendmessage
  desc: Telegram sendMessage endpoint in data payload
  crit: notable
  conf: 0.92
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: /sendMessage
- id: data-file-telegram-bot-token
  desc: Campaign Telegram bot token in data payload
  crit: suspicious
  conf: 0.96
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: "8201485511:AAF_"
- id: data-file-ipinfo-token-url
  desc: ipinfo.io token URL in data payload
  crit: notable
  conf: 0.92
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: ipinfo.io/json?token=
- id: data-file-visitor-info-exfil-text
  desc: 'data file visitor info exfil text'
  crit: notable
  conf: 0.9
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: Visitor\x20Info
- id: data-file-node-windows-hide
  desc: Hidden child process option in data payload
  crit: notable
  conf: 0.9
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: windowsHide
- id: data-file-write-flag-wplus
  desc: Write/create file flag in data payload
  crit: notable
  conf: 0.86
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: "'flag':'w+'"
- id: data-file-child-process-term
  desc: child_process reference in data payload
  crit: notable
  conf: 0.88
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    substr: child_process
- id: data-file-analysis-hostnames
  desc: Analysis-gated hostnames in data payload
  crit: suspicious
  conf: 0.94
  platforms: [windows, linux, macos]
  if:
    type: value
    path: content_o
    regex: "Home PC|vboxuser|Programador"

- id: xor-decoded-loader-api--loadlibrary
  desc: XOR-decoded loader API in data (LoadLibrary)
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: 'LoadLibrary'

  # === SUSPICIOUS: XOR-decoded PE thread/mem APIs ===
- id: xor-decoded-loader-api--getprocaddress
  desc: XOR-decoded loader API in data (GetProcAddress)
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: 'GetProcAddress'

  # === SUSPICIOUS: XOR-decoded PE thread/mem APIs ===
- id: xor-decoded-loader-api--virtualalloc
  desc: XOR-decoded loader API in data (VirtualAlloc)
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: 'VirtualAlloc'

  # === SUSPICIOUS: XOR-decoded PE thread/mem APIs ===
- id: xor-decoded-exec-api--createthread
  desc: XOR-decoded execution API in data (CreateThread)
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: 'CreateThread'

  # === SUSPICIOUS: XOR-decoded sync primitive (PE runtime init) ===
- id: xor-decoded-exec-api--virtualprotect
  desc: XOR-decoded execution API in (VirtualProtect)
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: 'VirtualProtect'

  # === SUSPICIOUS: XOR-decoded sync primitive (PE runtime init) ===
- id: xor-decoded-exec-api--rtlmovememory
  desc: XOR-decoded execution API in (RtlMoveMemory)
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  if:
    type: encoded
    encoding: xor
    substr: 'RtlMoveMemory'

  # === SUSPICIOUS: XOR-decoded sync primitive (PE runtime init) ===
composite_rules:
- id: xor-decoded-loader-api
  desc: XOR-decoded loader API in data file
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  any:
  - id: xor-decoded-loader-api--loadlibrary
  - id: xor-decoded-loader-api--getprocaddress
  - id: xor-decoded-loader-api--virtualalloc
- id: xor-decoded-exec-api
  desc: XOR-decoded execution API in data file
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  any:
  - id: xor-decoded-exec-api--createthread
  - id: xor-decoded-exec-api--virtualprotect
  - id: xor-decoded-exec-api--rtlmovememory
- id: js-obfuscator-runtime-data-file
  desc: JavaScript obfuscator runtime in data file
  crit: suspicious
  conf: 0.93
  platforms: [windows, linux, macos]
  all:
  - id: metadata/lang/javascript-features::js-obfuscator-while-loop
  - id: data-file-js-decoder-runtime
  - id: data-file-js-obfuscator-function
- id: base64-payload-evidence
  desc: Standalone Base64 payload shape
  crit: notable
  conf: 0.92
  platforms: [windows, linux, macos]
  all:
  - id: standalone-base64-alphabet-data
  - id: large-base64ish-data-blob
  - id: large-base64-alpha-data-blob
  - id: metadata/binary/layout/entropy::byte-entropy-above-two
- id: standalone-base64-payload-data-file
  desc: Standalone Base64 payload data file
  crit: suspicious
  conf: 0.92
  platforms: [windows, linux, macos]
  # A real encoded payload is high-entropy; a degenerate single-character fill
  # (e.g. a raw-disk-image test fixture of 3 MB of 'A's, entropy ~0) satisfies
  # the base64 charset regex but carries no payload. Require real variety.
  all:
  - id: base64-payload-evidence
  unless:
  - id: base64-test-fixture-context
  - id: metadata/file/padding::repeated-uppercase-padding-runs
  # Unity documents StreamingAssets as the place for files the engine reads
  # verbatim, so encoded blobs there are app assets, not dropped payloads.
  - id: metadata/build/framework::unity-streaming-asset
  # Quantized ONNX weights are binary protobuf. Long runs of the base64
  # alphabet in the tensor bytes are the model, not a dropped payload.
  - id: metadata/file/format/serialization::onnx-model-path
  downgrade:
    any:
    - id: metadata/package/testing/presence/corpus::adversarial-fixture-corpus-member
- id: base64-test-fixture-context
  desc: Recognized Base64 test or standard-data fixture context
  crit: exception
  conf: 0.95
  platforms: [windows, linux, macos]
  all:
  - id: metadata/file/encoded::base64-compatible-data-context
  - id: base64-payload-evidence
- id: jscript-encoded-data-block
  desc: JScript.Encode data block
  crit: suspicious
  conf: 0.96
  platforms: [windows]
  all:
  - id: jscript-encode-magic-data
  - id: jscript-encode-block-delimiters
  - id: jscript-encode-end-marker
- id: obfuscated-data-hidden-node-dropper
  desc: Obfuscated data payload launches hidden Node child stages
  crit: hostile
  conf: 0.97
  platforms: [windows, linux, macos]
  attack: T1059.007,T1027,T1105
  size_min: 50000
  all:
  - id: js-obfuscator-runtime-data-file
  - id: data-file-node-windows-hide
  - id: data-file-stdio-option
- id: obfuscated-data-repeating-hidden-stage
  desc: Obfuscated data payload repeats hidden Node staging
  crit: hostile
  conf: 0.98
  platforms: [windows, linux, macos]
  attack: T1105,T1059.007,T1027
  size_min: 50000
  all:
  - id: js-obfuscator-runtime-data-file
  - id: data-file-node-windows-hide
  - id: objectives/command-and-control/dropper/delivery/fetch-eval::json-cookie-stage-repeat-or-detach
  - id: data-file-stdio-option
- id: single-line-obfuscated-node-stage-data
  desc: Single-line obfuscated data payload contains Node stage runtime
  crit: hostile
  conf: 0.97
  platforms: [windows, linux, macos]
  attack: T1027,T1059.007
  size_min: 50000
  all:
  - id: single-line-encoded-data-blob
  - id: data-file-js-decoder-runtime
  - id: data-file-js-obfuscator-function
  - id: data-file-stdio-option
- id: json-obfuscated-telegram-exfil-payload
  desc: Obfuscated JSON payload exfiltrates via Telegram
  crit: hostile
  conf: 0.995
  platforms: [windows, linux, macos]
  attack: T1567,T1027
  all:
  - id: js-obfuscator-runtime-data-file
  - id: json-content-o-field
  - id: data-file-telegram-bot-api
  - id: data-file-telegram-sendmessage
  any:
  - id: data-file-telegram-bot-token
  - id: data-file-ipinfo-token-url
  - id: data-file-visitor-info-exfil-text
- id: json-obfuscated-ipinfo-telegram-payload
  desc: Obfuscated JSON payload profiles visitors and sends Telegram message
  crit: hostile
  conf: 0.99
  platforms: [windows, linux, macos]
  attack: T1016,T1567,T1027
  all:
  - id: js-obfuscator-runtime-data-file
  - id: data-file-ipinfo-token-url
  - id: data-file-telegram-bot-token
  any:
  - id: data-file-visitor-info-exfil-text
  - id: data-file-telegram-sendmessage
- id: json-obfuscated-analysis-gated-payload
  desc: Obfuscated JSON payload includes analysis-hostname gating
  crit: hostile
  conf: 0.98
  platforms: [windows, linux, macos]
  attack: T1497.001,T1027
  all:
  - id: js-obfuscator-runtime-data-file
  - id: json-content-o-field
  - id: data-file-analysis-hostnames
  any:
  - id: data-file-node-windows-hide
  - id: data-file-child-process-term
- id: json-obfuscated-hidden-write-exec-payload
  desc: Obfuscated JSON payload writes a stage and launches hidden process
  crit: hostile
  conf: 0.98
  platforms: [windows, linux, macos]
  attack: T1105,T1059.007,T1027
  all:
  - id: js-obfuscator-runtime-data-file
  - id: json-content-o-field
  - id: data-file-node-windows-hide
  - id: data-file-write-flag-wplus

  # Helper: any XOR'd Windows API name reveals PE-shape content under the mask.
- id: xor-decoded-winapi-name
  desc: XOR-decoded Windows API name in data
  crit: component
  conf: 0.9
  platforms: [windows]
  any:
  - id: xor-decoded-loader-api
  - id: xor-decoded-exec-api
  - id: xor-decoded-sync-api

  # === HOSTILE: DOS stub + at least one API-name XOR decode ===
  # One PE clue via XOR can be a coincidence; DOS stub + any API name is the
  # PlugX-style packed payload shape.
- id: xor-encoded-pe-payload-data
  desc: Data file contains XOR-encoded PE payload
  crit: hostile
  conf: 0.95
  platforms: [windows]
  attack: T1027.013
  all:
  - id: xor-decoded-pe-dos-stub
  - id: xor-decoded-winapi-name

  # === HOSTILE: DOS stub + very-high entropy body (packed/crypted PE) ===
- id: xor-encoded-pe-payload-entropy
  desc: XOR-encoded PE with packed crypted body
  crit: hostile
  conf: 0.92
  platforms: [windows]
  attack: T1027.013
  all:
  - id: xor-decoded-pe-dos-stub
  - id: metadata/file/data-blob::very-high-entropy-data-file
