# The image marker replaces MZ, the NT signature is erased, and its pointer
# moves from the DOS header to offset eight. This is not a PNG/PE polyglot.
defaults:
  platforms: [windows]
  for: [png, data]
  crit: suspicious
  conf: 0.99
  attack: T1027.009

traits:
  - id: png-magic-shifted-pe32-header
    desc: PNG magic masks a shifted PE32 header
    if:
      type: yara
      source: |
        rule png_magic_shifted_pe32_header {
          strings:
            $png = { 89 50 4E 47 0D 0A 1A 0A }
          condition:
            filesize > 512 and
            $png at 0 and
            uint32(8) >= 64 and uint32(8) <= 512 and
            uint32(8) + 288 < filesize and
            uint32(uint32(8)) == 0 and
            uint16(uint32(8) + 4) == 0x14c and
            uint16(uint32(8) + 6) >= 1 and
            uint16(uint32(8) + 6) <= 16 and
            uint16(uint32(8) + 20) == 0xe0 and
            uint16(uint32(8) + 24) == 0x10b and
            uint32(uint32(8) + 56) == 0x1000 and
            uint32(uint32(8) + 248) == 0x7865742e
        }
