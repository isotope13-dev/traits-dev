defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: malformed-il-only-importless-pe-loader
    desc: Malformed IL-only PE with importless loader layout
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/header::pe-il-only-without-clr-metadata
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/binary/section/reloc::pe-relocation-table-overhang
      - id: metadata/binary/code/complexity::sparse-functions
