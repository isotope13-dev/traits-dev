defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: malformed-il-only-importless-pe-loader
    desc: Malformed IL-only PE with importless loader layout
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/anomaly/section-header::pe-il-only-without-clr-metadata
      - id: metadata/binary/metrics/structural::no-imports
      - id: metadata/binary/layout::pe-checksum-zeroed
      - id: metadata/binary/metrics/structural::pe-relocation-table-overhang
      - id: metadata/binary/metrics/structural::sparse-functions
