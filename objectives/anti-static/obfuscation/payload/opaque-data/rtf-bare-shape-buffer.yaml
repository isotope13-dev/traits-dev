# The whole file is one drawing-shape property holding a long hex list: no
# font table, no text, no paragraph -- a buffer wearing an RTF header.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1027

composite_rules:
  - id: rtf-only-shape-buffer
    desc: RTF is only an oversized shape buffer
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/structure::rtf-few-control-words
    any:
      - id: objectives/execution/exploit/document::rtf-shape-value-long-numeric-list
      - id: objectives/execution/exploit/document::rtf-shape-value-invalid-size-buffer
