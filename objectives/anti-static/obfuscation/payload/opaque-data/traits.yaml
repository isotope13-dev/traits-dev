# Shellcode carriers require a decoder stub as well as entropy evidence.
# Extensionless specimens cleave types as Unknown and skip YAML rules;
# delivery as .bin/.dat/.exe (and cleave-routed .a3x/.a3e script containers) is
# the scannable surface for the same bytes.
defaults:
  platforms: [windows, linux, macos]
  for: [data]
  attack: T1027.002,T1055
  mbc: B0030

composite_rules:
  - id: opaque-data-x64-feedback-xor-shellcode
    desc: Opaque data x64 feedback-XOR shellcode carrier
    crit: hostile
    conf: 0.97
    size_min: 65536
    size_max: 524288
    all:
      - id: metadata/file/entropy::data-file-near-maximum-entropy
      - id: metadata/file/data-blob::opaque-data-x64-cld-call-stub
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-feedback-xor-decoder-edi
