# Hostile composites for opaque data carriers that stage shellcode or crypter
# blobs. Extensionless specimens cleave types as Unknown and skip YAML rules;
# delivery as .bin/.dat/.exe (and cleave-routed .a3x/.a3e script containers) is
# the scannable surface for the same bytes.
defaults:
  platforms: [windows, linux, macos]
  for: [data]
  attack: T1027.002,T1055
  mbc: B0030

composite_rules:
  # Every leg is an entropy measurement of the same bytes: this cannot tell a
  # crypter blob from any other encrypted or compressed asset (a Minecraft
  # Bedrock `RTXStub.material.bin` shader pack matched it as hostile). An
  # opaque cipher-grade blob is worth flagging, but conviction needs a
  # content leg -- a decoder stub, as in the sibling rules below.
  - id: opaque-data-encrypted-crypter-blob
    desc: Opaque data with cipher-grade entropy profile
    crit: suspicious
    conf: 0.96
    size_min: 65536
    size_max: 524288
    all:
      - id: metadata/file/data-blob::opaque-data-near-maximum-entropy
      - id: metadata/file/data-blob::opaque-data-high-peak-entropy
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k
      - id: "metadata/file/entropy::very-high-entropy-data-file"
    unless:
      - id: well-known/tool/development/toolchain/go-toolchain/
      # A blob that opens with a zlib stream header is a decodable
      # standard-library compressed asset (map textures, canvases, model
      # data), not opaque cipher output; the entropy profile cannot tell
      # them apart, this framing can.
      - id: metadata/file/magic/numbers::zlib-stream-header

  - id: opaque-data-x64-feedback-xor-shellcode
    desc: Opaque data x64 feedback-XOR shellcode carrier
    crit: hostile
    conf: 0.97
    size_min: 65536
    size_max: 524288
    all:
      - id: metadata/file/data-blob::opaque-data-near-maximum-entropy
      - id: metadata/file/data-blob::opaque-data-x64-cld-call-stub
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-feedback-xor-decoder-edi
