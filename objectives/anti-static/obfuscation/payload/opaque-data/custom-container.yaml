# The ENC tag does not identify a cipher or prove executable contents. The
# combination establishes a private, opaque container worth analyst review.
defaults:
  platforms: [unix, windows]
  for: [data]
  attack: T1027.013

composite_rules:
  - id: large-private-enc-container
    desc: Large opaque data in a private ENC container
    crit: suspicious
    conf: 0.95
    size_min: 1048576
    all:
      - id: metadata/file/magic/identity::high-entropy-enc-container
      - id: metadata/file/data-blob::near-maximum-entropy-file
