defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-urllib-exec-with-concealed-code
    desc: urllib eval co-occurs with Base64 code execution
    crit: suspicious
    conf: 0.97
    attack: T1059.006,T1027
    all:
      - id: micro-behaviors/process/deploy::python-urllib-response-exec
      - id: objectives/anti-static/obfuscation/payload/encoded/exec::direct-base64-exec

  - id: remote-exec-text
    desc: HTTP eval co-occurs with Base64 code execution
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.006
    mbc: B0032
    any:
    - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::exec-get-text
    - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::exec-get-content
    - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::eval-get-text
    - id: micro-behaviors/process/deploy::python-urllib-response-exec
    all:
    - id: objectives/anti-static/obfuscation/payload/encoded/exec::direct-base64-exec
    - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    - id: micro-behaviors/communications/http/request/client::request-python
    unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/tool/detection/agentskillmap/
    - id: well-known/lib/development/setuptools-bootstrap::ez-setup-bootstrap-url
