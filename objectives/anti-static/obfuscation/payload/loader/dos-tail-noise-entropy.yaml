defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 1024
  size_max: 65536
  attack: T1027

traits:
  - id: dos-near-jump-tail-arithmetic-loop
    desc: DOS near jump reaches tail arithmetic loop
    crit: notable
    if:
      type: yara
      source: |
        rule dos_near_jump_tail_arithmetic_loop {
          strings:
            $loop = { 45 81 C5 01 00 4B D1 C1 F9 F5 87 F0 [0-20] 7D ?? }
          condition:
            uint8(0) == 0xE9 and uint16(1) + 3 < filesize and
            uint16(1) + 259 > filesize and
            $loop in (uint16(1) + 3 .. filesize)
        }
  - id: dos-data-peak-high-entropy
    desc: Data contains high-entropy region
    crit: notable
    if:
      type: metrics
      field: binary.peak_region_entropy
      min: 7.5

composite_rules:
  - id: dos-tail-noise-loop-dense-body
    desc: DOS tail noise loop accompanies dense body
    crit: hostile
    conf: 0.96
    all:
      - id: dos-near-jump-tail-arithmetic-loop
      - id: dos-data-peak-high-entropy
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
