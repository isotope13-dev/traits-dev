defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  attack: T1027,T1059.007

composite_rules:
  # Long lines, hex parsing, POST, or Base64 alone are ordinary minified
  # clients. Require decoded file staging AND a computed executable module.
  # The decoder may be on a preceding line, as it is in the Zod sample.
  - id: compact-hex-post-base64-module-loader
    desc: Compact hex/POST/Base64 executable loader
    conf: 0.98
    near_bytes: 2048
    all:
      - id: metadata/file/line::single-long-line
      - id: micro-behaviors/data/decode/hex::js-hex-number-parse
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/fs/temp/directory::node-mkdtemp-os-tmpdir
      - id: micro-behaviors/fs/write/file/full::node-write-base64-decoded-data
      - id: micro-behaviors/process/create/load/script::dynamic-base64-data-module-import

  # This alternate profile does not need parseInt or POST, so replacing
  # the ABI decoder or transport options cannot quiet both patterns.
  - id: compact-contract-payload-module-loader
    desc: Compact contract/Base64 payload module loader
    conf: 0.98
    near_bytes: 2048
    all:
      - id: metadata/file/line::single-long-line
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/data/property/access::base64-payload-member-read
      - id: micro-behaviors/communications/http/url/build::js-fetch-derived-url-authority
      - id: micro-behaviors/fs/temp/directory::node-mkdtemp-os-tmpdir
      - id: micro-behaviors/fs/write/file/full::node-write-base64-decoded-data
      - id: micro-behaviors/process/create/load/script::dynamic-base64-data-module-import
