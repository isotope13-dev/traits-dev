# An AutoHotkey script acting as a native-code loader. The API names it
# dispatches never appear in the file: each one is rebuilt from a
# comma-delimited decimal code list through a decode helper and wrapped in a
# Func() object, and the dispatched target is a raw file read byte-for-byte
# into a VarSetCapacity buffer. Macro packs and licence checks read binary
# files too, so the staging atom stays notable; the composites require the
# encoded name construction that conceals which native calls are made.
defaults:
  platforms: [windows]
  for: [pe, text]
  attack: T1027,T1140

traits:
  - id: autohotkey-func-charcode-dispatch
    desc: Function object built from char-code list
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Func\s*\(\s*\w+\s*\(\s*"[0-9]{1,3}(,[0-9]{1,3}){4,}"\s*\)\s*\)'

composite_rules:
  - id: ahk-encoded-dispatch-stages-raw-file
    desc: Encoded dispatch executes over staged raw file
    crit: hostile
    conf: 0.95
    near_lines: 40
    all:
      - id: autohotkey-func-charcode-dispatch
      - id: micro-behaviors/fs/read/file/full::ahk-rawread-into-buffer
