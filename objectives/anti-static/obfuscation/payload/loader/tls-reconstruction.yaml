defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  # The old loader rules mistook CRT header checks, an EDX immediate, a
  # debugger import, and an icon for evidence of a gated manual mapper.
  # Require actual header reconstruction and concealed control flow. The
  # static matcher does not establish a remote process or the payload's role.
  - id: tls-flattened-pe-header-reconstruction
    desc: PE signature reconstruction with TLS flattening and large string
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: micro-behaviors/data/embedded/payload/header::indexed-pe-signature-word-write-x64
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
      - id: metadata/file/profile/string-population::native-string-over-256-kib
