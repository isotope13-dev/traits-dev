defaults:
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: python-proxy-node-stage-strings
    desc: Python-named DLL references disguised Node stage
    for: [pe]
    if:
      type: yara
      source: |
        rule python_proxy_node_stage_strings {
          strings:
            $python = "Py_Main" ascii
            $node = "\\resources\\node.exe" wide
            $script = ".\\CHANGELOG.md" wide
            $addon = ".\\default.node" wide
            $launch = "CreateProcessW" ascii
          condition:
            all of them
        }
  - id: disguised-asar-bytecode-stage-strings
    desc: Obfuscated script names ASAR and bytecode loader
    for: [javascript]
    if:
      type: yara
      source: |
        rule disguised_asar_bytecode_stage_strings {
          strings:
            $asar = "./app.asar" ascii
            $extract = "extractAll" ascii
            $bytecode = "app.jsc" ascii
            $runtime = "bytenode" ascii
          condition:
            all of them
        }
  - id: changelog-script-path
    desc: Script uses changelog filename
    for: [javascript]
    if:
      type: basename
      exact: changelog.md
      case_insensitive: true
composite_rules:
  - id: disguised-obfuscated-bytecode-script
    desc: Obfuscated bytecode loader uses changelog filename
    for: [javascript]
    all:
      - id: disguised-asar-bytecode-stage-strings
      - id: changelog-script-path
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
  # This identifies a deliberately concealed loading chain. It does not claim
  # that the encrypted native addon or compiled JavaScript has been decoded.
  - id: disguised-python-node-bytecode-chain
    desc: Disguised Python DLL and obfuscated bytecode stage
    crit: hostile
    for: [zip, 7z, pe, javascript]
    scope: archive
    attack: T1027,T1036,T1059.007
    all:
      - id: python-proxy-node-stage-strings
      - id: disguised-obfuscated-bytecode-script
      - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-loader-data-geometry
