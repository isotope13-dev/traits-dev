defaults:
  for: [javascript, typescript]
  platforms: [windows, unix]
composite_rules:
  - id: embedded-batch-self-command-loop
    desc: Embedded batch reads and executes its lines
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/script::embedded-batch-script-header
      - id: micro-behaviors/fs/read/self::embedded-batch-self-read
      - id: micro-behaviors/process/create/shell/command-string::batch-loop-variable-command
