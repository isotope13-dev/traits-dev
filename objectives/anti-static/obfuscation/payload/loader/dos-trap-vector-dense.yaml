defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1027,T1562.001

traits:
  - id: dos-trap-flag-vector-bootstrap
    desc: DOS bootstrap sets trap flag and vector
    crit: notable
    if:
      type: yara
      source: |
        rule dos_trap_flag_vector_bootstrap {
          strings:
            $bootstrap = { 9C FA E8 00 00 5F 89 E5 [0-12] 80 4E 01 03 [0-18] 8F 45 04 8F 45 06 9D E3 FE }
          condition:
            $bootstrap
        }

composite_rules:
  - id: dos-dense-trap-loader-disables-antivirus
    desc: DOS dense trap loader disables antivirus
    crit: hostile
    conf: 0.97
    all:
      - id: dos-trap-flag-vector-bootstrap
      - id: metadata/binary/layout/entropy::com-dense-region-7bit
      - id: objectives/impact/degrade/edr/teardown::dos-vsafe-uninstall-request
