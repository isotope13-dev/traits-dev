# Native obfuscated stages that transform data in a private memory buffer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: native-threadpool-memory-stage
    desc: Native PE RW buffer worker stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64-register-order
      - id: micro-behaviors/mem/protect/modify::virtual-free
      - id: micro-behaviors/process/threading/create::threadpool-work-lifecycle
      - id: micro-behaviors/data/control-flow/dispatch::stack-indirect-call-x64
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: metadata/binary/metrics/structural::pe-near-total-code-data
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  # AES-CBC alone is a neutral crypto capability.  The combination below is
  # the loader shape observed in native DLL proxies: transform protected data, map a native
  # section, change page permissions, and start execution from the staged code.
  - id: encrypted-native-section-stage
    desc: AES-CBC native section execution stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-aes-cbc
      - id: micro-behaviors/mem/create/shared::nt-create-section-api-string
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/os/syscall/raw::nt-protect-ssn
      - id: micro-behaviors/mem/protect/modify::rw-to-rx-protection-with-thread-start
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/
