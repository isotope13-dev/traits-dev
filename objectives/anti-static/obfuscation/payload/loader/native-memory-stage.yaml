defaults:
  crit: hostile
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1027,T1140
  mbc: B0032
composite_rules:
- id: unsigned-x86-inline-xor-debugger-stage
  desc: x86 XOR stage executes beside debugger checks
  crit: suspicious
  conf: 0.96
  attack: T1027.002,T1027.007
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/data/decode/xor::x86-callpop-inline-xor-return
  - id: micro-behaviors/process/info/query::peb-access-x86
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/create/thread::create-thread
- id: native-threadpool-memory-stage
  desc: Native PE RW buffer worker stage
  all:
  - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64-register-order
  - id: micro-behaviors/mem/free::virtual-free
  - id: micro-behaviors/process/threading/create::threadpool-work-lifecycle
  - id: micro-behaviors/data/control-flow/dispatch::stack-indirect-call-x64
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: metadata/binary/section/ratio::pe-near-total-code-data
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
- id: encrypted-native-section-stage
  desc: AES-CBC native section execution stage
  attack: T1027,T1140,T1620
  all:
  - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
  - id: micro-behaviors/mem/create/shared::nt-create-section-api-string
  - id: micro-behaviors/mem/map::nt-map-view-section-api-string
  - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
  - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
  - id: micro-behaviors/mem/protect/modify::integer-loads-protection-thread-apis
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib
  - id: well-known/tool/reverse-engineering/
- id: x86-tea-payload-memory-stage
  desc: x86 TEA payload decrypted and executed in memory
  attack: T1027,T1140,T1620
  all:
  - id: micro-behaviors/crypto/symmetric/xxtea::x86-tea-decrypt-round
  - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
  - id: metadata/binary/section/entropy::small-high-entropy-data-section
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
