# Native obfuscated stages that transform data in a private memory buffer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: native-threadpool-memory-stage
    desc: Native PE RW buffer worker stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-readwrite-commit-resolved-x64-register-order
      - id: micro-behaviors/mem/protect/modify::virtual-free
      - id: micro-behaviors/process/threading/create::threadpool-work-lifecycle
      - id: micro-behaviors/data/control-flow/dispatch::stack-indirect-call-x64
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: metadata/binary/metrics/structural::pe-near-total-code-data
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
