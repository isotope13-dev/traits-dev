defaults:
  platforms: [windows, macos, linux]
  for: [javascript]
  crit: notable
  conf: 0.95
traits:
  - id: large-marked-base64-module
    desc: Large source file starts with encoded marker
    size_min: 100000
    if:
      type: text
      regex: '^__[A-Z]{2,12}__[A-Za-z0-9+/]{64}'
composite_rules:
  - id: node-hidden-xor-dynamic-source-loader
    desc: Hidden window and XOR dynamic source loader
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/string/access::js-uppercase-marker-prefix-check
      - id: micro-behaviors/data/string/access::js-uppercase-marker-suffix-check
      - id: micro-behaviors/data/decode/xor/repeating-key::js-buffer-repeating-key-xor-decode
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
      - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
      - id: micro-behaviors/ui/window/electron::electron-one-pixel-window
      - id: micro-behaviors/time/schedule/timeout::setTimeout
  # The marked module is an adjacent archive member. This combination detects
  # concealed loading; it does not claim the encoded payload's content.
  - id: archive-hidden-xor-source-stage
    desc: Hidden Electron window loads encoded source stage
    crit: hostile
    conf: 0.97
    for: [javascript, asar, zip, 7z, pe]
    scope: archive
    attack: T1027,T1140,T1059.007
    all:
      - id: node-hidden-xor-dynamic-source-loader
      - id: large-marked-base64-module
      - id: metadata/lang/source/naming/population::many-high-entropy-identifiers
