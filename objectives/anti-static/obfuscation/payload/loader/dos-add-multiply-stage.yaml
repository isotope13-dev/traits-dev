defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  attack: T1027,T1574

traits:
  - id: dos-entry-add-multiply-decoder
    desc: DOS entry decodes body with evolving key
    crit: notable
    if:
      type: yara
      source: |
        rule dos_entry_add_multiply_decoder {
          strings:
            $loop = { 2E 00 04 2E F6 AD ?? ?? 46 E2 ?? }
          condition:
            uint8(0) == 0xE9 and uint16(1) + 3 < filesize and
            $loop in (uint16(1) + 3 .. uint16(1) + 100)
        }

composite_rules:
  - id: dos-entry-add-multiply-hidden-stage
    desc: DOS jump enters evolving-key decoder
    crit: hostile
    conf: 0.97
    all:
      - id: dos-entry-add-multiply-decoder
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
