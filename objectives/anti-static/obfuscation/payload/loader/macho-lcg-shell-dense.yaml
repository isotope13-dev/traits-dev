defaults:
  platforms: [macos]
  for: [macho]
  attack: T1027

composite_rules:
  - id: unsigned-sparse-lcg-shell-dense-data
    desc: Unsigned sparse Mach-O with LCG, dense data, and shell API
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: metadata/binary/code/ratio::low-code-to-data-ratio
      - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: micro-behaviors/process/create/subprocess/reference::unsigned-generic-shell-exec
      - id: micro-behaviors/process/create/shell/reference::system-with-math-imports
      - id: micro-behaviors/os/random/prng/lcg::lcg-high-byte-extraction-x86
