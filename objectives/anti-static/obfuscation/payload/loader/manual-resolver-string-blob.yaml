defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  # A single string over 256 KiB is not text a native program displays: it is
  # an ASCII-armored payload (custom base-N, printable-encrypted shellcode or
  # an encoded PE) kept in .rdata to dodge high-entropy section heuristics.
  # Paired with module lookup by PEB walk and hand-parsed export directories,
  # the binary decodes that blob through APIs that never appear in its import
  # table, which is the layout of a staged in-memory loader.
  - id: string-blob-with-manual-peb-export-resolver
    desc: Huge string blob beside manual PEB resolver
    crit: hostile
    conf: 0.94
    attack: T1027.009
    all:
      - id: metadata/binary/layout/strings::native-string-over-256-kib
      - id: micro-behaviors/os/api-resolution/export-table::x64-pe-signature-export-rva-read
    any:
      - id: micro-behaviors/os/api-resolution/manual::teb-self-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/manual::gs-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/manual::x64-peb-access-immediate
