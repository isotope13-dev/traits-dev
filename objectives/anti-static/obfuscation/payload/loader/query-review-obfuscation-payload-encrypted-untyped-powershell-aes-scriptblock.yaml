defaults:
  platforms:
  - windows
  for:
  - data

composite_rules:
  - id: untyped-powershell-aes-wrapped-script-construction
    desc: Base64 and AES decryption accompany ScriptBlock creation
    crit: suspicious
    conf: 0.95
    attack: T1027,T1140
    all:
      - id: metadata/file/encoding/base64::many-base64-alphabet-lines-untyped
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-untyped
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-managed-untyped
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor-untyped
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-untyped
