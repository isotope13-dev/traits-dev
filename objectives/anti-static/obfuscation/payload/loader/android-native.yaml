# The uninstall-ad behavior is independently visible in DEX. Requiring that
# objective before attributing the native in-memory DEX loader prevents benign
# packers and ordinary component-alias managers from being mislabeled.
defaults:
  platforms: [android]
  for: [apk, zip]
  attack: T1406

composite_rules:
  - id: native-dex-uninstall-ad-controller
    desc: Native DEX loader conceals uninstall-ad control
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: objectives/impact/ui/manipulation/ad-fraud::android-uninstall-shortcut-ad-interception
      - id: micro-behaviors/process/create/loader::android-native-memory-dex-component-loader
