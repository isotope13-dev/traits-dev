defaults:
  for: [javascript]
  platforms: [windows, macos, linux]
  crit: notable
  conf: 0.98
traits:
  - id: bundled-usb-infector-module
    desc: Bundled USB infector module name
    if:
      type: text
      regex: "['\"]utils/usb_infector\\.js['\"]\\s*:\\s*\\[function\\("
  - id: bundled-clipper-module
    desc: Bundled clipboard clipper module name
    if:
      type: text
      regex: "['\"]utils/clipper\\.js['\"]\\s*:\\s*\\[function\\("
  - id: bundled-phish-module
    desc: Bundled phishing module name
    if:
      type: text
      regex: "['\"]utils/phish\\.js['\"]\\s*:\\s*\\[function\\("
  - id: bundled-upload-module
    desc: Bundled file upload module name
    if:
      type: text
      regex: "['\"]utils/uploadFiles\\.js['\"]\\s*:\\s*\\[function\\("
  - id: bundled-persist-module
    desc: Bundled persistence module name
    if:
      type: text
      regex: "['\"]utils/persist\\.js['\"]\\s*:\\s*\\[function\\("
  - id: bundled-injection-module
    desc: Bundled injection module name
    if:
      type: text
      regex: "['\"]utils/injection\\.js['\"]\\s*:\\s*\\[function\\("
composite_rules:
  # Module names identify the bundled capabilities; they do not establish
  # that any individual module ran or that a transfer succeeded.
  - id: obfuscated-infector-clipper-phish-bundle
    desc: Obfuscated infector, clipper, and phishing bundle clues
    crit: hostile
    attack: T1027,T1059.007
    all:
      - id: bundled-usb-infector-module
      - id: bundled-clipper-module
      - id: bundled-phish-module
      - id: bundled-upload-module
      - id: bundled-persist-module
      - id: bundled-injection-module
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::arithmetic-encrypted-string-dispatch
