defaults:
  platforms: [macos]
  for: [macho]
  attack: T1027

composite_rules:
  - id: adhoc-hex-shell-trace-installer
    desc: Ad-hoc installer combines long hex strings, shell, and ptrace
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/process/create/shell/reference::adhoc-macho-hex-shell-api-profile
      - id: micro-behaviors/os/syscall/invoke::ptrace-import
      - id: metadata/filename/identity::generic-executable-name-1
      - id: metadata/binary/layout/strings::macho-long-average-string
