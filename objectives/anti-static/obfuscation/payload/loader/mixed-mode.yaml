# Native PE that embeds the MSVC C++/CLI DllMain diagnostic and
# hides a high-entropy writable .data blob. Mixed-mode adware and
# loaders use this shape; signed vendor C++/CLI is excluded by the
# missing Authenticode record.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620,T1027

composite_rules:
  - id: unsigned-mixed-mode-dllmain-payload
    desc: Unsigned mixed-mode DllMain payload
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::msvc-clr-dllmain-diagnostic
      - id: metadata/binary/anomaly/signing::small-high-entropy-data-section
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/module/load::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
