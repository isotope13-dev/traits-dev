defaults:
  platforms:
  - windows
  - unix
  for:
  - powershell

composite_rules:
  # .NET crypto can protect legitimate data. Require a PowerShell code
  # evaluator alongside the decryptor and keep the stronger verdict tied to
  # evidence from the unwrapped stage.
  - id: powershell-aes-wrapped-script-construction
    desc: Nearby Base64/AES decryption and ScriptBlock creation
    for: [scripts, source]
    crit: suspicious
    conf: 0.97
    attack: T1027
    # Keep all primitive roles in one window: a composite decryptor can
    # otherwise contribute only its distant Base64 location.
    near_lines: 80
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-aes-managed
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-aes-csp
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-crypto-namespace
      - id: micro-behaviors/crypto/symmetric/aes/reference::rijndael-managed

  - id: powershell-aes-gzip-wrapped-script-payload
    desc: Base64, AES and gzip feed ScriptBlock
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: powershell-aes-wrapped-script-construction
      - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
    any:
      - id: metadata/file/encoding/shape::powershell-many-base64-alphabet-lines
      - id: metadata/file/encoding/container::powershell-base64-dominated-body
    needs: 1
