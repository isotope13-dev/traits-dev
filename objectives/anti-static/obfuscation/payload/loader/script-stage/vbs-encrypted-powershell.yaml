defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  # Require the outer decoder, file staging and concealed execution as well
  # as an encrypted inner code stage. AES used only for data cannot qualify.
  # File scope deliberately allows a helper function for each operation.
  - id: vbs-hidden-aes-powershell-stage
    desc: Hidden VBScript launcher contains an AES-wrapped PowerShell stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.001,T1059.005
    all:
      - id: powershell-aes-wrapped-script-construction
      - id: micro-behaviors/data/decode/base64/bytes::vbs-msxml-base64-to-bytes
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
