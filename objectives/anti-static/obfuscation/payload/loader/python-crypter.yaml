# Python crypter decrypt-and-run loader (runtime deobfuscation stage).
#
# Companion to data/embedded/payload/encrypted::embedded-base64-aes-data.
# Where that rule fingerprints the *packed* payload, this one fingerprints the
# *execution* stage of the same stub: the embedded blob is base64-decoded, AES
# decrypted, then handed to a child process (PyInstaller stealers drop the cleared
# payload to a temp path and relaunch the bundled interpreter on it). Decode +
# symmetric-cipher decrypt + process spawn over a megabyte-scale embedded blob is
# a loader, not application logic — benign code does not run what it just decrypted.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [python, pyc]
  attack: T1140
  mbc: B0032
composite_rules:
  # The Fernet-keyed spelling of the same decrypt-and-run stage.
  #
  # `python-encrypted-bytecode-import-loader` below names AESGCM and requires
  # both pickle and marshal, which fits the release it was written from. A
  # crypter that reaches for `cryptography.fernet` instead -- one import, one
  # `.decrypt()`, no nonce to manage -- matches none of its legs while doing
  # the same thing: unwrap an embedded blob at import time and execute the
  # result.
  #
  # What carries the meaning is the sequence, not the cipher: an embedded
  # base64 blob, a symmetric decrypt, and an `exec` that runs at module scope.
  # A library that decrypts data hands it to the caller; it does not execute
  # it, and it does not do so merely because it was imported.
  #
  # Worked example: a Vare-obfuscated module whose payload line reads
  # `Fernet(...).decrypt(...)` -> `base64.b32decode` -> `b64decode` ->
  # `b64decode` -> `exec(...)`, buried under 290 KB of dead branches.
  - id: python-fernet-decrypt-and-exec
    for: [python]
    desc: Fernet-decrypted payload executed at import
    conf: 0.97
    attack: T1027,T1140,T1059.006
    all:
      - id: micro-behaviors/crypto/symmetric/fernet::decrypt
      - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    unless:
      - id: metadata/build/scaffold::python-unrendered-bootloader-template
      - id: metadata/package/testing/

  - id: python-crypter-decrypt-and-run
    for: [pyc]
    desc: Python decrypt-and-execute payload loader
    conf: 0.95
    attack: T1059.006
    all:
      - id: micro-behaviors/data/encode/base64::embedded-base64-blob
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-cipher-module-ref
      - id: micro-behaviors/data/decode/base64::b64decode-string
      - id: micro-behaviors/process/create/subprocess::subprocess-module-pyc

  # Python application code may legitimately encrypt configuration or load a
  # serialized record, but an import-time chain that decrypts data, rebuilds
  # both pickle and marshal objects, and executes the resulting code is a
  # concealed payload loader.
  - id: python-encrypted-bytecode-import-loader
    for: [python]
    desc: Python encrypted bytecode import loader
    conf: 0.99
    attack: T1027,T1140,T1059.006
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
      - id: micro-behaviors/data/serialize/unsafe::pickle-deserialization
      - id: micro-behaviors/data/serialize/unsafe::marshal-deserialization
      - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    near_lines: 260
    unless:
      - id: metadata/build/scaffold::python-unrendered-bootloader-template

  - id: python-aesgcm-decrypt-exec
    for: [python]
    desc: AES-GCM plaintext is executed
    conf: 0.97
    attack: T1027,T1140,T1059.006
    scope: file
    near_lines: 55
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/communications/http/lib/requests::requests-get

  - id: python-install-aesgcm-homoglyph-exec
    desc: Install decrypts AES-GCM through a homoglyph
    attack: T1195.002,T1027,T1140
    for: [python]
    scope: file
    all:
      - id: metadata/build/package/recipe/setup-hooks::setuptools-install-class
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-new
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-and-verify
      - id: objectives/anti-static/obfuscation/eval/scripting::mode-gcm-ref
      - id: objectives/anti-static/obfuscation/name-mangling/unicode::python-math-alphanumeric-call

  - id: python-install-crypter-ships-antidebug
    desc: Install crypter ships an anti-debug binary
    attack: T1195.002,T1622
    scope: package
    for: [python, python-sdist, pe, dll]
    all:
      - id: python-install-aesgcm-homoglyph-exec
      - id: objectives/anti-analysis/debugger-detect/check::dynamic-debugger-api-pair

  - id: python-import-thread-aesgcm-exec
    for: [python, python-sdist, whl, zip]
    desc: Import thread executes decrypted code
    conf: 0.97
    attack: T1027,T1059.006,T1195.002
    scope: archive
    all:
      - id: python-aesgcm-decrypt-exec
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
