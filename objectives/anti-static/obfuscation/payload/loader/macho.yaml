defaults:
  crit: hostile
  platforms: [macos]
  for: [macho]
  attack: T1027.009,T1129,T1059.004

composite_rules:
  - id: macho-concealed-runtime-command-loader
    desc: Mach-O concealed runtime command loader
    conf: 0.98
    all:
      - id: metadata/binary/section/ratio::macho-sparse-cstring-section
      - id: metadata/file/data-blob::peak-region-cipher-entropy
      - id: micro-behaviors/dylib/load/runtime::dlopen-dlsym
      - id: micro-behaviors/process/create/popen::c-popen
  - id: macho-obfuscated-memory-bootstrap
    desc: Ad-hoc Mach-O decrypts a concealed bootstrap in transient locked memory
    conf: 0.99
    attack: T1027,T1055,T1620
    all:
      - id: metadata/binary/section/ratio::macho-sparse-cstring-section
      - id: metadata/binary/section/ratio::extreme-text-to-string-ratio
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: "micro-behaviors/mem/map::mmap-import"
      - id: micro-behaviors/mem/lock/pages::mlock-import
      - id: micro-behaviors/mem/unmap::munmap-import
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  # Obfuscated macOS stealers keep almost no readable __cstring data while
  # resolving APIs at runtime and mapping a short-lived decrypted stage. The
  # extreme-text-to-string-ratio leg in the sibling rule is suppressed once the
  # binary retains a modest string count, which these stubs still do.
  - id: macho-adhoc-sparse-transient-memory-bootstrap
    desc: Ad-hoc Mach-O with sparse strings stages locked transient memory
    crit: hostile
    conf: 0.97
    attack: T1027,T1620,T1555
    mbc: B0028
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/section/ratio::macho-sparse-cstring-section
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: micro-behaviors/mem/map::mmap-import
      - id: micro-behaviors/mem/lock/pages::mlock-import
      - id: micro-behaviors/mem/unmap::munmap-import
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: macho-adhoc-encrypted-transient-stealer-stage
    desc: Ad-hoc Mach-O decrypts stealer stage into locked memory
    conf: 0.98
    attack: T1027,T1555,T1620
    mbc: B0028
    all:
      - id: macho-adhoc-sparse-transient-memory-bootstrap
      - id: metadata/binary/layout/entropy::encrypted-payload-dropper

  # AMOS-class stubs keep __cstring nearly empty (minimal, not merely sparse),
  # resolve through dlsym, and enter from a non-standard section while staying
  # ad-hoc signed — without the mmap/mlock transient-memory bootstrap the
  # sibling rules require.
  - id: macho-adhoc-minimal-cstring-dlsym-stub
    desc: Ad-hoc Mach-O dlsym stub with minimal strings
    crit: suspicious
    conf: 0.96
    attack: T1027,T1620
    mbc: B0028
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: objectives/anti-static/pack/polymorphic::unusual-entry-point-section
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  # Same concealed loader as the transient-memory rules above, but mmap, mlock,
  # and the staged APIs are resolved with dlsym(RTLD_DEFAULT) instead of
  # imports, so those import legs never fire. The repeated RTLD_DEFAULT calls
  # are the hidden import table; the high-entropy const is the staged payload.
  - id: macho-adhoc-rtld-default-encrypted-loader
    desc: Ad-hoc Mach-O RTLD_DEFAULT encrypted loader
    crit: hostile
    conf: 0.97
    attack: T1027,T1129,T1620
    mbc: B0028
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: micro-behaviors/dylib/lookup::rtld-default-direct-calls
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: metadata/binary/section/entropy::high-entropy-const-region
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
