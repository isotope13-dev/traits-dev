defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # A native image that hosts the CLR to run a managed assembly, names the
  # AMSI scan-buffer API, and writes and resumes a thread context is an
  # in-memory loader that blinds script scanning before it executes its
  # payload. The three legs are notable on their own; together they describe
  # the loader's staging and evasion, not a benign runtime host.
  - id: native-clr-amsi-thread-loader
    desc: Native CLR host blinds AMSI and writes thread context
    crit: hostile
    conf: 0.94
    attack: T1562.001,T1055,T1027
    all:
      - id: micro-behaviors/os/security/amsi::library-and-scan-buffer-name-pair
      - id: micro-behaviors/process/info/thread::thread-context-pair-set-resume
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-native-hosting-apis
