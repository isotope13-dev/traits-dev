defaults:
  for: [pyc]
  platforms: [windows, unix]
composite_rules:
  - id: encrypted-input-remote-agent
    desc: Fernet stage with input and remote-event modules
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1056.001
    all:
      - id: micro-behaviors/crypto/symmetric/fernet::pyc-fernet-library-reference
      - id: micro-behaviors/crypto/symmetric/fernet::pyc-fernet-long-token
      - id: micro-behaviors/hardware/input/keyboard/listener::pyc-pynput-keyboard-reference
      - id: micro-behaviors/communications/socket/lib::pyc-socketio-module-reference
      - id: micro-behaviors/crypto/decrypt::pyc-decrypt-reference
