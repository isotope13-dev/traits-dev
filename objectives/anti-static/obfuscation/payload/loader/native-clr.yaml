# Native PE that loads a .NET payload via the CLR.
#
# A native (non-.NET) Windows binary that references `mscoree.dll`
# AND calls `CorExitProcess` AND has `LoadLibrary` capability is
# almost certainly hosting a .NET DLL inside a native shell. This is
# the DTProHelper → Engine.dll shape: native PE for cert/signing
# optics on the outside, managed code on the inside.
#
# The pattern catches:
#   - Trojanized vendor binaries dropping .NET payloads
#   - Shellcode loaders that pivot into a .NET runtime
#   - "Mixed-mode native shim + managed DLL" backdoors
#
# Critical exclusion: actual .NET assemblies (BSJB metadata) and
# .NET single-file host runtimes — those legitimately call mscoree
# and CorExitProcess as part of their startup path.
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1620"
  mbc: "B0032"

composite_rules:
  - id: native-clr-encrypted-byte-array-loader
    desc: Native CLR loader executes encrypted byte-array payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/library::mscoree-dll-name
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-native-hosting-apis
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-byte-array-assembly-load
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-entrypoint-invoke
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-gcm-decrypt-api-set
      - id: micro-behaviors/mem/protect/modify::virtual-protect

  - id: native-clr-staged-payload
    desc: Staged CLR payload via embedded binary or resource extraction
    crit: component
    conf: 0.95
    any:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/embedded::xor-dword-masked-pe-in-data
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction

  - id: native-pe-embeds-unsigned-clr-loader
    desc: Unsigned native PE embeds CLR payload with anti-analysis loader
    crit: hostile
    conf: 0.99
    attack: "T1027,T1620,T1622"
    all:
      - id: micro-behaviors/fs/path/library::mscoree-dll-name
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-native-hosting-apis
      - id: native-clr-staged-payload
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    any:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      # Netch.exe is a single-file .NET publish of the proxy client. The
      # apphost stub, the embedded runtime, and VirtualProtect are the
      # publish layout.
      - id: well-known/dual-use/tunnel/netch::netch-executable
      - id: objectives/evasion/masquerade/identity/app::unsigned-trainer-cheat-controls-only

  - id: native-overlay-clr-stage-loader
    desc: Native overlay wrapper stages CLR payload
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/layout/ratio::overlay-over-35pct
      - id: metadata/binary/section/layout::edata-wrapper-entry-layout
    any:
      - id: micro-behaviors/fs/path/library::mscoree-dll-name
      - id: micro-behaviors/process/exit/terminate::corexitprocess-string
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    needs: 3
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/cff-explorer/
  - id: native-clr-dynamic-api-stage-loader
    desc: Native CLR payload loader with dynamic API resolution
    crit: hostile
    conf: 0.96
    all:
    - id: micro-behaviors/process/interpreter/runtime/clr::pe-clr-hosting-api-profile
    - id: micro-behaviors/process/enumerate/snapshot::peb-toolhelp-api-profile
    unless:
    - id: metadata/signed/platform/

  - id: native-clr-evasive-table-decoded-loader
    desc: Native CLR loader executes table-decoded payload with anti-analysis gates
    crit: hostile
    conf: 0.98
    attack: "T1027.009,T1620,T1622"
    all:
      - id: objectives/anti-static/obfuscation/payload/resource::native-table-decoded-clr-resource
      - id: objectives/anti-analysis/debugger-detect/combined-checks::native-clr-profiler-pointer-gate
      - id: micro-behaviors/process/interpreter/runtime/clr::native-appdomain-load-byte-array
    any:
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::xor-string-decoder-with-clr-host-identifiers
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
