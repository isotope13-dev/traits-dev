defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1176,T1057
traits:
  - id: control-panel-telegram-config
    desc: Configures a panel and Telegram bot
    crit: notable
    if:
      type: text
      regex: '(?s)panelUrl.{0,250}telegramPanel.{0,150}botToken.{0,100}chatId'
composite_rules:
  - id: obfuscated-browser-data-control-panel
    desc: Obfuscated privileged extension with control panel
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, zip, 7z, chrome-manifest, javascript, text]
    all:
      - id: control-panel-telegram-config
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::obfuscator-mangled-rotated-numeric-preset
      - id: metadata/permission/extension-api::permission-system-cpu
      - id: metadata/permission/cookie::permission-cookies
      - id: metadata/permission/history::permission-history
      - id: metadata/permission/clipboard::permission-clipboard-read
      - id: metadata/permission/host::broad-content-script-matches
