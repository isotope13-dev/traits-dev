defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  attack: T1027.009,T1140
composite_rules:
  - id: concealed-pe-signature-restoration
    desc: Concealed PE loader reconstructs erased executable signatures
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/header::restore-dos-magic-x64
      - id: micro-behaviors/data/embedded/payload/header::restore-pe-and-dos-signatures-x64
      - id: micro-behaviors/os/api-resolution/digest-export::module-hash-adjusted-tail-resolver-x64

  - id: flattened-pe-signature-restoration
    desc: TLS-flattened loader restores PE signatures
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/header::restore-pe-and-dos-signatures-x64
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
