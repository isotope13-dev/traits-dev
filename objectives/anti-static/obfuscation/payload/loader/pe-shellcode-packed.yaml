defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: pe-sparse-functions-packing-clues
    desc: PE with no dependencies, few functions, and packing clues
    crit: suspicious
    conf: 0.9
    size_min: 16384
    unless:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/binary/header/characteristics::efi-pe-subsystem
      # API-set contract DLLs (api-ms-win-*) and similar shims are import-free
      # export forwarders with almost no code; forwarding is their content.
      - id: metadata/binary/symbols/exports::forwarded-export-reference
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/code/complexity::few-functions
    any:
      - id: metadata/binary/code/density::huge-null-run-text
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::native-byte-xor-loop
      - id: objectives/anti-analysis/vm-detect/instruction::multiple-rdtsc-instr
  - id: x64-decoded-shellcode-loader
    desc: x64 decoded code copied to executable memory
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-xor-immediate-byte-loop
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-read-register-x64
    unless:
      - id: metadata/installer/product/
