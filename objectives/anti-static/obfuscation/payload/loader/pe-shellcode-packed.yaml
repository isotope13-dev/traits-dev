defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: pe-zero-imports-shellcode-dropper
    desc: "PE with zero imports plus obfuscation - likely shellcode or packed malware"
    crit: hostile
    conf: 0.9
    size_min: 16384
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/section/ratio::dominant-section
      - id: metadata/binary/resource/
      - id: metadata/binary/header/characteristics::efi-pe-subsystem
      - id: metadata/signed/platform/
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/code/complexity::few-functions
    any:
      - id: metadata/binary/code/density::huge-null-run-text
      - id: micro-behaviors/crypto/symmetric/xor/loop::native-byte-xor-loop
      - id: objectives/anti-analysis/vm-detect/instruction::multiple-rdtsc-instr
  - id: x64-decoded-shellcode-loader
    desc: x64 decoded code copied to executable memory
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-xor-immediate-byte-loop
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: metadata/file/profile/memory-protection-code::virtualprotect-executable-read-register-x64
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
