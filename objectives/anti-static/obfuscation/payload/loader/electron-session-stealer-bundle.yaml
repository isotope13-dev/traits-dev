defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.96
traits:
  # This combination matches the configuration and dependency profile of the
  # separately reviewed Epsilon credential-stealer source archive.
  - id: session-stealer-config-and-dependencies
    desc: Session-stealer config and dependency clues
    for: [json, package.json]
    if:
      type: yara
      source: |
        rule session_stealer_config_and_dependencies {
          strings:
            $cookie = "\"cookieSessions\"" ascii
            $logout = "\"logout\"" ascii
            $ui = "\"ui\"" ascii
            $sqlite = "\"better-sqlite3\"" ascii
            $seed = "\"bitcoin-seed\"" ascii
            $password = "\"node-passworder\"" ascii
            $protect = "\"win-protect\"" ascii
            $upload = "\"form-data\"" ascii
          condition:
            all of them
        }
composite_rules:
  # Archive co-occurrence does not establish that collection or upload ran.
  - id: obfuscated-session-stealer-profile
    desc: Obfuscated session-stealer bundle clues
    crit: hostile
    for: [json, package.json, javascript, asar, zip, 7z, pe]
    scope: archive
    attack: T1027,T1555.003
    all:
      - id: session-stealer-config-and-dependencies
      - id: metadata/file/line::javascript-line-over-eight-megabytes
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-function-derived-computed-call
      - id: micro-behaviors/data/string/access::javascript-unshift-pop-rotation-text
