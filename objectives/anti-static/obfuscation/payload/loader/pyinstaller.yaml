defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001
  mbc: B0032.001
composite_rules:
  # Build markers are neutral metadata; attack claims below require more context.
  - id: pyinstaller-overlay-mutator
    desc: PyInstaller self-read overlay mutation workflow
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/build/bundler/runtime::pyinstaller-pe-bundle-markers
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-vt-client
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-appender-module
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
    any:
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: pyinstaller-encrypted-overlay-network
    desc: PyInstaller PE with encrypted overlay and networking
    crit: hostile
    conf: 0.95
    attack: T1027.002
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: metadata/binary/layout/ratio::overlay-over-35pct
      - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/

  - id: opaque-pyinstaller-overlay-dropper
    desc: Opaque-named PyInstaller PE is almost entirely overlay
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/build/bundler/runtime::pyinstaller-spyiboot

  - id: opaque-pyinstaller-entropy-dropper
    desc: Opaque-named PyInstaller PE with very high entropy
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/file/entropy::overall-entropy-78
      - id: metadata/build/bundler/runtime::pyinstaller-mpyimod

  - id: hashed-pyinstaller-overlay-dropper
    desc: Opaque-named PyInstaller PE with 30%+ overlay
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/layout/overlay::overlay-over-30pct
      - id: metadata/build/bundler/runtime::pyinstaller-mpyimod
