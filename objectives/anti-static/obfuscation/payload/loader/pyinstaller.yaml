defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001
  mbc: B0032.001
composite_rules:
  # pyinstaller-bundle (python.yaml) inherits that file's `for: [python, pyc]`
  # and deliberately leaves out `pe` on its meipass-elf leg (PE coverage of
  # that marker already lives as meipass-runtime-dir in pe.yaml), so it can
  # never fire here. The other four markers it pools via `any:`/`needs: 2`
  # are already declared `for: [..., pe]`; re-pool just those for a PE-scoped
  # equivalent instead of widening the shared composite's own type list.
  - id: pyinstaller-pe-bundle-marker
    desc: PyInstaller packed PE binary marker
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-mpyimod
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-spyiboot
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-pydata
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-script-fail
  - id: pyinstaller-overlay-mutator
    desc: PyInstaller self-read overlay mutation workflow
    crit: suspicious
    conf: 0.95
    all:
      - id: pyinstaller-pe-bundle-marker
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-vt-client
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-appender-module
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay-raw
      - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: pyinstaller-encrypted-overlay-network
    desc: PyInstaller PE with encrypted overlay and networking
    crit: hostile
    conf: 0.95
    attack: T1027.002
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay-raw
      - id: metadata/binary/layout/ratio::overlay-over-35pct
      - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/

  - id: opaque-pyinstaller-overlay-dropper
    desc: Opaque-named PyInstaller PE is almost entirely overlay
    crit: hostile
    conf: 0.96
    attack: T1027.002
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-spyiboot

  - id: opaque-pyinstaller-entropy-dropper
    desc: Opaque-named PyInstaller PE with very high entropy
    crit: hostile
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/layout/entropy::overall-entropy-78
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-mpyimod

  - id: hashed-pyinstaller-overlay-dropper
    desc: Hash-named PyInstaller PE with a dominant overlay
    crit: hostile
    conf: 0.95
    attack: T1027.002
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/layout/overlay::overlay-over-30pct
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-mpyimod