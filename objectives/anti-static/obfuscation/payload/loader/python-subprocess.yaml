defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1027
traits:
- id: py-stdin-child-interpreter
  desc: Python child interpreter stdin
  crit: component
  conf: 0.9
  if:
    type: text
    regex: \[\s*sys\.executable\s*,\s*["']-["']\s*\]
- id: cpython-profiling-child-test
  desc: CPython profiling child process test
  crit: notable
  conf: 0.9
  if:
    type: path
    basename: true
    exact: test_children.py
composite_rules:
- id: py-base64-inline-exec-loader
  desc: Python execs base64 payload
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::direct-base64-exec
  any:
  - id: metadata/file/line::single-long-line-outlier
  - id: metadata/file/line::very-long-source-line
- id: py-base64-background-exec
  desc: Hidden base64 Python execution
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/process/create/subprocess::sys-executable-c-popen
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::direct-base64-exec
  - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
- id: py-hidden-inline-child-exec
  desc: Inline child Python execution with suppressed stdio
  crit: component
  conf: 0.9
  all:
  - id: micro-behaviors/process/create/subprocess::sys-executable-c-popen
  - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
  unless:
  - id: cpython-profiling-child-test
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
- id: py-decoded-stage-child-exec
  desc: Decoded payload child interpreter
  crit: component
  conf: 0.94
  all:
  - id: py-stdin-child-interpreter
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
