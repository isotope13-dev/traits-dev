defaults:
  platforms: [windows]
  for: [iso]
  attack: T1055,T1620

composite_rules:
  - id: iso-vb6-runtime-memory-loader
    desc: ISO VB6 runtime couples to memory loader APIs
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-native-memory-api-cluster
      - id: metadata/file/format/iso::iso-vb6-runtime-identity
