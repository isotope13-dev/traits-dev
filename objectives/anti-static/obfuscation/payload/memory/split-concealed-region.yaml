defaults:
  platforms:
    - windows
    - unix
  attack: T1027
  for:
    - pe
    - dll
composite_rules:
  - id: concealed-overlay-memory-loader
    desc: Concealed PE payload paired with executable-memory modification
    crit: hostile
    conf: 0.96
    attack: T1027,T1620
    all:
      - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
      - id: metadata/binary/layout/overlay::large-low-entropy-overlay-pe-profile
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/data/control-flow/dispatch/indirect::indirect-call-r13-x64
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
    unless:
      - id: metadata/installer/product/
  - id: pe-rwx-concealed-payload-carrier
    desc: PE RWX section conceals encrypted payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1027.009
    all:
      - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
      - id: metadata/binary/section/reloc::large-write-execute-low-entropy-section
      - id: metadata/binary/section/ratio::reloc-dominates-image
  - id: unsigned-rwx-overlay-byte-transform-loader
    desc: Unsigned native PE decodes an executable writable overlay
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/binary/section/entropy::high-entropy-rwx-data-section
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: metadata/binary/layout/size::large-overlay-64k
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x86-indexed-byte-xor-transform-loop
      - id: micro-behaviors/data/control-flow/transfer::x86-counted-loop-jmp-eax
      - id: micro-behaviors/data/bitwise/mixed::x86-rol-ror-xor-byte-mixer
    unless:
      - id: metadata/installer/product/
