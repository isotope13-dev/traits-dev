# A crypter that appends a small RWX section, points the entry point at it and
# lets its stub XOR-decrypt the program's own code in place before jumping to
# the original entry. The decrypted body is ordinary compiled code, so the
# static image shows only an encrypted .text and a tiny writable-executable
# section that nothing legitimate would put the entry point in.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  attack: T1027.002,T1140

composite_rules:
  - id: entry-stub-decrypts-code-in-place
    desc: Entry stub XOR-decrypts the image code in place
    crit: hostile
    conf: 0.95
    mbc: F0001
    all:
      - id: micro-behaviors/data/encode/arithmetic::rolling-key-xor-in-place-loop-x64
      - id: metadata/binary/section/header::writable-entry-with-wx-section
    unless:
      - id: metadata/signed/platform/
