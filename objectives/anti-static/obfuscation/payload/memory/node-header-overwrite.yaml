defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-ffi-pe-header-overwrite-loader
    desc: Native PE mapper overwrites loaded image headers
    crit: hostile
    conf: 0.99
    attack: T1027,T1620
    all:
      - id: micro-behaviors/data/parse/executable-header::javascript-pe32plus-parser
      - id: micro-behaviors/dylib/load/binding::node-ffi-dll-entry-prototype
      - id: micro-behaviors/mem/write/arbitrary::javascript-native-header-buffer-overwrite
