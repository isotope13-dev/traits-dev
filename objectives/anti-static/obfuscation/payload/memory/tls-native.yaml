defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: subtract-decrypted-tls-execution
    desc: Decrypts buffer and executes through TLS
    crit: hostile
    conf: 0.98
    attack: T1140,T1620
    all:
      - id: micro-behaviors/data/arithmetic::repeating-key-subtract-loop-x86
      - id: micro-behaviors/mem/protect/modify/executable::tls-buffer-rwx-arguments-x86
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
      - id: micro-behaviors/process/inject/runtime/call::tls-buffer-indirect-call-x86
