defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: unsigned-gdi-audio-memory-api-clues
  desc: Unsigned PE with GDI bitmap, audio, and memory-protection APIs
  crit: suspicious
  conf: 0.95
  attack: T1027.003,T1620
  size_max: 262144
  all:
    - id: micro-behaviors/ui/graphics/image::gdi-getdibits
    - id: micro-behaviors/hardware/input/audio::wave-out-open
    - id: metadata/signature/absent::unsigned-missing-signature-record
    - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    - id: micro-behaviors/dylib/lookup::get-proc-address-import
