# Overlay and API evidence; encryption and payload execution are not established.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: overlay-xor-memory-api-arguments
  desc: Overlay, XOR API and allocation clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
  - id: micro-behaviors/mem/alloc/virtual::xor-decoded-virtual-alloc-api
  - id: objectives/anti-static/obfuscation/decoders::xor-decoded-memory-write-or-protect-api
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
- id: unsigned-overlay-one-dll-memory-thread-apis
  desc: Unsigned overlay, one DLL and memory/thread APIs
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/symbols/imports::pe-single-import-dll
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/process/thread/create::create-thread
  - id: metadata/signature/absent::unsigned
  any:
  - id: metadata/binary/layout/overlay::large-opaque-high-entropy-overlay
  - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
  unless:
  - id: metadata/installer/product/
- id: unsigned-overlay-few-imports-memory-thread-apis
  desc: Unsigned overlay, few imports and memory APIs
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/process/thread/create::create-thread
  - id: metadata/signature/absent::unsigned
  any:
  - id: metadata/binary/layout/overlay::large-opaque-high-entropy-overlay
  - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
  unless:
  - id: metadata/binary/symbols/count::many-imports-25
  - id: metadata/installer/product/
- id: signed-overlay-file-memory-thread-apis
  desc: Signed overlay with file, memory and thread APIs
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
  - id: metadata/binary/layout/entropy::overlay-entropy-over-7
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/process/thread/create::create-thread
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  unless:
  - id: metadata/installer/product/
