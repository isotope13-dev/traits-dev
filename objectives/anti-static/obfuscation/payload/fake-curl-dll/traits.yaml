# Core curl exports are neutral library identity. A small DLL that exports
# them while also carrying TLS/loader and concealed-payload indicators is a
# proxy/loader shape, not ordinary libcurl use.
defaults:
  crit: hostile
  for: [pe, dll]
  platforms: [windows]
  attack: T1027,T1620

composite_rules:
  - id: concealed-curl-export-loader
    desc: Concealed payload behind curl-compatible exports
    conf: 0.98
    all:
      - id: well-known/lib/network/native/curl::curl-api-export-set
      - id: metadata/binary/layout/entropy::peak-region-entropy-7p5
      - id: metadata/binary/layout/entropy::binary-peak-region-mass-over-8k
    any:
      - id: metadata/file/encoding/hex::long-hex-text-run
    unless:
      - id: well-known/lib/network/native/curl::runtime-library
      - id: well-known/lib/network/native/curl::windows-runtime-library
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/

  - id: self-issued-curl-junk-loader
    desc: Self-issued curl-export DLL with massive junk padding
    conf: 0.98
    all:
      - id: well-known/lib/network/native/curl::curl-api-export-set
      - id: metadata/binary/section/prose::extreme-string-count
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
    any:
      - id: metadata/signature/unverified/
      - id: metadata/signature/self-signed/
      - id: metadata/signature/invalid/
    unless:
      - id: well-known/lib/network/native/curl::runtime-library
      - id: well-known/lib/network/native/curl::windows-runtime-library
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/


  - id: tls-thread-curl-proxy-loader
    desc: TLS-threaded curl proxy loader
    conf: 0.98
    all:
      - id: well-known/lib/network/native/curl::curl-api-export-set
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: well-known/lib/network/native/curl::runtime-library
      - id: well-known/lib/network/native/curl::windows-runtime-library
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
      # Verified Kitware CMake tools statically link curl with exports
      # preserved (cmake-gui); verified signature plus matching content
      # digest proves vendor identity and an untampered image.
      - id: well-known/tool/development/build/cmake::cmake-toolchain-context

  - id: curl-export-dynamic-proxy-loader
    desc: Curl-export DLL hides a dynamically resolved execution proxy
    conf: 0.99
    all:
      - id: tls-thread-curl-proxy-loader
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports

  - id: curl-export-memory-execution-loader
    desc: Hollow curl DLL combines memory and execution APIs
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/dll/proxy::curl-export-dll-without-network-import
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    any:
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/process/create/native-symbol::create-process-w
      - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
    unless:
      - id: well-known/lib/network/native/curl::runtime-library
      - id: well-known/lib/network/native/curl::windows-runtime-library
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/

  # TrojanPony-style WinGUp side-load DLLs (2026): megabytes of bare lowercase
  # words keep whole-file entropy near 4.5, and a certificate directory that
  # holds no parseable Authenticode signature makes the file look signed in
  # shallow tooling. Neither is part of a real libcurl build.
  - id: word-padded-hollow-curl-bogus-certificate
    desc: Word-padded hollow curl DLL carries an unparseable certificate table
    conf: 0.97
    attack: T1027.001,T1036.001,T1574.002
    all:
      - id: objectives/evasion/masquerade/dll/proxy::curl-export-dll-without-network-import
      - id: metadata/file/text-distribution::lowercase-word-run-padding
      - id: metadata/signature/certificate/integrity::certificate-directory-without-parsed-signatures
