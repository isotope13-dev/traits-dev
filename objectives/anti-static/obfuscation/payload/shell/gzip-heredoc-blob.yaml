# The readable part of the script is a loader; the working code is a gzip
# stream inside a base64 heredoc that is decoded straight into a variable
# and run. Static scanning of the file sees only the blob, so decoded
# content (C2 hosts, tokens, upload paths) is invisible without unpacking.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027.010,T1140
composite_rules:
  - id: shell-gzip-base64-heredoc-packed-script
    desc: Shell script packed as a base64 gzip heredoc
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-command
      - id: micro-behaviors/data/decode/processor::gunzip-tool
      - id: micro-behaviors/data/encode/base64::repeated-base64-literals
      - id: micro-behaviors/process/interpreter/eval/direct::shell-evaluates-variable-command
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
