defaults:
  platforms: [linux]
  for: [systemd_service]
  attack: T1027,T1543.002

traits:
  - id: systemd-silent-copy-exec-remove-loop
    desc: Service copies runs and removes binary silently
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule systemd_silent_copy_exec_remove_loop {
          strings:
            $start = /ExecStart\s*=\s*\/bin\/(ba)?sh\s+-c/
            $copy = /\bcp\s+(-[A-Za-z]+\s+)+(--\s+)?\/bin\/[A-Za-z0-9_.-]+\s+\/bin\/[A-Za-z0-9_.-]+/
            $run = /&&\s*\/bin\/[A-Za-z0-9_.-]+\s+>\/dev\/null/
            $remove = /\brm\s+-[A-Za-z]+\s+(--\s+)?\/bin\/[A-Za-z0-9_.-]+/
            $silence = "2>/dev/null"
            $restart = /Restart\s*=\s*always/ nocase
          condition:
            all of them
        }
