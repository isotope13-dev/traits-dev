defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027,T1218.011

traits:
  - id: batch-alphabet-dll-launch
    desc: Alphabet variables conceal DLL execution command
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule batch_alphabet_dll_launch {
          strings:
            $letter = /set [A-Za-z_]{4,30}=[a-z]\r?\n/ nocase
            $command = /(%[A-Za-z_]{4,30}%){6}32 [^\r\n]{20,500}\.(%[A-Za-z_]{4,30}%){3},[^\r\n]{10,200}/ nocase
          condition:
            #letter >= 20 and $command
        }
