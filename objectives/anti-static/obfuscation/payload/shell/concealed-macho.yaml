defaults:
  platforms: [macos]
  for: [macho]
  attack: T1027
  mbc: F0001
composite_rules:
- id: concealed-shell-execution-macho
  desc: Concealed Mach-O shell execution
  crit: suspicious
  conf: 0.95
  all:
    - id: metadata/binary/section/prose::tiny-cstring-section
    - id: metadata/binary/section/ratio::extreme-text-to-string-ratio
  any:
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: micro-behaviors/process/create/popen::c-popen
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    # A large string table is ordinary for any runtime that ships its own (Go,
    # .NET, Electron), so it argues against concealment. Inline rather than a
    # named trait: as a finding it would fire on nearly every binary and say
    # nothing on its own.
    - type: metrics
      field: binary.string_count
      min: 1000
- id: concealed-command-capture-macho
  desc: Concealed command output capture
  crit: suspicious
  conf: 0.95
  all:
  - id: concealed-shell-execution-macho
  - id: micro-behaviors/process/create/popen::c-popen
  - id: micro-behaviors/fs/read/file/handle::fgets-api-import
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: concealed-devnull-command-capture-macho
  desc: Concealed command capture with stderr suppression
  crit: suspicious
  conf: 0.95
  all:
  - id: concealed-command-capture-macho
  - id: micro-behaviors/os/console/io::stderr-to-dev-null
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: commoncrypto-concealed-shell-macho
  desc: Concealed shell with CommonCrypto
  crit: suspicious
  conf: 0.9
  all:
  - id: concealed-shell-execution-macho
  - id: micro-behaviors/crypto/library/provider::commoncrypto-encryption-kdf
