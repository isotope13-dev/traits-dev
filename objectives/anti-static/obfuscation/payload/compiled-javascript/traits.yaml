# V8 compiled JavaScript hides the original source from ordinary static
# analysis.  A decompression step followed by a child-process launch is a
# staged payload pipeline, not merely a reference to a .jsc filename.
defaults:
  platforms: [windows, unix, macos]
  for: [scripts]
  attack: T1027,T1059.007,T1140

composite_rules:
  - id: node-decompressed-jsc-stage
    desc: Node decompresses and launches a JSC stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/vm::node-jsc-launch
      - id: micro-behaviors/data/compress/library::node-brotli-decompress-function
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
