# V8 compiled JavaScript hides the original source from ordinary static
# analysis.  A decompression step followed by a child-process launch is a
# staged payload pipeline, not merely a reference to a .jsc filename.
defaults:
  platforms: [windows, unix, macos]
  for: [scripts]
  attack: T1027,T1059.007,T1140

composite_rules:
  - id: node-decompressed-jsc-stage
    desc: Node decompresses and launches a JSC stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/compress/library::node-brotli-decompress-function
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    any:
      - id: micro-behaviors/process/interpreter/vm::node-jsc-launch
      - id: micro-behaviors/process/interpreter/vm::node-execpath-jsc-launch

  - id: powershell-scheduled-defender-jsc-stage
    desc: PowerShell stages a JSC payload with a scheduled task and Defender exclusion
    crit: hostile
    conf: 0.99
    attack: T1027,T1053.005,T1059.001,T1059.007,T1105,T1562.001
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/vm::node-jsc-preload
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: objectives/evasion/anti-av/platform/defender::defender-exclusion-process
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
