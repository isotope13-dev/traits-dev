# V8 compiled JavaScript hides the original source from ordinary static
# analysis.  A decompression step followed by a child-process launch is a
# staged payload pipeline, not merely a reference to a .jsc filename.
defaults:
  platforms: [windows, unix, macos]
  for: [scripts]
  attack: T1027,T1059.007,T1140

composite_rules:
  # A deployment stage supplies the key out-of-band, leaving an isolated
  # bundle unable to reveal its V8 payload. Decrypt -> decompress -> execute
  # captures the protection chain without depending on a .jsc extension,
  # launcher basename, key variable name, or V8 release.
  - id: env-keyed-encrypted-v8-cache-stage
    desc: Environment-keyed AES/Brotli stage executes as V8 cache
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: T1027.013,T1059.007,T1140
    near_lines: 64
    all:
      - id: micro-behaviors/process/interpreter/vm::vm-cached-data-execution
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc
      - id: micro-behaviors/data/compress/library::node-brotli-decompress-function
      - id: micro-behaviors/os/env/access::javascript
    unless:
      - id: well-known/tool/detection/security-scanner/

  - id: node-decompressed-jsc-stage
    desc: Node decompresses and launches a JSC stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/compress/library::node-brotli-decompress-function
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    any:
      - id: micro-behaviors/process/interpreter/vm::node-jsc-launch
      - id: micro-behaviors/process/interpreter/vm::node-jsc-preload-execfile-array
      - id: micro-behaviors/process/interpreter/vm::node-execpath-jsc-launch

  - id: node-jsc-credential-stealer-stage
    desc: Node launches a JSC stage alongside browser or wallet theft
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1555.003,T1041
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/interpreter/vm::node-jsc-preload-execfile-array
    any:
      - id: objectives/collection/stealer/browser::javascript-browser-data-upload
      - id: objectives/exfiltration/stealer/credential/browser::js-browser-wallet-upload-exfil

  - id: powershell-scheduled-defender-jsc-stage
    desc: PowerShell stages a JSC payload with a scheduled task and Defender exclusion
    crit: hostile
    conf: 0.99
    attack: T1027,T1053.005,T1059.001,T1059.007,T1105,T1562.001
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/vm::node-jsc-preload
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: objectives/evasion/anti-av/platform/defender::defender-exclusion-process
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download

  - id: elevated-event-trigger-jsc-stage
    desc: Elevated event-triggered task stages JSC while excluding Defender
    crit: hostile
    conf: 0.99
    attack: T1053.005,T1059.001,T1059.007,T1105,T1562.001
    for: [powershell]
    all:
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-event-trigger-xml
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-system-principal-xml
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-highest-runlevel-xml
      - id: micro-behaviors/process/interpreter/vm::node-jsc-preload
      - id: objectives/evasion/anti-av/platform/defender::defender-exclusion-process
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
