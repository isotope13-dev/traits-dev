# A launched self-replica whose output is explicitly labeled as mutated and
# whose generation uses a seeded PRNG is polymorphic replication, not generic
# dropper execution.  The infection composite supplies the self-path, write,
# child-launch, and mutation-name evidence; the PRNG leg adds randomization.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: E1027

composite_rules:
  - id: randomized-launched-self-replica
    desc: Generates randomized launched self-replica
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/infect/virus::self-image-replica-launch
      - id: micro-behaviors/os/random/crypto::seeded-random
