defaults:
  platforms: [windows, unix]
  for: [data]
  attack: T1027
  size_min: 512
  size_max: 1048576

traits:
  # MZ entry decoders for an appended body decoded in place. Two shapes share
  # this evidence: a word-XOR prologue that loads a word key into DX, points DS
  # at CS, sets a word count in CX, and XORs memory words with DX; and a byte
  # loop that LODSBs, rotates AL right by 4, XORs with a key word, STOSBs, and
  # LOOPs over a counted run of the image from the EOF entry.
  - id: dos-mz-xor-entry-decoder
    desc: MZ entry word-XOR or ROR-XOR decoder
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(BA ?? ?? 0E 1F B9 ?? ?? 41 21 06 ?? ?? 31 16 ?? ??|AC C0 C8 04 2E 32 06 ?? ?? AA E2 F4)"
