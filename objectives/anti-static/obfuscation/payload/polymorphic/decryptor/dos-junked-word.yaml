defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
traits:
  - id: dos-junked-incrementing-word-decoder
    desc: DOS junked incrementing word-XOR decoder
    crit: suspicious
    conf: 0.98
    attack: T1027
    if:
      type: yara
      source: |
        rule dos_junked_incrementing_word_decoder {
          strings:
            $entry = { B8 ?? ?? BE ?? ?? D1 C6 46 BB ?? ?? }
            $count = { 8B 3E ?? ?? BA ?? ?? 81 C6 ?? ?? 46 D1 C6 }
            $xor = { 2E 31 07 [0-24] 43 [0-24] 43 [0-24] 4A [0-24] 4A }
            $advance = { 81 C0 ?? ?? 41 46 FC 9D 74 03 E9 ?? ?? }
          condition:
            uint8(0) == 0xe9 and @entry == uint16(1)+3 and
            @entry < @count and @count < @xor and @xor < @advance and
            @advance-@entry < 512 and
            @advance+13+int16(@advance+11) == @xor and
            uint16(@entry+10) >= 0x100 and
            uint16(@count+5) > 32 and uint16(@count+5) % 2 == 0 and
            uint16(@entry+10)-0x100+uint16(@count+5) <= @entry
        }
