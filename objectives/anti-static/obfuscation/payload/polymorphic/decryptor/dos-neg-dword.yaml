# 16-bit DOS EXE body decrypted by a 32-bit two's-complement loop. The loop
# is LODSD (read dword), NEG EAX (negate), STOSD (write dword), LOOP. A
# plain count-driven copy with no arithmetic on the data is not this shape.
defaults:
  for: [data, dos_com]
  platforms: [windows, unix]
  attack: T1027
  size_max: 65536

traits:
  - id: dos-neg-dword-decrypt-loop
    desc: 32-bit NEG dword decryptor loop
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: "B9 ?? ?? 66 AD 66 F7 D8 66 AB E2 ??"
