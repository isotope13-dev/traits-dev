defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 5000
  size_max: 65536
  attack: T1027,T1574

traits:
  - id: dos-add-word-in-place-decoder
    desc: DOS word-add decoder loop
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'BE 11 15 B9 24 02 2E 81 04 1A 05 83 C6 02 49 75 F5'
  - id: dos-add-word-encoded-int21-vector-write
    desc: Encoded DOS interrupt vector replacement
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '05 F5 9E B3 E7 9D 6A FB 72 01 6C FB E1 BA'
  - id: dos-add-word-encoded-int21-file-filters
    desc: Encoded DOS file service filters
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'DD 7B E2 0C 5A 2C 66 F7 F8 6E 12 7B E2 49 5A 22 66 F7 35 6F 08 7B E2 38 5A 00 66 F7 31 70'

composite_rules:
  - id: dos-add-word-decoded-file-interrupt-hook
    desc: Obfuscated DOS code hooks file operations
    crit: hostile
    conf: 0.99
    near_bytes: 1024
    all:
      - id: dos-add-word-in-place-decoder
      - id: dos-add-word-encoded-int21-vector-write
      - id: dos-add-word-encoded-int21-file-filters
