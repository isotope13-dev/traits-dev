defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536
  crit: notable

traits:
  - id: dos-mz-push-regs-cs-ds-setup
    desc: DOS stub saves registers and sets DS=CS
    conf: 0.92
    if:
      type: hex
      pattern: '50 53 51 52 1E 06 0E 1F BE ?? ?? B9 ?? ??'

  - id: dos-xnor-word-decrypt-loop
    desc: DOS 16-bit XNOR word decryption loop
    conf: 0.97
    if:
      type: hex
      pattern: '8B 04 BA ?? ?? 0B C2 F7 D0 21 14 09 04 46 46 E2 EF'
