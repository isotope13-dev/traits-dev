defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-byte-add-counted-decoder
    desc: DOS counted byte-add decoder loop
    crit: notable
    if:
      type: hex
      pattern: 'BD 99 05 BE ?? ?? 90 2E 80 04 4D 83 C6 01 76 00 83 ED 01 75 F1'

  - id: dos-add4d-encoded-executable-filter
    desc: Encoded COM and EXE name checks
    crit: notable
    if:
      type: hex
      pattern: '34 F0 F6 02 28 BC 33 30 B5 00 28 C9 9E C0 43 34 F0 F8 0B 28 C0 33 30 B5 F8 28'

  - id: dos-add4d-encoded-infection-write
    desc: Encoded executable infection writes
    crit: notable
    if:
      type: hex
      pattern: '67 F1 80 D4 11 76 6B B4 F6 80 D4 76 0C 0D 9E 9D'

composite_rules:
  - id: dos-add4d-executable-infector
    desc: Additively encoded DOS COM and EXE file infector
    crit: hostile
    attack: T1027.014
    near_bytes: 1024
    all:
      - id: dos-byte-add-counted-decoder
      - id: dos-add4d-encoded-executable-filter
      - id: dos-add4d-encoded-infection-write
