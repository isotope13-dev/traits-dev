defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 7000
  size_max: 65536
  attack: T1027

traits:
  - id: dos-xor-decrement-in-place-loop
    desc: DOS loop XORs and decrements code bytes
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: '82 30 64 FE 08 43 E2 F8'
  - id: dos-xor64-inc-int21-get-vector
    desc: Encoded DOS INT 21 vector lookup
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'DD 46 52 AA 46'
  - id: dos-xor64-inc-int21-set-vector
    desc: Encoded DOS INT 21 vector replacement
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'DD 46 42 AA 46'

composite_rules:
  - id: dos-xor-decrement-int21-vector-hook
    desc: DOS XOR-decoded body retrieves and replaces INT 21 vector
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: metadata/binary/code/control-transfer::entry-near-jump-bytes
      - id: dos-xor-decrement-in-place-loop
      - id: dos-xor64-inc-int21-get-vector
      - id: dos-xor64-inc-int21-set-vector
