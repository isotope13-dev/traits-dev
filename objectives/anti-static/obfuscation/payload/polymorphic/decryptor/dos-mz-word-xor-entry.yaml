defaults:
  platforms: [windows, unix]
  for: [data]
  attack: T1027
  size_min: 512
  size_max: 1048576

traits:
  # MZ entry prologue that loads a word key into DX, points DS at CS, sets a
  # word count in CX, and XORs memory words with DX in a self-modifying loop.
  # Seen in DOS EXE infectors whose appended body is decoded in place.
  - id: dos-mz-word-xor-entry-prologue
    desc: MZ entry word-XOR decoder prologue
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "BA ?? ?? 0E 1F B9 ?? ?? 41 21 06 ?? ?? 31 16 ?? ??"
