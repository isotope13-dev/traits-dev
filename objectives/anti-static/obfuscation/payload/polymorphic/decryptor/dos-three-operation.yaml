defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
  crit: notable

traits:
  - id: dos-stack-delta-key-pair
    desc: DOS stack delta and paired keys
    if:
      type: hex
      pattern: 'E8 00 00 8B F4 36 8B 2C 83 C4 02 83 ED 03 EB 02 ?? ?? 2E 8A 86 ?? ?? 2E 8A 9E ?? ?? 8A F0 02 F3'

  - id: dos-add-sub-xor-triplet-loop
    desc: DOS add subtract XOR triplet loop
    if:
      type: hex
      pattern: '2E 00 46 00 2E 28 5E 01 2E 30 76 02 83 C5 03 E2 EF'

composite_rules:
  - id: dos-three-operation-decryptor
    desc: DOS paired-key add subtract XOR decryptor
    near_bytes: 80
    all:
      - id: dos-stack-delta-key-pair
      - id: dos-add-sub-xor-triplet-loop
