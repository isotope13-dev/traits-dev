# The x64 Shikata Ga Nai encoder (sgn) prepends `call rel32` that jumps to a
# decoder stub appended after the encoded body; the call's return address
# hands the stub the body to decode in place. A headerless blob whose first
# instruction calls into its own final bytes, over a uniformly random body,
# is that layout. SocGholish's Figma loader decrypts such a blob (two sgn
# rounds over a Donut loader) into memory.
#
# Hostile because legitimate software does not ship sgn-encoded blobs: the
# encoder exists to hide shellcode from static inspection, and the payload it
# hides cannot be recovered without emulating the decoder. The layout is
# specific (first-byte call landing in the final 512 bytes over a near-random
# body of 4 KiB or more) and matches nothing in the benign corpus.
defaults:
  platforms: [windows, linux]
  for: [shellcode, data]
  attack: T1027.002
  mbc: B0032.009

traits:
  - id: call-into-trailing-decoder-stub
    desc: Blob calls into a trailing decoder stub
    crit: hostile
    conf: 0.9
    ref: https://adamnet.works/blog/socgholish-trojanized-figma-rust-tor-backdoor/
    size_min: 4096
    if:
      type: yara
      source: |
        import "math"
        rule call_into_trailing_decoder_stub {
          condition:
            uint8(0) == 0xE8 and
            int32(1) > 4096 and
            int32(1) + 5 < filesize and
            int32(1) + 5 >= filesize - 512 and
            math.entropy(5, int32(1)) >= 7.9
        }
