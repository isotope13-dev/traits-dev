defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  attack: T1027
  mbc: B0032
traits:
  - id: shikata-ga-nai-stub
    desc: Shikata Ga Nai FPU GetPC decoder stub
    crit: suspicious
    conf: 0.9
    attack: T1027.002
    mbc: B0032.009
    if:
      type: hex
      # Shikata's polymorphic prologue obtains EIP with fnstenv and pops it
      # into any general-purpose register. Payload implants are often placed
      # in an appended executable section rather than the linker's .text.
      pattern: 'D9 74 24 F4 (58|59|5A|5B|5D|5E|5F)'
      offset_range: [0, null]
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member

composite_rules:
  # A Shikata-encoded payload in a PE that starts Winsock and connects out is
  # a staged or stageless reverse-shell payload. Metasploit's msfvenom emits
  # this shape with the encoder applied to a Winsock shell_reverse_tcp stub,
  # including when the payload is injected into an existing PE template.
  - id: shikata-encoded-winsock-connect-payload
    desc: Shikata-encoded payload starts Winsock and connects out
    crit: hostile
    conf: 0.95
    for: [pe]
    platforms: [windows]
    attack: T1027.002,T1059,T1095
    all:
      - id: shikata-ga-nai-stub
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
