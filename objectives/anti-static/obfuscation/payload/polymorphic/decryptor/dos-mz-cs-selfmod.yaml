defaults:
  platforms: [windows, unix]
  for: [data]
  attack: T1027
  size_min: 512
  size_max: 1048576

traits:
  - id: dos-mz-cs-selfmod-decryptor
    desc: Self-modifying CS-relative MZ entry decryptor
    crit: suspicious
    conf: 0.96
    if:
      type: yara
      source: |
        rule dos_mz_cs_selfmod_decryptor {
          meta:
            filetypes = "data"
          strings:
            $stub = { 2E 80 ( 06 | 2E | 36 ) ?? ?? ?? 2E 83 06 ?? ?? 01 2E 81 3E ?? ?? ?? ?? 75 EB }
          condition:
            uint16(0) == 0x5A4D and
            (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) < filesize and
            for any i in (1..#stub) : (
              @stub[i] == (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) and
              uint16(@stub[i] + 9) == uint16(@stub[i] + 15)
            )
        }

  - id: dos-mz-additive-decrypt-dos-check
    desc: MZ ADD-decryptor decodes DOS version check
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_mz_additive_decrypt_dos_check {
          meta:
            filetypes = "data"
          strings:
            $stub = { 2E 80 06 ?? ?? ?? 2E 83 06 ?? ?? 01 2E 81 3E ?? ?? ?? ?? 75 EB 90 }
          condition:
            uint16(0) == 0x5A4D and
            (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) < filesize and
            for any i in (1..#stub) : (
              @stub[i] == (uint16(0x08) + uint16(0x16)) * 16 + uint16(0x14) and
              uint16(@stub[i] + 9) == uint16(@stub[i] + 15) and
              @stub[i] + 29 <= filesize and
              ((uint8(@stub[i] + 22) + uint8(@stub[i] + 5)) & 0xFF) == 0xBE and
              ((uint8(@stub[i] + 25) + uint8(@stub[i] + 5)) & 0xFF) == 0xB4 and
              ((uint8(@stub[i] + 26) + uint8(@stub[i] + 5)) & 0xFF) == 0x30 and
              ((uint8(@stub[i] + 27) + uint8(@stub[i] + 5)) & 0xFF) == 0xCD and
              ((uint8(@stub[i] + 28) + uint8(@stub[i] + 5)) & 0xFF) == 0x21
            )
        }
