defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 318
  size_max: 65536
  attack: T1027,T1574

traits:
  - id: dos-stack-built-search-and-execution
    desc: Stack-built DOS search executes from stack
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'B8 21 72 50 BA 00 CD 52 BD B9 20 55 BA B4 4E 52 BB 5F 00 53 BA 8D 94 52 B8 8B F4 50 FF E4'
  - id: dos-stack-built-com-wildcard
    desc: COM wildcard built on stack
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BB 6F 6D 53 B8 2E 63 50 BB 24 2A 53'
  - id: dos-stack-built-file-write
    desc: DOS file write built on stack
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'BA D1 B9 52 BB 21 EB 53 BF 3E CD 57 BB 21 B4 53 BD 40 CD 55 BB 5E B4 53'

composite_rules:
  - id: dos-stack-built-com-search-write-infector
    desc: DOS infector constructs executable code on stack
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: dos-stack-built-search-and-execution
      - id: dos-stack-built-com-wildcard
      - id: dos-stack-built-file-write
