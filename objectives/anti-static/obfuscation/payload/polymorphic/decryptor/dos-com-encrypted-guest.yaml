# Appending COM infectors that encrypt their body leave a plain host image
# with one dense ciphertext region: the patched entry jumps to a
# self-modifying XOR loop that decrypts that region. COM encryptor envelopes
# cipher the whole program, so overall entropy stays high for them; a
# low-entropy file holding a near-random region behind an entry-redirected
# decoder is a plain host carrying an encrypted guest.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  attack: T1027,T1080
composite_rules:
  - id: dos-com-entry-decrypts-guest-in-plain-host
    desc: Entry decrypts XOR-encrypted guest in plain COM
    crit: hostile
    conf: 0.95
    size_max: 65536
    all:
      - id: objectives/impact/infect/binary/dos/file::dos-com-entry-self-modifying-xor-decoder
      - id: metadata/binary/layout/entropy::com-dense-region-7bit
      - id: metadata/binary/layout/entropy::com-overall-entropy-plain
