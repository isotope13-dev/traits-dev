defaults:
  platforms:
  - unix
  - windows
  - macos
composite_rules:
- id: shikata-ga-nai-dropper
  desc: Shikata Ga Nai decoder in a small or function-sparse file
  crit: suspicious
  conf: 1.0
  all:
  - id: objectives/anti-static/obfuscation/payload/polymorphic/decryptor::shikata-ga-nai-stub
  any:
  - id: metadata/binary/layout/size::small-elf-binary
  - id: metadata/binary/code/complexity::no-functions
