# Appended DOS viruses built by the Instant Virus Production kit (IVP) and
# similar hand-written encrypted COM infectors keep a one-byte XOR key inside
# their own body. Before each infection the decrypted body reads the clock
# (INT 21h AH=2Ch), retries until DH (seconds) is non-zero and stores DH into
# that key slot, so every copy carries a different ciphertext. The stub only
# exposes the delta-offset CALL and the decryptor; the rotation is checked by
# decrypting the body with the stub's current key, so no key byte is fixed.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536
  attack: T1027.014

traits:
  - id: dos-clock-rekeyed-self-xor-body
    desc: XOR virus body rekeys itself from clock
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_clock_rekeyed_self_xor_body {
          meta:
            filetypes = "dos_com,data"
          strings:
            $base = { E8 00 00 5D 81 ED ?? ?? E8 ?? ?? }
            $dec = { 8D (9E|B6|BE) ?? ?? B9 ?? ?? 2E 8A (B6|96|86|9E|BE|AE|A6) ?? ?? 2E 8A ?? 32 ?? 2E 88 ?? 4? E2 F5 C3 }
          condition:
            for any b in (1..#base) : (
              for any d in (1..#dec) : (
                ((@base[b] + 11 + uint16(@base[b] + 9)) & 0xFFFF) == @dec[d] and
                @base[b] + 3 >= uint16(@base[b] + 6) and
                for any k in (uint8(@base[b] + 3 - uint16(@base[b] + 6) + uint16(@dec[d] + 10))) : (
                  for any s in (@base[b] + 3 - uint16(@base[b] + 6) + uint16(@dec[d] + 2)) : (
                    s + uint16(@dec[d] + 5) <= filesize and
                    for any j in (0 .. uint16(@dec[d] + 5) - 4) : (
                      (uint32(s + j) ^ (k * 0x01010101)) == 0x21CD2CB4
                    ) and
                    for any j in (0 .. uint16(@dec[d] + 5) - 5) : (
                      (uint16(s + j) ^ (k * 0x0101)) == 0x882E and
                      (uint8(s + j + 2) ^ k) == uint8(@dec[d] + 9) and
                      (uint16(s + j + 3) ^ (k * 0x0101)) == uint16(@dec[d] + 10)
                    )
                  )
                )
              )
            )
        }
