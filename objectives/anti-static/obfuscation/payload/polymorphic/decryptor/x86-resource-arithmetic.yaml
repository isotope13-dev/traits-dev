defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-resource-delta-unrolled-decoder
    desc: Resource delta stub decodes arithmetic blocks
    crit: suspicious
    conf: 0.99
    attack: T1027.002,T1140
    if:
      type: yara
      # Preserve registers; derive EAX from the current PC; transform several
      # words relative to that same pointer. All offsets and keys vary.
      # The hex section selector takes only the first section with a given
      # name. Inspect every section so a grafted second .rsrc is not skipped.
      source: |
        import "pe"
        rule resource_delta_arithmetic_decoder {
          strings:
            $stub = { 50 51 52 53 55 56 57 E8 00 00 00 00 58
              (2D|81 E8) [4] BF 00 00 00 00 50
              81 (A8|80|B0) [8] 81 (A8|80|B0) [8]
              81 (68|40|70) ?? [4] 81 (A8|80|B0) [8] F7 90 ?? ?? ?? ?? }
          condition:
            for any i in (0..pe.number_of_sections - 1): (
              pe.sections[i].name == ".rsrc" and
              for any j in (1..#stub): (
                @stub[j] >= pe.sections[i].raw_data_offset and
                @stub[j] + !stub[j] <= pe.sections[i].raw_data_offset +
                  pe.sections[i].raw_data_size
              )
            )
        }
