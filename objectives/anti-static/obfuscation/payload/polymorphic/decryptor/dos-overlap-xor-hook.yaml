defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_min: 7000
  size_max: 65536
  attack: T1027,T1574

traits:
  - id: dos-overlap-xor-self-modifying-decoder
    desc: DOS overlapping XOR decoder modifies itself
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'BF 36 01 B9 A4 08 BB 00 14 2E 89 A7 11 01 2E 80 B7 2F 01 49 EB 18'
  - id: dos-overlap-xor-encoded-int21-hook
    desc: Encoded DOS interrupt vector hook
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '49 8C F4 A4 C4 FE 7A BE 46 54 F3 44 13 7C 54 F6 7C 11 7C 54 F3 44 48 72 54 F6 7C 4E 72'
  - id: dos-overlap-xor-encoded-file-open
    desc: Encoded DOS read-write file open
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '54 BC 7C 52 7B 7B C2 78 47 B7 5B'

composite_rules:
  - id: dos-overlap-xor-decoded-file-interrupt-hook
    desc: Self-modifying DOS decoder hides file interrupt hook
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: dos-overlap-xor-self-modifying-decoder
      - id: dos-overlap-xor-encoded-int21-hook
      - id: dos-overlap-xor-encoded-file-open
