defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-byte-xor-cs-si-loop
    desc: DOS byte XOR in-place decoder loop
    crit: notable
    attack: T1027.013
    if:
      type: hex
      pattern: 'B9 ?? ?? 2E 8A 04 32 C4 2E 88 04 46 E2 F5'

  - id: dos-xor71-exec-intercept
    desc: XOR-encoded DOS execute intercept
    crit: notable
    if:
      type: hex
      pattern: 'ED 4C 8F 3A 05 7F 4C 71 3A 04 72 9A 78'

  - id: dos-xor71-read-write-open
    desc: XOR-encoded DOS read-write open
    crit: notable
    if:
      type: hex
      pattern: 'C5 4C C1 73 5F FA 67 3D 71 5F FF 6F 3F 71 ED 5F 8E 6F 32 71'

  - id: dos-xor71-file-write
    desc: XOR-encoded DOS file write
    crit: notable
    if:
      type: hex
      pattern: 'C9 71 31 FA 6F 25 71 C8 51 71 CB 72 71 ED'

composite_rules:
  - id: dos-xor-exec-infection
    desc: DOS XOR decoder hides execute interception and file modification
    crit: hostile
    attack: T1080
    near_bytes: 2048
    all:
      - id: dos-byte-xor-cs-si-loop
      - id: dos-xor71-exec-intercept
      - id: dos-xor71-read-write-open
      - id: dos-xor71-file-write
