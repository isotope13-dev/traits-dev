defaults:
  platforms:
    - windows
    - linux
    - unix
    - macos
  for: [binaries]
  attack: T1027.001
  mbc: B0032.001
composite_rules:
  - id: polymorphic-code-generator
    for: [elf, macho, pe]
    desc: Polymorphic code generator (PRNG + memory protection)
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/os/random/prng/lcg::lcg-prng-engine
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: objectives/evasion/fileless/memory::alloc-memory-sym
    # V8 and a Win32 import table both mention an LCG and VirtualProtect,
    # megabytes apart in an Electron image. A generator keeps them together.
    near_bytes: 1048576
    unless:
      - id: metadata/binary/symbols/count::many-imports
