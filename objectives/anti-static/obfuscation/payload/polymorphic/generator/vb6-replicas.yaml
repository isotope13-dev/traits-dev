# Reverse-engineered native VB6 pattern: read App.Path/EXEName into a byte
# array, replace one randomly selected byte, write and launch an EXE copy,
# and retire the source with a .die rename. Mutation is an indexed byte store,
# not encryption. The chosen .die suffix is not required by this detection.
# This admits replication concealment, not victim-file damage.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vb6-byte-mutating-replica-launcher
    desc: VB6 mutating replica launch and rename profile
    crit: hostile
    conf: 0.97
    attack: T1027
    all:
      - id: micro-behaviors/fs/path/self::vb6-app-executable-path-profile
      - id: micro-behaviors/fs/read/file/handle::vb6-record-file-read
      - id: micro-behaviors/fs/write/file/handle::vb6-binary-file-write
      - id: micro-behaviors/data/buffer/record::x86-helper-result-indexed-byte-store
      - id: micro-behaviors/os/random/generator::vb6-ordinal-random-next
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
      - id: micro-behaviors/fs/file/rename::utf16-cmd-rename-quoted-target
