# Polymorphic decryptor generator that seeds a 32-bit shift/XOR LFSR from DOS
# time and PIT channel 0, emits CS:-prefixed 8/16-bit XOR/SUB/ADD decryptor
# bodies with [SI]/[DI] indexing, and emits backward loop branches while
# scanning backward to fix up the decryptor start offset placeholder.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536
  attack: T1027.014

composite_rules:
  - id: dos-cs-alu-polymorphic-decryptor-engine
    desc: Polymorphic engine emits CS-prefixed decryptor
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/metaprogramming/generation/emit::dos-emit-cs-alu-decryptor-body
      - id: micro-behaviors/metaprogramming/generation/emit::dos-emit-backward-loop-branch-fixup
      - id: micro-behaviors/os/random/prng/custom::dos-pit-time-seeded-lfsr-prng
