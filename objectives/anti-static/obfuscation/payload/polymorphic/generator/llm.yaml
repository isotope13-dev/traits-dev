# Runtime-polymorphic malware can outsource variant generation to a hosted or
# local model.  Detect the invariant behavior—an evasive variant request whose
# returned source is executed—rather than a PromptFlux-like family name or a
# particular model provider.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, lua, powershell, shell]
  attack: T1027

traits:
  - id: payload-variant-marker
    desc: Payload term near variant
    crit: notable
    conf: 0.92
    if:
      type: literal
      # `version` read any API payload schema ("payload ... version") as a variant.
      # Neither word may be an object key (`{variant: o, payload: _}` flags).
      regex: '(?i)\b(payload|shellcode|malware)\b\s*[^:=\s][^\r\n]{0,32}\svariants?\b\s*[^:=\s]'

  - id: variant-generation-verb
    desc: Generation verb near the word variant
    crit: component
    conf: 0.92
    unless:
      # pip's wheel installer deliberately disables distlib's script variants;
      # this packaging comment is not evidence of polymorphic payloads.
      - id: metadata/build/pip::pip-wheel-installer-source
    if:
      type: text
      # The verb must stand alone (not `createElement`) and `variant` must be a
      # prose word: not a property (`this.variant[t]`, `{variant: n}`, `.Variant.`).
      regex: '(?i)\b(generat|creat|produc)(e|es|ed|ing)\b[^\r\n]{0,48}\svariants?\b\s*[^\s:=,)}.\[&|]'

  - id: variant-term
    desc: Variant term near payload
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bvariants?\b\s*[^:=\s][^\r\n]{0,32}\s(payload|shellcode|malware)\b\s*[^:=\s]'
    unless:
      - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
      - id: well-known/lib/format/stacksjs-stacks::stacks-monorepo-package-name
      - id: well-known/lib/format/stacksjs-stacks::stacks-database-runtime-marker
      - id: metadata/lang/scripted::dts-declaration-file

  - id: llm-obfuscation-term
    desc: Obfuscation near static evasion
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(obfuscat\w*|evasion)\b[^\r\n]{0,48}\b(static|sandbox)\b'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: llm-antivirus-evasion-target
    desc: Antivirus evasion target
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bantivirus\b.{0,80}\b(detect\w*|evasion|analysis)\b'

  - id: llm-static-analysis-target
    desc: Static detection or analysis phrase
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bstatic\b.{0,80}\b(antivirus|detection|analysis)\b'

composite_rules:
  - id: variant-payload-association
    desc: Variant term near payload
    crit: component
    conf: 0.92
    any:
      - id: variant-term
      - id: payload-variant-marker

  - id: llm-variant-generation
    desc: LLM or payload variant generation
    crit: component
    conf: 0.92
    all:
      - id: variant-generation-verb
      - id: variant-payload-association
    any:
      - id: micro-behaviors/data/llm/wire-marker::llm-term-reference
      - id: payload-variant-marker
    near_lines: 2

  - id: llm-static-detection-target
    desc: Static or sandbox detection target
    crit: component
    conf: 0.92
    any:
      - id: llm-antivirus-evasion-target
      - id: objectives/anti-analysis/sandbox-detect/keywords::sandbox-analysis-phrase
      - id: llm-static-analysis-target

  - id: llm-variant-evasion-directive
    desc: LLM variant request evades static detection
    crit: suspicious
    conf: 0.98
    all:
      - id: llm-variant-generation
      - id: llm-obfuscation-term
      - id: llm-static-detection-target
    near_bytes: 1000

  - id: llm-runtime-polymorphic-payload
    desc: Executes an evasive LLM-generated payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1059
    all:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: llm-variant-evasion-directive
      - id: micro-behaviors/process/create/eval::model-response-interpreter
    near_bytes: 3000
