defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: pe-stage-metamorphic-size-report
    desc: Reports stage sizes after metamorphosis
    crit: notable
    conf: 0.98
    if:
      type: text
      section: .rdata
      regex: 'stage[0-9] size=.{0,24}after metamorphic:'
composite_rules:
  - id: pe-infector-encrypted-metamorphic-stages
    desc: PE infector has encrypted metamorphic stages
    crit: suspicious
    conf: 0.99
    attack: T1027
    all:
      - id: objectives/impact/infect/virus::mapped-pe-infection-header-mutation
      - id: pe-stage-metamorphic-size-report
      - id: micro-behaviors/data/codec::x86-multiply-rotate-plaintext-feedback-xor
