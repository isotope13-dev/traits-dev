# Same-buffer and filename bindings survive campaign and destination changes.
# Autonomous polymorphic executable distribution meets the likely-hostile
# endpoint threshold. It does not establish infection of another executable,
# execution by the receiver, or theft of unrelated files.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: native-mutated-self-image-loop
    desc: Repeatedly writes mutated executable self-copies
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule native_mutated_self_image_loop {
          strings:
            $own = { 50 68 ?? ?? ?? ?? 53 6A 00 E8 ?? ?? ?? ?? 50 68 ?? ?? ?? ?? 53 E8 ?? ?? ?? ?? }
            $read = { A3 ?? ?? ?? ?? 53 FF 35 ?? ?? ?? ?? 6A 01 50 E8 ?? ?? ?? ?? }
            $sleep = { 83 EC 0C BB 01 00 00 00 8D 75 ?? 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? }
            $mut = { 8B 1D ?? ?? ?? ?? BE 01 00 00 00 03 1D ?? ?? ?? ?? 83 C4 10 E8 ?? ?? ?? ?? 88 44 1E FF 46 83 FE ?? 75 ?? 8D 75 ?? 51 51 68 ?? ?? ?? ?? 56 E8 ?? ?? ?? ?? 89 C3 83 C4 10 B8 01 00 00 00 85 DB 0F 84 ?? ?? ?? ?? 53 FF 35 ?? ?? ?? ?? 6A 01 FF 35 ?? ?? ?? ?? E8 ?? ?? ?? ?? }
            $repeat = { 83 EC 0C 8D 45 ?? 50 E8 ?? ?? ?? ?? 31 C0 83 C4 10 85 DB 0F 94 C0 85 C0 0F 84 ?? ?? ?? ?? 83 EC 0C 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 C4 10 E9 ?? ?? ?? ?? }
          condition:
            pe.is_pe and pe.machine == pe.MACHINE_I386 and
            all of them and
            @own < @read and @read < @sleep and @sleep < @mut and
            @mut < @repeat and
            @repeat - @own < 2048 and
            uint32(@read+1) == uint32(@mut+13) and
            uint32(@read+1) == uint32(@mut+80) and
            uint32(@read+8) == uint32(@mut+72) and
            uint8(@mut+37) == uint8(@repeat+5) and
            uint8(@mut+32) >= 2 and uint8(@mut+32) <= 64 and
            35 + int8(@mut+34) == 20 and
            @repeat+30+int32(@repeat+26) == @sleep and
            @repeat+51+int32(@repeat+47) == @sleep and
            uint16(@own+14+int32(@own+10)) == 0x25ff and
            uint32(@own+14+int32(@own+10)+2) == pe.image_base + pe.import_rva("KERNEL32.dll", "GetModuleFileNameA") and
            uint16(@own+26+int32(@own+22)) == 0x25ff and
            uint32(@own+26+int32(@own+22)+2) == pe.image_base + pe.import_rva("msvcrt.dll", "fopen") and
            uint16(@read+20+int32(@read+16)) == 0x25ff and
            uint32(@read+20+int32(@read+16)+2) == pe.image_base + pe.import_rva("msvcrt.dll", "fread") and
            uint16(@mut+25+int32(@mut+21)) == 0x25ff and
            uint32(@mut+25+int32(@mut+21)+2) == pe.image_base + pe.import_rva("msvcrt.dll", "rand") and
            uint16(@mut+51+int32(@mut+47)) == 0x25ff and
            uint32(@mut+51+int32(@mut+47)+2) == pe.image_base + pe.import_rva("msvcrt.dll", "fopen") and
            uint16(@mut+89+int32(@mut+85)) == 0x25ff and
            uint32(@mut+89+int32(@mut+85)+2) == pe.image_base + pe.import_rva("msvcrt.dll", "fwrite") and
            uint16(@repeat+12+int32(@repeat+8)) == 0x25ff and
            uint32(@repeat+12+int32(@repeat+8)+2) == pe.image_base + pe.import_rva("msvcrt.dll", "_unlink") and
            uint16(@sleep+21+int32(@sleep+17)) == 0x25ff and
            uint32(@sleep+21+int32(@sleep+17)+2) == pe.image_base + pe.import_rva("KERNEL32.dll", "Sleep")
        }

composite_rules:
  - id: self-mutating-image-submission-loop
    desc: Repeatedly mutates and submits copies of its own executable
    crit: hostile
    conf: 0.99
    all:
      - id: native-mutated-self-image-loop
      - id: micro-behaviors/communications/http/form::native-generated-file-multipart-submit
