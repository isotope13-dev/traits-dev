# Real-mode DOS mutation engines (SMM, MtE-style kits). The engine runs
# position-independent (CALL $+3 / POP BP / SUB BP,imm), seeds its PRNG from
# the BIOS tick counter at 0040:006C, and assembles a fresh decryptor by
# storing opcode bytes with MOV AL,imm / STOSB. Kit names are not matched.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536
  attack: T1027.014

composite_rules:
  - id: dos-polymorphic-decryptor-engine
    desc: DOS polymorphic decryptor engine
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/metaprogramming/generation/emit::dos-instruction-opcode-emitter
    any:
      - id: micro-behaviors/os/random/prng/custom::dos-bios-tick-counter-read
      - id: micro-behaviors/os/random/prng/custom::dos-pit-date-state-values
      - id: micro-behaviors/os/random/prng/custom::dos-pit-feedback-table-index
      - id: micro-behaviors/os/random/prng/custom::dos-pit-register-exclusion-selector

  - id: dos-self-patching-polymorphic-engine
    desc: DOS self-patching polymorphic decryptor engine
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/metaprogramming/generation/emit::dos-emit-parameterized-decryptor-loop
      - id: micro-behaviors/metaprogramming/generation/emit::dos-self-patching-cipher-loop
      - id: micro-behaviors/metaprogramming/generation/emit::dos-emit-saved-target-branch
    any:
      - id: micro-behaviors/metaprogramming/generation/emit::dos-emit-x87-escape-instruction
      - id: micro-behaviors/metaprogramming/generation/emit::dos-emit-random-alu-junk-instruction

