defaults:
  platforms: [unix, windows]
  for: [rust, binaries]

composite_rules:
  - id: embedded-rust-source-mutation
    desc: Embedded Rust source with source-morphing API
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/metaprogramming/generation::rust-include-source-text
      - id: micro-behaviors/metaprogramming/generation::rust-source-morph-api
    near_bytes: 1600
  - id: morphing-aead-file-relabeler
    desc: Morphing encryptor overwrites and renames
    crit: hostile
    conf: 0.98
    all:
      - id: embedded-rust-source-mutation
      - id: objectives/impact/ransom/encrypt/filesystem::aead-destructive-file-relabeling

