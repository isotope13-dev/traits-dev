# Expiro's overwritten entry-point model walks an encrypted buffer backwards,
# derives each plaintext byte in a stack local, stores it through base+index,
# and decrements the index. This compiled loop is independent of victim names,
# paths, and section addresses; infection verdicts require carrier geometry.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: x86-backward-stack-byte-decode-loop
  desc: x86 backward stack-indexed byte decode loop
  crit: suspicious
  conf: 0.96
  size_min: 65536
  if:
    type: hex
    section: .text
    pattern: 8B 45 F8 8B 55 F4 8A 4D FF 88 0C 02 FF 4D F8 EB ??
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
