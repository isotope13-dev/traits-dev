# Real-mode DOS mutation engines (SMM, MtE-style kits). The engine runs
# position-independent (CALL $+3 / POP BP / SUB BP,imm), seeds its PRNG from
# the BIOS tick counter at 0040:006C, and assembles a fresh decryptor by
# storing opcode bytes with MOV AL,imm / STOSB. Kit names are not matched.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1027.014

traits:
  - id: dos-delta-offset-bp
    desc: DOS delta offset via CALL/POP BP
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "E8 00 00 (5D 81 ED|5E 81 EE|5B 81 EB)"

  - id: dos-bios-tick-seed
    desc: DOS reads BIOS tick counter
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: "26 (A1 6C 00|8B 1E 6C 00|8B 16 6C 00|8B 0E 6C 00)"

  - id: dos-emit-call-opcode
    desc: Code generator emits CALL opcode
    crit: component
    if:
      type: hex
      pattern: "B0 E8 AA"

  - id: dos-emit-jmp-opcode
    desc: Code generator emits JMP opcode
    crit: component
    if:
      type: hex
      pattern: "B0 E9 AA"

  - id: dos-emit-ret-opcode
    desc: Code generator emits RET opcode
    crit: component
    if:
      type: hex
      pattern: "B0 C3 AA"

  - id: dos-emit-int-opcode
    desc: Code generator emits INT opcode
    crit: component
    if:
      type: hex
      pattern: "B0 CD AA"

composite_rules:
  - id: dos-opcode-emitter
    desc: DOS code emits branch opcodes
    crit: notable
    conf: 0.85
    any:
      - id: dos-emit-call-opcode
      - id: dos-emit-jmp-opcode
      - id: dos-emit-ret-opcode
      - id: dos-emit-int-opcode
    needs: 3

  - id: dos-polymorphic-decryptor-engine
    desc: DOS polymorphic decryptor engine
    crit: hostile
    conf: 0.92
    all:
      - id: dos-delta-offset-bp
      - id: dos-opcode-emitter
      - id: dos-bios-tick-seed
