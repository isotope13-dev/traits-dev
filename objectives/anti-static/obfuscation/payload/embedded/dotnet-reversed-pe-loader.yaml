# An unsigned managed executable that carries a byte-reversed PE image and
# references in-memory assembly loading: the stub reverses the bytes back and
# loads them without the payload ever existing on disk in recognisable form.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.013,T1140,T1620

composite_rules:
  - id: dotnet-reversed-pe-assembly-loader
    desc: Unsigned .NET loads a byte-reversed PE payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/data/encode/embedded::reversed-dos-stub-text
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
