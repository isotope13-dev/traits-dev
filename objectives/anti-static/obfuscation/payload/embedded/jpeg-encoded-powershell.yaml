defaults:
  platforms: [unix, windows]
  for: [jpeg]
  attack: T1027.003,T1059.001
traits:
  - id: jpeg-base64-utf16-powershell-output-command
    desc: JPEG embeds Base64 PowerShell output text
    crit: hostile
    conf: 0.94
    if:
      type: raw
      regex: 'VwByAGkAdABlAC0ATwB1AHQAcAB1AHQ[A-Za-z0-9+/=]{8,}'
