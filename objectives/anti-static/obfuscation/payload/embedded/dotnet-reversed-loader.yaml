defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: reversed-system-convert
    desc: Reversed System.Convert type name
    crit: component
    if:
      type: text
      substr: trevnoC.metsyS
  - id: reversed-from-base64-string
    desc: Reversed FromBase64String method name
    crit: component
    if:
      type: text
      substr: gnirtS46esaBmorF
  - id: repeated-cjk-copy-token
    desc: Repeated CJK copy characters
    crit: component
    if:
      type: text
      regex: '[复制]{6,}'

composite_rules:
  - id: reversed-base64-resource-loader
    desc: Reversed Base64 API with resource loader
    crit: hostile
    conf: 0.97
    attack: T1027,T1620
    all:
      - id: reversed-system-convert
      - id: reversed-from-base64-string
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::dotnet-appdomain-load-instance-tokens
      - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token

  - id: repeated-cjk-resource-assembly-loader
    desc: Repeated CJK token in resource assembly loader
    crit: hostile
    conf: 0.97
    attack: T1027,T1620
    all:
      - id: repeated-cjk-copy-token
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-lateget-token
