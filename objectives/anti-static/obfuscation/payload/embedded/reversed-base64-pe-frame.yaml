# The ending is the reverse of the Base64-encoded MZ/DOS header followed by
# the closing delimiter. This reports a framed PE, not its purpose or execution.
defaults:
  platforms: [windows, unix]
  for: [javascript, bmp, data]
traits:
  - id: reversed-base64-pe-frame
    desc: Framed reversed Base64 PE payload
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule framed_reversed_base64_pe {
          strings:
            $begin = "INICIO="
            $end = "AAAAEAAAAMAAQqVTFIM"
          condition:
            $begin and $end and @begin < 4096 and @end + !end == filesize
        }
