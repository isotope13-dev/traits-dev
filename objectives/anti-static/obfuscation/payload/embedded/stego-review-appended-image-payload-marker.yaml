defaults:
  platforms: [unix, windows]
  for: [media, scripts]

composite_rules:
- id: appended-image-payload-marker
  for:
    - jpeg
  desc: Image with appended payload markers
  crit: suspicious
  conf: 0.96
  all:
    - id: metadata/image/trailing::marker-after-image-eof
  any:
    - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
    - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
    - id: objectives/execution/staging/acquire::cloud-storage-reversed-pe-header-clues
