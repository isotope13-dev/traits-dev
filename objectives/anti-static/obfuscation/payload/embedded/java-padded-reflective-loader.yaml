defaults:
  for: [class, java_class]
  platforms: [windows, unix]
  attack: T1027,T1140

traits:
  - id: java-large-class-file
    desc: Large JVM class file
    crit: component
    if:
      type: metrics
      field: file.size
      min: 100000
  - id: java-low-class-entropy
    desc: Low JVM class entropy
    crit: component
    if:
      type: metrics
      field: file.entropy
      max: 4.1
  - id: java-large-constant-pool
    desc: Large JVM constant pool
    crit: component
    if:
      type: metrics
      field: class.constant_pool_count
      min: 1000
  - id: java-few-class-functions
    desc: JVM class has few functions
    crit: component
    if:
      type: metrics
      field: functions.count
      max: 10

composite_rules:
  - id: java-padded-obfuscated-resource-loader
    desc: Padded obfuscated JVM resource class loader
    crit: hostile
    conf: 0.95
    all:
      - id: java-large-class-file
      - id: java-low-class-entropy
      - id: java-large-constant-pool
      - id: java-few-class-functions
      - id: metadata/lang/encoding/shape/character::jvm-control-bearing-constant
      - id: micro-behaviors/process/interpreter/runtime/jvm::classloader-definition-resource-references
      - id: micro-behaviors/metaprogramming/reflection/invoke::java-method-invoke-bytecode
