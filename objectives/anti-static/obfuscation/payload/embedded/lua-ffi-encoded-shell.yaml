defaults:
  for: [lua]
  platforms: [windows]
  attack: T1027,T1059.001

traits:
  - id: lua-ffi-shell-execute-symbol
    desc: Lua FFI references ShellExecuteA
    crit: notable
    if:
      type: text
      substr: ShellExecuteA
  - id: lua-ffi-getprocaddress-symbol
    desc: Lua FFI references GetProcAddress
    crit: notable
    if:
      type: text
      substr: GetProcAddress
  - id: lua-init-hook-assignment
    desc: Lua registers an initialization callback
    crit: notable
    if:
      type: text
      regex: '\.onInit\s*=\s*[A-Za-z_]\w*'

composite_rules:
  - id: lua-ffi-encoded-powershell-init
    desc: Lua initialization invokes encoded PowerShell via FFI
    crit: hostile
    conf: 0.98
    all:
      - id: lua-ffi-shell-execute-symbol
      - id: lua-ffi-getprocaddress-symbol
      - id: lua-init-hook-assignment
      - id: metadata/import/lua/ffi::ffi
      - id: metadata/lang/source/syntax/command/launch::encoded-command-line
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
