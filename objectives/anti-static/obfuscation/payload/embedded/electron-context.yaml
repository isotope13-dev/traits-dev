# Electron payload extraction and updater context. The output path and process
# call are correlated only by proximity, so no staged-file handoff is asserted.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: encrypted-executable-payload-extraction
    desc: AES encrypted executable extraction
    crit: hostile
    conf: 0.99
    mbc: B0032
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: metadata/lang/source/naming/function/cryptography::decrypt-payload-function-name
      - id: metadata/lang/source/naming/function/transform::payload-extraction-function
      - id: micro-behaviors/fs/path/executable::executable-output-process-correlation
    scope: file
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: obfuscated-electron-update-loader
    desc: Obfuscated Electron update execution
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007,T1027
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-computed-child-process-binding
      - id: micro-behaviors/data/archive/extract/asar::computed-asar-method-call
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/communications/http/request/client::axios-direct-call
      - id: micro-behaviors/process/terminate/command::js-taskkill-force-command
    scope: file
    unless:
      - id: metadata/path/directory::test-directory-component
