defaults:
  platforms: [windows, unix]
  for: [svg, xml, html]
  attack: T1027.006,T1036.007,T1204.002
traits:
  - id: svg-hidden-autodownload-disguised-archive
    desc: SVG silently downloads document-disguised ZIP
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule svg_hidden_autodownload_disguised_archive {
          strings:
            $svg = "<svg" nocase
            $activation = "DOMContentLoaded"
            $encoded_zip = /["']UEsDB[A-Za-z0-9+\/=]{80}/
            $decode = "atob("
            $blob = "new Blob("
            $hide = /display:\s*none/ nocase
            $name = /\.(pdf|docx?|xlsx?|pptx?)[ \t]{4,128}\.zip/ nocase
            $download = /(\.download|\[["']download["']\])\s*=/
            $click = /(\.click|\[["']click["']\])\(\)/
          condition:
            all of them
        }
