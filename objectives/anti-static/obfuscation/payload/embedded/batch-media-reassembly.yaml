defaults:
  for: [batch]
  platforms: [windows]
  attack: T1027,T1027.009

composite_rules:
  - id: obfuscated-batch-media-executable-reassembly
    desc: Disguised obfuscated batch reconstructs executable
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::batch-long-random-envvar-reassembly
      - id: metadata/lang/source/naming/population::high-entropy-identifier-ratio
      - id: metadata/file/extension/mismatch::batch-content-extension-mismatch
      - id: micro-behaviors/fs/write/file/redirect::batch-set-prompt-mz-redirect
      - id: micro-behaviors/fs/write/file/redirect::batch-append-redirect
