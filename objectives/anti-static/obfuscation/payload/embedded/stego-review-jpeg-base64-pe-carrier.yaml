defaults:
  platforms: [unix, windows]
  for: [media, scripts]

composite_rules:
- id: jpeg-base64-pe-carrier
  for:
    - jpeg
  desc: JPEG carrier with Base64 PE
  crit: hostile
  conf: 0.96
  all:
    - id: metadata/file/format/media::media-container-recognized
  any:
    - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
    - id: micro-behaviors/data/encode/embedded::image-raw-base64-pe-header
    - id: metadata/file/encoding/shape::base64-pe-header-text
  needs: 1
