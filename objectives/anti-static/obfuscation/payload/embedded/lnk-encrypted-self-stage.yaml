defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1027,T1059.001

traits:
  - id: lnk-encrypted-file-slice-execution
    desc: Shortcut decrypts file slices and executes them
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule lnk_encrypted_file_slice_execution {
          strings:
            $read = "OpenRead" wide ascii nocase
            $seek = "SeekOrigin" wide ascii nocase
            $decrypt = "CreateDecryptor" wide ascii nocase
            $block = "TransformFinalBlock" wide ascii nocase
            $write = "WriteAllBytes" wide ascii nocase
            $script = "[scriptblock]::Create" wide ascii nocase
          condition:
            filesize > 10KB and all of them
        }
