defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027.003,T1620

composite_rules:
  - id: pixel-assembly-property-loader
    desc: Bitmap pixel access and reflective loader
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-pixel-rgb-resource-api-profile
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::get-assembly-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: metadata/binary/code/entropy::high-code-entropy
