defaults:
  for: [javascript, package.json]
  platforms: [windows, unix]
  attack: T1027

traits:
  - id: electron-cookie-session-flag
    desc: Electron configuration names cookie sessions
    for: [package.json]
    crit: notable
    if:
      type: text
      substr: '"cookieSessions"'
  - id: electron-injection-notify-flag
    desc: Electron config names injection notifications
    for: [package.json]
    crit: notable
    if:
      type: text
      substr: '"InjectionNotify"'
  - id: electron-screenshot-package
    desc: Electron manifest references screenshot capture
    for: [package.json]
    crit: notable
    if:
      type: text
      substr: '"screenshot-desktop"'
  - id: javascript-very-large-string
    desc: JavaScript contains very large string
    for: [javascript]
    crit: component
    if:
      type: metrics
      field: strings.max_length
      min: 500000
  - id: javascript-extreme-line-length
    desc: JavaScript has an extremely long line
    for: [javascript]
    crit: component
    if:
      type: metrics
      field: text.max_line_length
      min: 1000000

composite_rules:
  - id: javascript-large-base91-encoded-program
    desc: Large encoded JavaScript uses base91 decoding
    for: [javascript]
    crit: notable
    conf: 0.95
    all:
      - id: javascript-very-large-string
      - id: javascript-extreme-line-length
      - id: micro-behaviors/data/decode/base91::base91-magic-constants--rx-1
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-call-cluster

  - id: electron-obfuscated-session-capture
    desc: Obfuscated Electron app configures session capture
    for: [asar, zip, pe, javascript, package.json]
    scope: archive
    crit: hostile
    conf: 0.96
    all:
      - id: javascript-large-base91-encoded-program
      - id: electron-cookie-session-flag
      - id: electron-injection-notify-flag
      - id: electron-screenshot-package
