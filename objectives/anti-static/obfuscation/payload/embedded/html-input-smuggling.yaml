defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: obfuscated-passworded-file-preview-smuggling
    desc: Obfuscated failed-preview lure assembles hidden file data
    crit: hostile
    conf: 0.97
    attack: T1027.006,T1566.001
    all:
      - id: micro-behaviors/ui/window/markup::large-hidden-base64-input-values
      - id: micro-behaviors/ui/window/markup::displayed-document-password
      - id: micro-behaviors/ui/dialog/prompt::preview-unavailable-wording
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/data/buffer/alloc::blob-construction
      - id: micro-behaviors/data/decode/base64::js-atob-call-or-callback
      - id: micro-behaviors/ui/window/click::dom-computed-click-call
  - id: obfuscated-html-input-blob-smuggling
    desc: Obfuscated script decodes hidden HTML input data into a Blob
    crit: hostile
    conf: 0.98
    attack: T1027.006
    unless:
      - id: obfuscated-passworded-file-preview-smuggling
    all:
      - id: micro-behaviors/ui/window/markup::large-hidden-base64-input-values
      - id: micro-behaviors/data/decode/base64::js-atob-call-or-callback
      - id: micro-behaviors/data/buffer/alloc::blob-construction
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
