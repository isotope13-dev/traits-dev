defaults:
  for: [lnk]
  platforms: [windows]
  attack: T1027,T1059.001

traits:
  - id: lnk-archive-byte-read
    desc: Shortcut reads bytes from an archive file
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\.zip.{0,100}OpenRead\s*\('
  - id: lnk-four-byte-marker-search
    desc: Shortcut searches for repeated byte marker
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)0x47.{0,100}0x47.{0,100}0x47.{0,100}0x47'
  - id: lnk-fragmented-writeallbytes
    desc: Shortcut constructs WriteAllBytes method name
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)["'']write["'']\s*\+\s*["'']allb["'']\s*\+\s*["'']ytes["'']'
  - id: lnk-powershell-temp-msi-invocation
    desc: Shortcut invokes a temporary MSI via PowerShell
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)powershell\s+\$Env:temp\\[^\s;"'']{1,80}\.msi'

composite_rules:
  - id: lnk-archive-marker-extract-execute
    desc: Shortcut extracts hidden archive bytes and executes
    crit: hostile
    conf: 0.99
    all:
      - id: lnk-archive-byte-read
      - id: lnk-four-byte-marker-search
      - id: lnk-fragmented-writeallbytes
      - id: lnk-powershell-temp-msi-invocation
      - id: micro-behaviors/process/config/target::lnk-powershell-family
