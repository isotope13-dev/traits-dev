defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027.009

composite_rules:
  - id: repeated-pe-images-in-high-entropy-overlay
    desc: Repeated PE images in a large high-entropy overlay
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/layout::repeated-legacy-pe-images
      - id: metadata/binary/layout::large-overlay-1mb
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay-raw
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/
      - id: metadata/signed/platform/
