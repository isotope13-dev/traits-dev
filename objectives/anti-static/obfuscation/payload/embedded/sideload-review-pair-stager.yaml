defaults:
  platforms: [windows]
  for: [batch, powershell, shell, scripts]
  attack: T1574.002,T1105


composite_rules:
  - id: batch-pem-blob-appdata-staging
    desc: Batch PEM blob, AppData and deletion clues
    crit: hostile
    conf: 0.96
    for: [batch]
    attack: T1105,T1027
    all:
      - id: micro-behaviors/crypto/certificate/usage::pem-begin
      - id: micro-behaviors/crypto/certificate/usage::pem-end
      - id: metadata/file/text-distribution::large-batch-low-whitespace-ratio
      - id: micro-behaviors/fs/path/app-data/platform::localappdata-env-var-reference
      - id: micro-behaviors/fs/delete/file/command::batch-del-force-quiet-switch
