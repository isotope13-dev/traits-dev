defaults:
  for: [ne]
  platforms: [windows]
  attack: T1027,T1565.001,T1070.006

traits:
  - id: dos-obfuscated-file-infection-operations
    desc: Obfuscated DOS code infects executables
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_obfuscated_file_infection_operations {
          strings:
            $find = { B4 4E 8D 94 ?? ?? 9C FA FF 9C ?? ?? }
            $open = { B0 3D D4 01 B0 02 8D 94 ?? ?? 9C FA FF 9C ?? ?? }
            $mz = { 81 BC ?? ?? 4D 5A 74 ?? E9 ?? ?? }
            $write = { B0 40 D4 01 B9 ?? ?? 8D 94 ?? ?? 9C FA FF 9C ?? ?? }
            $time = { B0 57 D4 01 B0 01 8B 8C ?? ?? 8B 94 ?? ?? 9C FA FF 9C ?? ?? }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
