defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027.003,T1620

composite_rules:
  - id: obfuscated-pixel-resource-loader
    desc: Obfuscated pixel-resource dynamic loader
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-pixel-rgb-resource-api-profile
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::resource-reverse-base64-reflection-references
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe

  - id: pixel-reflective-assembly-instantiation
    desc: Pixel resource with reflective assembly instantiation
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: metadata/binary/symbols/name/token/runtime::dotnet-get-b-member-name
      - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k

  - id: pixel-delegate-assembly-loader
    desc: Pixel resource with delegate assembly loader
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::managed-load-method-delegate-references
      - id: micro-behaviors/metaprogramming/reflection/resolve::resolver-token-pair
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-unsigned-filename-mismatch
