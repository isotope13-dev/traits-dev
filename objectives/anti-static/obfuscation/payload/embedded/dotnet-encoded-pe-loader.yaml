defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027,T1620

composite_rules:
  - id: fabricated-identity-reflective-resource-loader
    desc: Scrambled managed identity and reflective resource loader
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/provenance/version-info::unsigned-dotnet-punctuation-quad-version-profile
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-appdomain-lateget-references
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::dotnet-appdomain-load-instance-tokens
      - id: metadata/signature/absent::unsigned-missing-signature-record

  - id: reversed-name-base64-managed-resource-loader
    desc: Obfuscated names and Base64 resource assembly loader
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/symbols/name/token/runtime::reverse-name-token
      - id: metadata/binary/symbols/name/token/runtime::reversed-gettype-token
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-lateget-token
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: metadata/signature/absent::unsigned-missing-signature-record

  - id: hex-pe-obfuscated-managed-loader
    desc: Obfuscated managed loader carries hex PE data
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/encoding/hex::hex-pe-dos-stub
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-dotnet-diagnostics
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: metadata/signature/absent::unsigned-missing-signature-record

  - id: base64-pe-resource-managed-loader
    desc: Managed resource loader carries Base64 PE data
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/encoding/shape::base64-pe-dos-stub-text
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
      - id: metadata/signature/absent::unsigned-missing-signature-record
