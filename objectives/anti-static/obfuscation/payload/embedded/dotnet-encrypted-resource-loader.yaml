defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: encrypted-base64-resource-assembly-loader
    desc: Encrypted Base64 resource assembly loader
    crit: hostile
    conf: 0.97
    attack: T1027,T1620
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-from-base64-char-array
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-rijndael-decryptor
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe
