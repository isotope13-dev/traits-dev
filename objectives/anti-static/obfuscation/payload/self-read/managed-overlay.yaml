defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: hostile
  mbc: B0009.014

composite_rules:
  - id: dotnet-hmac-self-overlay-reflective-loader
    desc: HMAC-bearing self-overlay reflective loader
    conf: 0.99
    attack: T1027.009,T1140,T1620
    all:
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: micro-behaviors/fs/read/file/handle::dotnet-module-file-read
      - id: micro-behaviors/crypto/hash/hmac::dotnet-hmacsha256
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::dotnet-entrypoint-launch-members
      - id: micro-behaviors/metaprogramming/reflection/invoke::managed-methodbase-invoke-call
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
  - id: dotnet-self-overlay-native-shellcode-loader
    desc: Managed binary reads high-entropy overlay and executes native memory
    conf: 0.98
    attack: T1027.009,T1620
    for: [pe]
    all:
      - id: metadata/binary/layout/entropy::overlay-entropy-over-7
      - id: micro-behaviors/fs/read/file/handle::dotnet-executing-assembly-call
      - id: micro-behaviors/fs/read/file/handle::dotnet-executing-assembly-location-call
      - id: micro-behaviors/fs/read/file/content/whole::cil-file-readallbytes-call
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-symbol-or-name
      - id: micro-behaviors/mem/protect/modify/api-reference::memory-protection-api-references
      - id: micro-behaviors/process/thread/create::create-thread-symbol-or-name
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
