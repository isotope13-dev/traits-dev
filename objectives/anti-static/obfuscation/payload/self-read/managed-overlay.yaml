defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-hmac-self-overlay-reflective-loader
    desc: HMAC-bearing self-overlay reflective loader
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1140,T1620
    mbc: B0009.014
    all:
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: micro-behaviors/fs/read/file/handle::dotnet-module-file-read
      - id: micro-behaviors/crypto/hash/hmac::dotnet-hmacsha256
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::dotnet-entrypoint-launch-members
      - id: micro-behaviors/metaprogramming/reflection/invoke::managed-methodbase-invoke-call
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
