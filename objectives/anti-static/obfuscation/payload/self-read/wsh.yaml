defaults:
  platforms: [windows]

composite_rules:
- id: wsh-self-read-hidden-run-profile
  for: [javascript]
  desc: WSH self-read, file write and hidden run
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/profile/com-progid::wscript-shell-split-progid
  - id: metadata/file/profile/com-progid::filesystemobject-split-progid
  - id: micro-behaviors/os/com/instantiation::wscript-createobject-text-call
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
  - id: micro-behaviors/fs/read/file/handle::open-text-file-read
  - id: micro-behaviors/fs/write/content::fso-open-text-file-write
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
