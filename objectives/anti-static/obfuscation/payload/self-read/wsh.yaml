defaults:
  platforms: [windows]

composite_rules:
  - id: wsh-self-read-hidden-run-profile
    for: [javascript]
    desc: WSH self-read, file write and hidden run
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-split-progid
      - id: micro-behaviors/os/com/automation::filesystemobject-split-progid
      - id: micro-behaviors/process/interpreter/jscript::createobject-call
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/fs/read/file/handle::open-text-file-read
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
