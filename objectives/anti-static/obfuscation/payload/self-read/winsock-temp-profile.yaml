# Self-reading with copy/write operations is supported; the matcher does not
# identify copied output as an executed payload.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pe-self-read-copy-write-profile
    desc: PE self-read with copy and write clues
    crit: suspicious
    conf: 0.94
    size_max: 32768
    all:
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: micro-behaviors/data/embedded/payload/compression::gzip-magic
      - id: metadata/lang/compiled::pb-source-path-desktop
      - id: objectives/evasion/masquerade/version-resource/claim::placeholder-assembly-identity
      - id: metadata/binary/resource/size::minimal-resources
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: pe-desktop-pb-self-read-copy-profile
    desc: Desktop PB self-read, copy and identity clues
    crit: suspicious
    conf: 0.97
    size_max: 131072
    all:
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: metadata/lang/compiled::pb-source-path-desktop
      - id: objectives/evasion/masquerade/version-resource/claim::placeholder-assembly-identity
    any:
      - id: micro-behaviors/data/embedded/payload/compression::gzip-magic
      - id: metadata/binary/resource/size::minimal-resources
      - id: metadata/binary/symbols/count::imported-functions-under-40
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: pe-self-read-winsock-debugger-profile
    desc: PE self-read with Winsock and debug checks
    crit: suspicious
    conf: 0.97
    size_max: 262144
    all:
      - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop
      - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present
    any:
      - id: metadata/binary/layout/overlay::overlay-dominates-third
      - id: objectives/anti-analysis/debugger-detect/check::seh-pointer-probe-anti-debug
      - id: objectives/anti-analysis/timing/evasion::high-res-timing
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
