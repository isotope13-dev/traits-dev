defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009

composite_rules:
  - id: rustdesk-flutter-self-read-profile
    desc: Flutter PE self-read and high-entropy resource
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/framework::flutter-windows-desktop-runner
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-import-chain
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
    any:
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x64
      - id: metadata/binary/instruction::iat-call-then-eax-compare
    downgrade:
      any:
        - id: metadata/signed/platform/

  - id: rustdesk-flutter-api-resolution-profile
    desc: Flutter self-read with both API-resolution clues
    crit: suspicious
    conf: 0.99
    all:
      - id: rustdesk-flutter-self-read-profile
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x64
      - id: metadata/binary/instruction::iat-call-then-eax-compare
    downgrade:
      any:
        - id: metadata/signed/platform/
