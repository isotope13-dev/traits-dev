# PE Self-Reading Overlay Extraction
# Detects binaries that open and read themselves to extract appended payload data
# ATT&CK: T1027.009 (Embedded Payloads)
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1027.009"
  mbc: "B0032"
traits:
- id: vmware-tools-marker
  desc: VMware Tools marker
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: VMware Tools
composite_rules:
# Benign-context umbrella: signed/installer/packed distributions that
# legitimately self-read their own image. Referenced as a single unless: leg.
- id: self-read-recognized-distribution-marker
  desc: Recognized signed or installer binary
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: metadata/binary/debug::msqry32-pdb-basename
  - id: metadata/signed/platform::microsoft
  - id: vmware-tools-marker
  - id: metadata/signed/leaf::python-software-foundation
  - id: metadata/binary/installer/sfx::7zip-sfx-archive-profile
  - id: metadata/binary/installer/family::known-benign-installer
  - id: well-known/lib/runtime/compiled/protection/vmware-thinapp::thinapp-packed-runtime
  - id: well-known/app/utility/fastfetch::fastfetch-windows-component
  - id: well-known/lib/native/vulkan::loader-dll
- id: self-read-substitution-decoded-manual-loader
  desc: Self-reading PE maps substitution-decoded bytes
  crit: hostile
  conf: 0.995
  attack: T1027.009,T1620
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: micro-behaviors/data/encode/custom::x86-indexed-substitution-byte-decoder
  - id: micro-behaviors/mem/combined::x86-pe-validation-allocation-export-api-set
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
- id: self-validating-temp-pe-republisher
  desc: Self-validates PE before temporary execution handoff
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-wide-module-path-file-io-imports
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  - id: micro-behaviors/fs/temp/directory::get-temp-path-name
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/create/shellexec::shell-execute
  unless:
  - id: metadata/binary/installer/
  - id: metadata/signed/platform/
- id: versioned-service-binary
  desc: Versioned service installation markers
  crit: baseline
  conf: 0.75
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  any:
  - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
- id: self-read-executable-thread-payload
  desc: Self-read PE payload made executable and threaded
  # Downgraded from hostile: this describes a *packaging* shape — a PE that
  # reads its own overlay, stages it with loader APIs and checks for a
  # debugger — which is what self-extracting installers, .NET bundles,
  # NativeAOT, Electron and Flutter all do. The carve-out list was growing one
  # vendor at a time, which is the tell. Malice has to come from what the
  # staged payload does, so this reports for review rather than blocking.
  crit: suspicious
  conf: 0.98
  attack: T1027.009,T1055,T1620
  all:
  # The import-only chain also occurs in ordinary native libraries: static
  # MSVC runtime helpers inspect their own loaded image, while unrelated code
  # in the same DLL may use file I/O, VirtualProtect, and worker threads.  A
  # material appended overlay is the evidence that makes this a self-reader.
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-signature-check
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  - id: micro-behaviors/process/create/thread::create-thread
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: metadata/lang/compiler/aot/
  - id: well-known/lib/runtime/native-platform/rocm/
  - id: well-known/lib/development/llvm/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app/productivity/winmerge::winmerge-signed-main-binary
  - id: well-known/app/utility/hxd::hxd-editor-context
- id: self-read-overlay-apc-loader
  desc: Unsigned PE self-reads an overlay with APC and executable-memory staging
  # Downgraded from hostile: this describes a *packaging* shape — a PE that
  # reads its own overlay, stages it with loader APIs and checks for a
  # debugger — which is what self-extracting installers, .NET bundles,
  # NativeAOT, Electron and Flutter all do. The carve-out list was growing one
  # vendor at a time, which is the tell. Malice has to come from what the
  # staged payload does, so this reports for review rather than blocking.
  crit: suspicious
  conf: 0.98
  attack: T1027.009,T1055.004,T1620
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  - id: micro-behaviors/process/create/thread::create-thread
  - id: micro-behaviors/os/callback/apc::queue-user-apc
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  # The .NET single-file apphost is an unsigned PE that reads its own appended
  # bundle overlay and stages it with the CoreCLR loader's VirtualProtect/APC
  # machinery -- the same chain, with no payload concealment.
  - id: metadata/binary/framework/
  - id: metadata/lang/compiler/aot/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
  - id: well-known/app/productivity/winmerge::winmerge-signed-main-binary
- id: self-read-executable-thread-anti-debug
  desc: Self-read executable payload with anti-debug gate
  # Downgraded from hostile: this describes a *packaging* shape — a PE that
  # reads its own overlay, stages it with loader APIs and checks for a
  # debugger — which is what self-extracting installers, .NET bundles,
  # NativeAOT, Electron and Flutter all do. The carve-out list was growing one
  # vendor at a time, which is the tell. Malice has to come from what the
  # staged payload does, so this reports for review rather than blocking.
  crit: suspicious
  conf: 0.99
  attack: T1027.009,T1620,T1622
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-signature-check
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  - id: micro-behaviors/process/create/thread::create-thread
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: metadata/lang/compiler/aot/
  - id: well-known/lib/runtime/native-platform/rocm/
  - id: well-known/lib/development/llvm/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/app/productivity/winmerge::winmerge-signed-main-binary
  - id: well-known/app/utility/hxd::hxd-editor-context
- id: unsigned-xor-overlay-self-extractor
  desc: Unsigned PE self-extracts an XOR-obfuscated overlay payload
  crit: hostile
  conf: 0.98
  attack: T1027.002,T1027.009,T1620
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/data/decode/xor::x64-byte-xor-decode-loop
  - id: micro-behaviors/crypto/symmetric/xor/loop::x86-indexed-two-buffer-xor-loop
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/
  # A parasitic infector may retain the host's normal self-read imports while
  # its injected decoder reads encrypted bytes from a mapped code section.
  - id: objectives/impact/infect/binary/rewrite::parasitic-text-loader-overlay-host
