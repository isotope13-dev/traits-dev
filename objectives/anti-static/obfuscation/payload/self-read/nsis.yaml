defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nsis-self-read-with-process-api
  desc: NSIS self-extraction with process API
  crit: suspicious
  conf: 0.96
  attack: T1027.009
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
  any:
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
