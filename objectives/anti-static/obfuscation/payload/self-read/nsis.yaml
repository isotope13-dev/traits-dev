defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nsis-self-read-with-process-api
    desc: NSIS self-extraction with process API
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/binary/symbols/name/export::system-dll-plugin-export-profile
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
    any:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
    needs: 1
    unless:
      - id: metadata/installer/product/
