defaults:
  platforms:
  - windows
  for:
  - csharp
  attack: T1027.009
  mbc: B0032
  crit: suspicious
traits:
- id: self-read-executable
  desc: Reads current executable source path
  conf: 0.9
  if:
    type: text
    substr: File.ReadAllText(Application.ExecutablePath)
- id: self-read-split
  desc: Splits self-read content for payload
  conf: 0.9
  if:
    type: text
    substr: Strings.Split(File.ReadAllText(Application.ExecutablePath)
composite_rules:
- id: self-read-appended-payload
  desc: Self-read appended payload extraction
  conf: 0.95
  all:
  - id: self-read-executable
  - id: self-read-split
  any:
  - id: metadata/lang/source/declaration::csharp-long-alphanumeric-string-constant
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
