defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: winsock-self-read-temp-process-profile
  desc: Winsock, self-read and TEMP process clues
  crit: suspicious
  conf: 0.95
  size_max: 262144
  all:
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop
  - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
  - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
