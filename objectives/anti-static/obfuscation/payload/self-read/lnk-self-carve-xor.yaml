# Shortcuts that carry their payload appended after the link structure:
# the command finds its own .lnk by exact size, seeks to fixed offsets and
# XOR-decodes the carved bytes. Nothing in the file reads as an executable
# until the shortcut runs. (Kimsuky and similar, 2023+.)
defaults:
  platforms: [windows]
  for: [lnk]
  crit: hostile
  attack: T1027.009,T1204.002

composite_rules:
  - id: lnk-carves-xor-payload-from-itself
    desc: Shortcut finds itself by size and XOR-decodes bytes carved from its own body
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/seek::lnk-find-self-by-exact-length
      - id: micro-behaviors/fs/file/seek::lnk-stream-seek
      - id: micro-behaviors/fs/file/seek::lnk-xor-byte-loop
