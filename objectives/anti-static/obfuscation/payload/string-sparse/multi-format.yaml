defaults:
  crit: suspicious
  for: [binaries]
  platforms:
    - windows
    - linux
    - macos
  attack: T1027
  mbc: F0001
traits:
  - id: high-entropy-data-macos
    desc: High entropy in __DATA section
    conf: 0.85
    for:
      - macho
    entropy_min: 6.5
    if:
      type: section
      exact: __DATA.__data
composite_rules:
  - id: obfuscated-payload-storage
    desc: Obfuscated payload in data section
    conf: 0.9
    for:
      - macho
    all:
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
      - id: metadata/binary/section/ratio::large-data-section-ratio
  - id: string-obfuscated-malware
    desc: String-obfuscated malware with shell
    conf: 0.95
    for:
      - macho
    all:
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
      - id: high-entropy-data-macos
      - id: micro-behaviors/process/create/shell/
  - id: stripped-static-elf-obfuscation
    desc: Stripped static ELF string concealment
    conf: 0.9
    for:
      - elf
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::very-low-strings
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
    any:
      - id: metadata/arch/iot::exotic-arch
      - id: metadata/binary/code/complexity::high-code-to-data-ratio
