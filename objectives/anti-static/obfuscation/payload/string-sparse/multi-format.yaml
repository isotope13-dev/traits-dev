defaults:
  for: [binaries]
  platforms:
    - windows
    - linux
    - macos
  attack: T1027
  mbc: F0001
traits:
  - id: high-entropy-data-macos
    desc: High entropy in __DATA section
    crit: suspicious
    conf: 0.85
    for:
      - macho
    entropy_min: 6.5
    if:
      type: section
      exact: __DATA.__data
composite_rules:
  - id: sparse-macos-system-loader
    desc: Sparse Mach-O invokes a system command
    crit: suspicious
    conf: 0.97
    for: [macho]
    all:
      - id: metadata/binary/section/prose::tiny-cstring-section
      - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: obfuscated-payload-storage
    desc: Obfuscated payload in data section
    crit: suspicious
    conf: 0.9
    for:
      - macho
    all:
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
      - id: metadata/binary/section/ratio::large-data-section-ratio
  - id: string-obfuscated-malware
    desc: String-obfuscated malware with shell
    crit: suspicious
    conf: 0.95
    for:
      - macho
    all:
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
      - id: high-entropy-data-macos
      - id: micro-behaviors/process/create/shell/
  - id: stripped-static-elf-obfuscation
    desc: Stripped static ELF string concealment
    crit: suspicious
    conf: 0.9
    for:
      - elf
    all:
      - id: objectives/anti-static/obfuscation/imports::very-low-strings
      - id: metadata/binary/header/identity::binary-format-checked
      - id: metadata/binary/linking/static::static-linked-heuristic
    any:
      - id: metadata/arch/iot::exotic-arch
      - id: metadata/binary/code/complexity::high-code-to-data-ratio
