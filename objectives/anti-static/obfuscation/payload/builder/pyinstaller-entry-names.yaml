defaults:
  platforms: [unix, windows]
  for: [elf, pe]
  attack: T1027.002
traits:
  # PyInstaller keeps its table of contents uncompressed. A script entry
  # (type byte `s`) directly precedes its NUL-terminated name, so the entry
  # script's name is readable even when the frozen code is compressed.
  - id: pyinstaller-attack-named-entry-script
    desc: PyInstaller entry script has attack name
    crit: suspicious
    conf: 0.9
    if:
      type: yara
      source: |
        rule pyinstaller_attack_named_entry {
          strings:
            $entry = /s\.?(implant|beacon|stager|keylogger|stealer|backdoor|botnet|dropper|ransomware|miner|cryptojack)(_\w{1,20}|\.py)?\x00/
          condition:
            $entry
        }
composite_rules:
  - id: pyinstaller-attack-named-entry-frozen
    desc: Frozen Python app whose entry script is attack-named
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/anti-static/obfuscation/payload/builder::pyinstaller-attack-named-entry-script
      - id: metadata/build/bundler/runtime::pyinstaller-spyiboot
