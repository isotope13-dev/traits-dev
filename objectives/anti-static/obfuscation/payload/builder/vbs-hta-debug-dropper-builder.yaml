defaults:
  platforms: [windows]
  for: [vbs, asp, html]

composite_rules:
  # Distinguishes covert HTA dropper builders from dual-use exe2bat/exe2debug
  # converters by requiring dynamic DOS debug.exe script generation together
  # with hidden WSH execution and HTA MIME or hidden-window delivery.
  - id: vbs-hta-debug-dropper-builder
    desc: Builder wraps binary in HTA debug.exe dropper
    crit: hostile
    conf: 0.98
    attack: T1587.001,T1027,T1059.005,T1218.005
    mbc: B0007
    all:
      - id: micro-behaviors/metaprogramming/generation/source::vbs-debug-hex-script-generator
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: metadata/lang/source/syntax/command/pipeline::any-debug-stdin-redirect
      - id: micro-behaviors/process/create/hidden::run-window-style-clues
    any:
      - id: micro-behaviors/communications/http/header/content-type::any-application-hta-content-type
      - id: micro-behaviors/ui/window/control::any-hta-concealed-window
