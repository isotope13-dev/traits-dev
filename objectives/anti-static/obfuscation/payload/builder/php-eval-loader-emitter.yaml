# Concealed PHP payload builder: assembles identifiers from split string
# fragments, builds an eval loader while concealing its spelling or hiding
# the payload behind an output-switch prefix, and writes the packed result
# to a file (b374k's packer emits `$func="cr"."eat"."e_fun"."cti"."on"`
# loaders that eval base64/gz-decoded payloads, then saves the result as a
# new PHP file). Each primitive alone is ordinary tooling; requiring
# split-string assembly together with loader construction and an encoded,
# compressed or chunk-concealed payload expresses the concealed-payload
# construction intent.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1587.001, T1027.002

traits:
  - id: split-eval-spelling
    desc: Hides eval keyword in string fragments
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '[''"]ev['']\s*\.\s*[''"]al[''"]|[''"]e['']\s*\.\s*[''"]val[''"]'

composite_rules:
  - id: php-eval-loader-evidence
    desc: Split or prefixed eval loader construction
    crit: suspicious
    conf: 0.95
    any:
      - id: split-eval-spelling
      - id: objectives/command-and-control/backdoor/webshell/stager::eval-quoted-prefix-argument
  - id: php-split-string-eval-loader-emitter
    desc: PHP packer builds a split-string eval loader and writes it out
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::split-literal-identifier-assignment
      - id: php-eval-loader-evidence
      - id: micro-behaviors/fs/write/file/handle/unspecified::php-fwrite
    any:
      - id: micro-behaviors/data/encode/base64/primitive::php-base64-encode
      - id: micro-behaviors/data/compress::php-gzencode-call
      - id: objectives/anti-static/obfuscation/string/conceal::php-two-char-chunks
