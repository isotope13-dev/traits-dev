defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1027
  mbc: B0024

composite_rules:
  - id: c-exe-write-random-or-upx-clues
    desc: C EXE write and random or UPX clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/open/unspecified::c-createfile-exe-text
      - id: micro-behaviors/fs/write/file/unspecified::c-writefile-variable-count-text
      - id: micro-behaviors/fs/write/file/unspecified::c-writefile-buf-count-text
    any:
      - id: micro-behaviors/os/random/prng/stdlib::c-rand-buffer-assignment
      - id: well-known/tool/packaging/upx::c-shellexecute-upx-exe-text
