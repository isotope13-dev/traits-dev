# DOS batch builders that repeatedly invoke an in-memory polymorphic decryptor
# generator and write numbered .COM test files to disk.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
  attack: T1027.014
  mbc: B0032.001

composite_rules:
  - id: dos-polymorphic-sample-batch-builder
    desc: DOS batch builder emits polymorphic files
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/generator::dos-self-patching-polymorphic-engine
      - id: micro-behaviors/fs/file/read-write::dos-counted-file-generation-loop
      - id: micro-behaviors/fs/file/read-write::dos-e9-store-and-file-write-sequences
