# SVG smuggling: an SVG's inline script decodes a long Base64 string literal,
# wraps the bytes in a Blob and object URL, and clicks a synthesized download
# for it. The payload exists only as text inside an "image" until the
# browser rebuilds and saves it, out of reach of gateway file-type scanning.
# An SVG drawing has no reason to manufacture and auto-save a binary file.
defaults:
  for: [svg]
  platforms: [windows, unix]
  attack: T1027.006,T1204.002
  mbc: E1027

composite_rules:
  - id: svg-script-base64-blob-autodownload
    desc: SVG script rebuilds Base64 blob and downloads it
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/communications/http/download/browser::svg-script-long-base64-literal
      - id: micro-behaviors/communications/http/download/browser::svg-script-blob-object-url
      - id: micro-behaviors/communications/http/download/browser::svg-script-download-click
