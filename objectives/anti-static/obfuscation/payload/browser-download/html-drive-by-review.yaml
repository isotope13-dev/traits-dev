defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1204.002
  mbc: F0007
composite_rules:
- id: base64-iso-download
  desc: Base64 disk image and scripted download
  crit: hostile
  conf: 0.99
  attack: T1027.006,T1204.002
  all:
  - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-byte-array-proximity
  - id: micro-behaviors/communications/http/download/browser::iso-blob-mime
  - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
- id: base64-zip-computed-download
  desc: Obfuscated Base64 ZIP reconstruction with computed browser calls
  crit: hostile
  conf: 0.98
  attack: T1027.006,T1204.002
  all:
  - id: metadata/file/encoding/compression::base64-zip-inline-archive
  - id: micro-behaviors/data/decode/base64/unspecified::base64-to-blob-text-sequence
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  - id: well-known/tool/packaging/javascript-obfuscator::plain-string-array-runtime
  any:
  - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-bracket
  - id: micro-behaviors/ui/window/click::dom-computed-click-call
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-document-call
  - id: micro-behaviors/data/control-flow/dispatch/computed::window-double-bracket-call
- id: base64-zip-hex-indexed-download
  desc: Hex-indexed browser script downloads embedded ZIP
  crit: hostile
  conf: 0.97
  for: [html]
  all:
  - id: metadata/file/encoding/compression::base64-zip-inline-archive
  - id: micro-behaviors/data/decode/base64/unspecified::base64-to-blob-text-sequence
  - id: objectives/execution/staging/transfer::hex-call-blob-computed-click-clues
