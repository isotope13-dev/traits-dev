# The smuggled script is mutated per download: random function names are
# spliced into its text before it is base64-encoded and handed out under a
# random file name, so no two victims receive the same hash.
defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: per-download-mutated-script-payload
    desc: Script payload mutated for every download
    crit: hostile
    conf: 0.93
    attack: T1027.006,T1027.004
    all:
      - id: micro-behaviors/data/string/assembly::random-function-name-spliced-into-code
      - id: micro-behaviors/fs/path/extension::random-identifier-script-filename
      - id: micro-behaviors/data/codec::base64-helper-invocation
