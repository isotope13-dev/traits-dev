# A native PE that carries an embedded Python runtime and executes a concealed
# Python source blob is an interpreter-backed payload, not ordinary compression.
# The wrapper is intentionally matched through structural decoder operations;
# no sample-specific host, URL, or payload string is required.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.95

traits:
  - id: embedded-python-runtime
    desc: PE embeds a Python runtime archive
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: python_embed.zip

  - id: reverse-python-blob
    desc: Base64-decodes an embedded Python blob
    crit: suspicious
    conf: 0.99
    if:
      type: raw
      regex: 'data1\s*=\s*base64\.b64decode'

  - id: reverse-python-source
    desc: Reverses the embedded Python source
    crit: suspicious
    conf: 0.99
    if:
      type: raw
      regex: 'encoded_script\[::\s*-1\]'

  - id: zlib-python-exec
    desc: Executes zlib-decompressed Python
    crit: suspicious
    conf: 0.99
    if:
      type: raw
      regex: 'exec\s*\(\s*zlib\.decompress\s*\(\s*comp\s*\)\s*\.decode\s*\(\s*\)\s*\)'

  - id: chunked-python-source
    desc: Joined encoded Python fragments
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      regex: 'encoded_script\s*=\s*["\x27]\\'

  - id: embedded-python-stage-url
    desc: Embedded Python carries a stage URL
    crit: suspicious
    conf: 0.97
    if:
      type: raw
      regex: 'python_embed\.zip.{0,500}https?://'

composite_rules:
  - id: embedded-python-obfuscated-exec
    desc: PE runs a hidden Python source blob
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.006,T1140"
    all:
      - id: embedded-python-runtime
      - id: reverse-python-blob
      - id: reverse-python-source
      - id: zlib-python-exec
