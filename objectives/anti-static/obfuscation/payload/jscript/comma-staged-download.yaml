defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1027,T1105

traits:
  - id: jscript-fragmented-stream-save
    desc: JScript constructs stream save method
    crit: notable
    if:
      type: text
      regex: "'av'\\s*\\+\\s*'eTo'\\s*\\+\\s*'File'"
  - id: jscript-fragmented-response-body
    desc: JScript constructs HTTP response body property
    crit: notable
    if:
      type: text
      regex: "'Res'\\s*\\)?\\s*\\+\\s*'p'\\s*\\+\\s*'o'\\s*\\+\\s*'nse'"

composite_rules:
  - id: jscript-comma-obfuscated-stream-download
    desc: JScript conceals COM download with comma expressions
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/source/syntax/operator::javascript-many-sequence-expressions
      - id: jscript-fragmented-stream-save
      - id: jscript-fragmented-response-body
      - id: micro-behaviors/data/control-flow/sequence::three-string-comma-expression
      - id: metadata/lang/source/literal/string/shape::adodb-fragment-dodb
      - id: metadata/lang/javascript-features::js-new-from-first-elements
      - id: micro-behaviors/communications/url/scheme::cleartext-http-url-code-literal
