defaults:
  platforms: [windows]
  for: [html]

traits:
  - id: hta-long-unbroken-block-comment
    desc: Long unbroken block comment
    crit: component
    if:
      type: text
      regex: '/\*[^[:space:]]{150,}'
  - id: hta-immediate-function-variable
    desc: Immediately runs a constructed function
    crit: component
    if:
      type: text
      regex: '\bFunction\s*\(\s*[A-Za-z_$][\w$]*\s*\)\s*\(\s*\)'

composite_rules:
  - id: hta-padded-xor-numeric-loader
    desc: Padded HTA runs code with XOR byte reconstruction
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1218.005
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: metadata/file/text-distribution::long-comma-numeric-run
      - id: micro-behaviors/data/encode/char-code::computed-string-method-xor-rebuild
      - id: hta-immediate-function-variable
      - id: hta-long-unbroken-block-comment
