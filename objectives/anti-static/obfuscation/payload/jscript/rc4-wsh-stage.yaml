defaults:
  platforms: [windows]
  for: [javascript]
  mbc: B0032

composite_rules:
  - id: rc4-xor-computed-wsh-stage
    desc: RC4/XOR-packed JScript reconstructs a computed WSH stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-prga-output
      - id: micro-behaviors/data/encode/char-code::multiple-fromcharcode-calls
      - id: micro-behaviors/data/source/arithmetic::js-bitwise-arithmetic-chain
      - id: objectives/anti-static/obfuscation/syntax::js-wscript-bracket-member-access
      - id: micro-behaviors/process/create/script/wsh::wscript-marker
