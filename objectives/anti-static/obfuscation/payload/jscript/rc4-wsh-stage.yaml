defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1140,T1059.007
  mbc: B0032

composite_rules:
  - id: rc4-xor-computed-wsh-stage
    desc: RC4/XOR-packed JScript reconstructs a computed WSH stage
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/array::js-indexed-sum-byte-lookup
      - id: micro-behaviors/data/string/conversion::multiple-fromcharcode-calls
      - id: micro-behaviors/data/bitwise/shift::js-bitwise-arithmetic-chain
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
      - id: metadata/lang/runtime::wscript-host-reference
