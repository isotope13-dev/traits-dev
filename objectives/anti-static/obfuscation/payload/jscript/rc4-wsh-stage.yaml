defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1140,T1059.007
  mbc: B0032

composite_rules:
  - id: rc4-xor-computed-wsh-stage
    desc: RC4/XOR-packed JScript reconstructs a computed WSH stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-prga-output
      - id: micro-behaviors/data/decode/charset::multiple-fromcharcode-calls
      - id: micro-behaviors/data/arithmetic::js-bitwise-arithmetic-chain
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
      - id: metadata/lang/runtime::wscript-host-reference
