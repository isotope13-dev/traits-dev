# PowerShell loader that decodes a decimal-triplet XOR string and compiles the
# result as JScript.NET through Add-Type -Language JScript. Add-Type normally
# compiles C#, so a JScript compile of decoded text is a staged-payload shape.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.007,T1027

traits:
  - id: add-type-jscript-language
    desc: Add-Type compiles JScript source
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)Add-Type\b[^\n]{0,60}-lang(uage)?\s+JScript\b'

composite_rules:
  - id: powershell-decimal-triplet-xor-decode
    desc: Decodes three-digit decimal chunks with XOR
    crit: suspicious
    conf: 0.85
    near_lines: 12
    all:
      - id: micro-behaviors/data/control-flow/loop/counted::powershell-decimal-triplet-loop
      - id: micro-behaviors/data/bitwise/mixed::powershell-xor-operator
      - id: micro-behaviors/data/string/slice::powershell-substring-variable-call

  - id: powershell-xor-decoded-jscript-compile
    desc: XOR-decoded text compiled as JScript
    crit: suspicious
    conf: 0.9
    near_lines: 40
    all:
      - id: powershell-decimal-triplet-xor-decode
      - id: add-type-jscript-language
