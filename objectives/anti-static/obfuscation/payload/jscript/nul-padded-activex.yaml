defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007

traits:
  - id: script-nul-ratio-95
    desc: Dominant script byte exceeds 95 percent
    crit: component
    if:
      type: metrics
      field: text.top_char_ratio
      min: 0.95
  - id: script-parser-guard
    desc: Source parser skipped oversized input
    crit: component
    if:
      type: metrics
      field: source.ast_unavailable.tree_sitter_guard
      min: 1

composite_rules:
  - id: nul-padded-computed-activex-script
    desc: NUL-padded obfuscated ActiveX script exceeds parser limit
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/text-distribution::nul-dominated-content
      - id: script-nul-ratio-95
      - id: script-parser-guard
      - id: metadata/file/size::javascript-source-over-10mb
      - id: micro-behaviors/os/com/instantiation::computed-activex-progid
      - id: metadata/lang/source/syntax/call/arguments::computed-call-hex-token-pairs
