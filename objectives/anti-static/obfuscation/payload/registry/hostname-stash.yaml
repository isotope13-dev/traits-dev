# Payload stashed in HKCU\Software\<COMPUTERNAME> registry value.
# SHADOW-EARTH-053's TosBtKbd.dll loader calls GetComputerNameA to derive
# a per-host registry path then reads a binary value (e.g., "scode") from
# HKCU\Software\<COMPUTERNAME>. Hostname-keyed payload storage hides the
# implant from generic IoC sweeps that target known registry paths.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1112
  mbc: B0032
traits:
  # The bare word is also COM's SCODE (HRESULT) type name in every .NET/COM
  # binary; it is only meaningful beside the hostname-keyed registry reads.
  - id: scode-value-name
    desc: Word scode, a known stash value name
    crit: component
    conf: 0.85
    if:
      type: text
      word: scode
composite_rules:
  - id: hostname-keyed-registry-payload
    desc: Computer-name and registry read references
    crit: notable
    conf: 0.92
    near_lines: 80
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
      - id: micro-behaviors/os/registry/open::reg-open-key-ex-a-symbol
      - id: micro-behaviors/os/registry/read::reg-query-value-ex-a-symbol
    any:
      - id: scode-value-name
      - id: micro-behaviors/os/registry/key/reference::hkcu-software-escaped-path
