defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.97

composite_rules:
  - id: randomized-node-stage-aliases
    desc: Randomized aliases obscure an executed Node loader stage chain
    crit: hostile
    attack: T1027
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::cmd-long-script-custom-action
      - id: metadata/package/files/msi-content::randomized-data-js-alias-pair
      - id: metadata/package/files/msi-content::randomized-cmd-file-alias
      - id: metadata/package/files/msi-content::node-manifest-config-pair
      - id: metadata/package/files/msi-content::node-notice-changelog-pair
      - id: metadata/package/files/name::msi-alphabetic-exe-long-name
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
