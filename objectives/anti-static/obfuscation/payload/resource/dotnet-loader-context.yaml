defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-resource-aes-resolver-profile
  desc: Managed resource, AES and resolver clues
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
  - id: micro-behaviors/metaprogramming/reflection/resolve::resolver-api-cluster
  any:
  - id: metadata/binary/layout/ratio::dotnet-low-entropy-text-carrier
  - id: metadata/binary/symbols/imports::single-import-raw
  - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-split-api-fragments-delegate
  unless:
  - id: metadata/signature/verified/platform::microsoft
  downgrade:
    any:
    - id: objectives/anti-static/obfuscation/obfuscator/managed/
    - id: metadata/build/protector::smartassembly-or-poweredby-build-markers
    - id: metadata/build/protector::dotnet-reactor-module-guid-type
  needs: 2
- id: dotnet-image-resource-invoke-profile
  desc: Managed image resource and reflective invoke
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-image-resource-set-access
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::dotnet-assembly-reflection-delegate-api-references
  - id: metadata/binary/symbols/imports::single-import-raw
  any:
  - id: metadata/binary/layout/ratio::dotnet-low-entropy-text-carrier
  - id: metadata/binary/section/entropy::dotnet-large-high-entropy-text
  - id: metadata/binary/provenance/build::unusual-pe-header-timestamp
  unless:
  - id: metadata/signature/verified/platform::microsoft
