defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
  conf: 0.97
composite_rules:
- id: reactor-3des-resource-profile
  desc: Reactor, TripleDES and resource entropy clues
  all:
  - id: metadata/build/protector::dotnet-reactor-module-guid-type
  - id: micro-behaviors/crypto/symmetric/3des::triple-des-provider
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: metadata/binary/resource/entropy::clr-resource-high-entropy
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: well-known/app/media/dvdvideosoft::free-disc-burner-utility
  - id: well-known/app/utility/cummins-insite-update-manager::cummins-insite-update-manager-context
  - id: well-known/app/utility/cummins-license-configuration-tool::cummins-lct-context
  - id: well-known/lib/vendor-sdk/winpure/
- id: codedom-resource-decryption-profile
  desc: CodeDOM, resource and decryption clues
  all:
  - id: micro-behaviors/metaprogramming/generation/compile::codedom-compiler
  - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
  - id: metadata/build/protector::dotnet-reactor-module-guid-type
