defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Verified in a .NET Reactor native wrapper: the custom decoder recovers
  # a size-prefixed zlib stream containing a CLR version and managed image.
  # This identifies deliberate payload concealment, not the protected
  # application's final purpose. This commercial protection mechanism also
  # supports legitimate software, so concealment alone is suspicious.
  # Preserve the exact matcher and publisher exclusions.
  - id: native-table-decoded-clr-resource
    desc: Conceals CLR image with table-decoded resource
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    all:
      - id: micro-behaviors/data/embedded/payload/resource::xor-resource-clr-api-profile
      - id: micro-behaviors/data/decode/custom::x86-table-byte-feedback-decoder
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-metahost-interface-guids
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
