defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-dotnet-aes-resource-write-launch-profile
    desc: Unsigned .NET AES resource with file-write and process-launch APIs
    crit: suspicious
    conf: 0.98
    attack: T1027.009,T1140,T1106
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-embedded-resource-read-any
      - id: metadata/binary/section/bytes::aes-token-in-code-section
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/runtime-symbol::dotnet-processstartinfo-name
      - id: micro-behaviors/process/create/runtime-symbol::process-start-member-token
    unless:
      - id: well-known/lib/development/basic-reference-assemblies::framework-bundle
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker

  - id: unsigned-dotnet-aes-resource-microsoft-masquerade
    desc: Unsigned .NET AES dropper masquerading as Microsoft
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1140
    all:
      - id: unsigned-dotnet-aes-resource-write-launch-profile
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
