defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-dotnet-aes-resource-write-launch-profile
    desc: Unsigned .NET AES resource with file-write and process-launch APIs
    crit: suspicious
    conf: 0.98
    attack: T1027.009,T1140,T1106
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-embedded-resource-read-any
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-short-type-name
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: metadata/binary/symbols/name/token::dotnet-processstartinfo-name
      - id: metadata/binary/symbols/name/token::process-start-member-token
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
