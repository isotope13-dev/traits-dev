defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: assemblyresolve-resource-writealltext
    desc: .NET assembly resolver with large resource and text-file output
    crit: notable
    conf: 0.9
    attack: T1027.009
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
      - id: micro-behaviors/fs/write/file/direct::dotnet-writealltext-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
  - id: dotnet-template-des-resource-reflective-stage
    desc: Renamed .NET template decrypts opaque resource and stages it
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1140,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/symmetric/des::dotnet-des-decrypt-chain
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-delegate
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary::dotnet-template-product-identity-context
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: reflective-managed-resource-decryptor
    desc: Reflective .NET resource decryptor
    crit: hostile
    conf: 0.99
    attack: T1027.009
    all:
      - id: metadata/binary/resource::clr-resource-high-entropy
      - id: metadata/binary/resource::clr-resource-large
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-newlatebinding
    unless:
      - id: well-known/lib/core/baiqisoft::barcode-control-library-context
      - id: well-known/lib/core/baiqisoft::barcode-control-package-context
      - id: objectives/command-and-control/backdoor/control/desktop::dotnet-rat-controller-attack-suite
  - id: vbnet-latebind-embedded-pe-resource-stager
    desc: VB.NET late-bound loader with embedded PE and opaque resources
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-embedded
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-newlatebinding
      - id: micro-behaviors/process/interpreter/reflection/runtime::managed-resource-reflection-activation
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/encode/payload::large-base64-payload
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/signed/platform::microsoft-corporation
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: dotnet-embedded-pe-triple-des-resource-loader
    desc: .NET high-entropy resource decrypts embedded PE reflectively
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1140,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-embedded
      - id: metadata/binary/resource::clr-resource-high-entropy
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
      - id: micro-behaviors/crypto/symmetric/3des::triple-des-decrypt-chain
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
    unless:
      - id: well-known/lib/data/oracle-managed-data-access::oracle-managed-data-access-library
