defaults:
  platforms: [windows]
  for: [pe]

composite_rules:

  - id: dotnet-template-des-resource-reflective-stage
    desc: Renamed .NET template decrypts opaque resource and stages it
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1140,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/symmetric/des::dotnet-des-decrypt-chain
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::methodbase-class
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::dotnet-create-delegate-reference
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: reflective-managed-resource-decryptor
    desc: Reflective .NET resource decryptor
    crit: hostile
    conf: 0.99
    attack: T1027.009
    all:
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: metadata/binary/resource/size::clr-resource-large
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::methodbase-class
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
    unless:
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-library-context
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-package-context
      - id: objectives/command-and-control/backdoor/control/desktop::dotnet-rat-controller-attack-suite
  - id: vbnet-latebind-embedded-pe-resource-stager
    desc: VB.NET late-bound loader with embedded PE and opaque resources
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::managed-resource-reflection-api-references
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: metadata/file/encoding/base64::large-base64-like-string
    unless:
      - id: metadata/signed/platform::microsoft
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
