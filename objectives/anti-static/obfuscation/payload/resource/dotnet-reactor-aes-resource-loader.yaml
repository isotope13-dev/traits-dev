# A .NET program protected with .NET Reactor whose bulk is a high-entropy
# managed resource, decrypted at run time with AES/Rijndael and then
# activated through reflection and a native function-pointer delegate, keeps
# its real code encrypted. Commercial protection is legal, but protecting a
# small app and hiding its payload in a resource is how crypters work.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1140,T1620
composite_rules:
  - id: dotnet-reactor-aes-resource-reflective-loader
    desc: Reactor-protected AES resource with reflective load
    crit: hostile
    conf: 0.82
    all:
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: metadata/binary/resource/size::clr-resource-high-entropy
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
      - id: micro-behaviors/process/interpreter/reflection/runtime::managed-resource-reflection-activation
    unless:
      - id: metadata/signed/platform/
