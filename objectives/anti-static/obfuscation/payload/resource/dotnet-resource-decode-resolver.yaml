# This profile co-occurs an opaque CLR resource, resource-reading and Base64
# decoding references, and managed delegate resolution. The file-wide match
# does not establish that these operations share data flow.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009
composite_rules:
  - id: unsigned-dotnet-opaque-resource-decode-resolver-profile
    desc: Unsigned .NET resources and decoder/interop APIs
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/size::clr-resource-high-entropy
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
    unless:
      - id: metadata/signed/platform/
