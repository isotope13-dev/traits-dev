# A program that parses PE headers in its own code, runs a TLS callback, and
# carries a very large resource section with few icons, while its file name
# disagrees with its original name. The parser plus the oversized resource
# is a loader and its payload container; the renamed original suggests
# reuse of a build template.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1620
composite_rules:
  - id: pe-parser-tls-oversized-resource-renamed-image
    desc: In-code PE parser, TLS callback, oversized resource, rename
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: metadata/binary/resource/size::large-rsrc-few-icons
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
    unless:
      - id: metadata/signed/platform/
