# A native program whose resource section is mostly cipher-grade entropy,
# that decodes strings with unrolled XOR into the stack, checks MZ and PE
# header constants in its own code and looks up exports in the resource
# module, while naming the CLR hosting library, loads a managed payload from
# the resource without ever writing it to disk. Real installers ship
# readable resources and do not parse PE headers themselves.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1027.009,T1140
composite_rules:
  - id: opaque-resource-clr-host-xor-pe-loader
    desc: Native loader for opaque resource with CLR host
    crit: hostile
    conf: 0.82
    all:
      - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-module-export-lookup
      - id: micro-behaviors/data/decode/xor::x86-unrolled-byte-xor-to-stack
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/dylib/library/family::mscoree-dll-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
