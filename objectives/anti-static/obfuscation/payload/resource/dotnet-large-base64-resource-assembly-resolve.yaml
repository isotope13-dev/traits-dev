# A .NET stub with a large resource, a very long base64 string, and an
# AssemblyResolve handler plus entry-point lookup carries a second assembly
# as encoded text and hands it to the runtime on demand. The encoding keeps
# the payload out of the file's PE structure and out of string extraction
# heuristics that expect binary resources.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1140,T1620
composite_rules:
  - id: dotnet-large-base64-resource-with-assembly-resolve-loader
    desc: .NET base64 payload with AssemblyResolve loader
    crit: hostile
    conf: 0.82
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: metadata/binary/resource/size::clr-resource-large
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
    unless:
      - id: metadata/signed/platform/
      # CoreLib implements these APIs. Its culture lookup tables can also
      # use only Base64-alphabet characters without carrying encoded code.
      # The identity requires repeated internal references plus a CoreLib
      # filename or parsed PDB identity, including renamed crossgen fixtures.
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-corelib-assembly
