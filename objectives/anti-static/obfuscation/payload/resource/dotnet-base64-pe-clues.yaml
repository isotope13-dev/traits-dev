defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: dotnet-resource-base64-pe-clues
    desc: Managed resource and Base64 PE clues
    conf: 0.98
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: metadata/binary/resource/identity::clr-resource-repeated-junk-padding
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/embedded/payload/header::pe-dos-stub-base64
    crit: suspicious
