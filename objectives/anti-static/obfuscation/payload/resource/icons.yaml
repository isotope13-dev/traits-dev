defaults:
  platforms: [windows]
  for: [pe]
  attack: T1612
  mbc: B0023

traits: []
composite_rules:

  - id: renamed-opaque-resource-payload
    desc: Renamed PE with opaque resource payload
    crit: hostile
    conf: 0.97
    attack: "T1027,T1036.005"
    all:
      - id: metadata/binary/resource/size::large-rsrc-few-icons
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/binary/signing::small-high-entropy-data-section
    unless:
      - id: metadata/signed/platform/
