# A VB6 crypter or binder stub: the payload sits encrypted in the resource
# section, the stub resolves RtlMoveMemory and GetProcAddress by name at
# run time to copy and run it, and its options follow in a token-delimited
# config block.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1027.002
composite_rules:
  - id: vb6-encrypted-resource-token-config-stub
    desc: VB6 stub with encrypted resource and token config
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/trailer::repeated-token-field-delimiter
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
      - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
    unless:
      - id: metadata/signed/platform/
