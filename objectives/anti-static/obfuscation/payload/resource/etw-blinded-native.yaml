defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: etw-blinded-compressed-resource-payload
    desc: ETW-blinding PE combines opaque resource extraction with AES and decompression
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140
    all:
      - id: objectives/evasion/anti-av/blinding::native-etw-single-byte-return-patch
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/data/codec::rtl-decompress-buffer
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes-pe-rdata
