defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: vb6-resource-stub-payload-builder
  desc: VB6 resource stub and EXE write profile
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/resource::vb6-loads-custom-stub-resource
  - id: micro-behaviors/fs/read/file/full::vb6-full-binary-file-read-source
  - id: micro-behaviors/fs/write/file/handle::vb6-temp-exe-binary-write
  - id: micro-behaviors/data/embedded/payload/trailer::vb6-crypter-delimiter
  any:
  - id: objectives/anti-static/pack/overlay::vb6-preserves-eof-overlay
  - id: micro-behaviors/data/string/malware::vb6-hardcoded-decode-key
- id: vb6-encrypted-exe-crypter-builder
  desc: VB6 resource stub, AES and EXE copy
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/payload/resource::vb6-resource-stub-payload-builder
  - id: micro-behaviors/crypto/symmetric/aes/vb6::rijndael-wrapper-vb6
  - id: micro-behaviors/fs/write/file/copy::vb6-filecopy-output
  any:
  - id: micro-behaviors/crypto/symmetric/aes/vb6::rijndael-buffer-crypto-vb6
  - id: micro-behaviors/data/encode/hex::vb6-bidirectional-hex-codec
