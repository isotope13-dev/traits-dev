defaults:
  platforms:
    - windows
  for:
    - pe
  crit: suspicious
composite_rules:
  - id: opaque-resource-sparse-code-clues
    desc: Opaque resource and sparse-code clues
    conf: 0.88
    all:
      - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
      - id: metadata/binary/code/complexity::no-functions
    any:
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
      - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-export-walk-primitive
      - id: objectives/anti-static/obfuscation/imports/api-hashing::hash-primitive
      - id: micro-behaviors/process/info/query::peb-access-x64
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::dvclal-resource
