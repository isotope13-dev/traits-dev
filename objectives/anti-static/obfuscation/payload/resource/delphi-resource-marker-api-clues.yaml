defaults:
  platforms:
    - windows
  for:
    - pe
  crit: suspicious
composite_rules:
  - id: delphi-resource-marker-api-clues
    desc: Delphi resource markers and API clues
    conf: 0.99
    all:
      - id: metadata/binary/resource/label::tjertier6-resource-text
      - id: metadata/binary/resource/label::tke5rhiwr-resource-text
      - id: metadata/binary/resource/label::3rqefdas-resource-text
      - id: metadata/binary/resource/representation::interleaved-resource-header-pattern
      - id: metadata/lang/compiler/managed::delphi
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    any:
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
