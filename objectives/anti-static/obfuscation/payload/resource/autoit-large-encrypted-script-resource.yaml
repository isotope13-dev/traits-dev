# The AutoIt interpreter itself is under 1.5 MB with a small resource
# section. A compiled script whose encrypted resource section runs to
# megabytes, in a PE with a bad checksum from post-link editing, carries a
# large hidden script, which in practice is a bundled payload.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1059
composite_rules:
  - id: compiled-autoit-with-oversized-encrypted-script
    desc: Compiled AutoIt with oversized encrypted script
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/lang/compiled::autoit-resource-magic
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: metadata/binary/resource/entropy::rsrc-over-32k-entropy-over-5p8
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
    unless:
      - id: metadata/signed/platform/
