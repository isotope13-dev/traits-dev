defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: cyclic-xor-opaque-resource-decompressor
    desc: Cyclic XOR and decompression with opaque resources
    crit: suspicious
    conf: 0.97
    attack: T1027.009
    all:
      - id: micro-behaviors/data/decode/xor::x86-sixteen-byte-key-xor-in-place
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/data/codec::rtl-decompress-buffer
      - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
