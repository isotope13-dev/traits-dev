defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious

composite_rules:
  - id: managed-xor-dropper-admin-com-invoke
    desc: Obfuscated XOR resource dropper checks admin and invokes COM ProgID
    conf: 0.95
    attack: T1027,T1548
    all:
      - id: objectives/anti-static/obfuscation/encoding/buffer::zero-width-managed-resource-xor-writer
      - id: micro-behaviors/os/com/invoke::managed-admin-checked-com-progid-invoke
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call

  - id: managed-xor-dropper-registry-write
    desc: Obfuscated XOR resource dropper opens and writes Windows registry
    conf: 0.95
    attack: T1027,T1112
    all:
      - id: objectives/anti-static/obfuscation/encoding/buffer::zero-width-managed-resource-xor-writer
      - id: micro-behaviors/os/registry/open::dotnet-open-subkey-reference
      - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
