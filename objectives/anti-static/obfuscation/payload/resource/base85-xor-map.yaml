defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: base85-xor-resource-image-concealment
    desc: Resource image concealed by Base85 and keystream XOR
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1140
    all:
      - id: micro-behaviors/data/embedded/payload/resource::x64-stack-findresourcea-name
      - id: micro-behaviors/data/decode/base85::x64-base85-five-digit-accumulator
      - id: micro-behaviors/data/encoding/xor::x64-byte-keystream-xor-chunks
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/process/deploy/image-map::x64-thread-context-image-entry-call
