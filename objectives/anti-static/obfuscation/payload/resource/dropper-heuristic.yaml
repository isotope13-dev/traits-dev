defaults:
  platforms: [windows]
  for: [pe]
  crit: suspicious

traits: []
composite_rules:
  - id: pe-rsrc-dropper-heuristic
    desc: Obfuscated high-entropy resource payload extracted dynamically
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/binary/layout/overlay::has-overlay
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards

  # Resource, memory-protection, process-enumeration and process-creation API
  # co-occurrence does not establish resource-to-process data flow or staging.
  # Preserve the neutral API, process and resource observations independently.
  - id: high-entropy-resource-dpapi-unprotect-payload
    desc: High-entropy resource payload with DPAPI credential access
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1555.003
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-high-entropy-resource-stub-loader
    desc: Unsigned PE stub extracts and allocates a high-entropy resource payload
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    # pngimage inflates compressed GUI resources with the same APIs
    # and VirtualAlloc. That unit is not an encrypted stub payload.
    unless:
      - id: metadata/lang/compiler/managed::delphi-pngimage-unit
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/app/
