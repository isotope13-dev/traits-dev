defaults:
  platforms: [windows]
  for: [pe]
  crit: suspicious

traits: []
composite_rules:
  - id: pe-rsrc-dropper-heuristic
    desc: Obfuscated high-entropy resource payload extracted dynamically
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/binary/layout/overlay::has-overlay
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards

  - id: extracted-high-entropy-resource-process-loader
    desc: PE resource extraction before process/network execution
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1059.003,T1071
    for: [pe, dll]
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
      - id: micro-behaviors/process/create/shellexec::win-shellexecute
      - id: micro-behaviors/communications/socket/connect::connect-api
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/app/security/itop-vpn::benign-context

  - id: extracted-resource-api-resolution-loader
    desc: PE resource extraction with memory and process staging
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1057,T1055
    for: [pe, dll]
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/dual-use/transfer/winscp/
      - id: well-known/tool/browser::chromium-family-setup
      - id: well-known/app/browser/opera::verified-opera-installer

  - id: high-entropy-resource-dpapi-unprotect-payload
    desc: High-entropy resource payload with DPAPI credential access
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1555.003
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-encrypted-resource-stub-loader
    desc: Unsigned PE stub loads encrypted high-entropy resource payload
    crit: hostile
    conf: 0.96
    attack: T1027.009
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/app/
