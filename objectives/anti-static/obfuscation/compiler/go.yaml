defaults:
  crit: suspicious
  platforms: [windows, unix]
  for:
    - go
traits:
  - id: hex
    desc: Decodes hexadecimal strings
    conf: 0.8
    attack: T1140
    if:
      type: string_literal
      substr: hex.DecodeString
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::go-test-helper-file
      - id: metadata/lang/generated::generated-code-do-not-edit-text
      - id: metadata/build/artifact::go-generated-source-header
      - type: text
        regex: '(?m)^//(\s*\+build|go:build)\s+ignore'
      - type: text
        regex: 'X-Slack-Signature|slackSigningSecret|verifyWebHook|crypto/hmac'
composite_rules:
  - id: environment-check
    desc: Runtime environment checks
    conf: 0.75
    attack: T1497
    all:
      - id: micro-behaviors/os/env/read::go-env-access
      - id: metadata/lang/source/naming/target::vm-ci-regex-target-names
