defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1027"
  mbc: "B0032"
composite_rules:
  - id: dotnet-randomized-symbols
    desc: Obfuscated .NET symbol namespace cluster
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/code/complexity::many-functions
      - id: metadata/binary/symbols/compiler::nonstandard-namespace-symbol-cluster
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: metadata/package/versioning/scheme::pe-companyname-field
        - id: metadata/binary/debug::pdb-visual-studio
        - id: metadata/binary/framework::dotnet-native-image-pdb
  - id: dotnet-extreme-max-complexity
    desc: Obfuscated .NET extreme max complexity
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/code/complexity::many-functions
      - id: metadata/binary/symbols/compiler::nonstandard-namespace-symbol-cluster
      - id: metadata/binary/code/complexity::extreme-max-complexity
    downgrade:
      any:
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: metadata/signed/platform/
        - id: metadata/binary/framework::dotnet-native-image-pdb

  - id: dotnet-obfuscated-surveillance-agent
    desc: Obfuscated unsigned .NET RAT with encrypted screen control
    crit: hostile
    conf: 0.99
    attack: "T1027,T1113,T1071.001"
    mbc: "B0032,B0025"
    all:
      - id: dotnet-randomized-symbols
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/ui/window/automation::dotnet-capture-or-input-apis
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup

  - id: importless-random-export-obfuscated-dll
    desc: Unsigned importless DLL hides payload behind randomized exports
    crit: hostile
    conf: 0.97
    attack: T1027,T1620
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::digit-infixed-export-cluster
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/anti-static/obfuscation/binary-metrics/overlay::long-lower-alphanumeric-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
