# A static, stripped ELF that identifies itself to nobody but its C2.
#
# Statically linking and stripping are ordinary release choices; Go and Rust
# binaries ship this way constantly. What they also ship is identity — a
# version string, a usage message, a build note. This composite is the absence
# of all of that next to the presence of a pinned external address: nothing
# tells a responder what the file is, and one thing tells the file where to
# call.
#
# The combination is what makes it worth reporting. `static-linked` alone is a
# build flag, and a pinned address alone is how monitoring agents are
# configured. Neither is normally paired with a binary that refuses to say its
# own name.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027

composite_rules:
  - id: anonymous-static-binary-with-pinned-address
    desc: Nameless static ELF pins an external address
    crit: suspicious
    conf: 0.92
    all:
      # `elf-needed-libs-zero`, not the `static-linked` composite above it: that
      # composite also requires the section-name heuristic, which a fully
      # stripped ELF cannot satisfy — exactly the binaries this rule is for.
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    # `unless:`, not `none:`: same meaning here, and it is the spelling the
    # engine accepts on a composite that also has an `all:`.
    unless:
      - id: micro-behaviors/ui/help::has-help
      - id: metadata/lang/compiler/systems::go-buildinfo
