# Slash-numeric section names combined with multiple zero-entropy regions can
# indicate deliberate file-size inflation to bypass sandbox restrictions. The
# individual section shapes are neutral metadata because GNU PE linkers also
# use /N names for long DWARF section names.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.001
  mbc: B0032

composite_rules:
  - id: massive-slash-numeric-padding-inflation
    desc: Extreme file-size inflation via 1MB+ zero-entropy sections
    crit: hostile
    conf: 0.98
    size_min: 1048576
    all:
      - id: metadata/binary/section/names::massive-zero-entropy-slash-numeric-section
      - id: metadata/binary/section/names::many-slash-numeric-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # GNU ld names long COFF section names as /N string-table offsets.
      # MinGW debug builds leave some of those DWARF contributions zero-filled;
      # that is toolchain layout, not sandbox file-size inflation.
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe

  - id: slash-numeric-padding-inflation
    desc: File-size inflation via slash-numeric zero-entropy sections
    crit: suspicious
    conf: 0.93
    size_min: 1048576
    all:
      - id: metadata/binary/section/names::large-zero-entropy-slash-numeric-section
      - id: metadata/binary/section/names::many-slash-numeric-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe
