defaults:
  crit: suspicious
  for: [pe]
  platforms: [windows]

composite_rules:
- id: packed-autoit-upx-rwx-wrapper
  desc: Packed AutoIt UPX RWX wrapper
  crit: suspicious
  conf: 0.95
