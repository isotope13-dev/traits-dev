# Import-to-size ratio anomalies
# Detects binaries with suspiciously few imports relative to file size
# Indicates embedded payloads, overlay data, or statically compiled malware
defaults:
  platforms: [linux, macos, windows]
traits:
- id: max-80-imports
  desc: Binary has 80 or fewer imports
    # Component-only: the import count alone doesn't indicate obfuscation.
    # Used by `sparse-import-packed-loader` which also requires GetProcAddress +
    # self-module-resolution + packed-loader-data-geometry.
  crit: component
  conf: 0.84
  for: [pe]
  platforms: [windows]
  size_min: 524288
  if:
    id: metadata/binary/symbols/count::imported-functions-under-80
  unless:
  - type: basename
    regex: \.(pak|bin|dat|desktop)$
  - type: basename
    regex: \.(map|deb|gz|mun)$
  - id: metadata/binary/framework/
  - id: metadata/binary/code/complexity::no-functions
  - type: metrics
    field: exports.count
    min: 50
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: metadata/binary/linking/static/
- id: aliased-exports
  desc: Multiple exports resolve to same function
  crit: suspicious
  conf: 0.88
  for: [pe]
    # Alias-heavy exports are common in large compatibility DLLs. Keep this
    # obfuscation signal focused on stub-like binaries instead of broad API
    # surfaces.
  if:
    type: metrics
    field: pe.aliased_export_count
    min: 8
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: metadata/binary/symbols/count::many-imports
  - id: metadata/binary/code/complexity::many-functions
  - type: metrics
    field: exports.count
    min: 401
  # Inline mirror of many-imports above: that atom is baseline, so scans
  # strip it when no composite references it and the trait reference alone
  # does not suppress (libcef.dll ships 1292 imports with 28 ICF-folded
  # aliases). An import-rich table is not stub-like by construction.
  - type: metrics
    field: imports.count
    min: 80
  # Windows API-set forwarder DLLs intentionally reuse a small set of stub
  # addresses across their compatibility exports.
  - id: metadata/binary/vendor::apiset-stub
  - id: well-known/lib/format/gnu-libiconv/
  - id: wmdrm-compatibility-stub
- id: fully-aliased-export-stub
  desc: All exports aliased in tiny stub DLL
  crit: suspicious
  conf: 0.92
  for: [pe]
  size_max: 65536
  if:
    type: metrics
    field: pe.aliased_export_count
    min: 1
  unless:
  # Aliased exports in a tiny DLL is what an API-set forwarder stub IS.
  - id: metadata/binary/linking/api-set::api-set-forwarder-dll
  # MSVC folds identical function bodies onto one address (/OPT:ICF), so a C++
  # class exported from a small DLL reports its constructor and its two
  # assignment operators as "aliases" of each other. ClassIn's `app_api.dll`
  # exports `??0NonDriverApi@@…` and two `??4NonDriverApi@@…` at 0x1000. A
  # concealment stub aliases plain names, not mangled ones.
  - type: export
    regex: '^\?\?[0-9A-Z]'
  - type: metrics
    field: exports.count
    min: 5
  - type: metrics
    field: pe.is_dotnet
    min: 1
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/compiler/native::python3-dll-import

- id: low-volume-aliased-exports
  desc: Small export table with aliasing
  crit: suspicious
  conf: 0.9
  for: [pe]
  if:
    type: metrics
    field: pe.aliased_export_count
    min: 5
  unless:
  # Aliased exports in a tiny DLL is what an API-set forwarder stub IS.
  - id: metadata/binary/linking/api-set::api-set-forwarder-dll
  - type: metrics
    field: pe.is_dotnet
    min: 1
  - id: metadata/lang/compiler/systems::go-binary
  - type: metrics
    field: exports.count
    min: 10
  - id: well-known/lib/format/gnu-libiconv/
  - id: metadata/lang/compiler/native::python3-dll-import
- id: mscoree-string
  desc: mscoree .NET runtime reference
  crit: component
  for: [pe]
  if:
    type: text
    substr: mscoree
    section: ".idata"
- id: libiconv-open-symbol
  desc: libiconv_open symbol present
  crit: baseline
  for: [pe]
  if:
    type: symbol
    exact: libiconv_open
- id: taggant-prepare-import
  desc: TaggantPrepare import present
  crit: notable
  for: [pe]
  if:
    type: symbol
    exact: TaggantPrepare
- id: wmdrm-compatibility-stub
  desc: WMDRM compatibility stub marker
  crit: baseline
  conf: 0.98
  for: [pe]
  if:
    type: text
    substr: WMDRM backwards compatibility stub
    section: .rsrc
- id: aliased-export-com-server-exports
  desc: Aliased export with COM server exports
  crit: component
  conf: 0.95
  for: [pe]
  if:
    type: trait
    id: metadata/binary/symbols/exports::standard-com-server-exports
- id: aliased-export-microsoft-signed
  desc: Aliased export in Microsoft-signed binary
  crit: component
  conf: 0.95
  for: [pe]
  if:
    type: trait
    id: metadata/signed/unknown::microsoft-corporation
- id: aliased-export-wmdrm-stub
  desc: Aliased export in WMDRM compatibility stub
  crit: component
  conf: 0.95
  for: [pe]
  if:
    type: trait
    id: wmdrm-compatibility-stub
composite_rules:
- id: aliased-export-library-profile
  desc: Low-volume aliasing with library identity
  crit: baseline
  conf: 0.95
  for: [pe]
  any:
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/signed/leaf::python-software-foundation
  - id: objectives/anti-static/obfuscation/binary-metrics/imports::libiconv-open-symbol
  - id: aliased-export-com-server-exports
  - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
  - id: aliased-export-microsoft-signed
  - id: objectives/anti-static/pack/entropy::many-functions-dotnet-profile
  - id: aliased-export-wmdrm-stub
- id: sparse-import-toolchain-profile
  desc: Sparse-import toolchain or framework profile
  crit: baseline
  conf: 0.85
  for: [pe, elf, macho, -go, -rust]
  any:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/binary/code/complexity::no-functions
  - id: metadata/binary/symbols/count::many-exports-100
  - id: metadata/binary/symbols/count::high-export-count-marker
  - id: metadata/package/vendor::bitdefender-ctc-module
  - id: metadata/signed/platform::microsoft
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/runtime::go-runtime-marker
  - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
  - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
  - id: well-known/tool/reverse-engineering/quickbms::utility-context
  - id: micro-behaviors/fs/temp/py2exe::py2exe-pythondll
  - id: well-known/tool/development/toolchain/cygwin::cygwin-setup-signature
  # === Extreme size-to-import ratio ===
- id: huge-file-tiny-imports
  desc: Huge binary with minimal imports
  crit: hostile
  conf: 0.95
  for: [pe, elf, macho, -go, -rust]
  attack: "T1027"
  mbc: "B0032"
  size_min: 10485760   # 10MB
  all:
  - id: metadata/binary/symbols/count::max-25-imports
  needs: 2
  any:
  - id: micro-behaviors/os/api-resolution/manual::peb-access-x64
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/crypto/
  - id: micro-behaviors/process/create/shell/
  unless:
  - id: metadata/binary/section/header::many-sections-20
  - id: metadata/binary/framework/
  - id: metadata/binary/linking/static/
  # Official PhantomJS is a large UPX-packed WebKit binary with a thin PE
  # import table — the ratio looks like a packed dropper but is the product.
  - id: well-known/app/browser/phantomjs::phantomjs-official-binary
- id: dynamic-resolution-export-stub-profile
  desc: Dynamic resolution with aliased export stubs
  crit: suspicious
  conf: 0.92
  for: [pe]
  attack: "T1027.007"
  mbc: "B0032.014"
  all:
  - id: low-volume-aliased-exports
  - id: micro-behaviors/dylib/lookup::get-proc-address
  any:
  - id: metadata/binary/layout/entropy::high-entropy-data
  - id: metadata/binary/section/ratio::data-section-1p5x-code
  - id: micro-behaviors/data/embedded/payload/archive::zip-magic
  - id: objectives/anti-analysis/debugger-detect/check::anti-debug-api-pair
  needs: 2
  downgrade:
    any:
    - id: metadata/package/versioning/scheme::pe-version-resource
  unless:
  - id: metadata/binary/symbols/count::many-imports-100
  - id: metadata/binary/code/complexity::many-functions-5000
- id: sparse-import-packed-loader
  desc: Sparse-import packed PE loader
  crit: suspicious
  conf: 0.95
  for: [pe]
  platforms: [windows]
  attack: "T1027"
  mbc: "B0032"
  size_min: 524288
  all:
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/os/module/load::self-module-resolution
  - id: objectives/anti-static/obfuscation/payload/section/content::packed-loader-data-geometry
  any:
  - id: max-80-imports
  - id: metadata/binary/symbols/count::imports-at-most-50-large-binary
  downgrade:
    any:
    - id: metadata/binary/vendor::is-microsoft-named
    - id: metadata/file/string/identity::is-windows-named
    - id: metadata/package/versioning/scheme::pe-version-resource
  unless:
  - id: metadata/file/function::many-functions-50-generic
