# Sparse imports beside VB6 Shell; the count does not establish a packed stage.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vb6-few-imports-shell
  desc: VB6 shell with sparse imports
  all:
  - id: metadata/binary/symbols/count::imported-functions-under-10
  - id: micro-behaviors/process/create/exec::vb6-shell-execution
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
