defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-single-import-profile
  desc: High-entropy CLR with packing indicators
  crit: notable
  conf: 0.85
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/symbols/imports::single-import-count
  - id: metadata/binary/code/entropy::high-code-entropy
  any:
  - id: metadata/binary/section/entropy::small-high-entropy-executable-section-without-text
  - id: metadata/binary/section/label::themida-section-name-with-data
  - id: micro-behaviors/metaprogramming/reflection::dotnet-load-invoke-api-references
- id: dotnet-few-import-profile
  desc: High-entropy CLR with packing indicators
  crit: notable
  conf: 0.9
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/symbols/imports::few-import-count
  - id: metadata/binary/code/entropy::high-code-entropy
  any:
  - id: metadata/binary/section/entropy::small-high-entropy-executable-section-without-text
  - id: metadata/binary/section/label::themida-section-name-with-data
  - id: micro-behaviors/metaprogramming/reflection::dotnet-load-invoke-api-references
