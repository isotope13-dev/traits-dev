defaults:
  conf: 0.9
  platforms: [linux, android]
  for: [elf]
  attack: T1027
  mbc: B0032

composite_rules:
  # A statically linked, stripped ELF of this size carries hundreds of libc and
  # program strings in the clear. Mirai-lineage bots encrypt their whole string
  # table (tadashi.mips: 24 readable strings in 320 KB of MIPS code) and dial
  # their C2 through raw socket/connect syscalls instead of libc wrappers. The
  # string starvation is the concealment; the direct network syscalls say what
  # is being concealed. Arch-specific legs so a future ARM/PPC build of the
  # same bot is held to the same shape.
  - id: string-starved-static-elf-direct-dialer
    desc: String-starved static ELF dials out via raw syscalls
    crit: suspicious
    size_min: 100000
    all:
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: "metadata/file/profile/string-population::binary-strings-at-most-50"
    any:
      - id: micro-behaviors/communications/socket/syscall::mips-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-literal-pool-network-syscalls
    unless:
      - id: well-known/tool/sysadmin/unix-benign/
