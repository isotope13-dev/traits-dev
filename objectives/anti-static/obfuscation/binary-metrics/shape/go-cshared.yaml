defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: opaque-unsigned-go-cshared-dll
    desc: Unsigned opaque Go DLL with one export and TLS callbacks
    crit: suspicious
    conf: 0.9
    attack: T1027
    all:
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/lang/go-build::go-cshared-dll
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    any:
      - id: micro-behaviors/crypto/asymmetric/key::go-obfuscated-keygen
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
    unless:
      - id: metadata/signed/platform/
