defaults:
  platforms:
  - windows
  for:
  - pe
  size_max: 5000000
composite_rules:
# The XOR transform and unusual section layout are independent indicators of
# an opaque loader; they do not establish a malware family on their own.
- id: interleaved-xor-two-section-layout
  desc: Two-section PE with interleaved XOR transform
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/header/malformed::pe-timestamp-epoch-plus-123s
  - id: metadata/binary/section/header::two-section-pe
  - id: metadata/binary/section/ratio::pe-no-executable-sections
  - id: metadata/binary/section/entropy::large-pe-tiny-near-constant-rsrc-section
  - id: objectives/anti-static/obfuscation/payload/encrypted::importless-writable-image-xor-transform
- id: compact-two-section-layout
  desc: Compact writable two-section PE layout
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  all:
  - id: micro-behaviors/mem/write/arbitrary::x86-arithmetic-immediate-store
  - id: metadata/binary/header/malformed::pe-timestamp-epoch-plus-123s
  - id: metadata/binary/section/header::two-section-pe
  - id: metadata/binary/section/ratio::tiny-rsrc-section
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  any:
  - id: metadata/binary/section/entropy::high-entropy-writable-code-section
  - id: metadata/binary/section/entropy::giant-writable-text-section
  - id: metadata/binary/section/entropy::compact-high-entropy-writable-code-section
  needs: 1
  unless:
  - id: metadata/signed/platform/
# The icon tree and writable, importless layout form a structural profile.
- id: importless-two-section-layout
  desc: Importless writable two-section PE layout
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  size_min: 1048576
  all:
  - id: metadata/binary/layout/entropy::importless-large-writable-entry-layout
  - id: metadata/binary/section/ratio::pe-no-executable-sections
  - id: metadata/binary/section/ratio::tiny-rsrc-section
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: metadata/binary/resource/table::pe-resource-count-two
  - id: metadata/binary/resource/table::pe-resource-icon-list
  - id: metadata/binary/resource/table::pe-resource-group-icon-list
  unless:
  - id: metadata/signed/platform/
# The layout and junk code are suspicious but do not establish an infector.
- id: junk-code-writable-pe-layout
  desc: Junk code with writable two-section PE layout
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/anti-static/obfuscation/instruction/junk::repeated-canceling-not-pairs
  - id: metadata/binary/header/malformed::pe-timestamp-epoch-plus-123s
  - id: metadata/binary/section/header::two-section-pe
  - id: metadata/binary/section/entropy::giant-writable-text-section
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  any:
  - id: metadata/binary/section/entropy::large-pe-tiny-near-constant-rsrc-section
  - id: metadata/binary/section/ratio::tiny-rsrc-section
  needs: 1
  unless:
  - id: metadata/signed/platform/
- id: high-entropy-four-section-layout
  desc: High-entropy four-section PE with uncommon imports
  crit: suspicious
  conf: 0.99
  attack: T1027.002
  all:
  - id: metadata/binary/symbols/imports::register-wait-for-single-object-ex
  - id: metadata/binary/symbols/imports::ldr-query-process-module-information
  - id: metadata/binary/symbols/imports::var-cy-from-i4
  - id: metadata/binary/section/entropy::high-entropy-exec-section
  - id: metadata/binary/section/ratio::four-section-pe
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: metadata/binary/code/entropy::high-code-entropy
  unless:
  - id: metadata/signed/platform/
- id: writable-single-section-layout
  desc: Importless writable single-section PE layout
  crit: suspicious
  conf: 0.99
  attack: T1027.002
  all:
  - id: metadata/binary/header/malformed::pe-timestamp-epoch-plus-123s
  - id: metadata/binary/section/ratio::single-section-pe
  - id: metadata/binary/section/ratio::pe-no-executable-sections
  - id: metadata/binary/section/entropy::high-entropy-writable-code-section
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  unless:
  - id: metadata/signed/platform/
