- id: parser-hostile-pe-section-overhang
  desc: Parser-hostile PE section and relocation overhang
  crit: hostile
  conf: 0.94
  for: [pe, dll]
  size_min: 32768
  all:
  - id: metadata/binary/metrics/structural::section-exceeds-file-size
  - id: metadata/binary/metrics/structural::multiple-pe-section-overflows
  - id: metadata/binary/metrics/structural::pe-relocation-table-overhang
  # All three legs above restate one fact — the section headers describe data
  # the file does not contain — so any PE cut short satisfies them together.
  # A crafted parser-hostile image still carries its payload inline, so the
  # bytes that are present are compression-grade; a truncated fragment's are
  # not. This separates the technique from carved/partial samples such as the
  # 134KB head of a .NET Reactor build kept in YARA's tests/data.
  - id: metadata/binary/metrics/threshold::high-overall-entropy-binary
