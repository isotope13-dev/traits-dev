  - id: no-strings
  unless:
  - id: well-known/tool/development/anthropic-claude-agent/
  - id: well-known/app/system/cvte-crashrpt/
  - id: well-known/tool/sysadmin/busybox::busybox-binary
  - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
