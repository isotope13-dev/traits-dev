defaults:
  platforms:
  - linux
  - windows
  - macos
  for: [elf, macho, pe]
  attack: T1027
  mbc: B0032
traits:
- id: upx-many-wx-sections
  desc: UPX-like many WX sections
  crit: component
  conf: 0.82
  for:
  - pe
  if:
    type: metrics
    field: sections.executable_writable_count
    min: 10
- id: wx-sections
  desc: "Writable and executable sections"
  crit: component
  conf: 0.9
  attack: T1055
  size_max: 31457280
  size_min: 32768
  if:
    type: metrics
    field: sections.executable_writable_count
    min: 1
  unless:
  - id: metadata/binary/layout::legacy-watcom-packed-utility
  - type: section
    writable: true
    executable: true
    length_max: 0
  - id: well-known/dual-use/access-control/zprotect/
- id: many-wx-sections
  desc: Multiple W+X sections (packer pattern)
  crit: component
  conf: 0.95
  attack: T1045
  size_min: 32768
  if:
    type: metrics
    field: sections.executable_writable_count
    min: 2
  unless:
  - id: metadata/binary/layout::legacy-watcom-packed-utility
  - id: metadata/binary/symbols/exports/
  - id: metadata/binary/layout::svk-packed-section
- id: high-section-name-entropy
  desc: High entropy section names
  crit: suspicious
  conf: 0.85
  attack: T1045
  if:
    type: metrics
    field: sections.name_entropy
    min: 5.4
- id: dominant-section
  desc: Single section dominates file
  crit: component
  conf: 0.6
  attack: T1045
  if:
    type: metrics
    field: binary.largest_section_ratio
    min: 0.9
  unless:
  - type: basename
    regex: (^vmlinuz$|\.(ko(\.zst)?|mun|rll)$)
  - type: section
    regex: "^(UPX\\d|\\.upx)"
  - type: metrics
    field: dependencies.count
    max: 0
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/layout::legacy-watcom-packed-utility
  - id: metadata/binary/metrics/threshold::many-exports-20
- id: no-strings
  desc: "No readable strings"
  crit: baseline
  conf: 0.4
  size_min: 32768
  attack: T1045
  if:
    type: metrics
    field: binary.string_count
    min: 1
    max: 5

  # Large binary whose longest readable string is implausibly short.
  # A 512 KB+ binary with max_string_length <= 40 has encrypted all symbols
  # and error messages. Legitimate binaries this size routinely have version
  # strings, paths, and error messages well above 40 chars.
- id: sparse-strings-large-binary
  desc: Short max string length in large binary
  crit: component
  conf: 0.75
  size_min: 524288
  if:
    type: metrics
    field: binary.max_string_length
    max: 40
  unless:
  - id: metadata/binary/framework::dotnet-metadata

  # Large binary where nearly all "strings" are noise fragments.
  # avg_string_length <= 6 means even the strings cleave finds are 3–5 char
  # garbage from binary data — no real content anywhere. For a binary with
  # substantial imports this is a near-certain sign of string encryption.
- id: noisy-avg-string-length
  desc: "Near-noise average length in large binary"
  crit: component
  conf: 0.75
  size_min: 524288
  if:
    type: metrics
    field: binary.avg_string_length
    max: 6.0
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/
  - id: well-known/app/system/drivers/nvidia::gsp-firmware-binary-path
  - id: metadata/binary/section/name::fwimage-section

- id: many-high-entropy-strings
  desc: Many high-entropy strings in binary
  crit: suspicious
  conf: 0.85
  if:
    type: metrics
    field: binary.high_entropy_string_count
    min: 20
  unless:
  - type: metrics
    field: functions.count
    min: 500
  - type: section
    exact: '.rdata'
    length_min: 500000
  - type: metrics
    field: binary.string_count
    min: 10000
  - type: metrics
    field: binary.max_string_length
    min: 10000
  - id: well-known/app/productivity/txtconverter::signed-installer-context
- id: many-tiny-functions
  desc: Many tiny functions (<16 bytes)
  crit: notable
  conf: 0.4
  if:
    type: metrics
    field: binary.tiny_func_count
    min: 500
- id: high-avg-complexity
  desc: High average cyclomatic complexity
  crit: notable
  conf: 0.75
  attack: T1027.002
  size_max: 500000
  if:
    type: metrics
    field: binary.avg_complexity
    min: 55
  unless:
  - type: metrics
    field: functions.count
    max: 20
  - type: metrics
    field: exports.count
    min: 20
  - id: metadata/file/extension/identity::uac-exe-basename
  downgrade:
    any:
    - id: metadata/package/versioning::pe-version-resource
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: very-high-avg-complexity
  desc: Very high average cyclomatic complexity
  crit: notable
  conf: 0.85
  attack: T1027.002
  size_max: 500000
  if:
    type: metrics
    field: binary.avg_complexity
    min: 75
  unless:
  - type: metrics
    field: functions.count
    max: 20
  - type: metrics
    field: exports.count
    min: 20
- id: many-complex-functions
  desc: Many high complexity functions (>80)
  crit: baseline
  conf: 0.6
  attack: T1027.002
  if:
    type: metrics
    field: binary.huge_func_count
    min: 80
  downgrade:
    any:
    - id: metadata/binary/metrics/threshold::many-exports-200
    - id: metadata/signed/platform::microsoft-corporation
    - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
  unless:
  - id: metadata/binary/framework/
  - type: basename
    exact: urlmon.dll
  - id: metadata/signed/platform::apple
- id: many-basic-blocks
  desc: High basic blocks per function
  crit: notable
  conf: 0.55
  if:
    type: metrics
    field: binary.avg_basic_blocks
    min: 50
  unless:
  - type: metrics
    field: functions.count
    max: 20
  downgrade:
    any:
    - id: metadata/package/versioning::pe-version-resource
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - type: metrics
      field: imports.count
      min: 80
- id: large-overlay
  desc: Large overlay relative to file
  crit: baseline
  conf: 0.7
  for:
  - pe
  - macho
  attack: T1027.009
  size_min: 131072
  if:
    type: metrics
    field: binary.overlay_ratio
    min: 0.5
  unless:
  - id: metadata/binary/linking/runtime::cosmopolitan-marker
  - id: well-known/tool/reverse-engineering/resource-hacker::resource-hacker-marker
  - id: metadata/binary/linking/runtime::cosmopolitan-marker
  downgrade:
    any:
    - type: trait
      id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
    - id: micro-behaviors/fs/temp/py2exe::py2exe-bundle
- id: high-entropy-overlay-raw
  desc: High entropy overlay data
  crit: component
  conf: 0.8
  for:
  - pe
  - macho
  attack: T1027.009
  if:
    type: metrics
    field: binary.overlay_entropy
    min: 7.0
  unless:
  - id: metadata/binary/linking/runtime::ape-binary-marker
  - type: metrics
    field: binary.overlay_size
    max: 16384
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
  - id: metadata/document/office/container/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/section/names::upx-section
  - id: micro-behaviors/fs/temp/pyinstaller/
- id: compact-high-entropy-overlay
  desc: Compact high entropy overlay blob
  crit: component
  conf: 0.84
  for:
  - pe
  attack: T1027.009
  if:
    id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay-raw
  unless:
  - type: metrics
    field: binary.overlay_size
    max: 255
  - type: metrics
    field: binary.overlay_size
    min: 4097
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
- id: large-overlay-size
  desc: Overlay large enough to contain payload
  crit: component
  conf: 0.7
  for:
  - pe
  - macho
  if:
    type: metrics
    field: binary.overlay_size
    min: 81920
- id: high-string-density-large-pe
  desc: Large PE with dense string corpus
  crit: component
  conf: 0.82
  for:
  - pe
  size_min: 250000
  if:
    type: metrics
    field: binary.string_count
    min: 20000
    min_size: 500000
- id: function-count-1000-plus
  desc: Binary has 1000 or more functions
  crit: component
  conf: 0.5
  if:
    type: metrics
    field: functions.count
    min: 1000
  unless:
  - id: metadata/file/string/identity::system-shell-basename
  - id: metadata/lang/compiler/systems::go-pe-symtab
- id: zero-entropy-executable-section
  desc: "Zero-entropy exe section (carved/packed PE)"
  crit: suspicious
  conf: 0.92
  for:
  - pe
  if:
    type: section
    executable: true
    entropy_max: 0.01
    length_min: 4096
  unless:
    # Topala's SIW diagnostic utilities are signed commercial binaries whose
    # large executables trip section-entropy heuristics; the vendor identity
    # (manifest marker) marks them as the known-benign diagnostic family.
    - id: well-known/app/utility/siw::siw-family-identity
    # When the section headers describe more file than exists, the "zero
    # entropy" being measured is absent bytes, not zeroed ones. Go's
    # `debug/pe/testdata/vmlinuz-4.15.0-47-generic` is 474 bytes of kernel EFI
    # headers whose `.bss` header claims 8 MB -- a header fixture, not a carved
    # payload.
    - id: metadata/binary/anomaly::inflated-section-headers

