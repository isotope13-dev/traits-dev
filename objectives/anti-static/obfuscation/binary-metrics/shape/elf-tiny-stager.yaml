defaults:
  conf: 0.96
  platforms: [linux, android]
  for: [elf]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: tiny-static-stripped-http-stager
    desc: Tiny static stripped ELF HTTP stager
    crit: hostile
    size_max: 4096
    all:
      - id: objectives/command-and-control/beacon/network/http::direct-ip-tiny-elf-http-stager
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: "metadata/file/profile/string-population::binary-strings-at-most-50"
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: sectionless-syscall-tiny-http-stager-shape
    desc: Sectionless syscall tiny HTTP stager shape
    crit: hostile
    size_max: 512
    all:
      - id: objectives/command-and-control/beacon/network/http::sectionless-syscall-tiny-elf-http-stager
      - id: metadata/binary/section/header::elf-no-section-headers
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
  - id: executable-stack-stripped-uclibc-elf
    desc: Stripped executable-stack ELF with uClibc stager profile
    # Structural hardening gaps plus the static uClibc stager profile are
    # common on statically linked IoT toolchains; keep suspicious unless a
    # stronger botnet/persistence composite already establishes implant intent.
    crit: suspicious
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::uclibc-iot-credential-attack-shell-profile
      - id: metadata/binary/header/program::elf-executable-stack
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
    any:
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag"
      - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/sysadmin/unix-benign/
      - id: objectives/evasion/masquerade/process/system-name::http-flood-kworker-persistence-templates
      - id: objectives/persistence/system/service/systemd::native-arm-systemd-shell-staging-implant
