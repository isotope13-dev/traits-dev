# An opaque four-section PE with this small import profile is a useful
# structural signal; it does not by itself establish infection or ransom.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: B0032

traits:
composite_rules:
  - id: opaque-four-section-import-profile
    desc: Opaque four-section PE with uncommon imports
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-lang-id
      - id: micro-behaviors/fs/file/handle::set-file-pointer
      - id: micro-behaviors/os/service/query::query-service-config-a-symbol
      - id: micro-behaviors/ui/menu::get-menu-checkmark-dimensions
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: metadata/binary/section/ratio::four-section-pe
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/binary/section/prose::pe-short-readable-strings
      - id: metadata/binary/symbols/count::pe-sparse-import-table
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
