# VirLock's encrypted four-section variants retain a distinctive small import
# profile even when the executable body is opaque.  Keep the imports as
# component evidence and require the complete structural cluster for hostility.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1486
  mbc: B0032

traits:
  - id: virlock-import-service-config
    desc: VirLock-associated QueryServiceConfigA import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: QueryServiceConfigA
  - id: virlock-import-menu-dimensions
    desc: VirLock-associated menu dimensions import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: GetMenuCheckMarkDimensions

composite_rules:
  - id: virlock-four-section-import-profile
    desc: VirLock-associated opaque four-section PE profile
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::get-system-default-lang-id
      - id: micro-behaviors/fs/file/handle::set-file-pointer
      - id: virlock-import-service-config
      - id: virlock-import-menu-dimensions
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: metadata/binary/section/ratio::four-section-pe
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/binary/section/prose::pe-short-readable-strings
      - id: metadata/binary/symbols/count::pe-sparse-import-table
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
