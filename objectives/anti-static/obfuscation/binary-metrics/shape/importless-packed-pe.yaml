defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1027.002
traits: []
composite_rules:
- id: importless-extreme-control-flow-pe
  desc: Importless PE has extreme flow, sparse strings
  crit: suspicious
  conf: 0.98
  attack: T1027
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/code/complexity::large-function-surface
  - id: metadata/binary/code/complexity::many-huge-functions
  - id: metadata/binary/section/ratio::pe-near-total-code-data
  - id: metadata/binary/section/prose::pe-short-readable-strings
  - id: metadata/file/profile/string-population::large-pe-strings-at-most-128
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: importless-flattened-rwx-loader
  desc: Flattened importless PEB loader allocates RWX memory
  crit: hostile
  conf: 0.99
  attack: T1027,T1027.007,T1620
  all:
  - id: importless-extreme-control-flow-pe
  - id: micro-behaviors/process/info/query::peb-access-x64
  - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
  - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
