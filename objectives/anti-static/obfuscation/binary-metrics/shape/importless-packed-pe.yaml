defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002

traits:
- id: large-pe-sparse-readable-strings
  desc: Large PE has 128 or fewer strings
  crit: notable
  conf: 0.92
  size_min: 1048576
  if:
    type: metrics
    field: binary.string_count
    max: 128

composite_rules:
- id: importless-extreme-control-flow-pe
  desc: Importless PE has extreme flow, sparse strings
  crit: suspicious
  conf: 0.98
  attack: T1027
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/code/complexity::large-function-surface
  - id: metadata/binary/code/complexity::many-huge-functions
  - id: metadata/binary/section/ratio::pe-near-total-code-data
  - id: metadata/binary/section/prose::pe-short-readable-strings
  - id: large-pe-sparse-readable-strings
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/

- id: importless-flattened-rwx-loader
  desc: Flattened importless PEB loader allocates RWX memory
  crit: hostile
  conf: 0.99
  attack: T1027,T1027.007,T1620
  all:
  - id: importless-extreme-control-flow-pe
  - id: micro-behaviors/os/api-resolution/manual::peb-access-x64
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-walk
  - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite-arg-x64
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/

- id: importless-writable-entry-packed-pe
  desc: Importless high-entropy PE with writable entry
  crit: suspicious
  conf: 0.98
  attack: T1027,T1620
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/layout/entropy::high-overall-entropy-binary
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  unless:
  - id: metadata/signed/platform
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/dual-use/packaging/kkrunchy::kkrunchy-rwx-packer-context

- id: four-section-opaque-pe-shape
  desc: Four-section PE with opaque high-entropy code
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/section/ratio::four-section-pe
  - id: metadata/binary/layout/entropy::high-overall-entropy-binary
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: metadata/binary/code/entropy::high-code-entropy
  unless:
  - id: metadata/signed/platform
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/lang/compiled::linux-kernel-efi-image
  - id: metadata/package/testing/presence/harness::binary-test-directory
  # "Opaque" is the claim: an unidentified packer. A PE that declares the
  # UPX0/UPX1 bookends names its own packer, and the section count, zeroed
  # checksum and code entropy that make up the rest of this shape are all
  # ordinary UPX artifacts (UPX zeroes OptionalHeader.CheckSum on repack, and
  # cleave inflates the image, so the decompressed layer's own section count
  # and checksum pool back into this composite). Identified UPX images are
  # covered by objectives/anti-static/pack/upx/.
  - id: metadata/binary/section/label::upx-section-pair

- id: two-section-importless-pe-loader
  desc: Two-section importless high-entropy PE loader
  crit: suspicious
  conf: 0.96
  attack: T1027,T1620
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/section/header::two-section-pe
  - id: metadata/binary/layout/entropy::high-overall-entropy-binary
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  unless:
  - id: metadata/signed/platform
  - id: metadata/binary/framework::dotnet-metadata
