# Junk Data and Entropy Manipulation
defaults:
  crit: suspicious
  for: [binaries]
  platforms: [linux, macos, windows]

traits:
  - id: junk-base64-test-data
    desc: Base64 test data junk code indicator
    conf: 0.99
    if:
      type: text
      substr: "Base64 encoding test data for junk code"

composite_rules:
  - id: artificial-entropy-reduction
    desc: Artificial entropy reduction via massive junk string padding
    conf: 0.95
    all:
      - id: metadata/binary/section/prose::extreme-string-count
      - id: metadata/binary/layout/entropy::large-low-overall-entropy-binary
    any:
      - id: junk-base64-test-data
      - id: metadata/binary/layout/size::large-file-1mb
  # Size-inflation padding exists to push the file past scanner and sandbox
  # upload limits. Paired with a disguised in-memory stub launcher in the tiny
  # code section, the padding is cover for that loader, not a data-heavy app.
  - id: padded-pe-disguised-stub-loader
    desc: Padded PE hides disguised RWX stub loader
    crit: suspicious
    conf: 0.96
    for:
    - pe
    platforms:
    - windows
    attack: T1027.001,T1620
    all:
    - id: objectives/anti-static/obfuscation/payload/section/content::massive-low-entropy-dot-data
    - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-bitset-x64
    any:
    - id: micro-behaviors/process/inject/runtime/call::byte-copy-loop-register-jump-x64
    - id: micro-behaviors/process/inject/runtime/call::call-pop-getpc-x64
    unless:
    - id: metadata/signed/platform/
