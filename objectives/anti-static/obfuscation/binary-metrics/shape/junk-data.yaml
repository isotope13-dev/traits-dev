# Junk Data and Entropy Manipulation
defaults:
  for: [binaries]
  platforms: [linux, macos, windows]

traits:
  - id: junk-base64-test-data
    desc: Base64 test data junk code indicator
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: "Base64 encoding test data for junk code"

  - id: massive-string-count
    desc: Massive string count junk padding
    crit: notable
    conf: 0.9
    size_max: 100000000
    if:
      type: metrics
      field: binary.string_count
      min: 90000
    # Benign high-string-count runtimes (Go/Rust/Electron/ffmpeg/minikube). NOT
    # metadata/binary/framework/: a decoy-stuffed loader rips framework/SDK strings
    # precisely to fake those markers, so excluding on them would defeat detection
    # of the very technique this trait exists to catch.
    unless:
      - id: well-known/lib/runtime/electron/
      - id: well-known/lib/media/ffmpeg/
      - id: well-known/tool/sysadmin/kubernetes/minikube/
      - id: metadata/lang/compiler/systems/
      - id: well-known/tool/development/gcc-toolchain::conda-linux-gnu-triplet-path
      # Unstripped C/C++ binaries can exceed this count from DWARF and symbol
      # tables alone; that is retained debug data, not junk padding.
      - id: metadata/binary/section/names::dwarf-debug-retained
      # macOS dSYM companions carry the complete symbol/DWARF corpus and can
      # exceed this threshold without containing padding or a hidden payload.
      - id: metadata/build/debug::macos-dsym-debug-symbol
      # Generated Pulumi .NET providers contain tens of thousands of API
      # schema identifiers; that is product data, not junk padding.
      - id: well-known/app/infrastructure/pulumi::pulumi-dotnet-provider
      - id: well-known/lib/runtime/icu/

composite_rules:
  - id: artificial-entropy-reduction
    desc: Artificial entropy reduction via massive junk string padding
    crit: suspicious
    conf: 0.95
    all:
      - id: massive-string-count
      - id: metadata/binary/metrics/threshold::large-low-overall-entropy-binary
    any:
      - id: junk-base64-test-data
      - id: metadata/binary/metrics/size::large-file-1mb

    unless:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape/
