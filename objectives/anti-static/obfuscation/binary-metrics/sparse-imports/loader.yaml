defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1027"
  mbc: "B0032"
traits:
  - id: recovered-function-count-under-10
    desc: Very few recovered functions in large PE
    crit: component
    conf: 0.92
    size_min: 524288
    if:
      id: metadata/binary/symbols/count::recovered-function-count-under-10
    unless:
      - type: metrics
        field: pe.is_dotnet
        min: 1
      - id: metadata/binary/installer/sfx/
      - type: metrics
        field: binary.overlay_ratio
        min: 0.5
      - type: metrics
        field: imports.count
        min: 100
      - type: metrics
        field: pe.has_rich_header
        min: 1
      - type: section
        exact: '.rdata'
        length_min: 500000
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
composite_rules:
  - id: sparse-import-packed-loader-windows-loader
    desc: Sparse-import packed PE loader
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/symbols/count::imported-functions-under-80
      - id: recovered-function-count-under-10
      - id: micro-behaviors/os/module/load::module-export-resolution-imports
      - id: objectives/anti-static/obfuscation/payload/section/content::packed-loader-data-geometry
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: import-heavy-packed-loader
    desc: Import-heavy packed PE loader
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/code/complexity::over-256kb-at-most-2-functions
      - id: metadata/binary/symbols/count::pe-120-plus-imports
      - id: metadata/binary/code/ratio::pe-code-data-ratio-below-008
    any:
      - id: metadata/binary/section/layout::random-section-packed-layout
      - id: objectives/anti-static/obfuscation/string/junking::chromium-decoy-stuffing
      - id: metadata/package/versioning/scheme::version-resource-external-ip-only
