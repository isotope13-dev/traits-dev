# A Mach-O that keeps nothing in the clear.
#
# Distinct from the name-masquerade rule in
# `objectives/anti-static/pack/overlay`: that one keys on what the file calls
# itself, this one on what it declines to say. Every string a reader could act
# on is gone -- no prose, a __cstring section rounding to nothing against the
# image -- while more than half the file sits past the end of the image as
# overlay, and no signature vouches for any of it.
#
# Each leg has an innocent reading alone. A tiny __cstring is normal for a Go
# binary (the AMOS profile fragment excludes those for the same reason); an
# overlay is how installers carry their payload; plenty of software is
# unsigned. What has no innocent reading is all of them at once: a program that
# needs no readable text, keeps its bulk outside the image, and is signed by
# nobody is a stub whose real content is somewhere the reader cannot see.
defaults:
  platforms: [macos]
  for: [macho, dmg]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: opaque-overlay-stub-macho
    desc: Unsigned Mach-O hides strings and payload
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/section/prose::no-sentence-strings
      - id: metadata/binary/section/ratio::macho-sparse-cstring-section
      - id: objectives/anti-static/obfuscation/control-flow/logic::overlay-at-least-half
      - id: metadata/signed/trust-level::unsigned-macho
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
