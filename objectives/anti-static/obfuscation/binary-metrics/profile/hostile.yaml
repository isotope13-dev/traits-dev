defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: go-obfuscated-proxy-agent
    for: [elf, macho, pe]
    desc: High-complexity Go proxy-capable binary
    crit: suspicious
    conf: 0.9
    attack: T1027.002
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/binary/code/complexity::extreme-max-complexity
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-string
      - id: objectives/command-and-control/channel/tunnel/proxy::custom-socks5-package
    unless:
      # A single high-complexity function is expected in a large program
      # (generated code, vendored stacks); extreme-max-complexity itself
      # downgrades at this scale. Small obfuscated implants are unaffected.
      - id: metadata/binary/code/complexity::function-count-1000-plus

  - id: monolithic-stealth-injector
    for: [elf, macho, pe]
    desc: Monolithic high-complexity injector with minimal API surface
    crit: hostile
    conf: 0.95
    attack: T1055
    all:
      - id: metadata/binary/code/complexity::single-complex-function
      - id: metadata/binary/section/prose::near-zero-strings
    any:
      - id: micro-behaviors/process/inject/runtime/call::remote-memory-write-thread-api-set
      - id: objectives/evasion/process/injection/toolkit::process-hollowing-context-hijack
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/resource/

  - id: entropy-dominant-reflective-loader
    for: [elf, macho, pe]
    desc: High-entropy dominant section loader with reflective capabilities
    crit: hostile
    conf: 0.98
    attack: T1620
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::dominant-section
      - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
    any:
      - id: objectives/command-and-control/backdoor/loader/native-reflect::custom-pe-loader
      - id: objectives/evasion/process/injection/memory::asm-manual-import-parsing
    unless:
      - id: metadata/file/magic/identity::zip-archive
      - id: metadata/binary/installer/family/

  - id: anti-analysis-obfuscated-implant
    for: [elf, macho, pe]
    desc: Heavy control-flow obfuscation with dense anti-analysis patterns
    crit: hostile
    conf: 0.93
    attack: T1027.002
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::heavy-control-flow-obfuscation
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::anti-analysis-pattern
    any:
      - id: objectives/anti-analysis/debugger-detect/
      - id: objectives/anti-analysis/sandbox-detect/
      - id: objectives/anti-analysis/vm-detect/
    unless:
      - id: well-known/tool/development/editor/jetbrains::jetbrains-company-string
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
