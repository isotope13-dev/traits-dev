defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: rwx-resource-overlay-api-resolution
    desc: RWX resource overlay with API resolution
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/section/permission::duplicate-rwx-rsrc-sections
      - id: metadata/binary/layout/overlay::overlay-dominates-third
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/symbols/imports::few-import-count
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: metadata/binary/section/entropy::high-entropy-rsrc
      - id: objectives/anti-static/obfuscation/payload/encoded/exec::large-hex-string-dup
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/framework/
