defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: ieexec-name-dominant-overlay
    desc: IEExec-named PE with dominant overlay
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/provenance/build::ieexec-exe-name-text
      - id: metadata/binary/layout/ratio::overlay-over-90pct
    any:
      - id: metadata/binary/provenance/source::ieexec-pdb-name-text
      - id: metadata/binary/layout/embedded::pe-embedded
