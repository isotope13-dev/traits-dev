defaults:
  for: [pe]
  platforms: [windows]
  attack: T1027.002

composite_rules:
  - id: minizip-zip-data-packed-profile
    desc: minizip ZIP-in-data packed profile
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/lib/format/minizip::zip-in-data-launcher-name-profile
      - id: objectives/anti-static/obfuscation/payload/section/content::packed-loader-data-geometry
    any:
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: objectives/anti-analysis/debugger-detect/loader::exception-filtered-packed-loader-windows-loader
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    needs: 2
    unless:
      - id: metadata/signed/platform/

  - id: minizip-zip-data-checksum-profile
    desc: minizip ZIP-in-data checksum profile
    crit: suspicious
    conf: 0.98
    all:
      - id: well-known/lib/format/minizip::zip-in-data-launcher-name-profile
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: objectives/anti-static/obfuscation/payload/section/content::packed-loader-data-geometry
    any:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-api-hashing-indicator-single
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: objectives/anti-analysis/debugger-detect/loader::exception-filtered-packed-loader-windows-loader
      - id: micro-behaviors/process/terminate/kill::terminate-process
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
