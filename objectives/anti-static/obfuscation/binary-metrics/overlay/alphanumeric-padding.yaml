defaults:
  crit: suspicious
  platforms: [windows]
  for: [pe]

traits:
  - id: long-even-digit-run
    desc: Contains long even-digit runs
    conf: 0.98
    count_min: 32
    if:
      type: raw
      regex: '[02468]{256}'
      section: overlay
    unless:
      - id: objectives/anti-static/pack/mpress::mpress-two-section-loader

  - id: long-lower-alphanumeric-run
    desc: Contains long lowercase-alphanumeric runs
    conf: 0.96
    count_min: 16
    if:
      type: raw
      regex: '[a-z0-9]{1024}'
      section: overlay
    unless:
      - id: objectives/anti-static/pack/mpress::mpress-two-section-loader

composite_rules:
  - id: alternating-alphanumeric-overlay-data
    desc: PE carries dense alphanumeric data
    conf: 0.99
    all:
      - id: long-even-digit-run
      - id: long-lower-alphanumeric-run
      - id: metadata/binary/layout/overlay::large-overlay-64k
      - id: metadata/binary/layout/overlay::low-overlay-entropy
