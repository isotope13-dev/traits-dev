defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: autoit-pe-overlay-signature
    desc: AutoIt script signature in PE overlay
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        import "pe"
        rule autoit_pe_overlay_signature {
          strings:
            $au3 = "AU3!EA06"
          condition:
            pe.overlay.offset != 0 and $au3 in (pe.overlay.offset .. pe.overlay.offset + 256)
        }

composite_rules:
  - id: highly-entropic-overlay-large-rsrc-low-entropy
    desc: High-entropy overlay with large resource section
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/layout/overlay::has-overlay
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: metadata/binary/resource/size::rsrc-section-over-150kb
      - id: metadata/file/entropy::low-overall-entropy-binary
    unless:
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::clr-runtime-header
