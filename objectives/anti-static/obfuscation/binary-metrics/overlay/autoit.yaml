defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: highly-entropic-overlay-large-rsrc-low-entropy
    desc: High-entropy overlay with large resource section
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/layout/overlay::has-overlay
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: metadata/binary/resource/size::rsrc-section-over-150kb
      - id: metadata/file/entropy::overall-entropy-at-most-five
    unless:
      - id: metadata/binary/framework::clr-runtime-header
