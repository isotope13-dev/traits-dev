defaults:
  for: [dll]
  platforms: [windows]
  attack: T1027,T1140,T1620

composite_rules:
  - id: export-flood-capi-manual-pe-loader
    desc: Export-flood DLL decrypts and manually maps a PE
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/binary/anomaly/exports::extreme-export-alias-flood
      - id: objectives/command-and-control/dropper/staging/encrypted::capi-hash-decrypt-manual-pe-loader
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/symbols/exports::self-versioned-forwarder
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
