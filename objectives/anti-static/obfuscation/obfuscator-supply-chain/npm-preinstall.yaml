defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, shell, javascript]
composite_rules:
  - id: npm-preinstall-obfuscated-code
    desc: npm preinstall alongside obfuscated code
    crit: suspicious
    conf: 0.95
    attack: T1027
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
