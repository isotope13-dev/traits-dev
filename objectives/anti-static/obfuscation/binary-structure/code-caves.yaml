defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1055
  for: [elf, macho, pe]
traits:
# The bare null-run measurement moved to metadata/binary/code/density
# (huge-null-run-text): padding alone obstructs nothing. The cave claims
# below add the structure that makes it injection-ready.
- id: low-entropy-executable
  desc: Executable section with very low entropy
  crit: notable
  conf: 0.8
  entropy_max: 1.0
  if:
    type: section
    executable: true
    length_min: 65536
  unless:
  - id: metadata/signed/platform::apple
  - id: objectives/anti-static/obfuscation/binary-metrics/imports::mscoree-string
  - id: metadata/binary/framework/
  - id: metadata/binary/linking/runtime/
  - id: metadata/binary/symbols/count::many-imports
  downgrade:
    any:
    - type: section
      executable: true
      length_max: 131072
- id: scsi-miniport-string
  desc: ScsiMiniPort driver string
  crit: notable
  if:
    type: text
    exact: ScsiMiniPort
- id: rebuildimport-string
  desc: RebuildImport string token
  crit: notable
  if:
    type: text
    substr: RebuildImport
composite_rules:
- id: packer-or-driver-exclusion
  desc: Known packer, protector, or driver binary
  crit: component
  any:
  - id: objectives/anti-static/pack/detect::themida-or-asprotect
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: micro-behaviors/data/encode/pecompact::pecompact-seh-trick
  - id: scsi-miniport-string
  - id: metadata/lang/compiler/native::watcom-runtime
  - id: micro-behaviors/fs/path/library::windows-kernel-module-reference
  - id: well-known/dual-use/access-control/hasp-license-manager::hasp-license-manager-service
- id: code-cave-null-indicator
  desc: Large executable null padding indicator
  crit: component
  conf: 0.85
  any:
  - id: metadata/binary/code/density::null-runs-in-code-section
  - id: metadata/binary/code/density::huge-null-run-text
- id: code-cave-support-indicator
  desc: Secondary code cave structure indicator
  crit: component
  conf: 0.8
  any:
  - id: metadata/binary/instruction::int3-padding-runs
  - id: metadata/binary/instruction::alternating-null-nop-padding
  - id: low-entropy-executable

- id: injection-ready-cave
  for: [elf, pe]
  desc: Code cave suitable for code injection
  crit: suspicious
  conf: 0.9
  size_min: 16384
  all:
  - id: metadata/binary/code/density::huge-null-run-text
  - id: metadata/hardening/memory::wx-section
  any:
  - id: objectives/anti-static/obfuscation/payload/import::extreme-minimal-imports
  - id: metadata/binary/code/complexity::no-functions
  unless:
  - id: well-known/lib/network/push-rocks::smartmta-rust-mailer-binary-path
  - id: metadata/binary/symbols/count::many-imports
  - id: metadata/lang/compiler/managed::dvclal-resource
  - id: metadata/binary/framework::dotnet-metadata
  - id: rebuildimport-string
  - id: well-known/dual-use/access-control/hasp-license-manager/
