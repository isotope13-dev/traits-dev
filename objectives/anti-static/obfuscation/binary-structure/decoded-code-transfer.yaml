defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1620

composite_rules:
  - id: substitution-decoded-manual-pe-loader
    desc: Substitution-decoded bytes feed a manual PE mapper
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/custom::x86-indexed-substitution-byte-decoder
      - id: objectives/command-and-control/backdoor/loader/native-reflect::x86-manual-pe-mapper
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/tool/reverse-engineering/

  - id: rwx-lookup-decoded-code
    desc: Lookup-decoded bytes transferred to executable memory
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/data/encode/custom::x86-lookup-table-byte-decoder
      - id: metadata/binary/instruction::indirect-tail-jump-reg
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: well-known/tool/reverse-engineering/

  - id: self-decoding-reloc-overhang-loader
    desc: In-place byte decoder in reloc overhang
    crit: hostile
    conf: 0.995
    attack: T1027.009,T1140,T1620
    all:
      - id: micro-behaviors/data/encode/custom::x86-in-place-subtraction-byte-decoder
      - id: objectives/anti-static/pack/section-anomaly::reloc-concealed-encrypted-payload
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/

  - id: infection-marked-reloc-self-decoder
    desc: Infection-marked PE self-decodes a reloc payload
    crit: hostile
    conf: 0.999
    attack: T1027.009,T1140,T1554
    all:
      - id: micro-behaviors/data/encode/custom::x86-in-place-subtraction-byte-decoder
      - id: objectives/impact/infect/binary/rewrite::coff-symbol-pointer-20260317-infector-marker
      - id: metadata/binary/section/metrics::high-entropy-reloc-section
      - id: metadata/binary/anomaly/section-header::reloc-overhang-dominant
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
