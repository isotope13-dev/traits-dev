defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1620

traits:
  - id: x86-rwx-return-buffer-xor-and-call
    desc: XOR loop near allocated RWX buffer call
    crit: suspicious
    conf: 0.97
    arch: [x86]
    if:
      type: yara
      source: |
        import "pe"
        rule x86_rwx_return_buffer_xor_and_call {
          strings:
            $save = { 6A 40 68 00 (10|30) 00 00 [2-8]
                      FF (54 24 ??|94 24 ?? ?? ?? ??) 8B (D8|F0|F8) }
            $decode = { 80 (30|31|32|33|36|37) ??
                        (40|41|42|43|46|47) [0-5] (75|E2) (F?|E?) }
            $call = { FF (D3|D6|D7) }
          condition:
            for any section in pe.sections : (
              (section.characteristics & pe.SECTION_MEM_EXECUTE) != 0 and
              for any i in (1..#save) : (
                @save[i] >= section.raw_data_offset and
                @save[i] < section.raw_data_offset + section.raw_data_size and
                for any d in (1..#decode) : (
                  @decode[d] >= @save[i] + !save[i] and
                  @decode[d] <= @save[i] + 160 and
                  for any j in (1..#call) : (
                    @call[j] > @decode[d] and @call[j] <= @decode[d] + 160 and
                    @call[j] + 2 <= section.raw_data_offset + section.raw_data_size and
                    (uint8(@call[j] + 1) & 7) == ((uint8(@save[i] + !save[i] - 1) >> 3) & 7)
                  )
                )
              )
            )
        }
  - id: x64-rwx-return-buffer-xor-and-call
    desc: x64 XOR loop near RWX buffer call
    crit: suspicious
    conf: 0.97
    arch: [x86-64]
    if:
      type: yara
      source: |
        import "pe"
        rule x64_rwx_return_buffer_xor_and_call {
          strings:
            $save = { 33 C9 [0-16] 41 B8 00 10 00 00 [0-12] (FF ??|41 FF ??) [0-4] 48 8B (D8|F0|F8) }
            $decode = { 80 (34|74) ?? ?? [0-12] (72|75|7C) F? }
            $call = { FF (D3|D6|D7) }
          condition:
            for any section in pe.sections : (
              (section.characteristics & pe.SECTION_MEM_EXECUTE) != 0 and
              for any i in (1..#save) : (
                @save[i] >= section.raw_data_offset and
                @save[i] < section.raw_data_offset + section.raw_data_size and
                for any d in (1..#decode) : (
                  @decode[d] >= @save[i] + !save[i] and
                  @decode[d] <= @save[i] + 160 and
                  for any j in (1..#call) : (
                    @call[j] > @decode[d] and @call[j] <= @decode[d] + 160 and
                    @call[j] + 2 <= section.raw_data_offset + section.raw_data_size and
                    (uint8(@call[j] + 1) & 7) == ((uint8(@save[i] + !save[i] - 1) >> 3) & 7)
                  )
                )
              )
            )
        }

composite_rules:
  - id: substitution-decoded-manual-pe-loader
    desc: Substitution-decoded bytes feed a manual PE mapper
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/custom::x86-indexed-substitution-byte-decoder
      - id: micro-behaviors/mem/combined::x86-pe-validation-allocation-export-api-set
    unless:
      - id: metadata/installer/product/
  - id: rwx-lookup-decoded-code
    desc: Lookup-decoded bytes transferred to executable memory
    conf: 0.98
    all:
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/data/encode/custom::x86-lookup-table-byte-decoder
      - id: metadata/binary/instruction/sequence/control-flow::indirect-tail-jump-reg
  - id: x86-hashed-socket-stage-xor-transfer
    desc: Hashed socket stager XOR-decodes bytes before an executable-buffer call
    conf: 0.99
    arch: [x86]
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::ror13-x86-socket-stage-api-requests
      - id: x86-rwx-return-buffer-xor-and-call
  - id: x64-hashed-socket-stage-xor-transfer
    desc: x64 hashed socket stager XOR-decodes bytes before an executable-buffer call
    conf: 0.99
    arch: [x86-64]
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::ror13-x64-socket-stage-api-requests
      - id: x64-rwx-return-buffer-xor-and-call
  - id: self-decoding-reloc-overhang-loader
    desc: In-place byte decoder in reloc overhang
    conf: 0.995
    attack: T1027.009,T1140,T1620
    all:
      - id: metadata/binary/section/reloc::high-entropy-reloc-overhang
    any:
      - id: micro-behaviors/data/encode/custom::x86-in-place-subtraction-byte-decoder
      - id: micro-behaviors/data/arithmetic::x86-in-place-byte-add-loop
      - id: micro-behaviors/data/encoding/xor/unspecified-key::x86-in-place-byte-xor-loop
  - id: infection-marked-reloc-self-decoder
    desc: Infection-marked PE self-decodes a reloc payload
    conf: 0.999
    attack: T1027.009,T1140,T1554
    all:
      - id: objectives/impact/infect/binary/rewrite::coff-symbol-pointer-date-infector-marker
      - id: metadata/binary/section/entropy::high-entropy-reloc-section
      - id: metadata/binary/section/header::reloc-overhang-dominant
    any:
      - id: micro-behaviors/data/encode/custom::x86-in-place-subtraction-byte-decoder
      - id: micro-behaviors/data/arithmetic::x86-in-place-byte-add-loop
      - id: micro-behaviors/data/encoding/xor/unspecified-key::x86-in-place-byte-xor-loop
