defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1620

composite_rules:
  - id: substitution-decoded-manual-pe-loader
    desc: Substitution-decoded bytes feed a manual PE mapper
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/custom::x86-indexed-substitution-byte-decoder
      - id: micro-behaviors/mem/combined::x86-pe-validation-allocation-export-api-set
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/tool/reverse-engineering/

  - id: rwx-lookup-decoded-code
    desc: Lookup-decoded bytes transferred to executable memory
    conf: 0.98
    all:
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/data/encode/custom::x86-lookup-table-byte-decoder
      - id: metadata/binary/instruction/sequence::indirect-tail-jump-reg
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: well-known/tool/reverse-engineering/

  - id: self-decoding-reloc-overhang-loader
    desc: In-place byte decoder in reloc overhang
    conf: 0.995
    attack: T1027.009,T1140,T1620
    all:
      - id: metadata/binary/section/reloc::high-entropy-reloc-overhang
    any:
      - id: micro-behaviors/data/encode/custom::x86-in-place-subtraction-byte-decoder
      - id: micro-behaviors/data/arithmetic::x86-in-place-byte-add-loop
      - id: micro-behaviors/data/encoding/xor::x86-in-place-byte-xor-loop
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/

  - id: infection-marked-reloc-self-decoder
    desc: Infection-marked PE self-decodes a reloc payload
    conf: 0.999
    attack: T1027.009,T1140,T1554
    all:
      - id: objectives/impact/infect/binary/rewrite::coff-symbol-pointer-date-infector-marker
      - id: metadata/binary/section/entropy::high-entropy-reloc-section
      - id: metadata/binary/section/header::reloc-overhang-dominant
    any:
      - id: micro-behaviors/data/encode/custom::x86-in-place-subtraction-byte-decoder
      - id: micro-behaviors/data/arithmetic::x86-in-place-byte-add-loop
      - id: micro-behaviors/data/encoding/xor::x86-in-place-byte-xor-loop
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
