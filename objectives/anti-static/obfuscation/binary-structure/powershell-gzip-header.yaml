defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: repaired-gzip-managed-loader
    desc: Gzip header repair accompanies decompression and assembly loading
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/embedded/payload/header::powershell-gzip-header-repair
      - id: micro-behaviors/data/codec::powershell-gzipstream
      - id: micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
