# Header-stripped mapped Windows PE images executed as shellcode blobs via an
# external loader (such as BLOODALCHEMY, sRDI, or reflective/APC stage loaders).
# Because MZ and PE headers are removed, these stages classify as raw `data`,
# yet retain a native offset-0 function prologue alongside MSVC linker section
# descriptors and embedded Windows runtime strings.
defaults:
  platforms: [windows]
  for: [data]
  size_min: 4096
  size_max: 10485760
  attack: T1027,T1620

traits:
  - id: native-x86-x64-prologue-at-zero
    desc: Offset-zero x86 or x64 function prologue
    crit: component
    conf: 0.9
    if:
      type: hex
      offset: 0
      pattern: '(55 8B EC | 48 89 5C 24 | 48 83 EC | 40 53 48 83 EC | 40 55 48 8B EC)'

  - id: msvc-zzzdbg-section-marker
    desc: MSVC .rdata$zzzdbg marker in raw blob
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: '.rdata$zzzdbg'

  - id: msvc-rdata-data-section-names
    desc: PE .rdata section string in raw blob
    crit: component
    conf: 0.85
    if:
      type: text
      exact: '.rdata'

  - id: raw-cryptoapi-provider-name
    desc: Windows Cryptographic Provider in raw blob
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Microsoft (Enhanced|Base|Strong) Cryptographic Provider'

  - id: raw-utf16le-machine-guid
    desc: UTF-16LE MachineGuid registry value in raw blob
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: '4D 00 61 00 63 00 68 00 69 00 6E 00 65 00 47 00 75 00 69 00 64 00'

  - id: raw-utf16le-microsoft-cryptography-key
    desc: UTF-16LE Microsoft\Cryptography key in blob
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: '4D 00 69 00 63 00 72 00 6F 00 73 00 6F 00 66 00 74 00 5C 00 43 00 72 00 79 00 70 00 74 00 6F 00 67 00 72 00 61 00 70 00 68 00 79 00'

  - id: raw-rolling-bit-rotation-xor-decoder
    desc: Raw rolling bit-rotation XOR decoder
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: '(32|30) ?? [0-24] D2 (E0|E1|E2|E3|E6|E7) [0-12] D2 (E8|E9|EA|EB|EE|EF) [0-12] (0A|08) ?? (02|00)'

composite_rules:
  - id: headerless-mapped-pe-shellcode
    desc: Header-stripped mapped PE image with native offset-zero entry prologue
    crit: hostile
    conf: 0.99
    all:
      - id: native-x86-x64-prologue-at-zero
      - id: msvc-zzzdbg-section-marker
      - id: msvc-rdata-data-section-names
    any:
      - id: raw-cryptoapi-provider-name
      - id: micro-behaviors/communications/http/message::opaque-data-http1-version
      - id: raw-utf16le-machine-guid

  - id: headerless-rolling-xor-machineguid-implant
    desc: Headerless shellcode with rolling-XOR decoder and MachineGuid HTTP telemetry
    crit: hostile
    conf: 0.99
    attack: T1140,T1082,T1071.001
    all:
      - id: native-x86-x64-prologue-at-zero
      - id: raw-rolling-bit-rotation-xor-decoder
      - id: raw-utf16le-machine-guid
      - id: raw-utf16le-microsoft-cryptography-key
      - id: micro-behaviors/communications/http/message::opaque-data-http1-version
