defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-oversized-packed-text
    desc: High-entropy .NET text without large managed resources
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/section/entropy::oversized-high-entropy-text-section
    downgrade:
      any:
        - id: well-known/app/development/logitech/
        # A commercial .NET Reactor build is high-entropy by design; the protector
        # identity stays visible as its own notable finding.
        - id: metadata/build/protector::dotnet-reactor-module-guid-type
    unless:
      - id: metadata/binary/resource/identity::clr-resource-large
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
      - id: metadata/binary/framework::dotnet-selfcontained-bundle
