defaults:
  platforms: [windows]
  for: [data]

composite_rules:
  - id: overlapping-dos-pe-header-evasion
    desc: Overlapping DOS/PE header with section markers
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: metadata/binary/header/malformed::overlapping-dos-pe-header
      - id: metadata/binary/layout/embedded::data-file-pe-section-name
