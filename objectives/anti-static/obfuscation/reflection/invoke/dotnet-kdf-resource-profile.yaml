# Co-occurrence profile: no proof of byte flow or absence of disk writes.
defaults:
  crit: suspicious
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009

composite_rules:
  - id: dotnet-kdf-opaque-resource-reflection
    desc: Opaque CLR resource, KDF and reflection profile
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: micro-behaviors/crypto/kdf/password::rfc2898derivebytes-pe-reference
      - id: micro-behaviors/crypto/decrypt::dotnet-rijndael-decryptor
      - id: micro-behaviors/metaprogramming/reflection::dotnet-reflection-invoke-references
      - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-appdomain-load-instance-tokens
      - id: metadata/binary/section/entropy::near-maximum-code-section-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-corelib-assembly
