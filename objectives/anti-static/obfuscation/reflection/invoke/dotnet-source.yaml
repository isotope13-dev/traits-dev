defaults:
  crit: suspicious
  for: [csharp]
  platforms: [windows]
traits:
  - id: pinvoke-flooding
    desc: Dense P/Invoke declarations padding
    mbc: "B0032"
    attack: "T1027"
    conf: 0.85
    count_min: 10
    per_kb_min: 3.0
    if:
      type: string_literal
      substr: "DllImport"
  - id: appdomain-load-raw
    desc: CurrentDomain.Load string reference
    crit: notable
    mbc: "F0004.001"
    attack: "T1620"
    conf: 0.95
    if:
      type: string_literal
      substr: "CurrentDomain.Load"
