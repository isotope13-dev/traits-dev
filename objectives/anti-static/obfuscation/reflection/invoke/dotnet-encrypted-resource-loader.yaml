---
# AES/Rijndael-encrypted managed-resource loader — the decrypt-and-run stage of
# a managed crypter. The stub pulls an encrypted blob out of its own managed
# resources (ResourceManager/GetObject), derives the key with PBKDF2
# (Rfc2898DeriveBytes), decrypts it through the symmetric pipeline
# (RijndaelManaged / CreateDecryptor / CryptoStream), and reflectively loads
# and invokes the resulting assembly without touching disk. The packed .text
# body plus the high-entropy resource are the discriminators: a legitimate
# application that decrypts a bundled asset does not hide its own code behind
# near-maximum-entropy executable sections while invoking the plaintext
# through late-bound reflection.
defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: dotnet-aes-resource-reflective-loader
    desc: Packed .NET decrypts a resource and reflectively invokes it
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1620
    mbc: B0032,E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: metadata/binary/resource/size::clr-resource-high-entropy
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-reflective-invoke-any
    any:
      - id: micro-behaviors/crypto/kdf/password::rfc2898derivebytes-pe-reference
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
      - id: micro-behaviors/crypto/library/stdlib::dotnet-cryptostream
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-corelib-assembly
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-reference-pack-context
      - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
