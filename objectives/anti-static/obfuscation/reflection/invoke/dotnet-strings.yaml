defaults:
  platforms:
    - unix
    - windows
  for:
    - pe
    - csharp
# `property-info-class` and `type-info-class` moved to
# micro-behaviors/metaprogramming/reflection/runtime, where their identical
# sibling `method-info-class` already lived. A `System.Reflection.*` type name
# in the string table is a reflection capability, not an anti-static signal;
# filing it here meant every .NET binary that ships CoreLib metadata scored an
# obfuscation finding. The composites below still combine them, now by
# cross-directory reference, and it is the combination that carries the intent.
composite_rules:
  - id: property-info
    desc: Reflection property access
    crit: component
    conf: 0.55
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::property-info-class
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::get-properties-token
  - id: dotnet-resource-resolver-loader
    desc: .NET resource resolver loader
    crit: suspicious
    conf: 0.92
    attack: T1027.009
    for:
      - pe
      - dll
    platforms:
      - windows
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: micro-behaviors/metaprogramming/reflection/resolve::resolver-api-cluster
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
    any:
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/ratio::dotnet-low-entropy-text-carrier
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: objectives/anti-static/obfuscation/obfuscator/managed/
        - id: metadata/build/protector::smartassembly-or-poweredby-build-markers
        - id: metadata/build/protector::dotnet-reactor-module-guid-type
    unless:
      - id: metadata/signature/verified/platform::microsoft
  - id: dotnet-resource-delegate-injection-loader
    desc: .NET resource delegate and split API clues
    crit: hostile
    conf: 0.97
    attack: T1027.009
    mbc: B0009.014
    for:
      - pe
      - dll
    platforms:
      - windows
    all:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-resource-resolver-loader
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-delegate-reflection-async-api-references
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-split-api-fragments-delegate
    any:
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: metadata/binary/symbols/imports::single-import-raw
    needs: 2
    unless:
      - id: metadata/signature/verified/platform::microsoft
  - id: type-info
    desc: Runtime type inspection
    # GetType/typeof are too common in benign .NET code to surface on their
    # own; higher-order reflection loaders still reference this helper.
    crit: component
    conf: 0.7
    needs: 2
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::get-type-call
      - id: metadata/lang/source/syntax/operator::typeof-parenthesized-text
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::type-info-class
  # Activator + GetMethod co-occurrence is the Type.GetType(name).GetMethod(...)
  # .Invoke(null, [type, args]) shape used to reach Activator.CreateInstance
  # reflectively (so the literal "Activator.CreateInstance" never appears). A
  # building block for the reflective-invoke-any aggregate; not surfaced alone.
  - id: dotnet-reflection-emit-resource-stager
    desc: Unsigned .NET resource and Reflection.Emit references
    crit: notable
    conf: 0.98
    attack: T1027.009,T1620
    mbc: B0009.014
    for: [pe, dll]
    platforms: [windows]
    all:
      - id:
          micro-behaviors/metaprogramming/reflection/inspect/class/assembly::managed-resource-reflection-api-references
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: metadata/binary/resource/size::clr-resource-large
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: metadata/signature/absent::unsigned-missing-signature-record
