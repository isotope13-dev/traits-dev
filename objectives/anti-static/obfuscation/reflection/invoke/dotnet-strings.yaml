defaults:
  platforms:
    - unix
    - windows
  for:
    - pe
    - csharp
# `property-info-class` and `type-info-class` moved to
# micro-behaviors/process/interpreter/reflection/runtime, where their identical
# sibling `method-info-class` already lived. A `System.Reflection.*` type name
# in the string table is a reflection capability, not an anti-static signal;
# filing it here meant every .NET binary that ships CoreLib metadata scored an
# obfuscation finding. The composites below still combine them, now by
# cross-directory reference, and it is the combination that carries the intent.
composite_rules:
  - id: unsigned-binaryformatter-reflection-loader
    for:
    - pe
    desc: Unsigned .NET loader deserializes and reflectively invokes a stage
    crit: hostile
    conf: 0.97
    attack: T1027,T1055,T1140
    all:
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: micro-behaviors/data/serialize/unsafe::binary-formatter
    - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
    - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
    - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
    - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    unless:
    - id: metadata/binary/framework::dotnet-framework-api-surface
    # .NET single-file bundles spread these APIs across dozens of embedded
    # assemblies: the runtime DLL carries BinaryFormatter diagnostic strings
    # (SuppressIldasmAttributeDiagId, BinaryFormatterDiagId), Costura-style
    # resource loading supplies AssemblyResolve/InvokeMember, and ordinary app
    # code supplies ReadAllBytes/FromBase64String. The bundle startup entry is
    # the layout marker; compact obfuscated stage loaders do not carry it.
    - id: micro-behaviors/process/interpreter/runtime/clr::hostfxr-startup-entrypoint-reference
    - id: well-known/tool/sysadmin/chocolatey::official-library-dll
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/managed/dotnet-runtime/
    - id: well-known/tool/offensive/peas::winpeas-current-audit-assembly
    # A Native AOT image compiles the framework library into itself, so its
    # string table always holds BinaryFormatter, AssemblyResolve and
    # InvokeMember names without any program reaching for them.
    - id: metadata/lang/compiler/aot::nativeaot-runtime-markers
    # CompileAssemblyFromSource is a source compiler. Its Assembly.Load is the
    # compilation result, and BinaryFormatter / InvokeMember beside it are
    # other helpers, not one deserialized stage.
    - id: micro-behaviors/process/create/compile::compile-assembly-from-source-ref
  - id: property-info
    desc: Reflection property access
    crit: component
    conf: 0.55
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::property-info-class
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-properties-token
  - id: dotnet-resource-resolver-loader
    desc: .NET resource resolver loader
    crit: suspicious
    conf: 0.92
    attack: T1027.009
    for:
      - pe
      - dll
    platforms:
      - windows
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: micro-behaviors/metaprogramming/reflection::resolver-api-cluster
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/ratio::dotnet-low-entropy-text-carrier
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: objectives/anti-static/obfuscation/obfuscator/managed/
        - id: metadata/build/protector::dotnet-reactor-module-guid-type
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/resource/
  - id: dotnet-resource-delegate-injection-loader
    desc: .NET resource delegate injection loader
    crit: hostile
    conf: 0.97
    attack: T1027.009
    mbc: B0009.014
    for:
      - pe
      - dll
    platforms:
      - windows
    all:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-resource-resolver-loader
      - id: micro-behaviors/process/interpreter/reflection/runtime::delegate-invocation-chain
      - id: objectives/evasion/process/injection/toolkit::dotnet-split-winapi-injection-loader
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: metadata/binary/symbols/imports::single-import-raw
    needs: 2
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/resource/
  - id: type-info
    desc: Runtime type inspection
    # GetType/typeof are too common in benign .NET code to surface on their
    # own; higher-order reflection loaders still reference this helper.
    crit: component
    conf: 0.7
    needs: 2
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-type-call
      - id: micro-behaviors/process/interpreter/reflection/runtime::typeof-call
      - id: micro-behaviors/process/interpreter/reflection/runtime::type-info-class
  # Activator + GetMethod co-occurrence is the Type.GetType(name).GetMethod(...)
  # .Invoke(null, [type, args]) shape used to reach Activator.CreateInstance
  # reflectively (so the literal "Activator.CreateInstance" never appears). A
  # building block for the reflective-invoke-any aggregate; not surfaced alone.
  - id: dotnet-scrambled-reflective-crypter
    desc: .NET reflective resource loader with scrambled identity (crypter stub)
    crit: hostile
    conf: 0.95
    attack: T1027.009
    mbc: B0009.014
    for:
      - pe
      - dll
    platforms:
      - windows
    all:
      - id: micro-behaviors/metaprogramming/reflection::managed-resource-reflection-api-references
      - id: objectives/evasion/masquerade/versioninfo::scrambled-versioninfo-resource
    unless:
      - id: metadata/signed/platform::microsoft
  - id: dotnet-reflection-emit-resource-stager
    desc: Unsigned .NET resource loader uses reflection emit for dispatch
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1620
    mbc: B0009.014
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: micro-behaviors/metaprogramming/reflection::managed-resource-reflection-api-references
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: metadata/binary/resource/size::clr-resource-large
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
      - id: metadata/signed/platform/
      # System.Private.CoreLib implements Reflection.Emit, resource loading,
      # and Activator; it is not a payload stager. Self-contained .NET
      # distributions commonly ship this runtime assembly unsigned.
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-corelib-assembly
      # The .NET Framework System native image likewise defines these APIs;
      # its native-image code and managed resources are not a stager.
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-framework-system-native-image
      - id: well-known/app/productivity/thebrain::thebrain-known-app-context
      - id: metadata/package/testing/presence/harness::dotnet-test-project-directory-path
      - id: well-known/tool/development/toolchain/dotnet-arcade::dotnet-arcade-source-context
