# Two concealment mechanisms recovered and verified through their payloads.
# These require detailed CIL shapes plus resource and reflection semantics;
# generic XOR/Base64/reflection co-occurrence remains suspicious elsewhere.
# Region entropy corroborates packed data without depending on a particular
# CLR-resource parser version. ResourceManager plus the handoff shapes supply
# the resource context; entropy itself establishes no source-to-sink binding.
# Tokens are wildcarded, so these are static attack-pattern detections rather
# than a general CLR dataflow proof. No carrier family identity is required.
# Independent controls and limits: testdata/triage/iso-outer-loader/.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 4096
  size_max: 16777216
  crit: hostile
  conf: 0.97
  attack: T1027,T1620
composite_rules:
  - id: padded-resource-stage-activation
    desc: Concealed resource activation with padded argument shuffle
    all:
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
      - id: micro-behaviors/crypto/symmetric/xor/loop::cil-byte-array-keyed-xor
      - id: micro-behaviors/data/control-flow/sequence::cil-literal-helper-indexed-result
      - id: micro-behaviors/data/control-flow/sequence::cil-ten-slot-boxed-array
      - id: micro-behaviors/data/control-flow/sequence::cil-indexed-argument-permutation
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: metadata/binary/symbols/name/token::dotnet-create-instance-method-name
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-lateget-token
  - id: repaired-resource-split-name-dispatch
    desc: Concealed resource dispatch with repaired type and split method name
    all:
      - id: metadata/binary/layout/entropy::high-entropy-region-mass-64k
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
      - id: micro-behaviors/data/control-flow/sequence::cil-two-literal-helper-chain
      - id: micro-behaviors/data/control-flow/sequence::cil-three-literal-array-call
      - id: micro-behaviors/data/control-flow/sequence::cil-initialized-array-helper-dispatch
      - id: objectives/anti-static/obfuscation/reflection/encoded::reflection-assembly-substituted-separators
      - id: metadata/binary/symbols/name/token::reverse-name-token
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-lateget-token
