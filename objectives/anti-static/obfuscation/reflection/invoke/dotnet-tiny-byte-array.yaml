defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-tiny-byte-array-load-profile
    desc: Tiny .NET byte-array load profile
    crit: suspicious
    conf: 0.96
    size_max: 16384
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout/size::tiny-dotnet
      - id: metadata/binary/code/complexity::no-functions
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-appdomain-byte-array-load
    any:
      - id: objectives/evasion/process/injection/toolkit::managed-injection-stub
      - id: metadata/binary/symbols/imports::single-import-count
      - id: metadata/binary/layout/checksum::tiny-single-function-pe
    unless:
      - id: metadata/binary/vendor/
      - id: metadata/binary/resource/
