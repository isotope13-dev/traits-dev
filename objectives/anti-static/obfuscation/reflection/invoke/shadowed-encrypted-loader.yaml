defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: shadowed-encrypted-assembly-dispatch
  desc: Shadow heaps and encrypted assembly dispatch
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/header/malformed::dotnet-empty-shadow-heaps
  - id: metadata/binary/framework::clr-runtime-header
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::clr-base64-load-member-sequence
  - id: micro-behaviors/crypto/cipher::clr-key-mode-setup-sequence
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
  attack: T1027
- id: shadow-heaps-resolve-invocation-stub
  desc: Shadow-heap module hooks resolution, invokes resolved stubs
  crit: hostile
  conf: 0.96
  attack: T1027,T1129
  all:
  - id: metadata/binary/header/malformed::dotnet-empty-shadow-heaps
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
  any:
  - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
  - id: micro-behaviors/process/terminate/kill::process-kill-by-id-references
