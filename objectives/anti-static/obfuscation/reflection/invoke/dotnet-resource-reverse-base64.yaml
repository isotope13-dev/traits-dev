defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027,T1620

composite_rules:
  - id: dotnet-reversed-resource-reflection
    desc: Encoded resource with reflective invocation
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: metadata/binary/symbols/name/token/runtime::reverse-name-token
      - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::get-assembly-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::dotnet-metadata-invoke-members
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: metadata/binary/code/entropy::high-code-entropy
