defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: dotnet-split-api-fragments-delegate
    desc: Managed delegate and split API fragments
    crit: suspicious
    conf: 0.96
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: metadata/lang/natural/vocabulary/system-control::split-virtual-api-fragment
      - id: metadata/lang/natural/vocabulary/system-control::split-alloc-api-fragment
      - id: metadata/lang/natural/vocabulary/system-control::split-write-api-fragment
      - id: metadata/lang/natural/vocabulary/system-control::split-memory-api-fragment
    any:
      - id: metadata/lang/natural/vocabulary/system-control::split-open-process-fragment
      - id: metadata/lang/natural/vocabulary/system-control::split-kernel-api-fragment
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-library-context
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-package-context
