defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: assembly-bytes-buffer
    desc: Assembly bytes buffer token
    crit: notable
    conf: 0.84
    if:
      type: text
      exact: assemblyBytes
  - id: html-appdomain-byte-array-reflection
    desc: HTML contains AppDomain reflection chain
    crit: suspicious
    conf: 0.97
    for: [html]
    attack: T1620
    mbc: E1059
    if:
      type: text
      regex: '(?i)AppDomain.{0,500}GetMethod.{0,500}Invoke'
    unless:
      # Rendered source is page content, not an invocation performed by the
      # GitHub page itself.
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
  - id: html-char-array-stage
    desc: HTA converts payload text to characters
    crit: notable
    conf: 0.9
    for: [html]
    if:
      type: text
      substr: ToCharArray
  - id: html-array-reverse
    desc: HTA reverses an array
    crit: notable
    conf: 0.95
    for: [html]
    if:
      type: text
      substr: '[Array]::Reverse'

composite_rules:
  # The stub bypasses AMSI, applies a repeating-key CIL XOR transform to a
  # long Base64 blob, inflates it as GZip, then loads and invokes the managed
  # assembly entry point. This combination identifies an in-memory payload
  # loader rather than reflection or compression alone.
  - id: dotnet-amsi-xor-gzip-entrypoint-loader
    desc: .NET AMSI bypass decrypts and invokes an embedded assembly in memory
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1562.001,T1620
    mbc: B0032,E1059
    all:
      - id: objectives/evasion/anti-av/amsi::amsi-memory-patch-hostile
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::cil-indexed-key-byte-array-xor-loop
      - id: micro-behaviors/data/codec::dotnet-gzip-compression
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::dotnet-entrypoint-launch-members

  - id: html-reversed-base64-assembly-stage
    desc: HTA reverses Base64 assembly data
    crit: notable
    conf: 0.97
    for: [html]
    attack: T1027, T1140
    mbc: B0032
    all:
      - id: html-char-array-stage
      - id: html-array-reverse
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: html-reflective-encoded-assembly-loader
    desc: HTA encoded reflective assembly loader
    crit: hostile
    conf: 0.99
    for: [html]
    attack: T1027, T1140, T1620
    mbc: B0032, E1059
    all:
      - id: html-appdomain-byte-array-reflection
      - id: html-reversed-base64-assembly-stage
  # AppDomain.Load(byte[]) can dispatch without Activator/CreateInstance: the
  # loader enumerates the returned assembly and invokes a named member on a
  # discovered type. Keep this reflection primitive neutral until a resource
  # or another concealed payload source establishes the staging objective.
  - id: dotnet-currentdomain-type-invokemember
    desc: .NET AppDomain assembly load with named-member invocation
    crit: notable
    conf: 0.96
    attack: T1620
    mbc: E1059
    near_bytes: 4096
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::load-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::gettypes-member-token
      - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
      - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token

  - id: dotnet-network-resource-method-loader
    desc: Downloads Base64 resource for reflective execution
    crit: hostile
    conf: 0.96
    attack: "T1105,T1140,T1620"
    mbc: E1059
    # IL-merged and framework-bundled libraries carry each leg in a different
    # assembly image. The download, decode, and invoke of one stub land together.
    near_bytes: 1048576
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/communications/http/get::getstringasync
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: metadata/binary/resource/size::clr-resource-large
      # Mere co-occurrence is common in large IL-merged applications: an HTTP
      # client, credential/JSON Base64 decoding, resources, and library
      # reflection may all belong to unrelated subsystems. Require both access
      # to a managed resource and the explicit Assembly.Load + Invoke chain
      # before describing the combination as a reflective payload loader.
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
    unless:
      # Fiddler Classic is a signed .NET HTTP debugger. Its update client,
      # encoded resources, and reflection-based UI/scripting infrastructure
      # satisfy this generic loader shape without being a payload loader.
      - id: well-known/app/network/fiddler::fiddler-classic
  - id: dotnet-hex-encoded-pe-delegate-loader
    desc: Hex-encoded PE with reflection references
    crit: suspicious
    conf: 0.97
    attack: T1027,T1620
    mbc: E1059
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::load-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::gettypes-member-token
      - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-create-delegate-reference
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::action-member-token
      - id: metadata/file/encoding/hex::hex-encoded-pe-image
      - id: metadata/binary/resource/size::clr-resource-large

  # The suspicious hex/delegate rule above rests on name tokens and file-wide
  # co-occurrence: a hex-text PE plus reflection references. This hostile rule
  # additionally requires the compiled execution path that turns the stage
  # into code: a managed-resource read, a manual hex-pair decode loop
  # (Substring with radix-16 conversion at adjacent CIL call sites), a
  # byte-buffer Assembly/AppDomain load, type/method discovery, and a
  # delegate DynamicInvoke dispatch. Plugin hosts and resource-backed UI
  # applications ship the tokens but not the hex-encoded stage together with
  # its decode-and-invoke chain.
  - id: dotnet-hex-pe-resource-reflective-loader
    desc: Hex-encoded PE stage decoded and invoked in memory
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1620
    mbc: E1059
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/resource/size::clr-resource-large
      - id: metadata/file/encoding/hex::hex-encoded-pe-image
      - id: micro-behaviors/data/embedded/resource::dotnet-cil-resource-read-call
      - id: micro-behaviors/data/decode/hex::cil-substring-radix16-byte-decode
      - id: micro-behaviors/data/decode/charset::cil-encoding-getstring-call
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::gettypes-member-token
      - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-delegate-dynamic-invoke-call

  # Hostile only when the reflective/decode chain is paired with the generic
  # Visual Studio template identity and a renamed on-disk PE. This keeps
  # ordinary plugin hosts and resource-backed UI applications at suspicious or
  # notable while catching the opaque stub shape seen in commodity loaders.
  - id: dotnet-template-resource-reflective-loader
    desc: .NET template stub decodes resource and invokes it
    crit: hostile
    conf: 0.97
    attack: "T1027.009,T1140,T1620,T1036.005"
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/resource/size::clr-resource-large
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/tool/packaging/nuget-cli::nuget-cli-tool

  - id: dotnet-template-resource-reflective-stage
    desc: .NET template resource decodes for reflective staging
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1620
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/resource/size::clr-resource-large
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::methodbase-class
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/tool/packaging/nuget-cli::nuget-cli-tool
      # A VB.NET app that ships a vendor VERSIONINFO block and a Visual Studio
      # PDB path is a product build; embedded images in a large CLR resource
      # plus Convert.FromBase64String plus MethodBase is what such an app looks
      # like, not a reflective stager.
      - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
  - id: dotnet-encrypted-overlay-reflective-loader
    desc: .NET encrypted overlay loader invokes a reflected payload
    crit: hostile
    conf: 0.98
    attack: "T1027.009,T1140,T1620"
    mbc: "B0030,B0040"
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/layout/size::large-overlay-64k
      - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readallbytes-token
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
    unless:
      # The .NET single-file host's overlay is the bundled app, not a payload.
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
  - id: dotnet-in-memory-assembly-invoke
    desc: .NET in-memory assembly invoke chain
    crit: suspicious
    conf: 0.93
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
      - id: assembly-bytes-buffer
    any:
      - id: metadata/lang/source/naming/action/function-name::load-and-invoke-name
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::gettypes-member-token
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
  - id: dotnet-appdomain-byte-array-load
    desc: .NET AppDomain byte array loader
    crit: suspicious
    conf: 0.95
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::loadassembly-member-token
      - id: assembly-bytes-buffer
      - id: metadata/binary/layout/size::tiny-dotnet
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
