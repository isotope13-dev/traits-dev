defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: dotnet-invoke-token
    desc: MethodBase.Invoke reflection token
    crit: notable
    conf: 0.8
    if:
      type: text
      exact: MethodBase.Invoke
  - id: assembly-bytes-buffer
    desc: Assembly bytes buffer token
    crit: notable
    conf: 0.84
    if:
      type: text
      exact: assemblyBytes
  - id: html-appdomain-byte-array-reflection
    desc: HTML contains AppDomain reflection chain
    crit: suspicious
    conf: 0.97
    for: [html]
    attack: T1620
    mbc: E1059
    if:
      type: text
      regex: '(?i)AppDomain.{0,500}GetMethod.{0,500}Invoke'
    unless:
      # Rendered source is page content, not an invocation performed by the
      # GitHub page itself.
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
  - id: html-char-array-stage
    desc: HTA converts payload text to characters
    crit: notable
    conf: 0.9
    for: [html]
    if:
      type: text
      substr: ToCharArray
  - id: html-array-reverse
    desc: HTA reverses an array
    crit: notable
    conf: 0.95
    for: [html]
    if:
      type: text
      substr: '[Array]::Reverse'

composite_rules:
  - id: html-reversed-base64-assembly-stage
    desc: HTA reverses Base64 assembly data
    crit: notable
    conf: 0.97
    for: [html]
    attack: T1027, T1140
    mbc: B0032
    all:
      - id: html-char-array-stage
      - id: html-array-reverse
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: html-reflective-encoded-assembly-loader
    desc: HTA encoded reflective assembly loader
    crit: hostile
    conf: 0.99
    for: [html]
    attack: T1027, T1140, T1620
    mbc: B0032, E1059
    all:
      - id: html-appdomain-byte-array-reflection
      - id: html-reversed-base64-assembly-stage
  # AppDomain.Load(byte[]) can dispatch without Activator/CreateInstance: the
  # loader enumerates the returned assembly and invokes a named member on a
  # discovered type. Keep this reflection primitive neutral until a resource
  # or another concealed payload source establishes the staging objective.
  - id: dotnet-currentdomain-type-invokemember
    desc: .NET AppDomain assembly load with named-member invocation
    crit: notable
    conf: 0.96
    attack: T1620
    mbc: E1059
    near_bytes: 4096
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-class-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-methods-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
  - id: dotnet-explicit-load-api
    desc: .NET explicit assembly load API
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-text
      - id: objectives/anti-static/obfuscation/reflection/class::dotnet-assembly-loadfrom
  - id: dotnet-assembly-load-invoke
    desc: .NET dynamic assembly load and invoke
    crit: suspicious
    conf: 0.92
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: dotnet-explicit-load-api
      - id: dotnet-invoke-token
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: metadata/lang/compiler/managed::get-method-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::method-info-class
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class

  - id: dotnet-network-resource-method-loader
    desc: Downloads Base64 resource for reflective execution
    crit: hostile
    conf: 0.96
    attack: "T1105,T1140,T1620"
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::getstringasync
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: metadata/binary/resource/identity::clr-resource-large
      # Mere co-occurrence is common in large IL-merged applications: an HTTP
      # client, credential/JSON Base64 decoding, resources, and library
      # reflection may all belong to unrelated subsystems. Require both access
      # to a managed resource and the explicit Assembly.Load + Invoke chain
      # before describing the combination as a reflective payload loader.
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: dotnet-assembly-load-invoke
      - id: micro-behaviors/process/interpreter/reflection/runtime::reflection-method-access
    unless:
      # Fiddler Classic is a signed .NET HTTP debugger. Its update client,
      # encoded resources, and reflection-based UI/scripting infrastructure
      # satisfy this generic loader shape without being a payload loader.
      - id: well-known/app/network/fiddler::fiddler-classic
  - id: dotnet-assembly-load-delegate-invoke
    desc: .NET assembly load delegate invocation
    crit: suspicious
    conf: 0.94
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-methods-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-delegate
      - id: micro-behaviors/process/interpreter/reflection/runtime::action-member-token
    # Reflection.Emit (a code-generating host) is the softening context here
    # and in the siblings below. The whole `managed/` directory was named
    # instead, which also holds the `reflection-namespace` leg and pinned
    # these rules to notable.
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
        - id: metadata/binary/vendor/
    unless:
      - id: well-known/lib/vendor-sdk/hypertube::hypertube-benign-runtime-context
      - id: well-known/lib/vendor-sdk/hypertube::netcore-assembly-basename

  # Hex text of a PE image (DOS header and the DOS stub sentence) is a
  # concealed executable stage. The delegate-invoke chain stays suspicious
  # on its own because plugin hosts use it; encrypted-resource loaders miss
  # this stage because hex text sits near entropy 4. A large managed
  # resource co-occurs with that image and the invoke chain; this does not
  # prove the decoded bytes are the argument to Assembly.Load.
  - id: dotnet-hex-encoded-pe-delegate-loader
    desc: Hex-encoded PE with reflective delegate invoke
    crit: hostile
    conf: 0.97
    attack: T1027,T1620
    mbc: E1059
    all:
      - id: dotnet-assembly-load-delegate-invoke
      - id: metadata/file/encoded::hex-encoded-pe-image
      - id: metadata/binary/resource/identity::clr-resource-large
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/vendor-sdk/hypertube::hypertube-benign-runtime-context
      - id: well-known/lib/vendor-sdk/hypertube::netcore-assembly-basename

  # Hostile only when the reflective/decode chain is paired with the generic
  # Visual Studio template identity and a renamed on-disk PE. This keeps
  # ordinary plugin hosts and resource-backed UI applications at suspicious or
  # notable while catching the opaque stub shape seen in commodity loaders.
  - id: dotnet-template-resource-reflective-loader
    desc: .NET template stub decodes resource and invokes it
    crit: hostile
    conf: 0.97
    attack: "T1027.009,T1140,T1620,T1036.005"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/resource/identity::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/runtime::reflection-method-access
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/nuget-cli::nuget-cli-tool

  - id: dotnet-template-resource-reflective-stage
    desc: .NET template resource decodes for reflective staging
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/resource/identity::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/nuget-cli::nuget-cli-tool
      # A VB.NET app that ships a vendor VERSIONINFO block and a Visual Studio
      # PDB path is a product build; embedded images in a large CLR resource
      # plus Convert.FromBase64String plus MethodBase is what such an app looks
      # like, not a reflective stager.
      - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context

  - id: dotnet-entrypoint-reflection
    desc: .NET entry point reflection access
    crit: suspicious
    conf: 0.92
    attack: T1620
    mbc: E1059
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
      - id: dotnet-invoke-token
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
      - id: dotnet-explicit-load-api
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
  - id: dotnet-encrypted-overlay-reflective-loader
    desc: .NET encrypted overlay loader invokes a reflected payload
    crit: hostile
    conf: 0.98
    attack: "T1027.009,T1140,T1620"
    mbc: "B0030,B0040"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout/overlay::large-overlay-64k
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/interpreter/reflection/runtime::reflection-method-access
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
  - id: dotnet-in-memory-assembly-invoke
    desc: .NET in-memory assembly invoke chain
    crit: suspicious
    conf: 0.93
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: assembly-bytes-buffer
    any:
      - id: micro-behaviors/metaprogramming/reflection::load-and-invoke-name
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
        - id: metadata/binary/vendor/
  - id: dotnet-appdomain-byte-array-load
    desc: .NET AppDomain byte array loader
    crit: suspicious
    conf: 0.95
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-class-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::loadassembly-member-token
      - id: assembly-bytes-buffer
      - id: metadata/binary/layout/size::tiny-dotnet
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
        - id: metadata/binary/vendor/
  - id: dotnet-appdomain-callbyname-load
    desc: .NET AppDomain CallByName loader
    crit: suspicious
    conf: 0.95
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-class-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::getdomain-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-callbyname-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-constructors-token
      - id: micro-behaviors/metaprogramming/reflection::dotnet-assembly-type-reference
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
        - id: metadata/binary/vendor/
  # LateGet is the VB late-binding twin of CallByName used by bitmap
  # stego crypters (Load/CreateInstance often Base64-obscured in #US).
  - id: dotnet-appdomain-lateget-load
    desc: .NET AppDomain LateGet loader
    crit: suspicious
    conf: 0.95
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-class-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::getdomain-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-lateget-token
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-base64-assembly-load-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-base64-create-instance-token
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
        - id: metadata/binary/vendor/
  # The C# spelling of the same loader: AppDomain.CurrentDomain.Load(byte[])
  # hands back an assembly whose exported types are instantiated through
  # Activator.CreateInstance, with no VB late-binding helper in between.
  # Plugin hosts do the same, so it stays notable until a concealed payload
  # source (a pixel-packed bitmap, an encrypted resource) feeds it.
  - id: dotnet-appdomain-activator-load
    desc: .NET AppDomain load with Activator instantiation
    crit: notable
    conf: 0.9
    attack: T1620
    mbc: E1059
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-instance-token
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::reflection-emit
        - id: metadata/binary/vendor/
