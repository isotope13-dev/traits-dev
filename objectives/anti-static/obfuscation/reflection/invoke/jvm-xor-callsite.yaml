# A shifted-key string XOR loop beside the bootstrap's decoded-member
# resolution layout. CP names corroborate the bytecode; indexes, class names,
# keys and call-target strings are deliberately unpinned. This is a suspicious
# obfuscation pattern, not proof that any particular hidden API is invoked.
defaults:
  for: [class]
  platforms: [windows, unix]
traits:
  - id: jvm-shifted-xor-callsite-resolver
    desc: Shifted-XOR decoder beside JVM call resolver
    crit: suspicious
    conf: 0.95
    attack: T1027
    if:
      type: yara
      source: |
        rule jvm_shifted_xor_callsite_resolver {
          strings:
            $callsite = "java/lang/invoke/MutableCallSite" ascii
            $descriptor = "fromMethodDescriptorString" ascii
            $target = "setTarget" ascii
            $builder = "java/lang/StringBuilder" ascii
            // Character read, XOR with the key's upper half, in-place write
            // and a backward loop check. CP indexes vary across builds.
            $xor_loop = {
              03 2C 5F 5A B6 ?? ?? 1B 10 10 7C 82
              2C 5D 58 5B 57 5B 57 5F 5B 5F B6 ?? ??
              04 60 59 2C B6 ?? ?? A1 FF ??
            }
            // Two integer operands feed a decoder; its returned string is
            // split and the first member consumed by a class lookup.
            $member_layout = {
              15 ?? 15 ?? B8 ?? ?? (12 ?? | 13 ?? ??)
              B6 ?? ?? 3A ?? 19 ?? 03 32 B8 ?? ?? 3A ??
            }
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
