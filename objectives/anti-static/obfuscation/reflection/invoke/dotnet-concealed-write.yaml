# Reflection, a dense region, file write and child process are present, but
# the matcher does not show that the written bytes are the launched target.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-reflection-write-child-profile
    desc: .NET reflection, dense region, write and child-process clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/data-blob::low-entropy-binary-with-dense-region
      - id: micro-behaviors/metaprogramming/reflection::activator-getmethod-references
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
    unless:
      - id: metadata/binary/linking/static::ilrepack-list-resource
