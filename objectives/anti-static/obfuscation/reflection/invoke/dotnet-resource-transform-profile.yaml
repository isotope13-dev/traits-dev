# These are suspicious static profiles. The engine does not resolve CLR
# tokens or bind a resource transform's output to a reflected call; no
# execution, persistence or malicious decoded stage is inferred here.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.93
  attack: T1027
composite_rules:
  - id: dotnet-keyed-resource-reflection-profile
    desc: Packed managed resource with keyed byte transform and reflected types
    all:
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::cil-byte-array-keyed-xor
      - id: micro-behaviors/data/embedded/resource::dotnet-resourcemanager
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::gettypes-member-token
      - id: metadata/binary/symbols/name/token/runtime::dotnet-create-instance-method-name
