# These are suspicious static profiles. The engine does not resolve CLR
# tokens or bind a resource transform's output to a reflected call; no
# execution, persistence or malicious decoded stage is inferred here.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.93
  attack: T1027
composite_rules:
  - id: dotnet-keyed-resource-reflection-profile
    desc: Packed managed resource with keyed byte transform and reflected types
    all:
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/crypto/symmetric/xor/loop::cil-byte-array-keyed-xor
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-instance-token
  - id: dotnet-reversed-base64-resource-reflection-profile
    desc: Packed managed resource with reversed Base64 and reflected member references
    all:
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/manipulation::dotnet-reverse-member-token
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
    unless:
      - id: well-known/lib/ui/devexpress/
      # A base64 token/rank vocabulary is decoded from a managed resource.
      - id: well-known/lib/ai/tiktoken::tiktoken-bpe-rank-table-resource
      - id: well-known/lib/runtime/managed/metalama/
