defaults:
  platforms: [unix]
  for: [kotlin, class, java_class]
  attack: T1027

traits:
  - id: kotlin-processbuilder-forname
    desc: Kotlin ProcessBuilder forName
    crit: suspicious
    conf: 0.94
    for: [kotlin]
    if:
      type: text
      substr: Class.forName("java.lang.ProcessBuilder")
  - id: morphe-gui-main-class
    desc: Morphe GUI main class reference
    crit: notable
    conf: 0.95
    for: [class, java_class]
    if:
      type: text
      substr: app.morphe.gui.GuiMainKt
  - id: morphe-internal-gui-subprocess-flag
    desc: Morphe internal GUI subprocess flag
    crit: notable
    conf: 0.95
    for: [class, java_class]
    if:
      type: text
      substr: --internal-gui-subprocess

composite_rules:
  - id: kotlin-reflection-command-exec
    desc: Kotlin reflection command exec
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: kotlin-processbuilder-forname
      - id: micro-behaviors/process/create/spawn::java-processbuilder
      - id: micro-behaviors/data/embedded/script::embedded-bash-shebang

  - id: jvm-reflection-command-exec
    desc: JVM reflection paired with command execution
    crit: suspicious
    conf: 0.98
    for: [class, java_class]
    scope: leaf
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode-symbol
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
      - id: micro-behaviors/data/embedded/script::embedded-bash-shebang
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-java-server-package
      - id: well-known/tool/development/bazel-diff::bazel-diff-bzlmod-test-fixture
      - id: well-known/app/development/lyric::lyric-toolchain-context
      - id: well-known/app/development/vscode-extension/lingua-franca-vscode/
      - id: well-known/lib/core/apache-felix/
      - id: well-known/lib/runtime/jrebel::browser-controller-class
      - id: jvm-library-reflection-context

  - id: morphe-launcher-reflection-context
    desc: Morphe desktop self-launcher reflection plus self-exec
    crit: exception
    conf: 0.97
    all:
      - id: morphe-gui-main-class
      - id: morphe-internal-gui-subprocess-flag

  - id: jvm-library-reflection-context
    desc: Known JVM libraries using reflection
    crit: exception
    conf: 0.98
    any:
      - id: well-known/lib/data/h2/
      - id: well-known/lib/development/aspectj/
      - id: well-known/lib/development/antlr::antlr-build-tool-class
      - id: well-known/lib/platform/eclipse-osgi/
      - id: well-known/lib/core/apache-felix/
      - id: well-known/lib/development/lombok/
      - id: well-known/lib/format/jline/
      # JMH forks JVMs (ProcessBuilder/Runtime.exec) and uses reflective
      # setAccessible probing — that pairing is the harness's core function.
      - id: well-known/lib/development/jmh/
      - id: morphe-launcher-reflection-context
