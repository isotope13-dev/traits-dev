# Dalvik DEX Reflection Patterns
# The generic reflect.* descriptor and getDeclared* atoms that fed these
# composites live in micro-behaviors/data/source/dynamic/reflect/java.yaml:
# they are `for: [class]` JVM facts that fired as "Dalvik ... reflection"
# obfuscation on every reflective jar (a JNA HVNC RAT, 2026-09). The bare
# attachBaseContext word matched the same way on Buck's exopackage support
# (react-native 0.62.0-rc.2, benign): the override is a neutral lifecycle
# capability, so the composites reference
# micro-behaviors/process/lifecycle/runtime-init::attach-base-context and no
# objectives atom restates it.
# Detects heavy reflection usage in Dalvik bytecode (classes.dex)
# Used by Android rootkits/trojans as minimal loader stubs
# ATT&CK: T1406 (Obfuscated Files or Information — Android)
defaults:
  platforms: [android]
  for: [class]
  mbc: "F0006"
  attack: "T1406"

traits:
  - id: dalvik-basedexclassloader-name
    desc: Dalvik BaseDexClassLoader name
    crit: notable
    conf: 0.85
    if:
      type: text
      word: "BaseDexClassLoader"

  - id: dalvik-minimal-stub
    desc: Tiny file with very few strings
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: binary.string_count
      max: 120
    size_max: 20000

composite_rules:
  - id: dalvik-reflection-api-cluster
    desc: Dalvik reflection API cluster
    crit: component
    conf: 0.9
    needs: 3
    any:
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-reflect-method-descriptor
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-reflect-field-descriptor
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-reflect-constructor-descriptor
      - id: "micro-behaviors/metaprogramming/reflection::set-accessible-reference"
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-get-declared-method
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-get-declared-field
    all:
      - id: micro-behaviors/process/create/loader::dalvik-runtime-classloader-descriptor

  - id: dalvik-heavy-reflection
    desc: Dalvik loader reflection cluster
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/tool/development/build/buck/
    all:
      - id: dalvik-reflection-api-cluster
    any:
      # The attachBaseContext leg is the neutral lifecycle capability in
      # micro-behaviors/process/lifecycle/runtime-init: overriding it is
      # ordinary bootstrap (MultiDex, Hilt, Buck exopackage), so the
      # objectives tier must not restate it as an obfuscation marker. The
      # composite supplies the loader intent around it.
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: micro-behaviors/data/archive/extract/zip::jvm-zipfile-class-reference
      - id: micro-behaviors/process/create/loader::dex-class-loader
      - id: dalvik-basedexclassloader-name

  - id: dalvik-dropper-stub
    desc: Minimal Dalvik loader with reflection
    crit: suspicious
    conf: 0.92
    all:
      - id: dalvik-minimal-stub
      - id: dalvik-heavy-reflection
    any:
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: micro-behaviors/data/archive/extract/zip::jvm-zipfile-class-reference
