defaults:
  platforms: [windows, unix]
  for:
    - java
    - class
composite_rules:
  # Source and bytecode express the same technique with different facts: a
  # `.java` file never has bytecode-only facts (class refs, JVM imports) and a
  # `.class` file never has source-only facts (symbol/text matches), so the
  # pairing has to be all-source or all-bytecode, never mixed.
  - id: java-classloader-dropper-source
    desc: Java classloader dropper pattern (source)
    crit: component
    conf: 0.95
    for: [java]
    all:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-urlclassloader-api
      - id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke

  - id: java-classloader-dropper-bytecode
    desc: Java classloader dropper pattern (bytecode)
    crit: component
    conf: 0.95
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode

  - id: java-classloader-dropper
    desc: Java classloader dropper pattern
    crit: suspicious
    conf: 0.95
    any:
      - id: java-classloader-dropper-source
      - id: java-classloader-dropper-bytecode
    unless:
      # A URLClassLoader over a downloaded distribution is the Gradle
      # wrapper's documented mechanism, not a dropper.
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class

  - id: java-archive-base64-classloader-loader
    desc: JAR decodes an embedded classloader payload
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1027,T1140,T1620
    for: [binaries, '!dex', scripts, '!jcl', jar]
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-class
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
