defaults:
  platforms: [windows, unix]
  for:
    - java
    - class
composite_rules:
  - id: java-archive-base64-classloader-loader
    desc: JAR decodes an embedded classloader payload
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1027,T1140,T1620
    for: [binaries, '!dex', scripts, '!jcl', jar]
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-class
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
    unless:
      - id: well-known/lib/runtime/scripted/mozilla-rhino
