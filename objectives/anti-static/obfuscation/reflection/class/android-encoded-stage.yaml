defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1406
composite_rules:
  # DEX call offsets put these sites within a bounded code region. This
  # describes a cluster; it does not claim argument-level data flow.
  - id: dex-encoded-reflective-file-cluster
    desc: Base64, file creation and reflection call cluster
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::dex-base64-decode-call
      - id: micro-behaviors/fs/file/create::dex-create-new-file-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-declared-method-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-reflective-method-invoke-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dex-reflective-constructor-call
  - id: android-encoded-reflective-stage-obfuscation
    desc: Encoded DEX data with obscured reflective staging clues
    crit: hostile
    conf: 0.96
    all:
      - id: dex-encoded-reflective-file-cluster
      - id: objectives/execution/payload/module-load/transformed::dex-digit-interleaved-identifiers
      - id: objectives/execution/payload/module-load/transformed::dex-large-base64-data
