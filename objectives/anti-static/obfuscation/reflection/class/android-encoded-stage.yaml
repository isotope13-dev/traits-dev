defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1406
traits:
  - id: dex-large-base64-data
    desc: DEX contains very large Base64-shaped string
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '^[A-Za-z0-9+/]+={0,2}$'
      length_min: 50000
    not:
      - regex: '^(iVBORw0KGgo|/9j/4|R0lGOD[dl]h|UklGR|JVBERi0)'
  - id: dex-digit-interleaved-identifiers
    desc: Repeated digit-interleaved DEX identifier text
    crit: notable
    conf: 0.94
    count_min: 4
    if:
      type: text
      regex: '^([A-Za-z][0-9]+){4}[A-Za-z0-9]*$'
  - id: dex-base64-decode-call
    desc: DEX calls Android Base64 decoder
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/util/Base64;->decode'
  - id: dex-create-new-file-call
    desc: DEX calls file creation API
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/io/File;->createNewFile'
  - id: dex-reflective-method-invoke-call
    desc: DEX invokes reflective method
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/reflect/Method;->invoke'
composite_rules:
  # DEX call offsets put these sites within a bounded code region. This
  # describes a cluster; it does not claim argument-level data flow.
  - id: dex-encoded-reflective-file-cluster
    desc: Base64, file creation and reflection call cluster
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: dex-base64-decode-call
      - id: dex-create-new-file-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-declared-method-call
      - id: dex-reflective-method-invoke-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dex-reflective-constructor-call
  - id: android-encoded-reflective-stage-obfuscation
    desc: Encoded DEX data with obscured reflective staging clues
    crit: hostile
    conf: 0.96
    all:
      - id: dex-encoded-reflective-file-cluster
      - id: dex-digit-interleaved-identifiers
      - id: dex-large-base64-data
