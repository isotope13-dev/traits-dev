defaults:
  platforms: [android]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: jni-decrypt-assets-export
    desc: JNI asset decryption method export
    if:
      type: symbol
      kind: export
      regex: '^Java_[A-Za-z0-9_]+_decryptAssets__'
  - id: jni-install-package-export
    desc: JNI package installation method export
    if:
      type: symbol
      kind: export
      regex: '^Java_[A-Za-z0-9_]+_installPackage__'
  - id: jni-start-installation-once-export
    desc: JNI single-start installation method export
    if:
      type: symbol
      kind: export
      regex: '^Java_[A-Za-z0-9_]+_startInstallationOnce__'
composite_rules:
  - id: android-native-opaque-asset-installer-vpn
    desc: Native asset decryption and installer with opaque assets and VPN
    crit: hostile
    conf: 0.94
    for: [android_apk, apk_android, apk, zip, elf, dex]
    scope: archive
    all:
      - id: jni-decrypt-assets-export
      - id: jni-install-package-export
      - id: jni-start-installation-once-export
      - id: metadata/archive/compression::archive-unknown-compression-method
      - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
      - id: micro-behaviors/dylib/load/runtime::android-package-install-native-load-clues
      - id: micro-behaviors/network/tunnel::android-vpn-service-class
