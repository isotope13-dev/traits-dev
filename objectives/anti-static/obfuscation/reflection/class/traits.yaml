defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
traits:
- id: python-import-chain
  desc: Nested Python __import__ calls
  crit: notable
  conf: 0.9
  for: [python, pyc]
  if:
    type: text
    regex: '__import__\([^\)\n]{0,50}__import__\('
# The type the defineClass(name, b, off, len, ProtectionDomain) overload
# takes; the class-definition composites below use it as a loader leg. Self
# path lookups are micro-behaviors/process/info/selfpath::java-protection-domain.
- id: go-plugin-open
  desc: Go plugin.Open dynamic load
  crit: notable
  if:
    type: text
    substr: plugin.Open
- id: go-plugin-lookup
  desc: Go plugin.Lookup
  crit: notable
  if:
    type: text
    substr: plugin.Lookup
- id: go-plugin-symbol
  desc: Go plugin.Symbol
  crit: notable
  if:
    type: text
    substr: plugin.Symbol
composite_rules:
- id: python-import
  desc: Nested Python dynamic imports
  crit: suspicious
  conf: 0.85
  # A PE that embeds the standard Python/PyInstaller runtime inherits the
  # runtime's import machinery. Analyze the dynamic-import objective on the
  # Python source/bytecode member where it is an authored behavior, not on the
  # native wrapper that bundles it.
  for: [python]
  all:
  - id: python-import-chain
  - id: micro-behaviors/os/module/load/name::dunder-import-call
  unless:
  - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
- id: dotnet-reflection
  desc: .NET reflection assembly loading
  crit: notable
  conf: 0.85
  platforms:
  - windows
  for: [pe, csharp]
  any:
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-text
  - id: micro-behaviors/os/module/load/path::dotnet-assembly-loadfrom
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::activator-createinstance-token
  - id: micro-behaviors/metaprogramming/reflection/resolve::type-gettype-call
  - id: micro-behaviors/metaprogramming/reflection/invoke::methodinfo-invoke-text
  unless:
  - id: metadata/binary/resource/
  - id: well-known/tool/reverse-engineering/ilspy::ilspy-component
- id: go-plugin
  desc: Go plugin dynamic loading
  crit: notable
  conf: 0.9
  any:
  - id: go-plugin-open
  - id: go-plugin-lookup
  - id: go-plugin-symbol
