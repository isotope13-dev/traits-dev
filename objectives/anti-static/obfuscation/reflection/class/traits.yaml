defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
traits:
- id: python-import-chain
  desc: Nested Python __import__ calls
  crit: notable
  conf: 0.9
  for: [python, pyc]
  if:
    type: text
    regex: '__import__\([^\)\n]{0,50}__import__\('
# The type the defineClass(name, b, off, len, ProtectionDomain) overload
# takes; the class-definition composites below use it as a loader leg. Self
# path lookups are micro-behaviors/process/info/selfpath::java-protection-domain.
- id: java-protectiondomain
  desc: ProtectionDomain type reference
  crit: component
  for: [java, class]
  if:
    type: text
    substr: ProtectionDomain
  unless:
    - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class
- id: java-reverse
  desc: Java reverse() call
  crit: notable
  for:
  - java
  - class
  if:
    type: symbol
    kind: call
    regex: '(^|\.)reverse$'
  unless:
  - type: basename
    regex: \.([cm]?js|jsx|tsx?|mjs)$
- id: dotnet-assembly-loadfrom
  desc: .NET Assembly.LoadFrom
  crit: notable
  platforms:
  - windows
  for: [pe, csharp]
  if:
    type: text
    substr: Assembly.LoadFrom
- id: go-plugin-open
  desc: Go plugin.Open dynamic load
  crit: notable
  if:
    type: text
    substr: plugin.Open
- id: go-plugin-lookup
  desc: Go plugin.Lookup
  crit: notable
  if:
    type: text
    substr: plugin.Lookup
- id: go-plugin-symbol
  desc: Go plugin.Symbol
  crit: notable
  if:
    type: text
    substr: plugin.Symbol
composite_rules:
- id: python-import
  desc: Nested Python dynamic imports
  crit: suspicious
  conf: 0.85
  # A PE that embeds the standard Python/PyInstaller runtime inherits the
  # runtime's import machinery. Analyze the dynamic-import objective on the
  # Python source/bytecode member where it is an authored behavior, not on the
  # native wrapper that bundles it.
  for: [python]
  all:
  - id: python-import-chain
  - id: micro-behaviors/process/interpreter/python::dunder-import-call
  unless:
  - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
- id: java-protection-domain
  desc: Java ProtectionDomain reference
  crit: component
  for: [java, class]
  any:
  - id: java-protectiondomain
  - id: micro-behaviors/process/info/selfpath::java-protection-domain
- id: java-resource-classloader
  desc: Defines class from resource stream
  crit: suspicious
  conf: 0.92
  for: [class]
  all:
  - id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
  - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
  - id: micro-behaviors/metaprogramming/reflection::java-load-or-find
  - id: java-protection-domain
  unless:
  - id: micro-behaviors/metaprogramming/generation::javassist
  - id: micro-behaviors/metaprogramming/generation::cglib
  - id: micro-behaviors/metaprogramming/generation::byte-buddy
- id: java-string-reversal
  desc: String reversal deobfuscation technique
  crit: suspicious
  conf: 0.85
  for: [java, class]
  all:
  - id: micro-behaviors/data/string/concat::java-stringbuilder
  - id: java-reverse
  - id: micro-behaviors/data/string/conversion::tostring-token
# One ordinary reflection call is not evasion: dependency injection, config
# binding, serializers, MSBuild tasks and test harnesses all use these APIs.
# slskd trips it with `Activator.CreateInstance(type)` to render config
# defaults and `Assembly.LoadFrom` in a build task. Dynamic loading is worth
# reporting, so this stays a clear `notable` behavior; the dropper/loader
# composites that reference it supply the payload and staging evidence.
- id: dotnet-reflection
  desc: .NET reflection assembly loading
  crit: notable
  conf: 0.85
  platforms:
  - windows
  for: [pe, csharp]
  any:
  - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-text
  - id: dotnet-assembly-loadfrom
  - id: micro-behaviors/process/interpreter/reflection/runtime::activator-createinstance-token
  - id: micro-behaviors/process/interpreter/reflection/resolve::type-gettype-call
  - id: micro-behaviors/process/interpreter/reflection/dispatch::methodinfo-invoke-text
  unless:
  - id: metadata/binary/resource/
  - id: well-known/tool/reverse-engineering/ilspy::ilspy-component
- id: go-plugin
  desc: Go plugin dynamic loading
  crit: notable
  conf: 0.9
  any:
  - id: go-plugin-open
  - id: go-plugin-lookup
  - id: go-plugin-symbol
