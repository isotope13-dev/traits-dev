defaults:
  platforms: [android]
  for: [dex]
  attack: T1027,T1406,T1129
composite_rules:
  # Calls are in a bounded DEX code region; the match does not prove which
  # particular asset or bytes flow between these calls.
  - id: dex-cipher-zip-reflective-file-cluster
    desc: Cipher, ZIP, file and reflection call cluster
    crit: notable
    conf: 0.96
    near_bytes: 8192
    all:
      - id: micro-behaviors/crypto/cipher/io::dex-cipher-input-stream-constructor
      - id: micro-behaviors/data/archive/extract/zip::dex-zip-input-stream-constructor
      - id: micro-behaviors/fs/file/open/write::dex-file-output-constructor
      - id: micro-behaviors/os/module/load/class::dex-context-classloader-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-declared-method-call
  - id: android-opaque-encrypted-archive-loader-call-access
    desc: Obfuscated encrypted-archive loader with phone-call access
    crit: hostile
    conf: 0.96
    for: [android_apk, apk_android, apk, zip, dex]
    scope: archive
    all:
      - id: dex-cipher-zip-reflective-file-cluster
      - id: metadata/lang/source/naming/population::dex-many-16-letter-strings
      - id: objectives/execution/payload/module-load/transformed::android-asset-cipher-zip-reflection-calls
      - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
      - id: micro-behaviors/os/module/load/class::android-dex-classloader-constructor
      - id: metadata/permission/network::android-call-phone-apk-request
