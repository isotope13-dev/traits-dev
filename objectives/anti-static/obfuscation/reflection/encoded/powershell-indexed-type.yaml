defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-hex-xor-indexed-types
    desc: Indexed type lookup with hexadecimal strings and XOR
    crit: suspicious
    attack: T1027
    all:
      - id: micro-behaviors/metaprogramming/reflection/resolve::powershell-indexed-helper-type
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/data/bitwise/mixed::powershell-xor-operator
