defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
traits:
  - id: reflection-assembly-substituted-separators
    desc: Reflection type uses non-dot separators
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: text
      regex: 'System[^A-Za-z0-9.]{1,16}Reflection[^A-Za-z0-9.]{1,16}Assembly'
