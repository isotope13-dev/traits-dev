defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
traits:
  - id: reflection-assembly-substituted-separators
    desc: Reflection type uses non-dot separators
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: text
      # Underscore is a normal identifier separator in generated .NET metadata.
      # Do not bridge adjacent NUL-delimited names in the CLR string heap.
      regex: 'System[^\x00A-Za-z0-9._]{1,16}Reflection[^\x00A-Za-z0-9._]{1,16}Assembly'
