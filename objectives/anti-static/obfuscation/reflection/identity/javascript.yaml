# Identity Function Proxy Obfuscation
# Detects functions that simply return their argument, used for obfuscation.
# Pattern: function x(y){return y;}
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8
traits:
  - id: massive-identity-function-proxies
    desc: "Many identity wrapper functions"
    # Identity callbacks are common in source and tests; the count is useful
    # differential-analysis signal but is not standalone obfuscation intent.
    crit: notable
    conf: 0.9
    size_max: 500000
    # Same `ast.identity_function_count` metric as `identity-function-proxy`,
    # at the higher 40+ density threshold (was a `count_min: 40` query whose
    # `(#eq? @param @ret)` backreference the AST walker now evaluates).
    if:
      type: metrics
      field: 'ast.identity_function_count'
      min: 40
    unless:
      - type: basename
        regex: ^jsbn(-combined|2)?\.js$
      - id: well-known/app/ai/coding-agent/tabby::tabby-builtin-plugin-dist-path
      - id: metadata/package/files/dependency::node-modules-path
      - type: basename
        regex: ^(rimraf|run-(script-)?os|ipv6(grep)?)$
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/lang/locale::locale-module-basename
      - id: metadata/lang/generated::typescript-protobuf-generated
      - id: well-known/lib/stdlib/lodash::lodash-module-memberof
