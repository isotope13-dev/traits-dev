# Identity Function Proxy Obfuscation
# Detects functions that simply return their argument, used for obfuscation.
# Pattern: function x(y){return y;}
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8
traits:
  - id: identity-function-proxy
    desc: Contains several identity wrapper functions
    # Inherits the file's `notable`. Was `crit: baseline`, but baseline means
    # nearly every file of the type does it: measured over 800 real .js files,
    # `ast.identity_function_count` is 0 for 92% (median 0, p99 1) and reaches
    # this `min: 5` threshold in 1 of 800 (0.1%). A rare, differential-analysis
    # -relevant density signal is notable, per TAXONOMY.
    size_max: 500000
    if:
      # Migrated from a tree-sitter query whose `(#eq? @param @ret)` predicate
      # is a param↔return backreference no regex can express. The AST walker
      # now performs that check and exposes the count as
      # `ast.identity_function_count`; ≥5 identity proxies = obfuscation.
      type: metrics
      field: 'ast.identity_function_count'
      min: 5
  - id: massive-identity-function-proxies
    desc: "Many identity wrapper functions"
    # Identity callbacks are common in source and tests; the count is useful
    # differential-analysis signal but is not standalone obfuscation intent.
    crit: notable
    conf: 0.9
    size_max: 500000
    # Same `ast.identity_function_count` metric as `identity-function-proxy`,
    # at the higher 40+ density threshold (was a `count_min: 40` query whose
    # `(#eq? @param @ret)` backreference the AST walker now evaluates).
    if:
      type: metrics
      field: 'ast.identity_function_count'
      min: 40
    unless:
      - type: basename
        regex: ^jsbn(-combined|2)?\.js$
      - id: well-known/app/ai/coding-agent/tabby::tabby-builtin-plugin-dist-path
      - id: metadata/package/files/dependency::node-modules-path
      - type: basename
        regex: ^(rimraf|run-(script-)?os|ipv6(grep)?)$
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/file/profile/locale::locale-module-basename
      - id: metadata/lang/source::typescript-protobuf-generated
      - id: well-known/lib/core/lodash::lodash-module-memberof
