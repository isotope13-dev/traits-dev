defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: string-arg-declaration
    desc: String.prototype.arg declaration
    crit: component
    if:
      type: text
      regex: '(?i)String\.prototype\.arg\s*=\s*function|function\s+String\.prototype\.arg'

  - id: string-arg-returns-this
    desc: Function returns this
    crit: component
    if:
      type: text
      regex: '(?i)\breturn\s+this\b'

composite_rules:
  - id: string-arg-extension
    desc: String.prototype.arg returns this
    crit: suspicious
    conf: 0.9
    attack: T1027
    all:
      - id: string-arg-declaration
      - id: string-arg-returns-this
    near_lines: 4
    near_bytes: 400
