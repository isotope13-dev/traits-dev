defaults:
  crit: hostile
  platforms: [windows]
  for: [iso]

composite_rules:
  - id: iso-obfuscated-java-resource-lure
    platforms: [unix, windows]
    desc: Obfuscated Java archive in payment ISO
    conf: 0.99
    attack: T1027,T1204.002
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-java-jar-member
      - id: metadata/file/format/iso/payload::iso-allatori-comment
      - id: metadata/file/format/iso/payload::iso-obfuscated-jar-class-catalog
      - id: metadata/file/format/iso/structure::embedded-payment-term-core
      - id: metadata/file/format/iso/structure::embedded-payment-term-document
  - id: iso-dotnet-reflection-resource-loader
    desc: ISO .NET reflection resource loader
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::iso-dotnet-metadata-sig
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader

  - id: iso-dotnet-reflective-payload
    desc: ISO embeds a reflective .NET payload
    conf: 0.98
    attack: T1027,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-pdf-exe-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-title-attribute
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker

  - id: iso-dotnet-hex-reflective-loader
    desc: ISO .NET hex-reflective stage loader
    conf: 0.99
    attack: T1027,T1140,T1620
    mbc: B0032,E1059
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::iso-dotnet-metadata-sig
      - id: metadata/file/format/iso/payload::iso-dotnet-hex-slice
      - id: metadata/file/format/iso/payload::iso-dotnet-hex-byte-conversion
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
  - id: iso-dotnet-xor-gzip-resource-loader
    for: [archive, data, iso]
    desc: ISO .NET resource loader uses XOR and GZip before reflection
    conf: 0.99
    attack: T1027,T1140,T1620
    mbc: B0032,E1059
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::contains-executable-member
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::managed-resource-reflection-activation
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/compress/gzip::dotnet-gzip-compression
      - id: micro-behaviors/crypto/symmetric/xor/term::dotnet-xor-decryptor-method-marker
      - id: metadata/binary/layout/embedded::pe-embedded
    unless:
      - id: metadata/signed/platform/
