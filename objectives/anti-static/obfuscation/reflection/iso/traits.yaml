defaults:
  platforms: [windows]
  for: [iso]

composite_rules:
  - id: iso-obfuscated-java-resource-lure
    desc: Obfuscated Java archive in payment ISO
    crit: hostile
    conf: 0.99
    attack: T1027,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-java-jar-member
      - id: objectives/command-and-control/dropper/execution/scriptengine::jar-allatori-obfuscator-marker
      - id: metadata/file/format/iso::iso-obfuscated-jar-class-catalog
      - id: metadata/file/format/structured::embedded-payment-term-core
      - id: metadata/file/format/structured::embedded-payment-term-document
  - id: iso-dotnet-reflection-resource-loader
    desc: ISO .NET reflection resource loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-dotnet-metadata-sig
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader

  - id: iso-dotnet-reflective-payload
    desc: ISO embeds a reflective .NET payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-pdf-exe-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-title-attribute
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker

  - id: iso-dotnet-hex-reflective-loader
    desc: ISO .NET hex-reflective stage loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    mbc: B0032,E1059
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-dotnet-metadata-sig
      - id: metadata/file/format/iso::iso-dotnet-hex-slice
      - id: metadata/file/format/iso::iso-dotnet-hex-byte-conversion
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
  - id: iso-dotnet-xor-gzip-resource-loader
    desc: ISO .NET resource loader uses XOR and GZip before reflection
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    mbc: B0032,E1059
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::contains-executable-member
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::managed-resource-reflection-activation
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/compress/library::dotnet-gzip-compression
      - id: micro-behaviors/crypto/symmetric/xor/term::dotnet-xor-decryptor-method-marker
      - id: metadata/binary/layout::pe-embedded
    unless:
      - id: metadata/signed/platform/
