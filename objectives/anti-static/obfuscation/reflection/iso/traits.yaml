defaults:
  platforms: [windows]
  for: [all]

composite_rules:
  - id: iso-dotnet-reflection-resource-loader
    desc: ISO .NET reflection resource loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-dotnet-metadata-signature
      - id: metadata/file/format/structured::embedded-dotnet-reflection-marker
      - id: metadata/file/format/structured::embedded-dotnet-resource-loader
