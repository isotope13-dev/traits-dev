defaults:
  platforms: [windows, unix]
  for: [python]
  crit: suspicious
  conf: 0.95

traits:
  - id: python-xor-encoded-reflective-import
    desc: Reflective import uses XOR-built module bytes
    if:
      type: text
      regex: 'getattr\s*\(\s*__import__\s*\(\s*bytes\s*\([^)\n]{1,80}\^'

  - id: python-xor-numeric-reflection
    desc: Reflection repeatedly conceals names with XOR
    crit: suspicious
    conf: 0.96
    count_min: 8
    if:
      type: text
      regex: 'getattr\([^\r\n]{1,60}bytes\(\([^\r\n]{1,80}\^'

composite_rules:
  - id: python-descriptor-encoded-dispatch
    desc: Descriptor hook accompanies encoded reflective dispatch
    scope: file
    all:
      - id: python-xor-encoded-reflective-import
      - id: micro-behaviors/data/control-flow/module-exec::python-descriptor-set-name-hook
