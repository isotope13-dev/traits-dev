defaults:
  for: [jar, class]
  platforms: [unix, windows]
composite_rules:
  - id: jvm-encoded-strings-with-network-client
    desc: Encoded JVM constants accompany network client
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/file/encoded::java-control-prefixed-long-string
      - id: micro-behaviors/communications/http/lib/urlconnection::java-url-class-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-class-forname-bytecode
  - id: jvm-encoded-strings-with-process-builder
    desc: Encoded JVM constants accompany process builder
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/file/encoded::java-control-prefixed-long-string
      - id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-class-forname-bytecode
