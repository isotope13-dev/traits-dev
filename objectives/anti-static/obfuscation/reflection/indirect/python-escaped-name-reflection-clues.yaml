defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: python-escaped-name-reflection-clues
    desc: Python escaped name and module attribute lookup
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/encoding/hex::python-escaped-transform-name
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::python-imported-module-attribute
