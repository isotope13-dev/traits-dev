# Indirect access to a global through a sequence expression: `(0, this)[...]`,
# `(0, window)[...]`, `(0, eval)(...)`. The leading `0,` discards a value and
# yields the global object as a *bare reference* rather than a member
# expression, which (a) makes the resulting call run in global scope and
# (b) leaves nothing for a name-based scanner or bundler to resolve. The
# property is then supplied as a computed string, so the callee is decided at
# runtime.
#
# No transpiler, bundler, or hand-written code needs this shape against
# `this`/`window`/`globalThis`; it is a deliberate indirection.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027
  mbc: B0032

traits:
  - id: sequence-expression-global-computed-access
    desc: Global reached via comma operator and index
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\(\s*0\s*,\s*(this|window|globalThis)\s*\)\s*\['

  - id: sequence-expression-indirect-eval-call
    desc: Indirect eval through the comma operator
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # The head of the argument is part of the match on purpose: `not:` filters
      # the *matched string*, so an exclusion can only test text the regex
      # actually captured. Matching just `(0,eval)(` left the `not:` below with
      # nothing to inspect and it never filtered anything -- every bundled UMD
      # helper carrying the idiom below still scored suspicious.
      regex: '\(\s*0\s*,\s*(eval|Function)\s*\)\s*\([^)]{0,40}'
    not:
      # `(0,eval)("this")` is the pre-globalThis UMD idiom for recovering the
      # global object; it carries a fixed literal, not a payload.
      - regex: '\(\s*0\s*,\s*eval\s*\)\s*\(\s*["\x27]this["\x27]'
