# Indirect access to a global through a sequence expression: `(0, this)[...]`,
# `(0, window)[...]`, `(0, globalThis)[...]`. The leading `0,` discards a value
# and yields the global object as a *bare reference* rather than a member
# expression, which leaves nothing for a name-based scanner or bundler to
# resolve. The property is then supplied as a computed string, so the callee is
# decided at runtime.
#
# No transpiler, bundler, or hand-written code needs this shape against
# `this`/`window`/`globalThis`; it is a deliberate indirection.
#
# The related `(0, eval)(...)` / `(0, Function)(...)` forms are NOT here: the
# comma operator is the language's only way to invoke eval in global scope, so
# every transpiler and module loader emits it (Closure Library's
# `goog.transpile_`, webpack/UMD global recovery, SystemJS). That is a neutral
# dynamic-execution capability and lives in
# micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval,
# ::js-indirect-eval-variable and ::js-indirect-function-constructor-call.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027
  mbc: B0032

traits:
  - id: sequence-expression-global-computed-access
    desc: Global reached via comma operator and index
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\(\s*0\s*,\s*(this|window|globalThis)\s*\)\s*\['
  - id: js-empty-function-charcode-property
    desc: Empty function has char-coded property
    crit: notable
    for: [javascript, typescript]
    conf: 0.9
    if:
      type: text
      substr: '(function(){})[String.fromCharCode'
  - id: js-computed-charcode-call
    desc: Computed call through character-coded property
    crit: notable
    for: [javascript, typescript]
    conf: 0.92
    attack: T1059.007
    if:
      type: text
      # A function-valued property is selected with a runtime character-code
      # string and immediately called with an identifier payload.  The atom
      # describes the capability; decoder-plus-execution intent is inferred by
      # objective composites.
      regex: 'String\.fromCharCode\s*\([^;\]]{1,180}\)\s*\]\s*\('
  - id: js-base64-decoded-property
    desc: Base64-decoded computed method call
    crit: notable
    for: [javascript, typescript]
    conf: 0.88
    attack: T1059.007
    if:
      type: text
      regex: '\[\s*Buffer\.from\([^;\n\]]{0,120}["'']base64["''][^;\n\]]{0,40}\)\s*\]\s*\('

composite_rules:
  - id: js-base64-decoded-computed-call
    desc: Calls a method selected from Base64-decoded text
    crit: notable
    for: [javascript, typescript]
    conf: 0.92
    attack: T1059.007
    near_bytes: 256
    all:
      - id: js-base64-decoded-property
      - id: micro-behaviors/data/source/property/computed::js-computed-property-call
  - id: js-charcode-constructor-stage
    desc: Char-coded constructor property call
    crit: notable
    for: [javascript, typescript]
    conf: 0.95
    attack: T1059.007
    near_bytes: 512
    all:
      - id: js-empty-function-charcode-property
      - id: js-computed-charcode-call
