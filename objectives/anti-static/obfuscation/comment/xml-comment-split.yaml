# XML whose text is cut into one- or two-character pieces by comments
# (`r<!-- x -->u<!-- y -->n`). A parser joins the pieces back into the
# command or URL, while a search of the raw bytes for that command finds
# nothing. Hand-written and generated XML put comments between elements, not
# inside words. APT-C-09 placed over 1,300 PDF-syntax comments in one
# .SettingContent-ms DeepLink.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1027

traits:
  - id: xml-comment-split-text
    desc: XML text split by comments per character
    crit: suspicious
    conf: 0.93
    count_min: 16
    if:
      type: text
      regex: '-->[^<>\s]{1,2}<!--'

composite_rules:
  - id: settings-shortcut-comment-split
    desc: Settings shortcut hides text between comments
    crit: hostile
    conf: 0.97
    attack: T1027,T1204.002
    all:
      - id: metadata/file/format/windows-shell::settings-shortcut-root
      - id: xml-comment-split-text
