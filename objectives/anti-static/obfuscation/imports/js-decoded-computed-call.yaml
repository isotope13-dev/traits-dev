# Ordinary dynamic dispatch keys a computed member access with a variable or
# a literal (`handlers[eventType](args)`); benign code essentially never
# nests a fresh function call directly inside the brackets of a call it makes
# in the same expression (`obj[decode(x)](args)`). Requiring the receiver is
# important: class method declarations such as `[Symbol("iterator")]() {}`
# have the same bracket/call punctuation but do not invoke a decoded method.
# This generalizes across whatever the decoder function happens to be named.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1027,T1140

traits:
  - id: js-decoded-computed-call
    desc: JS calls method via computed decoded key
    crit: suspicious
    conf: 0.87
    if:
      type: text
      regex: '[A-Za-z_$]\w*\s*\[\s*[A-Za-z_$]\w*\(\s*[^()\[\]]{0,60}\)\s*\]\s*\('
