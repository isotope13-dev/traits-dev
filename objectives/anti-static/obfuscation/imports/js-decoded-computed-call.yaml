# Ordinary dynamic dispatch keys a computed member access with a variable or
# a literal (`handlers[eventType](args)`); benign code essentially never
# nests a fresh function call directly inside the brackets of a call it makes
# in the same expression (`obj[decode(x)](args)`). That shape only pays off
# when the point is to keep the property/method name being invoked -- often a
# WSH/ActiveX or filesystem API -- out of the string table entirely, so a
# literal-string or symbol-name scan of the script never sees what it calls.
# Generalizes across whatever the decoder function happens to be named.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1027,T1140

traits:
  - id: js-decoded-computed-call
    desc: JS calls method via computed decoded key
    crit: suspicious
    conf: 0.87
    if:
      type: text
      regex: '\[\s*[A-Za-z_$][A-Za-z0-9_$]*\(\s*[^\[\]()]{0,60}\)\s*\]\s*\('
