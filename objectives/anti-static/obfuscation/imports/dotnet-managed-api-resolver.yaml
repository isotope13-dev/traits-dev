# .NET loaders that hide native API names in managed code and resolve them
# from loaded module addresses.  The individual API names may be absent from
# the string table when they are reconstructed as byte arrays at runtime.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-managed-module-api-resolver
    desc: .NET resolves native APIs from loaded module addresses via delegates
    crit: hostile
    conf: 0.97
    attack: T1027.007
    mbc: B0032
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/api-resolution/dynamic::managed-process-module-reference
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-collection-reference
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-base-address
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-importless-encrypted-delegate-setup
    desc: Unsigned importless .NET uses encrypted delegate setup
    crit: hostile
    conf: 0.98
    attack: T1027,T1027.007,T1620
    mbc: B0032.014
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/metrics/structural::no-imports
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/os/api-resolution/dynamic::managed-unmanaged-memory-marshalling
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: objectives/anti-static/obfuscation/binary-metrics/symbols::randomized-symbol-namespace-cluster
    unless:
      - id: metadata/signed/platform/

  # Managed crypters retain only the CLR bootstrap import while resolving the
  # decrypted stage's native calls through delegates. Requiring an encrypted
  # code section, an actual decryptor, resource access, and CreateProcess keeps
  # ordinary P/Invoke-heavy .NET applications out of this loader objective.
  - id: dotnet-sparse-import-encrypted-delegate-loader
    desc: Unsigned packed .NET loader decrypts a delegate-resolved stage
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1027.007,T1140,T1620
    mbc: B0032.014
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/symbols/imports::single-import-raw
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/process/create/launch::create-process-api-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
