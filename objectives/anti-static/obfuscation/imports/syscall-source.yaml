defaults:
  platforms: [windows]
  for: [go]
  attack: T1027.007,T1562.001

composite_rules:
  # This is narrower than ordinary DJB2 use: the hash is applied while a
  # program manually walks ntdll's export directory and resolves syscall
  # service numbers, eliminating the native API names/imports defenders see.
  - id: hashed-ntdll-syscall-resolution-source
    desc: Hashes NTDLL exports to resolve syscall numbers
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/api-resolution/manual::go-manual-pe-export-walk-source
      - id: micro-behaviors/data/string/measure::djb2-hash-call-source
      - id: micro-behaviors/os/syscall/invoke::ntdll-module-name-source
      - id: micro-behaviors/os/syscall/invoke::windows-ssn-resolver-call-source
    near_lines: 50
