# The module name never appears in the file. A fragment array is joined (and
# often patched with .replace) into the specifier immediately before it is
# handed to a dynamic import(), so neither `grep` nor a dependency extractor
# sees which package is being pulled in at runtime. The two legs must land near
# each other: an unrelated joined array elsewhere in a bundle proves nothing.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: node-assembled-module-specifier-import
    desc: Dynamic import of a runtime-assembled module name
    crit: suspicious
    conf: 0.94
    near_bytes: 512
    all:
      - id: micro-behaviors/os/module/load::dynamic-import-expression
      - id: objectives/anti-static/obfuscation/string/conceal::js-inline-array-empty-join
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/package/testing/presence/harness/
