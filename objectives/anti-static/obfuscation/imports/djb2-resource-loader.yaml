defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 524288
  attack: T1027.007,T1620

composite_rules:
  - id: djb2-encrypted-resource-memory-loader
    desc: DJB2 resource decrypt-and-execute loader
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/imports::djb2-shift-add-loop-x86
      - id: objectives/anti-static/obfuscation/payload/container::moderately-encoded-rsrc
      - id: micro-behaviors/process/inject/runtime/call::transformed-stack-buffer-dispatch-x86
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
