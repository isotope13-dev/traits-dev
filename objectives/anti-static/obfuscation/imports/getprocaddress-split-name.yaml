# Concealing which export a script resolves at runtime by splitting its name.
#
# `GetProcAddress($h, "A"+"msi"+"Ope"+"nS"+"es"+"s"+"ion")` resolves exactly the
# same export as passing the whole name, so the concatenation buys nothing at
# runtime — its only effect is that the API name never appears in the file for a
# grep, a string dump, or a reviewer to see.  Interop code that legitimately
# resolves an export passes the name as a single literal, which is why the split
# form is the signal rather than the call itself (the neutral resolve capability
# lives in micro-behaviors/os/module/load).
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, csharp]
  attack: T1027
  mbc: B0032
traits:
  - id: getprocaddress-concatenated-export-name
    desc: GetProcAddress name split by concat
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)GetProcAddress\s*\([^)]{0,60}["'']\s*\+\s*["'']'
