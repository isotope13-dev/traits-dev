# Concealing a Node builtin behind string concatenation.
#
# `require('child'+'_pro'+'cess')` resolves to exactly the same module as
# `require('child_process')`, so the split buys nothing at runtime — its only
# effect is that a grep, an import index, or a reviewer scanning the bundle
# never sees the module name.  Obfuscator.io-packed stagers appended to an
# otherwise legitimate bundle use it to hide the process-execution and network
# imports that would otherwise stand out.
#
# A *computed* module path (`require(dir + name)`, `require('./' + f)`) is a
# different, ordinary thing and lives in
# micro-behaviors/data/source/dynamic/load; the leading literal here is
# restricted to a bare lowercase module-name stem so those do not match.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  - id: node-require-split-module-name
    desc: require() module name split by concatenation
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'require\s*\(\s*[''"][a-z][a-z_]{1,14}[''"]\s*\+'
    unless:
      - id: metadata/package/testing/
