defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: strided-xor-resolver-detached-clues
    desc: Strided XOR and detached-process API clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x64-strided-repeating-key-xor-loop
      - id: micro-behaviors/os/api-resolution/manual::x64-pe-export-directory-walk-packed-stub
      - id: micro-behaviors/os/api-resolution/digest-export/hash::shift-add-33-hash-packed-stub-x64
      - id: micro-behaviors/process/config/launch::indirect-detached-process-group-x64
      - id: micro-behaviors/fs/path/location::shell-get-folder-path-a
      - id: metadata/binary/section/layout::many-nonstandard-section-names
    unless:
      - id: metadata/installer/product/
