# Custom near-FNV API-hash algorithm family
# Hash algorithm: seed 0xB4B8026F, per-byte step (byte ^ hash) * 0x10003C9 --
# an FNV-1a shape with a corrupted prime, distinct from the 0x01000193 FNV-1a
# implementations covered under micro-behaviors/data/checksum. Verified in an
# importless x64 MSVC loader that walks the PEB, parses each loaded module's
# export table and resolves every API through this hash. The WinHTTP constants
# below are precomputed under the same algorithm; in the verified sample all
# twelve resolve inside one bootstrap that stores the client into globals.
# Same convention as the additive-hash family file in this directory.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007
  mbc: F0004
composite_rules:
- id: near-fnv-api-hash-family
  desc: Near-FNV API hashing beside a manual loader primitive
  crit: suspicious
  conf: 0.95
  size_max: 5242880
  all:
  - id: metadata/binary/instruction/operand::x86-imul-010003c9
  - id: metadata/binary/instruction/operand::near-fnv-hash-seed
  any:
  - id: micro-behaviors/process/info/query::peb-access-x64
  - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
  - id: metadata/binary/instruction/sequence::x86-load-displacement-3c
- id: near-fnv-winhttp-hash-table
  desc: Importless WinHTTP near-FNV API concealment
  # Hash-based API concealment warrants investigation; it does not establish
  # theft, payload activation, or malicious intent by itself.
  crit: suspicious
  conf: 0.97
  size_max: 5242880
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: near-fnv-api-hash-family
  needs: 4
  any:
  - id: metadata/binary/instruction/operand::winhttpopen-near-fnv-hash
  - id: metadata/binary/instruction/operand::winhttpconnect-near-fnv-hash
  - id: metadata/binary/instruction/operand::winhttpopenrequest-near-fnv-hash
  - id: metadata/binary/instruction/operand::winhttpsendrequest-near-fnv-hash
  - id: metadata/binary/instruction/operand::winhttpwritedata-near-fnv-hash
  - id: metadata/binary/instruction/operand::winhttpreaddata-near-fnv-hash
