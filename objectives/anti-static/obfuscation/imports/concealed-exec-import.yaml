# A package that ships obfuscator-packed code and conceals a process-execution
# import behind an encoding layer.
#
# Both halves are individually explainable -- commercial JavaScript does get run
# through javascript-obfuscator, and honest packages spawn processes. The pair
# is not: a bundler rewrites module references into its own numeric ids but
# leaves the builtin's name in plaintext, because the runtime has to resolve it
# and the string is not sensitive. Moving `child_process` into an encoded layer
# buys nothing against a machine and everything against a reader -- whoever
# greps a package before installing it, and the registry scanners that do the
# same at scale.
#
# Scoped to the archive rather than the file on purpose. The two halves land on
# different members in practice (an obfuscated plugin here, the concealed
# require there), and a published npm package is one distribution unit under one
# publisher: what one of its files hides is a property of the package. Measured
# on this corpus, 3% of archives carry more than one `package.json` and 1% carry
# a `node_modules/` tree, so archive scope is package scope for all but a
# handful -- the residual risk is pooling across sibling packages in a bundled
# tree, which is why this stays at suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  attack: T1027.002,T1059.007
  mbc: B0032

composite_rules:
  - id: obfuscated-concealed-process-exec-import
    desc: Package hides process execution import
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::full-anti-static-obfuscator-preset
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-node-child-process
