defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: akernel32-dll
    desc: Dynamic API resolution str Akernel32
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: "Akernel32.dll"
    unless:
      - id: well-known/app/system/cvte-crashrpt/
      - id: well-known/tool/development/jetbrains/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/tool/development/inno-setup/
      - id: metadata/signed/leaf::adobe-systems-incorporated
  - id: bkernel32-dll
    desc: Dynamic API resolution str Bkernel32
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: "Bkernel32.dll"
    unless:
      # Chromium sandbox (Firefox/Thunderbird) carries adjacent wide DLL
      # name tables that can surface this token without dynamic-resolution intent.
      - id: metadata/signed/platform::mozilla
      - id: metadata/signed/leaf::mozilla-corporation
      - id: metadata/signed/leaf::adobe-systems-incorporated

