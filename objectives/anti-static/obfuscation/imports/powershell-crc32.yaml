defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.007
  mbc: B0032.014

composite_rules:
  - id: powershell-crc32-hashed-native-resolver
    desc: CRC32-hashed native export resolver
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/hash/crc32::powershell-crc32-poly
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-unsafe-nativemethods-type
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
