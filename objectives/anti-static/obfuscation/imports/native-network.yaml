defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: obfuscated-runtime-network-api-loader
    desc: Native binary hides a WinHTTP/Winsock transport behind runtime API resolution
    crit: hostile
    conf: 0.99
    attack: T1027,T1129,T1071.001
    mbc: B0032,C0002
    all:
      - id: micro-behaviors/communications/http/client/winhttp::native-winhttp-user-agent-host-cluster
      - id: micro-behaviors/communications/http/client/winhttp::native-winsock-transport-cluster
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::get-proc-address-import
    any:
      - id: micro-behaviors/os/env/vars/cicd::native-ci-provider-marker-cluster
      - id: micro-behaviors/os/env/vars/system-info::native-host-identity-marker-cluster
    needs: 1
