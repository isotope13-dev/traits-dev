defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: peb-access-dynamic-toolhelp
    desc: PEB access with dynamically resolved Toolhelp APIs
    crit: suspicious
    conf: 0.85
    size_min: 65536
    all:
      - id: micro-behaviors/os/env/access::peb-access-x86
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-enumerator
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: well-known/tool/sysadmin/conemu/
      - id: well-known/app/utility/ventoy/
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
      - id: well-known/app/system/iobit::iobit-component-context
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: well-known/app/browser/internet-explorer/
