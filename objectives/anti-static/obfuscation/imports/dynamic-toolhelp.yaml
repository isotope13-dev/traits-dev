defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: peb-access-dynamic-toolhelp
    desc: PEB access with dynamically resolved Toolhelp APIs
    # PEB access plus process enumeration is a generic runtime capability.
    # Hostile objectives add injection, evasion, or targeting context.
    crit: notable
    conf: 0.85
    size_min: 65536
    all:
      - id: micro-behaviors/os/env/access::peb-access-x86
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-enumerator
