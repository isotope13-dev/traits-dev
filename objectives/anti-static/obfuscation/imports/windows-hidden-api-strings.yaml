defaults:
  platforms: [windows]
  for: [pe]
  mbc: B0032
  attack: T1027
composite_rules:
  - id: native-memory-api-cluster-without-allocate
    desc: Native memory API cluster without allocate
    crit: suspicious
    conf: 0.84
    all:
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
      - id: micro-behaviors/os/syscall/raw::nt-protect-ssn
      - id: micro-behaviors/os/syscall/raw::nt-create-thread-ssn
  - id: native-memory-api-cluster-without-write
    desc: Native memory API cluster without write
    crit: suspicious
    conf: 0.84
    all:
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
      - id: micro-behaviors/os/syscall/raw::nt-protect-ssn
      - id: micro-behaviors/os/syscall/raw::nt-create-thread-ssn

  - id: unsigned-api-resolver-anti-debug-loader
    desc: Unsigned loader resolves APIs while checking for debuggers
    crit: hostile
    conf: 0.96
    attack: T1027.007,T1622
    all:
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/api-resolution/manual::custom-api-resolver-logic
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
  - id: native-memory-api-cluster-without-map
    desc: Native memory API cluster without map
    crit: suspicious
    conf: 0.84
    all:
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
      - id: micro-behaviors/os/syscall/raw::nt-protect-ssn
      - id: micro-behaviors/os/syscall/raw::nt-create-thread-ssn
  - id: native-memory-api-cluster-without-protect
    desc: Native memory API cluster without protect
    crit: suspicious
    conf: 0.84
    all:
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
      - id: micro-behaviors/os/syscall/raw::nt-create-thread-ssn
  - id: native-memory-api-cluster-without-create
    desc: Native memory API cluster without create
    crit: suspicious
    conf: 0.84
    all:
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
      - id: micro-behaviors/os/syscall/raw::nt-protect-ssn
  - id: native-memory-api-string-cluster
    desc: Native memory API string cluster
    crit: suspicious
    conf: 0.94
    attack: T1027.007
    any:
      - id: native-memory-api-cluster-without-allocate
      - id: native-memory-api-cluster-without-write
      - id: native-memory-api-cluster-without-map
      - id: native-memory-api-cluster-without-protect
      - id: native-memory-api-cluster-without-create
  - id: hidden-loader-api-string-cluster
    desc: Concealed loader API string cluster
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-prefix-no-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect-prefix-no-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
