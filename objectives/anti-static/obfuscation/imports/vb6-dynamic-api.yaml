defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0032
composite_rules:
  - id: vb6-concealed-win32-apis
    desc: VB6 concealed Win32 API dispatch
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
    any:
      # The DLL thunk alone is normal VB6 behavior.  A transformed runtime
      # string is required before describing the dispatched API as concealed.
      - id: micro-behaviors/data/string/runtime::vb6-ordinal-string-transformation
      - id: micro-behaviors/data/string/runtime::vb6-runtime-string-decoding
    unless:
      - id: metadata/binary/framework::vb6-runtime-library
      - id: well-known/lib/runtime/vb-richclient::vb-richclient-runtime-library
      - id: well-known/lib/runtime/vb-richclient::vb-richclient-runtime-bundle
      - id: well-known/app/system/legacy-vb6::jsware-msi-unpacker
      - id: well-known/app/system/legacy-vb6::netiq-adpopulator
      # Malformed recursive PE carriers can make the parser expose thousands
      # of random integers as ordinal imports, accidentally satisfying the
      # VB6 runtime profile without containing a VB6 runtime at all.
      - id: metadata/binary/metrics/threshold::many-imports-200
  - id: vb6-obfuscated-runtime-dispatch
    desc: VB6 concealed API dispatch with transformed strings
    crit: suspicious
    conf: 0.96
    all:
      - id: vb6-concealed-win32-apis
      - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
      - id: micro-behaviors/data/string/runtime::vb6-ordinal-string-transformation
    any:
      - id: metadata/file/metrics::peak-region-cipher-entropy
      - id: metadata/build/artifact::pe-bound-imports-present
    unless:
      - id: well-known/lib/runtime/vb-richclient::vb-richclient-runtime-library
      - id: well-known/lib/runtime/vb-richclient::vb-richclient-runtime-bundle
      - id: well-known/app/system/legacy-vb6::jsware-msi-unpacker
      - id: well-known/app/system/legacy-vb6::netiq-adpopulator
      - id: metadata/binary/metrics/threshold::many-imports-200
  - id: vb6-pcode-concealed-runtime-profile
    desc: VB6 p-code concealed runtime profile
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/metrics/anomaly::low-function-count-marker
    any:
      - id: micro-behaviors/data/string/runtime::vb6-runtime-string-decoding
      - id: micro-behaviors/fs/file/read::vb6-rtcfreefile
      - id: micro-behaviors/fs/file/read::vb6-rtcfilelength
      - id: micro-behaviors/os/random/generator::vb6-runtime-prng
      - id: micro-behaviors/fs/directory/readdir::vb6-rtcdir
    needs: 3
    unless:
      - id: metadata/binary/framework::vb6-runtime-library
      - id: well-known/lib/runtime/vb-richclient::vb-richclient-runtime-library
      - id: well-known/lib/runtime/vb-richclient::vb-richclient-runtime-bundle
      - id: metadata/binary/metrics/threshold::many-imports-200
