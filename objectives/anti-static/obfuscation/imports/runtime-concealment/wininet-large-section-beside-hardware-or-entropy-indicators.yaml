defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: notable
composite_rules:
  - id: wininet-large-section-beside-hardware-or-entropy-indicators
    desc: WinInet/large-section profile beside hardware/entropy indicators
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/imports/runtime-concealment::wininet-header-word-api-profile-beside-runtime-indicators
      - id: metadata/binary/section/ratio::pe-largest-section-65-percent
    any:
      - id: micro-behaviors/hardware/display/directx/calls::directx-factory-api
      - id: micro-behaviors/os/sysinfo/hardware::is-processor-feature-present
      - id: metadata/binary/layout/ratio::low-overall-entropy
    needs: 2
    downgrade:
      any:
        - id: metadata/vendor/identity::microsoft-corp-versioninfo
