defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: importless-dll-hash-resolution
    for: [pe]
    desc: Importless DLL and API hashing clues
    crit: hostile
    conf: 0.9
    attack: T1574.002
    size_max: 51200
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/symbols/count::minimal-exports
    any:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::djb2-api-resolution
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: objectives/anti-static/obfuscation/imports/api-hashing::api-hash-resolution
  - id: unsigned-stack-api-pe-walk-clues
    desc: Unsigned stack API and PE walk clues
    crit: hostile
    conf: 0.98
    attack: "T1574.002,T1027.007,T1106"
    for: [pe]
    all:
      - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
      - id: metadata/binary/symbols/name/process::mapview-createprocessw-concatenated-name
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
  # Native CRT CorExitProcess references mscoree.dll; skip framework/ unless.
