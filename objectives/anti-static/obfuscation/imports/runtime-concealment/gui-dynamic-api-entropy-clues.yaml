# GUI, entropy and API references do not establish fake UI or download.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: unsigned-gui-peb-registry-entropy-clues
  desc: Unsigned GUI, PEB and registry/entropy clues
  conf: 0.96
  all:
  - id: micro-behaviors/ui/graphics/draw::begin-paint-symbol
  - id: micro-behaviors/os/api-resolution/digest-export/walk::peb-ldr-list-access-x86
  - id: micro-behaviors/os/registry/read::registry-read-api-chain
  - id: metadata/binary/code/entropy::high-code-entropy
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/installer/product/
  crit: suspicious
- id: unsigned-gui-dynapi-entropy-clues
  desc: Unsigned GUI, dynamic API and entropy clues
  conf: 0.95
  all:
  - id: micro-behaviors/ui/graphics/draw::begin-paint-symbol
  - id: micro-behaviors/ui/window/probe::get-active-window
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: metadata/binary/code/entropy::code-entropy-over-7p4
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/installer/product/
  crit: suspicious
