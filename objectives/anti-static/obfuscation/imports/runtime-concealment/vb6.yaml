defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1027
composite_rules:
- id: vb6-concealed-shell
  desc: Concealed Win32 APIs near VB6 Shell
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
  - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
- id: vb6-obfuscated-shell
  desc: Obfuscated VB6 dispatch near Shell
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
  - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
- id: vb6-concealed-toolhelp
  desc: Concealed APIs near process traversal
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
  - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
