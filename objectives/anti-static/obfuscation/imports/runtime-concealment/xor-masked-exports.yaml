# x64 PEB traversal paired with XOR-masked PE64 export-name lookup to resolve
# Windows runtime symbols without plaintext API names or import entries.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1027.007

composite_rules:
  - id: peb-xor-masked-export-resolution
    desc: x64 PEB walk with XOR-masked PE export lookup
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/os/api-resolution/manual::x64-xor-masked-pe-export-lookup
