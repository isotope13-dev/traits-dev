# A module whose own imports are written in escapes, and which then runs
# commands or opens a socket.
#
#   import axios from '\x61\x78\x69\x6F\x73'
#
# That is `import axios from 'axios'`. No minifier does this: escaping a
# module specifier makes the bundle larger and changes nothing at runtime.
# Its only effect is that `grep axios`, `grep child_process` and `grep ws`
# all come back empty -- including for whoever reviews the package.
#
# The trojanized npm package `@chatgptclaudeclub/claude-code` writes every
# identifier and specifier this way, then runs `exec` with `windowsHide`,
# fingerprints the host through IOPlatformUUID, decrypts its configuration
# with AES-256-CBC and keeps a WebSocket heartbeat open to its operator. It
# scored four suspicious findings and nothing hostile.
#
# Concealed imports are the durable half: the payload behind them differs in
# every sample, but a module that hides which modules it loads and then
# reaches for process execution is not doing anything a reader would have
# been allowed to see.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
  mbc: B0032

composite_rules:
  - id: escaped-import-command-execution
    desc: Escaped imports paired with command execution
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/imports::escaped-static-module
    any:
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec-esm-import
      - id: micro-behaviors/process/create/shell/bridge::execsync-esm-import
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/create/exec::node-execfile-reference
    needs: 2
