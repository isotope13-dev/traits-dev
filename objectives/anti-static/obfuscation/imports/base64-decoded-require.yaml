# The base64 sibling of `node-charcode-decoded-require`.
#
# Concealing which module a file loads is the same move whichever encoding
# carries it: the charcode form is already covered next door, and this is the
# same shape written with `Buffer.from(x, 'base64')`. A package that resolves
# `fs/promises` and `path` through a decoder is hiding its capability list from
# anyone who greps the tarball before installing it -- bundlers rewrite module
# references into their own ids, but they leave the specifier readable, because
# nothing is gained by hiding it from the runtime.
#
# `near_bytes` mirrors the charcode rule: the decode and the require have to sit
# together, so a file that happens to do base64 work somewhere and dynamic
# loading elsewhere is not swept in.
#
# Worked example: the `@hex-validator/v2` and `@hash-validator/v2` sets, whose
# `utils.ts` decodes `fs/promises`, `path`, `readdir`, `readFile` and `.env`
# from base64 and then walks the tree reading every `.env` it finds.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.007
  mbc: B0032.014

composite_rules:
  - id: node-base64-decoded-require
    desc: Node module name base64-decoded before require
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
      - id: micro-behaviors/data/decode/base64::multiple-node-base64-decodes
