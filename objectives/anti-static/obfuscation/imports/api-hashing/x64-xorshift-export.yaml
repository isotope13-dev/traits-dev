defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: x64-xorshift-export-api-concealment
    desc: Conceals APIs with multiplicative export hashes
    crit: suspicious
    conf: 0.98
    attack: T1027.007
    all:
      - id: micro-behaviors/os/api-resolution/digest-export::x64-export-name-hash-call-loop
      - id: micro-behaviors/data/checksum::x64-multiply-xorshift-byte-hash
      - id: micro-behaviors/process/info/query::peb-access-x64
