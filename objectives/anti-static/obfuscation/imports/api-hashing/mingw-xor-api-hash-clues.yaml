# Compiler, XOR loop and API-resolution evidence; payload role is unknown.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: mingw-xor-api-hash-profile
  desc: MinGW XOR loop and API hash candidate
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/lang/compiler/native::mingw-built-pe
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::x86-byte-xor-terminator-loop
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
  any:
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  needs: 1
  unless:
  - id: metadata/binary/symbols/count::many-exports
