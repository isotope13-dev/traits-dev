defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: export-trie-name-hash-resolution
    desc: Hashed export names select Mach-O addresses
    crit: suspicious
    conf: 0.98
    attack: T1027.007
    if:
      type: yara
      # The export-name hash comparison leads to terminal-flag parsing and image-base address reconstruction.
      # Whole-container scanning also covers non-preferred Mach-O slices.
      source: |
        rule macho_hashed_export_trie {
          strings:
            $resolver = { 49 63 C6 4C 89 E7 41 C6 04 04 00 E8 ?? ?? ?? ?? 4C 39 E8 0F 84 ?? ?? ?? ?? [0-384] 48 83 E0 1B 75 ?? 48 8D 7C 24 ?? 48 89 DE E8 ?? ?? ?? ?? 48 03 44 24 ?? 48 39 5C 24 ?? 76 ?? }
            // ARM64 terminates a collected export name, calls the hash,
            // compares it, parses terminal flags (mask 0x1b), and reconstructs
            // an image-relative address. No API hashes or keys are fixed.
            $resolver_arm64 = { BF ?? ?? 38 ?? 03 00 AA ?? 03 ?? AA ?? ?? ?? 94 ?? 03 00 AA ?? 03 ?? AA ?? 01 ?? EB ?? ?? ?? 54 [0-24] ?? 03 ?? AA ?? ?? ?? 94 ?? ?? 40 F9 ?? 01 ?? EB ?? ?? ?? 54 (6? | 7?) 03 80 52 ?? 00 ?? 8A ?? ?? ?? B5 [0-512] 00 00 ?? 8B }
            // A register-allocation variant preserves the trie cursor across
            // the name hash and uses RBX for the terminal ULEB128 cursor.
            $resolver_saved_cursor = { 41 C6 04 17 00 4C 89 FF 4C 89 4C 24 ?? E8 ?? ?? ?? ?? 4C 8B 4C 24 ?? 4C 39 E0 0F 84 ?? ?? ?? ?? [0-384] 48 83 E0 1B 75 ?? 48 8D 5C 24 ?? 48 89 DF 4C 89 F6 E8 ?? ?? ?? ?? 48 03 44 24 ?? 4C 39 33 76 ?? }
          condition:
            any of ($resolver*)
        }
