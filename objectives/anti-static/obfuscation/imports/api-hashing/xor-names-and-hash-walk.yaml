# Hiding the same memory APIs two ways at once: VirtualAlloc and
# VirtualProtect names stored XOR-encoded, plus a PEB/export walk that
# resolves other functions by hash. One concealment method is common in
# commercial protectors; stacking both on a small program is a loader that
# expects its imports to be read.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.007,T1620
composite_rules:
  - id: xor-encoded-memory-api-names-with-hash-resolver
    desc: XOR-hidden memory APIs plus hash-based export walk
    crit: hostile
    conf: 0.88
    all:
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-virtual-alloc-api
      - id: micro-behaviors/mem/protect/modify::xor-decoded-virtual-protect-api
      - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-walk-hash-resolver-x64
    unless:
      - id: metadata/signed/platform/
