---
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: aliased-export-resolver-entropy-resource
  desc: Aliased export resolver and opaque resource
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/imports/api-hashing::x64-pe-export-resolver-with-aliased-stubs
  - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
  unless:
  - id: metadata/installer/product/
- id: opaque-resource-api-hash-clues
  desc: Opaque resource and API hashing clues
  conf: 0.95
  all:
  - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
  any:
  - id: metadata/binary/code/complexity::no-functions
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/vendor/identity::microsoft-corp-versioninfo
  unless:
  - id: metadata/filename/name-form::is-microsoft-named
- id: opaque-resource-export-syscall-clues
  desc: Opaque resource, export walk and syscall clues
  conf: 0.96
  all:
  - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-export-walk-primitive
  any:
  - id: objectives/evasion/anti-av/syscall::indirect-syscall-gate
  - id: objectives/evasion/anti-av/syscall::windows-direct-syscalls
  unless:
  - id: metadata/filename/name-form::is-microsoft-named
