# Custom near-FNV API-hash algorithm family
# Hash algorithm: seed 0xB4B8026F, per-byte step (byte ^ hash) * 0x10003C9 --
# an FNV-1a shape with a corrupted prime, distinct from the 0x01000193 FNV-1a
# implementations covered under micro-behaviors/data/checksum. Verified in an
# importless x64 MSVC loader that walks the PEB, parses each loaded module's
# export table and resolves every API through this hash. The WinHTTP constants
# below are precomputed under the same algorithm; in the verified sample all
# twelve resolve inside one bootstrap that stores the client into globals.
# Same convention as the additive-hash family file in this directory.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007
  mbc: F0004
traits:
- id: near-fnv-prime-imul
  desc: Near-FNV API-hash prime constant (0x10003C9)
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: C9 03 00 01
- id: near-fnv-hash-seed
  desc: Near-FNV API-hash seed constant (0xB4B8026F)
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: (41 B8|B8|B9|BA|BB|BC|BD|BE|BF) 6F 02 B8 B4
- id: winhttpopen-near-fnv-hash
  desc: WinHttpOpen near-FNV hash constant
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: B3 90 E0 4F
- id: winhttpconnect-near-fnv-hash
  desc: WinHttpConnect near-FNV hash constant
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 31 D5 26 07
- id: winhttpopenrequest-near-fnv-hash
  desc: WinHttpOpenRequest near-FNV hash constant
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: DA 6F BC 54
- id: winhttpsendrequest-near-fnv-hash
  desc: WinHttpSendRequest near-FNV hash constant
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: BA DD 4D 04
- id: winhttpwritedata-near-fnv-hash
  desc: WinHttpWriteData near-FNV hash constant
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: DA 24 C5 81
- id: winhttpreaddata-near-fnv-hash
  desc: WinHttpReadData near-FNV hash constant
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: FD 5F B6 73
composite_rules:
- id: near-fnv-api-hash-family
  desc: Near-FNV API hashing beside a manual loader primitive
  crit: suspicious
  conf: 0.95
  size_max: 5242880
  all:
  - id: near-fnv-prime-imul
  - id: near-fnv-hash-seed
  any:
  - id: micro-behaviors/process/info/query::peb-access-x64
  - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
  - id: metadata/binary/instruction/sequence::x86-load-displacement-3c
- id: near-fnv-winhttp-hash-table
  desc: Importless PE carries a near-FNV hash table of the WinHTTP client
  # An image that imports nothing cannot call winhttp through the loader, so a
  # table of precomputed WinHTTP client hashes exists to resolve the network
  # stack while keeping it out of the import table. Ordinary software links
  # winhttp by name; concealed full-client resolution is a loader/stealer
  # behavior with no benign build observed.
  crit: hostile
  conf: 0.97
  size_max: 5242880
  all:
  - id: metadata/binary/symbols/count::no-imports
  needs: 4
  any:
  - id: winhttpopen-near-fnv-hash
  - id: winhttpconnect-near-fnv-hash
  - id: winhttpopenrequest-near-fnv-hash
  - id: winhttpsendrequest-near-fnv-hash
  - id: winhttpwritedata-near-fnv-hash
  - id: winhttpreaddata-near-fnv-hash
