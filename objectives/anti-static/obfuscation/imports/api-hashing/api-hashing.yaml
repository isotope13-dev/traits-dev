defaults:
  platforms:
    - linux
    - macos
    - windows
  attack: T1027.007
  mbc: B0032.014
  for:
    - elf
    - macho
    - pe
traits:
  - id: ror13-hash-seed
    desc: ROR13 hash algorithm constant
    crit: component
    conf: 0.8
    arch:
      - x86
      - x86-64
    count_min: 15
    per_kb_min: 0.05
    size_max: 5242880
    if:
      type: hex
      section: text
      pattern: C1 C? 0D
  - id: ror14-hash-seed
    desc: ROR14 hash algorithm constant
    crit: component
    conf: 0.8
    arch:
      - x86
      - x86-64
    for:
      - pe
      - dll
    count_min: 8
    per_kb_min: 0.05
    size_max: 5242880
    if:
      type: hex
      section: text
      pattern: C1 C? 0E
  - id: ror14-hash-loop-x64
    desc: ROR-14 hash inner loop (x64)
    crit: notable
    conf: 0.9
    arch:
      - x86-64
    for:
      - pe
      - dll
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: 41 C1 C8 0E 0F BE C0 44 03 C0
  - id: djb2-hash-constant
    desc: DJB2 hash algorithm constant (5381)
    crit: component
    conf: 0.75
    count_min: 1
    for:
      - pe
      - dll
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: (B8|B9|BA|BB|BC|BD|BE|BF|41 B8|41 B9|41 BA|41 BB|41 BC|41 BD|41 BE|41 BF) 05 15 00 00
    unless:
      - id: micro-behaviors/fs/path/application/interpreter::system-shell-basename
      - id: well-known/tool/offensive/reconnaissance/adfind::adfind-binary-context
  - id: djb2-multiply-33
    desc: DJB2 hash multiply-by-33 instruction
    crit: component
    conf: 0.7
    for:
      - pe
      - dll
    arch:
      - x86
      - x86-64
    count_min: 1
    size_max: 10485760
    if:
      type: hex
      section: .text
      pattern: 6B (C0|C9|D2|DB|E4|ED|F6|FF) 21
  - id: djb2-shift-add-loop-x86
    desc: x86 DJB2 shift-add hash loop
    crit: component
    conf: 0.98
    for:
      - pe
      - dll
    arch:
      - x86
    size_max: 10485760
    if:
      type: hex
      section: .text
      pattern: 8B 4D ?? C1 E1 05 03 4D ?? 03 4D ?? 89 4D ??
  - id: djb2-byte-hash-loop-x64
    desc: x64 byte DJB2 hash loop
    crit: notable
    conf: 0.9
    for:
      - pe
      - dll
    arch:
      - x86-64
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: (41|44|45) 0F B6 ?? 6B ?? 21 03 ??
  - id: multiplicative-hash-seed-71efd7
    desc: Custom API hash seed constant
    crit: notable
    conf: 0.9
    for:
      - pe
    arch:
      - x86
    if:
      type: hex
      section: text
      pattern: BE D7 EF 71 00
  - id: multiplicative-hash-seed-55a31
    desc: Custom API hash seed 55a31
    crit: notable
    conf: 0.88
    for:
      - pe
    arch:
      - x86
    count_min: 3
    if:
      type: hex
      section: text
      pattern: 31 5A 05 00
  - id: ror13-peb-export-resolver-x86
    desc: x86 PEB export resolution with ROR13
    crit: suspicious
    conf: 0.99
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86
    size_max: 5242880
    if:
      type: hex
      pattern: 64 8B (50|52) 30 8B 52 0C 8B 52 14 [0-8] 8B 72 28 [0-32] AC 3C 61 7C ?? 2C 20 [0-8] C1 CF 0D 
        [0-8] 01 C7
      offset_range:
        - 0
        - 
  - id: ror13-peb-export-resolver-x64
    desc: x64 PEB export resolution with ROR13
    crit: suspicious
    conf: 0.99
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    size_max: 5242880
    if:
      type: hex
      pattern: 65 48 8B 52 60 48 8B 52 18 48 8B 52 20 [0-8] 48 8B 72 50 [0-16] 48 31 C0 AC 3C 61 7C ?? 2C 20 
        [0-8] 41 C1 C9 0D [0-8] 41 01 C1
      offset_range:
        - 0
        - 
    unless:
      - id: metadata/package/testing/corpus/parsing::concatenated-pe-poc-corpus
  - id: pe-loader-peb-access-x64
    desc: PEB access in custom loader section
    crit: notable
    conf: 0.95
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    if:
      type: hex
      section: .hdr
      pattern: 65 48 8b 04 25 60 00 00 00
  - id: pe-loader-mz-check-x64
    desc: MZ validation in custom loader section
    crit: notable
    conf: 0.9
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    if:
      type: hex
      section: .hdr
      pattern: B8 4D 5A 00 00
  - id: pe-loader-e-lfanew-walk-x64
    desc: PE e_lfanew walk in custom loader
    crit: notable
    conf: 0.9
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    if:
      type: hex
      section: .hdr
      pattern: 48 63 ?? 3C
  - id: pe-loader-api-name-hash-x64
    desc: Multiply-by-97 export hash loop in loader
    crit: notable
    conf: 0.88
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    if:
      type: hex
      section: .hdr
      pattern: 45 6B ?? 61
  - id: ldr-walk
    desc: Manual LDR module list traversal
    crit: suspicious
    conf: 0.9
    for:
      - pe
    arch:
      - x86-64
    if:
      type: hex
      section: .text
      pattern: 65 48 8b 04 25 60 00 00 00 [0-32] 48 8b ?? 18 00 00 00 [0-8] 48 8b ?? 20 00 00 00
    unless:
      - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: loadlibrarya-ror13-hash
    desc: LoadLibraryA ROR13 hash constant
    crit: suspicious
    conf: 0.9
    for:
      - pe
    if:
      type: hex
      section: data
      pattern: 8E 4E 0E EC
  - id: getprocaddress-ror13-hash
    desc: GetProcAddress ROR13 hash constant
    crit: suspicious
    conf: 0.9
    for:
      - pe
    if:
      type: hex
      section: data
      pattern: AA FC 0D 7C
  - id: native-hash-module-define-template
    desc: Native API hash module define template
    crit: suspicious
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      substr: '#define HASH_MODULE_%s'
composite_rules:
  - id: importless-hashed-export-resolver-calls
    desc: Importless PE invokes manual export resolvers with hashed API requests
    crit: suspicious
    conf: 0.99
    for:
      - pe
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::hashed-pe-export-resolver-callsite
      - id: metadata/binary/symbols/count::no-imports
  - id: importless-hash-resolved-native-process-query
    desc: Importless PE resolves NtQueryInformationProcess by API-name hash
    crit: suspicious
    conf: 0.99
    for:
      - pe
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::hashed-ntqueryinformationprocess-resolution
      - id: metadata/binary/symbols/count::no-imports
  - id: importless-api-hashing-peb-rwx-operands
    desc: Importless API hashing with PEB/RWX operands
    crit: suspicious
    conf: 0.98
    mbc: B0032
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    size_max: 5242880
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
    any:
      - id: djb2-multiply-33
      - id: objectives/anti-static/obfuscation/imports/hash-variants::near-fnv-api-hash-family
    needs: 1
  - id: importless-peb-hex-payload-loader
    desc: Unsigned importless PE hides a hex payload behind PEB access
    crit: hostile
    conf: 0.97
    attack: T1027,T1027.007,T1620
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    size_max: 5242880
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: metadata/file/encoding/hex::long-hex-text-run
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
  - id: importless-x86-heavens-gate-loader
    desc: Importless x86 PE switches to x64 through Heaven's Gate
    crit: hostile
    conf: 0.99
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86
    attack: T1027.007,T1620
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-transition
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-segment-read
  - id: importless-export-resolver-memory-stager
    desc: Importless export-resolver PE with concealed in-memory staging
    crit: hostile
    conf: 0.99
    attack: T1027.007,T1620
    for:
      - pe
    arch:
      - x86-64
    size_max: 5242880
    all:
      - id: x64-pe-export-resolver-with-aliased-stubs
      - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
    any:
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
    needs: 1
    unless:
      - id: metadata/installer/product/
  - id: pe-loader-manual-export-resolver-x64
    desc: Custom PE loader hashes export names
    crit: suspicious
    conf: 0.97
    for:
      - pe
      - dll
    platforms:
      - windows
    all:
      - id: pe-loader-peb-access-x64
      - id: pe-loader-mz-check-x64
      - id: pe-loader-e-lfanew-walk-x64
      - id: pe-loader-api-name-hash-x64
  - id: x64-manual-export-hash-resolver
    desc: x64 manual export walk with API hashing
    crit: hostile
    conf: 0.98
    attack: T1027.007,T1620
    for:
      - pe
      - dll
    platforms:
      - windows
    all:
      - id: micro-behaviors/os/api-resolution/manual::x64-pe-export-directory-walk-inline
      - id: micro-behaviors/os/api-resolution/digest-export/hash::shift-add-33-hash-loop-x64
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
  - id: evasive-random-pe-layout-protection
    desc: Nonstandard PE sections, future timestamp, VirtualProtect
