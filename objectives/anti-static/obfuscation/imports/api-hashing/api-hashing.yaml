    conf: 0.95
    for:
      - pe
    all:
      - id: micro-behaviors/data/checksum::fnv1a-x86-prime-imul
      - id: micro-behaviors/data/checksum::custom-fnv-seed-53ff68-x86
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: micro-behaviors/os/api-resolution/manual::x86-peb-loader-data-load
      - id: micro-behaviors/process/info/query::peb-access-x86
      - id: metadata/binary/instruction/sequence/unspecified::x86-load-displacement-3c
  - id: fnv1a-x64-api-resolution
    desc: FNV constant with manual PE export lookup
    crit: suspicious
    conf: 0.92
    for:
      - pe
      - dll
    platforms:
      - windows
    arch:
      - x86-64
    size_max: 5242880
    all:
      - id: micro-behaviors/data/checksum::fnv1a-prime-64bit-movabs
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
