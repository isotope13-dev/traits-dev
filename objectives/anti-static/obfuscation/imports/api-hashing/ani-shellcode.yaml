defaults:
  platforms: [windows]
  for: [data]
  crit: hostile
  conf: 0.99
  attack: T1027.007,T1203

composite_rules:
  - id: ani-hashed-api-code
    desc: ANI contains x86 hashed API resolution
    crit: suspicious
    all:
      - id: metadata/file/format/media::riff-animated-cursor
      - id: micro-behaviors/os/api-resolution/hash-based::raw-x86-ror13-export-loop
      - id: micro-behaviors/os/api-resolution/hash-based::raw-x86-createprocess-hash
  - id: ani-overflow-hashed-api-shellcode
    desc: ANI overflow shellcode resolves APIs by hash
    all:
      - id: objectives/execution/exploit/memory::ani-duplicate-header-overflow
      - id: micro-behaviors/os/api-resolution/hash-based::raw-x86-ror13-export-loop
      - id: micro-behaviors/os/api-resolution/hash-based::raw-x86-createprocess-hash
  - id: ani-xor-hashed-api-shellcode
    desc: ANI overflow conceals hashed API resolution
    all:
      - id: objectives/execution/exploit/memory::ani-overflow-xor-code-staging
      - id: micro-behaviors/os/api-resolution/hash-based::xor-x86-winexec-hash
