defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
composite_rules:
  - id: x64-crc-export-resolution
    desc: PE export lookup with nearby CRC name hashing
    crit: suspicious
    conf: 0.98
    attack: T1027.007
    near_bytes: 512
    all:
      - id: micro-behaviors/data/parse/portable-executable::x64-export-name-ordinal-address-tables
      - id: micro-behaviors/os/api-resolution/digest-export/hash::x64-bitwise-crc-name-fold
