# Additive-hash API resolution family
# Hash algorithm: seed 0x1F2E3D4C, multiplier 0x1003F, shift >>11 XOR step
# Used by Goodboy framework (stages 1-15) and other custom loaders that adopt the same algorithm.
# Constants below are precomputed for well-known DLL/API names under this algorithm.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007
  mbc: F0004
composite_rules:
- id: additive-hash-table-multiple-apis
  desc: Multiple precomputed additive-hash API constants (hash table)
  crit: suspicious
  conf: 0.95
  size_max: 5242880
  needs: 4
  any:
  - id: metadata/binary/code/api-hash::virtualprotect-additive-hash
  - id: metadata/binary/code/api-hash::loadlibrarya-additive-hash
  - id: metadata/binary/code/api-hash::messageboxw-additive-hash
  - id: metadata/binary/code/api-hash::nt-allocate-vm-additive-hash
  - id: metadata/binary/code/api-hash::nt-protect-vm-additive-hash
  - id: metadata/binary/code/api-hash::nt-create-thread-ex-additive-hash
  - id: metadata/binary/code/api-hash::wait-for-single-object-additive-hash
  - id: metadata/binary/code/api-hash::close-handle-additive-hash
  unless:
  - id: metadata/binary/framework/
- id: additive-hash-cross-dll-resolution
  desc: Cross-DLL hash resolution (kernel32 + user32 + ntdll precomputed hashes)
  crit: suspicious
  conf: 0.93
  size_max: 5242880
  needs: 3
  any:
  - id: metadata/binary/code/api-hash::kernel32-additive-hash
  - id: metadata/binary/code/api-hash::user32-additive-hash
  - id: metadata/binary/code/api-hash::ntdll-additive-hash
  unless:
  - id: metadata/binary/framework/
- id: additive-hash-syscall-staging
  desc: Concealed loader staging direct ntdll syscalls via API hashing
  crit: hostile
  conf: 0.95
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: objectives/evasion/process/injection/shellcode::concealed-shellcode-loader-x64
  any:
  - id: metadata/binary/code/api-hash::nt-allocate-vm-additive-hash
  - id: metadata/binary/code/api-hash::nt-protect-vm-additive-hash
  - id: metadata/binary/code/api-hash::nt-create-thread-ex-additive-hash
- id: additive-hash-direct-api-call
  desc: User-facing API resolved via hash (MessageBoxW direct call)
  crit: suspicious
  conf: 0.92
  size_max: 5242880
  all:
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-walk-hash-resolver-x64
  - id: metadata/binary/code/api-hash::messageboxw-additive-hash
  - id: metadata/binary/code/api-hash::user32-additive-hash
  unless:
  - id: metadata/binary/framework/
