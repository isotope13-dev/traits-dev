defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Same predicate as the former XXTEA/zlib/hidden-API loader. The required
  # export walk plus hash loop supports API concealment, but the constant
  # supplies neither a cipher identity nor a decrypt-to-execution chain.
  - id: ror14-export-concealment-with-zlib
    desc: ROR14 API concealment beside zlib
    crit: suspicious
    conf: 0.95
    attack: T1027.007
    size_max: 2097152
    all:
      - id: micro-behaviors/data/compress::zlib
      - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-export-walk-primitive
      - id: objectives/anti-static/obfuscation/imports/api-hashing::ror14-hash-loop-x64
    any:
      - id: metadata/binary/instruction/operand::inverse-golden-ratio-imul
      - id: metadata/binary/instruction/operand::inverse-golden-ratio-mov
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/signed/platform/
