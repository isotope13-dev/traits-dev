# Export forwarding and memory/XOR clues do not establish execution.
defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
composite_rules:
- id: forwarded-export-xor-memory-api-profile
  desc: Forwarded exports with XOR and memory APIs
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/dylib/lookup::source-forwarded-export-directive
  - id: micro-behaviors/mem/combined::source-xor-memory-api-profile
