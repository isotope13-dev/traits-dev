# The source-code counterpart to vb6-dynamic-api.yaml, which reasons over the
# compiled VB6 binary. A crypter stub ships as .cls/.bas/.frm long before it is
# compiled, and at that stage the concealment is plain to read: a hand-rolled
# per-character decoder feeding library and procedure names into the VB
# runtime's own late-bound dispatcher, so the file declares no API it calls.
defaults:
  crit: suspicious
  platforms: [windows]
  for: [vbs]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: vb-source-decoded-api-dispatch
    desc: VB source dispatches decoded API names
    crit: hostile
    conf: 0.94
    attack: T1027,T1106
    all:
      - id: micro-behaviors/dylib/lookup::vb-dll-function-call-declare
    any:
      - id: micro-behaviors/data/encode/char-code::vb-reversed-string-char-decoder
      - id: micro-behaviors/data/encode/char-code::vb-length-keyed-char-shift
    needs: 1

  - id: vb-source-decoded-api-memory-stage
    desc: VB decodes API names to stage memory
    crit: hostile
    conf: 0.96
    attack: T1027,T1055
    all:
      - id: vb-source-decoded-api-dispatch
    any:
      - id: micro-behaviors/mem/inline-asm::vb-hex-string-to-byte-buffer
      - id: micro-behaviors/data/embedded/payload/header::vb-image-header-type-decl
      - id: micro-behaviors/process/info/thread::vb-context-struct-debug-regs
