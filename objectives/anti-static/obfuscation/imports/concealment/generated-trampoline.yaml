# Writes MOV EAX,<encoded target>; XOR EAX,<key>; JMP EAX into a fresh stub.
# Target and key immediates are variable; no build-specific key is required.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
- id: x86-generated-xor-api-trampoline
  desc: Generates XOR-hidden call trampolines
  crit: suspicious
  conf: 0.98
  attack: T1027
  if:
    type: hex
    section: text
    pattern: 'C6 00 B8 [60-140] B8 [4] 33 D8 89 5A 01 C6 42 05 35 89 42 06 66 C7 42 0A FF E0'
