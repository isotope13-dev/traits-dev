defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-obfuscated-library-registration
    desc: Camouflaged batch variables accompany Windows copy and registration
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::copy-to-windir-percent-var
      - id: metadata/lang/source/naming/variable::batch-long-digit-suffix-assignments
      - id: micro-behaviors/fs/path/application/executable::regsvr32-reference-or-call
