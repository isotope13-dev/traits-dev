defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.98

traits:
  - id: xor-section-apc-api-names
    desc: XOR-concealed section mapping and APC APIs
    attack: T1027
    if:
      type: yara
      source: |
        import "pe"
        rule xor_section_apc_api_names {
          strings:
            $create = "NtCreateSection" xor(1-255)
            $map = "NtMapViewOfSection" xor(1-255)
            $protect = "NtProtectVirtualMemory" xor(1-255)
            $queue = "QueueUserAPC" xor(1-255)
            $resume = "ResumeThread" xor(1-255)
          condition:
            pe.is_pe and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].characteristics & pe.SECTION_CNT_INITIALIZED_DATA != 0 and
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE == 0 and
              all of them in (pe.sections[s].raw_data_offset..
                             pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size)
            )
        }
