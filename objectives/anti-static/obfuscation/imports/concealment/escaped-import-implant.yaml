# Escaping import names obstructs source review, while process APIs can
# belong to inventory, licensing and launcher utilities. Their co-occurrence
# warrants review but does not establish a remote command or hostile payload.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
  mbc: B0032

composite_rules:
  - id: escaped-import-command-execution
    desc: Escaped imports with process API references
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::escaped-static-module
    any:
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec-esm-import
      - id: metadata/import/builtin::execsync-esm-import
      - id: metadata/lang/source/syntax/key-value::node-windowshide-true-option
      - id: metadata/lang/source/naming/interface::execfile-identifier-text
    needs: 2


