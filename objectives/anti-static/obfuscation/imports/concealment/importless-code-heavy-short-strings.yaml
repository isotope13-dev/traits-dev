defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 524288
composite_rules:
  - id: importless-code-heavy-short-strings
    desc: Importless code-heavy PE with short strings
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/section/ratio::few-sections
      - id: metadata/binary/layout/strings::large-binary-short-max-and-average-strings
      - id: metadata/binary/layout/ratio::text-section-dominates-file
    any:
      - id: metadata/binary/provenance/build::header-timestamp-pre-2000
      - id: metadata/binary/resource/size::minimal-resources
      - id: metadata/binary/symbols/imports::single-import-count
    needs: 2
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab
