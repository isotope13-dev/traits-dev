defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1027,T1059.007

composite_rules:
  - id: node-split-array-binding-spawn-sync
    desc: Node reconstructs process.binding('spawn_sync') via array join and Reflect.apply
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-binding-token
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-spawn-sync-token
      - id: micro-behaviors/metaprogramming/reflection/invoke::js-reflect-apply-call

  - id: node-split-array-fetch-and-getbuiltinmodule
    desc: Node conceals fetch via array join and reads env via Reflect.get
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-fetch-token
      - id: micro-behaviors/os/module/dynamic-load::js-process-get-builtin-module-call
      - id: micro-behaviors/os/module/dynamic-load::js-reflect-get-platform-env
