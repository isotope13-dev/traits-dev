defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: table-stream-decoder-api-resolution-profile
    desc: Layered decoding beside dynamic API resolution
    crit: suspicious
    conf: 0.96
    attack: T1027
    # The observation is the combination, not a claim that every import is
    # hidden or that the decoded buffer necessarily reaches GetProcAddress.
    all:
      - id: objectives/anti-static/obfuscation/encoding/buffer::flattened-table-stream-string-decoding
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: flattened-table-stream-concealed-loader
    desc: Flattened decoding conceals dynamic API resolution in unsigned payload
    crit: hostile
    conf: 0.97
    attack: "T1027,T1027.007"
    all:
      - id: table-stream-decoder-api-resolution-profile
      - id: metadata/binary/layout/strings::native-string-over-256-kib
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
