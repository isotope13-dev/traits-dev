defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "batch-obfuscated-windows-component-install"
    desc: Obfuscated DLL staging runs registration helpers
    crit: "hostile"
    conf: 0.96
    all:
      - 
        id: "objectives/anti-static/obfuscation/imports/concealment::batch-obfuscated-library-registration"
      - 
        id: "micro-behaviors/process/argument/positional::batch-executable-registration-mode"
      - 
        id: "micro-behaviors/os/console/io::batch-command-stdout-nul"
      - id: micro-behaviors/os/com/registration::batch-regsvr32-silent-command
