defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
composite_rules:
  - id: vb6-runtime-windowproc-process-scan
    desc: VB6 resolves an indirect window-procedure call alongside process enumeration
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: micro-behaviors/ui/window/message::call-window-proc
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
      - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-process32-next
