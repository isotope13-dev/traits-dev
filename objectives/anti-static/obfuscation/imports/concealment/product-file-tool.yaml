# Manual export-table resolution can conceal a small unsigned program's real
# API surface. File enumeration and deletion are common capabilities of file
# tools, but a product-name resource alone is not a reliable identity claim.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007
  mbc: E1027

composite_rules:
  # Startup opens prev.inf and shows this caption. The Find/Delete imports and
  # the export walk are not on that path.
  - id: lookfor-wait-window-opens-inf
    desc: LookFor window opens a setup inf
    crit: exception
    for: [pe]
    all:
      - id: micro-behaviors/ui/window/message::momentary-status-window-caption
      - id: micro-behaviors/fs/path/config/system::previous-setup-inf-name
  - id: unsigned-versioned-file-api-export-walk
    desc: Unsigned versioned PE with export scanning and file operations
    crit: suspicious
    conf: 0.93
    size_max: 262144
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-backward-module-export-walk
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-version-product-name-value
      - id: micro-behaviors/fs/directory/readdir::find-file-walker
      - id: micro-behaviors/fs/delete/file/library::delete-win
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/tool/reverse-engineering/
      - id: lookfor-wait-window-opens-inf


