# Manual export-table resolution can conceal a small unsigned program's real
# API surface. File enumeration and deletion are common capabilities of file
# tools, but a product-name resource alone is not a reliable identity claim.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007
  mbc: E1027

composite_rules:
  - id: unsigned-file-tool-manual-api-resolution
    desc: Unsigned file tool manually resolves Windows APIs
    crit: suspicious
    conf: 0.93
    size_max: 262144
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-backward-module-export-walk
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/package/versioning/scheme::pe-version-product-name-value
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
      - id: micro-behaviors/fs/delete/file/library::delete-win
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/tool/reverse-engineering/


