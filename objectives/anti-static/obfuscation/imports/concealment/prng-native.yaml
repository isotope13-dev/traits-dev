defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: prng-xor-flattened-api-reference-profile
    desc: PRNG XOR, TLS flattening and API-resolution references
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: micro-behaviors/data/encoding/xor::x64-eight-byte-prng-xor-buffer-loop
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
