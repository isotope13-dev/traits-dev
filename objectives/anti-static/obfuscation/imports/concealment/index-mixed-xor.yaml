defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: index-xor-concealed-security-api-names
    desc: Index-derived XOR conceals security API names
    crit: suspicious
    conf: 0.99
    attack: T1027
    all:
      - id: micro-behaviors/data/encoding/xor::x64-index-mixed-byte-xor-copy
    any:
      - id: micro-behaviors/os/security/amsi::index-mixed-xor-scan-buffer-name
      - id: micro-behaviors/os/telemetry/logging/event::index-mixed-xor-event-write-name
