defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1027
composite_rules:
- id: vb6-obfuscated-runkey-persistence
  desc: VB6 concealed API dispatch with Run-key name
  crit: suspicious
  conf: 0.96
  unless:
  - id: metadata/installer/product/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
- id: vb6-obfuscated-wininet-downloader
  desc: VB6 concealed API dispatch with WinINet name
  crit: suspicious
  conf: 0.96
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
  - id: micro-behaviors/communications/http/client/wininet::internet-open-url-a-name
- id: vb6-obfuscated-keylogger
  desc: VB6 concealed API dispatch and keylogger label
  crit: suspicious
  conf: 0.95
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label
- id: vb6-concealed-keylogger
  desc: VB6 concealed Win32 APIs and keylogger label
  crit: suspicious
  conf: 0.95
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label
- id: vb6-toolhelp-hosts-loader
  desc: VB6 concealed APIs with process traversal
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
  - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
- id: vb6-concealed-wininet-cluster
  desc: VB6 concealed Win32 APIs with WinINet names
  crit: suspicious
  conf: 0.95
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
  - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
- id: vb6-obfuscated-http-url
  desc: VB6 concealed API dispatch and HTTP URL
  crit: suspicious
  conf: 0.93
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
  - id: micro-behaviors/communications/url/scheme::http-url-shaped-text
- id: vb6-concealed-shellexec
  desc: VB6 concealed Win32 APIs with ShellExecute
  crit: suspicious
  conf: 0.94
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
  - id: micro-behaviors/os/handler/open::shell-execute-api-text
- id: vb6-obfuscated-shellexec
  desc: VB6 concealed API dispatch with ShellExecute
  crit: suspicious
  conf: 0.94
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
  - id: micro-behaviors/os/handler/open::shell-execute-api-text


