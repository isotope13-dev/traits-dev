defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-encoded-injection-api-resolution
    desc: Encoded process APIs with decoding and delegate resolution
    crit: suspicious
    conf: 0.97
    attack: T1027.007
    all:
      - id: micro-behaviors/dylib/lookup::encoded-createprocess-name
      - id: micro-behaviors/mem/write/arbitrary::base64-write-process-memory-name
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
