defaults:
  platforms: [linux, macos, windows]
  for: [pe, elf, macho]
traits:
- id: sparse-strings-under-25-pe
  desc: Small PE has under twenty-five strings
  crit: notable
  conf: 0.82
  for:
  - pe
  size_min: 32768
  size_max: 65535
  if:
    type: metrics
    field: binary.string_count
    max: 24
  unless:
  - id: metadata/binary/framework/
  - id: metadata/signed/platform/
  - id: metadata/binary/symbols/exports::python-extension-stub
- id: five-plus-sections-pe
  desc: Five or more PE sections
  crit: component
  conf: 0.8
  for:
  - pe
  if:
    type: metrics
    field: sections.count
    min: 5
  unless:
  - id: metadata/lang/compiler/systems::go-pe-symtab
composite_rules:
- id: low-string-extension-soft-noise
  desc: Low-string extension soft compat noise
  crit: component
  conf: 0.85
  any:
  - id: metadata/file/extension/asset::packaged-asset-extension
  - id: metadata/file/extension/asset::data-file-extension
  - id: metadata/file/extension/asset::structured-asset-extension
- id: low-strings-soft-noise
  desc: Recognized low-string binary marker
  crit: component
  conf: 0.85
  any:
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/binary/layout/size::small-elf-binary
  - id: metadata/binary/layout/size::small-macho-binary
  - id: metadata/binary/code/complexity::many-functions
  - id: metadata/binary/installer/script::nullsoft-install-system
  - id: metadata/binary/symbols/count::many-imports-50
  - id: metadata/binary/framework::electron-desktop-runtime
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/signed/platform::microsoft
      # Wine/ReactOS builtin PEs implement (export) the Windows API rather than
      # importing it; their thin forwarder stubs are string-sparse by design.
  - id: metadata/lang/upstream::windows-system-implementer-dll
- id: themida-minimal-import-concealment
  desc: Themida-packed PE minimizes visible imports
  crit: hostile
  conf: 0.98
  for: [pe]
  attack: T1027,T1027.007
  all:
  - id: objectives/anti-static/pack/detect::themida-boot-loader-layout
  - id: metadata/binary/symbols/imports::pe-imports-max-six
  - id: metadata/binary/section/label::blank-section-name-cluster
  - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
  - id: metadata/signed/unknown/
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  # Unsigned Themida stubs with two-or-fewer imports and blank section names
  # hide the real IAT behind the boot unpacker. Self-issued siblings are
  # covered by themida-minimal-import-concealment; Google-signed Chrome is
  # excluded via the browser-context exception.
- id: themida-unsigned-sparse-blank-loader
  desc: Unsigned Themida sparse blank-section loader
  crit: hostile
  conf: 0.98
  for: [pe]
  attack: T1027.002,T1027.007
  mbc: F0001
  all:
  - id: objectives/anti-static/pack/detect::themida-boot-loader-layout
  - id: metadata/binary/symbols/imports::few-import-count
  - id: metadata/binary/section/label::blank-section-name-cluster
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/browser::google-chrome-browser-context
  # Unsigned Themida blank-section loaders that keep a process-launch primitive
  # in the visible IAT while hiding everything else behind the boot unpacker.
  # The two-import sibling above misses Themida stubs that leave a slightly
  # larger import table (a dozen entries here, including ShellExecuteW): the
  # concealed IAT still hides the payload's real capabilities, and the one
  # retained exec primitive is exactly what launches it after unpacking. A
  # legitimate Themida customer ships a signed binary with version identity,
  # so the unsigned + identity-less + sparse-import + exec combination has no
  # legitimate use.
- id: themida-unsigned-sparse-exec-loader
  desc: Unsigned Themida blank-section loader with sparse imports and shell execution
  crit: hostile
  conf: 0.97
  for: [pe]
  attack: T1027.002,T1027.007
  mbc: F0001
  all:
  - id: objectives/anti-static/pack/detect::themida-boot-loader-layout
  - id: metadata/binary/section/label::blank-section-name-cluster
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/resource/identity::pe-no-version-info-resource
  - id: metadata/binary/symbols/count::max-25-imports
  - id: micro-behaviors/process/create/shellexec::shell-execute
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/browser::google-chrome-browser-context
