# The required codec has modular table remapping and six-bit byte packing.
# The helper-fed lookup is bound locally; co-occurrence does not prove that the
# particular helper implements this decoder, nor that the resolved API runs.
defaults:
  platforms: [windows, unix]
  for: [rust]
composite_rules:
  - id: rust-rotated-decoder-helper-api-lookup
    desc: Rotated table decoder with helper-fed API lookup
    crit: suspicious
    conf: 0.94
    attack: T1027.007
    all:
      - id: micro-behaviors/data/decode/table::rotated-b64-table-decoder
      - id: micro-behaviors/dylib/lookup::rust-helper-result-api-name
