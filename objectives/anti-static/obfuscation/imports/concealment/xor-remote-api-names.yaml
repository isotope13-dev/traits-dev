# Native compilers can split API names into vector-sized blocks; string
# extraction may recover the URL but miss these unterminated 16-byte names.
# Match nonzero single-byte XOR keys, independently of compiler, architecture,
# language, package identity, and the particular key used by MALFEX (0x37).
# These observations establish concealed API references, not API invocation.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho, static-lib]
  crit: suspicious
  conf: 0.95
  attack: T1027.007

traits:
  - id: xor-remote-memory-write-name
    desc: XOR-concealed WriteProcessMemory name prefix
    if:
      type: yara
      source: |
        rule xor_remote_memory_write_name {
          strings:
            $name = "WriteProcessMemo" xor(1-255)
          condition:
            $name
        }

  - id: xor-remote-thread-start-name
    desc: XOR-concealed CreateRemoteThread name prefix
    if:
      type: yara
      source: |
        rule xor_remote_thread_start_name {
          strings:
            $name = "CreateRemoteThre" xor(1-255)
          condition:
            $name
        }
