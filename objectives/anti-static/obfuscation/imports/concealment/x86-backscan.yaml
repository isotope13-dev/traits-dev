defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: adjusted-mz-export-resolution
    desc: Obfuscated module scan resolves PE exports
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-adjusted-mz-backscan
      - id: micro-behaviors/os/api-resolution/manual::x86-export-names-pointer-walk

  - id: adjusted-mz-export-rwx-loader
    desc: Export scan resolves RWX payload loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1620
    all:
      - id: adjusted-mz-export-resolution
      - id: objectives/anti-static/obfuscation/payload/encoded/carrier::split-xor-rwx-loader
    unless:
      - id: metadata/installer/product/

