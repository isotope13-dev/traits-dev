defaults:
  platforms:
  - windows
  for:
  - pe
  mbc: B0032
  attack: T1027
composite_rules:
- id: unsigned-api-resolver-anti-debug-loader
  desc: Unsigned loader resolves APIs while checking for debuggers
  crit: hostile
  conf: 0.96
  attack: T1027.007,T1622
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/dylib/load/runtime::win32-system-library-loader-references
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  any:
  - id: objectives/anti-static/obfuscation/imports/api-hashing::additive-hash-table-multiple-apis
  - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string-text-section
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/lib/ui/cef::cef-runtime-binary-context
  - id: well-known/lib/ui/electron::electron-runtime-binary-context
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-windows-runtime-binary
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-compiled-pe-exception
- id: hidden-loader-api-string-cluster
  desc: Concealed loader API string cluster
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  - id: micro-behaviors/dylib/lookup::get-proc-address-prefix-no-import
  - id: micro-behaviors/mem/protect/modify::virtual-protect-prefix-no-import
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
