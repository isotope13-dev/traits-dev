# The lookup consumes a helper's result. The codec is a nearby observation,
# not a proof that this specific helper performs the decoding.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
composite_rules:
  - id: native-rotated-decoder-helper-api-lookup
    desc: Rotated table decoder with helper-fed API lookup
    crit: suspicious
    conf: 0.9
    attack: T1027.007
    near_lines: 60
    all:
      - id: micro-behaviors/data/decode/table::rotated-b64-table-decoder
      - id: micro-behaviors/dylib/lookup::native-helper-result-api-name
