defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: tls-rotate-xor-api-names
    desc: TLS string reconstruction conceals native API names
    crit: suspicious
    conf: 0.99
    attack: T1027.007
    all:
      - id: micro-behaviors/data/encoding/xor::x64-modulo-seven-byte-rotate-xor
      - id: micro-behaviors/process/thread/config::dense-x64-tls-array-access
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/os/com/invoke::rotate-xor-co-get-object-name
      - id: micro-behaviors/os/security/amsi::rotate-xor-open-session-name
