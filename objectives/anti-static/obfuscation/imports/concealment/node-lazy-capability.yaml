# Capability laundering: the Node builtins that actually do the work —
# `child_process`, `fs` — never appear in the module's static import list. They
# are pulled in from inside function bodies, so the module's declared surface is
# a set of pure helpers while its real surface is process execution.
#
# This observation is NOTABLE, not suspicious, and the demotion is worth
# recording because the first draft got it wrong. The argument for suspicious
# was "deferring one builtin is the isomorphic-library idiom, but nobody
# polyfills `child_process` away for a browser." A benign VS Code extension
# (DanielSanMedium.dscodegpt) falsified that: its Next.js *server* chunks are
# built through the same pipeline as its browser chunks, so they defer
# `node:fs` and `node:child_process` 395 bytes apart — closer together than the
# npm dropper this rule was written for — to locate a vendored `ripgrep` and
# spawn it with its stdout piped back. Proximity cannot separate the two, and
# neither can the swallowed-error leg: bundled code is full of `catch {}`.
#
# What actually separates them is what the laundered capability is used FOR.
# The dropper writes bytes it decoded, marks them executable and starts them
# detached with every stream discarded; the extension runs a tool it shipped and
# reads the answer. So the intent lives entirely in the drop-and-run leg of the
# hostile composite below, and this file's job is only to say "the fs and exec
# capability were kept out of the import list".
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1027,T1059.007"
  mbc: B0032

composite_rules:
  # Deferring ONE family is the isomorphic-library idiom. Deferring the
  # filesystem AND process execution from the same file is a helper module that
  # keeps its entire Node surface out of the import list — there is no browser
  # for which `child_process` is the part you polyfill away.
  - id: node-laundered-capability-dropper
    for: [javascript, typescript, npm]
    desc: Dropper launders its Node capability imports
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/os/module/require::node-lazy-exec-and-io-imports
      - id: micro-behaviors/process/create/variable-spawn::node-write-chmod-detached-spawn-profile
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
