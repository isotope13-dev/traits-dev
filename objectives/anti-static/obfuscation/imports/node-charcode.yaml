defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.007
  mbc: B0032.014

traits:
  - id: hex-charcode-dns-module
    desc: DNS module name concealed as hex codes
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: '[0x64,0x6e,0x73]'

  - id: hex-charcode-resolve4-method
    desc: resolve4 method concealed as hex codes
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: '[0x72,0x65,0x73,0x6f,0x6c,0x76,0x65,0x34]'

  - id: hex-literal-dns-module
    desc: DNS module name concealed as hex literal
    crit: component
    conf: 0.94
    if:
      type: literal
      exact: '646e73'
      case_insensitive: true

  - id: hex-literal-resolve4-method
    desc: resolve4 method concealed as hex literal
    crit: notable
    conf: 0.96
    if:
      type: literal
      exact: '7265736f6c766534'
      case_insensitive: true

composite_rules:
  - id: node-charcode-decoded-require
    desc: Node module name decoded before require
    crit: suspicious
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
      - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array

  # Some install hooks bypass `require()` and load through the private
  # `module.constructor[...](...)` path while still decoding module names from
  # numeric character-code arrays.
  - id: node-charcode-decoded-module-constructor-load
    desc: Private Node loader decodes module name
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::module-constructor-bracket-load
      - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array

  - id: node-charcode-decoded-module-load
    desc: Decoded module name reaches dynamic loader
    crit: suspicious
    conf: 0.97
    any:
      - id: node-charcode-decoded-require
      - id: node-charcode-decoded-module-constructor-load

  - id: node-charcode-concealed-dns-resolution
    for: [javascript, typescript, npm]
    desc: Node DNS resolver APIs concealed as character codes
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: hex-charcode-dns-module
      - id: hex-charcode-resolve4-method

  - id: node-hex-string-concealed-dns-resolution
    desc: Node DNS resolver concealed as hex strings
    crit: suspicious
    conf: 0.99
    near_bytes: 1536
    all:
      - id: hex-literal-dns-module
      - id: hex-literal-resolve4-method
      - id: micro-behaviors/os/module/dynamic-load::node-require-alias-binding

  - id: install-hook-charcode-concealed-dns-loader
    desc: Install hook conceals a Node DNS module loader
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript, package.json, npm, tar]
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/local-script::install-runs-node-local-script
      - id: micro-behaviors/process/create/load/local::cjs-caught-local-require
      - id: node-charcode-decoded-module-load
      - id: hex-charcode-dns-module
    unless:
      # Yield to the end-to-end DNS profile beacon when the package also
      # assembles host fields into the queried label.
      - id: micro-behaviors/data/string/concat::js-array-join-fallback-labels
