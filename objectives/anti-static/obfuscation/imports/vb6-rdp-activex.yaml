# VB6 binaries that embed Microsoft RDP ActiveX ProgIDs (mstscax / MsRdpClient)
# as packing or decoy surface — a recurring Beebone/Vobfus stub technique.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032
  size_min: 16384
  size_max: 524288

composite_rules:
  - id: vb6-embedded-rdp-activex-controls
    desc: VB6 binary embeds RDP ActiveX controls
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: micro-behaviors/os/com/object::mstscax-dll-literal
      - id: micro-behaviors/os/com/object::msrdp-client-progid
      - id: micro-behaviors/os/com/object::mstsclib-ctl-namespace
    unless:
      - id: well-known/app/network/freerdp/
