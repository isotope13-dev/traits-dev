# Multiplicative API-name hash (h = h * 0x2001 + c) used for dynamic import
# resolution in native loaders.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1027.007
  mbc: F0004

traits:
  - id: mul-0x2001-api-hash
    desc: Multiplicative 0x2001 API hash
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\*\s*0x2001u?\b'

composite_rules:
  - id: hashed-ntdll-rwx-stage
    desc: Hashed ntdll resolve with RWX stage
    crit: hostile
    conf: 0.97
    all:
      - id: mul-0x2001-api-hash
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-source
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
    near_bytes: 8192
