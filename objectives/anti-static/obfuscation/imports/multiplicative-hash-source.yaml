# Multiplicative API-name hash (h = h * 0x2001 + c) used for dynamic import
# resolution in native loaders.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1027.007
  mbc: F0004

composite_rules:
  - id: hashed-ntdll-rwx-stage
    desc: Hashed ntdll resolve with RWX stage
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/measure::multiplicative-0x2001-hash-step
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
    near_bytes: 8192
