defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: install-hook-charcode-concealed-module
    desc: Install hook loads concealed character-code module
    crit: suspicious
    conf: 0.99
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: objectives/anti-static/obfuscation/imports/computed::node-charcode-decoded-require
      - id: micro-behaviors/data/control-flow/error-handling/catch::catch-before-await-or-require
