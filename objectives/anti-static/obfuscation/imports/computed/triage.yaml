composite_rules:
- id: computed-com-binary-stream
  platforms:
  - windows
  for:
  - javascript
  - vbs
  attack: T1059.007
  desc: Binary stream co-occurs with concealed COM or code construction
  crit: suspicious
  conf: 0.95
  mbc: B0017
  all:
  - id: micro-behaviors/fs/file/io-mode::vbs-stream-binary-mode
  any:
  - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
  - id: micro-behaviors/os/com/automation::vbs-computed-createobject
  - id: objectives/execution/interpreter/script/wsh::wscript-shell-obfuscated
  unless:
  - id: metadata/build/scaffold::windows-wget-js-bootstrap-helper
  downgrade:
    any:
    - id: metadata/build/bundler/asset::js-large-module-bundle
    - id: micro-behaviors/process/interpreter/vm/
    - id: well-known/app/productivity/winmerge/
