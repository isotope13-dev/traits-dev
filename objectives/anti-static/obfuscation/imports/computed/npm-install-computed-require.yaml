defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: install-hook-computed-module-loader
    desc: Install hook uses an obfuscated computed Node module loader
    crit: suspicious
    conf: 0.97
    attack: T1027.007
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: objectives/anti-static/obfuscation/imports/computed::node-charcode-decoded-require
