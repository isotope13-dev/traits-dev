defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: install-hook-swallowed-charcode-helper
    desc: Install hook ships an obfuscated swallowed local helper
    crit: suspicious
    conf: 0.99
    attack: T1027
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::install-runs-node-local-script
      - id: micro-behaviors/os/module/require::cjs-caught-local-require
      - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
      - id: metadata/lang/source/naming/variable::hex-variable-names
    unless:
  # A decoded domain export is the more specific concealed-sidecar shape.
      - id: micro-behaviors/os/module/export::commonjs-domain-like-export
