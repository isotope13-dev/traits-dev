# Legitimate P/Invoke almost always names the DLL and entry point as a single
# literal string (`[DllImport("kernel32.dll", EntryPoint = "VirtualAlloc")]`).
# Building either argument from concatenated identifiers instead of a literal
# has no ordinary-development purpose -- it exists to keep the imported DLL
# and API name out of the string table so a signature scan of the raw text
# never sees "kernel32.dll" or "VirtualAlloc". This is a shape-based check
# (identifier + N concatenations), so it generalizes to any future loader
# that fragments a Win32 API name this way, not just the specific fragment
# variable names or APIs one sample happens to split.
defaults:
  platforms: [windows]
  for: [csharp, powershell]
  attack: T1027.007
  mbc: B0032

traits:
  - id: dllimport-libname-concatenated
    desc: DllImport library name built via concatenation
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'DllImport\s*\(\s*\w+(\s*\+\s*\w+){2,}'

  - id: dllimport-entrypoint-concatenated
    desc: DllImport EntryPoint built via concatenation
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'EntryPoint\s*=\s*\w+\s*\+\s*\w+'

composite_rules:
  - id: dllimport-name-fragmentation-evasion
    desc: P/Invoke DLL and entry-point names built via string-fragment concatenation
    crit: hostile
    conf: 0.97
    all:
      - id: dllimport-libname-concatenated
      - id: dllimport-entrypoint-concatenated
