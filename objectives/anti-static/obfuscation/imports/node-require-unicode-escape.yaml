# Spelling a module specifier's ASCII characters as escape sequences.
#
# `require("\u0072\u0065\u0061\u0064\u006C\u0069\u006E\u0065")` loads exactly the
# module `require("readline")` loads: the JavaScript lexer decodes the escapes
# long before resolution, so the disguise costs the author nothing at runtime.
# What it buys is invisibility — a grep, an import index, a dependency
# extractor, and a reviewer skimming the file all see a wall of escapes instead
# of `child_process`, `https`, or the undeclared package being pulled in.
#
# Only *ASCII-range* escapes match (\u00xx, \x0x-\x7x). Escaping a
# non-ASCII character is ordinary — a bundler emits `./\u4f60\u597d.js` for a
# CJK filename to keep its output 7-bit clean — but no toolchain has any reason
# to escape a character it could have written literally.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  - id: escaped-module-specifier
    desc: Module name spelled as ASCII escape sequences
    crit: suspicious
    conf: 0.9
    if:
      type: import
      regex: '\\(u00[0-7]|x[0-7])[0-9a-fA-F]'
    unless:
      - id: metadata/package/testing/
  - id: escaped-dynamic-import-specifier
    desc: Dynamic import name spelled as ASCII escapes
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'import\s*\(\s*[''"]\\(u00[0-7]|x[0-7])[0-9a-fA-F]'
    unless:
      - id: metadata/package/testing/
