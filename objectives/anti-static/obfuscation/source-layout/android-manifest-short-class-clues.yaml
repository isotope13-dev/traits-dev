defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

traits:
- id: loader-manifest-control-yara
  desc: Messaging, permissions and short class names
  crit: suspicious
  conf: 0.995
  if:
    type: yara
    source: |
      rule loader_manifest_control_surface {
        strings:
          $a = "com.google.firebase.MESSAGING_EVENT" ascii wide
          $b = "android.permission.FOREGROUND_SERVICE" ascii wide
          $c = "android.permission.READ_EXTERNAL_STORAGE" ascii wide
          $d = "android.permission.WRITE_EXTERNAL_STORAGE" ascii wide
          $e = "android.net.conn.CONNECTIVITY_CHANGE" ascii wide
          $f = "android.permission.WAKE_LOCK" ascii wide
          $g = "usesCleartextTraffic" ascii wide
          $h = "android.permission.POST_NOTIFICATIONS" ascii wide
          $ns = /tk\.gc\.[A-Za-z]{1,5}/ ascii wide
        condition:
          $a and $b and $c and $d and $e and 1 of ($f,$g,$h) and #ns >= 20
      }

composite_rules:
- id: obfuscated-push-control-manifest
  desc: Firebase, short class names and Android permission references
  for: [apk, zip, dex, xml]
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/lib/cloud/firebase-messaging::firebase-messaging-event
  - id: metadata/binary/symbols/class::obfuscated-gc-namespace-burst
  any:
  - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
  - id: micro-behaviors/os/message/intent::connectivity-change-receiver
  - id: micro-behaviors/communications/http/client/configure::cleartext-traffic-enabled
  - id: metadata/permission/activation::wake-lock-permission
  - id: micro-behaviors/os/privilege/manifest::read-external-storage
  - id: metadata/permission/storage::android-write-external-storage-permission-reference
  - id: metadata/permission/runtime::post-notifications
  needs: 3

- id: staged-loader-manifest-control-surface
  desc: Messaging, permissions and short class names
  crit: suspicious
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/source-layout::loader-manifest-control-yara
  - id: metadata/binary/symbols/class::obfuscated-gc-namespace-burst

