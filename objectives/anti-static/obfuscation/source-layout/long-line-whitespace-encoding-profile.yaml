defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: long-line-whitespace-encoding-profile
    desc: Long line, whitespace and encoding clues
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/line::long-inline-whitespace-run
      - id: metadata/file/line::last-line-over-1000
    any:
      - id: micro-behaviors/data/decode/command::base64-api-or-command
      - id: micro-behaviors/data/encode/base64/
      - id: micro-behaviors/data/encode/command-output/base64/
      - id: micro-behaviors/data/encode/file/base64/
      - id: micro-behaviors/data/encode/output/base64/
      - id: micro-behaviors/data/encode/serialized-json/
      - id: micro-behaviors/data/decode/hex/
      - id: micro-behaviors/data/decode/hex-pair/
      - id: micro-behaviors/data/decode/hex-vector/
      - id: micro-behaviors/communications/ip/parse::bracket-hex-octets-dot-join
      - id: micro-behaviors/communications/ip/parse::offset-hex-port-decode
      - id: micro-behaviors/data/encode/hex/
      - id: metadata/lang/encoding/hex::hex-encoded-powershell
      - id: metadata/lang/encoding/hex::hex-encoded-http
      - id: micro-behaviors/process/interpreter/eval
      - id: metadata/lang/source/naming/population::single-character-identifier-ratio-over-30
