defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
composite_rules:
  - id: php-string-identifier-entropy-profile
    desc: PHP string entropy with compact code shape
    conf: 0.85
    all:
      - id: metadata/lang/source/literal/string/population::high-average-string-entropy
    any:
      - id: metadata/lang/source/naming/population::php-high-entropy-short-identifiers
      - id: metadata/lang/source/function::php-many-short-function-lines
