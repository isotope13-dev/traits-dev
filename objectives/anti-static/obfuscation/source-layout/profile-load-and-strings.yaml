---
defaults:
  platforms:
  - windows
  - unix
  for:
  - lua
composite_rules:
- id: lua-one-line-load-symbol
  desc: Large one-line Lua with load symbol
  crit: suspicious
  conf: 0.95
  size_min: 50000
  all:
  - id: metadata/file/line::file-one-liner
  - id: micro-behaviors/metaprogramming/generation/function::lua-dynamic-load
