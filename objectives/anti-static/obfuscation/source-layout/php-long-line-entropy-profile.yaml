defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
composite_rules:
  - id: php-long-line-entropy-profile
    desc: PHP long-line or entropy indicators
    conf: 0.95
    needs: 2
    any:
      - id: metadata/file/text-distribution::high-average-string-entropy
      - id: metadata/file/line::php-line-at-least-5000
      - id: metadata/file/naming::php-high-entropy-short-identifiers
