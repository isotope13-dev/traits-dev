defaults:
  platforms: [unix, windows]
traits:
  - id: java-archive-lookalike-class-tree
    desc: Deep I/l/i-only Java archive class path
    crit: suspicious
    conf: 0.99
    for: [jar, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '^([Iil]{10,12}/){6,}[Iil]{10,12}\.class$'

# Caesium Obfuscation Detection
composite_rules:
  - id: caesium-obfuscation
    desc: "Caesium Java obfuscation detected"
    crit: hostile
    conf: 1.0
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/bytecode::caesium
      - id: objectives/anti-static/obfuscation/obfuscator/bytecode::caesium-component
