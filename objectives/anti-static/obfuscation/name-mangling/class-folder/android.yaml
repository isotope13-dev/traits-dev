defaults:
  platforms: [android]
  for: [dex]
  attack: T1027
  mbc: B0032

traits:
  # Ordinary Java/Android namespaces have short conventional roots such as
  # com/google/android. Requiring four consecutive long lowercase components
  # and many distinct class descriptors isolates deliberately opaque package
  # trees rather than a single unusually descriptive package name.
  - id: android-deep-long-package-namespace
    desc: DEX repeats deep long lowercase namespace
    crit: suspicious
    conf: 0.99
    count_min: 100
    if:
      type: text
      regex: 'L([a-z]{10,22}/){4}[A-Za-z0-9_$]{1,40};'

  # Some Android obfuscators retain a conventional two-component package
  # root, then replace the next two components with very long random labels.
  # Requiring this shape in many descriptors avoids treating one verbose but
  # legitimate package name as name mangling.
  - id: android-wide-random-package-namespace
    desc: Repeated long randomized DEX package components
    crit: suspicious
    conf: 0.99
    count_min: 100
    if:
      type: text
      regex: 'L[a-z]{2,12}/[a-z]{2,12}/([a-z][a-z0-9]{34,69}/){2}'
