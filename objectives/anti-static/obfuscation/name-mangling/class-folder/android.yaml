defaults:
  platforms: [android]
  for: [dex]
  attack: T1027
  mbc: B0032

traits:
  # Ordinary Java/Android namespaces have short conventional roots such as
  # com/google/android. Requiring four consecutive long lowercase components
  # and many distinct class descriptors isolates deliberately opaque package
  # trees rather than a single unusually descriptive package name.
  - id: android-deep-long-package-namespace
    desc: DEX repeats deep long lowercase namespace
    crit: suspicious
    conf: 0.99
    count_min: 100
    if:
      type: text
      regex: 'L([a-z]{10,22}/){4}[A-Za-z0-9_$]{1,40};'
