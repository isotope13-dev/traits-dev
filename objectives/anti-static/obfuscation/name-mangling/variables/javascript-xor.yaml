defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # The required evidence is opaque naming with XOR arithmetic. It establishes
  # neither string decoding nor an evaluator or payload activation.
  - id: javascript-hex-variables-with-xor
    desc: Hexadecimal variable names with repeated XOR expressions
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: micro-behaviors/data/arithmetic::repeated-hex-left-xor-expressions
      - id: metadata/lang/source/declaration::hex-variable-names
