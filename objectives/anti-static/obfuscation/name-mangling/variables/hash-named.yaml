# Identifiers renamed to an underscore plus twelve hex digits — a truncated
# hash of the original name (`_56af3332aec8`, `_3701ded6d95a`). The renamer
# behind gocommunity.io/orderedbtree, gogets.dev/btreex and the gocommunity-io
# dockerd Terraform provider rewrote every local, parameter and helper in the
# payload files this way while leaving exported names readable, so the
# package still looks like a normal library from its API. No hand-written or
# generated code in a 5.4G Go module corpus declares even one such name.
#
# The same names survive compilation: Go keeps every function name in the
# pclntab, so a release binary built from the renamed source carries
# `pkg._ad79680770be`-shaped symbols even when stripped.
defaults:
  attack: T1027
  platforms: [linux, macos, windows]

traits:
  - id: hash-named-local-assignments
    desc: Many locals named as 12-hex-digit hashes
    crit: suspicious
    conf: 0.9
    for: [go, python, javascript, typescript, rust]
    count_min: 5
    if:
      type: text
      regex: '\b_[0-9a-f]{12}\b\s*:?='

  - id: go-binary-hash-named-functions
    desc: Go functions named as 12-hex-digit hashes
    crit: suspicious
    conf: 0.88
    for: [elf, macho, pe]
    count_min: 4
    # raw, not text: the ELF text view does not surface pclntab names for a
    # large Go binary (rizin hits its output cap), but the bytes are there.
    if:
      type: raw
      regex: '[a-z0-9]\._[0-9a-f]{12}\b'

  # A hash-renamed generic helper instantiated over a cipher. Go spells each
  # instantiation's type shape into the pclntab name, so the dockerd loader's
  # must-style helper appears as
  # `provider._3701ded6d95a[go.shape.interface { NonceSize() int; Open(...`:
  # the renamed code handles an AEAD or block cipher, i.e. it decrypts.
  - id: go-binary-hash-named-cipher-helper
    desc: Hash-renamed Go helper typed over a cipher
    crit: notable
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '\._[0-9a-f]{12}\[go\.shape\.interface \{ (BlockSize|NonceSize)\(\) int; (Decrypt|Open)\('
