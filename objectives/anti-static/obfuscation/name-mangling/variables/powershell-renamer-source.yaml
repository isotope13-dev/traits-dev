# Source of a PowerShell identifier renamer: regexes capture `$name` and
# `function name` and a match evaluator substitutes freshly generated random
# names. Code formatters do not rename identifiers; this exists to make
# generated PowerShell look different on every build. Dual-use on its own.
defaults:
  platforms: [windows]
  for: [vbs, csharp]
  attack: T1027
  mbc: B0032

traits:
  - id: powershell-variable-capture-regex
    desc: Regex capturing PowerShell variable names
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Regex\(\s*@?"\\\$\(\\w\+\)"\s*\)'
  - id: powershell-function-capture-regex
    desc: Regex capturing PowerShell function names
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)Regex\(\s*@?"function\\s\+\(\\w\+\)"\s*\)'
  - id: regex-evaluator-rewrites-variable-name
    desc: Regex evaluator returns a new $-variable name
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\.Replace\(\w+,\s*Function\(\w+\)[\s\S]{0,400}Return\s+"\$"\s*[&+]'

composite_rules:
  - id: powershell-identifier-randomizer-source
    desc: Rewrites PowerShell variable and function names
    crit: suspicious
    conf: 0.9
    all:
      - id: powershell-variable-capture-regex
      - id: regex-evaluator-rewrites-variable-name
    any:
      - id: powershell-function-capture-regex
