# Functions whose names read as generator output rather than words
# (`kqWzTfbNvhX`, `CdlVTZsBzDV`): the renamer that produced the hash-named
# identifiers in hash-named.yaml is one choice of alphabet, and the next
# build of the same tool can just as easily emit letters. Scored with
# `is: random_like` (English bigram plausibility), which declines to judge
# names under six letters, so hex hashes like `_56af3332aec8` are left to
# hash-named.yaml and this rule covers the alphabetic form.
#
# Measured over declared function names: 69 of 2.18M in a 5.4G Go module
# corpus score random (`xgetbv`, `YAMLEqf`, `newGFp12`), never more than two
# in one file; none of 86K declarations in node_modules and none in the
# Python stdlib. Rust and C are left out: assembler and SIMD crates declare instruction mnemonics
# (`vpsllq`, `vpclmulqdq`) by the hundred. A Go binary's pclntab is not a
# usable surface either — every Go binary carries random-looking stdlib names
# (`internal/cpu.xgetbv`, `fiat.p224CmovznzU64`), and the scorer judges the
# longest token in a match, so a candidate regex cannot confine it to
# non-stdlib packages.
#
# Go and Python use declared function symbols with `is: random_like`.
# This requires a cleave build with the function-symbol `is:` fix (2026-09-24).
# In particular, Python snippets printed with line-number gutters in diagnostic
# snapshots are text, not function declarations, and must not count here.
# JavaScript retains its text candidate matcher below.
defaults:
  attack: T1027
  platforms: [linux, macos, windows]

traits:
  - id: go-random-named-functions
    desc: Go function names resemble random identifiers
    crit: suspicious
    conf: 0.88
    for: [go]
    count_min: 3
    if:
      type: symbol
      kind: function
      regex: '^[A-Za-z_]\w{5,}$'
      is: random_like
    not:
      # Hardware part numbers, model designations, and uppercase acronyms
      # (e.g. W25Q16JVIQ, S25FL064L, MX25L3233F) contain no lowercase letters.
      - regex: '^[A-Z0-9_]+$'
      # Assembly proxy functions generated by assembler builders (e.g. __asm_proxy_CMPXCHGQ__).
      - regex: '^__asm_proxy_'
      # Type and operand predicate functions in Go convention (e.g. isXMMkz, isM512kz).
      - regex: '^is[A-Z0-9]'
      # Methods of a Go x86 instruction encoder are named for the Intel mnemonic
      # (Pmaddubsw, Punpcklqdq, Vcvtdq2ps), with a V/Y prefix for VEX/YMM forms
      # and Imm/MemDisp/MemIdx suffixes for operand shapes; vexRRR and sseRRI
      # are its operand-encoding helpers.
      - regex: '^[VY]?P[a-z]{3,10}(Imm|RipPlaceholder|Mem(Disp|Idx))?$'
      - regex: '^[VY]?(Cvt|Vcvt|Movdqu|Movs|Movmsk)\w*$'
      - regex: '^(vex|sse)[A-Z0-9]\w*$'
      # Information-decomposition helpers encode mutual information notation
      # as MiXvY, MiXvYZ, and MiXvYgZ (MI of X versus Y, optionally conditioned
      # on Z). The formula tokens score as random-like when concatenated, but
      # are descriptive mathematical names. Keep the exclusion bounded to
      # this notation so unrelated mixed-case renamer output still matches.
      - regex: '^MiXv[XYZ](?:g?[XYZ])?$'
      # Codec implementations use readable quantizer helper names such as
      # vqMulF/vqAddD. The two-letter `vq` prefix means VBR quantization; the
      # operation and numeric type suffix identify the helper, not a renamer.
      - regex: '^vq(?:Mul|Sub|Add)[FD]$'
      - regex: '^vq(?:HackQuantize|Log10f)$'
      # Pure-Go NEON reference kernels name wrappers after the intrinsic they
      # reproduce (`vmullS32Ref`, `vqrdmulhqLaneRef`). These established
      # operation mnemonics plus `Ref` are algorithmic names, not camouflage.
      - regex: '^v(?:qrdmulhqLane|qsubq|mull|rshlq|movn|shrn|combine|get(?:Low|High)|rev64q|maxq|minq)[A-Z0-9]\w*Ref$'
      # Numbered Go constructors use a readable, title-case type word before
      # an ordinal (for example newCfg1/newConfig2). Their abbreviation can
      # score as random-like even though it is a conventional name shape.
      - regex: '^new[A-Z][a-z]{1,7}[0-9]+$'
      # Cloud SDK service constructors conventionally combine a service code
      # with an API version (for example NewVPCV1 or NewECSV1_1). The compact
      # service acronym and version are meaningful API identifiers, not mangled
      # function names.
      - regex: '^New[A-Za-z0-9]+V[0-9]+(?:_[0-9]+)?$'
      # Conversion helpers commonly spell both source and target formats as
      # acronyms around "To" (for example SRGBToHSV and HSVToSRGB). The
      # acronym boundaries make these meaningful names despite weak bigram
      # plausibility.
      - regex: '^(?:[A-Z]{2,}|[A-Z][a-z0-9]+)To(?:[A-Z]{2,}|[A-Z][a-z0-9]+)$'
      # Date/time SQL formatter helpers compact the conventional Go/SQL
      # format fields into names such as toYYYYMMDDHHMMSS and toHH. The
      # repeated format tokens can score as random-like, but are descriptive.
      - regex: '^to(?:YYYY(?:MM(?:DD(?:HHMMSS)?)?)?|HH|MM|SS)$'
      # cgo accessors for the Opus SILK reference tables use the table or
      # codec operation in their name (`cSilkPitchLagICDF`).
      - regex: '^cSilk(?:Gain|DeltaGain|Pitch|LTP|NLSF|Resampler|Shell|Sign|Stereo|Transition|CBLags)[A-Z0-9]\w*$'
      # Bytecode-interpreter opcode handlers are named op<Mnemonic> after the
      # instruction they execute (Algorand TEAL's opGtxnsas, opBz2B, opSqrt).
      - regex: '^op[A-Z][A-Za-z0-9]*$'
      # Netlib LAPACK/BLAS numerical routines follow Fortran 77 6-character
      # naming conventions: a precision prefix (S/D/C/Z/I), a 2-letter matrix
      # or group code, and an operation mnemonic (e.g. Dgerqf, Dgelqf, Dtgsja).
      - regex: '(?i)^[sdczi](bb|bd|cg|di|ds|gb|ge|gg|gt|hb|he|hg|hp|hs|la|op|or|pb|po|pp|pt|sb|sp|st|sy|tb|tg|tp|tr|tz|un|up|zc)[a-z0-9]{2,4}$'
    unless:
      - id: well-known/tool/development/toolchain/go-toolchain/
      - id: metadata/lang/generated::generated-code-do-not-edit-text
      - id: metadata/build/artifact::go-generated-source-header
      - id: metadata/lang/generated::ccgo-libc-generated-banner
      # Itanium and guest symbols in a wasm2go translation are compiler
      # output. The translator does not emit a do-not-edit banner.
      - id: metadata/build/artifact::wasm2go-generated-source
      # ygot-generated schema methods are mechanically derived from YANG
      # paths (for example NewVni), which the random-name scorer can rate as
      # unlikely even though the names are semantic generated identifiers.
      - id: metadata/build/artifact::go-ygot-generated-yang-bindings

  # The `not:` leg keeps unittest/pytest discovery names out: methods a test
  # runner invokes MUST start with `test`, so a `test_xxxxxx1` placeholder
  # run (pydevd's simple_test.py) is the framework's naming convention, not
  # renamer output. An obfuscator cannot use the prefix without also
  # mimicking the unittest naming convention. (A `(?!test)`
  # lookahead would say the same, but the linear-time engine does not
  # compile lookaround.)
  - id: python-random-named-functions
    desc: Python function names resemble random names
    crit: suspicious
    conf: 0.85
    for: [python]
    count_min: 4
    if:
      type: symbol
      kind: function
      regex: '^[A-Za-z_]\w{5,}$'
      is: random_like
    not:
      - regex: '^test'
      # Resource ID accessors use domain acronyms (bgpvpn_id, vxlan_id).
      # Repeated getters/setters are not randomized names. Filter only these
      # declarations so unrelated obfuscated functions still count.
      - regex: '^[a-z]{2,12}_ids?$'
      # Date-format helpers and OHLCV (open/high/low/close/volume) parsers
      # contain compact domain notation, not randomized function names.
      # Filter the matched declaration, leaving other names in the file visible.
      - regex: '^y{2,4}m{2}d{2}$'
      - regex: '^(parse|build)(_[a-z]+)*_ohlcv[sc]?$'
      # Colour-space and codec conversions (OpenCV G-API's RGB2HSV,
      # RGB2YUV422): two short acronyms joined by "2" are an API convention.
      # Bounded to that exact shape so O0O0-style renamer names still count.
      - regex: '^[A-Z]{2,5}[0-9]{0,3}2[A-Z]{2,5}[0-9]{0,3}$'
      # The same conversion names in lowercase (skimage rgb2lab, ycbcr2rgb).
      # Letters only on each side of the 2, so a renamer's mixed digits still count.
      - regex: '^[a-z]{2,5}[0-9]{0,3}2[a-z]{2,5}[0-9]{0,3}$'
      # Standardised floating-point dtype names (OCP microscaling float8
      # E4M3/E5M2 with FN/FNUZ suffixes, as shipped by torch, numpy and
      # ml_dtypes): letter-digit mixes the bigram scorer reads as random.
      # Bounded to the float<w>_eYmX shape so renamer names still count.
      - regex: '^float[0-9]+_e[0-9]m[0-9]\w*$'
      # Generated FFI bindings embed the Itanium C++ mangled name they wrap
      # (Numbast's _lower__ZN13__nv_bfloat16C1Ev, _ZL10__hadd2_rn...):
      # the _Z[N|L]<n> segment is an ABI encoding, not renamer output.
      - regex: '^\w*_Z[NL0-9]'
      # JSII type-checking stubs use hash-suffixed names
      - regex: '^_typecheckingstub__'
      # Generated dataclass helpers use hash-suffixed names
      - regex: '^_process_dataclass__'
      # Python scientific APIs commonly name coordinate and colour-space
      # conversions as Source_to_Target (e.g. XYZ_to_Izazbz and
      # Izazbz_to_XYZ). The paired, meaningful type names are a conversion
      # convention, even when their mixed casing scores as random-like.
      - regex: '^[A-Z][A-Za-z]+_to_[A-Z][A-Za-z]+$'
      # One compact domain abbreviation followed by two or more word segments
      # (astropy's w0wzcdm_inv_efunc_norel): the scorer reads the acronym as
      # random, but renamers do not append readable snake_case words.
      - regex: '^[a-z][a-z0-9]{1,11}(_[a-z]{3,}){2,}$'
      # GMT/NCL colormap accessors are named after the palette catalog; for
      # example GMT_wysiwyg is a documented palette name, not a renamed symbol.
      - regex: '^GMT_[a-z][a-z0-9_]*$'
    unless:
      - id: metadata/package/testing/presence/path::test-fixture-directory-path
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/lang/compiler/source::llvm-tablegen-source-marker
      - id: well-known/lib/cloud/cloud-sdk::tencentcloud-python-sdk
      - id: well-known/lib/data/qcodes::qcodes-package-context

  - id: js-random-named-functions
    desc: JS functions have machine-generated names
    crit: suspicious
    conf: 0.85
    for: [javascript, typescript]
    count_min: 4
    if:
      type: text
      regex: '\bfunction [A-Za-z_$][\w$]{5,}\b'
      is: random_like
    not:
      # Emscripten encodes return/argument types in invoke_<signature>:
      # i=int, j=int64, f=float, d=double, v=void, p=pointer.
      # Repeated i parameters are ABI signatures, not random identifiers.
      # Filter individual names so unrelated obfuscated functions still count.
      - regex: '^function invoke_[vijfdp][ijfdp]*$'
    unless:
      - id: metadata/package/testing/presence/path::test-fixture-directory-path
      - id: metadata/package/testing/presence/harness::test-directory
      # A Markdown document quoting source (a Delphi FX template whose first
      # line is `//`) can be sniffed as script; its PascalCase method names
      # are prose.
      - id: metadata/file/extension/identity::markdown-file-basename
      # Emscripten MODULARIZE glue names its loader functions the way the
      # toolchain generates them (sharp's wasm32 loader, ffmpeg.wasm,
      # sql.js). Machine-generated by the compiler, not obfuscated.
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
      # Parcel scope-hoisting mangles top-level identifiers with asset hash prefixes ($<hash>$export$<hash> or $<hash>$var$<name>).
      # These are compiler/bundler artifacts, not malware obfuscation.
      - type: text
        regex: '\bfunction\s+\$[0-9a-f]{8,}\$(export|var)\$'
