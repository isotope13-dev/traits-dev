# Element ids are page-global names (each becomes a window property). Doorway
# injections drop an empty container under a 120+ character random id so the
# concealed script beside it has a target no stylesheet or analyst search can
# anticipate; generated ids from site builders are numeric or short hashes.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
  mbc: B0032

traits:
  - id: empty-div-long-random-id
    desc: Empty div with 120+ char random id
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '<div id=["''][A-Za-z0-9]{120,400}["'']>\s*</div>'

composite_rules:
  # The container and the coercion-hidden script that fills it sit together:
  # both the injection target and the code are concealed.
  - id: random-id-container-with-coercion-script
    desc: Random-id container fed by coercion-hidden script
    crit: hostile
    conf: 0.93
    near_bytes: 512
    all:
      - id: empty-div-long-random-id
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::coercion-string-variable-binding
