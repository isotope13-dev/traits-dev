# Standalone VBScript droppers rename every identifier.
#
# The VBA siblings under obfuscation/document/renaming read
# `office.vba.identifier_entropy` and friends, which cleave's office analyzer
# computes over a document's macro modules. A loose `.vbs` on disk has no
# office analysis and therefore no such metric, so the whole identifier-shape
# signal stopped at the document boundary -- and the `.vbs` half of the corpus
# is where these droppers actually live now that Office blocks macros.
#
# Score identifier shape from the text instead. abuse.ch 3fa8d9107cd1 is six
# lines of VBScript in which every name is a fifty-character random run
# (`mhqsncovhKrTtyRWaKWsLHyMUsiCXWrCYSERHNBAHqnkjOzlFP`); the payload is
# `ExecuteGlobal` on a paste.ee response, and the names exist so that no two
# samples in the campaign share a string.
#
#
# Scored with `is: random_like` rather than a length threshold, for the same
# reason the XLM defined-name rules use it: the bigram model asks whether a
# person could have chosen the word, which is the question, and a length
# threshold only approximates it.
#
# The approximation failed in both directions. Twenty-six characters convicted
# github-linguist's Classic ASP unit-test sample, whose methods are
# `ASPUnitRunnerRunAddsCurrentPage` and `ASPUnitUIRendererMockTheme` --
# CamelCase marks word boundaries with case rather than punctuation, so a
# readable name has no separator to find. Raising the bar to thirty-four
# cleared those and then missed `AzBzimxaqgzJYbMaxxlzBaw`, which is twenty-three
# characters and plainly generated.
#
# The model gets all six right. The regex now only nominates candidates long
# enough to judge -- the validator declines anything under six letters -- and
# `is:` decides. Four of them rules out the one odd name a real script might
# carry, and keeps a single consonant-dense foreign word from convicting.
defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1027
  mbc: B0032

traits:
  - id: vbs-generated-identifiers
    desc: VBScript names look machine-generated
    crit: suspicious
    conf: 0.92
    count_min: 4
    if:
      type: text
      regex: '\b[A-Za-z]{10,}\b'
      is: random_like
    unless:
      # A compiler's own test corpus is deliberately malformed: dotnet-roslyn's
      # src/Compilers/VisualBasic/Test/ exists to feed the VB parser inputs that
      # look exactly like this (TooLongNameTests.vb tests over-long identifiers).
      - id: metadata/package/testing/