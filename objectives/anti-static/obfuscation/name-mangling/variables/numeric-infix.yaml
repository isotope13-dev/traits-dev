defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  # A renamer mangles the whole identifier set, so real numeric-infix output
  # arrives in clusters. A single letters-digits-letters run is almost always
  # coincidence: an unlisted standards token, a random-looking test constant,
  # or — because the text corpus also carries the byte scanner's XOR-decoded
  # runs — a token that only exists after a decode attempt over ordinary
  # source (Composer's `microtime`/`$attempts` region decoded to
  # `bfa24426sffw`). Requiring two keeps the cluster and drops the singletons.
  - id: numeric-infix
    desc: Numeric infix obfuscation (e.g. com0715press)
    crit: notable
    conf: 0.8
    count_min: 2
    if:
      type: text
      regex: \b[a-z]{3,}[0-9]{4,}[a-z]{3,}\b
    not:
      # An embedded four-digit calendar year (act2024xys, promo2019page) dates a
      # campaign/API route; real numeric-infix mangling uses arbitrary digit runs
      # (com0715press), so a year-shaped run is the benign case.
      - regex: \b[a-z]{3,}(19|20)\d{2}[a-z]{3,}\b
      - regex: \b(perl|python|ruby|node|gcc|glib|php|lua)\d+
      - regex: \d+(delta|changelog|changes|compat)\b
      - regex: \brfc\d{4}[a-z]+\b
      - regex: \biso\d{4,}[a-z]+\b
      # Same class as rfc/iso/win below: `ieee80211com` and `ieee80211vap` are
      # the 802.11 stack's own type names, not renamer output.
      - regex: \bieee\d{4,}[a-z]+\b
      - regex: \bcoco\d{4}labels(-[a-z]+)?\b
      - regex: \bwin\d{4,}[a-z]+\b
      - regex: \b[a-z]+\d{3,5}(dsa|rsa|dh|dhe|ecdh|ecdhe)\b
      - regex: \btest[a-z]*\d{4,}(pub|priv|key)\b
      # Printer/driver model tokens glued into helper names (hl3170cdw).
      - regex: (?i)\b(brother|cups?wrapper|lpr|ppd)[a-z0-9_-]*\d{3,}[a-z]+\b
      - regex: (?i)\b[a-z]*(hl|dcp|mfc)\d{3,}[a-z]+\b
    unless:
      - id: metadata/file/string/identity::pkgbuild-basename
      # Manual-page prose is documentation, not mangled identifiers; cleave
      # guesses a language for roff, so pages arrive typed as source.
      - id: metadata/package/documentation::unix-manpage

      # Generated protocol/XDR sources commonly use numeric type names such as
      # Bls12381G1Mul and Int256AddSub.  The generated-file banner is strong
      # benign context; these identifiers are schema names, not mangled code.
      - type: text
        regex: '(?i)automatically generated file|do not edit.*(?:overwritten|generated)'
      # Test fixtures use alphanumeric placeholder identifiers (e.g. abcd1234efgh)
      # that look like numeric-infix obfuscation but are not.
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/harness/
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/library/structure/
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
      - type: path
        basename: true
        regex: '^[A-Za-z0-9_.-]+[-.][a-f0-9]{8,}\.js$'
  # The other renamer shape: a one-letter kind marker followed by a long
  # random digit run (`f1973269050108415047`, `v5791458402580256067`,
  # `p1948396834343565308` for function / variable / parameter). The infix
  # sibling above needs letters on both sides and never sees these.
  #
  # The digit run has to be long -- twelve or more -- so ordinary
  # `x1`/`v2`/`p10` naming and version tokens stay out, and the cluster
  # threshold is high because a renamer rewrites every name in the program,
  # while a lone letter-then-digits run is a serial number or an exponent.
  - id: long-numeric-suffix-identifiers
    desc: Many one-letter numeric identifiers
    crit: suspicious
    conf: 0.9
    for: [shell, python, javascript, ruby, php, lua, perl]
    count_min: 8
    if:
      # Parse identifiers rather than scanning arbitrary text. This excludes
      # URL path segments and comments (for example a repeated Slack message
      # id such as `p1741565387326829`) while retaining the actual renamer
      # output this trait describes.
      type: symbol
      kind: identifier
      regex: '^[a-z][0-9]{12,24}$'
    unless:
      - id: metadata/package/documentation::unix-manpage
      - id: metadata/package/testing/presence/harness/
  # Batch, PowerShell, AppleScript, and VBScript identifiers are
  # case-insensitive. Match the same renamer shape regardless of the marker's
  # case while keeping these languages separate from case-sensitive scripts.
  - id: long-numeric-suffix-identifiers-command-scripts
    desc: Many numeric identifiers in command scripts
    crit: suspicious
    conf: 0.9
    for: [batch, powershell, applescript, vbs]
    count_min: 8
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^[a-z][0-9]{12,24}$'
    unless:
      - id: metadata/package/documentation::unix-manpage
      - id: metadata/package/testing/presence/harness/
