defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
traits:
- id: long-numeric-suffix-identifiers
  desc: Many one-letter numeric identifiers
  crit: suspicious
  conf: 0.9
  for:
  - shell
  - python
  - javascript
  - ruby
  - php
  - lua
  - perl
  count_min: 8
  if:
    type: symbol
    kind: identifier
    regex: ^[a-z][0-9]{12,24}$
  unless:
  - id: metadata/package/documentation/manpage::unix-manpage
  - id: metadata/path/directory::test-directory-component
- id: long-numeric-suffix-identifiers-command-scripts
  desc: Many numeric identifiers in command scripts
  crit: suspicious
  conf: 0.9
  for:
  - batch
  - powershell
  - applescript
  - vbs
  count_min: 8
  if:
    type: symbol
    kind: identifier
    regex: (?i)^[a-z][0-9]{12,24}$
  unless:
  - id: metadata/package/documentation/manpage::unix-manpage
  - id: metadata/path/directory::test-directory-component
