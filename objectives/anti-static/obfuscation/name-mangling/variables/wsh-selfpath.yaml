# Required evidence describes naming concealment and a self-path reference;
# it supplies no file staging or activation. The caller retains the same leg.
defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
- id: selfpath-random-function-names
  desc: Self-path beside randomized function names
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
  - id: objectives/anti-static/obfuscation/name-mangling/variables::js-random-named-functions

