defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
  - id: ol-lookalike-fragment-assignments
    desc: O/l-only names assigned short string fragments
    crit: suspicious
    conf: 0.95
    count_min: 5
    # Repeated visually confusable identifiers impede reading even when the
    # concealed content is benign, such as an email address on a public page.
    if:
      type: text
      regex: '\b[Ol]{4,16}\s*=\s*["''][^"''\r\n]{1,24}["'']'
