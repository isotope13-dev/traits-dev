# AutoIt obfuscation combining 32+ hex-character hash-length variable names,
# heavy horizontal tab padding between tokens, and a StringReplace junking
# helper function.
defaults:
  platforms: [windows]
  for: [text]
  size_max: 2000000
  attack: T1027

traits:
  - id: autoit-hash-named-variables
    desc: AutoIt variables use hash-length hex names
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      regex: '\$[0-9a-f]{32,}\b'

  - id: autoit-excessive-tab-padding
    desc: Heavy horizontal tab padding between tokens
    crit: notable
    conf: 0.85
    count_min: 5
    if:
      type: text
      regex: '\S\t{10,}\S'

composite_rules:
  - id: autoit-hash-vars-tab-junk-obfuscation
    desc: AutoIt obfuscates with hash variables, tab padding, and string stripper
    crit: suspicious
    conf: 0.93
    all:
      - id: autoit-hash-named-variables
      - id: autoit-excessive-tab-padding
      - id: micro-behaviors/process/interpreter/autoit::autoit-stringreplace-junk-helper
