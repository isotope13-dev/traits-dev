defaults:
  platforms: [windows, unix]
traits:
  # The homoglyph trick this family is named for spells identifiers out of the
  # Mathematical Alphanumeric Symbols block (U+1D400-U+1D7FF), where a "letter"
  # renders like ASCII but is a different codepoint.
  - id: math-alphanumeric-block-char
    desc: Mathematical Alphanumeric Symbols character
    crit: component
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '[\x{1D400}-\x{1D7FF}]'

  - id: mostly-non-ascii-source
    desc: Source text is mostly non-ASCII
    crit: component
    conf: 0.9
    for: [python, javascript, typescript]
    size_min: 256
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.85
  - id: dayjs-locale-text
    desc: dayjs locale data text
    crit: component
    conf: 1.0
    for: [python, javascript, typescript]
    if:
      type: text
      substr: dayjs_locale_
composite_rules:
  # The ratio alone only says "this file is mostly not ASCII", which is true of
  # any source written in another script: highlight.js's `1c.js` is a Cyrillic
  # keyword table for the 1C:Enterprise grammar and reads 0.86 -- both MiniMax
  # Code and the heroku CLI bundle it. Requiring a character from the block the
  # rule is named for keeps the homoglyph case and drops the language ones.
  - id: math-alphanum-identifiers
    desc: Mathematical Unicode indicator glyphs
    crit: suspicious
    conf: 0.9
    for: [python, javascript, typescript]
    all:
      - id: math-alphanumeric-block-char
      - id: mostly-non-ascii-source
    unless:
      # The `.pyz` zipapp carve-out that lived here is subsumed: a packed
      # zipapp is mostly non-ASCII bytes but carries no U+1D400 characters.
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/runtime::moment-locale
  - id: unicode-locale-content
    desc: Locale/translation Unicode context
    crit: component
    conf: 1.0
    any:
      - id: metadata/file/profile/locale::locale-basename
      - id: dayjs-locale-text
      - id: metadata/file/profile/locale::translation-module-basename
      - id: metadata/file/invisible-unicode::emoji-logger-icons-text
