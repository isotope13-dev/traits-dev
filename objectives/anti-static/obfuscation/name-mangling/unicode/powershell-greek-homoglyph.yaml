defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1027

traits:
  - id: powershell-greek-homoglyph-variable
    desc: PowerShell variables with Greek homoglyphs
    crit: suspicious
    conf: 0.96
    count_min: 3
    if:
      type: text
      exclude_comments: true
      regex: '\$[0-9A-Za-z]{2,}[\x{0370}-\x{03FF}][0-9A-Za-z\x{0370}-\x{03FF}]{2,}'
