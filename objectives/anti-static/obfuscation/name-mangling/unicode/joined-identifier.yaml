defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: ascii-identifier-zero-width-joiner
    desc: Zero-width joiner splits ASCII identifier
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      kind: identifier
      regex: '[0-9A-Za-z]{3}[\x{200C}\x{200D}][0-9A-Za-z]{3}'
