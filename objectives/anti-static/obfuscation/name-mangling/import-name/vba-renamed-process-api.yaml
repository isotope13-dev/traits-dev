# A VBA `Declare` that imports CreateProcess under an unrelated local name:
# `Declare PtrSafe Function nxdbel Lib "kernel32" Alias "CreateProcessA"`.
# Ordinary macros alias only to drop the A/W suffix (`Function CreateProcess
# ... Alias "CreateProcessA"`); renaming the process-creation API to a
# meaningless identifier hides it from every call site in the module.
defaults:
  for: [vbs, oledoc, ooxml]
  platforms: [windows]
  attack: T1027,T1106

traits:
  - id: vba-createprocess-renamed-declare
    desc: VBA imports CreateProcess under another name
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)Function\s+\w{1,40}\s+Lib\s+"kernel32(\.dll)?"\s+Alias\s+"CreateProcess'
    not:
      # Local names that still say what they import (CreateProcess,
      # apiCreateProcess, Win32_CreateProcessA) are not concealment.
      - regex: '(?i)Function\s+\w{0,20}CreateProc'
