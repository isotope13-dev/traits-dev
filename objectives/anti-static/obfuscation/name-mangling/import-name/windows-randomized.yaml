defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
traits:
  # Forty plain-alpha import names is any DLL linking a C library by its API
  # (GDAL, zlib); a leg of the copied-certificate carrier only.
  - id: opaque-alpha-import-cluster
    desc: Imports cluster of opaque mixed-case names
    crit: component
    conf: 0.96
    count_min: 40
    if:
      type: import
      regex: '^[A-Za-z]{6,28}$'
    not:
      - regex: '^(Get|Set|Create|Open|Close|Read|Write|Load|Free|Alloc|Local|Global|Reg|Crypt|Win|Nt|Rtl|Dll|Co|Query|Enum|Find|Copy|Move|Delete|Remove|Add|Is|Has|Init|Start|Stop|Update|Process|Thread|Socket|Http|Internet|Message|Format|Compare|Convert|Wait|Enter|Leave|Acquire|Release)'
      - regex: '^[a-z]+$'
      - regex: '^[A-Z]+$'
