# The renamed CreateProcess import (see vba-renamed-process-api.yaml) inside
# an open-event macro that writes a binary file: the alias hides the launch
# of the dropped file from every call site.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1106

composite_rules:
  - id: vba-renamed-createprocess-open-drop
    desc: Open-event dropper hides CreateProcess name
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/import-name::vba-createprocess-renamed-declare
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: micro-behaviors/fs/write/file/binary::vb6-binary-file-write-source
