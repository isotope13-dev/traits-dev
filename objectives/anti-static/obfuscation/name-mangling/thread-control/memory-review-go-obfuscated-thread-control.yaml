defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-obfuscated-thread-control
    attack: T1027
    desc: Obfuscated Go with suspend and resume APIs
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names
