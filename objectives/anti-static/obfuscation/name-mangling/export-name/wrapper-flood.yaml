defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The two counts describe the same binary, not necessarily the same names;
  # neither establishes that a target was invoked or that names are random.
  - id: alphanumeric-exports-shared-call
    desc: Alphanumeric names and shared export calls
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/symbols/exports::many-exports-share-early-direct-call
      - id: metadata/binary/symbols/export-name-pattern::many-long-alphanumeric-exports
