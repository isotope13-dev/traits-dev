defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: hostile
composite_rules:
  - id: unsigned-importless-digit-exports-overlay
    desc: Unsigned importless PE with digit exports
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::digit-infixed-export-cluster
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/overlay::long-lower-alphanumeric-run
    unless:
      - id: metadata/installer/product/
    crit: suspicious
