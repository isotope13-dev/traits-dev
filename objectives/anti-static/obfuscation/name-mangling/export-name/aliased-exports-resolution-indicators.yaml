defaults:
  platforms: [linux, macos, windows]
composite_rules:
  - id: aliased-exports-resolution-indicators
    desc: Aliased exports with resolution indicators
    crit: suspicious
    conf: 0.92
    for: [pe]
    all:
      - id: metadata/binary/symbols/alias::low-volume-aliased-exports
      - id: micro-behaviors/dylib/lookup::get-proc-address
    any:
      - id: metadata/binary/layout/entropy::high-entropy-data
      - id: metadata/binary/section/ratio::data-section-1p5x-code
      - id: micro-behaviors/data/embedded/payload/archive::zip-magic
      - id: objectives/anti-analysis/debugger-detect/check::anti-debug-api-pair
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
    unless:
      - id: metadata/binary/symbols/count::many-imports-100
      - id: metadata/binary/code/complexity::many-functions-5000
