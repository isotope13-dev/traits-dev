defaults:
  platforms:
    - windows
composite_rules:
  - id: opaque-export-virtual-memory-apis
    desc: Opaque export with memory and dynamic-resolution APIs
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::single-opaque-mixed-case-export
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    for:
      - pe
      - dll
    size_min: 32768
    size_max: 1048576
