defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
traits:
  # Opaque mangling uses short CamelCase humps (AbCdEf / DelThreat). Readable
  # dictionary compounds (LangDialog, BlockShutdown) have longer lowercase runs
  # and are self-describing API names, not anti-static rename artifacts.
  - id: disassembler-style-export-flood
    desc: Floods exports with disassembler-style names
    crit: suspicious
    conf: 0.98
    count_min: 100
    if:
      type: text
      # MinGW emits the exported C++ names contiguously in .edata.
      regex: '_Z10sub_[0-9a-f]{6}v'
      section: .edata
composite_rules:
  - id: single-randomized-dll-export
    desc: Single randomized DLL export
    crit: suspicious
    conf: 0.86
    all:
      - id: metadata/binary/symbols/exports::single-short-lowercase-export
      - id: metadata/binary/symbols/count::minimal-exports
    any:
      - id: metadata/binary/debug::pdb-lowercase-basename-8-to-16
      - id: metadata/binary/debug::pdb-webroot-loader-project
      - id: metadata/binary/header/malformed::pe-entry-in-header
    unless:
      - id: metadata/binary/symbols/exports::no-exports
      - id: metadata/signed/platform/
  - id: single-opaque-mixed-case-export
    desc: Single mixed-case opaque DLL export
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/symbols/export-name-pattern::short-mixed-case-export-name
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/binary/symbols/count::minimal-exports
    # CamelCase alone does not make a public API opaque. Require independent
    # evidence that the symbol belongs to a generated loader stub.
    any:
      - id: metadata/binary/debug::pdb-lowercase-basename-8-to-16
      - id: metadata/binary/debug::pdb-webroot-loader-project
      - id: metadata/binary/header/malformed::pe-entry-in-header
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/app/system/reactos::system-component
      - id: metadata/signed/platform/
      - id: metadata/binary/symbols/exports::com-export-pair
      - id: metadata/binary/symbols/exports::standard-com-server-exports
      - id: metadata/binary/symbols/exports::total-commander-packer-plugin
      - id: well-known/app/system/iobit::iobit-signed-component-context

  - id: known-export-cluster-libraries
    desc: Known library producing many snake-case exports
    crit: baseline
    conf: 0.95
    any:
      - id: micro-behaviors/crypto/asymmetric/curve25519::libsodium-library
      - id: well-known/lib/runtime/native-platform/slint::slint-library
      - id: metadata/binary/symbols/fake-windows::basename-libvlc-dll
      - id: well-known/lib/runtime/scripted/electron::nodejs-webstorage-marker
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
      - id: well-known/lib/data/duckdb::duckdb-library

  - id: sparse-packed-random-export-dll
    desc: Packed DLL exposes randomized API surface
    crit: hostile
    conf: 0.98
    attack: T1027,T1620
    all:
      - id: metadata/binary/symbols/export-name-pattern::fifty-letters-only-export-names
      - id: metadata/binary/symbols/count::high-export-count-marker
      - id: metadata/binary/symbols/count::pe-sparse-import-table
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: well-known/app/
