defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
traits:
  # Opaque mangling uses short CamelCase humps (AbCdEf / DelThreat). Readable
  # dictionary compounds (LangDialog, BlockShutdown) have longer lowercase runs
  # and are self-describing API names, not anti-static rename artifacts.
  - id: mixed-case-opaque-export-name
    desc: Mixed-case opaque export name
    crit: component
    conf: 0.9
    if:
      type: export
      regex: '^[A-Z]([a-z]{1,2}[A-Z]|[A-Z]{1,3}[a-z])[A-Za-z]{2,10}$'
    not:
      - regex: '^(Dll|Get|Set|Is|Has|Create|Init|Open|Close|Read|Write)'
  - id: disassembler-style-export-flood
    desc: Floods exports with disassembler-style names
    crit: suspicious
    conf: 0.98
    count_min: 100
    if:
      type: text
      # MinGW emits the exported C++ names contiguously in .edata.
      regex: '_Z10sub_[0-9a-f]{6}v'
      section: .edata
composite_rules:
  - id: single-randomized-dll-export
    desc: Single randomized DLL export
    crit: suspicious
    conf: 0.86
    all:
      - id: metadata/binary/symbols/exports::single-short-lowercase-export
      - id: metadata/binary/metrics/structural::minimal-exports
    any:
      - id: metadata/binary/debug::pdb-random-basename
      - id: metadata/binary/debug::pdb-webroot-loader-project
      - id: metadata/binary/anomaly/format::pe-entry-in-header
    unless:
      - id: metadata/binary/symbols/exports/
      - id: metadata/binary/symbols/exports/
      - id: metadata/signed/platform/
  - id: single-opaque-mixed-case-export
    desc: Single mixed-case opaque DLL export
    crit: suspicious
    conf: 0.9
    all:
      - id: mixed-case-opaque-export-name
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/binary/metrics/structural::minimal-exports
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: metadata/binary/symbols/exports::com-export-pair
      - id: metadata/binary/symbols/exports::standard-com-server-exports
      - id: metadata/binary/symbols/exports::total-commander-packer-plugin
      - id: well-known/app/system/iobit::iobit-signed-component-context

  - id: randomized-dictionary-export-cluster
    desc: Randomized dictionary export cluster
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/metrics/threshold::many-exports-20
    any:
      - id: metadata/binary/symbols/export-name-pattern::many-lowercase-snakecase-exports
      - id: metadata/binary/symbols/export-name-pattern::many-lower-camelcase-exports
    unless:
      - id: metadata/binary/symbols/exports/
      - id: metadata/binary/symbols/exports/
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/x64dbg/
      - id: well-known/lib/runtime/electron/
      - id: objectives/anti-static/obfuscation/name-mangling/export-name/
  - id: known-export-cluster-libraries
    desc: Known library producing many snake-case exports
    crit: baseline
    conf: 0.95
    any:
      - id: micro-behaviors/crypto/asymmetric/curve25519::libsodium-library
      - id: well-known/lib/runtime/slint::slint-library
      - id: metadata/binary/symbols/exports::basename-libvlc-dll
      - id: well-known/lib/runtime/electron::nodejs-webstorage-marker
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
      - id: well-known/lib/data/duckdb::duckdb-library
