# Suspicious DLL Export Names
# Export names that reveal malicious intent through naming conventions
# Anti-static failure: author neglected to obfuscate export names
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: collect-send-export
    desc: Export combining collection and transmission
    crit: suspicious
    conf: 0.85
    if:
      type: symbol
      regex: '(?i)(collect|gather).{0,15}(send|upload|exfil)'
    not:
      - regex: '(?i)telemetry'
      - regex: '(?i)watson'
      - regex: '(?i)collection'
      - regex: '(?i)dump'
      - regex: 'System\.Diagnostics\.Tracing::DataCollector'
      - regex: '^_?Z[NL]'
      - regex: '(?i)regexfil'
      # PyTorch c10d StoreCollectives: gatherSend / gather_send are MPI-style
      # collective ops, not collect-then-exfil export naming.
      - regex: '(?i)gather[_]?send'
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor/
  - id: steal-export
    desc: Export with steal/harvester terminology
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      regex: '(?i)^(steal|harvester)'
  - id: keylog-export
    desc: Export indicating keylogging
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      regex: '(?i)^keylog(ger|ging)?$|^keypresslog(ger|ging)?$'
  - id: inject-export
    desc: Export indicating code injection
    crit: suspicious
    conf: 0.8
    if:
      type: symbol
      regex: '(?i)^inject(dll|code|payload)?$'
    unless:
      - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
      - id: well-known/tool/sysadmin/console/
      - id: well-known/game/mod::bedrockboot-source-repository
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
    downgrade:
      any:
        - id: well-known/game/mod/
  - id: shellcode-implant-export
    desc: Export indicating shellcode or implant
    crit: suspicious
    conf: 0.8
    if:
      type: symbol
      regex: '(?i)^(shellcode|implant)'
  - id: dump-creds-export
    desc: Export indicating credential dumping
    crit: suspicious
    conf: 0.85
    if:
      type: symbol
      regex: '(?i)(dump|extract)[_\-]?(cred|pass|hash)'
    not:
      - regex: '(?i)^_?Z[NL]'
      - regex: '(?i)dump[_-]?hash[_-]?table'
    unless:
      - id: well-known/lib/native/poco::poco-cpp-library-version
  - id: dump-token-export
    desc: Export indicating token extraction
    crit: suspicious
    conf: 0.85
    if:
      type: symbol
      regex: '(?i)(dump|extract)token'
    not:
      - regex: '(?i)Signature'
      - regex: '(?i)Metadata'
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
    unless:
      - id: well-known/app/security/bitdefender/

  # This is a weak naming heuristic, not proof of randomness: it records a
  # cluster of otherwise unrecognized export names with infixed digits.
  - id: digit-infixed-export-cluster
    desc: Unrecognized digit-infixed export cluster
    # This broad export-table shape is feature evidence, not an analyst-ready
    # anomaly. Higher-level injection/loader composites provide escalation.
    crit: baseline
    conf: 0.92
    count_min: 8
    if:
      type: export
      regex: '^[A-Za-z]{2,}[0-9][A-Za-z0-9]{2,}$'
    not:
      # OpenGL / OpenGL ES / EGL / Vulkan entry points.
      - regex: '^(gl|egl|vk)[A-Z]'
      # CUDA runtime exports embed API version digits by convention.
      - regex: '^cuda'
      # Digest, checksum and text-encoding APIs carry a digit by convention.
      - regex: '^(SHA|MD|CRC|UTF|RIPEMD|BLAKE)[0-9]'
      # Itanium C++ ABI mangled names (_ZN.., _ZL.., _ZTV..) length-prefix every
      # identifier with a digit, so ordinary C++ symbols exported by a GCC/Clang
      # or MinGW build match by construction. cleave strips the leading
      # underscore before matching, hence the optional `_`.
      - regex: '^_?Z[A-Z]'
      # Windows OLE Automation uses type-width digits in conventional export
      # families; these are semantic API names, not randomized identifiers.
      - regex: '^Var[A-Z][A-Za-z0-9]*$'
      - regex: '^BSTR_[A-Za-z0-9]+$'
      - regex: '^HWND_[A-Za-z0-9]+$'
      - regex: '^LPSAFEARRAY_[A-Za-z0-9]+$'
      - regex: '^VARIANT_[A-Za-z0-9]+$'
