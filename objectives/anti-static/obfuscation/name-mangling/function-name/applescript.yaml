# Repeated long decimal names conceal the role of AppleScript handlers.
# This is source naming evidence, including source recovered from a native
# command buffer. A single numbered helper or a numbered call is insufficient.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  attack: T1027
traits:
  - id: applescript-long-decimal-handler-names
    desc: Long numeric AppleScript handler names
    crit: suspicious
    conf: 0.95
    size_max: 2097152
    if:
      type: text
      regex: '(\bon\s+[A-Za-z][0-9]{16,20}\s*\([\s\S]*?){8}'
