# Hexadecimal function identifiers are name mangling, not product identity.
# A hexadecimal argument does not by itself establish a string-table lookup.
defaults:
  platforms: [windows, unix]
  attack: T1027
  mbc: B0032
traits:
  - id: hex-named-hex-argument-call
    desc: Hex-named function receives hexadecimal argument
    crit: notable
    conf: 0.9
    for: [javascript, shell, html, text]
    if:
      type: text
      regex: '_0x[0-9a-f]{3,}\s*\(\s*0x[0-9a-f]+\s*\)'
