# Hexadecimal function identifiers are name mangling, not product identity.
# A hexadecimal argument does not by itself establish a string-table lookup.
defaults:
  platforms: [windows, unix]
  attack: T1027
  mbc: B0032
traits:
  - id: hex-function-names
    desc: Hex-prefixed function names (_0x pattern)
    crit: notable
    conf: 0.9
    # Minifiers shorten names but never emit _0x hexadecimal, so inline page
    # scripts are safe to cover alongside linked modules.
    for: [javascript, shell, html]
    if:
      type: text
      regex: function\s+_0x[a-fA-F0-9]{4,}\s*\(
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: well-known/tool/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
      - id: well-known/tool/development/vscode-extension/recomment::webpack-obfuscator-dep
      - id: well-known/tool/development/vscode-extension/recomment::recomment-extension-context
      - id: well-known/tool/development/vscode-extension/recomment::recomment-command-id
  - id: hex-named-hex-argument-call
    desc: Hex-named function receives hexadecimal argument
    crit: notable
    conf: 0.9
    for: [javascript, shell, html, text]
    if:
      type: text
      regex: '_0x[0-9a-f]{3,}\s*\(\s*0x[0-9a-f]+\s*\)'
