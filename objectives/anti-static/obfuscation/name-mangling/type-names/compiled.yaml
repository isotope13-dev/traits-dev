composite_rules:
- id: obfuscated-go-identifiers
  for:
  - elf
  - macho
  - pe
  desc: Go binary with obfuscated identifiers
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/lang/compiler/systems::go-binary-comp
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-random-packages
  - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-random-packages-no-digit
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-garbled-main-symbols
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-long-lowercase-main-types
  platforms:
  - windows
  - linux
  - macos
