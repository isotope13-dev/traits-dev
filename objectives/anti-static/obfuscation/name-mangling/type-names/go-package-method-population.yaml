defaults:
  platforms: [windows, linux, macos]
  for: [binaries]

traits:
  - id: go-obfuscated-package-methods
    desc: Garbled Go package and receiver names
    crit: suspicious
    conf: 0.85
    count_min: 80
    if:
      type: text
      regex: ^[a-z][a-z0-9]{6,9}\.\(\*[A-Z][a-zA-Z0-9]{6,9}\)\.[A-Za-z][A-Za-z0-9_]{2,}$
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: metadata/lang/compiler/systems::go-pe-binary-context
      - id: metadata/lang/compiler/systems::go-pe-rich-symbols
      - id: metadata/lang/compiled/
