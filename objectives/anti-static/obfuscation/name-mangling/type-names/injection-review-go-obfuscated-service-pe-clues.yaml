defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-obfuscated-service-pe-clues
    crit: suspicious
    desc: Obfuscated Go, service and PE clues
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: micro-behaviors/os/service/host::svchost-service-globals-reference
    any:
      - id: micro-behaviors/fs/path/library::moka-dll-text
      - id: micro-behaviors/data/format/executable/header::x86-mz-pe-signature-check
