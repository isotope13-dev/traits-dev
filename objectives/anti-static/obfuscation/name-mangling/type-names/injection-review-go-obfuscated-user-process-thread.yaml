defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-obfuscated-user-process-thread
    crit: suspicious
    desc: Obfuscated Go and user-process thread APIs
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: metadata/binary/symbols/name/process::create-process-as-user
    any:
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: micro-behaviors/process/info/thread::resume-thread-import
