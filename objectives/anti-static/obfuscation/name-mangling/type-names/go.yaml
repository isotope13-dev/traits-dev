defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  attack: T1027
  size_min: 262144
traits:
  - id: go-embedded-compiler-ir
    desc: Go binary with compiler IR types
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: 'main.SSAValue'
  - id: go-long-lowercase-main-types
    desc: Many long lowercase Go main type names
    crit: suspicious
    conf: 0.85
    # Go unexported identifiers start lowercase. Ordinary exported descriptive
    # CamelCase types (Artifact, Binding, Reference) are not obfuscated names;
    # repeated unusually long lowercase-only names are the signal. Each name
    # appears twice in typical Go metadata, so count_min 20 requires ten names.
    count_min: 20
    if:
      type: text
      regex: '\bmain\.[a-z][a-z0-9_]{6,}$'
    unless:
      - type: symbol
        substr: "github.com/"
      - id: well-known/app/storage/restic::restic-binary-name
      - id: well-known/tool/development/toolchain/go-toolchain/
      - id: well-known/lib/development/golang-x-tools/
  - id: go-instruction-opcode-types
    desc: Go binary with instruction/opcode types
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'main\.(Instruction|Opcode|RegID)'
  # Garble and similar renamers emit irregular alphanumeric main.* symbols
  # (e.g. main.a8tooG, main.CdlVTZsBzDV) instead of compiler-numbered helpers
  # or readable CamelCase words. A2A (agent-to-agent) and E2EE
  # (end-to-end encryption) are standard digit-bearing protocol acronyms,
  # including inside CamelCase names; they are not randomized identifiers.
  # The same holds for cryptographic algorithm and encoding names
  # (AES-128-CBC, 3DES, MD5, SHA-256, Base64, PKCS#5, ASN.1), filtered below.
  - id: go-garbled-main-digit
    desc: Go main symbol mixes letters and digits
    crit: component
    conf: 0.9
    count_min: 8
    if:
      type: text
      regex: 'main\.[A-Za-z][A-Za-z0-9]*[0-9][A-Za-z]+[A-Za-z0-9]*$'
    not:
      - regex: '(?i)(bit|byte|int|uint|float)'
      # Protocol names with a version digit (OAuth2, HTTP/2) and numeronyms (a11y, i18n) are vocabulary too.
      - regex: '(?i)(a11y|i18n|l10n|k8s|a2a|e2ee|oauth2|http2)'
      # EC2 is ordinary cloud-product vocabulary in names such as EC2Runner.
      - regex: '(?i)ec2'
      # Route 53 is the AWS DNS product name, so Route53DNS is vocabulary.
      - regex: '(?i)route53'
      # Standard cryptographic algorithm and encoding names carry digits by
      # design (aes128CBCDecrypt, sha3, edwards25519, des3Decrypt, md5str,
      # base64decode, pkcs5UnPadding, sha256Sum, chacha20poly1305Seal):
      # protocol vocabulary, not randomized identifiers. Bare short forms are
      # deliberately not excluded: they also occur inside random strings.
      - regex: '(?i)(aes(128|192|256|gcm)|des3|3des|md[245]|sha(1|3|224|256|384|512)|base64|pkcs[157]|asn1|chacha|poly1305|x25519|edwards25519|ed25519|pbkdf2|ripemd160)'
      # Version and address-family markers inside readable CamelCase
      # (captchaV2Attempts, dialIPv4Only, stage2Result, b64KeyToHex).
      - regex: '(?i)(v[0-9]|stage[0-9]|b64)'
      # Windows API/type names use w32/win32 and w64/win64 as ordinary
      # platform vocabulary (for example win32RootWindow and w32Rect).
      - regex: '(?i)(w32|win32|w64|win64)'
    unless:
      - type: symbol
        substr: "github.com/"
      - id: well-known/app/storage/restic::restic-binary-name
      - id: well-known/tool/development/toolchain/go-toolchain/
      - id: well-known/lib/development/golang-x-tools/
  - id: go-garbled-main-mixed-case
    desc: Go main names alternate short letter runs
    crit: component
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: 'main\.([a-z0-9]{1,3}[A-Z]){5}[a-z0-9]{0,3}$'
    unless:
      - type: symbol
        substr: "github.com/"
      - id: well-known/app/storage/restic::restic-binary-name
      - id: well-known/tool/development/toolchain/go-toolchain/
      - id: well-known/lib/development/golang-x-tools/
composite_rules:
  - id: go-garbled-main-symbols
    desc: Randomized Go main package symbol names
    crit: notable
    conf: 0.9
    any:
      - id: go-garbled-main-digit
      - id: go-garbled-main-mixed-case
