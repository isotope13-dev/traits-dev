defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  attack: T1027
  size_min: 262144
traits:
  - id: go-embedded-compiler-ir
    desc: Go binary with compiler IR types
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: "main\\.SSAValue"
  - id: go-concatenated-word-types
    desc: Go types with concatenated-word obfuscation
    crit: suspicious
    conf: 0.85
    count_min: 3
    if:
      type: text
      regex: 'main\.[A-Z][a-z]{15,}'
    unless:
      - type: symbol
        substr: "github.com/"
      - id: well-known/app/storage/restic::restic-binary-name
  - id: go-instruction-opcode-types
    desc: Go binary with instruction/opcode types
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'main\.(Instruction|Opcode|RegID)'
  - id: go-short-word-main-types
    desc: Many short common-word main package types
    crit: suspicious
    conf: 0.85
    count_min: 5
    if:
      type: text
      regex: '^main\.[A-Z][a-z]+$'
    unless:
      - type: symbol
        substr: "github.com/"
      - id: well-known/app/storage/restic::restic-binary-name
  # Garble and similar renamers emit irregular alphanumeric main.* symbols
  # (e.g. main.a8tooG, main.CdlVTZsBzDV) instead of compiler-numbered helpers
  # or readable CamelCase words.
  - id: go-garbled-main-digit
    desc: Go main symbol mixes letters and digits
    crit: component
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: 'main\.[A-Za-z][A-Za-z0-9]*[0-9][A-Za-z]+[A-Za-z0-9]*$'
    unless:
      - type: symbol
        substr: "github.com/"
      - id: well-known/app/storage/restic::restic-binary-name
  - id: go-garbled-main-mixed-case
    desc: Go main symbol has five uppercase transitions
    crit: component
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: 'main\.([a-z0-9]*[A-Z]){5}[A-Za-z0-9]*$'
    unless:
      - type: symbol
        substr: "github.com/"
      - id: well-known/app/storage/restic::restic-binary-name
  - id: go-generated-main-eq-symbols
    desc: Generated Go main type symbols
    crit: suspicious
    conf: 0.9
    for: [pe]
    count_min: 100
    if:
      type: text
      substr: "type:.eq.main."
      section: .symtab
    unless:
      - type: symbol
        substr: "github.com/"

composite_rules:
  - id: go-garbled-main-symbols
    desc: Randomized Go main package symbol names
    crit: notable
    conf: 0.9
    any:
      - id: go-garbled-main-digit
      - id: go-garbled-main-mixed-case
