defaults:
  platforms: [android]
  for: [apk, zip]
  mbc: B0024
  attack: T1027.002

traits:
  - id: apk-obfuscated-long-resource-names--layout-or-xml
    desc: APK long layout or XML resource name
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/(layout|xml)/[a-z]{7,14}\\.(xml|png|jpg)$"

  - id: apk-obfuscated-long-resource-names--image
    desc: APK long lowercase image resource name
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/(drawable|mipmap[^/]*)/[a-z]{7,14}\\.(xml|png|jpg)$"

composite_rules:
  - id: apk-obfuscated-long-resource-names
    desc: APK uses long randomized-looking resource names
    crit: component
    conf: 0.86
    any:
      - id: apk-obfuscated-long-resource-names--layout-or-xml
      - id: apk-obfuscated-long-resource-names--image

  - id: apk-obfuscated-resource-stager
    desc: APK stages code through randomized-looking resource names
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: apk-obfuscated-long-resource-names
    unless:
      - id: metadata/package/testing/presence/fixture::android-apk-test-fixture-context
