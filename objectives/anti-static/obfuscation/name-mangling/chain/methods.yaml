# Short lowercase identifiers invoking execution methods. The matcher does not
# verify randomness — it keys on a 5-6 char lowercase receiver calling an
# execution method — so the alternation is restricted to run/shell. Benign
# data methods like .replace/.copy/.move were
# removed: they are ubiquitous on ordinary descriptive names (retval.replace,
# buffer.copy) and contradicted the "exec-like" intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: random-identifier-chains-a
    desc: 'Short lowercase IDs invoking run/shell'
    crit: notable
    conf: 0.7
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/marked/
      - id: metadata/lang/source/
    downgrade:
      any:
        - id: well-known/tool/development/firebug/
        - id: well-known/tool/development/prettier::package-bundle
        - id: well-known/tool/development/vscode/svelte/
        - id: micro-behaviors/process/interpreter/vm/
    if:
      type: symbol
      # `exec` is not in the list: lowercase `.exec` on a 5-6 letter lowercase
      # object is the RegExp API far more often than an execution call —
      # `regex.exec(input)` in WinMerge's AI merge plugin was read as a mangled
      # dispatch chain — and `query.exec` (Mongoose) reads the same way. The
      # execution spellings this rule is after are `.Exec` (WSH, capitalised)
      # or short aliases like `cp.exec`, neither of which this pattern matches.
      # Repeated short `.execute` aliases are neutral minifier metadata.
      regex: '^[a-z]{5,6}\.(run|shell)$'
