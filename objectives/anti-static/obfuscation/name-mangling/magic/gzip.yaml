defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: js-gzip-header-identifier
  desc: GZIP header magic bytes as source literals
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 0x1f\b.{0,40}0x8b\b|0x8b\b.{0,40}0x1f\b|\b31\s*,\s*139\b|\b139\s*,\s*31\b
composite_rules:
- id: fake-gzip-loader
  desc: Obfuscated loader using fake GZIP header variables
  crit: hostile
  conf: 0.99
  attack: T1027
  mbc: B0032
  all:
  - id: js-gzip-header-identifier
  - id: micro-behaviors/data/decode/base64::atob-decode
  any:
  - id: micro-behaviors/data/string/access::js-repeated-charat-calls
  - id: objectives/anti-static/obfuscation/string/array::js-array-swap-pattern
  near_bytes: 2048
  unless:
  - id: micro-behaviors/data/compress/
  - id: micro-behaviors/data/decompress/
