defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-gzip-header-identifier
    desc: GZIP header magic bytes as source literals
    crit: notable
    conf: 0.9
    if:
      type: text
      # The decimal spelling must be an adjacent pair (`[31, 139]`, `139,31`).
      # Allowing filler between the two numbers matched any byte table that
      # happened to contain 31 and 139 within forty characters -- e.g. the
      # font/CMap arrays in pdf.js (`31,75,189,139`) -- which says nothing
      # about a GZIP header. The hex spelling keeps its span because the
      # mangled loaders this targets assign the two bytes to separate
      # variables.
      regex: '0x1f.{0,40}0x8b|0x8b.{0,40}0x1f|\b31\s*,\s*139\b|\b139\s*,\s*31\b'
composite_rules:
  - id: fake-gzip-loader
    desc: Obfuscated loader using fake GZIP header variables
    crit: hostile
    conf: 0.99
    attack: "T1027"
    mbc: "B0032"
    all:
      - id: js-gzip-header-identifier
      - id: micro-behaviors/data/decode/symbol-base64::atob-decode
    any:
      - id: micro-behaviors/data/string/access::js-charat-lookup
      - id: objectives/anti-static/obfuscation/string/array::js-array-swap-pattern
