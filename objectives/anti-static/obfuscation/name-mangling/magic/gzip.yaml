defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-gzip-header-identifier
    desc: GZIP header magic bytes as source literals
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '0x1f.{0,40}0x8b|0x8b.{0,40}0x1f|\b31\b.{0,40}\b139\b|\b139\b.{0,40}\b31\b'
composite_rules:
  - id: fake-gzip-loader
    desc: Obfuscated loader using fake GZIP header variables
    crit: hostile
    conf: 0.99
    attack: "T1027"
    mbc: "B0032"
    all:
      - id: js-gzip-header-identifier
      - id: micro-behaviors/data/decode/symbol-base64::atob-decode
    any:
      - id: micro-behaviors/data/string/access::js-charat-lookup
      - id: objectives/anti-static/obfuscation/string/array::js-array-swap-pattern
