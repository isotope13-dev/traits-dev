defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits: []
composite_rules:
- id: fake-gzip-loader
  desc: Obfuscated loader using fake GZIP header variables
  crit: hostile
  conf: 0.99
  attack: T1027
  mbc: B0032
  all:
  - id: metadata/file/magic/numbers::gzip-magic-source-literals
  - id: micro-behaviors/data/decode/base64::atob-decode
  any:
  - id: micro-behaviors/data/string/access::js-repeated-charat-calls
  - id: objectives/anti-static/obfuscation/string/array::js-array-swap-pattern
  near_bytes: 2048
  unless:
  - id: micro-behaviors/data/compression::gzip-loader-compression-evidence
