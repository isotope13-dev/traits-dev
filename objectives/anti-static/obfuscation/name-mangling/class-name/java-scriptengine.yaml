# Each profile requires an obfuscated Java class name; the resource or engine
# APIs are context, not evidence that a staged script reaches eval.
defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]

composite_rules:
  - id: java-obfuscated-class-scriptengine-eval-profile
    desc: Obfuscated Java class name with ScriptEngine eval
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-eval-api
      - id: objectives/anti-static/obfuscation/name-mangling/class-name::java-ii-obfuscated-class-name
  - id: java-obfuscated-class-resource-profile
    desc: Obfuscated Java class name with resource access
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
      - id: objectives/anti-static/obfuscation/name-mangling/class-name::java-ii-obfuscated-class-name
  - id: java-obfuscated-class-engine-profile
    desc: Obfuscated Java class name with ScriptEngine setup
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-api
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-getenginebyname
      - id: objectives/anti-static/obfuscation/name-mangling/class-name::java-ii-obfuscated-class-name
