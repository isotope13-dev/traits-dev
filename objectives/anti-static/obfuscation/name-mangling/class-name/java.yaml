defaults:
  platforms: [windows, unix]
  for:
    - class
    - java
traits:
  - id: java-numeric-classnames
    desc: Java classes with numeric obfuscated names
    crit: suspicious
    conf: 0.85
    mbc: B0032
    attack: T1140
    for: [class]
    count_min: 3
    if:
      type: text
      regex: L[0-9]{1,3};
    unless:
      # A vendored runtime or library: Selenium ships a whole JRuby at
      # third_party/jruby/jruby-complete.jar, plus BouncyCastle jars.
      - id: metadata/package/files/dependency::third-party-directory-path
  # The typo only means anything as part of an identifier -- `FileManger`,
  # `TaskManger` -- which is what "typo of Manager" describes. On its own
  # MANGER is an ordinary English word, and a bare `word: MANGER` matched
  # Apache commons-codec's DoubleMetaphone, whose phonetic word list contains
  # it; three samples tripped on a bundled commons-codec jar alone.
  - id: manger-typo
    desc: MANGER typo (Manager)
    crit: suspicious
    if:
      type: text
      # Case-sensitive, and only PascalCase class name identifiers.
      # A case-insensitive form matched lowercase prose instead: Guava's
      # TldPatterns carries the public-suffix list, which contains a
      # `...manger` domain. Requiring an uppercase first character avoids
      # matching camelCase local variable names like `userManger`.
      regex: '\b[A-Z][A-Za-z0-9]*(Manger|MANGER)\b'
  - id: managr-typo
    desc: Managr typo (Manager)
    crit: suspicious
    if:
      type: text
      word: Managr
  - id: managerr-typo
    desc: Managerr typo (Manager)
    crit: suspicious
    if:
      type: text
      word: Managerr
  - id: java-single-letter-classnames
    desc: "Java classes w/ single-letter obf names"
    crit: component
    conf: 0.8
    mbc: B0032
    attack: T1140
    count_min: 3
    if:
      type: text
      regex: '\b[a-z]\.class\b'
  - id: java-deep-lookalike-identifier-namespace
    desc: Java class uses a deep I/l/i-only namespace
    crit: suspicious
    conf: 0.98
    mbc: B0032
    attack: T1027
    for: [class]
    if:
      type: value
      path: class.this_class
      regex: '^([Iil]{10,12}/){6,}[Iil]{10,12}$'
  # A confusable I/i-only basename of 6-9 characters is not, by itself, a
  # reliable malware signal: a codebase that renames every class with a
  # random mix of visually similar characters (a common commercial Java
  # obfuscator technique, also used by dual-use "hacked client" mods to
  # frustrate reverse engineering) will incidentally produce a same-character
  # run of that length purely by chance once it has renamed a few hundred
  # classes. Requiring a longer run keeps the deliberate "name this one class
  # something unreadable" technique detectable while filtering out the
  # incidental collisions that scale with codebase size. (Relocated from
  # objectives/command-and-control/dropper/execution/scriptengine/java.yaml
  # 2026-09-08 -- the matcher only inspects a filename, which is a naming
  # convention fact, not scriptengine/dropper evidence; the scriptengine
  # composites there still reference this trait cross-directory.)
  - id: java-ii-obfuscated-class-name
    desc: Long confusable I/i-only class name
    crit: suspicious
    conf: 0.9
    for: [java_class, class]
    if:
      type: basename
      regex: '^[iI]{10,}\.class$'
composite_rules:
  - id: java-misspelled-system-classes
    desc: Common Java class names with character substitutions
    crit: suspicious
    conf: 0.8
    mbc: B0032
    attack: T1140
    any:
      - id: manger-typo
      - id: managr-typo
      - id: managerr-typo
  - id: java-adwind-obfuscation-pattern
    desc: Adwind RAT class name obfuscation pattern
    crit: suspicious
    conf: 0.9
    mbc: B0032
    attack: T1140
    needs: 2
    any:
      - id: java-misspelled-system-classes
      - id: java-numeric-classnames
      - id: java-single-letter-classnames
