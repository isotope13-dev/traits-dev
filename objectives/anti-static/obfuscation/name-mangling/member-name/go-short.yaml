# Consonant-only names alone are not evidence of concealment. Require the recovered
# byte-table decryptor too; the two observations describe distinct ways in
# which the application's main-package implementation obscures its meaning.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027

composite_rules:
  - id: go-consonant-main-names-with-string-encryption
    desc: Consonant-only Go names with encrypted strings
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/symbols/count::go-many-consonant-main-function-names
      - id: objectives/anti-static/obfuscation/string/encrypt::go-splitmix-byte-table-decoder
