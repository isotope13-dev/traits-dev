# A JVM method whose name is a bare random hex string. Compilers and obfuscators
# both rename methods, but they produce short sequential names (`a`, `b`, `a1`)
# or keep a readable prefix; a 32-hex-digit identifier is a GUID minted so the
# injected method cannot collide with anything in the host project. Fractureiser
# stage 0 injected `_d1385bd3c36f464882460aa4f0484c53()` into a Minecraft mod's
# static initializer. Match parsed function symbols, not arbitrary constant-pool
# strings such as Bouncy Castle elliptic-curve parameters.
defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]
  attack: T1027
  mbc: B0032

traits:
  - id: java-random-hex-member-name
    desc: JVM method named with random hex digits
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: function
      regex: '^_?[0-9a-f]{32}$'
    unless:
      # Java crypto helpers commonly carry an all-zero padding or sentinel
      # string. It is a constant-pool value, not an obfuscated member name.
      - type: value
        path: class.strings[*]
        exact: '00000000000000000000000000000000'
