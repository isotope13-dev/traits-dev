# A JVM member whose name is a bare random hex string. Compilers and obfuscators
# both rename members, but they produce short sequential names (`a`, `b`, `a1`)
# or keep a readable prefix; a 32-hex-digit identifier is a GUID minted so the
# injected member cannot collide with anything in the host project. Fractureiser
# stage 0 injected `_d1385bd3c36f464882460aa4f0484c53()` into a Minecraft mod's
# static initializer.
defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]
  attack: T1027
  mbc: B0032

traits:
  - id: java-random-hex-member-name
    desc: JVM member named with random hex digits
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: class.strings[*]
      regex: '^_?[0-9a-f]{32}$'
