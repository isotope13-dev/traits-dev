# Generated-looking archive member names. HijackLoader/IDAT-style staging
# kits mint a Title-case nonce plus an invented short extension so the
# encrypted blob does not look like a PE in the plaintext member table.
# The matcher is the name shape only; encryption and an executable sibling
# live in the pack/dropper composites that reference these atoms.
defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar]
  attack: T1027
  mbc: B0032
  crit: notable
  conf: 0.88

traits:
  # Four-letter nonce suffixes that are all consonants except a trailing
  # vowel (.rhni). .html/.json/.yaml/.docx do not match this shape.
  - id: archive-nonce-4ext-3cons
    desc: Title-case member, 3-consonant 4-letter ext
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[A-Z][a-z]{6,14}\.[bcdfghjklmnpqrstvwxz]{3}[aeiou]$'

  # Four-letter all-consonant nonce (.mwkd). `h` is omitted so .html drops out.
  - id: archive-nonce-4ext-allcons
    desc: Title-case member with .mwkd-like nonce ext
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[A-Z][a-z]{6,14}\.(mwkd|kdtw)$'

  # Vowel plus three consonants (.ewyw). json/html/yaml start with a consonant.
  - id: archive-nonce-4ext-vowel-cons
    desc: Title-case member, vowel-led 4-letter ext
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[A-Z][a-z]{6,14}\.[aeiou][bcdfghjklmnpqrstvwxyz]{3}$'

  # Listed two-letter nonce suffixes. Open `[a-z]{2}` is too broad (.js/.py).
  - id: archive-nonce-2ext-member
    desc: Title-case member with .ns/.pm nonce ext
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[A-Z][a-z]{6,14}\.(ns|pm)$'

  # Three-letter extensions that start with two vowels (.iuw). That shape
  # excludes .exe/.dll/.com/.txt/.bin/.dat/.img/.iso.
  - id: archive-double-vowel-3ext-member
    desc: Title-case member with double-vowel extension
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[A-Z][a-z]{2,14}\.[aeiou]{2}[a-z]$'

  - id: archive-lorem-member-a
    desc: Lorem-ipsum archive member name
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(lorem|ipsum|dolor|consectetur|adipiscing)\b'

  - id: archive-lorem-member-b
    desc: Lorem-ipsum archive member name
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(nesciunt|tempor|incididunt|elit|amet)\b'

