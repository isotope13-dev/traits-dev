# A native console program that hashes names with FNV-1a, walks the PEB loader
# list, names NtWriteVirtualMemory and compares MZ/PE header constants itself
# resolves its APIs without an import table and writes a payload into another
# process. Each part is ordinary on its own (checksums, PEB access, PE parsing
# tools); together they are the loader shape.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.007,T1055
composite_rules:
  - id: fnv-peb-resolution-remote-write-loader
    desc: FNV and PEB API resolution with remote write
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/data/checksum::fnv1a-x86-prime-imul
      - id: micro-behaviors/os/api-resolution/manual::x86-peb-loader-data-load
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # The same hashing-and-PEB resolution paired with a .NET Framework host
  # executable path and the CLR runtime library name instead of a remote write:
  # the loader names the managed host process it will replace.
  - id: fnv-peb-resolution-dotnet-host-loader
    desc: FNV and PEB API resolution naming .NET host
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/data/checksum::fnv1a-x86-prime-imul
      - id: micro-behaviors/process/info/query::peb-access-x86
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/fs/path/library::mscoree-dll-name
      - id: micro-behaviors/fs/path/dotnet-framework::dotnet-framework-versioned-exe-tail
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
