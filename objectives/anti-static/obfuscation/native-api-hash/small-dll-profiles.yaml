defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: small-dll-export-walk-sparse-imports
  desc: Small DLL with export walk and sparse imports
  crit: component
  conf: 0.88
  size_max: 65536
  all:
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-export-walk-primitive
  any:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/symbols/imports::single-import-raw
  - id: metadata/binary/symbols/imports::few-import-count
- id: small-dll-api-hash-resolution
  desc: Small DLL with manual API-hash resolution
  crit: suspicious
  conf: 0.9
  size_max: 65536
  all:
  - id: small-dll-export-walk-sparse-imports
  - id: objectives/anti-static/obfuscation/imports/api-hashing::api-hash-family-any
  attack: T1027.007
- id: small-dll-api-hash-low-strings
  desc: Small API-hash DLL with few strings
  crit: suspicious
  conf: 0.95
  attack: T1027.007
  size_max: 65536
  all:
  - id: small-dll-api-hash-resolution
  any:
  - id: metadata/binary/section/prose::strings-at-most-40
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
- id: djb2-file-memory-callback-api-hashes
  desc: DJB2 hashes for native file, memory, and wait APIs
  crit: suspicious
  conf: 0.98
  attack: T1027.007
  size_max: 65536
  all:
  - id: micro-behaviors/os/api-resolution/hash-based::pe-export-directory-walk-x86
  - id: micro-behaviors/os/api-resolution/hash-based::peb-ldr-list-access-x86
  - id: objectives/anti-static/obfuscation/native-api-hash::djb2-native-ntdll-hash-profile
  - id: objectives/anti-static/obfuscation/native-api-hash::ntcreatefile-djb2-hash
  - id: objectives/anti-static/obfuscation/native-api-hash::ntqueryinformationfile-djb2-hash
  - id: objectives/anti-static/obfuscation/native-api-hash::ntreadfile-djb2-hash
  - id: objectives/anti-static/obfuscation/native-api-hash::ntclose-djb2-hash
  - id: objectives/anti-static/obfuscation/native-api-hash::ntprotectvirtualmemory-djb2-hash
  - id: objectives/anti-static/obfuscation/native-api-hash::rtlregisterwait-djb2-hash
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
