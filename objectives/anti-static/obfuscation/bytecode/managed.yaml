defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: managed-encoded-vm-dispatch
    desc: Position-decoded bytes near managed callback dispatch
    crit: suspicious
    conf: 0.97
    attack: T1027
    near_bytes: 128
    all:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::cil-cyclic-xor-position-subtract
      - id: micro-behaviors/data/control-flow/dispatch/callback::managed-action-invoke-call
