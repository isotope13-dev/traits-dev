defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: selectcmm-import
    desc: SelectCMM import (decoy triad)
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: SelectCMM
  - id: is-system-resume-automatic-import
    desc: IsSystemResumeAutomatic junk API import
    crit: notable
    conf: 0.85
    if:
      type: import
      exact: IsSystemResumeAutomatic
  - id: init-atom-table-import
    desc: InitAtomTable rare atom-table import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: InitAtomTable
  - id: add-console-alias-a-import
    desc: AddConsoleAliasA rare console import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: AddConsoleAliasA
  - id: bind-io-completion-callback-import
    desc: BindIoCompletionCallback asynchronous I/O import
    crit: notable
    conf: 0.85
    if:
      type: import
      exact: BindIoCompletionCallback
  - id: dense-decorated-cpp-import-cluster
    desc: Dense decorated C++ API imports
    crit: component
    conf: 0.94
    count_min: 20
    if:
      type: import
      regex: ^\?
  - id: dhcp-directory-service-import-cluster
    desc: Dense DHCP directory-service imports
    crit: notable
    conf: 0.94
    count_min: 6
    if:
      type: import
      regex: ^DhcpDs[A-Za-z]+$
  - id: store-prefixed-import-cluster
    desc: Dense Store-prefixed API imports
    crit: notable
    conf: 0.94
    count_min: 6
    if:
      type: import
      regex: ^Store[A-Za-z]+$
  - id: ldap-operation-import-cluster
    desc: Dense LDAP operation imports
    crit: notable
    conf: 0.92
    count_min: 6
    if:
      type: import
      regex: ^ldap_
composite_rules:
  - id: cross-domain-legacy-import-padding
    desc: Unrelated legacy API families pad the IAT
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    all:
      - id: dense-decorated-cpp-import-cluster
      - id: dhcp-directory-service-import-cluster
      - id: store-prefixed-import-cluster
      - id: ldap-operation-import-cluster
      - id: metadata/binary/symbols/count::many-imports-100
    unless:
      - id: metadata/filename/name-form::is-microsoft-named
  - id: rare-kernel-utility-import-cluster
    desc: Cross-domain rare Kernel32 utility import cluster
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    any:
      - id: micro-behaviors/fs/device::prepare-tape-import
      - id: micro-behaviors/communications/ipc/mailslot::set-mailslot-info-import
      - id: micro-behaviors/fs/enumerate/volume::find-next-volume-w-import
      - id: init-atom-table-import
      - id: add-console-alias-a-import
      - id: bind-io-completion-callback-import
    needs: 4
    unless:
      - id: metadata/filename/name-form::is-microsoft-named
      - id: well-known/lib/platform/vanara::vanara-binding-assembly
  - id: junk-api-flooding-cluster
    desc: Rare junk API import flooding cluster
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: micro-behaviors/fs/volume/admin::set-volume-label-w
      - id: metadata/binary/header/malformed::import-padding-console-alias
    any:
      - id: micro-behaviors/data/collection/atom-table::add-atom-w-import
      - id: micro-behaviors/os/console/control::fill-console-output-attribute
      - id: is-system-resume-automatic-import
      - id: micro-behaviors/mem/query::query-memory-resource-notification-import
      - id: micro-behaviors/mem/query::heap-walk-import
    needs: 3
    unless:
      # kernel32 implements these Win32 APIs rather than importing them as decoys.
      - id: well-known/app/system/microsoft/platform::microsoft-signed-kernel-api-dll-context
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
        - id: well-known/lib/platform/wine/
  - id: decoy-import-triad
    desc: Decoy multimedia and COM imports
    crit: component
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/audio::playsound-a-import
      - id: selectcmm-import
      - id: micro-behaviors/os/com/invoke::olerun-import
    unless:
      - id: metadata/binary/symbols/count::many-imports-40
  - id: padded-loader-imports
    desc: Packed loader with padded decoy imports
    crit: suspicious
    conf: 0.96
    all:
      - id: decoy-import-triad
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/section/label/packing::upx-section
      - id: metadata/binary/section/permission::wx-section
    needs: 3
    unless:
      - id: metadata/filename/name-form::is-microsoft-named
