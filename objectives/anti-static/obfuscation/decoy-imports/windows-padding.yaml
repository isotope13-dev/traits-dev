defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: playsound-a-import
    desc: PlaySoundA import (decoy triad)
    crit: component
    conf: 0.9
    if:
      type: import
      exact: PlaySoundA
  - id: selectcmm-import
    desc: SelectCMM import (decoy triad)
    crit: component
    conf: 0.9
    if:
      type: import
      exact: SelectCMM
  - id: olerun-import
    desc: OleRun import (decoy triad)
    crit: component
    conf: 0.9
    if:
      type: import
      exact: OleRun
  - id: add-atom-w-import
    desc: AddAtomW junk API import
    crit: component
    conf: 0.85
    if:
      type: import
      exact: AddAtomW
  - id: fill-console-output-attribute-import
    desc: FillConsoleOutputAttribute junk API import
    crit: component
    conf: 0.85
    if:
      type: import
      exact: FillConsoleOutputAttribute
  - id: is-system-resume-automatic-import
    desc: IsSystemResumeAutomatic junk API import
    crit: component
    conf: 0.85
    if:
      type: import
      exact: IsSystemResumeAutomatic
  - id: query-memory-resource-notification-import
    desc: "QueryMemoryResourceNotification decoy import"
    crit: component
    conf: 0.85
    if:
      type: import
      exact: QueryMemoryResourceNotification
  - id: heap-walk-import
    desc: HeapWalk junk API import
    crit: component
    conf: 0.85
    if:
      type: import
      exact: HeapWalk
  - id: prepare-tape-import
    desc: PrepareTape rare utility import
    crit: component
    conf: 0.9
    if:
      type: import
      exact: PrepareTape
  - id: set-mailslot-info-import
    desc: SetMailslotInfo rare IPC import
    crit: component
    conf: 0.9
    if:
      type: import
      exact: SetMailslotInfo
  - id: find-next-volume-w-import
    desc: FindNextVolumeW volume enumeration import
    crit: component
    conf: 0.85
    if:
      type: import
      exact: FindNextVolumeW
  - id: init-atom-table-import
    desc: InitAtomTable rare atom-table import
    crit: component
    conf: 0.9
    if:
      type: import
      exact: InitAtomTable
  - id: add-console-alias-a-import
    desc: AddConsoleAliasA rare console import
    crit: component
    conf: 0.9
    if:
      type: import
      exact: AddConsoleAliasA
  - id: bind-io-completion-callback-import
    desc: BindIoCompletionCallback asynchronous I/O import
    crit: component
    conf: 0.85
    if:
      type: import
      exact: BindIoCompletionCallback
  - id: dense-decorated-cpp-import-cluster
    desc: Dense decorated C++ API imports
    crit: component
    conf: 0.94
    count_min: 20
    if:
      type: import
      regex: '^\?'
  - id: dhcp-directory-service-import-cluster
    desc: Dense DHCP directory-service imports
    crit: component
    conf: 0.94
    count_min: 6
    if:
      type: import
      regex: '^DhcpDs[A-Za-z]+$'
  - id: store-prefixed-import-cluster
    desc: Dense Store-prefixed API imports
    crit: component
    conf: 0.94
    count_min: 6
    if:
      type: import
      regex: '^Store[A-Za-z]+$'
  - id: ldap-operation-import-cluster
    desc: Dense LDAP operation imports
    crit: component
    conf: 0.92
    count_min: 6
    if:
      type: import
      regex: '^ldap_'
composite_rules:
  - id: cross-domain-legacy-import-padding
    desc: Unrelated legacy API families pad the IAT
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    all:
      - id: dense-decorated-cpp-import-cluster
      - id: dhcp-directory-service-import-cluster
      - id: store-prefixed-import-cluster
      - id: ldap-operation-import-cluster
      - id: metadata/binary/metrics/threshold::many-imports-100
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::is-microsoft-named
      - id: well-known/lib/platform/wine/
  - id: opaque-decoy-iat-rwx-loader
    desc: Opaque PE pads IAT and allocates RWX
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1620
    all:
      - id: cross-domain-legacy-import-padding
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-reserve-commit-x86-frame-locals
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: rare-kernel-utility-import-cluster
    desc: Cross-domain rare Kernel32 utility import cluster
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    any:
      - id: prepare-tape-import
      - id: set-mailslot-info-import
      - id: find-next-volume-w-import
      - id: init-atom-table-import
      - id: add-console-alias-a-import
      - id: bind-io-completion-callback-import
    needs: 4
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::is-microsoft-named
      - id: well-known/lib/platform/wine/
  - id: junk-api-flooding-cluster
    desc: Rare junk API import flooding cluster
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    all:
      - id: micro-behaviors/fs/volume/admin::set-volume-label-w
      - id: metadata/binary/anomaly/format::import-padding-console-alias
    any:
      - id: add-atom-w-import
      - id: fill-console-output-attribute-import
      - id: is-system-resume-automatic-import
      - id: query-memory-resource-notification-import
      - id: heap-walk-import
    needs: 3
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::is-microsoft-named
        - id: well-known/lib/platform/wine/
  - id: decoy-import-triad
    desc: Decoy multimedia and COM imports
    crit: component
    conf: 0.98
    all:
      - id: playsound-a-import
      - id: selectcmm-import
      - id: olerun-import
    unless:
      - id: metadata/binary/metrics/threshold::many-imports-40
  - id: padded-loader-imports
    desc: Packed loader with padded decoy imports
    crit: suspicious
    conf: 0.96
    all:
      - id: decoy-import-triad
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: metadata/binary/section/names::upx-section
      - id: metadata/hardening/memory::wx-section
    needs: 3
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::is-microsoft-named
