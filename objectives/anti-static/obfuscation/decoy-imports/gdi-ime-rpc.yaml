# Cross-domain GDI / IME / RPC / ACL imports used as IAT padding by
# early-2000s cryptor stubs (BitDefender Cripack / Kryptik packed PEs).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002

composite_rules:
  - id: gdi-ime-rpc-decoy-cluster
    desc: GDI IME RPC decoy import cluster
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/graphics/draw::enh-metafile-description
      - id: micro-behaviors/hardware/input/keyboard/layout::ime-status-window-pos
      - id: micro-behaviors/communications/ipc/rpc::rpc-binding-inq-object
    any:
      - id: micro-behaviors/os/security/descriptor::are-all-accesses-granted
      - id: micro-behaviors/os/security/descriptor::get-security-info
      - id: micro-behaviors/ui/controls/widget::image-list-set-icon-size
      - id: micro-behaviors/os/com/invoke::mk-parse-display-name
      - id: micro-behaviors/os/security/descriptor::set-user-object-security
      - id: micro-behaviors/ui/graphics/draw::get-metafile-bits-ex
      - id: micro-behaviors/ui/graphics/draw::create-hatch-brush
      - id: micro-behaviors/os/network/share::wnet-get-connection
    needs: 3
    unless:
      - id: metadata/binary/metrics/threshold::many-imports-100
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::is-microsoft-named
        - id: well-known/lib/platform/wine/

  - id: two-section-inflated-decoy-iat-cryptor
    desc: Two-section inflated decoy-IAT cryptor
    crit: hostile
    conf: 0.97
    all:
      - id: gdi-ime-rpc-decoy-cluster
      - id: metadata/binary/section/metrics::two-section-pe
      - id: metadata/binary/section/metrics::inflated-data-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/platform/wine/
