# Loaders that camouflage a small native stub under junk: a flood of unused
# API imports, consonant-vowel gibberish strings, gibberish PDB paths. First
# seen in Elex-family droppers, but every leg is a technique, not a family
# fingerprint, so the rules live here (moved from
# well-known/malware/trojan/elex/gibberish-loader/).
defaults:
  crit: hostile
  for: [pe]
  platforms: [windows]
  size_min: 200000
  size_max: 700000
composite_rules:
  - id: gibberish-pdb-decoy-import-loader
    desc: Gibberish-PDB loader with decoy imports
    conf: 0.99
    all:
      - id: metadata/binary/debug::pdb-cv-gibberish-path
      - id: objectives/anti-static/obfuscation/decoy-imports::rare-kernel-utility-import-cluster
      - id: micro-behaviors/crypto/symmetric/tea::canonical-delta
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-assembly
  - id: gibberish-string-junk-api-loader
    desc: Loader floods gibberish strings and junk APIs
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/decoy-imports::junk-api-flooding-cluster
      - id: objectives/anti-static/obfuscation/string/junking::consonant-vowel-gibberish
    any:
      - id: metadata/binary/section/ratio::pe-largest-section-68-to-80-percent
      - id: metadata/binary/instruction::iat-call-then-eax-compare
      - id: micro-behaviors/communications/ip/literal::encoded-external-ipv4-binary
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
    needs: 2
  - id: junk-api-camouflaged-c2-dropper
    desc: C2 dropper camouflaged by junk API imports
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/decoy-imports::junk-api-flooding-cluster
      - id: micro-behaviors/communications/ip/literal::encoded-external-ipv4-binary
    any:
      - id: objectives/anti-static/obfuscation/string/junking::consonant-vowel-gibberish
      - id: metadata/binary/section/ratio::pe-largest-section-68-to-80-percent
      - id: metadata/binary/instruction::iat-call-then-eax-compare
