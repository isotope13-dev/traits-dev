# The same Elex/Smoke Loader camouflage as gibberish-loader.yaml, but bloated:
# a 4 MB high-entropy .rdata payload, a .data section whose virtual size dwarfs
# its raw size (46 MB mapped image from a 4 MB file), a tiny RWX import-table
# section and consonant-vowel gibberish strings. The 2026-11 "Water" build
# (Amadey/Stealc/RedLine drop) exceeds the 700 KB cap on the leaner rules.
defaults:
  crit: hostile
  for: [pe]
  platforms: [windows]
  attack: T1027.002
composite_rules:
  - id: bloated-gibberish-inflated-loader
    desc: Inflated high-entropy loader with gibberish strings and RWX section
    conf: 0.95
    size_min: 700000
    all:
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/file/text-distribution::repeated-consonant-vowel-token-binary
      - id: metadata/binary/section/entropy::large-elevated-entropy-rdata
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
    unless:
      - id: metadata/installer/product/
      - id: metadata/signature/verified/
