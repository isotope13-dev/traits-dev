# A GUI executable importing GDI printer-driver callbacks among dozens of
# other imports it never uses: a crypter padding its import table so the
# stub reads as an ordinary program. The 2018 Dofoil/Smoke Loader build from
# the MediaGet update hijack imported 261 functions, including
# EngTransparentBlt, EngLockSurface and CLIPOBJ_ppoGetPath, called them with
# null arguments as noise, and decrypted its next stage into RWX memory.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002

composite_rules:
  - id: gdi-driver-ddi-decoy-imports
    desc: Executable pads imports with GDI printer-driver callbacks
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/graphics/draw::gdi-driver-ddi-import
      - id: metadata/binary/symbols/count::many-imports-50
    unless:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/signature/verified/

  - id: ddi-decoy-iat-crypter
    desc: Decoy driver imports wrap a packed, data-heavy crypter stub
    crit: hostile
    conf: 0.95
    all:
      - id: gdi-driver-ddi-decoy-imports
      - id: metadata/binary/code/ratio::pe-code-to-data-at-most-0-2
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: metadata/binary/section/ratio::large-data-section
      - id: metadata/binary/section/entropy::high-entropy-text
