# Decoder instructions occupy separate host-code gaps and jump between them.
# Immediate keys and relative branch displacements vary with each infection.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]

traits:
  - id: x86-jump-separated-word-add
    desc: Jump-separated word addition fragment
    crit: component
    conf: 0.95
    if:
      type: hex
      section: text
      pattern: '66 81 47 00 ?? ?? E9 ?? ?? ?? ??'
  - id: x86-jump-separated-dword-sub
    desc: Jump-separated dword subtraction fragment
    crit: component
    conf: 0.95
    if:
      type: hex
      section: text
      pattern: '81 2F ?? ?? ?? ?? E9 ?? ?? ?? ??'
  - id: x86-jump-separated-byte-add
    desc: Jump-separated byte addition fragment
    crit: component
    conf: 0.95
    if:
      type: hex
      section: text
      pattern: '81 C7 04 00 00 00 80 07 ?? E9 ?? ?? ?? ??'
  - id: x86-jump-separated-decode-bound
    desc: Scattered decode-loop comparison fragment
    crit: component
    conf: 0.95
    if:
      type: hex
      section: text
      pattern: '83 C7 04 39 F8 E9 ?? ?? ?? ??'

composite_rules:
  - id: x86-scattered-add-sub-decoder
    desc: Scattered x86 add-subtract decoding loop
    crit: suspicious
    conf: 0.98
    near_bytes: 8192
    all:
      - id: x86-jump-separated-word-add
      - id: x86-jump-separated-dword-sub
      - id: x86-jump-separated-byte-add
      - id: x86-jump-separated-decode-bound
