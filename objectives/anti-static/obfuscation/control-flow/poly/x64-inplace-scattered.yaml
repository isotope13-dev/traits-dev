# In-place sibling of the r11 output-buffer decoder. Each arithmetic operation
# ends in a jump to another host-code gap. Keys and displacements vary.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  conf: 0.98
traits:
  - id: x64-r15-jump-word-add
    desc: Jump-separated word addition through r15
    crit: component
    if:
      type: hex
      section: .text
      pattern: '66 (41|45) 81 (47 ??|87 [4]) ?? ?? E9 [4]'
  - id: x64-r15-jump-dword-sub
    desc: Jump-separated dword subtraction through r15
    crit: component
    if:
      type: hex
      section: .text
      pattern: '(41|45) 81 (6F ??|AF [4]) [4] E9 [4]'
  - id: x64-r15-jump-cursor-bound
    desc: Jump-separated r15 cursor comparison
    crit: component
    if:
      type: hex
      section: .text
      pattern: '(49|4B|4D|4F) 39 C7 E9 [4]'
composite_rules:
  - id: x64-scattered-inplace-add-sub-decoder
    desc: Scattered x64 in-place arithmetic decoder
    crit: suspicious
    attack: T1027,T1140
    all:
      - id: x64-r15-jump-word-add
      - id: x64-r15-jump-dword-sub
      - id: x64-r15-jump-cursor-bound
