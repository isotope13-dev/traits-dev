# A decoder scattered through gaps in existing host code. Keys, payload lengths,
# addresses and intervening host instructions are deliberately not pinned.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  conf: 0.98

traits:
  - id: x86-gap-byte-add-copy
    desc: Jump-separated byte addition and copy fragments
    crit: component
    if:
      type: hex
      section: .text
      pattern: '8A (0A|4A 00|8A 00 00 00 00) 80 C1 ?? E9 [4] [0-64] 88 8F 00 00 00 00 E9'
  - id: x86-gap-word-copy-subtract
    desc: Jump-separated word copy/subtract fragments
    crit: component
    if:
      type: hex
      section: .text
      pattern: '66 89 8F 00 00 00 00 E9 [4] [0-64] 66 81 2F ?? ?? E9'

composite_rules:
  - id: x86-mixed-width-host-gap-decoder
    desc: Byte and word decoding scattered through host code
    crit: suspicious
    attack: T1027.009,T1140
    near_bytes: 4096
    all:
      - id: x86-gap-byte-add-copy
      - id: x86-gap-word-copy-subtract
