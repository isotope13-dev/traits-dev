# Immediate arithmetic keys and branch distances vary with each build.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-jump-separated-word-add
    desc: Jump-separated word addition through r11
    crit: component
    conf: 0.98
    if:
      type: hex
      section: text
      pattern: '66 45 81 03 ?? ?? E9 ?? ?? ?? ??'
  - id: x64-jump-separated-dword-sub
    desc: Jump-separated dword subtraction through r11
    crit: component
    conf: 0.98
    if:
      type: hex
      section: text
      pattern: '41 81 2B ?? ?? ?? ?? E9 ?? ?? ?? ??'
  - id: x64-jump-separated-output-step
    desc: Jump-separated r11 decode-output increment
    crit: component
    conf: 0.98
    if:
      type: hex
      section: text
      pattern: '(49|4D) 83 C3 02 E9 ?? ?? ?? ??'
  - id: x64-jump-separated-decode-bound
    desc: Jump-separated rdi decode-loop bound
    crit: component
    conf: 0.98
    if:
      type: hex
      section: text
      pattern: '(48|4A) 81 FF ?? ?? ?? ?? E9 ?? ?? ?? ??'
composite_rules:
  - id: x64-scattered-add-sub-decoder
    desc: Scattered x64 add-subtract decoder
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: x64-jump-separated-word-add
      - id: x64-jump-separated-dword-sub
      - id: x64-jump-separated-output-step
      - id: x64-jump-separated-decode-bound
