defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: x86-entry-call-pop-getpc
    desc: Call-pop GetPC shortly after x86 entrypoint
    crit: notable
    conf: 0.9
    attack: T1027.002
    mbc: B0032.016
    if:
      type: yara
      source: "import \"pe\"\nrule x86_entry_callpop_getpc {\n strings:\n  $getpc = { 60 [0-128] E8 ?? ?? ?? ?? [0-128] 5D }\n condition:\n  pe.is_32bit() and\n  for any s in (0..pe.number_of_sections-1)\n    : (\n    pe.sections[s].name == \".text\" and\n    for any h in (1..#getpc) : (\n     @getpc[h] >= pe.entry_point\n     and @getpc[h] <= pe.entry_point + 512\n     and @getpc[h] >= pe.sections[s].raw_data_offset\n     and @getpc[h]\n     + !getpc[h] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size\n    )\n  )\n}\n"
