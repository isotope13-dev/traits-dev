# The call produces a native payload buffer, then the loader abandons its
# frame and restores saved registers from globals before jumping to the buffer.
# Absolute data addresses and call displacement are deliberately unconstrained.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: saved-stack-native-payload-handoff
    desc: UPX0 saved-stack restore and indirect handoff
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: hex
      section: UPX0
      pattern: 'E8 ?? ?? ?? ?? 83 C4 04 8B 25 ?? ?? ?? ?? 8B 2D ?? ?? ?? ?? 8B 0D ?? ?? ?? ?? 8B 15 ?? ?? ?? ?? 8B 35 ?? ?? ?? ?? 8B 3D ?? ?? ?? ?? 8D 05 ?? ?? ?? ?? FF E0'
