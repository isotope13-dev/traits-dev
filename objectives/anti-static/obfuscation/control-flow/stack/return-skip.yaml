defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-return-address-junk-skip
    desc: Advances return address past inline junk
    crit: suspicious
    conf: 0.98
    attack: T1027
    if:
      type: hex
      section: .text
      pattern: '50 8B 44 24 04 83 C0 04 50 8B 44 24 04 C2 08 00'
