defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]

traits:
  - id: x86-saved-return-address-buffer-base
    desc: Saved return-address buffer-base fragment
    crit: component
    conf: 0.96
    if:
      type: hex
      section: text
      pattern: 'FF F6 FF F0 FF F1 8B 7C 24 10 E9 ?? ?? ?? ??'
  - id: x86-indirect-call-register-restore
    desc: Indirect-call register-restore fragment
    crit: component
    conf: 0.96
    if:
      type: hex
      section: text
      pattern: 'FF D7 8F C1 8F C0 8F C6 5F E9 ?? ?? ?? ??'

composite_rules:
  - id: x86-scattered-decoder-hidden-handoff
    desc: Scattered decoder with return-derived indirect handoff
    crit: suspicious
    conf: 0.98
    all:
      - id: x86-saved-return-address-buffer-base
      - id: x86-indirect-call-register-restore
      - id: objectives/anti-static/obfuscation/control-flow/poly::x86-scattered-add-sub-decoder
      - id: metadata/binary/section/permission::wx-section
