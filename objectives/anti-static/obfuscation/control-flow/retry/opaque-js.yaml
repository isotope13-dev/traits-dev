defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: opaque-predicate-constant-compare
  desc: Opaque predicate using string compare
  crit: suspicious
  conf: 0.88
  for: [javascript]
  not:
  - regex: debugMode\(\)\s*===\s*['"](inspector|console)['"]
  - regex: platform\(\)\s*===\s*['"](win|mac|linux|darwin|win32)['"]
  if:
    type: text
    substr: if\s*\(\s*([$_A-Za-z]\w{0,2}|_0x[0-9A-Fa-f]+)\(\)\s*===\s*["']
- id: opaque-predicate-literal-compare
  desc: Opaque predicate using literal compare
  crit: suspicious
  conf: 0.82
  for: [javascript]
  # The callee must carry an obfuscator-mangled name, as in the sibling
  # opaque-predicate rule above. `\w+\(\)\s*==\s*\d+` matched any zero-arg call
  # compared to an integer -- `if (getStatus() == 200)`, `if (init() == 0)`,
  # `if (f() == 1)` -- which is an ordinary conditional, not a predicate whose
  # outcome is pre-known to an obfuscator. It bit hardest on files MIS-TYPED as
  # javascript (Move sources and .decompiled round-trip artifacts here; the
  # libcxx/`variant`/`-*- C++ -*-` carve-outs below are the same story).
  if:
    type: text
    regex: 'if\s*\(\s*_0x[0-9a-fA-F]{4,}\(\)\s*==\s*\d+\s*\)'
  # `unless: metadata/lang/source/` used to sit here and pulled in
  # metadata/lang/source::js-ts-source-basename, which matches ANY *.js
  # basename -- so this javascript-only rule could never fire on a .js file. It
  # survived only on files MIS-TYPED as javascript, i.e. exactly the population
  # it false-positives on. Dropping it revives the detection; the tightened
  # `_0x` callee above keeps ordinary JavaScript out.
  unless:
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: well-known/tool/sysadmin/alpine-packages/source-artifact::alpine-libcxx-header
  - type: basename
    exact: variant
  - type: path
    regex: '(^|[\\/])variant$'
  - type: text
    substr: '// -*- C++ -*-'
- id: shift-push-rotator
  desc: Array shift push rotator
  crit: suspicious
  conf: 0.94
  for: [javascript]
  if:
    type: text
    substr: "['push'](q['shift']())"
composite_rules:
- id: retry-loop
  desc: Detects retry loop wrapping try-catch (probabilistic loader)
  crit: suspicious
  conf: 1.0
  attack: T1027
  mbc: B0032
  needs: 2
  any:
  - id: micro-behaviors/data/control-flow/loop::js-while-with-try
  - id: micro-behaviors/data/control-flow/loop::js-for-with-try
  - id: micro-behaviors/data/control-flow/loop::js-retry-loop-with-success-counter
  - id: opaque-predicate-constant-compare
  - id: opaque-predicate-literal-compare
  unless:
  - id: well-known/app/publishing/decocms::local-service-manager-context
  - id: metadata/file/profile/source-indications/
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: metadata/file/format/source-map::sourcemap-context
- id: dead-code-padding
  desc: Dead code padding with opaque branches
  crit: suspicious
  conf: 0.9
  for: [javascript]
  needs: 2
  any:
  - id: metadata/file/function::constant-return-functions-dense
  - id: opaque-predicate-constant-compare
  - id: opaque-predicate-literal-compare
  - id: micro-behaviors/data/control-flow/branch::js-short-var-numeric-switch
  # Minified/bundled JS (webpack, UMD, Gutenberg builds, vendored libs) naturally
  # produces constant-return functions, constant comparisons and switch dispatch
  # as a minification byproduct — not deliberate anti-static obfuscation.
  unless:
  - id: metadata/build/
- id: string-table-rotator-loop
  desc: Infinite string table rotation loop
  crit: suspicious
  conf: 0.96
  for: [javascript]
  all:
  - id: metadata/lang/javascript-features::js-obfuscator-while-loop
  - id: shift-push-rotator
