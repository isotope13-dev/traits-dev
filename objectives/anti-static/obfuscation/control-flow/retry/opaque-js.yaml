defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: retry-loop-while
  desc: "retry loop wrapping try-catch (while loop)"
  crit: component
  unless:
  - id: metadata/library/structure::js-webpack-bundle
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/build/bundler::babel-transpiled
  if:
    type: text
    regex: "(?s)while\\s*\\(([^()]|\\([^()]{0,120}\\))*\\)\\s*\\{[^}]{0,300}\\s*try\\s*\\{"
  not:
  - regex: "while\\s*\\(_\\)\\s*\\{\\s*try"
  - regex: "(?i)while\\s*\\([^)]*(time|date|now|timeout|attempt|retry|limit)[^)]*\\)"
- id: retry-loop-for
  desc: "retry loop wrapping try-catch (for loop)"
  crit: component
  size_max: 50000
  unless:
  - id: metadata/build/bundler::babel-transpiled
  - id: metadata/library/structure::js-webpack-bundle
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  if:
    type: text
    regex: "(?s)for\\s*\\(([^()]|\\([^()]{0,120}\\))*\\)\\s*\\{[^}]{0,300}\\s*try\\s*\\{"
  not:
  - regex: "for\\s*\\(\\s*;\\s*i\\s*<\\s*l;\\s*i\\+\\+\\)\\s*\\{\\s*try\\s*\\{"
  - regex: "for\\s*\\([^)]*\\)\\s*\\{[^}]*//[^}]*try\\s*\\{"
  - regex: "for\\s*\\(\\s*var\\s+\\w+\\s+in\\b"
  - regex: "for\\s*\\(\\s*(const|let|var)\\s+\\w+\\s+of\\b"
  - regex: "for\\s*\\(\\s*(const|let|var)\\s+\\w+\\s*="
  - regex: "(?s)for\\s*\\([^)]*\\)\\s*\\{[^}]{0,300}createSyncAccessHandle\\("
- id: const-return-padding-count
  desc: "Six / more no-arg constant-return helpers"
  crit: component
  conf: 0.82
  for: [javascript]
  # Count floor: parameterless functions whose body is a single `return <literal>`.
  if:
    type: metrics
    field: 'ast.const_return_function_count'
    min: 6
  unless:
  - id: metadata/file/profile/locale::i18n-locale-file
  - id: metadata/build/bundler::typescript-graphql-decorator-module
- id: const-return-padding-ratio
  desc: Constant-return helpers dominate the functions
  crit: component
  conf: 0.82
  for: [javascript]
  # Density floor: the fraction of all functions that are constant-return padding.
  # Opaque-padding obfuscation makes most functions this shape (~0.6+); a normal
  # large module (e.g. 7 of 21 functions = 0.33) stays well under the threshold.
  if:
    type: metrics
    field: 'ast.const_return_function_ratio'
    min: 0.5
  unless:
  - id: metadata/file/profile/locale::i18n-locale-file
  - id: metadata/build/bundler::typescript-graphql-decorator-module
- id: opaque-predicate-constant-compare
  desc: Opaque predicate using string compare
  crit: suspicious
  conf: 0.88
  for: [javascript]
  not:
  - regex: debugMode\(\)\s*===\s*['"](inspector|console)['"]
  - regex: platform\(\)\s*===\s*['"](win|mac|linux|darwin|win32)['"]
  if:
    type: text
    substr: if\s*\(\s*([$_A-Za-z]\w{0,2}|_0x[0-9A-Fa-f]+)\(\)\s*===\s*["']
- id: opaque-predicate-literal-compare
  desc: Opaque predicate using literal compare
  crit: suspicious
  conf: 0.82
  for: [javascript]
  # The callee must carry an obfuscator-mangled name, as in the sibling
  # opaque-predicate rule above. `\w+\(\)\s*==\s*\d+` matched any zero-arg call
  # compared to an integer -- `if (getStatus() == 200)`, `if (init() == 0)`,
  # `if (f() == 1)` -- which is an ordinary conditional, not a predicate whose
  # outcome is pre-known to an obfuscator. It bit hardest on files MIS-TYPED as
  # javascript (Move sources and .decompiled round-trip artifacts here; the
  # libcxx/`variant`/`-*- C++ -*-` carve-outs below are the same story).
  if:
    type: text
    regex: 'if\s*\(\s*_0x[0-9a-fA-F]{4,}\(\)\s*==\s*\d+\s*\)'
  # `unless: metadata/lang/source/` used to sit here and pulled in
  # metadata/lang/source::js-ts-source-basename, which matches ANY *.js
  # basename -- so this javascript-only rule could never fire on a .js file. It
  # survived only on files MIS-TYPED as javascript, i.e. exactly the population
  # it false-positives on. Dropping it revives the detection; the tightened
  # `_0x` callee above keeps ordinary JavaScript out.
  unless:
  - id: well-known/lib/runtime/php-runtime::source-tree
  - id: well-known/tool/sysadmin/alpine-packages::alpine-libcxx-header
  - type: basename
    exact: variant
  - type: path
    regex: '(^|[\\/])variant$'
  - type: text
    substr: '// -*- C++ -*-'
- id: switch-decoy-cases
  desc: Switch statement with decoy literal cases
  crit: component
  conf: 0.8
  for: [javascript]
  if:
    type: text
    regex: '(?s)switch\([_$a-z]\w{0,2}\)\s*\{.{0,48}case\s+\d+:.{0,48}case\s+\d+:.{0,48}case\s+\d+:'
  not:
  - substr: "switch(SortColumn)"
- id: shift-push-rotator
  desc: Array shift push rotator
  crit: suspicious
  conf: 0.94
  for: [javascript]
  if:
    type: text
    substr: "['push'](q['shift']())"
composite_rules:
- id: constant-return-padding-functions
  desc: Parameterless constant-return helper padding
  crit: notable
  conf: 0.82
  for: [javascript]
  # Tiny headers mis-typed as JS (libstdc++ includes) are not minified padding.
  size_min: 8192
  # Both a raw floor AND a density floor: many constant-return helpers that also
  # dominate the file. The ratio replaces the old size-scaling count-only gate
  # (`ast.const_return_function_count >= 6`), which fired on any large hand-written
  # module that happened to accumulate six such helpers.
  all:
  - id: const-return-padding-count
  - id: const-return-padding-ratio
  # Minifiers (terser/uglify) emit many parameterless constant-return helpers,
  # so this dilution signal fires on legitimately-minified library bundles.
  unless:
  - id: metadata/library/structure/
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/lib/ui/svg-edit::svg-edit-library-context
  - id: metadata/package/testing/presence/scripted::after-each-call
- id: retry-loop
  desc: Detects retry loop wrapping try-catch (probabilistic loader)
  crit: suspicious
  conf: 1.0
  attack: T1027
  mbc: B0032
  needs: 2
  any:
  - id: retry-loop-while
  - id: retry-loop-for
  - id: micro-behaviors/data/control-flow/loop::js-retry-loop-with-success-counter
  - id: opaque-predicate-constant-compare
  - id: opaque-predicate-literal-compare
  unless:
  - id: well-known/app/publishing/decocms::local-service-manager-context
  - id: metadata/lang/source/
  - id: well-known/lib/runtime/php-runtime::source-tree
  - id: metadata/file/format/structured::sourcemap-context
- id: dead-code-padding
  desc: Dead code padding with opaque branches
  crit: suspicious
  conf: 0.9
  for: [javascript]
  needs: 2
  any:
  - id: constant-return-padding-functions
  - id: opaque-predicate-constant-compare
  - id: opaque-predicate-literal-compare
  - id: switch-decoy-cases
  # Minified/bundled JS (webpack, UMD, Gutenberg builds, vendored libs) naturally
  # produces constant-return functions, constant comparisons and switch dispatch
  # as a minification byproduct — not deliberate anti-static obfuscation.
  unless:
  - id: metadata/library/structure/
- id: string-table-rotator-loop
  desc: Infinite string table rotation loop
  crit: suspicious
  conf: 0.96
  for: [javascript]
  all:
  - id: metadata/lang/javascript-features::js-obfuscator-while-loop
  - id: shift-push-rotator
