defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  # The literal predicate has a fixed outcome, but is not suspicious by
  # itself. Require an RC4 decoder and mangled decoder-call syntax as the
  # concealment context; no table key, variable, filename or endpoint is used.
  - id: js-rc4-literal-branch-padding
    desc: RC4 and mangled calls with constant branching
    crit: suspicious
    conf: 0.93
    attack: T1027
    all:
      - id: micro-behaviors/data/control-flow/branch::js-literal-string-if-comparison
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: objectives/anti-static/obfuscation/name-mangling/function-name::hex-named-hex-argument-call
