# ARM64 Obfuscation Patterns
# Detects low-level code patterns used for decryption and evasion on ARM64
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [macos, linux]
  for: [macho, elf]
  crit: suspicious
traits:
  # Raw hex patterns (internal - used by composite rules)
  - id: xor-ror-hex-pattern
    desc: "ARM64 XOR+ROR instruction sequence"
    crit: baseline
    conf: 0.5
    if:
      type: hex
      section: ".text"
      # Matches eor/strb/ror sequence often used in simple obfuscators
      # eor: ?? ?? ?? 4a
      # strb: ?? ?? ?? 39
      # ror: ?? ?? ?? 93
      pattern: "?? ?? ?? 4a ?? ?? ?? 39 ?? ?? ?? 93"
composite_rules:
  # ARM64 XOR+ROR decryption loop - only fires on ARM64 binaries
  - id: xor-ror-decryption-loop
    desc: "ARM64 XOR+ROR decryption loop"
    crit: suspicious
    conf: 0.9
    mbc: "B0032"
    all:
      - id: xor-ror-hex-pattern
    any:
      - id: metadata/arch/arm64
    unless:
      # Go's crypto/cipher, AES, and ChaCha20 implementations on ARM64 use
      # EOR+STRB+ROR sequences as part of normal crypto operations, not obfuscation.
      - id: metadata/binary/linking/runtime::cosmopolitan-marker
      - id: metadata/lang/compiler/systems/
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  # Repeated ARM64 svc instructions - only fires on ARM64 binaries
  - id: svc-instruction
    desc: "Repeated ARM64 svc instructions in executable code"
    crit: baseline
    conf: 0.4
    all:
      - id: micro-behaviors/os/syscall/invoke::svc-hex-pattern
    any:
      - id: metadata/arch/arm64
    unless:
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-platform-archive
      - id: well-known/lib/runtime/scripted/bun-runtime::unix-runtime-context
      - id: metadata/binary/section/name::bun-section-name
