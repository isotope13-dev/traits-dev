defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-eval-self-string
    desc: "Eval executing func with self-toString check"
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: eval\s*\(\s*["']\(function\s+\w+\([^)]{0,120}\)\s*\{.{0,200}\.toString\(\)
  - id: js-hex-then-octal-arithmetic
    desc: Repeated hexadecimal-to-octal arithmetic
    crit: component
    conf: 0.9
    count_min: 2
    per_kb_min: 0.1
    not:
      - substr: "0x0-0xFFFFFFFF"
      - substr: "ENTRY(Reset_Handler)"
      - substr: "SECTIONS"
      - substr: "OUTPUT_ARCH("
      - substr: "OUTPUT_FORMAT("
      - substr: "MEMORY"
      - substr: "ORIGIN("
      - substr: "LENGTH("
      - substr: "ORIGIN ="
      - regex: '0xa000\s*\|\s*0o777'
    if:
      type: text
      regex: '0[xX][0-9a-fA-F]+\s*[-+*/&|^%]\s*0[oO][0-7]+'
  - id: js-octal-then-hex-arithmetic
    desc: Repeated octal-to-hexadecimal arithmetic
    crit: component
    conf: 0.9
    count_min: 2
    per_kb_min: 0.1
    not:
      - substr: "0x0-0xFFFFFFFF"
      - substr: "ENTRY(Reset_Handler)"
      - substr: "SECTIONS"
      - substr: "OUTPUT_ARCH("
      - substr: "OUTPUT_FORMAT("
      - substr: "MEMORY"
      - substr: "ORIGIN("
      - substr: "LENGTH("
      - substr: "ORIGIN ="
      - regex: '0xa000\s*\|\s*0o777'
    if:
      type: text
      regex: '0[oO][0-7]+\s*[-+*/&|^%]\s*0[xX][0-9a-fA-F]+'
  - id: js-array-rotation-obfuscation
    desc: JavaScript array rotation obfuscation
    crit: suspicious
    conf: 0.94
    for: [oledoc, ooxml]
    count_min: 2
    if:
      type: text
      regex: while\(!!\[\]\)\{try\{const \w+=-parseInt\(

composite_rules:
  - id: js-mixed-hex-octal-math
    desc: Repeated mixed-base arithmetic obfuscation
    crit: suspicious
    conf: 0.95
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
    any:
      - id: js-hex-then-octal-arithmetic
      - id: js-octal-then-hex-arithmetic
  - id: js-complex-obfuscation
    desc: Complex JavaScript obfuscation (hex/octal math + eval)
    crit: notable
    conf: 0.95
    attack: T1027
    all:
      - id: js-mixed-hex-octal-math
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  - id: js-tamper-checked-eval-unpacker
    desc: Tamper checked JavaScript eval unpacker
    crit: notable
    conf: 0.98
    attack: T1027
    all:
      - id: js-complex-obfuscation
      - id: objectives/anti-analysis/anti-tampering/integrity::function-tostring-integrity
      - id: objectives/anti-analysis/anti-tampering/integrity::tamper-detection-message
  - id: js-xor-eval-unpacker-chain
    desc: XOR decoded JavaScript eval unpacker
    crit: hostile
    conf: 0.97
    attack: T1027
    all:
      - id: js-complex-obfuscation
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
      - id: objectives/execution/interpreter/eval/dynamic::eval-variable
  - id: js-platform-gated-junk-loop
    desc: Platform-gated cluster of large-bound loops
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-type-query-cluster
      - id: micro-behaviors/data/control-flow/loop::js-large-bound-loop-cluster
    unless:
      - id: metadata/library/generated::laya-engine-runtime-marker
