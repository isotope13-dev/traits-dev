defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-array-rotation-obfuscation
    desc: JavaScript array rotation obfuscation
    crit: suspicious
    conf: 0.94
    for: [oledoc, ooxml]
    count_min: 2
    if:
      type: text
      regex: while\(!!\[\]\)\{try\{const \w+=-parseInt\(

composite_rules:
  - id: js-complex-obfuscation
    desc: Complex JavaScript obfuscation (hex/octal math + eval)
    crit: notable
    conf: 0.95
    attack: T1027
    all:
      - id: metadata/lang/source/syntax/operator::js-mixed-hex-octal-math
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  # Character-code XOR also occurs in hashes. Proximity to eval proves
  # neither string reconstruction nor a decoder-to-evaluator relationship.
  # Keep both capabilities in their neutral homes; XOR reconstruction with
  # eval is covered by encoding/xor::character-xor-eval.
  - id: js-tamper-checked-eval-unpacker
    desc: Tamper checked JavaScript eval unpacker
    crit: notable
    conf: 0.98
    attack: T1027
    all:
      - id: js-complex-obfuscation
      - id: objectives/anti-analysis/anti-tampering::function-tostring-integrity
      - id: objectives/anti-analysis/anti-tampering::tamper-detection-message
  - id: js-xor-eval-unpacker-chain
    desc: XOR decoded JavaScript eval unpacker
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: js-complex-obfuscation
      - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
      - id: micro-behaviors/metaprogramming/generation/function::embedded-eval-variable-source
  - id: js-platform-gated-junk-loop
    desc: Platform-gated cluster of large-bound loops
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-type-query-cluster
      - id: micro-behaviors/data/control-flow/loop/counted::js-large-bound-loop-cluster
    unless:
      - id: metadata/build/generated::laya-engine-runtime-marker
