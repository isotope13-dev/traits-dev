defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # These names and call fragments are local evidence for chr construction;
  # they do not independently establish obfuscation or reflection.
  - id: oct-name
    desc: "oct.__str__ reference"
    if: {type: text, regex: "\\boct\\.__str__"}
  - id: hex-name
    desc: "hex.__str__ reference"
    if: {type: text, regex: "\\bhex\\.__str__"}
  # === GuardDog: chr() join patterns ===
  - id: join-chr-generator
    desc: "''.join(chr(x) for x in ...) pattern"
    mbc: E1014
    attack: T1027
    crit: suspicious
    conf: 0.95
    if:
      # Restored arg discriminator dropped in the call migration.
      type: symbol
      kind: call
      exact: 'chr'
      arg:
        kind: string
        exact: 'join'
  - id: join-chr-int-transform
    desc: "''.join(chr(int(x) +/- n) pattern"
    mbc: E1014
    attack: T1027
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "join\\(\\[chr\\(int\\(\\w+\\) [-+^] \\d+\\) for \\w+ in"
  - id: join-chr-xor-transform
    desc: Joins chr of XOR-decoded integers
    mbc: E1014
    attack: T1027
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'join\(\[chr\(\w+\s*\^\s*\w+\)\s*for\s+\w+\s+in'
  # Local component evidence for chr-builtin string construction.
  - id: copyright-builtin-reference
    desc: References Python copyright builtin
    crit: component
    conf: 0.8
    if:
      type: text
      # Do not treat package metadata names such as __copyright__ as the
      # interactive copyright builtin.  The token must not touch underscores.
      #
      # The bare word also appears in every MIT/BSD header ("the above
      # copyright notice"), which made this fire on the licence banner of
      # ordinary source. The obfuscation trick this atom exists for always
      # USES the object — `copyright.__str__()[...]` — so require the token to
      # be followed by an attribute, subscript or call.
      regex: '(^|[^\w])copyright\s*[.\[(]'
  # This ordinary dunder call is only component evidence for the chr
  # obfuscation composites below; it is not a standalone reflection signal.
  - id: dunder-str-call
    desc: Explicit .__str__() dunder invocation
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ".__str__()"
composite_rules:
  - id: large-int-array-assign
    desc: Large integer array chr decode
    mbc: E1014
    attack: T1027
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/literal::python-large-numeric-array-literal
    any:
      - id: join-chr-int-transform
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    unless:
      - id: metadata/package/files/dependency::ruby-vendor-bundle-gem-path
      - id: metadata/build/pip::python-packaging-vendored-source
      - id: metadata/build/pip::python-packaging-tool-tests
      - id: well-known/tool/offensive/sqlmap::source-tree-member
      - id: metadata/build/generated/
      - id: metadata/package/testing/presence/path::tests-path-basename
  - id: python-chr-oct-str
    desc: "oct.__str__ used in chr obfuscation"
    crit: suspicious
    all:
      - id: oct-name
      - id: dunder-str-call
  - id: python-chr-hex-str
    desc: "hex.__str__ used in chr obfuscation"
    crit: suspicious
    all:
      - id: hex-name
      - id: dunder-str-call
  - id: python-chr-copyright-str
    desc: "Python chr obfuscation using copyright.__str__"
    crit: suspicious
    all:
      - id: copyright-builtin-reference
      - id: dunder-str-call
      - id: micro-behaviors/data/string/conversion::python-chr-call
    near_bytes: 256
  - id: python-chr-bitwise-construction
    desc: "Python chr construction using oct/hex/copyright strings"
    crit: suspicious
    conf: 0.95
    mbc: E1014
    attack: T1027
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::getattr-builtins-lookup
      - id: python-chr-oct-str
      - id: python-chr-hex-str
      - id: python-chr-copyright-str
  - id: python-chr-arithmetic-loader
    desc: Python chr arithmetic payload loader
    crit: suspicious
    conf: 0.97
    mbc: E1014
    attack: T1027
    all:
      - id: large-int-array-assign
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    any:
      - id: join-chr-int-transform
      - id: join-chr-xor-transform
      - id: micro-behaviors/data/string/conversion::python-join-map-chr
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
