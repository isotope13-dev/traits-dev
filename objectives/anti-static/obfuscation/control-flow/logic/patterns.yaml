defaults:
  platforms: [windows, unix]
  for: [python]
  crit: suspicious
  attack: T1027

traits:
  - id: direct-base64-exec
    desc: Direct Python base64 decode passed to exec
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'exec\s*\(\s*(base64\.)?b64decode\s*\('
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: imported-base64-exec
    desc: Python imported base64 decode passed to exec
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'exec\s*\(\s*__import__\(\s*[''\"]base64[''\"]\s*\)\.b64decode\s*\('
    unless:
      - id: well-known/tool/development/ide-contexts::cython-notebook-kernel-source-context

composite_rules:
  - id: b64decode-exec
    desc: Python base64 decode followed by exec
    crit: suspicious
    conf: 0.9
    any:
      - id: direct-base64-exec
      - id: imported-base64-exec
    unless:
      - id: well-known/lib/core/omdev::omdev-library
      - id: well-known/lib/network/ftl2::remote-module-gate
      - id: well-known/app/ai/animica::studio-wrapper-context
      - id: well-known/app/browser/ungoogled-chromium::ungoogled-chromium-patch-validator
      - id: metadata/lang/embedded::python
      - id: well-known/lib/core/jumpboot::secondary-bootstrap-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/development/ide-contexts::cython-notebook-kernel-source-context
