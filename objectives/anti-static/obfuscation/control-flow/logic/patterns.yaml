defaults:
  platforms: [windows, unix]
  for: [python]
  crit: suspicious
  attack: T1027

traits:
  - id: b64decode-variable-argument
    desc: b64decode argument is an interpolated variable
    crit: notable
    conf: 0.9
    for: [shell, powershell]
    if:
      type: text
      regex: 'b64decode\(\s*[''"]?\$\{?\w+'

  # Text fallback for the two AST traits here. tree-sitter does not parse a
  # line past its size limit, and these stagers put a multi-megabyte base64
  # blob on the same line as the `exec(` -- so the call node never forms and
  # the AST matchers miss the very packages that hide the most. A plain-text
  # match survives the oversized line.
  - id: base64-exec-text
    desc: Standalone exec decodes a long Base64 literal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*exec[ \t]*\([ \t]*(base64\.)?b64decode[ \t]*\(["'']{1,3}[A-Za-z0-9_+/=-]{256,}'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/detection/security-scanner::skilltotal-scanner-module-path
      - id: well-known/tool/detection/security-scanner::skilltotal-package-import-marker
      - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context

  - id: imported-base64-exec
    desc: Python imported base64 decode passed to exec
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      kind: call
      regex: '^exec\s*\(\s*__import__\(\s*[''\"]base64[''\"]\s*\)\.b64decode\s*\('
    unless:
      - id: well-known/tool/development/ide-contexts::cython-notebook-kernel-source-context
      - id: sshpilot-flatpak-agent-context

  - id: exec-gzip-base64-source
    desc: Python evaluates gzip-decompressed Base64 source
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      kind: call
      regex: '^exec\s*\(\s*gzip\.decompress\s*\(\s*(base64\.)?b64decode\s*\('

composite_rules:
  - id: b64decode-exec
    desc: Python base64 decode followed by exec
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::python-exec-base64-result
      - id: imported-base64-exec
    unless:
      - id: objectives/anti-static/obfuscation/control-flow/logic::python-base64-runtime-wrappers
      - id: metadata/package/testing/presence/harness::verified-python-test-file
      - id: well-known/app/browser/ungoogled-chromium::ungoogled-chromium-patch-validator
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/detection/agent-glovebox::staticscan-reverse-shell-fixture-context
      - id: well-known/tool/development/ide-contexts::cython-notebook-kernel-source-context
      - id: sshpilot-flatpak-agent-context
      # A vitest file quotes the python specimen to assert a detector.
      - id: metadata/package/testing/harness/unit::vitest-import
      - id: metadata/package/testing/harness/unit::node-test-runner-import

  # SSHPilot uses this decode/exec shape to bridge its Flatpak UI to the
  # host-side agent. Keep the atomic behavior meaningful elsewhere, but do
  # not treat the identified, scoped application wrapper as obfuscation.
  - id: sshpilot-flatpak-agent-context
    desc: SSHPilot Flatpak agent wrapper
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/communication/sshpilot::python-module
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option

  - id: python-base64-runtime-wrappers

    desc: Recognized Python decode-and-execute runtime wrappers
    crit: exception
    conf: 0.99
    any:
    - id: well-known/lib/vendor-sdk/omdev::omdev-library
    - id: well-known/lib/network/ftl2::remote-module-gate
    - id: well-known/app/ai/knowledge/animica::studio-wrapper-context
    - id: well-known/lib/vendor-sdk/jumpboot::secondary-bootstrap-context
