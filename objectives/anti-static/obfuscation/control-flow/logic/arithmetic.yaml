defaults:
  platforms: [linux, macos, windows]
traits:
  - id: arm64-sdiv-decoding-loop
    desc: "ARM64 sdiv/eor arithmetic sequence"
    crit: suspicious
    conf: 0.9
    for: [macho, elf]
    if:
      type: hex
      section: ".text"
      # Matches the core arithmetic of the Kito loop:
      # sub w16, w17, w16 (30 02 10 4b)
      # sdiv w15, w16, w15 (0f 0e cf 1a)
      # eor w15, w16, w15 (0f 02 0f 4a)
      pattern: "30 02 10 4b [0-16] 0f 0e cf 1a [0-16] 0f 02 0f 4a"
composite_rules:
  - id: arithmetic-obfuscated-system-directory-launch
    desc: Arithmetic-obfuscated mutex-gated system-directory launch
    crit: hostile
    conf: 0.92
    attack: T1027
    all:
      - id: metadata/binary/instruction::dense-x86-mul-instructions
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/process/sync/mutex::open-mutex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/installer/family/
