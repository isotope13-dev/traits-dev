defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
- id: overlay-at-least-half
  desc: Binary overlay is at least 50%
  crit: notable
  conf: 0.9
  if:
    type: metrics
    field: binary.overlay_ratio
    min: 0.5
composite_rules:
- id: bloated-low-density-malware
  desc: Bloated binary with sparse logic and evasion
  crit: notable
  conf: 0.9
  all:
  - id: metadata/binary/metrics/structural::sparse-logic-large-binary
  any:
  - id: metadata/binary/instruction::cpuid-instr
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
  unless:
  - id: metadata/lang/compiler/aot::huge-runtime-function-count
  # Downgrade removed: this rule was `suspicious` when the block was written, where a
  # downgrade landed on `notable` and meant "known-good software, de-emphasize". The rule
  # is `notable` now, so the same block lands on `baseline` — a claim that nearly every
  # program does this, which is false for a behavior this specific.