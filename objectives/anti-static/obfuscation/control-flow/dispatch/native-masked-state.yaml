defaults:
  platforms: [macos]
  for: [macho]
  crit: suspicious
  conf: 0.97
  attack: T1027
traits:
  - id: masked-arithmetic-dispatch-state
    desc: Repeated masked control-flow state updates
    if:
      type: yara
      # Scan instruction bytes in every slice. The normal Mach-O report's
      # section table can describe only its preferred architecture.
      source: |
        rule lcg_xor_dispatch_states {
          strings:
            $state = { (69 ?? [1-4] 0D 66 19 00 81 C? 5F F3 6E 3C 89 ?? [1-4] 33 ?? [1-4] 89 ?? [1-4] E9 | E9 ?? 40 B9 29 ?? ?? 1B E9 ?? 00 B9 E9 ?? 40 B9 28 01 08 4A E8 ?? 00 B9 ?? ?? ?? 17 | 69 C? 0D 66 19 00 81 C? 5F F3 6E 3C 89 ?? 24 [0-4] 8B ?? 24 [0-4] 31 ?? 89 ?? 24 | 69 C? 0D 66 19 00 05 5F F3 6E 3C 89 ?? 24 [0-4] 8B ?? 24 [0-4] 31 ?? 89 ?? 24 | (69 | 45 69) ?? 0D 66 19 00 (81 C? | 05 | 41 81 C?) 5F F3 6E 3C (89 | 44 89) ?? ?? (8B | 44 8B) ?? ?? (31 | 41 31 | 44 31 | 45 31) ?? (89 | 44 89) ?? ??) }
          condition:
            #state >= 5
        }
