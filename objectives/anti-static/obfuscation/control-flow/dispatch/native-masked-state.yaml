defaults:
  platforms: [macos]
  for: [macho]
  crit: suspicious
  conf: 0.97
  attack: T1027
traits:
  - id: masked-arithmetic-dispatch-state
    desc: Repeated masked control-flow state updates
    unless:
      # The mbed TLS self-test generator is a fixed LCG used to build test
      # vectors, not a dispatch loop. Its test-function symbols identify it.
      - id: well-known/lib/crypto/mbedtls::mbedtls-self-test-symbol
      # A recognized ad hoc BASS runtime carries a byte run in its codec data
      # that matches this LCG shape. The identity clears it.
      - id: well-known/lib/media/bass::bass-macho-known-library-context
      # Shipped Skia (napi-rs canvas) addons carry Skia's SkRandom LCG
      # constants, which match the same instruction bytes.
      - id: well-known/lib/media/skia::node-canvas-skia-exception
      # Microsoft's SkiaSharp native build carries the same SkRandom constants.
      - id: well-known/lib/media/skia::skiasharp-native-library
      # The official Node.js executable (V8/OpenSSL/ICU) embeds the same
      # generic LCG arithmetic; its Foundation signer and embedder entry
      # points together identify it.
      - id: well-known/lib/runtime/scripted/nodejs-runtime::nodejs-official-macho-runtime
    if:
      type: yara
      # Scan instruction bytes in every slice. The normal Mach-O report's
      # section table can describe only its preferred architecture.
      source: |
        rule lcg_xor_dispatch_states {
          strings:
            $state = { (69 ?? [1-4] 0D 66 19 00 81 C? 5F F3 6E 3C 89 ?? [1-4] 33 ?? [1-4] 89 ?? [1-4] E9 | E9 ?? 40 B9 29 ?? ?? 1B E9 ?? 00 B9 E9 ?? 40 B9 28 01 08 4A E8 ?? 00 B9 ?? ?? ?? 17 | 69 C? 0D 66 19 00 81 C? 5F F3 6E 3C 89 ?? 24 [0-4] 8B ?? 24 [0-4] 31 ?? 89 ?? 24 | 69 C? 0D 66 19 00 05 5F F3 6E 3C 89 ?? 24 [0-4] 8B ?? 24 [0-4] 31 ?? 89 ?? 24 | (69 | 45 69) ?? 0D 66 19 00 (81 C? | 05 | 41 81 C?) 5F F3 6E 3C (89 | 44 89) ?? ?? (8B | 44 8B) ?? ?? (31 | 41 31 | 44 31 | 45 31) ?? (89 | 44 89) ?? ??) }
            // arm64 slices load the LCG multiplier (0x19660d) and increment
            // (0x3c6ef35f) once each: a movz/movk for the low half, then a
            // movk for the high half, reused in register-only madd updates.
            // A lone movk #0x19 or #0x3c6e is common in table compares, so
            // each leg requires both halves within a few bytes.
            $arm64_mul = { (A? | B?) C1 8C (52 | 72) [0-8] (2? | 3?) 03 A0 72 }
            $arm64_inc = { (E? | F?) 6B 9E (52 | 72) [0-8] (C? | D?) 8D A7 72 }
          condition:
            #state >= 5 or ($arm64_mul and $arm64_inc)
        }
