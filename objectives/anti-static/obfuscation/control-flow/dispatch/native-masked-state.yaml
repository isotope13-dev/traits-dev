defaults:
  platforms: [macos]
  for: [macho]
  crit: suspicious
  conf: 0.97
  attack: T1027
traits:
  - id: masked-arithmetic-dispatch-state
    desc: Repeated masked control-flow state updates
    count_min: 5
    if:
      type: hex
      section: __text
      # Advance an LCG, save it, XOR the next dispatcher state with that
      # saved value, then branch back. This is not a bare PRNG constant.
      pattern: '(69 ?? [1-4] 0D 66 19 00 81 C? 5F F3 6E 3C 89 ?? [1-4] 33 ?? [1-4] 89 ?? [1-4] E9 | E9 ?? 40 B9 29 ?? ?? 1B E9 ?? 00 B9 E9 ?? 40 B9 28 01 08 4A E8 ?? 00 B9 ?? ?? ?? 17)'
