defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: xor-bytecode-register-api-dispatch
    desc: XOR bytecode dispatches register-table calls
    crit: suspicious
    conf: 0.99
    attack: T1027
    if:
      type: hex
      section: .text
      # Decode an opcode; nibble-indexed virtual registers supply arguments
      # to a function table. The result returns to a virtual register.
      pattern: >-
        42 8A 14 38 80 F2 ?? 41 FF C0 [0-192]
        83 E2 0F 48 8B 45 ?? 83 E1 0F
        48 8B 54 D4 20 48 8B 4C CC 20 42 FF 14 D0
        83 E3 0F 48 89 44 DC 20
