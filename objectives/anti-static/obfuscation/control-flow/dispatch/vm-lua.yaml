# Lua control-flow obfuscation
# Covers VM dispatch loops and arithmetic-based control-flow flattening
# common in IronBrew, Luraph, and custom Lua obfuscators.
defaults:
  platforms: [windows, unix]
  for: [lua]
  crit: notable
  conf: 0.85
  attack: T1027
  mbc: B0032
traits:
  - id: lua-state-machine-comparisons
    desc: Lua state-machine comparison cluster
    crit: suspicious
    conf: 0.9
    for: [lua, text]
    size_min: 50000
    # One large threshold is common in gameplay code (for example, a score
    # or distance guard).  Flattened dispatch uses many such state tests.
    count_min: 40
    if:
      type: text
      # Require Lua `then`; Python ternary `if rate > 50000 else` is not VM flattening.
      regex: '\b[A-Za-z_]\w*\s*[<>]=?\s*-?\d{5,}\s+then\b'

composite_rules:
  - id: lua-obfuscated-conditional-dispatch
    desc: Lua conditional dispatch with obfuscated arithmetic
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/data/control-flow/loop/conditional::lua-while-if-conditional-loop
      - id: metadata/lang/source/syntax/conditional::lua-many-numeric-comparisons
      - id: lua-state-machine-comparisons
    all:
      - id: micro-behaviors/data/arithmetic::lua-large-constant-arithmetic
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path
