defaults:
  platforms:
    - unix
    - windows
  for:
    - php
  mbc: B0032
  attack: T1027.010,T1027
traits:
  - id: php-goto-jump
    desc: Repeated PHP goto jump statements
    crit: notable
    conf: 0.85
    count_min: 30
    if:
      type: text
      regex: '(?i)\bgoto\s+[A-Za-z0-9_]+;'
composite_rules:
  - id: php-flattened-goto-obfuscated-script
    desc: PHP control flow flattened via dense goto jumps
    crit: hostile
    conf: 0.98
    all:
      - id: php-goto-jump
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
    any:
      - id: objectives/anti-static/obfuscation/string/array::php-heavy-hex-escape-density
      - id: metadata/lang/encoding/unicode-escape::unicode-escape-dense-php-byte-escapes
