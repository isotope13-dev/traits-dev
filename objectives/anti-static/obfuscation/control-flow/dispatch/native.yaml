defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0032

traits:

  - id: sparse-opaque-pe-profile-imports
    desc: Large PE with twenty or fewer imports
    crit: component
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: imports.count
      max: 20

  - id: sparse-opaque-pe-profile-strings
    desc: Large PE with few strings
    crit: component
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.string_count
      max: 100

  - id: sparse-opaque-pe-profile-max-string
    desc: Large PE with short maximum string
    crit: component
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.max_string_length
      max: 40

  - id: sparse-opaque-pe-profile-code
    desc: Large PE with elevated code entropy
    crit: component
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.code_entropy
      min: 5.5

composite_rules:
  - id: teb-gated-stack-dispatch-obfuscation
    desc: Opaque TEB arithmetic gates repeated stack-resident dispatch
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1497
    all:
      - id: micro-behaviors/data/control-flow/dispatch::repeated-stack-table-indirect-calls-x64
      - id: micro-behaviors/data/control-flow/dispatch::opaque-teb-pointer-add-x64
      - id: metadata/binary/metrics/structural::pe-near-total-code-data
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: sparse-opaque-pe-profile
    desc: Large PE with sparse strings and imports
    crit: component
    conf: 0.9
    size_min: 5242880
    all:
      - id: sparse-opaque-pe-profile-imports
      - id: sparse-opaque-pe-profile-strings
      - id: sparse-opaque-pe-profile-max-string
      - id: sparse-opaque-pe-profile-code

  - id: opaque-indexed-dispatch-loader
    desc: Sparse PE with opaque indexed dispatch loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/control-flow/dispatch::indexed-function-table-indirect-call-x64
      - id: micro-behaviors/data/control-flow/dispatch::x64-multiply-rotate-sequence
      - id: sparse-opaque-pe-profile
      - id: objectives/anti-static/obfuscation/payload/section::encrypted-loader-data-geometry-cond-1--inline-29194
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/

  - id: opaque-dispatch-environment-probe
    desc: Opaque dispatch combined with drive enumeration
    crit: hostile
    conf: 0.97
    attack: T1027,T1497
    all:
      - id: micro-behaviors/data/control-flow/dispatch::indexed-function-table-indirect-call-x64
      - id: micro-behaviors/data/control-flow/dispatch::x64-multiply-rotate-sequence
      - id: sparse-opaque-pe-profile
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/

  - id: native-junked-control-flow-stage
    desc: Native PE self-loop dispatch stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1140
    all:
      - id: objectives/anti-static/obfuscation/instruction/junk::native-self-loop-junk
      - id: metadata/binary/metrics/structural::pe-near-total-code-data
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      # Guarded self-branches and TLS callbacks are normal in GNU-family PE
      # runtimes and libraries; they do not establish opaque dispatch.
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe

  - id: tls-keyed-computed-jump-obfuscation
    desc: TLS-resident state keys repeated computed jump targets
    crit: hostile
    conf: 0.99
    attack: T1027.002
    all:
      - id: micro-behaviors/data/control-flow/dispatch::rip-relative-opaque-jump-x64
      - id: micro-behaviors/data/control-flow/dispatch::dense-x64-tls-array-access
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
