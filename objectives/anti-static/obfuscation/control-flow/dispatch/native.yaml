defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0032

traits:

  - id: sparse-opaque-pe-profile-strings
    desc: Large PE with few strings
    crit: notable
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.string_count
      max: 100

  - id: sparse-opaque-pe-profile-max-string
    desc: Large PE with short maximum string
    crit: notable
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.max_string_length
      max: 40

  # The gated-loader dispatch shape: once the COM probe passes, execution
  # enters a compact dispatch loop that walks a table of relative handler
  # offsets (call through a fixed image-relative base, advance one entry,
  # loop) instead of any ordinary function graph. The loop's handler base is
  # wildcarded so other builds of the same obfuscator match with a different
  # base; the surrounding encodings stay required.
  - id: relative-handler-dispatch-loop
    desc: Relative handler-table dispatch loop
    crit: component
    conf: 0.9
    if:
      type: hex
      section: any
      pattern: '53 8B 0B 81 C1 ?? ?? ?? ?? FF D1 5B 83 C3 04 EB'


composite_rules:
  - id: teb-gated-stack-dispatch-obfuscation
    desc: Opaque TEB arithmetic gates repeated stack-resident dispatch
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1497
    all:
      - id: micro-behaviors/data/control-flow/dispatch::repeated-stack-table-indirect-calls-x64
      - id: micro-behaviors/data/arithmetic::x64-teb-pointer-add
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: sparse-opaque-pe-profile
    desc: Large PE with sparse strings and imports
    crit: component
    conf: 0.9
    size_min: 5242880
    all:
      - id: metadata/binary/symbols/count::large-pe-at-most-20-imports
      - id: sparse-opaque-pe-profile-strings
      - id: sparse-opaque-pe-profile-max-string
      - id: metadata/binary/code/entropy::large-pe-code-entropy-over-5-5

  - id: opaque-indexed-dispatch-loader
    desc: Sparse PE with opaque indexed dispatch loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/control-flow/dispatch::indexed-function-table-indirect-call-x64
      - id: micro-behaviors/data/arithmetic::x64-multiply-rotate-sequence
      - id: sparse-opaque-pe-profile
      - id: metadata/binary/section/ratio::data-section-1p5x-code
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/

  - id: opaque-dispatch-environment-probe
    desc: Opaque dispatch combined with drive enumeration
    crit: hostile
    conf: 0.97
    attack: T1027,T1497
    all:
      - id: micro-behaviors/data/control-flow/dispatch::indexed-function-table-indirect-call-x64
      - id: micro-behaviors/data/arithmetic::x64-multiply-rotate-sequence
      - id: sparse-opaque-pe-profile
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/

  - id: native-junked-control-flow-stage
    desc: Native PE self-loop dispatch stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1140
    all:
      - id: objectives/anti-static/obfuscation/instruction/junk::native-self-loop-junk
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      # Guarded self-branches and TLS callbacks are normal in GNU-family PE
      # runtimes and libraries; they do not establish opaque dispatch.
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe

  - id: tls-keyed-computed-jump-obfuscation
    desc: TLS-resident state keys repeated computed jump targets
    crit: hostile
    conf: 0.99
    attack: T1027.002
    all:
      - id: micro-behaviors/data/control-flow/dispatch::rip-relative-opaque-jump-x64
      - id: micro-behaviors/process/thread/config::dense-x64-tls-array-access
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: com-gated-handler-table-loader
    desc: COM-gated loader dispatches a handler-table stage
    # The dispatcher alone is an obfuscation shape; the COM probe legs bind
    # it to the emulator-gated loader family that hides its stage walk
    # behind CoInitializeEx state and a script-engine class-factory lookup.
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1027.007,T1620
    all:
      - id: relative-handler-dispatch-loop
      - id: micro-behaviors/os/com/class-factory::vbscript-engine-clsid-binary
      - id: micro-behaviors/os/com/class-factory::cogetclassobject-name-string
    any:
      - id: micro-behaviors/os/com/runtime::coinitialize-twice-sok-sfalse-check-x86
      - id: micro-behaviors/os/com/runtime::coinitialize-twice-sok-sfalse-check-upx0
