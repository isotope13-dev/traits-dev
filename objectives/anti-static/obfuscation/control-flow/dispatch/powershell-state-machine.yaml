# Control-flow flattening for PowerShell: the whole program becomes one
# loop over a state variable, with each original statement placed in a
# numbered switch arm that sets the next state. Hand-written scripts do not
# take this shape; obfuscators do.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.010
traits:
  - id: powershell-state-variable-switch-loop
    desc: PowerShell state-variable switch dispatcher loop
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'while \(\$\w+ -ne -1\)\{switch \(\$\w+\)\{[0-9]+\{'
