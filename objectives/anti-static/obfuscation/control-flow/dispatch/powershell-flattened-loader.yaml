defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.010,T1027.009
composite_rules:
  - id: powershell-flattened-blob-loader
    desc: Flattened PowerShell with string edits and an embedded blob
    crit: hostile
    conf: 0.9
    all:
      - id: powershell-state-variable-switch-loop
      - id: objectives/anti-static/obfuscation/string/reconstruct::powershell-insert-remove-string-chain
      - id: objectives/anti-static/obfuscation/string/array::powershell-decimal-byte-array-blob
