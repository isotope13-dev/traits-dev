defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: suspicious
  conf: 0.97
  attack: T1027
traits:
  - id: tls-state-relative-table-flattening
    desc: Repeated TLS reads and relative-table jumps
    count_min: 5
    if:
      type: hex
      section: .text
      # Thread-local state is loaded before selecting a signed relative
      # branch-table target. Repetition and bounded proximity distinguish
      # this concealment from an ordinary switch or one TLS variable read.
      pattern: '65 (48|4C) 8B ?? 25 58 00 00 00 [0-256] (48|4C) 0F 44 ?? (48|4C) 63 ?? (48|4C) (01|03) ?? (FF E? | 41 FF E?)'
