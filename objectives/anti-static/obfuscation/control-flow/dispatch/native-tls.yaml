defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: suspicious
  conf: 0.97
  attack: T1027
traits:
  - id: tls-state-relative-table-flattening
    desc: TLS reads near repeated pointer-selected jumps
    count_min: 5
    if:
      type: hex
      section: .text
      # Require a non-indexed pointer dereference after CMOV, as in the
      # relative-pointer dispatcher. Rust/LLVM enum switches clamp an integer
      # tag and use a SIB-indexed load; nearby TLS allocation counters do not
      # turn those switches into flattening. The ModRM alternatives require
      # mod=00 and exclude SIB and RIP-relative operands. Proximity does not
      # establish that TLS data supplies the branch condition.
      pattern: >-
        65 (48|4C) 8B ?? 25 58 00 00 00 [0-256]
        (48|4C) 0F 4? ?? (48|4C) 63
        (00|01|02|03|06|07|08|09|0A|0B|0E|0F|10|11|12|13|16|17|18|19|1A|1B|1E|1F|20|21|22|23|26|27|28|29|2A|2B|2E|2F|30|31|32|33|36|37|38|39|3A|3B|3E|3F)
        [0-8] (48|4C|4D) (01|03) ?? (FF E? | 41 FF E?)
