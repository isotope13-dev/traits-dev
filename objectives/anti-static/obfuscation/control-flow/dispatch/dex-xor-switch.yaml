defaults:
  platforms: [android]
  for: [dex]

traits:
  # A long, repeated constant-XOR dispatch transform obstructs recovery of
  # control flow even when the state strings use a different alphabet.
  # invoke-virtual + move-result; repeated const/16, xor-int/2addr,
  # xor-int/lit16; const + two XORs; sparse-switch. Indexes, registers
  # and constants vary. A single ordinary hashed switch does not qualify.
  # In the recovered APK this dispatch hashes annotation-only state strings.
  - id: dex-repeated-xor-switch-dispatch
    desc: Repeated DEX XOR-mixed switch dispatch
    crit: suspicious
    conf: 0.96
    attack: T1027
    count_min: 20
    if:
      type: hex
      offset_range: [112, null]
      pattern: '6E 10 ?? ?? ?? 00 0A ?? 13 ?? ?? ?? B7 ?? D7 ?? ?? ?? 13 ?? ?? ?? B7 ?? D7 ?? ?? ?? 13 ?? ?? ?? B7 ?? D7 ?? ?? ?? 13 ?? ?? ?? 14 ?? ?? ?? ?? ?? B7 ?? B7 ?? 2C ??'
    unless:
      - id: metadata/binary/symbols/count::dex-zero-class-definitions
