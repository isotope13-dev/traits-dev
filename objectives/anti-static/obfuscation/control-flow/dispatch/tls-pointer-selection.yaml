defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: tls-dense-pointer-dispatch
    desc: Dense TLS access accompanies indirect pointer dispatch
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: micro-behaviors/process/thread/config::dense-x64-tls-array-access
    any:
      - id: micro-behaviors/data/control-flow/dispatch::tls-conditional-pointer-jump-x64
      - id: micro-behaviors/data/control-flow/dispatch::tls-rip-relative-rotate-xor-target-x64
