# Pathologically deep AST recursion — an anti-static-analysis shape.
#
# filefacts bounds its single source-AST walk at MAX_AST_DEPTH (1000) and emits
# `ast.depth_capped` = 1 when one file forces that bound: a member chain
# (`a.b.c…`), a string-concat chain (`"a"+"a"+…`), or a subscript chain
# (`obj["x"]["y"]…`) thousands of links deep. No hand-written source nests that
# far — it is machine-generated padding meant to exhaust or stall a static
# analyser (before the bound was added it overflowed the worker stack and
# aborted analysis outright). The metric is boolean, so `min: 1` matches its
# presence. Sibling signal: parse-errors.yaml (malformed-AST evasion).
defaults:
  attack: T1027
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: generated-autocomplete-ts-basename
    desc: Generated autocomplete TypeScript basename
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: basename
      regex: '(?i)autocomplete\.ts$'
  - id: ast-depth-cap-reached
    desc: "Pathologically deep AST nesting"
    mbc: E1014
    crit: suspicious
    conf: 0.9
    for: [scripts, -javascript, -ruby, -php]
    if:
      type: metrics
      field: 'ast.depth_capped'
      min: 1
    unless:
      - type: text
        regex: '%!PS|!_TAG_PROGRAM_NAME.{0,100}Ctags'
      - id: ast-depth-known-benign-context
      - type: basename
        # Changelogs, public suffix/password data, Cranelift IR, and Windows
        # Runtime metadata are prose/data, not AST evasion.
        regex: '(?i)^changelog$|^(public-suffix-list|common-passwords-top-10000)\.data\.js$|\.(clif|rdl)$'
      - id: metadata/package/testing/presence/harness::test-directory
      # Generated corpora under testdata/ can be heuristically parsed as
      # source even when they are path inventories or other fixture data.
      - id: metadata/package/testing/presence/harness::test-fixture-directory-path

  - id: ast-depth-cap-reached-php
    desc: "Pathologically deep PHP AST nesting"
    mbc: E1014
    crit: suspicious
    conf: 0.9
    for: [php]
    if:
      type: metrics
      field: 'ast.depth_capped'
      min: 1
    unless:
      # SQL-heavy PHP applications commonly build many statements by string
      # concatenation; parser depth there is generated query structure.
      - type: metrics
        field: strings.sql
        min: 50
      # PHP templates may contain a complete HTML document whose nested DOM and
      # script structure reaches the parser bound without evasive source code.
      - type: text
        regex: '(?i)^\s*<!doctype\s+html\b'
      - type: text
        regex: '%!PS|!_TAG_PROGRAM_NAME.{0,100}Ctags'
      - id: ast-depth-known-benign-context
      - type: basename
        regex: '(?i)^changelog$|^(public-suffix-list|common-passwords-top-10000)\.data\.js$|\.(clif|rdl)$'
      - id: metadata/package/testing/presence/harness::test-directory

  - id: ast-depth-cap-reached-web-script
    desc: "Pathologically deep web script AST nesting"
    mbc: E1014
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: metrics
      field: 'ast.depth_capped'
      min: 1
    unless:
      # Complete HTML documents may be typed as JavaScript-bearing source.
      - type: text
        regex: '(?i)^\s*<!doctype\s+html\b'
      - type: text
        regex: '%!PS|!_TAG_PROGRAM_NAME.{0,100}Ctags'
      - id: ast-depth-known-benign-context
      - type: basename
        regex: '(?i)^changelog$|^(public-suffix-list|common-passwords-top-10000)\.data\.js$|\.(clif|rdl)$'
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/presence/harness::test-directory

  - id: ast-depth-cap-reached-ruby
    desc: "Pathologically deep Ruby AST nesting"
    mbc: E1014
    crit: suspicious
    conf: 0.9
    for: [ruby]
    if:
      type: metrics
      field: 'ast.depth_capped'
      min: 1
    unless:
      - type: text
        regex: '%!PS|!_TAG_PROGRAM_NAME.{0,100}Ctags'
      - id: ast-depth-known-benign-context
      - type: basename
        regex: '(?i)^changelog$|^(public-suffix-list|common-passwords-top-10000)\.data\.js$|\.(clif|rdl)$'
      # Sorbet RBI / RBS type stubs are declaration-only generated source.
      - id: metadata/file/extension/identity::sorbet-stub-extension
      - id: metadata/package/testing/presence/harness::test-directory

composite_rules:
  - id: ast-depth-known-benign-context
    desc: Recognized non-evasive deep-source context
    crit: exception
    conf: 0.98
    any:
      - id: well-known/lib/runtime/php-runtime::source-tree
      - id: well-known/app/browser/google-web::chrome-webstore-page
      - id: well-known/tool/development/biome::parser-depth-fixture-context
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
      - id: metadata/file/extension/identity::sorbet-rbi-gems-path
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
      - id: metadata/file/profile/identity::generated-documentation-page
      - id: metadata/library/web-frameworks::squarespace-static-context-global
      # A PPD PostScript printer description is a deeply nested data document.
      - id: metadata/file/format/markup::ppd-file-context
      - id: generated-autocomplete-ts-basename
