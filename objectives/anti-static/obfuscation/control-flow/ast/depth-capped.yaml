# Context used by higher-level rules that interpret deeply nested source.
# The parser depth-limit measurement itself is recorded in metadata.
defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: forge-std-safeconsole-path
    desc: Foundry forge-std safeconsole
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: path
      regex: 'forge-std/src/safeconsole\.sol$'
  - id: gem-build-log-basename
    desc: RubyGems build log basename
    crit: notable
    conf: 0.99
    for: [ruby]
    if:
      type: basename
      exact: gem_make.out
  # dart:html / dart:web_gl bindings are generated DOM declarations. Their
  # type nesting is the API surface, and content sniffing can parse the
  # .dart file as JavaScript.
  - id: dart-autogenerated-library
    desc: Auto-generated Dart library banner
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Auto-generated dart:'

composite_rules:
  # Cleave's file-type heuristic parses this 825 KB Unsloth llms.txt dump as
  # Python and reaches the AST walk cap on the documentation. The Markdown
  # extension plus the upstream repository URL identify the page as reference
  # material, not a deeply nested Python payload.
  - id: unsloth-markdown-reference-doc
    desc: Unsloth reference documentation page
    crit: notable
    conf: 0.99
    scope: file
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: well-known/lib/ai/unsloth::github-repository

  - id: ast-depth-known-benign-context
    desc: Recognized non-evasive deep-source context
    crit: exception
    conf: 0.98
    any:
      # `.pl` is also Prolog. A valid module directive identifies Prolog
      # source that filefacts heuristically parsed as Perl, not AST padding.
      - id: metadata/lang/source/syntax/directive::prolog-module-directive
      # Emscripten's asm.js compiler output contains deeply nested labeled
      # do/if blocks produced by control-flow lowering, not analysis padding.
      # Both solc 0.4.19 and 0.4.20 reach the cap in those generated functions.
      - id: metadata/build/bundler/runtime::js-emscripten-asm-marker
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
      - id: well-known/app/browser/google-web::chrome-webstore-page
      - id: well-known/tool/development/lint/biome::parser-depth-fixture-context
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
      - id: metadata/file/extension/identity::sorbet-rbi-gems-path
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
      - id: "metadata/package/documentation/page::documentation-web-page"
      - id: well-known/lib/web/site-platforms/squarespace::squarespace-static-context-global
      # A PPD PostScript printer description is a deeply nested data document.
      - id: metadata/file/format/markup::ppd-file-context
      - id: well-known/lib/web/server/pagy::pagy-ruby-gem
      - id: well-known/lib/data/casadi::casadi-swig-documentation-interface
      # Bun's legacy binary lockfile has a script shebang and can therefore be
      # heuristically parsed as JavaScript, but its binary tables are not an
      # evasive source AST. Its versioned format header identifies the format.
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-binary-lockfile-header
      # KTX/KTX2 GPU texture assets are compressed binary mip data; when a
      # heuristic type detector misreads one as script source (no extension
      # inside an archive), its own container header identifies it.
      - id: metadata/file/format/media::ktx-texture-header
      # CUDA C-family source may be heuristically parsed as JavaScript; long
      # numerical expressions there are not web-script obfuscation.
      - id: micro-behaviors/hardware/gpu::cuda-source-file
      # Generated autocomplete tables can legitimately form deep ASTs.
      - id: metadata/lang/generated::generated-autocomplete-data-table
      # Protocol Buffer's compiler banner identifies generated descriptor data.
      - id: metadata/lang/generated::protobuf-compiler-generated-source-banner
      # Babel standalone is a multi-megabyte generated compiler bundle; its
      # parser tables legitimately nest past the AST walk bound.
      - id: well-known/lib/development/babel::standalone-umd-global
      - id: metadata/lang/generated::generated-apollo-icon-enum-source
      - id: metadata/lang/generated::generated-material-symbol-enum-source
      # Unsloth's reference docs and Pagy's playground demo embed long
      # generated expressions as documentation, not as evasion.
      - id: unsloth-markdown-reference-doc
      - id: well-known/lib/web/server/pagy::pagy-playground-demo-marker
      - id: well-known/app/browser-extension/adguard::adguard-filters-source
      # Swift module interfaces are generated API declarations, not web scripts.
      - id: metadata/file/format/structured::swift-module-interface
      - id: metadata/file/format/markup::source-svg-symbol-catalog
      - id: metadata/lang/encoding/unicode-escape::unicode-escape-unicode-escape-js-basename
      # Rust source that content sniffing routed to the web-script parser (a
      # generated `.rs.inc` include); its expression nesting is not web-script
      # obfuscation.
      - id: metadata/lang/source/declaration::rust-item-declarations
      # Foundry safeconsole is generated overload nesting sniffed as JavaScript.
      - id: forge-std-safeconsole-path
      # regenerate() Unicode set modules are one .addRange() chain per
      # property. The depth is the code-point table, not analyser padding.
      - id: well-known/lib/format/regenerate-unicode-properties::regenerate-require
      - id: dart-autogenerated-library
