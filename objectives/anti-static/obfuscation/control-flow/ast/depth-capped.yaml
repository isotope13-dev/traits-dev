# Context used by higher-level rules that interpret deeply nested source.
# The parser depth-limit measurement itself is recorded in metadata.
defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: forge-std-safeconsole-path
    desc: Foundry forge-std safeconsole
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: path
      regex: 'forge-std/src/safeconsole\.sol$'
  - id: gem-build-log-basename
    desc: RubyGems build log basename
    crit: notable
    conf: 0.99
    for: [ruby]
    if:
      type: basename
      exact: gem_make.out
  # dart:html / dart:web_gl bindings are generated DOM declarations. Their
  # type nesting is the API surface, and content sniffing can parse the
  # .dart file as JavaScript.
  - id: dart-autogenerated-library
    desc: Auto-generated Dart library banner
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Auto-generated dart:'

composite_rules:
  # Cleave's file-type heuristic parses this 825 KB Unsloth llms.txt dump as
  # Python and reaches the AST walk cap on the documentation. The Markdown
  # extension plus the upstream repository URL identify the page as reference
  # material, not a deeply nested Python payload.
  - id: unsloth-markdown-reference-doc
    desc: Unsloth reference documentation page
    crit: notable
    conf: 0.99
    scope: file
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: well-known/lib/ai/unsloth::github-repository
