# JavaScript control-flow obfuscation via exception handling.
# Patterns that suppress all errors to hide loader/decoder failures or
# to make staged payload loaders run silently.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: B0032
  attack: T1027
traits:
  - id: upward-require-dot
    desc: require('.') / require('..') upward traversal
    crit: component
    conf: 0.85
    attack: T1059.007
    if:
      type: text
      regex: require\s*\(\s*["']\.\.?["']\s*\)
    not:
      - substr: 'require("./load-bindings")'
      - substr: './win32-sn-parser'
      - substr: 'serialport/bindings-cpp'
composite_rules:
  - id: staged-loader-exception-chain
    desc: Staged loader exception chain
    crit: suspicious
    conf: 0.9
    size_max: 2000000
    near_bytes: 8192
    all:
      - id: upward-require-dot
      - id: micro-behaviors/data/control-flow/error-handling/try::js-async-try-await-call
      - id: micro-behaviors/data/control-flow/error-handling/catch::catch-before-await-or-require
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
