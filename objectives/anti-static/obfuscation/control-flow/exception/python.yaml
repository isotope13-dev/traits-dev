# Python exception suppression that hides an outbound collection failure.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: python-oob-post-swallowed-error
    desc: Python suppresses failure from an OOB JSON post
    crit: hostile
    conf: 0.98
    attack: T1041,T1027
    mbc: E1041
    scope: file
    near_lines: 100
    all:
      - id: objectives/exfiltration/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
      - id: micro-behaviors/data/control-flow/error-handling::broad-exception-return-suppression
    unless:
      - id: metadata/package/testing/harness/runtime/
