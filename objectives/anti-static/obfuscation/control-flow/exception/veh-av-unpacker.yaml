# Exception-driven control-flow and stage concealment: resolves exception
# registration via PEB + XOR-masked export walking and uses a
# STATUS_ACCESS_VIOLATION handler to XOR-decrypt code in place and continue.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: concealed-veh-access-violation-xor-unpacker
    desc: XOR-masked export registers AV page-XOR unpacker
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/imports/runtime-concealment::peb-xor-masked-export-resolution
      - id: micro-behaviors/os/exception/handler::x64-veh-av-xor-unpack-continue
