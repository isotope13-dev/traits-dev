defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  attack: T1027,T1140

composite_rules:
  # Require program-wide call indirection plus repeated pointer resolvers and
  # an IL method that reads a resource, XORs bytes, and converts them to text.
  # No decoded strings, family identifiers, keys, or resource names are needed.
  - id: clr-resource-and-call-concealer
    desc: CLR conceals strings and calls behind resource decoding and pointer resolvers
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/code/control-transfer::clr-many-indirect-calls
      - id: metadata/binary/code/control-transfer::clr-indirect-calls-across-methods
      - id: micro-behaviors/process/interpreter/reflection/resolve::clr-many-pointer-resolvers
      - id: micro-behaviors/data/decode/xor::clr-resource-xor-string-method
