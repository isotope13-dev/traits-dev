defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: seh-fault-instruction-jump-patch
    desc: SEH handler patches faulting code into jump
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: hex
      section: any
      # [esp+4] is EXCEPTION_RECORD*, whose +0x0c member is ExceptionAddress.
      # Write E9 there, then calculate and store its relative displacement.
      # This is a code-rewriting control-flow trick, not ordinary SEH setup
      # or merely a PECompact identity. The destination and image base vary.
      pattern: 8B 54 24 04 8B 52 0C C6 02 E9 83 C2 05 2B CA 89 4A FC
