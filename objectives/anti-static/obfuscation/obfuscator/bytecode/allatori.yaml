# The Allatori Java obfuscator's demo edition stamps an AllatorixDemo marker
# into every class it emits. Vendors shipping obfuscated code license the
# tool; demo-edition output is what throwaway and malicious builds carry.
defaults:
  platforms: [windows, unix]
  for: [java, class]
  attack: T1027
traits:
  - id: allatori-demo-marker
    desc: Class obfuscated by Allatori demo edition
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)AllatorixDemo(_[A-Za-z0-9]+)?
