# SourceGuardian is a commercial PHP encoder. Encoded files keep a readable
# loader stub and carry the program as one sg_load('...') blob that PHP can run
# but a scanner cannot read. Legitimate vendors ship encoded PHP, so this is
# notable, not hostile; it says the logic is hidden, not what the logic does.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.9
  attack: T1027.002
  mbc: B0032

traits:
  - id: sourceguardian-sg-load-blob
    desc: SourceGuardian encoded PHP payload blob
    if:
      type: text
      regex: "sg_load\\('[0-9A-F]{16}[A-Za-z0-9+/=]{24}"

  # The readable half of an encoded file: the guard that dies when the
  # SourceGuardian loader extension is absent, then the opaque sg_load call.
  - id: sourceguardian-loader-guard
    desc: SourceGuardian loader presence guard
    if:
      type: text
      substr: "function_exists('sg_load')"

  - id: sourceguardian-sg-load-opaque-argument
    desc: sg_load call with opaque base64 argument
    if:
      type: text
      regex: "sg_load\\('[A-Za-z0-9+/]{40}"
