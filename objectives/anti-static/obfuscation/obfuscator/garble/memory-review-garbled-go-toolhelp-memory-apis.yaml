defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: garbled-go-toolhelp-memory-apis
    attack: T1027,T1057
    desc: Garbled Go process enumeration and memory APIs
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
    needs: 1
