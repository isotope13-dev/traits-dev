defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: component
  attack: T1027
  size_max: 52428800
composite_rules:
  - id: go-http2-transport-core
    desc: Go HTTP/2 transport core
    conf: 0.85
    all:
      - id: metadata/binary/symbols/descriptor::go-http-internal-http2transport
      - id: metadata/binary/symbols/descriptor::go-http-internal-http2clientconn
  - id: go-http2-present
    desc: Garbled Go binary with HTTP/2 internals
    crit: suspicious
    conf: 0.85
    all:
      - id: go-garble-indicators
    any:
      - id: metadata/lang/runtime::go-http2-internals-present
      - id: go-http2-transport-core
    unless:
      - id: well-known/dual-use/tunnel/aitun/
      - id: well-known/dual-use/tunnel/netch/
      - id: well-known/app/system/aks-engine/
      - id: well-known/app/communication/warpnet/
  - id: go-tls-present
    desc: Garbled Go binary with TLS internals
    crit: suspicious
    conf: 0.85
    all:
      - id: go-garble-indicators
    any:
      - id: metadata/binary/symbols/descriptor::go-tls-handshake-internals
      - id: micro-behaviors/crypto/cipher::go-tls-cipher-internals
      - id: metadata/lang/runtime::go-runtime-crypto-tls-fragment
    unless:
      - id: well-known/dual-use/tunnel/aitun/
      - id: well-known/dual-use/tunnel/netch/
      - id: well-known/app/system/aks-engine/
      - id: well-known/app/communication/warpnet/
  - id: go-cryptobyte-present
    desc: Garbled Go binary with cryptobyte ASN.1 parsing
    crit: suspicious
    conf: 0.85
    all:
      - id: go-garble-indicators
    any:
      - id: micro-behaviors/data/parse/binary::go-cryptobyte-asn1-core
      - id: micro-behaviors/data/parse/binary::go-cryptobyte-asn1-types
      - id: micro-behaviors/data/parse/binary::go-cryptobyte-methods
    unless:
      - id: well-known/dual-use/tunnel/aitun/
      - id: well-known/dual-use/tunnel/netch/
      - id: well-known/app/system/aks-engine/
      - id: well-known/app/communication/warpnet/
  - id: go-garble-indicators
    desc: Go garble obfuscation indicators
    crit: suspicious
    conf: 0.9
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-method-receiver
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-obf-module-path
    unless:
      - id: well-known/app/communication/warpnet/
      - id: metadata/lang/compiled::dart-aot-snapshot
  - id: go-garbled-http2
    for: [elf, macho, pe]
    desc: Garbled Go binary with HTTP/2 capability
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: go-http2-present
      - id: go-garble-indicators
  - id: go-garbled-cryptobyte
    for: [elf, macho, pe]
    desc: Garbled Go binary with x/crypto/cryptobyte (ASN.1 parsing)
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: go-cryptobyte-present
      - id: go-garble-indicators
  - id: go-garbled-proxy-client
    for: [elf, macho, pe]
    desc: Garbled Go binary with proxy client capability
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: go-garble-indicators
    any:
      - id: metadata/binary/symbols/descriptor::go-proxy-connect-header
      - id: metadata/binary/symbols/descriptor::go-proxy-connect-response
    unless:
      - id: well-known/app/communication/warpnet/
  # Removed go-base64-present / go-bytes-buffer-present: base64 and bytes.Buffer
  # are in virtually every Go binary, so as standalone composites they only
  # emitted noise `objectives/.../garble` findings on benign programs (tripping
  # the does-nothing "zero objectives/well-known" invariant). They fed no
  # garbled-* composite — the real garble detection keys on go-garble-indicators
  # (garbled type pointers / method receivers). The underlying
  # micro-behaviors/data/{encode/base64,buffer} findings still fire (benign,
  # non-objectives), so no signal is lost.
  - id: go-garbled-pclntab-or-runtime-strings
    desc: Garbled Go binary retains pclntab or runtime string markers
    crit: component
    all:
      - id: go-garble-indicators
    any:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/runtime::go-runtime-strings-in-text
  - id: go-garbled-asn-or-tls-runtime
    desc: Garbled Go binary exposes cryptobyte or TLS runtime strings
    crit: component
    all:
      - id: go-garble-indicators
    any:
      - id: go-cryptobyte-present
      - id: metadata/lang/runtime::go-runtime-crypto-tls-fragment
