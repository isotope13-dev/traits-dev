defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  crit: component
  attack: T1027
  size_max: 52428800
traits:
- id: go-garble-obf-module-path
  desc: Go build info has garble obf path
  for:
  - pe
  - elf
  - macho
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: \bobf/[0-9a-f]{8}\b
- id: go-garbled-type-pointer-upper-digit
  desc: Go garbled package type pointer
  for:
  - elf
  - macho
  - pe
  - dll
  - so
  - dylib
  crit: suspicious
  conf: 0.9
  count_min: 30
  if:
    type: text
    regex: \*[A-Za-z0-9]*[A-Z][A-Za-z0-9]*[0-9][A-Za-z0-9]*\.[A-Z][A-Za-z0-9_]+
  not:
  - substr: '*cPmuCX16.'
  - substr: '*waE2E.'
  - substr: '*waWa6.'
  unless:
  - id: metadata/binary/provenance/source::unicode-script-table-marker
- id: go-garbled-type-pointer-digit-upper
  desc: Go garbled package type pointer
  for:
  - elf
  - macho
  - pe
  - dll
  - so
  - dylib
  crit: suspicious
  conf: 0.9
  count_min: 30
  if:
    type: text
    regex: \*[A-Za-z0-9]*[0-9][A-Za-z0-9]*[A-Z][A-Za-z0-9]*\.[A-Z][A-Za-z0-9_]+
  not:
  - substr: '*e6cMvRo.'
  - substr: '*waE2E.'
  - substr: '*waWa6.'
  unless:
  - id: metadata/binary/provenance/source::unicode-script-table-marker
  downgrade:
    any:
    - id: go-garbled-type-pointer-upper-digit
- id: go-garbled-method-receiver-upper-digit
  desc: Go garbled method receiver pattern
  for:
  - elf
  - macho
  - pe
  - dll
  - so
  - dylib
  crit: suspicious
  conf: 0.9
  count_min: 15
  if:
    type: text
    regex: \b[a-z]\w*[A-Z]\w*[0-9]\w*\.\(\*[a-z]\w*[A-Z]\w*\)\.[A-Z][a-z]+
  not:
  - substr: mqXlA1Vn5R.(*cTzCEKou)
  - substr: hranaV2.
  unless:
  - id: metadata/binary/provenance/source::unicode-script-table-marker
  - id: well-known/app/communication/warpnet/
- id: go-garbled-method-receiver-digit-upper
  desc: Go garbled method receiver pattern
  for:
  - elf
  - macho
  - pe
  - dll
  - so
  - dylib
  crit: suspicious
  conf: 0.9
  count_min: 15
  if:
    type: text
    regex: \b[a-z]\w*[0-9]\w*[A-Z]\w*\.\(\*[a-z]\w*[A-Z]\w*\)\.[A-Z][a-z]+
  not:
  - substr: mqXlA1Vn5R.(*cTzCEKou)
  - substr: hranaV2.
  unless:
  - id: metadata/binary/provenance/source::unicode-script-table-marker
  - id: well-known/app/communication/warpnet/
composite_rules:
- id: go-garbled-type-pointer
  desc: Go garbled package type pointer
  crit: suspicious
  conf: 0.9
  any:
  - id: go-garbled-type-pointer-upper-digit
  - id: go-garbled-type-pointer-digit-upper
  downgrade:
    any:
    - id: go-garbled-type-pointer-upper-digit
- id: go-garbled-method-receiver
  desc: Go garbled method receiver pattern
  crit: suspicious
  conf: 0.9
  any:
  - id: go-garbled-method-receiver-upper-digit
  - id: go-garbled-method-receiver-digit-upper
  unless:
  - id: well-known/app/communication/warpnet/
- id: go-http-capability-garbled
  for:
  - elf
  - macho
  - pe
  desc: Garbled Go binary with HTTP client capability
  crit: suspicious
  conf: 0.85
  all:
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/runtime::go-http-internals-present
  any:
  - id: go-garbled-type-pointer
  - id: go-garbled-method-receiver
  unless:
  - id: well-known/app/communication/warpnet/
- id: go-tls-capability-garbled
  for:
  - elf
  - macho
  - pe
  desc: Garbled Go binary with TLS capability
  crit: suspicious
  conf: 0.85
  all:
  - id: metadata/lang/compiler/systems::go-binary
  - id: micro-behaviors/communications/tls/initialize::go-tls-internals-present
  any:
  - id: go-garbled-type-pointer
  - id: go-garbled-method-receiver
  unless:
  - id: well-known/app/communication/warpnet/
- id: go-socks-proxy-garbled
  for:
  - elf
  - macho
  - pe
  desc: Garbled Go binary with SOCKS5 proxy capability
  crit: hostile
  conf: 0.9
  all:
  - id: metadata/lang/compiler/systems::go-binary
  - id: micro-behaviors/communications/proxy/socks::socks5-string
  any:
  - id: go-garbled-type-pointer
  - id: go-garbled-method-receiver
- id: go-garbled-backdoor
  for:
  - elf
  - macho
  - pe
  desc: Garbled Go backdoor with HTTP/TLS and proxy
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/lang/compiler/systems::go-binary
  - id: micro-behaviors/communications/proxy/socks::socks5-string
  - id: metadata/lang/runtime::go-http-internals-present
  - id: micro-behaviors/communications/tls/initialize::go-tls-internals-present
  any:
  - id: go-garbled-type-pointer
  - id: go-garbled-method-receiver
