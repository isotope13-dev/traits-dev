defaults:
  platforms: [windows, unix]
  for: [binaries]
  attack: T1027
traits:
  - id: garble-random-packages
    desc: Garble randomized packages (digit variant)
    crit: suspicious
    conf: 0.95
    count_min: 40
    if:
      type: text
      regex: ^\w*[0-9]\w*\.\(\*\w*[0-9]\w*\)\.\w+$
    not:
      - substr: "uuFleF_K1.(*x048plwcNGd)"
    unless:
      - id: metadata/binary/provenance/source::unicode-script-table-marker
      - id: well-known/app/communication/warpnet/
  - id: garble-random-packages-no-digit
    desc: Garble randomized packages (non-digit variant)
    crit: suspicious
    conf: 0.9
    count_min: 40
    unless:
      - id: well-known/app/communication/warpnet/
    if:
      type: text
      regex: ^[A-Z][a-zA-Z]{10,24}\.\(\*[A-Z][a-zA-Z]{10,24}\)\.[A-Z][a-zA-Z]{5,15}$
  # Source/script invocation of mvdan.cc/garble — distinct from binary fingerprints.
  - id: garble-build-invocation
    desc: Invokes garble build for Go obfuscation
    crit: suspicious
    conf: 0.96
    # Dockerfile and CI workflows added: an implant's build recipe is as
    # often a container image or a pipeline step as it is a shell script,
    # and those two file types were the ones missing.
    for: [batch, shell, powershell, python, text, source, dockerfile, github-actions, makefile]
    if:
      type: text
      regex: '(?i)\bgarble(\.exe)?(\s+-\S{1,24}(\s+\$\{[A-Za-z0-9_]{1,24}\})?){0,6}\s+build\b'
  - id: garble-install-hint
    desc: Instructs installing mvdan.cc/garble
    crit: notable
    conf: 0.93
    for: [batch, shell, powershell, python, text, source, dockerfile, github-actions]
    if:
      type: text
      substr: mvdan.cc/garble
composite_rules:
  - id: garble-opsec-build-script
    desc: Build script installs and runs garble
    crit: hostile
    conf: 0.96
    for: [batch, shell, powershell, python, text, source]
    all:
      - id: garble-build-invocation
      - id: garble-install-hint
    any:
      - id: micro-behaviors/process/create/compile::go-ldflags-windows-gui
      - id: micro-behaviors/process/create/compile::go-ldflags-strip
      - id: micro-behaviors/process/create/compile::go-cross-compile-agent-output
