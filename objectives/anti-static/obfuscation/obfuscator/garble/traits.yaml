defaults:
  platforms: [windows, unix]
  for: [binaries]
  attack: T1027
traits:
  - id: garble-random-packages
    desc: Garble randomized packages (digit variant)
    crit: suspicious
    conf: 0.95
    count_min: 40
    if:
      type: text
      regex: ^\w*[0-9]\w*\.\(\*\w*[0-9]\w*\)\.\w+$
    not:
      - substr: "uuFleF_K1.(*x048plwcNGd)"
    unless:
      - id: metadata/binary/provenance/source::unicode-script-table-marker
  - id: garble-random-packages-no-digit
    desc: Garble randomized packages (non-digit variant)
    crit: suspicious
    conf: 0.9
    count_min: 40
    if:
      type: text
      regex: ^[A-Z][a-zA-Z]{10,24}\.\(\*[A-Z][a-zA-Z]{10,24}\)\.[A-Z][a-zA-Z]{5,15}$
composite_rules:
  - id: garble-opsec-build-script
    desc: Build script installs and runs garble
    crit: hostile
    conf: 0.96
    for: [batch, shell, powershell, python, text, source]
    all:
      - id: micro-behaviors/metaprogramming/generation/build::garble-build-invocation
      - id: metadata/lang/source/naming/module::garble-module-reference
    any:
      - id: metadata/build/compiler::go-ldflags-windows-gui
      - id: metadata/build/compiler::go-ldflags-strip
      - id: metadata/build/architecture::go-cross-compile-agent-output
