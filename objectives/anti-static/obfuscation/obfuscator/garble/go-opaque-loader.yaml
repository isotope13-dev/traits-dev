# Hostile composites for Go PE loaders that disguise their build identity.
#
# Mass-produced commodity Go droppers (Amadey-Go / Kryptik / Deyma builds
# observed since late 2024) share an identifiable shape:
#   - buildinfo.path / .module.path is a single random alphanumeric token,
#     not a real Go import path
#   - signed by a freshly issued TLS server certificate (no codeSigning EKU)
#     attempting to launder reputation
#   - payload lives in an oversized .rdata, decrypted at runtime, with Win32
#     APIs resolved dynamically via syscall.LazyProc / SyscallN
#
# None of these signals alone justify hostile, but the combinations below
# don't have legitimate occurrences in our benign corpus.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  attack: T1027
composite_rules:
  - id: go-pe-loader-abused-tls-cert
    desc: Go PE signed by abused TLS server certificate
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::go-buildinfo
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/signed/certificate/security::pe-cert-leaf-no-code-signing-eku
      - id: metadata/signed/certificate/subject::pe-cert-leaf-domain-subject
  - id: go-pe-opaque-rdata-loader
    desc: Go PE hides path with oversized rdata payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::go-buildinfo
      - id: objectives/anti-static/obfuscation/payload/section/content::oversized-rdata-section
    any:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
  # A garbled unsigned Go PE with a large near-random writable .data
  # section is carrying concealed bytes. That section entropy does not
  # show a decrypt-and-execute path, so this stays suspicious; the loader
  # composites elsewhere in this tree add the execution evidence.
  - id: go-pe-garbled-encrypted-data-loader
    desc: Garbled unsigned Go PE has high-entropy data
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
