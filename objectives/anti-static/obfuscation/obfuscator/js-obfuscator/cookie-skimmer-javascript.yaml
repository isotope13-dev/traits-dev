defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

composite_rules:
- id: js-obfuscated-storage-http-workflow
  for: [javascript]
  desc: "Obfuscated code with storage and HTTP APIs"
  crit: notable
  conf: 0.95
  mbc: "E1005"
  all:
  - id: micro-behaviors/data/db/web-storage::dom-storage-getitem-call
  - id: micro-behaviors/data/db/web-storage::dom-storage-setitem-call
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::a0-string-decoder-entrypoint
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: "metadata/file/naming::test-directory-component"
