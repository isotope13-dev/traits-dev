# obfuscator.io RC4 string arrays in Windows Script Host files. No
# legitimate vendor ships WSH JScript through javascript-obfuscator with
# RC4 string encoding: the encryption exists to keep ProgIDs, URLs and
# command lines out of reach of static scanners.
defaults:
  platforms: [windows]
  for: [javascript]
  crit: hostile
  attack: T1027.013,T1059.007
  mbc: B0032

composite_rules:
  - id: rc4-string-array-activex-script
    desc: RC4-encrypted obfuscator.io script instantiates ActiveX objects
    conf: 0.95
    all:
      - id: metadata/build/obfuscator::obfuscator-io-rc4-string-array
      - id: micro-behaviors/os/com/instantiation::activexobject-reference

  - id: rc4-string-array-computed-progid
    desc: RC4-encrypted obfuscator.io script hides the ProgIDs it instantiates
    conf: 0.95
    all:
      - id: metadata/build/obfuscator::obfuscator-io-rc4-string-array
      - id: micro-behaviors/os/com/instantiation::computed-activex-progid
