# Obfuscator output whose payload is an entire page: the markup is
# percent-encoded, sliced into a rotated string table, and only reassembled
# when the document writes itself at load. Readable pages, including
# minified or bundled ones, do not hide their own markup this way.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, html]
  attack: T1027,T1027.006

composite_rules:
  - id: obfuscated-percent-fragment-page
    desc: Rotated string table of percent-encoded fragments reassembles the page at load
    crit: hostile
    conf: 0.96
    all:
      - id: well-known/tool/packaging/javascript-obfuscator::plain-string-array-runtime
      - id: metadata/lang/encoding/shape/fragment::percent-encoded-fragment-string-table
      - id: metadata/lang/encoding/shape/fragment::unescape-of-table-lookup-concatenation
