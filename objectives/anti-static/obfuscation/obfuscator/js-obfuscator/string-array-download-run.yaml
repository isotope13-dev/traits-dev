# obfuscator.io string-array runtime whose table holds a PowerShell download
# and run command: the obfuscation exists to hide the dropper command.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: string-array-hides-powershell-dropper
    desc: Obfuscator string array hides PowerShell download-and-run command
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.001,T1105
    all:
      - id: javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/process/argument/executable::js-powershell-name-literal
      - id: micro-behaviors/communications/http/download/executable::embedded-curl-output-variable-invoke
