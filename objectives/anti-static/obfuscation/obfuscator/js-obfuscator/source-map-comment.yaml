# The match establishes obfuscator text, including inert comment content.
# It does not establish execution or substitution of a trusted release.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: source-map-comment-with-rc4-obfuscator
  desc: Source-map appended text with RC4 obfuscator
  crit: suspicious
  conf: 0.96
  attack: T1027.002
  all:
  - id: metadata/build/bundler/asset::content-after-source-map-on-same-line
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
  unless:
  - id: metadata/path/directory::test-directory-component
