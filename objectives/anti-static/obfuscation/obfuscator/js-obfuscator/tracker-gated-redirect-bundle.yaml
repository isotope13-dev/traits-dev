# The campaign's own vocabulary (tracker-presence flags and redirect entry
# points) survives javascript-obfuscator because renaming globals is off by
# default, while every host and target sits in the encoded string table. A
# bundle carrying both is a concealed redirect controller; the behaviour verdict
# is objectives/evasion/decoy/cloaking, this one records the concealment.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1189
  mbc: B0032

composite_rules:
  - id: concealed-tracker-gated-redirect-bundle
    desc: Obfuscated bundle hides tracker-gated redirects
    crit: hostile
    conf: 0.95
    all:
      - id: javascript-obfuscator-string-array-runtime
      - id: objectives/evasion/decoy/cloaking::analytics-presence-flag-cluster
      - id: objectives/evasion/decoy/cloaking::redirect-controller-entry-points
