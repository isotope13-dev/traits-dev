# Output of Dean Edwards' JavaScript Packer: the canonical six-argument
# `eval(function(p,a,c,k,e,d)` decoder that rebuilds the script from a
# keyword table, so identifiers and strings are absent from the file as
# shipped. This describes a packed file, not the packer program. Unlike
# packer-eval-pattern-text it tolerates formatted (whitespace-spaced) stubs.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027
traits:
  - id: dean-edwards-packed-script
    desc: Script packed with Dean Edwards Packer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'eval\s*\(\s*function\s*\(\s*p\s*,\s*a\s*,\s*c\s*,\s*k\s*,\s*e\s*,\s*[dr]\s*\)'
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::syntaxhighlighter-core
      - id: well-known/lib/web/authoring/syntaxhighlighter::syntaxhighlighter-header-url
