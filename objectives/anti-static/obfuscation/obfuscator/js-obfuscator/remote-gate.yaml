# Obfuscator.io output that conceals an operator-keyed remote gate.
#
# The full-preset obfuscation rules elsewhere in this family pair packing with
# an eval or decoder payload. This file pairs it with a different concealed
# behavior: the packed file authenticates to the operator's server with an
# embedded key (`x-*-key` header, hardcoded fallback constant) -- the gate
# through which the operator decides who may use the deployed software and who
# owns it. A legitimate client ships its credentials separately and its auth
# code readably; there is no benign reading of an operator key hidden inside a
# rotated string table.
#
# Worked example: the `@depro-tech/cortana-md` releases, whose packed
# `src/hosted-mode.js` sends `x-cortana-key: config.motherKey ||
# DEFAULT_MOTHER_KEY ('cortana-hosted-2024-secret')` to the operator's
# check-auth endpoint before the bot loads.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.002,T1090
  mbc: B0032

composite_rules:
  - id: obfuscator-concealed-remote-auth-gate
    desc: Obfuscated code hides an operator-keyed gate
    crit: hostile
    conf: 0.96
    all:
      - id: strong-js-obfuscation
      - id: objectives/supply-chain/trojanized/package::custom-operator-key-header
      - id: objectives/supply-chain/trojanized/package::hardcoded-operator-secret-constant
    unless:
      - id: metadata/package/testing/harness/runtime/

# An obfuscator.io preset behind a runtime redirect controller: the packed
# preset is the concealment; the rotated index-shift table is the mechanism
# that turns an analytics-looking key into an attacker URL at runtime. The
# decoy rules under evasion/decoy convict the cloaking; this states the
# machine that operates it.
#
# Worked example: the polyfill.io injected payload, whose rotated-numeric
# obfuscator preset drives a string table that rewrites script sources.
  - id: rotated-preset-string-table-controller
    desc: Rotated obfuscator preset drives string-table controller
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1189
    all:
      - id: obfuscator-mangled-rotated-numeric-preset
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::double-negative-index-offset
