# The javascript-obfuscator string-array decoder with RC4 enabled turns every
# string into an indexed call. Inside a WSH file, with ActiveX ProgIDs that
# only exist after decoding and a temp-folder path, the decoder is hiding
# the objects and paths a script needs to download and write a payload.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: js-obfuscator-rc4-decoder-hiding-activex-and-temp
    desc: Obfuscated JS hiding ActiveX objects and temp path
    crit: hostile
    conf: 0.82
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/function-name::hex-named-hex-argument-call
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/os/com/automation::activex-obfuscated-progid
      - id: micro-behaviors/fs/path/temp::js-escaped-c-temp-path
    unless:
      - id: metadata/signed/platform/
