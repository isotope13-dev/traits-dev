# Obfuscated Node code with WebSocket and detached-spawn clues.
defaults:
  crit: suspicious
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027

composite_rules:
  - id: node-obfuscated-websocket-code-profile
    desc: Obfuscated Node code with WebSocket clues
    all:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: micro-behaviors/communications/http/websocket::websocket-class
      - id: metadata/import/builtin::require-fs
      - id: metadata/import/builtin::require-os
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: metadata/file/encoded::large-base64-like-literal

  - id: node-obfuscated-detached-spawn-profile
    desc: Obfuscated Node with detached spawn clues
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: micro-behaviors/process/daemonize/detach::node-obfuscated-detached-stdio-options
    any:
      - id: micro-behaviors/communications/http/websocket::websocket-headers
      - id: micro-behaviors/communications/socket/dial::javascript-dial
