# A dictionary lists words; their presence does not establish a read, a
# navigation, or a relationship between them in the decoded program.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable

composite_rules:
  - id: packer-referrer-location-tokens
    desc: Packer with referrer and location tokens
    conf: 0.93
    near_bytes: 2000
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
      - id: metadata/lang/source/literal/fragment/sequence::packer-dictionary-referrer-token
      - id: metadata/lang/source/literal/fragment/sequence::packer-dictionary-location-token
