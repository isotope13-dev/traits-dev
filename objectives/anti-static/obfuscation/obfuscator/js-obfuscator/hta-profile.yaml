defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hidden-hta-string-shuffle-profile
    desc: Hidden HTA with string-shuffle obfuscator
    crit: suspicious
    conf: 0.96
    attack: T1027
    for: [html]
    all:
      - id: objectives/evasion/process/hidden/execution::hta-taskbar-hidden
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::fisher-yates-string-shuffle
  # Hostile escalation of the profile above: the hidden HTA's entire script
  # is a seeded string-shuffle decoder, and the decoded strings are compiled
  # and executed through a constructor fetched by computed index, so neither
  # `Function` nor `eval` appears as text and the real payload (droppers
  # reaching FileSystemObject/WScript.Shell through ActiveX) exists only at
  # runtime. A hidden window presenting machine-shuffled strings to a
  # constructor-built stage is a stager construction with no benign producer.
  - id: hidden-hta-shuffle-constructor-loader
    desc: Hidden HTA runs decoded code via computed constructor
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007,T1564.003
    mbc: B0032
    for: [html]
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::fisher-yates-string-shuffle
      - id: micro-behaviors/process/interpreter/eval/compile::js-computed-index-constructor-build
