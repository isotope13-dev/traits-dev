# These file-wide combinations identify behaviors worth inspecting; they do
# not establish that credentials are sent or that a child process is hostile.
defaults:
  for: [javascript, typescript]
  platforms: [windows, unix]

composite_rules:
  - id: obfuscated-credential-env-reference
    desc: Obfuscation and credential environment access
    crit: suspicious
    conf: 0.88
    all:
      - id: javascript-obfuscator-string-array-runtime
      - id: obfuscated-base64-codec
      - id: micro-behaviors/os/env/secret-name::service-credential-env-var

  - id: obfuscated-computed-process-launch
    desc: Obfuscated script contains a computed launch and command-shell spawn
    crit: suspicious
    conf: 0.88
    all:
      - id: javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/process/create/variable::spawn-variable-program
      # A computed executable path alone is routine child supervision (for
      # example process.execPath plus an application-owned worker). Keep that
      # capability in spawn-variable-program; this suspicious composite needs
      # evidence of a command-shell launch as well. This file-wide association
      # is an investigation signal, not proof both observations share a call.
      - id: micro-behaviors/process/create/shell/interpreter::node-spawn-command-shell
