# NOTE: the rules below used to carry an `unless:` on
# metadata/package/files/ecosystem::openclaw-evolver-package-member plus a
# `downgrade:` on ...::openclaw-evolver-archive-container. That member marker is
# satisfied by the bare substring `EVOLVER_` in any js/ts/json/markdown file,
# and the container marker by an `evolver-*.zip` basename, so a package could
# exempt itself from this entire rule family by name. Obfuscator output is
# exactly what these rules exist to report, whoever shipped it -- vendor
# allowlisting belongs in a `crit: exception` composite built from notable
# facts, not a baseline name marker wired into a dozen `unless:` lists.
defaults:
  platforms: [windows, unix]
  # JS obfuscator patterns can appear in files that shebang-juked file-type
  # detection (e.g. attackers prepending `#!/bin/bash` to a .js) so we accept
  # both shell and javascript here. The patterns are JS-grammar-specific —
  # `var _0xabcd =`, `while(!![])` — so legitimate shell scripts don't FP.
  for:
    - javascript
    - shell
traits:
  - id: while-not-zero
    desc: while(0x0) infinite loop pattern
    crit: notable
    conf: 0.85
    attack: T1027
    if:
      type: text
      regex: while\(0x0\)
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
      # (evolver name allowlist removed -- see file header)
  - id: while-not-space-zero
    desc: while(!![]) with space infinite loop
    crit: notable
    conf: 0.85
    attack: T1027
    if:
      type: text
      regex: while\(\s*!!\s*\[\]\s*\)
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
      # (evolver name allowlist removed -- see file header)
  # jsjiami and similar packers gate the decoder with `while(!![]&&--n+m)`
  # rather than a bare `while(!![]){...}` block.
  - id: while-double-bang-and
    desc: while(!![]&&) obfuscator decoder loop gate
    crit: notable
    conf: 0.88
    attack: T1027
    if:
      type: text
      regex: while\(\s*!!\s*\[\]\s*&&
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
  - id: jsjiami-watermark
    desc: jsjiami.com JavaScript obfuscator watermark
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      substr: jsjiami.com
  # Obfuscator string-table rotation: `_0xabcd.push(_0xabcd.shift())` —
  # always uses `_0x`-mangled identifiers in real JS-obfuscator output.
  # The bare `X.push(X.shift())` form matched too many legitimate queue
  # rotations to keep as an objective.
  - id: push-shift-pattern
    desc: _0x push/shift self-rotation pattern
    crit: notable
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: '_0x[a-fA-F0-9]{3,}\.push\(\s*_0x[a-fA-F0-9]{3,}\.shift\(\)\s*\)'
  # Constants and ordering from the seeded string-table decoder used by the
  # compromised Joyfill package. Keep this as an obfuscation atom; the
  # campaign marker and global require alias provide the malware context.
  - id: seeded-string-shuffle-constants
    desc: Seeded string-table shuffle constants
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    mbc: B0032
    for: [javascript]
    if:
      type: text
      regex: 'charAt.{0,160}19597.{0,160}48014.{0,160}4573868'
  # Bracket/quote notation variant: `y['push'](y['shift']())` with a plain
  # identifier (not _0x-mangled). Same self-rotating string-array decoder, used
  # by obfuscators that don't hex-rename the array var (e.g. the ndsw webinject).
  - id: push-shift-bracket-pattern
    desc: "Bracket-notation push/shift self-rotation"
    crit: notable
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: "\\w+\\[['\"]push['\"]\\]\\(\\s*\\w+\\[['\"]shift['\"]\\]\\(\\)\\s*\\)"
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/app/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
      - id: well-known/app/development/vscode-extension/recomment::webpack-obfuscator-dep
      - id: well-known/app/development/vscode-extension/recomment::recomment-extension-context
      - id: well-known/app/development/vscode-extension/recomment::recomment-command-id
  - id: a0-string-decoder-entrypoint
    desc: a0_0x JavaScript string decoder entrypoint
    crit: notable
    conf: 0.92
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: "function a0_0x[0-9a-f]{4}\\("
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
  # A plain array rotation is common queue logic by itself. Keep it hidden as
  # a component and require obfuscator-style name mangling in the composite.
  - id: plain-push-shift-self-rotation
    desc: Plain array self-rotation with push and shift
    crit: component
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: text
      regex: '\w+\.push\(\s*\w+\.shift\(\)\s*\)'
  - id: shift-push-pattern
    desc: _0x unshift/pop self-rotation pattern
    crit: notable
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: '_0x[a-fA-F0-9]{3,}\.unshift\(\s*_0x[a-fA-F0-9]{3,}\.pop\(\)\s*\)'
  - id: array-shuffle-algorithm
    desc: Array shuffle algorithm in infinite loop
    crit: notable
    conf: 0.88
    attack: T1027
    if:
      type: text
      regex: while\(!!\[\]\).*?try.*?parseInt.*?\.push.*?\.shift
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
      # (evolver name allowlist removed -- see file header)
  - id: parseint-decoder-loop
    desc: while(!![]) try/parseInt decoder loop
    crit: notable
    conf: 0.9
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: while\(\s*!!\s*\[\]\s*\)\s*\{\s*try\s*\{\s*(var|let|const)\s+\w+\s*=\s*-?\s*parseInt\(
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
  - id: parseint-decoder-loop-and-gate
    desc: while(!![]&&) try/parseInt decoder loop
    crit: notable
    conf: 0.9
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: while\(\s*!!\s*\[\]\s*&&[\s\S]{1,80}try[\s\S]{1,60}parseInt\(
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
  # Obfuscator.io control-flow-flattening signature: pipe-separated digit
  # permutations like '5|1|4|3|0|2' or '4|3|0|2|1'. These appear as AST string
  # literals: the state ordering for the while/switch dispatcher.
  - id: cfg-flatten-state-list
    desc: "Obfuscator.io CFF state list"
    # Control-flow flattening is a real anti-static transformation, but
    # javascript-obfuscator is also used deliberately by published software.
    # Keep this observable as notable; hostile composites must add a payload
    # or boundary-crossing behavior.
    crit: notable
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    if:
      type: string_literal
      regex: '^\d(\|\d){4,}$'
  - id: push-keyword
    desc: Push keyword in decoder candidate
    crit: component
    conf: 0.6
    attack: T1027
    mbc: B0032
    if:
      type: string_literal
      exact: push
    # `push` is a normal Array method in bundled libraries. It is only a
    # decoder fragment when the surrounding file is not recognized output.
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
  - id: shift-keyword
    desc: Shift keyword in decoder candidate
    crit: component
    conf: 0.6
    attack: T1027
    mbc: B0032
    if:
      type: string_literal
      exact: shift
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
  - id: for-boolean-coercion
    desc: For loop with boolean coercion (+!!false)
    crit: suspicious
    conf: 0.88
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: for\s*\(\s*(var|let|const)\s+\w+\s*=\s*\+\s*!!\s*false
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: global-buffer-access
    desc: Dynamic global property access via Buffer
    crit: suspicious
    conf: 0.92
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: global\s*\[\s*Buffer\.from\s*\(
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: hex-function-names
    desc: Hex-prefixed function names (_0x pattern)
    crit: notable
    conf: 0.9
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: function\s+_0x[a-fA-F0-9]{4,}\s*\(
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/app/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
      - id: well-known/app/development/vscode-extension/recomment::webpack-obfuscator-dep
      - id: well-known/app/development/vscode-extension/recomment::recomment-extension-context
      - id: well-known/app/development/vscode-extension/recomment::recomment-command-id
  - id: hex-variable-names
    desc: Hex-prefixed variable names (_0x pattern)
    crit: notable
    conf: 0.85
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: (var|let|const)\s+_0x[a-fA-F0-9]{4,}\s*=
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/app/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
      - id: well-known/app/development/vscode-extension/recomment::webpack-obfuscator-dep
      - id: well-known/app/development/vscode-extension/recomment::recomment-extension-context
      - id: well-known/app/development/vscode-extension/recomment::recomment-command-id
  - id: jsfuck-pattern
    desc: JSFuck obfuscation ([]()!+ only)
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    count_min: 2
    if:
      type: text
      regex: '[\[\]\(\)!]{10,}[\+][\[\]\(\)!]{10,}'
  - id: whitespace-hiding
    desc: JavaScript contains a long inline whitespace run
    crit: notable
    conf: 0.9
    attack: T1027
    mbc: B0032
    # Shell package recipes commonly align checksum comments with spaces;
    # this metric is an obfuscation signal only for JavaScript.
    for: [javascript]
    size_max: 131072
    if:
      type: metrics
      field: text.max_inline_whitespace_run
      min: 100
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/package/testing/scripted/
      - id: metadata/package/testing/harness/runtime/
      - type: basename
        regex: \.wasm$
      - type: basename
        regex: \.(md|mdx)$
      # TypeScript compiler test baseline files (.types, .js, .symbols)
      # use long-run whitespace for type-annotation column alignment.
      - type: basename
        regex: '\.(types|symbols)$'
      # XPM pixmaps are often mis-typed as JavaScript; pixel rows are spaces.
      - type: basename
        regex: '(?i)\.xpm$'
  # Global property with punctuation name (global['!'] = ...)
  - id: global-punctuation-property
    desc: Global property with non-alphanumeric name
    crit: suspicious
    conf: 0.92
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: "global\\s*\\[\\s*['\"][^a-zA-Z0-9_]['\"]\\s*\\]\\s*="
  # Obfuscator-generated _$_ names commonly contain multiple digits. Requiring
  # a digit-dense suffix avoids treating Babel's single-use module bindings
  # (for example _$RefVisitor) as obfuscation evidence.
  - id: dollar-underscore-function-names
    desc: 'Digit-dense dollar-underscore function names'
    crit: notable
    conf: 0.85
    attack: T1027
    mbc: B0032
    count_min: 2
    if:
      type: text
      regex: "function\\s+_\\$[_a-zA-Z0-9]*\\d[_a-zA-Z0-9]*\\d[_a-zA-Z0-9]*\\s*\\("
    unless:
      - id: well-known/lib/core/sentry-js::sentry-raven-legacy-bundle
      - id: metadata/lang/source::generated-do-not-edit-text
  - id: dollar-underscore-variable-names
    desc: 'Digit-dense dollar-underscore variable names'
    crit: notable
    conf: 0.85
    attack: T1027
    mbc: B0032
    if:
      type: text
      regex: "(var|let|const)\\s+_\\$[_a-zA-Z0-9]*\\d[_a-zA-Z0-9]*\\d[_a-zA-Z0-9]*\\s*="
    unless:
      - id: well-known/lib/core/sentry-js::sentry-raven-legacy-bundle
      - id: metadata/lang/source::generated-do-not-edit-text
  - id: global-bracket-require-alias
    desc: Obfuscated quoted global require alias
    crit: suspicious
    conf: 0.94
    attack: T1027.002
    mbc: B0032
    for: [javascript]
    if:
      type: text
      regex: 'global\s*\[\s*["''][A-Za-z_$][A-Za-z0-9_$]{0,20}["'']\s*\]\s*=\s*require\b'
    unless:
      - id: well-known/lib/format/text-encoding::encoding-indexes-loader
      - id: well-known/lib/format/text-encoding::package-name
  - id: global-bracket-module-alias
    desc: Module aliased to global via bracket notation
    crit: suspicious
    conf: 0.88
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: "global\\s*\\[.{1,80}\\]\\s*=\\s*module\\b"
    unless:
      - id: metadata/library/structure::js-browserify-dependency-map
      - id: metadata/library/structure::js-browserify-module-wrapper
      - id: metadata/file/format/structured::sourcemap-inline-base64
      - id: metadata/file/format/structured::sourcemap-sources-content
  - id: packer-eval-pattern
    desc: Packer obfuscation (eval with replace)
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: eval\s*\(\s*function\s*\(.{0,80}\)\s*\{.{0,220}\.replace\s*\(\s*new\s+RegExp
    unless:
      - id: well-known/lib/development/js-beautify::package-context
composite_rules:
  - id: obfuscated-browser-xelis-miner
    desc: Obfuscated browser Xelis miner
    crit: hostile
    conf: 0.995
    mbc: B0018
    attack: T1027,T1496
    for: [javascript, typescript]
    all:
      - id: objectives/impact/cryptojacking/miner/runtime::browser-xelis-stratum-miner
    any:
      - id: any-name-mangling
      - id: push-shift-bracket-pattern
      - id: a0-string-decoder-entrypoint

  # Every anti-static transform obfuscator.io offers, applied at once: renamed
  # identifiers, a self-rotating string table, and a while/switch dispatcher.
  # A minifier produces the first; shipping all three means the author asked
  # for code that cannot be read, which is worth more than the notable each
  # leg carries alone. Declared, inspectable build steps are excluded below,
  # so a project that documents its obfuscation pass still reports as notable.
  - id: full-anti-static-obfuscator-preset
    desc: Obfuscator output mangles, rotates and flattens
    crit: suspicious
    conf: 0.94
    mbc: B0032
    attack: T1027.002
    all:
      - id: any-name-mangling
      - id: push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/build/minifier::intentional-javascript-obfuscator-build
      - id: metadata/build/minifier::intentional-obfuscator-dist-artifact
      - id: metadata/build/minifier::intentional-obfuscator-release-artifact
      - id: well-known/lib/data/akshare::akshare-financial-data-library
      # Both suspicious composites in this file describe one obfuscator.io
      # invocation, and they share two of three legs (name mangling + string-
      # table rotation). When the encrypted-table variant below fires it is the
      # canonical report -- strictly more informative, since it also establishes
      # that the require() targets are unreadable -- so reporting this preset
      # alongside it double-counts a single signal into two ids in the same
      # directory. This composite stays live for the encodings the other cannot
      # see (base64 stringArrayEncoding leaves no rc4 keystream, so
      # `xor-modulo-key-loop` never fires and only this one reports).
      - id: encrypted-string-table-hides-imports

  # A distinct fact from "this file is obfuscator output": the string table is
  # ENCRYPTED (the repeating-key keystream is obfuscator.io's rc4
  # stringArrayEncoding, not the plain base64 variant) AND require() targets are
  # read out of it. The module's dependency set is therefore unknowable without
  # running the decoder -- a reviewer cannot see what it pulls in. Minified code
  # keeps its require literals, so bundlers do not reach this.
  - id: encrypted-string-table-hides-imports
    desc: Encrypted string table hides the module imports
    crit: suspicious
    conf: 0.94
    mbc: B0032
    attack: T1027.002
    all:
      - id: hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/source/dynamic/load::node-computed-require-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/build/minifier::intentional-javascript-obfuscator-build
      - id: metadata/build/minifier::intentional-obfuscator-dist-artifact
      - id: metadata/build/minifier::intentional-obfuscator-release-artifact

  # The encrypted-table fact on its own, for the files the two composites above
  # cannot reach. Both of those need a second signal -- a computed require() to
  # hide, or a while/switch dispatcher -- and a leaf module that imports nothing
  # and was flattened has neither. The table is still rc4-encrypted, so every
  # literal in the file (paths, hosts, env var names, service names) is
  # unreadable until the decoder runs, which is the whole reason the tier is
  # suspicious. Without this base case a payload drops two full criticality
  # tiers just by having no imports: in the sample that motivated this, three of
  # ~50 uniformly obfuscated modules -- including the one that drives the OS
  # keychain -- topped out at notable purely because they call no require().
  - id: encrypted-string-table
    desc: Encrypted string table hides every literal
    crit: suspicious
    conf: 0.92
    mbc: B0032
    attack: T1027.002
    all:
      - id: hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
    unless:
      # Canonical-report guard, same intent as the `unless:` the preset above
      # carries: when a sharper sibling fires it reports this fact plus more,
      # and one obfuscator invocation must not surface as two ids in the same
      # directory. These two are the extra legs the siblings require, so their
      # presence means a sibling has already reported.
      - id: micro-behaviors/data/source/dynamic/load::node-computed-require-call
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context

  - id: full-obfuscator-io-toolkit
    desc: JavaScript uses multiple obfuscator.io techniques
    crit: notable
    conf: 0.96
    mbc: B0032
    attack: T1027.002
    all:
      - id: any-name-mangling
    any:
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
      - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
      - id: objectives/anti-static/obfuscation/code-metrics/structure::single-long-line-outlier
    needs: 2
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/library/generated::box-extract-progress-context
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness

  # A custom Base64 alphabet is a clear encoding capability, but it is not
  # evidence of a hidden payload: obfuscator.io's own decoder uses one.
  - id: obfuscated-base64-codec
    desc: Obfuscated JavaScript embeds a Base64 alphabet
    crit: notable
    conf: 0.9
    attack: T1027.002
    mbc: B0032
    all:
      - id: any-name-mangling
      - id: micro-behaviors/data/decode/base64::base64-alphabet
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: infinite-loop
    desc: Obfuscated infinite loop (while(!![]) pattern)
    crit: notable
    conf: 0.9
    attack: T1027
    any:
      - id: metadata/lang/javascript-features::js-obfuscator-while-loop
      - id: while-not-zero
      - id: while-not-space-zero
      - id: while-double-bang-and
      - id: for-boolean-coercion
    unless:
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: metadata/file/format/structured::sourcemap-context
      - id: metadata/library/structure/
      # (evolver name allowlist removed -- see file header)
  - id: string-array-rotation
    desc: String array with rotation decoder
    crit: notable
    conf: 0.9
    attack: T1027
    any:
      - id: push-shift-pattern
      - id: push-shift-bracket-pattern
      - id: shift-push-pattern
      - id: array-shuffle-algorithm
    unless:
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: metadata/file/format/structured::sourcemap-context
      - id: metadata/library/structure/
      # (evolver name allowlist removed -- see file header)
  - id: decoder-loop-keyword-triad
    desc: Infinite loop decoder with parseInt + push/shift keywords
    crit: notable
    conf: 0.92
    attack: T1027.002
    mbc: B0032
    all:
      - id: infinite-loop
      - id: push-keyword
      - id: shift-keyword
    any:
      - id: parseint-decoder-loop
      - id: parseint-decoder-loop-and-gate
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
      # (evolver name allowlist removed -- see file header)
  # The string-array rotation decoder is the structural signature of
  # javascript-obfuscator output. It is anti-analysis (T1027) but NOT proof of
  # malicious intent on its own — commercial software obfuscates its own source
  # with the identical tool. Obfuscation structure alone is `notable`;
  # suspicious or hostile is reserved for obfuscation paired with a stronger
  # boundary-crossing or malicious-payload leg
  # (eval of decoded bytes, global require-alias trojan, etc. — see
  # whitespace-hidden-eval / global-alias-obfuscation below).
  - id: advanced-array-shuffling
    desc: Advanced array shuffling algorithm
    crit: notable
    conf: 0.95
    attack: T1027.002
    all:
      - id: infinite-loop
      - id: string-array-rotation
    any:
      - id: micro-behaviors/data/source/syntax/array::indexed-array-element-copy
      - id: string-array-rotation
      - id: decoder-loop-keyword-triad
    unless:
      - id: metadata/library/structure/
      - id: metadata/build/bundler/
