defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - shell
traits:
  - id: jsjiami-watermark
    desc: jsjiami JavaScript obfuscator version watermark
    crit: notable
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: jsjiami\.com\.v[0-9]+\b
  - id: seeded-string-shuffle-constants
    desc: Seeded string-table shuffle constants
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: text
      regex: charAt.{0,160}19597.{0,160}48014.{0,160}4573868
  - id: fisher-yates-string-shuffle
    desc: Fisher-Yates shuffle of a string table
    crit: suspicious
    conf: 0.93
    attack: T1027
    for:
      - javascript
      - html
    if:
      type: text
      regex: charAt\([^)]{0,12}\)[\s\S]{0,240}m\[[A-Za-z]\]=m\[[A-Za-z]\];m\[[A-Za-z]\]=
  - id: hex-mangled-bracket-push-shift
    desc: Nearby hex-named bracket push/shift calls
    crit: notable
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
      - typescript
      - text
    if:
      type: text
      regex: _0x[a-fA-F0-9]{3,}\[['"]push['"]\][\s\S]{0,12}_0x[a-fA-F0-9]{3,}\[['"]shift
  - id: hex-mangled-parseint-loop-assignment
    desc: Loop assigns parseInt result to hex identifier
    crit: notable
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
      - typescript
      - text
    if:
      type: text
      # The accumulator can keep a reserved name (`const expression=`); the
      # hex-mangled push/shift leg of the runtime composite carries mangling.
      regex: while\(\s*!!\s*\[\]\s*\)[\s\S]{0,40}[\w$]{1,24}\s*=\s*-?\s*parseInt
  - id: string-array-offset-index-decoder
    desc: String-array accessor subtracts index offset
    crit: notable
    conf: 0.92
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: return\s+\w+\[\s*\w+\s*-=\s*(0x[0-9a-fA-F]+|\d+)\s*\]
  - id: a0-string-decoder-entrypoint
    desc: JavaScript function with a0_0x name
    crit: notable
    conf: 0.92
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: function a0_0x[0-9a-f]{4}\(
  - id: jsfuck-pattern
    desc: JSFuck obfuscation ([]()!+ only)
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
      - shell
      - html
    if:
      type: text
      regex: '[!+\[][\[\]()!+]{99,}\([\[\]()!+]{99,}'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
  - id: global-punctuation-property
    desc: Global property with non-alphanumeric name
    crit: suspicious
    conf: 0.92
    attack: T1027.002
    mbc: B0032
    if:
      type: text
      regex: global\s*\[\s*['"][^a-zA-Z0-9_]['"]\s*\]\s*=
  - id: packer-eval-pattern-text
    desc: Packer eval wrapper text
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      exclude_html_comments: true
      regex: eval\s*\(\s*function\(p,a,c,k,e,[dr]\)\s*\{.{0,320}\.replace\s*\(\s*new\s+RegExp
  - id: packer-keyword-dictionary-split
    desc: Packer keyword dictionary split on pipes
    crit: notable
    conf: 0.9
    for: [javascript, shell, html, text]
    if:
      type: text
      regex: '[''"][\w$|]*\|[\w$|]*[''"]\.split\(\s*[''"]\|[''"]\s*\)'
  - id: packer-eval-pattern-non-js
    desc: Packer eval wrapper in script text
    crit: notable
    for: [shell, html, text]
    if:
      type: text
      exclude_html_comments: true
      regex: eval\s*\(\s*function\(p,a,c,k,e,[dr]\)\s*\{.{0,320}\.replace\s*\(\s*new\s+RegExp
  - id: packer-eval-executable
    desc: Eval calls a Packer-shaped function
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @eval
          arguments: (arguments . (call_expression
            function: (function_expression
              parameters: (formal_parameters . (identifier) @p . (identifier) @a .
                (identifier) @c . (identifier) @k . (identifier) @e . (identifier) @last .)))))
          (#eq? @eval "eval")
          (#eq? @p "p")
          (#eq? @a "a")
          (#eq? @c "c")
          (#eq? @k "k")
          (#eq? @e "e")
          (#match? @last "^[dr]$"))
  - id: inline-whitespace-before-execution
    desc: Inline padding precedes JavaScript execution
    crit: notable
    conf: 0.95
    for:
      - javascript
    if:
      type: text
      regex: '[^\s][ \t]{100,}(eval|Function|require)\s*\('
composite_rules:
  - id: packer-eval-pattern-js
    desc: Executable Packer eval wrapper
    crit: notable
    for: [javascript]
    all:
      - id: packer-eval-pattern-text
      - id: packer-eval-executable
  - id: packer-eval-wrapper
    desc: Packer-style eval decoder wrapper
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    for: [javascript, shell, html, text]
    any:
      - id: packer-eval-pattern-js
      - id: packer-eval-pattern-non-js
    unless:
      # Reported once, as the hostile payload rule, when it matches.
      - id: packer-eval-pattern
      - id: well-known/lib/web/client-side/jquery::stock-packed-plugin
      - id: well-known/lib/web/standards/cssquery::packed-cssquery-library
      - id: well-known/lib/web/client-side/sylvester::packed-sylvester-library
      - id: well-known/lib/web/client-side/platform::packed-platform-library
  # A working Packer payload: the eval decoder plus the keyword dictionary
  # it rebuilds the hidden program from. Outside the stock packed libraries
  # listed under unless, nothing benign ships this way any more.
  - id: packer-eval-pattern
    desc: Packer eval decoder with keyword dictionary
    crit: hostile
    conf: 0.95
    attack: T1027.002
    mbc: B0032
    for: [javascript, shell, html, text]
    all:
      - id: packer-keyword-dictionary-split
    any:
      - id: packer-eval-pattern-js
      - id: packer-eval-pattern-non-js
    unless:
      - id: well-known/lib/web/client-side/jquery::stock-packed-plugin
      - id: well-known/lib/web/standards/cssquery::packed-cssquery-library
      - id: well-known/lib/web/client-side/sylvester::packed-sylvester-library
      - id: well-known/lib/web/client-side/platform::packed-platform-library
  - id: javascript-obfuscator-string-array-runtime
    desc: Hex-mangled array calls and parseInt loop
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
      - typescript
      - text
    all:
      - id: hex-mangled-bracket-push-shift
      - id: hex-mangled-parseint-loop-assignment
    downgrade:
      scope: archive
      any:
        # Keep the general observation without duplicating its RC4 specialization.
        - id: rc4-checksum-rotated-table-runtime
        - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
        - id: well-known/lib/development/vscode::vscode-extension-out-output-path
        - id: well-known/dual-use/remote-admin/whalent/
        - id: metadata/import/package::comfyui-group-extension-context
        - id: metadata/build/minifier::vendor-protected-bundle-context
        - id: well-known/app/media/adobe-photoshop::photoshop-uxp-plugin-context
        # The self-defending anti-debug finding already reports this
        # obfuscator.io output; one suspicious line per packed file.
        - id: objectives/anti-analysis/debugger-detect/browser::js-obfuscator-self-defending-antidebug
  - id: obfuscated-jscript-activex-enumerator
    desc: Obfuscated script creates ActiveX and enumerates a COM collection
    crit: suspicious
    conf: 0.93
    attack: T1027.002
    for:
      - javascript
    platforms:
      - windows
    all:
      - id: well-known/tool/packaging/javascript-obfuscator::plain-string-array-runtime
      - id: micro-behaviors/os/com/instantiation::activex-object-variable-progid
      - id: micro-behaviors/os/com/automation::jscript-com-enumerator
  - id: obfuscated-direct-ip-http-client
    desc: JavaScript Obfuscator runtime beside direct-IP HTTP client
    crit: suspicious
    conf: 0.95
    attack: T1027
    for:
      - javascript
      - typescript
    all:
      - id: javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
  - id: obfuscated-split-require-function
    desc: Obfuscated loader calls generated require
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    for:
      - javascript
      - typescript
    all:
      - id: javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/process/interpreter/eval/constructed::js-function-constructor-split-require
