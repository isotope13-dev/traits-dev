defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - shell
traits:
- id: while-not-zero
  desc: while(0x0) infinite loop pattern
  crit: notable
  conf: 0.85
  attack: T1027
  if:
    type: text
    substr: while(0x0)
  unless:
  - id: metadata/build
- id: while-not-space-zero
  desc: while loop with a truthy array condition
  crit: notable
  conf: 0.85
  attack: T1027
  if:
    type: text
    regex: while\(\s*!!\s*\[\]\s*\)
  unless:
  - id: metadata/build
- id: while-double-bang-and
  desc: while(!![]&&) obfuscator decoder loop gate
  crit: notable
  conf: 0.88
  attack: T1027
  if:
    type: text
    regex: while\(\s*!!\s*\[\]\s*&&
  unless:
  - id: metadata/build
- id: jsjiami-watermark
  desc: jsjiami JavaScript obfuscator version watermark
  crit: suspicious
  conf: 0.95
  attack: T1027.002
  mbc: B0032
  if:
    type: text
    regex: jsjiami\.com\.v[0-9]+\b
- id: push-shift-pattern
  desc: _0x push/shift self-rotation pattern
  crit: notable
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: _0x[a-fA-F0-9]{3,}\.push\(\s*_0x[a-fA-F0-9]{3,}\.shift\(\)\s*\)
- id: seeded-string-shuffle-constants
  desc: Seeded string-table shuffle constants
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: text
    regex: charAt.{0,160}19597.{0,160}48014.{0,160}4573868
- id: fisher-yates-string-shuffle
  desc: Fisher-Yates shuffle of a string table
  crit: suspicious
  conf: 0.93
  attack: T1027
  for:
  - javascript
  - html
  if:
    type: text
    regex: charAt\([^)]{0,12}\)[\s\S]{0,240}m\[[A-Za-z]\]=m\[[A-Za-z]\];m\[[A-Za-z]\]=
- id: push-shift-bracket-pattern
  desc: Bracket-notation push/shift self-rotation
  crit: notable
  conf: 0.9
  attack: T1027
  for:
  - javascript
  - shell
  - html
  if:
    type: text
    exclude_html_comments: true
    regex: \w+\[['"]push['"]\]\(\s*\w+\[['"]shift['"]\]\(\)\s*\)
  unless:
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  - id: well-known/tool/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
  - id: well-known/tool/development/vscode-extension/recomment::webpack-obfuscator-dep
  - id: well-known/tool/development/vscode-extension/recomment::recomment-extension-context
  - id: well-known/tool/development/vscode-extension/recomment::recomment-command-id
  downgrade:
    any:
    - id: metadata/build/minifier::js-large-minified-bundle
- id: hex-mangled-bracket-rotation
  desc: Mangled array self-rotates via bracket access
  crit: notable
  conf: 0.95
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  - typescript
  - text
  if:
    type: text
    regex: _0x[a-fA-F0-9]{3,}\[['"]push['"]\][\s\S]{0,12}_0x[a-fA-F0-9]{3,}\[['"]shift
- id: hex-mangled-parseint-rotation-guard
  desc: Mangled parseInt checksum drives rotation loop
  crit: notable
  conf: 0.95
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  - typescript
  - text
  if:
    type: text
    regex: while\(\s*!!\s*\[\]\s*\)[\s\S]{0,40}_0x[a-fA-F0-9]{3,}\s*=\s*-?\s*parseInt
- id: string-array-offset-index-decoder
  desc: String-array accessor subtracts index offset
  crit: notable
  conf: 0.92
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: return\s+\w+\[\s*\w+\s*-=\s*(0x[0-9a-fA-F]+|\d+)\s*\]
- id: a0-string-decoder-entrypoint
  desc: a0_0x JavaScript string decoder entrypoint
  crit: notable
  conf: 0.92
  attack: T1027.002
  mbc: B0032
  if:
    type: text
    regex: function a0_0x[0-9a-f]{4}\(
  unless:
  - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
- id: shift-push-pattern
  desc: _0x unshift/pop self-rotation pattern
  crit: notable
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: _0x[a-fA-F0-9]{3,}\.unshift\(\s*_0x[a-fA-F0-9]{3,}\.pop\(\)\s*\)
- id: array-shuffle-algorithm
  desc: Array shuffle algorithm in infinite loop
  crit: notable
  conf: 0.88
  attack: T1027
  if:
    type: text
    regex: while\(!!\[\]\).*?try.*?parseInt.*?\.push.*?\.shift
  unless:
  - id: metadata/build
- id: parseint-decoder-loop
  desc: while(!![]) try/parseInt decoder loop
  crit: notable
  conf: 0.9
  attack: T1027
  mbc: B0032
  for:
  - javascript
  - shell
  - html
  if:
    type: text
    exclude_html_comments: true
    regex: while\s*\(\s*!!\s*\[\]\s*\)\s*\{\s*try\s*\{\s*(var|let|const)\s+\w+\s*=[\s(-]*parseInt\(
  downgrade:
    any:
    - id: metadata/build
- id: parseint-decoder-loop-and-gate
  desc: while(!![]&&) try/parseInt decoder loop
  crit: notable
  conf: 0.9
  attack: T1027
  mbc: B0032
  if:
    type: text
    regex: while\(\s*!!\s*\[\]\s*&&[\s\S]{1,80}try[\s\S]{1,60}parseInt\(
  unless:
  - id: metadata/build
- id: for-empty-cond-try
  desc: for(;;) try empty-condition loop
  crit: notable
  conf: 0.88
  attack: T1027.002
  mbc: B0032
  if:
    type: text
    regex: for\s*\(\s*(var|let|const)\s+\w+\s*=\s*\w+\(\)\s*;\s*;\s*\)\s*try
  unless:
  - id: metadata/build
- id: try-if-parseint
  desc: try if parseInt decoder gate
  crit: notable
  conf: 0.88
  attack: T1027.002
  mbc: B0032
  if:
    type: text
    regex: try\s*\{\s*if\s*\([^)]{0,80}parseInt
  unless:
  - id: metadata/build
- id: for-boolean-coercion
  desc: For loop with boolean coercion (+!!false)
  crit: suspicious
  conf: 0.88
  attack: T1027
  mbc: B0032
  if:
    type: text
    regex: for\s*\(\s*(var|let|const)\s+\w+\s*=\s*\+\s*!!\s*false
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: jsfuck-pattern
  desc: JSFuck obfuscation ([]()!+ only)
  crit: suspicious
  conf: 0.95
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  - shell
  - html
  if:
    type: text
    regex: '[!+\[][\[\]()!+]{99,}\([\[\]()!+]{99,}'
  unless:
  - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
  - id: metadata/package/testing/harness/runtime/
- id: global-punctuation-property
  desc: Global property with non-alphanumeric name
  crit: suspicious
  conf: 0.92
  attack: T1027.002
  mbc: B0032
  if:
    type: text
    regex: global\s*\[\s*['"][^a-zA-Z0-9_]['"]\s*\]\s*=
- id: packer-eval-pattern
  desc: Canonical Packer eval and replacement wrapper
  crit: suspicious
  conf: 0.95
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  - shell
  - html
  - text
  if:
    type: text
    exclude_html_comments: true
