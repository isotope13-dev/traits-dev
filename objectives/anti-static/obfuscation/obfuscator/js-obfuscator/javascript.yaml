  - id: well-known/lib/web/client-side/sylvester::packed-sylvester-library
  - id: well-known/lib/web/client-side/platform::packed-platform-library
- id: inline-whitespace-before-execution
  desc: Inline padding precedes JavaScript execution
  crit: notable
  conf: 0.95
  for:
