# javascript-obfuscator's `debugProtection` preset applied to a loader.
#
# The tool's feature list -- identifier renaming, string-array extraction and
# rotation, control-flow flattening, dead-code injection, debug protection,
# self-defending code, domain locks, console disabling -- is a menu, and which
# items an author picks is itself evidence. Mangling alone is a minifier's
# output. Mangling wrapped around a stage that fetches or decodes its next
# layer, with DevTools obstruction bolted on so the stage cannot be watched
# while it runs, is not a build artifact: nothing legitimate needs the
# reviewer locked out of the one moment the payload becomes visible.
#
# The anti-debug leg is the composite in anti-analysis/debugger-detect/, so
# this stays correct as new DevTools-obstruction spellings are added there.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027.002,T1622,T1105
  mbc: B0032

composite_rules:
  - id: obfuscated-antidebug-code-stager
    desc: Mangled loader guarded by DevTools obstruction
    crit: hostile
    conf: 0.95
    near_bytes: 32768
    all:
      - id: any-name-mangling
      - id: objectives/anti-analysis/debugger-detect/check::js-browser-debug-protection
    any:
      - id: objectives/anti-static/obfuscation/payload/encoded::decoded-function-constructor-argument
      - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::then-eval-pointfree
    unless:
      # A declared, inspectable obfuscation build step is not this pattern.
      - id: metadata/build/minifier::intentional-javascript-obfuscator-build
      - id: metadata/build/minifier::intentional-obfuscator-dist-artifact
      - id: metadata/build/minifier::intentional-obfuscator-release-artifact
