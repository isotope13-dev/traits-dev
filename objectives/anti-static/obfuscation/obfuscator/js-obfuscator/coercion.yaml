# Hybrid JSFuck uses a numeric alphabet alongside indexed Boolean strings.
# Detect the repeated coercion syntax, not a campaign URL or a variable name.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027
  mbc: B0032

traits:
  - id: repeated-coercion-character-access
    desc: Repeated indexed Boolean-string coercions
    crit: suspicious
    conf: 0.96
    count_min: 20
    if:
      type: text
      regex: '\(!{1,2}\[\]\+\[\]\)\['
    unless:
      - id: metadata/package/testing/harness/runtime/
  # The Function-constructor head: `(![]+[])[+[]]` reads "f" out of "false".
  # No minifier or hand-written code derives single letters this way; it is
  # the opening move of a coercion-built constructor ("constructor", "eval").
  - id: coercion-string-variable-binding
    desc: Short variable bound to coercion-indexed string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^|[;\s{(,])[\w$]{1,3}\s*=\s*\(\[?!{1,2}\[\]\]?\+(\{\}|\[\])\)\['
