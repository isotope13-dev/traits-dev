# JJencode (Yosuke Hasegawa) rewrites JavaScript using only symbols: it
# builds a lookup object from coerced primitives (`X=~[];X={___:++X,
# $$$$:(![]+"")[X],...}`), spells "constructor" and "return" from it, and
# runs the payload through the Function constructor. Nothing readable
# survives in the source, so the decoded script is invisible to review.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  attack: T1027

traits:
  - id: jjencode-symbol-table-preamble
    desc: JJencode symbol lookup-table preamble
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '=~\[\];[\w$]{1,8}=\{___:\+\+[\w$]{1,8},\$\$\$\$:\(!\[\]\+""\)\['
