# Obfuscated JScript structure; these clauses do not require payload loading.
defaults:
  crit: suspicious
  attack: T1027.002
  mbc: B0032
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
composite_rules:
  - id: jscript-obfuscator-loop-profile
    desc: JScript decoder loop and dense identifiers
    conf: 0.93
    all:
      - id: objectives/anti-static/obfuscation/control-flow/retry::retry-loop
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::decoder-loop-keyword-triad
      - id: "metadata/file/profile/identifier-population::many-high-entropy-identifiers"
      - id: metadata/file/line::source-lines-over-1000
  - id: jscript-obfuscator-signature-comment-profile
    desc: Obfuscated JScript with signature comments
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1553.003
    all:
      - id: metadata/signed/script::sig-comment-double-signature-block
    any:
      - id: jscript-obfuscator-loop-profile
      - id: plain-javascript-obfuscator-string-array-runtime
      - id: javascript-obfuscator-string-array-runtime
  - id: jscript-obfuscator-signature-entropy-profile
    desc: Obfuscated JScript with signature entropy
    conf: 0.96
    all:
      - id: jscript-obfuscator-loop-profile
      - id: metadata/signed/script::sig-comment-double-signature-block
      - id: metadata/file/data-blob::high-text-entropy
