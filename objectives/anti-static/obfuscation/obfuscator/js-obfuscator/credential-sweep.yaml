# Obfuscator output that conceals a multi-provider credential sweep.
#
# A secrets tool bundles cloud SDKs and reads credential stores in the open --
# that is the job. The same sweep shipped as a name-mangled, string-tabled
# megabyte bundle has no honest reader: there is no support case that is
# improved by hiding which secret stores the code walks. The concealment and
# the harvest are each independently meaningful; together they are a
# credential-stealer drop.
#
# Worked example: the compromised @bitwarden/cli 2026.4.0, a 10MB
# obfuscator.io bundle sweeping AWS/GCP/Azure secret stores and the CI
# runner's environment.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.002,T1552.001
  mbc: B0032

composite_rules:
  - id: obfuscator-concealed-credential-sweep
    desc: Obfuscated bundle conceals credential sweep
    crit: hostile
    conf: 0.96
    all:
      - id: any-name-mangling
    # Two independent providers, matching the open sweep rule: one alone is
    # ordinary SDK usage even when hidden.
    needs: 2
    any:
      - id: objectives/credential-access/env/secrets/cloud-access::aws-secret-env-access
      - id: objectives/credential-access/cloud/token/files::gcp-secretmanager-api
      - id: micro-behaviors/os/security/auth/cloud::node-aws-container-metadata-ip
      - id: metadata/file/string/cloud::cloud-instance-metadata-link-local-host
      - id: micro-behaviors/os/env/vars/cicd::process-env-github-actions
    unless:
      - id: metadata/package/testing/harness/runtime/
