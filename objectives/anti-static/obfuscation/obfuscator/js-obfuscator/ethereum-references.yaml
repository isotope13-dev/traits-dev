defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027

composite_rules:
  - id: obfuscated-ethereum-rpc-fragment-cluster
    desc: Obfuscated JS with Ethereum RPC fragments
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
      - id: micro-behaviors/communications/http/services/blockchain::onerpc-eth-path-fragment

  - id: obfuscated-ethereum-rpc-explorer-references
    desc: Obfuscated JS with RPC and explorer fragments
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
      - id: micro-behaviors/communications/http/services/blockchain::explorer-module-account-fragment
    any:
      - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
      - id: micro-behaviors/communications/http/services/blockchain::onerpc-eth-path-fragment
