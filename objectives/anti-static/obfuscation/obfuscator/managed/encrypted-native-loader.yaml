defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: obfuscated-dotnet-encrypted-native-loader
    desc: Unsigned obfuscated .NET assembly decrypts and invokes native code
    crit: hostile
    conf: 0.95
    attack: T1027.002,T1620
    mbc: F0001,E1059
    all:
      - id: metadata/build/protector::suppress-ildasm-managed-pe-string
      - id: metadata/binary/section
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/crypto/symmetric
      - id: micro-behaviors/mem/protect
      - id: micro-behaviors/os/api-resolution
