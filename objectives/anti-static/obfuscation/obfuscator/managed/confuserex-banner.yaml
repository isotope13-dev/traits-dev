defaults:
  attack: T1027.002
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: confuserex-version-banner
    desc: Confuser/ConfuserEx version banner string
    crit: notable
    conf: 0.95
    size_min: 200000
    size_max: 1000000
    if:
      type: text
      # Include 0.4.x and common 1.x banners; bare names are ambiguous.
      regex: Confuser(Ex)? v(0\.[1-9]\.\d+|1\.\d+(\.\d+)?)

composite_rules:
  - id: confuserex-obfuscated-assembly
    desc: ConfuserEx obfuscated managed assembly
    crit: notable
    conf: 0.95
    any:
      - id: confuserex-version-banner
      - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206d
      - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206f
