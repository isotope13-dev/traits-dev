defaults:
  attack: T1027.002,T1027.003,T1620
  mbc: F0001,E1059
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # ConfuserEx-style compressor output pairs metadata tampering (duplicate
  # stream headers over near-empty shadow heaps, which is why strict CLR
  # parsers reject the file) with SuppressIldasm anti-disassembly and string
  # encryption. Benign IP-protected apps share that tooling, so this also
  # requires the second half: a large high-entropy managed resource extracted
  # pixel by pixel and staged through late-bound InvokeMember dispatch in an
  # unsigned file -- the bitmap-crypter shape (FormBook-style loaders) rather
  # than ordinary obfuscation. The pixel-readback leg keeps plain image tools
  # out; the Activator/CreateInstance leg keeps plugin hosts out.
  - id: tamper-resistant-obfuscated-bitmap-stager
    desc: Obfuscated assembly stages encrypted bitmap payload
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe-string
      - id: metadata/binary/header/malformed::dotnet-empty-shadow-heaps
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/interpreter/runtime/clr::activator
      - id: metadata/binary/symbols/name::dotnet-create-instance-method-name
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/ui/devexpress/
      - id: well-known/lib/ui/dotnet-designer::framework-designer-serialization-library
