defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027

traits:
  - id: obfuscar-xor-string-decoder
    desc: Obfuscar CIL XOR string decryption loop
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '06 91 06 61 20 [4] 61 D2 9C 06 17 58 0A 06 7E [4] 8E 69 FE 04 2D ?? 2A'

composite_rules:
  - id: obfuscar-obfuscated-assembly
    desc: Managed assembly obfuscated with Obfuscar
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: obfuscar-xor-string-decoder
