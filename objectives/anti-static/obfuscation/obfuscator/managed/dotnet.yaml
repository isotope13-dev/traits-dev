defaults:
  attack: T1027
  platforms:
    - windows
  for:
    - pe
    - dll
    - csharp
traits:
  - id: protector-198-v4-marker
    desc: 198 Protector V4 marker
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 198 Protector V4
  - id: reactor-wide-guid-private-impl-pattern
    desc: Reactor wide GUID metadata pattern
    crit: notable
    conf: 0.86
    if:
      type: hex
      section: .text
      pattern: "33 7B 00 [9] 00 2D 00 [9] 00 2D 00 [9] 00 2D 00 [9] 00 7D 00"
  - id: csharp-junk-generation-task
    desc: C# junk generation task
    crit: suspicious
    conf: 0.9
    for: [csharp]
    if:
      type: text
      word: JunkCodeGenerationTask
  - id: csharp-symbol-renaming-task
    desc: C# symbol renaming task
    crit: suspicious
    conf: 0.9
    for: [csharp]
    if:
      type: text
      word: SymbolRenamingTask
  - id: csharp-cecil-obfuscation-marker
    desc: C# Cecil obfuscation marker
    crit: suspicious
    conf: 0.88
    for: [csharp]
    if:
      type: text
      regex: 'ObfuscationContext\s*\(\s*assembly'
composite_rules:
  - id: dotnet-198-protector
    for: [pe]
    desc: Obfuscated with 198 Protector V4
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: protector-198-v4-marker
  # Eziriz sells .NET Reactor as a commercial licence and this corpus carries
  # its output on ordinary published software -- Bug Shooting and TerminalWorks
  # CLScan both ship through it. Contested rather than malware-dominant, so the
  # protector is named and the intent is left to the composites.
  - id: dotnet-reactor-obfuscator
    desc: Obfuscated with .NET Reactor
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: reactor-wide-guid-private-impl-pattern
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
  - id: csharp-managed-obfuscator-pipeline
    desc: C# managed obfuscator pipeline
    crit: hostile
    conf: 0.96
    for: [csharp]
    all:
      - id: csharp-junk-generation-task
      - id: csharp-symbol-renaming-task
      - id: csharp-cecil-obfuscation-marker
  - id: dotnet-obfuscated-inflated-overlay
    desc: Unsigned obfuscated .NET binary inflated with high-entropy overlay
    for: [pe]
    crit: suspicious
    conf: 0.95
    attack: T1027.001
    mbc: B0024
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/file/text-distribution::mixed-case-word-pattern-cluster
      - id: metadata/binary/code/complexity::function-count-1000-plus
      - id: metadata/binary/layout/size::image-under-768kb
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
      - id: metadata/binary/layout/entropy::overlay-entropy-over-7
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
      - id: metadata/binary/layout/embedded::dotnet-selfcontained-bundle
      - id: metadata/installer/product/
      - id: metadata/signature/verified/
