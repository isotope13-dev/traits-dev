# Source of a .NET control-flow obfuscator. It splits each method into
# blocks, shuffles them, and rebuilds the body as a state machine: every
# block is guarded by `ldloc state; ldc.i4 n; ceq; brfalse next`. A second
# pass inserts a `br` over a junk `ldstr` between real instructions. Both
# exist only to defeat decompilers and signatures; commercial and open-source
# protectors share them, so the tool is dual-use, not malware by itself.
defaults:
  platforms: [windows]
  for: [vbs, csharp]
  attack: T1027
  mbc: B0032

traits:
  - id: il-state-compare-branch-emit
    desc: Emits ceq/brfalse state guards for IL blocks
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)Instruction\.Create\(\s*OpCodes\.Ceq\s*\)\)[\s\S]{0,240}OpCodes\.Brfalse\b'
  - id: il-junk-branch-insertion
    desc: Inserts unconditional IL branches between code
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)Instructions\.Insert\([^\r\n]{0,30}Instruction\.Create\(\s*OpCodes\.Br(_S)?\s*,'

composite_rules:
  - id: il-control-flow-obfuscator-source
    desc: Rewrites IL methods into obfuscated control flow
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/metaprogramming/generation/transform::dotnet-il-method-body-rebuild
    any:
      - id: il-state-compare-branch-emit
      - id: il-junk-branch-insertion
