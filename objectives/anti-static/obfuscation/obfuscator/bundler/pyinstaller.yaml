defaults:
  attack: T1027
  platforms:
  - linux
  - macos
  - windows
  for: [python, pyc, pe]
traits:
- id: blankobf
  desc: Obfuscated with BlankOBF
  crit: suspicious
  conf: 1.0
  for: [python, pyc]
  if:
    type: text
    substr: BlankOBF
composite_rules:
# BlankObf-packed code that reaches dynamic execution. The eval rules under
# obfuscation/eval convict the exec; this states the packer -- blank-space
# obfuscation exists only to defeat string extraction, and the packed blob
# it hides is a program, not data.
- id: blankobf-packed-dynamic-payload
  desc: BlankObf-packed payload reaches dynamic execution
  crit: hostile
  conf: 0.96
  attack: T1027.002
  all:
  - id: blankobf
  - id: objectives/anti-static/obfuscation/eval/scripting::python-packed-dynamic-exec
