# Prometheus-style Lua Vmify structure.
# The article identifies this obfuscator by proxy locals, arithmetic branch
# thresholds, and single-letter permutation helpers.
defaults:
  platforms: [unix, windows]
  for: [lua, text]
  attack: T1027

traits:
  - id: lua-arithmetic-vm-branches
    desc: Lua arithmetic VM branch thresholds
    crit: suspicious
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '(?m)\belseif\s+[A-Za-z_]\w*\s*<\s*\([^\r\n]{3,100}\)\s+then\b'

  - id: lua-if-vm-branches
    desc: Lua if VM branch thresholds
    crit: suspicious
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '(?m)\bif\s+[A-Za-z_]\w*\s*<\s*\([^\r\n]{3,100}\)\s+then\b'

  - id: lua-single-letter-call-cluster
    desc: Repeated single-letter Lua call targets
    crit: component
    conf: 0.94
    count_min: 20
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z]$'
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path

composite_rules:
  - id: prometheus-vmify-lua
    desc: Lua proxy VM with shuffled strings
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-loader
      - id: lua-single-letter-call-cluster
    any:
      - id: lua-arithmetic-vm-branches
      - id: lua-if-vm-branches
    needs: 1
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path
