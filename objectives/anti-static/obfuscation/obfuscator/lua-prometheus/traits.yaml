# Prometheus-style Lua Vmify structure.
# The article identifies this obfuscator by proxy locals, arithmetic branch
# thresholds, and single-letter permutation helpers.
defaults:
  platforms: [unix, windows]
  for: [lua, text]
  attack: T1027

composite_rules:
  - id: prometheus-vmify-lua
    desc: Lua proxy VM with shuffled strings
    # Prometheus is a dual-use public obfuscator. This structure establishes
    # concealment, while hostile family or behavior rules supply conviction.
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-loader
      - id: metadata/file/profile/token-population::lua-single-letter-call-cluster
    any:
      - id: metadata/file/profile/token-population::lua-parenthesized-elseif-comparisons
      - id: metadata/file/profile/token-population::lua-parenthesized-if-comparisons
    needs: 1
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path
