# An install script put through a commercial JavaScript obfuscator.
#
# The trojanized react-native-international-phone-number ships an
# `install.js` that runs on `preinstall`. Its first statement is the
# javascript-obfuscator string-array preamble: a self-rotating array driven by
# a checksum loop (`while(!![])` ... `H.push(H.shift())`), every identifier
# and literal replaced by hex-indexed lookups, and the real strings recovered
# at runtime through an XOR loop before being handed to `eval`.
#
# The supply-chain rules say the package is malicious. This says the author
# paid to make the install step unreadable, which is a separate fact and often
# the only one available: the payload here is recoverable only by running the
# deobfuscator, so a reviewer who opens the file learns nothing from reading
# it. It also survives the payload changing entirely -- the obfuscator's
# preamble is a fingerprint of intent independent of what it wraps.
#
# No legitimate package obfuscates its install script. Minification removes
# whitespace and shortens names; it does not add a rotation loop, a decode
# routine and an eval.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1195.002
  mbc: F0001

composite_rules:
  - id: obfuscated-install-script-decoder
    desc: Install script uses an obfuscated decoder
    crit: hostile
    conf: 0.95
    # Keep the install-script context in the matcher. Without this basename
    # gate the old rule also convicted obfuscated application and build-config
    # code, despite its directory and description claiming an install step.
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
      - id: objectives/supply-chain/install-hook/scripts/hook-file::hook-script-filename
    # The obfuscator's runtime needs some way to recover the literals it hid.
    # Accept the common decoder variants without binding the rule to a package
    # name, payload string, or one obfuscator release.
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
    unless:
      - id: metadata/package/testing/
      # A package that declares the obfuscator in its own devDependencies is
      # obfuscating its own build output, which is a commercial-shipping
      # choice rather than the install-script concealment this rule is named
      # for. An attacker running javascript-obfuscator over a victim package
      # does it out of band and ships only the output; they do not add the
      # tool to the manifest they are trojanizing. The Zencoder VS Code
      # extension declares `javascript-obfuscator: 4.1.1` and
      # `webpack-obfuscator: 3.5.1` and its `out/indexer.worker.js` is the
      # result, which read here as a fingerprint-plus-decode payload.
      #
      # These are the existing exception composites for that exact shape; the
      # rules that convict what an obfuscated payload *does* are unaffected,
      # as this file's note about the supply-chain rules already says.
      - id: metadata/build/minifier::intentional-webpack-obfuscator-build
      - id: metadata/build/minifier::intentional-javascript-obfuscator-build
      # Those two are package.json-derived and, as the sibling
      # `intentional-obfuscator-dist-artifact` note in metadata/build/minifier
      # records, a `package.json::` value path does not resolve onto a nested
      # bundle member -- so on the JS leaf itself they never apply. This one
      # is same-file and already fires there. Every individual leg of this
      # composite (`push-shift-bracket-pattern`, `fromcharcode-call`) carries
      # the same exclusion, on the grounds that a large minified bundle hits
      # those shapes as ordinary bundler output; the composite assembled from
      # them has to honour it too, or it convicts on exactly the evidence its
      # own legs decline to report.
      - id: metadata/library/structure::js-large-minified-bundle
