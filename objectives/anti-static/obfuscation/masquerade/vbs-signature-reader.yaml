defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1027,T1059.005
traits:
  - id: vbs-select-signature-comment
    desc: Selects SIG comment lines by prefix
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)Left\(\s*\w+\s*,\s*[0-9]{1,2}\s*\)\s*=\s*"'''' SIG ''''"'
  - id: vbs-signature-comment-fragments
    desc: Repeated nonstandard SIG comment fragments
    crit: notable
    count_min: 10
    if:
      type: text
      regex: '^'''' SIG ''''[A-Za-z0-9]{5,12}'
composite_rules:
  - id: vbs-signature-comment-output-stage
    desc: Self-reading VBScript reconstructs and prints disguised signature fragments
    crit: notable
    conf: 0.98
    all:
      - id: vbs-select-signature-comment
      - id: vbs-signature-comment-fragments
      - id: metadata/signature/script::sig-comment-signature-marker
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/fs/read/file/handle::open-text-file-read
      - id: micro-behaviors/data/string/concat/append::vbs-append-mid-suffix
      - id: micro-behaviors/os/console/io::wscript-echo-call
  - id: vbs-signature-comment-stage-loader
    desc: Self-reading VBScript slices SIG comments beside dynamic execution
    crit: hostile
    conf: 0.98
    all:
      - id: vbs-select-signature-comment
      - id: metadata/signature/script::sig-comment-signature-marker
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/fs/read/file/handle::open-text-file-read
      - id: micro-behaviors/data/string/concat/append::vbs-append-mid-suffix
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
    near_lines: 40
