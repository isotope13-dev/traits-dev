defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vbs-signature-marker-with-dynamic-loader
    desc: VBS signature marker accompanies a dynamic loader
    crit: suspicious
    conf: 0.96
    attack: T1027,T1059.005
    all:
      - id: metadata/signature/script::sig-comment-signature-marker
      - id: micro-behaviors/process/deploy/script-eval/input::vbs-execute-assembled-shell-method
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
  # The any: legs cover several hidden-stage loader shapes (env-staged
  # PowerShell dispatch, junk-padded stride rebuilds); only some involve
  # PowerShell or env staging, so name the union, not one variant.
  - id: vbs-sig-marker-hidden-stage-loader
    desc: Signature block beside a hidden stage loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.005
    all:
      - id: metadata/signature/script::sig-comment-signature-marker
    any:
      - id: objectives/anti-static/obfuscation/string/junking::vbs-powershell-env-staged-execute-loader
      - id: objectives/anti-static/obfuscation/string/junking::junk-padded-stride-loader
      - id: objectives/anti-static/obfuscation/string/junking::junk-padded-stride-execute-loader
