defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vbs-signature-marker-with-dynamic-loader
    desc: VBS signature marker accompanies a dynamic loader
    crit: suspicious
    conf: 0.96
    attack: T1027,T1059.005
    all:
      - id: metadata/signed/certificate/signature::sig-comment-authenticode-marker
      - id: micro-behaviors/process/create/shell/wsh::vbs-execute-assembled-shell-method
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
  - id: vbs-fake-sig-powershell-env-execute
    desc: Fake Authenticode comment block on env-staged PowerShell Execute
    crit: hostile
    conf: 0.98
    attack: T1027,T1036.005,T1059.001,T1059.005
    all:
      - id: metadata/signed/certificate/signature::sig-comment-authenticode-marker
      - id: objectives/anti-static/obfuscation/string/junking::vbs-powershell-env-staged-execute-loader
