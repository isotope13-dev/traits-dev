defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vbs-signature-marker-with-dynamic-loader
    desc: VBS signature marker accompanies a dynamic loader
    crit: suspicious
    conf: 0.96
    attack: T1027,T1059.005
    all:
      - id: metadata/signed/certificate/signature::sig-comment-authenticode-marker
      - id: micro-behaviors/process/create/shell/wsh::vbs-execute-assembled-shell-method
      - id: objectives/anti-static/obfuscation/wsh::vbs-execute-concat-code
