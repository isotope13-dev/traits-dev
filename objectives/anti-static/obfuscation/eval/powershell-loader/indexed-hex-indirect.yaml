defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1140,T1059.001
composite_rules:
  # The command held by the variable is unresolved: this combination is
  # suspicious, not proof that every decoded string is executed.
  - id: indexed-hex-xor-indirect-command
    desc: Hex XOR decoding with indirect commands
    crit: suspicious
    conf: 0.96
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::powershell-indexed-hex-xor-decoder
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
