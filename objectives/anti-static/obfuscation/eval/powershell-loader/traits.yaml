# Obfuscator-generated PowerShell loader, typically launched from a `.bat`
# one-liner (`powershell.exe -NoProfile -windowstyle … "<payload>"`). Three
# signature techniques, none of which legitimate code combines:
#   1. a custom string-stride deobfuscator — `$s[$i]; $i += N` walks every Nth
#      char to rebuild hidden commands out of junk-padded strings;
#   2. dynamic invocation via the call operator on a variable — `&($v) $code`,
#      an obfuscated Invoke-Expression where the cmdlet name is itself decoded;
#   3. char-code byte arrays — `@(114,101,109,…)` rebuilt into strings/keys.
# Patterns scan raw text, so they match the PowerShell whether it is a
# standalone `.ps1` or embedded in a batch command literal.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1059.001
  mbc: B0032
traits:
  - id: ps-scriptblock-dynamic-execution
    desc: PowerShell dynamic scriptblock invoke
    crit: suspicious
    conf: 0.95
    for: [batch, powershell, javascript, typescript, source, scripts]
    if:
      type: text
      # The call-site window (`Create(` plus following punctuation/word) lets
      # the `not:` below see what is being created. A bare `::Create`
      # reference with no invocation no longer matches; the trait describes a
      # dynamic scriptblock *invoke*.
      regex: '(?i)(InvokeCommand\s*\.\s*NewScriptBlock|\[scriptblock\]\s*::\s*Create\s*\(\W*\w*)'
    not:
      # `& ([scriptblock]::Create((irm <url>)))` is the documented installer
      # bootstrap (every vendor install.ps1 shows it in its usage header):
      # a plaintext download handed straight to Create, with no decoding
      # layer. Obfuscated loaders decode first (hex, char-code, FromBase64)
      # and Create from the decoded buffer or a variable, which still matches.
      - regex: '(?i)\(\s*\(\s*(irm|iwr|Invoke-RestMethod|Invoke-WebRequest)\b'
      # `Create('literal')` -- a single-quoted PowerShell string interpolates
      # nothing, so the scriptblock's source is verbatim in the file and there
      # is no decoding layer to hide behind. ImportExcel builds property
      # accessors this way (`[scriptblock]::Create(('$this.workbook...' -f $n))`)
      # in seven cmdlets. A loader Creates from a variable or a decoded buffer.
      - regex: "Create\\s*\\(\\s*\\(?\\s*'"
    unless:
      # A test that builds a scriptblock is exercising the cmdlet under test,
      # not staging a loader. Chocolatey's Pester suite does it in four
      # tests/pester-tests/powershell-commands/*.Tests.ps1 files, and the same
      # shape shows up in ansible's and cinc-auditor's Windows test suites.
      - id: metadata/package/testing/presence/harness::test-directory-path
      # An Ansible module that *is* the PowerShell executor builds a script
      # block because that is its documented job: ansible.windows'
      # win_powershell.ps1 and win_updates.ps1, community.windows' win_scoop.ps1.
      # `ansible-module-source-context` requires the module tree path *and* a
      # module protocol/metadata block, so a file merely sitting in the tarball
      # does not qualify. It was already used by the PowerShell cert-callback
      # rule in evasion/security-bypass/tls; this is its sibling case.
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      # A Go test that embeds a PowerShell snippet to assert on it is exercising
      # the code under test: azure-dev's cli/azd/main_test.go in two releases.
      # `go-test` needs two independent Go-testing markers, so an ordinary file
      # that merely mentions testing does not qualify.
      - id: metadata/package/testing/harness/unit::go-test

  - id: ps-source-readlines
    desc: PowerShell reads source lines
    crit: notable
    conf: 0.92
    for: [batch, powershell, javascript, typescript, source, scripts]
    if:
      type: text
      regex: '(?i)(ReadAllLines|Read''\s*\+\s*''AllLines)'

  - id: ps-hex-byte-conversion
    desc: PowerShell hexadecimal byte conversion
    crit: notable
    conf: 0.92
    for: [batch, powershell, javascript, typescript, source, scripts]
    attack: T1140
    if:
      type: text
      regex: '(?i)(Convert\]\s*::|ToByte\s*\()'

  - id: ps-indexed-charcode-assignment
    desc: PowerShell indexed char-code decode assignment
    crit: notable
    conf: 0.9
    if:
      type: text
      # Arithmetic indexed write (`$buf[$i] += $k`). Plain `$a[$b] = $c`
      # hashtable copies are not a char-code decoder.
      regex: '\$\w+\s*\[\s*\$\w+\s*\]\s*[-+*/]=\s*\$?\w+'
  - id: ps-invoke-via-variable
    desc: PowerShell dynamic invoke via variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '&\s*\(\s*\$\w+\s*\)\s*\$\w+'
  - id: ps-charcode-array
    desc: PowerShell numeric char-code array
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '@\(\s*\d{1,3}(\s*,\s*\d{1,3}){7,}'
composite_rules:
  - id: ps-hex-decoder-scriptblock
    desc: PowerShell hex decoder with scriptblock
    crit: suspicious
    conf: 0.97
    for: [batch, powershell, javascript, typescript, source, scripts]
    attack: T1140
    all:
      - id: ps-source-readlines
      - id: ps-hex-byte-conversion
      - id: ps-scriptblock-dynamic-execution
    near_lines: 2

  - id: embedded-batch-powershell-self-decoding-loader
    desc: Embedded batch/PowerShell self-decoding loader
    crit: hostile
    conf: 0.99
    for: [batch, powershell, javascript, typescript, source, scripts]
    attack: T1027,T1059.001,T1059.003
    all:
      - id: micro-behaviors/data/format/script::embedded-batch-script-header
      - id: micro-behaviors/data/format/script::embedded-batch-self-reading-loader
      - id: ps-hex-decoder-scriptblock

  - id: obfuscated-powershell-indexed-loader
    desc: Obfuscated PowerShell indexed decoder and dynamic loader
    crit: hostile
    conf: 0.95
    all:
      - id: ps-indexed-charcode-assignment
      - id: ps-invoke-via-variable
      - id: objectives/anti-static/obfuscation/string/concat::ps-numeric-chararray
