# Obfuscator-generated PowerShell loader, typically launched from a `.bat`
# one-liner (`powershell.exe -NoProfile -windowstyle … "<payload>"`). Three
# signature techniques, none of which legitimate code combines:
#   1. a custom string-stride deobfuscator — `$s[$i]; $i += N` walks every Nth
#      char to rebuild hidden commands out of junk-padded strings;
#   2. dynamic invocation via the call operator on a variable — `&($v) $code`,
#      an obfuscated Invoke-Expression where the cmdlet name is itself decoded;
#   3. char-code byte arrays — `@(114,101,109,…)` rebuilt into strings/keys.
# Patterns scan raw text, so they match the PowerShell whether it is a
# standalone `.ps1` or embedded in a batch command literal.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1059.001
  mbc: B0032
traits:
  - id: ps-format-string-readalllines
    desc: Format-string reconstructed ReadAllLines call
    crit: notable
    conf: 0.94
    for: [batch, powershell, javascript, typescript, source, scripts]
    if:
      type: text
      regex: '(?i)Read\s*\{\s*0\s*\}\s*[''"]\s*-\s*f\s*[''"]\s*AllLines'

  - id: ps-format-string-new-scriptblock
    desc: Format-string reconstructed ScriptBlock factory
    crit: suspicious
    conf: 0.95
    for: [batch, powershell, javascript, typescript, source, scripts]
    if:
      type: text
      regex: '(?i)New\s*\{\s*0\s*\}\s*[''"]\s*-\s*f\s*[''"]\s*ScriptBlock'

  - id: batch-stitched-env-base64-decode-c
    desc: Stitched env vars Base64-decoded in -c
    crit: notable
    conf: 0.94
    for: [batch]
    if:
      type: text
      regex: '(?i)FromBase64String\s*\(\s*\$env:[A-Za-z0-9_]+(\s*\+\s*\$env:[A-Za-z0-9_]+){2,}'

composite_rules:
  - id: ps-hex-decoder-scriptblock
    desc: PowerShell hex decoder with scriptblock
    crit: suspicious
    conf: 0.97
    for: [batch, powershell, javascript, typescript, source, scripts]
    attack: T1140
    all:
      - id: micro-behaviors/fs/read/stream::dotnet-readalllines-reference
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/data/decode/hex::embedded-powershell-convert-tobyte-radix16
      - id: micro-behaviors/data/decode/hex::embedded-powershell-format-string-hex-byte
    needs: 1
    near_lines: 2

  - id: batch-self-read-hex-powershell-dropper
    desc: Batch embeds format-obfuscated self-read hex PowerShell
    crit: hostile
    conf: 0.99
    for: [batch, vbs, javascript]
    attack: T1027,T1059.001,T1059.003
    all:
      - id: micro-behaviors/data/format/script::embedded-batch-delayed-expansion
      - id: ps-format-string-readalllines
      - id: ps-format-string-new-scriptblock
    any:
      - id: micro-behaviors/data/decode/hex::embedded-powershell-convert-tobyte-radix16
      - id: micro-behaviors/data/decode/hex::embedded-powershell-format-string-hex-byte

  - id: embedded-batch-powershell-self-decoding-loader
    desc: Embedded batch/PowerShell self-decoding loader
    crit: hostile
    conf: 0.99
    for: [batch, source, '!objectivec', javascript, lua, perl, php, powershell, python, ruby, vbs]
    attack: T1027,T1059.001,T1059.003
    all:
      - id: micro-behaviors/data/format/script::embedded-batch-script-header
      - id: micro-behaviors/data/format/script::embedded-batch-self-reading-loader
    any:
      - id: ps-hex-decoder-scriptblock
      - id: batch-self-read-hex-powershell-dropper
    needs: 1

  - id: batch-stitched-env-unicode-scriptblock-loader
    desc: Batch runs env-stitched Unicode ScriptBlock
    crit: hostile
    conf: 0.96
    for: [batch]
    attack: T1027,T1059.001,T1105
    all:
      - id: objectives/anti-static/obfuscation/string/concat::batch-base64-payload
      - id: objectives/anti-static/obfuscation/string/concat::batch-adjacent-expansion-chain
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      - id: batch-stitched-env-base64-decode-c

  - id: batch-minimized-stitched-scriptblock-loader
    desc: Minimized batch runs stitched Base64 ScriptBlock
    crit: hostile
    conf: 0.96
    for: [batch]
    attack: T1027,T1059.001,T1564.003
    all:
      - id: batch-stitched-env-unicode-scriptblock-loader
      - id: micro-behaviors/process/create/hidden::start-minimized-window

  # The batch never spells powershell or its arguments: the interpreter name,
  # window flags and the scriptblock stub are rebuilt from substrings of
  # padded variables, then the decoded payload is compiled and run in-process.
  - id: batch-fragment-built-powershell-scriptblock-loader
    desc: Batch-built PowerShell scriptblock loader
    crit: hostile
    conf: 0.95
    for: [batch]
    attack: T1027,T1059.001,T1059.003
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::batch-fragmentation-metrics
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      # The interpreter name is rebuilt, so `powershell … -c` is not spelled.
      # The launch is `-c`/`-Command` next to ScriptBlock::Create.
      - id: micro-behaviors/process/create/shell/batch::batch-scriptblock-command-flag
    any:
      - id: objectives/anti-static/obfuscation/string/fragmentation::batch-delayed-substring-slicing
      - id: objectives/anti-static/obfuscation/string/fragmentation::batch-short-var-substring-slicing
      - id: objectives/anti-static/obfuscation/string/concat::batch-base64-payload
    needs: 1

  - id: obfuscated-powershell-indexed-loader
    desc: Obfuscated PowerShell indexed decoder and dynamic loader
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/arithmetic::powershell-indexed-arithmetic-assignment
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-variable-call
      - id: objectives/anti-static/obfuscation/string/numeric::powershell-numeric-bytearray-text
