# Encoded decimal character expressions from a PowerShell loader.
# The endpoint is excluded; each signature represents an operation.
defaults:
  platforms: [windows]
  for: [text, powershell]

traits:
  - id: charcode-vm-model-check
    desc: Encoded virtual machine model check
    crit: notable
    if:
      type: text
      substr: "${@}${/}${#}  +  ${@}${;}${)]}${*``}+${@}${;}${;}${)]}  +  ${@}${*``}${;}  +  ${@}${*``}${)]}  +  ${@}${/=}${*``}  +${@}${%'}${#}  +  ${@}${;}${;}${;}+  ${@}${;}${)]}${/=}+${@}${;}${;}${!}  +${@}${;}${;}${#}  +${@}${;}${;}${%'}+${@}${;}${)]}${;}  +${@}${;}${;}${'#}  +${@}${/}${ '%}+  ${@}${;}${!}${;}+  ${@}${;}${;}${*``}  +${@}${;}${;}${%'}  +${@}${;}${)]}${;}+${@}${;}${)]}${/=}+${@}${'#}${;}+${@}${'#}${%'}+${@}${;}${)]}${/=}  +${@}${;}${;}${;}  +  ${@}${;}${)]}${)]}+  ${@}${;}${)]}${;}+  ${@}${;}${)]}${/}  +  ${@}${'#}${;}+${@}${'#}${%'}+  ${@}${%'}${#}+${@}${;}${;}${;}  +${@}${;}${;}${)]}+${@}${;}${;}${%'}  +${@}${/=}${#}  +${@}${;}${)]}${*``}+${@}${;}${;}${)]}+${@}${;}${;}${*``}  +  ${@}${'#}${)]}  +${@}${ '%}${'#}+${@}${/}${%'}+  ${@}${;}${)]}${*``}  +${@}${;}${;}${'#}+  ${@}${;}${;}${%'}  +${@}${;}${;}${#}+${@}${/=}${#}  +  ${@}${;}${)]}${/}  +${@}${ '%}${'#}  +${@}${'#}${;}"
  - id: charcode-web-stream
    desc: Encoded web response stream access
    crit: notable
    if:
      type: text
      substr: "${@}${#}${;}+${@}${;}${)]}${;}+${@}${;}${;}${%'}  +${@}${/}${!}  +${@}${;}${)]}${;}+  ${@}${;}${;}${*``}  +  ${@}${;}${;}${!}+${@}${;}${;}${;}  +  ${@}${;}${;}${)]}+  ${@}${;}${;}${*``}+${@}${;}${)]}${;}  +${@}${'#}${)]}  +  ${@}${'#}${;}  +  ${@}${'#}${%'}  +  ${@}${#}${;}  +${@}${;}${)]}${;}+${@}${;}${;}${%'}  +${@}${/}${!}  +  ${@}${;}${)]}${;}+${@}${;}${;}${*``}+${@}${;}${;}${!}+${@}${;}${;}${;}  +${@}${;}${;}${)]}+${@}${;}${;}${*``}  +${@}${;}${)]}${;}+${@}${/}${ '%}+  ${@}${;}${;}${%'}+${@}${;}${;}${'#}  +${@}${;}${)]}${;}+${@}${/=}${#}  +  ${@}${;}${)]}${/=}+  ${@}${'#}${)]}  +${@}${'#}${;}"
  - id: charcode-script-execution
    desc: Encoded dynamic script block execution
    crit: notable
    if:
      type: text
      substr: "${@}${'#}${%'}  +  ${@}${'#}${)]}  +  ${@}${/=}${;}  +${@}${/}${ '%}  +  ${@}${/=}${/=}  +${@}${;}${;}${'#}  +${@}${;}${)]}${*``}  +${@}${;}${;}${!}  +${@}${;}${;}${%'}  +${@}${%'}${%'}  +  ${@}${;}${)]}${/}  +${@}${;}${;}${;}  +${@}${/=}${/=}+  ${@}${;}${)]}${#}+  ${@}${/=}${ '%}  +${@}${*``}${/}  +${@}${*``}${/}  +${@}${%'}${#}+${@}${;}${;}${'#}  +${@}${;}${)]}${;}+${@}${/=}${#}  +  ${@}${;}${;}${%'}  +${@}${;}${)]}${;}  +${@}${'#}${)]}"

composite_rules:
  - id: charcode-vm-webrequest-scriptblock
    desc: Encoded VM-evasive PowerShell remote script loader
    crit: hostile
    attack: T1059.001
    all:
      - id: charcode-vm-model-check
      - id: charcode-web-stream
      - id: charcode-script-execution
