defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-http-hex-xor-eval
    desc: HTTP download with hex decoding, indexed XOR and decoded-byte evaluation
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.001
    ref: https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-indexed-xor-assignment
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-of-decoded-bytes
