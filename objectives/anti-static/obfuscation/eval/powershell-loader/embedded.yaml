# Obfuscated PowerShell loaders that rebuild their payload from a delimited
# numeric/hex array — `... -split '-X-' | % { [char][convert]::ToUInt32($_,16) }`
# joined back together and handed to Invoke-Expression. Offset arrays such as
# `@(430,457,...) | foreach { [char]($_-347) }` are the decimal counterpart.
# The same technique
# appears standalone in a `.ps1`, embedded in a VBScript string driven through
# WScript.Shell, dropped from an HTA, or staged by a JS loader, so the patterns
# scan raw text and target every host language that can carry a PowerShell
# command. Neither half occurs in benign code; the char-array-to-text decode
# step exists only to hide the command from static inspection.
defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, javascript, html]
  attack: T1059.001
  mbc: B0032
traits:
  - id: ps-char-convert-decode
    desc: PowerShell numeric-to-char payload decode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[char\]\s*\[convert\]::To'
      case_insensitive: true
  - id: ps-split-char-rebuild
    desc: PowerShell split-array char rebuild
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)-split\b[^\r\n]{0,80}\[char\]'
  - id: ps-offset-char-array-rebuild
    desc: PowerShell offset character-array rebuild
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)@\(\d{3,5}(,\d{3,5}){7,}\)\|foreach\{.{0,80}\[char\]\(.{0,16}-\d+\)'
composite_rules:
  - id: obfuscated-ps-char-array-loader
    desc: Obfuscated PowerShell char-array loader
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-eval
    any:
      - id: ps-char-convert-decode
      - id: ps-split-char-rebuild
      - id: ps-offset-char-array-rebuild
  - id: htmlhelp-obfuscated-ps-char-array-loader
    desc: HTML Help launches an obfuscated PowerShell char-array loader
    crit: hostile
    conf: 0.99
    all:
      - id: obfuscated-ps-char-array-loader
      - id: objectives/command-and-control/dropper/delivery/chm::htmlhelp-shortcut-process-dropper
  # A numeric byte array plus unmanaged-memory staging, independent of how the
  # APIs were reached. The reflective-loader composites in memory.yaml describe
  # one spelling of the allocate/copy/call chain; this one holds when a variant
  # swaps reflection for an `Add-Type` P/Invoke or a different allocator,
  # because the payload representation and the copy into unmanaged memory are
  # the parts a generator cannot drop.
  - id: numeric-array-shellcode-staging
    desc: Numeric byte array copied into memory
    crit: hostile
    conf: 0.96
    for: [powershell]
    attack: T1027,T1620
    mbc: B0023
    all:
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-powershell
    any:
      - id: micro-behaviors/data/embedded/payload/array::decimal-byte-array-per-line
      - id: micro-behaviors/data/embedded/payload/array::decimal-mz-dos-header-array
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::ps-charcode-array
