# The decoder/invocation and installer tokens co-occur. The matcher does not
# bind the decoded DownloadFile target to an installer argument, require a
# hidden window, or establish the downloaded MSI's intent.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1140

composite_rules:
  - id: offset-powershell-msi-command-concealment
    desc: Offset-decoded script co-occurs with encoded download and MSI tokens
    crit: suspicious
    conf: 0.98
    near_bytes: 32768
    all:
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-offset-scriptblock-eval
      - id: metadata/lang/encoding::offset1000-downloadfile-token
      - id: metadata/lang/encoding::offset1000-msiexec-token
      - id: metadata/lang/encoding::offset1000-msi-quiet-no-restart-token
