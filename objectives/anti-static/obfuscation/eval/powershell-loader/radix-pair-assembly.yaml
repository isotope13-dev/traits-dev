# Hidden execution, adaptive byte unpacking, keyed byte transformations,
# memory assembly loading and a Framework executable target together expose
# a concealed loader. Neither encoding nor reflection alone is hostile.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1027,T1140,T1059.001
composite_rules:
  - id: hidden-radix-pair-assembly-loader
    desc: Hidden PowerShell combines keyed assembly loading and a Framework executable
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base91::powershell-pair-bit-mask
      - id: micro-behaviors/data/decode/base91::powershell-adaptive-pair-width
      - id: micro-behaviors/data/decode/custom::powershell-keyed-byte-loop-decrypt
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/fs/path/binary::dotnet-framework-runtime-exe-path
    any:
      - id: micro-behaviors/os/module/load/memory::batch-assembly-byte-load
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load

  - id: radix-pair-framework-assembly-loader
    desc: Radix-pair PowerShell loads assembly with Framework host
    crit: hostile
    conf: 0.99
    for: [powershell]
    all:
      - id: micro-behaviors/data/decode/base91::powershell-pair-bit-mask
      - id: micro-behaviors/data/decode/base91::powershell-adaptive-pair-width
      - id: micro-behaviors/data/decode/custom::powershell-keyed-byte-loop-decrypt
      - id: micro-behaviors/fs/path/binary::dotnet-framework-runtime-exe-path
      - id: metadata/file/line::very-long-source-line
    any:
      - id: micro-behaviors/os/module/load/memory::batch-assembly-byte-load
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load
