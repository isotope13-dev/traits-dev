# Self-path storage, a decoder and a launch may accompany harmless source.
# These co-occurrences prove neither a downloaded payload nor its activation.
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-powershell-offset-source-cooccurrence
    desc: Python PowerShell launch near concealed source and script-path storage
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::powershell-offset-integer-array-obfuscation
      - id: micro-behaviors/process/create/eval::python-powershell-command-argv
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/info/selfpath::powershell-script-path-stored-env
    near_bytes: 8192

