# Bind the concealed source literal to the immediately following launch.
# An unrelated decoder elsewhere in a Python file, an unused stage, or a
# PowerShell token passed to another executable does not establish activation.
# Concealment plus activation remains suspicious: the decoded program must
# still be examined before deciding whether the artifact is malicious.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.001,T1027,T1140
traits:
  - id: python-launches-offset-powershell-stage
    desc: Python launches offset-encoded PowerShell
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement
            (assignment left: (identifier) @stage
              right: (string (string_content) @payload)))
          . (expression_statement
            (call
              function: (attribute object: (identifier) @module
                attribute: (identifier) @method)
              arguments: (argument_list
                (list . (string (string_content) @exe)
                  (_)* (string (string_content) @option)
                  . (identifier) @used) (_)*))) @activation)
          (#eq? @stage @used)
          (#eq? @module "subprocess")
          (#match? @method "^(run|call|Popen|check_call)$")
          (#match? @exe "(?i)^(powershell|pwsh)(\\.exe)?$")
          (#match? @option "(?i)^-command$")
          (#match? @payload "@\\(\\s*-\\d{1,12}(\\s*,\\s*-\\d{1,12}){16,}")
          (#match? @payload "(?i)\\[char\\]\\s*\\(.{0,64}\\$\\w+\\[.{1,24}\\]\\s*[+-]")
          (#match? @payload "(?i)\\[scriptblock\\]::\\s*Create\\(\\s*\\$\\w+\\s*\\)\\s*\\.Invoke\\("))
