defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001
  mbc: B0032
composite_rules:
  # A self-decoding loader that carries its payload as a long hex string,
  # slices it into byte pairs, converts each pair with ToByte radix 16,
  # XOR-decodes the bytes, and evaluates the result with Invoke-Expression.
  # Each leg is dual-use alone; the pipeline -- carrier, decode, decrypt,
  # evaluate -- exists only to hide the evaluated command from static
  # inspection. Split carriers, reversed digit order, and renamed variables
  # keep every leg, so variants reuse this shape.
  - id: powershell-substring-hex-xor-iex-loader
    desc: PowerShell rebuilds hex payload, XOR-decodes and evaluates it
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::powershell-bxor-charcode
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::repeating-key-xor-accumulation
    unless:
      # The narrower reversed split-carrier form below is the hostile
      # reading of this same pipeline; do not report both for one loader.
      - id: powershell-reversed-split-hex-xor-iex-loader

  # Split-carrier variant: the hex payload is divided across three or more
  # variables, reassembled in a chosen order, its hex pairs are reversed,
  # each pair is converted with radix 16 and XOR-decoded against a
  # repeating indexed key, and the result is evaluated. Splitting,
  # reversal and repeating-key XOR are three independent concealments of
  # the same evaluated script; no part of the combination serves a
  # benign script, and renamed variables, a different key, a different
  # fragment order or a different fragment count keep every leg.
  - id: powershell-reversed-split-hex-xor-iex-loader
    desc: Reversed split hex XOR PowerShell loader
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/data/string/assembly::powershell-multi-var-concat
      - id: micro-behaviors/data/string/reverse::powershell-reversed-pair-assembly
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::powershell-bxor-charcode
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::repeating-key-xor-accumulation
      - id: micro-behaviors/data/decode/xor/reconstruction::powershell-repeating-key-bxor-index
