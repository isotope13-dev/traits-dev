defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001
  mbc: B0032
composite_rules:
  # A self-decoding loader that carries its payload as a long hex string,
  # slices it into byte pairs, converts each pair with ToByte radix 16,
  # XOR-decodes the bytes, and evaluates the result with Invoke-Expression.
  # Each leg is dual-use alone; the pipeline -- carrier, decode, decrypt,
  # evaluate -- exists only to hide the evaluated command from static
  # inspection. Split carriers, reversed digit order, and renamed variables
  # keep every leg, so variants reuse this shape.
  - id: powershell-substring-hex-xor-iex-loader
    desc: PowerShell rebuilds hex payload, XOR-decodes and evaluates it
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/encoding/hex::hex-long-hex-string-literal
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::powershell-bxor-charcode
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::repeating-key-xor-accumulation
