# A PowerShell loader that holds its second stage as decimal triplets
# ("079028027..."), recovers each character with `[int]$s.Substring($i, 3)
# -bxor $key`, and compiles the result as JScript through Add-Type
# -MemberDefinition. The payload exists only as numbers on disk and as compiled
# managed code in memory.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1059.007

composite_rules:
  - id: powershell-numeric-xor-decoded-jscript-compile
    desc: PowerShell XOR-decodes numeric chunks and compiles JScript
    crit: hostile
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::powershell-add-type-jscript-language
      - id: micro-behaviors/data/bitwise/mixed::powershell-xor-operator
      - id: micro-behaviors/data/string/slice::powershell-substring-variable-call
