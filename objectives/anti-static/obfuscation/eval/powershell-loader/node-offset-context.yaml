# Offset source concealment plus a nearby Node launch does not prove that the
# decoded source is the launch argument, or that it downloads a payload.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-powershell-offset-source-cooccurrence
    desc: Node PowerShell launch near concealed source and script-path storage
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::powershell-offset-integer-array-obfuscation
      - id: micro-behaviors/process/create/exec::node-powershell-launch
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/info/selfpath::powershell-script-path-stored-env
    near_bytes: 8192
