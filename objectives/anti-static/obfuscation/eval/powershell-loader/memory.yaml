defaults:
  crit: hostile
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1140,T1620

composite_rules:
  - id: powershell-base64-scriptblock-memory-loader
    desc: PowerShell decodes Base64 and executes the result as an in-memory ScriptBlock
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-scriptblock-constructor-text
    near_lines: 8
    unless:
      - id: well-known/app/infrastructure/ansible::ansible-powershell-executor-context
      # Rapid7's rex-powershell gem ships this as a payload-generation
      # template.  The generated script remains detectable after it leaves the
      # gem, while the recognized source package is not itself an executing
      # loader.
      - id: well-known/tool/offensive/metasploit::rex-gem-context
      - id: metadata/build/scaffold::ruby-format-payload-placeholder

  # The other PowerShell in-memory loader shape, and the one a ScriptBlock rule
  # cannot see: no `Invoke-Expression` and no ScriptBlock anywhere. The script
  # resolves kernel32 exports reflectively, allocates a buffer, copies a byte
  # array into it, flips the page executable and calls it. Every leg is a
  # separate API, so the composite describes the whole allocate-copy-protect
  # chain rather than any one name -- which is what makes it survive the
  # variable renaming these payload generators do (Metasploit's templates are
  # literally `$%{var_code}` placeholders) and a port to another generator.
  - id: powershell-reflective-shellcode-loader
    desc: PowerShell runs shellcode through reflectively resolved kernel32 exports
    conf: 0.97
    attack: T1620,T1106
    mbc: B0023
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/executable::powershell-virtualalloc-call
      - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-name
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-powershell
    downgrade:
      # Same reasoning as the composite above: rex-powershell ships this as its
      # own payload corpus, so surface it without calling a published pentest
      # library an attack in progress.
      any:
        - id: well-known/tool/offensive/metasploit::rex-gem-context

  # The same chain with the protect step removed: the script asks VirtualAlloc
  # for PAGE_EXECUTE_READWRITE up front (`0x3000, 0x40`), so it never needs
  # VirtualProtect and the rule above cannot see it. msfvenom's psh-reflection
  # template and everything copied from it allocate this way, and a variant
  # only has to drop one API call to walk past a chain that demands four.
  # Calling the buffer through a second delegate is the final leg, so the
  # payload has to be executed rather than merely staged.
  - id: powershell-rwx-alloc-shellcode-loader
    desc: PowerShell runs shellcode from RWX memory
    conf: 0.97
    attack: T1620,T1106
    mbc: B0023
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/executable::powershell-virtualalloc-call
      - id: micro-behaviors/mem/alloc/executable::powershell-rwx-protection-flag
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-powershell
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-null-pointer-delegate-invoke
    downgrade:
      any:
        - id: well-known/tool/offensive/metasploit::rex-gem-context

  - id: powershell-rwx-fragmented-shellcode-loader
    desc: PowerShell runs fragmented RWX shellcode
    conf: 0.97
    attack: T1620,T1106
    mbc: B0023
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/executable::powershell-fragmented-virtualalloc
      - id: micro-behaviors/mem/alloc/executable::powershell-rwx-protection-flag
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-powershell
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-null-pointer-delegate-invoke

  - id: powershell-fragmented-createthread-shellcode
    desc: Fragmented CreateThread runs RWX shellcode
    conf: 0.97
    attack: T1620,T1055.003
    mbc: B0023
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/executable::powershell-fragmented-virtualalloc
      - id: micro-behaviors/process/create/thread::powershell-fragmented-createthread
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-powershell
