defaults:
  crit: hostile
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1140,T1620
  mbc: B0023

composite_rules:
  # The same chain with the protect step removed: the script asks VirtualAlloc
  # for PAGE_EXECUTE_READWRITE up front (`0x3000, 0x40`), so it never needs
  # VirtualProtect and an allocation/copy/protect matcher cannot see it. msfvenom's psh-reflection
  # template and everything copied from it allocate this way, and a variant
  # only has to drop one API call to walk past a chain that demands four.
  # Calling the buffer through a second delegate is the final leg, so the
  # payload has to be executed rather than merely staged.
  - id: powershell-rwx-fragmented-shellcode-loader
    desc: PowerShell runs fragmented RWX shellcode
    conf: 0.97
    attack: T1620,T1106
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/virtual::powershell-fragmented-virtualalloc
      - id: micro-behaviors/mem/protect/modify::powershell-rwx-protection-evidence
      - id: "micro-behaviors/mem/copy::marshal-copy-powershell"
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-null-pointer-delegate-invoke
    unless:
      - id: metadata/build/scaffold::ruby-format-payload-placeholder

  - id: powershell-fragmented-createthread-shellcode
    desc: Fragmented CreateThread runs RWX shellcode
    conf: 0.97
    attack: T1620,T1055.003
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/virtual::powershell-fragmented-virtualalloc
      - id: micro-behaviors/process/thread/create::powershell-fragmented-createthread
      - id: "micro-behaviors/mem/copy::marshal-copy-powershell"
    unless:
      - id: metadata/build/scaffold::ruby-format-payload-placeholder
