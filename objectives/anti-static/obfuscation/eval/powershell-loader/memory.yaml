defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1140,T1620

composite_rules:
  - id: powershell-base64-scriptblock-memory-loader
    desc: PowerShell decodes Base64 and executes the result as an in-memory ScriptBlock
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/process/interpreter/eval::powershell-scriptblock-constructor-text
    near_lines: 8
    unless:
      - id: well-known/app/infrastructure/ansible::ansible-powershell-executor-context
    downgrade:
      # Rapid7's rex-powershell gem ships exactly this construct in
      # data/templates/to_mem_*.ps1.template -- it is the payload generator's
      # own corpus. Still worth surfacing, but an openly published pentest
      # library is not an attack in progress, so soften rather than suppress:
      # well-known/tool/offensive/metasploit is explicit that identifying the
      # tool does not make payload implementations benign.
      any:
        - id: well-known/tool/offensive/metasploit::rex-gem-context
