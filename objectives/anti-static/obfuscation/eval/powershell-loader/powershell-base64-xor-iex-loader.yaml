defaults:
  platforms: [unix, windows]
  for: [powershell]
composite_rules:
  # A staged loader reads an encrypted blob, Base64-decodes it, XORs every byte
  # with a repeating key and passes the resulting text to Invoke-Expression.
  # The ScriptBlock variant is covered by powershell-base64-xor-scriptblock-clues.
  - id: powershell-base64-xor-iex-loader
    desc: PowerShell Base64, repeating-key XOR and IEX
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.001
    near_lines: 25
    all:
      - id: micro-behaviors/data/decode/base64/call::powershell-frombase64string
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::repeating-key-indexed-bxor-loop
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/data/decode/charset::powershell-utf8-getstring
