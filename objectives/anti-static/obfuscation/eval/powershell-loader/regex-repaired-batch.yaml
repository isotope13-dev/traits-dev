defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027,T1140

composite_rules:
  - id: batch-fragmented-regex-base64-eval
    desc: Batch fragments with Base64, regex and eval
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/concat::batch-fragmented-env-loader
      - id: micro-behaviors/data/string/replace::powershell-base64-regex-preprocessing
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-command-text
