defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-install-path-index-invocation
    desc: Invokes command built from PSHome characters
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001
    if:
      type: tree-sitter
      language: powershell
      query: |
        ((command (command_invokation_operator) @op
                  command_name: (command_name_expr) @target) @invoke
          (#match? @op "^[.&]$")
          (#match? @target "(?i)^\\(\\s*\\$pshome\\s*\\[\\s*[0-9]{1,3}\\s*\\]\\s*\\+\\s*\\$pshome\\s*\\[\\s*[0-9]{1,3}\\s*\\]"))
