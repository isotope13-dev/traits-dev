defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-install-path-index-invocation
    desc: Invokes command built from PSHome characters
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001
    if:
      type: tree-sitter
      language: powershell
      query: |
        ((command (command_invokation_operator) @op
                  command_name: (command_name_expr) @target) @invoke
          (#match? @op "^[.&]$")
          (#match? @target "(?i)^\\(\\s*\\$pshome\\s*\\[\\s*[0-9]{1,3}\\s*\\]\\s*\\+\\s*\\$pshome\\s*\\[\\s*[0-9]{1,3}\\s*\\]"))
  # `.($PSSessionConfigurationName[16] + $PSSessionConfigurationName[10] + 'x')`
  # spells iex from characters of a built-in preference variable ($ShellId,
  # $PSSessionConfigurationName, $MaximumErrorCount). The word iex never
  # appears, so command-name signatures miss it. The first operand is limited to
  # the automatic and preference variables stagers borrow letters from, so
  # ordinary array indexing ending in a literal 'x' stays out. Matching the
  # invocation node keeps the same text inside a quoted string from firing.
  - id: powershell-variable-char-index-iex
    desc: Builds iex from indexed variable characters
    crit: suspicious
    conf: 0.9
    attack: T1027,T1059.001
    if:
      type: tree-sitter
      language: powershell
      query: |
        ((command (command_invokation_operator) @op
                  command_name: (command_name_expr) @target) @invoke
          (#match? @op "^[.&]$")
          (#match? @target "(?i)^\\(\\s*\\$(PS[a-z0-9_]{3,30}|ShellId|env:[a-z0-9_]+|[a-z0-9_]+Preference)\\s*\\[\\s*[0-9]{1,3}\\s*\\]\\s*\\+[^+]{3,45}\\+\\s*['\"]x['\"]\\s*\\)$"))

composite_rules:
  - id: powershell-indexed-iex-fetch-stager
    desc: PowerShell fetches a URL and runs it via character-built iex
    crit: hostile
    conf: 0.95
    attack: T1027,T1059.001,T1105
    near_lines: 12
    all:
      - id: powershell-variable-char-index-iex
      - id: micro-behaviors/communications/http/client/managed::webrequest-create
