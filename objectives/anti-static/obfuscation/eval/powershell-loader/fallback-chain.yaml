# A loader that carries several interchangeable ways to run the same decoded
# text and tries them in turn until one works. Ordinary code has exactly one
# execution path -- it either calls Invoke-Expression or it does not. A ranked
# fallback chain exists to survive a host where the preferred sink is blocked
# or logged (Constrained Language Mode, an AMSI provider, an EDR hook on
# Invoke-Expression), which only matters to code expecting to be stopped.
#
# The two legs are deliberately different in kind: one names the eval verbs
# themselves, the other the retry driver that walks them. A rewrite that swaps
# in `.InvokeReturnAsIs()` or `Invoke-Command -ScriptBlock` keeps the driver.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1027
  mbc: B0032,E1059

composite_rules:
  - id: powershell-eval-fallback-retry-chain
    desc: Decoded payload retried across eval sinks
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/eval::powershell-multiple-eval-fallbacks
      - id: micro-behaviors/process/interpreter/runtime/eval::powershell-scriptblock-retry-loop
    any:
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/data/encode/payload::powershell-hex-here-string-carrier
