defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: positional-noise-byte-stage-concealment
    desc: Reversed shell stage hides byte reconstruction
    crit: hostile
    conf: 0.98
    attack: T1027
    all:
      - id: objectives/execution/payload/script-eval/transformed/shell::positional-reversed-shell-source-eval
