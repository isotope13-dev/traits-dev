# Swift source that base64-decodes a string and hands it to a shell launched
# through Process: the command text never appears in the source, so static
# review sees only the encoded blob. Same evidence the dropper objective
# convicts on, classified here by the concealment it performs.
defaults:
  platforms: [unix, macos]
  for: [swift]
  attack: T1027,T1059.004

composite_rules:
  - id: swift-base64-decoded-command-shell-eval
    desc: Swift evals a base64-decoded string in a shell
    crit: hostile
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/base64::swift-base64-decoder-call
      - id: micro-behaviors/process/create/shell/launch::swift-process-launchpath-bin-sh
