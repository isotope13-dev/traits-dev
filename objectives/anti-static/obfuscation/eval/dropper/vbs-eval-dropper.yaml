# Obfuscated VBScript Eval-nest droppers embedded in HTML applications.
# Arithmetic character-code assignments feed a ChrW concatenation chain
# whose result executes through an Eval nest (18 layers in the wild), so no
# decoded text, shell object, or command ever appears literally. Atoms are
# text-based for:[vbs,html] so they match both script files and HTA pages.
# MBC: E1027 (Obfuscated Files) / E1059.005 (Visual Basic exec)
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1027,T1059.005

traits:
  # An Eval call whose argument opens another Eval call is a packed nest:
  # each level unquotes the next, so static readers see quotation marks
  # instead of code. Single Eval calls stay with the micro-behavior atom.
  - id: nested-vbs-eval-invocation
    desc: Eval invocation nested inside Eval
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bEval\(\s*[''"]?Eval\('

composite_rules:
  # The arithmetic codes decode through ChrW into an Eval nest that the
  # Execute statement runs. Each leg alone is a decoder curiosity; the three
  # together are the packer.
  - id: vbs-arithmetic-eval-nest-execution
    desc: Charcode math beside nested Eval and Execute
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/charset::vbs-assigned-charcode-arithmetic
      - id: nested-vbs-eval-invocation
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement

  # The ChrW-chain twin: same arithmetic codes and Execute sink, but keyed
  # on the concatenation assembly instead of the Eval nest, so variants
  # that hide the nest depth still report.
  - id: vbs-chrw-chain-execution
    desc: Charcode math and ChrW chain beside Execute
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/charset::vbs-assigned-charcode-arithmetic
      - id: micro-behaviors/data/decode/char-code::vbs-chrw-concat-chain
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement

  # Dense hexadecimal character construction beside dynamic execution.
  # The code expressions can be plain literals; arithmetic is not required.
  - id: vbs-hex-chr-execute
    desc: Dense hexadecimal Chr calls beside Execute
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
      - id: micro-behaviors/data/decode/char-code::vbs-hex-character-code
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement

  - id: vbs-arithmetic-chr-variable-execute
    desc: Charcode math and variable Chr chain feeds Execute
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/charset::vbs-assigned-arithmetic-expression
      - id: micro-behaviors/data/decode/charset::vbs-variable-chr-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement



