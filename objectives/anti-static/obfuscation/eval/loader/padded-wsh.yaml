defaults:
  platforms: [windows]
  for: [html, vbs]
composite_rules:
  - id: padded-progid-hidden-run
    desc: Concealed WScript.Shell ProgID with hidden Run
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1027,T1564.003
    all:
      - id: metadata/lang/source/syntax/call/relationship::wsh-reference-near-variable-call
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
      - id: objectives/anti-static/obfuscation/string/delimiter::vbs-padded-wscript-shell-progid-chunks
      - id: micro-behaviors/os/com/automation::vbs-createobject-variable-progid
