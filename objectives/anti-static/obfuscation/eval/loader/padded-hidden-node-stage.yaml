defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1059.007

traits:
  - id: node-stage-whitespace-over-1024
    desc: Source contains oversized whitespace padding
    crit: component
    if:
      type: metrics
      field: text.max_whitespace_run
      min: 1024

composite_rules:
  - id: padded-node-loader-shuffled-code
    desc: Padded Node loader shuffles indirect code
    crit: hostile
    conf: 0.98
    all:
      - id: node-stage-whitespace-over-1024
      - id: objectives/anti-static/obfuscation/eval/loader::node-capable-indexed-stage-loader
      - id: micro-behaviors/data/property/assign::js-global-require-alias
      - id: micro-behaviors/data/string/replace::js-repeated-split-join-chain
      - id: metadata/lang/source/literal/string/population::javascript-string-at-least-two-kib
