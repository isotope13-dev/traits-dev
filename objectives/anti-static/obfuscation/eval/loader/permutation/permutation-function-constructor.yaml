defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
composite_rules:
  - id: permuted-source-and-factory-key
    desc: Permutation hides source and code-factory key
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/eval/indirect::js-inline-transformed-factory-invocation
      - id: micro-behaviors/data/string/reorder::char-array-swap-and-join
  - id: permuted-global-require-code-factory-loader
    desc: Permutation loader conceals global require and code factory
    crit: suspicious
    conf: 0.98
    all:
      - id: permuted-source-and-factory-key
      - id: objectives/anti-static/obfuscation/string/reorder::global-require-permutation-obfuscation
      - id: metadata/lang/source/literal/array::repeated-large-integer-arrays

  - id: hidden-permutation-loader-executes-source
    desc: Hidden permutation loader executes concealed source
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1027,T1059.007
    all:
      - id: micro-behaviors/data/string/reorder::char-array-swap-and-join
      - id: micro-behaviors/data/control-flow/global::node-global-and-require-call-arguments
      - id: metadata/lang/source/literal/string/population::javascript-string-at-least-two-kib
    # Concealment surface: padding that pushes the loader off screen, or one
    # overstuffed line holding the whole encoded stage (PolinRider variants).
    any:
      - id: metadata/file/line::source-code-after-horizontal-padding
      - id: metadata/file/line::single-long-line-outlier
    needs: 1

  - id: hidden-xor-table-permutation-loader
    desc: Hidden XOR-table permutation loader executes concealed source
    crit: hostile
    conf: 0.96
    for: [javascript]
    attack: T1195.002,T1027,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/encoding/xor/execute::xor-table-permuted-indirect-execution
      - id: micro-behaviors/data/control-flow/global::node-global-and-require-call-arguments
      - id: metadata/lang/source/literal/string/population::javascript-string-at-least-two-kib
    any:
      - id: metadata/file/line::source-code-after-horizontal-padding
      - id: metadata/file/line::single-long-line-outlier
    needs: 1
