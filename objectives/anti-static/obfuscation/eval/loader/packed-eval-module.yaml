# Whole-module eval packing.
#
# These composites describe a shipped JavaScript module whose body is a
# dynamic-eval stage: the file is one generated concatenation that evaluates
# itself. The alphabets differ (JSFuck coercion runs, opaque nested builders)
# but the relevant relationship is source construction at the eval sink.
# An unrelated eval call beside a large HTML template is not a packed module.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.002,T1059.007
  mbc: B0032

composite_rules:
  # The JSFuck-grade form: megabyte single line, thousands of
  # `(![]+[])`-style coercion indexes, and a top-level eval(). No minifier or
  # transpiler emits coercion-built characters, and no hand-written module is
  # a single megabyte line that evaluates itself. Worked example:
  # baileys-mbuilder 4.5.0-lts lib/index.js, the module the package's
  # postinstall hook executes.
  - id: jsfuck-coercion-eval-module
    desc: JSFuck coercion-packed single-line eval module
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::repeated-coercion-character-access
      - id: metadata/file/line::js-single-line-over-1mb
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member

  # The generalization without the JSFuck alphabet: a packed eval stage built
  # from string concatenation at the eval argument, in a one-line script
  # with unusually deep syntax or coercion-built characters. Deeper intent
  # (what the stage does, whether an install hook runs it) belongs to consumers such as the install-hook postinstall
  # composites.
  - id: single-line-packed-eval-module
    desc: Single-line module packs an eval stage
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      # Require concatenation at the eval argument, rather than inferring a
      # loader from file-wide co-occurrence with HTML/CSS template building.
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-concat-string
      - id: metadata/file/line::js-long-string-concat-chain
      - id: metadata/file/line::js-large-at-most-two-lines
    any:
      - id: metadata/lang/javascript-features::js-ast-depth-cap-reached
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::repeated-coercion-character-access
    unless:
      - id: objectives/anti-static/obfuscation/control-flow/ast::ast-depth-known-benign-context
      - id: well-known/lib/runtime/scripted/pyodide::pyodide-runtime-bundle
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
