defaults:
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - php
composite_rules:
- id: php-encoded-content-execution
  desc: High-entropy PHP with decoded execution
  crit: suspicious
  all:
  - id: metadata/file/encoding/container::php-encoded-content
  any:
  # Entropy and an unrelated execution call do not identify a loader.
  # Each alternative binds a decoding transformation to its execution sink.
  - id: micro-behaviors/process/interpreter/eval/direct::php-eval-string-decoder
  - id: micro-behaviors/process/interpreter/eval/direct::php-eval-inflate-decoder
  - id: micro-behaviors/process/interpreter/eval/direct::php-eval-gzip-or-reverse-decoder
  - id: micro-behaviors/process/interpreter/eval/direct::php-eval-pack-decoder
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::php-base64-shell-command
  unless:
  - id: metadata/file/magic/identity::php-archive
- id: php-encoded-content-dynamic-apis
  desc: Encoded-looking PHP with assertion or callback APIs
  crit: notable
  all:
  - id: metadata/file/encoding/container::php-encoded-content
  any:
  - id: micro-behaviors/data/control-flow/assert::php-assert-call
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::php-reflection-function
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::php-pdo-fetch-callback
  unless:
  - id: metadata/file/magic/identity::php-archive
