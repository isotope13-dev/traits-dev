defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  # Co-occurrence, not a data-flow claim. Commercial protectors also match.
  - id: php-encoded-content-execution
    desc: PHP execution calls with encoded-looking content
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/encoded::php-encoded-content
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: micro-behaviors/process/interpreter/eval/direct::php-create-function-call
      - id: micro-behaviors/process/create/shell/spawn::php-exec
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::php-passthru
      - id: micro-behaviors/process/create/shell/lang::popen
      - id: micro-behaviors/process/create/shell/lang::proc-open
      - id: micro-behaviors/process/create/shell/lang::pcntl-exec
      - id: micro-behaviors/data/string/replace::php-preg-eval-modifier
      - id: micro-behaviors/data/string/replace::php-mb-regex-eval-option
  # assert can be a boolean check, reflection need not invoke anything, and
  # FETCH_FUNC is ordinary callback dispatch. Do not call these execution.
  - id: php-encoded-content-dynamic-apis
    desc: Encoded-looking PHP with assertion or callback APIs
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/encoded::php-encoded-content
    any:
      - id: micro-behaviors/data/control-flow/assert::php-assert-call
      - id: micro-behaviors/process/interpreter/reflection/function::php-reflection-function
      - id: micro-behaviors/process/interpreter/reflection/function::php-pdo-fetch-callback
