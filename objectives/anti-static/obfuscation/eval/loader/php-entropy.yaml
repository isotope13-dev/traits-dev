defaults:
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - php
composite_rules:
- id: php-encoded-content-execution
  desc: High-entropy PHP with decoded execution
  crit: suspicious
  all:
  - id: metadata/file/encoding/container::php-encoded-content
  any:
  # Entropy and an unrelated execution call do not identify a loader.
  # Each alternative binds a decoding transformation to its execution sink.
  - id: micro-behaviors/process/interpreter/eval/decoded::php-eval-string-decoder
  - id: micro-behaviors/process/interpreter/eval/decoded::php-eval-inflate-decoder
  - id: micro-behaviors/process/interpreter/eval/decoded::php-eval-gzip-or-reverse-decoder
  - id: micro-behaviors/process/interpreter/eval/decoded::php-eval-pack-decoder
  - id: objectives/execution/payload/script-eval/transformed/shell::php-base64-shell-command
  unless:
  - id: metadata/file/magic/identity::php-archive
# Entropy plus an ordinary assertion/reflection/PDO callback adds no loader
# observation. Those neutral facts remain independently visible; only a bound
# decoder-to-execution relationship supports this objective.
