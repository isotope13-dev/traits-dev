defaults:
  platforms: [windows]
  for: [html, vbs]
composite_rules:
  - id: concealed-hta-base64-eval
    desc: Hidden WSH launches layered PowerShell eval
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.001,T1564.003
    all:
      - id: objectives/execution/interpreter/eval/invoke::encoded-base64-decode-to-iex
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-boolean-arguments
      - id: metadata/lang/source/syntax/call/relationship::wsh-reference-near-variable-call
