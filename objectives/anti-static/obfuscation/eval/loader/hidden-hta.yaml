defaults:
  platforms: [windows]
  for: [html, vbs]
composite_rules:
  - id: concealed-hta-base64-eval
    desc: Hidden WSH launches layered encoded PowerShell evaluation
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.001,T1564.003
    all:
      - id: objectives/execution/interpreter/eval/invoke::encoded-base64-decode-to-iex
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
      - id: micro-behaviors/process/create/exec::wsh-shell-variable-command
