defaults:
  platforms: [windows]
  for: [asp, vbs]
  attack: T1027,T1059.005
traits:
  # Unlike the numeric cluster, this binds the encoded literal to the helper
  # whose return value is passed to Execute. It does not infer the decoded
  # program's meaning: percent-decimal source may conceal any VBScript.
  - id: vbs-execute-percent-decimal-helper
    desc: Execute consumes a percent-decimal helper result
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^[ \t]*(<%[ \t]*)?Execute\s*\(\s*\w+\s*\(\s*"(%\d{2,5}){12,}"'
      exclude_html_comments: true
