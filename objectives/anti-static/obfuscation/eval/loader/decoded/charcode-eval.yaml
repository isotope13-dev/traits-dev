defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
composite_rules:
- id: js-large-offset-charcode-eval-loader
  desc: Packed JavaScript decoder feeds variable eval
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1140
  for:
  - javascript
  all:
  - id: micro-behaviors/data/decode/custom::fromcharcode-large-offset-expression
  - id: micro-behaviors/data/arithmetic::js-dense-subtraction-arithmetic
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
  unless:
  - id: metadata/path/directory::test-directory-component
- id: numeric-source-self-decoding-eval
  desc: Large numeric JavaScript source feeds eval
  crit: hostile
  conf: 0.96
  attack: T1059.007
  all:
  - id: metadata/file/text-distribution::js-extreme-digit-ratio-large-source
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/path/directory::test-directory-component
- id: numeric-array-call-eval-loader
  desc: Numeric character array feeds JavaScript eval
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.007
  near_bytes: 512
  all:
  - id: metadata/lang/source/literal/array::js-numeric-array-64-plus
  - id: micro-behaviors/data/decode/char-code::fromcharcode-arrow-map
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: well-known/lib/web/authoring/google-closure-library/
  - id: well-known/lib/ai/xenova-transformers::xenova-transformers-runtime-bundle
  - id: metadata/path/directory::test-directory-component
- id: js-layered-decoder-function-stage
  desc: Layered decoder feeds Function constructor
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1059.007
  for:
  - javascript
  scope: file
  all:
  - id: micro-behaviors/data/decode/custom::js-indexof-charcode-shift-decoder
  - id: micro-behaviors/data/decode/custom::js-octal-charcode-loop
  - id: micro-behaviors/data/encode/string::decimal-string-blob
  - id: micro-behaviors/metaprogramming/generation/function::js-new-function-variable-argument
  unless:
  - id: metadata/path/directory::test-directory-component
