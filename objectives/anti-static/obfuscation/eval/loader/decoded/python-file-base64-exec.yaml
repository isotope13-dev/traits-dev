# Nearby decoding and execution can indicate hidden source, but do not prove
# data flow. Never pool these operations across unrelated archive members.
defaults:
  for: [python, zip]
  platforms: [unix, windows]
composite_rules:
  - id: python-base64-decoded-source-execution
    desc: Base64 decoding near Python exec
    conf: 0.98
    crit: notable
    for: [python]
    scope: file
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/base64/call::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: python-import-time-base64-remote-stage
    desc: Import-time Base64 loader retrieves remote code
    crit: hostile
    conf: 0.999
    scope: outer
    for: [text, python, python-sdist, whl, zip]
    all:
      - id: objectives/anti-static/obfuscation/eval/loader/decoded::python-base64-decoded-source-execution
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: python-base64-dothebest-remote-stage
      - id: objectives/anti-static/obfuscation/eval/loader/decoded::python-module-scope-run-index-call
  - id: python-base64-source-downloads-and-runs-executable
    desc: Base64 source downloads and launches a program
    crit: hostile
    conf: 0.99
    scope: outer
    attack: T1027,T1105,T1059.006,T1195.002
    mbc: E1105
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::module-scope-exec-builtin
      - id: objectives/execution/payload/file-exec/command/fetch::python-setup-downloaded-executable-dynamic-run
  - id: python-base64-exec-source-fetches-to-temp
    desc: Base64 source fetches a URL and writes to temp
    crit: hostile
    conf: 0.97
    scope: outer
    attack: T1027,T1105,T1059.006
    all:
      - id: objectives/anti-static/obfuscation/encoding/content::python-aliased-base64-decode-exec
      - id: micro-behaviors/communications/http/lib/requests::requests-get-text
      - id: micro-behaviors/fs/path/temp::temp-path-segment
  - id: python-install-xor-evaluated-source
    desc: Install hook compiles and evaluates XOR-obfuscated source
    crit: hostile
    conf: 0.999
    scope: outer
    for: [python, python-sdist, zip, whl]
    attack: T1027,T1105,T1059.006,T1547.001,T1195.002
    mbc: E1105
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-xor-char-ordinals
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
      - id: metadata/file/line::single-long-line-outlier

traits:


  - id: python-base64-dothebest-remote-stage
    desc: Base64 payload names do the best host
    crit: suspicious
    for: [text]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)dothebest\.store/allow/inform\.php'

  - id: python-base64-source-fetches-and-spawns
    desc: Python Base64 source fetches and spawns
    crit: suspicious
    for: [text]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)requests\.get[\s\S]{0,200}subprocess\.Popen'

  - id: python-module-scope-run-index-call
    desc: Module-scope call invokes run_index
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?m)^[A-Za-z_]\w*\.run_index\s*\('

