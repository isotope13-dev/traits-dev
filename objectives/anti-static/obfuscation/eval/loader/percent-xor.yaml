defaults:
  for: [text, html, javascript]
  platforms: [unix, windows]
  attack: T1027
traits:
  - id: percent-encoded-nested-xor-eval
    desc: Percent-hidden XOR reconstruction feeds eval
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: url
      regex: 'String\.fromCharCode\([A-Za-z_$][\w$]*\^[A-Za-z_$][\w$]*\);\}eval\([A-Za-z_$][\w$]*\)'
composite_rules:
  - id: percent-hidden-charcode-xor-eval
    desc: Percent-hidden eval with character-code XOR
    crit: suspicious
    conf: 0.98
    all:
      - id: percent-encoded-nested-xor-eval
      - id: micro-behaviors/data/arithmetic::js-charcode-pair-xor
