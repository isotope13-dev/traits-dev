defaults:
  platforms: [windows, unix]
  for: [php]
  attack: "T1027,T1059.001"

composite_rules:
  - id: php-self-decoding-eval-loader
    desc: PHP self-reading loader evaluates an inflated payload
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/multi-layer::php-compiler-halt-loader
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: micro-behaviors/data/compress/library::gzinflate-call
