defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [php]
  attack: "T1027"

traits:
  - id: eval-gzinflate-base64
    desc: eval gzinflate base64 chain
    mbc: E1059
    attack: T1059.006
    conf: 0.98
    if:
      type: encoded
      regex: 'eval\s*\(\s*gzinflate\s*\(\s*base64_decode\s*\('
  - id: eval-gzuncompress-base64
    desc: eval gzuncompress base64 chain
    mbc: E1059
    attack: T1059.006
    conf: 0.99
    if:
      type: encoded
      regex: 'eval\s*\(\s*gzuncompress\s*\(\s*base64_decode\s*\('
  - id: create-function-eval-loader
    desc: create_function staged eval loader
    mbc: E1059
    attack: T1059.006
    conf: 0.96
    if:
      type: encoded
      regex: 'create_function\s*\([^)]{0,120}eval\s*\(\s*gzinflate\s*\(\s*base64_decode\s*\('
  - id: create-function-gzuncompress-loader
    desc: create_function gzuncompress stage
    mbc: E1059
    attack: T1059.006
    conf: 0.98
    if:
      type: encoded
      regex: 'create_function.{0,80}gzuncompress.{0,40}base64_decode'
      case_insensitive: true
  - id: create-function-base64-loader
    desc: create_function base64-decoded code loader
    mbc: E1059
    attack: T1059.006
    conf: 0.98
    if:
      type: text
      regex: 'create_function\s*\([^)]{0,80}base64_decode\s*\('
      case_insensitive: true

composite_rules:
  - id: php-embedded-compressed-eval
    desc: PHP eval with embedded compressed data
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: micro-behaviors/data/decompress/zlib::php-inflate-literal

  - id: php-self-decoding-eval-loader
    desc: Self-reading PHP loader evaluates inflated payload
    # Self-contained commercial protectors also use this loading mechanism.
    # No request-controlled execution or attacker objective is established.
    conf: 0.99
    all:
      - id: micro-behaviors/fs/read/self::compiler-halt-self-read
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: micro-behaviors/data/decompress/zlib::gzinflate-call
  - id: staged-eval-loader
    desc: Staged PHP eval loader
    mbc: E1059
    attack: T1059.006
    conf: 0.99
    any:
      - id: objectives/anti-static/obfuscation/string/concat::fragmented-eval-token
      - id: objectives/anti-static/obfuscation/string/case::mixedcase-base64-decode-fragments
      - id: eval-gzinflate-base64
      - id: eval-gzuncompress-base64
      - id: php-decompressed-byte-shift-eval-loader
      - id: objectives/anti-static/obfuscation/string/concat::fragmented-create-function-token
      - id: create-function-eval-loader
      - id: create-function-gzuncompress-loader
      - id: create-function-base64-loader
    unless:
      - id: well-known/app/publishing/wordpress-plugins/security::bitfire-plugin-path

  - id: php-create-function-decoded-loader
    desc: Creates and executes decoded function
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.006
    mbc: E1059
    all:
      - id: create-function-base64-loader
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call

  - id: php-decompressed-byte-shift-eval-loader
    desc: PHP loader evaluates decompressed byte-shifted payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.006
    mbc: E1059
    all:
      - id: micro-behaviors/data/compression::php-base64-wrapped-decompression
      - id: micro-behaviors/data/string/conversion::php-chr-of-ord
      - id: micro-behaviors/process/interpreter/eval/direct::php-eval-named-function-argument
