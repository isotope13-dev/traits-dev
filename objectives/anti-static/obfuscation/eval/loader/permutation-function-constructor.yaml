defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
composite_rules:
  - id: permuted-source-and-factory-key
    desc: Permutation hides source and code-factory key
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/eval/indirect::js-inline-transformed-factory-invocation
      - id: micro-behaviors/data/string/reorder::char-array-swap-and-join
  - id: permuted-global-require-code-factory-loader
    desc: Permutation loader conceals global require and code factory
    crit: suspicious
    conf: 0.98
    all:
      - id: permuted-source-and-factory-key
      - id: objectives/anti-static/obfuscation/string/reorder::global-require-permutation-obfuscation
      - id: metadata/lang/source/literal/array::repeated-large-integer-arrays
