defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: suspicious
  conf: 0.98
  attack: T1027,T1140
composite_rules:
- id: vbs-execute-hex-xor-code
  desc: Execute accompanies hex-pair XOR-23 decoding
  all:
  - id: micro-behaviors/data/decode/xor/reconstruction::vbs-hex-pair-xor23-character
  - id: metadata/lang/source/syntax/statement::execute-token-line
# The stronger source-concealment finding requires the recovered downloader
# semantics; hex/XOR conversion and Execute alone remain suspicious above.
- id: vbs-executed-xor-browser-downloader
  for: [html]
  desc: Concealed downloader source uses Execute
  crit: hostile
  all:
  - id: objectives/execution/payload/file-exec/command/browser-control::hex-xor23-concealed-browser-download-launch
  - id: micro-behaviors/data/decode/xor/reconstruction::vbs-pair-step-xor23-decoder
