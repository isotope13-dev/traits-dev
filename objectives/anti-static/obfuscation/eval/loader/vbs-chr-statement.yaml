defaults:
  for: [asp, vbs]
  platforms: [windows]
  crit: suspicious
  attack: T1027
  mbc: B0032

traits:
  - id: vbs-chr-execute-statement
    desc: Executes character-built script source
    conf: 0.97
    if:
      type: text
      regex: '(?im)^[ \t]*\w+\.ExecuteStatement\s*\(\s*"[^"\r\n]{1,32}"\s*&\s*Chr\s*\('
