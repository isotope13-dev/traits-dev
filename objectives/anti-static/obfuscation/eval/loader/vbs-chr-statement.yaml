defaults:
  for: [asp, vbs]
  platforms: [windows]
  crit: suspicious
  attack: T1027
  mbc: B0032

traits:
  - id: vbs-chr-execute-statement
    desc: Executes character-built script source
    conf: 0.97
    if:
      type: text
      regex: '(?im)^[ \t]*\w+\.ExecuteStatement\s*\(\s*"[^"\r\n]{1,32}"\s*&\s*Chr\s*\('
  # The bare statement form: two or more chained Chr() codes passed straight
  # to Execute. A single Chr() argument stays below the bar.
  - id: vbs-chr-assembled-execute
    desc: Executes Chr-assembled dynamic source
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bExecute(Global)?\s+Chr\(\d+\)\s*&\s*Chr\('

composite_rules:
  # The nibble table reconstructs one stage and that stage's own text is
  # Chr-assembled before evaluation: two nested encoding passes around one
  # dynamic evaluation. Reconstruction or Chr assembly alone is covered by
  # the atoms above and by string/numeric::vbscript-nibble-table-*.
  - id: vbs-nibble-chr-nested-stage
    desc: Nibble stage executes Chr-assembled source
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.005
    for: [vbs]
    all:
      - id: objectives/anti-static/obfuscation/string/numeric::vbscript-nibble-table-reconstruction
      - id: vbs-chr-assembled-execute
