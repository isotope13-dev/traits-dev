defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  # The two former conjunctions differ only in their corroborating context:
  # concatenation or WScript.Shell. Preserve their union as one observation.
  # Neither proves that the substring result reaches the evaluator.
  - id: vbs-stride-reconstruction-evaluation
    desc: Stride-like access with VBScript evaluation
    crit: suspicious
    conf: 0.94
    attack: T1027
    all:
      - id: micro-behaviors/data/string/access::vbs-mid-access-near-small-addition
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
    any:
      - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
