defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  # Concealed source reconstruction and evaluation are suspicious. They do
  # not alone prove an unauthorized payload or a source-to-evaluation flow.
  - id: vbs-stride-concatenation-with-evaluation
    desc: Stride-like reconstruction with VBScript eval
    crit: suspicious
    conf: 0.94
    attack: T1027
    all:
      - id: micro-behaviors/data/string/access::vbs-mid-access-near-small-addition
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
      - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
