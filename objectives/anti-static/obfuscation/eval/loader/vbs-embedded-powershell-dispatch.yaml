# VBScript loaders that carry a PowerShell stage in string literals and hide
# every command name: the PowerShell rebuilds names with a cyclic key
# subtraction, invokes the result through the call operator, and feeds many
# encoded script fragments to the same decoder with an execute flag.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1140

traits:
  # Same call shape as the batch carrier sibling: decoder 'base64' 1.
  - id: vbs-repeated-encoded-fragment-dispatch
    desc: Encoded script chunks passed to decoder
    crit: suspicious
    conf: 0.93
    count_min: 5
    if:
      type: text
      regex: "(?i)\\b[A-Za-z_]\\w*\\s+'[A-Za-z0-9+/]{20,}={0,2}'\\s+1\\b"

composite_rules:
  - id: vbs-stride-powershell-fragment-decryptor
    desc: Stride VBS stages PowerShell fragment decryptor
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.001,T1059.005
    all:
      - id: vbs-stride-reconstruction-evaluation
      - id: vbs-repeated-encoded-fragment-dispatch
      - id: metadata/lang/source/literal::vbs-embedded-powershell-numeric-array
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator
    any:
      - id: micro-behaviors/data/decode/charset::powershell-indexed-key-subtraction-character-decoder
      - id: micro-behaviors/data/decode/charset::powershell-cyclic-subtraction-character-decoder
      - id: micro-behaviors/data/decode/charset::powershell-modulo-index-key-subtraction
