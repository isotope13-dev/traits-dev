# VBScript loaders that carry a PowerShell stage in string literals and hide
# every command name: the PowerShell rebuilds names with a cyclic key
# subtraction, invokes the result through the call operator, and feeds many
# encoded script fragments to the same decoder with an execute flag.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1140

composite_rules:
  - id: vbs-stride-powershell-fragment-decryptor
    desc: VBS evaluates a fragmented encoded PowerShell stage
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.001,T1059.005
    all:
      - id: vbs-stride-reconstruction-evaluation
      - id: micro-behaviors/data/control-flow/direct-call::powershell-repeated-encoded-argument-calls
      - id: metadata/lang/source/literal/array::vbs-embedded-powershell-numeric-array
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
