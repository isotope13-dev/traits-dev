defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # This observation also matches protected browser-game SDKs. Neither the
  # response-to-evaluator link nor an attacker purpose follows from these
  # four file-scoped capabilities. Retain the concealment lead, without
  # classifying remote execution as an attack.
  - id: json-fetch-runtime-eval-xor-storage
    desc: JSON fetch, XOR, storage and evaluation co-occur
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-call-near-json-parse
      - id: micro-behaviors/data/arithmetic::indexed-xor-array-assignment
      - id: micro-behaviors/data/db/web-storage::browser-storage-persistence
    any:
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval
      - id: micro-behaviors/process/interpreter/eval/constructed::indirect-function-result-invocation
