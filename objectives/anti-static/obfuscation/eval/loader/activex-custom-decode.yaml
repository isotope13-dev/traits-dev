defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007

traits:
  - id: javascript-window-eval-alias
    desc: JavaScript aliases window eval
    crit: component
    if:
      type: text
      regex: '(?i)\b(var|let|const)\s+[a-z_$][a-z0-9_$]*\s*=\s*window\.eval\b'

composite_rules:
  - id: activex-custom-decoded-eval-stage
    desc: ActiveX loader decodes and evaluates stage
    crit: hostile
    conf: 0.98
    all:
      - id: javascript-window-eval-alias
      - id: objectives/execution/activex/com::activex-object-aliased-constructor
      - id: micro-behaviors/data/decode/quartet-base64::base64-character-index-loop
      - id: micro-behaviors/data/bitwise/xor/expression::js-ts-parsed-xor-expression
      - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block
      - id: metadata/file/encoding/base64::multiple-long-base64-literals
      - id: metadata/file/line::very-long-source-line
