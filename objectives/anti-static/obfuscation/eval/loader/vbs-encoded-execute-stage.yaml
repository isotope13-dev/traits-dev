# HTML-carried VBScript stagers whose encoded layer already resolves to
# network content and runs through dynamic evaluation. A recovered URL
# inside Base64 content alone is only staging, and Execute alone is only a
# language feature; instantiating COM objects through variable-held ProgIDs
# beside them shows the author hiding which objects the stage touches. A
# page that decodes a URL-bearing payload, evaluates it, and resolves its
# automation targets indirectly is a layered loader, not configuration or
# content.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1027,T1059.005
  mbc: B0032

composite_rules:
  - id: vbs-encoded-stage-indirect-execute
    desc: URL-bearing encoded stage runs through indirect evaluation
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/http-encoded::base64-decoded-http-url
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: micro-behaviors/os/com/automation::vbs-createobject-variable-progid
