defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1027

traits:
  - id: php-eval-string-decoder
    desc: Evaluates base64 or ROT13 decoder output
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      node: function_call_expression
      case_insensitive: true
      regex: '^eval\s*\(\s*(["'']\?>["'']\s*\.\s*)?(base64_decode|str_rot13)\s*\('
  - id: php-eval-inflate-decoder
    desc: Evaluates inflated decoder output
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      node: function_call_expression
      case_insensitive: true
      regex: '^eval\s*\(\s*(["'']\?>["'']\s*\.\s*)?(gzinflate|gzuncompress)\s*\('
  - id: php-eval-gzip-or-reverse-decoder
    desc: Evaluates gzip-decoded or reversed output
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      node: function_call_expression
      case_insensitive: true
      regex: '^eval\s*\(\s*(["'']\?>["'']\s*\.\s*)?(gzdecode|strrev)\s*\('
  - id: php-eval-pack-decoder
    desc: Evaluates packed PHP content
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      node: function_call_expression
      case_insensitive: true
      regex: '^eval\s*\(\s*(["'']\?>["'']\s*\.\s*)?pack\s*\('
  - id: php-eval-named-loader-call
    desc: Evaluates function output from long literal
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'eval\s*\(\s*[a-zA-Z_]\w*\s*\(\s*[''"][^''"]{20,}[''"]\s*\)\s*\)'

composite_rules:
  - id: php-eval-decoder-chain
    desc: Evaluates decoded PHP content
    crit: suspicious
    conf: 0.95
    any:
      - id: php-eval-string-decoder
      - id: php-eval-inflate-decoder
      - id: php-eval-gzip-or-reverse-decoder
      - id: php-eval-pack-decoder
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
      - id: well-known/app/publishing/wordpress-plugins::bitfire-plugin-path
      - id: well-known/tool/offensive/bingo/
    downgrade:
      any:
        - id: metadata/package/testing/presence/reconstruction::php-behavioral-reconstruction-context
