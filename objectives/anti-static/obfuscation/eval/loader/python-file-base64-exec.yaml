# Executing Base64-decoded values supports arbitrary source hidden in package
# data. Keep decoding and execution close in the same Python file.
defaults:
  for: [python, zip]
  platforms: [unix, windows]
composite_rules:
  - id: python-base64-decoded-source-execution
    desc: Python executes Base64-decoded source
    conf: 0.98
    crit: notable
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: python-import-time-base64-remote-stage
    desc: Import-time Base64 loader retrieves remote code
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/eval/loader::python-base64-decoded-source-execution
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: objectives/anti-static/obfuscation/eval/loader::python-module-scope-run-index-call

  - id: python-run-index-file-base64-exec
    desc: Python run_index helper reads and executes Base64 file contents
    crit: hostile
    conf: 0.98
    for: [python]
    near_lines: 12
    all:
      - id: python-run-index-def
      - id: python-base64-decoded-source-execution

traits:
  - id: python-run-index-def
    desc: Defines run_index file loader helper
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?s)\bdef\s+run_index\s*\([^)\n]{1,40}\)[\s\S]{0,160}\.read\(\)'
  - id: python-module-scope-run-index-call
    desc: Module-scope call invokes run_index
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?m)^[A-Za-z_]\w*\.run_index\s*\('

