# Executing Base64-decoded values supports arbitrary source hidden in package
# data. Keep decoding and execution close in the same Python file.
defaults:
  for: [python, zip]
  platforms: [unix, windows]
composite_rules:
  - id: python-base64-decoded-source-execution
    desc: Python executes Base64-decoded source
    conf: 0.98
    crit: notable
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: python-import-time-base64-remote-stage
    desc: Import-time Base64 loader retrieves remote code
    crit: hostile
    conf: 0.999
    scope: outer
    for: [text, python, python-sdist, whl, zip]
    all:
      - id: objectives/anti-static/obfuscation/eval/loader::python-base64-decoded-source-execution
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: python-base64-dothebest-remote-stage
      - id: objectives/anti-static/obfuscation/eval/loader::python-module-scope-run-index-call
  - id: python-import-time-base64-github-binary-stage
    desc: Import-time Base64 loader downloads and launches a hosted binary
    crit: hostile
    conf: 0.999
    scope: outer
    for: [python, python-sdist, zip, whl]
    attack: T1027,T1105,T1059.006,T1195.002
    mbc: E1105
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/process/create/subprocess/launch::python-process-launch-evidence
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: metadata/import/python/base64/b64decode::invoke
  - id: python-install-xor-evaluated-source
    desc: Install hook compiles and evaluates XOR-obfuscated source
    crit: hostile
    conf: 0.999
    scope: outer
    for: [python, python-sdist, zip, whl]
    attack: T1027,T1105,T1059.006,T1547.001,T1195.002
    mbc: E1105
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-xor-char-ordinals
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
      - id: metadata/file/line::single-long-line-outlier

  - id: python-run-index-file-base64-exec
    desc: Python run_index helper reads and executes Base64 file contents
    crit: hostile
    conf: 0.98
    for: [python]
    near_lines: 12
    all:
      - id: python-run-index-def
      - id: python-base64-decoded-source-execution

traits:
  - id: python-run-index-def
    desc: Defines run_index file loader helper
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?s)\bdef\s+run_index\s*\([^)\n]{1,40}\)[\s\S]{0,160}\.read\(\)'
  - id: python-base64-dothebest-remote-stage
    desc: Base64 payload names do the best host
    crit: suspicious
    for: [text]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)dothebest\.store/allow/inform\.php'

  - id: python-base64-source-fetches-and-spawns
    desc: Python Base64 source fetches and spawns
    crit: suspicious
    for: [text]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)requests\.get[\s\S]{0,200}subprocess\.Popen'

  - id: python-module-scope-run-index-call
    desc: Module-scope call invokes run_index
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?m)^[A-Za-z_]\w*\.run_index\s*\('

