defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
traits:
- id: indirect-ctor-decode-iife
  desc: Indirect constructor runs decoded blob inline
  crit: suspicious
  conf: 0.9
  attack: T1059.007
  if:
    type: text
    regex: \.constructor\.constructor\(\s*(Buffer\.from|atob)[\s\S]{0,160}\)\(\)
- id: indirect-ctor-transform-iife
  desc: Indirect ctor immediately invokes transform
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.constructor\.constructor\(\s*\w[\w$.]{0,40}\([\s\S]{0,160}\)\(\)
- id: decoded-property-constructor
  desc: Dynamic property reaches Function constructor
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b\w+\[\w+\]\.constructor\.constructor\s*\(
- id: empty-arrow-double-computed-constructor
  desc: Empty arrow double computed constructor
  crit: suspicious
  conf: 0.96
  attack: T1027,T1059.007
  if:
    type: text
    regex: \(\(\)\s*=>\s*\{\s*\}\)\s*\[[^\]]{1,80}\]\s*\[[^\]]{1,80}\]\s*\(
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
composite_rules:
- id: packaged-shift-decoder-function-loader
  desc: Packaged shift-decoded payload executes with Node globals
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1140
  scope: file
  near_lines: 240
  all:
  - id: micro-behaviors/fs/read/file/target::read-package-relative-file
  - id: objectives/anti-static/obfuscation/encoding/arithmetic::js-fromcharcode-mod-256-decode
  - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
  - id: micro-behaviors/data/property/access::repeated-constructor-property-read
  - id: metadata/lang/source/syntax/call/arguments::js-call-with-node-globals
  - id: micro-behaviors/data/control-flow/module-exec::js-module-exports
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
- id: empty-arrow-computed-function-stage
  desc: Obfuscated empty-arrow Function stage
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.007
  mbc: B0032,B0009.016
  scope: leaf
  near_bytes: 4096
  all:
  - id: empty-arrow-double-computed-constructor
  - id: micro-behaviors/data/control-flow/dispatch/computed::computed-receiver-new-constructor
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
  any:
  - id: micro-behaviors/data/decode/char-code::fromcharcode-apply-array
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  - id: micro-behaviors/data/string/search::js-alphabet-indexof-lookup
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
- id: self-decoding-runtime-loader
  desc: Module decodes an embedded blob into an indirect eval sink
  crit: hostile
  conf: 0.95
  attack: T1059.007
  all:
  - id: indirect-ctor-transform-iife
  any:
  - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
  - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
  - id: micro-behaviors/data/decode/base64/call::buffer-from-base64-to-utf8
  - id: micro-behaviors/data/decode/base64/call::atob-decode
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
- id: blob-fed-indirect-eval
  desc: Embedded base64 blob executed via indirect eval sink
  crit: hostile
  conf: 0.94
  attack: T1059.007
  all:
  - id: indirect-ctor-transform-iife
  - id: metadata/file/encoding/base64::multiple-long-base64-literals
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
- id: massive-unicode-string-function-loader
  desc: Function constructor body is an enormous Unicode-escaped string
  crit: notable
  conf: 0.98
  attack: T1027,T1059.007
  all:
  - id: objectives/anti-static/obfuscation/eval/function::function-body-unicode-escape-blob
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-javascript-unicode-escape-volume
  - id: metadata/lang/source/literal/string/population::js-max-string-over-128k
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
