defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
composite_rules:
- id: decoded-function-near-fetch-response
  desc: Base64-decoded JavaScript Function near a fetched response
  crit: suspicious
  conf: 0.93
  attack: T1027.002,T1059.007
  mbc: B0032
  for:
  - javascript
  near_bytes: 4096
  all:
  - id: micro-behaviors/metaprogramming/generation/function::function-from-decoder-or-buffer
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
- id: js-obfuscated-stage-computed-execution
  desc: JavaScript decodes stage before dynamic execution
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1059.007
  mbc: B0032
  for:
  - javascript
  scope: file
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
  any:
  - id: objectives/anti-static/obfuscation/reflection/indirect::js-computed-charcode-call
  - id: micro-behaviors/metaprogramming/generation/function::js-new-function-variable-argument
- id: js-obfuscated-global-bootstrap-stage
  desc: JavaScript bootstraps global object before decoded stage execution
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1059.007
  mbc: B0032
  for:
  - javascript
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
  - id: objectives/anti-static/obfuscation/reflection/indirect::js-computed-charcode-call
  - id: micro-behaviors/metaprogramming/generation/function::function-ctor-call-expr-arg
- id: minified-charcode-indirect-eval
  desc: Minified bundle combines character-code reconstruction and indirect eval
  crit: suspicious
  conf: 0.9
  attack: T1027, T1059.007
  mbc: B0032
  all:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: micro-behaviors/data/decode/xor/reconstruction::fromcharcode-xor-rebuild
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
- id: js-escaped-indirect-eval-layered-loader
  desc: Escaped fragments feed an indirect eval loader
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.007,T1140
  for:
  - javascript
  size_min: 20000
  all:
  - id: objectives/anti-static/obfuscation/reflection/indirect::sequence-expression-global-computed-access
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-javascript-unicode-escape-volume
  any:
  - id: objectives/anti-static/obfuscation/string/concat::js-unicode-escape-fragment-seam
  - id: objectives/anti-static/obfuscation/string/concat::js-eval-name-split-concat
  - id: micro-behaviors/data/string/concat/expression::massive-string-concatenation
- id: js-depth-capped-indirect-global-script
  desc: Depth-capped script uses computed global lookup
  crit: suspicious
  conf: 0.94
  attack: T1027,T1059.007
  for:
  - javascript
  all:
  - id: metadata/lang/javascript-features::js-ast-depth-cap-reached
  - id: objectives/anti-static/obfuscation/reflection/indirect::sequence-expression-global-computed-access
- id: js-hex-xor-atob-filter-constructor-stage
  desc: Hex/XOR decoders with concealed Function calls
  crit: suspicious
  conf: 0.98
  attack: T1027,T1059.007
  near_bytes: 131072
  all:
  - id: micro-behaviors/data/decode/custom::js-hex-xor-character-decode
  - id: micro-behaviors/data/decode/base64/call::js-atob-call-or-callback
  - id: micro-behaviors/metaprogramming/generation/function::js-array-filter-constructor-split
- id: large-encoded-string-indirect-eval-loader
  desc: JavaScript carries many encoded strings and executes an indirect eval
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.007
  all:
  - id: metadata/file/line::multiple-lines-over-1000-chars
  - id: metadata/lang/source/literal/string/population::js-many-very-long-strings
  - id: metadata/lang/source/literal/string/population::js-high-encoded-string-ratio
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  unless:
  - id: metadata/path/directory::test-directory-component
  mbc: B0032
