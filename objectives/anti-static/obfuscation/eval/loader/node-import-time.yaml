# A custom string-table decoder surrounding a Function constructor is
# especially dangerous when the same package detaches execution from its
# importer.
# Keep this archive-level rule independent of any particular URL or token.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: obfuscated-global-require-loader
    desc: Obfuscated JavaScript loader aliases require through global state
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: micro-behaviors/data/source/property/computed::js-global-require-alias
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::global-require-module-aliasing
      - id: objectives/anti-static/obfuscation/eval/dynamic::loader-iife-tail
    any:
      - id: metadata/lang/javascript-features::global-underscore-v-assignment
      - id: metadata/file/profile/identity::js-compact-hyphenated-identifier
    unless:
      - id: objectives/command-and-control/dropper/delivery/blockchain::obfuscated-etherhiding-hex-stage-dropper

  # The decoder and the Function constructor have to be in ONE file, or the
  # claim is not about a payload at all: at archive scope a 400-file package
  # pairs a unit test's `new Function` with an unrelated CLI daemon spawn and
  # some obfuscated module, none of which share a code path.
  - id: obfuscated-function-constructor-payload
    desc: String-table obfuscation surrounds Function constructor
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      # Browser automation intentionally compiles a user-supplied expression
      # for page.evaluate(); the CDP adapter shape is not a hidden loader.
      - id: micro-behaviors/process/create/script/automation::browser-cdp-evaluate-adapter

  - id: detached-obfuscated-function-loader
    desc: Package combines detached child and obfuscated Function loader
    crit: hostile
    conf: 0.98
    attack: "T1027.002,T1059.007,T1059"
    # Still archive-scoped for the detach leg: a launcher and the payload it
    # backgrounds legitimately live in different files of the same package.
    scope: archive
    all:
      - id: obfuscated-function-constructor-payload
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
