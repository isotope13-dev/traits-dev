# Requires a linked, hidden remote execution stage before inferring concealment.
# No package name, filename, campaign key or network endpoint gates this rule.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  mbc: B0032
composite_rules:
  - id: byte-encoded-table-conceals-remote-stage
    desc: Byte-encoded table conceals remote execution stage
    crit: hostile
    conf: 0.99
    attack: T1027
    all:
      - id: objectives/execution/payload/script-eval/network/decoded::fetch-xor-eval-detached-spawn-stage
      - id: objectives/anti-static/obfuscation/string/array::double-encoded-rotated-string-table
  - id: js-flattened-switch-remote-function-stage
    desc: Switch-flattened loader executes fetched Function stage
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007,T1105
    size_max: 200000
    all:
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::js-pipe-sequence-switch-flattening
      - id: micro-behaviors/communications/http/request/reference::js-fetch-invocation-surface
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
