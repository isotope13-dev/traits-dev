# Requires a linked, hidden remote execution stage before inferring concealment.
# No package name, filename, campaign key or network endpoint gates this rule.
defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: byte-encoded-table-conceals-remote-stage
    desc: Byte-encoded table conceals remote execution stage
    crit: hostile
    conf: 0.99
    attack: T1027
    mbc: B0032
    all:
      - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::fetch-xor-eval-detached-spawn-stage
      - id: objectives/anti-static/obfuscation/string/array::double-encoded-rotated-string-table
