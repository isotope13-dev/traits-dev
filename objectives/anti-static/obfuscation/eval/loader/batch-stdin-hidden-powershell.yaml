# Hidden stdin execution plus a character decoder supports concealment.
# Neither hidden launch nor the pipe alone establishes a hostile payload.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027,T1059.001
traits:
  # A repeated decoder call with opaque script-sized arguments is distinct
  # from a batch that merely carries a single encoded command. In this shape,
  # each call returns a fragment that the hidden PowerShell's dynamic command
  # path executes.
  - id: batch-repeated-base64-decoder-dispatch
    desc: Encoded script chunks passed to decoder
    crit: suspicious
    conf: 0.94
    count_min: 8
    if:
      type: text
      regex: "(?i)\\b[A-Za-z_]\\w*\\s+'[A-Za-z0-9+/]{20,}={0,2}'\\s+1\\b"
composite_rules:
  - id: batch-hidden-powershell-with-character-decoder
    desc: Hidden PowerShell stdin with character decoder and variable calls
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/io/stream::batch-echo-variable-to-command-stdin
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/interpreter/eval/indirect::powershell-variable-call
      - id: micro-behaviors/data/decode/charset::powershell-cyclic-subtraction-character-decoder

  - id: batch-hidden-powershell-repeated-decoded-script-dispatch
    desc: Hidden batch PowerShell repeatedly decodes and executes script fragments
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.003,T1140
    all:
      - id: batch-hidden-powershell-with-character-decoder
      - id: batch-repeated-base64-decoder-dispatch
      - id: objectives/anti-static/obfuscation/padding::powershell-math-call-noise
