defaults:
  platforms: [unix, windows]
  for: [binaries]
  attack: T1027
  mbc: B0032
composite_rules:
  - id: packed-exec-versioned-managed-marker
    desc: Versioned managed bundle marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework::dotnet-assembly
  - id: packed-binary-process-execution
    desc: Packed binary process execution
    crit: notable
    conf: 0.9
    size_max: 52428800
    all:
      - id: objectives/anti-static/pack/
      - id: micro-behaviors/process/create/exec::binary-process-execution
    unless:
      - id: well-known/game/steam/
      - id: well-known/tool/development/qemu
    downgrade:
      any:
        - id: well-known/app/system/drivers/
  - id: packed-temp-staging-resource-payload
    desc: Packed temp-staging resource payload
    crit: suspicious
    conf: 0.9
    size_max: 52428800
    all:
      - id: objectives/anti-static/pack/
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
    any:
      - id: metadata/binary/section/metrics::high-entropy-rdata-section
      - id: objectives/anti-static/obfuscation/payload/resource::large-icon-resource
      - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
      - id: micro-behaviors/process/terminate/kill::terminate-process
    unless:
      # A .NET self-contained bundle extracts its embedded payload to a temp
      # directory by design ("Files embedded within the bundle will be
      # extracted"), and the host legitimately launches helpers via
      # ShellExecute -- that is the packaging format, not a packed payload
      # (e.g. GitVersion's GitVersion.exe, a 44MB apphost stub).
      - id: metadata/binary/framework::dotnet-runtime-host-stub
      # IObit Advanced SystemCare's main app stages its updater payload the
      # same way; the verified vendor identity marks the known-benign suite.
      - id: well-known/app/system/iobit::iobit-signed-component-context
      # A compiled AutoIt script carries the whole AutoIt runtime, and that runtime
      # is a Windows automation library: clipboard read/write, keyboard and mouse
      # state polling, window enumeration, host and locale queries, and temp-file
      # extraction of its own embedded script. Every compiled .au3 therefore shows
      # the full API surface regardless of what the script does -- Closure
      # Library's CI helper is 30 lines that close a dialog box.
      - id: metadata/lang/compiled::autoit-compiled-script
      # Wine's `unicows.dll` is the Unicode-layer stub.
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      - id: well-known/game/steam/
      - id: well-known/tool/development/qemu
  - id: packed-process-recognized-marker
    desc: Recognized packed binary process execution marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/binary/section/names::upx-section
      - id: metadata/binary/installer/family::known-benign-installer
      - id: well-known/app/system/crayens::crayens-installer
      - id: well-known/app/system/dlink-wlan::dlink-wlan-application
      - id: metadata/binary/vendor::benign-unsigned-microsoft-import-heavy-context
      - id: well-known/app/browser/internet-explorer::internet-explorer-frame-component
      - id: well-known/lib/runtime/mozilla-nspr::nspr-library
      - id: objectives/anti-static/pack/asprotect::asprotect-protector-application
      - id: metadata/library/data::pybind11-marker
      - id: well-known/tool/reverse-engineering/
      - id: well-known/lib/platform/easyhook::easyhook-library
      - id: micro-behaviors/os/service/config::printer-setup-helper
      - id: well-known/app/storage/belkin-local-backup::belkin-local-backup
      - id: metadata/binary/installer/sfx::freearc-sfx
      - id: well-known/app/infrastructure/atlantis::atlantis-word-processor-installer
      - id: metadata/library/accessibility::jabswitch-cli-banner
      - id: metadata/binary/layout::import-rich-versioned-pe
      - id: metadata/binary/framework::dotnet-assembly
      - id: well-known/tool/sysadmin/container/
      - id: well-known/lib/runtime/jvm
      - id: well-known/lib/native/jffi::jffi-native-basename
      - id: metadata/binary/linking/runtime::dotnet-host-runtime
      - id: well-known/app/utility/ventoy::ventoy-imdisk-helper
      - id: metadata/binary/linking/runtime::ape-binary-marker
      - id: well-known/app/ai/tool-server/mcu-ai-debug::helper-binary
      - id: well-known/app/development/plutolang::runtime-compiler
      - id: well-known/lib/media/sharp-libvips/
