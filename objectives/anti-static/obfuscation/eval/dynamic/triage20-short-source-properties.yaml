defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: suspicious
traits:
- id: javascript-eval-base64-result
  desc: JavaScript eval receives Base64 decoded data
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: eval
    arg:
      index: 0
      from:
        call: ^(atob|base64Decode|base64_decode)$
        literal: '[A-Za-z0-9+/]{9,}'
  unless:
  - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
  - id: micro-behaviors/process/interpreter/eval/direct::eval-parenthesized-expression
  - id: objectives/supply-chain/trojanized/library/module-init::javascript-atob-eval-ethereum-stager
  - id: objectives/command-and-control/channel/deaddrop/blockchain::javascript-obfuscated-blockscout-ethereum-deaddrop-loader
  - id: well-known/tool/development/testing/mabl::mabl-cli-runtime-context
  - id: micro-behaviors/process/interpreter/node::node-eval-command
  - id: metadata/package/testing/harness/fixture::inert-detection-fixture-in-test-data
  - id: metadata/package/testing/corpus/security-tests/scanner::js-scanner-rule-id-test-context
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/corpus/security-tests/scanner::js-scanner-rule-id-test-context
composite_rules:
- id: xor-decoder-near-javascript-eval
  desc: Eval near Base64 and repeating-key XOR
  conf: 0.9
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/decode/base64/call::base64-decode-call-text
  - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
