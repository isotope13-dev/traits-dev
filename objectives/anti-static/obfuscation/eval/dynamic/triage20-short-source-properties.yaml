defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
- id: javascript-eval-base64-result
  desc: JavaScript eval receives Base64 decoded data
  crit: suspicious
  conf: 0.95
  # Bind the decoder result to the eval argument. Nearby independent helpers
  # in rule engines, codecs, and parsers are not evidence of encoded eval.
  if:
    type: symbol
    kind: call
    exact: eval
    arg:
      index: 0
      from:
        call: '^(atob|base64Decode|base64_decode)$'
        # Six decoded bytes is a label. A runtime argument has no literal
        # here; the text rule eval-atob still covers eval(atob(blob)).
        literal: '[A-Za-z0-9+/]{9,}'
  unless:
  - id: well-known/lib/
  - id: well-known/tool/detection/
  - id: metadata/lang/source/syntax/call/invocation::markup-or-decoded-alert-calls
  - id: micro-behaviors/process/interpreter/eval/direct::eval-parenthesized-expression
  - id: objectives/supply-chain/trojanized/library/module-init::javascript-atob-eval-ethereum-stager
  - id: objectives/command-and-control/channel/deaddrop/blockchain::javascript-obfuscated-blockscout-ethereum-deaddrop-loader
  - id: metadata/package/testing/
  - id: well-known/tool/development/testing/mabl::mabl-cli-runtime-context
  - id: micro-behaviors/process/interpreter/node::node-eval-command

composite_rules:
- id: xor-decoder-near-javascript-eval
  desc: Eval near Base64 and repeating-key XOR
  crit: suspicious
  conf: 0.9
  near_bytes: 2048
  # Repeating-key byte mutation adds actual concealment evidence. This is
  # deliberately described as proximity: it does not prove interprocedural
  # transfer from a decoder helper to the evaluator.
  all:
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
  - id: micro-behaviors/data/decode/xor::js-repeating-key-buffer-xor-loop
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
