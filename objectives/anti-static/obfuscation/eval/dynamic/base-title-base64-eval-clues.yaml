defaults:
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: base-title-base64-eval-clues
    desc: Base-title text and Base64 eval clues
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: metadata/lang/source/literal/string/property::base-title-attribute-or-encoded-text
      - id: objectives/anti-static/obfuscation/eval/dynamic::eval-atob
  # Staging claim for the XOR-encrypted inline stage: the page carries its
  # own key (Base64) and ciphertext and evaluates the rebuild. The
  # concealment half convicts in encoding/xor::atob-keyed-xor-eval-loader;
  # this names the embedded-stage execution.
