# Injected page stub that evaluates arithmetic-encoded character codes with
# an evaluator whose name is derived from the date, then evaluates the
# rebuilt script: two layers of indirection with no benign use.
defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: date-keyed-eval-arithmetic-charcode
    desc: Date-keyed eval rebuilds arithmetic-coded script
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/encode/char-code::arithmetic-charcode-expression-list
      - id: micro-behaviors/process/interpreter/eval/javascript::date-derived-eval-name
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
