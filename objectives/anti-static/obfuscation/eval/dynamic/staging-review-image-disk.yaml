composite_rules:
- platforms:
  - windows
  for:
  - iso
  - data
  attack: T1027,T1059.001
  id: iso-powershell-stride-dynamic-call
  desc: ISO PowerShell stride decoder and dynamic call
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/format/iso/structure::primary-volume-descriptor
  - id: metadata/file/format/iso/payload::iso-powershell-stride-decoder
  - id: metadata/file/format/iso/payload::iso-powershell-command-line
  - id: metadata/file/format/iso/payload::iso-powershell-dynamic-call
