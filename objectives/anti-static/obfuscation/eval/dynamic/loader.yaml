defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
traits:
  # A named field pulled off an HTTP `.data` response object. Benign on its own
  # (res.data.token is everywhere), so component-only — meaningful only when the
  # extracted field is fed to a dynamic-code evaluator nearby (composite below).
  - id: response-data-field-ref
    desc: Named field extracted from HTTP response
    crit: component
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\.data\.([Cc]ookie|payload|script|code)\b'
  # Some loaders use an API-shaped record and optional chaining instead of a
  # direct `.data.payload` field. Keep this as a component: the field name is
  # not hostile until a dynamic-code sink consumes it.
  - id: optional-response-record-value-ref
    desc: Optional-chained response record value
    crit: notable
    conf: 0.94
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\.data\s*\?\.\s*record\s*\?\.\s*value\b'
  # JSON.parse followed by selecting an executable-looking field is the
  # useful fact here; the field name alone is intentionally not suspicious.
composite_rules:
  - id: loader-iife-tail
    desc: Loader IIFE follows dynamic loader code
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-trailing-iife-closure
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/interpreter/eval/compile::new-function-iife
      - id: micro-behaviors/os/module/require::js-side-effect-require
      - id: micro-behaviors/data/property/assign::js-global-require-alias
    near_bytes: 1200
  - id: request-parsed-json-function-loader
    desc: HTTP JSON field executed through a Function constructor
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1105
    for:
      - javascript
      - typescript
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/request/client::request-import
      - id: micro-behaviors/data/parse/json::json-parse-code-field-read
    any:
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor-require-parameter
  - id: iife-axios-dynamic-eval
    desc: IIFE combines an Axios request with dynamic evaluation
    crit: suspicious
    conf: 0.95
    for:
      - javascript
      - typescript
    size_max: 262144
    near_lines: 80
    all:
      - id: loader-iife-tail
      - id: micro-behaviors/communications/http/get::axios-get-call
    any:
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
