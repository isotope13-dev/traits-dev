defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
traits:
  - id: eval-atob
    desc: Evaluates Base64 data decoded by atob
    crit: suspicious
    conf: 0.95
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      - id: well-known/tool/detection/agent-glovebox::decoded-eval-fixture-context
      - id: metadata/package/testing/harness/fixture::inert-detection-fixture-in-test-data
      - id: metadata/package/testing/corpus/security-tests/scanner::js-scanner-rule-id-test-context
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/detection/sofagent::package-context
        - id: metadata/package/testing/corpus/security-tests/scanner::js-scanner-rule-id-test-context
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '^atob$'
