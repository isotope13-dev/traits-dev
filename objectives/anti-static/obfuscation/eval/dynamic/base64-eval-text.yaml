defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
traits:
  - id: eval-atob
    desc: Evaluates Base64 data decoded by atob
    crit: suspicious
    conf: 0.95
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/detection/sofagent::package-context
    if:
      type: text
      regex: '[''"`]?eval\(\s*atob\s*\([^)\n]{0,48}'
    not:
      - regex: ^['"`]
      - regex: atob\s*\(\s*["'][A-Za-z0-9+/]{1,8}={0,2}["']
