defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
- id: jscript-conditional-eval-string-clues
  desc: "Conditional JScript eval with string clues"
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/process/interpreter/scripting::jscript-cc-eval
  any:
  - id: micro-behaviors/data/string/split::js-split-string-property-access
  - id: metadata/file/line::source-lines-over-1000
  - id: metadata/lang/javascript-features::js-comma-sequence-count-5
  attack: "T1027"
  mbc: "B0032"
- id: js-nested-object-table-eval
  desc: "JavaScript eval and encoded object table"
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/data/encode/map::js-nested-object-table-mapping
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  attack: "T1027"
  mbc: "B0032"
- id: js-comma-map-split-eval
  desc: JavaScript eval with map and split clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/lang/javascript-features::js-comma-sequence-count-5
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  - id: micro-behaviors/data/encode/map::js-short-key-character-entry
  - id: micro-behaviors/data/string/split::js-split-string-property-access
  unless:
  - id: metadata/build/bundler/asset::js-known-bundler-output
  # Comma sequences, short keys, split and eval all occur somewhere in any
  # multi-megabyte minified bundle (Bun/esbuild output with mangled helpers).
  - id: metadata/build/minifier::js-large-minified-bundle
