# Self-decrypting eval loader: the script copies a literal into a char-code
# array, runs several masked byte rounds over it, XORs each byte with a key
# while rebuilding the text, and evaluates the result. Seen as the injected
# stub on compromised sites; no packer or minifier emits this shape.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: byte-cipher-rounds-decoded-to-eval
    desc: Evaluates text decrypted by byte-array cipher rounds
    crit: hostile
    conf: 0.95
    attack: T1027
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/encode/char-code::charcode-byte-array-assignment
      - id: micro-behaviors/data/bitwise/mask::js-indexed-byte-mask-rounds
      - id: micro-behaviors/data/decode/xor/reconstruction::js-array-xor-character-reconstruction
      - id: micro-behaviors/process/interpreter/eval/javascript::eval-call-text
