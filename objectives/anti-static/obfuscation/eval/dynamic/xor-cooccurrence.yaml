composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: xor-reconstruction-near-variable-eval
  desc: XOR reconstruction near variable eval
  crit: suspicious
  conf: 0.94
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  any:
  - id: micro-behaviors/data/string/conversion::js-xor-character-code
  - id: micro-behaviors/data/encode/xor::embedded-js-xor-character-code
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
  - id: well-known/lib/development/vscode::vscode-extension-out-output-path
  - id: well-known/dual-use/packaging/javascript-obfuscator::tool-option-surface-context
