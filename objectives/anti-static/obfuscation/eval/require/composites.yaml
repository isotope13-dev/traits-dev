defaults:
  platforms: [unix, windows, macos]
  for: [javascript, typescript]
  attack: T1059.007
  mbc: B0032
composite_rules:
  - id: base64-decode-require-exec
    desc: Base64 decode near require-enabled Function
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
    downgrade:
      any:
        - id: metadata/library/structure::js-large-module-bundle
        - id: metadata/build/recognized-contexts::benign-build-tooling-context

  - id: remote-json-base64-require-execution
    desc: Remote JSON Base64 payload reaches require-enabled Function
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1105,T1140
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg

  - id: encoded-require-function-loader
    desc: Encoded require-enabled Function loader
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg-base64
      - id: metadata/file/metrics::source-lines-over-1000
    any:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2

  - id: shift-cipher-require-exec
    desc: Shift-cipher decode into require-enabled Function
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg
      - id: micro-behaviors/data/encode/charcode::charcodeat-arithmetic
      - id: micro-behaviors/data/decode/custom::fromcharcode-map-array
