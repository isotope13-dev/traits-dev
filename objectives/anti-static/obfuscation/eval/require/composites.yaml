defaults:
  platforms:
  - unix
  - windows
  - macos
  for:
  - javascript
  - typescript
  attack: T1059.007
  mbc: B0032
composite_rules:
- id: base64-decode-require-exec
  downgrade:
    scope: archive
    any:
      - id: well-known/tool/detection/agent/cc-audit::cc-audit-source-package-identity
  desc: Base64 decode near require-enabled Function
  crit: suspicious
  conf: 0.95
  near_bytes: 1024
  all:
  - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
  - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
  unless:
  - id: well-known/tool/detection/agent/cc-audit::bypass-fixture-context
  - id: metadata/path/directory::test-directory-component
  # A bundler's own module evaluator: the CommonJS wrapper with __filename/__dirname runs code the
  # build produced from local sources, and its base64 calls decode assets or loader metadata.
  - id: bundler-commonjs-evaluator-wrapper
- id: atob-decode-require-function-exec
  desc: Base64 decode near require-invoked Function
  crit: hostile
  conf: 0.98
  near_bytes: 1024
  all:
  - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require
  - id: micro-behaviors/os/module/require::require-function-passed-to-call
  - id: micro-behaviors/data/decode/base64/call::atob-decode
  unless:
    - id: metadata/path/directory::test-directory-component
- id: encoded-require-function-loader
  desc: Encoded require-enabled Function loader
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg-base64
  - id: metadata/file/line::source-lines-over-1000
  any:
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
- id: shift-cipher-require-exec
  desc: Shift-cipher decode into require-enabled Function
  crit: hostile
  conf: 0.97
  near_bytes: 2048
  all:
  - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
  - id: micro-behaviors/data/encode/charcode::charcodeat-arithmetic
  - id: micro-behaviors/data/decode/char-code::fromcharcode-map-array
