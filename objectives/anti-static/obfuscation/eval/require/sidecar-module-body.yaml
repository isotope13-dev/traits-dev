# The module's real body lives in a sidecar blob next to it.
#
#   const b = fs.readFileSync(__dirname + '/extension.bin');
#   for (let i = 0; i < b.length; i++) b[i] ^= 170;
#   const d = zlib.brotliDecompressSync(b).toString();
#   new Function('exports','require','module','__filename','__dirname', d)(...)
#
# That is the whole of `extension.js` in the VS Code extension
# "Viettel.vjc-java-pack" -- 290 bytes claiming to compile Java. The 32KB it
# actually runs is a password-gated chat client with hardcoded API keys for
# third-party LLM proxies, and none of it is visible to a reviewer reading the
# package or to a scanner that stops at the file it can parse.
#
# The published module is legible and does nothing; the bytes beside it are
# high-entropy and do everything. Match the handoff -- a local blob read,
# byte-mutated, decompressed, and handed to the CommonJS wrapper -- because
# the payload behind it is different in every sample.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, vsix, archives]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: sidecar-blob-decoded-into-module-body
    desc: Runs a decoded sidecar blob as its module body
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/fs/path/construct::script-dirname-ref
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-node-module-wrapper
    # One transform is enough. A variant that only compresses, or only XORs,
    # is concealing the same thing; requiring both would leave half of them
    # unmatched, and a second tier for that case would only report the same
    # handoff twice.
    any:
      - id: micro-behaviors/data/buffer::indexed-byte-xor-mutation
      - id: micro-behaviors/data/decompress/brotli::node-brotli-decompress-function
      - id: micro-behaviors/data/decompress/gzip::node-gunzip-function
      - id: micro-behaviors/data/decompress/zlib::node-inflate-function
