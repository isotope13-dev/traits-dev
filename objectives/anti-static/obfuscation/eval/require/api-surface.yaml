# API-surface proliferation for decoded-payload execution.
#
# Supply-chain malware loaders often expose multiple module functions
# whose names contain decode/decrypt/run/exec/final variants, all of
# which ultimately wrap a `new Function(require, ...)` invocation on a
# decrypted payload. The naming proliferation is itself the signal —
# real libraries normalize on one or two well-named entry points; only
# packages whose primary purpose is "run this decoded blob" produce 4+
# differently-named decoder/runner exports converging on the same eval.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007
  mbc: B0024
traits:
  - id: decrypt-named-function-decl
    desc: Function whose name contains Decrypt
    crit: notable
    conf: 0.5
    count_min: 1
    if:
      type: text
      regex: '(?m)^\s*function\s+\w*[Dd]ecrypt\w*\s*\('
    unless:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
  - id: run-named-function-decl
    desc: 3+ functions whose names contain Run
    crit: component
    conf: 0.5
    count_min: 3
    if:
      type: text
      regex: '(?im)^\s*function\s+\w*run\w*\s*\('
  - id: exec-named-function-decl
    desc: 3+ functions whose names contain Exec
    crit: component
    conf: 0.5
    count_min: 3
    if:
      type: text
      regex: '(?im)^\s*function\s+\w*exec\w*\s*\('
composite_rules:
  - id: multi-decode-eval-api-surface
    desc: Many decode-named exports share eval body
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor-require-parameter
    any:
      - id: metadata/file/function::multiple-decode-named-functions
      - id: decrypt-named-function-decl
      - id: run-named-function-decl
      - id: exec-named-function-decl
    needs: 2
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/asset::js-large-module-bundle
