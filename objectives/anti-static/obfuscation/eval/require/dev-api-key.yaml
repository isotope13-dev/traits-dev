defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_min: 512
  size_max: 500000000
composite_rules:
  # These observations may be unrelated within a file; they do not prove that
  # decoded environment contents flow into the function constructor.
  - id: dev-api-key-atob-and-require-constructor
    desc: DEV_API_KEY atob text and require constructor
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/call/arguments::atob-dev-api-key-text
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require
