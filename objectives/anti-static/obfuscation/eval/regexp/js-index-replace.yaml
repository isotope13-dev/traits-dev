# Six-argument eval packer whose parameters are obfuscated names, plus the
# RegExp that rebuilds dictionary words by index before that eval runs.
defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: renamed-six-arg-eval-packer
    desc: Eval of a six-argument decoder
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'eval\(function\(_0x\w{1,6}(,_0x\w{1,6}){5}\)\{while\('
  - id: regex-index-word-rebuild
    desc: RegExp rebuilds words from an index
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'new RegExp\(\w{1,20}\[4\]\+\s*\w+\+\s*\w{1,20}\[4\]'
composite_rules:
  - id: hex-table-six-arg-eval
    desc: Hex table evals a six-arg decoder
    crit: suspicious
    conf: 0.95
    attack: T1027,T1059.007
    all:
      - id: renamed-six-arg-eval-packer
      - id: metadata/lang/encoding/shape::javascript-hex-escape-string-table
      - id: metadata/lang/javascript-features::digit-heavy-line-generated-syntax
