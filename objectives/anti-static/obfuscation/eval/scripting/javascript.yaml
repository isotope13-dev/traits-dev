defaults:
  platforms: [windows, unix]
composite_rules:
  - id: js-obfuscated-eval-recognized-marker
    desc: Recognized marker for JavaScript obfuscated-eval indicators
    crit: component
    conf: 0.95
    any:
      - id: objectives/anti-static/obfuscation/payload/encoded::electron-ml-parity-harness
      - id: objectives/anti-static/obfuscation/string/encoding
      - id: well-known/app/system/electron-auth::electron-safe-storage-base64
      - id: well-known/app/system/electron-auth::srp-auth-crypto-context
      - id: well-known/lib/web/jquery/
      - id: well-known/lib/ai/mathjax/
      - id: metadata/package/testing/harness/runtime::node-common-require
      - id: metadata/package/testing/harness/runtime::is-test
      - id: metadata/package/testing/harness/runtime::v8-mjsunit-assert-pair
      - id: well-known/lib/web/ecmascript::core-js-runtime-bundle
      - id: metadata/build/bundler/asset::js-any-bundle-output
      - id: well-known/lib/web/ecmascript::google-web-runtime-bundle
      - id: well-known/lib/network/upload-clients::tus-js-client-bundle
      - id: well-known/lib/ai/mediapipe::mediapipe-selfie-segmentation-bundle
      - id: well-known/lib/ai/mediapipe::mediapipe-selfie-distribution-js
      - id: well-known/lib/development/google-diff-match-patch::diff-match-patch-library
      - id: well-known/lib/web/nextjs::next-node-modules-runtime
      - id: well-known/lib/format/es-module-lexer::dist-lexer-cjs
  - id: js-obfuscated-eval
    desc: Obfuscated dynamic code execution
    crit: suspicious
    conf: 0.98
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    size_max: 500000
    all:
      - id: objectives/execution/interpreter/eval/dynamic/
    any:
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-string-deobfuscation
      - id: objectives/anti-static/obfuscation/string/charcode-url::dense-fromcharcode
      - id: objectives/anti-static/obfuscation/string/encoding::js-unicode-escape
      - id: micro-behaviors/data/encode/hex::js-dense-hex-escapes
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-dup
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-dict-string-reconstruction
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-extreme-short-token-density
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::permutation-obfuscation
    unless:
      - id: micro-behaviors/communications/http/oauth/
      - id: well-known/tool/detection/security-scanner/
      - id: micro-behaviors/crypto/library/provider::node-crypto-verify
    downgrade:
      any:
        - id: metadata/build/

  - id: js-concat-this-nested-dispatch
    desc: Nested this-concat computed property dispatch
    crit: hostile
    conf: 0.97
    attack: T1027.002
    for: [javascript]
    all:
      - id: micro-behaviors/data/source/property/computed::js-this-identifier-concat-key
      - id: micro-behaviors/data/source/property/computed::js-nested-concat-this-call

  - id: js-concat-this-dead-store-stager
    desc: Concat this-keys hide behind dead stores
    crit: hostile
    conf: 0.96
    attack: T1027.002
    for: [javascript]
    all:
      - id: micro-behaviors/data/source/property/computed::js-this-identifier-concat-key
      - id: objectives/evasion/anti-av/code-padding::js-single-char-dead-store

  - id: js-nested-this-dead-store-stager
    desc: Nested this-calls padded with dead stores
    crit: hostile
    conf: 0.96
    attack: T1027.002
    for: [javascript]
    all:
      - id: micro-behaviors/data/source/property/computed::js-nested-concat-this-call
      - id: objectives/evasion/anti-av/code-padding::js-single-char-dead-store

  - id: function-constructor-modular-caesar-loader
    desc: Function constructor wraps modular Caesar decoder
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    mbc: B0032
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor
      - id: micro-behaviors/data/decode/custom::js-modulo-alphabet-caesar-decoder
      - id: micro-behaviors/process/create/shell/bridge::child-process-keyword-literal
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context

