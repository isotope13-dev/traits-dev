# Python Builtins Obfuscation - Indirection Patterns
# GuardDog-inspired: Detects indirect access to exec/eval via builtins
# ATT&CK: T1027 (Obfuscated Files or Information)
# MBC: B0032 (Obfuscated Files or Information)
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: suspicious
  conf: 0.95
  attack: "T1027"
  mbc: "B0032"
traits:
  # GuardDog: __import__('builtins').exec()
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::import-builtins-exec
    desc: __import__('builtins').exec obfuscation
    if:
      type: text
      regex: "__import__\\(['\"]builtins['\"]\\)\\.exec\\("
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/process/debug/eval::dap-evaluate-request
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::import-builtins-eval
    desc: __import__('builtins').eval obfuscation
    if:
      type: text
      regex: "__import__\\(['\"]builtins['\"]\\)\\.eval\\("
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/process/debug/eval::dap-evaluate-request
  # GuardDog: globals()['eval'] or globals()['\x65\x76\x61\x6c']
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-eval
    desc: globals()['eval'] indirection
    if:
      type: text
      regex: "globals\\(\\)\\[['\"]eval['\"]\\]\\("
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-exec
    desc: globals()['exec'] indirection
    if:
      type: text
      regex: "globals\\(\\)\\[['\"]exec['\"]\\]\\("
    unless:
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-hex-eval
    desc: globals() with hex-encoded 'eval'
    if:
      type: text
      substr: 'globals()[\x65\x76\x61\x6c]('
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-hex-exec
    desc: globals() with hex-encoded 'exec'
    if:
      type: text
      substr: 'globals()[\x65\x78\x65\x63]('
  # GuardDog: vars(__builtins__)['exec']
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-exec
    desc: vars(__builtins__)['exec'] indirection
    if:
      type: text
      regex: "vars\\(__builtins__\\)\\[['\"]exec['\"]\\]\\("
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-eval
    desc: vars(__builtins__)['eval'] indirection
    if:
      type: text
      regex: "vars\\(__builtins__\\)\\[['\"]eval['\"]\\]\\("
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-compile
    desc: vars(__builtins__)['compile'] indirection
    if:
      type: text
      regex: "vars\\(__builtins__\\)\\[['\"]compile['\"]\\]\\("
  # GuardDog: vars(__builtins__).get('exec')
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-get-exec
    desc: vars(__builtins__).get('exec') indirection
    if:
      type: text
      regex: "vars\\(__builtins__\\)\\.get\\(['\"]exec['\"]\\)\\("
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-get-eval
    desc: vars(__builtins__).get('eval') indirection
    if:
      type: text
      regex: "vars\\(__builtins__\\)\\.get\\(['\"]eval['\"]\\)\\("
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-get-compile
    desc: vars(__builtins__).get('compile') indirection
    if:
      type: text
      regex: "vars\\(__builtins__\\)\\.get\\(['\"]compile['\"]\\)\\("
  # GuardDog: vars(globals()['__builtins__'])['exec']
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-globals-builtins-exec
    desc: vars(globals()['__builtins__'])['exec']
    if:
      type: text
      regex: "vars\\(globals\\(\\)\\[['\"]__builtins__['\"]\\]\\)\\[['\"]exec['\"]\\]\\("
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-globals-builtins-eval
    desc: vars(globals()['__builtins__'])['eval']
    if:
      type: text
      regex: "vars\\(globals\\(\\)\\[['\"]__builtins__['\"]\\]\\)\\[['\"]eval['\"]\\]\\("
  # GuardDog: vars(locals()['__builtins__'])['exec']
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-locals-builtins-exec
    desc: vars(locals()['__builtins__'])['exec']
    if:
      type: text
      regex: "vars\\(locals\\(\\)\\[['\"]__builtins__['\"]\\]\\)\\[['\"]exec['\"]\\]\\("
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-locals-builtins-eval
    desc: vars(locals()['__builtins__'])['eval']
    if:
      type: text
      regex: "vars\\(locals\\(\\)\\[['\"]__builtins__['\"]\\]\\)\\[['\"]eval['\"]\\]\\("
composite_rules:
  # GuardDog: Import-based obfuscation
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::import-builtins-obfuscation
    desc: __import__('builtins') obfuscation
    crit: suspicious
    conf: 0.95
    attack: "T1027.002"
    any:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::import-builtins-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::import-builtins-eval
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/process/debug/eval::dap-evaluate-request
  # GuardDog: globals() indirection
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-indirection
    desc: globals() dictionary indirection
    crit: suspicious
    conf: 0.95
    attack: "T1027.002"
    any:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-eval
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-hex-eval
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-bracket-hex-exec
    unless:
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
  # GuardDog: vars(__builtins__) indirection
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-indirection
    desc: vars(__builtins__) indirection
    crit: suspicious
    conf: 0.95
    attack: "T1027.002"
    any:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-eval
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-compile
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-get-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-get-eval
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-get-compile
  # GuardDog: Complex vars/globals combinations
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-globals-complex
    desc: Complex vars/globals obfuscation
    crit: suspicious
    conf: 0.97
    attack: "T1027.002"
    any:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-globals-builtins-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-globals-builtins-eval
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-locals-builtins-exec
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-locals-builtins-eval
  # GuardDog: All builtins obfuscation techniques
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::builtins-obfuscation
    desc: Python builtins obfuscation
    crit: suspicious
    conf: 0.95
    attack: "T1027.002"
    any:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::import-builtins-obfuscation
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::globals-indirection
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-builtins-indirection
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::vars-globals-complex
