defaults:
  crit: suspicious
  platforms:
    - unix
    - windows
  for:
    - ruby
  mbc: B0032
  attack: T1027
traits:
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::marshal-load-dup
    desc: Marshal deserialization (RCE risk)
    conf: 0.93
    attack: T1059 - ruby
    if:
      type: symbol
      kind: call
      regex: '^(Marshal\.load|Marshal\.restore)$'
    unless:
      - id: metadata/package/testing/presence/path::spec-path-basename
      - id: metadata/package/testing/presence/harness::ruby-spec-file
      - id: metadata/package/testing/presence/harness::ruby-spec-helper-file
      - type: path
        dirname: true
        regex: '(^|[\\/])benchmarks?([\\/]|$)'
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::yaml-unsafe-load-dup
    desc: YAML unsafe deserialization
    conf: 0.9
    attack: T1059 - ruby
    unless:
      - id: metadata/package/files/dependency::ruby-vendor-bundle-gem-path
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - type: basename
        regex: '(^|_)spec\.rb$|_spec\.rb$'
      - type: basename
        regex: '\.gemspec$'
      - type: path
        dirname: true
        regex: '(^|[\\/])benchmarks?([\\/]|$)'
      - type: text
        substr: "module RuboCop"
      - id: well-known/tool/development/build/homebrew::source-tree
    if:
      type: symbol
      kind: call
      exact: 'YAML.load'
  # `reflection-send` was removed for the same reason `define-method` was: a
  # bare `.send(` / `__send__(` is standard Ruby metaprogramming (Rails, Thor,
  # RSpec and YARD all use it), not an anti-static obfuscation technique, and it
  # duplicated the canonical atom
  # micro-behaviors/metaprogramming/reflection::ruby-send-call. Its
  # `string_literal` matcher also only ever saw `.send(` written *inside* a
  # string — i.e. interpolation such as YARD's `"#{object.send(:sep)}#{@name}"` —
  # so it convicted the one spelling that is definitionally not dynamic dispatch.
  # Dynamic constant resolution is a Ruby reflection capability. It is not
  # inherently anti-static, so the canonical atoms live in the reflection
  # micro-behavior directory.
  # `define-method` was removed from here: a bare `define_method` symbol is
  # standard Ruby metaprogramming (Thor, RubyGems and Rails all use it), not an
  # anti-static obfuscation technique, and it duplicated the canonical atom
  # micro-behaviors/metaprogramming/reflection::ruby-dynamic-method-definition, which
  # is paired with a nearby composite for the `send :define_method` form.
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::ruby-dense-chr-calls
    desc: Dense chr() calls (string building)
    conf: 0.9
    count_min: 15
    per_kb_min: 3.0
    if:
      type: text
      regex: \b\d+\.chr\b
    unless:
      # A vendored runtime or library: Selenium ships a whole JRuby at
      # third_party/jruby/jruby-complete.jar, plus BouncyCastle jars.
      - id: metadata/package/files/dependency::third-party-directory-path
      - type: string_literal
        regex: IRB
      # Protocol client/server implementations (e.g. net/telnet) define command byte constants.
      - type: text
        substr: "class Telnet"
      - type: path
        regex: '(^|[\\/])telnet\.rb$'
      # Numeric chr() calls are routine in language/runtime test suites.
      - type: path
        regex: '(^|[\\/])(tests?|testing|spec)([\\/]|$)'
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::dense-instance-eval
    desc: Dense Ruby instance_eval string calls
    conf: 0.85
    count_min: 5
    per_kb_min: 2.0
    if:
      type: text
      regex: '\binstance_eval[[:space:]]*[(]?["'']'
    unless:
      # Language/runtime test suites (e.g. mruby-eval) exercise instance_eval
      # densely by design; that is not anti-static obfuscation.
      - id: metadata/package/testing/presence/harness::test-directory-path
  # class_eval density alone is ordinary Ruby metaprogramming, including
  # block-based module inclusion. Keep the canonical notable class_eval atom;
  # a count supplies no evidence of concealment.

  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::dense-module-eval
    desc: Dense Ruby module_eval calls
    conf: 0.85
    count_min: 5
    per_kb_min: 2.0
    if:
      id: micro-behaviors/process/interpreter/eval/direct::ruby-module-eval
    unless:
      - id: metadata/package/testing/presence/harness/
      # racc emits one module_eval per grammar rule into the generated parser.
      - type: text
        regex: '(?i)automatically generated by racc'
      # Rails and other Ruby frameworks generate method wrappers from a
      # heredoc while preserving the original source location for backtraces.
      # Repeated module_eval calls in that explicit code-generation form are
      # metaprogramming, not an attempt to hide the generated source.
      - type: text
        regex: 'module_eval\s*\(?\s*<<-?["'']?\w+["'']?,\s*__FILE__,\s*__LINE__(?:\s*\+\s*\d+)?'
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: micro-behaviors/process/hook/interception::ruby-debugger-hook-install
      - id: micro-behaviors/process/hook/interception::ruby-debugger-hook-restore
      # Frameworks generate families of ordinary methods from named heredocs.
      # Dense calls in that shape are code generation, not hidden intent.
      - type: text
        regex: 'module_eval\s*\(?\s*<<-?\S+[\s\S]{0,120}\bdef\s+#\{'
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::dense-interpolation
    desc: Dense string interpolation
    conf: 0.75
    count_min: 50
    per_kb_min: 8.0
    if:
      # First interior char must not be `_`, so autoload/require path tables
      # built from Ruby builtins (`#{__dir__}`, `#{__FILE__}`) are not counted
      # as obfuscation. Genuine payload-assembly interpolations name vars or
      # single- or two-character names (non-underscore) and still match.
      type: text
      regex: '#\{[A-Za-z$][0-9A-Za-z_$]{0,1}\}'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/lib/platform/specinfra/
      - id: metadata/package/files/dependency::ruby-vendor-bundle-gem-path
      - id: well-known/lib/format/coderay::coderay-module-declaration
      - id: well-known/tool/offensive/pwn/
      - id: well-known/tool/development/build/homebrew::source-tree
      - id: well-known/lib/development/jade-lang::jade-template-engine-context
composite_rules: []
