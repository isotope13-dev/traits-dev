defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: T1027
  mbc: E1014
  for: [python]
traits:

  # `eval('\x6d\x61\x67\x69\x63')` -- an identifier spelled as hex escapes so
  # the name never appears in the source.
  #
  # Python resolves the escapes at parse time, so this is exactly `eval('magic')`
  # and the indirection buys nothing at runtime. Its only effect is on the
  # reader: a grep for the variable, function or module being reached finds
  # nothing, and the call looks like an opaque string. Nothing writes code this
  # way for any reason but that.
  #
  # Three escaped characters is the floor. One or two turn up legitimately --
  # `'\x00'` sentinels, a `'\xff'` byte -- but a run of three is a name, not a
  # value, and it is being handed to the interpreter.
  #
  # Worked example: a W4SP-family stealer whose payload is base64 chunks, some
  # rot13'd, reassembled by `eval('\x6d\x61\x67\x69\x63') +
  # eval('\x63\x6f\x64\x65\x63\x73\x2e\x64\x65\x63\x6f\x64\x65...')`.
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::eval-hex-escaped-identifier
    desc: eval on a hex-escaped identifier
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\beval\s*\(\s*[''"](\\(x[0-9a-fA-F]{2}|[0-7]{1,3})){3,30}'

  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::loop-large-numeric-branch
    desc: Loop branch compares large numeric literal
    # A single numeric branch is only an obfuscation indicator; the
    # state-machine composite supplies the required multi-signal context.
    crit: notable
    conf: 0.82
    unless:
      - id: well-known/lib/ai/lmcache::wheel-member-context
    if:
      type: text
      regex: while.{0,30}:[^}]{0,50}if.{0,30}==.{0,30}[1-9][0-9]{4,}\b
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::obfuscated-state-variable
    desc: Chinese identifier with large numeric state
    crit: component
    conf: 0.75
    if:
      type: text
      regex: "(?m)^[ \\t]*[一-鿿]{5,}\\s*=\\s*[1-9][0-9]{3,}\\b"
  # com-dispatch-usage removed - use micro-behaviors/communications/ipc/win32com/python composite instead
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::join-map-getattr-chr
    desc: "built via join(map(getattr(__builtins__)))"
    crit: suspicious
    conf: 0.92
    count_min: 3
    if:
      type: text
      substr: join(map(getattr(__builtins__
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::getattr-builtins-obfuscation
    desc: Constructed builtin lookup
    crit: suspicious
    conf: 0.9
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.py$
      - id: well-known/lib/network/paramiko::paramiko-source
    if:
      type: tree-sitter
      kind: call
      regex: getattr\(_*builtins_*\s*,\s*(chr\(|["'].{1,24}["']\s*\+|["']{0,2}\.join\()
composite_rules:

  # A large base64 blob handed straight to `exec` while the module is imported.
  #
  # The neutral decoder-to-exec observation also covers legitimate plugin
  # loaders and test harnesses; it does not establish concealment on its own.
  # A *large* embedded blob removes them: kilobytes of base64 is a program, not
  # a snippet, and decoding a program only to run it immediately -- with no
  # branch that inspects or reports it -- is what a packed payload does. At
  # module scope in a `setup.py`, "immediately" means "during install".
  #
  # The decoded bytes frequently begin `MZ`, i.e. a Windows executable written
  # to a temp path and launched; that stays inside the `exec` string so a
  # string decoder does not reach it, which is the whole point of the exec
  # wrapper. The pair -- decode-and-run plus payload-sized blob at import -- is
  # what the rule keys on instead.
  #
  # Worked example: a `setup.py` that, on `os.name == 'nt'`, runs
  # `exec(b64decode('...'))` whose 400 KB payload writes an embedded PE to the
  # temp directory and calls `os.startfile` on it.
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::python-embedded-blob-exec-at-import
    desc: Large base64 blob executed at import
    crit: hostile
    conf: 0.96
    attack: "T1027,T1204.002,T1059.006"
    mbc: "B0032,E1027"
    # A payload-sized base64 blob that is passed to exec. The blob leg proves
    # it is a program, not a snippet; the exec leg proves it runs. An install
    # guard (`if 'sdist' not in argv`) or a platform check does not change
    # either fact, so no module-scope leg is required -- exec of a megabyte of
    # base64 has no benign reading wherever it sits.
    #
    # The structured decoder-to-exec observation has a source-size budget;
    # the text sibling retains coverage of oversized embedded literals.
    all:
      - id: metadata/file/line::very-long-source-line
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::python-exec-base64-result
      - id: objectives/anti-static/obfuscation/control-flow/logic::imported-base64-exec
      - id: objectives/anti-static/obfuscation/control-flow/logic::base64-exec-text
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file

  # A payload split across named variables, some rotated, reassembled by an
  # `eval` that names each piece in hex escapes.
  #
  # Splitting the base64 is what defeats a decoder: no single literal is a
  # multiple of four or decodes on its own, so the blob is only recoverable
  # once the pieces are joined in the right order -- which the source states
  # only through variable names that are themselves hidden. stng's
  # rot13-over-base64 decoder recovers a whole rotated payload; it cannot
  # reassemble fragments held in separate assignments, and this is what that
  # case looks like from the outside.
  #
  # Neither leg is a verdict alone: a large base64 literal is ordinary in
  # vendored data, and `eval` has legitimate uses. Together -- an identifier
  # spelled as hex escapes, handed to `eval`, in a file that also carries an
  # embedded base64 blob -- there is no reading in which the author was doing
  # anything but hiding what runs.
  #
  # Worked example: a W4SP-family PyPI stealer holding its payload in four
  # 11,545-character literals, rot13-ing two of them, and joining them with
  # `eval('\x6d\x61\x67\x69\x63') + eval('codecs.decode(love, joy)') + ...`
  # where `joy` is itself `'\x72\x6f\x74\x31\x33'` -- the string `rot13`,
  # written so it cannot be grepped.
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::python-hex-eval-assembled-blob
    desc: Hex-escaped eval assembles an encoded blob
    crit: hostile
    conf: 0.96
    attack: T1027,T1140
    mbc: E1027
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::eval-hex-escaped-identifier
    # embedded-base64-blob suppresses itself whenever the parser-backed
    # large-base64-like-literal fires, so accept either blob leg: the text
    # matcher covers pyc and files without string-literal facts, the literal
    # atom covers parsed source.
    any:
      - id: micro-behaviors/data/encode/base64::embedded-base64-blob
      - id: metadata/file/encoded::large-base64-like-literal
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::advanced-python-obfuscation
    desc: Advanced Python obfuscation
    crit: suspicious
    conf: 0.9
    needs: 3
    any:
      - id: "metadata/lang/source/syntax/assignment::unicode-variable-names"
      - id: micro-behaviors/data/arithmetic::repeated-numeric-bitshift
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::getattr-builtins-obfuscation
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::state-machine-obfuscation
    desc: Opaque numeric state-machine dispatch
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::loop-large-numeric-branch
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::obfuscated-state-variable
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::obfuscated-setup-py-trojan
    desc: Heavily obfuscated setup.py trojan
    crit: hostile
    conf: 0.95
    attack: T1195.002
    mbc: B0024
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::advanced-python-obfuscation
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::state-machine-obfuscation
      - id: micro-behaviors/communications/ipc/win32com::import-win32com
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::obfuscated-builtin-execution
    desc: Obfuscated builtin lookup and execution
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.006
    mbc: B0032,E1059
    all:
      - id: micro-behaviors/process/interpreter/python::python-getattr-builtins
      - id: objectives/anti-static/obfuscation/string/encoding::join-chr-comprehension
    any:
      - id: micro-behaviors/metaprogramming/reflection::python-getattr-call
      - id: micro-behaviors/process/interpreter/eval/indirect::python-getattr-builtin-call
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/
