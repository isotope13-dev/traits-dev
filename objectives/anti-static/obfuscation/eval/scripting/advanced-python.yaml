defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: T1027
  mbc: E1014
  for: [python]
traits:

  # `eval('\x6d\x61\x67\x69\x63')` -- an identifier spelled as hex escapes so
  # the name never appears in the source.
  #
  # Python resolves the escapes at parse time, so this is exactly `eval('magic')`
  # and the indirection buys nothing at runtime. Its only effect is on the
  # reader: a grep for the variable, function or module being reached finds
  # nothing, and the call looks like an opaque string. Nothing writes code this
  # way for any reason but that.
  #
  # Three escaped characters is the floor. One or two turn up legitimately --
  # `'\x00'` sentinels, a `'\xff'` byte -- but a run of three is a name, not a
  # value, and it is being handed to the interpreter.
  #
  # Worked example: a W4SP-family stealer whose payload is base64 chunks, some
  # rot13'd, reassembled by `eval('\x6d\x61\x67\x69\x63') +
  # eval('\x63\x6f\x64\x65\x63\x73\x2e\x64\x65\x63\x6f\x64\x65...')`.
  - id: eval-hex-escaped-identifier
    desc: eval on a hex-escaped identifier
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\beval\s*\(\s*[''"](\\x[0-9a-fA-F]{2}){3,40}'

  - id: arithmetic-expression-chains
    desc: Complex arithmetic chains
    crit: suspicious
    conf: 0.75
    unless:
      - type: text
        substr: //|==|!=|>=|<=|<<|>>|\+=|-=|\*=|/=|//=|<<=|>>=
      - type: basename
        regex: '(?i)\.(y|yy|yacc)$'
    if:
      type: text
      regex: "[*].{0,30}//.{0,30}[|].{0,30}<<.{0,30}>>"
  - id: loop-large-numeric-branch
    desc: Loop branch compares large numeric literal
    # A single numeric branch is only an obfuscation indicator; the
    # state-machine composite supplies the required multi-signal context.
    crit: component
    conf: 0.82
    if:
      type: text
      regex: while.{0,30}:[^}]{0,50}if.{0,30}==.{0,30}[1-9][0-9]{4,}\b
  - id: obfuscated-state-variable
    desc: Chinese identifier with large numeric state
    crit: component
    conf: 0.75
    if:
      type: text
      regex: "(?m)^[ \\t]*[一-鿿]{5,}\\s*=\\s*[1-9][0-9]{3,}\\b"
  # com-dispatch-usage removed - use micro-behaviors/communications/ipc/win32com/python composite instead
  - id: join-map-getattr-chr
    desc: "built via join(map(getattr(__builtins__)))"
    crit: suspicious
    conf: 0.92
    count_min: 3
    if:
      type: text
      substr: join(map(getattr(__builtins__
  - id: is-admin-flag
    desc: IsAdmin flag check (Python)
    # Building block for the admin-check-ctypes composite only. A bare IsAdmin
    # identifier (e.g. an API-model bool field) is not standalone obfuscation.
    crit: component
    conf: 0.75
    if:
      type: text
      word: IsAdmin
  - id: check-token-membership
    desc: CheckTokenMembership Windows API call
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '(?i)^CheckTokenMembership(Ex)?$'
  - id: getattr-builtins-obfuscation
    desc: Constructed builtin lookup
    crit: suspicious
    conf: 0.9
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.py$
      - id: metadata/library/data::paramiko-source
    if:
      type: tree-sitter
      kind: call
      regex: getattr\(_*builtins_*\s*,\s*(chr\(|["'].{1,24}["']\s*\+|["']{0,2}\.join\()
composite_rules:

  # A payload split across named variables, some rotated, reassembled by an
  # `eval` that names each piece in hex escapes.
  #
  # Splitting the base64 is what defeats a decoder: no single literal is a
  # multiple of four or decodes on its own, so the blob is only recoverable
  # once the pieces are joined in the right order -- which the source states
  # only through variable names that are themselves hidden. stng's
  # rot13-over-base64 decoder recovers a whole rotated payload; it cannot
  # reassemble fragments held in separate assignments, and this is what that
  # case looks like from the outside.
  #
  # Neither leg is a verdict alone: a large base64 literal is ordinary in
  # vendored data, and `eval` has legitimate uses. Together -- an identifier
  # spelled as hex escapes, handed to `eval`, in a file that also carries an
  # embedded base64 blob -- there is no reading in which the author was doing
  # anything but hiding what runs.
  #
  # Worked example: a W4SP-family PyPI stealer holding its payload in four
  # 11,545-character literals, rot13-ing two of them, and joining them with
  # `eval('\x6d\x61\x67\x69\x63') + eval('codecs.decode(love, joy)') + ...`
  # where `joy` is itself `'\x72\x6f\x74\x31\x33'` -- the string `rot13`,
  # written so it cannot be grepped.
  - id: python-hex-eval-assembled-blob
    desc: Hex-escaped eval assembles an encoded blob
    crit: hostile
    conf: 0.96
    attack: T1027,T1140
    mbc: E1027
    all:
      - id: eval-hex-escaped-identifier
      - id: micro-behaviors/data/encode/base64::embedded-base64-blob
  - id: advanced-python-obfuscation
    desc: Advanced Python obfuscation
    crit: suspicious
    conf: 0.9
    needs: 3
    any:
      - id: metadata/file/profile/language::unicode-variable-names
      - id: micro-behaviors/data/source/arithmetic::repeated-numeric-bitshift
      - id: getattr-builtins-obfuscation
  - id: state-machine-obfuscation
    desc: Opaque numeric state-machine dispatch
    crit: suspicious
    conf: 0.95
    all:
      - id: loop-large-numeric-branch
      - id: obfuscated-state-variable
  - id: admin-check-ctypes
    desc: Admin privilege check via ctypes (composite)
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/privilege/check::ctypes-is-admin
      - id: is-admin-flag
      - id: check-token-membership
    unless:
      - id: well-known/tool/detection/
  - id: windows-com-elevation
    desc: Windows COM elevation attempt
    crit: suspicious
    conf: 0.95
    attack: T1078
    mbc: E1059
    platforms:
      - windows
    all:
      - id: micro-behaviors/communications/ipc/win32com::dispatch-call
      - id: admin-check-ctypes
  - id: obfuscated-setup-py-trojan
    desc: Heavily obfuscated setup.py trojan
    crit: hostile
    conf: 0.95
    attack: T1195.002
    mbc: B0024
    all:
      - id: advanced-python-obfuscation
      - id: state-machine-obfuscation
      - id: micro-behaviors/communications/ipc/win32com::import-win32com
