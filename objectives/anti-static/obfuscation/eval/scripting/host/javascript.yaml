- id: function-constructor-modular-caesar-loader
  desc: Function constructor wraps modular Caesar decoder
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007
  mbc: B0032
  for:
  - javascript
  - typescript
  all:
  - id: function-constructor-caesar-decode-pair
  - id: metadata/import/builtin::child-process-module-reference
  unless:
  - id: metadata/package/testing/harness/runtime/
