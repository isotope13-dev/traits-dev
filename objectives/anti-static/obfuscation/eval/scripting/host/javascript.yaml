  - id: objectives/anti-static/obfuscation/string/encoding
  - id: objectives/anti-static/obfuscation/string/reconstruct::lua-escaped-indexed-string-reassembly
  - id: objectives/anti-static/obfuscation/string/reconstruct::lua-proxy-escaped-string-reassembly
  - id: well-known/app/system/electron-auth::electron-safe-storage-base64
  - id: well-known/app/system/electron-auth::srp-auth-crypto-context
  - id: well-known/lib/web/client-side/jquery/
  - id: well-known/lib/ai/mathjax/
  - id: metadata/package/testing/harness/runtime::node-common-require
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/package/testing/harness/runtime::v8-mjsunit-assert-pair
  - id: well-known/lib/web/client-side/ecmascript::core-js-runtime-bundle
  - id: metadata/build/bundler/asset::js-any-bundle-output
