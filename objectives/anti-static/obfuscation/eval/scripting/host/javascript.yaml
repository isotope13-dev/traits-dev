  - id: well-known/app/ai/agent-runtime/dotcraft/
  - id: well-known/lib/ui/equinor-eds::equinor-eds-core-react-library
  - id: well-known/app/ai/coding-agent/oh-my-pi/
  downgrade:
    any:
    - id: metadata/build
- id: js-concat-this-nested-dispatch
  desc: Nested this-concat computed property dispatch
  crit: hostile
  conf: 0.97
  attack: T1027.002
  for:
  - javascript
  all:
  - id: micro-behaviors/data/property/access::js-this-identifier-concat-key
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-nested-this-subscript-call
- id: js-concat-this-dead-store-stager
  desc: Concat this-keys hide behind dead stores
  crit: hostile
  conf: 0.96
  attack: T1027.002
  for:
  - javascript
  all:
  - id: micro-behaviors/data/property/access::js-this-identifier-concat-key
  - id: metadata/lang/source/syntax/assignment/name::js-many-single-letter-string-assignments
- id: js-concat-this-hidden-run-poll
  desc: Concat this-keys hide a hidden poll loop
  crit: hostile
  conf: 0.96
  attack: T1027.010,T1059.007
  for:
  - javascript
  all:
  - id: micro-behaviors/data/property/access::js-this-identifier-concat-key
  - id: micro-behaviors/data/control-flow/loop::js-for-with-try
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-new-this-bracket
  - id: micro-behaviors/data/control-flow/dispatch/named::indexed-call-zero-boolean-arguments
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/package/testing/harness/runtime/
- id: js-nested-this-dead-store-stager
  desc: Nested this-calls padded with dead stores
  crit: hostile
  conf: 0.96
  attack: T1027.002
  for:
