  - id: metadata/lang/source/syntax/assignment/name::js-many-single-letter-string-assignments
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
- id: function-constructor-caesar-decode-pair
  desc: Function constructor wraps Caesar string decoder
  crit: hostile
  conf: 0.94
  attack: T1027,T1059.007
  mbc: B0032
  for:
  - javascript
  - typescript
  all:
