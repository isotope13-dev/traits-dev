  - id: well-known/lib/web/site-platforms/nextjs::next-node-modules-runtime
  - id: well-known/lib/format/es-module-lexer::dist-lexer-cjs
- id: js-obfuscated-eval
  desc: Obfuscated dynamic code execution
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  size_max: 500000
  all:
  - id: objectives/execution/interpreter/eval/dynamic/
  any:
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-string-deobfuscation
  - id: objectives/anti-static/obfuscation/string/charcode-url::dense-fromcharcode
  - id: metadata/lang/encoding/unicode-escape::js-four-unicode-escapes
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-dup
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-dict-string-reconstruction
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-extreme-short-token-density
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::permutation-obfuscation
  unless:
  - id: micro-behaviors/communications/http/oauth/
  - id: well-known/tool/detection/security-scanner/
  - id: micro-behaviors/crypto/verify::node-crypto-verify
  - id: well-known/app/ai/agent-runtime/dotcraft/
  - id: well-known/lib/ui/equinor-eds::equinor-eds-core-react-library
  - id: well-known/app/ai/coding-agent/oh-my-pi/
  - id: well-known/app/ai/coding-agent/reason-machines::vm-hands-bundle-chunk
  downgrade:
    any:
    - id: metadata/build
- id: js-global-eval-escaped-source
  desc: Global evaluator with encoded-string concealment
  crit: suspicious
  conf: 0.98
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  size_max: 500000
  all:
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-window-named
  any:
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-string-deobfuscation
  - id: objectives/anti-static/obfuscation/string/charcode-url::dense-fromcharcode
  - id: metadata/lang/encoding/unicode-escape::js-four-unicode-escapes
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-dup
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-dict-string-reconstruction
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-extreme-short-token-density
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::permutation-obfuscation
