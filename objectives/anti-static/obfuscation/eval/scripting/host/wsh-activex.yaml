defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
composite_rules:
- id: js-comment-carried-wsh-payload
  desc: Encoded JScript comments feed computed WSH launch
  crit: hostile
  conf: 0.99
  for:
  - javascript
  attack: T1027,T1059.007,T1140,T1564.003
  all:
  - id: metadata/lang/source/comment::js-many-base64-like-comments
  - id: metadata/lang/source/syntax/operator::js-long-addition-chain
  - id: micro-behaviors/os/com/automation::wscript-dynamic-com-member
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-indexed-zero-false-call
- id: js-decoded-activex-payload-dropper
  desc: Alphabet decoder hides ActiveX payload dropper
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1105
  for:
  - javascript
  all:
  - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
  - id: micro-behaviors/data/control-flow/dispatch/computed::activex-object-decoder-progid
  - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
  - id: micro-behaviors/data/control-flow/dispatch/computed::computed-member-call-zero-arg
- id: js-opaque-activex-stage
  desc: Custom-decoded JavaScript conceals an ActiveX stage
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1140
  mbc: B0032
  for:
  - javascript
  scope: file
  all:
  - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder
  - id: micro-behaviors/os/com/instantiation::activex-object-variable-progid
  - id: metadata/file/encoding/shape::large-base64-like-literal
  - id: micro-behaviors/data/string/concat/expression::massive-concatenation-chain
  - id: metadata/file/line::multiple-lines-over-1000-chars
  unless:
  - id: metadata/path/directory::test-directory-component
