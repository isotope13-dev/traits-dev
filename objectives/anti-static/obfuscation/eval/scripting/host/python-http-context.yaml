# Decoded execution is supported; the separate response write is context, not
# the value proved to reach exec().
composite_rules:
  - id: objectives/anti-static/obfuscation/eval/scripting/host::python-decoded-exec-http-write-profile
    desc: Python decoded execution near HTTP response write
    crit: suspicious
    conf: 0.98
    platforms: [unix, windows]
    for: [python]
    all:
      - id: micro-behaviors/fs/write/file/response-body::python-http-response-write-exec-profile
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-decrypt-dynamic-exec
