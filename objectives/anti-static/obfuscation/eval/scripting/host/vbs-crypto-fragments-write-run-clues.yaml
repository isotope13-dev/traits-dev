defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: vbs-crypto-fragments-write-run-clues
    desc: VBScript crypto-name fragments, write and Run clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: metadata/lang/source/literal/string/shape::vbs-aes-escryp-concatenated-fragment
      - id: metadata/lang/source/literal/string/shape::vbs-createde-concatenated-fragment
      - id: metadata/lang/source/literal/string/shape::vbs-transfor-concatenated-fragment
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-style-argument
    any:
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-hex-charcode-decoder
      - id: objectives/anti-static/obfuscation/string/fragmentation::vbs-repeated-xor-obfuscation
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::vbs-xor-character-code
