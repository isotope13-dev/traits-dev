# WSH (VBScript/HTA) payload reconstructed at runtime and executed. Malware
# stores its real body as a delimited string, rebuilds it by replacing the
# delimiter with code fragments — `eval(replace(blob, "O", ")+chr("))` builds
# a chr()-arithmetic concatenation — then hands the result to execute(). The
# function-call form replace(x, a, b) is VBScript's, and feeding eval/execute
# a transformed string exists only to keep the real code out of static view.
defaults:
  platforms: [windows]
  # Self-decoding VBS viruses (Repulik) keep raw control bytes in the encoded
  # string literal, so the file sniffs as opaque `data` rather than `vbs`.
  for: [vbs, html, data]
  attack: T1027
  mbc: B0032
traits:
  - id: wsh-eval-replace-transform
    desc: WSH eval/execute of replace-transformed string
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(eval|execute)\s*\(\s*replace\s*\('
  - id: vbs-array-chr-decode-loop
    desc: VBScript array character reconstruction loop
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bfor\b.{0,40}\blbound\b.{0,30}\bubound\b.{0,200}\bchr\s*\('
  # `For i = 1 To Len(s): r = Asc(Mid(s, i, 1)): v = v + Chr(r + (r Mod 3))`
  # -- walks a string one character code at a time and emits a shifted
  # character, the classic VBS virus self-decryptor ahead of Execute.
  - id: vbs-string-char-shift-decode-loop
    desc: VBScript per-character Asc/Chr decode loop
    crit: suspicious
    conf: 0.9
    if:
      # raw, not text: in `data`-typed files the extracted string list drops
      # the short Asc/Chr lines, so only the file bytes carry the loop.
      type: raw
      regex: '(?is)\bfor\b[^\n]{0,30}\bto\s+len\s*\(.{0,60}\basc\s*\(\s*mid\s*\(.{0,80}\bchr\s*\('
  - id: vbs-eval-execute-wrapper
    desc: VBScript wraps execute in eval call
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\beval\s*\(\s*["'']\s*execute(global)?\b'
  - id: wsh-execute-variable
    desc: WSH executes a reconstructed variable
    crit: notable
    conf: 0.85
    if:
      type: text
      # Decoder functions are often one letter: `Execute(V)`.
      regex: '(?i)\b(execute|executeglobal)\s*\(\s*[a-zA-Z_]\w*\s*\)'

composite_rules:
  - id: wsh-reconstructed-payload-exec
    desc: WSH reconstructs and executes hidden payload
    crit: hostile
    conf: 0.97
    all:
      - id: wsh-execute-variable
    any:
      - id: wsh-eval-replace-transform
      - id: vbs-array-chr-decode-loop
      - id: vbs-string-char-shift-decode-loop
      - id: vbs-eval-execute-wrapper
