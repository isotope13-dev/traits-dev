defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027,T1059.006

composite_rules:
  - id: python-obfuscated-malicious-shell-exec
    desc: Python decodes and executes an obfuscated malicious shell payload
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting::python-decode-decrypt-dynamic-exec
      - id: objectives/anti-static/obfuscation/payload/encoded::decoded-malicious-shell

