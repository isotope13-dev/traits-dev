defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  conf: 0.99

composite_rules:
  - id: npm-preinstall-hex-command-loader
    desc: npm preinstall executes hex-decoded command
    crit: hostile
    attack: "T1027.013,T1059.007"
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/process/create/shell/command-string::js-exec
    near_bytes: 430
