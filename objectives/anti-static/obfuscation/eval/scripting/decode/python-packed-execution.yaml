defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1027
  mbc: B0032
composite_rules:
- id: objectives/anti-static/obfuscation/eval/scripting/decode::python-packed-or-obfuscated
  desc: Python packer or obfuscator signal
  crit: notable
  conf: 0.9
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/signature::known-obfuscator-detected
  - id: objectives/anti-static/obfuscation/obfuscator/signature::python-obfuscation-suite
  - id: objectives/anti-static/pack/runtime::exec-marshal-zlib
  - id: objectives/anti-static/pack/runtime::python-zeta-obfuscator
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::python-packed-payload
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::exec-decompress-payload
  - id: objectives/anti-static/obfuscation/reflection/indirect::python-reflection-dynamic-builtins-clues
  - id: objectives/anti-static/obfuscation/encoding/layered::python-multiple-xor-techniques
- id: objectives/anti-static/obfuscation/eval/scripting/decode::python-packed-dynamic-exec
  desc: Packed Python dynamic execution
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-packed-or-obfuscated
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-dynamic-code-evaluation
- id: objectives/anti-static/obfuscation/eval/scripting/decode::python-packed-subprocess
  desc: Packed Python subprocess execution
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-packed-or-obfuscated
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
