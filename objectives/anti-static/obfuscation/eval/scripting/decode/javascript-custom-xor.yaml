defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027,T1140
  mbc: B0032
traits:
- id: large-high-entropy-script-payload
  desc: Large file with many high-entropy strings
  crit: notable
  conf: 0.9
  size_min: 100000
  if:
    type: metrics
    field: strings.high_entropy_count
    min: 100
- id: multiple-xor-modulo-loops
  desc: JavaScript source has multiple XOR-modulo loops
  crit: notable
  conf: 0.9
  if:
    type: metrics
    field: ast.xor_mod_loop_count
    min: 2
composite_rules:
- id: js-url-eval-modulo-xor
  desc: URL-decoded eval co-occurs with cyclic XOR
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-url-decoded
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-modulo-key-xor-byte-mask
  near_bytes: 2048
- id: js-custom-alphabet-xor-eval
  desc: Custom alphabet and cyclic XOR with eval
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-url-decoded
  - id: micro-behaviors/data/decode/custom::js-custom-alphabet-charcodeat-index-table
  - id: micro-behaviors/data/decode/custom::js-six-bit-shift-or-decode-accumulator
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-modulo-key-xor-byte-mask
  unless:
  - id: metadata/package/testing/
  - id: metadata/file/naming::test-directory-component
  near_bytes: 2048
- id: js-large-multilayer-payload-eval
  desc: Large multilayer encoded JavaScript payload executed by eval
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1140
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-url-decoded
  - id: micro-behaviors/crypto/symmetric/xor/loop::js-modulo-key-xor-byte-mask
  - id: micro-behaviors/data/decode/custom::js-custom-alphabet-charcodeat-index-table
  - id: micro-behaviors/data/decode/custom::js-six-bit-shift-or-decode-accumulator
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  - id: large-high-entropy-script-payload
  - id: multiple-xor-modulo-loops
  near_bytes: 2048
