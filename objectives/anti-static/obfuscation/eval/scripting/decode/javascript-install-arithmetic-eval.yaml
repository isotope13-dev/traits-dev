defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: javascript-arithmetic-decoder-eval-clues
    desc: Arithmetic decoder and dynamic evaluation clues
    crit: suspicious
    conf: 0.96
    attack: T1027,T1059.007
    mbc: B0032
    near_lines: 60
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: objectives/anti-static/obfuscation/arithmetic::arithmetic-decoder-fromcharcode-evidence
      - id: objectives/anti-static/obfuscation/arithmetic::arithmetic-decoder-charcode-evidence
    any:
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
