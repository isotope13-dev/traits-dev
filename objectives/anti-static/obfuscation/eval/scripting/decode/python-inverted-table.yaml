defaults:
  for: [python]
  platforms: [windows, unix]
composite_rules:
  - id: python-base64-inverse-table-exec
    desc: Base64 execution with inverse table lookup
    crit: suspicious
    conf: 0.95
    near_lines: 2
    all:
      - id: micro-behaviors/data/decode/base64/call::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/data/decode/custom::python-key-value-pair-comprehension
      - id: micro-behaviors/data/decode/custom::python-inverse-value-comparison
