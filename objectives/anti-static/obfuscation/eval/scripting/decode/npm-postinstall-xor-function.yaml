defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  conf: 0.99

composite_rules:
  - id: npm-postinstall-buffer-base64-xor-function-stager
    desc: npm postinstall runs buffer XOR Base64 Function stager
    crit: hostile
    attack: T1027,T1059.007
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop
    any:
      - id: micro-behaviors/metaprogramming/generation/function::function-ctor-call-expr-arg
      - id: micro-behaviors/metaprogramming/generation/function::js-function-call-commonjs-wrapper
