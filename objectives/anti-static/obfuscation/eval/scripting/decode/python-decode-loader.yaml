defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027
  mbc: B0032
traits:
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-reverse-map-buffer
    desc: Walks a reverse substitution buffer
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'if buffer in REVERSE'
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-exec-result-call
    desc: Executes a variable named result
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'exec\(\s*result\s*\)'
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-exec-builtin-alias
    desc: Assigns the exec builtin to a name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*\w+\s*=\s*exec\s*$'
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-xor-char-ordinals
    desc: Xors two character ordinals
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'chr\(ord\([^)]{1,40}\)\s*\^\s*ord\('
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-exec-nested-call
    desc: Exec of a nested call expression
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: ';\s*exec\s*\(\s*\('
  # modulegraph loads a .pyc: compile(..., 'exec') beside marshal.loads.
composite_rules:
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-execs-xor-decoded-text
    desc: Execs text decoded by a character xor
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.006
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-exec-builtin-alias
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-xor-char-ordinals
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-execs-reverse-substitution
    desc: Executes a reverse-substitution decode
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.006
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-reverse-map-buffer
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-exec-result-call
  # freecodingtools-style one-liner: exec a lambda that zlib-decompresses
  # base64 of a reversed blob. The host string never appears; the three
  # operations in one file are the loader.
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-execs-reversed-b64-zlib
    desc: Execs reversed Base64 zlib payload
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.006
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/string/reverse::python-b64decode-reversed-arg
      - id: metadata/import/package::python-dynamic-zlib-import
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-exec-nested-call
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-marshal-blob-getattr-exec
    desc: Runs a decoded marshal blob as code
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.006
    scope: file
    all:
      - id: well-known/lib/development/python-tooling::cpython-marshal-loads-reference
      - id: micro-behaviors/data/decode/base64::b64decode-string
      - id: micro-behaviors/process/interpreter/eval/compile::compile-source-exec-mode
      - id: micro-behaviors/data/string/conversion::python-join-map-chr

  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-single-line-dynamic-exec
    desc: One-line Python dynamic execution
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/line::python-one-line-source
      - id: metadata/file/extension/identity::python-source-extension
      - id: metadata/file/line::single-long-line-outlier
      - id: micro-behaviors/process/interpreter/eval/direct::python-dynamic-code-evaluation
    # Webpack's eval devtool stores generated JavaScript in a long string.
    # Cleave may decode that string as a Python-looking layer, but it is not
    # a Python loader or an execution payload.
    unless:
      - id: metadata/lang/encoded/unicode-escape::python-decoded-webpack-bundle
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-single-line-subprocess
    desc: One-line Python subprocess execution
    crit: suspicious
    conf: 0.9
    # Embedded project files can contain several unrelated Python templates.
    # Require the line-shape evidence and the subprocess call to describe the
    # same local snippet instead of correlating distant embedded templates.
    near_bytes: 1024
    all:
      - id: metadata/file/line::python-one-line-source
      - id: metadata/file/extension/identity::python-source-extension
      - id: metadata/file/line::single-long-line-outlier
      - id: micro-behaviors/process/create/subprocess::process-execution
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
      # Moonshiner task.json seeds embed one-line reference_setup helpers for
      # agent training — not obfuscated loaders.
      - id: well-known/app/system/moonshiner::seed-fixture-tree
      - id: well-known/tool/development/ide-contexts::web-ide-terminal-python-bootstrap-context
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-single-line-decoder
    desc: One-line Python decoder
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/line::python-one-line-source
      - id: metadata/file/extension/identity::python-source-extension
      - id: metadata/file/line::single-long-line-outlier
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decode/hex::python-base16-decode
      - id: micro-behaviors/data/decode/base32::python-base32-decode
      - id: micro-behaviors/data/decode/base85::python-ascii85-decode
      - id: micro-behaviors/data/decode/base64::python-urlsafe-base64-decode
      - id: micro-behaviors/data/decode/base64::python-standard-base64-decode
      - id: micro-behaviors/data/string/assembly::python-join-with-decoder-call
      - id: micro-behaviors/data/decode/base58
      - id: micro-behaviors/data/decode/uu
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/decompress/bzip2::bz2-decompress-call
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads-symbol
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-loader-decode-recognized-marker
    desc: Python decoder recognized marker
    crit: baseline
    conf: 0.9
    any:
      - id: micro-behaviors/crypto/library/blockchain/exchange::crypto-exchange-sdk-benign-context
      - id: micro-behaviors/data/encode/base85
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/decompress/bzip2::bz2-decompress-call
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads
      - id: micro-behaviors/data/encode/xor/
      - id: micro-behaviors/crypto/symmetric/fernet::decrypt
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-decrypt-dynamic-exec
    desc: Embedded Base64 accompanies decoder and dynamic exec
    crit: suspicious
    conf: 0.98
    # Keep the decoder and the dynamic execution in the same small source
    # construct.  A file-wide/80-line correlation treats documentation and
    # generated-code examples (for example a loader's own API docs) as a
    # decoded payload.
    near_bytes: 512
    near_lines: 80
    all:
      - id: micro-behaviors/data/encode/payload::large-base64-string-literals
      - id: micro-behaviors/process/interpreter/eval/direct::python-dynamic-code-evaluation
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decode/hex::python-base16-decode
      - id: micro-behaviors/data/decode/base32::python-base32-decode
      - id: micro-behaviors/data/decode/base85::python-ascii85-decode
      - id: micro-behaviors/data/decode/base64::python-urlsafe-base64-decode
      - id: micro-behaviors/data/decode/base64::python-standard-base64-decode
      - id: micro-behaviors/data/string/assembly::python-join-with-decoder-call
      - id: micro-behaviors/data/decode/base58
      - id: micro-behaviors/data/decode/uu
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/decompress/bzip2::bz2-decompress-call
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads-symbol
    unless:
      # A format placeholder is runtime-translated source transport, not an
      # embedded encoded payload.  DCC command bridges commonly use this form
      # to carry caller-supplied code into a host application's interpreter.
      - id: micro-behaviors/data/decode/base64::placeholder-b64decode-exec-transport
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-exec-recognized-product-context
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::pyinstaller-bytecode-loader-context
      - id: well-known/tool/packaging/pyinstaller::modulegraph-source-path

  # PyInstaller .pyc/archive tooling legitimately pairs marshal.loads with
  # compile(..., 'exec') to load and rebuild bytecode archives. Suppress the
  # decode-then-exec shape only when the file carries both the PyInstaller
  # identity and the marshal bytecode-loader mechanism.
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::pyinstaller-bytecode-loader-context
    desc: PyInstaller bytecode loader context
    crit: exception
    conf: 0.99
    all:
      - id: well-known/tool/packaging/pyinstaller::development-team-copyright
      - id: well-known/lib/development/python-tooling::cpython-marshal-loads-reference
  # Recognized product/corpus identities for a decode-then-eval shape,
  # grouped behind one reference so the atom above stays under the
  # suppression-count limit. Each leg is its own recognizable program or
  # evaluation-corpus identity, kept notable so it qualifies for `exception`.
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-exec-recognized-product-context
    desc: Recognized product identity for decode-then-eval
    crit: exception
    conf: 0.99
    any:
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: well-known/app/browser/ungoogled-chromium::ungoogled-chromium-patch-validator
      - id: well-known/lib/development/python-tooling::python-pyc-marshal-cache-read
      # DictMap IPC: base64-decode then eval JSON-ish primitives (null/true).
      - id: well-known/lib/platform/browser-automation/drivers/chromium::dbgidchromium-identity
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      - id: well-known/lib/testing/pytest::pytest-standalone-context
      - id: well-known/app/data/datatailr::install-notice-context

  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-sliced-b64-exec-loader
    desc: Executes a prefix-sliced Base64 payload
    crit: hostile
    conf: 0.96
    attack: T1027,T1059
    all:
      - id: micro-behaviors/data/decode/base64::python-slice-then-b64decode
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
