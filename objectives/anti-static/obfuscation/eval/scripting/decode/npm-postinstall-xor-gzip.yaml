defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  conf: 0.99

composite_rules:
  - id: npm-postinstall-base64-xor-gzip-commonjs-loader
    desc: npm postinstall runs base64 XOR gzip Function loader
    crit: hostile
    attack: T1027,T1059.007
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/data/decompress/gzip::gunzip-call-text
      - id: micro-behaviors/data/bitwise/mask::js-key-add-mask-byte-update
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-commonjs-wrapper
      - id: micro-behaviors/process/daemonize/detach::detached-true
