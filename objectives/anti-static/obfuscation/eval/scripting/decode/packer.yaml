defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1027
traits:
- id: cpython-libclinic-marker
  desc: CPython libclinic generator marker
  crit: baseline
  conf: 0.95
  if:
    type: text
    substr: from libclinic
- id: cpython-pegen-marker
  desc: CPython pegen generator marker
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: PythonParserGenerator
- id: cpython-run-startup
  desc: CPython startup audit hook
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: cpython.run_startup
composite_rules:
- id: heavy-crypto-packer
  desc: Heavy crypto imports in Python packer
  crit: suspicious
  conf: 0.93
  size_max: 20480
  all:
  - id: micro-behaviors/data/encode/base85::b85decode-script
  any:
  - id: micro-behaviors/crypto/library/keyword::blake3-import
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-api-operation
  - id: micro-behaviors/crypto/kdf/algorithm::hkdf-import
  - id: micro-behaviors/crypto/kdf/algorithm::key-derivation
  - id: micro-behaviors/crypto/library/keyword::aead-mode-keyword--mode-gcm
  - id: micro-behaviors/crypto/library/keyword::aead-mode-keyword--mode-ctr
- id: b85-zlib-exec-packer
  desc: Base85+zlib+exec Python unpacker chain
  crit: suspicious
  conf: 0.94
  size_max: 32768
  all:
  - id: micro-behaviors/data/encode/base85::b85decode-script
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  unless:
  - id: micro-behaviors/process/interpreter/eval/compile::compile-builtin
- id: import-heavy-packer-stub
  desc: Import-heavy packer stub with exec
  crit: suspicious
  conf: 0.9
  size_max: 10240
  unless:
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::cpython-run-startup
  - id: metadata/package/testing/presence/harness/
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::cpython-libclinic-marker
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::cpython-pegen-marker
  - id: well-known/lib/
  - id: "metadata/file/naming::test-directory-component"
  all:
  - id: metadata/binary/code/density::python-high-import-density
  - id: metadata/file/import::script-many-imports-10-small
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  any:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  - id: micro-behaviors/data/encode/base85::b85decode-script
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress
  - id: micro-behaviors/data/serialize/unsafe::marshal-loads
  - id: micro-behaviors/data/decode/hex::python-fromhex
- id: multi-layer-python-packer
  desc: Multi-layer Python packer with crypto
  crit: hostile
  conf: 0.97
  size_max: 65536
  all:
  - id: micro-behaviors/data/encode/base85::b85decode-script
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  any:
  - id: micro-behaviors/crypto/library/keyword::blake3-import
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-api-operation
  - id: micro-behaviors/crypto/kdf/algorithm::hkdf-import
  - id: micro-behaviors/crypto/kdf/algorithm::key-derivation
  - id: micro-behaviors/process/interpreter/eval/compile::compile-synthetic-filename
  needs: 2
- id: xor-layered-python-packer
  desc: XOR and layered decode near Python execution
  crit: suspicious
  conf: 0.97
  size_max: 65536
  near_lines: 24
  all:
  - id: micro-behaviors/crypto/symmetric/xor/loop::python-xor-bytes-comprehension
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  any:
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: micro-behaviors/process/interpreter/eval/compile::compile-builtin
  needs: 2
- id: base85-zlib-module-loader
  for:
  - python
  - whl
  desc: Base85 zlib Python module loader
  crit: suspicious
  conf: 0.97
  size_max: 65536
  scope: archive
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/base85::b85decode-script
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: micro-behaviors/os/api-resolution/dynamic::python-types-moduletype-create
  - id: micro-behaviors/os/api-resolution/dynamic::python-module-dict-exec
  unless:
  - id: well-known/app/system/clokai::clokai-opaque-engine-context
  - id: well-known/app/system/clokai::clokai-model-runtime-context
