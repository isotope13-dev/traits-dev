# Requires the reconstructed characters to be the immediate IEX operand.
# PowerShell can be embedded in a launcher written in another language, and
# PowerShell Core supports the same expression on Unix. No campaign names,
# tenant names, lure language, or selected numeric character values are used.
defaults:
  for: [scripts, source]
  platforms: [windows, unix]
traits:
  - id: powershell-joined-chararray-evaluation
    desc: Evaluates joined PowerShell character array
    crit: suspicious
    conf: 0.96
    attack: T1027.010,T1140,T1059.001
    if:
      type: text
      regex: '(?i)\b(iex|invoke-expression)\s*\(\s*-join\s+\[char\[\]\]\s*@\('
