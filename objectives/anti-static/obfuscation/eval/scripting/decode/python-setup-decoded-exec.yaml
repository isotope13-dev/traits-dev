defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: setup-obfuscated-decoded-exec-payload
  desc: setup.py executes decoded payload
  crit: hostile
  conf: 0.96
  mbc: E1059
  all:
  - id: metadata/build/pip::setup-py
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-decode-decrypt-dynamic-exec
  any:
  - id: objectives/execution/payload/script-eval/transformed/shell::decoded-shell-command
  - id: metadata/lang/encoding/base64::encoded-python-network-import-text
