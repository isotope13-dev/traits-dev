# Co-occurring concealment and invocation, without an inferred hostile payload.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-wrapped-aes-scriptblock-invocation
    desc: Wrapped AES script clues accompany nearby ScriptBlock invocation
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::powershell-aes-wrapped-script-construction
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-create-invoke
