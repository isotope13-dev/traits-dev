defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1027,T1059.002
traits:
  - id: applescript-shell-decoded-integer-array
    desc: Shell command from integer-array handler
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)do\s+shell\s+script\s+\w+\(\{\s*\d{1,5}\s*(,\s*\d{1,5}\s*){12,}\}\)'
  - id: applescript-concatenated-array-shell-command
    desc: Joins decoded array fragments for shell
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(?i)do\s+shell\s+script\s+\w+\s*\(\s*\{\s*\d+(\s*,\s*\d+){12,}\s*\}\s*\)\s*&'
  - id: applescript-variable-only-shell-command
    desc: Runs a shell command from a variable
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?im)^[ \t]*do[ \t]+shell[ \t]+script[ \t]+[a-z_]\w*[ \t]*\r?$'

composite_rules:
  - id: applescript-arithmetic-array-shell-stages
    desc: Integer-decoded shell commands with indirect execution
    crit: hostile
    conf: 0.97
    near_lines: 60
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::applescript-offset-character-source
      - id: applescript-concatenated-array-shell-command
      - id: applescript-variable-only-shell-command
