defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1027,T1059.002
traits:
  - id: applescript-shell-decoded-integer-array
    desc: Shell command from integer-array handler
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)do\s+shell\s+script\s+\w+\(\{\s*\d{1,5}\s*(,\s*\d{1,5}\s*){12,}\}\)'
