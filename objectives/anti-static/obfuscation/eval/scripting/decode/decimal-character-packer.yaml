defaults:
  for: [javascript, text]
  platforms: [windows, unix]
composite_rules:
  - id: evaluated-decimal-character-packer
    desc: Eval packer hides decimal character-code source
    crit: suspicious
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
      - id: micro-behaviors/data/string/replace::js-packer-token-substitution
      - id: micro-behaviors/data/string/replace::numeric-character-dictionary
      - id: micro-behaviors/data/string/replace::packed-character-code-table-names
