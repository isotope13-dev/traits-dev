defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: preinstall-modular-caesar-function-dropper
    desc: Preinstall runs modular Caesar Function constructor loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor
      - id: micro-behaviors/data/decode/custom::js-modulo-alphabet-caesar-decoder
      - id: metadata/import/builtin::child-process-module-reference
    unless:
      - id: metadata/build/minifier::intentional-obfuscated-javascript-artifact-context
