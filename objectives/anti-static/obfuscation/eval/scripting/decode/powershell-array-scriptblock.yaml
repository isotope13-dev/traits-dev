# ROMULUS and similar PowerShell stagers hide their logic as a numeric array
# that a per-element transform (XOR or add/subtract against a per-sample key)
# turns back into source, which is then handed to `[scriptblock]::Create` and
# run. The array contents and key differ per sample; the reconstruction shape
# and the dynamic ScriptBlock execution are the durable signature. Matching on
# that shape — not on any literal string from one sample — catches future
# variants in the same template.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1027.010,T1059.001
  mbc: E1059

traits:
  # Complement to the XOR char decoder in crypto/symmetric/xor/loop: the same
  # per-element reconstruction using additive/subtractive key arithmetic.
  - id: powershell-char-cast-arithmetic-decode
    desc: Char cast of arithmetic-shifted element
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[char\]\s*\(\s*\$_\s*[-+]\s*(0x[0-9a-f]+|\d+|\$[A-Za-z_][A-Za-z0-9_.:]*)\s*\)'

composite_rules:
  # Either reconstruction primitive supports the "rebuild a string from a
  # numeric array" role. Bare any: over two suspicious legs stays suspicious.
  - id: powershell-array-char-reconstruction
    desc: Numeric-array string reconstruction with transform
    crit: suspicious
    conf: 0.93
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::powershell-scalar-bxor-char
      - id: powershell-char-cast-arithmetic-decode

  # The reconstruction role and the dynamic-compile role are both required;
  # the execution operator (call-operator, IEX, or ScriptBlock invoke) is the
  # sink. Keeping reconstruction mandatory in all: prevents an execution leg
  # alone from satisfying the any: threshold.
  - id: powershell-reconstructed-scriptblock-execution
    desc: Array-reconstructed code run via ScriptBlock.Create
    crit: hostile
    conf: 0.96
    attack: T1027.010,T1059.001,T1140
    near_lines: 25
    all:
      - id: powershell-array-char-reconstruction
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-created-scriptblock-call
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-invoke-method
      - id: micro-behaviors/process/interpreter/reflection/dispatch::powershell-variable-call-operator
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
