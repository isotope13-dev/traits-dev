# Character transformation near dynamic compilation and invocation supports
# possible source concealment, not a hostile payload or proven source-to-sink
# relationship. The transform can also produce malformed text.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1027.010,T1059.001
  mbc: E1059

composite_rules:
  - id: powershell-transformed-scriptblock-invocation
    desc: Character transform near dynamic ScriptBlock invocation
    crit: suspicious
    conf: 0.96
    attack: T1027.010,T1059.001,T1140
    near_lines: 25
    all:
      - id: micro-behaviors/data/string/conversion::powershell-transformed-character
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-created-scriptblock-call
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-invoke-method
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
