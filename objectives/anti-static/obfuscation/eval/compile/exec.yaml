# Python compile() + exec() Obfuscation Patterns
# Detects dynamic code compilation with synthetic filenames and immediate execution.
# Used by Python packers (PyOBFUSCATE, ShadowCoil) to hide payload origin.
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027

traits:
- id: cpython-profiling-doc-extension
  desc: CPython profiling documentation extension
  crit: component
  conf: 0.9
  if:
    type: path
    basename: true
    exact: profiling_trace.py

- id: lazy-graph-source-locals-assignment
  desc: Lazy graph source locals assignment
  crit: component
  conf: 0.92
  if:
    type: text
    substr: "self._source = get_source(outputs, params=self._locals)"

- id: lazy-graph-code-exec-locals
  desc: Lazy graph code exec locals
  crit: component
  conf: 0.92
  if:
    type: text
    substr: "exec(self._code, None, self._locals)"

- id: compile-result-code-assignment
  desc: Compile result assigned to _code variable
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(^|[^A-Za-z0-9_])_code\s*=\s*compile\('
  unless:
  - type: text
    substr: "template"
  - type: text
    substr: "TempliteCompiler"
  - type: text
    substr: "cpython.run_startup"

- id: compile-synthetic-filename-unless-cond-3--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.94
  if:
    type: text
    regex: 'compile\(.{0,80}''<(string|stdin)>'''
  count_max: 1025882
- id: compile-synthetic-filename-unless-cond-3--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.94
  if:
    type: text
    regex: 'compile\(.{0,80}''<(unknown|docs)>'''
  count_max: 1025883
- id: compile-synthetic-filename-unless-cond-3--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.94
  if:
    type: text
    regex: 'compile\(.{0,80}''<(code|doctest [^''">]{0,80})>'''
  count_max: 1025884
- id: compile-synthetic-filename-unless-cond-3--rx-4
  desc: Synthetic main filename label
  crit: component
  conf: 0.94
  if:
    type: text
    regex: "compile\\(.{0,80}'<main [a-z]{3,16}>'"
  count_max: 1025885
composite_rules:
- id: compile-exec-obfuscation
  desc: Staged _code compile result executed nearby
  crit: suspicious
  conf: 0.94
  # near_lines keeps this a *chain*: compile() feeding an exec() a few lines
  # later, the packer shape. Without it, a file merely using compile() for
  # one purpose (e.g. a syntax-check probe) and exec() for an unrelated one
  # hundreds of lines away satisfies both legs on bag-of-features co-presence
  # alone -- matplotlib's sphinxext/plot_directive.py does exactly this:
  # `compile(text, '<string>', 'exec')` only validates doctest syntax in
  # contains_doctest() (discarding the result), while the unrelated
  # `exec(code, ns)` in _run_code() executes doc example code at Sphinx
  # build time, ~200 lines away.
  near_lines: 20
  all:
  - id: micro-behaviors/process/interpreter/python::compile-builtin
  - id: micro-behaviors/process/interpreter/python::exec-builtin
  - id: compile-result-code-assignment
  unless:
  # Source obtained from `inspect.getsource` is the program's own text, so
  # compiling it back is runtime patching rather than concealment -- unsloth's
  # `rl_replacements.py` rewrites TRL trainer methods that way.
  - id: micro-behaviors/process/interpreter/python::inspect-getsource-call
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  - id: well-known/tool/detection/
  - id: cpython-profiling-doc-extension
  - id: metadata/library/automation/
  - id: metadata/library/python-stdlib::python-stdlib-install-path
  - id: well-known/lib/runtime/cpython::cpython-bdb-module
- id: lazy-computation-graph-compiler-marker
  desc: Lazy computation graph compiler marker
  crit: component
  conf: 0.95
  all:
  - id: lazy-graph-source-locals-assignment
  - id: lazy-graph-code-exec-locals
- id: compile-synthetic-filename-unless-cond-3--rx-helper-4
  desc: Regex component marker
  crit: component
  conf: 1.0
  mbc: B0032
  any:
  - id: compile-synthetic-filename-unless-cond-3--rx-1
  - id: compile-synthetic-filename-unless-cond-3--rx-2
  - id: compile-synthetic-filename-unless-cond-3--rx-3
  - id: compile-synthetic-filename-unless-cond-3--rx-4
