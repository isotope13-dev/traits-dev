# VBScript that reaches its own builtins only through Execute.
#
# The script wraps every builtin it needs -- Replace, StrReverse, InStr,
# CreateObject -- in a user function that concatenates the call as text and
# evaluates it. Nothing in the file is a call to anything recognisable, so a
# reader sees only local functions with random names, and a signature written
# against the API finds no API.
#
# What survives the next variant is the shape, not the builtins chosen: a
# builtin name sitting alone in a string being glued onto an expression that
# is about to be executed.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1059.005
  mbc: B0032

composite_rules:
  - id: vbs-execute-laundered-builtins
    desc: VBScript reaches builtins only through Execute
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/string/concat::vbs-builtin-name-concatenated
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
    any:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-hidden-run
      - id: objectives/anti-static/obfuscation/control-flow/poly::variable-replace
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-marker-cleanup
