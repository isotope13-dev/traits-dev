defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
  conf: 0.95
  mbc: B0032
  attack: T1027
traits:
  - id: nvidia-bug-report-basename
    desc: nvidia-bug-report.sh filename
    crit: notable
    conf: 1.0
    if:
      type: path
      basename: true
      exact: nvidia-bug-report.sh
# Non-base64 self-decoding shell sinks. The base64 chains are covered by the
# composites below; these catch the hex/xxd, tr-rotation, decompression, and
# command-substitution decoders future variants pivot to when base64
# detection bites. Inline literal input establishes concealed code; decoder
# transport alone remains a notable pipeline capability in micro-behaviors.
  - id: xxd-hexdecode-pipe-shell
    desc: Embedded hex literal decoded into shell input
    crit: suspicious
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(echo|printf)\s+[''"]?[0-9a-f]{2,}[''"]?\s*\|\s*xxd\s+-r[^|\n]{0,16}\|\s*(ba)?sh\b'
  # Detector test corpora (exfil guards, linters) feed sample pipelines that
  # end in a placeholder evil.com host; live decoders never target it.
  - id: pipe-shell-evil-placeholder-host
    desc: Shell pipe sink names evil.com placeholder
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\|\s*(ba)?sh\b[^\n]{0,30}https?://evil\.com\b'
  - id: gunzip-pipe-shell
    desc: gunzip output piped to shell
    crit: suspicious
    conf: 0.9
  # gunzip -c and zcat decompress to stdout, so the decompressor is the last
  # stage before sh and the bytes it emits become the executed script. A
  # filename operand between the stages would redirect the sink, so the gap
  # between the tool and the pipe stays small.
    if:
      type: text
      case_insensitive: true
      regex: '(^|[;&|]\s*)(gunzip|zcat)\s+[^|;\n]{0,16}\|\s*(ba|z|k)?sh\b'
  - id: shell-base64-variable-decode
    desc: Shell decodes base64 variable
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(ENCODED_PAYLOAD|POLY_BLOB)[\s\S]{0,260}base64 -d'
  - id: shell-eval-decoded-variable
    desc: Shell evals decoded variable
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'eval "\$(DECODED_PAYLOAD|_DECODED|_CLEAN)"'
composite_rules:
  - id: tr-rotate-pipe-shell
    desc: tr byte-rotation piped to shell
    crit: suspicious
    conf: 0.88
    for: [shell, github-actions, makefile]
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-tr-rotate-shell-stdin
    any:
      - id: metadata/lang/shebang::shell-script
      - id: metadata/file/extension/identity::shell
      - id: metadata/filename/identity::shell-profile-basename
      - id: metadata/build/ci/github-actions::workflow-definition-path
    unless:
      - id: pipe-shell-evil-placeholder-host
  - id: rev-reverse-pipe-shell
    desc: rev string-reversal piped to shell
    crit: suspicious
    conf: 0.9
    for: [shell, github-actions, makefile]
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-rev-shell-stdin
    any:
      - id: metadata/lang/shebang::shell-script
      - id: metadata/file/extension/identity::shell
      - id: metadata/filename/identity::shell-profile-basename
      - id: metadata/build/ci/github-actions::workflow-definition-path
    unless:
      - id: pipe-shell-evil-placeholder-host
# Lone-file obfuscated self-decoding shell dropper: a script that decodes a
# concealed blob (inline hex/xxd or tr rotation, a decompression stage, or a
# decode inside eval "$(...)" over an embedded encoded literal) and executes
# it — no package/install-hook context required. A decode-eval of a
# caller-supplied variable or file is not concealed code: CI scripts load
# encoded configuration and evaluate generated exports. The decoder/eval
# relationship is recorded as a neutral interpreter behavior; only the
# embedded-literal composite below claims obfuscation. The shell analog of
# packed-single-line-eval-dropper for JS.
  - id: shell-obfuscated-self-decode-exec
    desc: Shell decodes concealed payload and executes it
    crit: hostile
    conf: 0.94
  # Anchored on shell-script context so the composite surfaces in findings (a
  # bare any:-only composite whose single satisfied leg is already a finding is
  # absorbed and never emitted). Every leg already requires a decode-then-shell
  # pipe/eval, so this only restricts to real shell and never broadens.
    all:
      - id: metadata/lang/shebang::shell-script
    any:
      - id: xxd-hexdecode-pipe-shell
      - id: eval-decode-embedded-encoded-literal
      - id: gunzip-pipe-shell
      - id: tr-rotate-pipe-shell
      - id: rev-reverse-pipe-shell
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/communications/http/services/github/release::github-release-asset-publisher
      - id: metadata/build/recognized-contexts::libreelec-distribution-build-marker
  # The eval "$(... | base64 -d ...)" form only conceals code when the encoded
  # input is in the file; keep the literal within a few lines of the eval so a
  # stray fixture blob elsewhere in a large script does not complete it.
  - id: eval-decode-embedded-encoded-literal
    desc: Evals decoding of an embedded encoded literal
    crit: suspicious
    conf: 0.94
    near_lines: 8
    all:
      - id: micro-behaviors/process/interpreter/eval/decoded::shell-eval-decoded-command-substitution
    any:
      - id: micro-behaviors/data/encode/payload::shell-base64-payload-literal
      - id: metadata/file/encoding/base64::base64-decoded-gz
  - id: shell-encoded-eval-dropper
    desc: Shell encoded payload with eval
    crit: hostile
    conf: 0.95
  # Co-presence of unrelated fixture base64 and eval across a script is not
  # a dropper; real encoded eval chains keep decode and eval adjacent.
    near_lines: 8
    all:
      - id: micro-behaviors/data/encode/payload::shell-base64-payload-literal
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
    unless:
      - id: metadata/build/recognized-contexts::libreelec-distribution-build-marker
  - id: shell-base64-variable-eval
    desc: Shell base64 variable eval
    crit: hostile
    conf: 0.98
    all:
      - id: shell-base64-variable-decode
      - id: shell-eval-decoded-variable

  - id: shell-openssl-aes-gunzip-eval
    desc: Shell AES-decrypt gunzip eval chain
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.004
    near_lines: 2
    all:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::openssl-aes-decrypt
      - id: micro-behaviors/data/decode/processor::gunzip-tool
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
  - id: shell-base64-gunzip-eval
    desc: Shell base64 gunzip and eval nearby
  # The three legs are bare tool words (`base64`, `gunzip`, `eval`), so without
  # proximity this fired on any shell test harness that happens to contain all
  # three anywhere in the file -- libdeflate's gzip_tests.sh decodes a base64
  # fixture on line 504, defines a gunzip() wrapper on line 49, and runs
  # `eval "$*"` in its own test runner on line 93.  The real chain
  # (`... | base64 -d | gunzip | eval`) is a single pipeline; allow one line of
  # continuation, no more.
    crit: suspicious
    near_lines: 2
    all:
      - id: micro-behaviors/data/encoding/base64::base64-tool
      - id: micro-behaviors/data/decode/processor::gunzip-tool
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval

  - id: shell-heredoc-base64-eval
    desc: Shell heredoc decoded eval chain
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/lang/source/syntax/operator::shell-heredoc
      - id: micro-behaviors/process/interpreter/eval/decoded::shell-eval-decoded-command-substitution

  - id: shell-base64-perl-xor-eval
    desc: Base64 decode to Perl XOR decrypt then eval
    all:
      - id: micro-behaviors/process/stdio/write::base64-decode-piped-perl
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
