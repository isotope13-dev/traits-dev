defaults:
  crit: suspicious
  conf: 0.8
  for:
    - python
    - javascript
    - powershell
    - pe
  platforms:
    - windows
  attack: T1027.002
  mbc: B0027
traits:
  - id: cmd-caret-excessive
    desc: Excessive caret usage
    crit: suspicious
    if:
      id: metadata/lang/scripted::powershell-caret-obfuscated
    conf: 0.8
    unless:
      - id: metadata/lang/shebang::perl
    downgrade:
      any:
        - id: metadata/package/testing/compiled::go-compiled-test-binary
composite_rules: []
