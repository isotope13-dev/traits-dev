# Host-language execution of inline concealed rev / tr-rotation shell stages.
# Unexecuted string literals in non-shell source files (such as scanner test
# inputs or documentation tables) emit only the micro-behavior pipeline traits;
# anti-static evaluation requires a nearby host-language process launch site.
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.9
  mbc: B0032
  attack: T1027,T1059.004

composite_rules:
  - id: rust-exec-rev-pipe-shell
    desc: Rust executes reversed inline shell pipeline
    for: [rust]
    near_bytes: 280
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-rev-shell-stdin
    any:
      - id: micro-behaviors/process/create/subprocess/configure::rust-command-new-call
      - id: metadata/lang/source/syntax/argument::rust-interpreter-command-construction
      - id: micro-behaviors/process/create/subprocess/configure::rust-shell-command-runner
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-status-call
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call

  - id: rust-exec-tr-rotate-pipe-shell
    desc: Rust executes tr-rotated inline shell pipeline
    for: [rust]
    near_bytes: 280
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-tr-rotate-shell-stdin
    any:
      - id: micro-behaviors/process/create/subprocess/configure::rust-command-new-call
      - id: metadata/lang/source/syntax/argument::rust-interpreter-command-construction
      - id: micro-behaviors/process/create/subprocess/configure::rust-shell-command-runner
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-status-call
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call

  - id: python-exec-rev-pipe-shell
    desc: Python executes reversed inline shell pipeline
    for: [python]
    near_bytes: 280
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-rev-shell-stdin
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-dunder-import-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true

  - id: python-exec-tr-rotate-pipe-shell
    desc: Python runs tr-rotated inline shell pipeline
    for: [python]
    near_bytes: 280
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-tr-rotate-shell-stdin
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-dunder-import-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true

  - id: script-host-exec-rev-pipe-shell
    desc: Host program runs reversed shell pipeline
    for: [ruby, javascript, typescript, php, go]
    near_bytes: 280
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-rev-shell-stdin
    any:
      - id: micro-behaviors/process/create/exec::ruby-system-process-call
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/exec::node-process-launch-call
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: micro-behaviors/process/create/shell/command-string::shelljs-exec
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call

  - id: script-host-exec-tr-rotate-pipe-shell
    desc: Host program runs tr-rotated shell pipeline
    for: [ruby, javascript, typescript, php, go]
    near_bytes: 280
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/decoded::literal-tr-rotate-shell-stdin
    any:
      - id: micro-behaviors/process/create/exec::ruby-system-process-call
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/exec::node-process-launch-call
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: micro-behaviors/process/create/shell/command-string::shelljs-exec
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
