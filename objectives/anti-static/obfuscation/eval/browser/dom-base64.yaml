defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.98
traits:
  - id: split-eval-assignment
    desc: Eval name fragment assignment
    crit: component
    if:
      type: text
      regex: '\b[\w$]+\s*=\s*[''"]eva[''"]\s*;'
  - id: split-atob-assignment
    desc: Atob name fragment assignment
    crit: component
    if:
      type: text
      regex: '\b[\w$]+\s*=\s*[''"]ato[''"]\s*;'
composite_rules:
  - id: padded-dom-base64-eval-concealment
    desc: Star-separated DOM text beside split eval names
    crit: suspicious
    attack: T1027
    all:
      - id: metadata/file/encoding::star-separated-dom-text
      - id: split-eval-assignment
      - id: split-atob-assignment
      - id: micro-behaviors/data/control-flow/dispatch::js-computed-property-call
      - id: micro-behaviors/data/property/access::dom-innerhtml-access
