# A long literal is cut on a repeated token and the pieces are concatenated
# back into source for eval. Index [0]+[1] is the join; the token is not a
# delimiter a normal program evals.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1059.007
traits:
  - id: split-token-indexed-eval
    desc: Evals pieces of a split string
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '\.split\(["''][A-Za-z0-9]{4,16}["'']\);\s*eval\(\w{1,40}\[0\]\+\w{1,40}\[1\]'
composite_rules:
  - id: token-split-char-offset-eval
    desc: Eval rebuilds script from split offsets
    crit: hostile
    conf: 0.94
    near_bytes: 4000
    all:
      - id: objectives/anti-static/obfuscation/eval/browser::split-token-indexed-eval
      - id: objectives/anti-static/obfuscation/encoding/numeric::c-delimited-signed-offset-split
