defaults:
  platforms:
  - windows
  for:
  - html
  - javascript
  - vbs
  attack: T1027,T1140
traits:
- id: script-encoder-unescape-evaluator
  desc: Script-encoded eval of percent-decoded source
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |-
      rule script_encoder_unescape_evaluator {
       strings:
        $marker = /#\x00{0,8}@\x00{0,8}~\x00{0,8}\^/
        $eval = /[\x2b\x6e\x7f]\x00{0,8}[\x2d\x37\x5c]\x00{0,8}[\x43\x6c\x6d]\x00{0,8}[\x56\x5e\x73]\x00{0,8}[\x60\x63\x76]\x00{0,8}[\x21\x3b\x45]\x00{0,8}[\x09\x55\x78]\x00{0,8}[\x2b\x6e\x7f]\x00{0,8}[\x2f\x64\x6b]\x00{0,8}[\x31\x5e\x6d]\x00{0,8}[\x43\x6c\x6d]\x00{0,8}[\x32\x61\x77]\x00{0,8}[\x2b\x6e\x7f]\x00{0,8}[\x60\x63\x76]\x00{0,8}/
       condition: $marker and $eval
      }
