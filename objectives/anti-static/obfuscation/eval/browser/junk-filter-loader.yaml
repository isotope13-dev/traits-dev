# Junk-stripped API names feed a charCodeAt/unescape decoder that eval runs.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: junk-filtered-charcode-unescape-eval
    desc: Eval of junk-filtered char decoder
    crit: hostile
    conf: 0.93
    near_bytes: 6000
    all:
      - id: objectives/anti-static/obfuscation/eval/browser::filtered-eval-property
      - id: objectives/anti-static/obfuscation/string/conceal::filtered-fromcharcode-property
      - id: objectives/anti-static/obfuscation/string/conceal::filtered-unescape-property
  - id: junk-filtered-write-charcodeat-eval
    desc: Eval of junk-filtered write decoder
    crit: hostile
    conf: 0.93
    near_bytes: 6000
    all:
      - id: objectives/anti-static/obfuscation/eval/browser::filtered-eval-property
      - id: objectives/anti-static/obfuscation/string/conceal::filtered-write-property
      - id: objectives/anti-static/obfuscation/string/conceal::filtered-charcodeat-property
