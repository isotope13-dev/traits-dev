defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: reversed-base64-function
    desc: Reversed Base64 beside Function decoding
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.007
    near_bytes: 20000
    all:
      - id: micro-behaviors/process/deploy/script-eval/transformed::function-atob-literal
      - id: micro-behaviors/data/string/reverse::literal-split-reverse-join

  - id: reversed-base64-clipboard-interceptor
    desc: Hidden clipboard hooks replace the browser copy action
    crit: hostile
    conf: 0.97
    attack: T1115,T1027
    scope: leaf
    all:
      - id: micro-behaviors/os/clipboard/intercept::encoded-clipboard-method-interposition
      - id: micro-behaviors/os/clipboard/intercept::reversed-base64-clipboard-event-write
      - id: micro-behaviors/os/clipboard/intercept::reversed-base64-cancel-default
