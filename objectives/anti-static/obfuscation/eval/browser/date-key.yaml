defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: filtered-eval-property
    desc: Filters junk from eval property name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '\[\s*["'']e[^"'']{1,12}v[^"'']{1,12}a[^"'']{1,12}l[^"'']{0,12}["'']\.replace\(\/\['
