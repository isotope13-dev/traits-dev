# A letter-delimited decimal packer decoded via addition-indexed member calls
# into a conversion function table, reconstructing and executing hidden script.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1059.007

composite_rules:
  - id: letter-delimited-decimal-eval-loader
    desc: Decimal packer decoded through arithmetic member dispatch
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/encoding/numeric::letter-delimited-decimal-eval-packer
      - id: micro-behaviors/data/control-flow/dispatch::js-addition-indexed-member-call
