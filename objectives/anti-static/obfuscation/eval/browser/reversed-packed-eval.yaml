defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
composite_rules:
  # HTML has no embedded call facts, so use the canonical eval text atom.
  # These nearby observations describe a packing pattern, not proven data
  # flow, remote loading, or a supply-chain trust violation. Widget protectors
  # can use the same machinery, so the finding remains suspicious.
  - id: base64-countdown-eval
    desc: Countdown and Base64 alphabet accompany eval
    crit: suspicious
    conf: 0.9
    near_bytes: 8192
    all:
      - id: metadata/lang/source/syntax/operator::decremented-bound-zero-comparison
      - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-text
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
  # The decode stage behind the reversal: base64 bytes unpacked with shifts
  # under hex-mangled names into a nested eval. Minified libraries rarely
  # stack all three; packer kits do. Stays suspicious because widget
  # "protectors" wear the same machinery.
  - id: multistage-js-decoder-chain
    desc: Multistage JS decoder chain
    crit: suspicious
    conf: 0.88
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/arithmetic::shift-mask-octet-unpack
      - id: metadata/lang/source/declaration::hex-variable-names
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
