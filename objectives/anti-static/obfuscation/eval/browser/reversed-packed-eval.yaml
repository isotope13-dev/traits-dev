defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
traits:
  # Classic string-reversal decoder header: an index initialized one below
  # a bound and walking down to zero (`i=n-1;i>=0;i--`). Benign countdown
  # loops share the shape, so this is only a fragment for the composite
  # below. Anchored on the literal `-1;` so the matcher stays cheap.
  - id: reverse-loop-decoder-header
    desc: String reversal loop header
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '-1\s*;[A-Za-z_$][\w$]*>=\s*0'
composite_rules:
  # Reversed-packed eval: a base64 alphabet beside a reversal loop feeding a
  # nested eval call. Packer kits and widget "protectors" wear this shape;
  # the layers together state concealed code, whatever the payload turns
  # out to be.
  - id: reversed-packed-eval-loader
    desc: Reversed base64 payload evaluated
    crit: suspicious
    conf: 0.9
    near_bytes: 8192
    all:
      - id: reverse-loop-decoder-header
      - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-text
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
  # The decode stage behind the reversal: base64 bytes unpacked with shifts
  # under hex-mangled names into a nested eval. Minified libraries rarely
  # stack all three; packer kits do. Stays suspicious because widget
  # "protectors" wear the same machinery.
  - id: multistage-js-decoder-chain
    desc: Multistage JS decoder chain
    crit: suspicious
    conf: 0.88
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/arithmetic::shift-mask-octet-unpack
      - id: metadata/lang/source/naming::hex-variable-names
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
