defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
composite_rules:
  # HTML has no embedded call facts, so use the canonical eval text atom.
  # These nearby observations describe a packing pattern, not proven data
  # flow, remote loading, or a supply-chain trust violation. Widget protectors
  # can use the same machinery, so the finding remains suspicious.
  - id: base64-countdown-eval
    desc: Countdown and Base64 alphabet accompany eval
    crit: suspicious
    conf: 0.9
    near_bytes: 8192
    all:
      - id: metadata/lang/source/syntax/operator::decremented-bound-zero-comparison
      - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-text
      - id: micro-behaviors/process/interpreter/eval/javascript::eval-call-text
    # Minified SHA-3 bundles reach Node's crypto and buffer through this eval
    # form, so the base64 alphabet and the eval sit near each other by design.
    unless:
      - id: objectives/anti-static/obfuscation/eval/browser::eval-hidden-node-require
  # The decode stage behind the reversal: base64 bytes unpacked with shifts
  # under hex-mangled names into a nested eval. Minified libraries rarely
  # stack all three; packer kits do. Stays suspicious because widget
  # "protectors" wear the same machinery.
  - id: multistage-js-decoder-chain
    desc: Multistage JS decoder chain
    crit: suspicious
    conf: 0.88
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/bitwise/mask::shift-mask-octet-unpack
      - id: metadata/lang/source/naming/variable::hex-variable-names
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg

traits:
  # Bundled libraries reach Node's crypto and buffer through eval("require(...)")
  # so bundlers do not resolve the module. Notable only; it is used to suppress
  # the composite above, never as evidence of its own.
  - id: eval-hidden-node-require
    desc: eval("require()") bridges to Node built-in
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'eval\("require\(''(crypto|buffer)''\)"\)'
