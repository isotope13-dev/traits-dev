# A JJencode lookup table together with its Function-constructor tail:
# the page compiles and runs script whose text appears nowhere in the
# file. Seen on SEO doorway and hacked pages hiding redirects or loaders.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  attack: T1027,T1059.007

composite_rules:
  - id: jjencoded-script-executes-hidden-source
    desc: JJencoded script compiles and runs hidden source
    crit: suspicious
    conf: 0.94
    near_bytes: 200000
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jjencode-symbol-table-preamble
      - id: micro-behaviors/process/interpreter/eval/constructed::jjencode-function-constructor-invocation

  # The same JJEncoded executor appended to the end of a site's ordinary
  # script (analytics snippet, theme code): a compromised file carrying a
  # hidden stage, not a page author's own choice of encoding.
  - id: jjencoded-stage-appended-to-site-script
    desc: JJEncoded stage appended to an ordinary script
    crit: hostile
    conf: 0.95
    all:
      - id: jjencoded-script-executes-hidden-source
      - id: metadata/lang/source/shape::jjencode-preamble-after-other-code
