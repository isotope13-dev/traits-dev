# A VBScript loop rebuilds markup with ChrW(eval(item)) and document.writes it
# into a page that also carries the RDS DataSpace CLSID (MS06-014), so the
# exploit's object tag and ProgIDs never appear as plain text.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1027,T1059.005

composite_rules:
  - id: vbscript-chr-eval-write-rds-clsid
    desc: VBScript ChrW-eval decoder writes page carrying RDS CLSID
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/custom::vbscript-chr-eval-index
      - id: micro-behaviors/ui/window/insert-html::vbs-document-write-call-text
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
