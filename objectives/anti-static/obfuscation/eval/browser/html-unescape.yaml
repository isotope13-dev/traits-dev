# HTML pages that hide an ADODB/RDS dropper behind eval(unescape)
# and the MSXML DataSpace CLSID. Hex matchers still fire when a
# .ko extension causes the page to be typed as ELF.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, elf]
  attack: T1027,T1059.007

composite_rules:
  # The createElement leg is the neutral DOM capability owned by
  # micro-behaviors/ui/window/dom/create: browser-create-element on parsed
  # source, document-createelement-bytes on pages typed as ELF where the
  # symbol projection cannot run. Either one completes the composite.
  - id: html-eval-createelement
    desc: eval-unescape creates a DOM object
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-unescape-byte-prefix
    any:
      - id: micro-behaviors/data/collection/dom::document-create-element
      - id: micro-behaviors/data/collection/dom::document-createelement-bytes
    unless:
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      - id: well-known/tool/development/webinspector/
  - id: html-eval-rds-clsid
    desc: eval-unescape with RDS CLSID
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-unescape-byte-prefix
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
  # A triple-nested unescape/write packer: the outer document.write decodes
  # one layer whose accumulator decodes and writes the next, with the call
  # punctuation itself arriving encoded. Single unescape-write pages stay
  # with the notable atoms; the nesting is the loader.
  - id: html-nested-unescape-write-loader
    desc: Nested unescape-write packer stages payload
    crit: hostile
    conf: 0.96
    for: [html]
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
      - id: micro-behaviors/ui/window/insert-html::encoded-unescape-write-accumulator
      - id: micro-behaviors/ui/window/insert-html::document-write-encoded-parens
  # The accumulator twin without the outer write: the encoded
  # decode-and-write idiom plus the encoded call punctuation is already the
  # packer's inner stage, even where the outer write shape varies.
  - id: html-encoded-unescape-accumulator-stage
    desc: Encoded unescape accumulator writes payload
    crit: hostile
    conf: 0.95
    for: [html]
    all:
      - id: micro-behaviors/data/decode/url::js-unescape-call-text
      - id: micro-behaviors/ui/window/insert-html::encoded-unescape-write-accumulator
      - id: micro-behaviors/ui/window/insert-html::document-write-encoded-parens
