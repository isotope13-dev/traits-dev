# HTML pages that hide an ADODB/RDS dropper behind eval(unescape)
# and the MSXML DataSpace CLSID. Hex matchers still fire when a
# .ko extension causes the page to be typed as ELF.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, elf]
  attack: T1027,T1059.007

traits:
  - id: html-eval-unescape
    desc: HTML eval-unescape loader
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: 65 76 61 6c 28 75 6e 65 73 63 61 70 65 28
      offset_range: [0, null]
  - id: html-rds-dataspace-clsid
    desc: RDS DataSpace CLSID in a page
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 42 44 39 36 43 35 35 36 2d 36 35 41 33 2d 31 31 44 30
      offset_range: [0, null]

composite_rules:
  # The createElement leg is the neutral DOM capability owned by
  # micro-behaviors/ui/window/dom/create: browser-create-element on parsed
  # source, document-createelement-bytes on pages typed as ELF where the
  # symbol projection cannot run. Either one completes the composite.
  - id: html-eval-createelement
    desc: eval-unescape creates a DOM object
    crit: hostile
    conf: 0.96
    all:
      - id: html-eval-unescape
    any:
      - id: micro-behaviors/ui/window/dom/create::browser-create-element
      - id: micro-behaviors/ui/window/dom/create::document-createelement-bytes
    unless:
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
  - id: html-eval-rds-clsid
    desc: eval-unescape with RDS CLSID
    crit: hostile
    conf: 0.97
    all:
      - id: html-eval-unescape
      - id: html-rds-dataspace-clsid
  - id: html-createelement-rds-clsid
    desc: DOM object create with RDS CLSID
    crit: hostile
    conf: 0.95
    all:
      - id: html-rds-dataspace-clsid
    any:
      - id: micro-behaviors/ui/window/dom/create::browser-create-element
      - id: micro-behaviors/ui/window/dom/create::document-createelement-bytes
