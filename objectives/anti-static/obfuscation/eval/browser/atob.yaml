defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [html, javascript, text]

traits:
  - id: html-atob-document-write
    desc: HTML atob self-decoding loader
    conf: 0.97
    attack: "T1027"
    if:
      type: text
      regex: document\.write\s*\(\s*(decodeURIComponent\s*\(\s*escape\s*\(\s*)?atob\s*\(

composite_rules:
  - id: html-atob-self-decoding-loader
    desc: HTML self-decoding atob document writer
    conf: 0.98
    all:
      - id: html-atob-document-write
      - id: micro-behaviors/data/decode/base64::large-base64-atob-decode

  - id: atob-document-write-script-injection
    desc: atob document write delivers script injector
    crit: hostile
    conf: 0.98
    attack: T1027,T1105
    all:
      - id: html-atob-document-write
      - id: micro-behaviors/data/string/conversion::fromcharcode-numeric-sequence
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    near_bytes: 1024
