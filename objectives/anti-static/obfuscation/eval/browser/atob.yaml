defaults:
  crit: suspicious
  platforms: [windows, unix]

traits:
  - id: eval-unescape
    desc: "JavaScript eval(unescape(...)) outside comments"
    conf: 0.95
    for: [javascript]
    attack: "T1027"
    if:
      type: text
      # A following backslash is an escaped quote inside a stored string
      # (`unescape(\'%61...`) such as an XSS log fixture, not a call.
      regex: '(?m)^[ \t]*[^/*\s\r\n].{0,500}\beval\s*\(\s*unescape\s*\([^\\]'
    unless:
      - type: text
        substr: 'var parts = option.split("=");'
      - id: metadata/lang/source/syntax/call::markup-or-decoded-alert-calls
      - id: well-known/tool/development/webinspector/

  - id: html-atob-document-write
    desc: HTML atob self-decoding loader
    conf: 0.97
    for: [html, javascript]
    attack: "T1027"
    if:
      type: text
      regex: document\.write\s*\(\s*decodeURIComponent\s*\(\s*escape\s*\(\s*atob\s*\(

composite_rules:
  - id: html-atob-self-decoding-loader
    desc: HTML self-decoding atob document writer
    conf: 0.98
    all:
      - id: html-atob-document-write
      - id: micro-behaviors/data/decode/base64::large-base64-atob-decode
