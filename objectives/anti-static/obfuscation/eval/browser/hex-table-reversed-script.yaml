# Hacked-page injection: a hex-escaped string table holds a reversed
# `<script src=...>` tag plus the names split/reverse/join/write, and a
# computed document member (`document[t[5]](...)`) writes the re-reversed
# tag without naming document.write. Table, reversed tag and computed write
# together conceal the injected element from markup and string scanners.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027,T1189

composite_rules:
  - id: hex-table-reversed-script-computed-write
    desc: Hex table hides reversed script tag for computed write
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/encoding::javascript-hex-escape-string-table
      - id: micro-behaviors/data/string/reverse::reversed-script-tag-text
      - id: micro-behaviors/data/control-flow/dispatch::js-computed-document-call
