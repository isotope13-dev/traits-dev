# Dictionary-fed eval: the eval call's argument is built out of token-table
# lookups (eval(b["egi"]+b["NPU"]+...)), so the sink demonstrably consumes
# the concealment table instead of merely sitting near one. Referrer-gated
# drive-by kits on compromised blogs assemble their whole loader this way;
# ordinary code never evaluates an expression composed of dictionary reads.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: dictionary-fed-eval-loader
    desc: Eval executes concatenated dictionary lookups
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/concat::js-eval-dictionary-concat
    any:
      - id: micro-behaviors/data/string/concat::js-indexed-token-table
      - id: micro-behaviors/data/string/concat::js-named-token-table
