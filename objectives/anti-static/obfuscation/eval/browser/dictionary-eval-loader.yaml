# Dictionary-fed eval: the eval call's argument is built out of token-table
# lookups. This is an obfuscated dynamic-code attempt; the source text alone
# does not establish that the assembled program is valid or hostile.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: dictionary-fed-eval-obfuscation
    desc: Eval argument concatenates dictionary lookups
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/concat::js-eval-dictionary-concat
    any:
      - id: micro-behaviors/data/string/concat::js-indexed-token-table
      - id: micro-behaviors/data/string/concat::js-named-token-table
