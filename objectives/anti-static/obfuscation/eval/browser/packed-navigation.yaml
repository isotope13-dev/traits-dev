# Packer used to hide page navigation: the eval(function(p,a,c,k,e,d)...)
# wrapper's token dictionary carries both `referrer` and `location`, so the
# packed body reads where the visitor came from and moves the page. Packing a
# few lines of redirect logic exists only to keep that logic out of view.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027.002

composite_rules:
  - id: packer-hides-referrer-navigation
    desc: Packer eval hides referrer-driven page navigation
    crit: hostile
    conf: 0.93
    near_bytes: 2000
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
      - id: micro-behaviors/communications/url/navigation-http::packer-dictionary-referrer-token
      - id: micro-behaviors/ui/window/navigation::packer-dictionary-location-token
