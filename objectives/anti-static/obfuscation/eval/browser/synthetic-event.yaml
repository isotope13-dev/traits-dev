# A newly created element compiles variable code into onclick, then invokes it
# synthetically. This is an eval substitute, not an ordinary click listener.
# Bind the created, compiled and clicked receiver; unrelated UI clicks do not count.
# Dotted and string-subscript calls share the same receiver/value bindings.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: synthetic-click-code-evaluation
    desc: Synthetic click evaluates dynamic handler code
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.007
    if:
      type: tree-sitter
      query: |
        ((statement_block
          [(variable_declaration (variable_declarator name: (identifier) @created value: (call_expression function: [(member_expression property: (property_identifier) @create) (subscript_expression index: (string (string_fragment) @create))] arguments: (arguments (string)))))
           (lexical_declaration (variable_declarator name: (identifier) @created value: (call_expression function: [(member_expression property: (property_identifier) @create) (subscript_expression index: (string (string_fragment) @create))] arguments: (arguments (string)))))]
          . (expression_statement (call_expression function: [(member_expression object: (identifier) @compiled property: (property_identifier) @set) (subscript_expression object: (identifier) @compiled index: (string (string_fragment) @set))] arguments: (arguments . (string (string_fragment) @event) . [(identifier) (call_expression)] .)))
          . (expression_statement (call_expression function: [(member_expression object: (identifier) @clicked property: (property_identifier) @click) (subscript_expression object: (identifier) @clicked index: (string (string_fragment) @click))] arguments: (arguments)))) @dispatch
          (#eq? @create "createElement")
          (#eq? @set "setAttribute")
          (#eq? @event "onclick")
          (#eq? @click "click")
          (#eq? @created @compiled)
          (#eq? @compiled @clicked))
        ((statement_block
          [(variable_declaration (variable_declarator name: (identifier) @created value: (call_expression function: [(member_expression property: (property_identifier) @create) (subscript_expression index: (string (string_fragment) @create))] arguments: (arguments (string)))))
           (lexical_declaration (variable_declarator name: (identifier) @created value: (call_expression function: [(member_expression property: (property_identifier) @create) (subscript_expression index: (string (string_fragment) @create))] arguments: (arguments (string)))))]
          . (expression_statement (call_expression function: [(member_expression object: (identifier) @compiled property: (property_identifier) @set) (subscript_expression object: (identifier) @compiled index: (string (string_fragment) @set))] arguments: (arguments . (string (string_fragment) @event) . [(identifier) (call_expression)] .)))
          . (expression_statement (call_expression function: [(member_expression property: (property_identifier) @append) (subscript_expression index: (string (string_fragment) @append))] arguments: (arguments . (identifier) @appended .)))
          . (expression_statement (call_expression function: [(member_expression object: (identifier) @clicked property: (property_identifier) @click) (subscript_expression object: (identifier) @clicked index: (string (string_fragment) @click))] arguments: (arguments)))) @dispatch
          (#eq? @create "createElement")
          (#eq? @set "setAttribute")
          (#eq? @event "onclick")
          (#eq? @click "click")
          (#eq? @created @compiled)
          (#eq? @compiled @clicked)
          (#eq? @append "appendChild")
          (#eq? @appended @created))
