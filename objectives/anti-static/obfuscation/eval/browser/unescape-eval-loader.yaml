# Layered browser loaders: the page carries its payload as percent-encoded
# fragments, URL-decodes them into an evaluated stage, and that stage
# rebuilds its own output through a custom alphabet remap before writing it
# into the document. Each step is ordinary alone; the two decoding layers
# plus the document sink together are a self-decoding loader.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1059.007
composite_rules:
  - id: layered-decode-eval-document-loader
    desc: Layered decoding with eval and document write
    crit: hostile
    conf: 0.96
    near_bytes: 2500
    all:
      - id: micro-behaviors/data/decode/url::js-unescape-eval-sequence
      - id: micro-behaviors/data/decode/custom::js-indexof-modulo-charat-decoder
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
    unless:
      - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
      - id: well-known/tool/development/webinspector/
