defaults:
  platforms: [unix, windows]
  mbc: B0032
  attack: T1027,T1059.007
traits:
  # `Function(function decode(...){...})(...)` — the Function constructor is
  # applied directly to an inline function literal, so the program that runs is
  # produced at call time and never appears as source text.
  #
  # Deliberately a text matcher, not tree-sitter: the packed multi-megabyte
  # single-line droppers this shape belongs to exceed the JavaScript parser's
  # scanner-state guard, so cleave reports `source.ast_unavailable` for them
  # and every AST-anchored sink (`function-ctor-call-expr-arg`,
  # `js-function-constructor`) is silently unreachable. Component on its own —
  # the decoder proximity comes from the packed-dropper composite that
  # references it alongside a char-code/XOR decoder leg.
  - id: function-ctor-wraps-inline-function
    desc: Function constructor wraps inline function
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bFunction\s*\(\s*function\b'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
composite_rules:
  # Indexed constructor arguments plus a Function sink indicate concealed
  # dynamic code, but packers and minifiers can produce this shape too.
  - id: string-table-function-constructor
    desc: String table feeds Function constructor
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: objectives/anti-static/obfuscation/syntax::js-new-from-indexed-string-table
      - id: micro-behaviors/process/interpreter/eval/compile::function-ctor-call-expr-arg

  - id: wscript-xor-dynamic-function-stage
    desc: WScript XOR-obfuscated dynamic Function stage
    crit: hostile
    conf: 0.97
    mbc: B0032.001
    platforms: [windows]
    for: [javascript]
    all:
      - id: micro-behaviors/os/com/object::wscript-createobject-call
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
  # A Function constructor combined with several independent decoder
  # indicators is a packed loader, not ordinary dynamic configuration. The
  # individual atoms remain neutral/notable on their own.
  - id: packed-function-constructor-decoder
    desc: Obfuscated Function constructor executes decoded JavaScript
    crit: hostile
    conf: 0.98
    # Decoder atoms are common in bundled libraries. They must occur in one
    # analyzed source file and close together, and the decoded value must feed
    # an execution sink, before this intent-level rule labels the file as a
    # packed loader. A Function constructor that is only created or passed
    # around is a capability, not evidence that decoded code runs.
    scope: leaf
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor
      - id: micro-behaviors/data/source/arithmetic::js-bitwise-arithmetic-chain
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call-text
      - id: objectives/anti-static/obfuscation/encoding/hex::hex-array-access
    any:
      - id: micro-behaviors/data/source/dynamic/eval::new-function-iife
      - id: micro-behaviors/process/interpreter/eval/direct::js-indirect-eval-variable
