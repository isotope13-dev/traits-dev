defaults:
  platforms: [unix, windows, macos]
  mbc: B0032
composite_rules:
  - id: wscript-xor-dynamic-function-stage
    desc: WScript XOR-obfuscated dynamic Function stage
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    mbc: B0032.001
    platforms: [windows]
    for: [javascript]
    all:
      - id: objectives/execution/interpreter/vbscript/interpreter::wscript-createobject-dup
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
      - id: micro-behaviors/process/interpreter/eval::js-new-function-variable-argument
  # Notable, not suspicious, and no longer named for a severity it does not
  # carry. `new Function(...)()` on its own is a dynamic-code CAPABILITY: it is
  # the pre-ES5 JSON.parse shim, the globalThis discovery idiom, webpack's module
  # wrapper, and the compile step of every template engine (lodash template,
  # doT, EJS) and client-side framework compiler. It hides nothing and crosses
  # no boundary, which is what `suspicious` is for -- and the nine carve-outs
  # this rule had accumulated were the standing evidence that it was pitched too
  # high (it convicted stock Baidu Tongji analytics, deployed on millions of
  # pages, for its `new Function("return (" + s + ")")` JSON fallback).
  # The packed-loader signal stays where the comment below puts it: a Function
  # constructor PLUS independent decoder evidence.
  - id: immediate-new-function-invocation
    desc: Immediate invocation of new Function
    crit: notable
    conf: 0.9
    attack: T1027
    all:
      - id: micro-behaviors/data/source/dynamic/eval::new-function-iife
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/library/runtime/
    unless:
      - id: micro-behaviors/data/source/dynamic/eval::new-function-return-this
      - id: micro-behaviors/data/source/dynamic/eval::new-function-json-parse-fallback
      - id: metadata/library/structure/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: micro-behaviors/os/module/load::dynamic-import-function-constructor
      - id: well-known/app/browser/google-web::google-platform-js-asset

  # A Function constructor combined with several independent decoder
  # indicators is a packed loader, not ordinary dynamic configuration. The
  # individual atoms remain neutral/notable on their own.
  - id: packed-function-constructor-decoder
    desc: Obfuscated Function constructor executes decoded JavaScript
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007
    # Decoder atoms are common in bundled libraries. They must occur in one
    # analyzed source file and close together, and the decoded value must feed
    # an execution sink, before this intent-level rule labels the file as a
    # packed loader. A Function constructor that is only created or passed
    # around is a capability, not evidence that decoded code runs.
    scope: leaf
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/interpreter/eval::js-function-constructor
      - id: micro-behaviors/data/source/arithmetic::js-bitwise-arithmetic-chain
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call-text
      - id: objectives/anti-static/obfuscation/encoding/hex::hex-array-access
    any:
      - id: micro-behaviors/data/source/dynamic/eval::new-function-iife
      - id: micro-behaviors/process/interpreter/eval::js-indirect-eval-variable
