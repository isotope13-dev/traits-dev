# `_=([![]]+{})[+!+[]+[+[]]]+([]+[]+{})[+!+[]]+...;_[_][_](code)()` spells
# the word "constructor" from coerced literals, then indexes it twice off
# itself: the first lookup reaches String, the second reaches Function, and
# the call compiles `code` into a function that runs at once. The property
# name and the sink never appear as source text.
#
# The hostile composite requires the payload argument to be built from a
# char-code alphabet interleaved with JSFuck picks (encoding/lookup), so the
# executed program is concealed as well as the sink. A JSFuck-only demo or
# a minifier's ordinary constructor lookup does not complete it.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, xml]
  attack: T1027,T1059.007
  mbc: B0032

traits:
  - id: symbol-variable-jsfuck-string-assignment
    desc: Symbol variable assigned JSFuck-spelled string
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(^|[^\w$])[_$]{1,3}=(\([!+\[\]{}]{3,24}\)\[[!+\[\]]{2,24}\]\+){8}'

  - id: self-indexed-symbol-call
    desc: Symbol variable double-indexed then called
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[^\w$])([_$]{1,3})\[[_$]{1,3}\]\[[_$]{1,3}\]\('

composite_rules:
  - id: jsfuck-spelled-constructor-function-call
    desc: JSFuck-spelled constructor reaches Function
    crit: suspicious
    conf: 0.94
    near_bytes: 2000
    all:
      - id: symbol-variable-jsfuck-string-assignment
      - id: self-indexed-symbol-call

  - id: jsfuck-function-runs-charcode-alphabet-payload
    desc: Function constructor runs char-code alphabet payload
    crit: hostile
    conf: 0.96
    near_bytes: 4000
    all:
      - id: jsfuck-spelled-constructor-function-call
      - id: objectives/anti-static/obfuscation/encoding/lookup::charcode-alphabet-jsfuck-interleave
