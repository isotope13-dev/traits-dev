# Runtime-generated npm stages pass privileged host objects through randomized
# getter names so the compiled body can recover browser and Node capabilities
# without naming those bindings in its own parameter list.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007
  mbc: B0032

traits:
  - id: randomized-window-getter
    desc: Randomized getter conceals window binding
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'get"[A-Za-z0-9_$]{5,}"\(\)\{return window\}'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/

composite_rules:
  - id: decoded-function-receives-concealed-host-apis
    desc: Decoded Function stage receives concealed host APIs
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105
    scope: file
    all:
      - id: randomized-window-getter
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor
      - id: micro-behaviors/os/module/load::node-require-returning-getter
      - id: objectives/anti-static/obfuscation/encoding/hex::hex-array-access
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
