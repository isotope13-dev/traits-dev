defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # Join on the computed property access used by the active factory chain.
  # The observation concerns concealing the execution API, independently of
  # the packed program contents and its post-export activation.
  - id: node-code-factory-hidden-by-permuted-key
    desc: Node stage conceals its code-factory lookup
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007
    scope: file
    near_bytes: 0
    all:
      - id: objectives/execution/payload/script-eval::node-permuted-code-factory-stage
      - id: micro-behaviors/data/property/access::function-property-key-from-permutation-prefix
