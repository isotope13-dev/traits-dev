# A loader that tags `global["!"]` with a build id and hands Node's `global`
# and `require` to an IIFE whose body is concealed. The decoded program is a
# permutation-cipher stage (EtherHiding dropper in the Contagious Interview
# campaign) that cleave does not see, so the tag, the handoff and a
# concealment leg are the visible evidence. The concealment leg may be the
# obfuscator string-array runtime, a character permutation, off-screen
# padding, or a single oversized line.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1059.007,T1195.002

composite_rules:
  - id: tagged-global-require-handoff-loader
    desc: Build-tagged global loader hands require to concealed code
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: metadata/lang/javascript-features::global-bang-version-marker
      - id: micro-behaviors/data/control-flow/global::node-global-and-require-call-arguments
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/data/string/reorder::char-array-swap-and-join
      - id: metadata/file/line::source-code-after-horizontal-padding
      - id: metadata/file/line::single-long-line-outlier
    needs: 1
