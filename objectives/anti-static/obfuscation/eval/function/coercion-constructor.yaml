# JSFuck-family execution: a name spelled from coerced literals ("constructor")
# indexes itself twice -- `_[_][_]` is String.constructor.constructor, i.e.
# Function -- and the resulting constructor is handed a body assembled from
# more coercions and a char-code alphabet, then called. The program that runs
# never appears as text. Seen in SEO doorway injections that hide a
# search-referrer-gated full-screen TDS iframe.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027,T1059.007
  mbc: B0032

traits:
  # Identifiers made only of `_` and `$` are the encoder's own vocabulary;
  # minified code indexes word-named bindings (`e[t][n](`), not these.
  - id: symbol-named-double-index-call
    desc: Calls a double index on _/$-only names
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[^\w$])[_$]{1,3}\[[_$]{1,3}\]\[[_$]{1,3}\]\('

composite_rules:
  - id: coercion-built-constructor-runs-hidden-code
    desc: Coercion-built constructor chain runs hidden code
    crit: hostile
    conf: 0.95
    near_bytes: 16384
    all:
      - id: symbol-named-double-index-call
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::coercion-string-variable-binding
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::repeated-coercion-character-access
