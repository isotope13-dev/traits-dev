# Python source that no one wrote.
#
# An obfuscator turns a program into one module that holds the original as
# data plus a few lines to decode and run it. What comes out is a source file
# of several megabytes -- the largest module in a real project is a fraction
# of that, and the largest in CPython's own tree smaller still.
#
# Size is the part a new obfuscator cannot avoid: it can change the alphabet,
# the class names and the decode routine, and the file is still the whole
# program written out as an escaped constant. The encoding below is what one
# family currently uses; the size is what the next one will share.
defaults:
  platforms: [windows, unix]
  for: [pyc]
  attack: T1027
  mbc: B0032

traits:
  - id: oversized-python-module
    desc: Python module is megabytes of source
    crit: notable
    conf: 0.9
    if:
      # The size the header records for the source the bytecode came from.
      # Generated API clients and test tables are the large end of honest
      # Python and reach about a megabyte; this is past twice that.
      type: metrics
      field: pyc.source_size
      min: 2000000

  - id: slash-separated-hex-payload
    desc: Payload encoded as slash-joined hex
    crit: suspicious
    conf: 0.92
    if:
      # `f1bea49d/f1bea4a1/f1bea4a4/...` for megabytes. Each group is a
      # character of the original program written as its UTF-8 bytes, so the
      # source contains no word of the code it runs.
      type: text
      regex: '([0-9a-f]{4,8}/){16,}'

composite_rules:
  # A module too large to have been written, holding its program as an
  # encoded constant. Together that is a packer's output, whatever the packer.
  - id: packed-python-module
    desc: Python module is a packed payload
    crit: hostile
    conf: 0.95
    all:
      - id: oversized-python-module
      - id: slash-separated-hex-payload
