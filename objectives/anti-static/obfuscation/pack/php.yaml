# SourceGuardian-encoded PHP. The encoder keeps the program as an encrypted
# constant and hands it to sg_load(), which only the vendor's loader extension
# can run. Commercial applications ship this, so the pair is suspicious, not
# hostile. Where it appears beside a passworded archive, the concealed program
# is the payload, and the archive's own rule carries that conviction.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: suspicious
  conf: 0.9
  attack: T1027
  mbc: B0032

traits:
  - id: sourceguardian-sg-load-blob
    desc: sg_load() call with a long encoded constant
    crit: notable
    if:
      # The encoded program is a single long constant in the call argument,
      # so a short string or a call with a variable argument does not match.
      type: text
      regex: 'sg_load\(\W{0,2}[A-Za-z0-9+/=]{200,}'

  - id: sourceguardian-loader-download-url
    desc: SourceGuardian loader download URL
    crit: notable
    if:
      type: text
      substr: 'sourceguardian.com/loaders/download.php'

composite_rules:
  - id: php-sourceguardian-encoded-loader
    desc: PHP file loads SourceGuardian-encoded bytecode
    crit: suspicious
    conf: 0.9
    all:
      - id: sourceguardian-sg-load-blob
      - id: sourceguardian-loader-download-url
