defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86, x86-64]
  crit: suspicious
  conf: 0.97
  attack: T1027

traits:
  # Adjacent inverse conditional branches always jump to the same destination,
  # leaving the intervening bytes unreachable. Reject common ModRM overlaps before
  # counting repeated sites in executable
  # sections, not branch-shaped bytes in resources or one incidental sequence.
  - id: repeated-complementary-branches-over-junk
    desc: Repeated inverse branches skip junk bytes
    size_max: 33554432
    if:
      type: yara
      source: |
        import "pe"
        rule repeated_complementary_branches_over_junk {
          strings:
            $pair = /[\x70-\x7f][\x05-\x40][\x70-\x7f][\x03-\x3e]/
          condition:
            pe.is_pe and #pair >= 8 and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for 8 p in (1..#pair) : (
                @pair[p] >= pe.sections[s].raw_data_offset and
                @pair[p]+2+uint8(@pair[p]+1) <
                  pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
                (uint8(@pair[p]) ^ uint8(@pair[p]+2)) == 1 and
                uint8(@pair[p]+1) == uint8(@pair[p]+3)+2 and
                not (
                  uint8(@pair[p]-2) >= 0x40 and uint8(@pair[p]-2) <= 0x4f and
                  (uint8(@pair[p]-1) == 0x89 or uint8(@pair[p]-1) == 0x8b)
                ) and
                not (
                  uint8(@pair[p]-1) == 0x80 and
                  uint8(@pair[p]) & 0x38 == 0x38
                )
              )
            )
        }
