# Each adjacent INC/DEC pair restores the same byte register's value, but
# changes arithmetic flags. Thirty-two uninterrupted pairs in executable
# bytes are padding rather than ordinary arithmetic. Match both orders and
# all eight legacy byte registers; unrelated registers must not qualify.
# Protectors can emit this too, so the observation is suspicious, not hostile.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86, x86-64]

traits:
  - id: x86-long-byte-inc-dec-padding
    desc: Long canceling byte-register INC/DEC runs
    crit: suspicious
    conf: 0.97
    attack: T1027.001
    if:
      type: yara
      source: |
        import "pe"
        rule x86_long_byte_inc_dec_padding {
          strings:
            $pair_al = /(\xfe\xc0\xfe\xc8|\xfe\xc8\xfe\xc0){32}/
            $pair_cl = /(\xfe\xc1\xfe\xc9|\xfe\xc9\xfe\xc1){32}/
            $pair_dl = /(\xfe\xc2\xfe\xca|\xfe\xca\xfe\xc2){32}/
            $pair_bl = /(\xfe\xc3\xfe\xcb|\xfe\xcb\xfe\xc3){32}/
            $pair_ah = /(\xfe\xc4\xfe\xcc|\xfe\xcc\xfe\xc4){32}/
            $pair_ch = /(\xfe\xc5\xfe\xcd|\xfe\xcd\xfe\xc5){32}/
            $pair_dh = /(\xfe\xc6\xfe\xce|\xfe\xce\xfe\xc6){32}/
            $pair_bh = /(\xfe\xc7\xfe\xcf|\xfe\xcf\xfe\xc7){32}/
          condition:
            for any s in (0..pe.number_of_sections - 1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any of ($pair_*) : (
                for any m in (1..#) : (
                  @[m] >= pe.sections[s].raw_data_offset and
                  @[m] + ![m] <=
                    pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
                )
              )
            )
        }
