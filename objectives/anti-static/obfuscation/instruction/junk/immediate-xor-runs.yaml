# Eight adjacent immediate XORs of one register collapse to a single XOR;
# long repetitions in an executable detour obstruct useful disassembly.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
- id: x86-dense-immediate-xor-run
  desc: Dense reducible immediate-XOR instruction runs
  crit: suspicious
  conf: 0.97
  attack: T1027.001
  count_min: 16
  if:
    type: hex
    section: htext
    pattern: '81 F1 [4] 81 F1 [4] 81 F1 [4] 81 F1 [4] 81 F1 [4] 81 F1 [4] 81 F1 [4] 81 F1 [4]'
