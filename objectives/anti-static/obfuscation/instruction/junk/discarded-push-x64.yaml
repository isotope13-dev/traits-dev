# Repeated immediate pushes whose stack slot is immediately discarded.
# Immediate values and file/section names are deliberately unconstrained.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-repeated-discarded-immediate-push
    desc: Repeated pushes discarded by stack adjustment
    crit: suspicious
    conf: 0.97
    attack: T1027
    count_min: 32
    if:
      type: hex
      section: any
      pattern: '68 ?? ?? ?? ?? 48 8D 64 24 08'
