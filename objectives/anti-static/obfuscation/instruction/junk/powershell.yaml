# Arithmetic junk in PowerShell source. Obfuscators inflate a short payload with
# assignments whose deeply parenthesized constant arithmetic feeds randomized
# variables that have no operational role. Repeated literal-vs-literal tests
# provide the opaque branches that make the generated filler look like control
# flow while retaining a result known at generation time.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1027
  mbc: B0032

traits:
  - id: dense-parenthesized-arithmetic-assignments
    desc: Dense nested arithmetic assignments
    crit: notable
    conf: 0.9
    count_min: 8
    if:
      # PowerShell's parser projection does not reliably expose assignment
      # nodes, so match the source lines directly. The count floor keeps
      # ordinary calculations and version comparisons out.
      type: text
      regex: '(?m)^[ \t]*\$[A-Za-z]\w{5,}[ \t]*=[ \t]*\({2,}[0-9 \t()+*/%\-]{3,240}[ \t]*;?[ \t]*$'

  - id: repeated-literal-integer-comparisons
    desc: Repeated literal integer comparisons
    crit: component
    conf: 0.86
    count_min: 2
    if:
      # Both operands are integer literals, so the result is fixed before
      # execution. PowerShell permits these comparisons inside parentheses.
      type: text
      regex: '-?\d{1,9}\s+-[elgnt][qte]\s+-?\d{1,9}\b'

composite_rules:
  - id: powershell-arithmetic-opaque-junk
    desc: PowerShell payload padded with arithmetic assignments and opaque comparisons
    crit: suspicious
    conf: 0.95
    all:
      - id: dense-parenthesized-arithmetic-assignments
      - id: repeated-literal-integer-comparisons

  - id: powershell-arithmetic-junk-obfuscated-payload
    desc: PowerShell arithmetic junk with variable mangling or crypto
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001
    all:
      - id: powershell-arithmetic-opaque-junk
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/variables::ps-alternating-alphanumeric-vars
      - id: micro-behaviors/crypto/symmetric/xor/rotational::powershell-xor-rotate-transform
