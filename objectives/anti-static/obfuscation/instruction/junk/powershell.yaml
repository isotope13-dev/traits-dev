# Arithmetic junk in PowerShell source. Obfuscators inflate a short payload with
# assignments whose deeply parenthesized constant arithmetic feeds randomized
# variables that have no operational role. Repeated literal-vs-literal tests
# provide the opaque branches that make the generated filler look like control
# flow while retaining a result known at generation time.
defaults:
  platforms: [windows, linux, macos]
  for: [powershell]
  attack: T1027
  mbc: B0032

traits:
  - id: dense-parenthesized-arithmetic-assignments
    desc: Dense nested arithmetic assignments
    crit: notable
    conf: 0.9
    count_min: 8
    if:
      type: tree-sitter
      kind: assignment
      # Require parsed assignments with nested parentheses, a nontrivial
      # variable name, and arithmetic against an integer literal. The count
      # floor keeps ordinary calculations and version comparisons out.
      regex: '^\$[A-Za-z][A-Za-z0-9]{5,}\s*=\s*\({2,}[^\r\n]{0,160}[-+*]\s*-?[0-9]{1,9}'

  - id: repeated-literal-integer-comparisons
    desc: Repeated literal integer comparisons
    crit: component
    conf: 0.86
    count_min: 2
    if:
      type: tree-sitter
      # Both operands are integer literals, so the branch outcome is fixed
      # before execution. Bind the operator structurally, then restrict the
      # complete expression to the six integer-ordering operators.
      query: |
        (comparison_expression
          (_) @left
          (comparison_operator) @operator
          (_) @right) @comparison
        (#match? @comparison "(?i)^-?[0-9]{1,9}\\s+-(eq|ne|lt|le|gt|ge)\\s+-?[0-9]{1,9}$")

composite_rules:
  - id: powershell-arithmetic-opaque-junk
    desc: PowerShell payload padded with arithmetic assignments and opaque comparisons
    crit: suspicious
    conf: 0.95
    all:
      - id: dense-parenthesized-arithmetic-assignments
      - id: repeated-literal-integer-comparisons
