defaults:
  platforms: [windows]
  for: [dos_com, data]
  arch: [x86]
  size_max: 65536

traits:
  - id: dos-jump-skipped-nop-register-save
    desc: Repeated jumps skip NOPs between register saves
    crit: suspicious
    conf: 0.99
    attack: T1027.001
    if:
      type: hex
      offset_range: [0, 1024]
      pattern: '9C EB 01 90 50 EB 01 90 53 EB 01 90 51 EB 01 90 52 EB 01 90 56 EB 01 90 57 EB 01 90'
