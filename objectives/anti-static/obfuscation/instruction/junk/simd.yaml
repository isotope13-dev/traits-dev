defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86
  attack: T1027
  crit: suspicious
  conf: 0.97
traits:
- id: simd-jump-junk-padding
  desc: SIMD sequence jumps over junk bytes
  if:
    type: hex
    section: .text
    pattern: 0F (E8|D8|FE) ?? [0-16] EB 06 [6] 5F 0F 71 ?? ??
composite_rules:
- id: vb6-simd-padded-native-code
  desc: VB6 DLL dispatch with SIMD-padded native code
  all:
  - id: simd-jump-junk-padding
  - id: metadata/binary/framework::vb6-application-framework
  - id: micro-behaviors/dylib/lookup::vb6-runtime-api-dispatch
