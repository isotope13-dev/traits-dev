# Three SSE instruction blocks connected by short jumps over junk. The
# displacement is checked against each target, not guessed from nearby bytes.
# SIMD image/audio routines normally fall through rather than hopping over
# 16..96 uninterpretable bytes after each short block.
defaults:
  platforms: [windows]
  for: [data, pe, dll]
  size_max: 2000000
traits:
  - id: simd-jump-junk-chain
    desc: Repeated SIMD blocks jump over junk regions
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: yara
      source: |
        rule simd_jump_junk_chain {
          strings:
            $b = { 66 0F ?? ?? EB ?? }
          condition:
            #b >= 3 and for any i in (1..#b) : (
              uint8(@b[i]+5) >= 16 and uint8(@b[i]+5) <= 96 and
              for any n in (0..8) : (
                $b at (@b[i]+6+uint8(@b[i]+5)+n) and
                for any m in (0..12) : (
                  $b at (@b[i]+6+uint8(@b[i]+5)+n+6+
                         uint8(@b[i]+6+uint8(@b[i]+5)+n+5)+m)
                )
              )
            )
        }
