# Repeated register-to-itself MOV instructions preserve register values.
# Require a contiguous 64-byte run in executable section bytes, rather than
# ordinary alignment NOPs, embedded data, a section name, or a sample identity.
# Protectors can emit this padding too, so this is suspicious, not hostile.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86, x86-64]

traits:
  - id: x86-long-self-move-padding
    desc: Long self-move runs in executable sections
    crit: suspicious
    conf: 0.97
    attack: T1027.001
    if:
      type: yara
      source: |
        import "pe"
        rule x86_long_self_move_padding {
          strings:
            $self_move = /(\x88[\xc0\xc9\xd2\xdb\xe4\xed\xf6\xff]){32}/
          condition:
            for any s in (0..pe.number_of_sections - 1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any m in (1..#self_move) : (
                @self_move[m] >= pe.sections[s].raw_data_offset and
                @self_move[m] + !self_move[m] <=
                  pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
              )
            )
        }
