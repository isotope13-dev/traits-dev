# Repeated pairs cancel on the same register. The byte count is a minimum,
# not a sample size; randomized keys, addresses and file names are irrelevant.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
- id: repeated-canceling-not-pairs
  desc: Repeated canceling x86 NOT instruction pairs
  crit: suspicious
  conf: 0.95
  attack: T1027.001
  size_max: 5242880
  if:
    # A VEX-encoded instruction can end with F7 D0 followed by a single
    # NOT; that is not a pair of NOT instructions.
    type: yara
    source: |
      import "pe"
      rule canceling_not_pairs {
        strings:
          $pair = { F7 (D0|D1|D2|D3|D6|D7) F7 (D0|D1|D2|D3|D6|D7) }
        condition:
          for any s in (0..pe.number_of_sections - 1) : (
            pe.sections[s].name == ".text" and
            for 2 i in (1..#pair) : (
              @pair[i] >= pe.sections[s].raw_data_offset + 3 and
              @pair[i] + 4 <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
              uint8(@pair[i]+1) == uint8(@pair[i]+3) and
              uint8(@pair[i]-3) != 0xc4 and uint8(@pair[i]-2) != 0xc5
            )
          )
      }
  unless:
  - id: metadata/lang/compiler/managed::dotnet-assembly
