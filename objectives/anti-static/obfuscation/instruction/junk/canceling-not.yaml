# Repeated pairs cancel on the same register. The byte count is a minimum,
# not a sample size; randomized keys, addresses and file names are irrelevant.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
- id: repeated-canceling-not-pairs
  desc: Repeated canceling x86 NOT instruction pairs
  crit: suspicious
  conf: 0.95
  attack: T1027.001
  size_max: 5242880
  count_min: 6
  if:
    type: hex
    section: .text
    pattern: '(F7 D0 F7 D0|F7 D1 F7 D1|F7 D2 F7 D2|F7 D3 F7 D3|F7 D6 F7 D6|F7 D7 F7 D7)'
  unless:
    - id: metadata/binary/vendor/
