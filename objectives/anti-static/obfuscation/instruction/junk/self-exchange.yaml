# At least 32 adjacent same-register XCHG instructions in an executable
# section. These preserve registers and flags; normal alignment does not need
# dozens of two-byte exchanges. Restrict to x86 because a 32-bit register write
# can clear its upper half in long mode. Section names and family strings are
# irrelevant. Protectors can emit this filler too: suspicious, not hostile.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]

traits:
  - id: x86-long-self-exchange-padding
    desc: Long self-exchange runs in executable sections
    crit: suspicious
    conf: 0.97
    attack: T1027.001
    if:
      type: yara
      source: |
        import "pe"
        rule x86_long_self_exchange_padding {
          strings:
            $self_exchange = /([\x86\x87][\xc0\xc9\xd2\xdb\xe4\xed\xf6\xff]){32}/
          condition:
            for any s in (0..pe.number_of_sections - 1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any m in (1..#self_exchange) : (
                @self_exchange[m] >= pe.sections[s].raw_data_offset and
                @self_exchange[m] + !self_exchange[m] <=
                  pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
              )
            )
        }
