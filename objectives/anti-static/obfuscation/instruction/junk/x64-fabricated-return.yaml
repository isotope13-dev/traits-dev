defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  crit: suspicious
traits:
  # Fabricate the return address on the stack, restore RAX, then jump.
  # Displacements and import-table offsets vary with the host executable.
  - id: x64-repeated-fabricated-return-jumps
    desc: Repeated fabricated returns before x64 jumps
    conf: 0.98
    attack: T1027
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: '50 48 8D 05 [4] 48 89 44 24 08 58 (FF A3 [4]|FF E0)'
