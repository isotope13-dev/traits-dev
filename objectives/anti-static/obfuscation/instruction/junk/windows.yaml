# Junk Code and Disassembler Frustration
# Detects instructions designed to crash or confuse disassemblers/analyzers
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [linux, macos, windows]
traits:
- id: ud2-junk-code
  desc: Dense undefined instructions (UD2)
  crit: suspicious   # Downgraded from suspicious - can be compiler padding/alignment
  conf: 0.75
  for: [pe, elf, macho, -go, -rust]
  count_min: 20
  size_max: 10485760
  if:
    type: hex
    section: text
    pattern: "0F 0B"
      # per_kb_min removed - count_min is sufficient for detecting deliberate junk
  downgrade:
    any:
    - id: metadata/signed/platform::apple
# Dead-register arithmetic churn. `mov ebx,eax` (89 C3) or `mov eax,ebx`
# (89 D8) immediately followed by `xor eax,ebx` (31 D8) always leaves eax
# zero, because the xor operand was just copied from its own source. No
# compiler emits that: zeroing a register is `31 C0`, two bytes, and an
# optimiser would delete the pair outright. It survives only where the
# instructions exist to pad and confuse -- hand-written stubs and the
# polymorphic junk engines this directory already models on the source side
# (junk-insertion/go-*, csharp), which until now had no counterpart for the
# junk actually emitted into a PE.
#
# `count_min: 3` inside `section: text` also makes a chance hit implausible:
# a specific 4-byte sequence lands roughly once per 4 GB of code, so three of
# them in one code section is not coincidence. Suspicious rather than
# hostile -- junk insertion conceals intent but is not itself an attack, and
# packer/protector stubs legitimately carry it.
- id: dead-register-xor-churn
  desc: Dead-register xor churn (junk code)
  crit: suspicious
  conf: 0.85
  for: [pe, dll]
  platforms: [windows]
  count_min: 3
  # The "3 hits is not coincidence" argument assumes a malware-sized code
  # section (a few hundred KB to a few MB). It breaks down for a 50MB+ static
  # binary: FFmpeg's Windows build (dozens of codecs' worth of hand-tuned
  # compiler output) turns up 16 matches at a density of 0.0003/KB -- sparse,
  # not junk-insertion, just a lot of code. Cap to the size range where the
  # improbability argument actually holds, matching this file's other
  # hex-pattern junk siblings (ud2-junk-code, and the 512KB-5MB caps below).
  size_max: 10485760
  if:
    type: hex
    section: text
    pattern: "89 (C3|D8) 31 D8"
  unless:
    # Dense crypto (Botan inside Mozilla rnp.dll) can collide with this 4-byte
    # sequence without junk-insertion intent.
    - id: metadata/signed/platform::mozilla
    - id: metadata/signed/leaf::mozilla-corporation
    - id: metadata/signed/platform::microsoft
    - id: metadata/signed/platform::apple
- id: dense-noop-function-stubs
  desc: Dense six-byte no-op function stubs
  crit: suspicious
  conf: 0.99
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  count_min: 100
  if:
    type: hex
    section: .text
    # push ebp; mov ebp,esp; nop; pop ebp; ret
    pattern: '55 89 E5 90 5D C3'
- id: native-self-loop-junk
  desc: Repeated native self-loops
  crit: suspicious
  conf: 0.96
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  count_min: 8
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 'EB FE 48'
  unless:
    - id: metadata/signed/platform/
    - id: metadata/signed/leaf::microsoft-corporation
    - id: metadata/binary/framework/
    # MinGW emits guarded self-branches as unreachable/error traps in ordinary
    # parser code (for example libxml2). Repetition there is compiler output,
    # not junk insertion; GNU/Go provenance is stronger than this short byte
    # sequence.
    - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe
    # GLib/GTK Windows builds contain legitimate short spin/error stubs with
    # this byte sequence; their version metadata is a stronger identity than
    # the isolated instruction pattern.
    - id: well-known/lib/runtime/glib/
    - id: well-known/tool/development/glib/
- id: indirect-call-compare-branches
  desc: Indirect call followed by a compare branch
  crit: component
  conf: 0.85
  for: [pe]
  count_min: 4
  size_max: 1048576
  if:
    type: hex
    section: ".text"
      # call [rip+disp32] (IAT); cmp eax, imm8
    pattern: "FF 15 ?? ?? ?? ?? 83 F8"
  unless:
  - id: well-known/app/media/graphics/

# The same byte pattern at a density a stub full of junk branches actually
# reaches. `FF 15 <rel32> 83 F8` is "call an imported function, compare the
# result to a small constant" -- the most ordinary Win32 idiom there is, so a
# handful of them says nothing: Microsoft's signtool.exe holds 4 across 231 KB
# (0.02/KB), 7-Zip's 7z-x64.exe 13 across 447 KB, Squirrel's StubExecutable 6.
# The loose `indirect-call-compare-branches` atom above keeps its four-match
# threshold for the family composites that pair it with malware-specific legs.
- id: indirect-call-compare-branches-stub-density
  desc: Dense IAT-call compare branches in a stub
  crit: component
  conf: 0.85
  for: [pe]
  count_min: 8
  per_kb_min: 0.5
  size_max: 524288
  if:
    type: hex
    section: ".text"
    pattern: "FF 15 ?? ?? ?? ?? 83 F8"

- id: indirect-call-compare-branches-dense
  desc: Dense indirect-call compare branches
  crit: notable
  conf: 0.9
  for: [pe]
  count_min: 100
  per_kb_min: 3.0
  if:
    type: hex
    section: ".text"
    pattern: "FF 15 ?? ?? ?? ?? 83 F8"
composite_rules:
- id: mass-noop-export-padding
  desc: Pads a PE with hundreds of exported no-op functions
  crit: hostile
  conf: 0.99
  attack: T1027.001
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  all:
  - id: dense-noop-function-stubs
  - id: objectives/anti-static/obfuscation/name-mangling/export-name::disassembler-style-export-flood
  - id: metadata/binary/metrics/threshold::many-exports-100
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: arithmetic-junk-system-directory-launch
  desc: Arithmetic-junked mutex-gated system-directory launch
  crit: hostile
  conf: 0.94
  attack: T1027
  for: [pe, dll]
  platforms: [windows]
  all:
  - id: dead-register-xor-churn
  - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
  - id: micro-behaviors/process/create/exec::winexec
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/process/sync/mutex::open-mutex
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: metadata/binary/installer/family/
- id: dense-generated-arithmetic-junk-x86
  desc: Dense generated x86 absolute-memory junk
  crit: hostile
  conf: 0.99
  attack: T1027
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  all:
  - id: metadata/binary/instruction::x86-absolute-xor-edi-high-count
  - id: metadata/binary/instruction::x86-absolute-or-immediate-high-count
  - id: metadata/binary/layout::pe-checksum-mismatch
  - id: metadata/binary/layout::pe-no-signature-record
  # Requires unsigned + stale checksum already. Brand VERSIONINFO / PDB identity
  # (e.g. Bitvise terminal client) must not suppress: trojanized hosts retain
  # those metadata fields after signature stripping and post-link mutation.
# Two fixes, both about the rule meaning what it says.
#
# The branch leg is now the density atom: "junk branches in a minimal stub"
# has to mean the stub is full of them, not that four call-and-compare pairs
# exist somewhere in an ordinary Windows program.
#
# Scope is per FILE, not per archive. The claim is that ONE small stub carries
# both the branches and the timing call; pooling across an archive attributed
# signtool.exe's IAT-compare pattern to whatever else the package vendored --
# electron-winstaller's copy was reported against `darice.cub`, a WiX
# validation database that is not even a PE.
- id: timing-junk-code-stub
  desc: "Timing API junk branches in minimal stub"
  crit: suspicious
  conf: 0.88
  attack: T1027
  for: [pe, archives]
  size_max: 524288
  scope: file
  all:
  - id: indirect-call-compare-branches-stub-density
  - id: micro-behaviors/time/query::get-tick-count
- id: timing-junk-code-recognized-marker
  desc: Recognized marker for timing junk branch patterns
  crit: component
  conf: 0.9
  any:
  - id: metadata/signed/trust-level::signed
  - id: metadata/file/string/identity::tool-identity-7zip
  - id: metadata/file/string/identity::official-7zip-component
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: well-known/lib/crypto/openssl::openssl-cryptogams
  - id: metadata/binary/installer/family::known-benign-installer
  - id: well-known/lib/runtime/mozilla-nspr::nspr-library
  - id: metadata/binary/symbols/plugin::x64dbg-plugin-export
  - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
  - id: micro-behaviors/process/exit/terminate::corexitprocess-string
  - id: well-known/lib/platform/microsoft-imagehlp::microsoft-imagehlp-dll
  - id: well-known/tool/sysadmin/cdrtools::cdrtools-component

- id: dense-timing-junk-code
  desc: "High density of timing API junk branches"
  crit: hostile
  conf: 0.95
  attack: T1027
  for: [pe]
  all:
  - id: indirect-call-compare-branches-dense
  - id: micro-behaviors/time/query::get-tick-count
  unless:
  - id: metadata/signed/trust-level::signed
  - id: well-known/game/steam::steam-api-exports
  - id: well-known/game/steam/
