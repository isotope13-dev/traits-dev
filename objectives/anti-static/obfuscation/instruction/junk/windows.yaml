# Junk Code and Disassembler Frustration
# Detects instructions designed to crash or confuse disassemblers/analyzers
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [linux, macos, windows]
traits:
- id: ud2-junk-code
  desc: Dense undefined instructions (UD2)
  crit: suspicious   # Downgraded from suspicious - can be compiler padding/alignment
  conf: 0.75
  for: [pe, elf, macho, -go, -rust]
  count_min: 20
  size_max: 10485760
  if:
    type: hex
    section: text
    pattern: "0F 0B"
      # per_kb_min removed - count_min is sufficient for detecting deliberate junk
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
# These byte sequences can begin inside a REX-prefixed x86-64 instruction.
# Retain the byte observation for existing composites without claiming that
# the bytes are aligned instructions or prove junk insertion.
- id: dead-register-xor-churn
  desc: Repeated move and xor opcode bytes
  crit: notable
  conf: 0.85
  for: [pe, dll]
  platforms: [windows]
  count_min: 3
  size_max: 10485760
  if:
    type: hex
    section: text
    pattern: "89 (C3|D8) 31 D8"
  unless:
    - id: metadata/signature/verified/platform::microsoft
    - id: metadata/signature/verified/platform::apple
    - id: well-known/tool/development/openharmony-hdc::openharmony-hdc-binary
- id: dense-noop-function-stubs
  desc: Dense six-byte no-op function stubs
  crit: suspicious
  conf: 0.99
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  count_min: 100
  if:
    type: hex
    section: .text
    # push ebp; mov ebp,esp; nop; pop ebp; ret
    pattern: '55 89 E5 90 5D C3'
- id: native-self-loop-junk
  desc: Repeated native self-loop byte sequences
  crit: notable
  conf: 0.96
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  count_min: 8
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 'EB FE 48'

# The same byte pattern at a density a stub full of junk branches actually
# reaches. `FF 15 <rel32> 83 F8` is "call an imported function, compare the
# result to a small constant" -- the most ordinary Win32 idiom there is, so a
# handful of them says nothing: Microsoft's signtool.exe holds 4 across 231 KB
# (0.02/KB), 7-Zip's 7z-x64.exe 13 across 447 KB, Squirrel's StubExecutable 6.
# The loose `indirect-call-compare-branches` atom above keeps its four-match
# threshold for the family composites that pair it with malware-specific legs.

- id: indirect-call-compare-branches-dense
  desc: Dense indirect-call compare branches
  crit: notable
  conf: 0.9
  for: [pe]
  count_min: 100
  per_kb_min: 3.0
  if:
    type: hex
    section: ".text"
    pattern: "FF 15 ?? ?? ?? ?? 83 F8"

- id: dense-call-pop-stack-thunk-stubs
  desc: Dense opaque call-pop return trampolines
  crit: suspicious
  conf: 0.95
  for: [pe, dll]
  platforms: [windows]
  count_min: 50
  if:
    type: hex
    section: .text
    pattern: "E8 02 00 00 00 EB 05 58 89 04 24 C3"

composite_rules:
- id: mass-noop-export-padding
  desc: Pads a PE with hundreds of exported no-op functions
  crit: hostile
  conf: 0.99
  attack: T1027.001
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  all:
  - id: dense-noop-function-stubs
  - id: objectives/anti-static/obfuscation/name-mangling/export-name::disassembler-style-export-flood
  - id: metadata/binary/symbols/count::many-exports-100
  unless:
  - id: metadata/installer/product/
- id: dense-generated-arithmetic-junk-x86
  desc: Dense generated x86 absolute-memory junk
  crit: hostile
  conf: 0.99
  attack: T1027
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  all:
  - id: metadata/binary/instruction/sequence/integer-transform::x86-absolute-xor-edi-high-count
  - id: metadata/binary/instruction/sequence/integer-transform::x86-absolute-or-immediate-high-count
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: metadata/signature/absent::unsigned-missing-signature-record
  # Requires unsigned + stale checksum already. Brand VERSIONINFO / PDB identity
  # (e.g. Bitvise terminal client) must not suppress: trojanized hosts retain
  # those metadata fields after signature stripping and post-link mutation.
# Two fixes, both about the rule meaning what it says.
#
# The branch leg is now the density atom: "junk branches in a minimal stub"
# has to mean the stub is full of them, not that four call-and-compare pairs
# exist somewhere in an ordinary Windows program.
#
# Scope is per FILE, not per archive. The claim is that ONE small stub carries
# both the branches and the timing call; pooling across an archive attributed
# signtool.exe's IAT-compare pattern to whatever else the package vendored --
# electron-winstaller's copy was reported against `darice.cub`, a WiX
# validation database that is not even a PE.
- id: timing-junk-code-stub
  desc: "Timing API junk branches in minimal stub"
  crit: suspicious
  conf: 0.88
  attack: T1027
  for: [pe]
  size_max: 524288
  scope: file
  all:
  - id: metadata/binary/instruction/call::iat-call-then-compare-density
  - id: micro-behaviors/time/query::get-tick-count
  unless:
  # Perl XS modules install as auto/Module/Module.xs.dll and import
  # GetTickCount like any other Win32 code. They are not a junk stub.
  - id: well-known/lib/runtime/scripted/perl-runtime::perl-xs-dll
  # Embedded perl interpreter (packed Perl executable): its tick-count calls
  # are the runtime's rand() seeding, not junk branches.
  - id: well-known/lib/runtime/scripted/perl-runtime::perl-core-storable-pe-text
  # A verified Authenticode signature marks a recognized tool/runtime build;
  # ordinary Windows code uses tick counters without being a junk stub.
  - id: metadata/signature/verified/
  # OpenJDK's NIO implementation contains dense ordinary API-result branches
  # and tick-count use; its native JNI exports plus declared runtime identity
  # establish a legitimate runtime module rather than a junk stub.
  - id: well-known/lib/runtime/managed/jvm::windows-jdk-product-identity
  # OpenCV's inlined Mat::release() calls its imported atomic helper and
  # compares the old refcount with 1; that is the density, not junk branches.
  - id: metadata/import/library::opencv-refcount-helper-import
  # Wine's built-in utilities contain ordinary API result checks and timing calls.
  - id: well-known/lib/platform/wine::wine-builtin-binary
- id: timing-junk-code-recognized-marker
  desc: Recognized marker for timing junk branch patterns
  crit: component
  conf: 0.9
  any:
  - id: metadata/signature/claim/certificate::signed
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-product-label-reference
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-component-filename-reference
  - id: metadata/signature/verified/signer::microsoft-corporation
  - id: metadata/signature/verified/platform::microsoft
  - id: metadata/signature/unverified/signer::microsoft-corporation
  - id: metadata/signature/self-signed/signer::microsoft-corporation
  - id: metadata/signature/invalid/tampered/signer::microsoft-corporation
  - id: metadata/signature/invalid/bad-signature/signer::microsoft-corporation
  - id: metadata/vendor/identity::microsoft-corp-versioninfo
  - id: well-known/lib/crypto/openssl::openssl-implementation-identifiers
  - id: metadata/installer/product::known-installer-context
  - id: well-known/lib/runtime/native-platform/mozilla-nspr::nspr-library
  - id: well-known/tool/reverse-engineering/ollydbg::x64dbg-plugin-export
  - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-plugin-export
  - id: micro-behaviors/process/exit/terminate::corexitprocess-string
  - id: well-known/lib/platform/microsoft-imagehlp::microsoft-imagehlp-dll
  - id: well-known/tool/sysadmin/cdrtools::cdrtools-component

- id: dense-timing-junk-code
  desc: "High density of timing API junk branches"
  crit: hostile
  conf: 0.95
  attack: T1027
  for: [pe]
  all:
  - id: indirect-call-compare-branches-dense
  - id: micro-behaviors/time/query::get-tick-count
  unless:
  - id: well-known/game/steam/

- id: obfuscated-thunks-memory-patching-api-set
  desc: Opaque thunks with memory-write and cache-flush APIs
  crit: suspicious
  conf: 0.98
  attack: T1027
  for: [pe, dll]
  platforms: [windows]
  all:
  - id: dense-call-pop-stack-thunk-stubs
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
  - id: micro-behaviors/mem/sync/cache::flush-instruction-cache

