defaults:
  platforms:
    - unix
    - windows
  for: [binaries]
traits:
  - id: go-garbage-func
    desc: Junk code or garbage functions for evasion
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: main\.garbageFunc\d+
  - id: go-mutateself-func
    desc: Self-mutation / polymorphism function name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: main.mutateSelf
  - id: go-staged-junk-code-generator
    desc: Go code defines a staged junk-code generator
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: .GenerateJunkCodeStaged
  - id: go-random-variable-name-generator
    desc: Go code defines a random variable-name generator
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: .GenerateRandomVarName

composite_rules:
  - id: go-randomized-junk-stub-generation
    desc: Go crypter generates randomized junk code in staged loader stubs
    crit: hostile
    conf: 0.99
    attack: T1027.001,T1027.016
    all:
      - id: go-staged-junk-code-generator
      - id: go-random-variable-name-generator
      - id: objectives/command-and-control/dropper/builder::go-build-staged-stub
