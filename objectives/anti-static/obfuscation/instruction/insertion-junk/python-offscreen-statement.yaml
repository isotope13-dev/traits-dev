# Code concealed past the review viewport that also performs dynamic code
# execution or builtin resolution. The layout hides that the statement exists;
# the execution leg shows the hidden statement is a loader rather than stray
# formatting.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027,T1059.006
  mbc: B0032

composite_rules:
  - id: python-offscreen-dynamic-execution
    desc: Offscreen Python statement performs dynamic execution
    crit: hostile
    conf: 0.94
    scope: file
    near_lines: 2
    all:
      - id: metadata/file/line::python-statement-after-blank-run
    any:
      - id: micro-behaviors/metaprogramming/reflection/resolve::python-getattr-builtins
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
