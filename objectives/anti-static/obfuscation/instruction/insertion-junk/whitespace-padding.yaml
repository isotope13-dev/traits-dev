# Leading-whitespace padding in source files.
#
# A payload is spliced into an otherwise legitimate source file on a single
# line preceded by hundreds of space/tab columns. `git diff`, GitHub's diff
# view, and most editors then render an apparently blank line, and a reviewer
# never scrolls right far enough to see the code.
#
# Observed in the July 2026 AsyncAPI compromise (Miasma RAT dropper): an
# obfuscator.io payload was prepended to `index.js` of @asyncapi/specs and to
# `validator.js` / `utils.js` of the generator monorepo behind 880-1205 leading
# spaces. The sibling technique on the *inside* of a line is already covered by
# metadata/file/line::long-inline-whitespace-run,
# but its `text.max_whitespace_run` metric ignores line-leading runs and
# measured 1 on every one of those files, so the leading form needs its own
# matcher.
#
# Threshold: deeply nested, hand-maintained Python data literals can exceed 180
# leading columns. At 500 columns the matcher remains well below the 880-1205
# columns used by the observed concealed payloads while excluding legitimate
# nested source formatting.
# HTML documents can be heuristically typed as JavaScript when fetched from a
# URL ending in a script-like path. Their indented markup is document layout,
# not hidden source, so the atomic matcher excludes the HTML identity facts.
defaults:
  crit: suspicious
  attack: T1027
  mbc: B0032
  platforms: [linux, macos, windows]
  for: [scripts, typescript]

traits:
  # Go permits whitespace between many adjacent syntax tokens. An extreme
  # inline run can therefore push executable code beyond the normal editor or
  # diff viewport while preserving valid syntax. At 500 columns this is well
  # beyond normal alignment, even in formatted or generated source.
  # Match parsed call syntax with padding before the argument list. Comments
  # and standalone string constants cannot satisfy the call-node condition.
  - id: go-extreme-inline-whitespace-run
    desc: 500+ blanks hide a Go call off-screen
    conf: 0.95
    for: [go]
    size_max: 1048576
    if:
      type: tree-sitter
      language: go
      query: |
        ((call_expression) @call
          (#match? @call "^[A-Za-z_][A-Za-z0-9_.]*[ \t]{500,}\\("))
    unless:
      - id: go-whitespace-padded-powershell-launch

  # Bind concealment to the launched command. File-level co-occurrence with
  # an unrelated padded call must not turn an ordinary PowerShell launch
  # into a concealed payload or execution-policy bypass.
  - id: go-whitespace-padded-powershell-launch
    desc: Go hides PowerShell launch behind 500+ blanks
    conf: 0.98
    for: [go]
    platforms: [windows]
    size_max: 1048576
    if:
      type: tree-sitter
      language: go
      query: |
        ((call_expression
          function: (selector_expression
            operand: (call_expression
              arguments: (argument_list
                . (interpreted_string_literal) @program)) @command
            field: (field_identifier) @method)) @launch
          (#match? @command "^exec\\.Command[ \t]{500,}\\(")
          (#eq? @program "\"powershell\"")
          (#match? @method "^(Run|Start|Output|CombinedOutput)$"))

composite_rules:
  # The padding hides *that* something was inserted; the obfuscator legs
  # establish that what sits on that line is a machine-generated payload rather
  # than a long generated data line. Neither half has a legitimate joint use in
  # hand-maintained source.
  - id: whitespace-padded-obfuscator-payload
    desc: Whitespace padding conceals obfuscated source
    conf: 0.93
    all:
      - id: metadata/file/padding::extreme-leading-whitespace-long-line
    any:
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::permutation-obfuscation
    needs: 1
    unless:
      - id: objectives/command-and-control/dropper/delivery/blockchain::obfuscated-etherhiding-hex-stage-dropper
      - id: metadata/file/extension/identity::js-min-or-map-basename
      - id: metadata/document/html::html-root-at-start
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
      - id: well-known/lib/development/eslint::eslint-package-context
      - id: metadata/build/recognized-contexts::known-source-tree-context
