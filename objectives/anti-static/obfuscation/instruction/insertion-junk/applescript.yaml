defaults:
  crit: suspicious
  for:
    - applescript
  platforms:
    - macos
  attack: T1027
traits:
  - id: excessive-vertical-padding
    desc: "AppleScript vertical whitespace padding"
    conf: 0.9
    if:
      type: string_literal
      regex: ( \s*){50,}
  - id: character-id-string-builder
    desc: AppleScript character-id string builder
    conf: 0.94
    if:
      type: text
      regex: '((character id|string id)\s*\{[\d,\s]{5,80}\}|ASCII character\s+\d{1,3}\)?\s*&\s*\(?ASCII)'
