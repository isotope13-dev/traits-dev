defaults:
  platforms:
    - unix
    - windows
  for: [binaries]
traits:
  - id: go-garbage-func
    desc: Junk code or garbage functions for evasion
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: main\.garbageFunc\d+
  - id: go-mutateself-func
    desc: Self-mutation / polymorphism function name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: main.mutateSelf
  - id: go-staged-junk-code-generator
    desc: Go code defines a staged junk-code generator
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: .GenerateJunkCodeStaged
  - id: go-random-variable-name-generator
    desc: Go code defines a random variable-name generator
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: .GenerateRandomVarName

composite_rules:
  - id: go-randomized-junk-stub-generation
    for: [elf, pe]
    desc: Go crypter generates randomized junk code in staged loader stubs
    crit: hostile
    conf: 0.99
    attack: T1027.001,T1027.016
    all:
      - id: go-staged-junk-code-generator
      - id: go-random-variable-name-generator
      - id: metadata/lang/source/naming/function/transform::go-build-staged-stub-name

  - id: go-polymorphic-sandbox-evasion-injector
    for: [pe]
    platforms: [windows]
    desc: Go binary combines garbage, self-mutation, sandbox check and PE injection
    crit: hostile
    conf: 0.97
    attack: T1027,T1055
    all:
      - id: go-mutateself-func
      - id: go-garbage-func
      - id: objectives/anti-analysis/sandbox-detect/environment::go-issandbox-func
      - id: objectives/execution/payload/process-inject/remote-thread::unsigned-embedded-pe-remote-thread-injector
