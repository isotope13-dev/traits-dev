# Runs of back-to-back import calls, each fed a single value loaded from a
# global, repeated across the code: a junk-call sled that pads a crypter stub
# with plausible API traffic (the global is never written, so every call gets
# NULL). The 2018 Dofoil/Smoke Loader stub made about 100 such calls into
# GDI, USER and printer-driver imports before decrypting its payload.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.016

traits:
  - id: x86-global-arg-import-call-runs
    desc: Repeated runs of global-argument import calls
    crit: notable
    conf: 0.85
    count_min: 5
    if:
      type: hex
      section: .text
      pattern: '(A1|8B 0D|8B 15|0F B6 05) ?? ?? ?? ?? (50|51|52) FF 15 ?? ?? ?? ?? (A1|8B 0D|8B 15|0F B6 05) ?? ?? ?? ?? (50|51|52) FF 15 ?? ?? ?? ?? (A1|8B 0D|8B 15|0F B6 05) ?? ?? ?? ?? (50|51|52) FF 15 ?? ?? ?? ??'

composite_rules:
  - id: junk-import-call-sled-over-decoy-imports
    desc: Junk import-call sled exercises decoy printer-driver imports
    crit: suspicious
    conf: 0.9
    all:
      - id: x86-global-arg-import-call-runs
      - id: objectives/anti-static/obfuscation/decoy-imports::gdi-driver-ddi-decoy-imports
