# Ruby multi-layer self-decoding loaders.
# A large numeric carrier plus repeating-key XOR, decompression, and eval is
# a payload loader rather than ordinary Ruby serialization or compression.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1027,T1140,T1059.004
  mbc: B0032

traits:
  - id: ruby-large-numeric-carrier
    desc: Ruby large numeric payload carrier
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\s*=\s*\[\s*\d{1,3}(\s*,\s*\d{1,3}){32,}\s*\]'

composite_rules:
  - id: ruby-xor-compressed-eval-loader
    desc: Ruby byte-array XOR Zlib eval loader
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-large-numeric-carrier
      - id: micro-behaviors/data/encode/xor::rb-xor-decode
      - id: micro-behaviors/data/compress/library::ruby-zlib-inflate
      - id: micro-behaviors/process/interpreter/eval::ruby-eval
    unless:
      - id: metadata/package/testing/
