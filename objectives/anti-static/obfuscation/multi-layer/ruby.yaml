# Ruby multi-layer self-decoding loaders.
# A large numeric carrier plus repeating-key XOR, decompression, and eval is
# a payload loader rather than ordinary Ruby serialization or compression.
#
# The carrier atom itself lives in
# micro-behaviors/data/embedded/payload/array::ruby-decimal-byte-array-literal:
# a long decimal array is a neutral data shape (every Ragel-generated Ruby lexer
# emits one), so the obfuscation claim belongs to this composite, which requires
# the decode/inflate/eval legs alongside it.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1027,T1140,T1059.004
  mbc: B0032

composite_rules:
  - id: ruby-xor-compressed-eval-loader
    desc: Ruby byte-array XOR Zlib eval loader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/array::ruby-decimal-byte-array-literal
      - id: micro-behaviors/data/encode/xor::rb-xor-decode
      - id: micro-behaviors/data/compress/library::ruby-zlib-inflate
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/cloud/browserstack::package-member-path
