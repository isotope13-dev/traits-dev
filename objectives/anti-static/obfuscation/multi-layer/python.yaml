defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1027
  mbc: B0032
traits:
- id: python-hex-escaped-names--rx-4
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: x64\x65\x63\x6f\x6d\x70\x72\x65\x73\x73
    case_insensitive: true
- id: python-hex-escaped-names--rx-5
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: x62\x36\x34\x64\x65\x63\x6f\x64\x65
    case_insensitive: true
- id: python-hex-escaped-names--rx-6
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: x62\x61\x73\x65\x36\x34
    case_insensitive: true
- id: python-hex-escaped-names--rx-7
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: x65\x78\x65\x63
    case_insensitive: true
  unless:
  - id: metadata/lang/compiler/generated::qt-generated-python-resource-module
  - id: well-known/tool/offensive/exploitdb::published-script-wrapper
- id: python-hex-escaped-names--rx-8
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: x7a\x6c\x69\x62
    case_insensitive: true
- id: inline-python-base64-decode-text
  desc: Inline Python base64 decode
  crit: notable
  conf: 0.94
  for:
  - shell
  - github-actions
  if:
    type: text
    substr: base64.b64decode
- id: inline-python-marshal-loads-text
  desc: Inline Python marshal loads
  crit: notable
  conf: 0.94
  for:
  - shell
  - github-actions
  if:
    type: text
    substr: marshal.loads
- id: inline-python-zlib-decompress-text
  desc: Inline Python zlib decompress
  crit: notable
  conf: 0.94
  for:
  - shell
  - github-actions
  if:
    type: text
    substr: zlib.decompress
- id: inline-python-exec-text
  desc: Inline Python exec text
  crit: notable
  conf: 0.92
  for:
  - shell
  - github-actions
  if:
    type: text
    regex: '\bpython[0-9.]*(\.exe)?\b[^\n;]{0,120}\b(exec|eval)\s*\('
composite_rules:
- id: python-large-base64-carrier
  desc: Large Base64-like Python carrier
  crit: notable
  conf: 0.94
  all:
  - id: metadata/file/profile/string-population::python-string-at-least-100k
  - id: metadata/file/encoding::large-python-base64-candidate
- id: exec-zlib-base64-hex-loader
  desc: Hex-escaped zlib/base64 exec loader
  crit: hostile
  conf: 0.95
  all:
  - id: python-hex-escaped-names
  - id: micro-behaviors/metaprogramming/reflection::python-imported-module-getattr
- id: hostile-python-loader
  desc: Hostile Python-based loader (layered obfuscation)
  crit: hostile
  conf: 0.95
  needs: 2
  any:
  - id: exec-zlib-base64-hex-loader
  - id: micro-behaviors/metaprogramming/reflection::python-imported-module-getattr
  - id: micro-behaviors/data/property/assign::python-execution-builtins-rebind
  unless:
  - id: well-known/lib/
- id: multi-form-obfuscation-density
  desc: Multiple obfuscation primitives co-located in one file
  crit: suspicious
  conf: 0.93
  size_max: 50000
  needs: 2
  any:
  - id: micro-behaviors/data/encode/xor::xor-bytes-genexpr-key
  - id: micro-behaviors/data/encode/xor::xor-bytes-genexpr-literal
  - id: micro-behaviors/data/encode/xor::xor-bytearray-mutating-loop
  unless:
  - id: metadata/package/testing/
  - id: well-known/lib/format/kaitai::kaitai-python-runtime
  - id: "metadata/file/naming::test-directory-component"
  downgrade:
    scope: parent
    any:
    - id: metadata/package/testing/presence/corpus::adversarial-fixture-builder-basename
    - id: well-known/lib/format/kaitai::kaitai-python-runtime
- id: inline-python-decoded-exec-loader
  desc: Inline Python decoded exec loader
  crit: suspicious
  conf: 0.94
  for:
  - shell
  - github-actions
  near_bytes: 1500
  all:
  - id: micro-behaviors/process/create/eval::python-inline-command
  - id: inline-python-exec-text
  any:
  - id: inline-python-base64-decode-text
  - id: inline-python-marshal-loads-text
  - id: inline-python-zlib-decompress-text
- id: python-hex-escaped-names
  desc: Hex-escaped common function names in Python
  crit: suspicious
  conf: 0.9
  any:
  - id: python-hex-escaped-names--rx-4
  - id: python-hex-escaped-names--rx-5
  - id: python-hex-escaped-names--rx-6
  - id: python-hex-escaped-names--rx-7
  - id: python-hex-escaped-names--rx-8
- id: python-multilayer-carrier-exec
  desc: Python executes a dynamically unwrapped large encoded carrier
  crit: hostile
  conf: 0.98
  attack: T1027,T1140,T1059.006
  all:
  - id: python-large-base64-carrier
  - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  unless:
  - id: well-known/lib/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: python-large-base64-decode-exec
  desc: Python executes a large encoded carrier
  crit: hostile
  conf: 0.98
  attack: T1027,T1140,T1059.006
  all:
  - id: python-large-base64-carrier
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-single-line-dynamic-exec
  unless:
  - id: well-known/lib/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: python-medium-base64-decode-exec
  desc: Python executes a medium encoded carrier
  crit: hostile
  conf: 0.98
  attack: T1027,T1140,T1059.006
  all:
  - id: metadata/file/data-blob::python-string-over-10k
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: objectives/anti-static/obfuscation/eval/scripting/decode::python-single-line-dynamic-exec
  unless:
  - id: well-known/lib/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: python-marshal-bytecode-loader
  desc: Python reconstructs embedded marshaled bytecode from compressed Base64
  crit: hostile
  conf: 0.98
  attack: T1027,T1140,T1059.006
  all:
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: micro-behaviors/data/serialize/unsafe::marshal-bytecode-materialization
  near_bytes: 4096
  unless:
  - id: well-known/lib/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
# Layered Base85/Base64/XOR wrapper that runs marshaled bytecode. Text atoms
# only, file scope: the layers sit hundreds of KB apart in comment-padded
# bundles, so proximity and AST symbols cannot bind them. Hides the real
# program from static review; says nothing about what the hidden code does.
- id: python-layered-decode-marshal-exec-wrapper
  desc: Python runs marshaled code behind layered decoding
  crit: suspicious
  conf: 0.93
  scope: file
  all:
  - id: objectives/anti-static/obfuscation/string/reverse::base85-decode-ref
  - id: micro-behaviors/data/decode/base64::b64decode-string
  - id: micro-behaviors/crypto/symmetric/xor/loop::python-xor-bytes-comprehension
  - id: micro-behaviors/data/serialize/unsafe::exec-marshal-loads-text
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
