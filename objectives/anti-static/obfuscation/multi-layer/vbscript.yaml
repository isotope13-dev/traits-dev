defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

traits:
  - id: vbs-chunked-base64-payload-table
    desc: Large Base64 chunks in VBScript table
    crit: suspicious
    conf: 0.96
    count_min: 8
    if:
      type: text
      regex: '(?i)\b\w+\s*\.\s*Add\s+["''][A-Za-z0-9]{8,24}["'']\s*,\s*["''][A-Za-z0-9+/]{500,}'

  - id: vbs-base64-fragment-helper-calls
    desc: VBScript appends Base64 script fragments
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bCall\s+[A-Za-z][A-Za-z0-9_]{7,}\s*\(\s*["''][A-Za-z0-9+/]{24,}={0,2}["'']'
    count_min: 8

  # The three fragments below are deliberately truncated because the technique
  # is a split string literal ("Transfor" & "mFinalBlock"), but they were bare
  # substrings: `Transfor` matches valueTransform/transformation, `CreateDe`
  # matches CreateDecipher/CreateDelegate, `esCryp` matches any *esCrypt*. The
  # `for: [vbs]` gate does not save them — cleave's language guesser types a
  # JavaScript sourcemap as VBScript, so Tabby's 2 MB dist/main.js.map (RxJS
  # `valueTransform`) scored a VBScript multi-layer obfuscation finding at
  # suspicious/0.97. Each now requires the closing quote and concatenation that
  # make it a *fragment*, which is the shape vbs-fragmented-frombase64string-call
  # below already demanded.
  - id: vbs-embedded-aes-decryptor
    desc: VBScript contains AES provider fragment
    crit: suspicious
    conf: 0.97
    attack: T1027,T1620
    if:
      type: text
      regex: '(?i)(Aes|esCryp)["'']\s*(&|\+)'

  - id: vbs-create-decryptor-fragment
    desc: VBScript contains decryptor method fragment
    crit: suspicious
    conf: 0.97
    attack: T1027,T1620
    if:
      type: text
      regex: '(?i)CreateDe["'']\s*(&|\+)'

  - id: vbs-transform-final-fragment
    desc: VBScript contains final-block method fragment
    crit: suspicious
    conf: 0.97
    attack: T1027,T1620
    if:
      type: text
      regex: '(?i)Transfor["'']\s*(&|\+)'

  - id: vbs-fragmented-frombase64string-call
    desc: VBScript rebuilds FromBase64String call
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)Fromba["'']\s*&\s*[A-Za-z_]\w*\s*\(\s*\d+\s*\)'

  - id: vbs-encoded-remote-data-function
    desc: Base64-encoded PowerShell remote-data function
    crit: suspicious
    conf: 0.96
    attack: T1027,T1105
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\bGet-RemoteData\b'

  - id: vbs-encoded-reflective-assembly-load
    desc: Base64-encoded reflective assembly load
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001,T1620
    if:
      type: encoded
      encoding: base64
      regex: '(?i)(Reflection\.Assembly|Assembly::Load)'

  - id: vbs-array-envvar-spliced-batch-lines
    desc: VBScript embeds env-var-spliced batch directives
    crit: suspicious
    conf: 0.96
    attack: T1027,T1059.003
    if:
      type: text
      regex: '(?i)"%[A-Za-z]{2,8}%@%[A-Za-z]{2,8}%e%[A-Za-z]{2,8}%c%[A-Za-z]{2,8}%h%[A-Za-z]{2,8}%o'

  - id: vbs-array-indirect-set-base64-table
    desc: VBScript array of indirect set Base64 chunks
    crit: suspicious
    conf: 0.96
    count_min: 16
    attack: T1027,T1059.003
    if:
      type: text
      regex: '(?i)"![A-Za-z]{3,10}!\s+""%[A-Za-z0-9%]{6,32}=[A-Za-z0-9+/]{16,28}"""'

composite_rules:
  - id: vbs-obfuscated-encrypted-powershell-stage
    desc: Obfuscated VBScript decrypts and runs an encrypted PowerShell stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1027.013,T1059.001,T1059.005,T1564.003
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: vbs-embedded-aes-decryptor
      - id: vbs-create-decryptor-fragment
      - id: vbs-transform-final-fragment
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
    any:
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-hex-charcode-decoder
      - id: objectives/anti-static/obfuscation/string/fragmentation::vbs-repeated-xor-obfuscation
      - id: micro-behaviors/data/decode/xor::vbs-xor-character-code

  - id: vbs-array-evaluated-hidden-loader
    desc: VBS evaluates an array payload and runs it hidden
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1564.003
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/data/encode/char-code::array-payload-reconstruction
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-executeglobal
      - id: micro-behaviors/process/create/flags::wsh-hidden-async-run

  - id: line-bloated-hidden-gzip-stage
    desc: Line-bloated VBScript conceals a Base64 and gzip-decoded hidden execution stage
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
      - id: micro-behaviors/data/decompress/gzip::wsh-gzipstream-reference
      - id: micro-behaviors/process/create/shell/batch::wsh-runs-temp-batch
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
  - id: vbs-hidden-environment-payload-stager
    desc: Obfuscated VBScript stages encoded data through env before hidden execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1564.003
    all:
      - id: vbs-chunked-base64-payload-table
      - id: micro-behaviors/os/env/read::wsh-vbs-environment-method
      - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
      - id: metadata/lang/source/syntax/call/relationship::vbs-many-array-call-syntax
  - id: vbs-environment-stage-dynamic-execution
    desc: VBScript dynamically executes an encoded environment-staged payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1564.003
    all:
      - id: objectives/command-and-control/dropper/staging/encoded/environment::env-large-unicode-stage
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-executeglobal
      - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
  - id: vbs-fragmented-hidden-powershell-loader
    desc: Fragmented Base64 VBScript hidden PowerShell loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1564.003
    all:
      - id: vbs-base64-fragment-helper-calls
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
    any:
      - id: vbs-encoded-remote-data-function
      - id: vbs-encoded-reflective-assembly-load
    needs: 1

  - id: vbs-hidden-hta-layered-dropper
    desc: Hidden HTA stages a large encoded payload for execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1218.005,T1564.003
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
      - id: metadata/file/encoding/base64::large-base64-like-string
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument

  - id: vbs-line-bloated-base64-activex-loader
    desc: Line-bloated VBScript conceals and launches ActiveX-decoded Base64 stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/data/encode/payload::vbs-appended-large-base64-payload
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/os/com/automation::activex-object-variable-progid
      - id: micro-behaviors/process/create/exec::wsh-progid-near-run

  - id: vbs-obfuscated-embedded-pe-dropper
    desc: Obfuscated VBScript decodes an embedded PE, writes it, and launches it hidden
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140,T1204.002
    all:
      - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat
      - id: micro-behaviors/data/embedded/payload/native::line-wrapped-base64-pe-image
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-text

  # One layered-obfuscation verdict instead of a finding per pair: the three
  # pair-combos this replaces triple-convicted a single signal (the same four
  # suspicious legs in different pairs) and shared one ML feature. A script
  # combining the full layering set -- an XOR char-code decoder, line bloat,
  # dynamic COM resolution, and generated identifiers -- is the layering
  # statement; partial combinations stay suspicious.
  - id: vbs-layered-obfuscation
    desc: VBScript combines obfuscation layers
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/xor::vbs-xor-character-code
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/os/com/automation::vbs-computed-createobject
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers

  - id: vbs-staged-obfuscated-batch-dropper
    desc: VBScript writes and runs an array-staged obfuscated batch loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1059.005
    mbc: B0032
    all:
      - id: vbs-array-envvar-spliced-batch-lines
      - id: vbs-array-indirect-set-base64-table
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
      - id: micro-behaviors/process/create/exec::wsh-progid-near-run
