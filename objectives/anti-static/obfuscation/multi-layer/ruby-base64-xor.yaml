defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-base64-xor-mapped-eval
    desc: Evaluates Base64 data rebuilt with XOR
    crit: suspicious
    conf: 0.99
    attack: T1027,T1140
    if:
      type: tree-sitter
      language: ruby
      query: |
        (program
          (assignment left: (identifier) @decoded
            right: (call receiver: (constant) @base64 method: (identifier) @decode
              arguments: (argument_list . (string) .)))
          (call !receiver method: (identifier) @eval
            arguments: (argument_list .
              (call
                receiver: (call
                  receiver: (call
                    receiver: (call receiver: (identifier) @decoded1 method: (identifier) @bytes)
                    method: (identifier) @enumerate)
                  method: (identifier) @map
                  block: (block body: (block_body
                    (call receiver: (parenthesized_statements (binary operator: "^")) @transform
                      method: (identifier) @chr))))
                method: (identifier) @join) .))
          (#eq? @base64 "Base64") (#eq? @decode "decode64") (#eq? @eval "eval")
          (#eq? @decoded @decoded1) (#eq? @bytes "bytes") (#eq? @enumerate "each_with_index")
          (#eq? @map "map") (#eq? @join "join") (#eq? @chr "chr")
          (#match? @transform "%")) @loader
