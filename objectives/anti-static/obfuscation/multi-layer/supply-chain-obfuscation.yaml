defaults:
  platforms: [unix, windows]
  mbc: E1014
  attack: T1027
composite_rules:
  - id: js-whitespace-xor-shard-concealment
    desc: JS hides XOR string table behind whitespace padding
    crit: suspicious
    conf: 0.96
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::whitespace-padded-obfuscator-payload
      - id: objectives/anti-static/obfuscation/encoding/xor::atob-map-charcode-numeric-xor
      - id: objectives/anti-static/obfuscation/multi-layer::js-base64-shard-array

  - id: supply-chain-obfuscation-patterns
    desc: Supply-chain attack obfuscation patterns
    crit: suspicious
    conf: 0.95
    any:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::builtins-string-builder
      - id: objectives/anti-static/obfuscation/control-flow/logic::python-chr-bitwise-construction
      - id: objectives/anti-static/obfuscation/control-flow/logic::obfuscation-state-machine-constants
