defaults:
  platforms: [unix, windows]
  for: [powershell]
  attack: T1027

composite_rules:
  - id: powershell-byte-array-xor-iex-loader
    desc: PowerShell XOR byte-array payload executed through IEX
    crit: hostile
    conf: 0.98
    attack: "T1027,T1140,T1059.001"
    mbc: "B0032,C0043,E1059"
    near_lines: 24
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::byte-array-xor-transform
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-key-variable
    any:
      # Native .ps1 uses the symbol-call atom; WSH/HTML carriers embed the
      # Invoke-Expression / iex command text inside another language.
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex-alias

  # The carrier is split across hundreds of ordinary-looking string fragments,
  # then decoded with a repeating XOR key and executed as a ScriptBlock.  Keep
  # the three legs close to the decode loop so a script that merely contains a
  # Base64 utility and an unrelated ScriptBlock is not promoted.
  - id: powershell-base64-xor-scriptblock-loader
    desc: PowerShell Base64 repeating-XOR ScriptBlock loader
    crit: hostile
    conf: 0.99
    attack: "T1027,T1140,T1059.001"
    mbc: "B0032,C0043,E1059"
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-xor-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-scriptblock-constructor-text

  - id: powershell-obfuscated-network-bootstrap
    desc: PowerShell obfuscated HTTP bootstrap loader
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.001,T1029,T1071.001,T1105"
    mbc: "B0030,B0032"
    all:
      - id: powershell-base64-xor-scriptblock-loader
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::iwr-uri
      - id: micro-behaviors/time/sleep/interval::ps-randomized-sleep

  - id: powershell-hex-pair-xor-iex-loader
    desc: PowerShell hex-pair XOR decoder executes reconstructed script
    crit: hostile
    conf: 0.99
    attack: "T1027,T1140,T1059.001"
    mbc: "B0032,C0043,E1059"
    near_lines: 24
    all:
      - id: micro-behaviors/data/decode/hex::powershell-convert-toint32-radix16
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-indexed-bxor-loader
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex-alias

  - id: powershell-hex-xor-scriptblock-loader
    desc: PowerShell decrypts an embedded hex payload into a ScriptBlock
    crit: hostile
    conf: 0.99
    attack: "T1027,T1140,T1059.001"
    mbc: "B0032,C0043,E1059"
    all:
      - id: micro-behaviors/data/encode/payload::powershell-hex-here-string-carrier
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-indexed-bxor-loader
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-scriptblock-constructor-text

  # JScript and other script-host carriers commonly Base64-wrap the entire
  # PowerShell decryptor. The encoded atoms keep the same mechanical tests as
  # the native-PS rules above while inspecting that decoded carrier layer.
  - id: encoded-powershell-hex-xor-multi-eval-loader
    desc: Base64 PowerShell hex-XOR multi-eval loader
    crit: hostile
    conf: 0.99
    attack: "T1027,T1140,T1059.001"
    mbc: "B0032,C0043,E1059"
    for: [powershell, javascript, vbs, html, batch, lnk]
    all:
      - id: micro-behaviors/data/decode/hex::encoded-powershell-convert-tobyte-radix16
      - id: objectives/command-and-control/dropper/staging/encrypted::encoded-powershell-bxor
      - id: objectives/execution/interpreter/eval/invoke::encoded-iex
      - id: objectives/execution/interpreter/eval/invoke::encoded-scriptblock-create

  - id: powershell-base64-rc4-gzip-loader
    desc: PowerShell Base64 RC4 gzip loader
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/metrics::powershell-long-line
      - id: micro-behaviors/data/encode/payload::large-base64-string-literals
      - id: micro-behaviors/crypto/symmetric/xor/rotational::rotation-counter-update
      - id: micro-behaviors/data/compress/library::gzip-decompress-to-text
  - id: powershell-multilayer-obfuscated-c2
    desc: PowerShell multilayer C2 obfuscation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/concat::dense-string-concat
      - id: micro-behaviors/data/source/syntax/typecast::char-array-cast
      - id: objectives/execution/interpreter/eval/invoke::encoded-iex
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
      - id: objectives/command-and-control/dropper/staging/encrypted::iex-finalscript
  - id: powershell-aes-encrypted-script-execution
    desc: PowerShell AES-encrypted script execution
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.001"
    mbc: "C0025,E1059"
    all:
      - id: micro-behaviors/data/decode/base64::powershell-base64-symmetric-decrypt
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex
  - id: powershell-base64-reflected-scriptblock-loader
    desc: PowerShell decodes Base64 and executes reflected ScriptBlock code
    crit: hostile
    conf: 0.99
    attack: "T1027,T1140,T1059.001"
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-scriptblock-constructor-text
      - id: metadata/file/metrics::powershell-long-line
    any:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-reflected-split

  # Reflect GetMethods(*FromBase64*) → indexed XOR → split Assembly::Load →
  # EntryPoint.Invoke. Common Cobalt/loader packaging; not tied to family IDs.
  - id: powershell-reflected-b64-xor-assembly-loader
    desc: Reflects Base64, XORs bytes, loads assembly entry
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1059.001,T1620
    all:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64-getmethods-like
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-key-loop
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-split-assembly-load-invoke
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-entrypoint-invoke
      - id: metadata/binary/metrics/encoded::large-embedded-b64-blob

  - id: powershell-gettype-convert-xor-entrypoint
    desc: Split Convert GetType XOR assembly entrypoint loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1620
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-reflection-method-enumeration
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-key-loop
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-entrypoint-invoke
      - id: metadata/file/metrics::powershell-long-line
    any:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64-getmethods-like
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-split-assembly-load-invoke
