# A payload hidden twice: steganography around encryption.
#
# The compromised watercrawl-mcp and miso-client releases put their payload in
# Unicode variation selectors -- codepoints that render as nothing, so the
# bundle greps as pure ASCII and reads as an ordinary string literal. What
# comes out of that is not the payload either. It is a second stage calling
# `createDecipheriv('aes-256-cbc', ...)` with a key written into the file, and
# only that yields the real code (which turns out to take its instructions
# from Solana transaction memo fields).
#
# Each layer alone has an innocent reading. Encoding is what bundlers do;
# encryption is what packages holding secrets do. Doing both, in that order,
# does not: the steganography defeats anyone reading or searching the file,
# and the cipher defeats anyone who decodes it and expects to be finished.
# Shipping the key in the same file is only worth the trouble if you expect
# the outer layer to be stripped.
#
# The cipher call is visible only because cleave now decodes variation-selector
# runs into an analysable layer whose findings merge into the parent. Before
# that this file was ASCII with an eval and nothing else to see.
#
# One thing to know before editing. This rule carries no `unless:` clause and
# must not gain a directory-wide one. It previously had
# `unless: metadata/package/testing/`, which looks harmless and is not: a
# bundled JavaScript payload carries `coverage` and `lcov` strings from its
# vendored dependencies, those trip `metadata/package/testing/scripted::
# coverage-marker-*`, and the directory reference then suppressed the rule on
# exactly the files it exists for. The positive legs are specific enough to
# stand without it -- a file carrying many invisible Unicode characters whose
# decoded content constructs a decipher is not a test fixture.
#
# It also must not carry `scope: outer`; an explicit outer scope stops it
# matching entirely.

defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.013,T1140
  mbc: F0001

composite_rules:
  - id: stego-layer-wrapping-keyed-cipher
    desc: Steganography wrapping a keyed cipher
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/invisible-unicode::multiple
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
