defaults:
  platforms: [unix, fortios]
  for: [shell]
  attack: T1027

traits:
  - id: shell-repeated-base64-decodes
    desc: Repeated shell Base64 decoding commands
    crit: suspicious
    conf: 0.9
    if:
      # Independent `base64 -d` calls (if/elif branches, commented alternatives,
      # Kubernetes Secret field unpacking) are ordinary.  Multilayer stagers
      # pipe decode into decode on one command; require that pipeline shape.
      type: text
      regex: 'base64\s+-d[^;\n]{0,80}\|[^;\n]{0,100}base64\s+-d[^;\n]{0,80}\|[^;\n]{0,100}base64\s+-d'
    unless:
      - id: well-known/tool/detection/stackrox::ci-source-context
      - id: well-known/app/system/konk::konk-certificate-repair-script-context
      - id: shell-repeated-base64-benign-context
      - id: well-known/app/utility/cmdchamp/

  - id: shell-ordinal-rebuild-function
    desc: Shell ordinal rebuild function
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'printf "\\\\\$\(printf ''%03o'' "\$_c"\)'

  - id: shell-assoc-array-rebuild
    desc: Shell assoc array rebuild
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'declare -A .{0,40}[\s\S]{0,260}rebuild_indirect'

  - id: shell-env-smuggle-host
    desc: Shell smuggles host env var
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'export _[A-Z0-9_]{0,32}HOST=.{0,80}\$\{'

  - id: shell-self-base64-pack
    desc: Shell self base64 pack
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: base64 -w0 < "$SELF"

  - id: shell-stage2-base64-exec
    desc: Shell stage2 base64 exec
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # Do not treat a function such as `ovs-exec "$2"` as a shell `exec`.
      # The command must be a standalone shell word.
      regex: '(^|[^A-Za-z0-9_-])exec[[:space:]]+["'']?\$[2-9]([^A-Za-z0-9_]|$)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
composite_rules:
  - id: shell-repeated-base64-benign-context
    desc: Known deployment or configuration context for repeated Base64 decoding
    crit: exception
    conf: 0.96
    any:
      - id: well-known/app/system/samba/
      - id: well-known/tool/detection/clawker::adversarial-payload-fixture
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: well-known/app/infrastructure/nvidia-nvcf::openbao-migration-script
      - id: well-known/tool/development/cmder::vendor-member
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-linux-node-bootstrap
      - id: well-known/lib/data/redis::sentinel-config-init-context
      - id: micro-behaviors/data/decode/base64::kubernetes-secret-pipeline

  - id: shell-multilayer-obfuscation
    desc: Shell multilayer obfuscation
    crit: hostile
    conf: 0.98
    needs: 3
    any:
      - id: micro-behaviors/data/encode/hex::shell-hex-byte-sequence
      - id: shell-repeated-base64-decodes
      - id: shell-ordinal-rebuild-function
      - id: shell-assoc-array-rebuild
      - id: shell-env-smuggle-host

  - id: shell-self-packed-stager
    desc: Shell self-packed stager
    crit: hostile
    conf: 0.98
    all:
      - id: shell-self-base64-pack
      - id: shell-stage2-base64-exec
    any:
      - id: objectives/command-and-control/dropper/staging/stager::stage2-shell-script-reference
