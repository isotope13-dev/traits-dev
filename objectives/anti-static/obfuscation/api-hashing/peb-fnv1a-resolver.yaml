defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: unsigned-peb-export-fnv1a-resolver
    desc: Unsigned PE resolves APIs via PEB walk, export table, and hash
    crit: hostile
    conf: 0.93
    attack: T1027.007,T1106
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/os/api-resolution/digest-export/walk
    any:
      - id: micro-behaviors/data/checksum::fnv1a-offset-basis
      - id: micro-behaviors/data/checksum::fnv1a-byte-hash-loop-x64
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::x64-fnv1a-export-name-resolver
