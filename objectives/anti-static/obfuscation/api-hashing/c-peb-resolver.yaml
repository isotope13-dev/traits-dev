# C/C++ source manual PEB loader-list traversal paired with PE export-table
# parsing and XOR-multiply API hashing to resolve Win32 APIs without imports.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1027.007,T1106

traits:
  - id: c-peb-ldr-walk-source
    desc: Walks Windows PEB loader list in C
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(->|\.)peb->ldr\b|\bIn(Load|Memory)OrderModuleList\b'

  - id: c-export-name-table-field
    desc: References PE export name table field
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '\b(address_of_names|AddressOfNames)\b'

  - id: c-export-function-table-field
    desc: References PE export function table field
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '\b(address_of_functions|AddressOfFunctions)\b'

  - id: c-export-ordinal-table-field
    desc: References PE export ordinal table field
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '\b(address_of_name_ordinals|AddressOfNameOrdinals)\b'

  - id: c-xor-multiply-hash-loop
    desc: Computes XOR-multiply API hash in C
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '\(\s*\w+\s*\^\s*[^)\r\n]{1,40}\)\s*\*\s*\w+'

  - id: c-hashed-winapi-constant
    desc: References hashed WinAPI loader constant
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bHASH_(KERNEL32|LOADLIBRARYA?|GETPROCADDRESS)\b'

composite_rules:
  - id: c-pe-export-directory-fields
    desc: References PE export directory table fields
    crit: notable
    conf: 0.92
    all:
      - id: c-export-name-table-field
      - id: c-export-function-table-field
      - id: c-export-ordinal-table-field

  - id: c-peb-export-api-hash-resolver
    desc: C source resolves WinAPIs via PEB walk, EAT, and hash
    crit: hostile
    conf: 0.95
    all:
      - id: c-peb-ldr-walk-source
      - id: c-pe-export-directory-fields
      - id: c-xor-multiply-hash-loop
      - id: c-hashed-winapi-constant
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
