defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [php]

composite_rules:
  # Self-read loader whose decoder uses a custom 64-character alphabet and no
  # gzinflate. Commercial protectors and payment SDKs use this shape; the
  # decoded payload's own behavior is judged separately.
  - id: php-self-read-strtr-eval-loader
    desc: Self-read PHP loader strtr-decodes and evaluates payload
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/self::file-constant-variable-value
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: micro-behaviors/data/decode/base64/custom::php-strtr-alphabet-base64
