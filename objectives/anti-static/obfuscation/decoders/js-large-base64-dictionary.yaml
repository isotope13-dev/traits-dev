defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1027

traits:
  - id: js-large-base64-dictionary-mechanics
    desc: Large base64 dictionary conceals source strings
    crit: component
    conf: 0.96
    if:
      type: yara
      source: |
        rule js_large_base64_dictionary_dispatch {
          strings:
            $alphabet = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=" ascii
            $uri = "decodeURIComponent(" ascii
            $rotation = /\[['"]push['"]\]\([^\r\n]{0,80}\[['"]shift['"]\]\(\)\)/
            $encoded = /['"][A-Za-z0-9+\/]{12,100}['"]/
            $wrapper = /function _0x[0-9a-f]+\([^)]{1,80}\)\{return _0x[0-9a-f]+\(/
          condition:
            filesize > 500000 and $alphabet and $uri and $rotation and #encoded > 500 and #wrapper > 20
        }

composite_rules:
  - id: js-large-base64-dictionary-dispatch
    desc: Large base64 dictionary conceals source strings
    crit: suspicious
    conf: 0.96
    all:
      - id: js-large-base64-dictionary-mechanics
    unless:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
