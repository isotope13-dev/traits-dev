# Encoded API references plus native delegate resolution establish concealed
# interop machinery. This is unusual, without asserting a connected injection.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-encoded-remote-memory-api-references
    desc: Managed PE hides remote-memory API names
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/dylib/lookup::encoded-createprocess-name
      - id: micro-behaviors/mem/read/cross-process::encoded-read-process-memory-name
      - id: micro-behaviors/mem/write/arbitrary::base64-write-process-memory-name
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
