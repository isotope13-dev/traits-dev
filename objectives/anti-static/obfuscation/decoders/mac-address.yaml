# Base64 wraps MAC text in GraphDoor's adsmload command. Require executable
# memory context so a network-inventory decoder is not called obfuscation.
defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: suspicious
  conf: 0.96
composite_rules:
  - id: base64-mac-executable-payload
    desc: Base64 and MAC decoding near executable memory
    attack: T1027.013
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/decode/base64/bytes::crypt-string-base64-decode-call
      - id: micro-behaviors/data/decode/mac-address::rtl-ethernet-string-to-address-call
      - id: objectives/execution/payload/memory-branch/shellcode::mac-decoded-memory-thread
