defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1140

composite_rules:
  - id: powershell-radix-pair-xor-rotate-cipher
    desc: PowerShell combines adaptive radix-pair and XOR-rotate cipher
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base91::powershell-pair-bit-mask
      - id: micro-behaviors/data/decode/base91::powershell-adaptive-pair-width
      - id: micro-behaviors/data/bitwise/mixed::powershell-xor-rotate-transform
      - id: micro-behaviors/data/decode/custom::powershell-keyed-byte-loop-decrypt
      - id: metadata/file/line::very-long-source-line
