# Inline cp1251-aware Base64 decoder whose output is document.written into
# the page, where the Base64 literal hides an http(s) URL. The page hides
# the injected <script> from markup and string review behind its own
# decoder instead of the browser's atob().
defaults:
  for: [html]
  platforms: [windows, unix]
  attack: T1027,T1059.007

composite_rules:
  - id: cp1251-base64-decoder-writes-hidden-url
    desc: Custom Base64 decoder writes URL-bearing payload
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/decode/charset::cp1251-byte-unicode-remap
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
