# A JavaScript string built from a byte array XORed with a key, then mapped
# through String.fromCharCode, conceals the text from a plain search. The two
# stages can sit in separate `.map` calls, so the join uses a byte window
# instead of the single-call form in micro-behaviors/data/decode/xor. The
# composite is suspicious: concealment of a string is not itself an attack.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027

composite_rules:
  - id: js-xor-array-charcode-string-decode
    desc: XOR-keyed array elements mapped to characters in one window
    crit: suspicious
    conf: 0.9
    scope: file
    near_bytes: 200
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::js-arrow-map-xor-element
      - id: micro-behaviors/data/decode/char-code::fromcharcode-arrow-map
