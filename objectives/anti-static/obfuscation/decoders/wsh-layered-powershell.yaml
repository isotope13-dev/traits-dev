defaults:
  for: [javascript]
  platforms: [windows]
composite_rules:
  # Concealed execution in two interpreters: character-built hex eval conceals
  # the WSH code, while a second keyed decoder hides the embedded PowerShell
  # commands and dispatches many encoded statements through a variable.
  # No names, destinations, key lengths, payload offsets or loop counts gate it.
  - id: wsh-hex-powershell-fragment-loader
    desc: WSH hex eval carries a keyed PowerShell dispatcher
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.001,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/decoders::wsh-hex-decoded-dynamic-evaluation
      - id: micro-behaviors/data/decode/charset::powershell-indexed-key-subtraction-character-decoder
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
      - id: micro-behaviors/data/control-flow/direct-call::powershell-repeated-encoded-argument-calls
