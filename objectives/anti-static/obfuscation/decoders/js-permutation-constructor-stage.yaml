defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.007

traits:
  - id: js-permutation-constructor-stage
    desc: Permuted strings construct dynamic script stages
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule js_permutation_constructor_stage {
          strings:
            $swap = /\w+\[\w+\]=\w+\[\w+\];\w+\[\w+\]=\w+;/
            $chars = ".charAt(" ascii
            $join = ".join('')" ascii
            $property = /\.substr\(0,\w+\);var \w+='[^\r\n]{500,2000}';var \w+=\w+\[\w+\]/
            $stage = /var \w+=\w+\(\w+,\w+\(\w+\)\);var \w+=\w+\(\w+\('/
          condition:
            $swap and $chars and $join and $property and $stage
        }
