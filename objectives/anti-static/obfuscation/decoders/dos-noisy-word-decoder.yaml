defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 1024
  size_max: 65536
  attack: T1027

traits:
  - id: dos-jump-noisy-word-decoder
    desc: DOS entry reaches noisy word decoder
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_jump_noisy_word_decoder {
          strings:
            $decode = { B9 ?? ?? 81 ED ?? ?? 2E 01 8C ?? ?? 45 4A 46 [0-20] 46 ?? ?? 4F B8 ?? ?? 75 ?? }
          condition:
            uint8(0) == 0xE9 and uint16(1) + 3 < filesize and
            $decode in (uint16(1) + 3 .. uint16(1) + 160)
        }
