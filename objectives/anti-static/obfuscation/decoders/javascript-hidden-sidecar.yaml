# A JavaScript module reads a hidden sibling file and applies an indexed XOR
# transform to its bytes. This identifies local payload decoding without
# assuming that the decoded data is evaluated or otherwise used.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027

composite_rules:
  - id: reads-and-xor-decodes-hidden-sidecar
    desc: Reads and XOR-decodes a hidden sidecar
    crit: suspicious
    conf: 0.94
    scope: file
    near_bytes: 200
    all:
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
      - id: micro-behaviors/fs/path/self::node-script-dir-hidden-file
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::indexed-xor-array-assignment
