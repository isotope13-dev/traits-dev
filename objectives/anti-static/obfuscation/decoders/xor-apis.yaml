# XOR-decoded API names in binaries
# Identifies critical API names (e.g., CreateProcess, LoadLibrary, VirtualAlloc)
# that have been obfuscated using XOR or other simple schemes and decoded
# by the cleave string analysis pipeline.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  crit: suspicious
  conf: 0.95
  attack: T1027.002

traits:
  - id: xor-decoded-createprocess-api
    desc: XOR-decoded CreateProcess API
    # Evidence spans may merge neighboring table entries (NUL-separated names
    # decode into one run), so the API name is matched unanchored; the
    # XOR-decoded layer itself is the concealment evidence.
    if:
      type: encoded
      encoding: xor
      regex: '(?i)CreateProcess(A|W|InternalW)?'

  - id: xor-decoded-shellexec-api
    desc: XOR-decoded ShellExecute API
    if:
      type: encoded
      encoding: xor
      regex: (?i)^ShellExecute(A|W)?$

  - id: xor-decoded-exec-api
    desc: "XOR-decoded process execution API"
    crit: suspicious
    conf: 0.9
    if:
      type: encoded
      encoding: xor
      regex: (?i)^(WinExec|system)$

  # Split from a single `VirtualProtect|WriteProcessMemory|NtWriteVirtualMemory`
  # alternation. Every other trait in this file names one API family, and this
  # one bundled two different behaviours under the name of the first: an
  # analyst reading "XOR-decoded VirtualProtect" had no way to tell that the
  # decoded string was actually `WriteProcessMemory`. Changing a page's
  # protection is something a loader does to its own memory; writing another
  # process's memory is injection. Both matter, and which one it was is the
  # first thing a triager wants to know.
  - id: xor-decoded-process-write-api
    desc: XOR-decoded process memory write API
    if:
      type: encoded
      encoding: xor
      regex: (?i)^(WriteProcessMemory|NtWriteVirtualMemory)$

  - id: xor-decoded-load-library-api
    desc: XOR-decoded LoadLibrary API
    if:
      type: encoded
      encoding: xor
      regex: (?i)^LoadLibrary(A|W|ExA|ExW)?$
    unless:
      - type: symbol
        regex: (?i)^LoadLibrary(A|W|ExA|ExW)?$

  - id: xor-decoded-proc-lookup-api
    desc: XOR-decoded procedure address lookup API
    if:
      type: encoded
      encoding: xor
      regex: (?i)^(GetProcAddress|LdrLoadDll)$
    unless:
      - type: symbol
        regex: (?i)^(GetProcAddress|LdrLoadDll)$

  - id: xor-decoded-bcrypt-api
    desc: XOR-decoded BCrypt cryptographic APIs
    if:
      type: encoded
      encoding: xor
      regex: (?i)^(BCryptOpenAlgorithmProvider|BCryptDecrypt|BCryptGenerateSymmetricKey)$

  - id: xor-decoded-crypt-api
    desc: XOR-decoded legacy CryptDecrypt API
    if:
      type: encoded
      encoding: xor
      regex: (?i)^CryptDecrypt$

  - id: xor-decoded-internet-read-file-api
    desc: XOR-decoded InternetReadFile API name
    if:
      type: encoded
      encoding: xor
      exact: InternetReadFile

  - id: xor-decoded-http-api
    desc: XOR-decoded WinINet HTTP APIs
    if:
      type: encoded
      encoding: xor
      regex: (?i)^(InternetOpen(A|W)?|HttpSendRequest(A|W)?)$

  - id: xor-decoded-socket-api
    desc: XOR-decoded socket networking APIs
    crit: suspicious
    conf: 0.9
    if:
      type: encoded
      encoding: xor
      regex: (?i)^(Socket|Connect|WSAConnect)$

  - id: xor-decoded-wts-session-token-api
    desc: XOR-decoded session user-token query API
    platforms: [windows]
    if:
      type: encoded
      encoding: xor
      exact: WTSQueryUserToken

  - id: xor-decoded-wts-console-session-api
    desc: XOR-decoded console session lookup API
    platforms: [windows]
    if:
      type: encoded
      encoding: xor
      exact: WTSGetActiveConsoleSessionId

  - id: xor-decoded-duplicate-token-api
    desc: XOR-decoded token duplication API
    platforms: [windows]
    if:
      type: encoded
      encoding: xor
      exact: DuplicateTokenEx

  - id: xor-decoded-rundll32-host
    desc: XOR-decoded rundll32 host process name
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: xor
      regex: '(?i)^rundll32(\.exe)?$'

composite_rules:
  # Umbrella for the two atoms split out above, so the loader chains that only
  # need "an obfuscated memory-manipulation API, either kind" keep matching
  # exactly what they matched when this was one trait. Referenced, never
  # emitted on its own — the atoms carry the analyst-facing detail.
  - id: xor-decoded-memory-write-or-protect-api
    desc: XOR-decoded memory write or protect API
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/mem/protect/modify::xor-decoded-virtual-protect-api
      - id: micro-behaviors/mem/protect/modify::xor-decoded-virtual-protect-ex-api
      - id: xor-decoded-process-write-api

  # Hidden remote-memory protection combined with elevated process access and
  # process traversal/termination is a process-tampering pattern. The table
  # requirement keeps an isolated API reference from establishing intent.
  - id: xor-obfuscated-debug-privileged-process-tampering
    desc: XOR-obfuscated remote process tampering under debug privilege
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1055
    for: [pe, dll]
    all:
      - id: micro-behaviors/mem/protect/modify::xor-decoded-virtual-protect-ex-api
      - id: micro-behaviors/os/privilege/token::debug-privilege-process-access
      - id: micro-behaviors/process/terminate/kill::toolhelp-termination-api-profile
      - id: xor-encoded-api-table

  - id: xor-obfuscated-encrypted-memory-loader
    for: [pe]
    desc: XOR-obfuscated crypto loader changes memory protection
    crit: hostile
    conf: 0.97
    attack: T1620
    mbc: B0032
    all:
      - id: xor-decoded-bcrypt-api
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-gcm-decrypt-api-set
      - id: micro-behaviors/mem/protect/modify::virtual-protect

  # These indicators co-occur; they do not establish a response-to-process data flow.
  - id: xor-wininet-read-execution-rwx
    for: [pe]
    desc: XOR-decoded HTTP read and execution APIs with RWX decoder
    crit: suspicious
    conf: 0.95
    all:
      - id: xor-decoded-http-api
      - id: xor-decoded-internet-read-file-api
      - id: xor-decoded-shellexec-api
      - id: objectives/anti-static/obfuscation/payload/encoded/carrier::split-xor-rwx-loader

  - id: xor-encoded-api-table
    desc: Binary contains XOR-encoded critical API table
    crit: suspicious
    conf: 0.98
    needs: 3
    any:
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-bcrypt-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-createprocess-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-crypt-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-exec-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-http-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-load-library-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-proc-lookup-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-shellexec-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-socket-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-wts-session-token-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-wts-console-session-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-duplicate-token-api
      - id: micro-behaviors/mem/alloc/virtual::xor-decoded-virtual-alloc-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-memory-write-or-protect-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-rundll32-host
      - id: micro-behaviors/os/registry/access::xor-registry-value-write-api

  # The encoding observation excludes the host PE's plaintext DOS stub.
  # The API table supplies concealment context; the decoded message alone
  # establishes neither packing nor a complete, executable PE image.
  - id: xor-api-table-accompanies-xor-decoded-pe-dos-stub
    desc: XOR-obfuscated API table accompanies an XOR-decoded PE DOS stub
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1027.013
    for: [pe]
    all:
      - id: xor-encoded-api-table
      - id: metadata/file/encoding::xor-decoded-pe-dos-stub
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: xor-http-anti-debug-process-loader
    for: [pe]
    desc: XOR-obfuscated HTTP and memory APIs combined with anti-debug process loading
    crit: hostile
    conf: 0.98
    all:
      - id: xor-decoded-http-api
      - id: xor-decoded-memory-write-or-protect-api
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: metadata/binary/layout/overlay::large-overlay-1mb

  # Merged XOR tables emit WinINet, WinHTTP, and CreateProcess as separate
  # decoded tokens. Requiring both HTTP families plus process creation
  # keeps a single obfuscated client API from establishing the objective.
  - id: xor-decoded-dual-http-process-stack
    desc: XOR-decoded dual HTTP stack with process-launch APIs
    crit: hostile
    conf: 0.96
    platforms: [windows]
    attack: T1027.002,T1071.001
    for: [pe, dll]
    near_bytes: 8192
    all:
      - id: xor-decoded-http-api
      - id: micro-behaviors/communications/http/client/winhttp::xor-decoded-winhttp-open-request
      - id: micro-behaviors/communications/http/client/winhttp::xor-decoded-winhttp-send-request
      - id: micro-behaviors/communications/http/client/winhttp::xor-decoded-winhttp-receive-response
      - id: xor-decoded-createprocess-api
