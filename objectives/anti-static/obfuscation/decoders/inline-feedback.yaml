# Two execution-producing decoders, rather than encoding or entropy alone.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1027
composite_rules:
  - id: wsh-hex-decoded-dynamic-evaluation
    desc: WSH evaluates character-built data with hex parsing
    crit: suspicious
    for: [javascript]
    conf: 0.94
    attack: T1027,T1059.007
    all:
      - id: metadata/lang/runtime::wscript-host-reference
      - id: micro-behaviors/process/interpreter/eval/javascript::javascript-eval-charcode-origin
      - id: micro-behaviors/data/decode/hex::js-hex-number-parse
  - id: inline-xor-decoded-code-execution
    desc: Inline XOR decoder transfers control into decoded instructions
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/xor/feedback::x86-callpop-inline-xor-return
      - id: metadata/binary/section/permission::wx-section
  - id: inline-xor-and-feedback-code-decoders
    desc: Inline XOR execution with feedback-decoded code
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/xor/feedback::x86-callpop-inline-xor-return
      - id: micro-behaviors/data/decode/xor/feedback::x86-multiply-rotate-feedback-xor-loop
      - id: metadata/binary/section/permission::wx-section
  - id: inline-lcg-decoded-code-execution
    desc: Inline LCG decoder marks RX and branches
    crit: suspicious
    conf: 0.98
    arch: [x86-64]
    # The decoder and its VirtualProtect/branch sit in one routine (113 bytes
    # apart in the loader); unbounded, both loose atoms recur in large JIT
    # runtimes (stock Electron: 15 and 3 hits, nearest pair 428 KB apart).
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/decode/xor/feedback::x64-lcg-keystream-xor-decode-loop
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-execute-read-branch-x64
  # Crypter stub: the LCG decrypt/RX/branch routine above runs from a section
  # named .rdata that is marked executable, so the entry code is disguised as
  # constants while the real code section stays ciphertext on disk.
  - id: disguised-rdata-lcg-decrypt-stub
    desc: LCG decrypt stub runs from executable .rdata
    crit: hostile
    conf: 0.97
    arch: [x86-64]
    attack: T1027.002
    all:
      - id: inline-lcg-decoded-code-execution
      - id: metadata/binary/section/permission::executable-rdata
