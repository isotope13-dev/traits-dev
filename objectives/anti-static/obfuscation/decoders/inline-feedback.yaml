# Two execution-producing decoders, rather than encoding or entropy alone.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: inline-xor-and-feedback-code-decoders
    desc: Inline XOR execution with feedback-decoded code
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: micro-behaviors/data/decode/xor::x86-callpop-inline-xor-return
      - id: micro-behaviors/data/decode/xor::x86-multiply-rotate-feedback-xor-loop
      - id: metadata/binary/section/permission::wx-section
