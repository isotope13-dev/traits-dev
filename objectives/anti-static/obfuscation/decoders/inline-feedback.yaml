# Two execution-producing decoders, rather than encoding or entropy alone.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1027
composite_rules:
  - id: inline-xor-decoded-code-execution
    desc: Inline XOR decoder transfers control into decoded instructions
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/xor/feedback::x86-callpop-inline-xor-return
      - id: metadata/binary/section/permission::wx-section
  - id: inline-xor-and-feedback-code-decoders
    desc: Inline XOR execution with feedback-decoded code
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/xor/feedback::x86-callpop-inline-xor-return
      - id: micro-behaviors/data/decode/xor/feedback::x86-multiply-rotate-feedback-xor-loop
      - id: metadata/binary/section/permission::wx-section
  - id: inline-lcg-decoded-code-execution
    desc: Inline LCG decoder marks RX and branches
    crit: suspicious
    conf: 0.98
    arch: [x86-64]
    all:
      - id: micro-behaviors/data/decode/xor/feedback::x64-lcg-keystream-xor-decode-loop
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-execute-read-branch-x64
