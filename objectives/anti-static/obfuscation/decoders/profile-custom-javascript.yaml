defaults:
  platforms: [linux, macos, windows]
  for: [javascript]

traits:
  - id: js-split-join-empty
    desc: Split-join pattern (custom decoding)
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: this\.split\("[^"]{1,120}"\)\.join\(""\)
  - id: js-base64-custom-loop
    desc: "Custom b64 decoding loop w/ bitwise operations"
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: String\.fromCharCode\(.{0,80}<<\s*2.{0,80}0x30.{0,80}>>\s*4
  - id: js-global-marker-strip-empty
    desc: Removes alphabetic marker runs
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # A literal word removal is ordinary UI/string cleanup.  Obfuscated
      # marker stripping uses a regex that removes arbitrary alphabetic
      # runs, which is the technique this atom is intended to describe.
      regex: replace\(/\[A-Za-z\]\{6,24\}/g,\s*''\)
composite_rules:
  - id: js-marker-stripped-base64-decoder
    desc: Marker-stripped custom Base64 decoder
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/property/assign::string-prototype-method-assignment
      - id: js-base64-custom-loop
      - id: js-global-marker-strip-empty
  - id: js-trig-charcode-decoder
    desc: Arithmetic string decoder with charcode reconstruction
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/arithmetic::js-numeric-sine-square-obfuscation
      - id: micro-behaviors/data/decode/custom::js-multi-charcode-decoder
  - id: js-trig-grid-charcode-decoder
    desc: Trig decoder rebuilding dense token grid
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/arithmetic::js-numeric-trig-round-obfuscation
      - id: micro-behaviors/data/decode/custom::js-multi-charcode-decoder
      - id: objectives/anti-static/obfuscation/string/reconstruct/indexed::js-indexed-short-token-grid
