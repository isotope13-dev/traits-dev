defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140

composite_rules:
  - id: managed-base64-modulo-key-string-decoder
    desc: Base64 and modulo-key XOR string decoding
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/decode/xor::cil-modulo-key-byte-xor-sequence
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: metadata/binary/symbols/name/token::dotnet-append-method-name
