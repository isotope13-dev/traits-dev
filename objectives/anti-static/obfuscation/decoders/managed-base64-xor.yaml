defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140

composite_rules:
  - id: managed-base64-modulo-key-string-decoder
    desc: Base64 and modulo-key XOR string decoding
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: metadata/binary/symbols/name/token/filesystem::dotnet-append-method-name
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::cil-modulo-key-byte-xor-sequence
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::cil-indirect-modulo-key-byte-xor
