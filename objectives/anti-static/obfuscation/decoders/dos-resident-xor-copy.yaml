defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1027,T1055

traits:
  - id: dos-xor-copy-resident-probe
    desc: DOS XOR copy accompanies resident probe
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_xor_copy_resident_probe {
          strings:
            $probe = { B8 00 0B BB 4D 5A CD 21 3D 4D 5A }
            $loop = { B9 ?? ?? AC 34 FF AA E2 FA B9 ?? ?? F3 A4 CB }
            $trampoline = { 2E 8E 16 ?? ?? 2E 8B 26 ?? ?? 2E FF 2E ?? ?? }
          condition:
            all of them
        }
