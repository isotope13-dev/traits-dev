# Cell text is passed through a half-offset interleave (transposition)
# decoder, nested, before the result is written into a runtime Excel 4.0
# macro sheet: the payload formulas sit transposed in worksheet cells.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1027,T1140

composite_rules:
  - id: vba-cell-transposition-decoder-xlm
    desc: Transposition-decodes cells into XLM macros
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/data/string/conversion::vb-mid-half-offset-interleave
      - id: micro-behaviors/data/document/spreadsheet::vba-nested-call-on-cell-value
      - id: micro-behaviors/data/collection/create::excel4-macro-sheet-creation
