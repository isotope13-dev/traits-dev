# The relationship atom binds caller JSON to a decipher helper's scrypt key,
# then binds the derived module name to the local require path. AEAD file
# operations corroborate concealment, not supply-chain abuse or a hostile stage.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
composite_rules:
- id: caller-data-aead-module-loading
  desc: Caller JSON keys a concealed module name
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/module/dynamic-load::caller-keyed-decipher-module-path
  - id: micro-behaviors/os/module/dynamic-load::node-file-io-aead-dynamic-require
  unless:
  - id: well-known/tool/detection/
