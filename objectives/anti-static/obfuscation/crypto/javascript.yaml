defaults:
  crit: hostile
  platforms:
  - windows
  - unix
  for:
  - javascript
  attack: T1027,T1140,T1059.007
  mbc: B0032
composite_rules:
- id: js-byte-masked-decoder-eval-loader
  desc: Byte-masked JavaScript decoder feeds indirect eval
  conf: 0.98
  scope: file
  all:
  - id: micro-behaviors/data/decode/custom::js-charcode-byte-mask
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  - id: metadata/lang/source/literal/string/population::js-many-very-long-strings
  unless:
  - id: metadata/path/directory::test-directory-component
- id: js-inverse-cipher-decoder-eval-loader
  desc: Inverse cipher clues and decoder with indirect eval
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/crypto/symmetric/aes/reference::js-inverse-cipher-name-profile
  - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  unless:
  - id: metadata/path/directory::test-directory-component
