defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1140,T1059.007
  mbc: B0032

traits:
  # Device-code phishing loaders observed across multiple PhaaS families bind
  # raw 128- or 256-bit key material as an ordinary Base64 string.  The width
  # alone is weak evidence, so this remains a component of the static-key DOM
  # rewrite composite below.
  - id: base64-16-or-32-byte-literal
    desc: Base64 literal holds 16 or 32 bytes
    crit: component
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '["'']([A-Za-z0-9+/]{22}==|[A-Za-z0-9+/]{43}=)["'']'

composite_rules:
  # Browser-delivered encrypted content is a staging mechanism when the page
  # decodes a blob, decrypts it with WebCrypto, and writes the result back into
  # the DOM.  The individual APIs remain neutral capabilities; this chain is
  # the suspicious observation.
  - id: browser-encrypted-payload-loader
    desc: Browser decrypts an embedded AES-GCM payload into page content
    crit: suspicious
    conf: 0.97
    for: [html, javascript]
    attack: T1027,T1140
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::webcrypto-aes-gcm-decrypt
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/ui/window/manage/dom::browser-document-write
    near_bytes: 4096

  # Shipping the ciphertext and its raw AES key in the same page provides no
  # confidentiality.  Combined with a document rewrite sink, the encryption
  # is serving as a static-analysis barrier around a browser-delivered stage.
  - id: browser-static-key-encrypted-payload-loader
    desc: Static-key AES-GCM browser payload rewrites page content
    crit: suspicious
    conf: 0.99
    for: [html, javascript, typescript]
    attack: T1027.013,T1140
    all:
      - id: browser-encrypted-payload-loader
      - id: micro-behaviors/crypto/symmetric/aes/library::webcrypto-aes-gcm-importkey
      - id: base64-16-or-32-byte-literal
    near_bytes: 4096

  - id: js-byte-masked-decoder-eval-loader
    desc: Byte-masked JavaScript decoder feeds indirect eval
    crit: hostile
    conf: 0.98
    for: [javascript]
    scope: file
    all:
      - id: micro-behaviors/data/decode/custom::js-charcode-byte-mask
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: micro-behaviors/process/interpreter/eval::js-indirect-eval-variable
      - id: metadata/file/metrics::js-many-very-long-strings
    unless:
      - id: metadata/package/testing/

  - id: js-handwritten-aes-decoder-eval-loader
    desc: JavaScript custom AES decoder feeds indirect eval
    crit: hostile
    conf: 0.99
    for: [javascript]
    scope: file
    all:
      - id: micro-behaviors/crypto/symmetric/aes/script::js-handwritten-aes-decrypt
      - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
      - id: micro-behaviors/process/interpreter/eval::js-indirect-eval-variable
    unless:
      - id: metadata/package/testing/
