defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027

traits:
  - id: environment-slice-hash-key
    desc: Hashes an env slice into key material
    crit: suspicious
    conf: 0.92
    if:
      # Parse a live call expression so commented examples do not become
      # anti-static behavior. Symbol call arguments retain only their shape,
      # so the tree node is required to prove the environment slice.
      type: tree-sitter
      kind: call
      regex: 'hashlib\.(sha[0-9]+|sha3_[0-9]+)\s*\(\s*os\.environ\[[^]]{1,32}\]\[[^]]{1,16}\]'
