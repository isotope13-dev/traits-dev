defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
composite_rules:
  - id: custom-crypto-no-imports
    desc: Custom crypto used but standard imports missing
    all:
      - id: micro-behaviors/os/random/prng/lcg::lcg-prng-engine
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
    unless:
      - id: micro-behaviors/crypto/library/
      - id: metadata/binary/symbols/name/token::crypt-import-public-key-info-string
      - id: micro-behaviors/crypto/provider/library::crypto-library-context
      - id: metadata/import/builtin::go-crypto-rsa-import
      - id: metadata/import/builtin::go-crypto-aes-import
      - id: metadata/signed/platform::microsoft
