defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-key-search-bytecode-loader
    desc: Bytecode loader searches cipher key at runtime
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/crypto/key/generate::python-chacha-counter-key-candidates
      - id: micro-behaviors/process/deploy/script-eval::python-decrypted-marshal-exec
