defaults:
  platforms: [unix, windows]
  attack: T1027,T1573.002
  mbc: B0032,F0001

composite_rules:
  - id: xor-concealed-pem-key-implant
    desc: Conceals PEM key with byte XOR for verified command execution
    crit: hostile
    conf: 0.98
    for: [elf, macho, pe, dll, so, dylib]
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::xor-encoded-pem-key-header
      - id: micro-behaviors/crypto/verify/
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/exec/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/subprocess/

  - id: source-xor-concealed-pem-key-implant
    desc: Source decodes byte-XORed PEM key for verified command execution
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::source-xor-pem-pubkey-loader
      - id: micro-behaviors/crypto/verify/
    any:
      - id: micro-behaviors/process/create/subprocess/capture::c-popen-call
      - id: micro-behaviors/process/create/exec/
      - id: micro-behaviors/process/create/shell/

  - id: script-xor-concealed-pem-key-implant
    desc: Script or source embeds XOR-obfuscated PEM key for command execution
    crit: hostile
    conf: 0.97
    for: [python, javascript, typescript, go, rust, powershell, php]
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::encoded-xor-pem-key-block
      - id: micro-behaviors/crypto/verify/
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/exec/
