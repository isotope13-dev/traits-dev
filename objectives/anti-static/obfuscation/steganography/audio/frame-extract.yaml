# Audio Steganography Payload Extraction
# Detects WAV file opened and frames read, combined with XOR decode
# and execution — a technique for hiding payloads in audio data.
# MBC: B0032.001 (Obfuscated Files: Steganography)
# ATT&CK: T1027.003 (Steganography)
defaults:
  platforms: [windows, unix]
  for: [python]
  mbc: "B0032.001"
  attack: "T1027.003"
traits:
  - id: audio-frame-b64decode
    desc: Audio frames decoded as base64 data
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'b64decode[\s\S]{0,60}readframes'
composite_rules:
  # The canonical PCM header is 44 bytes. Malware can hide each output byte
  # across the low nibbles of two successive audio bytes after that header.
  - id: powershell-wav-lower-nibble-payload-extraction
    desc: PowerShell reconstructs hidden bytes from low nibbles after a WAV header
    for: [powershell]
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/buffer/carve::powershell-fixed-44-byte-header-skip
      - id: micro-behaviors/data/buffer/record::powershell-lower-nibble-pair-merge
    near_lines: 24

  - id: powershell-wav-reflective-assembly-loader
    desc: PowerShell executes an in-memory assembly reconstructed from WAV low nibbles
    for: [powershell]
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1140,T1620
    mbc: B0032.001,E1059
    all:
      - id: powershell-wav-lower-nibble-payload-extraction
      - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-entrypoint-invoke
    near_lines: 48

  - id: audio-stego-data-extraction
    desc: Audio frames treated as encoded data carrier
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/format/media/audio::wave-open
      - id: audio-frame-b64decode
  - id: audio-stego-xor-exec
    desc: Audio steganography payload with XOR decode and execution
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/media/audio::wave-open
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
    any:
      - id: micro-behaviors/process/create/subprocess::popen-content
      - id: micro-behaviors/process/create/subprocess::sys-executable-popen
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    unless:
      - id: metadata/package/testing/
