# Invisible Unicode in content appended past a package.json object
# (filefacts `npm.manifest.trailing_*`): variation selectors and zero-width
# characters render as nothing in editors and terminals, so appended data
# carrying them is hidden from anyone reviewing the manifest.
defaults:
  crit: suspicious
  attack: T1027
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-manifest-trailing-variation-selectors
    desc: Manifest trailer hides variation selectors
    conf: 0.95
    if:
      type: metrics
      field: npm.manifest.trailing_variation_selectors
      min: 1
  - id: npm-manifest-trailing-zero-width
    desc: Manifest trailer hides zero-width characters
    conf: 0.9
    if:
      type: metrics
      field: npm.manifest.trailing_zero_width
      min: 1
