defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  conf: 0.97
composite_rules:
  - id: obfuscated-zero-width-decoder-eval
    desc: Obfuscated decoder result evaluated with zero-width data
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/eval/javascript::declared-decoder-result-eval
      - id: metadata/lang/encoding/shape/character::js-u200b-string
      - id: metadata/lang/encoding/shape/character::js-u200c-string
      - id: objectives/anti-static/obfuscation/string/encoding::js-strong-obfuscation
