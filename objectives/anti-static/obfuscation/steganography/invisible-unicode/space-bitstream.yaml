defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  attack: T1027.013

composite_rules:
  - id: unicode-space-binary-event-source
    desc: Whitespace bitstream decoding beside event source compilation
    crit: suspicious
    conf: 0.96
    # Storage concealment: both the whitespace carrier and its digit
    # substitution must exist, with binary parsing and an executable sink.
    # Ordinary Unicode layout and standalone binary-data decoders lack roles.
    all:
      - id: metadata/file/invisible-unicode::unicode-space-carrier-run
      - id: micro-behaviors/data/decode/base2::unicode-space-to-bit-substitution
      - id: micro-behaviors/data/decode/base2::js-binary-parseint
    any:
      - id: micro-behaviors/process/interpreter/eval/constructed::parsed-dom-handler-synthetic-click
      - id: micro-behaviors/process/interpreter/eval/constructed::dom-handler-synthetic-click-carrier
