# Hidden Unicode command data occurs near an execution sink.
# Proximity does not prove the decoded bytes were supplied to the sink.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: zero-width-command-loader
  desc: Zero-width command decoder near execution sink
  crit: suspicious
  conf: 0.99
  attack: T1027,T1059
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/decode/custom::zero-width-command-data-decoder
  any:
  - id: micro-behaviors/process/create/exec::child-process-execution
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
  - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
  - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
  - id: micro-behaviors/process/create/system::elixir-system-cmd
