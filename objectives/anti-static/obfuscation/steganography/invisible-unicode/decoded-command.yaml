# Hidden Unicode command data is decoded beside an execution sink.
# The decoder leg already requires an invisible-only carrier string and a
# dedicated radix-four symbol decoder; a reviewer cannot see the carrier, and
# no benign library hides command-sized data in zero-width characters. The
# 4 KB window binds that decoder to the process/eval sink in the same routine
# (TAXONOMY: bind source and sink by proximity where dataflow is unavailable).
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: zero-width-command-loader
  desc: Decodes invisible zero-width data beside command execution
  crit: hostile
  conf: 0.99
  attack: T1027,T1059
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/decode/custom::zero-width-command-data-decoder
  any:
  - id: micro-behaviors/process/create/exec::child-process-execution
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
  - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
  - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
  - id: micro-behaviors/process/create/system::elixir-system-cmd

- id: javascript-zero-width-encrypted-vm-loader
  desc: Decrypts zero-width binary data and executes it in a JavaScript VM
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1105,T1140
  mbc: B0024,B0032
  for: [javascript, typescript]
  near_bytes: 24000
  all:
  - id: micro-behaviors/data/decode/custom::js-zero-width-bitstream-decoder
  - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
  - id: micro-behaviors/data/decompress/gzip::node-gunzip-function
  - id: micro-behaviors/process/interpreter/vm::vm-runInNewContext-call
