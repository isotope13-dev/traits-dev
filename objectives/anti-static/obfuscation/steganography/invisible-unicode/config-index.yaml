# Binary indices concealed in otherwise ordinary configuration values.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027
traits:
  - id: binary-zero-width-conditional
    desc: Selects zero-width symbols by binary digit
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(\\u200[bBcC]|[​‌]).{0,40}==[= ]*["\x27][01].{0,20}(\\u200[bBcC]|[​‌])'
  - id: version-and-cache-fields
    desc: Adjacent version and cache configuration fields
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(["\x27]version["\x27]|\bversion)\s*:[^\n]{0,240}(["\x27]cache["\x27]|\bcache)\s*:'
composite_rules:
  - id: zero-width-config-index
    desc: Binary zero-width codec near version and cache configuration
    crit: suspicious
    conf: 0.94
    near_bytes: 4096
    all:
      - id: version-and-cache-fields
    any:
      - id: binary-zero-width-conditional
      - id: micro-behaviors/data/decode/custom::js-zero-width-bitstream-decoder
