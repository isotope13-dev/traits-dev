# Binary indices concealed in otherwise ordinary configuration values.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027
traits:
  - id: binary-zero-width-conditional
    desc: Selects zero-width symbols by binary digit
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(\\u200[bBcC]|[​‌]).{0,40}==[= ]*["\x27][01].{0,20}(\\u200[bBcC]|[​‌])'
  - id: version-and-cache-fields
    desc: Adjacent version and cache mapping fields
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["\x27]version["\x27]\s*:[^\n]{0,160}["\x27]cache["\x27]\s*:'
composite_rules:
  - id: zero-width-config-index
    desc: Binary zero-width encoder accompanies version and cache configuration
    crit: suspicious
    conf: 0.94
    all:
      - id: binary-zero-width-conditional
      - id: version-and-cache-fields
