# ASCII smuggling: text encoded into Unicode code points that render as
# nothing, so an instruction is invisible to a human reviewer but still read
# by a model or a parser. metadata/file/invisible-unicode already notices a
# file that CONTAINS such characters; this covers the other half, code that
# BUILDS them -- an agent skill, MCP server or package that ships the encoder
# is staging the payload rather than carrying it.
#
# Anchored on the Unicode Tags block (U+E0000) and the Variation Selectors
# Supplement (U+E0100) used as arithmetic bases. Deliberately NOT U+FE00:
# ordinary emoji code appends VS16 (U+FE0F) for presentation, so that constant
# would fire on any emoji-handling library.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  # The base with an offset ADDED to it inside chr(), i.e. a code point in the
  # invisible block is being MANUFACTURED from data. This is the discriminator
  # the composite below always claimed but did not check: it previously paired
  # the base constant with a `chr()` call anywhere in the same file, which a
  # sanitiser satisfies too -- code that strips smuggled text names the same
  # block to test against it (`if 0xE0000 <= cp <= 0xE007F: continue`) and will
  # almost certainly call chr() somewhere else. That labelled defensive
  # de-smuggling tooling as the smuggler. A stripper compares against the range
  # or subtracts from it; an encoder adds to it inside chr(). A bare
  # `chr(0xE0000)` -- a test vector or a constant reference, with no data being
  # encoded -- does not match: the `+` offset is required, on either side of
  # the base. Sibling code points sharing the matched prefix (e.g. `0xE0001`)
  # still match; they sit in the same invisible block.
  - id: unicode-hidden-block-char-construction
    desc: Builds char in invisible Unicode block
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'chr\([^)]{0,40}0[xX]E0(000|100)[^)]{0,40}\+|chr\([^)]{0,40}\+[^)]{0,40}0[xX]E0(000|100)'

composite_rules:
  - id: invisible-unicode-smuggling-encoder
    desc: Builds characters in invisible Unicode blocks
    crit: suspicious
    conf: 0.92
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      # Sanitizer test suites rebuild smuggled inputs (`chr(0xE0000 + ...)`) as
      # adversarial vectors to prove the defense flattens them.
      - id: metadata/package/testing/terminology::test-code-declaration-text
    for: [python]
    all:
      - id: unicode-hidden-block-char-construction
    any:
      - id: micro-behaviors/data/string/unicode::unicode-tags-block-base-reference
      - id: micro-behaviors/data/string/unicode::unicode-variation-selectors-supplement-base-reference
    needs: 1
