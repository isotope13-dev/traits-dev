defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: invisible-unicode-eval-source
    desc: Invisible Unicode and eval in non-ASCII source
    crit: component
    conf: 0.95
    # Eval and ordinary non-Latin or emoji text may coexist without the
    # invisible characters carrying a payload.
    all:
      - id: metadata/file/text-distribution::source-non-ascii-ratio-40
      - id: metadata/lang/encoding/shape/character::multiple
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-buffer-from-argument

  - id: invisible-byte-decoder-eval-source
    desc: Invisible-byte decoder and eval in source
    crit: hostile
    conf: 0.97
    attack: T1027.013
    mbc: F0001
    all:
      - id: invisible-unicode-eval-source
    any:
      - id: micro-behaviors/data/decode/invisible-unicode::zero-width-command-data-decoder
      - id: micro-behaviors/data/decode/invisible-unicode::javascript-variation-selector-byte-decoder
