defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.013
  mbc: F0001

composite_rules:
  - id: invisible-unicode-eval-source
    desc: Invisible Unicode and eval in non-ASCII source
    crit: suspicious
    conf: 0.95
    # The eval is what separates a payload from a file that legitimately holds
    # a lot of non-Latin text.
    all:
      - id: metadata/file/invisible-unicode::source-non-ascii-ratio-40
      - id: metadata/file/invisible-unicode::multiple
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-buffer-from-argument

  - id: invisible-byte-decoder-eval-source
    desc: Invisible-byte decoder and eval in source
    crit: hostile
    conf: 0.97
    all:
      - id: invisible-unicode-eval-source
    any:
      - id: micro-behaviors/data/decode/custom::zero-width-command-data-decoder
      - id: micro-behaviors/data/decode/custom::javascript-variation-selector-byte-decoder
