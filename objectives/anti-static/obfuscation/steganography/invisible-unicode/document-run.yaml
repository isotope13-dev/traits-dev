# A document that CARRIES hidden text in Unicode Tags-block characters
# (U+E0000-E007F), as opposed to the encoder code in encoder.yaml or the
# single spliced separator in objectives/evasion/anti-av/content. Smuggled
# instructions for LLM agents are spelled with these code points precisely
# because they render as nothing in every editor, diff and terminal, while
# the model still reads them. The matcher is a raw byte run so it does not
# depend on how the text extractor treats non-rendering characters.
#
# Eight consecutive tag characters clear the longest legitimate run: a
# subdivision-flag emoji (U+1F3F4 + up to five tag letters + U+E007F) never
# exceeds six, so decorated prose and flag collections stay silent.
defaults:
  platforms: [linux, macos, windows]
  for: [markdown, text, html]
  attack: T1027
  mbc: B0032

traits:
  - id: unicode-tag-character-run
    desc: Unicode tag characters encode hidden text
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?-u:(\xF3\xA0[\x80-\x81][\x80-\xBF]){8})'
    unless:
      # Unicode conformance and encoding test corpora carry tag-character
      # runs as table data; their context is test material, not a carried
      # payload.
      - id: metadata/path::test-directory-component
      - id: metadata/file/profile/test-indications/
      # Fuzzing/naughty-string wordlists enumerate tag characters as
      # input test data (with section headings), not as hidden text.
      - id: metadata/file/format/wordlist::commented-injection-vector-list
      - id: metadata/lang/source/syntax/call/invocation::markup-or-decoded-alert-calls
