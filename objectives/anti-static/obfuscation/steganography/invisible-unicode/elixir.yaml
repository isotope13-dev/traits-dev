defaults:
  platforms: [linux, macos, windows]
  for: [elixir]
  crit: suspicious
  conf: 0.9
  attack: T1027

composite_rules:
  - id: elixir-zero-width-decoder-pattern
    desc: Hidden Unicode data with radix decoder
    # Co-occurrence supports suspected steganographic decoding, not a claim
    # that recovered bytes reach a command sink. No activation gate is used.
    all:
      - id: metadata/file/invisible-unicode::zero-width-only-string
      - id: micro-behaviors/data/string/unicode::zero-width-format-codepoint-set
      - id: micro-behaviors/data/source/arithmetic::elixir-weighted-symbol-index
      - id: micro-behaviors/data/string/conversion::elixir-list-to-binary
