# Syriac-block character maps that decode to ASCII — used by UTF-16 JScript
# droppers (e.g. Quotation.js / JS.Muldrop) to hide WScript/PowerShell stages.
# Distinct from locale prose: keys are single Syriac letters mapped to
# printable ASCII glyphs in a dense object literal.
defaults:
  platforms: [windows]
  for: [javascript, html]
  attack: T1027.002
  mbc: B0032

traits:
  - id: syriac-ascii-alphabet-map
    desc: Syriac-to-ASCII alphabet substitution map
    crit: suspicious
    conf: 0.96
    count_min: 40
    if:
      type: text
      regex: '"[\u0700-\u074F]":"[ -~]"'

  - id: charat-split-property
    desc: Split cha+rAt string property access
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']cha["'']\s*\+\s*["'']rAt["'']'

  - id: charat-map-lookup-decoder
    desc: charAt loop indexes a character map
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\w+\s*\+=\s*\w+\[\s*\w+\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*\)\s*\]'

composite_rules:
  - id: syriac-alphabet-map-decoder
    desc: Syriac alphabet map with charAt decoder
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1059.007
    near_bytes: 8192
    all:
      - id: syriac-ascii-alphabet-map
      - id: charat-map-lookup-decoder
    any:
      - id: charat-split-property
      - id: metadata/file/metrics::high-byte-script-text
