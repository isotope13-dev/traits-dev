# High-byte JScript with Syriac mapping and a computed ActiveX call.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: syriac-charmap-activex-profile
    desc: Syriac map with computed ActiveX call
    crit: suspicious
    conf: 0.98
    near_bytes: 16384
    all:
      - id: objectives/anti-static/obfuscation/steganography/unicode::syriac-alphabet-map-decoder
      - id: micro-behaviors/data/control-flow/dispatch::computed-this-method-call
      - id: metadata/file/data-blob::high-byte-script-text
