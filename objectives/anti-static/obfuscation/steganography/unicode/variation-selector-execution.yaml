defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027.013,T1140

composite_rules:
  - id: variation-selector-byte-execution
    desc: Selector byte decoding with dynamic execution
    crit: suspicious
    conf: 0.97
    # Concealed execution is suspicious, but can also occur in a harmless
    # obfuscation demonstration. The decoded program decides the verdict.
    all:
      - id: metadata/file/invisible-unicode::supplementary-variation-selector-run
      - id: micro-behaviors/data/decode/custom::python-variation-selector-byte-decoder
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin

  - id: variation-selector-byte-decryption
    desc: Selector byte decoding with AES decryption
    crit: suspicious
    conf: 0.97
    # Layered concealment alone does not establish a hostile payload.
    all:
      - id: metadata/file/invisible-unicode::supplementary-variation-selector-run
      - id: micro-behaviors/data/decode/custom::python-variation-selector-byte-decoder
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-decrypt-flow
