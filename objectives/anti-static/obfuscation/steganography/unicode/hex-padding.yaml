defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1027

traits:
  - id: unicode-padded-hexadecimal
    desc: Unicode padding separates hexadecimal digits
    crit: suspicious
    conf: 0.98
    if:
      type: text
      # Loop over padding instead of expanding 32 Unicode classes per digit.
      # Longer padding carries the same evidence; still require 16 hex digits.
      regex: '([0-9A-Fa-f]\P{ASCII}{4,}){16}'
