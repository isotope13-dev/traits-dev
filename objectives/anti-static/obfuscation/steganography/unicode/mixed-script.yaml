defaults:
  platforms:
    - windows
    - unix
  mbc: B0032
  for:
    - javascript
    - typescript
traits:
  - id: js-nonascii-split-join-cleanup
    desc: Non-ASCII marker split-join cleanup
    crit: suspicious
    conf: 0.94
    attack: T1027.002
    for:
      - javascript
      - html
    count_min: 2
    if:
      type: text
      regex: \.split\(\s*["'][^\x00-\x7F]{4,}["']\s*\)\s*\.join\(\s*["']["']\s*\)
  - id: js-nonascii-replace-cleanup
    desc: Non-ASCII marker replace cleanup
    crit: suspicious
    conf: 0.9
    attack: T1027.002
    for:
      - javascript
      - html
    if:
      type: text
      regex: \.replace\(/[^/\n\[]{0,40}\P{ASCII}{4,}[^/\nA-Za-z]{0,8}/[a-z]*\s*,\s*["']{2}\)
    unless:
      - id: objectives/anti-static/obfuscation/string/conceal::js-nonascii-delimiter-regex-strip
    not:
      - regex: '[\p{Han}\p{Hiragana}\p{Katakana}\p{Hangul}]{2}'
      - regex: '[\p{Arabic}]{2}'
      - regex: '[а-яА-ЯёЁіїєґІЇЄҐ]{2}'
      - regex: '[\p{Tamil}\p{Devanagari}\p{Bengali}\p{Telugu}\p{Kannada}\p{Malayalam}\p{Gujarati}\p{Gurmukhi}\p{Thai}]{2}'
  - id: js-unicode-delimited-appdomain-fragment
    desc: Unicode-delimited AppDomain token fragment
    crit: component
    conf: 0.94
    for:
      - javascript
      - html
      - vbs
    if:
      type: text
      regex: A\P{ASCII}{4,32}p\P{ASCII}{4,32}p\P{ASCII}{4,32}D
  - id: js-unicode-delimited-base64-fragment
    desc: Unicode-delimited Base64 decoder fragment
    crit: component
    conf: 0.94
    for:
      - javascript
      - html
      - vbs
    if:
      type: text
      regex: F\P{ASCII}{4,32}r\P{ASCII}{4,32}o
composite_rules:
  - id: unicode-delimited-managed-loader-tokens
    desc: Unicode delimiters split managed payload-loader API tokens
    crit: suspicious
    conf: 0.98
    attack: T1027.002,T1140,T1620
    for:
      - javascript
      - vbs
    all:
      - id: js-unicode-delimited-appdomain-fragment
      - id: js-unicode-delimited-base64-fragment
      - id: metadata/lang/encoding/shape/character::non-ascii-script-text
  - id: vbs-unicode-delimited-hidden-managed-loader
    desc: Unicode marker conceals a hidden WMI managed payload loader
    crit: hostile
    conf: 0.995
    attack: T1027.002,T1047,T1059.001,T1105,T1140,T1564.003,T1620
    for:
      - vbs
    all:
      - id: unicode-delimited-managed-loader-tokens
      - id: objectives/anti-static/obfuscation/string/delimiter::vbs-unicode-marker-split
      - id: objectives/execution/wmi/script::vbs-http-range-reflective-wmi-loader
  - id: js-unicode-delimited-hidden-managed-loader
    desc: Unicode marker conceals a hidden WMI managed payload loader
    crit: hostile
    conf: 0.995
    attack: T1027.002,T1047,T1059.001,T1140,T1564.003,T1620
    for:
      - javascript
    all:
      - id: unicode-delimited-managed-loader-tokens
      - id: js-nonascii-split-join-cleanup
      - id: micro-behaviors/process/create/hidden::js-hidden-process-create-sequence
  - id: unicode-delimited-wmi-powershell-stage
    desc: Unicode-obfuscated hidden WMI download stage
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1047,T1059.001,T1564.003,T1105
    mbc: B0032,E1043
    for:
      - javascript
      - html
    all:
      - id: js-nonascii-split-join-cleanup
      - id: micro-behaviors/process/create/hidden::wmi-hidden-variable-process-create
      - id: micro-behaviors/os/env/write::wsh-environment-item-assignment
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/communications/http/client/webclient::unicode-delimited-webclient-download
      - id: objectives/anti-static/obfuscation/string/delimiter::unicode-delimited-powershell-command
