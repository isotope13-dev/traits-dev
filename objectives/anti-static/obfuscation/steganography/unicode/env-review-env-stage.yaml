defaults:
  platforms: [windows]
  for: [javascript, text, data]
  attack: T1059.007

composite_rules:
- id: unicode-env-chunk-hidden-wmi-launcher
  desc: Unicode environment chunks and hidden WMI
  crit: hostile
  conf: 0.99
  for: [javascript]
  attack: T1027,T1564.003
  all:
  - id: micro-behaviors/os/env/read/variable::wsh-environment-object
  - id: micro-behaviors/data/property/write::item-substring-chunk-assignment
  - id: micro-behaviors/process/create/wmi::wmi-getobject-hidden-create-clues
  - id: objectives/anti-static/obfuscation/steganography/unicode::unicode-delimited-managed-loader-tokens
