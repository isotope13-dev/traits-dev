defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - c
  - cpp
  - csharp
  - rust
  - go
  - javascript
  - typescript
  - powershell
  - java
  - kotlin
  attack: T1027.003
  mbc: B0032.001
traits:
- id: powershell-byte-tail-slice
  desc: PowerShell slices indexed byte-array tail
  crit: notable
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    regex: \$\w+\s*=\s*\$\w+\[\$\w+\.\.\(\$\w+\.Length\s*-\s*1\)\]
composite_rules:
- id: jvm-embedded-png-steganography-extract
  desc: JVM decodes inlined PNG and extracts stego data
  crit: hostile
  conf: 0.97
  for:
  - java
  - kotlin
  near_lines: 40
  all:
  - id: micro-behaviors/data/embedded/payload/image::embedded-png-source-literal
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
  - id: micro-behaviors/data/arithmetic::source-low-bit-mask
- id: powershell-png-tail-payload-extraction
  desc: PowerShell extracts bytes appended after a PNG terminator
  crit: suspicious
  conf: 0.98
  for:
  - powershell
  all:
  - id: micro-behaviors/data/format/media/raster::source-png-iend-byte-prefix
  - id: powershell-byte-tail-slice
  near_lines: 20
- id: powershell-remote-png-tail-dropper
  desc: PowerShell downloads, extracts, writes, and launches a PNG-tail payload
  crit: hostile
  conf: 0.99
  for:
  - powershell
  attack: T1027.003,T1105,T1204.002
  all:
  - id: powershell-png-tail-payload-extraction
  - id: micro-behaviors/communications/http/client/managed::downloaddata
  - id: micro-behaviors/fs/write/file/full::write-all-bytes
  - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
  - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-start-launch
  near_lines: 40
- id: source-image-eof-payload-extraction
  for: [python]
  desc: Source extracts data appended after an image terminator
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/buffer/carve::python-eof-index-tail-slice
  any:
  - id: micro-behaviors/data/format/media/raster::source-jpeg-terminator-search
  - id: micro-behaviors/data/format/media/raster::source-png-terminator-search
  needs: 1
  near_bytes: 2048
- id: python-image-tail-base64-decoder
  for:
  - python
  desc: Python Base64-decodes an extracted image tail
  crit: suspicious
  conf: 0.98
  attack: T1027.003,T1140
  all:
  - id: source-image-eof-payload-extraction
  - id: micro-behaviors/data/decode/base64::b64decode-call
  near_bytes: 4096
- id: ngrok-image-config-channel
  for: [python]
  desc: Ngrok C2 configuration is recovered from an appended image payload
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1090,T1071
  all:
  - id: source-image-eof-payload-extraction
  - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tcp-source-endpoint
  near_bytes: 4096
- id: python-image-tail-cipher-decryptor
  for:
  - python
  desc: Python decrypts an extracted image tail
  crit: suspicious
  conf: 0.98
  attack: T1027.003,T1140
  all:
  - id: source-image-eof-payload-extraction
  - id: micro-behaviors/crypto/decrypt::python-cipher-decryptor-call
  near_bytes: 4096
- id: python-image-tail-payload-dropper
  for:
  - python
  desc: Python extracts image tail payload, writes, and executes it
  crit: suspicious
  conf: 0.98
  attack: T1027.003,T1105,T1204.002
  all:
  - id: source-image-eof-payload-extraction
  - id: micro-behaviors/process/create/subprocess::popen-ast
  any:
  - id: micro-behaviors/fs/write/file/full::python-pathlib-write-bytes
  - id: micro-behaviors/fs/write/file/handle::python-binary-write-pattern
  near_lines: 40
