# Source-level extraction of data appended after a JPEG/PNG terminator.
# The file-format boundary is structural evidence; the C2 and decoding
# composites below supply the malicious context.
defaults:
  platforms: [windows, unix]
  for: [python, c, cpp, csharp, rust, go, javascript, typescript]
  attack: T1027.003
  mbc: B0032.001

traits:
  - id: png-idat-chunk-literal
    desc: PNG IDAT chunk type literal
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '["'']IDAT["'']'
  - id: png-iend-chunk-literal
    desc: PNG IEND chunk type literal
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '["'']IEND["'']'
  - id: payload-after-image-terminator-source
    desc: Slices payload after image terminator
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(config|payload)[a-z0-9_]{0,12}\s*=\s*\w+\[\s*eof\s*:\s*\]'

composite_rules:
  - id: png-idat-iend-parser
    desc: Parses PNG IDAT and IEND chunks
    crit: notable
    conf: 0.9
    all:
      - id: png-idat-chunk-literal
      - id: png-iend-chunk-literal
  - id: source-image-eof-payload-extraction
    desc: Source extracts data appended after an image terminator
    crit: suspicious
    conf: 0.97
    all:
      - id: payload-after-image-terminator-source
    any:
      - id: micro-behaviors/data/format/media/raster::javascript-jpeg-terminator-search
      - id: micro-behaviors/data/format/media/raster::javascript-png-terminator-search
    needs: 1
    near_bytes: 2048

  - id: image-carried-config-loader
    desc: Image-embedded payload is Base64-decoded as configuration
    crit: hostile
    conf: 0.98
    attack: T1027.003,T1140,T1105
    all:
      - id: source-image-eof-payload-extraction
      - id: micro-behaviors/data/decode/base64::b64decode-call
    near_bytes: 4096

  - id: ngrok-image-config-channel
    desc: Ngrok C2 configuration is recovered from an appended image payload
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1090,T1071
    all:
      - id: source-image-eof-payload-extraction
      - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tcp-source-endpoint
    near_bytes: 4096
