defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: dotnet-keyed-bitmap-resource-clues
  desc: .NET keyed bitmap resource clues
  crit: suspicious
  conf: 0.99
  mbc: E1027.m02
  all:
    - id: metadata/lang/compiler/managed::dotnet-assembly
    - id: micro-behaviors/ui/graphics/image::getpixel-api-name
    - id: metadata/binary/resource/label::sbytetypein-resource-accessor
  any:
    - id: metadata/binary/resource/representation::sbytetypein-resource-key-hex
    - id: metadata/binary/resource/representation::secondary-resource-key-hex
    - id: micro-behaviors/process/config/window::dotnet-console-launch-config-references
    - id: micro-behaviors/process/fd/stdio::dotnet-child-stdio-config-references
    - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
    - id: micro-behaviors/ui/graphics/draw::gdi-bitmap-transfer-primitives
  needs: 2
  unless:
    - id: metadata/binary/layout/size::large-file-1mb
