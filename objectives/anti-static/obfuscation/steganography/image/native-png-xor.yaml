defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
composite_rules:
  - id: png-resource-xor-decoder
    desc: Extreme-width PNG resource beside a cyclic XOR decoder
    crit: suspicious
    conf: 0.98
    attack: T1027.003,T1140
    near_bytes: 65536
    all:
      - id: metadata/binary/resource/embedded-media::png-resource-extreme-width
      - id: micro-behaviors/data/encoding/xor/cyclic-key::x64-resource-cyclic-xor-loop
