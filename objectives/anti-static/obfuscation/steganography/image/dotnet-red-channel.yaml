defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Obfuscated stego loaders junk-pad the IL so the tight
  # GetPixel-to-channel-getter byte pattern never lands literally, while
  # still reading every pixel through all three aliased channel getters
  # (get_R/get_G/get_B) off a resource bitmap. Either shape establishes
  # the same pixel-decomposition observation.
  - id: dotnet-pixel-channel-decomposition
    desc: Resource bitmap pixels read through all channel getters
    crit: suspicious
    conf: 0.93
    attack: T1027.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: micro-behaviors/ui/graphics/image::dotnet-color-red-accessor
      - id: micro-behaviors/ui/graphics/image::dotnet-color-green-accessor
      - id: micro-behaviors/ui/graphics/image::dotnet-color-blue-accessor
      - id: micro-behaviors/metaprogramming/reflection::dotnet-getobject-token
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect/
      - id: well-known/app/ai/browser-agent/botzilla/
      - id: well-known/lib/ui/wpf/
      - id: well-known/lib/ui/devexpress/
      - id: well-known/lib/ui/wisej/
      - id: well-known/tool/development/lint/ndepend/
      - id: metadata/signed/platform/
  - id: dotnet-red-channel-byte-collection
    desc: .NET pixel red-channel references with byte-collection IL sequence
    crit: suspicious
    conf: 0.96
    attack: T1027.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: micro-behaviors/ui/graphics/image::dotnet-color-red-accessor
    any:
      - id: micro-behaviors/data/control-flow/sequence::cil-call-value-getter-call-sequence
      - id: objectives/anti-static/obfuscation/steganography/image::dotnet-pixel-channel-decomposition
    needs: 1
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect/
      # Botzilla matches screen elements with pixel reads; that automation
      # behavior is not pixel-steganography staging.
      - id: well-known/app/ai/browser-agent/botzilla/
      # WPF libraries legitimately read pixels (eye-dropper color pickers,
      # theme rendering) beside generic CIL getter sequences; that UI artwork
      # handling is not pixel-steganography staging.
      - id: well-known/lib/ui/wpf/
      - id: well-known/lib/ui/devexpress/
      - id: well-known/lib/ui/wisej/
      - id: well-known/tool/development/lint/ndepend/
      # Microsoft's own System.Windows.Forms assemblies carry bitmap pixel
      # readback (ControlPaint, image lists) beside the same CIL getter shape.
      - id: metadata/signed/platform/

  - id: tasked-rat-pixel-assembly-concealment
    desc: Tasked RAT hides assembly bytes in pixels
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1620
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::dotnet-red-channel-byte-collection
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::managed-tasked-redirected-shell
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/data/control-flow/sequence::cil-call-chain-null-invoke-sequence

  - id: dotnet-red-channel-stego-reflective-loader
    desc: .NET red-channel pixel steganography feeds reflective execution
    crit: hostile
    conf: 0.98
    attack: T1027.003,T1620
    all:
      - id: dotnet-red-channel-byte-collection
      - id: objectives/command-and-control/dropper/staging/managed::stego-bitmap-reflection-invoke
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: metadata/binary/resource/size::clr-resource-high-entropy
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/ui/devexpress/
