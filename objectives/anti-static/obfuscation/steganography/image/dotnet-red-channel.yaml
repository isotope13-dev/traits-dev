defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.003,T1620
composite_rules:
  # Some loaders harvest only R from a single row, without G/B references.
  # Require both adjacent CIL sequences; pixel and reflection names alone
  # are common in benign image applications. No chosen URL or task name gates
  # this match. The tasked-shell leg independently establishes implant context.
  - id: tasked-rat-red-channel-assembly-concealment
    desc: Tasked RAT pixel/getter CIL beside load/invoke chain
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::managed-tasked-redirected-shell
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: metadata/binary/symbols/name/token::dotnet-get-r-member-name
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/data/control-flow/sequence::cil-local-result-null-invoke-layout

  - id: tasked-rat-pixel-assembly-concealment
    desc: Tasked RAT hides assembly bytes in pixels
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-rgb-byte-array-profile
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::managed-tasked-redirected-shell
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/data/control-flow/sequence::cil-call-chain-null-invoke-sequence

  - id: dotnet-red-channel-stego-reflective-loader
    desc: .NET red-channel pixel steganography feeds reflective execution
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-rgb-byte-array-profile
      - id: objectives/command-and-control/dropper/staging/managed::stego-bitmap-reflection-invoke
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/ui/devexpress/
