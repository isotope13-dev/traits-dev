# Reviewed native chain: DLL_PROCESS_ATTACH -> LoadBitmap/GetDIBits -> AES-CBC
# -> length-prefixed MSI in TEMP -> CreateProcessW(msiexec /i <path> /qn).
# The all-aliased ABI establishes a deceptive library rather than an ordinary
# bitmap-capable installer. Require both resource and code-side evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: export-stub-bitmap-msi-concealment
    desc: "Export-stub DLL: bitmap, AES and silent MSI"
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1218.007
    all:
      - id: metadata/binary/symbols/exports::single-entry-export-table
      - id: micro-behaviors/ui/graphics/image::load-bitmap-resource
      - id: micro-behaviors/hardware/display/screen::gdi-getdibits
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes-pe-rdata
      - id: metadata/binary/resource/entropy::very-high-entropy-rsrc-section
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/spawn::create-process-w
