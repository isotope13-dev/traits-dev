defaults:
  platforms:
  - windows
  crit: suspicious
composite_rules:
- for: &id001
  - pe
  - dll
  id: dotnet-rgb-reflection-references
  desc: RGB byte-array and reflection references
  conf: 0.96
  all:
  - id: micro-behaviors/ui/graphics/image::dotnet-rgb-byte-array-profile
  any:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::appdomain-exportedtype-invoke-references
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::exportedtype-constructor-invoke-references
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-callbyname-token
  unless:
  - id: metadata/file/extension/identity::netstandard-dll-basename
  downgrade:
    any:
    - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
    - id: well-known/lib/runtime/managed/dotnet-distribution::msbuild-runtime-assembly-context
- for:
  - pe
  id: dotnet-unsigned-rgb-reflection-entropy
  desc: Unsigned RGB, reflection and entropy clues
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::dotnet-rgb-reflection-references
  - id: metadata/signature/absent::unsigned-missing-signature-record
  any:
  - id: metadata/binary/code/entropy::high-code-entropy
  - id: metadata/binary/resource/entropy::rsrc-entropy-at-least-66
  - id: metadata/binary/resource/size::clr-resource-large
  needs: 1
  exempt:
    unverified-signature-suppressor: Signature-structure logic (present, absent, intact), not trust in a signer.
  unless:
  - id: well-known/lib/ui/devexpress/
  - id: metadata/signature/certificate/format::dotnet-strong-name-signed
- for: *id001
  id: dotnet-bitmap-sparse-import-entropy
  desc: Bitmap APIs, sparse imports and entropy clues
  conf: 0.93
  size_max: 2097152
  near_bytes: 8192
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/symbols/imports::single-import-raw
  - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
  any:
  - id: objectives/anti-static/pack/runtime::dotnet-packed-stub
  - id: metadata/binary/section/entropy::random-exec-payload-section
  - id: metadata/binary/code/entropy::high-code-entropy
  needs: 2
  downgrade:
    any:
    - id: well-known/app/system/crayens/
  unless:
  - id: well-known/lib/ui/devexpress/
- for: *id001
  id: dotnet-rgb-load-reflection-profile
  desc: RGB byte-array and load-reflection references
  conf: 0.95
  all:
  - id: micro-behaviors/ui/graphics/image::dotnet-rgb-byte-array-profile
  any:
  - id: objectives/anti-static/obfuscation/steganography/image::dotnet-rgb-reflection-references
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-appdomain-callbyname-references
- for:
  - pe
  id: dotnet-unsigned-rgb-appdomain-resource
  desc: Unsigned RGB, AppDomain and resource clues
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::dotnet-rgb-load-reflection-profile
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-appdomain-callbyname-references
  - id: metadata/binary/resource/entropy::clr-resource-high-entropy
  - id: metadata/signature/absent::unsigned-missing-signature-record
- for: *id001
  id: confuserex-bitmap-reflection-resource
  desc: ConfuserEx, bitmap, reflection and resource clues
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/managed::confuserex-version-banner
  - id: objectives/anti-static/obfuscation/steganography/image::dotnet-bitmap-sparse-import-entropy
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
  any:
  - id: metadata/binary/symbols/name/token/execution::process-start-member-token
  - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-lockbits-reference
- for: *id001
  id: dotnet-vb-bitmap-entropy-write-clues
  desc: VB bitmap, entropy and text-write references
  conf: 0.97
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
  - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-api-references
  - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
  - id: metadata/binary/section/entropy::random-exec-payload-section
  - id: micro-behaviors/fs/write/file/full/string::dotnet-writealltext-token
  unless:
  - id: objectives/anti-static/obfuscation/obfuscator/managed/
  - id: metadata/build/protector::smartassembly-or-poweredby-build-markers
  - id: metadata/build/protector::dotnet-reactor-module-guid-type
- for: *id001
  id: dotnet-bitmap-template-entropy-clues
  desc: Bitmap, template and entropy combinations
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::dotnet-bitmap-sparse-import-entropy
  - id: objectives/anti-static/pack/entropy::dotnet-template-entropy-loader-clues
- for: *id001
  id: dotnet-bitmap-template-activator-clues
  desc: Bitmap, template and Activator references
  conf: 0.96
  all:
  - id: objectives/anti-static/pack/entropy::dotnet-template-entropy-loader-clues
  - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-method-token
