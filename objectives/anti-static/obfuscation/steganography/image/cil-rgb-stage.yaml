    desc: RGB bitmap extraction feeds managed assembly loading
    crit: hostile
    conf: 0.98
    attack: T1027.003
    all:
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/ui/graphics/image::dotnet-color-red-accessor
      - id: micro-behaviors/data/control-flow/sequence::cil-value-getter-collection-add
      - id: micro-behaviors/data/control-flow/sequence::cil-sized-helper-load-type-array
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
