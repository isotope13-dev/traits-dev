defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.003
  mbc: B0032.001

traits:
  - id: harvest-atlas-fragments-token
    desc: HarvestAtlasFragments method token
    crit: component
    conf: 0.98
    if:
      type: text
      exact: HarvestAtlasFragments

composite_rules:
  # HOSTILE (T1027.003 Steganography): the bitmap pixel-payload extractor
  # feeding a reflective in-memory loader. The payload is hidden in the pixels
  # of a resource bitmap, reconstructed byte-by-byte at runtime, then passed to
  # a reflective invocation chain. No benign program combines packed code,
  # resource-pixel extraction, and reflective dispatch. This catches GetPixel
  # variants regardless of whether they enumerate types, instantiate through
  # Activator, reverse member names, or dispatch through InvokeMember.
  - id: dotnet-bitmap-stego-reflective-loader
    desc: .NET bitmap payload reflective execution
    crit: hostile
    conf: 0.99
    # A large, feature-rich assembly (a commercial UI/reporting suite,
    # multiple MB, thousands of types) can independently ship heavy bitmap
    # pixel manipulation (custom-drawn controls, skinning) AND unrelated
    # reflection-based plugin/type loading ANYWHERE in its code, with no
    # connection between the two. DevExpress.Utils -- a real, large legacy
    # WinForms component library test fixture -- combines exactly these
    # unconnected features and reads as this loader without near_bytes.
    # A genuine stego loader keeps pixel-read, resource/type lookup, and
    # reflective dispatch in one tight loader stub; require that proximity.
    near_bytes: 8192
    all:
      - id: dotnet-bitmap-pixel-payload-extraction
      - id: metadata/binary/metrics/structural::high-code-entropy
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-reflective-invoke-any
    downgrade:
      any:
        - id: well-known/app/system/crayens/
    unless:
      # DevExpress's WinForms/WPF skinning engine (DevExpress.Utils,
      # DevExpress.XtraEditors) legitimately does per-pixel bitmap access for
      # custom-drawn controls plus heavy reflection for its design-time
      # infrastructure -- observed at normal (unpacked) IL entropy, not the
      # packed body this rule targets.
      - id: well-known/lib/ui/devexpress/
  - id: dotnet-bitmap-pixel-payload-extraction
    desc: .NET bitmap pixel payload extraction
    crit: suspicious
    conf: 0.94
    near_bytes: 8192
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/embedded/payload/image::dotnet-bitmap-type-token
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-manager-token
      - id: micro-behaviors/data/encode/image/pixel::pixel-access-getpixel
    any:
      - id: harvest-atlas-fragments-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-reflective-invoke-any
      - id: objectives/anti-static/pack/entropy::dotnet-large-packed-text
    downgrade:
      any:
        - id: well-known/app/system/crayens/
    unless:
      # Jitbit's compiled macro player embeds screenshot templates, reads
      # pixels for image matching, and also ships reflection-based command UI.
      # Those independent features do not reconstruct an executable payload.
      - id: well-known/app/productivity/jitbit-macro-recorder::known-binary-context
      - id: well-known/lib/ui/devexpress/

  # Pixel extraction is suspicious by itself because image-processing software
  # can legitimately inspect a Bitmap.  Pairing it with the AppDomain
  # CallByName/Assembly.Load chain makes the pixels an executable stage rather
  # than image data; the unsigned high-entropy resource further distinguishes
  # this from plugin or graphics applications.
  - id: dotnet-bitmap-appdomain-memory-loader
    desc: .NET bitmap payload loads through reflection
    crit: hostile
    conf: 0.99
    attack: "T1027.003,T1620"
    mbc: "B0032.001,E1059"
    for: [pe]
    all:
      - id: dotnet-bitmap-pixel-payload-extraction
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-appdomain-callbyname-load
      - id: metadata/binary/resource::clr-resource-high-entropy
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/

  # Per-pixel ARGB readback (GetPixel + ToArgb) of a resource bitmap whose bytes
  # are then Base64-decoded, inside a packed near-maximum-entropy assembly, is a
  # steganographic payload extractor. No benign program reconstructs a byte
  # stream out of image pixels and Base64-decodes it from a 7.9-entropy packed
  # body; ordinary image processing reads pixels but ships normal-entropy IL and
  # no decode step. Discriminated from the loader rule by requiring the decode
  # (FromBase64String) rather than the reflective-execution leg.
  - id: dotnet-bitmap-pixel-stego-decode
    desc: .NET resource-bitmap pixel steganography payload decode (packed body)
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-manager-token
      - id: micro-behaviors/data/encode/image/pixel::pixel-access-getpixel
      - id: micro-behaviors/data/encode/image/pixel::pixel-access-toargb
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: objectives/anti-static/pack/entropy::dotnet-high-entropy-text-raw
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: well-known/app/system/crayens/

  # A resource bitmap plus repeated opaque padding, Base64 decoding, and a
  # Base64 PE DOS stub is a staged executable carrier. The padding condition
  # distinguishes this from ordinary applications that merely ship a PNG.
  - id: dotnet-bitmap-obfuscated-pe-loader
    desc: .NET bitmap conceals an obfuscated PE loader
    crit: hostile
    conf: 0.98
    attack: "T1027.003,T1027.009,T1620"
    mbc: "B0032.001,E1059"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: metadata/binary/resource::clr-resource-repeated-junk-padding
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-backed-bitmap
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/embedded/payload/header::pe-dos-stub-base64
    unless:
      - id: metadata/signed/platform/

  # The loader variant used here reads raw RGB channels from a resource bitmap,
  # then reflectively instantiates a type from the reconstructed bytes. It does
  # not expose Assembly.Load in its strings: the call is represented by a
  # metadata token, so the independent exported-type, CreateInstance, and
  # Activator markers are the execution leg. LockBits is deliberately accepted
  # here alongside GetPixel-based variants: both APIs expose raw bitmap bytes,
  # and the reflection chain is what separates a payload extractor from image
  # processing.
  - id: dotnet-bitmap-pixel-reflective-instantiation
    desc: .NET bitmap pixel payload reaches reflected instantiation
    crit: hostile
    conf: 0.99
    attack: "T1027.003,T1620"
    mbc: "B0032.001,E1059"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-instance-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::get-exported-types-token
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: well-known/app/system/crayens/
  - id: dotnet-reactor-resource-bitmap-base64-loader
    desc: .NET Reactor resource bitmap Base64 payload loader
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: well-known/app/system/crayens/
  - id: dotnet-reactor-high-entropy-resource-bitmap-loader
    desc: .NET Reactor high-entropy bitmap resource loader
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
    any:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: well-known/app/system/crayens/
