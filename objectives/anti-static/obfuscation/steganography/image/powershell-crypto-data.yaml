# Image low-bit extraction and cryptographic source evidence.
defaults:
  platforms:
  - windows
  for:
  - data
  attack: T1027.003
composite_rules:
- id: powershell-image-lsb-decryptor-clues
  desc: Image LSB extraction and decryption clues
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::powershell-image-lsb-payload-extraction
  - id: micro-behaviors/crypto/decrypt/initialize::create-decryptor
  - id: objectives/anti-static/obfuscation/string/broken-api::dotnet-frombase64string-obfuscated-data
  any:
  - id: micro-behaviors/crypto/kdf/password::rfc2898derivebytes-data
  - id: micro-behaviors/crypto/hash/hmac::dotnet-hmacsha1-class
  - id: micro-behaviors/os/sysinfo/platform/locale::powershell-culture-english-name-text
- id: powershell-http-culture-image-lsb-clues
  desc: HTTP, culture and image LSB clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/content-length::powershell-head-contentlength-text
  - id: micro-behaviors/communications/http/request/verb::powershell-head-method-text
  - id: micro-behaviors/os/sysinfo/platform/locale::powershell-culture-english-name-text
  - id: objectives/anti-static/obfuscation/steganography/image::powershell-getpixel-lsb-nibble
  - id: micro-behaviors/communications/http/client/managed::webrequest-create-data
- id: powershell-image-lsb-pbkdf-cbc-clues
  desc: Image LSB, PBKDF and CBC decryption clues
  crit: suspicious
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::powershell-getpixel-lsb-nibble
  - id: micro-behaviors/crypto/kdf/password::rfc2898derivebytes-data
  - id: micro-behaviors/crypto/symmetric/config::cbc-mode
  - id: micro-behaviors/crypto/decrypt/initialize::create-decryptor
