# MALFEX's img-to-native decrypts bytes appended after a PNG terminator.
# No package, key, host, payload filename, or extension gates this observation.
# Decryption and trailer carving must both be present; an image parser or a
# cipher API alone does not establish an encrypted hidden trailer.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  crit: suspicious
  conf: 0.97
  attack: T1027.003,T1140

composite_rules:
  - id: javascript-encrypted-png-tail-extraction
    desc: PNG trailer carving co-occurs with Node cipher decryption
    near_lines: 40
    for: [javascript, typescript]
    all:
      - id: javascript-png-tail-extraction
    any:
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/decrypt::create-decipher-call
  - id: python-encrypted-image-tail-extraction
    desc: Image trailer carving co-occurs with Python cipher decryption
    near_lines: 40
    for: [python]
    all:
      - id: source-image-eof-payload-extraction
      - id: micro-behaviors/crypto/decrypt::python-cipher-decryptor-call
