# A .NET program that reads a resource bitmap pixel by pixel, instantiates a
# type from an assembly it names at run time, and carries a large block of
# packed text is a loader that hides its second stage in image data. Ordinary
# image tools read pixels and plugin hosts instantiate by name; neither also
# ships an unsigned packed-text body. The staging-side view of the same shape
# (with the VB late-call token) is in
# `objectives/command-and-control/dropper/staging/managed`.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.003,T1620
composite_rules:
  - id: bitmap-pixel-reflection-packed-text-stego
    desc: Bitmap pixel reader, reflection, packed text
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-assembly-token
      - id: metadata/binary/symbols/name::dotnet-create-instance-method-name
      - id: objectives/anti-static/pack/entropy::dotnet-large-packed-text
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/ui/devexpress/
      - id: well-known/lib/ui/wisej/
