defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: confuserex-bitmap-invoke-profile
  desc: ConfuserEx bitmap readback and invoke clues
  crit: suspicious
  conf: 0.97
  attack: T1027.003
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/managed::confuserex-version-banner
  - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
  - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
  - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-lockbits-reference
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  any:
  - id: metadata/binary/symbols/name/token::process-start-member-token
  - id: metadata/binary/symbols/imports::single-import-count
  - id: metadata/binary/symbols/imports::single-import-raw
  unless:
  - id: metadata/signed/platform/
