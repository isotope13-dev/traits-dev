defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: webrtc-png-bit-assembly
    desc: WebRTC, PNG URLs, and byte reconstruction clues
    crit: notable
    conf: 0.95
    # The mask can be concealed behind an accessor. Do not assume its value.
    all:
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: micro-behaviors/communications/url/query/structure::png-url-uuid-template
      - id: micro-behaviors/data/bitwise/mask::js-masked-array-shift-accumulator
      - id: micro-behaviors/data/decode/utf8::textdecoder-default-utf8-constructor
    near_bytes: 8192

  - id: obfuscated-webrtc-png-bit-assembly
    desc: Obfuscated WebRTC, PNG URLs, and bit assembly
    crit: suspicious
    conf: 0.95
    attack: T1027.003
    # Concealed image signaling hides Canvas method names and mask values.
    # The decoder accessor may be distant from the channel implementation.
    # Co-occurrence warrants review; it does not prove a wallet theft.
    all:
      - id: webrtc-png-bit-assembly
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::custom-string-table-obfuscator
