# Validated DOS and NT headers in RGB columns establish executable concealment.
# Pixel-reading and type-dispatch references provide the program context; image
# entropy and unrelated Activator uses cannot establish this mechanism.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-bitmap-column-pe-concealment
    desc: .NET bitmap columns conceal executable PE
    crit: hostile
    conf: 0.98
    attack: T1027.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/embedded/payload/image::bmp-rgb-column-pe-header
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::gettypes-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-exported-types-token
    unless:
      - id: metadata/signed/platform/
