# Code that imports an imaging library and executes a latin-1-decoded byte
# buffer is running data carried by image content as Python source. Image
# processing never needs exec(); pixel or channel bytes become code only when
# a payload has been hidden in the image.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1027.003,T1059.006

composite_rules:
  - id: python-imaging-import-decoded-buffer-exec
    desc: Imaging-library module execs a latin-1 decoded buffer
    crit: hostile
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/data/format/media/raster::python-imaging-library-import
      - id: micro-behaviors/data/decode/charset::python-latin1-decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
