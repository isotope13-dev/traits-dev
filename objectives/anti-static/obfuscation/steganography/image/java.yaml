# Class-local co-occurrence supports investigation, not a source-to-sink claim.
defaults:
  platforms: [unix, windows]
  for: [class]
composite_rules:
  - id: obfuscated-png-archive-staging
    desc: Obfuscated class pairs PNG inflation, ZIP writes and process launch
    crit: suspicious
    conf: 0.94
    attack: T1027.003
    all:
      - id: micro-behaviors/data/embedded/payload/image::png-inflate-process-class
      - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file
    any:
      - id: objectives/anti-static/obfuscation/string/reconstruct::jvm-many-subtract-character-stores
      - id: objectives/anti-static/obfuscation/string/reconstruct::jvm-many-xor-character-stores
