# Image handling alone stays neutral. The independent loader and its own
# trust-all client establish the attack context for the PNG extraction class.
defaults:
  platforms: [unix, windows]
  for: [jar, zip, class, json]
composite_rules:
  - id: fabric-loader-png-inflate-stage
    desc: Fabric loader uses PNG extraction and inflation beside process launch
    crit: hostile
    conf: 0.97
    attack: T1027.003,T1195.002,T1105
    scope: archive
    all:
      - id: micro-behaviors/data/embedded/payload/image::png-inflate-process-class
      - id: objectives/supply-chain/trojanized/app/game-mod::fabric-mod-net-fabric-runnable-stager
      - id: objectives/evasion/security-bypass/tls::java-tls-client-own-trust-all-manager
