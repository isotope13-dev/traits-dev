defaults:
  platforms: [windows, unix]
  for: [png]
  mbc: B0032.001
  attack: T1027.003

composite_rules:
  - id: image-steganography-indicators
    desc: Image with steganography indicators
    crit: notable
    conf: 0.8
    size_min: 1048576
    all:
      - id: metadata/image/pixel::high-pixel-entropy
      - id: metadata/image/pixel::high-histogram-flatness
      - id: metadata/image/pixel::png-incompressible-pixels

  # All-RGB-channels-high is a building block for the strong composite, not a
  # standalone verdict: AI-generated art and many photographs naturally carry
  # near-maximal per-channel entropy.
  - id: all-channels-high
    desc: All RGB channels contain high entropy
    crit: component
    conf: 0.8
    size_min: 1048576
    all:
      - id: metadata/image/pixel::r-channel-high
      - id: metadata/image/pixel::g-channel-high
      - id: metadata/image/pixel::b-channel-high
      - id: metadata/image/pixel::png-incompressible-pixels

  # Structural evidence of a concealed payload is required in addition to the
  # statistical profile, which also occurs in benign generated artwork.
  - id: image-appended-payload
    desc: Image carries data past its terminator
    crit: notable
    conf: 0.85
    any:
      - id: metadata/image/trailing::jpeg-appended-data
      - id: metadata/image/trailing::png-chunks-after-iend

  - id: png-opaque-trailing-payload
    desc: PNG carries a large opaque trailing payload
    crit: hostile
    conf: 0.96
    attack: T1027.003,T1027.009
    size_min: 500000
    all:
      - id: metadata/binary/header/malformed::png-trailing-data
      - id: metadata/image/trailing::png-large-trailing-bytes
      - id: metadata/image/pixel::png-file-entropy-high

  - id: png-idat-encrypted-stowaway
    desc: PNG hides encrypted data after its zlib stream
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1027.009
    size_min: 131072
    all:
      - id: metadata/image/trailing::png-large-trailing-bytes
      - id: metadata/file/format/media::media-interior-hole
      - id: metadata/file/format/media::media-stowaway-high-entropy

  - id: image-steganography-strong
    desc: Image with strong steganography indicators
    crit: hostile
    conf: 0.95
    size_min: 1048576
    all:
      - id: image-steganography-indicators
      - id: all-channels-high
      - id: image-appended-payload
    any:
      - id: metadata/image/pixel::low-edge-density
      - id: metadata/image/pixel::png-incompressible-pixels
      - id: metadata/image/trailing::jpeg-appended-data
