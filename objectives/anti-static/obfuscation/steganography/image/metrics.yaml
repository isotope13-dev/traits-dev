defaults:
  platforms: [windows, unix]
  for: [png]
  mbc: B0032.001
  attack: T1027.003

composite_rules:
  # Whole-file entropy cannot evidence an opaque trailer: the IDAT stream is
  # compressed, so ordinary PNGs routinely score 7.9+ (benign controls up to
  # 7.996 against this sample's 7.9977). Opacity must be measured on the
  # actual trailing bytes themselves, not headers or entropy in other regions.
  # File size cannot turn an unexplained compressed suffix into an attack.
  - id: png-opaque-trailer
    desc: PNG has 64KiB+ high-entropy trailing data
    crit: suspicious
    conf: 0.96
    attack: T1027.003,T1027.009
    all:
      - id: metadata/image/trailing::png-trailing-data
      - id: metadata/image/trailing::png-large-trailing-bytes
      - id: metadata/file/format/media::media-trailer-high-entropy

  # High entropy alone also occurs in photographs and noise textures. Extra
  # chunks after the format terminator make this combination unusual enough
  # to investigate concealment without needing a decoded executable.
  - id: png-uniform-pixels-post-iend
    desc: Noise-like PNG pixels with post-IEND chunks
    crit: suspicious
    conf: 0.9
    size_min: 1048576
    all:
      - id: metadata/image/pixel::large-uniform-incompressible-png
      - id: metadata/image/pixel::large-high-entropy-rgb-png
      - id: metadata/image/trailing::png-chunks-after-iend

  # Unused IDAT bytes establish space that the pixel decoder ignores. The
  # coverage walk separately reports opaque unclaimed bytes; co-occurrence
  # supports investigating concealment, not claiming a particular cipher or
  # proving that the opaque bytes are precisely the unused IDAT range.
  - id: png-opaque-idat-stowaway
    desc: Unused PNG IDAT with opaque unclaimed data
    crit: suspicious
    conf: 0.95
    attack: T1027.003,T1027.009
    all:
      - id: metadata/image/trailing::png-large-unused-idat-data
      - id: metadata/file/format/media::media-interior-hole
      - id: metadata/file/format/media::media-stowaway-high-entropy
