# Code that walks image files and keeps the one whose final bytes carry a
# fixed marker. Image software reads a PNG up to IEND or a JPEG up to EOI; a
# marker past that point exists only because something was appended there.
defaults:
  platforms: [windows, linux, macos]
  for: [powershell, python, javascript, typescript]
  attack: T1027.003
  mbc: B0032.001

composite_rules:
  - id: image-search-trailer-marker-check
    desc: Searches images for an appended-data marker
    crit: suspicious
    conf: 0.92
    near_lines: 120
    all:
      - id: micro-behaviors/fs/search::search-image-extensions
    any:
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-seek-end-magic-compare
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-length-relative-magic-compare
      - id: micro-behaviors/data/embedded/payload/trailer::python-seek-end-magic-compare
      - id: micro-behaviors/data/embedded/payload/trailer::python-slice-tail-magic-compare
      - id: micro-behaviors/data/embedded/payload/trailer::javascript-slice-tail-magic-compare

  # The marker-tagged image is then evaluated, loaded, or unpacked: the
  # payload hidden behind the picture runs.
  - id: image-trailer-payload-execution
    desc: Executes data hidden after an image's end
    crit: hostile
    conf: 0.97
    attack: T1027.003,T1059
    all:
      - id: image-search-trailer-marker-check
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/process/create/launch::rundll32-exe-literal
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg

  # A launcher names an image URL and carries an encoded script that finds a
  # file by its footer marker and evaluates a slice of it: the image is the
  # payload carrier.
  - id: image-url-encoded-trailer-marker-eval
    desc: Encoded loader evaluates data appended to an image
    crit: hostile
    conf: 0.97
    for: [batch, python, javascript, typescript, rust, go, csharp]
    attack: T1027.003,T1059.001
    all:
      - id: micro-behaviors/communications/http/url/path::image-file-url
      - id: micro-behaviors/data/embedded/payload/trailer::encoded-powershell-seek-end-magic-compare
      - id: micro-behaviors/data/buffer/carve::encoded-powershell-file-range-to-string
