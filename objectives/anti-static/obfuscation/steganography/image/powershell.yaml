defaults:
  platforms: [windows]
  for: [data, powershell]
  attack: T1027.003
  mbc: B0032.001

traits:
  - id: powershell-getpixel-lsb-nibble
    desc: PowerShell pixel low-nibble extraction
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)g`?e`?t`?p`?i`?x`?e`?l.{0,220}-\s*band\s*15'
  - id: powershell-bytearray-pixel-buffer
    desc: PowerShell large pixel byte buffer
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)By.{0,24}te\[\].{0,80}2[0-9]{5}'
  - id: powershell-pixel-loop-bounds
    desc: PowerShell fixed pixel extraction loops
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '0\.\.4[0-9]{2}.{0,80}0\.\.4[0-9]{2}'
  - id: powershell-system-drawing-addtype
    desc: PowerShell System.Drawing load
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)Add-Type.{0,80}-AssemblyName\s+["'']?System\.Drawing\b'

composite_rules:
  # A single color plane can carry a complete script while the visible image
  # remains plausible. Requiring the recovered byte stream to reach a dynamic
  # ScriptBlock separates payload execution from ordinary channel processing.
  - id: powershell-red-channel-script-loader
    for: [powershell]
    desc: PowerShell executes a script reconstructed from bitmap red-channel bytes
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1059.001
    all:
      - id: micro-behaviors/data/encode/image/pixel::powershell-bitmap-red-byte-stream
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
    near_lines: 24

  - id: powershell-rgba-length-prefixed-payload-extraction
    for: [powershell]
    desc: PowerShell extracts a length-prefixed payload from bitmap RGBA channels
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/image/pixel::powershell-bitmap-rgba-byte-stream
      - id: micro-behaviors/data/buffer/carve::powershell-uint64-length-prefixed-file-carve
    near_lines: 40

  # Payload split across several images and rebuilt on disk: each carrier is
  # carved separately, then the fragments are concatenated into the final
  # binary (TerminalFix splits one DLL across two PNGs).
  - id: powershell-split-image-payload-reassembly
    for: [powershell]
    desc: Reassembles payload split across fragments
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-rgba-length-prefixed-payload-extraction
      - id: micro-behaviors/data/buffer/transfer::powershell-write-concat-byte-arrays
    near_lines: 40

  - id: powershell-image-lsb-payload-extraction
    desc: PowerShell image LSB payload extraction
    crit: hostile
    conf: 0.98
    all:
      - id: powershell-getpixel-lsb-nibble
      - id: powershell-pixel-loop-bounds
    any:
      - id: powershell-bytearray-pixel-buffer
      - id: powershell-system-drawing-addtype
      - id: micro-behaviors/communications/http/client/managed::webclient-openread-data
      - id: micro-behaviors/communications/http/client/managed::webrequest-create-data
