defaults:
  platforms: [windows]
  for: [data, powershell]
  attack: T1027.003
  mbc: B0032.001

traits:
  - id: powershell-getpixel-lsb-nibble
    desc: PowerShell pixel low-nibble extraction
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)g`?e`?t`?p`?i`?x`?e`?l.{0,220}-\s*band\s*15'
  - id: powershell-bytearray-pixel-buffer
    desc: PowerShell large pixel byte buffer
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)By.{0,24}te\[\].{0,80}2[0-9]{5}'
  - id: powershell-pixel-loop-bounds
    desc: PowerShell fixed pixel extraction loops
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '0\.\.4[0-9]{2}.{0,80}0\.\.4[0-9]{2}'
composite_rules:
  # A single color plane can carry a complete script while the visible image
  # remains plausible. Requiring the recovered byte stream to reach a dynamic
  # ScriptBlock separates payload execution from ordinary channel processing.
  - id: powershell-red-channel-script-loader
    for: [powershell]
    desc: PowerShell executes a script reconstructed from bitmap red-channel bytes
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1059.001
    all:
      - id: micro-behaviors/data/encode/image/pixel::powershell-bitmap-red-byte-stream
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
    near_lines: 24

  - id: powershell-rgba-length-prefixed-payload-extraction
    for: [powershell]
    desc: PowerShell extracts a length-prefixed payload from bitmap RGBA channels
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/image/pixel::powershell-bitmap-rgba-byte-stream
      - id: micro-behaviors/data/buffer/carve::powershell-int64-length-prefixed-file-carve
    near_lines: 40

  # Payload split across several images and rebuilt on disk: each carrier is
  # carved separately, then the fragments are concatenated into the final
  # binary (TerminalFix splits one DLL across two PNGs).
  - id: powershell-split-image-payload-reassembly
    for: [powershell]
    desc: Reassembles payload fragments from bitmap pixels
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-rgba-length-prefixed-payload-extraction
      - id: micro-behaviors/data/buffer/transfer::powershell-write-concat-byte-arrays
    near_lines: 40

  - id: powershell-image-lsb-payload-extraction
    desc: PowerShell image LSB payload extraction
    crit: hostile
    conf: 0.98
    all:
      - id: powershell-getpixel-lsb-nibble
      - id: powershell-pixel-loop-bounds
    any:
      - id: powershell-bytearray-pixel-buffer
      - id: micro-behaviors/ui/graphics/draw::ps-addtype-drawing-reference
      - id: micro-behaviors/communications/http/client/managed::webclient-openread-data
      - id: micro-behaviors/communications/http/client/managed::webrequest-create-data

  # A picture hosted on an image site is fetched as bytes, read as text, and the
  # span between two plain-text markers is Base64-decoded straight into
  # Assembly.Load. Image viewers ignore the appended text, so the carrier looks
  # like an ordinary photo. The loaded assembly is not seen, only its loading.
  - id: powershell-image-download-embedded-assembly-load
    for: [powershell]
    desc: PowerShell loads assembly hidden in image
    crit: hostile
    conf: 0.95
    attack: T1027.003,T1620
    mbc: B0032.001,E1620
    near_lines: 40
    all:
      - id: micro-behaviors/communications/url/resource-path/media::jpeg-png-gif-file-url
      - id: micro-behaviors/data/decode/charset::powershell-utf8-getstring
      - id: micro-behaviors/data/string/access::powershell-download-near-string-slice
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
