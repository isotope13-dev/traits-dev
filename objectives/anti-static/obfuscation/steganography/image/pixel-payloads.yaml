defaults:
  platforms: [windows, unix]
  for: [png]
  attack: T1027.003
  mbc: B0032.001
  conf: 0.98

traits:
  # Shell recognition can accept random pixel gradients as a shebang.
  # Require an actual absolute interpreter path for that candidate kind.
  - id: png-pixel-non-shell-script
    desc: PNG pixels yield script candidate
    crit: notable
    if:
      type: value
      path: png.pixel_payloads[*].kind
      regex: '^(powershell|python|javascript)$'

  - id: png-pixel-script-function
    desc: PNG preview contains function declaration
    crit: notable
    if:
      type: value
      path: png.pixel_payloads[*].preview
      regex: '(?i)\b(def|function)\s+[a-z_][a-z0-9_]*\s*\('

  - id: png-pixel-script-import
    desc: PNG preview contains import syntax
    crit: notable
    if:
      type: value
      path: png.pixel_payloads[*].preview
      regex: '\b(import|from)\s+[a-z_]'

  - id: png-pixel-script-invoke
    desc: PNG preview contains expression execution
    crit: notable
    if:
      type: value
      path: png.pixel_payloads[*].preview
      regex: '(?i)\b(invoke-expression|iex)\s*\('

  - id: png-pixel-archive
    desc: ZIP archive reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      exact: zip

  - id: png-pixel-json
    desc: JSON data reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      exact: json

  - id: png-pixel-url
    desc: HTTP URL reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      exact: url

  - id: png-pixel-executable-header
    desc: Executable header reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      regex: '^(pe-header|elf-header)$'

composite_rules:
  - id: png-pixel-recognized-script
    desc: PNG pixel script candidate has recognizable syntax
    crit: notable
    all:
      - id: png-pixel-non-shell-script
    any:
      - id: png-pixel-script-function
      - id: png-pixel-script-import
      - id: png-pixel-script-invoke

  - id: png-pixel-script
    desc: Script text reconstructed from PNG pixels
    crit: suspicious
    all:
      - id: metadata/image/pixel::png-reconstructed-pixel-payload
    any:
      - id: png-pixel-recognized-script
      - id: metadata/image/pixel::png-pixel-interpreter-header

  - id: png-pixel-executable
    desc: PNG pixels conceal a parsed PE/ELF image
    # A complete program proves concealment, not malicious behavior. Benign
    # steganography fixtures can carry a loadable ELF that only exits.
    crit: suspicious
    all:
      - id: metadata/image/pixel::png-reconstructed-pixel-payload
      - id: metadata/image/pixel::png-pixel-program-image
