defaults:
  platforms: [windows, unix]
  for: [png]
  attack: T1027.003
  mbc: B0032.001
  conf: 0.98

traits:
  - id: png-pixel-script
    desc: Script text reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      regex: '^(shell|powershell|python|javascript)$'

  - id: png-pixel-archive
    desc: ZIP archive reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      exact: zip

  - id: png-pixel-json
    desc: JSON data reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      exact: json

  - id: png-pixel-url
    desc: HTTP URL reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      exact: url

  - id: png-pixel-executable-header
    desc: Executable header reconstructed from PNG pixels
    crit: suspicious
    if:
      type: value
      path: png.pixel_payloads[*].kind
      regex: '^(pe-header|elf-header)$'

composite_rules:
  - id: png-pixel-executable
    desc: PNG pixels conceal a parsed PE/ELF image
    crit: hostile
    all:
      - id: metadata/image/pixel::png-reconstructed-pixel-payload
      - id: metadata/image/pixel::png-pixel-program-image
