# LSB embedding of a byte stream into image pixels: clear each carrier byte's
# low bit, then shift the secret byte. This is the bitmap key-hiding idiom
# used by Conti-inspired lockers (seek to the BMP pixel array, then spread an
# encrypted session key across those LSBs). The mask-and-shift pair is the
# mechanic; intent comes from the ransom composite that requires key wrapping
# and file encryption beside it.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, python, go, rust, powershell]
  attack: T1027.003
  mbc: B0032.001

traits:
  - id: bmp-lsb-bit-spread
    desc: Spreads secret bits into image-byte LSBs
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?s)(&=\s*0xFE\b|&\s*0xFE\b).{0,220}>>=?\s*1\b'
