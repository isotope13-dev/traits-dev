defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # RGB getter-to-collection IL plus the sized byte-helper-to-late-dispatch
  # cast distinguishes executable pixel reconstruction from UI artwork and
  # unrelated reflection. No resource name, byte count, or lure name is fixed.
  - id: vb-rgb-concealed-assembly
    desc: RGB bitmap bytes conceal a late-bound assembly
    crit: hostile
    conf: 0.98
    attack: T1027.003
    all:
      - id: dotnet-red-channel-byte-collection
      - id: micro-behaviors/data/control-flow/sequence::cil-sized-helper-array-lateget-cast
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-lateget-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::getdomain-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
