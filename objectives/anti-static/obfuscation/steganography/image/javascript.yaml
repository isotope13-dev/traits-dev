# JavaScript image-carrier stages. Pixel reconstruction and appended PNG-tail
# extraction are separate techniques, sharing this steganography objective.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.003,T1059.007
  mbc: B0032.001

composite_rules:
  - id: javascript-image-pixel-payload
    desc: JavaScript retrieves an image and reconstructs bytes from its pixels
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
      - id: micro-behaviors/data/encode/image/pixel::canvas-image-byte-reconstruction
    near_bytes: 2048
    unless:
      - id: micro-behaviors/data/encode/image/pixel::heightbake-texture-marker
  - id: javascript-image-pixel-payload-execution
    desc: JavaScript extracts a pixel-hidden payload and executes it
    crit: hostile
    conf: 0.98
    all:
      - id: javascript-image-pixel-payload
    any:
      - id: micro-behaviors/process/interpreter/eval/
      - id: objectives/execution/interpreter/eval/remote/
      - id: micro-behaviors/process/interpreter/vm::vm-runInContext-call
    near_bytes: 2048
  - id: javascript-image-pixel-local-helper-exploit
    desc: Pixel-hidden browser stage drives a loopback WebSocket helper
    crit: hostile
    conf: 0.98
    all:
      - id: javascript-image-pixel-payload
      - id: micro-behaviors/communications/http/websocket::loopback-websocket-endpoint
    near_bytes: 2048

  - id: javascript-png-tail-aes-exe-dropper
    desc: JavaScript decrypts appended PNG data into executable
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1140
    near_lines: 80
    all:
      - id: micro-behaviors/data/format/media/raster::source-png-iend-byte-prefix
      - id: micro-behaviors/data/buffer/carve::javascript-slice-after-indexed-marker
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    unless:
      - id: metadata/package/testing/
