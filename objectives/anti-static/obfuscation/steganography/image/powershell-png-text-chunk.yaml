# A PNG decoder ignores tEXt chunk contents, so a script that downloads a
# picture and walks its chunk list for tEXt records is pulling hidden data out
# of the file rather than rendering it. The recovered text is then decoded and
# compiled or run.
defaults:
  platforms: [windows]
  for: [powershell, text]
  attack: T1027.003
  mbc: B0032.001

traits:
  - id: png-chunk-type-text-compare
    desc: PowerShell checks for PNG tEXt chunk type
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)-eq\s+.tEXt.'
  - id: png-chunk-type-iend-compare
    desc: PowerShell checks for PNG IEND chunk type
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)-eq\s+.IEND.'

composite_rules:
  - id: png-text-chunk-walk
    desc: PowerShell walks PNG chunks looking for tEXt records
    crit: notable
    conf: 0.92
    near_lines: 30
    all:
      - id: png-chunk-type-text-compare
      - id: png-chunk-type-iend-compare

  - id: downloaded-png-text-chunk-reader
    desc: Downloads bytes and extracts PNG tEXt chunk records
    crit: suspicious
    conf: 0.95
    near_lines: 40
    all:
      - id: png-text-chunk-walk
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data

  - id: downloaded-png-text-chunk-payload-run
    desc: Runs code recovered from a downloaded PNG's tEXt chunks
    crit: hostile
    conf: 0.97
    attack: T1027.003,T1105,T1059.001
    all:
      - id: downloaded-png-text-chunk-reader
    any:
      - id: micro-behaviors/metaprogramming/generation/compile::powershell-add-type
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
