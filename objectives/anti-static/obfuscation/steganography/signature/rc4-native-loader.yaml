defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  # Certificate-table data is transformed and entered as native code, rather
  # than verified as signature material. The bound RX-buffer call distinguishes
  # this from certificate readers and ordinary cryptographic software.
  - id: rc4-security-table-code-loader
    desc: RC4 code loader using PE certificate-table data
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1620
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/inject/runtime/call::x64-security-directory-rx-buffer-call
      - id: micro-behaviors/crypto/symmetric/stream/rc4::x64-stack-byte-wrapped-prga
