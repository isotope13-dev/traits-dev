# Decoded batch chunks must contain image parsing, RGB low-bit extraction,
# native memory copying, and native-buffer thread execution, as well as the
# outer batch's base64 evaluator. Ordinary encoded Python bootstrap code lacks
# this admission. File scope joins chunks from the same batch only.
defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-python-image-low-bit-native-payload
    desc: Python image low-bit extraction with native-memory execution APIs
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1620
    all:
      - id: micro-behaviors/data/format/media/raster::encoded-python-pillow-open
      - id: micro-behaviors/data/arithmetic::encoded-python-rgb-low-bit-append
      - id: micro-behaviors/mem/copy::encoded-python-ctypes-memmove
      - id: micro-behaviors/process/create/thread::encoded-python-create-thread-call
      - id: micro-behaviors/process/interpreter/eval/direct::batch-python-base64-exec
