defaults:
  for: [php]
  platforms: [unix, windows]
  attack: T1027.003

composite_rules:
  - id: php-pixel-low-bit-byte-reconstruction
    desc: PHP pixel reads near low-bit masking and byte reconstruction
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/ui/graphics/image::php-imagecolorat-call
      - id: micro-behaviors/data/bitwise/mixed::source-low-bit-mask
      - id: micro-behaviors/data/string/conversion::chr-call
