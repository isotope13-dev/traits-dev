composite_rules:
  - id: png-pixel-shell-downloader-launcher
    desc: PNG pixels conceal shell downloader and launcher
    crit: hostile
    for: [png]
    platforms: [unix]
    attack: T1027.003,T1105,T1059.004
    all:
      - id: metadata/image/pixel::png-lsb-payload-layout
      - id: metadata/image/pixel::png-pixel-interpreter-header
      - id: micro-behaviors/communications/http/download/curl::png-pixel-curl-output
      - id: micro-behaviors/fs/chmod/executable/mode::png-pixel-executable-chmod
      - id: micro-behaviors/process/daemonize/background::png-pixel-nohup-command
