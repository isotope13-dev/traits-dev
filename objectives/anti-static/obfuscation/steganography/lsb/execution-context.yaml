# Image low-bit payload extraction bound to staging and process creation.
# Each rule requires evidence that the masked bits come from image data (a
# pixel-read API or an inlined PNG literal), that the recovered bytes are
# decoded, written or made executable, and that a process is launched -- all
# inside one routine-sized window. Concealing an executable stage in image low
# bits and then running it has no legitimate use.
defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1027.003
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: png-lsb-executable-loader
  desc: Runs a payload extracted from image pixel low bits
  crit: hostile
  conf: 0.99
  near_bytes: 12288
  all:
  - id: micro-behaviors/data/arithmetic::lsb-bit-mask-source
  - id: micro-behaviors/process/create/exec::child-process-execution
  - id: micro-behaviors/data/encode/image/pixel/
  any:
  - id: micro-behaviors/data/decode/base64/
  - id: "micro-behaviors/data/decompress/aplib/"
  - id: "micro-behaviors/data/decompress/brotli/"
  - id: "micro-behaviors/data/decompress/bzip2/"
  - id: "micro-behaviors/data/decompress/lz4/"
  - id: "micro-behaviors/data/decompress/stream/"
  - id: "micro-behaviors/data/decompress/zlib/"
  - id: "micro-behaviors/data/decompress/combined::base64-compressed-transform"
  - id: "micro-behaviors/data/decompress/combined::decompress-decoded-to-text"
  - id: "micro-behaviors/data/decompress/combined::php-compressed-base64-decode"
  - id: "micro-behaviors/data/decompress/combined::script-decompress-call"
  - id: "micro-behaviors/data/decompress/gzip::go-gzip-reader"
  - id: "micro-behaviors/data/decompress/gzip::gzdecode-call"
  - id: "micro-behaviors/data/decompress/gzip::gzip-byte-array-input-source"
  - id: "micro-behaviors/data/decompress/gzip::gzip-decompress"
  - id: "micro-behaviors/data/decompress/gzip::gzip-decompress-call"
  - id: "micro-behaviors/data/decompress/gzip::gzip-decompression-stream"
  - id: "micro-behaviors/data/decompress/gzip::gzip-inputstream"
  - id: "micro-behaviors/data/codec::gzip-read-operation"
  - id: "micro-behaviors/data/decompress/gzip::node-gunzip-function"
  - id: "micro-behaviors/data/decompress/gzip::node-gzip-functions"
  - id: "micro-behaviors/data/decompress/gzip::wsh-gzipstream-reference"
  - id: "micro-behaviors/data/decompress/lzma::lzma-decompressor-call"
  - id: "micro-behaviors/data/decompress/lzma::lzstring-utf16-decompress"
  - id: "micro-behaviors/data/decompress/zstd::zstd-decompress"
  - id: micro-behaviors/fs/write/file/full/
  - id: micro-behaviors/fs/chmod/modify/
- id: embedded-image-lsb-drop-executor
  desc: Drops and runs a payload hidden in an inlined PNG's low bits
  crit: hostile
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/payload/image::embedded-png-source-literal
  - id: micro-behaviors/data/arithmetic::lsb-bit-mask-source
  - id: "micro-behaviors/process/create"
  any:
  - id: micro-behaviors/fs/write/
  - id: micro-behaviors/fs/chmod/
  - id: micro-behaviors/fs/path/temp/
  unless:
  - id: micro-behaviors/os/package-manager/installer-script::appimagetool-build-command
# Compiled JVM loaders carry no source literal: the pixel read is the
# getRGB call, the reassembled bytes collect in a ByteArrayOutputStream, are
# base64-decoded, written with Files.write and executed.
- id: jvm-png-pixel-executable-loader
  desc: JVM loader writes and runs a payload decoded from image pixels
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1059
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/data/encode/image/pixel::jvm-buffered-image-getrgb-call
  - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
  - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
  - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
  - id: micro-behaviors/process/create/exec::child-process-execution

