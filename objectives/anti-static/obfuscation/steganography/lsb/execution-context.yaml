defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1027.003
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: csharp-pixel-low-bit-file-execution
  desc: Pixel low-bit packing near same-path write and start
  crit: suspicious
  conf: 0.99
  for:
  - csharp
  near_bytes: 12288
  all:
  - id: micro-behaviors/data/bitwise::source-shift-or-low-bit
  - id: micro-behaviors/ui/graphics/image::getpixel-api-name
  - id: micro-behaviors/process/deploy/file-exec/spawn::csharp-writeallbytes-start-same-path
- id: powershell-pixel-low-bit-file-execution
  desc: PowerShell pixel low-bit reconstruction with write and launch
  crit: hostile
  conf: 0.99
  for:
  - powershell
  platforms:
  - windows
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/bitwise::powershell-shift-or-low-bit
  - id: micro-behaviors/data/encode/image/pixel::powershell-bitmap-getpixel-call
  - id: metadata/file/profile/file-write-api::write-all-bytes
  - id: micro-behaviors/process/create/exec::start-process-call
- id: embedded-image-lsb-drop-executor
  desc: Drops and runs a payload hidden in an inlined PNG's low bits
  crit: hostile
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/payload/image::embedded-png-source-literal
  - id: micro-behaviors/data/bitwise::source-low-bit-mask
  - id: micro-behaviors/process/create
  any:
  - id: micro-behaviors/fs/write
  - id: micro-behaviors/fs/chmod/
  - id: micro-behaviors/fs/path/temp/
  - id: micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path
  - id: micro-behaviors/fs/path/hidden::hidden-tmp-file-cluster
  - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
  - id: micro-behaviors/fs/path/hidden::native-hidden-numeric-file-template
  - id: micro-behaviors/fs/path/hidden::var-tmp-hidden
  - id: micro-behaviors/fs/path/hidden::dev-shm-hidden-path
  - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
  - id: micro-behaviors/fs/path/hidden::swift-hidden-system-logs-path-reference
  - id: micro-behaviors/fs/path/hidden::node-tmpdir-hidden-entry-reference
  - id: micro-behaviors/fs/path/hidden::android-hidden-local-tmp-dotfile
  - id: micro-behaviors/fs/path/personal::windows-public-path
  unless:
  - id: micro-behaviors/os/package-manager/installer-script::appimagetool-build-command
- id: jvm-png-pixel-executable-loader
  desc: JVM loader writes and runs a payload decoded from image pixels
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1059
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/ui/graphics/image::jvm-buffered-image-getrgb-call
  - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
  - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
  - id: metadata/file/profile/file-write-api::jvm-files-write-bytecode
  - id: micro-behaviors/process/create/exec::child-process-execution
