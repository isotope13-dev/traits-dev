# Image low-bit extraction indicators beside staging and process creation.
# Source examples can demonstrate these operations without an attack. The C#
# matcher binds the saved path to the launched path, but correlates the pixel
# read and packing only by proximity. It does not bind pixel-derived bytes to
# that save or establish an attacker-supplied image. Retain the concealment
# lead without claiming this co-occurrence establishes hostile execution.
defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1027.003
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
# C# requires an actual pixel API and an adjacent save/start of the same path.
# PowerShell requires its pixel read, one-bit reassembly, byte write and launch.
- id: csharp-pixel-low-bit-file-execution
  desc: Pixel low-bit packing near same-path write and start
  crit: suspicious
  conf: 0.99
  for: [csharp]
  near_bytes: 12288
  all:
  - id: micro-behaviors/data/arithmetic::source-shift-or-low-bit
  - id: micro-behaviors/ui/graphics/image::getpixel-api-name
  - id: micro-behaviors/process/deploy/file-exec::csharp-writeallbytes-start-same-path
- id: powershell-pixel-low-bit-file-execution
  desc: PowerShell pixel low-bit reconstruction with write and launch
  crit: hostile
  conf: 0.99
  for: [powershell]
  platforms: [windows]
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/arithmetic::powershell-shift-or-low-bit
  - id: micro-behaviors/data/encode/image/pixel::powershell-bitmap-getpixel-call
  - id: micro-behaviors/fs/write/file/full::write-all-bytes
  - id: micro-behaviors/process/create/exec::start-process-call
- id: embedded-image-lsb-drop-executor
  desc: Drops and runs a payload hidden in an inlined PNG's low bits
  crit: hostile
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/payload/image::embedded-png-source-literal
  - id: micro-behaviors/data/arithmetic::source-low-bit-mask
  - id: "micro-behaviors/process/create"
  any:
  - id: micro-behaviors/fs/write/
  - id: micro-behaviors/fs/chmod/
  - id: micro-behaviors/fs/path/temp/
  - id: micro-behaviors/fs/path/personal::windows-public-path
  unless:
  - id: "micro-behaviors/os/package-manager/installer-script::appimagetool-build-command"
# Compiled JVM loaders carry no source literal: the pixel read is the
# getRGB call, the reassembled bytes collect in a ByteArrayOutputStream, are
# base64-decoded, written with Files.write and executed.
- id: jvm-png-pixel-executable-loader
  desc: JVM loader writes and runs a payload decoded from image pixels
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1059
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/ui/graphics/image::jvm-buffered-image-getrgb-call
  - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
  - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
  - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
  - id: micro-behaviors/process/create/exec::child-process-execution

