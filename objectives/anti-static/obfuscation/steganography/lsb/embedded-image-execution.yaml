defaults:
  for: [zig]
  platforms: [unix, windows]
composite_rules:
  - id: embedded-png-low-bit-executable-launch
    desc: PNG low-bit extraction with executable launch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/image::png-magic-base64-literal
      - id: micro-behaviors/data/bitwise::source-shift-or-low-bit
      - id: micro-behaviors/data/decode/base64::zig-standard-base64-decode-call
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
      - id: micro-behaviors/data/buffer/transfer::source-write-all-helper-reference
      - id: metadata/lang/source/syntax/member::zig-child-init
      - id: micro-behaviors/fs/chmod/executable/mode::zig-create-owner-executable-file
      - id: metadata/lang/source/syntax/call/invocation::zig-child-spawn-call-text
