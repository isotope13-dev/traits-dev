defaults:
  platforms: [linux, macos, windows]
  for: [javascript]

traits:
  - id: js-numeric-sine-square-obfuscation
    desc: Numeric sine-square obfuscation expression
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # Geometry/rendering code commonly uses Math.pow(Math.sin(variable), 2)
      # inside ellipse and arc calculations.  The obfuscation form uses fixed
      # numeric inputs repeatedly as opaque arithmetic; require that shape so
      # ordinary trigonometry does not become an anti-static finding.
      regex: 'Math\.pow\(\s*Math\.sin\(\s*(0x[\da-fA-F]+|\d+(\.\d+)?)\s*\),\s*2\)'
  - id: js-numeric-trig-round-obfuscation
    desc: Numeric trig-round obfuscation expression
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'Math\.round\(\s*\(Math\.pow\(\s*Math\.sin\(\s*(0x[\da-fA-F]+|\d+(\.\d+)?)'
