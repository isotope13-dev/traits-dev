defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.8
  for:
  - javascript

traits:
  - id: js-obfuscated-increment
    desc: Repeated negative-plus arithmetic expressions
    crit: notable
    conf: 0.8
    # Repeated expressions may appear in obfuscated code, but arithmetic
    # alone does not establish an increment, decrement, or obfuscation.
    count_min: 2
    if:
      type: text
      regex: '\(-\d\s*\+\s*\d+\)'
