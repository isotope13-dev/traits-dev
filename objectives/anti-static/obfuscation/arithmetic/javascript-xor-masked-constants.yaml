# Obfuscators rewrite each integer constant as the XOR of two random literals
# (`907388^907539` is 367). Compilers and minifiers fold constant
# expressions, so a dozen literal-literal XORs indicate constant concealment
# rather than bit manipulation. Hex constants (crypto tables) do not match.
# Masking alone hides values, not behavior; loader composites supply intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
traits:
  - id: js-xor-masked-integer-literals
    desc: Integers written as XOR of two literals
    crit: notable
    conf: 0.93
    count_min: 12
    if:
      type: text
      exclude_comments: true
      regex: '\b[1-9]\d{4,6}\s*\^\s*[1-9]\d{4,6}\b'
