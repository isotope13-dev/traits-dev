defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.002,T1059.007

composite_rules:
  - id: obfuscator-wrapped-bytecode-vm-dynamic-exec
    desc: Obfuscator-wrapped bytecode shard VM executes dynamic functions
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/multi-layer::js-base64-shard-array
      - id: micro-behaviors/data/control-flow/loop::js-while-switch-loop
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
      - id: metadata/import/builtin::require-child-process
