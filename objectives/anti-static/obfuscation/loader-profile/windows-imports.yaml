defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: sparse-kernel32-loader-profile
    desc: Sparse KERNEL32 loader profile
    crit: suspicious
    conf: 0.91
    size_max: 10485760
    all:
      - id: metadata/binary/symbols/imports::pe-single-import-dll
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: metadata/binary/symbols/exports::no-exports
      - id: micro-behaviors/dylib/lookup::get-module-handle-ex
      - id: metadata/binary/resource/size::minimal-resources
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: metadata/binary/debug::doexeloc-pdb-basename
    needs: 3
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/signed/trust-level::signer-evidence-present
        - id: metadata/binary/framework/
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/game/mod/
      # A loader stub is sparse in code as well as imports. A statically linked
      # library (MSVC CRT pulling in LoadLibraryExW, GetProcAddress and
      # GetModuleHandleExW) carries a code section of 128 KB or more.
      - id: metadata/binary/section/size::text-section-over-128kb
