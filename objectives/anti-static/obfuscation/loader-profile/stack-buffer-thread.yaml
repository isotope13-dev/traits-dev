defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
  mbc: B0033

composite_rules:
  - id: stack-obfuscated-buffer-thread
    desc: Stack-obfuscated PE with buffer thread-start code
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/mem/protect/modify/api-reference::integer-loads-protection-thread-apis
      - id: objectives/anti-static/obfuscation/string/stack::stack-string-obfuscated-pe
    any:
      - id: micro-behaviors/process/thread/create::create-thread-buffer-resolved-x64
      - id: micro-behaviors/process/thread/create::create-thread-buffer-resolved-x64-stack-args
      - id: micro-behaviors/process/thread/create::create-thread-buffer-import-x64-stack-args
