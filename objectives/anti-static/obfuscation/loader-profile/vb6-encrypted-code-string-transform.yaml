# VB6 string-building helpers are normal; a VB6 program whose code section
# is also high-entropy with long null runs keeps its logic encrypted and
# rebuilds its strings at run time.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1140
composite_rules:
  - id: vb6-high-entropy-code-with-string-transformation
    desc: High-entropy VB6 code with run-time string rebuild
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/lang/runtime::vb6-application-framework
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: micro-behaviors/data/string/runtime::vb6-ordinal-string-transformation
      - id: metadata/binary/code/density::null-runs-in-code-section
    unless:
      # UPX1 is compressed and UPX0 is a null virtual section. That layout
      # is the packer, not VB6 code that stays encrypted at rest.
      - id: well-known/dual-use/packaging/upx::upx-x86-pe-entry-stub
  - id: vb6-pcode-rc4-self-read-api-trampoline
    desc: VB6 p-code decrypts self-read config for APIs
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/runtime::vb6-application-framework
      - id: micro-behaviors/fs/read/file/handle::vb6-pcode-binary-record-read
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-ksa-swap-loop-vb6-pcode
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-prga-xor-loop-vb6-pcode
      - id: objectives/anti-static/obfuscation/imports/concealment::vb6-pcode-callwindowproc-api-trampoline
      - id: micro-behaviors/process/enumerate/snapshot::vb6-windowproc-process-api-profile
    any:
      - id: micro-behaviors/data/string/runtime::vb6-ordinal-string-transformation
      - id: micro-behaviors/data/string/runtime::vb6-runtime-string-decoding
      - id: micro-behaviors/data/string/assembly::vb6-pcode-liti4-chr-concat-chain
    unless:
      - id: metadata/lang/runtime::vb6-runtime-library
      - id: metadata/installer/product/
