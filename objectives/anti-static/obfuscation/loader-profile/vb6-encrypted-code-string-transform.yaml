# VB6 string-building helpers are normal; a VB6 program whose code section
# is also high-entropy with long null runs keeps its logic encrypted and
# rebuilds its strings at run time.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1140
composite_rules:
  - id: vb6-high-entropy-code-with-string-transformation
    desc: High-entropy VB6 code with run-time string rebuild
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: micro-behaviors/data/string/runtime::vb6-ordinal-string-transformation
      - id: metadata/binary/code/density::null-runs-in-code-section
    unless:
      - id: metadata/signed/platform/
      # UPX1 is compressed and UPX0 is a null virtual section. That layout
      # is the packer, not VB6 code that stays encrypted at rest.
      - id: well-known/dual-use/packaging/upx::upx-x86-pe-entry-stub
