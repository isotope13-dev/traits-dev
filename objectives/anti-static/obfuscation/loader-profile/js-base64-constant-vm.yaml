# A switch interpreter with an encoded constant population and a runtime
# fetch bridge hides the source-level operations. This stays suspicious;
# the constant names do not prove that an opcode actually executes them.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: base64-constant-switch-runtime
    desc: Encoded constants accompany switch runtime
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/encoding/shape::multi-base64-string-candidates
      - id: micro-behaviors/data/control-flow/branch::js-while-switch-loop
      - id: micro-behaviors/communications/http/module/load::node-runtime-fetch-api-exposure
      - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-table
  - id: base64-vm-analysis-checks
    desc: Concealed VM contains analysis-check constants
    crit: suspicious
    conf: 0.98
    all:
      - id: base64-constant-switch-runtime
      - id: metadata/lang/source/naming/interface/encoded::base64-analysis-tool-constant-names
  - id: base64-vm-hidden-file-stage
    desc: Concealed VM has hidden file-stage constants
    crit: suspicious
    conf: 0.97
    all:
      - id: base64-constant-switch-runtime
      - id: metadata/lang/source/naming/interface/encoded::base64-hidden-file-stage-constant-names
  # Sandbox and analysis-tool checks plus a file write and detached hidden
  # launch inside one concealed interpreter describe an evasive loader. Each
  # constant set is separate evidence; neither alone proves a payload runs.
  - id: concealed-vm-evasive-file-stage
    desc: Concealed VM checks for analysis then stages a hidden file
    crit: hostile
    conf: 0.97
    attack: T1497,T1105,T1027
    all:
      - id: base64-vm-analysis-checks
      - id: base64-vm-hidden-file-stage
