composite_rules:
  # VB6 programs import only the runtime, so the import list proves nothing.
  # What stands out is a code section inflated past 1 MiB that is mostly
  # filler around a small opaque blob, in a binary that also carries a
  # self-issued publisher signature or arrived as a misplaced archive member.
  - id: vb6-inflated-stub-fake-signed
    desc: VB6 exe padded past 1 MiB with a self-issued signature
    crit: hostile
    conf: 0.9
    attack: T1027.001,T1027.002,T1553.002
    platforms: [windows]
    for: [pe]
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/section/entropy::large-low-entropy-code-section
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
