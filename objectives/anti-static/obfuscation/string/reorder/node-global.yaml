# Permutation loaders decode their source with a character-swap shuffle and
# give the decoded program Node's module loader. The readable form assigns
# `require` to a global property; compiled releases instead pass `global` and
# `require` into an IIFE that stores them under decoded keys.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: global-require-permutation-obfuscation
    desc: Character permutation with global require access
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: micro-behaviors/data/string/reorder::char-array-swap-and-join
    any:
      - id: micro-behaviors/data/property/assign::js-global-require-alias
      - id: micro-behaviors/data/control-flow/global::node-global-and-require-call-arguments

  # Off-screen placement or arithmetic-masked constants conceal the loader
  # itself, not just its payload. The decoded program is not visible to
  # cleave, so this does not establish its purpose.
  - id: concealed-permutation-loader-require-handoff
    desc: Concealed permutation loader receives Node require
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.007,T1564
    all:
      - id: global-require-permutation-obfuscation
      - id: metadata/lang/source/literal/string/population::javascript-string-at-least-two-kib
    any:
      - id: metadata/file/line::source-code-after-horizontal-padding
      - id: objectives/anti-static/obfuscation/arithmetic::js-xor-masked-integer-literals
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
