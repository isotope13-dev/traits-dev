# Unrotated self-redefining string-array obfuscation: a helper returns a static
# string table and redefines itself on first call, while an offset-subtracting
# wrapper indexes into it across computed property calls.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  conf: 0.94

traits:
  - id: js-self-redefining-string-array
    desc: Self-redefining JS string-array function
    crit: notable
    if:
      type: text
      regex: '\];\s*(return\s+)?[\w$]+\s*=\s*function\s*\(\)\s*\{\s*return\s+[\w$]+\s*;?\s*\}[;,]'

  - id: js-string-array-index-accessor
    desc: Subtracts offset to index string table
    crit: notable
    if:
      type: text
      regex: 'return\s+[\w$]+\s*=\s*[\w$]+\s*-\s*(0x[0-9a-fA-F]+|\d+)\s*,\s*[\w$]+\(\)\[[\w$]+\]'

composite_rules:
  - id: js-unrotated-string-array-obfuscation
    desc: Self-redefining string array hides computed calls
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    mbc: B0032
    for: [javascript]
    all:
      - id: js-self-redefining-string-array
      - id: js-string-array-index-accessor
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-numeric-indexed-computed-call
