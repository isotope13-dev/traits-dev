# API and module names stored with deliberate typos and repaired in memory
# before use: `ternel32` becomes kernel32 and `VtttvvvAlloc` becomes
# VirtualAlloc, so neither name appears in the file for a scanner to match.
# A misspelled module name is only useful if code patches it. Seen in the
# 2018 Dofoil/Smoke Loader crypter (MediaGet update hijack).
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1106

traits:
  - id: mangled-kernel32-module-name
    desc: kernel32 name with its first letter swapped
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '^[a-jl-zA-JL-Z]ernel32(\.dll)?$'
  - id: alloc-protect-api-name-shape
    desc: Seven-letter stem plus Alloc or Protect name
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '^[A-Z][a-z]{6}(Alloc|Protect)$'

composite_rules:
  - id: runtime-repaired-api-stub
    desc: Misspelled kernel32 and memory-API names repaired before lookup
    crit: hostile
    conf: 0.93
    all:
      - id: mangled-kernel32-module-name
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: alloc-protect-api-name-shape
