defaults:
  platforms: [windows]
traits:
  - id: iex-backtick-obfuscated
    desc: Backtick-obfuscated IEX alias
    crit: suspicious
    conf: 0.9
    for: [powershell]
    attack: T1027
    mbc: E1027
    if:
      type: text
      substr: "I`E`X"
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/package/documentation/agent-safety::security-example-documentation
