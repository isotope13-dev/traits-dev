defaults:
  platforms: [windows]
  for: [powershell, csharp]
  attack: T1027
  mbc: B0032
traits:
  - id: dotnet-windows-namespace-split
    desc: System.Windows namespace split via concat
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](System\.)?Wind["'']\s*\+\s*["'']ows(\.Forms)?["'']'
  - id: dotnet-processstartinfo-split
    desc: ProcessStartInfo split via concatenation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](System\.Diagnostics\.)?Process["'']\s*\+\s*["'']StartInfo["'']'
  - id: dotnet-diagnostics-namespace-split
    desc: System.Diagnostics split via concat
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](System\.)?Diag["'']\s*\+\s*["'']nostics["'']'
  - id: dotnet-cryptography-namespace-split
    desc: Cryptography namespace split via concat
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](System\.)?Security\.Crypto["'']\s*\+\s*["'']graphy["'']'
  - id: dotnet-io-file-split
    desc: System.IO.File split via concatenation
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']System\.I["'']\s*\+\s*["'']O\.File["'']'
composite_rules:
  - id: dotnet-type-name-concat-evasion
    desc: Multiple .NET type names split via string concatenation
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: dotnet-windows-namespace-split
      - id: dotnet-processstartinfo-split
      - id: dotnet-diagnostics-namespace-split
      - id: dotnet-cryptography-namespace-split
      - id: dotnet-io-file-split
