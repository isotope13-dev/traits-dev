# Windows API names deliberately truncated in script source so the complete
# API string never appears in the file.  The classic form declares the P/Invoke
# with the tail supplied by a variable (`VirtualProtec$c`) and calls it through
# a format-string reassembly (`('{0}{1}' -f $replace,$c)`), leaving only the
# stem in the bytes on disk.  A bare `VirtualProtec` stem never occurs in code
# that simply uses the API, so the truncation itself is the signal.
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs]
  crit: suspicious
  attack: T1027
traits:
  - id: truncated-virtualprotect-name
    desc: VirtualProtect name truncated mid-word
    conf: 0.88
    if:
      type: text
      word: VirtualProtec
