defaults:
  platforms: [windows]
  for: [powershell, text]
  crit: suspicious
  attack: T1027.010

traits:
  # All three internal split points, independent of type or variable names.
  - id: powershell-fragmented-static-load
    desc: Constructs a split static Load invocation
    conf: 0.98
    if:
      type: text
      regex: '(?i)\]::(l["'']\s*\+\s*["'']oad|lo["'']\s*\+\s*["'']ad|loa["'']\s*\+\s*["'']d)\('
