defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0032
  attack: T1027
traits:
- id: single-quoted-bitwise-string
  desc: Single-quoted bitwise string synthesis
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: (?m)(^|[;{}])[\t ]*\$\w+\s*=\s*\(?\s*'[^'\r\n]{1,24}'\s*[\^\|&]\s*'[^'\r\n]{1,24}'
- id: double-quoted-bitwise-string
  desc: Double-quoted bitwise string synthesis
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: (?m)(^|[;{}])[\t ]*\$\w+\s*=\s*\(?\s*"[^"\r\n]{1,24}"\s*[\^|&]\s*"[^"\r\n]{1,24}"
- id: dense-quoted-fragments
  desc: Dense short quoted-literal concatenation pairs
  crit: suspicious
  conf: 0.88
  count_min: 10
  per_kb_min: 3.0
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
  if:
    type: tree-sitter
    query: |
      ((binary_expression
         left: [(string) (encapsed_string)] @left
         operator: "."
         right: [(string) (encapsed_string)] @right) @pair
       (#match? @left "^['\"][A-Za-z0-9_+/=:-]{1,8}['\"]$")
       (#match? @right "^['\"][A-Za-z0-9_+/=:-]{1,8}['\"]$")
       (#not-match? @pair "^\"(base|revision|schema|database)\"\\.\"[A-Za-z_][A-Za-z0-9_]{0,7}\"$")
       (#not-match? @pair "^['\"][A-Za-z][A-Za-z0-9]{0,3}_['\"]\\s*\\.\\s*['\"][A-Fa-f0-9]{4,6}['\"]$"))
- id: php-two-char-chunks
  desc: PHP two-character string chunks
  crit: suspicious
  conf: 0.95
  count_min: 3
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
  if:
    type: text
    regex: (?m)^[^/\n]{0,120}['"][a-z0-9]{2}['"]\s*\.\s*['"][a-z0-9]{2}['"]
- id: fragmented-base64-literals
  desc: Fragmented base64 literal chains
  crit: suspicious
  conf: 0.9
  count_min: 8
  per_kb_min: 2.0
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
  if:
    type: text
    regex: '[''"][A-Za-z0-9+/=]{4,8}[''"]\s*\.\s*[''"][A-Za-z0-9+/=]{2,8}[''"]'
  not:
  - regex: ^"(base|revision|schema|database)"\."[A-Za-z_][A-Za-z0-9_]{0,7}"$
- id: str-replace-func-name-deob
  desc: str_replace removes junk from a function name
  crit: suspicious
  conf: 0.95
  attack: T1027.010
  if:
    type: text
    regex: str_replace\s*\(\s*'\w{1,6}'\s*,\s*''\s*,\s*'[a-z_]{12,35}'
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
- id: split-literal-identifier-assignment
  desc: Variable assembled from split fragments
  crit: suspicious
  conf: 0.92
  size_max: 2097152
  if:
    type: text
    regex: \$\w+\s*=\s*['"]\w{1,10}['"](\s*\.\s*['"]\w{1,10}['"]){2,}\s*;
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
composite_rules:
- id: bitwise-string-synthesis
  desc: PHP bitwise string synthesis
  crit: suspicious
  conf: 0.93
  any:
  - id: single-quoted-bitwise-string
  - id: double-quoted-bitwise-string
- id: php-bitwise-fragment-obfuscation
  desc: PHP bitwise fragment obfuscation
  crit: suspicious
  conf: 0.97
  all:
  - id: bitwise-string-synthesis
  any:
  - id: micro-behaviors/data/string/concat/expression::concat-bareword-fragments
  - id: micro-behaviors/data/string/concat/expression::php-literal-string-concatenation
  - id: micro-behaviors/data/string/assembly::php-xor-char-chain
  - id: dense-quoted-fragments
- id: php-fragmented-string-obfuscation
  desc: PHP fragmented string obfuscation
  crit: suspicious
  conf: 0.94
  all:
  - id: dense-quoted-fragments
  - id: micro-behaviors/data/string/concat/expression::indexed-string-table
  any:
  - id: fragmented-base64-literals
  - id: micro-behaviors/data/string/replace::php-remove-short-word
- id: encoded-name-dynamic-invoke
  desc: PHP calls a base64-decoded dangerous name
  crit: hostile
  conf: 0.95
  # `$h = base64_decode("c3lzdGVt"); $h($x);` spells system() without the
  # word. The decoded name, the decode assignment and the variable call must
  # share a few lines, which keeps unrelated base64 data and callbacks apart.
  near_lines: 3
  all:
  - id: micro-behaviors/data/decode/base64/call::php-base64-decode-assignment
  - id: objectives/command-and-control/backdoor/webshell/decoder::encoded-dangerous-php-base64
  - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
- id: split-name-dynamic-invoke
  desc: PHP calls a name assembled from fragments
  crit: hostile
  conf: 0.95
  # The invoked name must be assembled beside the call. Generic variable calls
  # and substr() joins in ordinary library code sit kilobytes apart.
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
  any:
  - id: split-literal-identifier-assignment
  - id: micro-behaviors/data/string/assembly::php-xor-char-chain
  - id: micro-behaviors/data/string/assembly::php-chr-slice-char-chain
  - id: micro-behaviors/data/string/assembly::php-chr-hex-char-chain
  - id: objectives/anti-static/obfuscation/string/concat::indexed-fragments-assigned-to-callee
  - id: bitwise-string-synthesis
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
# The same assembled name handed to a callback dispatcher instead of called
# through a variable: call_user_func(chr(115).chr(121)..., $x). Plain
# concatenation into call_user_func is ordinary library code, so the
# character-code (or XOR) chain must sit inside the call's own argument window.
- id: split-name-callback-invoke
  desc: PHP callback dispatcher called with a name assembled from fragments
  crit: hostile
  conf: 0.93
  near_bytes: 192
  all:
  - id: micro-behaviors/metaprogramming/reflection/invoke::concatenated-callback-dispatch
  any:
  - id: micro-behaviors/data/string/assembly::php-chr-slice-char-chain
  - id: micro-behaviors/data/string/assembly::php-chr-hex-char-chain
  - id: micro-behaviors/data/string/assembly::php-xor-char-chain
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
