defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # Numeric character codes used directly as a global key conceal an API
  # name. This mechanism does not identify a commercial obfuscator. A plain
  # Buffer.from('name') key, a comment, and an ordinary byte buffer do not
  # establish this concealment.
  - id: numeric-buffer-global-key
    desc: Global property name concealed as byte array
    crit: suspicious
    conf: 0.95
    attack: T1027
    mbc: B0032
    if:
      type: tree-sitter
      query: |
        ((subscript_expression
          object: (identifier) @global
          index: (call_expression
            function: (member_expression
              object: (identifier) @buffer
              property: (property_identifier) @method)
            arguments: (arguments (array (number) (number) (number))))) @access
        (#match? @global "^(global|globalThis)$")
        (#eq? @buffer "Buffer")
        (#eq? @method "from"))
