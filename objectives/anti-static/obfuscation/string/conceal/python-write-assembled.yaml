defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-write-joined-builtin-map
    desc: Writes text assembled through builtin lookup
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        (call
          function: (attribute attribute: (identifier) @method)
          arguments: (argument_list
            (call
              function: (attribute attribute: (identifier) @join)
              arguments: (argument_list
                (call
                  function: (identifier) @map
                  arguments: (argument_list
                    (call function: (identifier) @getattr
                      arguments: (argument_list (identifier) @builtins)))))))
          (#eq? @method "write")
          (#eq? @join "join")
          (#eq? @map "map")
          (#eq? @getattr "getattr")
          (#eq? @builtins "__builtins__"))

composite_rules:
  - id: python-write-and-obfuscated-chr
    desc: Builtin-lookup write and chr obfuscation coexist
    crit: suspicious
    conf: 0.93
    all:
      - id: python-write-joined-builtin-map
      - id: objectives/anti-static/obfuscation/eval/scripting/decode::obfuscated-chr-lookup
