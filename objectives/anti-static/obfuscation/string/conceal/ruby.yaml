# Splitting an embedded payload on a dash-run marker and stripping the marker
# back out before decoding — the Ruby cousin of the split()/join("") idiom in
# split-join.yaml. The strip direction is the whole signal: `gsub("---", "")`
# reassembles a payload that was broken up to defeat string scanning, whereas
# `gsub(/^/, "---")` *inserts* dashes and is ordinary output formatting (Ruby's
# bundled typeprof prefixes exception lines that way). An earlier version of
# this matcher accepted any gsub with a `---` argument and was named for a
# base64 payload it never checked for, so it flagged that formatter as
# obfuscation.
#
# Notable rather than suspicious on its own: `---` is also the YAML document
# separator, so stripping it out of a document is a legitimate thing to do. The
# dropper composites in objectives/command-and-control/dropper/execution/script/
# reference this alongside the decode and execution legs that carry the intent.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1027

traits:
  - id: ruby-dash-run-separator-strip
    desc: Ruby strips a dash-run separator from text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.gsub\(\s*[''"]-{3,}[''"]\s*,\s*[''"][''"]\s*\)'
