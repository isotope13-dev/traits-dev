# Browser API names rebuilt by deleting one junk character between
# each real character, then calling replace on the result.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: filtered-fromcharcode-property
    desc: Filters junk from fromCharCode name
    crit: suspicious
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)f.r.o.m.C.h.a.r.C.o.d.e.[''"]\.replace\(/'
  - id: filtered-unescape-property
    desc: Filters junk from unescape name
    crit: suspicious
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)u.n.e.s.c.a.p.e.[''"]\.replace\(/'
  - id: filtered-write-property
    desc: Filters junk from write property
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)[''"]w.r.i.t.e.[''"]\.replace\(/'
  - id: filtered-charcodeat-property
    desc: Filters junk from charCodeAt name
    crit: suspicious
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)c.h.a.r.C.o.d.e.A.t.[''"]\.replace\(/'
