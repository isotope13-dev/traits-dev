defaults:
  platforms:
  - windows
composite_rules:
- id: wsh-obfuscated-savetofile-reference
  desc: Obfuscated WSH ActiveX script references SaveToFile
  crit: suspicious
  conf: 0.95
  attack: T1027,T1059.007
  for:
  - javascript
  all:
  - id: micro-behaviors/os/com/automation::activex-object-variable-progid
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  any:
  - id: objectives/anti-static/obfuscation/string/conceal::js-interspersed-question-marks
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/data/control-flow/dispatch::js-function-derived-computed-call
