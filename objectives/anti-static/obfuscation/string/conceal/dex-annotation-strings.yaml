defaults:
  platforms: [android]
  for: [dex]

traits:
  - id: dex-annotation-mark-string-population
    desc: Numerous annotation-mark-only DEX strings
    crit: suspicious
    conf: 0.98
    attack: T1027
    count_min: 20
    if:
      type: raw
      # These are annotation marks, not Arabic letters. Long strings of
      # nothing but marks are used as opaque hash-switch states in DEX.
      # Ordinary Arabic prose and an isolated annotated quotation miss.
      regex: '[\x{06D6}-\x{06ED}]{40,}\x00'
