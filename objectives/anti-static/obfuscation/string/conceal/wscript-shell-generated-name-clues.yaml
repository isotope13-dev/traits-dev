defaults:
  crit: hostile
  for:
    - javascript
  platforms:
    - windows

composite_rules:
  - id: wscript-shell-generated-name-clues
    crit: suspicious
    conf: 0.95
    desc: WScript.Shell and generated identifier clues
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    any:
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
    needs: 1
