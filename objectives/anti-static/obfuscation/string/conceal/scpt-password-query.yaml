# The resolved stage spoofs System Preferences, but that title is not
# recovered by the engine. Report concealment and co-occurrence only.
defaults:
  for: [applescript]
  platforms: [macos]
composite_rules:
  - id: scpt-concealed-password-keychain-query
    desc: Obfuscation, password dialog and Keychain query co-occur
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::scpt-arithmetic-character-decoders
      - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
      - id: micro-behaviors/ui/dialog/apple::scpt-display-dialog-call
      - id: micro-behaviors/ui/dialog/apple::scpt-dialog-hidden-answer-parameter
      - id: micro-behaviors/os/security/auth/verify::dscl-authonly
      - id: micro-behaviors/os/security/keychain::scpt-decoded-generic-password-query
