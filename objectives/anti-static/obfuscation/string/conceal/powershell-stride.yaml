defaults:
  platforms: [windows]
  for: [powershell, batch]
traits:
  - id: odd-character-download-eval-fragments
    desc: Alternating filler conceals download/eval tokens
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule odd_character_download_eval_fragments {
          strings:
            $iex = /['"][^'"\r\n]i[^'"\r\n]e[^'"\r\n]x['"]/ nocase
            $download = /d.o.w.n.l.o.a.d.f.i.l.e/ nocase
            $base64 = /f.r.o.m.b.a.s.e.6.4.s.t.r.i.n.g/ nocase
          condition:
            all of them
        }
composite_rules:
  - id: powershell-strided-hidden-download-eval
    desc: Hidden PowerShell reconstructs download and evaluation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/string/assembly::powershell-odd-character-decoder-loop
      - id: odd-character-download-eval-fragments
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
