defaults:
  platforms: [windows, unix]
  for: [php]
composite_rules:
  # Proximity does not bind the decoded name to the invoked variable.
  # Keep this suspicious rather than asserting proven assert execution.
  - id: php-complemented-assert-indirect-call
    desc: Complemented assert name beside indirect call
    crit: suspicious
    conf: 0.95
    attack: T1027
    near_bytes: 128
    all:
      - id: micro-behaviors/data/decode/xor::php-complemented-assert-name
      - id: micro-behaviors/data/control-flow/dispatch::php-variable-function-call
