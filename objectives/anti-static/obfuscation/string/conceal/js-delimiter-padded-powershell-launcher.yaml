# Padding a script with a megabyte of one repeated character and splicing a
# non-ASCII delimiter between every character of its strings hides a
# PowerShell launch from string scans and from human review. The script
# removes the delimiter at run time and runs the rebuilt command.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.001
composite_rules:
  - id: js-padded-delimiter-spliced-powershell-launcher
    desc: Padded JS with spliced strings launching PowerShell
    crit: hostile
    conf: 0.85
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::js-nonascii-delimiter-regex-strip
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-dominant-char-ratio
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    unless:
      - id: metadata/signed/platform/
