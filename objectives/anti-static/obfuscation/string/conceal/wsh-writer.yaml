defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
- id: wsh-concealed-msxml-file-writer
  desc: WSH MSXML file-write references with concealed member names
  crit: suspicious
  conf: 0.99
  attack: T1027,T1059.007,T1140
  mbc: B0032
  scope: file
  all:
    - id: micro-behaviors/data/property/access::wscript-bracket-member-access
    - id: micro-behaviors/os/com/automation::activex-object-variable-progid
    - id: micro-behaviors/data/property/access::msxml-node-typed-value
    - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  any:
    - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
    - id: objectives/anti-static/obfuscation/string/fragmentation::js-split-join-deobfuscation

# The "RFQ <number>.js" malspam dropper shape: one 100KB+ single-line file
# whose *entire* content is a chain of hundreds of `\u`-escaped string
# fragments handed to an eval reached indirectly through `(0,this)[...]`.
# Each decoded layer is another copy of the same construct, which is why the
# parser hits its depth cap. No minifier, bundler, or packer produces this —
# the escaping is per character, the concatenation seams fall inside escape
# runs, and the callee name never appears.
