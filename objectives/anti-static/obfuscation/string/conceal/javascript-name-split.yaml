# JavaScript call targets concealed by concatenation.
#
# `require('chi'+'ld_pro'+'cess')["sp"+"awn"]("rund"+"ll32", ...)` -- the module,
# the method and the program are each spelled across a `+`, so none of the three
# names appears in the source or in a string dump of the bundle. The engine
# folds these constants at parse time, so the split has no runtime effect
# whatsoever; concealment is its only purpose. The 2025 got-fetch npm
# compromise hid a `rundll32` DLL launch this way inside what otherwise reads
# as a log-rotation install script.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027
  mbc: B0032

traits:
  # `obj["sp"+"awn"]` / `obj['re'+'adFileSync']` -- a property name assembled
  # inside the bracket accessor. Legitimate computed access indexes with a
  # variable; splitting a *constant* member name serves only to hide it.
  #
  # The receiver is captured so the built-in namespaces can be filtered out.
  # `Object["ke"+"ys"]` / `Object["define"+"Property"]` is emitted verbatim by
  # the swc and Babel decorator helpers, which split those names so a property
  # mangler cannot rewrite them; the reflection members of `Object`, `Reflect`,
  # `JSON` and `Math` reach nothing an attacker gains by hiding, so a split
  # there conceals nothing.
  # `obfuscation/syntax/string-fragmentation::js-fragmented-property-access` is
  # the canonical suspicious finding for this behaviour -- same observation,
  # built from the `computed-property-*-concat` micro-behaviours -- and two
  # rules reporting one transform is duplication, not corroboration. This atom
  # stays as the leg the concealment composites below consume, reported for
  # what it observes.
  - id: js-split-literal-member-name
    desc: Member name assembled inside bracket access
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '[\w$.\]\)]+\s*\[\s*["''][A-Za-z_$]{1,10}["'']\s*\+\s*["''][A-Za-z0-9_$]{1,12}["'']'
    not:
      - regex: '\b(Object|Reflect|JSON|Math|Symbol)\s*\[\s*["'']'
    unless:
      - id: metadata/package/testing/harness/unit/

  # The Windows proxy-execution hosts, spelled across a `+`. Name-splitting a
  # LOLBin has no purpose other than keeping it out of a search.
  # Both halves have to spell a LOLBin between them. The prefix used to allow
  # two trailing letters and the suffix was any short token, so `'runni'+'ng'`
  # -- "running", split by a commercial JavaScript obfuscator -- read as
  # `rundll32`. The suffix now has to carry the tail that names the tool
  # (`ll32`/`vr32`, `ta`, `til`, `ipt`).
  - id: js-lolbin-name-split-concat
    desc: LOLBin name split across concatenation
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["''](run|rund|rundl|regs|msh|certu|wscr|cscr)["'']\s*\+\s*["''][a-z]{0,4}(32|ta|til|ipt)["'']'
    unless:
      - id: metadata/package/testing/harness/unit/

  # A commercial obfuscator (javascript-obfuscator and friends) rewrites EVERY
  # literal in the bundle: FittenTech's VS Code extension splits 6,844 member
  # names, `Object['creat'+'e']` and `this['lengt'+'h']` among them, and its
  # `require('vscod'+'e')` alongside. That is a uniform transform applied to a
  # whole build, which the atoms above already report. The composites below
  # describe something else -- a specific dangerous name hidden inside
  # otherwise plain code, the way the got-fetch npm compromise hid one
  # `child_process`/`spawn` pair -- so they stand down when the splitting is
  # wholesale.
  - id: js-wholesale-literal-splitting
    desc: Every literal split across the bundle
    crit: notable
    conf: 0.95
    count_min: 200
    if:
      type: text
      regex: '\[\s*["''][A-Za-z_$]{1,10}["'']\s*\+\s*["''][A-Za-z0-9_$]{1,12}["'']'

composite_rules:
  # Hiding the module name and the member name in the same expression is the
  # complete technique: neither `child_process` nor `spawn` is greppable, and a
  # reviewer skimming an install script sees only string arithmetic.
  - id: js-split-module-and-member-name
    desc: Module and member names both hidden
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-split-literal-require
      - id: js-split-literal-member-name
    unless:
      - id: js-wholesale-literal-splitting
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  # A hidden LOLBin name plus a hidden way of reaching a process API: the file
  # is a proxy-execution launcher that no name-based scan would have found.
  - id: js-hidden-lolbin-launch
    desc: Script launches a name-hidden LOLBin
    crit: hostile
    conf: 0.95
    scope: file
    attack: T1218.011
    all:
      - id: js-lolbin-name-split-concat
    any:
      - id: micro-behaviors/os/module/dynamic-load::node-split-literal-require
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: js-split-literal-member-name
    unless:
      - id: js-wholesale-literal-splitting
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/manifest::test-fixtures
