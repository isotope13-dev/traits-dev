# JavaScript call targets concealed by concatenation.
#
# `require('chi'+'ld_pro'+'cess')["sp"+"awn"]("rund"+"ll32", ...)` -- the module,
# the method and the program are each spelled across a `+`, so none of the three
# names appears in the source or in a string dump of the bundle. The engine
# folds these constants at parse time, so the split has no runtime effect
# whatsoever; concealment is its only purpose. The 2025 got-fetch npm
# compromise hid a `rundll32` DLL launch this way inside what otherwise reads
# as a log-rotation install script.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1027
  mbc: B0032

traits:
  # `obj["sp"+"awn"]` / `obj['re'+'adFileSync']` -- a property name assembled
  # inside the bracket accessor. Legitimate computed access indexes with a
  # variable; splitting a *constant* member name serves only to hide it.
  - id: js-split-literal-member-name
    desc: Member name assembled inside bracket access
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\[\s*["''][A-Za-z_$]{1,10}["'']\s*\+\s*["''][A-Za-z0-9_$]{1,12}["'']'
    unless:
      - id: metadata/package/testing/harness/unit/

  # The Windows proxy-execution hosts, spelled across a `+`. Name-splitting a
  # LOLBin has no purpose other than keeping it out of a search.
  - id: js-lolbin-name-split-concat
    desc: LOLBin name split across concatenation
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["''](run|rund|rundl|regs|msh|certu|wscr|cscr)[a-z]{0,2}["'']\s*\+\s*["''][a-z0-9]{1,6}["'']'
    unless:
      - id: metadata/package/testing/harness/unit/

composite_rules:
  # Hiding the module name and the member name in the same expression is the
  # complete technique: neither `child_process` nor `spawn` is greppable, and a
  # reviewer skimming an install script sees only string arithmetic.
  - id: js-split-module-and-member-name
    desc: Module and member names both hidden
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-split-literal-require
      - id: js-split-literal-member-name
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  # A hidden LOLBin name plus a hidden way of reaching a process API: the file
  # is a proxy-execution launcher that no name-based scan would have found.
  - id: js-hidden-lolbin-launch
    desc: Script launches a name-hidden LOLBin
    crit: hostile
    conf: 0.95
    scope: file
    attack: T1218.011
    all:
      - id: js-lolbin-name-split-concat
    any:
      - id: micro-behaviors/os/module/dynamic-load::node-split-literal-require
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
      - id: js-split-literal-member-name
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/manifest::test-fixtures
