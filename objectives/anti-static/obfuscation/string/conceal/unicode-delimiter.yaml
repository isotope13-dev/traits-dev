defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: js-nonascii-delimiter-regex-strip
    desc: Strips a non-ASCII delimiter regex from strings
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    if:
      type: text
      regex: '\.replace\(\s*/[\P{ASCII}]{4,}/g,\s*["'']["'']\s*\)'
    unless:
      - id: metadata/build/

composite_rules:
  - id: js-unicode-delimiter-wsh-evaluation
    desc: WSH delimiter stripping with code evaluation
    crit: suspicious
    conf: 0.98
    attack: T1027.002,T1059.007
    for: [javascript]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct
      - id: js-nonascii-delimiter-regex-strip
      - id: metadata/file/data-blob::high-byte-script-text
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
      - id: metadata/lang/runtime::wscript-host-reference
