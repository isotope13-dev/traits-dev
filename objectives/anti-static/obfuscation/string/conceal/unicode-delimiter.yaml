defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: js-nonascii-delimiter-regex-strip
    desc: Strips a non-ASCII delimiter regex from strings
    crit: suspicious
    conf: 0.95
    attack: T1027.002
    if:
      type: text
      regex: '\.replace\(\s*/[\P{ASCII}]{4,}/g,\s*["'']["'']\s*\)'
    unless:
      - id: metadata/build/
    # CJK, kana, hangul, and Cyrillic runs are words stripped from UI or
    # locale text. A delimiter is a repeated marker, not a word.
    not:
      - regex: '[\p{Han}\p{Hiragana}\p{Katakana}\p{Hangul}]{2}'
      - regex: '[а-яА-ЯёЁіїєґІЇЄҐ]{2}'
