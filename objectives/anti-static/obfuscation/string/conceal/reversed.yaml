# Reversed Keyword Detection
# MBC: B0032 (Obfuscated Files or Information)
# ATT&CK: T1027
defaults:
  crit: suspicious
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-reversed-wscript
    desc: Reversed WScript keyword (tpircsw)
    if:
      type: text
      regex: '(?i)tpircsw'
  # Bounded for the same reason js-reversed-array below is: an unanchored
  # substring hits ordinary data. `nruter` sits inside any surname ending in
  # "n" followed by "ruter" — it fired on the URL github.com/westo|nruter| in
  # Bootstrap's stock docs bundle. Reversed source keeps `return` a whole token
  # however it is reversed (`"nruter"`, `};)(nruter{`, `rab nruter oof`), so
  # word boundaries cost nothing here.
  - id: js-reversed-return
    desc: Reversed return keyword (nruter)
    if:
      type: text
      regex: '(?i)\bnruter\b'
  - id: js-reversed-array
    desc: Reversed Array identifier or call
    if:
      type: text
      # Require source-like identifier use. A standalone token also occurs in
      # ordinary locale and place-name data (for example, "Yarra Valley").
      regex: '\byarra\s*[\[(=.]'
      case_insensitive: true
  - id: js-reversed-function
    desc: Reversed function keyword (noitcnuf)
    if:
      type: text
      regex: '(?i)noitcnuf'
    unless:
      - id: micro-behaviors/communications/http/services/google::identity-services-gsi-client
  - id: js-reversed-whitespace
    desc: Reversed whitespace keyword (ecapsetihw)
    if:
      type: text
      regex: '(?i)ecapsetihw'
