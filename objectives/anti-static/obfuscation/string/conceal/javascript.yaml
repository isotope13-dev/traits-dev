defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: js-adodb-position-reversed
    desc: Reversed ADODB position string
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      substr: noitisop
  - id: js-adodb-savetofile-reversed
    desc: Reversed ADODB SaveToFile string
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      substr: eliFoTevaS
  - id: js-xmlhttp-responsebody-reversed
    desc: Reversed XMLHTTP ResponseBody token
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      substr: ydoBesnopseR
  - id: js-split-reverse-join
    desc: String reversal via split-reverse-join
    crit: notable
    conf: 0.8
    mbc: B0032
    attack: T1027.002
    count_min: 5
    if:
      type: text
      regex: \.split\(.{0,6}\)\.reverse\(\)\.join\(.{0,6}\)
    unless:
      - id: well-known/lib/crypto/zxcvbn::zxcvbn-ranked-dictionaries
      - type: symbol
        exact: matching
      - id: micro-behaviors/process/interpreter/vm/
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure/
  - id: js-junk-math-1
    desc: 'Junk arithmetic producing small integers'
    # Building block, not a standalone signal: parenthesized constant arithmetic is
    # ubiquitous in benign code (RGB lerp `base + (end - start) * t`, dimensions, time
    # math). It only indicates obfuscation alongside string assembly — used as the
    # corroborating `any:` leg of the eval+char-map composite in
    # objectives/execution/interpreter/eval/dynamic/obfuscated_js.yaml.
    crit: component
    conf: 0.6
    mbc: B0032
    attack: T1027
    count_min: 4
    if:
      type: text
      regex: \(\s*[-+]?\d+\s*[-+*/]\s*[-+]?\d+\s*\)
    not:
      # `(0-N)` is range/limit notation (RGB `(0-255)`, `(0-9)`, time fields),
      # not junk math — a leading-zero operand makes no sense as a computed
      # char code (always negative).
      - regex: \(\s*0\s*-\s*\d{1,3}\s*\)
    unless:
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: metadata/package/testing/harness/runtime/
      # Image/graphics/ML codecs in bundles carry constant arithmetic like
      # (1/255) alpha normalization or (1/0); not junk-math obfuscation.
      - id: metadata/library/structure/
  - id: js-createobject-reversed
    desc: Reversed CreateObject string
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      regex: (?i)tcejbOetaerC
  - id: js-comma-string-obfuscation
    desc: String obfuscation using the comma operator
    crit: notable
    conf: 0.8
    mbc: B0032
    attack: T1027
    size_max: 100000
    if:
      type: tree-sitter
      # Require the comma expression to be parenthesized.  Dependency arrays
      # in AMD/UMD modules are ordinary string lists, not concealed strings.
      node: parenthesized_expression
      regex: '^\s*\(["\x27].{1,20}["\x27]\s*,\s*["\x27].{1,20}["\x27]\s*,\s*["\x27].{1,20}["\x27]\)\s*$'
    not:
      - regex: \.\w{1,5}['"]
      - regex: (\.attr|\.style|translate)\(
      - regex: \.(xor|valid)\(
      - regex: \bfirstEnv\(
      - regex: (?i)\bIN\s*\(
      - regex: '"\+[A-Za-z]\.[rgb]\+"'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - type: text
        substr: mermaid-architecture
      - type: text
        substr: "(\"\\\\bgroup\",\"{\")"
      - id: micro-behaviors/data/db/sql/
  - id: hex-escaped-get
    desc: Hex-escaped GET method string
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''](G\\x45|\\x47E)["'']'
  - id: hex-escaped-post
    desc: Hex-escaped POST method string
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''](P\\x4fS|\\x50OS)["'']'
  - id: js-interspersed-question-marks
    desc: Question-mark interspersed string concealment
    crit: suspicious
    conf: 0.95
    mbc: "B0032"
    attack: "T1027"
    if:
      type: text
      regex: '([a-zA-Z0-9]\?){10,}'
    unless:
      - id: well-known/lib/format/pdfjs::pdfjs-bundle
      # Some modern PDF.js builds omit the Mozilla banner/version markers but
      # still export the library object. Their packed font/lookup data can
      # contain long `a?b?c?...` runs that are not attacker obfuscation.
      - id: well-known/lib/format/pdfjs::pdfjs-globalthis-export
      # Google's vendored Identity Services client contains reversed and
      # interspersed lookup-table data as part of its generated bundle.
      - id: micro-behaviors/communications/http/services/google::identity-services-gsi-client
      # D2's vendored Brotli decoder uses generated lookup tables and compact
      # source that can contain this pattern without concealing a payload.
      - id: well-known/tool/development/d2::d2-brotli-decoder-context
      - id: well-known/lib/format/brotli::js-decode-factory
  - id: js-interspersed-chars-generic
    desc: Interspersed characters in a JavaScript string
    crit: suspicious
    conf: 0.8
    mbc: "B0032"
    attack: "T1027"
    size_max: 50000
    if:
      type: string_literal
      regex: '"[a-zA-Z0-9][^a-zA-Z0-9"\s]([a-zA-Z0-9][^a-zA-Z0-9"\s]){18,}[a-zA-Z0-9]"'
  - id: js-alternating-punctuation-run
    desc: Long alternating alphanumeric punctuation run
    crit: notable
    conf: 0.9
    size_max: 100000
    if:
      type: text
      # Exclude JavaScript punctuation, whitespace, and backslash. Backslash is
      # critical: long format strings containing repeated \r\n\t escapes are
      # ordinary text layout, not interspersed payload characters.
      regex: '([a-zA-Z0-9][^a-zA-Z0-9,\\.\s;:=(){}\[\]+\-*/<>!&|"''`]){30,}'
    not:
      - substr: an error while printing
      # A repeated escaped NUL string is a normal crypto zero-padding
      # constant, not interleaved payload text.
      - substr: '\0\0'
      - regex: '"(\\0){8,}"'
    unless:
      - id: metadata/package/testing/scripted/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/library/structure::js-webpack-chunk-global
      - id: metadata/library/structure::js-webpack5-iife-bootstrap
      - id: well-known/app/publishing/section-collection::b-blocks-gutenberg-namespace
composite_rules:
  - id: any-string-concealment
    desc: Any string concealment pattern
    crit: suspicious
    conf: 0.8
    any:
      - id: objectives/anti-static/obfuscation/string/conceal::js-adodb-position-reversed
      - id: objectives/anti-static/obfuscation/string/conceal::js-adodb-savetofile-reversed
      - id: objectives/anti-static/obfuscation/string/conceal::js-xmlhttp-responsebody-reversed
      - id: objectives/anti-static/obfuscation/string/conceal::js-split-reverse-join
      - id: objectives/anti-static/obfuscation/string/conceal::hex-escaped-get
      - id: objectives/anti-static/obfuscation/string/conceal::hex-escaped-post
      - id: objectives/anti-static/obfuscation/string/conceal::js-interspersed-question-marks
      - id: objectives/anti-static/obfuscation/string/conceal::js-interspersed-chars-generic
      - id: objectives/anti-static/obfuscation/string/conceal::js-alternating-punctuation-run
      # `jscript::createobject-call` was a leg here, which made a plain COM
      # instantiation get reported as "string concealment" — it conceals
      # nothing. It stays a notable capability in its own directory and
      # surfaces on its own; every leg below is genuinely a concealment
      # technique, so the composite now matches its name.
