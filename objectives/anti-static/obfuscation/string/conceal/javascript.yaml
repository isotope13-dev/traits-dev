defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: js-adodb-position-reversed
  desc: Reversed ADODB position string
  crit: suspicious
  conf: 0.95
  if:
    type: string_literal
    substr: noitisop
- id: js-adodb-savetofile-reversed
  desc: Reversed ADODB SaveToFile string
  crit: suspicious
  conf: 0.95
  if:
    type: string_literal
    substr: eliFoTevaS
- id: js-xmlhttp-responsebody-reversed
  desc: Reversed XMLHTTP ResponseBody token
  crit: suspicious
  conf: 0.8
  if:
    type: string_literal
    substr: ydoBesnopseR
- id: js-junk-math-1
  desc: Junk arithmetic producing small integers
  crit: component
  for:
  - javascript
  - typescript
  - scripts
  conf: 0.6
  mbc: B0032
  attack: T1027
  count_min: 4
  if:
    type: text
    regex: \(\s*[-+]?\d+\s*[-+*/]\s*[-+]?\d+\s*\)
  not:
  - regex: \(\s*\d{1,3}\s*-\s*\d{1,3}\s*\)
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/build
  - id: micro-behaviors/ui/graphics/draw::wgsl-binding-range-comment
  - id: metadata/path::compiled-directory-component
- id: js-createobject-reversed
  desc: Reversed CreateObject string
  crit: suspicious
  conf: 0.95
  if:
    type: string_literal
    regex: (?i)tcejbOetaerC
- id: hex-escaped-get
  desc: Hex-escaped GET method string
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?i)["'](G\\x45|\\x47E)["']
- id: hex-escaped-post
  desc: Hex-escaped POST method string
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?i)["'](P\\x4fS|\\x50OS)["']
- id: js-interspersed-question-marks
  desc: Question-mark interspersed string concealment
  crit: suspicious
  conf: 0.95
  mbc: B0032
  attack: T1027
  if:
    type: text
    regex: ([a-zA-Z0-9]\?){10,}
  unless:
  - id: well-known/lib/format/pdfjs::pdfjs-bundle
  - id: well-known/lib/format/pdfjs::pdfjs-globalthis-export
  - id: micro-behaviors/communications/http/services/google::identity-services-gsi-client
  - id: well-known/tool/development/cli/d2::d2-brotli-decoder-context
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: well-known/lib/format/brotli::js-decode-factory
  - id: well-known/lib/ui/codemirror::lezer-parser-table
  - type: text
    regex: \.to(Be|Equal|StrictEqual)\(\s*['"`]([a-zA-Z0-9]\?){10,}
  - id: well-known/app/infrastructure/windmill::source-tree
- id: js-interspersed-chars-generic
  desc: Interspersed characters in a JavaScript string
  crit: suspicious
  conf: 0.8
  mbc: B0032
  attack: T1027
  size_max: 50000
  if:
    type: string_literal
    regex: '"[a-zA-Z0-9][^a-zA-Z0-9"\s,]([a-zA-Z0-9][^a-zA-Z0-9"\s,]){18,}[a-zA-Z0-9]"'
- id: js-alternating-punctuation-run
  desc: Long alternating alphanumeric punctuation run
  crit: suspicious
  conf: 0.9
  size_max: 100000
  if:
    type: text
    regex: ([a-zA-Z0-9][^a-zA-Z0-9,\\.\s;:=(){}\[\]+\-*/<>!&|"'`%]){30,}
  not:
  - substr: an error while printing
  - substr: \0\0
  - regex: '"(\\0){8,}"'
  unless:
  - id: metadata/package/testing/scripted/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/presence/fixture/
  - id: well-known/tool/detection/ascan::ascan-model-bundle-path
  - id: metadata/build/bundler/runtime::js-webpack-chunk-global
  - id: metadata/build/minifier::js-webpack5-iife-bootstrap
  - id: well-known/app/publishing/section-collection::b-blocks-gutenberg-namespace
  - type: basename
    regex: \.rs\.data$
  - id: metadata/path::test-directory-component
composite_rules:
- id: any-string-concealment
  desc: Any string concealment pattern
  crit: suspicious
  conf: 0.8
  any:
  - id: objectives/anti-static/obfuscation/string/conceal::js-adodb-position-reversed
  - id: objectives/anti-static/obfuscation/string/conceal::js-adodb-savetofile-reversed
  - id: objectives/anti-static/obfuscation/string/conceal::js-xmlhttp-responsebody-reversed
  - id: objectives/anti-static/obfuscation/string/conceal::hex-escaped-get
  - id: objectives/anti-static/obfuscation/string/conceal::hex-escaped-post
  - id: objectives/anti-static/obfuscation/string/conceal::js-interspersed-question-marks
  - id: objectives/anti-static/obfuscation/string/conceal::js-interspersed-chars-generic
  - id: objectives/anti-static/obfuscation/string/conceal::js-alternating-punctuation-run
