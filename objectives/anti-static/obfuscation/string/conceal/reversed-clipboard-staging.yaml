# Reversed-encoded clipboard staging. A page keeps its command as a
# reversed Base64 string, decodes it at click time into an offscreen
# textarea, and copies the result with execCommand — so neither the payload
# nor a Clipboard-API write is visible until the victim pastes. Reversal,
# decoding, hidden fields and copying each occur legitimately; a page that
# combines all four is staging what it copies.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: reversed-encoded-hidden-field-staging
    desc: Reversed-encoded payload staged in a hidden field for copy
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/reverse::html-split-reverse-join-string
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/data/format/html::offscreen-positioned-textarea
      - id: micro-behaviors/os/clipboard/write::browser-execcommand-copy
    near_bytes: 2560
