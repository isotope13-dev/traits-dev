defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-nemucod-dictionary-loop
    desc: Double-index dictionary loop pattern
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\+=\s*\w+\[\w+\[\w+\]\]'
    unless:
      - id: metadata/library/runtime::vscode-webview-bundle
      - id: metadata/library/structure::js-vite-rollup-vendor-chunk
      - id: micro-behaviors/process/interpreter/vm/
      - id: metadata/library/runtime::acquire-vscode-api
      - id: well-known/lib/format/pdfjs/
  - id: js-nemucod-ascii-remap
    desc: ASCII remapping assignment markers
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '\=\s*128;\s*\w+\[[^\]]{1,15}\]\s*=\s*129;'
  # Some WSH droppers replace every printable character with the contiguous
  # U+0600 block. Match consecutive digit entries in the decoded UTF-16 map;
  # this is independent of variable names and survives JavaScript parse
  # failure caused by the encoded source that follows it.
  - id: js-utf16-arabic-printable-shift-map
    desc: UTF-16 Arabic-to-printable shift map
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '"ؐ":"0","ؑ":"1","ؒ":"2"'
composite_rules:
  - id: js-nemucod-dictionary-recognized-marker
    desc: Recognized dense dictionary map marker
    crit: component
    conf: 0.8
    any:
      - id: metadata/package/testing/scripted::xterm-terminal-recording
      - id: metadata/package/testing/harness/runtime::is-test
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/library/structure::js-any-bundle-output
      - id: metadata/package/files/dependency::node-modules-path
      - id: well-known/lib/format/xml2
      - id: well-known/lib/format/xslt

  - id: js-nemucod-dictionary-rebuild
    desc: Token dictionary rebuild wrapper
    crit: suspicious
    conf: 0.88
    unless:
      # Bundled dependency tables can have the same short-token loop shape
      # without reconstructing executable payload text.
      - id: metadata/library/structure::js-large-minified-bundle
    all:
      # The dense key -> short-token table itself is a neutral data shape (locale
      # tables, language-alias maps and template catalogues all have it), so it
      # lives in micro-behaviors; the double-index rebuild loop next to it is
      # what makes the pair a token-dictionary deobfuscator.
      - id: micro-behaviors/data/encode/map::js-short-token-dict-map
      - id: js-nemucod-dictionary-loop
