defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
composite_rules:
  # This is a static triage signal, not proof of the decoded payload's goals.
  # Isolated emulation of the three reviewed builds confirmed shell-process
  # DLL injection. The static facts alone must not claim browser theft or C2.
  - id: tls-obfuscated-pe-parser-large-string
    desc: TLS-obfuscated PE parser with a large string blob
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-dense-pointer-dispatch
      - id: metadata/file/profile/string-population::native-string-over-256-kib
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
