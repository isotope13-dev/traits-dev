defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: js-string-transformation-clues
    desc: JavaScript source transformation clues
    crit: notable
    conf: 0.8
    size_max: 200000
    for:
      - javascript
    # Syntax diversity in polyfills does not establish concealment. Require
    # the dynamically executed reconstruction before combining weaker clues.
    all:
      - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-string-obfuscation
    any:
      - id: metadata/lang/javascript-features::js-self-compare-count-2
      - id: micro-behaviors/data/string/split::js-split-custom-delimiter
      - id: metadata/lang/encoding/hex::js-dense-hex-escapes
      - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-string-obfuscation
    needs: 2
    unless:
      - id: metadata/package/testing/harness/runtime::node-common-require
