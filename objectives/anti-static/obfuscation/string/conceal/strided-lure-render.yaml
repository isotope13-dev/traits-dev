# Concealed lure rendering. Lure text is decoded out of junk-interleaved
# tables by striding over them and written into the page with innerHTML,
# with percent-encoded runs alongside. Strided loops, innerHTML and encoded
# runs each occur legitimately; a page that decodes lure markup from
# strided tables and injects it into the DOM is hiding what it shows.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: strided-encoded-content-dom-injection
    desc: Strided-encoded content injected into DOM
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/assembly::strided-index-string-assembly
      - id: micro-behaviors/data/collection/dom::dom-innerhtml-access
      - id: metadata/lang/encoding::marker-wrapped-percent-byte-runs
