defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: wsh-strided-hidden-environment-command
    desc: Strided string reconstruction accompanies hidden WMI environment launch
    crit: suspicious
    conf: 0.97
    attack: T1027
    all:
      - id: micro-behaviors/data/string/assembly::js-strided-substr-assembly
      - id: micro-behaviors/os/env/write::wmi-startup-environment-array
      - id: objectives/execution/wmi::wsh-concatenated-hidden-wmi-command
