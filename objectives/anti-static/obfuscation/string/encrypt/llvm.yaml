# OLLVM's string encryption pass emits these decoder entry points. Unlike
# its compiler ident, the exported decoder is evidence of concealment.
traits:
  - id: llvm-data-diversification-decoder
    desc: LLVM encrypted data decoder export
    crit: suspicious
    conf: 0.97
    platforms: [android, linux]
    for: [elf]
    attack: T1027
    if:
      type: export
      regex: '^\.?datadiv_decode[0-9]+$'
