# Public RPC access and hex decoding alone are ordinary wallet behavior.
# Require character reconstruction with a repeating XOR key and an evaluator
# or inline child. These are co-located observations, not a flow-graph proof.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  attack: T1027,T1140,T1059.007
  mbc: B0032
composite_rules:
  - id: blockchain-xor-code-concealment
    desc: Transaction hex/XOR near code execution
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/blockchain/client::transaction-hex-public-provider-context
      - id: micro-behaviors/data/string/conversion::js-repeating-key-xor-character-reconstruction
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval-computed-access
      - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval
  - id: bound-blockchain-xor-payload-decoder
    desc: Ethereum transaction hex and repeating-key XOR helper bound to execution
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/hex::transaction-input-buffer-hex
      - id: micro-behaviors/data/string/conversion::js-repeating-key-xor-character-reconstruction
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::js-charcode-pair-xor
    any:
      - id: objectives/execution/payload/script-eval/blockchain::xor-blockchain-helper-result-eval-binding
      - id: objectives/execution/payload/script-eval/blockchain::xor-blockchain-helper-error-eval-binding
      - id: objectives/execution/payload/script-eval/blockchain::xor-blockchain-helper-detached-node-eval-binding
