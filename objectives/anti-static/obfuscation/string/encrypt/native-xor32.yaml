defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  attack: T1027
traits:
  - id: repeated-x64-xor32-string-loops
    desc: Repeated 32-byte key string decryption
    crit: suspicious
    conf: 0.98
    count_min: 4
    if:
      type: hex
      section: .text
      # ECX = index & 31; load key byte, XOR ciphertext, store output.
      # Key/ciphertext RVAs and string lengths vary between builds.
      pattern: >-
        41 8B C8 83 E1 1F 8A 8C 0E ?? ?? ?? ??
        42 32 8C 06 ?? ?? ?? ?? 42 88 0C 07
        41 FF C0 41 83 F8 ?? 72 ??
  - id: seeded-x64-xor32-string-loops
    desc: Seed-keyed 32-byte string decryption loops
    crit: suspicious
    conf: 0.97
    count_min: 4
    if:
      type: hex
      section: .text
      # Each byte is XORed with a seed byte, the cycling 32-byte key and the
      # ciphertext, then stored. A caller-supplied seed makes every string
      # useless to static decoding unless the seed is known. Key and ciphertext
      # RVAs and string lengths vary between strings.
      pattern: >-
        83 E1 03 83 E0 1F C1 E1 03 8B ?? D3 EA 41 32 94 02 ?? ?? ?? ??
        43 32 94 0A ?? ?? ?? ?? 42 88 14 0E 41 FF C1
