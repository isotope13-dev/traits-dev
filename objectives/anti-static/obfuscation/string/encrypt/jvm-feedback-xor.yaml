# The cached string decoder splits even/odd characters and updates each
# XOR key by rotating it and feeding back the recovered character. Keys,
# constant-pool indexes and local-variable indexes are deliberately unpinned.
defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1027
traits:
  - id: jvm-character-feedback-xor-decoder
    desc: JVM strings decoded with rotating XOR feedback
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: >-
        15 ?? 82 92 55 15 ?? 06 7C 15 ?? 08 78 80
        19 ?? 15 ?? 34 82 11 00 FF 7E 36 ??
        A7 ?? ?? 15 ?? 82 92 55

composite_rules:
  - id: jvm-feedback-xor-constant-cache-discord-stealer
    desc: JVM rotating-XOR and constant-cache obfuscation wrapping Discord DPAPI stealer
    crit: hostile
    conf: 0.98
    for: [jar, zip, class, java_class]
    scope: archive
    all:
      - id: jvm-character-feedback-xor-decoder
      - id: objectives/anti-static/obfuscation/string/encoding::jvm-control-string-xor-decoder
      - id: objectives/anti-static/obfuscation/encoding/numeric::jvm-keyed-integer-constant-cache
      - id: objectives/credential-access/discord/token::java-discord-dpapi-stealer
