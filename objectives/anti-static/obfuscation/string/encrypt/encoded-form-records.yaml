defaults:
  for:
  - html
  platforms:
  - windows
  - unix
  crit: suspicious
  conf: 0.97
traits:
- id: base26-xor-form-record
  desc: Letter-pair XOR encoding hides URL/form records
  count_min: 2
  if:
    type: text
    exclude_html_comments: true
    regex: afafabcxdqdq[a-z]{20,500}djcicecbcycocucbctbl
composite_rules:
- id: encoded-form-record-auto-post
  desc: Concealed URL/form records with automatic POST
  all:
  - id: base26-xor-form-record
  - id: micro-behaviors/communications/http/form::html-form-post-method
  - id: micro-behaviors/communications/http/request/html::html-form-external-action
  - id: micro-behaviors/ui/window/navigation::document-named-form-submit
