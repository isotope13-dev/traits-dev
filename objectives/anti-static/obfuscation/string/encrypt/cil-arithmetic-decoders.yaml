defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: cil-position-dependent-string-xor
    desc: Managed position-dependent XOR string decoder
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: hex
      section: .text
      # Character XOR keyHigh XOR (keyMiddle << (position % 8)), then
      # mask to a UTF-16 code unit and store in the reconstructed string.
      pattern: '07 61 08 FE 0C 05 00 20 08 00 00 00 5D 62 61 20 FF FF 00 00 5F D1 9D'
