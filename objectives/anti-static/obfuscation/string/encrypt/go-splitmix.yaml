# Indexed encrypted byte tables decoded with a SplitMix64-derived stream.
# This fingerprints the byte-XOR loop, not just a general-purpose PRNG's
# constants: it requires the four-byte lane selection and ciphertext XOR.
# Register allocation is scoped to this x86-64 code-generator form; stack
# slots vary. No endpoint, key, table bytes or function spelling is pinned.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1027

traits:
  - id: go-splitmix-byte-table-decoder
    desc: SplitMix64 XOR string-table decoder
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: >-
        45 0F B6 04 01 [4-16] 48 83 E0 FC [6-16] 49 C1 E3 03
        [5-16] 49 BF 15 7C 4A 7F B9 79 37 9E
        4D 01 FD 4C 89 E8 49 C1 ED 1E 49 31 C5
        49 BF B9 E5 E4 1C 6D 47 58 BF 4D 0F AF EF
        4C 89 6C 24 ?? 49 C1 ED 1B 4C 8B 7C 24 ?? 4D 31 FD
        49 BF EB 11 31 13 BB 49 D0 94 4D 0F AF EF
        4C 89 6C 24 ?? 49 C1 ED 1F 4C 8B 7C 24 ?? 4D 31 FD
        [6-16] 49 D3 ED [8-24] 45 31 E8
