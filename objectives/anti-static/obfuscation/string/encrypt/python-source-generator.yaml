# Build scripts that emit XOR-encrypted string tables as C/C++ hex escapes, so
# the compiled program carries no plaintext strings. A per-character index
# folded into the key is the rolling-XOR shape used by bot builders.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027
  mbc: E1027

traits:
  - id: rolling-xor-hex-escape-emitter
    desc: Emits rolling-XOR string as C hex escapes
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\\\\x\{0?:02[Xx]\}["'']\.format\(\(\(ord\(\w+\)\s?\^\s?\w+\)\s?\^\s?\w+\)'
