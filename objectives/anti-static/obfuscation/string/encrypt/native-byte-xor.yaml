defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  attack: T1027

traits:
  - id: unrolled-rip-relative-byte-xor
    desc: Unrolled byte-XOR global string decryption
    crit: suspicious
    conf: 0.97
    count_min: 4
    if:
      type: hex
      section: .text
      # Four consecutive load/XOR/store operations. Addresses and keys vary;
      # this is the decryptor, not a signature of one encrypted string.
      pattern: >-
        0F B6 05 ?? ?? ?? ?? 34 ?? 88 05 ?? ?? ?? ??
        0F B6 05 ?? ?? ?? ?? 34 ?? 88 05 ?? ?? ?? ??
        0F B6 05 ?? ?? ?? ?? 34 ?? 88 05 ?? ?? ?? ??
        0F B6 05 ?? ?? ?? ?? 34 ?? 88 05 ?? ?? ?? ??
