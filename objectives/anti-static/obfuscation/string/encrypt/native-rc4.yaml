defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # These are co-occurring reconstruction indicators, not a claim that every
  # hexadecimal run is ciphertext or that the algorithm itself is malicious.
  - id: rc4-hex-string-concealment
    desc: RC4, hex strings and string scratch wiping
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::x86-object-byte-state-prga
      - id: micro-behaviors/mem/fill::x86-string-copy-scratch-wipe
      - id: metadata/file/encoding/hex::pe-wide-hex-runs
