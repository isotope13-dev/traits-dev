defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: cil-rc4-with-manual-native-resolution
    desc: CIL RC4 with manual native resolution
    crit: suspicious
    conf: 0.95
    attack: T1027
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::cil-byte-array-prga-xor
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-base-address
      - id: micro-behaviors/crypto/hash/digest::sha256-code-name-reference
