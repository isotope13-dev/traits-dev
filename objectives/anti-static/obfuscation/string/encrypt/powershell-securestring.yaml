# The evaluator consumes a marshaling expression containing SecureStringToBSTR.
# This also searches decoded text, including commands embedded in build files.
# Ordinary encrypted credential storage does not require an evaluator.
defaults:
  platforms: [windows]
  for: [powershell, csharp, xml]

traits:
  - id: powershell-securestring-evaluation
    desc: Evaluates a SecureString marshaling expression
    crit: suspicious
    conf: 0.96
    attack: T1027
    if:
      type: text
      regex: '(?i)\b(iex|invoke-expression)\s*\(.{0,200}::SecureStringToBSTR\s*\('
