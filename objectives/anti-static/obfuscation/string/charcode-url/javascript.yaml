defaults:
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032
  platforms: [windows, unix]
traits:
  - id: dense-fromcharcode
    desc: Dense fromCharCode calls (string obfuscation)
    crit: suspicious
    conf: 0.9
    count_min: 5
    per_kb_min: 1.0
    if:
      type: string_literal
      regex: fromCharCode\s*\(\s*\d
    unless:
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
composite_rules:
  # The scheme is rebuilt from character codes and the host never appears as a
  # string at all -- it is either a second code array or a table of constants
  # written as offsets from a seed. What the builder returns is a complete
  # `http://<host>/<path>` that exists only at run time, so nothing a static
  # extractor pulls out of the bundle names the endpoint.
  #
  # There is no benign reason to build one's own base URL this way: a real
  # client keeps it in config, in a manifest, or in a plain literal. Both
  # halves must sit in the same builder, hence the byte bound -- a file that
  # happens to contain a fromCharCode helper and, far away, a numeric lookup
  # table is not this.
  - id: js-runtime-assembled-http-endpoint
    desc: HTTP endpoint assembled from numeric arrays
    crit: suspicious
    conf: 0.93
    scope: leaf
    near_bytes: 900
    all:
      - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
    any:
      - id: micro-behaviors/communications/ip/construct::computed-octet-dot-separator
      - id: objectives/anti-static/obfuscation/encoding/ip-notation::ipv4-charcode-array

  # Require the handler input to enter the serialized POST body; an unrelated
  # numeric builder beside a state-only POST is insufficient.
  - id: js-numeric-endpoint-json-post
    desc: Numeric endpoint with input-object JSON POST
    crit: suspicious
    conf: 0.97
    for: [javascript]
    scope: file
    near_bytes: 2048
    all:
      - id: js-runtime-assembled-http-endpoint
      - id: micro-behaviors/communications/http/url/build::fetch-local-charcode-url-builder
      - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post

  # Rotation of the above: the host is a literal domain and only the scheme
  # separators arrive as character codes, so the octet builder never fires.
  # The concealment intent is the same -- a fetch callee whose URL helper
  # decodes its punctuation at runtime -- and the caller input still lands
  # in the serialized POST body, so require the same input-to-body binding.
  - id: js-veiled-domain-endpoint-json-post
    desc: Veiled-domain endpoint with input-object JSON POST
    crit: suspicious
    conf: 0.95
    for: [javascript]
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/url/build::fetch-local-charcode-url-builder
      - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
    unless:
      # The numeric-octet shape satisfies the same three legs; without this
      # the veiled finding also lands on numeric-endpoint builders, where
      # its description is wrong. A file carrying both shapes reads numeric.
      - id: objectives/anti-static/obfuscation/string/charcode-url::js-numeric-endpoint-json-post

  # The XOR-pair rotation of the endpoint builders above: the URL parts are
  # arrays of XOR-folded character codes decoded with fromCharCode, so neither
  # the scheme nor the host is visible as a literal, and the same file POSTs
  # to the result. Builder shape varies between kit builds, so this binds the
  # concealment and the request by proximity rather than by syntax tree.
  - id: js-xor-charcode-endpoint-post
    desc: XOR-folded char-code endpoint with POST
    crit: suspicious
    conf: 0.93
    for: [javascript]
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/arithmetic::js-xor-expression-array
      - id: micro-behaviors/data/string/conversion::fromcharcode-call
      - id: metadata/lang/source/syntax::single-fetch-call
      - id: micro-behaviors/communications/http/request/result::http-post-method
