defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-charcode-url-host-rewrite
    desc: Rewrites URL with fromCharCode strings
    crit: suspicious
    conf: 0.96
    attack: T1027
    if:
      type: tree-sitter
      language: javascript
      query: |
        (_
          (lexical_declaration
            (variable_declarator
              value: (call_expression
                function: (member_expression
                  object: (identifier) @string_object_1
                  property: (property_identifier) @char_method_1))))
          (lexical_declaration
            (variable_declarator
              value: (call_expression
                function: (member_expression
                  object: (identifier) @string_object_2
                  property: (property_identifier) @char_method_2))))
          (expression_statement
            (assignment_expression
              left: (identifier) @target
              right: (call_expression
                function: (member_expression
                  object: (identifier) @source
                  property: (property_identifier) @replace_method)))))
        (#eq? @string_object_1 "String")
        (#eq? @string_object_2 "String")
        (#eq? @char_method_1 "fromCharCode")
        (#eq? @char_method_2 "fromCharCode")
        (#eq? @replace_method "replace")
        (#eq? @target @source)
        (#match? @target "^(u|url|uri|href)$")
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/fixture::snapshot-file
