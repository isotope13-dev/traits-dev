defaults:
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
  platforms:
  - windows
  - unix
  crit: suspicious
traits:
- id: dense-fromcharcode
  desc: Dense fromCharCode calls (string obfuscation)
  conf: 0.9
  count_min: 5
  per_kb_min: 1.0
  if:
    type: string_literal
    regex: fromCharCode\s*\(\s*\d
  unless:
  - id: well-known/app/communication/thunderbird::firefox-source-tree-path
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
composite_rules:
- id: js-runtime-assembled-http-endpoint
  desc: HTTP endpoint assembled from numeric arrays
  conf: 0.93
  scope: leaf
  near_bytes: 900
  all:
  - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  any:
  - id: micro-behaviors/communications/ip/construct::computed-octet-dot-separator
  - id: objectives/anti-static/obfuscation/encoding/ip-notation::ipv4-charcode-array
- id: js-numeric-endpoint-json-post
  desc: Numeric endpoint with input-object JSON POST
  conf: 0.97
  for:
  - javascript
  scope: file
  near_bytes: 2048
  all:
  - id: js-runtime-assembled-http-endpoint
  - id: micro-behaviors/communications/url/construction/build-http::fetch-local-charcode-url-builder
  any:
  - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post
  - id: micro-behaviors/communications/http/request/payload::parameter-json-stringify-post
- id: js-veiled-domain-endpoint-json-post
  desc: Veiled-domain endpoint with input-object JSON POST
  conf: 0.95
  for:
  - javascript
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/url/construction/build-http::fetch-local-charcode-url-builder
  - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  unless:
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-numeric-endpoint-json-post
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-xor-charcode-endpoint-post
- id: js-xor-charcode-endpoint-post
  desc: XOR arrays with input POST to char-code URL
  conf: 0.97
  for:
  - javascript
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/arithmetic::js-xor-expression-array
  - id: micro-behaviors/communications/url/construction/build-http::fetch-local-charcode-url-builder
  - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post

- id: script-src-fromcharcode-url-loader
  desc: Script element source built from char codes
  crit: hostile
  conf: 0.98
  attack: T1027,T1105
  for:
  - javascript
  - html
  - text
  all:
  - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
  - id: micro-behaviors/data/string/conversion::fromcharcode-numeric-sequence
  near_bytes: 512
