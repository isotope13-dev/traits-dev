defaults:
  for: [javascript, typescript]
  attack: T1027
  platforms: [windows, unix]
traits:
  - id: dense-fromcharcode
    desc: Dense fromCharCode calls (string obfuscation)
    crit: suspicious
    conf: 0.9
    mbc: B0032
    count_min: 5
    per_kb_min: 1.0
    if:
      type: string_literal
      regex: fromCharCode\s*\(\s*\d
    unless:
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
  - id: fromcodepoint-with-base-decode
    desc: 'fromcodepoint with base decode'
    crit: notable
    conf: 0.9
    mbc: B0032
    if:
      type: text
      regex: from(CodePoint|CharCode).{0,40}(atob|Buffer\.from)
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/pdfjs::pdfjs-bundle
      - id: well-known/lib/format/pdfjs::pdfjs-pdfworker-class
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
      - type: text
        substr: fromCharCode(parseInt
composite_rules:
  - id: js-charcode-url-host-rewrite
    desc: Rewrites URL with fromCharCode strings
    crit: suspicious
    conf: 0.96
    scope: leaf
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/encode/char-code::multiple-fromcharcode-calls
      - id: micro-behaviors/data/string/replace::js-url-variable-self-replace
    unless:
      - id: well-known/dual-use/packaging/javascript-obfuscator::official-archive-context
      - id: well-known/dual-use/packaging/javascript-obfuscator::implementation-context
      - id: well-known/tool/development/lint/prettier/
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/fixture::snapshot-file
      - id: well-known/lib/ui/vite::vite-source-path
