defaults:
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
  platforms:
  - windows
  - unix
  crit: suspicious
traits:
- id: utf8-leading-byte-mask
  desc: UTF-8 leading byte mask
  crit: component
  if:
    type: text
    regex: '(?i)&\s*0xe0\s*\)\s*={2,3}\s*0xc0'
- id: utf16-high-surrogate
  desc: UTF-16 high surrogate constant
  crit: component
  if:
    type: text
    substr: '0xd800'
    case_insensitive: true
- id: utf16-low-surrogate
  desc: UTF-16 low surrogate constant
  crit: component
  if:
    type: text
    substr: '0xdc00'
    case_insensitive: true
- id: ascii-decoder-name
  desc: ASCII decoder helper name
  crit: component
  if:
    type: text
    word: decodeAscii
- id: ascii-high-bit-check
  desc: ASCII high bit check
  crit: component
  count_min: 5
  if:
    type: text
    regex: '&\s*0x80\b'
- id: js-utf8-decoder-helper-name
  desc: UTF-8 decoder helper name
  crit: component
  if:
    type: text
    regex: '\bdecoderReplacer\b|\bdecodeUTF8\b|\bdecodeUtf8\b'
- id: js-utf8-encoder-helper-name
  desc: UTF-8 encoder helper name
  crit: component
  if:
    type: text
    regex: '\bencoderReplacer\b|\bencodeUTF8\b|\bencodeUtf8\b'
- id: js-utf8-codec-api
  desc: UTF-8 encoding API reference
  crit: component
  if:
    type: text
    regex: '\bTextEncoder\b|\bTextDecoder\b|UTF-8|utf8'
- id: js-byte-codec-encode-helper
  desc: Byte encoding helper name
  crit: component
  if:
    type: text
    word: encodeBytes
- id: js-byte-codec-decode-helper
  desc: Byte decoding helper name
  crit: component
  if:
    type: text
    word: decodeBytes
- id: js-byte-codec-text-encoder
  desc: TextEncoder API name
  crit: component
  if:
    type: text
    word: TextEncoder
- id: js-byte-codec-text-decoder
  desc: TextDecoder API name
  crit: component
  if:
    type: text
    word: TextDecoder
- id: utf8-read-helper
  desc: UTF-8 read helper assignment
  crit: component
  if:
    type: text
    regex: '\butf8\.read\s*=\s*function\b'
- id: utf8-write-helper
  desc: UTF-8 write helper assignment
  crit: component
  if:
    type: text
    regex: '\butf8\.write\s*=\s*function\b'
- id: utf16-compress-helper
  desc: UTF-16 compression helper name
  crit: component
  if:
    type: text
    word: compressToUTF16
- id: utf16-decompress-helper
  desc: UTF-16 decompression helper name
  crit: component
  if:
    type: text
    word: decompressFromUTF16
- id: dense-fromcharcode-calls
  desc: Dense fromCharCode calls
  crit: component
  conf: 0.9
  count_min: 5
  per_kb_min: 1.0
  if:
    type: symbol
    kind: call
    # Require the invoked member, not a substring of a recovered chain.
    # Markdown parsed as JS can yield foo.fromCharCode.floor.prototype().
    # Count bare and dotted targets together without count-sensitive alternation.
    regex: '^(.*\.)?fromCharCode$'
  unless:
  - id: metadata/package/testing/harness/conformance::javascript-charcode-conformance-context
  - id: micro-behaviors/data/control-flow/assert::javascript-repeated-expecteq-assertions
  - id: metadata/package/testing/harness/language::actionscript-fromcharcode-edge-case-examples
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/testing/presence/harness::flash-conformance-trace-call
  - id: metadata/package/testing/presence/harness::flash-conformance-assertion-call
- id: dense-string-fromcharcode-calls
  desc: Dense String.fromCharCode call sites
  crit: component
  conf: 0.9
  count_min: 5
  per_kb_min: 1.0
  if:
    type: symbol
    kind: call
    exact: String.fromCharCode
  unless:
  - id: metadata/package/testing/harness/conformance::javascript-charcode-conformance-context
  - id: micro-behaviors/data/control-flow/assert::javascript-repeated-expecteq-assertions
  - id: metadata/package/testing/harness/language::actionscript-fromcharcode-edge-case-examples
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/testing/presence/harness::flash-conformance-trace-call
  - id: metadata/package/testing/presence/harness::flash-conformance-assertion-call
- id: dense-fromcharcode-literal-text
  desc: Dense numeric fromCharCode literal examples
  crit: component
  conf: 0.9
  count_min: 5
  per_kb_min: 1.0
  if:
    type: string_literal
    regex: fromCharCode\s*\(\s*\d
  unless:
  - id: metadata/package/testing/harness/conformance::javascript-charcode-conformance-context
  - id: micro-behaviors/data/control-flow/assert::javascript-repeated-expecteq-assertions
  - id: metadata/package/testing/harness/language::actionscript-fromcharcode-edge-case-examples
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/testing/presence/harness::flash-conformance-trace-call
  - id: metadata/package/testing/presence/harness::flash-conformance-assertion-call
- id: js-repeated-computed-value-assertions
  desc: Repeated computed-value assertions
  crit: component
  count_min: 5
  if:
    type: symbol
    kind: call
    exact: assertEqual
    args:
    - {index: 0, kind: call}
    - {index: 1, kind: string}
- id: js-numeric-fromcharcode-calls
  desc: Repeated numeric String.fromCharCode calls
  # Numeric calls alone also occur in language conformance tests. This is a
  # supporting indicator; composites must supply evidence of concealment.
  crit: component
  conf: 0.9
  attack: none
  mbc: none
  count_min: 5
  per_kb_min: 1.0
  if:
    type: symbol
    kind: call
    exact: String.fromCharCode
    arg: {index: 0, kind: number}
  unless:
  - id: metadata/package/testing/harness/conformance::javascript-charcode-conformance-context
  - id: micro-behaviors/data/control-flow/assert::javascript-repeated-expecteq-assertions
  - id: metadata/package/testing/harness/language::actionscript-fromcharcode-edge-case-examples
  - id: metadata/package/testing/presence/harness::flash-conformance-trace-call
  - id: metadata/package/testing/presence/harness::flash-conformance-assertion-call
  # Ignore Mozilla source trees and ActionScript files misclassified as JS.
  - type: path
    regex: '(firefox|thunderbird|mozjs)([_-]sys)?-[0-9][\w.-]{1,40}/|\.as$'
- id: js-high-density-numeric-fromcharcode-calls
  desc: High-density numeric fromCharCode calls
  # Keep the incoming candidate's strict density threshold as a separate
  # signal from the prepared batch's broader component and composite.
  crit: component
  conf: 0.9
  attack: none
  mbc: none
  count_min: 5
  per_kb_min: 30.0
  if:
    type: symbol
    kind: call
    exact: String.fromCharCode
    arg:
      index: 0
      kind: number
  unless:
  - id: well-known/app/communication/thunderbird::firefox-source-tree-path
composite_rules:
- id: utf8-byte-decoder
  desc: UTF-8 byte decoding with surrogate conversion
  crit: notable
  unless:
  - id: js-numeric-fromcharcode-calls
  all:
  - id: utf8-leading-byte-mask
  - id: utf16-high-surrogate
  - id: utf16-low-surrogate
- id: ascii-byte-decoder
  desc: ASCII byte decoder checks high bits
  crit: notable
  unless:
  - id: js-numeric-fromcharcode-calls
  all:
  - id: ascii-decoder-name
  - id: ascii-high-bit-check
- id: js-byte-codec-helper-pair
  desc: Names paired byte encoding and decoding helpers
  crit: notable
  near_bytes: 8192
  all:
  - id: js-byte-codec-encode-helper
  - id: js-byte-codec-decode-helper
  - id: js-byte-codec-text-encoder
  - id: js-byte-codec-text-decoder
- id: js-utf8-codec-helper-pair
  desc: Names paired UTF-8 decoder and encoder helpers
  crit: notable
  conf: 0.94
  scope: file
  near_bytes: 8192
  all:
  - id: js-utf8-decoder-helper-name
  - id: js-utf8-encoder-helper-name
  - id: js-utf8-codec-api
- id: utf8-read-write-codec-pair
  desc: Paired UTF-8 read and write helpers
  crit: notable
  near_bytes: 8192
  all:
  - id: utf8-read-helper
  - id: utf8-write-helper
  - id: js-utf8-codec-api
- id: utf16-compression-codec-pair
  desc: Names UTF-16 compression and decompression helpers
  crit: notable
  all:
  - id: utf16-compress-helper
  - id: utf16-decompress-helper
- id: dense-fromcharcode
  crit: notable
  desc: Dense fromCharCode calls or numeric examples in string literals
  conf: 0.9
  any:
  - id: dense-fromcharcode-calls
  - id: dense-string-fromcharcode-calls
  - id: dense-fromcharcode-literal-text
  - id: js-numeric-fromcharcode-calls
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: js-repeated-computed-value-assertions
  - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
  downgrade:
    any:
    - id: utf8-byte-decoder
    - id: ascii-byte-decoder
- id: js-runtime-assembled-http-endpoint
  desc: HTTP endpoint assembled from numeric arrays
  conf: 0.93
  scope: leaf
  near_bytes: 900
  all:
  - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  any:
  - id: micro-behaviors/communications/ip/construct::computed-octet-dot-separator
  - id: objectives/anti-static/obfuscation/encoding/ip-notation::ipv4-charcode-array
  - id: micro-behaviors/communications/ip/construct::integer-array-dot-join
- id: js-numeric-endpoint-json-post
  desc: Numeric endpoint with input-object JSON POST
  conf: 0.97
  for:
  - javascript
  scope: file
  near_bytes: 2048
  all:
  - id: js-runtime-assembled-http-endpoint
  - id: micro-behaviors/communications/url/construction/build-http::fetch-local-charcode-url-builder
  any:
  - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post
  - id: micro-behaviors/communications/http/request/payload::parameter-json-stringify-post
- id: js-charcode-builder-input-json-post
  desc: Char-code URL builder sends JSON input
  conf: 0.95
  for:
  - javascript
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/url/construction/build-http::fetch-local-charcode-url-builder
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  any:
  - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post
  - id: micro-behaviors/communications/http/request/payload::parameter-json-stringify-post
  unless:
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-numeric-endpoint-json-post
  - id: objectives/anti-static/obfuscation/string/charcode-url::js-xor-charcode-endpoint-post
- id: js-xor-charcode-endpoint-post
  desc: XOR arrays with input POST to char-code URL
  conf: 0.97
  for:
  - javascript
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/bitwise/xor-forms/scalar::js-xor-expression-array
  - id: micro-behaviors/communications/url/construction/build-http::fetch-local-charcode-url-builder
  - id: micro-behaviors/communications/http/request/payload::function-input-spread-json-post
- id: script-src-fromcharcode-url-loader
  desc: Script element source built from char codes
  crit: hostile
  conf: 0.98
  attack: T1027,T1105
  for:
  - javascript
  - html
  - text
  all:
  - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
  - id: micro-behaviors/data/string/conversion::fromcharcode-numeric-sequence
  near_bytes: 512
- id: charcode-tld-failover-self-removing-script-loader
  desc: Self-removing script splices char-code TLD
  crit: hostile
  conf: 0.98
  attack: T1027,T1105,T1568
  near_bytes: 1200
  all:
  - id: micro-behaviors/data/string/conversion::fromcharcode-call
  - id: micro-behaviors/communications/url/construction/fragment::url-authority-slash-slice-splice
  - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-src-bind
  - id: micro-behaviors/data/collection/dom::node-remove-call
