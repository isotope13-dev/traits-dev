# A Node HTTP request whose file decodes text through three stacked layers: a
# repeating-key XOR layer, a per-character code shift, and a string
# reversal. Libraries that talk to their own API leave the host readable; a
# shift-and-reverse pass on top of XOR exists to keep the destination out of
# static review. The legs are file-scoped and close together, so an unrelated
# Caesar demo elsewhere in a large bundle is not tied to a request.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: js-layered-decoded-http-host
    desc: Layered XOR, shift and reverse hide HTTP host
    crit: hostile
    conf: 0.95
    scope: file
    size_max: 262144
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-byte-array-xor-modulo-key-loop
    any:
      - id: micro-behaviors/data/decode/char-code::js-charcode-shift-then-reverse
      - id: micro-behaviors/data/decode/char-code::js-reverse-then-charcode-shift
    needs: 1
    unless:
      - id: metadata/path/directory::test-directory-component
      - id: metadata/build/bundler/asset::js-large-module-bundle
