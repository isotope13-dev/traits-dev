# The request verb or URL is assembled from character-code calls so the
# endpoint is absent from the file as text, and the response body is then
# executed as VBScript: the obfuscation hides where the code comes from.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1059.005,T1105

composite_rules:
  - id: vbs-char-coded-request-executes-response
    desc: Char-coded HTTP request whose reply is executed
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/encode/char-code::vbs-http-open-char-code-arguments
      - id: objectives/execution/payload/script-eval/network/response-body::vbs-http-response-execute
