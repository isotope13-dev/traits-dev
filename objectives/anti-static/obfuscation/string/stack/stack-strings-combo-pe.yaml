defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1027
  mbc: B0032
traits: []
composite_rules:
  - id: stack-obfuscated-dropper-profile
    desc: Obfuscated dropper with stack strings and hidden capabilities
    crit: hostile
    conf: 0.92
    all:
      - id: objectives/anti-static/obfuscation/string/stack::stack-string-obfuscated-pe
      - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
    any:
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present
      - id: micro-behaviors/os/privilege/manifest::highest-available
      - id: metadata/binary/code/complexity::over-100kb-at-most-5-functions
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: well-known/lib/native/pybind11::pybind11-marker
    downgrade:
      any:
        - id: metadata/binary/code/complexity::many-functions
        - id: metadata/binary/installer/family/
        - id: well-known/app/data/qdrant::application-bundle
  - id: obfuscated-monolithic-code-blob
    desc: Large code blob with minimal functions and stack strings
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/data/string/assembly::many-stack-materialized-strings
      - id: metadata/binary/code/complexity::over-100kb-at-most-5-functions
      - id: metadata/binary/section/ratio::pe-largest-section-65-percent
    unless:
      - id: metadata/binary/framework/
      - id: metadata/signed/platform/
      - id: well-known/lib/native/pybind11::pybind11-marker
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: well-known/app/media/mpv/
        - id: well-known/app/data/qdrant::application-bundle
