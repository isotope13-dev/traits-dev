defaults:
  platforms: [linux, windows]
  for: [elf, pe, dll]
  attack: T1027
  crit: suspicious

traits:
  # A population of specialized XOR-to-NUL string reconstruction helpers,
  # rather than a single symmetric buffer transform or compiler constant.
  - id: repeated-xor-string-decoders
    desc: Repeated XOR string reconstruction helpers
    conf: 0.95
    count_min: 8
    if:
      id: micro-behaviors/data/decode/xor::x86-bounded-xor-string-decoder
