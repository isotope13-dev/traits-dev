defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1027
  mbc: B0032
traits:
  - id: many-stack-strings
    desc: Many stack-constructed strings detected
    crit: component
    conf: 0.85
    size_min: 51200
    count_min: 30
    if:
      type: encoded
      encoding: stack
      regex: ".{4,}"
    unless:
      - id: metadata/binary/framework/
      - id: well-known/app/ai/tool-server/mcu-ai-debug/
  - id: random-alphanumeric-stack-strings
    desc: Random alphanumeric stack string cluster
    crit: suspicious
    conf: 0.88
    size_min: 51200
    count_min: 15
    if:
      type: encoded
      encoding: stack
      regex: "^[A-Z0-9_]{10,}"
    unless:
      - id: metadata/binary/framework/
      # FFmpeg filter and device libraries build long constant-name tables as
      # stack strings. ProductName is the version-resource identity, not a
      # string a packer can satisfy with one imported symbol.
      - id: well-known/lib/media/ffmpeg::ffmpeg-product-versioninfo
      # MinGW libstdc++ builds digit lookup tables with stack stores.
      - id: well-known/lib/platform/libstdcxx::libstdcxx-runtime-basename
      # PyTorch's Intel XPU backend builds SYCL symbol tables as stack stores.
      - id: well-known/lib/ai/pytorch::pytorch-xpu-native-library
      # MIOpen's kernel-name tables are stack stores in the ROCm library.
      - id: well-known/lib/ai/miopen::miopen-native-library
    downgrade:
      any:
        - id: metadata/binary/code/complexity::many-functions
        - id: well-known/lib/web/dioxus
        - id: metadata/signed/platform/
        - id: well-known/tool/development/lint/biome/
composite_rules:
  - id: stack-string-obfuscated-pe
    desc: PE with heavy stack string obfuscation
    crit: suspicious
    conf: 0.9
    all:
      - id: many-stack-strings
    any:
      - id: random-alphanumeric-stack-strings
      - id: metadata/binary/header/malformed::low-function-count-marker
      # NOTE: dynamic-self-resolution-imports (GetProcAddress + GetModuleHandle)
      # was removed as a qualifying arm — it is present in a large fraction of
      # benign DLLs (e.g. native libs embedding a model-name registry like
      # Datalevin's jniDTLV.dll) and pairing it with stack strings produced FPs.
      # Genuine obfuscation still trips via the random-alnum / low-function arms.
    unless:
      - id: metadata/binary/framework/
      - id: well-known/lib/media/ffmpeg::ffmpeg-product-versioninfo
      - id: well-known/lib/ai/pytorch::pytorch-xpu-native-library
      - id: well-known/lib/ai/miopen::miopen-native-library
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/development/lint/biome/
  - id: recognized-stack-string-marker
    desc: Recognized marker for compiler-generated stack strings
    crit: component
    conf: 0.9
    any:
      - id: metadata/binary/code/complexity::many-functions
      - id: well-known/lib/web/dioxus
      - id: well-known/app/media/mpv::application-bundle
      - id: well-known/app/data/qdrant::application-bundle
      - id: well-known/dual-use/tunnel/swifttunnel_vpn::swifttunnel
      - id: well-known/game/mod::wynncraft-overhaul-installer
      - id: well-known/lib/native/pybind11::pybind11-marker
      - id: micro-behaviors/data/db/postgresql::rust-sqlx-postgres-client
      - id: micro-behaviors/data/db/sql::sql-generic
      - id: well-known/lib/ui/
      - id: well-known/app/ai/tool-server/mcu-ai-debug::helper-binary
      - id: well-known/tool/development/lint/biome/
