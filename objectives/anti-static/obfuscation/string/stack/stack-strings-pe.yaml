defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: random-alphanumeric-stack-strings
  desc: Repeated alphanumeric stack strings
  crit: notable
  conf: 0.88
  size_min: 51200
  count_min: 15
  if:
    type: encoded
    encoding: stack
    regex: ^([A-Z]*[0-9]){3}[A-Z0-9]{6,}$
    not:
    - regex: ^[A-F0-9]+$
composite_rules:
- id: stack-string-obfuscated-pe
  desc: PE with many stack-materialized strings
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/string/assembly::many-stack-materialized-strings
  any:
  - id: random-alphanumeric-stack-strings
  - id: metadata/binary/header/malformed::low-function-count-marker
