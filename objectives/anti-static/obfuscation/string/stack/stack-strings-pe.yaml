defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1027
  mbc: B0032
traits:
- id: random-alphanumeric-stack-strings
  desc: Random alphanumeric stack string cluster
  crit: suspicious
  conf: 0.88
  size_min: 51200
  count_min: 15
  if:
    type: encoded
    encoding: stack
    regex: ^([A-Z]*[0-9]){3}[A-Z0-9]{6,}$
    not:
    - regex: ^[A-F0-9]+$
  unless:
  - id: metadata/binary/framework/
  - id: compiler-constant-stack-libraries
  - id: metadata/package/tooling::lite-xl-binary
  downgrade:
    any:
    - id: metadata/binary/code/complexity::many-functions
    - id: well-known/lib/web/client-side/dioxus
    - id: metadata/signed/platform/
    - id: well-known/tool/development/lint/biome/
    - id: well-known/tool/development/cli/pylon/
    - id: metadata/lang/compiler/systems::rustc-path
composite_rules:
- id: compiler-constant-stack-libraries
  desc: Compiler constant-table native libraries
  crit: exception
  conf: 0.95
  any:
  - id: well-known/lib/media/ffmpeg::ffmpeg-product-versioninfo
  - id: well-known/lib/platform/libstdcxx::libstdcxx-runtime-basename
  - id: well-known/lib/ai/pytorch::pytorch-xpu-native-library
  - id: well-known/lib/ai/miopen::miopen-native-library
  - id: well-known/lib/media/sharp-libvips::sharp-libvips-binary
  - id: well-known/lib/ai/ggml::ggml-runtime-strings-pe
- id: stack-string-obfuscated-pe
  desc: PE with heavy stack string obfuscation
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/string/assembly::many-stack-materialized-strings
  any:
  - id: random-alphanumeric-stack-strings
  - id: metadata/binary/header/malformed::low-function-count-marker
  unless:
  - id: metadata/binary/framework/
  - id: compiler-constant-stack-libraries
  - id: metadata/package/tooling::lite-xl-binary
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: well-known/tool/development/lint/biome/
    - id: well-known/tool/development/cli/pylon/
    - id: metadata/lang/compiler/systems::rust-binary
- id: recognized-stack-string-marker
  desc: Recognized marker for compiler-generated stack strings
  crit: component
  conf: 0.9
  any:
  - id: metadata/binary/code/complexity::many-functions
  - id: well-known/lib/web/client-side/dioxus
  - id: well-known/app/media/mpv::application-bundle
  - id: well-known/app/data/qdrant::application-bundle
  - id: well-known/dual-use/tunnel/swifttunnel_vpn::swifttunnel
  - id: well-known/game/mod::wynncraft-overhaul-installer
  - id: well-known/lib/native/pybind11::pybind11-marker
  - id: micro-behaviors/data/db/postgresql::rust-sqlx-postgres-client
  - id: micro-behaviors/data/db/sql::sql-generic
  - id: well-known/lib/ui
  - id: well-known/app/ai/tool-server/mcu-ai-debug::helper-binary
  - id: well-known/tool/development/lint/biome/
  - id: well-known/tool/development/cli/pylon/
