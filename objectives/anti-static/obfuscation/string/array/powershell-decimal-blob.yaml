# A PowerShell byte array declared as a long run of decimal literals. Real
# data tables are short; a multi-kilobyte run is an embedded payload that the
# script decodes at run time.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.009
traits:
  - id: powershell-decimal-byte-array-blob
    desc: PowerShell byte array of 300+ decimal literals
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[[Bb]yte\[\]\]\s*\$\w+\s*=\s*(\d{1,3},){300}'
