# Hex-escaped strings paired with indexed writes to browser globals conceal
# property identities. This does not establish a redirect or credential theft.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
composite_rules:
  - id: hex-table-computed-browser-writes
    desc: Hex table with computed browser property writes
    crit: suspicious
    conf: 0.95
    attack: T1027
    mbc: B0032
    near_bytes: 4000
    all:
      - id: metadata/lang/encoding/shape::javascript-hex-escape-string-table
      - id: micro-behaviors/data/property/assign::string-table-document-property-write
      - id: micro-behaviors/data/property/assign::string-table-window-property-write
