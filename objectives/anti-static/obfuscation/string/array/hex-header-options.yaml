# Bind the hex decoder and table to the actual Axios POST options. The
# headers key, X-prefixed name and value are all hidden behind decoded slots.
# This is header concealment, not authentication or exfiltration.
# No endpoint, header name/value, exported name or filename identifies it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: hex-table-concealed-http-x-header
    desc: Hex table conceals Axios X-header options
    crit: suspicious
    conf: 0.98
    attack: T1027
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration name: (identifier) @decoder
            parameters: (formal_parameters . (identifier) @hex .)
            body: (statement_block . (return_statement (call_expression
              function: (member_expression object: (identifier) @input
                property: (property_identifier) @replace)
              arguments: (arguments . (regex) @pairs . (arrow_function
                parameter: (identifier) @byte
                body: (call_expression function: (member_expression
                  object: (identifier) @String property: (property_identifier) @charcode)
                  arguments: (arguments . (call_expression function: (identifier) @parse
                    arguments: (arguments . (identifier) @parsed . (number) @radix .)) .))) .))) .))
          (lexical_declaration (variable_declarator name: (identifier) @table
            value: (array . (_)
              . (call_expression function: (identifier) @decode_module
                arguments: (arguments . (string) @axios .))
              . (call_expression function: (identifier) @decode_method
                arguments: (arguments . (string) @post .)) . (_)
              . (call_expression function: (identifier) @decode_headers
                arguments: (arguments . (string) @headers .))
              . (call_expression function: (identifier) @decode_name
                arguments: (arguments . (string) @name .))
              . (call_expression function: (identifier) @decode_value
                arguments: (arguments . (string) @value .)))))
          (expression_statement (assignment_expression right: (arrow_function
            body: (call_expression function: (member_expression object:
              (call_expression function: (subscript_expression object:
                (call_expression function: (subscript_expression object:
                  (call_expression function: (identifier) @require
                    arguments: (arguments . (subscript_expression
                      object: (identifier) @module_table index: (number) @module_index) .))
                  index: [
                    (subscript_expression object: (identifier) @method_table index: (number) @method_index)
                    (array . (subscript_expression object: (identifier) @method_table index: (number) @method_index) .)])
                  arguments: (arguments . (_) . (_) . (object
                    (pair key: (computed_property_name (subscript_expression
                      object: (identifier) @headers_table index: (number) @headers_index))
                      value: (object (pair key: (computed_property_name (subscript_expression
                        object: (identifier) @name_table index: (number) @name_index))
                        value: (subscript_expression object: (identifier) @value_table
                          index: (number) @value_index))))) .))
                index: (_)) arguments: (arguments . (_) .))
              property: (property_identifier)) arguments: (arguments)))))) @request
          (#eq? @hex @input) (#eq? @replace "replace") (#eq? @pairs "/../g")
          (#eq? @String "String") (#eq? @charcode "fromCharCode")
          (#eq? @parse "parseInt") (#eq? @byte @parsed) (#eq? @radix "16")
          (#eq? @decoder @decode_module) (#eq? @decoder @decode_method)
          (#eq? @decoder @decode_headers) (#eq? @decoder @decode_name)
          (#eq? @decoder @decode_value)
          (#match? @axios "^[\"']6178696[fF]73[\"']$")
          (#match? @post "^[\"']706[fF]7374[\"']$")
          (#match? @headers "^[\"']68656164657273[\"']$")
          (#match? @name "^[\"'](58|78)2[dD]([0-9A-Fa-f]{2})+[\"']$")
          (#match? @value "^[\"']([0-9A-Fa-f]{2})*[\"']$")
          (#eq? @require "require")
          (#eq? @table @module_table) (#eq? @module_index "1")
          (#eq? @table @method_table) (#eq? @method_index "2")
          (#eq? @table @headers_table) (#eq? @headers_index "4")
          (#eq? @table @name_table) (#eq? @name_index "5")
          (#eq? @table @value_table) (#eq? @value_index "6"))
