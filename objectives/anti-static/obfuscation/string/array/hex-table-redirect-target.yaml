# The redirect target lives only inside a hex-escaped string table (as a
# URL or as base64 of one) and is assigned to window.location through table
# indices: hiding a destination this way has no purpose but concealment.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: hex-table-concealed-redirect-target
    desc: Redirect target concealed in hex string table
    crit: hostile
    conf: 0.94
    attack: T1027
    near_bytes: 4000
    all:
      - id: metadata/lang/encoding/shape/escape::javascript-hex-escape-string-table
      - id: micro-behaviors/ui/window/navigation/location::hex-table-indexed-location-assignment
      - id: micro-behaviors/communications/url/encoded::string-literal-http-or-base64-url
