defaults:
  platforms:
  - windows
  for:
  - javascript
traits:
- id: js-anon-return-token-array
  desc: Repeated anonymous return token stubs
  crit: suspicious
  conf: 0.97
  size_min: 50000
  count_min: 500
  if:
    type: text
    regex: \(function \w+\(\)\{return "[A-Za-z0-9]{2,4}"
- id: js-gp-token-array
  desc: Dense gp token array
  crit: notable
  conf: 0.96
  size_min: 50000
  count_min: 200
  if:
    type: text
    substr: '("x", '
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
- id: js-gp-concat-array-rebuild
  desc: gp concat rebuild from token array
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: gp = gp['c'+"o"+'n'+"ca"+"t"](gc0[an]);
- id: js-concat-gp-accumulator
  desc: gp array concat rebuild
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: an = an['c'+"o"+'n'+"ca"+"t"](gp[xu]);
- id: js-char-map-assignment-burst
  desc: Dense char map assignments
  crit: suspicious
  conf: 0.93
  size_min: 50000
  count_min: 40
  if:
    type: text
    substr: =('d', '
- id: js-f000-return-token-array
  desc: Repeated f000 token-return stubs
  crit: suspicious
  conf: 0.96
  size_min: 50000
  count_min: 200
  if:
    type: text
    substr: (function f000(){return "
- id: js-accumulator-remap-eval
  desc: Token remap loop into eval buffer
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: \w+\s*=\s*\w+\s*\+\s*\w+;\s*}\s*eval\(\w+\)
- id: js-hex-char-var-burst
  desc: Burst of hex-char var assignments
  crit: suspicious
  conf: 0.95
  size_min: 40000
  count_min: 40
  if:
    type: text
    regex: var\s+\w{1,4}\s*=\s*'\\x[0-9a-f]{2}'
    case_insensitive: true
- id: js-array-plus-equals-eval-buffer
  desc: Array-index eval buffer rebuild
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: \+=\s*\w+\[\w+\];[\s\S]{0,80}eval\(\w+\)
  unless:
  - id: metadata/path::test-directory-component
- id: js-do-while-array-rebuild
  desc: Do-while array rebuild loop
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: do\s*\{[\s\S]{0,96}\w+\s*=\s*\w+\s*\+\s*\w+\[\w+\];
- id: js-do-while-array-length-guard
  desc: Do-while length-guarded rebuild
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: \}\s*while\s*\(\w+\s*<\s*\w+\["length"\]\);
- id: js-hex-array-constructor
  desc: Hex escape array constructor
  crit: suspicious
  conf: 0.95
  size_min: 20000
  if:
    type: text
    regex: new Array\("\\x[0-9a-f]{2}"
    case_insensitive: true
- id: js-index-multiplier-array-burst
  desc: Dense numeric multiplier index array
  crit: notable
  conf: 0.95
  size_min: 20000
  count_min: 40
  if:
    type: text
    regex: \d+\*1,\d+\*1,\d+\*1,\d+\*1
  unless:
  - id: metadata/lang/generated::automatically-generated-text
- id: js-comment-buried-script-body
  desc: Comment-heavy JavaScript source body
  crit: notable
  conf: 0.92
  size_min: 20000
  size_max: 120000
  if:
    type: metrics
    field: comments.to_code_ratio
    min: 30.0
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/build
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/lib/crypto/sdk/
  - id: well-known/lib/network/novnc::source-context
  - type: basename
    regex: \.(tar\.)?xz$
  - type: basename
    regex: \.min\.js$
  - type: text
    substr: '@generated by protoc-gen-es'
- id: js-comment-blob-layout-large
  desc: Giant comment-dominant script blob
  crit: notable
  conf: 0.95
  size_min: 120000
  if:
    type: metrics
    field: comments.to_code_ratio
    min: 50.0
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/build
- id: js-markdown-ts-fence
  desc: Markdown TypeScript fence
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '```ts'
- id: js-object-token-hex-map
  desc: Object token map with hex closures
  crit: suspicious
  conf: 0.97
  size_min: 50000
  count_min: 40
  if:
    type: text
    regex: '"\w{2,4}": \[3, \(function \w+\(\)\{return "\\x[0-9a-f]{2}"'
- id: js-object-token-plus-equals
  desc: Object token map eval rebuild
  crit: component
  conf: 0.97
  if:
    type: text
    regex: \w+ \+= \w+\[\w+\]\[1\];
composite_rules:
- id: js-comment-exec-recognized-marker
  desc: Recognized comment-heavy JavaScript marker
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/build/bundler/wrapper::js-umd-wrapper
  - id: metadata/build/minifier::js-umd-wrapper-minified
  - id: metadata/build/bundler/wrapper::js-umd-wrapper-amd
  - id: metadata/build/minifier::js-umd-wrapper-amd-minified
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/bundler/asset::js-any-bundle-output
  - id: metadata/build/bundler/runtime::webpack-bundled
  - id: metadata/package/documentation/docstring::javadoc-comment
  - id: metadata/file/extension/identity::js-min-or-map-basename
  - id: js-markdown-ts-fence
- id: js-do-while-array-rebuild-loop
  desc: Length-guarded do-while array rebuild
  crit: suspicious
  conf: 0.98
  all:
  - id: js-do-while-array-rebuild
  - id: js-do-while-array-length-guard
- id: js-token-remap-reconstruction
  desc: Token-array remap reconstruction
  crit: suspicious
  conf: 0.98
  any:
  - id: js-f000-return-token-array
  - id: js-anon-return-token-array
  all:
  - id: metadata/lang/encoding/shape::short-token-hex-character-map
  - id: js-accumulator-remap-eval
- id: js-comment-token-remap-reconstruction
  desc: Comment-hidden token remap reconstruction
  crit: suspicious
  conf: 0.99
  all:
  - id: js-anon-return-token-array
  - id: metadata/lang/encoding/shape::short-token-hex-character-map
  - id: js-accumulator-remap-eval
  - id: metadata/file/comment::multiple-code-like-comments
  any:
  - id: js-comment-buried-script-body
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-dense-javascript-hex-escapes
- id: js-cc-array-reconstruction
  desc: Comment-hidden hex map array reconstruction
  crit: suspicious
  conf: 0.97
  all:
  - id: js-hex-char-var-burst
  - id: metadata/file/comment::multiple-code-like-comments
  any:
  - id: metadata/lang/source/syntax/assignment/name::js-repeated-indexed-concat-assignment
  - id: js-array-plus-equals-eval-buffer
  - id: js-do-while-array-rebuild
  - id: js-do-while-array-rebuild-loop
  - id: js-comment-buried-script-body
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-dense-javascript-hex-escapes
- id: js-cc-gp-array-reconstruction
  desc: Comment-hidden gp token array reconstruction
  crit: suspicious
  conf: 0.98
  all:
  - id: js-gp-token-array
  - id: js-gp-concat-array-rebuild
  - id: metadata/file/comment::multiple-code-like-comments
  any:
  - id: js-char-map-assignment-burst
  - id: js-comment-blob-layout-large
- id: js-index-remap-array-reconstruction
  desc: Hex array, indexed concatenation and eval
  crit: suspicious
  conf: 0.98
  all:
  - id: js-hex-array-constructor
  - id: micro-behaviors/data/collection/array::js-nested-index-concat
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  any:
  - id: js-index-multiplier-array-burst
  - id: micro-behaviors/data/collection/array::js-long-integer-array-literal
  - id: metadata/lang/source/literal/array::repeated-large-integer-arrays
  unless:
  - id: metadata/build
  - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
- id: js-cc-object-token-reconstruction
  desc: Comment-hidden object token reconstruction
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/process/interpreter/scripting::jscript-cc-on
  - id: js-object-token-hex-map
  - id: js-object-token-plus-equals
  - id: metadata/file/comment::multiple-code-like-comments
  any:
  - id: micro-behaviors/data/string/split::js-large-bracket-hyphen-split
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-dense-javascript-hex-escapes
