defaults:
  conf: 0.66
  platforms: [windows, linux, macos]
  for: [c, cpp, elf, macho, pe]
traits:
- id: strings-char-array
  desc: Character array initialized with numeric values
  crit: notable
  conf: 0.66
  mbc: B0032
  attack: T1027
  # Keep the declaration anchored at the start of a source line and require
  # plain `char`: matching the substring inside `unsigned char` turns ordinary
  # audio, Unicode, and phoneme lookup tables into string-obfuscation
  # findings. Require at least six printable character codes; short API/test
  # arrays and length tables must not match.
  if:
    type: text
    regex: '(^|\n)\s*(static |const )*char \w+\[\]\s*=\s*\{([4-9]\d|1[0-2]\d)(,\s*\d{1,3}){5,}'
