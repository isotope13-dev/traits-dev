defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp, elf, macho, pe]
traits:
- id: strings-char-array
  desc: String obfuscation via char array
  crit: suspicious
  conf: 0.66
  mbc: B0032
  attack: T1027
  # At least four numeric elements are required. Keep the declaration anchored
  # at the start of a source line and require plain `char`: matching the
  # substring inside `unsigned char` turns ordinary audio, Unicode, and
  # phoneme lookup tables into string-obfuscation findings. A hidden string
  # needs repeated plain-char numeric arrays, not a single numeric table.
  if:
    type: text
    regex: '(^|\n)\s*(static )?(const )?char \w+\[\]\s*=\s*\{\s*\d{1,3}(,\s*\d{1,3}){3,}'
  unless:
  - type: path
    regex: '(^|[\\/])lib[\\/]dns[\\/]name\.c$'
  - id: well-known/lib/nss::nss-crypto-test-data
  count_min: 10
- id: strings-hex-raw
  desc: Hex-encoded string patterns
  crit: notable
  conf: 0.66
  count_min: 10
  if:
    type: text
    regex: \\x[0-9a-fA-F]{2}\\x[0-9a-fA-F]{2}\\x[0-9a-fA-F]{2}\\x[0-9a-fA-F]{2}
  not:
  # An escape run whose every byte has the high bit set is non-ASCII *text* —
  # the portable way to embed CJK/Cyrillic/emoji literals in C without relying
  # on the compiler's source encoding (CaboCha, MeCab, nkf, libiconv, ICU,
  # charset tables). Obfuscated ASCII payloads and shellcode always mix in
  # bytes below 0x80, so those runs still match.
  - regex: '^(\\x[89a-fA-F][0-9a-fA-F])+$'
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/package/testing/
  - id: metadata/lang/source::linux-kernel-source-tree-path
  - type: text
    substr: "\\bw"
  # Test/fixture/mock source files commonly carry hex-escape vectors; one
  # combined basename exclusion (kept inline — this is an atomic trait).
  - type: basename
    regex: '^(regress|tests?_|_test|fixture|mock)|\.(test|spec)\.'
    case_insensitive: true
  downgrade:
    any:
    - id: well-known/lib/xml2
    - id: well-known/lib/xslt
