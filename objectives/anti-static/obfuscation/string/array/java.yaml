# Java code that spells an identifier out one character at a time inside an
# inline `new char[]{'U','s','e','r',...}` construction, so the finished string
# ("User-Agent", "AES/ECB/PKCS5Padding", a class or parameter name) never
# appears in the source or the constant pool. Declared lookup tables
# (`static final char[] HEX = {'0','1',...}`) are shaped differently — the
# matcher requires the brace to follow `char[]` directly, which is the inline
# construction form, and three separate six-element runs in one file is past
# what delimiter sets and test fixtures produce.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala]
  attack: T1027
  mbc: E1027

traits:
  - id: java-char-array-string-hiding
    desc: Java strings hidden in char arrays
    crit: suspicious
    conf: 0.88
    count_min: 3
    if:
      type: text
      regex: 'char\[\]\s*\{\s*(''.''\s*,\s*){5}'
    unless:
      - id: well-known/lib/runtime/openjdk::bundled-jdk-src-context
