# Advanced String Array Obfuscation - JavaScript
# Detects sophisticated string array obfuscation patterns used in malware
# MBC: B0032 (Obfuscated Files or Information)
# ATT&CK: T1027
defaults:
  platforms: [windows, unix]
  mbc: B0032
  for: [javascript, typescript]
traits:
  - id: typescript-expect-annotation
    desc: TypeScript expect annotation helper
    crit: component
    conf: 0.9
    if:
      type: text
      regex: "\\$Expect(Error|Type)\\b"

  # Large random variable names (>30 chars) typical of obfuscators
  - id: large-random-variables
    desc: Large random variable names (obfuscation)
    crit: suspicious
    conf: 0.75
    attack: "T1027"
    per_kb_min: 0.1
    downgrade:
      any:
        - id: well-known/lib/ui/videojs/
        - id: well-known/tool/development/vscode/svelte/
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler::has-sourcemap
      - type: metrics
        field: identifiers.avg_entropy
        max: 3.0
      - type: basename
        regex: '(^|[-_.])(test|tests|spec)\.[cm]?[jt]sx?$'
    if:
      type: text
      regex: "\\b(var|let|const)\\s+[_$A-Za-z][_$A-Za-z]{0,15}[0-9_$][A-Za-z0-9$]{24,}\\b"
    not:
      # Three or more camelCase word boundaries: a name mangler emits opaque
      # runs, not word-segmented ones. Generated SDK clients are long by
      # convention -- Mistral's Speakeasy output declares
      # `AgentsApiV1ConversationsGetRequest$outboundSchema`.
      - regex: '[a-z][A-Z][A-Za-z0-9$]{0,40}[a-z][A-Z][A-Za-z0-9$]{0,40}[a-z][A-Z]'
      - substr: WIN_BUILD_CONPTY_SUPPORTED
      - substr: Hydrat
      - regex: '\b[A-Za-z0-9_$]{20,}(Abi|Address)\b'
      # SCREAMING_SNAKE_CASE is how humans name constants, never how a name
      # mangler emits identifiers -- `const CONTEXT_WAITFORELEMENTSTOBEINDOM`
      # is long, but it is not random.
      - regex: '^(var|let|const)\s+[A-Z][A-Z0-9_$]*$'
  # String array with hexadecimal indexing patterns
  - id: string-array-hex-index
    desc: Repeated obfuscator-style hex array indexing
    crit: suspicious
    conf: 0.85
    attack: "T1027"
    count_min: 10
    per_kb_min: 0.5
    if:
      type: text
      regex: "\\b\\w{0,12}_0x[0-9a-fA-F]{3,}\\[\\s*0x[0-9a-fA-F]{2,4}\\s*\\]"
    not:
      - substr: ESCAPE_SEQUENCES[
      # PDF implementations use the standard PDFDocEncoding table in the
      # same indexed form; this is a format lookup table, not concealed
      # strings. Filter only those matches, preserving unrelated evidence in
      # a source file that happens to contain a PDF helper.
      - regex: '(?i)pdfdocencoding'
    unless:
      - id: metadata/package/files/system-package::debian-missing-sources-vendored-crate
      - type: text
        regex: "\\b(String\\.)?fromCharCode\\s*\\("
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/library/structure/
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: metadata/package/files/system-package::julia-runtime-path
      - id: well-known/lib/ai/ggml
      - id: well-known/lib/native/hpc
  # String assignment to array with hex indices
  - id: bracket-concat-rebuild
    desc: Bracket-notation array concat rebuild pattern
    crit: component
    conf: 0.6
    attack: "T1027"
    if:
      type: text
      regex: \['concat'\]\(\w+\[\w+\]\)
  - id: hex-array-assignment
    desc: Hex array index assignment pattern
    crit: suspicious
    conf: 0.88
    attack: "T1027"
    count_min: 3
    if:
      type: text
      # Require the literal `0x` prefix, as the `string-array-hex-index`
      # sibling does. Without it, any short key whose letters happen to be
      # hex digits qualified: `["C11"]`/`["C17"]` compiler-standard maps,
      # `["404"]` status tables, `["de"]`/`["fa"]`/`["ca"]` locale maps.
      regex: "\\[\\s*['\"]0x[0-9a-fA-F]{2,4}['\"]\\s*\\]\\s*=\\s*['\"][^'\"]{1,120}['\"]"
    unless:
      - id: metadata/library/structure/
  # String array declaration with large obfuscated variable names.
  #
  # The name length was doing all the work and it does not mean what the trait
  # says: a 21-character identifier is far more often *descriptive* than
  # machine-generated. AngularJS's dependency-injection annotation style —
  # `var ngIncludeFillContentDirective = ['$compile', function(...){}]`,
  # `var ngTranscludeDirective = ['$compile', ...]` — matched three times over
  # and rated stock angular.js an obfuscated string array. (Note obfuscator.io's
  # own arrays are named `_0x1a2b`, well under 20 characters, so length was
  # never selecting for the real thing.)
  #
  # What separates the two is the array, not the name: an obfuscation string
  # table is a run of string literals, whereas a DI annotation is one string
  # followed by the function it annotates. Requiring a second consecutive
  # string element keeps every real string table and drops the DI form. The
  # long `unless:` list below predates this and is now mostly redundant.
  - id: obfuscated-string-array
    desc: Obfuscated string array declaration
    crit: suspicious
    conf: 0.82
    attack: "T1027"
    count_min: 3
    if:
      type: text
      regex: "var\\s+[A-Za-z][A-Za-z0-9$]{20,}\\s*=\\s*\\[\\s*(['\"][^'\"]{1,60}['\"]\\s*,\\s*){2}"
    not:
      - substr: _default =
      - regex: 'var\s+[a-z][a-zA-Z]*(?:Collection|Extensions?|Types?)\s*=\s*\['
      # Published component libraries export prop enum tables as ES module vars
      # (e.g. progressStepBarPropSize=["s","xs","m"]). Obfuscator string tables
      # are never exported and use machine names without camelCase word breaks.
      - regex: 'var\s+[a-z][a-z0-9$]*([A-Z][a-z0-9$]*){2,}\s*=\s*\[\s*[''"]'
    unless:
      - id: well-known/lib/ui/react::library-identity
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: well-known/lib/core/geeviz::package-context
      - id: well-known/lib/core/geeviz::package-path
      - id: well-known/lib/format/json-ts/
      - id: metadata/library/structure/
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/package/files/dependency::node-modules-path
      - id: well-known/tool/development/yarn::yarn-cli-bundle-marker
  # Multiple concatenated string literals (typical in deobfuscation)
  - id: zod-schema-description-concat
    desc: Zod schema description text
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '\.describe\s*\([^)]{0,600}\+\s*["'']'
  - id: prompt-fragment-marker
    desc: Prompt fragment marker
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '<(plan-mode|web-search)>'
  - id: self-defending-regex
    desc: Self-defending regex guard string
    crit: suspicious
    conf: 0.94
    attack: "T1027"
    if:
      type: string_literal
      exact: "(((.+)+)+)+$"
  - id: constructor-string-split
    desc: Split constructor string access
    crit: suspicious
    conf: 0.94
    attack: "T1027"
    if:
      type: text
      substr: "['constructo'+'r']"
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: metadata/build/bundler::vscode-extension-output-path
      - id: well-known/app/development/vscode-extension/dbcode::extension-context
  - id: inline-font-data-uri
    desc: Inline font data URI asset
    crit: baseline
    if:
      type: text
      regex: 'data:font/[a-z0-9.+-]+;base64,'
  - id: repeated-numeric-array-string-decoding
    desc: Repeated numeric arrays decoded to strings
    crit: suspicious
    conf: 0.92
    count_min: 2
    if:
      type: text
      regex: 'String\.fromCharCode\s*\(\s*\.\.\.\s*\[\s*\d{2,3}(\s*,\s*\d{2,3}){3,}\s*\]'
    unless:
      - id: metadata/package/testing/harness/runtime/

composite_rules:
  - id: typescript-annotation-marker
    desc: TypeScript declaration or expect marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: typescript-expect-annotation

  # Advanced string array obfuscation composite
  - id: advanced-string-array-obfuscation
    desc: Advanced string array obfuscation pattern
    crit: suspicious
    conf: 0.92
    attack: "T1027"
    needs: 2
    any:
      - id: large-random-variables
      - id: string-array-hex-index
      - id: hex-array-assignment
      - id: obfuscated-string-array
    all:
      - id: micro-behaviors/data/source/string::massive-string-concatenation
  # String deobfuscation routine
  - id: string-deobfuscation-routine
    desc: String deobfuscation routine
    crit: hostile
    conf: 0.95
    attack: "T1027.002"
    all:
      - id: large-random-variables
      - id: string-array-hex-index
      - id: micro-behaviors/data/source/string::massive-string-concatenation
    any:
      - id: hex-array-assignment
      - id: micro-behaviors/data/source/syntax/array::computed-index-hex-array-access
    unless:
      - id: well-known/tool/development/pymobiledevice3
  - id: self-defending-string-array
    desc: Self-defending string-array obfuscation
    crit: suspicious
    conf: 0.97
    attack: "T1027"
    needs: 2
    any:
      - id: advanced-string-array-obfuscation
      - id: string-array-hex-index
      - id: micro-behaviors/data/source/syntax/array::computed-index-hex-array-access
      - id: constructor-string-split
      - id: self-defending-regex
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: metadata/build/bundler::vscode-extension-output-path
      - id: well-known/app/development/vscode-extension/dbcode::extension-context
  - id: hex-array-near-indexed-charcode-decoder
    desc: Hex array near indexed character decoder
    crit: suspicious
    conf: 0.94
    attack: T1027.002
    for: [javascript]
    # Large bundles often contain an unrelated character decoder thousands of
    # bytes away from a numeric table. Require the table and decoder to belong
    # to one compact reconstruction routine.
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/encode/arrays::js-hex-number-array
      - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array
    # Test vectors commonly place ciphertext arrays near a helper that converts
    # the independently decrypted output to text. Proximity alone is not data
    # flow, so do not infer string obfuscation in an identified test harness.
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: obfuscated-browser-xhr-client
    desc: Obfuscated browser XHR client
    crit: hostile
    conf: 0.94
    attack: "T1027"
    all:
      - id: string-array-hex-index
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/encoding/hex::mixed-hex-decimal
    needs: 1
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/library/structure/
