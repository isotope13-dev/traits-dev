# Bind a real hex-pair decoder to string-table construction and to a table
# used as a computed method name. Neither hex data nor bracket calls alone
# establish concealment. The method names, indexes and helper names may vary.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: hex-decoded-table-method-dispatch
    desc: Hex-decoded table supplies computed methods
    crit: suspicious
    conf: 0.96
    attack: T1027
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration name: (identifier) @decoder
            parameters: (formal_parameters . (identifier) @input .)
            body: (statement_block . (return_statement (call_expression
              function: (member_expression object: (identifier) @source
                property: (property_identifier) @replace)
              arguments: (arguments . (regex) @pairs . (arrow_function
                parameter: (identifier) @pair
                body: (call_expression function: (member_expression
                  object: (identifier) @string property: (property_identifier) @char)
                  arguments: (arguments . (call_expression
                    function: (identifier) @parse
                    arguments: (arguments . (identifier) @parsed . (number) @radix .)) .))) .))) .))
          (lexical_declaration (variable_declarator name: (identifier) @table
            value: (array .
              (call_expression function: (identifier) @decode1
                arguments: (arguments . (string) @hex1 .))
              . (call_expression function: (identifier) @decode2
                arguments: (arguments . (string) @hex2 .)))))
          (expression_statement (assignment_expression
            left: (member_expression object: (identifier) @export_object
              property: (property_identifier) @export_property)
            right: (arrow_function
            body: (call_expression function: (member_expression object:
              (call_expression function: (subscript_expression
                index: [
                  (subscript_expression object: (identifier) @used_table)
                  (array . (subscript_expression object: (identifier) @used_table) .)
                ])))))))) @concealment
          (#eq? @input @source) (#eq? @replace "replace") (#eq? @pairs "/../g")
          (#eq? @string "String") (#eq? @char "fromCharCode")
          (#eq? @parse "parseInt") (#eq? @pair @parsed) (#eq? @radix "16")
          (#eq? @decoder @decode1) (#eq? @decoder @decode2)
          (#match? @hex1 "^[\"']([0-9a-fA-F]{2}){2,}[\"']$")
          (#match? @hex2 "^[\"']([0-9a-fA-F]{2}){2,}[\"']$")
          (#eq? @table @used_table) (#eq? @export_object "module")
          (#eq? @export_property "exports"))
