defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  # Require actual RC4/computed-COM concealment, rather than allowing ordinary
  # generated names to stand in for it. The other legs supply remote-script
  # execution context. Neither WSF packaging nor download success is required.
  - id: rc4-com-remote-powershell-launch
    desc: RC4-concealed COM with remote PowerShell launch clues
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/string/array::rc4-hex-calls-computed-activex
      - id: micro-behaviors/communications/http/url/path::executable-url-reference-b
      - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
    # Any COM HTTP client supplies the remote-fetch context; WinHTTP is not
    # an MSXML variant, so it is listed beside the MSXML composite.
    any:
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-http-variants
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-fragment
