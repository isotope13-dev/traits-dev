defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: B0032
  attack: T1027
traits:
- id: php-escaped-global-string-table
  desc: PHP escaped global string table
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'GLOBALS.{0,20}=array\("\\x[0-9a-fA-F]{2}\\x[0-9a-fA-F]{2}'
composite_rules:
- id: php-escaped-string-table-obfuscation
  desc: PHP escaped string table obfuscation
  crit: suspicious
  conf: 0.94
  all:
  - id: objectives/anti-static/obfuscation/encoding/hex::php-heavy-hex-escape-density
  - id: metadata/lang/source/syntax/call/arguments::php-numeric-argument-call-density
  any:
  - id: php-escaped-global-string-table
  - id: micro-behaviors/data/control-flow/return::php-return-global-table-entry
  - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
- id: php-packed-string-table-dispatch
  desc: PHP packed string table dispatch
  crit: suspicious
  conf: 0.96
  all:
  - id: php-escaped-string-table-obfuscation
  - id: metadata/file/line::php-line-at-least-5000
  any:
  - id: metadata/lang/source/function::php-many-short-function-lines
  - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
