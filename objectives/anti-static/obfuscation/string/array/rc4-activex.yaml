defaults:
  platforms: [windows]
  for: [html]
  attack: T1027

composite_rules:
  # Co-occurrence supports concealment, but does not bind a decoder's output
  # to any particular COM class or establish downloading or execution.
  - id: rc4-hex-calls-computed-activex
    desc: RC4 and hex calls accompany computed ActiveX construction
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: objectives/anti-static/obfuscation/name-mangling/function-name::hex-named-hex-argument-call
      - id: micro-behaviors/os/com/automation::script-computed-activex-object
