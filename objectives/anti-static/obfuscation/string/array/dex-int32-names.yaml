# Dalvik code that spells a loader-internal name out one code point per int
# (`sd(new int[]{100, 97, 108, 118, ...})` in Java). The compiler stores each
# such array as a fill-array-data payload with 4-byte elements, so the name
# never enters the string table or the constant pool; only the payload bytes
# below give it away. A class-name prefix or classloader field spelled this
# way is how an Application stub keeps `dalvik.system.InMemoryDexClassLoader`,
# `pathList` and `dexElements` out of static string and descriptor scans.
defaults:
  platforms: [android]
  for: [dex]
  attack: T1027
  mbc: E1027

traits:
  - id: dex-int32-classloader-names
    desc: Dalvik classloader names spelled as int arrays
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: >-
        (64 00 00 00 61 00 00 00 6C 00 00 00 76 00 00 00 69 00 00 00 6B 00 00 00 2E 00 00 00
        | 64 00 00 00 65 00 00 00 78 00 00 00 45 00 00 00 6C 00 00 00 65 00 00 00 6D 00 00 00 65 00 00 00 6E 00 00 00 74 00 00 00 73 00 00 00
        | 70 00 00 00 61 00 00 00 74 00 00 00 68 00 00 00 4C 00 00 00 69 00 00 00 73 00 00 00 74 00 00 00)
