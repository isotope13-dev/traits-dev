defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  # Hex-escaped method-name tables hide the identities of computed calls.
  # Co-occurrence is sufficient for an obfuscator pattern, not proof that a
  # particular table supplies a particular callee or that the payload is hostile.
  - id: hex-table-indexed-method-dispatch
    desc: Hex string table accompanies computed property calls
    crit: suspicious
    conf: 0.94
    attack: T1027
    near_bytes: 1500
    all:
      - id: metadata/lang/encoding::javascript-hex-escape-string-table
      - id: micro-behaviors/data/control-flow/dispatch::js-computed-property-call
