# A VB builder that hides a payload in generated stub source: Base64 the
# file, deal its characters round-robin into N strings (every Nth character
# per string), then write VB text declaring each `Dim <name><n> As String`
# and a `Strings.Mid(<name><n>, i, 1)` expression that re-interleaves them at
# run time. The payload never appears contiguously in the output.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027
  mbc: B0032

traits:
  - id: vb-emits-numbered-string-declaration
    desc: VB writes numbered Dim-As-String source
    crit: suspicious
    conf: 0.9
    if:
      # "dim name" + j + " as string= """ -- the declaration is output text.
      type: text
      regex: '(?i)"dim\s+\w+"\s*[+&]\s*\w+\s*[+&]\s*"\s*as\s+string\s*='
  - id: vb-emits-mid-reassembly-source
    desc: VB writes Mid() re-interleave source text
    crit: suspicious
    conf: 0.9
    if:
      # " & Strings.Mid(name" + j + ", i, 1)" -- a Mid call being generated.
      type: text
      regex: '(?i)"\s*&\s*(Strings\.)?Mid\(\w+"\s*[+&]\s*\w+\s*[+&]\s*",\s*\w+,\s*1\)"'

composite_rules:
  - id: vb-interleaved-payload-stub-builder
    desc: VB builds stub source from interleaved file Base64
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/encode/base64/content::dotnet-file-bytes-to-base64
      - id: vb-emits-numbered-string-declaration
      - id: vb-emits-mid-reassembly-source
