defaults:
  for:
  - vbs
  platforms:
  - windows
traits:
- id: vbs-fragmented-curl-path
  desc: Reconstructs fragmented curl executable path
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)Join\(Array\([^\r\n)]{0,90}"cu","rl\.exe"\),""\)
- id: vbs-fragmented-tar-path
  desc: Reconstructs fragmented tar executable path
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)Join\(Array\([^\r\n)]{0,90}"ta","r\.exe"\),""\)
composite_rules:
- id: vbs-fragmented-curl-tar-paths
  desc: Reconstructs curl and tar from filename fragments
  crit: suspicious
  conf: 0.98
  all:
  - id: vbs-fragmented-curl-path
  - id: vbs-fragmented-tar-path
