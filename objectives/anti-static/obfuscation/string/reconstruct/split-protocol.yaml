defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  # Half of a split "https://" / "http://" marker — incomplete alone; only
  # meaningful when composed below (or with host/URL reconstruction evidence).
  - id: partial-protocol-tps
    desc: Obfuscated HTTP protocol fragment 'tps:/'
    crit: component
    conf: 0.95
    if:
      type: text
      regex: (?i)["']tps:[:/]["']
  - id: partial-protocol-tp
    desc: Obfuscated HTTP protocol fragment 'tp:/'
    crit: component
    conf: 0.95
    if:
      type: text
      regex: (?i)["']tp:[:/]["']

composite_rules:
  - id: split-http-protocol-fragment
    desc: HTTP scheme split across string fragments
    crit: notable
    conf: 0.9
    any:
      - id: partial-protocol-tps
      - id: partial-protocol-tp
