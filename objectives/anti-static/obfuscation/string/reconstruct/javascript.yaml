defaults:
  platforms: [windows, unix]
traits:
  - id: js-string-key-array
    desc: Array initialized with short strings
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new\s+Array\((\s*[''"][^"'']{2,5}[''"]\s*,?){5,}\)'
  - id: js-string-key-array-literal
    desc: Array literal with short string keys
    crit: suspicious
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'var\s+\w+\s*=\s*\[\s*"__\w{2,4}"'
    unless:
      - id: well-known/lib/web/vue::library-comp
  - id: js-nested-array-table-mapping-dup
    desc: Nested array structure used for table mapping
    crit: suspicious
    conf: 0.8
    for: [javascript]
    size_max: 512000
    count_min: 3
    if:
      type: tree-sitter
      language: javascript
      query: "(array\n  (array)\n  (array)\n)"
  - id: js-indexed-short-token-grid
    desc: Dense indexed short-token grid
    crit: suspicious
    conf: 0.92
    size_max: 256000
    for: [javascript]
    count_min: 80
    if:
      type: text
      regex: \[\d+\]\[\d+\]='[0-9a-z]{1,2}'
  - id: js-augmented-identifier-append
    desc: JavaScript accumulator appends identifier
    crit: notable
    conf: 0.85
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (augmented_assignment_expression
          operator: "+="
          right: (identifier))
  - id: charcode-built-dom-tag-name
    desc: DOM element tag built from char codes
    for: [javascript, typescript, html]
    crit: suspicious
    conf: 0.93
    attack: T1027
    if:
      # `document.createElement(String.fromCharCode(115,99,114,105,112,116))`
      # spells "script" a character at a time, so a scan for `createElement`
      # with a script tag finds nothing. The tag name is a fixed string the
      # author chose to hide; nothing legitimate computes it.
      type: text
      regex: '(?i)createElement\s*\(\s*String\.fromCharCode'
composite_rules:
  - id: js-extreme-short-token-density
    desc: Extreme density of short tokens
    crit: notable
    conf: 0.9
    size_max: 2097152
    for:
      - javascript
      - typescript
    all:
      - id: metadata/file/string/count::string-count-over-10000
      - id: metadata/file/data-blob::js-max-string-length-short
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/build/bundler/asset::js-dist-asset-bundle
      - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: js-indexed-array-string-reconstruction
    desc: Indexed array string reconstruction
    crit: suspicious
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/control-flow/analysis::js-map-typeof-string-branch
      - id: micro-behaviors/data/control-flow/analysis::js-map-conditional-index-lookup
      - id: micro-behaviors/data/control-flow/analysis::js-map-result-empty-join
    near_lines: 3
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/build/bundler/asset::js-dist-asset-bundle
      - id: metadata/build/bundler/asset::js-hashed-bundle-basename
      - id: well-known/lib/web/chunk::next-static-js-chunk
  - id: js-string-deobfuscation-recognized-marker
    desc: Recognized marker for JavaScript string deobfuscation indicators
    crit: component
    conf: 0.95
    any:
      - id: well-known/lib/web/jquery::license-url
      - id: well-known/lib/web/jquery::header-prefix
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/bundler/asset::js-any-bundle-output
      - id: well-known/lib/web/ecmascript::core-js-runtime-bundle
      - id: well-known/lib/web/ecmascript::google-web-runtime-bundle
      - id: well-known/lib/network/upload-clients::tus-js-client-bundle
      - id: well-known/lib/ai/mediapipe::mediapipe-selfie-distribution-js
      - id: well-known/tool/development/mobile/pymobiledevice3
  - id: js-string-deobfuscation
    desc: String deobfuscation routine
    crit: suspicious
    conf: 0.9
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    size_max: 300000
    all:
      - id: objectives/anti-static/obfuscation/string/array::js-array-join-symbol
    # Array operations and charAt are routine in arithmetic libraries. Require
    # encoded-string evidence as well as joining, rather than counting several
    # ordinary array methods from the same directory as independent signals.
    any:
      - id: objectives/anti-static/obfuscation/string/charcode-url::dense-fromcharcode
      - id: objectives/anti-static/obfuscation/string/encoding::dense-unicode-escapes
      - id: micro-behaviors/data/encode/hex::js-dense-hex-escapes
    unless:
      # A minified bundle splits, joins, swaps array entries and indexes with
      # charAt in unrelated helpers all day; the shape is native to bundler
      # output. `js-string-deobfuscation-recognized-marker` above was written
      # to say so and nothing referenced it, and referencing it expands past
      # the suppression budget, so the webpack identity is named directly --
      # Notion's `.webpack/main/SqliteServer.js` is terser-minified webpack.
      - id: metadata/build/minifier::js-webpack-bundle-minified
      - id: metadata/build/minifier::js-webpack-minified-module-call
      # Sanitizer test tables embed adversarial encoded strings as inert
      # data in *.test.* files outside tests/. js-obfuscated-eval takes
      # this rule as an any-leg, so this also quiets its test-file echo.
      - id: metadata/package/testing/harness/runtime/
    downgrade:
      any:
        - id: metadata/build/
  - id: js-dict-string-reconstruction
    desc: JavaScript string reconstructed from dictionary lookup and array iteration
    crit: suspicious
    conf: 0.9
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    all:
      - id: micro-behaviors/data/encode/map::js-string-dict-map
    any:
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-string-key-array
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-string-key-array-literal
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-extreme-short-token-density
  - id: js-dict-reconstruction-eval
    desc: Dictionary-rebuilt payload executed with eval
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    all:
      - id: objectives/execution/interpreter/eval/dynamic/
      - id: js-dict-string-reconstruction
  - id: js-xor-numeric-array-string-reconstruction
    desc: Reconstructs JavaScript strings from XOR-decoded numeric arrays
    crit: suspicious
    conf: 0.97
    attack: T1027
    for: [javascript]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
    # Decimal and hexadecimal byte arrays are equivalent carrier forms. The
    # decoder relationship, not the source radix, is the obfuscation signal.
    any:
      - id: micro-behaviors/data/encode/char-code::long-numeric-array-literal
      - id: micro-behaviors/data/encode/arrays::js-hex-number-array
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
      - id: well-known/lib/format/jspdf/
      - id: well-known/lib/format/pdfjs/
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems::go-binary
