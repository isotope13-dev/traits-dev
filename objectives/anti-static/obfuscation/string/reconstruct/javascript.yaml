defaults:
  platforms: [windows, unix]
traits:
  - id: js-string-key-array
    desc: Array initialized with short strings
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new\s+Array\((\s*[''"][^"'']{2,5}[''"]\s*,?){5,}\)'
  - id: js-string-key-array-literal
    desc: Array literal with short string keys
    crit: suspicious
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'var\s+\w+\s*=\s*\[\s*"__\w{2,4}"'
  - id: js-nested-array-table-mapping-dup
    desc: Nested array structure used for table mapping
    crit: suspicious
    conf: 0.8
    for: [javascript]
    size_max: 512000
    count_min: 3
    if:
      type: tree-sitter
      language: javascript
      query: "(array\n  (array)\n  (array)\n)"
  - id: js-indexed-short-token-grid
    desc: Dense indexed short-token grid
    crit: suspicious
    conf: 0.92
    size_max: 256000
    for: [javascript]
    count_min: 80
    if:
      type: text
      regex: \[\d+\]\[\d+\]='[0-9a-z]{1,2}'
  - id: js-string-count-extreme
    desc: Extreme JavaScript string count
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: metrics
      field: strings.count
      min: 10000
  - id: js-max-string-length-short
    desc: JavaScript strings capped at five
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: metrics
      field: strings.max_length
      max: 5
  - id: js-empty-string-accumulator
    desc: JavaScript empty-string accumulator initializer
    crit: component
    conf: 0.85
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (variable_declaration
          (variable_declarator
            value: (string) @init))
        (#match? @init "^(\"\"|'')$")

  - id: js-augmented-identifier-append
    desc: JavaScript accumulator appends identifier
    crit: component
    conf: 0.85
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (augmented_assignment_expression
          operator: "+="
          right: (identifier))
composite_rules:
  - id: js-extreme-short-token-density
    desc: Extreme density of short tokens
    crit: notable
    conf: 0.9
    size_max: 2097152
    for:
      - javascript
      - typescript
    all:
      - id: js-string-count-extreme
      - id: js-max-string-length-short
    unless:
      - id: metadata/library/structure::js-known-bundler-output
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure::js-dist-asset-bundle
      - id: metadata/build/bundler::js-hashed-bundle-basename
  - id: js-indexed-array-string-reconstruction
    desc: Indexed array string reconstruction
    crit: suspicious
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/control-flow/analysis::js-map-typeof-string-branch
      - id: micro-behaviors/data/control-flow/analysis::js-map-conditional-index-lookup
      - id: micro-behaviors/data/control-flow/analysis::js-map-result-empty-join
    near_lines: 3
    unless:
      - id: metadata/library/structure::js-known-bundler-output
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure::js-dist-asset-bundle
      - id: metadata/build/bundler::js-hashed-bundle-basename
      - id: metadata/library/nextjs::next-static-js-chunk
