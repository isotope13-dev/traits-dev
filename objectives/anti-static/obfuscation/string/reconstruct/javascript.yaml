defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-string-key-array-literal
  desc: Array literal of 8+ short __ keys
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: var\s+\w+\s*=\s*\[\s*"__\w{2,4}"(\s*,\s*"__\w{2,4}"){7}
  unless:
  - id: well-known/lib/web/client-side/vue::library-comp
- id: js-indexed-short-token-grid
  desc: Dense indexed short-token grid
  crit: suspicious
  conf: 0.92
  size_max: 256000
  for:
  - javascript
  count_min: 80
  if:
    type: text
    regex: \[\d+\]\[\d+\]='[0-9a-z]{1,2}'
- id: charcode-built-dom-tag-name
  desc: DOM element tag built from char codes
  for:
  - javascript
  - typescript
  - html
  crit: suspicious
  conf: 0.93
  attack: T1027
  if:
    type: text
    regex: (?i)createElement\s*\(\s*String\.fromCharCode
composite_rules:
- id: js-extreme-short-token-density
  desc: Extreme density of short tokens
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  all:
  - id: metadata/file/profile/string-population::string-count-over-10000
  - id: metadata/file/profile/string-population::source-string-length-at-most-five
- id: js-indexed-array-string-reconstruction
  desc: Indexed array string reconstruction
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/data/collection/map::js-map-typeof-string-branch
  - id: micro-behaviors/data/collection/map::js-map-conditional-index-lookup
  - id: micro-behaviors/data/string/concat/join::js-map-result-empty-join
  near_lines: 3
- id: js-string-deobfuscation
  desc: Escaped source uses indexed character-code reconstruction
  crit: suspicious
  conf: 0.9
  mbc: B0032
  attack: T1027.002
  for:
  - javascript
  size_max: 300000
  all:
  - id: micro-behaviors/data/string/concat/join::js-empty-separator-join-text
  - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
  any:
  - id: objectives/anti-static/obfuscation/string/charcode-url::dense-fromcharcode
  - id: metadata/lang/encoding/unicode-escape::js-three-unicode-escapes
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  unless:
  - id: metadata/build/minifier::js-webpack-bundle-minified
  - id: metadata/build/minifier::js-webpack-minified-module-call
- id: js-dict-string-reconstruction
  desc: JavaScript string reconstructed from dictionary lookup and array iteration
  crit: suspicious
  conf: 0.9
  mbc: B0032
  attack: T1027.002
  for:
  - javascript
  all:
  - id: micro-behaviors/data/encode/map::js-short-key-character-entry
  any:
  - id: metadata/lang/source/literal/array::js-short-string-array-constructor
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-string-key-array-literal
  - id: objectives/anti-static/obfuscation/string/reconstruct::js-extreme-short-token-density
- id: js-dict-reconstruction-eval
  desc: Dictionary-rebuilt payload executed with eval
  crit: suspicious
  conf: 0.95
  mbc: B0032
  attack: T1027.002
  for:
  - javascript
  all:
  - id: js-dict-string-reconstruction
  any:
  - id: objectives/execution/interpreter/eval/dynamic/
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-window-named
- id: js-base64-xor-delimited-string-reconstruction
  desc: Base64 decoding and XOR character rebuilding occur nearby
  crit: suspicious
  conf: 0.97
  attack: T1027
  for:
  - javascript
  scope: file
  near_bytes: 512
  all:
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
