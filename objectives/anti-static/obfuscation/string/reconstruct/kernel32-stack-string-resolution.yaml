# Kernel32 loader API stack-string resolution.
#
# Loaders hide CreateProcessW / VirtualProtectEx / LoadLibraryExA by building
# the names on the stack (often as run-on concatenations such as
# MapViewOfFileCreateProcessW). Legitimate PEs import these via the IAT; a
# stack-only surface plus GetProcAddress is the classic hidden-API pattern.
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1027.007"
  mbc: "B0032"

traits:
  - id: stack-mapview-createprocess-runon
    desc: MapViewOfFile+CreateProcessW run-on stack string
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: MapViewOfFileCreateProcessW

  - id: stack-virtualprotectex-name
    desc: VirtualProtectEx name without IAT import
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: VirtualProtectEx
    # Inline symbol/import unless fails to suppress in analyze; trait refs work.
    unless:
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      # Go's x/sys/windows package embeds lazy-procedure name tables. A plain
      # API name in that table is not evidence of stack-string reconstruction.
      - id: metadata/lang/compiler/systems::go-binary-comp

  - id: stack-loadlibraryexa-name
    desc: LoadLibraryExA name without IAT import
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: LoadLibraryExA
    unless:
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
      - id: well-known/lib/platform/parcel-watcher::parcel-watcher-native-addon
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: well-known/game/beamng::beamng-drive-identity

composite_rules:
  - id: kernel32-loader-api-stack-cluster
    desc: Kernel32 loader APIs built as stack strings
    crit: suspicious
    conf: 0.97
    needs: 2
    any:
      - id: stack-mapview-createprocess-runon
      - id: stack-virtualprotectex-name
      - id: stack-loadlibraryexa-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/node-runtime::windows-runtime-identity
      # A .NET self-contained publish appends the whole runtime after the host
      # stub, so the CLR's own loader and injection primitives are shipped bytes,
      # not this program's behaviour. GitVersion 5.1.3 (a 45MB apphost bundle in a
      # RubyGem) read as a stack-string loader, a hollowing chain and an injector.
      - id: metadata/binary/framework::dotnet-runtime-host-stub

  - id: hidden-kernel32-loader-api-resolution
    desc: Kernel32 loader APIs resolved via stack strings not IAT
    crit: hostile
    conf: 0.97
    attack: "T1027.007,T1106"
    all:
      - id: kernel32-loader-api-stack-cluster
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/data/embedded/payload/header::pe-e-lfanew-read-x64
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # A .NET self-contained publish appends the whole runtime after the host
      # stub, so the CLR's own loader and injection primitives are shipped bytes,
      # not this program's behaviour. GitVersion 5.1.3 (a 45MB apphost bundle in a
      # RubyGem) read as a stack-string loader, a hollowing chain and an injector.
      - id: metadata/binary/framework::dotnet-runtime-host-stub
      # Do not exclude on metadata/binary/framework/: native MSVC CRT embeds
      # mscoree.dll for CorExitProcess and falsely trips mscoree-name.
