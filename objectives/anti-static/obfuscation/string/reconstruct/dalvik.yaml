traits:
  - id: replicated-dalvik-xor-char-decoders
    desc: Repeated Dalvik XOR character decoders
    crit: suspicious
    conf: 0.94
    platforms: [android]
    for: [dex]
    attack: T1027
    count_min: 8
    if:
      type: hex
      # Repetition of this decoder loop across a DEX is deliberate string
      # concealment. A lone character transform remains a neutral capability.
      pattern: '4A ?? ?? ?? (B7 ?? | 97 ?? ?? ??) 8E ?? 50 ?? ?? ??'
