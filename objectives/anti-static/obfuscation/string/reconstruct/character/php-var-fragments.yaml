defaults:
  platforms: [unix, windows]
  for: [php, javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  - id: numbered-fragment-variable-set
    desc: Many numbered string-fragment variables
    crit: suspicious
    conf: 0.9
    count_min: 20
    if:
      # The leading `[^\n]{0,4}` lets the assignment sit behind the `*/` that
      # closes the decoy comment it is hidden in.
      type: text
      # The `$` must not continue an identifier (`peg$c100` in generated
      # parsers is one name, not a PHP variable).
      regex: '(?m)^([^\n]{0,3}[^\w$\n])?\$[a-z]{1,3}[0-9]{2,4}\s*=\s*[''"][^''"\r\n]'
