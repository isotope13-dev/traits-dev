defaults:
  platforms:
    - windows
    - unix
traits:
  - id: charcode-built-dom-tag-name
    desc: DOM element tag built from char codes
    for:
      - javascript
      - typescript
      - html
    crit: suspicious
    conf: 0.93
    attack: T1027
    if:
      type: text
      regex: (?i)createElement\s*\(\s*String\.fromCharCode
composite_rules:
  - id: js-extreme-short-token-density
    desc: Extreme density of short tokens
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    all:
      - id: metadata/lang/source/literal/string/population::string-count-over-10000
      - id: metadata/lang/source/literal/string/population::source-string-length-at-most-five
  - id: js-string-deobfuscation
    desc: Escaped source uses indexed character-code reconstruction
    crit: suspicious
    conf: 0.9
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    size_max: 300000
    all:
      - id: micro-behaviors/data/string/concat/join::js-empty-separator-join-text
      - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
    any:
      - id: objectives/anti-static/obfuscation/string/charcode-url::dense-fromcharcode
      - id: metadata/lang/encoding/unicode-escape::js-three-unicode-escapes
      - id: metadata/lang/encoding/hex::js-dense-hex-escapes
    unless:
      - id: micro-behaviors/data/encode/base64/primitive::js-only-charcode-is-utf8-base64-encoder
      - id: metadata/build/minifier::js-webpack-bundle-minified
      - id: metadata/build/minifier::js-webpack-minified-module-call
      # Codepage tables are escape-string data decoded by index.
      - id: well-known/lib/format/sheetjs-xlsx::sheetjs-codepage-table-build
