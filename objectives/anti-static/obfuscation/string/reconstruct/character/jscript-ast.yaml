defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-var-sequence-init-ast
    size_max: 128000
    desc: Variable initialized from string sequence
    crit: notable
    conf: 0.95
    count_min: 10
    # Expected-output and Xcode specification files may be parsed as JS.
    unless:
      - type: basename
        regex: '(?i)\\.(exp|xcspec)$'
    if:
      type: text
      regex: '[\w$]\s*=\s*\(\s*["''][^"''\n]{0,64}["'']\s*,\s*["'']'
  - id: js-dynamic-property-concat
    size_max: 65536
    desc: Property access using concatenated strings
    crit: notable
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '\[\s*["''][^"''\n]{0,64}["'']\s*\+\s*["''][^"''\n]{0,64}["'']\s*\]'
