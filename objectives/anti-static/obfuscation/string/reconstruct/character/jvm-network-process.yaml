defaults:
  for: [jar, class]
  platforms: [unix, windows]
composite_rules:
  - id: jvm-encoded-strings-with-network-client
    desc: Encoded JVM constants accompany network client
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: metadata/file/encoding/container::java-control-prefixed-long-string
      - id: metadata/import/framework::jvm-url-class-ref
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-class-forname-bytecode
    any:
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::jvm-many-xor-character-stores
      - id: jvm-many-subtract-character-stores
  - id: jvm-encoded-strings-with-process-builder
    desc: Encoded JVM constants accompany process builder
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: metadata/file/encoding/container::java-control-prefixed-long-string
      - id: metadata/binary/symbols/name/process::java-processbuilder-bytecode
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-class-forname-bytecode
    any:
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::jvm-many-xor-character-stores
      - id: jvm-many-subtract-character-stores
