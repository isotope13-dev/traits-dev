defaults:
  for: [class]
  platforms: [windows, unix]
  attack: T1027
traits:
  - id: jvm-many-xor-character-stores
    desc: Many XOR-derived character array stores
    crit: suspicious
    conf: 0.96
    count_min: 40
    if:
      type: hex
      pattern: '82 92 55'
  - id: jvm-many-subtract-character-stores
    desc: Many difference-derived character array stores
    crit: suspicious
    conf: 0.96
    count_min: 40
    if:
      type: hex
      pattern: '64 92 55'
