# Strings built by editing a decoy string with chained Remove/Insert calls,
# so the final text never appears literally. Two chained edits occur in
# ordinary string handling; the obfuscators repeat them dozens of times.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.010
traits:
  - id: powershell-insert-remove-string-chain
    desc: PowerShell Remove/Insert string edit chains
    crit: notable
    conf: 0.85
    count_min: 20
    if:
      type: text
      regex: '\.Remove\(\d+,\s*\d+\)\.Insert\(\d+,\s*.[^'']{0,12}.\)'
