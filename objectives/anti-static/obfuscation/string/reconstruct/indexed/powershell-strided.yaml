# Strided byte extraction hides a payload inside an interleaved carrier
# (an installer stream, a padded buffer, a fake image). The script reads
# every stride-th byte at a fixed offset -- and optionally reverses the
# result -- to reassemble content that never appears contiguously in the
# file. Beside manual PE header parsing this is de-interleaved image
# staging; the composite below claims only that pairing.
defaults:
  attack: T1027
  mbc: B0032
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-strided-byte-extraction
    desc: PowerShell extracts bytes at a strided offset
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\$\w+\[\s*(\d{1,5}|\$\w+)\s*\+\s*\(\s*\$\w+\s*\*\s*\$\w+\s*\)\s*\+\s*\$\w+\s*\]'
composite_rules:
  - id: powershell-strided-image-reconstruction
    desc: Strided extraction reassembles a mapped PE image
    crit: hostile
    conf: 0.94
    attack: T1027,T1620
    near_lines: 120
    all:
      - id: powershell-strided-byte-extraction
      - id: micro-behaviors/data/parse/portable-executable::powershell-pe-header-manual-parse
