defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: dense-comma-operator-string-pairs
    # Require each pair to occur as an array element. The previous bare
    # `("a","b")` regex also matched ordinary two-argument calls, so color
    # formatters and repeated API examples looked like reconstruction tables.
    # The pair must close after the second string: a comma expression
    # `("junk","x")` yields "x", while wider tuples such as the C# rows
    # `("light", "Light", null, true, false)` in a Razor view are data.
    desc: Dense array string-sequence pairs
    crit: suspicious
    conf: 0.95
    count_min: 10
    per_kb_min: 2.0
    if:
      type: text
      regex: '[,\[]\s*\(\s*["''][^"''\r\n]{1,12}["'']\s*,\s*["''][^"''\r\n]{1,12}["'']\s*\)'
    unless:
      - id: metadata/lang/source/language::elm-language-source
      - id: metadata/lang/source/language::haskell-language-source
      - id: micro-behaviors/data/db/write::sql-insert-into-statement
  - id: wv-array
    desc: Character array using comma tuples
    crit: suspicious
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: 'var\s+\w+\s*=\s*\[\s*\(\s*["''][^"'']{1,120}["'']\s*,\s*\w+\s*\)\s*,'
    unless:
      - id: well-known/tool/development/toolchain/links-lang::links-language-source
      - id: metadata/lang/source/language::elm-language-source
      - id: metadata/lang/source/language::haskell-language-source
  - id: reconstruction-loop
    # Same concat-split property pattern as array-eval; assignment form is
    # still ordinary obfuscator output without nearby eval evidence.
    desc: Obfuscated concat property assignment
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\w+\s*=\s*\w+\[\s*["'']conca["'']\s*\+\s*["'']t["'']\s*\]'
