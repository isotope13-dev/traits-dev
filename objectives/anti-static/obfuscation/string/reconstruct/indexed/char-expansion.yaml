defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: c-char-array-path-construction
    desc: 'C char-by-char array construction'
    crit: suspicious
    conf: 0.82
    for: [c, cpp]
    mbc: B0032
    attack: T1027
    if:
      type: text
      regex: '(?s)\[\s*\d+\s*\]\s*=\s*''/''\s*;(.{0,40}\[\s*\d+\s*\]\s*=\s*''[a-z]''\s*;){3}'
    unless:
      - id: metadata/lang/generated::automatically-generated-text
      - type: text
        substr: DO NOT EDIT
      # telnetd rewrites a utmp device path in place ("/dev/pty"), which is
      # indexed assignment but not string concealment.
      - type: path
        regex: '(^|[\\/])telnetd[\\/]sys_term\.c$'
