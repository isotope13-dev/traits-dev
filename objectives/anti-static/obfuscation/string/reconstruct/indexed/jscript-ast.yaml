defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-array-parenthesized-init-ast
    desc: Array with multiple parenthesized strings
    crit: notable
    conf: 0.95
    size_max: 200000
    if:
      type: tree-sitter
      language: javascript
      query: |
        (array
          (parenthesized_expression (string))
          . (parenthesized_expression (string))
        ) @js_array
    unless:
      # Non-JavaScript sources can be misparsed by the fallback sniffer.
      - type: basename
        regex: "\\.(rkt|scrbl|dart|gyb)$"
