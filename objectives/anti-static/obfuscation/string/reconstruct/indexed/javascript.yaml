defaults:
  platforms:
    - windows
    - unix
traits:
  - id: js-string-key-array-literal
    desc: Array literal of 8+ short __ keys
    crit: suspicious
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: var\s+\w+\s*=\s*\[\s*"__\w{2,4}"(\s*,\s*"__\w{2,4}"){7}
    unless:
      - id: well-known/lib/web/client-side/vue::library-comp
  - id: js-indexed-short-token-grid
    desc: Dense indexed short-token grid
    crit: suspicious
    conf: 0.92
    size_max: 256000
    for:
      - javascript
    count_min: 80
    if:
      type: text
      regex: \[\d+\]\[\d+\]='[0-9a-z]{1,2}'
composite_rules:
  - id: js-indexed-array-string-reconstruction
    desc: Indexed array string reconstruction
    crit: notable
    conf: 0.92
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/data/collection/map::js-map-typeof-string-branch
      - id: micro-behaviors/data/collection/map::js-map-conditional-index-lookup
      - id: micro-behaviors/data/string/concat/join::js-map-result-empty-join
    near_lines: 3
  - id: js-dict-string-reconstruction
    desc: JavaScript string reconstructed from dictionary lookup and array iteration
    crit: suspicious
    conf: 0.9
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    all:
      - id: micro-behaviors/data/encode/map::js-short-key-character-entry
    any:
      - id: metadata/lang/source/literal/array::js-short-string-array-constructor
      - id: objectives/anti-static/obfuscation/string/reconstruct/indexed::js-string-key-array-literal
      - id: objectives/anti-static/obfuscation/string/reconstruct/character::js-extreme-short-token-density
