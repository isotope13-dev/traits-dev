defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  # These flattened helpers transform a seed through opaque arithmetic states,
  # then return the supplied table base plus the transformed low sixteen bits.
  # Callers reconstruct concealed strings by adding a second byte/word table.
  # Wildcard every seed, state constant, branch distance and helper length.
  - id: flattened-string-offset-helpers-x64
    desc: Flattened helpers conceal string-table offsets
    crit: suspicious
    conf: 0.96
    attack: T1027
    count_min: 5
    if:
      type: hex
      section: .text
      pattern: '48 89 C8 B9 ?? ?? ?? ?? 45 31 C0 81 F9 [100-180] 0F B7 CA 48 01 C8 C3'
