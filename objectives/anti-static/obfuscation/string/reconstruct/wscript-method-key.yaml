defaults:
  platforms: [windows]
  for: [javascript]
  crit: suspicious
  conf: 0.98
  attack: T1027
traits:
  - id: wscript-inline-xor-method-key
    desc: Inline XOR decoder conceals WScript method key
    if:
      type: tree-sitter
      query: |
        (
          (subscript_expression
            object: (identifier) @host
            index: (call_expression
              function: (parenthesized_expression
                (function_expression body: (statement_block) @decoder)))) @key
          (#eq? @host "WScript")
          (#match? @decoder "String\\.fromCharCode\\([^;]{1,500}charCodeAt\\([^)]{1,40}\\)\\s*\\^")
        )
