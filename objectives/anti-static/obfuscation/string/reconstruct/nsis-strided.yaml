# A System plug-in command hidden among junk bytes at a constant stride.
# Unlike UTF-16, the 3..1024 byte spacing is not an ordinary text encoding.
defaults:
  platforms: [windows]
  for: [data, text]
  size_max: 2000000
traits:
  - id: strided-nsis-kernel32-command
    desc: NSIS native command concealed at fixed stride
    crit: suspicious
    conf: 0.98
    attack: T1027.009
    if:
      type: yara
      source: |
        rule strided_nsis_kernel32_command {
          strings:
            $k = "k" ascii
          condition:
            $k and filesize < 2000000 and for any a in (0..1023) : (
              uint8(a) == 0x6b and
              for any s in (3..1024) : (
                  uint8(a+0*s) == 0x6b and
                  uint8(a+1*s) == 0x65 and
                  uint8(a+2*s) == 0x72 and
                  uint8(a+3*s) == 0x6e and
                  uint8(a+4*s) == 0x65 and
                  uint8(a+5*s) == 0x6c and
                  uint8(a+6*s) == 0x33 and
                  uint8(a+7*s) == 0x32 and
                  uint8(a+8*s) == 0x3a and
                  uint8(a+9*s) == 0x3a
              )
            )
        }
