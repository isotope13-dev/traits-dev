defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
composite_rules:
  - id: function-returns-string-literal
    desc: Function returns string literal cluster
    crit: notable
    conf: 0.75
    # Both a raw floor AND a density floor: many string-returning helpers that
    # also dominate the file. The ratio replaces the old size-scaling count-only
    # gate (`ast.string_return_function_count >= 5`), which fired on any large
    # hand-written module with five string-returning functions.
    all:
      - id: metadata/file/metrics::string-returning-function-count
      - id: metadata/file/metrics::string-returning-function-ratio
    unless:
      - id: metadata/file/profile/locale::i18n-locale-file
      - id: metadata/package/files/dependency::node-modules-path
