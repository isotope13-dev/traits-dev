defaults:
  platforms: [windows, unix]
  for: [lua]

composite_rules:
  - id: lua-return-wrapper-indexed-reassembly
    desc: Lua return wrapper with indexed reassembly
    # This proves packing, not an objective. Commercial Lua protectors and
    # licensed applications use the same return-function/permutation wrapper.
    crit: suspicious
    conf: 0.96
    for: [lua, javascript, text, c]
    all:
      - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
    any:
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop
      - id: micro-behaviors/data/string/concat::lua-half-table-concat-loop


  - id: lua-nested-escaped-string-reassembly
    desc: Nested Lua wrapper with escaped string reassembly
    # Concealment only, like packed-lua-loader-obfuscation: commercial Lua
    # protectors emit the same wrapper. Conviction comes from the rule that
    # finds what the unpacked code does or how it is delivered.
    crit: suspicious
    conf: 0.96
    platforms: [unix, windows, network-appliance]
    all:
      - id: micro-behaviors/data/control-flow/return::lua-nested-return-vararg-wrapper
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop

  - id: lua-escaped-indexed-string-reassembly
    desc: Lua indexed concatenation with escaped strings
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings

  - id: lua-proxy-escaped-string-reassembly
    desc: Lua proxy references with escaped reassembly
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/metaprogramming/reflection::lua-environment-proxy-references
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop

