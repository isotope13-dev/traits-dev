defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: substitution-map
    desc: Variable substitution map using comma operator
    crit: suspicious
    conf: 0.95
    per_kb_min: 2.0
    if:
      type: text
      regex: '\b(var|let|const)\s+\w+\s*=\s*\[\s*\(\s*["''][^"''\r\n]{1,12}["'']\s*,'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/nodeunit/
  - id: array-eval
    # Matcher only sees obfuscated bracket access to "concat" — common in
    # javascript-obfuscator output for ordinary .concat() calls. Nemucod
    # composites supply the eval/JScript intent; alone this is notable
    # string concealment, not "feeding eval".
    desc: Obfuscated concat property access
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[\s*["'']conca["'']\s*\+\s*["'']t["'']\s*\]'
  - id: wv-array
    desc: Character array using comma tuples
    crit: suspicious
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: 'var\s+\w+\s*=\s*\[\s*\(\s*["''][^"'']{1,120}["'']\s*,\s*\w+\s*\)\s*,'
    unless:
      - id: well-known/app/development/links-lang::links-language-source
  - id: reconstruction-loop
    # Same concat-split property pattern as array-eval; assignment form is
    # still ordinary obfuscator output without nearby eval evidence.
    desc: Obfuscated concat property assignment
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\w+\s*=\s*\w+\[\s*["'']conca["'']\s*\+\s*["'']t["'']\s*\]'
composite_rules:
  - id: function-fragmentation
    desc: String-returning functions dominate file
    crit: notable
    conf: 0.95
    size_min: 1000
    size_max: 500000
    # A raw count alone fires on large validator/schema libraries with many
    # ordinary getExample/getType helpers. Fragment tables have both a useful
    # floor and a high within-file ratio, so reuse the canonical neutral
    # measurements and require both properties.
    all:
      - id: metadata/file/metrics::string-returning-function-count
      - id: metadata/file/metrics::string-returning-function-ratio
    unless:
      - id: metadata/library/generated::laya-engine-runtime-marker
      - id: well-known/lib/ui/createjs::library-marker
      - id: well-known/lib/ui/leaflet::library-banner
      - id: metadata/file/profile/locale::multilingual-ui-language-table
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/build/bundler::js-hashed-bundle-basename
      # MathJax/XyJax generated parser functions are library tables, not
      # fragmented string decoders.
      - id: well-known/lib/ai/mathjax::mathjax-source-marker
      # Tree-sitter grammar files use many short rule-builder callbacks that
      # return string literals. That is declarative parser source, not a
      # fragmented string decoder.
      - id: well-known/lib/development/tree-sitter::tree-sitter-grammar-source
