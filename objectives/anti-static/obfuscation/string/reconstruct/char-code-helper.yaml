# A string rebuilt one character at a time through a *renamed* helper:
# `kixLgCL2(118) + kixLgCL2(117) + kixLgCL2(75) + ...`. The technique is the
# familiar char-code reconstruction, but every existing rule for it keys on
# the built-in by name (`String.fromCharCode`, `chr`), and an obfuscator that
# wraps the built-in in a generated function name defeats all of them at once.
#
# So this matches the *shape* rather than the name: adjacent calls that take a
# single small integer and are joined by `+`, while `not:` rejects files whose
# chains are built from the standard char-code constructors. A lone `f(1) + g(2)`
# is ordinary arithmetic, which is why a run is required -- reconstructing even
# a short word takes several links, and these files contain thousands.
#
# The builtin exclusion keeps this trait about the *renamed* wrapper. Plain
# `Chr(83)+Chr(99)+...` (VBScript/VBA), Python `chr(104)+chr(101)+...` and
# `String.fromCharCode(...)` chains are the un-obfuscated form of the same
# encoding and are already owned by the by-name atoms:
# micro-behaviors/data/encode/char-code::dense-chr-construction (vbs/vba),
# objectives/anti-static/obfuscation/string/encoding::python-dense-chr-calls,
# and the fromCharCode family in micro-behaviors/data/encode/char-code.
# Matching them here re-labelled ordinary dense Chr() sources as suspicious
# wrappers (e.g. the Rex cmdstager vbs_b64_noquot decode stub).
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027
  mbc: B0032
  size_max: 50000000

traits:
  - id: renamed-char-code-helper-chain
    desc: Text rebuilt via renamed char-code helper
    crit: suspicious
    conf: 0.92
    count_min: 5
    if:
      # Two or three digits, not one. A helper reconstructing text emits
      # printable code points (32-126), so a single-digit argument is never
      # part of a character chain -- but it is what binary-layout comments
      # (`magic(4) + version(4)` in SumatraPDF), symbolic mathematics
      # (`sqrt(2) + sqrt(3)` throughout sympy) and numeric test constructors
      # look like, and those were the matches.
      #
      # THREE adjacent links, not two. A pair of small-int calls summed is
      # ordinary arithmetic: SQL aggregate expressions such as
      # `max(17)+max(11)` run through SQLite's TCL/SQL test corpus
      # (testdata/tcl/randexpr1.test, vendored verbatim) are two-term sums,
      # never runs. Reconstruction of even one short word takes three or more
      # characters, so a real chain always carries a 3-link window.
      type: text
      regex: '\w{3,24}\(\d{2,3}\s*\)\s*\+\s*\w{3,24}\(\d{2,3}\s*\)\s*\+\s*\w{3,24}\(\d{2,3}\s*\)'
    not:
      # Parser/grammar tests commonly concatenate numeric token constructors;
      # that is binary test-data assembly, not character reconstruction.
      - regex: '\btoken\s*\('
      # Two adjacent builtin char-code calls mean the chain evidence in this
      # file is the plain, un-obfuscated form owned by the by-name atoms
      # listed above; a renamed helper never spells chr/chrW/chrB or
      # fromCharCode, so these exclusions cannot hide a renamed chain.
      - regex: '(?i)chr[bw]?\(\d{1,3}\s*\)\s*\+\s*chr[bw]?\s*\('
      - regex: 'fromCharCode\(\d{1,3}\s*\)\s*\+\s*fromCharCode\s*\('
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - type: basename
        regex: '(?i)^(test_.*|.*_test(?:_.*)?)\.(py|go)$'
