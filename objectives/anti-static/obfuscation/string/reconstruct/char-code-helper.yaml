# Numeric helper call chains can use character codes or string-table indexes.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027
  mbc: B0032
  size_max: 50000000

traits:
  # The chain is the first argument of a `.Run(` call, so the hidden text
  # is a command line rather than data. Scoped to JScript/HTA/WSC hosts,
  # where `.Run(` is WScript.Shell process creation.
  - id: char-code-chain-run-command
    desc: Run command line built from char-code calls
    crit: suspicious
    conf: 0.9
    attack: T1027,T1059
    for: [javascript, html]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\.run\(\s*(\w{3,24}\(\d{2,3}\s*\)\s*\+\s*){3}'
composite_rules:
  # Numeric helper chains near eval suggest concealment; proximity does not
  # establish that their result is the evaluator argument.
  - id: numeric-helper-chains-near-eval
    desc: Numeric helper addition chains near eval
    crit: suspicious
    conf: 0.95
    attack: T1027,T1059.007
    near_lines: 8
    all:
      - id: metadata/lang/source/syntax/call/relationship::numeric-helper-addition-chains
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
    unless:
      - id: metadata/package/testing/harness/runtime/

  # The char-code text is the command line WScript.Shell launches with its
  # window hidden: the obfuscation exists to conceal what is being executed.
  - id: char-code-chain-hidden-wsh-run
    desc: Char-code built command run hidden via WScript.Shell
    crit: hostile
    conf: 0.95
    attack: T1027,T1059.007,T1564.003
    for: [javascript, html]
    platforms: [windows]
    all:
      - id: char-code-chain-run-command
      - id: micro-behaviors/process/create/flags::wscript-shell-hidden-run
    unless:
      - id: metadata/package/testing/harness/runtime/
