# A string rebuilt one character at a time through a *renamed* helper:
# `kixLgCL2(118) + kixLgCL2(117) + kixLgCL2(75) + ...`. The technique is the
# familiar char-code reconstruction, but every existing rule for it keys on
# the built-in by name (`String.fromCharCode`, `chr`), and an obfuscator that
# wraps the built-in in a generated function name defeats all of them at once.
#
# So this matches the *shape* rather than the name: adjacent calls that take a
# single small integer and are joined by `+`. A lone `f(1) + g(2)` is ordinary
# arithmetic, which is why a run is required -- reconstructing even a short
# word takes several links, and these files contain thousands.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027
  mbc: B0032
  size_max: 50000000

traits:
  - id: renamed-char-code-helper-chain
    desc: Text built from per-character helper calls
    crit: suspicious
    conf: 0.92
    count_min: 5
    if:
      # Two or three digits, not one. A helper reconstructing text emits
      # printable code points (32-126), so a single-digit argument is never
      # part of a character chain -- but it is what binary-layout comments
      # (`magic(4) + version(4)` in SumatraPDF), symbolic mathematics
      # (`sqrt(2) + sqrt(3)` throughout sympy) and numeric test constructors
      # look like, and those were the matches.
      type: text
      regex: '\w{3,24}\(\s*[0-9]{2,3}\s*\)\s*\+\s*\w{3,24}\(\s*[0-9]{2,3}\s*\)'
    not:
      # Parser/grammar tests commonly concatenate numeric token constructors;
      # that is binary test-data assembly, not character reconstruction.
      - regex: '\btoken\s*\('
