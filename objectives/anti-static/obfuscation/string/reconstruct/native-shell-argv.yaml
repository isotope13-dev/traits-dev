defaults:
  for: [macho]
  platforms: [macos]
  arch: [x86-64]
  crit: suspicious
  conf: 0.99
traits:
  - id: x64-xor-concealed-zsh-argv
    desc: Stack XOR conceals interactive zsh argv
    if:
      type: yara
      source: |
        rule x64_xor_concealed_zsh_argv {
          strings:
            $argv = {
              B8 ?? ?? ?? ?? 48 8D BD ?? ?? ?? ?? 89 07
              B8 ?? ?? ?? ?? 89 47 04 B8 ?? ?? ?? ?? 89 47 08
              BA ?? ?? ?? ?? 89 57 0C BE ?? ?? ?? ??
              48 8D 4D ?? 89 31 BE ?? ?? ?? ?? 89 71 04
              89 41 08 89 51 0C 41 B8 ?? ?? ?? ??
              4C 8D 4D ?? 45 89 01 41 89 71 04 41 89 41 08 41 89 51 0C
              4D 89 CA 41 0F 28 02 0F 57 07 0F 29 07 49 89 39
              4C 8D 55 ?? 45 89 02 41 89 72 04 41 89 42 08 41 89 52 0C
              41 0F 28 02 0F 57 01 0F 29 01 49 89 49 08
              49 C7 41 10 00 00 00 00
            }
          condition:
            for any i in (1..#argv) : (
              (uint32(@argv[i]+1) ^ uint32(@argv[i]+65)) == 0x6e69622f and
              (uint32(@argv[i]+15) ^ uint32(@argv[i]+50)) == 0x68737a2f and
              (uint32(@argv[i]+39) ^ uint32(@argv[i]+65)) == 0x692d
            )
        }
