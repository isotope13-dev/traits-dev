defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-array-parenthesized-init-ast
    desc: Array with multiple parenthesized strings
    crit: suspicious
    conf: 0.95
    size_max: 200000
    if:
      type: tree-sitter
      language: javascript
      query: |
        (array
          (parenthesized_expression (string))
          (parenthesized_expression (string))
        ) @js_array
    unless:
      - type: basename
        regex: "(\\.component\\.(pug|vue)|graphviz(\\.min)?\\.js)$"
      - type: basename
        regex: "\\.(rkt|scrbl|dart)$"
      - type: text
        substr: "(ngModel)"
      - type: text
        substr: "@hpcc-js/wasm"
      - type: text
        substr: "Generator is already executing."
      - id: well-known/app/development/pandoc::package-path
    downgrade:
      any:
        - id: objectives/anti-static/obfuscation/code-metrics/structure/
  - id: js-var-sequence-init-ast
    desc: Variable initialized from string sequence
    crit: suspicious
    conf: 0.95
    count_min: 10
    # Cleave may classify .exp sidecars as JavaScript and tree-sitter can
    # recover assignment nodes from their printed expected-output lines.
    unless:
      - type: path
        basename: true
        regex: '\.exp$'
    if:
      type: tree-sitter
      language: javascript
      query: |
        (assignment_expression
          left: (identifier)
          right: (parenthesized_expression
            (sequence_expression
              (string)
              (string)
            )
          )
        ) @js_sequence_init
  - id: js-dynamic-property-concat
    desc: Property access using concatenated strings
    crit: component
    conf: 0.8
    count_min: 3
    if:
      type: tree-sitter
      language: javascript
      query: "(subscript_expression\n  index: (binary_expression\n    left: (string)\n    right: (string)\n  )\n) @concat_prop\n"
