defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-array-parenthesized-init-ast
    desc: Array with multiple parenthesized strings
    crit: notable
    conf: 0.95
    size_max: 200000
    if:
      type: tree-sitter
      language: javascript
      query: |
        (array
          (parenthesized_expression (string))
          . (parenthesized_expression (string))
        ) @js_array
    unless:
      # Non-JavaScript sources can be misparsed by the fallback sniffer.
      - type: basename
        regex: "\\.(rkt|scrbl|dart|gyb)$"
  - id: js-var-sequence-init-ast
    desc: Variable initialized from string sequence
    crit: notable
    conf: 0.95
    count_min: 10
    # Expected-output and Xcode specification files may be parsed as JS.
    unless:
      - type: basename
        regex: '(?i)\\.(exp|xcspec)$'
    if:
      type: tree-sitter
      language: javascript
      query: |
        (assignment_expression
          left: (identifier)
          right: (parenthesized_expression
            (sequence_expression
              (string)
              (string)
            )
          )
        ) @js_sequence_init
  - id: js-dynamic-property-concat
    desc: Property access using concatenated strings
    crit: notable
    conf: 0.8
    count_min: 3
    if:
      type: tree-sitter
      language: javascript
      query: "(subscript_expression\n  index: (binary_expression\n    left: (string)\n    right: (string)\n  )\n) @concat_prop\n"
