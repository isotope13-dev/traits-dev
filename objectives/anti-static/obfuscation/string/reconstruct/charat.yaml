defaults:
  platforms: [linux, macos, windows]
traits:
  - id: charat-construction
    desc: Detects fragmented charAt method string
    crit: suspicious
    for: [javascript]
    if:
      type: text
      regex: '("ch"|''ch'')\s*\+\s*("arA"|''arA'')\s*\+\s*("t"|''t'')'
  # ModiLoader-style JS launchers hide every sensitive token (WScript,
  # ActiveXObject, attrib, powershell) as scattered charAt pairs drawn from
  # one carrier string, then Run the rebuilt commands hidden. charAt is
  # routine inside JavaScript, but a batch file has no legitimate use for
  # charAt pair chains at all, so the batch gating keeps this precise.
  - id: charat-pair-string-rebuild
    desc: charAt pairs rebuild strings in batch
    crit: suspicious
    conf: 0.94
    attack: T1027.002
    for: [batch]
    count_min: 20
    if:
      type: text
      regex: '\.charAt\(\d+\)\+\w+\.charAt\(\d+\)'
