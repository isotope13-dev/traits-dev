# IoT droppers hide shell tokens by inserting a repeated two-letter pad between
# every payload character: wPDgPDePDt / wXXgXXeXXt -> wget. YARA offset checks
# preserve the repeated-pair constraint without unsupported regex backreferences.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1027
traits:
  - id: pd-interleaved-wget
    desc: wget spelled with inserted separators
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule pd_interleaved_wget {
          strings:
            $token = /\bw[A-Za-z]{2}g[A-Za-z]{2}e[A-Za-z]{2}t\b/ ascii
          condition:
            #token > 0 and for any i in (1..#token) : (
              uint8(@token[i] + 1) == uint8(@token[i] + 4) and
              uint8(@token[i] + 1) == uint8(@token[i] + 7) and
              uint8(@token[i] + 2) == uint8(@token[i] + 5) and
              uint8(@token[i] + 2) == uint8(@token[i] + 8)
            )
        }
  - id: pd-interleaved-chmod
    desc: chmod spelled with inserted separators
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule pd_interleaved_chmod {
          strings:
            $token = /\bc[A-Za-z]{2}h[A-Za-z]{2}m[A-Za-z]{2}o[A-Za-z]{2}d\b/ ascii
          condition:
            #token > 0 and for any i in (1..#token) : (
              uint8(@token[i] + 1) == uint8(@token[i] + 4) and
              uint8(@token[i] + 1) == uint8(@token[i] + 7) and
              uint8(@token[i] + 1) == uint8(@token[i] + 10) and
              uint8(@token[i] + 2) == uint8(@token[i] + 5) and
              uint8(@token[i] + 2) == uint8(@token[i] + 8) and
              uint8(@token[i] + 2) == uint8(@token[i] + 11)
            )
        }
  - id: pd-interleaved-tmp
    desc: /tmp spelled with inserted separators
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule pd_interleaved_tmp {
          strings:
            $token = /\/[A-Za-z]{2}t[A-Za-z]{2}m[A-Za-z]{2}p\b/ ascii
          condition:
            #token > 0 and for any i in (1..#token) : (
              uint8(@token[i] + 1) == uint8(@token[i] + 4) and
              uint8(@token[i] + 1) == uint8(@token[i] + 7) and
              uint8(@token[i] + 2) == uint8(@token[i] + 5) and
              uint8(@token[i] + 2) == uint8(@token[i] + 8)
            )
        }
  - id: interleaved-root-account
    desc: root spelled with inserted separators
    crit: notable
    conf: 0.93
    if:
      type: yara
      source: |
        rule interleaved_root_account {
          strings:
            $token = /\br[A-Za-z]{2}o[A-Za-z]{2}o[A-Za-z]{2}t\b/ ascii
          condition:
            #token > 0 and for any i in (1..#token) : (
              uint8(@token[i] + 1) == uint8(@token[i] + 4) and
              uint8(@token[i] + 1) == uint8(@token[i] + 7) and
              uint8(@token[i] + 2) == uint8(@token[i] + 5) and
              uint8(@token[i] + 2) == uint8(@token[i] + 8)
            )
        }
  - id: interleaved-admin-account
    desc: admin spelled with inserted separators
    crit: notable
    conf: 0.93
    if:
      type: yara
      source: |
        rule interleaved_admin_account {
          strings:
            $token = /\ba[A-Za-z]{2}d[A-Za-z]{2}m[A-Za-z]{2}i[A-Za-z]{2}n\b/ ascii
          condition:
            #token > 0 and for any i in (1..#token) : (
              uint8(@token[i] + 1) == uint8(@token[i] + 4) and
              uint8(@token[i] + 1) == uint8(@token[i] + 7) and
              uint8(@token[i] + 1) == uint8(@token[i] + 10) and
              uint8(@token[i] + 2) == uint8(@token[i] + 5) and
              uint8(@token[i] + 2) == uint8(@token[i] + 8) and
              uint8(@token[i] + 2) == uint8(@token[i] + 11)
            )
        }
composite_rules:
  - id: pd-interleaved-dropper-shell
    desc: Insert-split wget and chmod dropper
    crit: hostile
    conf: 0.97
    all:
      - id: pd-interleaved-wget
      - id: pd-interleaved-chmod
    any:
      - id: pd-interleaved-tmp
  - id: pd-interleaved-wget-tmp
    desc: Insert-split wget writes into /tmp
    crit: hostile
    conf: 0.95
    all:
      - id: pd-interleaved-wget
      - id: pd-interleaved-tmp
  - id: pd-interleaved-chmod-tmp
    desc: Insert-split chmod of a /tmp payload
    crit: hostile
    conf: 0.95
    all:
      - id: pd-interleaved-chmod
      - id: pd-interleaved-tmp
  - id: interleaved-wget-root
    desc: Insert-split wget with a root account
    crit: hostile
    conf: 0.96
    all:
      - id: pd-interleaved-wget
      - id: interleaved-root-account
  - id: interleaved-wget-admin
    desc: Insert-split wget with an admin account
    crit: hostile
    conf: 0.96
    all:
      - id: pd-interleaved-wget
      - id: interleaved-admin-account
  - id: interleaved-tmp-root
    desc: Insert-split /tmp with a root account
    crit: hostile
    conf: 0.94
    all:
      - id: pd-interleaved-tmp
      - id: interleaved-root-account
