# IoT droppers hide shell tokens by inserting a repeated two-letter
# pad between every payload character: wPDgPDePDt / wXXgXXeXXt -> wget.
# Match the insertion technique, not one campaign's pad letters.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1027
traits:
  - id: pd-interleaved-wget
    desc: wget spelled with inserted separators
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'w[A-Za-z]{2}g[A-Za-z]{2}e[A-Za-z]{2}t'
  - id: pd-interleaved-chmod
    desc: chmod spelled with inserted separators
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'c[A-Za-z]{2}h[A-Za-z]{2}m[A-Za-z]{2}o[A-Za-z]{2}d'
  - id: pd-interleaved-tmp
    desc: /tmp spelled with inserted separators
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/[A-Za-z]{2}t[A-Za-z]{2}m[A-Za-z]{2}p'
  - id: interleaved-root-account
    desc: root spelled with inserted separators
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'r[A-Za-z]{2}o[A-Za-z]{2}o[A-Za-z]{2}t'
  - id: interleaved-admin-account
    desc: admin spelled with inserted separators
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'a[A-Za-z]{2}d[A-Za-z]{2}m[A-Za-z]{2}i[A-Za-z]{2}n'
composite_rules:
  - id: pd-interleaved-dropper-shell
    desc: Insert-split wget and chmod dropper
    crit: hostile
    conf: 0.97
    all:
      - id: pd-interleaved-wget
      - id: pd-interleaved-chmod
    any:
      - id: pd-interleaved-tmp
  - id: pd-interleaved-wget-tmp
    desc: Insert-split wget writes into /tmp
    crit: hostile
    conf: 0.95
    all:
      - id: pd-interleaved-wget
      - id: pd-interleaved-tmp
  - id: pd-interleaved-chmod-tmp
    desc: Insert-split chmod of a /tmp payload
    crit: hostile
    conf: 0.95
    all:
      - id: pd-interleaved-chmod
      - id: pd-interleaved-tmp
  - id: interleaved-wget-root
    desc: Insert-split wget with a root account
    crit: hostile
    conf: 0.96
    all:
      - id: pd-interleaved-wget
      - id: interleaved-root-account
  - id: interleaved-wget-admin
    desc: Insert-split wget with an admin account
    crit: hostile
    conf: 0.96
    all:
      - id: pd-interleaved-wget
      - id: interleaved-admin-account
  - id: interleaved-tmp-root
    desc: Insert-split /tmp with a root account
    crit: hostile
    conf: 0.94
    all:
      - id: pd-interleaved-tmp
      - id: interleaved-root-account
