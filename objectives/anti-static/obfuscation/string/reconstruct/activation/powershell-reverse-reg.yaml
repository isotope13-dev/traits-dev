defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001

composite_rules:
  - id: reversed-reg-scriptblock-loader
    desc: Reversed registry path rebuilt into ScriptBlock
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::reversed-software-reg-path
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::regex-matches-righttoleft
  - id: reversed-reg-icm-loader
    desc: Reversed registry path invoked via icm
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::reversed-software-reg-path
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::scriptblock-create-icm
