defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1027
  mbc: B0032
  size_max: 50000000

traits:
  - id: char-code-chain-run-command
    desc: Run command line built from char-code calls
    crit: suspicious
    conf: 0.9
    attack: T1027,T1059
    for: [javascript, html]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\.run\(\s*(\w{3,24}\(\d{2,3}\s*\)\s*\+\s*){3}'
composite_rules:
  - id: numeric-helper-chains-near-eval
    desc: Numeric helper addition chains near eval
    crit: suspicious
    conf: 0.95
    attack: T1027,T1059.007
    near_lines: 8
    all:
      - id: metadata/lang/source/syntax/call/relationship::numeric-helper-addition-chains
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  - id: char-code-chain-hidden-wsh-run
    desc: Char-code built command run hidden via WScript.Shell
    crit: hostile
    conf: 0.95
    attack: T1027,T1059.007,T1564.003
    for: [javascript, html]
    platforms: [windows]
    all:
      - id: char-code-chain-run-command
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
