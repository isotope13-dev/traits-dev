defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: array-eval
    # Matcher only sees obfuscated bracket access to "concat" — common in
    # javascript-obfuscator output for ordinary .concat() calls. Nemucod
    # composites supply the eval/JScript intent; alone this is notable
    # string concealment, not "feeding eval".
    desc: Obfuscated concat property access
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[\s*["'']conca["'']\s*\+\s*["'']t["'']\s*\]'
