defaults:
  platforms:
    - windows
    - unix
composite_rules:
  - id: js-dict-reconstruction-eval
    desc: Dictionary-rebuilt payload executed with eval
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct/indexed::js-dict-string-reconstruction
    any:
      - id: objectives/execution/interpreter/eval/dynamic/
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-window-named
