defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1027
  mbc: B0032
composite_rules:
  - id: python-encoded-token-replace-exec
    desc: Exec after encoded token-replace rebuild
    crit: hostile
    conf: 0.97
    attack: T1027,T1140,T1059.006
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::encoded-token-replace-call
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::encoded-dunder-token-placeholders
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
    unless:
      - id: metadata/path/directory::test-directory-component
