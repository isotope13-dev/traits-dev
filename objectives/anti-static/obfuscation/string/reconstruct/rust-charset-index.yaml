defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1027
  mbc: B0032

traits:
  - id: rust-charset-index-string-rebuild
    desc: Rebuilds strings from indexed charset table
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '32\s*u8\.\.=\s*0x7[eE][\s\S]{0,800}\w\[\d{1,3}\](\s*,\s*\w\[\d{1,3}\]){3,}'

composite_rules:
  # Concealed strings plus networking merit inspection, but do not establish
  # which bytes are sent or that the analytics event steals sensitive data.
  - id: indexed-string-network-analytics
    desc: Indexed strings with socket and analytics use
    crit: suspicious
    conf: 0.96
    scope: leaf
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::rust-charset-index-string-rebuild
      - id: micro-behaviors/communications/ip/direct::rust-dial-hardcoded-ipv4
      - id: micro-behaviors/communications/http/services/analytics::posthog-sdk-event-capture
