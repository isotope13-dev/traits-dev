defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - html
  crit: suspicious
composite_rules:
  - id: encoded-stage-url-construction
    desc: Encoded URL reconstruction near DOM sink
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/ui/window/dom-access::dom-script-src-charcode-assign
      - id: micro-behaviors/data/collection/dom::document-create-element
    any:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-https-prefix
      - id: micro-behaviors/data/decode/xor/reconstruction::fromcharcode-xor-rebuild
