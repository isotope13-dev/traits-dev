defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027

traits:
  - id: worker-reversed-script-reference
    desc: Worker imports a reversed script reference
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @loader
          arguments: (arguments
            (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression
                    object: (call_expression
                      function: (member_expression
                        property: (property_identifier) @split)
                      arguments: (arguments (string)))
                    property: (property_identifier) @reverse)
                  arguments: (arguments))
                property: (property_identifier) @join)
              arguments: (arguments (string))))) @call
          (#eq? @loader "importScripts")
          (#eq? @split "split")
          (#eq? @reverse "reverse")
          (#eq? @join "join"))
