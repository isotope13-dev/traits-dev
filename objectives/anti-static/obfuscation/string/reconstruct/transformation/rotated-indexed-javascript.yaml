# Report the visible shape without claiming that the reconstructed values are
# malicious or that the computed constructor executed.
defaults:
  for: [javascript]
  platforms: [windows, unix]

traits:
  - id: javascript-unshift-pop-rotation-text
    desc: Array unshift receives a pop call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\.unshift\([A-Za-z_$][\w$]*\.pop\(\)\)'

  - id: javascript-conditional-index-return-text
    desc: Returns a conditionally indexed value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'return\s+\w+\[\w+[<>][^\]\n]{0,90}\?[^\]\n]{0,100}:[^\]\n]{0,100}\]'

composite_rules:
  - id: computed-constructor-with-rotated-conditional-index
    desc: Computed constructor with array rotation and conditional indexing
    crit: suspicious
    conf: 0.86
    all:
      - id: javascript-unshift-pop-rotation-text
      - id: javascript-conditional-index-return-text
      - id: micro-behaviors/process/interpreter/eval/constructed::js-computed-constructor-require-call
