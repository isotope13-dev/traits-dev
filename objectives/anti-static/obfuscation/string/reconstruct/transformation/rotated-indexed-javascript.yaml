# Report the visible shape without claiming that the reconstructed values are
# malicious or that the computed constructor executed.
defaults:
  for: [javascript]
  platforms: [windows, unix]

composite_rules:
  - id: computed-constructor-with-rotated-conditional-index
    desc: Computed constructor with array rotation and conditional indexing
    crit: suspicious
    conf: 0.86
    all:
      - id: micro-behaviors/data/string/access::javascript-unshift-pop-rotation-text
      - id: micro-behaviors/data/string/access::javascript-conditional-index-return-text
      - id: micro-behaviors/process/interpreter/eval/constructed::js-computed-constructor-require-call
