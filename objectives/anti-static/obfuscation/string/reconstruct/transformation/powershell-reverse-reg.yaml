defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001

traits:
  - id: reversed-software-reg-path
    desc: Reversed SOFTWARE registry path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: ERAWTFOS
  - id: regex-matches-righttoleft
    desc: Regex matches RightToLeft over a string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[regex\]::Matches\([^)]{0,80}RightToLeft'
  - id: scriptblock-create-icm
    desc: ScriptBlock.Create invoked via icm
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\[ScriptBlock\].{0,80}\bicm\b.{0,80}::Create'

composite_rules:
  - id: righttoleft-scriptblock-icm
    desc: RightToLeft rebuild invoked via icm
    crit: hostile
    conf: 0.96
    all:
      - id: regex-matches-righttoleft
      - id: scriptblock-create-icm
