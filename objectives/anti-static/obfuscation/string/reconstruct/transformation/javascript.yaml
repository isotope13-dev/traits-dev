defaults:
  platforms:
    - windows
    - unix
composite_rules:
  - id: js-base64-xor-delimited-string-reconstruction
    desc: Base64 decoding and XOR character rebuilding occur nearby
    crit: suspicious
    conf: 0.97
    attack: T1027
    for:
      - javascript
    scope: file
    near_bytes: 512
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/data/decode/xor/reconstruction::fromcharcode-xor-rebuild
