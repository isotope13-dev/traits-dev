defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: encoded-stage-url-construction
    desc: Encoded URL reconstruction near DOM sink
    crit: suspicious
    conf: 0.9
    near_bytes: 2048
    unless:
      - id: well-known/lib/format/pdfjs/
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      - id: metadata/build/
    all:
      - id: micro-behaviors/process/deploy::dom-script-src-charcode-assign
      - id: micro-behaviors/data/collection/dom::document-create-element
    any:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-https-prefix
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild

  - id: encoded-remote-dom-script-loader
    for: [javascript]
    desc: Encoded remote DOM script loader
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/collection/dom::document-create-element
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: objectives/anti-static/obfuscation/string/reconstruct::encoded-stage-url-construction
      - id: micro-behaviors/process/deploy::dom-script-content-sink
      - id: micro-behaviors/data/collection/dom::append-child-reference
    attack: T1027
    unless:
      - id: metadata/build/
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-langfuse-package
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-langfuse-next-app-path

  # Build-context suppression above protects ordinary generated assets from
  # broad URL and DOM traits. An encoded remote URL assigned to a newly-created
  # script and appended into the document remains an active loader in a bundle,
  # so this rule carries no build-context leg or exclusion: the legs below are
  # the evidence wherever they occur. (A `metadata/build/` leg here only added
  # build-artifact file names, which the collector, not the attacker, chooses.)

  - id: bundled-encoded-remote-dom-script-loader
    for: [javascript]
    desc: JavaScript injects an encoded remote script
    crit: suspicious
    conf: 0.96
    attack: T1027
    all:
      - id: micro-behaviors/data/collection/dom::document-create-element
      - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
      - id: micro-behaviors/process/deploy::dom-script-content-sink
      - id: micro-behaviors/data/collection/dom::append-child-reference


  - id: encoded-dom-head-script-injection
    for: [javascript]
    desc: Encoded DOM head script injection
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: micro-behaviors/process/deploy::dom-script-src-charcode-assign
      - id: micro-behaviors/data/encode/char-code::dom-head-charcode-target
      - id: micro-behaviors/data/collection/dom::append-child-reference
    attack: T1027
    unless:
      - id: metadata/build/
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
