# A payload cut into dozens of numbered variables -- `$x104='...'; $x128='...';
# $x135='...'` -- that are concatenated back together at run time. The sibling
# files here cover the Ruby and Python spellings of the same idea; this is the
# PHP one, which turns up in WordPress backdoors that hide the assignments
# between comment blocks so the file reads as a signed plugin header.
#
# Nothing is encoded: each fragment is plain text, chosen short enough that no
# recognizable token survives in any single literal. The give-away is the
# sheer count of sequentially-named variables, since no author writes a
# program with forty of them.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  - id: numbered-fragment-variable-set
    desc: Many numbered string-fragment variables
    crit: suspicious
    conf: 0.9
    count_min: 10
    if:
      # The leading `[^\n]{0,4}` lets the assignment sit behind the `*/` that
      # closes the decoy comment it is hidden in.
      type: text
      regex: '(?m)^[^\n]{0,4}\$[a-z]{1,3}[0-9]{2,4}\s*=\s*[''"]'
