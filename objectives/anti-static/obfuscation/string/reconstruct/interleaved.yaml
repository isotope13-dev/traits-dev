defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
traits:
- id: js-interleaved-junk-chars
  desc: js interleaved junk chars
  crit: notable
  conf: 0.8
  not:
  - substr: SunMonTueWedThuFriSatJanFebMarAprMayJunJulAugSepOctNovDecUTC
  - substr: JanFebMarAprMayJunJulAugSepOctNovDec
  - substr: anFebMarAprMayJunJulAugSepOctNovD
  - substr: BlaBlaBlaBlaBla
  - substr: FooFooFooFooFoo
  - substr: BarBarBarBarBar
  - substr: ffBfiBflBfmBhaBiiBijBinBivBixB
  - substr: avg|max|and|asc|any|min|try|as|at|on|or|ln|is|of|in|if
  if:
    type: text
    regex: ([a-z]{2}[^a-z\s=,;:.()\[\]{}|]){10,}
  downgrade:
    any:
    - type: metrics
      field: text.whitespace_ratio
      max: 0.1
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
- id: js-interleaved-lowercase-junk
  desc: Lowercase pairs with nonletter separators
  crit: suspicious
  conf: 0.7
  not:
  - substr: an error while printing
  if:
    type: text
    regex: ([a-z]{2}[^a-z\\\s=,;:.()\[\]{}|]){20,}
  unless:
  - id: well-known/lib/format/icu4x::icu4x-generated-data-context
  - id: well-known/lib/crypto/zxcvbn::zxcvbn-ranked-dictionaries
  - id: metadata/build
  - type: metrics
    field: text.whitespace_ratio
    max: 0.05
  - id: metadata/lang/compiled/
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
