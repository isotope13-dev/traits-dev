defaults:
  platforms: [windows, unix]
composite_rules:
  - id: archive-batch-with-indexed-lua-reassembly
    desc: Archive pairs indexed Lua reassembly with batch START
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [zip, batch, lua, text, javascript, c]
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::lua-return-wrapper-indexed-reassembly
    any:
      - id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script
      - id: micro-behaviors/process/create/shell/command-mode::batch-starts-data-argument

