defaults:
  platforms:
  - windows
  - unix
  crit: suspicious
composite_rules:
- id: archive-batch-with-indexed-lua-reassembly
  desc: Archive pairs indexed Lua reassembly with batch START
  conf: 0.95
  scope: archive
  for:
  - zip
  - batch
  - lua
  - text
  - javascript
  - c
  all:
  - id: objectives/anti-static/obfuscation/string/reconstruct::lua-return-wrapper-indexed-reassembly
  any:
  - id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script
  - id: micro-behaviors/process/create/shell/command-mode::batch-starts-data-argument
- id: archive-lua-runtime-with-indexed-reassembly
  desc: Archive has LuaJIT runtime and indexed reassembly
  conf: 0.97
  scope: archive
  for:
  - zip
  - batch
  - text
  - lua
  - pe
  all:
  - id: well-known/lib/runtime/scripted/luajit::version-banner
  - id: metadata/archive/member/extension::archive-bat-member
  - id: metadata/archive/member/extension::archive-member-text-like-name
  - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
  - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop
- id: archive-data-launch-with-packed-lua
  desc: Archive pairs data-file launch and packed Lua
  conf: 0.99
  attack: T1027
  scope: outer
  for:
  - zip
  - batch
  - text
  - pe
  - lua
  all:
  - id: metadata/archive/member/extension::archive-bat-member
  - id: metadata/archive/member/extension::archive-member-text-like-name
  - id: objectives/anti-static/obfuscation/string/reconstruct::archive-batch-with-indexed-lua-reassembly
  - id: objectives/anti-static/obfuscation/string/reconstruct::lua-return-wrapper-indexed-reassembly
  any:
  - id: metadata/archive/member/filename::archive-lua-interpreter-exe-name
  - id: well-known/lib/runtime/scripted/luajit::version-banner
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
