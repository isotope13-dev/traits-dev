defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: driver-hidden-api
    desc: Encoded NT APIs with kernel API resolution
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/kernel/routines::dynamic-resolution
      - id: micro-behaviors/process/create/thread::thread-manipulation-enc
    any:
      - id: micro-behaviors/mem/protect/modify::mem-protect-enc
      - id: micro-behaviors/data/embedded/payload/header::pe-header-enc
      - id: micro-behaviors/data/embedded/payload/header::pe-data-enc
