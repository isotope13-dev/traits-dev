defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1027
  mbc: B0032

traits:
  # Rust macro bodies are token trees, so the symbol/flow facts do not expose
  # their internal XOR or UTF-8 conversion. Join the macro's name, byte-vector
  # binding, invocation argument and Bot::new argument through AST captures.
  # No particular identifiers, byte values, XOR key or destination are required.
  - id: rust-xor-macro-bot-credential
    desc: XOR/UTF-8 macro reconstructs bot credential
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (source_file
          (macro_definition
            name: (identifier) @decoder_name
            (macro_rule right: (token_tree (token_tree
              "let" (identifier) @decoded_name
              "="
              (metavariable)
              "." (identifier) @iter (token_tree)
              "." (identifier) @map (token_tree "|" "^" )
              "." (identifier) @collect (token_tree)
              ";"
              (identifier) @string_type "::" (identifier) @utf8
              (token_tree (identifier) @decoded_use))))) @decoder
          (function_item body: (block
            (let_declaration
              pattern: (identifier) @bytes_name
              value: (macro_invocation
                macro: (identifier) @vector_name
                (token_tree) @vector))
            (let_declaration
              pattern: (identifier) @token_name
              value: (macro_invocation
                macro: (identifier) @decoder_use
                (token_tree (identifier) @bytes_use)))
            (let_declaration
              value: (call_expression
                function: (scoped_identifier
                  path: (identifier) @bot_type
                  name: (identifier) @constructor)
                arguments: (arguments (identifier) @token_use)))))
          (#eq? @decoder_name @decoder_use)
          (#eq? @bytes_name @bytes_use)
          (#eq? @token_name @token_use)
          (#eq? @vector_name "vec")
          (#eq? @bot_type "Bot")
          (#eq? @constructor "new")
          (#eq? @decoded_name @decoded_use)
          (#eq? @iter "iter")
          (#eq? @map "map")
          (#eq? @collect "collect")
          (#eq? @string_type "String")
          (#eq? @utf8 "from_utf8")
          (#match? @vector "^\\[\\s*(?:0x[0-9a-fA-F]+|[0-9]+)(?:\\s*,\\s*(?:0x[0-9a-fA-F]+|[0-9]+)){4,}\\s*,?\\s*\\]$")
        )

composite_rules:
  - id: rust-session-theft-xor-credential-concealment
    desc: XOR bot credential concealment with session theft
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: rust-xor-macro-bot-credential
      - id: objectives/exfiltration/stealer/credential/token::rust-telegram-session-archive-upload
