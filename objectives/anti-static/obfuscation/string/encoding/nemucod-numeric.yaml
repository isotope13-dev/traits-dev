defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: common-test-require-function
    desc: Common test helper require
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: require\(['"]\.\./common['"]\)|function test\(\) \{
  - id: nemucod-numeric-string-encoding
    desc: "Nemucod-style concatenated numeric encoding"
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      # Separators limited to Nemucod-like joiners (comma/plus/quote/space).
      # Allowing any [^\d\w] matched HTML URL-encoding (%20%20%20…) in bug
      # trackers and mail archives.
      regex: (\d{2,3}[,+\s\"']){29,}\d{2,3}
    # Nemucod joins byte-sized character codes. A run containing a value above
    # 255 is coordinate or metrics data (SVG path `d` strings, glyph tables).
    not:
      - regex: '\b(25[6-9]|2[6-9]\d|[3-9]\d\d)\b'
    unless:
      # Octane/ARES-6 benchmark corpora vendor whole real programs as input.
      - id: metadata/package/testing/presence/harness::benchmark-corpus-path
      - id: objectives/anti-static/obfuscation/code-metrics/structure/
      # Expected-output vectors in parser/regexp tests are numeric data, not
      # character-code concealment.
      - id: "metadata/file/naming::test-directory-component"
      - id: objectives/anti-static/obfuscation/string/encoding::numeric-string-table-not-encoding
      - id: well-known/lib/format/zip-js::zip-js-library-marker
      - id: metadata/package/name/vocabulary::mui-package-name
      - type: text
        regex: "calcMode\\s*:\\s*['\"]discrete['\"]|<animateTransform|<mask\\b|\"[ug]b?Chars\""
      - id: metadata/package/documentation/page::static-html-shell
      - id: well-known/tool/sysadmin/unix-benign::emacs-install-tree
    size_max: 500000
    attack: T1027
    mbc: B0032

composite_rules:
  - id: numeric-string-table-not-encoding
    desc: Numeric table that is not string encoding
    crit: exception
    conf: 0.9
    any:
      # Rustdoc search indexes store item-kind codes in long numeric
      # arrays ("t":[13,13,...]); generated documentation data.
      - id: metadata/build/generated::rustdoc-search-index-js
      - id: well-known/lib/format/libphonenumber-js::source-map-bundle-marker
      - id: well-known/lib/web/authoring/jshint::jshint-non-ascii-identifier-data
      - id: well-known/lib/development/caniuse-lite::regional-browser-usage-table
      - id: metadata/build/bundler/runtime::vite-bundled
      - id: metadata/file/format/markup::svg-vector-shape-markup
      - id: common-test-require-function
      - id: well-known/lib/web/client-side/jsmath::jsmath-math-library-marker
      - id: well-known/lib/format/jlatexmath::gwt-font-table
  - id: nemucod-numeric-recognized-marker
    desc: Recognized numeric string marker
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/package/testing/harness/runtime::is-test
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      - id: well-known/lib/testing/nodeunit::nodeunit
      - id: metadata/build/bundler/wrapper::js-umd-wrapper
      - id: metadata/build/minifier::js-umd-wrapper-minified
      - id: metadata/build/bundler/wrapper::js-umd-wrapper-amd
      - id: metadata/build/minifier::js-umd-wrapper-amd-minified
      - id: objectives/anti-static/obfuscation/code-metrics/structure::minified-code
      - id: metadata/package/runtime::vscode-extension
