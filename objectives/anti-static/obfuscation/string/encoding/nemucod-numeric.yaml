defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: common-test-require-function
    desc: Common test helper require
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: require\(['"]\.\./common['"]\)|function test\(\) \{
  - id: nemucod-numeric-string-encoding
    desc: "Nemucod-style concatenated numeric encoding"
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      # Separators limited to Nemucod-like joiners (comma/plus/quote/space).
      # Allowing any [^\d\w] matched HTML URL-encoding (%20%20%20…) in bug
      # trackers and mail archives.
      regex: (\d{2,3}[,+\s\"']){29,}\d{2,3}
    unless:
      - id: objectives/anti-static/obfuscation/code-metrics/structure/
      - id: common-test-require-function
      - id: metadata/library/runtime::libphonenumber-js-bundle
      - id: metadata/package/manifest/name::mui-package-name
      - type: text
        regex: "calcMode\\s*:\\s*['\"]discrete['\"]|<animateTransform"
      - id: metadata/file/profile/identity::static-html-shell
    size_max: 500000
    attack: T1027
    mbc: B0032
composite_rules:
  - id: nemucod-numeric-recognized-marker
    desc: Recognized numeric string marker
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/package/testing/harness/runtime::is-test
      - id: metadata/package/testing/harness/runtime::test-basename-pattern
      - id: metadata/library/nodeunit::nodeunit
      - id: metadata/library/structure::js-umd-wrapper
      - id: metadata/library/structure::js-umd-wrapper-minified
      - id: metadata/library/structure::js-umd-wrapper-amd
      - id: metadata/library/structure::js-umd-wrapper-amd-minified
      - id: objectives/anti-static/obfuscation/code-metrics/structure::minified-code
      - id: metadata/package/manifest/runtime::vscode-extension
