defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: mixed-codecs-wsh-command-channel
    desc: WSH command channel mixes string encodings
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: objectives/command-and-control/remote-command/http-poll::wsh-http-regexp-command-dispatch
      - id: metadata/lang/encoding/hex::js-dense-hex-escapes
      - id: micro-behaviors/data/decode/charset::indexed-charcode-array-decode
      - id: micro-behaviors/data/decode/quartet-base64::base64-character-index-loop
