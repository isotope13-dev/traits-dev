# Filler-stuffed hex string tables decoded by a one-character strip RegExp
# and handed to ActiveX: the ProgID and command line never appear in the
# file. Seen in Brazilian banker HTA droppers (2023+).
defaults:
  platforms: [windows]
  for: [javascript, html]
  crit: hostile
  attack: T1027,T1059.007

composite_rules:
  - id: filler-stuffed-strings-drive-activex
    desc: Filler-stuffed hex strings are stripped at run time and drive an ActiveX object
    conf: 0.94
    all:
      - id: metadata/lang/encoding/shape/escape::filler-stuffed-hex-escape-string
      - id: metadata/lang/encoding/shape/escape::single-character-global-strip-regexp
      - id: micro-behaviors/os/com/instantiation::computed-activex-progid

  # VBS form: every ProgID and path is stuffed with a punctuation token that a
  # Replace helper removes before CreateObject sees it.
  - id: vbs-filler-stripped-strings-drive-createobject
    for: [vbs]
    desc: Filler-stuffed VBS strings are stripped at run time and passed to CreateObject
    conf: 0.94
    all:
      - id: metadata/lang/encoding/shape/escape::vbs-punctuation-filler-variable
      - id: metadata/lang/encoding/shape/escape::vbs-replace-variable-with-empty-helper
      - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
