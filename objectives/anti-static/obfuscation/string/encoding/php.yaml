defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0032
  attack: T1027
traits:
- id: urlencoded-payload-parameter
  desc: URL-encoded payload parameter blob
  crit: suspicious
  conf: 0.9
  size_max: 4096
  if:
    type: string_literal
    regex: ^[A-Za-z_][A-Za-z0-9_]{0,15}===?[A-Za-z0-9+/]{120,}$
- id: reversed-base64-padding-parameter
  desc: Reversed b64 blob starts with JSON terminator
  crit: suspicious
  conf: 0.97
  size_max: 4096
  if:
    type: string_literal
    regex: ^[A-Za-z_][A-Za-z0-9_]{0,15}===QX[A-Za-z0-9+/]{80,}$
- id: encoded-json-callback-array
  desc: Reversed base64 callback array marker
  crit: suspicious
  conf: 0.96
  if:
    type: string_literal
    substr: bvlGdj5Wdm9VZ0FWZyNmIsIyYuVnZfJXZzV3XsxWYjJyW
- id: encoded-eval-file-get-contents-http
  desc: Reversed base64 eval fetch marker
  crit: suspicious
  conf: 0.97
  if:
    type: string_literal
    substr: L1QTMuUDNv8iOwRHdodCKzRnblRnbvN2X0V2ZfVGbpZGK
- id: strings-chr-concat
  desc: String obfuscation via chr() concatenation
  crit: notable
  conf: 0.66
  count_min: 10
  if:
    type: text
    regex: chr\(\d+\)\s*\.\s*chr\(\d+\)
  unless:
  - id: well-known/lib/format/tcpdf::tcpdf-library-source
  - id: well-known/lib/format/fpdf::fpdf-font-definition-context
  - id: well-known/lib/ai/phpinsight::phpinsight-library-context
- id: php-dense-chr-calls
  desc: Dense chr() calls (string building)
  crit: notable
  conf: 0.9
  count_min: 10
  per_kb_min: 2.0
  if:
    type: text
    regex: chr\s*\(\s*\d
  unless:
  - id: well-known/lib/format/tcpdf::tcpdf-library-source
  - id: well-known/lib/format/fpdf::fpdf-font-definition-context
  - id: well-known/lib/format/mpdf::mpdf-library-source-tree
  - id: well-known/lib/ai/phpinsight::phpinsight-library-context
- id: dense-pack-calls
  desc: Dense PHP pack() hex-format calls
  crit: suspicious
  conf: 0.88
  count_min: 3
  per_kb_min: 0.5
  if:
    type: symbol
    kind: call
    exact: pack
    arg:
      kind: string
      substr: H
  unless:
  - id: micro-behaviors/data/encode/hex::php-hex-unpack-repack-endian
  - id: micro-behaviors/data/encode/hex::php-pack-hex-from-hash-digest
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: well-known/lib/crypto/web-token-jwt::web-token-jwt-core-library
  - id: well-known/lib/development/php-cs-fixer/
  - id: metadata/package/testing/harness/unit/
  - id: metadata/path::test-directory-component
  - id: well-known/lib/stdlib/thecodingmachine-safe::thecodingmachine-safe-library
- id: dense-base64-decode
  desc: Dense base64_decode calls
  crit: notable
  conf: 0.9
  count_min: 3
  per_kb_min: 0.5
  if:
    id: micro-behaviors/data/decode/base64::php-base64-decode-call
- id: dense-rot13
  desc: Dense str_rot13 calls
  crit: suspicious
  conf: 0.85
  count_min: 2
  per_kb_min: 0.3
  if:
    type: symbol
    exact: str_rot13
  unless:
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: well-known/app/publishing/salesmanago::salesmanago-wordpress-plugin
  - id: well-known/lib/runtime/scripted/php-standard-library::php-standard-library-package
  - id: well-known/lib/runtime/scripted/php-standard-library::psl-namespace
  - id: well-known/app/publishing/leazycms::leazycms-package-context
- id: dense-variable-variables
  desc: Dense PHP variable-variable statements
  crit: suspicious
  conf: 0.85
  count_min: 3
  per_kb_min: 1.0
  if:
    type: text
    regex: ^\s*\$\$[a-z_][A-Za-z0-9_]*\b
  unless:
  - type: text
    regex: namespace\s+Nettes?(?:[\\;]|$)
  - id: well-known/app/publishing/civicrm/
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: well-known/lib/web/server/nette::nette-framework-source
  - id: well-known/lib/development/php-parser::legacy-test-expected-output
  - id: well-known/lib/development/phpstan/
- id: dense-create-function-calls
  desc: Dense create_function calls on variables
  crit: suspicious
  conf: 0.92
  count_min: 3
  per_kb_min: 0.5
  if:
    type: text
    regex: '[^@A-Za-z0-9_>:]create_function\s*\(\s*\$'
  unless:
  - id: metadata/file/extension/identity::yara-extension
  - id: metadata/package/testing/harness/unit/
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
- id: array-map-chr-codepoint-list
  desc: String decoded from a chr() code-point list
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: array_map\s*\(\s*["']chr["']\s*,\s*\[\s*\d{1,3}\s*,
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
composite_rules:
- id: php-reversed-urlencode-base64-stager
  desc: Reversed URL-encoded base64 PHP stager
  crit: suspicious
  conf: 0.99
  all:
  - id: urlencoded-payload-parameter
  - id: reversed-base64-padding-parameter
  any:
  - id: encoded-json-callback-array
  - id: encoded-eval-file-get-contents-http
- id: php-multi-layer-obfuscation
  desc: Multi-layer PHP obfuscation
  crit: suspicious
  conf: 0.95
  needs: 2
  any:
  - id: dense-base64-decode
  - id: dense-rot13
  - id: metadata/lang/source/syntax/call/arguments::php-dense-variable-eval-syntax
  - id: dense-create-function-calls
