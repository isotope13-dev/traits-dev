# A Base32-decoded string handed to a shell through execFile in one routine.
# Base32 has no place in ordinary Node code paths (Buffer has no native
# codec for it), so an opaque Base32 constant decoded within 1 KB of an
# execFile of /bin/sh or cmd.exe conceals the command it launches.
defaults:
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: node-base32-shell-loader
  desc: Decodes a Base32 string and runs it through a shell
  crit: hostile
  conf: 0.99
  near_bytes: 1024
  for:
  - javascript
  - typescript
  attack: T1027,T1059.004
  all:
  - id: micro-behaviors/data/decode/base32::node-base32-decoder-call
  - id: micro-behaviors/process/create/exec::node-execfile-reference
  - id: micro-behaviors/process/create/shell/path::shell-executable-reference
