# File-local Base32 syntax occurs beside Node shell launch references.
# The matchers do not bind decoded bytes to the process argument.
defaults:
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: node-base32-shell-loader
  desc: Base32 token near Node shell execution
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  - typescript
  attack: T1027,T1059.004
  all:
  - id: micro-behaviors/data/decode/base32::node-base32-decoder-call
  - id: micro-behaviors/process/create/exec::node-execfile-reference
  - id: micro-behaviors/process/create/shell/path::shell-executable-reference
