defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-unicode-escape
  desc: Unicode escape sequences in string
  crit: notable
  conf: 0.85
  mbc: B0032
  attack: T1027
  for:
  - javascript
  - typescript
  count_min: 3
  if:
    type: string_literal
    regex: (\\u[0-9a-fA-F]{4}){4,}
  not:
  - regex: \\u(1680|180[eE]|200[0-9a-aA-A]|202[fF]|205[fF]|3000)
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: well-known/lib/ui/equinor-eds::equinor-eds-core-react-library
  - id: well-known/lib/network/atproto-api::atproto-api-pnpm-bundle-path
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  downgrade:
    any:
    - id: metadata/build/
- id: js-interspersed-hex-escapes
  desc: Interspersed hex escape sequences
  crit: notable
  conf: 0.8
  mbc: B0032
  attack: T1027
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: (\\x[0-9a-fA-F]{2}.{1,3}){4,}
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/app/ai/browser-agent/open-webui-computer/
  - id: well-known/app/ai/eve::eve-compiled-vendor-bundle-path
  - id: metadata/build/
  - type: text
    regex: (\\\\x[0-9a-fA-F]{2}-\\\\x[0-9a-fA-F]{2}){2,})
  - id: "metadata/file/naming::short-stem-js-basename"
- id: js-hex-encoded-require
  desc: Hex-encoded require statement
  crit: suspicious
  conf: 0.92
  mbc: B0032
  attack: T1027
  for:
  - javascript
  if:
    type: text
    regex: require\s*\(\s*Buffer\.from\([^)]{0,120}hex[^)]{0,120}\)\.toString\(\)
- id: js-b64-encoded-require
  desc: Base64-encoded require statement
  crit: suspicious
  conf: 0.92
  mbc: B0032
  attack: T1027
  for:
  - javascript
  if:
    type: text
    regex: require\(Buffer\.from\([^)]{0,60}base64
- id: js-window-write-exec
  desc: window assignment to exec primitive
  crit: notable
  conf: 0.7
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    kind: assignment
    language: javascript
    regex: \bwindow\.(o[^n]\w*|[^o]\w*)\s*=\s*(new\s+Function|Function|eval)\b
  unless:
  - id: well-known/lib/web/docsify::docsify-library
  - id: well-known/lib/web/docsify::docsify-execute-result-marker
- id: js-window-write-decode
  desc: window assignment to decode primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "window")
      (#match? @r "^(atob|btoa|Buffer)$") (#not-eq? @p @r)) @a'
- id: js-window-write-network
  desc: window assignment to network primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "window")
      (#match? @r "^(fetch|XMLHttpRequest|WebSocket)$") (#not-eq? @p @r)) @a'
- id: js-globalthis-write-exec
  desc: globalThis assignment to exec primitive
  crit: notable
  conf: 0.7
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    kind: assignment
    language: javascript
    regex: \bglobalThis\.\w+\s*=\s*(new\s+Function|Function|eval)\b
- id: js-globalthis-write-decode
  desc: globalThis assignment to decode primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "globalThis")
      (#match? @r "^(atob|btoa|Buffer)$") (#not-eq? @p @r)) @a'
- id: js-globalthis-write-network
  desc: globalThis assignment to network primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "globalThis")
      (#match? @r "^(fetch|XMLHttpRequest|WebSocket)$") (#not-eq? @p @r)) @a'
- id: js-global-self-bracket-assignment
  desc: Dynamic self bracket property assignment
  crit: suspicious
  conf: 0.6
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: text
    regex: \bself\[[^\]]{1,120}\]\s*=\s*(eval|Function|atob)\b
- id: js-require-alias
  desc: Require function aliasing
  crit: suspicious
  conf: 0.9
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: text
    regex: =\\s*require\\s*;
- id: markdown-it-bundle
  desc: markdown-it bundled library marker
