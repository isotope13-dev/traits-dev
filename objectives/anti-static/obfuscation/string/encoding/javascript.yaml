  - id: well-known/lib/web/client-side/jquery::license-url
  - id: well-known/lib/web/client-side/prototype::copyright
  - id: well-known/lib/web/client-side/ecmascript::shutter-reloaded-lightbox
  - id: well-known/lib/web/authoring/docsify::docsify-library
  - id: well-known/lib/runtime/scripted/electron::electron-app-asar-member-path
  - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
- id: js-window-property-write-assignment
  desc: window high-risk property assignment
  crit: component
  conf: 0.7
  any:
  - id: js-window-write-exec
  - id: js-window-write-decode
  - id: js-window-write-network
- id: js-globalthis-property-write-assignment
  desc: globalThis high-risk property assignment
  crit: component
  conf: 0.7
  any:
  - id: js-globalthis-write-exec
  - id: js-globalthis-write-decode
  - id: js-globalthis-write-network
# Aliasing a native exec/decode/network primitive under a new window or
# globalThis name. Alone this is ordinary: OpenNext keeps the unpatched
# `fetch` as `globalThis.internalFetch` before Next.js wraps it. The
# obfuscation finding is js-global-property-write above, which also needs
# eval, Function, or atob in the same file.
- id: js-global-property-write-assignment
  desc: Global alias of exec/decode/network primitive
  crit: notable
  conf: 0.6
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  any:
  - id: js-window-property-write-assignment
  - id: js-globalthis-property-write-assignment
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/build/
  - id: well-known/lib/web/authoring/docsify::docsify-library
  - id: well-known/lib/runtime/scripted/electron::electron-app-asar-member-path
  - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
- id: electron-ml-parity-runner
