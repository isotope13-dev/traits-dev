defaults:
  platforms: [windows, unix]
traits:
  - id: js-unicode-escape
    desc: Unicode escape sequences in string
    crit: notable
    conf: 0.85
    mbc: B0032
    attack: T1027
    for:
      - javascript
      - typescript
    count_min: 3
    if:
      type: string_literal
      regex: (\\u[0-9a-fA-F]{4}){4,}
    not:
      - regex: \\u(1680|180[eE]|200[0-9a-aA-A]|202[fF]|205[fF]|3000)
    unless:
      - id: objectives/anti-static/obfuscation/string/encoding/
      # Unicode escapes in a generated production bundle are commonly
      # library tables or localized data, not concealed source. The bundle
      # structure remains visible to other traits, including decoder and
      # dynamic-execution indicators.
      - id: metadata/library/structure::js-large-minified-bundle
    downgrade:
      any:
        - id: metadata/library/structure/
  - id: js-interspersed-hex-escapes
    desc: Interspersed hex escape sequences
    crit: notable
    conf: 0.8
    mbc: B0032
    attack: T1027
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      # Require ordinary characters between escapes. Contiguous escaped bytes
      # are common in binary/document headers, not string obfuscation.
      regex: (\\x[0-9a-fA-F]{2}.{1,3}){4,}
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/browser-agent/open-webui-computer/
      - id: metadata/library/structure/
      # Character-range tables such as lodash's Unicode classes use adjacent
      # escaped endpoints separated by hyphens; that is data, not obfuscation.
      # Match the source spelling (two backslashes before each x escape).
      - type: text
        regex: '(?:\\\\x[0-9a-fA-F]{2}-\\\\x[0-9a-fA-F]{2}){2,}'
      # Locale modules commonly encode non-ASCII translations as interspersed
      # \xNN escapes; that is generated localization data, not obfuscation.
      - id: metadata/file/profile/locale::i18n-lang-code-js-basename
      - id: metadata/file/profile/locale::i18n-lang-code-module-basename
  - id: js-hex-encoded-require
    desc: Hex-encoded require statement
    crit: suspicious
    conf: 0.92
    mbc: B0032
    attack: T1027
    for:
      - javascript
    if:
      type: text
      regex: require\s*\(\s*Buffer\.from\([^)]{0,120}hex[^)]{0,120}\)\.toString\(\)
  - id: js-b64-encoded-require
    desc: Base64-encoded require statement
    crit: suspicious
    conf: 0.92
    mbc: B0032
    attack: T1027
    for:
      - javascript
    if:
      type: text
      regex: require\(Buffer\.from\([^)]{0,60}base64
  - id: js-window-write-exec
    desc: window assignment to exec primitive
    crit: component
    conf: 0.7
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      # Parse assignments so commented examples do not count as executable
      # global mutation.
      type: tree-sitter
      kind: assignment
      language: javascript
      # Browser event-handler wiring is ordinary UI code, not a concealed
      # global dispatch table; custom window properties remain in scope.
      regex: \bwindow\.(o[^n]\w*|[^o]\w*)\s*=\s*(new\s+Function|Function|eval)\b
    unless:
      - id: metadata/library/docsify::docsify-library
      - id: metadata/library/docsify::docsify-execute-result-marker
  - id: js-window-write-decode
    desc: window assignment to decode primitive
    crit: component
    conf: 0.65
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: \bwindow\.\w+\s*=\s*(atob|btoa|Buffer)\b
  - id: js-window-write-network
    desc: window assignment to network primitive
    crit: component
    conf: 0.65
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: \bwindow\.\w+\s*=\s*(fetch|XMLHttpRequest|WebSocket)\b
  - id: js-globalthis-write-exec
    desc: globalThis assignment to exec primitive
    crit: component
    conf: 0.7
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: \bglobalThis\.\w+\s*=\s*(new\s+Function|Function|eval)\b
  - id: js-globalthis-write-decode
    desc: globalThis assignment to decode primitive
    crit: component
    conf: 0.65
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: \bglobalThis\.\w+\s*=\s*(atob|btoa|Buffer)\b
  - id: js-globalthis-write-network
    desc: globalThis assignment to network primitive
    crit: component
    conf: 0.65
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: \bglobalThis\.\w+\s*=\s*(fetch|XMLHttpRequest|WebSocket)\b
  - id: js-global-self-bracket-assignment
    desc: Dynamic self bracket property assignment
    crit: suspicious
    conf: 0.6
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: text
      regex: \bself\[[^\]]{1,120}\]\s*=\s*(eval|Function|atob)\b
  - id: js-require-alias
    desc: Require function aliasing
    crit: suspicious
    conf: 0.9
    attack: T1027.002
    mbc: B0032
    for:
      - javascript
    if:
      type: text
      regex: =\\s*require\\s*;
  - id: markdown-it-bundle
    desc: markdown-it bundled library marker
    crit: baseline
    conf: 0.99
    for:
      - javascript
    if:
      type: text
      substr: "/*! markdown-it 14.1.0 https://github.com/markdown-it/markdown-it"
  - id: js-define-locale-call
    desc: Moment locale bundle marker
    crit: baseline
    conf: 0.99
    for:
      - javascript
    if:
      type: symbol
      exact: defineLocale
  - id: js-string-split
    desc: Split to empty-delimiter char array
    crit: component
    conf: 0.6
    for:
      - javascript
    if:
      type: text
      regex: (\.split|\[\s*["'']split["'']\s*\])\s*\(\s*(""|'')\s*\)
  - id: js-array-join-symbol
    desc: Join using empty string delimiter
    crit: component
    conf: 0.5
    for:
      - javascript
    if:
      type: text
      regex: (\.join|\[\s*["'']join["'']\s*\])\s*\(\s*(""|'')\s*\)
  - id: js-array-reverse
    desc: Array reverse method
    crit: baseline
    conf: 0.5
    for:
      - javascript
    if:
      type: text
      regex: (\.reverse|\[\s*["'']reverse["'']\s*\])\s*\(\s*\)
    unless:
      - id: well-known/lib/crypto/zxcvbn::zxcvbn-ranked-dictionaries
      - type: symbol
        exact: matching
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: js-split-join-cleanup
    desc: String cleanup using split(key).join("")
    crit: suspicious
    conf: 0.8
    for:
      - javascript
    count_min: 2
    if:
      type: text
      regex: \.split\(\s*".{1,30}"\s*\)\.join\(\s*""\s*\)
    not:
      # A delimiter built from newline/CR/tab escapes is line-ending or
      # whitespace normalisation (strip all newlines), not junk-marker
      # removal. Obfuscators split on a printable filler token.
      - regex: '\\[rnt]'
      # ANSI bracketed-paste delimiters are terminal input framing, not
      # concealed payload markers.
      - regex: '\\x1b\[20[01]~'
    downgrade:
      any:
        - id: metadata/library/structure::google-tag-manager-bundle
    unless:
      - id: metadata/library/runtime::core-js-runtime-bundle
      - id: metadata/library/structure/
  - id: js-long-marker-split-join-cleanup
    desc: Long marker stripped via split join
    crit: suspicious
    conf: 0.9
    for:
      - javascript
    count_min: 2
    if:
      type: text
      regex: \.split\(\s*["'][A-Za-z0-9]{10,30}["']\s*\)\.join\(
    unless:
      - id: well-known/lib/web/jquery/
      - id: well-known/lib/ai/mathjax/
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: js-long-delimiter-split-join-cleanup
    desc: Long delimiter stripped via repeated split join
    crit: suspicious
    conf: 0.94
    attack: T1027.002
    mbc: B0032
    for: [javascript]
    count_min: 2
    if:
      type: text
      # The delimiter must be ONE string literal: `[^"]` instead of `.` stops
      # the window from swallowing the closing quote and stitching an unrelated
      # `.join("")` onto a distant `.split("...")`. With a bare `.` this matched
      # `s.split(" ").filter(Boolean),o=s.map(r=>r[0]||"").join("")` in
      # intl-tel-input, i.e. two ordinary one-character splits, not a delimiter.
      regex: '\.split\(\s*"[^"]{10,100}"\s*\)\.join\(\s*""\s*\)'
    not:
      # Same discriminator as js-split-join-cleanup: escaped newline/CR/tab
      # delimiters are text normalisation, not a concealed junk marker.
      - regex: '\\[rnt]'
      # ANSI bracketed-paste delimiters are terminal input framing, not
      # concealed payload markers.
      - regex: '\\x1b\[20[01]~'
    unless:
      - id: metadata/build/bundler::babel-transpiled
      - id: metadata/library/structure::js-large-minified-bundle
  - id: js-repeated-marker-token
    desc: Dense repeated string marker token
    crit: component
    conf: 0.93
    for:
      - javascript
    size_min: 20000
    count_min: 40
    if:
      type: text
      substr: sijRysBVHh
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: js-marker-split-join-cleanup-call
    desc: Marker stripped via split join
    crit: component
    conf: 0.93
    for:
      - javascript
    if:
      type: text
      substr: '.split("sijRysBVHh").join("")'
  - id: js-afcrk-repeated-marker-token
    desc: Dense AFcrk marker padding
    crit: suspicious
    conf: 0.96
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    size_min: 20000
    count_min: 40
    if:
      type: text
      substr: AFcrkFAbmFdInk
  - id: js-gcfombg-repeated-marker-token
    desc: Dense gcFombg marker padding
    crit: suspicious
    conf: 0.97
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    size_min: 20000
    count_min: 40
    if:
      type: text
      substr: gcFombgkSgmerA
  # Deep chained split/join (4+ levels) - string permutation obfuscation
  - id: js-deep-split-join-chain
    desc: Repeated split/join string rewrite chain
    crit: notable
    conf: 0.92
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
    if:
      type: symbol
      regex: "(\\.split\\.join|\\.join\\.split){3,}"
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - type: string_literal
        substr: "\\0SLASH"
  - id: dense-fromcharcode
    desc: Dense fromCharCode calls (string obfuscation)
    crit: suspicious
    conf: 0.9
    mbc: B0032
    attack: T1027
    for:
      - javascript
      - typescript
    count_min: 5
    per_kb_min: 1.0
    if:
      type: string_literal
      regex: fromCharCode\s*\(\s*\d
    unless:
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
  - id: fromcodepoint-with-base-decode
    desc: 'fromcodepoint with base decode'
    crit: notable
    conf: 0.9
    mbc: B0032
    attack: T1027
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: from(CodePoint|CharCode).{0,40}(atob|Buffer\.from)
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/pdfjs::pdfjs-bundle
      - id: well-known/lib/format/pdfjs::pdfjs-pdfworker-class
      - id: metadata/package/quality/benign-context::adblock-filter-resource
      - type: text
        substr: fromCharCode(parseInt
  - id: dense-unicode-escapes
    desc: Dense Unicode escape sequences
    crit: notable
    conf: 0.88
    mbc: B0032
    attack: T1027
    for:
      - javascript
      - typescript
    count_min: 4
    per_kb_min: 0.8
    if:
      type: string_literal
      regex: (\\u[0-9a-fA-F]{4}){3,}
    unless:
      - id: objectives/anti-static/obfuscation/string/encoding/
      # Production bundles routinely embed Unicode-range regex tables from
      # React, HTML parsers, date/locale libraries, and CSS runtimes.  A large
      # minified bundle is independently identified as generated output; its
      # escape density alone is not evidence of concealment.  Keep the other
      # decoder/eval/import indicators active for bundled malware.
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/upload/
      - type: text
        substr: angular.module("ngLocale")
      - type: basename
        regex: '^angular-locale_'
  - id: js-lzstring-table-split-call
    desc: Splits LZString UTF-16 output
    crit: component
    conf: 0.9
    mbc: B0032
    attack: T1027.002
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: 'decompressFromUTF16\s*\([^)]{0,80}\)\s*\.\s*split\s*\('

  - id: js-alternating-char-obfuscation
    desc: 'Strings with alternating junk characters'
    crit: notable
    conf: 0.8
    for:
      - javascript
    size_max: 100000
    count_min: 5
    if:
      type: text
      regex: '["''][a-zA-Z0-9_]([^a-zA-Z0-9\s"''\\&=%:]{1,3}[a-zA-Z0-9_]){5,}["'']'
    unless:
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
      - id: well-known/app/development/vscode-extension/atlascode/
  # Library identities are supplied by metadata/library and well-known/lib.
  # Keep this objective file focused on obfuscation evidence rather than
  # duplicating generic jQuery/MathJax markers here.
  - id: js-function-return-import
    desc: Function constructor dynamic import idiom
    crit: component
    conf: 0.86
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: 'Function\(["'']return import["'']\)\(\)'
  - id: js-unicode-escape-ui-text
    desc: Unicode escaped UI text assignment
    crit: component
    conf: 0.88
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\b(textContent|placeholder)\s*=\s*["''](\\u[0-9a-fA-F]{4}){2,}'
  - id: ts-proto-generated-file
    desc: ts-proto generated file
    crit: component
    conf: 0.98
    for:
      - javascript
      - typescript
    if:
      type: text
      word: tsProtoGlobalThis
