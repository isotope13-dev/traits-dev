defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-hex-encoded-require
  desc: Hex-encoded require statement
  crit: suspicious
  conf: 0.92
  mbc: B0032
  attack: T1027
  for:
  - javascript
  unless:
  # js-x-ray detects this pattern, so its probe sources and README document
  # the exact call shape; the scanner's distribution carries it as reference
  # data, not as obfuscation.
  - id: well-known/tool/detection/js-x-ray::js-x-ray-distribution
  if:
    type: text
    regex: require\s*\(\s*Buffer\.from\([^)]{0,120}hex[^)]{0,120}\)\.toString\(\)
- id: js-b64-encoded-require
  desc: Base64-encoded require statement
  crit: suspicious
  conf: 0.92
  mbc: B0032
  attack: T1027
  for:
  - javascript
  if:
    type: text
    regex: require\(Buffer\.from\([^)]{0,60}base64
- id: js-window-write-exec
  desc: window assignment to exec primitive
  crit: notable
  conf: 0.7
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "window")
      (#match? @r "^(Function|eval)$") (#not-eq? @p @r)) @a'
  unless:
  - id: well-known/lib/web/authoring/docsify::docsify-library
  - id: well-known/lib/web/authoring/docsify::docsify-execute-result-marker
- id: js-window-write-decode
  desc: window assignment to decode primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "window")
      (#match? @r "^(atob|btoa|Buffer)$") (#not-eq? @p @r)) @a'
- id: js-window-write-network
  desc: window assignment to network primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "window")
      (#match? @r "^(fetch|XMLHttpRequest|WebSocket)$") (#not-eq? @p @r)) @a'
- id: js-globalthis-write-exec
  desc: globalThis assignment to exec primitive
  crit: notable
  conf: 0.7
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "globalThis")
      (#match? @r "^(Function|eval)$") (#not-eq? @p @r)) @a'
- id: js-globalthis-write-decode
  desc: globalThis assignment to decode primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "globalThis")
      (#match? @r "^(atob|btoa|Buffer)$") (#not-eq? @p @r)) @a'
- id: js-globalthis-write-network
  desc: globalThis assignment to network primitive
  crit: notable
  conf: 0.65
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: tree-sitter
    language: javascript
    query: '(assignment_expression left: (member_expression object: (identifier) @o
      property: (property_identifier) @p) right: (identifier) @r (#eq? @o "globalThis")
      (#match? @r "^(fetch|XMLHttpRequest|WebSocket)$") (#not-eq? @p @r)) @a'
- id: js-global-self-bracket-assignment
  desc: Dynamic self bracket property assignment
  crit: suspicious
  conf: 0.6
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: text
    regex: \bself\[[^\]]{1,120}\]\s*=\s*(eval|Function|atob)\b
- id: js-require-alias
  desc: Require function aliasing
  crit: suspicious
  conf: 0.9
  attack: T1027.002
  mbc: B0032
  for:
  - javascript
  if:
    type: text
    regex: =\\s*require\\s*;
- id: markdown-it-bundle
  desc: markdown-it bundled library marker
  crit: baseline
  conf: 0.99
  for:
  - javascript
  if:
    type: text
    substr: /*! markdown-it 14.1.0 https://github.com/markdown-it/markdown-it
- id: js-define-locale-call
  desc: Moment locale bundle marker
  crit: baseline
  conf: 0.99
  for:
  - javascript
  if:
    type: symbol
    exact: defineLocale
- id: js-function-return-import
  desc: Function constructor dynamic import idiom
  crit: notable
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: Function\(["']return import["']\)\(\)
- id: ts-proto-generated-file
  desc: ts-proto generated file
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    word: tsProtoGlobalThis
- id: js-byte-array-buffer-string
  desc: String rebuilt from a decimal byte array
  crit: suspicious
  conf: 0.88
  mbc: B0032
  attack: T1027
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: 'Buffer\.from\(\s*\[[\d,\s]{6,400}\]\s*\)\.toString\([^)\r\n]{0,30}\)'
  not:
    - regex: '(?i)toString\(\s*[''"](base64|hex)'
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: js-byte-array-encoded-require
  desc: require/resolve of a byte-array-encoded name
  crit: suspicious
  conf: 0.94
  mbc: B0032
  attack: T1027
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: require(\.resolve)?\s*\(\s*Buffer\.from\(\s*\[\s*\d{2,3}\s*,
