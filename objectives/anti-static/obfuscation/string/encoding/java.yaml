defaults:
  platforms: [windows, unix]
  for: [class, java_class, jar, zip]
  attack: T1027
  mbc: F0001

traits:
  # A class with many hexadecimal strings may have moved API hosts, class names
  # and method names out of the source. A few such strings can still be hashes
  # or key material, so this objective starts at a higher count than the
  # neutral metadata fact below.
  - id: java-hex-encoded-string-pool
    desc: Many hexadecimal Java strings
    crit: suspicious
    conf: 0.9
    for: [class, java_class]
    count_min: 8
    if:
      id: metadata/file/encoded::multiple-hex-class-literals

  # Common skid/string-encryptor descriptor: decrypt(int[], int[], int, int) -> String
  - id: java-int-array-string-decrypt-descriptor
    desc: Java int-array string decrypt method descriptor
    crit: suspicious
    conf: 0.93
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: '([I[III)Ljava/lang/String;'
