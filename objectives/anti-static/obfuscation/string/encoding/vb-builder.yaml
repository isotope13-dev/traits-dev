# A crypter's string-obfuscation workshop, in Visual Basic. These functions do
# not hide anything themselves -- they are the tooling that produces hidden
# strings for whatever the operator is packing, which is why they turn up in
# builder projects rather than in payloads.
#
# `StrToChar` is the clearest case: it takes a plaintext string and returns
# the *source code* `Chr$(72) & Chr$(101) & ...` that reproduces it. A program
# that emits `Chr()` call text one character at a time is writing an obfuscator
# output, not computing a value.
defaults:
  platforms: [windows]
  for: [vbs, csharp, oledoc, ooxml]
  attack: T1027
  mbc: B0032

traits:
  - id: chr-call-source-emitter
    desc: Emits Chr() source per input character
    crit: suspicious
    conf: 0.94
    if:
      # `"Chr$(" & Asc(Mid(hText, i, 1)) & ")"` -- the literal `Chr(` opening
      # is being *written out*, with the character code computed by `Asc`.
      # Ordinary code calls `Chr`; only a generator quotes it.
      type: text
      regex: '(?i)"Chr\$?\("\s*&\s*Asc\s*\('

  - id: rotating-character-shift-cipher
    desc: Shifts each character by a fixed offset
    crit: suspicious
    conf: 0.88
    if:
      # `Mid(s,i,1) = Chr(Asc(Mid(s,i,1)) + n)` -- a ROT-n applied in place
      # across the string. Reversible by design and used to keep payload
      # strings out of a scanner's reach, never as real encryption.
      type: text
      regex: '(?i)Chr\s*\(\s*Asc\s*\([^\n]{0,40}\)\s*[+-]\s*[A-Za-z0-9_]'

composite_rules:
  - id: vb-string-obfuscation-builder
    desc: VB tooling that generates hidden strings
    crit: suspicious
    conf: 0.93
    any:
      - id: chr-call-source-emitter
      - id: rotating-character-shift-cipher
    needs: 2
