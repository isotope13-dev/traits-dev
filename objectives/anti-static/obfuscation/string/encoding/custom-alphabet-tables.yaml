# Many separately scrambled alphabets plus memoized transforms distinguish
# concealed string tables from an ordinary codec with one stable alphabet.
# Bun and minification markers do not refute this concealment evidence.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.98
  attack: T1027
composite_rules:
  - id: js-custom-alphabet-string-tables
    desc: Many symbol alphabets beside indexed transforms
    all:
      - id: metadata/file/profile/string-population::many-91-character-symbol-literals
      - id: micro-behaviors/data/property/assign::js-indexed-transform-cache
      - id: micro-behaviors/data/decode/utf8::textdecoder-uint8-alias
      - id: micro-behaviors/data/property/access::hex-key-indexing-cluster
