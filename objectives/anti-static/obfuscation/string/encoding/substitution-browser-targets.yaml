defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027

traits:
  - id: db-substitution-explorer-name
    desc: 0xDB-substitution encoding of explorer.exe
    crit: component
    conf: 0.99
    if:
      type: text
      exact: vckolivi.vcv
  - id: db-substitution-iexplore-name
    desc: 0xDB-substitution encoding of iexplore.exe
    crit: component
    conf: 0.99
    if:
      type: text
      exact: rvckoliv.vcv
  - id: db-substitution-chrome-name
    desc: 0xDB-substitution encoding of chrome.exe
    crit: component
    conf: 0.99
    if:
      type: text
      exact: xsilnv.vcv
  - id: db-substitution-firefox-name
    desc: 0xDB-substitution encoding of firefox.exe
    crit: component
    conf: 0.99
    if:
      type: text
      exact: urivulc.vcv

composite_rules:
  - id: db-substitution-browser-target-set
    desc: Encodes Explorer and browser process names with 0xDB substitution
    crit: suspicious
    conf: 0.99
    all:
      - id: db-substitution-explorer-name
      - id: db-substitution-iexplore-name
      - id: db-substitution-chrome-name
      - id: db-substitution-firefox-name
