# Decimal HTML character references used to hide page text from scanners:
# when every visible word is `&#20320;&#22909;` instead of UTF-8, keyword and
# brand scanners matching cleartext never fire. A stray `&#160;` or `&copy;`
# is ordinary markup; dozens of decimal references per kilobyte is concealment.
# The `makefile` scope is deliberate: extensionless kit pages mistype as
# makefile in the file sniffer, so html-only scoping would leave them blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile]
  attack: T1027.010

traits:
  - id: dense-decimal-char-refs
    desc: Dense decimal HTML character references
    crit: suspicious
    conf: 0.9
    count_min: 15
    per_kb_min: 12.0
    if:
      type: text
      regex: '&#[0-9]{2,7};'

composite_rules:
  - id: entity-obfuscated-harvest-form
    desc: Entity-obfuscated credential harvest form
    crit: hostile
    conf: 0.96
    all:
      - id: dense-decimal-char-refs
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
