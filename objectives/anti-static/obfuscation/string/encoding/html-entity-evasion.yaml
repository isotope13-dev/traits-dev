# Consecutive decimal entities conceal complete text runs. Repeated isolated
# spacing entities (such as Doxygen API-index separators) do not qualify.
# Extensionless kit pages can be classified as makefile by the file sniffer.
defaults:
  platforms: [windows, unix]
  for: [html, makefile]
  attack: T1027.010

traits:
  - id: long-decimal-entity-text
    desc: 15+ consecutive decimal HTML text entities
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(&#[0-9]{2,7};){15,}'
    not:
      # Runs made purely of spacing entities are layout, not concealment:
      # NBSP padding in Arabic/French typography and Doxygen API-index
      # separators. Obfuscated text mixes letter/punctuation codepoints.
      # E-mail templates pad the hidden preheader with zero-width and joiner
      # entities (&#8203;&#847;&#847;...) so mail clients show no body text there.
      - regex: '^(?:&#(?:32|160|173|847|8194|8195|8196|8201|8203|8204|8286|65279);)+$'
      # Entity-encoded e-mail addresses (`mailto:` link and link text) are the
      # standard anti-harvester spelling in generated documentation: the run
      # has an @ and ends in a dotted domain.
      - regex: '&#64;(?:&#[0-9]{2,3};)+&#46;(?:&#[0-9]{2,3};){2,}$'
      # Repeated single-character punctuation (quotes, hyphens, underscores)
      # such as ReDoS test payloads or text dividers are not concealed text.
      - regex: '^(?:&#(?:34|39|45);)+$'
      - regex: '^(?:&#(?:61|95);)+$'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

composite_rules:
  - id: entity-encoded-password-post
    desc: Entity-encoded text beside password POST
    crit: suspicious
    conf: 0.96
    # The encoded run and the credential form must sit together: the claim is
    # that the entities conceal THE FORM, not that a page contains entity
    # padding somewhere and a login widget somewhere else (every Blogger-era
    # page carries the standard Google login widget far from its NBSP runs).
    near_lines: 40
    all:
      - id: long-decimal-entity-text
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
  # The narrow hostile twin: decimal entities layered under percent-byte
  # unescape, rendered only through document.write. One encoding layer is
  # suspicious; both stacked with a runtime decoder is a concealment kit,
  # not typography.
  - id: dual-encoded-concealed-page-write
    desc: Percent and entity encoding stacked in page write
    crit: hostile
    conf: 0.96
    for: [html]
    all:
      - id: long-decimal-entity-text
      - id: micro-behaviors/data/decode/url::js-percent-byte-unescape
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
