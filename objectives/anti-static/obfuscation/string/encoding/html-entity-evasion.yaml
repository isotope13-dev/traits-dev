# Consecutive decimal entities conceal complete text runs. Repeated isolated
# spacing entities (such as Doxygen API-index separators) do not qualify.
# Extensionless kit pages can be classified as makefile by the file sniffer.
defaults:
  platforms: [windows, unix]
  for: [html, makefile]
  attack: T1027.010

traits:
  - id: long-decimal-entity-text
    desc: 15+ consecutive decimal HTML text entities
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(&#[0-9]{2,7};){15,}'

composite_rules:
  - id: entity-encoded-password-post
    desc: Entity-encoded text beside password POST
    crit: suspicious
    conf: 0.96
    all:
      - id: long-decimal-entity-text
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
