# Consecutive decimal entities conceal complete text runs. Repeated isolated
# spacing entities (such as Doxygen API-index separators) do not qualify.
# Extensionless kit pages can be classified as makefile by the file sniffer.
defaults:
  platforms: [windows, unix]
  for: [html, makefile]
  attack: T1027.010

traits:
  - id: long-decimal-entity-text
    desc: 15+ consecutive decimal HTML text entities
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(&#[0-9]{2,7};){15,}'
    not:
      # Runs made purely of spacing entities are layout, not concealment:
      # NBSP padding in Arabic/French typography and Doxygen API-index
      # separators. Obfuscated text mixes letter/punctuation codepoints.
      - regex: '^(?:&#(?:32|160|8194|8195|8196|8201|8286|65279);)+$'

composite_rules:
  - id: entity-encoded-password-post
    desc: Entity-encoded text beside password POST
    crit: suspicious
    conf: 0.96
    # The encoded run and the credential form must sit together: the claim is
    # that the entities conceal THE FORM, not that a page contains entity
    # padding somewhere and a login widget somewhere else (every Blogger-era
    # page carries the standard Google login widget far from its NBSP runs).
    near_lines: 40
    all:
      - id: long-decimal-entity-text
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
