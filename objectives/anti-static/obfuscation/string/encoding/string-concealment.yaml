defaults:
  platforms: [windows, unix]
  attack: T1027.010
  mbc: F0001.005
  for: [binaries]
traits:
  - id: minimal-strings
    desc: Binary has very few readable strings
    crit: suspicious
    conf: 0.7
    size_min: 51200
    if:
      type: metrics
      field: binary.string_count
      max: 20
    not:
      - regex: \.(map|asar|tar\.gz|tgz|zip)$
    downgrade:
      any:
        - id: metadata/binary/section/label::upx-section
    unless:
      - id: string-sparse-by-construction
  - id: string-sparse-dll
    desc: DLL with code but minimal strings
    crit: suspicious
    conf: 0.75
    for:
      - dll
    size_min: 65536
    if:
      type: metrics
      field: binary.string_count
      max: 15
    not:
      - regex: \.(tar\.gz|tgz|zip)$
    unless:
      - id: metadata/signed/unknown::.net-dac
      - id: metadata/binary/framework::electron-desktop-runtime
      - type: basename
        regex: \.(node|asar|map|svg|ttf|pak|bin|dat)$
      - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
      - id: metadata/binary/resource/
      - id: metadata/binary/symbols/compat::zero-import-count
      - id: metadata/binary/vendor/
composite_rules:
  # Binaries whose low string count is a property of what they are, not of
  # runtime string decoding or a concealed import table. Shared by the
  # low-string-count rules here and in imports/concealment.
  - id: string-sparse-by-construction
    desc: Binary is string-sparse by construction
    crit: component
    conf: 0.9
    any:
      # When PE sections extend beyond EOF, the low count reflects a truncated
      # fixture rather than runtime string decoding or encrypted text.
      - id: metadata/binary/section/ratio::pe-section-overflow-present
      # Wine's `apisetschema.dll` is a schema table with no code and no strings.
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      # A PE with no executable section is a resource container (icon library,
      # .mui, stub) with no code for a low string count to be concealing.
      # PeaZip's res/share/icons/peazip_seven.icl -- one `.rsrc` section, 3
      # strings, 0 imports -- scored all four low-string rules.
      - id: metadata/binary/section/ratio::pe-no-executable-sections
      # Generated-stub binaries have no strings by construction: Apple ships
      # libobjc-trampolines.dylib and Xcode's libRemoteInjectionPayload.dylib
      # as pages of emitted trampolines, and darling reimplements the same
      # runtime. Both carry their vendor's identity on the file itself.
      - id: metadata/signed/platform/
      - id: well-known/tool/development/toolchain/darling/
      - id: metadata/binary/resource/firmware/
      # Relocatable objects (.o / Go .syso, embedded eBPF/libbpf skeletons) are
      # string-sparse bytecode, not a concealed standalone payload. Keyed on
      # ET_REL: cleave reports BPF e_machine as "unknown".
      - id: metadata/binary/header/identity::elf-relocatable-object
      # Test binaries included with parser/format libraries are deliberately
      # chosen fixtures, not concealed application payloads.
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::binary-test-directory
      - id: well-known/tool/reverse-engineering/arwen::source-tree-path
      # A Python C-extension entry stub (one PyInit export forwarding to the
      # implementation library) is string-sparse because it is almost empty,
      # not because it decodes strings or hides imports at runtime.
      - id: metadata/binary/symbols/exports::python-extension-stub
  - id: minimal-strings-recognized-marker
    desc: Minimal strings recognized marker
    crit: baseline
    conf: 0.95
    any:
      # Relocatable object files (ET_REL=1), including embedded eBPF/BPF
      # objects, are not packed standalone executables.
      - id: metadata/binary/header/identity::elf-relocatable-object
      - id: metadata/file/extension/asset::packaged-asset-extension
      - id: metadata/file/extension/asset::data-file-extension
      - id: well-known/lib/runtime/scripted/electron::electron-enable-logging-env
      - id: metadata/binary/framework::electron-desktop-runtime
      - id: metadata/signed/platform::apple
      - id: metadata/binary/framework::dotnet-metadata
      # Wine/ReactOS builtin PEs are thin API-provider stubs: string-sparse by
      # design (the implementation lives unix-side), not string-concealed payloads.
      - id: metadata/lang/upstream::windows-system-implementer-dll
