defaults:
  platforms: [unix, windows]
  for: [powershell]

traits:
- id: mshta-https-b64-fragment
  desc: Encoded MSHTA HTTPS fragment
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    exact: EuZXhlIGh0dHBzO
- id: geo-foundation-b64-fragment
  desc: Encoded geo-foundation domain fragment
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    exact: ZvdW5kYXRp

composite_rules:
- id: powershell-mshta-url-fragments
  desc: PowerShell MSHTA URL fragment pair
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/string/encoding::mshta-https-b64-fragment
  - id: objectives/anti-static/obfuscation/string/encoding::geo-foundation-b64-fragment
