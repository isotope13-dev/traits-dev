defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
- id: jscript-numeric-com-encoding-profile
  desc: JScript ActiveX with encoded-string clues
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: micro-behaviors/data/control-flow/analysis::loop-string-access-dynamic-method
  any:
  - id: micro-behaviors/data/encode/string::decimal-string-blob
  - id: micro-behaviors/data/encode/hex::hex-literal-function-argument
- id: jscript-numeric-ps1-write-profile
  desc: JScript encoded strings with script write
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: micro-behaviors/fs/write/content::create-script-file
  - id: micro-behaviors/process/create/flags::execution-policy-bypass
  - id: objectives/anti-static/obfuscation/string/encoding::nemucod-numeric-string-encoding
  any:
  - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
  - id: metadata/file/naming::js-high-entropy-identifier-ratio
