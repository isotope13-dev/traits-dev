defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
- id: jscript-numeric-com-encoding-profile
  desc: JScript ActiveX with encoded-string clues
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/data/control-flow/analysis::loop-string-access-dynamic-method
  any:
  - id: micro-behaviors/data/encode/string::decimal-string-blob
  - id: metadata/lang/encoding/hex::js-hex-string-call-arguments
- id: jscript-numeric-ps1-write-profile
  desc: JScript encoded strings with script write
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/fs/write/content::script-extension-with-text-file-creation
  - id: micro-behaviors/os/security/policy::execution-policy-bypass
  - id: metadata/lang/source/literal/string::long-numeric-run-in-string-literal
  any:
  - id: micro-behaviors/data/string/conversion::js-xor-character-call
  - id: "metadata/file/profile/identifier-population::js-high-entropy-identifier-ratio"
