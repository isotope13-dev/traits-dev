defaults:
  platforms: [windows, unix]
  for: [class]
  crit: suspicious
  conf: 0.94
composite_rules:
  - id: jvm-control-string-xor-decoder
    desc: Control-bearing JVM constants accompany character XOR
    all:
      - id: metadata/lang/encoding/shape::jvm-control-bearing-constant
      - id: micro-behaviors/data/bitwise::jvm-xor-character-array-store
    any:
      - id: metadata/import/jvm::jvm-string-chararray-reference
      - id: metadata/import/jvm::jvm-string-charat-reference
