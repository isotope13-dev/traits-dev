defaults:
  platforms:
    - unix
    - windows
  for: [python, pyc]
  mbc: B0032
  attack: T1027
traits:
  - id: python-octal
    desc: Detects octal-encoded string patterns (\NNN
    crit: component
    conf: 0.7
    for:
      - python
    if:
      type: string_literal
      regex: (\\[0-7]{3}){4,}
  - id: python-chr
    desc: Character code manipulation (chr/ord)
    crit: suspicious
    conf: 0.6
    if:
      type: text
      regex: \\b(chr|ord)\(
  - id: python-xor-modulo-character-reconstruction
    desc: Python reconstructs characters via XOR loop
    crit: suspicious
    conf: 0.96
    # tree-sitter parses source, so the file-level `pyc` default cannot apply
    # here — same narrowing the sibling tree-sitter atoms below carry.
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\bchr\s*\([^\)\n]{0,48}\^[^\)\n]{0,48}%\s*len\s*\('
  # `exec|eval|…("str" + "str")` — an execution sink called with a string-literal
  # concatenation as its argument. Split into two ≤4-alternative source-text
  # atoms to stay under the alt-chain limit; each fires standalone like the
  # single tree-sitter trait it replaced.
  - id: concatenated-execution--g1
    desc: String-concat arg to exec/eval/compile
    crit: suspicious
    conf: 0.85
    for: [python]
    if:
      type: tree-sitter
      kind: call
      # Building an import statement for a dynamically selected module is normal
      # runtime loading, not obfuscation. Exclude the canonical
      # exec("from module import ...") construction pattern directly from the
      # call matcher so other concatenated source execution remains visible.
      regex: '(^|[^.\w])(exec|eval|compile)\s*\(\s*[''"][^''"]{0,80}[''"]\s*\+\s*[''"]'
    not:
      - regex: '\bexec\s*\(\s*[''"]from\s+[\w.]+\s+import\b'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
      - id: metadata/library/python-stdlib::python-stdlib-test-file
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: concatenated-execution--g2
    desc: String-concat arg to b64decode
    crit: suspicious
    conf: 0.85
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\bb64decode\s*\(\s*[''"][^''"]{0,80}[''"]\s*\+\s*[''"]'
    unless:
      - id: metadata/library/python-stdlib::python-stdlib-test-file
  - id: python-dense-chr-calls
    desc: Dense chr() concatenation chain
    crit: suspicious
    conf: 0.9
    count_min: 8
    per_kb_min: 1.5
    if:
      type: raw
      regex: '\bchr\s*\(\s*\d{1,3}\s*\)\s*\+'
    unless:
      - type: basename
        regex: (?i)^(test_.*|.*_test)\.(py|go)$
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/sysadmin/mercurial::mercurial-package-path
      - id: well-known/tool/offensive/xalgorix::repository-member-path
  - id: dense-octal-escapes
    desc: Dense octal escape sequences
    crit: suspicious
    conf: 0.88
    for:
      - pyc
    per_kb_min: 2.0
    if:
      type: text
      regex: (\\[0-7]{3}){4,}
    unless:
      - type: basename
        regex: (?i)^(test_.*|.*_test)\.py$
  - id: dense-ord-calls
    desc: Dense ord() decode arithmetic
    crit: suspicious
    conf: 0.85
    for:
      - python
    size_min: 5000
    per_kb_min: 1.0
    if:
      type: text
      # Shifts are ordinary byte-order parsing (struct/sound/protocol readers),
      # not string concealment. Keep transformations used to decode characters.
      regex: '\bord\s*\([^\)\n]{0,120}\)\s*(\^|[+\-*/%])'
    unless:
      - type: basename
        regex: (?i)^(test_.*|.*_test)\.py$
      - id: metadata/library/python-tooling::cpython-marshal-reader-source
      - id: metadata/lang/source::codegen-source-path
      - id: well-known/app/development/seleniumbase::seleniumbase-browser-automation-framework
  - id: reverse-bytes
    desc: Reverses byte order of encoded data
    crit: suspicious
    conf: 0.9
    for:
      - python
    if:
      type: text
      regex: (fromhex|b64decode|unhexlify)\s*\(\s*['\"][A-Za-z0-9+/=\\x]{32,}['\"]\s*\).{0,60}\[::-1\]
    unless:
      - type: text
        substr: audio_url = compat_b64decode(data_fd[::-1]).decode('utf-8')
composite_rules:
  - id: execute-decoded-content
    desc: Direct execution of decoded content
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/interpreter/eval/invoke::python-eval
      - id: micro-behaviors/data/decode/encoded/capability::python-decode-capability
      - id: python-chr
  - id: python-encoded-pattern
    desc: Detects encoded string patterns (hex
    crit: component
    any:
      - id: micro-behaviors/data/encode/hex::js-dense-hex-escapes
      - id: python-octal
  - id: obfuscated-execution
    desc: Direct execution of encoded string
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/execution/interpreter/eval/invoke::python-eval
      - id: python-encoded-pattern
      - id: python-chr
