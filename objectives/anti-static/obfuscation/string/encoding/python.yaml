defaults:
  platforms:
    - unix
    - windows
  for: [python, pyc]
  mbc: B0032
  attack: T1027
traits:
  - id: python-octal
    desc: Detects octal-encoded string patterns (\NNN
    crit: component
    conf: 0.7
    for:
      - python
    if:
      type: string_literal
      regex: (\\[0-7]{3}){4,}
  - id: python-chr
    desc: Character code manipulation (chr/ord)
    crit: suspicious
    conf: 0.6
    if:
      type: text
      regex: \\b(chr|ord)\(
  - id: concatenated-execution--g1
    desc: String-concat arg to exec/eval/compile
    crit: suspicious
    conf: 0.85
    for: [python]
    if:
      type: tree-sitter
      kind: call
      # Building an import statement for a dynamically selected module is normal
      # runtime loading, not obfuscation. Exclude the canonical
      # exec("from module import ...") construction pattern directly from the
      # call matcher so other concatenated source execution remains visible.
      regex: '(^|[^.\w])(exec|eval|compile)\s*\(\s*[''"][^''"]{0,80}[''"]\s*\+\s*[''"]'
    not:
      - regex: '\bexec\s*\(\s*[''"]from\s+[\w.]+\s+import\b'
    unless:
      # Build DSLs construct a lambda from declared argument names and a
      # readable expression body. That is dynamic evaluation, but the explicit
      # lambda prefix is not concealed code. Use an AST exclusion because the
      # trait itself is matched against an AST call node.
      - type: tree-sitter
        kind: call
        regex: '\beval\s*\(\s*[''"]lambda\s+[''"]\s*\+'
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
      - id: well-known/lib/stdlib/python-stdlib::python-stdlib-test-file
      - id: "metadata/file/naming::test-directory-component"
  - id: concatenated-execution--g2
    desc: String-concat arg to b64decode
    crit: suspicious
    conf: 0.85
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\bb64decode\s*\(\s*[''"][^''"]{0,80}[''"]\s*\+\s*[''"]'
    unless:
      - id: well-known/lib/stdlib/python-stdlib::python-stdlib-test-file
  # A chain means four or more chr() calls joined by `+` in one run: that is
  # how concealed strings are built. File-wide sums of isolated pairs (e.g.
  # chr(34) + chr(39) quote literals in codegen templates) are not chains,
  # so the matcher counts runs, not calls, and the density floor goes with it.
  - id: python-dense-chr-calls
    desc: Numeric chr() chain beyond quote escaping
    crit: suspicious
    conf: 0.9
    count_min: 1
    if:
      type: raw
      regex: \bchr\s*\(\s*\d{1,3}\s*\)(\s*\+\s*\bchr\s*\(\s*\d{1,3}\s*\)){3,}
    # Apostrophe/backslash/apostrophe/apostrophe is standard single-quote
    # escaping (e.g. FFmpeg concat manifests), not hidden text. Filter only
    # this entire match; other chains in the same file must still fire.
    not:
      - regex: '^chr\s*\(\s*39\s*\)\s*\+\s*chr\s*\(\s*92\s*\)(\s*\+\s*chr\s*\(\s*39\s*\)){2}$'
    unless:
    - type: basename
      regex: (?i)^(test_.*|.*_test(?:_.*)?)\.(py|go)$
    - id: metadata/file/naming::test-directory-component
    - id: well-known/tool/sysadmin/mercurial::mercurial-package-path
    - id: well-known/tool/offensive/xalgorix::repository-member-path
    - id: well-known/tool/offensive/exploitdb::published-script-wrapper
  - id: dense-octal-escapes
    desc: Dense octal escape sequences
    crit: suspicious
    conf: 0.88
    for:
      - pyc
    per_kb_min: 2.0
    if:
      type: text
      regex: (\\[0-7]{3}){4,}
    unless:
      - type: basename
        regex: (?i)^(test_.*|.*_test)\.py$
  - id: dense-ord-calls
    desc: Dense ord() decode arithmetic
    crit: suspicious
    conf: 0.85
    for:
      - python
    size_min: 5000
    per_kb_min: 1.0
    if:
      type: text
      # Shifts are ordinary byte-order parsing (struct/sound/protocol readers),
      # not string concealment. Keep transformations used to decode characters.
      regex: '\bord\s*\([^\)\n]{0,120}\)\s*(\^|[+\-*/%])'
    unless:
      - type: basename
        regex: (?i)^(test_.*|.*_test)\.py$
      - id: well-known/lib/development/python-tooling::cpython-marshal-reader-source
      - id: metadata/lang/generated::codegen-source-path
      - id: well-known/tool/development/testing/seleniumbase::seleniumbase-browser-automation-framework
      # ASCII85 codec implementations (RFC 1924, PDF ASCII85Decode) do all
      # their byte arithmetic through ord() recentred on the '!' digit;
      # standard-codec arithmetic, not string concealment.
      - id: micro-behaviors/data/decode/base85::ascii85-codec-implementation
  - id: reverse-bytes
    desc: Reverses byte order of encoded data
    crit: suspicious
    conf: 0.9
    for:
      - python
    if:
      type: text
      regex: (fromhex|b64decode|unhexlify)\s*\(\s*['\"][A-Za-z0-9+/=\\x]{32,}['\"]\s*\).{0,60}\[::-1\]
    unless:
      - type: basename
        regex: (?i)^(test_.*|.*_test(?:_.*)?)\.py$
      - id: "metadata/file/naming::test-directory-component"
      - type: text
        substr: audio_url = compat_b64decode(data_fd[::-1]).decode('utf-8')
  # Char codes held in an integer list and mapped through chr() keep module
  # names, URLs and commands out of the string table; loaders use it to hide
  # `import_module('sys')` or a download host from grep.
  - id: numeric-chr-array
    desc: Integer list decoded to text via chr()
    crit: suspicious
    conf: 0.8
    for: [python]
    # The gap after the list stops at `;`: the list must flow into chr() in
    # the same statement, not be the tail of a neighbouring one-liner.
    if:
      type: text
      regex: \[\s*\d{2,4}\s*,\s*\d{2,4}\s*,\s*\d{2,4}[^\]]{0,50}\][^c;]{0,50}\bchr\s*\(
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/offensive/pwntools::pwntools-distribution
      # TheAlgorithms/Python teaches chr() codecs pedagogically (doctests
      # included); the classroom integer list is not string concealment.
      # Doctest-driven tutorials keep illustrative integer lists in their
      # docstrings; the classroom example is prose, not string concealment.
      - id: metadata/package/documentation/docstring::python-doctest-prompt
  # Python needs no space in `chr(x)for x in[...]`; minifiers drop it.
  # When the rebuilt text is only a module name, the conceal atom
  # chr-coded-module-import states that more precisely.
      - id: "metadata/file/naming::test-directory-component"
  - id: join-chr-comprehension
    desc: join(chr() for x in [...]) string rebuild
    crit: suspicious
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: join\(.{0,40}chr\(.{0,20}\)\s*for\s+\w+\s+in\s*\[\s*(\d+\s*,\s*){5,}\d+
    downgrade:
      any:
        - id: objectives/anti-static/obfuscation/string/conceal::chr-coded-module-import
composite_rules:
  - id: execute-decoded-content
    for: [python]
    desc: Direct execution of decoded content
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::python-dynamic-code-evaluation
      - id: python-chr
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decode/hex::python-base16-decode
      - id: micro-behaviors/data/decode/base32::python-base32-decode
      - id: micro-behaviors/data/decode/base85::python-ascii85-decode
      - id: micro-behaviors/data/decode/base64::python-urlsafe-base64-decode
      - id: micro-behaviors/data/decode/base64::python-standard-base64-decode
      - id: micro-behaviors/data/string/assembly::python-join-with-decoder-call
      - id: micro-behaviors/data/decode/base58
      - id: micro-behaviors/data/decode/uu
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/decompress/bzip2::bz2-decompress-call
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
      - id: micro-behaviors/data/serialize/unsafe::marshal-loads-symbol
  - id: python-encoded-pattern
    desc: Detects encoded string patterns (hex
    crit: component
    any:
      - id: micro-behaviors/data/encode/hex::js-dense-hex-escapes
      - id: python-octal
  - id: obfuscated-execution
    for: [python]
    desc: Direct execution of encoded string
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::python-dynamic-code-evaluation
      - id: python-encoded-pattern
      - id: python-chr
