# File writing and process launch give dense emoji strings obfuscation intent.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]

composite_rules:
  - id: emoji-saturated-staged-execution
    desc: Emoji strings accompany file writing and process launch
    crit: hostile
    conf: 0.97
    attack: T1027,T1059
    near_lines: 80
    all:
      - id: micro-behaviors/data/source/string::emoji-saturated-string-literals
      - id: micro-behaviors/fs/write/
      - id: micro-behaviors/process/create/shell/
