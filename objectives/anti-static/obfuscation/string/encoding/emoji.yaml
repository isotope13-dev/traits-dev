# File writing and process launch give dense emoji strings obfuscation intent.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]

composite_rules:
  - id: emoji-saturated-staged-execution
    desc: Emoji strings accompany file writing and process launch
    crit: hostile
    conf: 0.97
    attack: T1027,T1059
    near_lines: 80
    # 80 lines is the whole file for minified output: Bruno 3.5.1 ships
    # dist/chunk-*.cjs at 165 KB across 12 lines, so the emoji in its UI
    # strings, an unrelated fs write and an unrelated shell spawn all counted
    # as one staged execution. Staging means the three sit together.
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/source/string::emoji-saturated-string-literals
      - id: micro-behaviors/fs/write/
      - id: micro-behaviors/process/create/shell/
