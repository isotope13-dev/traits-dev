defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027

traits:
  - id: shell-dense-short-string-assignments
    desc: Shell stores many short string fragments
    crit: notable
    conf: 0.96
    count_min: 20
    if:
      type: text
      regex: "\\b[A-Za-z_]\\w{0,31}=['\"][^'\"\\r\\n]{0,12}['\"][ \\t]*[;\\r\\n]"
  - id: shell-eval-assembled-variable-string
    desc: Shell eval concatenates many variable values
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^[ \t]*eval[ \t]+"(\$\{?[A-Za-z_][[:word:]]*\}?){20,}"'

composite_rules:
  - id: shell-concealed-command-fragment-eval
    desc: Shell executes a command rebuilt from many concealed fragments
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.004
    all:
      - id: shell-dense-short-string-assignments
      - id: shell-eval-assembled-variable-string
