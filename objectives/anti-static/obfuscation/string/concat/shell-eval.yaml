defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027

traits:
  - id: shell-eval-assembled-variable-string
    desc: Shell eval concatenates many variable values
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^[ \t]*eval[ \t]+"(\$\{?[A-Za-z_][[:word:]]*\}?){20,}"'

composite_rules:
  - id: shell-concealed-command-fragment-eval
    desc: Shell executes a command rebuilt from many concealed fragments
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.004
    all:
      - id: metadata/lang/source/syntax/assignment/value::shell-dense-short-string-assignments
      - id: shell-eval-assembled-variable-string
