# Strings assembled out of the language's own printed forms.
#
# `(Object+'')` is the string `"function Object() { [native code] }"`, so
# `(Object+'').split(' ')[0]` is the word `function` — spelled without the
# letters ever appearing in the file. The sample that motivated this builds its
# C2 hostname that way: `(Object+'').split(' ')[0]+"."+(undefined)+21+".com"`
# resolves at runtime to a domain that no string extractor, no grep, and no
# indicator list can see in the bytes.
#
# There is no benign reason to stringify a builtin constructor. Minifiers do not
# emit it, bundlers do not, and code that wants the word "function" writes it.
# The technique generalises across the family — `Function`, `Array`, `Boolean`
# and the `undefined`/`NaN` literals all have stable printed forms an obfuscator
# harvests characters from — so this keys on the construction rather than on the
# particular builtin or the particular string being spelled.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  - id: js-string-from-stringified-builtin
    desc: Builds strings from a stringified builtin
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\((Object|Function|Array|Boolean)\s*\+\s*[''"]{2}\s*\)'

  - id: js-string-from-undefined-literal
    desc: Concatenates the undefined literal into text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\+\s*\(\s*(undefined|NaN)\s*\)\s*\+'
