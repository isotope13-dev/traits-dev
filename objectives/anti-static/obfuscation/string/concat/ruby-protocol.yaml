defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [ruby]
traits:
  - id: ruby-ast-string-tps
    desc: "Detects 'tps:/' protocol fragment in Ruby code"
    crit: notable
    conf: 1.0
    # A `tps:/` literal can be a URL fragment; its use requires more context.
    if:
      type: literal
      regex: '^tps:/'
  # A single-slash scheme can also be used in ordinary URL construction.
  - id: ruby-ast-suspicious-url-scheme
    desc: Truncated HTTP URL scheme literal
    crit: notable
    conf: 0.8
    if:
      type: literal
      regex: '^https?:/$'
