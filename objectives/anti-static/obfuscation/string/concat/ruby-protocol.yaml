defaults:
  platforms: [windows, unix]
  for: [ruby]
traits:
  - id: ruby-ast-string-tps
    desc: "Detects 'tps:/' protocol fragment in Ruby code"
    crit: suspicious
    conf: 1.0
    # A string literal beginning `tps:/` (obfuscated `https`→`tps` fragment).
    # Matches the parser-extracted literal directly — no live query.
    if:
      type: literal
      regex: '^tps:/'
  # Canonical home for the truncated `https:/` scheme literal (single slash — a
  # fragment to be reassembled), a string-obfuscation technique. Consolidated
  # here next to `ruby-ast-string-tps` from duplicate definitions that lived in
  # `dropper/execution/script/` and `script-ast/` (the matcher detects string
  # obfuscation, not dropper execution).
  - id: ruby-ast-suspicious-url-scheme
    desc: 'Truncated HTTP URL outside test/spec code'
    crit: suspicious
    conf: 0.8
    if:
      type: literal
      regex: '^https?:/$'
    unless:
      # `gsub("https:/", "https://")` repairs the scheme after a path join has
      # collapsed repeated slashes -- the replacement spells the full URL out,
      # which is reassembly in plain sight, the opposite of concealment. This
      # is the standard idiom in Ruby HTTP client wrappers that concatenate a
      # base URL with a resource path.
      - type: text
        regex: 'g?sub\(\s*["'']https?:/["''],\s*["'']https?://'
      - type: text
        regex: "url_prefix\\s*=\\s*url\\s*\\|\\|\\s*['\"]https?:/['\"]"
      - type: text
        regex: '\\.start_with\\?\\([''"]https?:/'
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: metadata/package/testing/presence/harness::test-spec-path-benign-context
