defaults:
  for: [asp, vbs]
  platforms: [windows]
  crit: suspicious
  attack: T1027
  mbc: B0032

traits:
  - id: vbs-createobject-chr-progid
    desc: CreateObject builds ProgID with character codes
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*set \w+\s*=\s*(server\.)?createobject\("[^"\r\n]{1,32}"\s*&\s*chr\s*\('
