defaults:
  crit: suspicious
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - html
  - vbs
  attack: T1027
  mbc: B0032
traits:
- id: js-eval-name-split-concat
  desc: eval identifier split across concatenation
  conf: 0.93
  if:
    type: text
    exclude_comments: true
    regex: '["''](e["'']\s*\+\s*["'']val|ev["'']\s*\+\s*["'']al|eva["'']\s*\+\s*["'']l)["'']'
  unless:
  - id: metadata/file/format/security-corpus::inline-detection-rule-corpus
  - id: metadata/path/directory::test-directory-component
- id: js-eval-letter-split-concat
  desc: eval name split into letter fragments
  conf: 0.9
  if:
    type: text
    regex: '["'']e["''](/\*[^*]{0,24}\*/|\s)*\+(/\*[^*]{0,24}\*/|\s)*["'']v["'']'
  unless:
  - id: metadata/path/directory::test-directory-component
- id: js-unicode-escape-fragment-seam
  desc: ASCII Unicode escapes split across concatenation
  conf: 0.9
  count_min: 4
  if:
    type: text
    regex: \\u00[4567][0-9a-fA-F]["']\s*\+\s*["']\\u00[4567]
  unless:
  - id: metadata/path/directory::test-directory-component
- id: js-child-process-split-call
  desc: Require call splits child process name
  crit: notable
  conf: 0.93
  for: [javascript, typescript]
  if:
    type: tree-sitter
    kind: call
    regex: '^require\(\s*["'']child_?["'']\s*\+\s*["'']_?process["'']\s*\)$'
  # A markdown lesson's fenced example is sniffed as JavaScript; it is text a
  # reader sees, not code a runtime loads.
  unless:
  - id: metadata/lang/source/syntax/markup/markdown::fires-quiet-lesson-table
- id: embedded-child-process-split-text
  desc: Embedded child process name split
  crit: notable
  for: [html, vbs]
  if:
    type: text
    regex: 'require\(\s*["'']child_?["'']\s*\+\s*["'']_?process["'']\s*\)'
composite_rules:
- id: js-child-process-name-split-concat
  desc: child_process name split by concatenation
  conf: 0.93
  attack: T1027,T1059.007
  any:
  - id: js-child-process-split-call
  - id: embedded-child-process-split-text
  unless:
  - id: metadata/path/directory::test-directory-component
- id: indexed-token-table-near-eval
  desc: Indexed short-token table appears near dynamic eval
  conf: 0.92
  for:
  - html
  - javascript
  near_bytes: 2048
  all:
  - id: micro-behaviors/process/interpreter/eval/javascript::eval-call-text
  - id: micro-behaviors/data/string/concat/expression::js-indexed-token-table
