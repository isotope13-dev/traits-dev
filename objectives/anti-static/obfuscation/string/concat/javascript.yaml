# JavaScript identifier splitting: the name of a dangerous global is assembled
# at runtime out of concatenated fragments, so no `eval` / `Function` /
# `require` token survives in the source for a scanner or reviewer to find.
# Two spellings dominate — plain fragments ("ev" + "al") and per-character
# unicode escapes ("\u0065\u0076" + "\u0061\u006c") — and droppers stack the
# two, escaping the fragments of an already-split name.
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript, html, vbs]
  attack: T1027
  mbc: B0032

traits:
  # "e"+"val", "ev"+"al", "eva"+"l" — every split point of the four-letter
  # name. Splitting a language keyword across a `+` has no purpose other than
  # keeping the assembled name out of the source text.
  - id: js-eval-name-split-concat
    desc: eval identifier split across concatenation
    conf: 0.93
    if:
      type: text
      regex: '["''](e["'']\s*\+\s*["'']val|ev["'']\s*\+\s*["'']al|eva["'']\s*\+\s*["'']l)["'']'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/
  # "e" + "v" with a block comment between the letters. The four-letter
  # split above stops at the first quote, so a comment-stuffed packer
  # that builds eval one letter at a time never meets it.
  - id: js-eval-letter-split-concat
    desc: eval name split into letter fragments
    conf: 0.9
    if:
      type: text
      regex: '["'']e["''](/\*[^*]{0,24}\*/|\s)*\+(/\*[^*]{0,24}\*/|\s)*["'']v["'']'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/

  # Fragment boundaries that fall between unicode escapes: `\u00XX" + "\u00XX`.
  # Typography commonly concatenates non-ASCII escapes, so require ASCII-range
  # escapes on both sides before treating repeated seams as obfuscation.
  - id: js-unicode-escape-fragment-seam
    desc: ASCII Unicode escapes split across concatenation
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '\\u00[4567][0-9a-fA-F]["'']\s*\+\s*["'']\\u00[4567]'

composite_rules:
  # A short-fragment table must flow into eval as concatenated dictionary
  # reads. This identifies an obfuscated dynamic-code attempt, not whether the
  # assembled source parses or what it would do if it did.
  - id: token-table-fed-eval-obfuscation
    desc: Short-token table feeds concatenated eval dictionary reads
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.007
    for: [html, javascript]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/string/concat::js-eval-dictionary-concat
    any:
      - id: micro-behaviors/data/string/concat::js-indexed-token-table
      - id: micro-behaviors/data/string/concat::js-eval-dictionary-concat

  - id: indexed-token-table-near-eval
    desc: Indexed short-token table appears near dynamic eval
    crit: suspicious
    conf: 0.92
    for: [html, javascript]
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
      - id: micro-behaviors/data/string/concat::js-indexed-token-table
