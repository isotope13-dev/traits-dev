defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: many-short-string-assignments
    desc: Many short string assignments
    crit: notable
    conf: 0.94
    count_min: 80
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z_0-9]*\s*=\s*''[^''\r\n]{1,15}'''
  - id: variable-call-with-variable-argument
    desc: Variable function takes variable argument
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z_0-9]*\s*\(\s*\$[A-Za-z_][A-Za-z_0-9]*\s*,'

composite_rules:
  - id: php-dense-indexed-computed-dispatch
    desc: Dense indexed fragments build computed PHP dispatch
    crit: hostile
    conf: 0.95
    attack: T1027,T1059.004
    all:
      - id: metadata/lang/source/syntax/array::php-repeated-numeric-subscript-syntax
      - id: many-short-string-assignments
      - id: variable-call-with-variable-argument
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
