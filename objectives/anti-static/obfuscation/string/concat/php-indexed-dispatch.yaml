defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: many-short-string-assignments
    desc: Many short string assignments
    crit: notable
    conf: 0.94
    count_min: 80
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z_0-9]*\s*=\s*''[^''\r\n]{1,15}'''
  - id: variable-call-with-variable-argument
    desc: Variable function takes variable argument
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z_0-9]*\s*\(\s*\$[A-Za-z_][A-Za-z_0-9]*\s*,'
  - id: indexed-fragments-assigned-to-callee
    desc: Concatenated PHP subscripts flow into a callable
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        ((
          (expression_statement
            (assignment_expression
              left: (variable_name) @assigned
              right: (binary_expression
                left: [(subscript_expression) (binary_expression operator: "." right: (subscript_expression))]
                operator: "."
                right: (subscript_expression))))
          (expression_statement
            [(function_call_expression function: (variable_name) @used)
             (assignment_expression right: (function_call_expression function: (variable_name) @used))]))
          (#eq? @assigned @used))
  - id: indexed-fragments-called-directly
    desc: PHP directly calls concatenated subscripts
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        (function_call_expression
          function: (parenthesized_expression
            (binary_expression
              left: [(subscript_expression) (binary_expression operator: "." right: (subscript_expression))]
              operator: "."
              right: (subscript_expression)))) @call

composite_rules:
  - id: php-dense-indexed-syntax-with-dispatch
    desc: Dense PHP subscripting and variable dispatch
    crit: notable
    conf: 0.92
    all:
      - id: metadata/lang/source/syntax/array::php-repeated-numeric-subscript-syntax
      - id: many-short-string-assignments
      - id: variable-call-with-variable-argument
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
  - id: php-dense-indexed-fragment-setup
    desc: Dense PHP subscript or short-string syntax
    crit: notable
    conf: 0.9
    any:
      - id: metadata/lang/source/syntax/array::php-repeated-numeric-subscript-syntax
      - id: many-short-string-assignments
  - id: php-dense-indexed-computed-dispatch
    desc: Dense indexed fragments build computed PHP dispatch
    crit: hostile
    conf: 0.95
    attack: T1027
    all:
      - id: php-dense-indexed-fragment-setup
    any:
      - id: indexed-fragments-assigned-to-callee
      - id: indexed-fragments-called-directly
