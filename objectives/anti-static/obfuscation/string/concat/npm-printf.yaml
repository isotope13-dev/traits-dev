defaults:
  platforms: [unix]
  for: [package.json]
traits:
  - id: postinstall-printf-command-word
    desc: Install hook executes printf-assembled command
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;|&])\s*\$\(\s*printf\s+["'']%s(%s){1,}'
