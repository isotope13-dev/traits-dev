# Co-occurrence supports concealment, not a bound PowerShell execution chain.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: vbs-fragmented-powershell-evaluation
    desc: Fragmented PowerShell text with VBScript eval
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
      - id: metadata/lang/source/literal/array::vbs-embedded-powershell-numeric-array
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
    any:
      - id: metadata/file/profile/com-progid::wscript-shell-literal
      - id: micro-behaviors/data/decode/xor::vbs-xor-character-code
