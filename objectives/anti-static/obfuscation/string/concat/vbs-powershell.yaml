# Co-occurrence supports concealment, not a bound PowerShell execution chain.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: vbs-fragmented-powershell-evaluation
    desc: Fragmented PowerShell text with VBScript eval
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: micro-behaviors/data/string/concat/expression::vbs-many-long-literal-concatenations
      - id: metadata/lang/source/literal/array::vbs-embedded-powershell-numeric-array
      - id: metadata/lang/source/syntax/statement::execute-token-line
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::vbs-xor-character-code
