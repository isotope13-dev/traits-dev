defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: B0032
  attack: T1027

traits:
  - id: php-split-eval-base64-fragment
    desc: PHP rebuilds eval from Base64 fragment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '[''"]e[''"]\s*\.\s*[\s\S]{1,180}\([''"]dmE=[''"]\)\s*\.\s*[''"]l[''"]'
  - id: fragmented-eval-token
    desc: Fragmented eval token assembly
    mbc: E1059
    attack: T1059.006
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "'e'\\s*\\.\\s*'va'\\s*\\.\\s*'l'"
  - id: fragmented-gzinflate-token
    desc: Fragmented gzinflate assembly
    mbc: E1059
    attack: T1059.006
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "'g'\\s*\\.\\s*'zi'\\s*\\.\\s*'nf'\\s*\\.\\s*'l'\\s*\\.\\s*'at'\\s*\\.\\s*'e'"
  - id: fragmented-create-function-token
    desc: Fragmented create_function assembly
    mbc: E1059
    attack: T1059.006
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "'create_fun'\\s*\\.\\s*'ct'\\s*\\.\\s*'io'\\s*\\.\\s*'n'"
