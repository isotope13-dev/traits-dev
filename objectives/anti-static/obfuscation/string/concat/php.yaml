    desc: PHP rebuilds eval from Base64 fragment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '[''"]e[''"]\s*\.\s*[\s\S]{1,180}\([''"]dmE=[''"]\)\s*\.\s*[''"]l[''"]'
  - id: fragmented-eval-token
    desc: Fragmented eval token assembly
    mbc: E1059
    attack: T1059.006
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '["''](e\s*["'']\s*\.\s*["'']va|ev)\s*["'']\s*\.\s*["'']a?l["'']'
  - id: fragmented-gzinflate-token
    desc: Fragmented gzinflate assembly
    mbc: E1059
    attack: T1059.006
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'gz["'']\s*\.\s*["'']inf|["'']g["'']\s*\.\s*["'']zi["'']\s*\.\s*["'']nf'
  - id: fragmented-create-function-token
    desc: Fragmented create_function assembly
    mbc: E1059
    attack: T1059.006
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '["''](create_fun["'']\s*\.\s*["'']ct|cr["'']\s*\.\s*["'']eat["'']\s*\.\s*["'']e_fun)'
