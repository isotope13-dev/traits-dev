defaults:
  platforms: [windows]
  for: [text, data, vbs]
traits:
  - id: autoit-process-memory-api-character-array
    desc: WriteProcessMemory character-array name
    crit: suspicious
    conf: 0.98
    attack: T1027
    if:
      type: yara
      source: |
        rule autoit_process_memory_api_character_array {
          strings:
            $array = /\[[ \t]*"W"[ 	]*,[ 	]*"r"[ 	]*,[ 	]*"i"[ 	]*,[ 	]*"t"[ 	]*,[ 	]*"e"[ 	]*,[ 	]*"P"[ 	]*,[ 	]*"r"[ 	]*,[ 	]*"o"[ 	]*,[ 	]*"c"[ 	]*,[ 	]*"e"[ 	]*,[ 	]*"s"[ 	]*,[ 	]*"s"[ 	]*,[ 	]*"M"[ 	]*,[ 	]*"e"[ 	]*,[ 	]*"m"[ 	]*,[ 	]*"o"[ 	]*,[ 	]*"r"[ 	]*,[ 	]*"y"[ 	]*]/ nocase
          condition:
            $array
        }
