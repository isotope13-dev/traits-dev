defaults:
  platforms: [windows]
  for: [batch, powershell]
composite_rules:
  - id: powershell-offset-integer-array-obfuscation
    desc: Negative array with offset character decoding
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    near_bytes: 32768
    all:
      - id: micro-behaviors/data/embedded/payload/array::powershell-negative-integer-array
      - id: micro-behaviors/data/decode/custom::powershell-offset-char-cast
