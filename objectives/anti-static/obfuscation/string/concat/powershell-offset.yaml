defaults:
  platforms: [windows]
  for: [batch, powershell]
composite_rules:
  - id: powershell-offset-integer-array-obfuscation
    desc: Offset-decoded negative array with script evaluation
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    near_bytes: 32768
    all:
      - id: micro-behaviors/data/embedded/payload/array::powershell-negative-integer-array
      - id: micro-behaviors/data/decode/custom::powershell-offset-array-character-decode
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-eval
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text

  - id: powershell-offset-integer-array-script-eval
    desc: Decodes negative integer offset array and evaluates scriptblock
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.001
    near_bytes: 32768
    all:
      - id: powershell-offset-integer-array-obfuscation
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-created-scriptblock-call

