# Per-character literal concatenation: an identifier or command is split into
# one-character string literals and glued back together with `+`, so a
# substring scan for the assembled word ("eval", "child_process", a domain)
# finds nothing. The same source shape appears in Python and JavaScript, so
# one trait covers both.
#
# A single `'a' + 'b'` pair is ordinary code and shows up in test vectors,
# doc examples and generated bundles, so the matcher requires a chain of at
# least three adjacent one-character literals — the shortest form that is
# already deliberate — and the count/density floors keep one stray chain in a
# large file from firing.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript]
  attack: T1027
  mbc: B0032
  crit: suspicious
  conf: 0.9

traits:
  - id: dense-single-char-concat
    desc: Dense single-character concatenation
    count_min: 2
    per_kb_min: 0.5
    if:
      type: text
      # Path construction such as '/' + '/'.join(...) is ordinary URL logic;
      # do not treat slash separators as encoded character fragments.
      regex: '["''][\w\\.-]["'']\s*\+\s*["''][\w\\.-]["'']\s*\+\s*["''][\w\\.-]["'']'
    unless:
      - type: path
        regex: '(^|[\\/])tests?[\\/]data[\\/]'
      # Linter test corpora ship single-char-concat edge cases under tests/specs
      # and .snap snapshots (biome useStringStartsEndsWith fixtures).
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/fixture::python-test-data-directory-path
      - id: metadata/package/testing/presence/fixture::snapshot-file
      # Secret-scanning libraries intentionally concatenate synthetic token-shaped
      # fixtures; those examples are test data, not string obfuscation.
      - id: metadata/package/testing/presence/fixture::secret-detector-fixture-context
      - id: metadata/package/testing/harness/benchmark::synthetic-secret-benchmark-generator
      # ESLint plugin rule sources document literal-concat edge cases inline.
      - id: metadata/package/quality/benign-context::eslint-rule-source-context
      - id: metadata/package/quality/benign-context::eslint-package-context
