# Fragments of the English phrase "Please try again", split across string
# literals and concatenated at runtime as an anti-static technique. Generic
# phrase fragments; family composites reference them cross-dir.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  size_min: 512
  size_max: 500000000
traits:
  - id: frag-plea
    desc: Fragment of a Please try phrase
    crit: component
    if:
      type: text
      regex: '(?i)\bplea\b.{0,80}\bse,\s*tr\b'
    not:
      - substr: Please contact
      - substr: Please submit
  - id: frag-se
    # "se, tr" is a shard of a split "Please try again" literal. It carries no
    # standalone meaning and lands in ordinary prose, so it is evidence only
    # beside its sibling shards (see the nemucod composite).
    desc: Shard "se, tr" of split Please-try-again
    crit: notable
    if:
      type: text
      substr: se, tr
    unless:
      - id: well-known/app/system/drivers/
  - id: frag-try
    desc: Shard "try ag" of split Please-try-again
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: try ag
  - id: frag-again-excl
    desc: again exclamation fragment
    crit: component
    if:
      type: text
      substr: ain!
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
