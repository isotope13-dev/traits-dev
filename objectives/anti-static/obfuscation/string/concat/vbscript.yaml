defaults:
  crit: suspicious
  platforms:
  - windows
  for:
  - vbs
  mbc: B0032
  attack: T1027
traits:
- id: vbs-createobject-concat
  desc: VBScript CreateObject with concatenated ProgID
  conf: 0.9
  if:
    type: text
    regex: CreateObject\s*\([^)]{1,60}["']\s*&\s*["'][^)]{1,60}\)
- id: vbs-dense-string-concat
  desc: Dense VBScript string concatenation
  conf: 0.82
  count_min: 8
  per_kb_min: 2.0
  if:
    type: text
    regex: '"[^"]{1,20}"\s*&\s*"[^"]{1,20}"'
  not:
  - regex: (?i)^"\s*"\s*&\s*"[^"]{0,20}"$
  - regex: (?i)^"[^"]{0,20}"\s*&\s*"\s*"$
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: vbs-dense-plus-concat
  desc: Dense VBScript concatenation using plus
  conf: 0.82
  count_min: 8
  per_kb_min: 2.0
  if:
    type: text
    regex: '"[^"]{0,20}"\s*\+\s*"[^"]{0,20}"'
- id: vbs-single-char-plus-concat
  desc: VBScript word split into single characters
  conf: 0.9
  count_min: 2
  if:
    type: text
    regex: ('[A-Za-z0-9]'\s*\+\s*){3,}
- id: vbs-amp-fragment-concat
  desc: VBScript joins short string fragments
  conf: 0.9
  for:
  - vbs
  - html
  - ruby
  count_min: 6
  if:
    type: text
    regex: (?i)["'][A-Za-z0-9.]{1,4}["']\s*&\s*["'][A-Za-z0-9.]{1,4}["']
composite_rules:
- id: vbs-progid-concat-obfuscation
  desc: VBScript COM ProgID split via string concatenation
  conf: 0.92
  any:
  - id: vbs-createobject-concat
  - id: vbs-dense-string-concat
  - id: vbs-dense-plus-concat
  - id: vbs-single-char-plus-concat
