# Split script tags: the `script` tag name assembled out of concatenated
# fragments (`"<sc"+"ript"`) so no literal tag survives in the source for
# a naive scanner to find. Analytics snippets use the same idiom, so the
# atom alone is only notable; conviction requires the split tag on a
# popunder-delivery page. The `makefile`/`text` scopes are deliberate:
# extensionless landings mistype as makefile in the file sniffer.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1027
  mbc: B0032

traits:
  - id: split-script-tag
    desc: Concatenated fragments spelling script tag
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '["'']<sc["'']\s*\+\s*["'']ript'

composite_rules:
  - id: evasive-script-popunder-page
    desc: Scanner-split script tag in popunder page
    crit: suspicious
    conf: 0.88
    all:
      - id: split-script-tag
      - id: objectives/impact/ui/manipulation/traffic::popunder-kit-loader
