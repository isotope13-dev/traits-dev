# A URL or moniker scheme cut in half so neither piece is searchable. The
# assembled string is ordinary -- `script:https://host/path` -- but it is
# never written down: the author breaks it at points chosen so that no
# fragment contains a recognizable token, then joins the pieces at runtime.
#
# The seams are what remain, and they are unmistakable. `"s://"` is the tail
# of a scheme separator with its scheme removed; `"pt:ht"` spans the end of
# one scheme and the start of the next. Neither fragment has any use in code
# that is not reassembling a URL it would rather not spell out.
#
# Executable file types only (plus HTML, which executes the JS it embeds).
# A quoted fragment inside a prose document is inert: security skill docs,
# deobfuscator writeups, and malware reports all *illustrate* this exact
# technique without performing it. Bundled security-skills corpora (Anthropic
# skills, Yorn, xalgorix agents) each tripped the prose form.
defaults:
  platforms: [windows, unix]
  for: [scripts, html]
  attack: T1027
  mbc: B0032
  crit: suspicious
  conf: 0.93

traits:
  - id: split-scheme-separator-fragment
    desc: URL scheme separator split mid-token
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      # `& "s://"` -- one or two letters of the scheme left attached to the
      # separator and glued on with a concatenation operator. A whole
      # `"http://"` has four letters and does not match; a one- or two-letter
      # stub only exists because the scheme was cut in the middle.
      type: text
      regex: '[&+]\s*"[a-z]{1,2}://"'

  - id: split-moniker-scheme-seam
    desc: URL scheme joined to a moniker
    if:
      # `"pt:ht"` -- the tail of `script:` plus the head of `http`. Bounded on
      # both sides so a full `"script:https://..."` literal, which is already
      # covered as a plain moniker, is not what matches here.
      type: text
      regex: '"[A-Za-z]{0,6}pt:ht[a-z]{0,3}"'
