defaults:
  platforms: [windows]
  for: [pe]
  crit: suspicious
  attack: T1027,T1059.003
traits:
  - id: encoded-batch-caret-env-command-fragments
    desc: Encoded batch hides commands in variable noise
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(%\^%[a-z]%[A-Za-z]{64,}%){3}'
