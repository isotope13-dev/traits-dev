# Payload bytes hidden as a reversed base64 string salted with filler glyphs
# that are removed by a chain of split/join calls, then decoded by MSXML and
# written to disk by ADODB.Stream. Static co-occurrence; flow is not bound.
defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: wsh-reversed-junk-base64-stream-writer
    desc: WSH reverses, de-junks, decodes base64 to disk
    crit: hostile
    conf: 0.93
    attack: T1027,T1140
    mbc: B0032,B0023
    all:
      - id: micro-behaviors/data/string/replace::repeated-split-join-removal
      - id: micro-behaviors/data/collection/array::js-assign-reversed-array
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: micro-behaviors/data/control-flow/dispatch/run::script-run-method-call
