# Restoring a deliberately reversed decoder name is concealment, not proof
# that the decoder is invoked or that its result is executable. In particular,
# eval(strrev("edoced_46esab")) evaluates only the bare name, which is invalid
# PHP source. Require an actual reversal call rather than a quoted signature.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: suspicious
  conf: 0.95
  attack: T1027
  mbc: B0032

traits:
  - id: php-reconstructs-reversed-decoder-name
    desc: Reconstructs a reversed PHP decoder name
    if:
      type: symbol
      kind: call
      regex: '(?i)^\\?strrev$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^(edoced_46esab|etalfnizg)$'
    unless:
      - id: metadata/package/testing/presence/fixture::php-security-test-context
      - id: metadata/package/testing/presence/fixture::php-security-regression-test-context
      - id: well-known/tool/detection/pattern-catalog::php-scanner-signature-rule-table
