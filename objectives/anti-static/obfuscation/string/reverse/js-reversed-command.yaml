# Node code runs shell commands whose text is produced by reversing a short
# literal through a split/reverse/join helper, hiding the command names.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: js-reversed-string-shell-command
    desc: Node runs shell commands hidden as reversed strings
    crit: hostile
    conf: 0.95
    attack: T1027,T1059
    near_bytes: 3000
    all:
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: micro-behaviors/process/create/variable::js-exec-helper-wrapped-literal
      - id: metadata/import/builtin::child-process-module-reference
