defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1027
  mbc: B0032
traits:
- id: reverse-slice-operator
  desc: Reverse-slice operator [::-1]
  crit: component
  conf: 0.6
  if:
    type: text
    regex: \[::\s*-\s*1\]
- id: ascii85-decode-ref
  desc: base64.a85decode reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: a85decode
- id: base85-decode-ref
  desc: base64.b85decode reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: b85decode
- id: reversed-builtin-then-decode
  desc: reversed string joined then decoded
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '["'']{2}\.join\s*\(\s*reversed\s*\([^)\n]{1,80}\)\s*\)\s*\.\s*decode\s*\('
  unless:
  - id: well-known/lib/crypto/pycryptodome::pycryptodome-selftest
  - type: text
    regex: b["']{2}\.join[\s\S]{0,100}\.decode\(["']utf-8
# The gap excludes `=`: an assignment between the reversal and the sink means
# the reversed value is not what gets executed (e.g. an unused `r=lambda x:x[::-1]`
# decoy in an AES-then-exec license loader), while `...(s[::-1]));exec((_)(b'..'))`
# still links the two.
- id: reverse-slice-then-exec
  desc: Reverse-slice feeding exec/eval
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: \[::\s*-\s*1\][^\n=]{0,80}(exec|eval)\s*\(
# `b85decode(s[::-1])` / `b64decode(s)[::-1]`: the reversal sits in the
# decoder's own argument or on its output, within one statement.
- id: decoder-adjacent-reverse-slice
  desc: Decoder reverses its argument or output
  crit: component
  conf: 0.9
  if:
    type: text
    regex: ((85|32|64)decode|unhexlify|fromhex)\s*\([^\n;)]{0,16}\[::\s*-\s*1\]
- id: reverse-slice-into-decoder
  desc: Reversed value passed straight to a decoder
  crit: component
  conf: 0.9
  if:
    type: text
    regex: \[::\s*-\s*1\][^\n;=]{0,16}((85|32|64)decode|unhexlify|fromhex)\s*\(
- id: python-b64decode-reversed-arg
  desc: Base64-decodes a reversed argument
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: b64decode\(\s*[^\n]{0,40}\[::-1\]
  unless:
  - id: well-known/lib/crypto/pycryptodome::pycryptodome-selftest
composite_rules:
- id: python-reverse-decode-aggregator
  desc: Python reverse-then-decode obfuscation (any form)
  crit: suspicious
  conf: 0.94
  any:
  - id: reverse-slice-then-decode
  - id: reversed-builtin-then-decode
  - id: reverse-slice-then-exec
# Adjacency lives in the two regexes, not in near_bytes: text evidence on one
# line does not carry distinct offsets, so a 16-byte window let an unused
# `r=lambda x:x[::-1]` and a `d=base64.b85decode` alias 357 bytes apart on a
# minified one-liner count as "immediately before".
- id: reverse-slice-then-decode
  desc: Reverse-slice immediately before encoded-data decode
  crit: suspicious
  conf: 0.92
  any:
  - id: decoder-adjacent-reverse-slice
  - id: reverse-slice-into-decoder
  unless:
  - id: well-known/lib/crypto/pycryptodome::pycryptodome-selftest
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
