defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1027
  mbc: B0032
traits:
- id: reverse-slice-operator
  desc: Reverse-slice operator [::-1]
  crit: component
  conf: 0.6
  if:
    type: text
    regex: \[::\s*-\s*1\]
- id: ascii85-decode-ref
  desc: base64.a85decode reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: a85decode
- id: base32-decode-ref
  desc: base64.b32decode reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: b32decode
- id: base85-decode-ref
  desc: base64.b85decode reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: b85decode
- id: reversed-builtin-then-decode
  desc: reversed string joined then decoded
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '["'']{2}\.join\s*\(\s*reversed\s*\([^)\n]{1,80}\)\s*\)\s*\.\s*decode\s*\('
  unless:
  - id: well-known/lib/crypto/pycryptodome::pycryptodome-selftest
  - type: text
    regex: b["']{2}\.join[\s\S]{0,100}\.decode\(["']utf-8
- id: reverse-slice-then-exec
  desc: Reverse-slice then exec/eval
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: \[::\s*-\s*1\][^\n]{0,80}(exec|eval)\s*\(
- id: python-b64decode-reversed-arg
  desc: Base64-decodes a reversed argument
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: b64decode\(\s*[^\n]{0,40}\[::-1\]
  unless:
  - id: well-known/lib/crypto/pycryptodome::pycryptodome-selftest
composite_rules:
- id: python-reverse-decode-aggregator
  desc: Python reverse-then-decode obfuscation (any form)
  crit: suspicious
  conf: 0.94
  any:
  - id: reverse-slice-then-decode
  - id: reversed-builtin-then-decode
  - id: reverse-slice-then-exec
- id: reverse-slice-then-decode
  desc: Reverse-slice immediately before encoded-data decode
  crit: suspicious
  conf: 0.92
  near_bytes: 16
  all:
  - id: reverse-slice-operator
  any:
  - id: ascii85-decode-ref
  - id: base32-decode-ref
  - id: base85-decode-ref
  - id: micro-behaviors/data/decode/base64::b64decode-string
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/decode/hex::python-unhexlify
  - id: micro-behaviors/data/decode/hex::python-fromhex
  unless:
  - id: well-known/lib/crypto/pycryptodome::pycryptodome-selftest
