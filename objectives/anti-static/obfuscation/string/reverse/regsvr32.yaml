defaults:
  platforms: [windows]
  for: [html, javascript, vbs, batch, powershell]
  crit: suspicious
  conf: 0.95

traits:
  # All three Base64 alignments for reversed "regsvr32 c:"; omit sextets
  # influenced by preceding/following bytes. This names the command prefix,
  # not proof of invocation or Squiblydoo (there is no /i: or scrobj here).
  - id: base64-reversed-regsvr32-drive-command
    desc: Base64 reversed regsvr32 drive command prefix
    if:
      type: text
      exclude_html_comments: true
      regex: 'OmMgMjNydnNnZX|pjIDIzcnZzZ2Vy|6YyAyM3J2c2dlc'
