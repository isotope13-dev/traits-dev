defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Reversal conceals the native API name from ordinary import analysis.
  # Service APIs and opaque data are context, not proof of a service being
  # installed, an injected payload, a particular family, or exfiltration.
  - id: reversed-native-api-service-profile
    desc: Reversed native API, service APIs, opaque data
    crit: suspicious
    conf: 0.97
    all:
      - id: reversed-zwqueryinformationprocess
      - id: micro-behaviors/os/service/create::create-service-w-import
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
      - id: metadata/binary/section/entropy::large-near-random-writable-data
