defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho, rust, go, c, cpp, python]
  attack: T1027,T1071.001

composite_rules:
  - id: reversed-rot3-url-indicator
    desc: Reversed ROT-3 shifted URL or domain constant
    crit: suspicious
    conf: 0.97
    any:
      - id: micro-behaviors/data/encode/caesar::reversed-rot3-http-scheme
      - id: micro-behaviors/data/encode/caesar::reversed-rot3-domain-path

  - id: reversed-rot3-c2-url-obfuscation
    desc: Reversed ROT-3 URL obfuscation paired with command, screen, or upload capability
    crit: hostile
    conf: 0.98
    all:
      - id: reversed-rot3-url-indicator
    any:
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/ui/graphics/draw::gdi-bitmap-transfer-primitives
      - id: micro-behaviors/process/argument/interpreter::shell-command-spawn-flag
