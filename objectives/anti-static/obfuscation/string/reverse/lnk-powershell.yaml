# A shortcut whose PowerShell argument is stored backwards and flipped at run
# time (`-join $s[-1..-$s.Length]`, or `$s[$s.Length..0]`), then handed to Invoke-Expression. The
# download URLs, paths and the program it launches only exist after the flip,
# so nothing readable is left in the .lnk for static review.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1027,T1059.001
  mbc: B0032

traits:
  - id: lnk-arg-reverse-index-join
    desc: LNK arg reverses string by index
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '-join\s+\$\w+\[(-1\.\.-\$\w+\.Length|\$\w+\.Length\.\.0)\]'
      case_insensitive: true

composite_rules:
  - id: lnk-reversed-powershell-invoke-expression
    desc: LNK PowerShell runs a reversed-string payload
    crit: hostile
    conf: 0.96
    all:
      - id: lnk-arg-reverse-index-join
      - id: metadata/lang/source/naming/action::lnk-invoke-expression-reference
  # The same flip applied to the download address: the URL is stored reversed,
  # restored by the join and passed straight to a WebClient download, so the
  # server never appears in readable form in the shortcut.
  - id: lnk-reversed-url-powershell-download
    desc: LNK PowerShell downloads from a reversed URL
    crit: hostile
    conf: 0.95
    all:
      - id: lnk-arg-reverse-index-join
      - id: micro-behaviors/communications/http/download/webclient::lnk-download-method
