# A shortcut whose PowerShell argument is stored backwards and flipped at run
# time (`-join $s[-1..-$s.Length]`, or `$s[$s.Length..0]`), then handed to Invoke-Expression. The
# download URLs, paths and the program it launches only exist after the flip,
# so nothing readable is left in the .lnk for static review.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1027,T1059.001
  mbc: B0032

composite_rules:
  - id: lnk-reversed-powershell-invoke-expression
    desc: LNK PowerShell runs a reversed-string payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/reverse::lnk-reverse-index-join
      - id: metadata/lang/source/naming/action::lnk-invoke-expression-reference
  # LNK facts do not bind arbitrary PowerShell variables. This conjunction
  # establishes reversal and downloading, not that the reversed value is the
  # URL or that the response executes. Retain concealment as suspicious;
  # stronger invocation/removal chains supply a separate hostile finding.
  - id: lnk-reversal-with-powershell-download
    desc: LNK reversal with PowerShell download
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/string/reverse::lnk-reverse-index-join
    any:
      - id: micro-behaviors/communications/http/download/webclient::lnk-download-method
      - id: micro-behaviors/communications/http/client/reference::lnk-wget-command-reference
