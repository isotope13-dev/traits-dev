defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027
  crit: suspicious
composite_rules:
  - id: string-reversal-with-eval-syntax
    desc: String reversal beside eval syntax
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
