defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027
  crit: suspicious
composite_rules:
  - id: descending-character-helper-eval
    desc: Descending character helper co-occurs with nested eval
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
  # Reversal plus eval may hide a license string, but rebuilding the payload
  # bit by bit with shifts and masks is decoder construction, not formatting:
  # the reversed text is an encoded executable, not a rearranged literal.
  - id: reversed-arithmetic-decoded-eval-payload
    desc: Reversed bit-rebuilt payload reaches eval
    crit: hostile
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/arithmetic::shift-mask-octet-unpack
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
