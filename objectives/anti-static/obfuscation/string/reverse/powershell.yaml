# PowerShell reconstructs identifiers by walking a byte array in reverse
# (index = Count - i - 1) and applying a fixed arithmetic shift — a Caesar-
# style decoder used to hide AMSI / .NET type names from static scanners.
defaults:
  platforms: [windows]
  for: [powershell, batch, html, vbs]
  attack: T1027
  mbc: E1027

traits:
  - id: reversed-getscriptblock-token
    desc: Reversed PowerShell GetScriptBlock token
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: kcolBtpircSteG

  - id: powershell-reverse-index-byte-access
    desc: PowerShell reverse-index byte-array access
    crit: notable
    conf: 0.94
    if:
      type: text
      # $v[$v.Count - $X - 1] / $arr[$arr.Length - $i - 1]
      regex: '\$\w+\s*\[\s*\$\w+\.(Count|Length)\s*-\s*\$\w+\s*-\s*1\s*\]'

  - id: powershell-byte-caesar-shift
    desc: PowerShell per-byte arithmetic Caesar shift
    crit: notable
    conf: 0.9
    if:
      type: text
      # [char]($v[...] ± N) with a small fixed offset typical of Caesar decode
      regex: '(?i)\[char\]\s*\(\s*\$[^)]{0,80}(\+|\-)\s*[1-9]\s*\)'

composite_rules:
  - id: powershell-reverse-caesar-string-decode
    desc: PowerShell reverse-index Caesar byte-string decoder
    crit: suspicious
    conf: 0.96
    near_lines: 8
    all:
      - id: powershell-reverse-index-byte-access
      - id: powershell-byte-caesar-shift

  - id: powershell-reverse-caesar-iex-loader
    desc: PowerShell reverse-Caesar decoder feeds Invoke-Expression
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001
    near_lines: 16
    all:
      - id: powershell-reverse-caesar-string-decode
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text

  # A script that loads an assembly in memory and hands its reflected entry
  # method an http(s) URL spelled backwards hides the next-stage address from
  # string scanners; the loaded stage reverses and fetches it. No carrier,
  # type name, method name or host is required.
  - id: powershell-reversed-url-to-reflected-loader
    desc: Reflected loader gets reversed next-stage URL
    for: [powershell]
    crit: hostile
    conf: 0.96
    attack: T1027,T1620
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/string/reverse::powershell-reversed-http-url-literal
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
