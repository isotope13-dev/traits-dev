# The reversed value must be the executed argument, not a nearby string helper.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-reverse-string-obfuscation
    desc: Dynamically executes reversed JavaScript
    crit: suspicious
    conf: 0.96
    attack: T1027.002
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @executor
          arguments: (arguments
            (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression
                    object: (call_expression
                      function: (member_expression
                        property: (property_identifier) @split))
                    property: (property_identifier) @reverse))
                property: (property_identifier) @join)) @evidence))
          (#match? @executor "^(eval|Function)$")
          (#eq? @split "split")
          (#eq? @reverse "reverse")
          (#eq? @join "join"))
