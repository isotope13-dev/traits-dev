# JavaScript reverse-string obfuscation.
# Reversal alone is a neutral string operation. These objective rules require
# the reversed material to participate in dynamic code execution, which keeps
# ordinary token protocols and CAPTCHA challenge handling out of the finding.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1027
  mbc: B0032

traits:
  - id: js-decoded-dynamic-sink
    desc: Dynamic execution directly wraps decoder
    crit: suspicious
    conf: 0.96
    # Browser phishing stagers ship as .htm/.xhtml attachments with the same
    # eval(atob(...)) sink; html is covered by file defaults.
    if:
      type: text
      regex: '(?i)(eval|new Function)\s*\(\s*(atob|Buffer\.from)\s*\('
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
      - id: well-known/tool/detection/hol-guard/
      - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
      - id: well-known/lib/format/stacksjs-stacks::stacks-hetzner-deploy-runtime-context
      - id: well-known/lib/format/stacksjs-ts-cloud/

  - id: js-reverse-assignment-tail
    desc: Variable assigned reverse call result
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\w+\s*=\s*\w+\.reverse\(\)'
    not:
      - substr: "Lodash <https://lodash.com/>"
    unless:
      - type: basename
        regex: '(^|!!).{0,200}lodash\.min\.js$'

composite_rules:
  - id: js-reverse-split-then-decode
    desc: Executes reversed decoded JavaScript
    crit: suspicious
    conf: 0.96
    near_bytes: 256
    all:
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: objectives/anti-static/obfuscation/string/reverse::js-decoded-dynamic-sink

  - id: js-reverse-decode-aggregator
    desc: Reverse-obfuscated JavaScript execution pattern
    crit: suspicious
    conf: 0.96
    any:
      - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-split-then-decode
      - id: objectives/anti-static/obfuscation/string/reverse::js-reverse-then-eval

  - id: js-reverse-then-eval
    desc: Dynamically executes reversed JavaScript string
    crit: suspicious
    conf: 0.95
    near_bytes: 256
    all:
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: micro-behaviors/process/interpreter/eval::js-eval-raw
    unless:
      # Webpack's eval devtool stores generated, non-obfuscated modules in
      # eval() strings.  A bundled library may also expose a normal reverse
      # string helper; the pair is not a reverse-obfuscated loader in this
      # documented build context.
      - id: micro-behaviors/data/source/build::webpack-eval-devtool-comment
      - id: micro-behaviors/data/source/build::webpack-sourceurl-comment
      - id: metadata/library/structure::js-webpack-bundle
