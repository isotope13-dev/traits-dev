# Windows scripting identifiers written backwards and restored at runtime with
# `StrReverse`. The technique costs the author nothing and defeats every
# scanner that looks for the forward spelling, so it is the first thing a VBS
# dropper reaches for: the ProgID it will instantiate, the interpreter it will
# launch, and the download method it will call all arrive reversed.
#
# Each atom is the reversed spelling of one token. They are suspicious on
# their own -- a backwards ProgID has no innocent reading, unlike the
# `StrReverse` call itself, which is an ordinary string function.
defaults:
  platforms: [windows]
  for: [vbs, batch, javascript, html]
  crit: suspicious
  conf: 0.92
  attack: T1027
  mbc: B0032

traits:
  - id: reversed-wscript-shell-progid
    desc: Reversed WScript.Shell ProgID
    if:
      # `ehS.tpircS` -- "Script.She" backwards, the middle of the
      # `WScript.Shell` ProgID. The head and tail are usually supplied
      # separately so the whole name never appears.
      type: text
      regex: '(?i)ehS\.tpircS'

  - id: reversed-powershell-name
    desc: Reversed PowerShell interpreter name
    if:
      type: text
      regex: '(?i)llehSrewoP'

  - id: reversed-mshta-name
    desc: Reversed mshta interpreter name
    if:
      # `athsm` -- "mshta" backwards, usually with the run-argument spacing
      # (`StrReverse(" athsm")`) so the LOLBIN name never appears.
      type: text
      regex: '(?i)athsm'

  - id: reversed-downloadstring-method
    desc: Reversed DownloadString method name
    attack: T1105
    if:
      type: text
      regex: '(?i)gnirtSdaolnwoD'

  - id: reversed-webclient-class
    desc: Reversed Net.WebClient class name
    attack: T1105
    if:
      type: text
      regex: '(?i)tneilCbeW\.teN'

  - id: reversed-invoke-expression
    desc: Reversed Invoke-Expression cmdlet name
    attack: T1059.001
    if:
      type: text
      regex: '(?i)noisserpxE-ekovnI'

  # The FileSystemObject self-copy vocabulary, reversed. Kept notable, unlike
  # the atoms above: together they are the self-copy that
  # impact/infect/script/self-copy's wsh-reversed-self-copy convicts, and `eliFypoC`
  # alone is short enough to turn up inside encoded blobs.
  - id: wsh-reversed-fso
    desc: Reversed FileSystemObject ProgID
    crit: notable
    conf: 0.9
    for: [javascript, text, vbs, static-lib]
    if:
      type: text
      substr: tcejbOmetsySeliF.gnitpircS

  - id: wsh-reversed-copyfile
    desc: Reversed CopyFile method name
    crit: notable
    conf: 0.88
    for: [javascript, text, vbs, static-lib]
    if:
      type: text
      substr: eliFypoC

  - id: wsh-reversed-scriptname
    desc: Reversed ScriptFullName token
    crit: notable
    conf: 0.9
    for: [javascript, text, vbs, static-lib]
    if:
      type: text
      substr: emaNlluFtpircS

composite_rules:
  # The interpreter and the thing it is being told to do, both backwards. One
  # reversed token could be a coincidence of some other encoding; the shell
  # plus a download or an eval is a staged command being hidden.
  - id: reversed-powershell-stager
    desc: Reversed PowerShell download or eval stager
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.001
    all:
      - id: reversed-powershell-name
    any:
      - id: reversed-downloadstring-method
      - id: reversed-webclient-class
      - id: reversed-invoke-expression
      - id: reversed-wscript-shell-progid
