defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: reversed-createprocessa-name
    desc: Reversed CreateProcessA API name
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: AssecorPetaerC

  # Service-control API names stored backwards (`AecivreSnepO` for
  # OpenServiceA) and reversed at run time before GetProcAddress, keeping the
  # service install/configure calls out of import and string review. Seen in
  # the Gh0st-lineage svchost ServiceDll loader of sha 2271192a.
  - id: reversed-service-control-api-name
    desc: Reversed service-control API name
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)^[AW]\w{0,16}(ecivreS|reganaMCS)(nepO|etaerC|eteleD|teG|tratS|lortnoC|egnahC)$'

composite_rules:
  - id: reversed-service-api-svchost-group
    desc: Reversed service APIs beside svchost group
    crit: suspicious
    conf: 0.92
    all:
      - id: reversed-service-control-api-name
      - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
