defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust, go]
  attack: T1027.007,T1140
  mbc: B0032

composite_rules:
  - id: rotated-b64-table-bitmask-decoder
    desc: Decodes strings via rotated 64-byte table and bitmask
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/embedded/payload/array::portable-hex-byte-array-literal
      - id: micro-behaviors/data/decode/table::modulo-64-table-rotation
      - id: micro-behaviors/data/decode/table::quartet-6bit-byte-pack-shifts
      - id: micro-behaviors/data/decode/table::bitmask-high-bit-restore

  - id: rotated-b64-runtime-api-resolution
    desc: Resolves Windows APIs from rotated-table decoded strings
    crit: hostile
    conf: 0.98
    platforms: [windows]
    for: [c, cpp, rust]
    all:
      - id: rotated-b64-table-bitmask-decoder
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
      - id: micro-behaviors/dylib/load/source::load-library-a-source
