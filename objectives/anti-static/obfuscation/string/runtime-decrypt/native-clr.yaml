# The decoder recovers stack-built API names in an embedded CLR host. This
# records concealment code, not a carrier-to-overlay execution relationship.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: xor-string-decoder-with-clr-host-identifiers
    desc: Unrolled XOR decoder with CLR-host identifiers
    crit: suspicious
    conf: 0.92
    attack: T1027
    all:
      - id: micro-behaviors/data/decode/xor::x86-unrolled-byte-xor-to-stack
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-metahost-interface-guids
    any:
      - id: metadata/binary/framework::clr-runtime-header
      - id: micro-behaviors/process/interpreter/runtime/clr::clr-native-hosting-apis
      - id: micro-behaviors/process/interpreter/runtime/clr::native-appdomain-load-byte-array
    needs: 1
