defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: repeated-simd-stack-literal-decryption
    desc: Repeated SIMD decryption of stack literals
    crit: suspicious
    conf: 0.98
    count_min: 6
    if:
      type: hex
      section: .text
      # Ciphertext qwords, volatile stack round-trips, then a key
      # loaded relative to RIP and XORed directly into the literal buffer.
      pattern: '48 B8 ?? ?? ?? ?? ?? ?? ?? ?? 48 89 45 ?? 48 8B 45 ?? 48 89 45 ?? [0-160] (F3 0F 6F 05 ?? ?? ?? ?? 0F 57 45 ?? 66 0F 7F 45 ?? | 66 0F 6F 4D ?? F3 0F 6F 05 ?? ?? ?? ?? 0F 57 C8 66 0F 7F 4D ??)'
