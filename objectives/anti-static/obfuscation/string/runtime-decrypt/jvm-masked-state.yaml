defaults:
  platforms: [windows, unix]
  for: [class]
  crit: suspicious
  attack: T1027.013,T1140
composite_rules:
  - id: jvm-masked-state-string-reconstruction
    desc: Repeated masked-state XOR stores accompany byte-slice String construction
    conf: 0.94
    # Class-local co-occurrence supports runtime string reconstruction;
    # it does not bind every XOR store to the constructor's input array.
    all:
      - id: micro-behaviors/data/decode/xor::jvm-repeated-masked-state-xor-stores
      - id: metadata/binary/symbols/imports::jvm-byte-slice-void-descriptor
      - id: micro-behaviors/data/string/conversion::jvm-string-constructor-reference
