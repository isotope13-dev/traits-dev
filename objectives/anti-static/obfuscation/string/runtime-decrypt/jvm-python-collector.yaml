defaults:
  platforms: [windows]
  for: [jar, zip, class]
composite_rules:
  - id: jvm-browser-collector-obfuscated-python-runtime
    desc: Native browser collector with obfuscated Python runtime setup
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1027,T1140
    all:
      - id: objectives/credential-access/browser/multi-target::jvm-native-injection-browser-secret-collector
      - id: micro-behaviors/process/fd/stdio::jvm-embedded-python-child-stdin-profile
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::jvm-resource-long-state-string-decoder
