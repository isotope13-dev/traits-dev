defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  # Literal builders form a 128-bit key by XORing stack blocks, then pass
  # separate key/IV/data pointers to a shared decoder. Immediates (including
  # keys and ciphertext), stack offsets and relocations remain variable.
  - id: dense-xor-keyed-stack-literal-builders
    desc: Dense XOR-keyed stack literal decoder builders
    crit: suspicious
    conf: 0.98
    count_min: 100
    if:
      type: hex
      section: .text
      pattern: 'C7 45 ?? ?? ?? ?? ?? 4C 8D 45 ?? C7 45 ?? ?? ?? ?? ?? 48 8D 55 ?? C7 45 ?? ?? ?? ?? ?? 48 8B D9 C7 45 ?? ?? ?? ?? ?? 48 8D 4D ?? F3 0F 6F 45 ?? [0-64] 0F 57 C8 [0-20] F3 0F 7F 4D ??'
