defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # Two UTF-16 table lookups are XORed with a per-record key. One walks the
  # record backwards; the other cycles through a second table using remainder.
  # Locals, metadata tokens and the cycling phase are build-dependent. This
  # recognizes the retained CIL decoder shape, not any particular ciphertext.
  - id: cil-reverse-cycling-table-character-decoder
    desc: CIL reversed-table and cycling XOR decoder
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: hex
      section: .text
      pattern: '11 ?? 11 ?? 75 ?? ?? ?? 1B 11 ?? 11 ?? 58 11 ?? 59 93 61 11 ?? 74 ?? ?? ?? 1B 11 ?? 11 ?? 58 1F ?? 58 11 ?? 5D 93 61 D1 6F ?? ?? ?? 0A'
composite_rules:
  # The decoder hides names and constants, the large high-entropy resource is
  # the ciphertext, and Assembly.Load is the handoff. Together they are a
  # packed managed loader, the way a crypter hides a RAT behind an unrelated
  # application's identity. The loaded assembly itself stays encrypted.
  - id: cil-decoder-resource-assembly-loader
    desc: Obfuscated .NET loader decodes a resource and loads it
    crit: hostile
    conf: 0.9
    attack: T1027,T1620
    all:
      - id: cil-reverse-cycling-table-character-decoder
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: micro-behaviors/data/embedded/resource::dotnet-cil-resourcemanager-get-call
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
