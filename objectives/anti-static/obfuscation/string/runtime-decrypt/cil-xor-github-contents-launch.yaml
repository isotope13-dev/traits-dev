# A managed loader keeps its GitHub owner, repository, and path XOR-encoded,
# leaving only the bare contents-API URL skeleton in clear text, and launches
# a process. Hiding the payload's hosting coordinates serves no benign purpose.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1105

composite_rules:
  - id: cil-xor-github-contents-path-process-launch
    desc: XOR-hidden GitHub repo coordinates feed a contents fetch and launch
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/github/repository::github-repos-url-prefix-string
      - id: micro-behaviors/communications/http/services/github/repository::github-contents-path-segment-string
      - id: micro-behaviors/data/codec::managed-byte-xor-with-base64-api-references
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
