defaults:
  platforms: [windows, unix]
  for: [class]
composite_rules:
  - id: jvm-resource-long-state-string-decoder
    desc: Resource streams accompany long-state XOR string decoding
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/encoding/xor::jvm-long-state-xor-byte-transform
      - id: micro-behaviors/data/embedded/payload/resource::java-class-getresourceasstream
      - id: metadata/binary/symbols/imports::jvm-byte-slice-void-descriptor
      - id: micro-behaviors/data/string/conversion::jvm-string-constructor-reference
