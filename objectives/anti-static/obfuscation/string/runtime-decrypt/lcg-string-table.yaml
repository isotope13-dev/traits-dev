# An encrypted string table next to an LCG keystream routine: every name the
# program uses is recovered at runtime by a per-byte PRNG-keyed decryptor,
# leaving nothing readable for static triage.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  attack: T1027.013,T1140

composite_rules:
  - id: lcg-decrypted-string-table
    desc: Decrypts a string table with an LCG keystream
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/embedded/payload/encrypted::length-prefixed-base64-string-table
      - id: micro-behaviors/data/decode/xor::lcg-keystream-high-byte-x86
