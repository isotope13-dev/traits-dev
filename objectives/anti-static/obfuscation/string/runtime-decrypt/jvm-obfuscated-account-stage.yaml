defaults:
  platforms: [windows, unix]
  for: [jar, zip, class]
  attack: T1027,T1140
composite_rules:
  - id: jvm-obfuscated-abi-reader
    desc: JVM ABI length decoding accompanies runtime string reconstruction
    crit: suspicious
    conf: 0.95
    for: [class]
    # Resolver-local: obfuscation in an unrelated archive member cannot
    # turn an ordinary ABI reader into an obfuscated resolver finding.
    all:
      - id: micro-behaviors/data/decode/hex::java-abi-hex-length-word-parse
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::jvm-masked-state-string-reconstruction
