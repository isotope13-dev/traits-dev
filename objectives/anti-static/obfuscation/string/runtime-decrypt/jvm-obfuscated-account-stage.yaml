defaults:
  platforms: [windows, unix]
  for: [jar, zip, class]
  attack: T1027,T1140
composite_rules:
  - id: jvm-obfuscated-abi-reader
    desc: JVM ABI length decoding accompanies runtime string reconstruction
    crit: suspicious
    conf: 0.95
    for: [class]
    # Resolver-local: obfuscation in an unrelated archive member cannot
    # turn an ordinary ABI reader into an obfuscated resolver finding.
    all:
      - id: micro-behaviors/data/decode/hex::java-abi-hex-length-word-parse
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::jvm-masked-state-string-reconstruction
  - id: jvm-account-loader-obfuscated-abi
    desc: Account loader accompanies obfuscated ABI string reconstruction
    crit: hostile
    conf: 0.98
    scope: archive
    # The account-forwarding loader supplies the attack claim. A wallet with
    # an ABI decoder and an obfuscated HTTP implementation is insufficient.
    # Correlation is across classes; this matcher does not prove data flow
    # from the ABI answer to the loader's network destination.
    all:
      - id: jvm-obfuscated-abi-reader
      - id: objectives/command-and-control/backdoor/loader/classloader::minecraft-account-forwarding-classloader
      - id: micro-behaviors/communications/http/message::jvm-handwritten-request-line
