# XOR-concealed diagnostics alongside remote-thread API references.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
composite_rules:
- id: xor-concealed-remote-thread-injection
  desc: Concealed text with remote-thread injection APIs
