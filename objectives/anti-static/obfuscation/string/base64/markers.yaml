defaults:
  crit: suspicious
  platforms: [windows, unix]
traits:
  - id: base64-powershell-prefix
    desc: Base64-encoded PowerShell command prefix
    conf: 0.8
    size_max: 262144
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      # `+` and `/` are base64 alphabet: a JAB run after one is the middle of a
      # larger blob (a zlib search index, a font), not the start of a command.
      regex: (^|[^A-Za-z0-9+/])JAB[A-Za-z0-9]{20,}
    not:
      - substr: '@@'
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
