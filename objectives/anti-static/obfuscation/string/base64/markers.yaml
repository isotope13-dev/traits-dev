defaults:
  platforms: [windows, unix]
traits:
  # This searched the raw file for the literal `ZnVuY3Rpb24` -- base64 for the
  # word "function" at one of its three possible alignments -- and called any
  # hit string obfuscation. But base64-encoding a *document* is not obfuscation,
  # and "function" is an ordinary English word: python-versioneer 0.29 ships its
  # entire upstream source as one base64 blob (its documented PEP-518 bootstrap)
  # and was scored suspicious on the prose "…`get_versions()` function. From…"
  # and "…This function is not used…". Match the decoded content for C-family
  # function *syntax* instead (JavaScript, PHP, and the script hosts below all
  # share it). That is what an encoded script payload actually
  # contains, it covers all three alignments rather than one, and English prose
  # never satisfies it.
  - id: base64-script-function-definition
    desc: Base64 payload defines a script function
    crit: suspicious
    conf: 0.9
    # `type: encoded` decodes every candidate run, so it carries a tighter
    # file-type cap than the old raw-text form. These are the carriers that
    # actually stage base64 JavaScript -- the WSH/JScript droppers and the
    # script hosts that hand a decoded blob to eval.
    for: [javascript, typescript, html, vbs, powershell, batch, python, php]
    if:
      type: encoded
      encoding: base64
      # The parameter list and opening brace are required, not just the keyword
      # and a paren: English prose reaches `function (` on its own -- "the
      # get_versions function (see below)" -- which would have re-created the
      # same false positive one layer down. A definition needs `)` then `{`.
      regex: '\bfunction\s*[\w$]{0,40}\s*\([\w$,\s]{0,80}\)\s*\{'
    unless:
      - id: metadata/library/structure/
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: objectives/anti-static/obfuscation/code-metrics/structure/
      # Inline source maps carry Base64-encoded sourcesContent.  The decoded
      # source commonly contains the word "function", but it is build
      # metadata rather than a runtime obfuscation layer.
      - id: metadata/file/format/structured::sourcemap-context
      - id: well-known/app/development/deno::source-archive-context
      - id: micro-behaviors/communications/url/encoded::inline-javascript-data-uri-context
      - type: text
        substr: 'Build https://modernizr.com/download?'
  - id: base64-powershell-prefix
    desc: Base64-encoded PowerShell command prefix
    crit: suspicious
    conf: 0.8
    size_max: 262144
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: (^|[^A-Za-z0-9])JAB[A-Za-z0-9]{20,}
    not:
      - substr: '@@'
    unless:
      - id: metadata/library/structure::js-large-module-bundle
