defaults:
  platforms: [unix, windows]
  for: [php]
  crit: suspicious
  conf: 0.85
  attack: T1027
  mbc: B0032

traits:
  - id: dynamic-function-chr-arith
    desc: Dynamic function name via chr arithmetic
    if:
      type: text
      regex: "chr\\s*\\(\\s*\\d+\\s*[+\\-*]"
    count_min: 3
    per_kb_min: 0.5
    unless:
      # UTF-8 encoders (SimplePie idna_convert) build lead bytes as
      # chr(192 + ($cp >> 6)); the shifted codepoint is not a name fragment.
      - type: text
        regex: 'chr\s*\(\s*(19[2-9]|2[2-5]\d)\s*\+\s*\(\s*\$\w+\s*>>'

  - id: chr-concat-function-name
    desc: Builds function name from chr calls
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "chr\\s*\\(\\s*\\d+\\s*\\)\\s*\\.\\s*chr"
    count_min: 6
    per_kb_min: 0.3
    unless:
      # PHPInsight builds Latin-1 diacritic translation tables with chr().
      - id: well-known/lib/ai/phpinsight::phpinsight-library-context
