defaults:
  crit: suspicious
  platforms: [windows]
  for:
    - powershell
  attack: T1027
  mbc: B0032
traits:
  - id: ps1-mass-int-assignment
    desc: Massive block of integer assignments
    conf: 0.9
    if:
      type: string_literal
      regex: (\$\w{10,}\s*=\s*\d+;?[\r\n\s]+){5,}
  - id: ps1-mass-array-assignment
    desc: Massive block of array assignments
    conf: 0.9
    # One extracted statement is not a block. Reconstruction lays several
    # `$name = @(` / `+= @(` lines in a row; three scattered arrays are not.
    if:
      type: text
      regex: '(\$\w{5,}\s*\+?=\s*@\([^\n]{0,80}\n\s*){6,}'
    unless:
      - id: well-known/app/system/moonshiner::seed-fixture-tree
      - id: well-known/tool/development/vcs/gitsplit::module-context
composite_rules:
  - id: ps1-reconstruction-loader
    desc: PowerShell Payload Reconstruction Loader
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    any:
      - id: ps1-mass-int-assignment
      - id: ps1-mass-array-assignment
