defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: suspicious
  conf: 0.8
traits:
  - id: hex-escaped-bracket-property
    desc: "Hex-escaped bracket property access"
    crit: notable
    if:
      type: text
      regex: \[\s*["']([^"'\\]{0,120}\\x[0-9a-fA-F]{2}){3,}[^"'\\]{0,120}["']\s*\]
    unless:
      - id: well-known/lib/crypto/phpseclib
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
    not:
      - regex: \[\s*["']\\x1b\[
  - id: hex-escaped-from-char-code
    desc: Hex-escaped fromCharCode property access
    crit: notable
    if:
      type: text
      regex: \[\s*["']\\x66\\x72\\x6f\\x6d\\x43\\x68\\x61\\x72\\x43\\x6f\\x64\\x65["']\s*\]
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  - id: hex-escaped-char-at
    desc: Hex-escaped charAt property access
    crit: notable
    if:
      type: text
      regex: \[\s*["']\\x63\\x68\\x61\\x72\\x(41|61)\\x74["']\s*\]
    unless:
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  # The API name itself comes out of a variadic char-code helper:
  # `window[_GH8C(145,164,159,146)]` is `window["atob"]` with every code point
  # shifted by 48, `URL[_GH8C(147,162,...)]` is createObjectURL, and a WSH
  # stage spells `this[Yd8tx(122,155,153,144,149,142)]` for `this["String"]`.
  # The Colombian judicial-lure SVG (2026-09, a .msg attachment) and the
  # JScript it drops both hide every sensitive name this way, which is what
  # blinds the by-name Blob/createObjectURL/ActiveX rules. A bracketed member
  # whose key is a call over three or more two/three-digit integers is the
  # shape; two of them in one file is the helper being used, not one numeric
  # index expression.
  - id: char-code-helper-member-name
    desc: Member names decoded by char-code helper
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html, svg]
    count_min: 2
    if:
      type: text
      regex: '[\w$]{1,24}\[\s*[A-Za-z_$][\w$]{1,24}\(\s*\d{2,3}(\s*,\s*\d{2,3}){2,}\s*\)\s*\]'
composite_rules:
  - id: obfuscated-cookie-remote-loader
    desc: Obfuscated browser loader reads cookies and pulls remote code
    crit: hostile
    conf: 0.95
    attack: T1027,T1105,T1539
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/string/dynamic::hex-escaped-bracket-property
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-read
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
  - id: obfuscated-card-websocket-skimmer
    desc: Obfuscated card skimmer concatenates data for WebSocket exfiltration
    crit: hostile
    conf: 0.95
    attack: T1027,T1041,T1056.002
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/parse/payment::browser-card-number-field-key
      - id: micro-behaviors/data/parse/payment::browser-card-security-field-key
      - id: micro-behaviors/data/string/concat::dense-string-fragment-concatenation
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/websocket/send::websocket-instance-send-call
  - id: obfuscated-extension-storage-gated-loader
    desc: Extension hides a storage-gated remote script loader
    crit: hostile
    conf: 0.96
    attack: T1027,T1105,T1176
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-get
      - id: micro-behaviors/process/create/load/remote-code::js-contextual-script-markup-injection
      - id: micro-behaviors/communications/url/construction/fragment::js-split-http-url-construction
      - id: micro-behaviors/data/string/concat::dense-string-fragment-concatenation
