defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: mangled-constructor-debugger-tokens
  desc: Obfuscated source contains constructor and debugger tokens
  crit: suspicious
  conf: 0.97
  attack: T1027.002
  all:
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  - id: micro-behaviors/process/debug/event::hex-escaped-debugger-keyword
  - id: metadata/lang/encoding/hex::hex-escaped-constructor-token
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  near_bytes: 4096
