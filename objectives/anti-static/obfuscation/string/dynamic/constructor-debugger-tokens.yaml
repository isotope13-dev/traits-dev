defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: mangled-constructor-debugger-tokens
  desc: Obfuscated source contains constructor and debugger tokens
  crit: suspicious
  conf: 0.97
  attack: T1027.002
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  - id: micro-behaviors/process/debug/event::hex-escaped-debugger-keyword
  - id: micro-behaviors/data/property/access::hex-escaped-constructor-token
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
  near_bytes: 4096
