defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  crit: suspicious
traits:
- id: xor-array-string-decoder
  desc: XOR hex-array string constants
  conf: 0.92
  count_min: 4
  if:
    type: text
    substr: (\b(const|let|var)\s+|,)\s*[A-Za-z_$][\w$]*\s*=\s*\[(0x[0-
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
composite_rules:
- id: obfuscated-node-staged-loader
  desc: Obfuscated Node dynamic-load context
  conf: 0.98
  attack: T1105
  all:
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  - id: micro-behaviors/data/control-flow/dispatch/computed::buffer-computed-method-chain
  - id: xor-array-string-decoder
  any:
  - id: metadata/file/profile/command-options::windowshide-obfuscated-true
  - id: metadata/file/profile/command-options::windowshide-obfuscated-expression
  - id: micro-behaviors/process/daemonize/detach::node-obfuscated-detached-stdio-options
  unless:
  - id: metadata/path/directory::test-directory-component
