# Packed JavaScript that rebuilds strings from a property bag of
# single-letter values, then feeds Function(""+bag[k]+...) as the
# eval primitive. The empty-string concat plus the one-char map is
# the durable shape, not the random identifier names.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1027,T1059.007

traits:
  - id: js-function-empty-concat
    desc: Function constructor fed empty-string concat
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: "Function\\(\\s*['\"]['\"]\\s*\\+"
  - id: js-try-catch-decoy-call
    desc: try/catch around a decoy empty call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "try\\s*\\{\\s*[A-Za-z_]\\w*\\s*\\(\\s*\\)\\s*;?\\s*\\}\\s*catch"
  - id: js-single-letter-property-bag
    desc: Property bag of single-letter strings
    crit: notable
    conf: 0.9
    count_min: 12
    if:
      type: text
      regex: "\\[['\"][^'\"]{8,}['\"]\\]\\s*=\\s*['\"][A-Za-z0-9]['\"]"

composite_rules:
  - id: js-function-concat-property-bag
    desc: Function concat of a letter property bag
    crit: hostile
    conf: 0.96
    all:
      - id: js-function-empty-concat
      - id: js-single-letter-property-bag
  - id: js-decoy-function-concat
    desc: Decoy try/catch plus Function concat
    crit: hostile
    conf: 0.95
    all:
      - id: js-function-empty-concat
      - id: js-try-catch-decoy-call
  - id: js-decoy-letter-property-bag
    desc: Decoy try/catch plus a letter property bag
    crit: hostile
    conf: 0.94
    all:
      - id: js-try-catch-decoy-call
      - id: js-single-letter-property-bag
