# Packed JavaScript that rebuilds strings from a property bag of
# single-letter values, then feeds Function(""+bag[k]+...) as the
# eval primitive. The empty-string concat plus the one-char map is
# the durable shape, not the random identifier names.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1027,T1059.007

traits:
  # The matcher detects the bare-catch guard shape itself: a no-arg call
  # whose error is silently discarded. Ordinary code ships thousands of these
  # (disposal loops, optional feature probes, ES2019 `catch {`), so the atom
  # stays notable and only a compact co-occurrence with the eval primitive
  # below earns the packer claim.
  - id: js-bare-catch-call-guard
    desc: Bare catch swallows a no-arg call
    crit: notable
    conf: 0.88
    if:
      type: text
      # One- and two-character callees are minified optional calls
      # (try{t()}catch{}), not a packer stub.
      regex: "try\\s*\\{\\s*[\\w$]{4,}\\(\\)\\s*;?\\s*\\}\\s*catch[^{]{0,16}\\{\\s*\\}"
  - id: js-single-letter-property-bag
    desc: Property bag of single-letter strings
    crit: notable
    conf: 0.9
    count_min: 12
    if:
      type: text
      regex: "\\[['\"][^'\"]{8,}['\"]\\]\\s*=\\s*['\"][A-Za-z0-9]['\"]"

composite_rules:
  - id: js-function-concat-property-bag
    desc: Function concat of a letter property bag
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::function-constructor-empty-concat
      - id: js-single-letter-property-bag
  - id: js-decoy-function-concat
    desc: Decoy try/catch plus Function concat
    crit: hostile
    conf: 0.95
    # A packer stub is compact: the silent guard sits beside the eval
    # primitive it covers for. Without the window, every minified bundle that
    # owns both a bare-catch disposal guard and a Function-constructor
    # polyfill (setImmediate-style `new Function("" + callback)`) matches
    # file-wide.
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::function-constructor-empty-concat
      - id: js-bare-catch-call-guard
  - id: js-decoy-letter-property-bag
    desc: Decoy try/catch plus a letter property bag
    crit: hostile
    conf: 0.94
    all:
      - id: js-bare-catch-call-guard
      - id: js-single-letter-property-bag
