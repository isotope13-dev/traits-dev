defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: npm-install-obfuscated-domain-helper
  desc: NPM install hook ships an obfuscated DNS-domain helper
  crit: suspicious
  conf: 0.98
  for: [tar, registry, javascript]
  # The install hook is represented by the fetched registry sidecar while the
  # helper lives inside the tarball, so package scope is required here.
  scope: outer
  all:
  - id: metadata/registry::registry-install-hook
  - id: objectives/anti-static/obfuscation/string/array::hex-array-near-indexed-charcode-decoder
  - id: micro-behaviors/os/module/export::commonjs-domain-like-export

  # Install-time DNS beacon: install hook + DNS lookup + canary domain
