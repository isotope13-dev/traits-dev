# Commodity WSH droppers pad themselves to megabytes by appending the same
# junk literal to one property thousands of times, pushing the file past
# scanner and sandbox upload size limits. Generated code never does this.
defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: js-mass-property-string-append
    desc: Thousands of string appends to one property
    crit: notable
    conf: 0.9
    count_min: 1000
    if:
      type: text
      regex: '(?m)^\s*this\.[A-Za-z_$][\w$]{4,}\s*\+=\s*"'
composite_rules:
  - id: wsh-dropper-mass-append-size-padding
    desc: WSH file dropper padded past scanner size limits
    crit: hostile
    conf: 0.95
    attack: T1027.001
    size_min: 1048576
    all:
      - id: js-mass-property-string-append
    any:
      - id: objectives/anti-static/obfuscation/string/conceal::wsh-concealed-msxml-file-writer
      - id: objectives/anti-static/obfuscation/string/conceal::wsh-obfuscated-savetofile-reference
      - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-create-sequence
