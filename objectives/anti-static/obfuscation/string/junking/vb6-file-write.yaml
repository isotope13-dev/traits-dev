defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027

composite_rules:
  - id: vb6-numbered-identifier-file-write
    desc: VB6 numbered identifiers with file writing
    crit: suspicious
    conf: 0.94
    all:
      - id: vb6-numbered-identifier-obfuscation-profile
      - id: micro-behaviors/fs/write/file/handle::vb6-binary-file-write
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-numbered-identifier-shell
    desc: VB6 numbered identifiers with shell capability
    crit: suspicious
    conf: 0.94
    all:
      - id: vb6-numbered-identifier-obfuscation-profile
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
