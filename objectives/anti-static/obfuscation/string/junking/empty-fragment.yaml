# Empty string literals spliced into a concatenation: `'a'+''+''+''+'b'`. They
# contribute nothing to the result, which is the point -- they pad the
# expression so the assembled word is spread across enough fragments that no
# window of the source contains it, and they inflate the token count a
# statistical classifier reads.
#
# No author writes these by hand and no minifier emits them, so a run of them
# is machine-made padding.
defaults:
  platforms: [windows, unix]
  for: [scripts, documents]
  attack: T1027
  mbc: B0032

traits:
  - id: empty-string-concat-padding
    desc: Concatenation padded with empty strings
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: "(''\\s*\\+\\s*){4,}"

  - id: empty-double-quoted-concat-padding
    desc: Concatenation padded with empty strings
    crit: suspicious
    conf: 0.92
    if:
      # The double-quoted spelling, and the `&` operator VBScript and VB use
      # for concatenation alongside `+`.
      type: text
      regex: '(""\s*[&+]\s*){4,}'
