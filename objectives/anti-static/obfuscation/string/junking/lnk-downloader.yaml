defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-interleaved-downloadstring-spelling
    desc: LNK DownloadString spelling has inserted text
    crit: suspicious
    conf: 0.94
    attack: T1027
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\.Do\w{1,12}wnl\w{0,12}oad\w{0,12}Str\w{0,12}in\w{0,12}g\('
