defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001
  mbc: F0001

composite_rules:
  # MPRESS produces a complete executable image and does not require a path
  # manifest. Tens of unrelated Downloads, Desktop, and Temp executable paths
  # in a dominant appended region are classifier/sandbox ballast, not runtime
  # file targets. Installers are excluded because their overlays can contain
  # genuine extraction manifests.
  - id: mpress-user-path-corpus-padding
    desc: MPRESS image padded with executable-path corpus
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/pack/mpress::mpress-versioned-stub
      - id: micro-behaviors/fs/path/padding::many-user-profile-executable-paths
      - id: metadata/binary/layout::overlay-over-35pct
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: metadata/signed/platform/
