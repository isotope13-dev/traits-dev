# VBScript junk-padding obfuscation
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

traits:
  - id: mass-comment-padding
    desc: VBScript has 500 long comment lines
    crit: suspicious
    conf: 0.98
    size_min: 32768
    count_min: 500
    if:
      type: text
      regex: "(?m)^'[A-Za-z][^\\r\\n]{20,}\\r?$"

  - id: dense-variable-string-appends
    desc: VBScript repeatedly appends long literals
    crit: suspicious
    conf: 0.96
    count_min: 50
    if:
      type: text
      regex: '(?i)^\s*\w+\s*=\s*\w+\s*&\s*"[^"]{20,}"'

composite_rules:
  - id: junk-padded-stride-loader
    desc: Junk-padded VBScript rebuilds and executes a hidden stage
    crit: hostile
    conf: 0.99
    all:
      - id: mass-comment-padding
      - id: dense-variable-string-appends
      - id: micro-behaviors/data/decode/custom::fixed-stride-character-decoder
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
