# VBScript junk-padding obfuscation
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

traits:
  # VBA droppers generated by this family interleave a command with a small
  # alphabet of junk characters.  The decoder walks the blob one character at
  # a time and keeps a character only when a hard-coded alphabet does *not*
  # match it.  The Mid() leg is kept in the composite below: a negated Like
  # test by itself is unusual, but it does not prove character decoding.
  - id: vbs-negated-like-junk-alphabet
    desc: VBScript character junk-alphabet test
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bIf\s+Not\s+"[A-Za-z0-9]{6,24}"\s+Like\s+'

  - id: mass-comment-padding
    desc: VBScript has 500 long comment lines
    crit: suspicious
    conf: 0.98
    size_min: 32768
    count_min: 500
    if:
      type: text
      regex: "(?m)^'[A-Za-z][^\\r\\n]{20,}\\r?$"

composite_rules:
  - id: vbs-junk-alphabet-character-decoder
    desc: VBScript removes alphabet-selected junk characters
    crit: suspicious
    conf: 0.98
    near_lines: 10
    all:
      - id: vbs-negated-like-junk-alphabet
      - id: micro-behaviors/data/string/access::vbs-mid-single-character

  - id: junk-padded-stride-loader
    desc: Junk-padded VBScript rebuilds and executes a hidden stage
    crit: hostile
    conf: 0.99
    all:
      - id: mass-comment-padding
      - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
      - id: micro-behaviors/data/string/access::vbs-mid-access-near-small-addition
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
  # Sibling of the above for loaders that stage fewer, longer appends (or
  # none): the padding plus a stride decoder feeding Execute on a variable
  # plus a WScript.Shell object leaves no legitimate use.
  - id: junk-padded-stride-execute-loader
    desc: Junk-padded VBScript executes a stride-decoded stage
    crit: hostile
    conf: 0.98
    all:
      - id: mass-comment-padding
      - id: micro-behaviors/data/string/access::vbs-mid-access-near-small-addition
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
      - id: micro-behaviors/os/com/automation::wscript-shell-literal

  - id: junk-padded-powershell-hidden-shell-run
    desc: Junk-padded VBScript hidden PowerShell Shell.Run
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.005,T1564.003
    all:
      - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
      - id: metadata/lang/source/literal/array::vbs-embedded-powershell-numeric-array
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
  # Fragmented text/evaluation and stride-like reconstruction are covered by
  # string/concat::vbs-fragmented-powershell-evaluation and
  # eval/loader::vbs-stride-reconstruction-evaluation. Their neutral
  # constituents do not prove hidden PowerShell or a decoded-stage launch.
  - id: junk-padded-spaced-powershell-shellexecute-loader
    desc: Junk-padded VBScript ShellExecute PowerShell stager
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.005
    all:
      - id: mass-comment-padding
      - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
      - id: micro-behaviors/process/create/shellexec::shell-application-execute-context
      - id: objectives/execution/interpreter/vbscript/loader::powershell-spaced-char-concat-loop
    any:
      - id: objectives/execution/interpreter/vbscript/loader::powershell-reverses-decoded-command
      - id: objectives/execution/interpreter/vbscript/loader::powershell-join-index-range-reversal
      - id: objectives/execution/interpreter/vbscript/loader::powershell-adipiscing-helper-name
      - id: objectives/execution/interpreter/vbscript/loader::powershell-split-join-reversal-fragment
    needs: 1
  - id: vbs-powershell-env-staged-execute-loader
    desc: VBScript stages PowerShell in env vars and Execute
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.005
    all:
      - id: metadata/lang/source/literal/array::vbs-embedded-powershell-numeric-array
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: micro-behaviors/os/env/read::wsh-vbs-environment-method
      - id: micro-behaviors/data/string/access::vbs-assigned-mid-substring
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: "metadata/lang/source/syntax/assignment/call::indexed-string-key-assignment-text"
    needs: 1

  # Sibling of junk-padded-stride-loader for droppers that write the decoded
  # payload to a temporary file, launch it hidden via WScript.Shell, and delete it.
  - id: junk-padded-staged-script-dropper
    desc: Junk-padded VBScript drops, executes and deletes a staged payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1105
    all:
      - id: mass-comment-padding
      - id: micro-behaviors/data/string/concat::vbs-many-long-literal-concatenations
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
