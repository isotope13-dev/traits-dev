defaults:
  platforms: [unix, windows]
  for: [html]
  conf: 0.95
composite_rules:
  - id: hidden-randomized-html-padding
    desc: Random markup with hidden invalid CSS padding
    crit: suspicious
    all:
      - id: metadata/document/html::repeated-long-word-tag-runs
      - id: micro-behaviors/ui/window/style::invalid-css-color-padding
      - id: micro-behaviors/ui/window/style::css-display-none
  - id: padded-device-link-phishing
    desc: Randomized padding in device-link phishing
    crit: hostile
    conf: 0.99
    all:
      - id: hidden-randomized-html-padding
      - id: objectives/credential-access/phishing/mfa-relay::whatsapp-linking-authentication-lure
