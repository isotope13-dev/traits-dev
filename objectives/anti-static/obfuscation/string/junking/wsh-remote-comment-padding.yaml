defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: wsh-remote-source-repetitive-comment-padding
  desc: Remote WSH load padded with unusual comments
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/interpreter/eval/source::http-script-source-tag
  - id: metadata/file/format/markup::wsh-job-root-tag
  - id: metadata/lang/source/comment::vbs-extended-character-comment-prefixes
