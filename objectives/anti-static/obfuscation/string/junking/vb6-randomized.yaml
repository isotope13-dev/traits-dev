defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1027
  mbc: B0032
traits:
- id: fused-word-salad-identifiers
  desc: Long alphabetic identifier strings
  crit: component
  conf: 0.84
  if:
    type: text
    regex: \b([A-Z][a-z]{13,}|[a-z]{16,}|[A-Z]{13,})\b
- id: numbered-identifier-cluster
  desc: Repeated numbered identifiers in PE text
  crit: component
  conf: 0.9
  count_min: 20
  if:
    type: text
    regex: \b[A-Za-z]{5,8}[0-9]{1,2}\b
    section: .text
composite_rules:
- id: vb6-fused-word-salad-identifiers
  desc: Long identifiers in VB6 with timer or self-issued certificate
  crit: notable
  conf: 0.9
  all:
  - id: fused-word-salad-identifiers
  - id: metadata/lang/runtime::vb6-application-framework
  any:
  - id: micro-behaviors/time/schedule/interval::vb6-timer-control
  - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
- id: vb6-timer-long-identifiers-api-dispatch
  desc: VB6 timer and API dispatch with long identifiers
  crit: suspicious
  conf: 0.92
  all:
  - id: vb6-fused-word-salad-identifiers
  - id: micro-behaviors/time/schedule/interval::vb6-timer-control
  - id: micro-behaviors/dylib/lookup::vb6-runtime-api-dispatch
  any:
  - id: metadata/build/artifact::pe-bound-imports-present
  - id: metadata/binary/section/ratio::few-sections
  - id: metadata/lang/compiler/native::clang-string
  needs: 2
- id: vb6-numbered-identifier-obfuscation-profile
  desc: VB6 numbered names with SIMD-padded dispatch
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/instruction/junk::simd-jump-junk-padding
  - id: metadata/lang/runtime::vb6-application-framework
  - id: numbered-identifier-cluster
  - id: micro-behaviors/dylib/lookup::vb6-runtime-api-dispatch
  any:
  - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
  - id: micro-behaviors/data/string/runtime::vb6-ordinal-string-transformation
  unless:
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-bundle
  - id: well-known/tool/packaging/msi-unpacker::jsware-msi-unpacker
  - id: well-known/tool/sysadmin/netiq-adpopulator::netiq-adpopulator
  - id: well-known/lib/runtime/native-platform/visual-basic::msvbvm60-runtime-context
  - id: metadata/binary/symbols/count::many-imports-200
