# Some loaders fill .rdata with hundreds of KB of printable noise, then splice
# fake Program Files paths (C:\Program Files (x86)\testamentary\x.cfg) and
# runs of common English words straight into it with no NUL separator. The
# paths and words give string extraction and ML models plausible-looking
# features; nothing reads them. Compilers and linkers emit NUL-terminated
# strings, so a path or word run glued to bracket/caret/tilde noise is padding.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001
  mbc: F0001

traits:
  - id: noise-fused-program-files-paths
    desc: Program Files paths fused into noise
    crit: suspicious
    conf: 0.85
    count_min: 3
    if:
      type: raw
      # A semicolon directly before a path is an ordinary PATH separator.
      # Require adjacent noise punctuation, not an environment-block entry.
      regex: '[{}|~^<>]{2,}[!-\[\]-~]{0,20}C:\\Program Files( \(x86\))?\\[A-Za-z ]{2,24}\\'

composite_rules:
  - id: noise-padding-decoy-paths-and-words
    desc: Noise padding with decoy paths and words
    crit: hostile
    conf: 0.92
    all:
      - id: noise-fused-program-files-paths
      - id: metadata/file/profile/string-population::punctuation-prefixed-word-runs
    unless:
      - id: metadata/signed/platform/
