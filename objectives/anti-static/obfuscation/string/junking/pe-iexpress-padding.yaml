defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
traits:
composite_rules:
  - id: fake-iexpress-string-padding
    desc: Fake IExpress string padding obfuscation
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/config/installer::iexpress-admqcmd
      - id: micro-behaviors/data/archive/extract/options::iexpress-extractopt
    any:
      - id: metadata/package/license::license-agreement-prompt
      - id: metadata/binary/header/malformed::malformed-pe-structure
    needs: 2
    unless:
      - id: metadata/package/files/msi-cabinet::embedded-mscf-cabinet
      - id: micro-behaviors/data/archive/extract/cab::fdi-api-name-reference
