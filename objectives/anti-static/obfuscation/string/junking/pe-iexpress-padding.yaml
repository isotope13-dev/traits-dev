defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
traits:
composite_rules:
  - id: fake-iexpress-string-padding
    desc: Fake IExpress string padding obfuscation
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/installer/sfx::iexpress-admqcmd
      - id: metadata/binary/installer/sfx::iexpress-extractopt
    any:
      - id: metadata/binary/installer/sfx::iexpress-license-cluster
      - id: metadata/binary/header/malformed::malformed-pe-structure
    needs: 2
    unless:
      - id: metadata/binary/installer/database::embedded-mscf-cabinet
      - id: metadata/binary/installer/sfx::cabinet-fdi-extraction
