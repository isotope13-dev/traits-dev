defaults:
  platforms: [windows, unix]
traits:
  - id: consonant-vowel-gibberish
    desc: Repeated consonant-vowel token
    crit: notable
    conf: 0.8
    for: [elf, macho, pe]
    count_min: 3
    downgrade:
      any:
        - id: well-known/lib/ui/videojs/
    if:
      # Match tokens present in the file, not garbage produced by speculative
      # XOR decoding of ordinary binary data.
      type: raw
      regex: (?i)\b[b-df-hj-np-tv-z]?([b-df-hj-np-tv-z][aeiou]){7,}[b-df-hj-np-tv-z]?\b
    not:
      - regex: \.
      - regex: '[A-Z]'
      - substr: InUseBefore
      - substr: InUseAfter
      - substr: Validate
      - substr: Enumerator
      - substr: Metadata
      - substr: MetaFile
      - substr: Remove
      - substr: Manager
      - substr: Parameter
      - substr: decodebin
      - regex: (?i)catalog
      - regex: (?i)isolatin
      - regex: (?i)\b(kitanakagusuku|casadelamoneda|yamatokoriyama)\b
      # libimobiledevice project/library names are long CVCV runs, not junk.
      - regex: (?i)\blibimobiledevice\b
      # PostScript/Adobe glyph naming convention (e.g. lamalefisolatedarabic,
      # seenmedialarabic). These appear in font tables and PDF rendering.
      - regex: (?i)(arabic|hebrew|cyrillic|cjk|katakana|hiragana|devanagari|thai)$
    unless:
      - id: metadata/package/quality/
      # Bundled icon catalogs store thousands of numeric SVG path coordinates
      # in JavaScript strings.  The CVCV matcher sees coordinate fragments as
      # gibberish even though the bundle has no string-obfuscation behavior.
      - id: metadata/file/format/markup::source-svg-icon-bundle
      # Extensionless fetched HTML can be heuristically typed as JavaScript;
      # its long localized/UI tokens are not obfuscated script.
      - id: metadata/file/profile/identity::static-html-shell
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
      # MathJax's generated glyph tables contain long CVCV tokens; they are
      # library data, not obfuscated strings.
      - id: metadata/package/quality/benign-context::generated-text-data-context

  - id: consonant-vowel-gibberish-source
    desc: Repeated consonant-vowel source token
    crit: notable
    conf: 0.8
    for: [scripts]
    count_min: 3
    downgrade:
      any:
        - id: well-known/lib/ui/videojs/
    if:
      type: text
      regex: (?i)\b[b-df-hj-np-tv-z]?([b-df-hj-np-tv-z][aeiou]){7,}[b-df-hj-np-tv-z]?\b
    not:
      - regex: \.
      - regex: '[A-Z]'
      - substr: InUseBefore
      - substr: InUseAfter
      - substr: Validate
      - substr: Enumerator
      - substr: Metadata
      - substr: MetaFile
      - substr: Remove
      - substr: Manager
      - substr: Parameter
      - substr: decodebin
      - regex: (?i)catalog
      - regex: (?i)isolatin
      - regex: (?i)\b(kitanakagusuku|casadelamoneda|yamatokoriyama)\b
      - regex: (?i)\blibimobiledevice\b
      - regex: (?i)(arabic|hebrew|cyrillic|cjk|katakana|hiragana|devanagari|thai)$
    unless:
      - id: metadata/package/quality/
      - id: metadata/file/format/markup::source-svg-icon-bundle
      - id: metadata/file/profile/identity::static-html-shell
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
      - id: metadata/package/quality/benign-context::generated-text-data-context
