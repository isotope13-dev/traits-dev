defaults:
  platforms:
  - windows
  for:
  - html
traits:
- id: nul-spliced-html-script-tag
  desc: NUL bytes interrupt ASCII HTML script tags
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |-
      rule nul_spliced_html_script_tag {
       strings:
        $a = /<SC\x00+RIP\x00*T|<SCRIP\x00+T/ nocase
       condition: $a
      }
