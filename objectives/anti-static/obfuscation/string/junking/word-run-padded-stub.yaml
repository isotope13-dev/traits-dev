# Some stubs bury their few real strings under thousands of bytes of random
# lowercase pseudo-words so string extraction and similarity hashes see
# noise. Prose in a PE is short and punctuated; a run of a hundred bare
# lowercase words is padding. By itself that is only evasion, so it takes a
# hidden-payload section and a debugger check to call the stub suspicious.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001
composite_rules:
  - id: word-padded-stub-with-hidden-reloc-payload
    desc: Word-padded stub with high-entropy reloc section
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/file/text-distribution::lowercase-word-run-padding
      - id: metadata/binary/section/entropy::reloc-entropy-at-least-6p8
      - id: micro-behaviors/process/debug/detect::is-debugger-present-string
