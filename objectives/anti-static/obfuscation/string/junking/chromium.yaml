# Ordinary Chromium binaries contain these strings in readable sections.
# Require three different markers inside sections with no memory access bits;
# this is suspicious stuffing evidence, not proof of a malicious payload.
defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: chromium-decoy-stuffing
  desc: Chromium markers in inaccessible PE sections
  crit: suspicious
  conf: 0.94
  if:
    type: yara
    source: |
      import "pe"
      rule chromium_strings_in_inaccessible_sections {
        strings:
          $chrome_url = "example-cmdline.test"
          $chrome_navigation = "ui_test_utils::NavigateToURL"
          $chrome_memory = "disabled-by-default-memory-infra"
          $chrome_autofill = "form action=\"https://www.example.com/\" method=\"POST\" id=\"shipping\""
          $chrome_proxy = "../chrome/chrome_proxy/chrome_proxy_main_win.cc"
          $chrome_launcher = "chrome_pwa_launcher.exe.pdb"
          $chrome_notification = "NotificationHelperMetrics"
        condition:
          pe.is_pe and pe.number_of_sections > 0 and
          for 3 of ($chrome*) : (
            for any j in (1..#) : (
              for any i in (0..pe.number_of_sections - 1) : (
                pe.sections[i].characteristics & 0xe0000000 == 0 and
                @[j] >= pe.sections[i].raw_data_offset and
                @[j] + ![j] <= pe.sections[i].raw_data_offset + pe.sections[i].raw_data_size
              )
            )
          )
      }
composite_rules:
- id: chromium-stuffed-decrypting-loader
  desc: Chromium decoy corpus conceals decrypting memory loader
  crit: hostile
  conf: 0.98
  attack: T1027.016,T1620
  all:
  - id: chromium-decoy-stuffing
  - id: objectives/anti-static/obfuscation/payload/memory::subtract-decrypted-tls-execution
- id: chromium-decoy-stuffed-backdoor
  desc: Chromium decoy sections conceal backdoor or C2 capability
  crit: hostile
  conf: 0.98
  attack: T1027.016,T1071
  all:
  - id: chromium-decoy-stuffing
  any:
  - id: objectives/command-and-control/channel/irc/bot::irc-backdoor-trojan
  - id: objectives/command-and-control/channel/irc/bot::irc-privmsg-copyfile-worm
  unless:
  - id: metadata/signed/platform/
