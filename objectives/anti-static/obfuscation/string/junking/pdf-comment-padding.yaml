defaults:
  platforms: [windows, macos, linux]
  for: [pdf]
composite_rules:
  - id: pdf-external-link-post-eof-hex-padding
    desc: PDF external link with massive post-EOF hex padding
    crit: suspicious
    conf: 0.97
    attack: T1027.001
    all:
      - id: metadata/document/pdf/structure::pdf-megabyte-after-eof
      - id: metadata/document/pdf/structure::pdf-thousands-hex-comment-lines
      - id: micro-behaviors/communications/http/url/navigation::pdf-external-http-navigation
