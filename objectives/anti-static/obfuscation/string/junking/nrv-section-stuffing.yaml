defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: nrv-loader-flagless-string-padding
    desc: NRV loader carries many flagless sections and excess strings
    crit: suspicious
    conf: 0.97
    attack: T1027.001
    scope: leaf
    all:
      - id: micro-behaviors/data/compression::x86-nrv-bitstream-decompressor
      - id: metadata/binary/section/permission::many-flagless-data-sections
      - id: metadata/binary/layout/strings::high-string-count-2000
