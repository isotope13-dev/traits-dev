defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: sandbox-execution-path-padding
    desc: Dominant PE overlay contains sandbox-path corpus
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/padding::many-user-profile-executable-paths
      - id: metadata/binary/layout/ratio::overlay-over-35pct
    any:
      - id: micro-behaviors/fs/path/padding::sandbox-paths
      - id: micro-behaviors/fs/path/padding::sandbox-analysis-artifact-path

  # The same corpus when the overlay is a smaller share of the file: both
  # sandbox path shapes plus many user-Desktop executables, beside a
  # non-certificate overlay. Co-occurrence; the rule does not bind the paths
  # to the overlay range.
  - id: sandbox-path-corpus-with-overlay
    desc: Sandbox path corpus beside a non-certificate overlay
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/padding::many-user-desktop-executable-paths
      - id: micro-behaviors/fs/path/padding::sandbox-paths
      - id: micro-behaviors/fs/path/padding::sandbox-analysis-artifact-path
      - id: metadata/binary/layout/size::noncertificate-unclaimed-bytes-512
    downgrade:
      any:
        - id: sandbox-execution-path-padding

  # A path corpus can be conspicuous even when the PE itself is large enough
  # that the appended data occupies less than a third of the file.
  - id: compact-sandbox-path-overlay
    desc: PE overlay padded with many unrelated executable and sandbox paths
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/layout/size::noncertificate-unclaimed-bytes-512
      - id: micro-behaviors/fs/path/padding::many-user-profile-executable-paths
      - id: micro-behaviors/fs/path/padding::sandbox-analysis-artifact-path
    unless:
      - id: metadata/signed/trust-level::signer-evidence-present

  # The corpus does not need a dominant (or large) overlay, and the strings
  # may be wide-char: several unrelated path families packed together --
  # user Temp/Downloads executables, hash-named drive roots, sandbox temp
  # names -- are drop-target ballast. Two independent path-family counts
  # co-occurring is the signal; one family alone is a build leak or a
  # collector list, so the threshold is needs: 3 of the four families.
  - id: sandbox-path-family-corpus
    desc: Multiple sandbox executable-path families co-occur
    crit: suspicious
    conf: 0.95
    needs: 3
    any:
      - id: micro-behaviors/fs/path/padding::many-user-temp-executable-paths
      - id: micro-behaviors/fs/path/padding::many-user-download-executable-paths
      - id: micro-behaviors/fs/path/padding::many-hash-named-root-paths
      - id: micro-behaviors/fs/path/padding::sandbox-paths


  # Recovered-UPX layout plus a bait path overlay matches an unpacked dump
  # and a crypter stub. The paths are UTF-16 in the unmapped overlay with no
  # file-read of that range, so layout plus padding does not establish
  # sandbox evasion and this stays suspicious. The stub's VBScript
  # class-factory lookup is an emulator gate, convicted separately in
  # objectives/anti-analysis/emulator-detect.
  - id: recovered-upx-sandbox-path-padding
    desc: Recovered or mimicked UPX image with sandbox path padding
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/label::recovered-upx-image-layout
      - id: compact-sandbox-path-overlay

  # Same crypter padding pattern when profile/analyse path counts are short
  # but hash-root and 64-hex Temp sandbox paths co-occur in the overlay.
  - id: recovered-upx-hash-sandbox-path-padding
    desc: Recovered UPX image with hash-root and sandbox temp padding
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/label::recovered-upx-image-layout
      - id: micro-behaviors/fs/path/padding::sandbox-paths
      - id: micro-behaviors/fs/path/padding::many-hash-named-root-paths
    unless:
      - id: recovered-upx-sandbox-path-padding
