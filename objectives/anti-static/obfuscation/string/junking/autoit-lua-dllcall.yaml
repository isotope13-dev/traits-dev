# An AutoIt script that strips a junk character from every native call name
# before DllCall and spells out Lua C API entry points hides a Lua loader: the
# script drives a sideloaded runtime DLL to run a separate Lua payload file.
# The junk character differs per build, so the Lua names are matched with up
# to three arbitrary characters between letters.
defaults:
  platforms: [windows]
  for: [text]
  size_max: 2000000
  attack: T1027,T1055.001

traits:
  - id: autoit-dllcall-helper-built-name
    desc: AutoIt DllCall name built by string helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'DllCall\(\$\w{1,140}\s*,\s*\w{1,40}\("[^"]{1,40}"\s*,\s*"[^"]{1,2}"\)'
  - id: autoit-junked-lua-newstate-name
    desc: AutoIt call name spells luaL_newstate with junk
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'l.{0,3}u.{0,3}a.{0,3}L.{0,3}_.{0,3}n.{0,3}e.{0,3}w.{0,3}s.{0,3}t.{0,3}a.{0,3}t.{0,3}e'
  - id: autoit-junked-lua-loadfile-name
    desc: AutoIt call name spells luaL_loadfile with junk
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'l.{0,3}u.{0,3}a.{0,3}L.{0,3}_.{0,3}l.{0,3}o.{0,3}a.{0,3}d.{0,3}f.{0,3}i.{0,3}l.{0,3}e'

composite_rules:
  - id: autoit-junk-obfuscated-lua-loader
    desc: AutoIt drives a Lua VM through junk-obfuscated DllCall names
    crit: hostile
    conf: 0.96
    near_bytes: 8192
    all:
      - id: autoit-dllcall-helper-built-name
      - id: autoit-junked-lua-newstate-name
      - id: autoit-junked-lua-loadfile-name
