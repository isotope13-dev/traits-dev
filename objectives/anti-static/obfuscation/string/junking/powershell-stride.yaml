defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1027
composite_rules:
  - id: strided-powershell-download-decoder
    desc: Strided decoder with concealed download commands
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/string/assembly::powershell-stride-two-character-assembly
      - id: metadata/lang/encoding/shape::interleaved-downloadfile-spelling
      - id: metadata/lang/encoding/shape::interleaved-frombase64string-spelling
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
