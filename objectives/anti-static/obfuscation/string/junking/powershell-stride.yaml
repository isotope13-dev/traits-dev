defaults:
  platforms:
  - windows
  for:
  - powershell
  - batch
  attack: T1027
composite_rules:
- id: strided-powershell-download-decoder
  desc: Strided decoder with concealed download commands
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/string/assembly::powershell-stride-two-character-assembly
  - id: metadata/lang/encoding/shape/fragment::interleaved-downloadfile-spelling
  - id: metadata/lang/encoding/shape/fragment::interleaved-frombase64string-spelling
  - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
- id: powershell-stepped-indirect-character-dispatch
  desc: Stepped loop uses indirect member invocation
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/lang/source/syntax/control-flow::powershell-text-stepped-loop-head
  - id: metadata/lang/source/syntax/control-flow::powershell-text-indirect-substring-invoke
  for:
  - vbs
  - powershell
- id: powershell-junk-padded-stride-decoder
  desc: Junk-padded stride decoder unpacks many strings
  crit: hostile
  conf: 0.95
  attack: T1027,T1059.001
  all:
  - id: objectives/anti-static/obfuscation/string/index-select::ps-strided-character-reconstruction
  - id: micro-behaviors/data/string/assembly::powershell-stride-loop-junk-cmdlet
  - id: micro-behaviors/data/string/assembly::powershell-function-decodes-many-literals
