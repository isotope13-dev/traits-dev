# Path co-occurrence supports concealed ballast, not sandbox detection.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: fragment-loader-sandbox-path-corpus
    desc: Concealed fragment loader with sandbox path corpus
    crit: suspicious
    conf: 0.95
    attack: T1027.009
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::fragment-loader-export-backscan
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/fs/path/padding::many-hash-named-root-paths
      - id: micro-behaviors/fs/path/padding::sandbox-paths
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/tool/reverse-engineering/
