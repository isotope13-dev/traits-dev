# Path co-occurrence supports concealed ballast, not sandbox detection.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: fragment-loader-hash-path-corpus
    desc: Concealed fragment loader with hash-named path corpus
    crit: suspicious
    conf: 0.95
    attack: T1027.009
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::fragment-loader-export-backscan
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/fs/path/padding::many-hash-named-root-paths
      - id: micro-behaviors/fs/path/padding::sandbox-paths

  - id: fragment-loader-sandbox-path-crypter
    desc: Fragment loader crypter with sandbox path padding
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1497.001
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::fragment-loader-export-backscan
      - id: objectives/anti-static/obfuscation/string/junking::sandbox-path-overlay-padding
      - id: metadata/signature/absent::unsigned-missing-signature-record
