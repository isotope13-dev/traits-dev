defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

traits:
  - id: vbs-fragmented-frombase64string
    desc: VBScript rebuilds fragmented Base64 decode API
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    if:
      type: text
      # Recovers `FromBase64String` split across adjacent assignment-appends,
      # with arbitrary alphabetic junk tokens removed later by Replace calls.
      regex: '(?is):Fr\w{3,24}"[\s\S]{0,160}"m\w{3,24}"[\s\S]{0,200}64\w{3,24}tring'

  # Token-substitution loaders rebuild syntax by mapping several long junk
  # words to individual characters immediately before execution. Requiring a
  # chain avoids treating an ordinary one-off Replace call as obfuscation.
  - id: vbs-long-token-character-substitution-chain
    desc: VBScript maps long tokens to characters
    crit: suspicious
    conf: 0.97
    count_min: 4
    if:
      type: text
      regex: '(?i)Replace\(\s*\w+\s*,\s*"[A-Za-z]{5,}"\s*,\s*"[A-Za-z]"\s*\)'
