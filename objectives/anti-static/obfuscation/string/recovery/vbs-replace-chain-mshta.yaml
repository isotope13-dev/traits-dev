# A ProgID hidden behind a chain of nested Replace calls is instantiated and
# used to launch mshta on a remote URL: the string recovery exists to keep
# the shell object and its proxy-execution call out of plain text.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1218.005

composite_rules:
  - id: vbs-replace-chain-object-launches-remote-mshta
    desc: Replace-hidden object launches remote MSHTA
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/string/replace::vbs-createobject-nested-replace-progid
      - id: metadata/lang/source/syntax/command/launch::mshta-remote-url-command
