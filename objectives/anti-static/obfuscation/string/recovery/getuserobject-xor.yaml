defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: xor-getuserobject-text-burst
    desc: Repeated XOR-encoded GetUserObject references
    crit: notable
    conf: 0.96
    count_min: 6
    if:
      type: encoded
      encoding: xor
      substr: GetUserObjec
      section: rdata
    unless:
      - type: text
        substr: GetUserObjectInfoBoa
