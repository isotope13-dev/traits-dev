# Numbered PHP fragments joined back together after a short glue marker
# (`_)ht`, `_)hc`, `_)hl`) is stripped. The marker is inserted so no token
# survives inside one literal; the rebuild is the str_replace plus the long
# `$x957.$x519...` concatenation.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9
traits:
  - id: php-glue-marker-strip
    desc: Strips a short glue marker
    if:
      type: text
      regex: 'str_replace\(\s*[''"]_\)[a-z]{1,3}[''"]'
  - id: php-numbered-fragment-concat
    desc: Joins numbered fragment variables
    if:
      type: text
      regex: '\$[a-z]{1,3}[0-9]{2,4}(\.\$[a-z]{1,3}[0-9]{2,4}){8,}'

composite_rules:
  - id: php-glue-stripped-fragment-rebuild
    desc: Rebuilds code from glue fragments
    crit: hostile
    conf: 0.97
    attack: T1027
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::numbered-fragment-variable-set
      - id: php-glue-marker-strip
      - id: php-numbered-fragment-concat
