# Managed string-table obfuscation used by the Thanos/SmartAssembly lineage.
# Constants are intentionally absent: variants change the XOR value, offset,
# resource name, and AES material while retaining the decode pipeline.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1027

traits:
  - id: managed-string-resource-header-source
    desc: Managed {z} resource header
    crit: notable
    conf: 0.96
    for: [csharp]
    if:
      type: text
      regex: '(?i)\[\s*0\s*\].{0,120}0x7B.{0,120}\[\s*1\s*\].{0,120}0x7A.{0,120}\[\s*2\s*\].{0,120}0x7D'

  # Four bytes. That is short enough to occur by chance in any large resource
  # blob — a multi-megabyte filler or media resource turns it up regularly — so
  # it carries no meaning on its own and is only read through the composite
  # below, which requires the managed runtime this header belongs to.
  - id: managed-string-resource-header-bytes
    desc: "{z} resource-header byte sequence in .rsrc"
    crit: component
    conf: 0.96
    for: [pe, dll]
    if:
      type: hex
      section: .rsrc
      pattern: '7B 7A 7D (00|01|03)'

  - id: managed-string-il-load-constant
    desc: IL loads a string-table constant
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bOpCodes\.Ldc_I4\b'

  - id: managed-string-il-subtract
    desc: IL subtracts a string-table index
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bOpCodes\.Sub\b'

  - id: managed-string-il-call
    desc: IL calls a string decoder
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bOpCodes\.Call\b'

composite_rules:
  - id: managed-string-resource-access
    desc: Managed embedded string resource access
    crit: notable
    conf: 0.91
    any:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-source-manifest-resource-stream-call
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access

  # The header only means anything inside a managed image; requiring the .NET
  # assembly marker keeps chance byte hits in native carriers out.
  - id: managed-string-resource-header-binary
    desc: Managed assembly embeds the {z} string-resource header
    crit: notable
    conf: 0.96
    for: [pe, dll]
    all:
      - id: managed-string-resource-header-bytes
      - id: metadata/binary/framework::dotnet-assembly

  - id: managed-string-resource-header
    desc: Managed {z} resource header
    crit: notable
    conf: 0.96
    any:
      - id: managed-string-resource-header-source
      - id: managed-string-resource-header-binary

  - id: managed-string-index-xor-offset
    desc: XOR-plus-offset string index
    # Compound assignments are ordinary syntax. They become decoder evidence
    # only when the hostile rule also sees the resource and prefix layers.
    crit: component
    conf: 0.91
    near_bytes: 256
    all:
      - id: micro-behaviors/data/source/syntax/operator::compound-xor-assignment
      - id: micro-behaviors/data/source/syntax/operator::compound-subtract-assignment

  - id: managed-string-length-prefix-decoder
    desc: Variable-length string prefix decoder
    crit: suspicious
    conf: 0.93
    near_bytes: 512
    all:
      - id: micro-behaviors/data/source/arithmetic::csharp-high-bit-mask-0x80
      - id: micro-behaviors/data/source/arithmetic::csharp-continuation-bit-mask
      - id: micro-behaviors/data/source/arithmetic::csharp-byte-width-left-shift

  - id: managed-string-il-token-dispatch
    desc: Metadata-token IL string dispatch
    crit: suspicious
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::dynamic-method-api-token
      - id: metadata/lang/compiler/managed::il-generator-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::metadata-token
      - id: managed-string-il-load-constant
      - id: managed-string-il-subtract
      - id: managed-string-il-call

  - id: managed-resource-aes-string-layer
    desc: AES/Base64 managed string resource layer
    crit: suspicious
    conf: 0.97
    attack: T1027,T1140
    all:
      - id: managed-string-resource-access
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/crypto/symmetric/decrypt::transform-final-block
      - id: managed-string-resource-header
    any:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string

  - id: managed-obfuscated-string-resource-decoder
    desc: Layered managed string decoder
    crit: hostile
    conf: 0.97
    attack: T1027,T1140
    mbc: B0032
    all:
      - id: managed-resource-aes-string-layer
      - id: managed-string-index-xor-offset
      - id: managed-string-length-prefix-decoder

  - id: managed-obfuscated-string-delegate-dispatch
    desc: Managed IL delegate string dispatch
    crit: hostile
    conf: 0.98
    attack: T1027,T1620
    mbc: B0032
    all:
      - id: managed-resource-aes-string-layer
      - id: managed-string-il-token-dispatch
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-delegate
