defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-fragmented-mshta-run-profile
    desc: Fragmented mshta text near WSH Run
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/process/create/script/wsh::wscript-run-variable
      - id: objectives/anti-static/obfuscation/string/fragmentation::fragmented-mshta-exe
    any:
      - id: micro-behaviors/data/string/concat::split-trycloudflare-host-fragment
      - id: micro-behaviors/data/string/concat::split-epub-word-fragment
