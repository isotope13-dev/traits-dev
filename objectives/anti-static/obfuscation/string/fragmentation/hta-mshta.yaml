defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-fragmented-mshta-run-profile
    desc: Fragmented mshta text near WSH Run
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: metadata/lang/source/syntax/call/member::run-causehrk-text
      - id: objectives/anti-static/obfuscation/string/fragmentation::fragmented-mshta-exe
    any:
      - id: well-known/dual-use/tunnel/cloudflared::split-trycloudflare-host-fragment
      - id: micro-behaviors/data/string/concat/expression::split-epub-word-fragment
