# Per-character literal concatenation: an identifier or command is split into
# one-character string literals and glued back together with `+`, so a
# substring scan for the assembled word ("eval", "child_process", a domain)
# finds nothing. The same source shape appears in Python and JavaScript, so
# one trait covers both.
#
# A single `'a' + 'b'` pair is ordinary code and shows up in test vectors,
# doc examples and generated bundles, so the matcher requires a chain of at
# least three adjacent one-character literals — the shortest form that is
# already deliberate — and the count/density floors keep one stray chain in a
# large file from firing.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript]
  attack: T1027
  mbc: B0032
  crit: suspicious
  conf: 0.9
traits:
  - id: dense-single-char-concat
    desc: Dense single-character concatenation
    crit: notable
    count_min: 2
    per_kb_min: 0.5
    if:
      type: text
      # Path construction such as '/' + '/'.join(...) is ordinary URL logic;
      # do not treat slash separators as encoded character fragments.
      regex: '["''][\w\\.-]["'']\s*\+\s*["''][\w\\.-]["'']\s*\+\s*["''][\w\\.-]["'']'
