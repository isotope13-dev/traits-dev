defaults:
  platforms: [windows]
traits:
- id: nuget-flatcontainer-fragment
  desc: Fragmented NuGet flatcontainer path
  crit: notable
  conf: 0.93
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?i)v3-fl.{0,16}at.{0,16}co.{0,24}(nta|#E-f#Enta)
  not:
  - regex: '(?i)^v3-flatconta$'
