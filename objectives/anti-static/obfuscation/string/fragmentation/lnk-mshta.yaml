defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-mshta-adjacent-token-assignments
    desc: LNK assigns adjacent msh and ta fragments
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[&" ])set \w{1,32}=msh&&set \w{1,32}=ta&&start ""'

  # The byte-level rule validates both delayed-expansion variable names.
  # Requires engine support for atomic inline YARA on LNK files.
  - id: lnk-mshta-split-token-assignments
    desc: LNK reconstructs remote mshta from two variables
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule lnk_split_mshta_remote {
          strings:
            $msh = /set [A-Za-z_][A-Za-z0-9_]{0,31}=msh/ wide nocase
            $ta = /set [A-Za-z_][A-Za-z0-9_]{0,31}=ta/ wide nocase
            $start = /start "" ![A-Za-z_][A-Za-z0-9_]{0,31}!![A-Za-z_][A-Za-z0-9_]{0,31}! https:\/\// wide nocase
          condition:
            // Match contiguous assignments and compare both variable names
            // with their delayed-expansion uses. Unrelated SETs or undefined
            // variables cannot establish remote MSHTA activation.
            for any m in (1..#msh) : (
              for any t in (1..#ta) : (
                @ta[t] == @msh[m] + !msh[m] + 4 and
                uint16(@ta[t] - 4) == 0x26 and
                uint16(@ta[t] - 2) == 0x26 and
                for any s in (1..#start) : (
                  @start[s] == @ta[t] + !ta[t] + 4 and
                  uint16(@start[s] - 4) == 0x26 and
                  uint16(@start[s] - 2) == 0x26 and
                  !start[s] == 44 + (!msh[m] - 16) + (!ta[t] - 14) and
                  for all i in (0..(((!msh[m] - 16) >> 1) - 1)) : (
                    (uint16(@msh[m] + 8 + i * 2) | 0x20) ==
                    (uint16(@start[s] + 20 + i * 2) | 0x20)
                  ) and
                  for all i in (0..(((!ta[t] - 14) >> 1) - 1)) : (
                    (uint16(@ta[t] + 8 + i * 2) | 0x20) ==
                    (uint16(@start[s] + 24 + !msh[m] - 16 + i * 2) | 0x20)
                  )
                )
              )
            )
        }
