defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-mshta-adjacent-token-assignments
    desc: LNK assigns adjacent msh and ta fragments
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[&" ])set \w{1,32}=msh&&set \w{1,32}=ta&&start ""'
    not:
      - regex: '(?i)start\s+""\s+!other!!unknown!'

composite_rules:
  - id: lnk-mshta-split-token-assignments
    desc: LNK reconstructs remote mshta from two variables
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-mshta-adjacent-token-assignments
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-cmd-env-split-start-https
