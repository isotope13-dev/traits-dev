defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-mshta-adjacent-token-assignments
    desc: LNK assigns adjacent msh and ta fragments
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[&" ])set \w{1,32}=msh&&set \w{1,32}=ta&&start ""'
    not:
      - regex: '(?i)start\s+""\s+!other!!unknown!'

    unless:
      - type: value
        path: lnk.arguments
        regex: '(?i)\shttps://example\.(org|com|net)/[^&\s"]*"?$'

composite_rules:
  - id: lnk-mshta-split-token-assignments
    desc: Split msh/ta assignments with variable launch
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-mshta-adjacent-token-assignments
      - id: micro-behaviors/process/create/shell/command-string::lnk-start-adjacent-env-vars-https
