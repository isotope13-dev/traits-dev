defaults:
  platforms: [windows]

composite_rules:
  - id: javascript-activex-msiexec-fragment-profile
    desc: Fragmented ActiveX and msiexec launch clues
    crit: suspicious
    conf: 0.99
    attack: T1027
    for: [javascript]
    all:
      - id: micro-behaviors/os/com/automation::activex-concatenated-progid
      - id: micro-behaviors/process/create/installer::js-split-msiexec-literal
    any:
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-boolean-arguments
      - id: micro-behaviors/process/create/shellexec::shellexecute-hidden-showcmd
