defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: math-random-fragment
    desc: Math.random string fragment in string literal
    unless:
      - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
    if:
      type: string_literal
      regex: '^(Math\.ran|ath\.rando|Random\.)$'
