# This profile requires an actually split URL scheme. A nearby variable
# GetObject call adds context, not a proven reconstructed-URL handoff.
defaults:
  platforms: [windows]
  for: [vbs, batch, javascript, html]
  attack: T1027

composite_rules:
  - id: wsh-getobject-split-scheme-profile
    desc: GetObject variable and split URL-scheme clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/source/syntax/call/invocation::getobject-variable-call-text
    any:
      - id: micro-behaviors/communications/url/construction/fragment::split-scheme-separator-fragment
      - id: objectives/anti-static/obfuscation/string/fragmentation::split-moniker-scheme-seam
