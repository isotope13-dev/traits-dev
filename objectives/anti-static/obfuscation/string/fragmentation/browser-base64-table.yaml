defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: suspicious
  conf: 0.94
traits:
  - id: indexed-fragment-base64-decode
    desc: Base64 decode of indexed string fragments
    if:
      type: text
      exclude_html_comments: true
      regex: '\batob\s*\(\s*[\w$]+\[\d+\](\s*\+\s*[\w$]+\[\d+\]){7,}'
