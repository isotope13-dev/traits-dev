# A macro auto-open, fragmented method dispatch, response-body reference and
# environment access co-occur. The matcher does not link the response body to
# a written file or an activation sink.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vba-fragmented-http-dispatch-profile
    desc: Macro with split HTTP method dispatch
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: micro-behaviors/os/com/automation::vba-callbyname-split-method
      - id: micro-behaviors/communications/http/client/response-body::vbs-split-responsebody-reference
      - id: micro-behaviors/os/env/read::wsh-vbs-environment-method

  # The same macro with the payload write bound in: the fetched response is
  # written into a binary ADODB stream whose SaveToFile is also dispatched
  # through a split method name. Every step of fetch-and-drop is hidden from
  # string signatures; no benign document macro conceals its own download.
  - id: vba-fragmented-dispatch-http-stager
    desc: Macro hides HTTP download-to-disk behind split dispatch
    crit: hostile
    conf: 0.96
    attack: T1027,T1105,T1059.005
    all:
      - id: vba-fragmented-http-dispatch-profile
      - id: micro-behaviors/fs/write/stream::vbs-split-savetofile-observed
      - id: micro-behaviors/fs/write/stream::adodb-type-binary-assignment
