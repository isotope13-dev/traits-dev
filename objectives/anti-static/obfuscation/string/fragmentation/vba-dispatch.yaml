# A macro auto-open, fragmented method dispatch, response-body reference and
# environment access co-occur. The matcher does not link the response body to
# a written file or an activation sink.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vba-fragmented-http-dispatch-profile
    desc: Macro with split HTTP method dispatch
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: micro-behaviors/os/com/automation::vba-callbyname-split-method
      - id: micro-behaviors/communications/http/client/response-body::vbs-split-responsebody-reference
      - id: micro-behaviors/os/env/read::wsh-vbs-environment-method
