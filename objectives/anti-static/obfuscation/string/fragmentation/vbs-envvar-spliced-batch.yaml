defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

traits:
  - id: vbs-envvar-spliced-echo
    desc: VBScript embeds environment-spliced echo text
    crit: suspicious
    conf: 0.96
    attack: T1027,T1059.003
    if:
      type: text
      regex: '(?i)"%[A-Za-z]{2,8}%@%[A-Za-z]{2,8}%e%[A-Za-z]{2,8}%c%[A-Za-z]{2,8}%h%[A-Za-z]{2,8}%o'
  - id: vbs-envvar-base64-assignment-fragments
    desc: VBScript indirect environment assignment text
    crit: suspicious
    conf: 0.96
    count_min: 16
    attack: T1027,T1059.003
    if:
      type: text
      regex: '(?i)"![A-Za-z]{3,10}!\s+""%[A-Za-z0-9%]{6,32}=[A-Za-z0-9+/]{16,28}"""'
