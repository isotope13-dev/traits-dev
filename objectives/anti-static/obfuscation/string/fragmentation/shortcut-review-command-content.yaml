defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]

composite_rules:
- id: lnk-fragmented-command-url-option
  desc: LNK fragmented text, URL and command clues
  crit: suspicious
  conf: 0.95
  all:
  - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-empty-string-obfuscation
  - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
  any:
  - id: micro-behaviors/os/autorun/scheduled::kv-schtasks-reference
  - id: micro-behaviors/process/argument/file::kv-outfile-option
