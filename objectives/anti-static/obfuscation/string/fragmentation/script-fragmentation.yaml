defaults:
  platforms: [unix, windows]
traits:
  - id: batch-extreme-line-bloat
    desc: Batch extreme line-length bloat
    crit: suspicious
    conf: 0.95
    for: [batch]
    # A single giant line distorts the file-wide average; a shell token does not.
    unless:
      - id: metadata/file/line::batch-line-over-100000
      - id: metadata/file/extension/identity::json-txt-md-basename
    if:
      type: metrics
      field: text.avg_line_length
      min: 300
      min_size: 65536

  - id: batch-long-line-saturation
    desc: Batch saturated with long lines
    crit: notable
    conf: 0.96
    for: [batch]
    unless:
      - id: metadata/file/string/application-name::microsoft-activation-script-benign-context
      - id: metadata/file/extension/identity::json-txt-md-basename
    if:
      type: metrics
      field: text.lines_over_200
      min: 80
      min_size: 65536

  - id: batch-low-whitespace-density
    desc: Batch unusually low whitespace density
    crit: suspicious
    conf: 0.9
    for: [batch]
    unless:
      - id: metadata/file/string/identity/
      - id: metadata/file/extension/identity::json-txt-md-basename
    if:
      type: metrics
      field: text.whitespace_ratio
      max: 0.03
      min_size: 65536

  - id: batch-long-token-saturation
    desc: Batch saturated with long tokens
    crit: notable
    conf: 0.92
    for: [batch]
    unless:
      - id: metadata/file/string/application-name::microsoft-activation-script-benign-context
      - id: metadata/file/extension/identity::json-txt-md-basename
    if:
      type: metrics
      field: text.long_token_count
      min: 120
      min_size: 65536

  - id: batch-delayed-substring-slicing
    desc: Batch delayed substring reconstruction
    crit: suspicious
    conf: 0.94
    for: [batch]
    count_min: 10
    if:
      type: text
      regex: '![A-Za-z0-9_]{6,}:~[0-9]+,[0-9]+!'
    unless:
      - id: well-known/tool/development/cli/batch-scripts::uup-converter-wimlib-batch

  - id: lnk-cmd-delayed-substring-slicing
    desc: LNK reconstructs token from variable slices
    crit: suspicious
    conf: 0.98
    attack: T1027
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(![A-Za-z0-9_]{2,}:~[0-9]+,[0-9]+!){3,}'

  - id: lnk-delimited-https-value
    desc: LNK fragments HTTPS scheme with delimiters
    crit: notable
    conf: 0.96
    attack: T1027
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: 'htt[^A-Za-z0-9]{1,2}p[^A-Za-z0-9]{1,2}s[^A-Za-z0-9]{1,2}://'

  - id: lnk-cmd-character-removal-expansion
    desc: LNK removes character from variable value
    crit: notable
    conf: 0.94
    attack: T1027
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '![A-Za-z0-9_]{2,}:[^=!]{1,3}=!'

  - id: batch-percent-substring-slicing
    desc: Batch percent substring reconstruction
    crit: suspicious
    conf: 0.94
    for: [batch]
    count_min: 20
    if:
      type: text
      regex: '%[A-Za-z0-9_]{6,}:~[0-9]+,[0-9]+%'

  - id: batch-raw-percent-slice-fragments
    desc: Batch raw percent slice reconstruction fragments
    crit: suspicious
    conf: 0.94
    for: [batch]
    count_min: 20
    if:
      type: text
      regex: ':~[0-9]{1,3},1%%[A-Za-z0-9_]{2,12}%'
    unless:
      - id: well-known/tool/development/cli/batch-scripts::uup-converter-wimlib-batch

  - id: batch-comcom-obfuscator-preamble
    desc: Batch COMCOM obfuscator preamble
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?s)\ACOMCOM.{0,80}&@cls&@set\s+"[_A-Za-z0-9]'

  - id: batch-certreq-embedded-blob
    desc: Batch certificate-request embedded payload blob
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      substr: '-----BEGIN NEW CERTIFICATE REQUEST-----'

  - id: batch-nonascii-padding
    desc: Batch non-ASCII padding
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.5
      min_size: 4096

  - id: batch-many-long-lines
    desc: Batch many long lines
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: metrics
      field: text.lines_over_200
      min: 50
      min_size: 4096

  - id: batch-rundll32-fragments
    desc: Batch reconstructs rundll32
    crit: suspicious
    conf: 0.92
    for: [batch]
    if:
      type: text
      regex: '(?is)set\s+[A-Za-z]{18,}=ru.{0,160}=nd.{0,160}=ll.{0,160}=32'

  - id: batch-dat-init-rundll-target
    desc: Batch calls DAT init export
    crit: suspicious
    conf: 0.92
    for: [batch]
    if:
      type: text
      regex: '(?i)\.DAT,init\b'

  - id: batch-colon-padding-lines
    desc: Batch colon padding lines
    crit: notable
    conf: 0.82
    for: [batch]
    count_min: 8
    if:
      type: text
      regex: '(?m)^:{80,}\r?$'

  - id: vbs-uppercase-alphabet-loop
    desc: VBScript builds an uppercase alphabet
    crit: suspicious
    conf: 0.94
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bFor\s+\w+\s*=\s*65\s+To\s+90\b'

  - id: vbs-lowercase-alphabet-loop
    desc: VBScript builds a lowercase alphabet
    crit: suspicious
    conf: 0.94
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bFor\s+\w+\s*=\s*97\s+To\s+122\b'

  # The delimiter-search + slice half of a custom-alphabet decoder is the plain
  # VBScript `InStr(...) / Mid(...)` idiom, so it lives as a neutral string
  # capability in micro-behaviors/data/string/search; the alphabet evidence is
  # supplied by the character-range loops above.
  - id: vbs-xor-character-code--right
    desc: VBScript XORs a character-code slice
    crit: suspicious
    conf: 0.94
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bXor\b[^\r\n]{0,80}\b(Asc|ChrW?|Mid)\s*\('


composite_rules:
  - id: vbs-line-bloated-char-code-reconstruction
    desc: Long VBScript lines densely reconstruct characters
    crit: suspicious
    conf: 0.94
    attack: T1027
    for: [vbs]
    scope: file
    all:
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction

  - id: lnk-delimiter-stripped-https
    desc: LNK removes delimiters from concealed HTTPS URL
    crit: suspicious
    conf: 0.98
    attack: T1027
    for: [lnk]
    all:
      - id: lnk-delimited-https-value
      - id: lnk-cmd-character-removal-expansion

  - id: vbs-repeated-xor-obfuscation
    desc: Repeated VBScript XOR obfuscation
    crit: suspicious
    conf: 0.94
    for: [vbs]
    any:
      - id: micro-behaviors/data/decode/xor::vbs-xor-character-code
      - id: vbs-xor-character-code--right

  - id: vbs-custom-alphabet-executeglobal-loader
    desc: VBScript custom-alphabet decoder feeds ExecuteGlobal
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005
    all:
      - id: vbs-uppercase-alphabet-loop
      - id: vbs-lowercase-alphabet-loop
      - id: micro-behaviors/data/string/search::instr-offset-substring-slice
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-executeglobal

  - id: vbs-bloated-executeglobal-loader
    desc: VBScript long-token obfuscation feeds ExecuteGlobal
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005
    all:
      - id: metadata/file/line::vbs-many-long-lines
      - id: "metadata/file/profile/token-population::vbs-many-long-tokens"
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-executeglobal

  - id: powershell-obfuscated-byte-loader
    desc: PowerShell obfuscated byte-array loader
    crit: hostile
    conf: 0.99
    for: [powershell]
    all:
      - id: metadata/file/line::powershell-long-line-count
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-key-loop
      - id: objectives/anti-static/obfuscation/string/reconstruct::single-char-concat-pattern

  - id: batch-fragmentation-metrics
    desc: Batch fragmentation and junk-padding profile
    crit: suspicious
    conf: 0.97
    for: [batch]
    needs: 3
    any:
      - id: batch-extreme-line-bloat
      - id: batch-long-line-saturation
      - id: batch-low-whitespace-density
      - id: batch-long-token-saturation
      - id: batch-colon-padding-lines

  - id: batch-cjk-long-token-obfuscation
    desc: Batch CJK long-token obfuscation
    crit: suspicious
    conf: 0.96
    for: [batch]
    all:
      - id: metadata/file/line::batch-has-long-token
      - id: metadata/lang/natural::script-han
    any:
      - id: metadata/file/line::single-long-line
      - id: objectives/evasion/masquerade/interpreter::mislabeled-single-line-source
    needs: 1
    unless:
      # A leading UTF-16 BOM can make an otherwise ASCII batch file decode as
      # Han glyphs. That encoding mismatch is not CJK-token obfuscation.
      - id: metadata/file/magic/identity::utf16-le-bom
      - id: micro-behaviors/os/security/defender::batch-defender-exclusion-false-bom
      - id: metadata/file/extension/identity::json-txt-md-basename
      - id: metadata/file/naming::test-directory-component

  - id: batch-fragmented-rundll32-dat-loader
    desc: Batch fragmented rundll32 DAT loader
    crit: suspicious
    conf: 0.96
    for: [batch]
    all:
      - id: batch-rundll32-fragments
      - id: batch-dat-init-rundll-target

  - id: batch-substring-embedded-payload-obfuscation
    desc: Batch substring-obfuscated embedded payload
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: batch-raw-percent-slice-fragments
      - id: batch-certreq-embedded-blob
    any:
      - id: batch-comcom-obfuscator-preamble
      - id: metadata/file/format/conformance::large-batch-parse-failure
    needs: 1

  - id: batch-multiscript-long-token-obfuscation
    desc: Batch multiscript token obfuscation
    crit: suspicious
    conf: 0.94
    for: [batch]
    all:
      - id: batch-cjk-long-token-obfuscation
      - id: metadata/lang/natural::lang-korean

  - id: batch-appended-line-identifier-obfuscation
    desc: Batch appended-line identifier obfuscation
    crit: suspicious
    conf: 0.95
    for: [batch]
    all:
      - id: "metadata/file/profile/identifier-population::mean-identifier-entropy-at-least-3"
      - id: objectives/anti-static/obfuscation/code-metrics/structure::appended-long-line

  - id: batch-nonascii-command-padding
    desc: Batch non-ASCII command padding
    crit: suspicious
    conf: 0.95
    for: [batch]
    all:
      - id: batch-nonascii-padding
      - id: batch-many-long-lines
      - id: metadata/file/format/conformance::parse-error
    unless:
      - id: metadata/file/extension/identity::json-txt-md-basename

  - id: batch-mismatched-tiny-stager
    desc: Batch mismatched tiny stager
    crit: suspicious
    conf: 0.92
    for: [batch]
    all:
      - id: metadata/file/extension/mismatch::batch-content-extension-mismatch
      - id: metadata/file/size::tiny-text-script
      - id: micro-behaviors/fs/path/drive-root::hardcoded-windows-root
      - id: micro-behaviors/communications/http/url/domain::powershell-http-url-reference
    any:
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
      - id: micro-behaviors/time/sleep/interval::batch-timeout-delay
    needs: 1

  - id: batch-cjk-percent-slice-command-reconstruction
    desc: CJK-noise batch command reconstruction
    crit: hostile
    conf: 0.97
    attack: T1027
    for: [batch]
    all:
      - id: batch-cjk-long-token-obfuscation
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-dense-percent-slice-operator
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-rouki-obfuscator-marker

  - id: batch-cjk-obfuscator-loader
    desc: CJK-noise obfuscator loader
    crit: hostile
    conf: 0.97
    attack: T1027
    for: [batch]
    all:
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-dense-percent-slice-operator
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-rouki-obfuscator-marker
      - id: metadata/lang/natural::lang-japanese

  # A batch script assembled character by character out of a scrambled
  # alphabet, on one line, with the whitespace taken out.
  #
  #     set v=CLbR7}xwgTI"m61MkX.[jHvK=AEn8JpND;iW UScfo:/2a4?03(hqBzQVZr)d'...
  #     set c=%v:~34,1%%v:~63,1%%v:~6,1%%v:~50,1%%v:~11,1%...
  #
  # Every leg is a measurement rather than a signature, which is what makes it
  # outlast the generator: the alphabet is different in every build and so is
  # the variable name, but a program written this way is always dense slices
  # of a lookup string on a line thousands of characters long. Nobody
  # maintains batch like this -- the form exists so that nothing in the file
  # is a string anything can read.
  - id: batch-character-table-reconstructed-script
    desc: Batch body rebuilt from a character table
    crit: hostile
    conf: 0.96
    for: [batch]
    platforms: [windows]
    attack: T1027,T1059.003
    all:
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-dense-percent-slice-operator
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::batch-shortvar-percent-substring-slicing
      - id: metadata/file/padding::batch-near-zero-whitespace
      - id: metadata/file/line::last-line-over-1000
