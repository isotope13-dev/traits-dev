defaults:
  platforms: [windows]
  for: [lnk]

traits:
  # Two short cmd variable assignments in one argument string, each ending
  # in &&. The filler between them is separated by ||, so the gap is bounded
  # and may hold other tokens. Each assignment holds one fragment of a
  # command that is rebuilt later with delayed expansion.
  - id: lnk-cmd-set-variable-chain
    desc: LNK assigns short cmd variables in sequence
    crit: notable
    conf: 0.95
    attack: T1027
    if:
      type: value
      path: lnk.arguments
      regex: 'set [A-Za-z0-9]{1,4}=[^&|]{1,40}&&.{1,600}set [A-Za-z0-9]{1,4}=[^&|]{1,40}&&'

  # A variable assigned a piece of a URL scheme, with caret escapes such as
  # `^ht` or `p^s:/`. Assembled, these form http:// or https:// at run time.
  - id: lnk-cmd-url-scheme-fragment
    desc: LNK sets cmd variable to scheme piece
    crit: suspicious
    conf: 0.9
    attack: T1027
    if:
      type: value
      path: lnk.arguments
      regex: 'set [A-Za-z0-9]{1,4}=(\^?ht|tp|p\^?s:/)'

  # The ftp command rebuilt from delayed-expansion variables and handed a
  # script file with -s:. ftp -s runs the commands stored in that file.
  - id: lnk-cmd-ftp-delayed-script
    desc: LNK runs ftp script via delayed variables
    crit: suspicious
    conf: 0.9
    attack: T1105
    if:
      type: value
      path: lnk.arguments
      regex: '\bf![A-Za-z0-9]{1,3}! ![A-Za-z0-9]{1,3}!:![A-Za-z0-9]{1,3}!'
