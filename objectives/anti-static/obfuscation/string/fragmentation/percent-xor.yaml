defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: suspicious
  conf: 0.96
composite_rules:
  - id: fragmented-percent-xor-content
    desc: Fragmented percent strings accompany keyed XOR
    all:
      - id: micro-behaviors/data/string/assembly::percent-byte-string-fragment-appends
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
