defaults:
  platforms: [windows]
  attack: T1027
  for: [lnk]

traits:
- id: lnk-empty-string-obfuscation
  desc: LNK uses empty-string command splitting
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: lnk.arguments
    regex: "[a-z]''[a-z]"
- id: lnk-powershell-backtick-obfuscation
  desc: LNK PowerShell uses backtick word obfuscation
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: '[A-Za-z]`[A-Za-z]`?[A-Za-z]'
