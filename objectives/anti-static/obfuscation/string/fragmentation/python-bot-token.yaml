defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: split-telegram-token-assignment
    desc: Splits Telegram credential around colon
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      kind: assignment
      regex: '["''][0-9]{8,12}["'']\s*\+\s*["'']:["'']\s*\+\s*["''][A-Za-z0-9_-]{30,40}'
