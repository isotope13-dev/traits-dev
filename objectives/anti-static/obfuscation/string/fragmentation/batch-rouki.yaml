# Rouki-obfuscated batch. The obfuscator labels its output `:Rouki-OBFUSCATOR`
# or credits its author's GitHub, pads it with Japanese filler text, and
# rebuilds each command from %var:~n,m% slices.
defaults:
  platforms: [unix, windows]
  for: [batch]
  attack: T1027
traits:
  - id: rouki-marker
    desc: Rouki obfuscator or author reference
    crit: component
    conf: 0.98
    platforms: [windows]
    if:
      type: text
      regex: (?i)(:Rouki-OBFUSCATOR|__github__\s*=\s*github\.com/rouki)
composite_rules:
  - id: batch-rouki-japanese-substring-clues
    desc: Rouki reference, Japanese text and batch slicing
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/source/syntax/expansion::batch-percent-substring-slicing
      - id: rouki-marker
      - id: metadata/lang/natural/script::lang-japanese
