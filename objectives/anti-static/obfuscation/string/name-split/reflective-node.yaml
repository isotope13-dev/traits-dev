defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.95
traits:
  # The projection exposes .join but does not fold its string-array receiver.
  # Requiring two strings distinguishes splitting from a plain fetch literal.
  - id: js-split-fetch-name
    desc: Reassembles the fetch API name from fragments
    if:
      type: tree-sitter
      query: |
        (
          (call_expression
            function: [
              (member_expression
                object: (array (string) (string)) @pieces
                property: (property_identifier) @join)
              (subscript_expression
                object: (array (string) (string)) @pieces
                index: (string) @join)]
            arguments: (arguments (string) @separator)) @assembled
          (#match? @join "^[\\\"']?join[\\\"']?$")
          (#match? @separator "^[\"'][\"']$")
          (#match? @pieces "^\\[\\s*['\"]f['\",\\s]*e['\",\\s]*t['\",\\s]*c['\",\\s]*h['\"]\\s*\\]$")
        )
composite_rules:
  - id: split-name-reflective-internal-spawn
    desc: Split names accompany reflective internal spawn configuration
    near_bytes: 1600
    all:
      - id: micro-behaviors/data/string/concat/join::js-inline-string-array-join
      - id: micro-behaviors/process/create/subprocess/configure::node-reflective-internal-spawn-descriptor
  - id: reflective-fetch-channel-clues
    desc: Split fetch name accompanies reflective global invocation
    crit: suspicious
    conf: 0.95
    near_bytes: 2400
    all:
      - id: objectives/anti-static/obfuscation/string/name-split::js-split-fetch-name
      - id: micro-behaviors/metaprogramming/reflection/invoke::js-reflect-apply-global-property
