# The callee of a remote-scriptlet GetObject bind is kept in a variable and
# invoked through Execute(name & "(arg)"), so neither the API name nor the
# call appears in the source as written; the moniker is recovered only from
# the decoded string layer.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1559.001

composite_rules:
  - id: vbs-execute-hides-remote-getobject
    desc: Execute hides a remote scriptlet GetObject call
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-variable-callee
      - id: micro-behaviors/os/com/instantiation::script-protocol-getobject
