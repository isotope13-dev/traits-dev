defaults:
  platforms: [unix, windows]
  for: [python, python-sdist]
  attack: T1027,T1195.002

composite_rules:
  - id: setup-py-underscore-delimited-hex-command-decode
    desc: setup.py decodes underscore-delimited hex command and argv trigger
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/string/split::python-dict-underscore-split-tail
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/process/argument/positional::python-decoded-bytes-subprocess-argv
      - id: micro-behaviors/process/argument/subcommand::python-sys-argv-membership-test
      - id: metadata/build/pip::root-setup-py
