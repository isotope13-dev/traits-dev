# A crypter that resolves its stage through reflection keeps the member name
# out of the metadata string heap by spelling it with a space between every
# letter and removing the spaces at run time. Ordinary UI text is never a
# bare reflection verb with spaced letters.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
  attack: T1027,T1620
traits:
  - id: spaced-letter-reflection-verb
    desc: Reflection verb spelled with spaced letters
    if:
      type: text
      regex: '^(L o a d|I n v o k e|G e t T y p e|E n t r y P o i n t|C r e a t e I n s t a n c e)$'
