defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1027,T1059.001,T1059.005

composite_rules:
  - id: marker-obfuscated-hidden-powershell
    desc: Obfuscated VBScript runs hidden PowerShell
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/string/delimiter::vbs-inline-marker-replace-deobfuscation
      - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
      - id: metadata/lang/source/syntax/command/launch::vbs-powershell-file-command
      - id: micro-behaviors/os/security/execution-policy::execution-policy-override-flag
