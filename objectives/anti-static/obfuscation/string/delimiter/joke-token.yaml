# A well-known joke token used as a field separator inside a payload.
#
# `dQw4w9WgXcQ` is the Rick Astley video id. As a *delimiter* -- not as a URL,
# which the exclusion below removes -- it is someone picking a string they are
# confident will not occur in the data being split. That is a property of the
# packer, not of any one malware family, so it belongs with the other string
# obfuscation techniques rather than under a trojan directory named `family`.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  size_max: 5000000
traits:
  - id: rickroll-delimiter
    desc: Rickroll YouTube ID used as a delimiter
    crit: notable
    if:
      type: text
      substr: dQw4w9WgXcQ
    not:
      - regex: youtube\.com/watch\?v=dQw4w9WgXcQ
