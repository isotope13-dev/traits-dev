defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, text]

traits:
  - id: caret-split-rundll32
    desc: Caret-obfuscated rundll32 token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\br\^?u\^?n\^?d\^?l\^?l\^?3\^?2\b'
    # Optional carets admit all split positions; explicitly reject the plain
    # spelling so a normal rundll32 URL launcher is not called obfuscated.
    not:
      - regex: '(?i)\brundll32\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

