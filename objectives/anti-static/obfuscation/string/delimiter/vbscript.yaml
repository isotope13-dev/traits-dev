defaults:
  attack: T1027
  mbc: F0001.005
  platforms:
    - windows
  for:
    - vbs
    - html
traits:
  - id: vbs-inline-marker-replace-deobfuscation
    desc: VBScript strips padding via Replace
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Inline padding removal requires a literal input; stripping a prefix
      # from a variable or object property is ordinary string processing.
      regex: '(?i)Replace\s*\(\s*"[^"\n]{3,240}"\s*,\s*"[^"]{3,40}"\s*,\s*""\s*\)'
  - id: vbs-padded-wscript-shell-progid-chunks
    desc: Padded WScript.Shell ProgID chunks
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)WScr[a-zA-Z0-9]{5,80}pt\.Sh[a-zA-Z0-9]{5,80}ll'
  - id: vbs-unicode-marker-split
    desc: VBScript splits on a long Unicode marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'Split\([^,\n]{1,64},\s*".{0,40}\P{ASCII}.{3,80}"\s*\)'
  - id: centrostigmatic-padding-line
    desc: Repeated junk replace padding
    crit: suspicious
    conf: 0.99
    count_min: 1000
    if:
      type: text
      exact: 'byous = byous & Replace("centrostigmatic", "*", "")'
  - id: centrostigmatic-marker
    desc: centrostigmatic delimiter token
    crit: notable
    conf: 0.97
    count_min: 100
    if:
      type: text
      substr: centrostigmatic
  - id: falan-marker
    desc: falan delimiter token
    crit: component
    conf: 0.97
    count_min: 100
    if:
      type: text
      substr: falan
  - id: hex-loop-prefix
    desc: Hex decoder &H prefix
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: Chr\(38\)\s*&\s*Chr\(72\)
  - id: cint-mid-hex-loop
    desc: CInt Mid hex loop
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Chr(CInt(heteracanth & Mid(
  - id: hex-loop-step-two
    desc: Loop walks a string in pairs
    crit: notable
    conf: 0.94
    if:
      type: text
      # Hex-pair decoders step over the input two digits at a time. A bare
      # "Step 2" also matches numbered comments ("' --- Step 2.").
      regex: '(?i)\bFor\s+\w+\s*=\s*\w+\s+To\s+[^\r\n]{1,60}\sStep\s+2\b'
  - id: internal-db-cache-var
    desc: INTERNAL_DB_CACHE env var
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: INTERNAL_DB_CACHE
  - id: iex-env-stager
    desc: IEX environment stager
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'IEX $env:'
  - id: delimited-iex-env-stager
    desc: Delimited IEX environment stager
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: IcentrostigmaticEcentrostigmaticX.{0,40}\$centrostigmatic
composite_rules:
  - id: custom-hex-loop
    desc: Custom VBScript hex decoder
    crit: suspicious
    conf: 0.97
    all:
      - id: hex-loop-prefix
      - id: cint-mid-hex-loop
      - id: hex-loop-step-two
  - id: env-cache-powershell-stager
    desc: User env PowerShell stager
    crit: suspicious
    conf: 0.98
    all:
    - id: micro-behaviors/os/env/read::user-environment-call
    - id: internal-db-cache-var
    any:
    - id: iex-env-stager
    - id: delimited-iex-env-stager
  - id: delimiter-packed-vbscript-stager
    desc: Delimiter packed VBScript stager
    crit: suspicious
    conf: 0.99
    all:
      - id: centrostigmatic-padding-line
      - id: custom-hex-loop
    any:
      - id: falan-marker
      - id: centrostigmatic-marker
      - id: env-cache-powershell-stager
