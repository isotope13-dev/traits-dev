defaults:
  platforms: [unix, windows]
  for: [batch, shell]
traits:
  - id: rundll32-obfuscated-env-var
    desc: Obfuscated Rundll32 with environment variables
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)Ru(%[0-9]|%[^%]{1,120}%)32
  - id: rundll32-obfuscated-split
    desc: Obfuscated Rundll32 split strings
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (?i)r.{1,3}u.{1,3}n.{1,3}d.{1,3}l.{1,3}l.{1,3}3.{1,3}2

  - id: cmd-caret-rundll32-after-r
    desc: Cmd caret inserted after Rundll32 r
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\br\^u\^?n\^?d\^?l\^?l\^?3\^?2\b'

  - id: cmd-caret-rundll32-after-u
    desc: Cmd caret inserted after Rundll32 ru
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bru\^n\^?d\^?l\^?l\^?3\^?2\b'

  - id: cmd-caret-rundll32-after-n
    desc: Cmd caret inserted after Rundll32 run
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\brun\^d\^?l\^?l\^?3\^?2\b'

  - id: cmd-caret-rundll32-after-d
    desc: Cmd caret inserted after Rundll32 rund
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\brund\^l\^?l\^?3\^?2\b'

  - id: cmd-caret-rundll32-after-first-l
    desc: Cmd caret inserted after Rundll32 rundl
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\brundl\^l\^?3\^?2\b'

  - id: cmd-caret-rundll32-after-second-l
    desc: Cmd caret inserted after Rundll32 rundll
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\brundll\^3\^?2\b'

  - id: cmd-caret-rundll32-after-three
    desc: Cmd caret inserted after Rundll32 rundll3
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\brundll3\^2\b'

  - id: cmd-delayed-rundll32-run-fragment
    desc: Cmd delayed expansion stores run fragment
    crit: suspicious
    conf: 0.94
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bcmd\b[^\r\n]{0,80}/v:on\b[^\r\n]{0,180}set\s+\w+\s*=\s*run\b'

  - id: cmd-delayed-rundll32-dll-fragment
    desc: Cmd delayed expansion stores dll32 fragment
    crit: suspicious
    conf: 0.94
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bcmd\b[^\r\n]{0,80}/v:on\b[^\r\n]{0,300}set\s+\w+\s*=\s*dll32\b'

  - id: cmd-delayed-rundll32-expansion
    desc: Cmd expands a split Rundll32 token
    crit: suspicious
    conf: 0.94
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)![A-Za-z_]\w*!![A-Za-z_]\w*!\s*[^\r\n]{0,80},\s*#\d+\b'

composite_rules:
  - id: cmd-delayed-rundll32-assembly
    desc: Cmd delayed expansion assembles Rundll32
    crit: suspicious
    conf: 0.97
    for: [batch, powershell]
    all:
      - id: cmd-delayed-rundll32-run-fragment
      - id: cmd-delayed-rundll32-dll-fragment
      - id: cmd-delayed-rundll32-expansion
