defaults:
  platforms: [windows]
  for: [powershell, pe, dll]
composite_rules:
  - id: powershell-transformed-socket-address-clues
    desc: Dot replacement and string slicing near TCP construction
    crit: suspicious
    conf: 0.9
    attack: T1027
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/string/replace::powershell-replace-with-dot
      - id: micro-behaviors/data/string/slice::powershell-substring-variable-call
      - id: micro-behaviors/communications/socket/dial::powershell-tcpclient-endpoint-constructor-text
