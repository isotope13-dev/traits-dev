defaults:
  platforms:
    - windows
  for: [source, documents, binaries, powershell, batch, vbs]
  crit: suspicious
  conf: 0.9
traits:
  - id: cmd-v-r-flags
    desc: CMD delayed expansion and run flags
    for:
      - pe
      - batch
      - powershell
    if:
      type: text
      regex: (?i)cmd\s+/[vr]\s+/[vr]
      section: .text
composite_rules:
  - id: obfuscated-cmd-execution
    desc: Obfuscated CMD execution
    crit: suspicious
    conf: 0.95
    for:
      - pe
      - batch
      - powershell
    all:
      - id: cmd-v-r-flags
    any:
      - id: objectives/anti-static/obfuscation/syntax::cmd-caret-split-command-token
      - id: objectives/anti-static/obfuscation/syntax::cmd-caret-split-binary-token
