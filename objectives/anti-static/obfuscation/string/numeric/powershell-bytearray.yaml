# Numeric character codes obscure text without string concatenation.
defaults:
  platforms: [unix, windows]
  for: [powershell, batch, shell]
  mbc: B0032
  attack: T1027
traits:
- id: powershell-numeric-bytearray-text
  desc: PowerShell decodes a numeric array to text
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(?i)\.GetString\s*\(\s*@\(\s*\d{1,3}(\s*,\s*\d{1,3}){10,}'
  not:
  # A 0/1-based sequential run (matrix indices, 1..N test data) decodes to
  # control characters, never to text: not a char-code payload
  # (azure-sdk-for-go job-matrix Pester triage).
  - regex: "@\\(\\s*(0,\\s*)?1,\\s*2,\\s*3,\\s*4,\\s*5\\b"
  downgrade:
    any:
    - id: well-known/tool/offensive/psbits::source-tree-member
