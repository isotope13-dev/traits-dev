defaults:
  platforms: [windows]
  for: [powershell, vbs]
  crit: suspicious
  conf: 0.97
traits:
  - id: powershell-nibble-table-reconstruction
    desc: PowerShell reconstructs bytes from nibble pairs
    for: [powershell]
    if:
      type: text
      regex: '(?is)\[int\].{0,40}\*\s*16\s*\+\s*\[int\]'
  - id: vbscript-nibble-table-reconstruction
    desc: VBScript reconstructs nibble-pair characters
    for: [vbs]
    if:
      type: text
      regex: '(?i)Chr\(CLng\([^\r\n]{1,60}\)\*16\+CLng'

composite_rules:
  - id: powershell-nibble-table-script-dispatch
    desc: Nibble table decodes into runspace script
    for: [powershell]
    all:
      - id: powershell-nibble-table-reconstruction
      - id: micro-behaviors/process/interpreter/powershell/host::add-script
  - id: vbscript-nibble-table-execute
    desc: VBScript executes nibble-decoded source text
    for: [vbs]
    all:
      - id: vbscript-nibble-table-reconstruction
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
