# Prefixed string ciphers used by Java obfuscators commonly store the key
# length in a leading control character and the encrypted UTF-16 data after
# it. These atoms report only the unusual representation and its decoder API;
# objectives and family rules add the behavior that gives them security meaning.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1027
  mbc: F0001

traits:
  - id: java-control-prefixed-long-string
    desc: Java string starts with control-length prefix
    crit: notable
    conf: 0.92
    if:
      type: value
      path: class.strings[*]
      regex: '^[\x{4}-\x{e}].{12,}$'

  - id: java-character-digit-bytecode
    desc: Java bytecode calls Character.digit
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: java/lang/Character.digit
