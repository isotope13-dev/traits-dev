# Browser RC4 string-table loaders (jsjiami-style kits): a Base64 string
# table decoded through an embedded RC4 (KSA plus PRGA), shuffled with a
# push/shift rotation, then executed through dynamically injected script
# elements. Each leg alone is neutral library behavior; the four together
# name the concealed loader stage.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: js-rc4-base64-string-table-loader
    desc: Rotating RC4 string table near script injection
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    # Bundles and source-map views can join independent modules. Require a
    # local cluster rather than attributing distant DOM code to this decoder.
    near_bytes: 8192
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::js-rc4-implementation
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
