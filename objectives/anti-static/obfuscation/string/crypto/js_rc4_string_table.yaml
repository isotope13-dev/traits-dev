# Browser RC4 string-table loaders (jsjiami-style kits): a Base64 string
# table decoded through an embedded RC4 (KSA plus PRGA), shuffled with a
# push/shift rotation, then executed through dynamically injected script
# elements. Each leg alone is neutral library behavior; the four together
# name the concealed loader stage.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: js-rc4-base64-string-table-loader
    desc: RC4 Base64 string table feeds script injection
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: micro-behaviors/process/deploy::dynamic-script-element-load
