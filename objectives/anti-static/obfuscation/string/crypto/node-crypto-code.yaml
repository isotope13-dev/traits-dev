defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: node-crypto-with-dynamic-or-minified-code
  desc: Node crypto loading and use near runtime code construction or obfuscation
  crit: notable
  conf: 0.88
  # File-wide correlation mislabels ordinary bundled applications whenever a
  # crypto-using dependency and an unrelated `new Function` share one chunk.
  near_bytes: 2048
  all:
  - id: metadata/import/builtin::require-crypto
  - id: micro-behaviors/crypto/provider/library::node-crypto-operation
  any:
  - id: objectives/anti-static/obfuscation/string/array::string-array-hex-index
  - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
  - id: metadata/build/minifier::minified-text-shape
