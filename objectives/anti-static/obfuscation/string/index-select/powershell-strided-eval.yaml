defaults:
  for: [powershell, batch]
  platforms: [windows]
  attack: T1027,T1059.001

traits:
  - id: ps-strided-character-reconstruction
    desc: PowerShell reconstructs strided characters
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '\$\w+\s*\+=\s*\$\w+\[\$\w+\];[^\r\n]{0,80}\$\w+\s*\+=\s*4'

  - id: ps-variable-dot-invocation
    desc: PowerShell calls a variable as a command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.\(\$\w+\)\s*\(\$\w+\)'

composite_rules:
  - id: ps-hidden-strided-command-execution
    desc: Hidden PowerShell executes strided encoded commands
    crit: hostile
    conf: 0.96
    all:
      - id: ps-strided-character-reconstruction
      - id: ps-variable-dot-invocation
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
