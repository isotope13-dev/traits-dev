---
defaults:
  platforms:
  - windows
  attack: T1027
traits:
- id: wsh-slice-reg-add
  for:
  - javascript
  desc: Slice strips prefix from ADD token
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "'8957898ADD '.slice(7)"
- id: wsh-slice-reg-sz
  for:
  - javascript
  desc: Slice strips prefix from REG_ token
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: "'39967 REG_'.slice(5)"
- id: wsh-slice-current-version
  for:
  - javascript
  desc: Slice strips prefix from Curr token
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: '''7621906"Curr''.slice(7)'
- id: wsh-slice-run-value
  for:
  - javascript
  desc: Slice strips prefix from Run token
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "'2558Run'.slice(4)"
- id: wsh-slice-crypted-value
  for:
  - javascript
  desc: Slice strips prefix from CRYPT token
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: "'296848CRYPT'.slice(6)"
composite_rules:
- id: interleaved-registry-value-placeholder
  desc: Interleaved value and placeholder co-occur
  crit: suspicious
  conf: 0.96
  for:
  - pe
  all:
  - id: objectives/anti-static/obfuscation/string/hijack-gen::run-key-placeholder
  - id: micro-behaviors/os/registry/value-name::interleaved-java-update-value-marker
- id: wsh-sliced-registry-command-assembly
  for:
  - javascript
  desc: Slices assemble registry command tokens
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/profile/identifier-population::numeric-suffix-identifiers
  - id: objectives/anti-static/obfuscation/string/index-select::wsh-slice-reg-add
  - id: objectives/anti-static/obfuscation/string/index-select::wsh-slice-reg-sz
  - id: objectives/anti-static/obfuscation/string/index-select::wsh-slice-current-version
  - id: objectives/anti-static/obfuscation/string/index-select::wsh-slice-run-value
  - id: objectives/anti-static/obfuscation/string/index-select::wsh-slice-crypted-value
