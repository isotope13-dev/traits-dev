# Builds names from characters of automatic variables whose text is fixed
# ($PSSessionConfigurationName, $ShellId) to hide URLs and cmdlet names.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027

traits:
  - id: session-variable-char-index
    desc: PowerShell builds text from variable chars
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)\$(PSSessionConfigurationName|ShellId)\s*\[[-0-9.,]{1,12}\]'
