# HTA/HTML VBScript that spells its command through a Chr() helper (dozens of
# helper(NN) calls glued with `&`) and then runs it through WScript.Shell
# with a hidden window. The helper exists only to keep the command text out
# of the file; pairing it with a hidden shell launch is a concealed launcher.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1027,T1059.005,T1218.005

composite_rules:
  - id: html-vbscript-chr-helper-hidden-run
    desc: Page VBScript hides command in Chr helper, runs hidden
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/encode/char-code::chr-wrapper-function
      - id: micro-behaviors/data/encode/char-code::html-vbscript-dense-numeric-helper-concat
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
