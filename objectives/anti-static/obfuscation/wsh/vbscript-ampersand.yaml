defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1059.005

traits:
  # Rebuilds a command by deleting every "&" inserted between characters.
  - id: vbs-ampersand-strip-replace
    desc: VBScript strips ampersands to rebuild a command
    crit: suspicious
    conf: 0.96
    attack: T1027
    if:
      type: text
      regex: '(?i)\breplace\s*\([^,\r\n]{1,80},\s*["'']&["'']\s*,\s*["'']{2}\s*\)'
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::offscrub-removal-benign-context
  # Dense char&&char stuffing of "powershell" (and similar) inside a string.
  - id: vbs-ampersand-stuffed-powershell
    desc: Ampersand-stuffed PowerShell command fragments
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001
    if:
      type: text
      regex: '(?i)p&&ow&&e&&rs&&he&&l&&l|po&&wer&&she&&ll|pow&&ers&&hell'

  - id: vbs-ampersand-invoke-webrequest
    desc: Ampersand-stuffed Invoke-WebRequest fragment
    crit: suspicious
    conf: 0.98
    attack: T1027,T1105
    if:
      type: text
      # Droppers insert one or more "&" between characters; tolerate runs of &.
      regex: '(?i)I&+n&+vo&+k&+e&+-&+W&+e&+b&+R&+eq'

  - id: vbs-ampersand-assembly-loadfile
    desc: Ampersand-stuffed Assembly::LoadFile fragment
    crit: suspicious
    conf: 0.98
    attack: T1027,T1620
    if:
      type: text
      regex: '(?i)As&&se&&m&&bly.{0,80}lo&&adf&&il&&e|::&&lo&&adf&&il&&e'

composite_rules:
  - id: vbs-ampersand-hidden-powershell-stager
    desc: VBScript strips ampersands then runs hidden PowerShell
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1564.003
    all:
      - id: vbs-ampersand-strip-replace
      - id: vbs-ampersand-stuffed-powershell
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run

  - id: vbs-ampersand-remote-assembly-stager
    desc: Ampersand-obfuscated VBScript fetches and reflectively loads a payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1105,T1620,T1059.005
    all:
      - id: vbs-ampersand-strip-replace
      - id: vbs-ampersand-invoke-webrequest
      - id: vbs-ampersand-assembly-loadfile
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
