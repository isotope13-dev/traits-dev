defaults:
  platforms: [windows]
  for: [vbs, mp3]
  attack: T1027
  mbc: B0032

traits:
  - id: vbs-chrw-decoder-helper
    desc: VBScript ChrW decoder helper
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bFunction\s+\w+[\s\S]{0,30}\bchrW\s*\('
  - id: vbs-execute-concat-code
    desc: VBScript Execute concat code
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bExecute\s+"[^"\r\n]{1,50}"\s*\+'
  - id: vbs-splintered-string-concat
    desc: String rebuilt from short quoted fragments
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)"[\w.]{1,4}"\s*&\s*\w{1,9}\s*&\s*"[\w.]{1,4}"\s*&\s*\w{1,9}\s*&'
    not:
      # "WND" & vbTab & "PATH" & vbTab & ...: a delimited record header, not
      # a ProgID glued around an empty-string variable.
      - regex: '(?i)&\s*vb(Tab|Cr|Lf|CrLf|NewLine)\s*&'
    unless:
      # A compiler's own test corpus is deliberately malformed: dotnet-roslyn's
      # src/Compilers/VisualBasic/Test/ exists to feed the VB parser inputs that
      # look exactly like this (TooLongNameTests.vb tests over-long identifiers).
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: vbs-obfuscated-getobject-target
    desc: VBScript GetObject target rebuilt with Replace
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bGetObject\s*\(\s*Replace\s*\('

  # Split() is one of the two or three most common VBScript/VB6 string calls;
  # on its own it says nothing. It is the split-then-decode CHAIN that matters,
  # so the ChrW leg is now required (see the composite at the bottom of the
  # file). The previous atomic spelling was just "a Split( within 700 bytes of a
  # Mid(" while claiming to be a "Split/Mid/ChrW decoder", and scored Unicorn
  # Engine's VB6 binding helper (bindings/vb6/misc.bas) as suspicious.
  - id: vbs-split-string-call
    desc: VBScript Split() string split call
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[^.A-Za-z0-9_])Split\s*\('
  - id: vbs-mid-chrw-decoder-step
    desc: VBScript Mid to ChrW decode step
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bMid\s*\([\s\S]{0,600}\bChrW\s*\('

  # `For i = 0 To 255` is how Info-ZIP's VB sample walks a 256-byte
  # buffer. The RC4 inference is the composite with the split and XOR legs.
  - id: vbs-split-on-space
    desc: VBScript splits a variable on spaces
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bSplit\s*\(\s*[A-Za-z_]\w*\s*,\s*"\s+"\s*\)'

  - id: vbs-rc4-xor-hex-byte
    desc: VBScript XOR-decodes hexadecimal bytes
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)Chr\s*\(\s*CLng\s*\(\s*"&H"\s*&\s*[A-Za-z_]\w*\s*\)\s+Xor\s+[A-Za-z_]\w*'

  - id: vbs-split-powershell-exe-name
    desc: VBScript rebuilds split PowerShell name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)["'']Powe["'']\s*&\s*["'']rshell(\.Exe)?["'']'

composite_rules:
  - id: vbs-rc4-like-byte-decoder
    desc: VBScript RC4-like S-box decoder
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/control-flow/loop::vbs-byte-range-loop
      - id: vbs-split-on-space
      - id: vbs-rc4-xor-hex-byte

  - id: vbs-rc4-hidden-powershell-stage
    for: [vbs]
    desc: Obfuscated VBScript decodes a payload and launches hidden PowerShell
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1564.003
    all:
      - id: vbs-rc4-like-byte-decoder
      - id: vbs-split-powershell-exe-name
      - id: micro-behaviors/process/create/hidden::run-zero-style-argument
      - id: micro-behaviors/os/com/automation::wscript-shell-literal

  # Split a delimited blob, then rebuild characters with Mid -> ChrW: the
  # standard VBScript stage decoder. All three calls must be present and close
  # together, which is what the id has always claimed.
  - id: vbs-split-mid-chrw-decoder
    desc: VBScript Split feeding a Mid/ChrW character decoder
    crit: suspicious
    conf: 0.94
    near_bytes: 700
    all:
      - id: vbs-split-string-call
      - id: vbs-mid-chrw-decoder-step
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::office-license-cleanup-benign-context

  - id: vbs-split-mid-chrw-dynamic-loader
    for: [vbs]
    desc: VBScript character-decoded dynamic loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    all:
      - id: vbs-split-mid-chrw-decoder
      - id: objectives/execution/interpreter/vbscript/loader::execute-variable

  - id: obfuscated-vbs-wmi-hidden-run
    for: [vbs]
    desc: Obfuscated VBScript WMI hidden runner
    crit: hostile
    conf: 0.98
    all:
      - id: vbs-chrw-decoder-helper
      - id: vbs-execute-concat-code
      - id: micro-behaviors/os/wmi/query::wmi-impersonation-moniker
      - id: micro-behaviors/process/create/hidden::run-zero-style-argument
  - id: vbs-concat-hidden-runner-obfuscation
    desc: VBScript concat-obfuscated hidden runner
    crit: hostile
    conf: 0.97
    for: [vbs]
    all:
      - id: vbs-execute-concat-code
      - id: micro-behaviors/process/create/hidden::run-zero-style-argument
    any:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-high-byte-obfuscated-script
      - id: metadata/file/line::vbs-long-average-lines
    needs: 1
  - id: vbs-concat-hidden-shellexecute-loader
    for: [vbs]
    desc: Obfuscated VBScript builds a hidden ShellExecute payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1059.007,T1564.003
    all:
      - id: vbs-execute-concat-code
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-hidden-showcmd

  - id: vbs-self-modifying-source
    for: [vbs]
    desc: VBScript opens its own script path for rewriting
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1070.006
    all:
      - id: micro-behaviors/fs/read/self::open-script-fullname-read
      - id: micro-behaviors/fs/read/file/full::readall-text-file
      - id: micro-behaviors/fs/write/content::fso-open-script-fullname-write
  - id: vbs-obfuscated-shell-output-runner
    for: [vbs]
    desc: Obfuscated VBS runs hidden command and captures output
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005
    all:
      - id: vbs-execute-concat-code
      - id: micro-behaviors/process/create/hidden::run-zero-style-argument
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/io/wsh::wsh-process-output-readall
  - id: vbs-obfuscated-xor-payload-loader
    for: [vbs]
    desc: VBScript obfuscated XOR payload loader
    crit: hostile
    conf: 0.98
    attack: "T1027,T1059.005"
    all:
      - id: micro-behaviors/os/com/automation::vbs-computed-createobject
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-vbs-xor-payload-decode
      - id: micro-behaviors/data/control-flow/dispatch::run-call-expression-argument

  - id: vbs-xor-subtraction-evaluated-stage
    desc: VBScript evaluates subtract-XOR decoded stage
    crit: suspicious
    conf: 0.95
    for: [vbs]
    all:
      - id: micro-behaviors/data/arithmetic::vbs-xor-subtraction-byte-rounds
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
