defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1140,T1059.005
composite_rules:
  - id: vbscript-numeric-array-offset-decoded-then-executed
    desc: VBScript decodes numeric array and Executes it
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/decode/charset::vbs-numeric-array-literal
      - id: micro-behaviors/data/decode/charset::vbs-chr-array-element-minus-key
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement

  - id: vbscript-numeric-array-xor-decoded-then-executed
    desc: VBScript decodes numeric array with XOR and executes it
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-xor-payload-decode
      - id: micro-behaviors/process/interpreter/eval/direct::validated-vbs-execute-statement
