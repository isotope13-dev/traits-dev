# A character-code expression and a dynamic CreateObject call establish
# concealment only when they occur together locally; file-wide co-occurrence
# can pair unrelated checksum helpers with a string-replacement decoder.
defaults:
  platforms: [windows]
  for: [javascript, text, vbs, static-lib, html]
  attack: T1027
  mbc: B0032

traits:
  # Quoted pieces joined with &. The first piece is Script and a later piece
  # contains Fil, so the joined ProgID is Scripting.FileSystemObject.
  - id: filesystemobject-ampersand-split-progid
    desc: FileSystemObject ProgID joined with ampersands
    crit: notable
    conf: 0.94
    for: [vbs]
    if:
      type: text
      regex: '(?i)"script"&\s*"[^"]{0,10}fil[^"]{0,6}"&\s*"[^"]{0,8}"&\s*"[^"]{0,10}object"'
composite_rules:
  # The local co-occurrence is a concealment lead, not proof that the
  # character-code expression constructs the ProgID. A wider window matched
  # unrelated checksum functions in a padded dropper.
  - id: vbs-com-call-near-char-code-decoding
    desc: VBScript COM call near character-code processing
    crit: suspicious
    conf: 0.94
    near_lines: 10
    all:
      - id: micro-behaviors/data/string/conversion::vbs-asc-mid-char-code
      - id: micro-behaviors/os/com/automation::vbs-createobject-call-result
  # Chr-concatenation twin of the Asc(Mid()) decoder above: CreateObject
  # receives the ProgID from Chr() calls (Shell.Application spelled as
  # Chr(83) & Chr(104) & ...) instead of a hand-rolled decoder loop. Dense
  # Chr construction alone is ordinary string building; resolving a COM
  # object from it defeats the same literal ProgID matching.
  - id: chr-concatenated-com-progid
    desc: COM ProgID concealed in Chr concatenation
    crit: hostile
    conf: 0.94
    for: [vbs, html]
    all:
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
      - id: micro-behaviors/os/com/automation::vbs-createobject-call-result
