# A COM ProgID that never appears as a literal: `CreateObject(Decode(...))`
# receives the name from a function call, and the decoder walks the source
# string one character code at a time with `Asc(Mid(s, i, 1))`. Moved from
# impact/infect/script, where it was reported as file infection although
# neither leg touches another file -- what it defeats is a scanner looking for
# `Scripting.FileSystemObject` or `WScript.Shell` in the clear.
defaults:
  platforms: [windows]
  for: [javascript, text, vbs, static-lib, html]
  attack: T1027
  mbc: B0032

traits:
  # Quoted pieces joined with &. The first piece is Script and a later piece
  # contains Fil, so the joined ProgID is Scripting.FileSystemObject.
  - id: filesystemobject-ampersand-split-progid
    desc: FileSystemObject ProgID joined with ampersands
    crit: notable
    conf: 0.94
    for: [vbs]
    if:
      type: text
      regex: '(?i)"script"&\s*"[^"]{0,10}fil[^"]{0,6}"&\s*"[^"]{0,8}"&\s*"[^"]{0,10}object"'
composite_rules:
  # `Asc(Mid(s, i, 1))` reads one character code. It is the per-character
  # step of every hand-rolled VBScript decoder, but also of ordinary checksum
  # and URL-encoding helpers, so it stays notable; the XOR itself is
  # fragmentation/script-fragmentation.yaml's vbs-xor-character-code.
  - id: vbs-computed-com-progid
    desc: COM ProgID computed from char codes
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/string/conversion::vbs-asc-mid-char-code
      - id: micro-behaviors/os/com/automation::vbs-createobject-call-result
  # Chr-concatenation twin of the Asc(Mid()) decoder above: CreateObject
  # receives the ProgID from Chr() calls (Shell.Application spelled as
  # Chr(83) & Chr(104) & ...) instead of a hand-rolled decoder loop. Dense
  # Chr construction alone is ordinary string building; resolving a COM
  # object from it defeats the same literal ProgID matching.
  - id: chr-concatenated-com-progid
    desc: COM ProgID concealed in Chr concatenation
    crit: hostile
    conf: 0.94
    for: [vbs, html]
    all:
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
      - id: micro-behaviors/os/com/automation::vbs-createobject-call-result
