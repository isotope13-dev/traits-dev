# A COM ProgID that never appears as a literal: `CreateObject(Decode(...))`
# receives the name from a function call, and the decoder walks the source
# string one character code at a time with `Asc(Mid(s, i, 1))`. Moved from
# impact/infect/script, where it was reported as file infection although
# neither leg touches another file -- what it defeats is a scanner looking for
# `Scripting.FileSystemObject` or `WScript.Shell` in the clear.
defaults:
  platforms: [windows]
  for: [javascript, text, vbs, static-lib, html]
  attack: T1027
  mbc: B0032

traits:
  # `Asc(Mid(s, i, 1))` reads one character code. It is the per-character
  # step of every hand-rolled VBScript decoder, but also of ordinary checksum
  # and URL-encoding helpers, so it stays notable; the XOR itself is
  # fragmentation/script-fragmentation.yaml's vbs-xor-character-code.
  - id: vbs-asc-mid-char-code
    desc: Reads a character code from a slice
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Asc(Mid("

composite_rules:
  - id: vbs-computed-com-progid
    desc: COM ProgID computed from char codes
    crit: hostile
    conf: 0.94
    all:
      - id: vbs-asc-mid-char-code
      - id: micro-behaviors/os/com/automation::vbs-createobject-call-result
