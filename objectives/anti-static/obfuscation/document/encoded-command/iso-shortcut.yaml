defaults:
  platforms: [windows]
  for: [iso]
  attack: T1027,T1059.001

composite_rules:
  # Fires when arithmetic obfuscation is present as ASCII text facts (some
  # carriers decode LNK fields). Wide-only LNK samples are covered by the
  # browser-decoy and password-lure composites instead.
  - id: iso-obfuscated-lnk-powershell
    desc: ISO LNK obfuscated PowerShell
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: metadata/file/format/iso::iso-lnk-arithmetic-obfuscation
      - id: micro-behaviors/fs/path/application/executable::edge-executable-search-path
