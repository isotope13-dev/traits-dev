defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [lnk]
  attack: T1027

traits:
- id: lnk-wildcard-iex-name-resolution
  desc: LNK wildcard masks Invoke-Expression
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: >-
      (?i)\*o\*e\*x\*s\*s\*o\*

composite_rules:
- id: powershell-lnk-obfuscated-hidden-command
  desc: Hidden PowerShell LNK decodes command text
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1564.003
  mbc: B0030
  all:
    - type: trait
      id: micro-behaviors/process/config/target::lnk-powershell-target
    - type: trait
      id: micro-behaviors/process/interpreter/eval/direct::lnk-invoke-expression-reference
    - type: trait
      id: micro-behaviors/data/decode/base64/reference::lnk-base64-convert
    - type: trait
      id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
- id: lnk-headless-powershell-base64-scriptblock-loader
  desc: LNK headless PowerShell decodes and runs ScriptBlock
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1140,T1564.003
  mbc: B0030
  # The shortcut targets conhost.exe and starts PowerShell with --headless, a
  # bypassed execution policy and no profile, then decodes a Base64 string
  # held in an argument variable and runs it as a created ScriptBlock. The
  # decoded stage is carried inside the shortcut, so no file or URL is named.
  all:
    - id: micro-behaviors/process/config/target::lnk-conhost-headless-powershell
    - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
    - id: micro-behaviors/data/decode/base64/reference::lnk-base64-convert
    - id: micro-behaviors/process/interpreter/eval/constructed::lnk-powershell-scriptblock-call-operator
- id: lnk-powershell-hex-pair-decode-eval
  desc: LNK PowerShell decodes hex bytes and evaluates them
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1140
  mbc: B0030
  # The command line holds a hex string, converts each pair with ToByte(,16),
  # rebuilds text with Encoding.GetString and passes it to Invoke-Expression.
  all:
    - id: micro-behaviors/process/argument/interpreter::lnk-powershell-argument-reference
    - id: micro-behaviors/data/decode/hex::lnk-arg-powershell-convert-tobyte-radix16
    - id: micro-behaviors/data/decode/utf8::lnk-arg-dotnet-encoding-getstring
    - id: micro-behaviors/process/interpreter/eval/direct::lnk-invoke-expression-reference
- id: minimized-powershell-encoded-bypass
  desc: Minimized shortcut runs encoded PowerShell with policy bypass
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1204.002,T1564.003
  all:
    - id: micro-behaviors/process/interpreter/powershell::lnk-powershell-launch-context
    - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
    - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
    - id: micro-behaviors/process/argument/interpreter::powershell-argument-encoded-command
- id: powershell-lnk-obfuscated-eval
  desc: Hidden PowerShell LNK evaluates obfuscated expression
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1564.003
  mbc: B0030
  all:
    - id: micro-behaviors/process/config/target::lnk-powershell-family
    - id: micro-behaviors/process/interpreter/eval/direct::lnk-invoke-expression-reference
    - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
  any:
    - id: micro-behaviors/data/string/concat/expression::lnk-quoted-string-concatenation
    - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-powershell-backtick-obfuscation
    - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-empty-string-obfuscation
- id: powershell-lnk-obfuscated-scriptblock-eval
  desc: Hidden PowerShell LNK evaluates obfuscated ScriptBlock
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1564.003
  mbc: B0030
  all:
    - id: micro-behaviors/process/config/target::lnk-powershell-family
    - id: micro-behaviors/process/interpreter/eval/constructed::lnk-powershell-scriptblock-call-operator
    - id: micro-behaviors/ui/window/state::lnk-hidden-window-flag
  any:
    - id: micro-behaviors/data/string/concat/expression::lnk-quoted-string-concatenation
    - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-powershell-backtick-obfuscation
    - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-empty-string-obfuscation

# Some PowerShell LNKs avoid spelling Invoke-Expression or IEX directly. This
# chain uses a wildcard passed to Get-Command, extracts the resolved command
# name, and invokes it on an HTTP responseText body. Keep the hostile claim
# tied to the LNK's encoded command, COM HTTP request and response execution;
# a wildcard lookup or encoded command alone is not an attack verdict.
- id: powershell-lnk-wildcard-resolved-response-eval
  desc: LNK wildcard-resolves and evaluates HTTP response
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1105
  all:
    - id: micro-behaviors/process/config/target::lnk-powershell-target
    - id: micro-behaviors/process/argument/interpreter::powershell-argument-encoded-command
    - id: micro-behaviors/communications/http/client/reference::lnk-serverxmlhttp-reference
    - id: objectives/execution/payload/script-eval/network/response-body::lnk-arg-invokes-http-response-text
    - id: lnk-wildcard-iex-name-resolution

- id: lnk-powershell-hex-obfuscated-eval
  desc: LNK decodes and evaluates hex-encoded PowerShell
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1140
  mbc: B0030
  all:
    - id: micro-behaviors/data/decode/hex::lnk-arg-powershell-convert-tobyte-radix16
    - id: micro-behaviors/data/decode/utf8::lnk-arg-dotnet-encoding-getstring
    - id: micro-behaviors/process/interpreter/eval/direct::lnk-invoke-expression-reference
  any:
    - id: objectives/execution/lnk/proxy::lnk-child-powershell-command
    - id: micro-behaviors/process/config/target::lnk-powershell-family
    - id: micro-behaviors/process/config/target::lnk-conhost-headless-powershell
  needs: 1

# The shortcut hex-decodes a stage and evaluates it, and the hidden stage
# downloads a remote script over WebClient.DownloadString. The URL is an
# attacker choice, so the composite claims the fetch-and-evaluate pattern
# rather than a host.
- id: lnk-hex-staged-remote-eval
  desc: LNK hex-decodes stage that downloads and evaluates remote script
  crit: hostile
  conf: 0.97
  attack: T1027,T1105,T1059.001
  mbc: B0030
  all:
    - id: lnk-powershell-hex-pair-decode-eval
    - id: objectives/anti-static/obfuscation/encoding/hex::lnk-hex-downloadstring
