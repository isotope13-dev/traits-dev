defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [lnk]
  attack: T1027

traits:
- id: lnk-wildcard-iex-name-resolution
  desc: LNK wildcard masks Invoke-Expression
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: >-
      (?i)\*o\*e\*x\*s\*s\*o\*

composite_rules:
- id: powershell-lnk-obfuscated-hidden-command
  desc: Hidden PowerShell LNK decodes command text
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1564.003
  mbc: B0030
  all:
    - type: trait
      id: micro-behaviors/process/create/shortcut::lnk-powershell-target
    - type: trait
      id: metadata/lang/source/naming/action::lnk-invoke-expression-reference
    - type: trait
      id: objectives/command-and-control/dropper/lnk/command-content::lnk-base64-convert
    - type: trait
      id: micro-behaviors/process/create/shortcut::lnk-hidden-window-flag
- id: minimized-powershell-encoded-bypass
  desc: Minimized PowerShell LNK uses encoded policy-bypass command
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1204.002,T1564.003
  all:
    - id: micro-behaviors/process/create/shortcut::lnk-powershell-target
    - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
    - id: objectives/command-and-control/dropper/lnk/target::powershell-argument-executionpolicy-bypass
    - id: objectives/command-and-control/dropper/lnk/target::powershell-argument-encoded-command
- id: powershell-lnk-obfuscated-eval
  desc: Hidden PowerShell LNK evaluates obfuscated expression
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1564.003
  mbc: B0030
  all:
    - id: micro-behaviors/process/create/shortcut::lnk-powershell-target
    - id: metadata/lang/source/naming/action::lnk-invoke-expression-reference
    - id: micro-behaviors/process/create/shortcut::lnk-hidden-window-flag
  any:
    - id: micro-behaviors/data/string/concat::lnk-quoted-string-concatenation
    - id: objectives/command-and-control/dropper/lnk/command-content::lnk-powershell-backtick-obfuscation
    - id: objectives/command-and-control/dropper/lnk/command-content::lnk-empty-string-obfuscation

# Some PowerShell LNKs avoid spelling Invoke-Expression or IEX directly. This
# chain uses a wildcard passed to Get-Command, extracts the resolved command
# name, and invokes it on an HTTP responseText body. Keep the hostile claim
# tied to the LNK's encoded command, COM HTTP request and response execution;
# a wildcard lookup or encoded command alone is not an attack verdict.
- id: powershell-lnk-wildcard-resolved-response-eval
  desc: LNK wildcard-resolves and evaluates HTTP response
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1105
  all:
    - id: micro-behaviors/process/create/shortcut::lnk-powershell-target
    - id: objectives/command-and-control/dropper/lnk/target::powershell-argument-encoded-command
    - id: objectives/command-and-control/dropper/lnk/command-content::lnk-serverxmlhttp
    - id: objectives/command-and-control/dropper/lnk/com-downloader::lnk-arg-invokes-http-response-text
    - id: lnk-wildcard-iex-name-resolution
