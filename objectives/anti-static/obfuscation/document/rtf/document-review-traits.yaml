defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: suspicious
  mbc: C0002.002
  attack: T1071.002

composite_rules:
  - id: rtf-html-file-data-wrapper-clues
    desc: RTF HTML body and file and data scheme clues
    crit: suspicious
    conf: 0.95
    attack: T1204.002,T1027
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/document/rtf::rtf-body-is-not-a-document
      - id: micro-behaviors/communications/url/scheme::document-file-scheme-reference
      - id: micro-behaviors/communications/url/scheme::document-data-scheme-reference
      - id: metadata/document/ole::ole-html-body
