defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1027,T1204.002

composite_rules:
  # Splitting the object stream with escaped backslashes only matters to a
  # scanner; pairing it with a forced refresh means the hidden object is
  # meant to load the moment the document opens.
  - id: autoupdate-object-hex-split-by-backslashes
    desc: Auto-updating object with backslash-split data
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::objupdate
      - id: metadata/document/rtf/ole::objdata-hex-split-by-escaped-backslash
