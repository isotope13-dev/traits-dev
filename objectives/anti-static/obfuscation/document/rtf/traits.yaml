defaults:
  platforms:
    - unix
    - windows
  for:
    - rtf
  crit: suspicious
  mbc: E1027
  attack: T1027
traits:
  - id: rtf-obfuscated-ole-header
    desc: Spaced OLE header byte tokens
    if:
      type: text
      regex: D\s+0\s+C\s+F|0xd0\s+0xcf
    conf: 0.95
  - id: rtf-malformed-header-missing-backslash
    desc: RTF header missing backslash
    if:
      type: text
      regex: ^\{rtf
    conf: 0.85
  - id: rtf-malformed-header-invalid-tag
    desc: RTF header invalid control tag
    if:
      type: raw
      regex: ^\{\\\\rtf($|[^1])
    conf: 0.85
  - id: rtf-malformed-header-invalid-version
    desc: RTF header invalid version
    if:
      type: raw
      regex: ^\{\\\\rtf1[0-9]
    conf: 0.85
  # `type: raw`, not `type: text`. Brace nesting is a property of the RTF
  # markup, and a text match also sees cleave's decoded view of the file's
  # hex regions -- where a run of 0x7B bytes inside an embedded picture
  # decodes to `{{{{{{{{{` and means nothing at all. Little CMS's
  # LittleCMS2.7 tutorial.rtf, shipped in ghostpdl, contains no two
  # consecutive braces anywhere in its 10 MB of markup yet matched twice, on
  # the hex runs `737b7b7b7b...` and `7b7b7b7b...` at offset 3038623.
  # `encoding: none`. Brace nesting is a property of the RTF markup, but a
  # plain `type: text` also sees cleave's decoded view of the file's hex
  # regions -- where a run of 0x7B inside an embedded picture decodes to
  # `{{{{{{{{{` and means nothing. Little CMS's LittleCMS2.7 tutorial.rtf,
  # shipped in ghostpdl, has no two consecutive braces anywhere in its 10 MB
  # of markup yet matched twice, on the hex runs at offset 3038623.
  - id: rtf-excessive-nesting
    desc: Excessive brace nesting detected
    if:
      type: text
      encoding: none
      substr: '{{{{{{{{{'
    conf: 0.9
    attack: T1204
  # A doubled backslash before a control word is an RTF evasion only when the
  # writer does it throughout; two incidental hits are not obfuscation. Word
  # emits `\\hich` where an escaped backslash happens to precede the
  # high-ANSI control word, and Little CMS's 10 MB tutorial.rtf matched
  # exactly twice -- enough, with no count, to score the manual suspicious.
  - id: rtf-control-word-obfuscation
    desc: Unusual RTF control word patterns
    count_min: 20
    if:
      type: text
      regex: \\\\[a-z]+\s*[a-z]
    conf: 0.7
  - id: rtf-mixed-case-controls
    desc: Mixed case RTF control words
    conf: 0.65
    if:
      type: text
      regex: \\\\[A-Z][a-z]{2,10}\\d|\\\\[a-z]{2,10}[A-Z][a-z]{1,10}\\d
  - id: rtf-suspicious-hex-stream
    desc: Large hex data stream
    if:
      # Whitespace is part of the stream: writers wrap `\objdata` hex at
      # around eighty columns, so a thousand *contiguous* hex characters never
      # appear in a real one and the original pattern matched nothing. Read
      # from raw bytes rather than extracted strings for the same reason: text
      # extraction hands back one string per wrapped line, and no single line
      # is a thousand characters long.
      type: raw
      regex: '\\objdata[\s{]{1,8}[0-9A-Fa-f\s]{1000,}'
    conf: 0.8
    crit: suspicious
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: rtf-malformed-nesting-open
    desc: Suspicious nested object opener
    if:
      type: raw
      regex: '[{]\\s*[{]\\s*\\\\(object|objdata)'
    conf: 0.8
    crit: suspicious
  - id: rtf-malformed-nesting-close
    desc: Suspicious nested object closer
    if:
      type: raw
      regex: \\\\(object|objdata)[^\n]{0,256}[}][}]
    conf: 0.8
    crit: suspicious
  - id: rtf-whitespace-obfuscated-objdata
    desc: Whitespace-obfuscated RTF object data
    if:
      type: raw
      regex: '\\objdata\s+[0-9A-Fa-f](\s{5,}[0-9A-Fa-f]){4}'
    conf: 0.75
  - id: rtf-template-reference-a
    desc: Template file reference marker
    if:
      type: text
      # Match the actual template/init control words, not ordinary controls
      # such as \listtemplateid used by every RTF list table.
      regex: '\\template\b|tables\.lNk|\\init\b'
    conf: 0.8
    crit: suspicious
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: rtf-template-reference-b
    desc: Dot or dotm template reference
    if:
      type: text
      regex: \.dotm?
    conf: 0.8
    crit: suspicious
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: rtf-link-resolution-trigger-c
    desc: Formula rendering trigger
    if:
      type: text
      substr: FORMULA
    conf: 0.85
    crit: suspicious
  - id: rtf-link-resolution-trigger-d
    desc: Embedded object trigger
    if:
      type: text
      substr: EMBED
    conf: 0.85
    crit: suspicious
  - id: rtf-obfuscated-control-word-count
    desc: Unusual control word count
    if:
      type: text
      regex: \\[a-z]+\s+\\[a-z]+\s+\\[a-z]+\s+\\[a-z]+\s+\\[a-z]+(\s+\\[a-z]+){10,}
    conf: 0.7
  - id: rtf-code-in-metadata-js-func
    desc: JavaScript function in RTF metadata
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: \\(author|title|subject)\s+".{0,50}function
  - id: rtf-code-in-metadata-js-eval
    desc: JavaScript eval in RTF metadata
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: \\(author|title|subject)\s+".{0,50}eval
  - id: rtf-code-in-metadata-dom-window
    desc: Window object access in RTF metadata
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \\(keywords|comment|company)\s+".{0,50}window\.
  - id: rtf-code-in-metadata-dom-document
    desc: Document object access in RTF metadata
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \\(keywords|comment|company)\s+".{0,50}document\.
  - id: rtf-code-in-metadata-dom-process
    desc: Process object access in RTF metadata
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: \\(keywords|comment|manager)\s+".{0,50}Process\.
composite_rules:
  - id: rtf-malformed-header
    desc: Malformed RTF header
    conf: 0.85
    any:
      - id: rtf-malformed-header-missing-backslash
      - id: rtf-malformed-header-invalid-tag
      - id: rtf-malformed-header-invalid-version
  - id: rtf-malformed-nesting
    desc: Suspicious nested object group
    conf: 0.8
    crit: suspicious
    any:
      - id: rtf-malformed-nesting-open
      - id: rtf-malformed-nesting-close
  - id: rtf-template-reference
    desc: Template or config file reference
    conf: 0.8
    crit: suspicious
    any:
      - id: rtf-template-reference-a
      - id: rtf-template-reference-b
  - id: rtf-link-resolution-trigger
    desc: Link resolution and rendering trigger
    conf: 0.85
    crit: suspicious
    any:
      - id: rtf-link-resolution-trigger-c
      - id: rtf-link-resolution-trigger-d
  - id: rtf-code-in-metadata
    desc: Code patterns in RTF metadata
    conf: 0.9
    crit: suspicious
    any:
      - id: rtf-code-in-metadata-js-func
      - id: rtf-code-in-metadata-js-eval
      - id: rtf-code-in-metadata-dom-window
      - id: rtf-code-in-metadata-dom-document
      - id: rtf-code-in-metadata-dom-process
