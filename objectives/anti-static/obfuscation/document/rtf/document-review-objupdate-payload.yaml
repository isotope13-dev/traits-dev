defaults:
  platforms:
  - windows
  - unix
  - android
  - ios
  for:
  - rtf
traits:
- id: rtf-truncated-magic
  desc: RTF header omits the format control word
  crit: notable
  conf: 0.98
  platforms: [windows]
  size_min: 4096
  if:
    type: raw
    regex: '^\{\\rt[^f]'
- id: rtf-nested-zero-bin-object-data
  desc: Nested object data follows zero-length bin
  crit: suspicious
  conf: 0.96
  platforms: [windows]
  if:
    type: raw
    regex: '(?s)\\objdata\d{4,}\s+\{{1,4}\\bin0{3,}.{0,80}\\objdata'
composite_rules:
- id: rtf-truncated-magic-nested-auto-object
  desc: Malformed RTF conceals nested auto-updated object
  crit: hostile
  conf: 0.98
  attack: T1027.009
  all:
  - id: rtf-truncated-magic
  - id: rtf-nested-zero-bin-object-data
  - id: metadata/document/rtf/ole::objupdate
- id: rtf-truncated-magic-obfuscated-auto-object
  desc: Malformed RTF conceals an auto-updated object
  crit: hostile
  conf: 0.98
  attack: T1027.009
  all:
  - id: rtf-truncated-magic
  - id: rtf-objupdate-obfuscated-ole-object
- id: rtf-objupdate-obfuscated-object-data
  crit: suspicious
  desc: RTF auto-update with obfuscated object data
  conf: 0.95
  all:
  - id: metadata/document/rtf/ole::objupdate
  any:
  - id: metadata/lang/encoding/hex::hex-encoded-content-references
  - id: objectives/anti-static/obfuscation/document/rtf::suspicious-hex-escape
  - id: objectives/anti-static/obfuscation/document/rtf::nested-objdata-in-data
- id: rtf-objupdate-obfuscated-ole-object
  crit: suspicious
  desc: RTF object auto-update and encoded data
  conf: 0.95
  all:
  - id: metadata/document/rtf/ole::objupdate
  - id: metadata/document/rtf/ole::object-control-feature
  any:
  - id: objectives/anti-static/obfuscation/document/rtf::suspicious-hex-escape
  - id: metadata/lang/encoding/hex::hex-encoded-content-references
  - id: metadata/lang/encoding/hex::hex-encoded-http
- id: rtf-parser-confusion-object-trigger
  crit: suspicious
  desc: RTF hides auto-update in malformed object controls
  conf: 0.96
  platforms:
  - windows
  all:
  - id: metadata/document/rtf/ole::objupdate
  - id: objectives/anti-static/obfuscation/document/rtf::rtf-object-parameter-overflow
  - id: objectives/anti-static/obfuscation/document/rtf::rtf-hidden-text-object-trigger
