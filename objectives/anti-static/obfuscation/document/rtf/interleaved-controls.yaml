defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1027

traits:
  - id: control-interleaved-hex-nibbles
    desc: RTF controls separate individual hex nibbles
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      regex: '([0-9A-Fa-f][\s{}]{0,8}(\\[a-z]{1,24}-?[0-9]{0,8}[\s{}]{1,8}){1,3}){16}'

composite_rules:
  - id: autoupdate-control-interleaved-payload
    desc: Auto-updating OLE payload concealed by nibble control interleaving
    crit: hostile
    conf: 0.99
    all:
      - id: control-interleaved-hex-nibbles
      - id: metadata/document/rtf/ole::object-control-feature
      - id: metadata/document/rtf/ole::objupdate
