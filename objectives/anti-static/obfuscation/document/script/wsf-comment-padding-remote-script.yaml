defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1059.005

traits:
  - id: wsf-padded-comment-remote-script
    desc: WSF hides remote script among padded comments
    crit: hostile
    conf: 0.96
    if:
      type: yara
      source: |
        rule wsf_padded_comment_remote_script {
          strings:
            $job = "<job>" nocase
            $script = /<script\s+language=["']VBScript["']\s+src=["']https?:\/\/[^"']+\.txt["']/ nocase
            $padding = /'Z{12}[^\r\n]{50,150}/
          condition:
            filesize > 5000 and $job and $script and #padding >= 20
        }
