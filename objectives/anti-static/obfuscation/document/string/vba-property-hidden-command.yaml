# A command kept in a built-in document property (Author, Comments, ...) is
# read a few lines before a hidden-window Shell call: the launched command
# lives in document metadata, not in the macro source.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1027,T1564.003

composite_rules:
  - id: vba-document-property-hidden-shell
    desc: Hidden Shell runs text from document properties
    crit: hostile
    conf: 0.9
    near_lines: 8
    all:
      - id: micro-behaviors/data/document/properties::vba-builtin-document-properties
      - id: objectives/execution/interpreter/document/macro::vba-hidden-window-shell
