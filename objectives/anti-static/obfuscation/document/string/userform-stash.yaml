# The fully late-bound maldoc: every string lives in the form designer, every
# call goes through CallByName or CreateObject on a variable, and the module
# body is a chain of one-line subs that pass ActiveDocument around. Nothing in
# the code names what it does, which is the point -- and is itself the tell,
# because no honest macro needs to hide its own method names from itself.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1059.005
  mbc: B0032

composite_rules:
  - id: vba-userform-stashed-late-binding
    desc: Macro hides strings in forms and late-binds
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/string/runtime::vba-userform-property-string-stash
    any:
      - id: micro-behaviors/data/string/runtime::vba-callbyname-variable-member
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
    needs: 2
