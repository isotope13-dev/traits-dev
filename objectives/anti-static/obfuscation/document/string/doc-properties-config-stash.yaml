# The configuration lives in the document, not the code: the macro reads a
# built-in document property, splits the value on a marker, and instantiates
# its COM objects from the resulting slots, so no ProgID, URL, or key appears
# in the module text. It runs without being asked. A macro that opens by
# itself and builds its own imports out of document metadata is unpacking a
# hidden configuration, not stamping a cover page.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1059.005

composite_rules:
  - id: doc-properties-split-config-loader
    desc: Auto-open macro splits document property into dynamic COM config
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/string/split::vba-document-property-split
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
