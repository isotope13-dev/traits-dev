# Remote template locations hidden from string and URL scanners. Word writes
# the template path as one plain run; these forms only exist to keep the
# fetch target out of reach of anything that reads the file bytes.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1027,T1221

traits:
  - id: template-url-scheme-line-split
    desc: Template URL scheme split by line break
    crit: suspicious
    conf: 0.95
    if:
      # `{\*\template h<CRLF>ttp://...}`: RTF readers drop the line break, so
      # the scheme reassembles on load but no `http` appears in the bytes.
      type: raw
      regex: '(?i)\\template\s{0,8}\{?\s{0,4}ht{0,2}[\r\n]+\s{0,4}t{0,2}ps?:'

composite_rules:
  - id: template-target-wrapped-unicode
    desc: Template target in wrapped Unicode escapes
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/properties::template-unicode-escaped-target
      - id: metadata/document/rtf/structure::unicode-escape-below-int16-range

  - id: rtf-concealed-remote-template-target
    desc: RTF hides its remote template location
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/properties::template-http-target
      - id: template-url-scheme-line-split
