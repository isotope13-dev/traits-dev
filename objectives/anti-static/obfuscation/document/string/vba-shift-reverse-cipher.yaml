# Strings rebuilt at runtime by reversing them with Mid$ assignments and
# shifting every character code by a constant (a Caesar cipher), inside an
# open-event macro that declares CreateProcess. The cipher keeps the program
# path, arguments and environment names out of the source.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027

composite_rules:
  - id: vba-shift-reverse-cipher-process-launch
    desc: Open-event macro ciphers its launch strings
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/data/string/conversion::vb-asc-constant-shift
      - id: micro-behaviors/data/string/conversion::vb-mid-statement-reverse-copy
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl

  - id: vba-split-com-moniker-autoopen
    desc: Auto-open macro splits a COM moniker prefix
    crit: hostile
    conf: 0.9
    all:
      - id: vba-getobject-split-moniker-prefix
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl

traits:
  - id: vba-getobject-split-moniker-prefix
    desc: GetObject moniker prefix split across strings
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bGetObject\s*\(\s*"[a-z]{1,4}"\s*&\s*\w+'
