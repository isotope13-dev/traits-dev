# Hiding a value by pushing it off the right edge of the editor: the key, the
# colon, then several hundred spaces, then the payload. A reviewer scrolling the
# file sees `"command":` followed by blank space and reads the entry as empty;
# only a horizontal scroll or a raw dump shows what is actually there. It is the
# house style of the fake-recruiter repos that ship a `.vscode/tasks.json`
# autorun task.
#
# It also degrades static analysis, which is why it sits under anti-static/: a
# matcher written as `"key":\s*"value"` never sees the pair once the gap exceeds
# its bound, so every rule that assumed key and value sit together goes blind.
# Rules meant to survive this have to anchor on the value string itself.
#
# Matched on text bytes (not on text.* metrics): JSON analysis does not emit
# `text.max_line_length` / `text.whitespace_ratio`, so a metrics-only form of
# this rule was inert on the very tasks.json files it was written for. The
# 80-space floor is well past ordinary pretty-print indent and under the
# several-hundred-space gaps these lures use.
defaults:
  platforms: [linux, macos, windows]
  attack: T1027
  for: [json, package.json]

traits:
  - id: json-key-value-space-padded
    desc: JSON value padded far from its key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"[^"\n]{1,40}"\s*:\s{80,}"'
