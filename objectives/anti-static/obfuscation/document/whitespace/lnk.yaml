# LNK Whitespace Obfuscation
# CVE/ZDI: ZDI-CAN-25373
# ATT&CK: T1027.010 (Command Obfuscation)
#
# Attackers abuse LNK shortcut files by inserting excessive whitespace
# (spaces, tabs, newlines) to hide malicious command-line arguments
# from visual inspection. The target command is padded far to the right
# so it's not visible in the properties dialog.
defaults:
  platforms: [windows]
  attack: "T1027.010"
  for: [lnk]
traits:
  # === Excessive whitespace with command switch patterns ===
  # More specific patterns that require both whitespace AND command context
  - id: whitespace-cmd-exe
    desc: Excessive whitespace before cmd.exe invocation
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '[ ]{50,}cmd\.exe'
      case_insensitive: true
  - id: whitespace-powershell-exe
    desc: Excessive whitespace before powershell.exe
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '[ ]{50,}powershell\.exe'
      case_insensitive: true
  - id: whitespace-script-host
    desc: Excessive whitespace before script hosts
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '[ ]{50,}(wscript|cscript)\.exe'
      case_insensitive: true
  - id: tab-padded-command
    desc: Tab-padded command obfuscation
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '\t{20,}(cmd|powershell)\.exe'
      case_insensitive: true
      # === LNK-specific argument hiding ===
  - id: lnk-argument-padding
    desc: LNK argument field with excessive padding
    crit: suspicious
    conf: 0.8
    if:
      type: raw
      regex: '(/c|/k|-c)[ ]{30,}\S'
      case_insensitive: true
      # === Encoded command after whitespace ===
  - id: hidden-encoded-command
    desc: "b64/encoded command after whitespace padding"
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Whitespace + -enc flag + base64
      regex: '[ ]{30,}-enc\s+[A-Za-z0-9+/]{20,}'
      case_insensitive: true
      # === KV-based LNK detection (uses structured LNK parsing) ===
  - id: lnk-args-whitespace-run-50
    desc: LNK arguments contain long whitespace run
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: lnk.arguments_max_whitespace_run
      min: 50
  - id: lnk-args-leading-spaces-50
    desc: LNK arguments start with many spaces
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: lnk.arguments_leading_spaces
      min: 50
  - id: lnk-args-leading-tabs-50
    desc: LNK arguments start with many tabs
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: lnk.arguments_leading_tabs
      min: 50
  - id: lnk-args-whitespace-total-100
    desc: LNK arguments contain heavy whitespace padding
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: lnk.arguments_whitespace_count
      min: 100
composite_rules:
  # LNK whitespace metrics emitted by expose are pure counts:
  # args_leading_spaces / args_leading_tabs / args_whitespace_total /
  # args_max_whitespace_run. Thresholds (e.g. ">= 50 for CVE-2025-9491")
  # live in the trait `min:` clauses below, not in expose.

  # Helper: whitespace hiding technique detected
  - id: whitespace-hiding-comp
    desc: Whitespace-based command hiding
    crit: suspicious
    conf: 0.85
    any:
      - id: whitespace-cmd-exe
      - id: whitespace-powershell-exe
      - id: whitespace-script-host
        # Helper: extended whitespace patterns
  - id: whitespace-hiding-extended
    desc: Extended whitespace hiding patterns
    crit: suspicious
    conf: 0.85
    any:
      - id: whitespace-hiding-comp
      - id: tab-padded-command
        # Helper: command argument indicators
  - id: argument-indicators
    desc: Command argument padding or encoding
    crit: suspicious
    conf: 0.85
    any:
      - id: lnk-argument-padding
      - id: hidden-encoded-command
        # Main composite: both hiding + argument pattern
  - id: lnk-whitespace-exploit
    desc: LNK whitespace obfuscation exploit pattern
    crit: hostile
    conf: 0.95
    all:
      - id: whitespace-hiding-extended
      - id: argument-indicators
  - id: lnk-command-padding-shape
    desc: LNK arguments use a long leading whitespace padding shape
    crit: suspicious
    conf: 0.94
    any:
      - id: lnk-args-leading-spaces-50
      - id: lnk-args-leading-tabs-50
      - id: lnk-args-whitespace-total-100
  - id: lnk-long-argument-padding
    desc: LNK arguments contain a long leading whitespace run and padding
    crit: hostile
    conf: 0.96
    all:
      - id: lnk-args-whitespace-run-50
      - id: lnk-command-padding-shape
  - id: lnk-padded-command-target
    desc: LNK combines padding with shortcut indicators
    crit: suspicious
    conf: 0.95
    # Padding is required alongside the shortcut indicators, including
    # common system icon references that are not suspicious on their own.
    all:
      - id: lnk-command-padding-shape
    any:
      - id: micro-behaviors/process/create/shortcut::powershell-in-args
      - id: micro-behaviors/process/argument/file::powershell-script-file-argument
      - id: micro-behaviors/process/argument/interpreter::powershell-argument-encoded-command
      - id: micro-behaviors/process/argument/interpreter::wscript-engine-override-arg
      - id: micro-behaviors/ui/graphics/icon::lnk-shell32-icon-location
      - id: micro-behaviors/process/create/shortcut::rundll32-ordinal-argument
      - id: objectives/execution/payload/remote-script::minimized-obfuscated-remote-command
      - id: objectives/execution/interpreter/script/mshta::minimized-remote-mshta-stage
      - id: objectives/execution/payload/file-exec/remote-share::lnk-minimized-webdav-ssl-script-host
      - id: objectives/execution/payload/script-eval/network/in-process::minimized-powershell-download-execute
      - id: objectives/execution/payload/file-exec/command/fetch-hidden::minimized-bits-transfer-batch-launch
      - id: micro-behaviors/process/create/hidden::hidden-powershell-lnk
      - id: objectives/execution/lure/shortcut::minimized-powershell-policy-bypass-script
      - id: micro-behaviors/process/create/hidden::hidden-lolbin-lnk
      - id: micro-behaviors/process/create/shortcut::conhost-powershell-proxy
      - id: micro-behaviors/process/create/hidden::hidden-or-minimized-powershell
      - id: objectives/execution/lolbin/rundll32::lnk-cmd-rundll32-ordinal
      - id: objectives/evasion/masquerade/extension/double::media-named-rundll32-ordinal-launch
      - id: metadata/file/profile/network-context/process::lnk-hidden-shell-policy-web-reference
      - id: metadata/file/profile/network-context/process::lnk-powershell-policy-web-reference
      - id: micro-behaviors/process/create/hidden::lnk-hidden-script-host-with-arguments
      - id: objectives/execution/payload/file-exec/remote-share::lnk-minimized-webdav-script-host
      - id: metadata/file/profile/network-context/process::lnk-browser-icon-webdav-js-reference
      - id: metadata/file/profile/path-reference::lnk-random-downloads-executable-path
      - id: objectives/execution/interpreter/script/mshta::lnk-minimized-split-mshta-remote-stage
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
      - id: micro-behaviors/process/create/shortcut::minimized-interpreter-window
      - id: micro-behaviors/process/create/shortcut::hidden-or-minimized-window
  - id: lnk-command-interpreter-padding
    desc: LNK hides executable arguments behind excessive leading whitespace
    crit: hostile
    conf: 0.97
    all:
      - id: lnk-long-argument-padding
      - id: lnk-padded-command-target
