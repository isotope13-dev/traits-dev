# ActiveX object data whose hex digits are separated by control words. The
# control still loads (RTF readers skip unknown controls), but no hex run --
# CLSID, compound-file header or embedded path -- is contiguous in the file.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1027

composite_rules:
  - id: rtf-activex-object-hex-interleaved
    desc: ActiveX object hex interleaved with controls
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/document/rtf/ole::activex-objocx-feature
      - id: metadata/document/rtf/ole::compound-native-object
      - id: objectives/anti-static/obfuscation/document/rtf::control-interleaved-hex-nibbles
