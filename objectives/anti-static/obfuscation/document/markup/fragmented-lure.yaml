defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: fragmented-confidential-text
    desc: Confidential text split by inline tags
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)confide<(cite|span)\b[^>]{0,60}>[^<]{0,40}</(cite|span)>ntial'
      exclude_html_comments: true
