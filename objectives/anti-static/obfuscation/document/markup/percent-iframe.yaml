# Encoding a non-rendering iframe conceals a browser load. It does not by
# itself establish an overlay, traffic fraud, an exploit, or a payload chain.
# Keep both observations at suspicious; the remote-source leg records the
# narrower variant without turning ordinary iframe transport into an attack.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [html]
  attack: T1027
composite_rules:
  - id: percent-written-tiny-remote-iframe
    desc: Percent writer conceals a tiny remote iframe
    crit: suspicious
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/html::percent-decoded-iframe-tag
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
  - id: percent-written-tiny-iframe
    desc: Percent writer conceals a tiny iframe
    crit: suspicious
    conf: 0.9
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/html::percent-decoded-iframe-tag
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
