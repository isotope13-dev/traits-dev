defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1027

traits:
  # `{\v\GOOGLEAUTHORIZATION...}`: a hidden-text group whose only content is
  # an undefined control word dozens to hundreds of letters long. No writer
  # emits these; builders drop them between the hex digits of object data
  # so that a reader which does not skip unknown groups stops decoding.
  - id: rtf-hidden-junk-control-groups
    desc: Hidden groups hold oversized junk control words
    crit: suspicious
    conf: 0.95
    count_min: 8
    if:
      type: raw
      regex: '[{]\\v\\[A-Za-z]{40,400}[}]'

composite_rules:
  - id: rtf-junk-padded-object-data
    desc: OLE object data padded with junk controls
    crit: hostile
    conf: 0.95
    all:
      - id: rtf-hidden-junk-control-groups
      - id: metadata/document/rtf/ole::ole-compound-header-hex
      - id: metadata/document/rtf/ole::embedded-object-control
