# Recovered from the article's cited Worker. The payload is carried in SVG
# rectangle data attributes; an event handler reads attributes, unshuffles
# their order and decodes hexadecimal pairs to JavaScript. Match the carrier
# and reconstruction operations, not the chosen attribute suffix, grid size,
# PRNG constants, local names, title, domain or decoded stage identity.
defaults:
  platforms: [unix, windows]
  for: [html, svg]
traits:
  - id: svg-hex-attribute-reconstruction
    desc: Rebuilds code from SVG hex attributes
    crit: suspicious
    conf: 0.96
    attack: T1027
    if:
      type: yara
      source: |
        rule svg_hex_attribute_reconstruction {
          strings:
            $rect = /<rect\b[^>]{0,240}\bdata-[\w-]+\s*=\s*["'][0-9a-fA-F]{4,64}["']/ nocase
            $query = /querySelectorAll\s*\(\s*(["']|&quot;|&#34;|&#39;)rect/
            $read = /getAttribute\s*\(\s*(["']|&quot;|&#34;|&#39;)data-[\w-]+/
            $decode = /String\s*\.\s*fromCharCode\s*\(\s*parseInt\s*\(/
            $radix = /,\s*16\s*\)/
            $compile = /\.constructor\s*\.\s*constructor\s*\(/
          condition:
            #rect >= 16 and $query and $read and $decode and $radix and $compile and
            for any q in (1..#query) : (
              for any r in (1..#read) : (
                @read[r] > @query[q] and @read[r] - @query[q] < 3000 and
                for any d in (1..#decode) : (
                  @decode[d] > @read[r] and @decode[d] - @read[r] < 3000 and
                  for any b in (1..#radix) : (
                    @radix[b] > @decode[d] and @radix[b] - @decode[d] < 256 and
                    for any c in (1..#compile) : (
                      @compile[c] > @radix[b] and @compile[c] - @radix[b] < 512
                    )
                  )
                )
              )
            )
        }
