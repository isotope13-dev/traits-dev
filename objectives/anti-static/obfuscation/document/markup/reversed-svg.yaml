defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: reversed-base64-svg-embed
    desc: Embeds SVG from reversed Base64
    crit: suspicious
    conf: 0.98
    attack: T1027
    if:
      type: text
      regex: 'setAttribute\(\s*["'']src["'']\s*,\s*[A-Za-z_$][\w$]*\s*\+\s*reverse\(["'']=4zZ2N3L8'
composite_rules:
  - id: concealed-svg-password-carrier
    desc: Reversed SVG payload accompanies document extraction password
    crit: suspicious
    conf: 0.98
    attack: T1027.006
    all:
      - id: reversed-base64-svg-embed
      - id: micro-behaviors/ui/window/display::document-extraction-password-label
