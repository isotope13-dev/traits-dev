defaults:
  platforms: [unix, windows]
  for: [ooxml]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: high-entropy-ooxml-ole-container
    desc: Compact high-entropy OOXML with executable embedded OLE
    crit: hostile
    conf: 0.97
    size_min: 10240
    size_max: 32768
    all:
      - id: metadata/document/office/markup::ooxml-embedded-ole-object
      - id: metadata/document/office/markup::ooxml-embedded-ole2-object
      - id: metadata/document/office/markup::ooxml-embedded-native-executable
      - id: metadata/document/office/markup::ooxml-very-high-entropy-body
  - id: compact-high-entropy-sector-ole-container
    desc: Compact high-entropy OOXML conceals sector-sized OLE
    crit: hostile
    conf: 0.96
    size_min: 10240
    size_max: 32768
    all:
      - id: metadata/document/office/markup::ooxml-embedded-ole-object
      - id: metadata/document/office/markup::ooxml-embedded-ole2-object
      - id: metadata/document/office/markup::ooxml-sector-sized-embedded-ole
      - id: metadata/document/office/markup::ooxml-very-high-entropy-body
