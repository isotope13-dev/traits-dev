# Embedded-object payloads concealed by RTF syntax no writer produces:
# upper-case filler control words, parameters on parameterless object
# controls, raw `\bin` bytes spliced into hex, escaped class names. Each
# keeps the object loading in Word while breaking scanners that read the
# object declaration or the hex run literally.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1027

composite_rules:
  - id: rtf-object-concealed-by-invalid-controls
    desc: OLE object hidden with malformed RTF controls
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::object-control-feature
    any:
      - all:
          - id: metadata/document/rtf/structure::long-uppercase-control-words
          - id: metadata/document/rtf/ole::hex-object-data-stream
      - all:
          - id: metadata/document/rtf/structure::object-control-numeric-parameter
          - id: metadata/document/rtf/ole::objdata-hex-mixed-with-bin
      - all:
          - id: metadata/document/rtf/ole::objclass-name-hex-escaped
          - id: metadata/document/rtf/ole::objupdate
