# Embedded-object payloads concealed by RTF syntax no writer produces:
# upper-case filler control words, parameters on parameterless object
# controls, raw `\bin` bytes spliced into hex, escaped class names. Each
# keeps the object loading in Word while breaking scanners that read the
# object declaration or the hex run literally. Two of these together (or one
# with a forced `\objupdate`) on a document that declares an object is the
# concealment, not an odd writer.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1027

traits:
  - id: rtf-forced-update-with-invalid-parameter
    desc: RTF object update has a numeric parameter
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      regex: '\\objupdate[0-9]{4,16}\b'

  - id: rtf-repeated-versionless-headers
    desc: RTF contains repeated versionless headers
    crit: suspicious
    conf: 0.95
    count_min: 3
    if:
      type: raw
      regex: '\\rtf[\\{} \t\r\n]'

composite_rules:
  - id: rtf-link-update-hides-invalid-parameter
    desc: RTF inserts an invalid parameter into a forced linked-object update
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/document/rtf/ole::object-data-control-feature
      - id: metadata/document/rtf/ole::objautlink
      - id: rtf-forced-update-with-invalid-parameter

  - id: rtf-activex-behind-versionless-headers
    desc: RTF uses repeated versionless headers to hide a forced ActiveX update
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/document/rtf/ole::activex-objocx-feature
      - id: metadata/document/rtf/ole::object-data-control-feature
      - id: metadata/document/rtf/ole::objupdate
      - id: rtf-repeated-versionless-headers

  - id: rtf-object-concealed-by-invalid-controls
    desc: OLE object hidden with malformed RTF controls
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::object-control-feature
    any:
      - id: metadata/document/rtf/structure::long-uppercase-control-words
      - id: metadata/document/rtf/structure::object-control-numeric-parameter
      - id: metadata/document/rtf/ole::objdata-hex-mixed-with-bin
      - id: metadata/document/rtf/ole::objclass-name-hex-escaped
      - id: metadata/document/rtf/ole::objupdate
    needs: 2
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: rtf-auto-updated-object-with-bogus-version
    desc: RTF hides a forced object update behind a bogus version
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/document/rtf/ole::object-control-feature
      - id: metadata/document/rtf/ole::object-data-control-feature
      - id: metadata/document/rtf/ole::objupdate
      - id: objectives/anti-static/obfuscation/document/rtf::rtf-nonstandard-version
