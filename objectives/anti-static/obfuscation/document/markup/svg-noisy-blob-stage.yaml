defaults:
  platforms: [windows, unix]
  for: [svg]
  size_min: 500000
  attack: T1027,T1204

traits:
  - id: svg-noisy-blob-html-stage
    desc: Noisy SVG opens encoded HTML blob
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule svg_noisy_blob_html_stage {
          strings:
            $noise = /var\s+[A-Za-z_][A-Za-z0-9_]{18,}\s*=/
            $click = "onclick=" nocase
            $decode = "atob(" nocase
            $blob = "new Blob(" nocase
            $html = "text/html" nocase
            $open = "window.open(" nocase
            $image = "data:image/" nocase
          condition:
            #noise >= 50 and $click and $decode and $blob and $html and $open and $image
        }
