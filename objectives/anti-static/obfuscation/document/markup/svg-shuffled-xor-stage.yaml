defaults:
  platforms: [windows, unix]
  for: [svg]
  size_min: 100000
  attack: T1027,T1204

traits:
  - id: svg-shuffled-xor-html-stage
    desc: SVG reconstructs XOR HTML from shuffled chunks
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule svg_shuffled_xor_html_stage {
          strings:
            $chunk = /'[A-Za-z0-9+\/]{60,100}'/
            $decode = "atob(" nocase
            $xor = "charCodeAt(" nocase
            $operator = "^"
            $dynamic = "String.fromCharCode"
            $listener = "document.addEventListener"
            $typed = "Uint8Array"
            $timer = "setTimeout"
            $click = /addEventListener\s*\(\s*["']click["']/
            $blob = "new Blob(" nocase
            $html = "text/html" nocase
            $open = "window.open(" nocase
            $image = "data:image/" nocase
          condition:
            #chunk >= 350 and $xor and $operator and $image and
            (($decode and $click and $blob and $html and $open) or
             ($dynamic and $listener and $typed and $timer))
        }
