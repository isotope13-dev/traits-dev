defaults:
  platforms: [windows, unix]
  for: [svg]
composite_rules:
  - id: svg-layered-url-reconstruction
    desc: SVG combines fragment reversal, Base64 and XOR with navigation
    crit: suspicious
    conf: 0.96
    attack: T1027,T1140
    near_bytes: 1800
    all:
      - id: micro-behaviors/data/string/reverse::svg-split-reverse-join
      - id: micro-behaviors/data/decode/base64/call::base64-decode-call-text
      - id: micro-behaviors/data/encoding/xor/cyclic-key::svg-modulo-key-xor-assignment
      - id: micro-behaviors/communications/url/navigation-http::svg-location-variable-assignment
