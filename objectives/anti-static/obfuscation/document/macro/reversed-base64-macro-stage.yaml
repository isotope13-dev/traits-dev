# The second stage rides inside the macro's own string literals as
# reversed base64 (decoding, reversed, to `regsvr32 c:\...`), assembled
# and written out by an auto-run macro: the document carries the stage
# with no readable command in it.
defaults:
  platforms: [windows]
  for: [vbs, ooxml, oledoc]
  attack: T1027,T1140
composite_rules:
  - id: autorun-macro-carries-reversed-base64-stage
    desc: Auto-run macro carries reversed base64 stage
    crit: hostile
    conf: 0.94
    # The macro is split across VBA modules; join them at the document.
    scope: archive
    all:
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl
      - id: objectives/anti-static/obfuscation/string/reverse::base64-reversed-regsvr32-drive-command
      - id: micro-behaviors/data/string/reverse::strreverse-invocation
