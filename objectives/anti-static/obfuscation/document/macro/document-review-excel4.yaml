defaults:
  crit: hostile
  for: [documents]
  platforms: [windows]
composite_rules:
  - id: local-header-only-high-entropy-xlm
    for: [ooxml]
    desc: High-entropy XLM workbook without ZIP end record
    conf: 0.97
    attack: T1204.002
    all:
      - id: objectives/anti-static/obfuscation/document/macro::local-header-only-xlm-container
      - id: metadata/document/office/macro::macro-enabled-extension
      - id: metadata/document/office/markup::ooxml-very-high-entropy-body
  - id: truncated-eocd-macro-enabled-xlm
    for: [ooxml]
    desc: Macro-enabled XLM workbook with truncated ZIP end record
    conf: 0.97
    attack: T1204.002
    all:
      - id: objectives/anti-static/obfuscation/document/macro::truncated-eocd-xlm-container
      - id: metadata/document/office/macro::macro-enabled-extension
  - id: excel4-obfuscated-dispatch-environment
    for: [ooxml]
    desc: Obfuscated XLM macro dispatch with environment checks
    conf: 0.99
    all:
      - id: metadata/document/office/macro::run-dispatch-chain
      - id: objectives/anti-static/obfuscation/document/macro::excel4-style-keyed-char-obfuscation
    any:
      - id: objectives/anti-analysis/timing/document::excel4-day-keyed-decryption
      - id: objectives/anti-analysis/sandbox-detect/document::excel4-environment-keyed-macro
