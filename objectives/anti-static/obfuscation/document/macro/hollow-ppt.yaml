defaults:
  platforms: [windows, unix]
  for: [ooxml]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: hollow-ppt-vba-addin
    desc: Hollow PowerPoint add-in with renamed VBA
    crit: hostile
    conf: 0.97
    size_min: 2048
    size_max: 65536
    all:
      - id: metadata/document/office/markup::ooxml-zero-byte-member
      - id: metadata/document/office/macro::ppt-vba-declared-macro
      - id: metadata/document/office/macro::ooxml-vba-nonstandard-part
      - id: metadata/document/office/markup::ooxml-compact-package
