# A macro project inside an OLE container that a structure parser rejects.
# Excel and Word repair many damaged files, and truncated legacy workbooks
# look the same, so the pairing is suspicious: it hides the VBA project from
# parser-based rules, but it does not prove malice.
composite_rules:
  - id: damaged-ole-vba-container
    for: [oledoc]
    platforms: [windows]
    desc: Damaged OLE container holds a VBA project storage
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/document/ole::ole-vba-project-storage-utf16
      - id: metadata/document/ole::ole-parse-error
