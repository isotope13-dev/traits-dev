# Excel 4.0 macrosheet formulas that join one string literal directly to
# another in the middle of a word ("Sta"&"rtup", "savetofi"&"le",
# "Creat"&"eObj"&"ect"). Literal-to-literal concatenation computes nothing;
# its only effect is to keep keywords, paths and ProgIDs out of plain view.
defaults:
  for: [xml]
  platforms: [windows]
  attack: T1027
  mbc: E1027

traits:
  - id: excel4-midword-literal-concatenation
    desc: XLM splits words across concatenated literals
    crit: suspicious
    conf: 0.9
    count_min: 6
    if:
      type: text
      # A letter, a closing quote, `&` (escaped as &amp; in the XML part),
      # an opening quote and another letter: a word broken across literals.
      # Doubled quotes ("") cover literals nested in FWRITELN text.
      regex: '[A-Za-z]"{1,2}\s{0,2}&amp;\s{0,2}"{1,2}[A-Za-z]'

composite_rules:
  - id: excel4-split-literal-script-writer
    desc: XLM writes file text hidden in split literals
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/document/office/macro::excel4-macrosheet-xml-root
      - id: micro-behaviors/fs/write/file/full/string::excel4-fopen-fwriteln-text-file
      - id: excel4-midword-literal-concatenation
