# Writing `"=RE" & x & "RN()"` into a runtime-created Excel 4.0 macro sheet
# keeps the XLM RETURN keyword out of the VBA source.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1027

composite_rules:
  - id: vba-split-xlm-keyword-macro-sheet
    desc: Splits XLM keywords for a macro sheet
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/lang/source/syntax/operator::vba-formula-prefix-concatenation
      - id: micro-behaviors/data/collection/create::excel4-macro-sheet-creation
