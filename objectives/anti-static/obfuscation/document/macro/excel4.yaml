defaults:
  for: [documents]
  platforms: [windows]
composite_rules:
  - id: excel4-style-keyed-char-obfuscation
    for: [ooxml]
    desc: XLM style-keyed CHAR obfuscation
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/document/office/macro::excel4-ooxml-macrosheet
      - id: metadata/document/office/markup::excel-veryhidden-sheet-metric
      - id: metadata/document/office/macro::excel4-auto-open-name
      - id: metadata/document/office/macro::char-obfuscation-burst
      - id: metadata/document/office/macro::get-cell-style-keying
      - id: metadata/document/office/macro::formula-fill-runtime-write
