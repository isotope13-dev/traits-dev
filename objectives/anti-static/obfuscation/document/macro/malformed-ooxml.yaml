defaults:
  platforms: [unix, windows]
  for: [ooxml]
  attack: T1027
  mbc: B0032
composite_rules:
- id: malformed-high-entropy-ooxml
  desc: Malformed high-entropy OOXML
  crit: suspicious
  conf: 0.94
  unless:
  - id: metadata/package/testing/presence/harness::test-directory-path
  - id: metadata/package/testing/presence/path::ooxml-test-data-path
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/markup::ooxml-small-high-entropy-body
- id: malformed-excel-macro-container
  desc: Malformed macro-enabled Excel container
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::raw-excel-macro-capable-document
- id: local-header-only-xlm-container
  desc: XLM workbook omits the ZIP end record to prevent parsing
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::excel4-macrosheet-part
  unless:
  - id: metadata/document/office/markup::ooxml-eocd-record
- id: truncated-eocd-xlm-container
  desc: XLM workbook truncates the ZIP end record to prevent parsing
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::excel4-macrosheet-part
  - id: metadata/document/office/markup::ooxml-one-byte-truncated-eocd
- id: obfuscated-ooxml-executable-storage
  desc: Obfuscated OOXML executable storage
  crit: suspicious
  conf: 0.96
  unless:
  - id: well-known/tool/offensive/metasploit::framework-context
  all:
  - id: metadata/document/office/markup::ooxml-long-archive-member-name
  - id: metadata/document/office/markup::ooxml-hidden-dot-member
  - id: metadata/document/office/markup::ooxml-embedded-native-executable

# A macro-capable workbook whose ZIP end record is one byte short.
#
# Not corruption: it is calibrated. Excel's repair path accepts the file and
# opens it; a zip library rejects it outright, and so does anything built on
# one. The single missing byte is the whole technique -- it costs the attacker
# nothing and costs an analysis pipeline the entire file.
#
# The sibling rule above wants an `excel4-macrosheet-part`, which is read from
# the parsed package. On a file this broken there is no parsed package, so the
# macro evidence has to come from the raw scan instead -- which is exactly the
# condition the truncation creates.
- id: one-byte-truncated-macro-workbook
  desc: Macro workbook truncates its ZIP end record
  crit: hostile
  conf: 0.96
  attack: T1204.002,T1027
  all:
  - id: metadata/document/office/markup::ooxml-one-byte-truncated-eocd
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::raw-excel-macro-capable-document
  - id: metadata/document/office/macro::macro-enabled-extension
