defaults:
  platforms: [unix, windows]
  for: [ooxml]
  attack: T1027
  mbc: B0032
composite_rules:
- id: malformed-high-entropy-ooxml
  desc: Malformed high-entropy OOXML
  crit: suspicious
  conf: 0.94
  unless:
  - id: metadata/package/testing/presence/fixture::ooxml-test-data-path
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/markup::ooxml-small-high-entropy-body
- id: malformed-excel-macro-container
  desc: Malformed macro-enabled Excel container
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::raw-excel-macro-capable-document
- id: local-header-only-xlm-container
  desc: XLM workbook omits the ZIP end record to prevent parsing
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::excel4-macrosheet-part
  unless:
  - id: metadata/document/office/markup::ooxml-eocd-record
- id: truncated-eocd-xlm-container
  desc: XLM workbook truncates the ZIP end record to prevent parsing
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::excel4-macrosheet-part
  - id: metadata/document/office/markup::ooxml-one-byte-truncated-eocd
- id: obfuscated-ooxml-executable-storage
  desc: Obfuscated OOXML executable storage
  crit: suspicious
  conf: 0.96
  unless:
  - id: well-known/tool/offensive/metasploit::framework-context
  all:
  - id: metadata/document/office/markup::ooxml-long-archive-member-name
  - id: metadata/document/office/markup::ooxml-hidden-dot-member
  - id: metadata/document/office/markup::ooxml-embedded-native-executable
