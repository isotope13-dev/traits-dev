defaults:
  for: [oledoc]
  platforms: [windows]
  attack: T1027

composite_rules:
  # Encryption is normal for confidential workbooks, so require an observable
  # VBA operation as well. This reports concealment plus the operation without
  # claiming an auto-open trigger or an unobserved payload.
  - id: encrypted-excel-vba-saveas
    desc: Encrypted Excel VBA names a SaveAs output
    crit: suspicious
    conf: 0.86
    all:
      - id: metadata/document/office/macro::encrypted-excel-vba-workbook
      - id: micro-behaviors/fs/write/file/direct::vba-workbook-saveas

  - id: encrypted-excel-vba-excel4-evaluator
    desc: Encrypted Excel VBA invokes legacy macro evaluator
    crit: suspicious
    conf: 0.86
    all:
      - id: metadata/document/office/macro::encrypted-excel-vba-workbook
      - id: micro-behaviors/process/create/macro/office::vba-execute-excel4macro
