defaults:
  platforms: [unix]
  for: [shell, scripts]
  attack: T1027,T1140
composite_rules:
  - id: shell-openssl-decrypt-with-fragmented-commands-and-hex
    desc: Shell assembles commands, hex blob, openssl decrypt
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::openssl-cli-aes-stream-decrypt
      - id: micro-behaviors/process/create/shell/spawn::sh-dynamic-command-target
      - id: metadata/lang/encoded/hex::long-hex-string-literal
