# Renamed decryption code in a compiled Go program. Function names reduced to
# twelve-hex-digit hashes have no benign population we could find (none in a
# 5.4G Go module corpus or in the local Go binaries), and when one of those
# renamed helpers is typed over an AEAD or block cipher the hidden code is a
# decryptor: the shape of a loader that unpacks an encrypted second stage.
# Seen in the gocommunity-io dockerd Terraform provider 4.5.3+ release
# binaries, whose loader AES-GCM-decrypts a bundled zip and `go run`s it.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  attack: T1027,T1140

composite_rules:
  - id: go-hash-named-decryption-helper
    desc: Go binary hides a decryptor behind hash-renamed code
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/variables::go-binary-hash-named-cipher-helper
      - id: objectives/anti-static/obfuscation/name-mangling/variables::go-binary-hash-named-functions
