defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1140
composite_rules:
  - id: wsh-js-split-member-names-with-xor-decoder-and-decrypt
    desc: WSH JScript splits member names, XOR decodes, decrypts
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/lang/runtime::wscript-host-reference
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-split-literal-member-name
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
      - id: metadata/file/function::decrypt-named-function
