# A page that ships as a multi-kilobyte base64 ciphertext plus the key to
# open it and writes the AES-decrypted result into the document: the markup
# is withheld from static scanners only, since every visitor gets the key.
# Used by phishing kits to hide cloned login pages.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: inline-key-aes-ciphertext-page-writer
    desc: Writes page decrypted from inline AES ciphertext
    crit: hostile
    conf: 0.94
    attack: T1027.013
    all:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::veness-aes-ctr-decrypt-call
      - id: micro-behaviors/ui/window/insert-html::decrypted-output-document-write
      - id: metadata/file/encoding/shape::large-base64-compatible-string-assignment
