defaults:
  platforms: [unix, windows]
  for: [python]
# Generic Python String Decryptor
# Detects Python scripts that combine XOR decryption with string extraction logic
# ATT&CK: T1027 (Obfuscated Files or Information)
composite_rules:
- id: python-xor-string-search
  desc: Python script performing XOR decryption and string search
  crit: suspicious
  conf: 0.8
  attack: T1027
  near_bytes: 4096
  all:
      # Core mechanism: XOR decoding
  - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      # Require a content-read API, not merely an open in read mode.
  - id: micro-behaviors/fs/read/file/full::python-file-content-read-operation
      # String search: a printable-character check on the decoded bytes. A bare
      # `for i in range(len(data))` loop is not enough; it matched a block-file
      # XOR helper sitting beside an unrelated chunked hash read.
  - id: micro-behaviors/data/string/compare::python-printable-ascii-range-test
    # Downgrade for likely benign scripts (e.g., educational or utility scripts that are explicitly named as decoders/tools but not malicious)
    # However, this combination is rare in benign code unless it's a security tool.
  downgrade:
    any:
    - id: analysis-tool-basename
  unless:
    - id: well-known/tool/reverse-engineering/ghidra/
    - id: python-decrypt-cipher-enum-schema
traits:
- id: python-decrypt-cipher-enum-schema
  desc: Multi-cipher decrypt tool enum schema
  crit: component
  conf: 0.6
  if:
    type: text
    substr: '"enum": ["aes-cbc", "aes-ecb", "aes-gcm", "des", "rc4", "xor", "b64", "rot13"]'
- id: analysis-tool-basename
  desc: Analysis-tool basename
  crit: component
  conf: 0.3
  if:
    type: basename
    regex: "(?i)decode|decrypt|analy[sz]|extract|encoded[_-]?blobs?"
