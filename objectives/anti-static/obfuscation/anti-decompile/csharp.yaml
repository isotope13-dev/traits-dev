defaults:
  for:
  - csharp
  platforms:
  - windows
  mbc: B0032
traits:
- id: suppress-ildasm
  desc: SuppressIldasm anti-disassembly attribute
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: SuppressIldasm
  unless:
  - id: well-known/tool/development/toolchain/roslyn/
  - type: text
    substr: SuppressIldasmAttributeDiagId
  - type: text
    substr: LIB0024
  - id: well-known/lib/ui/spectre-console/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: suppress-ildasm-managed-pe
  desc: SuppressIldasm attribute in managed PE
  crit: notable
  conf: 0.95
  attack: T1027
  for:
  - pe
  - dll
  if:
    type: yara
    source: |
      rule suppress_ildasm_managed_pe {
        strings:
          $clr = "BSJB" ascii
          // ASCII only: the attribute name appears as an identifier in the
          // managed #Strings heap. The .NET runtime's resource messages
          // mention the name in prose as UTF-16 ("...SuppressIldasmAttribute
          // has..."), and its diagnostic literals ("SuppressIldasmAttribute
          // DiagId") are excluded by the trailing non-word requirement.
          $marker = /SuppressIldasmAttribute([^A-Za-z0-9_]|$)/ ascii
        condition:
          $clr and $marker
      }
  unless:
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/signed/platform::microsoft
  - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
  - id: well-known/tool/development/toolchain/roslyn::roslyn-runtime-assembly
  - id: metadata/binary/framework::dotnet-singlefilehost-pdb
  - id: well-known/app/security/adguard-vpn::benign-context
  - id: well-known/lib/ai/argutrack-dnn::official-runtime-binary
- id: zero-width-identifier-marker-206d
  desc: Repeated U+206D markers in C# source
  crit: suspicious
  conf: 0.97
  attack: T1027
  count_min: 2
  if:
    type: hex
    pattern: E2 81 AD
  unless:
  - id: metadata/file/invisible-unicode::naughty-strings-sample-text
  - id: metadata/package/testing/
- id: zero-width-identifier-marker-206f
  desc: Repeated U+206F markers in C# source
  crit: suspicious
  conf: 0.97
  attack: T1027
  count_min: 2
  if:
    type: hex
    pattern: E2 81 AF
  unless:
  - id: metadata/file/invisible-unicode::naughty-strings-sample-text
  - id: metadata/package/testing/
composite_rules:
- id: unsigned-managed-anti-analysis-obfuscation
  desc: Unsigned managed PE hides code and blocks analysis
  crit: suspicious
  conf: 0.98
  attack: T1027,T1622,T1036.005
  for:
  - pe
  - dll
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/code/entropy::code-region-entropy-78
  - id: metadata/build/protector::suppress-ildasm-managed-pe-string
  - id: metadata/build/manifest::pe-manifest-myapplication-template
  - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
  unless:
  - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/app
  - id: well-known/tool/reverse-engineering/
- id: zero-width-opaque-inno-payload
  desc: Zero-width obfuscated Inno payload
  crit: hostile
  conf: 0.99
  attack: T1027,T1027.009
  for:
  - pe
  all:
  - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206d
  - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206f
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
- id: zero-width-reflective-resource-loader
  desc: Zero-width-obfuscated reflective resource loader
  crit: suspicious
  conf: 0.99
  for:
  - pe
  - dll
  attack: T1027,T1027.009,T1620
  all:
  - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206d
  - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206f
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/metaprogramming/reflection::get-method-token
  - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-token
- id: unsigned-zero-width-singlefile-overlay-carrier
  desc: Unsigned single-file .NET host with zero-width IDs and dominant overlay
  crit: hostile
  conf: 0.98
  attack: T1027,T1027.009,T1036.005
  for:
  - pe
  all:
  - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206d
  - id: metadata/file/profile/token-population::managed-pe-format-marker-population-206f
  - id: metadata/binary/layout/overlay::overlay-dominates-80pct
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-unsigned-filename-mismatch
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
