# C# anti-decompilation and anti-disassembly
defaults:
  for: [csharp]
  platforms: [windows]
  mbc: "B0032"
traits:
  - id: suppress-ildasm
    desc: SuppressIldasm anti-disassembly attribute
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "SuppressIldasm"
    unless:
    # Roslyn's MetadataAsSource feature names the attribute because it
    # must render assemblies that carry it.
      - id: well-known/tool/development/toolchain/roslyn/
      - type: text
        substr: "SuppressIldasmAttributeDiagId"
      - type: text
        substr: "LIB0024"
      - id: well-known/lib/ui/spectre-console/
      # A compiler's own test corpus names the attribute it implements:
      # dotnet-roslyn v4.0.1 carries SuppressIldasm under
      # src/Compilers/.../Test/ because emitting it is a feature it must test.
      - id: metadata/package/testing/
  # Same observation as `suppress-ildasm-managed-pe-string` below, read
  # through YARA, and pitched the same: applying SuppressIldasm is what every
  # commercial obfuscator does. This rule was unreachable until inline YARA
  # started evaluating (2026-09); on first contact it flagged a CNET-hosted
  # freeware installer and a phone-flashing utility.
      - id: "metadata/file/naming::test-directory-component"
  - id: suppress-ildasm-managed-pe
    desc: SuppressIldasm attribute in managed PE
    crit: notable
    conf: 0.95
    attack: T1027
    for: [pe, dll]
    if:
      type: yara
      source: |
        rule suppress_ildasm_managed_pe {
          strings:
            $clr = "BSJB" ascii
            // ASCII only: the attribute name appears as an identifier in the
            // managed #Strings heap. The .NET runtime's resource messages
            // mention the name in prose as UTF-16 ("...SuppressIldasmAttribute
            // has..."), and its diagnostic literals ("SuppressIldasmAttribute
            // DiagId") are excluded by the trailing non-word requirement.
            $marker = /SuppressIldasmAttribute([^A-Za-z0-9_]|$)/ ascii
          condition:
            $clr and $marker
        }
    unless:
      # Microsoft-signed framework assemblies expose this attribute as normal
      # CLR metadata/API surface; that string is not an anti-decompilation use.
      # Prefer leaf signer over platform::microsoft — .NET facade assemblies
      # (System.Runtime.dll) are leaf-signed CN=Microsoft but often lack the
      # full platform::microsoft verification composite.
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
      - id: well-known/tool/development/toolchain/roslyn::roslyn-runtime-assembly
      - id: metadata/binary/framework::dotnet-singlefilehost-pdb
      - id: well-known/app/security/adguard-vpn::benign-context
      - id: well-known/lib/ai/argutrack-dnn::official-runtime-binary

  # Some CLR metadata readers expose the #Strings stream but do not expose
  # the BSJB marker to the YARA backend. Keep the same observation available
  # as an extracted-string atom, scoped to managed PE analysis.
  - id: zero-width-identifier-marker-206d
    desc: Repeated U+206D markers in C# source
    crit: suspicious
    conf: 0.97
    attack: T1027
    count_min: 2
    if:
      type: hex
      pattern: 'E2 81 AD'
  - id: zero-width-identifier-marker-206f
    desc: Repeated U+206F markers in C# source
    crit: suspicious
    conf: 0.97
    attack: T1027
    count_min: 2
    if:
      type: hex
      pattern: 'E2 81 AF'

  # PE overlays are arbitrary embedded data; the marker bytes are meaningful
  # as obfuscated identifiers only when the PE also has a CLR metadata stream.
  # Raw-byte hits also collide with compressed blobs: a 16 MiB high-entropy
  # .text holds ~1 E2 81 AD triple by chance, so >= 2 is noise bandwidth.
  # ConfuserEx renames every identifier (dozens of markers per alphabet),
  # so require >= 10 to keep the atom above random-collision range.
  - id: zero-width-managed-pe-marker-206d
    desc: Repeated U+206D markers in managed PE
    crit: suspicious
    conf: 0.97
    attack: T1027
    for: [pe, dll]
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206d {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AD }
          condition:
            $clr and #marker >= 10
        }

  # Same collision floor as the 206D twin above: raw E2 81 AF triples
  # occur by chance in high-entropy sections, so keep both atoms at >= 10.
  - id: zero-width-managed-pe-marker-206f
    desc: Repeated U+206F markers in managed PE
    crit: suspicious
    conf: 0.97
    attack: T1027
    for: [pe, dll]
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206f {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AF }
          condition:
            $clr and #marker >= 10
        }

composite_rules:
  - id: unsigned-managed-anti-analysis-obfuscation
    desc: Unsigned managed PE hides code and blocks analysis
    crit: suspicious
    conf: 0.98
    attack: T1027,T1622,T1036.005
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/code/entropy::code-region-entropy-78
      - id: metadata/build/protector::suppress-ildasm-managed-pe-string
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/reverse-engineering/
  - id: zero-width-opaque-inno-payload
    desc: Zero-width obfuscated Inno payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1027.009
    for: [pe]
    all:
      - id: zero-width-managed-pe-marker-206d
      - id: zero-width-managed-pe-marker-206f
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation

  # ConfuserEx's rename + resource-protection output: zero-width identifiers,
  # an AssemblyResolve hook, and code decrypted from a manifest resource and
  # invoked by metadata token. That hides what the assembly does -- suspicious
  # -- but it is equally the shape of a freeware tool its author protected
  # (WFA installer's vhdxtool.exe), so it does not convict on its own. The
  # sibling Inno rule above adds the opaque overlay that makes it a dropper.
  - id: zero-width-reflective-resource-loader
    desc: Zero-width-obfuscated reflective resource loader
    crit: suspicious
    conf: 0.99
    for: [pe, dll]
    attack: T1027,T1027.009,T1620
    all:
      - id: zero-width-managed-pe-marker-206d
      - id: zero-width-managed-pe-marker-206f
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/metaprogramming/reflection::get-method-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-token

  - id: unsigned-zero-width-singlefile-overlay-carrier
    desc: Unsigned single-file .NET host with zero-width IDs and dominant overlay
    crit: hostile
    conf: 0.98
    attack: T1027,T1027.009,T1036.005
    for: [pe]
    all:
      - id: zero-width-managed-pe-marker-206d
      - id: zero-width-managed-pe-marker-206f
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-unsigned-filename-mismatch
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
