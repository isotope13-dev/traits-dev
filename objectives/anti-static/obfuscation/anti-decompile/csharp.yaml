# C# anti-decompilation and anti-disassembly
defaults:
  for: [csharp]
  platforms: [windows]
  mbc: "B0032"
traits:
  - id: suppress-ildasm
    desc: SuppressIldasm anti-disassembly attribute
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "SuppressIldasm"
    unless:
      - type: text
        substr: "SuppressIldasmAttributeDiagId"
      - type: text
        substr: "LIB0024"
      - id: well-known/lib/core/spectre-console/

  - id: suppress-ildasm-managed-pe
    desc: SuppressIldasm attribute in managed PE
    crit: suspicious
    conf: 0.95
    attack: T1027
    for: [pe, dll]
    if:
      type: yara
      source: |
        rule suppress_ildasm_managed_pe {
          strings:
            $clr = "BSJB" ascii
            $marker = "SuppressIldasm" ascii wide
          condition:
            $clr and $marker
        }
    unless:
      # Microsoft-signed framework assemblies expose this attribute as normal
      # CLR metadata/API surface; that string is not an anti-decompilation use.
      # Prefer leaf signer over platform::microsoft — .NET facade assemblies
      # (System.Runtime.dll) are leaf-signed CN=Microsoft but often lack the
      # full platform::microsoft verification composite.
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/runtime/dotnet-runtime::framework-reference-assembly-context
      - id: well-known/tool/development/roslyn::roslyn-runtime-assembly
      - id: well-known/app/security/adguard-vpn::benign-context
      - id: well-known/lib/ai/argutrack-dnn::official-runtime-binary

  # Some CLR metadata readers expose the #Strings stream but do not expose
  # the BSJB marker to the YARA backend. Keep the same observation available
  # as an extracted-string atom, scoped to managed PE analysis.
  - id: suppress-ildasm-managed-pe-string
    desc: SuppressIldasm name in managed PE strings
    # SuppressIldasmAttribute is a documented .NET Framework attribute, and
    # applying it is what every commercial obfuscator and IP-protected
    # component does -- the growing vendor allowlist below is the symptom.
    # It is anti-decompilation *tooling* context; the composites that pair it
    # with packed resources or reflective staging carry the verdict.
    crit: notable
    conf: 0.95
    attack: T1027
    for: [pe, dll]
    if:
      type: text
      exact: SuppressIldasmAttribute
    unless:
      # Microsoft-signed framework assemblies expose this attribute as normal
      # CLR metadata/API surface; that string is not an anti-decompilation use.
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/runtime/dotnet-runtime::framework-reference-assembly-context
      - id: well-known/tool/development/roslyn::roslyn-runtime-assembly
      # YARA's malformed managed-PE corpus deliberately contains CLR marker
      # strings; its test fixtures are not managed anti-analysis payloads.
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/app/security/adguard-vpn::benign-context
      - id: well-known/lib/ai/argutrack-dnn::official-runtime-binary
      - id: well-known/tool/sysadmin/chocolatey::official-library-pe-context

  - id: zero-width-identifier-marker-206d
    desc: Repeated U+206D markers in C# source
    crit: suspicious
    conf: 0.97
    attack: T1027
    count_min: 2
    if:
      type: hex
      pattern: 'E2 81 AD'
  - id: zero-width-identifier-marker-206f
    desc: Repeated U+206F markers in C# source
    crit: suspicious
    conf: 0.97
    attack: T1027
    count_min: 2
    if:
      type: hex
      pattern: 'E2 81 AF'

  # PE overlays are arbitrary embedded data; the marker bytes are meaningful
  # as obfuscated identifiers only when the PE also has a CLR metadata stream.
  - id: zero-width-managed-pe-marker-206d
    desc: Repeated U+206D markers in managed PE
    crit: suspicious
    conf: 0.97
    attack: T1027
    for: [pe, dll]
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206d {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AD }
          condition:
            $clr and #marker >= 2
        }

  - id: zero-width-managed-pe-marker-206f
    desc: Repeated U+206F markers in managed PE
    crit: suspicious
    conf: 0.97
    attack: T1027
    for: [pe, dll]
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206f {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AF }
          condition:
            $clr and #marker >= 2
        }

composite_rules:
  - id: unsigned-managed-anti-analysis-obfuscation
    desc: Unsigned managed PE hides code and blocks analysis
    crit: hostile
    conf: 0.98
    attack: T1027,T1622,T1036.005
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: suppress-ildasm-managed-pe-string
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary::dotnet-template-product-identity-context
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/reverse-engineering/
  - id: zero-width-opaque-inno-payload
    desc: Zero-width obfuscated Inno payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1027.009
    for: [pe]
    all:
      - id: zero-width-managed-pe-marker-206d
      - id: zero-width-managed-pe-marker-206f
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation

  - id: zero-width-reflective-resource-loader
    desc: Zero-width-obfuscated reflective resource loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1027.009,T1620
    all:
      - id: zero-width-identifier-marker-206d
      - id: zero-width-identifier-marker-206f
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: metadata/lang/compiler/managed::get-method-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-token
