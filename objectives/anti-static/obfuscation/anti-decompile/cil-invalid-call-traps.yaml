defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # br.s skips an invalid call token followed by a null-array dereference.
  # The following constant-false branch points back into that trap. The call
  # token's high byte is outside MethodDef, MemberRef and MethodSpec tables;
  # no method name, token row, protector identity or fixed offset is required.
  # Repetition distinguishes deliberate decompiler obstruction from data.
  - id: cil-skipped-invalid-call-traps
    desc: Repeated skipped CIL calls with invalid tokens
    crit: suspicious
    conf: 0.98
    attack: T1027
    count_min: 3
    if:
      type: hex
      section: .text
      pattern: '2B 09 28 ?? ?? ?? (3?|4?|5?|6?) 14 16 9A 26 16 2D F9'
