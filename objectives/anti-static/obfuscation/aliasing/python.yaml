# Evasive Module Aliasing Detection
# Multiple sensitive stdlib modules aliased together is a deliberate-obscuring
# signal. The neutral per-module "imported under an alias" observations are
# import declarations and live in metadata/import/builtin/
# (a single aliased import is normal Python); this composite combines them.
defaults:
  crit: notable
  conf: 0.7
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: evasive-module-aliasing
    desc: Multiple sensitive stdlib imports aliased
    needs: 3
    any:
      - id: metadata/import/builtin::alias-os
      - id: metadata/import/builtin::alias-subprocess
      - id: metadata/import/builtin::alias-base64
  - id: evasive-module-aliasing-recon
    desc: Multiple recon stdlib imports aliased
    needs: 3
    any:
      - id: metadata/import/builtin::alias-platform
      - id: metadata/import/builtin::alias-getpass
      - id: metadata/import/builtin::alias-urllib
