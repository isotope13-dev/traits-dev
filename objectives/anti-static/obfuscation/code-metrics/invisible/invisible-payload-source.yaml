# A source file that is mostly invisible characters.
#
# Variation selectors and the other zero-width blocks render as nothing, so a
# file carrying a payload in them looks normal in an editor, diffs as a single
# changed line, and greps as ordinary text. What it cannot hide is its own
# statistics: the compromised miso-client release ships a `dist` module whose
# byte content is overwhelmingly non-ASCII and whose invisible-character count
# is in the thousands, in a file whose visible source is a few lines of
# JavaScript.
#
# This is a measurement, not a pattern match, and that is the point. The
# supply-chain rule for this incident keys on the decoder -- the codepoint
# arithmetic that turns selectors back into bytes -- so it depends on the
# decoder being written the expected way. A future variant can restructure or
# minify the decoder, or hide the payload in a different invisible block, and
# the ratio still gives it away. Anything genuinely needing this much
# non-ASCII text is carrying human language, and it does not then eval it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.013
  mbc: F0001

composite_rules:
  - id: invisible-character-payload-source
    desc: Source is mostly invisible characters
    crit: hostile
    conf: 0.95
    # The eval is what separates a payload from a file that legitimately holds
    # a lot of non-Latin text.
    all:
      - id: objectives/anti-static/obfuscation/code-metrics/source::high-non-ascii-ratio
      - id: metadata/file/invisible-unicode::multiple
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-buffer-from-argument
