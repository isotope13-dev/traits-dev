defaults:
  platforms: [windows, unix]
  for: [scripts, pe, elf, macho]
  attack: T1027
  mbc: B0032

traits:
  - id: many-anonymous-functions
    desc: Many anonymous source function definitions
    crit: baseline
    conf: 0.75
    for: [javascript, typescript]
    size_max: 500000
    unless:
      - type: basename
        regex: '^terminal\.[jt]s$'
      - type: basename
        regex: '^windows(Terminal|PtyAgent)\.js$'
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/
      - type: metrics
        field: imports.count
        min: 100
      # Readable code (generous whitespace) with many callbacks/handlers is
      # ordinary structure, not obfuscation — obfuscated code is dense.
      - type: metrics
        field: text.whitespace_ratio
        min: 0.14
    if:
      type: metrics
      field: functions.anonymous
      min: 35

  - id: many-one-liner-functions
    desc: Many one-line source function definitions
    crit: baseline
    conf: 0.7
    size_max: 500000
    unless:
      - id: metadata/build/
      - id: metadata/lang/generated::python-protobuf-stub
      - id: well-known/lib/web/
      - id: metadata/file/extension/identity::python-type-stub-extension
      - type: metrics
        field: imports.count
        min: 100
    if:
      type: metrics
      field: functions.one_liners
      min: 15
      min_size: 1024

  - id: deep-nesting
    desc: Deep function nesting
    crit: baseline
    conf: 0.75
    unless:
      - id: metadata/build/
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/lib/data/influxdb3-js
      - id: well-known/lib/format/protobuf-ts
      - id: well-known/lib/data/apache-arrow
      # Readable code (generous whitespace) reaching depth 5 via promise/handler
      # chains is ordinary structure, not obfuscation.
      - type: metrics
        field: text.whitespace_ratio
        min: 0.14
    if:
      type: metrics
      field: functions.max_nesting_depth
      min: 5

  - id: compact-tool-basename
    desc: Compact utility module basename
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: path
      basename: true
      regex: ^(rimraf|run-(script-)?os|ipv6(grep)?)$

composite_rules:
  - id: many-anonymous-functions-recognized-marker
    desc: Recognized anonymous-function bundle marker
    crit: component
    conf: 1.0
    any:
      - id: well-known/lib/web/wordpress-core::wordpress-block-build-asset
      - id: well-known/lib/ui/presentation::photoswipe-dynamic-caption-bundle
      - id: well-known/lib/ui/presentation::photoswipe-lightbox-bundle
  - id: one-liner-recognized-marker
    desc: Generated or bundled one-liner marker
    crit: component
    conf: 1.0
    any:
      - id: metadata/file/format/source-map::sourcemap
      - id: metadata/file/naming::terminal-js-basename
      - id: compact-tool-basename
      - id: metadata/package/testing/harness/runtime::is-test
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/lang/locale::locale-path
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: well-known/lib/web/wordpress-core::wordpress-block-build-asset
      - id: metadata/build/bundler/runtime::webpack-bundled
      - id: steam-trade-content-script-marker
  - id: steam-trade-content-script-marker
    desc: Steam trade extension script marker
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/services/steam::steam-trade-extension-automation
      - id: micro-behaviors/process/inject/webextension::extension-page-script-injection
      - id: micro-behaviors/ui/window/automation::window-postmessage-opnskin
      - id: micro-behaviors/ui/window/automation::steam-confirm-tradeoffer-call
      - id: micro-behaviors/ui/window/automation::steam-trade-confirm-button
      - id: micro-behaviors/communications/http/services/opnskin::opnskin-steam-trade-bridge
      - id: micro-behaviors/communications/http/services/opnskin::opnskin-trade-state-monitor
  - id: dense-single-character-identifiers
    for: [scripts, '!jcl']
    desc: Dense single-character identifiers in obfuscated source
    crit: notable
    conf: 0.85
    all:
      - id: "metadata/file/profile/identifier-population::identifier-entropy-and-reuse-profile"
      - id: "metadata/file/profile/function-population::single-character-function-count"
    unless:
      - id: metadata/build/
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/app/browser/google-web::official-google-web-asset
      - id: well-known/app/ai/browser-agent/open-webui-computer/
