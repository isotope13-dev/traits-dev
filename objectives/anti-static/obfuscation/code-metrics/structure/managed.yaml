defaults:
  crit: suspicious
  conf: 0.94
  for: [pe, dll, csharp]
  platforms: [windows]

traits:
  # Malware builders add dozens of unused, sequentially numbered WinForms
  # controls to inflate metadata and bury the small operational code surface.
  # Ten scrollbars is plausible in a real GUI; thirty is conservatively above
  # that range while retaining the 68-control KPOT-family payload pattern.
  - id: numbered-winforms-scrollbar-spam
    desc: Excessive numbered WinForms scrollbar controls
    count_min: 30
    if:
      type: text
      regex: 'VScrollBar[0-9]+'
