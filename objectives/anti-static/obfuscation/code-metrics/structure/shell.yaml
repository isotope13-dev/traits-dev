defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  attack: T1027
  mbc: B0032
traits:
- id: sh-many-high-entropy-identifiers
  desc: Many high-entropy identifiers in shell
  crit: notable
  conf: 0.85
  size_min: 1024
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.4
  unless:
  - id: metadata/build/conda/
  - id: metadata/build/config::prefix-token-reference
  - type: metrics
    field: identifiers.avg_length
    min: 12.0
- id: sh-high-entropy-functions
  desc: High-entropy function names
  crit: notable
  conf: 0.85
  size_max: 100000
  if:
    type: metrics
    field: functions.high_entropy_names
    min: 10
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: sh-high-entropy-functions-recognized-marker
  - type: basename
    regex: '##(url|unicode-escape)@[0-9]+$'
  - type: metrics
    field: functions.avg_name_length
    min: 12.0
  - id: well-known/app/utility/ventoy/
  - type: text
    regex: PROGRAM=libtool|PACKAGE=libtool|# libtool \(GNU libtool\)
  - type: text
    regex: usage\(\)\s*\{|help\(\)\s*\{|logger\(\)\s*\{|_logger
  - type: text
    regex: '#( bash completion|compdef\b)|(?m)^\s*(COMPREPLY=|\bcompgen\s+)'
  - type: basename
    regex: (^|[\\/])bash-completion[\\/]completions[\\/]
- id: sh-ca-trust-p11-kit-marker
  desc: CA trust p11-kit extraction marker
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: p11-kit.exe extract --format=openssl-bundle
- id: sh-long-line-nonshell-filename-marker
  desc: Non-shell filename marker
  crit: baseline
  conf: 0.9
  if:
    type: basename
    regex: \.(json|ya?ml|md|md\.gotmpl|[1-9]|map)$|^Makefile(\..*)?$
- id: sh-xvfb-test-wrapper-marker
  desc: Xvfb test wrapper marker
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: \bXvfb\b[\s\S]{0,900}/tmp/\.X\$?[A-Za-z0-9_]*-lock
- id: sh-no-functions
  desc: No shell functions (inline obfuscation)
  crit: notable
  conf: 0.6
  if:
    type: metrics
    field: functions.count
    max: 0
    min_size: 2048
  unless:
  - id: metadata/lang/scripted::perl-eval-exec-trampoline
  - type: text
    regex: exec_prefix=|datarootdir=|^prefix=
  - type: text
    regex: --help\)|\busage="?yes
  - type: basename
    regex: \.(json|ya?ml|md)$|^Makefile(\..*)?$
  - id: metadata/file/extension/identity::dart-source-basename
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/structured::linux-console-keymap
  - id: metadata/file/format/structured::console-unicode-input-entries
  - type: metrics
    field: comments.to_code_ratio
    min: 0.25
- id: sh-dense-hex-escapes
  desc: Dense printable hex escapes in shell string
  crit: suspicious
  conf: 0.9
  count_min: 3
  per_kb_min: 1.0
  if:
    type: text
    regex: \$'[^']{0,120}\\x[2-7][0-9a-fA-F]
  not:
  - regex: \$'[^']{0,120}\\x7[fF]
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: metadata/package/testing/presence/path::shell-test-fixture-source
  - id: metadata/package/files/system-package::zsh-function-script
  - id: metadata/package/files/system-package::initrd-format-inspection-script
- id: sh-dense-octal-escapes
  desc: Packed ANSI-C octal char payload
  crit: suspicious
  conf: 0.88
  count_min: 1
  if:
    type: text
    regex: \$'[^']{0,16}\\[01][0-7]{2}[^']{0,16}\\[0-7]{3}[^']{0,16}\\[0-7]{3}
  unless:
  - id: metadata/package/testing/presence/path::shell-test-fixture-source
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/path::git-tests-directory
  - id: metadata/package/testing/presence/path::zsh-ztst-test-script
  - id: micro-behaviors/data/encode/string::shell-json-control-character-escape
  - type: text
    regex: =\$'(\\001)?\\033\[
  not:
  - regex: \$'(\\001)?\\033\[[0-9;]*[A-Za-z](\\002)?'
  - regex: \\0[0-7]{2}[^']{0,16}\\0[0-7]{2}[^']{0,16}\\0[0-7]{2}
- id: sh-char-split-concatenation
  desc: Word split into single-character fragments
  crit: suspicious
  conf: 0.9
  count_min: 3
  per_kb_min: 0.5
  if:
    type: text
    regex: '["''][A-Za-z0-9]["'']["''][A-Za-z0-9]["'']'
  unless:
  - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
  - id: metadata/path::test-directory-component
- id: sh-inline-char-split
  desc: Shell word uses interleaved quoted characters
  crit: suspicious
  conf: 0.88
  if:
    type: tree-sitter
    query: |
      ((concatenation) @word
        (#match? @word "[A-Za-z]\"[A-Za-z]\"[A-Za-z]"))
  not:
  - substr: shellcheck disable=SC2140
  - regex: Word is of the form
  - substr: github_git-l"f"s.list
  - substr: micro"soft"-prod.list
  unless:
  - id: shell-test-fixture-marker
  - id: metadata/lang/shebang::tcl-sh-reexec-header
  - id: micro-behaviors/data/encode/uuencode::uuencode-header
  - type: path
    regex: \.(?:jar([\\/]|$)|(?:m?js|jsm|cjs)(##(?:xor|unicode-escape)(?:@\d+)?)?)$
  - type: path
    regex: \.(dll|exe|sys|ocx|so|dylib)##(xor|unicode-escape)@?\d*$|\.(snap|squashfs)$
  - id: well-known/app/media/marp::marp-vscode-archive-context
  - id: metadata/build/minifier::js-medium-minified-line
  - id: metadata/lang/encoding::non-ascii-script-text
- id: sh-ifs-field-mangle
  desc: IFS set to a non-whitespace delimiter
  crit: component
  conf: 0.7
  if:
    type: text
    regex: (?m)(^|[;&\n])[ \t]*IFS=[^ \t\n;\"'$]
- id: sh-function-positional-body
  desc: Function body runs a bare positional param
  crit: component
  conf: 0.7
  if:
    type: text
    regex: \)\s*\{\s*\$[1-9@]
- id: sh-cryptic-default-param
  desc: Cryptic default-parameter command
  crit: component
  conf: 0.7
  count_min: 2
  if:
    type: text
    regex: \$\{[a-z]{1,2}:[-=][^}]{1,80}\}
- id: sh-alias-command-definition
  desc: Multiple single-letter command aliases
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (^|[;&\n])\s*alias\s+[A-Za-z]=
- id: sh-dense-command-subst
  desc: Dense nested command substitution
  crit: baseline
  conf: 0.8
  per_kb_min: 0.8
  size_max: 65536
  if:
    type: text
    regex: \$\([^)]{0,120}\$\(
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - type: path
    basename: true
    regex: ^Makefile(\..*)?$|^rules$|\.mk$
  - type: text
    regex: COMPREPLY[+]?=\( \$\( compgen -W
  - type: text
    substr: $(patsubst %.rst,%.8,$(
  - type: text
    regex: \$\((LINK|AR|CC)\.\$\(TOOLSET\)\)
  - type: text
    regex: \bquiet_cmd_[A-Za-z0-9_]+\s*=|\bcmd_[A-Za-z0-9_]+\s*=\s*\$\([A-Za-z]+\.\$\(TOOLSET\)\)
  - type: text
    substr: command_changed = $(or $(subst $(cmd_$(1))
  not:
  - regex: \$\((word|strip|patsubst|filter|shell|abspath|dir|findstring|notdir|info)\b
  - substr: '$(foreach '
  - substr: $(filter -arch %, $(CFLAGS))
- id: sh-dense-eval-chains
  desc: Dense eval chains
  crit: suspicious
  conf: 0.92
  size_max: 500000
  if:
    type: text
    regex: (^|[;&|]\s*)eval\s+[^\n]{0,80}\$\(\s*eval\s
  unless:
  - id: metadata/package/testing/presence/path::shell-test-fixture-source
  - id: sh-dense-eval-chains-unless-cond-1--rx-helper-7
  - id: metadata/package/files/system-package::system-shell-profile
  - id: metadata/package/files/system-package::os-vendored-perl-header
  - type: text
    substr: try3() { eval "$*" || eval "$*" || eval "$*"; }
  - type: text
    regex: eval\s+ac_val=|ac_var\b.*\beval\b|eval set -- \$|atf_test_case\b
  - type: text
    substr: eval eval ngx_module_libs="\\\"\$${ngx_module}_LIBS\\\""
  - type: text
    regex: \$\w+\s.*\beval\b
  - type: text
    substr: $MPREMOTE
- id: sh-dense-printf-decode
  desc: Printf %b ASCII hex-escape decoding
  crit: suspicious
  conf: 0.88
  per_kb_min: 0.8
  if:
    type: text
    regex: printf\s+['"]%b['"]\s+['"][^'"]{0,40}(\\x[2-7][0-9a-fA-F]|\\0[4-7][0-7]|\\1[0-7]{2})
  unless:
  - id: sh-dense-printf-decode-unless-cond-0--rx-helper-11
  - id: well-known/app/utility/util-linux::util-linux-test-script
  - id: metadata/package/testing/presence/path::shell-test-fixture-source
- id: sh-dense-printf-decode-unless-cond-0--rx-8
  desc: Matches 'MAKECOLOR'
  crit: notable
  conf: 0.88
  per_kb_min: 0.8
  count_min: 4
  if:
    type: text
    substr: MAKECOLOR
- id: sh-dense-printf-decode-unless-cond-0--rx-9
  desc: Matches 'ENDCOLOR'
  crit: notable
  conf: 0.88
  per_kb_min: 0.8
  count_min: 4
  if:
    type: text
    substr: ENDCOLOR
- id: sh-dense-printf-decode-unless-cond-0--rx-10
  desc: Matches 'BINCOLOR'
  crit: notable
  conf: 0.88
  per_kb_min: 0.8
  count_min: 4
  if:
    type: text
    substr: BINCOLOR
- id: shell-project-hack-helper-marker
  desc: Shell project hack helper marker
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: (^|[\\/])hack[\\/]crd-schema-checker\.sh$
- id: chromiumos-config-module-path
  desc: ChromiumOS config module path
  crit: baseline
  conf: 0.95
  if:
    type: path
    substr: go.chromium.org/chromiumos/config@
- id: chromiumos-helper-basename
  desc: ChromiumOS helper script basename
  crit: baseline
  conf: 0.95
  if:
    type: basename
    regex: ^(run_pytype|setup_project)\.sh$
- id: shell-uppercase-fragment-command
  desc: Uppercase variable command fragments
  crit: component
  conf: 0.9
  if:
    type: text
    regex: \$[A-Z][A-Z0-9_]{2,}\$[A-Z][A-Z0-9_]{2,}
composite_rules:
- id: sh-shell-template-context
  desc: Shell command template placeholder context
  crit: exception
  conf: 0.9
  for:
  - shell
  - go
  any:
  - id: micro-behaviors/data/string/assembly::sh-template-placeholder
  - id: metadata/lang/source/syntax/member::go-template-dot-field
  - id: micro-behaviors/data/string/assembly::sh-js-call-interpolation
  - id: micro-behaviors/data/string/assembly::sh-terraform-template-directive
  - id: micro-behaviors/data/string/assembly::sh-cmake-at-placeholder
- id: sh-shattered-command-obfuscation
  desc: Shell command shattered into ANSI-C escapes and single-char fragments
  crit: hostile
  conf: 0.93
  all:
  - id: sh-char-split-concatenation
  any:
  - id: sh-dense-octal-escapes
  - id: sh-dense-hex-escapes
  unless:
  - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
  - id: metadata/path::test-directory-component
- id: sh-high-entropy-functions-recognized-marker
  desc: Shell high-entropy function recognized marker
  crit: component
  conf: 0.9
  any:
  - id: metadata/file/string/identity::pkgbuild-basename
  - id: metadata/package/testing/presence/platform_suites::qemu-examples-tests
  - id: sh-ca-trust-p11-kit-marker
- id: sh-encoded-dropper
  desc: Shell script with encoded payload
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/data/encode/payload::shell-base64-payload-literal
  - id: metadata/file/comment::no-comments-code
  any:
  - id: metadata/file/line::single-long-line
  unless:
  - id: metadata/file/format/structured::valid
- id: compact-shell-script-obfuscation
  desc: Compact shell script obfuscation metrics
  crit: suspicious
  conf: 0.85
  size_min: 512
  size_max: 500000
  all:
  - id: metadata/lang/shebang::shell-script
  needs: 3
  any:
  - id: metadata/file/profile/identifier-population::shell-single-char-identifier-ratio
  - id: metadata/file/line::single-long-line
  - id: metadata/file/comment::no-comments-code
  - id: objectives/anti-static/obfuscation/code-metrics/structure::sh-no-functions
  - id: metadata/file/profile/text-shape::low-whitespace-ratio
  unless:
  - id: metadata/lang/scripted::ps-valid
  - id: metadata/file/extension/identity::json-txt-md-basename
  - id: metadata/file/extension/identity::type-stub-basename
  - id: metadata/lang/scripted::javascript-module-basename
  - id: metadata/lang/scripted::typescript-module-basename
  - id: metadata/package/testing/harness/unit/
  - id: metadata/package/testing/scripted/
- id: sh-dense-eval-chains-unless-cond-1--rx-helper-7
  desc: Regex component marker
  crit: component
  conf: 1.0
  size_max: 500000
  any:
  - id: micro-behaviors/ui/help::shell-help-case-echo
  - id: micro-behaviors/ui/help::shell-version-case-echo
  - id: micro-behaviors/ui/help::usage-colon-text
  - id: metadata/build/autotools::generated-by-gnu-autoconf
  - id: metadata/build/autotools::ac-config-headers-reference
  - id: metadata/build/autotools::exec-prefix-assignment
- id: sh-dense-printf-decode-unless-cond-0--rx-helper-11
  desc: Regex component marker
  crit: component
  conf: 1.0
  any:
  - id: sh-dense-printf-decode-unless-cond-0--rx-8
  - id: sh-dense-printf-decode-unless-cond-0--rx-9
  - id: sh-dense-printf-decode-unless-cond-0--rx-10
- id: shell-test-fixture-marker
  desc: Shell test or helper marker
  crit: component
  conf: 0.9
  for:
  - shell
  - rust
  any:
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/package/testing/presence/harness::autotests-directory-path
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/path::shell-test-fixture-source
  - id: metadata/package/testing/presence/path::shell-crate-test-path
  - id: metadata/package/testing/presence/path::rust-embedded-shell-test-source
  - id: metadata/package/testing/presence/evidence::linux-kernel-intel-pt-selftest
  - id: well-known/tool/development/toolchain/gcc-source::gcc-reghunt-test-script
  - id: well-known/tool/development/toolchain/gcc-source::gcc-reghunt-helper-script
  - id: shell-project-hack-helper-marker
- id: shell-alpine-homebrew-marker
  desc: Alpine Homebrew shim marker
  crit: component
  conf: 0.9
  any:
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-homebrew-shim-script
  - id: well-known/tool/sysadmin/alpine-packages/binary::homebrew-shims-path
- id: chromiumos-generated-helper-marker
  desc: ChromiumOS generated helper script marker
  crit: component
  conf: 0.95
  all:
  - id: chromiumos-config-module-path
  - id: chromiumos-helper-basename
- id: shell-generated-build-helper-marker
  desc: Generated or declarative shell helper marker
  crit: component
  conf: 0.95
  any:
  - id: well-known/tool/development/toolchain/gcc-source::gcc-progtest-m4-script
  - id: well-known/tool/development/toolchain/gcc-source::gcc-configure-script
  - id: metadata/build/autotools/
  - id: metadata/build/generated/
  - id: metadata/package/files/system-package::shell-completion-script
  - id: micro-behaviors/fs/path/config/git::git-precommit-staged-files-check
  - id: chromiumos-generated-helper-marker
  - id: well-known/app/system/horovod::horovodrun-basename
  - id: micro-behaviors/process/create/shell/target::rust-hook-script-module-path
  - id: well-known/app/ai/knowledge/lean-ctx::source-tree-path
- id: sh-reconstructed-command-name
  desc: Shell command name reconstructed dynamically
  crit: suspicious
  conf: 0.88
  size_max: 524288
  all:
  - id: metadata/lang/shebang::shell-script
  any:
  - id: sh-inline-char-split
  - id: sh-char-split-concatenation
  - id: micro-behaviors/process/create/shell/target::sh-reconstructed-command-target-shape
  unless:
  - id: metadata/lang/shebang::tcl-sh-reexec-header
  - id: well-known/lib
  - id: metadata/file/profile/test-indications::harness-metadata-or-directory-name
  - id: sh-shell-template-context
  - id: metadata/path::shell-scripts-dir-context
  - id: shell-generated-build-helper-marker
  - id: micro-behaviors/data/string/assembly::shell-assignment-string-assembly
  - id: metadata/file/extension/identity::rust-source-extension
  - id: shell-uppercase-fragment-command
- id: sh-sequential-variable-command-construction
  desc: Shell command and arguments use sequential single-letter variables
  crit: component
  conf: 0.9
  size_max: 512
  all:
  - id: metadata/file/profile/identifier-population::shell-sequential-short-identifiers
  - id: micro-behaviors/process/create/shell/spawn::sh-dynamic-command-target
  - id: micro-behaviors/process/create/local-exec::shell-variable-exec-variable-args
- id: sh-staged-command-reconstruction
  desc: Tiny script stages and runs a hidden command
  crit: hostile
  conf: 0.9
  size_max: 512
  all:
  - id: metadata/lang/shebang::shell-script
  - id: micro-behaviors/process/create/shell/spawn::sh-dynamic-command-target
  any:
  - id: micro-behaviors/data/source/syntax/assignment::shell-set-positional-command-stage
  - id: sh-ifs-field-mangle
  - id: sh-function-positional-body
  - id: sh-cryptic-default-param
  - id: sh-sequential-variable-command-construction
  unless:
  - id: well-known/lib
  - id: well-known/tool
  - id: well-known/app/infrastructure/openshift::cd-jobs-context
  - id: metadata/lang/shebang::tcl-sh-reexec-header
  - id: chromiumos-generated-helper-marker
  - id: metadata/lang/upstream/
  - id: micro-behaviors/data/source/syntax/assignment::sh-upper-knob-command-variable
- id: sh-alias-command-reconstruction
  desc: Tiny script aliases then runs a command
  crit: suspicious
  conf: 0.85
  size_max: 256
  all:
  - id: metadata/lang/shebang::shell-script
  - id: sh-alias-command-definition
  unless:
  - id: metadata/filename/identity::shell-profile-basename
  - id: shell-test-fixture-marker
