defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  attack: T1027
  mbc: B0032
traits:
- id: sh-many-high-entropy-identifiers
  desc: Many high-entropy identifiers in shell
  crit: notable
  conf: 0.85
  size_min: 1024
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.4
- id: sh-high-entropy-functions
  desc: High-entropy function names
  crit: notable
  conf: 0.85
  if:
    type: metrics
    field: functions.high_entropy_names
    min: 10
- id: sh-ca-trust-p11-kit-marker
  desc: CA trust p11-kit extraction marker
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: p11-kit.exe extract --format=openssl-bundle
- id: sh-long-line-nonshell-filename-marker
  desc: Non-shell filename marker
  crit: baseline
  conf: 0.9
  if:
    type: basename
    regex: \.(json|ya?ml|md|md\.gotmpl|[1-9]|map)$|^Makefile(\..*)?$
- id: sh-xvfb-test-wrapper-marker
  desc: Xvfb test wrapper marker
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: \bXvfb\b[\s\S]{0,900}/tmp/\.X\$?[A-Za-z0-9_]*-lock
- id: sh-no-functions
  desc: No shell functions
  crit: notable
  conf: 0.6
  if:
    type: metrics
    field: functions.count
    max: 0
    min_size: 2048
  unless:
  - id: metadata/lang/scripted::perl-eval-exec-trampoline
  - type: text
    regex: exec_prefix=|datarootdir=|^prefix=
  - type: text
    regex: --help\)|\busage="?yes
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/structured::linux-console-keymap
  - id: metadata/file/format/structured::console-unicode-input-entries
  - type: metrics
    field: comments.to_code_ratio
    min: 0.25
- id: sh-dense-hex-escapes
  desc: Dense printable hex escapes in shell string
  crit: notable
  conf: 0.9
  count_min: 3
  per_kb_min: 1.0
  if:
    type: text
    regex: \$'[^']{0,120}\\x[2-7][0-9a-fA-F]
  not:
  - regex: \$'[^']{0,120}\\x7[fF]

- id: sh-char-split-concatenation
  desc: Word split into single-character fragments
  crit: suspicious
  conf: 0.9
  count_min: 3
  per_kb_min: 0.5
  if:
    type: text
    regex: '["''][A-Za-z0-9]["'']["''][A-Za-z0-9]["'']'
  unless:
  - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
- id: sh-inline-char-split
  desc: Shell word uses interleaved quoted characters
  crit: notable
  conf: 0.88
  if:
    type: tree-sitter
    query: |
      ((concatenation) @word
        (#match? @word "[A-Za-z]\"[A-Za-z]\"[A-Za-z]"))
  not:
  - substr: shellcheck disable=SC2140
  - regex: Word is of the form
  - substr: github_git-l"f"s.list
  - substr: micro"soft"-prod.list
- id: sh-ifs-field-mangle
  desc: IFS set to a non-whitespace delimiter
  crit: component
  conf: 0.7
  if:
    type: text
    regex: (?m)(^|[;&\n])[ \t]*IFS=[^ \t\n;\"'$]
- id: sh-function-positional-body
  desc: Function body runs a bare positional param
  crit: component
  conf: 0.7
  if:
    type: text
    regex: \)\s*\{\s*\$[1-9@]
- id: sh-cryptic-default-param
  desc: Cryptic default-parameter command
  crit: component
  conf: 0.7
  count_min: 2
  if:
    type: text
    regex: \$\{[a-z]{1,2}:[-=][^}]{1,80}\}
- id: sh-alias-command-definition
  desc: Multiple single-letter shell alias definitions
  crit: notable
  conf: 0.6
  count_min: 2
  if:
    type: text
    regex: '(?m)^[ \t]*alias[ \t]+[A-Za-z]='
- id: sh-short-command-with-short-argument
  desc: Short shell command with short argument
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '(?m)^[ \t]*[A-Za-z][ \t]+[A-Za-z][ \t]+[^\r\n]'
- id: sh-dense-command-subst
  desc: Dense nested command substitution
  crit: baseline
  conf: 0.8
  per_kb_min: 0.8
  size_max: 65536
  if:
    type: text
    regex: \$\([^)]{0,120}\$\(
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - type: path
    basename: true
    regex: ^Makefile(\..*)?$|^rules$|\.mk$
  - type: text
    regex: COMPREPLY[+]?=\( \$\( compgen -W
  - type: text
    substr: $(patsubst %.rst,%.8,$(
  - type: text
    regex: \$\((LINK|AR|CC)\.\$\(TOOLSET\)\)
  - type: text
    regex: \bquiet_cmd_[A-Za-z0-9_]+\s*=|\bcmd_[A-Za-z0-9_]+\s*=\s*\$\([A-Za-z]+\.\$\(TOOLSET\)\)
  - type: text
    substr: command_changed = $(or $(subst $(cmd_$(1))
  not:
  - regex: \$\((word|strip|patsubst|filter|shell|abspath|dir|findstring|notdir|info)\b
  - substr: '$(foreach '
  - substr: $(filter -arch %, $(CFLAGS))
- id: sh-dense-eval-chains
  desc: Dense eval chains
  crit: suspicious
  conf: 0.92
  size_max: 500000
  if:
    type: text
    regex: (^|[;&|]\s*)eval\s+[^\n]{0,80}\$\(\s*eval\s
  unless:
  - id: sh-dense-eval-chains-unless-cond-1--rx-helper-7
  - type: text
    substr: try3() { eval "$*" || eval "$*" || eval "$*"; }
  - type: text
    regex: eval\s+ac_val=|ac_var\b.*\beval\b|eval set -- \$|atf_test_case\b
  - type: text
    substr: eval eval ngx_module_libs="\\\"\$${ngx_module}_LIBS\\\""
  - type: text
    regex: \$\w+\s.*\beval\b
  - type: text
    substr: $MPREMOTE
- id: sh-dense-printf-decode
  desc: Printf %b ASCII hex-escape decoding
  crit: notable
  conf: 0.88
  per_kb_min: 0.8
  if:
    type: text
    regex: printf\s+['"]%b['"]\s+['"][^'"]{0,40}(\\x[2-7][0-9a-fA-F]|\\0[4-7][0-7]|\\1[0-7]{2})
- id: chromiumos-config-module-path
  desc: ChromiumOS config module path
  crit: baseline
  conf: 0.95
  if:
    type: path
    substr: go.chromium.org/chromiumos/config@
- id: chromiumos-helper-basename
  desc: ChromiumOS helper script basename
  crit: baseline
  conf: 0.95
  if:
    type: basename
    regex: ^(run_pytype|setup_project)\.sh$
- id: shell-uppercase-fragment-command
  desc: Uppercase variable command fragments
  crit: component
  conf: 0.9
  if:
    type: text
    regex: \$[A-Z][A-Z0-9_]{2,}\$[A-Z][A-Z0-9_]{2,}
composite_rules:
- id: sh-shell-template-context
  desc: Shell command template placeholder context
  crit: exception
  conf: 0.9
  for:
  - shell
  - go
  any:
  - id: micro-behaviors/data/string/assembly::sh-template-placeholder
  - id: metadata/lang/source/syntax/member::go-template-dot-field
  - id: micro-behaviors/data/string/assembly::sh-js-call-interpolation
  - id: micro-behaviors/data/string/assembly::sh-terraform-template-directive
  - id: micro-behaviors/data/string/assembly::sh-cmake-at-placeholder
- id: sh-shattered-command-obfuscation
  desc: Shell command shattered into ANSI-C escapes and single-char fragments
  crit: hostile
  conf: 0.93
  all:
  - id: sh-char-split-concatenation
  any:
  - id: metadata/lang/encoding/shape::shell-ansi-octal-escapes
  - id: sh-dense-hex-escapes
  unless:
  - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
- id: sh-high-entropy-functions-recognized-marker
  desc: Shell high-entropy function recognized marker
  crit: component
  conf: 0.9
  any:
  - id: metadata/file/string/identity::pkgbuild-basename
  - id: metadata/package/testing/presence/platform_suites::qemu-examples-tests
  - id: sh-ca-trust-p11-kit-marker
- id: sh-encoded-dropper
  desc: Shell script with encoded payload and compact source
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/encode/payload::shell-base64-payload-literal
  - id: metadata/file/comment::no-comments-code
  any:
  - id: metadata/file/line::single-long-line
  unless:
  - id: metadata/file/format/structured::valid
- id: compact-shell-script-obfuscation
  desc: Compact shell script structural features
  crit: notable
  conf: 0.85
  size_min: 512
  size_max: 500000
  all:
  - id: metadata/lang/shebang::shell-script
  needs: 3
  any:
  - id: metadata/file/profile/identifier-population::shell-single-char-identifier-ratio
  - id: metadata/file/line::single-long-line
  - id: metadata/file/comment::no-comments-code
  - id: objectives/anti-static/obfuscation/code-metrics/structure::sh-no-functions
  - id: metadata/file/profile/text-shape::low-whitespace-ratio
- id: sh-dense-eval-chains-unless-cond-1--rx-helper-7
  desc: Regex component marker
  crit: component
  conf: 1.0
  size_max: 500000
  any:
  - id: micro-behaviors/ui/help::shell-help-case-echo
  - id: micro-behaviors/ui/help::shell-version-case-echo
  - id: micro-behaviors/ui/help::usage-colon-text
  - id: metadata/build/autotools::generated-by-gnu-autoconf
  - id: metadata/build/autotools::ac-config-headers-reference
  - id: metadata/build/autotools::exec-prefix-assignment
- id: sh-reconstructed-command-name
  desc: Shell command name reconstructed dynamically
  crit: suspicious
  conf: 0.88
  size_max: 524288
  all:
  - id: metadata/lang/shebang::shell-script
  any:
  - id: sh-inline-char-split
  - id: sh-char-split-concatenation
  - id: metadata/lang/source/syntax/call/invocation::sh-reconstructed-command-target-shape
  unless:
  - id: metadata/lang/shebang::tcl-sh-reexec-header
  - id: sh-shell-template-context
  - id: micro-behaviors/data/string/assembly::shell-assignment-string-assembly
  - id: metadata/file/extension/source::rust-source-extension
  - id: shell-uppercase-fragment-command
- id: sh-alias-command-reconstruction
  desc: Short aliases with short command invocation
  crit: suspicious
  conf: 0.85
  size_max: 256
  all:
  - id: metadata/lang/shebang::shell-script
  - id: sh-alias-command-definition
  - id: sh-short-command-with-short-argument
- id: sh-sequential-variable-command-construction
  desc: Shell command and arguments use sequential single-letter variables
  crit: component
  conf: 0.9
  size_max: 512
  all:
  - id: metadata/file/profile/identifier-population::shell-sequential-short-identifiers
  - id: micro-behaviors/process/create/shell/spawn::sh-dynamic-command-target
  - id: micro-behaviors/process/create/local-exec::shell-variable-exec-variable-args
- id: sh-staged-command-reconstruction
  desc: Tiny shell script uses a variable command with staging syntax
  crit: suspicious
  conf: 0.9
  size_max: 512
  all:
  - id: metadata/lang/shebang::shell-script
  - id: micro-behaviors/process/create/shell/spawn::sh-dynamic-command-target
  any:
  - id: micro-behaviors/process/argument/positional::shell-set-positional-command-stage
  - id: sh-ifs-field-mangle
  - id: sh-function-positional-body
  - id: sh-cryptic-default-param
  - id: sh-sequential-variable-command-construction
  unless:
  - id: metadata/lang/shebang::tcl-sh-reexec-header
