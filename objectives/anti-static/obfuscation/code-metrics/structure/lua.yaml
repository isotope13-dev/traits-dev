defaults:
  platforms: [windows, unix]
  # These rules describe Lua source syntax.  Applying them to arbitrary text
  # treats escaped bytes embedded in other languages (for example OCaml's
  # generated Unicode tables) as Lua obfuscation.  The content-specific
  # loader rules below carry the narrower content-based exception for
  # extensionless or mislabeled Lua payloads.
  for: [lua]
  attack: T1027
traits:
  - id: lua-packed-return-function-loader
    desc: Packed Lua return-function loader
    crit: suspicious
    conf: 0.94
    # A payload can be mislabeled with a non-Lua extension and be classified
    # by content heuristics as another source type.  This matcher is still
    # keyed to Lua syntax, so accepting C keeps the trait's identity honest.
    for: [lua, javascript, text, c]
    size_min: 50000
    if:
      type: text
      regex: '(?s)^return\(function\(\.\.\.\).{0,512}?return\(function\([A-Za-z,]{20,120}\)'

  - id: lua-indexed-string-permutation-decoder
    desc: Lua indexed string permutation decoder
    crit: suspicious
    conf: 0.93
    for: [lua, javascript, text, c]
    size_min: 50000
    if:
      type: text
      regex: 'for [A-Za-z]=1,#[A-Za-z],1 do [A-Za-z]=[A-Za-z]\.\.[A-Za-z]\[[A-Za-z]\['

  - id: lua-index-loop-concat
    desc: Lua indexed loop concatenates values
    crit: component
    conf: 0.94
    for: [lua, javascript, text]
    size_min: 50000
    if:
      type: text
      regex: 'for\s+[A-Za-z_]\w*\s*=\s*1\s*,\s*#[A-Za-z_]\w*\s*,\s*1\s*do'

  - id: lua-indexed-concat
    desc: Lua concatenates an indexed value
    crit: component
    conf: 0.94
    for: [lua, javascript, text]
    size_min: 50000
    if:
      type: text
      regex: '[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\.\.\s*[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*\['

  - id: lua-decimal-escape-string-table
    desc: Decimal-escaped Lua string table
    crit: suspicious
    conf: 0.94
    # The payloads this describes are always shipped under a data extension —
    # `jit.txt`, `uix.txt` next to a luajit.exe — so the file-level default of
    # `[lua]` meant the matcher never ran on a real sample, and every composite
    # that depends on it was dead for exactly the delivery shape it was written
    # for. The sibling loader atoms here already carry this exception; this one
    # was missed. `c` stays out on purpose: `\101` is an OCTAL escape in C, so
    # a generated byte table there is a different thing wearing the same syntax.
    for: [lua, javascript, text]
    size_min: 50000
    count_min: 100
    if:
      type: text
      # A quoted run of consecutive escapes — one element of the obfuscator's
      # string table — not a bare `\NNN` anywhere in the file. Escaped bytes
      # scattered through prose or a data blob are not a packed string table,
      # and matching them is what made the wider file-type list unsafe before.
      regex: '"(\\[0-9]{3}){4,}'
    unless:
      # Generated Unicode property tables (e.g. Ruby unicode gem unidata.map)
      # embed UTF-8 bytes as decimal escapes inside C struct literals.
      - type: text
        substr: _UNIDATA_MAP

  - id: lua-large-encoded-string-table
    desc: Many Base64-candidate strings in Lua
    crit: suspicious
    conf: 0.94
    size_min: 50000
    count_min: 100
    if:
      # Use cleave's Base64 candidate decoder instead of treating every long
      # quoted token as encoded data.  Device paths, service names, and other
      # ordinary Lua constants commonly contain the same alphabet.
      type: encoded
      encoding: base64
      regex: '.{14,}'
    not:
      # Plain identifiers and English words are field keys / copy, not
      # encoded payload tables (e.g. Orbit sample DB dumps).
      - regex: '"[A-Z][A-Z0-9]*(_[A-Z0-9]+)+"'
      - regex: '"[a-z]{8,}"'
      - regex: '"[a-z]+(-[a-z0-9]+)+"'
      - regex: '"[a-z][a-z0-9]*(_[a-z0-9]+)+"'
      - regex: '"[a-z]+([A-Z][a-z0-9]*)+"'
      - regex: '"[A-Z][a-z]+([A-Z][a-z0-9]*)*"'
    unless:
      # Generated lookup databases commonly contain hex/base64-like IDs; keep
      # hand-written encoded payload tables detectable.
      - id: metadata/lang/source::automatically-generated-source-marker
      # Extensionless HTML pages often embed large base64-like JSON values.
      # Those are application state, not Lua string-table obfuscation.
      - type: text
        regex: '(?is)^\s*<!doctype\s+html'
      # Classic ASP Script Encoder / FileSystemObject shells are mis-typed as
      # lua; their packed alphabet is not a Lua string table.
      - id: objectives/command-and-control/backdoor/webshell/request::asp-script-encoder-directive
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - type: text
        substr: _UNIDATA_MAP

  - id: lua-environment-proxy-loader
    desc: Lua environment and proxy loader
    crit: suspicious
    conf: 0.95
    for: [lua, javascript, text]
    if:
      type: text
      # Call syntax excludes language-grammar prose/regexes while retaining
      # loaders that invoke all three environment/proxy primitives.
      regex: '(?s)getfenv\s*\([^)]{0,120}\).*?newproxy\s*\([^)]{0,120}\).*?setmetatable\s*\('
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path
      # EmmyLua/LuaLS `---@meta` stubs declare empty `function getfenv` /
      # `function newproxy` / `function setmetatable` definitions.
      - id: well-known/app/development/vscode-extension/sumneko-lua::emmylua-meta-file-annotation

composite_rules:
  - id: lua-large-single-line-dispatch
    desc: Large one-line Lua dynamic loader
    crit: suspicious
    conf: 0.95
    size_min: 50000
    all:
      - id: metadata/file/metrics::file-one-liner
      - id: micro-behaviors/process/create/eval::lua-dynamic-load

  - id: lua-indexed-string-table-reassembly
    desc: Indexed Lua string-table reassembly
    crit: suspicious
    conf: 0.95
    for: [lua, javascript, text]
    size_min: 50000
    all:
      - id: lua-index-loop-concat
      - id: lua-indexed-concat

  - id: packed-lua-loader-obfuscation
    desc: Packed Lua loader obfuscation
    crit: hostile
    conf: 0.96
    for: [lua, javascript, text, c]
    all:
      - id: lua-packed-return-function-loader
      - id: lua-indexed-string-permutation-decoder

  - id: lua-obfuscated-string-dispatch
    desc: Indexed strings plus one-line Lua dispatch
    crit: hostile
    conf: 0.97
    all:
      - id: lua-indexed-string-table-reassembly
      - id: lua-large-single-line-dispatch

  - id: lua-escaped-string-dispatch
    desc: Indexed strings plus escaped Lua payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: lua-indexed-string-table-reassembly
      - id: lua-decimal-escape-string-table

  - id: lua-environment-proxy-obfuscated-loader
    desc: Escaped Lua environment/proxy loader
    crit: hostile
    conf: 0.98
    all:
      - id: lua-environment-proxy-loader
      - id: lua-decimal-escape-string-table
      - id: lua-indexed-string-table-reassembly
