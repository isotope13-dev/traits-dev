defaults:
  platforms: [windows, unix]
  # These rules describe Lua source syntax.  Applying them to arbitrary text
  # treats escaped bytes embedded in other languages (for example OCaml's
  # generated Unicode tables) as Lua obfuscation.  The content-specific
  # loader rules below carry the narrower content-based exception for
  # extensionless or mislabeled Lua payloads.
  for: [lua]
  attack: T1027
traits:
  - id: lua-large-encoded-string-table
    desc: Many Base64-candidate strings in Lua
    crit: suspicious
    conf: 0.94
    size_min: 50000
    count_min: 100
    if:
      # Use cleave's Base64 candidate decoder instead of treating every long
      # quoted token as encoded data.  Device paths, service names, and other
      # ordinary Lua constants commonly contain the same alphabet.
      type: encoded
      encoding: base64
      regex: '.{14,}'
    not:
      # Plain identifiers and English words are field keys / copy, not
      # encoded payload tables (e.g. Orbit sample DB dumps).
      - regex: '"[A-Z][A-Z0-9]*(_[A-Z0-9]+)+"'
      - regex: '"[a-z]{8,}"'
      - regex: '"[a-z]+(-[a-z0-9]+)+"'
      - regex: '"[a-z][a-z0-9]*(_[a-z0-9]+)+"'
      - regex: '"[a-z]+([A-Z][a-z0-9]*)+"'
      - regex: '"[A-Z][a-z]+([A-Z][a-z0-9]*)*"'
    unless:
      # Generated lookup databases commonly contain hex/base64-like IDs; keep
      # hand-written encoded payload tables detectable.
      - id: metadata/lang/generated::automatically-generated-source-marker
      # Extensionless HTML pages often embed large base64-like JSON values.
      # Those are application state, not Lua string-table obfuscation.
      - type: text
        regex: '(?is)^\s*<!doctype\s+html'
      # Classic ASP Script Encoder / FileSystemObject shells are mis-typed as
      # lua; their packed alphabet is not a Lua string table.
      - id: metadata/lang/runtime::asp-script-encoder-directive
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: metadata/file/catalog/unicode::unidata-map-table

  - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-loader
    desc: Lua environment and proxy loader
    crit: suspicious
    conf: 0.95
    for: [lua, javascript, text]
    if:
      type: text
      # Call syntax excludes language-grammar prose/regexes while retaining
      # loaders that invoke all three environment/proxy primitives.
      regex: '(?s)getfenv\s*\([^)]{0,120}\).{0,600}?newproxy\s*\([^)]{0,120}\).{0,600}?setmetatable\s*\('
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path
      # EmmyLua/LuaLS `---@meta` stubs declare empty `function getfenv` /
      # `function newproxy` / `function setmetatable` definitions.
      - id: well-known/tool/development/vscode-extension/sumneko-lua::emmylua-meta-file-annotation
  - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-long-base64-table
    desc: Lua local table of long Base64 strings
    crit: suspicious
    conf: 0.86
    platforms: [unix, windows, network-appliance]
    if:
      type: text
      regex: 'local\s+[A-Za-z0-9_]+\s*=\s*\{".{16,80}==?".{0,120}".{16,80}==?"'

composite_rules:
  - id: lua-large-single-line-dispatch
    desc: Large one-line Lua dynamic loader
    crit: suspicious
    conf: 0.95
    size_min: 50000
    all:
      - id: metadata/file/line::file-one-liner
      - id: micro-behaviors/process/interpreter/eval/compile::lua-dynamic-load

  - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-obfuscated-string-dispatch
    desc: Indexed strings plus one-line Lua dispatch
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-large-single-line-dispatch

  - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-obfuscated-loader
    desc: Escaped Lua environment/proxy loader
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-loader
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop

  - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-nested-escaped-string-reassembly
    desc: Nested Lua wrapper with escaped string reassembly
    # Concealment only, like packed-lua-loader-obfuscation: commercial Lua
    # protectors emit the same wrapper. Conviction comes from the rule that
    # finds what the unpacked code does or how it is delivered.
    crit: suspicious
    conf: 0.96
    platforms: [unix, windows, network-appliance]
    all:
      - id: micro-behaviors/data/control-flow/return::lua-nested-return-vararg-wrapper
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop
