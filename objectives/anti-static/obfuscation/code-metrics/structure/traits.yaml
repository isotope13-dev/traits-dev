defaults:
  platforms:
    - unix
    - windows
  for: [scripts, pe, elf, macho]
  attack: T1027
  mbc: B0032
traits:
  - id: has-invisible-unicode
    desc: Contains many invisible Unicode characters
    crit: notable
    conf: 0.88
    if:
      type: metrics
      field: text.invisible_chars
      min: 17
      max: 64
  - id: high-invisible-unicode
    desc: Suspicious invisible Unicode count
    crit: notable
    conf: 0.92
    if:
      id: metadata/file/invisible-unicode::multiple
    unless:
      - type: basename
        substr: yarn-standalone.js
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/file/invisible-unicode/
      - id: well-known/app/ai/browser-agent/open-webui-computer/
      - id: metadata/lang/generated::codegen-source-path
      - id: metadata/file/catalog/identity/
  - id: last-line-over-1000
    desc: Last line is over 1000 chars
    crit: notable
    conf: 0.9
    # The metrics matcher is capped at 17 concrete types; scripts are the
    # supported obfuscation surface for this shared rule.
    for: [scripts]
    # Source maps serialize generated code as one JSON line; that is not
    # obfuscation evidence.
    unless:
      - id: metadata/build/bundler/asset::has-sourcemap
      - id: metadata/build/bundler/vscode::javascript-source-map-file
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
      - type: path
        regex: '(?i)(^|[/\\])dist[/\\].+\.(?:m?js|cjs)$'
      - id: metadata/lang/scripted::dts-declaration-file
      - id: well-known/lib/ui/google-code-prettify::runner
      - type: path
        basename: true
        regex: '^[A-Za-z0-9_.-]+[-.][A-Za-z0-9_-]{8,}\.js$'

    if:
      type: metrics
      field: text.last_line_length
      min: 1000
  - id: single-long-line-outlier
    desc: Exactly one line exceeds 1000 chars
    crit: notable
    conf: 0.9
    for: [scripts]
    unless:
      - id: metadata/build/bundler/asset::has-sourcemap
      - id: metadata/build/bundler/vscode::javascript-source-map-file
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
      - type: path
        regex: '(?i)(^|[/\\])dist[/\\].+\.(?:m?js|cjs)$'
      - id: metadata/lang/scripted::dts-declaration-file
      - id: well-known/lib/ui/google-code-prettify::runner
      - type: path
        basename: true
        regex: '^[A-Za-z0-9_.-]+[-.][A-Za-z0-9_-]{8,}\.js$'

    if:
      type: metrics
      field: text.lines_over_1000
      min: 1
      max: 1
  - id: buildkit-dockerfile-v0
    desc: BuildKit dockerfile marker
    crit: notable
    conf: 0.95

    if:
      type: text
      substr: '"comment":"buildkit.dockerfile.v0"'
  - id: python-zipapp-structure
    desc: Python zipapp container structure
    crit: notable
    conf: 0.95
    for: [zip]
    if:
      type: path
      basename: true
      regex: \.pyz$
  - id: ico-resource-basename
    desc: Icon resource file extension
    crit: notable
    for: [data]
    if:
      type: path
      basename: true
      regex: '(?i)\.ico$'
  - id: source-map-inline
    desc: Inline source map data URL
    crit: notable
    if:
      type: text
      substr: '//# sourceMappingURL=data:application/json'
  - id: test-basename-path
    desc: Test file path or basename
    crit: notable
    for: [javascript, typescript, python]
    if:
      type: path
      dirname: true
      regex: (^|[\\/])__?tests?__?([\\/]|$)
composite_rules:
  - id: wordpress-rest-response-fixture
    for: [javascript]
    desc: WordPress REST response fixture
    crit: component
    conf: 0.95
    all:
      - id: metadata/package/testing/presence/harness::wordpress-rest-route
      - id: metadata/package/testing/presence/harness::wordpress-target-hints
      - id: metadata/package/testing/presence/harness::wordpress-allow-methods-array
  - id: recognized-very-long-lines-marker
    desc: Recognized long line file marker
    crit: component
    conf: 0.95
    any:
      - id: buildkit-dockerfile-v0
      - id: python-zipapp-structure
      - id: test-basename-path
      - id: metadata/package/testing/presence/harness::python-php-test-basename-suffix
      - id: wordpress-rest-response-fixture
      - id: metadata/file/format/markup::source-svg-path-data-marker
      - id: metadata/build/bundler/asset::js-any-bundle-output
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
      - id: well-known/lib/web/ecmascript::next-edge-runtime-bundle
      - id: well-known/lib/data/influxdb3-js
      - id: well-known/lib/format/protobuf-ts
      - id: well-known/lib/data/apache-arrow
      - id: metadata/package/testing/scripted::xterm-terminal-recording
      - id: ico-resource-basename
      - id: metadata/file/catalog/identity::frequency-list-catalog
  - id: minified-code
    desc: Minified/compressed code (multiple indicators)
    crit: baseline
    conf: 0.9
    all:
      - id: metadata/file/padding::low-whitespace
    any:
      - id: metadata/file/comment::very-low-comment-ratio
      - id: metadata/file/function::high-function-density
      - id: objectives/anti-static/obfuscation/code-metrics/functions::many-one-liner-functions
      - id: metadata/file/comment::no-comments-code
      - id: metadata/file/naming::sequential-identifiers
      - id: objectives/anti-static/obfuscation/code-metrics/identifiers::py-sequential-identifiers
    unless:
      - id: metadata/build/
      - id: metadata/file/extension/identity::html-basename
      - id: ico-resource-basename
      - id: metadata/lang/source/
      - id: well-known/lib/web/
      - id: objectives/anti-static/obfuscation/code-metrics/functions/
  - id: appended-long-line
    desc: Single appended long line in source
    crit: baseline
    conf: 0.9
    for: [scripts, '!jcl']

    all:
      - id: last-line-over-1000
      - id: metadata/file/line::file-has-30-plus-lines
      - id: single-long-line-outlier
    unless:
      - id: source-map-inline
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/signed/platform::microsoft-corporation
      - id: metadata/build/ecosystem::deno-cache-metadata-trailer
  - id: appended-steganography
    desc: Steganography payload in appended long line
    crit: hostile
    conf: 0.95
    for: [scripts, '!jcl']

    all:
      - id: appended-long-line
      - id: high-invisible-unicode
    unless:
      - id: metadata/package/testing/presence/scripted::faker-word
      - id: metadata/file/invisible-unicode/
      - id: well-known/lib/development/vscode::require-vscode
  - id: has-encoding
    desc: Data encoding or decoding detected
    crit: component
    for: [scripts, source]

    any:
      - id: has-invisible-unicode
      - id: micro-behaviors/data/decode/base64/
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/data/decode/hex/
      - id: micro-behaviors/data/encode/payload::hex-byte-format
      - id: micro-behaviors/data/encode/xor::js-chunked-xor-loop
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-loop
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
    unless:
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
  - id: has-dynamic-exec
    desc: Dynamic code execution detected
    crit: component
    for: [scripts, source]

    any:
      - id: micro-behaviors/process/interpreter/eval/
      - id: micro-behaviors/process/interpreter/runtime/eval/
      - id: micro-behaviors/process/interpreter/python/
      - id: objectives/execution/interpreter/eval/
      - id: micro-behaviors/process/create/direct/
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: objectives/command-and-control/dropper/execution/script/
      - id: objectives/command-and-control/dropper/execution/eval/
  - id: trailing-whitespace-payload
    desc: Trailing whitespace on a line hides code
    crit: suspicious
    conf: 0.9
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::whitespace-hiding
      - id: last-line-over-1000
    any:
      - id: has-encoding
      - id: has-dynamic-exec
      - id: objectives/anti-static/obfuscation/code-metrics/identifiers::excessive-single-char-vars
    unless:
      - id: metadata/build/
      - id: metadata/package/files/dependency::vsix-bundled-output-path
  - id: one-line-obfuscated-dropper
    desc: One-line script that decodes and executes or writes a payload (hostile)
    crit: hostile
    conf: 0.95
    for: [scripts, '!jcl']
    # A genuine one-line dropper payload is compact. Multi-MB "one-liners" are
    # multi-line minified bundles whose text.lines is mis-computed as 1
    # for archive members (engine metric bug); guard against that hostile FP.
    size_max: 1048576
    # Everything a compact one-line dropper does happens on that one line, so
    # all of the evidence has to sit inside a few kilobytes of each other. For
    # a large archive member the one-liner metrics are computed per text
    # segment rather than per file, so a 960KB minified bundle (puppeteer-core's
    # es5-iife build) could present one segment as a "one-liner" while its
    # encoding and exec evidence sat 300KB away. Proximity settles it from the
    # evidence positions instead of the file-level metrics.
    near_bytes: 4096
    all:
      - id: metadata/file/line::file-one-liner
      - id: metadata/file/line::single-long-line
      - id: has-encoding
    any:
      - id: has-dynamic-exec
      - id: micro-behaviors/fs/write/file
    unless:
      # Second guard on the same theme: a "line" tens of thousands of
      # characters wide is generated bundle output, never a hand-written
      # dropper one-liner.
      - id: metadata/file/line::enormous-single-line
      # Third guard, and the one that actually holds. `file-one-liner` is
      # computed per text *segment*, not per file, so it resolves true as a
      # composite leg on files that are plainly not one-liners: react-json-tree's
      # 248 KB / 962-line UMD bundle and node-pty's 201-line unixTerminal.test.js
      # both scored hostile here, while `test-rules` on the atom alone reports
      # NOT MATCHED (text.lines 962 vs the required <= 1). Until that is fixed in
      # the engine, assert the file-level fact directly: a file with 30+ lines is
      # not a one-line dropper, whatever the segment metrics say.
      - id: metadata/file/line::file-has-30-plus-lines
      # The jsimplifier BenignJS corpus is a deobfuscation-research control
      # set: commercially packed but benign scripts. Three of its members are
      # `eval(decodeURIComponent(XOR(atob(<blob>))))` one-liners whose payload
      # decodes to a Yandex ad/weather widget -- the packer shape without the
      # payload. `base64-exec-proximity` in
      # objectives/anti-static/obfuscation/payload/encoded/exec.yaml already
      # carries this same exclusion; this rule was missing it.
      #
      # Path-scoped, so it only acquits a member of that corpus. A real
      # decode-and-execute one-liner elsewhere -- the Laravel
      # `rizhou-laravel-request-log` stat.min.js, which fingerprints the
      # visitor and evals the server's reply -- keeps scoring, and this rule is
      # currently its only detection.
      - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
      # Legacy `eval("(" + str + ")")` JSON deserializer reads a value back rather than
      # executing a decoded payload.
      - id: micro-behaviors/data/parse/json::eval-parenthesized-json-deserializer
      # A webpack source map is one JSON line of base64 mappings. That shape
      # is the map, not a decode-and-execute dropper.
      - id: metadata/build/bundler/vscode::javascript-source-map-file
      # Rust integration tests embed protocol fixtures (base64 shims plus
      # fs::write of the harness scripts) that read as decode-and-write. The
      # frf comparator suite is a 760-line test file, not a one-line script;
      # archive-member text metrics are computed per segment and misreport it
      # as a one-liner.
      - id: metadata/package/testing/harness/unit::rust-test

  - id: obfuscated-dropper-in-asar-unpacked
    desc: Obfuscated dropper in unpacked asar
    crit: hostile
    conf: 0.95
    scope: outer
    for: [7z, zip, javascript]
    all:
      - id: metadata/file/naming::archive-asar-unpacked-member
      - id: one-line-obfuscated-dropper

  - id: appended-encoded-exec
    desc: Encoded payload executed from appended line
    crit: suspicious
    conf: 0.9
    for: [scripts, '!jcl']

    all:
      - id: appended-long-line
      - id: has-encoding
      - id: has-dynamic-exec
    unless:
      - id: metadata/file/magic/identity/
      - id: micro-behaviors/fs/temp/pyinstaller/
      - id: metadata/build/
