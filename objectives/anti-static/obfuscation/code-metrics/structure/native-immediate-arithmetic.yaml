defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: repeated-ecx-immediate-reencoding
    desc: Repeated x86 ECX immediate reencoding
    crit: component
    conf: 0.96
    count_min: 8
    if:
      type: hex
      section: UPX0
      pattern: 'B9 [4] 81 (C1|E9|F1) [4]'
  - id: repeated-edx-immediate-reencoding
    desc: Repeated x86 EDX immediate reencoding
    crit: component
    conf: 0.96
    count_min: 6
    if:
      type: hex
      section: UPX0
      pattern: 'BA [4] 81 (C2|EA|F2) [4]'

composite_rules:
  - id: repeated-immediate-reencoding
    desc: Dense arithmetic reencoding of x86 immediate constants
    crit: suspicious
    conf: 0.96
    all:
      - id: repeated-ecx-immediate-reencoding
      - id: repeated-edx-immediate-reencoding
    unless:
      - id: metadata/signed/trust-level::signer-evidence-present

  # Reencoding plus a recovered UPX layout is concealment-shaped, and the
  # same pair is manufactured by scanner bait: a CRT image whose entry reaches
  # the arithmetic blocks, resolves CoInitializeEx/CoGetClassObject, stores an
  # unused VBScript class factory, and returns without process, network, or
  # file payload. Suspicion, not a hostile verdict.
  - id: obfuscated-recovered-upx-image
    desc: Recovered or mimicked UPX image with dense code obfuscation
    crit: suspicious
    conf: 0.97
    all:
      - id: repeated-immediate-reencoding
      - id: metadata/binary/section/label::recovered-upx-image-layout
