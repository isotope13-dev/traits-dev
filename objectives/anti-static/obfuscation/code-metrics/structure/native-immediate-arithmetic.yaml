defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: repeated-ecx-immediate-reencoding
    desc: Repeated x86 ECX immediate reencoding
    crit: component
    conf: 0.96
    count_min: 8
    if:
      type: hex
      section: UPX0
      pattern: 'B9 [4] 81 (C1|E9|F1) [4]'
  - id: repeated-edx-immediate-reencoding
    desc: Repeated x86 EDX immediate reencoding
    crit: component
    conf: 0.96
    count_min: 6
    if:
      type: hex
      section: UPX0
      pattern: 'BA [4] 81 (C2|EA|F2) [4]'

composite_rules:
  - id: repeated-immediate-reencoding
    desc: Dense arithmetic reencoding of x86 immediate constants
    crit: suspicious
    conf: 0.96
    all:
      - id: repeated-ecx-immediate-reencoding
      - id: repeated-edx-immediate-reencoding
    unless:
      - id: metadata/signed/trust-level::signer-evidence-present

  # Reencoding plus a recovered UPX layout is concealment-shaped but is
  # layout, not behavior. The CRT-shaped stub that carries it resolves
  # CoInitializeEx/CoGetClassObject as an emulator gate before running its
  # VirtualAlloc/decode/VirtualProtect stage table; that gate is convicted in
  # objectives/anti-analysis/emulator-detect. Suspicion here, not a verdict.
  - id: obfuscated-recovered-upx-image
    desc: Recovered or mimicked UPX image with dense code obfuscation
    crit: suspicious
    conf: 0.97
    all:
      - id: repeated-immediate-reencoding
      - id: metadata/binary/section/label::recovered-upx-image-layout
