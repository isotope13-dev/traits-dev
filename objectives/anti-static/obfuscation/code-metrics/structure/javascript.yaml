defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027.002
  mbc: B0032

traits:
  - id: js-octal-escape-stream
    desc: Dense JavaScript octal-escape stream
    crit: suspicious
    conf: 0.94
    size_min: 50000
    count_min: 1000
    if:
      type: text
      regex: '\\[0-9]{3}'
    # Generated bundles commonly inline WOFF/WOFF2 data; its byte escapes
    # are not JavaScript obfuscation. Keep this stream rule for source code.
    unless:
      - type: text
        substr: 'data:font/'
      - id: metadata/file/format/structured::sourcemap-context
      - id: metadata/library/structure::js-emscripten-asm-marker
      - id: metadata/library/structure::js-emscripten-module-marker
      - id: metadata/library/structure::js-emscripten-wasm-marker
      - type: text
        substr: _UNIDATA_MAP

composite_rules:
  - id: digit-heavy-charcode-eval-loader
    desc: Digit-heavy JavaScript line reconstructs and evaluates code
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007
    all:
      - id: metadata/file/metrics::js-single-line-over-50k
      - id: metadata/file/metrics::js-digit-ratio-over-30pct
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-argument
    near_bytes: 10000
    unless:
      - id: well-known/app/media/iphones-ru::simpla2-theme-bundle
  - id: large-digit-heavy-obfuscator-bundle
    desc: Large digit-heavy obfuscated JavaScript bundle
    # Size, digit density, and mangled names identify an obfuscation shape,
    # but do not by themselves establish malicious intent. Keep the stronger
    # full-preset composite as the single suspicious signal when present.
    crit: notable
    conf: 0.94
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: metadata/file/metrics::js-single-line-over-50k
      - id: metadata/file/metrics::js-digit-ratio-over-30pct
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      # The openclaw-evolver name markers were removed here: the member marker
      # is the bare substring `EVOLVER_` and the container marker an
      # `evolver-*.zip` basename, so a package exempted itself from the one
      # rule that describes it. The build/minifier entries below stay --
      # those assert a declared, inspectable build step, not a package name.
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/build/minifier::intentional-javascript-obfuscator-build
      - id: metadata/build/minifier::intentional-obfuscator-dist-artifact
      - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path

  - id: js-obfuscated-lua-dispatch
    desc: JavaScript-labeled source contains an obfuscated Lua dispatch payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.007
    all:
      - id: metadata/file/metrics::js-single-line-over-50k
      - id: js-octal-escape-stream
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-indexed-string-table-reassembly
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-loader
      - id: objectives/anti-static/obfuscation/code-metrics/runtime-indirection::computed-call-property-access-ast

  - id: js-obfuscated-lua-environment-loader
    desc: JavaScript-labeled source hides a Lua environment/proxy loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.007
    all:
      - id: js-octal-escape-stream
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-environment-proxy-loader
      - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-indexed-string-table-reassembly
      - id: objectives/anti-static/obfuscation/code-metrics/runtime-indirection::computed-call-property-access-ast

  - id: js-obfuscated-lua-return-loader
    desc: Obfuscated Lua loader disguised as JavaScript
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004
    all:
      - id: lua-packed-return-function-loader
      - id: js-octal-escape-stream
      - id: objectives/anti-static/obfuscation/syntax::js-obfuscated-increment
