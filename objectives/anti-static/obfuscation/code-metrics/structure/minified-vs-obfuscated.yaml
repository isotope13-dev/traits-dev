defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - javascript
  - typescript
composite_rules:
- id: minification-pattern
  desc: Code appears minified by webpack/uglify/terser
  crit: baseline
  conf: 0.8
  all:
  - id: metadata/file/line::source-lines-over-1000
  - id: metadata/file/profile/function-population::single-character-function-count
  unless:
  - id: metadata/build
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::decode-exec-js
- id: hostile-obfuscation
  desc: Hostile encoding or decode-and-execute behavior
  crit: suspicious
  conf: 0.9
  any:
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::decode-exec-js
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::hardcoded-key-decryptor
- id: minified-with-hostile-caps
  desc: Minified code with hostile execution or obfuscation
  crit: suspicious
  conf: 0.92
  all:
  - id: minification-pattern
  any:
  - id: micro-behaviors/process/create/exec::wsh-progid-near-run
  - id: objectives/command-and-control/backdoor/dispatch/runtime::socket-command-handler
  - id: hostile-obfuscation
  unless:
  - id: well-known/lib/web/client-side/jquery::license-url
  - id: well-known/lib/web/client-side/prototype::version-string
  - id: well-known/lib/web/client-side/prototype::copyright
  - id: well-known/lib/web/client-side/jquery::fn-extend
  - id: metadata/package/runtime::vscode-extension
  - id: metadata/build/bundler/asset::google-tag-manager-bundle
  - id: well-known/lib/web/authoring/google-closure-library::closure-library-copyright
  - id: well-known/lib/ui/yui::yui-connection-library
