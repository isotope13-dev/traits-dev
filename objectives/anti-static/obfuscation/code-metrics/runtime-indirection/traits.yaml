defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
traits:
- id: js-arrow-function-abuse
  desc: High anonymous arrow-function count
  # Minified UI bundles commonly contain many anonymous callbacks.  The count
  # is a structural obfuscation component; the obfuscator composite supplies
  # the suspicious interpretation only when other obfuscation markers agree.
  crit: notable
  conf: 0.8
  size_max: 50000
  if:
    type: metrics
    field: functions.anonymous
    min: 100
    min_size: 2048
  unless:
  - type: string_literal
    regex: MathJax
  - type: string_literal
    regex: wgxpath
  - type: string_literal
    regex: trix
  - type: string_literal
    regex: actiontext
  - id: metadata/build/
  - id: metadata/package/testing/
  - id: well-known/app/ai/browser-agent/open-webui-computer/
- id: js-indexof-decoder-heavy
  desc: 'Large JS with repeated indexOf decoder tables'
  crit: notable
  conf: 0.82
  size_min: 32768
  count_min: 20
  if:
    type: symbol
    exact: indexOf
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - type: text
    substr: fuse.js
  - type: text
    substr: lunr
- id: js-charcode-decoder-heavy
  desc: Repeated charCodeAt-to-fromCharCode transforms
  crit: notable
  conf: 0.84
  size_min: 8192
  count_min: 3
  if:
    type: text
    regex: 'String\.fromCharCode\s*\([^;\n]{0,120}\.charCodeAt\s*\('
  unless:
  - id: metadata/build/
  - id: well-known/lib/network/
  - id: metadata/package/testing/
- id: computed-call-property-access-ast
  desc: 'Computed property access through decoder calls'
  crit: baseline
  conf: 0.95
  attack: ''
  mbc: ''
  count_min: 3
  if:
    type: tree-sitter
    language: javascript
    query: |
      (subscript_expression
        index: (call_expression
          function: (identifier) @decoder
          arguments: (arguments (_))))
  unless:
  - id: metadata/package/testing/
# Repeated calls through a computed member with only numeric-constant
# arguments. In readable source this spelling is rare -- a fixed-offset
# record parser writes `buf.subarray(28, 44)`, naming the method -- but it is
# what a javascript-obfuscator string table leaves behind once every method
# name has been lifted out: `_0x4e4318[_0x27b92e(0x9a)](0x1c,0x2c)`. The
# offsets survive the rewrite because they are numbers, not names, so they
# remain the one readable part of an envelope parser.
#
# Notable alone (an indexed function table called with numeric arguments has
# the same shape); the loader composites pair it with the crypto evidence.
- id: js-computed-member-constant-offset-calls
  desc: Computed member called with constant offsets
  crit: notable
  conf: 0.85
  count_min: 3
  if:
    type: text
    regex: '\]\s*\(\s*[0-9a-fA-Fx]{1,8}\s*,\s*[0-9a-fA-Fx]{1,8}\s*\)'
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
composite_rules:
- id: js-obfuscator-pattern
  desc: JavaScript obfuscator tool output
  crit: suspicious
  conf: 0.9
  needs: 3
  any:
  - id: metadata/file/naming::high-entropy-identifiers
  - id: objectives/anti-static/obfuscation/code-metrics/runtime-indirection::js-arrow-function-abuse
  - id: objectives/supply-chain/trojanized/backdoor::high-entropy-strings-dup
  - id: metadata/file/comment::no-comments-code
  unless:
  - id: micro-behaviors/data/format/pem::begin-boundary
- id: js-npm-malware-pattern
  desc: npm malware obfuscation pattern (install
  crit: suspicious
  conf: 0.9
  size_max: 50000
  all:
  - id: metadata/file/naming::high-entropy-identifiers
  - id: metadata/file/comment::no-comments-code
  - id: metadata/file/line::source-lines-over-1000
  unless:
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers::js-sphinx-searchindex
  - id: micro-behaviors/data/format/pem::begin-boundary
- id: js-runtime-string-decoder-bundle
  desc: Large single-line JavaScript with runtime string decoder bundle
  crit: suspicious
  conf: 0.93
  size_min: 32768
  all:
  - id: js-indexof-decoder-heavy
  - id: js-charcode-decoder-heavy
  - id: metadata/file/line::source-lines-over-1000
  - id: metadata/file/naming::high-entropy-identifiers
