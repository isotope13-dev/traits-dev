# Go Source Code Metrics for Obfuscation Detection
# Detects obfuscation patterns in Go source code via metrics analysis
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: "T1027"
  mbc: "B0032"
traits:
  # `go-high-entropy-identifiers-recognized-marker` below enumerates the Go
  # sources whose identifiers are mechanically long rather than obfuscated --
  # generated tables, stringer output, test files -- but nothing referenced it,
  # so the carve-out never applied to the metric it was written for. The Go
  # toolchain's own generated sources are the standard case: SSA rewrite rules
  # (`OpAMD64VPMULHRSWMasked512`), SIMD intrinsic tables and the Windows
  # known-folder GUID list all score above 0.70.
  # A measurement, and rated as one: the ratio cannot separate garble's renamed
  # identifiers from a machine-written opcode table, and Go's own hand-written
  # `ssa/addressingmodes.go` scores 0.85 because it is pages of
  # `OpAMD64MOVQloadidx8` constants. The obfuscation *inference* is
  # `code-metrics/identifiers::identifier-obfuscation`, which references this
  # and requires a second independent identifier signal before concluding
  # anything -- matching how the language-agnostic siblings
  # (`metadata/file/metrics::high-entropy-identifier-ratio`) are treated.
  - id: go-many-high-entropy-identifiers
    desc: Most Go identifiers score high entropy
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: identifiers.high_entropy_ratio
      min: 0.70
      min_size: 4096
    unless:
      - id: go-high-entropy-identifiers-recognized-marker
  - id: go-autoconvert-helper-marker
    desc: Go autoConvert helper marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: autoConvert_
  - id: go-conversion-scope-marker
    desc: Go conversion.Scope marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: conversion.Scope
  - id: go-internal-assignment-marker
    desc: Go internal package assignment marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*[A-Za-z0-9_]+\s*=\s*internal\.'
  - id: go-status-code-const-table-marker
    desc: Go status-code constant table
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*(EngineStatus|BsStatus|Status)[A-Za-z0-9]+\s+int32\s*=\s*\d+\s*//'
  - id: go-status-message-map-marker
    desc: Go status-code message map
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^var\s+\w*Message\w*\s*=\s*map\[int32\]string\{'
  - id: go-environment-constant-table-marker
    desc: Go environment-name constant table
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*Environment[A-Za-z0-9_]{1,80}\s+Environment\s*=\s*".{1,80}"'
  - id: go-package-constant-table-marker
    desc: Go package constant table
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^package\s+constants\s+const\s*\(|^package\s+constants[\s\S]{0,400}\bconst\s*\('
  - id: go-tagged-struct-field-table-marker
    desc: Go tagged struct field table
    crit: component
    conf: 0.9
    count_min: 20
    if:
      type: text
      regex: '(?m)^\s*[A-Z]\w{12,}\s+\*?[\w.]+\s+`[a-z][\w:-]*:"[\w.:-]{1,32}"`'
  - id: go-demo-object-field-fixture-marker
    desc: Go fixture with repeated object field literals
    crit: component
    conf: 0.9
    count_min: 20
    if:
      type: text
      regex: '(?m)^\s*[A-Z]FieldOn[A-Z]\w+Object:'
  - id: go-stringer-generated-marker
    desc: Go stringer generated source
    crit: component
    conf: 0.95
    if:
      type: text
      substr: 'Code generated by "stringer'
  - id: go-oci-region-table-marker
    desc: Go OCI region constant table
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^package common[\s\S]{0,500}\bRegion[A-Z][A-Za-z0-9]+\s+Region\s*='
composite_rules:
  - id: go-high-entropy-identifiers-recognized-marker
    desc: Recognized Go high-entropy identifier marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/lang/source::generated-do-not-edit-text
      - id: go-autoconvert-helper-marker
      - id: go-conversion-scope-marker
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/harness/unit::go-test
      - id: go-internal-assignment-marker
      - id: go-package-constant-table-marker
      # Go stdlib auto-generated files: ztypes_*.go, zsyscall_*.go, zversion.go
      # have opaque system-type names that naturally score high entropy.
      - id: metadata/lang/compiler/generated::go-generated-z-basename
      # Localized/generated status-code tables often contain many long,
      # semantically meaningful identifiers that look high-entropy in metrics.
      - id: go-status-code-const-table-marker
      - id: go-status-message-map-marker
      # Configuration packages often define long exported environment-key
      # constants. Those identifiers are descriptive, not obfuscated.
      - id: go-environment-constant-table-marker
      # Protocol/data-model tables often contain many long exported field names
      # paired with compact struct tags. Those are schema identifiers, not
      # runtime indirection.
      - id: go-tagged-struct-field-table-marker
      # Demo/test fixtures can contain large literal object tables with long,
      # descriptive field names. Those are static sample data, not obfuscation.
      - id: go-demo-object-field-fixture-marker
      - id: go-stringer-generated-marker
      - id: go-oci-region-table-marker
