defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1027
  mbc: B0032
traits:
  - id: few-strings
    desc: 'Very few string literals'
    crit: notable
    conf: 0.4
    for: [scripts, -shell, binaries]
    if:
      type: metrics
      field: strings.count
      max: 3
      min_size: 2048
    unless:
      - type: basename
        regex: '\.blade\.php$'
      # Declaration files intentionally contain type signatures and very few
      # runtime string literals; low string density here is not concealment.
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/extension/identity::flow-declaration-extension
  - id: readme-basename
    desc: README basename (markdown/plain text)
    crit: notable
    conf: 1.0
    for: [javascript, typescript, html]
    if:
      type: path
      basename: true
      regex: '(^|[._-])README([._-][^\\/]*)?$'
composite_rules:
  - id: few-strings-recognized-marker
    desc: Recognized few-strings marker
    crit: component
    conf: 1.0
    any:
      - id: metadata/file/comment::high-comment-to-code-ratio
      - id: metadata/file/padding::high-whitespace-ratio
      - id: metadata/lang/source::interface-only-source
      - id: metadata/file/extension/identity::html-basename
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: metadata/file/extension/identity::flow-declaration-extension
      - id: readme-basename
      - id: metadata/lang/generated::automatically-generated-source-marker
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/lib/web/wordpress-core::wordpress-block-build-asset
      - id: well-known/lib/web/wordpress-core::wordpress-block-pattern-file
      - id: well-known/lib/ui/presentation::photoswipe-dynamic-caption-bundle
      - id: well-known/lib/ui/presentation::photoswipe-lightbox-bundle
      - id: objectives/discovery/system/fingerprint/info::rendered-phpinfo-dump
  - id: string-hiding
    desc: String concealment/encoding
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/supply-chain/trojanized/backdoor::high-entropy-strings-dup
    any:
      - id: few-strings
      - id: metadata/file/data-blob::high-text-entropy
    unless:
      - id: objectives/anti-static/obfuscation/code-metrics/strings::string-hiding__unless_1
