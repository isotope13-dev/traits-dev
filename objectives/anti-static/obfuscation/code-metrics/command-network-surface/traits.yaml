defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
traits: []
composite_rules:
- id: oversized-js-command-network-surface
  desc: Oversized JavaScript carries command and network indicators
  crit: suspicious
  conf: 0.94
  all:
  - id: objectives/anti-static/obfuscation/code-metrics/line-shape::js-oversized-source-file
  - id: "metadata/file/profile/string-population::twenty-plus-shell-command-strings"
  any:
  - id: "metadata/file/profile/string-population::fifty-plus-url-strings"
  - id: "metadata/file/profile/string-population::ten-plus-ip-address-strings"
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/file/policy/config/whitelabel/
  - id: metadata/file/policy/config/deeplink/
  downgrade:
    any:
    - id: metadata/build/bundler/asset::js-large-module-bundle
    - id: metadata/build/minifier::js-large-minified-bundle
