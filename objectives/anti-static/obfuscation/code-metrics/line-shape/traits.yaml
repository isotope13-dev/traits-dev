defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
traits:
- id: js-oversized-source-file
  desc: JavaScript source file exceeds 10 MB
  crit: notable
  conf: 0.9
  size_min: 10485760
  if:
    type: path
    basename: true
    regex: '\.([cm]?js|tsx?)$'
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/lib/vendor-sdk/tscircuit-eval::dist-blob-url-bundle
  # Keep the known VS Code bundle exclusion local to this objective signal.
  - id: objectives/anti-static/obfuscation/code-metrics/line-shape::vscode-extension-large-line-marker
composite_rules:
- id: js-packed-numeric-xor-blob
  desc: JavaScript packed numeric XOR blob
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/arithmetic::js-digit-ratio-at-least-85pct
  - id: metadata/file/padding::near-zero-whitespace-source
  - id: metadata/file/line::single-long-line
  - id: micro-behaviors/data/source/syntax/keyword::js-keyword-xor
- id: vscode-extension-large-line-marker
  desc: VS Code extension bundle marker
  crit: component
  conf: 0.9
  any:
  - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: well-known/lib/development/vscode::vscode-extension-marker
