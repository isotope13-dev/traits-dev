defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
traits:
- id: js-extreme-numeric-blob
  desc: JavaScript extreme numeric blob
  # Digit-heavy JavaScript also occurs in legitimate Unicode/code-point
  # lookup tables.  Keep this as component evidence; the packed-XOR composite
  # below supplies the obfuscation signal needed for a suspicious finding.
  crit: notable
  conf: 0.92
  size_min: 5000
  size_max: 500000
  if:
    type: metrics
    field: text.digit_ratio
    min: 0.85
  unless:
  - id: metadata/package/testing/
  - id: objectives/anti-static/obfuscation/code-metrics/structure/
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/library/structure/
  - id: metadata/package/files/dependency::node-modules-path
  - type: metrics
    field: ast.call_count
    max: 0
- id: js-near-zero-whitespace
  desc: JavaScript near-zero whitespace
  crit: notable
  conf: 0.9
  size_min: 5000
  if:
    type: metrics
    field: text.whitespace_ratio
    max: 0.01
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: js-oversized-source-file
  desc: JavaScript source file exceeds 10 MB
  crit: notable
  conf: 0.9
  size_min: 10485760
  if:
    type: path
    basename: true
    regex: '\.([cm]?js|tsx?)$'
  unless:
  - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
  - id: metadata/file/format/structured::sourcemap-sources-content
  # Keep the known VS Code bundle exclusion local to this objective signal.
  - id: objectives/anti-static/obfuscation/code-metrics/line-shape::vscode-extension-large-line-marker
composite_rules:
- id: js-packed-numeric-xor-blob
  desc: JavaScript packed numeric XOR blob
  crit: suspicious
  conf: 0.95
  all:
  - id: js-extreme-numeric-blob
  - id: js-near-zero-whitespace
  - id: metadata/file/metrics::single-long-line
  - id: micro-behaviors/data/source/syntax/keyword::js-keyword-xor
- id: vscode-extension-large-line-marker
  desc: VS Code extension bundle marker
  crit: component
  conf: 0.9
  any:
  - id: metadata/library/runtime::vscode-webview-bundle
  - id: metadata/library/runtime::acquire-vscode-api
  - id: metadata/library/vscode::vscode-extension-marker
