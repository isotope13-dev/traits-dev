defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
traits:
- id: js-extreme-numeric-blob
  desc: JavaScript extreme numeric blob
  # Digit-heavy JavaScript also occurs in legitimate Unicode/code-point
  # lookup tables.  Keep this as component evidence; the packed-XOR composite
  # below supplies the obfuscation signal needed for a suspicious finding.
  crit: component
  conf: 0.92
  size_min: 5000
  size_max: 500000
  if:
    type: metrics
    field: text.digit_ratio
    min: 0.85
  unless:
  - id: metadata/package/testing/
  - id: objectives/anti-static/obfuscation/code-metrics/structure/
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/library/structure/
  - id: metadata/package/files/dependency::node-modules-path
  - type: metrics
    field: ast.call_count
    max: 0
- id: js-near-zero-whitespace
  desc: JavaScript near-zero whitespace
  crit: component
  conf: 0.9
  size_min: 5000
  if:
    type: metrics
    field: text.whitespace_ratio
    max: 0.01
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: js-megabyte-single-line
  desc: JS/TS line exceeds 1 MB
  crit: notable
  conf: 0.9
  size_min: 1000000
  if:
    type: metrics
    field: text.max_line_length
    min: 1000000
  unless:
  - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
  - id: metadata/file/format/structured::sourcemap-sources-content
  # Suppress only on the benign VS Code webview bundle, never on the whole
  # sibling directory: the other line-shape traits (near-zero whitespace,
  # extreme numeric blob) are *reinforcing* obfuscation evidence, and a
  # directory-wide `unless` that includes this trait's own directory silently
  # disabled the megabyte-line signal on exactly the packed payloads it exists
  # to catch.
  - id: objectives/anti-static/obfuscation/code-metrics/line-shape::vscode-extension-large-line-marker
  # Same reasoning for the sibling `structure/` directory: its long-line shape
  # atoms (`single-long-line-outlier`, `last-line-over-1000`) are true of every
  # single-line file by definition, so excluding on the directory made this
  # trait unreachable. Name the two genuinely benign contexts instead — real
  # minifier output (which keeps thousands of source lines) and an inline
  # source map.
  - id: objectives/anti-static/obfuscation/code-metrics/structure::minification-pattern
  - id: objectives/anti-static/obfuscation/code-metrics/structure::source-map-inline
  - type: text
    word: tiktoken
  - type: metrics
    field: imports.count
    min: 100
- id: js-oversized-source-file
  desc: JavaScript source file exceeds 10 MB
  crit: notable
  conf: 0.9
  size_min: 10485760
  if:
    type: path
    basename: true
    regex: '\.([cm]?js|tsx?)$'
  unless:
  - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
  - id: metadata/file/format/structured::sourcemap-sources-content
  # Same self-suppression fix as js-megabyte-single-line above.
  - id: objectives/anti-static/obfuscation/code-metrics/line-shape::vscode-extension-large-line-marker
composite_rules:
- id: js-packed-numeric-xor-blob
  desc: JavaScript packed numeric XOR blob
  crit: suspicious
  conf: 0.95
  all:
  - id: js-extreme-numeric-blob
  - id: js-near-zero-whitespace
  - id: metadata/file/metrics::single-long-line
  - id: micro-behaviors/data/source/syntax/keyword::js-keyword-xor
- id: vscode-extension-large-line-marker
  desc: VS Code extension bundle marker
  crit: component
  conf: 0.9
  any:
  - id: metadata/library/runtime::vscode-webview-bundle
  - id: metadata/library/runtime::acquire-vscode-api
  - id: metadata/library/vscode::vscode-extension-marker
