defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
composite_rules:
- id: js-packed-numeric-xor-blob
  desc: JavaScript packed numeric XOR blob
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/arithmetic::js-digit-ratio-at-least-85pct
  - id: metadata/file/padding::near-zero-whitespace-source
  - id: metadata/file/line::single-long-line
  - id: micro-behaviors/data/source/syntax/keyword::js-keyword-xor
- id: vscode-extension-large-line-marker
  desc: VS Code extension bundle marker
  crit: component
  conf: 0.9
  any:
  - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: well-known/lib/development/vscode::vscode-extension-marker
