defaults:
  platforms: [windows, unix]
  for: [scripts, pe, elf, macho]
  attack: T1027
  mbc: B0032
traits:
- id: excessive-single-char-vars
  desc: "Excessive single-character var names (>30%)"
  crit: baseline
  conf: 0.8
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.31
    min_size: 1024
- id: private-model-codegen-marker
  desc: Private model codegen marker
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Code generated by private/model/cli/gen-api/main.go
- id: jruby-embedded-runtime-member
  for: [java, ruby, jar, class]
  desc: JRuby embedded runtime member path
  crit: notable
  conf: 0.99
  if:
    type: path
    regex: '(jruby-complete\.jar|META-INF[\\/]jruby\.home([\\/]|$))'
- id: python-aws-iam-import
  desc: Python AWS IAM CDK import
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: from aws_cdk import aws_iam as iam
composite_rules:
- id: python-aws-iam-policy-table-marker
  desc: Python AWS IAM policy table marker
  crit: component
  conf: 0.95
  for: [python]
  all:
  - id: python-aws-iam-import
  - id: metadata/lang/source/declaration::python-uppercase-actions-list
- id: single-char-var-recognized-marker
  desc: Generated or declaration identifier marker
  crit: component
  conf: 1.0
  any:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/lang/natural/phrasing::generated-by-wording
  - id: metadata/build/bundler/asset::js-any-bundle-output
  - id: metadata/build/bundler/wrapper::esmodule-bundled
  - id: metadata/build/minifier::js-umd-wrapper-minified
  - id: metadata/build/minifier::js-umd-wrapper-amd-minified
  - id: well-known/lib/web/client-side/ecmascript::next-edge-runtime-bundle
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/file/format/markup::source-svg-path-data-marker
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: objectives/anti-static/obfuscation/code-metrics/functions::steam-trade-content-script-marker
- id: recognized-sequential-identifier-marker
  desc: Generated or test sequential names
  crit: component
  conf: 0.95
  any:
  - id: private-model-codegen-marker
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/lang/generated::generated-source-or-marker-context
- id: recognized-low-reuse-marker
  desc: Test or harness low reuse marker
  crit: component
  conf: 0.95
  any:
  - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
  - id: metadata/package/testing/harness/runtime::is-test
  - id: well-known/lib/testing/nodeunit::nodeunit
  - id: objectives/anti-static/obfuscation/code-metrics/functions::steam-trade-content-script-marker
- id: identifier-obfuscation-recognized-marker
  desc: Generated, test, or runtime identifier marker
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/generated::generated-source-or-marker-context
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
  - id: metadata/build/autotools::c-header-template-basename
  - id: jruby-embedded-runtime-member
  - id: metadata/package/testing/presence/path::test-spec-path-benign-context
  - id: metadata/package/testing/harness/benchmark::python-benchmark-harness
  - id: well-known/lib/runtime/scripted/pydantic::pydantic-import
  - id: metadata/package/testing/harness/unit::phpunit-test-context
  - id: metadata/package/testing/harness/unit::phpunit-test-shape
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: well-known/lib/runtime/scripted/jruby::runtime-context
  - id: well-known/lib/native/glibc
  - id: python-aws-iam-policy-table-marker
  - id: well-known/lib/cloud/aws-sdk-js::smithy-typescript-codegen-schema
  - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
