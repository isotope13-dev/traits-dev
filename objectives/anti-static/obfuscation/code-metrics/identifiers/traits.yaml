defaults:
  platforms: [windows, unix]
  for: [scripts, pe, elf, macho]
  attack: T1027
  mbc: B0032
traits:
- id: excessive-single-char-vars
  desc: "Excessive single-character var names (>30%)"
  crit: baseline
  conf: 0.8
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.31
    min_size: 1024
- id: py-excessive-single-char-vars
  desc: "Excessive single-character var names (>45%)"
  crit: notable
  conf: 0.8
  for:
  - python
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.45
    min_size: 2048
  unless:
  - type: basename
    regex: \.(pxd|pyi|jq)$
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/lang/generated::automatically-generated-text
  - id: metadata/lang/generated::do-not-modify-banner
  - type: text
    substr: "Time complexity:"
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - type: text
    substr: "from pybench import"
  - type: text
    regex: 'class\s+\w+\(Test\)'
  - type: basename
    exact: easter.py
- id: perl-excessive-single-char-vars
  desc: High Perl single-character identifier ratio
  # Notable, not suspicious: a lone identifier-style code metric (cf. sibling
  # metadata/file/naming::numeric-suffix-identifiers). Idiomatic terse Perl and
  # one-liner toolkits (Mojolicious ojo exports single-letter helper subs)
  # routinely exceed 0.3; standalone this is an analyst hint, not malice.
  # Real obfuscated Perl escalates by composing this with eval/pack/encoded.
  crit: notable
  conf: 0.7
  for:
  - perl
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.3
    min_size: 4096
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: well-known/lib/network/curl::source-tree-path
  - id: metadata/lang/generated::automatically-generated-text
  - id: metadata/lang/generated::do-not-modify-banner
- id: py-sequential-identifiers
  desc: "Excessive sequential identifiers"
  crit: notable
  conf: 0.8
  for:
  - python
  if:
    type: metrics
    field: identifiers.sequential_names
    min: 25
  unless:
  - id: metadata/lang/generated::automatically-generated-source-marker
  - type: basename
    regex: \.(idl|odl|Rd)$
  - type: basename
    regex: \.(pyi|pxd)$
  - type: basename
    regex: \.(pyc|pyd|pfb|ps)$
  - type: metrics
    field: text.whitespace_ratio
    min: 0.2
  - type: string_literal
    substr: pybind11
  # Machine-generated bindings (SWIG, protobuf, gRPC stubs, etc.) carry high
  # sequential-identifier ratios by construction; exclude them like the sibling
  # py-many-high-entropy-identifiers / excessive-single-char-vars traits do.
- id: low-identifier-reuse
  desc: Low identifier reuse ratio
  crit: baseline
  conf: 0.7
  for: [scripts, -shell, binaries]
  size_max: 1000000
  if:
    type: metrics
    field: identifiers.reuse_ratio
    max: 0.15
    min_size: 2048
  unless:
  - type: basename
    regex: (^|[\\/])node_modules[\\/].{0,200}[\\/](test|example)
  - id: metadata/lang/scripted::perl-eval-exec-trampoline
  - type: basename
    regex: "^Makefile(\\..*)?$"
  - type: metrics
    field: text.whitespace_ratio
    min: 0.14
  - id: metadata/build/
- id: private-model-codegen-marker
  desc: Private model codegen marker
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Code generated by private/model/cli/gen-api/main.go
- id: jruby-embedded-runtime-member
  for: [java, ruby, jar, class]
  desc: JRuby embedded runtime member path
  crit: notable
  conf: 0.99
  if:
    type: path
    regex: '(jruby-complete\.jar|META-INF[\\/]jruby\.home([\\/]|$))'
- id: python-aws-iam-import
  desc: Python AWS IAM CDK import
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: from aws_cdk import aws_iam as iam
- id: python-iam-action-list-constants
  desc: Python IAM action list constants
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: '[A-Z_]+_ACTIONS\s*=\s*\['
composite_rules:
- id: python-aws-iam-policy-table-marker
  desc: Python AWS IAM policy table marker
  crit: component
  conf: 0.95
  for: [python]
  all:
  - id: python-aws-iam-import
  - id: python-iam-action-list-constants
- id: single-char-var-recognized-marker
  desc: Generated or declaration identifier marker
  crit: component
  conf: 1.0
  any:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/build/bundler/asset::js-any-bundle-output
  - id: metadata/build/bundler/wrapper::esmodule-bundled
  - id: metadata/build/minifier::js-umd-wrapper-minified
  - id: metadata/build/minifier::js-umd-wrapper-amd-minified
  - id: well-known/lib/web/ecmascript::next-edge-runtime-bundle
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/file/format/markup::source-svg-path-data-marker
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: objectives/anti-static/obfuscation/code-metrics/functions::steam-trade-content-script-marker
- id: recognized-sequential-identifier-marker
  desc: Generated or test sequential names
  crit: component
  conf: 0.95
  any:
  - id: private-model-codegen-marker
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/lang/generated::recognized-generated-source
- id: recognized-low-reuse-marker
  desc: Test or harness low reuse marker
  crit: component
  conf: 0.95
  any:
  - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
  - id: metadata/package/testing/harness/runtime::is-test
  - id: well-known/lib/testing/nodeunit::nodeunit
  - id: objectives/anti-static/obfuscation/code-metrics/functions::steam-trade-content-script-marker
- id: identifier-obfuscation-recognized-marker
  desc: Generated, test, or runtime identifier marker
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/generated::recognized-generated-source
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/package/testing/harness/runtime::is-test
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
  - id: metadata/build/autotools::c-header-template-basename
  - id: jruby-embedded-runtime-member
  - id: metadata/package/testing/presence/path::test-spec-path-benign-context
  - id: metadata/package/testing/harness/benchmark::python-benchmark-harness
  - id: well-known/lib/runtime/scripted/pydantic::pydantic-import
  - id: metadata/package/testing/harness/unit::phpunit-test-context
  - id: metadata/package/testing/harness/unit::phpunit-test-shape
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: well-known/lib/runtime/scripted/jruby::runtime-context
  - id: well-known/lib/native/glibc
  - id: python-aws-iam-policy-table-marker
  - id: well-known/lib/cloud/aws-sdk-js::smithy-typescript-codegen-schema
  - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
- id: identifier-obfuscation
  desc: Identifier obfuscation (random/encoded names)
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: metadata/file/naming::high-entropy-identifiers
  - id: metadata/file/naming::high-entropy-identifier-ratio
  - id: metadata/file/naming::many-high-entropy-identifiers
  - id: metadata/file/naming::python-high-entropy-identifier-ratio
  - id: objectives/anti-static/obfuscation/code-metrics/functions::high-entropy-function-names
  - id: low-identifier-reuse
  unless:
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/lang/locale::han-script-javascript-source
  - id: well-known/lib/data/holidays::country-calendar-module
  - id: well-known/lib/data/holidays::shared-calendar-module
  - id: well-known/lib/cloud/aws-sdk-js::smithy-typescript-codegen-schema
  - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
  downgrade:
    any:
    - id: metadata/file/naming::average-identifier-length-over-22
