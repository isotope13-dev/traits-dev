defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1027
  mbc: B0032
traits:
# Doxygen IDL/C++ namespace nav indexes (e.g. LibreOffice SDK docs):
# `var namespacecom_1_1sun_1_1star_1_1sheet = [ ... ]`
- id: js-doxygen-namespace-index
  desc: Doxygen namespace navigation index
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?m)^var namespace\w+_1_1\w*\s*='

- id: js-sphinx-searchindex
  desc: Sphinx documentation search index
  crit: notable
  conf: 0.9
  attack: ''
  mbc: ''
  if:
    type: text
    substr: Search.setIndex
- id: js-high-entropy-identifier-ratio-metric
  desc: High ratio of entropy-heavy identifiers
  crit: notable
  conf: 0.84
  size_min: 8000
  size_max: 30000
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
composite_rules:
- id: js-high-entropy-identifier-recognized-marker
  desc: High entropy identifier ratio recognized marker
  crit: component
  any:
  - id: metadata/build/bundler/wrapper::js-amd-define
  - id: metadata/file/format/structured::sourcemap
  - id: metadata/lang/source::c-or-template-basename
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/lang/source::js-test-or-spec-basename
  - id: metadata/lang/generated::generated-do-not-edit-text
  - id: metadata/build/bundler/wrapper::js-tsc-reexport-getter
  - id: metadata/build/bundler/asset::js-any-bundle-output
  - id: metadata/build/bundler/asset::js-large-module-bundle
- id: js-high-entropy-identifier-ratio
  desc: High ratio of entropy-heavy identifiers
  crit: notable
  conf: 0.84
  all:
  - id: metadata/lang/source::js-ts-source-basename
  - id: js-high-entropy-identifier-ratio-metric
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/build/bundler/wrapper::babel-transpiled
