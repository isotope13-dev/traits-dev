defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  attack: T1027
  mbc: B0032
traits:
- id: monster-function
  desc: Extremely large function (>500 lines)
  crit: baseline
  conf: 0.8
  if:
    type: metrics
    field: functions.over_500_lines
    min: 1
  unless:
  - id: metadata/build
  - id: metadata/package/testing/harness/runtime/
  - type: metrics
    field: text.whitespace_ratio
    min: 0.14
  - type: text
    substr: generated module into git
  - type: text
    substr: The path of the emitted Rust module
  - type: text
    substr: The version of the Unicode data files to download
  downgrade:
    any:
    - id: well-known/lib/stdlib/lodash/
- id: many-large-functions
  desc: Multiple very large source functions
  crit: notable
  conf: 0.7
  size_max: 50000
  if:
    type: metrics
    field: functions.over_100_lines
    min: 5
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers/
  - id: metadata/file/profile/function-population::php-many-short-function-lines
  - id: metadata/file/profile/identifier-population::python-or-perl-single-character-ratio
  - id: metadata/file/literal::search-setindex-reference
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - type: metrics
    field: text.whitespace_ratio
    min: 0.14
  - id: metadata/path::test-directory-component
