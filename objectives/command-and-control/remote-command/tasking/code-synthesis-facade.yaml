defaults:
  platforms: [windows]
  for: [whl, python-sdist, pkginfo, python]
composite_rules:
  - id: code-synthesis-facade-hidden-command-agent
    desc: Code synthesis facade conceals an HTTP shell agent
    crit: hostile
    conf: 0.99
    attack: T1036,T1059.006,T1071.001
    scope: archive
    all:
      - id: metadata/package/description/function::summary-claims-code-synthesis
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
      - id: micro-behaviors/communications/http/request/tasking::python-poll-shell-handler-result-profile
