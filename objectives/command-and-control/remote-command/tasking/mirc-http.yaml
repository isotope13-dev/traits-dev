defaults:
  platforms: [windows]
  for: [mirc, lua, data]
  attack: T1105,T1059
traits:
  - id: mirc-remote-filename-triggers-download
    desc: Remote filename token triggers mIRC download
    crit: suspicious
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: 'if filename == \$1 \{[^\n]{0,180}writeini[^\n]{0,80}\$2-[^\n]{0,80}download'
composite_rules:
  - id: mirc-http-tasked-download-execution
    desc: HTTP tasking downloads and runs selected files
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-remote-filename-triggers-download
      - id: micro-behaviors/process/create/shellexec::mirc-socket-close-run-variable
      - id: micro-behaviors/fs/write/file/stream::mirc-binary-filename-variable-write
      - id: micro-behaviors/communications/socket/receive::mirc-sockread-event
