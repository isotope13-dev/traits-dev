# PowerShell HTTP tasking loop.
#
# The minimal shape of a script-based agent: an unbounded loop that retrieves a
# response body from a remote endpoint, evaluates it in the current process,
# and sleeps before asking again. There is no dropped file and no persistence —
# the loop is the whole agent, so the operator's commands only ever exist in
# memory.
#
# The DownloadString result must be bound to an Invoke-Expression argument.
# Alias spelling, variable names and the endpoint may vary. The result-return
# variant also binds evaluated output to an upload using the same URI variable.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: http-poll-eval-agent-loop
    desc: Poll loop runs code fetched over HTTP
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1059.001
    all:
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
      # The eval leg must consume the fetched body, not any local IEX:
      # provisioning libraries IEX locally built env-var strings.
      - id: micro-behaviors/process/deploy/script-eval::powershell-downloadstring-iex
    near_lines: 24
    unless:
      - id: micro-behaviors/os/console/io::operator-prompted-fetch-loop

  - id: http-poll-eval-result-return
    desc: Polling agent returns evaluated command output
    crit: hostile
    conf: 0.98
    all:
      - id: http-poll-eval-agent-loop
      - id: micro-behaviors/process/deploy/script-eval::powershell-downloaded-eval-result-upload
