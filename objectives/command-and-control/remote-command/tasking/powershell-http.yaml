# PowerShell HTTP tasking loop.
#
# The minimal shape of a script-based agent: an unbounded loop that retrieves a
# response body from a remote endpoint, evaluates it in the current process,
# and sleeps before asking again. There is no dropped file and no persistence —
# the loop is the whole agent, so the operator's commands only ever exist in
# memory.
#
# The legs are deliberately mechanism-agnostic (any body-retrieving WebClient
# or web cmdlet, any Invoke-Expression spelling) because the loop, not the
# transport, is what identifies the agent.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: response-body-retrieval
    desc: Retrieves an HTTP response body
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/communications/http/client/managed::uploadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell

  - id: fetched-code-evaluation
    desc: Evaluates a string as PowerShell code
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/interpreter/eval::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex-alias

  - id: http-poll-eval-agent-loop
    desc: Poll loop runs code fetched over HTTP
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1059.001
    all:
      - id: micro-behaviors/data/control-flow/loop::powershell-infinite-loop
      - id: micro-behaviors/process/lifecycle/supervise::watchdog-delay
      - id: response-body-retrieval
      - id: fetched-code-evaluation
    near_lines: 24
