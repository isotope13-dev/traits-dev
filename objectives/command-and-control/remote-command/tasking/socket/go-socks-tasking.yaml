# Go remote-task dispatcher with a separately available SOCKS relay.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-task-dispatcher-with-socks-relay
    desc: Go task and SOCKS names with browser theft
    crit: hostile
    conf: 0.95
    attack: T1090,T1071
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-login-query-with-keylogging
      - id: metadata/lang/source/naming/function/communication::go-main-p2p-socks-name
      - id: micro-behaviors/communications/proxy/socks/reference::socks5-proto
      - id: objectives/command-and-control/backdoor/tasking/routine-name::go-main-task-loop-name
      - id: objectives/command-and-control/backdoor/tasking/routine-name::go-main-do-task-name
      - id: objectives/command-and-control/backdoor/tasking/routine-name::go-main-task-status-name
      - id: micro-behaviors/process/create/runtime-symbol::go-os-exec-package-reference
      - id: objectives/command-and-control/backdoor/tasking/routine-name::c2-handler-server-label
