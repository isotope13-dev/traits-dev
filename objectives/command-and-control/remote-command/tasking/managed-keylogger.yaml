# This is a co-occurrence signature, not a claim of proven data flow.
# An ordinary HTTP client, shell launcher or remote-admin tool is insufficient.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-keylogger-http-command-executor
    desc: Keylogger with HTTP response, command executor and output records
    crit: hostile
    conf: 0.97
    attack: T1059.003,T1071.001
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: metadata/binary/symbols/name/token::managed-command-executor-name
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::getresponsestream
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
      - id: micro-behaviors/data/format/string::command-output-record-prefix
