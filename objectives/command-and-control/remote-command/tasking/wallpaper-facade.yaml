# The shell/HTTP profile alone is legitimate remote administration. The
# conviction requires a wallpaper-only advertised function plus concealed
# Windows execution in the same distributable, not a package name or C2 IOC.
defaults:
  platforms: [windows]
  for: [whl, python-sdist, pkginfo, python]
composite_rules:
  - id: wallpaper-facade-hidden-command-agent
    desc: Wallpaper facade conceals an HTTP shell agent
    crit: hostile
    conf: 0.99
    attack: T1036,T1059.006,T1071.001
    scope: archive
    all:
      - id: metadata/package/description/function::wallpaper-rotator-summary
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
      - id: micro-behaviors/communications/http/request/tasking::python-poll-shell-handler-result-profile
