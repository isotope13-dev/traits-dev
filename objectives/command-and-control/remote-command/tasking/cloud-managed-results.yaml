defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - powershell
  - csharp
  crit: hostile
  conf: 0.97
composite_rules:
- id: cloud-managed-task-results
  desc: Cloud assembly tasking returns invocation results
  attack: T1102.002
  all:
  - id: objectives/command-and-control/channel/deaddrop/cloud-storage::cloud-hex-suffix-managed-tasking
  any:
  - id: micro-behaviors/communications/http/put::python-urllib-reflected-result-upload
  - id: micro-behaviors/communications/http/put::powershell-reflected-result-upload
  - id: micro-behaviors/communications/http/put::csharp-helper-reflected-result-upload
