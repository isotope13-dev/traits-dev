defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - powershell
  - csharp
  crit: hostile
  conf: 0.97
composite_rules:
- id: cloud-managed-task-results
  desc: Cloud assembly tasking returns invocation results
  attack: T1102.002
  all:
  - id: micro-behaviors/os/module/load::http-assembly-method-invocation
  - id: micro-behaviors/communications/http/put::reflected-method-result-upload
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host-source-literal
  - id: micro-behaviors/communications/http/services/google::googleapis-drive
  - id: micro-behaviors/communications/http/url/cloud::yandex-disk-api-url
  near_bytes: 8192
