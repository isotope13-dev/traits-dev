defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  conf: 0.98

composite_rules:
  - id: shell-task-near-process-execution
    desc: Shell-task branch near child-process execution
    crit: suspicious
    # This establishes proximity, not provenance. The enclosing agent rule
    # additionally requires the full check-in/task/result/file protocol and loop.
    near_bytes: 320
    all:
      - id: objectives/command-and-control/backdoor/tasking/json-http::shell-task-dispatch-branch
    # Use indexed call sites. The broader execution umbrella includes text
    # fallbacks that also see subprocess examples embedded in docstrings.
    any:
      - id: micro-behaviors/process/create/subprocess::python-subprocess-launch-calls
      - id: micro-behaviors/process/create/subprocess::go-exec-command-call
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/process/create/shell/bridge::js-execasync-call
      - id: micro-behaviors/process/create/subprocess::rust-command-new-call

  - id: polling-json-file-shell-agent
    desc: HTTP task-polling agent dispatches shell and file tasks
    crit: hostile
    attack: T1059,T1071.001,T1105
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/backdoor/tasking/json-http::checkin-task-result-file-protocol
      - id: shell-task-near-process-execution
      - id: objectives/command-and-control/backdoor/tasking/json-http::upload-task-dispatch-branch
      - id: objectives/command-and-control/backdoor/tasking/json-http::download-task-dispatch-branch
    any:
      - id: micro-behaviors/data/control-flow/loop::source-infinite-loop-metric
      - id: micro-behaviors/data/control-flow/loop::block-unbounded-loop-header
      - id: micro-behaviors/data/control-flow/loop::python-unconditional-while-header
