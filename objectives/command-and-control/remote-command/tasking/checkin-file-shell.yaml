defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  conf: 0.98

composite_rules:
  - id: polling-json-file-shell-agent
    desc: HTTP task-polling agent dispatches shell and file tasks
    crit: hostile
    attack: T1059,T1071.001,T1105
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/backdoor/tasking/json-http::checkin-task-result-file-protocol
      - id: micro-behaviors/data/control-flow/branch::shell-branch-near-process-call
      - id: objectives/command-and-control/backdoor/tasking/json-http::upload-task-dispatch-branch
      - id: objectives/command-and-control/backdoor/tasking/json-http::download-task-dispatch-branch
    any:
      - id: micro-behaviors/data/control-flow/loop::source-infinite-loop-metric
      - id: micro-behaviors/data/control-flow/loop::block-unbounded-loop-header
      - id: micro-behaviors/data/control-flow/loop::python-unconditional-while-header
