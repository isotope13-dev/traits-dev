defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-packet-file-management-handlers
    desc: Handles remote file transfer and deletion
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule go_packet_file_management_handlers {
          strings:
            $protocol = "github.com/go-well/spider/silk"
            $delete = "RegisterHandler(silk.FsRemove"
            $remove = "os.RemoveAll(path)"
            $download = "RegisterHandler(silk.FsDownload"
            $upload = "RegisterHandler(silk.FsUpload"
            $send = "c.Send(p)"
          condition:
            all of them
        }
