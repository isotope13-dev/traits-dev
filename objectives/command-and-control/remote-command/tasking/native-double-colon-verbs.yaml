# Some HTTP bot panels send each task as "verb::argument" and the bot
# dispatches on the verb. Keylogger and flood verbs in that form, embedded
# in a PE, are the bot's task table: legitimate software has no reason to
# carry a "httpflood::" or "setkeylogger::" command.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1498
traits:
  - id: double-colon-attack-or-keylogger-verb
    desc: Bot task verb for flood or keylogger
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '\b(setkeylogger|httpflood|udpflood|synflood|tcpflood)::'
      case_insensitive: true
composite_rules:
  - id: wininet-bot-task-verbs-with-run-key-persistence
    desc: WinINet bot with flood verbs and Run-key persistence
    crit: hostile
    conf: 0.9
    all:
      - id: double-colon-attack-or-keylogger-verb
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
