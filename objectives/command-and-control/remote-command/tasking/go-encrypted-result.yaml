# A received command, shell execution and encrypted output return form a
# remote-command channel. No server address, bot name or chosen file is needed.
defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: go-encrypted-shell-command-results
    desc: Received shell commands return encrypted output
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1573
    all:
      - id: micro-behaviors/process/create/command-handler::command-received-format
      - id: micro-behaviors/process/create/command-handler::encrypted-command-result-errors
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
      - id: micro-behaviors/process/fd/stdio::go-binary-combined-output-reference
      - id: micro-behaviors/fs/path/application/executable::go-bin-sh-binary-reference
