# A received command, shell execution and encrypted output return form a
# remote-command channel. No server address, bot name or chosen file is needed.
defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: go-encrypted-shell-command-results
    desc: Received shell commands return encrypted output
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1573
    all:
      - id: metadata/lang/natural/diagnostic::command-received-format
      - id: metadata/lang/natural/diagnostic::encrypted-command-result-errors
      - id: metadata/binary/symbols/name/qualified/execution::go-native-exec-command-reference
      - id: metadata/binary/symbols/name/process::go-binary-combined-output-reference
      - id: micro-behaviors/fs/path/application/interpreter::go-bin-sh-binary-reference
