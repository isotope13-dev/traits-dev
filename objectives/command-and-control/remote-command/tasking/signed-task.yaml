defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: signed-c2-task-fetch-verify-execute
  desc: Signed task execution with credential collection
  crit: hostile
  conf: 0.99
  attack: T1071.001,T1552.001
  all:
  - id: objectives/command-and-control/remote-command/tasking::http-json-verified-command-task-loop
  - id: micro-behaviors/crypto/verify::python-ed25519-key-verify
  - id: objectives/credential-access/files/secret-sweep::python-developer-key-file-content-collection
  - id: objectives/credential-access/env/secrets/bulk-access::script-cross-vendor-secret-catalog-harvest
