# sckit receives signed tasks from its C2: fetch a task list, verify each
# task's signature against a baked-in key, execute what verifies. Updaters
# verify signatures too, but they install artifacts -- executing verified
# blobs fetched over HTTP inside the same routine is remote tasking.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: signed-c2-task-fetch-verify-execute
    desc: Fetched C2 tasks verified then executed
    crit: hostile
    conf: 0.92
    attack: T1102,T1059
    near_bytes: 1500
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-assignment
      - id: micro-behaviors/crypto/asymmetric/signature::public-key-verify-call
      - id: micro-behaviors/process/create/subprocess::process-execution
