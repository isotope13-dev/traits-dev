# Can match disabled groups: this records capability, not current execution.
# UFU asks the compromised SubSeven server to replace itself from a URL.
# https://www.giac.org/paper/gcih/258/discovering-variant-gt-bot/102567
defaults:
  for: [mirc]
  platforms: [windows]
traits:
  - id: mirc-subseven-ufu-command
    desc: mIRC socket sends SubSeven remote update command
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bsockwrite\s+\$sockname\s+UFU\s+\$\+\s+%[\w.]+'
composite_rules:
  - id: mirc-irc-subseven-update-tasking
    desc: IRC TEXT handlers and sockets issue SubSeven update tasks
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-subseven-ufu-command
      - id: micro-behaviors/communications/socket/connect::mirc-sockopen
      - id: micro-behaviors/communications/socket/receive::mirc-sockread-event
      - id: micro-behaviors/communications/ipc/irc::mirc-on-text-handler
