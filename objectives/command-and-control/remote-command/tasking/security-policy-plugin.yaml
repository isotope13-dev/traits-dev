# Packet.Read decodes a LEB128 task array and dispatches these verbs to the
# registry, firewall and critical-process handlers. Individual verbs identify
# a task vocabulary, not a network transport or a particular RAT family.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: critical-set-task-verb
    desc: CriticalSet task verb
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: CriticalSet
      section: .text
  - id: userinit-task-verb
    desc: RegUserinit task verb
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: RegUserinit
      section: .text
  - id: firewall-disable-task-verb
    desc: FireWall- task verb
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: FireWall-
      section: .text
composite_rules:
  - id: managed-security-control-task-plugin
    desc: Security-control tasks with firewall/crash APIs
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1562.004,T1529
    all:
      - id: critical-set-task-verb
      - id: userinit-task-verb
      - id: firewall-disable-task-verb
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/impact/degrade/firewall::netsh-firewall-off
      - id: micro-behaviors/os/syscall/invoke::nt-raise-hard-error-reference
      - id: micro-behaviors/process/control/critical::rtl-set-process-is-critical-reference
      - id: micro-behaviors/os/registry/write::taskmgr-policy-write-api-cooccurrence
