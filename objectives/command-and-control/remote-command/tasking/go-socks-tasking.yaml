# Go remote-task dispatcher with a separately available SOCKS relay.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-task-dispatcher-with-socks-relay
    desc: Go task and SOCKS names with browser theft
    crit: hostile
    conf: 0.95
    attack: T1090,T1071
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-login-query-with-keylogging
      - id: metadata/binary/symbols/name/qualified::go-main-p2p-socks-name
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: metadata/binary/symbols/name/qualified::go-main-task-loop-name
      - id: metadata/binary/symbols/name/qualified::go-main-do-task-name
      - id: metadata/binary/symbols/name/qualified::go-main-task-status-name
      - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference
      - id: metadata/binary/symbols/name/token::c2-handler-server-label
