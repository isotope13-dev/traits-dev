# Go remote-task dispatcher with a separately available SOCKS relay.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-task-dispatcher-with-socks-relay
    desc: Go task dispatcher with SOCKS relay
    crit: hostile
    conf: 0.95
    attack: T1090,T1071
    all:
      - id: metadata/binary/symbols/name::go-main-p2p-socks-name
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: metadata/binary/symbols/name::go-main-task-loop-name
      - id: metadata/binary/symbols/name::go-main-do-task-name
      - id: metadata/binary/symbols/name::go-main-task-status-name
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
      - id: objectives/command-and-control/beacon/label::c2-handler-server-label
