defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-sliver-beacon-file-download-task
    desc: Tasks Sliver beacon to download a file
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule go_sliver_beacon_file_download_task {
          strings:
            $framework = "github.com/bishopfox/sliver/protobuf/sliverpb"
            $target = "con.ActiveTarget.GetInteractive()"
            $rpc = "con.Rpc.Download(context.Background(), &sliverpb.DownloadReq{"
            $path = "Path:             filePath"
            $beacon = "con.AddBeaconCallback(download.Response.TaskID"
            $decode = "proto.Unmarshal(task.Response, download)"
          condition:
            all of them
        }
