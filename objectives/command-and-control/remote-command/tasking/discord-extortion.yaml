defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: bang-download-command
    desc: Bang-prefixed file-download task verb
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .rdata
      pattern: '21 64 6C 00'
  - id: bang-exec-command
    desc: Bang-prefixed exec task verb
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .rdata
      pattern: '21 65 78 65 63 00'
  - id: bang-screen-command
    desc: Bang-prefixed screen task verb
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .rdata
      pattern: '21 73 63 72 65 65 6E 00'
composite_rules:
  - id: discord-extortion-shell-tasking
    desc: Discord polling and shell tasks in extortion PE
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1102
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::bcrypt-file-encryption-payment-demand
      - id: micro-behaviors/communications/http/auth::bot-authorization-header-prefix
      - id: micro-behaviors/communications/http/query::messages-limit-query-path
      - id: micro-behaviors/communications/http/services/discord::user-guilds-endpoint
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
    # A renamed command still invokes the same shell handler. The old verb
    # remains corroboration and preserves existing positive coverage.
    any:
      - id: bang-exec-command
      - id: micro-behaviors/communications/ipc/pipe::x64-compared-command-process-pipe-readback
