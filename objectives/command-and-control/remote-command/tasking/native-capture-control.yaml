defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  # Fingerprints the native RAT command dispatcher, rather than inferring
  # control from socket and process API names alone. Reversal, injection,
  # capture, and pipe support are corroborating code/data observations.
  - id: native-byte-dispatch-capture-implant
    desc: Native byte-command dispatcher with concealed launch and capture APIs
    crit: hostile
    conf: 0.98
    attack: T1219,T1055
    all:
      - id: metadata/binary/instruction::x86-bounded-two-table-byte-jump
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-createprocessa-name
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
      - id: micro-behaviors/hardware/display/camera::vfw-capture-window
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/os/event/log::clear-event-log-import
