# Independent, operand-bound operations: downloaded managed code is invoked,
# its result is sent back, and a remotely selected local file is uploaded.
# This combination admits tasking without guessing a provider from a URL
# reference. Each constituent binds its own data; no shared request is claimed.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: python-managed-code-file-tasking
    desc: Managed code results beside remote-selected file export
    attack: T1059.006,T1005,T1041
    all:
      - id: micro-behaviors/os/module/load::http-assembly-method-invocation
      - id: micro-behaviors/communications/http/put::reflected-method-result-upload
      - id: micro-behaviors/communications/http/upload::managed-http-selected-file-upload
    near_bytes: 8192
