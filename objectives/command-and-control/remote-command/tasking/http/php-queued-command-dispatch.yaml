defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1059,T1071.001
  mbc: B0030
composite_rules:
  - id: php-queued-reply-command-shell-dispatch
    desc: PHP queues a reply command and dispatches it to a shell
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/data/config/write::wordpress-stores-response-command
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-method-call
      - id: micro-behaviors/process/create/shell/variable-command::php-exec-concatenated-variable-command
    near_bytes: 8000
