# Remote agent workers that poll a controller, accept jobs, and hand those jobs
# to a local agent runtime. The combination is an endpoint-control capability.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # One string instructs an agent through the complete remote-work lifecycle.
  # A literal matcher avoids firing on modules that merely register the same
  # tools as separate declarations.
  - id: agent-task-tool-chain-instruction
    desc: Instructs agent to claim and submit tasks
    crit: suspicious
    conf: 0.98
    attack: T1059
    if:
      type: literal
      kind: string
      regex: '\w+_list_tasks[\s\S]{0,400}\w+_grab_task[\s\S]{0,400}\w+_submit_deliverable'

  # Work-queue claim paths: /api/.../jobs/claim, /v1/agent/work/<id>/claim.
  - id: remote-job-claim-endpoint
    desc: Claims jobs from a remote controller
    crit: notable
    conf: 0.96
    attack: T1105
    if:
      type: text
      regex: '(?i)/(jobs?|work|tasks?|orders?)/[A-Za-z0-9_./${}()%-]{0,80}claim\b'
  - id: remote-job-heartbeat-endpoint
    desc: Heartbeats a claimed job or agent controller
    crit: notable
    conf: 0.94
    attack: T1071.001
    if:
      type: text
      regex: '(?i)/(api/[A-Za-z0-9_./${}()%-]{0,120}jobs/[A-Za-z0-9_./${}()%-]{0,80}|agent/)heartbeat'
composite_rules:
  # Unattended agent run: server-supplied prompt on stdin, edits auto-accepted.
  - id: remote-agent-unattended-dispatch
    desc: Claimed job runs an agent with auto-accepted edits
    crit: suspicious
    conf: 0.96
    attack: T1059
    all:
      - id: micro-behaviors/data/llm/permission::js-agent-unattended-edit-mode
      - id: micro-behaviors/data/llm/permission::js-agent-headless-stream-json
  - id: remote-agent-unattended-job-control
    desc: Controller hands jobs to an unattended local agent
    crit: hostile
    conf: 0.97
    attack: T1105,T1059
    all:
      - id: remote-job-claim-endpoint
      - id: remote-agent-unattended-dispatch
    any:
      - id: remote-job-heartbeat-endpoint
      - id: micro-behaviors/communications/http/request/reference::quoted-post-token

  - id: remote-agent-tool-dispatch
    desc: Remote job enables local agent execution
    crit: suspicious
    conf: 0.98
    attack: T1059
    all:
      - id: micro-behaviors/data/llm/permission::agent-tool-execution-permission-flag
      - id: micro-behaviors/data/llm/delegation::agent-prompt-dispatch-call
  - id: remote-agent-job-control
    desc: Remote controller dispatches jobs to local tools
    crit: hostile
    conf: 0.995
    attack: T1105,T1059
    all:
      - id: remote-job-claim-endpoint
      - id: remote-agent-tool-dispatch
    any:
      - id: remote-job-heartbeat-endpoint
      - id: micro-behaviors/communications/http/request/reference::quoted-post-token
