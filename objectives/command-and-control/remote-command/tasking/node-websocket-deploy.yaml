# A Node.js agent that listens on a WebSocket, writes an executable to disk,
# and runs it is a remote-tasking implant deploying second-stage payloads on
# demand (the ulid-xyz / MicrosoftSystem64 npm RAT shape: a `deploy_binary`
# verb behind a WebSocket message handler). None of the three legs names a
# family, C2 host, or verb string, so the rule survives renamed commands and
# rotated infrastructure. Same-file scope keeps an unrelated updater's download
# in one module from pairing with a socket handler in another.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059
  mbc: B0030

composite_rules:
  - id: node-websocket-deploys-executable
    desc: WebSocket handler drops and runs a binary
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/websocket/receive::websocket-message-event-handler
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/process/create/variable-spawn::spawn-variable-program
    unless:
      # Filename-convention test guards: the corpus itself sits under
      # testdata/, which the broader harness/runtime is-test context matches.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/presence/harness::test-directory-path
