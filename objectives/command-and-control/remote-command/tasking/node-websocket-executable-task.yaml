defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1105,T1071.001

composite_rules:
  - id: node-websocket-received-executable-task
    desc: WebSocket task message writes and launches a supplied executable
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/websocket/receive::websocket-message-event-handler
      - id: micro-behaviors/data/parse/json::json-parse-call
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/process/create/exec::spawn-variable-program
