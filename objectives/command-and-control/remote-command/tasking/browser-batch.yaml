defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003,T1071.001,T1105

composite_rules:
  - id: headless-browser-command-fragment-backdoor
    desc: Headless browser stages and executes command fragments
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/client/browser-cli::chromium-command-remote-url
      - id: micro-behaviors/process/create/flags::chromium-headless-launch-flag
      - id: micro-behaviors/process/deploy::batch-copied-script-execution
      - id: micro-behaviors/communications/http/upload::batch-command-output-curl-upload
    near_lines: 16

  - id: offscreen-browser-task-result-callback
    desc: Concealed browser script execution beside result upload
    crit: hostile
    conf: 0.98
    near_lines: 16
    all:
      - id: objectives/execution/payload/file-exec::offscreen-browser-script-staging
      - id: micro-behaviors/communications/http/upload::batch-command-output-curl-upload
