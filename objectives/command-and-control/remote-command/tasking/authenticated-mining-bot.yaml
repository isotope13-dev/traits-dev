# Recovered Linux bot dispatch protocol: controller authentication, numbered
# command replies, and mining start/stop tasking. No endpoint or build pinning.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.99
traits:
  - id: authenticated-bot-poll-template
    desc: Authenticated bot polling URL template
    crit: notable
    if:
      type: text
      exact: 'http://%s/cgi-bin/p.cgi?r=0&auth=hash&i=%s&enckey=%s'
  - id: numbered-mining-command-vocabulary
    desc: Mining tasks beside CMDv2 reply framing
    crit: notable
    if:
      type: hex
      section: rodata
      pattern: "73 74 61 72 74 5f 6d 69 6e 69 6e 67 00 [0-16] 5f 43 4d 44 76 32 5f 3b 25 64 3a 00 [0-768] 73 74 6f 70 5f 6d 69 6e 69 6e 67 00"
composite_rules:
  - id: authenticated-mining-command-dispatch
    desc: Authenticated bot mining task protocol
    crit: hostile
    attack: T1071.001,T1496
    all:
      - id: authenticated-bot-poll-template
      - id: numbered-mining-command-vocabulary
      - id: micro-behaviors/communications/socket/create::socket-connect
