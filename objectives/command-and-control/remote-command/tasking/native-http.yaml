defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # The dispatcher reads a received task header at +0x10, subtracts 1000,
  # bounds the command to twenty entries, and jumps through its handler table.
  - id: binary-task-1000-series-dispatch
    desc: Binary task selects 1000-series handler
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8B 47 04 89 4D ?? 89 45 ?? 8B 47 10 89 45 ?? 05 18 FC FF FF 83 F8 13 89 4D ?? 0F 87 [4] FF 24 85 [4]'
  # Header validation is protocol data processing, not C2 by itself.
composite_rules:
  - id: native-http-binary-task-dispatch
    desc: HTTP RAT tasking captures command output
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059
    all:
      - id: binary-task-1000-series-dispatch
      - id: micro-behaviors/data/checksum::binary-task-header-checksum-x86
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/communications/ipc/pipe::peek-named-pipe
      - id: micro-behaviors/process/create/spawn::create-process-w
