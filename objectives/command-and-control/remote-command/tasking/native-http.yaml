defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: native-http-binary-task-dispatch
    desc: HTTP RAT tasking captures command output
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059
    all:
      - id: micro-behaviors/data/control-flow/branch::header-range-switch-1000-x86
      - id: micro-behaviors/data/checksum::binary-task-header-checksum-x86
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/communications/ipc/pipe::peek-named-pipe
      - id: micro-behaviors/process/create/spawn::create-process-w
