defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  - id: node-c2-command-postback
    desc: Node C2 executes and reports output
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1071.001
    scope: file
    near_lines: 100
    all:
      # Was: a received-command dispatch leg (execute() on an object's cmd
      # field). Removed: that matcher is the command pattern every store,
      # editor and CQRS handler uses, so as a standalone atom it
      # false-positived on benign dispatch (a vetted data-store write), and
      # composite legs cannot be inline. The remaining four legs -- C2 URL,
      # shell-exec of a variable command, output capture, JSON postback --
      # still establish the execute-and-report shape.
      - id: objectives/command-and-control/infrastructure/config::c2-url-constant
      - id: micro-behaviors/process/create/shell/local::node-exec-command-variable
      - id: micro-behaviors/process/fd/stdio::node-child-output-fallback
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
