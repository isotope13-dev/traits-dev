defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: object-cmd-dispatch
    desc: Dispatches object cmd field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\bexecute\s*\(\s*[A-Za-z_$][\w$]*\.cmd\s*\)'

composite_rules:
  - id: node-c2-command-postback
    desc: Node C2 executes and reports output
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1071.001
    scope: file
    near_lines: 100
    all:
      - id: objectives/command-and-control/infrastructure/config::c2-url-constant
      - id: object-cmd-dispatch
      - id: micro-behaviors/process/create/shell/local::node-exec-command-variable
      - id: micro-behaviors/process/fd/stdio::node-child-output-fallback
      - id: micro-behaviors/communications/http/request/client::node-http-post-json-body
