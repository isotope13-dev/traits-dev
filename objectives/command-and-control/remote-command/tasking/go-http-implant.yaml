# Recovered task protocol, not mere networking plus an execution import.
# CyberStrikeAI also supplies this implant for authorized engagements, so
# these static observations remain suspicious rather than asserting abuse.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: go-http-implant-task-dispatch
    desc: Implant-token HTTP task protocol with execution support
    crit: suspicious
    conf: 0.97
    attack: T1071.001,T1059.003
    all:
      - id: micro-behaviors/communications/http/token-auth::implant-token-header
      - id: metadata/binary/symbols/name::go-task-execution-result-routine-names
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: micro-behaviors/process/create/subprocess::go-native-exec-command-reference
