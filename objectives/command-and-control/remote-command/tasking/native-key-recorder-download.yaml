defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  # The recorder supplies attack admission. The deployment atom binds the
  # byte task, scheduled callback, URL source, output path and launch sink.
  # An ordinary updater or a detached downloader cannot supply these roles.
  - id: key-recorder-byte-task-download-launch
    desc: Keylogging implant tasks download and launch files
    crit: hostile
    conf: 0.98
    attack: T1105
    all:
      - id: objectives/collection/keylog/polling::native-xor-key-recording
      - id: micro-behaviors/process/deploy/file-exec::x86-byte-task-urlmon-winexec
