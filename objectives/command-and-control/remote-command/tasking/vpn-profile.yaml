# Tasking carried in a VPN client's own profile file.
#
# A trojanized tunnel client turns its configuration into the command channel:
# the fork's profile parser is taught one directive the upstream keyword set
# does not have, the directive's value is a sealed blob, and the plaintext is
# handed to the client's script-hook runner once the tunnel is up. Nothing
# arrives over the network that a network sensor could catch — the operator
# who mails the profile also mails the task.
#
# CERT-UA/UAC-0145 shipped this as "SopraVPN", a WireGuard fork whose
# [Interface] section accepted a SymmetricKey directive holding an AES-256-GCM
# blob keyed with the tunnel's own PrivateKey (August 2026). The composites
# below key on the shape, not on that directive name: profile parser plus
# symmetric decryption plus process creation, in one file.
#
# A stock VPN client parses the same profile and does spawn processes for its
# PreUp/PostUp hooks — WireGuard's own key agreement is Curve25519 and
# ChaCha20-Poly1305, so it is the block-cipher decryption alongside the parser
# that separates a fork carrying a payload from the client it was built from.
defaults:
  platforms: [windows, linux, macos]
  attack: T1059,T1027
  mbc: B0011,C0027

composite_rules:
  - id: go-wgquick-profile-decrypt-exec
    desc: WireGuard profile directive decrypted and run
    crit: hostile
    conf: 0.93
    for: [go]
    all:
      - id: well-known/lib/network/wireguard::wgquick-config-parser
      - id: micro-behaviors/process/create/direct::exec-command
    any:
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/crypto/symmetric/key::symmetric-key-from-private-key-field
      - id: micro-behaviors/crypto/library/provider::aes-new-cipher
      - id: micro-behaviors/crypto/library/provider::aes-cbc-encrypter
    needs: 1

  - id: python-wgquick-profile-decrypt-exec
    desc: WireGuard profile directive decrypted and run
    crit: hostile
    conf: 0.93
    for: [python]
    all:
      - id: well-known/lib/network/wireguard::wgquick-config-parser
      - id: micro-behaviors/process/create/subprocess::process-execution
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-gcm-mode
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
    needs: 1
