# A bounded attack task schema, independent of family names or prompt prose.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, json, text]
# Reference: https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/

traits:
  - id: injection-evasion-task-schema
    desc: Hollowing and unhooking task choices
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'exploit_type.{0,4}:.{0,80}process_hollow[\s\S]{0,180}evasion_method.{0,4}:.{0,80}unhook'

composite_rules:
  - id: llm-injection-evasion-task-schema
    desc: Hosted LLM API co-occurs with hollowing and unhooking task choices
    crit: suspicious
    conf: 0.96
    all:
      - id: injection-evasion-task-schema
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
