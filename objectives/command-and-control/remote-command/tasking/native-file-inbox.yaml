defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  # These fixed protocol verbs alone establish no operation; the composite
  # requires the heartbeat, inbox retrieval, HTTP receive and shell sink.
  - id: ping-exec-cmd-sleep-verb-table
    desc: Ping, exec, cmd and sleep table fragment
    crit: component
    conf: 0.99
    if:
      type: hex
      section: .rdata
      pattern: '70 69 6E 67 00 [0-8] 65 78 65 63 00 [0-8] 63 6D 64 00 73 6C 65 65 70 00'
composite_rules:
  - id: http-file-inbox-shell-tasking
    desc: HTTP inbox task protocol with shell execution
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1059.003
    all:
      - id: ping-exec-cmd-sleep-verb-table
      - id: micro-behaviors/data/serialize/json::json-poll-heartbeat-template
      - id: micro-behaviors/communications/http/url/query::file-inbox-list-query
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
