defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071.001,T1498.001

traits:
# This name carries an explicit C2 role. Generic command-handler names are
# neutral dispatch evidence, while named attack dispatchers live with the DoS
# behaviors that give them meaning.
- id: go-c2-connect-handler-symbol
  desc: Go ELF exposes a C2 connection handler
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.connect(To)?(CNC|C2|Server)\b'
composite_rules:
