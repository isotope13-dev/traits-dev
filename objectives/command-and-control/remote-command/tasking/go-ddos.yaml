defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071.001,T1498.001

traits:
# These names carry an explicit C2 or attack role. Generic command-handler
# names are neutral dispatch evidence and live under data/control-flow; the
# hostile flood composite combines that atom with the intent-specific names.
- id: go-c2-connect-handler-symbol
  desc: Go ELF exposes a C2 connection handler
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.connect(To)?(CNC|C2|Server)\b'
- id: go-c2-attack-dispatch-symbol
  desc: Go ELF exposes a C2 attack dispatcher
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.(handleAttack|dispatchAttack|runAttack)\b'

composite_rules:
- id: go-c2-driven-flood-tasking
  desc: Go ELF receives C2 tasking for protocol floods
  crit: hostile
  conf: 0.99
  all:
  - id: go-c2-connect-handler-symbol
  - id: micro-behaviors/data/control-flow/dispatch::go-main-command-handler-symbol
  - id: go-c2-attack-dispatch-symbol
  - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
  - id: objectives/impact/dos/attack/flood::go-main-attack-handler-cluster
