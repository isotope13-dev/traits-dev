defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071.001,T1498.001

traits:
# These two name a C2 role, so the symbol has to carry that role. The bare
# `main.connect` and `main.handle` alternatives they used to accept are two of
# the most common function names in any Go program: `main.handle` alone scored
# `go-get-folder-size`, a directory-size utility vendored by the Pinokio
# installer, as "exposes a C2 command handler". Keep the compounds that only a
# bot names its functions after; the flood composite below needs five legs
# anyway, so the generic spellings added FP surface and no detection.
- id: go-c2-connect-handler-symbol
  desc: Go ELF exposes a C2 connection handler
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.connect(To)?(CNC|C2|Server)\b'
- id: go-c2-command-handler-symbol
  desc: Go ELF exposes a C2 command handler
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.(handleCommand|processCommand|execCommand)\b'
  unless:
    - type: path
      regex: '/(runc|containerd|dockerd)(/|$)'
- id: go-c2-attack-dispatch-symbol
  desc: Go ELF exposes a C2 attack dispatcher
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '\bmain\.(handleAttack|dispatchAttack|runAttack)\b'

composite_rules:
- id: go-c2-driven-flood-tasking
  desc: Go ELF receives C2 tasking for protocol floods
  crit: hostile
  conf: 0.99
  all:
  - id: go-c2-connect-handler-symbol
  - id: go-c2-command-handler-symbol
  - id: go-c2-attack-dispatch-symbol
  - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
  - id: objectives/impact/dos/attack/flood::go-main-attack-handler-cluster
