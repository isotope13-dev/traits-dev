# Python Sliver C2 operator clients (sliver-py) that task implants — shellcode
# injection, process migration, and remote assembly execution. Distinct from
# implant binaries under well-known/malware/rat/sliver/.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1055,T1620,T1071
  mbc: E1055

traits:
  - id: sliver-py-client-import
    desc: Imports sliver-py Sliver C2 client
    crit: notable
    conf: 0.95
    if:
      type: import
      regex: '(?i)^(SliverClient|SliverClientConfig)$'

  - id: sliver-client-construct
    desc: Constructs a SliverClient operator session
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: SliverClient

  - id: sliver-execute-shellcode-call
    desc: Tasks Sliver implant to execute shellcode
    crit: suspicious
    conf: 0.95
    attack: T1055
    if:
      type: text
      regex: '\.execute_shellcode\s*\('

  - id: sliver-execute-assembly-call
    desc: Tasks Sliver implant to run .NET assembly
    crit: suspicious
    conf: 0.95
    attack: T1055
    if:
      type: text
      regex: '\.execute_assembly\s*\('

  - id: sliver-session-migrate-call
    desc: Tasks Sliver implant process migration
    crit: suspicious
    conf: 0.93
    attack: T1055
    if:
      type: text
      regex: 'session\.migrate\s*\(|\.migrate\s*\(\s*session_id'

composite_rules:
  # Prefer one hostile for implant code-exec tasking; assembly/migrate atoms
  # remain suspicious so analysts still see the surface without stacking
  # duplicate hostiles on the same Sliver client file.
  - id: python-sliver-shellcode-tasking
    desc: Python Sliver client tasks implant shellcode
    crit: hostile
    conf: 0.97
    all:
      - id: sliver-client-construct
      - id: sliver-execute-shellcode-call
