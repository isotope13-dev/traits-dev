# Python that reads a fetched JSON document's asset list (url, args) and
# downloads and launches each entry hidden. Whoever serves the document
# chooses what runs on the host and with which arguments: remote tasking
# dressed as a data or update feed (timeweave, 2026).
defaults:
  platforms: [windows]
  for: [python]
  crit: hostile
  attack: T1105,T1106,T1564.003

composite_rules:
  - id: python-fetched-manifest-assets-run-hidden
    desc: Fetched manifest picks binaries and args to run hidden
    conf: 0.92
    all:
      - id: micro-behaviors/data/collection/map::mapping-get-assets-key
      - id: micro-behaviors/data/collection/map::mapping-get-url-key
      - id: micro-behaviors/data/collection/map::mapping-get-args-key
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-response-move-win32-launch
      - id: micro-behaviors/process/create/hidden::python-win32-hidden-startup-launch
