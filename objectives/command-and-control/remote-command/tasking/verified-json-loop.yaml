defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: http-json-verified-command-task-loop
  desc: HTTP JSON task loop verifies decoded commands
  crit: suspicious
  conf: 0.99
  if:
    type: tree-sitter
    query: |2

      ((block
        (expression_statement (assignment left: (identifier) @key
          right: (call function: (attribute object: (identifier) @keytype attribute: (identifier) @constructor))))
        (expression_statement (assignment
          left: (identifier) @response
          right: (call) @fetch))
        (for_statement
          left: (identifier) @task
          right: (call
            function: (attribute object: (identifier) @json attribute: (identifier) @loads)
            arguments: (argument_list (identifier) @parsed))
          body: (block
            (expression_statement (assignment
              left: (identifier) @payload
              right: (call
                function: (attribute object: (identifier) @base64 attribute: (identifier) @b64)
                arguments: (argument_list (subscript value: (identifier) @fieldtask)))))
            (expression_statement (call
              function: (attribute object: (identifier) @verifier attribute: (identifier) @verify)
              arguments: (argument_list (_) (identifier) @verified)))
            (expression_statement (call
              function: (attribute object: (identifier) @subprocess attribute: (identifier) @launch)
              arguments: (argument_list
                (call function: (attribute
                  object: (call function: (attribute object: (identifier) @executed attribute: (identifier) @decode))
                  attribute: (identifier) @split)))))))) @tasks
        (#match? @fetch "urlopen\\(")
        (#match? @fetch "\\.read\\(\\)$")
        (#eq? @response @parsed)
        (#eq? @json "json") (#eq? @loads "loads")
        (#eq? @task @fieldtask)
        (#eq? @base64 "base64") (#eq? @b64 "b64decode")
        (#eq? @keytype "Ed25519PublicKey") (#eq? @constructor "from_public_bytes")
        (#eq? @key @verifier) (#eq? @verify "verify")
        (#eq? @payload @verified) (#eq? @payload @executed)
        (#eq? @subprocess "subprocess") (#match? @launch "^(run|Popen)$")
        (#eq? @decode "decode") (#eq? @split "split"))
