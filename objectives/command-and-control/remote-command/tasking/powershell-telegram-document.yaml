defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: telegram-document-task-launch-loop
    desc: Concealed Telegram document execution loop
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    attack: T1105,T1102.002,T1564.003
    all:
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/communications/http/services/telegram::telegram-document-id-assignment
      - id: micro-behaviors/communications/http/services/telegram::telegram-get-updates-path
      - id: micro-behaviors/communications/http/services/telegram::telegram-get-file-by-id-path
      - id: micro-behaviors/communications/http/services/telegram::telegram-file-api-url
      - id: micro-behaviors/process/deploy/file-exec::powershell-same-variable-outfile-launch
      - id: micro-behaviors/process/create/hidden::start-process-hidden-window-option
      - id: objectives/evasion/masquerade/path::whitespace-system-path-fetch-and-launch
