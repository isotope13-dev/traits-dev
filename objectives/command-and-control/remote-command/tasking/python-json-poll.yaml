# Python command agents that poll an HTTP JSON record, execute its command,
# and write process output back to the same record. The field atoms are kept
# local because they only become attacker tasking when combined with polling,
# HTTP transport, and shell-backed process creation.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059,T1071.001
  mbc: B0030

traits:
  - id: json-command-field-read
    desc: Reads command from JSON response
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*\.get\(["'']cmd["'']\s*,'

  - id: json-command-result-writeback
    desc: Maps command output to JSON result
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '["'']result["'']\s*:\s*output[\s\S]{0,160}["'']result_id["'']\s*:\s*cmd_id'

composite_rules:
  - id: python-http-json-polling-command-agent
    desc: Python HTTP polling agent executes JSON commands and returns output
    crit: hostile
    conf: 0.995
    scope: file
    near_lines: 90
    all:
      - id: json-command-field-read
      - id: json-command-result-writeback
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/process/create/subprocess::shell-true
    unless:
      - id: well-known/tool/offensive/
