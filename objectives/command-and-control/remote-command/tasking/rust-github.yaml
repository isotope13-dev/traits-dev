defaults:
  platforms: [windows]
  for: [rust]
  attack: T1059.003,T1102.002
  mbc: B0030

composite_rules:
  - id: github-contents-encrypted-command-execution
    desc: GitHub Contents tasking decrypts and executes Windows commands
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/command-and-control/channel/deaddrop/github::github-contents-polled-mailbox-c2
      - id: micro-behaviors/crypto/symmetric/aes/
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/direct::rust-command-output
    near_bytes: 8192
