# Compact HTTPS C2 agents that parse a JSON `cmd` field and shell it out,
# while swallowing uncaughtException so the beacon stays alive.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001

traits:
  - id: json-parse-execsync-exec-member
    desc: JSON.parse then execSync on exec field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'JSON\.parse[\s\S]{0,480}\bexecSync\s*\(\s*[A-Za-z_$][\w]*\.exec\b'

composite_rules:
  - id: https-json-cmd-exec-agent
    desc: HTTPS polling and cmd-member execution
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-cmd-member-exec-call
      - id: micro-behaviors/data/serialize/json::json-parse-call
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/time/schedule/interval::setInterval-reference
    any:
      - id: micro-behaviors/process/hook/event::process-on-uncaught-exception
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
    scope: file
    near_lines: 120

  - id: node-c2-beacon-command-exec
    desc: Node C2 agent polls beacon and executes commands
    crit: hostile
    conf: 0.98
    mbc: B0030
    all:
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/process/create/shell/bridge::execSync-dynamic-command
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
    any:
      - id: micro-behaviors/time/schedule/interval::repeated-settimeout
      - id: micro-behaviors/time/schedule/interval::setInterval-reference
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: well-known/app/development/cloudflare::cli-context

  - id: node-https-post-json-remote-exec
    desc: Node HTTPS POST executes remote JSON command
    crit: hostile
    conf: 0.97
    all:
      - id: json-parse-execsync-exec-member
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/process/create/shell/bridge::execSync-dynamic-command
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
    scope: file
    near_lines: 80
    unless:
      - id: metadata/package/testing/

