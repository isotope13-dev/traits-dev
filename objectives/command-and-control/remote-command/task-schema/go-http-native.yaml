# Function names and API references are co-occurrence indicators, not a
# recovered call graph. Command agents can be used for authorized testing.
defaults:
  for: [elf, macho]
  platforms: [unix]
traits:
  - id: go-fetch-task-function
    desc: Go fetch-task or instruction function name
    crit: component
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|[.])(fetch|get)(task|instruction)s?$'
  - id: go-run-command-function
    desc: Go run-command function name
    crit: component
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|[.])(run|execute)(command|task)s?$'
  - id: go-submit-result-function
    desc: Go submit-result function name
    crit: component
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|[.])(send|submit|post)(command|task)?results?$'
composite_rules:
  - id: go-http-task-shell-routine-indicators
    desc: Go task, command and result routines with HTTP and shell references
    crit: suspicious
    conf: 0.9
    all:
      - id: go-fetch-task-function
      - id: go-run-command-function
      - id: go-submit-result-function
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
      - id: micro-behaviors/fs/path/application/executable::bin-sh-path-reference
