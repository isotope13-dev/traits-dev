defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: ransom-control-verbs
    desc: Ransom configuration or cipher control token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)^ransom(ware)?[_:](config|encrypt|decrypt)\b'

  - id: keylogger-start-verb
    desc: Keylogger start control token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)^start[_:]keylog(ger)?$'

  - id: keylogger-stop-verb
    desc: Keylogger stop control token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)^stop[_:]keylog(ger)?$'

composite_rules:
  # These are command vocabulary, not English mentions of ransomware or
  # keylogging. Socket receive/send, an execution sink and a victim-directed
  # ransom demand are all required; ordinary remote administration has no
  # ransom-control role. This describes a control profile, not a proven
  # source-to-sink relationship between every imported API.
  - id: socket-ransom-surveillance-control-profile
    desc: Socket agent with ransom and keylog controls
    crit: hostile
    conf: 0.97
    attack: T1059,T1071
    all:
      - id: ransom-control-verbs
      - id: keylogger-start-verb
      - id: keylogger-stop-verb
      - id: micro-behaviors/communications/socket/receive::recv-api
      - id: micro-behaviors/communications/socket/send::send-api
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: objectives/impact/ransom/encrypt/config::ransom-note-text
      - id: objectives/impact/ransom/encrypt-note::pay-ransom
