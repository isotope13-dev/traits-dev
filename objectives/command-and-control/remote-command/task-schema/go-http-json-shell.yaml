# These are co-occurring source indicators; they do not establish data flow or
# whether the client was deployed. Remote administration can be authorized.
defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-http-get-request
    desc: Go HTTP GET request construction
    crit: component
    if:
      type: text
      regex: 'http[.]NewRequest(WithContext)?\([^\n]{0,180}http[.]MethodGet'
  - id: go-json-decoder
    desc: Go JSON decoder construction
    crit: component
    if:
      type: text
      regex: 'json[.]NewDecoder\s*\('
  - id: go-run-action-case
    desc: Go run action case
    crit: component
    if:
      type: text
      regex: '\bcase\s+"run"\s*:'
  - id: go-shell-command-exec
    desc: Go shell command execution
    crit: component
    if:
      type: text
      regex: 'exec[.]Command(Context)?\s*\(\s*"(/bin/)?(ba)?sh"\s*,\s*"-[a-z]*c"'
  - id: go-http-request-execution
    desc: Go HTTP client request execution
    crit: component
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z_0-9]*[.]Do\s*\(\s*[A-Za-z_][A-Za-z_0-9]*\s*\)'
composite_rules:
  - id: go-http-json-run-shell-indicators
    desc: HTTP GET, JSON run action and shell execution co-occur
    crit: suspicious
    conf: 0.9
    all:
      - id: go-http-get-request
      - id: go-json-decoder
      - id: go-run-action-case
      - id: go-shell-command-exec
      - id: go-http-request-execution
