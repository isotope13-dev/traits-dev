# Disclosure evidence for browser agents; CDP automation is a neutral capability.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1176.001,T1185,T1219

composite_rules:
  - id: extension-announces-agent-control
    desc: Extension announces agent control, yields to user
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/ui/window/notify::aria-live-status-region
      - id: micro-behaviors/os/telemetry/activity::trusted-input-event-guard
