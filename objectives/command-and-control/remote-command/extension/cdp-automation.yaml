# Browser extensions that puppeteer the page through the debugger protocol.
#
# The chrome.debugger extension API is a full CDP client against the user's own
# tabs. An extension that uses it to synthesize human input -- mouse clicks,
# keystrokes, typed text -- and to evaluate arbitrary JavaScript is not
# assisting the user; it is driving the browser as an operator would, which is
# the engine of engagement-fraud bots, account-automation services, and
# remote-control agents. The synthetic input is deliberate: dispatching real
# Input.dispatch* events (rather than firing DOM events) is how such tooling
# defeats the platform's is-this-a-human risk controls.
#
# Legitimate reasons for a *shipped extension* to do this are vanishingly rare
# (test-runner and RPA tooling ships as such, and is recognized elsewhere), so
# the combination convicts; the unless-list carries those known exceptions.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1176.001,T1185,T1219

composite_rules:
  - id: extension-cdp-input-eval-automation
    desc: Extension puppeteers the browser via CDP synthetic input and JS eval
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/attach/webextension::chrome-debugger-send-command
      - id: micro-behaviors/communications/http/devtools/client::cdp-input-event-injection
    any:
      # Arbitrary JS execution in the page, or a local/remote bridge that drives
      # the automation -- either turns the synthetic input into a controlled
      # agent rather than a one-off script.
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
      - id: micro-behaviors/communications/websocket/client::loopback-websocket-service-url
    needs: 1
    unless:
      - id: well-known/tool/
      - id: well-known/app/security/
      - id: well-known/app/ai/browser-agent/
