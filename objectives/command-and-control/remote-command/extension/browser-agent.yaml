# Browser-extension agents that accept remote HTTP(S) tasking and run
# browser-scoped commands (cookie harvest, tab/history enumeration) inside the
# extension runtime — optionally bridging to a native messaging host for OS
# actions. Covers Mythic-style agents such as Ditto and similar Chromium C2
# extensions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1176,T1219,T1539

traits:
  - id: extension-list-tabs-command
    desc: Extension exposes list_tabs command
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']list[_-]?tabs["'']'

  - id: extension-history-search-command
    desc: Extension exposes history_search command
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']history[_-]?search["'']'

  - id: extension-capture-session-command
    desc: Extension exposes session-capture command
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']capture[_-]?session["'']'
      case_insensitive: true

  - id: extension-coffexec-command
    desc: Extension tasks native host COFF execution
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '["''](coffexec|register_coff)["'']'

  # Operator vocabulary for page-JS injection (`op`/`cmd`/`command` = inject),
  # not bare identifier "inject" which appears in countless UI helpers.
  - id: extension-inject-command
    desc: Extension exposes remote inject command
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(op|cmd|command|kind)\b[\s\S]{0,48}["'']inject["'']'

composite_rules:
  - id: extension-http-tasked-browser-agent
    desc: HTTP-tasked extension agent harvests browser state
    crit: hostile
    conf: 0.97
    attack: T1176,T1219,T1539,T1041
    scope: archive
    for: [crx, zip]
    # Remote check-in plus cookie jar enumeration and at least one more
    # browser-recon command is an extension C2 agent, not a site helper.
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: objectives/credential-access/browser/extension::extension-cookie-harvest-command
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/communications/http/url/domain::js-hardcoded-remote-endpoint
    any:
      - id: extension-list-tabs-command
      - id: extension-history-search-command
      - id: extension-capture-session-command
      - id: micro-behaviors/data/db/access::history-search
    needs: 1

  - id: extension-native-host-os-sidecar
    desc: Extension C2 bridges OS tasking through native messaging
    crit: hostile
    conf: 0.96
    attack: T1176,T1559,T1219
    scope: archive
    for: [crx, zip]
    all:
      - id: metadata/permission/extension-api::permission-native-messaging
      - id: micro-behaviors/communications/ipc/native-host::browser-extension-native-connect
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/communications/http/url/domain::js-hardcoded-remote-endpoint
    any:
      - id: extension-coffexec-command
      - id: objectives/credential-access/browser/extension::extension-get-cookies-command
      - id: extension-list-tabs-command
    needs: 1

  # WebSocket-tasked implant that bridges a native host whose name uses a
  # Microsoft vendor prefix (com.microsoft.*) — the Edge/Chrome NMH hide.
  # Distinct from the HTTP fetch-post Mythic shape above.
  - id: extension-wss-masqueraded-native-bridge
    desc: Extension WebSocket C2 bridges a vendor-masqueraded native host
    crit: hostile
    conf: 0.98
    attack: T1176,T1559,T1219,T1071.001
    scope: archive
    for: [crx, zip]
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/communications/ipc/native-host::browser-extension-native-connect
      - id: metadata/vendor/string::microsoft-reverse-dns-identifier
      - id: objectives/credential-access/browser/extension::extension-get-cookies-command

  # WSS control plane plus scripting.executeScript of a Function constructed
  # from a variable is remote page-code tasking. Distinct from the fetch+MAIN
  # world shape in execution/interpreter/eval/dynamic. Loopback AI/automation
  # bridges that talk to a desktop client stay out via the unless.
  - id: extension-wss-scripting-remote-inject
    desc: WebSocket-tasked extension injects dynamic page JavaScript
    crit: hostile
    conf: 0.97
    attack: T1059.007,T1176,T1105
    scope: archive
    for: [crx, zip]
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/manifest::permission-scripting
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
      - id: extension-inject-command
    unless:
      - id: micro-behaviors/communications/http/websocket::loopback-bridge-driven-extension

  # Socket.IO control plane whose server-selected task verb sends messages
  # through the victim's own logged-in messenger session. The extension holds
  # content-script authority over the messaging site and ships a socket.io
  # client that dispatches remote client-request jobs; one of those jobs is
  # the account's send path. The campaign list, timing and copy then live on
  # the server, not in the reviewed bundle — the operator is remote, so unlike
  # a locally-driven bulk sender this is not the account owner at the
  # keyboard. Distinct from the externally_connectable shape in
  # lateral-movement/social-engineering/spam, which names a vendored
  # automation runtime; this keys on the transport (wss + socket.io task
  # event) and any messaging send capability, so it survives a rebrand of
  # every automation identifier.
  - id: extension-websocket-tasked-messaging-agent
    desc: WebSocket-tasked extension sends messages as the user's messaging account
    crit: hostile
    conf: 0.96
    attack: T1219,T1566
    mbc: B0022
    scope: archive
    for: [crx, zip]
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/communications/websocket/library::socketio-reconnect-attempts
      - id: objectives/command-and-control/remote-command/socketio-control::socketio-client-request-event
    any:
      - id: micro-behaviors/communications/messaging/send
