defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript, crx, zip]
  attack: T1219,T1059.007

# A browser extension that holds a WebSocket to a remote service and turns the
# messages into scripting calls in the user's tabs. Remote-control products
# (remote browser agents, RMM clients) use this shape, and so do attacker
# relays, so the composite stays suspicious. Consent gates and host allowlists
# belong in the product's own review, not in this rule.
# The three legs must share one source file. A package-wide join let a test
# spec's WebSocket client and an unrelated extension's scripting calls match.
composite_rules:
  - id: extension-cloud-socket-scripted-command-relay
    desc: Extension WebSocket relays commands into page scripting
    crit: suspicious
    conf: 0.85
    scope: package
    all:
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/url/scheme::wss-protocol-assignment
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
