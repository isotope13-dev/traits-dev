# Editor extensions that relay prompts from a phone or web dashboard into a
# local coding agent. Resuming an arbitrary session ID with permission checks
# disabled lets whoever controls the relay run tools on the workstation with
# no approval prompt. Products in this category exist (CodeAgent Mobile), so
# this is reviewable remote control, not a malware verdict.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, vsix, package.json]
  attack: T1219,T1059

traits:
  # A variable session ID is required: hard-coded resume examples in docs and
  # tests name a fixed session.
  - id: claude-resume-variable-skip-permissions
    desc: Resumes Claude session skipping permissions
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '--resume \$\{[\w$.?\[\]]{1,60}\} --dangerously-skip-permissions'

composite_rules:
  - id: websocket-relay-resumes-agent-without-permissions
    desc: WebSocket relay resumes agent with permissions skipped
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: claude-resume-variable-skip-permissions
    any:
      - id: metadata/package/dependencies/network::npm-dep-ws
      - id: well-known/lib/web/standards/ws-websocket::permessage-deflate-option
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
