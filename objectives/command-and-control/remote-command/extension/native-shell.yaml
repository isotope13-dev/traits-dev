# Browser-extension remote shell via native messaging: a WSS-tasked extension
# opens a native-messaging host and posts execute actions, or the host itself
# runs operator commands through the Windows command interpreter with a hidden
# window. Both shapes escape the browser sandbox into host command execution.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip, archives]
  attack: T1219,T1059,T1559
  mbc: B0022

traits:
  - id: extension-api-call-task-type
    desc: Extension api_call message type
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']type["'']\s*:\s*["'']api_call["'']|msg\.type\s*===\s*["'']api_call["'']'

composite_rules:
  # All-site extension that both speaks WSS and drives a native-messaging host
  # with execute actions is a browser RAT with host shell escape — not a
  # first-party native helper (those lack remote tasking).
  - id: extension-wss-native-shell-bridge
    desc: Extension bridges WSS tasking to native shell
    crit: hostile
    conf: 0.99
    attack: T1219,T1059,T1559.001
    scope: archive
    for: [crx, zip, archives]
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/communications/ipc/native-host::browser-extension-native-connect
      - id: micro-behaviors/communications/ipc/native-host::native-host-execute-action
    any:
      - id: metadata/permission/extension-api::permission-native-messaging
      - id: objectives/persistence/login/browser-extension::source-extension-native-messaging-permission

  # Remote chrome.* reflection over the same WSS channel lets operators invoke
  # arbitrary extension APIs by name — the browser-side half of XG-Web style
  # control panels.
  - id: extension-wss-reflected-api-bridge
    desc: WSS tasks reflected chrome API calls
    crit: hostile
    conf: 0.98
    attack: T1219,T1059.007,T1185
    scope: archive
    for: [crx, zip, archives]
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: extension-api-call-task-type
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
    any:
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all

  # The native host side: length-prefixed stdio is implied by the messaging
  # role; what makes this hostile is executing operator strings through
  # ComSpec/cmd.exe with a hidden window.
  - id: native-messaging-comspec-command-shell
    desc: Native host runs hidden ComSpec commands
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1559.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/native-host::native-host-execute-action
      - id: micro-behaviors/process/create/shell/path::shell-executable-reference
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    near_bytes: 2048

  # A native-messaging host exists to be driven by the browser over stdio: the
  # browser launches it, frames every request, and is the only thing that talks
  # to it. One that additionally opens its own outbound HTTP channel to an
  # address compiled into it, and shells out, has a second control path the
  # browser never sees -- it keeps tasking the machine after the extension is
  # removed, and it is reachable when the browser is closed. Legitimate hosts
  # (password managers, download helpers, hardware bridges) answer the browser
  # and stop there; their updater traffic belongs to the parent application,
  # not to the stdio bridge.
  - id: native-host-out-of-band-http-c2
    desc: Native host beacons to its own endpoint
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1219,T1559,T1059
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/native-host::native-messaging-stdio-framing
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/url/domain::js-hardcoded-remote-endpoint

  # The operator-facing half of the same host: stdio framing plus a tasking
  # envelope that names command execution, and a filesystem surface that both
  # writes and deletes operator-named paths. Read-only helpers and updaters do
  # not delete; a bridge that executes, writes and removes files on request is
  # a remote administration agent wearing a browser component's clothes.
  - id: native-host-remote-file-control
    desc: Native host exposes remote file control
    crit: hostile
    conf: 0.95
    attack: T1219,T1559,T1105,T1070.004
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/native-host::native-messaging-stdio-framing
      - id: micro-behaviors/communications/ipc/native-host::native-host-execute-action
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/file/read::read-node
      - id: micro-behaviors/fs/file/delete::fs-unlinkSync
