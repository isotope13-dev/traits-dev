# The worker reports each visited URL and, from the reply, fetches a rule
# set and swaps it in for every dynamic declarativeNetRequest rule. The
# remote side can then redirect, block or strip headers on any site,
# a network-policy channel steered by browsing data.
defaults:
  platforms: [unix, windows]
  attack: T1102,T1557

composite_rules:
  - id: browsing-report-reply-replaces-dnr-rules
    desc: Browsing report reply swaps in remote dynamic DNR rules
    crit: hostile
    conf: 0.87
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/tabs::completed-tab-url-with-install-id
      - id: micro-behaviors/communications/http/intercept::dnr-replace-all-dynamic-rules
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
      - id: micro-behaviors/communications/http/request/json::fetch-call-near-json-parse
