# One extension package that both reads the Authorization header of a site's
# requests from the page world and loads decrypted remote code into that same
# page world: the loaded code runs next to the captured session token.
defaults:
  platforms: [windows, unix]
  attack: T1539,T1059.007,T1105
  crit: hostile
  conf: 0.92

composite_rules:
  - id: extension-token-tap-with-remote-payload-loader
    desc: Extension taps page Authorization headers and injects a decrypted remote payload
    scope: archive
    for: [crx, xpi, zip, javascript, typescript]
    all:
      - id: objectives/credential-access/browser/session-hijack::extension-main-world-authorization-tap
      - id: objectives/execution/payload/browser::extension-decrypted-payload-main-world-injector
