# A worker that periodically downloads a hostname -> URL table and, on
# every top-level navigation, redirects the tab when the hostname is in the
# table. The operator can retarget any site at any time without an update.
defaults:
  platforms: [unix, windows]
  attack: T1102,T1185

composite_rules:
  - id: remote-host-map-navigation-redirect
    desc: Periodically fetched host map redirects user navigations
    crit: hostile
    conf: 0.88
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-before-navigate
      - id: micro-behaviors/browser-extension/tabs::hostname-keyed-map-tab-redirect
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: micro-behaviors/communications/http/client/script::fetch-call
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
