# Every page's address goes out through the background worker, and the
# reply decides what opens next: a server-chosen tab or a sized window
# (popunder). The browser becomes a remotely driven ad surface keyed on
# what the user is browsing.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, crx, javascript, typescript, zip]
  attack: T1102,T1185

composite_rules:
  - id: page-url-beacon-reply-opens-tabs
    desc: Page URL beacon reply opens server-chosen tabs or windows
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/dom::content-script-all-sites
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-page-url
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-on-message
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/browser-extension/tabs::tab-or-window-create-from-member
