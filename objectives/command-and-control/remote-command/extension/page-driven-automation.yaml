# RPA-style extensions whose controller is a web page: a content-script
# bridge on the vendor site (or localhost) relays page requests into the
# background, which then runs page-supplied JavaScript in the MAIN world of
# any tab or drives that tab with chrome.debugger input events. Whoever
# controls that page controls the user's browser on every site. Vendor RPA
# tools ship this deliberately, so these stay suspicious.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, javascript, typescript, zip]
  attack: T1176,T1059.007

composite_rules:
  - id: page-bridged-main-world-code-execution
    desc: Page-bridged extension runs supplied code via new Function in MAIN world
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/extension-message::page-message-runtime-round-trip-bridge
      - id: micro-behaviors/process/inject/webextension::extension-message-main-world-compile-cooccurrence

  - id: page-bridged-debugger-input-automation
    desc: Page-bridged extension drives any site with chrome.debugger input
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/extension-message::page-message-runtime-round-trip-bridge
      - id: micro-behaviors/ui/window/automation::debugger-driven-input-automation

  # The same page bridge feeding a background fetch that sends the user's
  # cookies (credentials: include) under all-sites host access: any page
  # the bridge listens on can read cross-origin, logged-in responses from
  # other sites through the extension (a confused-deputy CORS bypass).
  - id: page-bridged-credentialed-cross-origin-fetch
    desc: Page-bridged extension performs credentialed fetches across all sites
    crit: suspicious
    conf: 0.8
    scope: archive
    attack: T1176,T1539
    all:
      - id: micro-behaviors/communications/ipc/extension-message::page-message-runtime-round-trip-bridge
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-near-credentialed-fetch
      - id: metadata/permission/host::broad-host-access
