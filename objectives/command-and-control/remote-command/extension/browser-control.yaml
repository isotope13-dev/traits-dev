# Browser-extension remote-command channel: a persistent WebSocket that drives
# chrome.debugger / CDP against arbitrary tabs. Full remote browser control —
# the extension-RAT pattern.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, archives]
  attack: T1219,T1059.007,T1185

traits:
  - id: extension-cdp-execute-command
    desc: Extension exposes CDP execute command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bcdp[_-]?execute\b|["'']cdp_execute["'']'

  - id: extension-account-mutation-message
    desc: Remote message selects account mutation action
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '["''](book|transfer|redistribute|purchase)["'']\s*===\s*\w+\.type'

composite_rules:
  # Distinct from a browser automation client: this requires the extension to
  # have already exported its reusable session, then accept mutation jobs and
  # rewrite authenticated request headers for the resulting API calls.
  - id: extension-websocket-authenticated-account-control
    desc: WebSocket backend controls authenticated account actions
    crit: hostile
    conf: 0.99
    attack: T1219,T1539,T1059.007
    scope: archive
    for: [crx, zip, archives]
    all:
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/data/db/web-storage::browser-storage-token-key-local
      - id: micro-behaviors/communications/http/cookies::cookie-json-send-call
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: extension-account-mutation-message
      - id: micro-behaviors/process/hook/webextension::chrome-dnr-update-dynamic-rules
      - id: micro-behaviors/communications/http/request/client::http-post-json

  - id: extension-websocket-page-code-control
    desc: WebSocket controls all-site page code
    crit: hostile
    conf: 0.99
    mbc: B0022
    attack: T1059.007,T1219,T1185
    scope: archive
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: objectives/execution/interpreter/eval/dynamic::js-embedded-interpreter-evaluate
      - id: micro-behaviors/communications/ipc/message::webextension-page-event-command-bridge
      - id: metadata/permission/manifest::host-permission-all-urls

  # Require an explicit CDP execute command channel. Declaring the debugger
  # permission, or a generic "dispatch" message kind, is ordinary for AI
  # browser agents and seller automation — those alone must not convict.
  - id: extension-websocket-cdp-backdoor
    desc: Extension WebSocket remotely drives CDP debugger
    crit: hostile
    conf: 0.97
    mbc: B0022
    scope: archive
    all:
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/process/attach/webextension::chrome-debugger-attach
      - id: micro-behaviors/process/attach/webextension::chrome-debugger-send-command
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: extension-cdp-execute-command
    unless:
      - id: well-known/app/ai/browser-agent/quantomate::quantomate-browser-extension-context
      - id: well-known/app/ai/browser-agent/quantomate::quantomate-cdp-runtime-context
      - id: well-known/app/ai/browser-agent/linghou::linghou-browser-extension-context
