# A Windows program that launches processes and reports `task_id` /
# `task_result` pairs to a raw-IP endpoint or a register/report/task route set
# is taking work from an operator and returning the output: a backdoor's
# tasking loop. The JAVS Viewer 8.3.7 `fffmpeg.exe` implant (2024, Rust)
# registered with https://45.120.177.178/gateway/register, polled
# gateway/report and returned cmd/PowerShell output to gateway/task.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1059

composite_rules:
  - id: task-result-reporting-process-agent
    desc: Agent reports task_id/task_result after launching processes
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/parse/vocabulary::task-id-field
      - id: micro-behaviors/data/parse/vocabulary::task-result-json-key
      - id: metadata/binary/symbols/name/process::create-process-w
    any:
      - id: micro-behaviors/communications/url/resource-path/collection::gateway-register-report-task-routes
      - id: micro-behaviors/communications/ip/literal::http-ip-url-text
