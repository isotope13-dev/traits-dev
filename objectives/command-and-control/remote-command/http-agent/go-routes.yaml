defaults:
  platforms: [macos]
  for: [macho]
  crit: component
  conf: 0.98

traits:
  - id: agent-kill-self-route
    desc: Agent self-removal task route
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 6B 69 6C 6C 2D 73 65 6C 66
      section: rodata

  - id: agent-screenshot-route
    desc: Agent screenshot task route
    crit: notable
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 73 63 72 65 65 6E 73 68 6F 74
      section: rodata

  - id: agent-portscan-route
    desc: Agent port-scan task route
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 70 6F 72 74 73 63 61 6E
      section: rodata

  - id: agent-proxy-route
    desc: Agent proxy task route
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 70 72 6F 78 79
      section: rodata

  - id: agent-ssh-route
    desc: Agent SSH task route
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 73 73 68
      section: rodata

  - id: agent-net-route
    desc: Agent network-connection task route
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 6E 65 74
      section: rodata

  - id: agent-upload-route
    desc: Agent upload task route
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 75 70 6C 6F 61 64
      section: rodata

  - id: agent-download-route
    desc: Agent download task route
    if:
      type: hex
      pattern: 2F 61 67 65 6E 74 2F 64 6F 77 6E 6C 6F 61 64
      section: rodata

composite_rules:
  - id: go-surveillance-agent-tasking
    desc: Go agent exposes remote surveillance and administration tasks
    crit: hostile
    conf: 0.99
    attack: T1059,T1046,T1113,T1219
    all:
      - id: agent-kill-self-route
      - id: agent-screenshot-route
    any:
      - id: agent-portscan-route
      - id: agent-proxy-route
      - id: agent-ssh-route
      - id: agent-net-route
      - id: agent-upload-route
      - id: agent-download-route
    needs: 1
