# Rust Windows implant command handling: encoded C2 result reports combined
# with child-process creation distinguish task execution from ordinary
# application process use.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]

composite_rules:
  - id: encoded-c2-command-execution-reporting
    desc: Encoded C2 task reports with Windows process execution
    crit: hostile
    conf: 0.94
    attack: T1106,T1071.001,T1027
    all:
      - id: objectives/command-and-control/channel/http/transport::concealed-endpoint-encoded-command-reports
      - id: micro-behaviors/process/create/spawn::create-process-w
