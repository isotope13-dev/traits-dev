defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: browser-password-agent-download-execute-tasks
    desc: Password-stealing agent downloads and executes server tasks
    crit: hostile
    conf: 0.97
    attack: T1105,T1106
    all:
      - id: objectives/exfiltration/stealer/credential/value/password::native-browser-password-upload-agent
      - id: micro-behaviors/communications/http/url/api-path::http-tasks-path
      - id: micro-behaviors/communications/transfer::agent-download-task-diagnostic
      - id: micro-behaviors/os/telemetry/logging/event::agent-executed-task-diagnostic
      - id: micro-behaviors/process/create/spawn::create-process-w
