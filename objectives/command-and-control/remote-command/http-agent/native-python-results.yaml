defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: native-python-task-output-agent
    desc: Python task-output agent has process-monitor watchlist
    crit: hostile
    conf: 0.97
    attack: T1059.006,T1071.001
    all:
      - id: micro-behaviors/process/interpreter/python::embedded-python-exec-compile
      - id: micro-behaviors/data/parse/vocabulary::task-id-field
      - id: micro-behaviors/data/format/json::base64-stdout-result-field
      - id: micro-behaviors/process/create/native-symbol::create-process-w
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-connect
      - id: objectives/anti-analysis/tool-detect/process::native-process-monitor-watchlist
