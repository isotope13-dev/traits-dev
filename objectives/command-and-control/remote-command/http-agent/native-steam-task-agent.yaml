defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # RE: received TasksResp records drive this command dispatcher. exec passes
  # the record's cmd value to cmd /C; deploy_steam stops Steam, backs up its
  # image and copies the operator-staged file over steam.exe. The command set,
  # concealed configuration and replacement capability admit the attack claim.
  # No campaign endpoint, collector basename or exact build size is required.
  - id: concealed-steam-takeover-agent
    desc: Concealed Steam-takeover tasking with shell execution
    crit: hostile
    conf: 0.98
    attack: T1059.003
    all:
      - id: objectives/command-and-control/backdoor/control/command-vocab::screen-shell-process-task-verbs
      - id: objectives/command-and-control/backdoor/control/command-vocab::steam-deploy-collect-task-verbs
      - id: objectives/anti-static/obfuscation/string/reconstruct::flattened-string-offset-helpers-x64
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/fs/file/copy::copyfile-ex-w
      - id: micro-behaviors/communications/http/lib/crate::reqwest-crate
