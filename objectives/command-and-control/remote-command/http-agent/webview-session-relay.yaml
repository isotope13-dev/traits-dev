# Session-multiplexed IPC command streaming relayed over Bearer-authenticated HTTP POSTs.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001,T1041

traits:
  - id: ipc-open-cmd-message
    desc: Builds IPC open message with cmd field
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'op\s*:\s*["'']open["'']\s*,\s*cmd\s*:'

  - id: ipc-read-session-message
    desc: Builds IPC read message with session field
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'op\s*:\s*["'']read["'']\s*,\s*session\s*:'

  - id: ipc-close-session-message
    desc: Builds IPC close message with session field
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'op\s*:\s*["'']close["'']\s*,\s*session\s*:'

composite_rules:
  - id: session-streamed-ipc-http-command-relay
    desc: Streams IPC command sessions to Bearer POST
    crit: hostile
    conf: 0.97
    near_bytes: 1600
    all:
      - id: ipc-open-cmd-message
      - id: ipc-read-session-message
      - id: ipc-close-session-message
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-variable
      - id: micro-behaviors/communications/http/request/json::json-body-post
