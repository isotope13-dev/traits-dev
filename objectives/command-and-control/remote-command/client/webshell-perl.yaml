defaults:
  crit: notable
  attack: T1059
  for:
    - perl
  platforms:
    - unix
    - windows
traits:
  - id: perl-subst-command-var
    desc: Substitutes a command into a marker
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 's/[A-Za-z]{2,8}/\$cmd/'
  - id: perl-post-request-var
    desc: Posts a request variable over HTTP
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'POST \$[A-Za-z_]\w*[^''\n]{0,40}HTTP/1\.[01]'
composite_rules:
  - id: perl-http-command-client
    desc: Posts a substituted shell command
    crit: hostile
    conf: 0.96
    near_lines: 15
    all:
      - id: perl-subst-command-var
      - id: perl-post-request-var
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
