defaults:
  crit: suspicious
  attack: T1059
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  - id: ruby-shell-exec-query
    desc: Requests a shell_exec command parameter
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: function=shell_exec&cmd=
  - id: ruby-stdin-gets
    desc: Reads a command from STDIN
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bSTDIN\.gets\b'
composite_rules:
  # near_lines on both composites: every leg below is an ordinary Ruby idiom
  # (`exit`, `while true`, `system(...)`, a `require 'open-uri'`), so without a
  # proximity bound any large CLI satisfies the count by accident from lines
  # thousands apart. A client that drives a remote shell is a compact
  # read-send-print loop, so requiring the legs to share one window is what the
  # composite name already claims.
  - id: web-shell-client
    desc: Web shell client for remote command execution
    conf: 0.92
    needs: 3
    near_lines: 60
    any:
      - id: micro-behaviors/data/runtime/keywords::web-shell-cmd-param
      - id: micro-behaviors/data/runtime/keywords::php-shell-function
      - id: micro-behaviors/data/control-flow/analysis::ruby-while-true
      - id: micro-behaviors/process/create/system::system-process-call
  - id: interactive-shell-client
    desc: Interactive shell with user input
    conf: 0.88
    needs: 4
    near_lines: 60
    any:
      - id: micro-behaviors/os/console/io::stdin-gets
      - id: micro-behaviors/data/runtime/keywords::shell-prompt-string
      - id: micro-behaviors/process/exit/terminate::ruby-exit-call
      - id: micro-behaviors/data/control-flow/analysis::ruby-while-true
      - id: micro-behaviors/communications/http/lib/netlib::open-uri
      - id: micro-behaviors/process/create/system::system-process-call
  - id: ruby-shell-exec-command-client
    desc: Ruby client runs remote shell commands
    crit: hostile
    conf: 0.97
    near_lines: 25
    all:
      - id: ruby-shell-exec-query
      - id: ruby-stdin-gets
