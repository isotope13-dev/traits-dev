# Legitimate panel automation alone lacks the browser-session recovery leg.
# https://blackpointcyber.com/blog/screenconnect-attack-sckit/
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1550.004,T1219
composite_rules:
  - id: harvested-session-command-distribution
    desc: Browser session recovery paired with queued endpoint commands
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/credential-access/browser/session-hijack::aspnet-browser-cookie-panel-replay
      - id: micro-behaviors/communications/http/services/screenconnect::panel-session-events-uri
      - id: micro-behaviors/communications/http/services/screenconnect::queued-command-event
