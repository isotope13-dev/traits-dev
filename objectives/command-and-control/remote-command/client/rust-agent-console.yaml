defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1059

traits:
  - id: rust-agent-execute-task
    desc: Rust client builds a remote Execute task
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: model::Task::Execute
  - id: rust-agent-mission-dispatch
    desc: Rust client issues an agent mission
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: client::missions::issue
  - id: rust-agent-result-poll
    desc: Rust client polls an agent mission result
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: utils::poll_mission_result

composite_rules:
  - id: rust-agent-command-dispatch
    desc: Rust operator dispatches commands to remote agents
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: rust-agent-execute-task
      - id: rust-agent-mission-dispatch
      - id: rust-agent-result-poll
