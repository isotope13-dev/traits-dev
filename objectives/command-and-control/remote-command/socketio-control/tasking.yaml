# Socket.IO client tasking
#
# Socket.IO is widely used for ordinary realtime application features.  This
# rule focuses on the remote-agent shape described by the Joyfill compromise:
# a client receives task messages, exposes several operator verbs, and hands a
# task to a local process API.  It intentionally does not depend on event names
# or C2 addresses from one campaign.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001
  mbc: B0022

traits:
  - id: socketio-task-event-handler
    desc: Socket.IO task message handler
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\.(on|once)\(\s*["''](task|job|work-item)["'']'

  - id: socketio-task-dispatch-switch
    # A command/action/task switch is also normal application control flow
    # (for example, a UI parser).  The Socket.IO and local-process context is
    # supplied by node-socketio-tasking-agent below.
    desc: JavaScript command/action/task dispatch switch
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '\bswitch\s*\(\s*[A-Za-z_$][\w$]*\s*\.\s*(command|action|task)\s*\)'

  - id: socketio-identify-event
    desc: Socket.IO client identity event
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.emit\(\s*["'']identify["'']'

  - id: socketio-host-identity-fields
    desc: Socket.IO host identity fields
    crit: notable
    conf: 0.88
    count_min: 2
    if:
      type: text
      regex: '\b(hostname|username)\s*:'

composite_rules:
  - id: socketio-host-identity-beacon
    desc: Socket.IO host identity beacon
    crit: suspicious
    conf: 0.92
    all:
      - id: socketio-identify-event
      - id: socketio-host-identity-fields
    near_bytes: 1200

  - id: node-socketio-tasking-agent
    desc: Socket.IO client dispatches local operator tasks
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1071.001,T1219
    mbc: B0022,B0030
    all:
      - id: objectives/command-and-control/channel/websocket::socketio-client-require
      - id: socketio-task-event-handler
      - id: socketio-task-dispatch-switch
    any:
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      - id: micro-behaviors/process/create/spawn/
    unless:
      - id: metadata/library/socketio/
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-large-minified-bundle
