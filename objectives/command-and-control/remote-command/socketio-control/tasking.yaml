defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1059.007,T1071.001
  mbc: B0022
composite_rules:
- id: socketio-host-identity-beacon
  desc: Socket.IO host identity beacon
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/communications/ipc/message::js-identify-event-emission
  - id: metadata/lang/source/syntax/object::host-identity-field-pair
  near_bytes: 1200
- id: node-socketio-tasking-agent
  desc: Socket.IO task dispatch with process APIs
  crit: suspicious
  conf: 0.99
  attack: T1059.007,T1071.001,T1219
  mbc: B0022,B0030
  all:
  - id: micro-behaviors/os/module/require::socketio-client-require
  - id: micro-behaviors/communications/ipc/message::js-task-event-handler
  - id: micro-behaviors/data/control-flow/dispatch/named::object-field-dispatch-switch
  any:
  - id: micro-behaviors/process/create/exec::js-child-process
  - id: micro-behaviors/os/module/require::child-process-require
  - id: micro-behaviors/process/create/exec::child-process-alias-spawn
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
  - id: micro-behaviors/process/create/exec::child-process-destructured-spawn-call
  - id: micro-behaviors/process/create/exec::child-process-member-spawn
  - id: micro-behaviors/process/create/subprocess/launch::node-child-process-fork-call
  - id: micro-behaviors/process/create/exec::powershell-assigned-token-process-call
  - id: micro-behaviors/os/api-resolution/digest-export/encoded::x86-winexec-hash-exe-name-clues
  - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
  - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-child-process-js
  - id: micro-behaviors/process/create/subprocess/launch::runtime-exec
  - id: micro-behaviors/process/create/subprocess/launch::runtime-getruntime-exec
