defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007
  mbc: B0022

traits:
- id: socketio-command-event
  desc: Socket.io command event handler
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(io|socket)\.on\(\s*[''"]command[''"]'

- id: socketio-tool-request-event
  desc: Socket.IO remote tool-request event
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '\.on\(\s*[''\"](selfhosted_)?tool_request[''\"]'

- id: socketio-terminal-events
  desc: Socket.io terminal control events
  crit: component
  conf: 0.9
  if:
    type: string_literal
    regex: '^(start-terminal|terminal-input|terminal-output|terminal-resize)$'

- id: socketio-event-mouse-move
  desc: Socket.io mouseMove event
  crit: component
  if:
    type: string_literal
    exact: mouseMove
- id: socketio-event-mouse-click
  desc: Socket.io mouseClick event
  crit: component
  if:
    type: string_literal
    exact: mouseClick
- id: socketio-event-mouse-scroll
  desc: Socket.io mouseScroll event
  crit: component
  if:
    type: string_literal
    exact: mouseScroll
- id: socketio-event-key-tap
  desc: Socket.io keyTap event
  crit: component
  if:
    type: string_literal
    exact: keyTap
- id: socketio-event-key-combo
  desc: Socket.io keyCombo event
  crit: component
  if:
    type: string_literal
    exact: keyCombo
- id: socketio-event-press-key
  desc: Socket.io pressKey event
  crit: component
  if:
    type: string_literal
    exact: pressKey
- id: socketio-event-release-key
  desc: Socket.io releaseKey event
  crit: component
  if:
    type: string_literal
    exact: releaseKey
- id: socketio-event-copy-clipboard
  desc: Socket.io copyClipboard event
  crit: component
  if:
    type: string_literal
    exact: copyClipboard
- id: socketio-event-paste-text
  desc: Socket.io pasteText event
  crit: component
  if:
    type: string_literal
    exact: pasteText

- id: socketio-capture-event
  desc: Socket event named capture
  crit: component
  conf: 0.86
  if:
    type: symbol
    kind: call
    regex: '(^|\\.)(on|emit)$'
    arg:
      kind: string
      exact: capture

- id: socketio-event-start-ssh
  desc: Socket.io start_ssh event
  crit: component
  if:
    type: string_literal
    exact: start_ssh
- id: socketio-event-ssh-input
  desc: Socket.io ssh_input event
  crit: component
  if:
    type: string_literal
    exact: ssh_input
- id: socketio-event-ssh-output
  desc: Socket.io ssh_output event
  crit: component
  if:
    type: string_literal
    exact: ssh_output

- id: socketio-ssh-status-events--ssh-connected
  desc: Socket.io SSH status events (ssh_connected)
  crit: component
  conf: 0.86
  if:
    type: string_literal
    exact: ssh_connected
- id: socketio-ssh-status-events--ssh-disconnected
  desc: Socket.io SSH status events (ssh_disconnected)
  crit: component
  conf: 0.86
  if:
    type: string_literal
    exact: ssh_disconnected
composite_rules:
- id: socketio-mouse-events
  desc: Socket.io mouse control events
  crit: component
  conf: 0.92
  any:
  - id: socketio-event-mouse-move
  - id: socketio-event-mouse-click
  - id: socketio-event-mouse-scroll
- id: socketio-keyboard-events
  desc: Socket.io keyboard control events
  crit: component
  conf: 0.92
  any:
  - id: socketio-event-key-tap
  - id: socketio-event-key-combo
  - id: socketio-event-press-key
  - id: socketio-event-release-key
- id: socketio-clipboard-events
  desc: Socket.io clipboard control events
  crit: component
  conf: 0.9
  any:
  - id: socketio-event-copy-clipboard
  - id: socketio-event-paste-text
- id: socketio-ssh-io-events
  desc: Socket.io SSH IO events
  crit: component
  conf: 0.9
  any:
  - id: socketio-event-start-ssh
  - id: socketio-event-ssh-input
  - id: socketio-event-ssh-output
- id: socketio-ssh-status-events
  desc: Socket.io SSH status events
  crit: component
  conf: 0.86
  any:
  - id: socketio-ssh-status-events--ssh-connected
  - id: socketio-ssh-status-events--ssh-disconnected
- id: node-socketio-remote-command-execution
  desc: Node socket.io remote command execution
  crit: hostile
  conf: 0.97
  all:
  - id: socketio-remote-channel-marker
  - id: socketio-command-channel
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
  - id: micro-behaviors/process/create/spawn/
  unless:
  - id: metadata/library/socketio/
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/library/structure::js-large-minified-bundle
  - id: metadata/package/files/dependency::node-modules-path

- id: node-socketio-remote-control-rat
  desc: Node socket.io remote control RAT
  crit: hostile
  conf: 0.98
  all:
  - id: socketio-remote-channel-marker
  - id: socketio-terminal-events
  needs: 2
  any:
  - id: node-socketio-remote-command-execution
  - id: socketio-remote-input-events
  - id: socketio-ssh-terminal-events
  - id: micro-behaviors/process/tty/pty::node-pty-module-ref
  unless:
  - id: metadata/library/socketio/
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/library/structure::js-large-minified-bundle
  - id: metadata/package/files/dependency::node-modules-path

- id: socketio-command-channel
  desc: Socket.io command channel
  crit: component
  conf: 0.88
  any:
  - id: socketio-command-event
  - id: socketio-tool-request-event
  - id: objectives/command-and-control/channel/websocket::socketio-exec-event

- id: socketio-remote-channel-marker
  desc: Socket.io remote channel marker
  crit: component
  conf: 0.9
  any:
  - id: objectives/command-and-control/channel/websocket::socketio-remote-client-marker
  - id: socketio-terminal-events

- id: socketio-remote-input-events
  desc: Socket.io remote input controls
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: socketio-mouse-events
  - id: socketio-keyboard-events
  - id: socketio-clipboard-events
  - id: socketio-capture-event

- id: socketio-ssh-terminal-events
  desc: Socket.io SSH terminal controls
  crit: component
  conf: 0.9
  any:
  - id: socketio-ssh-io-events
  - id: socketio-ssh-status-events

- id: node-socketio-tool-shell-agent
  desc: Socket.IO tool-request channel with local shell execution
  crit: hostile
  conf: 0.99
  attack: T1059.007,T1059.004,T1071.001
  mbc: B0022,B0030
  scope: archive
  all:
  - id: objectives/command-and-control/channel/websocket::socketio-client-require
  - id: socketio-tool-request-event
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-execsync
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
  - id: micro-behaviors/process/create/spawn/

- id: node-socketio-github-pat-repository-agent
  desc: Socket.IO agent uses a GitHub PAT for repository mutation
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1105,T1071.001
  mbc: B0022,B0030
  scope: archive
  all:
  - id: objectives/command-and-control/channel/websocket::socketio-client-require
  - id: socketio-tool-request-event
  - id: objectives/credential-access/env/secrets/source-control::env-github-pat
  - id: micro-behaviors/process/create/shell/git::git-push-origin
