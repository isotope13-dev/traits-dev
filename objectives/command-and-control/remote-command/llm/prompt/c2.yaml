defaults:
  platforms: [linux, macos, windows]
  for: [python, pyc]
traits:
  - id: llm-react-action
    desc: "Contains 'Action: <tool_name>' string literal"
    crit: notable
    if:
      type: string_literal
      substr: "Action: <tool_name>"
composite_rules:
  - id: llm-react-hacking-prompt
    desc: Contains a ReAct prompt with instructions for using hacking tools
    crit: suspicious
    conf: 0.9
    all:
      - id: llm-react-action
      - id: micro-behaviors/data/llm/wire-marker::react-action-input-marker
      - id: micro-behaviors/data/llm/agent::penetration-testing-prompt-text
  - id: python-llm-c2-backdoor
    desc: Python script uses an LLM as a C2 channel for remote command execution
    crit: hostile
    conf: 0.99
    attack: T1102.003
    mbc: C0032
    for: [python]
    all:
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
      - id: metadata/lang/source/naming/action/function-name::python-run-command-function
      - id: llm-react-hacking-prompt

  - id: skill-structured-security-example
    desc: Skill frontmatter marks a structured security example
    crit: exception
    for: [markdown, text]
    all:
      - id: metadata/package/documentation/agent-safety::security-example-documentation
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields

  - id: skill-reference-known-benign-context
    desc: Skill contains documented security or payload examples
    crit: exception
    for: [markdown, text]
    any:
      - id: metadata/package/documentation/agent-safety::reference-payload-catalog
      - id: skill-structured-security-example
