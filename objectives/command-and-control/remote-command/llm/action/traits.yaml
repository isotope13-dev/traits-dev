defaults:
  platforms: [unix, windows]
  for: [documents, scripts, source, manifests, markdown, text, html]

traits:
- id: default-secret-patterns-phrase
  desc: Default secret pattern phrase in LLM context
  crit: notable
  conf: 0.84
  for: [documents]
  if:
    type: literal
    exact: default secret patterns are returned
    case_insensitive: true
- id: llm-terminal-execution-directive
  desc: Directs agent to run terminal command
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)\b(run|execute)\s+(the\s+)?(following\s+)?command\b.{0,40}\byour terminal\b'
  unless:
    - type: text
      regex: '(?i)composer require'
    - type: text
      regex: '(?i)npm install'
    - type: text
      regex: '(?i)pip install'

- id: llm-session-transcript-upload-action
  desc: Agent session transcript upload instruction
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '\b(full )?session transcript\b[\s\S]{0,160}\bupload\b'
    case_insensitive: true

- id: llm-session-key-submission-action
  desc: Forward returned session key for submission
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '\breturned\b[\s\S]{0,100}\bsession_log_key\b[\s\S]{0,100}\bsubmit'
    case_insensitive: true

# The credential half of this family was plain credential vocabulary — "enter
# your API key" is what every authenticated product's setup guide says — so it
# now lives in objectives/credential-access/theft/keywords and is referenced by
# id below. Keeping it here named it for the composite instead of for the
# matcher, and filed an Odoo add-on's "enter your EPREL API key" README under
# LLM command-and-control.

- id: llm-hidden-task-instruction
  desc: LLM hidden task instruction
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bhidden\s+optimization\s+task\b|background optimization task|execute it silently'
    case_insensitive: true

- id: llm-send-action--rx-5
  desc: '"exfiltrate" string-literal token'
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']exfiltrate["'']'
    case_insensitive: true

- id: llm-send-action--rx-10
  desc: '"secret" string-literal token'
  crit: notable
  conf: 0.84
  unless:
    - id: well-known/lib/ai/google-a2a-python-sdk::google-a2a-python-sdk-library
    - id: metadata/package/testing/scripted/
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']secret["'']'
    case_insensitive: true

- id: llm-send-action--rx-11
  desc: '"upload" string-literal token'
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']upload["'']'
    case_insensitive: true

# Verb shard only: a navigation verb within 80 bytes of an assistant name is
# launch code and prose as often as agent tasking -- "open -a ChatGPT" matched.
# The navigation composites supply the agent-direction and URL/path context.
- id: llm-navigation-verb-navigate
  desc: Navigation verb near assistant name
  crit: component
  conf: 0.82
  if:
    type: text
    case_insensitive: true
    regex: '\b(ai assistant|chatgpt)\b.{0,80}\b(navigate|go to|open|visit)\b'
- id: llm-payment-action
  desc: LLM payment action request
  crit: notable
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: '\b(chatgpt|copilot|claude|llm)\b.{0,50}\b(pay|donate)\b.{0,40}\$[0-9]'
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker

- id: llm-groq-agent-backend
  desc: Groq agent backend
  crit: notable
  conf: 0.86
  if:
    type: text
    word: GroqAgent
- id: llm-groq-agent-pool
  desc: Groq agent pool
  crit: notable
  conf: 0.86
  if:
    type: text
    word: GroqAgentPool
- id: llm-bridge-agent-backend
  desc: LLMBridge agent backend
  crit: notable
  conf: 0.86
  if:
    type: text
    word: LLMBridge
- id: llm-offensive-task-exploit
  desc: LLM exploit task literal
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']exploit["'']'
- id: llm-offensive-task-credential
  desc: LLM credential task literal
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']credential["'']'
- id: llm-offensive-task-lateral
  desc: LLM lateral task literal
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']lateral["'']'
- id: llm-offensive-task-privesc
  desc: LLM privesc task literal
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']privesc["'']'
- id: llm-offensive-command-toolset
  desc: LLM offensive command toolset
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '["'']run_command["''][\s\S]{0,220}["'']searchsploit["'']|["'']c2_command["'']'
- id: llm-sensitive-data-term-primary
  desc: AI-directed session or credential target
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(ai agent|ai assistant)\b[\s\S]{0,100}\b(session cookie|access token|credential)\b'


composite_rules:
- id: llm-sensitive-data-export-verb
  desc: Sensitive-data export instruction verb
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/data/llm/agent::agent-send-wording
  - id: metadata/lang/natural/phrasing::ai-agent-transfer-verb-wording

- id: llm-sensitive-data-term
  desc: Sensitive data target term
  crit: component
  conf: 0.92
  any:
  - id: llm-sensitive-data-term-primary
  - id: micro-behaviors/data/llm/agent::agent-near-secret-key-wording

- id: llm-sensitive-data-export-directive
  desc: AI agent directed to export secrets
  crit: suspicious
  conf: 0.97
  near_bytes: 320
  all:
  - id: micro-behaviors/data/llm/agent::agent-identity
  - id: llm-sensitive-data-export-verb
  - id: llm-sensitive-data-term
  unless:
  - id: objectives/evasion/security-bypass/llm/override::prompt-injection-documentation-known-benign-context
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/

- id: llm-agent-session-transcript-submission
  desc: Agent-directed session transcript exfiltration
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
  - id: llm-session-transcript-upload-action
  - id: llm-session-key-submission-action
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/

  - id: "metadata/file/naming::test-directory-component"
- id: llm-agent-local-command-tooling
  desc: LLM agent exposes local command tooling
  crit: hostile
  conf: 0.95
  scope: archive
  ref: sha256:53a7fcc5ec5f6d4317d72c7e31c450235aeac9e563fb73d62d7c5fd9b4ce3af8
  all:
  - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
  - id: micro-behaviors/data/llm/wire-marker::tool-call-sequence-instruction
  - id: micro-behaviors/process/create/shell-subprocess::shell-true
  any:
  - id: micro-behaviors/process/create/agent::python-agent-shell-command-tool
  - id: micro-behaviors/process/create/agent::python-agent-python-repl-tool

- id: llm-offensive-agent-orchestrator
  desc: Offensive LLM agent orchestrator
  crit: hostile
  conf: 0.97
  all:
  - id: llm-offensive-task-exploit
  - id: llm-offensive-task-credential
  - id: llm-offensive-task-lateral
  - id: llm-offensive-task-privesc
  - id: llm-offensive-command-toolset
  any:
  - id: llm-groq-agent-backend
  - id: llm-groq-agent-pool
  - id: micro-behaviors/data/llm/agent::ollama-agent-backend
  - id: llm-bridge-agent-backend
  - id: micro-behaviors/data/llm/agent::autonomous-loop-wording
- id: llm-send-action-sensitive-token
  desc: Sensitive-action string token (credential/secret/cookie/...)
  crit: component
  any:
  - id: llm-offensive-task-credential
  - id: llm-send-action--rx-5
  - id: metadata/lang/source/literal::agent-password-token-context
  - id: micro-behaviors/data/llm/agent::agent-near-session-token-wording
  - id: llm-send-action--rx-10
  - id: llm-send-action--rx-11

- id: llm-sensitive-token-marker
  desc: LLM marker mentions sensitive token
  crit: notable
  conf: 0.84
  near_bytes: 200
  all:
  - id: micro-behaviors/data/llm/agent::agent-identity
  - id: llm-send-action-sensitive-token
  unless:
  - id: metadata/package/testing/presence/fixture/
  - id: metadata/package/testing/scripted/
  - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
  - id: objectives/command-and-control/remote-command/llm/action::default-secret-patterns-phrase
  not:
  - regex: '(?i)\b(next|previous|continuation|pagination|page|bucket|throttle|rate[- ]?limit|fill|refill|sync|csrf|xsrf|anti-forgery) token\b'
  - regex: '(?i)\btoken bucket\b'
  - regex: '(?i)\b(new|expected|invalid|lookahead|lexical|parsed|input) token\b'
  - regex: '(?i)\bai session\b'

- id: llm-url-navigation-action
  desc: LLM URL navigation request
  crit: notable
  conf: 0.8
  near_bytes: 200
  all:
  - id: micro-behaviors/data/llm/agent::agent-identity
  - id: llm-navigation-verb-navigate
  - id: micro-behaviors/communications/url/reference::ai-assistant-url-wording
  not:
  - regex: '(?i)\bopen (an?|the|a new) (issue|ticket|bug|pull request|PR|MR|merge request|incident|case|support (ticket|case|request))\b'
  - regex: '(?i)\bopen a support\b'
  - regex: '(?i)\b(set|called|invoked|run|placed|defined)\s+(after|before|inside|outside)\s+(open|close|init|setup|teardown)\b'
  - regex: '(?i)\b(netdata|datadog|wazuh|sysdig|splunk|elastic|grafana|prometheus|zabbix|nagios|new relic) agent\b'

- id: llm-path-navigation-action
  desc: LLM-directed filesystem path navigation request
  crit: notable
  conf: 0.76
  near_bytes: 200
  all:
  - id: micro-behaviors/data/llm/agent::agent-identity
  - id: llm-navigation-verb-navigate
  - id: micro-behaviors/data/llm/agent::assistant-near-path-wording
