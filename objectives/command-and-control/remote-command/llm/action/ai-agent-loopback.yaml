# A local AI coding bridge can be a useful integration point, but a bridge
# that accepts cross-origin caller data and writes it into the user's agent
# state deserves a distinct triage signal.  The individual server, CORS,
# filesystem, and prompt capabilities remain neutral observations elsewhere.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001

traits:
  - id: raw-knowledge-directory
    desc: References raw knowledge directory
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 00_Raw

  - id: parsed-markdown-file-write
    desc: Writes parsed markdown to a file
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'writeFileSync\s*\([^)]{0,120}parsed\.markdown'

composite_rules:
  - id: request-markdown-home-write
    desc: Request markdown reaches home-state write
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/parse/json::json-parse-call
      - id: micro-behaviors/process/identity/query::os-homedir-call
      - id: raw-knowledge-directory
      - id: parsed-markdown-file-write

  - id: cross-origin-loopback-agent-bridge
    desc: Cross-origin loopback bridge writes caller data into AI state
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/server/middleware::wildcard-cors-response
      - id: micro-behaviors/communications/socket/bind/address::bind-loopback-address
      - id: micro-behaviors/communications/socket/listen::node-server-listen-generic
      - id: request-markdown-home-write
      - id: micro-behaviors/process/create/shell/bridge::ai-agent-shell-instruction-tag

  # An OpenAI-compatible local bridge can also delegate caller-controlled
  # prompts directly to an installed agent CLI. Wildcard CORS makes that
  # privileged local endpoint reachable from arbitrary browser origins.
  - id: cors-loopback-agent-cli-bridge
    desc: Cross-origin loopback API forwards prompts to an AI CLI
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/http/server/middleware::wildcard-cors-set-header
      - id: micro-behaviors/communications/ip/literal::javascript-loopback-call-argument
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
      - id: micro-behaviors/communications/http/request/verb::http-post-method-condition
      - id: micro-behaviors/process/create/spawn::bare-spawn-call
