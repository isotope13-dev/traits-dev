# This requires the command-expanding prompt sink, raw object-field rendering,
# JSON channel, recurring prompt hook, and concealed process configuration.
# No path, package identity, callback IP, or chosen identifier supplies a leg.
# Archive scope reflects the distributed producer/renderer/shell setup; it does
# not prove that arbitrary unrelated network and shell operations share data.
defaults:
  platforms: [unix]
  for: [npm, tar, javascript, typescript]
composite_rules:
  - id: reflective-json-zsh-prompt-channel
    desc: JSON channel with raw command-expanding zsh prompt setup
    crit: hostile
    conf: 0.95
    attack: T1059.004
    scope: archive
    all:
      - id: micro-behaviors/os/application/config::zsh-prompt-substitution-option
      - id: micro-behaviors/os/application/config::zsh-precmd-hook-command
      - id: micro-behaviors/ui/terminal::raw-object-text-zsh-color-segment
      - id: micro-behaviors/os/env/runtime::zsh-startup-directory-option
      - id: objectives/anti-static/obfuscation/string/name-split::split-name-reflective-internal-spawn
      - id: micro-behaviors/communications/http/client/response-body::response-json-no-argument-call
      - id: micro-behaviors/fs/write/file/content::json-stringify-write-sync
    any:
      - id: objectives/anti-static/obfuscation/string/name-split::reflective-fetch-channel-clues
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
