# Remote IDE terminal control methods.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1219

traits:
composite_rules:
  # Archive-scoped: the privileged-control legs (stream endpoint + terminal/git
  # write actions) are bundled across an extension's files, and the benign
  # exception's product identity (api domain, source repo, package name) is
  # likewise spread across package.json/readme/dist — both must resolve at the
  # same scope for the unless to apply.
  - id: remote-ide-privileged-control
    for: [vsix, javascript, typescript, package.json, markdown, zip]
    desc: Remote IDE control with privileged actions
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/communications/http/url/api-path::pending-command-stream-path-literal
    any:
      - id: micro-behaviors/fs/file/read-write::agent-write-file-tool
      - id: micro-behaviors/data/parse/vocabulary::terminal-write-action-label
      - id: micro-behaviors/data/parse/vocabulary::git-push-action-label
    needs: 2
    unless:
      # The CLI bundle never carries the extension runtime marker, so the
      # extension-scoped exception below cannot fire there; the bundle
      # content context above covers the CLI instead.
      - id: well-known/app/development/codeam-cli::codeam-cli-bundle-content-context
      - id: well-known/app/development/codeam-cli::codeagent-mobile-benign-remote-agent
