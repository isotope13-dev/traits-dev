# HTTP-delivered remote terminal control.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001

composite_rules:
  - id: http-relay-remote-terminal-command
    desc: HTTP relay injects commands into a local PTY
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/url/api-path::pending-command-stream-path-literal
      - id: micro-behaviors/process/tty/pty::node-terminal-write-parsed-data
      - id: micro-behaviors/process/tty/pty::node-pty-module-ref
    unless:
      # CodeAM CLI relays the user's own agent PTY to their phone by design.
      - id: well-known/app/development/codeam-cli::codeam-cli-bundle-content-context
