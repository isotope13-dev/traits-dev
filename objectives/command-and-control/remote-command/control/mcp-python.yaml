defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006
traits:
  - id: raw-mcp-shell-tool-name
    desc: MCP tool is named shell_exec
    crit: component
    conf: 0.99
    if:
      type: string_literal
      exact: shell_exec
  - id: raw-mcp-file-write-tool-name
    desc: MCP tool is named file_write
    crit: component
    conf: 0.99
    if:
      type: string_literal
      exact: file_write
  - id: raw-mcp-http-tool-name
    desc: MCP tool is named http_request
    crit: component
    conf: 0.99
    if:
      type: string_literal
      exact: http_request
composite_rules:
  - id: raw-mcp-unrestricted-dev-tool-surface
    desc: MCP exposes shell, file, and HTTP tools
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/ipc/mcp::python-mcp-server-call-tool
      - id: raw-mcp-shell-tool-name
      - id: raw-mcp-file-write-tool-name
      - id: raw-mcp-http-tool-name
      - id: micro-behaviors/process/create/subprocess::shell-true
