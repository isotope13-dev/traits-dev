defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: go-session-command-dispatch
    desc: Go session dispatches command execution
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/control-flow/dispatch::go-main-session-dispatch-symbol
      - id: micro-behaviors/data/control-flow/dispatch::go-main-command-handler-symbol
