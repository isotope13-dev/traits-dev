---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1059.006,T1133
composite_rules:
- id: python-http-json-remote-shell
  desc: HTTP request command reaches Python shell
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/property/access::mapping-command-key-access
  - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
  - id: micro-behaviors/data/parse/json::json-loads-call
  - id: micro-behaviors/communications/http/server/framework::builtin-http-server
  near_bytes: 3000
- id: python-http-request-command-exec
  desc: Python HTTP request handler executes command via shell
  crit: hostile
  conf: 0.98
  attack: T1059.006,T1071.001
  all:
  - id: micro-behaviors/communications/http/server/handler::python-http-handler-base-request
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: micro-behaviors/communications/http/server/request::python-http-response-body-write
  any:
  - id: micro-behaviors/process/create/variable::variable-command-argument
  - id: micro-behaviors/communications/http/server/listener::python-httpserver-bind-all
  - id: micro-behaviors/communications/http/server/middleware::python-basehttp-log-message-override
  near_bytes: 2000
- id: python-http-environment-response-write
  desc: HTTP handler writes process environment
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/server/framework::builtin-http-server
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: micro-behaviors/communications/http/server/request::python-http-response-body-write
  near_bytes: 3000
  unless:
  - id: metadata/path/directory::test-directory-component
- id: python-http-environment-disclosure
  desc: HTTP response exposes full process environment
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/server/framework::builtin-http-server
  - id: micro-behaviors/data/serialize/json::python-environ-json
  near_bytes: 3000
  unless:
  - id: metadata/path/directory::test-directory-component
