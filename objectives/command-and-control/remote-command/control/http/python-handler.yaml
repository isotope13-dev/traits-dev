---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1059.006,T1133
composite_rules:
- id: python-http-json-remote-shell
  desc: HTTP request command reaches Python shell
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/property/access::mapping-command-key-access
  - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
  - id: micro-behaviors/data/parse/json::json-loads-call
  - id: micro-behaviors/communications/http/server/framework::builtin-http-server
  near_bytes: 3000
- id: python-http-environment-disclosure
  desc: HTTP response exposes full process environment
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/env/enumerate::python-environ-dict
  - id: micro-behaviors/communications/http/server/framework::builtin-http-server
  near_bytes: 3000
  any:
  - id: micro-behaviors/data/serialize/json
  - id: metadata/lang/source/syntax/assignment/name::js-payload-object-assignment
  - id: micro-behaviors/data/codec::encoding-json-import
  - id: micro-behaviors/data/codec::javascript-serializer-type-reference
  - id: micro-behaviors/data/codec::json-newtonsoft
  - id: micro-behaviors/data/codec::json-polymorphic-attribute
  - id: micro-behaviors/data/codec::json-polymorphic-resolver
  - id: micro-behaviors/data/codec::json-system
  - id: micro-behaviors/data/codec::nlohmann-json-abi
  - id: micro-behaviors/data/codec::nsjsonserialization-class
  - id: micro-behaviors/data/codec::nsjsonserialization-text
  - id: micro-behaviors/data/codec::python-json-parse-and-serialize
  - id: micro-behaviors/data/codec::swift-json-object-serialization
  - id: micro-behaviors/data/collection/map::swift-dictionary-objc-bridge
  - id: micro-behaviors/data/parse/json::base64-buffer-json-parse
  - id: micro-behaviors/data/parse/json::base64-json-parse-near-file-write
  - id: micro-behaviors/data/parse/json::convertfrom-json-as-hashtable
  - id: micro-behaviors/data/parse/json::go-body-json-method-call
  - id: micro-behaviors/data/parse/json::go-content-field-json-unmarshal
  - id: micro-behaviors/data/parse/json::go-credential-json-unmarshal
  - id: micro-behaviors/data/parse/json::go-json-unmarshal
  - id: micro-behaviors/data/parse/json::json-quote-replace
  - id: micro-behaviors/data/parse/json::node-json-parse-buffer
  - id: micro-behaviors/data/parse/json::parse-body-content-json
  - id: micro-behaviors/data/parse/json::parse-body-content-json-js
  - id: micro-behaviors/data/parse/json::parse-body-content-json-python
  - id: micro-behaviors/data/parse/json::powershell-base64-json-parse
  needs: 1
