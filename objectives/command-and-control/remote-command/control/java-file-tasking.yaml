# File-backed tasking recovered from a Java implant. The task file is decoded,
# dispatched through the native shell selected for the host OS, and its output
# is written to a companion response file. This models the control channel
# rather than a product, class name, or fixed command.
defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: java-command-response-file-flow
    desc: Java reads task and writes response
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/read::java-dot-cmd-file-read
      - id: micro-behaviors/fs/file/write/suffix::java-dot-out-file-write
    near_lines: 50

  - id: jvm-command-response-file-flow
    desc: JVM bytecode reads command task and writes response file
    crit: suspicious
    conf: 0.97
    for: [class, jar, zip]
    scope: archive
    all:
      - id: metadata/file/string/file::jvm-dot-cmd-suffix
      - id: metadata/file/string/file::jvm-dot-out-suffix
      - id: micro-behaviors/fs/file/read::java-readallbytes
      - id: micro-behaviors/fs/write/file/direct::jvm-files-write-bytecode

  - id: java-filesystem-base64-shell-tasking
    desc: Java executes Base64 filesystem command tasks
    crit: hostile
    conf: 0.995
    all:
      - id: java-command-response-file-flow
      - id: micro-behaviors/process/create/shell/selection::java-windows-command-array-source
      - id: micro-behaviors/process/create/shell/selection::java-posix-command-array-source
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-source
      - id: micro-behaviors/process/io/stream::java-input-stream-access

  # The dropped-class variant (PaperCut-style lib/ bridge): the same file
  # tasking loop, plus erasure of the .class file the payload itself runs
  # from — bytecode that destroys its own artifact after running tasks.
  - id: java-self-erasing-tasking-class
    desc: Self-erasing dropped Java tasking class
    crit: hostile
    conf: 0.99
    all:
      - id: java-filesystem-base64-shell-tasking
      - id: objectives/evasion/self-delete/file/script::java-own-class-file-delete

  - id: jvm-filesystem-base64-shell-tasking
    desc: JVM bytecode executes Base64 filesystem command tasks
    crit: hostile
    conf: 0.995
    for: [class, jar, zip]
    scope: archive
    all:
      - id: jvm-command-response-file-flow
      - id: micro-behaviors/process/create/shell/selection::jvm-windows-processbuilder-shell
      - id: micro-behaviors/process/create/shell/selection::jvm-posix-processbuilder-shell
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/io/stream::jvm-process-input-stream
