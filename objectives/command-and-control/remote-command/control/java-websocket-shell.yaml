defaults:
  platforms: [windows, unix]
  for: [python, java, class]
  attack: T1059,T1071.001
  mbc: B0011

composite_rules:
  - id: jsp-websocket-shell-command
    desc: JSP WebSocket message executes a shell and returns output
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/websocket/server::java-websocket-server-endpoint
      - id: micro-behaviors/process/create/shell/lang::runtime-exec-with-shell-array
      - id: micro-behaviors/process/create/shell/lang::process-get-input-stream
      - id: micro-behaviors/communications/websocket/server::session-send-text
    near_bytes: 4096
