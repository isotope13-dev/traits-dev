# Compiled Go implants that expose command-shell, download, and upload
# modules and a recv-command loop — the remote-command surface, not a
# project path or family name.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1059,T1071
  mbc: B0022

traits:
  - id: go-cmd-shell-mod
    desc: Go command-shell module
    crit: notable
    conf: 0.94
    if:
      type: hex
      offset_range: [0, null]
      pattern: 63 6d 64 53 68 65 6c 6c 4d 6f 64

  - id: go-download-mod
    desc: Go download command module
    crit: notable
    conf: 0.92
    if:
      type: hex
      offset_range: [0, null]
      pattern: 64 6f 77 6e 6c 6f 61 64 4d 6f 64

  - id: go-upload-mod
    desc: Go upload command module
    crit: notable
    conf: 0.92
    if:
      type: hex
      offset_range: [0, null]
      pattern: 75 70 6c 6f 61 64 4d 6f 64

  - id: go-recv-command
    desc: Go recv-command dispatch loop
    crit: notable
    conf: 0.93
    if:
      type: hex
      offset_range: [0, null]
      pattern: 6d 61 69 6e 2e 72 65 63 76 43 6f 6d 6d 61 6e 64

composite_rules:
  - id: go-cmd-shell-download
    desc: Go implant shells and downloads
    crit: hostile
    conf: 0.97
    all:
      - id: go-cmd-shell-mod
      - id: go-download-mod

  - id: go-cmd-shell-recv
    desc: Go implant shells and receives commands
    crit: hostile
    conf: 0.97
    all:
      - id: go-cmd-shell-mod
      - id: go-recv-command

  - id: go-download-upload-mods
    desc: Go implant downloads and uploads
    crit: hostile
    conf: 0.96
    all:
      - id: go-download-mod
      - id: go-upload-mod
