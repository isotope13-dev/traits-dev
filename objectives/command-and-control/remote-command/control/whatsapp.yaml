defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 20000000
  attack: T1219

traits:
  - id: whatsapp-apache-control-commands
    desc: WhatsApp command vocabulary controls Apache
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '!start apache.{0,500}!stop apache'

  - id: whatsapp-database-control-command
    desc: WhatsApp command vocabulary for SQL queries
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '!db\s+(<db_name>|<name>).{0,80}(<query>|<SQL>)'

composite_rules:
  - id: whatsapp-controlled-development-services
    desc: WhatsApp messages control local development services
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/lib/network/whatsapp-web-js::whatsapp-web-js-library
      - id: whatsapp-apache-control-commands
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: whatsapp-database-control-command
      - id: micro-behaviors/process/terminate/command::taskkill-mysql-process
