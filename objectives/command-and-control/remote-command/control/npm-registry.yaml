defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.004

composite_rules:
  # A gateway-controlled updater is a meaningful remote administration
  # capability, but is also normal for disclosed managed agents.  Obfuscation
  # raises its triage value without proving persistence or malicious intent.
  - id: obfuscated-gateway-npm-self-update
    desc: Obfuscated gateway controls an npm self-update
    crit: suspicious
    conf: 0.98
    scope: archive
    attack: T1071.001,T1105
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/communications/websocket/agent::js-gateway-url-config-fields
      - id: micro-behaviors/communications/websocket/agent::js-agent-upgrade-handler
      - id: micro-behaviors/os/package-manager/upgrade::js-npm-install-command-builder

  - id: npm-dist-tag-shell-tasking
    desc: npm distribution tags deliver shell commands
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/services/registry::npm-registry-package-request
      - id: micro-behaviors/communications/http/services/registry::npm-dist-tags-read
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-bash-command
