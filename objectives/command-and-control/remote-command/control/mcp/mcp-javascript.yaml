# MCP tool control surface for remote command execution.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007
traits:
  - id: setrequesthandler-call-tool
    desc: Registers MCP call_tool handler
    crit: suspicious
    conf: 0.95
    # `setRequestHandler("call_tool", …)` — the handler name plus the literal
    # request type is distinctive as source text (no live query needed).
    if:
      type: text
      regex: 'setRequestHandler\s*\(\s*[''"]call_tool[''"]'
  - id: setrequesthandler-list-tools
    desc: Registers MCP list_tools handler
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'setRequestHandler\s*\(\s*[''"]list_tools[''"]'
  - id: arbitrary-command-description
    desc: Describes arbitrary command execution
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      substr: 执行任意系统命令
  - id: toolargs-command-field
    desc: Handles toolArgs.command input
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: toolArgs.command
  - id: toolargs-args-field
    desc: Handles toolArgs.args input
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: toolArgs.args
  - id: mcp-noauth-declaration
    desc: MCP service declares no authentication
    # Opting a network service out of authentication crosses a security
    # boundary, but local dev servers do it routinely, so the declaration
    # alone stays suspicious. It turns hostile only beside a listener, a
    # tool-dispatch surface, and process execution (see below).
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(type\s*:\s*[''"]noauth[''"]|[''"]?authentication[''"]?\s*:\s*[''"]none[''"])'
composite_rules:
  - id: mcp-run-command-tool
    desc: MCP server exposes run_command tool
    crit: suspicious
    conf: 0.97
    all:
      - id: setrequesthandler-call-tool
      - id: setrequesthandler-list-tools
      - id: micro-behaviors/process/create/shell/agent-runtime::javascript-run-command-tool-name
    any:
      - id: arbitrary-command-description
      - id: micro-behaviors/communications/mcp::mcp-stdio-transport
      - id: toolargs-command-field
  - id: mcp-stdio-command-execution
    desc: MCP stdio remote command execution server
    crit: hostile
    conf: 0.99
    all:
      - id: mcp-run-command-tool
      - id: metadata/import/builtin::require-child-process
      - id: "metadata/lang/source/syntax/key-value::js-shell-true-property"
    any:
      - id: metadata/lang/source/syntax/key-value::node-windowshide-true-option
      - id: toolargs-args-field
      - id: micro-behaviors/communications/mcp::mcp-stdio-transport
  - id: mcp-sdk-exec-command-tool
    desc: MCP SDK registers exec_command tool
    # Shell-capable MCP servers are dangerous but can be deliberately installed
    # local tools.  The matcher proves the exposed capability, not hostile use.
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/mcp::mcp-server-tool-registration
      - id: micro-behaviors/process/create/shell/agent-runtime::javascript-exec-command-tool-name
  - id: mcp-noauth-http-command-service
    desc: Unauthenticated MCP command service on HTTP
    # A hand-rolled MCP/JSON-RPC server is as remotely drivable as an SDK one:
    # tools/list advertises the tools, tools/call dispatches a caller's choice,
    # child-process execution runs it, an HTTP listener receives it, and the
    # no-auth declaration admits anyone. Deliberately installed local tools use
    # stdio or require credentials; serving command execution to the network
    # with authentication explicitly off is the backdoor shape, whether or not
    # a tunnel publishes the port.
    crit: hostile
    conf: 0.96
    mbc: "B0022"
    all:
      - id: micro-behaviors/communications/mcp::mcp-tools-list-method
      - id: micro-behaviors/communications/mcp::mcp-tools-call-method
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: objectives/command-and-control/remote-command/control/mcp::mcp-noauth-declaration
      - id: micro-behaviors/communications/socket/listen::node-server-listen
