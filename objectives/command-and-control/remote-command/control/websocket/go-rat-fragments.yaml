# WebSocket RAT control channel.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059
  mbc: B0022

traits:
  - id: webrat-go-module
    desc: WebRAT Go module path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: webrat-go-api

composite_rules:
  - id: go-webrat-remote-command-execution
    desc: Go WebRAT remote command execution
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/symbols/name::go-os-exec-package-reference
      - id: webrat-go-module

  - id: go-websocket-rat-remote-control
    desc: Go WebSocket RAT remote control
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/websocket/library::go-websocket-library
      - id: metadata/binary/symbols/name::go-os-exec-package-reference
    needs: 2
    any:
      - id: objectives/collection/monitor/capture::go-rat-remote-desktop-control
      - id: objectives/collection/monitor/capture::go-rat-webcam-microphone-capture
      - id: objectives/collection/keylog/hook::go-keyboard-hook-recording-profile
      - id: micro-behaviors/os/clipboard/reference::go-clipboard-with-process-exec
      - id: objectives/impact/ui/manipulation/harassment::windows-prankware-ui-disruption
      - id: webrat-go-module

  - id: go-webrat-websocket-backdoor
    desc: Go WebRAT WebSocket backdoor
    crit: hostile
    conf: 0.97
    all:
      - id: webrat-go-module
      - id: "metadata/import/package::gorilla-websocket-module-reference"
    any:
      - id: metadata/binary/symbols/name::go-os-exec-package-reference
      - id: objectives/credential-access/cloud/token/files::go-func-steal-tokens
