defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-pty-websocket-input-control
    desc: WebSocket input reaches Node PTY
    crit: suspicious
    conf: 0.9
    attack: T1059.007
    all:
      - id: micro-behaviors/process/tty/pty::node-pty-usage
      - id: objectives/command-and-control/backdoor/shell/pty::websocket-pty-input-write
    any:
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/http/websocket::websocket-class
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/app/development/codeplane/
      - id: well-known/lib/runtime/opentui/
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
      - id: well-known/app/ai/coding-agent/adhdev::adhdev-session-host-runtime
      # ADHDev local-dashboard daemon: a 127.0.0.1-bound, Bearer-auth-gated web
      # terminal, not a reverse shell.
      - id: well-known/app/ai/coding-agent/adhdev::adhdev-daemon-package
      - id: well-known/app/system/vsmux::vsmux-terminal-daemon-marker
      - id: well-known/app/system/vsmux::vsmux-bundle-text

  - id: remote-pty-agent-with-safety-bypass
    desc: Remote PTY task launches an AI CLI with safety bypasses
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1071.001
    mbc: B0022
    all:
      - id: micro-behaviors/communications/websocket/receive::websocket-registered-handler
      - id: micro-behaviors/communications/websocket/receive::create-pty-task-event-dispatch
      - id: micro-behaviors/process/tty/pty::node-pty-module-ref
      - id: micro-behaviors/process/create/agent::ai-agent-dangerous-permission-flag
      - id: micro-behaviors/process/tty/pty::node-pty-resolved-command-launch
