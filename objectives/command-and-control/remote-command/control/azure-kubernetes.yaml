# Managed Kubernetes access can be escaped by using Azure's VM Run Command
# API against an underlying node. The hostile chain requires the API,
# executable root-shell content, and a Kubernetes-node target.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1651

composite_rules:
  - id: azure-kubernetes-node-root-command
    desc: Azure Kubernetes node root command
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/azure::azure-vm-run-command-operation
      - id: micro-behaviors/os/container/runtime::kubernetes-node-target-context
    # The payload legs reference the canonical shell-interpreter capabilities.
    # A local `root-shell-script-literal` used to restate them as one
    # alternation, so its "Root shell script literal" label landed on every
    # file merely containing the word `powershell` — highlight.js's PowerShell
    # grammar among them — and it duplicated the `bin-sh` matcher.
    any:
      - id: micro-behaviors/process/create/shell/spawn::bin-sh
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/process/create/root-shell::root-shell-script-field
    near_bytes: 4096
