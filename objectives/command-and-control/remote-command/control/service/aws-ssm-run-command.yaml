# Post-compromise AWS Systems Manager (SSM) SendCommand fleet execution paired
# with cloud instance-metadata credential harvesting or SAML/XXE credential
# pivot. Ordinary DevOps maintenance scripts invoke SendCommand using existing
# workstation/CI credentials without harvesting IMDS role tokens or shadow files.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: hostile
  conf: 0.98
  attack: T1651,T1552.005

composite_rules:
  - id: aws-imds-pivot-ssm-fleet-command
    desc: Combines cloud IMDS credential theft with AWS SSM SendCommand script execution
    all:
      - id: micro-behaviors/communications/http/services/aws-control::ssm-send-command-operation
      - id: micro-behaviors/communications/http/services/aws-control::ssm-run-script-document
    any:
      - id: objectives/credential-access/cloud/token/metadata::xxe-cloud-imds-credential-harvest
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
      - id: micro-behaviors/fs/path/credential::authorized-keys-or-shadow-path
    unless:
      - id: metadata/package/documentation/source::javascript-exported-documentation-records
      - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
      - id: metadata/package/documentation/security-testing::defensive-review-documentation
      - id: objectives/execution/exploit/xxe::xxe-example-in-skill-catalog
      - id: metadata/file/extension/identity::markdown-file-basename
    near_bytes: 16384
