# Post-compromise Azure VM Run Command execution paired with cloud credential
# harvesting under unattended OAuth client_credentials authentication (Microsoft
# Threat Intelligence, November 2026). Ordinary fleet-maintenance scripts invoke
# Run Command without extracting secrets from Key Vault, Storage, App Service,
# or AKS control-plane endpoints.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: hostile
  conf: 0.98
  attack: T1651,T1078.004

composite_rules:
  - id: azure-credential-harvest-vm-run-command
    desc: Combines Azure credential harvesting with VM Run Command script execution
    all:
      - id: micro-behaviors/communications/http/services/azure::arm-management-host
      - id: micro-behaviors/communications/http/services/azure::azure-vm-run-command-operation
      - id: micro-behaviors/communications/http/services/azure::azure-vm-run-command-script-selector
      - id: micro-behaviors/communications/http/services/azure::microsoft-service-principal-token-request
    any:
      - id: micro-behaviors/communications/http/services/azure::arm-list-keys-operation
      - id: micro-behaviors/communications/http/services/azure::arm-webapp-secrets-list-operation
      - id: micro-behaviors/communications/http/services/azure::arm-aks-cluster-credentials-operation
      - id: micro-behaviors/communications/http/services/keyvault-azure::secret-list-path
    near_bytes: 131072
