defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: generic-dup
    desc: Function to execute remote commands
    # conf 0.2 placeholder: `executeCommand` is a universal method name (any
    # CLI framework, editor extension or bot toolkit). It only means remote
    # command dispatch inside the composites that pair it with a transport.
    crit: component
    conf: 0.2
    if:
      type: text
      regex: (?i)\bexecuteCommand\b
    not:
      - regex: (?i)executeCommand(:|Configuration)
      - regex: (?i)executeCommandProvider
    unless:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
