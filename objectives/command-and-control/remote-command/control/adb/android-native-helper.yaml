defaults:
  platforms: [android]
  for: [java, apk, zip]
composite_rules:
  - id: android-remote-adb-native-helper
    desc: Remote ADB control and native helper execution
    crit: hostile
    conf: 0.995
    attack: T1059,T1071.001
    all:
      - id: objectives/command-and-control/remote-command/control/adb::android-wireless-adb-c2-shell
      - id: micro-behaviors/communications/socket/tcp::adb-shell-shared-object-exec-request
