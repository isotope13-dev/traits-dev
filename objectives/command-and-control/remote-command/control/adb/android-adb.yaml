# A remotely tasked agent that first automates local Wireless ADB pairing and
# then opens the ADB shell service is a remote-command channel, independent of
# the malware family's command vocabulary or pairing-library implementation.
# ADB-bound device command channel.
defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip, dex]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: android-wireless-adb-c2-shell
    desc: WebSocket agent opens Wireless ADB shell
    crit: hostile
    conf: 0.995
    attack: T1059,T1071.001,T1417.001
    all:
      - id: android-websocket-message-to-adb-shell
      - id: objectives/privilege-escalation/elevation-control/permission::android-accessibility-wireless-adb-pairing
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint
    any:
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-client
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client

  # The calibrated rung between a plain socket client and remote tasking: the
  # code reacts to WebSocket messages and speaks the ADB shell service, but the
  # received text never reaches the command string, so attacker-chosen
  # commands are not proven. Tasking with a bound command is the hostile
  # android-wireless-adb-c2-shell above; this co-occurrence stays suspicious.
  - id: android-websocket-adb-agent
    desc: ADB shell service requests under a WebSocket message handler
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/websocket/receive::jvm-onmessage-function
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request

# Bind the received callback parameter to the shell service argument. A socket
# client beside a fixed local settings command does not establish remote tasking.
traits:
  - id: android-websocket-message-to-adb-shell
    desc: WebSocket message forms an ADB shell command
    crit: suspicious
    conf: 0.99
    for: [java]
    if:
      type: tree-sitter
      query: |
        ((method_declaration name: (identifier) @handler
          parameters: (formal_parameters
            . (formal_parameter type: (type_identifier) @socket_type)
            . (formal_parameter name: (identifier) @message))
          body: (block (expression_statement
            (method_invocation name: (identifier) @open
              arguments: (argument_list (binary_expression
                left: (string_literal (string_fragment) @service)
                right: (identifier) @command)))))) @dispatch
         (#eq? @handler "onMessage") (#eq? @socket_type "WebSocket")
         (#eq? @open "openStream") (#eq? @service "shell:")
         (#eq? @message @command))
