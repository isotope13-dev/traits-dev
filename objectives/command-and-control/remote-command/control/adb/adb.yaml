# ADB-bound device command channel.
defaults:
  platforms: [unix, android]
  for: [elf, shell, c, cpp]
  attack: T1059
  mbc: B0022
composite_rules:
  - id: adb-shell-remote-command
    for: [elf, c]
    desc: ADB shell remote command channel
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/adb::shell-v2-session
      - id: micro-behaviors/communications/socket/connect/attempt::connect
      - id: micro-behaviors/communications/socket/send/reference::send
