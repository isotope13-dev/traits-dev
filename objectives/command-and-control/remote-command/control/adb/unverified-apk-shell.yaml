defaults:
  platforms: [unix, android]
  for: [shell]
composite_rules:
  - id: unverified-apk-deployment-persistent-adb
    desc: APK deployment persists ADB TCP settings
    crit: hostile
    conf: 0.99
    attack: T1098,T1105
    all:
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::android-netcat-unverified-apk-deployment
      - id: micro-behaviors/communications/socket/tcp::shell-persistent-adb-tcp-port
