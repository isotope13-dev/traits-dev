# RAT modules that type onto a tethered Android device via ADB
# `input text`, one local keystroke at a time.
# ADB-bound device command channel.
defaults:
  platforms: [android, unix]
  for: [python]
  attack: T1059.004,T1417
  mbc: B0022

traits:
  - id: adb-input-text-command
    desc: ADB input text keystroke command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\badb(\.exe)?(\s+shell)?\s+["'']?input\s+text\b'
  - id: python-device-send-command
    desc: Sends a command to a bound device
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.send_command\s*\('
composite_rules:
  - id: python-adb-input-text-loop
    desc: Forwards raw keystrokes as ADB input text
    crit: hostile
    conf: 0.96
    all:
      - id: adb-input-text-command
      - id: micro-behaviors/os/console/control::tty-set-raw-mode
  - id: python-device-adb-input-text
    desc: Device command channel types ADB input text
    crit: hostile
    conf: 0.95
    all:
      - id: adb-input-text-command
      - id: python-device-send-command
  - id: python-raw-tty-device-command
    desc: Raw TTY keystrokes sent to a device
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/console/control::tty-set-raw-mode
      - id: python-device-send-command
