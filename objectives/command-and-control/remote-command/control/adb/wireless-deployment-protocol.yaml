# Protocol literals indicate capabilities, not proof of execution.
defaults:
  for: [source, javascript, python]
  platforms: [android, unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: wireless-debug-settings-command
    desc: Command requests wireless debugging settings
    if:
      type: literal
      kind: string
      exact: "OPEN_WIFI_DEBUG_SETTINGS"
  - id: wireless-pairing-command
    desc: Command requests automated wireless pairing
    if:
      type: literal
      kind: string
      exact: "AUTO_WIRELESS_PAIRING"
  - id: local-service-deployment-command
    desc: Command requests native local service deployment
    if:
      type: literal
      kind: string
      exact: "DEPLOY_LOCAL_SERVICE"
composite_rules:
  - id: wireless-adb-service-command-set
    desc: Command set pairs wireless ADB and deploys a native service
    crit: suspicious
    conf: 0.97
    all:
      - id: wireless-debug-settings-command
      - id: wireless-pairing-command
      - id: local-service-deployment-command
