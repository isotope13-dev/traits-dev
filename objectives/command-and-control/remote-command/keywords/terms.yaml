---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - scripts
  - source
traits:
- id: command-assignment-key
  desc: Command field or assignment key
  crit: component
  conf: 0.4
  for: [scripts, javascript, typescript, shell, rust, java, csharp, groovy, json]
  if:
    type: text
    regex: '(?i)["'']?(cmd|command)["'']?\s*[:=]'
- id: result-assignment-key
  desc: Result field or assignment key
  crit: component
  conf: 0.4
  for: [scripts, javascript, typescript, shell, rust, java, csharp, groovy, json]
  if:
    type: text
    regex: '(?i)["'']?result["'']?\s*[:=]'
- id: command-dup
  desc: Command hook configuration key
  for: [shell]
  if:
    type: text
    regex: '(?i)["'']?command["'']?\s*[:=]'
- id: getlocalip-command
  desc: 'Bot command verb: GETLOCALIP'
  crit: component
  conf: 0.35
  for:
  - binaries
  if:
    type: text
    word: GETLOCALIP
    section: ".text"
- id: file-op-move-verb
  desc: MOVE file-operation verb
  crit: component
  for: [binaries]
  if:
    type: text
    exact: MOVE
    section: ".rdata"
- id: file-op-copy-verb
  desc: COPY file-operation verb
  crit: component
  for: [binaries]
  if:
    type: text
    exact: COPY
    section: ".rdata"
- id: file-op-delete-verb
  desc: DELETE file-operation verb
  crit: component
  for: [binaries]
  if:
    type: text
    exact: DELETE
    section: ".rdata"
- id: file-op-execute-verb
  desc: EXECUTE file-operation verb
  crit: component
  for: [binaries]
  if:
    type: text
    exact: EXECUTE
    section: ".rdata"
composite_rules:
- id: command-result-word
  desc: Command/result assignment pair
  crit: component
  conf: 0.4
  for: [scripts, javascript, typescript, shell, rust, java, csharp, groovy, json]
  all:
  - id: command-assignment-key
  - id: result-assignment-key
  near_lines: 8
- id: file-op-command-verbs
  desc: File-operation command verb cluster
  crit: component
  conf: 0.3
  for: [binaries]
  any:
  - id: file-op-move-verb
  - id: file-op-copy-verb
  - id: file-op-delete-verb
  - id: file-op-execute-verb
