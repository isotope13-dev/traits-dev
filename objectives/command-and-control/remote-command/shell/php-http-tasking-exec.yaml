# PHP operator tasking over HTTP: the server's reply carries a decoded
# structured payload with a command field, the client reads that field, and a
# shell runs a variable command. Requiring decoded structured data alongside the
# variable shell launch avoids false positives on installers that parse CLI
# `$arguments['cmd']`, download artifacts via curl_exec, and invoke helper exec().
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1059

composite_rules:
  # Each leg of the tasking loop is a role with several spellings. The groups
  # keep the alternatives counting as one role.
  - id: php-http-reply-request
    desc: PHP requests a remote reply over HTTP
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
  - id: php-reply-deserialization
    desc: PHP decodes structured reply payload
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/parse/json::php-json-decode
      - id: micro-behaviors/data/serialize/object::unserialize
  - id: php-reply-command-field
    desc: PHP reads a cmd or command field
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/property/access::mapping-command-key-access
      - id: micro-behaviors/data/property/access::php-object-command-property
  # Variable or concatenated command arguments prevent fixed-string probes
  # (`exec('curl --version')`, `popen('uptime', 'r')`) from qualifying.
  - id: php-shell-launch-call
    desc: PHP launches a variable shell command
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/variable-command::php-variable-shell-command
      - id: micro-behaviors/process/create/variable::proc-open-variable-argument
  - id: php-http-command-shell-tasking
    desc: PHP reads a command field from HTTP reply and runs it
    crit: hostile
    conf: 0.94
    near_lines: 200
    all:
      - id: php-http-reply-request
      - id: php-reply-deserialization
      - id: php-reply-command-field
      - id: php-shell-launch-call
