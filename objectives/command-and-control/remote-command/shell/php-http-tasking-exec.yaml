# PHP operator tasking over HTTP: the server's reply carries a command field,
# the client reads that field, and a shell runs it. The three legs are common
# on their own (API clients read `cmd` keys and call exec), so the hostile
# claim needs the request, the command-key read, and the shell launch in one
# file.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1059

composite_rules:
  # Each leg of the tasking loop is a role with several spellings. The groups
  # keep the alternatives counting as one role.
  - id: php-http-reply-request
    desc: PHP requests a remote reply over HTTP
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
  - id: php-reply-command-field
    desc: PHP reads a cmd or command field
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/property/access::mapping-command-key-access
      - id: micro-behaviors/data/property/access::php-object-command-property
  # Any PHP shell launcher completes the tasking loop, not only exec(). popen()
  # and proc_open() count only with a variable command, so a fixed pipeline
  # beside an unrelated HTTP call does not qualify.
  - id: php-shell-launch-call
    desc: PHP launches a shell command
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/command-mode::php-exec
      - id: micro-behaviors/process/create/shell/command-mode::php-shell-exec
      - id: micro-behaviors/process/create/shell/command-mode::php-passthru
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: micro-behaviors/process/create/shell/command-mode::exec-variable-argument-popen
      - id: micro-behaviors/process/create/variable::proc-open-variable-argument
  - id: php-http-command-shell-tasking
    desc: PHP reads a command field from HTTP reply and runs it
    crit: hostile
    conf: 0.94
    near_lines: 200
    all:
      - id: php-http-reply-request
      - id: php-reply-command-field
      - id: php-shell-launch-call
