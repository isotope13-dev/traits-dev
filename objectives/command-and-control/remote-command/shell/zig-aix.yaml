defaults:
  platforms: [aix, unix]
  for: [zig]
  attack: T1059.004
  mbc: B0022
composite_rules:
  - id: zig-token-shell-interpreter
    desc: Zig TCP agent dispatches exec token through shell
    crit: hostile
    conf: 0.97
    scope: leaf
    all:
      - id: micro-behaviors/data/source/syntax/keyword::zig-parser-exec-token-fragment
      - id: micro-behaviors/process/create/shell/spawn::zig-child-run-shell-c
    any:
      - id: micro-behaviors/communications/socket/connect::zig-tcp-connect-host
      - id: micro-behaviors/communications/socket/connect::zig-tcp-connect-address
