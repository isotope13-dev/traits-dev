defaults:
  platforms: [panos, appliance, unix]
  for: [cpp]
  attack: T1059

traits:
  - id: cpp-panos-cmd-output-marker
    desc: C++ PAN-OS CMD output marker
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "CMD_OUTPUT:"

  # micro-behaviors/communications/http/url/telemetry::api-report-path is
  # `for: [scripts, binaries]` -- it never reaches C++ source. Local
  # text-identical leg so the composite below can require the same literal.
  - id: cpp-panos-report-path-source
    desc: C++ API report path literal (source)
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/api/(v[0-9]+/)?report([/?#"'' ]|$)'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record

composite_rules:
  # micro-behaviors/process/create/shell/spawn::c-popen-call is source-only
  # (`type: symbol`, `for: [c, cpp, swift, zig]`) and api-report-path (the
  # shared telemetry atom) is `for: [scripts, binaries]`, so a compiled Elf
  # can satisfy the report-path leg but never the popen leg, and vice versa
  # for source. Adding an Elf-side import-table popen check to cover the
  # compiled half collides with the existing text-surface popen-frequency
  # atoms already typed for elf/macho (dedup/cross-type), and there is no
  # existing Elf-compatible popen atom to reuse instead, so this stays
  # source-only rather than inventing one.
  - id: cpp-panos-c2-command-output
    desc: C++ PAN-OS C2 command output (source)
    crit: hostile
    conf: 0.98
    all:
      - id: cpp-panos-report-path-source
      - id: cpp-panos-cmd-output-marker
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call
