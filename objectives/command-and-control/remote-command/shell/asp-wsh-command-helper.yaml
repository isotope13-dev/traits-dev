defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: asp-request-cmd-parameter
    desc: ASP reads cmd request parameter
    if:
      type: text
      regex: '(?i)\brequest\s*\(\s*["'']cmd["'']\s*\)'
  - id: asp-cmd-c-variable-helper-call
    desc: ASP passes cmd and variable to helper
    if:
      type: text
      regex: '(?i)\b[a-z_][a-z0-9_]*\s*\(\s*["'']cmd\s*/c\s*["'']\s*&\s*[a-z_][a-z0-9_]*\s*\)'
  - id: asp-wsh-exec-variable
    desc: ASP executes a variable
    if:
      type: text
      regex: '(?i)\.exec\s*\(\s*[a-z_][a-z0-9_]*\s*\)'
  - id: asp-wsh-stdout-readall
    desc: ASP reads command standard output
    if:
      type: text
      regex: '(?i)\.stdout\.readall\b'
  - id: asp-wsh-comspec-variable-exec
    desc: ASP executes COMSPEC with variable text
    if:
      type: text
      regex: '(?i)\.exec\s*\(\s*"%comspec%\s+/c\s*"\s*&\s*\w+'
composite_rules:
  - id: asp-request-command-helper-shell
    desc: ASP request and WSH command-helper clues
    crit: hostile
    attack: T1505.003,T1059.005
    all:
      - id: asp-request-cmd-parameter
      - id: asp-cmd-c-variable-helper-call
      - id: asp-wsh-exec-variable
      - id: asp-wsh-stdout-readall
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/communications/http/response::asp-response-write
  - id: asp-request-comspec-command-shell
    desc: ASP request and COMSPEC command-output clues
    crit: hostile
    attack: T1505.003,T1059.005
    all:
      - id: asp-request-cmd-parameter
      - id: asp-wsh-comspec-variable-exec
      - id: asp-wsh-stdout-readall
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/communications/http/response::asp-response-write
