defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: concealed-telegram-message-shell
    for: [python, whl, zip, python-sdist]
    desc: Concealed Telegram message shell
    crit: hostile
    conf: 0.99
    attack: T1059,T1102
    all:
      - id: objectives/command-and-control/channel/messaging::concealed-threaded-telegram-polling
      - id: micro-behaviors/process/create/shell-subprocess::message-text-async-shell-handler
      - id: micro-behaviors/process/create/shell-subprocess::asyncio-create-subprocess-shell
