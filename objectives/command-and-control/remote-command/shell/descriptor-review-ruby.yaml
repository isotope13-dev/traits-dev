# Descriptor-redirection evidence suggests shell control; socket direction and network use are not established.
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [ruby]
  conf: 0.95

traits:
  - id: ruby-interactive-shell-fd-redirection
    desc: Ruby redirects shell file descriptors
    if:
      type: text
      regex: 'exec\s+sprintf\(\s*["''][^\n]{0,70}/bin/sh -i \\?<\\?&%d'
