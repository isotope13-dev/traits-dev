# Generic webshell password gate: a self-posting password form guarding a
# remote shell. Each atom alone is ordinary web markup (login pages also name
# password fields and self-post), so every atom stays notable; only the shell
# context assembled below is hostile. Family brands (ORVX, r57, WSO) are
# deliberately absent: new shells reuse this gate shape under new names.
defaults:
  platforms: [windows, unix]
  for: [html, php]
  attack: T1505.003
  mbc: B0030

traits:
- id: shell-password-title
  desc: Page title names a shell password
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '(?i)<title\b[^<]{0,120}shell\s+password'
- id: shell-password-protection-copy
  desc: Shell claims password protection
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '(?i)shell is protected by.{0,60}password'
composite_rules:
  # The gate posts the password back to itself: title names the shell
  # password, a password field collects it, and the action-less form keeps
  # the exchange on the shell URL instead of handing it to a login endpoint.
  - id: webshell-self-post-password-gate
    desc: Self-posting form guards a shell password
    crit: hostile
    conf: 0.96
    all:
      - id: shell-password-title
      - id: micro-behaviors/ui/window/password-field::browser-password-input-marker
      - id: micro-behaviors/communications/http/request/html::html-form-actionless-post
  # The gate answers a wrong password: protection claim plus failure copy
  # plus the password field waiting for another try. Benign logins show the
  # same pair, so the shell-protection claim carries the gate context.
  - id: webshell-password-retry-gate
    desc: Protected shell reports a wrong password
    crit: hostile
    conf: 0.96
    for: [html]
    all:
      - id: shell-password-protection-copy
      - id: micro-behaviors/ui/window/notify::password-incorrect-feedback
      - id: micro-behaviors/ui/window/password-field::browser-password-input-marker
