defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: asp-query-cmd-assignment
    desc: ASP assigns cmd query input to cmd
    if:
      type: text
      regex: '(?i)\bcmd\s*=\s*trim\s*\(\s*request\.querystring\s*\(\s*"cmd"\s*\)\s*\)'
  - id: asp-cmd-helper-parameter
    desc: ASP declares helper with cmd parameter
    if:
      type: text
      regex: '(?i)\bfunction\s+\w+\s*\([^\r\n)]{0,80}\bcmd\b'
  - id: asp-call-cmd-helper
    desc: ASP passes cmd variable to helper
    if:
      type: text
      regex: '(?i)\b\w+\s*\(\s*cmd\s*[,)]'
  - id: asp-comspec-exec-cmd
    desc: ASP WSH executes COMSPEC with cmd
    if:
      type: text
      regex: '(?i)\.exec\s*\(\s*"%comspec%\s+/c\s*"[^\r\n]{0,80}&\s*cmd\s*\)'
  - id: aspnet-process-cmd-argument
    desc: ASP.NET process arguments include cmd
    if:
      type: text
      regex: '(?i)\.arguments\s*=\s*"/c\s*"\s*&\s*cmd\b'
composite_rules:
  # These co-occurring request and helper facts describe a command-shell
  # profile; they do not by themselves prove a successful execution.
  - id: asp-query-command-comspec-shell
    desc: ASP query command and COMSPEC helper clues
    crit: hostile
    attack: T1505.003,T1059.005
    all:
      - id: asp-query-cmd-assignment
      - id: asp-cmd-helper-parameter
      - id: asp-call-cmd-helper
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: asp-comspec-exec-cmd
  - id: aspnet-query-command-process-shell
    desc: ASP.NET query command and process helper clues
    crit: hostile
    attack: T1505.003,T1059.003
    all:
      - id: asp-query-cmd-assignment
      - id: asp-cmd-helper-parameter
      - id: asp-call-cmd-helper
      - id: aspnet-process-cmd-argument
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-source-process-instance-start
      - id: micro-behaviors/process/stdio/configure::dotnet-standard-output-redirection
