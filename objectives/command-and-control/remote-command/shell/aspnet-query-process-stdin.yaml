defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: aspnet-query-selected-shell
    desc: ASP.NET takes shell path from query
    if:
      type: text
      regex: '(?i)\bstring\s+shell\s*=\s*request\.querystring\s*\['
  - id: aspnet-shell-cmd-function-signature
    desc: ASP.NET helper accepts cmd and shell
    if:
      type: text
      regex: '(?i)\bstring\s+\w+\s*\(\s*string\s+cmd\s*,\s*string\s+shell\s*\)'
  - id: aspnet-shell-cmd-helper-call
    desc: ASP.NET returns helper output for shell
    if:
      type: text
      regex: '(?i)response\.write\s*\(\s*\w+\s*\(\s*\w+\s*,\s*shell\s*\)'
  - id: aspnet-shell-process-input
    desc: ASP.NET starts shell and writes cmd
    if:
      type: yara
      source: |
        rule aspnet_shell_process_input {
          strings:
            $shell = /\.StartInfo\.FileName\s*=\s*shell\s*;/ nocase
            $stdin = /\.StandardInput\.WriteLine\s*\(\s*cmd\s*\)/ nocase
          condition:
            all of them
        }
composite_rules:
  - id: aspnet-query-shell-process-stdin
    desc: ASP.NET query shell and command-stdin clues
    crit: hostile
    attack: T1505.003,T1059.003
    all:
      - id: aspnet-query-selected-shell
      - id: aspnet-shell-cmd-function-signature
      - id: aspnet-shell-cmd-helper-call
      - id: aspnet-shell-process-input
      - id: micro-behaviors/process/stdio/configure::aspnet-standard-input-redirection
      - id: micro-behaviors/process/stdio/configure::dotnet-standard-output-redirection
