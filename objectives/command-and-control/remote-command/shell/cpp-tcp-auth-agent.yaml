# Native C++ TCP remote-command agents: authenticate after connect, then
# dispatch shell commands (typically cmd.exe /c via CreateProcess + pipes).
# Protocol banners and JSON tasking fields are reusable; the hostile
# composites require network client lifecycle plus local command execution.
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1059.003,T1071.001"
  mbc: B0030

traits:
  - id: cpp-agent-started-banner
    desc: C++ remote agent start banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "=== C++ Agent started ==="

  - id: tcp-connected-sending-auth
    desc: TCP connected then sends auth
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "TCP connected. Sending auth..."

  - id: runcommand-task-label
    desc: RunCommand remote task label
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "RunCommand:"

  - id: rmgmt-cpp-agent-log-name
    desc: rmgmt C++ agent log filename
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: rmgmt_cpp_agent.log

  - id: json-commandid-field
    desc: JSON CommandId tasking field
    crit: component
    conf: 0.9
    if:
      type: text
      word: CommandId

  - id: json-clientid-field
    desc: JSON ClientId tasking field
    # Generic JSON field name — incomplete C2 evidence alone (terminals, mux
    # servers, and APIs use ClientId). Hostile composites require agent banners.
    crit: component
    conf: 0.9
    if:
      type: text
      word: ClientId

  - id: json-payload-field
    desc: JSON Payload tasking field
    crit: component
    conf: 0.88
    if:
      type: text
      word: Payload

composite_rules:
  - id: cpp-tcp-auth-json-tasking
    desc: C++ agent JSON CommandId ClientId tasking
    crit: notable
    conf: 0.94
    all:
      - id: json-commandid-field
      - id: json-clientid-field
      - id: json-payload-field
    # These names are common in generated SDK models. Require one of the
    # family-specific native-agent strings before presenting them as tasking.
    any:
      - id: cpp-agent-started-banner
      - id: tcp-connected-sending-auth
      - id: rmgmt-cpp-agent-log-name

  - id: cpp-tcp-auth-cmd-agent
    desc: C++ TCP-auth agent runs cmd via pipes
    crit: hostile
    conf: 0.98
    all:
      - id: tcp-connected-sending-auth
      - id: cpp-agent-started-banner
      - id: runcommand-task-label
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    unless:
      - id: metadata/signed/platform/

  - id: rmgmt-cpp-json-cmd-agent
    desc: rmgmt C++ agent with JSON cmd tasking
    crit: hostile
    conf: 0.99
    all:
      - id: rmgmt-cpp-agent-log-name
      - id: cpp-tcp-auth-json-tasking
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    unless:
      - id: metadata/signed/platform/
