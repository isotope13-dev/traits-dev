defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: ptb-message-text-shell
  desc: Registered Telegram handler executes message text in shell
  crit: hostile
  conf: 0.995
  attack: T1059.006,T1102
  all:
  - id: micro-behaviors/process/create/shell/request::python-registered-message-shell-handler
  - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-run-polling
  - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-application-builder
