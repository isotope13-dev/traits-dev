defaults:
  platforms: [unix, windows]
  for: [shell, package.json, javascript, typescript, text]
  attack: T1059.004
composite_rules:
  - id: shell-netcat-command-exposes-shell
    desc: Shell command exposes a Netcat shell
    crit: suspicious
    conf: 0.9
    for: [shell]
    any:
      - id: objectives/command-and-control/remote-command/shell::nc-exec-sh
      - id: objectives/command-and-control/remote-command/shell::ncat-exec-sh
      - id: objectives/command-and-control/remote-command/shell::netcat-exec-sh
