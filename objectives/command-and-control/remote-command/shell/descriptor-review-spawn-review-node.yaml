# Descriptor-redirection evidence suggests shell control; socket direction and network use are not established.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.004

traits:
  - id: bash-interactive-fd-bridge
    desc: Bash interactive fd bridge
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'bash\s+-i\s*<&[0-9]+\s*>&[0-9]+\s*2>&[0-9]+'
