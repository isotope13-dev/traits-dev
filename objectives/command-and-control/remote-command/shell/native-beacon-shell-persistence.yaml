defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1071.001,T1059.004,T1053.003

traits:
  - id: native-beacon-shell-cron-sensitive-files
    desc: HTTP beacon, shell, cron and key access
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_beacon_shell_cron_sensitive_files {
          strings:
            $post = "POST /beacon HTTP/1.1"
            $recv = /recv[ \t]*\(/
            $shell = /execl[ \t]*\([ \t]*"\/bin\/sh"[ \t]*,[ \t]*"sh"[ \t]*,[ \t]*"-c"/
            $cron = "crontab "
            $shadow = "/etc/shadow"
            $key = "/root/.ssh/id_rsa"
          condition:
            all of them
        }
