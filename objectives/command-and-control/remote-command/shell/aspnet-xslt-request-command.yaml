defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: aspnet-xslt-request-command
    desc: ASP.NET XSLT reads cmd request input
    if:
      type: yara
      source: |
        rule aspnet_xslt_request_command {
          strings:
            $block = "<msxsl:script" ascii nocase
            $request = /Request\.Item\s*\[\s*['\"]cmd['\"]\s*\]/ nocase
            $shell = "WScript.Shell" ascii nocase
            $cmd = "cmd /c " ascii nocase
            $exec = ".Exec(" ascii nocase
            $output = ".StdOut" ascii nocase
            $transform = "XslCompiledTransform" ascii
          condition:
            all of them
        }
  - id: aspnet-xslt-script-execution-enabled
    desc: ASP.NET enables XSLT script execution
    if:
      type: text
      regex: '(?i)\.EnableScript\s*=\s*true\b'
composite_rules:
  - id: aspnet-xslt-request-command-shell
    desc: ASP.NET XSLT request-command shell clues
    crit: hostile
    attack: T1505.003,T1059.007
    all:
      - id: aspnet-xslt-request-command
      - id: aspnet-xslt-script-execution-enabled
