---
defaults:
  for:
  - so
  platforms:
  - linux
composite_rules:
- id: shared-object-socket-shell-apis
  desc: Shared library with socket and shell APIs
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/connect/attempt::connect
  - id: micro-behaviors/process/create/subprocess/reference::shell-execution-comp
  any:
  - id: micro-behaviors/communications/socket/bind/function::bind
  - id: micro-behaviors/communications/socket/accept::accept-sym
  - id: micro-behaviors/process/create/native-symbol::c-popen
  - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
- id: packed-shared-object-host-command-backdoor
  desc: Packed shared object exposes remote host shell
  crit: hostile
  conf: 0.98
  attack: T1059.004,T1095,T1082,T1027.002
  mbc: B0022
  all:
  - id: shared-object-socket-shell-apis
  - id: micro-behaviors/communications/socket/bind/function::bind
  - id: micro-behaviors/communications/socket/listen::listen
  - id: micro-behaviors/os/sysinfo/hostname/query::gethostname
  - id: micro-behaviors/os/env/read/current::native-getenv
  - id: objectives/anti-static/pack/detect::stripped-packed
