# Remote command loop in one ASP.NET page: text submitted through a server
# TextBox is run by cmd.exe /c, the child's stdout is redirected, and the
# page writes it back in the HTTP response -- a request-in, output-out
# operator shell.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1059.003

composite_rules:
  - id: aspnet-handler-cmd-stdout-response
    desc: Command handler captures stdout beside response writes
    crit: suspicious
    conf: 0.98
    near_bytes: 1536
    all:
      - id: objectives/command-and-control/backdoor/webshell/exec::aspnet-request-cmd-stdin-handler
      - id: micro-behaviors/process/io/stream::aspnet-process-output-read
      - id: micro-behaviors/communications/http/response::asp-response-write
