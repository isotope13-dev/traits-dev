defaults:
  platforms: [routeros, appliance, unix]
  for: [perl]
  attack: T1059.006

composite_rules:
  - id: objectives/command-and-control/remote-command/shell::perl-triggered-command-c2
    desc: Perl triggered command C2
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/api-path/route::perl-trigger-check-path
      - id: metadata/lang/source/naming/variable::perl-trigger-fired-marker
      - id: micro-behaviors/communications/http/url/api-path/route::perl-trigger-result-path
      - id: micro-behaviors/process/create/shell/substitution::perl-trigger-backtick-exec
