# CIL review: the received task Args reaches cmd.exe; its redirected output is
# uploaded. Match the shell, task and upload vocabulary in the current image's
# CLR heaps, never a library/resource or a campaign-specific namespace.
defaults:
  for: [pe, dll]
  platforms: [windows]
  conf: 0.98
traits:
  - id: managed-infection-task-command-output-references
    desc: Infection task-shell and upload references
    crit: suspicious
    attack: T1059.003
    if:
      type: yara
      source: |
        import "dotnet"
        rule managed_infection_task_command_output {
          strings:
            $m_task = "get_TaskName" ascii fullword
            $m_args = "get_Args" ascii fullword
            $m_proc = "ProcessStartInfo" ascii fullword
            $m_launch = "set_StartInfo" ascii fullword
            $m_upload = "UploadFileTaskAsync" ascii fullword
            $u_shell = "cmd.exe" wide fullword
            $u_output = "/c {0} > {1}" wide
            $u_infection = "INFECTIONTYPE" wide fullword
          condition:
            for all of ($m_*) : (
              for any s in dotnet.streams : (
                s.name == "#Strings" and
                $ in (s.offset..s.offset + s.size - 1)
              )
            ) and
            for all of ($u_*) : (
              for any s in dotnet.streams : (
                s.name == "#US" and
                $ in (s.offset..s.offset + s.size - 1)
              )
            )
        }
composite_rules:
  - id: managed-infection-task-command-output
    desc: Tasked implant uploads command output
    crit: hostile
    conf: 0.98
    all:
      - id: managed-infection-task-command-output-references
      - id: objectives/exfiltration/stealer/system-info/identity::managed-infection-domain-report-upload
