# Explicit transfers keep ciphertext (argument 2) separate from a remotely
# fetched key/IV (arguments 0/1). A fetch anywhere beside eval is insufficient.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.98
  attack: T1059.007

traits:
  - id: http-response-eval
    desc: Evaluates HTTP response content as code
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '^fetch$'
          through:
            - call: '\.(json|text|arrayBuffer)$'
              receiver: true
            - call: '^Buffer\.from$'
              arguments: [0]
            - call: '\.(subarray|slice)$'
              receiver: true
            - call: '(^|\.)subtle\.decrypt$'
              arguments: [2]
            - call: '^TextDecoder\.decode$'
              arguments: [0]

  - id: slack-history-response-eval
    desc: Evaluates Slack history response content
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '^fetch$'
          literal: '^https://slack\.com/api/conversations\.history\b'
          through:
            - call: '\.json$'
              receiver: true
            - call: '^Buffer\.from$'
              arguments: [0]
            - call: '\.(subarray|slice)$'
              receiver: true
            - call: '(^|\.)subtle\.decrypt$'
              arguments: [2]
            - call: '^TextDecoder\.decode$'
              arguments: [0]

composite_rules:
  - id: webcrypto-http-plaintext-eval
    desc: Evaluates HTTP-derived decrypted code
    # The two provenance queries must land at the same eval call. Without
    # this bound, two unrelated evaluations could supply the two origins.
    near_bytes: 1
    all:
      - id: http-response-eval
      - id: micro-behaviors/process/interpreter/eval/direct::decryption-derived-eval-argument

  - id: webcrypto-slack-plaintext-eval
    desc: Evaluates decrypted Slack history content
    near_bytes: 1
    all:
      - id: slack-history-response-eval
      - id: micro-behaviors/process/interpreter/eval/direct::decryption-derived-eval-argument

  - id: external-http-response-eval
    desc: Evaluates externally hosted HTTP content
    crit: suspicious
    conf: 0.95
    mbc: B0009.016
    near_bytes: 1400
    not:
    - substr: 'fromText eval for '
    - substr: 'dart2wasm'
    all:
    - id: micro-behaviors/communications/http/request/client::js-fetch-call
    - id: objectives/command-and-control/remote-command/dispatch::http-response-eval
    any:
    - id: micro-behaviors/communications/url/encoded::encoded-http-url
    - id: metadata/lang/encoding::js-dense-hex-escapes
    - id: micro-behaviors/communications/http/request/json::fetch-external-url
    - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
    - id: objectives/command-and-control/dropper/script-eval/remote-code::fetch-content-field-eval-loader
    - id: objectives/command-and-control/dropper/script-eval/remote-code::use-m-published-cdn-bootstrap
    - id: metadata/lang/source/syntax/call/relationship::preview-fetch-eval-context
    - id: well-known/tool/reverse-engineering/exiftool::webperl-emscripten-engine
    - id: well-known/lib/development/launch-editor::open-in-editor-client-request
    - id: metadata/file/extension/identity::dart-source-basename
    - id: micro-behaviors/communications/http/url/host::loopback-http-url-reference
    downgrade:
      any:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
