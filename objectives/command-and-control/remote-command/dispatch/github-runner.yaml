# Registering the victim's machine as a self-hosted CI runner.
#
# A self-hosted GitHub Actions runner is, by design, a machine that sits waiting
# for someone with repository access to send it work and then executes that work
# locally. Registered with a stolen token, it is a command-and-control channel
# built out of a supported feature: the operator dispatches a workflow, the
# victim's machine runs it, and the result comes back through GitHub. There is
# no implant to find, no listening port, and no unfamiliar destination in the
# traffic.
#
# It also survives the things that clean up malware. Removing the malicious
# package does not deregister the runner, and the runner reconnects on reboot
# because that is what a CI agent is supposed to do.
#
# The registration API alone is what a legitimate provisioning script calls, so
# the credential-harvesting leg supplies the intent: code that is sweeping the
# machine for developer secrets and registering a runner is not provisioning
# infrastructure, it is enrolling the host it just compromised.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001,T1543
  mbc: B0030

composite_rules:
  - id: harvested-token-registers-ci-runner
    desc: Registers a CI runner while harvesting secrets
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/exfiltration/stealer/credential/multi-source::node-dev-secret-regex-list
    any:
      - id: micro-behaviors/communications/http/services/github::github-repo-runner-registration-path
      - id: micro-behaviors/communications/http/services/github::github-org-runner-registration-path
      - id: micro-behaviors/communications/http/services/github::github-runner-registration-octokit-call
