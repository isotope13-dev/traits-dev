defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: socket-received-rwx-thread-loader
    desc: Socket loader receives native code for an RWX thread
    crit: hostile
    conf: 0.99
    attack: T1105,T1620
    # Request tokens identify a family, not the receive-and-execute behavior.
    # Keep GETSERVER in the Gh0st consumer so renamed protocols still match.
    all:
      - id: micro-behaviors/communications/socket/receive::x86-receive-buffer-append-loop
      - id: micro-behaviors/process/thread/create::x86-copied-rwx-buffer-thread
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-ordinal-api-set
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
