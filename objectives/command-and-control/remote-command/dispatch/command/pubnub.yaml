# Require subscription response -> process-command provenance. A PubNub URL
# beside an unrelated local subprocess is insufficient. Source-local may-flow
# does not prove runtime reachability or authentication/authorization policy.
defaults:
  platforms: [unix, windows]
  crit: hostile
  conf: 0.97
  attack: T1102

traits:
  - id: python-pubnub-response-command
    desc: PubNub response supplies process command
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(check_output|check_call|run|Popen)$'
      arg:
        index: 0
        from:
          call: '^((requests|httpx)\.get|urllib\.request\.urlopen)$'
          literal: '(?i)^https?://[a-z0-9.-]{1,80}\.pndsn\.com/(v2/)?subscribe/'
          through:
            - call: '\.(json|decode)$'
              receiver: true
            - call: '\.read$'
              receiver: true
            - call: '^json\.loads$'
              arguments: [0]

  - id: node-pubnub-response-shell-command
    desc: PubNub response supplies shell command
    for: [javascript, typescript]
    attack: T1102,T1059
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(execSync|exec)$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?child_process$'
      arg:
        index: 0
        from:
          call: '^(axios\.get|fetch)$'
          literal: '(?i)^https?://[a-z0-9.-]{1,80}\.pndsn\.com/(v2/)?subscribe/'
          through:
            - call: '\.json$'
              receiver: true
