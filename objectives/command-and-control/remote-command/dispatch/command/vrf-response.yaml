# One HTTPS response supplies command fields written to a script and launched
# by Windows Script Host. This is one-shot remote-command dispatch, not beaconing.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001

composite_rules:
  - id: https-json-response-command-launch
    desc: HTTPS response command launched by WScript
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: objectives/command-and-control/remote-command/tasking::json-response-command-fields
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/process/create/spawn::spawn-call
    scope: file
    near_bytes: 2048
