# GitHub-style HTML code views embed source as line strings instead of as a
# standalone PowerShell file. These composites require linked Twitter tasking
# plus either a persistence installer or a Meterpreter shell command.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1059.001

traits:
  - id: html-twitter-timeline-url
    desc: PowerShell references Twitter status timeline
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)api\.twitter\.com/1/statuses/user_timeline\.xml'

  - id: html-twitter-timeline-xml-download
    desc: PowerShell downloads status data as XML
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)\[xml\].{0,160}downloadString'

  - id: html-twitter-tweet-switch-dispatch
    desc: PowerShell dispatches tweet commands
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)Switch\s*\(\$BotCommand\).{0,500}!downexec'

  - id: html-twitter-tweet-field-parse
    desc: PowerShell parses latest tweet command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$LatestTweet\.split\(.{0,80}\$BotCommand'

  - id: html-twitter-persist-cache-drop
    desc: PowerShell downloads persistence script to cache
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'cache.db'

  - id: html-twitter-persist-startup-shortcut
    desc: PowerShell creates shortcut in Startup folder
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'StartUp.lnk'

  - id: html-twitter-meterpreter-reverse-shell
    desc: Meterpreter reverse HTTPS shell invocation
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)Invoke-Shellcode.{0,250}meterpreter/reverse_https'

composite_rules:
  - id: html-twitter-remote-command-backdoor
    desc: Twitter timeline controls remote PowerShell command and file tasks
    crit: hostile
    conf: 0.99
    attack: T1102.002,T1059.001
    near_bytes: 30000
    all:
      - id: html-twitter-timeline-url
      - id: html-twitter-timeline-xml-download
      - id: html-twitter-tweet-switch-dispatch
      - id: html-twitter-tweet-field-parse

  - id: html-twitter-persistent-command-backdoor
    desc: Twitter command bot installs downloaded Startup persistence shortcut
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1105,T1059.001
    near_bytes: 60000
    all:
      - id: html-twitter-timeline-url
      - id: html-twitter-timeline-xml-download
      - id: html-twitter-tweet-switch-dispatch
      - id: html-twitter-tweet-field-parse
      - id: html-twitter-persist-cache-drop
      - id: html-twitter-persist-startup-shortcut

  - id: html-twitter-meterpreter-shell
    desc: Twitter bot can activate a Meterpreter reverse shell
    crit: hostile
    conf: 0.98
    attack: T1102.002,T1059.001
    near_bytes: 60000
    all:
      - id: html-twitter-timeline-url
      - id: html-twitter-timeline-xml-download
      - id: html-twitter-tweet-switch-dispatch
      - id: html-twitter-tweet-field-parse
      - id: html-twitter-meterpreter-reverse-shell
