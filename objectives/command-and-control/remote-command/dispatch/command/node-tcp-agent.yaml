defaults:
  for: [javascript]
  platforms: [unix, windows]

traits:
  - id: node-exec-variable-argument
    desc: Calls exec with a variable command argument
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        kind: identifier

  # The write argument must stay inside one statement. Minified bundles place
  # unrelated stdout listeners after `write(e);`, which is not command output.
  - id: node-socket-returns-command-output
    desc: Write call argument includes stdout or stderr
    crit: notable
    if:
      type: text
      regex: '\.write\([^\n;]{0,100}(stdout|stderr)'

  - id: node-file-start-write-stream
    desc: Writes peer-supplied file content to disk
    crit: notable
    if:
      type: text
      regex: 'FILE_START:[\s\S]{0,240}createWriteStream\('

composite_rules:
  - id: node-exec-variable-command
    desc: Calls imported child_process exec with a variable command
    crit: notable
    attack: T1059.004
    scope: file
    all:
      - id: metadata/import/builtin::child-process-exec-destructure
      - id: node-exec-variable-argument

  - id: node-tcp-remote-command-agent
    desc: TCP peer commands execute locally and return output
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1095
    scope: file
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::node-bound-socket-connect
      - id: micro-behaviors/data/control-flow/event-callback::js-data-event-registration
      - id: node-exec-variable-command
      - id: node-socket-returns-command-output
    near_bytes: 2000

  - id: node-tcp-remote-file-writer
    desc: TCP command channel accepts files for local writes
    crit: hostile
    conf: 0.98
    attack: T1105
    scope: file
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::node-bound-socket-connect
      - id: micro-behaviors/data/control-flow/event-callback::js-data-event-registration
      - id: node-file-start-write-stream
    near_bytes: 1200
