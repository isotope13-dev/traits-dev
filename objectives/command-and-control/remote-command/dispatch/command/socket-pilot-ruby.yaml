# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - ruby
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.97
  attack: T1059
composite_rules:
- id: ruby-tcpsocket-open3-command-shell
  desc: Socket command loop via Open3
  near_lines: 30
  all:
  - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
  - id: micro-behaviors/process/create/shell/lang::ruby-open3-interpolated-command
  - id: micro-behaviors/communications/socket/receive::ruby-socket-gets
  - id: micro-behaviors/communications/socket/send/
