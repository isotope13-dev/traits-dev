defaults:
  for: [ruby]
  platforms: [unix, windows]
composite_rules:
- id: ruby-socket-open3-command-shell
  desc: Socket input executes with output returned
  crit: hostile
  conf: 0.99
  attack: T1059.004
  all:
  - id: micro-behaviors/process/create/shell/interpreter::ruby-stream-command-roundtrip
  any:
  - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
  - id: micro-behaviors/communications/socket/listen::ruby-tcp-server-loop-call
