defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-socket-popen-command-roundtrip
    desc: Socket commands run through popen and return
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (while condition: (assignment left: (identifier) @command
            right: (call receiver: (identifier) @socket method: (identifier) @gets))
          body: (do (_)*
            (if consequence: (then (_)* (if alternative: (elsif alternative: (else
              (call receiver: (constant) @io method: (identifier) @popen
                arguments: (argument_list (identifier) @executed (_))
                block: (block parameters: (block_parameters (identifier) @pipe)
                  body: (block_body (call receiver: (identifier) @reply method: (identifier) @print
                    arguments: (argument_list (binary left: (binary left: (binary
                      left: (call receiver: (identifier) @output method: (identifier) @read)))))))))))))))
          (#eq? @gets "gets") (#eq? @command @executed)
          (#eq? @io "IO") (#eq? @popen "popen")
          (#eq? @pipe @output) (#eq? @read "read")
          (#eq? @socket @reply) (#eq? @print "print"))
composite_rules:
  - id: ruby-tcp-popen-command-shell
    desc: TCP socket executes commands and returns output
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-socket-popen-command-roundtrip
      - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
