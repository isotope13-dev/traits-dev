defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  attack: T1105
  mbc: E1105
composite_rules:
  - id: jsonkeeper-hidden-powershell-loader
    desc: JSONKeeper command launches hidden PowerShell
    crit: hostile
    conf: 0.98
    attack: T1105, T1059.001, T1027
    mbc: B0030, B0009
    all:
      - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-b64-endpoint
      - id: micro-behaviors/data/collection/map::json-cmd-field-get
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: insecure-json-command-powershell
    desc: Insecure JSON command launches PowerShell
    crit: hostile
    conf: 0.98
    attack: T1105, T1059.001, T1553.004
    all:
      - id: micro-behaviors/communications/tls/verify/disable::tls-validation-fully-disabled
      - id: micro-behaviors/data/collection/map::json-cmd-field-get
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
  - id: disguised-checksum-json-command-loader
    desc: Disguised checksum function stages command
    crit: hostile
    conf: 0.97
    attack: T1105, T1059.001
    all:
      - id: metadata/lang/source/naming/function/cryptography::verify-checksum-integrity-function-name
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
      - id: micro-behaviors/data/parse/json::json-loads-call
      - id: micro-behaviors/data/collection/map::json-cmd-field-get
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
