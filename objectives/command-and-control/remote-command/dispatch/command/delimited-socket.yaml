# The wire format almost every hand-written RAT converges on: a command word,
# a delimiter, then the arguments, pushed straight into a socket send. There
# is no framing, no length prefix and no serialization library -- the operator
# console builds the line by concatenation and the implant splits it back
# apart on the other end.
#
# What identifies it is the shape of the send, not the vocabulary: a quoted
# command word joined to a separator variable and then to data. Ordinary
# network code sends a serialized object, a formatted request, or a single
# variable; it does not glue a verb to a delimiter at the call site.
defaults:
  platforms: [windows, unix]
  for: [vbs, csharp, source, scripts]
  attack: T1071
  mbc: B0030

traits:
  - id: delimiter-joined-command-send
    desc: Sends a delimiter-joined command word
    crit: suspicious
    conf: 0.9
    if:
      # `s.Send(sock, "savetextfile" & yy & path & yy & Text)` where `yy` is
      # the separator (commonly "||" or "|"). The verb is a literal, the
      # delimiter is a variable, and the payload follows.
      type: text
      regex: '(?i)\.Send\s*\([^)\n]{0,24},\s*"[a-z]{4,20}"\s*&\s*\w{1,10}\s*&'
