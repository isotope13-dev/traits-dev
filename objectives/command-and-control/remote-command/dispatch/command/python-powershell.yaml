defaults:
  for: [python]
  platforms: [windows]
composite_rules:
  - id: python-agent-powershell-tasking
    desc: Task-response agent invokes PowerShell scripts
    crit: hostile
    conf: 0.98
    attack: T1059.001
    all:
      - id: well-known/tool/offensive/powershell-empire::empire-agent-protocol
      - id: well-known/tool/offensive/powershell-empire::python-shell-response-packet
      - id: micro-behaviors/process/interpreter/eval/direct::python-created-powershell-script-invocation
