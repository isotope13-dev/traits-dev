# Compiled Go implants that expose command-shell, download, and upload
# modules and a recv-command loop — the remote-command surface, not a
# project path or family name.
# Generic received-task dispatch.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1059,T1071
  mbc: B0022

traits:
  - id: go-cmd-shell-mod
    desc: Go command-shell module
    crit: notable
    conf: 0.94
    if:
      type: hex
      offset_range: [0, null]
      pattern: 63 6d 64 53 68 65 6c 6c 4d 6f 64

  - id: go-download-mod
    desc: Go download command module
    crit: notable
    conf: 0.92
    if:
      type: hex
      offset_range: [0, null]
      pattern: 6d 61 69 6e 2e 64 6f 77 6e 6c 6f 61 64 4d 6f 64 00

  - id: go-upload-mod
    desc: Go upload command module
    crit: notable
    conf: 0.92
    if:
      type: hex
      offset_range: [0, null]
      pattern: 75 70 6c 6f 61 64 4d 6f 64

  - id: go-recv-command
    desc: Go recv-command dispatch loop
    crit: notable
    conf: 0.93
    if:
      type: hex
      offset_range: [0, null]
      pattern: 6d 61 69 6e 2e 72 65 63 76 43 6f 6d 6d 61 6e 64

  # Some Go operators use a custom QUIC control protocol instead of exposing
  # the usual main.recvCommand / cmdShellMod names. Keep the encrypted session,
  # operator file-transfer messages, and process capability as separate
  # evidence so ordinary QUIC clients do not inherit a hostile finding.
  - id: go-quic-pre-shared-key-exchange
    desc: Go QUIC control pre-shared key exchange
    crit: notable
    if:
      type: text
      substr: KeyExchangeWithPSK

composite_rules:
  - id: go-cmd-shell-download
    desc: Go implant shells and downloads
    crit: hostile
    conf: 0.97
    all:
      - id: go-cmd-shell-mod
      - id: go-download-mod

  - id: go-cmd-shell-recv
    desc: Go implant shells and receives commands
    crit: hostile
    conf: 0.97
    all:
      - id: go-cmd-shell-mod
      - id: go-recv-command

  - id: go-download-upload-mods
    desc: Go implant downloads and uploads
    crit: hostile
    conf: 0.96
    all:
      - id: go-download-mod
      - id: go-upload-mod

  - id: go-encrypted-quic-file-control-agent
    desc: Go encrypted QUIC agent combines file transfer and process execution
    crit: hostile
    conf: 0.98
    attack: T1090,T1071,T1059,T1105
    all:
      - id: micro-behaviors/communications/proxy/relay::go-encrypted-session-acceptor
      - id: go-quic-pre-shared-key-exchange
      - id: micro-behaviors/communications/proxy/relay::go-quic-relay-constructor
      - id: micro-behaviors/communications/proxy/relay::go-upload-request-packet
      - id: micro-behaviors/communications/proxy/relay::go-download-response-packet
      - id: micro-behaviors/communications/proxy/relay::go-listener-request-packet
      - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference
