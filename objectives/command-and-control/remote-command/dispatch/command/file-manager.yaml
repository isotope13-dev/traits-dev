defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1059
  mbc: B0011
traits:
  - id: shell-exited-message
    desc: Spawned shell exited diagnostic
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\[Shell exited\]|\[Failed to start shell\]'
composite_rules:
  - id: command-dispatcher-implant
    desc: Implant has multi-action C2 dispatcher
    crit: hostile
    conf: 0.95
    needs: 4
    any:
      - id: objectives/command-and-control/remote-command/dispatch/task-table::action-dispatch-invalid-action
      - id: objectives/command-and-control/remote-command/dispatch/task-table::action-dispatch-invalid-pid
      - id: micro-behaviors/data/control-flow/error-handling::invalid-port-diagnostic
      - id: objectives/command-and-control/remote-command/dispatch/task-table::action-dispatch-unknown-action
      - id: objectives/command-and-control/remote-command/dispatch/task-table::env-plugins-dispatch-method
      - id: objectives/command-and-control/remote-command/dispatch/task-table::envelope-plugin-event-extractor
      - id: objectives/command-and-control/remote-command/dispatch/task-table::envelope-plugin-id-extractor
      - id: objectives/command-and-control/remote-command/dispatch/task-table::envelope-plugin-payload-extractor
      - id: micro-behaviors/fs/file/attributes::file-size-limit-message
      - id: objectives/command-and-control/remote-command/dispatch/command::shell-exited-message
