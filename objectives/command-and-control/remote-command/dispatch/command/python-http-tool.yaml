defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006

traits:
  - id: privileged-tool-scope
    desc: Administrative scope for remote tools
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)(operator\.admin|x-openclaw-scopes).{0,300}(\bfs\b|\bruntime\b)'

  - id: openclaw-signed-device-connect
    desc: Gateway connect carries a signed device identity
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '"method":\s*"connect"[\s\S]{0,999}([\s\S]{0,201})?"device"[\s\S]{0,700}"signature"\s*:'

  - id: openclaw-operator-wildcard-capabilities
    desc: Gateway operator requests wildcard capabilities
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '"role":\s*"operator"[\s\S]{0,240}"caps":\s*\["\*"\]'

  - id: python-signs-canonical-payload
    desc: PEM-loaded key signs a canonical payload
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'load_pem_private_key\(private_key_pem[\s\S]{0,300}private_key_obj\.sign\(canonical_payload'

composite_rules:
  - id: python-privileged-remote-tool-control
    desc: Python remote tools with admin scope
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/httpx::httpx-async-client-post
      - id: micro-behaviors/data/llm/tool-call::tool-invocation-args-fields
      - id: privileged-tool-scope

  - id: python-signed-wildcard-gateway-registration
    desc: Embedded-key client requests wildcard gateway administration
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-body
      - id: python-signs-canonical-payload
      - id: openclaw-signed-device-connect
      - id: openclaw-operator-wildcard-capabilities
      - id: privileged-tool-scope
