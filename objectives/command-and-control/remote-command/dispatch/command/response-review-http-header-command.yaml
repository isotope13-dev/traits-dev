defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1027
  mbc: B0024,B0032
composite_rules:
  - id: javascript-remote-header-shell-execution
    desc: JavaScript executes shell command from HTTP response headers
    conf: 0.99
    scope: archive
    for: [tar, tgz, npm, javascript, typescript]
    near_bytes: 16384
    all:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/process/create/shell/variable-command::exec-sync-http-response-header-command
    any:
      - id: micro-behaviors/data/encode/char-code::js-modulo-charcode-mapping
      - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/communications/http/request/client::http-request
      - id: micro-behaviors/communications/http/request/client::https-request
    unless:
      - id: metadata/path/directory::test-directory-component
