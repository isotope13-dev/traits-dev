defaults:
  for: [python]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98
traits:
  - id: python-socket-fed-process-command
    desc: Socket input reaches process command argument
    if:
      type: symbol
      kind: call
      regex: '(^|\.)([Pp]open|run|(check_)?call|check_output)$'
      arg:
        index: 0
        kind: identifier
        from:
          call: '(^|\.)recv(from)?$'
          through:
            - call: '^json\.loads$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
  - id: python-socket-fed-command-expression
    desc: Socket-derived call supplies process command
    if:
      type: symbol
      kind: call
      regex: '(^|\.)([Pp]open|run|(check_)?call|check_output)$'
      arg:
        index: 0
        kind: call
        from:
          call: '(^|\.)recv(from)?$'
          through:
            - call: '^json\.loads$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
  # JSON decoding preserves the peer's control over argv, including indexed
  # fields. No identifier, endpoint, or task opcode is assumed.
  - id: python-socket-fed-json-command
    desc: Socket input supplies process argument
    attack: T1059.006
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call|check_call|check_output)$'
      arg:
        index: 0
        kind: expression
        from:
          call: '(^|\.)recv$'
          through:
            - call: '^json\.loads$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
composite_rules:
  - id: python-socket-fed-command-execution
    desc: Executes commands received through a socket
    any:
      - id: python-socket-fed-process-command
      - id: python-socket-fed-command-expression
      - id: python-socket-fed-json-command
      - id: recv-result-command-execution
