defaults:
  for: [python]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98
traits:
  - id: python-socket-fed-process-command
    desc: Socket input reaches process command argument
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.(Popen|run|(check_)?call|check_output)|os\.popen)$'
      arg:
        index: 0
        kind: identifier
        from:
          call: '(^|\.)recv(from)?$'
          through:
            - call: '^json\.loads$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
  - id: python-socket-fed-command-expression
    desc: Socket-derived call supplies process command
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.(Popen|run|(check_)?call|check_output)|os\.popen)$'
      arg:
        index: 0
        kind: call
        from:
          call: '(^|\.)recv(from)?$'
          through:
            - call: '^json\.loads$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
  # JSON decoding preserves the peer's control over argv, including indexed
  # fields. No identifier, endpoint, or task opcode is assumed.
  - id: python-socket-fed-json-command
    desc: Socket input supplies process argument
    attack: T1059.006
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|(check_)?call|check_output)$'
      arg:
        index: 0
        kind: expression
        from:
          call: '(^|\.)recv$'
          through:
            - call: '^json\.loads$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
  - id: python-socket-fed-bare-process-call
    desc: Socket input reaches unqualified run call
    crit: component
    if:
      type: symbol
      kind: call
      exact: run
      arg:
        index: 0
        from:
          call: '(^|\.)recv(from)?$'
          through:
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
composite_rules:
  - id: python-socket-fed-imported-subprocess-run
    desc: Socket input reaches imported subprocess.run
    all:
      - id: python-socket-fed-bare-process-call
      - id: metadata/import/python/subprocess/run::run
  - id: python-socket-fed-command-execution
    desc: Executes commands received through a socket
    any:
      - id: python-socket-fed-process-command
      - id: python-socket-fed-command-expression
      - id: python-socket-fed-json-command
      - id: python-socket-fed-imported-subprocess-run
      - id: recv-result-command-execution
