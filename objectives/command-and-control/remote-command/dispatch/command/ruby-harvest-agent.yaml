defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-harvest-agent-remote-command
    desc: Executes fetched C2 commands and beacons results
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule ruby_harvest_agent_remote_command {
          strings:
            $fetch = "C2.fetch_commands(session_id)"
            $execute = "PayloadRunner.execute_command(cmd_data['cmd'])"
            $result = "C2.beacon(session_id, result.to_json)"
            $harvest = "CredentialHarvester.collect_credentials"
            $send = "C2.exfiltrate(session_id, obfuscated)"
          condition:
            all of them and @fetch < @execute and @execute < @result
        }
