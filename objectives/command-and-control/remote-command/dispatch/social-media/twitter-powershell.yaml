defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-twitter-shell-tasking
    desc: Fetched Twitter timeline with shell task dispatch
    crit: hostile
    conf: 0.97
    attack: T1102.002,T1059.001
    all:
      - id: micro-behaviors/communications/http/services/twitter::timeline-api-url
      - id: micro-behaviors/data/parse/xml::powershell-downloaded-xml-cast
      - id: micro-behaviors/data/string/split::powershell-pipe-field-selector
      - id: 
          objectives/command-and-control/remote-command/dispatch/task-table::powershell-shell-download-upload-task-table
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
