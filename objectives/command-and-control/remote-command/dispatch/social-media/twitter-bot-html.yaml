defaults:
  platforms: [windows]
  for: [html]
  attack: T1059.001

traits:
  - id: html-twitter-tweet-switch-dispatch
    desc: Embedded PowerShell !downexec command dispatch
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)Switch\s*\(\s*\$[A-Za-z_]\w*\s*\).{0,500}!downexec'

  - id: html-twitter-meterpreter-reverse-shell
    desc: Embedded Meterpreter reverse HTTPS shell call
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)Invoke-Shellcode.{0,250}meterpreter/reverse_https'

composite_rules:
  - id: html-twitter-remote-command-backdoor
    desc: Embedded PowerShell Twitter command backdoor
    crit: hostile
    conf: 0.99
    attack: T1102.002,T1059.001
    near_bytes: 30000
    all:
      - id: micro-behaviors/communications/http/services/twitter::html-twitter-timeline-url
      - id: micro-behaviors/data/parse/xml::html-powershell-xml-download
      - id: objectives/command-and-control/remote-command/dispatch/social-media::html-twitter-tweet-switch-dispatch
      - id: micro-behaviors/data/string/split::html-powershell-string-split

  - id: html-twitter-meterpreter-shell
    desc: Embedded Twitter bot invokes Meterpreter shell
    crit: hostile
    conf: 0.98
    attack: T1102.002,T1059.001
    near_bytes: 60000
    all:
      - id: micro-behaviors/communications/http/services/twitter::html-twitter-timeline-url
      - id: micro-behaviors/data/parse/xml::html-powershell-xml-download
      - id: objectives/command-and-control/remote-command/dispatch/social-media::html-twitter-tweet-switch-dispatch
      - id: micro-behaviors/data/string/split::html-powershell-string-split
      - id: objectives/command-and-control/remote-command/dispatch/social-media::html-twitter-meterpreter-reverse-shell
