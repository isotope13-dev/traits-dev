defaults:
  platforms: [linux]
  for: [scripts, source]
  attack: T1059.004,T1564
composite_rules:
  - id: stun-concealed-command-channel
    desc: STUN-framed procfs-concealed command channel
    crit: hostile
    conf: 0.98
    scope: leaf
    near_lines: 40
    all:
      - id: procfs-concealed-command-channel
      - id: objectives/evasion/process/hidden/procfs::procfs-init-metadata-process-concealment
    any:
      - id: micro-behaviors/communications/proxy/turn::binding-request-header-pack
      - id: micro-behaviors/communications/proxy/turn::binding-request-byte-array

  - id: procfs-concealed-command-channel
    desc: Socket and shell beside init-metadata overlay
    crit: hostile
    conf: 0.98
    scope: leaf
    near_lines: 40
    all:
      - id: objectives/evasion/process/hidden/procfs::procfs-init-metadata-process-concealment
    any:
      - id: micro-behaviors/process/create/shell/command-mode::socket-receive-shell-cooccurrence
      - id: objectives/command-and-control/backdoor/shell/socket::received-buffer-system-call
