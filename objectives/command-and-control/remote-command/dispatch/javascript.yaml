# Generic received-task dispatch.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  attack: T1059.007
traits:
  - id: eval-response-data
    desc: eval() of response data property
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'eval\(\s*(resp(onse)?|reply|xhr|request)\.data\s*\)'
  - id: eval-http-response-data-bracket
    desc: eval() of bracketed response data
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: "eval(g['data']"
  - id: eval-object-body-property
    desc: eval() of object body property
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'eval\(\s*\w+\.body\s*\)'
composite_rules:
  - id: js-postmessage-data-eval-source
    desc: Message handler source string evaluates data
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: objectives/execution/interpreter/eval/remote::js-eval-data-property-source
    unless:
      - id: well-known/app/media/axma-story-maker/

  # AdFection-class browser stager: a WebSocket channel delivers base64
  # AES-CBC blobs, the handler decrypts them with the negotiated session key,
  # and the plaintext is compiled as a function expression and run, with the
  # encrypt helper and socket handed to it so results flow back. Channel,
  # receive, decrypt and compile are each required; the compile sink has
  # separate spellings for parsed scripts and inline HTML.
  - id: websocket-decrypted-task-compile
    desc: WebSocket tasks compile decrypted bytes in browser
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1059.007
    for: [javascript, typescript, html]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: micro-behaviors/crypto/symmetric/decrypt::webcrypto-decrypt-call-text
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
      - id: micro-behaviors/process/interpreter/eval/compile::html-new-function-constructor-text
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-textdecoder-argument

  - id: js-c2-response-eval
    desc: Remote code execution via eval of HTTP response (JS C2 callback)
    crit: hostile
    conf: 0.97
    # A callback names its server. Evaluating a script that the app's own
    # backend generates for a relative path (a form validator built at
    # `/vaspval/<form>.js`) names no remote host and is a plain eval hazard,
    # reported by the suspicious legs below.
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: eval-response-data
      - id: eval-http-response-data-bracket
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/

        - id: "metadata/file/naming::test-directory-component"
  - id: js-postmessage-body-eval
    desc: Executes code from a browser message body
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: eval-object-body-property
