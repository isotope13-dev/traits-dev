# PowerShell Empire agent receive loop. The deployed agent.ps1 decrypts staged
# tasking with its session key and dispatches the results (the encrypted task
# channel), and evaluates task data with Invoke-Expression (task evaluation).
# Both composites require the agent entrypoint so modules that merely reuse
# the packet helpers do not match. The channel composite needs no evaluation
# leg: reception alone establishes the C2 tasking loop.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: powershell-agent-encrypted-task-channel
    desc: Empire agent decrypts session tasks and dispatches results
    all:
      - id: well-known/tool/offensive/powershell-empire::powershell-agent-entrypoint
      - id: well-known/tool/offensive/powershell-empire::powershell-agent-task-dispatch
      - id: well-known/tool/offensive/powershell-empire::powershell-agent-session-decrypt
  - id: powershell-agent-task-evaluation
    desc: Empire agent evaluates received task expressions
    all:
      - id: well-known/tool/offensive/powershell-empire::powershell-agent-entrypoint
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
