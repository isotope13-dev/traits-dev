# Operator verb tables in botnet clients.
#
# A bot that takes orders over a socket carries the vocabulary as data: an
# array of literal command words the dispatcher strcmp's the inbound line
# against. Evooo1Bot's table is `!persist !reinstall !kill !exit !info
# !download !upload !shell !exec !stream !detach !bg !sniff !stopsniff !socks
# !socksauth !stopsocks !ssh !stopssh !enableautossh !disableautossh !attack
# !stopattack !cve !stopcve !cveall` — a sigil, a verb, and a `stop` twin for
# every long-running module.
#
# The vocabulary is the signature, not any single word. `!exec` alone is a
# string; `!socks` beside `!stopattack` beside `!sniff` is a remote-control
# surface for proxying, flooding and traffic capture, which is what the class
# of malware exists to sell. Grouped in threes so the lint's alternation cap
# holds and so a rebuild that renames one verb still trips the rest.
#
# The sigil is required: bare `attack`/`sniff`/`persist` are ordinary English
# and ordinary identifiers, and matching them unquoted would fire on any
# security tool, test suite or log line that names the behaviour.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, source, elf, go, rust, python, javascript]
  attack: T1059,T1071

traits:
  - id: bot-verb-proxy-group
    desc: Bot verbs for proxy control
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '"!(socks|socksauth|stopsocks)"'

  - id: bot-verb-attack-group
    desc: Bot verbs for flood control
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '"!(attack|stopattack|cveall)"'

  - id: bot-verb-capture-group
    desc: Bot verbs for capture and persistence
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '"!(sniff|stopsniff|persist)"'

  - id: bot-verb-exec-group
    desc: Bot verbs for remote execution
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '"!(shell|exec|reinstall)"'

composite_rules:
  - id: bot-operator-verb-table
    desc: Carries a botnet operator verb table
    crit: suspicious
    conf: 0.95
    any:
      - id: bot-verb-proxy-group
      - id: bot-verb-attack-group
      - id: bot-verb-capture-group
      - id: bot-verb-exec-group
    needs: 3

  # The verb table says what the operator can ask for; these legs say the
  # client is built to survive and to serve traffic. A relay listener or a
  # watchdog pin is ordinary in isolation — under a flood-and-proxy verb
  # vocabulary neither is.
  - id: relay-bot-command-core
    desc: Verb-table bot relays traffic and self-pins
    crit: hostile
    conf: 0.97
    attack: T1090,T1071,T1059
    all:
      - id: bot-operator-verb-table
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-relay-write-source
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-source-path
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    needs: 2
