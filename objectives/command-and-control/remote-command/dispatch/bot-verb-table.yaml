# Operator verb tables in botnet clients.
#
# A bot that takes orders over a socket carries the vocabulary as data: an
# array of literal command words the dispatcher strcmp's the inbound line
# against. Evooo1Bot's table is `!persist !reinstall !kill !exit !info
# !download !upload !shell !exec !stream !detach !bg !sniff !stopsniff !socks
# !socksauth !stopsocks !ssh !stopssh !enableautossh !disableautossh !attack
# !stopattack !cve !stopcve !cveall` — a sigil, a verb, and a `stop` twin for
# every long-running module.
#
# The vocabulary is the signature, not any single word. `!exec` alone is a
# string; `!socks` beside `!stopattack` beside `!sniff` is a remote-control
# surface for proxying, flooding and traffic capture, which is what the class
# of malware exists to sell. Grouped in threes so the lint's alternation cap
# holds and so a rebuild that renames one verb still trips the rest.
#
# The sigil is required: bare `attack`/`sniff`/`persist` are ordinary English
# and ordinary identifiers, and matching them unquoted would fire on any
# security tool, test suite or log line that names the behaviour.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, elf]
  attack: T1059,T1071

traits:
  - id: bot-verb-proxy-group
    desc: Sigil-prefixed bot proxy-control command token
    crit: component
    conf: 0.92
    for: [c, cpp]
    if:
      type: literal
      kind: string
      regex: '^!(socks|socksauth|stopsocks)$'

  - id: bot-verb-proxy-group-binary
    desc: Sigil-prefixed bot proxy-control command token
    crit: component
    conf: 0.92
    for: [elf]
    if:
      type: text
      regex: '^!(socks|socksauth|stopsocks)$'

  - id: bot-verb-attack-group
    desc: Sigil-prefixed bot attack-control command token
    crit: component
    conf: 0.92
    for: [c, cpp]
    if:
      type: literal
      kind: string
      regex: '^!(attack|stopattack|cveall)$'

  - id: bot-verb-attack-group-binary
    desc: Sigil-prefixed bot attack-control command token
    crit: component
    conf: 0.92
    for: [elf]
    if:
      type: text
      regex: '^!(attack|stopattack|cveall)$'

  - id: bot-verb-capture-group
    desc: Bot capture or persistence command token
    crit: component
    conf: 0.92
    for: [c, cpp]
    if:
      type: literal
      kind: string
      regex: '^!(sniff|stopsniff|persist)$'

  - id: bot-verb-capture-group-binary
    desc: Bot capture or persistence command token
    crit: component
    conf: 0.92
    for: [elf]
    if:
      type: text
      regex: '^!(sniff|stopsniff|persist)$'

  - id: bot-verb-exec-group
    desc: Sigil-prefixed bot execution command token
    crit: component
    conf: 0.92
    for: [c, cpp]
    if:
      type: literal
      kind: string
      regex: '^!(shell|exec|reinstall)$'

  - id: bot-verb-exec-group-binary
    desc: Sigil-prefixed bot execution command token
    crit: component
    conf: 0.92
    for: [elf]
    if:
      type: text
      regex: '^!(shell|exec|reinstall)$'

  - id: bot-verb-ssh-group
    desc: Sigil-prefixed bot SSH-control command token
    crit: component
    conf: 0.93
    for: [c, cpp]
    if:
      type: literal
      kind: string
      regex: '^!(ssh|stopssh|enableautossh|disableautossh)$'

  - id: bot-verb-ssh-group-binary
    desc: Sigil-prefixed bot SSH-control command token
    crit: component
    conf: 0.93
    for: [elf]
    if:
      type: text
      regex: '^!(ssh|stopssh|enableautossh|disableautossh)$'

composite_rules:
  - id: bot-operator-verb-table
    desc: Carries a botnet operator verb table
    crit: suspicious
    conf: 0.95
    all:
      # Vocabulary is data until code actually compares inbound commands.
      - id: micro-behaviors/data/string/library::c-string-comparison
    any:
      - id: bot-verb-proxy-group
      - id: bot-verb-proxy-group-binary
      - id: bot-verb-attack-group
      - id: bot-verb-attack-group-binary
      - id: bot-verb-capture-group
      - id: bot-verb-capture-group-binary
      - id: bot-verb-exec-group
      - id: bot-verb-exec-group-binary
      - id: bot-verb-ssh-group
      - id: bot-verb-ssh-group-binary
    needs: 3

  # The verb table says what the operator can ask for; these legs say the
  # client also implements the relay and reaches a host-control surface.
  - id: relay-bot-command-core
    desc: Bot dispatcher relays SOCKS with host access
    crit: hostile
    conf: 0.97
    attack: T1090,T1071,T1059
    all:
      - id: bot-operator-verb-table
      - id: micro-behaviors/communications/proxy/socks::socks5-stream-relay
    any:
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-source-path
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp

  # Some recovered or partially reconstructed sources retain the operator
  # vocabulary and a complete reverse-relay implementation but not the command
  # comparison routine. Do not call that a dispatcher; the combination is
  # nevertheless an implant control surface rather than an ordinary proxy.
  - id: relay-bot-capability-source
    for: [c]
    desc: Multi-role bot combines a reverse SOCKS relay with operator commands
    crit: hostile
    conf: 0.97
    attack: T1090,T1071,T1059
    all:
      - id: micro-behaviors/communications/proxy/relay::session-multiplexed-reverse-socks-relay
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-source-path
    any:
      - id: bot-verb-proxy-group
      - id: bot-verb-proxy-group-binary
      - id: bot-verb-attack-group
      - id: bot-verb-attack-group-binary
      - id: bot-verb-capture-group
      - id: bot-verb-capture-group-binary
      - id: bot-verb-exec-group
      - id: bot-verb-exec-group-binary
      - id: bot-verb-ssh-group
      - id: bot-verb-ssh-group-binary
    needs: 3
