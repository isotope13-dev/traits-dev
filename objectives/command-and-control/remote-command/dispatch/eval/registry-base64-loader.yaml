defaults:
  platforms: [windows]
  for: [reg]
  attack: T1027,T1059.001,T1112

traits:
  - id: registry-encoded-property-read
    desc: Registry contains encoded property reads
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: '(?i)Get-ItemProperty'
  - id: registry-encoded-base64-decode
    desc: Registry contains encoded Base64 decoding
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: '(?i)FromBase64String'
  - id: registry-encoded-regsvr-launch
    desc: Registry contains encoded regsvr32 reference
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: '(?i)regsvr32\.exe'
  - id: registry-encoded-script-eval
    desc: Registry contains encoded PowerShell evaluation
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\bIEX\s*\('

composite_rules:
  - id: registry-encoded-loader-and-command-eval
    desc: Registry encodes loader and command evaluation
    crit: hostile
    conf: 0.98
    all:
      - id: registry-encoded-property-read
      - id: registry-encoded-base64-decode
      - id: registry-encoded-regsvr-launch
      - id: registry-encoded-script-eval
