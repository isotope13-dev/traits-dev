defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105
  mbc: B0009.016
composite_rules:
- id: request-json-field-eval-loader
  desc: HTTP JSON response field executed with eval
  crit: hostile
  conf: 0.99
  attack: T1059.007
  all:
  - id: micro-behaviors/communications/http/request/client::request-import
  - id: objectives/execution/interpreter/eval/remote::request-json-parse-field-eval
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  any:
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-b64-endpoint
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-b64-endpoint-literal
  - id: micro-behaviors/communications/url/encoded::encoded-http-url
- id: axios-jsonkeeper-content-eval-loader
  desc: Axios JsonKeeper payload eval loader
  crit: hostile
  conf: 0.995
  attack: T1102.001,T1059.007
  all:
  - id: objectives/command-and-control/infrastructure/paste::jsonkeeper-endpoint
  - id: micro-behaviors/process/deploy/script-eval/network::eval-response-data-content
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  any:
  - id: micro-behaviors/communications/http/get::axios-require-get-call
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
- id: axios-jsonkeeper-profiled-eval-loader
  desc: JsonKeeper eval loader captures victim profile
  crit: hostile
  conf: 0.995
  attack: T1102.001,T1059.007,T1082
  all:
  - id: objectives/command-and-control/remote-command/dispatch/eval::axios-jsonkeeper-content-eval-loader
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
  - id: micro-behaviors/os/env/enumerate::js-process-env-spread
