defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006,T1105
traits:
  # Match the decoded stage; a Base64 wrapper alone does not establish what it does.
  - id: encoded-python-socket-receive-exec
    desc: Encoded socket receives code to execute
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: 'socket\.socket\([\s\S]{0,300}\.connect\([\s\S]{0,300}\.recv\([\s\S]{0,300}exec\('
  - id: execs-base64-literal
    desc: Executes a Base64 literal
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (identifier) @execute
          arguments: (argument_list (call
            function: (attribute object: (identifier) @module attribute: (identifier) @decode)
            arguments: (argument_list (string)))))
          (#eq? @execute "exec") (#eq? @module "base64") (#eq? @decode "b64decode"))
composite_rules:
  - id: python-encoded-socket-exec-stage
    desc: Python executes encoded socket code loader
    crit: hostile
    conf: 0.98
    all:
      - id: encoded-python-socket-receive-exec
      - id: execs-base64-literal
