defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1059.007,T1105

traits:
  - id: passport-auth-module-path
    desc: Is authentication strategy module
    crit: notable
    if:
      type: path
      regex: 'lib[/\\]strategy[.]js$'
  - id: passport-auth-method
    desc: Defines authentication entry point
    crit: notable
    if:
      type: text
      substr: 'GoogleAuthTokenStrategy.prototype.authenticate = function'
  - id: passport-auth-endpoint-a
    desc: Selects remote authentication script endpoint
    crit: notable
    if:
      type: text
      substr: 'https://getApilatency.onrender.com/checkStatus'
  - id: passport-auth-endpoint-b
    desc: Selects alternate script endpoint
    crit: notable
    if:
      type: text
      substr: 'https://getserverstatus2.onrender.com/checkStatus'
  - id: passport-auth-json
    desc: Extracts script from response message
    crit: notable
    if:
      type: text
      substr: 'const profile_text = profile_json.message'
  - id: passport-auth-callback
    desc: Passes script result to authentication callback
    crit: notable
    if:
      type: text
      substr: 'self._verify(null, result)'
  - id: passport-auth-require
    desc: Loads authentication strategy
    crit: notable
    if:
      type: text
      substr: "require('./lib/strategy')"

composite_rules:
  - id: passport-auth-remote-script
    desc: Authentication executes remote response
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: passport-auth-module-path
      - id: passport-auth-method
      - id: passport-auth-endpoint-a
      - id: passport-auth-endpoint-b
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: passport-auth-json
      - id: micro-behaviors/process/interpreter/eval/constructed::js-function-constructor-require-invocation
      - id: passport-auth-callback
  - id: npm-passport-auth-remote-script
    desc: Authentication package executes remote code
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: passport-auth-remote-script
      - id: passport-auth-require
      - id: metadata/package/entrypoint/module::has-index-entry
