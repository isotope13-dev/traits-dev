# Generic received-task dispatch.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  attack: T1059.007
traits:
  - id: eval-http-response-data-bracket
    desc: eval() of bracketed response data
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: "eval(g['data']"
  - id: eval-object-body-property
    desc: eval() of object body property
    crit: suspicious
    conf: 0.9
    # Security-regression fixture source demonstrates the vulnerable pattern;
    # it is not the package's own request handler.
    unless:
      - id: metadata/package/testing/presence/path::test-fixture-directory-path
    if:
      type: text
      regex: 'eval\(\s*\w+\.body\s*\)'
composite_rules:
  - id: js-postmessage-data-eval-source
    desc: Message handler source string evaluates data
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: objectives/execution/interpreter/eval/remote::js-eval-data-property-source
    unless:
      - id: well-known/app/media/axma-story-maker/

  # Require the analysis-probing encrypted compiler and a message-capable
  # WebSocket surface. This is a static conjunction, not a data-flow binding
  # between the particular receiver and compilation sink.
  - id: analysis-probed-websocket-script-compiler
    desc: Analysis-probing encrypted WebSocket compiler
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1059.007
    for: [javascript, typescript, html]
    all:
      - id: objectives/execution/payload/script-eval::analysis-probed-encrypted-script-compiler
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener

  - id: js-c2-response-eval
    desc: Remote code execution via eval of HTTP response (JS C2 callback)
    crit: hostile
    conf: 0.97
    # A callback names its server. Evaluating a script that the app's own
    # backend generates for a relative path (a form validator built at
    # `/vaspval/<form>.js`, or bundled polyfills) names no remote host and is a
    # plain eval hazard, reported by the suspicious legs below. Require the
    # remote URL, HTTP client call, and response eval within proximity.
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: metadata/lang/source/syntax/call/arguments::eval-response-named-data-argument
      - id: eval-http-response-data-bracket
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/

        - id: metadata/path::test-directory-component
  - id: js-postmessage-body-eval
    desc: Executes code from a browser message body
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: eval-object-body-property
