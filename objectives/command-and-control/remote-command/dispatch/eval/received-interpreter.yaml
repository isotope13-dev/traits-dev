# SHINYROAD exposes both shell commands and runtime interpreter extension.
# Match the value reaching each sink, rather than socket/eval co-occurrence.
# Ruby's flow projection uses bare method names; Python retains receivers.
# A received command alone can be authorized administration and stays suspicious.
defaults:
  for: [python, ruby]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98

traits:

  - id: python-recv-result-code-exec
    desc: Python executes code returned by recv
    for: [python]
    attack: T1059.006
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        from:
          call: '(^|\.)recv$'
          through:
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
            - call: '^base64\.b64decode$'
              arguments: [0]
            - call: '^zlib\.decompress$'
              arguments: [0]


composite_rules:
  - id: python-public-listener-recv-exec
    desc: Public listener executes received Python
    for: [python]
    crit: suspicious
    conf: 0.96
    attack: T1059.006,T1571
    all:
      - id: python-recv-result-code-exec
      - id: micro-behaviors/communications/socket/bind/address::python-bind-all-interfaces
      - id: micro-behaviors/communications/socket/listen::python-short-socket-listen-method
