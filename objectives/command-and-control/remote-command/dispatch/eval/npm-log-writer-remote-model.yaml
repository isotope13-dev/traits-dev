defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1059.007,T1105

traits:
  - id: log-writer-loader-path
    desc: Is private log writer helper
    crit: notable
    if:
      type: path
      regex: 'lib[/\\]private[/\\]prepare-writer[.]js$'
  - id: log-writer-fallback-endpoint
    desc: Contains remote model fallback endpoint
    crit: notable
    if:
      type: text
      substr: 'json-project-hazel.vercel.app'
  - id: log-writer-model-request
    desc: Retrieves remote model using Axios
    crit: notable
    if:
      type: text
      substr: 'await axios.get(url)'
  - id: log-writer-model-eval
    desc: Evaluates downloaded model
    crit: notable
    if:
      type: text
      substr: 'eval(response.data.model)'
  - id: log-writer-error-model-eval
    desc: Evaluates fallback error response model
    crit: notable
    if:
      type: text
      substr: 'eval(e.response.data.model)'
  - id: log-writer-export-loader
    desc: CommonJS export text begins with check
    crit: component
    attack: none
    if:
      type: text
      substr: 'module.exports = check'
  - id: log-writer-constructor-call
    desc: Log writer constructor invokes helper
    crit: notable
    if:
      type: text
      regex: 'constructor\(options\s*=\s*\{\}\)\s*\{\s*prepareWriter\(\)'

  - id: log-writer-encoded-endpoint
    desc: Contains encoded WireMock endpoint
    crit: notable
    if:
      type: text
      substr: '68747470733a2f2f6d3231676b2e776972656d6f636b6170692e636c6f75642f672f6170692f383830'
  - id: log-writer-cookie-eval
    desc: Evaluates fetched cookie property
    crit: notable
    if:
      type: text
      substr: 'eval(r.data.cookie)'
  - id: log-writer-encoded-export
    desc: CommonJS export text begins with writer
    crit: component
    attack: none
    if:
      type: text
      substr: 'module.exports = writer'

  - id: log-writer-encoded-post-endpoint
    desc: Contains encoded remote post endpoint
    crit: notable
    if:
      type: text
      substr: '687474703a2f2f66617368646566692e73746f72653a363136382f646566792f7637'
  - id: log-writer-encoded-post
    desc: Decodes Axios post method
    crit: notable
    if:
      type: text
      substr: "g('706f7374')"
  - id: log-writer-token-extract
    desc: Extracts token from error response
    crit: notable
    if:
      type: text
      substr: '{[hl[6]]:{[hl[7]]:{token}}}'
  - id: log-writer-token-eval
    desc: Evaluates token from error response
    crit: notable
    if:
      type: text
      substr: 'eval(token)'

composite_rules:
  - id: log-writer-remote-model-loader
    desc: Helper fetches and evaluates remote model
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: log-writer-loader-path
      - id: log-writer-fallback-endpoint
      - id: log-writer-model-request
      - id: log-writer-model-eval
      - id: log-writer-error-model-eval
      - id: log-writer-export-loader
  - id: npm-log-writer-remote-model-loader
    desc: Log writer evaluates remotely supplied code
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript]
    all:
      - id: log-writer-remote-model-loader
      - id: log-writer-constructor-call
  - id: log-writer-encoded-cookie-loader
    desc: Helper decodes endpoint and evaluates remote cookie
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: log-writer-loader-path
      - id: log-writer-encoded-endpoint
      - id: metadata/import/package::axios-module-hex-lookup
      - id: log-writer-cookie-eval
      - id: log-writer-encoded-export
  - id: npm-log-writer-encoded-cookie-loader
    desc: Log writer evaluates remotely supplied cookie
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript]
    all:
      - id: log-writer-encoded-cookie-loader
      - id: log-writer-constructor-call
  - id: log-writer-encoded-error-token-loader
    desc: Helper evaluates token from remote error response
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: log-writer-loader-path
      - id: metadata/import/package::axios-module-hex-lookup
      - id: log-writer-encoded-export
      - id: log-writer-encoded-post-endpoint
      - id: log-writer-encoded-post
      - id: log-writer-token-extract
      - id: log-writer-token-eval
  - id: npm-log-writer-encoded-error-token-loader
    desc: Log writer evaluates remote error token
    crit: hostile
    conf: 0.99
    scope: archive
    for: [zip, npm, javascript]
    all:
      - id: log-writer-encoded-error-token-loader
      - id: log-writer-constructor-call
