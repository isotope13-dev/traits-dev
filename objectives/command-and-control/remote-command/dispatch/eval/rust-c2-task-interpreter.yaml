defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1059,T1071

traits:
  - id: rust-c2-task-payload-select
    desc: Rust extracts interpreter payload from C2 task
    crit: notable
    if:
      type: text
      regex: '(?i)if\s+let\s+Some\s*\(\s*\w+\s*\)\s*=\s*task\.tome'
  - id: rust-c2-task-payload-interpret
    desc: Rust interprets task payload source
    crit: notable
    if:
      type: text
      regex: '\.interpret\s*\(\s*&\w+\.eldritch\s*\)'
  - id: rust-c2-report-task-output
    desc: Rust reports C2 task output through agent
    crit: notable
    if:
      type: text
      regex: '\bagent\.report_output\s*\(\s*ReportOutputRequest'

composite_rules:
  - id: rust-c2-task-interpreter-output
    desc: Rust interprets C2 task and reports output
    crit: hostile
    conf: 0.98
    all:
      - id: rust-c2-task-payload-select
      - id: rust-c2-task-payload-interpret
      - id: rust-c2-report-task-output
      - id: metadata/import/rust/pb/c2/task::pb/c2/task
