defaults:
  platforms: [windows, unix]
  for: [python, python-sdist]
  attack: T1195.002,T1059.006,T1105
composite_rules:
  - id: setup-base64-exec-with-socket-code-stage
    desc: Setup Base64 execution accompanies socket-fed interpreter code
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/process/interpreter/eval/python-builtins::python-module-level-base64-exec
      - id: objectives/command-and-control/remote-command/dispatch/eval::python-recv-result-code-exec

  - id: install-hook-executes-socket-received-code
    desc: Install hook executes code received over a connected socket
    crit: hostile
    conf: 0.98
    scope: package
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: micro-behaviors/communications/socket/connect/attempt::python-created-socket-connect
      - id: objectives/command-and-control/remote-command/dispatch/eval::python-recv-result-code-exec
