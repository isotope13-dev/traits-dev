# Distinct from wallet substitution: this proves a network-fed evaluation
# sink in a program whose independent behavior establishes hostile intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001

composite_rules:
  - id: wallet-substituter-http-code-execution
    desc: Wallet substituter executes HTTP-supplied code
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::similar-address-clipboard-hijacker
      - id: objectives/execution/payload/script-eval::http-response-eval
