defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: suspicious
  conf: 0.94
  attack: T1059.007
composite_rules:
- id: credential-harvester-with-signed-source-eval
  desc: Credential harvester combines eval and signed repository payload search
  all:
  - id: objectives/credential-access/credential-manager/secret-storage::obfuscated-multi-source-credential-harvester
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  any:
  - id: metadata/lang/encoding/base64::lower-first-base64-signed-commit-search-name
  - id: metadata/lang/encoding/base64::lower-first-base64-signed-gitlab-search-name
- id: runner-secret-scraper-with-signed-search-and-eval
  desc: Runner scraper combines signed search and eval
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
  - id: metadata/lang/source/naming/function::signed-repository-payload-search-name
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
