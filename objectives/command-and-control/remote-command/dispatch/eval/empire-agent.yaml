defaults:
  for: [python]
  platforms: [unix, windows]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: python-agent-code-tasking
    desc: Empire task agent compiles code and returns execution results
    all:
      - id: well-known/tool/offensive/powershell-empire::empire-agent-protocol
      - id: well-known/tool/offensive/powershell-empire::python-task-evaluation-diagnostic
      - id: micro-behaviors/metaprogramming/generation::compile-source-exec-mode
      - id: micro-behaviors/process/interpreter/eval/direct::exec-variable-namespace
