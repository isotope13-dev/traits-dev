defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: powershell-agent-task-evaluation
    desc: Empire agent decodes task packets and evaluates code
    all:
      - id: well-known/tool/offensive/powershell-empire::powershell-agent-entrypoint
      - id: well-known/tool/offensive/powershell-empire::powershell-task-packet-dispatch
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: well-known/tool/offensive/powershell-empire::powershell-task-decryption
