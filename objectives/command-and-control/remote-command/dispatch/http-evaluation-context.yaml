defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

composite_rules:
  # The module call need not invoke the evaluator. No package identity,
  # legitimate-library substitution, or startup-to-eval link is established.
  # Preserve the previous matcher as the co-occurrence it actually proves.
  - id: http-response-eval-with-module-call
    desc: Remote HTTP evaluation alongside module-scope call
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: external-http-response-eval
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call

  # Remote code evaluation, result upload and command dispatch establish a
  # reusable task channel. The two flow observations are same-file evidence;
  # they need not trace to the same evaluation or server response.
  - id: http-code-task-and-result-upload
    desc: HTTP code evaluation alongside result upload and command dispatch
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1071.001
    scope: file
    all:
      - id: http-response-eval
      - id: micro-behaviors/communications/http/request/body::fetch-eval-result-body
      - id: micro-behaviors/data/control-flow/dispatch::object-field-dispatch-switch
