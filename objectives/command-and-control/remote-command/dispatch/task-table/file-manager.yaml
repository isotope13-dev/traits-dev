defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1059
  mbc: B0011
traits:
  - id: action-dispatch-invalid-pid
    desc: Dispatcher rejects invalid PID arg
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\binvalid PID\b\s*:\s*%s'
  - id: action-dispatch-unknown-action
    desc: Dispatcher rejects unknown action ID
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\bunknown\s+(action\s+ID|hiding action|injection method)\b'
    unless:
      - id: well-known/app/infrastructure/terraform-provider/
      - id: well-known/app/infrastructure/terraform::terraform-core-binary
  - id: action-dispatch-invalid-action
    desc: Dispatcher rejects invalid named action
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\bInvalid (PAM|hiding|injection) (action|method)\b'
