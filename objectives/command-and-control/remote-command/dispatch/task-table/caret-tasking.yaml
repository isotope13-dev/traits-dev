defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  mbc: B0022

traits:
  - id: caret-job-report-format
    desc: Caret-delimited bot job report format
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'job^rev=%s^os=%s'
  - id: caret-confirm-report-format
    desc: Caret-delimited bot task confirmation format
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'confirm^rev=%s^code=%s'
  - id: caret-click-stats-report-format
    desc: Caret-delimited click statistics report
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'jstat^rev=%s^code=%s^site=%s^searches=%s^clicks=%s'
  - id: bot-command-grab-ftps
    desc: Bot command token for FTP credential grab
    crit: component
    conf: 0.85
    if:
      type: text
      word: GRABFTPS
  - id: bot-command-download-run
    desc: Bot command token for download and run
    crit: component
    conf: 0.85
    if:
      type: text
      word: DOWNRUN
  - id: bot-command-self-delete
    desc: Bot command token for client self-deletion
    crit: component
    conf: 0.85
    if:
      type: text
      word: CLIENTDEL
  - id: bot-command-cookie-reject
    desc: Bot command token for cookie rejection
    crit: component
    conf: 0.85
    if:
      type: text
      word: COOKREJCT

composite_rules:
  # The caret-delimited job/confirm reports are this bot family's wire
  # grammar, and the dispatcher compares the server reply against tasking
  # verbs that download and run files, delete the client, or grab stored
  # FTP credentials. A lone verb or report string is a fragment; the
  # report format plus the WinInet channel plus several verbs is tasking.
  - id: caret-delimited-http-bot-tasking
    desc: Caret-delimited HTTP bot tasking commands
    crit: hostile
    conf: 0.96
    all:
      - id: caret-job-report-format
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
    any:
      - id: bot-command-grab-ftps
      - id: bot-command-download-run
      - id: bot-command-self-delete
      - id: bot-command-cookie-reject
      - id: caret-confirm-report-format
    needs: 2
