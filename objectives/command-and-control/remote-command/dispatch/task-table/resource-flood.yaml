defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: resource-packet-tasked-flood-loader
    desc: Resource loader embeds packet dispatch and raw UDP flood code
    crit: hostile
    conf: 0.98
    attack: T1095,T1498.001
    # These are embedded code capabilities, not a successful load or session.
    all:
      - id: objectives/impact/dos/udp::native-resource-raw-udp-burst-flood
      - id: micro-behaviors/communications/socket/receive::x86-resource-recv-copied-record-dispatch
