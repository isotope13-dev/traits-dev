defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: suspicious
  conf: 0.94
composite_rules:
- id: credential-harvester-with-signed-source-eval
  desc: Credential harvester combines eval and signed repository payload search
  attack: T1059.007
  all:
  - id: objectives/credential-access/theft/multi-store::obfuscated-multi-source-credential-harvester
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  any:
  - id: metadata/lang/source/literal::lower-first-base64-signed-commit-search-name
  - id: metadata/lang/source/literal::lower-first-base64-signed-gitlab-search-name
