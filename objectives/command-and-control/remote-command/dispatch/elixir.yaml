defaults:
  for: [elixir]
  platforms: [linux, macos]
  attack: T1059
  mbc: B0011
traits: []
composite_rules:
  - id: elixir-gen-tcp-command-dispatch
    desc: Elixir dispatches socket commands and returns output
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::gen-tcp-connect
      - id: micro-behaviors/communications/socket/receive::gen-tcp-receive
      - id: micro-behaviors/process/create/shell/spawn::elixir-system-cmd-unix-shell
      - id: micro-behaviors/communications/socket/send::gen-tcp-send
      - id: micro-behaviors/process/create/shell/command-string::elixir-shell-command-argument
    near_lines: 30
    unless:
      - id: well-known/tool/detection/llm-scanner/
