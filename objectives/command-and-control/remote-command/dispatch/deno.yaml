# Generic received-task dispatch.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007
  mbc: B0022

composite_rules:
  - id: deno-http-command-endpoint
    desc: Deno HTTP command execution endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/server/listener::deno-serve-call
      - id: micro-behaviors/process/create/direct::deno-command-call
      - id: micro-behaviors/process/create/shell/interpreter::deno-cmd-shell-argument
    any:
      - id: micro-behaviors/communications/http/url/api-path::exec-path
      - id: micro-behaviors/data/serialize/json::json-stringify-command-field
  - id: deno-posts-command-tasking
    desc: Deno posts command tasking
    crit: suspicious
    conf: 0.92
    unless:
      - id: well-known/app/system/remotepower::documented-rmm-release-context
      - id: well-known/app/infrastructure/
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-command-field
    any:
      - id: micro-behaviors/communications/http/url/api-path::exec-path
      - id: micro-behaviors/os/registry/write::reg-add-run-command
  - id: websocket-tasking-with-hidden-autorun
    desc: WebSocket tasking with hidden autorun commands
    crit: hostile
    conf: 0.97
    unless:
      - id: well-known/app/infrastructure/
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
    all:
      - id: deno-posts-command-tasking
      - id: "micro-behaviors/communications/http/websocket::websocket"
      - id: micro-behaviors/process/create/hidden::conhost-headless
      - id: micro-behaviors/os/registry/write::reg-add-run-command
