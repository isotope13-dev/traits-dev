# Bundled Node extension decodes a hex-encoded HTTP response body and runs it
# through exec. Size-gated sibling of buffered-response-hex-shell-command: the
# tree-sitter form stops at 64 KiB, so these text signatures carry the same
# response-to-exec chain for larger bundles.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
- id: large-bundle-process-https-imports
  desc: Bundle imports HTTPS and child process
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    regex: 'require\(["\x27]child_process["\x27]\).{0,220}require\(["\x27]https["\x27]\)'
- id: large-bundle-node-child-process-import
  desc: Node child_process require text
  crit: component
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'require("node:child_process")'
- id: large-bundle-default-interop
  desc: Bundle uses default export interop
  crit: component
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'this.__importDefault||function(e){return e&&e.__esModule?e:{default:e}}'
- id: renamed-large-bundle-default-interop
  desc: Bundle uses renamed default interop
  crit: component
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'this.__importDefault||function(nodeA){return nodeA&&nodeA.__esModule?nodeA:{default:nodeA}}'
- id: large-bundle-hex-character-decoder
  desc: Converts parsed hex values to characters
  crit: component
  conf: 0.98
  for: [javascript]
  if:
    type: text
    regex: 'String\.fromCharCode\(parseInt\(\w+,\s*(16|0x10)\)'
- id: large-bundle-fixed-width-hex-loop
  desc: Decoder advances across hex pairs
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'for(let n=0;n<e.length;n+=2)'
- id: renamed-large-bundle-fixed-width-hex-loop
  desc: Renamed decoder advances across hex pairs
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'for(let bundleLoad=0;bundleLoad<nodeA.length;bundleLoad+=2)'
- id: large-bundle-response-data-chunk
  desc: HTTPS response appends received chunks
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'e.on("data",(e=>{t+=e}))'
- id: renamed-large-bundle-response-data-chunk
  desc: HTTPS response appends renamed chunks
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'nodeA.on("data",(nodeA=>{nodeB+=nodeA}))'
- id: large-bundle-json-response-buffer
  desc: HTTPS response parses its body buffer
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'e.on("end",(()=>{try{const e=JSON.parse(t);'
- id: renamed-large-bundle-json-response-buffer
  desc: HTTPS response parses renamed buffer
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: text
    substr: 'nodeA.on("end",(()=>{try{const nodeA=JSON.parse(nodeB);'
- id: large-bundle-version-hash-exec
  desc: Decoded response value reaches exec
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: text
    substr: 'version_hash,n=this.decode_hash(t);(0,h.exec)(n)'
- id: direct-large-bundle-version-hash-exec
  desc: Decoded response value reaches exec
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: text
    substr: 'version_hash,n=this.decode_hash(t);h.exec(n)'
- id: renamed-large-bundle-hex-exec
  desc: Renamed response value reaches exec
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: text
    substr: 'messageBlob,bundleLoad=this.readHexText(nodeB);(0,shellLibrary.exec)(bundleLoad)'
composite_rules:
- id: large-bundle-base-response-hash-shell-loader
  desc: Response body hex runs through exec
  crit: suspicious
  conf: 0.99
  scope: file
  all:
  - id: large-bundle-process-https-imports
  - id: large-bundle-default-interop
  - id: large-bundle-hex-character-decoder
  - id: large-bundle-fixed-width-hex-loop
  - id: large-bundle-response-data-chunk
  - id: large-bundle-json-response-buffer
  any:
  - id: large-bundle-version-hash-exec
  - id: direct-large-bundle-version-hash-exec
- id: large-bundle-node-response-hash-shell-loader
  desc: Node response body hex runs through exec
  crit: suspicious
  conf: 0.99
  scope: file
  all:
  - id: large-bundle-node-child-process-import
  - id: micro-behaviors/communications/http/module/load::node-https-require-text
  - id: large-bundle-default-interop
  - id: large-bundle-hex-character-decoder
  - id: large-bundle-fixed-width-hex-loop
  - id: large-bundle-response-data-chunk
  - id: large-bundle-json-response-buffer
  any:
  - id: large-bundle-version-hash-exec
- id: renamed-large-bundle-response-hash-shell-loader
  desc: Renamed response body hex runs through exec
  crit: suspicious
  conf: 0.99
  scope: file
  all:
  - id: large-bundle-process-https-imports
  - id: renamed-large-bundle-default-interop
  - id: large-bundle-hex-character-decoder
  - id: renamed-large-bundle-fixed-width-hex-loop
  - id: renamed-large-bundle-response-data-chunk
  - id: renamed-large-bundle-json-response-buffer
  - id: renamed-large-bundle-hex-exec
- id: large-bundle-response-hash-shell-loader
  desc: Bundle executes a decoded response hash
  crit: suspicious
  conf: 0.99
  scope: file
  any:
  - id: large-bundle-base-response-hash-shell-loader
  - id: large-bundle-node-response-hash-shell-loader
  - id: renamed-large-bundle-response-hash-shell-loader
