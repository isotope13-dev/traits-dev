# Unbundled Node source fetches an HTTPS response, parses its JSON body, decodes
# a hex-pair field to text and runs the result through child_process exec.
# Source-level sibling of the bundle form: webpack module structure is not
# required, so a plain updater or loader module carries the same chain.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
composite_rules:
  - id: source-hex-fetch-json-exec-loader
    desc: Fetched JSON hex field runs through child_process exec
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/request/client/call::https-request
      - id: micro-behaviors/data/parse/json::json-body-identifier-parse
      - id: micro-behaviors/data/decode/custom::js-hex-pair-fromcharcode-decoder
      - id: micro-behaviors/process/create/shell/variable-command::node-exec-command-variable
