defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Recovered handler: a received record's byte six selects DLL upload (0x88)
  # or EXE replacement (0x89). DLL bytes are written, LoadLibrary'd, and their
  # Load/Run/Stop/Unload exports invoked. Concealed upload/load replies and the
  # actual protocol branches distinguish this from an ordinary service client.
  - id: concealed-native-module-upload-dispatch
    desc: Concealed socket command handler accepts executable modules
    crit: hostile
    conf: 0.99
    attack: T1105,T1129
    all:
      - id: metadata/binary/instruction/sequence::x86-byte-six-88-record-branch
      - id: metadata/binary/instruction/sequence::x86-89-record-branch
      - id: objectives/anti-static/obfuscation/string/encoding::strided-complemented-module-status
      - id: micro-behaviors/communications/socket/init::winsock-client-ordinal-api-set
      - id: micro-behaviors/dylib/load/runtime::load-library-a
