# Recovered code syntax, not an English instruction. This is a suspicious
# read/decode/evaluate pattern; exact variable provenance is not established.
defaults:
  platforms: [windows, unix]
  for: [vbs, batch, powershell, javascript, python, typescript, csharp, html]
  attack: T1059.001
traits:
  - id: encoded-powershell-stream-command-eval
    desc: Encoded stream read-decode-evaluate pattern
    crit: suspicious
    conf: 0.93
    if:
      type: encoded
      regex: '(?is)\.Read\(.{0,180}GetString\(.{0,100}\b(iex|Invoke-Expression)\s+\$'
# No connection direction is inferred: this also admits bind-side variants.
# All roles are required, and nearby APIs alone without the evaluation pattern
# do not satisfy the rule. The findings describe static code patterns rather
# than proof that the carrier ran or that specific variables alias.
composite_rules:
  - id: encoded-powershell-tcp-command-dispatch
    desc: Encoded TCP read-evaluate-reply pattern
    crit: hostile
    for: [vbs, batch, powershell, javascript, python, typescript, csharp]
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/socket/tcp::decoded-tcpclient-type-reference
      - id: metadata/lang/source/syntax/command/invocation::encoded-command-line
      - id: encoded-powershell-stream-command-eval
      - id: micro-behaviors/process/io/stream::encoded-powershell-bytes-stream-write
