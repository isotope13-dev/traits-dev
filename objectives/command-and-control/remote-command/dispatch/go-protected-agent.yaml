# Received WebSocket messages reach a dispatcher alongside a live script
# execution handler. Both anti-debug and anti-VM calls distinguish the concealed
# control agent from ordinary WebSocket services and administration clients.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: anti-analysis-websocket-script-agent
    desc: Anti-analysis WebSocket agent dispatches script commands
    crit: hostile
    conf: 0.98
    attack: T1059,T1071.001,T1622
    all:
      - id: micro-behaviors/communications/websocket/receive::go-websocket-read-dispatch-calls
      - id: micro-behaviors/process/create/command-handler::go-script-handler-command-context-call
      - id: objectives/anti-analysis/debugger-detect/combined-checks::go-check-driver-calls-antidebug
      - id: objectives/anti-analysis/environment-detect/check::go-check-driver-calls-antivm
