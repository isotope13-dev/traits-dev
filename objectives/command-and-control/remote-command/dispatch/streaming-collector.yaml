defaults:
  platforms: [windows, unix]
  for: [crx, xpi, zip, javascript, typescript]
  attack: T1071.001,T1119

composite_rules:
  # Capability and intent context, not a claim of resolved runtime reachability.
  # Do not exempt an identity exporter solely for carrying a product marker.
  - id: deceptive-streaming-collector-harvest-dispatch
    desc: Deceptive identity/history collector dispatches account-harvesting commands
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: objectives/collection/activity/browser::deceptive-default-on-streaming-history-collector
      - id: micro-behaviors/data/control-flow/dispatch/selector::profile-history-device-operation-switch
      - id: micro-behaviors/communications/http/request/tasking::command-id-camel-object-property
