# Colon-prefixed implant command verbs (shell:/download:/exfil:/update:).
# These are protocol tokens parsed off an inbound tasking string, not English
# prose. A single verb is too common; the cluster is the remote-control surface.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go]
  attack: T1059,T1105
  mbc: B0025

traits:
  - id: prefix-verb-shell
    desc: "Parses a shell: command prefix"
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.(startswith|startsWith)\s*\(\s*["'']shell:["'']\s*\)'

  - id: prefix-verb-download
    desc: "Parses a download: command prefix"
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.(startswith|startsWith)\s*\(\s*["'']download:["'']\s*\)'

  - id: prefix-verb-exfil
    desc: "Parses an exfil: command prefix"
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.(startswith|startsWith)\s*\(\s*["'']exfil:["'']\s*\)'

  - id: prefix-verb-update
    desc: "Parses an update: command prefix"
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.(startswith|startsWith)\s*\(\s*["'']update:["'']\s*\)'

composite_rules:
  - id: prefix-colon-command-set
    desc: Colon-prefixed remote command verb set
    crit: suspicious
    conf: 0.96
    needs: 3
    any:
      - id: prefix-verb-shell
      - id: prefix-verb-download
      - id: prefix-verb-exfil
      - id: prefix-verb-update
