defaults:
  for: [lua]
  platforms: [linux, macos, windows]
  attack: T1059
traits: []
composite_rules:
  - id: lua-socket-command-dispatch
    desc: Lua executes socket-received commands and returns output
    crit: hostile
    conf: 0.99
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/socket/connect::lua-tcp-connect
      - id: micro-behaviors/communications/socket/receive::lua-socket-receive
      - id: micro-behaviors/process/create/shell/spawn::lua-io-popen
      - id: micro-behaviors/communications/socket/send::lua-socket-send
