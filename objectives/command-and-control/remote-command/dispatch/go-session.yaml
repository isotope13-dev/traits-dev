# Generic received-task dispatch.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: go-session-command-dispatch
    desc: Go session dispatches command execution
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/symbols/name::go-main-session-dispatch-symbol
      - id: metadata/binary/symbols/name::go-main-command-handler-symbol
  - id: go-smux-remote-command-agent
    desc: Go control stream dispatches server commands to system execution
    crit: hostile
    conf: 0.97
    all:
      - id: go-control-connection-handler
      - id: go-server-command-handler
      - id: go-system-command-executor
      - id: go-smux-stream-transport
traits:
  - id: go-control-connection-handler
    desc: Go control-connection handler
    crit: notable
    if:
      type: text
      exact: main.handleControlConnection
  - id: go-server-command-handler
    desc: Go server-command handler
    crit: notable
    if:
      type: text
      exact: main.handleServerCommand
  - id: go-system-command-executor
    desc: Go system-command execution routine
    crit: notable
    if:
      type: text
      exact: main.runSystemCommand
  - id: go-smux-stream-transport
    desc: Go binary embeds smux stream transport
    crit: notable
    if:
      type: text
      substr: vpncore/pkg/smux
