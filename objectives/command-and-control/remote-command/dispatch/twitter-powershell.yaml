# Require an actual shell/download/upload task table, fetched XML timeline
# parsing, and evaluation. A Twitter URL or a network client alone is neutral.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-shell-download-upload-task-table
    desc: Shell, download-execute and upload task table
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((switch_statement
          (switch_body (switch_clauses
            (switch_clause (switch_clause_condition) @run)
            (switch_clause (switch_clause_condition) @execute)
            (switch_clause (switch_clause_condition) @upload)))) @dispatch
        (#eq? @run "!run")
        (#eq? @execute "!downexec")
        (#eq? @upload "!upload"))
composite_rules:
  - id: powershell-twitter-shell-tasking
    desc: Twitter XML polling with shell task dispatch
    crit: hostile
    conf: 0.97
    attack: T1102.002,T1059.001
    all:
      - id: micro-behaviors/communications/http/services/twitter::timeline-api-url
      - id: micro-behaviors/data/parse/xml::powershell-downloaded-xml-cast
      - id: micro-behaviors/data/string/split::powershell-pipe-field-selector
      - id: powershell-shell-download-upload-task-table
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
