defaults:
  platforms: [windows, unix]
  for: [java, class]
  mbc: B0011
  attack: T1059
traits:
  - id: jsp-socket-exec-loop
    desc: Java dispatches socket input to exec
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: "(?s)new\\s+Socket.{0,240}in\\.read.{0,240}exec\\("
  - id: jsp-socket-whoami-banner
    desc: Java sends whoami over socket
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?s)getOutputStream.{0,160}exec\("whoami"\)
  - id: jsp-config-host-port-shell
    desc: Java shell endpoint from config
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?s)config\.properties.{0,240}getProperty\("host"\)
composite_rules:
  - id: jsp-socket-command-dispatch
    for: [java]
    desc: Java dispatches commands received over socket
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
      - id: jsp-socket-exec-loop
    any:
      - id: jsp-socket-whoami-banner
      - id: jsp-config-host-port-shell
