defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: socket-received-rwx-thread-loader
    desc: GETSERVER loader receives native code for an RWX thread
    crit: hostile
    conf: 0.99
    attack: T1105,T1620
    all:
      - id: micro-behaviors/communications/transfer::getserver-payload-request-token
      - id: micro-behaviors/communications/socket/receive::x86-receive-buffer-append-loop
      - id: micro-behaviors/process/create/thread::x86-copied-rwx-buffer-thread
      - id: micro-behaviors/communications/socket/init::winsock-client-ordinal-api-set
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/create/thread::create-thread
