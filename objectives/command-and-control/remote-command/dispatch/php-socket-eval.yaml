defaults:
  for: [php]
  platforms: [linux, macos, windows]
  attack: T1059.006
  mbc: E1059
composite_rules:
  - id: php-socket-eval-stage
    desc: PHP dispatches a socket-delivered eval stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/framing::network-order-length-unpack
      - id: micro-behaviors/data/buffer/transfer::php-buffer-read-until-length
      - id: micro-behaviors/process/interpreter/eval/direct::eval-variable-buffer
    any:
      - id: micro-behaviors/communications/socket/connect::php-stream-socket-client
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/communications/socket/connect::php-socket-connect
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/llm-scanner/
