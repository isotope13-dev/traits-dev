defaults:
  for: [python]
  platforms: [unix, windows]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: python-agent-code-tasking
    desc: Empire task agent compiles code and returns execution results
    all:
      - id: well-known/tool/offensive/powershell-empire::empire-agent-protocol
      - id: well-known/tool/offensive/powershell-empire::python-task-evaluation-diagnostic
      - id: micro-behaviors/process/interpreter/eval/compile::compile-source-exec-mode
      - id: micro-behaviors/process/interpreter/eval/direct::exec-variable-namespace
  - id: python-agent-shell-tasking
    desc: Empire task agent launches shells and packets command results
    all:
      - id: well-known/tool/offensive/powershell-empire::empire-agent-protocol
      - id: well-known/tool/offensive/powershell-empire::python-shell-response-packet
      - id: micro-behaviors/process/create/shell-subprocess::popen-shell-true
