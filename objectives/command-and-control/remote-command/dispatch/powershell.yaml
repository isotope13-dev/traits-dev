defaults:
  platforms: [windows]
  for: [powershell, scripts]
  attack: T1059.001
composite_rules:
  - id: powershell-tcpclient-command-dispatch
    desc: TCP endpoint with stream read-decode-evaluate pattern
    crit: hostile
    conf: 0.97
    for: [powershell, batch]
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/socket/connect::tcpclient-host-port-constructor
      - id: micro-behaviors/process/io/stream::powershell-tcpclient-stream
      - id: metadata/lang/source/syntax/call/relationship::powershell-getstring-before-eval-assignment
      - id: micro-behaviors/process/io/stream::powershell-buffer-stream-read
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/offensive/
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/app/ai/knowledge/farai-data::farai-data-repository
  - id: powershell-reflective-load-expression-dispatch
    desc: PowerShell reflectively loads assemblies and dispatches expressions
    crit: hostile
    conf: 0.98
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::ps-reflective-load
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/offensive/
