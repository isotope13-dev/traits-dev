defaults:
  platforms: [unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]
  attack: T1102

composite_rules:
  - id: netscaler-remote-command-token
    for: [shell, javascript, java, go, csharp, kotlin]
    desc: NetScaler remote command token
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/url/api-path::agent-api-path
    any:
      - id: micro-behaviors/communications/http/request/tasking::command-id-field-name

  - id: netscaler-agent-http-tasking
    for: [shell, javascript, java, go, csharp, kotlin]
    desc: NetScaler agent HTTP tasking
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/api-path::agent-register-path
      - id: micro-behaviors/communications/http/url/api-path::agent-beacon-path
    any:
      - id: micro-behaviors/communications/http/url/api-path::agent-task-result-path
      - id: netscaler-remote-command-token

  - id: netscaler-task-result-channel
    for: [shell, javascript, java, go, csharp, kotlin]
    desc: NetScaler task result channel
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/api-path::agent-task-result-path
      - id: netscaler-remote-command-token
