# WSH (JScript) command agent that relays through WinHttpRequest and a scratch
# output file: POST to a server, run the reply through a hidden cmd, read the
# redirected output file, delete it, and post it back. The shell never captures
# stdout itself, so the file round trip is the structural signature.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1071.001,T1059.003
  mbc: B0030

composite_rules:
  - id: wsh-winhttp-post-cmd-file-relay
    desc: WSH WinHTTP loop runs commands via output file
    crit: hostile
    conf: 0.92
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/process/create/shell/command-mode::wsh-hidden-cmd-run
      - id: micro-behaviors/fs/read/file/handle::open-text-file-read
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header

  - id: wsh-http-reply-hidden-powershell-dispatch
    desc: WSH HTTP reply drives hidden PowerShell and cmd
    crit: hostile
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/client/response-body::js-com-response-text-member
      - id: micro-behaviors/process/interpreter/wsh::wsh-process-method
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-ep-bypass-flags
