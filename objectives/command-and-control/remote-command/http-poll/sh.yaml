# HTTP-polled remote-command agent implemented in POSIX shell.
#
# The shell twin of the PowerShell rule beside it: a loop that curls a command
# from an HTTP endpoint, evaluates the fetched text (`eval "$cmd"`), and posts
# the output back with curl. The eval of a fetched value plus a POST that returns
# the result is the C2 round trip; a curl|sh install cradle fetches and runs but
# never uploads its output.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1071.001,T1059.004
  mbc: B0030

traits:
  # Bind both sides of the round trip inside one loop body. Whole-file curl,
  # eval and POST co-occurrence incorrectly convicted build helper libraries.
  - id: shell-curl-eval-result-roundtrip
    desc: Evaluates HTTP tasks and uploads shell results
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        ((do_group
          (variable_assignment name: (variable_name) @task
            value: (command_substitution
              (command name: (command_name (word) @fetch)
                argument: (word) @url)))
          (variable_assignment name: (variable_name) @result
            value: (command_substitution
              [
                (command name: (command_name (word) @eval)
                  argument: [
                    (string (simple_expansion (variable_name) @executed))
                    (string (expansion (variable_name) @executed))
                    (simple_expansion (variable_name) @executed)
                    (expansion (variable_name) @executed)
                  ])
                (redirected_statement body:
                  (command name: (command_name (word) @eval)
                    argument: [
                      (string (simple_expansion (variable_name) @executed))
                      (string (expansion (variable_name) @executed))
                      (simple_expansion (variable_name) @executed)
                      (expansion (variable_name) @executed)
                    ]))
              ]))
          (command name: (command_name (word) @upload)
            argument: (word) @dataflag
            . argument: [
              (string (simple_expansion (variable_name) @sent))
              (string (expansion (variable_name) @sent))
              (simple_expansion (variable_name) @sent)
              (expansion (variable_name) @sent)
            ])) @roundtrip
        (#eq? @fetch "curl")
        (#match? @url "^https?://")
        (#eq? @eval "eval")
        (#eq? @task @executed)
        (#eq? @upload "curl")
        (#match? @dataflag "^(-d|--data(-ascii|-raw|-binary|-urlencode)?)$")
        (#eq? @result @sent))

  # A fresh shell is equivalent to eval for a fetched command. Bind the
  # fetched variable to -c and its captured output to the uploaded body;
  # ordinary curl telemetry beside an unrelated shell must not satisfy this.
  - id: shell-curl-command-result-roundtrip
    desc: Executes HTTP shell tasks and uploads results
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        ((do_group
          (variable_assignment name: (variable_name) @task
            value: (command_substitution
              (command name: (command_name (word) @fetch)
                argument: (word) @url)))
          (variable_assignment name: (variable_name) @result
            value: (command_substitution
              [
                (command name: (command_name (word) @shell)
                  argument: (word) @mode
                  . argument: [
                    (string (simple_expansion (variable_name) @executed))
                    (string (expansion (variable_name) @executed))
                    (simple_expansion (variable_name) @executed)
                    (expansion (variable_name) @executed)
                  ])
                (redirected_statement body:
                  (command name: (command_name (word) @shell)
                    argument: (word) @mode
                    . argument: [
                      (string (simple_expansion (variable_name) @executed))
                      (string (expansion (variable_name) @executed))
                      (simple_expansion (variable_name) @executed)
                      (expansion (variable_name) @executed)
                    ]))
              ]))
          (command name: (command_name (word) @upload)
            argument: (word) @dataflag
            . argument: [
              (string (simple_expansion (variable_name) @sent))
              (string (expansion (variable_name) @sent))
              (simple_expansion (variable_name) @sent)
              (expansion (variable_name) @sent)
            ])) @roundtrip
        (#eq? @fetch "curl")
        (#match? @url "^https?://")
        (#match? @shell "^(/(usr/)?bin/)?(sh|bash|dash|ksh|zsh)$")
        (#eq? @mode "-c")
        (#eq? @task @executed)
        (#eq? @upload "curl")
        (#match? @dataflag "^(-d|--data(-ascii|-raw|-binary|-urlencode)?)$")
        (#eq? @result @sent))

composite_rules:
  - id: shell-http-poll-command-shell
    desc: HTTP-polled shell task agent
    crit: hostile
    conf: 0.95
    near_lines: 40
    all:
      # Fetch a command over HTTP.
      - id: micro-behaviors/communications/http/curl::curl-command-call
    any:
      # Both structured round trips require dispatch inside the loop body and
      # upload of the captured result as the curl request body (-d/--data* is
      # itself a POST; a literal -X POST spelling is not required).
      - id: shell-curl-eval-result-roundtrip
      - id: shell-curl-command-result-roundtrip
