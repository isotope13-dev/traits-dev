defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.007,T1071.001

composite_rules:
  - id: https-json-cmd-exec-agent
    desc: HTTPS polling and cmd-member execution
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/profile/operation-reference::js-cmd-member-exec-call
      - id: micro-behaviors/data/parse/json::json-parse-call
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/time/schedule/interval::setInterval-reference
    any:
      - id: micro-behaviors/process/lifecycle/error::process-on-uncaught-exception
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
    scope: file
    near_lines: 120

  - id: node-c2-beacon-command-exec
    desc: Node C2 agent polls beacon and executes commands
    crit: hostile
    conf: 0.98
    mbc: B0030
    # One agent loop, not bundle-level co-occurrence: polling, decryption,
    # and execution must share a compact region, matching the sibling
    # https-json-cmd-exec-agent above. A multi-megabyte bundle trivially
    # contains all five capabilities in unrelated features.
    all:
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/process/create/shell/variable-command::execSync-dynamic-command
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
    any:
      - id: micro-behaviors/time/schedule/timeout::repeated-settimeout
      - id: micro-behaviors/time/schedule/interval::setInterval-reference
    near_lines: 120
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: well-known/app/development/cloudflare::cli-context

      - id: metadata/path/directory::test-directory-component
