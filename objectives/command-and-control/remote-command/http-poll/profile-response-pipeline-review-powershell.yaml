defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: ps-http-command-property-clues
    desc: PowerShell HTTP request and task-property references
    crit: suspicious
    conf: 0.96
    unless:
  # Ansible modules return a result object whose fields are named for the
  # module's own parameters, so `$result.command` next to the Invoke-WebRequest
  # a win_get_url/win_package module makes is the module reporting itself.
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
    any:
      - id: metadata/lang/source/naming/variable::ps-response-command-field
      - id: metadata/lang/source/naming/variable::ps-response-task-field
      - id: metadata/lang/source/naming/variable::ps-task-command-field
      - id: metadata/lang/source/naming/variable::ps-task-script-field
