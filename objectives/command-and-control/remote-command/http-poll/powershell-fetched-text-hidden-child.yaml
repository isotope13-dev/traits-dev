# Polling loop hands fetched text to a hidden policy-bypass PowerShell child.
# Unlike the HTTP-poll shells next door, nothing is evaluated in-process: the
# remote text becomes the -Command of a new hidden process. Binding the argument
# to a bare variable keeps a fixed, literal child command from matching.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1071.001,T1059.001
  mbc: B0030

traits:
  - id: start-process-powershell-command-variable
    desc: Start-Process passes a variable as -Command
    # Elevated setup helpers also pass a constructed -Command variable;
    # the hostile rule below requires loop, HTTP fetch, hidden window, and bypass.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Start-Process\s+powershell[^\n]{0,80}-(Command|c)\s+\$\w+'

composite_rules:
  - id: powershell-poll-fetched-text-hidden-child-command
    desc: Loop runs fetched text in hidden bypass PowerShell
    crit: hostile
    conf: 0.9
    near_lines: 20
    all:
      - id: start-process-powershell-command-variable
      - id: micro-behaviors/data/control-flow/loop/unconditional::powershell-unconditional-loop
      - id: micro-behaviors/communications/http/client/response-body::powershell-http-response-retrieval
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
