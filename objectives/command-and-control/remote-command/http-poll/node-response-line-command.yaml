defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001,T1102.001
  mbc: B0030

composite_rules:
  - id: node-evented-http-response-command-poll
    desc: HTTP response polling dispatches a shell command
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
      - id: micro-behaviors/data/collection/array::js-array-length-minus-one-index
      - id: metadata/lang/source/syntax/call/invocation::node-exec-command-variable-call
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
      - id: micro-behaviors/time/schedule/timeout::named-callback-timer
    near_lines: 120
    unless:
      - id: metadata/path/directory::test-directory-component
