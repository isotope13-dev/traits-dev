# Protocol plus execution support: no family, C2 host, or build-path gate.
# Static co-occurrence does not alone prove unauthorized operation.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-agent-shell-command-protocol
    desc: Go agent command protocol with shell handler
    crit: suspicious
    conf: 0.97
    attack: T1059.003,T1071.001
    all:
      - id: micro-behaviors/communications/http/url/api-path/agent::agent-command-query-path
      - id: micro-behaviors/communications/http/url/api-path/agent::agent-response-path
      - id: metadata/lang/source/naming/declaration::go-shell-exec-handler-name
      - id: micro-behaviors/process/create/runtime-symbol::go-native-exec-command-reference
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
