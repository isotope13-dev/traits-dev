# Bind the GET result to the evaluator inside the same unbounded loop.
# Detachment supplies the unattended command-agent context in the composite.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1071.001

traits:
  - id: python-polled-response-direct-executor
    desc: Polled HTTP response text enters Python exec
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((while_statement
          condition: (true)
          body: (block
            (expression_statement (assignment
              left: (identifier) @received
              right: (attribute
                object: (call function: (attribute
                  object: (identifier) @client
                  attribute: (identifier) @get))
                attribute: (identifier) @text)))
            (expression_statement (call
              function: (identifier) @exec
              arguments: (argument_list . (identifier) @executed))))) @poll
          (#match? @client "^(requests|httpx)$")
          (#eq? @get "get")
          (#eq? @text "text")
          (#eq? @exec "exec")
          (#eq? @received @executed))
    unless:
      - type: path
        regex: '##plain@0x[0-9a-f]+$'

composite_rules:
  - id: python-polled-direct-code-daemon
    desc: Detached daemon executes polled Python text
    crit: hostile
    conf: 0.99
    all:
      - id: python-polled-response-direct-executor
      - id: micro-behaviors/process/daemonize/detach::python-fork-new-session
