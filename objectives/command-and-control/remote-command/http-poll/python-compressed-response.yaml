defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: python-compressed-response-daemon
    desc: Background HTTP loop executes compressed response text
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1059.006
    near_lines: 16
    all:
      - id: micro-behaviors/process/deploy/script-eval/transformed::python-compiled-compressed-response-text
      - id: micro-behaviors/communications/http/request/verb::python-source-http-get
      - id: micro-behaviors/process/thread/create::python-source-daemon-start
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unconditional-while-header
