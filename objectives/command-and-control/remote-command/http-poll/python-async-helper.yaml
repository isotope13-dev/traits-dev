# Bind HTTP response -> compiled evaluator -> step -> unbounded asyncio loop.
# Callback provenance is opaque, so require equality across the syntax tree.
# Renamable endpoints, helpers, lock names and polling intervals are not gates.
defaults:
  platforms: [linux, macos]
  for: [python]
  attack: T1071.001,T1059.006
traits:
  - id: python-async-helper-compiled-exec-poll
    desc: Async loop executes compiled HTTP bodies
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @fetch
            parameters: (parameters . (identifier) @url .)
            body: (block . (return_statement
              (attribute
                object: (parenthesized_expression (await (call
                  function: (attribute object: (identifier) @asyncio
                    attribute: (identifier) @thread)
                  arguments: (argument_list
                    . (attribute object: (identifier) @client
                        attribute: (identifier) @get)
                    . (identifier) @requested))))
                attribute: (identifier) @body)) .))
          (function_definition
            name: (identifier) @executor
            parameters: (parameters . (identifier) @parameter .)
            body: (block . (expression_statement (call
              function: (identifier) @exec
              arguments: (argument_list . (call
                function: (identifier) @compile
                arguments: (argument_list
                  . (identifier) @compiled . (string) . (string) @mode))))) .))
          (function_definition
            name: (identifier) @step
            body: (block
              (expression_statement (assignment
                left: (identifier) @received
                right: (await (call function: (identifier) @fetch_call))))
              . (expression_statement (await (call
                function: (identifier) @exec_call
                arguments: (argument_list . (identifier) @submitted .))))))
          (function_definition body: (block
            (try_statement body: (block
            (while_statement condition: (true) body: (block
              (try_statement body: (block
                (expression_statement (call
                  function: (attribute object: (identifier) @poll_asyncio
                    attribute: (identifier) @run)
                  arguments: (argument_list . (call
                    function: (identifier) @step_call)))))))))))))
          (#eq? @asyncio "asyncio")
          (#eq? @thread "to_thread")
          (#match? @client "^(requests|httpx)$")
          (#eq? @get "get")
          (#eq? @body "text")
          (#eq? @url @requested)
          (#eq? @exec "exec")
          (#eq? @compile "compile")
          (#match? @mode "^['\"]exec['\"]$")
          (#eq? @parameter @compiled)
          (#eq? @fetch @fetch_call)
          (#eq? @executor @exec_call)
          (#eq? @received @submitted)
          (#eq? @poll_asyncio "asyncio")
          (#eq? @run "run")
          (#eq? @step @step_call))
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source

composite_rules:
  - id: python-detached-async-helper-exec-poll
    desc: Detached daemon executes HTTP helper bodies
    crit: hostile
    conf: 0.99
    all:
      - id: python-async-helper-compiled-exec-poll
      - id: micro-behaviors/process/create/fork::python-os-fork-call
      - id: micro-behaviors/process/daemonize/detach::python-setsid
      - id: micro-behaviors/process/fd/dup::python-dup2
