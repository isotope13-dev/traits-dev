defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
  conf: 0.96
  attack: T1071.001
composite_rules:
- id: go-http-polled-command-agent
  desc: Go HTTP task/result and command-exec surface
  all:
  - id: metadata/binary/symbols/name/qualified::go-task-execution-result-routine-names
  - id: micro-behaviors/communications/http/get::go-native-http-get-reference
  - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
  - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
  - id: micro-behaviors/communications/ip/literal::http-ip-url-text
