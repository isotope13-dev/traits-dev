# HTTP-polling command channel in JavaScript. GET retrieves the command,
# shell execution dispatches it, and POST returns the concrete result object;
# this is remote-command polling rather than a persistent reverse shell.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: js-http-backdoor
    desc: Remote shell backdoor (Poll C2
    crit: suspicious
    conf: 0.98
    attack: "T1059.003"
    all:
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/process/fd/stdio::js-command-output-result-object
    unless:
      - id: well-known/app/ai/coding-agent/ozaiya::benign-application-context
