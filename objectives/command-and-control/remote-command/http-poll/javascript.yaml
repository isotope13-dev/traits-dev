# HTTP-poll remote-command patterns. Keep attack claims tied to code that
# actually binds remote task data to command execution; generic polling,
# process creation and JSON transport can also implement benign agents.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: electron-periodic-http-eval-child
    desc: Electron HTTP polling with eval and Node child execution
    crit: hostile
    conf: 0.96
    attack: T1102.001,T1059.007,T1105
    mbc: B0022
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/create/indirect::bundler-aliased-spawn-call
      - id: micro-behaviors/os/env/modify::electron-run-as-node-env-injection

  - id: js-http-backdoor
    desc: Remote shell backdoor (HTTP poll C2)
    crit: suspicious
    conf: 0.98
    attack: "T1059.003"
    all:
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/process/fd/stdio::js-command-output-result-object
    # The four legs must form one local poll loop. A large application whose
    # API client, media pipeline (ffmpeg via execSync), and result reporting
    # merely coexist in one bundle pools the same legs without any command
    # channel; worked example: rimuru-md 3.3.0
    # src/lib/rimuru-import/Rimuru-legacy-engine.js.
    near_bytes: 4000
    unless:
      - id: well-known/app/ai/coding-agent/ozaiya::benign-application-context
      - id: well-known/app/ai/tool-server/happy-cli::benign-application-context
      # Thalamus is a published remote client for Claude Code sessions: the
      # polled shell/file RPC handlers are its documented remote-control
      # feature, not a backdoor.
      - id: well-known/app/ai/tool-server/thalamus::benign-application-context
