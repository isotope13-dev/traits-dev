# Android Python uses Linux; the engine rejects Android-only Python scope.
defaults:
  for:
  - python
  platforms:
  - linux
  - android
composite_rules:
- id: python-telegram-auth-keyed-tasking
  desc: HTTP command/key dispatch accompanies Telegram auth collection
  crit: hostile
  conf: 0.97
  attack: T1071.001,T1555
  all:
  - id: objectives/credential-access/messaging::python-telegram-android-auth-archive
  - id: micro-behaviors/data/control-flow/dispatch/selector::python-command-key-dispatch
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
  - id: micro-behaviors/data/parse/json::json-loads-call
  - id: micro-behaviors/process/thread/create::python-daemon-thread
