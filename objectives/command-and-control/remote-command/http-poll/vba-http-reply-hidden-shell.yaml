# VBA macro beacon: POST to an HTTP server, take the reply as a command, and run
# it through a hidden shell. Document macros rarely need both an HTTP client
# and a hidden command launch driven by the response.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1071.001,T1059.005
  mbc: B0030

composite_rules:
  - id: vba-http-reply-hidden-shell-exec
    desc: VBA macro runs HTTP reply in a hidden shell
    crit: hostile
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: micro-behaviors/communications/http/client/response-body::vbs-response-text-assignment
      - id: objectives/execution/interpreter/document/macro::vba-hidden-window-shell
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
