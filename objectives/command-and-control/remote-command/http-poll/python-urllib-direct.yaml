defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001,T1059.006
traits:
  - id: python-urllib-direct-compiled-exec-poll
    desc: Loop compiles and executes urllib response bytes
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((while_statement condition: (true) body: (block
          (try_statement body: (block
            (expression_statement (assignment left: (identifier) @source
              right: (call function: (attribute object: (call
                function: (attribute) @urlopen
                arguments: (argument_list . (string) @url))
                attribute: (identifier) @read))))
            . (expression_statement (call function: (identifier) @exec
              arguments: (argument_list . (call function: (identifier) @compile
                arguments: (argument_list . (identifier) @compiled
                  (string) (string) @mode .)))))))))
          (#eq? @urlopen "urllib.request.urlopen") (#eq? @read "read")
          (#match? @url "^['\"]https?://")
          (#eq? @source @compiled)
          (#eq? @exec "exec") (#eq? @compile "compile")
          (#match? @mode "^['\"]exec['\"]$"))
