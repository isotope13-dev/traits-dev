# Ruby agent fetches JSON tasking over HTTPS with certificate checks turned
# off and runs the command field of each task.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1071.001,T1059

composite_rules:
  - id: ruby-unverified-https-task-command-exec
    desc: Runs commands from unverified HTTPS tasking
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/variable::ruby-command-from-record-field
      - id: micro-behaviors/data/parse/json::ruby-json-parse-call
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
    any:
      - id: micro-behaviors/communications/http/lib/netlib::ruby-net-http-get-request-object
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
