defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: shell-command-missing-argument
    desc: Shell command handler argument error
    if:
      type: text
      substr: 'shell: missing command'

  - id: command-fetch-failure
    desc: Remote command fetch failure message
    if:
      type: text
      substr: 'Failed to fetch commands:'

composite_rules:
  - id: native-polling-shell-agent
    desc: Native agent polls commands and reports shell results
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1059
    all:
      - id: objectives/command-and-control/backdoor/rat/tasking::polling-command-path
      - id: objectives/command-and-control/backdoor/rat/tasking::polling-result-path
      - id: shell-command-missing-argument
      - id: command-fetch-failure
