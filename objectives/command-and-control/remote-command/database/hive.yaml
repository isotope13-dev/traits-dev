# HiveServer2 UDF command execution. Hive UDFs are a legitimate extension
# mechanism, but a UDF registered through a HiveServer2 client that invokes an
# OS process is an explicit database-to-shell bridge. The second composite
# covers the report's WebHDFS result channel without a campaign signature.
defaults:
  platforms: [unix, windows]
  # Cover common script/source containers while excluding low-value language
  # buckets that are unlikely to carry this Java/Hive client chain.
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  attack: T1059,T1071.001,T1210
  mbc: C0017
  crit: notable
  conf: 0.9

traits:
  - id: hive-server2-marker
    desc: HiveServer2 service marker
    if:
      type: text
      word: HiveServer2

  - id: hive-port-10000-socket-call
    desc: Socket call targets port 10000
    if:
      type: text
      regex: '(?i)\bsocket\.\w+\([^\)\r\n]{0,120}\b10000\b'

  - id: hive-open-session-request
    desc: Hive client opens a Thrift session
    if:
      type: text
      word: OpenSession

  - id: hive-add-jar-command
    desc: Hive ADD JAR statement loads a jar
    if:
      type: text
      # HiveQL uses uppercase ADD JAR; lowercase comment prose must not match.
      # The jar path is required: the bare keyword pair also matched SQL
      # keyword vocabularies shipped by editors, formatters, and syntax
      # highlighters (`"ADD FILE","ADD JAR","ANALYZE TABLE"`), where no
      # statement is being issued.
      regex: '\bADD\s+JAR\s+\S{1,120}\.jar\b'

  - id: hive-create-function-command
    desc: Hive UDF registration statement
    if:
      type: literal
      kind: string
      # Python protobuf deprecation text such as "create function
      # Descriptor()" is not HiveQL.  Hive's CREATE FUNCTION statement must
      # bind the function name to a Java class with AS; keep the evidence in a
      # parsed string literal so ordinary source prose/imports do not qualify.
      regex: '(?i)\bCREATE\s+(TEMPORARY\s+)?FUNCTION\s+(IF\s+NOT\s+EXISTS\s+)?\w+\s+AS\s+[\w.]+'
    unless:
      - id: well-known/lib/ui/ace-editor

  - id: hive-udf-class
    desc: Java class implements a Hive UDF
    if:
      type: text
      regex: '(?i)\b(extends UDF|org\.apache\.hadoop\.hive\.ql\.exec\.UDF)\b'

  # NOTE: the OS-process legs below are the generic JVM exec capabilities in
  # micro-behaviors/process/create/spawn. Nothing about `Runtime.getRuntime()
  # .exec(` or `new ProcessBuilder(` is Hive-specific; local copies of those
  # matchers fired standalone on ordinary JVM code (BeanShell's exec command,
  # for one) while claiming a Hive UDF backdoor. The Hive intent comes from
  # hive-udf-class and the proximity constraint, not from the exec call.

composite_rules:
  - id: hive-server2-sasl-client
    desc: HiveServer2 client uses SASL access
    crit: suspicious
    conf: 0.97
    all:
      - id: hive-server2-marker
      - id: hive-port-10000-socket-call
      - id: micro-behaviors/os/security/auth/sasl::sasl-plain-mechanism
      - id: hive-open-session-request
    near_bytes: 1600

  - id: hive-udf-jar-registration
    desc: Hive client registers a Java UDF jar
    crit: notable
    conf: 0.96
    all:
      - id: hive-add-jar-command
      - id: hive-create-function-command
    near_bytes: 800

  - id: hive-udf-os-command-bridge
    desc: Hive UDF implementation invokes an OS process
    crit: suspicious
    conf: 0.98
    all:
      - id: hive-udf-class
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/spawn::java-processbuilder-source
    near_bytes: 1600

  - id: webhdfs-port-50070-result-channel
    desc: WebHDFS result retrieval on port 50070
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/hadoop::webhdfs-api-url-port-50070
    any:
      - id: micro-behaviors/communications/http/services/hadoop::webhdfs-open-operation-url
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
    near_bytes: 1200

  - id: hive-server2-udf-command-execution
    desc: HiveServer2 UDF reaches OS command execution
    crit: hostile
    conf: 0.99
    all:
      - id: hive-server2-sasl-client
      - id: hive-udf-jar-registration
      - id: hive-udf-os-command-bridge
    near_bytes: 5000

  - id: hive-udf-webhdfs-command-channel
    desc: Hive UDF returns command output through WebHDFS
    crit: hostile
    conf: 0.99
    all:
      - id: hive-udf-jar-registration
      - id: hive-udf-os-command-bridge
      - id: webhdfs-port-50070-result-channel
    near_bytes: 5000
