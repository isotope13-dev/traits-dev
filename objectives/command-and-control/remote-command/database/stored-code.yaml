# Database-resident code can execute from the database server without leaving
# the usual process/binary/file artifacts. The article specifically names
# Oracle Java schema objects and PL/SQL Java bindings; the storage atom also
# accepts other database languages so equivalent future variants are covered.
defaults:
  platforms: [windows, unix]
  for: [text]
  attack: T1505.001,T1059
  mbc: B0030

composite_rules:
  - id: database-java-stored-object
    desc: Oracle Java schema object with wrapper
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/schema/stored-code::oracle-java-schema-source
      - id: micro-behaviors/data/db/schema/stored-code::oracle-java-language-binding
    near_bytes: 1400

  - id: database-stored-process-bridge
    desc: Database-stored code launches an OS process
    crit: hostile
    conf: 0.99
    all:
      - id: database-java-stored-object
    any:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
    near_bytes: 1400

  - id: database-stored-network-bridge
    desc: Database-stored code opens a network socket
    crit: suspicious
    conf: 0.98
    attack: T1505.001,T1041
    all:
      - id: database-java-stored-object
    any:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: micro-behaviors/process/io/stream::java-output-stream-write
    near_bytes: 1400

  - id: database-stored-command-channel-toolkit
    desc: Database-resident code executes and communicates
    crit: hostile
    conf: 0.995
    attack: T1505.001,T1059,T1041
    all:
      - id: database-stored-process-bridge
      - id: database-stored-network-bridge
    near_bytes: 1800
