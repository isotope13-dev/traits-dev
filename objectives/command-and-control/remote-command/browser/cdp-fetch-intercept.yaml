# Standalone CDP clients that intercept Fetch traffic and forge responses.
#
# Puppeteer and Playwright drive pages they launched; they do not normally
# enable the Fetch domain to fulfill arbitrary requests with attacker-chosen
# bodies. Pairing Fetch interception with CSP bypass and script injection is
# the shape of exam-cheating and session-manipulation tooling that attaches to
# a victim's already-running browser.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, source]
  attack: T1185,T1565

composite_rules:
  - id: cdp-fetch-response-spoofing
    desc: CDP intercepts and forges fetch responses
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-fetch-enable
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-fetch-fulfill-request
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-bypass-csp
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-add-script
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
    unless:
      - id: objectives/execution/exploit/debug-interface::puppeteer-playwright-marker
      - id: well-known/lib/platform/browser-automation/automation-context::puppeteer-library-present
      # Generated protocol catalogs (puppeteer/playwright protocol.d.ts) list
      # every command as `"Domain.method": Domain.methodParameters`. That map
      # is the schema, not a client forging responses. unless: is file-scoped,
      # so the catalog member is quiet without hiding a real send() client
      # that lives in another file.
      - id: micro-behaviors/communications/http/devtools/client::cdp-protocol-command-parameter-map
      - id: well-known/lib/platform/browser-automation/automation-context::puppeteer-archive-context
      - id: well-known/lib/platform/browser-automation/automation-context::playwright-archive-context
