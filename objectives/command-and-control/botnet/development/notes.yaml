defaults:
  for: [text]
  platforms: [unix, windows, android]
  crit: notable

traits:
  - id: keylogger-channel-plan
    desc: Plans keylogger channel reporting
    if:
      type: text
      regex: '(?i)keylogger.{0,40}log.{0,40}(msg|message).{0,20}chan'

  - id: bot-stealth-plan
    desc: Describes stealth as a bot component
    if:
      type: text
      regex: '(?i)stealth.{0,40}component of this bot'

  - id: antivirus-evasion-plan
    desc: Plans antivirus detection evasion
    if:
      type: text
      regex: '(?i)not get detected by avs'

composite_rules:
  - id: keylogging-bot-development-notes
    desc: Bot development notes plan keylogging and antivirus evasion
    crit: hostile
    all:
      - id: keylogger-channel-plan
      - id: bot-stealth-plan
      - id: antivirus-evasion-plan
