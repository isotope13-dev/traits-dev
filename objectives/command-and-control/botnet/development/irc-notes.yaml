defaults:
  for: [text]
  platforms: [windows]
  crit: notable

traits:
  - id: development-todo-heading
    desc: Work remaining list heading
    crit: component
    if:
      type: text
      regex: '(?i)(list of work to be done|development todo|development to-do)'

  - id: development-irc-connect
    desc: IRC connection repair note
    crit: component
    if:
      type: text
      regex: '(?i)irc_connect.{0,40}(truncation|fix|repair)'

  - id: development-bot-update
    desc: Bot DNS update note
    crit: component
    if:
      type: text
      regex: '(?i)auto.update bot.{0,40}dns'

  - id: development-password-extract
    desc: Password extraction development note
    if:
      type: text
      regex: '(?i)password extract(ion)? (code|module|add.in)'

  - id: development-spreader
    desc: Messenger spreader development note
    if:
      type: text
      regex: '(?i)(msn|aim)(/aim)? spreader'

  - id: development-keylogger
    desc: Keylogger development note
    if:
      type: text
      regex: '(?i)key ?logger.{0,30}(add.in|sendkeys)'

  - id: development-bot-melt
    desc: Bot self-deletion development note
    if:
      type: text
      regex: '(?i)melt code.{0,40}delete bot'

composite_rules:
  - id: irc-bot-development-notes
    desc: IRC bot development notes plan password extraction and spreading
    crit: hostile
    all:
      - id: development-todo-heading
      - id: development-irc-connect
      - id: development-bot-update
      - id: development-password-extract
      - id: development-spreader

  - id: irc-bot-keylogger-spreader-notes
    desc: IRC bot development notes plan keylogging, spreading, and self-deletion
    crit: hostile
    all:
      - id: development-todo-heading
      - id: development-irc-connect
      - id: development-bot-update
      - id: development-keylogger
      - id: development-spreader
      - id: development-bot-melt
