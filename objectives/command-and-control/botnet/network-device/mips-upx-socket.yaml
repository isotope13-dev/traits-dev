# Packed IoT bot profile. The individual markers are deliberately
# component-level: a literal socket or CNC token is not enough by itself, but
# the combination with an embedded architecture, high entropy, and UPX packing
# is a strong indication of a concealed network bot.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.002
  mbc: F0001

traits:
  - id: cnc-control-marker
    desc: Embedded CNC control marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[(cnc|c&c)\]|\bbotv2\b'

  - id: shell-file-management-marker
    desc: Embedded shell file-management marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bmv\s+-f\b|\brc\.d\b'

composite_rules:
  - id: iot-upx-socket-c2-bot
    desc: Hostile packed IoT socket C2 bot
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1071,T1059.004
    all:
      - id: metadata/arch/iot::embedded-elf-architecture
      - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
      - id: objectives/anti-static/pack/detect::upx-magic-raw
      - id: objectives/anti-static/pack/detect::no-section-headers
      - id: micro-behaviors/communications/socket/create::static-socket-api-marker
      - id: cnc-control-marker
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/

  - id: iot-upx-shell-command-profile
    desc: Hostile packed IoT shell-command bot
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1059.004
    all:
      - id: metadata/arch/iot::embedded-elf-architecture
      - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
      - id: objectives/anti-static/pack/detect::upx-magic-raw
      - id: objectives/anti-static/pack/detect::no-section-headers
      - id: cnc-control-marker
      - id: shell-file-management-marker
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/unix-benign/
