# BusyBox-targeted shell bot: it tags its beacon with the device CPU family
# (mips, arm) so the operator knows which payloads to send, reaches a raw IP
# with wget and runs whatever comes back. Embedded devices are the audience;
# a desktop script has no reason to branch on uname for MIPS and ARM.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1082,T1071.001
composite_rules:
  - id: shell-busybox-arch-tagged-eval-beacon
    desc: BusyBox shell beacon tagged by CPU family, evals reply
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/process/argument/subcommand::busybox-name-reference
      - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
