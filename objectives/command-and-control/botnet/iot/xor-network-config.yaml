# Reading the resolver and routing-table paths is ordinary; hiding both behind
# a single-byte XOR in a static image that also strips its symbol table and
# pins a literal address is how a bot finds its gateway and DNS server without
# leaving the paths in the string table.
defaults:
  platforms: [linux]
  for: [elf]
  mbc: B0030
  attack: T1016,T1027

composite_rules:
  - id: xor-obfuscated-network-config-static-bot
    desc: Stripped static bot hides resolver and route paths
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/config/system::config-resolv-xor
      - id: micro-behaviors/fs/proc/network::network-route-xor
      - id: micro-behaviors/communications/ip/literal::static-stripped-elf-external-ip-literal
      - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty
