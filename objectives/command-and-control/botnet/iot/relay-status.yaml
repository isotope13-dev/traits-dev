defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.9
  mbc: B0030

traits:
  - id: relay-status-online-field
    desc: Native relay online-status field
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '"status":"ONLINE"'

  - id: relay-status-connections-field
    desc: Native relay connection-count field
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '"connections":'

  - id: relay-status-bandwidth-field
    desc: Native relay bandwidth-reporting field
    crit: suspicious
    conf: 0.94
    attack: T1071.001
    if:
      type: text
      substr: '"bandwidth_mbps":'

composite_rules:
  - id: relay-status-bandwidth-schema
    desc: Native relay online status and bandwidth schema
    crit: suspicious
    conf: 0.95
    attack: T1071.001
    all:
      - id: relay-status-online-field
      - id: relay-status-connections-field
      - id: relay-status-bandwidth-field

  - id: upnp-status-relay-bot
    desc: UPnP relay bot with status-reporting C2
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1105,T1498.002
    all:
      - id: relay-status-bandwidth-schema
      - id: micro-behaviors/communications/http/request/ssdp::m-search
      - id: micro-behaviors/communications/http/request/ssdp::discover-header
      - id: micro-behaviors/communications/http/request/upnp::internet-gateway-port-mapping
      - id: micro-behaviors/communications/http/request/upnp::relay-port-mapping-body
    any:
      - id: micro-behaviors/fs/proc/network::network-route
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
