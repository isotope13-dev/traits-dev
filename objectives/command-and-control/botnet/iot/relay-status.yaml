defaults:
  platforms: [linux]
  for: [elf, c, cpp, go, rust, python, javascript, typescript, java, ruby]
  crit: notable
  conf: 0.9
  mbc: B0030

# A bare `status: "ONLINE"` field is ordinary monitoring/dashboard vocabulary,
# so the ONLINE literal is only matched together with the neighbouring
# relay-schema field that gives it meaning.
traits:
  - id: relay-status-connections-field-source
    desc: Online relay connection field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']?status["'']?\s*[:=]\s*["'']ONLINE["''][\s\S]{0,80}["'']?connections["'']?\s*[:=]'

  - id: relay-status-connections-field
    desc: Native online relay connection field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)"status"\s*:\s*"ONLINE".{0,100}"connections"\s*:'

composite_rules:
  - id: relay-status-bandwidth-schema-source
    desc: Relay online, connection, and bandwidth status schema in source
    crit: suspicious
    conf: 0.97
    attack: T1071.001
    all:
      - id: relay-status-connections-field-source
      - id: micro-behaviors/data/format/json::json-bandwidth-mbps-field

  - id: relay-status-bandwidth-schema
    desc: Native relay online status and bandwidth schema
    crit: suspicious
    conf: 0.95
    attack: T1071.001
    all:
      - id: relay-status-connections-field
      - id: micro-behaviors/data/format/json::json-bandwidth-mbps-field

  - id: upnp-status-relay-bot
    desc: UPnP relay bot with status-reporting C2
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1105,T1498.002
    all:
      - id: relay-status-bandwidth-schema
      - id: micro-behaviors/communications/http/request/ssdp::m-search
      - id: micro-behaviors/communications/http/request/ssdp::discover-header
      - id: micro-behaviors/communications/http/request/upnp::internet-gateway-port-mapping
      - id: micro-behaviors/communications/http/request/upnp::relay-port-mapping-body
    any:
      - id: micro-behaviors/fs/proc/network::network-route
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
