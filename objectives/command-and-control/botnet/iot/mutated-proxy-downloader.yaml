# A BusyBox IoT binary that serves SOCKS, embeds a download URL, references
# its own /proc/self/exe image and ships with a trashed ELF header is not a
# proxy utility with bad luck: the header damage defeats static parsers while
# the proxy plus downloader plus self-reference is the bot shape (Mirai
# family). No legitimate program combines all five.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1090,T1105
composite_rules:
  - id: trashed-header-iot-proxy-downloader
    desc: Trashed-header IoT proxy downloader bot
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/argument/subcommand::busybox-name-reference
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url-elf
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: metadata/binary/header/malformed::elf-parse-failure
    unless:
      - id: metadata/signed/platform/
