# Mirai-lineage images hide their whole dropper script behind the same
# single-byte XOR as the string table, so a plain-text wget chain rule sees
# nothing. When the decoded layer carries the download command, the raw-IP
# URL, the world-writable mode change and the local launch together, the
# bot carries its own cross-infection fetch-exec chain in encoded form.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1105,T1059.004,T1222.002

composite_rules:
  - id: encoded-fetch-exec-propagation-chain
    desc: Encoded wget chain fetches and runs IP payloads
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-wget-http
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-xor-binary
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
    any:
      - id: micro-behaviors/fs/chmod/executable/dangerous::busybox-chmod-777
      - id: micro-behaviors/fs/chmod/executable/dangerous::busybox-chmod-plus-x
    needs: 1
