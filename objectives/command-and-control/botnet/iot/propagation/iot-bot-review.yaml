defaults:
  platforms: [unix, windows]
  for: [elf, shell]
traits:
  - id: shell-compromise-deployment-report
    desc: Shell reports compromised and deployed targets
    crit: suspicious
    conf: 0.96
    attack: T1071.001
    for: [shell]
    if:
      type: text
      regex: '\\?"compromised\\?"\s*:\s*true[^\n]{0,120}\\?"deployed\\?"\s*:\s*true'
  - id: bot-reinfect-update-log
    desc: IoT bot self-reinfection debug log
    crit: notable
    conf: 0.95
    attack: T1105
    platforms: [linux]
    for: [elf]
    if:
      type: text
      substr: "[bot] reinfect"
composite_rules:
  - id: iot-credential-proxy-downloader
    desc: IoT passwords with SOCKS, self-image and downloader
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1090,T1105
    mbc: E1017,B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: micro-behaviors/communications/proxy/socks/unspecified::socks5-proto
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-option-script
    any:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-cred-xc3511
      - id: objectives/lateral-movement/brute-force/iot-creds::iot-password-vizxv
    needs: 2
  - id: busybox-ssh-bot
    desc: BusyBox SSH brute-force bot
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1059.004
    platforms:
      - linux
    for: [elf]
    all:
      - id: micro-behaviors/process/argument/subcommand::busybox-nonstandard-applet-commands
      - id: objectives/lateral-movement/brute-force/ssh::ssh-with-auth
    any:
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
      - id: micro-behaviors/fs/path/device/special::watchdog-device
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
  - id: mirai-busybox-credential-loader
    desc: Mirai credential bot with BusyBox staging
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1105,T1059.004
    mbc: B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: micro-behaviors/process/argument/subcommand::busybox-nonstandard-applet-commands
      - id: objectives/lateral-movement/brute-force/iot::iot-credential-spray
    any:
      - id: micro-behaviors/fs/path/application/interpreter::bin-busybox-path
      - id: micro-behaviors/communications/http/download/busybox::wget
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget
      - id: micro-behaviors/communications/tftp/download::tftp
      - id: micro-behaviors/fs/proc/exe::process-self-exe
  - id: mirai-shell-stager
    desc: Mirai shell download and execution stager
    crit: component
    conf: 0.98
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-pipes-downloaded-script
      - id: micro-behaviors/process/deploy/file-exec/command::shell-download-chmod-exec
      - id: objectives/execution/staging/transfer::embedded-download-chmod-execute-chain
  - id: mirai-credential-multi-protocol-propagator
    desc: IoT credentials with procfs and shell staging
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1046,T1105
    mbc: B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: mirai-shell-stager
    any:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/network::network-route
    needs: 1
  - id: iot-procfs-multi-protocol-bot
    desc: IoT bot with procfs discovery and shell staging
    crit: hostile
    conf: 0.99
    attack: T1049,T1059.004,T1105
    mbc: B0024,B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-format
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: "micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path"
  - id: multi-architecture-http-exec-iot-loader
    desc: Multi-architecture IoT loader fetches and executes a native stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1071.001,T1106
    mbc: B0024,B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: micro-behaviors/os/sysinfo/platform/string::multi-architecture-payload-name-catalog
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf
      - id: micro-behaviors/communications/http/get::manual-http10-dynamic-get
      - id: micro-behaviors/process/replace::c-exec-variants
  - id: multi-architecture-bins-payload-fetcher
    desc: Multi-architecture IoT bot fetches a named /bins payload
    crit: hostile
    conf: 0.99
    attack: T1105,T1071.001
    mbc: B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: micro-behaviors/communications/http/get::binary-bins-payload-get-path
      - id: micro-behaviors/os/sysinfo/platform/string::multi-architecture-payload-suffix-catalog
      - id: micro-behaviors/fs/path/device/special::watchdog-device
  - id: multiarch-protocol-fallback-dropper
    desc: Multi-architecture fallback payload dropper
    crit: hostile
    conf: 0.99
    mbc: B0024
    attack: T1105,T1059.004,T1222.002
    platforms: [linux]
    for: [shell]
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-777
      - id: metadata/lang/source/syntax/command/launch::tmp-path-execution
    unless:
  # cybench ships real botnet dropper scripts (e.g. the Korp/Legions worm
  # challenge) verbatim as agent-evaluation resources.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
  - id: raw-ip-multiarch-protocol-dropper
    desc: Variable-host multi-architecture protocol fallback dropper
    crit: hostile
    conf: 0.99
    mbc: B0024
    attack: T1105,T1059.004,T1222.002
    platforms: [linux]
    for: [shell]
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: micro-behaviors/communications/url/construction/template::shell-variable-host-url
      - id: micro-behaviors/fs/chmod/executable/dangerous::chmod-777
      - id: micro-behaviors/process/create/path-execution::local-execution
    unless:
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
  - id: shell-iot-rival-killall-arch-dropper
    desc: Shell kills rival bots then stages multi-arch payloads
    crit: hostile
    conf: 0.99
    mbc: B0024
    attack: T1105,T1489,T1562.001
    platforms: [linux]
    for: [shell]
    all:
      - id: micro-behaviors/process/terminate/command::killall-with-signal
      - id: raw-ip-multiarch-protocol-dropper
  - id: mirai-credential-staged-dropper
    desc: Mirai credential targeting with BusyBox download and mode change
    crit: hostile
    conf: 0.99
    attack: T1110.001,T1105,T1222.002
    mbc: B0024
    platforms: [linux]
    for: [elf]
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: micro-behaviors/communications/socket/telnet::telnet-port-endpoint-reference
      - id: micro-behaviors/communications/http/download/busybox::busybox-wget-http-reference
      - id: micro-behaviors/fs/chmod/executable/dangerous::busybox-chmod-plus-x
    unless:
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/path/directory::test-directory-component
  - id: arch-protocol-fetch
    desc: Architecture loader uses FTP or TFTP
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget
      - id: micro-behaviors/communications/tftp/download::tftp
      - id: micro-behaviors/communications/tftp/download::command
  - id: raw-ip-arch-protocol-dropper
    for: [shell]
    desc: Raw-IP multi-architecture protocol payload loader
    crit: hostile
    conf: 0.99
    mbc: B0024
    attack: T1105,T1059.004,T1222.002
    near_lines: 20
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: arch-protocol-fetch
      - id: micro-behaviors/fs/chmod/executable/dangerous::busybox-exec-or-shell-777
    unless:
      - id: objectives/execution/staging/store::raw-ip-multiarch-fallback-launch
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/path/directory::test-directory-component
  - id: ssh-rootkit-iot-bot
    desc: SSH brute-force IoT bot with rootkit persistence
    crit: hostile
    conf: 0.98
    mbc: B0030
    attack: T1110.001,T1574.006,T1053.003
    platforms: [linux]
    for: [elf]
    all:
      - id: busybox-ssh-bot
    any:
      - id: objectives/evasion/hijack-execution-flow/preload::ld-preload-rootkit-persistence
      - id: objectives/persistence/system/cron/job/unspecified::cron-preload-rootkit-persistence
    needs: 1
  - id: ssh-bot-hidden-stage-loader
    desc: SSH brute-force IoT bot fetches hidden stage
    crit: hostile
    conf: 0.97
    mbc: B0024
    attack: T1110.001,T1105
    platforms: [linux]
    for: [elf]
    all:
      - id: busybox-ssh-bot
    any:
      - id: micro-behaviors/fs/chmod/executable/hidden::hidden-download-executable-chmod
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-sh
      - id: micro-behaviors/communications/transfer::multiple-download-clients
    needs: 1
  - id: shellcode-stager-botnet
    desc: Shellcode stager with botnet self-propagation
    crit: suspicious
    conf: 0.85
    mbc: B0030
    attack: T1105
    platforms:
      - linux
  # mprotect-rwx-syscall is not typed for shell.
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/mem/protect/modify/executable::mprotect-rwx-syscall
      - id: metadata/binary/code/control-transfer::register-transfer
  - id: shell-telnet-propagation-bot
    desc: Shell Telnet bot reports and propagates through credentials
    crit: hostile
    conf: 0.99
    attack: T1021.007,T1110.001,T1071.001,T1105
    for: [shell]
    all:
      - id: objectives/command-and-control/botnet/iot/control::shell-bot-registration-keepalive
      - id: shell-compromise-deployment-report
      - id: objectives/lateral-movement/brute-force/iot::shell-default-credential-list
      - id: objectives/discovery/network/scan/port/shell::random-telnet-port-scan
  - id: iot-bot-c2-reinfect-client
    desc: IoT bot C2 client with self-reinfection logs
    crit: hostile
    conf: 0.97
    attack: T1071,T1105
    mbc: B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: metadata/lang/natural/vocabulary/event-logging::bot-hello-c2-log
      - id: bot-reinfect-update-log
    any:
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/os/application/target/utility::busybox-name-reference
