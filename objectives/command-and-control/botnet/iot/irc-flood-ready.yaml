defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: irc-http-flood-ready-report
    desc: IRC channel announces HTTP flood readiness
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'PRIVMSG #[^\r\n]{1,64} :HTTPFLOOD ready'
  - id: mirai-cnc-http-user-agent
    desc: Mirai CNC HTTP user-agent banner
    crit: suspicious
    conf: 0.99
    attack: T1071.001
    if:
      type: text
      exact: MIRAI-CNC/1.0
