defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071,T1102
  mbc: B0030

traits:
  - id: terminate-command
    desc: Bot termination tasking command
    crit: component
    conf: 0.92
    if:
      type: text
      exact: TERMINATE

composite_rules:
  - id: compact-arm-bot-control-protocol
    desc: Static ARM bot accepts attack or scan tasking
    crit: hostile
    conf: 0.99
    all:
      - id: terminate-command
      - id: metadata/arch/iot::arm
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    any:
      - id: objectives/impact/dos/attack/tasking::target-port-duration-attack-command
      - id: objectives/discovery/network/scan/port::scan-tasking-report-vocabulary
    needs: 1

  - id: compact-mips-bot-control-protocol
    desc: Static MIPS bot accepts attack or scan tasking
    crit: hostile
    conf: 0.99
    all:
      - id: terminate-command
      - id: metadata/arch/iot::mips
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    any:
      - id: objectives/impact/dos/attack/tasking::target-port-duration-attack-command
      - id: objectives/discovery/network/scan/port::scan-tasking-report-vocabulary
    needs: 1
