defaults:
  platforms: [unix, windows]
  for: [elf, shell]
traits:
  - id: shell-bot-registration-keepalive
    desc: Shell bot registers and sends keepalive messages
    crit: suspicious
    conf: 0.95
    attack: T1071.001
    for: [shell]
    if:
      type: text
      regex: '(?s)\\?"type\\?"\s*:\s*\\?"bot_register\\?".{0,500}\\?"type\\?"\s*:\s*\\?"ping\\?"'
