# Shell task clients combine CPU-family markers, direct-IP task retrieval,
# and executable staging. These findings do not establish that a CPU tag
# flows into the task URL or that a single retrieval repeats.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1082,T1071.001
traits:
  - id: shell-wget-task-endpoint-query
    desc: Shell retrieves an HTTP task reply
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bT=\$\(wget\s+-qO-\s+https?://[^\s]{1,120}/task/\$[A-Za-z_][A-Za-z0-9_]*'
composite_rules:
  - id: shell-busybox-arch-tagged-eval-beacon
    desc: BusyBox shell beacon tagged by CPU family, evals reply
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/os/application/target/utility::busybox-name-reference
      - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
    unless:
      - id: metadata/path/directory::test-directory-component
      # LinPEAS lists busybox in a command denylist, names arches in a CVE
      # table, GETs the Docker Desktop engine API, and evals local helpers.
      # That is not a CPU-tagged beacon that evals a downloaded reply.
      - id: well-known/tool/offensive/peas::linpeas-audit-script
  - id: shell-iot-arch-tagged-task-payload
    desc: HTTP task query with multiarch markers and payload launch
    crit: hostile
    conf: 0.97
    attack: T1105,T1059.004,T1071.001
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: shell-wget-task-endpoint-query
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
    any:
      - id: metadata/lang/source/syntax/command/launch::tmp-path-execution
      - id: metadata/lang/source/syntax/command/launch::detached-temp-path-launch
