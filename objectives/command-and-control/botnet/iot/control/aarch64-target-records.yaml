# Mirai-style wire records: duration (network-order u32), vector byte,
# target count byte, then count * (IPv4 u32 + prefix byte). The parser checks
# the five-byte stride against remaining input before allocating targets.
# Branch displacements vary; the record layout and bounds check are required.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [aarch64]

traits:
  - id: aarch64-five-byte-target-record-parser
    desc: AArch64 five-byte target-record parser
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '99 12 40 39 7F 16 00 71 ?? ?? ?? 54 F6 5F 05 A9 96 16 40 39 ?? ?? ?? 34 C1 1E 7E D3 73 1A 00 51 24 00 36 8B C0 1E 40 92 9F C0 33 EB ?? ?? ?? 54'

composite_rules:
  - id: aarch64-hidden-credential-attack-parser
    desc: Hidden-credential bot parses binary attack tasks
    crit: hostile
    conf: 0.98
    attack: T1095
    all:
      - id: aarch64-five-byte-target-record-parser
      - id: objectives/lateral-movement/brute-force/iot-creds::xor-encoded-iot-credential-table
      - id: micro-behaviors/communications/socket/syscall/transfer::aarch64-recvfrom-syscall-wrapper
