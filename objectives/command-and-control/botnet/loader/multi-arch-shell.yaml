defaults:
  platforms:
  - unix
  for:
  - shell
  attack: T1105
traits:
- id: selfrep-launch-argument
  desc: Local executable launched with selfrep argument
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?m)(^|[;&|])[ \t]*\./[A-Za-z0-9._-]{1,40}[ \t]+selfrep\b
- id: bot-start-command-argument
  desc: Local payload run with bot start command
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: \./[^\s]{1,40}\s+["']?bot[_-]?(start|net|kill|main)\b
- id: bot-platform-launch-argument
  desc: Payload launched with bot platform argument
  crit: suspicious
  conf: 0.93
  attack: T1059.004
  for:
  - shell
  - text
  if:
    type: text
    regex: '(?m)(^|[;&|])[ \t]*\./[A-Za-z0-9._-]{1,40}[ \t]+(android|arm|mips|x86)\b'
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: shell-kills-rival-bot-name
  desc: Shell force-kills a named rival bot process
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: (?i)\bpkill\s+-9\s+-f\s+['"]?\w*(bot|mirai)
- id: shell-pkill-hidden-dot-agent
  desc: Shell pkill on hidden dot-agent path
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: (?i)\bpkill\b[^\r\n]{0,80}\\\.g[_a-z]
- id: shell-stage-ok-marker
  desc: Shell prints staged-agent success marker
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: STAGE_(OK|FAIL)
composite_rules:
- id: repeated-ftp-selfrep-loader
  desc: Repeated FTP payload launches with selfrep argument
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.004
  all:
  - id: micro-behaviors/communications/ftp/download/busybox::repeated-ftpget-fetch
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
  - id: selfrep-launch-argument
- id: repeated-http-selfrep-loader
  desc: Repeated HTTP payload launches with selfrep argument
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.004
  all:
  - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download-cluster
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
  - id: selfrep-launch-argument
- id: multi-arch-bot-loader
  desc: Multi-architecture bot loader stages and enrols
  crit: hostile
  conf: 0.97
  all:
  - id: bot-start-command-argument
  - id: micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  any:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: multi-arch-rival-killing-bot-installer
  desc: Multi-architecture bot installer kills rival processes and launches its payload
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.004,T1562.001
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
  - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
  - id: micro-behaviors/communications/transfer::multiple-download-clients
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: shell-kills-rival-bot-name
  any:
  - id: micro-behaviors/process/create/local-exec::execute-quoted-var
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-var
  - id: micro-behaviors/process/create/local-exec::chmod-exec-var-local
  needs: 1
- id: iot-agent-selftest-arch-stager
  desc: IoT agent installer probes arch via self-test download
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.004
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
  - id: micro-behaviors/communications/transfer::multiple-download-clients
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: micro-behaviors/process/create/local-exec::execute-quoted-var
  - id: micro-behaviors/fs/path/reference::agent-prefixed-path-fragment
  - id: shell-stage-ok-marker
- id: multi-arch-botnet-stager
  desc: Architecture-detecting botnet stager downloads and detaches payload
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.004,T1082
  mbc: B0030
  all:
  - id: micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references
  - id: micro-behaviors/communications/transfer::multiple-download-clients
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/process/create/background::detached-background-command
- id: raw-ip-bot-payload-loader
  desc: Raw-IP dropper launches bot platform payload
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.004
  for:
  - shell
  - text
  all:
  - id: bot-platform-launch-argument
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
