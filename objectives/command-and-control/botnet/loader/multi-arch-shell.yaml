# The stager half of an IoT botnet: a tiny shell script that reads the machine
# architecture, picks the matching build of the bot from a small per-arch
# matrix, fetches it from a hardcoded host, marks it executable and launches it
# with the campaign's start command as argv[1] (`bot_start`, `botnet`, ...).
#
# The download-and-run half of that chain is already modelled, thoroughly, in
# objectives/command-and-control/dropper/delivery/download-execute -- what is
# NOT modelled there is the enrolment argument, which is the thing that says the
# fetched file is a bot joining a fleet rather than an installer payload. That
# is the leg this file adds, and why the composite lives under botnet/ rather
# than adding a sixteenth variant to the dropper directory.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105

traits:
  - id: bot-start-command-argument
    desc: Local payload run with bot start command
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '\./[^\s]{1,40}\s+["'']?bot[_-]?(start|net|kill|main)\b'

composite_rules:
  - id: multi-arch-bot-loader
    desc: Multi-architecture bot loader stages and enrols
    crit: hostile
    conf: 0.97
    all:
      - id: bot-start-command-argument
      - id: micro-behaviors/os/sysinfo/platform/arch::multiple-architecture-references
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
