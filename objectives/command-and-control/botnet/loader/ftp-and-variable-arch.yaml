defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004
composite_rules:
  - id: multiarch-ftp-copy-chmod-exec-sweep
    desc: Multi-architecture FTP sweep launches payloads
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ftp/download/busybox::repeated-ftpget-utility-fetch
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
      - id: micro-behaviors/process/create/local-exec::cat-payload-chmod-exec
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x-wildcard
  - id: multiarch-world-writable-variable-download-loop
    desc: Architecture loop runs world-writable payloads
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
      - id: metadata/file/profile/staging::world-writable-local-path-exec
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
