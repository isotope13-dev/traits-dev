defaults:
  for: [c]
  platforms: [windows]
  crit: notable

traits:
  - id: startup-keylogger-option
    desc: Enables startup keylogger option
    if:
      type: text
      regex: '(?m)^[\t ]*#[\t ]*define[\t ]+start_keylogger_afterstartup\b'

  - id: bot-portscan-limit
    desc: Defines bot port scan socket limit
    if:
      type: text
      regex: '(?m)^[\t ]*#[\t ]*define[\t ]+MAX_PORTSCAN_SOCKETS_TO_USE[\t ]+[0-9]+'

  - id: bot-exploit-channel-option
    desc: Declares bot exploit channel option
    if:
      type: text
      regex: '(?m)^[\t ]*const[\t ]+BOOL[\t ]+useexploitchan[\t ]*=[\t ]*(TRUE|FALSE)\b'

  - id: irc-line-buffer-macro
    desc: Declares IRC line buffer size macro
    if:
      type: text
      regex: '#define[ \t]+IRCLINE\b'

  - id: bot-max-nicklen-macro
    desc: Declares bot max nick length macro
    if:
      type: text
      regex: '#define[ \t]+MAXNICKLEN\b'

  - id: bot-remotecmd-toggle
    desc: Declares remote command shell toggle
    if:
      type: text
      regex: '#define[ \t]+NO_REMOTECMD\b'

  - id: bot-avfw-kill-toggle
    desc: Declares AV/FW process killer toggle
    if:
      type: text
      regex: '#define[ \t]+NO_AVFW_KILL\b'

  - id: bot-melt-toggle
    desc: Declares binary melt compile toggle
    if:
      type: text
      regex: '#define[ \t]+NO_MELT\b'

composite_rules:
  - id: native-keylogger-bot-options
    desc: Bot source configuration enables startup keylogger option
    crit: hostile
    all:
      - id: startup-keylogger-option
      - id: bot-portscan-limit
      - id: bot-exploit-channel-option

  - id: irc-botnet-build-toggles
    desc: Configures IRC botnet command and evasion build options
    crit: hostile
    attack: T1583.005
    needs: 3
    any:
      - id: irc-line-buffer-macro
      - id: bot-max-nicklen-macro
      - id: bot-remotecmd-toggle
      - id: bot-avfw-kill-toggle
      - id: bot-melt-toggle
