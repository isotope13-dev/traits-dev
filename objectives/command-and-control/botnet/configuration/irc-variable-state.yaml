defaults:
  for: [text]
  platforms: [unix, windows]
  crit: suspicious
traits:
  - id: irc-bot-sub7-upload-configuration
    desc: IRC bot state enables Sub7 auto upload
    if:
      type: text
      regex: '(?is)%autoupload\s+on.{0,180}%sub7\.'
  - id: irc-bot-channel-portscan-state
    desc: IRC bot state reports network port scans
    if:
      type: text
      regex: '(?is)%portscan\.ports[ \t]+[^\r\n]{1,80}.{0,500}%scan\.chan[ \t]+#'
