defaults:
  for: [text]
  platforms: [windows]
  crit: notable

traits:
  - id: irc-builder-string-encryption
    desc: Instructions mention bot string encryption
    if:
      type: text
      substr: 'encrypt your strings, copy to bot the encrypted strings'

  - id: irc-builder-server-host
    desc: Current server host field
    if:
      type: text
      substr: 'sinfo[curserver].host'

  - id: irc-builder-channel-password
    desc: Current server channel password field
    if:
      type: text
      substr: 'sinfo[curserver].chanpass'

  - id: irc-builder-usb-filename
    desc: USB executable filename field
    if:
      type: text
      regex: '(?m)^usbfname[ \t]+\S+\.exe'

composite_rules:
  - id: irc-encrypted-string-bot-builder
    desc: IRC bot builder instructions with USB executable configuration
    crit: hostile
    all:
      - id: irc-builder-string-encryption
      - id: irc-builder-server-host
      - id: irc-builder-channel-password
      - id: irc-builder-usb-filename
