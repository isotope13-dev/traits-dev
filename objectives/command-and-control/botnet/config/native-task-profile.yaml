defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: native-bot-id-field
    desc: Native bot identifier field
    crit: component
    if: {type: text, exact: bot_id}
  - id: native-inner-group-field
    desc: Native inner group field
    crit: component
    if: {type: text, exact: inner_group}
  - id: native-config-address-field
    desc: Native configuration address field
    crit: component
    if: {type: text, exact: config_addr}
composite_rules:
  - id: native-dht-shell-task-profile
    desc: Native DHT peer carries bot task fields and shell capability
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/framing::bittorrent-query-validation-errors
      - id: native-bot-id-field
      - id: native-inner-group-field
      - id: native-config-address-field
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/process/replace::syscall-execve-elf
  - id: native-dht-fingerprinting-shell-bot
    desc: DHT shell bot with task configuration and hardware fingerprinting
    crit: hostile
    conf: 0.98
    attack: T1059.004
    all:
      - id: native-dht-shell-task-profile
      - id: objectives/discovery/system/fingerprint/hardware::native-hardware-rootfs-fingerprint
