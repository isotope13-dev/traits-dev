# Native bots can append controller identity and relay-topology state after a
# packed executable. The complete schema is a C2 configuration, while each
# field cluster remains reusable evidence rather than a family verdict.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: encrypted-bot-identity-schema
    desc: Encrypted bot identity configuration schema
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"config":1,"id":"[A-Za-z0-9]{12,24}","enckey":"[A-Za-z0-9+/=]{80,}'

  - id: parent-bot-identifier-field
    desc: Parent bot identifier configuration field
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '"ParentId":"[A-Za-z0-9]{12,24}"'

  - id: parent-relay-address-schema
    desc: Parent relay address configuration schema
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '"ip":"[^"\r\n]{7,45}","ParentIp":"[^"\r\n]{7,45}","ParentHostname":'

composite_rules:
  - id: encrypted-parent-relay-config
    desc: Encrypted parent-relay bot configuration
    crit: hostile
    conf: 0.99
    attack: T1071.001
    all:
      - id: encrypted-bot-identity-schema
      - id: parent-bot-identifier-field
      - id: parent-relay-address-schema
    near_bytes: 512
