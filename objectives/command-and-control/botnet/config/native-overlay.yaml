# Fleet identity and key material alongside a parent-relay topology.
# The JSON is plaintext; key material encoding does not encrypt the config.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: bot-parent-relay-config
    desc: Bot identity, key and parent-relay config
    crit: hostile
    attack: T1071.001
    all:
      - id: micro-behaviors/crypto/key/representation::json-identity-encoded-key-material
    any:
      - id: micro-behaviors/communications/proxy/relay::parent-relay-id-address-schema
      - id: micro-behaviors/communications/proxy/relay::parent-relay-id-hostname-schema
    near_bytes: 512
