defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071,T1498.001
  mbc: B0030

traits:
  # The sigil distinguishes an operator verb from ordinary local process
  # termination text. It becomes C2 evidence only in the protocol composite.
  - id: sigiled-self-kill-command
    desc: Bot self-termination tasking token
    crit: component
    conf: 0.95
    if:
      type: raw
      regex: '[!.]kill'
      section: .rodata

  # Compact native flood bots parse method, target, port, and duration.
  # Targets may be IPv4 literals (31 bytes) or hostnames (255 bytes).
  # The format is only a protocol fragment until
  # paired with the named flood verb and controller channel below.
  - id: target-port-duration-method-format
    desc: Compact bot four-field command format
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '%31s %(31|255)s %7s %11s'
      section: .rodata

  # Unstripped native bots may retain separate function names for protocol
  # flood implementations. Individual symbols are only suspicious; the
  # cluster gains hostile meaning when paired with controller tasking.
  - id: http-flood-function-symbol
    desc: HTTP flood function symbol
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: text
      exact: http_attack
      section: .strtab
  - id: icmp-flood-function-symbol
    desc: ICMP flood function symbol
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: text
      exact: icmp_attack
      section: .strtab
  - id: syn-flood-function-symbol
    desc: SYN flood function symbol
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: text
      exact: syn_attack
      section: .strtab
  - id: tcp-flood-function-symbol
    desc: TCP flood function symbol
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: text
      exact: tcp_attack
      section: .strtab
  - id: udp-flood-function-symbol
    desc: UDP flood function symbol
    crit: suspicious
    conf: 0.96
    attack: T1498.001
    if:
      type: text
      exact: udp_attack
      section: .strtab

composite_rules:
  # Static clients may expose the controller grammar and packet-output syscall
  # without recoverable networking symbols. Requiring every protocol fragment
  # keeps this architecture-neutral rule specific to compact DDoS tasking.
  - id: compact-native-ddos-tasking-bot
    desc: Native bot accepts controller-issued flood tasks
    crit: hostile
    conf: 0.99
    all:
      - id: sigiled-self-kill-command
      - id: target-port-duration-method-format
      - id: objectives/impact/dos/attack/botnet::udpplain-flood-command
      - id: micro-behaviors/communications/socket/tcp::pong-format-elf
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    any:
      - id: micro-behaviors/communications/socket/send::syscall-sendto
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-sendto
      - id: micro-behaviors/communications/socket/send::arm-sendto-literal-syscall-wrapper
      - id: micro-behaviors/communications/socket/syscall::arc-network-io-syscalls
      - id: micro-behaviors/communications/socket/syscall::m68k-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall::sh-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall::mips-direct-network-syscalls
    needs: 1

  # Same controller grammar as the rule above for builds that take the C2
  # endpoint at runtime (argument or resolver) and so carry no IPv4 literal.
  # The sigiled stop verb, four-field tuple, named flood verb and pong reply
  # together are the tasking protocol; the packet-output syscall ties them to
  # executable network behaviour.
  - id: compact-runtime-c2-ddos-tasking-bot
    desc: Runtime-C2 native bot accepts flood tasks
    crit: hostile
    conf: 0.97
    all:
      - id: sigiled-self-kill-command
      - id: target-port-duration-method-format
      - id: objectives/impact/dos/attack/botnet::udpplain-flood-command
      - id: micro-behaviors/communications/socket/tcp::pong-format-elf
    any:
      - id: micro-behaviors/communications/socket/send::syscall-sendto
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-sendto
      - id: micro-behaviors/communications/socket/send::arm-sendto-literal-syscall-wrapper
      - id: micro-behaviors/communications/socket/syscall::arc-network-io-syscalls
      - id: micro-behaviors/communications/socket/syscall::m68k-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall::sh-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall::mips-direct-network-syscalls
    needs: 1

  # Retained function names expose independently implemented protocol
  # flooders in some unstripped native builds. Requiring the tasking protocol
  # keeps this hostile finding specific to a controller-operated DDoS bot.
  - id: compact-runtime-multivector-ddos-tasking-bot
    desc: Native C2 bot accepts tasks and multiple floods
    crit: hostile
    conf: 0.98
    attack: T1498.001
    all:
      - id: compact-runtime-c2-ddos-tasking-bot
      - id: native-multivector-flood-functions

  - id: native-multivector-flood-functions
    desc: Native bot has multiple flood routines
    crit: suspicious
    conf: 0.97
    any:
      - id: http-flood-function-symbol
      - id: icmp-flood-function-symbol
      - id: syn-flood-function-symbol
      - id: tcp-flood-function-symbol
      - id: udp-flood-function-symbol
    needs: 5

  - id: compact-ppc-ddos-tasking-bot
    desc: PowerPC bot accepts controller-issued flood tasks
    crit: hostile
    conf: 0.99
    arch: [powerpc]
    all:
      - id: sigiled-self-kill-command
      - id: target-port-duration-method-format
      - id: objectives/impact/dos/attack/botnet::udpplain-flood-command
      - id: micro-behaviors/communications/socket/tcp::pong-format-elf
      - id: micro-behaviors/communications/socket/syscall::ppc-socketcall-network-io
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary

  # A controller protocol that can stop the bot, parse a target/port/duration/
  # method tuple, launch a named flood, and replace the binary is an active bot
  # tasking surface. These semantics are architecture-independent.
  - id: compact-native-update-ddos-tasking
    desc: Native bot accepts flood-update tasking
    crit: hostile
    conf: 0.99
    all:
      - id: sigiled-self-kill-command
      - id: target-port-duration-method-format
      - id: objectives/impact/dos/attack/botnet::udpplain-flood-command
      - id: micro-behaviors/process/create/local-exec::embedded-download-chmod-execute-chain
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    # Stripped static bots may expose only direct network syscalls rather than
    # a recoverable connect symbol.
    any:
      - id: micro-behaviors/communications/socket/send::syscall-sendto
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-sendto
      - id: micro-behaviors/communications/socket/send::arm-sendto-literal-syscall-wrapper
      - id: micro-behaviors/communications/socket/syscall::arc-network-io-syscalls
      - id: micro-behaviors/communications/socket/syscall::m68k-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall::sh-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall::mips-direct-network-syscalls
    needs: 1

  # The four-field grammar, PONG reply, flood mode and shell update are
  # controller functionality. Rival malware names in a kill list do not
  # establish Mirai/Gafgyt identity.
  - id: compact-flood-shell-update-controller
    desc: Native flood bot accepts shell payload updates
    crit: hostile
    conf: 0.98
    all:
      - id: target-port-duration-method-format
      - id: objectives/impact/dos/attack/botnet::udpplain-c2-flood-bot
      - id: micro-behaviors/process/create/local-exec::embedded-download-chmod-execute-chain
