defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  attack: T1071.001
  mbc: B0030
traits: []
composite_rules:
- id: bot-api-shell-tasking
  for:
  - source
  - applescript
  - javascript
  - lua
  - perl
  - php
  - python
  - ruby
  - shell
  desc: Bot API response piped to a shell
  crit: hostile
  conf: 0.97
  attack: T1071.001,T1059
  all:
  - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
  any:
  - id: micro-behaviors/communications/url/resource-path/automation::bot-api-versioned-path
  - id: micro-behaviors/communications/url/resource-path/automation::bot-enrolment-path
  - id: micro-behaviors/communications/url/resource-path/automation::bot-task-api-path
- id: bot-api-polled-shell-tasking
  for:
  - shell
  desc: Bot API polling loop evaluates fetched tasking
  crit: hostile
  conf: 0.96
  attack: T1071.001,T1059.004
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
  any:
  - id: micro-behaviors/communications/url/resource-path/automation::bot-api-versioned-path
  - id: micro-behaviors/communications/url/resource-path/automation::bot-enrolment-path
  - id: micro-behaviors/communications/url/resource-path/automation::bot-task-api-path
- id: bot-api-native-payload-drop
  for:
  - shell
  - python
  - javascript
  - ruby
  - php
  - lua
  - perl
  - applescript
  desc: Bot API drops and runs a native payload
  crit: hostile
  conf: 0.96
  attack: T1071.001,T1105
  all:
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
  any:
  - id: micro-behaviors/communications/url/resource-path/automation::bot-api-versioned-path
  - id: micro-behaviors/communications/url/resource-path/automation::bot-enrolment-path
  - id: micro-behaviors/communications/url/resource-path/automation::bot-task-api-path
- id: bot-enrolment-and-tasking-endpoints
  desc: Bot enrolment and tasking endpoints together
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/communications/url/resource-path/automation::bot-enrolment-path
  - id: micro-behaviors/communications/url/resource-path/automation::bot-task-api-path
