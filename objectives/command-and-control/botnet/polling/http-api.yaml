# HTTP bot APIs. A botnet controller is a web service, and its URL space says
# so plainly: the implant registers itself under one path, then polls a second
# for work. Attackers write these routes the way any web developer would --
# versioned, resource-named, RESTful -- which is what makes the shape reusable
# across families rather than a per-family signature.
#
# The path alone is the evidence: an ordinary client is the bot's *peer*, not
# a bot itself, so nothing legitimate asks a server to enrol it into a fleet
# and hand it commands.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1071.001
  mbc: B0030

traits:
  - id: bot-api-versioned-path
    desc: Versioned bot API URL path
    crit: suspicious
    conf: 0.9
    if:
      # `/api/v1/bot/...` -- a REST namespace whose resource is the bot.
      type: text
      regex: '(?i)/api/v[0-9]{1,2}/bots?/'

  - id: bot-enrolment-path
    desc: Bot enrolment API path
    crit: suspicious
    conf: 0.9
    if:
      # The implant's first request: hand the controller this host's details
      # and be issued an identity.
      type: text
      regex: '(?i)/bots?/(join|register|checkin)'

  - id: bot-tasking-path
    desc: Bot tasking API path
    crit: suspicious
    conf: 0.9
    if:
      # The poll loop's endpoint: ask what to run next.
      type: text
      regex: '(?i)/bots?/(actions|tasks|commands)/'

  - id: bot-identity-cache-file
    desc: Caches an assigned bot identity
    crit: suspicious
    conf: 0.9
    if:
      # `~/.botid` -- the controller-assigned id, kept in a dotfile so the
      # same host reports as the same bot across restarts.
      type: text
      regex: '(?i)[/\\]\.bot[_-]?id\b'

composite_rules:
  # Poll the controller, run the answer. The two halves are what a bot *is*,
  # and neither is ambiguous once the URL names a bot fleet.
  - id: bot-api-shell-tasking
    desc: Bot API response piped to a shell
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1059
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: bot-api-versioned-path
      - id: bot-enrolment-path
      - id: bot-tasking-path

  # The other half of the same implant: fetch a companion binary from the
  # controller, mark it executable under /tmp, and run it.
  - id: bot-api-native-payload-drop
    desc: Bot API drops and runs a native payload
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1105
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
    any:
      - id: bot-api-versioned-path
      - id: bot-enrolment-path
      - id: bot-tasking-path

  - id: bot-enrolment-and-tasking-endpoints
    desc: Bot enrolment and tasking endpoints together
    crit: hostile
    conf: 0.96
    all:
      - id: bot-enrolment-path
      - id: bot-tasking-path
