# HTTP bot APIs. A botnet controller is a web service, and its URL space says
# so plainly: the implant registers itself under one path, then polls a second
# for work. Attackers write these routes the way any web developer would --
# versioned, resource-named, RESTful -- which is what makes the shape reusable
# across families rather than a per-family signature.
#
# URL routes and construction facts live in neutral capability/metadata homes.
# These composites add execution or enrolment evidence to infer tasking.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1071.001
  mbc: B0030

traits:
  - id: bot-identity-cache-file
    desc: Caches an assigned bot identity
    crit: suspicious
    conf: 0.9
    if:
      # `~/.botid` -- the controller-assigned id, kept in a dotfile so the
      # same host reports as the same bot across restarts.
      type: text
      regex: '(?i)[/\\]\.bot[_-]?id\b'

    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: metadata/path::test-directory-component
composite_rules:
  # Poll the controller, run the answer. The two halves are what a bot *is*,
  # and neither is ambiguous once the URL names a bot fleet.
  - id: bot-api-shell-tasking
    for: [source, applescript, javascript, lua, perl, php, python, ruby, shell]
    desc: Bot API response piped to a shell
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1059
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: micro-behaviors/communications/http/url/path::bot-api-versioned-path
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path

  # The same implant without the pipe: fetch the fleet's task list into a
  # variable, then eval whatever came back. REST action APIs
  # (/api/v1/bot/actions/, /api/commands/<id>) return discrete commands or
  # script bodies rather than a stream to `| sh`, so the polling loop stores
  # the response and evaluates it in a second step.
  - id: bot-api-polled-shell-tasking
    for: [shell]
    desc: Bot API polling loop evaluates fetched tasking
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1059.004
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
    any:
      - id: micro-behaviors/communications/http/url/path::bot-api-versioned-path
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path

  # The other half of the same implant: fetch a companion binary from the
  # controller, mark it executable under /tmp, and run it.
  - id: bot-api-native-payload-drop
    for: [shell, python, javascript, ruby, php, lua, perl, applescript]
    desc: Bot API drops and runs a native payload
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1105
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
    any:
      - id: micro-behaviors/communications/http/url/path::bot-api-versioned-path
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path

  - id: bot-enrolment-and-tasking-endpoints
    desc: Bot enrolment and tasking endpoints together
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path
