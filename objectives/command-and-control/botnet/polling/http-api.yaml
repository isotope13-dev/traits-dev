# HTTP bot APIs. A botnet controller is a web service, and its URL space says
# so plainly: the implant registers itself under one path, then polls a second
# for work. Attackers write these routes the way any web developer would --
# versioned, resource-named, RESTful -- which is what makes the shape reusable
# across families rather than a per-family signature.
#
# Enrolment routes can identify a client joining a controlled fleet. Generic
# bot task-resource paths are neutral automation APIs, however, so that atom
# lives under micro-behaviors/communications/http/url/path and only contributes
# botnet intent when a composite also proves payload execution or enrolment.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1071.001
  mbc: B0030

traits:
  - id: server-router-bot-route
    desc: Server defines versioned bot route
    # A swagger @Router annotation or route doc comment documents a route
    # the service itself serves; the file defines the bot API rather than
    # reporting in to one.
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(@Router|\*\s*[A-Z]{3,6})\s+/api/v[0-9]{1,2}/bots?'
  - id: configurable-domain-bot-path
    desc: Bot path joined to a configured domain
    # Ops tooling calls its own backend by joining a deployment-configured
    # domain variable with a relative bot path, not a hardcoded controller.
    crit: notable
    conf: 0.9
    for: [python, go]
    if:
      type: text
      regex: '(?i)(domain|base_?url|api_?host)\s*\+\s*f?["'']/api/v[0-9]{1,2}/bots?/'
  - id: bot-api-versioned-path
    desc: Versioned bot API URL path
    crit: suspicious
    conf: 0.9
    if:
      # `/api/v1/bot/...` -- a REST namespace whose resource is the bot.
      type: text
      regex: '(?i)/api/v[0-9]{1,2}/bots?/'
    unless:
      # Same route shape read from the other end: an operator console that
      # lists, creates and deletes bots is managing a fleet it owns, not
      # reporting in to one.
      - id: micro-behaviors/communications/http/url/path::bot-resource-crud-api-paths
      # A chat platform's own bot endpoints sit under its app API namespace --
      # Nextcloud Talk publishes /ocs/v2.php/apps/spreed/api/v1/bot/<room>/
      # message. A messaging integration talking to that is a chat bot.
      - id: micro-behaviors/communications/http/url/path::nextcloud-ocs-app-api-path
      # Same namespace as written in frontend code, where generateOcsUrl adds
      # the /ocs/v2.php prefix at runtime.
      - id: micro-behaviors/communications/http/url/path::nextcloud-spreed-frontend-api-path
      # LUCI Swarming distributed test-runner bot API.
      - id: micro-behaviors/communications/http/url/path::swarming-bot-api-path
      # A service documenting its own bot routes via swagger @Router, and
      # ops tooling joining a configured domain with a relative bot path.
      - id: objectives/command-and-control/botnet/polling::server-router-bot-route
      - id: objectives/command-and-control/botnet/polling::configurable-domain-bot-path
      # Discord bot-listing stats posters (server_count/guildCount beside
      # the listing routes) report to a listing service, not a controller.
      # Inline: url/path is at its 100-rule budget, so no new trait there.
      - type: text
        regex: '(?i)\b(server_count|serverCount|guildCount)\b'
      - id: metadata/package/testing/presence/harness::test-directory
      - type: basename
        regex: '(?i)^sdk\.gen\.ts$'

  - id: bot-identity-cache-file
    desc: Caches an assigned bot identity
    crit: suspicious
    conf: 0.9
    if:
      # `~/.botid` -- the controller-assigned id, kept in a dotfile so the
      # same host reports as the same bot across restarts.
      type: text
      regex: '(?i)[/\\]\.bot[_-]?id\b'

    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: "metadata/file/naming::test-directory-component"
composite_rules:
  # Poll the controller, run the answer. The two halves are what a bot *is*,
  # and neither is ambiguous once the URL names a bot fleet.
  - id: bot-api-shell-tasking
    for: [source, applescript, javascript, lua, perl, php, python, ruby, shell]
    desc: Bot API response piped to a shell
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1059
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: bot-api-versioned-path
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path

  # The same implant without the pipe: fetch the fleet's task list into a
  # variable, then eval whatever came back. REST action APIs
  # (/api/v1/bot/actions/, /api/commands/<id>) return discrete commands or
  # script bodies rather than a stream to `| sh`, so the polling loop stores
  # the response and evaluates it in a second step.
  - id: bot-api-polled-shell-tasking
    for: [shell]
    desc: Bot API polling loop evaluates fetched tasking
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1059.004
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
    any:
      - id: bot-api-versioned-path
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path

  # The other half of the same implant: fetch a companion binary from the
  # controller, mark it executable under /tmp, and run it.
  - id: bot-api-native-payload-drop
    for: [shell, python, javascript, ruby, php, lua, perl, applescript]
    desc: Bot API drops and runs a native payload
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1105
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
    any:
      - id: bot-api-versioned-path
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path

  - id: bot-enrolment-and-tasking-endpoints
    desc: Bot enrolment and tasking endpoints together
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/url/path::bot-enrolment-path
      - id: micro-behaviors/communications/http/url/path::bot-task-api-path
