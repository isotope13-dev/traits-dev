defaults:
  platforms: [macos]
  for: [swift]
  attack: T1071.001
traits:
  - id: botnet-beacon-verbs
    desc: Botnet beacon protocol verbs
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: '(?i)(REGISTER|HEARTBEAT|RESULT)\|'
  # `micro-behaviors/communications/socket/connect::connect` is for: [elf,
  # macho, c, cpp] -- it never lists `swift`, though Swift source calls the
  # same imported POSIX `connect()` symbol as C/C++ (the way `c-popen-call`
  # below already recognizes Swift FFI calls to `popen`).
  - id: swift-connect-symbol
    desc: Swift source references the connect socket API
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: connect
composite_rules:
  - id: swift-botnet-beacon
    desc: Swift botnet beaconing and command execution
    crit: hostile
    conf: 0.98
    all:
      - id: swift-connect-symbol
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call
      - id: botnet-beacon-verbs
