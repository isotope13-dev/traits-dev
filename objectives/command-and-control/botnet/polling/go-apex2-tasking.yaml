# Apex2-derived Go agents combine remote attack tasking with encrypted host
# reconnaissance reports. The function-name atoms are observations; the
# family-specific attack composite supplies the hostile context.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1498.001,T1041,T1071

composite_rules:
  - id: go-nyx-attack-and-encrypted-recon
    desc: Go bot combines remote attack tasking with encrypted host reconnaissance
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/symbols/name/qualified::go-attack-command-handler-name
      - id: metadata/binary/symbols/name/qualified::go-attack-worker-name
      - id: metadata/binary/symbols/name/qualified::go-encrypted-recon-report-name
  - id: go-apex2-remote-attack-recon-c2
    desc: Apex2 DDoS bot handles remote attacks and reports encrypted reconnaissance
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/dos/multi-vector::apex2-internal-multi-vector-ddos
      - id: metadata/binary/symbols/name/qualified::go-attack-command-handler-name
      - id: metadata/binary/symbols/name/qualified::go-encrypted-recon-report-name
