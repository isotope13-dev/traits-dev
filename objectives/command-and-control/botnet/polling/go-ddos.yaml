defaults:
  platforms: [linux]
  for: [elf]
  attack: T1095,T1498.001

traits:
# This name carries an explicit C2 role. Generic command-handler names are
# neutral dispatch evidence, while named attack dispatchers live with the DoS
# behaviors that give them meaning.
- id: go-c2-connect-handler-symbol
  desc: Go ELF exposes a C2 connection handler
  crit: suspicious
  conf: 0.98
  attack: T1071.001,T1498.001
  if:
    type: text
    regex: '\bmain\.connect(To)?(CNC|C2|Server)\b'

composite_rules:
  - id: go-c2-flood-tasking
    desc: Go C2 dispatches remotely tasked floods
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/flood::go-attack-worker-name
      - id: objectives/impact/dos/attack/botnet::go-flood-method-cluster
      - id: micro-behaviors/communications/socket/dial::net-dial-text
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
