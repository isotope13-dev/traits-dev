defaults:
  platforms: [linux]
  for: [elf]
  attack: T1095,T1543.002,T1053.003

composite_rules:
  # A stop verb alone is not bot tasking. Requiring direct network I/O,
  # process-name concealment, and two boot-persistence paths identifies a
  # resident network bot without depending on a family name or C2 address.
  - id: native-systemd-network-bot
    desc: Native network bot with process-name concealment and redundant boot persistence
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/botnet/polling::sigiled-self-kill-command
      - id: micro-behaviors/communications/socket/raw::arm-ipv4-raw-socket-creation
      - id: micro-behaviors/communications/socket/send::arm-sendto-literal-syscall-wrapper
      - id: micro-behaviors/process/info/name::per-cpu-kworker-name-reference
      - id: micro-behaviors/fs/proc/info/path::variable-proc-comm-path
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: micro-behaviors/os/autorun/cron::reboot-entry-reference
