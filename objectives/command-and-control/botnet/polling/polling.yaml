defaults:
  platforms: [unix, windows]
composite_rules:
  - id: python-botnet-polling
    desc: Python script polling HTTP (Botnet behavior)
    crit: suspicious
    conf: 0.8
    attack: "T1071.001"
    mbc: "B0030"
    all:
      - id: metadata/file/profile/source-indications::iteration-related-source-observations
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: objectives/command-and-control/botnet/keywords::c2-polling-params
    unless:
      - id: well-known/tool/detection/anteumbra::anteumbra-package-tree-member
      - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
