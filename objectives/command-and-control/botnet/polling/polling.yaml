defaults:
  platforms: [unix, windows]
composite_rules:
  - id: python-botnet-polling
    desc: Python loop, HTTP request, and task query references
    crit: notable
    conf: 0.8
    attack: "T1071.001"
    mbc: "B0030"
    all:
      - id: micro-behaviors/data/control-flow/iteration::iteration-related-source-observations
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/communications/url/query/command::status-task-command-query-keys
