# Readme or help pages for IRC-style bots list their tasking verbs as
# "!COMMAND <args>" lines. Any one verb is ordinary chat-bot syntax; flood,
# scanner, exec and download verbs together are the control surface of a
# botnet agent.
defaults:
  platforms: [unix, windows]
  for: [html, text]
  attack: T1071
  mbc: B0042

traits:
  - id: bot-bang-ddos-command
    desc: Bot readme lists a DDoS command
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^\s*!DDOS(ICMP|UDP|SYN|TCP|HTTP)\b'

  - id: bot-bang-scan-command
    desc: Bot readme lists a scanner command
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^\s*!P?SCANSTART\b'

  - id: bot-bang-exec-command
    desc: Bot readme lists an exec command
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*!EXEC\s'

  - id: bot-bang-download-update-command
    desc: Bot readme lists download or update
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*!(DOWNLOAD|UPDATE)\s'

  - id: bot-bang-socks-command
    desc: Bot readme lists a SOCKS proxy command
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^\s*!SOCKS[45]START\b'

composite_rules:
  - id: bang-command-bot-scanner-reference
    desc: Bot readme defines flood, scan and exec verbs
    crit: hostile
    conf: 0.94
    all:
      - id: bot-bang-ddos-command
      - id: bot-bang-scan-command
      - id: bot-bang-exec-command
