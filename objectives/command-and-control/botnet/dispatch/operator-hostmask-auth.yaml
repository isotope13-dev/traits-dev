# Bot operator authorization by IRC host mask. The gate matches the sender's
# host against a configured list of allowed masks before a command runs. Each
# leg is a distinct role: the glob matcher, the table walk over the allowed
# masks, and the check function that consults both.
defaults:
  for: [c]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: hostmask-glob-matcher
    desc: Wildcard host-mask matcher defined with a body
    if:
      type: text
      regex: '\bint\s+wildcardfit\s*\([^)]{1,200}\)\s*\{'

  - id: hostmask-table-walk
    desc: Walks allowed host-mask table entry by entry
    if:
      type: text
      regex: '\b(authost|hostauth)\s*\[\s*i\s*\]\s*\[\s*0\s*\]'
      exclude_comments: true

  - id: hostmask-match-function
    desc: Host-mask authorization check function
    if:
      type: text
      regex: '\bint\s+HostMaskMatch\s*\(\s*char\s*\*\s*\w+\s*\)'
      exclude_comments: true

composite_rules:
  - id: operator-hostmask-authorization
    desc: Bot operator host-mask authorization gate over allowed masks
    crit: hostile
    attack: T1071
    all:
      - id: hostmask-glob-matcher
      - id: hostmask-table-walk
      - id: hostmask-match-function
