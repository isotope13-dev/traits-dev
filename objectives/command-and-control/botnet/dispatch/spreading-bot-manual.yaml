defaults:
  for: [text]
  platforms: [unix, windows]

traits:
  - id: bot-spreading-zombies-instruction
    desc: Instructions to acquire botnet zombies
    crit: notable
    if:
      type: text
      regex: '(?i)spreading bot.{0,40}(many|more) zombies'

  - id: bot-honeypot-evasion-claim
    desc: Bot spreading omitted to evade honeypots
    crit: notable
    if:
      type: text
      regex: '(?i)no spreading.{0,50}(detect|detection).{0,20}honeypots'

  - id: bot-update-instruction
    desc: Instruction to update to this bot
    crit: notable
    if:
      type: text
      regex: '(?i)then update to this bot'

composite_rules:
  - id: spreading-bot-operator-instructions
    desc: Bot instructions describe acquiring zombies and evading honeypots
    crit: hostile
    all:
      - id: bot-spreading-zombies-instruction
      - id: bot-honeypot-evasion-claim
      - id: bot-update-instruction
