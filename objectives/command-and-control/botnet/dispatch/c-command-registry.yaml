# Generic C++ command handler registry class declarations used by botnet
# and RAT dispatchers.
defaults:
  for: [c]
  platforms: [unix, windows]
  attack: T1059
  mbc: B0015

traits:
  - id: c-command-handler-inheritance
    desc: C++ command handler inheritance
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'class C[A-Za-z0-9_]{1,24} : public CCommandHandler'
      exclude_comments: true

  - id: c-command-registry-signature
    desc: C++ RegisterCommand method signature
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'void RegisterCommand\([A-Za-z0-9_* ]{4,40}'
      exclude_comments: true

composite_rules:
  - id: c-command-handler-registry
    desc: C++ command handler registry class
    crit: suspicious
    conf: 0.9
    all:
      - id: c-command-handler-inheritance
      - id: c-command-registry-signature
