# Keepalive replies and unknown-command errors alone are normal networking.
# Require the admitted packet-attack interface before inferring bot tasking.
# The same nearby string table supplies the task and reply formats; no
# command opcode, controller address, program name or payload path is required.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1095,T1498.001
composite_rules:
  - id: text-tasked-packet-attack-bot
    desc: Text-command bot accepts timed packet-attack tasks
    crit: hostile
    conf: 0.98
    near_bytes: 16384
    all:
      - id: objectives/impact/dos/attack/tasking::native-spoofable-packet-attack-interface
      - id: micro-behaviors/communications/socket/tcp::pong-integer-response-format
      - id: micro-behaviors/communications/socket/message::unknown-command-status-format
