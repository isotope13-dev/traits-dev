# Manuals shipped with IRC/web botnet kits describe the builder, the bot
# binary, the PHP admin panel and the in-channel command prefixes. The prose
# may be in any language, so only file names, option labels and command
# tokens are matched. Each is ordinary vocabulary alone; together they are
# a botnet operator's handbook.
defaults:
  platforms: [unix, windows]
  for: [html, text]
  attack: T1071
  mbc: B0042

traits:
  - id: bot-kit-builder-and-binary-files
    desc: Manual names builder and bot binary
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)Builder\.exe.{0,200}BOTBINARY\.EXE'

  - id: bot-kit-webadmin-panel-files
    desc: Manual names a WebAdmin panel and updater
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)/WebAdmin/.{0,160}index\.php.{0,60}updater\.php'

  - id: bot-kit-irc-flood-command-syntax
    desc: Manual shows quiet-prefix flood commands
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)!icmpflood\s+nospoof|@synflood\b'

  - id: bot-kit-kernel-driver-injection-options
    desc: Builder options include driver and injection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)Install Kernel Driver.{0,400}Inject Code to explorer\.exe'

composite_rules:
  - id: bot-kit-operator-manual
    desc: Manual covers builder, WebAdmin panel and IRC commands
    crit: hostile
    conf: 0.94
    all:
      - id: bot-kit-builder-and-binary-files
      - id: bot-kit-webadmin-panel-files
      - id: bot-kit-irc-flood-command-syntax
