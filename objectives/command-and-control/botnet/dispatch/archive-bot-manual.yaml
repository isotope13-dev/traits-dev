defaults:
  for: [text, html]
  platforms: [unix, windows]

traits:
  - id: manual-bot-archive-injection
    desc: Manual describes bot archive injection
    crit: notable
    if:
      type: text
      regex: '(?i)injects?\s+the\s+bot\s+exe.{0,50}rar files'

  - id: manual-download-execute-command
    desc: Manual describes download and execution
    crit: notable
    if:
      type: text
      regex: '(?i)downloads? a file and executes?'

composite_rules:
  - id: archive-infecting-bot-manual
    desc: Bot manual describes archive infection and download execution
    crit: hostile
    all:
      - id: manual-bot-archive-injection
      - id: manual-download-execute-command
