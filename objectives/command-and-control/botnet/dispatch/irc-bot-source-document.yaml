# IRC botnet source code in PDF printouts combining IRC protocol
# messaging with Windows command execution.
defaults:
  platforms: [windows]
  for: [pdf]
  attack: T1071,T1059
  mbc: B0015

traits:
  - id: irc-privmsg-format
    desc: IRC PRIVMSG channel message format
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: 'PRIVMSG %s :%s'

  - id: irc-pong-format
    desc: IRC PONG response format string
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: 'PONG :%s'

  - id: irc-winexec-call
    desc: WinExec command execution call
    crit: notable
    conf: 0.85
    if:
      type: text
      word: WinExec

composite_rules:
  - id: irc-bot-source-code
    desc: IRC bot source with PRIVMSG, PONG, and exec
    crit: suspicious
    conf: 0.92
    all:
      - id: irc-privmsg-format
      - id: irc-pong-format
      - id: irc-winexec-call
