# Bot manuals that mark up each command as <strong>!cmd</strong> (any prose
# language). Flood verbs, download and die verbs are the tasking set of a
# DDoS bot; the title line names the bot's purpose outright.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1071
  mbc: B0042

traits:
  - id: bot-markup-flood-commands
    desc: Manual marks up !icmp and !syn commands
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)<strong>\s*!icmp\s*</strong>.{0,200}<strong>\s*!syn\s*</strong>'

  - id: bot-markup-download-die-commands
    desc: Manual marks up !download and !die commands
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)<strong>\s*!download\s*</strong>.{0,600}<strong>\s*!die\s*</strong>'

  - id: ddos-bot-title-line
    desc: Manual titles itself a DDoS bot
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)</strong>\s*:\s*DDoS-bot\b'

composite_rules:
  - id: bot-markup-command-set
    desc: Manual marks up flood, download and die commands
    crit: hostile
    conf: 0.94
    all:
      - id: bot-markup-flood-commands
      - id: bot-markup-download-die-commands
