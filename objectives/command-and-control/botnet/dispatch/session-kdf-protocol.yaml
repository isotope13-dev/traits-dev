# Directional HKDF session-key labels (wrx-2/wtx-2/mac-2), fallback 0x0deaffed
# XOR packet framing, and binary attack-record parsing (0xff stop-all, 0xfe
# self-terminate, 5-byte IPv4/prefix target records).
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1095,T1573.001

traits:
  - id: c2-session-kdf-domain-labels
    desc: Directional C2 session KDF domain labels
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .rodata
      # "wrx-2\x01wtx-2\x01mac-2\x01"
      pattern: "77 72 78 2D 32 01 77 74 78 2D 32 01 6D 61 63 2D 32 01"

  - id: xor-deaffed-c2-packet-framing
    desc: XOR-0x0deaffed C2 packet framing call
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: "BA ED FF EA 0D [0-8] E8 ?? ?? ?? ??"

  - id: attack-record-target-option-parser
    desc: Attack-record parser for stop and targets
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      # Checks special vectors 0xff (stop all) and 0xfe (terminate) when
      # duration == 0, then validates targs_len * 5 target bytes.
      pattern: "80 7C 24 ?? FF 75 ?? 84 C0 74 ?? [10-20] E9 ?? ?? ?? ?? 80 7C 24 ?? FE 75 ?? 84 C0 74 ?? [10-20] E9 ?? ?? ?? ?? 83 FD 05 0F 84 [4] 44 0F B6 6B 05 45 84 ED 0F 84 [4] 8D 45 FA 41 0F B6 FD 89 44 24 ?? 4C 8D 3C BF"

composite_rules:
  - id: encrypted-kdf-attack-task-dispatcher
    desc: Directional-KDF and XOR-framed attack dispatch
    crit: hostile
    conf: 0.99
    all:
      - id: c2-session-kdf-domain-labels
      - id: attack-record-target-option-parser
      - id: xor-deaffed-c2-packet-framing
