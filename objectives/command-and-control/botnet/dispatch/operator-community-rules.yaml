# Rules shared inside a bot-author group: keep the group secret, keep the
# compiled bots private, and pass bots to friends. Each rule is ordinary
# wording alone; two of them together describe a botnet distribution group.
defaults:
  platforms: [unix, windows]
  for: [text]
  attack: T1071
  mbc: B0042

traits:
  - id: bot-group-secrecy-rule
    desc: Bot group secrecy rule forbids disclosure
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)do not ever tell anyone about this (site|group)'

  - id: bot-binaries-private-rule
    desc: Bot binaries kept private to the operator
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)exe.{0,4}should be kept to yourself'

  - id: bot-share-to-friend-rule
    desc: Instructs sharing another bot with a friend
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)give them your other bot'

composite_rules:
  - id: bot-group-operator-rules
    desc: Bot group rules keep binaries private and share bots
    crit: hostile
    conf: 0.9
    any:
      - id: bot-group-secrecy-rule
      - id: bot-binaries-private-rule
      - id: bot-share-to-friend-rule
    needs: 2
