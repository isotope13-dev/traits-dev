defaults:
  platforms: [unix, windows]
  for: [binaries]
traits:
  - id: attack-to-bots-dispatch-message
    desc: Reports dispatching attacks to multiple bots
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)Attack.{0,24}sent to.{0,16}bots'
  - id: bot-fleet-attack-console
    desc: Bot fleet attack accounting console
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)BOTS.{0,32}BUSY.{0,24}ATTACKS.{0,24}SPEED'
  - id: go-botnet-console-task-dispatch
    desc: Go console dispatches bot tasks
    crit: suspicious
    conf: 0.97
    for: [elf]
    if:
      type: symbol
      regex: '(^|[.:])main\.(sendToBots|freeBots|handleSession|loadUsers)$'
  - id: go-botnet-console-flood-commands
    desc: Go operator console exposes HTTP flood commands
    crit: suspicious
    conf: 0.98
    for: [elf]
    if:
      type: raw
      regex: '(?i)(http-byp|http-hur|httpkill)'
  - id: main-attack-server-functions
    desc: Bot console session and user handlers
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: symbol
      regex: '(^|[.:])main\.(handleSession|loadUsers|saveUsers|attackBanner)$'
  - id: go-main-api-ssh-handler-functions
    desc: Go bot API and SSH handlers
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: symbol
      regex: '(^|[.:])main\.(handleAPI|handleBinConnection|handleSSHConnection)$'
  - id: go-main-broadcast-handler-functions
    desc: Go bot server exposes bot broadcast handlers
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: symbol
      regex: '(^|[.:])main\.(broadcast|broadcastAll|broadcastToN)$'
  - id: go-main-geolocation-functions
    desc: Go geolocation and IP lookup handlers
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: symbol
      regex: '(^|[.:])main\.(lookupGeo|getCountry|getPublicIP)$'
  - id: shell-pipe-task-token
    desc: Pipe-delimited shell task token
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: raw
      # The task word is stored next to the "-c" argv slot passed to /bin/sh.
      # Some layouts pack the shell path inline between the two markers.
      regex: 'shell\|\x00{1,4}([ -~]{1,12}\x00)?-c'
      section: .rodata
composite_rules:
  - id: shell-pipe-flood-task
    desc: ELF bot runs a shell task beside a raw flood mode
    crit: hostile
    conf: 0.97
    for: [elf]
    attack: T1059.004,T1498
    near_bytes: 512
    all:
      - id: shell-pipe-task-token
      - id: micro-behaviors/fs/path/application/executable::bin-sh-path-reference
      - id: objectives/impact/dos/attack/flood::udpraw-mode
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: botnet-network-attack-dispatcher
    desc: Botnet console dispatches network flood attacks
    crit: hostile
    conf: 0.99
    attack: T1498.001,T1584
    all:
      - id: attack-to-bots-dispatch-message
      - id: objectives/impact/dos/multi-vector::native-network-flood-method-catalog
  - id: go-botnet-operator-flood-console
    desc: Go botnet operator dispatches HTTP flood tasks to bots
    crit: hostile
    conf: 0.99
    for: [elf]
    attack: T1498.001,T1059
    all:
      - id: go-botnet-console-task-dispatch
      - id: go-botnet-console-flood-commands
    any:
      - id: main-attack-server-functions
      - id: go-main-api-ssh-handler-functions
      - id: go-main-broadcast-handler-functions
      - id: go-main-geolocation-functions
