defaults:
  platforms: [windows, unix]
  for: [class]
  conf: 0.97
traits:
  - id: irc-bot-shell-command-help
    desc: IRC bot command help offers a channel shell
    crit: suspicious
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^Create a new shell for the channel$'
  - id: irc-bot-corrupt-command-help
    desc: IRC bot help offers file corruption
    crit: suspicious
    if:
      type: value
      path: class.strings[*]
      regex: '^[.!;]corrupt <file>[^\r\n]{0,80}$'
  - id: irc-file-infection-command
    desc: Operator command requests JVM file infection
    crit: suspicious
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^[.!;]infect(classes|jars)$'
composite_rules:
  - id: irc-shell-corruption-command-catalog
    desc: IRC bot advertises shell and file-corruption commands
    crit: hostile
    all:
      - id: irc-bot-shell-command-help
      - id: irc-bot-corrupt-command-help
      - id: metadata/import/jvm::irc-sendmessage-method-reference
  - id: irc-jvm-infection-dispatch
    desc: IRC command handler offers JVM file infection
    crit: hostile
    all:
      - id: irc-file-infection-command
      - id: metadata/import/jvm::irc-sendmessage-method-reference
      - id: objectives/impact/infect/binary::jvm-file-replacement-infection
