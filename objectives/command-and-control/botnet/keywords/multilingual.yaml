# Non-English botnet/compromised-host slang — operator vocabulary for the pool
# of victim machines and the act of recruiting them. 肉鸡 ("broiler chicken") and
# 抓鸡 ("catch chickens") are well-known Chinese slang for zombie hosts and mass
# compromise; near-zero outside attacker tooling. Cyrillic uses case-insensitive
# substr.
defaults:
  platforms: [unix, windows, android]
  for: [scripts, source, binaries, documents]
  crit: notable
  conf: 0.8
  attack: T1584
traits:
  - id: cn-zombie-host-slang
    desc: Chinese botnet-zombie slang
    if:
      type: text
      substr: 肉鸡
  - id: cn-mass-compromise-slang
    desc: Chinese mass-compromise slang
    if:
      type: text
      substr: 抓鸡
  - id: ru-botnet-term
    desc: Russian botnet term
    conf: 0.75
    if:
      type: text
      substr: ботнет
      case_insensitive: true
