defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: zombie-bot-bot
    desc: Zombie bot keyword
    conf: 0.5
    if:
      type: text
      regex: \bzombie[_\s]?bot\b
      case_insensitive: true
  - id: zombie-bot-net
    desc: Zombie bot keyword
    conf: 0.5
    if:
      type: text
      regex: \bzombie[_\s]?net\b
      case_insensitive: true
  - id: zombie-bot-army
    desc: Zombie bot keyword
    conf: 0.5
    if:
      type: text
      regex: \bzombie[_\s]?army\b
      case_insensitive: true
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: zombie-bot-horde
    desc: Zombie bot keyword
    conf: 0.5
    if:
      type: text
      regex: \bzombie[_\s]?horde\b
      case_insensitive: true
  - id: zombie-bot-node
    desc: Zombie bot keyword
    conf: 0.5
    if:
      type: text
      regex: \bzombie[_\s]?node\b
      case_insensitive: true
  - id: bot-zombie
    desc: Bot zombie keyword
    conf: 0.5
    if:
      type: text
      regex: \bbot[_\s]?zombie\b
      case_insensitive: true
  - id: agent-bot
    desc: Botnet agent term in control context
    conf: 0.8
    if:
      type: text
      regex: '\b(botnet|zombie)\b.{0,50}\bagent[_.\s-]?bot\b'
      case_insensitive: true
  - id: agent-bot-context-reverse
    desc: Botnet agent term before control context
    conf: 0.8
    if:
      type: text
      regex: '\bagent[_.\s-]?bot\b.{0,50}\b(botnet|zombie)\b'
      case_insensitive: true
  - id: slave-term
    desc: Botnet slave role keyword
    conf: 0.58
    if:
      type: text
      regex: \b(bot|zombie)[_.\s-]?slaves?\b|\bslaves?[_.\s-]?(bot|zombie)\b
      case_insensitive: true
    unless:
      - id: micro-behaviors/data/db/sql::sql-keyword-table
      - id: micro-behaviors/communications/modbus::protocol-usage
  # A routine the author named `botnet_init` / `botnetConnect`: survives string
  # encryption as a C++ mangled name or Go/Rust symbol (bazaar 3b46e51bf7a7
  # left `botnet_initRKNSt3__1...` in a stale export trie). The left bound
  # admits the Itanium length prefix; nothing follows it on the right.
  - id: botnet-routine-name
    desc: Routine named for botnet setup
    conf: 0.7
    if:
      type: text
      regex: '(?i)(^|[^a-z])botnet_?(init|start|setup|connect|register|join)'
composite_rules:
  - id: zombie-bot
    desc: Zombie bot keyword
    conf: 0.5
    any:
      - id: zombie-bot-bot
      - id: zombie-bot-net
      - id: zombie-bot-army
      - id: zombie-bot-horde
      - id: zombie-bot-node
