defaults:
  crit: suspicious
  platforms: [linux]
  for: [elf, go, shell, python]
  attack: T1573
traits:
# A bare hidden-path literal is one leg of the runtime-config signature: a
# mention in help text, a log line or a default value carries no malicious
# meaning on its own (xmeta's helpMsg documents `/tmp/.ais.conf` as a CLI
# example). These stay component; the suspicious verdict comes from the
# hidden-encrypted-runtime-config composite below, which requires corroborating
# temp-write, config-env or key-material evidence alongside the mention.
- id: hidden-tmp-dotfile-enc-cfg-path
  desc: Hidden tmp dotfile with enc/cfg suffix
  crit: component
  conf: 0.88
  if:
    type: literal
    regex: '/tmp/\.[A-Za-z0-9._-]{2,48}\.(enc|cfg)\b'
- id: hidden-tmp-dotfile-conf-key-path
  desc: Hidden tmp dotfile with conf/key suffix
  crit: component
  conf: 0.88
  if:
    type: literal
    regex: '/tmp/\.[A-Za-z0-9._-]{2,48}\.(conf|key)\b'
- id: hidden-tmp-dotfile-dat-path
  desc: Hidden tmp dotfile with dat suffix
  crit: component
  conf: 0.88
  if:
    type: literal
    regex: '/tmp/\.[A-Za-z0-9._-]{2,48}\.(dat)\b'
composite_rules:
- id: hidden-encrypted-runtime-config
  desc: Hidden encrypted runtime config
  crit: suspicious
  conf: 0.9
  all:
  - id: hidden-tmp-encrypted-config
  any:
  - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
  - id: metadata/file/policy/config/env::uppercase-config-env
  - id: metadata/file/policy/config/env::uppercase-key-env
  - id: objectives/anti-static/obfuscation/config::go-decryption-key-symbol
  needs: 2
- id: hidden-tmp-encrypted-config
  desc: Hidden encrypted config in tmp
  crit: component
  conf: 0.88
  any:
  - id: hidden-tmp-dotfile-enc-cfg-path
  - id: hidden-tmp-dotfile-conf-key-path
  - id: hidden-tmp-dotfile-dat-path
