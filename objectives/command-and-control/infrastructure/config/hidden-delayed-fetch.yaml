# A library that, some time after load, fetches a URL it keeps Base64-encoded
# and throws away every error. The encoding hides the endpoint from a reader of
# the source, the delay keeps the request out of the moment someone watches it
# load, and the empty catch keeps it silent when the endpoint is gone. None of
# that serves the library's caller; it serves whoever controls the URL.
#
# Worked example: spencer-baileys 1.0.0, a WhatsApp Web (Baileys) fork whose
# socket constructor waits 90 s, fetches a Base64-hidden JSON list of channel
# ids, and silently follows each one from the user's account.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1102
composite_rules:
  - id: base64-hidden-url-delayed-silent-fetch
    desc: Delayed silent fetch of a Base64-hidden URL
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
      - id: micro-behaviors/data/control-flow/error-handling::empty-catch-block
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64-literal-to-text
    any:
      - id: micro-behaviors/communications/http/request/client::node-fetch-import
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      # Loose form only: any HTTP client in the file. The bound form below
      # needs the fetch itself inside the callback.
      - id: micro-behaviors/communications/http/request/client::http-client-usage

  # Tight form: the same legs bound inside one delayed callback. The loose rule
  # above is file-scoped, so a large bundle can assemble it from a timer, a
  # catch, a decoded docs link and a fetch that have nothing to do with each
  # other. Here the decode, the decoded URL, the request, the swallowed error
  # and the long delay all sit within one callback's worth of bytes -- a
  # request whose target is hidden, fired late, and never allowed to surface
  # an error. No caller of a library needs that; hostile.
  - id: base64-hidden-url-delayed-silent-fetch-bound
    desc: Timer callback silently fetches a hidden URL
    crit: hostile
    conf: 0.95
    scope: file
    near_bytes: 1536
    all:
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
      - id: micro-behaviors/data/control-flow/error-handling::empty-catch-block
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64-literal-to-text
    any:
      - id: micro-behaviors/communications/http/request/client::node-fetch-import
      - id: micro-behaviors/communications/http/request/json::fetch-variable-near-json-response
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
