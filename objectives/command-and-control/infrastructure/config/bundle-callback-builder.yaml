# A builder that stamps a reverse-connect endpoint into an application bundle
# it assembles from a template tree.
#
# The implant itself may be a stock binary shipped alongside; what makes the
# artifact an implant is this step -- an operator-supplied `tcp://host:port`
# encoded into the bundle's configuration, an Info.plist written around a
# chosen name and bundle id, and the whole thing zipped for delivery. Nothing
# about it needs the payload to be present to be recognisable.
defaults:
  platforms: [macos, unix]
  for: [scripts, source]
  attack: T1571,T1036.005
  mbc: C0021

composite_rules:
  - id: app-bundle-callback-implant-builder
    desc: Builds an app bundle around a TCP callback
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/socket/uri::tcp-endpoint-url-template
      - id: micro-behaviors/fs/config/bundle::cfbundle-executable-key-reference
    any:
      - id: micro-behaviors/fs/file/copy::shutil-copytree
      - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
