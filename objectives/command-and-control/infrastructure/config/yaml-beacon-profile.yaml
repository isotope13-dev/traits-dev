# A C2 malleable/traffic profile written as YAML: the implant's beacon
# interval, its jitter, and the browser User-Agent it borrows so callbacks
# blend into web traffic. Operator and detection-lab profiles look the same.
defaults:
  platforms: [linux, macos, windows]
  for: [yaml]
  size_max: 262144
  attack: T1071.001

traits:
  - id: beacon-interval-setting
    desc: Config sets a beacon interval
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*(beacon_interval|interval_seconds|sleep_seconds)(_s|_ms)?\s*:\s*\d'

  - id: beacon-jitter-setting
    desc: Config sets callback jitter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s*(session_)?jitter(_percent|_pct|_ms|_s)?\s*:\s*\d'

  - id: browser-user-agent-setting
    desc: Config sets a browser User-Agent
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?mi)^\s*["'']?user[-_]agent["'']?\s*:\s*["'']?Mozilla/5\.0 \('

composite_rules:
  - id: yaml-c2-beacon-profile
    desc: YAML C2 profile with beacon timing and browser UA
    crit: suspicious
    conf: 0.88
    all:
      - id: beacon-interval-setting
      - id: beacon-jitter-setting
      - id: browser-user-agent-setting
