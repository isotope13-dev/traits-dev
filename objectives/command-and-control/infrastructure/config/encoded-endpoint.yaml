# Embedded C2 configuration carried in a Base64 string.  The useful structural
# signal is a decoded host:port followed by another delimited field, not the
# Kaiji marker or any one malware-family spelling.
defaults:
  platforms: [unix, windows]
  for: [go, python, elf, pyc, pe, dll]
  attack: T1027,T1071
  mbc: B0032,C0001

traits:
  - id: base64-ip-delimited-endpoint
    desc: Base64-delimited IPv4 C2 endpoint
    crit: suspicious
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      regex: '(?i)([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{2,5}\|[^|\r\n]{1,48}'

  - id: base64-domain-delimited-endpoint
    desc: Base64-delimited domain C2 endpoint
    crit: suspicious
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      regex: '(?i)([a-z][a-z0-9-]{0,62}\.)+[a-z]{2,}:[0-9]{2,5}\|[^|\r\n]{1,32}'

composite_rules:
  - id: base64-delimited-c2-endpoint
    desc: Base64-delimited C2 endpoint
    crit: suspicious
    conf: 0.94
    any:
      - id: base64-ip-delimited-endpoint
      - id: base64-domain-delimited-endpoint

  - id: c2-config-decoder-call
    desc: Decodes an embedded Base64 C2 configuration
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/data/decode/base64
      - id: micro-behaviors/data/encode/base64::go-base64-decode

  - id: c2-config-outbound-dial
    desc: Program has an outbound network connection capability
    crit: notable
    any:
      - id: micro-behaviors/communications/socket/dial

  - id: encoded-c2-endpoint-over-network
    desc: Base64-delimited C2 endpoint paired with outbound network capability
    crit: hostile
    conf: 0.98
    all:
      - id: base64-delimited-c2-endpoint
      - id: c2-config-outbound-dial

  - id: decoded-c2-config-network-path
    desc: Embedded delimited C2 configuration is decoded in a network-capable program
    crit: hostile
    conf: 0.97
    all:
      - id: base64-delimited-c2-endpoint
      - id: c2-config-decoder-call
      - id: c2-config-outbound-dial
