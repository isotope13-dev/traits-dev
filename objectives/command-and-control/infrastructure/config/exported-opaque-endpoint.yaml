# A package that ships its C2 as data for someone else to decode.
#
# `endpointmap` is a plausible REST-schema utility: validate(), buildUrl(),
# mergeHeaders(), a registry of timeouts and default headers. Among that
# registry are two short integer arrays commented "processed at init", and the
# package never processes them. XOR them with the package's own name and they
# read `https://files.catbox.moe` and `/j4loim.chk`.
#
# Nothing in the package fetches anything, so there is no network behaviour to
# match. What there is: opaque byte arrays exported as configuration next to
# real transport settings, which is not how configuration is written.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1102
  mbc: B0032

composite_rules:
  - id: exported-opaque-endpoint-config
    desc: Module exports opaque arrays as configuration
    crit: suspicious
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/embedded/payload/array::exported-opaque-integer-arrays
      - id: metadata/lang/javascript-features::module-exports-object

  # The same opaque arrays alongside the transport they are for: a POST method
  # option and a binary content type, defaulted in a package whose stated job
  # is validating request schemas. Configuration for a beacon the package does
  # not contain.
  #
  # The POST leg is either request-option form (`method: "POST"`) or the
  # plural supported-methods enumeration (`methods: ["GET", "POST", ...]`)
  # a registry ships instead of configuring one request. Both require their
  # option key, so a bare quoted token is still not enough: a Fetch/XHR
  # polyfill listing `"POST"` among HTTP verbs and sniffing
  # `application/octet-stream` for arraybuffer responses, or minified codecs
  # (jimp) packing that vocabulary next to PNG/GIF integer tables, is not a
  # configured beacon.
  - id: exported-opaque-endpoint-beacon-config
    desc: Opaque arrays ship with binary POST defaults
    crit: hostile
    conf: 0.93
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/embedded/payload/array::exported-opaque-integer-arrays
      - id: micro-behaviors/communications/email/mime::mime-octet-stream
    any:
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/post::supported-methods-post
    unless:
      # The atom, not the `ethers-js-bundle` composite it belongs to: a
      # composite suppressor is evaluated after the pass that reads `unless:`,
      # so `analyze` emitted this hostile while `test-rules` correctly
      # reported "Skipped by 'unless' condition". `_isProvider` is ethers v5's
      # Provider brand check and is specific enough alone.
      - id: well-known/lib/crypto/web3::ethers-provider-brand
      # An OpenAPI explorer documents HTTP for a living: "POST" and
      # "application/octet-stream" are its subject matter, not a transport it
      # configures.
      - id: well-known/lib/web/swagger-ui::swagger-ui-bundle-global
      # Third bundle carve-out, so state the shape rather than the product:
      # the three legs are integer arrays, the word POST and
      # "application/octet-stream" within 2KB, and a large minified bundle
      # packs unrelated modules that close together by construction.
      # Microsoft's Azure IoT Toolkit (vsciot-vscode.azure-iot-toolkit) scored
      # hostile on its webpack output, where the octet-stream and POST belong
      # to the Azure Storage SDK it vendors.
      - id: metadata/build/bundler/vscode::vscode-large-minified-extension-bundle
