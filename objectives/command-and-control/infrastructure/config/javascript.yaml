defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  attack: T1071.001
  mbc: C0002
composite_rules:
  - id: hardcoded-dual-port-c2-config
    desc: Hardcoded dual-port C2 configuration sidecar
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/config::server-host-const
      - id: metadata/package/config::http-port-const
      - id: metadata/package/config::https-port-const
      - id: metadata/package/config::upload-path-const
      - id: metadata/file/line::js-at-most-25-lines
      - id: micro-behaviors/communications/http/server/listener::hardcoded-server-host
      - id: micro-behaviors/communications/http/server/listener::dedicated-http-https-ports
    any:
      - id: "metadata/lang/source/naming/target::c2-server-binding-name"
      - id: metadata/lang/source/declaration::c2-url-constant-assignment
  - id: telemetry-upload-config
    desc: Hardcoded telemetry-style upload endpoint configuration
    crit: suspicious
    conf: 0.92
    attack: T1041
    all:
      - id: hardcoded-dual-port-c2-config
      - id: micro-behaviors/communications/http/request/configuration::upload-path-telemetry
