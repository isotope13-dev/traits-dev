defaults:
  for: [csharp]
  platforms: [windows, linux, macos]

traits:
  - id: csharp-enabled-fake-error-config
    desc: Configuration enables a documented fake error
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ((declaration_list
          (comment) @comment .
          (field_declaration (variable_declaration
            (variable_declarator (boolean_literal) @value))))
        (#match? @comment "(?i)fake error")
        (#eq? @value "true")
        )

  - id: csharp-commented-c2-server-config
    desc: Configuration labels a server as C2
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ((declaration_list
          (comment) @comment .
          (field_declaration (variable_declaration
            (variable_declarator (string_literal (string_literal_content) @value)))))
        (#match? @comment "(?i)(c&c|c2|command[ -]and[ -]control) server")
        )

composite_rules:
  - id: csharp-c2-config-fake-error
    desc: C2 server and enabled fake error configuration
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: csharp-enabled-fake-error-config
      - id: csharp-commented-c2-server-config
