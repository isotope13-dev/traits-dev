# A published editor extension whose endpoints are bare IP addresses reached
# over cleartext HTTP.
#
# Both halves are choices, and neither is one a maintained product makes. A
# domain name is what lets an operator move hosts, rotate providers and be
# reachable after a rebuild; hardcoding the address instead trades all of that
# away, and the thing it buys is not having to register anything that resolves
# back to you. Cleartext gives up confidentiality and integrity for traffic the
# extension is in a position to see — the user's prompts, their file contents,
# whatever the feature carries — and it means anyone on the path can read and
# rewrite the responses the extension acts on.
#
# The sample that motivated this is a ChatGPT relay for users behind a national
# firewall, with a numbered node list of raw IPs. That is not a disguise, it is
# how the service works; but it is also an extension routing a developer's code
# through unattributable infrastructure in the clear, which is worth surfacing
# whether the operator meant harm or simply did not care.
#
# Gated on the extension manifest so this does not fire on the test fixtures,
# RFC examples and documentation URLs that carry literal addresses everywhere in
# an ordinary dependency tree.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, archives]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: extension-cleartext-ip-endpoint
    desc: Extension endpoint is a cleartext bare IP
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url-code-literal
