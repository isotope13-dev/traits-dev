# A stripped native backdoor can hide its C2 address and port in an encrypted
# blob. This detects the reusable implementation pattern described by the
# TinyShell configuration-extraction report, not a family name or fixed key.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027,T1573.001
  mbc: C0027.009

composite_rules:
  - id: stripped-rc4-c2-config
    desc: Stripped ELF decrypts an RC4-protected C2 configuration
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/stream::rc4-ksa-swap-loop-x64
      - id: micro-behaviors/crypto/symmetric/stream::rc4-prga-xor-output-loop-x64
      - id: metadata/hardening/missing::stripped-binary
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/data/string/split::strtok-import

  - id: stripped-rc4-remote-shell
    desc: Stripped ELF uses RC4-obfuscated C2 settings for a socket-backed shell
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.004,T1573.001
    mbc: B0030.002
    all:
      - id: stripped-rc4-c2-config
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/direct::execve-import
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text

  - id: stack-key-rc4-c2-config
    desc: C2 configuration uses an RC4 stack-built key
    crit: hostile
    conf: 0.97
    all:
      - id: stripped-rc4-c2-config
    any:
      - id: micro-behaviors/data/string/assembly::stack-immediate-byte-string-x64
      - id: micro-behaviors/data/string/assembly::stack-immediate-byte-string-x86
