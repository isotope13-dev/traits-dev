# Discovered servers are cached on-device together with the symmetric
# key the server list returned for each one. Caching a first-party API
# host is ordinary; the suspicious shape is the combination of a
# server-list discovery route, a serialized AES-key field in its
# response vocabulary, and a local table that persists server
# addresses beside key columns for reuse after the servers rotate.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: sqlite-cached-server-aes-key
    desc: Server list supplies AES keys cached beside server domains
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript, elf, so]
    all:
      - id: micro-behaviors/data/db/schema/relational::server-key-cache-table
      - id: micro-behaviors/crypto/key/representation/material::aes-key-json-field
      - id: micro-behaviors/communications/url/resource-path/configuration::server-list-discovery-path
