defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1102

composite_rules:
  # Hex-obfuscated strings + RSA verify: resolves signed remote config. This
  # is suspicious infrastructure behavior, but signed configuration is also a
  # legitimate updater pattern; hostile intent requires stronger evidence.
  - id: java-obfuscated-signed-config-resolver
    desc: Java resolves hex-obfuscated RSA-signed remote config
    crit: suspicious
    conf: 0.98
    mbc: B0032
    scope: archive
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/hex::java-hex-pair-decoder
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream

  - id: java-obfuscated-signed-response-parser
    desc: Java verifies and Base64-parses hex-obfuscated signed responses
    crit: suspicious
    conf: 0.98
    attack: T1102,T1027
    mbc: B0032,C0027
    scope: archive
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/hex::java-hex-pair-decoder
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
