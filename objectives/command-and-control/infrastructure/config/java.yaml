defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1102

traits:
  # The helper is a custom HTTP response transport; naming the exact call
  # keeps this atom honest instead of claiming that RSA verification alone is
  # a network operation.
  - id: java-fieldworker-extension46-call
    desc: Java FieldWorker extension46 response call
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: io/proto/FieldWorker.extension46

composite_rules:
  - id: java-ethereum-signed-rpc-dead-drop
    desc: Java resolves signed configuration through an obfuscated RPC helper
    crit: hostile
    conf: 0.99
    attack: T1102,T1071.001,T1573.002
    mbc: B0030,B0032
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: java-fieldworker-extension46-call

  # Hex-obfuscated strings + RSA verify: resolves signed remote config. This
  # is suspicious infrastructure behavior, but signed configuration is also a
  # legitimate updater pattern; hostile intent requires stronger evidence.
  - id: java-obfuscated-signed-config-resolver
    desc: Java resolves hex-obfuscated RSA-signed remote config
    crit: suspicious
    conf: 0.98
    mbc: B0032
    scope: archive
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/hex::java-hex-pair-decoder
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream

  - id: java-obfuscated-signed-config-verifier
    desc: Java verifies an obfuscated signed config
    crit: suspicious
    conf: 0.96
    attack: T1027,T1553.002
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify

  - id: java-obfuscated-signed-response-parser
    desc: Java verifies and Base64-parses hex-obfuscated signed responses
    crit: suspicious
    conf: 0.98
    attack: T1102,T1027
    mbc: B0032,C0027
    scope: archive
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/hex::java-hex-pair-decoder
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
