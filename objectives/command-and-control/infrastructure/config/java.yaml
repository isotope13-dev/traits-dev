defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1102

traits:
  # The helper is a custom HTTP response transport; naming the exact call
  # keeps this atom honest instead of claiming that RSA verification alone is
  # a network operation.
  - id: java-fieldworker-extension46-call
    desc: Java FieldWorker extension46 response call
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: io/proto/FieldWorker.extension46

composite_rules:
  - id: java-ethereum-signed-rpc-dead-drop
    desc: Java resolves signed configuration through an obfuscated RPC helper
    crit: hostile
    conf: 0.99
    attack: T1102,T1071.001,T1573.002
    mbc: B0030,B0032
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: java-fieldworker-extension46-call

  # Hex-obfuscated strings + RSA verify: resolves signed remote config. This
  # is suspicious infrastructure behavior, but signed configuration is also a
  # legitimate updater pattern; hostile intent requires stronger evidence.
  - id: java-obfuscated-signed-config-resolver
    desc: Java resolves hex-obfuscated RSA-signed remote config
    crit: suspicious
    conf: 0.98
    mbc: B0032
    scope: archive
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/hex::java-radix16-string-parse
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream

  # Same dead-drop shape as java-obfuscated-signed-config-resolver, one
  # obfuscation generation on: the endpoint pool and the embedded public key are
  # rebuilt at run time by an int-array string decoder instead of a hex table,
  # and the transport is java.net.http.HttpClient instead of URLConnection.
  # Hostile where the hex variants stay suspicious, because the decoder hides
  # the endpoints themselves -- a legitimate signed-config client publishes the
  # host it talks to, and only the payload needs the signature. Archive scope
  # matches the hex-obfuscated sibling: decoder, verify, and HttpClient POST
  # often live in different helper classes inside one JAR.
  - id: java-int-array-signed-config-fetch
    desc: Java fetches RSA-signed config from int-array-obfuscated endpoints
    crit: hostile
    conf: 0.97
    attack: T1102,T1071.001,T1027,T1573.002
    mbc: B0030,B0032
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode

  - id: java-obfuscated-signed-config-verifier
    desc: Java verifies an obfuscated signed config
    crit: suspicious
    conf: 0.96
    attack: T1027,T1553.002
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify

  - id: java-obfuscated-signed-response-parser
    desc: Java verifies and Base64-parses hex-obfuscated signed responses
    crit: suspicious
    conf: 0.98
    attack: T1102,T1027
    mbc: B0032,C0027
    scope: archive
    all:
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/hex::java-radix16-string-parse
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
