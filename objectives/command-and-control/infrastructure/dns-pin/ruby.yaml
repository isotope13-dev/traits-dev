# Resolving a host name first and fetching the payload from the bare address
# keeps the name out of the request and out of proxy logs. The launch atom
# already requires the body to be written to /tmp, made executable and run.
defaults:
  for: [ruby]
  platforms: [unix]

composite_rules:
  - id: ruby-resolved-address-payload-launch
    desc: Runs payload fetched from resolved address
    crit: hostile
    conf: 0.96
    attack: T1105,T1568
    all:
      - id: micro-behaviors/communications/dns/resolver::resolv-getaddress
      - id: micro-behaviors/process/deploy/file-exec/command::ruby-http-body-executable-file-launch
