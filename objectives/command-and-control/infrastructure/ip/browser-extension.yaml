# A browser extension that both grants a public-IP origin and implements an
# HTTP client. Extensions normally address durable product backends by name;
# an address hard-coded into a manifest cannot be repointed without an update
# and is characteristic of short-lived operator infrastructure.
#
# Loopback and RFC1918 are excluded: an extension talking to 127.0.0.1 is a
# developer build or a companion app on the same machine, which is common and
# uninteresting.
defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip]
  attack: T1583.003
  mbc: B0030

composite_rules:
  - id: published-extension-public-ip-client
    desc: Extension HTTP client targets public IP
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/host::external-ip-host-permission
      - id: metadata/permission/manifest::chrome-extension-basic-metadata
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
