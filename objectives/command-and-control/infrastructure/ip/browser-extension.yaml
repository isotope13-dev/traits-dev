# A published browser extension whose manifest grants it access to a bare IPv4
# address. Add-ons are distributed through a store, versioned, and reviewed;
# their backends live on names, because a name can be moved, renewed and put
# behind a CDN. An address hard-coded into the manifest is infrastructure that
# was stood up for this build and cannot be repointed without shipping an
# update -- which is how throwaway C2 is written, not how a product is.
#
# Loopback and RFC1918 are excluded: an extension talking to 127.0.0.1 is a
# developer build or a companion app on the same machine, which is common and
# uninteresting.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]
  attack: T1583.003
  mbc: B0030

traits:
  - id: extension-bare-ip-host-permission
    desc: Extension host permission is a bare IP
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: host_permissions[*]
      # Anchored to the whole host-permission value, which always begins
      # with a scheme (or `*`) and ends the host with `:` or `/`. Unanchored,
      # a bare dotted-quad pattern is short enough to match anywhere.
      regex: '^[a-z*]{1,6}://[0-9]{1,3}(\.[0-9]{1,3}){3}[:/]'
    not:
      - regex: '://(127|10|0)\.'
      - regex: '://192\.168\.'
      - regex: '://172\.(1[6-9]|2[0-9]|3[01])\.'
