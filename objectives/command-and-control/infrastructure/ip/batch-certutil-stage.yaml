defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: batch-certutil-arch-stage-profile
  desc: Batch certutil and TCP architecture stage clues
  mbc: B0024
  all:
  - id: objectives/command-and-control/infrastructure/ip::raw-ip-tcp-arch-stage-query
  - id: micro-behaviors/communications/http/download/cli::certutil-urlcache-split-force
  - id: micro-behaviors/os/sysinfo/platform/arch::wmic-os-architecture
  - id: micro-behaviors/fs/path/system::users-public-executable-path
  any:
  - id: micro-behaviors/process/create/shell/command-mode::start-empty-window-title
  - id: micro-behaviors/fs/delete/file/command::del-command
  crit: suspicious
  conf: 0.9
  attack: T1105
