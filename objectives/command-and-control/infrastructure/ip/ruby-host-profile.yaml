# Host name, account and platform folded into a Base64 query parameter for a
# hard-coded public IPv4 endpoint: a check-in, not an API call.
defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: ruby-host-profile-raw-ip-checkin
    desc: Sends encoded host profile to raw IP
    crit: hostile
    conf: 0.95
    attack: T1071.001,T1082
    all:
      - id: micro-behaviors/os/sysinfo/profile::ruby-system-identity-queries
      - id: micro-behaviors/communications/url/construction/query::url-param-info-base64
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
