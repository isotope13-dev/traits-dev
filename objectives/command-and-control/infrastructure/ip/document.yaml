# Migrated verbatim (2026-11-07) from cleave's office analyzer, which
# hardcoded it in Rust: several IPv4:port endpoints written into a document's
# text or macros, the shape of a loader's C2 list.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows]

traits:
  - id: hardcoded-ipv4-port-list-document
    desc: Multiple hardcoded IPv4 endpoints in document
    crit: suspicious
    conf: 0.9
    mbc: B0030
    attack: T1071.001
    count_min: 3
    if:
      type: text
      regex: '\b(\d{1,3}\.){3}\d{1,3}:\d{2,5}\b'
