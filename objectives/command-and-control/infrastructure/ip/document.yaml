# Migrated (2026-11-07) from cleave's office analyzer, which hardcoded it in
# Rust: several IPv4:port endpoints written into a document's text, the shape
# of a loader's C2 list.
#
# The string extractor also renders binary sockaddr-like byte runs inside
# embedded executables as standalone "a.b.c.d:port" strings, so counting
# standalone extracted endpoints counted machine code, not document text (an
# MSI's custom-action DLLs produced four).  Each leg requires the endpoints
# as written characters: three in one extracted run, or three literal
# endpoints in the file bytes, in ASCII or UTF-16LE.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows]

composite_rules:
  - id: hardcoded-ipv4-port-list-document
    desc: Multiple hardcoded IPv4 endpoints in document
    crit: suspicious
    conf: 0.9
    mbc: B0030
    attack: T1071.001
    any:
      - id: micro-behaviors/communications/ip/ipv4::document-ipv4-endpoint-run
      - id: micro-behaviors/communications/ip/ipv4::document-ipv4-endpoint-literals-many
      - id: micro-behaviors/communications/ip/ipv4::document-ipv4-endpoint-utf16-literals-many
