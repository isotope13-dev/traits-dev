# A literal external IPv4 HTTP target is an objective-level signal only when
# paired with an actual Python request API. The underlying assignment and
# network behaviors are neutral capabilities under micro-behaviors.
defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: C0002
  attack: T1071.001

composite_rules:
  - id: python-external-ip-http-request
    desc: Python HTTP request targets an external IPv4 literal
    crit: suspicious
    conf: 0.9
    near_bytes: 240
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call

  - id: python-external-ip-payload-stager
    desc: Python executes payload from external-IP endpoint
    crit: hostile
    conf: 0.995
    near_bytes: 512
    all:
      - id: python-external-ip-http-request
    any:
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::python-http-response-import-exec
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::python-hidden-temp-world-writable-payload
