# A literal external IPv4 HTTP target is an objective-level signal only when
# paired with an actual Python request API. The underlying assignment and
# network behaviors are neutral capabilities under micro-behaviors.
defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: C0002
  attack: T1071.001

composite_rules:
  - id: python-external-ip-http-request
    desc: Python HTTP request targets an external IPv4 literal
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/communications/ip/endpoint::python-requests-external-ip-url
      - id: micro-behaviors/communications/ip/endpoint::python-urllib-external-ip-url
