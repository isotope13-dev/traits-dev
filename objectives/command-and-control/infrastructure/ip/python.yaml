defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: C0002
  attack: T1071.001

composite_rules:
  - id: python-external-ip-payload-stager
    desc: Python executes payload from external-IP endpoint
    crit: hostile
    conf: 0.995
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
    any:
      - id: objectives/execution/payload/script-eval/network/in-process::python-http-response-import-exec
      - id: objectives/execution/payload/file-exec/command/chmod::python-hidden-temp-world-writable-payload
