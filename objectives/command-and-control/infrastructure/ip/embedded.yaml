# Multiple routable IPv4 endpoints can represent fallback C2 infrastructure.
# The Office analyzer also emits this ID from a broad endpoint-text heuristic.
# Endpoint references in a document do not establish network or C2 behavior.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, manifests, data, documents]
  mbc: B0030
  attack: T1071.001

traits:
  - id: hardcoded-ipv4-port-list-any
    desc: Multiple hardcoded external IPv4 endpoints
    crit: suspicious
    conf: 0.9
    count_min: 3
    if:
      id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-any
    unless:
      - id: metadata/document/office/properties::office-word-excel-powerpoint-kind
      - type: value
        path: network.interfaces
        size_max: 0
      - id: metadata/package/testing/presence/harness::registry-request-cache-data
      - id: metadata/document/office/external-link::ooxml-external-many
