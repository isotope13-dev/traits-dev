# Hardcoded http(s)://<external-ip>/<file>.php endpoints are the
# canonical webshell drop-box / supply-chain implant C2 shape. There is
# essentially no legitimate engineering reason to combine bypass-DNS
# via a literal external IP with a raw .php request URI in production
# code. Encoded variants additionally require operator wrapping behind
# a decoder, which is itself an obfuscation signal.
# Each composite below fires on ONE literal that holds both halves: pairing
# an IP URL from one string with a .php URL from a nearby but different
# string (adjacent rows of a referral table, dense config) is not this
# shape, so proximity pairing is deliberately not used here.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  mbc: C0002
  attack: T1071.001
composite_rules:
  - id: external-ip-php-endpoint
    desc: URL combines external IP and .php
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::url-ip-php-endpoint-script
    unless:
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-ninjafirewall
      - id: well-known/lib/runtime/osano::osano-consent-manager
      - id: metadata/package/testing/harness/unit::rust-test

  - id: external-ip-php-endpoint-encoded
    desc: Encoded URL has IP and .php
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::url-ip-php-endpoint-encoded
    unless:
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-ninjafirewall
      - id: well-known/lib/runtime/osano::osano-consent-manager
      - id: metadata/package/testing/harness/unit::rust-test

  - id: external-ip-php-query-endpoint
    desc: URL has external IP and .php query
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::url-ip-php-query-script
    unless:
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-ninjafirewall
      - id: well-known/lib/runtime/osano::osano-consent-manager
      - id: metadata/package/testing/harness/unit::rust-test
