# IP/PHP URL structure lives in micro-behaviors; only an attack-specific
# check-in query supplies the C2 claim here.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  mbc: C0002
  attack: T1071.001
composite_rules:
  - id: external-ip-php-init-beacon
    for: [source, scripts, '!jcl']
    desc: External IP PHP init beacon
    conf: 0.99
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::url-ip-php-query-script
      - id: objectives/exfiltration/http/query::init-event-id-data-query
    unless:
      - id: well-known/app/publishing/wordpress-plugins/security::wordpress-plugin-path-ninjafirewall
      - id: well-known/lib/runtime/scripted/osano::osano-consent-manager
      - id: metadata/package/testing/harness/unit::rust-test
