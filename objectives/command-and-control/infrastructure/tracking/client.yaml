# C2 Client Tracking Database/Schema Detection
# Detects data structures used by C2 servers to track compromised endpoints
# ATT&CK: T1071 (Application Layer Protocol)
defaults:
  platforms: [windows, unix]
  crit: component
  conf: 0.7
  for: [javascript, php, python, java, csharp]
traits:
# === C2 tasking fields - JSON/Python style ===
- id: sleep-interval-field-peewee
  desc: Sleep interval field in Peewee model
  if:
    type: text
    regex: 'sleep\s*=.{0,50}Field'
- id: persist-field-peewee
  crit: notable
  desc: Persistence field in Peewee model
  if:
    type: text
    regex: 'persist\s*=.{0,50}Field'
- id: last-result-field-peewee
  crit: notable
  desc: Last result field in Peewee model
  if:
    type: text
    regex: 'last_result\s*=.{0,50}Field'
  # === Victim tracking fields - JSON style ===
- id: av-json-field
  desc: AV JSON field
  conf: 0.75
  if:
    type: text
    regex: '(?i)["'']av["'']\s*:'
  # === Victim tracking fields - Peewee/ORM style ===
- id: av-assignment-field
  desc: AV field in Peewee model
  if:
    type: text
    regex: '\bAv\b\s*=.{0,50}Field'
- id: last-seen-field
  crit: component
  desc: Last-seen field marker
  if:
    type: text
    regex: 'last_seen\s*[=:]'
- id: last-seen-field-peewee
  crit: notable
  desc: Last seen field in Peewee model
  if:
    type: text
    regex: 'last_seen\s*=.{0,50}Field'
  # === IP/Country tracking - Peewee style ===
- id: ip-field-peewee
  desc: IP address field in Peewee model
  if:
    type: text
    regex: '(?i)\bip\b\s*=.{0,50}Field'
- id: clients-table-peewee
  crit: notable
  desc: Clients table in Peewee model
  if:
    type: text
    regex: 'table_name\s*=\s*["'']clients["'']'
- id: client-model-class
  crit: notable
  desc: ORM client record model class
  if:
    type: text
    # C2 panels persist tracked bots through an ORM model; require that
    # subclassing shape. A bare `class Client(...)` also matches every API
    # wrapper (pypsexec's SMB client is `class Client(object)`), which is not
    # victim-tracking evidence.
    regex: '^class\s+Client\s*\(\s*((peewee\.)?(Model|Base)|db\.Model|models\.Model|Base)\s*[\),]'
  # === Victim info field patterns - JSON style ===
- id: databases-init-peewee
  crit: notable
  desc: Database initialization with DatabaseProxy
  for: [python]
  if:
    type: symbol
    exact: DatabaseProxy
- id: sqllitedb-init
  crit: notable
  desc: SqliteDatabase initialization
  for: [python]
  if:
    type: symbol
    exact: SqliteDatabase
- id: c2-session-manager-doc
  desc: C2 server session manager documentation
  for: [python]
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)session management for C2 server|C2 server.{0,80}session management'
- id: command-queue-sql-field
  crit: notable
  desc: Command queue field in SQL session schema
  for: [python]
  if:
    type: text
    regex: '\bcommand_queue\b\s+(TEXT|VARCHAR|JSON)|SELECT\s+command_queue\s+FROM\s+sessions'
# Bare SQL column names: any local API or job log can declare
# `response_data TEXT` / `response TEXT` (wechat-cli's idempotency cache
# does); only the C2 session composite reads them as implant tasking.
- id: response-data-sql-field
  crit: component
  desc: Response data field in SQL session schema
  for: [python]
  if:
    type: text
    regex: '\bresponse_data\b\s+(TEXT|VARCHAR|JSON)'
- id: response-history-sql-field
  crit: component
  desc: Command response field in SQL history schema
  for: [python]
  if:
    type: text
    regex: '\bresponse\b\s+(TEXT|VARCHAR|JSON)'
  not:
    - substr: response JSON
    - substr: token response JSON
composite_rules:
  # C2 server database schema: tasking + tracking fields together
- id: c2-tasking-schema
  desc: Nearby command and task-state fields
  crit: notable
  conf: 0.8
  attack: "T1071"
  near_lines: 80
  any:
  - id: micro-behaviors/data/serialize/schema-object::command-field-key
  - id: micro-behaviors/data/serialize/schema-object::sleep-interval-field-key
  - id: micro-behaviors/data/serialize/schema-object::persistence-field-key
  - id: metadata/lang/source/syntax/key-value::last-result-field
  - id: micro-behaviors/data/db/orm::python-model-command-field
  - id: sleep-interval-field-peewee
  - id: persist-field-peewee
  - id: last-result-field-peewee
  needs: 3
  unless:
  - id: well-known/tool/offensive/sic-security/
  - id: metadata/build/generated::sphinx-searchindex-js
  - id: well-known/lib/development/vscode::require-vscode
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: metadata/package/runtime::vscode-extension
  # A lexicon corpus contains every common word as a key, so field-name
  # coincidence carries no schema meaning there.
  - id: metadata/file/format/wordlist::headword-parts-of-speech-entries
  # Victim system info fields composite
- id: c2-victim-tracking
  desc: Host-profile fields near task or control fields
  crit: suspicious
  conf: 0.85
  attack: "T1082"
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/serialize/schema-system::host-identity-field-cluster
  any:
  - id: micro-behaviors/data/serialize/schema-object::command-or-cmd-field-key
  - id: micro-behaviors/data/serialize/schema-object::sleep-interval-field-key
  - id: micro-behaviors/data/serialize/schema-object::persistence-field-key
  - id: av-json-field
  - id: av-assignment-field
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
  - id: micro-behaviors/process/interpreter/vm::yarn-release-bundle
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: well-known/lib/development/vscode::require-vscode
- id: c2-server-database
  desc: Client database and command tasking field names
  crit: suspicious
  conf: 0.95
  attack: "T1071"
  all:
  - id: c2-tasking-schema
  any:
  - id: micro-behaviors/data/serialize/schema-system::host-identity-field-cluster
  - id: av-json-field
  - id: av-assignment-field
  - id: last-seen-field
  - id: last-seen-field-peewee
  - id: metadata/lang/source/syntax/key-value::clients-key
  - id: clients-table-peewee
  - id: client-model-class
  - id: ip-field-peewee
  - id: micro-behaviors/data/db/schema/relational::country-field-declaration
  - id: databases-init-peewee
  - id: sqllitedb-init
  unless:
  - id: "metadata/lang/source/shape::large-unparsed-source-corpus"
  - id: metadata/build/generated::sphinx-searchindex-js
- id: c2-command-session-manager
  for: [python]
  desc: C2 command session manager database
  crit: hostile
  conf: 0.96
  attack: "T1071"
  all:
  - id: c2-session-manager-doc
  - id: command-queue-sql-field
  - id: micro-behaviors/data/db/schema/relational::sessions-table-sql
  any:
  - id: response-data-sql-field
  - id: response-history-sql-field
