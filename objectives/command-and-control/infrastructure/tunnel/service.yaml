defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.8
  for:
    - scripts
    - binaries
traits:
  # ngrok and localhost.run live canonically in
  # objectives/command-and-control/infrastructure/domain/tunnel/traits.yaml
  # (per-variant atoms + the ngrok-tunnel composite). Referencing composites
  # point there; this file holds only services unique to it.
  - id: pipe-run
    desc: pipe.run tunneling service reference
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pipe\.run\b'
    unless:
      # Lighthouse's embedded third-party URL catalog contains this legacy
      # Yahoo Pipes path; it is not a tunnel endpoint used by the bundle.
      - id: well-known/lib/platform/browser-automation/automation-context::chrome-devtools-ad-catalog-context
      - id: well-known/tool/development/mobile/react-native-devtools::official-package-context
      - id: well-known/lib/ai/haystack-ai::haystack-pipeline-run-example
  - id: serveo
    desc: serveo.net tunneling service
    if:
      type: text
      regex: serveo\.net\b
    unless:
      # ConnectWise's test fixture uses a Serveo URL as sample configuration;
      # it is not an endpoint contacted by the package.
      - type: basename
        regex: '(?i)^fixtures(?:\.cpython-[0-9]+)?\.pyc?$'
      - id: well-known/tool/detection/guardlayer::tool-policy-exfil-service-denylist
  - id: telebit
    desc: telebit.cloud tunneling service
    if:
      type: text
      regex: telebit\.cloud\b
    unless:
      - id: well-known/lib/network/public-suffix-list::public-suffix-list-content
      - id: metadata/file/format/source-map::sourcemap-sources-content
  # `pinggy` removed: it duplicated `domain/tunnel::pinggy-io`, whose regex
  # covers the same two hosts plus their generated subdomains, so every project
  # naming a Pinggy endpoint was reported once from each directory. Per the note
  # at the top of this file, a service that already has a canonical atom over
  # there does not get a second one here.

composite_rules:
  - id: anonymous-pinggy-ssh-forward
    for: [python]
    desc: Anonymous Pinggy SSH port-forward tunnel
    crit: hostile
    conf: 0.99
    attack: T1572
    all:
      - id: objectives/command-and-control/infrastructure/domain/tunnel::pinggy-io
      - id: metadata/import/python/paramiko
      - id: micro-behaviors/communications/ssh/client::python-empty-password-auth
      - id: micro-behaviors/communications/ssh/connect::python-ssh-request-port-forward
  - id: pypi-wheel-default-trycloudflare-collector-exfil
    for: [whl, python, pkginfo]
    desc: Placeholder wheel defaults collector to quick-tunnel endpoint
    crit: hostile
    conf: 0.98
    attack: T1572,T1041
    scope: archive
    all:
      - id: objectives/exfiltration/oob/system-profile::python-tunnel-host-inventory-json-exfil
      - id: metadata/package/description/presence::pkginfo-placeholder-first-release
      - id: micro-behaviors/os/env/read/variable::python-os-getenv-call
