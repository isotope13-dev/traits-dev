# C2 bot tracking database access
# Detects server-side scripts that query databases to track/manage
# compromised endpoints (bots/miners) in a C2 infrastructure.
# ATT&CK: T1071.001 (Application Layer Protocol: Web Protocols)
# ATT&CK: T1082 (System Information Discovery)
defaults:
  for: [php]
  platforms: [windows, unix]
  crit: suspicious
  attack: T1071.001

traits:
  - id: bot-tracking-data-marker
    desc: Bot-management data marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(beacon|implant|miner|last[_ -]?seen)\b'
  - id: bot-status-data-marker
    desc: Bot status or command queue marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(bot[_ -]?(id|status)|command[_ -]?queue)\b'
  - id: download-execute-action-marker
    desc: Database queue stores fetch/execute command
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)Download\s*&\s*Execute'
  - id: infected-client-online-marker
    desc: Command runs when infected client reconnects
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)Infected Clients?[^.]{0,120}go Online'

composite_rules:
  - id: c2-bot-data-api
    desc: Database API for bot-management data
    crit: hostile
    conf: 0.95
    mbc: B0030
    all:
      - id: micro-behaviors/data/db/mysql::php-mysqli-connect
      - id: micro-behaviors/data/db/sql::sql-select
    any:
      - id: bot-tracking-data-marker
      - id: bot-status-data-marker
    unless:
      - id: well-known/app/publishing/wordpress-plugins::wordpress-maintenance-plugin
  - id: c2-command-queue-download-execute
    desc: C2 queues download-and-execute actions for infected clients
    crit: hostile
    conf: 0.99
    mbc: B0030
    attack: "T1071.001, T1105"
    all:
      - id: micro-behaviors/data/db/mysql::php-mysqli-connect
      - id: micro-behaviors/data/db/sql::sql-insert
      - id: download-execute-action-marker
      - id: infected-client-online-marker
    unless:
      - id: well-known/app/publishing/wordpress-plugins::wordpress-maintenance-plugin
