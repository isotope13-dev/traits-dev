# C2 infrastructure agent tracking DB
# Detects database query patterns used by C2 teamservers to track compromised agents.
defaults:
  for: [go, elf, macho, pe, python]
  platforms: [linux, macos, windows]
  attack: T1071
  mbc: B0030

traits:
  - id: c2-parent-agent-id
    desc: SQL statement references parent agent ID
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(SELECT|INSERT|UPDATE|DELETE)\b.{0,80}\bParentAgentID\b'

  - id: c2-link-agent-id
    desc: SQL statement references linked agent ID
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(SELECT|INSERT|UPDATE|DELETE)\b.{0,80}\bLinkAgentID\b'

composite_rules:
  - id: c2-agent-topology-db
    desc: C2 teamserver agent topology database
    crit: suspicious
    conf: 0.95
    all:
      - id: c2-parent-agent-id
      - id: c2-link-agent-id
