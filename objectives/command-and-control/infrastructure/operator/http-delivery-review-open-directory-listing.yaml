defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1608.001


composite_rules:
  - id: open-directory-malware-staging-listing
    desc: Open directory lists EXEs named for stealers and RATs
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/format/apache-autoindex::index-of-title
      - id: micro-behaviors/ui/window/html::directory-index-exe-links
      - id: micro-behaviors/ui/window/html::index-malware-family-link-names
