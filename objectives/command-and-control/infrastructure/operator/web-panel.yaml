# The operator's browser window.
#
# The console traits next door describe a CLI: `show sessions`, `interact
# with agent`. A framework with a web front end puts the same job behind a
# page -- a table of hosts that have checked in, a box to type a command
# into, and a button that builds the next implant. The vocabulary survives
# translation between frameworks because the job does not change; what
# changes is the tool's name, which is why nothing here mentions one.
#
# Each atom is a fragment of an ordinary admin panel on its own: fleet
# dashboards list hosts and their last check-in too. The pairing is what
# separates them -- an inventory of machines beside a control that produces
# the software those machines are running.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: component
  conf: 0.85
  attack: T1071

traits:
  - id: implant-build-control
    desc: Control that builds an implant
    crit: notable
    if:
      # `>Generate Payload<`. An administrative console configures software
      # someone else built; this one ships the builder with the panel.
      type: text
      regex: '(?i)\b(generate|build)\s+(payload|implant|stager)\b'

  - id: checkin-inventory-table
    desc: Table of hosts and their last check-in
    if:
      # Session ID beside Last Seen: rows are machines that called home, not
      # records a person created.
      type: text
      regex: '(?i)>\s*session id\s*<[\s\S]{0,300}>\s*last seen\s*<'

  - id: browser-command-console
    desc: Command box wired to an output pane
    if:
      # `id="command-input"` with `id="output-content"` -- a shell rendered
      # as a form, which is what remote command execution looks like once it
      # has a front end.
      type: text
      regex: '(?i)id="(cmd|command)[-_](input|line|box)"'

composite_rules:
  # An inventory of machines that check in, and a way to act on them from the
  # page. Two of the three is a panel for operating implants.
  - id: c2-web-operator-panel
    desc: Web panel for operating implants
    crit: hostile
    conf: 0.93
    needs: 2
    any:
      - id: implant-build-control
      - id: checkin-inventory-table
      - id: browser-command-console
