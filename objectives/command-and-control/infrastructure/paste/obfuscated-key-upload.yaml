# Pastebin uploads that hide the developer API key behind base64+zlib
# (often with a constant prefix strip). Distinct from plaintext SDK usage —
# catches future PyPI helpers that stage loot via paste services.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1567,T1027.010
  mbc: E1567

traits:
  - id: pastebin-api-post-endpoint
    desc: Pastebin api_post.php upload endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: pastebin.com/api/api_post.php

  - id: pastebin-api-dev-key-field
    desc: Pastebin api_dev_key form field
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: api_dev_key

  - id: b64decode-then-zlib
    desc: Base64 decode feeds zlib decompress
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'b64decode\s*\([^)]{0,60}\)[\s\S]{0,80}zlib\.decompress'

  - id: zlib-then-b64decode
    desc: zlib decompress of Base64 decode
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'zlib\.decompress\s*\([^)]{0,40}b64decode'

composite_rules:
  - id: zlib-b64-secret-decode
    desc: Base64 then zlib decompress secret decode
    crit: suspicious
    conf: 0.94
    any:
      - id: b64decode-then-zlib
      - id: zlib-then-b64decode

  - id: pastebin-obfuscated-key-upload
    desc: Pastebin upload with obfuscated API key
    crit: hostile
    conf: 0.98
    all:
      - id: pastebin-api-post-endpoint
      - id: pastebin-api-dev-key-field
      - id: zlib-b64-secret-decode
    any:
      - id: pastebin
      - id: objectives/command-and-control/dropper/delivery/multistage::pastebin-raw-fetch
