# Pastebin uploads that hide the developer API key behind base64+zlib.
# Generic encoding and compression remain capability observations; the
# objective requires the Pastebin upload surface and key field as context.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1567,T1027.010
  mbc: E1567

traits:
  - id: pastebin-api-post-endpoint
    desc: Pastebin api_post.php upload endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: pastebin.com/api/api_post.php

  - id: pastebin-api-dev-key-field
    desc: Pastebin api_dev_key form field
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: api_dev_key

composite_rules:
  - id: pastebin-obfuscated-key-upload
    desc: Pastebin upload with obfuscated API key
    crit: hostile
    conf: 0.98
    all:
      - id: pastebin-api-post-endpoint
      - id: pastebin-api-dev-key-field
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
    any:
      - id: pastebin
      - id: objectives/command-and-control/dropper/delivery/multistage::pastebin-raw-fetch
