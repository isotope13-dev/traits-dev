defaults:
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.7
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - scripts
  - binaries
  - apk
  - alpine_apk
traits:
- id: hastebin
  desc: Hastebin reference
  if:
    type: text
    substr: hastebin.com
  unless:
  - id: objectives/credential-access/cloud/token/oauth::sharex-uploaderslib-assembly
- id: ghostbin
  desc: Ghostbin reference
  if:
    type: text
    regex: ghostbin\.(com|site|co)
- id: paste-ee
  desc: Paste.ee reference
  if:
    type: text
    substr: paste.ee
  unless:
  - id: objectives/credential-access/cloud/token/oauth::sharex-uploaderslib-assembly
  - id: well-known/tool/detection/guardlayer::tool-policy-exfil-service-denylist
- id: pastefy
  desc: Pastefy reference
  if:
    type: text
    substr: pastefy.app
- id: dpaste
  desc: Dpaste reference
  if:
    type: text
    regex: dpaste\.(com|org)
- id: privatebin
  desc: PrivateBin reference
  if:
    type: text
    substr: privatebin.net
- id: rentry
  desc: Rentry.co reference
  if:
    type: text
    regex: rentry\.(co|org)
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ctrlv
  desc: CtrlV.it reference
  if:
    type: text
    substr: ctrlv.it
- id: termbin
  desc: Termbin reference (netcat-based)
  if:
    type: text
    substr: termbin.com
- id: pastery
  desc: Pastery reference
  if:
    type: text
    substr: pastery.net
- id: jsonkeeper
  desc: JSONkeeper.com reference
  if:
    type: text
    substr: jsonkeeper.com
- id: jsonkeeper-b64-endpoint
  desc: Base64-encoded JSONKeeper endpoint
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  - typescript
  - python
  if:
    type: encoded
    encoding: base64
    regex: https://(www\.)?jsonkeeper\.com/b/[A-Za-z0-9_-]{4,24}
- id: jsonkeeper-b64-endpoint-literal
  desc: Base64 literal JSONKeeper endpoint
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: literal
    kind: string
    regex: ^aHR0cHM6Ly93d3cuanNvbmtlZXBlci5jb20[A-Za-z0-9_-]{4,80}={0,2}$
- id: jsonkeeper-hex-endpoint
  desc: Hex-encoded JSONKeeper endpoint
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  - typescript
  - python
  if:
    type: encoded
    encoding: hex
    regex: https://(www\.)?jsonkeeper\.com/b/[A-Za-z0-9_-]{4,24}
- id: jsonbin
  desc: JSONBin.io reference
  if:
    type: text
    substr: jsonbin.io
- id: jsonbin-v3-bins-path
  desc: JSONBin v3 bins API path fragment
  crit: notable
  conf: 0.85
  for:
  - javascript
  - typescript
  - python
  if:
    type: literal
    kind: string
    exact: /v3/b
- id: npoint
  desc: npoint.io reference
  if:
    type: text
    substr: npoint.io
- id: jsonblob
  desc: JSONBlob.com reference
  if:
    type: text
    substr: jsonblob.com
- id: mockapi
  desc: MockAPI.io reference
  if:
    type: text
    substr: mockapi.io
- id: textbin
  desc: Textbin.net reference
  if:
    type: text
    substr: textbin.net
  unless:
  - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
- id: telegraph
  desc: Telegra.ph anonymous publishing page URL
  if:
    type: text
    regex: (?i)\btelegra\.ph/[A-Za-z0-9%-]{3,80}
- id: temp-sh
  desc: Temp.sh file sharing service
  if:
    type: text
    regex: (^|[^A-Za-z0-9.-])(https?://)?temp\.sh\b
  unless:
  - id: well-known/tool/detection/guardlayer::tool-policy-exfil-service-denylist
- id: shz-al
  desc: shz.al pastebin reference
  conf: 0.9
  if:
    type: text
    regex: https?://shz\.al/
composite_rules:
- id: jsonkeeper-bearrtoken-client
  desc: JSONKeeper client uses a misspelled token header
  crit: suspicious
  conf: 0.97
  attack: T1102.001
  all:
  - id: jsonkeeper
  - id: micro-behaviors/communications/http/request/client::request-import
  - id: micro-behaviors/communications/http/header/security::bearrtoken-header-map-entry
- id: jsonkeeper-bearrtoken-eval-loader
  desc: JSONKeeper custom-header response executes as JavaScript
  crit: hostile
  conf: 0.99
  attack: T1102.001,T1059.007
  all:
  - id: jsonkeeper-bearrtoken-client
  - id: objectives/command-and-control/dropper/script-eval/remote-code::request-json-field-eval-loader
- id: jsonkeeper-development-secret-config
  desc: Encoded JSONKeeper endpoint with secret config
  crit: hostile
  conf: 0.96
  attack: T1102.001
  all:
  - id: jsonkeeper-b64-endpoint
  - id: micro-behaviors/data/config/schema::javascript-development-secret-config
- id: jsonkeeper-eval-loader
  desc: Evaluates decoded JSONKeeper remote payload
  crit: hostile
  conf: 0.99
  attack: T1102.001,T1059.007
  all:
  - id: jsonkeeper-b64-endpoint
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: jsonkeeper-response-function-loader
  desc: JSONKeeper response executed with Node require
  crit: hostile
  conf: 0.99
  attack: T1102.001,T1059.007
  near_bytes: 1024
  all:
  - id: jsonkeeper
  - id: micro-behaviors/communications/http/get::axios-get-typescript-generic-call
  - id: objectives/command-and-control/dropper/script-eval/remote-code::function-require-response-loader
- id: jsonkeeper-endpoint
  desc: JSONKeeper remote endpoint reference
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  any:
  - id: jsonkeeper
  - id: jsonkeeper-b64-endpoint
  - id: jsonkeeper-b64-endpoint-literal
  - id: jsonkeeper-hex-endpoint
- id: jsonkeeper-hex-eval-loader
  desc: Evaluates hex-encoded JSONKeeper payload
  crit: hostile
  conf: 0.99
  attack: T1102.001,T1059.007
  for:
  - javascript
  - typescript
  all:
  - id: jsonkeeper-hex-endpoint
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: jsonbin-v3-bins-endpoint
  desc: JSONBin.io v3 bins API endpoint
  crit: notable
  conf: 0.92
  attack: T1102.001
  all:
  - id: jsonbin
  - id: jsonbin-v3-bins-path
- id: jsonbin-access-key-bins-client
  desc: JSONBin bins client authenticated with X-Access-Key
  crit: suspicious
  conf: 0.94
  attack: T1102.001
  all:
  - id: jsonbin-v3-bins-endpoint
  - id: micro-behaviors/communications/http/header/security::x-access-key-header-map-entry
  any:
  - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
  - id: micro-behaviors/communications/http/content-length::raw-content-length-header
  - id: micro-behaviors/communications/http/header/content-type::application-json
- id: obfuscated-wallet-key-jsonbin-drop
  desc: Obfuscated wallet private-key validator posts to JSONBin
  crit: hostile
  conf: 0.97
  attack: T1555,T1041,T1102.001
  mbc: B0028
  all:
  - id: jsonbin
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jsjiami-watermark
  - id: micro-behaviors/communications/http/header/security::x-access-key-header-map-entry
  any:
  - id: micro-behaviors/data/format/string::hex64-prefixed-validation-pattern
  - id: objectives/credential-access/wallet/key-format::base58-44to88-key-regex
- id: tunnel-address-paste-rendezvous
  desc: Posts its tunnel address to a paste site
  crit: suspicious
  conf: 0.88
  for:
  - scripts
  - source
  attack: T1102.001,T1572
  all:
  - id: objectives/command-and-control/infrastructure/domain/tunnel/
  any:
  - id: shz-al
  - id: micro-behaviors/communications/http/services/file-hosting::pastebin
  - id: hastebin
  - id: dpaste
  - id: rentry
  - id: termbin
  - id: paste-ee
  - id: privatebin
  unless:
  - id: well-known/tool/detection/
  - id: metadata/file/catalog/identity::widget-network-source-catalog
  downgrade:
    any:
    - id: micro-behaviors/communications/http/server/authentication::signed-admin-server-context
