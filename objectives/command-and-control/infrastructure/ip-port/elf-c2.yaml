defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071.001,T1556.003
  mbc: B0030

composite_rules:
  - id: native-pam-uid-agent-fixed-endpoint
    desc: Native ELF with PAM, UID/GID control, and fixed external endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf
      - id: micro-behaviors/os/pam/auth::pam-auth-api-raw-reference
      - id: micro-behaviors/process/identity/setuid::uid-gid-cgo-api-reference

  # Stripped statically linked IoT bots (Mirai-class) embed watchdog device
  # paths, read /proc/net/tcp for rival hunting, and ship a hardcoded C2 port.
  - id: static-stripped-elf-watchdog-external-c2
    desc: Stripped static ELF with watchdog paths and external C2 endpoint
    crit: hostile
    conf: 0.97
    attack: T1071,T1498.001
    all:
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf
      - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
