# Hardcoded C2 IPv4:port literal in a Windows loader that resolves NT
# syscalls dynamically. Existing external-ipv4-port rules cap at 2 MB to
# avoid false positives on .NET version strings; this composite re-allows
# the literal when the binary also exposes the direct-syscall trinity,
# which is rare in benign large binaries.
defaults:
  platforms: [windows]
  for: [pe]
  mbc: B0030
composite_rules:
  - id: syscall-loader-hardcoded-c2
    desc: Direct-syscall loader with hardcoded IPv4 C2 endpoint
    crit: hostile
    conf: 0.96
    attack: T1106,T1071
    all:
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-large
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-memory-protection-write-api-cluster
    any:
      - id: metadata/binary/section/label::rdata2-section
      - id: objectives/anti-static/obfuscation/payload/section/content::oversized-rdata-section
      - id: micro-behaviors/os/syscall/invoke::ntdll-import
    unless:
      - id: metadata/binary/vendor/
  - id: c2-endpoint-with-remote-injection
    desc: Hardcoded C2 endpoint with remote-thread injection
    crit: hostile
    conf: 0.95
    attack: T1055.001,T1071
    all:
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-large
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-binary
  - id: xor-c2-syscall-elevated-persist-loader
    desc: XOR C2 IP with syscall stubs and elevated persistence
    crit: hostile
    conf: 0.97
    attack: T1106,T1071,T1053.005,T1548.002
    all:
      - id: micro-behaviors/communications/ip/literal::xor-decoded-external-ipv4
      - id: micro-behaviors/os/syscall/raw::nt-alloc-protect-stack-pair
      - id: micro-behaviors/os/autorun/control::windows-schtasks-onlogon-highest
      - id: micro-behaviors/os/privilege/elevation::runas-elevation-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
