defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: malformed-m68k-static-endpoint
    desc: Malformed m68k ELF connects to a fixed endpoint
    crit: hostile
    conf: 0.99
    attack: T1095,T1071
    scope: file
    all:
      - id: metadata/arch/iot::m68k
      - id: metadata/binary/anomaly/format::elf-parse-failure
      - id: micro-behaviors/communications/socket/syscall::m68k-socketcall-wrapper
      - id: micro-behaviors/communications/ip/endpoint::m68k-immediate-ipv4-sockaddr
