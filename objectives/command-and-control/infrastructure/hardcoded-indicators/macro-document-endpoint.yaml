# A document that carries both an interpreter and an address.
#
# Either fact alone is survivable: plenty of legacy workbooks hold an Excel 4.0
# macro sheet, and an address could in principle be a cell someone typed. The
# pair is a delivery mechanism. The macro sheet is the code, the literal is
# where the code goes, and a spreadsheet has no third reason to hold both.
#
# Written against the macro sheet rather than against the XLM formula text
# because the formulas are stored as BIFF tokens with the command split across
# cells -- there is nothing to read. The endpoint is the one part the builder
# cannot obfuscate away, because the operator has to be reachable at it.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: T1071,T1059.005
  mbc: B0030

composite_rules:
  - id: macro-sheet-with-network-endpoint
    desc: Macro-sheet workbook holds a network endpoint
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/execution/interpreter/document::stored-excel4-macro-sheet
      - id: micro-behaviors/communications/ip/ipv4::document-ipv4-endpoint-literal
