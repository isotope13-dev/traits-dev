# Stager endpoints compiled into one trojanized AppImage launcher. The launcher
# pins its download host to a fixed address and names its output file. Both
# fragments stay readable in the raw image: the script lives in a squashfs block
# that the scanner does not unpack, so these are the only evidence the file
# itself exposes. Specimen-specific values, so they live here as indicators.
defaults:
  for: [elf]
  platforms: [linux]
  attack: T1105

traits:
  - id: stager-host-pinned-ipv4
    desc: Stager host pinned to fixed IPv4
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: serverlinux24.org:45.61.157.160

  - id: stager-output-filename
    desc: Stager writes download to lpn-x3-glued
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: lpn-x3-glued

composite_rules:
  - id: appimage-stager-known-infrastructure
    desc: AppImage stager host pin and fixed payload name
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: stager-host-pinned-ipv4
      - id: stager-output-filename
