# Campaign collector endpoint hardcoded in shell stealers that post environment
# and Git credential dumps to a /poc/ path. The host is specimen infrastructure,
# so it lives with the other indicators; the behavior rules in
# objectives/exfiltration/stealer/credential/developer stand on their own legs.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1041

traits:
  - id: aaronstack-poc-collector-endpoint
    desc: Shell uploads to aaronstack.com PoC collector
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: aaronstack\.com/poc/(env|token)
      exclude_comments: true
