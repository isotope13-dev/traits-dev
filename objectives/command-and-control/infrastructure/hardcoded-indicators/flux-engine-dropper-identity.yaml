# FluxEngine campaign identifiers in a Delphi PE: the status beacon path and the
# registry marker key it writes. The same two markers appear in the FluxEngine
# AutoIt stage (well-known/malware/trojan/fluxengine), which matches only text
# files; the PE stores them as UTF-16, which the text matcher decodes here.
# Campaign-specific, so they live with the other indicators, not in a behavior rule.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001

traits:
  - id: flux-registrar-status-beacon
    desc: Registrar status-log beacon path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /registrar.php?acao=log

  - id: flux-registry-marker-key
    desc: FluxEngine registry marker key
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: Software\FluxEngine\Desktop

composite_rules:
  - id: flux-engine-dropper-identity
    desc: FluxEngine beacon path and registry marker key
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: flux-registrar-status-beacon
      - id: flux-registry-marker-key
