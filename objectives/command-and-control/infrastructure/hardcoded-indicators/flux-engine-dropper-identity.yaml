# Campaign identifiers from one Delphi loader (no recognized family): the status
# beacon path and the registry marker key it writes. Both are stored as UTF-16 in the
# PE, which the text matcher decodes. Specimen-specific, so they live here as
# indicators rather than in a behavior rule.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001

traits:
  - id: flux-registrar-status-beacon
    desc: Registrar status-log beacon path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /registrar.php?acao=log

  - id: flux-registry-marker-key
    desc: FluxEngine registry marker key
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: Software\FluxEngine\Desktop

composite_rules:
  - id: flux-engine-dropper-identity
    desc: FluxEngine beacon path and registry marker key
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: flux-registrar-status-beacon
      - id: flux-registry-marker-key
