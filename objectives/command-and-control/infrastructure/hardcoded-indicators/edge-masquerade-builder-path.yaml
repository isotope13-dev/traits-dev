# Developer path left in the build of one Edge-masquerade PEB-hash loader
# family. The path is specimen-level residue, so it lives here as an indicator.
# It becomes hostile only with the fake Microsoft claim that the loader carries.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  - id: builder-dev-path-st2path
    desc: Build leaves developer path to st2path.txt
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'E:\rabota\st2path.txt'

composite_rules:
  - id: edge-masquerade-builder-dev-path
    desc: Fake Microsoft claim PE carries loader builder dev path
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: builder-dev-path-st2path
      - id: metadata/signature/self-signed/signer::microsoft-corporation
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
