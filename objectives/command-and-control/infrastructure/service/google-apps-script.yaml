# Google Apps Script (GAS) C2 channel.
#
# Attackers abuse `script.google.com/macros/s/<deployment-id>/exec`
# (Google Apps Script Web Apps) as a free serverless C2 endpoint.
# The `AKfycb...` deployment-ID prefix is Google-issued and is a
# stable shape across all Apps Script deployments.
#
# Legitimate uses exist (form responses, lightweight automations),
# but a binary or script that hard-codes a `script.google.com/macros`
# URL and POSTs/GETs to it as part of an exec/exfil flow is almost
# always a malware C2 / exfil channel — see Braodo (T1 sitecustomize
# uploads stolen ZIPs to a hardcoded GAS endpoint), and the wider
# pattern of Vietnamese / Asia-Pacific stealers using Apps Script as
# free C2.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: "T1102.001"
  mbc: "B0030"

composite_rules:
  - id: google-apps-script-c2-endpoint
    desc: Google Apps Script C2 / exfil endpoint
    crit: suspicious
    conf: 0.95
    # The endpoint and POST must be in the same archive leaf; otherwise a
    # benign feedback form can combine with unrelated package HTTP code.
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path
      # A GET to an Apps Script deployment and an unrelated POST in the same
      # source file are common in browser applications.  Require the POST to
      # be bound to the Apps Script URL (or its clearly named constant).
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-post-request
    unless:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-non-c2-context
      - id: micro-behaviors/communications/http/services/google-apps-script::feedback-json-name-email-title-content-shape
      - id: micro-behaviors/communications/http/form::formdata-user-submission-fields
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-formdata-feedback-context
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-subscribe-form-context
      # This extension sends only the current retail product-page URL, tagged
      # as a PDP telemetry record, to its own Apps Script spreadsheet.  That is
      # a benign analytics workflow rather than C2 or exfiltration.
      - id: micro-behaviors/communications/http/services/google-apps-script::product-page-url-telemetry-payload
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-extension-feedback-context
      - id: well-known/app/browser-extension/cuponomia::cuponomia-extension
