# Google Apps Script (GAS) C2 channel.
#
# Attackers abuse `script.google.com/macros/<deployment-id>/exec`
# (Google Apps Script Web Apps) as a free serverless C2 endpoint.
# The `AKfycb...` deployment-ID prefix is Google-issued and is a
# stable shape across all Apps Script deployments.
#
# Apps Script endpoints also serve legitimate feedback forms and automation.
# A POST alone identifies the service usage; C2 or exfiltration requires
# additional evidence about the surrounding behavior.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: "T1102.001"
  mbc: "B0030"

composite_rules:
  - id: google-apps-script-c2-endpoint
    for: [javascript]
    desc: HTTP POST to a Google Apps Script deployment
    crit: notable
    conf: 0.95
    # The endpoint and POST must be in the same archive leaf; otherwise a
    # benign feedback form can combine with unrelated package HTTP code.
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path
      # A GET to an Apps Script deployment and an unrelated POST in the same
      # source file are common in browser applications.  Require the POST to
      # be bound to the Apps Script URL (or its clearly named constant).
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-post-request
