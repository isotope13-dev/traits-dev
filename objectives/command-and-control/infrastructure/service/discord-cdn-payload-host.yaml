# Discord's attachment CDN used as a payload host: a hard-coded
# cdn.discordapp.com .exe URL streamed to disk and launched without a window.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1102,T1105

composite_rules:
  - id: python-discord-cdn-hosted-executable-stage
    desc: Python stages Discord-CDN-hosted exe without a window
    crit: hostile
    conf: 0.95
    all:
      - id: well-known/app/communication/discord::discord-cdn-windows-executable-url
      - id: micro-behaviors/communications/http/download/handler::python-requests-stream-to-file
      - id: micro-behaviors/process/config/launch::python-qualified-create-no-window
