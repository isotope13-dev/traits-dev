# Backend-as-a-Service C2 Channel
# Detects malware using cloud BaaS platforms (Parse/Back4App, Firebase, etc.) as C2 infrastructure
# Provides persistent, hosted C2 without attacker-maintained servers
# ATT&CK: T1102 (Web Service)
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: suspicious
  conf: 0.85
  attack: "T1102"

traits:
  - id: back4app-parse-endpoint
    desc: Back4App Parse REST API endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "parseapi.back4app.com"

  - id: parse-command-result
    desc: Parse query COMMAND_SUCCESSFUL constant
    crit: notable
    conf: 0.75
    if:
      type: text
      exact: "COMMAND_SUCCESSFUL"

  - id: parse-key-results
    desc: Parse response KEY_RESULTS constant
    crit: notable
    conf: 0.75
    if:
      type: text
      exact: "KEY_RESULTS"

  - id: firebase-outbox-path
    desc: Firebase C2 staging path (outbox/ns)
    crit: notable
    conf: 0.8
    if:
      type: text
      # Matches /ns/ followed by UUID-like string and /outbox/
      regex: (?i)/ns/[a-f0-9-]{32,}/outbox/

  - id: onesignal-subscription
    desc: OneSignal push notification C2 subscription
    crit: suspicious
    conf: 0.75
    if:
      type: text
      substr: "ONESIGNAL_SUBSCRIPTION"

composite_rules:
  - id: parse-baasc2-channel
    desc: Parse/Back4App cloud backend used for C2 tasking
    crit: suspicious
    conf: 0.9
    all:
      - id: back4app-parse-endpoint
    any:
      - id: parse-command-result
      - id: parse-key-results

  - id: firebase-baasc2-channel
    desc: Firebase Realtime Database used for C2 tasking
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/firebase::firebase-rtdb-endpoint
    any:
      - id: firebase-outbox-path

  # The client compiles in a Firebase web project (API key, auth domain,
  # storage bucket) and asks that project whether a device session is still
  # valid. Face-auth mode in the same module is the biometric check-in the
  # session covers; a normal app reads project settings the operator typed
  # into a config file and does not bind face authentication to an online
  # session verdict. Proximity keeps the config and the verdict in one module.
  - id: firebase-face-auth-session-channel
    desc: Firebase client verifies a face-auth device session
    crit: hostile
    conf: 0.97
    for: [pe, dll]
    platforms: [windows]
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/services/google::google-api-key-packed
      - id: micro-behaviors/communications/http/services/firebase::firebase-auth-domain
      - id: micro-behaviors/communications/http/services/firebase::firebase-storage-domain
      - id: micro-behaviors/communications/http/services/firebase::pyrebase-client
      - id: micro-behaviors/os/security/auth/session::session-token-field
      - id: micro-behaviors/os/security/auth/verify::online-session-verification
      - id: micro-behaviors/os/security/auth/verify::face-auth-mode
