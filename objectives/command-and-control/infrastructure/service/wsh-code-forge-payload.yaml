# The script's downloaded stage lives on a public code forge (github.com
# raw path) and is executed hidden: the repository serves as a free payload
# host that the operator can swap at will.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1102,T1105

composite_rules:
  - id: wsh-code-forge-hosted-hidden-stage
    desc: Script runs a code-forge hosted stage hidden
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::public-forge-http-download
      - id: micro-behaviors/process/create/hidden::wsh-hidden-cmd-run-variable-path
