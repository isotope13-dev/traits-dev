defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1041,T1046,T1210
  mbc: B0030

composite_rules:
  - id: telegram-network-exploit-report
    desc: Telegram reports a mass network exploitation workflow
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: objectives/discovery/network/scan/port::random-ip-scanner
      - id: objectives/lateral-movement/exploit/scanner::cve-post-exploit-workflow
