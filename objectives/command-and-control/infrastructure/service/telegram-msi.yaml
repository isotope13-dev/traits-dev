defaults:
  platforms: [windows]
  for: [all]
  attack: T1071.001
  mbc: C0002

traits:
  - id: telegram-bot-api-endpoint
    desc: Telegram Bot API endpoint reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: https://api.telegram.org/bot

  - id: telegram-bot-token-field
    desc: Telegram bot token assignment field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bTelegramBotToken\b\s*[=:]'

  - id: telegram-bot-chat-field
    desc: Telegram bot chat identifier field
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: TelegramChatId

  - id: telegram-bot-powershell-control
    desc: PowerShell executable token
    crit: component
    conf: 0.94
    attack: T1059.001
    if:
      type: text
      substr: powershell.exe

composite_rules:
  - id: telegram-bot-powershell-loader
    desc: Telegram-controlled PowerShell loader markers
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1059.001,T1105
    all:
      - id: objectives/command-and-control/infrastructure/service::telegram-bot-api-endpoint
      - id: objectives/command-and-control/infrastructure/service::telegram-bot-token-field
      - id: objectives/command-and-control/infrastructure/service::telegram-bot-chat-field
      - id: objectives/command-and-control/infrastructure/service::telegram-bot-powershell-control
