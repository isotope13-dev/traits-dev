defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1071.001
  mbc: C0002

# The Telegram Bot API host itself is a neutral platform marker shared with
# every legitimate notifier, so this file reuses the canonical atom in
# micro-behaviors/communications/http/services/telegram rather than defining a
# second matcher for the same host. Only the loader-specific fields live here.
traits:
  - id: telegram-bot-token-field
    desc: Telegram bot token assignment field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bTelegramBotToken\b\s*[=:]'

  - id: telegram-bot-chat-field
    desc: Telegram bot chat identifier field
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: TelegramChatId

  # The canonical host/PowerShell atoms (micro-behaviors/communications/http/
  # services/telegram::telegram-api-host and micro-behaviors/process/create/
  # shell/interpreter::powershell-executable-token) don't declare `oledoc` --
  # neither is scoped to MSI CustomAction table strings. Local equivalents,
  # since an MSI database is an OLE compound file and its table strings are
  # visible to `type: text` the same way metadata/binary/installer/database/
  # msi.yaml's `embedded-powershell-payload-raw` reads them.
  # A slightly lower confidence than the canonical host/PowerShell atoms:
  # an MSI string table can carry vendor/help-text strings verbatim, so a
  # bare substring match in that table is marginally noisier than the same
  # text in a live script.
  - id: telegram-api-host-msi
    desc: Telegram Bot API host in MSI table
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: api.telegram.org

  - id: powershell-executable-token-msi
    desc: PowerShell executable reference in MSI table
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bpowershell\.exe\b'

composite_rules:
  - id: telegram-bot-powershell-loader
    desc: Telegram-controlled PowerShell loader markers
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1059.001,T1105
    all:
      - id: telegram-api-host-msi
      - id: objectives/command-and-control/infrastructure/service::telegram-bot-token-field
      - id: objectives/command-and-control/infrastructure/service::telegram-bot-chat-field
      - id: powershell-executable-token-msi
