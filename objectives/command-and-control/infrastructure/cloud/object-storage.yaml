defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
  mbc: B0030
  attack: T1102.002
composite_rules:
  - id: cloud-payload-dropper
    desc: S3 URL with process path and ChaCha references
    crit: notable
    conf: 0.95
    attack: T1105 - elf - macho - pe
    all:
      - id: well-known/app/storage/amazon-s3::aws-s3-url
      - id: micro-behaviors/fs/proc/info/exe::process-pid-exe
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
    any:
      - id: micro-behaviors/communications/http/lib/crate::ureq-crate
      - id: micro-behaviors/crypto/provider/library::rustls-crate-path
  - id: rust-cloud-stager
    for: [elf, macho, pe, class, pyc, beam, wasm, staticlib]
    desc: Rust HTTP client, S3 URL, and process path references
    crit: notable
    conf: 0.92
    attack: T1105 - elf - macho - pe
    all:
      - id: micro-behaviors/communications/http/lib/crate::ureq-crate
      - id: micro-behaviors/crypto/provider/library::rustls-crate-path
      - id: micro-behaviors/fs/proc/info/exe::process-pid-exe
      - id: well-known/app/storage/amazon-s3::aws-s3-url
  - id: cloud-crypto-implant
    desc: S3 URL with process path and ChaCha references
    crit: notable
    conf: 0.82
    mbc: B0030 - elf - macho - pe
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/fs/proc/info/exe::process-pid-exe
    any:
      - id: well-known/app/storage/amazon-s3::aws-s3-url
