defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
  mbc: B0030
  attack: T1102.002
composite_rules:
  - id: cloud-payload-dropper
    desc: Cloud storage payload dropper
    crit: hostile
    conf: 0.95
    attack: T1105 - elf - macho - pe
    all:
      - id: micro-behaviors/communications/http/url/cloud::aws-s3-url
      - id: micro-behaviors/fs/proc/info/exe::process-pid-exe
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
    any:
      - id: micro-behaviors/communications/http/lib/crate::ureq-crate
      - id: micro-behaviors/crypto/library/provider::rustls-crate-path
    unless:
      - id: well-known/lib/cloud/object-store-rs::rust-cloud-object-store-sdk
      - id: well-known/lib/cloud/aws-sdk-go::aws-sdk-go-context
      - id: well-known/lib/cloud/aws-sdk-go-v2::aws-sdk-go-v2-context
      - id: well-known/lib/cloud/aws-sdk-rust::rust-aws-config-crate
      - id: metadata/lang/compiler/systems::go-binary
      # The section-gated Go and AWS-SDK identity legs above all depend on
      # section extraction, which degrades on very large binaries (a 400MB Go
      # product lost its gopclntab match under load and every section-gated
      # exclusion fell away at once, leaving only the plain-text legs -- S3
      # doc URLs, Go's own chacha constant, /proc/%d/exe -- plus vendored
      # rustls panic paths from an embedded helper, and the composite read as
      # a dropper). The version literal is plain text and survives that
      # degradation, so the Go exclusion holds whenever the binary says so.
      - id: metadata/lang/compiler/systems::go-version-string
  - id: rust-cloud-stager
    for: [elf, macho, pe, class, pyc, beam, wasm, staticlib]
    desc: Rust cloud storage stager
    crit: hostile
    conf: 0.92
    attack: T1105 - elf - macho - pe
    all:
      - id: micro-behaviors/communications/http/lib/crate::ureq-crate
      - id: micro-behaviors/crypto/library/provider::rustls-crate-path
      - id: micro-behaviors/fs/proc/info/exe::process-pid-exe
      - id: micro-behaviors/communications/http/url/cloud::aws-s3-url
    unless:
      - id: well-known/lib/cloud/object-store-rs::rust-cloud-object-store-sdk
      - id: well-known/lib/cloud/aws-sdk-rust::rust-aws-config-crate
      # Same degraded-section-analysis exposure as cloud-payload-dropper.
      - id: metadata/lang/compiler/systems::go-version-string
  - id: cloud-crypto-implant
    desc: Cloud-hosted crypto implant
    crit: suspicious
    conf: 0.82
    mbc: B0030 - elf - macho - pe
    all:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: micro-behaviors/fs/proc/info/exe::process-pid-exe
    any:
      - id: micro-behaviors/communications/http/url/cloud::aws-s3-url
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable
        - id: metadata/lang/compiler/systems::go-binary
