# Malicious JFrog Artifactory user plugins (Wiz, September 2026).
#
# Actors with administrator control of an Artifactory server installed Groovy
# plugins through its native plugin framework (deployed under
# $ARTIFACTORY_HOME/etc/plugins, invoked through /api/plugins/execute/<name>)
# to gain arbitrary code execution on the repository host: shell commands for
# recon and file enumeration, and a second stage fetching a binary over HTTP
# into a world-writable directory (/tmp, /var/tmp, /dev/shm) before chmod and
# detached execution. Legitimate user plugins integrate with repository
# lifecycle hooks and rarely shell out, so plugin SDK code combined with
# process execution or payload staging is a server-side implant.
defaults:
  for: [groovy]
  platforms: [unix, windows]

composite_rules:
  - id: artifactory-plugin-shell-execution
    desc: Artifactory user plugin executes shell commands
    crit: hostile
    conf: 0.95
    attack: "T1059.004,T1190"
    all:
      - id: well-known/app/infrastructure/jfrog-artifactory::plugin-sdk
    any:
      - id: objectives/command-and-control/infrastructure/ci-abuse::groovy-shell-lc-execute
      - id: objectives/command-and-control/infrastructure/ci-abuse::groovy-cmd-c-execute
      - id: objectives/command-and-control/infrastructure/ci-abuse::groovy-dynamic-evaluate
    needs: 1

  - id: artifactory-plugin-payload-staging
    desc: Artifactory user plugin stages payload from network
    crit: hostile
    conf: 0.95
    attack: "T1105,T1222.002"
    all:
      - id: well-known/app/infrastructure/jfrog-artifactory::plugin-sdk
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-structured-file
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
    any:
      - id: micro-behaviors/process/daemonize/detach::stealthy-background
      - id: micro-behaviors/fs/path/location::hidden-writable-path
