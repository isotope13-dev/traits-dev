  # of the two is a support script checking whether its own service is up;
  # both together, from a build step, is an operator mapping the host they
  # landed on. Suspicious rather than hostile: this is what an inventory
  # script looks like too, and the reason to score it at all is that it rarely
  # travels alone.
  - id: groovy-host-enumeration-sweep
