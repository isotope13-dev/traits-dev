defaults:
  for: [groovy]
  platforms: [unix, windows]

traits:
  - id: groovy-classloader-defineclass
    desc: Groovy ClassLoader defineClass
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'extends ClassLoader[\s\S]{0,400}defineClass\s*\('

  - id: groovy-base64-bytecode-load
    desc: Groovy Base64 bytecode load
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'Base64\.getDecoder[\s\S]{0,220}defineClass'

  - id: groovy-curl-pipe-shell
    desc: curl piped to shell
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'curl[^\n]{0,80}\|\s*(bash|sh)\b'

  - id: groovy-wget-pipe-shell
    desc: wget piped to shell
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'wget[^\n]{0,80}\|\s*(bash|sh)\b'

  - id: groovy-certutil-download
    desc: certutil download command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bcertutil\b[^\n]{0,100}(http|-urlcache)'

  - id: groovy-bitsadmin-download
    desc: bitsadmin transfer command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bbitsadmin\b[^\n]{0,100}(/transfer|http)'

  - id: groovy-regsvr32-scriptlet
    desc: regsvr32 scriptlet command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bregsvr32\b[^\n]{0,100}(\.sct|/i:)'

  - id: groovy-rundll32-js-scriptlet
    desc: rundll32 JavaScript scriptlet
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'rundll32\.exe\s+javascript:'

  - id: groovy-scriptlet-getobject
    desc: remote scriptlet GetObject
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: 'GetObject("script:'

  # `ScriptApproval` is the name of the Jenkins sandbox-approval class itself;
  # reading it is what the security UI and every admin script do. Granting
  # approval is the abuse, and it needs `groovy-jenkins-clear-approved` or a
  # dynamic evaluate beside it -- see `groovy-jenkins-control-tamper`.
  - id: groovy-jenkins-scriptapproval
    desc: Jenkins ScriptApproval use
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ScriptApproval

  - id: groovy-jenkins-clear-approved
    desc: Jenkins approved scripts clear
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: clearApprovedScripts

  # A class name, not a tamper: Jenkins core's own
  # hudson/security/csrf/GlobalCrumbIssuerConfiguration/config.groovy reads
  # `crumbIssuer`, and the documented way to call the Jenkins REST API is to
  # fetch a crumb first. `groovy-jenkins-control-tamper` is where clearing or
  # disabling the control becomes an objective.
  - id: groovy-jenkins-hpi-artifact
    desc: Jenkins HPI artifact
    crit: suspicious
    conf: 0.86
    if:
      type: text
      substr: .hpi

  # The five atoms below are bare substrings of documented, ubiquitous Jenkins
  # pipeline APIs. `@Library(...)` is the sanctioned way every Jenkinsfile
  # imports a shared library; `LibraryConfiguration`, `GlobalLibraries` and
  # `org.jenkinsci.plugins.workflow` are the classes and package that implement
  # it; `workflow-libs` is the directory Jenkins itself creates. Jenkins core,
  # JenkinsPipelineUnit and every ordinary pipeline carry them, so at
  # `suspicious` they produced nothing but false positives. The abuse is never
  # the reference -- it is the reference plus an untrusted source or a tamper,
  # which the composites at the foot of this file supply. Notable legs serve
  # those composites exactly as well; same reasoning as
  # `groovy-shell-command-execute` above.
  - id: groovy-jenkins-library-annotation
    desc: Jenkins shared library annotation
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '@Library\s*\('

  - id: groovy-jenkins-workflow-libs-path
    desc: Jenkins workflow-libs path
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: workflow-libs

  - id: groovy-jenkins-global-libraries
    desc: Jenkins global libraries API
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: GlobalLibraries

  - id: groovy-jenkins-library-configuration
    desc: Jenkins shared library configuration API
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: LibraryConfiguration

  - id: groovy-jenkins-workflow-api
    desc: Jenkins workflow plugin API
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: org.jenkinsci.plugins.workflow

  - id: groovy-jenkins-plugin-inventory
    desc: Jenkins plugin inventory
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: '$JENKINS_HOME/plugins'

  - id: groovy-credentials-xml
    desc: Jenkins credentials XML
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: credentials.xml

  # `credentials.xml` and `secret.key` are two files in it. The directory is
  # the target -- `master.key`, `hudson.util.Secret` and every
  # `credentials.xml` live under `$JENKINS_HOME/secrets`, and an operator who
  # wants the controller's credential store copies the directory rather than
  # naming the files. Matching the parent covers the files that get added to
  # it in future Jenkins releases as well.
  - id: groovy-jenkins-secrets-directory
    desc: Jenkins secrets directory
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(\$\{?JENKINS_HOME\}?|/var/lib/jenkins)/secrets\b'

  # Overwriting a jar under `WEB-INF/lib` replaces code the controller has
  # already loaded into its own classpath -- `remoting.jar` is the agent
  # protocol implementation, so the swap reaches every build agent that
  # reconnects. This is artifact poisoning aimed at the runtime rather than at
  # a build output.
  - id: groovy-runtime-jar-overwrite
    desc: Overwrites a jar on the servlet classpath
    # Notable: this matches the path shape, and any tool that *deploys* web
    # applications names that path. pongasoft/glu, a Groovy deployment
    # automation framework, carries it for the obvious reason. The conviction
    # belongs to `groovy-build-artifact-poisoning`, which pairs it with a
    # command execution.
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'WEB-INF/lib/[\w.-]{1,40}\.jar'

  - id: groovy-jenkins-secret-key
    desc: Jenkins secret key
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: secret.key

  - id: groovy-npmrc-token
    desc: npm registry token file
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: .npmrc

  - id: groovy-pypirc-token
    desc: PyPI token file
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: pypirc

  - id: groovy-jfrog-cli-config
    desc: JFrog CLI config file
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: .jfrog/jfrog-cli.conf

  - id: groovy-rclone-exfil
    desc: rclone exfil command
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '\brclone\b[^\n]{0,100}(\$WORKSPACE|copy|sync)'

  - id: groovy-mega-exfil
    desc: MEGA exfil command
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '\bmega-put\b[^\n]{0,100}\$WORKSPACE'

  - id: groovy-kubectl-delete
    desc: kubectl delete command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: kubectl delete

  - id: groovy-terraform-destroy
    desc: terraform destroy command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: terraform destroy

  - id: groovy-aws-s3-rm
    desc: AWS S3 delete command
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: aws s3 rm

  - id: groovy-database-drop
    desc: database drop command
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'DROP\s+(DATABASE|SCHEMA)\b'

  - id: groovy-docker-image-wipe
    desc: Docker image wipe command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bdocker\s+rmi\b[^\n]{0,80}-f'

  - id: groovy-jenkins-home-wipe
    desc: Jenkins home wipe command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'rm\s+-rf[^\n]{0,120}\$JENKINS_HOME/(jobs|plugins)'

  - id: groovy-build-artifact-overwrite
    desc: build artifact overwritten
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '\bcp\s+/tmp/[^\n]{0,80}\s+target/[^\n]{0,80}\.(jar|war|zip|exe)'

  - id: groovy-pom-repository-inject
    desc: POM repository block injection
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: '<repositories><repository>'

  - id: groovy-pom-xml-rewrite
    desc: POM XML filename reference
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: pom.xml

  - id: groovy-nexus-artifact-upload
    desc: Nexus artifact upload
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'curl[^\n]{0,120}--upload-file[^\n]{0,120}/repository/'

  - id: groovy-npm-postinstall-write
    desc: npm postinstall hook write
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: scripts.postinstall

  - id: groovy-composer-postinstall-write
    desc: Composer postinstall hook write
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: post-install-cmd

  - id: groovy-package-json-rewrite
    desc: package.json rewrite command
    crit: component
    conf: 0.86
    if:
      type: text
      substr: package.json

  - id: groovy-composer-json-rewrite
    desc: composer.json rewrite command
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: composer.json

  - id: groovy-jenkins-vars-build-poison
    desc: Jenkins vars build poison
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: /vars/build.groovy

  - id: groovy-wevtutil-clear
    desc: Windows log clear
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: wevtutil cl

  - id: groovy-vssadmin-delete
    desc: shadow copy deletion
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: vssadmin delete shadows

  - id: groovy-history-clear
    desc: shell history clear
    crit: suspicious
    conf: 0.86
    if:
      type: text
      substr: history -c

  - id: groovy-workspace-wipe
    desc: workspace wipe command
    crit: notable
    conf: 0.86
    if:
      # Was `substr: rm -rf $WORKSPACE`, which the shell's own quoting defeats:
      # `rm -rf "$WORKSPACE"/*` is the spelling that survives a path with a
      # space in it, so it is the spelling a working script uses, and it does
      # not contain the literal. Allow the quote and any flag order.
      type: text
      regex: 'rm\s+-[rRfF]{1,2}\s+["'']?\$\{?WORKSPACE'

  - id: groovy-log-truncate
    desc: log truncate command
    crit: suspicious
    conf: 0.84
    if:
      # `truncate -s 0` is one way; `> file` is the older and more portable
      # one, and `find ... -exec sh -c ">{}" \;` is how it is applied to a
      # whole log tree at once. The redirect-into-the-found-path shape has no
      # use except emptying files in bulk.
      type: text
      regex: '(truncate\s+-s\s*0|-exec\s+s?h?\s*-?c?\s*["''][ \t]*>\s*\{\})'

  - id: groovy-authorized-keys
    desc: authorized keys write
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: authorized_keys

  - id: groovy-crontab-persistence
    desc: crontab persistence
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: crontab
    unless:
      # Policy and compliance test tables name the thing they assert on
      # (e.g. a "Crontab Execution" policy row) without installing anything.
      - id: metadata/package/testing/presence/harness::test-directory

  - id: groovy-launchagent-persistence
    desc: LaunchAgent persistence
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: LaunchAgents

  - id: groovy-ld-preload
    desc: LD_PRELOAD injection
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: LD_PRELOAD

  - id: groovy-suid-chmod
    desc: SUID chmod command
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'chmod\s+u\+s'

  - id: groovy-ssh-lateral
    desc: SSH lateral command
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '\bssh\b[^\n]{0,100}(cmd|shell|exec)'

  - id: groovy-ansible-lateral
    desc: Ansible lateral command
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '\bansible\b[^\n]{0,100}(shell|command)'

  - id: groovy-winrm-lateral
    desc: WinRM lateral command
    crit: suspicious
    conf: 0.86
    if:
      # `evil-winrm -i <host> -u <user> -p <pass>` names no interpreter on the
      # command line -- it *is* the interpreter -- so requiring `cmd` or
      # `powershell` next to the tool name missed the offensive client
      # entirely while matching the two administrative ones.
      type: text
      regex: '\b(evil-winrm|(winrs|winrm)\b[^\n]{0,100}(cmd|powershell))'

  - id: groovy-smb-copy
    desc: SMB payload copy
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '\bsmbclient\b[^\n]{0,100}(put|copy)'

  - id: groovy-process-recon
    desc: process recon command
    crit: notable
    conf: 0.78
    if:
      type: text
      substr: ps aux

  - id: groovy-listening-socket-recon
    desc: listening socket enumeration
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\b(netstat\s+-[a-z]{0,6}p[a-z]{0,6}|ss\s+-[a-z]{0,4}l[a-z]{0,4}p)\b'

  - id: groovy-host-recon
    desc: host recon command
    crit: suspicious
    conf: 0.78
    if:
      type: text
      substr: hostnamectl

  - id: groovy-network-recon
    desc: network recon command
    crit: suspicious
    conf: 0.78
    if:
      type: text
      regex: '(ip addr|arp -a)'

  - id: groovy-openssl-encrypt
    desc: openssl file encrypt
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bopenssl enc\b[^\n]{0,100}(\$WORKSPACE|\.enc)'

  - id: groovy-gpg-encrypt
    desc: GPG file encrypt
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bgpg --batch\b[^\n]{0,100}(\$WORKSPACE|\.gpg)'

composite_rules:
  - id: groovy-jenkins-shared-library
    desc: Jenkins shared library reference
    crit: notable
    conf: 0.84
    any:
      - id: groovy-jenkins-library-annotation
      - id: groovy-jenkins-workflow-libs-path
      - id: groovy-jenkins-global-libraries
      - id: groovy-jenkins-library-configuration
      - id: groovy-jenkins-workflow-api

  - id: groovy-download-shell-execution
    desc: Groovy download shell execution
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-curl-pipe-shell
      - id: groovy-wget-pipe-shell

  # The payload legs here are Windows LOLBins, and a Groovy script that wants
  # to run one reaches for `['cmd','/c', ...]`, not a POSIX shell. Requiring
  # the shell form meant synthetic corpus 095 -- `regsvr32 /s /n /u /i:<url>
  # scrobj.dll` behind `cmd /c` -- matched the scriptlet atom and then had
  # nothing to compose with.
  - id: groovy-command-execute
    desc: Groovy executes an external command
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
      - id: micro-behaviors/process/create/shell/command-string::groovy-cmd-c-execute

  - id: groovy-lolbin-download-execution
    desc: Groovy LOLBin download execution
    crit: hostile
    conf: 0.94
    all:
      - id: groovy-command-execute
    any:
      - id: groovy-certutil-download
      - id: groovy-bitsadmin-download
      - id: groovy-regsvr32-scriptlet

  - id: groovy-rundll32-scriptlet-execution
    desc: Groovy rundll32 scriptlet execution
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-cmd-c-execute
      - id: groovy-rundll32-js-scriptlet
      - id: groovy-scriptlet-getobject

  - id: groovy-jenkins-control-tamper
    desc: Groovy Jenkins control tamper
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/execution/interpreter/eval/dynamic::groovy-dynamic-evaluate
    any:
      - id: groovy-jenkins-scriptapproval
      - id: groovy-jenkins-clear-approved
      - id: micro-behaviors/communications/http/server/middleware::jenkins-crumb-issuer-reference

  - id: groovy-jenkins-plugin-dropper
    desc: Groovy Jenkins artifact drop
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-jenkins-hpi-artifact
      - id: metadata/build/jenkins::jenkins-agent-jar
      - id: groovy-jenkins-shared-library

  - id: groovy-ci-secret-exfiltration
    desc: Groovy CI secret exfiltration
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-credentials-xml
      - id: groovy-jenkins-secret-key
      - id: groovy-jenkins-secrets-directory
      - id: groovy-npmrc-token
      - id: groovy-pypirc-token
      - id: groovy-jfrog-cli-config
      - id: micro-behaviors/fs/config/build::groovy-build-config-file-reference

  - id: groovy-jenkins-plugin-inventory-exfil
    desc: Groovy Jenkins plugin inventory exfil
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
      - id: groovy-jenkins-plugin-inventory
      - id: micro-behaviors/communications/http/upload::curl-data-binary-stdin

  - id: groovy-jenkins-plugin-data-upload
    desc: Groovy uploads Jenkins plugin listing
    crit: hostile
    conf: 0.92
    all:
      - id: groovy-jenkins-plugin-inventory
      - id: micro-behaviors/communications/http/upload::curl-data-binary-stdin

  - id: groovy-jenkins-token-crumb-probe
    desc: Groovy Jenkins token crumb probe
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
      - id: micro-behaviors/communications/http/server/middleware::jenkins-crumb-issuer-reference
      - id: micro-behaviors/communications/http/curl::curl-basic-auth-token

  - id: groovy-authenticated-jenkins-crumb-request
    desc: Groovy authenticated Jenkins crumb request
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/server/middleware::jenkins-crumb-issuer-reference
      - id: micro-behaviors/communications/http/curl::curl-basic-auth-token

  - id: groovy-ci-config-curl-exfil
    desc: Groovy uploads CI config via curl
    crit: hostile
    conf: 0.92
    all:
      - id: groovy-jfrog-cli-config
      - id: micro-behaviors/communications/http/upload::curl-data-binary-stdin

  - id: groovy-cloud-token-exfiltration
    desc: Groovy cloud token exfiltration
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: micro-behaviors/communications/http/services/cloud::cloud-instance-metadata-link-local-host
      - id: micro-behaviors/fs/path/token::groovy-serviceaccount-token-path
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-env-read

  - id: groovy-exfil-tool-execution
    desc: Groovy exfil tool execution
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-rclone-exfil
      - id: groovy-mega-exfil
      - id: micro-behaviors/fs/file/copy::groovy-rsync-command-context
      - id: micro-behaviors/communications/ssh/transfer::scp-remote-source-operand

  - id: groovy-destructive-ci-command
    desc: Groovy destructive CI command
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-kubectl-delete
      - id: groovy-terraform-destroy
      - id: groovy-aws-s3-rm
      - id: groovy-database-drop
      - id: groovy-docker-image-wipe
      - id: groovy-jenkins-home-wipe

  - id: groovy-artifact-wipe-execution
    desc: Groovy artifact wipe execution
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-wevtutil-clear
      - id: groovy-history-clear
      - id: groovy-workspace-wipe
      - id: groovy-log-truncate

  - id: groovy-build-artifact-poisoning
    desc: Groovy build artifact poisoning
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-build-artifact-overwrite
      - id: groovy-nexus-artifact-upload
      - id: groovy-runtime-jar-overwrite

  - id: groovy-package-hook-poisoning
    desc: Groovy package hook poisoning
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    any:
      - id: groovy-npm-postinstall-write
      - id: groovy-composer-postinstall-write
    needs: 1

  - id: groovy-npm-package-json-poisoning
    desc: Groovy npm package poisoning
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
      - id: groovy-npm-postinstall-write
      - id: groovy-package-json-rewrite

  - id: groovy-npm-postinstall-download-hook
    desc: Groovy npm postinstall downloads shell
    crit: hostile
    conf: 0.93
    all:
      - id: groovy-npm-postinstall-write
      - id: groovy-package-json-rewrite
      - id: groovy-curl-pipe-shell

  - id: groovy-composer-json-poisoning
    desc: Groovy Composer hook poisoning
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
      - id: groovy-composer-postinstall-write
      - id: groovy-composer-json-rewrite

  - id: groovy-composer-postinstall-download-hook
    desc: Groovy Composer hook downloads shell
    crit: hostile
    conf: 0.93
    all:
      - id: groovy-composer-postinstall-write
      - id: groovy-composer-json-rewrite
      - id: groovy-curl-pipe-shell

  - id: groovy-jenkins-shared-lib-poisoning
    desc: Groovy Jenkins shared-lib poisoning
    crit: hostile
