# C2 Endpoint Path Masquerading
# Malware disguises C2 endpoints as legitimate Microsoft services
# BurrowShell uses Windows Update, device management, and telemetry paths
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1036.005
  mbc: B0030
traits:
  - id: windows-update-endpoint
    desc: Windows Update service endpoint path
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: /WindowsUpdate/ClientWebService
  - id: device-management-endpoint
    desc: Device management API endpoint path
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: /deviceManagement/managedDevices
  - id: onecollector-endpoint
    desc: Microsoft OneCollector telemetry endpoint path
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: /OneCollector/
  - id: sync-updates-endpoint
    desc: Windows Update sync endpoint path
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: /SyncUpdates
  - id: windows-update-useragent
    desc: Windows Update Agent user-agent string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Windows-Update-Agent/
  - id: powershell-windows-update-useragent-spoof
    desc: PowerShell request spoofs a WindowsUpdate agent
    crit: notable
    conf: 0.85
    for: [powershell, batch]
    if:
      type: text
      regex: (?i)-UserAgent\s+["']?WindowsUpdate[-/]
composite_rules:
  - id: c2-endpoint-masquerade
    desc: C2 endpoints masquerading as Microsoft services
    crit: suspicious
    conf: 0.92
    needs: 2
    any:
      - id: objectives/command-and-control/infrastructure/endpoint::device-management-endpoint
      - id: objectives/command-and-control/infrastructure/endpoint::onecollector-endpoint
      - id: objectives/command-and-control/infrastructure/endpoint::sync-updates-endpoint
      - id: objectives/command-and-control/infrastructure/endpoint::windows-update-endpoint
      - id: objectives/command-and-control/infrastructure/endpoint::windows-update-useragent
  - id: c2-masquerade-with-http
    desc: Microsoft-masquerading endpoints with HTTP client
    crit: hostile
    conf: 0.95
    all:
      - id: c2-endpoint-masquerade
    any:
      - id: micro-behaviors/communications/http/client/
  # Windows Update itself never fetches scripts from a bare IP with IWR; the
  # spoofed agent only disguises the stager's traffic as servicing.
  - id: powershell-update-disguised-ip-download
    desc: PowerShell fetches from a bare IP with a spoofed Windows Update agent
    crit: hostile
    conf: 0.93
    attack: T1036.005,T1105
    for: [powershell, batch]
    near_bytes: 1024
    all:
      - id: powershell-windows-update-useragent-spoof
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
