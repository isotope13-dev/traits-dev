# Remote-code sync client: picks a host from a packed endpoint pool, fetches
# a JSON blob over XHR, and persists the returned script code in storage for
# later injection. The shape of ad-injecting browser-extension malware whose
# payload ("scode") is refreshed from rotating sync domains.
defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: rotating-endpoint-remote-code-sync
    desc: Syncs remote code from rotating endpoint pool
    crit: hostile
    conf: 0.95
    attack: T1105,T1008
    all:
      - id: micro-behaviors/communications/url/host/domain-http::semicolon-joined-http-endpoint-pool
      - id: micro-behaviors/communications/url/host/domain-http::semicolon-split-call
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/data/parse/json::js-json-parse-direct-or-computed
    any:
      - id: micro-behaviors/data/db/write::dom-storage-setitem-call
      - id: micro-behaviors/data/db/write::browser-storage-persistence
      - id: micro-behaviors/data/config/browser-preference::firefox-char-pref-write
