# Contract-backed C2 resolution is a transport technique, not an npm-family
# signature.  These rules require an eth_call result to become a destination
# and then to feed an outbound request; an ordinary contract read alone is not
# enough.  The syntax-specific request atoms keep this useful across source
# languages without matching article prose or a generic word such as "host".
#
# The "result becomes the destination" atoms are neutral URL construction and
# live in micro-behaviors/communications/http/url/build/response.yaml; the
# eth_call method + contract-address legs below are what make this Ethereum.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1102

traits:
  - id: js-post-to-derived-url
    desc: JavaScript POST to computed URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\(\s*`https?://\$\{[A-Za-z_$][A-Za-z0-9_$]*\}'

  - id: python-post-to-derived-url
    desc: Python POST to computed URL
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'requests\.post\s*\(\s*f["'']https?://\{[A-Za-z_][A-Za-z0-9_]*\}'

  - id: go-post-to-derived-url
    desc: Go POST to computed URL
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: 'http\.Post\s*\(\s*"https?://"\s*\+'

composite_rules:
  - id: ethereum-provider-failover-resolver
    desc: Contract resolver with public RPC failover
    crit: suspicious
    conf: 0.96
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/url/rpc::ethereum-llamarpc-provider
      - id: micro-behaviors/communications/http/url/rpc::ethereum-getblock-provider

  - id: ethereum-contract-rpc-resolver
    desc: Contract response becomes network destination
    crit: suspicious
    conf: 0.98
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
    any:
      - id: micro-behaviors/communications/http/url/build::host-field-from-call-result
      - id: micro-behaviors/communications/http/url/build::destination-field-from-call-result
      - id: micro-behaviors/communications/http/url/build::call-result-destination-field-read

  - id: ethereum-contract-resolved-post
    desc: Posts to URL resolved from contract
    crit: hostile
    conf: 0.98
    attack: T1102,T1071.001
    near_lines: 80
    all:
      - id: ethereum-contract-rpc-resolver
    any:
      - id: js-post-to-derived-url
      - id: python-post-to-derived-url
      - id: go-post-to-derived-url

  - id: ethereum-contract-sensitive-exfiltration
    desc: Exfiltrates sensitive files to contract C2
    crit: hostile
    conf: 0.99
    attack: T1102,T1041,T1552.001
    near_lines: 100
    all:
      - id: ethereum-contract-resolved-post
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials
      - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference
    needs: 2
