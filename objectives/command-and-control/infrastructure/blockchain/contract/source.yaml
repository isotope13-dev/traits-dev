# Contract-based C2 requires corroborating task execution or theft evidence.
# Neutral resolver and POST mechanics live in micro-behaviors.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1102

composite_rules:
  - id: ethereum-provider-failover-resolver
    desc: Contract resolver with public RPC failover
    crit: suspicious
    conf: 0.96
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/url/rpc::ethereum-llamarpc-provider
      - id: micro-behaviors/communications/http/url/rpc::ethereum-getblock-provider

  - id: polygon-eth-call-hex-host
    desc: Polygon eth_call hex-decodes a mutable host
    crit: suspicious
    conf: 0.96
    for: [javascript]
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
      - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-host
    any:
      - id: micro-behaviors/communications/http/url/build::host-from-hex-bytes-decode
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/communications/http/url/build::shell-host-from-xxd-hex-decode

  - id: polygon-eth-call-hex-host-beacon
    desc: Beacons to host resolved via Polygon eth_call
    crit: suspicious
    conf: 0.97
    for: [javascript]
    attack: T1102,T1071.001
    near_lines: 80
    all:
      - id: polygon-eth-call-hex-host
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/url/build::js-post-to-variable-authority
      - id: micro-behaviors/communications/http/url/build::shell-post-to-variable-authority

  # ChainDrop-class: failover across public Ethereum RPC providers, eth_call a
  # contract for a mutable host, then hex-decode the ABI string into a host.
  - id: ethereum-rpc-failover-hex-host
    desc: Hex-decodes host from eth_call failover pool
    crit: suspicious
    conf: 0.97
    near_lines: 100
    all:
      - id: ethereum-provider-failover-resolver
      - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
    any:
      - id: micro-behaviors/communications/http/url/build::host-from-hex-buffer-decode
      - id: micro-behaviors/communications/http/url/build::host-from-hex-bytes-decode
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-call

  - id: ethereum-rpc-failover-resolved-post
    desc: Failover eth_call resolves host then POSTs
    crit: hostile
    conf: 0.99
    attack: T1102,T1071.001
    near_lines: 120
    all:
      - id: ethereum-rpc-failover-hex-host
    any:
      - id: micro-behaviors/communications/http/url/build::post-to-variable-authority

  - id: ethereum-contract-sensitive-exfiltration
    desc: Exfiltrates sensitive files to contract C2
    crit: hostile
    conf: 0.99
    attack: T1102,T1041,T1552.001
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/post::eth-call-derived-authority-post
    any:
      - id: micro-behaviors/fs/path/credential::any-credential-path
      - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference
      - id: micro-behaviors/fs/path/secret-config::node-ssh-home-path
      - id: micro-behaviors/fs/path/token::aws-credentials-path-components
    needs: 2

  - id: ethereum-contract-resolved-websocket-shell
    desc: Contract-resolved WebSocket dispatches shell task payloads
    crit: hostile
    conf: 0.995
    attack: T1102,T1071.001,T1059.001,T1059.003
    mbc: B0022,B0030
    near_lines: 140
    all:
      - id: micro-behaviors/communications/http/url/build::eth-call-destination-assignment
      - id: objectives/command-and-control/remote-command/control/websocket::node-websocket-task-payload-shell

  - id: ethereum-contract-resolved-remote-vm-stage
    desc: Contract-resolved controller supplies JavaScript to a Node VM
    crit: hostile
    conf: 0.995
    attack: T1102,T1105,T1059.007
    mbc: B0024,B0032
    near_lines: 140
    all:
      - id: micro-behaviors/communications/http/url/build::eth-call-destination-assignment
      - id: objectives/command-and-control/backdoor/dispatch/eval::node-http-response-vm-stage
