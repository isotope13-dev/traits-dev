# Contract-backed C2 resolution ("EtherHiding") compiled into a native implant.
#
# The source and JVM rules in this directory key on a readable `eth_call`
# request template. A stripped Go binary keeps the technique but the method
# name and the ABI request are assembled at run time; what survives in the
# string table is the endpoint pool the resolver rotates through, because those
# hostnames have to be dialled verbatim.
#
# A pool of public RPC endpoints is not by itself a finding -- wallets and
# chain-list libraries ship one. What has no benign reading is a program that
# carries the pool *and* the parts of a remote-access implant: an interactive
# pseudo-terminal for the operator's shell, and a blocklist of analysis-host
# names it refuses to run on. Nothing that legitimately reads a contract needs
# either, and no legitimate remote-admin tool hides where its controller lives
# behind a smart contract.
# `for:`/`platforms:` track the legs: github.com/creack/pty wraps the POSIX
# openpty/ioctl surface, so this shape only exists in a Unix-targeted binary.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  attack: T1102
  mbc: B0030

composite_rules:
  - id: native-pty-implant-with-contract-c2-pool
    desc: PTY implant resolves C2 through Ethereum RPC pool
    crit: hostile
    conf: 0.97
    attack: T1102,T1059.004,T1497
    mbc: B0030,B0034
    all:
      - id: micro-behaviors/communications/http/url/rpc::ethereum-public-rpc-provider-pool
      - id: micro-behaviors/process/tty/pty::go-creack-pty-path
      - id: well-known/tool/detection/threat-intel::any-run-service-reference
    # Whether the build fingerprints the hypervisor through Linux DMI/vendor
    # strings or through the macOS hardware model is a porting detail, so the
    # per-platform checks sit in `any:` rather than pinning the rule to one.
    any:
      - id: objectives/anti-analysis/vm-detect/dmi::dmi-vm-fingerprint
      - id: objectives/anti-analysis/vm-detect/vendor::vendor-kvm
      - id: objectives/anti-analysis/vm-detect/artifact::macos-vm-hardware-check
