defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1102
traits:
- id: ethers-json-rpc-provider
  desc: Creates an ethers JSON-RPC provider
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bnew\s+ethers\.(providers\.)?JsonRpcProvider\s*\(
- id: ethers-contract-instance
  desc: Creates an ethers smart-contract client
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bnew\s+ethers\.Contract\s*\(
- id: ethers-contract-zero-arg-read
  desc: Reads zero-argument contract method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bcontract\.[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*\)
- id: evm-contract-scriptcount-view-abi
  desc: scriptCount view ABI in contract literal
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: function scriptCount() view returns (uint256)
- id: evm-contract-getscript-view-abi
  desc: getScript view ABI in contract literal
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: function getScript(uint256) view returns
composite_rules:
- id: ethereum-x25519-aes-script-loader
  desc: Executes an X25519 and AES decrypted Ethereum contract stage
  crit: hostile
  conf: 0.995
  attack: T1102,T1573.002,T1140,T1059.007
  mbc: B0024
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
  - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
  - id: micro-behaviors/crypto/asymmetric/curve25519::x25519-key-exchange-term
  - id: micro-behaviors/crypto/library/provider::diffie-hellman-call
  - id: micro-behaviors/crypto/decrypt::createDecipheriv
  - id: micro-behaviors/crypto/symmetric/aes/gcm::aes-256-gcm-dash
  - id: micro-behaviors/metaprogramming/generation::js-new-function-variable-argument
- id: ethers-contract-base64-script-loader
  desc: Executes Base64 JavaScript returned by an ethers smart contract
  crit: hostile
  conf: 0.99
  attack: T1102,T1140,T1059.007
  mbc: B0024
  near_bytes: 2048
  all:
  - id: ethers-json-rpc-provider
  - id: ethers-contract-instance
  - id: ethers-contract-zero-arg-read
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
- id: base-onchain-script-dynamic-eval
  desc: Base RPC contract scripts run via Function
  crit: hostile
  conf: 0.99
  attack: T1102,T1059.007
  near_bytes: 8192
  all:
  - id: ethers-json-rpc-provider
  - id: ethers-contract-instance
  - id: evm-contract-scriptcount-view-abi
  - id: evm-contract-getscript-view-abi
  - id: micro-behaviors/communications/http/services/blockchain::base-public-rpc-hosts-2
  any:
  - id: micro-behaviors/metaprogramming/generation::js-new-function-constructor
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
- id: base-rpc-resolved-browser-script-controller
  desc: Base contract lookup resolves an injected browser script controller
  crit: hostile
  conf: 0.99
  attack: T1102,T1105,T1059.007
  scope: file
  all:
  - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
  - id: micro-behaviors/communications/http/services/blockchain::base-public-rpc-hosts-2
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::webcrypto-aes-gcm-decrypt
  - id: micro-behaviors/process/create/load/remote-code::js-javascript-blob
  - id: micro-behaviors/process/create/load/remote-code::js-dom-script-src-set-in-file-tail
