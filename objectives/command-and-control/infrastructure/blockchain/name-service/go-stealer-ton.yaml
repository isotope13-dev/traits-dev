defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The resolver parses TON cells from an HTTP response. Independently,
  # endpoint refresh calls the blockchain-fetch/DNS-fallback chain. The
  # credential collector supplies attack admission without family identity.
  - id: go-http-stealer-ton-dns-endpoint-refresh
    desc: HTTP credential stealer refreshes endpoints through TON DNS
    crit: hostile
    conf: 0.98
    attack: T1102.001
    all:
      - id: objectives/exfiltration/stealer/multi-item::go-browser-surveillance-collector-http-upload
      - id: micro-behaviors/communications/blockchain/client::go-ton-dns-http-resolver-calls
      - id: micro-behaviors/communications/blockchain/client::go-ton-endpoint-refresh-call-chain
