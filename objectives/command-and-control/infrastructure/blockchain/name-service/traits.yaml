# Detects blockchain name-service pointers used to obtain a keyed relay list.
# Domain literals and HTTP list retrieval are neutral on their own; the
# hostile rules require a transparent victim-relay implementation as well.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, java, ruby]
  attack: T1102,T1090.003
  mbc: B0030

composite_rules:
  - id: blockchain-name-service-relay-discovery
    desc: Blockchain name-service pointer followed by keyed relay discovery
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/dns/lookup/name-service::blockchain-name-service-domain
      - id: micro-behaviors/communications/http/request/peer-list::keyed-peer-list-discovery

  - id: blockchain-name-service-txt-relay-discovery
    desc: DNS TXT-backed blockchain name-service relay discovery
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/lookup/name-service::blockchain-name-service-domain
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-query
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-response
      - id: micro-behaviors/communications/http/request/peer-list::keyed-peer-list-discovery

  - id: blockchain-name-service-victim-relay
    desc: Victim relay receives its peer list through blockchain name service
    crit: hostile
    conf: 0.99
    all:
      - id: blockchain-name-service-relay-discovery
      - id: micro-behaviors/communications/proxy/relay::transparent-stream-forwarder

  - id: upnp-event-driven-victim-relay
    desc: UPnP-exposed event-driven victim relay
    crit: hostile
    conf: 0.99
    attack: T1090.003
    all:
      - id: micro-behaviors/communications/http/request/upnp::internet-gateway-port-mapping
      - id: micro-behaviors/communications/proxy/relay::transparent-stream-forwarder
      - id: objectives/command-and-control/botnet/iot::relay-status-bandwidth-schema-source
