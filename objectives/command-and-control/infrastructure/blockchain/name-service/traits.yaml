# Detects blockchain name-service pointers used to obtain a keyed relay list.
# Domain literals and HTTP list retrieval are neutral on their own; the
# hostile rules require a transparent victim-relay implementation as well.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, java, ruby]
  attack: T1102,T1090.003
  mbc: B0030

composite_rules:
  - id: blockchain-name-service-relay-discovery
    desc: Blockchain name-service pointer followed by keyed relay discovery
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/dns/lookup/name-service::blockchain-name-service-domain
      - id: micro-behaviors/communications/http/request/peer-list::keyed-peer-list-discovery

  - id: blockchain-name-service-txt-relay-discovery
    desc: DNS TXT-backed blockchain name-service relay discovery
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/lookup/name-service::blockchain-name-service-domain
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-query
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-response
      - id: micro-behaviors/communications/http/request/peer-list::keyed-peer-list-discovery

  - id: blockchain-name-service-victim-relay
    desc: Victim relay receives its peer list through blockchain name service
    crit: hostile
    conf: 0.99
    all:
      - id: blockchain-name-service-relay-discovery
      - id: micro-behaviors/communications/proxy/relay::transparent-stream-forwarder

  - id: upnp-event-driven-victim-relay
    desc: UPnP-exposed event-driven victim relay
    crit: hostile
    conf: 0.99
    attack: T1090.003
    all:
      - id: micro-behaviors/communications/http/request/upnp::internet-gateway-port-mapping
      - id: micro-behaviors/communications/proxy/relay::transparent-stream-forwarder
      - id: objectives/command-and-control/botnet/iot::relay-status-bandwidth-schema-source

  # ENS used as a configuration channel rather than as a name lookup. The
  # registry contract is called directly, and what is read back is a `text`
  # record -- free-form key/value storage on chain -- instead of an address.
  # A wallet or dapp resolves `addr()`; code that resolves `text()` is fetching
  # settings it could have fetched over HTTPS, from somewhere nobody can seize
  # or filter.
  #
  # Suspicious alone: legitimate decentralised apps do publish config in ENS
  # text records.
  - id: ens-text-record-config-channel
    desc: Reads configuration from ENS text records
    crit: suspicious
    conf: 0.94
    for: [binaries, scripts]
    all:
      - id: micro-behaviors/communications/dns/lookup/name-service::ens-registry-contract-address
      - id: micro-behaviors/communications/dns/lookup/name-service::ens-resolver-text-lookup

  # The config channel plus what the config is for. Bandwidth-accounting
  # counters mean the host device is being enrolled as a proxy exit node and
  # its owner's connection resold; taking the node list from ENS means that
  # enrolment survives the takedown of any server. Legitimate bandwidth-sharing
  # clients point at a company's API endpoint, which can be revoked -- that is
  # the difference between a disclosed product and a resilient network.
  - id: ens-bootstrapped-proxy-node
    desc: Proxy exit node bootstrapped from ENS
    crit: hostile
    conf: 0.96
    for: [binaries, scripts]
    attack: T1090.003,T1102
    all:
      - id: ens-text-record-config-channel
      - id: micro-behaviors/communications/proxy/relay::proxy-bandwidth-accounting-counter

  # A bandwidth-resale node that resolves its bootstrap seeds through its own
  # DNS client and server list instead of the platform resolver.
  #
  # The resale counters are the load-bearing leg and are deliberately required
  # here as well as in the rule above. Private DNS-based seed discovery on its
  # own is not hostile -- a blockchain light client doing EIP-1459 node
  # discovery, or any P2P client with hardcoded seed resolvers, looks exactly
  # like this. What no peer-to-peer client does is meter how many of the user's
  # bytes it has resold, so pairing the two separates a node that joins a
  # network from a node that sells its host's connection and keeps reaching its
  # operators when the network's resolver is filtering them.
  - id: proxy-resale-private-dns-bootstrap
    desc: Bandwidth-resale node uses private DNS seeds
    crit: hostile
    conf: 0.95
    for: [binaries, scripts]
    attack: T1090.003,T1568
    all:
      - id: micro-behaviors/communications/proxy/relay::proxy-bandwidth-accounting-counter
      - id: micro-behaviors/communications/dns/lookup/name-service::builtin-dns-seed-bootstrap
