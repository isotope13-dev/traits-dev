# Multi-chain implants keep a contract address per EVM network in the
# environment, read that contract through a public RPC pool, and treat the
# result as the relay URL list. A dapp that names one chain contract does not
# also discover operator relays.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102
  crit: notable
  conf: 0.94

traits:
  - id: polygon-contract-env
    desc: Reads Polygon contract from environment
    if:
      type: text
      substr: process.env.POLYGON_CONTRACT

  - id: arbitrum-contract-env
    desc: Reads Arbitrum contract from environment
    if:
      type: text
      substr: process.env.ARBITRUM_CONTRACT

  - id: blockchain-endpoint-reader
    desc: Names a blockchain endpoint reader
    if:
      type: text
      word: readBlockchainEndpoint

  - id: relay-url-discovery
    desc: Names relay URL discovery routine
    if:
      type: text
      word: discoverRelayURLs

composite_rules:
  - id: multichain-contract-relay-discovery
    desc: Discovers relay URLs from chain contracts
    crit: hostile
    conf: 0.97
    all:
      - id: polygon-contract-env
      - id: arbitrum-contract-env
      - id: blockchain-endpoint-reader
      - id: relay-url-discovery
    unless:
      - id: metadata/path::test-directory-component
