# EtherHiding-style loader that finds its operator's transaction by walking
# blocks for a hardcoded sender's nonce, then fetches a payload over HTTP and
# runs it. The generic RPC names are notable on their own (dApps read nonces
# and blocks every day), so the composite requires the sender-scan pair plus
# an HTTP fetch and a dynamic-code or REPL execution leg. Specimen-specific
# fragments belong in the deaddrop/blockchain rules, not here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102

composite_rules:
  - id: ethereum-nonce-scan-remote-exec
    desc: Ethereum nonce block scan feeds fetched code execution
    crit: hostile
    conf: 0.97
    attack: T1102,T1059.007
    scope: file
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::eth-get-transaction-count-literal
      - id: micro-behaviors/communications/blockchain/ethereum::eth-get-block-by-number-literal
      - id: micro-behaviors/communications/http/client/exchange::source-http-client-call
    any:
      - id: micro-behaviors/process/create/exec::node-repl-stdin-spawn
      - id: micro-behaviors/process/interpreter/eval/indirect::js-inline-transformed-factory-invocation
    needs: 1
