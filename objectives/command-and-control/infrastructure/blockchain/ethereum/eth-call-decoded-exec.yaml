# EtherHiding stage retrieval: a compromised page calls a contract with the
# read-only eth_call RPC, decodes/decompresses the returned blob (GzipGnaw:
# encrypted with a page-embedded key, then gzip) and executes it. Ordinary
# dapps read contract state the same way but never execute the result.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102,T1059.007,T1027
composite_rules:
  - id: eth-call-result-decoded-and-executed
    desc: eth_call result decoded then executed
    crit: hostile
    conf: 0.95
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::eth-call-method-literal
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
    any:
      - id: micro-behaviors/data/decode/base64/call::atob-decode
      - id: micro-behaviors/data/decompress/stream::decompression-stream-constructor
      - id: micro-behaviors/data/bitwise/xor/expression::js-ts-parsed-xor-expression
