# EtherHiding-style loaders in obfuscator.io-packed JavaScript: public
# Ethereum RPC host fragments and explorer account API shards survive in the
# string table even when full URLs do not. Pairing those with hex string-table
# rotation is the on-chain C2 resolver shape seen in poisoned npm dist files
# (e.g. @wizloft/harness 0.1.1-alpha.3 / MAL-2026-14285).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102,T1195.002
  mbc: B0030

traits:
  # Shared NullReceiver / EtherHiding campaign wallet. Operators rotate the
  # dead-drop by sending from this address; the prefix survives string-array
  # splitting. This is attacker infrastructure, not a crypto capability.
  - id: etherhiding-campaign-wallet-prefix
    desc: EtherHiding campaign Ethereum wallet prefix
    crit: suspicious
    conf: 0.95
    attack: T1102
    for: [scripts, typescript, binaries]
    if:
      type: text
      substr: '0xa322E5f3'

  - id: etherhiding-campaign-wallet-prefix-unicode
    desc: Unicode-escaped EtherHiding wallet prefix
    crit: suspicious
    conf: 0.95
    attack: T1102
    if:
      type: encoded
      encoding: unicode-escape
      substr: '0xa322E5f3'

composite_rules:
  - id: obfuscated-ethereum-rpc-fragment-cluster
    desc: Obfuscated JS embeds split Ethereum public RPC hosts
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
      - id: micro-behaviors/communications/http/services/blockchain::onerpc-eth-path-fragment

  - id: obfuscated-ethereum-rpc-explorer-loader
    desc: Obfuscated JS pairs Ethereum RPC fragments with explorer account API
    crit: hostile
    conf: 0.98
    attack: T1102,T1195.002,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
      - id: micro-behaviors/communications/http/services/blockchain::explorer-module-account-fragment
    any:
      - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
      - id: micro-behaviors/communications/http/services/blockchain::onerpc-eth-path-fragment
    unless:
      - id: objectives/command-and-control/dropper/delivery/blockchain::obfuscated-etherhiding-hex-stage-dropper

  # npm EtherHiding droppers can recover their stage through Ethereum wallet
  # transactions without a Polygon contract call. The wallet/path markers
  # remain visible in an obfuscated Node loader that hides a detached child.
  - id: etherhiding-obfuscated-node-stage
    desc: Ethereum EtherHiding loader spawns an obfuscated Node stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105,T1564.003
    for: [javascript, typescript, archives]
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/blockchain::blockchain-hex-stage-path
      - id: etherhiding-campaign-wallet-prefix
      - id: micro-behaviors/process/create/spawn::spawn-call
    any:
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression

  # Some obfuscators hide both the child_process import and spawn call behind
  # computed properties, leaving the hidden-window option as the launch atom.
  - id: etherhiding-obfuscated-hidden-node-stage
    desc: Ethereum EtherHiding loader launches a hidden child stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105,T1564.003
    for: [javascript, typescript, archives]
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/blockchain::blockchain-hex-stage-path
      - id: etherhiding-campaign-wallet-prefix
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
