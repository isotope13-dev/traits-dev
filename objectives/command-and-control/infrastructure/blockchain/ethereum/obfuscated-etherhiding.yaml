# EtherHiding-style loaders in obfuscator.io-packed JavaScript: public
# Ethereum RPC host fragments and explorer account API shards survive in the
# string table even when full URLs do not. Pairing those with hex string-table
# rotation is the on-chain C2 resolver shape seen in poisoned npm dist files
# (e.g. @wizloft/harness 0.1.1-alpha.3 / MAL-2026-14285).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102,T1195.002
  mbc: B0030

traits:
  # A short address fragment is only a component of the larger profile.
  - id: etherhiding-campaign-wallet-prefix
    desc: Partial Ethereum wallet marker
    crit: component
    conf: 0.95
    attack: T1102
    for: [scripts, typescript, binaries]
    if:
      type: text
      substr: '0xa322E5f3'

  - id: etherhiding-campaign-wallet-prefix-unicode
    desc: Unicode-escaped partial Ethereum wallet marker
    crit: component
    conf: 0.95
    attack: T1102
    if:
      type: encoded
      encoding: unicode-escape
      substr: '0xa322E5f3'

composite_rules:
  - id: etherhiding-wallet-prefix-reference
    desc: Partial Ethereum wallet marker
    crit: component
    any:
      - id: etherhiding-campaign-wallet-prefix
      - id: etherhiding-campaign-wallet-prefix-unicode

  # npm EtherHiding droppers can recover their stage through Ethereum wallet
  # transactions without a Polygon contract call. The wallet/path markers
  # remain visible in an obfuscated Node loader that hides a detached child.
  - id: etherhiding-child-process-profile
    desc: Ethereum marker and child-process execution
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105,T1564.003
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/communications/url/resource-path/automation::hex-prefix-cls-path
      - id: etherhiding-wallet-prefix-reference
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call
    any:
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-expression

  # Some obfuscators hide both the child_process import and spawn call behind
  # computed properties, leaving the hidden-window option as the launch atom.
  - id: etherhiding-http-hidden-option-profile
    desc: Ethereum marker, HTTP and hidden option
    crit: suspicious
    conf: 0.98
    attack: T1027,T1564.003
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/communications/url/resource-path/automation::hex-prefix-cls-path
      - id: etherhiding-wallet-prefix-reference
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-expression
