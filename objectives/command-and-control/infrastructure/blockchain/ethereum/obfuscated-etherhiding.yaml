# EtherHiding-style loaders in obfuscator.io-packed JavaScript: public
# Ethereum RPC host fragments and explorer account API shards survive in the
# string table even when full URLs do not. Pairing those with hex string-table
# rotation is the on-chain C2 resolver shape seen in poisoned npm dist files
# (e.g. @wizloft/harness 0.1.1-alpha.3 / MAL-2026-14285).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102,T1195.002
  mbc: B0030

composite_rules:
  - id: obfuscated-ethereum-rpc-fragment-cluster
    desc: Obfuscated JS embeds split Ethereum public RPC hosts
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
      - id: micro-behaviors/communications/http/services/blockchain::onerpc-eth-path-fragment

  - id: obfuscated-ethereum-rpc-explorer-loader
    desc: Obfuscated JS pairs Ethereum RPC fragments with explorer account API
    crit: hostile
    conf: 0.98
    attack: T1102,T1195.002,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::strong-js-obfuscation
      - id: micro-behaviors/communications/http/services/blockchain::explorer-module-account-fragment
    any:
      - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
      - id: micro-behaviors/communications/http/services/blockchain::onerpc-eth-path-fragment
    unless:
      - id: objectives/command-and-control/dropper/delivery/blockchain::obfuscated-etherhiding-hex-stage-dropper
