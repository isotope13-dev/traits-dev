# EtherHiding-style C2 resolution: an EVM eth_call to a contract through
# multiple public Polygon RPC endpoints, used to obtain a mutable endpoint.
# The RPCs and contract are dual-use; the hostile interpretation comes from
# combining resolution with a staged task queue and sidecar execution.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1102

traits:
  - id: evm-eth-call-resolver
    desc: EVM JSON-RPC eth_call resolver request
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']?method["'']?\s*[:=]\s*["'']eth_call["'']'

  - id: evm-contract-call-selector
    desc: EVM contract call selector
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''](data|input)["'']\s*[:=]\s*["'']0x[a-f0-9]{8,}["'']'

  - id: evm-selector-assignment
    desc: EVM method selector assignment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(selector|method_selector)\s*=\s*["'']0x[a-f0-9]{8}["'']'

  - id: polygon-drpc-publicnode
    desc: Polygon drpc or publicnode endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://polygon\.(drpc|publicnode)\.[a-z0-9.-]+'

  - id: polygon-quiknode
    desc: Polygon QuikNode RPC endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: rpc-mainnet.matic.quiknode.pro

  - id: polygon-tatum
    desc: Polygon Tatum RPC endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: polygon-mainnet.gateway.tatum.io

  - id: polygon-nodies
    desc: Polygon Nodies RPC endpoint
    crit: notable
    conf: 0.9
    for: [lua, batch]
    if:
      type: text
      substr: polygon-public.nodies.app

  - id: task-queue-field
    desc: Loader task queue field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']tasks["'']\s*[:=]|\btasks\s*='

  - id: task-file-destination
    desc: Loader task file destination
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(file_path|file_name)\s*[:=]'

  - id: task-stage-url
    desc: Loader task stage URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(raw|releases/download)/'

composite_rules:
  - id: polygon-public-rpc-fallbacks
    desc: Multiple public Polygon RPCs
    crit: suspicious
    conf: 0.94
    any:
      - id: polygon-drpc-publicnode
      - id: polygon-quiknode
      - id: polygon-tatum
      - id: polygon-nodies
    needs: 2

  - id: smartloader-task-queue
    desc: Loader task queue with staged file
    crit: suspicious
    conf: 0.93
    all:
      - id: task-queue-field
      - id: task-file-destination
      - id: task-stage-url

  - id: polygon-etherhiding-resolver
    desc: Polygon public-RPC contract dead-drop resolver
    crit: suspicious
    conf: 0.98
    all:
      - id: evm-eth-call-resolver
      - id: polygon-public-rpc-fallbacks
    any:
      - id: evm-contract-call-selector
      - id: evm-selector-assignment

  - id: polygon-etherhiding-staged-loader
    desc: Polygon contract dead-drop resolves a staged task loader
    crit: hostile
    conf: 0.99
    attack: T1102,T1105
    all:
      - id: polygon-etherhiding-resolver
      - id: smartloader-task-queue
      - id: objectives/command-and-control/dropper/execution/lua-sidecar::lua-sidecar-interpreter-launch
