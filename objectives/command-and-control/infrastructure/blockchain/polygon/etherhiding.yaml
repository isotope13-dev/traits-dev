# EtherHiding-style C2 resolution: an EVM eth_call to a contract through
# multiple public Polygon RPC endpoints, used to obtain a mutable endpoint.
# The RPCs and contract are dual-use; the hostile interpretation comes from
# combining resolution with a staged task queue and sidecar execution.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1102

traits:
  - id: evm-contract-call-selector
    desc: EVM contract call selector
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''](data|input)["'']\s*[:=]\s*["'']0x[a-f0-9]{8,}["'']'

  - id: evm-selector-assignment
    desc: EVM method selector assignment
    crit: notable
    conf: 0.9
    if:
      type: text
      # Accept `0xb68d1809` and bare 8-hex forms used by ClearFake/ErrTraffic
      # EtherHiding resolvers (`functionSelector = "b68d1809"`).
      regex: '(?i)\b(functionSelector|selector|method_selector)\s*=\s*["''](0x)?[a-f0-9]{8}["'']'

  - id: etherhiding-delivery-script-query
    desc: Fetches staged script via delivery ID query
    crit: notable
    conf: 0.96
    for: [javascript, typescript, html]
    if:
      type: text
      # ErrTraffic/ClearFake EtherHiding loaders pull the next stage as
      # `baseUrl + '/api.php?s=' + deliveryId` after eth_call resolves.
      regex: '(?i)["'']/api\.php\?s='

  # The four public Polygon RPC hostnames this family used to define locally
  # (drpc/publicnode, QuikNode, Tatum, Nodies) matched a provider host and
  # nothing else, so they now live in
  # micro-behaviors/communications/http/services/blockchain/ and are referenced
  # from there. The EtherHiding interpretation still comes from combining them
  # with eth_call resolution, a task queue, and sidecar execution below.

  - id: task-queue-field
    desc: Loader task queue field
    crit: notable
    conf: 0.9
    # Same restriction as task-file-destination below: this schema belongs to
    # the Lua/batch sidecar loader. A bare `tasks = ...` in application code is
    # not tasking data (it fired on GRASS GIS's wxPython graphical modeler).
    for: [lua, batch]
    if:
      type: text
      regex: '(?i)["'']tasks["'']\s*[:=]|\btasks\s*='

  - id: task-file-destination
    desc: Loader task file destination
    crit: notable
    conf: 0.9
    # This task schema belongs to the Lua/batch sidecar loader family.  A
    # generic Rust or application-local `file_name =` is not tasking data.
    # The field must be *assigned a string* — tasking data names a concrete
    # destination.  Without that, `file_path:match(...)` in LuaCov's HTML
    # reporter read as a loader task record.
    for: [lua, batch]
    if:
      type: text
      regex: '(?i)\bfile_(path|name)["'']?\s*[:=]\s*["'']'

# The stage URL leg is just "a GitHub raw / release-asset URL", which is already
# defined once under micro-behaviors/communications/url/external/github and
# fires on any source file that cites a GitHub download link (Zig's std/zip.zig
# cites a ninja release in a comment).  The composite below references those
# canonical atoms instead of restating the pattern as a loader-specific trait.

composite_rules:
  # `polygon-public-rpc-fallbacks` used to live here: "names two or more public
  # Polygon RPC providers", at `suspicious`, standing alone. That is what a
  # multi-chain wallet or bridge SDK looks like -- a provider fallback table is
  # the normal way to talk to a chain -- and it convicted one on RPC hostnames
  # with no resolver, no selector and no staging. The neutral count now lives in
  # micro-behaviors/communications/http/services/blockchain/ and the resolver
  # below consumes it directly, so the intent still comes from eth_call plus a
  # contract selector rather than from the host list.

  - id: smartloader-task-queue
    desc: Loader task queue with staged file
    crit: suspicious
    conf: 0.93
    all:
      - id: task-queue-field
      - id: task-file-destination
    any:
      - id: micro-behaviors/communications/url/external/github::github-raw-file-url
      - id: micro-behaviors/communications/url/external/github::github-release-download

  - id: polygon-etherhiding-resolver
    desc: Polygon public-RPC contract dead-drop resolver
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-hosts-2
    any:
      - id: evm-contract-call-selector
      - id: evm-selector-assignment

  # Browser EtherHiding loaders (ClearFake/ErrTraffic class): resolve a mutable
  # URL via eth_call across public Polygon RPCs, then fetch and eval a staged
  # script. Distinct from the Lua/batch sidecar composite below.
  - id: polygon-etherhiding-script-stage
    desc: Polygon eth_call resolves a staged script URL
    crit: hostile
    conf: 0.99
    attack: T1102,T1105,T1059.007
    for: [javascript, typescript, html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: etherhiding-delivery-script-query
      - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::polygon-rpc-host-cluster
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw

  - id: polygon-etherhiding-dynamic-eval
    desc: Polygon contract resolution with dynamic execution
    crit: hostile
    conf: 0.98
    attack: T1102,T1059.007
    for: [javascript, typescript, html]
    near_bytes: 4096
    all:
      - id: polygon-etherhiding-resolver
    any:
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw

  # A contract-derived destination plus a nonce-bearing RC4 query is an
  # application-layer controller channel, not ordinary dApp RPC traffic.
  - id: polygon-etherhiding-rc4-query-channel
    desc: Sends nonce-based RC4 queries to a Polygon contract-resolved endpoint
    crit: hostile
    conf: 0.995
    attack: T1102,T1071.001,T1573.001
    for: [javascript, typescript, html]
    near_bytes: 8192
    all:
      - id: polygon-etherhiding-resolver
      - id: micro-behaviors/crypto/symmetric/stream::js-rc4-ksa-key-mix
      - id: micro-behaviors/crypto/symmetric/stream::js-rc4-prga-output
      - id: micro-behaviors/os/random/crypto::webcrypto-get-random-values
      - id: micro-behaviors/communications/http/url/query::function-encoded-template-query-parameter

  - id: polygon-etherhiding-staged-loader
    desc: Polygon contract dead-drop resolves a staged task loader
    crit: hostile
    conf: 0.99
    attack: T1102,T1105
    all:
      - id: polygon-etherhiding-resolver
      - id: smartloader-task-queue
      - id: micro-behaviors/process/argument/file::executable-data-or-script-file-argument

  # npm EtherHiding droppers also occur without a visible eth_call resolver:
  # the campaign wallet/path markers remain in an obfuscated Node loader that
  # hides a detached child and reaches its HTTPS client through a computed
  # property. Keep this archive-level rule independent of the package name.
  - id: etherhiding-obfuscated-node-stage
    desc: EtherHiding markers with an obfuscated hidden Node stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105,T1564.003
    for: [javascript, typescript, archives]
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/blockchain::blockchain-hex-stage-path
      - id: objectives/command-and-control/infrastructure/blockchain/ethereum::etherhiding-campaign-wallet-prefix
      - id: micro-behaviors/process/create/spawn::spawn-call
    any:
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression

  # Some obfuscators hide the child_process import and the spawn call behind
  # computed properties, leaving only the obfuscated windowsHide option as a
  # process-launch atom. Keep this path independent of vendor/campaign names.
  - id: etherhiding-obfuscated-hidden-node-stage
    desc: EtherHiding launches obfuscated hidden child stage
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.007,T1105,T1564.003
    for: [javascript, typescript, archives]
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/blockchain::blockchain-hex-stage-path
      - id: objectives/command-and-control/infrastructure/blockchain/ethereum::etherhiding-campaign-wallet-prefix
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
