# Decentralized ransomware recovery chat: Polygon eth_call resolves a mutable
# chat-proxy URL, Session swarm messaging carries negotiation, and Wasabi
# S3-compatible signing browses leaked files — without a traditional C2 domain.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1102,T1071.001

traits:
  - id: session-swarm-message-api
    desc: Session messenger swarm message API path
    crit: notable
    conf: 0.94
    if:
      type: text
      # Session onion request uses PUT /api/v1/message against swarm nodes.
      regex: '(?i)/api/v1/message\b'

  - id: wasabi-s3-host
    desc: Wasabi S3-compatible object storage host
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b([a-z0-9.-]+\.)?wasabisys\.com\b'

  - id: polygon-matic-1rpc
    desc: Polygon 1rpc.io/matic public RPC endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 1rpc.io/matic

  - id: polygon-meowrpc
    desc: Polygon meowrpc public RPC endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: polygon.meowrpc.com

composite_rules:
  - id: polygon-session-recovery-chat
    desc: Polygon eth_call resolves a Session recovery-chat proxy
    crit: hostile
    conf: 0.995
    attack: T1102,T1071.001,T1486
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/infrastructure/blockchain/polygon::evm-eth-call-resolver
      - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::polygon-rpc-host-cluster
      - id: session-swarm-message-api

  - id: polygon-wasabi-leak-browser
    desc: Polygon-resolved recovery page browses Wasabi leaks with SigV4
    crit: hostile
    conf: 0.995
    attack: T1102,T1530,T1486
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/infrastructure/blockchain/polygon::evm-eth-call-resolver
      - id: wasabi-s3-host
      - id: micro-behaviors/communications/http/services/aws::sigv4-algorithm-constant
    any:
      - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::polygon-rpc-host-cluster
      - id: session-swarm-message-api
