# Decentralized ransomware recovery chat: Polygon eth_call resolves a mutable
# chat-proxy URL, Session swarm messaging carries negotiation, and Wasabi
# S3-compatible signing browses leaked files — without a traditional C2 domain.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1102,T1071.001

traits:
  - id: session-swarm-message-api
    desc: Session messenger swarm message API path
    crit: notable
    conf: 0.94
    if:
      type: text
      # Session onion request uses PUT /api/v1/message against swarm nodes.
      regex: '(?i)/api/v1/message\b'

  - id: wasabi-s3-host
    desc: Wasabi S3-compatible object storage host
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b([a-z0-9.-]+\.)?wasabisys\.com\b'

  - id: polygon-matic-1rpc
    desc: Polygon 1rpc.io/matic public RPC endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 1rpc.io/matic

  - id: polygon-meowrpc
    desc: Polygon meowrpc public RPC endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: polygon.meowrpc.com

  # DeadLock-style getProxy() decode finds ASCII "http://" as hex inside eth_call
  # result bytes. Use the shared hex-encoded-http atom (scheme + ://) — the bare
  # four-byte "http" hex false-positives on X.509/OCSP dumps.
  - id: session-proxy-snode-method
    desc: Session service-node list proxy method
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']get_snodes["'']'

  - id: session-proxy-swarm-method
    desc: Session swarm discovery proxy method
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']get_swarms["'']'

  - id: getproxy-function-selector
    desc: EVM getProxy view-function selector
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b0x933a9ce8\b'

  - id: getdomain-function-selector
    desc: EVM getDomain view-function selector
    crit: notable
    conf: 0.96
    for: [python, javascript, typescript, html, c, cpp, pe, dll]
    # Shared by Aeternum Polygon C2 and ClearFake/ErrTraffic EtherHiding
    # resolvers (`0xb68d1809` / bare `b68d1809`).
    if:
      type: text
      regex: '(?i)\b0xb68d1809\b'

  - id: updatedomain-function-selector
    desc: EVM updateDomain admin-function selector
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript, html, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\b0xb249cd2d\b'

composite_rules:
  - id: polygon-session-recovery-chat
    desc: Polygon eth_call resolves a Session recovery-chat proxy
    crit: hostile
    conf: 0.995
    attack: T1102,T1071.001,T1486
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::polygon-rpc-host-cluster
      - id: session-swarm-message-api

  - id: polygon-wasabi-leak-browser
    desc: Polygon-resolved recovery page browses Wasabi leaks with SigV4
    crit: hostile
    conf: 0.995
    attack: T1102,T1530,T1486
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: wasabi-s3-host
      - id: micro-behaviors/communications/http/services/aws::sigv4-algorithm-constant
    any:
      - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::polygon-rpc-host-cluster
      - id: session-swarm-message-api

  # Class detection for the hex-http scan used when ABI decoding is skipped:
  # eth_call through Polygon RPCs + scanning the hex result for an http URL.
  - id: polygon-eth-call-hex-http-proxy
    desc: Polygon eth_call hex result decoded as HTTP proxy URL
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/data/encode/hex::hex-encoded-http
    any:
      - id: objectives/command-and-control/infrastructure/blockchain/multi-chain::polygon-rpc-host-cluster
      - id: polygon-matic-1rpc
      - id: polygon-meowrpc
      - id: getproxy-function-selector

  - id: polygon-getdomain-eth-call-c2
    desc: Polygon eth_call getDomain resolves mutable C2 tasking
    crit: hostile
    conf: 0.98
    for: [python, javascript, typescript, html, c, cpp, pe, dll]
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: getdomain-function-selector
    any:
      - id: objectives/command-and-control/channel/deaddrop/blockchain::evm-task-url-delimiter
      - id: micro-behaviors/data/encode/hex::hex-encoded-http
      - id: updatedomain-function-selector

  - id: session-swarm-proxy-methods
    desc: Session snode and swarm methods via HTTP proxy
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: session-proxy-snode-method
      - id: session-proxy-swarm-method
    any:
      - id: micro-behaviors/data/encode/hex::hex-encoded-http
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: session-swarm-message-api
