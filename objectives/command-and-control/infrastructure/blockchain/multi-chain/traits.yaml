# `near_bytes` because every one of these legs is standard Ethereum client
# code: an `eth_call` field, a public RPC host, a contract address, a
# `Buffer.from(hex)` and a `fetch()` are what ethers, viem, web3.js and every
# wallet bundle contain by construction. Un-anchored, the five were satisfied
# by unrelated modules megabytes apart in one webpack chunk — Rabby's vendored
# ethereumjs-util constants block was enough to convict the wallet of C2. A
# real contract-resolved C2 fetch is one routine, so requiring the evidence to
# share a 2 KB window keeps the detection and drops the coincidence.
- id: ethereum-contract-c2-config
  desc: Resolves C2 configuration through an Ethereum contract
  crit: hostile
  conf: 0.98
  attack: T1102,T1027
  for: [javascript, typescript]
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
  - id: ethereum-public-rpc-host
  - id: ethereum-contract-address-literal
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
- id: ethereum-contract-remote-javascript
  desc: Ethereum-resolved C2 response executes remote JavaScript
  crit: hostile
  conf: 0.99
  attack: T1102,T1059.007
  for: [javascript, typescript]
  all:
  - id: ethereum-contract-c2-config
  - id: micro-behaviors/process/interpreter/eval::js-eval-variable-text
- id: smart-contract-c2-dead-drop
  desc: Smart contract read over public blockchain RPC for remote configuration
  crit: suspicious
  conf: 0.97
  attack: T1102
  for: [html, javascript, typescript]
  all:
  - id: polygon-rpc-host-cluster
  - id: eth-rpc-method
  - id: contract-or-address
  any:
  - id: function-selector-encoded
  - id: contract-read
  unless:
- id: smart-contract-c2-dead-drop-b64xor255
  desc: Base64 XOR smart contract C2 dead drop
  crit: suspicious
  conf: 0.98
  attack: T1102
  for: [javascript, html]
  all:
  - id: objectives/command-and-control/infrastructure/blockchain-rpc::polygon-rpc-pair-b64xor255
  - id: objectives/command-and-control/infrastructure/blockchain/polygon::contract-address-b64xor255
  - id: objectives/command-and-control/infrastructure/blockchain/polygon::eth-call-b64xor255
  # Multi-chain blockchain C2: uses multiple blockchain networks as dead-drop
- id: multi-chain-c2
  desc: Multiple blockchain networks as C2 channels
