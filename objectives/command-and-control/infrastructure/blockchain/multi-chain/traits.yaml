# An `input` field followed by a hex or XOR decode is how EVM dead-drop
# loaders recover a C2 URL from a transaction's calldata. The window used to
# be 700 bytes, which in a minified bundle or a syntax-highlighter keyword
# list joins two unrelated tokens; 200 keeps the two halves in one statement.
- id: tx-input-field-hex-decode
  desc: Transaction input field near a hex decode
  crit: component
  conf: 0.86
  for: [scripts, source, pe, dll]
  if:
    type: text
    regex: '\\?["'']input\\?["''][\s\S]{0,200}(0x|hex[_-]?(decode|to|2))'
- id: tx-input-field-xor-decode
  desc: Transaction input field near an XOR decode
  crit: component
  conf: 0.86
  for: [scripts, source, pe, dll]
  if:
    type: text
    regex: '(?i)\\?["'']input\\?["''][\s\S]{0,200}(fromhex|xor)'
