defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts, source]
traits:
- id: contract-address-encoded
  desc: XOR or encoded smart contract address
  crit: suspicious
  conf: 0.9
  attack: T1102
  for: [html, javascript, typescript]
  if:
    type: encoded
    encoding: xor
    regex: 0x[a-fA-F0-9]{40}
- id: function-selector-encoded
  desc: Encoded 4-byte smart contract selector
  crit: notable
  conf: 0.8
  attack: T1102
  for: [html, javascript, typescript]
  if:
    type: encoded
    encoding: xor
    regex: FUNCTION_SELECTOR['"]?\s*:\s*['"][a-fA-F0-9]{8}['"]|38bcdc1c
- id: bsc-eth-call-urls-payload
  desc: eth_call result expects urls JSON field
  crit: suspicious
  conf: 0.92
  attack: T1102
  if:
    type: text
    regex: 'eth_call[\s\S]{0,200}"urls"'
- id: bsc-url-list-network-use-before
  desc: HTTP client uses URLs after eth_call
  crit: notable
  conf: 0.93
  attack: T1102,T1105
  platforms: [windows, unix]
  for: [javascript, typescript, rust, go, c, cpp, csharp, pe]
  if:
    type: text
    regex: '(?si)eth_call.{0,600}(fetch|axios|reqwest|HttpClient).{0,600}"urls"'
- id: bsc-url-list-network-use-after
  desc: HTTP client uses URLs before eth_call
  crit: notable
  conf: 0.93
  attack: T1102,T1105
  platforms: [windows, unix]
  for: [javascript, typescript, rust, go, c, cpp, csharp, pe]
  if:
    type: text
    regex: '(?si)(fetch|axios|reqwest|HttpClient).{0,600}"urls".{0,600}eth_call'
- id: eth-call-selector-4e5765f1
  desc: eth_call selector 0x4e5765f1
  crit: notable
  conf: 0.98
  attack: T1102
  for: [pe, dll, csharp]
  if:
    type: text
    substr: '"data":"0x4e5765f1"},"latest"],"id":1}'
composite_rules:
- id: ethereum-smart-contract-query
  desc: Ethereum smart contract JSON RPC query
  crit: suspicious
  conf: 0.98
  attack: T1102
  for: [pe, dll, csharp]
  all:
  - id: micro-behaviors/communications/rpc::jsonrpc-eth-call-body
  - id: eth-call-selector-4e5765f1
  any:
  - id: micro-behaviors/communications/http/post::native-post-method-token
  - id: micro-behaviors/communications/http/client/managed::request
  - id: micro-behaviors/communications/http/client/managed::getresponse
- id: blockchain-c2-loader
  desc: Blockchain backed loader with persistence
  crit: hostile
  conf: 0.99
  attack: T1102
  for: [pe, dll, csharp]
  all:
  - id: ethereum-smart-contract-query
  any:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  - id: micro-behaviors/os/autorun/control::windows-schtasks-onlogon-highest
  - id: objectives/persistence/login/scheduled-task/cli::schtasks-logon-query-create
  - id: metadata/lang/source/syntax/command/invocation::rundll32-command-syntax-reference
- id: blockchain-c2-fetch
  desc: Fetches payload from blockchain infrastructure (dead-drop)
  crit: suspicious
  conf: 0.95
  attack: T1102
  any:
  - id: objectives/command-and-control/infrastructure/blockchain/solana::solana-payload-fetch
  - id: objectives/anti-static/obfuscation/string/encrypt::blockchain-xor-code-concealment
  - id: objectives/command-and-control/infrastructure/blockchain/polygon::polygon-smart-contract-loader-c2
- id: contract-or-address
  desc: Contract keyword or Ethereum address
  crit: component
  conf: 0.3
  for: [html, javascript, typescript]
  any:
  - id: metadata/lang/source/literal/value::contract-word
  - id: contract-address-encoded
  - id: objectives/command-and-control/infrastructure/blockchain/polygon::contract-address-b64xor255
# `near_bytes` because every one of these legs is standard Ethereum client
# code: an `eth_call` field, a public RPC host, a contract address, a
# `Buffer.from(hex)` and a `fetch()` are what ethers, viem, web3.js and every
# wallet bundle contain by construction. Un-anchored, the five were satisfied
# by unrelated modules megabytes apart in one webpack chunk — Rabby's vendored
# ethereumjs-util constants block was enough to convict the wallet of C2. A
# contract-resolved destination and computed-authority request must also be
# present: displaying a decoded contract value is ordinary wallet behavior.
# Keep the evidence in one 2 KB window rather than across a bundled library.
- id: ethereum-contract-c2-config
  desc: Ethereum contract read with decoded destination and computed HTTP request
  crit: hostile
  conf: 0.98
  attack: T1102,T1027
  for: [javascript, typescript]
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
  - id: micro-behaviors/communications/http/url/rpc::ethereum-public-rpc-host
  - id: micro-behaviors/data/format/crypto-address::ethereum-address-literal
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
  - id: micro-behaviors/communications/url/construction/build-http::destination-from-call-or-hex
  - id: micro-behaviors/communications/url/construction/build-http::request-to-variable-authority
- id: ethereum-contract-remote-javascript
  desc: Ethereum-resolved C2 response executes remote JavaScript
  crit: hostile
  conf: 0.99
  attack: T1102,T1059.007
  for: [javascript, typescript]
  all:
  - id: ethereum-contract-c2-config
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
- id: smart-contract-c2-dead-drop
  desc: Reads a contract through multiple public Polygon RPC endpoints
  crit: suspicious
  conf: 0.97
  attack: T1102
  for: [javascript]
  all:
  - id: micro-behaviors/communications/blockchain/client::polygon-rpc-host-cluster
  - id: micro-behaviors/communications/rpc::ethereum-query-method-reference
  - id: contract-or-address
  any:
  - id: function-selector-encoded
  - id: metadata/lang/source/syntax/assignment/name::eight-hex-selector-assignment
  unless:
- id: smart-contract-c2-dead-drop-b64xor255
  desc: Base64 XOR smart contract C2 dead drop
  crit: suspicious
  conf: 0.98
  attack: T1102
  for: [javascript, html]
  all:
  - id: micro-behaviors/communications/http/url/rpc::polygon-rpc-pair-b64xor255
  - id: objectives/command-and-control/infrastructure/blockchain/polygon::contract-address-b64xor255
  - id: micro-behaviors/communications/rpc::eth-call-b64xor255
- id: seeded-blockchain-global-loader
  desc: Decodes and executes obfuscated code using blockchain RPCs
  crit: hostile
  conf: 0.99
  attack: T1102,T1027,T1059.007
  mbc: B0024
  for: [javascript, typescript]
  # Evaluate the decoded source itself; carrier and stage are separate units.
  scope: file
  all:
  - id: micro-behaviors/data/string/reorder::char-array-swap-and-join
  - id: metadata/lang/source/syntax/operator::bitwise-xor-operator
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  any:
  - id: micro-behaviors/communications/http/services/blockchain::trongrid-api
  - id: micro-behaviors/communications/http/url/rpc::trongrid-api-encoded
  - id: micro-behaviors/communications/http/url/rpc::aptos-fullnode-provider
  - id: micro-behaviors/communications/http/url/rpc::aptos-fullnode-encoded
  - id: micro-behaviors/communications/http/url/rpc::bsc-public-rpc-provider
  - id: micro-behaviors/communications/http/url/rpc::bsc-dataseed-encoded
  - id: micro-behaviors/communications/http/url/rpc::bsc-publicnode-encoded
  - id: micro-behaviors/communications/blockchain/client::ethereum-transaction-by-hash-literal
  - id: micro-behaviors/communications/rpc::eth-gettransactionbyhash-encoded
- id: arweave-gateway
  desc: Uses Arweave gateway (permanent content
  crit: notable
  conf: 0.7
  attack: T1102
  for: [javascript, typescript]
  any:
  - id: micro-behaviors/communications/http/services/blockchain::arweave-net-gateway
  - id: micro-behaviors/communications/http/services/blockchain::ar-io-net-gateway
- id: native-bsc-eth-call-url-deaddrop
  desc: Native BSC eth_call resolves download URLs
  crit: hostile
  conf: 0.96
  attack: T1102.002,T1105
  mbc: C0002,B0024
  for: [pe, dll]
  all:
  - id: micro-behaviors/communications/http/url/rpc::bsc-public-rpc-provider
  - id: micro-behaviors/communications/rpc::jsonrpc-eth-call-body
  any:
  - id: bsc-eth-call-urls-payload
  - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text

# EtherHiding is a transport technique, not a family signature: the implant
# reads a mutable URL list from an EVM smart contract through a public BSC RPC.
# The URL-list response marker keeps the rule specific enough to avoid treating
# ordinary BSC transaction queries as C2.
- id: bsc-url-list-network-use
  desc: Uses URL list from eth_call response
  crit: suspicious
  conf: 0.93
  attack: T1102,T1105
  platforms: [windows, unix]
  for: [javascript, typescript, rust, go, c, cpp, csharp, pe]
  any:
  - id: bsc-url-list-network-use-before
  - id: bsc-url-list-network-use-after
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
- id: bsc-etherhiding-url-resolution
  desc: BSC smart contract resolves remote URL list
  crit: suspicious
  conf: 0.98
  attack: T1102,T1105
  platforms: [windows, unix]
  for: [javascript, rust]
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/url/rpc::bsc-public-rpc-provider
  - id: micro-behaviors/communications/rpc::jsonrpc-eth-call-body
  - id: bsc-eth-call-urls-payload
  - id: bsc-url-list-network-use

# A native ELF that combines an Ethereum RPC read with host and TCP-state
# profiling is a different shape from the Windows download-and-execute loader
# above.  Keep the composite strict: each individual capability is dual-use,
# but their combination is a strong dead-drop/host-survey signal.
- id: native-ethereum-rpc-host-profile
  desc: Native ELF uses Ethereum RPC while profiling host and TCP state
  crit: hostile
  conf: 0.97
  attack: T1102,T1016,T1082,T1027
  for: [elf]
  all:
  - id: micro-behaviors/communications/rpc::jsonrpc-eth-call-body
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
  - id: micro-behaviors/fs/proc/profile::host-profile-path-set
  - id: metadata/binary/header/program::elf-executable-stack

# SectopRAT's fallback channel: when the hardcoded C2 is unreachable it POSTs
# to a public BSC dataseed host and decodes an alternate C2 IP from the RPC
# response. A native binary that carries a BSC dataseed RPC host next to a raw
# hardcoded IPv4:port endpoint is using public blockchain infrastructure as a
# dead-drop resolver beside its primary channel -- neither leg is malicious
# alone, but a compiled program rarely needs both.
- id: native-bsc-deaddrop-fallback-c2
  desc: BSC RPC host with hardcoded C2 endpoint
  crit: suspicious
  conf: 0.9
  attack: T1102,T1008
  for: [c, cpp, csharp]
  all:
  - id: micro-behaviors/communications/http/url/rpc::bsc-dataseed-provider
  - id: micro-behaviors/communications/ip/endpoint::ipv4-port-source
