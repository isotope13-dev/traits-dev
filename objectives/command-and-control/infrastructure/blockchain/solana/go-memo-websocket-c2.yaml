# The existing Solana memo dead-drop composites (solana-memo-deaddrop-c2,
# solana-memo-deaddrop-beacon, signature-memo-decoded-evaluation) all gate on
# for: [python, javascript, typescript] and an HTTP fetch/POST sink, because
# the samples they were built from beacon over HTTP once the memo is
# resolved. A compiled Go RAT that rotates its C2 through the same
# getSignaturesForAddress -> getTransaction(jsonParsed) -> Memo-program read,
# then decrypts the instruction data and dials a WebSocket instead of
# POSTing, falls through every one of them: it is excluded by `for` and its
# transport is a WebSocket library, not micro-behaviors/communications/http.
defaults:
  platforms: [windows, linux, macos]
  for: [go, pe, source]
  attack: T1102,T1071.001
  mbc: B0024

composite_rules:
  - id: solana-memo-decrypted-websocket-c2
    desc: Decrypts Solana memo, dials C2 WebSocket
    crit: hostile
    conf: 0.96
    near_lines: 120
    near_bytes: 6144
    all:
      - id: micro-behaviors/communications/blockchain/client::solana-get-signatures-for-address
      - id: micro-behaviors/communications/blockchain/client::solana-get-transaction
      - id: micro-behaviors/communications/blockchain/client::solana-memo-program-references
      - id: micro-behaviors/communications/websocket/library::go-websocket-library
    any:
      - id: micro-behaviors/crypto/decrypt/initialize::go-cbc-decrypter-name-reference
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-aes-constructor-reference
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
