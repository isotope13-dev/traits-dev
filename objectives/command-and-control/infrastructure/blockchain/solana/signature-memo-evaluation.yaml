defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, python]
  attack: T1102,T1027

composite_rules:
  - id: signature-memo-decoded-evaluation
    desc: Signature memos with decoded code evaluation
    crit: suspicious
    conf: 0.95
    near_bytes: 6144
    # getSignaturesForAddress already returns memo fields. Requiring a
    # getTransaction lookup or Memo-program address misses this RPC path.
    # This is bounded co-occurrence, not a claim of proven memo-to-eval flow.
    # No wallet, provider, filename, function name or install hook is required.
    all:
      - id: micro-behaviors/communications/http/url/rpc::solana-get-signatures-for-address
      - id: micro-behaviors/communications/blockchain/client::signature-history-memo-access
    any:
      - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
      - id: micro-behaviors/process/interpreter/eval/direct::python-exec-base64-result
