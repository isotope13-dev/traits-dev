defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  attack: T1102
traits:
  - id: malicious-solana-program-id
    desc: 'Known malicious Solana Program ID'
    crit: suspicious
    conf: 1.0
    if:
      type: string_literal
      substr: 6YGcuyFRJKZtcaYCCFba9fScNUvPkGXodXE1mJiSzqDJ
composite_rules:
  - id: npm-c2-builder-solana-web3
    desc: npm C2 builder uses Solana Web3
    crit: suspicious
    conf: 0.94
    for: [package.json]
    all:
      - id: objectives/command-and-control/dropper/builder::npm-rat-builder-panel
      - id: metadata/import/package::dep-solana-web3
  - id: solana-payload-fetch
    desc: Fetches payload from Solana program accounts
    crit: hostile
    conf: 0.95
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/url/rpc::solana-rpc-method-any
      - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
      - id: malicious-solana-program-id
  - id: solana-rpc-function-constructor-loader
    desc: Solana RPC fetched data executed via Function constructor
    crit: hostile
    conf: 0.96
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/url/rpc::solana-rpc-method-any
      - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg

  # GlassWorm-class: list recent wallet signatures, fetch the transaction, pull
  # a Base64 C2 URL out of the Memo instruction, then POST to that URL.
  - id: solana-memo-deaddrop-resolve
    desc: Resolves C2 URL from Solana Memo dead drop
    crit: suspicious
    conf: 0.97
    for: [python, javascript, typescript, go]
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/url/rpc::solana-signature-then-transaction
      - id: micro-behaviors/communications/http/url/rpc::solana-memo-instruction-parse
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/communications/http/url/rpc::solana-jsonparsed-encoding

  - id: solana-memo-deaddrop-c2
    desc: Solana Memo dead drop drives outbound C2 request
    crit: hostile
    conf: 0.98
    for: [python, javascript, typescript, go]
    attack: T1102,T1071.001
    mbc: B0024
    near_lines: 100
    all:
      - id: solana-memo-deaddrop-resolve
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/url/build::post-to-variable-authority

  - id: solana-memo-deaddrop-beacon
    desc: Beacons to URL decoded from Solana Memo field
    crit: hostile
    conf: 0.97
    for: [python, javascript, typescript]
    attack: T1102,T1071.001
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
      - id: micro-behaviors/communications/http/url/rpc::solana-get-signatures-for-address
      - id: micro-behaviors/communications/http/url/rpc::solana-get-transaction
      - id: micro-behaviors/communications/http/url/rpc::solana-memo-instruction-parse
      - id: micro-behaviors/data/decode/base64::base64-decoding
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern

  # Operator-side counterpart of the Memo dead-drop resolver: AES-GCM
  # encrypt a C2 server URL and publish the ciphertext as a Memo instruction.
  - id: solana-memo-encrypted-c2-publish
    desc: Solana Memo encrypted C2 publish
    crit: hostile
    conf: 0.98
    attack: T1102,T1573.001
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/url/rpc::solana-memo-instruction-parse
      - id: micro-behaviors/crypto/library/blockchain/wallet::solana-keypair-from-secret-key
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createCipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::cipher-update-server-url
