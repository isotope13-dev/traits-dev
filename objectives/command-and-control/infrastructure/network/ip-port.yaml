defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [binaries, scripts, source]
traits:
composite_rules:
  - id: shell-persistent-netcat-downloader
    desc: Shell persistent netcat download channel
    crit: hostile
    conf: 0.97
    for: [shell]
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-assignment
      - id: micro-behaviors/communications/socket/netcat::nc-variable-endpoint
      - id: micro-behaviors/data/control-flow/loop::shell-infinite-loop
      - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
