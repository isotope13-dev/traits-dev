defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: suspicious
  conf: 0.8
traits:
  - id: fragmented-url-scheme
    desc: Fragmented URL scheme string (e.g., "https:/")
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - type: metrics
        field: imports.count
        min: 30
      # The second arm is Perl Porting/checkURL.pl, whose catalog of broken
      # spellings includes lines that are only "http:/" or "ftp:/"; the third
      # is FTPES/FTPS protocol lists in file managers and network tools. Kept on
      # this existing condition so the rule stays under the suppression cap.
      - type: raw
        regex: 'url_prefix\s*=\s*url|ftp:%5Cn\$url|ftpes?:/|f\x00t\x00p\x00e\x00s\x00:\x00/\x00'
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: well-known/app/productivity/thebrain::thebrain-known-app-context
      - id: well-known/app/enterprise/microsoft-office-support::microsoft-office-support-bundle-context
      - id: metadata/signed/leaf::microsoft-corporation
      - id: well-known/app/utility/screentogif::screentogif-app-context
    if:
      type: text
      regex: ^(https?:/|ftp:/|sftp:/)$
      case_insensitive: true
