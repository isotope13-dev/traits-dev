# Tiered C2 resolution bootstrapped from a public code forge. Illegal
# gambling and stealer operations park a plain-text next-tier address
# file on GitHub/Gitee/GitLab raw hosting, register the device with the
# servers it names, then ask those servers for the real server list, so
# no single takedown kills the chain. A lone raw-forge fetch is routine
# for open-source updaters, and server-list discovery is routine for
# load-balanced games; the dead-drop claim requires the forge bootstrap
# and the discovery tier together, and the hostile claim additionally
# requires device registration into that chain. No hostname, marker
# token, or repository name gates either rule.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  attack: T1102.001
  mbc: B0030

composite_rules:
  - id: code-host-dead-drop-server-discovery
    desc: Code-forge raw file bootstraps next-tier server discovery
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/url/host/name::code-host-raw-file-url
      - id: micro-behaviors/communications/url/resource-path/configuration::server-list-discovery-path

  - id: tiered-dead-drop-device-registration
    desc: Device registers into a code-forge-bootstrapped tiered resolver
    crit: hostile
    conf: 0.96
    attack: T1102.001,T1071.001
    all:
      - id: code-host-dead-drop-server-discovery
      - id: micro-behaviors/communications/url/resource-path/identity::device-registration-endpoint-path
      - id: micro-behaviors/crypto/symmetric/aes/initialize::mobile-aes-cipher-construction
    any:
      - id: micro-behaviors/communications/url/resource-path/collection::geo-location-upload-path
      - id: micro-behaviors/communications/url/resource-path/collection::device-info-upload-path
      - id: micro-behaviors/data/db/schema/relational::server-key-cache-table
      - id: micro-behaviors/crypto/key/representation/material::aes-key-json-field
    needs: 2
    near_bytes: 16384
