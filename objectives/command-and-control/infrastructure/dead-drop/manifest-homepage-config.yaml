# An install-time script treats its own package.json `homepage` field as a
# remote configuration pointer: it reads the field, fetches the URL, parses
# the JSON and downloads whatever archive the config names. The manifest
# field looks like ordinary package metadata while the operator can swap the
# downloaded stage at any time without publishing a new version.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1102.001,T1105,T1195.002

composite_rules:
  - id: install-script-homepage-config-stage-pointer
    desc: Install script fetches stage URL via homepage field
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: micro-behaviors/os/package-manager/identity::node-own-manifest-homepage-read
      - id: micro-behaviors/data/parse/json::js-json-parse-direct-or-computed
      - id: micro-behaviors/fs/write/file/unspecified::node-downloaded-tgz-write
