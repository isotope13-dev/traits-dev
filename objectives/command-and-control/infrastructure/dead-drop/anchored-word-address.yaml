# A carrier URL and HTTP call co-occur with the anchored word-address decoder.
# This is a resolver candidate, not proof of a subsequent C2 connection.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  attack: T1102.001,T1027
composite_rules:
  - id: github-anchored-word-address
    desc: GitHub fetch co-occurs with word-address reconstruction
    crit: suspicious
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/custom::anchored-word-address-decoder
      - id: micro-behaviors/communications/http/url/forge::github-raw-url
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/lib/netlib::open-uri-fetch-call
  # The resolver candidate above is calibrated at suspicious because the
  # resolved value may never be used. When the same file also dials a raw
  # socket, the decoded address is a rendezvous endpoint: the dead drop hid a
  # C2 address from static inspection and the program went there. No
  # legitimate program reconstructs an address from anchored words in fetched
  # content and connects to it.
  - id: github-anchored-word-address-dialed
    desc: Word-encoded GitHub dead-drop address decoded and dialed
    crit: hostile
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/custom::anchored-word-address-decoder
      - id: micro-behaviors/communications/http/url/forge::github-raw-url
      - id: micro-behaviors/communications/socket/connect::outbound-connect-call
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/lib/netlib::open-uri-fetch-call
