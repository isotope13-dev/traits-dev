defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: dictionary-address-shell
    desc: Remote word-address fetch with socket shell
    crit: hostile
    conf: 0.97
    attack: T1102,T1027
    near_lines: 80
    unless:
      - id: objectives/command-and-control/reverse-shell/fd-redirect::placeholder-documentation-address
    all:
      - id: micro-behaviors/communications/socket/connect::connect-python
      - id: micro-behaviors/data/decode/custom::dictionary-dot-join
      - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
      - id: micro-behaviors/process/create/shell/interactive::python-subprocess-interactive-shell
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
