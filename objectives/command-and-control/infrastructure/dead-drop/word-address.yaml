defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: dictionary-address-shell
    desc: Remote retrieval and dictionary decoding alongside an interactive shell
    crit: hostile
    conf: 0.97
    attack: T1102,T1027
    near_lines: 80
    all:
      - id: micro-behaviors/data/decode/custom::dictionary-dot-join
      - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
      - id: micro-behaviors/process/create/shell/interactive::python-subprocess-interactive-shell
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
