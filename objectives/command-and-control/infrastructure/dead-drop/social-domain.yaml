# Semantic diagnostics supply the resolver role; endpoints alone stay neutral.
# No video ID, Drive object ID, key, domain, or staged filename gates a rule.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  attack: T1102.001

traits:
  - id: youtube-domain-resolution-message
    desc: Diagnostic reports YouTube domain resolution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)domain (obtained|retrieved|resolved|fetched) from YouTube\b'

  - id: drive-domain-resolution-message
    desc: Diagnostic reports Drive text domain resolution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)domain (obtained|retrieved|resolved|fetched) from Google Drive text file\b'

  - id: c2-text-file-diagnostic
    desc: Diagnostic reports C2 text-file address source
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(failed to (read|download)|empty) C2 text file|C2 text file is empty'

composite_rules:
  - id: youtube-comment-domain-resolver
    desc: YouTube comments accompany domain-resolution diagnostics
    crit: suspicious
    conf: 0.98
    all:
      - id: youtube-domain-resolution-message
      - id: micro-behaviors/communications/http/services/google::youtube-comment-threads-endpoint
      - id: micro-behaviors/communications/http/services/google::youtube-comment-original-text-field

  - id: youtube-comment-agent-c2-resolver
    desc: YouTube domain resolver accompanies C2 configuration injection
    crit: hostile
    conf: 0.99
    all:
      - id: youtube-comment-domain-resolver
      - id: c2-text-file-diagnostic
      - id: micro-behaviors/fs/write/content::agent-config-domain-injection-message

  - id: drive-text-agent-c2-resolver
    desc: Drive C2 configuration accompanies live-agent file deletion
    crit: hostile
    conf: 0.99
    all:
      - id: drive-domain-resolution-message
      - id: c2-text-file-diagnostic
      - id: micro-behaviors/fs/write/content::agent-config-domain-injection-message
      - id: micro-behaviors/communications/http/url/cloud::gdrive-download-url
      - id: objectives/evasion/indicator-removal/cleanup::agent-files-deleted-while-monitoring-message
