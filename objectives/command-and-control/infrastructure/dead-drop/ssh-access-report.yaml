defaults:
  platforms: [unix]
  for: [python]
composite_rules:
  # A shared fallback collector plus publication of a usable access command
  # establishes the rendezvous role. Neither a service hostname nor POST alone
  # does. The default flag must refer to the same module-level URL binding.
  - id: python-default-collector-ssh-access-report
    desc: SSH access report with fixed collector fallback
    crit: suspicious
    conf: 0.98
    attack: T1102.001
    all:
      - id: micro-behaviors/communications/http/client/configure::python-fixed-http-url-default-return
      - id: micro-behaviors/communications/http/client/exchange::python-urllib-ssh-command-report-send
