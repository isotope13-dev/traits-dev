# Eupdate Helper relay infrastructure: the family fetches its trial-account
# list from id.1yz.me and serves an info/landing page from info.hb.1yz.me.
# Host-specific so unrelated subdomains of the attacker domain cannot
# overmatch.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: suspicious
  conf: 0.95
  mbc: C0011
  attack: T1071.001

traits:
  - id: eupo-1yz-me-host
    desc: Eupdate Helper relay host under 1yz.me
    if:
      type: text
      regex: '(?i)\b(info\.hb|id)\.1yz\.me\b'
