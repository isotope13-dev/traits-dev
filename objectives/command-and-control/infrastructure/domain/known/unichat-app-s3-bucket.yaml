defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
  crit: suspicious
  conf: 0.95
  mbc: C0011
  attack: T1105

traits:
  # Bucket of a Q-Dir installer tampering campaign that serves a Python
  # agent archive and a standalone 7zr.exe to the stager.
  - id: unichat-app-updatas-s3-bucket
    desc: Malicious S3 bucket hosting Python agent
    if:
      type: text
      substr: unichat-app-updatas.s3.
