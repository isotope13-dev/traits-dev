# Huntress Figure 2 identifies this relay as attacker-controlled.
# Scope to reconstructed PowerShell configuration syntax actually tested.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious
  conf: 0.99
  attack: T1219
traits:
  - id: truexx-freeddns-screenconnect-relay
    ref: https://www.huntress.com/blog/rmm-alerts-msp-soc-incident-response
    desc: Reported malicious relay host parameter
    if:
      type: text
      regex: '(?i)[?&]h=truexx\.freeddns\.org(&|["''\s]|$)'
      exclude_comments: true
