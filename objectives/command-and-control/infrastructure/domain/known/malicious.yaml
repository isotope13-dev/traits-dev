defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: suspicious
  conf: 1.0
traits:
  - id: npm-recon-exfil-425a2-domain
    desc: Known npm recon-exfil domain (425a2 infra)
    unless:
      - id: well-known/lib/ui/simple-icons::simple-icons-package-context
    if:
      type: text
      regex: '(?i)\b425a2\.[a-z0-9-]+\.[a-z]{2,}'
  - id: bootstrapcdn-fun-c2
    desc: C2 domain impersonating Bootstrap CDN
    if:
      type: text
      substr: start.bootstrapcdn.fun
