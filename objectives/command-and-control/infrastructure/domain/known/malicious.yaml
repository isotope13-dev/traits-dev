defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: suspicious
  conf: 1.0
traits:
  # A ScreenConnect client using this relay was captured by Triage with the
  # unattended Access/Guest role; URLhaus also tracks related ConnectWise MSI
  # samples. Keep the IOC suspicious and require product/config context in
  # hostile consumers.
  - id: adminrolling-live-screenconnect-relay
    desc: Reported malicious ScreenConnect relay domain
    crit: suspicious
    conf: 0.99
    attack: T1071.001
    for: [msi, pe, dll, xml, oledoc]
    if:
      type: text
      substr: relay.adminrolling.live
  - id: npm-recon-exfil-425a2-domain
    desc: Known npm recon-exfil domain (425a2 infra)
    unless:
      - id: well-known/lib/ui/simple-icons::simple-icons-package-context
    if:
      type: text
      regex: '(?i)\b425a2\.[a-z0-9-]+\.[a-z]{2,}'
  - id: bootstrapcdn-fun-c2
    desc: C2 domain impersonating Bootstrap CDN
    if:
      type: text
      substr: start.bootstrapcdn.fun
