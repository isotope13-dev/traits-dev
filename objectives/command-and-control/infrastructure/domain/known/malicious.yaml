defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: suspicious
  conf: 1.0
traits:
  - id: npm-recon-exfil-425a2-domain
    desc: Known npm recon-exfil domain (425a2 infra)
    if:
      type: text
      substr: 425a2.
  - id: bootstrapcdn-fun-c2
    desc: C2 domain impersonating Bootstrap CDN
    if:
