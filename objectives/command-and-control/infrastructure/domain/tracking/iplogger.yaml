defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: browser-cookie-blocklist-rules
    desc: Browser cookie blocklist rules
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      substr: "var commons="
  - id: iplogger-domain-b
    desc: 2no.co / yip.su tracking domains
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \b(2no\.co|yip\.su)\b
    unless:
      - type: text
        regex: \b(2no\.co|yip\.su)\b
        section: .rsrc
      # The same benign-context carve-out the iplogger atoms use: shortener and
      # blocker catalogs enumerate tracking hosts to warn on them.
      - id: metadata/file/catalog/identity::bulk-domain-blocklist
      - id: metadata/package/quality/
composite_rules:
  - id: iplogger-domain
    desc: Detects iplogger tracking domains
    crit: suspicious
    conf: 0.95
    any:
      - id: objectives/discovery/network/ip-tracker::iplogger
      - id: iplogger-domain-b
  - id: tracking-services-domain
    desc: Detects tracking domains in malware beacons
    crit: suspicious
    conf: 0.9
    any:
      - id: objectives/discovery/network/ip-tracker/
  - id: iplogger-keyword-marker
    desc: Detects 'iplogger' keyword with HTTP indicators
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/discovery/system/fingerprint/network::iplogger-keyword
    any:
      - id: micro-behaviors/communications/http/message::http-prefix
      - id: micro-behaviors/communications/http/message::https-prefix
    unless:
      - id: browser-cookie-blocklist-rules
      # Bundled domain catalogs (blockers, warners, shortener databases)
      # mention iplogger as data to act on, not as a beacon to contact. The
      # composite needs its own exclusion: pooled archive evidence can keep
      # the `all:` leg alive even where the atom itself is suppressed.
      - id: metadata/file/catalog/identity::bulk-domain-blocklist
  - id: fragmented-tracking-beacon
    desc: Detects fragmented tracking/logging URL construction
    crit: suspicious
    conf: 0.9
    any:
      - id: objectives/discovery/system/fingerprint/network::iplogger-keyword
      - id: iplogger-domain
      - id: tracking-services-domain
