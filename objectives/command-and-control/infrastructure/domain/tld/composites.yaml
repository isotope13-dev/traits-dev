defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - documents
  attack: T1071
traits:
- id: ruby-sdk-default-api-xyz
  desc: Ruby SDK default .xyz API endpoint
  crit: notable
  conf: 0.9
  for:
  - ruby
  if:
    type: text
    regex: DEFAULT_BASE_URL\s*=\s*["']https://api\.[A-Za-z0-9.-]{1,80}\.xyz\b
composite_rules:
- id: ruby-sdk-owned-api-endpoint
  for:
  - ruby
  desc: Ruby SDK default API endpoint
  crit: notable
  conf: 0.9
  all:
  - id: ruby-sdk-default-api-xyz
  - id: micro-behaviors/communications/http/client/initialize::net-http-start
- id: tld-zone
  desc: .zone domain (commonly abused)
  crit: notable
  conf: 0.75
  any:
  - id: tld-zone-binary
  - id: tld-zone-source-literal
- id: free-tld
  desc: Free/abused TLD host contacted by an HTTP client
  crit: suspicious
  conf: 0.8
  any:
  - id: free-tld-shell-download
  - id: free-tld-other-script-endpoint-a
  - id: free-tld-other-script-endpoint-b
  - id: free-tld-binary-endpoint
  - id: free-tld-host-endpoint
  - id: micro-behaviors/communications/url/host/tld-http::tld-ga-source-request
  - id: micro-behaviors/communications/url/host/tld-http::tld-ga-binary-url
  unless:
  - id: metadata/file/format/structured::tracker-announce-url-list
  - id: well-known/tool/sysadmin/whois::whois-utility
  - id: well-known/lib/data/holidays::country-calendar-module
  - id: metadata/package/manager::homebrew-formula-class
- id: free-tld-other-script-endpoint-a
  desc: Interpreted-script HTTP context and .tk URL coexist
  crit: suspicious
  conf: 0.82
  for: [python, javascript, ruby, php, perl, lua, applescript]
  all:
  - id: micro-behaviors/communications/url/host/tld-http::script-tld-tk-url
  - id: micro-behaviors/communications/http/client/
  near_bytes: 1024
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/manager::homebrew-formula-class
  - id: well-known/lib/vendor-sdk/vulcan-api::vulcan-api-routing
- id: free-tld-other-script-endpoint-b
  desc: Shell or chat script HTTP context and .tk URL coexist
  crit: suspicious
  conf: 0.82
  for: [batch, powershell, vbs, mirc, ircii]
  all:
  - id: micro-behaviors/communications/url/host/tld-http::script-tld-tk-url
  - id: micro-behaviors/communications/http/client/
  near_bytes: 1024
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/manager::homebrew-formula-class
- id: free-tld-binary-endpoint
  desc: Binary HTTP endpoint uses free .tk domain
  crit: suspicious
  conf: 0.82
  for:
  - binaries
  all:
  - id: micro-behaviors/communications/url/host/tld-http::tld-tk-url
  - id: micro-behaviors/communications/http/client/
  near_bytes: 1024
- id: free-tld-host-endpoint
  desc: HTTP client contacts a .cf/.gq free-TLD host
  crit: suspicious
  conf: 0.82
  for:
  - scripts
  - binaries
  all:
  - id: micro-behaviors/communications/http/client/
  any:
  - id: micro-behaviors/communications/url/host/name::tld-cf
  - id: micro-behaviors/communications/url/host/name::tld-gq
  near_bytes: 1024
- id: suspicious-tld
  desc: Suspicious top-level domain
  crit: notable
  conf: 0.75
  any:
  - id: free-tld
  - id: micro-behaviors/communications/url/host/tld-http::tld-su
  - id: tld-zone
  - id: objectives/command-and-control/infrastructure/domain/abused-tlds
  - id: micro-behaviors/communications/url/host/tld-http::tld-icu
  - id: micro-behaviors/communications/url/host/tld-http::tld-pw
  - id: micro-behaviors/communications/url/host/name::tld-space
  - id: micro-behaviors/communications/url/host/name::tld-shop
  - id: micro-behaviors/communications/url/host/name::tld-help
- id: suspicious-php-endpoint
  for:
  - scripts
  - '!jcl'
  desc: PHP endpoint near a monitored top-level domain
  crit: notable
  conf: 0.95
  near_bytes: 500
  all:
  - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-script
  any:
  - id: free-tld
  - id: micro-behaviors/communications/url/host/tld-http::tld-zip
  - id: micro-behaviors/communications/url/host/tld-http::tld-su
  - id: tld-zone
  - id: objectives/command-and-control/infrastructure/domain/abused-tlds
  - id: micro-behaviors/communications/url/host/tld-http::tld-icu
  - id: micro-behaviors/communications/url/host/tld-http::tld-pw
  - id: micro-behaviors/communications/url/host/name::tld-space
  - id: micro-behaviors/communications/url/host/name::tld-shop
  - id: micro-behaviors/communications/url/host/name::tld-help
  downgrade:
    scope: archive
    any:
    - id: well-known/app/browser-extension/pt-depiler::extension-context
- id: screenconnect-rmm-on-su-infrastructure
  for:
  - pe
  desc: ScreenConnect binary references .su infrastructure
  crit: suspicious
  conf: 0.96
  attack: T1219
  all:
  - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-family
  - id: micro-behaviors/communications/url/host/tld-http::tld-su
- id: screenconnect-rmm-on-external-ip-infrastructure
  for:
  - pe
  desc: ScreenConnect launcher references external IPv4 infrastructure
  crit: suspicious
  conf: 0.96
  attack: T1219
  all:
  - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-family
  - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-query-port-binary
  - id: objectives/command-and-control/backdoor/control/rmm::screenconnect-clickonce-session-url
  unless:
  - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-signed-launcher-context
