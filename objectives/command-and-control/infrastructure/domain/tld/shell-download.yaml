defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: free-tld-shell-download
    desc: Shell downloader targets a .tk URL
    crit: suspicious
    conf: 0.9
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @cmd)
          argument: [(word) (raw_string) (string)] @url
          (#match? @cmd "^(curl|wget)$")
          (#match? @url "https?://[A-Za-z0-9.-]{1,120}\\.tk([/:?#]|[\"']?$)")
          (#not-match? @url "(^|[./])(tcl|calimero|tclers)\\.tk([/:?#]|[\"']?$)"))
    unless:
      - id: metadata/path/directory::test-directory-component
