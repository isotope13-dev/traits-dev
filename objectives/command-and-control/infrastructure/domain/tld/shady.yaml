defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, documents]
  crit: suspicious
  attack: T1071
traits:
  - id: tld-cf
    desc: .cf domain (free)
    conf: 0.8
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.cf([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*!
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: metadata/file/format/structured::tracker-announce-url-list
      - id: well-known/app/system/google-search::google-regional-search-domain-list
      - id: well-known/lib/data/easylist::bundle-marker
      - id: well-known/app/browser-extension/ublock-origin::filter-bundle
      # A cited hyperlink in a static web page is not a network endpoint.
      - id: metadata/file/profile/identity::static-html-shell
  - id: tld-gq
    desc: .gq domain (free)
    conf: 0.8
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.gq([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
    unless:
      # A cited hyperlink in a static web page is not a network endpoint.
      - id: metadata/file/profile/identity::static-html-shell
      # GNU whois embeds registry referral URLs, including the .gq web WHOIS
      # interface, as lookup data rather than C2 infrastructure.
      - id: well-known/tool/sysadmin/whois::whois-utility
      # The holidays package cites country websites as reference data.
      - id: well-known/lib/data/holidays::country-calendar-module
  - id: tld-zip
    desc: URL uses the .zip top-level domain
    # A URL in prose, a feed-history list, or other documentation is not
    # evidence that the artifact contacts a .zip host.  Keep this objective
    # signal on executable/script content where it can describe an endpoint
    # used by the program.
    for: [scripts, binaries]
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.zip([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: /[^\s/]+\.zip$
      - substr: https://file.zip
      - substr: cosmo.zip
    unless:
      - id: well-known/app/development/homebrew::source-tree
      - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
  - id: tld-zone-binary
    desc: .zone domain in binary
    for: [binaries]
    conf: 0.75
    crit: notable
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.zone([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
  - id: tld-zone-source-literal
    desc: .zone URL literal in source
    for: [scripts]
    conf: 0.75
    crit: notable
    if:
      type: literal
      regex: https?://[A-Za-z0-9.-]{1,120}\.zone([:/?#\s"'<>]|$)
  - id: eu-org-free-dns
    desc: .eu.org free DNS URL in binary
    # A binary URL string is not package metadata, so it remains a useful
    # infrastructure signal here.
    for: [binaries]
    conf: 0.85
    crit: suspicious
    count_max: 5
    if:
      type: literal
      # Match URL form like sibling TLD rules; bare "x.eu.org" matches author email addresses in docs.
      regex: https?://[A-Za-z0-9.-]{1,120}\.eu\.org(:[0-9]{1,5})?([/?#\s"'<>]|$)
    not:
      # Public proxy/CDN checker used by proxypool-style Cloudflare IP lists;
      # the URL is data in the list, not C2 infrastructure in the package.
      - substr: https://zip.baipiao.eu.org
    unless:
      - id: metadata/file/profile/identity::static-html-shell
      - type: raw
        substr: http://elm.eu.org/
      - type: raw
        substr: gutenberg.eu.org
      # eSTREAM / eCRYPT is the European academic stream-cipher project; its URL is
      # cited in the docs of ChaCha/Salsa20 crypto crates (rand_chacha, chacha20).
      - type: raw
        substr: ecrypt.eu.org
      - id: well-known/app/development/homebrew::source-tree
