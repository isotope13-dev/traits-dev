# A document whose linked OLE object is served from a free dynamic-DNS name.
# Publishers of real linked content use their own domains; a duckdns/no-ip
# host behind an auto-fetching object is throwaway delivery infrastructure.
defaults:
  platforms: [windows]
  for: [zip, ooxml, xml]
  crit: hostile
  attack: T1568,T1566.001

composite_rules:
  - id: document-ole-link-served-from-dynamic-dns
    desc: Document links an OLE object from a dynamic DNS host
    conf: 0.93
    scope: outer
    all:
      - id: metadata/document/office/markup::rels-oleobject-remote-http-target
    any:
      - id: metadata/document/office/markup::rels-oleobject-dyndns-noip-target
      - id: metadata/document/office/markup::rels-oleobject-dyndns-freedns-target
      - id: metadata/document/office/markup::rels-oleobject-dyndns-noip-alt-target
      - id: metadata/document/office/markup::rels-oleobject-dyndns-dynu-target

  # The same fact from the office analyzer's relationship list, for documents
  # typed as OOXML (where the parts are not scanned as text).
  - id: ooxml-ole-link-served-from-dynamic-dns
    for: [ooxml]
    desc: Document links an OLE object from a dynamic DNS host
    conf: 0.93
    all:
      - id: metadata/document/office/external-link::ooxml-oleobject-relationship-type
      - id: metadata/document/office/external-link::ooxml-dynamic-dns-target
      - id: metadata/document/office/external-link::ooxml-single-external-relationship
