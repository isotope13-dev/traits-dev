defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: reversed-nemucod-c2-url
    desc: Detects the reversed and obfuscated C2 URL
    crit: suspicious
    if:
      type: text
      regex: lxh/tp/t:[a-z0-9./?=&%]+
composite_rules:
  - id: nemucod-c2-domain
    desc: Detects Nemucod C2 URL patterns.
    crit: hostile
    all:
      - id: micro-behaviors/data/control-flow/analysis::js-nested-for-loop
      - id: objectives/command-and-control/infrastructure/domain/extraction::reversed-nemucod-c2-url
