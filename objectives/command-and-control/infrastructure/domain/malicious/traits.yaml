defaults:
  platforms:
  - linux
  - macos
  - windows
  # xml: WSF/HTA hosts are typed as XML with embedded JScript; cloud staging
  # URLs in those droppers must still match.
  for: [python, javascript, powershell, pe, elf, macho, xml]
  mbc: C0002
  attack: T1071.001
traits:
- id: connectivity-accesscam-dns-query
  desc: DNS query for connectivity.accesscam.org
  crit: suspicious
  conf: 0.99
  attack: T1071.004
  for: [elf]
  if:
    type: hex
    section: .rodata
    pattern: 0C 63 6F 6E 6E 65 63 74 69 76 69 74 79 09 61 63 63 65 73 73 63 61 6D 03 6F 72 67 00 00 01 00 01
- id: ipcheck-cloud
  desc: ipcheck.cloud malicious domain (C2/Dropper)
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: ipcheck.cloud
- id: evilpacket-net
  desc: Evilpacket.net malicious domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: evilpacket.net
- id: healdsburgdistricthospital-net
  desc: "healdsburgdistricthospital.net C2 domain"
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: healdsburgdistricthospital.net
- id: filioruters-com
  desc: filioruters.com malicious domain
  crit: suspicious
  conf: 1.0
  attack: T1105
  if:
    type: text
    substr: filioruters.com
- id: internetserchinkas-co
  desc: internetserchinkas.co payload-delivery domain
  crit: suspicious
  conf: 1.0
  attack: T1105
  if:
    type: text
    substr: internetserchinkas.co
- id: anti-theft-web-heroku
  desc: 'Anti-theft-web.herokuapp.com malicious domain'
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: anti-theft-web.herokuapp.com

- id: numeric-lookalike-c2-host
  desc: Root URL host with numeric-prefixed brand label
  crit: suspicious
  conf: 0.8
  for: [binaries, scripts, manifests]
  attack: T1583.001
  # Limit this to the registrable-looking host immediately following the URL
  # scheme. Numeric project or tenant labels in a vendor/cloud subdomain (for
  # example `14257-contentmetadata.adobeioruntime.net`) are not lookalike roots.
  if:
    type: text
    regex: (?i)https?://[0-9]{4,}-[a-z][a-z0-9-]*\.[a-z]{2,24}([/"'?:#]|$)
  unless:
  - id: metadata/file/catalog/identity/
  - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
- id: openclaw-c2-domain
  desc: OpenClaw C2 domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: setup-service.com
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: h5-helloniubi-shop
  desc: h5.helloniubi.shop malicious C2 domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: h5.helloniubi.shop
- id: sweetcrypto-api-host
  desc: api.sweetcrypto.com OSM-flagged malicious host
  crit: suspicious
  conf: 0.99
  for: [go, markdown]
  if:
    type: text
    substr: api.sweetcrypto.com
- id: appwrite-storage
  desc: Appwrite cloud storage (commonly abused)
  crit: suspicious
  conf: 0.85
  attack: T1105
  if:
    type: text
    regex: '[a-z0-9-]+\.cloud\.appwrite\.io/v[0-9]+/storage/buckets/[a-z0-9]+/files/'
- id: firebase-storage
  desc: Firebase storage endpoint (can be abused)
  crit: notable
  conf: 0.7
  attack: T1105
  if:
    type: text
    regex: firebasestorage\.googleapis\.com/v[0-9]+/b/[^/]{1,120}/o/
- id: reversed-firebase-storage
  desc: Reversed Firebase storage endpoint
  crit: suspicious
  conf: 0.88
  attack: T1105
  for: [powershell, javascript, typescript, shell, batch]
  if:
    type: string_literal
    substr: moc.sipaelgoog.egarotsesaberif
- id: reversed-myfirebase-host
  desc: Reversed myfirebase host
  crit: suspicious
  conf: 0.9
  attack: T1105
  for: [powershell, javascript, typescript, shell, batch]
  if:
    type: string_literal
    substr: moc.esabelifym
- id: php-collect-dup
  desc: PHP collect endpoint
  crit: suspicious
  conf: 0.6
  attack: T1041
  if:
    type: text
    regex: /collect[_-]?(info|data|stats)?\.php
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource

- id: php-log-dup
  desc: PHP log endpoint
  crit: notable
  conf: 0.6
  attack: T1041
  if:
    type: text
    regex: /log[_-]?(info|data)?\.php
- id: php-beacon-dup
  desc: PHP beacon endpoint
  crit: baseline
  conf: 0.8
  attack: T1041
  if:
    type: text
    substr: /beacon.php
- id: php-gate
  desc: PHP gate endpoint path marker
  crit: notable
  conf: 0.7
  attack: T1041
  if:
    type: text
    substr: /gate.php
# NOTE: generic managed-PaaS/serverless endpoints (AWS API Gateway, Azure
# Websites, Google Cloud Functions, Vercel, Netlify) are ubiquitous legitimate
# platforms, not malicious by themselves. Relocated to
# micro-behaviors/communications/http/url/path/cloud-api as neutral comms
# capabilities; C2 composites reference them cross-tier when combined with
# malicious context.
# NOTE: the neutral Replit host atoms (replit-dev, repl-co) were relocated to
# micro-behaviors/communications/http/url/path/cloud-api as neutral comms
# capabilities (a bare Replit deployment host is not C2). The replit-hosted
# composite below references them cross-tier. Only the specifically-abused
# ephemeral `*.id.repl.co` shape remains here as a suspicious signal.
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
- id: replit-id-domain
  desc: Replit ID endpoint (commonly abused)
  crit: suspicious
  conf: 0.85
  attack: T1071
  if:
    type: text
    regex: '[a-f0-9-]+\.id\.repl\.co'
- id: glitch-hosted
  desc: Contacts Glitch-hosted endpoint
  crit: notable
  conf: 0.8
  attack: T1071
  unless:
  - id: metadata/package/testing/
  - type: text
    substr: "describe('first party sets'"
  - id: "metadata/file/naming::test-directory-component"
  if:
    type: text
    regex: '[a-z0-9-]+\.glitch\.me'
- id: render-hosted
  desc: Contacts Render-hosted endpoint
  crit: notable
  conf: 0.75
  attack: T1071
  if:
    type: text
    regex: '[a-f0-9-]{8,}\.onrender\.com'
# NOTE: the neutral ccTLD atoms `hardcoded-domain-ru` / `hardcoded-domain-cn`
# moved to ../tld/country.yaml (a hardcoded .ru/.cn domain is not malicious on
# its own). The composites below reference them cross-directory.
- id: suspicious-php-filename
  desc: Suspicious PHP endpoint URL (gate/upload/etc)
  crit: suspicious
  unless:
    - id: metadata/file/profile/test-indications/
    - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
    - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
    - id: well-known/tool/offensive/pentestkit/
    - id: well-known/tool/offensive/bingo/
    - id: well-known/tool/offensive/bbot::package-tree-member
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  conf: 0.85
  if:
    type: text
    regex: 'https?://[^/]{1,120}/[^/\n]{0,120}(gate|cmd|shell|payload)\.php'
  not:
  - substr: https://video.sibnet.ru/shell.php
- id: cloudfront-php-file-parameter
  desc: CloudFront PHP endpoint with file parameter
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'https://[a-z0-9-]{10,32}\.cloudfront\.net/[^?\s]{4,48}\.php\?file='
composite_rules:
- id: c2-domain
  desc: Likely C2 domain infrastructure
  crit: suspicious
  conf: 0.85
  size_max: 5000
  any:
  - id: numeric-lookalike-c2-host
  - id: openclaw-c2-domain
  - id: h5-helloniubi-shop
  - id: sweetcrypto-api-host
  - id: ipcheck-cloud
  - id: evilpacket-net
  unless:
  - id: well-known/app/productivity/web-to-epub::wte-extension-context
- id: php-collector-comp
  desc: References PHP data collection endpoint URL
  crit: notable
  conf: 0.85
  attack: T1041
  any:
  - id: objectives/command-and-control/infrastructure/domain/malicious::php-collect-dup
  - id: objectives/command-and-control/infrastructure/domain/malicious::php-log-dup
  - id: micro-behaviors/communications/http/url/php-endpoint::php-report-script-path
  - id: objectives/command-and-control/infrastructure/domain/malicious::php-beacon-dup
  - id: php-gate
- id: replit-hosted
  desc: Contacts Replit-hosted endpoint (commonly abused)
  crit: suspicious
  conf: 0.85
  attack: T1071
  any:
  - id: micro-behaviors/communications/http/services/cloud::replit-dev
  - id: micro-behaviors/communications/http/services/cloud::repl-co
  - id: replit-id-domain
  unless:
  - id: well-known/lib/ui/qt
  - id: well-known/app/security/keepassxc/
  - id: well-known/app/ai/agent-runtime/bobi/
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy/
  - id: well-known/app/ai/gateway/litellm/
  - id: well-known/lib/ai/litellm/
  # The Public Suffix List enumerates every delegated suffix on the internet,
  # repl.co and replit.dev among them. Any bundle carrying psl (tough-cookie,
  # request, axios and their dependents all do) matched this on lookup data
  # rather than on a request. The list is data, not a destination.
  - id: well-known/lib/network/public-suffix-list::public-suffix-list
- id: tunnel-service
  desc: References tunneling service endpoint
  crit: notable
  conf: 0.85
  attack: T1572
  any:
  - id: objectives/command-and-control/infrastructure/domain/tunnel/
  unless:
  - id: well-known/lib/ui/qt
  - id: well-known/app/security/keepassxc/
  - id: well-known/app/productivity/keepercommander/
- id: internetserchinkas-fetch-eval
  desc: PowerShell fetch-eval cradle targets internetserchinkas.co
  crit: hostile
  conf: 1.0
  attack: T1059.001,T1105
  for: [powershell]
  all:
  - id: internetserchinkas-co
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
