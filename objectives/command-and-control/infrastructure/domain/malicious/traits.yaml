defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - powershell
  - pe
  - elf
  - macho
  - xml
  mbc: C0002
  attack: T1071.001
traits:
- id: connectivity-accesscam-dns-query
  desc: DNS query for connectivity.accesscam.org
  crit: suspicious
  conf: 0.99
  attack: T1071.004
  for:
  - elf
  if:
    type: hex
    section: .rodata
    pattern: 0C 63 6F 6E 6E 65 63 74 69 76 69 74 79 09 61 63 63 65 73 73 63 61 6D 03 6F 72 67 00 00 01
      00 01
- id: ipcheck-cloud
  desc: ipcheck.cloud malicious domain (C2/Dropper)
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: ipcheck.cloud
- id: evilpacket-net
  desc: Evilpacket.net malicious domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: evilpacket.net
- id: healdsburgdistricthospital-net
  desc: healdsburgdistricthospital.net C2 domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: healdsburgdistricthospital.net
- id: filioruters-com
  desc: filioruters.com malicious domain
  crit: suspicious
  conf: 1.0
  attack: T1105
  if:
    type: text
    substr: filioruters.com
- id: internetserchinkas-co
  desc: internetserchinkas.co payload-delivery domain
  crit: suspicious
  conf: 1.0
  attack: T1105
  if:
    type: text
    substr: internetserchinkas.co
- id: anti-theft-web-heroku
  desc: Anti-theft-web.herokuapp.com malicious domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: anti-theft-web.herokuapp.com
- id: numeric-lookalike-c2-host
  desc: Root URL host with numeric-prefixed brand label
  crit: suspicious
  conf: 0.8
  for:
  - binaries
  - scripts
  - manifests
  attack: T1583.001
  if:
    type: text
    regex: (?i)https?://[0-9]{4,}-[a-z][a-z0-9-]*\.[a-z]{2,24}([/"'?:#]|$)
  not:
  - regex: (?i)https?://[0-9]{4,}-(example|test|localhost|invalid)\.
  unless:
  - id: metadata/file/format/threat-intelligence::threat-indicator-data
- id: openclaw-c2-domain
  desc: OpenClaw C2 domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: setup-service.com
  unless:
  - id: metadata/path/directory::test-directory-component
- id: h5-helloniubi-shop
  desc: h5.helloniubi.shop malicious C2 domain
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: h5.helloniubi.shop
- id: sweetcrypto-api-host
  desc: References SweetCrypto API host
  crit: notable
  conf: 0.99
  for:
  - go
  - markdown
  if:
    type: text
    substr: api.sweetcrypto.com
- id: appwrite-storage
  desc: Appwrite cloud storage (commonly abused)
  crit: suspicious
  conf: 0.85
  attack: T1105
  if:
    type: text
    regex: '[a-z0-9-]+\.cloud\.appwrite\.io/v[0-9]+/storage/buckets/[a-z0-9]+/files/'
- id: firebase-storage
  desc: Firebase storage endpoint (can be abused)
  crit: notable
  conf: 0.7
  attack: T1105
  if:
    type: text
    regex: firebasestorage\.googleapis\.com/v[0-9]+/b/[^/]{1,120}/o/
- id: reversed-firebase-storage
  desc: Reversed Firebase storage endpoint
  crit: suspicious
  conf: 0.88
  attack: T1105
  for:
  - powershell
  - javascript
  - typescript
  - shell
  - batch
  if:
    type: string_literal
    substr: moc.sipaelgoog.egarotsesaberif
- id: reversed-myfirebase-host
  desc: Reversed myfirebase host
  crit: suspicious
  conf: 0.9
  attack: T1105
  for:
  - powershell
  - javascript
  - typescript
  - shell
  - batch
  if:
    type: string_literal
    substr: moc.esabelifym
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: replit-id-domain
  desc: Replit ID endpoint (commonly abused)
  crit: suspicious
  conf: 0.85
  attack: T1071
  if:
    type: text
    regex: '[a-f0-9-]+\.id\.repl\.co'
- id: render-hosted
  desc: Contacts Render-hosted endpoint
  crit: notable
  conf: 0.75
  attack: T1071
  if:
    type: text
    regex: '[a-f0-9-]{8,}\.onrender\.com'
- id: cloudfront-php-file-parameter
  desc: CloudFront PHP endpoint with file parameter
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: https://[a-z0-9-]{10,32}\.cloudfront\.net/[^?\s]{4,48}\.php\?file=
- id: proxystream-st
  desc: Malicious proxy C2 domain proxystream.st
  crit: suspicious
  conf: 0.98
  for:
  - binaries
  - scripts
  - source
  attack: T1090
  if:
    type: text
    word: proxystream.st
    case_insensitive: true
    exclude_comments: true
- id: lindnor-msrcontrib-com
  desc: Lindnor C2 domain msrcontrib.com
  crit: suspicious
  conf: 1.0
  for:
  - binaries
  - scripts
  - source
  if:
    type: text
    word: msrcontrib.com
    case_insensitive: true
    exclude_comments: true
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: lindnor-cfgsync-relay-azure
  desc: Lindnor Azure fallback C2 hostname
  crit: suspicious
  conf: 1.0
  for:
  - binaries
  - scripts
  - source
  if:
    type: text
    word: cfgsync-relay.eastus.cloudapp.azure.com
    case_insensitive: true
    exclude_comments: true
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
- id: c2-domain
  desc: Likely C2 domain infrastructure
  crit: suspicious
  conf: 0.85
  size_max: 5000
  any:
  - id: numeric-lookalike-c2-host
  - id: openclaw-c2-domain
  - id: h5-helloniubi-shop
  - id: sweetcrypto-api-host
  - id: ipcheck-cloud
  - id: evilpacket-net
  - id: lindnor-msrcontrib-com
  - id: lindnor-cfgsync-relay-azure
- id: lindnor-dual-c2-service
  desc: Lindnor Windows service backdoor with primary and fallback C2s
  crit: hostile
  conf: 1.0
  attack: T1071.001,T1543.003
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: lindnor-msrcontrib-com
  - id: lindnor-cfgsync-relay-azure
  - id: micro-behaviors/os/service/dispatch::windows-service-dispatch-any
  any:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-open
  - id: micro-behaviors/communications/http/client/wininet::internet-open
- id: internetserchinkas-fetch-eval
  desc: PowerShell fetch-eval cradle targets internetserchinkas.co
  crit: hostile
  conf: 1.0
  attack: T1059.001,T1105
  for:
  - powershell
  all:
  - id: internetserchinkas-co
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
