defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: wecan-hasthe-packed-pe-uploader
    desc: Packed PE uploads an embedded executable to Wecan Hasthe C2
    crit: hostile
    conf: 0.995
    attack: T1105,T1027.002
    all:
      - id: wecan-hasthe-upload-endpoint
      - id: micro-behaviors/communications/http/upload::multipart-file-array-field
      - id: metadata/binary/layout::pe-embedded
      - id: metadata/binary/section/names::upx-section-pair
