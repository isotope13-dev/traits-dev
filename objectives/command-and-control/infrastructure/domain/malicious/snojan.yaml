defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: wecan-hasthe-packed-pe-uploader
    desc: Packed PE posts a file array to Wecan Hasthe C2
    crit: hostile
    conf: 0.995
    attack: T1105,T1027.002
    all:
      - id: objectives/command-and-control/infrastructure/domain/malicious::wecan-hasthe-upload-endpoint
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: metadata/binary/section/label::upx-section-pair
