# The neutral .space suffix observation moved to
# micro-behaviors/communications/url/host/name::tld-space.
# Commercial TLDs (.icu, .click, .pw) that are frequently
# abused for malware delivery and C2 due to cheap registration and
# permissive registrars. Aggregated into the parent
# objectives/command-and-control/infrastructure/domain/tld::suspicious-tld
# composite for downstream consumers.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: component
  attack: T1071
traits:
  - id: tld-icu
    crit: notable
    desc: URL with .icu TLD (commonly abused)
    conf: 0.85
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.icu([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
    unless:
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
  - id: tld-click
    crit: notable
    desc: URL with .click TLD (commonly abused)
    conf: 0.82
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.click([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
    unless:
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
  - id: tld-pw
    crit: notable
    desc: URL with .pw TLD (commonly abused)
    conf: 0.8
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.pw([:/?#\s"'<>]|$)
    unless:
      - id: well-known/lib/data/holidays::country-calendar-module
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
    not:
      - regex: ^\s*#
      - regex: ^\s*//
  - id: tld-vip
    crit: notable
    desc: URL with .vip TLD (commonly abused)
    conf: 0.8
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.vip([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
    unless:
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
  - id: tld-cyou
    crit: notable
    desc: URL with .cyou TLD (commonly abused)
    conf: 0.8
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.cyou([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
