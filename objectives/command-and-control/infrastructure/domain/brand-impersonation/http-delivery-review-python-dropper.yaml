defaults:
  platforms: [windows, unix]
  for:
    - python
  mbc: B0024
  attack: T1105

composite_rules:
  - id: cloudflared-pro-download-execute-name-clues
    desc: Cloudflared lookalike host and download-execute name
    crit: suspicious
    conf: 0.97
    attack: T1105,T1583.001
    for: [binaries, elf, so, dylib, dll, python, whl]
    all:
      - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::cloudflared-pro-typosquat-host
      - id: "metadata/lang/source/naming/action/function-name::download-execute-symbol-name"
