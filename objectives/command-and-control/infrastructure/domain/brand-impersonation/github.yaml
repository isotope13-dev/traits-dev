defaults:
  crit: suspicious
  attack: T1583.001
  mbc: C0002
  for: [python, javascript, shell, pe, elf, macho]
  platforms: [linux, macos, windows]

traits:
  - id: github-double-letter-typosquat-domain
    desc: GitHub double-letter typosquat domain
    conf: 0.9
    if:
      type: text
      regex: '(giithub|githhub|githuub|githubb)\.[a-z]{2,}'
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime::test-basename-suffix
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
      - id: well-known/lib/cloud/pycognito::pycognito-aws-cognito-library
    not:
      - substr: garnaat/placebo
