# Service-impersonation domains used as phishing infrastructure.  The atoms
# describe URL-host structure rather than an incident-specific domain list:
# a service brand is placed beside a credential lure, or a target-looking
# hostname is nested below a redirect-controlled suffix.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, documents, data]
  attack: T1583.001
  mbc: C0002

traits:
  - id: credential-lure-login-label
    desc: Login lure label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,60}login[a-z0-9.-]{0,24}\.[a-z]{2,24}'
    not:
      - regex: '(?i)https?://login\.microsoftonline\.com\b'

  - id: credential-lure-mail-label
    desc: Mail lure label in URL host
    crit: component
    conf: 0.82
    if:
      type: text
      # Require a complete hostname label.  Substring matching made the
      # legitimate `gmail.googleapis.com` API host look like a mail lure.
      regex: '(?i)https?://([a-z0-9-]+\.){0,8}(mail|email|inbox)\.[a-z0-9.-]+\.[a-z]{2,24}'
    not:
      - regex: '(?i)https?://mail\.(google|yahoo|icloud)\.com\b'
      # Country-code and regional mail hosts used by real providers
      # (e.g. mail.yahoo.co.jp) are not credential-lure infrastructure.
      - regex: '(?i)https?://([a-z0-9-]+\.)*mail\.yahoo\.(com|co|net)(\.[a-z]{2,3})?\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*mail\.google\.(com|co)(\.[a-z]{2,3})?\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*mail\.(yandex|protonmail)\.[a-z]{2,12}\b'

  - id: credential-lure-support-label
    desc: Support lure label in URL host
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,60}support[a-z0-9.-]{0,24}\.[a-z]{2,24}'
    # The substring match is deliberate — `support-microsoft.xyz` and
    # `microsoft-support.tk` are real lure shapes — but it also swallows the
    # vendors' own help centres, which are the most-linked support hosts there
    # are.  Documentation linking `support.google.com` is not a lure.
    not:
      - regex: '(?i)https?://support\.(google|microsoft|apple|mozilla|atlassian|zendesk)\.com\b'
      - regex: web\.archive\.org
    unless:
      - type: text
        substr: web.archive.org
      - type: text
        regex: '(?m)^# From https?://'

  - id: google-service-label
    desc: Google brand in nested noncanonical host
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]*(google|gmail|q[o0]oqle|g[o0]{2}dle)\.[a-z0-9-]+\.[a-z]{2,24}'
    # Google APIs and account services legitimately use multi-label hosts
    # such as `gmail.googleapis.com`; those are not phishing infrastructure.
    not:
      - regex: '(?i)https?://([a-z0-9-]+\.)*googleapis\.com\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*google\.com\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*gmail\.com\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*gstatic\.com\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*googleusercontent\.com\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*googlevideo\.com\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*google\.github\.io\b'
      # Google-run developer domains whose canonical form is `google.<label>.<tld>`,
      # the exact shape this atom treats as nested impersonation: `google.aip.dev`
      # is Google's API Improvement Proposals site and `google.golang.org` hosts
      # its Go modules, both of them ordinary documentation and import links.
      - regex: '(?i)https?://google\.aip\.dev\b'
      - regex: '(?i)https?://google\.golang\.org\b'
      # Google country-code domains such as google.com.pr and google.co.uk
      # are canonical service hosts, not nested brand impersonation.
      - regex: '(?i)https?://([a-z0-9-]+\.)*(google|gmail)\.(com|co|org|net|ac|gov)\.[a-z]{2,3}\b'

  - id: microsoft-service-label
    desc: Microsoft brand in nested noncanonical URL host
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]*(microsoft|microsoftonline)\.[a-z0-9-]+\.[a-z]{2,24}'
    not:
      # Microsoft's GitHub Pages host is canonical project infrastructure.
      - regex: '(?i)https?://microsoft\.github\.io(?:[/:?#]|$)'

  - id: microsoft-lookalike-label
    desc: Microsoft lookalike label in URL host
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,40}(microsofl|misrcosofts)[a-z0-9.-]{0,20}\.[a-z]{2,24}'

  - id: office-service-label
    desc: Office brand in nested noncanonical host
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]*(office365|office-35[0-9])\.[a-z0-9-]+\.[a-z]{2,24}'

  - id: drive-service-label
    desc: Drive service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,40}drive-[a-z0-9]{2,8}[a-z0-9.-]{0,20}\.[a-z]{2,24}'

  - id: other-cloud-service-label
    desc: Cloud-mail brand in nested noncanonical URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]*(icloud|yahoo|outlook)\.[a-z0-9-]+\.[a-z]{2,24}'
    not:
      - regex: '(?i)https?://outlook\.office(365)?\.com\b'
      # Canonical provider country/region hosts such as yahoo.co.jp are not
      # nested brand impersonation; exclude them the same way google.com.xx is.
      - regex: '(?i)https?://([a-z0-9-]+\.)*yahoo\.(com|co|net|org)(\.[a-z]{2,3})?\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*outlook\.(com|live|office|office365)\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*icloud\.com\b'

  - id: docs-service-label
    desc: Docs service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,48}docs?-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  - id: document-service-label
    desc: Document service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,40}documents?-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  - id: pdf-service-label
    desc: PDF service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,48}pdf-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  - id: storage-service-label
    desc: Storage service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,48}storage-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  - id: share-service-label
    desc: Share service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,48}share[a-z0-9-]*-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  - id: viewer-service-label
    desc: Viewer service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,48}viewer-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  - id: preview-service-label
    desc: Preview service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,48}preview-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  - id: cloud-file-service-label
    desc: Cloud file service label in URL host
    crit: component
    conf: 0.84
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{0,48}cloud-[a-z0-9.-]{1,32}\.[a-z]{2,16}'
      case_insensitive: true

  # PDF actions expose URLs through the structured values tree rather than
  # the generic text view used by the source/binary atoms above.
  - id: pdf-document-service-url
    desc: PDF document service URL label
    crit: component
    conf: 0.84
    for: [pdf]
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: 'https?://[a-z0-9.-]{0,28}(docs?|document)-[a-z0-9.-]{1,20}\.[a-z]{2,12}'
      case_insensitive: true

  - id: pdf-file-service-url
    desc: PDF file service URL label
    crit: component
    conf: 0.84
    for: [pdf]
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: 'https?://[a-z0-9.-]{0,28}(pdf|drive|storage)-[a-z0-9.-]{1,20}\.[a-z]{2,12}'
      case_insensitive: true

  - id: pdf-share-service-url
    desc: PDF share service URL label
    crit: component
    conf: 0.84
    for: [pdf]
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: 'https?://[a-z0-9.-]{0,28}(share[d]?|viewer)-[a-z0-9.-]{1,20}\.[a-z]{2,12}'
      case_insensitive: true

  - id: pdf-cloud-service-url
    desc: PDF cloud service URL label
    crit: component
    conf: 0.84
    for: [pdf]
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: 'https?://[a-z0-9.-]{0,28}(preview|cloud)-[a-z0-9.-]{1,20}\.[a-z]{2,12}'
      case_insensitive: true

  - id: redirect-label
    desc: Redirect label in URL host
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,80}redirect[a-z0-9.-]{0,40}\.[a-z]{2,24}'

  - id: redir-label
    desc: Redir label in URL host
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,80}redir[a-z0-9.-]{0,40}\.[a-z]{2,24}'

  - id: parliament-target-under-redirect
    desc: Parliament target nested under redirect host
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://\S{0,24}parliament\.uk\S{0,16}redirect\S{0,8}\.[a-z]{2,24}'

  - id: university-target-under-redirect
    desc: University target nested under redirect host
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://\S{0,24}cam\.ac\.uk\S{0,16}redirect\S{0,8}\.[a-z]{2,24}'

  - id: service-target-under-redirect
    desc: Service target nested under redirect host
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)https?://\S{0,24}(google|gmail|microsoft)\S{0,16}redirect\S{0,8}\.[a-z]{2,24}'

composite_rules:
  - id: credential-lure-domain-label
    desc: Credential-lure label in URL host
    crit: component
    conf: 0.86
    any:
      - id: credential-lure-login-label
      - id: credential-lure-mail-label
      - id: credential-lure-support-label

  - id: cloud-service-label-in-noncanonical-host
    desc: Cloud-service label in noncanonical URL host
    crit: suspicious
    conf: 0.94
    any:
      - id: google-service-label
      - id: microsoft-service-label
      - id: microsoft-lookalike-label
      - id: office-service-label
      - id: drive-service-label
      - id: other-cloud-service-label
      - id: pdf-file-service-url-label
    unless:
      - id: well-known/lib/platform/browser-automation::chrome-devtools-ad-catalog-context
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - id: well-known/app/communication/thunderbird::thunderbird-omni-runtime-path
      - id: well-known/app/ai/assistant/claude-desktop::official-package-context

  - id: file-service-label
    desc: File-hosting service label in URL host
    crit: component
    conf: 0.84
    any:
      - id: docs-service-label
      - id: document-service-label
      - id: pdf-service-label
      - id: drive-service-label
      - id: storage-service-label
      - id: share-service-label
      - id: viewer-service-label
      - id: preview-service-label
      - id: cloud-file-service-label
      - id: pdf-file-service-url-label

  - id: pdf-file-service-url-label
    desc: PDF file-hosting service URL label
    crit: component
    conf: 0.84
    any:
      - id: pdf-document-service-url
      - id: pdf-file-service-url
      - id: pdf-share-service-url
      - id: pdf-cloud-service-url

  - id: redirect-infrastructure-host
    desc: Redirect infrastructure label in URL host
    crit: component
    conf: 0.88
    any:
      - id: redirect-label
      - id: redir-label

  - id: nested-target-domain-label
    desc: Target domain nested under redirect host
    crit: suspicious
    conf: 0.95
    any:
      - id: parliament-target-under-redirect
      - id: university-target-under-redirect
      - id: service-target-under-redirect

  - id: cloud-service-credential-phishing-domain
    desc: Cloud-service credential-phishing domain
    crit: hostile
    conf: 0.97
    all:
      - id: cloud-service-label-in-noncanonical-host
      - id: credential-lure-domain-label
    # Byte distance, not line distance: a phishing kit puts the brand host and
    # the credential lure in the same markup, while minified bundles and
    # generated assets hold megabytes on one physical line, where `near_lines`
    # bounds nothing and any two URLs in the file read as adjacent.
    near_bytes: 600
    unless:
      - id: well-known/lib/platform/browser-automation::chrome-devtools-ad-catalog-context
      - id: well-known/lib/runtime/electron::privacy-sandbox-attestations-file
      - id: well-known/app/system/mozc/
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - id: well-known/app/communication/thunderbird::thunderbird-omni-runtime-path
      - id: well-known/app/ai/assistant/claude-desktop::official-package-context

  - id: nested-target-redirect-phishing-domain
    desc: Nested target under redirect phishing domain
    crit: hostile
    conf: 0.98
    all:
      - id: nested-target-domain-label
      - id: redirect-infrastructure-host
      - id: credential-lure-domain-label
    near_lines: 6
