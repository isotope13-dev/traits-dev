# Email-address domains whose registrable label adds characters around a
# recognizable invoicing/business-platform brand.  The extra characters are
# structural: canonical vendor domains (servicenow.com, docusign.com, etc.) do
# not match, while service-nowinc.com and future prefix/suffix lookalikes do.
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [html, text, data]
  attack: T1583.001

