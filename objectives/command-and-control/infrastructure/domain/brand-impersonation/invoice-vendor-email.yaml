# Email-address domains whose registrable label adds characters around a
# recognizable invoicing/business-platform brand.  The extra characters are
# structural: canonical vendor domains (servicenow.com, docusign.com, etc.) do
# not match, while service-nowinc.com and future prefix/suffix lookalikes do.
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [html, text, data]
  attack: T1583.001

traits:
  - id: servicenow-lookalike-email-domain
    desc: ServiceNow-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(service-?now[a-z0-9-]+|[a-z0-9-]+service-?now)\.[a-z]{2,8}\b'

  - id: docusign-lookalike-email-domain
    desc: DocuSign-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(docusign[a-z0-9-]+|[a-z0-9-]+docusign)\.[a-z]{2,8}\b'

  - id: quickbooks-lookalike-email-domain
    desc: QuickBooks-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(quickbooks[a-z0-9-]+|[a-z0-9-]+quickbooks)\.[a-z]{2,8}\b'

  - id: workday-lookalike-email-domain
    desc: Workday-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(workday[a-z0-9-]+|[a-z0-9-]+workday)\.[a-z]{2,8}\b'

  - id: netsuite-lookalike-email-domain
    desc: NetSuite-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(netsuite[a-z0-9-]+|[a-z0-9-]+netsuite)\.[a-z]{2,8}\b'

  - id: billtrust-lookalike-email-domain
    desc: Billtrust-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(billtrust[a-z0-9-]+|[a-z0-9-]+billtrust)\.[a-z]{2,8}\b'

  - id: coupa-lookalike-email-domain
    desc: Coupa-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(coupa[a-z0-9-]+|[a-z0-9-]+coupa)\.[a-z]{2,8}\b'

  - id: ariba-lookalike-email-domain
    desc: Ariba-like email domain
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(ariba[a-z0-9-]+|[a-z0-9-]+ariba)\.[a-z]{2,8}\b'

  - id: xero-lookalike-email-domain
    desc: Xero-like email domain
    conf: 0.94
    if:
      type: text
      # A single trailing x is xerox.com, the copier company, not a Xero lookalike.
      regex: '(?i)@(xero[a-wyz0-9-][a-z0-9-]*|xero[a-z0-9-]{2,}|[a-z0-9-]+xero)\.[a-z]{2,8}\b'
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-install-tree

composite_rules:
  - id: invoice-vendor-lookalike-email-domain
    desc: Invoicing-vendor lookalike email domain
    conf: 0.95
    any:
      - id: servicenow-lookalike-email-domain
      - id: docusign-lookalike-email-domain
      - id: quickbooks-lookalike-email-domain
      - id: workday-lookalike-email-domain
      - id: netsuite-lookalike-email-domain
      - id: billtrust-lookalike-email-domain
      - id: coupa-lookalike-email-domain
      - id: ariba-lookalike-email-domain
      - id: xero-lookalike-email-domain
