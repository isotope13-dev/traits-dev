# A script loaded from a CDN-brand lookalike host using the real CDN's
# library path layout. The page is trusting the brand, not the host:
# whatever the lookalike serves runs with page privileges.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036.005,T1105

composite_rules:
  - id: lookalike-cdn-script-load
    desc: Page loads script from a CDN-brand lookalike host
    crit: hostile
    conf: 0.95
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/url/cdn::cdnjs-path-lookalike-host
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
  - id: lookalike-google-script-load
    desc: Page loads script from a Google-brand lookalike host
    crit: hostile
    conf: 0.95
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/url/cdn::google-lookalike-script-host
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
      - id: micro-behaviors/communications/http/client/resource::plaintext-http-script-element-source
