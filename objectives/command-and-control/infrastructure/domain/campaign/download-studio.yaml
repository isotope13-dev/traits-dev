# Download Studio affiliate infrastructure associated with deceptive download
# redirects. Bare host references remain notable; behavior composites can use
# the suspicious aggregate as campaign context.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]

traits:
  - id: downloadstudio-api-host
    desc: References apis.downloadstud.io host
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bapis\.downloadstud\.io\b'

  - id: downloadstudio-byteengineering-host
    desc: References r.byteengineering.net host
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\br\.byteengineering\.net\b'

  - id: downloadstudio-get-host
    desc: References getdownloadstudio.net host
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(getdownloadstudio|downloadstudio)\.net\b|\bdstudio\.app\b'

composite_rules:
  - id: downloadstudio-affiliate-host
    desc: References Download Studio affiliate host
    crit: suspicious
    conf: 0.96
    any:
      - id: downloadstudio-api-host
      - id: downloadstudio-byteengineering-host
      - id: downloadstudio-get-host
    unless:
      # Filter lists cite affiliate hosts in order to block them.
      - id: metadata/package/quality/benign-context::adblock-extension-bundle
