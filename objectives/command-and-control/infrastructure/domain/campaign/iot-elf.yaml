defaults:
  platforms: [linux]
  for: [elf]
  size_min: 4096
  size_max: 5000000
  attack: T1071.004,T1027

composite_rules:
  - id: xor-cnc-scanner-domain-pair
    desc: IoT bot conceals paired CNC and scanner domains
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/url/host/name::xor-cnc-subdomain
      - id: micro-behaviors/communications/url/host/name::xor-scan-subdomain
      - id: micro-behaviors/process/argument/subcommand::busybox-bot-marker-command
