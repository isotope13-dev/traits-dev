defaults:
  platforms: [linux]
  for: [elf]
  size_min: 4096
  size_max: 5000000
  attack: T1071.004,T1027

traits:
  - id: xor-cnc-subdomain
    desc: XOR-obfuscated CNC subdomain
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      encoding: xor
      regex: '\bcnc\.[a-z0-9-]{2,40}\.[a-z]{2,12}\b'

  - id: xor-scan-subdomain
    desc: XOR-obfuscated scanner subdomain
    crit: suspicious
    conf: 0.95
    if:
      type: encoded
      encoding: xor
      regex: '\bscan\.[a-z0-9-]{2,40}\.[a-z]{2,12}\b'

composite_rules:
  - id: xor-cnc-scanner-domain-pair
    desc: IoT bot conceals paired CNC and scanner domains
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: xor-cnc-subdomain
      - id: xor-scan-subdomain
      - id: objectives/lateral-movement/brute-force/iot::busybox-bot-name-invocation
