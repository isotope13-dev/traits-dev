# Numbered Sfuzuan C2 domain pools. The pools are campaign infrastructure:
# each build embeds spi1-3 of both domains and resolves them over AliDNS DoH,
# so the pool pair plus the resolver format is the campaign's rendezvous set.
# The DoH resolver-format capability itself lives with the DoH protocol facts
# (micro-behaviors/communications/dns/doh); only the campaign-owned endpoints
# are recorded here.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.004
  mbc: C0002

traits:
  - id: tyui54345-spi-pool
    desc: tyui54345 numbered SPI C2 domain pool
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)^spi[1-3]\.tyui54345\.xyz$'

  - id: zxcv56745-spi-pool
    desc: zxcv56745 numbered SPI C2 domain pool
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)^spi[1-3]\.zxcv56745\.xyz$'

composite_rules:
  - id: dual-spi-pool-doh-c2
    desc: Redundant numbered C2 domain pools resolved over DoH
    crit: hostile
    conf: 0.995
    all:
      - id: tyui54345-spi-pool
      - id: zxcv56745-spi-pool
      - id: micro-behaviors/communications/dns/doh::doh-alidns-resolve-format
