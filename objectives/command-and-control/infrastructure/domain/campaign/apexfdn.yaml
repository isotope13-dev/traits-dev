# Apex Foundation / AMOS operator infrastructure.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, markdown, text, package.json]

traits:
  - id: arena-apexfdn-host
    desc: References arena.apexfdn.xyz Apex campaign host
    crit: suspicious
    conf: 1.0
    if:
      type: text
      substr: arena.apexfdn.xyz

  - id: apex-arena-router-host
    desc: References apex-arena-router.com router host
    crit: suspicious
    conf: 1.0
    if:
      type: text
      substr: apex-arena-router.com

composite_rules:
  - id: arena-apexfdn-bearer-fetch
    for: [javascript]
    desc: Apex host with fetch and bearer-header evidence
    crit: hostile
    conf: 0.98
    attack: T1041,T1071.001
    all:
      - id: arena-apexfdn-host
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/credentials::js-bearer-header-from-auth-token
