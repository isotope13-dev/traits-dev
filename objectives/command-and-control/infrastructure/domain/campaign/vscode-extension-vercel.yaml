# Campaign hosts that impersonate a VS Code extension update channel on
# free Vercel staging (vscode-extension-<digits>.vercel.app). Paired with
# folderOpen remote-shell tasks in supply-chain install-hook detections.
defaults:
  platforms: [unix, windows]
  for: [json, javascript, typescript, html, shell, python]
  attack: T1583.006,T1102
  mbc: B0030
  crit: suspicious

traits:
  - id: vscode-extension-vercel-staging-host
    desc: vscode-extension-* Vercel staging host
    conf: 0.95
    if:
      type: text
      regex: 'vscode-extension-[0-9]{4,12}\.vercel\.app'

composite_rules:
  - id: vscode-extension-vercel-folderopen-shell
    desc: Folder-open task pipes shell from vscode-extension Vercel host
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1583.006
    all:
      - id: vscode-extension-vercel-staging-host
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: objectives/supply-chain/install-hook/tasks::tasks-command-pipe-shell
      - id: objectives/supply-chain/install-hook/tasks::tasks-command-curl-wget
