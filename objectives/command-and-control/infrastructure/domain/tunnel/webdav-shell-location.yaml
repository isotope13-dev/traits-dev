# A shell folder document whose location is a WebDAV share served from an
# anonymous quick-tunnel hostname (trycloudflare, ngrok, localtunnel...).
# The throwaway host is attacker staging infrastructure fronted by the
# tunnel provider so the operator's real server stays hidden.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1572,T1105

composite_rules:
  - id: shell-location-quick-tunnel-webdav
    desc: Library file mounts quick-tunnel WebDAV share
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/format/windows-shell::shell-location-document
      - id: micro-behaviors/communications/http/webdav::webdav-unc-quick-tunnel-host
