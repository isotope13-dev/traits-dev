# A WSH script that runs a script file straight off a UNC share whose host
# is a public reverse-tunnel service (Cloudflare quick tunnel, ngrok,
# localhost.run). The stage server is an attacker workstation exposed for
# minutes through a throwaway tunnel name, not an organization's file server.
defaults:
  for: [vbs, javascript, xml]
  platforms: [windows]
  attack: T1572,T1105

composite_rules:
  - id: wsh-runs-script-from-tunnel-share
    desc: WSH runs a script from a tunnel-hosted share
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
      - id: micro-behaviors/fs/path/network::quoted-unc-script-path
    any:
      - id: micro-behaviors/communications/http/webdav::webdav-unc-quick-tunnel-host
      - id: public-tunnel-endpoint
    near_bytes: 600
