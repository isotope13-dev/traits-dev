defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1572
traits:
  - id: localtunnel-me
    desc: 'Localtunnel.me endpoint'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: localtunnel.me
    unless:
      - type: basename
        regex: '(?i)\.(test|spec)\.[a-z0-9]+$'
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
      # The Stacks tunnel client's own skill guide documents its API with
      # example endpoint strings; that is documentation, not infrastructure.
      - id: well-known/lib/format/stacksjs-tunnel::stacks-tunnel-skill-doc-context
      # An app bundling the localtunnel client as an opt-in tunnel provider
      # carries the client's own status strings; the endpoint is its
      # documented default host, not provisioned C2 infrastructure.
      - id: micro-behaviors/communications/proxy/tunnel::localtunnel-client-context
  - id: localtunnel
    desc: 'Localtunnel endpoint'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '[a-z0-9-]+\.loca\.lt'
    unless:
      - type: basename
        regex: '(?i)\.(test|spec)\.[a-z0-9]+$'
      # The Stacks tunnel client's own skill guide documents its API with
      # example endpoint strings; that is documentation, not infrastructure.
      - id: well-known/lib/format/stacksjs-tunnel::stacks-tunnel-skill-doc-context
  - id: localhost-run
    desc: Localhost.run tunnel endpoint
    # Dual-use ingress/tunnel service like ngrok and trycloudflare below
    # (legitimately used to expose local web UIs from Colab/Kaggle). Keep at
    # the same notable capability level as those peers; malicious intent is
    # inferred by the reverse-shell/backdoor composites that reference it.
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[a-z0-9-]+\.localhost\.run'
  - id: localhost-run-lhr-life
    desc: Localhost.run lhr.life tunnel endpoint
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[a-z0-9-]+\.lhr\.life\b'
    unless:
      - type: basename
        regex: '(?i)\.(test|spec)\.[a-z0-9]+$'
  - id: pinggy-io
    desc: Pinggy tunnel endpoint
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: ([a-z0-9-]{1,63}\.){0,3}pinggy\.(io|link)
  - id: ngrok-io-endpoint
    desc: Ngrok.io tunnel endpoint
    crit: notable
    conf: 0.7
    attack: T1071
    # Ngrok TCP tunnels use a two-label public host such as
    # \`5.tcp.ngrok.io\`, not only the single-label form matched previously.
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '\b[a-z0-9-]+(\.[a-z0-9-]+)?\.ngrok\.io\b'
    unless:
      # Was `well-known/lib/data/`, now dissolved into well-known/ and the
      # package-file facts. `ngrok.io` is a public suffix, so an embedded PSL contains it.
      - id: well-known/lib/network/public-suffix-list/
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: metadata/package/testing/
      - id: well-known/lib/ui/qt
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - id: well-known/app/productivity/keepercommander/
      - type: text
        regex: \b[a-z0-9]+\.ngrok\.io\b
        section: .rsrc
      - id: "metadata/file/naming::test-directory-component"
  - id: ngrok-tcp-source-endpoint
    desc: Ngrok TCP tunnel endpoint in source
    crit: notable
    conf: 0.86
    attack: T1090
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '\b[a-z0-9-]+\.tcp\.ngrok\.io\b'
  # Quick Tunnel provisioning API: POST /tunnel returns an account tag,
  # secret and random *.trycloudflare.com hostname with no Cloudflare
  # account. Naming it means the program creates tunnels itself.
  - id: cloudflare-quick-tunnel-api
    desc: Cloudflare quick tunnel provisioning API
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: api.trycloudflare.com

  # The Argo edge that cloudflared dials on port 7844. Outside cloudflared
  # itself, it marks a reimplemented tunnel client.
  - id: argotunnel-edge-host
    desc: Cloudflare tunnel edge hostname
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'region[12]\.v2\.argotunnel\.com'

composite_rules:
  - id: public-tunnel-endpoint
    desc: Public reverse-tunnel service endpoint
    crit: notable
    conf: 0.88
    for: [scripts, source]
    any:
      - id: localhost-run
      - id: localhost-run-lhr-life
      - id: micro-behaviors/communications/url/host::cloudflare-tunnel-host-reference
      - id: ngrok-tunnel

  - id: ngrok-tunnel
    desc: Contacts ngrok tunnel endpoint
    crit: notable
    conf: 0.9
    attack: T1071
    any:
      - id: ngrok-io-endpoint
    unless:
      - id: well-known/lib/ui/qt
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - id: well-known/app/productivity/keepercommander/

  - id: ngrok-delivered-shell-stage
    for: [javascript]
    desc: Ngrok URL near HTTP and stream-end shell clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/host::ngrok-free-domain
      - id: micro-behaviors/process/create/shell/bridge::js-http-stream-end-exec-profile
