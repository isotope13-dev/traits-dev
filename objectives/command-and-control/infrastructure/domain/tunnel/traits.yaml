defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1572
traits:
  - id: localtunnel-me
    desc: 'Localtunnel.me endpoint'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: localtunnel.me
    unless:
      - type: basename
        regex: '(?i)\.(test|spec)\.[a-z0-9]+$'
  - id: localtunnel
    desc: 'Localtunnel endpoint'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '[a-z0-9-]+\.loca\.lt'
    unless:
      - type: basename
        regex: '(?i)\.(test|spec)\.[a-z0-9]+$'
  - id: localhost-run
    desc: Localhost.run tunnel endpoint
    # Dual-use ingress/tunnel service like ngrok and trycloudflare below
    # (legitimately used to expose local web UIs from Colab/Kaggle). Keep at
    # the same notable capability level as those peers; malicious intent is
    # inferred by the reverse-shell/backdoor composites that reference it.
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[a-z0-9-]+\.localhost\.run'
  - id: localhost-run-lhr-life
    desc: Localhost.run lhr.life tunnel endpoint
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[a-z0-9-]+\.lhr\.life\b'
    unless:
      - type: basename
        regex: '(?i)\.(test|spec)\.[a-z0-9]+$'
  - id: pinggy-io
    desc: Pinggy tunnel endpoint
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: ([a-z0-9-]{1,63}\.){0,3}pinggy\.(io|link)
  - id: cloudflare-tunnel
    desc: References a Cloudflare tunnel endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '[a-z0-9-]+\.trycloudflare\.com'
      not:
        - substr: api.trycloudflare.com
        - substr: github.com/cloudflare/cloudflared
        - substr: your-tunnel.trycloudflare.com
    unless:
      - id: metadata/signed/developer::cloudflare
      - id: well-known/app/ai/agent-runtime/bobi/
  - id: ngrok-io-endpoint
    desc: Ngrok.io tunnel endpoint
    crit: notable
    conf: 0.7
    attack: T1071
    # Ngrok TCP tunnels use a two-label public host such as
    # \`5.tcp.ngrok.io\`, not only the single-label form matched previously.
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '\b[a-z0-9-]+(\.[a-z0-9-]+)?\.ngrok\.io\b'
    unless:
      - id: metadata/library/data/
      - id: metadata/package/quality/benign-context::password-strength-blocklist-context
      - id: metadata/package/testing/
      - id: metadata/library/qt
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - id: well-known/app/productivity/keepercommander/
      - type: text
        regex: \b[a-z0-9]+\.ngrok\.io\b
        section: .rsrc
  - id: ngrok-tcp-source-endpoint
    desc: Ngrok TCP tunnel endpoint in source
    crit: notable
    conf: 0.86
    attack: T1090
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '\b[a-z0-9-]+\.tcp\.ngrok\.io\b'
composite_rules:
  - id: public-tunnel-endpoint
    desc: Public reverse-tunnel service endpoint
    crit: notable
    conf: 0.88
    for: [scripts, source]
    any:
      - id: localhost-run
      - id: localhost-run-lhr-life
      - id: cloudflare-tunnel
      - id: ngrok-tunnel

  - id: ngrok-tunnel
    desc: Contacts ngrok tunnel endpoint
    crit: notable
    conf: 0.9
    attack: T1071
    any:
      - id: ngrok-io-endpoint
    unless:
      - id: metadata/library/qt
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - id: well-known/app/productivity/keepercommander/

  - id: ngrok-delivered-shell-stage
    desc: Ngrok tunnel delivers an in-memory shell stage
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004
    all:
      - id: well-known/dual-use/tunnel/ngrok::ngrok-free-domain
      - id: objectives/command-and-control/dropper/execution/download-exec::js-download-shell-exec-in-memory
