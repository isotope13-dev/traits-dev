defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  attack: T1572
traits:
- id: localtunnel-me
  desc: Localtunnel.me endpoint
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: localtunnel.me
  not:
  - regex: (?i)\blocaltunnel\.me\b.*\bsunset
  unless:
  - id: micro-behaviors/communications/proxy/host-zone::tunnel-suffix-endswith-check
  - type: basename
    regex: (?i)\.(test|spec)\.[a-z0-9]+$
  - id: well-known/lib/format/stacksjs-tunnel/
  - type: path
    substr: stacks-tunnel/SKILL.md
  - id: micro-behaviors/communications/proxy/tunnel::localtunnel-client-context
  - id: well-known/tool/detection/
- id: localtunnel
  desc: Localtunnel endpoint
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '[a-z0-9-]+\.loca\.lt'
  not:
  - regex: (?i)\b(xxx|example|your-subdomain|placeholder)\.loca\.lt\b
  unless:
  - type: basename
    regex: (?i)\.(test|spec)\.[a-z0-9]+$
  - id: well-known/lib/format/stacksjs-tunnel::stacks-tunnel-skill-doc-context
  - id: well-known/lib/format/stacksjs-tunnel::stacks-tunnel-client-doc-markers
  - type: path
    substr: stacks-tunnel/SKILL.md
- id: localhost-run
  desc: Localhost.run tunnel endpoint
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '[a-z0-9-]+\.localhost\.run'
- id: localhost-run-lhr-life
  desc: Localhost.run lhr.life tunnel endpoint
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \b[a-z0-9-]+\.lhr\.life\b
  unless:
  - type: basename
    regex: (?i)\.(test|spec)\.[a-z0-9]+$
- id: pinggy-io
  desc: Pinggy tunnel endpoint
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: ([a-z0-9-]{1,63}\.){0,3}pinggy\.(io|link)
  unless:
  - id: well-known/tool/detection/guardlayer::tool-policy-exfil-service-denylist
- id: ngrok-tcp-source-endpoint
  desc: Ngrok TCP tunnel endpoint in source
  crit: notable
  conf: 0.86
  attack: T1090
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: \b[a-z0-9-]+\.tcp\.ngrok\.io\b
- id: cloudflare-quick-tunnel-api
  desc: Cloudflare quick tunnel provisioning API
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: api.trycloudflare.com
- id: argotunnel-edge-host
  desc: Cloudflare tunnel edge hostname
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: region[12]\.v2\.argotunnel\.com
composite_rules:
- id: public-tunnel-endpoint
  desc: Public reverse-tunnel service endpoint
  crit: notable
  conf: 0.88
  for:
  - scripts
  - source
  any:
  - id: localhost-run
  - id: localhost-run-lhr-life
  - id: micro-behaviors/communications/url/host/name::cloudflare-tunnel-host-reference
  - id: ngrok-tunnel
- id: ngrok-tunnel
  desc: Contacts ngrok tunnel endpoint
  crit: notable
  conf: 0.9
  attack: T1071
  any:
  - id: micro-behaviors/communications/url/host/name::ngrok-io-endpoint
  unless:
  - id: well-known/lib/ui/qt
  - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
  - id: well-known/app/productivity/keepercommander/
- id: ngrok-delivered-shell-stage
  for:
  - javascript
  desc: Ngrok URL near HTTP and stream-end shell clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
  - id: micro-behaviors/process/create/shell/bridge::js-http-stream-end-exec-profile
- id: script-stub-quick-tunnel-script
  desc: Script settings stub opens a tunnel-hosted script
  crit: hostile
  conf: 0.94
  for:
  - text
  attack: T1572,T1105
  all:
  - id: metadata/file/format/structured::wsh-settings-script-header
  - id: micro-behaviors/communications/url/host/name::cloudflare-tunnel-host-reference
