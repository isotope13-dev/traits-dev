# YAML C2 malleable/traffic profile configuration with beacon timing,
# sleep masking, decoy traffic, and traffic mimicry rules.
defaults:
  platforms: [linux, macos, windows]
  for: [yaml]
  size_max: 262144
  attack: T1071.001

traits:
  - id: sleep-base-setting
    desc: Config sets beacon base sleep seconds
    crit: notable
    conf: 0.85
    if:
      type: value
      path: sleep_base_seconds
      exists: true

  - id: jitter-params-setting
    desc: Config sets beacon jitter factor
    crit: notable
    conf: 0.85
    if:
      type: value
      path: jitter_params.jitter_factor
      exists: true

  - id: sleep-mask-setting
    desc: Config sets sleep mask option
    crit: notable
    conf: 0.9
    if:
      type: value
      path: sleep_mask
      exists: true

  - id: traffic-mimicry-rules-setting
    desc: Config defines traffic mimicry rules
    crit: notable
    conf: 0.92
    if:
      type: value
      path: traffic_mimicry_rules
      exists: true

  - id: decoy-rate-setting
    desc: Config sets decoy traffic rate
    crit: notable
    conf: 0.85
    if:
      type: value
      path: decoy_rate
      exists: true

composite_rules:
  - id: yaml-c2-traffic-mimicry-profile
    desc: YAML C2 profile with traffic mimicry and beacon timing
    crit: hostile
    conf: 0.95
    all:
      - id: traffic-mimicry-rules-setting
    any:
      - id: sleep-base-setting
      - id: jitter-params-setting
      - id: sleep-mask-setting
      - id: decoy-rate-setting
      - id: objectives/command-and-control/infrastructure/config::beacon-interval-setting
      - id: objectives/command-and-control/infrastructure/config::beacon-jitter-setting
    needs: 2

  - id: yaml-c2-evasion-beacon-profile
    desc: YAML C2 profile with sleep mask and beacon timing
    crit: hostile
    conf: 0.93
    all:
      - id: sleep-mask-setting
    any:
      - id: sleep-base-setting
      - id: jitter-params-setting
      - id: decoy-rate-setting
      - id: objectives/command-and-control/infrastructure/config::beacon-interval-setting
      - id: objectives/command-and-control/infrastructure/config::beacon-jitter-setting
    needs: 2
