# Neutral keywords related to beacons (Search Party, etc.)
# Moved from objectives/command-and-control/beacon/network/ to avoid FP on Apple system binaries
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [binaries, scripts]
traits:
  - id: beacon
    desc: 'Mentions the word beacon'
    conf: 0.6
    if:
      type: text
      word: beacon
      case_insensitive: true
    downgrade:
      any:
        - id: metadata/signed/platform::apple
    unless:
        # A name reached through a string is the reflective spelling; where the
        # direct form is already recorded, this would be the same call twice.
        - id: objectives/command-and-control/dns/tunneling::java-dns-beacon-label
        - id: well-known/lib/runtime/native-platform/harmony::harmonylib-marker
  - id: heartbeat-word
    desc: Heartbeat keyword in source text
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: heartbeat
    unless:
      - id: micro-behaviors/communications/socket/framing::libp2p-library-reference
      - id: well-known/app/infrastructure/terraform-provider/
      - id: metadata/lang/compiler/systems/
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: well-known/app/system/drivers/
      # Font Awesome icons commonly use `fa:heartbeat`; that UI label is not
      # evidence of a network heartbeat or beacon.
      - type: text
        substr: fa:heartbeat
