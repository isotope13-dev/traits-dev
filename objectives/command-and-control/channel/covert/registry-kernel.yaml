# Registry callbacks are a legitimate Windows driver extension point. The
# hostile rule below requires the callback to consume value-write notifications
# as a binary command stream and dispatch opcodes, which is the covert tasking
# technique described by the source article.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, rust, go, csharp]

traits:
  - id: switch-opcode-control-flow
    desc: Dispatch a registry-supplied switch opcode
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bswitch\s*\(\s*(command|opcode|request)(_[A-Za-z0-9]+)?\s*\)\s*\{'
  - id: match-opcode-control-flow
    desc: Dispatch a registry-supplied match opcode
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bmatch\s+(command|opcode|request)\s*\{'

composite_rules:
  - id: registry-callback-command-channel
    desc: Kernel registry callback command channel
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/callback::registry-callback-ex
      - id: micro-behaviors/os/registry/callback::set-value-notification
      - id: micro-behaviors/os/registry/callback::set-value-information
    any:
      - id: switch-opcode-control-flow
      - id: match-opcode-control-flow
