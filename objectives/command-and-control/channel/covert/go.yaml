defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1095
  mbc: B0030

composite_rules:
  - id: dns-icmp-request-response-channel
    desc: DNS and ICMP carry C2 messages
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/dns/client::dns-channel-constructor
      - id: micro-behaviors/communications/icmp/channel::icmp-channel-constructor
      - id: micro-behaviors/communications/socket/message::request-response-message-handler
