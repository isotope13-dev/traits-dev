defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  # A STUN client library does not hard-code a dozen servers in stripped static
  # code. Pairing hand-built STUN messages with a compiled-in server fan-out
  # in a binary without libc dependencies matches a bot that reads commands
  # from Binding responses, rather than a WebRTC or NAT-probing tool.
  - id: native-stun-fanout-binding-channel
    desc: Static native STUN fan-out for transaction-ID commands
    crit: hostile
    conf: 0.93
    attack: T1095
    mbc: B0030
    all:
      - id: micro-behaviors/communications/proxy/turn::native-stun-cookie-code
      - id: micro-behaviors/communications/proxy/turn::native-stun-server-fanout
      - id: metadata/binary/linking/symbol-table::full-symbol-table-absent-or-empty
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
