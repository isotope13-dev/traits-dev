defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1205
traits:
  - id: magic-packet-marker
    desc: Magic-packet activation marker
    crit: component
    conf: 0.85
    if:
      type: text
      substr: magic_packet
  - id: trigger-packet
    desc: Packet-triggered backdoor activation
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: trigger_packet
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: port-knock
    desc: Port-knock covert activation sequence
    crit: suspicious
    conf: 0.75
    if:
      type: text
      word: port_knock
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/manifest/vendor::bitdefender-ecnet-telemetry

composite_rules:
  - id: magic-packet
    desc: Covert activation via received magic packet
    crit: suspicious
    conf: 0.9
    all:
      - id: magic-packet-marker
    any:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/receive::receive
    near_lines: 20
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/evasion/kernel-hide/module::modinfo-section
