defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1205
composite_rules:
  # Retain the identifier as neutral vocabulary; receiving nearby supplies
  # the packet-trigger context rather than convicting on a name alone.
  - id: trigger-packet
    desc: Trigger-packet marker with socket receive
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/data/parse/vocabulary::trigger-packet-term
    any:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/receive::receive
    near_lines: 20
  - id: port-knock-activation-listener
    desc: Knock-sequence marker with socket receive
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/port::knock-sequence-reference
    any:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/receive::receive
    near_lines: 20
    unless:
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
  - id: magic-packet
    desc: Covert activation via received magic packet
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/parse/keywords::magic-packet-term
    any:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/receive::receive
    near_lines: 20
    unless:
      - id: objectives/evasion/kernel-hide/module::modinfo-section
