defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1205
traits:
  - id: magic-packet-marker
    desc: Magic-packet activation marker
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: magic_packet
composite_rules:
  # Retain the identifier as neutral vocabulary; receiving nearby supplies
  # the packet-trigger context rather than convicting on a name alone.
  - id: trigger-packet
    desc: Trigger-packet marker with socket receive
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/data/parse/vocabulary::trigger-packet-term
    any:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/receive::receive
    near_lines: 20
    unless:
      - id: metadata/package/testing/harness/runtime/

  # A knock-sequence marker only says the code knows what knocking is; knock
  # CLIENTS (knock(1), SSH managers that knock the user's own firewall open
  # before dialing) send attempts and never receive. The covert claim needs
  # the receiving side: code that watches for the sequence and opens access,
  # mirroring the magic-packet trigger composite below.
  - id: port-knock-activation-listener
    desc: Knock-sequence marker with socket receive
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/port::knock-sequence-reference
    any:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/receive::receive
    near_lines: 20
    unless:
      - id: metadata/package/testing/harness/runtime/
      # A security vendor's telemetry library can carry knock strings beside
      # socket code; the exclusion rode the old identifier-only atom.
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
  - id: magic-packet
    desc: Covert activation via received magic packet
    crit: suspicious
    conf: 0.9
    all:
      - id: magic-packet-marker
    any:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/receive::receive
    near_lines: 20
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/evasion/kernel-hide/module::modinfo-section
