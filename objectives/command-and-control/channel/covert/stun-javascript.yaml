defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1095
  conf: 0.95
composite_rules:
  - id: js-stun-transaction-id-task-channel
    desc: Dispatches STUN transaction-ID commands with target address and port
    crit: suspicious
    all:
      - id: micro-behaviors/communications/proxy/turn::js-transaction-id-target-fields
      - id: micro-behaviors/communications/proxy/turn::js-binding-response-header-check
      - id: micro-behaviors/communications/proxy/turn::js-transaction-id-opcode-switch
  - id: js-zero-id-stun-task-requests
    desc: Builds zero-ID Binding requests alongside transaction-ID task dispatch
    crit: suspicious
    all:
      - id: micro-behaviors/communications/proxy/turn::js-zero-transaction-binding-request
      - id: js-stun-transaction-id-task-channel
