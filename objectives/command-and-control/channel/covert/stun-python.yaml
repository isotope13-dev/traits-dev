defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1095
  conf: 0.95
composite_rules:
  - id: stun-transaction-id-task-channel
    desc: Receives STUN transaction opcode and target
    crit: suspicious
    all:
      - id: micro-behaviors/communications/proxy/turn::transaction-id-command-fields
      - id: micro-behaviors/communications/proxy/turn::binding-response-header-check
      - id: micro-behaviors/communications/socket/receive::socket-recvfrom-call
  - id: zero-id-stun-task-requests
    desc: Zero-ID STUN requests alongside task reception
    crit: suspicious
    all:
      - id: micro-behaviors/communications/proxy/turn::zero-transaction-binding-request
      - id: stun-transaction-id-task-channel
      - id: micro-behaviors/communications/socket/send::python-sendto
  - id: stun-task-payload-execution
    desc: STUN transaction task channel downloads and launches executable content
    crit: hostile
    conf: 0.99
    attack: T1095,T1105
    near_lines: 35
    all:
      - id: zero-id-stun-task-requests
      - id: micro-behaviors/communications/http/download/execute::download-chmod-launch
      - id: micro-behaviors/process/create/subprocess::popen-ast
