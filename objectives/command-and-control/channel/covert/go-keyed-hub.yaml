defaults:
  platforms: [unix, windows]
  for: [go]
composite_rules:
  - id: go-keyed-hub-browser-transport
    desc: Keyed hub client with browser-style transport
    crit: suspicious
    conf: 0.94
    # Co-occurring bootstrap/transport evidence. This does not establish
    # received commands, TLS verification settings, or AutoClean's effect.
    all:
      - id: micro-behaviors/communications/socket/endpoint::go-client-start-fixed-endpoint
      - id: micro-behaviors/crypto/key/representation::go-hub-public-key-assignment
      - id: micro-behaviors/communications/tls/initialize::go-tls-client-helper-call
      - id: micro-behaviors/communications/http/user-agent::browser-user-agent-string
