# Cleartext channel dressed as TLS: the implant connects to port 443
# with a raw socket and scrambles the session with RC4 instead of doing
# a TLS handshake. Port 443 carries HTTPS almost everywhere, so a
# homemade crypto channel there hides in per-port counts and looks like
# browsing to anything that classifies by destination port.
defaults:
  platforms: [windows, unix]
  for: [source, scripts]
  attack: T1573,T1043
  mbc: C0022.002

traits:
  - id: port-443-constant-assignment
    desc: Assigns 443 to a port variable
    crit: notable
    conf: 0.7
    if:
      type: text
      # Identifier containing "port" bound to the literal 443: the shape
      # a stager uses when it plans to dial the TLS port without TLS.
      regex: '(?i)\b\w*port\w*\s*=\s*443\b'

composite_rules:
  - id: rc4-cleartext-channel-on-tls-port
    desc: RC4-scrambled raw socket on the TLS port
    crit: hostile
    conf: 0.96
    near_bytes: 16384
    all:
      - id: port-443-constant-assignment
      - id: micro-behaviors/crypto/symmetric/stream/rc4::source-rc4-implementation
    any:
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-text
