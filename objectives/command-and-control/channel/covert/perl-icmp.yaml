# Packet-size nibble encoding supports covert signalling. Constructing a
# destination from two scalars alone also occurs in ordinary reachability scans.
defaults:
  platforms: [unix]
  for: [perl]
  attack: T1048
  conf: 0.96
  crit: hostile

composite_rules:
  - id: perl-icmp-data-channel
    desc: Perl defines a forked ping packet-size nibble channel
    scope: file
    all:
      - id: micro-behaviors/process/create/fork::fork-call
      - id: micro-behaviors/communications/icmp::perl-ping-size-nibble
