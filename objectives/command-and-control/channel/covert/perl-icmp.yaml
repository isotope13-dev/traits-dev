# Perl ICMP data channels. The implant forks a hidden child that encodes
# stolen data into ping invocation parameters: a 4-bit nibble added to the
# packet size, or a full byte interpolated into the destination address.
# Ordinary reachability checks ping a fixed host with a default size; a forked
# ping whose size or target varies with data is a covert exfil channel.
defaults:
  platforms: [unix]
  for: [perl]
  attack: T1048
  conf: 0.96
  crit: hostile

composite_rules:
  - id: perl-icmp-data-channel
    desc: Perl exfiltrates data through encoded ping channel
    scope: file
    all:
      - id: micro-behaviors/process/create/fork::fork-call
    any:
      - id: micro-behaviors/communications/icmp::perl-ping-size-nibble
      - id: micro-behaviors/communications/icmp::perl-ping-destination-byte
