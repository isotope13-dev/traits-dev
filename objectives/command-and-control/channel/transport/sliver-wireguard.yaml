defaults:
  platforms: [unix, windows]
  for: [go]
composite_rules:
  - id: sliver-operator-wireguard-rpc-channel
    desc: Sliver operator gRPC dialer over WireGuard
    crit: hostile
    conf: 0.99
    attack: T1573.002
    # Product namespace plus concrete VPN configuration and RPC operations.
    # This is operator-to-server transport, not a claim of implant tasking.
    all:
      - id: metadata/import/go/github/com/bishopfox/sliver/client/assets
      - id: metadata/import/go/github/com/bishopfox/sliver/protobuf/rpcpb
      - id: micro-behaviors/network/tunnel::go-constructed-wireguard-device-config
      - id: micro-behaviors/communications/grpc::grpc-go-import
      - id: micro-behaviors/communications/grpc::go-custom-context-dialer-call
