defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1071
  mbc: B0030

composite_rules:
  - id: source-keyed-socket-beacon
    desc: C source sends keyed socket handshake
    crit: hostile
    conf: 0.96
    attack: T1095
    all:
      - id: micro-behaviors/communications/socket/send::source-keyed-frame-send
      - id: micro-behaviors/communications/socket/create::tcp-connect-socket-source
      - id: micro-behaviors/communications/socket/send::send-symbol
    near_lines: 12
