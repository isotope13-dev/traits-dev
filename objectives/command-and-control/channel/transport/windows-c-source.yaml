defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1071
  mbc: B0030

traits:
  - id: source-keyed-frame-send
    desc: C source sends fixed-size keyed frame
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'memcpy\([^,]{1,40},\s*key,\s*32\)[\s\S]{0,80}send\([^,]{1,40},\s*[^,]{1,40},\s*40\s*,'

composite_rules:
  - id: source-keyed-socket-beacon
    desc: C source sends keyed socket handshake
    crit: hostile
    conf: 0.96
    all:
      - id: source-keyed-frame-send
      - id: micro-behaviors/communications/socket/create::windows-tcp-socket-source
      - id: micro-behaviors/communications/socket/send::source-send-call
