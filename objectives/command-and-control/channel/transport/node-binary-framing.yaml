# A back-connect agent that accepts process-execution commands over a custom
# length-and-type TLS protocol.  The framing itself is neutral and lives under
# micro-behaviors; these rules require a structured remote command dispatcher.
# The pivoting RAT objective composes this transport with forwarding and scan
# tasking in the backdoor hierarchy.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  attack: T1059.007,T1095,T1573.002
  mbc: B0030

composite_rules:
  - id: node-framed-tls-command-agent
    desc: Framed TLS agent accepts shell commands
    crit: suspicious
    conf: 0.99
    near_bytes: 16384
    all:
      - id: micro-behaviors/communications/socket/framing::node-be32-length-byte-type-framing
      - id: micro-behaviors/communications/socket/ssl::node-tls-connect
      - id: objectives/command-and-control/backdoor/dispatch/shell::node-exec-shell-command-dispatch
      - id: micro-behaviors/communications/socket/receive::node-socket-data-event
      - id: micro-behaviors/communications/socket/send::node-socket-write
