defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - macho
  crit: notable
composite_rules:
- size_max: 500000000
  id: pkg-marker-beside-node-network-command-observations
  size_min: 512
  desc: Pkg marker beside Node network/command observations
  conf: 0.95
  all:
  - id: metadata/build/package-builder::pkg-marker
  - id: objectives/command-and-control/channel/transport::node-network-command-or-packaging-observations
  unless:
  - id: objectives/supply-chain/trojanized/app/debug-probe/
