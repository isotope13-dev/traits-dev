defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1071,T1095"
  mbc: "B0030"

composite_rules:
  - id: raw-ip-netcat-binary-protocol-loop
    desc: Raw-IP netcat binary protocol beacon loop
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/netcat::nc-pipe
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-endpoint
      - id: micro-behaviors/data/control-flow/loop::shell-infinite-loop
      - id: micro-behaviors/data/encode/hex::shell-hex-byte-sequence
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/kernel/
