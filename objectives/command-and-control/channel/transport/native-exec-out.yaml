defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
traits:
  - id: native-c2-connected-status
    desc: Reports C2 host and port connection
    if:
      type: text
      exact: 'c2 connected %s:%d'
composite_rules:
  - id: native-exec-out-tasking
    desc: Native EXEC/OUT task protocol beside C2 connection status
    crit: suspicious
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/socket/message::native-exec-task-prefix
      - id: micro-behaviors/communications/socket/message::native-out-reply-template
      - id: native-c2-connected-status
