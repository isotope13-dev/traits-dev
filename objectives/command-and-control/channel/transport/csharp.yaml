defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1071
  mbc: B0030

traits:
  - id: msgpack-client-info-packet
    desc: MsgPack client info packet
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: "ClientInfo"
  - id: msgpack-host-fingerprint-fields--hwid
    desc: MsgPack host field (HWID)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: HWID
  - id: msgpack-host-fingerprint-fields--user
    desc: MsgPack host field (User)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: User
  - id: msgpack-host-fingerprint-fields--path
    desc: MsgPack host field (Path)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Path
  - id: msgpack-host-fingerprint-fields--admin
    desc: MsgPack host field (Admin)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Admin
  - id: msgpack-host-fingerprint-fields--performance
    desc: MsgPack host field (Performance)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Performance
  - id: msgpack-host-fingerprint-fields--pastebin
    desc: MsgPack host field (Pastebin)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Pastebin
  - id: msgpack-host-fingerprint-fields--antivirus
    desc: MsgPack host field (Antivirus)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Antivirus
  - id: msgpack-host-fingerprint-fields--installed
    desc: MsgPack host field (Installed)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Installed
  - id: msgpack-host-fingerprint-fields--pong
    desc: MsgPack host field (Pong)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Pong
  - id: msgpack-host-fingerprint-fields--group
    desc: MsgPack host field (Group)
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Group
  - id: msgpack-encode-bytes-call
    desc: MsgPack encode bytes call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Encode2Bytes$'
  - id: active-window-title-fingerprint
    desc: Active window title fingerprint
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetActiveWindowTitle$'

composite_rules:
  - id: msgpack-host-fingerprint-fields
    desc: MsgPack host fingerprint fields
    crit: notable
    conf: 0.9
    any:
      - id: msgpack-host-fingerprint-fields--hwid
      - id: msgpack-host-fingerprint-fields--user
      - id: msgpack-host-fingerprint-fields--path
      - id: msgpack-host-fingerprint-fields--admin
      - id: msgpack-host-fingerprint-fields--performance
      - id: msgpack-host-fingerprint-fields--pastebin
      - id: msgpack-host-fingerprint-fields--antivirus
      - id: msgpack-host-fingerprint-fields--installed
      - id: msgpack-host-fingerprint-fields--pong
      - id: msgpack-host-fingerprint-fields--group
  - id: msgpack-client-fingerprint-registration
    desc: MsgPack client fingerprint registration
    crit: suspicious
    conf: 0.95
    all:
      - id: msgpack-client-info-packet
      - id: msgpack-host-fingerprint-fields
      - id: msgpack-encode-bytes-call
    any:
      - id: active-window-title-fingerprint
  - id: msgpack-client-send-dispatch
    desc: MsgPack client send dispatch
    crit: suspicious
    conf: 0.92
    all:
      - id: objectives/command-and-control/backdoor/control/file-manager::msgpack-encoded-send-bytes
      - id: micro-behaviors/process/threading/queue::queue-user-work-item-call
