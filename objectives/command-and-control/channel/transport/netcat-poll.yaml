defaults:
  for: [shell]
  platforms: [unix]
composite_rules:
  - id: recurring-netcat-shell-execution
    desc: Shell loop accompanies netcat command execution
    crit: hostile
    conf: 0.98
    attack: T1059.004
    near_lines: 6
    all:
      - id: objectives/execution/payload/interpreter-stdin/network/shell::nc-remote-stream-pipe-shell
    any:
      - id: micro-behaviors/data/control-flow/loop/unconditional::shell-infinite-loop
      - id: micro-behaviors/data/control-flow/loop/conditional::shell-elapsed-time-loop
