# Delimited C2 file-transfer framing. Botnets that upload/download over a
# custom control channel wrap payloads between start/end markers rather than
# using Content-Length alone. The paired markers are the signature; either
# token alone is too weak.
defaults:
  platforms: [unix, windows, android]
  for: [c, cpp, go, rust, elf, pe, python, shell]
  attack: T1105,T1071
  mbc: B0030

traits:
  - id: file-transfer-start-marker
    desc: C2 file-transfer start framing marker
    crit: component
    conf: 0.93
    if:
      type: string_literal
      regex: '(?i)^__FILE_START__$'

  - id: file-transfer-end-marker
    desc: C2 file-transfer end framing marker
    crit: component
    conf: 0.93
    if:
      type: string_literal
      regex: '(?i)^__FILE_END__$'

composite_rules:
  - id: delimited-c2-file-transfer
    desc: Delimited C2 file-transfer framing markers
    crit: suspicious
    conf: 0.95
    attack: T1105
    all:
      - id: file-transfer-start-marker
      - id: file-transfer-end-marker
    near_bytes: 800
