defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1071.003,T1059

composite_rules:
  - id: smtp-starttls-command-session
    desc: SMTP STARTTLS carries a command-tasking channel
    crit: hostile
    conf: 0.97
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/email/probe::smtp-starttls-negotiation
    any:
      - id: objectives/command-and-control/backdoor/tasking/socket::python-socket-command-tasking-channel
      - id: objectives/command-and-control/remote-command/dispatch::tls-client-command-execution
      - id: objectives/command-and-control/backdoor/shell/socket::tls-command-listener
