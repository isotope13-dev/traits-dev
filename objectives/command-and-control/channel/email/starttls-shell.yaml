defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1071.003,T1059

composite_rules:
  - id: smtp-starttls-command-session
    desc: SMTP greeting and STARTTLS paired with socket or TLS command dispatch
    crit: suspicious
    conf: 0.97
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/email/probe::smtp-starttls-negotiation
    any:
      - id: objectives/command-and-control/backdoor/shell/socket::socket-command-dispatch
      - id: objectives/command-and-control/backdoor/shell/socket::tls-command-dispatch
