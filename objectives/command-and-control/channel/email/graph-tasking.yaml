# Cloud-mailbox tasking does not require Antino's subject prefixes or tenant IDs.
# Co-occurrence supports possible task dispatch, not proven runtime data flow.
defaults:
  for: [python, javascript, typescript]
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.95
  attack: T1071.003,T1059
composite_rules:
  - id: graph-mailbox-json-shell-tasking
    desc: Graph mailbox access with JSON body parsing and nested-field shell execution
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/email/access/exchange::mailbox-messages-resource-path
      - id: micro-behaviors/data/serialize/json::parse-body-content-json
      - id: micro-behaviors/process/create/shell/command-string::nested-object-shell-command
