defaults:
  platforms: [windows]
  for: [pe]
  attack: T1095,T1071

composite_rules:
  - id: importless-named-pipe-channel-stager
    desc: Importless PE stages C2 over a named pipe path
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::importless-x64-api-set-prefix-resolver
      - id: micro-behaviors/communications/ipc/named-pipe::pipe-path-prefix
