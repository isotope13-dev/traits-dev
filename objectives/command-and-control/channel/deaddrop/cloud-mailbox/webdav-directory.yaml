# WebDAV collections can be repurposed as a dead-drop when encoded records are
# placed in directory names and recovered by enumerating collection hrefs.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1102.002
  mbc: C0002

composite_rules:
  - id: webdav-encoded-collection-write
    desc: Encoded data is written as a WebDAV collection name
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/webdav::mkcol-dynamic-path
      - id: micro-behaviors/data/encode/base64::base64-encoding
    near_lines: 40

  - id: webdav-encoded-collection-read
    desc: WebDAV collection names are enumerated and decoded
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/webdav::propfind-method
      - id: micro-behaviors/communications/http/webdav::depth-header
      - id: micro-behaviors/communications/http/webdav::dav-href-response-element
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/decode/encoded/formats::python-urlsafe-base64-decode
      - id: micro-behaviors/data/decode/base64::buffer-from-url-safe-base64
    near_lines: 80

  - id: webdav-encoded-directory-mailbox
    desc: WebDAV directory names provide a bidirectional encoded mailbox
    crit: hostile
    conf: 0.995
    all:
      - id: webdav-encoded-collection-write
      - id: webdav-encoded-collection-read
    near_lines: 120

  - id: artifactory-webdav-directory-mailbox
    desc: Artifactory hosts a WebDAV directory-name mailbox
    crit: hostile
    conf: 0.995
    all:
      - id: webdav-encoded-directory-mailbox
      - id: micro-behaviors/communications/http/services/artifactory::service-route
    near_lines: 160
