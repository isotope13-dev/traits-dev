# Mutable Artifactory item properties can become an encoded dead-drop when the
# same program reads attacker task chunks and writes result chunks back through
# the storage API. The service and HTTP atoms remain neutral so ordinary
# repository-management clients do not become command-and-control findings.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: "T1102.002,T1132.001"
  mbc: "C0002,C0026"

composite_rules:
  - id: artifactory-encoded-item-properties-channel
    desc: Artifactory item properties provide a bidirectional encoded mailbox
    crit: hostile
    conf: 0.995
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/http/services/artifactory::set-item-properties
      - id: micro-behaviors/communications/http/services/artifactory::get-item-properties
      - id: micro-behaviors/data/encode/base64::base64-encoding
      - id: micro-behaviors/data/decode/base64::base64-decoding

  - id: artifactory-item-properties-command-execution
    desc: Artifactory item-properties mailbox drives process execution
    crit: hostile
    conf: 0.995
    attack: "T1102.002,T1059"
    near_bytes: 12000
    all:
      - id: artifactory-encoded-item-properties-channel
    any:
      - id: micro-behaviors/process/create/subprocess::variable-command-argument
      - id: micro-behaviors/process/create/direct::exec-command
      - id: micro-behaviors/process/create/direct::exec-command-context
      - id: micro-behaviors/process/create/shell/bridge::execSync-dynamic-command
      - id: micro-behaviors/process/create/shell/local::node-exec-command-variable
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

  - id: artifactory-item-properties-command-results
    desc: Artifactory item-properties mailbox returns process output streams
    crit: hostile
    conf: 0.995
    attack: "T1102.002,T1041"
    near_bytes: 12000
    all:
      - id: artifactory-encoded-item-properties-channel
      - id: micro-behaviors/process/io/stream::process-stdout-stderr-result-fields
