# Antino demonstrates that Graph tasking need not be Base64 encoded.
# Bind parsed message-body JSON to the value actually passed to a shell.
# Session prefixes, mailbox identities and storage directory names are omitted.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  attack: T1102.002,T1059
  conf: 0.97

composite_rules:
  - id: graph-mail-json-shell-execution
    desc: Graph mail body JSON drives shell execution
    crit: hostile
    all:
      - id: micro-behaviors/communications/http/oauth::microsoft-graph-mail-api
    any:
      - id: micro-behaviors/process/create/shell/request::python-message-json-shell-flow
      - id: micro-behaviors/process/create/shell/request::javascript-message-json-shell-flow
    near_bytes: 8192

  - id: graph-mail-shell-onedrive-results
    desc: Graph mailbox shell tasking with OneDrive writeback
    crit: hostile
    all:
      - id: graph-mail-json-shell-execution
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-write-traffic
      - id: micro-behaviors/communications/http/request/body::captured-shell-result-http-body
    near_bytes: 8192
