# Microsoft Graph calendar dead-drop behavior. The service-specific API atoms
# stay neutral; these composites require task filtering, opaque attachments,
# and a write-back flow before inferring a command channel.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
  attack: T1102,T1071.001
  mbc: C0002,C0021,C0026

traits:
  - id: calendar-subject-filter
    desc: Graph calendar subject filter
    crit: component
    conf: 0.95
    if:
      type: text
      substr: contains(subject

  - id: calendar-far-future-window
    desc: Far-future calendar event window
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '20[4-9][0-9]-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}'

  - id: calendar-command-argument-separator
    desc: Delimited calendar task arguments
    crit: component
    conf: 0.94
    if:
      type: literal
      exact: _,_

  - id: calendar-event-patch-method
    desc: C# HttpMethod.Patch reference
    crit: component
    conf: 0.92
    for: [csharp, pe, dll]
    if:
      type: text
      substr: HttpMethod.Patch

composite_rules:
  - id: graph-calendar-task-poll
    desc: Graph calendar task polling
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-calendar-view-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-calendar-event-attachments-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-attachment-content-bytes
    any:
      - id: calendar-subject-filter
      - id: calendar-far-future-window

  - id: graph-calendar-opaque-attachment-read
    desc: Reads opaque Graph calendar attachments
    crit: suspicious
    conf: 0.97
    unless:
      - id: well-known/app/ai/assistant/claude-desktop::official-package-context
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-calendar-event-attachments-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-attachment-content-bytes
      - id: micro-behaviors/communications/email/mime::mime-octet-stream

  - id: graph-calendar-event-write
    desc: Graph calendar event attachment write flow
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-calendar-events-write-path
      - id: micro-behaviors/communications/http/services/microsoft::graph-calendar-event-attachments-path
      - id: calendar-event-patch-method

  - id: graph-calendar-command-framing
    desc: Delimited calendar task command framing
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/delimited::double-semicolon-underscore-frame
      - id: calendar-command-argument-separator

  - id: graph-calendar-dead-drop-c2
    desc: Two-way Graph calendar dead-drop C2
    crit: hostile
    conf: 0.99
    all:
      - id: graph-calendar-task-poll
      - id: graph-calendar-opaque-attachment-read
      - id: graph-calendar-event-write
    any:
      - id: graph-calendar-command-framing
      - id: calendar-far-future-window

  - id: graph-calendar-hybrid-encrypted-c2
    desc: Encrypted Graph calendar dead-drop C2
    crit: hostile
    conf: 0.99
    all:
      - id: graph-calendar-dead-drop-c2
      - id: micro-behaviors/crypto/symmetric/aes/gcm::dotnet-aes-gcm-constructor
      - id: micro-behaviors/crypto/asymmetric/rsa-oaep::dotnet-rsa-oaep-sha256
