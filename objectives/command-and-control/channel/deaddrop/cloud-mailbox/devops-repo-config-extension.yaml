# Extension tasking via a source repository: the worker reads a config file
# through the DevOps git items API using a token baked into the code, and
# the same script sweeps every cookie in the profile. The repo is the dead
# drop: the operator edits a file to switch collection on or change where
# the data goes.
defaults:
  platforms: [unix, windows]
  attack: T1102.001,T1539

composite_rules:
  - id: repo-config-pat-cookie-sweep
    desc: Repo config pulled with embedded PAT drives full cookie sweep
    crit: hostile
    conf: 0.9
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/devops-azure::git-items-api-url
      - id: micro-behaviors/communications/http/basic-auth::btoa-empty-user-token
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all-unscoped
