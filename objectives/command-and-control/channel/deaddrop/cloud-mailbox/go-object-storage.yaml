# A Go program whose object-storage client lists a bucket, fetches objects
# and writes objects back, and whose own methods build inbox and outbox keys:
# the bucket is a mailbox. The operator drops tasks under the inbox prefix,
# the implant polls, runs them and posts results under the outbox prefix, so
# the only network peer is the cloud provider. Process execution (or a
# liveness heartbeat object) separates this from a plain job-queue worker.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  attack: T1102.002
  mbc: B0030

composite_rules:
  - id: go-bucket-inbox-outbox-tasking
    desc: Go implant polls a cloud bucket inbox and posts outbox results
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: micro-behaviors/communications/http/services/tencent::go-cos-list-get-put-client
      - id: micro-behaviors/communications/http/request/tasking::go-inbox-outbox-key-methods
    any:
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
      - id: micro-behaviors/communications/http/request/tasking::go-liveness-object-method
