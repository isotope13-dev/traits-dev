# A spreadsheet can serve as a cloud mailbox when an implant reads attacker
# task cells and writes results back.  The API atoms remain neutral so ordinary
# Sheets integrations do not become C2 findings.
defaults:
  platforms: [unix, windows]
  for: [source, binaries]
  attack: T1102.002,T1059
  mbc: C0002

traits:
  - id: spreadsheet-victim-range
    desc: Victim-named spreadsheet range
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(victim|host|agent|client)[-_][A-Za-z0-9%_-]{1,32}![A-Z]{1,3}[0-9]+'

composite_rules:
  - id: google-sheets-command-poll
    desc: Google Sheets command polling loop
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/google::google-sheets-api-service
      - id: micro-behaviors/communications/http/services/google::google-sheets-values-read-flow
      - id: micro-behaviors/time/sleep/interval::numeric-delay-call
    any:
      - id: micro-behaviors/data/format/json::go-command-result-schema
      - id: micro-behaviors/data/format/json::map-command-result-schema
    near_lines: 50

  - id: google-sheets-command-channel
    desc: Google Sheets bidirectional command mailbox
    crit: hostile
    conf: 0.995
    all:
      - id: google-sheets-command-poll
      - id: micro-behaviors/communications/http/services/google::google-sheets-values-write-flow
      - id: spreadsheet-victim-range
    near_lines: 100

  - id: google-sheets-command-execution
    desc: Google Sheets command mailbox drives process execution
    crit: hostile
    conf: 0.995
    all:
      - id: google-sheets-command-channel
    any:
      - id: micro-behaviors/process/create/direct::exec-command
      - id: micro-behaviors/process/create/direct::exec-command-context
      - id: micro-behaviors/process/create/subprocess::variable-command-argument
    near_lines: 120
