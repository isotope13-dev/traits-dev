defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  attack: T1102,T1071.001
  crit: suspicious
  conf: 0.88
traits:
- id: graph-mail-message-delete-call
  desc: Deletes a Microsoft Graph mail message
  crit: notable
  conf: 0.9
  for:
  - scripts
  - source
  if:
    type: text
    regex: (?i)\bdelete\s*\(\s*["'][^"'\n]{0,80}graph\.microsoft\.com[^"'\n]{0,80}/messages/
composite_rules:
- id: graph-mailbox-command-channel
  for:
  - elf
  - macho
  - pe
  desc: Graph mailbox command channel
  crit: hostile
  conf: 0.97
  mbc: C0002,C0021,C0026,E1059
  attack: T1102,T1071.001,T1059
  all:
  - id: micro-behaviors/communications/http/oauth::microsoft-graph
  - id: micro-behaviors/communications/http/oauth::microsoft-graph-mail-api
  - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
  - id: micro-behaviors/data/decode/base64::go-base64-decode
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
  unless:
  - id: well-known/dual-use/transfer/rclone::rclone-tool
  - id: well-known/app/communication/dankmail::dankmail-email-client-context
- id: graph-mailbox-script-command-execution
  desc: Microsoft Graph mailbox tasking decoded to command execution
  crit: hostile
  conf: 0.96
  mbc: C0002,C0026,E1059
  attack: T1102,T1071.001,T1059
  for:
  - scripts
  - '!jcl'
  near_bytes: 8192
  unless:
  - id: well-known/app/productivity/keepercommander/
  - id: well-known/app/publishing/fluent-smtp/
  all:
  - id: micro-behaviors/communications/http/oauth::microsoft-graph
  - id: micro-behaviors/communications/http/oauth::microsoft-graph-mail-api
  - id: micro-behaviors/data/decode/base64::base64-decoding
  any:
  - id: micro-behaviors/process/create/subprocess::run-ast
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::check-output-ast
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-command-text
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
- id: graph-mailbox-task-cleanup
  for:
  - elf
  - macho
  - pe
  desc: Graph mailbox task cleanup
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/oauth::microsoft-graph
  - id: micro-behaviors/communications/http/oauth::microsoft-graph-mail-api
  - id: micro-behaviors/fs/delete/file/library::os-Remove-string
  any:
  - id: micro-behaviors/communications/http/delete::delete
  - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
- id: graph-mailbox-tasking-with-message-erasure
  desc: Graph mailbox backdoor erases tasking messages after execution
  crit: hostile
  conf: 0.97
  mbc: C0002,C0026,F0004,E1059
  attack: T1070.008,T1102,T1071.001,T1059
  for:
  - scripts
  - '!jcl'
  near_bytes: 8192
  all:
  - id: graph-mailbox-script-command-execution
  - id: graph-mail-message-delete-call
