# Public file-storage C2 in the style described for the APT28 Covenant Grunt:
# task bytes are downloaded from the storage provider and responses are posted
# back. The service name is only one leg; the hostile rule also requires the
# managed encrypted loader, so ordinary storage integrations remain neutral.
defaults:
  platforms: [windows, unix]
  for: [csharp, pe, dll, scripts, binaries]
  attack: T1102.002,T1071.001,T1105
  mbc: B0030

composite_rules:
  - id: public-file-storage-two-way-transfer
    desc: Filen or Koofr file-storage two-way transfer
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/cloud::filen-koofr-public-file-host
      - id: micro-behaviors/communications/http/client/managed::downloaddata
      - id: micro-behaviors/communications/http/upload::dotnet-webclient-uploadvalues
    near_bytes: 16384

  - id: encrypted-public-file-storage-managed-stager
    desc: Encrypted managed assembly staged through public file storage
    crit: hostile
    conf: 0.99
    attack: T1102.002,T1105,T1140,T1620
    all:
      - id: public-file-storage-two-way-transfer
      - id: objectives/anti-static/pack/runtime::dotnet-remote-encrypted-entrypoint-loader
    near_bytes: 16384
