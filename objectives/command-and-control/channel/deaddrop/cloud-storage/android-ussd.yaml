defaults:
  platforms: [android]
  for: [java, kotlin]

composite_rules:
  # Cloud input plus a value-derived supplementary-service operation is a
  # remote-control candidate. Do not infer C2 from Firebase use alone, or
  # claim that proximity proves a particular callback's data flow.
  - id: firebase-ussd-tasking-source
    desc: Firebase listener near value-derived USSD
    crit: suspicious
    conf: 0.94
    near_bytes: 1600
    all:
      - id: micro-behaviors/data/db/access::android-firebase-value-listener
      - id: micro-behaviors/communications/messaging/divert::android-value-derived-ussd-source
