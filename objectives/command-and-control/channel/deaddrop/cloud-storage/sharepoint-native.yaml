# Co-occurrence indicates a possible command channel, not proven data flow.
# Title filtering alone is routine Graph usage. Do not convict on a tenant,
# victim prefix, task extension, or the particular shell command spelling.
defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: suspicious
  conf: 0.94
composite_rules:
  - id: graph-list-shell-dispatch
    desc: Graph list query with native shell dispatch
    attack: T1102.002,T1059.003
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host-source-literal
      - id: micro-behaviors/communications/url/resource-path/content::list-items-path
      - id: micro-behaviors/communications/http/odata::title-prefix-filter
      - id: micro-behaviors/process/create/subprocess/launch::create-process-call-source
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
