# A public model or dataset repository can act as a mailbox between an
# operator and a compromised worker. The provider transport remains a neutral
# capability; command extraction, variable shell execution, returned process
# streams, and recurring polling establish the command-and-control behavior.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.995
  attack: "T1102.002,T1059.006"
  mbc: "C0002,B0030"

composite_rules:
  - id: huggingface-repository-shell-tasking
    desc: Hugging Face repository mailbox supplies commands for shell execution
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/huggingface::huggingface-hub-bidirectional-file-exchange
      - id: micro-behaviors/communications/http/request/tasking::http-task-command-field-read
      - id: micro-behaviors/process/create/shell-subprocess::variable-command-shell-true

  - id: huggingface-repository-command-results
    desc: Hugging Face repository command channel returns captured process output
    attack: "T1102.002,T1059.006,T1041"
    scope: file
    all:
      - id: huggingface-repository-shell-tasking
      - id: micro-behaviors/process/io/stream::process-stdout-stderr-result-fields

  - id: huggingface-repository-polling-worker-c2
    desc: Worker polls a Hugging Face repository for commands and returns results
    attack: "T1102.002,T1059.006,T1041"
    scope: file
    all:
      - id: huggingface-repository-command-results
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/time/sleep/interval::python-sleep-1s-plus-arg
