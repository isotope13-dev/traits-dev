# Microsoft Graph OneDrive content as a cloud-storage dead-drop channel.
# The durable evidence is the Graph drive addressing shape plus a two-way HTTP
# workflow. Folder names, filenames, item IDs, API versions, and cloud domains
# are intentionally not treated as family identifiers.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1102.002,T1071.001
  mbc: B0030

traits: []

composite_rules:

  - id: graph-onedrive-polled-two-way-channel
    desc: Polled two-way OneDrive Graph channel
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-read-traffic
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-write-traffic
    any:
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/time/sleep/interval::python-sleep-call
      - id: micro-behaviors/time/schedule/interval::setInterval
    near_bytes: 12000

  - id: graph-onedrive-command-execution
    desc: OneDrive Graph channel with process execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-read-traffic
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-content-write-traffic
    any:
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
    near_bytes: 12000

  # Native service DLLs often concatenate Graph path-style root + :/content
  # without script HTTP client atoms, so the script-oriented two-way channel
  # composites above miss them. Unsigned ServiceMain + Graph drive content +
  # OAuth refresh against login.microsoftonline.com is a OneDrive dead-drop
  # implant profile, not a signed Microsoft sync client.
  - id: graph-onedrive-unsigned-service-dll-channel
    desc: Unsigned service DLL OneDrive Graph C2
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/service/export::win-service-export
      - id: micro-behaviors/os/service/control::register-service-handler
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
      - id: micro-behaviors/communications/http/oauth::microsoft-login
      - id: micro-behaviors/communications/http/oauth::oauth-refresh-grant-type
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-children-listing
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content
    unless:
      - id: metadata/signed/platform/
