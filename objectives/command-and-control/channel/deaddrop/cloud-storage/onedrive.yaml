# Microsoft Graph OneDrive content as a cloud-storage dead-drop channel.
# The durable evidence is the Graph drive addressing shape plus a two-way HTTP
# workflow. Folder names, filenames, item IDs, API versions, and cloud domains
# are intentionally not treated as family identifiers.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1102.002,T1071.001
  mbc: B0030

traits: []

composite_rules:
  - id: graph-drive-read-request
    desc: HTTP GET to a Microsoft Graph drive endpoint
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context
      - id: metadata/package/quality/benign-context::bobfrankston-mailx-package-context
      - id: well-known/app/communication/bobfrankston-mailx::mailx-settings-cloud-module
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/communications/http/get::http-get
      - id: micro-behaviors/communications/http/get::axios-get-call

  - id: graph-drive-write-request
    desc: HTTP write to a Microsoft Graph drive endpoint
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api
    unless:
      - id: metadata/package/quality/benign-context::bobfrankston-mailx-package-context
      - id: well-known/app/communication/bobfrankston-mailx::mailx-settings-cloud-module
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/lib/requests::requests-put
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/put::javascript-put-request-body
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/put::axios-put-call
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-name
      - id: micro-behaviors/communications/http/post::http-post

  # Notable, not suspicious: "this program uses the OneDrive file API" is a
  # complete, neutral network operation that every OneDrive-integrated app
  # performs -- mail clients, note takers, backup tools. It was carrying an
  # `unless:` allowlist for one npm package, which is the shape of a rule
  # priced a level too high. The dead-drop objective is the two-way polled
  # channel / channel-plus-exec composites below, which still fire hostile.
  - id: graph-drive-content-read-traffic
    desc: Reads OneDrive file content through Microsoft Graph
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: graph-drive-read-request
    any:
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-item-content
    near_bytes: 8192
    unless:
      - id: metadata/package/quality/benign-context::bobfrankston-mailx-package-context
      - id: well-known/app/communication/bobfrankston-mailx::mailx-settings-cloud-module

  # Notable, not suspicious: "this program uses the OneDrive file API" is a
  # complete, neutral network operation that every OneDrive-integrated app
  # performs -- mail clients, note takers, backup tools. It was carrying an
  # `unless:` allowlist for one npm package, which is the shape of a rule
  # priced a level too high. The dead-drop objective is the two-way polled
  # channel / channel-plus-exec composites below, which still fire hostile.
  - id: graph-drive-content-write-traffic
    desc: Writes OneDrive file content through Microsoft Graph
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: graph-drive-write-request
    any:
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-item-content
    near_bytes: 8192
    unless:
      - id: metadata/package/quality/benign-context::bobfrankston-mailx-package-context
      - id: well-known/app/communication/bobfrankston-mailx::mailx-settings-cloud-module

  - id: graph-onedrive-polled-two-way-channel
    desc: Polled two-way OneDrive Graph channel
    crit: hostile
    conf: 0.98
    all:
      - id: graph-drive-content-read-traffic
      - id: graph-drive-content-write-traffic
    any:
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/time/sleep/interval::python-sleep-call
      - id: micro-behaviors/time/schedule/interval::setInterval
    near_bytes: 12000

  - id: graph-onedrive-command-execution
    desc: OneDrive Graph channel with process execution
    crit: hostile
    conf: 0.99
    all:
      - id: graph-drive-content-read-traffic
      - id: graph-drive-content-write-traffic
    any:
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/interpreter/eval::powershell-iex-call
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
    near_bytes: 12000

  # Native service DLLs often concatenate Graph path-style root + :/content
  # without script HTTP client atoms, so the script-oriented two-way channel
  # composites above miss them. Unsigned ServiceMain + Graph drive content +
  # OAuth refresh against login.microsoftonline.com is a OneDrive dead-drop
  # implant profile, not a signed Microsoft sync client.
  - id: graph-onedrive-unsigned-service-dll-channel
    desc: Unsigned service DLL OneDrive Graph C2
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/service/export::win-service-export
      - id: micro-behaviors/os/service/control::register-service-handler
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
      - id: micro-behaviors/communications/http/oauth::microsoft-login
      - id: micro-behaviors/communications/http/oauth::oauth-refresh-grant-type
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-children-listing
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content
    unless:
      - id: metadata/signed/platform/
