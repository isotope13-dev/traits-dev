defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - csharp
  - python
  - powershell
  crit: hostile
  conf: 0.97
  attack: T1102.002
composite_rules:
- id: cloud-hex-suffix-managed-tasking
  desc: Cloud file suffix tasking invokes downloaded assemblies
  all:
  - id: micro-behaviors/os/module/load::http-assembly-method-invocation
  - id: micro-behaviors/data/string/compare::hexadecimal-suffix-test
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host-source-literal
  - id: micro-behaviors/communications/http/services/google::googleapis-drive
  - id: micro-behaviors/communications/http/url/cloud::yandex-disk-api-url
  near_bytes: 8192
- id: cloud-managed-file-write-tasking
  desc: Cloud assembly tasking also writes HTTP bytes to selected paths
  for: [python, csharp]
  attack: T1102.002,T1105
  all:
  - id: objectives/command-and-control/remote-command/tasking::cloud-managed-task-results
  any:
  - id: micro-behaviors/communications/http/download/write::python-http-task-selected-file-write
  - id: micro-behaviors/communications/http/download/write::csharp-http-task-selected-file-write
  near_bytes: 8192

# A remotely chosen output path is also used by sync/admin tooling. The C#
# hostile finding requires the independently admitted remote-code task channel;
# the bound download/write itself remains a notable capability without it.
- id: cloud-managed-channel-file-write-tasking
  desc: Cloud code tasking writes a remotely selected local path
  for: [csharp]
  attack: T1102.002,T1105
  all:
  - id: cloud-hex-suffix-managed-tasking
  - id: micro-behaviors/communications/http/download/write::http-task-selected-file-write
  near_bytes: 8192
