# FTP clients print the server's greeting before authentication. Piping that
# untrusted output into a command interpreter turns the greeting into a
# dead-drop command channel. Match the dataflow rather than an IP, lure,
# malware family, or particular downloaded payload.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, lnk, batch, powershell, shell]
  attack: T1102.001,T1059
  mbc: B0030

composite_rules:
  - id: ftp-banner-command-execution
    desc: FTP banner command execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ftp/control::ftp-client-command-invocation
      - id: micro-behaviors/data/runtime/keywords::pipe-to-interpreter
    near_lines: 1

  - id: ftp-banner-netcat-command-execution
    desc: FTP-port response piped from Netcat into an interpreter
    crit: hostile
    conf: 0.99
    for: [shell, batch]
    all:
      - id: micro-behaviors/communications/ftp/client::netcat-ftp-port-connect
      - id: micro-behaviors/data/runtime/keywords::pipe-to-interpreter
    near_lines: 1

  - id: ftp-banner-download-execution
    desc: FTP banner downloads and launches payload
    crit: hostile
    conf: 0.995
    attack: T1102.001,T1105,T1059
    all:
      - id: ftp-banner-command-execution
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-process-followon
      - id: objectives/command-and-control/dropper/delivery/download-execute/
      - id: objectives/command-and-control/dropper/execution/download-exec/
      - id: objectives/command-and-control/dropper/execution/pipe/
    near_lines: 30

  - id: ftp-banner-netcat-download-execution
    desc: FTP-port response via Netcat downloads and launches a payload
    crit: hostile
    conf: 0.995
    attack: T1102.001,T1105,T1059
    for: [shell, batch]
    all:
      - id: ftp-banner-netcat-command-execution
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-process-followon
      - id: objectives/command-and-control/dropper/delivery/download-execute/
      - id: objectives/command-and-control/dropper/execution/download-exec/
      - id: objectives/command-and-control/dropper/execution/pipe/
    near_lines: 30

  - id: ftp-banner-tcpclient-iex
    desc: FTP greeting from TcpClient is executed as PowerShell
    crit: hostile
    conf: 0.99
    for: [powershell]
    attack: T1102.001,T1059.001
    all:
      - id: micro-behaviors/communications/ftp/client::tcpclient-ftp-service-port
      - id: micro-behaviors/process/interpreter/runtime/eval::powershell-iex-text
    near_lines: 20

  - id: ftp-banner-tcpclient-download-execution
    desc: FTP greeting via TcpClient downloads and launches a payload
    crit: hostile
    conf: 0.995
    for: [powershell]
    attack: T1102.001,T1105,T1059.001
    all:
      - id: ftp-banner-tcpclient-iex
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-process-followon
      - id: objectives/command-and-control/dropper/delivery/download-execute/
      - id: objectives/command-and-control/dropper/execution/download-exec/
      - id: objectives/command-and-control/dropper/execution/pipe/
    near_lines: 30
