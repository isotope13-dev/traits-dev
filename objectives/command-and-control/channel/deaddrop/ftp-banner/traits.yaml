# FTP clients print the server's greeting before authentication. Piping that
# untrusted output into a command interpreter turns the greeting into a
# dead-drop command channel. Match the dataflow rather than an IP, lure,
# malware family, or particular downloaded payload.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [scripts, binaries, lnk, batch, powershell, shell]
  attack: T1102.001,T1059
  mbc: B0030

composite_rules:
  - id: ftp-banner-command-execution
    for: [scripts, '!jcl', lnk]
    desc: FTP banner command execution
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ftp/control::ftp-client-command-invocation
      - id: metadata/lang/source/syntax/command::pipe-to-interpreter
    near_lines: 1
    unless:
      - id: metadata/package/testing/corpus::pytest-command-classifier-case-table

  - id: ftp-banner-netcat-command-execution
    desc: FTP-port response piped from Netcat into an interpreter
    crit: suspicious
    conf: 0.99
    for: [shell, batch]
    all:
      - id: micro-behaviors/communications/ftp/client::netcat-ftp-port-connect
      - id: metadata/lang/source/syntax/command::pipe-to-interpreter
    near_lines: 1

  - id: ftp-banner-download-execution
    for: [scripts, '!jcl', lnk]
    desc: FTP banner downloads and launches payload
    conf: 0.995
    attack: T1102.001,T1105,T1059
    all:
      - id: ftp-banner-command-execution
    any:
      - id: metadata/lang/source/syntax/call/relationship::webclient-start-process-source-sequence
      - id: objectives/command-and-control/dropper/delivery/execute-download/
      - id: objectives/execution/lolbin/os::remote-msiexec-pathless-com-dropper
      - id: objectives/persistence/system/scheduled-task::python-appdata-self-deleting-archive-task-loader
      - id: "objectives/command-and-control/dropper/file-exec"
      - id: objectives/execution/payload/file-exec::brotli-exe-then-hidden-run
      - id: objectives/command-and-control/dropper/interpreter-stdin/
      - id: objectives/command-and-control/dropper/module-load/
      - id: objectives/command-and-control/dropper/delivery/pipe/
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell-word
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-zsh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-ksh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-dash
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell
      - id: micro-behaviors/process/io/stream::curl-pipe-ruby-stdin
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
      - id: objectives/execution/lolbin/regsvr32::squiblydoo
    near_lines: 30

  - id: ftp-banner-netcat-download-execution
    desc: FTP-port response via Netcat downloads and launches a payload
    conf: 0.995
    attack: T1102.001,T1105,T1059
    for: [shell, batch]
    all:
      - id: ftp-banner-netcat-command-execution
    any:
      - id: metadata/lang/source/syntax/call/relationship::webclient-start-process-source-sequence
      - id: objectives/command-and-control/dropper/delivery/execute-download/
      - id: objectives/execution/lolbin/os::remote-msiexec-pathless-com-dropper
      - id: objectives/persistence/system/scheduled-task::python-appdata-self-deleting-archive-task-loader
      - id: "objectives/command-and-control/dropper/file-exec"
      - id: objectives/command-and-control/dropper/interpreter-stdin/
      - id: objectives/command-and-control/dropper/module-load/
      - id: objectives/command-and-control/dropper/delivery/pipe/
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell-word
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-zsh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-ksh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-dash
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell
      - id: micro-behaviors/process/io/stream::curl-pipe-ruby-stdin
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
      - id: objectives/execution/lolbin/regsvr32::squiblydoo
    near_lines: 30

  - id: ftp-banner-tcpclient-iex
    desc: FTP greeting from TcpClient is executed as PowerShell
    conf: 0.99
    for: [powershell]
    attack: T1102.001,T1059.001
    all:
      - id: micro-behaviors/communications/ftp/client::tcpclient-ftp-service-port
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
    near_lines: 20

  - id: ftp-banner-tcpclient-download-execution
    desc: FTP greeting via TcpClient downloads and launches a payload
    conf: 0.995
    for: [powershell]
    attack: T1102.001,T1105,T1059.001
    all:
      - id: ftp-banner-tcpclient-iex
    any:
      - id: metadata/lang/source/syntax/call/relationship::webclient-start-process-source-sequence
      - id: objectives/command-and-control/dropper/delivery/execute-download/
      - id: objectives/execution/lolbin/os::remote-msiexec-pathless-com-dropper
      - id: objectives/persistence/system/scheduled-task::python-appdata-self-deleting-archive-task-loader
      - id: "objectives/command-and-control/dropper/file-exec"
      - id: objectives/command-and-control/dropper/interpreter-stdin/
      - id: objectives/command-and-control/dropper/module-load/
      - id: objectives/command-and-control/dropper/delivery/pipe/
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell-word
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-zsh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-ksh
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-dash
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-shell
      - id: micro-behaviors/process/io/stream::curl-pipe-ruby-stdin
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
      - id: objectives/execution/lolbin/regsvr32::squiblydoo
    near_lines: 30

