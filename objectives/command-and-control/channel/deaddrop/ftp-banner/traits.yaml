# FTP clients print the server's greeting before authentication. Piping that
# untrusted output into a command interpreter turns the greeting into a
# dead-drop command channel. Match the dataflow rather than an IP, lure,
# malware family, or particular downloaded payload.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [scripts, binaries, lnk, batch, powershell, shell]
  attack: T1102.001,T1059
  mbc: B0030

composite_rules:
  - id: ftp-banner-command-execution
    for: [scripts, '!jcl', lnk]
    desc: FTP banner command execution
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ftp/control::ftp-client-command-invocation
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-interpreter
    near_lines: 1
    unless:
      - id: metadata/package/testing/corpus/security-tests::pytest-command-classifier-case-table

  - id: ftp-banner-netcat-command-execution
    desc: FTP-port response piped from Netcat into an interpreter
    crit: suspicious
    conf: 0.99
    for: [shell, batch]
    all:
      - id: micro-behaviors/communications/ftp/client::netcat-ftp-port-connect
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-interpreter
    near_lines: 1

  - id: ftp-banner-download-execution
    for: [scripts, '!jcl', lnk]
