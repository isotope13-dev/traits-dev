# GitHub Contents dead-drop tasking recovered from source text or native
# binary string tables.
defaults:
  platforms: [windows, unix]
  crit: suspicious
  attack: T1102
  for: [rust, go, python, javascript, typescript, shell, c, cpp]
traits:
# The allocate/protect/execute trio, in one matcher and in proximity — the
# same shape the native cluster below already requires. As three separate
# bare-substring atoms each one fired on any source file that merely contained
# the API name, and `CreateThread` is not even Windows-specific as a token:
# App Store Connect CLI's desktop app defines `func (a *App) CreateThread(title
# string)` for UI conversation threads, which is how a Go CLI acquired a
# GitHub-dead-drop component finding. One API name alone says nothing; the
# three within a few hundred bytes of each other are the memory stage.
- id: github-contents-executable-memory-trio
  desc: Allocate, protect and start-thread APIs together
  crit: notable
  conf: 0.9
  attack: T1620
  if:
    type: text
    regex: '(?is)\bVirtualAlloc\b.{0,240}\bVirtualProtect\b.{0,240}\bCreateThread\b'

- id: github-native-contents-state-cluster
  desc: Native mailbox state cluster
  crit: notable
  conf: 0.94
  for: [pe, dll]
  if:
    type: text
    regex: '(?is)\bbeacon\.json\b.{0,160}\bcmd\.json\b'

- id: github-native-contents-upload-tree
  desc: Native GitHub mailbox upload path
  crit: notable
  conf: 0.92
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\b(api\.)?github\.com[/\\].{0,200}\bcontents[/\\].{0,80}\bupload[/\\]'
  unless:
  - id: well-known/lib/media/ffmpeg/

- id: github-native-executable-memory-cluster
  desc: Native executable-memory cluster
  crit: notable
  conf: 0.95
  attack: T1620
  for: [pe, dll]
  if:
    type: text
    regex: '(?is)\bVirtualAlloc\b.{0,120}\bVirtualProtect\b.{0,120}\bCreateThread\b'
composite_rules:
# `result.json` / `task.json` / `upload/` are ordinary project file names: those
# matchers recognize a path and assert nothing about GitHub or about tasking, so
# they live at micro-behaviors/fs/path/reference:: (with the state-file union)
# and are referenced from here, where the Contents API endpoint supplies the
# mailbox context. Defining them locally handed a dead-drop C2 component to
# every project that ships an output.json or an upload/ directory.
- id: github-contents-executable-memory-stage
  desc: GitHub Contents endpoint with executable memory stage
  crit: suspicious
  conf: 0.93
  attack: T1620
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: github-contents-executable-memory-trio
- id: github-contents-mailbox-command-channel
  desc: GitHub Contents mailbox command channel
  crit: hostile
  conf: 0.97
  attack: "T1102.002,T1059"
  mbc: C0002
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: micro-behaviors/fs/path/reference::job-state-json-filename
  any:
  - id: micro-behaviors/process/create/
  - id: github-contents-executable-memory-stage
- id: github-contents-memory-payload-stage
  desc: GitHub Contents in-memory payload stage
  crit: hostile
  conf: 0.96
  attack: "T1102.002,T1105,T1620"
  mbc: C0002
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: micro-behaviors/fs/path/reference::upload-path-segment
  - id: github-contents-executable-memory-stage
- id: github-contents-native-command-channel
  desc: Native GitHub Contents mailbox command channel
  crit: hostile
  conf: 0.97
  attack: "T1102.002,T1059"
  mbc: C0002
  for: [pe, dll]
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: github-native-contents-state-cluster
  any:
  - id: micro-behaviors/process/create/
  - id: github-native-executable-memory-cluster
- id: github-contents-native-memory-payload-stage
  desc: Native GitHub Contents in-memory payload stage
  crit: hostile
  conf: 0.96
  attack: "T1102.002,T1105,T1620"
  mbc: C0002
  for: [pe, dll]
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: github-native-contents-upload-tree
  - id: github-native-executable-memory-cluster
