defaults:
  platforms: [windows, unix]
  crit: suspicious
  attack: T1102
  for: [rust, go, python, javascript, typescript, shell, c, cpp]
traits:
- id: github-contents-task-state-file
  desc: GitHub Contents mailbox state file
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(beacon|cmd|result|task|output|status)\.json\b'
  count_min: 2
- id: github-contents-upload-tree
  desc: GitHub Contents mailbox upload path
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)(^|[/\\])upload([/\\]|$)'
- id: github-contents-virtual-alloc
  desc: VirtualAlloc memory allocation
  crit: component
  conf: 0.9
  attack: T1620
  if:
    type: text
    substr: VirtualAlloc
- id: github-contents-virtual-protect
  desc: VirtualProtect memory permission change
  crit: component
  conf: 0.9
  attack: T1620
  if:
    type: text
    substr: VirtualProtect
- id: github-contents-thread-start
  desc: CreateThread memory execution
  crit: component
  conf: 0.9
  attack: T1620
  if:
    type: text
    substr: CreateThread
composite_rules:
- id: github-contents-executable-memory-stage
  desc: Allocates and executes in-memory payload
  crit: suspicious
  conf: 0.93
  attack: T1620
  all:
  - id: github-contents-virtual-alloc
  - id: github-contents-virtual-protect
  - id: github-contents-thread-start
- id: github-contents-command-channel-source
  desc: GitHub Contents mailbox command channel
  crit: hostile
  conf: 0.97
  attack: "T1102.002,T1059"
  mbc: C0002
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: github-contents-task-state-file
  any:
  - id: micro-behaviors/process/create/
  - id: github-contents-executable-memory-stage
- id: github-contents-memory-payload-stage
  desc: GitHub Contents in-memory payload stage
  crit: hostile
  conf: 0.96
  attack: "T1102.002,T1105,T1620"
  mbc: C0002
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: github-contents-upload-tree
  - id: github-contents-executable-memory-stage
