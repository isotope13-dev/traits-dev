defaults:
  platforms:
  - windows
  for:
  - csharp
  attack: T1102
  mbc: C0002
  crit: hostile
composite_rules:
- id: github-contents-decoded-command
  desc: GitHub Contents response is decoded and executed
  conf: 0.97
  attack: T1102.002,T1059
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
  - id: micro-behaviors/process/create/shell/spawn::csharp-cmd-command-text
- id: github-issue-comment-deaddrop
  desc: GitHub issue comment hides encrypted dead-drop
  conf: 0.98
  attack: T1102.001,T1140
  all:
  - id: micro-behaviors/communications/http/services/github::github-issues-search-api
  - id: micro-behaviors/data/string/search::dotnet-html-comment-capture
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
  - id: github-contents-decoded-command
