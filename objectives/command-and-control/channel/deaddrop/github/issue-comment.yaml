# GitHub living-off-the-cloud command channel used by .NET loaders.
# The Contents API is the primary mailbox: a per-host file is fetched, the
# body is Base64-decoded, and the result is executed. If that token is
# revoked, the same implant queries the Issues Search API, carves ciphertext
# out of an HTML comment, and decrypts it to rotate the route. Field names
# inside the plaintext are chosen by the operator and are not required.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1102
  mbc: C0002

traits:
  - id: html-comment-body-capture
    desc: Regex captures an HTML comment body
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '<!--\(\.[*+]\??\)-->'

composite_rules:
  - id: github-contents-decoded-command
    desc: GitHub Contents response is decoded and executed
    crit: hostile
    conf: 0.97
    attack: T1102.002,T1059
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/create/spawn::start

  - id: github-issue-comment-deaddrop
    desc: GitHub issue comment hides encrypted dead-drop
    crit: hostile
    conf: 0.98
    attack: T1102.001,T1140
    near_bytes: 1600
    all:
      - id: micro-behaviors/communications/http/services/github::github-issues-search-api
      - id: html-comment-body-capture
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
