defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1071.001,T1564.001

composite_rules:
  - id: npm-import-time-github-raw-image-stage
    desc: Import-time IIFE stages GitHub raw image URL
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1071.001
    mbc: E1105
    scope: archive
    for: [npm, package.json, javascript, typescript]
    near_lines: 28
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-close
      - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-image-suffix
    unless:
      - id: metadata/package/testing/
  # Same stage as the IIFE form, but the package calls a named function at
  # module scope. Byte proximity keeps that call with the download; archive
  # line windows collapse and would accept an unrelated call elsewhere.
  - id: npm-import-time-named-call-github-raw-image-stage
    desc: Import-time call stages a GitHub raw image URL
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1105,T1071.001
    mbc: E1105
    scope: archive
    for: [npm, package.json, javascript, typescript]
    near_bytes: 1600
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-image-suffix
    unless:
      - id: metadata/package/testing/
  - id: npm-import-time-dead-drop-state-write
    desc: Import-time code writes GitHub dead-drop state
    crit: hostile
    conf: 0.99
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke
      - id: micro-behaviors/process/user/query::os-homedir-call
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/url/github::gist-githubusercontent-raw-url
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
    unless:
      - id: metadata/package/testing/
