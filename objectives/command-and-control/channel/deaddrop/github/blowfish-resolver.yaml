defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  attack: T1102,T1027
  crit: suspicious
composite_rules:
- id: github-blowfish-ecb-decrypt
  desc: Blowfish-ECB decrypts GitHub raw payload
  crit: suspicious
  conf: 0.95
  for: [python]
  all:
  - id: well-known/app/development/code-forge/github::github-raw-url
  - id: micro-behaviors/crypto/symmetric/blowfish/initialize::blowfish-ecb-mode
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call
- id: github-json-blowfish-c2-resolver
  desc: GitHub JSON dead-drop resolves C2 via Blowfish
  crit: hostile
  conf: 0.97
  for: [python]
  all:
  - id: github-blowfish-ecb-decrypt
  - id: well-known/app/development/code-forge/github::raw-githubusercontent-json
  any:
  - id: micro-behaviors/data/parse/json::json-loads-call
  - id: metadata/import/python/urllib/request
  - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-assignment
