# GitHub raw dead-drop that unwraps a Blowfish-ECB ciphertext into a C2 URL.
# Same resolver shape as Still Audio / AquilaRAT (raw.githubusercontent JSON +
# Blowfish ECB + base64 decrypt) without hardcoding a single repo or key.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, python, javascript, typescript, go, rust]
  attack: T1102,T1027
  crit: suspicious

traits:
  - id: raw-github-json-path
    desc: raw.githubusercontent JSON config path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/.{1,120}\.json\b'
    unless:
      - type: text
        substr: build-index.json
      - type: text
        regex: '\.ipynb\.json\b'

composite_rules:
  - id: github-blowfish-ecb-decrypt
    desc: Blowfish-ECB decrypts GitHub raw payload
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/forge::github-raw-url
      - id: micro-behaviors/crypto/symmetric/blowfish::blowfish-ecb-mode
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
      - id: micro-behaviors/crypto/symmetric/blowfish::blowfish-import
      - id: micro-behaviors/data/encode/base64::import-base64

  - id: github-json-blowfish-c2-resolver
    desc: GitHub JSON dead-drop resolves C2 via Blowfish
    crit: hostile
    conf: 0.97
    all:
      - id: github-blowfish-ecb-decrypt
      - id: raw-github-json-path
    any:
      - id: micro-behaviors/data/serialize/json::json-loads-call
      - id: micro-behaviors/communications/http/client/library::urllib-request
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-assignment
