defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  attack: T1102,T1027
  crit: suspicious
composite_rules:
- id: github-blowfish-ecb-decrypt
  desc: Blowfish-ECB decrypts GitHub raw payload
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/url/forge::github-raw-url
  - id: micro-behaviors/crypto/symmetric/blowfish::blowfish-ecb-mode
  any:
  - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
  - id: micro-behaviors/crypto/symmetric/blowfish::blowfish-import
  - id: metadata/import/builtin::python-base64-import
- id: github-json-blowfish-c2-resolver
  desc: GitHub JSON dead-drop resolves C2 via Blowfish
  crit: hostile
  conf: 0.97
  all:
  - id: github-blowfish-ecb-decrypt
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-json
  any:
  - id: micro-behaviors/data/parse/json::json-loads-call
  - id: metadata/import/python/urllib/request
  - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-assignment
