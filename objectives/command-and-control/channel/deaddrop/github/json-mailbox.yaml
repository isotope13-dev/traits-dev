# GitHub repository contents used as a per-bot command mailbox: cmd.json for
# tasking, result.json for output, beacon.json for heartbeat. Scoped away from
# the JS/TS Controllers mailbox atoms so matcher types do not collide.
defaults:
  platforms: [windows, unix]
  for: [rust, python, go]
  attack: T1102.001
  mbc: C0002

# Bare cmd.json / beacon.json / result.json literals are neutral basename
# references in micro-behaviors/fs/path/basename; the composites below supply
# GitHub contents-API context that makes the trio a mailbox signature.

composite_rules:
  - id: github-cmd-result-beacon-mailbox
    desc: GitHub cmd/result/beacon JSON mailbox trio
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/basename::cmd-json-filename-reference
      - id: micro-behaviors/fs/path/basename::result-json-filename-reference
      - id: micro-behaviors/fs/path/basename::beacon-json-filename-reference
    near_bytes: 4096

  - id: github-contents-json-mailbox-c2
    desc: GitHub contents API drives JSON C2 mailbox
    crit: hostile
    conf: 0.98
    all:
      - id: github-cmd-result-beacon-mailbox
      - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
    near_bytes: 8192

  - id: github-mailbox-shell-tasking
    desc: GitHub JSON mailbox executes shell commands
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1059.003
    all:
      - id: github-contents-json-mailbox-c2
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
    near_bytes: 8192
